  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Segmentation: OEM consumer robotics, DGP startups, and institutional humanoid buyers'
        blocks:
          - type: paragraph
            body: >-
              D-Robotics' public customer record spans five distinct buyer surfaces rather than one clean enterprise
              ICP. The company's own About page frames its core commercial relationships as OEM partnerships across
              humanoid robots, companion robots, robotic vacuum cleaners, and robotic lawn mowers, and CEO Wang Cong
              told 36Kr that shipment volume today still relies on the mass-market categories -- vacuums, lawn mowers,
              and companion robots -- rather than on embodied intelligence or humanoid deals, which he frames as an
              earlier-stage, longer-horizon bet. Layered on top of that OEM base is the D-Robotics Gravity Program
              (DGP), an accelerator that the company says has supported more than 200 early-stage robotics companies and
              produced more than 100 robotic product categories; its own developer-portal API independently lists nine
              named cooperative partners spanning education robots, wearables, golf-caddy robots, and smart fitness. A
              third surface is institutional humanoid buyers such as the Beijing Innovation Center of Humanoid Robotics,
              which is jointly developing the Tiangong 3.0 humanoid around D-Robotics' Xuri S600 chip. A fourth surface
              is the 100,000-plus-developer global community that Yicai and D-Robotics' own myCobot blog post both cite,
              and a fifth is consumer drone and imaging partners such as the Insta360-backed Antigravity team. Each
              surface has a different buyer-user-payer logic: OEMs buy chips and pass cost through to end consumers, DGP
              members effectively pay with hardware purchases and equity/attention rather than cash, institutional
              humanoid buyers co-invest engineering time, and the developer community mostly consumes free or low-cost
              hardware without becoming a named commercial account. That breadth is strategically positive because it
              reduces dependence on any single robot category, but it also means 'customer' has to be parsed carefully:
              developer-case submissions on the community portal are overwhelmingly unpaid academic or maker projects,
              not commercial buyers, and D-Robotics' own 'millions of users worldwide' framing partly borrows scale from
              downstream OEM brands such as Narwal, whose independently reported 450 million users are Narwal's, not
              D-Robotics' own attributable accounts.
