      - number: '8.3'
        title: Financing context, entry discipline and term-sheet risk
        blocks:
          - type: paragraph
            body: >-
              The most defensible financing conclusion is clear but incomplete. D-Robotics has raised enough visible
              capital in 2026 to avoid looking underfunded in the near term, and that alone distinguishes it from many
              earlier private edge-AI vendors. At the same time, the public record still does not reveal the exact
              post-money valuation, preference structure, or downside protections in those rounds. That means investors
              are being asked to react to headline momentum without the protections needed to judge whether
              common-equity entry economics are actually attractive.


              This is where public comps become useful mainly as discipline tools. Ambarella and Horizon prove that
              investors eventually reward edge-AI platforms—but only after they accept filing-grade disclosure and
              public-market scrutiny. D-Robotics is not there yet. Entry discipline should therefore focus on round
              structure, burn-versus-runway, and whether the next raise is likely to happen from a position of proof or
              from a position of hope. Without those answers, the fair-value band is more useful than any single-point
              mark.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV015
              - CV017
              - CV018
              - CV032
              - CV033
      - number: '8.4'
        title: Bull, base and bear cases
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis works better than point estimates because D-Robotics is still disclosure-light. In the
              bear case, the company remains a promising technical platform but must raise again before revenue quality
              or export-chain resilience becomes convincing; that points to something closer to a sub-$1.1B outcome. In
              the base case, D-Robotics keeps converting ecosystem traction, maintains access to capital, and gradually
              improves monetization proof without fully escaping opacity; that supports roughly a $1.2-1.8B range. In
              the bull case, the company proves non-China production customers, shows real software or module
              monetization leverage, and reduces geopolitical discount; then a $2.2-3.0B range becomes more plausible.


              The important thing is not the exact decimal point. It is the path dependence. Today's value is driven
              more by future milestones than by current financial outputs. That means the fair stance can coexist with
              meaningful upside, as long as investors remain disciplined about what has to be true for the next band up
              to be earned.
            claimRefs:
