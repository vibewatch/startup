  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      D-Robotics' public customer journey runs from DGP discovery and RDK hardware trial to co-development, named
      launch, community evangelism, and only rarely to disclosed mass production or repeat purchase.
    data:
      items:
        - label: Discovery via DGP program or RDK marketing
          detail: >-
            Early-stage founders, hobbyists, or OEM engineers discover D-Robotics through the DGP accelerator call, RDK
            product blog posts, or developer-community outreach
          tone: neutral
        - label: RDK hardware trial
          detail: Prospective partners buy or receive discounted RDK X3/X5/S100 dev kits and prototype AI-robotics features
          tone: neutral
        - label: Co-development with D-Robotics engineering
          detail: >-
            Named partners such as Hengbot and the Beijing Innovation Center get joint technical support, from
            chip-architecture input on Tiangong 3.0 to end-to-end guidance for AI-GUIDED
          tone: positive
        - label: Public product launch
          detail: >-
            Co-branded launches such as Sirius on Kickstarter, myCobot 280 RDK X5, and the Antigravity A1 drone generate
            named, dated customer proof
          tone: positive
        - label: Community evangelism and content
          detail: >-
            Evangelists such as Frank Fu (NavBot), Michael Hart, and student developers create tutorials, livestreams,
            and competition entries that recruit the next cohort
          tone: neutral
        - label: Scale to mass production or repeat purchase
          detail: >-
            Only one deployment, Tiangong 3.0, has a disclosed mass-production date (H2 2026); most other relationships
            show no disclosed reorder or renewal signal
          tone: warning
    approximationNotes: >-
      This is a reconstructed commercialization path based on public blog posts, press coverage, and developer-portal
      data, not a vendor-published CRM funnel.
    claimRefs:
