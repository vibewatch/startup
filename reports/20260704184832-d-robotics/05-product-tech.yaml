- id: technical-risks
  title: Technical risks, trust gaps, and diligence asks
  body: 'The public adverse evidence is practical rather than existential. Recent forum topics show users still hit CAN FD problems, frame drops, GPIO contact issues, missing gdc-tool download links, and model-conversion precision questions. External tutorials remain necessary for first-time setup. These are normal for an active developer platform, but they matter because they reveal where integration cost still leaks back onto the customer. They also imply that D-Robotics’ product maturity is still partly mediated by community troubleshooting, not purely by turnkey UX.


    The bigger trust gap is disclosure completeness. The fetched sources do not expose formal uptime commitments, safety attestations, downloadable audit packs, or a clean benchmark sheet that an industrial buyer could plug into a vendor scorecard. D-Robotics looks strong for serious pilots and partner-led builds. It still needs deeper public proof on reliability, certification scope, and deterministic performance for production-scale technical diligence.'
