  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: Independent benchmark sheets for latency, throughput, and power on X5 and S100.
    whyItMatters: Without them, performance claims remain architecture-led rather than application-led.
    diligencePath: Request board-level benchmark pack and test methodology.
    relatedQuestionRefs:
