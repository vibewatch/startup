chapter:
  number: 5
  title: Product & Technology
  summary: 'D-Robotics presents a genuinely full-stack robotics platform in public 2026 sources: an RDK hardware ladder from entry-level RDK X3 (5 TOPS) and RDK X5 (10 TOPS) up through RDK S100 (CPU+BPU+MCU embodied control) to the announced, not-yet-shipping RDK S600 (560 TOPS, edge-cloud framing), wrapped by TogetheROS.Bot as the ROS2-oriented software layer, a NodeHub node/algorithm catalog cited at 100+ to 200+ open-source examples, an RDK Studio flashing/management workbench, and a BPU-centered model zoo for conversion, quantization, and inference workflows. The stack is technically specific enough to be credible—RDK X5 exposes broad I/O and Ubuntu support, while S100 claims a CPU+BPU+MCU split with BPU Nash at 80/128 TOPS and 160+ ONNX operators. GitHub, course feeds, partner feeds, and developer cases show real ecosystem activity. The main technical risks are not absence of product; they are disclosure gaps around benchmarks, enterprise support, validation, reliability, and confirmation that RDK S600 actually ships as announced. In short, D-Robotics looks strong for serious developer pilots and still incomplete for procurement-grade technical diligence.'
sections:
- id: portfolio-workflow
  title: Product portfolio and developer workflow
  body: 'D-Robotics’ public stack is broad enough to support a credible platform thesis rather than a single-board story. RDK X5 is presented as a robotics development kit with strong general-purpose I/O, Ubuntu 22.04 support, wired and wireless connectivity, and a familiar maker-to-prototyper workflow. RDK S100 is positioned higher in the stack as an embodied-intelligence compute-and-control platform, with explicit “big brain + small brain” language that pairs application compute with motion control. Around those hardware layers, D-Robotics exposes a robotics software manual, a public GitHub organization, a model zoo for BPU deployment, and training surfaces that help developers move from first boot to model execution.


    That creates a visible workflow: select hardware, flash and configure the board, use robotics middleware and examples, port or quantize models into BPU-compatible formats, and then integrate the board into a partner or self-built robot. It is a coherent developer journey, though still oriented toward builders who can tolerate setup work and community-driven troubleshooting.'
