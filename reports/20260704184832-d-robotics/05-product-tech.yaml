    - QE024
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: Formal support SLA, security bulletins, and compatibility matrices.
    whyItMatters: Institutional buyers need procurement-grade controls, not just community vitality.
    diligencePath: Request enterprise support policy and validation matrix.
