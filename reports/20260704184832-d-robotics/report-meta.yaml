companyProfile:
  summary: >-
    D-Robotics (地瓜机器人) is a Beijing-headquartered edge AI chip and robotics infrastructure company
    spun off from Horizon Robotics' AIoT division in January 2024. The company builds proprietary Brain
    Processing Units (BPU), RDK hardware developer kits (X5 at 10 TOPS; S100 at 80–128 TOPS), the
    TogetheROS.Bot robot operating system, and NodeHub, an open application marketplace. Its go-to-market
    strategy is a developer-ecosystem play: 100,000+ registered developers, 229 GitHub repositories,
    200+ open-source algorithms, and an OEM partnership program targeting humanoid robots, companion
    robots, and autonomous machinery. The company raised a $100M Series A in May 2025 and a combined
    $270M Series B (B1 + B2) in early 2026, with backers including Didi Global, Meituan Long-Z Fund,
    Prosperity7 Ventures, GL Ventures, Vertex Growth, and 5Y Capital. D-Robotics was listed as a newly
    added unicorn in the 2025 China unicorn observation report. Shipments rose approximately 180% YoY
    and the customer base grew roughly 200% in the latest reported period.
  foundedDate: '2024-01-01'
  founders:
    - name: Horizon Robotics (spin-out)
      role: Corporate parent (Dr. Yu Kai, founder of Horizon Robotics)
      background: Horizon Robotics was founded in 2015 by Dr. Yu Kai; D-Robotics spun out the AIoT division in January 2024 to focus on robotics-specific edge AI compute and developer ecosystem.
      claimRefs: [CO021, CO022, CO024]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    Core products span three layers: (1) Edge AI chips — BPU Nash architecture delivering 80–128 TOPS in
    the S100 platform and 10 TOPS in the X5, covering the 5–128 TOPS performance range; (2) Developer
    kits — RDK X5 and RDK S100 boards with Ubuntu 22.04, ROS2 compatibility, and multi-sensor IO;
    (3) Software stack — TogetheROS.Bot (ROS2-compatible RTOS with zero-copy communication and
    hardware-accelerated CV), NodeHub (open application hub), and a 200+ algorithm model zoo.
  customerFocus: >-
    Robot OEMs targeting humanoid, companion, service, and logistics robots; embedded AI system
    integrators; academic and startup developers building on the BPU developer platform.
  businessModel: >-
    Hardware sales (chips + developer kits), potential software licensing and cloud-developer services,
    and an ecosystem-revenue model from OEM design wins using BPU silicon in production robots.
  stage: Series B (B1 + B2 completed April 2026)
  fundingStatus: >-
    Series A: $100M (May 2025); Series B1: $120M (March 2026) from Didi Global, Meituan Long-Z Fund,
    BAIC Capital, Xilian Capital, and Joyoun; Series B2: $150M (April 2026) from Didi Global, Prosperity7
    Ventures, GL Ventures, Vertex Growth, and 5Y Capital. Total raised approximately $370M as of runDate.
  disclosureProfile: private-undisclosed
  claimRefs: [CO024, CO025, CO026, CO027, CI016, CI017, CI018, CI019]
summary:
  headline: >-
    D-Robotics has assembled credible developer ecosystem depth, post-Horizon engineering pedigree, and
    $370M in capital to pursue an edge-AI-chip platform play in robotics — but the unicorn valuation
    asks investors to price a revenue story that public evidence has not yet confirmed.
