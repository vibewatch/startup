- id: scenarios
  title: Bull, base and bear cases
  body: 'Scenario analysis works better than point estimates because D-Robotics is still disclosure-light. In the bear case, the company remains a promising technical platform but must raise again before revenue quality or export-chain resilience becomes convincing; that points to something closer to a sub-$1.1B outcome. In the base case, D-Robotics keeps converting ecosystem traction, maintains access to capital, and gradually improves monetization proof without fully escaping opacity; that supports roughly a $1.2-1.8B range. In the bull case, the company proves non-China production customers, shows real software or module monetization leverage, and reduces geopolitical discount; then a $2.2-3.0B range becomes more plausible.


    The important thing is not the exact decimal point. It is the path dependence. Today''s value is driven more by future milestones than by current financial outputs. That means the fair stance can coexist with meaningful upside, as long as investors remain disciplined about what has to be true for the next band up to be earned.'
