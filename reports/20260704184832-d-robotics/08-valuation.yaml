chapter:
  number: 8
  title: Valuation
  summary: D-Robotics should be treated as a fair-valued late-stage robotics-platform candidate rather than either a bargain hardware startup or a fully proven edge-AI leader. Public sources verify about $270M of 2026 B-round capital and directional unicorn status, but not a filing-grade current mark, revenue, margins, or runway. Compared with Kneron, D-Robotics clearly carries more capital and platform ambition; compared with Ambarella and public parent Horizon, it still lacks the disclosure and operating proof that justify a leader premium.
sections:
- id: thesis-antithesis
  title: Investment thesis and anti-thesis
  body: 'The positive valuation case for D-Robotics is easy to understand. Public sources show a real robotics platform rather than a one-off board project: the company sells compute kits, developer tooling, and ecosystem assets while riding two powerful narratives at once—edge AI and embodied robotics. The 2026 B1 and B2 raises also prove that investors are willing to fund that narrative with meaningful capital. If D-Robotics can translate this platform breadth into a durable software-and-hardware standard for AMRs or humanoid-adjacent robotics, today''s private mark could still look conservative in hindsight.


    The anti-thesis is that public evidence still looks more like an ecosystem story than a commercial machine. The reviewed file does not disclose revenue, margin, burn, or customer concentration. Public comps with real valuations—Ambarella and Horizon—also come with filing-grade transparency that D-Robotics does not offer today. Meanwhile, Yicai''s 2026 capital-cycle reporting warns that robotics and hard-tech valuations in China may already be running hot. The practical implication is that D-Robotics deserves a real platform premium over generic hardware startups, but that premium should be capped until disclosed economics catch up with the narrative.'
