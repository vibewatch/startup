- id: recommendation-and-price-discipline
  title: Recommendation, confidence and price discipline
  body: 'We rate D-Robotics track with medium confidence and a fair valuation stance. This is not a "bad company, avoid" conclusion. The company has enough product breadth, capital access, and robotics timing to stay on an active watchlist. But it is also not yet a clean "buy" because the price cannot be tied to public unit economics. That matters more in semis-and-systems than in pure software because product, support, and ecosystem investments scale together.


    Price discipline should therefore be milestone-based. Investors should be willing to pay more only after D-Robotics proves internationally relevant customer adoption, software monetization, and a cleaner disclosure base around burn and margin. Until then, fair is the balanced stance: cheap is too generous because a meaningful premium is already justified by platform scope and capital raised; stretched is too harsh because the company is still meaningfully smaller and less proven than the public platforms to which it might eventually aspire.'
  claimRefs:
  - CV016
