- id: comparables
  title: Comparable set and valuation context
  body: 'The comparable set argues for caution but not for dismissal. Ambarella is the cleanest functional public comp because it is a disclosed edge-AI chip company currently valued at about $3.43B. Horizon is the more strategic upper-bound anchor because it is the listed parent platform with materially larger scale and a current HK$68.2B market cap. Cambricon is the warning label inside the comp set: current public market data place it at extremely elevated levels, which makes it useful as a signal of AI-chip market enthusiasm but not as a conservative valuation template. Kneron is the cleaner private comparison point because it discloses funding history and operates in full-stack edge AI, but it remains earlier and smaller in visible capital raised than D-Robotics.


    Taken together, the comp set suggests that D-Robotics should trade above a simple early-stage hardware narrative but below a fully disclosed public edge-AI platform. That is exactly why fair is the right middle ground. The company has more substance than a hype-only startup, but not enough public proof to justify a leader multiple.'
