  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Exact post-money valuation, liquidation preferences, investor rights, and dilution structure for the 2026 rounds.
    whyItMatters: Without the term sheet, investors cannot tell whether the headline round momentum translates into attractive common-equity entry economics.
    diligencePath: Review signed financing documents and cap-table waterfall with counsel and finance leadership.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
    - TV004
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Named production customers, retention, gross margin, and customer concentration by geography and product line.
    whyItMatters: Those metrics determine whether the current fair band should move toward the bull case or collapse toward the bear case.
    diligencePath: Request full customer cohort, product-margin, and retention schedules from finance and GTM leads.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Cash on hand, monthly burn, board-approved operating plan, and next-financing triggers after the 2026 B rounds.
    whyItMatters: Valuation fairness changes materially depending on whether D-Robotics has years of runway or only quarters of flexibility.
    diligencePath: Obtain management accounts and the latest board operating plan.
    relatedQuestionRefs:
    - QV010
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: export-chain
    missingEvidence: A direct supplier and toolchain map that shows how export controls or vendor caution would propagate into product delivery.
    whyItMatters: Geopolitical discount cannot be calibrated cleanly without knowing which components, services, or foundries are actually mission critical.
    diligencePath: Request a product-by-product supply and tooling dependency matrix.
