- id: financing-context
  title: Financing context, entry discipline and term-sheet risk
  body: 'The most defensible financing conclusion is clear but incomplete. D-Robotics has raised enough visible capital in 2026 to avoid looking underfunded in the near term, and that alone distinguishes it from many earlier private edge-AI vendors. At the same time, the public record still does not reveal the exact post-money valuation, preference structure, or downside protections in those rounds. That means investors are being asked to react to headline momentum without the protections needed to judge whether common-equity entry economics are actually attractive.


    This is where public comps become useful mainly as discipline tools. Ambarella and Horizon prove that investors eventually reward edge-AI platforms—but only after they accept filing-grade disclosure and public-market scrutiny. D-Robotics is not there yet. Entry discipline should therefore focus on round structure, burn-versus-runway, and whether the next raise is likely to happen from a position of proof or from a position of hope. Without those answers, the fair-value band is more useful than any single-point mark.'
  claimRefs:
  - CV001
