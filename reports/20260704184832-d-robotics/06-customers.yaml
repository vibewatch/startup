chapter:
  number: 6
  title: Customers
  summary: 'D-Robotics'' public customer record is broad but evidence-graded: two co-branded consumer products (Hengbot''s Sirius, Elephant Robotics'' myCobot 280) carry the strongest, most independently corroborated proof; Narwal''s Xiaoyao 002 and Insta360''s Antigravity A1 are named by 36Kr/KrASIA and independent press but not by the buyers'' own marketing; a Vbot quadruped relationship rests on a single source; and the Beijing Innovation Center''s Tiangong 3.0 humanoid is the chapter''s most consequential 2026 development, with mass production planned for H2 2026 but zero delivered units to date. A 200+-company DGP accelerator and 100,000-plus developer community show a large top-of-funnel, but no source discloses retention, renewal, or customer-concentration metrics, leaving the durability of D-Robotics'' reported 180% shipment growth and 200% customer-base growth unverifiable at the account level.'
sections:
- id: segmentation-oem-dgp-and-institutional-buyers
  title: 'Segmentation: OEM consumer robotics, DGP startups, and institutional humanoid buyers'
  body: 'D-Robotics'' public customer record spans five distinct buyer surfaces rather than one clean enterprise ICP. The company''s own About page frames its core commercial relationships as OEM partnerships across humanoid robots, companion robots, robotic vacuum cleaners, and robotic lawn mowers, and CEO Wang Cong told 36Kr that shipment volume today still relies on the mass-market categories -- vacuums, lawn mowers, and companion robots -- rather than on embodied intelligence or humanoid deals, which he frames as an earlier-stage, longer-horizon bet. Layered on top of that OEM base is the D-Robotics Gravity Program (DGP), an accelerator that the company says has supported more than 200 early-stage robotics companies and produced more than 100 robotic product categories; its own developer-portal API independently lists nine named cooperative partners spanning education robots, wearables, golf-caddy robots, and smart fitness. A third surface is institutional humanoid buyers such as the Beijing Innovation Center of Humanoid Robotics, which is jointly developing the Tiangong 3.0 humanoid around D-Robotics'' Xuri S600 chip. A fourth surface is the 100,000-plus-developer global community that Yicai and D-Robotics'' own myCobot blog post both cite, and a fifth is consumer drone and imaging partners such as the Insta360-backed Antigravity team. Each surface has a different buyer-user-payer logic: OEMs buy chips and pass cost through to end consumers, DGP members effectively pay with hardware purchases and equity/attention rather than cash, institutional humanoid buyers co-invest engineering time, and the developer community mostly consumes free or low-cost hardware without becoming a named commercial account. That breadth is strategically positive because it reduces dependence on any single robot category, but it also means ''customer'' has to be parsed carefully: developer-case submissions on the community portal are overwhelmingly unpaid academic or maker projects, not commercial buyers, and D-Robotics'' own ''millions of users worldwide'' framing partly borrows scale from downstream OEM brands such as Narwal, whose independently reported 450 million users are Narwal''s, not D-Robotics'' own attributable accounts.'
