- id: retention-opacity-concentration-risk-and-adverse-signals
  title: Retention opacity, concentration risk, and adverse signals
  body: 'No official or independent 2026 source reviewed discloses net revenue retention, gross retention, renewal rates, or churn for any D-Robotics customer or partner segment, and no source discloses a customer-concentration metric such as the share of shipments or revenue tied to the largest named account. That opacity matters because D-Robotics'' own growth headline -- roughly 180% shipment growth and 200% customer-base growth, corroborated across KrASIA/36Kr and Yicai Global -- says nothing about whether that growth is broad-based across the roughly 60 named or reported supply-chain partners or concentrated in a handful of high-volume OEM categories such as robot vacuums. Independent sector commentary supplies the chapter''s clearest adverse signal: a China Biz Insider analysis of China''s embodied-AI unicorn cohort frames D-Robotics as ''attacking the problem from the silicon layer,'' a chip-level strategy that captures value regardless of which application-layer humanoid winner emerges, but the same analysis places most cohort companies -- D-Robotics included -- on 18-to-24-month cash runways with an expected industry reckoning between 2027 and 2028, and notes D-Robotics'' own April 2026 funding round valued it at roughly RMB 10.8 billion without disclosing customer-revenue concentration. Additional concentration risk comes from geography: essentially every named customer or partner discussed in this chapter -- Hengbot, Narwal, Vbot, and the Beijing Innovation Center -- sits inside China''s embodied-AI ecosystem, so domestic policy or export-control shifts could disproportionately affect the customer base even if the OEM-category mix stays diversified. Until D-Robotics or a named partner discloses retention, renewal, or concentration figures, the durability of the reported growth rate -- and the gap between a 200,000-developer top of funnel and a handful of independently corroborated commercial deployments -- remains the chapter''s central unresolved diligence question.'
