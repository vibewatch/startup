  rows:
  - - Hengbot (Sirius robotic dog)
    - Consumer companion robotics
    - RDK X3-powered AI head for a 1kg programmable robotic dog
    - 'Production/shipping: Kickstarter-funded, general availability targeted for Fall 2025, homepage shows live backer funding'
