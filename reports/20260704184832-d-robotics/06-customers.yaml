- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - DGP accelerator funnel (200+ startups claimed)
    - Funnel depends on D-Robotics' own hardware discounts and staff time; conversion to a paying customer is unverified
    - Could overstate perceived pipeline breadth without matching revenue
    - Request DGP-to-shipping-customer conversion metrics
  - - Consumer OEM diversification (vacuum, lawn mower, companion, drone)
    - CEO states shipment volume still relies on a handful of mass-market categories rather than embodied intelligence
    - If any one OEM category (e.g., robot vacuums) slows, chip shipment growth could stall
    - Request a per-category shipment mix
  - - Humanoid/embodied-intelligence optionality (Tiangong 3.0)
    - Pre-revenue, single named humanoid design win as of the run date
    - High strategic upside but zero delivered-unit proof; timeline risk if the H2 2026 target slips
    - Track Tiangong 3.0 delivery milestones against the H2 2026 target
  - - Global developer community (100,000+)
    - Community size is a leading indicator, not a concentration hedge, since most showcased developer-case submissions are unpaid academic or maker projects
    - Risk of overstating commercial breadth from community metrics
    - Request the share of community members who are paying RDK customers
  - - Geographic and regulatory concentration in China
    - Nearly all named customers and partners (Hengbot's manufacturing ties, Narwal, Vbot, the Beijing Innovation Center) sit inside China's embodied-AI ecosystem
    - Export-control or domestic-policy shifts could disproportionately affect the customer base
    - Request customer geographic revenue mix and export-exposure disclosure
  - - Single-source partner claims (Vbot)
    - At least one named partner (Vbot) rests on a single press mention with no independent corroboration
    - Overstates the true named-customer count if unverifiable relationships are included
    - Seek a second independent source or direct company confirmation for Vbot
  notes: Concentration risks are inferred from the same public sources used elsewhere in this chapter; none reflect a disclosed concentration percentage from D-Robotics itself.
