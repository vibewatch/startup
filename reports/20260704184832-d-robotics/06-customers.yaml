  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: customer-revenue-concentration
    missingEvidence: A per-customer or per-category breakdown of D-Robotics' shipment volume or revenue (e.g., what share is robot vacuums vs. lawn mowers vs. companion robots vs. humanoid/embodied deals).
    whyItMatters: Without a concentration breakdown, the reported 200% customer-base growth cannot be distinguished from a scenario where one or two OEM categories dominate shipment volume.
    diligencePath: Request a customer/category revenue or unit-shipment mix from D-Robotics management or from a lead investor's diligence memo.
    relatedQuestionRefs:
    - QU005
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: material
    topic: narwal-xiaoyao-002-attribution-gap
    missingEvidence: Direct confirmation from Narwal or D-Robotics engineering documentation identifying which Narwal SKU actually ships with D-Robotics silicon.
    whyItMatters: Narwal's own homepage does not name D-Robotics, so the Xiaoyao 002 chip relationship currently rests entirely on secondary 36Kr/KrASIA reporting rather than either company's own materials.
    diligencePath: Request a bill-of-materials or supplier confirmation letter from Narwal, or a named case study from D-Robotics analogous to the Hengbot Sirius post.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: blocking
    topic: retention-renewal-nrr-disclosure
    missingEvidence: Net revenue retention, gross revenue retention, renewal rate, or churn figures for any D-Robotics customer or partner segment.
    whyItMatters: No reviewed source discloses whether named OEM or DGP relationships are durable multi-year contracts or one-time design wins, which is central to valuing the customer base.
    diligencePath: Request cohort-level reorder and renewal data from D-Robotics for its top named OEM accounts.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: churn-complaint-failed-pilot-evidence
    missingEvidence: Any public record of a churned customer, a failed pilot, a product recall, or a customer complaint involving a named D-Robotics partner.
    whyItMatters: The absence of adverse customer evidence could reflect either a genuinely clean track record or simply the immaturity/opacity of public reporting on a private chip supplier; the diligence team cannot tell which from public sources alone.
    diligencePath: Request references or a churn log from D-Robotics, and monitor Chinese-language forums/regulatory filings for complaints tied to named partners.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: A complete, audited roster of every D-Robotics OEM and DGP customer/partner, beyond the seven rows independently confirmed here.
    whyItMatters: The named customer proof table is necessarily a sample of the strongest publicly documented cases; it should not be read as D-Robotics' full customer list.
    diligencePath: Request D-Robotics' internal customer/partner registry and cross-check it against the DGP cooperative-partner directory.
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: dgp-scale-figures-unaudited
    missingEvidence: An independently audited count of the '100+ robotic product categories' and '200+ early-stage robotics companies supported' figures D-Robotics attributes to its DGP program.
    whyItMatters: Both figures currently rest solely on D-Robotics' own blog post; an unaudited accelerator headline count can overstate the number of companies with an active, revenue-relevant relationship.
    diligencePath: Request the named DGP company roster and cross-reference against the developer-portal cooperative-partner API.
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: minor
    topic: vbot-single-source-risk
    missingEvidence: A second independent source, product page, or direct company confirmation for the reported D-Robotics/Vbot quadruped companion-robot partnership.
    whyItMatters: Because the Vbot relationship rests on a single press mention, including it uncritically in a named-customer count would overstate verified partner breadth.
    diligencePath: Search for a Vbot product page or press release naming D-Robotics, or request direct confirmation from D-Robotics.
    relatedTableRefs:
    - TU003
