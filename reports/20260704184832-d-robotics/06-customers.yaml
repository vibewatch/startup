    - D-Robotics' blog frames it as a flagship co-branded education and developer product
    - No unit-sales or revenue figures specific to the RDK X5 variant
  - - Narwal (Xiaoyao 002 robot vacuum)
    - Consumer home-cleaning robotics
    - D-Robotics supplies AI-powered stereo perception for obstacle detection
    - 'Production: Narwal is an independently scaled brand with 30+ countries and 450M+ users per its own site'
    - Adds AI-perception capability to a commercially mature vacuum line
    - Narwal's own homepage does not name D-Robotics; attribution rests on 36Kr/KrASIA reporting
  - - Antigravity / Insta360-backed team (Antigravity A1 drone)
    - Consumer drone / imaging
    - Sunrise 5 chip powers AI visual perception and obstacle avoidance in a 360-degree panoramic drone
    - 'Pre-launch/early production: trial sales planned Q4 2025, global launch targeted January 2026'
    - First D-Robotics commercial win in consumer drones per China Biz Insider
    - Insta360's own official product page never mentions D-Robotics or the chip
  - - Vbot (unnamed quadruped companion robot)
    - Consumer/industrial quadruped robotics
    - D-Robotics chip integration for a quadruped companion robot
    - 'Unclear: described only as ''working with'' in a single press mention'
    - Diversifies category exposure beyond the marquee co-branded launches
    - Single-source claim (36Kr/KrASIA); no independent corroboration or product page found
  - - Beijing Innovation Center of Humanoid Robotics (Tiangong 3.0)
    - Humanoid / embodied intelligence; industrial-commercial
    - Xuri/Sunrise S600 chip powers a full-size general-purpose humanoid
    - 'Pre-production: mass production and delivery planned for H2 2026'
    - Finished-machine cost projected to fall by more than 50% at scale per en.shuziqushi.com
    - Not yet in mass production as of the run date; no delivered-unit count
  - - DGP cooperative-partner cohort (Leju Robotics, AI Guided, Caddy Trek, FITURE, and others)
    - Mixed education, wearable, consumer, and fitness robotics
    - Nine named companies listed on D-Robotics' own developer-portal partner directory
    - 'Mixed: the directory does not disclose production vs. pilot status per partner'
    - Demonstrates ecosystem breadth beyond the marquee co-branded launches
    - Directory gives no shipment volume, revenue, or relationship-duration detail per company
  notes: Rows are ordered from the strongest, most independently corroborated public evidence (Hengbot, Elephant Robotics) to the weakest (Vbot); production/pilot status is inferred from the cited sources, not from a D-Robotics-disclosed customer registry.
