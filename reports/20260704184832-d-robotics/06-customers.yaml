  rows:
  - - Consumer OEM robotics (vacuum, lawn mower, companion)
    - OEM manufacturer buys chips/SDK; household end user uses the finished product
    - Embedded compute for autonomous cleaning, mowing, and companion robots
    - Named via Narwal's Xiaoyao 002 and Hengbot's Sirius; CEO states this is the near-term revenue base
    - Primary disclosed shipment-volume driver per company commentary
    - No per-OEM unit or revenue split disclosed
  - - DGP early-stage robotics startups
    - Startup founders join the accelerator; D-Robotics supplies hardware discounts and technical support
    - Incubation, prototyping, and product development on RDK boards
    - 200+ early-stage companies claimed by the DGP program; 9 named cooperative partners on the developer portal
    - Pipeline for future OEM/chip revenue and ecosystem lock-in
    - No public conversion rate from DGP member to paying, shipping customer
  - - Consumer drone / imaging partners
    - Insta360-backed Antigravity team buys and integrates the Sunrise 5 chip; end consumer buys the finished drone
    - AI-powered visual perception and obstacle avoidance in the Antigravity A1 360-degree drone
    - First commercial application in consumer drones per China Biz Insider; Insta360's own product page does not name D-Robotics
    - Expands total addressable market beyond ground robots into aerial imaging
    - Chip attribution rests on third-party reporting, not Insta360's own marketing
  - - Humanoid / embodied-intelligence institutions
    - Beijing Innovation Center of Humanoid Robotics co-designs and buys the Xuri S600 chip; industrial/commercial end users would use Tiangong 3.0
    - Full-size general-purpose humanoid for manufacturing, logistics, and complex 3D environments
    - Mass production and delivery planned for H2 2026 per Gasgoo and en.shuziqushi.com
    - Strategic proof of embodied-AI chip capability, but pre-revenue as of the run date
    - Mass-production timeline not yet realized; no delivered-unit count
  - - Global developer / maker community
    - Individual developers and students buy RDK kits or use a free tier; some become DGP evangelists
    - Education, hobbyist robotics, competitions, and open-source projects
    - 100,000+ developer community per Yicai and D-Robotics' own blog; dozens of showcased student projects
    - Funnel for future paying customers and community-generated content
    - Community size is not the same as commercial customer count
  - - Quadruped companion robots (industrial/consumer)
    - Vbot and similar OEMs buy chips for companion quadrupeds
    - AI-driven quadruped companion robots
    - Named only in a single 36Kr/KrASIA reference as of the run date
    - Diversifies category exposure beyond vacuum, lawn mower, and drone
    - Single-source claim with no independent corroboration found
  notes: Segments are ordered from strongest to weakest public proof; 'gap' captures what a diligence team cannot yet verify from public sources.
