  evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A directly reviewed primary or high-reputation secondary source disclosing D-Robotics' post-money valuation or pricing mechanics for the 2026 rounds.
    whyItMatters: The user brief cites roughly a $1.5 billion valuation, but the reviewed public file did not directly support that figure.
    diligencePath: Request the latest term sheet summary, investor deck, or management-confirmed cap-table summary covering B1 and B2.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Revenue, gross margin, and the split between chip sales, developer kits, and software or SDK licensing.
    whyItMatters: Without revenue quality and mix, it is impossible to assess whether the company behaves more like a hardware vendor, a platform company, or a subsidized ecosystem builder.
    diligencePath: Ask management for trailing twelve month revenue, channel mix, software attach rates, and customer concentration by product family.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, ownership summary, and any investor control or protective rights.
    whyItMatters: Governance opacity limits confidence in decision control, related-party exposure, and refresh dynamics after rapid funding rounds.
    diligencePath: Obtain corporate registration documents, shareholder agreements, and the latest board observer or board seat list.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters
