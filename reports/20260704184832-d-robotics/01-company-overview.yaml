- id: capital-formation-and-verified-milestones
  title: Capital Formation, Spinout Economics, and Verified Milestones
  body: 'The clearest third-party evidence in the file concerns the 2026 financing sequence. Yicai and CXO Digitalpulse both report a $120 million Series B1 followed by a $150 million Series B2, bringing Series B financing to about $270 million. Yicai also discloses a more granular investor list than the official English site, naming Didi Global, Prosperity7 Ventures, GL Ventures, Vertex Growth, and 5Y Capital in B2, and Didi Global, Meituan Long-Z Fund, BAIC Capital, Xilian Capital, and Joyoung Family Office in B1. This makes the capital story real, but still incomplete. The user brief''s roughly $1.5 billion valuation and 200,000-plus developer figure were not directly supported by the reviewed sources, so they should not be treated as verified headline facts yet. Public milestone evidence is otherwise healthy: the 2024 spinout, January 2026 Japanese retail availability for RDK S100, March 2026 external adoption of the RDK X5 in third-party hardware, and visible 2026 event cadence at embedded
    world and ICML all show a company moving quickly from spinout identity into ecosystem-building and channel expansion.'
