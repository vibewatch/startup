- id: leadership-lineage-and-ecosystem
  title: Leadership Lineage, Developer Surface, and Channel Presence
  body: The public file is stronger on lineage than on formal governance. D-Robotics does not expose a full leadership page or board roster on the English site, but its relationship to Horizon Robotics is strongly evidenced by independent reporting and by the technological continuity visible in the Nash BPU branding. Horizon's own English about page identifies Dr. Yu Kai as founder and CEO, and Yicai describes D-Robotics as a January 2024 spinout from Horizon's AIoT division. The developer footprint is easier to verify. GitHub shows a large public organization with hundreds of repositories and explicit RDK OS, model-zoo, camera, and robot-stack projects. The docs around TogetheROS.Bot and NodeHub suggest D-Robotics is building for ecosystem developers and OEM partners, not just internal reference designs. LinkedIn adds a moderate workforce signal with a 51-200 employee band and a few thousand followers, while public community surfaces on Discord, YouTube, and the community page show ongoing
    recruitment of evangelists, makers, and startup builders. Those signals do not prove market dominance, but they do show a deliberate international developer go-to-market motion.
