company:
  name: D-Robotics
chapter:
  number: 1
  title: Company Overview
  summary: 'D-Robotics presents a credible public story as a post-Horizon robotics infrastructure spinout that combines edge AI chips, robotics developer kits, middleware, and ecosystem tooling. Reviewed sources confirm the January 2024 spinout lineage, a two-step 2026 Series B totaling about $270 million, active international developer outreach, and a hardware stack anchored by the RDK X5 and BPU Nash-based RDK S100. Public evidence also shows a substantial open-source surface and external partner adoption. The main diligence problem is not lack of momentum but uneven disclosure: valuation, revenue mix, governance, and even headquarters details remain partially opaque, while higher ecosystem-scale claims above 100,000 users were not directly verified by reviewed sources.'
sections:
- id: identity-and-product-scope
  title: Identity, Product Scope, and Robotics Stack
  body: 'D-Robotics presents itself as a robotics infrastructure company rather than a single-board vendor. Its current English homepage and product pages tie together developer hardware, an operating-system or middleware layer, application examples, and deployment tooling under the RDK umbrella. The public hardware story is clear even if naming is still evolving: the company markets RDK X5 as a 10 TOPS robotics and edge-intelligence board, while RDK S100 is framed as a higher-end embodied-intelligence platform built around BPU Nash and a CPU+BPU+MCU split for perception, decision, and control. The software layer is also more substantial than a typical device-maker support page. TogetheROS.Bot, NodeHub, RDK Studio, and the public documentation repo show that D-Robotics is trying to own the developer workflow from model adaptation through sensor integration and ROS2-based robot application development. That mix is consistent with the company''s public positioning as a low-power edge-inference
    alternative to bulkier general-purpose GPU stacks for smaller robot form factors.'
