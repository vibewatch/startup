- id: risk-signals-and-disclosure-gaps
  title: Risk Signals and Disclosure Gaps
  body: The biggest diligence problem is not absence of activity; it is uneven disclosure. Public evidence confirms a substantial 2026 fundraising step-up and a credible product stack, but it still leaves material blind spots around revenue composition, software licensing economics, board control, and the exact headquarters or legal-entity footprint. Independent reporting also shows that the broader robotics capital market is getting hotter and more distorted. Yicai's April 2026 private-equity analysis says capital is flooding hard-tech categories such as robotics even as some investors warn that valuations may already be at cyclical peaks and that access to hot rounds can require unusual next-round commitments or deposits. That does not imply a D-Robotics-specific problem, but it does mean the company is scaling inside a market where financing terms can move faster than fundamentals. The practical implication is that investors should treat product and ecosystem traction as real, while reserving
    judgment on valuation fairness, revenue quality, and governance until management provides a cleaner primary data room.
  claimRefs:
