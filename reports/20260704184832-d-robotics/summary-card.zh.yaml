summary:
  headline: D-Robotics 已拼出可信的开发者生态深度、继承 Horizon 的工程基因，并拿到 $370M 资本，押注机器人边缘 AI 芯片平台；但独角兽估值要求投资人先为尚未被公开证据证实的收入故事定价。
