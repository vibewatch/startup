  topStrengths:
    - 自研 BPU Nash 架构（S100 为 80–128 TOPS）让机器人可在端侧推理，不必依赖 NVIDIA 或 Qualcomm，同时带来差异化和利润率潜力。
    - Horizon Robotics 背景给拆分团队带来 IP 深度、成熟 BPU 芯片经验和大规模工程人才池。
    - 100,000+ 注册开发者、229 个 GitHub 仓库和 200+ 开源算法组成开发者生态，为 OEM 设计选型沉淀真实切换成本护城河。
    - 出货量同比 +180%、客户数 +200%，在收入数字披露前已显示真实商业牵引力。
    - Didi、Meituan、Prosperity7、GL Ventures 等强机构背书验证平台逻辑，也降低近期融资风险。
  topRisks:
    - NVIDIA Jetson（AGX Orin 最高 275 TOPS）、Qualcomm 机器人 SoC 和 Ambarella CV5 平台都是资金更充足的全球对手，且已拥有 OEM 关系和全球软件生态。
    - 收入、毛利率和烧钱速度完全未披露，投资人无法用具体财务指标承销 B 轮估值。
    - 中美出口管制收紧（BIS 2026 年 5 月指引）可能间接限制 D-Robotics 的芯片供应链、晶圆厂关系和国际客户触达。
    - 公司公开产品线仍主要面向开发套件和创客市场；能否大规模转化为量产 OEM 设计定点尚未确认。
    - Cambricon $125B 市值说明 AI 芯片倍数可以高度投机；若 D-Robotics 达成收入里程碑前市场情绪转向，估值风险会放大。
  unresolvedGaps:
    - 审计或管理层口径财务数据——收入、ARR、毛利率、烧钱速度和 B2 轮后的现金跑道。
    - 经确认的投后估值数字；独角兽标签来自二手 Baidu Baike 引用，而非一手投资人文件。
    - 具名 OEM 量产客户名单，用以确认 BPU 芯片已进入规模出货的商用机器人产品设计。
    - 晶圆厂、封装伙伴和供应链细节，用以评估出口管制暴露。
    - D-Robotics 拆分实体的管理团队姓名、背景和股权归属，需与 Horizon Robotics 母公司领导层分开披露。
