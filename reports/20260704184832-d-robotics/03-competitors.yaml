- id: switching-costs-distribution-and-substitutes
  title: Switching Costs, Distribution Power, and Substitutes
  body: 'Switching cost rises only after a robotics team has committed to a stack. Early in the buying motion, multi-homing is plausible because builders can mix ROS2 workflows, cloud tools, sensor vendors, and reference kits while keeping application logic portable. After that, costs rise around board I/O assumptions, accelerator-specific model tooling, middleware packages, debugging habits, and channel relationships. This dynamic benefits incumbents with broad global channels and known OEM credibility. NVIDIA has the clearest ecosystem gravity at the high end, while industrial suppliers such as Renesas and TI benefit from long-standing control, safety, and networking relationships. D-Robotics does have counterweights: an open GitHub surface, ROS-compatible middleware, developer examples, community onboarding, and at least some external channel proof through Japanese retail and third-party product adoption. But status-quo substitutes remain real. Infrastructure teams can solve part of the
    operating problem with Autopilot, Karpenter, or internal build paths, then avoid taking on a new dedicated platform vendor until robot volumes or latency demands force the issue.'
