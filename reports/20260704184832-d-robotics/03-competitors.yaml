- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Integrated chip + middleware + examples
    - SDK commoditization across rivals
    - High
    - Several competitors now pair AI silicon with toolchains and reference designs
    - Request customer win/loss reasons and attach-rate data for software layers
  - - Low-power robotics focus
    - Incumbent performance ceiling from NVIDIA
    - High
    - High-end humanoid buyers may anchor on Thor-class capability instead of smaller-form efficiency
    - Ask for benchmark data by workload, watt, latency, and BOM class
  - - Open developer surface
    - Production buyers still prefer incumbent channels
    - Medium
    - Open GitHub traction does not guarantee OEM conversion or support capacity
    - Review pipeline by prototype, pilot, and production stage
  - - Regional/channel expansion
    - Global distribution disadvantage
    - Medium
    - Partners and retail proof exist, but incumbent OEM channels remain stronger
    - Request signed channel, design-win, and geographic revenue mix data
  - - ROS-compatible integration
    - Internal build remains possible
    - Medium
    - Advanced teams can combine open-source infrastructure and mixed hardware stacks
    - Measure time-to-value and switching friction versus internal alternatives
  - - Public product momentum
    - Benchmark and pricing opacity
    - High
    - No clean public matrix proves D-Robotics wins on TCO or performance across workloads
    - Obtain pricing sheets, benchmark methodology, and customer references under NDA
  notes: Most risks are execution and proof risks rather than categorical evidence that the product is non-competitive.
