- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / offer
  - Public price or contract model
  - Included capability
  - Unknowns or discount caveats
  - Implication
  rows:
  - - D-Robotics RDK S100 Developer Kit
    - ¥102,300 retail in Japan
    - 80 TOPS BPU Nash board, robotics development focus, accessory ecosystem
    - Retail board price only; no public SDK licensing or production silicon pricing
    - Good entry proof for developers, weak evidence for production economics
  - - D-Robotics RDK X5
    - Not clearly disclosed in reviewed file
    - 10 TOPS robotics / edge AI kit with software ecosystem
    - No directly reviewed public price in this chapter file
    - Limits apples-to-apples entry-cost comparison
  - - Qualcomm RB5 Core / Vision Kit
    - $485 core; $695 vision kit
    - 15 TOPS robotics dev kit with Linux, Ubuntu, ROS 2, connectivity
    - Older reference-platform snapshot; production pricing not visible
    - Shows Qualcomm has historically competed with transparent dev-kit pricing
  - - Qualcomm RB3 Gen 2
    - Public kit packaging visible; reviewed source did not show a clean price excerpt
    - 12 TOPS QCS6490 platform with cameras and sensors
    - Current package pricing not established from reviewed file
    - Competitive at evaluation level but not enough for TCO underwriting
  - - NVIDIA Jetson Orin / Thor
    - Public product pages emphasize performance and partners more than price
    - Wide Jetson ladder from smaller Orin modules to Thor for humanoids
    - Pricing requires partner or channel lookup outside reviewed core pages
    - Distribution breadth may matter more than list price
  - - Status quo tools
    - Autopilot consumption pricing, Karpenter open source, FinOps toolkit open source
    - Infrastructure automation and cost controls without a dedicated robotics vendor
    - Does not cover robot-local compute and control layers
    - Substitutes are cheap to trial and can delay dedicated vendor adoption
  notes: The reviewed public file is much better at developer-kit pricing than at production module, SDK, or enterprise contract economics.
