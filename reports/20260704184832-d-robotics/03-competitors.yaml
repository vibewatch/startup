tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - D-Robotics
    - Direct stack vendor
    - 2026 Series B total about $270M; spinout disclosure still limited
    - AMR, humanoid, edge AI developers, robotics OEMs
    - Low-power BPU boards plus ROS-compatible middleware and developer tooling
    - Public benchmark, pricing, and governance disclosure remain limited
  - - NVIDIA Jetson
    - Incumbent physical-AI platform
    - Global incumbent with broad Jetson ladder and Thor roadmap
    - Humanoid, autonomous machines, high-end edge AI
    - Highest visible compute breadth and richest physical-AI software stack in reviewed set
    - May be overbuilt or power-hungry for smaller cost-sensitive robot programs
  - - Qualcomm Robotics RB line
    - Embedded reference platform rival
    - Long-lifecycle embedded platform lineage; public dev-kit pricing visible on RB5
    - AMR, drones, embedded robotics, IoT
    - Connectivity, ROS-friendly Linux support, compact reference-kit posture
    - Less obvious robotics ecosystem gravity than NVIDIA in reviewed public file
  - - Ambarella
    - Vision-centric low-power rival
    - Public AIoT and robotics SoC catalog
    - Consumer robots, AGVs, machine vision, logistics
    - Low-power CVflow computer vision and AI performance-per-watt emphasis
    - Narrower end-to-end robotics middleware story than D-Robotics or NVIDIA
  - - Renesas
    - Industrial robotics incumbent
    - Broad industrial robotics and humanoid solutions portfolio
    - Industrial, mobile, collaborative, household, humanoid robots
    - Vision AI plus motor control, safety, industrial networking, ROS 2 readiness
    - More subsystem- and industrial-stack-oriented than a single developer-kit narrative
  - - Texas Instruments
    - Subsystem and safety incumbent
    - Deep control and analog footprint; public humanoid thought leadership
    - Humanoid and industrial robot designers
    - Sensor fusion, deterministic communications, power, and motor-control depth
    - Not positioned in reviewed sources as a single robot-compute platform winner
  - - MediaTek Genio
    - Adjacent edge AI platform
    - Broad IoT edge platform with multiple partner devices
    - Smart devices, industrial HMI, productivity and safety systems
    - General-purpose edge AI modules that can undercut specialized platform needs
    - Less explicit robotics-native software stack in reviewed sources
  - - Status quo / internal build
    - Substitute
    - Existing cluster, cloud, and engineering budgets
    - Infrastructure teams and OEMs solving parts internally
    - Avoids vendor lock-in by combining Autopilot, Karpenter, FinOps tools, and custom integration
    - Does not solve robot-local compute, motion control, or robotics middleware by itself
  notes: Rows cover the most visible public alternatives across direct, incumbent, adjacent, and substitute classes rather than every robotics semiconductor vendor globally.
  enumerationScope:
    coverage: partial
    basis: The table prioritizes the most visible alternatives supported by direct public evidence in the reviewed file, not an exhaustive universe of all robotics compute vendors.
