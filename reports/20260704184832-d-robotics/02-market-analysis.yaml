    - Platform engineering, robotics R&D, OEM programs
    - Core market lens for D-Robotics
  - - Cloud FinOps / cloud cost optimization
    - Cost management, optimization, showback, accountability for compute estates
    - Generic corporate finance software and non-technical procurement tools
    - FinOps leaders, finance, infrastructure owners
    - Broad outer TAM envelope only
  - - Kubernetes cost management
    - Node provisioning, workload efficiency, cluster attribution, rightsizing
    - Non-container application monitoring and generic observability
    - Platform engineering and SRE
    - Closest software analog
  - - Embodied / humanoid / mobile robot compute
    - Perception, decision, control, low-power inference, local AI hardware
    - Robot operator services that do not buy infrastructure
    - Robotics engineering and AI infrastructure teams
    - High-growth adjacency directly relevant to D-Robotics
  - - Native cloud / open-source controls
    - Autopilot, Karpenter, bundled cost management, standard orchestration
    - Third-party dedicated robotics platforms
    - Existing cloud platform teams
    - Important substitute and budget sink
  notes: The table defines D-Robotics as infrastructure beneath robot applications; it intentionally excludes end-service robot revenue and generic enterprise software that lacks robotics or compute-optimization content.
