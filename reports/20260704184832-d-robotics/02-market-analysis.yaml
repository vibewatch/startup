- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary user
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  - Why D-Robotics can matter
  rows:
  - - Robotics prototyping / maker labs
    - Developers and robotics hobbyists
    - Innovation budget or founder budget
    - Prototype assembly, testing, edge inference experiments
    - Need an accessible robotics stack
    - RDK kits, examples, and community reduce setup friction
  - - Platform engineering / SRE
    - Cluster and infrastructure operators
    - Infrastructure engineering budget
    - Resource scheduling, utilization, node economics
    - Container cost or complexity becomes material
    - Optimization and control layers become budget-relevant
  - - FinOps / finance
    - FinOps practitioners and cloud-finance analysts
    - Central cloud or shared-services budget
    - Showback, forecasting, policy, accountability
    - Spend visibility and ownership gaps emerge
    - Hardware-efficiency and cost accountability become linked
  - - AI infrastructure / robot autonomy teams
    - Perception, planning, and autonomy engineers
    - Advanced R&D or AI platform budget
    - Sensor fusion, model deployment, runtime performance
    - Need low-power local inference
    - Purpose-built robotics compute can outperform generic stacks
  - - OEM / production robot program
    - Robotics product team and systems engineers
    - Program or product-line budget
    - Move from reference design to production deployment
    - Prototype proves ROI and reliability
    - Full stack matters more than a single chip spec
  notes: User and payer are often split roles; prototype-friendly developers can open the door, but scaled budgets usually sit with central infrastructure, AI platform, or OEM program owners.
