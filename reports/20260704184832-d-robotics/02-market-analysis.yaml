- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'The strongest growth driver is not one single robot form factor but the convergence of three problems: cloud-native complexity, rising demand for efficient inference, and the need for real-time safe control in physical systems. Renesas, Ambarella, TI, and MediaTek all highlight some combination of low power, vision AI, connectivity, or safety-ready motion control, which shows that the market is expanding because robots now need more local intelligence per watt. At the same time, several constraints limit how much of that opportunity a vendor like D-Robotics can capture. Native tools such as GKE Autopilot and Karpenter remove part of the third-party need. Platform suites such as OpenShift cost management provide visibility and showback inside existing environments. And the public source base still cannot isolate a China-specific edge-robotics SAM with precision. The result is a market with clear structural growth, but also with substitution risk, category-blur, and real measurement
    uncertainty.'
