chapter:
  number: 2
  title: Market Analysis
  summary: 'D-Robotics sells into an overlap market rather than one clean category. The reviewed public evidence supports a boundary that spans Kubernetes and cloud-efficiency software, robotics edge-compute hardware, and the middleware and development tooling needed to move robot programs from prototype to deployment. Public market reports show broad adjacent categories in the low tens of billions of dollars, but those figures are not directly interchangeable: the most relevant lens is much narrower than headline Cloud FinOps, while still larger than pure Kubernetes cost-management software because robotics adds local inference, control, and safety requirements. Growth is supported by cloud-native complexity, embodied-AI demand, and performance-per-watt constraints, but native substitutes such as Autopilot and Karpenter, plus category blur, limit how much of the outer TAM a vendor like D-Robotics can realistically capture.'
sections:
- id: market-boundary-and-adjacent-spend
  title: Market Boundary, Included Spend, and Adjacent Categories
  body: 'D-Robotics should not be analyzed as if it sells finished robots into one clean vertical. Its public surfaces show a robotics-development and edge-compute stack: developer hardware, embodied-robot compute platforms, middleware, and deployment tooling. That places it at the intersection of several spending pools. The broadest adjacent pool is Cloud FinOps and cloud-cost optimization, because buyers increasingly care about compute efficiency, workload placement, and business-value accountability. The narrower but more operationally similar pool is Kubernetes cost management and cluster-level automation, where node provisioning, cost attribution, and workload efficiency are already established line items. The robotics-specific layer sits on top of those abstractions: embodied robots, industrial robots, household robots, and mobile robots all require local perception, control, networking, and safety-aware compute. Therefore the relevant market includes edge AI silicon, robotics middleware,
    and developer infrastructure, while excluding generic ERP procurement software and end-user robot service revenue that does not directly purchase compute or development tooling. That boundary logic is essential because otherwise every robotics or cloud-compute statistic would look artificially addressable.'
