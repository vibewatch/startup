  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: China-specific robotics edge-compute TAM
    missingEvidence: A direct public source isolating the 2026 China market for robotics edge-compute platforms and middleware rather than broad robotics or cloud-cost categories.
    whyItMatters: Without a China-specific denominator, localized SAM and market-share claims remain speculative.
    diligencePath: Use Chinese-language analyst reports, customs/import data, and management pipeline disclosures to build a geography-specific TAM cut.
    relatedQuestionRefs:
    - QM019
  - type: missing-source
    severity: material
    topic: D-Robotics serviceable market sizing
    missingEvidence: Management or third-party disclosure showing what share of the company's opportunity comes from dev kits, software, or production robot programs.
    whyItMatters: The company's exact SAM depends on which layers of the robotics stack it can monetize at scale.
    diligencePath: Request pipeline segmentation by robot class, region, and software attach rate.
    relatedQuestionRefs:
    - QM005
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: budget-owner mix
    missingEvidence: Direct buyer interviews or win-loss data showing which function signs contracts most often.
    whyItMatters: Public docs describe users and stakeholders, but not the final economic owner in each deployment type.
    diligencePath: Interview current customers across prototype, OEM, and enterprise deployments.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: long-range humanoid projections
    missingEvidence: Nearer-term shipment or spending data that links headline 2050 narratives to concrete 2026 procurement behavior.
    whyItMatters: Very long-dated market forecasts can distort valuation logic if treated like near-term demand.
    diligencePath: Pair long-range market narratives with current BOM, pilot, and deployment data by robot class.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: minor
    topic: cross-category TAM comparability
    missingEvidence: A standardized taxonomy reconciling Cloud FinOps, Kubernetes cost management, and robotics edge-compute report boundaries.
    whyItMatters: Category blur is the core reason one-number TAM claims are unreliable for this company.
