  topStrengths:
    - >-
      Proprietary BPU Nash architecture (80–128 TOPS on S100) enables on-device robotics inference without reliance on
      NVIDIA or Qualcomm, providing both differentiation and margin potential.
    - >-
      Horizon Robotics parentage delivers IP depth, BPU silicon maturity, and a large engineering talent pool for the
      spin-off team to draw from.
    - >-
      Developer ecosystem with 100,000+ registered developers, 229 GitHub repos, and 200+ open-source algorithms creates
      genuine switching-cost moats for OEM design decisions.
    - >-
      Shipments +180% YoY and customer base +200% demonstrate real commercial traction before revenue figures are
      disclosed.
    - >-
      Strong institutional backing (Didi, Meituan, Prosperity7, GL Ventures) validates the platform thesis and reduces
      near-term financing risk.
  topRisks:
    - >-
      NVIDIA Jetson (up to 275 TOPS on AGX Orin), Qualcomm robotics SoCs, and Ambarella CV5 platforms are better-funded
      global rivals with established OEM relationships and global software ecosystems.
    - >-
      Revenue, gross margin, and burn remain entirely undisclosed, preventing investors from underwriting the B-round
      valuation against concrete financial metrics.
    - >-
      US-China export-control tightening (BIS May 2026 guidance) can indirectly constrain D-Robotics' chip supply chain,
      foundry relationships, and international customer access.
    - >-
      The company's public product line is still primarily developer-kit and maker-market-oriented; conversion to
      production OEM design wins at scale is unconfirmed.
    - >-
      Cambricon's $125B market cap demonstrates how speculative AI-chip multiples can be, creating valuation risk if
      market sentiment shifts before D-Robotics achieves revenue milestones.
  unresolvedGaps:
    - Audited or management-level financial data — revenue, ARR, gross margin, burn rate, and post-B2 cash runway.
    - >-
      Confirmed post-money valuation figure; the unicorn label is sourced from a secondary Baidu Baike citation rather
      than primary investor documents.
    - >-
      Named OEM production customer list confirming BPU silicon is designed into shipping commercial robot products at
      scale.
    - Foundry, packaging partner, and supply chain details that would allow assessment of export-control exposure.
    - >-
      Leadership team names, backgrounds, and equity ownership for the D-Robotics spin-off entity (separate from Horizon
      Robotics parent leadership).
