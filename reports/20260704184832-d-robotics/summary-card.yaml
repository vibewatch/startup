summary:
  headline: >-
    D-Robotics has assembled credible developer ecosystem depth, post-Horizon engineering pedigree, and $370M in capital
    to pursue an edge-AI-chip platform play in robotics — but the unicorn valuation asks investors to price a revenue
    story that public evidence has not yet confirmed.
