callouts:
  - calloutType: "insight"
    title: "The Shifting Center of Gravity: From Training Compute to Always-On Inference"
    body: "AI infrastructure spending is undergoing a structural transition as foundation models transition from pre-training development clusters to production deployment. Because user-facing tokens, agentic loops, and continuous enterprise reasoning operate as persistent workloads, inference capacity is emerging as always-on utility infrastructure governed by power budgets and token unit economics rather than peak theoretical FLOPS."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM011"
  - calloutType: "risk"
    title: "Power Availability and Memory Supply as Systemic Adoption Ceilings"
    body: "While market demand for tokens is compounding, datacenter physical constraints create immediate friction. Data center operators face hard regional grid power interconnection limits and high thermal dissipation requirements for dense GPU racks. Simultaneously, extreme industry concentration in HBM packaging restricts competing accelerator availability, creating an opening for alternative commodity LPDDR architectures while imposing strict air-cooled power limits."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM010"
