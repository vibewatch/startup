  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current GPU Workflow
      - Positron Solution
      - Measurable Benefit
      - Limitation / Trade-off
    rows:
      - - Autoregressive LLM Token Generation
        - Nvidia H100/H200 DGX servers running Triton / vLLM
        - Positron Atlas 8-card server with memory-first decode engine
        - 280 tokens/sec at 2,000W (approx. 3x lower latency vs H100)
        - Focuses primarily on transformer decode phase rather than training
      - - Power-Constrained Enterprise Data Center Hosting
        - 10 kW rack limited to 1x DGX server burning 6,000W
        - Positron Atlas consuming 2,000W per 4U server
        - Up to 5 Atlas servers per 10 kW rack; no liquid cooling retrofits
        - Pre-2020 facility airflow management must still maintain standard CFM
      - - Open-Source Transformer Model Deployment
        - Complex CUDA compile pipelines and customized model kernels
        - Direct drag-and-drop ingestion of Hugging Face .pt / SafeTensors
        - Initial cluster setup in 38 minutes; drop-in OpenAI REST API
        - Non-transformer model architectures not currently accelerated
      - - Low-Latency Financial Signal Inference
        - Multi-GPU clusters with complex inter-card communications
        - Dedicated Atlas FPGA servers with low-latency memory pipelines
        - Roughly 3x lower end-to-end latency validated by Jump Trading
        - Production validation limited to specific customer-evaluated models
    notes: Workflow benefits and power consumption comparisons are derived from company demonstrations and initial customer evaluations; performance varies across model architectures and batch sizes.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE008
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Role & Functional Scope
      - Key Technical Dependency
      - Primary Risk / Challenge
    rows:
      - - Silicon & Memory Subsystem
        - Commodity LPDDR5X memory channels providing high capacity and practical bandwidth
        - LPDDR5X memory suppliers (Micron, Samsung) and memory PHYs
        - Lower peak theoretical bandwidth than HBM if prefill compute dominates
      - - Accelerator Board Hardware
        - Programmed FPGA acceleration cards manufactured by BittWare
        - Intel foundry / Altera FPGA component supply chains
        - Higher unit production cost and board area relative to volume ASICs
      - - System Chassis & Interconnect
        - 4U rackmount server chassis with air cooling and PCIe Gen6 / CXL support
        - Standard enterprise data center power and air distribution
        - Ensuring adequate air cooling across high-density 400W ASIC modules
      - - Software & Integration Layer
        - OpenAI-compatible API gateway and Hugging Face transformer weight ingestion
        - vLLM and Hugging Face open-source software ecosystem alignment
        - Maintaining zero-overhead compatibility as transformer kernel architectures evolve
    notes: Component roles and dependencies reflect published system architecture disclosures and partner announcements. Silicon dependencies transition from Intel FPGA to TSMC ASIC in next generation.
