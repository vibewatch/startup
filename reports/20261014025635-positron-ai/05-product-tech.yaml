    data:
      layers:
        - label: Client & Application Interface
          detail: OpenAI-compatible REST API endpoints and drop-in integration with enterprise LLM orchestration frameworks and client SDKs
        - label: Software Runtime & Model Loading
          detail: Direct ingestion of Hugging Face SafeTensors and PyTorch (.pt) weights without proprietary compiler re-training or custom CUDA code
        - label: Interconnect & System Fabric
          detail: High-throughput PCIe Gen6 x32 bus and CXL support enabling low-latency multi-accelerator data sharing and host memory expansion
        - label: Server Chassis & Power Subsystem
          detail: 4U rackmount enterprise server architecture drawing 2,000W at full inference load, engineered for 10 kW standard data center racks
        - label: Accelerator Board & Memory Architecture
          detail: Eight modular accelerator cards with commodity LPDDR5X memory achieving 93% realized bandwidth utilization on autoregressive decode
        - label: Silicon Engine (Atlas FPGA & Asimov ASIC)
          detail: First-generation programmed silicon shipping today, transitioning to custom Asimov ASIC targeting 864 GB to 2,304 GB RAM per device
callouts:
  - calloutType: insight
    title: Memory-First Architecture Disruption
    body: By prioritizing realizable memory bandwidth via commodity LPDDR5X over peak theoretical FLOPS and costly HBM/CoWoS packaging, Positron achieves up to 93% memory bandwidth utilization on autoregressive transformer decode workloads while operating within standard air-cooled data center power envelopes.
    claimRefs:
      - CE003
      - CE009
      - CE011
  - calloutType: risk
    title: Tape-Out and Foundry Transition Execution Risks
    body: While Atlas relies on shipping Intel FPGA boards manufactured in the US, next-generation Asimov silicon depends on successful tape-out and a foundry transition to TSMC N3P, introducing potential schedule delays, NRE cost escalation, and fabrication allocation risks.
    claimRefs:
      - CE012
      - CE013
      - CE014
