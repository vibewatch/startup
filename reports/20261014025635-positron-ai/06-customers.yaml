figures:
  - id: FU001
    title: Customer acquisition, deployment onboarding, and hardware expansion journey
    type: journey-map
    summary: >-
      Six-stage lifecycle mapping how enterprise customers evaluate, pilot, deploy, and scale on Positron AI inference
      hardware.
    data:
      items:
        - label: Workload Profiling & Latency Evaluation
          stage: Workload Profiling & Latency Evaluation
          actor: Prospective Enterprise / Trading Customer
          touchpoints:
            - Remote benchmark testing against proprietary transformer models
            - Latency and throughput profiling vs baseline Nvidia H100 clusters
          friction: Customer skepticism regarding FPGA throughput and scaling claims
          outcome: Initial verification of 3x latency reduction and 150-200W power draw
        - label: Software Compatibility Verification
          stage: Software Compatibility Verification
          actor: Machine Learning Engineering Team
          touchpoints:
            - One-line URL change to OpenAI-compatible drop-in API endpoint
            - Direct mapping of HuggingFace Transformers Library models
          friction: Custom model architectures requiring operator-level kernel tuning
          outcome: Validation of zero-effort software migration in under 24 hours
        - label: On-Premise Pilot Appliance Bring-up
          stage: On-Premise Pilot Appliance Bring-up
          actor: Data Center Infrastructure & Facilities Team
          touchpoints:
            - Delivery of air-cooled Atlas FPGA-based accelerator boards
            - Installation into standard 7kW to 15kW enterprise server racks
          friction: Physical hardware lead times and initial cluster provisioning
          outcome: Full on-premises deployment operational within weeks rather than months
        - label: Lighthouse Production Deployment
          stage: Lighthouse Production Deployment
          actor: Lead Enterprise Customer (Jump Trading)
          touchpoints:
            - Execution of live low-latency trading inference workloads
            - Continuous monitoring of token generation reliability and power draw
          friction: CEO characterization of initial deployment as small test pilot
          outcome: Operational validation and purchase orders exceeding $38M historical burn
        - label: Neocloud & Hyperscaler Expansion
          stage: Neocloud & Hyperscaler Expansion
          actor: Cloud Infrastructure Providers (OCI, Parasail, i3d.net)
          touchpoints:
            - Deployment of 50+ Atlas racks within Oracle Cloud Infrastructure
            - Provisioning of multi-tenant token capacity for neocloud users
          friction: Private contract terms, margin sharing, and utilization opacity
          outcome: Broad commercial distribution without direct enterprise sales overhead
        - label: Roadmap Lock-in & Strategic Co-Development
          stage: Roadmap Lock-in & Strategic Co-Development
          actor: Strategic Investor-Customers (Jump Trading, QIA, Arm)
          touchpoints:
            - Participation as Series B co-lead investor ($230M round)
            - Technical input and early access to Asimov ASIC and Titan architecture
          friction: Long lead-time dependency on late 2026 Asimov tape-out
          outcome: High account stickiness and transition from customer to equity co-owner
    approximationNotes: >-
      Stages and touchpoints synthesized from executive interviews, customer case studies, and Series B/C investor
      disclosures.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU006
      - CU007
      - CU011
callouts:
  - calloutType: strength
    title: Strategic Customer-to-Investor Conversion Validates Technology
    body: >-
      Jump Trading's decision to co-lead Positron's $230 million Series B financing after evaluating Atlas hardware in
      its own trading environment represents an exceptionally strong commercial validation signal. Having verified 3x
      lower latency on production inference workloads, Jump Trading aligned its capital and compute roadmap with
      Positron, creating defensible account stickiness and deep algorithmic co-development.
    claimRefs:
      - CU002
      - CU006
  - calloutType: risk
    title: Commercial Durability Constrained by Pilot Scale and Opaque Retention
    body: >-
      Despite high-profile lighthouse validation, Positron's customer base exhibits extreme concentration. The Jump
      Trading engagement is officially characterized as a small test deployment, while broader production volume is
      confined to 50+ racks inside Oracle Cloud Infrastructure. Without audited net revenue retention, contract
      durations, or evidence of multi-million-dollar repeat hardware orders, long-term commercial durability remains an
      unverified diligence gap.
    claimRefs:
      - CU004
      - CU007
      - CU014
