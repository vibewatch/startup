chapter:
  number: 6
  title: Customers
  summary: >-
    Positron AI targets latency-critical financial trading firms, tier-2 cloud service providers, and large-context
    enterprise AI deployments, anchored by lighthouse customer Jump Trading and 50+ racks deployed at Oracle Cloud
    Infrastructure. While Jump Trading's transition from customer to Series B co-lead validates Atlas hardware
    performance in latency-bound trading inference, commercial traction remains early, with initial deployments
    characterized as small pilots and broader customer retention, contract duration, and concentration metrics
    undisclosed.
sections:
  - id: enterprise-and-infrastructure-buyer-segmentation
    title: Enterprise and Infrastructure Buyer Segmentation
    body: >-
      Positron AI's commercial go-to-market strategy addresses distinct classes of enterprise and infrastructure buyers
      constrained by power availability, memory bandwidth, and GPU procurement bottlenecks. The primary tier consists of
      algorithmic trading firms and proprietary quantitative market makers, exemplified by Jump Trading, where
      sub-millisecond token latency directly translates into trading execution advantages. These buyers prioritize
      memory-first architectures and air-cooled on-premises appliances that fit within strict co-location and data
      center power envelopes of 7kW to 15kW per rack. The second segment encompasses tier-2 cloud service providers and
      neocloud operators, such as Oracle Cloud Infrastructure (OCI) and decentralized inference networks like Parasail,
      who deploy Positron Atlas systems to expand multi-tenant token serving capacity without competing for scarce
      Nvidia H100 and H200 allocation. Finally, specialized compute hosters including gaming and edge network provider
      i3d.net represent an emerging hosting tier for dedicated inference workloads. Positron provides OpenAI-compatible
      API drop-in endpoints and native HuggingFace Transformers mapping to minimize migration friction across all three
      segments, although contractual revenue commitments across enterprise software accounts remain unverified.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-hardware-scaling
    title: Adoption Trajectory and Hardware Scaling
    body: >-
      Commercial adoption of Positron's first-generation Atlas hardware has advanced rapidly since the company's
      founding in spring 2023, progressing from an initial FPGA prototype to production cloud deployments in less than
      two years. The startup achieved initial multi-rack cluster shipments within 14 months of design initiation and
      expanded its footprint to exceed 50 production racks within Oracle Cloud Infrastructure data centers. In customer
      latency benchmarks on production transformer models, Atlas delivered 280 tokens per second on Llama 3.1 8B in a
      2,000W envelope, achieving roughly 3x lower end-to-end latency than comparable Nvidia H100 GPU baselines while
      drawing one-third the power. This performance profile enabled Positron to report customer purchase orders
      exceeding its cumulative historical spend of $38 million by early 2026. However, total production system volume
      across enterprise data centers remains heavily concentrated in cloud test environments, with broader fleet
      deployments dependent on the tape-out and commercial qualification of the upcoming Asimov ASIC platform in late
      2026 and early 2027.
    claimRefs:
      - CU002
      - CU004
      - CU009
      - CU010
      - CU013
    tableRefs:
      - TU002
  - id: named-customer-deployments-and-pilot-proof
    title: Named Customer Deployments and Pilot Proof
    body: >-
      Publicly verifiable proof of customer adoption is led by Jump Trading, which deployed Positron Atlas hardware
      on-premises to accelerate low-latency transformer inference workflows. Jump Trading CTO Alex Davies confirmed that
      testing yielded roughly 3x lower end-to-end latency compared to Nvidia H100 systems in an air-cooled footprint,
      validating Positron's memory-centric architectural premise. This evaluation prompted Jump Trading to transition
      from a pilot customer into a co-lead equity investor in Positron's $230 million Series B financing in February
      2026. Beyond Jump Trading, neocloud partner Parasail utilizes Positron capacity for distributed inference
      services, while gaming and infrastructure hoster i3d.net provides bare-metal deployment capacity. Nevertheless,
      Positron CEO Mitesh Agrawal acknowledged that the Jump Trading deployment remains a small test deployment rather
      than an enterprise-wide hardware replacement, and hardware analysts caution that FPGA-based acceleration carries
      inherent density handicaps that may limit scalability across generalized data center workloads.
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU003
  - id: retention-expansion-and-concentration-dynamics
    title: Retention, Customer Concentration, and Expansion Dynamics
    body: >-
      Positron's customer acquisition model relies on a low-friction evaluation funnel where customers test workloads
      remotely in a single day and achieve on-premises bring-up within several weeks. Expansion potential hinges on
      converting initial single-rack appliances and cloud cluster pilots into multi-system production contracts and
      joint development roadmaps. Jump Trading's progression from testing Atlas to co-leading venture financing and
      gaining architectural visibility into the future Asimov ASIC represents the ideal customer expansion loop. In
      September 2026, Positron announced $875 million in Series C and C-1 funding at a $5 billion post-money valuation
      to support this commercial scale-out. Despite these positive indicators, Positron discloses no contractual net
      revenue retention (NRR), gross revenue retention (GRR), or annual recurring revenue (ARR) metrics. Commercial
      durability faces substantial concentration risk, as the majority of documented hardware usage is tied to Jump
      Trading, OCI rack capacity, and a small cadre of early infrastructure partners.
    claimRefs:
      - CU006
      - CU011
      - CU012
      - CU014
    figureRefs:
      - FU001
