callouts:
  - calloutType: insight
    title: The Memory Bandwidth Inversion in Transformer Serving
    body: >-
      While legacy convolutional models rewarded massive raw FLOP scaling, generative transformer decoding is
      fundamentally memory-bound. Positron's bet on direct-attached LPDDR rather than scarce HBM targets this structural
      inefficiency, achieving reported 93% bandwidth utilization and sidestepping the CoWoS packaging bottlenecks that
      constrain incumbent GPU deliveries.
    claimRefs:
      - CP005
      - CP006
      - CP013
  - calloutType: risk
    title: Incumbent GPU Scale and Market Volatility Pressures
    body: >-
      Despite strong architectural efficiency arguments, Positron confronts formidable incumbent moats. Nvidia and AMD
      possess mature developer ecosystems and massive capital reserves, while the commercial volatility experienced by
      peers like Groq demonstrates that translating technical latency advantages into sustainable hardware revenue
      requires navigating rapid model shifts and customer procurement inertia.
    claimRefs:
      - CP001
      - CP003
      - CP012
