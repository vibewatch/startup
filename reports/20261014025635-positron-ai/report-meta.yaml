  topStrengths:
    - Real customer deployments at Oracle Cloud Infrastructure and named lighthouse validation.
    - Strong capital backing with the ability to fund the next silicon phase.
    - Differentiated memory-first architecture aimed at inference bottlenecks.
  topRisks:
    - Revenue, margin, and burn remain undisclosed, so underwriting is still opaque.
    - Asimov and Titan depend on high-risk custom silicon execution and foundry timing.
    - Customer and partner concentration is high, especially around OCI and early lighthouse accounts.
  unresolvedGaps:
    - Board-grade revenue, backlog, margin, burn, and customer-concentration data are still missing.
    - >-
      The current cap table, liquidation preferences, debt, information rights, and any secondary-market marks remain
      undisclosed.
    - >-
      Third-party benchmark replication and fuller customer case studies are needed to separate lighthouse proof from
      durable production adoption.
    - Foundry commitments, NRE burden, and unit economics for the Asimov and Titan ramp are not public.
    - Board composition and second-line leadership depth remain largely opaque.
