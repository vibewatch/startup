companyProfile:
  summary: >-
    Positron AI is a late-stage private semiconductor and AI infrastructure startup building memory-first inference
    hardware for large language model serving. The company shipped Atlas FPGA-based servers before moving to its custom
    Asimov ASIC and Titan system roadmap, giving it real rack-scale deployment proof while it works through the far
    harder custom-silicon phase. Positron has accumulated major strategic backing and lighthouse customer validation,
    but it still discloses little about realized revenue, gross margin, cap table terms, or commercial concentration.
