        - Re-underwrite after audited revenue and foundry agreements emerge.
      - - Risk Rating
        - high
        - Pre-tapeout schedule slip into 2H 2027; simulation-only performance claims
        - Track quarterly tapeout and bring-up milestones closely.
      - - Valuation Stance
        - stretched
        - $5B post-money valuation represents 4.7x expansion in 7 months without new tapeout
        - Entry multiple reflects peak hype pricing; seek downside protection or discounts.
    notes: >-
      Summary of investment stance synthesized from financing trajectory, customer deployments, and pre-silicon
      execution risks as of October 2026.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV013
  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter
      - Falsification Trigger
    rows:
      - - Architecture & Memory
        - Memory-first design sidesteps scarce HBM by using high-capacity LPDDR5X for LLM decode phases.
        - Peak bandwidth of LPDDR5X trails HBM stacks; GPU memory hierarchies may match decode economics.
        - Third-party benchmarks show GPUs matching Asimov tokens-per-watt on long-context models.
      - - Commercial Traction
        - 50+ Atlas racks deployed at Oracle Cloud Infrastructure with paying lighthouse customers.
        - Atlas uses Intel Agilex 7 FPGAs with HBM, not the custom Asimov LPDDR5X ASIC being priced.
        - Customer churn at OCI or failure to convert Atlas trials into Asimov volume reservations.
      - - Capital & Valuation
        - Raised $875M from top-tier institutional syndicate including NEA, Atreides, and sovereign wealth QIA.
        - Headline $5B mark quadrupled in seven months on identical architectural promises; heavy liquidation overhang.
        - Down-round or structured preference requirements in subsequent financing cycles.
      - - Silicon Execution
        - Fast 18-month execution cycle from founding to Atlas shipping demonstrates rapid iteration cadence.
        - Asimov tapeout target is end-2026 and volume production already slipped two quarters into 2H 2027.
        - Tapeout misses end-2026 window or initial silicon requires major design respins at TSMC.
    notes: >-
      Core investment arguments and counters evaluated against company disclosures, trade press, and independent
      critical reporting.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Outlook
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Asimov tapes out end-2026; achieves >90% bandwidth efficiency; ramps in 2H 2027 across hyperscaler clusters.
        - $15B+ enterprise value at IPO (3x return); multiples reflect Astera/Credo debut levels (35x-37x sales).
        - Nvidia Rubin software optimizations compress power advantage.
        - '20% probability: contingent on flawless TSMC N3P silicon bring-up.'
      - - Base Case
        - >-
          Atlas expands to 150+ racks at OCI; Asimov tapes out early 2027; initial silicon arrives late 2027 with minor
          respins.
        - $5B-$7B valuation range (1.0x-1.4x return); company raises bridge capital to fund commercial ramp.
        - Capital intensity requires additional dilutive equity before volume revenue.
        - '55% probability: typical semiconductor development and bring-up friction.'
      - - Bear Case
        - >-
          Asimov tapeout delayed to mid-2027; silicon bugs require costly metal respins; hyperscalers stay on HBM GPU
          roadmaps.
        - >-
          Down-round recapitalization at $1.5B-$2.5B (50%-70% haircut); Series C liquidation preference overhang wipes
          common.
        - Severe customer concentration and inability to compete with commodity GPU capacity.
        - '25% probability: high vulnerability to roadmap slips and multiple compression.'
    notes: >-
      Scenario framework modeling three-year holding outcomes based on Asimov tapeout timing, LPDDR5X adoption, and
      foundry ramp.
    claimRefs:
      - CV001
