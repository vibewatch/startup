callouts:
  - calloutType: insight
    title: Commercial Validation via Customer-Led Financing
    body: >-
      Jump Trading's progression from evaluating Atlas server hardware in production trading environments to co-leading
      the $230M Series B financing demonstrates tangible commercial traction. In contrast to venture-backed AI chip
      startups that struggle with software adoption barriers, customer participation as a lead financial sponsor signals
      real-world economic conviction in Positron's memory-first latency advantage.
    claimRefs:
      - CO007
      - CO009
  - calloutType: risk
    title: Severe Private Financial and Cap Table Opacity
    body: >-
      Despite raising over $305M in verified equity funding and announcing an $875M Series C round at a reported $5B
      valuation, Positron AI discloses no audited revenue, gross margins, cash burn rate, or customer contract backlog.
      Underwriting late-stage private rounds without audited unit economics exposes investors to severe valuation
      multiple compression if production ASIC tape-outs experience delays.
    claimRefs:
      - CO014
      - CO015
