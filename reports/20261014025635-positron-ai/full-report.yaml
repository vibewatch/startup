  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter
      - Falsification Trigger
    rows:
      - - Architecture & Memory
        - Memory-first design sidesteps scarce HBM by using high-capacity LPDDR5X for LLM decode phases.
        - Peak bandwidth of LPDDR5X trails HBM stacks; GPU memory hierarchies may match decode economics.
        - Third-party benchmarks show GPUs matching Asimov tokens-per-watt on long-context models.
      - - Commercial Traction
        - 50+ Atlas racks deployed at Oracle Cloud Infrastructure with paying lighthouse customers.
        - Atlas uses Intel Agilex 7 FPGAs with HBM, not the custom Asimov LPDDR5X ASIC being priced.
        - Customer churn at OCI or failure to convert Atlas trials into Asimov volume reservations.
      - - Capital & Valuation
        - Raised $875M from top-tier institutional syndicate including NEA, Atreides, and sovereign wealth QIA.
        - Headline $5B mark quadrupled in seven months on identical architectural promises; heavy liquidation overhang.
        - Down-round or structured preference requirements in subsequent financing cycles.
      - - Silicon Execution
        - Fast 18-month execution cycle from founding to Atlas shipping demonstrates rapid iteration cadence.
        - Asimov tapeout target is end-2026 and volume production already slipped two quarters into 2H 2027.
        - Tapeout misses end-2026 window or initial silicon requires major design respins at TSMC.
    notes: >-
      Core investment arguments and counters evaluated against company disclosures, trade press, and independent
      critical reporting.
