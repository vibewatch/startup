  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workload Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for artificial intelligence infrastructure has entered a structural divergence between model
              training clusters and production inference serving. While foundation model pre-training relies heavily on
              massive compute density and parallel tensor operations, inference workloads are fundamentally
              memory-bandwidth and latency constrained. Serving large language models, agentic workflows, and persistent
              multi-token context windows requires continuous memory access to feed model weights and key-value (KV)
              cache data. In this environment, the relevant addressable market for Positron AI consists of purpose-built
              transformer inference accelerators, specialized PCIe appliance servers, and memory-centric rack
              deployments. The boundary excludes general-purpose cloud CPUs, non-AI server motherboards, storage
              fabrics, and dedicated training supercomputers. Incumbent substitutes remain dominated by general-purpose
              GPU clusters, particularly Nvidia Hopper (H100/H200) and Blackwell platforms, alongside emerging cloud
              hyperscaler internal ASICs (Google TPU, AWS Trainium/Inferentia). However, standard GPUs operate at
              significant power premiums and suffer low realized memory bandwidth utilization during generative decode
              phases, creating a clear market opening for alternative memory-first architectures.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: TAM, SAM, and Sizing Lenses Across the AI Semiconductor Supercycle
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for specialized AI inference silicon requires disaggregating macro
              semiconductor spending into infrastructure-specific layers. Top-down industry estimates from IDC forecast
              total global semiconductor revenues to reach $1.29 trillion in 2026, marking a 52.8% year-over-year surge
              from $842.8 billion in 2025. This historic supercycle is anchored by enterprise and hyperscale datacenter
              expansion, with datacenter semiconductor revenues projected at $477.1 billion in 2026 and scaling toward
              $843.2 billion by 2030. Within this envelope, the non-memory intelligent datacenter segment—spanning CPUs,
              GPUs, AI accelerators, and custom ASICs—accounts for $281 billion in 2026. Hyperscaler capital
              expenditures are expected to increase 70% year over year to approximately $600 billion in 2026. While
              these figures confirm historic demand for AI hardware, public market sizing does not break out standalone
              inference accelerators from training GPUs. Analytical models estimate that dedicated inference silicon
              represents a rapidly expanding $35 billion subset of datacenter compute spend, though precise segmentation
              remains constrained by lack of dedicated vendor disclosures.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
