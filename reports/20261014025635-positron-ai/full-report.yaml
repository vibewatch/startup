      - number: '5.2'
        title: Inference Use Cases and Data Center Operational Economics
        blocks:
          - type: paragraph
            body: >-
              The core commercial use case for Positron hardware centers on autoregressive transformer decode
              operations, where traditional graphics processors experience significant performance degradation due to
              memory-bandwidth starvation. While general-purpose GPUs achieve substantial peak floating-point throughput
              during dense prefill and training phases, the token-by-token generation phase is heavily constrained by
              memory access speeds. On standardized benchmarks evaluating Meta's Llama 3.1 8B parameter model in BF16
              precision, an eight-card Atlas server achieves 280 tokens per second per user while consuming 2,000 watts
              of electrical power. In comparison, a reference Nvidia DGX system consumes approximately 5,900 watts while
              delivering 182 tokens per second under similar evaluation parameters. This differential creates material
              economic and operational advantages for data center operators managing power-constrained facilities. In
              legacy enterprise data centers where rack power is capped at 10 kilowatts, operators can accommodate up to
              five Atlas 4U appliances within a single rack, whereas power draw limits those same racks to hosting only
              a single high-density GPU server.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
