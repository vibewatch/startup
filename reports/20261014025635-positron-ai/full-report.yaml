      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Prudent Stance: Track Rather Than Underwrite Series C'
            body: >-
              Positron AI's $5 billion post-money valuation marks a 4.7x increase over its February 2026 valuation,
              pricing the company at frontier semiconductor multiples before tapeout of its flagship Asimov silicon.
              While 50+ Atlas racks at Oracle Cloud Infrastructure prove operating competence, Asimov's LPDDR5X
              architecture remains simulation-backed with volume production delayed to the second half of 2027.
              Investors should track progress rather than commit new capital at current marks.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
          - type: callout
            title: Silicon Execution and Pre-Tapeout Schedule Slippage
            body: >-
              Asimov silicon production has already slipped from early 2027 to the second half of 2027 prior to tapeout
              on TSMC N3P. In fabless semiconductors, pre-tapeout delays often compound during post-silicon bring-up and
              packaging validation, increasing cash burn and extending the window during which GPU architectures such as
              Nvidia Blackwell and Rubin can optimize inference software stacks.
            calloutType: risk
            claimRefs:
              - CV004
              - CV009
              - CV014
