      - number: '5.3'
        title: Memory-First Architecture and the Asimov Silicon Roadmap
        blocks:
          - type: paragraph
            body: >-
              Positron's architectural philosophy inverts conventional semiconductor design priorities by establishing
              memory capacity and realizable bandwidth as primary design constraints before sizing compute engines. The
              company asserts that modern generative inference workloads suffer from severe memory-bus underutilization,
              with conventional GPUs achieving less than 30% of theoretical memory bandwidth during real-world inference
              serving. Atlas counteracts this bottleneck through a specialized memory architecture that achieves
              approximately 93% realized bandwidth utilization on transformer inference. Furthermore, Positron avoids
              High Bandwidth Memory and chip-on-wafer-on-substrate packaging in favor of commodity LPDDR5X memory
              channels, significantly reducing bill-of-materials costs and avoiding fragile packaging supply lines.
              Building upon Atlas, Positron is developing Asimov, a custom ASIC targeting tape-out in late 2026. Asimov
              is engineered to deliver between 864 GB and 2,304 GB of RAM per device with 2.76 TB/s realizable bandwidth
              at a 400W thermal design power. Looking ahead to 2027, Positron plans to combine four Asimov ASICs into
              the Titan system, a 4U server delivering over 8 terabytes of accelerator memory and 11.8 TB/s of aggregate
              system bandwidth.
            claimRefs:
              - CE003
