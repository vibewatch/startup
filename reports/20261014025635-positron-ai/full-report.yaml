              Despite raising over $305M in verified equity funding and announcing an $875M Series C round at a reported
              $5B valuation, Positron AI discloses no audited revenue, gross margins, cash burn rate, or customer
              contract backlog. Underwriting late-stage private rounds without audited unit economics exposes investors
              to severe valuation multiple compression if production ASIC tape-outs experience delays.
            calloutType: risk
