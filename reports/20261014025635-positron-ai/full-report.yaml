          Atlas expands to 150+ racks at OCI; Asimov tapes out early 2027; initial silicon arrives late 2027 with minor
          respins.
        - $5B-$7B valuation range (1.0x-1.4x return); company raises bridge capital to fund commercial ramp.
        - Capital intensity requires additional dilutive equity before volume revenue.
        - '55% probability: typical semiconductor development and bring-up friction.'
      - - Bear Case
        - >-
          Asimov tapeout delayed to mid-2027; silicon bugs require costly metal respins; hyperscalers stay on HBM GPU
          roadmaps.
        - >-
