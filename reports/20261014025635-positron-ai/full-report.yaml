        title: Exhibits
        blocks:
          - type: callout
            title: Commercial Validation via Customer-Led Financing
            body: >-
              Jump Trading's progression from evaluating Atlas server hardware in production trading environments to
              co-leading the $230M Series B financing demonstrates tangible commercial traction. In contrast to
              venture-backed AI chip startups that struggle with software adoption barriers, customer participation as a
              lead financial sponsor signals real-world economic conviction in Positron's memory-first latency
              advantage.
            calloutType: insight
            claimRefs:
