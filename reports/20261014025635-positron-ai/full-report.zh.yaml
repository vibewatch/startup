      - number: '5.3'
        title: 内存优先架构与 Asimov 芯片路线图
        blocks:
          - type: paragraph
            body: >-
              Positron 的架构理念颠倒了传统半导体设计优先级：先将内存容量和可实现带宽设为主要设计约束，再确定计算引擎规模。公司认为，现代生成式推理工作负载存在严重的内存总线利用不足，传统 GPU
              在现实推理服务中的实际内存带宽利用率低于理论值的 30%。Atlas 通过专用内存架构抵消这一瓶颈，在 Transformer 推理中实现约 93% 的实际带宽利用率。此外，Positron
              放弃高带宽内存和晶圆上芯片上基板封装，转而采用商品化 LPDDR5X 内存通道，从而显著降低物料清单成本并避开脆弱的封装供应线。在 Atlas 基础上，Positron 正开发计划于 2026 年末流片的
              Asimov 定制 ASIC。Asimov 设计为每颗器件提供 864 GB 至 2,304 GB RAM，并在 400W 热设计功耗下实现 2.76 TB/s 可实现带宽。展望 2027 年，Positron
              计划将四颗 Asimov ASIC 组合成 Titan 系统；这是一台 4U 服务器，提供超过 8 TB 加速器内存和 11.8 TB/s 的聚合系统带宽。
