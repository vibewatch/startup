      - number: '3.3'
        title: TCO、定价与基础设施封装权衡
        blocks:
          - type: paragraph
            body: >-
              AI 推理的总拥有成本越来越由设施电力容量和散热开销决定，而不只是芯片标价。Nvidia Hopper 和 Blackwell 等现代高密度 GPU 平台需要 40kW 至 100kW
              以上的机架功耗范围，必须配备专用液冷歧管并改造设施，而普通企业数据中心无法提供这些条件。相比之下，Positron 将 Atlas 设备封装在传统 2kW
              服务器形态中，可无缝部署到标准风冷企业机架。客户及共同领投方 Jump Trading 记录显示，Atlas 在生产评估中的端到端延迟比 H100 服务器低约 3
              倍，突出了即插即用硬件和可靠供应链的商业优势。Positron 还通过选用商品化 LPDDR 内存，而非争夺受限的 HBM 和 CoWoS 先进封装产线，进一步降低供应风险。通过即插即用的 OpenAI
              兼容端点和直接导入 Hugging Face Transformer 权重，软件集成摩擦得到最小化，企业无需重写现有模型流水线即可迁移生产推理。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
