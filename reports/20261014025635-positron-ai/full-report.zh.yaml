      - number: '1.4'
        title: 执行速度与硬件路线图
        blocks:
          - type: paragraph
            body: >-
              对一家基础设施半导体初创公司而言，Positron AI 的执行速度非常快。公司从 2023 年 4 月成立，到 2023 年 12 月 NeurIPS 公开演示 LLaMA-2 7B，仅用约 8 个月；随后在
              18 个月内交付首台量产 Atlas 服务器，并于 2025 年初将完整机架配置部署到一线新型云环境。该迭代策略让 Positron 在投入大量资本进行定制 ASIC
              流片前，能够获得客户反馈、验证软件兼容性并降低供应链依赖风险。

              Positron 面向未来的企业估值核心在于第二代路线图，即定制 Asimov ASIC 和 Titan 系统架构。Asimov 计划于 2026 年末在 TSMC 先进节点流片，围绕商品化 LPDDR5X
              内存设计，每颗器件最多提供 2,304 GB 直接连接内存，从而避免采购昂贵的 HBM。四至八芯片 Titan 服务器旨在支持智能体工作流、超长上下文推理和万亿参数模型，目标于 2027
              年商用。能否成功推进芯片量产，仍是 Positron 能否持续挑战现有 GPU 主导地位的首要技术和商业决定因素。
