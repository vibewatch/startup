            body: >-
              Positron 硬件的核心商业用例是自回归 Transformer 解码操作；传统图形处理器在此类操作中因内存带宽不足而性能显著下降。通用 GPU 在密集预填充和训练阶段拥有较高峰值浮点吞吐量，但逐 token
              生成阶段高度受内存访问速度限制。在以 BF16 精度评估 Meta Llama 3.1 8B 参数模型的标准基准测试中，八卡 Atlas 服务器每位用户达到每秒 280 token，耗电 2,000
              瓦。相比之下，参考 Nvidia DGX 系统耗电约 5,900 瓦，在相似评估参数下每秒提供 182 token。这一差异为管理电力受限设施的数据中心运营商带来实质经济和运营优势。在机架功率上限为 10
              千瓦的传统企业数据中心中，运营商可以在单个机架内放置最多五台 Atlas 4U 设备，而功耗限制使同一机架只能容纳一台高密度 GPU 服务器。
