  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作负载范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              人工智能基础设施市场正在出现模型训练集群与生产推理服务之间的结构性分化。基础模型预训练高度依赖巨大的计算密度和并行张量运算，而推理工作负载从根本上受内存带宽和延迟约束。服务大语言模型、智能体工作流和持久的多
              token 上下文窗口，需要持续访问内存以供给模型权重和键值（KV）缓存数据。在这一环境下，Positron AI 的相关可寻址市场包括专用 Transformer 推理加速器、专用 PCIe
              设备服务器和以内存为中心的机架部署；不包括通用云 CPU、非 AI 服务器主板、存储网络及专用训练超级计算机。现有替代方案仍由通用 GPU 集群主导，尤其是 Nvidia Hopper（H100/H200）和
              Blackwell 平台，同时还有云超大规模厂商的内部 ASIC（Google TPU、AWS Trainium/Inferentia）。然而，标准 GPU
              的功耗溢价显著，并且在生成式解码阶段实际内存带宽利用率较低，为其他以内存为先的架构创造了明确的市场空间。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: AI 半导体超级周期中的 TAM、SAM 与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              要测算专用 AI 推理芯片的可寻址市场，需要把宏观半导体支出拆分为基础设施特定层级。IDC 的自上而下行业估计预测，2026 年全球半导体收入将达到 1.29 万亿美元，较 2025 年的 8428
              亿美元同比增长 52.8%。这一历史性超级周期由企业和超大规模数据中心扩张推动；数据中心半导体收入预计 2026 年为 4771 亿美元，到 2030 年增至约 8432 亿美元。在这一范围内，涵盖
              CPU、GPU、AI 加速器和定制 ASIC 的非内存智能数据中心细分市场，2026 年为 2810 亿美元。超大规模云厂商的资本支出预计 2026 年同比增长 70% 至约 6000 亿美元。虽然这些数字确认了
              AI 硬件的历史性需求，但公开市场规模数据并未将独立推理加速器与训练 GPU 分开。分析模型估计，专用推理芯片约占数据中心计算支出的 350
              亿美元，并且仍在快速扩大；不过，由于厂商缺乏专门披露，精确细分仍受限制。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
