            title: 严重的私营财务与股权结构表不透明
            body: >-
              尽管已确认股权融资超过 $305M，并宣布据报以 $5B 估值完成 $875M C 轮融资，Positron AI 仍未披露经审计收入、毛利率、现金消耗率或客户合同积压。若生产 ASIC
              流片延期，在缺乏经审计单位经济数据的情况下评估后期私募轮次，投资者将面临估值倍数大幅压缩的风险。
