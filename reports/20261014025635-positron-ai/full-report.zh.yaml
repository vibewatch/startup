      - number: '2.3'
        title: 买方细分、预算归属与采购触发因素
        blocks:
          - type: paragraph
            body: >-
              企业和云端采用专用推理芯片，受四类不同买方支配；每类都有不同的采购标准、决策者和预算归属结构。超大规模云服务商是最大批量买家，其动力来自数据中心电力容量上限，以及降低公共 API 托管每 token
              成本的迫切需求。新型云运营商和专用 AI 基础设施提供商是快速部署的切入点；Parasail 等公司购买专用加速器容量，以更优单位经济性提供有竞争力的推理 API。高频和量化交易公司构成早期高毛利客户层；Jump
              Trading
              等交易机构重视风冷服务器环境中的超低端到端延迟，并从客户部署走向共同领投股权融资，以此验证硬件能力。最后，私营企业数据中心运营商是长期商业机会，他们购买即插即用设备，在不向第三方多租户云暴露专有数据的情况下部署内部业务模型。所有细分市场的采购都从传统
              IT 预算转向战略性 AI 基础设施资本支出。
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
