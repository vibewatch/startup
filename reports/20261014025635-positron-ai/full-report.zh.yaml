            body: >-
              Jump Trading 先在生产交易环境中评估 Atlas 服务器硬件，随后共同领投 $230M B 轮融资，体现出切实的商业牵引力。许多风险投资支持的 AI
              芯片初创公司仍受软件采用壁垒拖累；客户直接担任主要金融投资方，则说明市场确实认可 Positron 以内存为先的低延迟优势。
            calloutType: insight
