      - number: '2.4'
        title: 采用驱动因素、功率瓶颈与结构性约束
        blocks:
          - type: paragraph
            body: >-
              下一代推理硬件的采用速度受到有吸引力的单位经济激励推动，但受到严重物理和供应链约束。需求侧上，生成式 token
              数量、推理模型和实时智能体交互的爆发式增长，造成对推理容量的无止境需求。然而，数据中心基础设施遭遇了刚性物理障碍：电网并网延迟、局部公用事业容量上限和散热限制，使许多设施升级液冷的成本过高。此外，全球半导体供应链受严重封装瓶颈限制，HBM
              和先进封装产能在 2026 年和 2027 年前大多已被 GPU 龙头预先锁定。Positron AI 选择将定制芯片与商品化 LPDDR5X 内存配对，直接应对这些约束，提供风冷功耗范围并绕开竞争激烈的 HBM
              封装产线。不过，客户惯性、成熟的 CUDA 软件生态，以及定制芯片流片所需多年时间（TSMC N3P 计划于 2026 年末）仍构成关键采用风险。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 重心转移：从训练计算到持续在线推理
            body: >-
              随着基础模型从预训练开发集群转向生产部署，AI 基础设施支出正在发生结构性转变。面向用户的
              token、智能体循环和持续的企业推理都是持久工作负载，因此推理容量正成为持续在线的公用型基础设施，其治理依据是功率预算和 token 单位经济性，而非理论峰值 FLOPS。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM011
          - type: callout
            title: 电力可用性和内存供应成为系统性采用上限
            body: >-
              尽管 token 市场需求不断复合增长，数据中心物理约束却造成即时摩擦。数据中心运营商面临地区电网并网的硬性限制，以及高密度 GPU 机架的高散热要求。与此同时，HBM
              封装的行业极度集中限制了竞争性加速器的可获得性，为替代性商品 LPDDR 架构创造了机会，但也对风冷功耗施加严格上限。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 替代架构与竞争格局
        blocks:
          - type: paragraph
            body: >-
              企业 AI 推理领域正因散热上限和内存约束而发生架构分化。生产模型服务在三类供应商之间激烈竞争。基础层面，Nvidia 和 AMD
              等根深蒂固的半导体厂商凭借庞大软件工具链和高带宽内存架构，主导公共云及企业私有集群的通用加速。然而，采购成本和功耗要求上升，催生了 Groq、Cerebras Systems、d-Matrix 和
              Positron AI 等专用推理初创公司，以及超大规模云厂商的专有加速器。Positron 的差异化在于直接向托管和云设施交付已出货的 Atlas 服务器设备，包括在 Oracle Cloud
              Infrastructure 超过 50 个服务器机架中的部署，生产客户包括 Parasail、Jump Trading 和 i3d.net。评估该格局不仅要看理论峰值
              FLOPS，还要分析生产交付覆盖、内存架构以及企业数据中心的部署摩擦。
