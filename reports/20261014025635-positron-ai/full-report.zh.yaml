        - Weaver 扇出齿轮箱 Chiplet 的唯一供应商
        - 单一来源（100%）
        - 封装延迟、芯片重掩膜或单位成本上涨
        - 高
        - 联合开发协议；兼容 LPDDR6 未来路线图
        - 高
      - - 主机 CPU 与架构 IP
        - Arm
        - 计算核心 IP 与生态对接
        - 高
        - 架构许可争议或版税率上升
        - 中
        - Arm 在 Series B 中进行战略性公司股权投资
        - 低
      - - 超大规模云部署
        - Oracle Cloud Infrastructure (OCI)
        - 主要云托管合作伙伴（50+ 个机架）
        - 高（云部署占比 >80%）
        - 推出缓慢、合同流失或偏好竞争硬件
        - 高
        - Jump Trading 与新云合作伙伴共同出资
        - 中
    notes: 梳理芯片制造、封装、IP 许可及主要云托管中的单点故障依赖。
