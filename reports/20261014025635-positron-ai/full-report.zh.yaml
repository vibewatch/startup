        blocks:
          - type: callout
            title: 审慎立场：跟踪，而非投资 Series C
            body: >-
              Positron AI 的 50 亿美元投后估值较 2026 年 2 月估值增长 4.7 倍；旗舰 Asimov 芯片尚未流片，公司就已获得前沿半导体倍数定价。Oracle Cloud
              Infrastructure 中的 50 多个 Atlas 机架证明了运营能力，但 Asimov 的 LPDDR5X 架构仍由模拟支持，量产已推迟到 2027
              年下半年。投资者应跟踪进展，而不是按当前估值投入新资本。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
          - type: callout
            title: 芯片执行与流片前排期延误
            body: >-
              Asimov 芯片量产在 TSMC N3P 流片前已从 2027 年初推迟到 2027 年下半年。无晶圆厂半导体项目中，流片前延误往往会在硅后回片和封装验证阶段继续叠加，增加现金消耗，也拉长 Nvidia
              Blackwell、Rubin 等 GPU 架构优化推理软件栈的窗口。
            calloutType: risk
            claimRefs:
              - CV004
              - CV009
              - CV014
