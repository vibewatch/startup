            body: >-
              评估 Positron AI，需要围绕芯片执行里程碑和晶圆厂爬坡计划，建模三种不同的三年情景。乐观情景下，Positron 在 2026 年底前完成 TSMC N3P 上的 Asimov 流片，2027
              年初回片时在实体芯片上确认模拟的内存带宽效率，并在 2027 年下半年实现 Titan 服务器量产。在这一路径下，超大规模云厂商将 Titan 作为 HBM 替代方案大规模部署，Positron
              有望以高倍数上市，企业价值超过 $15B。基准情景下，Atlas 硬件在 Oracle Cloud Infrastructure 内温和扩张，但 Asimov 流片推迟到 2027
              年初，回片过程遇到轻微摩擦，商业规模推迟到 2027 年末或 2028 年初；这会在需要过桥融资的情况下，使持有估值维持在约 $5B 至
