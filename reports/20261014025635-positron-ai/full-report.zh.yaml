              对 Positron AI 商业牵引力的评估，显示出实体部署指标与经审计财务表现之间的鲜明反差。实体部署上，Positron 取得了切实进展：在 Oracle Cloud Infrastructure 部署超过
              50 个服务器机架，并获得 Parasail、Jump Trading 和数据中心运营商 i3d.net 等具名生产客户。但在已披露的四轮股权融资——种子轮、A 轮、B 轮和 2026 年 9 月的 C
              轮——中，Positron 始终未披露经审计收入、GAAP 收入确认或年化经常性收入。第三方数据聚合商 Latka 估计 Positron 2025 年收入为 540 万美元，商业智能平台 Growjo 估计
              2026 年收入约为 760 万美元。与披露客户预订额超过 10 亿美元的竞争对手推理初创公司 Etched 相比，Positron
              既未确认这些收入估计，也未报告合同积压。对机构承销方而言，完全缺乏经验证的营收数据是首要尽调障碍，仅靠客户标志公告无法弥补。
