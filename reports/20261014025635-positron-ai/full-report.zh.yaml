              内存，刻意避开高带宽内存（HBM）供应限制，但针对多芯片封装和高速 SerDes 接口的贸易许可制度仍造成持续合规摩擦。私营公司身份限制了公司备案信息的公开披露，但 NEA、Valor Equity
              Partners 和 Jump Trading 等机构共同投资者要求严格的治理监督。
