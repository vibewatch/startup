      - number: '3.2'
        title: 现有 GPU 动态与直接加速器同业
        blocks:
          - type: paragraph
            body: >-
              传统 GPU 集群与专用推理加速器的直接比较，揭示了工作负载优化的根本差异。传统 GPU 优先处理适合模型训练的密集浮点运算，但现代自回归 Transformer
              解码主要受内存带宽和延迟瓶颈限制，而非算术吞吐量。Positron 声称，其出货中的 Atlas FPGA 设备内存带宽利用率最高达 93%，显著高于 GPU 架构在推理期间通常观察到的 10% 至
              30%，同时较 Nvidia H100 系统实现 3.5 倍的单位美元性能和最高 66% 的低功耗。SemiAnalysis
              研究确认，内存容量和吞吐量仍是下一代前沿智能扩展的决定性约束。面向定制芯片，Positron 将 Asimov ASIC 设计为每颗器件拥有 2,304 GB 直接连接 RAM，而 Nvidia 即将推出的
              Rubin GPU 预计为 384 GB，并以核心生成式工作负载每瓦 token 数提升 5 倍为目标。同业初创公司 Groq 采用片上 SRAM 来降低延迟，但每颗芯片可容纳的最大参数规模仍受到严重限制。
            claimRefs:
