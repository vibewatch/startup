              Positron AI 的估值轨迹在 2026 年大幅上升。2026 年 2 月，公司完成超额认购的 $230M Series B，投后估值超过 $1B；ARENA Private Wealth、Jump
              Trading 和 Unless 领投，主权财富基金 Qatar Investment Authority 与 Arm 参与。仅 7 个月后，即 2026 年 9 月 10 日，Positron 宣布一笔
              $875M 融资：其中 $375M Series C 的投前估值为 $3.5B，另有最高 $500M 的 Series C-1，最终形成名义 $5B 投后估值。这使估值在 7 个月内扩大约
