  - id: TV001
    title: 建议总结表
    columns:
      - 维度
      - 立场 / 评级
      - 关键证据
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - OCI 的 50+ 个 Atlas 机架证明了执行力，但 $5B 估值领先于流片
        - 不要为 Series C 做投资判断；等待实体芯片基准结果。
      - - 信心
        - 中
        - 融资与客户数据相互印证；收入和利润率不透明
        - 经审计收入及晶圆代工协议出现后重新评估。
      - - 风险评级
        - 高
        - 流片前进度滑至 2027 年下半年；性能主张仅来自仿真
        - 密切跟踪每季度的流片和芯片点亮里程碑。
      - - 估值立场
        - 偏高
        - 在没有新流片的情况下，$5B 投后估值 7 个月内扩大了 4.7 倍
        - 入场倍数反映了炒作高峰定价；寻求下行保护或折价。
    notes: 截至 2026 年 10 月，基于融资轨迹、客户部署及流片前执行风险综合得出的投资立场。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV013
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 支柱
      - 正论
      - 反论
      - 证伪触发条件
    rows:
      - - 架构与内存
        - 以内存优先的设计，在 LLM 解码阶段使用大容量 LPDDR5X，绕开稀缺的 HBM。
        - LPDDR5X 峰值带宽落后于 HBM 堆栈；GPU 内存层级可能达到相当的解码经济性。
        - 第三方基准显示，在长上下文模型上，GPU 的每瓦 token 数可追平 Asimov。
      - - 商业进展
        - Oracle Cloud Infrastructure 已部署 50+ 个 Atlas 机架，并拥有付费灯塔客户。
        - Atlas 使用带 HBM 的 Intel Agilex 7 FPGA，而不是正在定价的定制 Asimov LPDDR5X ASIC。
        - OCI 客户流失，或未能把 Atlas 试用转化为 Asimov 批量预订。
      - - 资本与估值
        - 从包括 NEA、Atreides 和主权财富基金 QIA 在内的顶级机构联合体筹得 $875M。
        - 在架构承诺没有变化的情况下，公开披露的 $5B 估值七个月内翻了四倍；清算优先权构成沉重压顶。
        - 后续融资周期出现降价轮或结构化优先权要求。
      - - 芯片执行
        - 从成立到 Atlas 出货仅 18 个月，体现出快速迭代节奏。
        - Asimov 目标在 2026 年底流片，量产已推迟两个季度至 2027 年下半年。
        - 流片错过 2026 年底窗口，或首批芯片在 TSMC 需要大幅重掩膜。
    notes: 对照公司披露、行业媒体及独立批判性报道评估核心投资论点及反论。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报展望
      - 关键下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - Asimov 于 2026 年底流片；带宽效率达到 >90%；2027 年下半年在超大规模云集群中爬坡。
        - IPO 时企业价值 $15B+（3 倍回报）；倍数接近 Astera/Credo 上市水平（35x-37x 销售额）。
        - Nvidia Rubin 的软件优化压缩功耗优势。
        - 20% 概率：取决于 TSMC N3P 芯片顺利启动。
      - - 基准情景
        - Atlas 在 OCI 扩展至 150+ 个机架；Asimov 于 2027 年初流片；首批芯片在 2027 年末到货，仅需小幅重掩膜。
        - $5B-$7B 估值区间（1.0x-1.4x 回报）；公司筹集过桥资金支持商业爬坡。
        - 资本密集度要求在批量收入出现前追加稀释性股权融资。
        - 55% 概率：符合半导体开发和芯片启动的常见摩擦。
      - - 悲观情景
        - Asimov 流片推迟至 2027 年年中；芯片缺陷需要昂贵的金属层重掩膜；超大规模云厂商继续采用 HBM GPU 路线图。
        - 以 $1.5B-$2.5B 估值降价重组（折价 50%-70%）；Series C 清算优先权压顶，吞噬普通股价值。
        - 客户高度集中，且无法与商品 GPU 产能竞争。
        - 25% 概率：路线图延期和倍数压缩令其高度脆弱。
    notes: 基于 Asimov 流片时点、LPDDR5X 采用情况及晶圆厂爬坡，对三年持有结果进行情景建模。
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV012
      - CV013
