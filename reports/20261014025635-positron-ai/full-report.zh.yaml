  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Positron AI 围绕节能人工智能推理提出了有吸引力的运营论点：现代 Transformer 工作负载本质上受内存限制，而不是受算力限制。公司放弃高带宽内存队列，围绕商用 LPDDR5X
              内存采用内存优先架构，目标是实现更高的每美元 token 数和每瓦 token 数。Positron 已展示出切实的市场落地能力：在 Oracle Cloud Infrastructure 内部署了 50
              多个第一代 Atlas 推理服务器机架，并获得 Jump Trading 等客户的灯塔验证。但反论点在于，已出货的 FPGA 系统与尚未验证的定制 ASIC 芯片之间存在巨大鸿沟。现场 Atlas 使用带 HBM
              和 DDR5 内存的 Intel Agilex 7 FPGA；现场运营因此只验证了系统集成和网络，却没有验证 Asimov 宣称的 90% 内存带宽利用率。此外，关键对比数据来自
              SemiAnalysis，其创始人 Dylan Patel 同时担任顾问、投资人和董事会成员；在不加限定地接受这些基准前，仍需独立复现。
