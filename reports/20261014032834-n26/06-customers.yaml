chapter:
  number: 6
  title: "Customers"
  summary: "N26 has expanded its revenue-relevant customer base to 4.8 million across 24 European markets and accumulated over €10 billion in customer deposits following the mid-2024 lifting of BaFin's onboarding restrictions. While post-cap customer acquisition has accelerated to over 200,000 monthly sign-ups and younger demographics drive adoption of embedded ETF and stock trading, durability remains tested by prior geographic retrenchment from the US and UK, automated compliance account freeze controversies, and self-directed retail tax friction."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base and Account Segmentation"
    body: "N26 structures its customer acquisition across a dual-tier framework encompassing free digital transaction accounts and tiered premium subscriptions. At the foundation of the platform sits N26 Standard, a free mobile account offering virtual debit cards and basic digital budgeting tools, designed to maximize retail top-of-funnel customer adoption across European markets. To drive monetization and unit economics, the bank funnels active users into paid subscription tiers, notably N26 Smart, N26 Go, and N26 Metal. The premium tiers bundle value-added lifestyle services, including comprehensive international travel insurance underwritten by Allianz Assistance, fee-free foreign currency cash withdrawals, and dedicated customer support channels. In addition to everyday transactional banking, N26 has expanded aggressively into wealth accumulation surfaces, launching instant interest-bearing savings accounts alongside embedded fractional stock and ETF brokerage in partnership with Upvest Securities and cryptocurrency trading with Bitpanda. Customer adoption of these investment features is heavily concentrated among younger cohorts: Gen Z users aged 18 to 29 represent 28% of all equity and digital asset investors on the platform, and their assets under custody expanded by 45% during the first half of 2026 alone, demonstrating strong initial cross-sell traction into self-directed capital markets."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU015"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-growth-and-deposits"
    title: "Adoption Trajectory, Deposits, and Post-Cap Acceleration"
    body: "N26's customer metrics have undergone a deliberate strategic pivot from gross registered accounts to revenue-relevant users, providing a more disciplined indicator of active banking relationships. While N26 previously reported over 7 million total registered accounts across 25 markets at its October 2021 funding peak, its core reporting now focuses on active revenue-generating relationships, projecting 4.8 million revenue-relevant customers by year-end 2024 compared with 4.2 million at the end of 2023. Customer deposit accumulation has served as a primary operational anchor for the bank's profitability inflection, surpassing €10 billion in the third quarter of 2024. All retail deposits benefit from statutory protection up to €100,000 per depositor under the German statutory deposit guarantee scheme, reassuring conservative European savers. The defining catalyst for N26's recent growth trajectory was the June 2024 complete removal of BaFin's regulatory growth restrictions, which had previously capped new monthly customer onboarding to 50,000 in 2021 and 60,000 in 2023 due to anti-money laundering control deficits. Following the lifting of the ceiling, customer onboarding velocity accelerated dramatically to more than 200,000 new monthly sign-ups, more than doubling its fiscal 2023 intake rate and rapidly expanding customer deposit balances."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "retention-durability-and-friction"
    title: "Customer Durability, Retention Risks, and Operational Friction"
    body: "Despite robust top-line customer onboarding momentum, N26 faces meaningful headwinds concerning customer retention, geographical durability, and user experience friction. Geographically, N26's operating footprint has narrowed significantly after costly retrenchments from major non-core markets, shuttering operations in the United Kingdom in April 2020 post-Brexit and subsequently withdrawing from the United States in January 2022, which resulted in the immediate closure of approximately 500,000 American accounts. Furthermore, customer trust and brand sentiment have experienced repeated strain from aggressive automated compliance measures: in late 2022, more than 100 customer accounts, including those of vulnerable Ukrainian refugees in Western Europe, were abruptly frozen or closed without prior notification under automated crime-prevention algorithms. On the product side, retail investment expansion has introduced practical user friction, as N26 does not automate local withholding tax declarations for investors in jurisdictions such as Belgium and Italy, forcing individual customers to navigate complex cross-border tax filings independently. Compounding these friction points is the absence of telephone customer support, leaving distressed account holders reliant on automated chatbots and email ticketing during service disruptions."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU003"
