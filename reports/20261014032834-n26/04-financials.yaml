callouts:
  - calloutType: "insight"
    title: "Transition from Interchange Dependency to Net Interest Leverage"
    body: "N26's attainment of net profitability in fiscal year 2025 demonstrates a structural shift from payment interchange dependence toward balance-sheet monetization. Net interest income grew 49% to €166.3 million, contributing 47% of gross profit on the back of €10.5 billion in customer deposits. However, because net margin was merely 0.3%, this earnings power remains acutely sensitive to European Central Bank rate movements."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
      - "CI010"
  - calloutType: "risk"
    title: "Regulatory Capital Buffers and Compliance Drag"
    body: "While BaFin removed N26's monthly onboarding growth cap in mid-2024, its December 2025 supervisory intervention imposed an external monitor, additional capital reserve requirements, and a Dutch mortgage lending ban. Heightened capital requirements limit operating flexibility and dividend capacity, requiring prospective investors to verify forward capital adequacy before underwriting expansion."
    claimRefs:
      - "CI011"
