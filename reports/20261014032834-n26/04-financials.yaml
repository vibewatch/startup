chapter:
  number: 4
  title: "Financials"
  summary: "In fiscal year 2025, N26 achieved its first full year of net profitability, generating €501.6 million in revenue and €350.5 million in gross profit, driven by net interest income on €10.5 billion in customer deposits alongside subscription fee expansion. However, a paper-thin net profit margin of 0.3% (€1.6 million) and ongoing BaFin supervisory restrictions leave forward earnings vulnerable to rate compression and compliance overhead."
sections:
  - id: "revenue-architecture-and-streams"
    title: "Revenue Architecture and Revenue Streams"
    body: "N26 Group operates a diversified digital banking model monetizing through payment fee commissions, net interest income on customer deposits, and recurring consumer subscriptions. For fiscal year 2025, N26 generated €501.6 million in revenue under its management reporting framework (IFRS-aligned), an increase of 13% compared to €445.4 million in 2024. Gross profit grew 33% year-on-year to €350.5 million, reflecting significant operating leverage as platform direct costs declined relative to transaction scale. Revenue composition demonstrated balanced contributions across two primary engines: net fee and commission income totaled €184.2 million (representing 53% of gross profit), while net interest income reached €166.3 million (accounting for 47% of gross profit). Under German statutory bank accounting standards (RechKredV), gross revenue was reported at €498.1 million with €191.3 million in net interest income and €176.9 million in fee income, though group net income remained identical across both frameworks. Preliminary Q1 2026 results showed continued momentum, generating €130.0 million in quarterly revenue, €92.0 million in gross profit, and €9.8 million in net income, confirming that monetization strength carried into the subsequent fiscal cycle."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
      - "CI008"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-model-and-monetization"
    title: "Pricing Architecture and Monetization Mechanics"
    body: "N26 employs a freemium pricing architecture designed to funnel mass-market retail users into recurring subscription tiers while monetizing free users via payment interchange. At the base tier, N26 Standard provides a free current account with virtual debit card functionality and two free monthly domestic ATM withdrawals, charging a €10 issuance fee for physical cards. The monetization ladder scales through paid subscription plans: N26 Smart at €4.90 monthly, N26 You at €9.90 monthly (featuring bundled Allianz travel and lifestyle insurance), and N26 Metal at €16.90 monthly (including an 18-gram stainless steel debit card, expanded ATM limits, and instant savings interest yields scaling up to 1.50% p.a.). Industry analysis indicates that approximately 30% of N26's revenue-relevant customer base pays for subscription tiers, providing high-margin recurring software-like revenues that insulate the neobank against retail payment volume seasonality. In parallel, N26 captures interchange fees averaging 35 basis points net of processor costs on payment volume, complemented by affiliate partnership kickbacks on third-party integrations including Upvest for stock and ETF brokerage, Bitpanda for crypto trading, and Vodafone for eSIM telecommunications."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI002"
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics, Cost Structure, and Operating Leverage"
    body: "The core engine of N26's 2025 profitability turnaround was the expansion of net interest margins and structural operating discipline across its centralized digital infrastructure. N26 concluded 2025 with 5.6 million revenue-relevant customers, reflecting a 16% year-on-year increase, while total customer deposits exceeded €10.5 billion and annual transaction volume expanded 14% to €170.7 billion. Based on reported revenue of €501.6 million, average annual revenue per revenue-relevant customer (ARPU) reached €89.57, while average customer deposit balances stood at €1,875. Marketing efficiency remains anchored in organic distribution, with estimates indicating that 73% of new customer sign-ups originate via word-of-mouth referrals. However, financial diligence reveals that net profitability remains exceptionally fragile: 2025 net income of €1.6 million against €501.6 million in revenue equates to a razor-thin net margin of approximately 0.32%. While this performance reversed a €42.0 million net loss in 2024, the margin leaves virtually no cushion against adverse operational shocks, credit provisioning shifts, or European Central Bank policy rate reductions that would diminish treasury yields on customer balances."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI009"
      - "CI010"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy, Regulatory Reserves, and Forward Underwriting"
    body: "N26's balance sheet trajectory reflects both substantial historical equity capitalization and ongoing regulatory capital constraints imposed by German banking authorities. Through its Series E funding round in October 2021, N26 raised a cumulative $1.72 billion in equity, achieving a peak post-money valuation of $9.0 billion led by Third Point Ventures, Coatue Management, and Dragoneer. Subsequent fintech market compression and secondary market activity led to valuation adjustments, with reports in 2025 indicating private negotiations around a €400 million Series F restructuring at a reduced valuation of approximately $3.0 billion to allow early 2021 investors to adjust guaranteed return covenants. Crucially for underwriting, regulatory friction escalated in December 2025 when BaFin appointed a special monitor, mandated increased financial capital reserves, and banned new mortgage lending in the Netherlands due to deficiencies in risk and complaints management. These supervisory mandates raise capital adequacy thresholds, constraining return on equity and requiring diligence to confirm that capital buffers comfortably exceed statutory minimums before modeling dividend or expansion capacity."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
