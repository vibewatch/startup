company:
  name: N26
chapter:
  number: 2
  title: "Market Analysis"
  summary: "N26 competes in European mobile retail banking, with adjacent savings, investing, crypto, travel-connectivity, and freelancer products. The assigned evidence supports product and buyer boundaries but not a denominator-defined TAM, SAM, or SOM, so observed scope indicators and conflicting company-revenue estimates are preserved instead of converted into a speculative market size."
sections:
  - id: market-boundary
    title: "Market boundary and substitutes"
    body: >-
      N26's evidenced market is consumer and freelancer financial services delivered through a
      mobile-first bank: checking accounts, debit cards, transfers, savings, self-directed
      investments, and crypto. The boundary is wider than a single current-account product because
      N26 presents separate personal and business plan families and distributes investment products
      through its banking interface. It is narrower than the full European universal-banking market:
      the retained sources do not establish corporate treasury, institutional banking, mortgage
      origination, or advised wealth management as current N26 markets. Status-quo substitutes are
      therefore primary accounts at incumbent banks and a collection of separate payments, savings,
      brokerage, and crypto applications. A full German banking license supports trust and deposit-led
      positioning, while the flexible cash fund's non-deposit status shows why adjacent products must
      not be counted as equivalent banking balances.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM006
    tableRefs:
      - TM001
  - id: evidence-constrained-sizing
    title: "Evidence-constrained sizing"
    body: >-
      The available source pool does not contain a publisher-defined European mobile-banking TAM,
      a serviceable revenue denominator for N26's active countries, or a supportable obtainable-market
      share. It does provide observable perimeter indicators: eleven named countries for the disclosed
      Instant Savings offer, more than 300 crypto assets, eSIM coverage across more than 100
      destinations, and separate personal and freelancer plan families. These measures describe
      breadth, not market value, and cannot be added or converted into revenue. Two third-party
      company-revenue estimates also diverge: Growjo displays $358.4 million without a stated period
      or transparent method, while UpMarket displays 486 million for 2024 but labels that value in
      euros in a heading and dollars in the following Sacra-attribution sentence. Currency, vintage,
      and methodology differences prevent treating either figure as a market-size anchor or using
      their difference as growth.
    claimRefs:
      - CM005
      - CM008
      - CM009
      - CM011
      - CM012
      - CM013
      - CM016
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: "Buyers, users, and adoption path"
    body: >-
      The product architecture points to four buyer groups: fee-sensitive everyday account users,
      consumers willing to pay for more control or travel benefits, self-employed users selecting
      business plans, and self-directed savers or investors. In each case the user is also the likely
      payer; the assigned evidence does not show an enterprise procurement motion. Adoption can begin
      with the free Standard account and extend through premium plans, investment transactions, crypto,
      or travel connectivity. The current disclosures make pricing and product breadth visible, but
      they do not show conversion from secondary card use to primary salary-account status, cohort
      retention, acquisition cost, or product-level attachment. Those missing denominators matter more
      for obtainable revenue than the headline number of options available in the application.
    claimRefs:
      - CM002
      - CM004
      - CM005
      - CM007
      - CM008
      - CM009
      - CM010
    tableRefs:
      - TM003
  - id: drivers-and-constraints
    title: "Adoption drivers and constraints"
    body: >-
      N26 can widen engagement by placing everyday banking, savings, trading, crypto, and travel tools
      in one interface. Current disclosures show concrete levers: a free entry plan, plan-linked savings
      rates, EUR0.90 securities transactions with free-trade allowances on higher tiers, hundreds of
      crypto assets, eSIM coverage, and an Under18s launch in 2026. These are breadth signals rather
      than proof of demand or retention. Adoption also depends on trust, suitability, and compliance.
      N26 explicitly distinguishes its flexible cash fund from a deposit and warns of capital loss.
      Historically, BaFin ordered the bank to strengthen anti-money-laundering controls, citing IT
      monitoring and customer identification and verification. The historical order does not establish
      current non-compliance, but it demonstrates that supervisory execution can constrain growth and
      raises the diligence burden for any forward market-share assumption.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM014
      - CM015
