callouts:
  - calloutType: insight
    title: "Product breadth is not market size"
    body: "N26's catalogue demonstrates several monetizable adjacencies, but option counts and destination coverage cannot establish addressable customers, spend, or obtainable revenue without adoption and denominator data."
    claimRefs:
      - CM005
      - CM008
      - CM009
      - CM016
  - calloutType: risk
    title: "Supervision is an adoption constraint"
    body: "The 2021 BaFin order is historical rather than evidence of current non-compliance, but it shows that control execution and customer-verification capacity can affect the pace at which a regulated digital bank scales."
    claimRefs:
      - CM014
      - CM015
