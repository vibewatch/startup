      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              N26 can widen engagement by placing everyday banking, savings, trading, crypto, and travel tools in one
              interface. Current disclosures show concrete levers: a free entry plan, plan-linked savings rates, EUR0.90
              securities transactions with free-trade allowances on higher tiers, hundreds of crypto assets, eSIM
              coverage, and an Under18s launch in 2026. These are breadth signals rather than proof of demand or
              retention. Adoption also depends on trust, suitability, and compliance. N26 explicitly distinguishes its
              flexible cash fund from a deposit and warns of capital loss. Historically, BaFin ordered the bank to
              strengthen anti-money-laundering controls, citing IT monitoring and customer identification and
              verification. The historical order does not establish current non-compliance, but it demonstrates that
              supervisory execution can constrain growth and raises the diligence burden for any forward market-share
              assumption.
