      - CV001
      - CV002
      - CV005
      - CV006
      - CV014
      - CV015
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter-Argument
      - View-Change Trigger
    rows:
      - - Profitability Inflection
        - >-
          N26 demonstrated operating leverage by swinging from a €42M loss in 2024 to €1.6M net income on €501.6M
          revenue in 2025, and €9.8M net income in Q1 2026.
        - >-
          Operating profit margins remain thin (<2% in 2025); earnings are vulnerable to compliance-driven overhead and
          deposit cost fluctuations.
        - Two consecutive quarters of operating losses or regulatory remediation costs exceeding €25M.
      - - Governance Professionalization
        - >-
          Founders stepped back; CEO Mike Dargan and CFO Marc Hess bring decades of traditional Tier-1 German banking
          and regulatory compliance experience.
        - >-
          Executive turnover across 2025-2026 created transitional friction and was forced by investor friction over
          BaFin threats rather than voluntary strategy.
        - Further supervisory board departures or management board vacancies under BaFin scrutiny.
      - - Deposit & Customer Base
        - >-
          N26 holds over €10.5B in customer deposits with 5.6M revenue-generating customers and €170.7B in transaction
          volume, establishing stable funding.
        - >-
          Customer acquisition remains geographically bounded to Europe following complete withdrawals from the US and
          UK retail markets.
        - Deposit outflows exceeding 10% YoY or renewal of strict monthly customer onboarding caps by BaFin.
      - - Product & Monetization Breadth
        - >-
          Expansion into Flexible Cash Funds, crypto, ETF trading with Upvest, and Wero instant payments diversifies
          non-interest fee revenue.
        - >-
          N26 business accounts exclude registered legal entities and corporations across most markets, restricting B2B
          market capture to freelancers.
        - Successful pan-European rollout of SMB corporate accounts or fee stagnation in premium subscription tiers.
    notes: Core thesis pillars contrast operational milestones against structural regulatory and competitive headwinds.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation Multiple & Range
      - Key Catalysts & Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Annual revenue expands >25% to €625M; net margin widens to 8%; BaFin lifts special monitor and Dutch mortgage
          ban; full EU SMB account launch.
        - 7.0x–8.5x revenue; implied valuation €4.4B–€5.3B ($4.8B–$5.8B)
        - >-
          Catalyst: Clean 2026 BaFin audit report, IPO roadmap established for 2027. Risk: Competitive pricing pressure
          from Revolut.
        - 20%
      - - Base Case
        - >-
          Revenue grows 12–15% to €565M–€575M; net income reaches €30M–€40M; deposits stabilize at €11B; BaFin monitor
          remains active but manageable.
        - 5.0x–6.0x revenue; implied valuation €2.8B–€3.4B ($3.1B–$3.7B)
        - >-
          Catalyst: Steady growth in ETF/investing fees and net interest margin. Risk: Ongoing compliance overhead and
          deposit beta.
        - 55%
      - - Bear Case
        - >-
          Revenue growth decelerates below 5%; compliance costs spike; BaFin reimposes growth caps or expands business
          bans beyond Dutch mortgages; deposit runoff.
        - 2.5x–3.5x revenue; implied valuation €1.3B–€1.8B ($1.4B–$2.0B)
        - >-
          Catalyst: Adverse supervisory enforcement action or renewed AML control failures. Risk: Major shareholder
          secondary firesale below €2B.
        - 25%
    notes: Valuation multiples and implied enterprise values modeled on projected FY2026 annualized revenue run rates.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV008
      - CV009
      - CV014
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological milestone evolution of N26 from founding as Papayer GmbH through banking license acquisition, global
      scaling, supervisory enforcement, and executive leadership restructuring.
    approximationNotes: null
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO007
      - CO009
      - CO013
      - CO014
      - CO015
    data:
      items:
        - label: '2013-08: Papayer GmbH Founded'
          date: 2013-08
          detail: >-
            Valentin Stalf and Maximilian Tayenthal incorporate Papayer GmbH in Berlin, initially developing a prepaid
            card product for teenagers.
          tone: neutral
        - label: '2015-01: Number26 Mobile Account Launch'
          date: 2015-01
          detail: >-
            Rebranded as Number26, launching general-purpose mobile banking accounts across Germany and Austria
            utilizing Wirecard infrastructure.
          tone: positive
        - label: '2016-07: Full German Banking License Granted'
          date: 2016-07
          detail: >-
            Granted a full German banking license by BaFin and ECB; initiates migration of accounts to proprietary
            banking core infrastructure.
          tone: positive
        - label: '2019-01: Series D Financing at $2.7B Valuation'
          date: 2019-01
          detail: >-
            Raises $300M Series D led by Insight Partners and GIC, establishing N26 as Europe's most valuable mobile
            neobank at the time.
          tone: positive
        - label: '2021-10: Series E Round at $9.0B Peak Valuation'
          date: 2021-10
          detail: >-
            Secures $900M in Series E funding led by Third Point Ventures and Coatue Management, but BaFin imposes
            onboarding caps shortly after.
          tone: warning
        - label: '2022-01: Strategic Exit from US and UK Markets'
          date: 2022-01
          detail: >-
            Completes withdrawal from the US market (closing ~500,000 accounts) following earlier UK exit, focusing
            exclusively on core European SEPA markets.
          tone: neutral
        - label: '2024-09: First Profitable Quarter and Cap Lift'
          date: 2024-09
          detail: >-
            Reports first profitable quarter in Q3 2024 after BaFin removes growth cap in June 2024; revenue reaches
            €486M for full-year 2024.
          tone: positive
        - label: '2026-04: Leadership Cleanup under CEO Mike Dargan'
          date: 2026-04
          detail: >-
            Mike Dargan assumes CEO role following BaFin audit, Dutch mortgage lending restrictions, and executive
            departures of co-founders Stalf and Tayenthal.
          tone: critical
  - id: FM001
    title: Observable market-perimeter indicators
