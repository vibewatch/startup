  - id: FE001
    title: Product architecture map
    type: stack
    summary: Multi-tier technology stack powering N26's digital banking operations, core ledger, and embedded partner services.
    data:
      layers:
        - label: Client Experience Layer
          detail: iOS and Android Native Mobile Apps, Progressive Web App, and Biometric Device Authentication
          modules:
            - Native Mobile Banking App
            - Web App Control Center
            - Biometric Authentication
        - label: API & Service Orchestration Layer
          detail: Microservices API Gateway, User Identity Management, and Notification Infrastructure
          modules:
            - API Routing Gateway
            - Session & Identity Services
            - Real-Time Push Notifications
        - label: Core Banking Engine Layer
          detail: Mambu Composable Core Sub-Ledger, Deposit Balance Processing, and Overdraft Engine on AWS
          modules:
            - Mambu Deposit Sub-Ledger
            - Transaction Balance Engine
            - Integrated Overdraft Facility
        - label: Payment & Clearing Rails Layer
          detail: Direct SEPA Clearer Connectivity, Mastercard Debit Scheme, and Retail CASH26 Barcode Network
          modules:
            - SEPA Payment Processing
            - Mastercard Debit Rails
            - CASH26 Retail Merchant Barcodes
        - label: Embedded Partner Infrastructure Layer
