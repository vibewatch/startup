  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              N26's evidenced market is consumer and freelancer financial services delivered through a mobile-first
              bank: checking accounts, debit cards, transfers, savings, self-directed investments, and crypto. The
              boundary is wider than a single current-account product because N26 presents separate personal and
              business plan families and distributes investment products through its banking interface. It is narrower
              than the full European universal-banking market: the retained sources do not establish corporate treasury,
              institutional banking, mortgage origination, or advised wealth management as current N26 markets.
              Status-quo substitutes are therefore primary accounts at incumbent banks and a collection of separate
              payments, savings, brokerage, and crypto applications. A full German banking license supports trust and
              deposit-led positioning, while the flexible cash fund's non-deposit status shows why adjacent products
              must not be counted as equivalent banking balances.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM007
              - CM008
