            - Bitpanda Crypto Custody Rail
            - Wise Currency Exchange Engine
        - label: Underlying Cloud & Infrastructure Layer
          detail: Horizontally Scalable Cloud Infrastructure Hosted on Amazon Web Services (AWS)
          modules:
            - AWS Managed Cloud Compute
            - High-Availability Storage
            - Secure VPC Network Infrastructure
