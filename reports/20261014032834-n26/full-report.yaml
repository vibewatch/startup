      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The product architecture points to four buyer groups: fee-sensitive everyday account users, consumers
              willing to pay for more control or travel benefits, self-employed users selecting business plans, and
              self-directed savers or investors. In each case the user is also the likely payer; the assigned evidence
              does not show an enterprise procurement motion. Adoption can begin with the free Standard account and
              extend through premium plans, investment transactions, crypto, or travel connectivity. The current
              disclosures make pricing and product breadth visible, but they do not show conversion from secondary card
              use to primary salary-account status, cohort retention, acquisition cost, or product-level attachment.
              Those missing denominators matter more for obtainable revenue than the headline number of options
              available in the application.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
