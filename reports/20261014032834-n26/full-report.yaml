            body: >-
              The available source pool does not contain a publisher-defined European mobile-banking TAM, a serviceable
              revenue denominator for N26's active countries, or a supportable obtainable-market share. It does provide
              observable perimeter indicators: eleven named countries for the disclosed Instant Savings offer, more than
              300 crypto assets, eSIM coverage across more than 100 destinations, and separate personal and freelancer
              plan families. These measures describe breadth, not market value, and cannot be added or converted into
              revenue. Two third-party company-revenue estimates also diverge: Growjo displays $358.4 million without a
              stated period or transparent method, while UpMarket displays 486 million for 2024 but labels that value in
              euros in a heading and dollars in the following Sacra-attribution sentence. Currency, vintage, and
              methodology differences prevent treating either figure as a market-size anchor or using their difference
              as growth.
