  topStrengths:
    - Full German banking license with a large European retail footprint.
    - First full profitable year in 2025, with Q1 2026 momentum continuing.
    - Diversified monetization from subscriptions, interest income, and partner-led products.
  topRisks:
    - Ongoing BaFin supervision and the December 2025 business restrictions.
    - Cap-table opacity and stale private-market price discovery.
    - Thin profit margins that remain sensitive to rates and compliance costs.
  unresolvedGaps:
    - Current cap-table ownership, liquidation preferences, and secondary clearing prices.
