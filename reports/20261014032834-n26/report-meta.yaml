companyProfile:
  summary: >-
    N26 is a Berlin-based licensed digital bank serving consumers and freelancers across 24 European markets through a
    mobile-first current-account platform with premium subscriptions, savings, and partner-led investing and crypto
    services. It turned profitable in 2025, but the company still operates under heightened BaFin scrutiny and a
    valuation framework shaped by an old $9.0 billion Series E mark rather than fresh primary price discovery.
