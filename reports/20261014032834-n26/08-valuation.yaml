company:
  name: N26
chapter:
  number: 8
  title: Valuation
  summary: N26 achieved its first profitable financial year in 2025 with €501.6M in revenue and €1.6M in net income, continuing
    into Q1 2026 with €9.8M in preliminary net income, yet persistent BaFin oversight and an unliquidated cap table leave
    its valuation multiple compressed against historical peaks.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Risk-Adjusted Anti-Thesis
  body: N26 has crossed a critical operational divide by demonstrating that its mobile-first direct banking model can generate
    sustainable operating profitability. The core investment thesis centers on proven operating leverage, expanding European
    customer deposits exceeding €10.5 billion, and a substantial retail franchise of 5.6 million revenue-generating customers
    generating €170.7 billion in annual transaction volume. The bank has substantially enhanced its management structure by
    recruiting seasoned executives from Germany traditional banking sector, culminating in the appointment of former Postbank
    and Aareal Bank CFO Marc Hess alongside Chief Executive Officer Mike Dargan. Conversely, the anti-thesis underscores that
    bottom-line net income remains razor-thin at €1.6 million on €501.6 million of revenue in 2025, leaving negligible cushion
    against adverse macroeconomic shifts or deposit pricing competition. Furthermore, the neobank commercial scope remains
    structurally constrained by its complete retrenchment from the United States and United Kingdom markets, alongside strict
    eligibility restrictions that prevent incorporated corporate entities from opening standard European business accounts.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV010
  - CV011
  tableRefs:
  - TV002
- id: capitalization-and-private-market-pricing
  title: Capitalization History, Private Market Discovery, and Comparable Benchmarks
  body: N26 private valuation history illustrates the sharp divergence between zero-interest-rate growth benchmarks and normalized
    post-2022 market multiples. In October 2021, the company achieved a peak post-money valuation of $9.0 billion following
    a $900 million Series E round led by Third Point Ventures and Coatue Management. However, this peak mark has remained
    stale for five years without primary market confirmation. Secondary transactions and institutional share sales have provided
    clear price discovery signals indicating profound multiple compression. Notably, institutional backer Allianz attempted
    to liquidate its 5% equity stake in April 2023 at an implied company valuation of approximately $3.0 billion, establishing
    an effective 67% discount against the Series E headline. On secondary pre-IPO platforms including UpMarket, shares remain
    illiquid and subject to substantial bid-ask spreads. Public European neobank and digital wealth peers trade at median
    revenue multiples between 4.5x and 6.5x forward net revenues, indicating that N26 current baseline valuation should be
    marked between €2.8 billion and €3.4 billion rather than anchored to past peak financing rounds.
  claimRefs:
  - CV006
  - CV007
  - CV012
  - CV014
  tableRefs:
  - TV003
- id: scenarios-and-thesis-break-triggers
  title: Scenario Analysis, Downside Protection, and Thesis-Break Triggers
  body: Evaluating N26 investment profile requires modeling discrete operating trajectories across regulatory normalization,
    revenue diversification, and capital requirements. In our baseline scenario, modeled with 55% probability, N26 sustains
    moderate top-line expansion of 12% to 15% into FY2026, reaching revenues between €565 million and €575 million while converting
    preliminary quarterly gains into annual net income of €30 million to €40 million. Under this base case, an exit or financing
    valuation multiple of 5.0x to 6.0x forward sales supports an enterprise equity value between €2.8 billion and €3.4 billion.
    In the bull case, with 20% probability, accelerated adoption of wealth management products and complete regulatory clearance
    from BaFin unlock renewed expansion, driving valuation toward €4.4 billion to €5.3 billion. The bear scenario, weighted
    at 25% probability, reflects potential escalation of supervisory sanctions or renewed customer onboarding limits, which
    would compress the equity valuation to €1.3 billion to €1.8 billion. Critical thesis-break triggers include any extension
    of supervisory restrictions beyond Dutch mortgages, deposit runoff exceeding 10%, or renewed AML enforcement penalties.
  claimRefs:
  - CV001
  - CV002
  - CV005
  - CV008
  - CV009
  - CV014
  tableRefs:
  - TV001
- id: recommendation-framework-and-diligence-path
  title: Recommendation Synthesis and Diligence Priorities
  body: 'Synthesizing N26 operational inflection against its unresolved governance and capital structure overhang yields a
    Research-More recommendation with medium analytical confidence and a high overall risk rating. While the transition from
    a €42 million net loss in 2024 to consistent profitability across 2025 and early 2026 represents a commendable turnaround,
    external investors cannot underwrite an institutional equity commitment without definitive confirmation of regulatory
    normalization. The ongoing presence of a BaFin special monitor and outstanding restrictions on mortgage activities mandate
    caution. Furthermore, the complete opacity of senior liquidation preference rights across Series A through Series E preferred
    share classes leaves late-stage secondary buyers exposed to downside value destruction. Prospective investors must condition
    further capital deployment on three diligence deliverables: direct verification of BaFin audit resolution milestones,
    receipt of an audited FY2026 cap table with liquidation waterfalls, and confirmation of sustained non-interest income
    growth across newly launched investment products.'
  claimRefs:
  - CV001
  - CV004
  - CV005
  - CV006
  - CV007
  - CV013
  - CV014
  - CV015
