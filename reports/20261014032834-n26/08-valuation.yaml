    - Current fair value estimate of €2.8B–€3.4B reflects realistic 5.0x–6.0x revenue multiple vs stale $9B peak mark
    - Reject secondary transactions offered at or near peak 2021 Series E valuations; target entry at ~€3.0B mark
  notes: Evaluated as of Q4 2026 based on audited FY2025 results, preliminary Q1 2026 filings, and secondary market indications.
