- calloutType: recommendation
  title: 'Recommendation Stance: Research-More / Hold at Fair Valuation Range'
  body: N26 represents a fundamentally improved banking asset following its 2025 profitability inflection and executive restructuring
    under seasoned leadership. However, institutional entry is premature while BaFin heightened supervision remains active
    and private cap table liquidation preference stacks remain unverified. Investors should mark current fair equity value
    between €2.8 billion and €3.4 billion, rejecting secondary offerings anchored to historical $9.0 billion valuations.
