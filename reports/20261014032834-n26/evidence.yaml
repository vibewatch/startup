    keyQuote: >-
      For fiscal year 2025, N26 Group generated €501.6 million in revenue, representing an increase of 13% compared to
      €445.4 million in 2024. At the same time, reduced direct costs resulted in gross profit growth of 33% to €350.5
      million, demonstrating the business’s increasing operating leverage. Net income reached €1.6 million from a net
      loss of €42.0 million in 2024, representing a year-on-year improvement of €43.6 million and N26’s first full year
      of profitability.
