evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondary-valuation
    missingEvidence: >-
      Audited current cap table showing preferred share liquidation preferences, secondary transaction clearing prices,
      and updated institutional valuations post-2021 Series E.
    whyItMatters: >-
      Without primary cap-table disclosure or active secondary pricing, the $9.0B peak headline valuation cannot be
      verified against current fintech market multiples.
    diligencePath: >-
      Obtain shareholder register and confidential offering memoranda from secondary broker-dealers or management
      diligence disclosures.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: executive-management-bench
    missingEvidence: >-
      Complete organizational roster of current divisional heads, operating officers, and supervisory board committee
      appointees under CEO Mike Dargan.
    whyItMatters: >-
      Full assessment of functional management depth beyond the CEO and former co-founders is necessary to evaluate
      operational resilience.
    diligencePath: Request executive organization chart and supervisory board composition updates from N26 corporate communications.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A current, denominator-defined European retail or mobile-banking revenue pool segmented by N26's active countries
      and eligible customer population.
    whyItMatters: >-
      Without a comparable denominator, product counts and company revenue estimates cannot support TAM, SAM, SOM,
      penetration, or market-share conclusions.
    diligencePath: >-
      Obtain country-level retail banking revenue and active-adult account data from a regulator, trade association, or
      transparent analyst dataset, then reconcile the exact N26 operating footprint.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: revenue-estimate
    missingEvidence: >-
      Audited N26 group revenue for a common period and currency, with definitions that reconcile the Growjo and
      UpMarket/Sacra estimates.
    whyItMatters: >-
      Company revenue is a possible cross-check on obtainable market share, but the retained estimates differ in value,
      currency, vintage, and disclosed methodology.
    diligencePath: >-
      Review filed consolidated accounts and reconcile reported revenue, net interest income, fee income, and the
      relevant legal entities to each estimate.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-cohorts
    missingEvidence: >-
      Primary-account conversion, salary-deposit penetration, retention cohorts, acquisition cost, product attachment,
      and segment revenue by country.
    whyItMatters: >-
      These measures determine whether product breadth becomes recurring wallet share and are required for a supportable
      obtainable-market forecast.
    diligencePath: >-
      Request anonymized management cohort reporting by country, plan, acquisition channel, primary-account status, and
      product attachment.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: private-evidence-only
    severity: material
    topic: primary-account-switching-data
    missingEvidence: >-
      Audited customer primary-account penetration rates, direct deposit/salary inflow percentages, and churn statistics
      against traditional European banks.
    whyItMatters: >-
      Without verified primary-account share metrics, assessing whether N26 acts as a main transaction hub or merely a
      secondary spending card remains speculative.
    diligencePath: >-
      Request cohort-level salary deposit retention data and active user transaction frequency reports during technical
      and financial diligence.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: minor
    topic: multi-currency-fx-spreads
    missingEvidence: >-
      Direct quantitative transaction-level FX spread comparisons between Mastercard settlement rates and interbank spot
      rates across peer neobanks.
    whyItMatters: >-
      Determines the exact cost differential experienced by international travelers and cross-border commercial
      spenders.
    diligencePath: >-
      Perform side-by-side transaction testing on foreign currency card expenditures across N26, Revolut, and Wise
      cards.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: product-level-unit-economics
    missingEvidence: >-
      Audited segment reporting detailing exact gross margins by business line (interchange, subscriptions, interest
      spread, partner commissions) and fully loaded CAC per market.
    whyItMatters: >-
      Without product-level gross margins and channel acquisition costs, underwriting cannot verify whether premium
      subscriptions or interest margin expansion subsidize unprofitable free accounts.
    diligencePath: >-
      Request management presentation on unit economics by tier (Standard, Smart, You, Metal) and customer cohort
      payback periods during formal diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: bafin-remediation-capital-impact
    missingEvidence: >-
      Full disclosure of the exact quantitative capital buffer surcharge imposed by BaFin in December 2025 and ongoing
      compliance monitoring costs.
    whyItMatters: >-
      Additional regulatory capital requirements directly constrain dividend capacity, return on equity, and asset
      reinvestment for neobanks operating under German banking supervision.
    diligencePath: >-
      Review BaFin supervisory correspondence, SREP capital surcharge specifications, and the compliance remediation
      budget directly with N26 treasury.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: developer-signal-proxy
    missingEvidence: >-
      Direct public repository code metrics, developer API documentation portals, or public bug tracker logs for N26's
      internal platform engineering.
    whyItMatters: >-
      As a regulated financial institution, N26 does not expose its core banking microservices or platform codebases to
      open-source developer communities, limiting technical validation to partner case studies and architectural
      disclosures.
    diligencePath: >-
      Review internal architecture white papers, engineering blog posts, and technical diligence materials under
      non-disclosure agreements during formal diligence.
  - type: private-evidence-only
    severity: material
    topic: aml-monitoring-controls
    missingEvidence: >-
      Detailed technical architecture and error rate telemetry of N26's internal anti-money laundering (AML) and
      automated transaction screening systems.
    whyItMatters: >-
      Historical supervisory interventions by BaFin centered on governance and anti-financial crime controls, making the
      algorithmic efficacy of automated transaction monitoring a critical operational risk factor.
    diligencePath: >-
      Request compliance systems audit reports, supervisory remediation verification records, and automated transaction
      monitoring false-positive ratios.
  - type: missing-source
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: Audited customer cohort retention curves, net revenue retention (NRR), and annual customer churn percentages.
    whyItMatters: >-
      Without cohort retention and churn metrics, long-term customer lifetime value and expansion durability cannot be
      independently verified.
    diligencePath: Request confidential cohort analysis and subscription churn data in formal investor management meetings.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-and-partner-deployments
    missingEvidence: >-
      Comprehensive audit of all third-party enterprise service partners and fintech API deployments powering N26
      customer products.
    whyItMatters: >-
      Public records reveal key institutional partners like Allianz, Upvest, Bitpanda, and Fidelity, but non-disclosed
      sub-processors and backend banking partnerships remain opaque.
    diligencePath: Review vendor management disclosures and technical infrastructure supplier agreements in data room.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: bafin-supervisory-audit
    missingEvidence: >-
      Independent third-party compliance audit confirming whether BaFin's special representative has concluded all
      supervisory monitoring of AML workflows.
    whyItMatters: >-
      Persistent supervisory intervention or new regulatory orders could reimpose customer growth limits and divert
      engineering resources.
    diligencePath: >-
      Request management disclosure of ongoing BaFin supervisory communications and the latest status report from the
      appointed special monitor.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: cap-table-ownership
    missingEvidence: >-
      Audited breakdown of N26 cap-table ownership, liquidation preference seniority across Series A through E preferred
      share classes, and secondary transaction transfer restrictions.
    whyItMatters: >-
      Liquidation preference overhang from the $900M Series E round at $9B may significantly diminish common or junior
      preferred equity recoveries in an exit below $5B.
    diligencePath: >-
      Request cap table disclosure and amended articles of association (Satzung) from N26 investor relations or
      participating secondary brokers prior to investment commitment.
    relatedQuestionRefs:
      - QV005
  - type: missing-source
    severity: material
    topic: supervisory-remediation-status
    missingEvidence: >-
      Official BaFin confirmation regarding the remediation timeline and conditionality for removing the special monitor
      and lifting the Dutch mortgage origination ban.
    whyItMatters: >-
      Ongoing regulatory remediation absorbs executive bandwidth, caps potential product expansion into retail credit,
      and exposes the bank to potential follow-on penalties.
    diligencePath: >-
      Review formal BaFin audit reports under non-disclosure and verify management board remediation milestones directly
      with Supervisory Board audit representatives.
    relatedQuestionRefs:
      - QV006
