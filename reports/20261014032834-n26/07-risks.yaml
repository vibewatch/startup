callouts:
  - calloutType: risk
    title: Structural Vulnerability in Compliance Automation
    body: N26's aggressive deployment of automated AML algorithms without telephone-based human escalation creates severe customer friction. Depositors whose legitimate business earnings are flagged face multi-week account freezes with in-app chat as their sole recourse, creating persistent ombudsman complaints and reputational headwind.
    claimRefs:
      - CR003
      - CR004
      - CR005
  - calloutType: insight
    title: Counterparty Concentration in Wealth Products
    body: Rather than building balance-sheet investment infrastructure, N26 relies on Upvest for equities custody, Bitpanda for crypto, and Fidelity for money market funds. While capital-light, this model concentrates platform reliability and execution continuity into external regulated counterparties.
    claimRefs:
      - CR006
      - CR007
      - CR008
