callouts:
  - calloutType: insight
    title: The Browser Banking Differentiator
    body: While rival neobanks like Revolut emphasize mobile-first or mobile-only interfaces, N26 maintains a comprehensive web-banking interface accessible from desktop browsers. For self-employed individuals, freelancers, and desk-based knowledge workers, full web access facilitates routine accounting reconciliation and financial management without mobile dependency.
    claimRefs:
      - CP007
  - calloutType: risk
    title: Ecosystem Breadth and Super-App Deficit
    body: N26's conservative product expansion leaves it vulnerable to customer migration toward comprehensive financial super-apps. Competitors like Revolut offer multi-currency ledgers, broader crypto selections, and integrated travel tools, while specialized neobrokers like Trade Republic provide dramatically larger instrument universes.
    claimRefs:
      - CP004
      - CP008
