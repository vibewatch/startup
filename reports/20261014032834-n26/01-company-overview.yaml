company:
  name: N26
chapter:
  number: 1
  title: Company Overview
  summary: N26 is a Berlin-based licensed digital neobank operating under a full German banking license across 24 European markets, having reached its first profitable quarter in 2024 with over 4.8 million revenue-relevant customers. Following severe regulatory enforcement by BaFin—including growth caps, independent monitors, and a €4.25M fine—the company executed an executive overhaul culminating in the 2026 appointment of CEO Mike Dargan and co-founder departures from executive management. Private-market liquidity through secondary venues reflects an un-refreshed headline valuation of $9.0B from its 2021 Series E, set against ongoing supervisory remediation.
sections:
  - id: identity-and-foundations
    title: Corporate Identity, Product Evolution, and Banking Infrastructure
    body: N26 Bank SE is a Berlin-headquartered multinational digital bank founded in 2013 that operates as a direct mobile-first neobank across 24 European Union and SEPA markets. Initially launched as Papayer GmbH and later Number26 utilizing third-party infrastructure, the institution secured a full German banking license from the Federal Financial Supervisory Authority (BaFin) and the European Central Bank in July 2016, establishing proprietary core banking infrastructure with customer deposits protected up to €100,000 under the statutory German Deposit Protection Scheme. Over its operating history, N26 expanded beyond basic transaction accounts and debit cards to provide integrated personal finance services, including interest-bearing savings, automated savings plans, and cryptocurrency trading. To broaden its wealth management proposition, N26 partnered with Upvest Securities GmbH to launch stock and exchange-traded fund (ETF) execution and custody directly within its mobile application, scaling investment access across Germany, Austria, and broader European territories while reaching operational break-even and its first profitable quarter in mid-2024.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Executive Leadership, Governance Overhaul, and Works Council Relations
    body: N26 was co-founded by Valentin Stalf and Maximilian Tayenthal, who served as joint chief executive officers and led the company through early venture funding and hypergrowth. As the bank scaled, organizational governance faced sustained friction, highlighted by employee mobilizations in late 2020 to establish formal works councils (Betriebsrat) at Berlin operating entities despite initial management legal opposition. Prolonged supervisory friction with BaFin over internal controls and anti-money laundering mechanisms ultimately catalyzed an executive restructuring. In August 2025, co-founder Valentin Stalf stepped down as co-CEO amid investor tensions regarding regulatory sanctions, followed by Maximilian Tayenthal vacating operational co-CEO duties in December 2025, though both founders retained approximately 20% aggregate equity ownership. To lead the comprehensive institutional cleanup, N26 appointed former banking technology executive Mike Dargan as Chief Executive Officer in April 2026, transitioning the neobank from founder-led management to established institutional stewardship alongside supervisory board leadership.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO002
  - id: capitalization-and-secondary-markets
    title: Financing History, Valuation Benchmarks, and Secondary Share Liquidity
    body: Since inception, N26 has raised over $1.72 billion in equity financing across successive venture rounds, backed by prominent global venture capital and growth equity firms including Third Point Ventures, Coatue Management, Insight Partners, GIC, and early institutional investors. The company's capitalization peaked in October 2021 with a $900 million Series E financing round that valued the neobank at $9.0 billion post-money, temporarily positioning N26 among the highest-valued private fintech companies in Europe. However, in the absence of subsequent primary equity funding rounds or an initial public offering, private share price discovery has relied on illiquid secondary broker-dealer venues, such as UpMarket and Nasdaq Private Market (NPM), where accredited investors trade unregistered pre-IPO shares. While the historical $9.0 billion headline valuation persists as the primary reference point in secondary marketing listings, underlying transaction clearing prices reflect private illiquidity discounts, fintech macro compression, and ongoing supervisory remediation requirements.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
    tableRefs:
      - TO003
  - id: milestones-and-supervisory-scrutiny
    title: Strategic Expansion Milestones, Supervisory Enforcement, and Geographic Focus
    body: The trajectory of N26 reflects aggressive pan-European expansion punctuated by regulatory interventions and disciplined geographic consolidation. In May 2021, BaFin formally ordered N26 to remediate anti-money laundering and terrorism financing controls, subsequent to which the regulator imposed a €4.25 million fine in June 2021, appointed a special monitor, and capped new customer onboarding at 50,000 accounts per month. While this cap was subsequently adjusted to 60,000 and officially lifted in June 2024, supervisory scrutiny intensified in late 2025 following a regulatory audit, prompting BaFin to reassign an external supervisor and restrict new mortgage lending in the Netherlands. In parallel with supervisory challenges, N26 executed deliberate withdrawals from capital-intensive non-core markets, exiting the United Kingdom in April 2020 due to post-Brexit licensing complexities and closing approximately 500,000 accounts in the United States in early 2022 to preserve capital and refocus operational resources entirely on core European banking.
    claimRefs:
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001
