figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Chronological milestone evolution of N26 from founding as Papayer GmbH through banking license acquisition, global scaling, supervisory enforcement, and executive leadership restructuring.
    approximationNotes: null
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO007
      - CO009
      - CO013
      - CO014
      - CO015
    data:
      items:
        - label: "2013-08: Papayer GmbH Founded"
          date: 2013-08
          detail: Valentin Stalf and Maximilian Tayenthal incorporate Papayer GmbH in Berlin, initially developing a prepaid card product for teenagers.
          tone: neutral
        - label: "2015-01: Number26 Mobile Account Launch"
          date: 2015-01
          detail: Rebranded as Number26, launching general-purpose mobile banking accounts across Germany and Austria utilizing Wirecard infrastructure.
          tone: positive
        - label: "2016-07: Full German Banking License Granted"
          date: 2016-07
          detail: Granted a full German banking license by BaFin and ECB; initiates migration of accounts to proprietary banking core infrastructure.
          tone: positive
        - label: "2019-01: Series D Financing at $2.7B Valuation"
          date: 2019-01
          detail: Raises $300M Series D led by Insight Partners and GIC, establishing N26 as Europe's most valuable mobile neobank at the time.
          tone: positive
        - label: "2021-10: Series E Round at $9.0B Peak Valuation"
          date: 2021-10
          detail: Secures $900M in Series E funding led by Third Point Ventures and Coatue Management, but BaFin imposes onboarding caps shortly after.
          tone: warning
        - label: "2022-01: Strategic Exit from US and UK Markets"
          date: 2022-01
          detail: Completes withdrawal from the US market (closing ~500,000 accounts) following earlier UK exit, focusing exclusively on core European SEPA markets.
          tone: neutral
        - label: "2024-09: First Profitable Quarter and Cap Lift"
          date: 2024-09
          detail: Reports first profitable quarter in Q3 2024 after BaFin removes growth cap in June 2024; revenue reaches €486M for full-year 2024.
          tone: positive
        - label: "2026-04: Leadership Cleanup under CEO Mike Dargan"
          date: 2026-04
          detail: Mike Dargan assumes CEO role following BaFin audit, Dutch mortgage lending restrictions, and executive departures of co-founders Stalf and Tayenthal.
          tone: critical
callouts:
