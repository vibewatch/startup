    title: Governance Transformation Under Supervisory Pressure
    body: The transition from founder-led management to institutional stewardship under CEO Mike Dargan reflects the culmination of multi-year regulatory remediation with BaFin, shifting N26's strategic imperative from unconstrained hypergrowth to regulatory stability and defensible operating profitability.
    claimRefs:
      - CO006
      - CO007
      - CO013
      - CO014
