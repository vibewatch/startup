  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接新银行同业与欧洲大陆定位
        blocks:
          - type: paragraph
            body: >-
              欧洲数字银行市场已分化为功能密集型国际金融平台和专注区域型信贷机构。N26 处在两者之间：总部位于柏林，是一家完整持牌数字银行，在 24 个欧洲经济区司法辖区服务超过 8 million
              名注册客户。相比之下，主要的欧洲大陆及跨境竞争者 Revolut 正快速扩张为全球金融超级应用，拥有超过 45 million 名客户，提供多币种持有账户、广泛的投资功能和国际生活服务。荷兰新银行 bunq
              是另一家重要的欧洲大陆替代者，利用完整的荷兰银行牌照，为超过 12 million 名用户提供可持续银行功能和有竞争力的存款收益。与此同时，Monzo、Starling Bank
              等以英国为中心的数字银行领导者仍主要扎根本土零售清算环境。N26 在 2020 年退出英国、2022
              年退出美国后，主动把市场定位收拢到核心欧元区零售客户，服务那些更看重可靠欧元活期账户、而非复杂全球多币种功能的人群。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
      - number: '3.2'
        title: 功能范围、牌照姿态与网页访问差异
        blocks:
          - type: paragraph
            body: >-
              N26 的竞争定位取决于监管机构可信度与消费者功能广度之间的取舍。N26 持有由 BaFin 和欧洲央行直接监管下签发的完整德国信贷机构牌照，客户存款最高 €100,000
              受德国法定存款保障体系（Entschädigungseinrichtung deutscher Banken）保护。相比之下，Revolut 虽持有立陶宛颁发的专业欧洲银行牌照，但不少消费者和企业资金管理者仍将
              BaFin 监管视为更高的机构标准。功能上，N26 相对 Revolut
              最明显的用户流程优势，是完整的桌面网页应用：笔记本用户、自由职业者和小企业经营者可以在标准浏览器中执行电汇、核对费用和管理子账户，不依赖移动设备。然而，在财富管理上 N26 落后于专业数字券商；其与 Upvest
              的应用内券商集成支持约 1,200 只 ETF 和 1,500 只单一股票，而 Trade Republic 等独立竞争者可提供超过 4,500 种投资工具，以及债券收益和衍生品。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
      - number: '3.3'
        title: 分层定价架构与变现模式
        blocks:
          - type: paragraph
            body: >-
              欧洲新银行的变现高度依赖分层订阅，并辅以交易交换收入和财富管理价差。N26 将服务分成四个订阅层级：免费 Standard、每月 €4.90 的 Smart、每月 €9.90 的 Go，以及每月 €16.90 的
              Metal。入门 Standard 提供基本活期账户、每月两次免费的境内欧元 ATM 取款和虚拟 Mastercard；实体卡配送收费 €10。付费层级通过增量预算子账户（Spaces）、Allianz
              旅行和小工具保险、更高 ATM 取款额度，以及 Instant Savings 分层利率实现差异化，利率从 Standard 年化 0.30% 到 Metal 的 1.50%。自主投资方面，N26 每笔股票或
              ETF 交易收取透明的 €0.90 固定费用，Go 每月含 3 笔免费交易，Metal 含 10 笔。这种透明的单位定价不同于收取账户维护费并暗加外汇加价的传统零售银行，但仍面临零佣金券商的竞争压力。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 切换动态、护城河韧性与传统银行应对
        blocks:
          - type: paragraph
            body: >-
              欧洲消费者银行业务的客户切换壁垒具有结构性不对称。开一个次级数字账户不到十分钟，但把主要工资存款、公用事业自动扣款和家庭共同支出从 Deutsche Bank、BNP Paribas 或 Santander
              等传统银行迁出，会产生明显摩擦。N26 在西班牙等司法辖区签发本地 IBAN，降低了本地摩擦，但多平台开户在用户中仍很普遍。此外，历史监管干预限制了 N26 的竞争速度：2021 至 2024 年间，BaFin
              施加严格的每月获客上限和反洗钱风险缓解命令，压低了新银行快速普及时期的收入增长。N26 拥有约 1,600
              名员工，在全面重组管理层后治理趋于稳定，并在欧洲大陆城市中心保有可守住的核心客户忠诚度。但长期护城河韧性取决于能否把临时卡用户转成主要存款关系，而传统欧洲全能银行也在升级自有数字应用界面。
            claimRefs:
              - CP001
              - CP004
              - CP013
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 浏览器银行差异化
            body: Revolut 等竞争者强调移动优先或纯移动界面，而 N26 保留了可从桌面浏览器访问的完整网上银行界面。对自雇人士、自由职业者和坐班知识工作者而言，完整网页访问便于日常会计核对和财务管理，不必依赖移动设备。
            calloutType: insight
            claimRefs:
              - CP007
          - type: callout
            title: 生态广度与超级应用短板
            body: N26 保守的产品扩张使其容易被综合金融超级应用吸走客户。Revolut 等竞争者提供多币种账本、更丰富的加密选择和整合旅行工具；Trade Republic 等专业数字券商则提供大得多的投资工具集合。
            calloutType: risk
            claimRefs:
              - CP004
              - CP008
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与收入来源
        blocks:
          - type: paragraph
            body: >-
              N26 Group 通过支付手续费佣金、客户存款净利息收入和持续性消费者订阅，经营多元化数字银行模式。FY2025，N26 按其管理报告框架（与 IFRS 对齐）实现 €501.6 million 收入，较
              2024 年 €445.4 million 增长 13%。毛利同比增长 33% 至 €350.5
              million，反映平台直接成本相对交易规模下降后形成的显著经营杠杆。收入构成由两台主要引擎均衡贡献：净手续费和佣金收入为 €184.2 million，占毛利 53%；净利息收入为 €166.3
              million，占毛利 47%。按德国法定银行会计标准（RechKredV），毛收入为 €498.1 million，其中净利息收入 €191.3 million、手续费收入 €176.9
              million，但集团净利润在两种框架下相同。2026 年第一季度初步结果延续动能，实现季度收入 €130.0 million、毛利 €92.0 million 和净利润 €9.8
              million，说明变现能力延续到了下一个财政周期。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI008
