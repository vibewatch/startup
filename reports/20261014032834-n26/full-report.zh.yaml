  - id: FE001
    title: 产品架构图
    type: stack
    summary: 支撑 N26 数字银行运营、核心账本和嵌入式合作伙伴服务的多层技术栈。
    data:
      layers:
        - label: 客户体验层
          detail: iOS 和 Android 原生移动应用、渐进式 Web 应用以及生物识别设备认证
          modules:
            - 原生移动银行应用
            - Web 应用控制中心
            - 生物识别认证
        - label: API 与服务编排层
          detail: 微服务 API 网关、用户身份管理和通知基础设施
          modules:
            - API 路由网关
            - 会话与身份服务
            - 实时推送通知
        - label: 核心银行引擎层
          detail: Mambu 可组合核心子账本、存款余额处理，以及运行于 AWS 的透支引擎
          modules:
            - Mambu 存款子账本
            - 交易余额引擎
            - 集成式透支工具
        - label: 支付与清算轨道层
          detail: 直连 SEPA 清算机构、Mastercard 借记卡体系和零售 CASH26 条码网络
          modules:
            - SEPA 支付处理
            - Mastercard 借记卡轨道
            - CASH26 零售商户条码
        - label: 嵌入式合作伙伴基础设施层
          detail: Upvest 证券股票 / ETF、Bitpanda 加密托管和 Wise 跨境外汇转账
          modules:
            - Upvest 经纪与托管 API
            - Bitpanda 加密托管轨道
            - Wise 货币兑换引擎
        - label: 底层云与基础设施层
          detail: 托管于 Amazon Web Services（AWS）的横向可扩展云基础设施
          modules:
            - AWS 托管云计算
            - 高可用存储
            - 安全 VPC 网络基础设施
    approximationNotes: 架构层概念化呈现了与 Mambu、AWS、支付体系及持牌金融科技合作伙伴的已记录集成。
