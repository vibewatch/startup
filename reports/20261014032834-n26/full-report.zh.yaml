  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与账户分层
        blocks:
          - type: paragraph
            body: >-
              N26 通过双层框架获客：免费数字交易账户和分层高级订阅。平台基础是 N26
              Standard，这是提供虚拟借记卡和基础数字预算工具的免费移动账户，目标是在欧洲市场最大化零售漏斗顶部获客。为推动变现和单位经济，银行把活跃用户导入付费订阅层级，尤其是 N26 Smart、N26 Go 和
              N26 Metal。高级层级捆绑增值生活服务，包括 Allianz Assistance 承保的综合国际旅行保险、免手续费外币现金取款和专属客户支持渠道。除日常交易银行业务外，N26
              还大举进入财富积累场景：推出即时计息储蓄账户，并与 Upvest Securities 合作嵌入零碎股票和 ETF 券商服务，同时与 Bitpanda 合作提供加密交易。这些投资功能的采用高度集中于年轻群体：18
              至 29 岁的 Z 世代用户占平台全部股票和数字资产投资者的 28%，其托管资产仅在 2026 年上半年就增长 45%，显示出自主资本市场交叉销售的强劲初期牵引力。
