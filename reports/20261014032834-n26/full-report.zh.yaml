      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有来源池没有出版商定义的欧洲移动银行 TAM、覆盖 N26 活跃国家的可服务收入分母，也没有可支撑的可获取市场份额。来源提供的是可观察的边界指标：披露 Instant Savings 服务的 11 个国家、超过
              300 种加密资产、覆盖超过 100 个目的地的 eSIM，以及独立的个人和自由职业者计划系列。这些指标说明覆盖广度，而非市场价值，不能相加或换算成收入。两项第三方公司收入估算也不一致：Growjo 显示
              $358.4 million，但没有说明期间或透明方法；UpMarket 显示 2024 年 486 million，却在标题中以欧元标示、在后续归因于 Sacra
              的句子中以美元标示。货币、时点和方法差异意味着，任何一个数字都不能作为市场规模锚点，两者差额也不能当作增长。
