      - number: '6.2'
        title: 采用轨迹、存款与上限取消后的加速
        blocks:
          - type: paragraph
            body: >-
              N26 的客户指标已从注册账户总数转向与收入相关的用户数，更有纪律地衡量活跃银行关系。2021 年 10 月融资高峰时，N26 曾披露在 25 个市场拥有超过 7 million
              个注册账户；如今核心报告聚焦活跃且产生收入的关系，预计 2024 年底相关客户为 4.8 million，而 2023 年底为 4.2 million。客户存款积累一直是银行盈利拐点的主要支点，2024
              年第三季度超过 €10 billion。所有零售存款均受德国法定存款保障体系保护，每位存款人最高 €100,000，这让保守的欧洲储户更安心。N26 最近增长轨迹的关键催化剂，是 2024 年 6 月 BaFin
              完全取消监管增长限制；由于反洗钱控制缺陷，公司此前在 2021 年将每月新客户开户限制在 50,000 个，2023 年限制在 60,000 个。上限取消后，开户速度大幅提升至每月超过 200,000
              个新注册，较 FY2023 的获客速度翻倍以上，客户存款余额也迅速扩大。
