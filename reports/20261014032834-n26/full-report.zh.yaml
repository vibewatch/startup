      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              产品架构指向四类买方：对费用敏感的日常账户用户、愿意为更多控制权或旅行权益付费的消费者、选择商业计划的自雇用户，以及自主储蓄或投资者。在每类人群中，用户也可能是付款人；指定证据没有显示企业采购流程。用户可以从免费
              Standard 账户开始，再扩展到高级计划、投资交易、加密服务或旅行连接。当前披露让定价和产品广度可见，但没有说明次级卡用户转成主要工资账户的转化、留存、获客成本或产品附加率。与应用中可选项的 headline
              数量相比，这些缺失的分母对可获取收入更关键。
            claimRefs:
              - CM002
