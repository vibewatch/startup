      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              N26 可以把日常银行、储蓄、交易、加密和旅行工具放在同一界面，扩大用户参与。当前披露显示出具体杠杆：免费入门计划、与计划绑定的储蓄利率、更高层级提供免费交易额度且证券交易每笔
              EUR0.90、数百种加密资产、eSIM 覆盖，以及 2026 年推出的 Under18s。这些是广度信号，不是需求或留存的证明。采用还取决于信任、适当性和合规。N26
              明确把灵活现金基金与存款区分开，并警告可能发生资本损失。历史上，BaFin 曾要求银行强化反洗钱控制，点名 IT
              监控以及客户识别和核验。历史命令不能证明当前不合规，但说明监管执行可能限制增长，也提高了任何前瞻市场份额假设的尽调要求。
