  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              有证据支持的 N26 市场，是通过移动优先银行提供的消费者和自由职业者金融服务：活期账户、借记卡、转账、储蓄、自主投资和加密服务。边界不止于单一活期账户，因为 N26
              分别提供个人和商业计划系列，并通过银行界面分发投资产品；但它也窄于完整的欧洲全能银行市场，现有来源没有证明 N26
              当前经营公司资金管理、机构银行、抵押贷款发放或顾问式财富管理。现状替代品因此是传统银行的主账户，以及彼此分离的支付、储蓄、券商和加密应用。完整德国银行牌照支持信任和存款驱动的定位，而灵活现金基金的非存款属性也说明，邻近产品不能直接算作等价银行余额。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
