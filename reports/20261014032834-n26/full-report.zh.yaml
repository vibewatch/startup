    rows:
      - - 盈利拐点
        - N26 展现出经营杠杆：2024 年亏损 €42M，2025 年在 €501.6M 收入下实现 €1.6M 净利润，2026 年第一季度净利润达到 €9.8M。
        - 经营利润率仍然很薄（2025 年低于 2%）；盈利容易受到合规驱动的管理费用和存款成本波动影响。
        - 连续两个季度经营亏损，或监管整改成本超过 €25M。
      - - 治理专业化
        - 创始人退居二线；CEO Mike Dargan 和 CFO Marc Hess 带来数十年的德国一级传统银行及监管合规经验。
        - 2025—2026 年的高管更替造成过渡摩擦，其起因是投资者围绕 BaFin 威胁产生的摩擦，而非自愿战略调整。
        - 在 BaFin 监督下，监事会进一步离任或管理委员会出现空缺。
      - - 存款与客户基础
        - N26 持有超过 €10.5B 客户存款，拥有 5.6M 名产生收入的客户和 €170.7B 交易额，形成稳定资金来源。
        - 完全退出美国和英国零售市场后，客户获取仍局限于欧洲。
        - 存款同比流出超过 10%，或 BaFin 续延严格的月度客户开户上限。
      - - 产品与变现广度
        - 拓展 Flexible Cash Funds、加密货币、与 Upvest 合作的 ETF 交易及 Wero 即时支付，使非利息手续费收入更加多元。
        - N26 商业账户在大多数市场不面向注册法律实体和公司，使 B2B 市场覆盖受限于自由职业者。
        - SMB 公司账户成功在泛欧洲推出，或高级订阅层级的费用停滞。
    notes: 核心论点支柱将运营里程碑与结构性监管和竞争逆风进行对照。
