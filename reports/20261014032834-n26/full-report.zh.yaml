      - number: '5.2'
        title: 分层账户模块化架构与嵌入式金融服务
        blocks:
          - type: paragraph
            body: >-
              N26 的消费者和商业产品组合围绕分层订阅引擎构建，覆盖 N26 Standard、N26 Smart、N26 You 和 N26 Metal 账户 [CE005, CE006, CE007]。基础层 N26
              Standard 提供免手续费数字账户，并配备虚拟或实体 Mastercard 借记卡、实时推送通知和生物识别授权 [CE005, CE006]。更高订阅层级通过 Spaces
              开放子账户管理、多币种预算，以及由外部合作伙伴承保的生活方式保险 [CE006, CE007]。N26 并不在内部发起和生产所有非存款产品，而是采用嵌入式集成策略 [CE008]：依靠 Upvest
              Securities GmbH 执行经纪订单并托管股票、ETF 和 ETC，同时接入 Bitpanda GmbH 执行数字资产交易和加密托管 [CE008]。跨境换汇和国际汇款通过 Wise（原
              TransferWise）路由，本地零售现金存取则通过 CASH26 等零售条码通道完成 [CE007,
              CE009]。多合作伙伴策略扩大了客户钱包份额，却不必让内部资产负债表风险膨胀；代价是关键技术依赖外部金融科技 API 和金融合作伙伴 [CE008, CE011]。
