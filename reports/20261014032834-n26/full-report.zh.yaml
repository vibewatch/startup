      - number: '6.3'
        title: 客户韧性、留存风险与运营摩擦
        blocks:
          - type: paragraph
            body: >-
              尽管客户开户的收入增长动能强劲，N26 仍面临客户留存、地理持续性和用户体验摩擦等明显逆风。地理上，公司在退出多个成本高昂的非核心市场后，运营版图显著收窄：2020 年 4 月脱欧后关闭英国业务，随后于 2022
              年 1 月退出美国，立即关闭约 500,000 个美国账户。此外，激进的自动化合规措施反复损害客户信任和品牌情绪：2022 年末，超过 100
              个客户账户（包括西欧处境脆弱的乌克兰难民账户）在没有事先通知的情况下，被自动反犯罪算法突然冻结或关闭。在产品侧，零售投资扩张带来实际使用摩擦：N26
              不会为比利时、意大利等司法辖区的投资者自动申报本地预扣税，迫使个人客户自行处理复杂的跨境报税。更严重的是，公司没有电话客服，服务中断时，陷入困境的账户持有人只能依赖自动聊天机器人和邮件工单。
