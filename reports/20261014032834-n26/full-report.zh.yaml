figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 N26 从以 Papayer GmbH 名义成立，到取得银行牌照、全球扩张、接受监管执法以及重组高管层的里程碑演变。
    approximationNotes: null
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO007
      - CO009
      - CO013
      - CO014
      - CO015
    data:
      items:
        - label: '2013-08: Papayer GmbH 成立'
          date: 2013-08
          detail: Valentin Stalf 和 Maximilian Tayenthal 在柏林注册成立 Papayer GmbH，最初为青少年开发预付卡产品。
          tone: neutral
        - label: '2015-01: Number26 移动账户上线'
          date: 2015-01
          detail: 更名为 Number26，利用 Wirecard 基础设施在德国和奥地利推出通用移动银行账户。
          tone: positive
        - label: '2016-07: 获得完整德国银行牌照'
          date: 2016-07
          detail: 获 BaFin 和 ECB 授予完整德国银行牌照；开始将账户迁移至自有银行核心基础设施。
          tone: positive
        - label: '2019-01: Series D 融资，估值 $2.7B'
          date: 2019-01
          detail: 在 Insight Partners 和 GIC 领投下筹集 $300M Series D，使 N26 成为当时欧洲估值最高的移动新银行。
          tone: positive
        - label: '2021-10: Series E 轮，峰值估值 $9.0B'
          date: 2021-10
          detail: 在 Third Point Ventures 和 Coatue Management 领投下获得 $900M Series E 融资，但 BaFin 不久后施加开户上限。
          tone: warning
        - label: '2022-01: 战略退出美国和英国市场'
          date: 2022-01
          detail: 在较早退出英国市场后完成退出美国市场（关闭约 500,000 个账户），专注于欧洲核心 SEPA 市场。
          tone: neutral
        - label: '2024-09: 首个盈利季度与上限解除'
          date: 2024-09
          detail: BaFin 于 2024 年 6 月取消增长上限后，公司在 2024 年第三季度报告首个盈利季度；2024 年全年收入达到 €486M。
          tone: positive
        - label: '2026-04: CEO Mike Dargan 主导高管整顿'
          date: 2026-04
          detail: Mike Dargan 在 BaFin 审计、荷兰抵押贷款限制以及联合创始人 Stalf 和 Tayenthal 离任后接任 CEO。
          tone: critical
