        title: 展示项
        blocks:
          - type: callout
            title: 监管压力下的治理转型
            body: CEO Mike Dargan 上任后，N26 结束创始人管理，转向机构化治理。多年与 BaFin 的监管整改告一段落，战略重点也从不受约束的高速增长转向监管稳定和可守住的运营盈利。
