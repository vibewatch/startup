chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品演进与银行基础设施
        blocks:
          - type: paragraph
            body: >-
              N26 Bank SE 成立于 2013 年，总部位于柏林，是一家跨国数字银行，以移动优先模式直接服务 24 个欧盟和 SEPA 市场。公司最初以 Papayer GmbH 名义成立，之后改名
              Number26，并利用第三方基础设施；2016 年 7 月，机构从德国联邦金融监管局（BaFin）和欧洲央行取得完整德国银行牌照，建立自有核心银行基础设施，客户存款则依照德国法定存款保障体系获得最高
              €100,000 的保护。随着业务发展，N26 从基础交易账户和借记卡扩展到综合个人理财，包括计息储蓄、自动储蓄计划和加密货币交易。为拓宽财富管理产品，公司与 Upvest Securities GmbH
              合作，把股票和交易所交易基金（ETF）的执行与托管直接接入移动应用，逐步覆盖德国、奥地利及更广泛的欧洲地区，并在 2024 年年中实现运营盈亏平衡和首个盈利季度。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO010
              - CO012
      - number: '1.2'
        title: 管理层、治理改革与职工委员会关系
        blocks:
          - type: paragraph
            body: >-
              N26 由 Valentin Stalf 和 Maximilian Tayenthal 共同创立，两人曾任联席 CEO，带领公司完成早期风险融资和高速增长。随着银行扩张，组织治理持续摩擦：2020
              年末，员工动员在柏林运营实体设立正式职工委员会（Betriebsrat），尽管管理层起初在法律上反对。BaFin 长期围绕内部控制和反洗钱机制施加监管压力，最终推动了管理层重组。2025 年 8 月，联合创始人
              Valentin Stalf 在投资者担忧监管制裁之际辞去联席 CEO；Maximilian Tayenthal 随后于 2025 年 12 月退出运营层面的联席 CEO 职责，但两位创始人合计仍持有约 20%
              股权。为主导全面的机构治理清理，N26 于 2026 年 4 月任命前银行科技高管 Mike Dargan 为 CEO，配合监事会领导，把新银行从创始人管理转向成熟的机构化治理。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 融资历史、估值基准与二级股权流动性
        blocks:
          - type: paragraph
            body: >-
              N26 自成立以来通过多轮风险融资累计募集超过 $1.72 billion，投资者包括 Third Point Ventures、Coatue Management、Insight Partners、GIC
              等知名全球风险资本和成长型股权机构。公司估值在 2021 年 10 月达到高点：$900 million 的 E 轮融资将新银行投后估值推至 $9.0 billion，使 N26
              一度成为欧洲估值最高的私人金融科技公司之一。但由于此后没有新的一级股权融资或 IPO，私人股价发现只能依赖流动性低的二级经纪商平台，如 UpMarket 和 Nasdaq Private
              Market（NPM）；合格投资者在这些平台交易未注册的 IPO 前股份。尽管 $9.0 billion
              的历史估值仍是二级营销挂牌的主要参照，实际成交价已反映私人市场流动性折价、金融科技宏观估值压缩以及持续的监管整改要求。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: 战略扩张里程碑、监管执法与地理重点
        blocks:
          - type: paragraph
            body: >-
              监管干预和有序的地域收缩，贯穿 N26 激进的泛欧洲扩张。2021 年 5 月，BaFin 正式要求 N26 整改反洗钱和反恐融资控制；随后监管机构于 2021 年 6 月处以 €4.25 million
              罚款，任命特别监查员，并把每月新客户开户上限设为 50,000 个。上限后来调整至 60,000 个，并于 2024 年 6 月正式取消；但 2025 年末监管审计后，审查进一步收紧，BaFin
              重新安排外部监管人员，并限制 N26 在荷兰发放新的抵押贷款。在监管挑战之外，N26 也主动退出资本密集型非核心市场：2020 年 4 月因脱欧后的牌照复杂性退出英国，2022 年初关闭美国约 500,000
              个账户，把资本和运营资源完全集中到核心欧洲银行业务。
            claimRefs:
              - CO013
              - CO014
              - CO015
