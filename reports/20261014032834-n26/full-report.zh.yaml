      - number: '5.3'
        title: 平台扩展性、合规控制与运营缺口
        blocks:
          - type: paragraph
            body: >-
              运营泛欧洲移动银行，需要在异构支付通道上保持严格合规、信息安全和技术可靠性 [CE003, CE010]。N26 把即时锁卡、动态地理交易开关和可配置每日限额等移动端控制，与 BaFin 监管的合规控制结合起来
              [CE007, CE010]。客户存款依照德国法定存款保障体系继续受到最高 €100,000 的法律保护 [CE004, CE010]。尽管有这些技术控制，N26
              在内部欺诈检测架构、实时交易监控，以及德国监管机构此前施加监管上限后的整改历史方面，仍存在明显尽调缺口 [CE010, CE012]。此外，N26 作为面向消费者的数字银行，没有公开开发者
              API、公开代码库指标或开发者文档门户，因此实践者社区的验证仍局限于外部金融科技评论、合作伙伴案例研究和移动应用评测 [CE002, CE007, CE012]。
