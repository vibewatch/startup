      - number: '4.2'
        title: 定价架构与变现机制
        blocks:
          - type: paragraph
            body: >-
              N26 采用免费增值定价，把大众零售用户导入持续订阅层级，同时通过支付交换收入变现免费用户。基础层 N26 Standard 提供免费活期账户、虚拟借记卡功能和每月两次免费的境内 ATM 取款；实体卡收取 €10
              制卡费。变现阶梯通过付费订阅扩展：N26 Smart 每月 €4.90，N26 You 每月 €9.90（含 Allianz 旅行和生活方式保险），N26 Metal 每月 €16.90（含 18
              克不锈钢借记卡、更高 ATM 限额和最高 1.50% p.a. 的即时储蓄利率）。行业分析显示，N26 约 30%
              的相关客户为订阅层级付费，形成高毛利、经常性、类似软件的收入，缓冲零售支付量季节性。与此同时，              N26 在支付交易量上扣除处理商成本后平均获得 35 个基点的交换收入，并从 Upvest
              股票和 ETF 券商、Bitpanda 加密交易、Vodafone eSIM 电信等第三方集成中取得合作分成。
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: 单位经济、成本结构与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              N26 2025 年盈利反转的核心，是净息差扩大以及集中式数字基础设施带来的结构性运营纪律。2025 年末，N26 拥有 5.6 million 个相关客户，同比增长 16%；客户存款超过 €10.5
              billion，年度交易量增长 14% 至 €170.7 billion。按 €501.6 million 报告收入计算，相关客户年均收入（ARPU）达到 €89.57，客户平均存款余额为
              €1,875。营销效率仍依靠自然分发，估计 73% 的新客户注册来自口碑推荐。但财务尽调显示，净盈利仍极其脆弱：2025 年净利润 €1.6 million，相对 €501.6 million 收入的净利率仅约
              0.32%。尽管这一表现扭转了 2024 年 €42.0 million 的净亏损，但利润几乎没有缓冲，难以抵御运营冲击、信贷拨备变化或欧洲央行降息对客户余额资金收益的压缩。
            claimRefs:
              - CI001
              - CI004
              - CI009
              - CI010
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI004
              - CI010
      - number: '4.4'
        title: 资本充足率、监管储备与前瞻投资判断
        blocks:
          - type: paragraph
            body: >-
              N26 的资产负债表轨迹既反映历史上充足的股权资本，也反映德国银行监管机构持续施加的监管资本约束。截至 2021 年 10 月 E 轮，N26 累计募集 $1.72 billion 股权，投后估值达到 $9.0
              billion，投资者包括 Third Point Ventures、Coatue Management 和 Dragoneer。随后金融科技市场压缩和二级市场交易导致估值调整；2025
              年的报道称，市场在私下谈判约 €400 million 的 F 轮重组，估值约降至 $3.0 billion，以便让 2021 年初投资者调整保证回报契约。对投资判断而言，关键变化发生在 2025 年 12
              月：BaFin 任命特别监查员、要求提高金融资本储备，并因风险和投诉管理缺陷禁止在荷兰新增抵押贷款。这些监管要求抬高资本充足率门槛，压低股本回报率；在建模股息或扩张能力前，必须确认资本缓冲稳妥高于法定最低要求。
            claimRefs:
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从依赖交换收入转向净利息杠杆
            body: >-
              N26 在 FY2025 实现净盈利，说明公司从依赖支付交换收入转向资产负债表变现。净利息收入增长 49% 至 €166.3 million，在 €10.5 billion 客户存款支撑下贡献毛利的
              47%。但由于净利率只有 0.3%，盈利能力仍高度敏感于欧洲央行利率变化。
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI010
          - type: callout
            title: 监管资本缓冲与合规拖累
            body: >-
              BaFin 在 2024 年年中取消 N26 的月度开户增长上限，但 2025 年 12
              月的监管干预仍引入外部监查员、额外资本储备要求和荷兰抵押贷款禁令。更高的资本要求限制运营灵活性和分红能力，潜在投资者需要在评估扩张前核实前瞻资本充足率。
            calloutType: risk
            claimRefs:
              - CI011
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 云原生核心银行与运营架构
        blocks:
          - type: paragraph
            body: >-
              N26 是一家持牌数字银行，其软件栈和基础设施已从早期白标赞助银行后端迁移到敏捷、可组合的云架构。2016 年初，在申请 BaFin 和欧洲央行独立欧洲银行牌照之后，N26 将核心交易账本迁移到托管于
              Amazon Web Services（AWS）的 Mambu 云原生平台 [CE001, CE002]。该可组合架构充当 N26 的核心子账本，负责存款账户、交易处理和透支服务，使新银行能够在 24
              个欧洲司法辖区处理每月数千万笔交易 [CE002, CE003]。把账户账本和余额管理抽象到横向可扩展的云平台后，N26 建立了敏捷部署节奏，把快速移动端功能发布与受监管的核心账簿余额操作解耦 [CE002,
              CE004]。但在第三方超大规模云服务商和托管 SaaS 平台上运行关键银行基础设施，也使运营依赖外部平台可靠性和云服务提供商 [CE002, CE011]。
            claimRefs:
