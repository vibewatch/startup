  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 按顺序评估 N26，从运营规模和监管约束一路推导至估值校准和投资建议。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV010
      - CV013
      - CV014
    data:
      nodes:
        - id: scale-monetization
          label: 运营规模与盈利能力
          detail: 2025 年收入 €501.6M（同比 +13%），首个盈利年度（净利润 €1.6M）；2026 年第一季度利润 €9.8M
        - id: regulatory-friction
          label: 监管治理与 BaFin 审计
          detail: BaFin 加强监督、特别监管员和荷兰抵押贷款禁令，由经验丰富的银行高管部分抵消
        - id: market-footprint
          label: 地域与产品边界
          detail: 退出英国 / 美国后聚焦 24 个欧洲市场；以自由职业者为重点，并在德国试点 SMB
        - id: private-market-pricing
          label: 估值倍数发现
          detail: 2021 年 Series E $9B 峰值估值已被 2023 年 Allianz 二级出售（约 $3B）和缺乏流动性的 IPO 前市场折价
        - id: risk-adjusted-valuation
          label: 公允价值锚点（€2.8B–€3.4B）
          detail: 基准情景 5.0x–6.0x 收入倍数，反映一家受监管遗留问题拖累但已盈利的欧洲新银行
        - id: investment-decision
          label: 建议：Research-More / Hold
          detail: 运营进展具有吸引力，但缺少经审计的 2026 全年数据和股权结构表透明度
