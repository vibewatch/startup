        title: Landscape and Buyer Jobs
        blocks:
          - type: paragraph
            body: >-
              Gamma's competitor set is wider than the phrase "AI presentation maker" implies. The direct peer group
              includes Beautiful.ai, Presentations.AI, Plus AI, SlidesAI and other prompt-to-deck products; the
              incumbent group is Microsoft PowerPoint and Google Slides; the adjacent design group is Canva, Figma
              Slides and Adobe Express; the substitute group includes Prezi's spatial format, Pitch's collaborative
              workspace, and internal template/build workflows. Gamma's strongest wedge is rapid first-draft creation
              and web-native sharing, but most buyers still evaluate the output against familiar file, suite and
              brand-governance constraints. That means the category's competitive boundaries are defined by the job—turn
              an idea into a persuasive visual artifact—rather than by tool taxonomy. The relevant diligence lens is
              therefore buyer workflow fit: individual creators reward speed, teams reward brand discipline, enterprises
              reward governance, and embedded-suite users reward continuity with tools already procured by IT. This
              framing also separates current alternatives from historical examples and prevents over-weighting products
              that no longer serve the presentation job. Tome's exit from active presentation competition is a useful
              caution that category excitement does not guarantee durable monetization.
