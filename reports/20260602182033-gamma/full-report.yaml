  productSummary: >-
    Gamma sells an AI-native visual-content creation platform spanning presentations, documents, and webpages. Users
    describe what they need in natural language and the platform generates professional, responsive card-based output in
    seconds. Core modules include the AI deck builder, Gamma Agent (conversational AI that browses, refines, and
    restylesdecks), Gamma Imagine (AI image generation for marketing assets), and a public API connecting Gamma to
