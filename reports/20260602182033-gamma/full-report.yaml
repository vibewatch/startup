      - number: '8.4'
        title: Scenario Analysis and Return Modeling
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the investment return range across the most plausible enterprise trajectory paths
              for Gamma through 2028. In the bull scenario, Gamma achieves $250M ARR by 2028 driven by enterprise seat
              expansion with NDR above 120%, raises a Series C or executes an IPO at 18–22× ARR, and delivers an exit
              value of $4.5B–$5.5B. This requires demonstrating Figma-class enterprise retention metrics and displacing
              significant Microsoft PowerPoint enterprise usage—achievable but not yet evidenced at scale. In the base
              scenario, Gamma reaches $175M ARR by 2028 with moderate enterprise traction and NDR of 105–115%, exits at
              12–16× ARR, and delivers a $2.1B–$2.8B exit value, implying roughly flat to modest returns from the $2.1B
              Series B cost basis. The base case depends on Gamma successfully transitioning its SMB-heavy customer base
              into enterprise accounts before Microsoft Copilot achieves full feature parity. In the bear scenario,
              competitive displacement accelerates, ARR growth slows to $120M by 2028, and the valuation multiple
              compresses to 6–9× as the market re-rates AI content tools toward non-AI-native SaaS comps, implying a
              $720M–$1.1B exit and a 50–65% loss from cost basis. The key bifurcation between the bull and bear cases is
              the NDR threshold: if enterprise NDR exceeds 120%, premium multiples are likely sustained; if it falls
              below 100%, multiple compression is near-certain. As Daily Moss and other adverse analysts have noted, AI
              mega-round valuations from late 2025 create significant down-round risk if companies fail to prove
              enterprise durability within 12–18 months.
            claimRefs:
