      - number: '7.4'
        title: Financial and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Gamma's operational profitability as of late 2025 mitigates near-term burn risk, but the company's
              financial risk profile remains elevated by structural factors. The freemium funnel that drove 70 million
              users serves predominantly free-tier or low-ARPU SMB accounts; industry data shows SMB SaaS churn rates of
              40% annually (4.2% monthly) versus 8.1% for enterprise accounts above $100K ACV. Gamma's revenue
              concentration in this high-churn segment creates fragility: a meaningful shift in AI tool preference or a
              competitor offering a lower free tier could trigger rapid free-user defection. The 2026 Grip Security SaaS
              AI governance report identifies governance gaps in AI-integrated SaaS environments, including Gamma's
              integration surface, where AI risk propagates through connected workflows without clear vendor
              accountability boundaries. Trustpilot data from January 2026 shows Gamma rated "Bad" at 1.7/5 based on
              user complaints about subscription billing failures, account portability issues, and unresponsive customer
              support—signals of customer-facing operational gaps that could accelerate enterprise rejection. Service
              uptime has been 100% across all monitored components as of June 2026 per the status page, but enterprise
              SLAs demand documented disaster recovery and business continuity plans that Gamma has not publicly
              disclosed. G2 reviews highlight that AI-generated images sometimes have illegible embedded text requiring
              manual correction, pointing to AI output quality variability risk. Financial valuation risk is compounded
              by public-market compression of SaaS multiples for companies perceived as AI wrappers; Gamma's 21× ARR
              multiple at its November 2025 raise is vulnerable to repricing if enterprise penetration stalls.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
