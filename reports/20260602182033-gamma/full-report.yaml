              standard for enterprise communication. PPTX export compatibility is a procurement gate that Gamma
              currently fails to pass for many enterprise deals. This is not a technical gap that can be resolved in a
              single product sprint; the mismatch is architectural (card-based responsive web vs. slide-grid PPTX).
