  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Output Formats
        blocks:
          - type: paragraph
            body: >-
              Gamma delivers content across four output types—presentations, interactive documents, webpages, and social
              graphics—all produced from natural-language prompts through its AI generation engine. The platform's
              foundational design choice is the card-based, scrollable format, which replaces the linear slide paradigm
              and enables inline embeds (video, live data, polls, branching paths) that are impossible in PowerPoint or
              Keynote. As of March 2026, the platform was approaching 100 million registered users globally, with more
              than 80 percent outside the United States, underlining its international-first traction. The content
              library includes 100-plus professionally designed, AI-native remixable templates that adapt to
              user-supplied content with a single command, eliminating the blank-page friction that plagued legacy
              tools. Gamma Agent, shipped in 2025, acts as a conversational AI design partner embedded directly in the
              editing surface, enabling users to restructure, condense, or redesign entire presentations through
              natural-language instructions. The platform supports AI-generated images via multiple image models and
              integrates brand kits on paid plans so teams can enforce visual identity without a dedicated design
              function. Outputs are shareable as live web links with built-in view analytics, or exported to PDF and
              PowerPoint, though reviewers consistently note that PowerPoint exports flatten text into static images and
