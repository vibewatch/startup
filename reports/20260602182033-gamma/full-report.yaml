  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Priority
      - Diligence Ask
      - Why It Matters for Valuation
      - Decision Impact
      - Who to Ask
    rows:
      - - 1 – Critical
        - 'Net dollar retention (NDR) by cohort: enterprise (>$10K ACV), mid-market, SMB, and free-to-paid'
        - >-
          NDR is the single most important predictor of SaaS premium multiples; Figma's 130%+ NDR justified 22× ARR at
          IPO; without NDR data, Gamma's 21× multiple is unvalidated
        - Thesis break if enterprise NDR <100%; bull case confirmed if NDR >120%
        - Gamma CFO or VP Finance; request cohort analysis by customer segment and year of acquisition
      - - 2 – Critical
        - 'Gross margin by segment: overall, AI inference costs as % of COGS, and trend 2023–2026'
        - >-
          AI inference cost trajectory determines whether Gamma's profitability is durable or eroding; the shift from
          OpenAI to self-hosted models would improve margins but is unconfirmed
        - Multiple compression if gross margins below 65%; bull case if AI inference costs declining as % of COGS
        - Gamma CFO; request audited or management-reviewed P&L by segment
      - - 3 – High
        - >-
          Series B cap table: post-closing ownership table including all secondary transfers, vesting schedules for
          founders and key employees, option pool size and utilization
        - >-
          The $20M secondary component in the Series B suggests partial liquidation by early investors; cap table
          clarity prevents adverse selection and hidden overhang
        - Essential for modeling dilution impact on investor returns in any exit scenario
        - Gamma legal counsel or CFO; standard VC data room item
      - - 4 – High
        - >-
          AI model fallback architecture and provider contract terms: which models, what pricing tiers, and fallback
          logic if primary model is deprecated or repriced
        - >-
          Gamma claims 20+ AI models; no public documentation confirms a model-switching or cost-management
          architecture; API pricing changes flow directly to gross margins
        - If no fallback architecture exists, gross margin risk is acute if OpenAI or Anthropic raise prices
        - Gamma CTO or VP Engineering; request technical architecture overview and model provider contracts
      - - 5 – Material
        - EU AI Act compliance roadmap and GDPR processor agreements for EU-based users
        - >-
          EU AI Act GPAI obligations are active from August 2025; non-compliance fines reach 7% of global turnover;
          Gamma's EU user base creates regulatory exposure
        - Potential regulatory liability that could impair European market expansion and create investor liability
        - Gamma General Counsel; request EU AI Act readiness assessment and DPA template
    notes: >-
      Priority levels (Critical, High, Material) reflect decision-criticality for the investment thesis. Critical items
      would change the invest/pass recommendation if adverse; Material items affect pricing and risk adjustment. All
      asks are standard institutional diligence items for late-stage private SaaS investments.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV029
