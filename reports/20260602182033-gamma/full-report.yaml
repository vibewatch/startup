      - number: '8.3'
        title: Comparable Company Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              The AI-enabled SaaS market provided multiple anchor points for Gamma's valuation in the first half of
              2026. Figma's April 2026 IPO at approximately $42/share, implying ~$24B fully diluted on ~$1.1B ARR,
              established a 22× ARR multiple as the public-market benchmark for design-category workflow software with
              strong enterprise retention (130%+ NDR, 88-91% gross margins per the S-1 filing). Canva's $42B secondary
              valuation on estimated $3.3B ARR implies ~12.7×—a lower multiple reflecting Canva's revenue scale diluting
              the growth premium. Notion's 2026 implied valuation of ~$18.5B on ~$500-600M estimated ARR implies 30-37×,
              a significant premium reflecting deeper workflow lock-in and enterprise multi-product exposure. Against
              the private-market cohort, saasrise.com's AI Software Valuation Report 2026 analyzed 575+ private
              companies and found AI-native SaaS commands a median VC multiple of 21.2×, directly validating Gamma's
              Series B pricing as consistent with its peer cohort. AI-enabled (non-native) SaaS commands 8.5× VC and
              7.0× M&A; legacy SaaS commands 5.5× VC and 3.8× M&A. iMerge Advisors' Q1 2026 report sets public SaaS
              multiples at 4.0–5.5× ARR for non-AI companies. The implication: Gamma's current 21× is neither anomalous
              nor artificially inflated—it is the market clearing price for AI-native SaaS with documented $100M ARR.
              The risk is that this multiple is borrowed from the category premium rather than earned through enterprise
              workflow depth, creating valuation fragility if enterprise penetration stalls.
            claimRefs:
              - CV021
