      - number: '3.3'
        title: Switching Costs, Distribution Power, and Lock-in
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive moat in the category belongs to incumbents, not to any AI-native startup.
              Microsoft and Google already own the document repositories, admin consoles, identity layers and training
              muscle memory that determine how many enterprises create and approve presentations. Canva adds a different
              distribution vector: an all-purpose visual content suite that can absorb light presentation jobs without
              requiring another subscription. Gamma's web-native format reduces friction for link sharing, but it also
              creates a governance question for buyers that standardize on PPTX, Slides, templates or internal approval
              workflows. Export support helps, yet it does not fully erase the buyer's fear that a Gamma deck will need
              repair before board, client or regulated use. Switching costs are therefore asymmetric: Gamma is easy to
              try, while incumbents are hard to displace. That asymmetry makes bottoms-up viral distribution valuable
              but not sufficient for enterprise durability.
