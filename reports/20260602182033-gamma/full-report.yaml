      - number: '5.4'
        title: Integration Ecosystem and Developer Platform
        blocks:
          - type: paragraph
            body: >-
              Gamma launched its public REST API at v1.0 general availability in November 2025 at
              https://public-api.gamma.app/v1.0/, replacing the v0.2 beta that was deprecated and disabled in January
              2026. The API supports programmatic generation from text, generation from templates, async status polling,
              theme and folder listing, gamma archiving, and deletion. Authentication uses a custom X-API-KEY header;
              API access requires a Pro, Ultra, Teams, or Business plan. The developer docs also describe an MCP (Model
              Context Protocol) server that enables AI tools to create and read gammas using OAuth with Dynamic Client
              Registration, making Gamma accessible to any MCP-compatible AI assistant without requiring a traditional
              API key setup. On the no-code and low-code side, 2026 brought native automation integrations on Zapier,
              Make, and n8n (all at full v1.0 API parity), plus connectors inside ChatGPT (March 6, 2026), Claude
              (January 2026), Grok (May 2026), Atlassian Rovo, Superhuman Go, and Profound. An official npm
              package—@gammatech/n8n-nodes-gamma—enables self-hosted n8n deployments to generate Gamma content
              programmatically. The breadth of the integration surface reduces workflow switching costs for existing
              users of major productivity platforms and provides a distribution channel across ChatGPT's and Claude's
