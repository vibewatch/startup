      - number: '7.5'
        title: People, Execution, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Gamma's execution risk is concentrated along two axes: key person dependency and team-size constraints.
              Grant Lee is the co-founder, CEO, and sole prominent public figure of Gamma; the company's product
              strategy, investor narrative, and growth model are publicly articulated through his leadership. A
              Stanford-trained engineer whose prior roles were COO at ClearBrain and CFO at Optimizely, Lee brings
              product and finance excellence but has limited track record in enterprise sales leadership—a gap that
              matters as Gamma pursues upmarket enterprise growth. With approximately 50 employees at $100M+ ARR,
              Gamma's per-capita productivity is exceptional but leaves the company operationally fragile: hiring
              freezes, turnover in the small engineering team, or the loss of key AI/ML engineers would materially slow
              product velocity. Gamma has no publicly disclosed patent portfolio, creating IP exposure relative to
              Microsoft, Google, and Adobe, which hold extensive AI and design IP assets. The Gamma Terms of Use cap
              vendor liability following industry-standard patterns, but this provides limited downside protection for
              enterprise customers relying on Gamma for mission-critical communications. The mitigation and kill
              criteria table below defines the monitorable triggers and threshold events that would indicate
              thesis-break risk, translating each major risk category into a concrete investment action implication.
