  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Security and Platform Abuse Risks
        blocks:
          - type: paragraph
            body: >-
              Gamma's trusted domain status—a competitive advantage for user trust—has become a material security
              liability. Threat actors have weaponized Gamma's platform to create convincing phishing redirect pages
              that impersonate Microsoft SharePoint login portals, exploiting the gamma.app domain's high reputation to
              bypass enterprise email security filters. The attacks use an adversary-in-the-middle (AiTM) framework that
              allows real-time credential harvesting and session-cookie theft, enabling bypass of multi-factor
              authentication. Cloudflare Turnstile CAPTCHA is inserted mid-chain to prevent automated security scanning,
              further complicating detection. Because gamma.app is relatively new and often whitelisted by corporate
              security teams, the phishing chain enjoys unusually high delivery rates. Enterprise IT departments
              confronted with documented Gamma-hosted phishing campaigns may choose to block gamma.app links at the
              firewall level, creating an adoption ceiling for the enterprise segment Gamma most needs to grow. Gamma's
              Privacy Policy governs user-generated content including presentations and associated metadata;
              international transfers are processed under standard contractual clauses, but gaps in GDPR enforcement
              risk remain given Gamma's EU user base. Gamma's Terms of Use limit the company's indemnification
              obligations for harms caused by third-party misuse of its platform, but enterprise procurement teams will
              scrutinize platform abuse history in security reviews. The operational security register captures these
              failure modes, ranked by residual exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
