              - CE011
          - type: callout
            title: PowerPoint Export Fidelity Is a Recurring Enterprise Blocker
            body: >-
              Independent reviews from G2, Trustpilot, Deckary, and AiWithIt consistently identify PowerPoint export as
              the product's most significant limitation. Text is flattened to static images, animations are lost, and
              formatting inconsistencies require manual cleanup. In consulting, finance, legal, and enterprise
              environments where editable PPTX delivery is a contractual requirement, this converts a speed advantage
              into a workflow blocker. Gamma has not published a roadmap commitment to resolving export fidelity.
            calloutType: risk
            claimRefs:
              - CE007
              - CE037
              - CE038
          - type: callout
            title: SOC 2 Absence Constrains Regulated-Sector Enterprise Sales
            body: >-
              Gamma's SOC 2 Type II attestation is in progress but not yet complete. Many regulated-sector and
              enterprise procurement processes require a current audit report as a mandatory vendor qualification. Until
              Gamma completes and publishes its SOC 2 report, sales cycles in healthcare, financial services, and
              government markets will face compliance-gate friction that better-certified competitors (Salesforce,
              Microsoft, and Notion) do not encounter.
            calloutType: risk
            claimRefs:
              - CE032
          - type: callout
            title: Gamma Imagine Pivots the Platform's Competitive Frame
            body: >-
