  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Gamma operates a credit-based freemium model that effectively bridges consumer pricing with B2B SaaS value
              delivery. Users begin on a free tier that provides 400 lifetime AI credits — enough for approximately 8–10
              full deck generations — before hitting a hard paywall that drives upgrade decisions. This lifetime credit
              ceiling, introduced in late 2024, replaced an earlier monthly-reset approach and is more restrictive,
              creating a stronger conversion forcing function. Paid individual tiers run from $8–10/month (Plus) through
              $18–25/month (Pro) to $100/month (Ultra), while team tiers start at $20/seat/month (Team) and
              $40/seat/month (Business). The credit system meters usage by function: a standard 10-slide deck generation
              costs 40 credits, AI image generation costs 2–40 credits depending on quality, and content refinements
              cost 5–10 credits each. Revenue streams include subscription revenue from individual plans, seat-based
              revenue from team and business plans, and nascent API-access revenue from the Pro and higher tiers. Gamma
              has not disclosed a revenue breakdown by segment, but Sacra estimates the platform had over 600,000 paying
              subscribers at Series B close, with the bulk on Plus or Pro individual plans. Enterprise upsell via Team
              and Business plans is the highest-priority growth vector heading into 2026, with SOC 2 Type II compliance
              and SSO unlocking larger contract sizes.
