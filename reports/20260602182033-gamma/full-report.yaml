      - number: '1.4'
        title: Scale, Metrics, and Milestones
        blocks:
          - type: paragraph
            body: >-
              As of November 2025, Gamma reported $100 million ARR, 70 million total users, and more than 600,000 paying
              subscribers. The company has been profitable since 2023 and was already profitable when it crossed $50
              million ARR in May 2025 with approximately 30 employees. Sacra estimated ARR at approximately $102 million
              in October 2025 with 365 percent year-over-year growth in 2024 from a base of approximately $30.5 million.
              The ARR trajectory accelerated sharply: $32.5 million by December 2024, $50 million by May 2025, and $100
              million by November 2025—a doubling in six months. Users have collectively created more than 400 million
              presentations, documents, and websites on the platform, with more than 1 million new pieces of content
              generated per day. India is the fastest-growing market with 9.5 million users, achieved without direct
              marketing spend, and the company plans a local Asia-Pacific presence in 2026. With approximately 52
              employees at $100 million ARR, revenue per employee is approximately $1.9 million. At the $2.1 billion
              valuation against approximately $102 million ARR, the implied revenue multiple is approximately 21x ARR.
              In late 2022, Gamma had roughly 60,000 total users and about one year of runway before the all-in AI pivot
              that changed the company's trajectory.
