      - number: '5.6'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Gamma's published security posture is centred on Google Cloud Platform hosting, zero-trust access
              controls, TLS 1.2-plus encryption in transit, AES-256 encryption at rest with scheduled key rotation, and
              OAuth 2.0 revocable token authentication. The company is actively pursuing SOC 2 attestation covering the
              five Trust Service Criteria—Security, Availability, Processing Integrity, Confidentiality, and Privacy—but
              had not completed the certification as of the report date. Gamma's Help Center groups its published
              compliance documentation under three topics: Privacy Policies, data protection practices, and DMCA and
              copyright compliance. Separately, the developer portal documents that the MCP server authenticates AI-tool
              access via OAuth with Dynamic Client Registration, providing a standardised and auditable access path for
              third-party AI integrations. The absence of a completed SOC 2 Type II certification is a material
              procurement risk: many enterprise and regulated-sector customers require a current audit report before
              approving vendors. Gamma's privacy documentation also does not yet confirm GDPR-specific data-residency
              controls for EU users, and the Help Center note that EU launch status is unspecified raises questions for
              European deals. Gamma's status page publicly documents service availability across Website, Web
              Application, API, Multiplayer, Site Hosting, and AI components, providing basic uptime transparency but
              lacking SLA commitments. Incident transparency could be strengthened with structured post-mortems and
              defined RTO/RPO targets for enterprise contracts.
