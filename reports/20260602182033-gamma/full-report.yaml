      - number: '6.4'
        title: Retention, Durability, and Satisfaction
        blocks:
          - type: paragraph
            body: >-
              Gamma does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or explicit
              churn rates, creating a significant diligence gap. In the absence of these metrics, the available signals
              are review platform ratings across five channels, billing complaint patterns, and the implied engagement
              proxy of 1 million daily content creations. Review platform ratings reveal a bifurcated customer base:
              business and professional users on G2 (4.1/5 from 23 reviews) and FeaturedCustomers (4.8/5 from 422
              reference points) express high satisfaction with speed, AI quality, and template variety, while Trustpilot
              (1.6/5 from 88 reviews)—skewed toward billing disgruntled users—surfaces a pattern of complaints about
              automatic renewals, a tight 3-day refund window, charges after cancellation requests, and unresponsive
              customer support. ChatSlide's cancellation guide for Gamma users documents that Gamma requires users to
              navigate multiple steps to cancel and offers no pause option, reinforcing a retention-by-friction dynamic
              rather than retention-by-satisfaction. Plisio's independent 2026 review rates Gamma at approximately 2.0/5
              on Trustpilot but 4.3/5 on the Microsoft Store—suggesting the Trustpilot population skews toward billing
              complainants rather than active product users. Knoji aggregates 31 reviews with a 3.9/5 overall score as
              of June 2026. The high-frequency daily creation metric (1M items/day) is encouraging as a stickiness
              proxy, but it cannot substitute for cohort retention data. The Capterra Canada review from a student user
              (November 2024) and the Capterra US reviews (3.8/5 from 4 reviews) both suggest Gamma is primarily a
              positive experience for individual and educational users when billing is not a factor. Industry SaaS
              benchmarks for SMB-focused tools suggest annual gross retention of 80–90% is typical; without Gamma's own
              data, we cannot assess whether it meets, exceeds, or falls below this floor.
