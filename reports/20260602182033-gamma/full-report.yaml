companyProfile:
  summary: >-
    Gamma is a San Francisco-based AI presentation, document, and webpage creation platform founded in November 2020 by
    Grant Lee (CEO), James Fox (President), and Jon Noronha (CPO) — all former colleagues at Optimizely. The product
    replaces manual slide-deck formatting with a prompt-driven generation workflow that outputs responsive, web-native
    visual content shareable as links. A freemium credit model drives user acquisition; paid plans (Plus, Pro, Ultra,
    Team, Business) convert active users into subscribers. The company reached $100M ARR in November 2025 on
    approximately $23M of primary capital — among the most capital-efficient growth trajectories in SaaS history — and
    has been profitable since 2023. A $68M Series B led by Andreessen Horowitz at a $2.1B valuation closed in November
    2025, bringing total capital raised to roughly $90M. Product expansion into Gamma Agent, Gamma Imagine, and a public
    API positions the platform as a full AI visual-storytelling suite beyond its original slide-generation roots.
