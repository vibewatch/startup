        title: Cost Structure and Gross Margin Analysis
        blocks:
          - type: paragraph
            body: >-
              Gamma's cost structure is dominated by AI inference and cloud infrastructure, followed by R&D (engineering
              headcount), customer support, and security compliance overhead. The company runs on Google Cloud Platform,
              with AI inference costs driven by third-party model APIs (likely OpenAI and others) plus Gamma's own
              fine-tuned layers. Gross margin is not publicly disclosed, but based on the AI-SaaS cost profile and
              Gamma's profitability, independent estimates place it in the 70–85% range — consistent with
              software-native AI SaaS platforms that rely on model APIs rather than owning foundation model
              infrastructure. Capital expenditure is minimal: Gamma has no hardware, no manufacturing, and no physical
              inventory. Working capital dynamics are favorable: subscriptions are prepaid (annual plans) or billed
              monthly in advance. There are no disclosed debt or project-finance obligations. The transition from a
              predominantly individual/SMB subscriber base to enterprise accounts (Team and Business tiers) is expected
              to reduce gross margin slightly due to higher customer success and security compliance costs, but offset
