      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Gamma was co-founded by Grant Lee (CEO), James Fox (President), and Jon Noronha (CPO), all former
              colleagues at Optimizely, a B2B experimentation software company. Grant Lee holds a mechanical engineering
              degree from Stanford University and worked in investment banking and consulting before joining Optimizely
              and co-founding Gamma. The founding insight came during Lee's 2020 advisory work, when he found himself
              spending roughly 90 percent of his time formatting slide decks rather than developing substantive content.
              The three founders built the initial product inside a converted two-bedroom apartment in San Francisco
              during COVID-19 shelter-in-place. Their shared Optimizely background instilled an experimentaton-driven
              culture that the company credits for its rapid product evolution. With approximately 52 full-time
              employees generating $100 million ARR as of November 2025, Gamma achieves roughly $1.9 million in revenue
              per employee—among the highest in the productivity SaaS category. The leadership team beyond the three
              founders is not publicly enumerated in official releases; an evidenceGap covers the remaining team
              composition. Governance is standard private-company structure with a board inclusive of Andreessen
              Horowitz, Accel, and the founding team following the Series B.
            claimRefs:
