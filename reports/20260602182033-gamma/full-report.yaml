      - number: '7.2'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Gamma faces a layered and rapidly evolving regulatory and legal risk stack. The EU AI Act, published in
              the Official Journal on July 12, 2024, classifies general-purpose AI systems with widespread deployment
              obligations; Gamma's AI-generated presentation platform arguably qualifies as a general-purpose AI system
              subject to transparency, documentation, and incident reporting requirements. Non-compliance fines can
              reach 7% of global annual turnover for the most critical provisions. As of June 2026, Gamma's public
              compliance documentation with the EU AI Act's general-purpose AI obligations is minimal, creating
              enforcement exposure in the EU market where Gamma has disclosed meaningful user growth. GDPR compliance
              obligations apply to Gamma's European users including cross-border data transfer requirements; Gamma's
              Privacy Policy acknowledges international transfers but does not detail transfer mechanisms beyond
              standard contractual clauses. On AI copyright, the US Supreme Court's March 2026 denial of certiorari in
              Thaler v. Perlmutter confirmed that AI-generated content requires human authorship to qualify for
              copyright protection; this narrows Gamma's ability to assert copyright in AI-generated outputs on behalf
              of users. The 2026 Bartz v. Anthropic settlement for $1.5 billion demonstrated existential liability
              exposure for AI training data provenance, and while Gamma's primary exposure is at the content-generation
              layer (not model training), its upstream AI providers face ongoing multi-billion-dollar copyright
