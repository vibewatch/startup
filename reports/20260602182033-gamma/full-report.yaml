      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >-
              Gamma has raised approximately $87–91 million in total primary and secondary capital across three
              disclosed rounds. The $7 million seed closed in October 2021 led by Accel, with notable angels including
              Zoom CEO Eric Yuan and former LinkedIn CEO Jeff Weiner, plus founders of Airtable, Patreon, Segment, and
              Honey. Institutional seed co-investors included Script Capital, South Park Commons, LocalGlobe, Afore
              Capital, and Hustle Fund. The $12 million Series A followed in May 2024, again Accel-led, with Script
              Capital, Lorimer Ventures, South Park Commons, and Fellows Fund participating. The headline event was the
              November 2025 Series B: $68 million led by Andreessen Horowitz at a $2.1 billion valuation, with Accel,
              Uncork Capital, South Park Commons, and Script Capital participating. The round included a $20 million
              secondary component providing liquidity for early employees. Sarah Wang, General Partner at a16z, led the
              investment and publicly identified herself as a Gamma power user. The most significant capital efficiency
              signal in Gamma's history is the ratio between primary capital raised and ARR achieved: before the Series
              B, the company had raised approximately $23 million in primary capital while growing to $100 million ARR—a
              roughly 4.3x return on capital deployed into the business before any Series B dilution.
