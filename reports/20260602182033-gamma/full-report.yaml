      - number: '7.3'
        title: Competitive Displacement and Partner Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Gamma's core value proposition—AI-powered presentation creation—sits in a product category that Microsoft
              and Google are actively integrating natively into their incumbent productivity suites at no incremental
              cost to subscribers. Microsoft Copilot is now embedded in PowerPoint for Microsoft 365 subscribers,
              replicating many of Gamma's AI content-generation features within the tool that already dominates
              enterprise presentations globally. Google Slides with Gemini integration provides a parallel competitive
              threat. Bain's 2025 technology report identifies AI tools operating in low-proprietary-data,
              low-workflow-embedded categories as facing AI cannibalization; Gamma's Avataar Ventures displacement
              framework score places it in the "basic wrapper" quadrant (high AI penetration potential, limited
              proprietary data moat), where comparable companies trade at 1–2× EV/NTM revenue versus the 6–8× that
              data-moated, workflow-embedded SaaS companies command. Gamma's stated use of "20+ AI models for
              highest-quality output" creates multi-vendor dependency; pricing changes, API deprecations, or model
              quality drift from providers like OpenAI or Anthropic flow directly into Gamma's product quality and cost
              structure. The dependency map (FR003) and risk transmission map (FR002) illustrate how these upstream
              risks propagate through Gamma's business model to revenue and valuation outcomes. The partner and
              dependency risk register quantifies these exposures.
            claimRefs:
              - CR015
              - CR016
              - CR017
