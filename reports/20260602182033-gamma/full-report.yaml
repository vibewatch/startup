      - number: '6.5'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Gamma's expansion strategy relies on three mechanisms: AI credit exhaustion pushing individual users to
              paid tiers, team collaboration needs triggering workspace/Teams upgrades, and API demand from enterprise
              automation buyers. The Gamma for Teams plan and the Ultra tier with API access represent the primary
              upsell vectors. Expansion revenue depends heavily on whether individual-user adoption within enterprises
              translates into centralized IT procurement—a step that requires SOC 2 compliance, SSO, and brand control
              features that Gamma's lower tiers do not fully satisfy. Concentration risk is multi-dimensional: India
              represents 14% of the user base but a disproportionately low revenue contribution given its
              price-sensitive user profile; the United States likely contributes a disproportionately high share of
              revenue relative to its user share. The freemium funnel is acutely concentrated: approximately 99% of
              registered users are non-paying, meaning the entire ARR base sits in less than 1% of accounts. No
              disclosed information exists about top-10 customer revenue concentration or any single account
              contributing more than 1% of ARR. Channel dependence is currently low—Gamma sells primarily direct and
              self-serve, with JPMorgan's partner discount offer representing the only publicly known channel
              arrangement. The virality-driven organic growth model reduces customer acquisition cost but creates
              geographic concentration (US, India, Brazil) and segment concentration (prosumer/startup-heavy) that may
              limit enterprise ARR scale-up velocity. Any decay in viral referral rates—driven by competitor launches,
              AI fatigue, or free-tier restrictions— could slow new user intake without a paid acquisition channel to
              compensate.
