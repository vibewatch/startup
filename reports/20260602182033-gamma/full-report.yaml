      - number: '6.2'
        title: Adoption Trajectory and Growth
        blocks:
          - type: paragraph
            body: >-
              Gamma's user growth is a case study in product-led viral adoption. The platform launched in public beta in
              2022 with approximately 60,000 users; the March 2023 AI relaunch triggered explosive growth, adding 10
              million users in the following nine months. By November 2025, Gamma reported 70 million registered users
              globally, with content creation exceeding 400 million cumulative items and surpassing 1 million new items
              per day—a frequency metric that proxies habitual engagement. The platform reached $100 million in annual
              recurring revenue profitably, with approximately 600,000 paying subscribers representing an estimated
              0.86% freemium-to-paid conversion rate—below the typical 2–5% SaaS industry benchmark. This below-average
              conversion rate is structurally consistent with a consumer-grade, low-friction free tier where users
              derive significant value without upgrading. India emerged as Gamma's fastest-growing market with 9.5
              million users by April 2025, driven entirely by organic and viral sharing rather than paid marketing—a
              signal of strong product-market fit in price-sensitive emerging markets. Brazil and Australia are
              secondary international growth markets, with Asia collectively accounting for approximately 25% of the
              user base. JPMorgan's startup banking division validated Gamma's enterprise-adjacent trajectory by
              offering Gamma discounts to its startup clients, indicating that established financial institutions view
              Gamma as a credible tool in the startup stack. The Harvard Business School produced a 24-page case study
              on Gamma in 2026, further confirming the company's relevance as a studied market disruptor. The high daily
              creation rate (1M items/day) implies a base of highly active users, but Gamma does not disclose monthly
              active user counts, daily active user counts, or cohort-level retention data, making it impossible to
              distinguish organic stickiness from continued acquisition filling a leaky bucket.
            claimRefs:
