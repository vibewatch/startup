  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Gamma serves five distinct customer segments that differ in buyer profile, use case, upgrade propensity,
              and revenue contribution. The education segment—spanning students, teachers, and EdTech administrators—
              drives high user volume but skews toward the free tier; educators value Gamma's ability to eliminate
              design friction and produce polished lecture slides or course materials in minutes without technical
              skill. Marketing and sales teams, estimated at roughly 30% of the user base, use Gamma for campaign decks,
              performance reports, and client proposals; this cohort has stronger upgrade propensity because recurring
              content creation needs exhaust AI credits regularly. Enterprise users—approximately 35% of the user base—
              include consulting firms, internal communications teams, and project managers who use Gamma for executive
              briefs, onboarding materials, and global collaboration. Startups and founders are a strategically
              important segment: Gamma is frequently the first tool founders reach for when building investor pitch
              decks, as it compresses a multi-hour design task into under two minutes. Finally, general
              prosumers—freelancers, consultants, and independent creators—form the largest segment by head count but
              generate moderate ARPU, primarily on Plus and Pro tiers. Gamma's freemium model means all five segments
              enter the product identically; differentiation occurs through AI credit exhaustion, team admin needs, and
              branding requirements, which funnel users toward paid tiers. The concentration of the user base in
              free-tier users (approximately 99% of 70 million registered accounts) implies that revenue generation
              depends heavily on a small fraction of high-engagement or high-need accounts, creating both a growth lever
              and a churn-sensitivity risk.
