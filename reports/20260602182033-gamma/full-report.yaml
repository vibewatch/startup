chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Gamma is an AI-powered presentation, document, and webpage creation platform founded in November 2020 and
              headquartered in San Francisco, California. The product replaces manual slide formatting with a
              prompt-driven generation workflow: users describe what they want, and Gamma produces professional-quality
              visual content in seconds. Its card-based output format deliberately breaks from conventional 16:9
              PowerPoint conventions, rendering presentations as responsive web documents that share as links rather
              than file attachments. The business model is freemium: a free tier with limited AI credits drives user
              acquisition, while paid plans (Plus at roughly $8 per month, Pro at roughly $15–18, Ultra at roughly
              $90–100) unlock expanded credits, advanced export options, analytics, and collaboration features. Gamma is
              hosted on Google Cloud Platform and holds SOC 2 Type II certification, supporting enterprise procurement.
              In September 2025, version 3.0 launched alongside Gamma Agent, an AI assistant that browses the web,
              refines content, and restylesdecks conversationally—repositioning the product from an AI slide builder to
              a full visual storytelling platform. March 2026 brought Gamma Imagine, an AI image-generation tool
              targeting marketing asset creation. An API launched in November 2025 connects Gamma to external automation
              tools including Zapier and Make.com. The company integrated GPT-3.5 in March 2023, transforming daily
              signups from hundreds to approximately 10,000 per day and validating core product-market fit. That AI
              inflection event remains the defining chapter in Gamma's product history and is the primary driver of
              subsequent ARR growth.
