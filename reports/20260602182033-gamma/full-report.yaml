      - number: '5.3'
        title: Technology Architecture and Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Gamma's web application is built on a React-based frontend with Yjs—a CRDT (Conflict-free Replicated Data
              Type) library—powering conflict-free real-time collaborative editing across its Multiplayer service. The
              GitHub organisation exposes approximately 26 repositories including forks of ProseMirror, Tiptap, Chakra
              UI, and dnd-kit, which together form the open-source foundation of the editor layer. This reflects the
              company's strategy of building atop well-maintained open-source primitives rather than a proprietary
              editor core, reducing long-term maintenance burden but creating dependency risk on external project
              maintenance. On the AI layer, Gamma routes requests through a multi-model architecture that selects among
              large language models (including GPT-family and Claude integrations confirmed via the API changelog) and
              image-generation models including recraft-v4, gemini-3.1-flash-image, and flux-2-max depending on task
              type and user tier. Infrastructure is hosted on Google Cloud Platform, providing an enterprise-grade
              network and data centre foundation. The status page reports five independently monitored service
              components: Website, Web Application, API, Multiplayer, Site Hosting, and AI. All data in transit is
              encrypted with TLS 1.2 or higher; data at rest uses AES-256 encryption with scheduled key rotation.
              Zero-trust access controls grant access based on user identity and device context rather than network
              perimeter, and the platform stores only OAuth 2.0 revocable tokens rather than user credentials.
            claimRefs:
