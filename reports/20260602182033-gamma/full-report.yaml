      - number: '4.6'
        title: Financial Risks and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Several material financial risks require diligence attention. First, cybersecurity misuse of Gamma's
              platform for phishing attacks creates reputational and liability exposure: threat actors have exploited
              the trusted gamma.app domain to host phishing redirectors impersonating Microsoft SharePoint login pages,
              with security researchers noting that the platform's legitimacy allows attackers to evade standard email
              security filters. If Gamma is forced to implement stricter content moderation or if its domain is
              blacklisted, it could disrupt the viral sharing loop that drives organic acquisition. Second, competitive
              pressure from Microsoft Copilot, Google Duet AI, and Canva's free-tier AI features threatens to
              commoditize Gamma's core "generate slides from text" functionality, which could compress pricing power and
              accelerate churn among casual users. Third, the core financial metrics needed for rigorous underwriting —
              gross margin, NRR, CAC payback, monthly burn, and exact subscriber cohort data — are all private and
              undisclosed. Without these metrics, it is impossible to validate whether the business is scaling
              efficiently or whether the profitability claim is sustainable post-headcount ramp. The company's headcount
              appears to be growing rapidly (estimates range from 52 to 318 employees as of early 2026), which could
              compress margins during the scaling phase.
