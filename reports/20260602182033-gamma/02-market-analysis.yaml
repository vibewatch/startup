chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Gamma operates at the intersection of a $8.9 billion global presentation software market and
    a $4.7 billion AI-native presentation generation sub-market growing at over 50% annually.
    Buyer demand is fragmented across enterprise professionals (35%), marketing and sales teams (30%),
    educators (20–25%), and consultants (15%), each with distinct budget owners, adoption triggers,
    and switching costs. The largest growth drivers are the acceleration of remote work, widespread
    AI adoption by marketers (85% in 2026), and Gamma's viral freemium loop—but PowerPoint
    ecosystem lock-in, data security concerns, and enterprise procurement friction remain material
    constraints on total addressable penetration.

sections:
  - id: market-boundary-and-definition
    title: "Market Boundary and Definition"
    body: >-
      Gamma's relevant market spans three nested categories. The broadest is the global presentation
      software market—all tools used to create structured, visually formatted documents for communication
      across business, education, and personal contexts—valued at approximately $8.23 billion in 2025
      and projected to reach $8.91–9.65 billion in 2026. This TAM includes Microsoft PowerPoint and
      Apple Keynote on-premise licenses, Google Slides and Canva SaaS subscriptions, Prezi, Zoho Show,
      and a long tail of niche tools. Excluded from this boundary are general-purpose word processors
      (Microsoft Word, Google Docs), project management tools (Asana, Notion in list mode), and
      data visualization platforms (Tableau, Power BI) where the primary output is not a presentable
      slide or document artifact.
      Within that TAM sits the cloud-based collaborative presentation segment, which accounts for
      approximately 59–72% of deployment preference by 2026, reflecting the sustained shift to remote
      and hybrid work. Gamma competes entirely within this cloud-native sub-segment. A further subset
      is the AI-native presentation generation market—tools where AI produces the initial structure,
      design, and content from a prompt, rather than simply assisting with template selection.
      This AI-native wedge is estimated at $0.73 billion on a narrow definition or $4.7 billion on a
      broader commercial definition that includes autonomous presentation agents, API-first
      architectures, and MCP-integrated workflows. The primary status-quo substitute is manual
      PowerPoint, which serves approximately 1.5 billion users globally and is deeply embedded in
      enterprise communication workflows via Microsoft 365. Google Slides is the secondary substitute,
      dominant in education. Canva occupies the design-led adjacency with approximately 60% market
      share in the broader presentation category by product-usage metrics. Gamma's excluded spend
      includes video-first presentation formats (Loom, Vidyard) and immersive AR/VR presentation
      tools, which address a distinct audience and workflow.
