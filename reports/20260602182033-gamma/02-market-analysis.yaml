  - id: buyer-segmentation-and-adoption-path
    title: "Buyer Segmentation and Adoption Path"
    body: >-
      Gamma's 70 million user base is segmented by professional role, company size, and use case.
      Enterprise professionals constitute approximately 35% of users, with the marketing and sales
      function as the largest single segment at 30%. Educators and trainers account for 20–25% of
      users globally, reflecting Gamma's strong penetration in the K-12 and higher education markets
      where free-tier access and easy link sharing are strong fit. Consulting and finance professionals
      represent 15%, with startup founders a further 10%.
      Gamma's ideal customer profile—per both the company's own positioning and third-party ICP
      analysis—is the "high-velocity individual knowledge worker": a founder, marketer, educator,
      or consultant who must produce professional visual content frequently but lacks formal design
      training and is willing to adopt web-native, link-based delivery rather than PPTX attachments.
      This persona drives Gamma's freemium-to-paid conversion funnel, with branding removal (the
      "Made with Gamma" watermark) as the primary upgrade trigger for individual users.
      Budget ownership varies by segment. In enterprise and mid-market deployments, the budget owner
      is typically the team lead, marketing director, or CFO signing off on a SaaS line item; in
      education, it is the individual teacher paying out-of-pocket or an institutional license from a
      district or university IT budget. For freelancers and startup founders, it is fully self-funded.
      Adoption path follows a viral loop: a free user creates a shareable Gamma link, recipients
      click through and discover the tool, creating organic acquisition with no marketing spend.
      India's 9.5 million users were accumulated entirely through this mechanism.
      The progression from free to paid is driven by usage friction (credit limits), professional
      need (branding removal, analytics), and team expansion (centralized billing, admin controls).
      Team plans at $240/seat (minimum 2 seats) and Business plans at $480/seat (minimum 10 seats)
      represent the enterprise monetization path. Freemium conversion for AI-native SaaS tools
      benchmarks at 15–20% in 2026, well above the 8% median for traditional SaaS, but Gamma's
      600,000 paying subscribers against 70 million total users implies a gross conversion ratio
      below 1%—indicating a large low-engagement free user base.
