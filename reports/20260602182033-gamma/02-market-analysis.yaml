      topic: SOM estimation
      missingEvidence: >-
        No independent third-party estimate exists for Gamma's serviceable obtainable market (SOM)
        in the AI presentation space. Gamma's own forward projections are not publicly available.
      whyItMatters: >-
        Without a credible SOM estimate, it is not possible to independently assess whether
        Gamma's $2.1B valuation reflects realistic near-term market share capture or optimistic
        expansion assumptions.
      diligencePath: >-
        Commission an independent market analysis using Gamma ARR cohort data, conversion rates
        by segment, and comparable SaaS market penetration trajectories to build a bottoms-up SOM.
      relatedQuestionRefs:
        - QM005
        - QM026

    - type: missing-source
      severity: material
      topic: competitive density impact on Gamma
      missingEvidence: >-
        Gamma's net revenue retention (NRR) rate by segment is not publicly disclosed, making it
        difficult to assess whether competitive fragmentation (90+ AI presentation tools) is
        causing measurable churn in specific customer segments.
      whyItMatters: >-
        NRR is the primary indicator of competitive moat strength; without it, competitive density
        risk in the AI presentation market cannot be quantified.
      diligencePath: >-
        Request NRR data by segment (SMB, mid-market, enterprise) from Gamma in a due diligence
        data room; benchmark against comparable PLG-first SaaS companies at $100M ARR.
      relatedQuestionRefs:
