callouts:
  - calloutType: insight
    title: "Definitional Divergence Creates Valuation Ambiguity"
    body: >-
      The six-fold difference between the narrow ($0.73B) and broad ($4.7B) AI presentation market
      estimates for 2026 is not noise—it reflects a genuine methodological disagreement about whether
      AI-assisted formatting features in PowerPoint and Canva should count as "AI presentation tools."
      For investors underwriting Gamma's $2.1B valuation at 21x ARR, the SAM framing matters:
      a $4.7B market implies ~2% penetration (substantial room to grow), while a $0.73B narrow market
      implies 14% penetration (less headroom). Gamma's choice of SAM narrative in fundraising
      materials warrants scrutiny.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM015

  - calloutType: strength
    title: "Zero-CAC Geographic Expansion Is a Rare Asset"
    body: >-
      Gamma's India market—9.5 million users reached with zero marketing spend—demonstrates that the
      product's viral link-sharing mechanism functions as a self-sustaining distribution engine in
      high-growth, mobile-first, price-sensitive markets. This dynamic is structurally rare for a
      SaaS company at Gamma's ARR scale: most productivity SaaS companies at $100M ARR have
      significant paid acquisition costs. If the India viral pattern replicates in Brazil (9.78%
      of traffic) and Southeast Asia, Gamma could sustain low CAC even as organic North America
      growth matures.
    claimRefs:
      - CM016
      - CM017
      - CM018
      - CM031

  - calloutType: risk
    title: "PowerPoint Lock-In Is a Structural Ceiling, Not Just a Product Gap"
    body: >-
      Microsoft PowerPoint's 1.5 billion user base is not simply a competitor—it is the de facto
      output format standard for enterprise communication. PPTX export compatibility is a
      procurement gate that Gamma currently fails to pass for many enterprise deals. This is not a
      technical gap that can be resolved in a single product sprint; the mismatch is architectural
      (card-based responsive web vs. slide-grid PPTX). Until Gamma achieves PPTX export fidelity
      comparable to native PowerPoint, its enterprise SAM is materially constrained and mid-market
      deals will require champion-led internal advocacy rather than smooth self-serve adoption.
    claimRefs:
      - CM035
      - CM041

  - calloutType: risk
    title: "Freemium Cost Dynamics May Compress Margins as Scale Increases"
    body: >-
      At 70 million users with only 600,000 paid subscribers (<1% gross conversion), Gamma
      incurs AI inference and storage costs for a large free user base. In 2026, AI infrastructure
      costs are rising as model complexity increases, creating the "freemium death spiral" risk
      identified in SaaS benchmarks—where free user support costs outpace paid conversion revenue.
      Gamma's profitability since 2023 suggests current unit economics are viable, but the
      sustainability of profitability as the free user base grows to 100M+ requires scrutiny of
      marginal cost-per-active-user trends.
    claimRefs:
      - CM042
      - CM043
      - CM044
      - CM045

  - calloutType: insight
    title: "AI Adoption Wave Provides a Multi-Year Market Tailwind"
    body: >-
      The jump from 61% to 85% marketer AI-tool adoption in just three years (2023–2026) is one
      of the fastest documented adoption curves in productivity software history. This structural
      shift means that Gamma's market is not a fixed TAM being divided among more competitors—the
      TAM itself is expanding as more professionals become comfortable with AI-generated content.
      The question for Gamma is whether its viral, freemium-led model can convert a sufficient
      fraction of this expanding market before incumbents (Copilot for PowerPoint, Gemini for
      Slides) close the feature gap.
    claimRefs:
      - CM028
      - CM029
      - CM030
      - CM034

