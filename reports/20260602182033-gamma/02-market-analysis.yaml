  - id: market-sizing-and-estimates
    title: "Market Sizing: TAM, SAM, and Conflicting Estimates"
    body: >-
      Multiple analyst reports provide consistent high-level estimates for the presentation software
      market but diverge significantly on the AI-native sub-market, reflecting definitional
      disagreement about what qualifies as an "AI presentation tool."
      The Business Research Company and Business Research Insights converge on a $8.9 billion
      global TAM in 2026, growing to $16.6–27.8 billion by 2030–2035 at a CAGR of 13.5–17.2%.
      Coherent Market Insights uses a slightly different 2026 baseline of $8.6 billion but the same
      $21.4 billion 2033 endpoint with a 13.9% CAGR. Global Growth Insights puts the 2025 market at
      $7.85 billion and $8.91 billion in 2026. These estimates are broadly consistent and suggest
      the presentation software market is in a rapid-growth phase driven primarily by AI feature
      integration and cloud adoption.
      The AI-native sub-market estimates diverge more sharply. Intel Market Research estimates
      the AI presentation generation market at $0.73 billion in 2026, growing to $1.45 billion by 2034
      (CAGR 9.3%)—a conservative figure that excludes general cloud-based tools with AI features.
      By contrast, 2Slides, which operates in the market itself, reports the broader AI-first
      presentation market reached $4.7 billion in 2026, a 52% year-over-year increase from $3.1
      billion in 2025. This wider definition includes autonomous presentation agents, API-generated
      decks, and platforms like Gamma, Beautiful.ai, and SlidesAI.
      The generative AI market context is relevant: GMInsights estimates the global generative AI
      market at $83.3 billion in 2026, growing at 31.6% CAGR to $988.4 billion by 2035, with
      OpenAI holding 23.6% share. This macro backdrop means Gamma is a small but fast-growing
      player in one of the fastest-growing software categories globally.
      For Gamma's serviceable addressable market (SAM), a reasonable bound is the cloud-based,
      freemium-accessible, web-native AI presentation segment: approximately $1–4.7 billion in 2026
      depending on definition. Given Gamma's $102 million ARR against this SAM, current penetration
      is 2–10%. The serviceable obtainable market (SOM) for the next 3 years depends on enterprise
      upsell velocity and geographic expansion, for which no public projection exists.
