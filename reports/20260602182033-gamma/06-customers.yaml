  - id: named-customer-proof
    title: Named Customer Proof and Case Studies
    body: >-
      Gamma's public customer evidence consists primarily of testimonials aggregated on FeaturedCustomers
      (20+ testimonials, 4.8/5 from 422 reference points), Capterra, and its own website, rather than formal
      enterprise case studies with quantified business outcomes. FeaturedCustomers testimonials span educators,
      founders, consultants, and enterprise professionals. Named testimonials include Young Zhao, a startup
      co-founder who reports Gamma eliminated reliance on traditional slides; Aaron Baughman, an AI Strategist
      who cites Gamma as essential for rapid presentation iteration; and Emilie, an agency founder who describes
      Gamma as a "fresh alternative to PowerPoint decks we love to share with clients." An educator testimonial
      emphasizes that Gamma "frees me from the technical side of design and lets me focus on creating engaging,
      effective learning experiences." A student reviewer on Capterra Canada describes using Gamma for business
      proposal projects and being impressed by an instructor. JPMorgan's Startup Banking program offers Gamma
      as a partner discount for its startup clients, providing institutional validation. The Harvard Business
      School's 24-page case study (826001-PDF-ENG, 2026) on Gamma is the highest-credibility independent proof
      of Gamma's market significance, placing it in the curricula studied by future business leaders. However,
      no formal enterprise case studies disclosing deal size, contract duration, named Fortune 500 customer
      identities, or quantified productivity outcomes exist in the public domain. The 40% Fortune 500
      penetration claim (at least one user) circulated by analysts is unverified at the individual account level
      and represents breadth of individual-user sign-up rather than enterprise contractual commitments.
    claimRefs:
      - CU012
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU023
      - CU028
      - CU039
