callouts:
  - calloutType: strength
    title: "Viral Product-Led Growth Drives 70M Users at Near-Zero CAC"
    body: >-
      Gamma's viral sharing model—presentations distributed as public links that expose Gamma's branding—
      has driven 70 million registered users with minimal marketing spend. India's 9.5 million users were
      acquired without any advertising budget, a powerful proof of product-market fit in price-sensitive
      markets. The 1 million daily content creation events signal habitual engagement among the active cohort.
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU003

  - calloutType: risk
    title: "Trustpilot 1.6/5 and Billing Complaints Signal Customer Retention Risk"
    body: >-
      Gamma's Trustpilot rating of 1.6/5 from 88 reviews—with over 70% giving one star—documents a pattern
      of auto-renewal surprises, a punitive 3-day refund window, charges after cancellation requests, and
      unresponsive support. While Trustpilot skews toward billing complainants, the volume and consistency of
      complaints represent a material trust risk that could suppress enterprise procurement decisions and
      accelerate churn among price-sensitive individual subscribers.
    claimRefs:
      - CU013
      - CU014
      - CU030

  - calloutType: insight
    title: "Below-Average Freemium Conversion Masks Strong Absolute Paid Base"
    body: >-
      Gamma's ~0.86% freemium conversion rate is below the 2–5% SaaS industry benchmark, but the 70M user
      base converts this low rate into 600,000+ paying subscribers sufficient to support $100M ARR profitably
      with 52 employees. The structural implication is that conversion rate improvement—even to 1.5%—would
      double the paying subscriber base without requiring new user acquisition investment.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU031

  - calloutType: recommendation
    title: "Investors Should Require NRR, GRR, and Enterprise Cohort Data in Diligence"
    body: >-
      Gamma discloses registered user count, daily creation metrics, and ARR, but not net or gross revenue
      retention, cohort churn rates, enterprise account count, or top-customer revenue concentration. These
      are the metrics that differentiate a compounding SaaS business from a high-churn consumer product. Any
      Series C or growth equity investor should require cohort-level NRR (segmented by individual vs. team vs.
      enterprise accounts) and top-10 customer revenue concentration before closing.
