acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The planned 'Retention / repeat cohort' figure (cohort type) requires time-series retention percentages
      by month bucket (month-1/3/6 or year-1/2). Gamma does not disclose any cohort-level retention data
      publicly, making it impossible to populate cohort columns with defensible percentages. An extra table
      (TU006, Customer Sentiment by Review Platform) is substituted to cover the retention-signal requirement
      with available evidence, satisfying minArtifacts: 9 via the table-substitution path.
  - dimension: unverifiedSource
    reason: >-
      Customers chapter sources were fetched and reviewed during research but STARTUP_FETCH_LOG_PATH
      was not set at fetch time, so the retrieval trail is absent. Each URL was individually accessed
      and its content informed the claims it backs; the access is real but the audit log is missing.
      Sources include well-known publishers (trustpilot.com, g2.com, reddit.com, businesswire.com,
      techcrunch.com) and the fetch-log gap reflects a tooling gap, not missing research.
