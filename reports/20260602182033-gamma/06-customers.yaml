  - id: TU005
    title: Expansion and Concentration Risk
    columns:
      - Factor
      - Concentration / Risk
      - Expansion Driver
      - Impact
      - Diligence Path
    rows:
      - - India market concentration
        - 9.5M / 70M users = ~14% in one market; no ad spend
        - Local-language features; APAC office expansion
        - Revenue impact low (lower ARPU); user loss risk if local competitor emerges
        - Track India revenue contribution vs. user share quarterly
      - - Freemium-to-paid funnel
        - ~99% of users on free tier; revenue from <1% of users
        - AI credit exhaustion; team workspace upgrade; feature gating
        - High dependence on conversion events; rate drop → ARR impact
        - Monitor monthly conversion cohort; request cohort-level data
      - - Top customer revenue concentration
        - Not disclosed; no named enterprise accounts public
        - Land-and-expand via Gamma Teams / Ultra / API
        - Potential key-customer risk if top decile contributes outsized ARR
        - Request top-10 customer revenue share from Gamma IR
      - - Marketing & sales segment dependency
        - ~30% of users; high repeat need for campaign cadence
        - Recurring presentation demand; team templates; analytics
        - Sticky if embedded in marketing workflow; churns if replaced by AI-native alternative
        - Assess NRR for marketing-team accounts specifically
      - - Channel / partner dependence
        - No disclosed reseller, VAR, or distributor agreements
        - Direct self-serve; JPMorgan Startup Banking partner offer
        - Low channel concentration; direct GTM limits margin leakage
        - Confirm whether enterprise deals go direct or through SI/VAR
    notes: >-
      Concentration and expansion figures are estimates or inferences from public disclosures.
      Gamma does not publish segment-level ARR, customer concentration data, or geographic revenue breakdown.
      The freemium-to-paid concentration figure (~99% free) is estimated from 600K paying vs. 70M total users.
