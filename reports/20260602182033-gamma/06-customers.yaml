company:
  name: Gamma
chapter:
  number: 6
  title: Customers
  summary: >-
    Gamma has built a 70-million-user global base across education, marketing, enterprise, and startup segments
    through a product-led freemium model, with 400 million pieces of content created and over 600,000 paying
    subscribers at an estimated 0.86% conversion rate. India is the fastest-growing market at 9.5 million users,
    achieved without paid marketing. Named customer proof is largely testimonial-grade rather than formal enterprise
    case studies; Trustpilot's 1.6/5 rating from billing and support complaints represents a material churn and
    trust signal, while G2 (4.1/5) and FeaturedCustomers (4.8/5) reflect a more favourable business-user cohort.
    Key durability gaps include undisclosed NRR, GRR, cohort retention, and enterprise customer concentration data.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation
    body: >-
      Gamma serves five distinct customer segments that differ in buyer profile, use case, upgrade propensity,
      and revenue contribution. The education segment—spanning students, teachers, and EdTech administrators—
      drives high user volume but skews toward the free tier; educators value Gamma's ability to eliminate
      design friction and produce polished lecture slides or course materials in minutes without technical skill.
      Marketing and sales teams, estimated at roughly 30% of the user base, use Gamma for campaign decks,
      performance reports, and client proposals; this cohort has stronger upgrade propensity because recurring
      content creation needs exhaust AI credits regularly. Enterprise users—approximately 35% of the user base—
      include consulting firms, internal communications teams, and project managers who use Gamma for executive
      briefs, onboarding materials, and global collaboration. Startups and founders are a strategically important
      segment: Gamma is frequently the first tool founders reach for when building investor pitch decks, as it
      compresses a multi-hour design task into under two minutes. Finally, general prosumers—freelancers,
      consultants, and independent creators—form the largest segment by head count but generate moderate ARPU,
      primarily on Plus and Pro tiers. Gamma's freemium model means all five segments enter the product identically;
      differentiation occurs through AI credit exhaustion, team admin needs, and branding requirements, which
      funnel users toward paid tiers. The concentration of the user base in free-tier users (approximately 99%
      of 70 million registered accounts) implies that revenue generation depends heavily on a small fraction of
      high-engagement or high-need accounts, creating both a growth lever and a churn-sensitivity risk.
    claimRefs:
      - CU009
      - CU010
      - CU026
      - CU033
      - CU034
      - CU041
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: Adoption Trajectory and Growth
    body: >-
      Gamma's user growth is a case study in product-led viral adoption. The platform launched in public beta
      in 2022 with approximately 60,000 users; the March 2023 AI relaunch triggered explosive growth, adding
      10 million users in the following nine months. By November 2025, Gamma reported 70 million registered
      users globally, with content creation exceeding 400 million cumulative items and surpassing 1 million new
      items per day—a frequency metric that proxies habitual engagement. The platform reached $100 million in
      annual recurring revenue profitably, with approximately 600,000 paying subscribers representing an estimated
      0.86% freemium-to-paid conversion rate—below the typical 2–5% SaaS industry benchmark. This below-average
      conversion rate is structurally consistent with a consumer-grade, low-friction free tier where users derive
      significant value without upgrading. India emerged as Gamma's fastest-growing market with 9.5 million users
      by April 2025, driven entirely by organic and viral sharing rather than paid marketing—a signal of strong
      product-market fit in price-sensitive emerging markets. Brazil and Australia are secondary international
      growth markets, with Asia collectively accounting for approximately 25% of the user base. JPMorgan's
      startup banking division validated Gamma's enterprise-adjacent trajectory by offering Gamma discounts to
      its startup clients, indicating that established financial institutions view Gamma as a credible tool in
      the startup stack. The Harvard Business School produced a 24-page case study on Gamma in 2026, further
      confirming the company's relevance as a studied market disruptor. The high daily creation rate (1M items/day)
      implies a base of highly active users, but Gamma does not disclose monthly active user counts, daily active
      user counts, or cohort-level retention data, making it impossible to distinguish organic stickiness from
      continued acquisition filling a leaky bucket.
    claimRefs:
      - CU001
      - CU002
