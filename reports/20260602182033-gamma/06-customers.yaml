  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention data
      missingEvidence: "Gamma's NRR, GRR, and cohort-level churn rates by customer segment (individual, team, enterprise)"
      whyItMatters: "Without NRR/GRR, it is impossible to distinguish a compounding SaaS business from a high-churn consumer product; the 1M daily creation metric cannot substitute for cohort retention analysis"
      diligencePath: "Request from Gamma CFO or investor relations: quarterly cohort NRR by tier (Plus, Pro, Ultra, Teams, Enterprise), annual GRR, and top-10 customer revenue concentration"
      relatedQuestionRefs:
        - QU012

