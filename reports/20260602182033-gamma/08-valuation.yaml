sections:
  - id: s1-financing-context
    title: Financing Context and Cap Structure
    body: >-
      Gamma closed a $68M Series B in November 2025—$48M in primary capital and $20M in secondary
      transactions—at a $2.1B post-money valuation. Andreessen Horowitz led the round, with Accel
      and Uncork Capital also participating. The round came atop a prior funding history of
      approximately $23M (Seed ~$11M, Series A $12M), bringing lifetime capital raised to roughly
      $90M. The $20M secondary component permitted early investors and employees to realize partial
      liquidity without requiring a full company sale or IPO, a structure increasingly common in
      late-stage private rounds. At the time of close, Gamma had surpassed $100M in ARR—confirmed
      by the company—with Sacra Research estimating $102M as of October 2025. This implies a
      revenue multiple of approximately 21× ARR at the Series B price. The company's operational
      profitability since 2023 means the primary capital was discretionary rather than a survival
      necessity, which strengthens the negotiating position of future investors and creates an
      implicit floor on valuation. Gamma's per-employee revenue productivity of roughly $1.9–2.0M
      ARR per FTE at ~50 employees is among the highest disclosed figures in the SaaS sector. The
      Series B deal structure, investor composition, and implied dilution are detailed in TV007;
      the funding history and milestone timeline are captured in TV001.
