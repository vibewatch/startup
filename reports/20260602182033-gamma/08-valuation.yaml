callouts:
  - calloutType: risk
    title: Missing NDR Data Is the Single Largest Valuation Risk
    body: >-
      Gamma has not publicly disclosed net dollar retention by cohort. Every premium SaaS multiple
      in 2026—Figma at 22× (130%+ NDR), Notion at 30–37× (workflow lock-in), AI-native SaaS
      median at 21.2×—is justified by documented retention durability. Gamma's 21× multiple is
      currently borrowed from the category benchmark, not validated through disclosed cohort data.
      If enterprise NDR falls below 100%, multiple compression to 8.5× (the AI-enabled SaaS median)
      would imply a 60% valuation reduction from current pricing. The NDR ask in TV006 is therefore
      not a routine diligence item—it is a thesis-confirming or thesis-breaking data point.
    claimRefs:
      - CV021
      - CV029
      - CV030
      - CV043

  - calloutType: insight
    title: Gamma's 21× Multiple Is Category-Appropriate, Not Anomalous
    body: >-
      A common misconception about Gamma's valuation is that 21× ARR represents exuberant pricing.
      The saasrise.com 2026 analysis of 575+ AI-native private companies sets the VC median at
      21.2×—meaning Gamma's Series B price is at the mathematical median of its peer cohort, not
      at the tail. Figma's April 2026 IPO at 22× provides public-market validation that design
      and creative workflow software with enterprise retention can sustain premium multiples. The
      critical distinction is that peer-category validation does not substitute for company-specific
      retention data. Gamma's 21× is defensible in the current AI market regime; it would become
      indefensible if the company's enterprise NDR is discovered to be below 100% in diligence.
    claimRefs:
      - CV024
      - CV021
      - CV030

  - calloutType: recommendation
    title: The Bear Case Has a Hard Floor Thanks to Profitability
    body: >-
      Unlike most AI startups at comparable valuation levels, Gamma's operational profitability
      since 2023 creates an investment floor that materially constrains the bear case. A
      cash-flow-positive company with $100M+ ARR and minimal debt does not face zero-outcome risk.
      Based on legacy SaaS M&A floor multiples (5× ARR), Gamma's hard downside is approximately
      $500M—a 75% loss from the $2.1B cost basis, which is severe but not catastrophic. This floor
      means the investment is structured more like a convertible equity in an established SaaS
      business than a binary bet on an unproven AI startup. The recommendation to invest at a
      15–20% discount to the Series B therefore represents a risk-adjusted opportunity that
      appropriately prices the multiple compression tail risk.
    claimRefs:
      - CV038
      - CV045
      - CV009
      - CV034

  - calloutType: risk
    title: Adverse Analysts Warn AI Mega-Round Valuations Create Down-Round Risk in 2026
    body: >-
      Daily Moss (2026) and similar adverse commentary note that AI companies that raised at 20×+
      ARR multiples in late 2025 face significant down-round risk if they fail to demonstrate
      enterprise durability within 12–18 months of their mega-round close. The argument is
      structural: VC multiples of 20×+ require continued AI sector premium pricing, which depends
      on the market maintaining a clear distinction between AI-native and legacy SaaS. If Microsoft
      Copilot and Google Gemini successfully blur this distinction by delivering AI-native
      functionality inside incumbent platforms, the premium multiple regime for standalone AI-native
      tools collapses. Gamma's February 2026 window for demonstrating enterprise NDR (12 months
      post-Series B) is the critical observation period for this risk.
    claimRefs:
      - CV036
      - CV014
      - CV035

