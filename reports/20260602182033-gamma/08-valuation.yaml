  - id: s5-recommendation-diligence
    title: Investment Recommendation and Final Diligence Asks
    body: >-
      The evidence supports a conditional invest recommendation at a price reflecting a 15–20%
      discount to the $2.1B Series B post-money valuation. This discount is warranted to compensate
      for three unresolved valuation risks: the absence of publicly disclosed NDR by cohort, the
      lack of gross margin verification, and uncertainty around cap table dilution following the
      secondary component. Gamma's current valuation is not a bubble relative to AI-native SaaS
      peers—the 21× ARR multiple is at the category median and is validated by the Figma and
      Canva public comparables. However, the bull case requires enterprise workflow depth that
      must be confirmed in diligence. The primary investment risks are competitive displacement
      (Microsoft Copilot, Google Gemini) and multiple compression if Gamma is re-rated from
      AI-native to AI-enabled SaaS—which would reduce the fair multiple from 21× to 8.5×,
      implying a 60% reduction in valuation at current ARR. Gamma's operational profitability
      provides a meaningful floor against catastrophic downside: a cash-flow-positive company
      with $100M+ ARR is unlikely to trade below 5× ARR even in adverse conditions, creating a
      hard floor at approximately $500M. The six final diligence asks (TV006) are prioritized
      by decision-criticality; the NDR ask is the single highest-priority item before committing
      to the investment recommendation. AI captured 61% of global VC in 2025 ($258B total),
      creating structural tailwind that reduces future capital access risk and supports
      the premium multiple regime continuing through 2026.
