    - type: missing-source
      severity: critical
      topic: retention-metrics
      missingEvidence: >-
        Gamma's net dollar retention by customer cohort (enterprise >$10K ACV, mid-market,
        SMB) has not been publicly disclosed in any company communication, press release,
        or analyst report as of June 2026.
      whyItMatters: >-
        NDR is the single most important predictor of whether Gamma's 21× ARR multiple is
        justified by fundamentals; Figma's 130%+ NDR validated its 22× IPO multiple. Without
        NDR data, the investment recommendation cannot be confirmed with high confidence.

    - type: missing-source
      severity: material
      topic: cap-table
      missingEvidence: >-
        Gamma's post-Series-B cap table—including precise founder, Series A, Series B, and
        option pool ownership percentages following the $20M secondary component—has not been
        publicly disclosed.
      whyItMatters: >-
        Cap table opacity prevents accurate modeling of dilution impact on investor returns
        in exit scenarios and raises questions about whether the secondary component indicates
        motivated early seller activity.

      relatedQuestionRefs:
