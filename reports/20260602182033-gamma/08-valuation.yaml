  - id: s2-investment-thesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      Gamma's investment thesis rests on three compounding advantages that together justify an
      AI-native SaaS premium multiple. First, capital efficiency: reaching $100M ARR on under $90M
      lifetime capital—with profitable operations—demonstrates a structural cost advantage in
      AI-driven product delivery that cannot be easily replicated by competitors scaling with
      traditional headcount models. Second, network and data flywheel: 70 million registered users
      generate a massive corpus of implicit preference data—template choices, edit patterns, design
      feedback signals—that improves AI output quality with scale and creates switching friction as
      users accumulate libraries of Gamma-native assets. Third, product category timing: as
      AI-native tools displace legacy Office-era productivity software, Gamma is positioned at the
      point of maximum enterprise purchasing momentum and before Microsoft and Google can fully
      consolidate embedded AI advantages. The anti-thesis is material. Gamma's 21× ARR multiple
      prices in sustained enterprise penetration growth that has not yet been publicly documented.
      The company lacks a disclosed NDR figure, making it impossible to independently verify whether
      enterprise cohorts are expanding or churning. Its absence of a patent portfolio and
      concentration in a single high-visibility AI product category creates acute competitive
      displacement risk from Microsoft Copilot and Google Gemini—both of which are shipping
      AI-native presentation features inside incumbent platforms at no incremental cost. The
      investment recommendation and its conditions are captured in TV002 and TV005.
