chapter:
  number: 8
  title: Valuation
  summary: >-
    Gamma's November 2025 Series B priced the company at $2.1B post-money—implying a ~21× ARR
    multiple on $100M+ in disclosed revenue—aligns precisely with the AI-native SaaS VC median
    of 21.2× (saasrise.com, 575+ companies, Q1 2026) but faces compression risk from public-market
    anchors set by Figma's April 2026 IPO (22× ARR on $1.1B) and Canva's secondary ($42B at ~12.7×).
    A comparative analysis of 10 peers, three scenario models, and current SaaS M&A benchmark data
    brackets Gamma's fair value at $1.6B–$2.4B today, with a $3.5B+ bull case contingent on
    achieving enterprise net dollar retention above 120% and sustaining top-quartile AI-native
    growth. A conditional invest recommendation is supported at a 15–20% discount to the Series B
    price, subject to diligence confirmation of cap table details, NDR by cohort, gross margin, and
    EU AI Act compliance posture.

