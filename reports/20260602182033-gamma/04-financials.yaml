  - id: cost-structure
    title: Cost Structure and Gross Margin Analysis
    body: >-
      Gamma's cost structure is dominated by AI inference and cloud infrastructure, followed by
      R&D (engineering headcount), customer support, and security compliance overhead.
      The company runs on Google Cloud Platform, with AI inference costs driven by third-party
      model APIs (likely OpenAI and others) plus Gamma's own fine-tuned layers. Gross margin
      is not publicly disclosed, but based on the AI-SaaS cost profile and Gamma's profitability,
      independent estimates place it in the 70–85% range — consistent with software-native
      AI SaaS platforms that rely on model APIs rather than owning foundation model
      infrastructure. Capital expenditure is minimal: Gamma has no hardware, no manufacturing,
      and no physical inventory. Working capital dynamics are favorable: subscriptions are
      prepaid (annual plans) or billed monthly in advance. There are no disclosed debt or
      project-finance obligations. The transition from a predominantly individual/SMB subscriber
      base to enterprise accounts (Team and Business tiers) is expected to reduce gross margin
      slightly due to higher customer success and security compliance costs, but offset by
      larger average contract values. SOC 2 Type II certification and enterprise security
      features (SSO, advanced data controls) add compliance cost but are now table-stakes
      for landing corporate accounts.
    claimRefs:
      - CI027
      - CI034
      - CI038
      - CI039

  - id: capital-adequacy
    title: Capital Adequacy and Series B Deployment
    body: >-
      Gamma raised $68M in Series B funding in November 2025 at a $2.1B valuation led by
      Andreessen Horowitz with participation from Accel and Uncork Capital. The round included
      a $20M secondary component providing liquidity to early employees. Total cumulative
      funding now stands at approximately $87–91M across three rounds (seed, Series A, Series B).
      Because the company had not spent its $12M Series A before the Series B close, and
      given confirmed profitability, Gamma entered 2026 with substantial cash reserves.
      The company has stated its intention to deploy the new capital toward AI engineering
      hiring, product development acceleration, and enterprise market expansion — with no
      specific capital allocation disclosed. No next-round trigger or planned IPO timeline has
      been disclosed. The company's profitability makes it non-dependent on external capital
      for operations, and the Series B provides strategic optionality rather than survival
      runway. Gamma has no disclosed debt, convertible notes beyond typical SAFE structures,
      or project-finance obligations. The implied 21x ARR multiple (at $2.1B valuation on
      ~$102M ARR) reflects premium pricing for a capital-efficient, profitable, hypergrowth AI
      platform, though it implies significant execution expectations for 2026 and beyond.
    claimRefs:
      - CI009
      - CI010
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI037
      - CI041
