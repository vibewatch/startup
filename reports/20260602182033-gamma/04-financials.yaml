  - id: unit-economics
    title: Unit Economics and Capital Efficiency
    body: >-
      Gamma's most extraordinary financial characteristic is its capital efficiency. With
      approximately 52 full-time employees at Series B close, the company generated roughly
      $2M ARR per employee — a 4–10x multiple over the SaaS median of $200K–$500K per
      employee and comparable to elite public SaaS companies such as Datadog ($895K/employee)
      but at a far smaller headcount base. CAC payback period is not disclosed; however,
      Gamma's PLG motion (product-led growth via freemium) suggests extremely low paid-
      acquisition spend. The company confirmed it had not deployed its $12M Series A by
      the time of the Series B raise, implying the Series A capital was held in reserve
      while the business self-funded on subscription revenue. This positions Gamma's
      burn multiple as effectively negative (or near-zero), far below the SaaS median
      of 1.5x. Free-to-paid conversion is enabled by the lifetime credit ceiling and
      the watermark removal incentive, but the specific conversion rate is not public.
      Sacra estimates over 600,000 paying subscribers against 70 million registered users,
      implying a 0.86–0.9% paid conversion rate, below typical B2C SaaS (1–5%) but
      consistent with high-volume PLG tools serving casual and professional users.
      Revenue quality is strong: subscription revenue is monthly-recurring, seat-based
      expansion at the Team/Business tier is land-and-expand, and there is no disclosed
      customer concentration risk.
    claimRefs:
      - CI005
      - CI022
      - CI026
      - CI027
      - CI028
      - CI029
      - CI033
      - CI034
