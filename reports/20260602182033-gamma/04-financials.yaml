  - id: growth-metrics
    title: Public Traction and Growth Trajectory
    body: >-
      Gamma's revenue trajectory is one of the fastest organic growth curves in enterprise SaaS.
      The company grew from approximately $7M ARR in June 2023 to $24M ARR in September 2024,
      $50M ARR in August 2025, and $100M ARR in November 2025, representing a 365% year-on-year
      growth rate between end-2024 and end-2025. This growth was achieved without any paid
      marketing: 70% of user growth has been organic referral-driven, stemming from the
      "Made with Gamma" branding watermark on free-tier exports and viral sharing of decks.
      At Series B close, the platform reported 70 million registered users globally — though
      the paying subscriber base of 600,000+ represents a roughly 0.9% gross conversion rate
      from registered to paying, which is consistent with freemium PLG benchmarks for
      high-velocity tools. Over 400 million pieces of content have been created on the platform
      since launch, with more than 1 million new assets generated daily by the time of the
      Series B announcement. The company has been profitable since January 2024, an outlier
      in a cohort of AI startups that typically sustain heavy losses through growth phases.
      Sacra estimates October 2025 ARR at approximately $102M, implying continued acceleration
      into the fourth quarter of 2025. No 2026 ARR target has been disclosed publicly.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI007
      - CI008
      - CI020
      - CI035
      - CI036
