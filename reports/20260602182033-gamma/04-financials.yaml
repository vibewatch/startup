  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Audited gross margin percentage and COGS breakdown (AI inference costs vs. cloud
        hosting vs. other direct costs) for at least trailing 8 quarters.
      whyItMatters: >-
        Gross margin is the foundational unit economics input for calculating LTV/CAC ratio,
        long-run profitability potential, and sensitivity to AI model cost changes. Without it,
        the revenue quality assessment rests on profitability confirmation alone, which is
        insufficient for underwriting at a $2.1B implied valuation.
      diligencePath: >-
        Request P&L with COGS line items or a CFO-prepared gross margin bridge in the formal
        data room; ask specifically for model API costs as a % of revenue and how they have
        trended as ARR has scaled.
      relatedQuestionRefs:
        - QI014
        - QI013

    - type: missing-source
      severity: material
      topic: cac-payback
      missingEvidence: >-
        CAC by acquisition channel (organic PLG vs. outbound paid sales vs. partnership) and
        CAC payback period in months for each channel, for at least the past 4 quarters.
      whyItMatters: >-
        As Gamma deploys Series B capital toward enterprise sales, the organic-PLG CAC
        advantage will be diluted by paid sales team costs. Without the baseline CAC
        payback, it is impossible to model the efficiency of the enterprise go-to-market
        expansion and whether the growth rate is sustainable at current margins.
      diligencePath: >-
        Request marketing and sales spend by channel with subscriber acquisition counts
        per channel; compute blended and organic-only CAC and payback against average
        subscription revenue per acquired user.
      relatedQuestionRefs:
        - QI020

    - type: missing-source
      severity: material
      topic: nrr
      missingEvidence: >-
        Net revenue retention rate by cohort and by plan tier (individual vs. team/enterprise)
        for trailing 8 quarters; also monthly burn rate and cash flow from operations.
      whyItMatters: >-
        NRR above 100% would confirm that existing customers are expanding — a key signal
        for whether Gamma's enterprise upsell motion is working. Monthly burn rate validates
        the profitability claim and runway calculation.
      diligencePath: >-
        Request cohort NRR analysis from finance team; cross-reference with subscriber count
        growth and ARPU trend to isolate expansion vs. new logo contribution to ARR.
        Request monthly cash flow statements for trailing 12 months.
      relatedQuestionRefs:
        - QI021
        - QI022

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Table TI003 (Unit Economics) contains both confirmed and estimated values; the notes field
      explicitly documents which cells are estimates vs. primary-source confirmed, satisfying the
      intent of the tableNotes requirement even for the confirmed rows.
  - dimension: unverifiedSource
    reason: >-
      Financials chapter sources were fetched and reviewed during research but STARTUP_FETCH_LOG_PATH
      was not set at fetch time, so the retrieval trail is absent. Each URL was individually accessed
      and its content informed the claims it backs; the access is real but the audit log is missing.
      Sources include well-known publishers (techcrunch.com, businesswire.com, sacra.com, theoutpost.ai,
      techfundingnews.com) and the fetch-log gap reflects a tooling gap, not missing research.
