callouts:
  - calloutType: strength
    title: Capital Efficiency Outlier — $2M ARR per Employee
    body: >-
      Gamma reached $100M ARR with 50–52 employees and only $23M in initial funding, delivering
      approximately $2M ARR per employee — a 4–10x multiple over the SaaS median of $200K–$500K
      per employee. This efficiency stems from a PLG freemium flywheel that generates organic
      acquisition at near-zero paid CAC and a credit-gated model that converts heavy users
      efficiently. The company's profitability since early 2024 demonstrates that this is not
      a subsidy-funded growth rate, making it one of the highest-quality revenue profiles in
      AI SaaS.
    claimRefs:
      - CI026
      - CI003
      - CI004
      - CI005

  - calloutType: risk
    title: Platform Misuse for Phishing — Reputational and Domain Trust Risk
    body: >-
      Cybersecurity researchers have documented Gamma's platform being weaponized for phishing
      attacks: threat actors host Microsoft SharePoint credential-harvesting pages on the
      gamma.app domain, exploiting the platform's trusted domain and legitimate HTTPS to
      bypass email security filters. If gamma.app is domain-blacklisted by enterprise security
      vendors, it would disrupt the viral sharing loop underpinning Gamma's organic acquisition
      engine and require costly brand remediation. This risk is structural to any public AI
      content-hosting platform, but Gamma's permissive content creation tools make it
      particularly attractive to attackers.
    claimRefs:
      - CI030
      - CI031

  - calloutType: risk
    title: Core Financial Metrics Are Private — Underwriting Depends on Data Room
    body: >-
      Gross margin, NRR, CAC payback, monthly burn rate, and subscriber churn are all
      undisclosed. Without these metrics, it is structurally impossible to validate the
      unit economics story beyond the top-line ARR and profitability confirmation. As Gamma
      scales headcount post-Series B, margin compression is a plausible risk that cannot be
      quantified from public data. Any investment thesis must be conditioned on data room
      access to at least gross margin and NRR by cohort.
    claimRefs:
      - CI034

  - calloutType: recommendation
    title: Priority Diligence Asks Before Commitment
    body: >-
      Request the following in a data room: (1) gross margin by quarter for trailing 8
      quarters, with COGS detail; (2) NRR broken out by plan tier; (3) monthly subscriber
      cohort table showing new, retained, churned, and expanded subscriptions; (4) CAC by
      acquisition channel (organic PLG vs. outbound); (5) headcount trajectory and projected
      run-rate payroll post-Series B hiring plan. These five items are the minimum required
      to underwrite the unit economics story with any rigor.
    claimRefs:
      - CI034

