company:
  name: Gamma

chapter:
  number: 4
  title: Financials
  summary: >-
    Gamma has achieved a rare combination of hypergrowth and profitability: $100M+ ARR by November 2025 on just $23M in cumulative pre-Series-B funding, with roughly 52 employees generating ~$2M ARR per head — a 4–10x premium over SaaS norms. The freemium credit model drives predictable conversion, and the $68M Series B at a $2.1B valuation (21x ARR) provides ample runway for product and team expansion. Key diligence gaps include gross margin, NRR, CAC payback, and exact burn rate, all of which are private and material to underwriting.

sections:
  - id: revenue-model-pricing
    title: Revenue Model and Pricing Architecture
    body: >-
      Gamma operates a credit-based freemium model that effectively bridges consumer pricing with
      B2B SaaS value delivery. Users begin on a free tier that provides 400 lifetime AI credits —
      enough for approximately 8–10 full deck generations — before hitting a hard paywall that
      drives upgrade decisions. This lifetime credit ceiling, introduced in late 2024, replaced an
      earlier monthly-reset approach and is more restrictive, creating a stronger conversion
      forcing function. Paid individual tiers run from $8–10/month (Plus) through $18–25/month
      (Pro) to $100/month (Ultra), while team tiers start at $20/seat/month (Team) and
      $40/seat/month (Business). The credit system meters usage by function: a standard 10-slide
      deck generation costs 40 credits, AI image generation costs 2–40 credits depending on
      quality, and content refinements cost 5–10 credits each. Revenue streams include
      subscription revenue from individual plans, seat-based revenue from team and business plans,
      and nascent API-access revenue from the Pro and higher tiers. Gamma has not disclosed a
      revenue breakdown by segment, but Sacra estimates the platform had over 600,000 paying
      subscribers at Series B close, with the bulk on Plus or Pro individual plans. Enterprise
      upsell via Team and Business plans is the highest-priority growth vector heading into 2026,
      with SOC 2 Type II compliance and SSO unlocking larger contract sizes.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
