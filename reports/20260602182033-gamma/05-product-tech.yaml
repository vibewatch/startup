company:
  name: "Gamma"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Gamma has evolved from an AI presentation builder into a full visual-communication platform
    delivering presentations, documents, webpages, and social assets from natural-language prompts.
    Its card-based, web-native architecture powered by a React/Yjs stack and multi-model AI engine
    now serves nearly 100 million users, while the March 2026 Gamma Imagine launch and an expanding
    integration ecosystem position the company beyond its original PowerPoint-replacement thesis.
    Key product risks include PowerPoint export fidelity gaps and an SOC 2 attestation still in
    progress, which together constrain enterprise procurement in regulated markets.

sections:
  - id: product-portfolio-and-formats
    title: "Product Portfolio and Output Formats"
    body: >-
      Gamma delivers content across four output types—presentations, interactive documents,
      webpages, and social graphics—all produced from natural-language prompts through its
      AI generation engine. The platform's foundational design choice is the card-based,
      scrollable format, which replaces the linear slide paradigm and enables inline embeds
      (video, live data, polls, branching paths) that are impossible in PowerPoint or Keynote.
      As of March 2026, the platform was approaching 100 million registered users globally,
      with more than 80 percent outside the United States, underlining its international-first
      traction. The content library includes 100-plus professionally designed, AI-native remixable
      templates that adapt to user-supplied content with a single command, eliminating the blank-page
      friction that plagued legacy tools. Gamma Agent, shipped in 2025, acts as a conversational
      AI design partner embedded directly in the editing surface, enabling users to restructure,
      condense, or redesign entire presentations through natural-language instructions. The platform
      supports AI-generated images via multiple image models and integrates brand kits on paid plans
      so teams can enforce visual identity without a dedicated design function. Outputs are shareable
      as live web links with built-in view analytics, or exported to PDF and PowerPoint, though
      reviewers consistently note that PowerPoint exports flatten text into static images and lose
      interactive elements, limiting utility in PPT-first enterprise workflows.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE001
    figureRefs:
      - FE001

  - id: use-cases-and-workflow
    title: "Use Cases and Customer Workflow Integration"
    body: >-
      Gamma's primary value proposition is reducing the time from idea to polished visual output.
      The generation workflow is three-step: the user provides input (topic, outline, pasted notes,
      or an uploaded document), the AI drafts a structured outline for review, and then generates
      the full deck with smart layouts, images, and typography in under 60 seconds. This compresses
      what previously required hours of PowerPoint or design-tool work. The platform serves a
      diverse user base: educators who turn curriculum notes into lesson decks, founders who build
      investor pitches, sales teams who personalise proposals at scale, and consultants who prototype
      client presentations from meeting transcripts. The March 2026 Gamma Imagine expansion broadened
      the use-case surface to include standalone visual asset creation—logos, infographics, diagrams,
      and social posts—competing more directly with Canva for non-presentation marketing-team
      workflows. Reviewers on G2 praise the speed and ease of use; Trustpilot reviews surface
      persistent complaints about AI generation quality and the absence of customer support on the
      free tier, indicating a quality gap that matters more to professional users under deadline.
      The card-based format is not universally preferred: users who must deliver editable PowerPoint
      files to clients face a workflow discontinuity at export, and those needing pixel-level
      design control are better served by tools like Figma or Canva.
    claimRefs:
      - CE009
      - CE010
      - CE036
      - CE037
      - CE038
    tableRefs:
      - TE002
    figureRefs:
      - FE002

  - id: technology-architecture
    title: "Technology Architecture and Infrastructure"
    body: >-
      Gamma's web application is built on a React-based frontend with Yjs—a CRDT (Conflict-free
      Replicated Data Type) library—powering conflict-free real-time collaborative editing across
      its Multiplayer service. The GitHub organisation exposes approximately 26 repositories
      including forks of ProseMirror, Tiptap, Chakra UI, and dnd-kit, which together form the
      open-source foundation of the editor layer. This reflects the company's strategy of building
      atop well-maintained open-source primitives rather than a proprietary editor core, reducing
      long-term maintenance burden but creating dependency risk on external project maintenance.
      On the AI layer, Gamma routes requests through a multi-model architecture that selects
      among large language models (including GPT-family and Claude integrations confirmed via the
      API changelog) and image-generation models including recraft-v4, gemini-3.1-flash-image,
      and flux-2-max depending on task type and user tier. Infrastructure is hosted on Google Cloud
      Platform, providing an enterprise-grade network and data centre foundation. The status page
      reports five independently monitored service components: Website, Web Application, API,
      Multiplayer, Site Hosting, and AI. All data in transit is encrypted with TLS 1.2 or higher;
      data at rest uses AES-256 encryption with scheduled key rotation. Zero-trust access controls
      grant access based on user identity and device context rather than network perimeter, and
      the platform stores only OAuth 2.0 revocable tokens rather than user credentials.
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
    tableRefs:
      - TE003
    figureRefs:
      - FE003

  - id: integration-and-developer-platform
    title: "Integration Ecosystem and Developer Platform"
    body: >-
      Gamma launched its public REST API at v1.0 general availability in November 2025 at
      https://public-api.gamma.app/v1.0/, replacing the v0.2 beta that was deprecated and disabled
      in January 2026. The API supports programmatic generation from text, generation from
      templates, async status polling, theme and folder listing, gamma archiving, and deletion.
      Authentication uses a custom X-API-KEY header; API access requires a Pro, Ultra, Teams, or
      Business plan. The developer docs also describe an MCP (Model Context Protocol) server that
      enables AI tools to create and read gammas using OAuth with Dynamic Client Registration,
      making Gamma accessible to any MCP-compatible AI assistant without requiring a traditional
      API key setup. On the no-code and low-code side, 2026 brought native automation integrations
      on Zapier, Make, and n8n (all at full v1.0 API parity), plus connectors inside ChatGPT
      (March 6, 2026), Claude (January 2026), Grok (May 2026), Atlassian Rovo, Superhuman Go,
      and Profound. An official npm package—@gammatech/n8n-nodes-gamma—enables self-hosted n8n
      deployments to generate Gamma content programmatically. The breadth of the integration
      surface reduces workflow switching costs for existing users of major productivity platforms
      and provides a distribution channel across ChatGPT's and Claude's large user bases.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
    tableRefs:
      - TE006

  - id: roadmap-and-release-velocity
    title: "Roadmap and Release Velocity"
    body: >-
      Gamma demonstrated significant product velocity in the first half of 2026. The flagship
      launch was Gamma Imagine on March 17, 2026—the company's most significant product expansion
      to date—which added AI-native design asset creation for logos, infographics, diagrams, and
      social posts, moving the platform into direct competition with Canva and Adobe Express for
      non-presentation marketing workflows. Gamma Imagine introduced Smart Charts (interactive
      data visualisations inheriting brand styling), AI Illustrations (logo and marketing asset
      generation from natural language), and AI Infographics (standalone diagram creation). The
      image model portfolio expanded to include recraft-v4, recraft-v4-pro, recraft-v4-svg,
      gemini-3.1-flash-image, gemini-3.1-flash-image-hd, flux-2-max, and flux-2-klein. The
      Create from Template API feature reached general availability concurrently, with PNG export
      and a stylePreset parameter added. CEO Grant Lee conducted a global user tour in March 2026
      starting in Seoul, London, and São Paulo, reinforcing the company's international growth
      narrative. The first live community event, Gammarama, was scheduled for June 2026. The
      company's stated forward direction is an increasingly agentic product that not only generates
      but also updates presentations automatically as underlying data changes and adapts content
      for different audiences.
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
    tableRefs:
      - TE005

  - id: trust-security-and-compliance
    title: "Trust, Security, and Compliance"
    body: >-
      Gamma's published security posture is centred on Google Cloud Platform hosting, zero-trust
      access controls, TLS 1.2-plus encryption in transit, AES-256 encryption at rest with
      scheduled key rotation, and OAuth 2.0 revocable token authentication. The company is
      actively pursuing SOC 2 attestation covering the five Trust Service Criteria—Security,
      Availability, Processing Integrity, Confidentiality, and Privacy—but had not completed the
      certification as of the report date. Gamma's Help Center groups its published compliance
      documentation under three topics: Privacy Policies, data protection practices, and DMCA and
      copyright compliance. Separately, the developer portal documents that the MCP server
      authenticates AI-tool access via OAuth with Dynamic Client Registration, providing a
      standardised and auditable access path for third-party AI integrations. The absence of a
      completed SOC 2 Type II certification is a material procurement risk: many enterprise and
      regulated-sector customers require a current audit report before approving vendors. Gamma's
      privacy documentation also does not yet confirm GDPR-specific data-residency controls for
      EU users, and the Help Center note that EU launch status is unspecified raises questions for
      European deals. Gamma's status page publicly documents service availability across Website,
      Web Application, API, Multiplayer, Site Hosting, and AI components, providing basic uptime
      transparency but lacking SLA commitments. Incident transparency could be strengthened with
      structured post-mortems and defined RTO/RPO targets for enterprise contracts.
    claimRefs:
      - CE032
      - CE033
      - CE034
      - CE035
    tableRefs:
      - TE004
    figureRefs:
      - FE004

