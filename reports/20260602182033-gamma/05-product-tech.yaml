      missingEvidence: "Published architecture documentation or engineering blog detailing how Gamma routes generation requests across multiple LLM providers (OpenAI, Anthropic, Google) and what criteria determine model selection."
      whyItMatters: "Without understanding the LLM routing layer, it is impossible to assess vendor lock-in risk, cost exposure to model-API pricing changes, or quality variability across user tiers and geographies."
      diligencePath: "Request engineering team interview or technical white paper; check Gamma engineering blog if one exists; monitor job postings for ML infrastructure roles that reveal the stack."
