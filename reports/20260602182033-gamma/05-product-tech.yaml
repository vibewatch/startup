callouts:
  - calloutType: "strength"
    title: "AI Generation Speed as Core Moat"
    body: >-
      Gamma's sub-60-second generation from natural language to a polished multi-card deck is its
      most defensible near-term moat. The React/Yjs architecture enables real-time collaboration
      atop an AI-first generation loop that legacy tools cannot replicate without fundamental
      redesign. The approaching-100-million-user base creates a data and network advantage that
      compounds through template popularity signals and brand-kit adoption.
    claimRefs:
      - CE003
      - CE011

  - calloutType: "risk"
    title: "PowerPoint Export Fidelity Is a Recurring Enterprise Blocker"
    body: >-
      Independent reviews from G2, Trustpilot, Deckary, and AiWithIt consistently identify
      PowerPoint export as the product's most significant limitation. Text is flattened to static
      images, animations are lost, and formatting inconsistencies require manual cleanup. In
      consulting, finance, legal, and enterprise environments where editable PPTX delivery is
      a contractual requirement, this converts a speed advantage into a workflow blocker.
      Gamma has not published a roadmap commitment to resolving export fidelity.
    claimRefs:
      - CE007
      - CE037
      - CE038

  - calloutType: "risk"
    title: "SOC 2 Absence Constrains Regulated-Sector Enterprise Sales"
    body: >-
      Gamma's SOC 2 Type II attestation is in progress but not yet complete. Many regulated-sector
      and enterprise procurement processes require a current audit report as a mandatory vendor
      qualification. Until Gamma completes and publishes its SOC 2 report, sales cycles in
      healthcare, financial services, and government markets will face compliance-gate friction that
      better-certified competitors (Salesforce, Microsoft, and Notion) do not encounter.
    claimRefs:
      - CE032

  - calloutType: "insight"
    title: "Gamma Imagine Pivots the Platform's Competitive Frame"
    body: >-
      The March 2026 Gamma Imagine launch reframes Gamma from a PowerPoint replacement to a
      full visual-communication platform. By adding AI-native logo, infographic, diagram, and
      social-post creation, Gamma now competes in a broader market alongside Canva, Adobe Express,
      and Figma, not just against presentation tools. This expands the total addressable market
      and reduces the presentation-export bottleneck's strategic importance, but it also requires
      Gamma to win on design quality benchmarks that pure-presentation rivals do not face.
    claimRefs:
      - CE026
      - CE027

