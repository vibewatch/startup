summary:
  headline: >-
    Gamma is the most capital-efficient path to $100M ARR in AI SaaS and warrants a conditional buy at a 15–20% discount
    to the Series B price, subject to private diligence confirming net dollar retention, gross margin, and enterprise
    revenue durability.
  overallScore: 7.5
  recommendation: buy
  confidence: medium
  riskRating: medium
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 2100
    revenueRunRateUsdM: 100
    arrUsdM: 102
    revenueGrowthYoYPct: 365
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 90
    customerCount: 600000
    headcount: 52
  topStrengths:
    - >-
      $100M ARR on $23M primary capital — roughly 4.3× ARR per dollar of primary raised, placing Gamma among the most
      capital-efficient SaaS growth stories on record.
    - >-
      Profitable since 2023 and still profitable at the $100M ARR milestone: operational cash-flow positivity constrains
      the bear case and means the Series B was discretionary, not a survival necessity.
    - >-
      Organic PLG flywheel: 70M users acquired with zero paid marketing via viral 'Made with Gamma' watermarking; 1M+
      pieces of content generated daily creates a durable acquisition moat.
    - >-
      21× ARR multiple is precisely at the AI-native SaaS VC median (saasrise.com, 575+ companies, Q1 2026), making the
      Series B price market-rate rather than anomalous.
    - >-
      Rapid product velocity: Gamma Agent, Gamma Imagine, public API, and v3.0 all shipped within six months of the
      Series B, demonstrating strong engineering execution and expanding TAM.
  topRisks:
    - >-
      No disclosed net dollar retention by cohort: the single largest underwriting gap, as every premium SaaS multiple
      depends on durability evidence that Gamma has not yet published.
    - >-
      Microsoft Copilot for PowerPoint and Google Gemini for Slides are embedding AI generation natively inside
      incumbent productivity suites already licensed by enterprise buyers.
    - >-
      Phishing threat actors are actively exploiting gamma.app to host Microsoft credential-harvesting redirect pages,
      creating brand and enterprise-trust exposure that could slow procurement.
    - >-
      AI model provider dependency: reliance on OpenAI and Anthropic APIs exposes gross margins and product reliability
      to third-party pricing changes and model policy shifts.
    - >-
      Freemium SMB base with ~0.9% gross conversion rate and unknown churn creates structural revenue fragility if
      enterprise upsell does not accelerate post-Series B.
  unresolvedGaps:
    - >-
      Net dollar retention by cohort — essential for underwriting durability at 21× ARR and currently not publicly
      disclosed.
    - >-
      Gross margin, CAC payback, and operating expense structure — none are publicly available, preventing full
      unit-economics underwriting.
    - >-
      Enterprise vs. SMB ARR breakdown and average contract value — revenue quality and upsell trajectory cannot be
      assessed without segment-level data.
    - EU AI Act compliance roadmap and data-residency posture — material for European enterprise procurement decisions.
    - >-
      Post-Series B headcount growth plan and projected margin impact — key risk is that scaling from 52 to hundreds of
      employees compresses the profitability that anchors the bull case.
