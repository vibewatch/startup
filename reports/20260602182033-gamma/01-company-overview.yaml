  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: founders
      missingEvidence: "Names, titles, and backgrounds of Gamma's non-founder senior leadership team members including heads of engineering, product, design, go-to-market, and people functions."
      whyItMatters: "Leadership depth beyond the three co-founders is a standard diligence data point. Absence of a named leadership bench makes key-person risk assessment incomplete and limits governance analysis."
      diligencePath: "Request a leadership org chart or team page directly from Gamma; cross-reference LinkedIn headcount data and press coverage for named executives; check recent job postings that indicate reporting structures."
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO002

    - type: enumeration-incomplete
      severity: minor
      topic: funding
      missingEvidence: "Names and investment amounts for undisclosed angels in the seed round, and any LP-level or secondary market participants not named in official press materials."
      whyItMatters: "Cap table composition at the angel and LP level affects dilution modeling, governance dynamics, and potential conflict-of-interest analysis in later rounds."
      diligencePath: "Review SEC Form D filings for Gamma (if any), check Crunchbase and PitchBook for any additional disclosed investors, or request a cap table summary from the company."
      relatedTableRefs:
        - TO003

    - type: private-evidence-only
      severity: minor
      topic: ARR
      missingEvidence: "Audited or third-party verified ARR figures; Gamma's revenue breakdown by plan tier (Free, Plus, Pro, Ultra) and by geography."
      whyItMatters: "All ARR figures are either company-stated or Sacra analyst estimates. Without audited financials or independent verification, ARR definitions (bookings vs. recognized revenue vs. run rate) and geographic distribution cannot be validated."
      diligencePath: "Request audited financial statements or a data room from Gamma investor relations; obtain Sacra's full subscriber-level methodology; review any regulatory filings if the company has disclosed financials publicly."
      relatedTableRefs:
        - TO004

