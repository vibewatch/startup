callouts:
  - calloutType: strength
    title: "Extreme Capital Efficiency at Scale"
    body: >-
      Gamma reached $100 million ARR on approximately $23 million of primary capital—less than one
      quarter of capital per dollar of ARR versus a typical SaaS benchmark. The company has been
      profitable since 2023, meaning it did not need the Series B to survive; it raised the round to
      accelerate from a position of strength. With approximately 52 employees, revenue per employee
      is approximately $1.9 million, which is among the highest ratios in the productivity software
      category. This capital efficiency profile is the central diligence signal for any analysis of
      Gamma's unit economics and long-term return potential.
    claimRefs:
      - CO015
      - CO017
      - CO019
      - CO023

  - calloutType: risk
    title: "Phishing Exploitation and Dual-Use Platform Risk"
    body: >-
      In 2025, cybercriminals leveraged Gamma's gamma.app domain and its free website-publishing
      feature to host phishing pages targeting Microsoft account credentials. The attack exploited
      Gamma's brand credibility—organizations that whitelist gamma.app for legitimate presentations
      inadvertently trusted the phishing pages. The incident was not a data breach of Gamma's
      infrastructure, but it exposed a structural dual-use risk inherent in any platform that enables
      easy public link creation without abuse-detection guardrails. For enterprise evaluators, this
      incident requires review of Gamma's content-policy enforcement mechanisms.
    claimRefs:
      - CO032

  - calloutType: insight
    title: "The March 2023 AI Inflection Is the Founding Proof Point"
    body: >-
      Gamma's entire growth story traces back to a single product decision: integrating GPT-3.5 for
      AI presentation generation in March 2023. Prior to that integration, Gamma had approximately
      60,000 users and about one year of runway remaining. After the integration, daily signups jumped
      from hundreds to approximately 10,000 per day. Within nine months the company had added 10
      million users. This before-and-after contrast is unusually clean evidence of product-market fit
      and distinguishes Gamma from AI-slides competitors who adopted AI later and achieved lower
      conversion. The 2023 inflection point is the analytical anchor for every ARR and user
      projection that follows in this report.
    claimRefs:
      - CO035
      - CO036
      - CO025
      - CO021

