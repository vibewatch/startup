company:
  name: Gamma
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Gamma is a San Francisco-based AI presentation and document platform that reached $100 million ARR
    in November 2025 on approximately $23 million of primary capital, a capital efficiency ratio that
    anchors its Series B valuation of $2.1 billion. With 70 million users, profitability since 2023,
    and a product expanding from AI slides to an agentic visual-storytelling platform, Gamma presents
    strong growth fundamentals tempered by commoditization risk from incumbents and negative user
    sentiment around billing and export fidelity.
sections:
  - id: identity-product-business-model
    title: "Identity, Product, and Business Model"
    body: >-
      Gamma is an AI-powered presentation, document, and webpage creation platform founded in November
      2020 and headquartered in San Francisco, California. The product replaces manual slide formatting
      with a prompt-driven generation workflow: users describe what they want, and Gamma produces
      professional-quality visual content in seconds. Its card-based output format deliberately breaks
      from conventional 16:9 PowerPoint conventions, rendering presentations as responsive web
      documents that share as links rather than file attachments. The business model is freemium: a
      free tier with limited AI credits drives user acquisition, while paid plans (Plus at roughly $8
      per month, Pro at roughly $15–18, Ultra at roughly $90–100) unlock expanded credits, advanced
      export options, analytics, and collaboration features. Gamma is hosted on Google Cloud Platform
      and holds SOC 2 Type II certification, supporting enterprise procurement. In September 2025,
      version 3.0 launched alongside Gamma Agent, an AI assistant that browses the web, refines
      content, and restylesdecks conversationally—repositioning the product from an AI slide builder
      to a full visual storytelling platform. March 2026 brought Gamma Imagine, an AI image-generation
      tool targeting marketing asset creation. An API launched in November 2025 connects Gamma to
      external automation tools including Zapier and Make.com. The company integrated GPT-3.5 in March
      2023, transforming daily signups from hundreds to approximately 10,000 per day and validating
      core product-market fit. That AI inflection event remains the defining chapter in Gamma's product
      history and is the primary driver of subsequent ARR growth.
    claimRefs:
      - CO001
      - CO005
      - CO028
      - CO029
      - CO030
      - CO031
      - CO035
      - CO036
      - CO042
      - CO047
      - CO048
    figureRefs:
      - FO002

  - id: founders-leadership-governance
    title: "Founders, Leadership, and Governance"
    body: >-
      Gamma was co-founded by Grant Lee (CEO), James Fox (President), and Jon Noronha (CPO), all
      former colleagues at Optimizely, a B2B experimentation software company. Grant Lee holds a
      mechanical engineering degree from Stanford University and worked in investment banking and
      consulting before joining Optimizely and co-founding Gamma. The founding insight came during
      Lee's 2020 advisory work, when he found himself spending roughly 90 percent of his time
      formatting slide decks rather than developing substantive content. The three founders built
      the initial product inside a converted two-bedroom apartment in San Francisco during
      COVID-19 shelter-in-place. Their shared Optimizely background instilled an experimentaton-driven
      culture that the company credits for its rapid product evolution. With approximately 52 full-time
      employees generating $100 million ARR as of November 2025, Gamma achieves roughly $1.9 million
      in revenue per employee—among the highest in the productivity SaaS category. The leadership
      team beyond the three founders is not publicly enumerated in official releases; an evidenceGap
      covers the remaining team composition. Governance is standard private-company structure with
      a board inclusive of Andreessen Horowitz, Accel, and the founding team following the Series B.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
    tableRefs:
      - TO002

  - id: funding-history-investors
    title: "Funding History and Investors"
    body: >-
      Gamma has raised approximately $87–91 million in total primary and secondary capital across
      three disclosed rounds. The $7 million seed closed in October 2021 led by Accel, with notable
      angels including Zoom CEO Eric Yuan and former LinkedIn CEO Jeff Weiner, plus founders of
      Airtable, Patreon, Segment, and Honey. Institutional seed co-investors included Script Capital,
      South Park Commons, LocalGlobe, Afore Capital, and Hustle Fund. The $12 million Series A
      followed in May 2024, again Accel-led, with Script Capital, Lorimer Ventures, South Park
      Commons, and Fellows Fund participating. The headline event was the November 2025 Series B:
      $68 million led by Andreessen Horowitz at a $2.1 billion valuation, with Accel, Uncork Capital,
      South Park Commons, and Script Capital participating. The round included a $20 million secondary
      component providing liquidity for early employees. Sarah Wang, General Partner at a16z, led the
      investment and publicly identified herself as a Gamma power user. The most significant capital
      efficiency signal in Gamma's history is the ratio between primary capital raised and ARR
      achieved: before the Series B, the company had raised approximately $23 million in primary
      capital while growing to $100 million ARR—a roughly 4.3x return on capital deployed into
      the business before any Series B dilution.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO039
    tableRefs:
      - TO003

  - id: scale-metrics-milestones
    title: "Scale, Metrics, and Milestones"
    body: >-
      As of November 2025, Gamma reported $100 million ARR, 70 million total users, and more than
      600,000 paying subscribers. The company has been profitable since 2023 and was already
      profitable when it crossed $50 million ARR in May 2025 with approximately 30 employees.
      Sacra estimated ARR at approximately $102 million in October 2025 with 365 percent year-over-year
      growth in 2024 from a base of approximately $30.5 million. The ARR trajectory accelerated
      sharply: $32.5 million by December 2024, $50 million by May 2025, and $100 million by
      November 2025—a doubling in six months. Users have collectively created more than 400 million
      presentations, documents, and websites on the platform, with more than 1 million new pieces of
      content generated per day. India is the fastest-growing market with 9.5 million users, achieved
      without direct marketing spend, and the company plans a local Asia-Pacific presence in 2026.
      With approximately 52 employees at $100 million ARR, revenue per employee is approximately
      $1.9 million. At the $2.1 billion valuation against approximately $102 million ARR, the implied
      revenue multiple is approximately 21x ARR. In late 2022, Gamma had roughly 60,000 total users
      and about one year of runway before the all-in AI pivot that changed the company's trajectory.
    claimRefs:
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO037
      - CO041
      - CO043
      - CO044
      - CO045
    tableRefs:
      - TO001
      - TO004
    figureRefs:
      - FO001
      - FO003

  - id: risks-criticism-competitive-threats
    title: "Risks, Criticism, and Competitive Threats"
    body: >-
      Gamma faces commoditization risk from Microsoft PowerPoint and Google Slides, which together
      serve approximately 1.5 billion users and are integrating their own generative AI features
      (Microsoft Copilot for PowerPoint, Google Gemini for Slides) within enterprise ecosystems
      that buyers already pay for. Among AI-native competitors, Tome illustrated the category risk:
      despite raising $81 million and accumulating 25 million users, Tome pivoted away from
      presentations after achieving only $3.5 million ARR, demonstrating that user acquisition
      alone does not guarantee monetization. In 2025, cybercriminals exploited Gamma's gamma.app
      domain and its free website-publishing capabilities to host phishing redirectors targeting
      Microsoft account credentials. The attack was not a platform security breach but caused
      reputational exposure and surfaced the dual-use risk inherent in any platform that enables
      easy public link creation. User review sentiment on Trustpilot is materially negative at
      approximately 1.7 out of 5, with recurring complaints about auto-renewal billing practices,
      unresponsive customer support, and PowerPoint export incompatibility. The card-based web format
      does not cleanly export to standard 16:9 PPTX dimensions, limiting appeal to users who must
      deliver client-grade slide decks. In early 2023, Gamma nearly missed payroll during the Silicon
      Valley Bank collapse before switching to JP Morgan, a reminder that operational treasury risk
      is non-zero for early-stage companies and warranted its own disclosure.
    claimRefs:
      - CO032
      - CO033
      - CO034
      - CO038
      - CO040
      - CO046

