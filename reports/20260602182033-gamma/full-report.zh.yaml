      - number: '4.2'
        title: 公开牵引力与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              Gamma 的收入轨迹是企业 SaaS 中最快的自然增长曲线之一。公司从 2023 年 6 月约 $7M ARR，增长到 2024 年 9 月 $24M ARR、2025 年 8 月 $50M ARR，并在
              2025 年 11 月达到 $100M ARR；2024 年底到 2025 年底同比增长 365%。这一增长没有任何付费营销：70% 的用户增长来自自然推荐，源头是免费层导出中的「Made with
              Gamma」品牌水印和演示稿的病毒式分享。B 轮交割时，平台披露全球 70 million 注册用户；不过 600,000+ 付费订阅者意味着注册到付费的总转化率约 0.9%，与高频工具的免费增值 PLG
              基准相符。自上线以来，平台已创建超过 400 million 件内容；到 B 轮公告时，每天新生成资产超过 1 million 件。公司自 2024 年 1 月起盈利，在一批通常会在增长阶段持续重亏的 AI
              创业公司中属于异类。Sacra 估计 2025 年 10 月 ARR 约 $102M，意味着 2025 年第四季度仍在继续加速。 2026 年 ARR 目标尚未公开披露。
