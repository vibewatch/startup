            body: >-
              数据室需索取以下材料：（1）过去 8 个季度按季度列示的毛利率，并附 COGS 明细；（2）按套餐层级拆分的 NRR；（3）月度订阅者队列表，列示新增、留存、流失和扩张订阅；（4）按获客渠道拆分的 CAC（自然
              PLG 与外呼）；（5）员工数轨迹以及 Series B 招聘计划后的预计运行率薪酬。这五项是严谨承销单位经济模型的最低要求。
