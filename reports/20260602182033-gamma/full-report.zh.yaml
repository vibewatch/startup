      - number: '5.7'
        title: 展示材料
        blocks:
          - type: callout
            title: AI 生成速度是核心护城河
            body: >-
              Gamma 用不到 60 秒把自然语言转成精美多卡片演示稿，这是其短期内最可防守的护城河。React/Yjs 架构在 AI 优先的生成闭环上支撑实时协作；传统工具若不进行根本性重构，很难复制。接近 1
              亿的用户基础带来数据和网络优势，并通过模板热度信号和品牌工具包采用不断复利。
            calloutType: strength
            claimRefs:
              - CE003
              - CE011
          - type: callout
            title: PowerPoint 导出保真度反复卡住企业采用
            body: >-
              来自 G2、Trustpilot、Deckary 和 AiWithIt 的独立评测一致认为，PowerPoint
              导出是产品最重要的限制。文本被压平成静态图片，动画丢失，格式不一致还需要手工清理。在咨询、金融、法律和企业环境里，可编辑 PPTX 交付常常是合同要求；此时，速度优势会变成工作流阻塞点。Gamma
              尚未公开承诺解决导出保真度的路线图。
            calloutType: risk
            claimRefs:
              - CE007
              - CE037
              - CE038
          - type: callout
            title: 缺少 SOC 2 限制受监管行业的企业销售
            body: >-
              Gamma 的 SOC 2 Type II 鉴证正在推进，但尚未完成。许多受监管行业和企业采购流程把当前有效的审计报告列为强制供应商资格。Gamma 完成并发布 SOC 2
              报告之前，医疗、金融服务和政府市场的销售周期都会遇到合规闸口摩擦，而 Salesforce、Microsoft 和 Notion 等认证更完善的竞争对手不会遇到同样障碍。
            calloutType: risk
            claimRefs:
              - CE032
          - type: callout
            title: Gamma Imagine 改写平台竞争框架
            body: >-
              2026 年 3 月 Gamma Imagine 发布后，Gamma 从 PowerPoint 替代品被重新定义为完整的视觉沟通平台。加入 AI 原生 标志、信息图、图表和社交帖子创作后，Gamma
              不再只与演示工具竞争，而是进入 Canva、Adobe Express 和 Figma 所在的更宽市场。这扩大了总可用市场，也降低了演示文稿导出瓶颈的战略重要性；但同时要求 Gamma
              在设计质量基准上取胜，而纯演示文稿竞争对手不必面对这类基准。
            calloutType: insight
            claimRefs:
              - CE026
              - CE027
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              Gamma 服务五类清晰客户群，它们在买方画像、使用场景、升级倾向和收入贡献上各不相同。教育群体覆盖学生、教师和 EdTech 管理者，贡献高用户量但偏向免费层；教育工作者看重 Gamma
              能消除设计摩擦，在几分钟内产出精美讲义幻灯片或课程材料，且不需要技术技能。营销和销售团队估计约占用户基础的 30%，用 Gamma
              制作活动演示稿、业绩报告和客户提案；这一队列升级倾向更强，因为经常性内容创作会持续耗尽 AI 点数。企业用户约占用户基础的 35%，包括咨询公司、内部沟通团队和项目经理，他们用 Gamma
              制作高管简报、入职材料并支持全球协作。创业公司和创始人是战略上重要的群体：创始人制作融资演示稿时，Gamma
              往往是第一个被打开的工具，因为它能把数小时设计任务压缩到两分钟内。最后，普通专业消费者——自由职业者、顾问和独立创作者——按人数是最大群体，但主要在 Plus 和 Pro 层级贡献中等 ARPU。Gamma
              的免费增值模式意味着五类用户以同样方式进入产品；分化来自 AI 点数 耗尽、团队管理需求和品牌要求，这些因素把用户推向付费层。免费层用户集中度很高（约 70M 注册账户中 99%
              为免费用户），意味着收入生成高度依赖一小部分高参与度或高需求账户，既是增长杠杆，也是流失敏感风险。
