      - number: '4.5'
        title: 资本充足性与 B 轮资金部署
        blocks:
          - type: paragraph
            body: >-
              Gamma 于 2025 年 11 月完成 $68M B 轮，估值 $2.1B，由 Andreessen Horowitz 领投，Accel 和 Uncork Capital 参与。该轮包括 $20M
              老股交易，为早期员工提供流动性。累计融资目前约 $87–91M，覆盖三轮（种子轮、A 轮、B 轮）。由于公司在 B 轮交割前尚未花掉 $12M A 轮资金，且已确认盈利， Gamma 进入 2026
              年时拥有充足现金储备。公司表示，新资金将用于 AI 工程招聘、产品开发提速和企业市场扩张，但未披露具体资本分配。没有披露下一轮融资触发条件或计划中的 IPO 时间表。公司的盈利能力使其运营不依赖外部资本，B
              轮提供的是战略选择权，而不是生存现金跑道。Gamma 没有披露债务、典型 SAFE 结构之外的可转债，或项目融资义务。隐含 21x ARR 倍数（$2.1B 估值对应约 $102M
              ARR）反映市场给一家资本效率高、已盈利、超高速增长的 AI 平台以溢价定价，但也意味着 2026 年及以后有重大执行预期。
