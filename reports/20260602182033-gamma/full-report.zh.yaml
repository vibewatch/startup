chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Gamma 是一个 AI 驱动的演示文稿、文档和网页创作平台，成立于 2020 年 11 月，总部位于 California 州 San Francisco。产品用提示词驱动的生成流程替代手工幻灯片
              排版：用户描述想要的内容，Gamma 几秒内生成专业质量的视觉内容。它刻意脱离传统 16:9 PowerPoint 惯例，采用卡片式输出，把演示文稿渲染为响应式 Web 文档，并通过链接而不是文件附件分享。
              商业模式是免费增值：带有限 AI 积分的免费层负责拉新，付费计划（Plus 约 $8/month，Pro 约 $15–18，Ultra 约 $90–100）解锁更多积分、高级导出、分析和协作功能。 Gamma
              托管在 Google Cloud Platform，并持有 SOC 2 Type II 认证，支持企业采购。2025 年 9 月，3.0 版本与 Gamma Agent 同步发布；这个 AI
              助手可以浏览网页、润色内容，并以对话方式重塑 演示稿风格，把产品从 AI 幻灯片生成器重新定位为完整的视觉叙事平台。2026 年 3 月，Gamma Imagine 上线，作为面向营销素材创作的 AI
              图像生成工具。2025 年 11 月发布的 API 把 Gamma 连接到 Zapier、Make.com 等外部自动化工具。公司在 2023 年 3 月集成 GPT-3.5，使每日注册量从数百人跃升至约
              10,000 人，验证了核心产品市场契合。这个 AI 拐点仍是 Gamma 产品史的定义性章节，也是后续 ARR 增长的主驱动。
