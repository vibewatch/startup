      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Gamma 的 70 million 用户基数，可按职业角色、公司规模和使用场景拆分。企业专业人士约占用户 35%，其中营销和销售职能是最大单一细分，占 30%。教育工作者和培训师占全球用户 20–25%，反映
              Gamma 在 K-12 和高等教育市场渗透强，免费层访问和便捷链接分享契合这些场景。咨询和金融专业人士占 15%，创业者另占 10%。按公司自身定位和第三方 ICP 分析，Gamma
              的理想客户画像是「高节奏的个人知识工作者」：创始人、营销人员、教育者或顾问，需要频繁产出专业视觉内容，缺少正式设计训练，并愿意采用 Web 原生、基于链接的交付方式而不是 PPTX 附件。这个画像推动 Gamma
              的免费到付费转化漏斗；对个人用户而言，移除品牌露出（「Made with Gamma」水印）是主要升级触发点。预算归属因细分而异。在企业和中端市场部署中， 预算所有者通常是团队负责人、市场总监，或签批 SaaS
              科目的 CFO；在教育场景中，可能是自掏腰包的教师，也可能是来自学区或大学 IT 预算的机构授权。自由职业者和创业者则完全自费。 采用路径遵循病毒循环：免费用户创建可分享的 Gamma
              链接，接收者点击后发现工具，由此形成无需营销支出的自然获客。India 的 9.5 million 用户完全靠这一机制积累。免费到付费的推进，来自使用摩擦（积分限制）、
              专业需求（移除品牌、分析）和团队扩张（集中计费、管理员控制）。Team 计划 $240/seat（最低 2 seats）和 Business 计划 $480/seat（最低 10
              seats）构成企业变现路径。AI 原生 SaaS 工具的免费增值转化基准在 2026 年为 15–20%，显著高于传统 SaaS 的 8% 中位数；但 Gamma 在 70 million 总用户中只有
              600,000 名付费订阅者，意味着总转化率低于 1%，显示免费用户基数中存在大量低参与用户。
