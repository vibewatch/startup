      - number: '7.4'
        title: 财务与运营风险
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年末，Gamma 已实现运营盈利，缓解了近期烧钱风险，但结构性因素仍抬高其财务风险画像。推动 70M 用户增长的免费增值漏斗主要服务免费层或低 ARPU SMB 账户；行业数据显示，SMB
              SaaS 年流失率为 40%（月度 4.2%），而 ACV 超过 $100K 的企业账户为 8.1%。Gamma 收入集中在这一高流失细分市场，带来脆弱性：AI
              工具偏好若发生明显转移，或竞争对手提供更低门槛的免费层，可能触发免费用户快速出走。2026 年 Grip Security SaaS AI 治理报告指出，AI 集成 SaaS 环境存在治理缺口，包括 Gamma
              的集成面；AI 风险会通过连接的工作流传播，而供应商责任边界并不清晰。2026 年 1 月 Trustpilot 数据显示，Gamma 因订阅计费失败、账户可携带性问题和客服无响应等用户投诉，被评为「差」，评分
              1.7/5——这些面向客户的运营缺口信号可能加速企业拒绝。根据状态页，截至 2026 年 6 月，所有监控组件正常运行时间为 100%，但企业 SLA 要求成文的灾难恢复和业务连续性计划，Gamma
              尚未公开披露。G2 评论强调，AI 生成图片有时嵌入文本难以辨认，需要人工修正，指向 AI 输出质量波动风险。公开市场对被视为 AI 封装型应用的 SaaS 公司倍数压缩，也放大了财务估值风险；Gamma
              2025 年 11 月融资时 21× ARR 的倍数，如果企业渗透停滞，容易被重新定价。
