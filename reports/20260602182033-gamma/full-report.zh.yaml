      - number: '8.5'
        title: 投资建议与最终尽调事项
        blocks:
          - type: paragraph
            body: >-
              证据支持有条件投资，但价格应较 $2.1B Series B 投后估值折让 15–20%。折扣用于补偿三项未解估值风险：未按队列公开 NDR、毛利率缺乏验证、老股交易后股权结构表稀释仍不确定。相对 AI 原生
              SaaS 同类公司，Gamma 当前估值不是泡沫——21× ARR 倍数处在品类中位数，也得到 Figma 和 Canva
              公开可比公司的验证。不过，乐观情景需要企业工作流深度，必须在尽调中确认。首要投资风险是竞争替代（Microsoft Copilot、Google Gemini），以及 Gamma 如果从 AI 原生被重估为 AI
              赋能 SaaS 后发生倍数压缩——公允倍数会从 21× 降到 8.5×，按当前 ARR 估值将下降 60%。Gamma 的经营盈利能力给灾难性下行提供了有意义的底：一家现金流为正、ARR 超过 $100M
              的公司，即使条件不利，也不太可能低于 5× ARR 交易，对应约 $500M 的硬底。六项最终尽调要求（TV006）按决策关键度排序；其中 NDR 是投资建议落定前优先级最高的单项。2025 年 AI 捕获全球
              VC 的 61%（总额 $258B），结构性顺风降低了未来融资风险，也支撑高倍数环境延续到 2026 年。
