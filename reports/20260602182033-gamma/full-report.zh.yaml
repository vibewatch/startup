            body: >-
              Gamma 约 0.86% 的免费增值转化率低于 SaaS 行业 2–5% 基准，但 70M 用户基础把这个低转化率转成了 600,000+ 付费订阅者，足以支撑公司以 52 名员工、盈利状态做到 $100M
              ARR。结构性含义是，转化率只要提升到 1.5%，无需新增用户获取投入，就能把付费订阅者基数翻倍。
