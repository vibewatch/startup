      - number: '3.3'
        title: 切换成本、分发能力与锁定
        blocks:
          - type: paragraph
            body: >-
              这个品类里最强的竞争护城河属于既有巨头，而不是任何 AI 原生创业公司。Microsoft 和 Google 已经拥有决定企业如何创建和审批演示文稿的文档库、管理员控制台、身份层和训练出来的使用肌肉记忆。
              Canva 增加了另一种分发向量：一个全用途视觉内容套件，可以吸收轻量演示文稿任务，而不要求客户再买一个订阅。Gamma 的 Web 原生格式降低了链接分享摩擦，但也给那些围绕
              PPTX、Slides、模板或内部审批工作流做标准化的买方制造治理问题。导出支持有帮助，却无法完全抹掉买方的担忧：Gamma 演示稿在进入董事会、客户或受监管场景前可能还需要修补。因此切换成本是不对称的：
              Gamma 很容易试用，既有巨头很难替代。这种不对称让自下而上的病毒式分发有价值，但不足以支撑企业级耐久性。
