  - id: TV006
    title: 最终尽调问题表
    columns:
      - 优先级
      - 尽调问题
      - 为什么影响估值
      - 决策影响
      - 询问对象
    rows:
      - - 1 — 关键
        - 按队列拆分净美元留存率（NDR）：企业（>$10K ACV）、中端市场、SMB、免费转付费
        - NDR 是 SaaS 溢价倍数最重要的单一预测变量；Figma 130%+ NDR 支撑 IPO 时 22× ARR；没有 NDR 数据，Gamma 的 21× 倍数未经验证
        - 企业 NDR <100% 则逻辑破裂；NDR >120% 则乐观情景确认
        - Gamma CFO 或财务 VP；要求按客户分部和获客年份做队列分析
      - - 2 — 关键
        - 按分部拆分毛利率：整体、AI 推理成本占 COGS 的比例，以及 2023–2026 年趋势
        - AI 推理成本走势决定 Gamma 的盈利能力是可持续还是被侵蚀；从 OpenAI 转向自托管模型会改善毛利率，但尚未确认
        - 若毛利率低于 65%，倍数压缩；若 AI 推理成本占 COGS 比例下降，乐观情景成立
        - Gamma CFO；要求经审计或管理层审阅的分部 P&L
      - - 3 — 高
        - Series B 股权结构表：交割后所有权表，包括所有老股转让、创始人和核心员工归属安排、期权池规模和使用情况
        - Series B 中 $20M 老股部分显示早期投资者部分套现；股权结构清晰可避免逆向选择和隐藏抛压
        - 对任何退出情景下投资者回报的稀释影响建模必不可少
        - Gamma 法务顾问或 CFO；标准 VC 数据室项目
      - - 4 — 高
        - AI 模型备用架构和供应商合同条款：使用哪些模型、价格层级，以及主模型被弃用或重新定价时的备用逻辑
        - Gamma 称有 20+ 个 AI 模型；公开文档没有确认模型切换或成本管理架构；API 定价变化会直接传导到毛利率
        - 若没有备用架构，OpenAI 或 Anthropic 涨价时毛利率风险会陡增
        - Gamma CTO 或工程 VP；要求技术架构概览和模型供应商合同
      - - 5 — 重要
        - EU AI Act 合规路线图，以及面向欧盟用户的 GDPR 处理者协议
        - EU AI Act 的 GPAI 义务自 2025 年 8 月生效；不合规罚款最高达全球营业额 7%；Gamma 的欧盟用户群带来监管敞口
        - 潜在监管责任可能削弱欧洲市场扩张，并带来投资者责任
        - Gamma 总法律顾问；要求 EU AI Act 准备度评估和 DPA 模板
    notes: 优先级（关键、高、重要）反映其对投资逻辑的决策关键性。关键项若出现反向结果，会改变投 / 不投建议；重要项影响定价和风险调整。所有问题都是后期私营 SaaS 机构尽调的标准事项。
