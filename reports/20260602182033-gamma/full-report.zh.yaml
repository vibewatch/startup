      - number: '5.5'
        title: 路线图与发布速度
        blocks:
          - type: paragraph
            body: >-
              2026 年上半年，Gamma 展现出很强的产品速度。旗舰发布是 2026 年 3 月 17 日的 Gamma Imagine——公司迄今最重要的产品扩展——新增 AI
              原生设计资产创作，覆盖标志、信息图、图表和社交帖子，使平台在非演示文稿营销工作流上直接与 Canva 和 Adobe Express 竞争。Gamma Imagine 引入 Smart
              Charts（继承品牌样式的交互式数据可视化）、AI Illustrations（用自然语言生成标志和营销资产）以及 AI Infographics（独立图表创作）。图像模型组合扩展到
              recraft-v4、recraft-v4-pro、recraft-v4-svg、gemini-3.1-flash-image、gemini-3.1-flash-image-hd、flux-2-max 和
              flux-2-klein。Create from Template API 功能同步 GA，并新增 PNG 导出和 stylePreset 参数。CEO Grant Lee 于 2026 年 3
              月启动全球用户巡回，首站包括 Seoul、London 和 São Paulo，强化公司的国际增长叙事。首场线上社区活动 Gammarama 计划于 2026 年 6
              月举行。公司声明的前进方向，是把产品做得越来越智能体化：不仅生成演示文稿，还能在底层数据变化时自动更新，并针对不同受众适配内容。
