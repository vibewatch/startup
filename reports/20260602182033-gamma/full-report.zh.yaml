companyProfile:
  summary: >-
    Gamma 是一家位于 San Francisco 的 AI 演示文稿、文档和网页创作平台，由 Grant Lee（CEO）、James Fox（President）和 Jon Noronha（CPO）于 2020 年 11
    月创立，三人都曾在 Optimizely 共事。产品用提示词驱动的生成流程替代手工排版演示稿， 输出可响应式呈现、以链接分享的 Web
    原生视觉内容。免费增值的积分模型负责拉新；付费计划（Plus、Pro、Ultra、Team、Business） 将活跃用户转化为订阅者。公司用约 $23M 新股资金在 2025 年 11 月做到 $100M ARR，是 SaaS
    历史上资本效率最高的一类增长轨迹， 并且自 2023 年起已经盈利。2025 年 11 月，Andreessen Horowitz 领投、估值 $2.1B 的 $68M B 轮完成，使累计融资达到约 $90M。Gamma
    Agent、Gamma Imagine 和公开 API 的产品扩展，让平台从最初的幻灯片生成工具走向完整的 AI 视觉叙事套件。
