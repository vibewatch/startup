      - number: '5.3'
        title: 技术架构与基础设施
        blocks:
          - type: paragraph
            body: >-
              Gamma 的网页应用基于 React 前端构建，并用 Yjs——一种 CRDT（Conflict-free Replicated Data Type，无冲突复制数据类型）库——通过 Multiplayer
              服务支撑无冲突实时协同编辑。其 GitHub 组织公开了约 26 个代码库，包括 ProseMirror、Tiptap、Chakra UI 和 dnd-kit
              的分叉版本，共同构成编辑器层的开源基础。这反映出公司选择搭建在维护良好的开源原语之上，而不是自研专有编辑器内核；这样能降低长期维护负担，但也带来对外部项目维护的依赖风险。在 AI 层，Gamma
              通过多模型架构路由请求，按任务类型和用户层级在大语言模型（包括 API 更新日志确认的 GPT 系列和 Claude 集成）以及图像生成模型之间选择，图像模型包括
              recraft-v4、gemini-3.1-flash-image 和 flux-2-max。基础设施托管在 Google Cloud Platform
              上，提供企业级网络和数据中心基础。状态页列出五个独立监控的服务组件：Website、Web Application、API、Multiplayer、Site Hosting 和 AI。传输中的所有数据均使用
              TLS 1.2 或更高版本加密；静态数据使用 AES-256 加密，并定期轮换密钥。零信任访问控制根据用户身份和设备上下文授权，而不是依赖网络边界；平台仅存储可撤销的 OAuth 2.0
              token，不保存用户凭据。
