      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Gamma 由 Grant Lee（CEO）、James Fox（President）和 Jon Noronha（CPO）共同创立，三人都曾在 B2B 实验软件公司 Optimizely 共事。Grant Lee
              拥有 Stanford University 机械工程学位，加入 Optimizely 并共同创办 Gamma 前曾做投行和咨询。 创业洞察来自 Lee 2020 年的顾问工作：他发现自己约 90%
              的时间都花在演示稿排版上，而不是打磨实质内容。COVID-19 居家避疫期间，三位创始人在 San Francisco 一套改造后的两居室公寓里做出了最初产品。他们共同的 Optimizely
              背景塑造了实验驱动文化，公司也把快速产品迭代归因于这一点。截至 2025 年 11 月，约 52 名全职员工创造 $100M ARR，Gamma 的人均收入约 $1.9M，处在生产力 SaaS
              品类最高水平。除三位创始人外，官方发布未公开完整领导层名单；证据缺口覆盖剩余团队构成。治理结构是标准私营公司架构； B 轮后董事会包括 Andreessen Horowitz、Accel 和创始团队。
