          - type: paragraph
            body: >-
              Gamma 的投资逻辑建立在三项可复利优势之上，合在一起支撑 AI 原生 SaaS 的溢价倍数。第一，资本效率：公司用不到 $90M 累计资本做到 $100M ARR，并保持盈利运营，证明 AI
              驱动产品交付存在结构性成本优势；采用传统员工扩张模型的竞争对手很难轻易复制。第二，网络与数据飞轮：70M 注册用户生成海量隐性偏好数据——模板选择、编辑模式、设计反馈信号——可随规模提升 AI
              输出质量，并在用户积累 Gamma 原生资产库时制造切换摩擦。第三，产品类别时点：AI 原生工具正在替代 Office 时代的传统生产力软件，Gamma 处在企业采购动能最强、且 Microsoft 和
              Google 尚未完全巩固嵌入式 AI 优势的窗口。反向逻辑同样重大。Gamma 的 21× ARR 倍数已经计入持续企业渗透增长，但这尚未被公开证据证明。公司没有披露
              NDR，无法独立验证企业队列是在扩张还是在流失。缺少专利组合、且集中于单一高可见度 AI 产品类别，使其面临来自 Microsoft Copilot 和 Google Gemini
              的尖锐竞争替代风险；两者都在既有平台内以零增量成本发布 AI 原生演示功能。投资建议及其条件见 TV002 和 TV005。
