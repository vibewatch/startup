      - number: '2.2'
        title: 市场规模：TAM、SAM 与相互冲突的估算
        blocks:
          - type: paragraph
            body: >-
              多份分析师报告对演示软件市场给出一致的高层估算，但在 AI 原生子市场上分歧显著，原因是各方对什么算作「AI 演示工具」存在定义差异。 The Business Research Company 和
              Business Research Insights 都指向 2026 年 $8.9B 的全球 TAM，并预计到 2030–2035 年按 13.5–17.2% CAGR 增长至
              $16.6–27.8B。Coherent Market Insights 使用略有不同的 2026 年基线 $8.6B，但同样给出 2033 年 $21.4B 的终点和 13.9% CAGR。Global
              Growth Insights 将 2025 年市场定在 $7.85B，2026 年为 $8.91B。这些估算大体一致，说明演示软件市场正处在快速增长阶段， 主要由 AI 功能集成和云采用驱动。AI
              原生子市场估算分歧更大。Intel Market Research 估计 2026 年 AI 演示生成市场为 $0.73B，到 2034 年增至 $1.45B（CAGR 9.3%）——这是保守口径，排除了带 AI
              功能的一般云工具。相较之下，身处该市场的 2Slides 报告称，更宽口径的 AI 优先演示市场在 2026 年达到 $4.7B，较 2025 年 $3.1B 同比增长
              52%。这个更宽定义包括自主演示智能体、API 生成的演示稿，以及 Gamma、Beautiful.ai、SlidesAI 等平台。生成式 AI 的市场背景也相关：GMInsights 估计 2026
              年全球生成式 AI 市场为 $83.3B，并以 31.6% CAGR 增长至 2035 年 $988.4B，其中 OpenAI 占 23.6% 份额。这个宏观背景意味着，Gamma
              是全球增长最快软件品类之一中的小而快玩家。对于 Gamma 的可服务市场（SAM），合理边界是基于云、可免费增值触达、Web 原生的 AI 演示细分：2026 年约 $1–4.7B，取决于定义。以 Gamma
              $102M ARR 对比该 SAM，当前渗透率为 2–10%。未来 3 年的可获取市场（SOM） 取决于企业增购速度和地域扩张，目前没有公开预测。
