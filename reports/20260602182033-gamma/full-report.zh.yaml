        - 高 — 多个独立来源确认 ARR/FTE 数据
        - 正面；盈利底线限制下行空间，但团队能否规模化必须在尽调中确认
      - - AI 原生产品定位
        - Gamma 从一开始就为 AI 优先创作设计，不是把 AI 功能外挂到旧产品上；70M 用户语料形成隐性的训练和偏好数据飞轮
        - 基础模型厂商（OpenAI、Anthropic）可能直接面向消费者商品化 AI 内容创作，侵蚀 Gamma 的增值层
        - 中 — 数据飞轮逻辑成立，但未披露 AI 专有训练数据
        - 中性；需验证 Gamma 的模型路由能否形成持久差异，还是可被基于 GPT 的封装产品替代
      - - 免费增值漏斗顶端规模
        - 70M 用户相当于付费基数的 116× 漏斗放大器；教育和 SMB 的病毒式增长带来低成本、难复制的分发
        - 600K 付费 / 70M 注册 = 0.86% 转化率；SMB 年流失率 40%，带来每年收入补位压力
        - 高 — 用户数和付费订阅数由公司确认；转化率为分析师推导
        - 谨慎；高流量免费增值模型需要企业增购才能支撑溢价倍数；尽调需索取按队列拆分的 NDR
      - - 时点与市场动能
        - AI 赛道拿到 2025 年全球 VC 的 61%（$258B）；持续 AI 基础设施投资和企业 AI 采用，都会给 Gamma 带来顺风
        - Microsoft Copilot 和 Google Gemini AI Slides 已在 2026 年积极上线竞争功能；时点优势在消退
        - 高 — 多个市场数据来源确认 VC 分配数据和竞品功能发布
        - 中性；时点优势真实但窗口在收窄；竞争护城河必须靠企业深度证明，不能只靠产品相似度
      - - 投资方质量信号
