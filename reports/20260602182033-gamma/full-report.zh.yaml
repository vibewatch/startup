      - number: '5.4'
        title: 集成生态与开发者平台
        blocks:
          - type: paragraph
            body: >-
              Gamma 于 2025 年 11 月发布公共 REST API v1.0 GA，地址为 https://public-api.gamma.app/v1.0/，取代已在 2026 年 1 月弃用并停用的 v0.2
              beta。该 API 支持从文本生成、从模板生成、异步状态轮询、主题和文件夹列表、gamma 归档与删除。认证使用自定义 X-API-KEY 请求头；API 访问需要 Pro、Ultra、Teams 或
              Business 套餐。开发者文档还描述了一个 MCP（Model Context Protocol）服务器，使 AI 工具可通过 OAuth 和 Dynamic Client Registration
              创建和读取 Gamma 内容，让任何兼容 MCP 的 AI 助手无需传统 API key 配置即可访问 Gamma。无代码和低代码侧，2026 年出现了 Zapier、Make 和 n8n 的原生自动化集成（均与
              v1.0 API 完全对齐），以及 ChatGPT（2026 年 3 月 6 日）、Claude（2026 年 1 月）、Grok（2026 年 5 月）、Atlassian Rovo、Superhuman Go
              和 Profound 内部的连接器。官方 npm 包 @gammatech/n8n-nodes-gamma 支持自托管 n8n 部署以编程方式生成 Gamma
              内容。广泛的集成面降低了主要生产力平台现有用户的工作流切换成本，也借 ChatGPT 和 Claude 的庞大用户基础提供分发渠道。
