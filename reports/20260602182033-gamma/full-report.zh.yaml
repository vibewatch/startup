      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 的扩张策略依赖三套机制：AI 点数耗尽推动个人用户转向付费层，团队协作需求触发工作区 / Teams 升级，以及企业自动化买方产生 API 需求。Gamma for Teams 套餐和带 API
              访问的 Ultra 层是主要增购向量。扩张收入很大程度取决于企业内部个人用户采用能否转化为集中式 IT 采购；这一步要求 SOC 2 合规、SSO 和品牌控制功能，而 Gamma
              低层级套餐尚不能完全满足。集中度风险是多维的：印度 占用户基础 14%，但考虑其价格敏感用户画像，收入贡献不成比例地低；美国的收入占比相对用户占比很可能不成比例地高。免费增值漏斗高度集中：约 99%
              注册用户不付费，意味着整个 ARR 基础来自不到 1% 的账户。没有披露信息显示前 10 大客户收入集中度，或任何单一账户贡献超过 ARR 的 1%。渠道依赖目前较低——Gamma
              主要采用直销和自助销售，JPMorgan 的合作伙伴折扣是唯一公开已知渠道安排。病毒式驱动的自然增长模式降低了获客成本，但也带来地域集中（美国、印度、巴西）和细分集中（专业消费者 /
              创业公司占比较高），可能限制企业 ARR 放量速度。如果病毒式推荐率下降——由竞争对手发布、AI 疲劳或免费层限制驱动——在缺少付费获客渠道补偿的情况下，新用户流入可能放缓。
