      - number: '2.5'
        title: 采用约束与市场风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 渗透 TAM 的最大约束是 PowerPoint 生态锁定。Microsoft PowerPoint 全球约 1.5 billion 用户，并通过 Microsoft 365 和 SharePoint
              深度嵌入企业 IT 栈。Gamma 的卡片式 Web 原生输出格式无法干净导出为标准 16:9 PPTX 尺寸，给必须用 PowerPoint 格式交付最终成品的用户制造兼容性摩擦。第三方 ICP
              分析确认，PowerPoint 不兼容是采购的主要障碍，也是 Gamma 企业潜在客户流失的领先原因。数据安全和合规顾虑限制企业采用。约 38–52% 的企业用户在使用云端
              演示平台时，会担心数据泄露风险和未授权访问。EU GDPR、美国州级隐私法（CCPA）和行业特定监管（医疗的 HIPAA、金融服务的 SOC 2）要求云供应商保持有文档支撑的合规姿态。 Gamma 持有 SOC
              2 Type II 认证，部分回应了这一顾虑；但受监管行业需要额外尽调，会拉长采购周期。企业采购摩擦是任何 PLG 优先公司上探大客户时的内生约束。 Gamma 迄今主要靠自助式和免费增值增长；大型企业交易需要
              IT 安全审查、法务批准和采购签字，周期可延伸至 3–6 个月。按分析师预测，约 25% 计划中的企业 AI 支出因 ROI 不清晰和基础设施瓶颈已推迟到 2027 年。市场碎片化构成定价权上的竞争约束。到
              2026 年，AI 演示市场已有 90+ 个活跃工具提供商，高于 2024 年的 40+。供给激增会压缩价格，并抬高付费获客渠道的 CAC。只有 15% 受访企业在采用 AI 工具后看到实质性 AI
              相关利润提升，说明 AI 演示工具的 ROI 证明案例仍有限，从而压制企业支付溢价的意愿。免费增值模式本身也有结构性风险。「免费增值死亡螺旋」出现在免费用户支持成本超过付费转化收入时；2026 年 AI
              推理和基础设施成本上升，正在提高生成式 AI 工具的单用户运营成本。Gamma 以 600,000 名付费订阅者支撑 70 million 免费用户，对维持转化率有高度依赖。
