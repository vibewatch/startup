            title: 资本效率异类——人均 $2M ARR
            body: >-
              Gamma 以 50–52 名员工、仅 $23M 初始融资做到 $100M ARR，人均贡献约 $2M ARR，是 SaaS 行业 $200K–$500K 人均中位数的 4–10 倍。这种效率来自 PLG
              免费增值飞轮：自然获客几乎不需要付费 CAC，信用点门槛又能高效转化重度用户。公司自 2024 年初以来保持盈利，说明这不是靠补贴堆出来的增长率，也让 Gamma 成为 AI SaaS 里质量最高的收入画像之一。
            calloutType: strength
