  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Gamma 的相关市场横跨三层嵌套品类。最宽的一层是全球演示软件市场——所有用于在商业、教育和个人场景中创建结构化、视觉化文档的工具——2025 年约 $8.23B，预计 2026 年达到
              $8.91–9.65B。这个 TAM 包括 Microsoft PowerPoint 和 Apple Keynote 的本地部署授权、Google Slides 和 Canva 的 SaaS
              订阅、Prezi、Zoho Show，以及长尾小众工具。排除在边界之外的是通用文字处理器（Microsoft Word、Google Docs）、项目管理工具（Asana、Notion
              的列表模式），以及主要输出并非可展示幻灯片或文档产物的数据可视化平台（Tableau、Power BI）。该 TAM 内部，是基于云的协作演示细分市场；到 2026 年，该细分约占部署偏好的
              59–72%，反映远程和混合办公的持续迁移。Gamma 完全在这个云原生子细分中竞争。再往内，是 AI 原生演示生成市场——AI 从提示词生成初始结构、设计和内容，而不是只辅助模板选择。按窄口径，这个 AI
              原生切入点估计为 $0.73B；按更宽商业口径，包含自主演示智能体、API 优先 架构和集成 MCP 的工作流，则为 $4.7B。主要现状替代品是手工 PowerPoint，全球约 1.5 billion
              用户，并通过 Microsoft 365 深度嵌入企业沟通工作流。 Google Slides 是次要替代品，在教育场景占主导。Canva 处在设计驱动的邻近市场，按产品使用指标，在更宽的演示品类拥有约 60%
              份额。Gamma 排除的支出包括以视频为先的演示格式（Loom、Vidyard）和沉浸式 AR/VR 演示工具；这些工具服务不同受众和工作流。
