      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >-
              Gamma 在三轮已披露融资中累计筹集约 $87–91M 新股和老股资金。$7M 种子轮于 2021 年 10 月完成，由 Accel 领投，知名天使包括 Zoom CEO Eric Yuan、前
              LinkedIn CEO Jeff Weiner，以及 Airtable、Patreon、Segment、Honey 的创始人。机构种子轮共同投资方包括 Script Capital、South Park
              Commons、LocalGlobe、Afore Capital 和 Hustle Fund。$12M A 轮于 2024 年 5 月跟进，仍由 Accel 领投，Script Capital、Lorimer
              Ventures、South Park Commons 和 Fellows Fund 参与。头条事件是 2025 年 11 月的 B 轮： Andreessen Horowitz 领投 $68M，估值
              $2.1B，Accel、Uncork Capital、South Park Commons 和 Script Capital 参与。该轮包含 $20M 老股交易，为早期员工提供流动性。a16z 普通合伙人
              Sarah Wang 主导投资，并公开称自己是 Gamma 的重度用户。Gamma 历史上最重要的资本效率信号，是已募新股资金与已实现 ARR 之间的比例：B 轮前，公司以约 $23M 新股资金做到 $100M
              ARR，意味着在任何 B 轮摊薄发生前，投入业务的资本已产生约 4.3x 回报。
