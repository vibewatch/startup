      - number: '6.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 病毒式产品驱动增长以近零 CAC 带来 70M 用户
            body: >-
              Gamma 的病毒式分享模式——演示文稿以公共链接分发并露出 Gamma 品牌——以极低营销支出带来 70M 注册用户。印度的 9.5M
              用户是在没有任何广告预算的情况下获取的，这是价格敏感市场中产品市场契合的强证明。每天 1M 次内容创作事件说明活跃队列存在习惯性参与。
            calloutType: strength
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU003
          - type: callout
            title: Trustpilot 1.6/5 与计费投诉提示客户留存风险
            body: >-
              Gamma 在 Trustpilot 的评分为 1.6/5，来自 88 条评论，其中超过 70% 给出一星；这些评论记录了自动续费意外、惩罚性的 3 天退款窗口、取消请求后仍收费以及客服无响应的模式。虽然
              Trustpilot 偏向计费投诉者，但投诉的数量和一致性构成重大信任风险，可能压制企业采购决策，并加速价格敏感个人订阅者流失。
