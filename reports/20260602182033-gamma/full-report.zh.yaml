      - number: '4.4'
        title: 成本结构与毛利率分析
        blocks:
          - type: paragraph
            body: >-
              Gamma 的成本结构主要由 AI 推理和云基础设施主导，其次是 R&D（工程人力）、客户支持和安全合规开销。公司运行在 Google Cloud Platform 上，AI 推理成本来自第三方模型
              API（可能包括 OpenAI 等）以及 Gamma 自有微调层。毛利率未公开披露；但根据 AI-SaaS 成本画像和 Gamma 的盈利状态，独立估算将其放在 70–85% 区间，与依赖模型
              API、而非自建基础模型基础设施的软件原生 AI SaaS 平台一致。资本开支很低：Gamma 没有硬件、没有制造，也没有实物库存。营运资本动态有利：订阅预付（年度计划）或按月提前计费。
              没有披露债务或项目融资义务。从以个人 / SMB 订阅者为主，转向企业账户（Team 和 Business 层），预计会因更高的客户成功和安全合规成本而略微降低毛利率，但会被更大的平均合同价值抵消。 SOC 2
              Type II 认证和企业安全功能（SSO、高级数据控制）增加了合规成本，但如今已是拿下企业账户的入场券。
            claimRefs:
