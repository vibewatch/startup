        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 面临分层且快速演变的监管和法律风险栈。EU AI Act 于 2024 年 7 月 12 日刊登在《官方公报》，对广泛部署的通用 AI 系统设定义务；Gamma 的 AI
              生成演示平台可以被认为符合通用 AI 系统定义，需承担透明度、文档和事件报告要求。最关键条款的违规罚款最高可达全球年营业额的 7%。截至 2026 年 6 月，Gamma 关于 EU AI Act 通用 AI
              义务的公开合规文档很少，在 Gamma 已披露有意义用户增长的欧盟市场形成执法敞口。GDPR 合规义务适用于 Gamma 的欧洲用户，包括跨境数据传输要求；Gamma
              隐私政策承认存在国际传输，但除标准合同条款外，未详细说明转移机制。AI 版权方面，美国最高法院在 2026 年 3 月拒绝受理 Thaler v. Perlmutter，确认 AI
              生成内容必须有人类作者才能获得版权保护；这缩小了 Gamma 代表用户主张 AI 生成输出版权的能力。2026 年 Bartz v. Anthropic 以 $1.5B 和解，展示了 AI
              训练数据来源带来的生存级责任敞口；虽然 Gamma 的主要敞口在内容生成层而非模型训练层，但其上游 AI
              供应商仍面临多起数十亿美元版权诉讼，可能影响服务连续性和定价。下方监管风险登记表覆盖主要许可、诉讼和执法风险项，并按严重程度排序。
