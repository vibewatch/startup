  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与输出格式
        blocks:
          - type: paragraph
            body: >-
              Gamma 覆盖四类内容输出——演示文稿、互动文档、网页和社交图形——全部由 AI
              生成引擎根据自然语言提示生成。平台的底层设计选择是卡片式、可滚动格式，替代线性幻灯片范式，并支持内嵌视频、实时数据、投票、分支路径等 PowerPoint 或 Keynote 无法实现的元素。截至 2026 年
              3 月，平台全球注册用户接近 1 亿，其中超过 80% 在美国以外，显示出国际优先的增长牵引力。内容库包含 100 多个专业设计、AI
              原生且可重混的模板，能用单条指令适配用户提供的内容，消除传统工具常见的空白页摩擦。2025 年推出的 Gamma Agent 是直接嵌入编辑界面的对话式 AI
              设计伙伴，用户可用自然语言指令重组、压缩或重新设计整套演示文稿。平台支持通过多个图像模型生成 AI
              图片，并在付费套餐中集成品牌工具包，让团队无需专职设计职能也能统一视觉识别。输出可作为带内置浏览分析的实时网页链接分享，也可导出为 PDF 和 PowerPoint；不过评测者持续指出，PowerPoint
              导出会把文本压平成静态图片并丢失互动元素，限制了它在 PPT 优先的企业工作流中的实用性。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE011
              - CE012
              - CE013
      - number: '5.2'
        title: 使用场景与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              Gamma 的核心价值主张，是把想法变成精美视觉输出的时间压到最低。生成流程分三步：用户提供输入（主题、大纲、粘贴笔记或上传文档），AI 先生成结构化大纲供审核，再在 60
              秒内生成带智能版式、图片和排版的完整演示稿。过去需要数小时 PowerPoint 或设计工具工作的任务，现在被显著压缩。平台服务的用户群多元：教育工作者把课程笔记转成教学
              演示稿；创始人制作融资路演；销售团队批量个性化提案；顾问根据会议记录快速原型化客户演示。2026 年 3 月 Gamma Imagine
              扩展把使用场景拓宽到独立视觉资产创作——标志、信息图、图表和社交帖子——在非演示文稿的营销团队工作流上更直接地与 Canva 竞争。G2 评测者称赞其速度和易用性；Trustpilot 评论则持续暴露 AI
              生成质量和免费层缺乏客服的问题，说明在有截止日期压力的专业用户中，质量缺口更关键。卡片式格式并非人人偏好：必须向客户交付可编辑 PowerPoint
              文件的用户，在导出环节会遇到工作流断点；需要像素级设计控制的用户，则更适合 Figma 或 Canva。
            claimRefs:
