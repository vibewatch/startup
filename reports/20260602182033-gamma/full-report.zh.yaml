  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全与平台滥用风险
        blocks:
          - type: paragraph
            body: >-
              Gamma 受信任的域名地位原本是用户信任优势，如今却变成重大安全负债。威胁行为者已把 Gamma 平台武器化，创建仿冒 Microsoft SharePoint 登录门户的高可信钓鱼跳转页，借
              gamma.app 域名的高声誉绕过企业邮件安全过滤器。这些攻击使用攻击者居中（AiTM）框架，可实时收集凭据并窃取会话 cookie，从而绕过多因素认证。Cloudflare Turnstile CAPTCHA
              被插入链路中段，以阻止自动化安全扫描，进一步增加检测难度。由于 gamma.app 相对较新，且常被企业安全团队列入白名单，钓鱼链路获得了异常高的投递率。面对有记录的 Gamma 托管钓鱼活动，企业 IT
              部门可能选择在防火墙层级屏蔽 gamma.app 链接，为 Gamma 最需要增长的企业细分市场设下采用天花板。Gamma 隐私政策管理用户生成内容，包括演示文稿及相关元数据；国际传输按标准合同条款处理，但考虑到
              Gamma 的欧盟用户基础，GDPR 执法风险缺口仍然存在。Gamma
              使用条款限制公司对第三方滥用平台造成损害的赔偿义务，但企业采购团队会在安全审查中仔细审视平台滥用历史。运营安全登记表记录了这些失效模式，并按残余敞口排序。
