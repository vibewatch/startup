      - number: '5.6'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Gamma 已公开的安全姿态以 Google Cloud Platform 托管、零信任访问控制、传输中 TLS 1.2+ 加密、静态 AES-256 加密并定期轮换密钥，以及 OAuth 2.0 可撤销
              token 认证为中心。公司正在积极推进 SOC 2 鉴证，覆盖五项信任服务准则——安全性、可用性、处理完整性、机密性和隐私——但截至报告日期尚未完成认证。Gamma
              的帮助中心将已发布的合规文档分为三类：隐私政策、数据保护实践、DMCA 与版权合规。另据开发者门户文档，MCP 服务器通过 OAuth 和 Dynamic Client Registration 认证 AI
              工具访问，为第三方 AI 集成提供标准化且可审计的访问路径。尚未完成 SOC 2 Type II 认证是重大采购风险：许多企业和受监管行业客户在批准供应商前都要求当前有效的审计报告。Gamma
              的隐私文档也尚未确认面向欧盟用户的 GDPR 特定数据驻留控制，帮助中心关于欧盟上线状态未说明的提示，会给欧洲交易带来疑问。Gamma 状态页公开记录 Website、Web
              Application、API、Multiplayer、Site Hosting 和 AI 组件的服务可用性，提供基本正常运行时间透明度，但缺少 SLA
              承诺。若要进入企业合同，事件透明度还可通过结构化事后复盘以及明确的 RTO/RPO 目标来加强。
            claimRefs:
