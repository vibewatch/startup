      - number: '2.4'
        title: 市场增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              远程和混合办公是演示软件市场最主要的结构性驱动。2020–2024 年，远程办公工具采用率提高 61%，直接抬升了对云原生、协作式演示 平台的需求。到 2026 年，27.5%
              的美国员工至少部分时间远程办公（Bureau of Labor Statistics），继续支撑虚拟会议内容的高需求。该驱动同时利好既有巨头（Microsoft 365 Copilot for
              PowerPoint、Google Workspace Gemini for Slides）和 Gamma 这样的 AI 原生新进入者。知识工作者采用 AI 是第二个主要驱动。 2026 年，85%
              的营销人员使用 AI 创作内容，高于 2023 年的 61%；82% 的企业以某种形式使用 AI 写作工具。演示工具中的 AI 功能采用率增长了 47%。这一趋势与 Gamma 的 ARR 加速直接相关：2023
              年 3 月集成 GPT-3.5 后，每日注册量从数百人变成约 10,000 人，ARR 从 2024 年底的 $30.5M 增长到 2025 年末的 $102M。病毒式免费增值采用是 Gamma
              自有的增长驱动。Gamma 约 70% 的用户增长来自自然推荐；可分享链接模型意味着每个已创建文档都是一个分发渠道。 India 的 9.5 million 用户没有任何营销支出，United
              States、Brazil、Russia 和 Germany 也通过同一机制成为主要市场。教育数字化提供长周期结构性顺风，尤其在 亚太和新兴市场。UNESCO 报告称，疫情期间远程学习推动 72%
              的学校采用数字演示工具，而这一采用被保留下来。Morgan Stanley 的 2026 年 AI 市场分析认为，AI 已经成为「工业化建设」和「GDP 的关键驱动」，目前 21% 的 S&P 500 公司提到
              AI 驱动现金流利润率扩张。 这轮宏观 AI 投资浪潮，为 Gamma 这类 AI 原生生产力工具吸引此前不可得的企业预算创造了有利环境。
