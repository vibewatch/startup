      - number: '1.5'
        title: 风险、批评与竞争威胁
        blocks:
          - type: paragraph
            body: >-
              Gamma 面临 Microsoft PowerPoint 和 Google Slides 带来的商品化风险；两者合计服务约 1.5 billion 用户，并正在买方已经付费的企业生态中集成自己的生成式 AI
              功能（Microsoft Copilot for PowerPoint、Google Gemini for Slides）。在 AI 原生竞争者中，Tome 展示了品类风险：尽管融资 $81M、累计 25
              million 用户， Tome 在只做到 $3.5M ARR 后转出演示文稿赛道，说明只拿到用户并不保证变现。2025 年，网络犯罪分子利用 Gamma 的 gamma.app
              域名和免费网站发布能力托管钓鱼跳转页， 目标是 Microsoft 账户凭证。攻击并非平台安全漏洞，但造成声誉暴露，也凸显任何支持轻松创建公开链接的平台都会内生双重用途风险。Trustpilot
              上的用户评价情绪明显负面，约 1.7/5，常见投诉包括自动续费计费、不响应的客服，以及 PowerPoint 导出不兼容。卡片式 Web 格式无法干净导出为标准 16:9 PPTX 尺寸，限制了必须交付客户级
              演示稿的用户吸引力。2023 年初 Silicon Valley Bank 倒闭期间，Gamma 在切换到 JP Morgan 前几乎错过发薪，提醒投资者：早期公司的运营资金库风险并非为零，也值得单独披露。
            claimRefs:
