      - number: '8.3'
        title: 可比公司估值分析
        blocks:
          - type: paragraph
            body: >-
              2026 年上半年，AI 赋能 SaaS 市场给 Gamma 的估值提供了多个锚点。Figma 2026 年 4 月 IPO 约 $42/share，按完全摊薄口径约 $24B、ARR 约
              $1.1B，给企业留存很强的设计类工作流软件立下了 22× ARR 的公开市场基准（S-1 招股说明书显示 NDR 130%+、毛利率 88-91%）。Canva 以估计 $3.3B ARR 做到 $42B
              老股估值，对应约 12.7×；这个倍数更低，说明 Canva 的收入规模摊薄了增长溢价。Notion 2026 年隐含估值约 $18.5B、估计 ARR 约 $500-600M，对应
              30-37×，溢价显著，来自更深的工作流锁定和企业多产品敞口。放到私募市场同类公司里，saasrise.com 的 AI Software Valuation Report 2026 覆盖 575+
              家私营公司，发现 AI 原生 SaaS 的 VC 倍数中位数为 21.2×，直接说明 Gamma 的 Series B 定价与同类组一致。AI 赋能（非原生）SaaS 的 VC 倍数为 8.5×、M&A 倍数为
              7.0×；传统 SaaS 的 VC 倍数为 5.5×、M&A 倍数为 3.8×。iMerge Advisors 的 Q1 2026 报告把非 AI 公司公开 SaaS 倍数定在 4.0–5.5×
              ARR。结论是：Gamma 当前 21× 既不异常，也不是人为吹高——这是有 $100M ARR 记录的 AI 原生 SaaS
              的市场出清价。风险在于，这个倍数更多借用了品类溢价，而不是靠企业工作流深度挣出来；一旦企业渗透停滞，估值会变脆。
