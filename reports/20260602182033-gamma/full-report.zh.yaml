  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Gamma 运营基于积分的免费增值模型，有效把消费者定价与 B2B SaaS 价值交付连接起来。用户从免费层开始，获得 400 个终身 AI 积分——大约足够生成 8–10 个完整
              演示稿——之后触及硬性付费墙，推动升级决策。这个终身积分上限在 2024 年末引入，取代了更早的按月重置机制，也更严格，形成更强的转化倒逼。个人付费层从 $8–10/month（Plus）到
              $18–25/month（Pro），再到 $100/month（Ultra）；团队层从 $20/seat/month（Team）和 $40/seat/month（Business）起。积分系统按功能计量：一次标准
              10-slide 演示稿生成消耗 40 积分，AI 图像生成视质量消耗 2–40 积分，内容润色每次消耗 5–10 积分。收入来源包括个人计划订阅收入、团队和商业计划的席位收入，以及来自 Pro 及更高层级的早期
              API 访问收入。Gamma 未披露按细分划分的收入构成；但 Sacra 估计，B 轮交割时平台已有超过 600,000 名付费订阅者，大多数在 Plus 或 Pro 个人计划上。进入 2026 年，通过
              Team 和 Business 计划做企业增购是最高优先级增长向量， SOC 2 Type II 合规和 SSO 则解锁更大的合同规模。
