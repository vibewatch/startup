      - number: '4.3'
        title: 单位经济与资本效率
        blocks:
          - type: paragraph
            body: >-
              Gamma 最不寻常的财务特征是资本效率。B 轮交割时，公司约有 52 名全职员工，产生约 $2M ARR/employee，是 SaaS $200K–$500K/employee 中位数的 4–10x，也可与
              Datadog（$895K/employee）等顶级上市 SaaS 公司相比，只是员工基数小得多。CAC 回本周期未披露；不过 Gamma 的 PLG 路径（通过免费增值实现产品驱动增长）
              暗示付费获客支出极低。公司确认，在 B 轮融资时尚未动用 $12M A 轮资金，意味着 A 轮资金留作储备，业务靠订阅收入自我供血。这使 Gamma 的烧钱倍数 实际上为负（或接近零），远低于 SaaS 1.5x
              的中位数。免费到付费转化由终身积分上限和移除水印激励推动，但具体转化率并未公开。Sacra 估计，在 70 million 注册用户中有超过 600,000 名付费订阅者，意味着付费转化率
              0.86–0.9%，低于典型 B2C SaaS（1–5%），但符合服务轻度和专业用户的高流量 PLG 工具。收入质量强：订阅收入按月经常性产生，Team/Business
