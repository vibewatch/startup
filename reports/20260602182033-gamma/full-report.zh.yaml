      - number: '1.4'
        title: 规模、指标与里程碑
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 11 月，Gamma 披露 $100M ARR、70 million 总用户和超过 600,000 名付费订阅者。公司自 2023 年起盈利，并在 2025 年 5 月以约 30 名员工跨过
              $50M ARR 时就已经盈利。Sacra 估计 2025 年 10 月 ARR 约 $102M，2024 年同比增长 365%，基数约 $30.5M。ARR 轨迹急剧加速： 2024 年 12 月达到
              $32.5M，2025 年 5 月达到 $50M，2025 年 11 月达到 $100M——六个月翻倍。用户已在平台上累计创建超过 400 million 个演示文稿、文档和网站， 每天新生成内容超过 1
              million 件。India 是增长最快的市场，拥有 9.5 million 用户，且没有直接营销投入；公司计划在 2026 年建立亚太本地布局。 以约 52 名员工和 $100M ARR 计算，人均收入约
              $1.9M。按 $2.1B 估值和约 $102M ARR 计算，隐含收入倍数约为 21x ARR。2022 年底，Gamma 约有 60,000 名总用户和大约一年现金跑道，之后全面转向 AI，改变了公司轨迹。
