        - 随着员工数扩大跟踪；核心风险是利润率压缩
      - - 毛利率
        - 未披露；基于 AI-SaaS 成本结构估计为 70–85%
        - 低 — 仅为估计；实际取决于模型 API 成本和基础设施
        - 对 LTV/CAC 比率和长期盈利能力影响重大
        - 索取经审计毛利率；拆分 COGS 构成
      - - CAC / CAC 回本周期
        - 未披露；PLG 自然增长模式暗示付费 CAC 很低
        - 低 — 未披露支出；无法计算回本周期
        - 付费销售加入后，这是评估企业销售动作可扩展性的关键
        - 企业销售动作扩张后，按渠道索取 CAC（自然 PLG 与付费销售）
      - - 净收入留存（NRR）
        - 未披露
        - 低 — 无公开数据；团队套餐席位扩张暗示 NRR 为正
