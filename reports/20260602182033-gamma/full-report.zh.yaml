      - number: '8.4'
        title: 情景分析与回报建模
        blocks:
          - type: paragraph
            body: >-
              三种情景勾勒 Gamma 到 2028 年最可能企业化路径下的投资回报区间。乐观情景中，Gamma 靠企业席位扩张在 2028 年做到 $250M ARR，NDR 超过 120%，要么融 Series C，要么
              IPO，退出价值达到 $4.5B–$5.5B。前提是拿出 Figma 级别的企业留存指标，并大规模替代 Microsoft PowerPoint
              的企业使用——可实现，但规模化证据还没有出现。基准情景中，Gamma 到 2028 年达到 $175M ARR，企业牵引中等，NDR 为 105–115%，以 12–16× ARR 退出，退出价值
              $2.1B–$2.8B；相对 $2.1B Series B 成本基础，回报大致持平到小幅上行。基准情景要求 Gamma 在 Microsoft Copilot 完成功能追平前，把偏 SMB
              的客户基础顺利转成企业账户。悲观情景中，竞争替代加速，ARR 增长到 2028 年放慢至 $120M；市场把 AI 内容工具重新按非 AI 原生 SaaS 估值，倍数压缩到 6–9×，对应 $720M–$1.1B
              退出，相对成本基础亏损 50–65%。乐观与悲观的关键分水岭是 NDR 门槛：企业 NDR 高于 120%，高倍数大概率能维持；低于 100%，倍数压缩几乎确定。Daily Moss 等反向分析师指出，2025
              年末 AI 超大轮融资估值很高，如果公司无法在 12–18 个月内证明企业端韧性，下轮降估值风险会显著上升。
