              毛利率、净留存率（NRR）、CAC 回本周期、月度烧钱速度和订阅者流失率均未披露。没有这些指标，除了顶线 ARR 和盈利确认之外，就无法从结构上验证单位经济模型。Gamma 在 Series B
              后扩张员工数，利润率压缩是一个合理风险，但公开数据无法量化。任何投资逻辑都必须以进入数据室为前提，至少拿到按队列拆分的毛利率和 NRR。
