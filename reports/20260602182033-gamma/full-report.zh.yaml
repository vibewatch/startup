      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 缺失 NDR 数据是最大的单一估值风险
            body: >-
              Gamma 尚未按队列公开净美元留存。2026 年所有高 SaaS 倍数——Figma 22×（NDR 130%+）、Notion 30–37×（工作流锁定）、AI 原生 SaaS 中位数
              21.2×——都靠已披露的留存韧性支撑。Gamma 的 21× 目前借的是品类基准，并未被公开队列数据验证。如果企业 NDR 低于 100%，倍数压缩到 8.5×（AI 赋能 SaaS
              中位数）将意味着估值较当前价格下降 60%。因此，TV006 里的 NDR 尽调不是例行事项，而是确认或推翻投资逻辑的数据点。
            calloutType: risk
            claimRefs:
              - CV021
              - CV029
              - CV030
              - CV043
          - type: callout
            title: Gamma 的 21× 倍数符合品类，不异常
            body: >-
              关于 Gamma 估值的常见误解是，21× ARR 意味着定价亢奋。saasrise.com 2026 年对 575+ 家 AI 原生私营公司的分析把 VC 中位数定在 21.2×——也就是说，Gamma 的
              Series B 价格处于同类组的数学中位数，而不是尾部。Figma 2026 年 4 月 IPO 对应
              22×，给出了公开市场验证：只要设计和创意工作流软件能拿出企业留存，就可以维持高倍数。关键区别在于，同类品类验证不能替代公司自身留存数据。当前 AI 市场环境下，Gamma 的 21×
              说得通；如果尽调发现公司企业 NDR 低于 100%，这个倍数就站不住了。
            calloutType: insight
            claimRefs:
              - CV024
              - CV021
              - CV030
          - type: callout
            title: 盈利能力给悲观情景托出了硬底
            body: >-
              不同于多数估值水平相近的 AI 初创公司，Gamma 自 2023 年以来的经营盈利能力给投资托出了底，显著约束悲观情景。现金流为正、ARR 超过 $100M 且债务很少的公司，不面临归零风险。按传统 SaaS
              M&A 的底部倍数（5× ARR），Gamma 的硬下行约为 $500M——相对 $2.1B 成本基础亏损 75%，很严重，但不是灾难性结果。硬底使这笔投资更像成熟 SaaS 业务里的可转股权，而不是押注未经验证
              AI 初创公司的二元赌局。因此，建议以较 Series B 折让 15–20% 投资，本质上是一个风险调整后的机会，并已合理计入倍数压缩尾部风险。
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV045
              - CV009
              - CV034
          - type: callout
            title: 反向分析师警告：AI 超大轮估值在 2026 年带来下轮降估值风险
            body: >-
              Daily Moss（2026）和类似反向评论指出，2025 年末以 20×+ ARR 倍数融资的 AI 公司，如果在超大轮结束后 12–18
              个月内无法证明企业端韧性，就会面临显著下轮降估值风险。其逻辑是结构性的：20×+ 的 VC 倍数需要 AI 板块持续享受高溢价，而前提是市场继续清楚区分 AI 原生和传统 SaaS。如果 Microsoft
              Copilot 与 Google Gemini 成功把 AI 原生功能放进既有平台，抹平两者界线，独立 AI 原生工具的高倍数环境就会坍塌。Gamma 展示企业 NDR 的 2026 年 2 月窗口（Series
              B 后 12 个月）是观察风险的关键期。
            calloutType: risk
            claimRefs:
              - CV036
              - CV014
              - CV035
