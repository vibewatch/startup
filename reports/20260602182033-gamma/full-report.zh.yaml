      - number: '6.2'
        title: 采用轨迹与增长
        blocks:
          - type: paragraph
            body: >-
              Gamma 的用户增长是产品驱动病毒式采用的典型案例。平台于 2022 年以约 60,000 名用户进入公开测试版；2023 年 3 月 AI 重新发布后，增长爆发，在随后九个月新增 10M 用户。到 2025
              年 11 月，Gamma 报告全球注册用户 70M，累计内容创作超过 400M 件，并突破每天 1M 件新内容——这一频率指标可作为习惯性参与度的代理。平台以盈利状态做到 $100M 年经常性收入（ARR），约
              600,000 名付费订阅者对应估计 0.86% 的免费增值转付费率，低于 SaaS 行业通常 2–5% 的基准。这个低于平均水平的转化率，与消费级、低摩擦免费层的结构相符：用户不升级也能获得显著价值。印度 到
              2025 年 4 月已达 9.5M 用户，成为 Gamma 增长最快的市场，完全由自然和病毒式分享驱动，而非付费营销——这是价格敏感新兴市场里强产品市场契合的信号。巴西
              和澳大利亚是第二梯队国际增长市场，亚洲合计约占用户基础的 25%。JPMorgan 的创业银行部门向其创业客户提供 Gamma 折扣，验证了 Gamma 的企业邻近轨迹，也说明成熟金融机构把 Gamma
              视为创业公司工具栈中的可信工具。Harvard Business School 在 2026 年制作了一份 24 页 Gamma 案例研究，进一步确认公司作为市场颠覆者的研究价值。每天高频创作（1M 件 /
              天）暗示存在高度活跃用户基础，但 Gamma 未披露月活、日活或队列级留存数据，无法区分自然黏性和持续获客填补漏桶。
