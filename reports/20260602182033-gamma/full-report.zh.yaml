      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 定义分歧制造估值歧义
            body: >-
              2026 年 AI 演示市场的窄口径（$0.73B）和宽口径（$4.7B）相差六倍，这不是噪音，而是真实的方法论分歧：PowerPoint 和 Canva 中的 AI 辅助排版功能，是否应该算作「AI
              演示工具」。投资者若以 21x ARR 承销 Gamma 的 $2.1B 估值，SAM 框架就很关键：$4.7B 市场意味着约 2% 渗透率（仍有大量增长空间），而 $0.73B 窄口径市场意味着 14%
              渗透率（余量较少）。Gamma 在融资材料中如何叙述 SAM，值得审查。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
          - type: callout
            title: 零 CAC 地域扩张是稀缺资产
            body: >-
              Gamma 的 India 市场——零营销支出触达 9.5 million 用户——证明产品的病毒式链接分享机制，在高增长、移动优先、价格敏感市场中可以作为自维持的分发引擎。对一个达到 Gamma ARR 规模的
              SaaS 公司而言，这种动态结构性稀缺：多数 $100M ARR 的生产力 SaaS 公司都有显著付费获客成本。如果 India 的病毒式路径能在 Brazil（流量占比 9.78%）和 Southeast
              Asia 复现，即便 North America 自然增长成熟，Gamma 也可能维持低 CAC。
            calloutType: strength
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM031
          - type: callout
            title: PowerPoint 锁定是结构性天花板，不只是产品缺口
            body: >-
              Microsoft PowerPoint 的 1.5 billion 用户基数不只是竞争对手，而是企业沟通事实上的输出格式标准。PPTX 导出兼容性是一道采购门槛，Gamma 当前在许多企业交易中还过不去。
              这不是一个产品迭代周期就能解决的技术缺口；不匹配来自架构本身（卡片式响应 Web vs. 幻灯片网格 PPTX）。在 Gamma 达到接近原生 PowerPoint 的 PPTX 导出保真度之前，其企业 SAM
              会受到实质约束；中端市场交易也需要内部拥护者推动，而不是顺滑的自助式采用。
            calloutType: risk
            claimRefs:
              - CM035
              - CM041
          - type: callout
            title: 免费增值成本动态可能在规模扩大时挤压利润率
            body: >-
              Gamma 拥有 70 million 用户，但付费订阅者只有 600,000（总转化率 <1%），因此要为庞大免费用户基数承担 AI 推理和存储成本。2026 年，模型复杂度上升推高 AI 基础设施成本，制造
              SaaS 基准中指出的「免费增值死亡螺旋」风险——免费用户支持成本超过付费转化收入。Gamma 自 2023 年起盈利，说明当前单位经济可行； 但当免费用户基数增长到 100M+
              时，盈利能力能否持续，需要审查边际单活跃用户成本趋势。
            calloutType: risk
            claimRefs:
              - CM042
              - CM043
              - CM044
              - CM045
          - type: callout
            title: AI 采用浪潮提供多年市场顺风
            body: >-
              营销人员 AI 工具采用率仅三年（2023–2026）就从 61% 跳到 85%，这是生产力软件史上记录最清楚、速度最快的一条采用曲线。这个结构性迁移意味着，Gamma 所处市场不是一个固定 TAM
              被更多竞争者瓜分；随着更多专业人士接受 AI 生成内容，TAM 本身在扩张。Gamma 的问题是：在既有巨头（Copilot for PowerPoint、Gemini for
              Slides）补齐功能差距之前，其病毒式、免费增值驱动模型能否把这个扩张市场中的足够份额转成付费。
            calloutType: insight
            claimRefs:
