      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 规模化后的极致资本效率
            body: >-
              Gamma 用约 $23M 新股资金做到 $100M ARR，相比典型 SaaS 基准，每 1 美元 ARR 所需资本不到四分之一。公司自 2023 年起盈利，意味着 B 轮不是生存所需；
              它是在强势位置上融资以加速。以约 52 名员工计算，人均收入约 $1.9M，处在生产力软件品类最高水平。这种资本效率，是任何分析 Gamma 单位经济和长期回报潜力时的核心尽调信号。
            calloutType: strength
            claimRefs:
              - CO015
              - CO017
              - CO019
              - CO023
          - type: callout
            title: 钓鱼滥用与双重用途平台风险
            body: >-
              2025 年，网络犯罪分子借助 Gamma 的 gamma.app 域名和免费网站发布功能托管钓鱼页面，目标是 Microsoft 账户凭证。攻击利用了 Gamma 的品牌可信度——把 gamma.app
              加入白名单、用于合法演示文稿的组织，会无意中信任这些钓鱼页面。事件不是 Gamma 基础设施的数据泄露，但暴露了一个结构性双重用途风险：任何能轻松创建公开链接、却没有滥用检测护栏的平台都面临这种风险。
              企业评估者因此需要审查 Gamma 的内容政策执行机制。
            calloutType: risk
            claimRefs:
              - CO032
          - type: callout
            title: 2023 年 3 月的 AI 拐点是创始级证明点
            body: >-
              Gamma 的整个增长故事都追溯到一个产品决定：2023 年 3 月集成 GPT-3.5，用于 AI 演示文稿生成。集成前，Gamma 约有 60,000 名用户，剩余现金跑道约一年。
              集成后，每日注册量从数百人跃升至约 10,000 人。九个月内，公司新增 10 million 用户。这个前后对照是异常干净的产品市场契合证据，也把 Gamma 与更晚采用 AI、转化更低的 AI
              幻灯片竞争者区分开来。2023 年拐点，是本报告后续所有 ARR 和用户预测的分析锚点。
            calloutType: insight
            claimRefs:
