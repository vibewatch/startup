        title: 能力、定价与包装对比
        blocks:
          - type: paragraph
            body: >-
              Gamma 拥有一套可信的快速创作功能：有限免费提示词生成、从 PDF/PPTX 导入、导出为 PDF/PPTX/PNG/Google Slides、付费移除品牌、高级模型、API
              访问和团队包装。弱点不是没有功能，而是这些功能所处的竞争语境。Beautiful.ai 以品牌一致的团队能力和安全姿态竞争；Canva 通过宽创意套件和 Magic Design 竞争； Microsoft 和
              Google 把 AI 嵌进客户已经购买的套件；Plus AI 和 SlidesAI 让用户留在 Slides 或 PowerPoint 工作流里。定价对比因此有两面。Gamma
              的免费层和创作者价位升级有利于获客，但套件竞争者可以让演示 AI 看起来像增量或打包功能，工作流插件也能降低迁移摩擦。实际含义是，在采购把 Gamma 与一个打包在内的既有产品科目比较之前， Gamma
