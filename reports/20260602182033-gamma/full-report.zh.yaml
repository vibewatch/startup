        title: 财务风险与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              几项重大财务风险需要重点尽调。第一，Gamma 平台被用于钓鱼攻击，带来声誉和责任敞口：威胁行为者已利用受信任的 gamma.app 域名托管钓鱼跳转页，仿冒 Microsoft SharePoint
              登录页；安全研究人员指出，平台本身的合法性让攻击者能绕过标准邮件安全过滤器。如果 Gamma 被迫收紧内容审核，或其域名进入黑名单，支撑自然获客的病毒式分享闭环可能被打断。第二，Microsoft
              Copilot、Google Duet AI 以及 Canva 免费层 AI 功能带来的竞争压力，可能把 Gamma
              核心的「从文本生成幻灯片」功能商品化，压低定价权，并加速轻度用户流失。第三，严谨承销所需的核心财务指标——毛利率、净留存率（NRR）、CAC
              回本周期、月度烧钱速度、精确订阅者队列数据——均为私有且未披露。没有这些指标，就无法验证业务是否高效扩张，也无法判断盈利声明在员工数快速扩张后是否可持续。公司员工数看起来正在快速增长（截至 2026
              年初，估计范围为 52 至 318 人），扩张阶段可能挤压利润率。
