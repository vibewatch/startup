  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买方任务
        blocks:
          - type: paragraph
            body: >-
              Gamma 的竞争集合比「AI 演示文稿生成器」这个短语更宽。直接同业包括 Beautiful.ai、Presentations.AI、Plus AI、SlidesAI 和其他提示词转演示稿 产品；既有巨头是
              Microsoft PowerPoint 和 Google Slides；邻近设计组包括 Canva、Figma Slides 和 Adobe Express；替代组包括 Prezi 的空间化格式、Pitch
              的协作工作空间，以及内部模板 / 制作工作流。Gamma 最强的切入点是快速生成初稿和 Web
              原生分享，但多数买方仍会按熟悉的文件、套件和品牌治理约束来评估输出。这意味着品类竞争边界由买方任务定义——把一个想法转化为有说服力的视觉产物——而不是由工具分类定义。
              因此，相关尽调视角应是买方工作流契合度：个人创作者奖励速度，团队奖励品牌纪律，企业奖励治理，嵌入式套件用户奖励与 IT
              已采购工具的连续性。这个框架也能把当前替代方案与历史案例分开，避免过度加权已经不再服务演示文稿 任务的产品。Tome 退出活跃演示文稿竞争，提醒投资者：品类热度不等于持久变现。
