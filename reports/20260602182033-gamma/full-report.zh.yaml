      - number: '6.4'
        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >-
              Gamma 未公开披露净收入留存率（NRR）、总收入留存率（GRR）或明确流失率，形成重大尽调缺口。没有这些指标时，可用信号只剩五个渠道的评测平台评分、计费投诉模式，以及每天 1M
              次内容创作这一隐含参与度代理。评测平台评分显示客户基础分化：G2（23 条评论评分 4.1/5）和 FeaturedCustomers（422 个参考点评分 4.8/5）上的商业和专业用户，对速度、AI
              质量和模板多样性满意度高；Trustpilot（88 条评论评分 1.6/5）则偏向计费不满用户，暴露出自动续费意外、严格的 3 天退款窗口、取消请求后仍收费以及客服无响应等投诉模式。ChatSlide 面向
              Gamma 用户的取消指南记录，Gamma 要求用户经过多个步骤才能取消，且不提供暂停选项，强化了「靠摩擦留存」而非「靠满意度留存」的动态。Plisio 2026 年独立评测给 Gamma 在
              Trustpilot 上约 2.0/5、Microsoft Store 上 4.3/5 的评分，说明 Trustpilot 人群偏向计费投诉者，而非活跃产品用户。Knoji 汇总 31 条评论，截至 2026 年
              6 月综合评分为 3.9/5。高频日创作指标（1M 件 / 天）作为黏性代理是正面信号，但不能替代队列留存数据。Capterra Canada 上一位学生用户的评论（2024 年 11 月）和 Capterra
              US 评论（4 条评论评分 3.8/5）均显示，在计费不成为因素时，Gamma 对个人和教育用户主要是正向体验。SMB 导向工具的 SaaS 行业基准显示，年总留存率通常为 80–90%；没有 Gamma
              自身数据，就无法评估其是否达到、超过或低于这一底线。
