  productSummary: >-
    Gamma 销售一套 AI 原生视觉内容创作平台，覆盖演示文稿、文档和网页。用户用自然语言描述需求，平台几秒内生成专业、响应式的卡片式输出。 核心模块包括 AI 演示稿构建器、Gamma
    Agent（可浏览、润色并以对话方式重塑演示稿风格的 AI 助手）、Gamma Imagine（面向营销素材的 AI 图像生成），以及把 Gamma 连接到 Zapier、Make.com 和下游自动化工作流的公开 API。产品与
    PowerPoint 和 Google Slides 竞争， 同时服务这些工具原本并不擅长的非线性、链接分享场景。
  customerFocus: 全球 SMB 和中端市场的营销人员、创业者、教育工作者和知识工作者；正借助 SOC 2 Type II、SSO 和团队层级席位授权进入企业采购。
  businessModel: >-
    基于积分的免费增值订阅：免费层提供 400 个终身 AI 积分（约 8–10 次演示稿生成），耗尽后硬性付费墙推动升级决策。个人付费层从 $8–10/month（Plus）、$18–25/month（Pro）到
    $100/month（Ultra）。Team 和 Business 层为 $20–$40/seat/month。收入来源包括个人订阅、 基于席位的企业合同，以及 Pro+ 层级刚起步的 API 访问收入。
