          - type: callout
            title: 平台被用于钓鱼——声誉与域名信任风险
            body: >-
              网络安全研究人员已记录 Gamma 平台被武器化用于钓鱼攻击：威胁行为者在 gamma.app 域名上托管 Microsoft SharePoint 凭据收集页面，利用平台受信任的域名和合法 HTTPS
              绕过邮件安全过滤器。如果企业安全厂商将 gamma.app 列入域名黑名单，支撑 Gamma 自然获客引擎的病毒式分享闭环会被打断，并迫使公司投入高成本修复品牌信任。任何公共 AI
              内容托管平台都有这类结构性风险，但 Gamma 宽松的内容创建工具让它对攻击者尤其有吸引力。
