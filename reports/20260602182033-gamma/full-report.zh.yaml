    summary: 有向图追踪 Gamma 估值输入——AI 原生同业倍数、公开市场锚点和基础尽调缺口——如何推导出有条件投资建议及其主要条件和风险。
    data:
      nodes:
        - id: ai-native-median
          label: AI 原生 SaaS VC 中位数：21.2× ARR（575+ 家公司）
        - id: figma-anchor
          label: Figma IPO 锚点：基于 $1.1B ARR 的 ~22× ARR（2026 年 4 月）
        - id: gamma-current
          label: Gamma B 轮：$2.1B / ~21× ARR（2025 年 11 月）
        - id: ndx-threshold
          label: 企业 NDR >120% = 溢价倍数有支撑
        - id: fair-value
          label: 公允价值区间：$1.6B–$2.4B（可比公司分析）
        - id: invest-condition
          label: 有条件投资：投前估值 ≤$1.75B + NDR 已确认
        - id: bear-risk
          label: 悲观风险：竞争性替代 → 8.5× 重新定价
        - id: profitability-floor
          label: 盈利能力底部：~5× ARR ≈ $500M 硬底
      edges:
        - from: ai-native-median
          to: gamma-current
          label: 支撑当前定价
        - from: figma-anchor
          to: gamma-current
          label: 公开市场基准
        - from: gamma-current
          to: fair-value
          label: 可比公司分析输出
        - from: ndx-threshold
          to: invest-condition
          label: 条件性要求
        - from: fair-value
          to: invest-condition
          label: 入场折价 15-20%
        - from: bear-risk
          to: fair-value
          label: 下行情景
        - from: profitability-floor
          to: bear-risk
          label: 限制灾难性亏损
    approximationNotes: 边关系是逻辑因果链，未加权。公允价值区间由分析师基于可比公司分析推导，并非 DCF 输出。NDR 门槛参考基准得出，不是 Gamma 披露的具体数据。
    claimRefs:
      - CV024
      - CV030
      - CV039
      - CV040
      - CV042
      - CV043
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 将不同 ARR 倍数套用到 $100M ARR 后得到 Gamma 隐含估值，从传统 SaaS 并购底部（5×）到顶级 AI 原生 VC 溢价（22–30×）；展示倍数重新定价带来的压缩风险。
    data:
      items:
        - label: 5× ARR – 传统 SaaS 并购底部
          value: 500
        - label: 8.5× ARR – AI 赋能 SaaS VC 中位数
          value: 850
        - label: 11.5× ARR – AI 原生 SaaS 并购中位数
          value: 1150
        - label: 12.7× ARR – Canva 老股交易可比项
          value: 1270
        - label: 18× ARR – 基准情景退出倍数
          value: 1800
        - label: 21× ARR – 当前 B 轮倍数
          value: 2100
        - label: 22× ARR – Figma IPO 基准
          value: 2200
        - label: 30× ARR – Notion 老股交易可比项
          value: 3000
    approximationNotes: >-
      数值单位为百万美元。所有倍数均套用于 $100M ARR。ARR 数字为公司口径；Sacra 估计为 $102M。倍数基准截至 2026 年 Q1-Q2，来源于
      imergeadvisors.com、saasrise.com、acquiry.com、sec.gov、techstackipo.com 和 techfundingnews.com。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Gamma 2028 年乐观、基准和悲观情景退出估值区间，与 2025 年 11 月 B 轮的 $2.1B 成本基准对比，展示上行 / 下行不对称回报结构。
    data:
      items:
        - label: 悲观情景退出估值（2028）
          low: 720
          high: 1100
          note: 按 $120M ARR、6–9× ARR 计算，为 $720M–$1.1B；较成本基准 -50% 至 -65%
        - label: B 轮成本基准（参考）
          low: 2100
          high: 2100
          note: $2.1B 投后估值；2025 年 11 月 B 轮；按成本基准为 1.0× 回报
        - label: 基准情景退出估值（2028）
          low: 2100
          high: 2800
          note: 按 $175M ARR、12–16× ARR 计算，为 $2.1B–$2.8B；较成本基准 0× 至 +0.3×
        - label: 乐观情景退出估值（2028）
          low: 4500
          high: 5500
          note: 按 $250M ARR、18–22× ARR 计算，为 $4.5B–$5.5B；较成本基准 +2.1× 至 +2.6×
    approximationNotes: 数值单位为百万美元。回报倍数按 $2.1B B 轮成本基准计算。ARR 预测为分析师估计；退出倍数按 AI 原生 SaaS 同业基准校准。所有情景的时间假设均为 2028 年。实际结果将取决于企业 NDR、市场环境和竞争动态。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 十二个核心估值和投资 KPI，综合 Gamma 的 B 轮定价、可比基准和情景回报。
    data:
      items:
        - label: B 轮投后估值
          value: $2.1B
          detail: 2025 年 11 月；Andreessen Horowitz 领投。公司确认。
          tone: neutral
        - label: B 轮隐含 ARR 倍数
          value: ~21×
          detail: 基于公司披露的 $100M+ ARR；Sacra 估计 ARR 为 $102M。
          tone: neutral
        - label: AI 原生 SaaS VC 中位倍数（2026 年 Q1）
          value: 21.2×
          detail: saasrise.com 对 575+ 家私营 AI 原生 SaaS 公司的分析。
          tone: positive
        - label: Figma IPO 倍数（2026 年 4 月）
          value: ~22× ARR
          detail: 完全摊薄估值 ~$24B / ARR ~$1.1B；NDR 130%+；毛利率 88-91%。
          tone: positive
        - label: 可比公允价值区间
          value: $1.6B–$2.4B
          detail: 分析师基于可比公司分析的估计；并非 DCF。
          tone: neutral
        - label: 建议入场价格
          value: ≤$1.75B pre-money
          detail: 较 B 轮折价 15–20%，以 NDR 确认为条件。
          tone: neutral
        - label: 基准情景退出（2028）
          value: $2.1B–$2.8B
          detail: 基于 $175M ARR 的 12–16× ARR；按成本基准为 0× 至 +0.3×。
          tone: neutral
        - label: 乐观情景退出（2028）
          value: $4.5B–$5.5B
          detail: 基于 $250M ARR 的 18–22× ARR；按成本基准为 +2.1× 至 +2.6×。需要 NDR >120%。
          tone: positive
        - label: 悲观情景退出（2028）
          value: $720M–$1.1B
          detail: 基于 $120M ARR 的 6–9× ARR；按成本基准为 -50% 至 -65%。存在倍数压缩风险。
          tone: negative
        - label: 盈利能力底部
          value: ~$500M
          detail: 自 2023 年以来盈利运营；~5× ARR 的硬底限制灾难性亏损。
          tone: positive
        - label: 净新增分析师来源
          value: '14'
          detail: 本章抓取 14 个净新增 URL，来自 11 个新域名。
          tone: neutral
        - label: AI VC 融资份额（2025）
          value: 61% / $258B
          detail: 2025 年，AI 占全球 VC 的 61%（whitepage.studio 引用 PitchBook/OECD）。
          tone: positive
    approximationNotes: 可比公允价值区间、入场价格建议和退出情景均为分析师基于公开数据的估计；不是投资建议。ARR 倍数为推导值，不是公司披露指标。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV021
      - CV024
      - CV031
      - CV032
      - CV033
      - CV039
      - CV040
