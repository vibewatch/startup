summary:
  headline: >-
    Gamma is the most capital-efficient path to $100M ARR in AI SaaS and warrants a conditional buy
    at a 15–20% discount to the Series B price, subject to private diligence confirming net dollar
    retention, gross margin, and enterprise revenue durability.
