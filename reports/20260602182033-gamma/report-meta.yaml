  foundingLocation: San Francisco, CA, USA
  headquarters: San Francisco, CA, USA
  productSummary: >-
    Gamma sells an AI-native visual-content creation platform spanning presentations, documents, and
    webpages. Users describe what they need in natural language and the platform generates
    professional, responsive card-based output in seconds. Core modules include the AI deck builder,
    Gamma Agent (conversational AI that browses, refines, and restylesdecks), Gamma Imagine
    (AI image generation for marketing assets), and a public API connecting Gamma to Zapier, Make.com,
    and downstream automation workflows. The product competes with PowerPoint and Google Slides while
    addressing the non-linear, link-sharing use cases those tools were not designed for.
  customerFocus: >-
    SMB and mid-market marketers, startup founders, educators, and knowledge workers globally;
    expanding into enterprise procurement via SOC 2 Type II, SSO, and team-tier seat licensing.
  businessModel: >-
    Freemium credit-based subscription: free tier provides 400 lifetime AI credits (≈8–10 deck
    generations) before a hard paywall forces upgrade decisions. Paid individual tiers range from
    $8–10/month (Plus) to $18–25/month (Pro) to $100/month (Ultra). Team and Business tiers run
    $20–$40/seat/month. Revenue streams include individual subscriptions, seat-based enterprise
    contracts, and nascent API-access revenue at Pro+ tiers.
  stage: Series B
  fundingStatus: >-
    $68M Series B (November 2025) led by Andreessen Horowitz at $2.1B post-money valuation;
    includes $20M secondary providing employee liquidity. Prior rounds: $7M seed (October 2021,
    Accel-led) and $12M Series A (May 2024, Accel-led). Total capital raised approximately $90M.
