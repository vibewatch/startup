callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      Reported financing proceeds cannot be treated as current cash. The retained evidence
      does not disclose post-round spending, unrestricted cash, debt availability, burn, or
      runway as of October 20, 2026.
    claimRefs: [CI010, CI011, CI016]
