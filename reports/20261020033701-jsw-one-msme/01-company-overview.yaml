company:
  name: JSW One MSME
chapter:
  number: 1
  title: Company Overview
  summary: >-
    JSW One MSME is a Mumbai-based, JSW Group-controlled industrial-commerce
    platform that combines materials procurement with logistics and credit.
    Public sources show substantial funding and scale, but conflicting valuation
    and workforce snapshots, a weakening legal-entity net-worth indicator, and
    missing audited consolidated metrics keep the current picture incomplete.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      The investable perimeter is broader than the consumer-facing JSW One MSME
      name. Tofler identifies JSW One Platforms Limited as an active, unlisted
      public company incorporated in Mumbai in 2018, while Tracxn and the
      company-controlled LinkedIn page date the operating platform to 2020.
      Company-issued pages position JSW One MSME as a digital marketplace for
      steel and construction materials used by manufacturing and construction
      MSMEs. The proposition extends beyond product discovery: JSW Group says
      the workflow includes financing, order tracking, and financial
      reconciliation. This integrated model makes legal-entity scope important
      because commerce, distribution, and finance activities may sit in
      different group entities.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: financing-and-scale
    title: Financing, valuation, and scale
    body: >-
      Tracxn reports $91.6 million raised across three rounds, including a $25
      million Series A led by Mitsui in March 2023. Moneycontrol/PTI and
      MarcaMoney, both relying substantially on company disclosures, report a
      May 2025 INR 340 crore financing and a $1 billion valuation. Tracxn then
      records an October 2025 $26.5 million Series B at a $925 million
      post-money valuation. These are dated financing snapshots, not current
      cash availability, and the later figure conflicts with the earlier
      unicorn headline. Workforce evidence is also scope-sensitive: Tracxn
      reports 878 employees at August 2025, while LinkedIn displays 934
      associated profiles and a 501-1,000 size band.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011]
    figureRefs: [FO001]
  - id: leadership-governance-and-stakeholders
    title: Leadership, governance, and stakeholders
    body: >-
      Moneycontrol/PTI identified Parth Jindal as chairman and Gaurav Sachdeva
      as joint managing director and chief executive in May 2025. Tracxn and
      Tofler align on a six-person board, with Tofler identifying Sachdeva as
      the whole-time director. Tracxn's cap-table summary assigns 78.76% to
      parent entities, implying concentrated sponsor influence, but the
      retained public evidence does not disclose current voting rights,
      investor protections, or board nomination arrangements. The named
      investor set spans the JSW sponsor group, Mitsui, Principal Asset
      Management, OneUp, SBI, and International Conveyors. Founder attribution,
      leadership succession, and material leadership changes remain
      insufficiently documented.
    claimRefs: [CO012, CO013, CO014]
    tableRefs: [TO002, TO003]
  - id: diligence-read-through
    title: Diligence read-through
    body: >-
      The strongest caution in the assigned evidence is financial rather than
      incident-based. Tofler reports FY2025 operating revenue only as an INR
      100-500 crore range for JSW One Platforms Limited and says book net worth
      decreased 47.56%. That legal-entity range cannot be treated as platform
      revenue, ARR, cash burn, or cash available. The retained adverse search
      returned company-controlled pages rather than independent legal or
      regulatory records, so it does not establish the absence of lawsuits,
      enforcement, outages, or customer disputes. Investment diligence should
      therefore reconcile the entity perimeter, obtain audited consolidated
      accounts and credit-cohort data, verify the current cap table and
      financing terms, and establish active-customer and concentration metrics.
    claimRefs: [CO009, CO014, CO015]
