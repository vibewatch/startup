callouts:
  - calloutType: risk
    title: Valuation and entity scope require reconciliation
    body: >-
      A May 2025 $1 billion valuation headline is followed by Tracxn's October
      2025 $925 million post-money figure, while the only retained FY2025
      revenue disclosure is a broad range for one legal entity. The current cap
      table, security terms, consolidated financials, and entity-level transfer
      pricing are necessary before treating any multiple as decision-grade.
    claimRefs: [CO008, CO009, CO014, CO015]
