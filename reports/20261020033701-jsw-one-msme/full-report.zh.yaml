      - number: '3.3'
        title: 公开套餐证据过薄，无法证明锁定
        blocks:
          - type: paragraph
            body: >-
              保留证据没有披露可比交易价格。JSW One MSME 宣传可以获得信贷，但公开页面没有提供标准化价目表、利率、最低订单、运费规则或实际折扣。Amazon Business
              披露工作流功能，并报告符合条件的企业可享受 30 天免息 Pay
              Later、最长十二个月的还款计划，但这不能证明钢材或水泥业务存在可比经济性。潜在转换成本主要是运营性的，而非合同性的：保存的地址、对账记录、信贷审批、谈妥的供应和交付习惯可能形成摩擦，但买方仍可把订单拆分到多个市场和本地分销商。要判断是否存在持久锁定，必须先取得合同数据和客户队列。
            claimRefs:
              - CP002
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP010
              - CP013
              - CP016
      - number: '3.4'
        title: 分销深度可能持久，市场经济性仍可争夺
        blocks:
          - type: paragraph
            body: >-
              最有力的防御性逻辑，是母集团材料获取能力、专业目录、履约基础设施、信贷和自有品牌的组合。最大的挑战在于每个组成部分都有可信替代方案。Amazon Business 报告称其在印度支持超过 1.6 million
              个卖家，并计划加快配送、扩大目录和采用 AI 辅助定价。Udaan 在 2025 年又融资 $114 million，同时削减固定成本和 EBITDA
              现金消耗，说明综合平台可以继续投入，但规模并不会消除经济压力。Tracxn 报告了资金充足的专业同业，包括 Infra.Market 和 OfBusiness。如果 JSW One
              的供应、信贷和履约能带来可量化更好的买方结果，它可以守住聚焦定位；在缺乏这些基准之前，护城河仍只是合理推断，尚未得到证明。
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 护城河来自运营，而非纯数字化
            body: 公开证据支持专业材料、集团关联供应、信贷、履约和自有品牌的差异化组合。要证明其能持久，必须证明这套组合相较买方同时使用多个平台和分销商，确实改善了价格、可得性、交付和信贷结果。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP015
