      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              2025 年 5 月融资带来 INR 340 crore，管理层将供应链、分销、物流、金融科技、NBFC、技术和自有品牌扩张列为资金用途。随后 Tracxn 报告总融资 USD 91.6 million、2025
              年 10 月 6 日一轮 USD 26.5 million 融资，以及 USD 925 million
              估值。这些是融资和估值事实，不是当前流动性的证据：截至报告日，保留来源没有披露不受限制现金、月度现金消耗、已承诺授信额度、债务契约或资金续航。财务模式看起来合理且已具规模，但在估值能够被纳入投资判断前，收入质量、利润转化、营运资金占用和信用损失仍是重大尽调阻碍。
