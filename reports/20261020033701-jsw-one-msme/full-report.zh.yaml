  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 在取得经审计的经济数据和当前融资条款前，不要将投资纳入投资判断。
      - - 信心与风险
        - 中等信心 / 高风险
        - 证据支持其规模和融资背景，但不足以支持风险调整后回报判断。
      - - 估值立场
        - 偏高，尚未验证
        - 将报道中的 ₹8,575 crore 和 $902M–$925M 观察值作为参考点，而非公允价值。
      - - 入场与退出纪律
        - 取决于条款
        - 在设定目标回报前，要求有下行保护，以及可信的 IPO 或战略流动性路径。
    notes: 评估采用了日期和收入定义不同的公开融资报道及第三方数据库；这些结果不是要约价格或投资建议。
    claimRefs:
