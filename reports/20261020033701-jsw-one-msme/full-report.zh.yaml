            body: >-
              现有缓释措施方向上合理，但大多来自公司自述：专门的 NBFC、承保投入、催收能力、合作伙伴规则、供应商核验、测试证书、订单跟踪和履约中心。投资逻辑不能把这些描述当作控制有效性的证明。应要求月度 vintage
              曲线、30/60/90
              天逾期及核销数据、贷款方和供应商集中度、按时足量交付、退货及质量纠纷、库存天数、现金转换、安全测试和监管往来。论点失效触发器应包括持续的信用损失超过风险调整后利润率、反复出现契约或流动性压力、失去重要许可证或贷款方、严重质量或交付失败反复发生、重大数据事件，或在没有经审计盈利和控制证据的情况下推进
              IPO 时间表。在管理层提供这些记录前，融资和上市里程碑应被视为资本获取信号，而不是持久经济性的证明。
