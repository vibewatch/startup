      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              核心经济买方是负责材料供应和营运资金的 MSME
              企业主或采购负责人。实际用户包括采购人员，以及跟踪订单的工地或工厂团队；付款方仍是企业本身，而当结账环节嵌入信贷后，财务审批人就会成为关键角色。因此，采用路径从具体材料需求及价格或库存查询开始，经过对交付和对账的信任，之后可能扩展到采购挂钩融资。管理层
              2025 年的资本配置表述强调钢材和水泥供应链深度、全国分销与物流，以及金融科技和 NBFC 业务。这与捆绑式采购主张一致，但公开证据没有披露分层转化率、复购、钱包份额或信贷审批率。
            claimRefs:
              - CM001
              - CM008
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              政策方向确实构成需求顺风：2026-27 Union Budget 将制造业扩张、“Champion MSMEs”和基础设施列为增长重点，提出 ₹12.2 lakh crore 公共资本开支，并称 TReDS
              已向 MSME 提供超过 ₹7 lakh crore 的资金。这些金额都不是 JSW One 的收入或可服务市场支出，但会支持买方群体的活动和流动性。真正的瓶颈仍在执行。Value For Startups
              报告称年长承包商采用应用存在摩擦；Tracxn 列出 213 家活跃竞争者，其中包括获得融资的专业平台和综合 B2B 电商平台。因此，估值逻辑与其依赖泛泛的宏观
              TAM，不如依赖已验证的活跃买家、采购频率、品类利润率、物流可靠性和信用损失。这些运营指标在保留的市场证据中都不可得。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场规模尚不足以支持估值
            body: >-
              保留的 $100B-plus TAM、$25B SAM 和 $5B SOM
              来自一个信誉较低的分析师页面，且没有披露推导桥接。投资判断应采用按交易统计的买家数、年度材料支出、平台可服务品类、地理范围、抽成率和已验证份额。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 拥挤市场中存在多种同职能方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比数字化建材市场更宽。Tracxn 将 JSW One MSME 列入 213 家活跃竞争者，并把 Infra.Market、NowPurchase 和 ArisInfra
              认定为主要同业；其排名还包括 OfBusiness、Power2SME、ZippMat 和 Metalbook。Amazon Business 是相邻的横向采购平台，而 Udaan 展示了规模化 B2B
              市场如何把品类广度、自有品牌、信贷和物流结合起来。线下分销商、直接对接钢厂、采购代理和企业内部采购团队仍是替代方案，因为买方可以分别组织供应、信贷和对账。这个市场并非赢家通吃：买方可以按品类、地域、信贷可得性和交付紧迫度同时使用多个平台。
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP012
              - CP016
