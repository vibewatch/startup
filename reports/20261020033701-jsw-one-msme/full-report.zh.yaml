      - number: '4.3'
        title: 单位经济与资本强度
        blocks:
          - type: paragraph
            body: >-
              虽然具体数值不可得，但模式中最重要的经济驱动因素已经清晰可见。材料采购和自有品牌业务意味着采购价、库存及质量风险；分销和履约需要网络能力与物流支出；嵌入式信贷带来贷款方经济性和信用风险依赖；可见的员工规模则指向不低的运营成本基础。Tofler
              报告 FY2025 账面净资产下降 47.56%，这是现有证据中最明确的不利财务信号，但公开页面没有给出底层利润、借款、营运资金和现金数字。因此，投资判断需要法律实体桥接表，以及经审计的贡献利润和信贷队列数据。
            claimRefs:
              - CI008
              - CI009
