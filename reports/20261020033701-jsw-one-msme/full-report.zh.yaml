        title: 融资、估值与规模
        blocks:
          - type: paragraph
            body: >-
              Tracxn 报告三轮融资合计 $91.6 million，其中包括 2023 年 3 月由 Mitsui 领投的 $25 million A 轮。Moneycontrol/PTI 和 MarcaMoney
              主要依赖公司披露，报道称 2025 年 5 月融资 INR 340 crore、估值 $1 billion。随后，Tracxn 记录了 2025 年 10 月 $26.5 million 的 B
              轮融资，投后估值为 $925 million。这些只是带日期的融资快照，不代表当前可用现金；后一个数字也与此前的独角兽估值新闻冲突。员工数据同样受范围影响：Tracxn 报告截至 2025 年 8 月有 878
              名员工，而 LinkedIn 显示 934 个关联档案及 501-1,000 人规模区间。
