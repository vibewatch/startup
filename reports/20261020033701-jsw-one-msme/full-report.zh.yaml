              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 决策闸门
            body: 只推进数据室尽调；在经审计经济数据、股权结构表条款和信贷队列能够解释相互冲突的公开倍数之前，不要接受据报道的估值。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
