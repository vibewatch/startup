  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入质量
        blocks:
          - type: paragraph
            body: >-
              JSW One
              展示的是商业、信贷和履约一体化模式，而非纯软件订阅。一个独立的公司数据画像描述了直接产品差价和市场佣金，另有自有品牌产品以及增值融资或物流作为变现路径。这种组合可能带来复购和交叉销售，但每条收入流的质量不同：贸易差价暴露于材料价格和营运资金，佣金收入取决于第三方交易量，自有品牌可以提高毛利率，却会增加库存和质量风险，而融资经济性取决于贷款方条款及损失。据报道超过
              70% 的复购业务指标虽令人鼓舞，但不是客户队列留存指标，也没有独立审计的分母。
            claimRefs:
