            body: >-
              公开收入指标方向上偏正面，但无法直接对账。Tracxn 报告截至 2026 年 3 月 31 日年收入超过 INR 1,000 crore；Tofler 的 FY2025 页面则同时显示 INR 100-500
              crore 的营业收入区间，以及 JSW One Platforms Limited 的 INR 100-150 crore
              收入区间。期间、法律实体边界和方法论都不同，因此不能把这些数字当作一条干净的增长序列。LinkedIn 的公司规模区间和员工关联数说明运营组织已有一定体量，但员工数只能作为成本基础的代理指标。没有保留来源提供
              SKU 标价、实际抽成率、折扣、客户集中度或按收入流确认的收入。
