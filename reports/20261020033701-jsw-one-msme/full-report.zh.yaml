  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              能站得住脚的市场边界，比印度建筑业或全部 MSME 采购更窄。JSW One MSME 主要服务制造业和建筑业 MSME
              在线采购钢材、TMT、热轧卷、水泥及其他相关工业或建筑材料。流程还包括目录搜索、订单跟踪、财务对账、配送支持和采购挂钩信贷。住宅总包建设属于 JSW One
              Homes，不应计入本章的可服务支出基数；上游制造收入、无关的 MSME 放贷和基础设施项目的全部价值也不应计入。现实中的替代方案仍是直接向制造商或分销商采购、找本地经纪人，以及通过电话或 WhatsApp
              下单；一个信誉较低的分析师来源称这些渠道不透明且碎片化，但没有提供代表性调查。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
