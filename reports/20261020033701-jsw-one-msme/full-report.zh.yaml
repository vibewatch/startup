              列表还增加了询价、配送单据、账簿余额和付款历史。这些触点可以降低采购摩擦，并创造从首次材料订单扩展到复购、更多品类、物流或信贷的机会。管理层也把便利性和可靠性定义为预期护城河，并称信贷是必要但不充分的条件。然而，金融服务收入仅为
              INR 14.2 crore，占 FY26 合并营业收入的 0.2%，因此公开数据没有证明嵌入式金融已经成为主要的变现扩张引擎。该图展示可用入口，而非已测量的转化。
