companyProfile:
  summary: >-
    JSW One MSME 是一家总部位于孟买、由 JSW Group 控制的平台，为制造业和建筑业 MSME
    提供钢材及建材采购、物流、订单跟踪、财务对账和采购挂钩信贷。公开证据支持其交易规模已具一定体量，也能获得战略资本；但收入质量、营运资金、信用风险和客户留存的经济数据披露仍明显不足。
