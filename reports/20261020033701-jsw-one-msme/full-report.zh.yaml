  - id: TV002
    title: 正方与反方论点
    columns:
      - 立场
      - 基于证据的论点
      - 哪些事实会改变判断
    rows:
      - - 正方
        - ₹12,567 crore 的 FY25 GMV 体现出有意义的平台交易吞吐量。
        - 经审计的净收入、毛利率、现金转换和复购队列数据，将加强从规模到价值的论证链条。
      - - 正方
        - 该轮融资投向技术、物流、分销和 NBFC 扩张。
        - 若能证明履约经济性改善且信贷损失得到控制，将支持经营杠杆释放。
      - - 反方
        - 报道的非公开估值较 2023 年那轮融资上涨了三倍以上。
        - 更低的入场价格，或足以支撑重新定价的经审计增长与盈利能力，会降低这一担忧。
      - - 反方
        - 公开估值数据源在不同日期和口径下报告了 6.0x 和 1.6x 的收入倍数。
        - 经核对的资本结构和经审计的 LTM 收入明细，才能让该倍数具备可比性。
      - - 竞争检查
        - Amazon Business 报告印度有 1.6 million 个卖家，说明数字化采购触达并非没有竞争。
        - 若留存、钱包份额和品类贡献利润率优于规模化替代方案，才能证明差异化。
    notes: 这一竞争参照仅具方向性，因为 Amazon Business 与 JSW One 的品类组合、模式和披露指标分母不同。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的经济数据验证 GMV 质量；FY26 实现盈亏平衡；IPO 按报道推进。
        - 只有经审计的增长、利润率和信贷质量能够支撑时，报道中的 $902M–$925M 非公开市场区间才站得住；目标回报仍取决于条款。
        - 提交 IPO 文件，加上经审计的盈亏平衡和正向现金转换。
        - IPO 撤回，或经审计的经济数据不足以支撑该非公开轮价格。
      - - 基准
        - 规模继续扩大，但盈利能力、信贷质量和营运资本转换仍未验证。
        - 入场价应低于报道的非公开市场区间并带有下行保护；公开证据不足以支持精确的下限。
        - 上市前融资确定条款，但经审计的盈利能力仍待确认。
        - 平价或下跌轮融资、盈亏平衡反复延后，或现金转换变弱。
      - - 悲观
        - IPO 时间表延后、倍数支撑收缩，或 NBFC 与库存暴露吞噬毛利。
        - 没有公开数据能够支撑估值底线；应暂缓，而不是臆造终值倍数或目标回报。
        - 没有申报文件，没有通向盈亏平衡的经审计桥接数据，且信贷队列趋势恶化。
        - 信贷损失重大、流动性承压，或以惩罚性优先条款融资。
    notes: 情景区间是锚定报道的非公开市场观察值的决策阈值，不是预测；由于缺少经审计财务数据和证券条款，无法给出概率百分比和目标回报。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV014
      - CV015
