            body: >-
              可投资范围比面向消费者的 JSW One MSME 品牌更广。Tofler 将 JSW One Platforms Limited 识别为一家活跃、未上市、2018 年在孟买注册成立的公众公司；Tracxn
              和公司控制的 LinkedIn 页面则将运营平台的起点定为 2020 年。公司发布的页面把 JSW One MSME 定位为面向制造业和建筑业 MSME 的钢材及建材数字市场。其价值主张不止于商品搜索：JSW
              Group 称该流程还包括融资、订单跟踪和财务对账。由于商业、分销和金融活动可能分属集团内不同实体，法律实体边界因此十分关键。
