              的供应与分销；当前应用也描述了通过合作伙伴提供的灵活信贷。这可以加快品类扩充、建立信任并推动融资，但也会形成对集团供应优先级、贷款方意愿和合作伙伴承保规则的相关暴露。公司称正在扩大履约中心，并提供有测试证书支持的供应商核验，但证据池没有这些控制的独立审计。投资尽调因此应区分母公司供应量和第三方供应量，量化头部供应商及贷款方占比，测试备用路由，并将证书追溯抽查至钢厂和批次。
