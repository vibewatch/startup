  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品覆盖与成熟度
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME 通过覆盖钢材品类、TMT 钢筋和水泥的多产品采购界面服务制造业和建筑业买方。母平台描述了目录访问、信贷、订单跟踪和财务对账；Deutsche Bank
              的合作伙伴案例则描述了更完整的服务栈，包括采购、履约、自有品牌和融资。因此，该产品把交易界面与运营服务结合起来，不只是获客型市场。公开描述的业务线包括市场、分销、JSW One TMT、新推出的 One
              Helix 管材品牌、嵌入式信贷和移动采购应用。成熟度方面证据不均：市场和分销工作流被描述为已在运营，但产品可供性、认证、使用情况和服务质量指标仍未披露。
            claimRefs:
