          - type: callout
            title: 核心尽调阻碍
            body: 不要根据 GMV 或融资公告来评估信贷层。必须取得经审计的 vintage 损失、风险调整后利差、现金转换、贷款方集中度和监管记录。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR016
          - type: callout
            title: 淘汰标准必须可量化
            body: 如果信用损失吞噬贡献利润、失去重要许可证或贷款方、严重质量或交付失败反复发生，或在缺乏经审计控制和盈利证据的情况下继续上市，应暂停推进。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR012
              - CR013
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资论点
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是现在投资。投资论点是：JSW One 已达到有意义的交易规模，能够获得战略资本，并正在为印度 MSME 搭建采购、物流、技术和信贷一体化栈。FY25 GMV 为 ₹12,567
              crore，新增资本据称将用于技术、分销、物流和 NBFC，这些都说明其运营野心。反论点在于价格和证据：第三方数据库给出的收入倍数差异很大，据报道估值从 2023
              年轮融资以来快速上升，而一家规模大得多的竞争平台证明数字触达本身不是防御性。结论是，对公司的相关性有中等信心，但对风险调整后的进入价值信心较低。
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: 融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              VCCircle 报道延长轮总额为 ₹575 crore，JSW One 投后估值约 ₹8,575 crore，并指出汇率变动使美元价值低于 $1 billion。Multiples 记录 2025 年 5
              月估值 $918 million、收入倍数 6.0x；Tracxn 随后记录 $925 million 和
              1.6x。由于日期和收入定义不同，这些数字不能被当作一条干净的趋势。公开证据因此建立的是融资参考，而不是经过验证的公允价值。在接受据报道的价格区间之前，进入纪律应要求当前股权结构表、清算优先权、反稀释保护、完全摊薄后的持股，以及经审计的收入桥接。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 情景、可比公司与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要经审计证据证明 GMV 能转化为持久的净收入和营业利润，并且据报道的 IPO 路径能够执行。基准情景假设规模继续扩大，但在会计质量和信贷经济性得到验证前，对据报道的 $902 million 至
              $925 million 私募市场估值打折。悲观情景是 IPO 延迟、未能实现盈亏平衡，或信用和营运资金损失抹去上一轮私募价格的支撑。Multiples 列出的公开参考收入倍数为 Izumi、Upwork 和
              IndiaMART 的 0.6x 至 3.8x，但它们的商业模式差异很大；这些数值只能做合理性检查，不是 JSW One 的机械倍数。没有证券条款和可靠的盈利基础，就无法支持目标回报。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
