            title: 规模无法消除利润压力
            body: Udaan 据报道持续削减成本并继续融资，说明大型 B2B 平台可以一边投入，一边仍在努力实现 EBITDA 盈利；这也凸显了市场竞争中的执行和资本风险。
            calloutType: risk
