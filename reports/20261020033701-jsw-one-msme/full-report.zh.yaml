      - number: '3.2'
        title: 一体化形成差异，但尚无独立基准
        blocks:
          - type: paragraph
            body: >-
              JSW 控制的来源描述了一套覆盖材料供应、融资、订单跟踪、财务对账、履约和总包建设的业务栈。相较横向目录，它对制造业和建筑业工作流更专业。公司帖子还提到进军 One Helix 管材，而另一处 JSW
              页面提到自有品牌和不断扩大的履约中心网络。因此，护城河更依赖供应获取、品牌质量控制、分销密度和承保合作，而不是软件新颖性。保留的独立基准没有衡量其相对专业同业的交付可靠性、满足率、产品质量或审批结果。
