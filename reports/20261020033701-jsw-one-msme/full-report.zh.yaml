  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则、牌照或案件
      - 司法辖区 / 状态
      - 可能性
      - 严重性
      - 公开缓释措施
      - 剩余风险敞口
      - 尽调路径
    rows:
      - - NBFC 许可、审慎合规与放贷行为
        - 印度；据报道公司正在扩展 NBFC 业务并投入信贷评估，但保留资料中没有实体牌照和申报文件
        - 中等：监管敞口已确定，但不合规尚未确定
        - 高
        - 专门的 NBFC 部门、信贷评估投入、催收能力和合作伙伴规则
        - 在审阅牌照、资本、资产质量、投诉和执法记录前，风险较高
        - 获取 RBI 注册详情、监管申报、检查往来文件、政策、投诉和董事会风险材料
      - - 隐私、同意与信息安全义务
        - India / 应用用户；联系信息作为跟踪数据以及与身份关联的数据被披露
        - 中等：数据处理已披露，但控制失效尚未验证
        - 高
        - 保留证据没有描述经过独立测试的隐私或安全控制
        - 风险较高，因为处理者范围、留存、同意、测试和事件历史仍不可得
        - 审阅数据地图、同意记录、DPA 条款、分处理者、渗透测试、访问审查和事件日志
      - - IPO 与证券披露准备度
        - 印度；2026 年 10 月的一篇报道描述了上市前融资轮和拟议 IPO，但资料池中没有申报文件或招股书
        - 中等：时间表和披露延迟具有可能性，但尚未观察到
        - 中等
        - 据报道计划在发行前建立估值基准
        - 在经审计数字、控制、法律意见和申报状态可得前，风险中高
        - 确认承销银行、董事会批准、申报草案状态、重述审计、募集资金用途和关联方披露
    notes: 严重性和可能性是基于所引运营敞口及缺失记录作出的尽调优先级判断，不是已观察到的违规或概率估计；覆盖范围只是指定公开来源池能够支持的一组风险样本。
    enumerationScope:
      coverage: sample
      basis: >-
        Public evidence assigned to the risks chapter through 2026-10-20; regulator and court databases were not present
        in the prefetched pool.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR008
      - CR012
      - CR013
      - CR016
  - id: TR002
    title: 运营、质量、安全与财务风险登记表
    columns:
      - 失效模式
      - 可能性
      - 严重性
      - 缓释成熟度
      - 剩余风险敞口
      - 未解决缺口或触发条件
    rows:
      - - 信用损失或营运资本压力超过交易业务利润率
        - 中高风险敞口；实际损失频率未知
        - 高
        - 发展中：已描述 NBFC、信贷评估、催收和合作伙伴规则
        - 没有账龄批次、DPD、核销、利差、资本和融资期限数据，风险较高
        - 触发条件：信用损失超过风险调整后利润率，或贷款方/契约余量明显收窄
      - - 多州履约或末端配送失败
        - 来自 18+ 个州、广泛品类和扩张中履约网络的中等风险敞口
        - 高
        - 发展中：已描述订单跟踪、物流服务和履约中心
        - 没有 OTIF、取消、损坏、交付周期和集中度数据，风险中高
        - 触发条件：服务水平反复不达标、库存老化，或无法为失效节点重新路由
      - - 材料质量或证书控制失效
        - 中等风险敞口；公司声称供应商经过核验并提供检测证书
        - 高
        - 由公司描述，保留资料中未经过独立测试
        - 风险中高，因为批次追溯、退货、争议和审计例外率不可得
        - 触发条件：证书反复不匹配、严重缺陷、召回或与质量相关的客户流失
      - - 盈利能力与上市执行出现偏离
        - 中等：报告的 GMV 快速增长和运营盈亏平衡目标提高了执行要求
        - 高
        - 融资和计划中的上市前资本提供续航信号，而非盈利证明
        - 没有经审计利润率、现金转化、消耗和 FY26 盈亏平衡核对，风险较高
        - 触发条件：经审计经济性仍未解决就推进 IPO，或盈亏平衡延迟且没有资金支持的计划
    notes: 公开运营描述和报告的里程碑与明确的数据缺口并列呈现；没有任何一行声称发生过宕机、损失事件、召回或控制失效。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR012
      - CR013
      - CR016
  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖项
      - 交易对手方
      - 角色与集中度信号
      - 失效情景
      - 严重性
      - 公开缓释措施
      - 残余暴露
    rows:
      - - 核心材料供应与分销
        - JSW Steel、JSW Cement 与 JSW Paints
        - 上线材料明确依赖集团合并供应与分销；当前占比未披露
        - 集团优先级、产能、定价或渠道冲突限制选品或履约
        - 高
        - 一体化集团生态，以及从最初钢材品类向外扩展
        - 在量化关联方占比、转移定价、替代方案和替代所需时间前，风险为中高
      - - 信贷融资与承销
        - JOFL、合作 NBFC 和银行，以及融资投资者
        - 既有资产负债表风险参与，也有按合作伙伴规则开展的承销
        - 大宗商品或 MSME 下行期间，贷款方意愿、风险规则或资本可得性收紧
        - 高
        - 第一方与第三方信贷组合，以及据报道的承销投资
        - 若没有贷款方占比、融资期限、契约、审批率和损失分配信息，风险为高
      - - 供应商质量保障
        - 已验证的供应商生态
        - 公司称已核验供应商并取得测试证书；集中度未披露
        - 证书、钢厂或批次控制失效，引发质量争议或产品责任
        - 高
        - 供应商核验、测试证书，以及自有品牌的质量定位
        - 在取得供应商审计结果、可追溯性测试、保险和争议历史前，风险为中高
      - - 履约与最后一公里产能
        - 履约中心与物流网络
        - 公司称网络正在扩大，但没有提供节点级产能或服务数据
        - 仓库、承运商或工业园区节点出现瓶颈，打乱交付和现金转换
        - 中
        - 不断扩大的履约网络、订单追踪和物流服务
        - 在路线冗余、头部承运商占比、OTIF 和业务连续性测试得到证据前，风险为中
    notes: 当来源池描述了关系却没有分母时，集中度明确标为未知；历史上线证据不视为当前组合的证明。
