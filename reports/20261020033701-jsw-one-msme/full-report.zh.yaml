      - number: '1.4'
        title: 尽调解读
        blocks:
          - type: paragraph
            body: >-
              现有证据中最强的警示来自财务，而非已确认的事件。Tofler 仅将 JSW One Platforms Limited 的 FY2025 营业收入列为 INR 100-500 crore 区间，并称账面净资产下降
              47.56%。这个法律实体口径不能当作平台收入、ARR、现金消耗或可用现金。保留的负面检索结果来自公司控制页面，而非独立法律或监管记录，因此不能据此证明不存在诉讼、执法、宕机或客户纠纷。投资尽调应先厘清实体边界，取得经审计的合并账目和信贷队列数据，核实当前股权结构表与融资条款，并建立活跃客户及集中度指标。
