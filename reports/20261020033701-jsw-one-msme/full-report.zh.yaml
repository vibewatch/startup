        - label: 广义相邻市场
          value: Not quantified
          detail: 印度工业和建筑材料活动范围大于平台可触达的支出。
        - label: 分析师 TAM
          value: $100B+
          detail: Value For Startups 将其标为印度建筑与制造业。
        - label: 分析师 SAM
          value: $25B
          detail: Value For Startups 将其标为组织化 Tier 1-3 MSME。
        - label: 分析师 SOM
          value: $5B
          detail: Value For Startups 将其标为五年目标捕获量。
        - label: 公司目标账户口径
          value: More than 5 lakh MSMEs
          detail: 公司声明描述的是愿景，而非当前客户或支出。
        - label: 已验证的当前份额
          value: Unavailable
          detail: 活跃买家、可触达 GMV、品类份额和变现情况均未在公开信息中单独列出。
    approximationNotes: 数值为复现而非计算结果。货币、账户数量和不可用层级不可比，因此该金字塔只表达分析范围逐步收窄，不按比例绘制。
    claimRefs:
      - CM005
      - CM008
      - CM016
  - id: FP001
    title: 按专业化程度与一体化采购范围定位竞争
    type: quadrant
    summary: 分析师编制的序数定位将材料专业平台与综合市场区分开来，并比较有记录的采购栈广度。
    data:
      xAxis:
        label: 材料专业化程度（1 为广泛，5 为专业）
        min: 1
        max: 5
      yAxis:
        label: 一体化采购范围（1 为有限，5 为广泛）
        min: 1
        max: 5
      points:
        - label: JSW One MSME
          x: 5
          'y': 5
          detail: 聚焦钢材和水泥；公司称提供信贷、追踪、对账、履约和自有品牌。
        - label: Infra.Market
          x: 4
          'y': 3
          detail: 建筑材料制造商与平台；保留证据未证明其拥有可比的信贷或工作流栈。
        - label: NowPurchase
          x: 5
          'y': 2
          detail: 金属制造商采购专业平台；保留证据证明其聚焦该领域，但未证明更广泛的栈深度。
        - label: ArisInfra
          x: 4
          'y': 3
          detail: 建筑材料采购与供应平台，保留的能力细节有限。
        - label: Udaan
          x: 1
          'y': 4
          detail: 综合 B2B 市场，拥有分销和自有品牌投资，但不属于 JSW 的核心材料重点。
        - label: Amazon Business India
          x: 1
          'y': 4
          detail: 横向目录平台，提供批量下单、追踪、议价、GST 报告和符合条件买家信贷。
    approximationNotes: 分数是透明的分析师序数评估，不是测量所得的市场数据或排名阈值。评估只使用保留来源中有记录的品类重点和能力广度；未知能力不按已具备计分。
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP013
      - CP015
  - id: FI001
    title: 收入模式与毛利依赖图
    type: flow
    summary: 客户需求先分流至商业交易、自有品牌、履约和信贷经济性，最终才可能形成尚未披露的毛利结果。
    data:
      nodes:
        - id: demand
          label: MSME 材料需求
          detail: 制造业和建筑业买家寻找钢材、水泥及相关产品。
        - id: order
          label: 数字发现与下单
          detail: 平台支持目录浏览、下单、追踪和对账。
        - id: commerce
          label: 直接销售或佣金
          detail: 收入可能来自产品总销售额或市场佣金；收入确认政策未披露。
        - id: private-label
          label: 自有品牌产品利润
          detail: 自有品牌材料可能改善利润率，但也增加库存和质量暴露。
        - id: fulfillment
          label: 物流与履约
          detail: 交付支撑客户体验，但其费用和单笔订单成本不可得。
        - id: credit
          label: 信贷与融资
          detail: 融资可以支持转化；利差、资金成本和损失不可得。
        - id: gross-profit
          label: 毛利转换
          detail: 没有保留来源披露各条流的毛利率或贡献利润率。
      edges:
        - from: demand
          to: order
          label: 发起
        - from: order
          to: commerce
          label: 变现
        - from: order
          to: private-label
          label: 产品组合
        - from: order
          to: fulfillment
          label: 交付
        - from: order
          to: credit
          label: 融资
        - from: commerce
          to: gross-profit
          label: 利润率
        - from: private-label
          to: gross-profit
          label: 利润率
        - from: fulfillment
          to: gross-profit
          label: 成本或费用
        - from: credit
          to: gross-profit
          label: 利差或损失
    approximationNotes: 仅为概念流程；未推断转化率、收入份额或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI011
  - id: FE001
    title: 证据边界内的产品运营栈
    type: stack
    summary: 公开来源支持六个相互连接的运营层，但底层软件和安全实现仍未披露。
    data:
      layers:
        - label: 买方界面
          modules:
            - 目录浏览
            - 项目报价
            - 订单与交付追踪
        - label: 商业编排
          modules:
            - 定制订单采集
            - 卖家匹配
            - 文档管理
        - label: 供应与履约
          modules:
            - 采购
            - 仓储与处理
            - 物流与最终交付
        - label: 支付与对账
          modules:
            - 支付状态 API
            - 收款 API
            - 自动更新账本
        - label: 嵌入式金融
          modules:
            - 贷款管理
            - 采购与供应商融资
            - 营运资本产品
        - label: 支持与质量处理
          modules:
            - 问题证据接收
            - 团队核验
            - 退款或替换
    approximationNotes: 概念排序综合了已披露的工作流；不代表内部服务边界、部署拓扑或数据流。
    claimRefs:
      - CE003
      - CE005
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 有公开证据支持的客户采购旅程
    type: journey-map
    summary: 保留的产品界面描述了六个工作流触点，但没有来源报告阶段转化、重复使用或留存。
    data:
      items:
        - label: 发现
          detail: 浏览钢材、TMT、水泥以及相关建筑或制造材料。
          touchpoints:
            - 网页目录
            - 移动应用
        - label: 比较与询价
          detail: 比较材料并请求项目专属价格。
          touchpoints:
            - 产品发现
            - 报价请求
        - label: 下单
          detail: 以标准或定制配置提交采购订单。
          touchpoints:
            - 订单工作流
            - 地址管理
        - label: 融资
          detail: 作为一体化采购方案的一部分获取信贷。
          touchpoints:
            - 信贷获取
            - 金融产品
        - label: 履约
          detail: 通过分销与履约网络追踪交付。
          touchpoints:
            - 交付追踪
            - 文档管理
        - label: 对账与复购
          detail: 在可能再次采购前查看账本余额和支付历史。
          touchpoints:
            - 账本
            - 支付历史
    approximationNotes: 触点顺序反映所描述的功能，而非经过测量的漏斗；没有可用的转化率或阶段人群规模。
    claimRefs:
      - CU003
      - CU007
      - CU009
      - CU011
  - id: FR001
    title: 残余风险热力图
    type: matrix
    summary: 嵌入式信贷、履约、质量、隐私、合作伙伴集中度和 IPO 执行，按影响、基于证据的暴露和当前缓释成熟度排序。
    data:
      columns:
        - id: impact
          label: 影响
          detail: 失效模式发生后的后果
        - id: likelihood
          label: 可能性 / 暴露
          detail: 来自保留证据的暴露信号，不是事件发生概率
        - id: mitigation
          label: 缓释成熟度
          detail: 有公开证据支持的控制措施强度
      rows:
        - label: 嵌入式信贷与营运资本
          note: 优先级最高，因为已有资产负债表风险参与的描述，但缺少队列结果
          values:
            - value: High
              tone: high
            - value: Medium-high exposure
              tone: high
            - value: Developing
              tone: warning
        - label: 履约与物流
          note: 广泛的邦覆盖和不断扩大的网络增加了执行触点
          values:
            - value: High
              tone: high
            - value: Medium exposure
              tone: medium
            - value: Developing
              tone: warning
        - label: 材料质量
          note: 供应商核验由公司自述，本文未作独立测试
          values:
            - value: High
              tone: high
            - value: Medium exposure
              tone: medium
            - value: Company-described
              tone: neutral
        - label: 隐私与安全
          note: 数据处理已有披露，但缺少保障措施和事件证据
          values:
            - value: High
              tone: high
            - value: Medium exposure
              tone: medium
            - value: Not evidenced
              tone: negative
        - label: 集团与贷款方集中度
          note: 关系已确立，但当前集中度分母不可得
          values:
            - value: High
              tone: high
            - value: Medium exposure
              tone: medium
            - value: Partial
              tone: warning
        - label: IPO 与盈利执行
          note: 报道的时间表取决于本来源池中没有的审计准备度和经济证明
          values:
            - value: High
              tone: high
            - value: Medium exposure
              tone: medium
            - value: Early
              tone: warning
    approximationNotes: 序数标签是根据引用的暴露和缺失证据得出的分析师尽调优先级；它们不是统计概率，也不是事件记录。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR006
      - CR007
      - CR009
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据链支持继续尽调，而不是接受当前价格。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 报道的 FY25 GMV 为 ₹12,567 crore。
        - id: capital
          label: 战略资本
          detail: 报道的扩展融资为 ₹575 crore。
        - id: buildout
          label: 运营建设
          detail: 资本投向技术、物流、分销和 NBFC 扩张。
        - id: price
          label: 估值歧义
          detail: 第三方收入倍数因日期和口径不同而出现显著差异。
        - id: exit
          label: 前瞻退出信号
          detail: 上市前融资、IPO 和盈亏平衡仍是计划，而非已完成事项。
        - id: decision
          label: 继续研究
          detail: 在将回报纳入投资判断前，要求经审计的经济数据和当前证券条款。
      edges:
        - from: scale
          to: capital
          label: 支持募资
        - from: capital
          to: buildout
          label: 资助扩张
        - from: buildout
          to: price
          label: 经济数据仍未验证
        - from: price
          to: exit
          label: 需要市场验证
        - from: exit
          to: decision
          label: 里程碑仍有条件
    approximationNotes: 该流程是定性的，不赋予概率、转化率或估值。
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV016
