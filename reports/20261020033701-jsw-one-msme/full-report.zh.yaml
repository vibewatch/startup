              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Outlook Business 报道计划进行 ₹650–700 crore 上市前轮融资、$350–400 million IPO，并在 FY26
              年末实现运营盈亏平衡。这些是前瞻性信号，不是已经完成的流动性或盈利事件。下一道决策闸门应要求 IPO
              申报或同等的经审计发行材料、当前轮融资文件、月度客户队列和信用损失数据、经审计的毛利率及现金转换桥接、关联方披露和客户集中度。论点失效触发器包括：没有可信桥接却错过盈亏平衡里程碑、没有替代流动性却推迟
              IPO、相对于据报道的私募估值出现下轮融资，或证据显示信用损失和营运资金吞噬市场的毛利润。
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
