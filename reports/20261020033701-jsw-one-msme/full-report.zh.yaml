      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据不足以支持自下而上、公司特定的 SAM 或 SOM。Value For Startups 发布了 $100 billion-plus 的 TAM、$25 billion 的 SAM 和 $5
              billion 的 SOM，但没有披露这些数字背后的支出类别、地理筛选、买家数量、价格口径、时间区间或获取假设。Moneycontrol 转述的另一项公司说法称，平台计划服务超过 500,000 家建筑业和制造业
              MSME；这只是目标账户视角，不是当前客户数或收入机会。Union Budget 提出的 ₹12.2 lakh crore FY2026-27 公共资本开支，是独立的需求指标，但其中有相当部分支出不会进入 JSW
              One 的市场。这些视角显示出很大的相邻市场，却没有解决可投资市场份额和可变现支出的规模。
