              - CE008
              - CE011
              - CE013
              - CE015
      - number: '5.2'
        title: Customer workflow and service model
        blocks:
          - type: paragraph
            body: >-
              The customer journey begins with a company-claimed two-minute registration, then moves through catalogue
              discovery or project-specific quotation, order placement, seller matching, delivery, documentation,
              payment, and ledger review. Deutsche Bank reports that operations teams match customized orders to sellers
              using product requirements and proximity to the buyer, showing that fulfilment is operationally
              orchestrated rather than fully self-serve. The app description adds quotations, order and delivery
              tracking, invoices, balances, and payment history to the digital workflow. After delivery, JSW One states
              that buyers have two days to submit a documented material-quality issue for verification and possible
              refund or replacement. This is a concrete support process, but the narrow claim window and absence of
              public resolution-time or acceptance-rate data warrant diligence.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE009
              - CE010
              - CE011
      - number: '5.3'
        title: Operating and integration architecture
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an operating architecture, not a verified internal software-stack diagram. JSW
              One Platforms houses the commerce surface; its distribution subsidiary handles procurement, warehousing,
              processing, and private-brand production; and its finance subsidiary provides purchase, vendor, and
              working-capital finance. At the payment layer, Deutsche Bank describes an API link between JSW One's loan
              management system and the bank's core banking system, along with status and collection APIs, automated
              repayment-triggered reconciliation, customer notifications, and digital audit trails. These integrations
              are meaningful evidence of transaction automation and control points. However, the retained sources do not
              disclose hosting, data models, uptime, recovery objectives, dependency concentration, or security-test
              results, so those implementation details should not be inferred from the partner case study.
            claimRefs:
