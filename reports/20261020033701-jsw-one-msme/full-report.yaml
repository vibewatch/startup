        - Evidence of improving fulfillment economics and controlled credit losses would support operating leverage.
      - - Anti-thesis
        - The reported private valuation rose more than threefold from the 2023 round.
        - >-
          A lower entry price or audited growth and profitability sufficient to justify the repricing would reduce this
          concern.
      - - Anti-thesis
        - Public valuation feeds report 6.0x and 1.6x revenue multiples on different dates and bases.
        - A reconciled capitalization and audited LTM revenue schedule would make the multiple comparable.
      - - Competitive check
        - Amazon Business reports 1.6 million sellers in India, showing that digital procurement reach is contested.
        - >-
          Retention, share-of-wallet, and category-level contribution margin superior to scaled alternatives would
          establish differentiation.
    notes: >-
      The competitive reference is directional because Amazon Business and JSW One differ in category mix, model, and
      disclosed metric denominator.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Audited economics validate GMV quality; FY26 break-even is achieved; the reported IPO proceeds.
        - >-
          The reported $902M–$925M private-market band is defensible only if audited growth, margin, and credit quality
          support it; target return still depends on terms.
        - IPO filing plus audited break-even and positive cash conversion.
        - IPO withdrawal or audited economics that fail to support the private-round price.
      - - Base
        - Scale continues, but profitability, credit quality, and working-capital conversion remain unverified.
        - >-
          Entry should be below the reported private-market band with downside protection; public evidence does not
          support a precise lower bound.
        - A pre-listing round establishes terms but audited profitability remains pending.
        - A flat or down round, repeated break-even delay, or weaker cash conversion.
      - - Bear
        - IPO timing slips, multiple support compresses, or NBFC and inventory exposure consume gross profit.
        - >-
          No public-data valuation floor is supportable; defer rather than manufacture a terminal multiple or target
          return.
        - No filing, no audited bridge to break-even, and adverse credit-cohort trends.
        - Material credit losses, liquidity stress, or financing on punitive preference terms.
    notes: >-
      Scenario bands are decision thresholds anchored to reported private observations, not forecasts; missing audited
      financials and security terms prevent probability percentages and target returns.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV014
      - CV015
