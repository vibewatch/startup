      - number: '4.2'
        title: Public traction and disclosure boundaries
        blocks:
          - type: paragraph
            body: >-
              Public revenue indicators are directionally positive but not directly reconcilable. Tracxn reports annual
              revenue above INR 1,000 crore as of March 31, 2026, while Tofler's FY2025 page displays both an INR
              100-500 crore operating-revenue range and an INR 100-150 crore revenue band for JSW One Platforms Limited.
              The periods, legal-entity perimeter, and methodology differ, so these figures should not be treated as a
              clean growth series. LinkedIn's company-size band and employee-link count indicate a substantial operating
              organization, but headcount is only a cost-base proxy. No retained source provides SKU-level list prices,
              realized take rates, discounts, customer concentration, or recognized revenue by stream.
            claimRefs:
              - CI006
              - CI007
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI010
              - CI016
      - number: '4.3'
        title: Unit economics and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The model's most important economic drivers are visible even though their values are not. Materials
              sourcing and private-label activity imply purchase-price, inventory, and quality exposure; distribution
              and fulfillment require network capacity and logistics spend; embedded credit introduces lender economics
              and credit-risk dependence; and the visible employee scale points to a meaningful operating-cost base.
              Tofler's reported 47.56% decline in book net worth for FY2025 is the clearest adverse financial signal in
              the assigned evidence, but the public page withholds the underlying profit, borrowing, working-capital,
              and cash figures. Underwriting therefore requires a legal-entity bridge plus audited contribution margin
              and credit-cohort data.
            claimRefs:
              - CI008
              - CI009
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The May 2025 financing supplied INR 340 crore and management identified supply-chain, distribution,
              logistics, fintech, NBFC, technology, and private-brand expansion as uses. Tracxn later reports total
              funding of USD 91.6 million, a USD 26.5 million round on October 6, 2025, and a USD 925 million valuation.
              These are financing and valuation facts, not evidence of current liquidity: none of the retained sources
              discloses unrestricted cash, monthly burn, committed facilities, debt covenants, or runway as of the run
              date. The financial model is plausible and scaled, but revenue quality, margin conversion, working-capital
              absorption, and credit losses remain material diligence blockers before valuation can be underwritten.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              Reported financing proceeds cannot be treated as current cash. The retained evidence does not disclose
              post-round spending, unrestricted cash, debt availability, burn, or runway as of October 20, 2026.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME serves manufacturing and construction buyers through a multi-product procurement surface
              spanning steel categories, TMT bars, and cement. The parent platform describes catalogue access, credit,
              order tracking, and financial reconciliation, while Deutsche Bank's partner account describes a broader
              full-stack offer that includes sourcing, fulfilment, private labels, and financing. The product therefore
              combines a commerce interface with operating services rather than functioning only as a lead-generation
              marketplace. Publicly described lines include the marketplace, distribution, JSW One TMT, the newer One
              Helix pipes and tubes label, embedded credit, and a mobile procurement app. Maturity is unevenly
              evidenced: the marketplace and distribution workflows are described as operating, but product-level
              availability, certification, usage, and service-quality measures remain undisclosed.
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
