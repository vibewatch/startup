      - number: '1.4'
        title: Diligence read-through
        blocks:
          - type: paragraph
            body: >-
              The strongest caution in the assigned evidence is financial rather than incident-based. Tofler reports
              FY2025 operating revenue only as an INR 100-500 crore range for JSW One Platforms Limited and says book
              net worth decreased 47.56%. That legal-entity range cannot be treated as platform revenue, ARR, cash burn,
              or cash available. The retained adverse search returned company-controlled pages rather than independent
              legal or regulatory records, so it does not establish the absence of lawsuits, enforcement, outages, or
              customer disputes. Investment diligence should therefore reconcile the entity perimeter, obtain audited
              consolidated accounts and credit-cohort data, verify the current cap table and financing terms, and
              establish active-customer and concentration metrics.
