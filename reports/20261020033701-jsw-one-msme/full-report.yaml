              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Existing mitigations are directionally sensible but mostly company-described: a dedicated NBFC,
              underwriting investment, collections capability, partner rules, supplier verification, test certificates,
              order tracking, and fulfillment centres. The investment case should not treat those descriptions as proof
              of control effectiveness. Require monthly vintage curves, 30/60/90-day delinquency and write-off data,
              lender and supplier concentration, on-time and in-full delivery, returns and quality disputes, inventory
              days, cash conversion, security testing, and regulatory correspondence. Thesis-break triggers should
              include sustained credit losses above risk-adjusted margin, repeated covenant or liquidity stress, loss of
              a material license or lender, recurring severe quality or delivery failures, a material data incident, or
              an IPO timetable pursued without audited profitability and control evidence. Until management supplies
              those records, financing and listing milestones should be treated as capital access signals rather than
              proof of durable economics.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core diligence blocker
            body: >-
              Do not underwrite the credit layer from GMV or funding announcements. Require audited vintage losses,
              risk-adjusted spread, cash conversion, lender concentration, and regulatory records.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR016
          - type: callout
            title: Kill criteria must be measurable
            body: >-
              Pause if credit losses erase contribution margin, a material license or lender is lost, severe quality or
              delivery failures recur, or listing proceeds without audited control and profitability evidence.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR012
              - CR013
