      - number: '1.3'
        title: Leadership, governance, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Moneycontrol/PTI identified Parth Jindal as chairman and Gaurav Sachdeva as joint managing director and
              chief executive in May 2025. Tracxn and Tofler align on a six-person board, with Tofler identifying
