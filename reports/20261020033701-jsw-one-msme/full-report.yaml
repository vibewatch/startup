      - number: '7.2'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              The financing layer is the clearest regulatory diligence focus. A company presentation describes JOFL
              balance-sheet risk participation and a separate partner-rules underwriting stack, while later reporting
              says fresh capital would expand the NBFC arm and underwriting capabilities. Those facts establish exposure
              but not compliance quality: the assigned evidence does not include entity-level licenses, prudential
              filings, complaints, enforcement records, or audited credit-policy controls. The app listing also
              discloses that contact information may be used to track users and may be linked to identity. That
              disclosure is not proof of a privacy breach, but it raises a concrete diligence path around consent,
              retention, third-party processors, security testing, and incident response. A reported IPO plan adds
              disclosure-readiness and timetable risk because no filing or prospectus appears in this pool.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR012
              - CR013
