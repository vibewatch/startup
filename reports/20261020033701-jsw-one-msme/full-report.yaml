      - number: '5.4'
        title: Technical proof, reliability, and trust gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest external developer-signal proxy is AppBrain's observation of an actively maintained Android
              app: version 2.181.0 was observed on October 13, 2026, with 97 thousand estimated installs and 31 thousand
              in the preceding 30 days as of its October 18 data update. Those figures indicate distribution, not active
              use, completed orders, retention, or customer satisfaction; AppBrain explicitly says there are too few
              ratings to judge sentiment. Its captured reviews include isolated reports of missing cart pricing and a
              white-screen failure. These anecdotes do not establish incident frequency, but they identify testable
              reliability risks. No retained source provides a public status page, uptime history, incident register,
              security certification, penetration-test summary, privacy-control detail, or independently verified
              materials-quality regime, leaving trust and operational resilience as material diligence gaps.
            claimRefs:
              - CE012
              - CE013
              - CE014
