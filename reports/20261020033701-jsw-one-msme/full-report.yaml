      - number: '6.2'
        title: Aggregate adoption is visible, but cohorts are not
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signal is aggregate scale rather than customer-level proof. A company milestone
              reposted by the CEO described more than 53,000 customers and a FY24 GMV run-rate of INR 9,420 crore. A
              later syndicated company update reported FY25 GMV of INR 12,567 crore, while independent reporting based
              on the draft prospectus put FY26 operating revenue at INR 5,743.4 crore. These measures must remain
              separate: GMV and GMV run-rate are transaction-volume measures, whereas operating revenue is an accounting
              measure. Product throughput also increased, with FY26 steel volume reported at 27.1 lakh tonnes and cement
              volume at 2.6 lakh tonnes. Together they indicate expanding platform activity, but none supplies an
              active-customer denominator, order frequency, cohort retention, or the split between marketplace and
              distribution customers.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
