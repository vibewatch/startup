              - CU005
              - CU006
              - CU013
              - CU016
      - number: '6.3'
        title: Workflow breadth creates expansion surfaces
        blocks:
          - type: paragraph
            body: >-
              The product journey offers several plausible expansion loops without proving that customers actually
              progress through them. The independent prospectus-based account describes discovery, comparison, ordering,
              financing, and fulfilment tracking, while the Google Play listing adds quotations, delivery documentation,
              ledger balances, and payment history. These touchpoints can lower procurement friction and create
              opportunities to expand from a first materials order into repeat ordering, additional categories,
              logistics, or credit. Management itself frames convenience and reliability as the intended moat and says
              credit is necessary but not sufficient. Yet financial-services revenue was only INR 14.2 crore, or 0.2% of
              FY26 consolidated operating revenue, so public data does not demonstrate that embedded finance is already
              a major monetized expansion engine. The figure maps available surfaces, not measured conversions.
            claimRefs:
              - CU003
              - CU007
              - CU009
              - CU011
              - CU016
      - number: '6.4'
        title: Durability and reference quality remain unproven
        blocks:
          - type: paragraph
            body: >-
              Public evidence quality drops sharply beyond aggregate scale. The assigned corpus contains no named MSME
              customer, production deployment, customer-specific outcome, renewal statistic, NRR, GRR, churn rate,
              contract term, satisfaction measure, or concentration disclosure. The more than 53,000-customer statement
              therefore cannot be interpreted as an active, paying, repeat, or retained customer count. Likewise, a
              broad addressable ambition to serve more than 500,000 MSMEs is a market objective rather than evidence of
              adoption. The absence of named references also prevents checking whether the platform is used for
              recurring procurement or isolated spot transactions. Diligence should obtain cohort-level purchase
              frequency, gross retention, repeat GMV, category expansion, credit attachment, and top-customer and
              related-party shares before assigning durability value to the reported GMV and volume trajectory.
            claimRefs:
              - CU001
              - CU014
              - CU015
