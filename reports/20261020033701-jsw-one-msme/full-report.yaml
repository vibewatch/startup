              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              VCCircle reports that the extended round totaled ₹575 crore and left JSW One at about ₹8,575 crore
              post-money, while noting that foreign-exchange movement put the dollar value below $1 billion. Multiples
              records a May-2025 value of $918 million and a 6.0x revenue multiple; Tracxn later records $925 million
              and 1.6x. Those figures cannot be treated as a clean trend because their dates and revenue definitions
              differ. Public evidence therefore establishes a financing reference, not a validated fair value. Entry
              discipline should require the current cap table, liquidation preferences, anti-dilution protections, fully
              diluted ownership, and an audited revenue bridge before accepting the reported price band.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenarios, comparables, and return logic
        blocks:
          - type: paragraph
            body: >-
              The bull case requires audited evidence that GMV converts into durable net revenue and operating profit,
              plus execution of the reported IPO pathway. The base case assumes continued scale but with a discount to
              the reported $902 million to $925 million private-market observations until accounting quality and credit
              economics are verified. The bear case is a delayed IPO, missed break-even, or credit and working-capital
              losses that erase support for the last private price. Multiples lists broad public references from 0.6x to
              3.8x revenue for Izumi, Upwork, and IndiaMART, but their business models differ materially; those values
              are sanity checks, not a mechanical multiple for JSW One. No target return is supportable without security
              terms and a reliable earnings base.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Outlook Business reports plans for a ₹650–700 crore pre-listing round, a $350–400 million IPO, and
              operational break-even by the end of FY26. These are forward-looking signals rather than completed
              liquidity or profitability events. The next decision gate should require an IPO filing or equivalent
              audited offer materials, current round documents, monthly cohort and credit-loss data, audited
              gross-margin and cash-conversion bridges, related-party disclosure, and customer concentration.
              Thesis-break triggers are a missed break-even milestone without a credible bridge, IPO deferral without
              alternative liquidity, a down round relative to the reported private valuation, or evidence that credit
              losses and working capital consume the marketplace's gross profit.
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision gate
            body: >-
              Proceed only to data-room diligence; do not accept the reported valuation until audited economics,
              cap-table terms, and credit cohorts reconcile the conflicting public multiples.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
          - type: callout
            title: Price is not proof
            body: >-
              A corroborated financing valuation confirms what investors paid, not whether the price offers an adequate
              return after dilution, preferences, and operating risk.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV004
