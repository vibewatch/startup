  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary is narrower than Indian construction or all MSME procurement. JSW One MSME
              is positioned around online purchasing of steel, TMT, hot-rolled coil, cement, and related industrial or
              construction materials by manufacturing and construction MSMEs. The workflow also includes catalogue
              discovery, order tracking, financial reconciliation, delivery support, and purchase-linked credit.
              Residential turnkey construction belongs to JSW One Homes and should not be included in this chapter's
              addressable-spend base. Neither should upstream manufacturing revenue, unrelated MSME lending, or the full
              value of infrastructure projects. The practical status quo remains direct manufacturer or distributor
              purchasing, local brokers, and phone- or WhatsApp-assisted ordering; a low-reputation analyst source
              describes those channels as opaque and fragmented, but provides no representative survey.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Retained public evidence does not support a bottom-up, company-specific SAM or SOM. Value For Startups
              publishes a $100 billion-plus TAM, a $25 billion SAM, and a $5 billion SOM, but does not disclose the
              spend categories, geographic filters, buyer counts, price basis, time period, or capture assumptions
              behind those figures. A separate company statement carried by Moneycontrol says the platform aims to serve
              more than 500,000 building and manufacturing MSMEs; that is a target-account lens, not a current-customer
              count or revenue opportunity. The Union Budget's ₹12.2 lakh crore FY2026-27 public-capex proposal is an
              independent demand indicator, but it includes substantial spend that never enters JSW One's marketplace.
              These lenses show a large adjacency while leaving investable market share and monetizable spend
              unresolved.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM008
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The core economic buyer is the MSME owner or procurement lead responsible for material availability and
              working capital. Operational users include procurement staff and site or plant teams tracking orders,
              while the enterprise itself remains the payer; finance approvers become central when credit is embedded in
              checkout. The adoption path therefore begins with a specific material requirement and price or
              availability check, progresses through delivery confidence and reconciliation, and may expand into
              purchase-linked finance. Management's 2025 capital-allocation statement emphasizes steel and cement
              supply-chain depth, national distribution and logistics, and the fintech and NBFC arms. That direction is
              consistent with a bundled procurement proposition, but public evidence does not disclose segment-level
              conversion, repeat purchase, wallet share, or credit approval rates.
            claimRefs:
              - CM001
              - CM008
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Policy direction is a genuine demand tailwind: the 2026-27 Union Budget identifies manufacturing scale-up,
              "Champion MSMEs," and infrastructure as growth priorities, proposes ₹12.2 lakh crore of public capex, and
              says TReDS has made more than ₹7 lakh crore available to MSMEs. None of those amounts is JSW One revenue
              or addressable marketplace spend, but they support activity and liquidity in the buyer base. Execution
              remains the gating issue. Value For Startups reports app-adoption friction among older contractors, while
              Tracxn lists 213 active competitors, including funded specialists and broad B2B-commerce platforms. The
              valuation case therefore depends less on a generic macro TAM than on verified active buyers, procurement
              frequency, category margins, logistics reliability, and credit losses. Those operating metrics are not
              available in the retained market evidence.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size is not yet valuation-grade
            body: >-
              The retained $100B-plus TAM, $25B SAM, and $5B SOM originate from one low-reputation analyst page without
              a disclosed bridge. Underwriting should use transaction-level buyer counts, annual material spend,
              platform-eligible categories, geography, take rate, and verified share.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded market with several ways to solve the same job
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is wider than digital construction-materials marketplaces. Tracxn places JSW
              One MSME among 213 active competitors and identifies Infra.Market, NowPurchase, and ArisInfra as leading
              peers; its ranked list also includes OfBusiness, Power2SME, ZippMat, and Metalbook. Amazon Business is an
              adjacent horizontal procurement platform, while Udaan demonstrates how a scaled B2B marketplace can
              combine category breadth, private labels, credit, and logistics. Offline distributors, direct mill
              relationships, procurement agents, and internal purchasing teams remain substitutes because buyers can
              assemble supply, credit, and reconciliation separately. The resulting market is not winner-take-all:
              buyers can multi-home by category, geography, credit availability, and delivery urgency.
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP012
              - CP016
