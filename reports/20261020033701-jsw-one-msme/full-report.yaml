              - CR016
      - number: '7.3'
        title: Partner and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              JSW affiliation is both a mitigation and a concentration vector. At launch, management said the platform
              would leverage supply and distribution from JSW Steel, JSW Cement, and JSW Paints; the current app also
              describes flexible credit delivered through partners. This can accelerate assortment, trust, and
              financing, but it creates correlated exposure to group supply priorities, lender appetite, and partner
              underwriting rules. The company says it is growing fulfillment centres and offers supplier verification
              backed by test certificates, yet the pool contains no independent audit of those controls. Investment
              diligence should therefore separate parent-supplied volume from third-party volume, quantify top supplier
              and lender shares, test contingency routing, and sample certificates back to mills and lots.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
