  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk profile
        blocks:
          - type: paragraph
            body: >-
              JSW One combines material supply, financing, logistics, and turnkey construction, so a failure can
              propagate across credit, inventory, delivery, and customer trust rather than remain inside a single
              software workflow. The operating surface is already broad: the app listing claims more than 18,000 SKUs in
              more than 25 categories across more than 18 states, while FY25 GMV was reported at Rs 12,567 crore. That
              scale makes embedded-credit loss and working-capital discipline the first diligence priority, followed by
              fulfillment reliability and material quality. These are exposure rankings, not evidence that a loss event
              or outage occurred. The retained sources do not provide audited cohort loss rates, inventory aging,
              supplier concentration, delivery-service levels, or incident histories, so the residual ratings stay high
              until management supplies those denominators.
            claimRefs:
              - CR001
              - CR002
