        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              The investable perimeter is broader than the consumer-facing JSW One MSME name. Tofler identifies JSW One
              Platforms Limited as an active, unlisted public company incorporated in Mumbai in 2018, while Tracxn and
              the company-controlled LinkedIn page date the operating platform to 2020. Company-issued pages position
              JSW One MSME as a digital marketplace for steel and construction materials used by manufacturing and
              construction MSMEs. The proposition extends beyond product discovery: JSW Group says the workflow includes
              financing, order tracking, and financial reconciliation. This integrated model makes legal-entity scope
              important because commerce, distribution, and finance activities may sit in different group entities.
