  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment thesis
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, not invest-now. The thesis is that JSW One has reached meaningful
              transaction scale, has access to strategic capital, and is building an integrated procurement, logistics,
              technology, and credit stack for Indian MSMEs. FY25 GMV of ₹12,567 crore and a stated use of new capital
              for technology, distribution, logistics, and the NBFC provide evidence of operating ambition. The
              anti-thesis is price and proof: third-party databases produce materially different revenue multiples, the
              reported valuation rose rapidly from the 2023 round, and a much larger competitor platform demonstrates
              that digital reach alone is not defensibility. The result is medium confidence in company relevance but
              low confidence in risk-adjusted entry value.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
