  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and procurement jobs
        blocks:
          - type: paragraph
            body: >-
              JSW One serves manufacturing and construction MSMEs that buy steel, TMT, cement, and related materials,
              with procurement teams and business owners acting as the likely workflow users and economic buyers. The
              company-controlled surfaces consistently describe a combined materials, logistics, and financing
              proposition: customers can browse a broad catalogue, request quotations, place orders, track fulfilment,
              and reconcile payments. The public evidence therefore supports segmentation by procurement job rather than
              by disclosed revenue band or company size. Manufacturing buyers appear oriented toward flat and structural
              steel inputs, while construction buyers are oriented toward TMT and cement. A third segment comprises
              MSMEs seeking working-capital support alongside procurement. None of the retained sources quantifies
              segment mix, average order value, geographic density, or revenue contribution, limiting an assessment of
              which cohort drives economics.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
