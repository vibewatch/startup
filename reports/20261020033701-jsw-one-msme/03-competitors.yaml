      - ["Credit", "Access to credit is company-claimed", "Unknown in retained evidence", "Financing capability is adjacent to its marketplace model; current terms unknown", "Pay Later terms reported for eligible businesses", "Approval rates, pricing, losses, and lender concentration are unavailable"]
      - ["Order and workflow tools", "Order tracking and financial reconciliation are company-claimed", "Unknown in retained evidence", "Unknown in retained evidence", "Bulk ordering, tracking, negotiation, and GST reporting are reported", "Amazon supplies a credible horizontal workflow substitute"]
      - ["Fulfilment and logistics", "Growing fulfilment-centre network is company-claimed", "Supply capability is described, service levels unknown", "Distribution investment is reported", "Delivery-speed expansion is planned", "No retained source compares fill rate, on-time delivery, or damage rate"]
