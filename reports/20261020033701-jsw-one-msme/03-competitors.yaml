      - ["Offline distributor / direct mill", "Unknown and negotiated", "Relationship- and invoice-based terms; not evidenced in retained sources", "Local availability, sales support, and direct supply", "Status quo remains viable where relationships or urgent fulfilment dominate"]
    notes: >-
      No retained source provides a normalized steel or cement basket, freight,
      discount, tax, credit-risk, or realized-contract comparison; all unavailable
      terms are shown as unknown.
    claimRefs: [CP002, CP010, CP013, CP016]
figures:
  - id: "FP001"
    title: "Competitive positioning by specialization and integrated procurement scope"
    type: "quadrant"
    summary: >-
      Analyst-authored ordinal placement separates materials specialists from broad
      marketplaces and compares documented procurement-stack breadth.
    data:
      xAxis:
        label: "Materials specialization (1 broad to 5 specialized)"
        min: 1
        max: 5
      yAxis:
        label: "Integrated procurement scope (1 limited to 5 broad)"
        min: 1
        max: 5
      points:
        - label: "JSW One MSME"
          x: 5
          y: 5
          detail: "Steel and cement focus with company-claimed credit, tracking, reconciliation, fulfilment, and private brands."
        - label: "Infra.Market"
          x: 4
          y: 3
          detail: "Construction-material manufacturer and platform; retained evidence does not establish a comparable credit or workflow stack."
        - label: "NowPurchase"
          x: 5
          y: 2
          detail: "Metal-manufacturer procurement specialist; retained evidence establishes focus but not broader stack depth."
        - label: "ArisInfra"
          x: 4
          y: 3
          detail: "Construction-material procurement and supply platform with limited retained capability detail."
        - label: "Udaan"
          x: 1
          y: 4
          detail: "Broad B2B marketplace with distribution and private-label investment outside JSW's core materials focus."
        - label: "Amazon Business India"
          x: 1
          y: 4
          detail: "Horizontal catalogue with bulk ordering, tracking, negotiation, GST reporting, and eligible-buyer credit."
    approximationNotes: >-
      Scores are transparent analyst-authored ordinal assessments, not measured market
      data or ranking thresholds. They use only documented category focus and capability
      breadth in the retained sources; unknown capabilities are not scored as present.
    claimRefs: [CP001, CP005, CP006, CP013, CP015]
callouts:
  - calloutType: "strength"
    title: "The moat is operational, not purely digital"
    body: >-
      Public evidence supports a differentiated combination of specialized materials,
      group-linked supply, credit, fulfilment, and private brands. Durability depends
      on proving that combination improves price, availability, delivery, and credit
      outcomes versus multi-homing across platforms and distributors.
    claimRefs: [CP001, CP002, CP003, CP015]
  - calloutType: "risk"
    title: "Scale does not remove margin pressure"
    body: >-
      Udaan's reported cost reductions and continuing capital raise show that a large
      B2B platform can keep investing while still working toward EBITDA profitability,
      underscoring the execution and capital risk of marketplace competition.
    claimRefs: [CP010, CP011]
