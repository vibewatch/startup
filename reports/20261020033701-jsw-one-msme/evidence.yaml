evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited consolidated FY2025 and YTD FY2026 financials, cash balance, debt and credit facilities, current active
      customers, concentration, and entity-level revenue bridges.
    whyItMatters: >-
      Without common-scope financial and customer data, legal-entity revenue cannot support platform growth,
      profitability, liquidity, or concentration conclusions.
    diligencePath: >-
      Request audited statements, monthly management accounts, bank and lender schedules, customer cohorts, and an
      entity-by-entity consolidation bridge.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Verified founder attribution, executive biographies, committee assignments, succession coverage, and a history of
      material leadership changes.
    whyItMatters: >-
      The current public roster does not establish founder-market fit, functional depth, or key-person and succession
      risk.
    diligencePath: >-
      Obtain the organization chart, board and committee packs, executive CVs, employment terms, and leadership-change
      register.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      Current fully diluted cap table, security classes, investor ownership, board rights, liquidation preferences,
      anti-dilution terms, and related-party arrangements.
    whyItMatters: >-
      Named investors and an aggregate parent-ownership percentage do not establish economic ownership, governance
      control, or exit proceeds.
    diligencePath: >-
      Review the latest register of members, shareholders agreement, financing documents, board constitution, and
      related-party schedules.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, outage, complaint, and customer-dispute records covering the platform and its
      finance and distribution entities.
    whyItMatters: >-
      Company-controlled results from the adverse query cannot prove that no material incident or enforcement matter
      exists.
    diligencePath: >-
      Run entity-name searches across Indian court, regulator, lender, cyber-incident, and consumer-complaint records
      and reconcile results with management representations.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A bottom-up sizing model with buyer counts, annual eligible material spend, included categories, geography,
      digital adoption, take rate, and independently verified current share.
    whyItMatters: >-
      The retained TAM, SAM, and SOM cannot support penetration assumptions or a valuation multiple without a disclosed
      bridge to monetizable spend.
    diligencePath: >-
      Obtain management's market model and cohort-level transaction export, reconcile it to government or
      trade-association material-demand data, and independently sample buyer spend.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Active buyers by segment, order frequency, category mix, gross margin, repeat rate, wallet share, credit approval,
      delinquency, and loss data.
    whyItMatters: >-
      Macro demand and a target-account population do not demonstrate durable adoption, monetization, or the economics
      of embedded finance.
    diligencePath: >-
      Request monthly segment cohorts, transaction and margin bridges, logistics service levels, and lender or NBFC
      credit-vintage reports.
    relatedQuestionRefs:
      - QM004
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: commercial-comparison
    missingEvidence: >-
      A normalized basket comparing product price, freight, discount, tax, credit cost, minimum order, and realized
      contract terms across JSW One MSME and major alternatives.
    whyItMatters: >-
      Without landed-cost and financing comparisons, the chapter cannot determine whether integration produces a durable
      buyer-economic advantage.
    diligencePath: >-
      Request recent customer invoices and contracts, then run matched-basket quotes across JSW One MSME, specialist
      peers, Amazon Business, and local distributors.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: trust-and-service
    missingEvidence: >-
      Independent benchmarks for fill rate, on-time delivery, quality rejection, dispute resolution, GST accuracy, and
      credit approval outcomes.
    whyItMatters: >-
      Trust and service performance are central to the claimed moat, but company descriptions do not establish relative
      execution quality.
    diligencePath: >-
      Obtain customer references and cohort-level operational scorecards, and corroborate them with procurement records
      or third-party surveys.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: Customer-level retention, share-of-wallet, repeat order, cross-category adoption, and multi-homing data by cohort.
    whyItMatters: Operational convenience is not durable lock-in unless it produces repeat purchasing and growing wallet share.
    diligencePath: >-
      Review anonymized monthly cohorts, lost-customer interviews, and order overlap with competing platforms and
      offline distributors.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: SKU-level list prices, realized prices, discounts, contract terms, marketplace GMV, and take rates.
    whyItMatters: >-
      Without realized monetization data, revenue quality and pricing power cannot be separated from commodity
      pass-through.
    diligencePath: >-
      Request the current price book, sampled invoices, contract templates, discount waterfall, and monthly
      GMV-to-net-revenue bridge.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin and contribution margin by direct sales, marketplace, private label, fulfillment, and financing.
    whyItMatters: Blended revenue can conceal low-margin trading growth or loss-making service delivery.
    diligencePath: Obtain audited segment schedules and monthly contribution-margin cohorts by product, geography, and customer.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, debt and credit facilities, covenants, committed capex, and runway
      scenarios.
    whyItMatters: Funding raised does not establish cash available or the date and terms of the next financing requirement.
    diligencePath: >-
      Review current bank statements, treasury schedule, debt agreements, board budget, and 24-month base and downside
      cash forecast.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: credit-economics
    missingEvidence: >-
      Financed GMV, lender concentration, approval rates, pricing, funding cost, delinquency buckets, recoveries, and
      net credit losses.
    whyItMatters: Credit can drive conversion while shifting economics and risk to the NBFC, lenders, or platform.
    diligencePath: Request lender contracts, vintage curves, DPD and loss cohorts, risk-sharing terms, and realized net spread.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      Audited FY2025 and FY2026 financials with a legal-entity and consolidation bridge for the public revenue
      indicators.
    whyItMatters: >-
      The retained INR 100-150 crore, INR 100-500 crore, and greater-than-INR 1,000 crore indicators use different
      periods or unclear entity scopes.
    diligencePath: >-
      Reconcile filed statements for JSW One Platforms, JSW One Distribution, JSW One Finance, and any consolidated
      group perimeter.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: security-and-compliance
    missingEvidence: >-
      Independent security certifications, penetration-test scope and results, privacy-control documentation, incident
      history, access-control design, and model-governance evidence for credit underwriting.
    whyItMatters: >-
      The platform coordinates commercially sensitive orders, payments, ledgers, and credit decisions, so control
      failures could interrupt procurement or expose customer and financial data.
    diligencePath: >-
      Obtain current ISO or SOC reports where applicable, penetration-test executive summaries, data-flow and retention
      maps, incident and outage registers, access reviews, and NBFC model-governance documentation.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: reliability-and-scale
    missingEvidence: >-
      Service availability, latency, crash-free sessions, quote turnaround, order completion, on-time-in-full delivery,
      reconciliation exceptions, support resolution, and recovery-objective metrics with denominators.
    whyItMatters: >-
      Public app activity and a partner architecture description show distribution and integration but do not
      demonstrate reliable operation as order volume, product breadth, and financing complexity scale.
    diligencePath: >-
      Request twelve months of service-level dashboards, incident postmortems, app telemetry, order-funnel metrics,
      delivery performance, support cohorts, and bank-reconciliation exception reports.
    relatedQuestionRefs:
      - QE004
      - QE005
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Monthly or annual customer cohorts showing active buyers, repeat order rate, GRR, NRR, churn, renewal, order
      frequency, and category expansion.
    whyItMatters: >-
      Aggregate GMV, revenue, and volume growth cannot establish durable customer relationships or distinguish repeat
      behavior from new-customer acquisition.
    diligencePath: >-
      Request an anonymized monthly cohort export reconciled to invoiced revenue and GMV, then sample invoices and
      repeat orders for the largest cohorts.
    relatedQuestionRefs:
      - QU007
      - QU008
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named manufacturing and construction customer references with deployment status, tenure, purchased categories,
      measurable outcomes, and permission to contact.
    whyItMatters: >-
      Without named references, public evidence cannot verify production use, service quality, procurement savings, or
      customer-specific expansion.
    diligencePath: >-
      Obtain at least three referenceable customers across manufacturing, construction, and credit-attached procurement
      and conduct independent reference calls.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer shares of GMV, revenue, and gross profit, including JSW-group related-party
      activity and channel concentration.
    whyItMatters: >-
      Reported aggregate scale may be exposed to a small set of buyers or related-party demand, which would weaken
      diversification and bargaining-power assumptions.
    diligencePath: >-
      Request customer-level GMV, revenue, and gross-profit concentration schedules with related-party flags and compare
      them across FY24-FY26.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: credit-risk
    missingEvidence: >-
      Monthly origination and approval cohorts, 30/60/90-day past-due buckets, restructurings, write-offs, recoveries,
      risk-adjusted spread, and first-loss allocation by lender.
    whyItMatters: >-
      GMV and funding do not establish whether embedded credit produces durable, cash-generative economics or creates
      balance-sheet loss and liquidity risk.
    diligencePath: >-
      Obtain audited cohort tapes and reconcile them to the NBFC ledger, lender settlements, capital adequacy,
      covenants, and consolidated cash flow.
    relatedQuestionRefs:
      - QR002
      - QR010
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: regulatory-status
    missingEvidence: >-
      Entity-level NBFC licenses, regulatory returns, inspection correspondence, complaints, enforcement history,
      litigation docket, and legal opinions on lending and marketplace roles.
    whyItMatters: >-
      The public evidence establishes regulated credit exposure but cannot establish compliance, clean legal history, or
      the allocation of liability among group and partner entities.
    diligencePath: >-
      Verify registrations directly with the regulator and review counsel confirmations, board compliance packs,
      complaints, notices, proceedings, and contingent-liability schedules.
    relatedQuestionRefs:
      - QR009
      - QR010
    relatedTableRefs:
      - TR001
