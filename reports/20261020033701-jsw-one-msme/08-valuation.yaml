callouts:
  - calloutType: recommendation
    title: Decision gate
    body: "Proceed only to data-room diligence; do not accept the reported valuation until audited economics, cap-table terms, and credit cohorts reconcile the conflicting public multiples."
    claimRefs: [CV002, CV003, CV006, CV007, CV008]
  - calloutType: risk
    title: Price is not proof
    body: "A corroborated financing valuation confirms what investors paid, not whether the price offers an adequate return after dilution, preferences, and operating risk."
    claimRefs: [CV001, CV002, CV004, CV006]
