chapter:
  number: 6
  title: Customers
  summary: >-
    JSW One reports broad MSME reach and strong aggregate transaction growth, while its public product surfaces show a coherent procurement workflow spanning catalogue discovery, quotations, ordering, delivery tracking, reconciliation, and credit. However, the retained evidence does not name customers, distinguish active or repeat buyers, or disclose retention and concentration, so customer durability remains a material diligence gap.
sections:
  - id: customer-segments-and-jobs
    title: Customer segments and procurement jobs
    body: >-
      JSW One serves manufacturing and construction MSMEs that buy steel, TMT, cement, and related materials, with procurement teams and business owners acting as the likely workflow users and economic buyers. The company-controlled surfaces consistently describe a combined materials, logistics, and financing proposition: customers can browse a broad catalogue, request quotations, place orders, track fulfilment, and reconcile payments. The public evidence therefore supports segmentation by procurement job rather than by disclosed revenue band or company size. Manufacturing buyers appear oriented toward flat and structural steel inputs, while construction buyers are oriented toward TMT and cement. A third segment comprises MSMEs seeking working-capital support alongside procurement. None of the retained sources quantifies segment mix, average order value, geographic density, or revenue contribution, limiting an assessment of which cohort drives economics.
    claimRefs: [CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: aggregate-adoption-trajectory
    title: Aggregate adoption is visible, but cohorts are not
    body: >-
      The strongest adoption signal is aggregate scale rather than customer-level proof. A company milestone reposted by the CEO described more than 53,000 customers and a FY24 GMV run-rate of INR 9,420 crore. A later syndicated company update reported FY25 GMV of INR 12,567 crore, while independent reporting based on the draft prospectus put FY26 operating revenue at INR 5,743.4 crore. These measures must remain separate: GMV and GMV run-rate are transaction-volume measures, whereas operating revenue is an accounting measure. Product throughput also increased, with FY26 steel volume reported at 27.1 lakh tonnes and cement volume at 2.6 lakh tonnes. Together they indicate expanding platform activity, but none supplies an active-customer denominator, order frequency, cohort retention, or the split between marketplace and distribution customers.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU013]
    tableRefs: [TU002]
  - id: workflow-and-expansion
    title: Workflow breadth creates expansion surfaces
    body: >-
      The product journey offers several plausible expansion loops without proving that customers actually progress through them. The independent prospectus-based account describes discovery, comparison, ordering, financing, and fulfilment tracking, while the Google Play listing adds quotations, delivery documentation, ledger balances, and payment history. These touchpoints can lower procurement friction and create opportunities to expand from a first materials order into repeat ordering, additional categories, logistics, or credit. Management itself frames convenience and reliability as the intended moat and says credit is necessary but not sufficient. Yet financial-services revenue was only INR 14.2 crore, or 0.2% of FY26 consolidated operating revenue, so public data does not demonstrate that embedded finance is already a major monetized expansion engine. The figure maps available surfaces, not measured conversions.
    claimRefs: [CU003, CU007, CU009, CU011, CU016]
  - id: durability-reference-quality-and-concentration
    title: Durability and reference quality remain unproven
    body: >-
      Public evidence quality drops sharply beyond aggregate scale. The assigned corpus contains no named MSME customer, production deployment, customer-specific outcome, renewal statistic, NRR, GRR, churn rate, contract term, satisfaction measure, or concentration disclosure. The more than 53,000-customer statement therefore cannot be interpreted as an active, paying, repeat, or retained customer count. Likewise, a broad addressable ambition to serve more than 500,000 MSMEs is a market objective rather than evidence of adoption. The absence of named references also prevents checking whether the platform is used for recurring procurement or isolated spot transactions. Diligence should obtain cohort-level purchase frequency, gross retention, repeat GMV, category expansion, credit attachment, and top-customer and related-party shares before assigning durability value to the reported GMV and volume trajectory.
    claimRefs: [CU001, CU014, CU015]
    tableRefs: [TU003]
