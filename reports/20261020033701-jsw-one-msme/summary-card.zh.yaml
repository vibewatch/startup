  topStrengths:
    - 报道称 FY25 GMV 达到 INR 12,567 crore，说明交易规模已不小。
    - JSW 关联的材料供应、履约、私有品牌和信贷能力，拼出了一个一体化采购方案。
    - 战略融资和报道中的 IPO 前路径，释放出资本获取能力及潜在流动性的信号。
  topRisks:
    - 嵌入式信贷损失、贷款方集中度和营运资金消耗，尚未通过经审计的分组数据披露。
    - 收入质量、毛利率、盈利能力、现金转化和法律实体合并情况，仍缺乏充分验证。
    - 履约、材料质量、隐私和安全控制，缺少独立的运营证据。
    - 当前股权结构条款和报道中的 IPO 准备情况尚未验证，削弱了对下行风险和回报的投资判断。
  unresolvedGaps:
    - 经审计的 FY25 和 FY26 合并财务报表，包括收入确认、毛利率、EBITDA、现金流和营运资金变动桥接表。
    - 当前完全摊薄股权结构表、证券类别、清算优先权、反稀释条款、治理权利和关联方安排。
    - 信贷分组数据、贷款方集中度、实际利差、逾期天数（DPD）和损失率、监管申报及合规记录。
    - 活跃客户和复购客户数量、购买频率分组、留存率、客户集中度、关联方占比及具名客户推荐。
    - 独立的履约、质量、隐私、安全和事故证据，以及已提交的 IPO 或上市前文件。
