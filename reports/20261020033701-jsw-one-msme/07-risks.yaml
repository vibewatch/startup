  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: credit-risk
      missingEvidence: >-
        Monthly origination and approval cohorts, 30/60/90-day past-due buckets, restructurings,
        write-offs, recoveries, risk-adjusted spread, and first-loss allocation by lender.
      whyItMatters: >-
        GMV and funding do not establish whether embedded credit produces durable, cash-generative
        economics or creates balance-sheet loss and liquidity risk.
      diligencePath: >-
        Obtain audited cohort tapes and reconcile them to the NBFC ledger, lender settlements,
        capital adequacy, covenants, and consolidated cash flow.
      relatedQuestionRefs: [QR002, QR010]
      relatedTableRefs: [TR002, TR003]
    - type: missing-source
      severity: material
      topic: regulatory-status
      missingEvidence: >-
        Entity-level NBFC licenses, regulatory returns, inspection correspondence, complaints,
        enforcement history, litigation docket, and legal opinions on lending and marketplace roles.
      whyItMatters: >-
        The public evidence establishes regulated credit exposure but cannot establish compliance,
        clean legal history, or the allocation of liability among group and partner entities.
      diligencePath: >-
        Verify registrations directly with the regulator and review counsel confirmations, board
        compliance packs, complaints, notices, proceedings, and contingent-liability schedules.
      relatedQuestionRefs: [QR009, QR010]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: operational-resilience
      missingEvidence: >-
        Node-level OTIF, cancellations, damages, returns, stock aging, supplier and carrier
        concentration, disaster recovery tests, and business-continuity results.
      whyItMatters: >-
        A broad catalog and multi-state footprint increase execution surfaces, but the retained
        evidence cannot quantify failure frequency, redundancy, or cash-conversion consequences.
      diligencePath: >-
        Sample twelve months of orders by node, category, supplier, and carrier; reconcile service
        levels and exceptions to credits, refunds, disputes, and working-capital movements.
      relatedQuestionRefs: [QR004, QR008, QR010]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: privacy-security
      missingEvidence: >-
        Data inventory, consent records, retention schedules, subprocessors, independent security
        reports, penetration tests, privileged-access reviews, and incident-response records.
      whyItMatters: >-
        The app discloses identity-linked and tracking data, while the retained evidence does not
        show how those risks are controlled or whether material incidents occurred.
      diligencePath: >-
        Review the data-protection impact assessment, contracts, security reports, test remediation,
        access logs, incident register, notifications, and cyber-insurance terms.
      relatedQuestionRefs: [QR003, QR009, QR010]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: ipo-readiness
      missingEvidence: >-
        Audited FY25 and FY26 financials, profitability bridge, draft prospectus status, banker
        mandates, board approvals, use of proceeds, related-party disclosures, and control reports.
      whyItMatters: >-
        A financing or listing timetable does not prove readiness, profitability, liquidity, or an
        investable entry price, and delay could increase capital dependence.
      diligencePath: >-
        Obtain the data room index and filing timetable, reconcile reported GMV and break-even
        targets to audited revenue, margins, cash conversion, liabilities, and governance controls.
      relatedQuestionRefs: [QR007, QR008, QR010]
      relatedTableRefs: [TR001, TR002]
