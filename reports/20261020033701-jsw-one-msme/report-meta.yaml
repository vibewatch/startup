companyProfile:
  summary: >-
    JSW One MSME is a Mumbai-based, JSW Group-controlled platform that serves manufacturing and construction MSMEs with
    steel and building-material procurement, logistics, order tracking, financial reconciliation, and purchase-linked
    credit. Public evidence supports meaningful transaction scale and strategic capital access, while the economics of
    revenue quality, working capital, credit risk, and customer retention remain insufficiently disclosed.
  foundingLocation: Mumbai, Maharashtra, India
  headquarters: Mumbai, Maharashtra, India
  productSummary: >-
    A web and mobile procurement workflow covering materials discovery, quotations, ordering, seller matching,
    fulfilment, delivery tracking, documentation, payments, reconciliation, private-label products, and embedded
    finance.
  customerFocus: Manufacturing and construction MSMEs in India
  businessModel: >-
    Direct materials margin, marketplace commissions, private-label product margin, logistics and fulfilment economics,
    and financing-related fees or spreads; realized mix and margins are not publicly disclosed.
  stage: Growth / reported pre-IPO process
  fundingStatus: >-
