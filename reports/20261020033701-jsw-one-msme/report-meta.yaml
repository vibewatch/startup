  topStrengths:
    - Reported FY25 GMV of INR 12,567 crore indicates meaningful transaction scale.
    - JSW-linked materials access, fulfilment, private brands, and credit create an integrated procurement proposition.
    - Strategic financing and a reported pre-IPO pathway provide capital-access and potential-liquidity signals.
  topRisks:
    - >-
      Embedded-credit losses, lender concentration, and working-capital consumption are not disclosed through audited
      cohorts.
    - >-
      Revenue quality, gross margin, profitability, cash conversion, and legal-entity consolidation remain
      insufficiently verified.
    - Fulfilment, material-quality, privacy, and security controls lack independent operating evidence.
    - Current cap-table terms and reported IPO readiness are unverified, weakening downside and return underwriting.
  unresolvedGaps:
    - >-
      Audited FY25 and FY26 consolidated financials with revenue recognition, gross margin, EBITDA, cash flow, and
      working-capital bridges.
    - >-
      Current fully diluted cap table, security classes, liquidation preferences, anti-dilution terms, governance
      rights, and related-party arrangements.
    - >-
      Credit-cohort data, lender concentration, realized spread, DPD and loss rates, regulatory filings, and compliance
      records.
    - >-
      Active and repeat customer counts, purchase-frequency cohorts, retention, concentration, related-party mix, and
      named customer references.
    - >-
      Independent fulfilment, quality, privacy, security, and incident evidence plus filed IPO or pre-listing
      documentation.
