- id: capital-base-and-stakeholders
  title: Capital base, valuation path, and stakeholder map
  body: 'The financing chronology is one of the stronger parts of the public record. The first clean institutional anchor is the April 2023 Mitsui round: multiple sources align on Rs 205 crore at roughly Rs 2,750 crore valuation, with proceeds earmarked for geography expansion, logistics, credit, and technology. Two years later, JSW One moved much faster. In May 2025 it raised Rs 340 crore from Principal Asset Management, OneUp, and JSW Steel participation, with company and media materials treating that round as the business’s entry into the unicorn club at a $1 billion valuation.


    The story did not stop there. The October 2025 extension lifted the total round to Rs 575 crore and brought in State Bank of India alongside Principal Asset Management, One-Up, International Conveyors, Scarlett Ventures, and JSW Steel. That round is strategically important because it reinforces the business’s shift toward a combined commerce-and-finance thesis: management explicitly said fresh capital would deepen proprietary technology, logistics, underwriting, and the NBFC arm. Mint adds another useful anchor by reporting cumulative equity raised of Rs 1,120 crore. What remains under-disclosed is the full cap table and control map. Public sources name the major stakeholders and valuation waypoints, but they do not fully disclose ownership percentages, preference rights, or how much of the most recent capital was primary versus secondary.'
