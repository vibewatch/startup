callouts:
- calloutType: strength
  title: The company has moved beyond a simple materials catalogue into a full-stack procurement workflow
  body: The strongest evidence in the public file is not just funding size. Official materials and interviews repeatedly describe an operating stack that combines materials sourcing, embedded credit, fulfilment, and after-sales support. That is reinforced by the lender network, the NBFC build-out, and customer-facing testimonials about delivery reliability and quality.
  claimRefs:
  - CO006
  - CO009
  - CO033
  - CO038
  - CO039
- calloutType: risk
  title: Scale is credible, but the public file still leaves meaningful diligence blind spots
  body: JSW One’s unicorn valuation and FY25 GMV are well supported, yet the same source pack still shows widened FY24 losses, inconsistent external headcount estimates, and limited public disclosure on cap-table control rights. That mix argues for confidence in scale, but not for confidence in governance or profitability without management-room diligence.
  claimRefs:
  - CO021
  - CO026
  - CO042
  - CO043
  - CO044
  - CO045
