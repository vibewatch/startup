  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control-rights
    missingEvidence: Current shareholder percentages, board committees, investor protections, and any sponsor-specific veto or information rights.
    whyItMatters: Later-stage recommendation quality depends on knowing whether capital providers or sponsor entities can constrain strategy, liquidity, or financing decisions.
    diligencePath: Request the current cap table, board charter, and shareholder-rights summary from management or data room counsel.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A current management-certified employee count and leadership-org snapshot that reconciles the 424 versus 915 external-database gap.
    whyItMatters: Headcount is a core scale indicator and a denominator for productivity and burn analysis; unresolved variance weakens any margin or operating-efficiency inference.
    diligencePath: Ask for current total employees, by-function split, and the date used for the company’s latest internal headcount report.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
    - TO002
  - type: private-evidence-only
    severity: material
    topic: profitability-and-cash-burn
    missingEvidence: Audited FY25 EBITDA, net loss, cash burn, and unit-economics detail for the marketplace, NBFC, and logistics components.
    whyItMatters: The public record proves scale and financing momentum, but not whether rapid growth is creating durable contribution margin before IPO preparation accelerates.
    diligencePath: Obtain audited FY25 financial statements plus segment-level P&L or board materials covering gross margin, credit losses, and operating leverage.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO001
    - TO004
