evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control-rights
    missingEvidence: >-
      Current shareholder percentages, board committees, investor protections, and any sponsor-specific veto or
      information rights.
    whyItMatters: >-
      Later-stage recommendation quality depends on knowing whether capital providers or sponsor entities can constrain
      strategy, liquidity, or financing decisions.
    diligencePath: Request the current cap table, board charter, and shareholder-rights summary from management or data room counsel.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: >-
      A current management-certified employee count and leadership-org snapshot that reconciles the 424 versus 915
      external-database gap.
    whyItMatters: >-
      Headcount is a core scale indicator and a denominator for productivity and burn analysis; unresolved variance
      weakens any margin or operating-efficiency inference.
    diligencePath: >-
      Ask for current total employees, by-function split, and the date used for the company’s latest internal headcount
      report.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: profitability-and-cash-burn
    missingEvidence: >-
      Audited FY25 EBITDA, net loss, cash burn, and unit-economics detail for the marketplace, NBFC, and logistics
      components.
    whyItMatters: >-
      The public record proves scale and financing momentum, but not whether rapid growth is creating durable
      contribution margin before IPO preparation accelerates.
    diligencePath: >-
      Obtain audited FY25 financial statements plus segment-level P&L or board materials covering gross margin, credit
      losses, and operating leverage.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: conflicting-data
    severity: material
    topic: msme-universe-denominator
    missingEvidence: >-
      A harmonized official series separating estimated MSME stock, registered units, and active procurement-ready
      manufacturing/construction MSMEs.
    whyItMatters: >-
      Without one denominator, top-down market sizing can look larger or smaller because of definitional drift rather
      than true market movement.
    diligencePath: >-
      Ask management to map its internal target-customer universe to ASUSE, Udyam/UAP, and product-category cohorts by
      manufacturing, construction, and channel buyer segments.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: jsw-one-sam-som
    missingEvidence: >-
      Audited breakdowns of GMV, active buying accounts, repeat rates, and category mix by steel, cement, logistics, and
      financed orders.
    whyItMatters: >-
      Current public sources show meaningful operating scale but do not isolate a clean JSW-One-specific TAM, SAM, or
      obtainable SOM.
    diligencePath: >-
      Request cohort tables for active buyers, GMV, steel tonnes, cement volumes, and region-by-region share within
      industrial clusters.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: private-b2b-digital-penetration
    missingEvidence: An independent sector study measuring current digital penetration in private B2B building-material procurement.
    whyItMatters: >-
      The strongest retained penetration signal is competitor commentary rather than a neutral industry audit, which
      weakens conviction on adoption-speed assumptions.
    diligencePath: >-
      Source distributor, contractor, and manufacturing-MSME survey data on channel mix, online order share, and repeat
      digital usage by product line.
    relatedQuestionRefs:
      - QM019
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: credit-unit-economics
    missingEvidence: >-
      Platform-level loss rates, take rates, approval rates, and NBFC asset-quality metrics for financed procurement
      orders.
    whyItMatters: >-
      Embedded finance clearly drives conversion, but public sources do not show whether financed GMV is economically
      attractive or simply volume-accretive.
    diligencePath: >-
      Review lender-partner contracts, delinquency curves, NBFC asset-quality disclosures, and contribution margin by
      financed versus cash order cohorts.
    relatedQuestionRefs:
      - QM017
      - QM020
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized steel or cement pricing, discount curves, and contract terms for JSW One and direct peers remain
      undisclosed in public sources.
    whyItMatters: >-
      Without realized pricing and rebate terms, the chapter can compare list or quote surfaces but cannot prove
      enduring price leadership or margin room.
    diligencePath: >-
      Request anonymized customer invoices, standard contract templates, and discount policy ranges for JSW One,
      OfBusiness, Infra.Market, and Metalbook.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: credit-loss-disclosure
    missingEvidence: >-
      Portfolio loss rates, default vintages, and realized take rates for embedded-finance products are not publicly
      disclosed across the direct-peer set.
    whyItMatters: >-
      Finance is advertised by many competitors, but absent credit-performance data prevents underwriting whether the
      feature is moat-creating or balance-sheet destructive.
    diligencePath: >-
      Request portfolio vintage decks, NPA metrics, loss curves, and partner-bank economics for JSW credit facilitation,
      Oxyzo, Udaan, and any Moglix finance programs.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP005
  - type: missing-source
    severity: material
    topic: offline-channel-share
    missingEvidence: >-
      No retained public source quantifies how much heavy-material MSME procurement still sits with local distributors
      versus digital platforms.
    whyItMatters: >-
      The share of offline procurement determines how much headroom remains for digital platforms and whether
      distributor relationships are still the default buyer behavior.
    diligencePath: >-
      Collect channel-mix studies from CRISIL, ICRA, CARE, steel associations, cement dealers, or internal buyer surveys
      that split offline versus digital procurement share.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: retention-multi-homing
    missingEvidence: >-
      Public sources do not disclose reorder rates, share-of-wallet, retention cohorts, or multi-homing behavior for JSW
      One and direct rivals.
    whyItMatters: >-
      The core moat question is whether buyers consolidate on one rail or spread spend across several platforms; absent
      retention data, lock-in remains an assertion rather than proof.
    diligencePath: >-
      Request cohort retention, repeat-order frequency, active-buyer counts, and win-loss data by customer segment,
      especially for steel and construction MSMEs.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP005
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, unrestricted liquidity, and management runway assumptions at the subsidiary level.
    whyItMatters: >-
      Without cash and runway data, the latest equity rounds cannot be translated into solvency headroom or next-round
      timing confidence.
    diligencePath: Request FY25 audited standalone financial statements, monthly cash bridge, and board-approved FY26 operating plan.
    relatedQuestionRefs:
      - QI022
