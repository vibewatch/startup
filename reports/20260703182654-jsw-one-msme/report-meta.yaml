  topStrengths:
    - JSW One has crossed the threshold for real operating relevance, with public evidence supporting ₹12,567 crore FY25 GMV, 84,000-plus registered MSMEs, about ₹3,800 crore of credit disbursement, and roughly 2 million tonnes of steel moved.
    - "The product is deeper than a thin catalogue: retained sources show a workflow that combines materials procurement, logistics, fulfilment, private-brand or processing layers, and embedded finance for manufacturing and construction MSMEs."
    - Sponsor support is credible, with Mitsui, Principal Asset Management, SBI, JSW Steel, and multiple partner lenders validating capital access while repeat-order evidence above 70% suggests useful commercial traction.
  topRisks:
    - "Public economics are still too opaque for a premium underwriting call: FY24 losses were material, FY25/FY26 audited statements are not public, and gross margin, cash-flow, CAC, retention, and credit-loss detail remain undisclosed."
    - The model is meaningfully credit-dependent, with more than one-third of orders or about 40% of GMV tied to financing while most lending still sits with external banks and NBFCs whose appetite and collections quality are not transparently disclosed.
    - Governance and valuation transparency lag scale, because the current post-money price, preference stack, related-party exposure, and marketplace-neutrality implications of the JSW ecosystem are not yet visible at prospectus-grade quality.
  unresolvedGaps:
    - Audited FY25 and YTD FY26 financials with revenue bridge, gross margin, EBITDA, cash, and working-capital detail are not public.
    - Current cap table, live post-money valuation, liquidation preferences, anti-dilution terms, and governance rights for the later 2025-2026 financings are undisclosed.
    - Credit-cohort data including lender concentration, approval rates, DPD buckets, loss rates, and realized spread are unavailable in retained public sources.
    - Active-customer counts, concentration, NRR or GRR, related-party mix, and cohort retention data remain insufficiently disclosed.
