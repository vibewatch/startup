      - number: '3.2'
        title: 直接材料平台对比更宽的企业采购套件
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 是披露最接近的直接同行，因为其官方表面看起来像 JSW 自身主张的重型版本：覆盖钢材和建筑相邻品类的原材料采购、通过 Oxyzo 明确信贷，以及在订单、SME、SKU
              和经营收入上更强的公开规模主张。Infra.Market 是另一个主要直接威胁，尤其在建筑和项目采购中，因为它已扩展为多品类建材品牌组合，拥有自有和合作制造、B2B 直销以及非常大的零售触点网络。Moglix
              的重要性不同。它没有那么以重材料为中心，但其企业采购栈——自动化、分析、供应商整合、融资和定制加工——让它在买家重视工作流控制胜过垂直专业化的场景中，成为可信的横向采购轨道。Zetwerk
              应视为相邻而非直接：当买家需要合同制造或工业执行，而不只是商品采购时，它才重叠。实践中，这意味着 JSW 同时与同类材料轨道竞争，也与能够捕获相邻买方任务的更宽采购系统竞争。
