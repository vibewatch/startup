      - number: '2.3'
        title: 买方分层、工作流归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              JSW One 当前披露组合以制造业为主，而非建筑为主：Mint 把拆分列为约 82% 制造、18%
              建筑。这个差异重要，因为即使产品目录重叠，不同细分的买方旅程也不同。制造业买家往往关心钢材重复补货、按规格切割加工和可预测的线边交付；建筑买家更关心按项目节奏发货、现场可得性和短期库存融资。独立报道也把终端买家周围的生态拓宽：经销商、加工商、OEM
              关联供应商、土建承包商和零售商都会影响哪个渠道真正拿到订单。


              平台披露的运营模式与这种分层吻合。独立报道称 JSW One
              把分销实体和金融实体结合起来，销售第三方和自有品牌产品，运营加工中心和库存点，并继续投资运输和集群级分销。这意味着采用路径不只是“浏览并点击”。它是发现、定规格、授信、发运和复购。信贷足够核心，公开来源反复把增长与资金、风控和
              NBFC 扩张绑定，而不是只与目录宽度绑定。实际含义是，买方、用户和付款方常常在同一家 MSME 内坐在不同位置：采购或运营发起订单，但创始人或财务负责人通常掌握资金决定。
