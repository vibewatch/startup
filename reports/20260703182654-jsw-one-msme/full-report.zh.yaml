  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与牵引力
        blocks:
          - type: paragraph
            body: >-
              公开证据支持真实规模故事，但经济性故事仍不完整。管理层和多次媒体报道把 FY25 GMV 锚定在 ₹12,567 crore，FY25 收入锚定在 ₹3,976 crore，同时显示注册 MSME 超过
              84,000 家、撮合信贷约 ₹3,800 crore、平台售出钢材约 2 million tonnes。这些数字意味着 JSW One 不是一个轻量线上线索生成层：公开收入 / GMV 比例约
              31.6%，远更接近一套整合分销、加工和融资栈，而不是传统低抽佣率市场平台。管理层坚持称公司不是在做多卖方交易所，Mint 又描述同一平台上有第三方材料、按规格切割卷材和 JSW One
              品牌的合同制造产品，这进一步强化了这种解读。


              定价只部分公开。官方页面承诺最佳材料获取、可预测定价和一站式购买流程，但面向买家的付款披露多是运营性的，而不是经济性的：标准订单仍需 100% 预付款，付款通过网银或 NEFT/RTGS
              完成，实际订单付款链接由销售代表在确认时发送。这意味着公开网页表面呈现的是报价驱动采购，而不是干净的自助 SKU 价目表。因此货币化结论只能在高层面说清：JSW One
              似乎通过确认材料收入、自有品牌、加工、物流协调和金融邻接来变现，而实际折扣表和品类抽佣率仍未公开。
