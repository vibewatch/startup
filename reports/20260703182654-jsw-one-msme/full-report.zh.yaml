      - number: '6.2'
        title: 采用轨迹和具名客户证明
        blocks:
          - type: paragraph
            body: >-
              最有力的采纳证据不是干净披露的活跃客户分群，而是一组规模代理指标。官方和独立的 FY25 报道都指向同一组数：84,000+ 注册 MSME、约 200 万吨钢材采购、约 ₹3,800 crore
              促成信贷。Moneycontrol 给了一个更早的路标：注册基础已超过 58,000，首次买家翻倍，70% 以上业务已经来自复购。合在一起看，这些信号支撑的是 2024 年到 FY25、再到 FY26
              初期的真实采纳轨迹，不是一季营销峰值。BusinessWorld 又把轨迹往前推：管理层预期 FY26 上半年 GMV 超过 ₹8,000 crore，同时继续扩大物流和分销覆盖。


              具名客户证据也是真实的，但需要谨慎处理。最好的官方客户证明页面点名 Technomix Engineers、Malan Industries、MPI Exports 和 Aria
              Industries，引用内容强调产品可得、按时交付、价格有竞争力、材料质量和售后支持。这些不只是标识
              展示，而是在描述下单行为和服务体验。独立目录和公司页面也能交叉印证，其中一些名称确实是工业买家或制造商，而非编造的背书。Technomix 是 Pune 的工程和制造业务，MPI Exports
              是服务汽车和机械行业的钢制品制造商，Aria Industries 是 Pune 的钢材和加工产品制造商，Om Industries 是 Pune 的加工企业，其 JSW One
              视频标题明确把故事描述为从十家供应商转向一个平台。仍然缺失的是任何具名客户的支出、采购量、精确下单节奏或量化
              ROI。因此，公开证据更能稳稳跨过「真实客户存在」这道门槛，而不是「大额、持久、深度渗透账户」这道门槛。
