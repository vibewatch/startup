  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险基线与排序
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME 现在面对的风险面，已经比一个简单材料目录大得多、也互联得多。公开公司材料和媒体来源一致描述的是一个把工业供给、平台工作流、嵌入式信贷、物流编排、库存点、加工中心、合同制造和 IPO
              前融资结合在一起的模型。这个宽度在战略上有吸引力，但也意味着失败会同时穿透信任、履约、融资和估值。证据最充分的五个一阶风险是：母集团供给和所有权带来的市场中立性冲突；依赖第三方贷款人的信贷驱动需求；多节点履约栈的执行压力；IPO
              前治理和信贷质量细节披露不足；以及母集团法律或 ESG 争议可能反噬买家、贷款人或投资者感知。缓释因素存在，但公开披露仍在贷款人集中度、损失表现、服务可靠性和关联方占比上留下重要盲点。
