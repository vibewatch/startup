  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 估值区间（x 2025 年 5 月披露标记）
      - 从 2026 年新上调价格出发的回报逻辑
      - 关键摆动因素
    rows:
      - - 乐观
        - 25%
        - 1.2x-1.5x
        - 只有下一次估值标记同时带来经验证的 FY26 盈亏平衡、干净条款和可信的信贷质量证据时才成立。
        - 盈亏平衡证明、贷款方韧性、公开经济性和及时的 IPO 工作流。
      - - 基准
        - 50%
        - 0.9x-1.2x
        - 支持继续尽调，可能接受相对 2025 锚点持平到小幅溢价，但不支持盲目重估。
        - 规模继续增长，但披露仍落后于溢价估值中隐含的乐观预期。
      - - 悲观
        - 25%
        - 0.7x-1.0x
        - 偏重优先权的融资、IPO 延误或 Udaan 式行业压缩，都会把公允价值拉回 2025 锚点或以下。
        - 同行降估值、隐藏保护条款、盈利证据薄弱或信贷压力。
      - - 概率加权解读
        - 100%
        - 0.9x-1.15x
        - 当前公开证据仍聚集在上一次披露锚点附近，而非大幅新溢价。
        - 只有新证据填补披露缺口的速度快过价格扩张，建议才会上调。
    notes: 情景区间是分析师估计，以 2025 年 5 月披露标记的倍数表示，因为后续私募轮价格和优先条款仍未披露。
