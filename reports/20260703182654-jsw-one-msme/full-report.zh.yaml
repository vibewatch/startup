  - id: FM001
    title: 市场规模观察框架
    type: pyramid
    layout: standard
    summary: 在证据受限下搭出的金字塔：先看广义 MSME 基数，再看全国材料需求，最后落到 JSW One 当前服务的采购楔子。
    data:
      items:
        - label: 广义 MSME 经济基数
          value: 7.34-7.86 crore enterprises; 31.1% GDP; 48.5%+ exports
          detail: 公开来源对精确分母有分歧，但一致认为可服务企业基数巨大。
        - label: 工业材料需求层
          value: 147.7 MT finished steel; ~490 MT FY26 cement output
          detail: 全国钢材和水泥流量定义了 JSW One 切入的采购密集型品类。
        - label: 可触达的数字采购楔子
          value: Manufacturing-led mix with construction adjacencies, logistics, and credit
          detail: 实际楔子比全部 MSME 商贸更窄，因为它取决于可重复采购流程和融资需求。
        - label: JSW One 当前服务覆盖
          value: ₹12,567 crore FY25 GMV; ~2.0-2.4 MT steel; 84k+ registered MSMEs
          detail: 当前披露覆盖显示已有可观规模，但相对全国需求仍只是低个位数渗透率。
    approximationNotes: 这不是一座干净的外部 TAM/SAM/SOM 金字塔。它有意把公开的结构和需求视角叠在一起，因为当前披露没有单独给出 JSW One 专属的标准市场规模。
