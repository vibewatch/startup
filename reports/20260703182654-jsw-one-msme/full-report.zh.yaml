companyProfile:
  summary: >-
    JSW One MSME 是总部位于 Mumbai 的 JSW One Platforms 旗下运营型市场品牌；后者隶属 JSW Group，2018 年依法设立，2021 年商业化推出，目标是把制造和建筑 MSME
    的钢材、水泥及相关建材采购数字化。平台如今不只是轻量挂牌市场，而是把材料采购、物流与履约、信贷撮合，以及不断扩大的 NBFC 层合在一起。公开证据支持 FY25 已有实质经营规模：84,000 多家注册 MSME、₹12,567
    crore GMV、约 ₹3,800 crore 信贷放款，以及独角兽融资；但当前投资判断的关键，是实际规模能否在下一轮私募或 IPO 估值抬升前转化为透明、可持续的经济性。
