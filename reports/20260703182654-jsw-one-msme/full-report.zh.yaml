            body: >-
              替代压力来自买方行为，不只来自完美品类重叠。Udaan 通过信贷和快速交付服务小企业补货，但留存证据仍把它放在 FMCG、医药、基础食品和 HoReCa，而非钢材或水泥。Amazon Business
              是最可信的横向替代品，因为它结合 GST 发票、合规工具、批量折扣、广泛 MRO 和工业品类、全国交付，以及 30 天免息信贷。GeM
              在公共部门项目或合规投标重要的地方更有结构性意义；平台已经以数万亿卢比规模处理采购，并有明确钢铁行业导入。整个竞争集中，定价透明度很弱。Metalbook 和 Amazon 展示最清晰的公开价格信号，Moglix
              在标准品上暴露目录式产品定价，OfBusiness 把价格访问放在登录和报价流程之后，但 Infra.Market 和 Udaan
              在本次留存公开证据中仍主要由报价驱动。这意味着买家比较这些选项时，可能和可见标价一样重视信贷可得性、交付可靠性或合规。
