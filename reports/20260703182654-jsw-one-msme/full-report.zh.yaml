      - number: '5.3'
        title: 信任、质量与合规控制
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME
              的信任层在触及文件、容差和退货时最强。公开支持页面披露了测试证书和卖方称重单的具体节奏：适用证书和称重单会在开票后三天内通过邮件发送，背书测试证书可直接向客服申请。质量例外也被设计成明确流程步骤，而不是含糊承诺。买家可在交付后
              48 小时内提出材料质量投诉，允许部分退货，开票重量偏差超过 +/-0.5% 时允许复磅。同时，正式退货政策并不具备消费者意义上的买方友好：公司不把“不再需要”视为有效退货理由，服务数量可有 +/-10%
              波动，复磅费用不退。


              更宽的合规层可见但不完整。隐私政策显示，平台收集 KYC 文件、GST 注册、联系方式、浏览数据以及订单或交易通信；涉及融资时，付款还会通过第三方网关和放款人信息流。产品质量叙事在材料侧强于网络安全披露：One
              Helix 自有品牌页面强调可追溯性、证书和制造容差，TMT 活动明确突出 BIS
              认证。但本轮没有发现公开可用性承诺、外部状态工具或具名安全认证。这不能证明控制不存在；只能说明公开信任表面在材料质量保证上，比在软件保证上更深。
