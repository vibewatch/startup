      - number: '4.3'
        title: 资本充足性与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开资本充足性证据在资金用途上最强，在实际流动性上最弱。2025 年融资序列足够清楚：JSW One 以独角兽估值募集 ₹340 crore，随后以约 ₹8,575 crore 估值完成更大的 ₹575
              crore 轮，管理层把新资金绑定到技术、物流和分销整合、服务网络扩张、自有品牌以及 NBFC 资本化。媒体和管理层也持续把下一段融资与盈亏平衡和最终公开市场准备相连，而 2026 年 6 月报道又引入一个可能的
              ₹650-700 crore IPO 前融资，以及 $350-400 million 上市计划。这本身不是困境信号，但说明公司仍预期资本市场执行很重要。


              真正缺失的是偿付能力数学。没有留存公开来源披露账上现金、非限制性流动性、资金续航期、毛利率、贡献利润率、CAC、回本期、留存、信贷损失或逾期分桶。开放数据镜像无法解决问题：Tofler
              暴露资本结构，但不给足以投资判断的利润表，其可见 FY25 收入区间还与独立融资报道引用的 ₹3,976 crore 冲突。InstaFinancials 显示 FY25
              申报已存在并标出最新资产负债表日期，但仍把经审计报表放在文档订购流程之后。因此，公司公开资料支持正向牵引力案例和合理融资策略，但不能支撑完整的利润率路径或自筹资金耐久性判断。
