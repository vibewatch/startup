      - number: '6.3'
        title: 留存韧性、满意度代理指标与复购行为
        blocks:
          - type: paragraph
            body: >-
              粘性证据有，但只停留在代理层。公开留存数据里最有力的一条，是 Moneycontrol 称 70% 以上业务来自复购。这很重要，因为在这个品类里，买家过去靠账期和中间商来防范劣质材料和交付不确定性；JSW One
              能赢得复购，说明它正在切入再下单环节。同一篇文章还称，这种忠诚度在信贷大范围铺开之前就已经形成，指向信任、透明度和采购可预期性也是价值主张的一部分。官方客户证言也指向同一方向：客户提到已经下单「一段时间」、材料按承诺送达、售后响应及时。这些都不能证明
              NRR、GRR 或流失率，但足以支撑一个定性的粘性判断。


              满意度证据不一，但仍然可用。本次运行日期，Apple App Store 页面显示 42 个评分、均分 4.5，对数字入口是方向性利好；AppBrain 则显示累计下载约 38,000 次、2026 年 6
              月仍有近期更新，但其镜像页面没有评分。这些信号说明应用确实在分发、产品仍在维护，同时也提醒不要过度解读小样本公开评论。最大的缺口是，留存来源没有披露活跃应用用户、下单频次、账户级留存、合同期限或收入留存指标。因此正确读法不是「留存已被证明」，而是「复购和满意度有鼓励性的公开代理指标，但持久经济性层仍未披露」。
