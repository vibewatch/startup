        title: 营运资金循环与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开可见最强的单位经济信号不是毛利率，而是信贷强度。Mint 称超过三分之一订单使用信贷，并把它对应到每月约 ₹475-500 crore、60-90 天库存融资；2026 年 6 月 ET 访谈称约 40%
              GMV 走信贷，每月通过第三方放款人放款约 ₹500 crore。这与官方 FY25 ₹3,800 crore 信贷撮合数字一致，也说明分析这门业务不能只看一张收入 GMV 曲线。即便当时自有 NBFC
              贷款账簿或 AUM 只有约 ₹100 crore，伙伴出资的信贷轨道已大得多，暗示外部放款人胃口仍是转化漏斗的核心依赖。


              公开代理指标也显示，履约引擎对经济性很重要。ET 称 JSW One 已建设 13 个钢材加工中心和一个运输部门，后续融资报道提到 14 个库存点和约 7
              个合同制造地点。这一足迹支持一种判断：收入确认很可能不只是软件费，因为产品加工、品牌材料和物流协调似乎都嵌在报价里。公开代理数字因此两面切：增长强劲，估算 FY24 到 FY25 收入增长约
              179.6%，按当前月度 GMV 折算高于 FY25 平均；但同一数据也显示这是一个营运资金很重的模式，没有信贷损失、利差和履约毛利数据，经济性无法干净判断。
