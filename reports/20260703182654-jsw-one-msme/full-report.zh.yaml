  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 信贷绑定的需求依赖
        - 融资 GMV 或订单占比，与贷款方审批对照
        - 审批率恶化、贷款方退出，或放款未达到所称 500 crore 规模路径
        - 暂停激进承销假设；提高信心前，要求提供贷款方级集中度和账龄损失数据。
      - - 平台中立性冲突
        - 供应商结构和关联方占比披露
        - IPO 申报前，管理层无法量化非 JSW GMV、供应商集中度或冲突管理控制
        - 把中立性视作投资逻辑风险，而不是披露瑕疵；要求正式治理证据。
      - - 履约整合失败
        - OTIF、短缺索赔、退货周期和投诉结案
        - 新节点、库存点或运输铺开中出现重大滑坡
        - 下调复购和利润率假设，直到节点级可靠性数据得到验证。
      - - Pre-IPO 披露缺口
        - DRHP 质量和配套审计披露
        - 招股书时点提前，但关联方、信贷质量和集中度披露仍不清晰
        - 不要只靠管理层叙事押注公开市场估值倍数扩张。
      - - 母集团争议外溢
        - JSW Steel 出现新的不利裁定、事件升级或更广泛的融资方审查
        - 案件恶化，或广泛投资者质疑把 JSW One 拉入母公司治理尽调
        - 提高折现率，并要求与母公司法律和 ESG 问题明确隔离。
      - - 数字贷款合规失手
        - 符合 RBI 要求的 LSP、申诉、KFS、DLG 和 DLA 流程控制证据
        - 公开信贷流程与监管要求的控制之间出现缺口
        - 合规映射补齐前，将信贷增长目标视为不可承销。
    notes: 每个否决标准都锚定可监测的公开或尽调数据点，而非泛泛的谨慎表述。
