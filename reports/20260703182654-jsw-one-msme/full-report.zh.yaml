  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式评分显示，市场和规模证据较强，经济性披露和当前价格可见度弱得多。
    data:
      items:
        - label: 市场顺风
          score: 8
          note: MSME 数字化和采购正规化仍是真实且有证据支撑的利好。
        - label: 规模证明
          score: 8
          note: GMV、注册用户和赞助方支持的融资显示出实在的运营体量。
        - label: 经济性披露
          score: 3
          note: 公开来源仍未披露经审计利润率、现金或完整估值条款。
        - label: 信贷依赖
          score: 4
          note: 约 40% GMV 被描述为与信贷挂钩，因此承销质量分量很重。
        - label: 同行相对支撑
          score: 5
          note: 同行验证品类规模，但部分同行披露更强经济性，或显示降估值风险。
        - label: 当前价格可见度
          score: 3
          note: 最后一个干净估值标记已公开，但后续上调定价没有公开。
        - label: 退出准备度
          score: 5
          note: IPO 准备表述可见，但公开记录仍处 DRHP 前阶段。
        - label: 证据质量
          score: 4
          note: 证据足以支撑尽调，但不足以支撑盲目 pre-IPO 确信。
    approximationNotes: 评分是基于留存证据集作出的投委会式序数判断，不是公司披露的 KPI。
    claimRefs:
