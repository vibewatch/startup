      - number: '7.4'
        title: 缓释姿态、剩余敞口与否决标准
        blocks:
          - type: paragraph
            body: >-
              缓释逻辑并非空白。JSW One 确实有明确政策、战略资金、不断扩大的贷款人名单，以及足以吸引严肃交易对手的规模。但剩余敞口仍然重要，因为几个最影响投资判断的数据点还不在公开记录里。IPO
              路径仍处在招股书前；公开披露仍依赖管理层访谈、新闻稿和交易说明，而不是经审计的风险因素文字。嵌入式金融在战略上很重要，但公开来源不披露贷款人集中度、审批漏斗、逾期或损失率。运营上，公开来源展示了工作流功能和支持路径，却没有
              OTIF、退款周期、投诉率或事故指标。所有权层面，母集团整合是明确的，但公开披露没有足够细地展示供应商结构、非 JSW GMV
              占比或关联方敞口，无法消除中立性担忧。因此，纪律严明的投资者应把否决标准设计成可监控项：如果信贷相关订单流走弱，履约可靠性下滑，IPO
              节奏加快而披露停滞，或母集团争议扩大，投资假设就应迅速收紧，而不是假定品牌实力能吸收冲击。
