  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 现有证据
      - 会改变判断的因素
    rows:
      - - 投资逻辑：JSW One 在工业采购中已有真实规模。
        - 官方来源显示，平台 FY25 GMV 达 ₹12,567 crore，注册 MSME 超 84,000 家，信贷约 ₹3,800 crore，钢材约 2 million tonnes。
        - 若审计数据表明 GMV 向高质量收益的转化弱得多，规模论点会被削弱。
      - - 投资逻辑：赞助方和贷款方参与释放可信的市场准入信号。
        - 公司披露 2025 年 10 月 ₹575 crore 延伸轮，引入 SBI，加入已有 JSW Steel 和 Principal 支持的财团。
        - 如果新资金必须接受异常保护性条款，表面信号会显著变弱。
      - - 投资逻辑：IPO 准备已不再只是理论选项。
        - Outlook、StartupTalky、ET 和 SCC 风格法律报道均指向私募轮、投行接触或最终上市工作流。
        - 若申报节奏或治理准备明显滑坡，准备度论点会变弱。
      - - 反向逻辑：最后一个干净价格仍是 2025 年 5 月独角兽轮。
        - 公开来源讨论了后续融资金额，但没有披露 2025–2026 年进入时的实时投后估值或优先股堆叠。
        - 若披露上行轮或 DRHP 级资本结构，这一担忧会消除。
      - - 反向逻辑：同行目前披露的经济性比 JSW One 更多。
        - OfBusiness 和 Infra.Market 公开呈现的盈利能力或 EBITDA 信息都强于 JSW One 当前披露。
        - JSW One 若给出同等披露，估值区间会收窄，信心会提升。
      - - 反向逻辑：行业估值下修是现实风险，不是假设题。
        - Udaan 2026 年平轮和此前估值重置显示，B2B 商贸情绪压缩可以很快发生。
        - 同行倍数扩张，或 JSW One 更干净的盈利证明，可以抵消这股压力。
    notes: 反向逻辑针对估值，而非否定公司。它指出，公开记录仍未充分解释价格、条款和经济性。
