  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 公开指标
      - 为何破坏投资逻辑
      - 行动含义
    rows:
      - - 2026 轮只有在重保护条款下才高于 2025 锚点
        - 融资文件显示强优先权、反稀释或治理不对称
        - 名义估值会夸大普通股价值，并压缩新投资者上行空间。
        - 将上调视作估值重置风险，而非简单上行轮。
      - - 盈亏平衡叙事明显滑坡
        - 下一次融资事件前，没有 FY26 盈亏平衡或利润率改善的清晰证据
        - 乐观情景依赖经济性追上规模。
        - 转为仅跟踪，或等待审计证明。
      - - 信贷驱动 GMV 转弱或贷款方胃口收紧
        - 融资订单转化或贷款方支持低于管理层口径
        - 信贷重的模型一旦资金收紧，增长和估值支撑会很快丢失。
        - 提高下行折价，并重新审视商业模式韧性论点。
      - - IPO 时间表延后，但私募价格预期仍高
        - Pre-IPO 表述仍在，但申报或投行里程碑滑坡
        - 流动性路径延后会增加持有风险，并提高平轮或保护性融资的概率。
        - 要求更低进入价，或推迟承诺。
      - - 关联方或集中度披露不及预期
        - 大量交易量或盈利依赖 JSW 集团渠道或狭窄客户群
        - 市场可能把公司定价为独立性更弱、可复制性低于主叙事所暗示。
        - 升级治理审查，并收紧估值假设。
    notes: 这些触发因素聚焦估值传导，而非泛泛的经营风险。每一项都可能改变私募投资者实际持有或退出进入的资产。
