        - label: 金融能力趋同
          score: 8
          note: 多数有意义的同业和替代品也提供信贷或融资支持。
        - label: 价格透明度
          score: 4
          note: 只有 Amazon Business 和 Metalbook 提供强公开价格信号；多数同业仍由报价驱动。
        - label: 公共采购绕开风险
