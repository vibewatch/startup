            body: 公开资料里最强的证据不只是融资规模。官方材料和访谈反复描述一个运营栈，把材料采购、嵌入式信贷、履约和售后支持合在一起。放款人网络、NBFC 建设，以及客户关于交付可靠性和质量的证言，都进一步强化了这一点。
