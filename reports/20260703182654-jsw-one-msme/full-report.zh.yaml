        - 已讨论 IPO 准备度和迁回印度注册地；母公司增资 $12.3 million
        - FY23 收入 ₹4,664.7 crore；FY23 净亏损 ₹196 crore
        - 对采购加金融规模、但亏损仍可见的模式有参考意义。
        - 获取到的来源是可信度较低的摘要，而非申报文件或投行文件。
      - - Zetwerk
        - 计划以约 $5 billion 估值 IPO，募资 $400-500 million；上一轮 $3 billion
        - FY24 收入 ₹14,436 crore
        - 展示制造科技公司激进 IPO 定位可能长什么样。
        - 目标估值是媒体报道的意向，不是已完成的新标记。
      - - Infra.Market
        - Pre-IPO 融资 ₹730 crore，估值约 ₹24,600 crore / $2.8 billion；₹5,000 crore IPO 路线
        - FY25 收入约 ₹18,000-18,472 crore；EBITDA 约 ₹1,500 crore
        - 最接近的已披露建材基准，且有公开盈利能力表述。
        - 产品组合和零售触点更广，比 JSW One 更多元。
      - - Udaan
        - 2026 年以 $1.8 billion 平轮融资，此前估值从 $3.2 billion 峰值降至 $1.3 billion
        - FY25 收入 ₹4,561 crore；FY25 净亏损 ₹1,055 crore
        - 最好的反向信号：当 B2B 增长与盈利能力背离时会发生什么。
        - 品类组合偏 FMCG 和日用必需品，而不是重材料。
      - - Amazon Business India
        - 未披露印度估值；仅作为替代压力参照
        - 声称 2025 年客户价值 >₹2,000 crore、五年销售 CAGR >40%，且 MSME 触达 >80%
        - 展示数字化采购和价格透明度如何压缩平台溢价。
        - 不是直接可比的重材料公司，也不是私募轮可比样本。
    notes: 可比组有意混合：直接同行用于估值锚定，反向 B2B 案例用于下行参照，替代采购通道用于倍数压缩压力。
