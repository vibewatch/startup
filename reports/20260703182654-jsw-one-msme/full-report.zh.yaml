chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、时间线与运营模式
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME 应被视为更大 JSW One Platforms 架构内的 B2B 市场运营品牌。公开资料可用，但前提是把时间线拆清楚。Tofler 和 Tracxn 等法律实体来源把 JSW One
              Platforms Limited 的设立锚定在 2018 年 9 月，注册办公室信号指向 Mumbai 的 Kalina。商业化推出更晚：多份 2023-2025 年商业报道称 JSW Group 在 2021
              年推出 JSW One，其中 2021 年 7 月是最清晰的入市参考。Inc42 又给出第三个信号，把 2020 年列为档案创立年份；这个更适合当作数据库标签，而不是唯一标准日期。


              商业模式上，JSW 官方页面口径一致。JSW One 不只是目录或线索生成网站；它被呈现为技术优先的采购层，为制造和建筑 MSME
              组合材料供应、融资、物流、履约和自有品牌分销。这个市场品牌聚焦钢材和其他建材，更大的平台还包括 JSW One
              Homes。面向买家的公开页面补充了实操细节：系统宣传订单跟踪、财务对账、退货处理和售后支持。合起来，这些披露支持第 1 章的结论：JSW One MSME 是集团面向 MSME 的工业商业运营层，总部在
              Mumbai，设计目标是把信贷和履约直接嵌入采购。
