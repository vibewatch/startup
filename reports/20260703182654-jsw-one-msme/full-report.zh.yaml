      - number: '1.2'
        title: 领导层、治理与关键人集中度
        blocks:
          - type: paragraph
            body: >-
              领导层资料足以识别谁在运营业务，但不足以精准画出控制权。Gaurav Sachdeva 是公开资料里最清晰的经营高管。The Economic Times 2022 年报道他获任
              CEO，后续官方和媒体来源又一致把他的头衔上调为联席董事总经理兼 CEO。Parth Jindal 对外部叙事同样重要，即便他不是日常运营者：他以董事长或董事身份反复出现在融资、战略定位和 MSME
              使命表述中，是 JSW 生态内这项业务的主要赞助人和公众面孔。


              2024 年 Ranjan Pai 加入担任独立董事，治理可见度改善；这一步被明确绑定更强治理和 IPO 准备。Tofler 和 Tracxn 也呈现一组可见董事和高管，包括 Nilesh
              Narwekar、Vinay Shroff 和 Geeta Mathur，但公开资料仍没有完整董事会地图。委员会结构、投票安排、投资人权利或接班规划都缺少详细披露。对尽调而言，第 1
              章可以稳妥确立具名管理团队和治理强化这一事实，同时仍把董事会控制、股权结构影响力和关键人依赖视为待解问题，而不是既定事实。
