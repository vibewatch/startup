  - id: TM004
    title: 增长驱动因素与约束因素表
    columns:
      - 驱动因素 / 约束因素
      - 方向
      - 时点
      - 对 JSW One MSME 的含义
      - 尽调问题
    rows:
      - - 政府基建和住房支出
        - 驱动因素
        - 当前至 FY27+
        - 正好支撑平台销售品类的水泥和钢材吞吐。
        - GMV 增长中，有多少来自公共基建相关需求，又有多少来自私人资本开支？
      - - 钢铁和水泥产能扩张
        - 驱动因素
        - 2026-2030
        - 供给扩张能支撑可得性、价格纪律和品类宽度。
        - 新增产能最利好哪些子品类？哪些地方产能过剩会挤压利润率？
      - - TReDS、GeM、ONDC 和公共市场准入通道
        - 驱动因素
        - 当前且政策延续
        - 围绕 MSME 的采购融资和数字发现，公共通道把数字工作流常态化。
        - 私营市场采用中，有多少其实搭在这些公共通道上？
      - - 嵌入式金融需求
        - 驱动因素
        - 当前且结构性
        - 信贷缺口大，带信贷的采购就是真正的产品切入点，不是小插件。
        - 没有合作伙伴或自有融资时，多少复购订单无法成交？
      - - 传统渠道行为和独立渗透率数据薄弱
        - 约束因素
        - 当前
        - 多数 MSME 仍靠传统关系采购，品类增长看起来可能快过真实数字化转化。
        - 要求提供按客群和产品线拆分的第三方在线订单占比调研数据。
      - - 延期付款和应收账款摩擦
        - 约束因素
        - 当前
        - 即使获客成功，营运资金摩擦也会卡住复购频次。
        - 平均付款周期、逾期账龄批次和贷款方回收假设分别是多少？
      - - 基础设施、物流和熟练劳动力瓶颈
        - 约束因素
        - 当前
        - 道路差、仓储弱、劳动力质量和执行能力不足，会压低头部集群之外的服务质量。
        - 按产品和地区看，履约失败或劳动力短缺在哪里最明显？
      - - 建筑放缓和钢价压力
        - 约束因素
        - 周期性
        - 宏观走弱可以与长期市场空间并存，但会带来采用率和利润率的短期波动。
        - 钢价下跌或项目放缓时，订单频次和平台抽成率的弹性有多大？
    notes: 最强的增长叙事是采购 + 金融；公开证据最弱的地方是真实私营市场数字渗透率和单位经济。
