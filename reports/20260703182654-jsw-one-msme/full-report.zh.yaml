      - number: '7.3'
        title: 运营、质量与信贷依赖
        blocks:
          - type: paragraph
            body: >-
              从运营看，JSW One 的模型把复杂度塞进了客户承诺的中枢。公司和应用材料承诺可靠采购、经验证物流、交付追踪、文件和一体化金融；管理层访谈则描述了 13 个加工中心、14 个库存点、7 个合同制造站点、一个
              JIT 网络和全资运输主体。与此同时，站在买方视角，退货和支持制度相对紧：质量投诉通常需要在 48
              小时内提出，公司允许订单数量存在偏差，卖方验证和逆向物流又不在完全自有的服务闭环里。嵌入式金融拉出第二条依赖链。按一个公开估算，超过三分之一订单，或约 40% GMV，使用 60–90
              天资金，资金大多由合作贷款人承销，而不是 JSW One 自己承销。也就是说，服务摩擦、贷款人收缩或回款恶化会直接压低转化、复购和单位经济性，而不是只表现为可隔离的后台问题。
