  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接材料同行、相邻玩家、替代品与现状
        blocks:
          - type: paragraph
            body: >-
              JSW One
              周边竞争集比简单钢材市场平台同行更宽。最接近的直接同行，是明确销售或赋能钢材、金属或建材采购，并带有一定信贷或物流支持的平台：OfBusiness、Infra.Market、Metalbook，以及规模更小的专业平台
              SteelBazaar。Moglix 重要，但本次留存证据更偏向企业采购软件、MRO、供应商管理和跨行业供应链融资，而不是重材料优先的购买任务。Zetwerk
              又更相邻：它通过合同制造和工业建设项目竞争制造与采购钱包份额，而不是靠商品主导的市场平台深度。替代品侧，Udaan 和 Amazon Business 仍可拿走采购份额，因为许多 MSME
              不只买钢材或水泥；即便平台不专注材料，它们也看重目录宽度、营运资金支持、GST 合规和可靠交付。GeM 是最强的现状或公共采购替代方案，因为它已经具备全国规模，并通过 ISA 明确导入钢铁行业。
