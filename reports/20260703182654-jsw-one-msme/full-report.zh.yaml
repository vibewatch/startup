      - number: '8.3'
        title: 牛市、基准与熊市估值区间
        blocks:
          - type: paragraph
            body: >-
              由于当前 IPO
              前价格未披露，情景框架应锚定最后一个完整披露的估值标记，而不是新的绝对头条数字。牛市情形并非不可能。它需要三件事一起发生：第一，管理层关于盈亏平衡的表述必须有证据支撑，而不是被反复转述；第二，信贷占比高的 GMV
              模型必须展示可接受的损失表现和贷款人韧性；第三，下一轮融资或 IPO 工作流不能带着偏重优先权的结构悄悄把价值从新投资者转给既有内部人。如果这些条件满足，高于 2025 年 5
              月独角兽锚点的溢价可以成立，因为公司确实有运营体量，也有可信的工业切入口。


              基准情形更窄。今天的公开证据支持的是兴趣延续，而不是干净重估。最后披露的估值标记仍有用，但后续延伸轮和 2026 年私募轮讨论没有披露投后条款；最强的同行比较证据也显示，投资者奖励已披露盈利能力，胜过奖励原始
              GMV 野心。熊市情形同样清晰：如果 IPO 节奏滑后、Udaan 式行业降估值持续，或后续资本靠更强保护条款成交，合理承销价就可能低于 2025
              年锚点。因此，立场必须对价格敏感。公司可能不错，但入场判断仍被证据质量卡住。
