        - 管理层数据室，加上律师对已签文件的确认。
        - 未公开
      - - 经审计 FY25 和 YTD FY26 财务
        - 收入桥、毛利率、EBITDA、现金、营运资本和资产负债表细节
        - 没有盈利质量证据，规模本身不足以支撑加价。
        - 审计报表、管理账目和预算包。
        - 未公开
      - - 信贷队列和贷款方经济性
        - 贷款方集中度、审批率、DPD 桶、损失和已实现利差
        - 管理层口径中约 40% GMV 绑定信贷，隐藏压力可能重置估值。
        - NBFC 和合作贷款方 MIS，加上队列账龄表。
        - 未公开
      - - 客户和关联方集中度
        - 来自 JSW 相关渠道、头部客户和复购队列的 GMV 占比
        - 客群狭窄或关联方权重过高，会削弱独立性和退出质量论点。
        - 销售分析、客户队列材料和关联方明细表。
        - 未公开
      - - IPO 准备工作流
        - 投行委任、治理委员会搭建、时间表草案和风险因素起草状态
        - 上市准备的时点和严肃度会影响私募市场价格支撑。
        - 董事会会议纪要、投行函件和律师工作计划。
        - 只有部分公开叙事
      - - 更新后的 2026 融资材料
        - 资金用途、估值基准逻辑，以及市场窗口关闭时的下行计划
        - 投资者需要知道，公司是在机会型融资，还是因为该模式仍需要资本。
        - 当前融资材料，加上不依赖 IPO 募资的下行情景。
        - 未公开
    notes: 这些是把今天的主叙事转化为可投资 Pre-IPO 决策所需的最低要求，不是可有可无的修饰项。
    claimRefs:
      - CV026
      - CV027
