        - 融资 ₹340 crore，估值 $1 billion / 约 ₹8,500 crore
        - FY25 GMV ₹12,567 crore；84,000+ 注册 MSME；约 ₹3,800 crore 信贷；约 2 million tonnes 钢材
        - 当前承销最相关的已披露进入点。
        - 2025–2026 年后续条款和实时投后价格未公开。
      - - OfBusiness
        - IPO 前转为公众公司；据报道估值 $5 billion
        - FY24 收入 ₹19,296 crore；FY24 利润 ₹603 crore
        - 组内披露最充分的盈利型采购同行。
