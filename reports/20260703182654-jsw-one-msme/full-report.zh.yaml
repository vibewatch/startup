      - CR039
      - CR040
      - CR043
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论不是源于公司逻辑破裂，而是由真实规模和融资支持，推到条款清单与披露瓶颈。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: FY25 GMV、用户增长、信贷规模和钢材吞吐表明，平台已成为有分量的工业渠道。
        - id: capital
          label: 资本支持
          detail: 公司公开完成独角兽轮，并由 SBI 和既有支持方参与规模更大的延伸轮。
        - id: disclosure
          label: 披露缺口
          detail: 后续轮次投后价格、优先权条款和经审计的单位经济性仍未进入公开记录。
        - id: sector
          label: 行业降估值信号
          detail: Udaan 以及更广泛的 B2B 评论显示，单靠规模守不住溢价估值。
        - id: discipline
          label: 价格纪律
          detail: 在新证据出现前，把 2025 年 5 月独角兽轮视为最后一个干净的公开锚点。
        - id: recommendation
          label: 继续研究 / 跟踪
          detail: 继续尽调，但没有更强证明和更清晰条款前，不支付新的 2026 年溢价。
      edges:
        - from: scale
          to: discipline
          label: 支撑兴趣
        - from: capital
          to: discipline
          label: 验证需求
        - from: disclosure
          to: recommendation
          label: 限制确信度
        - from: sector
          to: recommendation
          label: 抬高折现率
        - from: discipline
          to: recommendation
          label: 设定入场规则
    approximationNotes: 该流程是定性的：公开记录对运营里程碑支持较强，但当前股权条款和经审计盈利能力仍不完整。
