      - number: '1.4'
        title: 规模、里程碑、客户证明与风险信号
        blocks:
          - type: paragraph
            body: >-
              JSW One 2025 年披露清楚说明公司不再是早期试验。官方新闻稿称 FY25 GMV 达 Rs 12,567 crore，注册用户超过 84,000 家 MSME，通过银行和 NBFC 伙伴发放的信贷约
              Rs 3,800 crore，平台促成约 2 million tonnes 钢材采购。Entrepreneur 和 Economic Times 补充 FY25 收入 Rs 3,976 crore，访谈描述 14
              个库存点、约 7 个合同制造地点，以及覆盖 ICICI Bank、IndusInd Bank、Yes Bank、Axis Bank、Standard Chartered、Tata Capital 或
              TCL、Kotak Mahindra、IDBI、Mizuho 和 JSW One Finance 的放款人网络。面向客户的证据较温和但仍有用：JSW
              微站展示具名客户证言，强调质量、有竞争力价格、交付可靠性和售后支持。


              同一组来源也解释了为何第 1 章不能过度自信。管理层没有干净披露员工数，外部数据库在 424 和 915 名之间差异明显。盈利也尚未确立：ET 援引 Tracxn 称 FY24
              净亏损在收入扩张时大幅扩大，管理层仍把盈亏平衡描述为近期目标，而不是已经完成的事实。其他集团支持的 B2B 材料平台准备自己的规模和 IPO 叙事，竞争正在加剧。因此第 1 章的正确读法不是业务缺少验证；而是
              JSW One 现在有可信的规模和融资验证，但仍带着披露缺口和经营风险信号，这些信号典型地出现在一家快速增长、融资权重加大、迈向 IPO 前阶段的私营市场平台身上。
