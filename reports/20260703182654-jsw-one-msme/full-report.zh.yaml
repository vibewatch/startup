      - number: '8.4'
        title: 入场纪律、论点破裂触发器与尽调问题
        blocks:
          - type: paragraph
            body: >-
              实际投资结论很直接：JSW One 值得继续尽调，但不值得在未披露的 2026 年加价上盲目承销。价格纪律应从本章最简单的规则开始：把 2025 年 5
              月独角兽轮视为最后一个干净公开锚点，并假设之后每一次估值台阶都必须靠新增披露赚取溢价，而不是只靠动能。最重要的问题并不表面化。投资者需要经审计的 FY25 和 FY26
              数字、当前股权结构表、显示优先权和反稀释机制的轮次文件、解释信贷引擎是在增强还是只是在补贴 GMV
              的贷款人分群数据，以及有注册记录支撑的最新资产负债表申报状态。没有这些材料，公司最强的公开信号仍只是规模、母公司支持和市场定位，而不是可投资透明度。


              同一组尽调问题也会转化为论点破裂触发器。如果一轮融资只能靠厚重投资者保护成交，即便公司运营仍强，也会挑战头条价格。IPO
              节奏明显延后、盈亏平衡证据薄弱，或融资订单质量恶化，都会产生同样效果。反过来，如果管理层把当前准备叙事转化为 DRHP
              级披露，并证明增长、信贷和盈利能力正在收敛而不是背离，建议可以上调。在那之前，正确立场不是回避，但也不是买入；而是继续研究 / 跟踪，对任何新的 2026 年加价保持拉伸看法，并把尽调重点放在头条背后的条款上。
