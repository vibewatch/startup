      - number: '2.4'
        title: 增长驱动、数字轨道与仍拖慢采用的约束
        blocks:
          - type: paragraph
            body: >-
              需求背景有利。钢铁和水泥产能继续扩张，公共基础设施和住房支出保持高位，预算也明确试图通过 TReDS 和 GeM 联动提升采购相关融资的流动性。IBEF
              水泥和钢铁更新都描述了多年产能新增和政策支持的消费增长，MSME 相关来源则显示政府推动更多企业走向正规化和数字化市场准入。对 JSW One 而言，这才是真正的牛市情景：大品类、政策支持 MSME
              数字化，以及足够严重的融资问题，足以让嵌入式信贷成为产品功能，而不是利润率附件。


              但留存来源也说明，采用不应建模成无摩擦。SIDBI 仍看到约 ₹30 lakh crore 信贷缺口，数字借贷调查渗透率只有 18%，约 70% 的 MSME
              仍使用传统营销模式。其调查还标出基础设施、物流和技能瓶颈，这些行业与 JSW One 的品类暴露直接相邻。Ministry 自己的 Samadhaan
              框架之所以存在，是因为延期付款仍是系统性问题。独立媒体补充了周期性提醒：即便长期需求健康，建筑也可能放缓；品类观察者仍把民营建材电商称为早期。这个组合支持一个清晰估值结论：JSW One
              有真实市场切口，但数字份额获取速度和信贷经济性仍是故事中最缺证明的部分。
