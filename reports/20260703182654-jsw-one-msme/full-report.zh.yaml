      - number: '7.2'
        title: 监管、法律与治理阴影
        blocks:
          - type: paragraph
            body: >-
              最清晰的非经营风险是，JSW One 不是一个孤立的创业品牌：它公开绑定 JSW Group 的制造实力，由 JSW Steel 出资，并在同一个母集团生态里营销。这很关键，因为 2026
              年公开来源记录了母集团层面仍在发酵的人权、环境、反垄断、破产和能源监管争议。Business & Human Rights 和 FORUM-ASIA 都描述了 Odisha 项目受到 UN
              审视、贷款人投诉，并在此前 NGT 暂停后获得新许可。ET CFO 转载的 Reuters 报道称，CCI 调查发现 JSW Steel 等公司违反反垄断法。ET LegalWorld 称 Bhushan
              Power 事项仍在 Supreme Court 审理，Mondaq 则描述了另一起 Bombay High Court 监管争议。这些事项都没有让 JSW One
              成为直接被告，但这个市场平台在品牌、供给和资本上都明确连接母公司。公司正试图走向公开市场审视时，这会制造声誉、交易对手和治理外溢风险。
