    layout: standard
    summary: 区间锚定 2025 年 5 月披露估值标记，因为后续定价事件虽被公开讨论，但没有清晰披露。
    approximationNotes: 区间是分析师估计，以 2025 年 5 月披露估值锚点的倍数表示；这不是管理层指引，也不包含隐藏优先权影响。
    data:
