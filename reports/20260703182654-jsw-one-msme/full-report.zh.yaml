      - number: '2.2'
        title: 测算视角：需求池巨大，但没有干净的公开 JSW-One 专属 TAM
        blocks:
          - type: paragraph
            body: >-
              公开证据让市场之大显而易见，但模型并不干净。最宽口径下，官方和准官方来源把印度 MSME 总数放在 7.34 crore 到 7.86 crore 家企业之间，取决于来源统计的是估算企业存量还是
              Udyam/UAP 注册单位。这些来源也一致认为 MSME 对经济非常重要：约占 GDP 31.1%、出口 48.5% 左右、制造业产出的三分之一以上。这给了可信的自上而下企业背景，但本身并不定义 JSW One
              的采购市场。


              更有决策价值的公开视角是材料需求代理指标。IBEF 钢材数据显示，在 FY25 150.23 MT 后，FY26 截至 2 月成品钢消费接近 148 MT；水泥数据显示 FY26 截至 2 月产量为 443.2
              MMT，全年预期约 490 MT。这些就是 JSW One 试图居中撮合的流量。独立媒体补充了一个更宽但较弱的框架：Business Standard 引用 $400 billion 可服务 B2B
              品类，但该视角太宽，不能作为尽调级 SAM。最强的自下而上证据仍是公司自己披露的经营切入点：FY25 GMV ₹12,567 crore，钢材吞吐约 2.0-2.4
              MT。这个规模有意义，但相对于全国钢材需求仍暗示低个位数渗透率，因而在已观察足迹和真实可服务市场之间留下了充足空间。
