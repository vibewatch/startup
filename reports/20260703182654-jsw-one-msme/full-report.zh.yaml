  - id: FM004
    title: 采用漏斗 / 价值链地图
    type: flow
    layout: standard
    summary: 展示从碎片化采购痛点，到信贷支持复购的实际采用路径。
    data:
      nodes:
        - id: pain
          label: 采购痛点
          detail: 买家面对供应碎片化、质量不透明、交付可预测性弱，或延期付款压力。
        - id: catalog
          label: 发现 + 定价
          detail: 买家在数字流程里比较目录选项、价格和订单条款。
        - id: processing
          label: 定制 / 锁单
          detail: 需要时，平台协调按规格加工、库存点可得性和合同制造供应。
        - id: credit
          label: 信贷决策
          detail: 合作伙伴或自有金融为订单承保库存融资或营运资金支持。
        - id: delivery
          label: 履约 + 最后一公里
          detail: 加工中心、运输服务和产业集群配送把订单送到工地或工厂。
        - id: repeat
          label: 重复采购
          detail: 可靠交付叠加金融和对账，提高复购和钱包份额扩大的概率。
      edges:
        - from: pain
