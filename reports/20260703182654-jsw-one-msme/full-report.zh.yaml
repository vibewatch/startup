  - id: FP002
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: JSW 面对拥挤的直接同业、高度趋同的金融能力，以及薄弱的公开客户锁定证据；最强替代压力来自 Amazon Business 和 GeM，而不是某一家创业公司克隆体。
