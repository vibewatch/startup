      - number: '1.3'
        title: 资本基础、估值路径与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              融资时间线是公开资料中较强的一块。第一个清晰机构锚点是 2023 年 4 月 Mitsui 轮：多方来源一致指向 Rs 205 crore、估值约 Rs 2,750
              crore，资金用途包括地域扩张、物流、信贷和技术。两年后，JSW One 明显提速。2025 年 5 月，公司从 Principal Asset Management、OneUp 和 JSW Steel
              参与方募集 Rs 340 crore；公司和媒体材料都把这轮视为业务以 $1 billion 估值进入独角兽俱乐部。


              故事没有停在这里。2025 年 10 月扩展轮把总轮次抬到 Rs 575 crore，并引入 State Bank of India，以及 Principal Asset
              Management、One-Up、International Conveyors、Scarlett Ventures 和 JSW
              Steel。该轮具有战略意义，因为它强化了公司转向商业加金融一体化命题：管理层明确表示，新资本会加深自有技术、物流、风控和 NBFC 业务。Mint 还报道累计股权融资 Rs 1,120
              crore，提供了另一个有用锚点。仍披露不足的是完整股权结构和控制图。公开来源列出了主要利益相关方和估值节点，但没有完整披露持股比例、优先权利，或最近一轮资本中有多少是一级发行、多少是二级交易。
