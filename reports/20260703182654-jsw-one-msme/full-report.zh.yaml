  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、融资背景与价格锚
        blocks:
          - type: paragraph
            body: >-
              JSW One 已经跨过门槛，估值可以不再只按故事股讨论。公司自己披露了 2025 年 5 月 ₹340 crore 融资，使其进入独角兽行列；随后又在 2025 年 10 月追加 ₹575 crore，引入
              SBI，并重申物流、技术和 NBFC 子公司的战略。公开运营证据也支持它不是一个很小的采购工具：管理层和多次报道把平台与 FY25 GMV ₹12,567 crore、84,000 多个注册 MSME、约
              ₹3,800 crore 信贷发放、约 200 万吨钢材流转联系在一起。这些都是实打实的规模标记，足以让 JSW One 留在投资漏斗里。


              估值问题不在于公司是否真实，而在于当前投资者能否看清实时价格和实时保护条款。最后一个干净的公开估值锚，仍是 2025 年 5 月的独角兽轮；VCCircle 将其换算为约 ₹8,500
              crore。公开来源随后描述了更大的已批准资本池、₹575 crore 延伸轮，以及 2026 年关于 ₹650–700 crore IPO 前私募轮和 $350–400 million IPO
              的讨论。但这些来源没有披露当前投后估值、清算优先权、反稀释保护，或后续资本附带的治理权。缺失的条款层，正是本章建议停留在继续研究 / 跟踪，而不是盲目按 2026 年估值台阶买入的原因。
