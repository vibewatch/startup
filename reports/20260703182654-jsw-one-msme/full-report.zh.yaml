  - id: TP005
    title: 护城河持久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁来源
      - 严重性
      - 威胁为何可信
      - 缓释措施或尽调要求
    rows:
      - - 材料专注度保护 JSW
        - OfBusiness、Infra.Market、Metalbook 和 SteelBazaar 已在营销中强调钢材或建材深度
        - 高
        - 直接同业已经垂直对齐同一个买家任务，单靠品类聚焦并不稀缺
        - 索取输赢案例，说明买家为何选择 JSW 而非 OfBusiness 和 Infra.Market
      - - 嵌入式金融形成锁定
        - JSW、Oxyzo、Moglix、Udaan、Amazon Business、Metalbook 都在宣传金融，GeM 也计划上线
        - 高
        - 信贷支持很常见；缺失的证据是，谁能更好给风险定价，并把它转化为持续钱包份额
        - 索取按产品和买家队列划分的组合表现、还款曲线和附加率
      - - 经销商触达是既有玩家的弱点
        - Infra.Market 的 17,256 个触点和 GeM 的规模表明，大渠道替代仍然存在
        - 中
        - 线下和公共渠道依然重要，但留存资料没有量化它们相对于数字化通道的份额
        - 索取渠道份额研究和经销商输赢证据
      - - 合规只是次要购买标准
        - Amazon Business 和 GeM 都以 GST、合规或采购治理工具切入
        - 中
        - 治理最重要时，横向或公共采购通道即使没有材料专精也能赢得支出
        - 测试 JSW 是否需要为更大的机构买家强化合规工作流
      - - 不透明定价仍能支撑利润
        - 大多数直接同业以报价为主；只有 Metalbook 和 Amazon 公开广泛价格信号
        - 中
        - 不透明可能掩盖服务价值，但也让可持续价格领先难以证明
        - 索取核心材料的实际成交价和返利披露
      - - 资本可得性保证持久性
        - Udaan 亏损和裁员，加上 Infra.Market 与 Zetwerk 对 IPO 的依赖，说明融资仍是活的战略变量
        - 高
        - 即便玩家已具规模，这个品类仍重营运资金和物流
        - 索取现金周期、库存和融资依赖披露
      - - 治理清洁度不是差异化
        - Infra.Market 历史税务审查报道和全行业审视削弱信任叙事
        - 中
        - 历史调查不等于当前失败，但在企业或机构采购决策中可能重要
        - 索取合规认证、审计历史和客户异议处理记录
      - - 买家选定通道后多平台并行很少
        - 本组公司整体都缺少公开留存、复购和钱包份额证据
        - 高
        - 没有留存数据，更稳妥的假设是买家可以把品类分散到几个平台
        - 索取按客群划分的队列留存、重复下单率和活跃买家集中度
    notes: 严重性反映对投资判断的影响，而非失败确定性；正确读法是，护城河证明仍取决于私有客户和信贷表现证据。
