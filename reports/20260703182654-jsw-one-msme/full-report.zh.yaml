  - id: TP001
    title: 买方任务 / 竞品类型图谱
    columns:
      - 买方任务
      - 最匹配替代方案
      - 买方选择理由
      - JSW 优势所在
      - 主要证据缺口
    rows:
      - - 制造和建筑 MSME 的重材料采购
        - JSW One、OfBusiness、Infra.Market、Metalbook 与 SteelBazaar
        - 钢材或建筑材料更专、采购支持，以及某种形式的融资或物流
        - JSW 明确围绕制造和建筑 MSME 搭建，钢材 / 水泥深度和合作方信贷执行是核心
        - 实际成交价和留存数据未公开
      - - 横跨多类间接采购或 MRO 品类的企业采购
        - Moglix、Amazon Business
        - 目录更宽、采购工作流、分析、GST 或合规工具，以及更容易的长尾寻源
        - JSW 更贴近重材料，而不是通用企业支出
        - 品类级组合和实际企业合同条款仍未披露
      - - 自有品牌 + 全渠道分销支撑的建筑交付
        - Infra.Market
        - 多品牌组合模式、制造足迹和 17,256 个零售触点同时支撑项目和零售需求
        - JSW 受益于上游钢铁和水泥生态连接，而不是广泛自有品牌组合
        - 客户集中度和渠道组合未公开
      - - 定制工业制造或制造执行
        - Zetwerk、Metalbook、SteelBazaar
        - 合同制造或定制化比单纯买大宗材料更重要
        - JSW 更聚焦采购和材料可得性，而不是定制制造交付
        - 相较制造专业平台的赢单 / 输单证据未公开
      - - 公共采购或招标相关采购
        - GeM 及 ISA 相关卖家
        - 招标合规、政府采购工作流和 B2G 规模可能压过私营平台功能
        - 相比公共采购通道，JSW 仍可能更好服务私人项目和快周转商业采购
        - 留存来源未量化 GeM 相对私营平台的重材料份额
      - - 一般小企业补货或长尾 SKU 采购
        - Amazon Business、Udaan
        - 目录宽度、移动下单、GST 支持和广泛配送，能吸收非核心采购支出
        - 相比一般补货，JSW 在钢材和项目材料上更专
        - 专业通道和通用通道之间的钱包份额未公开
    notes: 各行把买方任务映射到证据最充分的替代通道；未知的线下份额仍是明确尽调缺口，而不是臆测出来的市场拆分。
