      - number: '8.2'
        title: 可比框架与行业映射
        blocks:
          - type: paragraph
            body: >-
              正确的公开市场视角，是带披露折价的比较，而不是假精确的 DCF。OfBusiness 和 Infra.Market 是最强的估值参照，因为它们同样面向印度、采购属性重、并且走向
              IPO；但它们在规模和盈利能力上的公开记录更完整。OfBusiness 以据报 $5 billion 估值、FY24 收入 ₹19,296 crore、FY24 利润 ₹603 crore
              进入可比集合。Infra.Market 则以据报 ₹24,600 crore 的 IPO 前估值、₹5,000 crore IPO 路径、FY25 收入约 ₹18,000–18,472 crore 加
              EBITDA 约 ₹1,500 crore 进入可比集合。Zetwerk 和 Moglix 进一步补充 IPO 准备度背景，但抓取到的来源仍只显示目标估值而非已成交标记，或显示增长伴随亏损而非已披露盈利。


              反命题同时来自同行和替代者。Udaan 2026 年 $1.8 billion 平轮，以及此前从 $3.2 billion 峰值跌到 $1.3 billion，展示了 B2B
              规模一旦无法转化为估值信心会发生什么。Amazon Business 不是直接的材料同行，但它关系到倍数压缩：其印度业务称 2025 年为客户创造超过 ₹2,000 crore 财务价值，五年销售 CAGR 超过
              40%，并触达超过 80% 的 MSME 生态；Digital Commerce 360 又报道，31.5% 销售已经来自二线及以下市场。再结合 ICRIER
              关于数字化的调查证据，需求顺风是真实的，但溢价属于能证明质量、经济性和信任的平台，而不只是参与了收入增长的平台。
            claimRefs:
