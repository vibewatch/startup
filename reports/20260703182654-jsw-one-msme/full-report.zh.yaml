  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 公开证据指向分销与金融一体化模型，而不是轻量挂牌市场。
    data:
      nodes:
        - id: buyer-demand
          label: MSME 材料需求
          detail: 制造和建筑 MSME 为钢材、水泥及相关供应需求进入平台。
        - id: quote-order
          label: 报价驱动的订单获取
          detail: 公司把定价描述为可预测，但付款和锁单仍要走报价与确认流程。
        - id: materials-fulfilment
          label: 材料 + 履约
          detail: 第三方材料、按规格加工、自有品牌和交付都装在同一套栈里。
        - id: recognized-revenue
          label: 确认收入
          detail: FY25 收入 ₹3,976 crore、GMV ₹12,567 crore，隐含约 31.6% 变现率。
        - id: finance-adjacency
          label: 嵌入式金融
          detail: 信贷拉动转化和客单价，但公开记录没有披露息差或损失经济性。
        - id: profitability-gap
          label: 盈利能力仍不清楚
          detail: 现金、毛利率和信贷损失披露还不足以做清晰测算。
      edges:
        - from: buyer-demand
          to: quote-order
          label: 买家请求价格和供货
        - from: quote-order
          to: materials-fulfilment
          label: 配置并分配订单
        - from: materials-fulfilment
          to: recognized-revenue
          label: 材料和服务确认收入
        - from: quote-order
          to: finance-adjacency
          label: 信贷可能撬动下单
