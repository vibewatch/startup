      - number: '6.4'
        title: 扩张向量、集中度未知项与客户风险信号
        blocks:
          - type: paragraph
            body: >-
              公开来源支撑一个可信的落地再扩张故事，尽管账户经济性没有披露。最可见的扩张杠杆是信贷、物流密度和更宽的产品品类。官方和应用来源显示，报价请求、文件、订单追踪、台账和合作方连接的金融服务都放在同一入口。FY25
              披露把客户主张和信贷支持的采购、JIT 履约绑在一起；后续融资报道又称，公司正在扩张物流、分销、库存点、合同制造和 NBFC 能力，让客户能在一个工作流里采购更多。应用商店列表还给出品类宽度信号——18,000+
              SKU、25+ 品类、18+ 邦——说明扩张既靠纯新客获取，也靠更高的钱包份额。


              集中度和渠道风险文件薄得多。保留下来的公开来源没有披露头部客户占比、收入集中度、地域集中度、按 GMV
              切分的垂直行业结构，或活跃账户与注册账户的拆分。这意味着最严肃的集中度风险仍是证据缺口，而不是已量化指标。最清晰的不利公开来源是一份 2026 年 SWOT 分析，它警告 JSW One 可能被视为 JSW
              自有销售渠道，而不是真正独立的市场平台；同时，在这个品类里扩大客服和交付一致性很难。这个批评不能否定平台牵引力，但它关系到客户粘性：如果非 JSW
              品牌不愿参与，或服务一致性随着网络铺向各工业枢纽而变弱，扩张质量可能和表面用户增长脱钩。因此，本章收在一个平衡判断上：客户采纳看起来真实且在扩张，但在管理层披露活跃客户分群、头部账户敞口和服务质量结果之前，集中度和粘性仍有一部分不透明。
