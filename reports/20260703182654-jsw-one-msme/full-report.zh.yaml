      - CV058
      - CV060
      - CV061
      - CV064
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 敏感性用相对 2025 年 5 月披露估值标记的倍数增减表达，而不是用带有虚假精度的绝对卢比金额。
    approximationNotes: 每根柱代表分析师估计：若该条件达成或落空，相对 2025 年 5 月锚点的承销倍数可能移动多少。
    data:
