        - 把供应获取转成履约能力
        - 多个节点必须实时衔接
        - 单点故障会连带冲击 OTIF、利润率或单证
        - 中到高
        - 建立节点级监控和备用采购
        - 没有公开的节点级冗余、利用率或停机指标。
      - - 运输和服务网络
        - JSW One Transportation Services，加上服务中心和卖方物流
        - 承接最后一公里、零担运输、投诉响应和 JIT 履约
        - 可靠性承诺很高，但运营结构不透明
        - 升级投诉、索赔或交付失误侵蚀信任，速度快过 GMV 能反映出来
        - 中到高
        - 跟踪区域合作伙伴评分卡、投诉结案和异常流转
        - 公开披露未区分自有、合作伙伴和卖方控制的配送环节。
      - - 公开市场窗口
        - 投行、Pre-IPO 投资者、公开市场买家
        - 支持增长，并提供估值基准
        - IPO 路径同时受时点和披露敏感度制约
        - 市场窗口走弱或披露不足会拖慢融资并压低估值
        - 高
        - 把 DRHP 准备排在运营和信贷质量证据之后
        - 这条路径同时暴露在宏观情绪和内部准备度之下。
    notes: 本风险台账把贷款方、母集团供给、履约节点和市场准入视作依赖项，而不只是增长助推器。
