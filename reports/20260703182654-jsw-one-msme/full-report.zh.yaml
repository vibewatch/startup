  - id: TP004
    title: 定价 / 打包方式对比
    columns:
      - 平台
      - 公开可见的定价信息
      - 下单或合同模式
      - 金融或支付支持
      - 仍缺少证据的内容
      - 含义
    rows:
      - - JSW One MSME
        - 未留存到广泛公开的价格表
        - 平台入驻与辅助采购
        - 已披露合作方信贷撮合
        - 钢材或水泥实际折扣曲线、合同条款和抽成率
        - 差异化可能更多靠执行，而不是公开标价
      - - OfBusiness
        - 登录并进入报价流程后可见原材料价格；宣称价格低 1%
        - 报价主导的采购，配套辅助寻源
        - Oxyzo 产品组合和营运资金支持
        - 按产品划分的实际成交价、信用损失和客户级返利条款
        - 金融组合很强，但公开证据里的定价内容仍偏营销
      - - Infra.Market
        - 未留存到广泛公开的标价
        - 直销加零售 / 经销商网络
        - 未明确留存到独立公开的金融产品
        - 各渠道合同定价、折扣政策和付款条款
        - 规模清楚，但价格领先无法用公开资料证明
      - - Moglix
        - 标准产品公开目录价；企业页面以联系销售为主
        - 目录采购加企业采购流程和 ARC
        - 供应链融资、渠道融资和发票贴现
        - 大企业议价价格和按客户划分的实际节省
        - 目录品比直接材料同业更透明，但企业实际成交价仍不透明
      - - Udaan
        - 未留存到详细公开价格表
        - 面向小商户的 App 批发下单
        - 公开推广商业信贷
        - 品类实际成交价、物流经济性和还款表现
        - 小企业采购支出的广义替代选项，不是透明的重材料基准
      - - Amazon Business India
        - 公开价格、批量折扣、支持 GST 的目录和延期付款条款
        - 自助在线下单，支持大宗采购协助
        - Amazon Pay Later 和 30 天免息账期
        - 按客群划分的企业实际净折扣，以及特定品类重材料经济性
        - 一般采购的公开透明度最强，但作为钢材专项基准偏弱
      - - Metalbook
        - 网站可见城市级金属和大宗商品实时价格
        - 平台交易与辅助寻源
        - 融资方案加 15+ 家贷款伙伴
        - 按合同划分的价差、服务费和信用损失表现
        - 在留存证据里，直接金属同业中价格发现模型最透明
      - - SteelBazaar
        - 留存证据中未知
        - 宣称平台模式；未留存合同条款
        - 二级资料称提供融资选项
        - 实际公开价格界面和合同结构
        - 有意思的细分挑战者，但定价证据仍稀疏
      - - GeM
        - 招标、竞价和框架价格合同流程，而非开放目录价
        - 公共采购流程
        - GeM 主管方曾计划为钢铁 MSME 提供融资接口
        - 重材料买家多频繁把 GeM 投标价与私营平台报价比较
        - 合规或招标挂钩采购的重要替代，而不是日常私营采购替代
    notes: 未知或缺少支撑的单元格被明确保留，因为公开定价和实际采购经济性仍是本组公司最大的未解尽调缺口。
