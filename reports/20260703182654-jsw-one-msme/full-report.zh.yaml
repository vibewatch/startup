  - id: TP002
    title: 竞品画像表
    columns:
      - 竞品
      - 类型
      - 披露规模或背书信号
      - 目标客群
      - 差异化
      - 主要限制
    rows:
      - - JSW One MSME
        - 研究对象 / 直接材料平台
        - FY25 GMV ₹12,567 crore；注册 MSME 84,000+；促成信贷约 ₹3,800 crore；钢材约 2 MT
        - 制造和建筑 MSME
        - 材料垂直深度 + 合作方信贷采购 + JSW 生态可信度
        - 留存、实际成交价和信贷质量的公开证据偏薄
      - - OfBusiness
        - 直接同业
        - 订单 500K+；SME 2M+；FY24 收入 ₹19,296.3 crore；Oxyzo FY25 收入 ₹1,207 crore
        - 制造、基建、承包商，以及采购原材料的 SME
        - 原材料采购与 Oxyzo 专属融资的组合最接近
        - 实际成交价、信贷损失质量和客户集中度仍未披露
      - - Infra.Market
        - 直接同业
        - 制造设施 283+；零售触点 17,256 个；Series G 估值约 ₹24,600 crore
        - 承包商、开发商、零售商、建筑和基建买方
        - 多品牌组合建筑平台，全渠道足迹大
        - 历史税务审查拖累，以及更高债务或资本开支强度
      - - Moglix
        - 广义采购套件 / 相邻同业
        - 产品 500,000+；估值约 $2.6B；FY24 收入 ₹4,735.6 crore
        - 覆盖水泥、金属、MRO、基建和多行业采购的企业采购
        - 不止目录销售，还提供工作流工具、融资、分析和定制加工
        - 留存证据显示，重材料垂直度弱于 JSW 或 OfBusiness
      - - Udaan
        - 相邻替代
        - 2025 年 6 月融资 $114M，估值约 $1.8B；FY24 收入 ₹5,706.6 crore
        - FMCG、主食、医药、HoReCa 和生鲜领域的小企业买方
        - 小企业规模、信贷和移动下单
        - 品类重点不是钢材 / 水泥，亏损或裁员仍可见
      - - Amazon Business India
        - 横向替代
        - 产品 15+ crore；卖家 3.5+ lakh；邮编覆盖 99.8%；MSME 触达路径 50M+
        - 采购通用物资、MRO 和合规尾部支出的 SME、机构和企业
        - 全国规模的 GST、合规、批量折扣和 30 天账期
        - 不是重材料专家，项目专用材料工作流也更弱
      - - Metalbook
        - 直接同业
        - 供应商 3,000+；已交付 850k+ MT；放贷合作伙伴 15+；SME 和企业 2,500+
        - 金属买方、加工商、回收商和工业项目
        - 金属垂直市场，提供可见价格流、融资、物流和合同制造
        - 当前独立财务披露少于 OfBusiness 或 Infra.Market
      - - SteelBazaar
        - 垂直小众直接同业
        - 自举；SKU 15,000+；定制服务 100+；员工 51-200 人
        - 建筑、汽车、能源和包装领域的钢材买方
        - 只做钢材的 AI 驱动市场，主打融资和定制化
        - 披露规模较小，独立证据也比大型同业更薄
      - - Zetwerk
        - 相邻制造替代
        - 计划 IPO 约 $750M；估值约 $3.1B；客户 3,500+
        - 需要制造执行、零部件或定制构建的工业买方
        - 合同制造深度和工业执行规模
        - 留存证据中，它不是以大宗采购优先的买方通道
      - - GeM
        - 现状方案 / 公共采购通道
        - 累计 GMV ₹18.4T；FY26 GMV ₹5T；FY26 订单 68% 来自 MSME
        - 政府相关或招标驱动采购
        - 采购合规、公共部门规模，以及通过 ISA 接入钢铁行业
        - 不是服务 MSME 日常采购的私营部门材料操作系统
    notes: 规模标记混用 GMV、收入、用户、估值或足迹，因为私营公司披露不标准；“未知”表示留存公开证据不足以支撑更干净的同口径指标。
