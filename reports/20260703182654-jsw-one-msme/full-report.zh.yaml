      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - MSME 制造业核心钢材采购
        - 钢卷、钢板、TMT、结构钢、按规格切割加工及相关交付
        - 初级炼铁资本开支、大宗商品期货，或无关工业投入品
        - 工厂业主、采购负责人或运营团队；付款方是营运资金或采购预算
        - 核心
      - - MSME 承包商核心建筑材料采购
        - 小型和中型建筑项目采购的水泥及相关结构材料
        - 零售消费者家装篮子和成品房地产销售
        - 承包商、工地经理或业主；付款方是项目现金流或短期信贷
        - 核心
      - - 采购相关物流与履约
        - 与材料订单绑定的加工中心、库存点、零担配送、最后一公里协调和订单追踪
        - 与材料交易无关的独立第三方物流
        - 运营或发运团队；付款方嵌在交付材料成本里
        - 核心赋能项
      - - 采购相关金融
        - 附着于材料流的库存贷款、发票相关或订单相关营运资金支持、承销和对账
        - 与采购事件无关的通用无抵押 MSME 贷款
        - 业主兼 CFO、财务负责人或创始人；付款方是借款企业
        - 核心赋能项
      - - 相邻住宅建造与品牌零售层
        - 可以强化信任的交钥匙住宅建造服务和自有品牌质量主张
        - 完全不接触 MSME 采购工作流的大众消费者住房零售支出
        - 个人建房者或专业渠道
        - 相邻
      - - 大型企业直接采购
        - 作为供给集中度或定价纪律的偶发参照点
        - MSME 定义之外的大型项目 EPC 或上市企业采购
        - 大型企业中央采购团队
        - 排除在核心论点之外
    notes: 边界逻辑结合了公司定位、产品组合和官方 MSME 定义；本章聚焦采购加金融，而不是通用电商。
