  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要传导路径从贷款方或履约压力出发，进入转化、复购、利润质量和 IPO 准备度。
    data:
      nodes:
        - id: n1
          label: 贷款方意愿
          detail: 合作银行审批、DLG 舒适度和营运资本意愿
        - id: n2
          label: 融资订单转化
          detail: 相当大比例的订单或 GMV 使用 60–90 天信贷
        - id: n3
          label: 履约执行
          detail: 库存点、加工、合同制造、运输和 JIT 服务中心
        - id: n4
          label: 客户信任 / 复购
          detail: 服务质量和信贷可得性决定复购韧性
        - id: n5
          label: 利润率与营运资本
          detail: 索赔、冲销和转化放慢会挤压经济性
        - id: n6
          label: IPO 准备度 / 估值
          detail: 公开市场信心取决于干净的运营和信贷证明
      edges:
        - from: n1
          to: n2
          label: 审批和定价卡住需求
        - from: n2
          to: n4
          label: 信贷可得性影响订单转化
        - from: n3
          to: n4
          label: OTIF 和质量塑造复购
        - from: n4
          to: n5
          label: 复购或索赔改变经济性
        - from: n5
          to: n6
          label: 经济性驱动上市信心
        - from: n3
          to: n5
          label: 整合错误吃掉现金和利润率
    approximationNotes: 边表示从管理层、政策和监管证据推断出的方向性因果路径，而非公司发布的流程图。
    claimRefs:
      - CR011
      - CR012
      - CR017
      - CR035
      - CR039
      - CR040
      - CR041
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: JSW One 同时依赖母集团供给和品牌、合作贷款方、履约节点以及公开市场窗口。
    data:
      nodes:
        - id: d1
          label: JSW Group / JSW Steel
          detail: 资本、品牌和制造实力托住平台
        - id: d2
          label: 合作银行和 NBFC
          detail: 为很大一部分 60–90 天库存信贷提供资金
        - id: d3
          label: JOFL / 内部 NBFC
          detail: 规模不大，但战略重要性高的内部金融臂
        - id: d4
          label: 加工 / 库存 / 合同制造节点
          detail: 必须实时整合的物理执行网络
        - id: d5
          label: 运输 / 服务网络
          detail: 最后一公里、JIT 和投诉响应路径
        - id: d6
          label: IPO / 投资者基础
          detail: 估值和融资灵活性未来依赖资本市场
      edges:
        - from: d1
          to: d4
          label: 供给和战略资本
        - from: d1
          to: d6
          label: 集团声誉塑造市场认知
        - from: d2
          to: d3
          label: 外部信贷仍占主导
        - from: d2
          to: d6
          label: 融资证明影响市场信心
        - from: d4
          to: d5
          label: 执行传导到交付
        - from: d5
          to: d6
          label: 服务结果影响估值叙事
    approximationNotes: 依赖关系来自公开披露和管理层表述；该图呈现方向关系，不是法律实体图。
