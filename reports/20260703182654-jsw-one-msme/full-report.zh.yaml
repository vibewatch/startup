  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前公开数值 / 状态
      - 质量视角
      - 尽调要求
    rows:
      - - 核心钢材和材料分销
        - 不是简单收取上架费，而是在钢材、水泥及配套材料采购中确认收入
        - ₹ crore GMV / 收入
        - FY25 GMV ₹12,567 crore；FY25 收入 ₹3,976 crore；公开资料反复把钢材和水泥称为核心品类
        - 规模很大，但公开披露没有区分转手商品价值与平台价差或加工利润
        - 提供 FY25 经审计分部收入及按产品族划分的毛利率
      - - 自有品牌
        - JSW One TMT 和 JSW One Concrete 等自有品牌产品在采购栈内销售
        - 占比未披露
        - 官方页面和融资新闻稿突出自有品牌，但不披露收入占比
        - 相较普通贸易，可能提高利润率，但公开占比缺失
        - 披露 FY25 自有品牌收入、毛利率和复购率
      - - 加工和合同制造
        - 按规格切割钢卷，并由合同制造地点承接生产
        - 地点 / 吞吐量
        - Mint 提到按规格切割钢卷和合同制造的 JSW One 品牌产品；ET 提到约 7 个合同制造地点
        - 增值收入很可能存在，但单位经济性不透明
        - 提供加工吞吐量、良率损失和每吨贡献利润
      - - 嵌入式金融和信贷
        - 伙伴主导的库存融资，加上与订单绑定、正在扩张的 NBFC 产品
        - ₹ crore 放款 / AUM
        - FY25 信贷放款约 ₹3,800 crore；当前月度库存融资流量 ₹475-500 crore；NBFC 基础约 ₹100 crore
        - 加深钱包份额和转化，但带来风控和资金依赖
        - 提供按产品划分的抽成率、NIM、违约率和贷款方经济性
      - - 物流和履约
        - 库存点、加工中心、运输和 JIT / 服务中心交付支撑订单完成
        - 网络节点
        - 公开来源提到 13 个加工中心、14 个库存点、运输服务和不断扩张的履约网络
        - 公开披露中，物流和履约可能嵌在已确认收入里，而不是单独定价
        - 提供每吨 / 每单履约成本，以及自有与伙伴交付的拆分
    notes: 本表混合了公司声称和第三方报道的收入通道；经济性为空意味着公开记录没有干净隔离每条收入流。
