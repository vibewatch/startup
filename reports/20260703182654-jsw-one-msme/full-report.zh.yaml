            body: >-
              本次留存证据给出的竞争教训是，采购加金融必要但不充分。嵌入式金融现在已普遍存在于 JSW、OfBusiness 或 Oxyzo、Moglix、Udaan、Amazon Business 和
              Metalbook，所以 JSW 不能假设只靠信贷就能形成持久锁定。反向证据也重要。Infra.Market 有历史税务审查阴影，Udaan 即便多轮融资后仍呈现重亏损和可见裁员，Zetwerk 和
              Infra.Market 等大型相邻玩家仍与 IPO
              时点和资产负债表访问紧密绑定。这些信号不能证明品类失败，但说明规模可以长期掩盖弱单位经济或治理摩擦。最大缺失证明点是真实成交价格、复购或留存，以及信贷损失质量。在这些披露前，最稳妥判断是 JSW
