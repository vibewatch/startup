      - number: '5.4'
        title: 差异化、成熟度与开放缺口
        blocks:
          - type: paragraph
            body: >-
              公开差异化故事可信，但它不只是软件护城河故事。证据最充分的优势是整合执行、供应获取和工作流覆盖：跨工业材料的品类宽度、有真实采购动作的买方应用、可见文档和退货流程、在融资报道中已重要到被讨论的物流栈，以及试图在本地供应不稳定处标准化质量的自有品牌。Moneycontrol
              的复购信号也符合这种解读。如果超过 70% 业务来自复购，产品很可能靠可靠性和运营可重复性创造价值，而不只是靠一次性比价。


              同时，不能夸大产品成熟度。应用信号真实——Google Play 显示 10K+ 下载，AppBrain 显示更高的镜像累计下载和 2026 年中更新，iPhone
              列表突出认证供应商和证书——但公开买方体验在金融和例外处理上仍像辅助式，而非完全自助。金融 FAQ 是最清晰的证据缺口：即便公司层面披露已经谈到规模化信贷轨道和 NBFC
              扩张，它仍说融资选项即将推出。这种不匹配很重要，因为它暗示公司可能在资产负债表和伙伴能力上走在前面，但在清晰记录的买方面金融用户体验 上落后。对尽调而言，这意味着 JSW One
              在供应加服务编排上的差异化可信，但整合、SLA、公开安全披露，以及金融体验有多少真正产品化给自助买家，仍是开放问题。
