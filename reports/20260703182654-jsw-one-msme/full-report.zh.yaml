      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              公开资料在规模上方向性鼓舞人心，在披露深度上商业性地令人担忧。JSW One 已越过“概念”或轻量市场平台阶段：₹3,976 crore 收入、₹12,567 crore GMV、大量注册
              MSME、可观信贷流和扩大的履约足迹，都显示真实经营分量。业务也似乎有多条变现杠杆，横跨材料、加工、品牌、物流和金融。这是积极面。


              谨慎点在于，投资判断者仍看不到下行控制最关键的栈内部分。公开来源不披露现金、资金续航期、毛利率、违约率、回款质量、真实定价、客户集中度或留存，镜像数据库又与管理层报告收入冲突，也不能替代经审计账目。因此正确结论不是“回避”，而是“没有申报文件前，不要把收入规模外推为质量”。基于现有证据，资本充足性较少取决于原始需求，更多取决于信贷表现、履约毛利和
              IPO 前融资能否接近管理层的盈亏平衡计划。
