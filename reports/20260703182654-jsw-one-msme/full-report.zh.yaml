  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 细分聚焦、买方地图与可服务客户叙事
        blocks:
          - type: paragraph
            body: >-
              公开来源一致显示，JSW One MSME 并不试图服务小企业采购的每个品类。运营故事窄得多，也更有用：它是为采购钢材、TMT、水泥和相关工业投入品的制造和建筑 MSME 提供的采购层。官方页面把它描述为面向
              MSME 的钢材与建材市场平台，FY25 新闻稿和 JSW Steel 集团页面则把平台定位为服务建筑和制造材料的更宽 B2B
              商务层。移动应用列表进一步收紧这种分层，点名制造、加工、汽车、工业机械、建筑、基础设施、能源和通用工程等目标行业，并描述订单跟踪、账本可见性和伙伴关联信贷等工作流。


              买方、用户和付款方信号也更偏工业，而不是零售。证据显示，客户基础可能是所有者主导或采购主导的
              MSME，创始人、工厂采购、项目经理和财务团队都重要。应用承诺报价请求、文档、账本、交付跟踪和信贷获取，客户证言关注质量保证、不同等级可得性、准时交付和售后响应，而非消费者式浏览，这一点可见。第三方报道补充了规模叙事：Entrepreneur
              称公司希望为印度 500,000 多家建筑和制造 MSME 建设整合采购栈，官方 FY25 披露则称平台已触达 84,000+ 注册
              MSME。这个组合支持可信的漏斗顶部故事，但它仍只是注册和可服务市场故事；公开资料没有按邦、集群或活跃客群拆分客户基础。
