      - number: '5.2'
        title: 运营架构与履约依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开架构证据是运营性的，而不是软件内部的。JSW One Platforms 和 JSW Steel 都把这门业务描述为技术驱动生态，组合材料供应、服务、融资，以及建筑或供应链解决方案。2025
              年官方增长新闻稿把图景进一步收紧，将增长与供应链服务、信贷撮合、自有品牌和金融科技层绑定；Entrepreneur 和 Businessworld 则把下一阶段建设描述为技术、物流、分销和 NBFC
              扩张。合起来，公开资料支持一个分层运营架构：客户访问界面接入销售辅助商业层；商业层插入支付和放款人轨道；这些轨道依赖库存点、合同制造、服务中心和运输编排；整个系统再由文档和投诉解决工作流包住。


              公开资料不支持猜测私有软件栈。本轮没有留存公开 API 文档、公开状态看板、ERP 截图或具名基础设施认证，因此正确的架构图是运营模型，不是云架构图。即便如此，物理执行依赖异常清晰。Entrepreneur
              引述管理层称，14 个库存点和约 7 个合同制造地点必须实时整合，才能做到准时、足量供应。同一组来源也通过 One Helix 管材 / 管件和 HR
              板材支持一个有意义的自有品牌层，使平台看起来更像带托管供应资产、执行很重的采购系统，而不只是轻量市场平台。
