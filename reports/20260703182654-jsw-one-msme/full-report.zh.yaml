        title: 展项
        blocks:
          - type: callout
            title: 利益冲突风险是战略性的，不是表面瑕疵
            body: JSW One 公开借力 JSW Group 的制造实力，同时管理层也说平台并不打算成为宽泛的多卖方市场。这种组合可能很有商业威力，但如果供应商结构和关联方披露不改善，中立性主张会被削弱。
