  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与正确可比集合
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME 的相关市场比整个印度 B2B
              商务窄，又比简单线上钢材目录宽。公司材料持续描述一种采购工作流：把材料供应与信贷、订单跟踪、对账，以及平台层面的物流和准交钥匙服务捆在一起。实践中，核心纳入支出是 MSME
              制造商和承包商对钢材与结构材料的重复采购，再加上让这些订单能执行的加工、履约和营运资金工具。平台自身围绕透明、信任、退货和售后支持的定位也意味着质量保证和执行可靠性是买方任务的一部分，不是可选附加项。


              正确的排除项同样重要。个人住宅建造在更大的 JSW One 伞下存在，但它是相邻层，不是本章核心命题。大型企业集中采购和超大型项目 EPC 采购也在主焦点之外，因为 RBI 的 MSME
              门槛和公司自身口径都指向微型、小型和中型买家。最后，这不是一个通用多卖方市场命题。独立报道称钢材和水泥供应集中在少数玩家手里，因此更站得住的框架，是集中材料品类里的技术赋能采购层，而不是无限宽的开放市场平台。
