- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for JSW One MSME
  - Diligence ask
  rows:
  - - Government infrastructure and housing spend
    - driver
    - current through FY27+
    - Supports cement and steel throughput in the exact categories the platform sells into.
    - How much of GMV growth comes from public-infrastructure-linked demand versus private capex?
  - - Steel and cement capacity expansion
    - driver
    - 2026-2030
    - Expanding supply can support availability, pricing discipline, and category breadth.
    - Which sub-categories benefit most from new capacity and where can oversupply compress margins?
  - - TReDS, GeM, ONDC, and public market-access rails
    - driver
    - current and policy-forward
    - Normalizes digital workflows around procurement-linked finance and digital discovery for MSMEs.
    - How much of private-market adoption is actually piggybacking on these public rails?
  - - Embedded-finance need
    - driver
    - current and structural
    - Large credit gaps make credit-backed procurement a genuine product wedge rather than a minor add-on.
    - What share of repeat orders would not clear without partner or in-house financing?
  - - Traditional channel behavior and weak independent penetration data
    - constraint
    - current
    - Category growth can look faster than true digital conversion because most MSMEs still buy through traditional relationships.
    - Request third-party survey data on online order share by cohort and product line.
  - - Delayed payments and receivables friction
    - constraint
    - current
    - Working-capital friction can stall reorder frequency even if customer acquisition succeeds.
    - What are average payment cycles, delinquency vintages, and lender recovery assumptions?
  - - Infrastructure, logistics, and skilled-labour bottlenecks
    - constraint
    - current
    - Poor roads, warehousing, workforce quality, and execution capacity can suppress service quality outside top clusters.
    - Where are fulfilment failures or labour shortages most visible by product and region?
  - - Construction slowdown and steel-price pressure
    - constraint
    - cyclical
    - Macroeconomic softness can coexist with long-term market size, producing short-term volatility in adoption and margin.
    - How elastic are order frequency and take rate when steel prices fall or projects slow?
  notes: The strongest growth story is procurement-plus-finance, while the weakest public evidence is around true private-market digital penetration and unit economics.
