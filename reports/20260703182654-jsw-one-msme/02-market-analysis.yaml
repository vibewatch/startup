  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: msme-universe-denominator
    missingEvidence: A harmonized official series separating estimated MSME stock, registered units, and active procurement-ready manufacturing/construction MSMEs.
    whyItMatters: Without one denominator, top-down market sizing can look larger or smaller because of definitional drift rather than true market movement.
    diligencePath: Ask management to map its internal target-customer universe to ASUSE, Udyam/UAP, and product-category cohorts by manufacturing, construction, and channel buyer segments.
    relatedQuestionRefs:
    - QM006
    - QM007
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: jsw-one-sam-som
    missingEvidence: Audited breakdowns of GMV, active buying accounts, repeat rates, and category mix by steel, cement, logistics, and financed orders.
    whyItMatters: Current public sources show meaningful operating scale but do not isolate a clean JSW-One-specific TAM, SAM, or obtainable SOM.
    diligencePath: Request cohort tables for active buyers, GMV, steel tonnes, cement volumes, and region-by-region share within industrial clusters.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: private-b2b-digital-penetration
    missingEvidence: An independent sector study measuring current digital penetration in private B2B building-material procurement.
    whyItMatters: The strongest retained penetration signal is competitor commentary rather than a neutral industry audit, which weakens conviction on adoption-speed assumptions.
    diligencePath: Source distributor, contractor, and manufacturing-MSME survey data on channel mix, online order share, and repeat digital usage by product line.
    relatedQuestionRefs:
    - QM019
    - QM024
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: credit-unit-economics
    missingEvidence: Platform-level loss rates, take rates, approval rates, and NBFC asset-quality metrics for financed procurement orders.
    whyItMatters: Embedded finance clearly drives conversion, but public sources do not show whether financed GMV is economically attractive or simply volume-accretive.
    diligencePath: Review lender-partner contracts, delinquency curves, NBFC asset-quality disclosures, and contribution margin by financed versus cash order cohorts.
    relatedQuestionRefs:
    - QM017
    - QM020
