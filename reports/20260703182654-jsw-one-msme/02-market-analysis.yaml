- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Shows the practical adoption path from fragmented procurement pain to repeat credit-backed ordering.
  data:
    nodes:
    - id: pain
      label: Procurement Pain
      detail: Buyer faces fragmented supply, opaque quality, weak delivery predictability, or delayed payment pressure.
    - id: catalog
      label: Discovery + Pricing
      detail: Buyer compares catalog options, pricing, and order terms inside a digital workflow.
    - id: processing
      label: Customization / Order Lock
      detail: Platform coordinates cut-to-spec processing, stock-point availability, and contract-manufactured supply where needed.
    - id: credit
      label: Credit Decision
      detail: Partner or in-house finance underwrites inventory funding or working-capital support for the order.
    - id: delivery
      label: Fulfilment + Last Mile
      detail: Processing centres, transport services, and industrial-cluster distribution move the order to site or plant.
    - id: repeat
      label: Repeat Procurement
      detail: Reliable delivery plus finance and reconciliation increase the odds of repeat ordering and higher share of wallet.
    edges:
    - from: pain
      to: catalog
      label: search for trusted source
    - from: catalog
      to: processing
      label: lock order spec
    - from: processing
      to: credit
      label: check cash-flow fit
    - from: credit
      to: delivery
      label: fund and dispatch
    - from: delivery
      to: repeat
      label: prove reliability
  approximationNotes: The flow is qualitative. Public sources disclose infrastructure and credit use, but not stage-by-stage conversion rates or time-to-repeat metrics.
