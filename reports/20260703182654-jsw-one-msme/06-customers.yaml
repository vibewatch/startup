figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The public customer story runs from industrial buyer discovery through quote-led ordering, delivery verification, and repeat or expanded procurement.
  data:
    nodes:
    - id: u1
      label: Discovery
      detail: Manufacturing or construction MSME hears about JSW One through the JSW ecosystem, online marketplace discovery, or peer referral and comes looking for reliable material access.
      tone: neutral
    - id: u2
      label: Quote and fit assessment
      detail: Buyer checks category breadth, requests pricing, and tests whether JSW One can serve the required grade, dimensions, or delivery location.
      tone: neutral
    - id: u3
      label: Credit and logistics evaluation
      detail: Procurement and finance assess partner-linked credit, verified logistics, and whether service centres or stock points can support the job or plant.
      tone: warning
    - id: u4
      label: Order placement and documentation
      detail: Customer places the order, monitors ledger and payment flows, and expects test certificates, invoices, and dispatch information inside the workflow.
      tone: positive
    - id: u5
      label: Delivery and quality verification
      detail: Customer judges on-time delivery, material quality, and after-sales response, with a two-day complaint window and support route if issues arise.
      tone: positive
    - id: u6
      label: Repeat purchase or wallet-share expansion
      detail: If the experience is reliable, the account reorders, widens category usage, or adopts credit-backed procurement; if not, durability weakens despite registration growth.
      tone: positive
  approximationNotes: Illustrative journey synthesized from official workflow claims, customer testimonials, app features, and repeat-order evidence; no retained source publishes a formal funnel.
