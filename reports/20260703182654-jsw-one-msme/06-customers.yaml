- id: expansion-and-concentration-risks
  title: Expansion vectors, concentration unknowns, and customer-risk signals
  body: |-
    Public sources support a believable land-and-expand story even though they do not disclose account economics. The most visible expansion levers are credit, logistics density, and broader product breadth. Official and app sources show quote requests, documentation, order tracking, ledgers, and partner-linked finance on the same surface. FY25 disclosures tie the customer proposition to credit-backed procurement and JIT fulfilment, while later funding coverage says the company is expanding logistics, distribution, stock points, contract manufacturing, and NBFC capacity so customers can buy more through one workflow. The app-store listing adds breadth signals—18,000+ SKUs, 25+ categories, and 18+ states—suggesting that expansion is meant to come from wider wallet share as much as from pure new-customer acquisition.

    The concentration and channel-risk file is much thinner. No retained public source discloses top-customer share, revenue concentration, geography concentration, vertical mix by GMV, or the split between active and registered accounts. That means the most serious concentration risk is still an evidence gap rather than a measured metric. The clearest adverse public source is a 2026 SWOT analysis that warns JSW One could be seen as a captive JSW sales channel rather than a truly independent marketplace, and that scaling customer service and delivery consistency is hard in this category. That critique does not disprove the platform’s traction, but it does matter for customer durability: if non-JSW brands hesitate to participate, or if service consistency weakens as the network spreads across industrial hubs, expansion quality could diverge from headline user growth. The chapter therefore closes with a balanced view: customer adoption looks real and expanding, but concentration and durability remain partially opaque until management discloses active cohorts, top-account exposure, and service-quality outcomes.
