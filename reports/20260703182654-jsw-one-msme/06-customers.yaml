- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: |-
    The strongest adoption evidence is a stack of scale proxies rather than a clean active-customer cohort disclosure. Official and independent FY25 coverage aligns on 84,000+ registered MSMEs, around 2 million tonnes of steel purchased, and about ₹3,800 crore of facilitated credit. Moneycontrol gives a useful earlier waypoint by saying the registered base had crossed 58,000, first-time buyers had doubled, and more than 70% of business already came from repeat orders. Taken together, those signals support a real adoption trajectory from 2024 into FY25 and early FY26, not a one-quarter marketing spike. BusinessWorld then extends the trajectory by reporting that management expected more than ₹8,000 crore of GMV in H1 FY26 while continuing to widen logistics and distribution coverage.

    Named proof is also real, but it needs to be handled carefully. The best official customer-proof page names Technomix Engineers, Malan Industries, MPI Exports, and Aria Industries, with quotes that emphasize product availability, on-time delivery, competitive pricing, material quality, and after-sales help. Those are not just logo drops; they describe ordering behavior and service experience. Independent directory and company pages let us corroborate that several of those names are genuine industrial buyers or manufacturers rather than invented references. Technomix appears as a Pune engineering and fabrication business, MPI Exports as a steel-products manufacturer serving automotive and machinery sectors, Aria Industries as a Pune manufacturer of steel and fabricated products, and Om Industries as a Pune fabrication business whose JSW One video title explicitly frames the story as moving from ten suppliers to one platform. What remains missing is spend, volume, exact order cadence, or measured ROI for any named customer, so public proof clears the “real customer exists” bar more comfortably than the “large, durable, deeply penetrated account” bar.
