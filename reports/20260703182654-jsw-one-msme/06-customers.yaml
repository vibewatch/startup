- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - public scale / strategic value
  - gap
  rows:
  - - Manufacturing MSMEs
    - Owner-founder, procurement lead, plant operations, finance approver
    - Recurring raw-material procurement for steel-intensive production
    - Core official target; 84,000+ registered MSMEs and 500,000+ stated addressable manufacturing/construction MSMEs
    - No active-account split, plant-size mix, or share of GMV by manufacturing sub-segment
  - - Construction MSMEs and contractors
    - Project buyer, site lead, proprietor, finance lead
    - Steel, TMT, cement, and project-material sourcing with delivery coordination
    - Explicit in official and app-store positioning; construction is one of the two canonical sectors
    - No public split between contractors, developers, and fabrication shops
  - - Fabricators and general engineering buyers
    - Workshop owner, procurement manager, quality-oriented buyer
    - Multi-grade steel procurement with documentation and traceability
    - Supported by app-sector list plus named customers like Technomix, Aria, and Om Industries
    - No disclosed average order size or repeat interval by fabrication customer
  - - Automotive, machinery, and industrial OEM supply-chain buyers
    - Procurement team, owner, technical buyer
    - Specialty steel, bars, profiles, and related industrial inputs
    - App-store sector list plus MPI Exports sector coverage point to this customer lane
    - No public named automotive OEM customer on the JSW One side
  - - Credit-seeking procurement accounts
    - Founder, finance controller, procurement lead
    - Working-capital-assisted procurement and invoice-linked buying
    - ₹3,800 crore FY25 facilitated credit plus partner-finance workflow suggest high strategic value
    - No public disclosure of financed-order share by segment or lender concentration
  - - Repeat-order installed base
    - Existing buyer returning for subsequent orders
    - Reorder based on delivery reliability, pricing, and after-sales support
    - Moneycontrol says 70%+ of business came from repeat orders
    - No public cohort, churn, NRR, GRR, or top-account contribution data
  notes: Rows separate who the platform targets from what is actually quantified; public evidence is strongest on manufacturing/construction orientation and weakest on active-account mix and segment GMV.
