- id: durability-satisfaction-and-repeat-behavior
  title: Durability, satisfaction proxies, and repeat behavior
  body: |-
    Durability evidence exists, but only as a proxy layer. The single best public retention datapoint is Moneycontrol’s statement that more than 70% of business comes from repeat orders. That matters because it implies JSW One is winning reorders in a category where buyers historically used credit terms and intermediaries to protect themselves from poor-quality material and uncertain delivery. The same article argues that this loyalty developed before credit was broadly available, which points to trust, transparency, and procurement predictability as part of the value proposition. The official testimonial set points in the same direction: customers mention ordering “for a while,” receiving materials as promised, and getting responsive after-sales support. None of that proves NRR, GRR, or churn, but it does support a qualitative durability case.

    Satisfaction evidence is mixed but still usable. Apple’s App Store page showed a 4.5 rating from 42 ratings on the run date, which is directionally positive for the digital surface, while AppBrain showed roughly 38,000 cumulative downloads, recent updates in June 2026, and no ratings on its own mirror. Those signals suggest real app distribution and continuing product maintenance, but also warn against over-reading small-sample public reviews. The major gap is that none of the retained sources disclose active app users, ordering frequency, account-level retention, contract length, or revenue-retention metrics. So the right read is not “retention is proven”; it is “repeat purchase and satisfaction have encouraging public proxies, but the durable-economics layer remains undisclosed.”
