- id: TU006
  title: Customer evidence-gap table
  columns:
  - gap
  - current public evidence
  - why it is unresolved
  - next diligence ask
  rows:
  - - Active versus registered accounts
    - 84,000+ registered users and app/download proxies
    - No retained source states how many accounts ordered recently
    - Provide monthly active buyers and trailing-12-month ordering accounts
  - - Retention cohorts and revenue retention
    - 70%+ repeat-order claim only
    - No cohort table, NRR, GRR, or churn disclosure
    - Provide monthly or quarterly cohort chart and retention bridge
  - - Top-customer concentration
    - No retained source discloses top-account share
    - Cannot tell whether a few large industrial buyers drive GMV
    - Provide top-10 customer GMV share and sector mix
  - - Named-customer commercial depth
    - Testimonials show satisfaction, not spend or tenure
    - Public sources do not quantify customer-level depth
    - Provide named reference accounts with spend band, tenure, and product mix
  - - Geographic / cluster concentration
    - 18+ states and pan-India language only
    - No state, city, or cluster breakdown of active customers
    - Provide industrial-cluster map of active accounts and service reliability
  - - Service-quality outcomes
    - Testimonials and support language only
    - No OTIF, complaint, refund, or SLA disclosure
    - Provide delivery reliability, complaint rate, and resolution-time metrics
  notes: Each row marks a dimension where the chapter has directional evidence but not the disclosure needed for a clean durability or concentration judgment.
