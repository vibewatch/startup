  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A fuller public or private roster of named JSW One MSME customers with sector, tenure, and buying volume.
    whyItMatters: The retained public file proves that some named customers exist, but it does not show how representative they are of the broader customer base.
    diligencePath: Ask management for a referenceable top-customer sample with sector, order frequency, tenure, and product mix; cross-check against CRM or case-study inventory.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, inactive-account rate, and cohort retention by month or quarter.
    whyItMatters: Without retention metrics, the chapter can only treat repeat orders as a proxy and cannot underwrite durability with confidence.
    diligencePath: Request cohort tables, revenue-retention metrics, and repeat-order frequency by customer vintage during management diligence.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer GMV share, top-10 customer contribution, and vertical or regional concentration of active accounts.
    whyItMatters: Headline user growth can mask concentration risk if a small number of large industrial buyers drive most GMV.
    diligencePath: Request top-account concentration, sector mix, and geography mix from management and reconcile them to monthly GMV.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: active-vs-registered-users
    missingEvidence: A public or private bridge from registered users to recent ordering accounts and finance-active accounts.
    whyItMatters: Registered accounts are useful for scale, but active-ordering accounts matter more for customer quality and monetization.
    diligencePath: Ask for MAU/WAU-style buyer activity, trailing-12-month ordering accounts, and financed-account counts.
    relatedQuestionRefs:
    - QU006
    - QU023
    relatedTableRefs:
    - TU002
    - TU006
  - type: missing-source
    severity: minor
    topic: service-quality-metrics
    missingEvidence: Published OTIF, complaint rates, return rates, refund rates, and resolution-time metrics.
    whyItMatters: Customer testimonials describe positive outcomes, but service consistency is a real risk dimension for a heavy-materials platform.
    diligencePath: Request operational KPI dashboards for delivery performance, complaint volumes, and resolution SLAs by region.
    relatedQuestionRefs:
    - QU015
    - QU024
    relatedTableRefs:
    - TU005
    - TU006
