- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration / friction risk
  - impact
  - diligence path
  rows:
  - - Credit-backed procurement and NBFC growth
    - Customer expansion may depend heavily on lender appetite and underwriting execution
    - Could boost wallet share but also create hidden concentration in financed accounts
    - Request financed-account count, lender concentration, and credit-performance cohorts
  - - More stock points, service centres, and contract-manufacturing locations
    - Service consistency can weaken as the network spreads across industrial hubs
    - Expansion may raise operational complexity before it raises loyalty
    - Request OTIF, complaint rate, and region-level service metrics
  - - Multi-brand catalogue plus private brands
    - Adverse source warns the platform could be seen as a captive JSW sales channel
    - Could limit supplier breadth and reduce buyer trust in marketplace neutrality
    - Request supplier mix, non-JSW GMV share, and brand-level procurement split
  - - Manufacturing- and construction-heavy customer mix
    - Sector exposure may be cyclical and correlated with industrial slowdown
    - Demand concentration risk can hide inside strong aggregate GMV growth
    - Request GMV by end-market, cluster, and project size
  - - Repeat-order moat narrative
    - Public repeat-order data is not tied to top-account concentration or cohort health
    - A few large repeat accounts could overstate broad durability
    - Request top-10 account share, cohort depth, and account frequency distribution
  - - Geographic breadth across 18+ states
    - Public geographic reach does not equal balanced customer density
    - Regional concentration could be high despite pan-India registration
    - Request state-level active buyers, order value, and service-centre coverage
  notes: This table converts growth levers into diligence questions instead of assuming that every expansion vector automatically improves durability.
