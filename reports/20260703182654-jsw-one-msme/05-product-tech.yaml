  evidenceGaps:
  - type: missing-source
    severity: material
    topic: live-finance-ux
    missingEvidence: A current buyer-facing walkthrough showing how credit is applied for, approved, documented, and settled inside the product.
    whyItMatters: The public FAQ still says finance options are launching soon, which leaves open whether the buyer experience is self-serve, assisted, or only selectively available.
    diligencePath: Ask management for current screenshots or demo steps covering finance eligibility, lender choice, approval timing, and repayment mechanics inside the buyer workflow.
    relatedQuestionRefs:
    - QE008
    - QE027
  - type: missing-source
    severity: material
    topic: integration-and-sla
    missingEvidence: Public API, ERP integration, uptime, and service-level documentation for the marketplace and mobile product.
    whyItMatters: Without integration and SLA evidence, investors cannot tell whether the product is easy to embed in MSME procurement operations or how resilient the software layer is under load.
    diligencePath: Request implementation guides, API references, major ERP or lender integration lists, uptime targets, and incident or status-report history.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Named security certifications, external assurance reports, penetration-test summaries, or public software control attestations.
    whyItMatters: The product handles KYC, GST, payment, and lender-linked data, so the absence of visible assurance artefacts leaves a trust gap beyond material-quality controls.
    diligencePath: Request ISO 27001, SOC 2, VAPT, or equivalent assurance artefacts and clarify whether they cover the buyer app, marketplace, and lender workflows.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: fulfilment-footprint-detail
    missingEvidence: Named locations, throughput, ownership model, and partner roster for stock points, service centres, and contract-manufacturing sites.
    whyItMatters: The execution network is central to the product promise, but public sources only provide aggregate counts rather than the footprint detail needed to verify coverage and redundancy.
    diligencePath: Request a current network map with owned versus partner sites, product categories served at each site, and on-time/in-full performance by region.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE003
    - TE005
  - type: stale
    severity: minor
    topic: faq-freshness
    missingEvidence: An updated buyer help surface that reconciles finance availability, payment rules, and exception handling with the 2025-2026 corporate disclosures.
    whyItMatters: Mismatch between buyer FAQs and company-level financing claims can confuse customers and makes product maturity harder to judge from public sources.
    diligencePath: Ask the company to show the current help-centre update cadence, ownership, and the date of the last finance-workflow content refresh.
    relatedQuestionRefs:
    - QE008
    - QE027
    relatedTableRefs:
    - TE002
    - TE005
