- id: trust-quality-and-compliance
  title: Trust, quality, and compliance controls
  body: |-
    JSW One MSME’s trust layer is strongest where the workflow touches documents, tolerances, and returns. Public support pages disclose a specific cadence for test certificates and seller weighment slips: applicable certificates and weighment slips are emailed within three days from invoicing, and endorsed test certificates can be requested directly from support. Quality exceptions are also shaped as explicit process steps rather than vague promises. Buyers can raise material-quality complaints within 48 hours of delivery, partial returns are allowed, and re-weighment is permitted when discrepancies exceed +/-0.5% of invoiced weight. At the same time, the formal returns policy is not buyer-friendly in the consumer sense: the company does not treat “no longer need it” as a valid return reason, serviced quantity can vary by +/-10%, and re-weighment charges are not refunded.

    The broader compliance layer is visible but incomplete. The privacy policy shows that the platform collects KYC documents, GST registrations, contact details, browsing data, and order or transaction communications, while also routing payments through a third-party gateway and lender information flows when financing is involved. Product-quality messaging is stronger on the materials side than on cyber-security disclosure: One Helix private-brand pages emphasize traceability, certificates, and manufacturing tolerances, and the TMT campaign explicitly foregrounds BIS certification. But this run did not surface public uptime commitments, external status tooling, or named security certifications. That does not prove the controls are absent; it only means the public trust surface is deeper on material-quality assurance than on software assurance.
