chapter:
  number: 5
  title: Product & Technology
  summary: 'JSW One MSME’s public product surface is a procurement workflow, not a thin catalogue: buyers can browse industrial materials, request pricing, pay through assisted bank rails, choose fulfilment modes, and resolve documentation or quality issues through defined support paths and mobile apps. The strongest product-tech proof is operational—JIT delivery language, document workflows, private brands, stock points, contract manufacturing, and NBFC-backed credit—while the weakest proof is around software assurance, integrations, and live self-serve finance UX. That makes the platform’s differentiation credible on supply-plus-service orchestration, but still under-disclosed on API, SLA, and security posture.'
sections:
- id: product-surface-and-buyer-workflow
  title: Product surface and buyer workflow
  body: |-
    JSW One MSME’s public product surface is concrete enough to map as a procurement workflow, not just as a marketing slogan. Official marketplace, app-store, and group pages consistently describe a digital route for manufacturing and construction MSMEs to source steel and building materials, while the app listings make the workflow more specific: buyers can request pricing, track delivery, and manage invoices from a mobile surface. The retained catalogue evidence shows that the product family is broad across industrial materials rather than limited to a single steel SKU: steel variants, structural steel, TMT, cement, coated products, bitumen, and wire-rod families are all visible, and the iPhone listing further adds stainless steel to the public assortment.

    The workflow is still visibly assisted by people and operations. Payment does not appear as a generic self-serve checkout: the buyer FAQ says the order is paid through a link sent by the sales representative during order confirmation, and delivery exceptions such as faster dispatch or special instructions are also routed through sales before the order is placed. That is important product context. JSW One is selling a workflow that combines category breadth with operational handoff, not a pure catalogue checkout. This is also why the public buyer experience exposes fulfilment choices and documentation steps directly: the disclosed product promise is less about a purely software-native cart and more about managing the decision, dispatch, and evidence trail around industrial procurement.
