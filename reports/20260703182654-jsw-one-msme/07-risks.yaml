- id: monitoring-mitigation-kill-criteria
  title: Mitigation posture, residual exposure, and kill criteria
  body: 'The mitigating case is not empty. JSW One does have explicit policies, strategic funding, a growing lender roster, and enough scale to attract serious counterparties. But the residual exposure remains material because several of the most investment-relevant datapoints are still outside the public record. The IPO path remains pre-prospectus; public disclosure still depends on management interviews, press releases, and transaction notes rather than audited risk-factor language. Embedded finance is strategically important, but public sources do not disclose lender concentration, approval funnels, delinquency, or loss rates. Operationally, public sources show workflow features and support routes but not OTIF, refund-cycle, complaint-rate, or incident metrics. On the ownership side, parent-group integration is explicit, yet public disclosure does not show supplier mix, non-JSW GMV share, or related-party exposure in enough detail to clear neutrality concerns. A disciplined investor should
    therefore treat kill criteria as monitorable: if credit-linked order flow weakens, if fulfilment reliability slips, if disclosure stalls while IPO timing accelerates, or if parent-group controversies widen, the underwriting case should tighten quickly rather than assume brand strength will absorb the shocks.'
