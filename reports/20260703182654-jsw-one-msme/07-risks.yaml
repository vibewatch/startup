callouts:
- calloutType: risk
  title: Conflict-of-interest risk is strategic, not cosmetic
  body: JSW One openly leans on JSW Group manufacturing strength while management also says the platform is not trying to become a broad multi-seller marketplace. That combination can be commercially powerful, but it weakens the neutrality claim unless supplier-mix and related-party disclosure improve.
  claimRefs:
  - CR004
  - CR006
  - CR038
- calloutType: risk
  title: Embedded finance is a demand engine and a risk transmission channel
  body: A platform where over a third of orders or about 40% of GMV uses short-tenor working-capital credit should be analysed partly like a credit-dependent demand engine. Lender pullback can hit GMV before it ever appears as a direct balance-sheet loss at JSW One.
  claimRefs:
  - CR011
  - CR012
  - CR039
- calloutType: recommendation
  title: Kill criteria should focus on disclosure, lender resilience, and OTIF proof
  body: Do not let the pre-IPO narrative outrun the diligence packet. If lender concentration, loss metrics, service reliability, or related-party mix remain opaque while listing prep accelerates, the right response is to tighten underwriting assumptions rather than give management the benefit of the doubt.
  claimRefs:
  - CR014
  - CR042
  - CR043
