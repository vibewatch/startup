- id: TR003
  title: Partner / dependency risk register
  columns:
  - dependency
  - counterparty / node
  - role
  - concentration signal
  - failure scenario
  - severity
  - mitigation
  - residual exposure
  rows:
  - - Third-party lender network
    - ICICI, IndusInd, Yes Bank, Axis, Standard Chartered, TCL, Kotak, IDBI, Mizuho, others
    - Funds a large share of orders/GMV on 60–90-day credit
    - High strategic dependence; lender-level concentration undisclosed
    - Approval tightening or collections stress reduces conversion and repeat buying
    - High
    - Grow JOFL selectively, diversify lenders, and pre-map fallback credit products
    - Without lender concentration and loss data, exposure remains materially under-disclosed.
  - - JSW One Finance
    - JOFL / in-house NBFC
    - Captures part of financed demand and supports group ecosystem credit
    - AUM or loan book still small relative to marketplace flow
    - Capital, compliance, or credit-performance miss limits internal fallback capacity
    - High
    - Capitalise the NBFC, align policy to RBI directions, and keep governance ring-fenced
    - Public delinquency and NPA metrics are not disclosed.
  - - JSW Group manufacturing and supply base
    - JSW Steel and broader group ecosystem
    - Brand, supply strength, and strategic capital anchor the marketplace
    - Parent integration is explicit in official messaging
    - Related-party preference or external perception weakens marketplace neutrality
    - High
    - Increase supplier-mix transparency and formalise conflict-management governance
    - Public non-JSW GMV share and supplier concentration are not disclosed.
  - - Processing / stock / contract-manufacturing network
    - 13 processing centres, 14 stock points, ~7 contract-manufacturing locations
    - Converts supply access into fulfilment capacity
    - Many nodes must integrate in real time
    - A single-node failure creates OTIF, margin, or documentation knock-on effects
    - Medium-to-high
    - Instrument node-level monitoring and contingency sourcing
    - No public node-level redundancy, utilisation, or downtime metrics are available.
  - - Transportation and service network
    - JSW One Transportation Services plus service centres and seller logistics
    - Handles last-mile, part-truckload, complaint response, and JIT fulfilment
    - Reliability promise is high but operating mix is opaque
    - Escalations, claims, or delivery misses damage trust faster than raw GMV reveals
    - Medium-to-high
    - Track regional partner scorecards, complaint closure, and exception routing
    - Public disclosure does not separate owned, partner, and seller-controlled delivery legs.
  - - Public-market window
    - Investment bankers, pre-IPO investors, public-market buyers
    - Funds growth and provides valuation benchmark
    - IPO path is timing-sensitive and disclosure-sensitive
    - Weak market window or weak disclosure delays fundraising and compresses valuation
    - High
    - Sequence DRHP readiness behind operational and credit-quality proof points
    - The path remains exposed to macro sentiment and internal readiness at the same time.
  notes: This register treats lenders, parent-group supply, fulfilment nodes, and market access as dependencies rather than just growth enablers.
