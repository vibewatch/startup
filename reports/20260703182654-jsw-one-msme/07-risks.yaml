  evidenceGaps:
  - type: missing-source
    severity: material
    topic: lender-concentration-and-credit-performance
    missingEvidence: Lender-by-lender concentration, approval rates, delinquency, bounce, and loss-vintage data for financed orders and JOFL books.
    whyItMatters: Without concentration and loss performance, the platform’s largest financial dependency cannot be underwritten cleanly.
    diligencePath: Request lender scorecards, approval funnels, delinquency buckets, charge-offs, and vintage curves split by partner and JOFL.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: service-reliability-and-claims-metrics
    missingEvidence: OTIF, shortage claims, complaint rates, refund cycle times, and resolution SLAs by region or category.
    whyItMatters: The core operating promise is reliable fulfilment, but public materials do not show whether reliability scales with growth.
    diligencePath: Request monthly operations dashboards with OTIF, damage claims, shortage claims, complaint closure, and refund turnaround metrics.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: security-assurance-and-incident-disclosure
    missingEvidence: Independent security certifications, audit summaries, incident reporting history, and platform uptime or SLA commitments.
    whyItMatters: The app mediates ordering, ledgers, payments, and customer data, so weak assurance can impair both trust and compliance.
    diligencePath: Ask for ISO or equivalent certifications, security-audit reports, incident logs, and customer-facing uptime commitments.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: supplier-mix-and-related-party-exposure
    missingEvidence: Supplier mix, non-JSW GMV share, related-party purchase share, and governance rules for allocating JSW versus non-JSW inventory.
    whyItMatters: Marketplace-neutrality risk is hard to size without knowing how concentrated the commercial book is around group supply.
    diligencePath: Request supplier cohort tables, related-party revenue share, non-JSW inventory share, and conflict-management committee materials.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: pre-ipo-risk-factor-disclosure
    missingEvidence: DRHP-level risk factors, related-party disclosure, audited segment detail, and embedded-finance risk metrics.
    whyItMatters: The public-market story is moving faster than the public diligence packet, which raises valuation and governance risk.
    diligencePath: Request the internal IPO readiness tracker, draft risk-factor list, and disclosure committee materials before underwriting a listing thesis.
    relatedQuestionRefs:
    - QR015
    - QR016
    relatedTableRefs:
    - TR001
    - TR004
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A complete legal docket and regulator-correspondence pack covering JSW One itself, JOFL, and all material parent-linked spillover matters.
    whyItMatters: The register is severity-ranked from public sources, but private notices or non-public regulator exchanges could materially change prioritisation.
    diligencePath: Obtain litigation schedules, regulator notices, compliance certifications, and internal materiality logs from management and counsel.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR019
    - QR020
    relatedTableRefs:
    - TR001
