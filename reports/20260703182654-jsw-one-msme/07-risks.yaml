- id: operating-credit-dependencies
  title: Operating, quality, and credit dependencies
  body: 'Operationally, JSW One’s model pushes complexity into the middle of the customer promise. Company and app materials promise reliable procurement, verified logistics, delivery tracking, documentation, and integrated finance, while management interviews describe 13 processing centres, 14 stock points, seven contract-manufacturing sites, a JIT network, and a fully owned transportation arm. At the same time, the return and support regime is relatively tight from a buyer perspective: quality complaints generally need to be raised within 48 hours, the company allows quantity variation against the order, and seller-side verification plus reverse logistics sit outside a fully owned service loop. Embedded finance raises a second dependency chain. More than one-third of orders, or about 40% of GMV by one public estimate, use 60–90-day funding that is mostly underwritten by partner lenders rather than by JSW One itself. That means service friction, lender pullback, or collections deterioration
    can directly reduce conversion, repeat ordering, and unit economics rather than showing up as a contained back-office problem.'
