chapter:
  number: 3
  title: Competitors
  summary: JSW One competes most directly with OfBusiness and Infra.Market, while Moglix, Amazon Business, Udaan, Metalbook, SteelBazaar, Zetwerk, and GeM matter as broader procurement, metals-specific, manufacturing, or public-procurement substitutes. The retained evidence shows real category breadth and financing parity across the field, but weak public proof on realized pricing, retention, and credit performance. That leaves JSW's moat looking credible on materials focus and ecosystem support, but not yet publicly proven as structurally unique.
sections:
- id: landscape-and-buyer-jobs
  title: 'Landscape: direct materials peers, adjacents, substitutes, and status quo'
  body: 'The competitive set around JSW One is wider than a simple steel-marketplace peer list. The closest direct peers are the platforms that explicitly sell or enable steel, metals, or construction-material procurement with some credit or logistics support: OfBusiness, Infra.Market, Metalbook, and smaller specialist SteelBazaar. Moglix is important, but its retained evidence skews toward enterprise procurement software, MRO, vendor management, and supply-chain financing across many industries rather than a heavy-materials-first buying job. Zetwerk is adjacent again: it competes for manufacturing and sourcing wallet share through contract manufacturing and industrial build programs more than through commodity-led marketplace depth. On the substitute side, Udaan and Amazon Business can still take procurement share because many MSMEs buy more than steel or cement; they value catalog breadth, working-capital support, GST compliance, and dependable delivery even when the platform is not materials-specialized.
    GeM represents the most powerful status-quo or public-procurement alternative because it already operates at national scale and now has explicit steel-industry onboarding through ISA.'
