tables:
- id: TP001
  title: Buyer job / competitor class map
  columns:
  - buyer job
  - best-matched alternatives
  - why buyer might choose them
  - where JSW is advantaged
  - main evidence gap
  rows:
  - - Heavy-material procurement for manufacturing and construction MSMEs
    - JSW One, OfBusiness, Infra.Market, Metalbook, SteelBazaar
    - Steel or construction-material specificity, procurement support, and some form of financing or logistics
    - JSW is explicitly built around manufacturing and construction MSMEs, steel/cement depth, and partner-credit execution
    - Realized pricing and retention data are not public
  - - Enterprise procurement across many indirect or MRO categories
    - Moglix, Amazon Business
    - Broader catalogs, procurement workflows, analytics, GST or compliance tooling, and easier long-tail sourcing
    - JSW stays closer to heavy materials than to generic enterprise spend
    - Category-level mix and realized enterprise contract terms remain undisclosed
  - - Construction build-out with own brands and omnichannel distribution
    - Infra.Market
    - House-of-brands model, manufacturing footprint, and 17,256 retail touchpoints support both project and retail demand
    - JSW benefits from upstream steel and cement ecosystem links rather than a broad in-house brand portfolio
    - Customer concentration and channel mix are not public
  - - Custom industrial build or manufacturing execution
    - Zetwerk, Metalbook, SteelBazaar
    - Contract manufacturing or customization matters more than commodity buying alone
    - JSW is more focused on procurement and materials access than on custom manufacturing delivery
    - Win-loss proof versus manufacturing specialists is not public
  - - Public procurement or tender-linked buying
    - GeM plus ISA-linked sellers
    - Tender compliance, government buying workflows, and B2G scale can outweigh private-platform features
    - JSW can still serve private projects and fast-turn commercial procurement better than a public-procurement rail
    - Heavy-material share of GeM versus private platforms is not quantified in retained sources
  - - General small-business replenishment or tail-SKU buying
    - Amazon Business, Udaan
    - Catalog breadth, mobile ordering, GST support, and broad delivery can absorb non-core procurement spend
    - JSW is more specialized for steel and project materials than for general replenishment
    - Share-of-wallet between specialist and generalist rails is not public
  notes: Rows map buyer jobs to the best-supported alternative rails; unknown offline-share percentages remain an explicit diligence gap rather than a guessed market split.
