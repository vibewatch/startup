  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized steel or cement pricing, discount curves, and contract terms for JSW One and direct peers remain undisclosed in public sources.
    whyItMatters: Without realized pricing and rebate terms, the chapter can compare list or quote surfaces but cannot prove enduring price leadership or margin room.
    diligencePath: Request anonymized customer invoices, standard contract templates, and discount policy ranges for JSW One, OfBusiness, Infra.Market, and Metalbook.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: credit-loss-disclosure
    missingEvidence: Portfolio loss rates, default vintages, and realized take rates for embedded-finance products are not publicly disclosed across the direct-peer set.
    whyItMatters: Finance is advertised by many competitors, but absent credit-performance data prevents underwriting whether the feature is moat-creating or balance-sheet destructive.
    diligencePath: Request portfolio vintage decks, NPA metrics, loss curves, and partner-bank economics for JSW credit facilitation, Oxyzo, Udaan, and any Moglix finance programs.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
  - type: missing-source
