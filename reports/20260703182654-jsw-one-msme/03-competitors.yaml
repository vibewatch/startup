- id: substitutes-pricing-and-procurement-rails
  title: Substitutes, pricing surfaces, and procurement rails outside the direct peer set
  body: The substitute pressure comes from buyer behavior, not only from perfect category overlap. Udaan addresses small-business replenishment with credit and fast delivery, but the retained evidence keeps it in FMCG, pharma, staples, and HoReCa rather than in steel or cement. Amazon Business is the most credible horizontal substitute because it combines GST invoices, compliance tooling, bulk discounts, broad MRO and industrial assortment, nationwide delivery, and 30-day interest-free credit. GeM is even more structurally important wherever public-sector work or compliant tendering matters; the platform already processes procurement at multi-trillion-rupee scale and has explicit steel-industry onboarding. Across the set, pricing transparency is weak. Metalbook and Amazon show the clearest public price signals, Moglix exposes catalog-style product pricing on standard items, and OfBusiness offers price access behind login and quote flows, but Infra.Market and Udaan remain mostly quote-led
    in the retained public evidence. That means buyers may compare these options on credit access, delivery reliability, or compliance as much as on visible headline price.
