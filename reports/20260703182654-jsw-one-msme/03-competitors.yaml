- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat source
  - severity
  - why the threat is credible
  - mitigation or diligence ask
  rows:
  - - Materials specificity protects JSW
    - OfBusiness, Infra.Market, Metalbook, and SteelBazaar already market steel or construction-material depth
    - High
    - The direct-peer set is already vertically aligned to the same buyer job, so category focus alone is not scarce
    - Request win-loss cases showing why buyers chose JSW over OfBusiness and Infra.Market
  - - Embedded finance creates lock-in
    - Finance is advertised by JSW, Oxyzo, Moglix, Udaan, Amazon Business, Metalbook, and planned on GeM
    - High
    - Credit support is common; the missing proof is who prices risk better and converts it into repeat share of wallet
    - Request portfolio performance, repayment curves, and attach rates by product and buyer cohort
  - - Distributor reach is an incumbent weakness
    - Infra.Market's 17,256 touchpoints and GeM's scale show large-channel alternatives still exist
    - Medium
    - Offline and public channels remain material, but no retained source quantifies their share against digital rails
    - Request channel-share studies and distributor win-loss evidence
  - - Compliance is a secondary buying criterion
    - Amazon Business and GeM both lead with GST, compliance, or procurement governance tooling
    - Medium
    - Horizontal or public-procurement rails can win spend even without material specialization when governance matters most
    - Test whether JSW needs stronger compliance workflows for larger institutional buyers
  - - Opaque pricing can still support margin
    - Most direct peers are quote-led; only Metalbook and Amazon expose broad public price signals
    - Medium
    - Opacity may hide service value, but it also makes sustainable price leadership hard to prove
    - Request realized pricing and rebate disclosures for key materials
  - - Capital access guarantees durability
    - Udaan losses and layoffs plus Infra.Market and Zetwerk IPO dependence show funding is still a live strategic variable
    - High
    - The category remains working-capital and logistics intensive even for scaled players
    - Ask for cash-cycle, inventory, and financing dependency disclosures
  - - Governance cleanliness is not a differentiator
    - Infra.Market historical tax-scrutiny reports and sectorwide scrutiny weaken trust narratives
    - Medium
    - Historical probes do not equal current failure, but they can matter in enterprise or institutional buying decisions
    - Request compliance certifications, audit history, and customer objection handling
  - - Multi-homing is low once a buyer picks a rail
    - Public retention, reorder, and share-of-wallet evidence is missing across the cohort
    - High
    - Without retention data, it is safer to assume buyers can split categories across several platforms
    - Request cohort retention, repeat-order rates, and active-buyer concentration by segment
  notes: Severity reflects underwriting impact, not certainty of failure; the right read is that moat proof still depends on private customer and credit-performance evidence.
