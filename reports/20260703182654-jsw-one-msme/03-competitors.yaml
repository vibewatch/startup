- id: TP002
  title: Competitor profile table
  columns:
  - competitor
  - class
  - disclosed scale or backing signal
  - target segment
  - differentiation
  - main limitation
  rows:
  - - JSW One MSME
    - Subject / direct materials platform
    - FY25 GMV ₹12,567 crore; 84,000+ registered MSMEs; ~₹3,800 crore credit facilitated; ~2 million tonnes steel
    - Manufacturing and construction MSMEs
    - Materials specificity plus partner-credit procurement and JSW ecosystem credibility
    - Public proof of retention, realized pricing, and credit quality is thin
  - - OfBusiness
    - Direct peer
    - 500K+ orders; 2 million+ SMEs; FY24 revenue ₹19,296.3 crore; Oxyzo FY25 revenue ₹1,207 crore
    - Manufacturing, infrastructure, contractors, SMEs buying raw materials
    - Closest mix of raw-material procurement and dedicated financing through Oxyzo
    - Realized pricing, credit-loss quality, and customer concentration remain undisclosed
  - - Infra.Market
    - Direct peer
    - 283+ manufacturing facilities; 17,256 retail touchpoints; Series G at ~₹24,600 crore valuation
    - Contractors, developers, retailers, construction and infrastructure buyers
    - House-of-brands construction platform with large omnichannel footprint
    - Historical tax-scrutiny overhang and higher debt or capex intensity
  - - Moglix
    - Broad procurement suite / adjacent peer
    - 500,000+ products; about $2.6 billion valuation; FY24 revenue ₹4,735.6 crore
    - Enterprise procurement across cement, metals, MRO, infrastructure, and multi-industry buying
    - Workflow tooling, financing, analytics, and custom fabrication beyond simple catalog sales
    - Less heavy-material specific than JSW or OfBusiness in retained evidence
  - - Udaan
    - Adjacent substitute
    - $114 million raised in Jun-2025 at ~$1.8 billion valuation; FY24 revenue ₹5,706.6 crore
    - Small-business buyers in FMCG, staples, pharma, HoReCa, and fresh
    - Small-business scale, credit, and mobile ordering
    - Category focus is not steel/cement and losses or layoffs remain visible
  - - Amazon Business India
    - Horizontal substitute
    - 15+ crore products; 3.5+ lakh sellers; 99.8% pin-code coverage; 50M+ MSME access path
    - SMEs, institutions, and enterprises buying general supplies, MRO, and compliant tail spend
    - GST, compliance, bulk discounts, and 30-day credit at national scale
    - Not a heavy-material specialist and weaker on project-specific materials workflows
  - - Metalbook
    - Direct peer
    - 3,000+ suppliers; 850k+ MT delivered; 15+ lending partners; 2,500+ SMEs and enterprises
    - Metals buyers, fabricators, recyclers, and industrial projects
    - Metals-specific marketplace with visible price feeds, financing, logistics, and contract manufacturing
    - Current independent financial disclosure is thinner than OfBusiness or Infra.Market
  - - SteelBazaar
    - Niche direct peer
    - Bootstrapped; 15,000+ SKUs; 100+ customization services; 51-200 employees
    - Steel buyers across construction, automotive, energy, and packaging
    - Steel-only AI-led marketplace with financing and customization messaging
    - Smaller disclosed scale and thinner independent proof than larger peers
  - - Zetwerk
    - Adjacent manufacturing substitute
    - Planned ~$750 million IPO; ~$3.1 billion valuation; 3,500+ customers
    - Industrial buyers needing manufacturing execution, components, or custom builds
    - Contract manufacturing depth and industrial execution scale
    - Not a commodity-procurement-first buyer rail in retained evidence
  - - GeM
    - Status-quo / public-procurement rail
    - ₹18.4 trillion cumulative GMV; ₹5 trillion FY26 GMV; 68% of FY26 orders from MSMEs
    - Government-linked or tender-driven procurement
    - Procurement compliance, public-sector scale, and steel-industry onboarding through ISA
    - Not a private-sector materials operating system for everyday MSME procurement
  notes: Scale markers mix GMV, revenue, users, valuation, or footprint because private-company disclosure is not standardized; unknown means the retained public evidence does not support a cleaner apples-to-apples metric.
