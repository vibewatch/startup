- id: TP004
  title: Pricing / packaging comparison
  columns:
  - platform
  - visible pricing surface
  - ordering or contract model
  - finance or payment support
  - what remains unsupported
  - implication
  rows:
  - - JSW One MSME
    - No broad public price sheet retained
    - Marketplace onboarding and assisted procurement
    - Partner-credit facilitation disclosed
    - Realized steel or cement discount curves, contract terms, and take rates
    - Differentiation may depend more on execution than on visible list price
  - - OfBusiness
    - Raw-material prices available behind login and quote flows; 1% lower-rate claim
    - Quote-led procurement with assisted sourcing
    - Oxyzo product suite and working-capital support
    - Realized prices by product, credit losses, and customer-level rebate terms
    - Strong finance bundle, but public evidence is still marketing-heavy on pricing
  - - Infra.Market
    - No broad public list pricing retained
    - Direct sales plus retail/distributor network
    - No standalone public finance product clearly retained
    - Contract pricing, discount policy, and payment terms by channel
    - Scale is clear, but price leadership is not publicly provable
  - - Moglix
    - Public catalog pricing on standard products; enterprise pages are contact-led
    - Catalog plus enterprise procurement workflows and ARCs
    - Supply-chain financing, channel financing, and invoice discounting
    - Large-enterprise negotiated pricing and realized savings by customer
    - Better transparency on catalog items than direct materials peers, but enterprise realized pricing stays opaque
  - - Udaan
    - No detailed public price list retained
    - App-led wholesale ordering for small businesses
    - Business credit advertised
    - Realized category pricing, logistics economics, and repayment performance
    - Broad substitute for small-business spend, not a transparent heavy-material benchmark
  - - Amazon Business India
    - Public prices, bulk discounts, GST-enabled catalog, and pay-later terms
    - Self-serve online ordering with bulk-assist support
    - Amazon Pay Later and 30-day interest-free credit
    - Net realized enterprise discounts by segment and category-specific heavy-material economics
    - Strongest public transparency for general procurement, but weak as a steel-specific benchmark
  - - Metalbook
    - Live city-level metal and commodity prices are visible on-site
    - Marketplace and assisted sourcing
    - Financing solutions plus 15+ lending partners
    - Contract-specific spreads, service fees, and credit-loss performance
    - Most transparent price-discovery model among direct metals peers in retained evidence
  - - SteelBazaar
    - Unknown in retained evidence
    - Marketplace model claimed; contract terms not retained
    - Financing options claimed in secondary profiles
    - Actual public price surfaces and contract structure
    - Interesting niche challenger, but pricing proof is still sparse
  - - GeM
    - Tender, bid, and rate-contract process rather than open catalog pricing
    - Public-procurement workflows
    - Financing interface for steel MSMEs was planned via GeM authorities
    - How often heavy-material buyers compare GeM bids against private-platform quotes
    - Important substitute for compliant or tender-linked buying rather than day-to-day private procurement
  notes: Unknown or unsupported cells are preserved explicitly because public pricing and realized procurement economics remain the largest unresolved diligence gap across the set.
