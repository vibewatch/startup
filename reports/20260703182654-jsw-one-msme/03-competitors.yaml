- id: direct-materials-and-enterprise-procurement
  title: Direct materials platforms versus broader enterprise procurement suites
  body: 'OfBusiness is the closest disclosed direct peer because its official surface looks like a heavier-duty version of JSW’s own proposition: raw-materials procurement across steel and construction-adjacent categories, explicit credit through Oxyzo, and stronger published scale claims on orders, SMEs, SKUs, and operating revenue. Infra.Market is the other major direct threat, especially in construction and project procurement, because it has expanded into a multi-category building-materials house of brands with owned and partner manufacturing, B2B direct sales, and a very large retail touchpoint network. Moglix matters differently. It is less centered on heavy materials, but its enterprise-procurement stack—automation, analytics, vendor consolidation, financing, and custom fabrication—makes it a credible horizontal procurement rail wherever buyers value workflow control over vertical specialization. Zetwerk should be read as adjacent rather than direct: it overlaps when buyers want contract
    manufacturing or industrial execution, not simply commodity procurement. In practice this means JSW competes simultaneously against like-for-like materials rails and broader procurement systems that can capture adjacent buyer jobs.'
