- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - public value/status
  - what it funds or exposes
  - confidence
  - underwriting implication
  - diligence ask
  rows:
  - - Cash on hand
    - null
    - Not disclosed in retained public sources
    - Low
    - Cannot translate recent fundraises into runway or minimum liquidity covenant headroom.
    - Request FY25 audited cash balance and monthly treasury forecast.
  - - Historical burn proxy
    - FY24 net loss ₹277 crore, or about ₹23.1 crore per month
    - Backward-looking accounting loss only
    - Medium
    - Useful caution sign, but not a substitute for FY25/FY26 cash burn.
    - Request cash burn bridge, not just P&L loss.
  - - 2025 equity capital
    - ₹340 crore round plus ₹575 crore round; cumulative equity raised about ₹1,120 crore
    - Tech, logistics, service network, private brands, NBFC capitalization
    - Medium
    - Shows access to capital, but not whether the core business is now self-funding.
    - Reconcile round proceeds to current balance sheet.
  - - NBFC base and target
    - Current loan book/AUM about ₹100 crore; target ₹500 crore by year-end
    - Capital adequacy must support a five-fold expansion goal
    - Medium
    - Finance growth may absorb significant capital before IPO readiness is proven.
    - Provide NBFC capital ratio, leverage plan, and lender lines.
  - - Monthly partner-led credit flow
    - ₹475-500 crore of 60-90 day inventory funding each month; over one-third of orders use credit
    - Working-capital exposure sits largely in the lender ecosystem
    - Medium
    - External lender appetite is a key dependency even if balance-sheet debt is not publicly disclosed.
    - Provide lender concentration and take-out terms.
  - - Next-round trigger
    - Management targets break-even in FY26; pre-IPO round of ₹650-700 crore and IPO of $350-400 million were reported in June 2026
    - Future equity may still be part of the operating plan
    - Medium
    - Capital adequacy depends on meeting profitability and market-timing milestones.
    - Provide banker materials, board plan, and downside scenario without IPO proceeds.
  - - Debt or project-finance obligations
    - null
    - No retained public source quantified balance-sheet debt or project-finance facilities
    - Low
    - The visible financial risk is credit and working-capital dependence, not disclosed term debt.
    - Request debt schedule, charges, and off-balance-sheet commitments.
  notes: Null means the public record does not quantify the item directly; the table distinguishes historical proxies from current liquidity evidence.
