callouts:
- calloutType: insight
  title: Revenue quality looks closer to integrated commerce than to a thin marketplace
  body: Public FY25 revenue of ₹3,976 crore against GMV of ₹12,567 crore implies about a 31.6% monetization ratio, while the product stack includes processing, private brands, logistics, and finance. That is too rich to read as a simple low-take-rate marketplace without additional distribution-style revenue recognition.
  claimRefs:
  - CI003
  - CI009
  - CI022
  - CI059
- calloutType: risk
  title: Credit exposure is a core operating dependency, not a side feature
  body: More than one-third of orders use credit, monthly inventory-funding flows reach roughly ₹475-500 crore, and the visible NBFC base is far smaller than that flow. If lender appetite or credit performance weakens, growth and margin could both compress before the public market window opens.
  claimRefs:
  - CI013
  - CI014
  - CI026
  - CI027
  - CI058
- calloutType: recommendation
  title: Underwrite the filings, not the GMV press release
  body: The company has enough public traction to merit serious diligence, but not enough public disclosure to justify a clean financial-quality conclusion. Audited FY25 statements, cash, margin, and credit-loss data are the minimum unlocks for a real underwriting view.
  claimRefs:
  - CI001
  - CI054
  - CI055
  - CI056
  - CI060
