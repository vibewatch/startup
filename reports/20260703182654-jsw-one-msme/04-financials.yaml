- id: working-capital-loop-and-unit-economics-proxies
  title: Working-capital loop and unit-economics proxies
  body: 'The strongest publicly visible unit-economics signal is credit intensity, not gross margin. Mint said more than one-third of orders avail credit and mapped that to roughly ₹475-500 crore of 60-90 day inventory funding every month, while the June 2026 ET interview said around 40% of GMV is on credit with roughly ₹500 crore disbursed monthly through third-party lenders. That is consistent with the official FY25 credit-facilitation figure of ₹3,800 crore, and it shows why underwriting the business requires more than a top-line GMV chart. Even if the in-house NBFC only had about ₹100 crore of loan book or AUM at the time, the partner-funded credit rail was already materially larger, which suggests external lender appetite remains a core dependency in the conversion funnel.


    Public proxies also suggest the fulfilment engine matters economically. ET said JSW One had built 13 steel processing centres and a transportation arm, while later funding coverage cited 14 stock points and about seven contract-manufacturing locations. That footprint supports the idea that revenue recognition likely includes more than a software fee, because product processing, branded material, and logistics coordination appear embedded in the offer. The public proxy numbers therefore cut both ways: growth is strong, with an estimated FY24-to-FY25 revenue increase of about 179.6% and a current monthly GMV run-rate above the FY25 average, but the same data also show a working-capital-heavy model whose economics cannot be judged cleanly without credit-loss, spread, and fulfilment-margin data.'
