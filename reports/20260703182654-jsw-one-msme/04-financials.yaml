  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, unrestricted liquidity, and management runway assumptions at the subsidiary level.
    whyItMatters: Without cash and runway data, the latest equity rounds cannot be translated into solvency headroom or next-round timing confidence.
    diligencePath: Request FY25 audited standalone financial statements, monthly cash bridge, and board-approved FY26 operating plan.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: gross-margin-and-cac
    missingEvidence: Gross margin, contribution margin, CAC, payback, and retention by product or customer cohort.
    whyItMatters: Revenue is scaling quickly, but public data cannot show whether growth is economically attractive or merely inventory-heavy pass-through.
    diligencePath: Request FY25 product-level P&L, cohort retention, sales-efficiency dashboard, and gross-to-net revenue bridge.
    relatedQuestionRefs:
    - QI023
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: credit-loss-and-collections
    missingEvidence: Credit-loss rates, write-offs, DPD buckets, lender take-out terms, and JSW One Finance collection vintages.
    whyItMatters: Working-capital finance is a central conversion lever, so hidden credit losses could overwhelm the apparent asset-light narrative.
    diligencePath: Request lender MIS, NBFC portfolio tape, delinquency cohorts, and policy exceptions for the top 20 borrower groups.
    relatedQuestionRefs:
    - QI024
    - QI027
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing-and-take-rate
    missingEvidence: Invoice-level realized pricing, discount waterfalls, and category take rates versus the quote-led public positioning.
    whyItMatters: Public claims about predictable pricing do not reveal whether margin comes from spread, service fees, processing, brands, or embedded finance.
    diligencePath: Request anonymized invoices, SKU-level gross margin, and a quote-to-recognition bridge for steel, cement, and private-brand orders.
    relatedQuestionRefs:
    - QI011
    - QI026
    relatedTableRefs:
    - TI002
    - TI005
  - type: conflicting-data
    severity: material
    topic: public-data-mirror-conflict
    missingEvidence: A single audited FY25 income statement that reconciles media-reported revenue with the incomplete ranges shown on public data mirrors.
    whyItMatters: Conflicting open-data mirrors lower confidence in any unsupported mirror metric and block blind reliance on scraped databases.
    diligencePath: Obtain the FY25 AOC-4 filings or signed audited accounts and reconcile them against Tofler, InstaFinancials, and management interviews.
    relatedQuestionRefs:
    - QI025
    - QI027
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-cohorts-and-concentration
    missingEvidence: Repeat-order rates, active-buyer counts, top-customer concentration, and segment-level revenue split beyond the 82/18 mix.
    whyItMatters: Registered-user counts and GMV do not show whether growth is broad-based, concentrated, or dependent on a small set of credit-intensive accounts.
    diligencePath: Request cohort tables by industry, top-20 customer exposure, repeat-order frequency, and active-buyer definitions used in board reporting.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
