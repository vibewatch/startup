- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Current status
  rows:
  - - Current cap table and term sheets
    - Post-money valuation, share classes, liquidation preferences, anti-dilution, board rights
    - Without terms, the current headline price is not an underwriting-grade price.
    - Management data room plus counsel confirmation against signed documents.
    - Not public
  - - Audited FY25 and YTD FY26 financials
    - Revenue bridge, gross margin, EBITDA, cash, working capital, and balance-sheet detail
    - Scale alone does not justify a markup without earnings-quality evidence.
    - Audited statements, management accounts, and budget pack.
    - Not public
  - - Credit cohort and lender economics
    - Lender concentration, approval rates, DPD buckets, losses, and realized spread
    - About 40% of GMV is tied to credit in management commentary, so hidden stress can reset valuation.
    - NBFC and partner-lender MIS plus cohort vintage tables.
    - Not public
  - - Customer and related-party concentration
    - Share of GMV from JSW-linked channels, top customers, and repeat cohorts
    - A narrow or related-party-heavy book can weaken both independence and exit-quality arguments.
    - Sales analytics, customer cohort deck, and related-party schedules.
    - Not public
  - - IPO-readiness workstream
    - Banker mandates, governance committee setup, draft timetable, and risk-factor drafting status
    - The timing and seriousness of listing prep influence private-market price support.
    - Board minutes, banker letters, and counsel workplan.
    - Partly public narrative only
  - - Updated 2026 financing materials
    - Use of proceeds, valuation benchmark logic, and downside plan if the market window closes
    - Investors need to know whether the company is raising opportunistically or because capital remains necessary for the model.
    - Current fundraising deck plus downside scenarios without IPO proceeds.
    - Not public
  notes: These are the minimum asks needed to convert today’s headline narrative into an investable pre-IPO decision. They are not optional polish items.
