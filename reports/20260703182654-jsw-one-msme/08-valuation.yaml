- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence today
  - What would change the view
  rows:
  - - 'THESIS: JSW One has real scale in industrial procurement.'
    - Official sources tie the platform to ₹12,567 crore of FY25 GMV, 84,000-plus registered MSMEs, about ₹3,800 crore of credit, and about 2 million tonnes of steel.
    - Audited numbers showing much weaker conversion from GMV to quality earnings would erode the scale case.
  - - 'THESIS: Sponsor and lender participation signal credible market access.'
    - The company disclosed a ₹575 crore October 2025 extension that added SBI to a syndicate already backed by JSW Steel and Principal.
    - If new capital must clear through unusually protective terms, the headline signal weakens materially.
  - - 'THESIS: IPO preparation is no longer purely theoretical.'
    - Outlook, StartupTalky, ET, and SCC-style legal coverage all point to a private round, banker engagement, or eventual-listing workstream.
    - A visible slip in filing cadence or governance prep would weaken the readiness case.
  - - 'ANTI-THESIS: The last clean price is still the May 2025 unicorn round.'
    - Public sources discuss later capital amounts, but not the live post-money valuation or preference stack for 2025-2026 entries.
    - A disclosed up-round or DRHP-grade capital structure would remove this concern.
  - - 'ANTI-THESIS: Peers disclose more economics than JSW One does today.'
    - OfBusiness and Infra.Market both surface stronger public profitability or EBITDA information than JSW One currently provides.
    - Equivalent disclosure from JSW One would tighten the valuation band and improve confidence.
  - - 'ANTI-THESIS: Sector de-rating is a live risk, not a thought experiment.'
    - Udaan’s flat 2026 round and earlier valuation reset show how quickly B2B commerce sentiment can compress.
    - Multiple expansion across peers or a cleaner JSW One profitability proof could offset this pressure.
  notes: The anti-thesis is valuation-specific rather than anti-company. It argues that the public record still under-explains price, terms, and economics.
