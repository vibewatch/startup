  evidenceGaps:
  - type: missing-source
    severity: material
    topic: financing-terms
    missingEvidence: Current cap table, post-money valuations, liquidation preferences, anti-dilution protections, and board-rights terms for the 2025-2026 capital stack.
    whyItMatters: Return outcomes can change materially if the next round clears through preference protection or hidden dilution rather than clean common-equity pricing.
    diligencePath: Request signed SSA/SHA documents, the latest cap table, and round-by-round share-class schedules from management or counsel.
    relatedQuestionRefs:
    - QV005
    - QV021
    - QV022
    - QV027
    - QV028
    - QV029
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited FY25 and FY26 revenue bridges, gross margin, EBITDA, cash, working-capital usage, and conversion from GMV to earnings.
    whyItMatters: Public scale evidence is strong, but valuation support is weak until investors can test whether growth converts into durable margin and cash generation.
    diligencePath: Obtain audited financial statements, management accounts, and board-level budget materials for FY25 and year-to-date FY26.
    relatedQuestionRefs:
    - QV008
    - QV021
    - QV023
    - QV025
    - QV027
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: credit-performance
    missingEvidence: Lender concentration, approval funnel conversion, DPD/default/write-off data, realized spreads, and financed-GMV performance by cohort.
    whyItMatters: If roughly 40% of GMV depends on credit, hidden credit stress can impair conversion, margins, and the valuation narrative faster than topline alone suggests.
    diligencePath: Request lender MIS packs, cohort vintage tables, delinquency ladders, and NBFC-versus-partner underwriting splits.
    relatedQuestionRefs:
    - QV019
    - QV023
    - QV024
    - QV027
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-completeness
    missingEvidence: A broader peer set with disclosed current multiples, DRHP metrics, or transaction terms for Indian B2B procurement and supply-chain names.
    whyItMatters: The retained comparable set is decision-useful but still partial, so any precise valuation premium or discount should be treated as directional rather than exhaustive.
    diligencePath: Refresh the comp set when additional DRHPs, listed-peer disclosures, or priced rounds become public.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV013
    - QV014
    - QV015
    - QV017
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Banker mandates, governance committee setup, draft risk-factor workstream, and the actual filing calendar for the IPO path.
    whyItMatters: Public pre-IPO language can outrun real execution, and timing slippage can change both valuation support and the likely private-round clearing price.
    diligencePath: Request banker engagement letters, board minutes, and the latest listing timetable from management and counsel.
    relatedQuestionRefs:
    - QV010
    - QV023
    - QV024
    - QV027
    relatedTableRefs:
    - TV005
    - TV006
