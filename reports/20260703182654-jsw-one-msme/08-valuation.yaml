- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public anchor
  - Scale / economics signal
  - Relevance to JSW One
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Selected India-relevant B2B commerce, procurement, and substitute references with public 2025-2026 valuation or operating markers; not an exhaustive census of all global comparables.
  rows:
  - - JSW One (May 2025 anchor)
    - ₹340 crore raised at $1 billion / about ₹8,500 crore valuation
    - FY25 GMV ₹12,567 crore; 84,000+ registered MSMEs; ~₹3,800 crore credit; ~2 million tonnes of steel
    - Most relevant disclosed entry point for current underwriting.
    - Later 2025-2026 terms and live post-money price are not public.
  - - OfBusiness
    - Public-company conversion ahead of IPO; reported $5 billion valuation
    - FY24 revenue ₹19,296 crore; FY24 profit ₹603 crore
    - Best disclosed profitable procurement peer in the set.
    - Fetched sources do not expose a current public-market multiple or fresh priced round.
  - - Moglix
    - IPO-readiness and India-domicile move discussed; parent added $12.3 million
    - FY23 revenue ₹4,664.7 crore; FY23 net loss ₹196 crore
    - Useful read-through for procurement-plus-finance scale with still-visible losses.
    - The fetched source is a lower-reputation summary rather than a filing or banker document.
  - - Zetwerk
    - Targeted $400-500 million IPO at about $5 billion; last round $3 billion
    - FY24 revenue ₹14,436 crore
    - Shows what ambitious manufacturing-tech IPO positioning can look like.
    - Target valuation is reported aspiration, not a closed new mark.
  - - Infra.Market
    - ₹730 crore pre-IPO raise at about ₹24,600 crore / $2.8 billion; ₹5,000 crore IPO route
    - FY25 revenue about ₹18,000-18,472 crore; EBITDA about ₹1,500 crore
    - Closest disclosed construction-materials benchmark with public profitability language.
    - Broader product mix and retail touchpoints make it more diversified than JSW One.
  - - Udaan
    - 2026 flat round at $1.8 billion after prior fall to $1.3 billion from $3.2 billion peak
    - FY25 revenue ₹4,561 crore; FY25 net loss ₹1,055 crore
    - Best adverse signal for what happens when B2B growth and profitability diverge.
    - Category mix skews FMCG and staples rather than heavy materials.
  - - Amazon Business India
    - No disclosed India valuation; substitute-pressure reference only
    - Claims >₹2,000 crore customer value in 2025, >40% five-year sales CAGR, and >80% MSME access
    - Shows how digitized procurement and price transparency can compress platform premiums.
    - Not a direct like-for-like heavy-materials company or private round comp.
  notes: 'The comp set is intentionally mixed: direct peers for valuation anchoring, an adverse B2B case for downside, and a substitute procurement rail for multiple-compression pressure.'
