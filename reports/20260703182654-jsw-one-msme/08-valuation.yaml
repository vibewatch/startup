- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Public indicator
  - Why it breaks the thesis
  - Action implication
  rows:
  - - 2026 round clears above the 2025 anchor only with heavy protections
    - Round documents show strong preference, anti-dilution, or governance asymmetry
    - The headline mark would overstate common-equity value and compress upside for new investors.
    - Treat the step-up as a valuation reset risk rather than as a simple up-round.
  - - Break-even narrative slips materially
    - No clean evidence of FY26 break-even or margin improvement appears before the next financing event
    - The bull case depends on economics catching up with scale.
    - Move the case to track-only or wait for audited proof.
  - - Credit-led GMV weakens or lender appetite tightens
    - Financed-order conversion or lender support falls relative to management language
    - A credit-heavy model can lose growth and valuation support quickly if funding tightens.
    - Increase downside discount and revisit the business-model durability claim.
  - - IPO timetable slides while private price expectations stay high
    - Pre-IPO language persists but filing or banker milestones slip
    - A delayed liquidity path increases carry risk and raises the chance of a flat or protected round.
    - Require a lower entry price or defer commitment.
  - - Related-party or concentration disclosure disappoints
    - A large share of volume or profitability depends on JSW-group channels or a narrow customer set
    - The market may price the company as less independent and less repeatable than the headline narrative suggests.
    - Escalate governance review and tighten valuation assumptions.
  notes: The triggers focus on valuation transmission rather than on generic business risk. Each one can change what a private investor actually owns or exits into.
