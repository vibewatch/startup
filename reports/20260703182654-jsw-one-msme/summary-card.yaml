summary:
  headline: >-
    JSW One has built a strategically relevant industrial-procurement and embedded-finance platform for Indian MSMEs,
    but incomplete disclosure on current terms, profitability, and credit quality makes it a continue-diligence case
    rather than an invest-now one.
