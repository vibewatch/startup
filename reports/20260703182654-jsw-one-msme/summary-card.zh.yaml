  topStrengths:
    - >-
      JSW One 已跨过真实运营相关性的门槛：公开证据支持 FY25 GMV 达 ₹12,567 crore、注册 MSME 超过 84,000 家、信贷发放约 ₹3,800 crore、钢材流转约 2 million
      tonnes。
    - 产品不只是薄目录：保留来源显示，它为制造和建筑 MSME 拼起了材料采购、物流、履约、自有品牌或加工层，以及嵌入式金融。
    - 发起方支持可信：Mitsui、Principal Asset Management、SBI、JSW Steel 与多家合作贷款方验证了资本通道；超过 70% 的复购证据也说明商业牵引力有用。
  topRisks:
    - 公开经济性仍太不透明，撑不起溢价承销判断：FY24 亏损不小，FY25/FY26 审计报表未公开，毛利率、现金流、CAC、留存与信贷损失细节也未披露。
    - 模型明显依赖信贷：超过三分之一订单或约 40% GMV 与融资挂钩；多数贷款仍由外部银行和 NBFC 承担，而这些机构的放款意愿和回收质量披露不透明。
    - 治理与估值透明度落后于规模：当前投后价格、优先股堆叠、关联方敞口，以及 JSW 生态对市场中立性的影响，还没有达到招股书级别的可见度。
  unresolvedGaps:
    - 带有收入桥、毛利率、EBITDA、现金与营运资本细节的 FY25 和 YTD FY26 审计财务未公开。
    - 2025-2026 年后续融资的当前股权结构表、实时投后估值、清算优先权、反稀释条款与治理权未披露。
    - 保留的公开来源没有信贷队列数据，包括贷款方集中度、审批率、DPD 分桶、损失率与已实现利差。
    - 活跃客户数、集中度、NRR 或 GRR、关联方占比与队列留存数据披露仍不足。
