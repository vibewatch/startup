      - number: '5.2'
        title: Operating architecture and fulfilment dependencies
        blocks:
          - type: paragraph
            body: >-
              The strongest public architecture evidence is operational rather than software-internal. JSW One Platforms
              and JSW Steel both describe the business as a tech-driven ecosystem that combines materials supply,
              services, financing, and construction or supply-chain solutions. The 2025 official growth release sharpens
              that picture by linking growth to supply-chain services, credit facilitation, private brands, and a
              fintech layer, while Entrepreneur and Businessworld describe the next build-out as technology, logistics,
              distribution, and NBFC expansion. Taken together, the public record supports a layered operating
              architecture: customer access surfaces feed a sales-assisted commercial layer; that commercial layer plugs
              into payment and lender rails; those rails depend on stock points, contract manufacturing, service
              centres, and transport orchestration; and the whole system is wrapped in documentation and
              complaint-resolution workflows.


              What the public record does not support is a guessed private software stack. There are no retained public
              API docs, public status dashboards, ERP screenshots, or named infrastructure certifications in this run,
              so the right architecture map is an operating model, not a cloud diagram. Even so, the physical execution
              dependency is unusually visible. Entrepreneur quotes management on 14 stock points and about seven
              contract-manufacturing locations that must be integrated in real time for on-time, in-full supply. The
              same source set also supports a meaningful private-brand layer via One Helix pipes/tubes and HR sheets,
              which makes the platform look more like an execution-heavy procurement system with managed supply assets
              than like a thin marketplace alone.
