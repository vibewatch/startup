      - number: '7.2'
        title: Regulatory, legal, and governance overhang
        blocks:
          - type: paragraph
            body: >-
              The clearest non-operating risk is that JSW One is not an isolated startup brand: it is publicly tied to
              JSW Group manufacturing strength, funded by JSW Steel, and marketed through the same parent ecosystem.
              That matters because public 2026 sources document live parent-level controversy across human-rights,
              environmental, antitrust, insolvency, and energy-regulatory arenas. Business & Human Rights and FORUM-ASIA
              both describe an Odisha project drawing UN scrutiny, lender complaints, and a prior NGT suspension before
              a fresh clearance. Reuters reporting carried by ET CFO says the CCI probe found JSW Steel and others
              breached antitrust law. ET LegalWorld says the Bhushan Power matter is still live at the Supreme Court,
              while Mondaq describes a separate Bombay High Court regulatory dispute. None of these items makes JSW One
              a direct defendant, but the marketplace is explicitly linked to the parent on brand, supply, and capital.
              That creates reputation, counterparty, and governance spillover risk precisely while the company is trying
              to move toward public-market scrutiny.
