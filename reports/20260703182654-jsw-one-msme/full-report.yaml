  - id: TE002
    title: Workflow / use-case table
    columns:
      - user job
      - current workflow
      - company solution
      - measurable benefit / signal
      - limitation
    rows:
      - - Source steel or cement for a repeat manufacturing or construction order
        - Browse catalogue, request pricing, confirm order with sales
        - Marketplace plus assisted order workflow
        - App-store and official copy consistently frame JSW One as a digital procurement surface
        - Public list-price depth is partial, and the quote logic is not fully exposed
      - - Pay for an order
        - Buyer receives sales-linked payment request after confirmation
        - Netbanking or NEFT/RTGS flow; 100% advance policy
        - Payment mechanics are explicit in FAQ answers
        - No public card flow; buyer pays after confirmation rather than via open checkout
      - - Coordinate delivery for site or plant
        - Choose seller delivery, JSW transport, or pick-up and receive dispatch details later
        - Three delivery modes plus vehicle/driver/ETA notice
        - Dispatch details are explicitly documented
        - No time-specific delivery promise and no public SLA clock
      - - Handle quality documents after dispatch
        - Receive documents by email or contact support for endorsed copy
