      - number: '3.4'
        title: Moat durability, adverse signals, and the biggest unanswered questions
        blocks:
          - type: paragraph
            body: >-
              The competitive lesson from the retained evidence is that procurement plus finance is necessary but not
              sufficient. Embedded finance is now common across JSW, OfBusiness or Oxyzo, Moglix, Udaan, Amazon
              Business, and Metalbook, so JSW cannot assume that credit alone creates durable lock-in. The adverse
              evidence also matters. Infra.Market carries historical tax-scrutiny overhang, Udaan still shows heavy
              losses and visible layoffs even after repeated raises, and large adjacent players like Zetwerk and
              Infra.Market remain tightly tied to IPO timing and balance-sheet access. These signals do not prove
              category failure, but they do show that scale can mask weak unit economics or governance friction for a
              long time. The largest missing proof points are realized pricing, repeat purchase or retention, and
              credit-loss quality. Until those are disclosed, the safest judgment is that JSW has a credible
              materials-specific proposition and strong ecosystem support, but not a publicly proven moat that direct
              peers could not narrow with execution, channel reach, or capital.
