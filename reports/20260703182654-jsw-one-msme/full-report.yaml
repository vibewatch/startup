    rows:
      - - 'THESIS: JSW One has real scale in industrial procurement.'
        - >-
          Official sources tie the platform to ₹12,567 crore of FY25 GMV, 84,000-plus registered MSMEs, about ₹3,800
          crore of credit, and about 2 million tonnes of steel.
