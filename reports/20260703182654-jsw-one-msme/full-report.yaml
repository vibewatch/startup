  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and the right comparison set
        blocks:
          - type: paragraph
            body: >-
              The relevant market for JSW One MSME is narrower than all Indian B2B commerce and broader than a simple
              online steel catalogue. Company materials consistently describe a procurement workflow that bundles
              materials supply with credit, order tracking, reconciliation, and, at the platform level, logistics and
              turnkey-adjacent services. In practice, that means the core included spend is recurring procurement of
              steel and structural materials for MSME manufacturers and contractors, plus the processing, fulfillment,
              and working-capital tools that make those orders executable. The platform’s own positioning around
              transparency, trust, returns, and after-sales support also implies that quality assurance and execution
              reliability are part of the buyer job, not optional extras.


              The correct exclusions are just as important. Individual home building exists inside the broader JSW One
              umbrella, but it is an adjacent layer rather than the core thesis for this chapter. Large-enterprise
              central procurement and mega-project EPC sourcing also sit outside the main focus because RBI’s MSME
              thresholds and the company’s own messaging point to micro, small, and medium buyers. Finally, this is not
              a generic multi-seller marketplace thesis. Independent reporting says supply in steel and cement is
              concentrated among a few players, so the more defensible framing is a tech-enabled procurement layer
              inside concentrated material categories, not an infinitely broad open marketplace.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
