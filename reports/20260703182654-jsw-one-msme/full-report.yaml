      - number: '2.4'
        title: Growth drivers, digital rails, and the constraints that still slow adoption
        blocks:
          - type: paragraph
            body: >-
              The demand backdrop is favorable. Steel and cement capacity continue to expand, public infrastructure and
              housing spend remain elevated, and the budget is explicitly trying to make procurement-linked finance more
              liquid through TReDS and GeM linkages. IBEF’s cement and steel updates both describe multi-year capacity
              additions and policy-supported consumption growth, while MSME-focused sources show the government pushing
              more enterprises toward formalisation and digital market access. For JSW One, this is the real bull case:
              large categories, policy support for MSME digitisation, and a financing problem serious enough to make
              embedded credit a product feature rather than a margin accessory.


              But the retained sources also show why adoption should not be modelled as frictionless. SIDBI still sees a
              roughly ₹30 lakh crore credit gap, only 18% survey penetration for digital lending, and roughly 70% of
              MSMEs using traditional marketing modes. Its survey also flags infrastructure, logistics, and skills
              bottlenecks in sectors directly adjacent to JSW One’s category exposure. The Ministry’s own Samadhaan
              framework exists because delayed payments remain systemic. Independent press adds a cyclical caution:
              construction can slow even when long-run demand remains healthy, and category observers still describe
              private building-materials ecommerce as nascent. The combination supports a clear conclusion for valuation
              work: JSW One has a real market wedge, but speed of digital share capture and credit economics remain the
              least-proven parts of the story.
