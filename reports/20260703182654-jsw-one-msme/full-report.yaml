  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME’s public product surface is concrete enough to map as a procurement workflow, not just as a
              marketing slogan. Official marketplace, app-store, and group pages consistently describe a digital route
              for manufacturing and construction MSMEs to source steel and building materials, while the app listings
              make the workflow more specific: buyers can request pricing, track delivery, and manage invoices from a
              mobile surface. The retained catalogue evidence shows that the product family is broad across industrial
              materials rather than limited to a single steel SKU: steel variants, structural steel, TMT, cement, coated
              products, bitumen, and wire-rod families are all visible, and the iPhone listing further adds stainless
              steel to the public assortment.


              The workflow is still visibly assisted by people and operations. Payment does not appear as a generic
              self-serve checkout: the buyer FAQ says the order is paid through a link sent by the sales representative
              during order confirmation, and delivery exceptions such as faster dispatch or special instructions are
              also routed through sales before the order is placed. That is important product context. JSW One is
              selling a workflow that combines category breadth with operational handoff, not a pure catalogue checkout.
              This is also why the public buyer experience exposes fulfilment choices and documentation steps directly:
              the disclosed product promise is less about a purely software-native cart and more about managing the
              decision, dispatch, and evidence trail around industrial procurement.
