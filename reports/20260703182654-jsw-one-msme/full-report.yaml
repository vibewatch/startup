      - number: '4.3'
        title: Capital adequacy and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Public capital-adequacy evidence is strongest on intended use of funds and weakest on actual liquidity.
              The 2025 funding sequence is clear enough: JSW One raised ₹340 crore at unicorn valuation, followed with a
              larger ₹575 crore round at about ₹8,575 crore valuation, and management tied the new money to technology,
              logistics and distribution integration, service-network expansion, private brands, and NBFC
              capitalization. Media and management also consistently linked the next leg of financing to break-even and
              eventual public-market readiness, while June 2026 coverage introduced a possible ₹650-700 crore pre-IPO
              round before a $350-400 million listing. That is not a distressed signal by itself, but it does show the
              company still expects capital-market execution to matter.


              What remains missing is the actual solvency math. No retained public source disclosed cash on hand,
              unrestricted liquidity, runway, gross margin, contribution margin, CAC, payback, retention, credit losses,
              or delinquency buckets. Open-data mirrors do not solve the problem: Tofler exposes capital structure but
              not an underwriting-grade income statement, and its visible FY25 revenue bands conflict with the ₹3,976
              crore figure cited in independent funding coverage. InstaFinancials shows that FY25 filings exist and
              identifies the latest balance-sheet date, but it still routes the audited statements behind document-order
              flows. As a result, the company’s public record supports a positive traction case and a plausible
              financing strategy, but not a complete underwriting case for margin path or self-funded durability.
