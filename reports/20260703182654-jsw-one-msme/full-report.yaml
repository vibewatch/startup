companyProfile:
  summary: >-
    JSW One MSME is the operating marketplace brand inside Mumbai-based JSW One Platforms, a JSW Group venture legally
    incorporated in 2018 and commercially launched in 2021 to digitize steel, cement, and allied building-material
    procurement for manufacturing and construction MSMEs. The platform now combines materials sourcing, logistics and
    fulfilment, credit facilitation, and a growing NBFC layer rather than acting as a thin listing marketplace. Public
    evidence supports meaningful operating scale by FY25, including 84,000-plus registered MSMEs, ₹12,567 crore of GMV,
    roughly ₹3,800 crore of credit disbursement, and unicorn-status financing, but the current underwriting question is
    whether real scale will convert into transparent, durable economics before the next private-round or IPO step-up.
