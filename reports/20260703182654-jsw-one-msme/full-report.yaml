  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, financing context, and the price anchor
        blocks:
          - type: paragraph
            body: >-
              JSW One has crossed the threshold where valuation can be discussed as more than a story stock. The company
              itself disclosed a ₹340 crore May 2025 financing that took it to unicorn status, then added a ₹575 crore
              October 2025 extension that brought in SBI and reiterated the strategy around logistics, technology, and
              the NBFC arm. Public operating evidence also supports that this is not a tiny procurement widget:
              management and repeated coverage tie the platform to ₹12,567 crore of FY25 GMV, 84,000-plus registered
              MSMEs, about ₹3,800 crore of credit disbursement, and roughly 2 million tonnes of steel moved. Those are
              real scale markers, and they justify keeping JSW One in an investment funnel.


              The valuation problem is not whether the company is real; it is whether current investors can see the live
              price and the live protections. The last clean public valuation anchor is still the May 2025 unicorn
              round, which VCCircle translated to roughly ₹8,500 crore. Public sources then describe a larger approved
              capital pool, a ₹575 crore extension, and 2026 talk of a ₹650-700 crore pre-IPO private round plus a
              $350-400 million IPO. What those same sources do not disclose is the current post-money valuation,
              liquidation preferences, anti-dilution protection, or the governance rights attached to the later capital.
              That missing term-sheet layer is why the chapter recommendation stays research-more / track rather than
              buy at a blind 2026 step-up.
