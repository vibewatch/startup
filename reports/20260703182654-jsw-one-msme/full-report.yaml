  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold / event
      - action implication
    rows:
      - - Credit-linked demand dependence
        - Financed GMV or order share versus lender approvals
        - Approval-rate deterioration, lender exits, or disbursals missing the stated 500-crore scale trajectory
        - >-
          Pause aggressive underwriting assumptions and require lender-level concentration plus vintage-loss data before
          increasing conviction.
      - - Marketplace-neutrality conflict
        - Supplier-mix and related-party share disclosure
        - >-
          Management cannot quantify non-JSW GMV, supplier concentration, or conflict-management controls before IPO
          filing
        - Treat neutrality as a thesis-risk, not a disclosure nit; require formal governance evidence.
      - - Fulfilment integration failure
        - OTIF, shortage claims, return-cycle time, and complaint closure
        - Material slippage across new nodes, stock points, or transportation rollouts
        - Lower repeat-order and margin assumptions until node-level reliability data is proven.
      - - Pre-IPO disclosure gap
        - DRHP quality and supporting audited disclosures
        - Prospectus timing advances without clear related-party, credit-quality, and concentration disclosure
        - Do not underwrite public-market multiple expansion on management narrative alone.
      - - Parent-group controversy spillover
        - New adverse rulings, escalations, or wider financier scrutiny at JSW Steel
        - Cases worsen or broad investor questions pull JSW One into parent-governance diligence
        - Increase discount rate and require explicit ring-fencing from parent legal and ESG issues.
      - - Digital-lending compliance miss
        - RBI-aligned control evidence for LSP, grievance, KFS, DLG, and DLA processes
        - Gaps appear between public credit journey and regulator-required controls
        - Treat credit growth targets as non-bankable until compliance mapping closes.
    notes: >-
      Each kill criterion is anchored to a monitorable public or diligence datapoint rather than a generic statement of
      caution.
