              JSW One’s unicorn valuation and FY25 GMV are well supported, yet the same source pack still shows widened
              FY24 losses, inconsistent external headcount estimates, and limited public disclosure on cap-table control
              rights. That mix argues for confidence in scale, but not for confidence in governance or profitability
