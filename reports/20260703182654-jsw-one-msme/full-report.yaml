      - number: '1.4'
        title: Scale, milestones, customer proof, and risk signals
        blocks:
          - type: paragraph
            body: >-
              JSW One’s 2025 disclosures make clear that the company is no longer an early experiment. Official press
              releases say FY25 GMV reached Rs 12,567 crore, registered users exceeded 84,000 MSMEs, credit
              disbursements through banking and NBFC partners were about Rs 3,800 crore, and the platform facilitated
              roughly 2 million tonnes of steel purchases. Entrepreneur and Economic Times add FY25 revenue at Rs 3,976
              crore, while interviews describe 14 stock points, about seven contract-manufacturing locations, and a
              lender network that spans ICICI Bank, IndusInd Bank, Yes Bank, Axis Bank, Standard Chartered, Tata Capital
              or TCL, Kotak Mahindra, IDBI, Mizuho, and JSW One Finance. Customer-facing proof is more modest but still
              useful: the JSW microsite carries named testimonials that emphasize quality, competitive pricing, delivery
              reliability, and after-sales support.


              The same source pack also shows why chapter 1 should resist overconfidence. Headcount is not cleanly
              disclosed by management, and external databases diverge materially between 424 and 915 employees.
              Profitability is not yet established either: ET, citing Tracxn, said FY24 net loss widened sharply even as
              revenue scaled, and management continues to frame break-even as a near-term target rather than an
              accomplished fact. Competition is intensifying as other conglomerate-backed B2B material platforms prepare
              their own scale and IPO narratives. So the correct chapter-1 read is not that the business lacks traction;
              it is that JSW One now has credible scale and financing validation, but still carries disclosure gaps and
              operating-risk signals typical of a fast-growing private marketplace moving toward a financing-heavy,
              pre-IPO stage.
