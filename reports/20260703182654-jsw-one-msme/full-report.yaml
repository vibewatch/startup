  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from real scale and funding support into a term-sheet and disclosure bottleneck rather
      than from a broken company thesis.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: >-
            FY25 GMV, user growth, credit volume, and steel throughput show that the platform has become a meaningful
            industrial channel.
        - id: capital
          label: Capital support
          detail: The company publicly closed a unicorn round and a larger extension with SBI and existing backers.
        - id: disclosure
          label: Disclosure gap
          detail: Later-round post-money price, preference terms, and audited unit economics remain outside the public record.
        - id: sector
          label: Sector de-rating signal
          detail: Udaan and broader B2B commentary show that scale alone does not preserve premium valuations.
        - id: discipline
          label: Price discipline
          detail: Treat the May 2025 unicorn round as the last clean public anchor until new evidence arrives.
        - id: recommendation
          label: Research-more / track
          detail: Continue diligence, but do not pay a fresh 2026 premium without better proof and clearer terms.
      edges:
        - from: scale
          to: discipline
          label: supports interest
        - from: capital
          to: discipline
          label: validates demand
        - from: disclosure
          to: recommendation
          label: constrains conviction
        - from: sector
          to: recommendation
          label: raises discount rate
        - from: discipline
          to: recommendation
          label: sets entry rule
    approximationNotes: >-
