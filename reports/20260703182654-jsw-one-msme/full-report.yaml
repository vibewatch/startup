    layout: standard
    summary: >-
      Committee-style scores show that market and scale evidence are strong, while economics disclosure and current
      price visibility are much weaker.
    data:
      items:
        - label: Market tailwind
          score: 8
          note: MSME digitisation and procurement formalisation remain real, evidence-backed positives.
        - label: Scale proof
          score: 8
          note: GMV, registered users, and sponsor-backed funding show tangible operating heft.
        - label: Economics disclosure
          score: 3
          note: Public sources still do not disclose audited margin, cash, or full valuation terms.
        - label: Credit dependency
          score: 4
          note: About 40% of GMV is described as credit-linked, so underwriting quality matters heavily.
        - label: Peer relative support
          score: 5
          note: Peers validate category scale, but some peers disclose stronger economics or show de-rating risk.
        - label: Current price visibility
          score: 3
          note: The last clean mark is public, but later step-up pricing is not.
        - label: Exit readiness
          score: 5
          note: IPO-prep language is visible, yet the public record is still pre-DRHP.
        - label: Evidence quality
          score: 4
          note: Evidence is good enough for diligence and too thin for blind pre-IPO conviction.
