  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real scale story but only a partial economics story. Management and repeated
              media coverage anchor FY25 GMV at ₹12,567 crore and FY25 revenue at ₹3,976 crore, while also showing more
              than 84,000 registered MSMEs, about ₹3,800 crore of facilitated credit, and roughly 2 million tonnes of
              steel sold through the platform. Those figures imply that JSW One is not a thin online lead-generation
              layer: the public revenue-to-GMV ratio of about 31.6% is far closer to an integrated distribution,
              processing, and financing stack than to a classic low-take-rate marketplace. That interpretation is
              reinforced by management’s insistence that the company is not building a multi-seller exchange, plus
              Mint’s description of third-party materials, cut-to-spec coils, and JSW One-branded contract-manufactured
              products on the same platform.


              Pricing is only partly public. Official pages promise best material access, predictable pricing, and a
              one-stop buying workflow, but the buyer-facing payment disclosures are mostly operational rather than
              economic: standard orders are still on 100% advance payment, payments run through netbanking or NEFT/RTGS,
              and the actual order payment link is routed through a sales representative during confirmation. That means
              the public web surface shows quote-led procurement rather than a clean self-serve SKU price book. The
              monetization takeaway is therefore clear only at a high level: JSW One appears to monetize through
              recognized materials revenue, private brands, processing, logistics coordination, and finance adjacency,
              while the realized discount schedule and category take rates remain private.
