      - - Processing / stock / contract-manufacturing network
        - 13 processing centres, 14 stock points, ~7 contract-manufacturing locations
        - Converts supply access into fulfilment capacity
        - Many nodes must integrate in real time
        - A single-node failure creates OTIF, margin, or documentation knock-on effects
        - Medium-to-high
        - Instrument node-level monitoring and contingency sourcing
        - No public node-level redundancy, utilisation, or downtime metrics are available.
      - - Transportation and service network
        - JSW One Transportation Services plus service centres and seller logistics
        - Handles last-mile, part-truckload, complaint response, and JIT fulfilment
        - Reliability promise is high but operating mix is opaque
        - Escalations, claims, or delivery misses damage trust faster than raw GMV reveals
        - Medium-to-high
        - Track regional partner scorecards, complaint closure, and exception routing
        - Public disclosure does not separate owned, partner, and seller-controlled delivery legs.
      - - Public-market window
        - Investment bankers, pre-IPO investors, public-market buyers
        - Funds growth and provides valuation benchmark
        - IPO path is timing-sensitive and disclosure-sensitive
        - Weak market window or weak disclosure delays fundraising and compresses valuation
        - High
        - Sequence DRHP readiness behind operational and credit-quality proof points
        - The path remains exposed to macro sentiment and internal readiness at the same time.
