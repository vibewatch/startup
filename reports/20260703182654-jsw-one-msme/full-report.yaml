      - number: '1.2'
        title: Leadership, governance, and key-person concentration
        blocks:
          - type: paragraph
            body: >-
              The leadership file is current enough to identify who runs the business, but not rich enough to map
              control rights with precision. Gaurav Sachdeva is the clearest operating executive in the public record.
              The Economic Times reported his appointment as CEO in 2022, and later official and media sources
              consistently upgraded his title to Joint Managing Director and CEO. Parth Jindal is equally important to
              the external story even if he is not the day-to-day operator: he appears across fundraising, strategic
              positioning, and MSME-mission statements as chairman or director, making him the principal sponsor and
              public face of the venture within the JSW ecosystem.


              Governance visibility improved in 2024 when Ranjan Pai joined as an independent director, a move
              explicitly tied to stronger governance and IPO preparation. Tofler and Tracxn also surface a visible set
              of directors and officers, including Nilesh Narwekar, Vinay Shroff, and Geeta Mathur, but the public file
              still stops short of a clean board map. There is no detailed disclosure of committee structure, voting
              arrangements, investor rights, or succession planning. For diligence, that means chapter 1 can safely
              establish the named leadership bench and the fact of governance strengthening, while still treating board
              control, cap-table influence, and key-person dependency as live questions rather than settled facts.
            claimRefs:
