      - number: '8.2'
        title: Comparable framework and sector read-through
        blocks:
          - type: paragraph
            body: >-
              The right public-market lens is comparison with a disclosure discount, not a false-precision DCF.
              OfBusiness and Infra.Market are the strongest valuation references because they are also India-facing,
              procurement-heavy, and IPO-oriented, but their public record is more complete on scale and profitability.
              OfBusiness enters the set with a reported $5 billion valuation, FY24 revenue of ₹19,296 crore, and FY24
              profit of ₹603 crore. Infra.Market enters with a reported ₹24,600 crore pre-IPO valuation, a ₹5,000 crore
              IPO path, and FY25 revenue around ₹18,000-18,472 crore plus EBITDA around ₹1,500 crore. Zetwerk and Moglix
              add more context on IPO readiness, but their fetched sources still show either target valuation rather
              than a closed mark, or growth with losses rather than disclosed profitability.


              The anti-thesis comes from both peers and substitutes. Udaan’s 2026 flat round at $1.8 billion and its
              earlier drop to $1.3 billion from a $3.2 billion peak show what happens when B2B scale stops converting
              into valuation confidence. Amazon Business is not a direct materials peer, but it matters for multiple
              compression: its India business claims over ₹2,000 crore of customer financial value in 2025, more than
              40% five-year sales CAGR, and access to over 80% of the MSME ecosystem, while Digital Commerce 360 reports
              that 31.5% of sales already come from tier-2-and-below markets. Together with ICRIER’s survey evidence on
              digitisation, this says the demand tailwind is real, but the premium belongs to platforms that can prove
              quality, economics, and trust—not just topline participation.
