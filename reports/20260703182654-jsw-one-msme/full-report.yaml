      - number: '2.2'
        title: 'Sizing lenses: huge demand pools, but no clean public JSW-One-specific TAM'
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes the market obviously large, but not cleanly modelled. At the broadest level,
              official and quasi-official sources place India’s MSME universe between 7.34 crore and 7.86 crore
              enterprises depending on whether the source counts estimated enterprise stock or registered Udyam/UAP
              units. Those sources also agree that MSMEs matter materially to the economy: around 31.1% of GDP, roughly
              48.5% of exports, and more than one-third of manufacturing output. That gives a credible top-down
              enterprise backdrop, but it does not by itself define a procurement market for JSW One.


              The more decision-useful public lenses are materials-demand proxies. IBEF’s steel data shows
              finished-steel consumption near 148 MT in FY26 through February after 150.23 MT in FY25, while its cement
              data shows FY26 production running at 443.2 MMT through February with a full-year expectation around 490
              MT. Those are the flows JSW One is trying to intermediate. Independent press adds a broader but weaker
              framing: Business Standard quotes a $400 billion addressable B2B category, but that lens is too broad to
              serve as a diligence-grade SAM. The strongest bottom-up evidence remains the company’s own disclosed
              operating wedge: ₹12,567 crore of FY25 GMV and roughly 2.0-2.4 MT of steel throughput. That is meaningful
              scale, but it still implies low-single-digit penetration against national steel demand and therefore
              leaves ample room between observed footprint and true addressable market.
