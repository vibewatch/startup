      - number: '8.4'
        title: Entry discipline, thesis-break triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The practical investment conclusion is straightforward: JSW One deserves continued diligence, but not
              blind underwriting at an undisclosed 2026 markup. Price discipline should start with the simplest rule in
              the chapter: treat the May 2025 unicorn round as the last clean public anchor, and assume every later step
              needs to earn its premium through new disclosure rather than through momentum alone. The most important
              asks are not cosmetic. Investors need audited FY25 and FY26 numbers, a current cap table, round documents
              that show preference and anti-dilution mechanics, lender-cohort data that explain whether the credit
              engine is strengthening or merely subsidizing GMV, and registry-backed evidence on the latest
              balance-sheet filing status. Without those materials, the company’s strongest public signals remain scale,
              parent backing, and market positioning—not investable transparency.


              Those same asks translate into thesis-break triggers. A round that clears only with heavy investor
              protection would challenge the headline price even if the company stays operationally strong. A meaningful
              slip in IPO timing, weak evidence on break-even, or deterioration in financed-order quality would do the
              same. Conversely, the recommendation can move up if management converts the current prep narrative into
              DRHP-grade disclosure and proves that growth, credit, and profitability are converging rather than
              diverging. Until then, the right stance is not avoid, but it is also not buy. It is research-more / track,
              with a stretched view on any fresh 2026 markup and with diligence focused on the terms hidden behind the
              headline.
