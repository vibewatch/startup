chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, chronology, and operating model
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME should be read as the operating B2B marketplace brand inside the broader JSW One Platforms
              structure. The public record is usable, but only if the chronology is separated carefully. Legal-entity
              sources such as Tofler and Tracxn anchor incorporation of JSW One Platforms Limited in September 2018 with
              a registered-office signal in Kalina, Mumbai. Commercial launch timing is later: multiple 2023-2025
              business reports say JSW Group launched JSW One in 2021, with July 2021 the clearest market-entry
              reference. Inc42 adds a third signal by listing 2020 as the profile founding year, which is better treated
              as a database tag than as the sole canonical date.


              On business model, official JSW pages are consistent. JSW One is not just a catalogue or lead-generation
              site; it is presented as a tech-first procurement layer that combines materials supply, financing,
              logistics, fulfilment, and private-brand distribution for manufacturing and construction MSMEs. The
              marketplace brand focuses on steel and other building materials, while the broader platform also includes
              JSW One Homes. Public buyer-facing pages add practical detail: the system advertises order tracking,
              financial reconciliation, returns processing, and after-sales support. Together those disclosures support
              a chapter-1 conclusion that JSW One MSME is the group’s industrial-commerce operating layer for MSMEs,
              headquartered in Mumbai and built to embed credit and fulfilment directly inside procurement.
