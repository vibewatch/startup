  - id: TP005
    title: Moat durability / competitive risk register
    columns:
      - moat claim
      - threat source
      - severity
      - why the threat is credible
      - mitigation or diligence ask
    rows:
      - - Materials specificity protects JSW
        - OfBusiness, Infra.Market, Metalbook, and SteelBazaar already market steel or construction-material depth
        - High
        - The direct-peer set is already vertically aligned to the same buyer job, so category focus alone is not scarce
        - Request win-loss cases showing why buyers chose JSW over OfBusiness and Infra.Market
      - - Embedded finance creates lock-in
        - Finance is advertised by JSW, Oxyzo, Moglix, Udaan, Amazon Business, Metalbook, and planned on GeM
        - High
        - >-
          Credit support is common; the missing proof is who prices risk better and converts it into repeat share of
          wallet
        - Request portfolio performance, repayment curves, and attach rates by product and buyer cohort
      - - Distributor reach is an incumbent weakness
        - Infra.Market's 17,256 touchpoints and GeM's scale show large-channel alternatives still exist
        - Medium
        - >-
          Offline and public channels remain material, but no retained source quantifies their share against digital
          rails
        - Request channel-share studies and distributor win-loss evidence
      - - Compliance is a secondary buying criterion
        - Amazon Business and GeM both lead with GST, compliance, or procurement governance tooling
        - Medium
        - >-
          Horizontal or public-procurement rails can win spend even without material specialization when governance
          matters most
        - Test whether JSW needs stronger compliance workflows for larger institutional buyers
      - - Opaque pricing can still support margin
        - Most direct peers are quote-led; only Metalbook and Amazon expose broad public price signals
        - Medium
        - Opacity may hide service value, but it also makes sustainable price leadership hard to prove
        - Request realized pricing and rebate disclosures for key materials
      - - Capital access guarantees durability
        - >-
          Udaan losses and layoffs plus Infra.Market and Zetwerk IPO dependence show funding is still a live strategic
          variable
        - High
        - The category remains working-capital and logistics intensive even for scaled players
        - Ask for cash-cycle, inventory, and financing dependency disclosures
      - - Governance cleanliness is not a differentiator
        - Infra.Market historical tax-scrutiny reports and sectorwide scrutiny weaken trust narratives
        - Medium
        - >-
          Historical probes do not equal current failure, but they can matter in enterprise or institutional buying
          decisions
        - Request compliance certifications, audit history, and customer objection handling
      - - Multi-homing is low once a buyer picks a rail
        - Public retention, reorder, and share-of-wallet evidence is missing across the cohort
        - High
        - Without retention data, it is safer to assume buyers can split categories across several platforms
        - Request cohort retention, repeat-order rates, and active-buyer concentration by segment
    notes: >-
      Severity reflects underwriting impact, not certainty of failure; the right read is that moat proof still depends
      on private customer and credit-performance evidence.
    claimRefs:
      - CP061
      - CP066
      - CP067
      - CP043
      - CP065
      - CP068
      - CP069
      - CP070
  - id: TI001
    title: Revenue streams table
    columns:
      - stream
      - mechanism
      - unit
      - current public value/status
      - quality lens
      - diligence ask
    rows:
      - - Core steel and materials distribution
        - Recognized revenue on steel, cement, and allied material procurement rather than a simple listing fee
        - ₹ crore GMV / revenue
        - FY25 GMV ₹12,567 crore; FY25 revenue ₹3,976 crore; steel and cement repeatedly described as core categories
        - >-
          High scale, but public disclosure does not separate pass-through product value from platform spread or
          processing margin
        - Provide FY25 audited segment revenue and gross margin by product family
      - - Private brands
        - Own-label products such as JSW One TMT and JSW One Concrete sold inside the procurement stack
        - mix not disclosed
        - Official pages and funding PRs highlight private brands, but not their revenue share
        - Could lift margin relative to plain trading, but public mix is absent
        - Disclose FY25 private-brand revenue, gross margin, and repeat purchase rates
      - - Processing and contract manufacturing
        - Cut-to-spec steel coils plus production sourced through contract-manufacturing locations
        - locations / throughput
        - >-
          Mint cites cut-to-spec coils and contract-manufactured JSW One-branded products; ET cites about seven
          contract-manufacturing locations
        - Value-added revenue likely exists, but unit economics are opaque
        - Provide processing throughput, yield loss, and contribution margin per tonne
      - - Embedded finance and credit
        - Partner-led inventory funding plus scaling NBFC products tied to orders
        - ₹ crore disbursement / AUM
        - >-
          FY25 credit disbursement about ₹3,800 crore; current monthly inventory-funding flow ₹475-500 crore; NBFC base
          about ₹100 crore
        - Deepens share of wallet and conversion, but introduces underwriting and funding dependence
        - Provide take rate, NIM, default rate, and lender economics by product
      - - Logistics and fulfilment
        - Stock points, processing centres, transport, and JIT/service-centre delivery supporting order completion
        - network nodes
        - >-
          Public sources cite 13 processing centres, 14 stock points, transportation services, and a growing fulfilment
          network
        - Likely embedded inside recognized revenue rather than separately priced in public disclosures
        - Provide fulfilment cost per tonne/order and split between owned versus partner delivery
