        title: Exhibits
        blocks:
          - type: callout
            title: The company has moved beyond a simple materials catalogue into a full-stack procurement workflow
            body: >-
              The strongest evidence in the public file is not just funding size. Official materials and interviews
              repeatedly describe an operating stack that combines materials sourcing, embedded credit, fulfilment, and
              after-sales support. That is reinforced by the lender network, the NBFC build-out, and customer-facing
              testimonials about delivery reliability and quality.
