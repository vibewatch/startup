      - number: '8.3'
        title: Bull, base, and bear valuation range
        blocks:
          - type: paragraph
            body: >-
              Because the current pre-IPO price is undisclosed, the scenario frame should be anchored on the last fully
              disclosed mark rather than on a new absolute headline number. The bull case is not impossible. It requires
              three things to move together: first, management’s break-even language has to be evidenced rather than
              merely repeated; second, the credit-heavy GMV model has to show acceptable loss performance and lender
              durability; third, the next round or IPO workstream has to arrive without preference-heavy structures that
              silently transfer value from new investors to existing insiders. If those conditions are met, a premium
              over the May 2025 unicorn anchor can be argued because the company has genuine operating heft and a
              credible industrial wedge.


              The base case is narrower. Public evidence today supports continuity of interest, not clean rerating. The
              last disclosed valuation mark is still useful, but the later extension and 2026 private-round discussions
              have not disclosed post-money terms, and the strongest peer-comparison evidence shows that investors
              reward disclosed profitability more than raw GMV ambition. The bear case is equally clear: if IPO timing
              slips, if Udaan-like sector de-rating persists, or if later capital clears through more protective terms,
              then the fair underwrite can move below the 2025 anchor. That is why the stance is price-sensitive. The
              company may be good, but the entry case is still gated by evidence quality.
