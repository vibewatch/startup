  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk baseline and ranking
        blocks:
          - type: paragraph
            body: >-
              JSW One MSME now sits on a much larger and more interconnected risk surface than a simple materials
              catalogue. Public company and media sources consistently describe a model that combines industrial supply,
              platform workflows, embedded credit, logistics orchestration, stock points, processing centres, contract
              manufacturing, and pre-IPO capital raising. That breadth is strategically attractive, but it also means
              failures can travel across trust, fulfilment, financing, and valuation at the same time. The strongest
              evidence supports five first-order risks: marketplace-neutrality conflict from parent-group supply and
              ownership, credit-linked demand dependence on third-party lenders, execution strain across a multi-node
              fulfilment stack, under-disclosed pre-IPO governance and credit-quality detail, and parent-group legal or
              ESG controversies that can spill back into buyer, lender, or investor perception. Mitigations exist, but
              public disclosures still leave important blind spots around lender concentration, loss performance,
              service reliability, and related-party mix.
