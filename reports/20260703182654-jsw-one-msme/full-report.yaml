  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment focus, buyer map, and addressable-customer narrative
        blocks:
          - type: paragraph
            body: >-
              Public sources are consistent that JSW One MSME is not trying to serve every small business purchasing
              category. The operating story is much narrower and more useful: it is a procurement layer for
              manufacturing and construction MSMEs buying heavy materials such as steel, TMT, cement, and related
              industrial inputs. Official pages describe a steel-and-building-material marketplace for MSMEs, while the
              FY25 press release and JSW Steel group page frame the platform as a broader B2B commerce layer for
              construction and manufacturing materials. The mobile-app listings sharpen that segmentation further by
              naming manufacturing, fabrication, automotive, industrial machinery, construction, infrastructure, energy,
              and general engineering as target sectors, and by describing workflows such as order tracking, ledger
              visibility, and partner-linked credit.


              The buyer, user, and payer signals are also more industrial than retail. The evidence suggests an
              owner-led or procurement-led MSME customer base in which founders, plant buyers, project managers, and
              finance teams all matter. That is visible in the app’s promise of quotation requests, documentation,
              ledgers, delivery tracking, and credit access, and in customer testimonials that focus on quality
              assurance, availability across grades, on-time delivery, and after-sales responsiveness rather than
              consumer-style browsing. Third-party coverage adds the scale narrative: Entrepreneur said the company
              wants to build an integrated procurement stack for more than 500,000 construction and manufacturing MSMEs
              across India, while official FY25 disclosures say the platform had already reached 84,000+ registered
              MSMEs. That combination supports a credible top-of-funnel story, but it is still only a registration and
              addressable-market story; the public record does not break the customer base by state, cluster, or active
              cohort.
