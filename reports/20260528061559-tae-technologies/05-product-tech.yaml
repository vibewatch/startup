- id: roadmap-and-commercial-dependencies
  title: Roadmap, deployment dependencies, and commercialization path
  body: 'Norm''s strongest commercial implication is that it changed TAE''s own roadmap. The company now argues that NBI-only FRC formation removed the need for the planned Copernicus machine and lets it move directly toward Da Vinci. That reduces one intermediate science stage, but it does not collapse the rest of the deployment burden. TAE''s public siting record shows that first-plant execution now depends on transmission access, land, workforce, transportation, incentives, and regulatory approvals. The company targets an initial roughly 50 MWe plant in the early 2030s and larger 350-500 MWe plants later, but those dates are still company-forward-looking. TAE Beam UK is the clearest productized subsystem milestone in the near term: it has been formally established, is fully funded, and is tasked with neutral-beam development on a timetable measured in 18-24 months rather than decades. That matters because neutral beams are a cross-cutting dependency for TAE''s own plant, for other fusion
    OEMs the venture hopes to serve, and for non-fusion accelerator applications. The roadmap is therefore credible at the subsystem and siting-preparation level, but not yet independently verified at the net-energy or commercial-operation level.'
