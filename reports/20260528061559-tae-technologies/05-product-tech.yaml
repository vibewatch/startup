  claims:
  - id: CE001
    statement: TAE positions its core product as a utility-scale fusion power plant that can supply grid electricity and carbon-intensive industrial processes, not a science instrument sold to labs.
    type: company-claimed
    topic: product-definition
    sourceRefs:
    - SE001
    - SE006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE001
  - id: CE002
    statement: TAE's chosen confinement topology is a compact linear field-reversed configuration whose attraction is high power density, simple circular coils, and unrestricted divertors rather than tokamak-style toroids.
    type: third-party-reported
    topic: frc-topology
    sourceRefs:
    - SE004
    - SE017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE002
  - id: CE003
    statement: In the NBI-formed configuration, a seed plasma is created first and then transitions to a fully formed field-reversed configuration within roughly 10 ms as trapped beam ions build toroidal current.
    type: third-party-reported
    topic: frc-formation
    sourceRefs:
    - SE017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE002
    - QE006
  - id: CE004
    statement: The Norm/Norman platform uses eight 15 keV neutral beams delivering up to 13 MW of neutral power to provide heating, current drive, and plasma stability.
    type: third-party-reported
    topic: neutral-beam-stack
    sourceRefs:
    - SE017
    - SE008
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE003
    - QE019
  - id: CE005
    statement: Edge-biasing electrodes and magnetic-field shaping are required alongside the beams because uncorrected NBI torque can drive n=2 deformation and other MHD instability modes.
    type: third-party-reported
    topic: stability-controls
    sourceRefs:
    - SE017
    - SE004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE005
  - id: CE006
    statement: TAE says its NBI-only architecture eliminates the old formation coils and associated hardware, reducing projected reactor size, complexity, and cost by as much as 50% versus prior FRC startup schemes.
    type: company-claimed
    topic: nbi-only-simplification
    sourceRefs:
    - SE004
    - SE005
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QE004
    - QE007
  - id: CE007
    statement: TAE's FAQ describes Norm as roughly 12 meters / 40 feet long versus about 24 meters / 80 feet for Norman, underscoring that the architectural change is material at the machine level.
    type: company-claimed
    topic: machine-size
    sourceRefs:
    - SE002
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QE007
    - QE010
  - id: CE008
    statement: TAE's preferred end-state fuel is hydrogen-boron (p-B11), which it frames as aneutronic because the primary reaction yields helium rather than a neutron-dominant exhaust stream.
    type: company-claimed
    topic: p-b11-strategy
    sourceRefs:
    - SE001
    - SE002
    - SE018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE008
  - id: CE009
    statement: TAE and NIFS demonstrated proton-boron fusion signatures in the Large Helical Device in 2023 by injecting boron and energetic hydrogen beams and then detecting alpha particles.
    type: third-party-reported
    topic: p-b11-validation
    sourceRefs:
    - SE018
    - SE002
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QE009
  - id: CE010
    statement: TAE's 2026 p-11B research updates point to higher reaction-rate prospects through beam-assisted ion acceleration and radio-frequency heating, but those are physics gains rather than plant-scale net-energy proof.
    type: company-claimed
    topic: p-b11-physics
    sourceRefs:
    - SE003
    - SE009
    confidence: medium
    freshness: recent
    answersQuestionRefs:
