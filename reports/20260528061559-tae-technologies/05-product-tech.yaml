- id: adjacent-lines-ip-and-trust-controls
  title: Adjacent product lines, IP moat, and trust / safety / quality controls
  body: 'TAE''s adjacent lines matter because they show where the accelerator platform leaves the fusion lab first. TAE Life Sciences is the strongest example: Alphabeam repackages accelerator know-how into an in-hospital BNCT system, and public partner/news materials already disclose an intended U.S. center, China patient throughput, uptime, warranty, service-contract economics, and supply-chain expansion. TAE Beam UK extends the same logic into neutral-beam manufacturing and service. Those adjacent lines do not prove that Da Vinci is bankable, but they do prove that the core hardware has applications outside a first-of-a-kind fusion plant. On IP, public evidence shows at least one granted U.S. patent family around negative-ion-based neutral beam injectors and TAE repeatedly cites a very large broader portfolio. On trust and safety, TAE emphasizes no chain reaction and less long-lived waste than fission, while DOE''s public fusion roadmap supports the broader claim that fusion needs a different
    regulatory frame from fission. Still, plant-level diligence remains incomplete. TAE has not yet published a plant-specific U.S. licensing path, a full quality-management stack, cyber certifications, or a detailed power-conversion architecture for Da Vinci. Those missing controls are the main product-technology diligence gap after the beam and plasma breakthroughs themselves.'
