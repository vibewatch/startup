company:
  name: TAE Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: 'TAE Technologies'' product thesis is a beam-driven field-reversed-configuration fusion plant whose core enabling module is the neutral beam stack: eight beamlines, stabilization controls, diagnostics, and software that turned Norm into the first publicly documented NBI-only FRC machine. The same accelerator platform is already being reused in TAE Beam UK and TAE Life Sciences, which strengthens the hardware moat and creates nearer-term commercialization paths. But Da Vinci timing, plant power-conversion details, plant-level QA/cyber controls, and any net-energy milestone remain forward-looking rather than independently validated.'
sections:
- id: core-product-architecture
  title: Core product architecture and customer workflow
  body: 'TAE''s primary commercial product is not a lab service or a software license; it is a utility-scale fusion power plant aimed at dispatchable electricity and, in TAE''s own framing, carbon-intensive industrial processes. The current product proxy is the Norm research machine, which demonstrates the stack TAE expects to matter in a future plant: a compact linear FRC vacuum vessel, a seed-plasma and fueling region, eight angled neutral beam lines, edge-biasing and magnetic-shaping controls, dense diagnostics, and supporting pulse-power infrastructure. The engineering logic is that neutral atoms can cross the reactor magnetic field to deliver heating, current drive, and stability, allowing the same accelerator platform to do more of the reactor''s work than in older FRC schemes. Public evidence is strongest at the component and experiment level, not the plant level. The Nature Communications paper verifies the NBI-only formation mechanism and associated control stack, while TAE''s own
    product materials quantify the machine simplification that resulted from removing the old formation hardware. For buyers, the workflow is straightforward in concept but not yet validated in the field: energize a compact plant, sustain a stable FRC, convert that output to dependable power, and scale from an initial 50 MWe class installation to larger utility assets later.'
