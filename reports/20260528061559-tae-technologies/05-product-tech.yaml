- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process / component
  - role
  - dependency
  - risk
  rows:
  - - Seed plasma and fueling region
    - Creates the target plasma that begins trapping injected beam ions
    - Gas fueling, open-field startup conditions, magnetic-coil shaping
    - Startup reliability is not publicly quantified at plant cadence
  - - Eight neutral beam lines
    - Provide heating, current drive, and stability to form and sustain the FRC
    - Injector hardware, vacuum systems, power supplies, beam aiming
    - Beam availability and cost are central single-point dependencies
  - - Edge biasing + magnetic shaping
    - Counter unwanted rotation and stabilize the FRC core
    - Electrode systems, divertor geometry, fast feedback
    - Control authority at larger plant scale is not yet public
  - - Diagnostics + Bayesian reconstruction
    - Infer plasma shape, temperature, density, and instability evolution from indirect measurements
    - High-rate sensors, GPU compute, reconstruction software
    - Control software QA and cyber hardening are undisclosed
  - - ML optimization / Optometrist workflow
    - Searches large control spaces to improve plasma performance between shots
    - Operator labeling, historical shot data, compute infrastructure
    - Public evidence stops at experiment optimization, not plant autonomous control
  - - Power delivery / conversion concept
    - Bridges machine pulse-power needs and eventual export electricity / heat
    - Converters, storage, balance-of-plant, grid interconnection
    - TAE has not published a full plant energy-balance or conversion architecture
  notes: The architecture table separates experimentally documented plasma subsystems from plant-level conversion and control layers where public disclosure remains thin.
