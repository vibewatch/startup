- id: SR004
  title: Partner, supply chain, talent, and customer-adoption risks
  body: |-
    TAE's dependency surface is broader than the headline merger suggests. First-plant siting depends on utilities, local governments, interconnection processes, land, transport links, and specialized labor. The UKAEA/Culham partnership offers a credible beam-technology commercialization path, and DOE-linked collaborations add scientific validation, but both also underline that TAE is still building through ecosystems rather than through a self-contained, utility-grade delivery stack. Those partnerships are real mitigants; they are not substitutes for proven plant execution.

    Talent concentration is equally material. Michl Binderbauer remains central to the science narrative, investor messaging, and proposed post-merger operating structure. TAE clearly has more depth than a typical startup, but fusion, neutral-beam, controls, licensing, and public-company integration talent are all specialized and expensive. Public materials do not yet show the supplier map, EPC strategy, or attrition data that would let an investor judge whether the organization can absorb first-plant execution without bottlenecks.

    Customer-adoption risk is the weakest leg of the public thesis. Reviewed public materials emphasize technology milestones, siting, and financing; they do not disclose signed PPAs, named utility customers, or recurring fusion-electricity revenue. TAE's adjacent businesses may eventually provide helpful optionality, but public sources do not quantify whether those activities can materially offset fusion burn. Until customer proof improves, investors are mostly underwriting a capitalized R&D and infrastructure story rather than a commercially validated energy platform.
