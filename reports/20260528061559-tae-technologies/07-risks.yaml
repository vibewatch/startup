  evidenceGaps:
  - type: missing-source
    severity: material
    topic: s4-disclosures
    missingEvidence: The current Form S-4, proxy/prospectus terms, lockups, PIPE arrangements, earnouts, and related-party disclosures.
    whyItMatters: Without the actual S-4 package, investors cannot verify whether the remaining $100 million, dilution mechanics, governance protections, or closing risks differ from the headline announcement.
    diligencePath: Obtain the latest draft or filed S-4 and have securities counsel mark up sources-and-uses, related-party provisions, lockups, and closing conditions.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-offtake
    missingEvidence: Signed utility PPAs, LOIs, project-finance discussions, or named offtake counterparties for the first fusion plant.
    whyItMatters: Customer adoption is the least-proven part of the TAE thesis; without commercial demand evidence, a public listing could precede any bankable market proof.
    diligencePath: Request the utility/customer pipeline, stage of each discussion, counterparty names under NDA, and any project-finance memoranda.
    relatedQuestionRefs:
    - QR021
    - QR022
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: fuel-cycle-safety-case
    missingEvidence: The intended first-plant fuel cycle, expected tritium inventory, waste classification assumptions, and emergency-planning basis.
    whyItMatters: TAE markets p-B11 as cleaner, but regulators will still judge the actual plant design and materials inventory; fuel choice affects licensing burden and safety capital.
    diligencePath: Request the preliminary safety analysis, fuel-selection memo, radiological inventory estimate, and draft environmental report outline.
    relatedQuestionRefs:
    - QR009
    - QR029
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: capital-allocation
    missingEvidence: A detailed post-close sources-and-uses plan showing how the announced cash covers siting, licensing, plant engineering, and contingency.
    whyItMatters: The merger headline may overstate de-risking if the plant budget, burn rate, and contingency reserves still imply another major capital raise before first power.
    diligencePath: Obtain management's board deck or financing model covering burn, capex, contingency, and standalone downside cases if the merger slips.
    relatedQuestionRefs:
    - QR012
    - QR013
    - QR026
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: board-independence
    missingEvidence: Names of the five planned independent directors, committee charters, related-party policy, and conflict-management procedures for the combined company.
    whyItMatters: Governance is a core residual risk because the proposed structure mixes a politically exposed public company with a pre-breakeven deep-tech business.
    diligencePath: Request the draft board slate, audit and conflicts committee charters, and any binding covenants on related-party approvals.
    relatedQuestionRefs:
    - QR014
    - QR028
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: minor
    topic: workforce-and-supply-chain
    missingEvidence: Long-lead vendor map for neutral-beam systems, EPC/site partners, attrition statistics, and critical-role hiring plans.
    whyItMatters: Operational execution depends on specialized talent and suppliers that are not visible in public materials; hidden bottlenecks could extend the plant schedule materially.
    diligencePath: Ask for the critical-path supplier list, lead times, EPC or utility partner shortlist, and 12-month attrition and vacancy metrics.
    relatedQuestionRefs:
    - QR019
    - QR020
    relatedTableRefs:
    - TR003
    - TR004
