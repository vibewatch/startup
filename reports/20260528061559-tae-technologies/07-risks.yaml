callouts:
- calloutType: risk
  title: Pre-breakeven public listing magnifies rather than removes capital risk
  body: The merger gives TAE a larger narrative platform and near-term cash, but it does so before scientific breakeven, before customer proof, and before the final U.S. fusion rule is in place. That combination makes valuation volatility itself a core operating risk.
  claimRefs:
  - CR004
  - CR021
  - CR022
  - CR023
  - CR025
  - CR039
- calloutType: insight
  title: Part 30 is a tailwind, not a permit waiver
  body: The NRC's choice of Part 30 is meaningfully better than a reactor-style framework, but TAE still needs project-specific environmental, materials-control, and siting evidence. Investors should not confuse a friendlier policy category with a finished licensing path.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR017
- calloutType: recommendation
  title: Minimum diligence pack before underwriting the story
  body: Require the S-4 package, board and conflicts documents, the first-plant fuel and safety assumptions, the siting critical path, and evidence of customer demand. Without those documents, the current thesis still depends too heavily on narrative and milestone optimism.
  claimRefs:
  - CR023
  - CR029
  - CR038
  - CR045
