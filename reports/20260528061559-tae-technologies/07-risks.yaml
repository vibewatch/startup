- id: SR003
  title: Financing, merger, and governance risks
  body: |-
    The announced Trump Media merger removes none of TAE's capital intensity; it only changes the form in which that capital risk is expressed. On paper, the terms are attractive: more than $6 billion headline value, roughly 50-50 ownership, $200 million of cash already advanced, and another $100 million contingent on the Form S-4. In practice, that structure introduces a new dependency chain. The remaining capital is filing-dependent, the closing remains subject to shareholder and regulatory approvals, and the post-close funding quality depends heavily on the stability and credibility of TMTG's public-market valuation.

    That last point is the crux. CNBC and TechCrunch both highlighted how little operating revenue Trump Media produced relative to its market capitalization. TAE is not being bought by a utility or infrastructure sponsor with a long operating record in power development; it is tying itself to a politically exposed meme-stock-like public vehicle whose own narrative has repeatedly outrun its fundamentals. TechCrunch's April 2026 reporting adds another uncomfortable layer: at the earlier private valuation, TAE investors were only around breakeven after nearly three decades and roughly $2 billion of capital raised. That makes the merger look partly like a financing solution and partly like a liquidity solution.

    Governance is the other unresolved leg of the stool. The proposed company has co-CEOs, Donald Trump Jr. on the board, and five independent directors not yet named. Newsweek also documented conflict-of-interest scrutiny around DOE-linked support. None of this proves wrongdoing. It does mean that governance, conflict management, and public-company controls deserve to be underwritten as core risks rather than mere headline noise.
