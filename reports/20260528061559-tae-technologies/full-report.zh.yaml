      - number: '4.4'
        title: 中性束、BNCT 与电力电子创造期权价值，但不能替代核心聚变尽调
        blocks:
          - type: paragraph
            body: >-
              TAE 的相邻业务有战略价值，因为它们缩短了从实验室技术积累到商业证明的路径。TAE Beam UK 已获得全额资金，有具名政府伙伴，并明确用于为多种聚变构型制造和服务中性束。TAE Life Sciences
              更进一步，展示了已安装硬件、面向医院的产品设计、患者吞吐量、正常运行时间和一份经常性服务合同。TAE Power Solutions 给 TAE
              另一条在漫长得多的聚变电站周期之外，把高功率电子技术积累变现的路径。相较核心聚变业务，这些相邻业务客户更清晰、用例更近、对证明首座电站的监管依赖更少。


              但公开披露还没走到能替代核心聚变逻辑、支撑融资判断的程度。TAE
              未披露分部收入、已安装基数经济性、实际定价、贡献利润率，也没有披露这些业务相对聚变项目消耗多少资本。因此，仅凭公开证据无法判断这些相邻业务是实质现金生成器、小型叙事增强项，还是仍在净消耗资本。尽调中正确姿态是把它们视为可信的期权价值和技术转移的部分去风险因素，而不是大到足以单独承销集团的已披露盈利引擎。


              这一区分决定了本章结论。相比许多聚变同行，TAE 的变现角度更多，这一点重要。但公司仍需要一个锚定核心聚变商业化的融资故事；在缺少电站经济性、现金跑道和分部财务的情况下，这个故事仍披露不足。
