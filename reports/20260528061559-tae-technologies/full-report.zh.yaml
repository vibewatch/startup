      - number: '3.4'
        title: 反向竞争证据与替代风险
        blocks:
          - type: paragraph
            body: >-
              对 TAE 竞争位置最重要的反向证据，是基于 D-T 的同行达成里程碑的速度。CFS 目标 2027 年展示 SPARC 净能量，并在约 2030–2033 年让 ARC 商业运行。Helion 于 2026
              年开工，并有一份瞄准 2028 年初始运行的 Microsoft PPA。如果其中任一里程碑按期实现，它们将在 TAE 的 p-B11 路线商业化前 5–10 年锁定长期公用事业和超大规模云厂商 PPA，形成
              TAE 在结构上很难替代的锁定。


              D-T 聚变需要氚，而氚是 CANDU 反应堆的副产物。Helion 计划通过其 D-He3 路线在内部自行增殖氚，可能消除 TAE 所称 p-B11 结构性优势中的氚瓶颈。如果 Helion
              的内部氚增殖在规模化后被证明有效，TAE 的燃料循环护城河会被部分削弱。


              General Fusion 在 2024 年的濒死经历——裁员、缩减运营、CEO 公开求资——说明即使是成熟度较高的聚变公司，也会在漫长开发时间线上面临生存级融资风险。TAE 最近披露的融资轮次在 2022
              年（报道为 $250M+），引发了其跑到 Norman 里程碑所需现金跑道的问题。


              SMR 替代方案带来平行替代风险：NuScale、Kairos Power、X-energy 和 Rolls-Royce SMR 都比任何聚变路线更接近商业运行。NEA SMR Dashboard 追踪到
              2025–26 年 SMR 许可和选址取得实质进展。如果在聚变达到商业可行性前，已有 20–30 GW SMR 容量被超大规模云厂商和公用事业公司承诺采用，第一代聚变电站的可用市场可能明显缩小。
            claimRefs:
              - CP030
      - number: '3.5'
        title: 图表
        blocks:
