      - number: '6.4'
        title: 耐久性、集中度和扩张路径：拿下第一个客户标识后，最大缺口才出现
        blocks:
          - type: paragraph
            body: >-
              TAE 的客户风险画像今天与其说由流失定义，不如说由公开耐久性数据完全缺失定义。现有材料都没有披露核聚变、Power Solutions、Life Sciences
              或束流业务的合同期限、续约节奏、NRR、GRR、队列留存、治疗量、复购历史或客户满意度指标。这意味着，即使存在具名交易方，报告也无法验证绑定多少收入、关系有多粘，或首个部署之后是否扩张。对首座同类核聚变电站，这一点尤其重要，因为第一个客户很容易在很长一段时间内贡献公司大部分商业收入。BNCT
              和数据中心电力管理也有类似集中度风险：一个医院体系、一个研究中心，或一个大型数字基础设施账户都可能主导初期收入。


              扩张具备可能性，但要先穿过一串困难采购步骤。公用事业和超大规模云厂商买家必须处理并网不确定性、成本分摊、许可和漫长建设周期；医院需要临床数据、安装预算和监管放行；束流客户还需要证据，证明 TAE
              能把内部反应堆组件转化为更广泛的产品线。因此，最合适的承销视角是分阶段扩张路径：第一，TAE 在储能、束流和 BNCT
              上赢得相邻证据；第二，转化首个核聚变电站站址和购电结构；第三，用该电站的运营证据扩展到重复购买的公用事业、超大规模云厂商和工业流程客户。在第二阶段由签署合同而不是战略幻灯片可见之前，客户章节讲的更多是潜在需求和采购摩擦，而不是商业耐久性。
