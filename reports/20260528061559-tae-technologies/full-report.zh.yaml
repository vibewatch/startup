      - number: '1.4'
        title: 里程碑、合作伙伴与未来路径
        blocks:
          - type: paragraph
            body: >
              TAE 的公开里程碑从 1998 年研究创立开始，经过多次等离子体性能进展，走到 2025 年科学突破以及 2025-2026
              年商业化推进；后者包括一项待完成的公开市场交易、一个英国合资公司和美国商业电站选址评估。


              关键科学里程碑包括 C-2、C-2T、C-2U、Norman 和 Norm 各装置中 FRC 等离子体温度与稳定持续时间的逐步提升。2025 年 11 月 Norm 的突破发表于 Nature
              Communications，取消了第六台实验装置的必要性，并直接支撑 Da Vinci 装置。TAE 表示 Da Vinci 将瞄准实现净能量增益所需的热核条件；没有公开来源给出 Da Vinci
              完成日期或详细工程规格。


              2025 年 12 月，TAE 与 UKAEA（UK Atomic Energy Authority）宣布成立合资公司 TAE Beam UK，总部设在英国 Oxfordshire 的 Culham
              Campus。TAE Beam UK 将聚焦把 TAE 的中性束注入技术商业化，用于医疗和工业应用——这些业务与发电分开——同时也为聚变活动提供一条英国监管和研究路径。截至 2026 年 5 月，TAE Beam
              UK 已进入商业化下一阶段，并在 Culham 完整落地。


              美国 Department of Energy 向 TAE 颁发了 2025 年 INFUSE（Innovation Network for Fusion Energy Sciences）奖项，用于与
              Lawrence Berkeley National Laboratory 合作开展等离子体模拟工作；这是 DOE 向美国聚变产业提供的 $134M INFUSE 和 FIRE 合作奖项的一部分。2026 年 2
              月，TAE 与日本 National Institute for Fusion Science 在同行评审期刊 Nuclear Fusion 上发表联合研究。


              2026 年 4 月和 5 月，TAE 围绕计划中的首座商业电站完成多州选址评估，覆盖 Alabama、Ohio 和 Texas，目标输出为 50 MWe。公司尚未公开宣布选址决定。


              2025 年 12 月，TAE 与 TMTG 的合并公告引发了竞争聚变初创公司和财经媒体的担忧。Zap Energy 公开称，TAE 关于科学“已经解决”的说法并不坦诚。TechCrunch 在 2026 年 4
              月报道，盈亏平衡前进行 SPAC 合并，会给前沿科学公司带来可信度和治理风险。TMTG 董事会成员 Donald Trump Jr. 也带来金融分析师提出的治理集中度担忧。这些反向信号不会否定 TAE
              的科学记录，但对于评估其公开市场转型风险很重要。
