  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 潜在买方图谱：公用事业、超大规模云厂商、工业热能和支撑交易方
        blocks:
          - type: paragraph
            body: >-
              分析 TAE
              时，要把它看成一家拥有多个客户触点、但核心能源产品仍很远期的公司。核聚变发电业务里，最终买方大概率是公用事业公司、市场化发电商，或需要稳定零碳电力且能承受首座同类项目建设和合同风险的大型企业能源买家。TAE
              自己的选址材料显示，首座电站仍处在地点评估阶段，因此今天更准确的“客户”其实是潜在买方和支撑交易方：州与地方政府、接入输电网的承载地区、监管机构、基础设施伙伴，以及早期战略性购电方。TAE
              也明确把后续电站不仅卖给电网，还卖给碳密集工业流程；这创造了第二类更远期买方，他们同时关心电力和脱碳工艺热。


              近期收入图景在相邻业务里更具体。TAE Power Solutions 瞄准数据中心、高性能计算、电网效率和电池储能买家；这些买家要的是快速电力调节和表后灵活性，而不是核聚变电力。TAE Life
              Sciences 面向医院、癌症中心和学术肿瘤项目，销售硼中子俘获治疗（BNCT）系统并推进硼药物开发。TAE Beam UK 这个与 UKAEA
              的合资企业根本不是公用事业客户；它是中性束技术商业化载体，可以服务 TAE
              自有电站、其他核聚变开发商，以及癌症治疗、食品安全、国土安全等选定非核聚变市场。因此，本章必须仔细区分生产客户、试点、潜在装机和支撑伙伴，不能把所有具名关系都当作等同的收入证据。
