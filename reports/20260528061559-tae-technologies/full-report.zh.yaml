  - id: TV005
    title: 投资逻辑破裂与否决触发因素
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 合并延迟
        - 申报或审批路径相对管理层预期出现重大延迟
        - 拿掉公开资本捷径，削弱乐观情景融资逻辑
        - 直接转向悲观情景测算
      - - 建厂前再次股权融资
        - Da Vinci 经济性披露前还需要新资本
        - 说明当前融资不足，并加重摊薄压力
        - 假设估值向近期私募估值标记靠拢，甚至低于该水平
      - - 无电站经济性披露
        - 下一轮尽调时仍没有可信的资本开支、产出或购电框架
        - 阻断从科学命题升级为可投基础设施逻辑
        - 即使公告价格维持，也保持回避立场
      - - 同业里程碑差距扩大
        - Helion/CFS 继续增加已披露的购电、建设或工程进展，而 TAE 没有
        - 比较溢价更难成立
        - 下调并收窄基准情景区间
      - - 公开市场倍数压缩
        - 已上市核能 / 聚变类比从当前水平大幅降评级
        - 拿掉支持 TAE 的乐观公开市场区间论证
        - 用 NuScale 式下行，而不是 Oklo 式上行，作为公开市场可比锚点
    notes: 触发因素是可监测事件；一旦出现，就会推翻当前观察名单逻辑，或支撑更严格的下行情景。
    claimRefs:
      - CV011
      - CV032
      - CV035
      - CV036
      - CV037
      - CV042
      - CV043
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 股权结构表与优先权
        - 股份类别、清算优先权、转换权、参与权、附函
        - 决定有效入场价格和下行保护流失
        - 向管理层 / 数据室索取完整股权结构表和融资文件
      - - 合并申报文件包
        - S-4/代理文件、风险因素、投票门槛、交割条件、资金用途细节
        - 把公告条款转成可投资的公开披露
        - SEC 文件一有就立即调取，并与新闻稿核对
      - - Da Vinci 与首座电站经济性
        - 资本开支、进度、选址假设、容量因子、电价、项目融资计划
        - 没有电站经济性，估值论证仍会偏叙事
        - 索取工程模型和项目开发工作流
      - - 子公司财务贡献
        - TAE Power Solutions 和 TAE Life Sciences 的收入、利润率和烧钱速度
        - 可能显著抵消或掩盖聚变项目现金需求
        - 索取分部财务和主要客户合同
      - - 商业需求证明
        - 具名购电、公用事业 / 数据中心合作，或项目融资对手方
        - 会显著提升其与 Helion/CFS 式证明点的可比性
        - 跟踪下一轮融资、选址或客户公告
    notes: 这些问题是重新考虑向该标的投入新资本前所需的最低工作包。
    claimRefs:
      - CV037
      - CV042
      - CV043
      - CV047
