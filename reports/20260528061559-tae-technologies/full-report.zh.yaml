      - number: '2.3'
        title: 买方、用户与付款方分层：公用事业公司和大负荷开发商掌握经济闸门
        blocks:
          - type: paragraph
            body: >-
              买方图谱很重要，因为 TAE
              卖入的是基础设施市场，需要能源的人并不总是购买或融资资产的一方。在公用事业级电力中，经济买家最可能是寻求可靠低碳容量的公用事业公司、独立发电商或大负荷开发商。运营用户是电网或需要电力的大型设施，最终付款方则是签约购电方、公用事业资本计划或受费率基数支持的客户组合。在数据中心相关部署中，超大规模云厂商更应被理解为锚定购电方或共同开发伙伴，而不是简单终端用户：它们可能签
              PPA、支持表后发电或影响选址，但仍依赖更广的融资和许可栈。


              工业供热有不同的购买中心。可能买家是工业厂房业主或能源经理；用户是工厂运营和流程工程团队；付款方则是资本开支预算、项目融资结构，或在某些情况下由激励支持的供热即服务交易方。这让采用对改造停机时间、流程兼容性和本地电价的敏感度，远高于工业排放的标题规模所暗示的程度。


              相邻加速器市场分得更远。医院、肿瘤中心、公共实验室和安全相关机构不买电站；它们购买的是嵌入临床、研究或工业流程的专用设备。因此，加速器和医疗业务具有战略意义，但分析上必须分开。它们可以证明制造能力、创造更早收入并扩大策略合作，却不能解答
              TAE 估值的核心市场问题：公司能否以有竞争力的成本和商业相关规模，出售稳定清洁电力，并最终出售清洁工业能源。
