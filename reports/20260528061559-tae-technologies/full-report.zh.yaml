  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: TAE 的公开记录从 1998 年的学术研究起点开始，经过五代装置、2025 年 11 月突破和 2025 年 12 月公开市场合并公告；投资人回报接近收支平衡的背景，也让这次合并更像一次流动性事件。
    data:
      items:
        - date: '1998'
          label: 以 Tri Alpha Energy 名义成立
          detail: 联合创始人 Norman Rostoker 和 Michl Binderbauer，UC Irvine。
          tone: positive
        - date: '2014'
          label: Rostoker 去世；Binderbauer 出任 CEO
          detail: 领导权集中到联合创始人 Binderbauer 手中。
          tone: warning
        - date: ~2015
          label: 更名为 TAE Technologies
          detail: 反映中性束注入技术范围扩大。
          tone: neutral
        - date: '2017'
          label: Norman（C-2W）装置投运
          detail: 创下 FRC 等离子体温度纪录；以联合创始人命名。
          tone: positive
        - date: 2025-06
          label: $150M Series G 轮完成
          detail: Google 和 Chevron Technology Ventures 共同领投；NEA 参投。
          tone: positive
        - date: 2025-09
          label: DOE INFUSE 2025 奖项
          detail: 与 Lawrence Berkeley National Laboratory 合作开展等离子体模拟。
          tone: positive
        - date: 2025-11
          label: Norm 仅靠 NBI 的等离子体突破
          detail: 取消对 Copernicus 装置的需求；缩短通往 Da Vinci 的路线图。
          tone: positive
        - date: 2025-12
          label: TMTG 合并公告（>$6B）
          detail: 全股票交易；PitchBook 估计合并前估值约 $2B；此前轮次投资者接近收支平衡。
          tone: warning
        - date: 2025-12
          label: TAE Beam UK 与 UKAEA 合资
          detail: 位于 Culham Campus；NBI 技术用于医疗和工业用途。
          tone: positive
        - date: 2026-02
          label: Burgher 出任 CFO；NIFS 论文发表
          detail: 公开公司准备度和同行评议科学里程碑。
          tone: positive
        - date: 2026-04
          label: 多州选址评估巡回
          detail: Alabama、Ohio、Texas；首座 50 MWe 电站选址；尚未公告决定。
          tone: neutral
        - date: 2026-05
          label: TAE Beam UK 在 Culham 全面运营
          detail: 进入下一阶段商业化。
          tone: positive
        - date: TBD
          label: Da Vinci 装置目标
          detail: 商业原型；净能量增益里程碑；未披露日期。
          tone: neutral
