            body: TAE 仍值得跟踪，因为科学项目真实，融资路径可能变强。但宣布价格高于最佳公开市场证据。只有当估值压缩到低到中位 $3B 区间，或并购文件和电站经济性包弥合与 Helion、CFS 的证据差距时，才重新评估。
