      - number: '1.3'
        title: 融资历史、资本结构与投资人联盟
        blocks:
          - type: paragraph
            body: >
              自 1998 年以来，TAE 已完成十一轮或更多股权融资，累计超过 $1.3B，是全球资本化程度最高的私人聚变公司之一。公司没有在公开材料中发布完整逐轮融资表，但个别轮次已通过新闻稿公布，并被财经媒体报道。


              最近一次披露融资是 2025 年 6 月完成的 $150M Series G，由 Google 和 Chevron Technology Ventures 共同领投，NEA 也参与。Google 和
              Chevron 被描述为共同领投方；Google 的参与兼具财务和战略兴趣，指向其数据中心组合所需的清洁能源来源。Data Center Dynamics、ESG News、NEI
              Magazine、MLQ.ai、GlobalCarbonFund 等媒体都报道了这一轮，引用的是同一组新闻稿数字。


              早期投资人披露显示，Goldman Sachs、Sumitomo Corporation、Wellcome Trust、Addison Fischer、Charles Schwab 和 Samberg
              Family Foundation 均参与过此前轮次。PitchBook 的公司档案是 TAE 融资历史的主要分析师数据源，其估计 TAE 合并前估值约为
              $2B，意味着较早轮次进入的投资人在账面回报上可能接近盈亏平衡。这一背景有助于理解合并动机：如果 TMTG 的全股票交易按超过 $6B 的名义企业价值完成，将显著高于 PitchBook
              估计值，并为早期投资人提供一条借公开市场退出的路径。


              根据 2025 年 12 月 18 日宣布的合并协议，TMTG 同意向 TAE 提供 $300M 现金：签署时 $200M，提交 S-4 注册声明后再支付 $100M。截至 2026 年 5 月，TAE
              已确认收到 $200M 签署现金；S-4 尚未提交，合并也尚未完成。
