            title: Helion PPA 锁定风险
            body: >-
              Helion 已有施工许可和一份瞄准 2028 年的 Microsoft PPA。CFS 目标 2027 年实现 Q>1。如果 D-T 路线在 TAE 的 p-B11
              技术商业化之前锁定主要超大规模云厂商和公用事业 PPA，TAE 将在其 2030 年代主要可触达市场面临结构性替代风险。
