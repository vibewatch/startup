      - number: '8.3'
        title: 可比公司集与证据支撑的估值方法
        blocks:
          - type: paragraph
            body: >-
              这里有三种估值方法站得住。第一，TAE
              自身最近的私募标记：它们并不完美，但仍是最干净的锚点，因为代表真实市场出清事件或可观察老股信号。第二，基于里程碑的私募核聚变可比公司：CFS、Helion、Zap、Proxima 和 General Fusion
              展示了投资者最近愿意在特定电站就绪度、购电证据和工程降险水平上出多少钱。第三，Oklo 和 NuScale 等上市可比公司，为公开市场如何定价先进核能叙事提供情绪区间。站不住的是伪精确 DCF。TAE
              没有发布足够的电站级经济性、商业化节奏或资本结构细节来支撑 DCF。


              这些方法指向同一方向。私募标记显示，可观察区间更接近约 $2.5-2.9 billion，而不是 >$6 billion。里程碑可比公司显示，Helion 和 CFS
              应享有溢价地位，因为它们在商业化路径上披露的证据更强；Zap、Proxima 和 General Fusion 则说明，重要核聚变里程碑仍可能以远低于 TAE
              宣布公开市场跳升的价格获得融资。上市可比公司扩大了区间，而不是给出答案：Oklo 证明，上市先进核能热情可以在收入前把公司推到两位数十亿美元市值；NuScale
              则展示了反面，数十亿美元市值一旦执行信心下降仍会快速压缩。正确结论是用锚定里程碑证据的情景区间，而不是单一英雄数字。
