      - number: '8.5'
        title: 融资悬顶、退出就绪度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              待完成的 TMTG 交易给了 TAE
              一条可能的流动性路径，但从承销意义上看，它还没有让公司达到上市公司就绪。公告回答了标题问题——价值、股权拆分和现金承诺——但把最重要的尽调项留在保留公开记录之外：准确股权结构表和优先权条款、电站级资本需求、分部财务，以及最终并购申报文件包。即便看多的观察者也把这笔交易描述为反向并购或公开资本捷径，这一背景有用。捷径仍可能奏效，但不能替代投资者在支付溢价估值前通常期待的披露质量。


              因此，本章最终立场是严格控制入场纪律。现有证据支持跟踪
              TAE，因为其科学项目仍具意义，且并购可能创造真实融资优势。现有证据不支持按宣布价格买入。下一次复盘应由少数具体尽调问题和杀伤触发点把关：披露优先权堆叠；发布并购申报文件包；展示 Da Vinci
              和首座电站的资本开支、进度和电力经济性；证明子公司是贡献有意义价值，还是只是消耗资本。如果答案强，故事可以重新走向乐观情景。如果答案弱，>$6 billion 的标题将更像融资事件，而不是公允价值。
