      - number: '4.2'
        title: 资本强度看得见，可用单位经济性看不见
        blocks:
          - type: paragraph
            body: >-
              TAE 的公开披露虽然没有达到可发布单位经济性的程度，但对成本结构给出了强方向信号。公司称其在加速器技术上投入约 $100M，建成 $150M 的国家实验室尺度 Norman
              装置，并自建专有电力管理系统，因为本地电网只能提供 2 MW，而 Norm 运行时达到 750 MW。这些事实没有揭示烧钱速度、每 MW 电站资本开支或利润率，却说明 TAE
              处在工程重资产环境中，电力电子、加速器、科研硬件和场址基础设施比软件式毛利率更重要。


              政府和行业材料也强化了这一点。DOE 路线图仍把商业化目标放在 2030 年代中期，而 ARPA-E 2026
              年资金包聚焦于等离子体加热、驱动系统、电力转换、先进电站架构和耐久性——这些类别正是首台套电站经济性中往往最占主导的部分。换句话说，公共部门仍在资助硬问题，因为这些硬问题还没有便宜到只靠私人资本就能解决。


              因此，本章留下一个尖锐不对称：TAE 可以解释其路线为何会随时间变得更小、更便宜、更易维护，但没有发布从今天的研发平台走到未来电站级毛利的财务桥梁。公开材料没有资本开支模型、没有每 MW
              成本目标、没有营运资本画像，也没有子公司分部利润率披露。承销只能依赖成本强度代理指标和证据缺口，而不是由公司已报告数据验证的自下而上模型。
