  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品架构与客户工作流
        blocks:
          - type: paragraph
            body: >-
              TAE 的首要商业产品不是实验室服务，也不是软件许可；它是一座公用事业级聚变电站，面向可调度电力，并按 TAE 自身说法服务碳密集型工业流程。当前产品代理物是 Norm 研究装置，它展示了 TAE
              认为未来电站必须成立的一整套栈：紧凑线性 FRC
              真空容器、种子等离子体和加料区域、八条倾斜中性束线、边缘偏置和磁成形控制、密集诊断，以及配套脉冲功率基础设施。工程逻辑是，中性原子可以穿过反应堆磁场，输送加热、电流驱动和稳定性，让同一个加速器平台比旧 FRC
              方案承担更多反应堆工作。公开证据最强的是部件和实验层面，而不是电站层面。Nature Communications 论文验证了仅靠 NBI 形成等离子体的机制及相关控制栈，TAE
              自身产品材料则量化了移除旧形成硬件后带来的装置简化。对买家而言，工作流概念上直接，但尚未在现场验证：给一座紧凑电站通电，维持稳定 FRC，将输出转为可靠电力，并从最初 50 MWe
              级装置扩展到后续更大的公用事业资产。
