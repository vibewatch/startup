      - number: '7.3'
        title: 融资、并购与治理风险
        blocks:
          - type: paragraph
            body: >-
              已宣布的 Trump Media 并购没有消除 TAE 的资本密集度；它只是改变了资本风险的呈现形式。纸面条款很有吸引力：超过 $6 billion 的名义价值、约 50-50 股权、已经预付 $200
              million 现金，以及另有 $100 million 取决于 Form S-4。实际看，这一结构引入了新的依赖链。剩余资本取决于文件提交，交易交割仍需股东和监管批准，交割后的融资质量高度依赖 TMTG
              公开市场估值的稳定性和可信度。


              关键就在最后一点。CNBC 和 TechCrunch 都强调，Trump Media 的经营收入相对于其市值非常小。TAE
              不是被一家在电力开发上有长期运营记录的公用事业或基础设施发起方收购；它是在把自己绑定到一个政治曝光度很高、类似散户炒作股的上市载体上，而该载体自己的叙事已多次跑在基本面前面。TechCrunch 2026 年 4
              月报道又加上一层不舒服的事实：按更早的私募估值，TAE 投资者在近三十年和约 $2 billion 融资之后也只是接近盈亏平衡。这让并购看起来一部分是融资方案，一部分是流动性方案。


              治理是另一条未解决的支腿。拟议公司将设联合 CEO，Donald Trump Jr. 进入董事会，另外五名独立董事尚未公布。Newsweek 也记录了围绕 DOE
              相关支持的利益冲突审查。这些都不能证明存在不当行为。但它确实意味着，治理、冲突管理和上市公司控制应被作为核心风险承销，而不是简单当作标题噪音。
            claimRefs:
              - CR021
