      - number: '2.4'
        title: 驱动因素与采用约束：需求拉力强，但资本强度、监管和并网仍决定节奏
        blocks:
          - type: paragraph
            body: >-
              市场论证中的积极面很直接。AI
              和先进制造正把可靠电力需求提前；全球清洁能源投资仍处高位；政府项目越来越把电力安全、电网现代化和低碳供应视为产业政策；聚变也已跨过门槛，从孤立科学项目变成有风险资本支持的工业部门，具备行业报告、专门公共项目和更清晰的监管路径。对
              TAE 而言，这意味着宏观需求问题真实存在，政策环境也比几年前更有利。


              更难的问题是采用时点。本章每一个外部视角都会回到首台套执行风险。聚变公司仍报告称，在试点电站上线前还有巨大资本需求。NRC
              拟议的聚变规则明显轻于裂变式反应堆许可，但仍要求辐射安全、环境审查、材料追踪和废弃物路径；监管简化并不等于商业捷径。并网队列仍堵塞，输电规划落后于 AI
              建设周期，甚至燃气加碳捕集、传统先进核能等更近端方案，也在争夺 TAE 希望填补的同一个稳定电力缺口。工业供热还多一重门槛，因为技术适配和项目经济性随流程温度和行业差异很大。


              因此，市场结论是平衡的。TAE 对准的是一个严肃且扩大的需求——稳定清洁电力，并可选地关联工业供热——相邻加速器业务也拓宽了平台。但可服务市场应按受执行约束的基础设施市场来承销，而不是简单按“大
              TAM”故事来承销。在 TAE 披露更多电站经济性、客户承诺以及从首座电站走向重复部署的路径之前，审慎做法是承认市场规模真实，但可服务性高度有条件。
