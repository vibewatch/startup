            - 中 — 资金已落实的合资公司和已签类比 PPA，但没有 TAE 电力交付
        - label: 收入可见度
          values:
            - None
            - 未公开披露
            - 未公开披露
            - 已披露资金和战略价值；未披露积压订单 / 对外销售
        - label: 留存 / 复购指标
          values:
            - None
            - None
            - None
            - None
        - label: 尽调中的最佳用途
          values:
            - 显示核心客户证据缺失
            - 显示电力管理 IP 的相邻买方需求
            - 显示医院 / 研究机构对加速器衍生疗法的需求
            - 显示市场对束线和聚变承购的更广泛需求
    approximationNotes: 该矩阵比较的是证据质量，而不是产品吸引力。“类比聚变 PPA”只用于显示品类层面的买方意愿，不作为 TAE 客户证据。
    claimRefs:
      - CU011
      - CU021
      - CU024
      - CU028
      - CU037
      - CU038
  - id: FU004
    title: 从相邻证据到聚变客户的扩张路径
    type: flow
    layout: wide
    summary: TAE 当前商业化逻辑从相邻证据表面出发，走向更难的任务：赢得首个公用事业级聚变客户，并继续扩张到重复站点。
    data:
      nodes:
        - id: core-ip
          label: 聚变与加速器 IP
          detail: 核心科学产生中性束、电力电子和控制系统。
          tone: positive
        - id: power-proof
          label: Power Solutions 证据
          detail: MARA 和其他 B2B 储能 / 电网效率合作验证了即时电力管理用例。
          tone: positive
        - id: clinical-proof
          label: BNCT 证据
          detail: UW、Xiamen、CNAO 和 Ohio State 为进入医院市场提供临床和研究交易对手。
          tone: positive
        - id: beam-proof
          label: TAE Beam UK
          detail: UKAEA 合资公司为中性束创造供应链和第三方商业化路径。
          tone: positive
        - id: first-fusion-customer
          label: 首座聚变电站承载方 / 承购方
          detail: 截至 2026-05-28 公开层面仍缺失；需要选址、签约和融资三者对齐。
          tone: warning
        - id: repeat-sites
          label: 重复公用事业 / 工业 / 超大规模云厂商站点
          detail: 只有首座电站产生运营证据和可融资客户参考之后才可能实现。
          tone: neutral
      edges:
        - from: core-ip
          to: power-proof
        - from: core-ip
          to: clinical-proof
        - from: core-ip
          to: beam-proof
        - from: power-proof
          to: first-fusion-customer
        - from: clinical-proof
          to: first-fusion-customer
        - from: beam-proof
          to: first-fusion-customer
        - from: first-fusion-customer
          to: repeat-sites
    approximationNotes: 该流程是战略性的，不是合同性的。它展示相邻证据如何可能降低买方疑虑，但不意味着相邻业务会自动转成聚变承购。
    claimRefs:
      - CU006
      - CU008
      - CU009
      - CU021
      - CU028
      - CU033
      - CU037
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 截至 2026-05-28，TAE 六大主要风险集群的相对发生概率、影响、缓释成熟度和剩余暴露。
    data:
      columns:
        - 技术 / 商业化
        - 监管 / 安全
        - 融资 / 公开市场
        - 合作伙伴 / 依赖
        - 供应链 / 人才
        - 客户采用
      rows:
        - label: 发生概率
          values:
            - 高
            - 中
            - 高
            - 中
            - 中
            - 高
        - label: 影响
          values:
            - 严重
            - 高
            - 严重
            - 高
            - 高
            - 高
        - label: 缓释成熟度
          values:
            - 中
            - 中
            - 中低
            - 中
            - 中低
            - 低
        - label: 剩余暴露
          values:
            - 严重
            - 高
            - 严重
            - 高
            - 高
            - 高
    approximationNotes: 评级是作者基于已审阅公开证据做的定性编码，不是精算概率。若公开证据仍取决于未来里程碑，而不是已经完成的验证，剩余暴露保持严重。
    claimRefs:
      - CR002
      - CR011
      - CR021
      - CR025
      - CR037
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 技术、许可和融资一旦失灵，会如何传导到估值、治理和客户采纳风险。
    data:
      nodes:
        - id: physics-gap
          label: 物理 / 工程差距仍在
          detail: Norm 和 Norm Upgrade 未能转化为外部可独立读懂的电站级就绪度。
        - id: timeline-slip
          label: 电站进度滑期
          detail: 2026 年选址和开工叙事，或 2030 年代初首电叙事，向后推迟。
        - id: capital-burn
          label: 资金消耗期拉长
          detail: 客户证据出现前，延期会推高现金需求。
        - id: s4-dependence
          label: 合并依赖加深
          detail: TAE 更依赖 S-4 文件提交和交易交割时间，为下一阶段融资。
        - id: valuation-volatility
          label: 公开市场估值波动
          detail: 合并对价货币走弱或治理疑虑，会拉低融资质量。
        - id: customer-proof-delay
          label: 客户验证仍缺位
          detail: 没有 PPA 或公用事业承购，商业化仍停在理论层面。
        - id: repricing
          label: 投资逻辑向下重估
          detail: 投资人会给 TAE 施加更高执行和融资折扣。
      edges:
        - from: physics-gap
          to: timeline-slip
          label: 导致
        - from: timeline-slip
          to: capital-burn
          label: 拉长
        - from: capital-burn
          to: s4-dependence
          label: 推高
        - from: s4-dependence
          to: valuation-volatility
          label: 经由
        - from: timeline-slip
          to: customer-proof-delay
          label: 推迟
        - from: valuation-volatility
          to: repricing
          label: 驱动
        - from: customer-proof-delay
          to: repricing
          label: 强化
    claimRefs:
      - CR003
      - CR013
      - CR022
      - CR023
      - CR025
      - CR038
      - CR040
      - CR045
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: TAE 从现有进展走到首座可融资电站，离不开这些关键交易对手和生态系统。
    data:
      nodes:
        - id: tmtg
          label: TMTG / S-4 / 股东
          detail: 合并交割和公开市场资本桥接。
        - id: nrc
          label: NRC / 许可框架
          detail: Part 30 最终实施，以及具体电站许可路径。
        - id: states
          label: 州政府 / 公用事业 / 并网链条
          detail: 选址、本地审批和电网接入。
        - id: ukaea
          label: UKAEA / Culham
          detail: 束流技术多元化和供应链立足点。
        - id: doe
          label: DOE / 国家实验室生态
          detail: INFUSE 和商业化支持网络。
        - id: investors
          label: Google / Chevron / 现有投资团
          detail: 战略投资人支持和后续融资可信度。
        - id: binderbauer
          label: Binderbauer / 高管团队
          detail: 科学叙事、伙伴管理和运营执行。
        - id: first-plant
          label: 可融资首座电站
          detail: 选址、许可、资金和客户证据在此汇合。
      edges:
        - from: tmtg
          to: first-plant
          label: 提供资金
        - from: nrc
          to: first-plant
          label: 发放许可
        - from: states
          to: first-plant
          label: 承载
        - from: ukaea
          to: first-plant
          label: 支持生态
        - from: doe
          to: first-plant
          label: 验证 / 协作
        - from: investors
          to: first-plant
          label: 桥接资本
        - from: binderbauer
          to: first-plant
          label: 协调
    claimRefs:
      - CR017
      - CR020
      - CR023
      - CR033
      - CR035
      - CR036
      - CR037
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议链条从真实技术进展出发，穿过融资背景和可比证据，最终落到取决于价格的回避 / 观察结论。
    data:
      nodes:
        - id: n1
          label: 科学可信度
          detail: Google 背书的进展和持续融资说明，TAE 并非纯宣传项目。
          tone: positive
        - id: n2
          label: 近期私募估值标记
          detail: 2025 年融资轮和 2026 年 5 月下旬追踪估值，集中在远低于 >$6B 的区间。
          tone: warning
        - id: n3
          label: 合并溢价
          detail: 公开市场路径和现金承诺带来上行期权。
          tone: positive
        - id: n4
          label: 同行里程碑差距
          detail: Helion 和 CFS 披露的商业化证据仍更强。
          tone: warning
        - id: n5
          label: 稀释压力
          detail: 12+ 轮融资和不透明优先权，可能侵蚀实际上行空间。
          tone: warning
        - id: n6
          label: 公开市场可比区间
          detail: Oklo 显示上行情绪；NuScale 提醒估值压缩风险。
          tone: neutral
        - id: n7
          label: 当前结论
          detail: 若价格 >$6B，则回避；若重新定价或披露更充分，则观察。
          tone: warning
      edges:
        - from: n1
          to: n3
          label: 支撑
        - from: n2
          to: n7
          label: 约束
        - from: n3
          to: n7
          label: 对冲
        - from: n4
          to: n7
          label: 约束
        - from: n5
          to: n7
          label: 约束
        - from: n6
          to: n7
          label: 框定区间
    approximationNotes: 这是对本章证据链的概念性综合，不是定量模型。
    claimRefs:
      - CV005
      - CV012
      - CV031
      - CV032
      - CV036
      - CV040
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 示意性估值锚点采用直接私募估值标记、当前追踪值和公开 / 同行可比项，而不是 DCF。
    data:
      items:
        - label: 2026 年 5 月下旬 Yahoo/Forge 估计
          value: 2470
          unit: $M equity value
        - label: 2025 年 6 月融资轮投后估值
          value: 2900
          unit: $M equity value
        - label: 基准情景再进入区间中点
          value: 3500
          unit: $M equity value
        - label: Helion 披露估值
          value: 5400
          unit: $M equity value
        - label: 待完成合并公告价
          value: 6000
          unit: $M+ headline value
        - label: Oklo 公开市场市值
          value: 11800
          unit: $M market cap
    approximationNotes: 柱形条混合了私募投后估值、公开市场市值和一个情景中点，只用于展示数量级敏感性。它们不是同口径企业价值。
    claimRefs:
      - CV003
      - CV002
      - CV018
      - CV026
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间用概率和里程碑来表达公允价值争论，而不是给出精确预测。
    data:
      items:
        - label: 悲观
          low: 1500
          mid: 2000
          high: 2500
          unit: $M equity value
        - label: 基准
          low: 3000
          mid: 3500
          high: 4000
          unit: $M equity value
        - label: 乐观
          low: 5000
          mid: 5750
          high: 6500
          unit: $M equity value
        - label: 公布价格
          low: 6000
          mid: 6000
          high: 6000
          unit: $M+ headline value
    approximationNotes: 悲观情景假设合并失败或压力下资本重组；基准情景锚定近期私募估值标记，并加入温和里程碑上调；乐观情景假设合并交割，再叠加新场址、融资和商业化证据。优先分配瀑布未建模，可能压低实际股权回报。
    claimRefs:
      - CV029
      - CV040
      - CV041
      - CV042
      - CV043
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按投委会口径，对证据、估值、披露和下行保护打分。
    data:
      items:
        - label: 技术证据
          value: 7/10
          note: 科学进展可信，老投资方反复支持，但仍未实现能量收支平衡。
        - label: 商业证据
          value: 4/10
          note: 尚未披露可与 Helion/CFS 公开证据对标的承购或电站经济性。
        - label: 资本可得性
          value: 8/10
          note: 合并和明星支持方带来融资选择权。
        - label: 估值公允性
          value: 3/10
          note: 公开市场上的私募估值标记远低于公布价格。
        - label: 披露质量
          value: 4/10
          note: 核心条款已经公开；股权结构表、经济性和申报材料包尚未公开。
        - label: 稀释保护
          value: 3/10
          note: 12+ 轮融资和不透明优先权带来悬顶风险。
        - label: 退出准备度
          value: 4/10
          note: 流动性路径存在，但上市公司尽调材料包并不完整。
    approximationNotes: 分数是作者基于已披露证据给出的 1-10 分判断；分数越高越好。综合含义是观察公司，但回避公布价格。
    claimRefs:
      - CV005
      - CV031
      - CV036
      - CV040
      - CV044
      - CV045
