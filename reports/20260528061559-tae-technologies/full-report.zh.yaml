  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 核心聚变收入仍未商业化，少数变现证据集中在相邻业务
        blocks:
          - type: paragraph
            body: >-
              公开记录看起来仍像商业化路线图，而不是一门已运营收入业务。TAE 自身合并和 FAQ 材料聚焦于 2026 年为首座 50 MWe 电站选址、推进 Da Vinci，以及在 2030
              年代初把电子送上电网。这些都是重要里程碑，但不等同于已披露售电收入、客户预付款或项目积压。即便 PitchBook
              的存档档案把最新交易标为“产生收入”，当前收入字段仍为空。在本报告审阅的官方融资页、投资人页、FAQ 和合并材料中，核心聚变业务没有任何公开收入数字、ARR 数据或毛利率披露。


              当下实际变现的最佳公开证据来自相邻业务。TAE Life Sciences 的经济叙事比聚变业务本身更具体：基于加速器的 BNCT 平台、面向医院的 Alphabeam
              部署、中国已安装硬件、规划中的美国和意大利场址，以及管理层描述为经常性收入的一份全服务合同。TAE Beam UK 也增加了另一条可能的早期变现路径，因为它明确设立来为多种聚变构型制造和服务中性束。TAE
              Power Solutions 同样被包装为商业化载体，但公开材料停留在能力和合作措辞，没有给出定价、已签收入或客户数量。


              合在一起，本章证据支持一个混合结论：TAE 确实有多种技术转收入机制，但当前、持久收入的公开证明集中在子公司层面的信号，而不是投资人最终被要求出资支持的核心聚变发电产品。
