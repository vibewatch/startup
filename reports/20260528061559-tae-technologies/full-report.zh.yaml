      - number: '1.2'
        title: 领导层、治理与关键人物图谱
        blocks:
          - type: paragraph
            body: >
              自联合创始人 Norman Rostoker 2014 年去世后，Michl Binderbauer 一直担任 CEO。Binderbauer 是 TAE
              科学项目和投资者关系的公开代表，也是公司执行中最核心的关键人物风险。TAE 首席科学官 Toshiki Tajima 是一位物理学家，被认为发明了激光尾场加速，带来深厚的等离子体物理可信度。Cedric
              Burgher 于 2026 年 2 月出任首席财务官，在 TMTG 合并流程前夕补上资本市场和上市公司准备经验；加入 TAE 前，Burgher 曾在上市能源公司担任 CFO。


              TAE 的商业领导层显示，公司在电站建设前有意扩编。Liz Toretta 担任首席营收官，Dale McNiel 担任首席增长官；这些角色并不常见于早期研究公司，但与 TAE
              自称进入商业化阶段的说法一致。高级副总裁 Sergei Putvinski 负责核心聚变物理项目。


              公司董事会包括 Dick Kramlich（NEA 联合创始人兼普通合伙人，NEA 在多轮融资中是 TAE 的主要机构投资人）、Dale Klein（美国 Nuclear Regulatory
              Commission 前主席）、Ernest Moniz（Obama 政府时期美国能源部长）和 Michael Schwab（Big Sky Capital）。Klein 和 Moniz
              的加入增强了监管和政策可信度，但不能替代对等离子体性能主张的独立科学同行评审。TAE 未在公开材料中发布完整治理章程或董事会委员会结构。
