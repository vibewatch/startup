      - number: '3.3'
        title: 切换成本、锁定效应与护城河评估
        blocks:
          - type: paragraph
            body: >-
              TAE 最深的竞争护城河包括：（1）自 1998 年以来积累的 28 年自研等离子体物理数据——这是一套 p-B11 高温等离子体独有数据，无法从已发表文献反向工程；（2）覆盖场反向构型控制、等离子体归一化方法和
              Norm 级技术的专利组合；（3）近无中子燃料循环——p-B11 产生 helium-4 灰烬且没有中子，消除了结构材料中子活化、氚增殖要求和 D-T 竞争对手无法避免的一类废弃物；（4）分拆技术商业化——TAE
              Life Sciences（BNCT）和电力管理 IP 创造收入与战略可选性，不必完全依赖聚变时间线。


              一旦长期 PPA 或场址开发启动，买家的切换成本很高：公用事业公司若已为 CFS 或 Helion 设施破土动工，就已经沉没数千万工程和许可成本，无法转移。这会给最先拿到商业 PPA
              的路线带来先发优势。Helion 与 Microsoft 的协议和 Orion 施工许可说明，Helion 正在 TAE 之前快速筑起这道锁定护城河。


              多栖采用在结构上有限：公用事业公司和超大规模云厂商可以与多家未来一代清洁电力供应商签 PPA，但资本和电网并网名额有限。SMR 当前在公用事业采购对话中明显领先，多个 SMR 项目已拿到 NRC
              设计认证或进入高级许可审查。


              对基于 HTS 的竞争者（CFS、Tokamak Energy）而言，供应链准入是关键护城河：它们需要大规模 REBCO 带材，而供应商只有少数几家。TAE 的 p-B11 路线使用传统 FRC
              磁体设计，避免依赖稀缺 REBCO 供应——如果 HTS 带材供应受限，这就是结构性供应链优势。Tokamak Energy 的 TE Magnetics 部门正在积极建设 REBCO 供应链能力；若 HTS
              经济性改善，TAE 这一优势可能被抹平。


              TAE 的 TAE Life Sciences 子公司在医疗放射治疗中提供独立商业分销渠道。TAE Power Solutions（面向 EV 和电网储能的电力管理）也提供近端收入桥梁，以及与汽车 OEM
              的客户关系——这些非聚变收入来源降低了公司对聚变里程碑时点的依赖。
