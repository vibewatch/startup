      - number: '7.4'
        title: 合作伙伴、供应链、人才和客户采用风险
        blocks:
          - type: paragraph
            body: >-
              TAE 的依赖面比并购标题显示的更宽。首座电站选址取决于公用事业、地方政府、并网流程、土地、交通连接和专业劳动力。UKAEA/Culham 伙伴关系提供了可信的束流技术商业化路径，DOE
              相关合作也带来科学验证，但二者同样说明，TAE 仍在借助生态系统建设，而不是靠一套自洽、公用事业级交付栈独立交付。这些合作是真实缓释项；它们不能替代已被证明的电站执行。


              人才集中度同样重要。Michl Binderbauer 仍是科学叙事、投资者沟通和拟议并购后运营结构的核心。TAE
              显然比典型初创公司更有深度，但核聚变、中性束、控制、许可和上市公司整合人才都很专业，也很昂贵。公开材料尚未展示供应商图谱、EPC 策略或人员流失数据，投资者无法判断组织能否在没有瓶颈的情况下吸收首座电站执行压力。


              客户采用风险是公开投资逻辑里最弱的一条腿。被审阅的公开材料强调技术里程碑、选址和融资；没有披露已签署 PPA、具名公用事业客户或经常性核聚变电力收入。TAE
              的相邻业务最终也许能提供有用可选性，但公开来源没有量化这些活动是否足以实质性抵消核聚变烧钱。在客户证据改善之前，投资者承销的主要是一套资本化研发与基础设施故事，而不是经过商业验证的能源平台。
