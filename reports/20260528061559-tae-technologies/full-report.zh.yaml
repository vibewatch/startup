      - number: '7.2'
        title: 监管、安全与许可风险
        blocks:
          - type: paragraph
            body: >-
              监管对 TAE 是相对顺风，但不是许可豁免。最强的正面事实是，NRC 已经选择 Part 30 副产品材料框架，而不是类似裂变的 Part 50 反应堆制度。这应当降低早期核聚变部署负担。但把 Part 30
              视为有利的同一批法律评论也强调，开发商仍需证明自己的安全案例、管理放射性材料、准备环境文件，并展示可信的废物和应急规划假设。截至报告运行日，NRC 刚在一天前结束拟议规则的评论期，尚未发布最终规则。


              这一点重要，因为 TAE 的公开叙事强调 p-B11
              燃料更清洁，但被审阅的公开来源没有披露首座电站的确切燃料决定、放射性库存或项目特定环境报告假设。法律评论仍把氚、活化产物、粉尘和场址特定环境审查视为商业核聚变的门槛问题。如果 TAE 坚持纯 p-B11
              路径，最终可能避开部分最重的氚负担；但投资者还没有足够公开证据知道首座获许可电站实际会是什么样。


              许可风险也会落到运营上。TAE
              自己的场址参观和并购材料称，首座电站取决于电网接入、土地、安全、本地人才、支持型政府和正式批准。这些多方依赖往往比物理项目推进得更慢。换句话说，公司可能在联邦政策方向上判断正确，却仍因地方和项目级执行尚未锁定而错过建设和送电时间表。
