      - number: '4.3'
        title: 近端融资明显改善，但承销仍取决于合并执行和未来资本
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的正面财务进展，是 2025 年 6 月融资与待完成 TMTG 交易的组合。TAE 披露 2025 年 6 月获得超过 $150M 新股权融资，且有选择权继续融资；随后宣布合并，包含最高 $200M
              签署现金，另有 $100M 取决于初始 S-4 提交。法律顾问和公司材料把交易描述为 2026 年中完成，SEC 8-K 确认 S-4 仍需提交。这意味着投资人应把额外 $100M
              视为有条件资金，而不是已经在手。


              因此，融资问题不是 TAE 是否改善了即时流动性——它显然改善了——而是已披露资金包是否足以支撑管理层声称的下一步。公司希望在 2026 年为首座公用事业级电站选址并开工，同时推进 Da Vinci、建设 TAE
              Beam UK，并支持子公司商业化。但没有任何公开材料给出电站级融资、母公司账上现金或现金跑道。即便支持性的公共政策来源，也继续把聚变描述为一个需要大型公私合作和持续规模化工作的行业。


              这里必须纳入反向情景。TechCrunch 报道投资人担心，公司在科学盈亏平衡前进入公开市场，且副业可能分散反应堆交付注意力。这一批评不会否定 TAE
              已搭起的融资桥梁，但意味着当前资金包应被视为里程碑资本，而不是完整电站商业化已经获得资金支持的证明。
