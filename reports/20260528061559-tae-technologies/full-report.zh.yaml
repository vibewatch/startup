  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与商业化风险
        blocks:
          - type: paragraph
            body: >-
              TAE
              最大的剩余风险，仍是从令人印象深刻的实验进展跨到可被融资承销的电站项目。公司继续把氢-硼（p-B11）核聚变作为长期商业燃料循环来营销，其材料也把这条路径描述为比氘-氚更清洁、最终更耐久。如果跑通，这确实是战略差异化。问题在于，p-B11
              也是目前最难的核聚变路径之一。独立技术批评认为，没有任何反应堆接近过 p-B11 条件；TAE 自己 2026 年 1 月的 Q&A 仍把 Norm Upgrade 描述为必须先验证 1
              亿度和“足够热且持续足够久”这两个里程碑，Da Vinci 才能被视为可信的下一步。


              Norm 突破重要，因为只靠 NBI 成形简化了机器，并似乎让 TAE 可以跳过 Copernicus；但它没有消除国家实验室级装置与公用事业电站之间的距离。TechCrunch 2026 年 4
              月报道称，还没有任何核聚变初创公司达到科学盈亏平衡；Yahoo Finance 和竞争对手评论则称 TAE 的 2026 年建设时间表高度激进。GeekWire 引述的竞争对手评论尤其重要，因为它们攻击的不是
              TAE 的雄心，而是“科学问题已经解决”这个具体说法。合起来看，证据支持一个严厉结论：技术风险不再是科学展会式风险，但仍是投资逻辑成败攸关的商业化风险。


              因此，技术故事是不对称的。如果 TAE 继续兑现机器里程碑，公开市场资本可能迅速奖励公司。如果里程碑延后，市场会发现 TAE
              在独立证明科学盈亏平衡或客户级电站就绪之前就已经上市。这就是为什么在这个案例里，技术风险和融资风险会如此直接地相互传导。
