      - number: '8.4'
        title: 乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设并购按大致宣布条款完成，选址和首座电站工作变得具体，TAE 开始更像 Helion / CFS 同业，而不是科学属性很重的私人实验室。在那个世界里，市场继续奖励核聚变和 AI 电力叙事，TAE
              有可能回到 2022 年私募标记上沿，甚至进入低端 Oklo 式公开市场热情区间。但这不是今天的证据；它取决于未来里程碑。


              基准情景保守得多。它假设 TAE 仍是可信竞争者，科学进展真实，但投资者继续锚定 2025 年 6 月轮融资、2026 年 5 月下旬 Yahoo/Forge
              估计，以及商业化证据更强的可比公司并不明显更便宜这一事实。在这个框架下，公允价值落在低到中位 $3 billion 区间，而不是 >$6
              billion。悲观情景很直接：并购延后或失败，公司仍需要更多项目资本，且新融资在电站经济性披露前到来。由于 TAE 已经至少融过 12
              轮，这种结果不只是压低标题估值；还可能通过稀释和旧优先权包袱，把有效价值从普通股或新资金持有人手里推走。因此，宣布价格下的不对称性很差：上行需要几个可见胜利，下行只需要一次融资或执行失误。
