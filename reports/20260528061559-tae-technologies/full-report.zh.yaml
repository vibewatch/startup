      - number: '2.2'
        title: 规模测算视角：数据中心负荷、稳定电力稀缺、聚变资本形成与工业供热压力
        blocks:
          - type: paragraph
            body: >-
              本章采用多个视角，因为对前沿聚变而言，没有任何单一公开 TAM 估算足够可信。最强需求信号来自大负荷电力。Berkeley Lab 和 DOE 估计，2023 年美国数据中心用电为 176 TWh，约占全国用电量
              4.4%；Berkeley Lab 随后预测到 2028 年将达到 325-580 TWh、占比 6.7-12%。EPRI 的 2026 年分析更进一步，估计到 2030 年为 380-790 TWh、占比
              9-17%，且 AI 工作负载已占数据中心用电的 15-25%。Goldman Sachs 和 BCG 补上市场含义：超大规模云厂商如今在寻找 24/7 可靠低碳供应；BCG 认为，如果发电跟不上，到 2030
              年美国可能出现 50-80 GW 容量缺口。这些不是 TAE 的直接收入预测，但有力证明 TAE 想解决的终端市场问题正变得具有经济紧迫性。


              第二个视角不是原始能源需求，而是电网可交付性。Americans for a Clean Energy Grid、Berkeley Lab 的并网队列研究以及 Data Center Dynamics
              都指向输电和并网这个约束瓶颈。美国五年峰值负荷增长预期已大幅上升，并网队列中仍有超过 2
              太瓦活跃容量，排队项目中只有少数真正进入商业运行，区域运营商仍错过可能提升线路容量的升级期限。这支持把市场定义为真正能交付的稳定清洁电力，而不只是脱碳愿望。


              第三个视角是聚变本身是否正成熟为可融资的供应品类。FIA、DOE、ARPA-E 和 IEA 相关报告显示，这个行业已有 50 多家公司、约 $10B
              累计私人资本，并获得越来越多公共支持——但在试点电站普及前仍有巨大融资缺口。第四个视角是工业供热脱碳：可触达问题极大，但采用会很有选择性，因为流程温度、改造复杂度和能源经济性在不同行业差异很大。正确结论不是把这些视角相加，而是用它们交叉定位
              TAE 哪里有可信首个市场，哪里还没有。
