      - number: '5.2'
        title: 装置栈、控制与研究验证
        blocks:
          - type: paragraph
            body: >-
              TAE 的公开技术证据建立在三层相互关联的材料上：同行评审的等离子体物理成果、机器控制软件，以及规模很大的公开研究库。同行评审层重要，是因为它验证了几个具体子问题：只靠 NBI 形成
              FRC、束驱动离子加速，以及持续的快离子工作。控制层也重要，因为 TAE 的机器复杂度太高，无法靠人工高频调参。Google 对双方合作的说明说得很清楚，C-2W / Norman 涉及 1,000
              多个控制参数和 1,000 多项等离子体测量，每八分钟才做一次实验；因此优化、诊断和贝叶斯重建不是辅助工具，而是核心操作技术。TAE
              更像一家纵向整合物理和控制能力的公司，而不是纯硬件制造商。但公开记录也有边界。TAE
              宣称每年两次接受独立科学小组评审，但评审流程本身无法被公众查验。其研究库在私人核聚变公司里算异常庞大，确实提升了外部可见度；不过详细机器性能数据仍主要存在于公司托管论文、合作伙伴协作和会议材料中，而不是监管机构审阅的电站文件里。
