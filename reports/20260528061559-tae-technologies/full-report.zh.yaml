  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：稳定清洁电力优先，工业供热其次，加速器相邻业务在侧翼
        blocks:
          - type: paragraph
            body: >-
              TAE 的公开定位比泛泛的“能源转型”叙事更窄。公司告诉投资人，它在为电网和碳密集型工业流程开发清洁能源，同时单独运营电力电子和癌症治疗子公司。公开披露中最近的商业用例仍是公用事业级发电：TAE 将首座电站描述为
              2030 年代初约 50 MWe 的项目，后续电站预计达到约 350-500
              MWe。这一点重要，因为它把可服务市场锚定在稳定、可调度、公用事业式容量，而不是消费能源产品、小型表后设备或宽泛气候科技支出。因此，直接替代集合是服务稳定低碳负荷的其他方式——先进核能、燃气加碳捕集、地热、可再生能源配储能和需求灵活性——而不是全部电力支出。


              工业供热扩大了市场边界，但扩得有纪律。TAE
              尚未披露具名工业客户、面向特定行业的供热产品或电站级热交付配置。更站得住脚的解读是，工业供热代表第二个可服务用例，面向需要可靠能源且承受流程热脱碳压力的大型工业场址。这样，本章仍聚焦于正常运行时间、能源安全和排放强度重要的电力与热应用。


              相邻加速器业务是真实存在的，但不应被误当成核心可服务市场。UKAEA 合资公司将中性束和粒子加速器技术商业化，用于聚变以及癌症治疗、食品安全、国土安全等非聚变用途。TAE Life Sciences
              另行面向医院销售基于加速器的 BNCT 中子系统。这些相邻业务说明 TAE 的技术平台能创造更早的商业化路径，但它们面对的是不同买家、不同监管渠道和比公用事业级电站小得多的资本预算。
