  - id: TU005
    title: 扩张和集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度 / 采购风险
      - 影响
      - 尽调路径
    rows:
      - - 首座聚变电站成功
        - 首座电站可能占据早期商业收入大头
        - 收入高度集中，投资逻辑依赖一个站点 / 买方
        - 要求提供首座电站资本开支计划、买方结构，以及第二站点的备用管线
      - - 超大规模云厂商电力短缺
        - 买家急需稳定容量，但并网和许可延误可能拖过 TAE 准备时间
        - 即便买方需求真实，也可能延迟转化
        - 结合 TAE 电站时间线，梳理公用事业排队、承接地区政治和过渡电力选项
      - - 医院 BNCT 采用
        - 临床热情未必转化为有报销支持的商业安装量
        - 具名站点停留在研究阶段的时间可能比投资人预期更长
        - 要求提供监管路线图、治疗经济性、报销策略和已签约采购里程碑
      - - 束流技术商业化
        - UKAEA 合资公司可能仍偏内部 / 生态开发，而非广泛外部销售
        - 束流证据可支撑技术可信度，却未必带来多元收入
        - 询问第三方客户管线和束流收入的预计外部占比
      - - 工业热扩张
        - 工业热市场真实存在，但可能晚于首次并网部署，且需要定制电站设计
        - 扩张叙事有战略价值，但财务上仍可能很遥远
        - 要求提供目标行业、温度规格，以及工艺热的任何具名试点交易对手
      - - 业务组合复杂度
        - 投资人可能过度计入相邻业务，仿佛它们已降低核心聚变客户采用风险
        - 可能掩盖旗舰业务缺少公用事业级客户证明的问题
        - 拆分聚变、电力解决方案、生命科学和束流业务的订单、利润率和管线转化指标
    notes: 各行聚焦先落地再扩张逻辑和集中度风险，而非泛化公司风险。核心问题是，相邻证据能否转化为聚变电站可重复的获客引擎，而不是停留在一组互不相连的试点和伙伴关系。
