      - number: '5.4'
        title: 相邻产品线、IP 护城河与信任 / 安全 / 质量控制
        blocks:
          - type: paragraph
            body: >-
              TAE 的相邻业务重要，是因为它展示了加速器平台最先在哪里离开核聚变实验室。TAE Life Sciences 是最强例子：Alphabeam 把加速器技术积累重新打包成院内 BNCT
              系统，公开的合作伙伴和新闻材料已经披露拟建美国中心、中国患者处理量、正常运行时间、质保、服务合同经济性和供应链扩张。TAE Beam UK 把同一逻辑延伸到中性束制造和服务。这些相邻业务不能证明 Da Vinci
              具备可融资性，但能证明核心硬件在首座同类核聚变电站之外有应用场景。IP 方面，公开证据显示，围绕基于负离子的中性束注入器，TAE 至少拥有一个已授权的美国专利族；TAE
              也反复提到规模很大的更广泛专利组合。信任与安全方面，TAE 强调核聚变没有链式反应，长寿命废物也少于裂变；DOE
              的公开核聚变路线图也支持一个更宽泛的判断：核聚变需要不同于裂变的监管框架。不过，电站层面的尽调仍不完整。TAE 尚未发布针对美国电站的具体许可路径、完整质量管理体系、网络安全认证，或 Da Vinci
              的详细电力转换架构。束流和等离子体突破之后，上述缺失控制项是产品技术尽调的主要缺口。
