      - number: '5.3'
        title: 路线图、部署依赖与商业化路径
        blocks:
          - type: paragraph
            body: >-
              Norm 最强的商业含义，是它改变了 TAE 自己的路线图。公司现在认为，只靠 NBI 形成 FRC 已经让原计划的 Copernicus 机器不再必要，可以直接推进 Da
              Vinci。它少掉一个中间科学阶段，但没有压缩其余部署负担。TAE 的公开选址记录显示，首座电站落地现在取决于输电接入、土地、劳动力、运输、激励政策和监管批准。公司目标是在 2030 年代初建成首座约 50
              MWe 电站，之后建设更大的 350-500 MWe 电站，但这些日期仍是公司前瞻性指引。短期看，TAE Beam UK 是最清晰的产品化子系统里程碑：它已正式设立、资金到位，任务是在 18-24
              个月而不是几十年的时间表内开发中性束。中性束是横跨 TAE 自有电站、公司希望服务的其他核聚变
              OEM，以及非核聚变加速器应用的依赖项。因此，路线图在子系统和选址准备层面可信；在净能量或商业运营层面，还没有独立验证。
