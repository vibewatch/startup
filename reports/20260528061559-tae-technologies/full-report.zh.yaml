      - number: '6.3'
        title: 具名证据：相邻试点和临床 / 研究交易方，而非商业核聚变电力客户
        blocks:
          - type: paragraph
            body: >-
              今天 TAE 身边最强的具名证据在核心核聚变电力产品之外。能源系统侧，MARA 与 TAE Power Solutions 宣布为超大规模数据中心、HPC 和其他耗电密集运营建设 10 MW
              清洁能源储能网络，原型计划在 2025 年底推出，更大规模商业化预计在 2026 年初。这是有意义的买方证据，因为一个具名交易方正在依赖 TAE 衍生硬件和控制来解决眼前的电力问题。但它不是 TAE
              已出售核聚变发电或拿到公用事业级电站购电协议的证据。这个区分很关键，因为技术、采购流程、监管路径和风险分摊结构完全不同。


              生命科学和束流技术也适用同一区分。TAE Life Sciences 拥有比核聚变发电业务丰富得多的具名医院和研究交易方：UW-Madison 已签署 MOU，将成为美国首个 Alphabeam
              场址并启动临床试验；公司材料称，Xiamen Humanity Hospital 已在 TLS 中子束系统上开展人体临床试验；意大利 CNAO 是下一个计划中的 Alphabeam 安装点；Ohio State
              的 LOI 聚焦硼药物研发。同样，TAE Beam UK 已获得全额资金并与 UKAEA 正式落地，证明核聚变供应链内的第三方对 TAE
              加速器技术有需求。但这些例子最准确的描述仍是试点、研究、潜在装机或支撑伙伴证据。没有任何一个例子同时展示签署的长期收入、重复采购和运营留存；投资者还不能把 TAE 视为已经在核聚变能源上拥有耐久商业客户群。
