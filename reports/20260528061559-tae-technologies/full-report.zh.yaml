      nodes:
        - label: 买方痛点出现
          detail: 公用事业公司需要稳定的无碳电力，超大规模云厂商需要更快拿到电力，医院需要新的癌症治疗选项，聚变项目需要先进中性束。
          tone: neutral
        - label: 潜在交易对手接触
          detail: 在宣布已签商业客户之前，TAE 需要先接触承载地区、政府、基础设施伙伴、医院和战略买方。
          tone: neutral
        - label: 技术 / 政策尽调
          detail: 电网接入、许可、选址、采购规则、临床验证和融资结构决定兴趣能否变成合同。
          tone: warning
        - label: 试点 / 伙伴证据
          detail: MARA 储能合作、UW BNCT 规划、Xiamen / CNAO 临床证据和 UKAEA 束线商业化带来了具名证据，但还不能证明聚变发电收入。
