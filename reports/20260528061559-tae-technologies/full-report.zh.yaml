      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems（CFS）于 2018 年从 MIT 的 PSFC 分拆，累计融资约 $3B，是私人聚变公司中最高，投资人包括
              Nvidia、Google、Breakthrough Energy Ventures 和一个日本工业联盟。其 SPARC 托卡马克使用 HTS REBCO 磁体，在紧凑设计中实现 12+ T 磁场。CFS 于
              2025 年 8 月披露 $863M Series B2。SPARC 正按计划推进 2027 年净能量展示；ARC 商业电站目标在 2030 年代初首次运行，每台 200–400 MW。CFS 未披露确定电价。


              Helion Energy 已融资超过 $2.2B，背后有 Sam Altman、SoftBank Vision Fund II 等。其第七代原型 Polaris（19m、50+ MJ、15+
              T）旨在展示聚变直接发电。公司获得环境许可后，WA Malaga 的 Orion 设施于 2026 年开工。Helion 在 FRC 几何中使用 D-D 和 D-He3
              燃料，通过直接磁感应回收电力，绕过蒸汽循环。Microsoft PPA 承诺到 2028 年提供 ≥50 MW。如果 Orion 按期交付，Helion 将成为首家商业销售聚变电力的公司。


              General Fusion（Canada）开创了 Magnetized Target Fusion：活塞在液态金属内衬中压缩磁化等离子体。LM26 是全球首台旨在达到 50% 电站尺度条件的 MTF
              装置。2024 年资金危机导致裁员、缩减运营，并出现 CEO 公开求资后，General Fusion 于 2025 年 8 月融资 $22M USD。它在 2026 年 1 月宣布与 Spring Valley
              Acquisition Corp. 进行 SPAC 合并，成为首家公开交易的纯聚变公司。首座电站目标交付时间约为 2035 年。General Fusion 是主要同行中资本最紧的一家。


              Tokamak Energy（UK，2009 年创立）已融资 $335M，运营 ST40 球形托卡马克以及 TE Magnetics；后者向国防、分析科学和工业市场销售 HTS 磁体系统。其 2024 年 11
              月 $125M 融资由 East X Ventures 和 Lingotto 共同领投。Tokamak Energy 有超过 10 年托卡马克运行经验，并为英国政府 STEP 计划提供聚变专业能力。


              Zap Energy（Everett, WA）于 2026 年 5 月获得 DOE 对其预概念 Z 箍缩聚变电站设计的批准——这是 DOE Milestone-Based Fusion Development
              Program 下的一个里程碑。Zap 的路线不需要外部磁体，简化系统并可能降低资本成本，但尚未达到点火级条件。DOE 批准的设计瞄准每个模块 50 MW 净电输出。
