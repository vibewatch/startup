  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >-
              TAE 处在一个尴尬交叉点：前沿科学进展真实，但价格支撑偏薄。正面背景很容易看见：Google、Chevron 和 NEA 支持了 2025 年 6 月轮融资；公司随后宣布一项价值超过 $6 billion
              的公开市场并购；并购推介明确绑定更清洁的无中子核聚变架构，以及公用事业级、与数据中心相关电力的承诺。这个组合解释了 TAE
              为什么能获得关注。但它本身不能证明当前宣布价格合理。最强的可观察私募市场锚点低得多。Yahoo Finance / Forge 显示，2022 年 7 月第 11 轮融资 $250 million、投后
              $5.49 billion；2025 年 6 月第 12 轮融资 $150 million、投后 $2.9 billion；到 2026 年 5 月下旬，估计估值只有约 $2.47 billion。Nasdaq
              Private Market 另行估算，2026 年 5 月中旬每股价值为 $40.83，而并购隐含为每股 $53.89。


              这个差距重要，因为 >$6 billion 的并购标题并不是由已披露收入、利润率或电站经济性证据来承销。它更像技术乐观、公开市场可选性，以及 Trump Media 资产负债表融资杠杆的组合。正确解读不是 TAE
              质量低，而是当前价格支撑更多由叙事驱动，而非基本面驱动。TAE
              值得跟踪，正因为科学项目仍在推进，融资路径可能拓宽。但对按宣布价格进入的新投资者来说，举证责任已经转移：公司现在必须证明并购溢价反映真实电站就绪度，而不只是流动性捷径。
            claimRefs:
              - CV001
