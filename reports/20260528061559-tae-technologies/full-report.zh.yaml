companyProfile:
  summary: >-
    TAE Technologies 是一家私人聚变能源公司，1998 年由 Norman Rostoker 和 Michl Binderbauer 在加州 Foothill Ranch 以 Tri Alpha Energy
    之名创立。公司押注束驱动场反向构型聚变，远期燃料循环为氢-硼，同时通过 TAE Beam UK、TAE Life Sciences 和 TAE Power Solutions
    商业化相关加速器技术。公开材料显示，公司确有科学进展，也有强战略投资人背书，但核心聚变业务仍未商业化，目前靠里程碑融资、子公司和一项待完成的 Trump Media 合并来供血。
