      - number: '6.2'
        title: 采用轨迹：真实买方需求存在，但 TAE 核聚变仍处在潜在客户阶段
        blocks:
          - type: paragraph
            body: >-
              公开证据仍把 TAE 的核聚变发电业务放在客户转化之前。公司已经点名 3 个美国州做选址评估，并披露首座电站在 2030 年代初约 50 MWe 的目标，但还没有宣布最终站址、公用事业 PPA、电站业主
              MOU，或生产性电力客户。缺口重要，因为目前超大规模云厂商和清洁电力需求的最佳外部证据来自竞争对手：Helion 拿到 Microsoft 这个首个公开的核聚变电力买方，Commonwealth Fusion
              Systems 与 Google 签下与 ARC 绑定的 200 MW 购电安排。这些交易确认，大型科技买家在看到稳定零碳电力的战略价值时，愿意签署以里程碑为前提、期限很长的核聚变合同；但它们也凸显了品类需求与
              TAE 自身转化之间的差距。


              这个差距不是终端市场拉力弱造成的。独立电力研究显示，数据中心需求正在激增，拿电速度已经成为决定性约束。S&P 预计美国数据中心电网需求将从 2025 年的 61.8 GW 升至 2026 年的 75.8
              GW，并在 2030 年达到 134.4 GW；Bloom、JLL 和 Wood Mackenzie
              都提到并网延迟、公用事业与客户预期错位，以及由此转向表后电力和储能。这样的环境支持一个判断：超大规模云厂商、公用事业和工业用户都在寻找可靠容量；但它也抬高了 TAE
              的采购门槛。买方越来越要求先看到可信的选址、电网、许可、合同和过桥电力方案，才会承销首座同类核聚变资产。换句话说，市场背景有吸引力，但客户旅程仍停在发现和尽调阶段，还没有进入生产采用。
