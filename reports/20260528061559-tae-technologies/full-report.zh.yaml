chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、技术路线与装置历史
        blocks:
          - type: paragraph
            body: >
              TAE Technologies（法定名称 TAE Technologies Inc.）于 1998 年以 Tri Alpha Energy 之名注册成立，其科学基础来自 University of
              California, Irvine 的研究；联合创始人 Norman Rostoker 是 UCI 物理与天文学系理论物理学家和教授，Michl Binderbauer 则是 UCI 工程师兼博士生。公司约在
              2015 年更名为 TAE Technologies，以反映其中性束注入技术外延扩大。TAE 总部位于加州 Orange County 的 Foothill Ranch，截至 2025 年 12 月员工超过
              400 人，其中包括 62 名博士。公司已在全球提交超过 1,600 项专利。


              TAE 的核心技术赌注是利用束驱动场反向构型实现近无中子的氢-硼（p-B11）聚变。场反向构型是一类紧凑环形等离子体，等离子体自身电流会在装置内部反转外部磁场。TAE
              加入高能中性束，既加热等离子体，又提供非感应电流驱动，从而稳定 FRC。氢-硼燃料循环不同于 ITER 和多数聚变项目采用的氘-氚（D-T）路线：p-B11
              聚变几乎不释放中子，消除了反应堆结构中的中子活化问题，并产生可直接收集的带电粒子能量。代价也很高：p-B11 需要数十亿摄氏度量级的等离子体温度，比 D-T
              聚变高几个数量级，通常被视为商业聚变中技术难度最高的路径之一。


              创立以来，TAE 已建成五代实验装置。第一代 C-2 证明了束驱动 FRC 概念；C-2T 和 C-2U 是迭代改进；第四台 C-2W 于 2017 年投运，并以 2014 年去世的联合创始人 Norman
              Rostoker 命名为 Norman，展示了该路线创纪录温度下的持续 FRC 等离子体。第五台也是当前装置 Norm 在 2025 年 11
              月取得突破，证明只靠中性束注入即可形成等离子体：装置不再依赖磁化等离子体枪，仅用 NBI 形成并维持 FRC，这为未来电站提供了更简单、更便宜的架构。该成果发表于 Nature Communications，使
              TAE 能跳过原计划的第六台装置 Copernicus，直接推进商业原型尺度装置 Da Vinci 的工程化。
