  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场
      - 纳入支出 / 用例
      - 剔除或替代性支出
      - 买方-用户-付款方
      - TAE 价值
    rows:
      - - 公用事业级稳定清洁电力
        - 面向电网交付的可调度低碳发电容量
        - 零售售电、消费设备、不以稳定交付为目标的通用可再生装机
        - 买方：公用事业公司 / IPP / 负荷开发商；用户：电网或大型负荷；付款方：签约承购方 / 费率基础 / 项目融资
        - 核心服务市场和估值锚
      - - 数据中心锚定的稳定电力
        - 绑定超大规模或托管园区的电力采购，需求是可靠 24/7 供电
        - 大宗云支出、通用 IT 资本开支、仅作柴油备电的系统
        - 买方：开发商 / 公用事业公司 / 发电合作方；用户：数据中心运营商；付款方：超大规模云厂商采购和能源预算
        - 需求催化剂，也可能是早期锚定承购路径
      - - 工业热脱碳
        - 为高碳工业场址供能，可靠清洁能源可替代化石热投入
        - 通用工业设备支出，或与电力 / 热力无依赖的低价值能效项目
        - 买方：工厂业主 / 能源经理；用户：工艺运营；付款方：资本开支预算、激励资金或服务合同
        - 技术适配和经济性跑通后，成为第二服务市场
      - - 基于加速器的医疗系统
        - 医院和肿瘤科对 BNCT 等基于加速器的中子系统需求
        - 公用事业级发电，或与加速器系统无关的泛医疗科技品类
        - 买方：医院 / 癌症中心；用户：临床医生和研究人员；付款方：医疗系统资本开支和有报销支撑的项目
        - 借用加速器技术积累的相邻市场，不是核心电力 TAM
      - - 其他加速器 / 工业应用
        - 食品安全、国土安全，以及粒子加速器和中性束技术的科研用途
        - 通用工业自动化或无关安全软件
        - 买方：政府实验室 / 机构 / 工业运营商；用户：技术团队；付款方：公共采购或工业资本开支
        - 可选相邻市场，可在电网级聚变前把技术变现
    notes: 边界表把核心稳定电力、工业热市场，与共享技术但预算和买方不同的加速器相邻市场区分开。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM040
      - CM041
