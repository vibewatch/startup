      - number: '7.5'
        title: 打破投资逻辑的触发点与尽调问题
        blocks:
          - type: paragraph
            body: >-
              理解 TAE 最清晰的方式，不是抽象讨论核聚变是否可能，而是看这家公司能否在市场或监管流程迫使重估之前，清掉一串公开证据点。三个最硬触发点很容易观察。第一，科学和工程：如果 TAE 无法把 Norm 和 Norm
              Upgrade 转化为外部可读、接近盈亏平衡的性能，以及电站级工程包，时间表就应重置。第二，融资：如果 S-4
              卡住，或并购完成后仍没有透明的资本配置细节，标题式资产负债表论点就应大幅打折。第三，客户证据：如果选址推进但仍看不到购电或公用事业交易方，商业化仍是理论。


              这些不是抽象下行情景；它们正是 TAE 最强缓释因素可能失灵的关口。Part 30
              监管有帮助，但前提是项目特定安全和环境工作跟得上。战略投资者有帮助，但前提是公开上市叙事降温后，他们仍继续过桥出资。相邻业务有帮助，但前提是它们足够快地产生现金且不稀释管理层注意力。今天的证据说明，TAE
              有足够真实进展留在讨论桌上，但披露证据还不足以把当前计划承销为已降险。


              实际尽调含义很直接：把 TAE 当作一个依赖里程碑、对公开市场敏感的前沿能源投资。承销任何“融资或监管已经解决”的说法之前，必须拿到 S-4 条款、董事会独立性、选址关键路径、燃料循环假设和客户管线的文件证据。
