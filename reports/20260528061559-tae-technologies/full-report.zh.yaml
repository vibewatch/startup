  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              聚变能源竞争格局横跨五类：（1）追求等离子体约束或压缩路线、用于发电的直接私营聚变同行；（2）ITER 和 DOE Milestone-Based Fusion Development Program
              参与者等政府聚变项目；（3）瞄准相同公用事业和超大规模云厂商买家的先进裂变替代方案，主要是小型模块化反应堆（SMR）；（4）部分替代稳定电力的可再生能源加储能方案；（5）TAE 自身的 BNCT 子公司 TAE
              Life Sciences，它竞争的是独立医疗市场，但会吸收高管精力和资本配置注意力。


              在直接同行中，Commonwealth Fusion Systems（CFS）和 Helion Energy 融资最多，里程碑最显眼。CFS 的 SPARC 托卡马克正在 MA 的 Devens 建设，目标
              2027 年展示 Q>1；其 ARC 电站设计瞄准 2030 年代初商业运行。Helion 已与 Microsoft 签署全球首份聚变 PPA，在 WA 的 Malaga 开工建设 Orion 设施，并于
              2026 年获得施工许可。两家公司都使用 D-T 或 D-He3 燃料，会产生中子并需要氚——这是 TAE 的 p-B11 路线避免的供应链和监管复杂性。General Fusion（Canada）运营
              LM26，这是全球首台 Magnetized Target Fusion（MTF）示范装置，目标在 2028 年中达到 Lawson 里程碑，并于 2026 年初宣布通过 SPAC 上市计划。Tokamak
              Energy（UK，已融资 $335M）商业化其球形托卡马克以及 HTS 磁体子公司 TE Magnetics。Zap Energy 使用剪切流稳定 Z 箍缩，无需磁体，并在 2026 年 5 月获得 DOE 对
              50 MW 试点电站的预概念设计批准。


              NEA SMR Dashboard 追踪的 SMR 替代方案包括 NuScale、Kairos Power、X-energy
              以及数十家公司。许多方案瞄准与聚变相同的公用事业和数据中心买家群体，并可能在聚变商业化前锁定 10 年期 PPA。BCG 2026 年分析估计，到 2030 年美国可能出现 50–80 GW
              容量缺口，这种紧迫性会让任何较近端的稳定清洁电力技术，相比 7 年以上时间线的聚变路线更占优。
