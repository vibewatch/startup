  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 论点
      - 支撑证据
      - 什么会改变判断
    rows:
      - - TAE 的技术进展足够真实，值得作为可投标的留在观察名单
        - Google 在 2025 年继续支持 TAE，管理层把新增资本与商业化提速挂钩
        - 独立披露电站经济性，才能把技术可信度转成估值支撑
      - - 获得公开市场通道可能比多一轮私募更重要
        - 合并结构最多带来 $300M 现金支持和公开资本路径
        - 如果合并延迟或重定价，这一优势会快速坍塌
      - - TAE 仍缺少 Helion/CFS 级别的商业化证明
        - Helion 有 Microsoft 具名购电，CFS 有资金支持的具体 SPARC/ARC 里程碑
        - TAE 需要可比的购电、项目融资或建设证据
      - - 近期私募估值标记不支持 >$6B 公告估值
        - Yahoo/Forge 显示，2025 年 6 月投后估值为 $2.9B，2026 年 5 月下旬估计约为 $2.47B
        - 若要公开市场按更接近同业的水平重估，runDate 后需要阶跃式证据
      - - 反向合并结构是风险，不是背书徽章
        - 支持者和怀疑者都把这笔交易描述为通往流动性的捷径，而不是传统 IPO 流程
        - 扎实的 S-4/代理文件包和干净的治理条款会缩小这一担忧
      - - 公开可比公司拉宽了区间，但救不了当前定价
        - Oklo 说明情绪可以很热，NuScale 则说明里程碑滑坡时，类似叙事也会大幅降评级
        - TAE 必须证明自己配得上区间上沿，而不是只吃行业情绪红利
    notes: 本表混合硬事实和估值解读。每行都说明，需要发生什么，才能把今天偏负面的价格判断推向更建设性的立场。
