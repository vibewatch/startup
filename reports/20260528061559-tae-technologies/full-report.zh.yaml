      - number: '8.2'
        title: 投资逻辑、反向逻辑与建议逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑有内容。TAE 穿过了多个资本周期，让 Google 持续参与超过十年，并在融资市场更冷的 2025 年 6 月又融到 $150 million。公司可以合理主张，2025 年末融资条件好于 2025
              年中，因为并购跟在更强的技术叙事之后，并提供了接入更深公开资本的通道。对一家真正瓶颈不再只是物理、还包括工程级部署成本和节奏的核聚变公司，这很重要。换句话说，可以构建一个严肃的长期投资逻辑：当首座电站机会成形时，TAE
              会成为少数仍站着的核聚变公司之一。


              按今天价格，反向逻辑更强。Helion 公开对应 $5.4 billion 估值、具名 Microsoft 购电协议和 2028 年商业化目标；CFS 已融资近 $3 billion，并专门为 SPARC 和
              ARC 里程碑拿到资金。TAE 的公开记录在改善，但仍缺少同等水平的电站就绪证据披露。因此，市场被要求把 TAE 定价在更有文档支撑的同业之上或附近，同时还要吸收反向并购治理复杂性、不确定的公开市场时点，以及至少
              12 轮融资积累出的私募股权结构。这就是为什么建议逻辑对价格敏感：只有当价格或披露足够移动、弥合缺口时才持有。以宣布的 >$6 billion 估值看，正确姿态是新资金回避，同时把 TAE
              放在观察名单上，等待之后更有证据支撑的入场点。
