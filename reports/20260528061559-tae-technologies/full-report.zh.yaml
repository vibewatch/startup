  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: TAE 从市场需求走向耐久收入，起点是买方痛点，随后经过支撑性交易对手和试点证据，最后才可能触达可重复的聚变电站客户。
