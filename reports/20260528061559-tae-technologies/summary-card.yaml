  topStrengths:
    - >-
      Beam-driven FRC and the NBI-only Norm breakthrough give TAE one of the strongest public science narratives among
      private fusion companies.
    - >-
      Strategic backers including Google, Chevron, and NEA improve financing credibility and validation of the
      technology roadmap.
    - >-
      Adjacent businesses in neutral beams, BNCT, and power electronics create more paths to commercialization than a
      pure single-reactor company.
    - >-
      Market demand for firm clean power from utilities, data centers, and industrial decarbonization is growing
      quickly.
  topRisks:
    - >-
      TAE still has to translate laboratory breakthroughs into a bankable first plant on an especially difficult p-B11
      fusion path.
    - >-
      The pending Trump Media merger adds governance, volatility, and financing-quality risk before core fusion
      breakeven is proven.
    - No public utility PPA, plant host, or durable fusion-electricity customer proof has been disclosed.
    - Plant capex, segment financials, runway, and the preference stack remain materially under-disclosed.
    - >-
      Regulatory progress helps, but final NRC rules, siting, interconnection, and environmental approvals are still
      unresolved.
  unresolvedGaps:
    - Full S-4 or equivalent merger disclosure package covering governance, use of funds, and capital-structure details.
    - Da Vinci and first-plant capex, schedule, power economics, and fuel-cycle assumptions.
    - Signed offtake, utility, hyperscaler, or industrial customer documentation for the first fusion plant.
    - Segment-level financials for core fusion, TAE Beam UK, TAE Life Sciences, and TAE Power Solutions.
    - Cap-table preference waterfall and dilution sensitivity under downside financing scenarios.
