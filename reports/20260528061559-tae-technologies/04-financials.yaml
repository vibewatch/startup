  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash on hand, monthly burn, and board-approved runway plan at the parent-company level.
    whyItMatters: Without cash and burn data, investors cannot test whether the June 2025 round plus merger cash bridge the company to a meaningful technical or commercial milestone.
    diligencePath: Request the latest management accounts, cash waterfall, budget-versus-actual burn, and downside runway scenarios through merger close and through Da Vinci engineering milestones.
    relatedQuestionRefs:
    - QI007
    - QI008
    relatedTableRefs:
    - TI003
    - TI004
  - type: missing-source
    severity: material
    topic: plant-capex
    missingEvidence: Plant-level capex, capex-per-MW, expected construction schedule, offtake structure, and project-finance assumptions for the first 50 MWe reactor.
    whyItMatters: The first commercial plant is the core revenue engine, but public materials do not reveal the capital stack or economics needed to test return on invested capital.
    diligencePath: Request Da Vinci and first-plant capex models, EPC assumptions, site-control documents, interconnection studies, and any customer LOIs or term sheets.
    relatedQuestionRefs:
    - QI013
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Segment revenue, gross margin, opex, and intercompany-transfer data for fusion, TAE Beam UK, TAE Life Sciences, and TAE Power Solutions.
    whyItMatters: Adjacencies may matter for liquidity and narrative support, but without segment data there is no way to measure whether they are meaningful cash contributors or simply incremental spend centers.
    diligencePath: Request segment P&Ls, transfer-pricing policy, and board materials showing capital allocation and expected margin profiles by business line.
    relatedQuestionRefs:
    - QI014
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: adjacency-pricing
    missingEvidence: Actual contract values, installed-base counts, realized pricing, and backlog for neutral beams, BNCT systems, and TAE Power Solutions products.
    whyItMatters: Public evidence shows mechanisms and some traction, but not the booking size or customer economics needed to convert adjacency stories into underwriting inputs.
    diligencePath: Request signed customer contracts, quote books, pipeline reports, and service-gross-margin analyses for each adjacency business.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: merger-timing
    missingEvidence: A current merger workplan showing S-4 filing timing, key conditions precedent, and fallback financing if the public-market transaction slips or breaks.
    whyItMatters: The additional $100 million is contingent on the S-4 filing and the broader public-market bridge is central to the current liquidity story.
    diligencePath: Request merger process tracker, counsel updates, contingency financing plans, and covenant details around the signing cash already received.
    relatedQuestionRefs:
    - QI010
    - QI025
    relatedTableRefs:
    - TI004
