  rows:
  - - Fusion power plant
    - 50 MWe first-plant size and 350-500 MWe later-plant ambition
    - Capacity ambition and timing language
    - No $/MWh, no PPA price, no project EPC price, no customer-prepayment terms
    - Plant economics cannot be modeled from public disclosures alone
  - - Neutral beams
    - Manufacture and service for multiple fusion approaches
    - Product category, target customers, and supply-chain role
    - No ASP, service fee, backlog, or third-party customer count
    - Useful strategic optionality, but revenue quality is still unproven publicly
  - - BNCT Alphabeam system
    - Hospital installation, single- or multi-room deployment, one or two treatment sessions
    - Hospital footprint, treatment format, and throughput
    - No system selling price, treatment reimbursement, or gross margin
    - Clinical practicality is visible, but monetization still needs contract economics
  - - BNCT service / support
    - July service contract with Neuboron described as recurring revenue
    - Existence of a recurring service stream
    - No contract value, renewal terms, or service gross margin
    - Most concrete recurring-revenue signal, but not enough for valuation inputs
  - - TAE Power Solutions
    - Commercialization for EVs, storage, and grid use cases
    - Product intent and target sectors
    - No public pricing, no channel economics, no named deal sizes
    - Treat as pipeline narrative rather than revenue proof
