- id: capital-intensity-and-unit-economics-proxies
  title: Capital intensity is visible; usable unit economics are not
  body: 'TAE’s public disclosures do give a strong directional signal on cost structure even though they stop short of publishable unit economics. The company says it invested roughly $100 million in accelerator technology, built a $150 million national-laboratory-scale Norman device, and created proprietary power-management systems because the local grid provides 2 MW while Norm operates at 750 MW. Those facts do not reveal burn, plant capex per MW, or margin, but they do show that TAE is operating in an engineering-heavy regime where power electronics, accelerators, research hardware, and site infrastructure matter more than software-style gross margins.


    Government and industry materials reinforce that message. DOE’s roadmap still targets commercialization by the mid-2030s, while ARPA-E’s 2026 funding package focuses on plasma heating, driver systems, power conversion, advanced plant architectures, and durability — exactly the categories that tend to dominate first-of-a-kind plant economics. In other words, the public sector is still funding the hard parts because those hard parts are not yet solved cheaply enough for private capital alone.


    That leaves the chapter with a sharp asymmetry: TAE can describe why its approach should become smaller, cheaper, and more maintainable over time, but it does not publish the financial bridge from today’s R&D platform to future plant-level gross profit. There is no public capex model, no disclosed cost-per-MW target, no working-capital profile, and no segment-level margin disclosure across the subsidiaries. Underwriting must therefore rely on cost-intensity proxies and evidence gaps rather than on a bottom-up model validated by reported company data.'
