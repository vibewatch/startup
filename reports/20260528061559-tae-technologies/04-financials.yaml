- id: TI005
  title: Public financial gaps table
  columns:
  - missing metric
  - current proxy
  - impact on underwriting
  - exact diligence path
  rows:
  - - Recognized revenue by segment
    - PitchBook blank current revenue field; TLS service contract is the only explicit recurring-revenue signal
    - Cannot separate real sales from commercialization narrative
    - Request monthly segment revenue bridge and customer concentration report
  - - Gross margin by segment
    - Only qualitative claims about cost-effectiveness and maintainability
    - No way to tell whether adjacencies are cash generators or cash users
    - Request gross-margin build by product, site, and service line
  - - Parent-company cash and runway
    - Round size and merger cash are public; cash balance and burn are not
    - Cannot test whether funding reaches scientific or commercial milestones
    - Request treasury position, monthly burn, and downside runway sensitivities
  - - First-plant capex and financing stack
    - 50 MWe first-plant ambition is public; capex model is not
    - Core valuation cannot be grounded in project economics
    - Request capex budget, financing plan, EPC assumptions, and interconnection timeline
  - - Backlog / offtake / customer commitments
    - Site-evaluation and commercialization language only
    - Sales-cycle and revenue-recognition timing remain speculative
    - Request signed LOIs, offtake discussions, and development-stage pipeline by customer
  - - Adjacency installed-base economics
    - Hospital and JV progress are visible, but contract values are not
    - Adjacencies cannot yet be translated into contribution margin or liquidity support
    - Request installed base, contract values, and renewal cohorts for TLS and TAE Beam UK
  notes: Each row names a specific missing private metric and the exact diligence artifact needed to close it. The gaps are material because they block a full underwriting model, not because the businesses lack strategic merit.
