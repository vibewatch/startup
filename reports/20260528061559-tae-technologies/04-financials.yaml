- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - public value/status
  - evidence
  - underwriting implication
  - diligence ask
  rows:
  - - June 2025 round
    - '>$150M, with option to raise more'
    - Company release, TechCrunch, and MarketScreener
    - Improves near-term liquidity but does not itself underwrite a first plant
    - Request final close amount, use-of-proceeds, and remaining round capacity
  - - Lifetime capital raised
    - 'Official: >$1.3B equity; PitchBook proxy: $1.79B over time'
    - Official TAE materials and archived PitchBook
    - Capital base is large, but basis differs across sources and does not answer current cash availability
    - Reconcile equity, grants, debt, and other financing into one audited capitalization schedule
  - - Merger signing cash
    - Up to $200M cash to TAE at signing
    - Merger release, SEC 8-K, CNBC, Variety
    - Important bridge capital, but not proof of full project financing
    - Request cash receipt confirmation, restrictions, and covenant package
  - - Merger contingent tranche
    - $100M available upon initial S-4 filing
    - Merger release and SEC 8-K
    - Treat as conditional rather than in hand until the filing occurs
    - Request S-4 workplan, target filing date, and fallback financing plan
  - - Counterparty balance-sheet capacity
    - TMTG reported $3.1B of financial assets at Q3 2025
    - Variety summarizing TMTG disclosures
    - Suggests financing capacity exists at the counterparty, but not that it is committed to plant capex
    - Request post-close capital-allocation framework and guardrails
  - - TAE Beam UK funding
    - UKAEA £5.6M equity plus TAE nine-figure backstop; May 2026 update says fully funded
    - TAE, UKAEA, and World Nuclear News
    - Adjacency funding is real, but ring-fenced JV support is not the same as parent-level runway
    - Request JV budget, parent cash commitments, and third-party customer assumptions
  - - Public-sector support environment
    - $135M new ARPA-E fusion commitment and DOE commercialization roadmap
    - ARPA-E and DOE materials
    - Helpful for ecosystem de-risking, but not a substitute for TAE-specific project financing
    - Request grant pipeline, eligibility, and probability-weighted public-support plan
  notes: This table focuses on forward adequacy rather than reproducing the full funding chronology from Company Overview. Public financing inputs are real, but plant-finance needs remain materially under-disclosed.
