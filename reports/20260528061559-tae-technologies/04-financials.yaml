tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current value/status
  - revenue quality
  - diligence ask
  rows:
  - - Fusion power plant electricity / industrial heat
    - Future sale of power or heat from a first 50 MWe plant and later larger plants
    - MWh sold / project
    - No disclosed offtake, no disclosed power revenue, siting and construction targeted to start in 2026, electrons to grid guided for early 2030s
    - Low current quality; economically important but still milestone-based and pre-commercial
    - Request customer pipeline, site-control package, offtake discussions, COD assumptions, and revenue-recognition policy
  - - Neutral beam systems via TAE Beam UK
    - Manufacture and service neutral beams for TAE and other fusion approaches
    - Beamline / service contract
    - JV formally established and fully funded; UKAEA equity plus TAE backstop disclosed; no external contract values disclosed
    - Medium strategic quality; earlier than plant revenue but still lacks disclosed bookings or ASPs
    - Request pipeline by customer, beam ASPs, service margins, and intercompany sales terms
  - - TAE Life Sciences BNCT platform
    - System deployments, neutron-source hardware, boron-drug platform, and service contracts
    - Installed system / service contract / treatment course
    - Hospital-oriented Alphabeam platform, Xiamen deployment, U.S. center planned, and a disclosed July service contract described as recurring revenue
    - Best public monetization evidence in the group, but subsidiary scale and margin remain undisclosed
    - Request subsidiary revenue by site, contract values, consumables economics, and device-versus-service mix
  - - TAE Power Solutions
    - Commercialization of power-delivery systems for EV, storage, and grid applications
    - Module / system / license
    - Public materials describe commercialization and partnerships but no named customer contracts, pricing, or revenue
    - Speculative until contracts or backlog are disclosed
    - Request customer list, booked orders, realized pricing, and contribution margin
  - - IP / platform transfer
    - Use of accelerator and power-management know-how in non-fusion markets
    - License / engineering package
    - Platform-transfer narrative is clear, but no discrete licensing revenue is publicly disclosed
    - Low current visibility; could add option value but not underwriteable today
    - Request license agreements, royalty terms, and segment-level cash contribution
  notes: Public materials describe mechanisms more clearly than booked revenue. Strings such as “no disclosed” mean the reviewed sources did not publish a usable value; they do not imply the business has zero revenue.
