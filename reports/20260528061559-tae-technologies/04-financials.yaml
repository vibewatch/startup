company:
  name: TAE Technologies
chapter:
  number: 4
  title: Financials
  summary: 'TAE Technologies’ core fusion business remains largely pre-commercial in public disclosures: the company has not published revenue, ARR, gross margin, cash, or burn, and the first plant is still framed as a 2026 siting-and-construction effort with grid electricity targeted for the early 2030s. The clearest public monetization evidence sits in adjacencies such as TAE Life Sciences’ BNCT service contract and the fully funded TAE Beam UK neutral-beam venture, while near-term financing now depends heavily on the June 2025 round and the pending TMTG merger cash bridge.'
sections:
- id: core-revenue-and-disclosure-limits
  title: Core fusion revenue remains pre-commercial while the few monetization proofs sit in adjacencies
  body: 'The public record still reads like a commercialization roadmap, not an operating revenue story. TAE’s own merger and FAQ materials focus on siting a first 50 MWe plant in 2026, progressing to Da Vinci, and targeting electrons to the grid in the early 2030s. Those are important milestones, but they are not the same as disclosed power-sales revenue, customer prepayments, or project backlog. Even PitchBook’s archived profile, which labels the latest deal as “Generating Revenue,” leaves the current revenue field blank. Across the official funding page, investor page, FAQ, and merger materials reviewed here, there is no public revenue number, ARR figure, or gross-margin disclosure for the core fusion business.


    The best public evidence of actual monetization today comes from adjacencies. TAE Life Sciences has a more concrete economic narrative than the fusion business itself: an accelerator-based BNCT platform, hospital-oriented Alphabeam deployments, installed hardware in China, planned U.S. and Italian sites, and a disclosed full-service contract that management described as recurring revenue. TAE Beam UK adds another possible early monetization path because it is explicitly set up to manufacture and service neutral beams for a wide range of fusion approaches. TAE Power Solutions is also presented as a commercialization vehicle, but public materials stop at capability and partnership language rather than giving pricing, booked revenue, or customer counts.


    Taken together, the chapter’s evidence supports a mixed conclusion: TAE clearly has multiple mechanisms by which technology could convert into revenue, but public proof of current, durable revenue is concentrated in subsidiary-level signals rather than the core fusion-power product investors are ultimately being asked to finance.'
