- id: adverse-evidence
  title: Adverse Competitor Evidence and Displacement Risks
  body: 'The most significant adverse evidence for TAE''s competitive position is the pace of milestone achievement by D-T-based
    peers. CFS targets SPARC net-energy demonstration in 2027 and ARC commercial operations by approximately 2030–2033. Helion
    broke ground in 2026 with a Microsoft PPA targeting 2028 initial operations. If either of these milestones is met on schedule,
    they will secure long-term utility and hyperscaler PPAs 5–10 years before TAE''s p-B11 approach can be commercial — creating
    lock-in that is structurally difficult for TAE to displace.


    D-T fusion requires tritium, which is produced as a byproduct of CANDU reactors. Helion plans to breed its own tritium
    internally from its D-He3 approach, potentially eliminating the tritium bottleneck that TAE claims as a structural advantage
    for p-B11. If Helion''s in-house tritium breeding proves effective at scale, TAE''s fuel-cycle moat is partially diminished.


    General Fusion''s near-death experience in 2024 — staff cuts, scale-back of operations, a public CEO plea for investment
    — demonstrates that even well-established fusion companies face existential funding risk on long development timelines.
    TAE''s own last-disclosed funding rounds were in 2022 (reported $250M+), raising questions about its runway to the Norman
    milestone.


    SMR substitutes present a parallel displacement risk: NuScale, Kairos Power, X-energy, and Rolls-Royce SMR are all closer
    to commercial operation than any fusion approach. The NEA SMR Dashboard tracks substantial SMR licensing and siting progress
    in 2025–26. If 20–30 GW of SMR capacity is committed to hyperscalers and utilities before fusion reaches commercial viability,
    the available market for first-generation fusion plants could be substantially reduced.'
