- id: competitor-profiles
  title: Competitor Profiles
  body: 'Commonwealth Fusion Systems (CFS) was spun out of MIT''s PSFC in 2018 and has raised approximately $3B total — the
    most of any private fusion company — with investors including Nvidia, Google, Breakthrough Energy Ventures, and a Japanese
    industrial consortium. Its SPARC tokamak uses HTS REBCO magnets to achieve 12+ T fields in a compact design. CFS disclosed
    an $863M Series B2 round in August 2025. SPARC is on track for a 2027 net-energy demonstration; ARC commercial plant targets
    first operations in the early 2030s at 200–400 MW per unit. CFS has disclosed no firm power pricing.


    Helion Energy has raised over $2.2B, backed by Sam Altman, SoftBank Vision Fund II, and others. Its seventh prototype,
    Polaris (19m, 50+ MJ, 15+ T), is designed to demonstrate direct electricity production from fusion. The Orion facility
    in Malaga, WA broke ground in 2026 after the company received environmental permits. Helion uses D-D and D-He3 fuel in
    an FRC geometry that recovers electricity via direct magnetic induction, skipping a steam cycle. The Microsoft PPA commits
    to ≥50 MW by 2028. If Orion delivers on schedule, Helion will be first to sell fusion electricity commercially.


    General Fusion (Canada) pioneered Magnetized Target Fusion: pistons compress a magnetized plasma in a liquid-metal liner.
    LM26 is the world''s first MTF device designed to hit 50% power-plant-scale conditions. After a 2024 funding crunch requiring
    staff cuts and a public CEO plea, General Fusion raised $22M USD in August 2025. It announced a SPAC merger with Spring
    Valley Acquisition Corp. in January 2026 to become the first publicly traded pure-play fusion firm. Target first-plant
    delivery is approximately 2035. General Fusion is the most capital-constrained of the main peers.


    Tokamak Energy (UK, founded 2009) has raised $335M and operates the ST40 spherical tokamak plus TE Magnetics, which sells
    HTS magnet systems to defense, analytical science, and industrial markets. Its $125M November 2024 round was co-led by
    East X Ventures and Lingotto. Tokamak Energy has more than 10 years of tokamak operating experience and provides fusion
    expertise to the UK government''s STEP programme.


    Zap Energy (Everett, WA) received DOE approval of its preconceptual Z-pinch fusion power plant design in May 2026 — a
    milestone under DOE''s Milestone-Based Fusion Development Program. Zap''s approach requires no external magnets, simplifying
    the system and potentially reducing capital cost, but has not yet achieved ignition-class conditions. The DOE-approved
    design targets 50 MW net electrical output per module.'
