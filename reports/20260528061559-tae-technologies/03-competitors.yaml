- id: switching-costs-moats
  title: Switching Costs, Lock-in, and Moat Assessment
  body: 'TAE''s deepest competitive moats are: (1) 28 years of proprietary plasma physics data accumulating since 1998 — a
    dataset unique to p-B11 high-temperature plasmas that cannot be reverse-engineered from published literature; (2) a patent
    estate covering Field-Reversed Configuration control, plasma normalization methods, and the Norm-class technology; (3)
    the aneutronic fuel cycle — p-B11 produces helium-4 ash and no neutrons, eliminating neutron activation of structural
    materials, tritium breeding requirements, and a class of waste not achievable by D-T competitors; (4) spin-off technology
    commercialization — TAE Life Sciences (BNCT) and power management IP create revenue and strategic optionality independent
    of the fusion timeline.


    Switching costs for buyers are high once a long-term PPA or site development is underway: a utility that breaks ground
    on a CFS or Helion facility has sunk tens of millions in engineering and permitting that cannot be transferred. This creates
    a first-mover advantage for whichever approach reaches commercial PPAs first. Helion''s Microsoft agreement and Orion
    construction permit are evidence that Helion is rapidly building this lock-in moat ahead of TAE.


    Multi-homing is structurally limited: utilities and hyperscalers can sign PPAs with multiple future-generation clean power
    providers, but capital and grid interconnection slots are finite. SMRs currently hold a significant head start in utility
    procurement conversations, with multiple SMR projects holding NRC design certifications or advanced licensing review.


    Supply chain access is a critical moat for HTS-based competitors (CFS, Tokamak Energy): they require REBCO tape at scale,
    which only a few manufacturers supply. TAE''s p-B11 approach uses a conventional FRC magnet design that avoids dependence
    on scarce REBCO supply — a structural supply-chain advantage if HTS tape supply becomes constrained. Tokamak Energy''s
    TE Magnetics division is actively building REBCO supply chain capability, which could eliminate this TAE advantage if
    HTS economics improve.


    TAE''s TAE Life Sciences subsidiary provides an independent commercial distribution channel in medical radiation therapy.
    TAE Power Solutions (power management for EVs, grid storage) also provides a near-term revenue bridge and customer relationships
    with automotive OEMs — sources of non-fusion revenue that reduce dependence on fusion milestone timing.'
