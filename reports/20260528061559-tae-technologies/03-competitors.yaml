  evidenceGaps:
  - topic: TAE-funding-runway-and-PPA-pipeline
    type: private-evidence-only
    severity: blocking
    missingEvidence: TAE Technologies has not disclosed funding rounds since 2022 (reported ~$1.2B+ total). No power purchase
      agreements, letters of intent, or utility/hyperscaler offtake discussions have been disclosed as of May 2026.
    whyItMatters: Without runway and PPA pipeline disclosure, TAE competitive positioning against Helion and CFS cannot be
      quantitatively assessed. The absence of a disclosed PPA is a material differentiator vs. Helion.
    diligencePath: Request current cap table, latest funding round details, and any signed or in-negotiation PPA or LOI documents
      from the company directly.
    relatedQuestionRefs:
    - QP004
  - topic: Helion-PPA-commercial-terms
    type: private-evidence-only
    severity: material
    missingEvidence: The Helion-Microsoft PPA has been announced publicly (≥50 MW, 2028 target) but the specific $/MWh electricity
      pricing, penalty clause structure, and technology delivery requirement milestones are not publicly disclosed.
    whyItMatters: Specific pricing is needed to assess what economics fusion must achieve to compete with SMRs and other clean
      firm power; penalty structure determines Helion downside risk if 2028 misses.
    diligencePath: Request redacted PPA term sheet from Helion or Microsoft investor relations; review any regulatory filings
      or state utility commission documents in Washington.
    relatedQuestionRefs: []
  - topic: General-Fusion-SPAC-status-2026
    type: stale
    severity: minor
    missingEvidence: The General Fusion SPAC merger with Spring Valley Acquisition Corp. was announced January 2026 with projected
      close mid-2026. Whether the transaction closed, was extended, or lapsed is not confirmed in public sources as of May
      2026.
    whyItMatters: SPAC close determines General Fusion capital runway and ability to fund LM26 through Lawson milestones;
      transaction failure would re-open existential funding risk.
    diligencePath: Check SEC EDGAR for Spring Valley Acquisition Corp. (SVAC) proxy statements and merger close filings; review
      General Fusion press releases post-announcement.
    relatedQuestionRefs: []
  - topic: D-He3-breeding-and-Zap-capital-cost
    type: missing-source
    severity: material
    missingEvidence: Helion has not publicly disclosed the efficiency or energy cost of its in-house D-He3 tritium breeding
      process. Zap Energy has not disclosed projected capital cost per MW for its Z-pinch design vs. TAE FRC approach.
    whyItMatters: Helion breeding efficiency determines whether the tritium supply constraint — TAE key competitive argument
      for p-B11 — is a real moat or can be engineered away. Zap cost data affects assessment of simplicity premium.
    diligencePath: Review Helion technical publications and any DOE milestone documentation. Request Zap Energy preconceptual
      design report from DOE FOIA or company directly.
    relatedQuestionRefs: []
  - topic: TAE-DOE-program-and-p-B11-regulatory-path
    type: missing-source
    severity: material
    missingEvidence: TAE Technologies participation in the DOE Milestone-Based Fusion Development Program is not publicly
      confirmed. There is no public analysis comparing NRC fusion licensing timeline or insurance cost for aneutronic vs.
      D-T approaches. No independent peer-reviewed validation of the 2022 Norman 150M °C milestone has been located beyond
      company communications.
    whyItMatters: DOE program participation confirms non-dilutive government funding and milestone credibility. Regulatory
      cost differential is the key quantitative case for p-B11 economics vs. D-T competitors.
    diligencePath: Review DOE Milestone-Based Fusion program participant list; request NRC staff analysis on aneutronic vs.
      D-T licensing classification; verify Norman milestone against any published journal data.
    relatedQuestionRefs:
    - QP006
  - topic: SMR-committed-capacity-and-hyperscaler-PPA-availability
    type: missing-source
    severity: material
    missingEvidence: Total MW of SMR capacity under definitive signed PPAs or deployment commitments with hyperscalers and
      utilities is not consolidated in any public source. The remaining hyperscaler clean firm power capacity available for
      non-Helion fusion entrants is also not estimated publicly.
    whyItMatters: SMR lock-in extent and remaining fusion market capacity are the key inputs for assessing how much of the
      2030-2040 firm clean power market remains accessible to TAE if D-T fusion also succeeds.
    diligencePath: Review NEA SMR Dashboard, NRC licensing docket, S&P Global and BNEF utility PPA databases; request data-center
      power procurement disclosed in hyperscaler sustainability reports.
    relatedQuestionRefs: []
  - topic: competitor-headcount-and-revenue-data
    type: private-evidence-only
    severity: minor
