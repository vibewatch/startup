- calloutType: risk
  title: Helion PPA lock-in risk
  body: Helion has construction permits and a Microsoft PPA targeting 2028. CFS targets Q>1 in 2027. If D-T approaches lock
    in major hyperscaler and utility PPAs before TAE's p-B11 technology commercializes, TAE faces structural displacement
    risk in its primary 2030s addressable market.
  claimRefs:
  - CP006
  - CP007
  - CP003
- calloutType: strength
  title: Aneutronic fuel cycle structural advantage
  body: TAE's aneutronic p-B11 fuel eliminates tritium supply-chain constraints and neutron activation — structural advantages
    that become more valuable as D-T approaches scale and their material science limitations manifest. No other private fusion
    company pursues a zero-neutron commercial approach.
  claimRefs:
