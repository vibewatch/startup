- id: TP004
  slug: moat-durability-competitive-risk-register
  title: Moat Durability / Competitive Risk Register
  description: Assessment of TAE's moat claims, competitive threats, severity, and mitigation.
  columns:
  - Moat Claim
  - Threat / Challenger
  - Threat Severity
  - Evidence
  - Mitigation / Diligence Ask
  rows:
  - - p-B11 aneutronic fuel cycle (no neutrons, no tritium)
    - Helion plans internal D-He3 breeding; D-T peers argue tritium self-supply solves constraint; first D-T commercial plants
      could lock in buyers
    - High
    - Helion breeding D-He3; Orion 2028 target; D-T commercializes 5-10 years before p-B11
    - TAE must show p-B11 commercial path before D-T lock-in; milestone timeline diligence required
  - - 28-year plasma physics knowledge base and patent estate
    - CFS ($3B, MIT PSFC co-founders) has deep scientific IP; Helion has 7 prototypes of experimental data
    - Medium
    - CFS co-founded by MIT plasma scientists; Helion has seven prototypes from Grande through Polaris
    - Verify TAE patent claims scope and freedom-to-operate; assess NBI patent breadth vs CFS HTS patents
  - - First-mover PPA lock-in opportunity (TAE site evaluation completed)
    - Helion already has construction permits and Microsoft PPA (2028); TAE has no disclosed PPA as of May 2026
    - High
    - Helion Orion construction started 2026 with 2028 target; TAE only completed 5-state site evaluation
    - 'Critical gap: TAE must disclose PPA pipeline or explain why it can win buyers after Helion signs Microsoft-scale customers'
  - - Technology diversification (TAE Life Sciences, TAE Power Solutions)
    - Pure-play fusion competitors may iterate faster; diversification can dilute R&D focus
    - Medium
    - General Fusion funding crisis shows single-product risk; but CFS and Helion show pure-play focus yields faster progress
    - Quantify revenue contribution of subsidiaries; assess whether BNCT or Power Solutions delays fusion milestone
  - - HTS supply-chain independence (FRC vs REBCO magnets)
    - Tokamak Energy TE Magnetics building REBCO supply chain; CFS manufacturing own REBCO; HTS costs declining
    - Low
    - TE Magnetics commercializing REBCO; CFS in-house magnet manufacturing reduces dependence on third-party tape
    - Monitor REBCO tape production capacity and cost curve; revisit if FRC magnet advantage erodes
