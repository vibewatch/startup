    - Site support, policy enablement, and neutral-beam commercialization via UKAEA / TAE Beam UK
    - Current enabling layer
    - Essential for siting, supply chain, and third-party beam commercialization
    - Counterparty proof is strong, but these are enabling partners, not end-market electricity customers
