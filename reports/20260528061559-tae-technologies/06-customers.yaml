- id: section-durability-concentration-and-expansion
  title: 'Durability, concentration, and expansion path: biggest gaps remain after the first logo'
  body: |-
    TAE's customer-risk profile is defined less by churn today than by the complete absence of public durability data. None of the available materials disclose contract length, renewal timing, NRR, GRR, cohort retention, treatment volumes, reorder history, or customer satisfaction metrics across the fusion, power-solutions, life-sciences, or beam businesses. That means even where named counterparties exist, the report cannot verify how much revenue is attached, how sticky the relationship is, or whether it expands after the first deployment. For a first-of-a-kind fusion plant, this is especially important because the first customer could easily represent most of the company's commercial revenue for an extended period. Similar concentration risk exists in BNCT and data-center power management: one hospital system, one research center, or one large digital-infrastructure account could dominate initial revenue.

    Expansion is plausible, but only after a difficult procurement sequence. Utility and hyperscaler buyers have to navigate interconnection uncertainty, cost allocation, permitting, and long construction timelines; hospitals need clinical data, installation budgets, and regulatory clearance; and beam customers still need proof that TAE can translate internal reactor components into a broader product line. The best underwriting view is therefore a staged expansion path. First, TAE wins adjacent proof in storage, beams, and BNCT. Second, it converts a first fusion plant site and offtake structure. Third, it uses operating evidence from that plant to expand into repeat utility, hyperscaler, and industrial-process customers. Until stage two is visible in signed contracts rather than in strategy slides, the customer chapter remains more about prospective demand and procurement friction than about commercial durability.
