  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fusion utility pipeline
    missingEvidence: TAE does not publicly name utility, hyperscaler, industrial, or host-site counterparties beyond state-level siting outreach for the first fusion plant.
    whyItMatters: Without named offtakers or host agreements, the chapter cannot distinguish genuine buyer conversion from general commercialization messaging.
    diligencePath: Request NDA-stage pipeline by segment, including host-region discussions, utility / corporate offtake talks, expected contract structure, and timing to signed terms.
    relatedQuestionRefs:
    - QU003
    - QU004
    - QU005
    relatedTableRefs:
    - TU002
    - TU003
  - type: missing-source
    severity: material
    topic: bnct commercial economics
    missingEvidence: Public sources do not disclose contract values, treatment volumes, reimbursement status, or repeat procurement behavior for Xiamen, CNAO, UW, or other TAE Life Sciences counterparties.
    whyItMatters: Named hospital logos can prove interest but not durable economics, installed utilization, or repeat sales.
    diligencePath: Request installed-base summary, site-by-site status, treatment volumes, reimbursement assumptions, and backlog / reorder data for every BNCT counterparty.
    relatedQuestionRefs:
    - QU017
    - QU021
    relatedTableRefs:
    - TU003
    - TU004
  - type: missing-source
    severity: material
    topic: mara conversion and deployment footprint
    missingEvidence: The MARA announcement provides prototype and commercialization timing but no named operating site, no deployed unit count, and no recurring revenue disclosure as of 2026-05-28.
    whyItMatters: Adjacent customer proof matters only if it converts from announcement-stage pilot work into live deployments with repeat economics.
    diligencePath: Ask for installed locations, live megawatts under management, contract duration, follow-on orders, and whether any hyperscaler or colocation operator beyond MARA is contracted.
    relatedQuestionRefs:
    - QU011
    - QU024
    relatedTableRefs:
    - TU002
    - TU003
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention and concentration metrics
    missingEvidence: No public retention, renewal, churn, cohort, or top-customer concentration figures are disclosed across TAE's business lines.
    whyItMatters: Durability and concentration are central to customer underwriting, especially where one first-of-a-kind plant or one hospital system could dominate revenue.
    diligencePath: Request segment-level bookings, customer concentration by revenue, renewal schedule, logo retention, and expansion pipeline for fusion, power solutions, life sciences, and beam businesses.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU004
    - TU005
