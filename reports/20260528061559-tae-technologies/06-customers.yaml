- id: section-adoption-trajectory-and-market-pull
  title: 'Adoption trajectory: real buyer demand exists, but TAE fusion remains at prospective stage'
  body: |-
    Public evidence still places TAE's fusion-power business before customer conversion. The company has named three U.S. states for site evaluation and disclosed a target of roughly 50 MWe for the first plant in the early 2030s, but it has not announced a final site, a utility PPA, a plant host MOU, or a production electricity customer. That absence matters because the best external proof of hyperscaler and clean-power appetite now comes from competitors: Helion secured Microsoft as the first announced fusion power purchaser, while Commonwealth Fusion Systems and Google signed a 200 MW offtake arrangement tied to ARC. Those deals confirm that large tech buyers will sign milestone-contingent, long-dated fusion contracts when they see strategic value in firm carbon-free power — but they also highlight the gap between category demand and TAE-specific conversion.

    That gap is not caused by weak end-market pull. Independent power studies show data-center demand is surging and that speed-to-power has become the decisive constraint. S&P projects U.S. data-center grid demand rising from 61.8 GW in 2025 to 75.8 GW in 2026 and 134.4 GW by 2030, while Bloom, JLL, and Wood Mackenzie all describe interconnection delays, utility/customer expectation gaps, and the resulting shift toward behind-the-meter power and storage. This environment supports the thesis that hyperscalers, utilities, and industrial users are hunting for firm capacity — but it also raises the procurement bar for TAE. Buyers increasingly require credible siting, grid, permitting, contracting, and bridge-power plans before they will underwrite a first-of-a-kind fusion asset. In other words, the market backdrop is attractive, but the customer journey is still in discovery and diligence rather than in production adoption.
