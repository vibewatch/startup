- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration / procurement risk
  - impact
  - diligence path
  rows:
  - - First fusion plant success
    - Single first plant could represent most early commercial revenue
    - High revenue concentration and thesis dependence on one site / buyer
    - Request first-plant capex plan, buyer structure, and contingency pipeline for second site
  - - Hyperscaler power shortage
    - Buyers need firm capacity quickly, but interconnection and permitting delays can outlast TAE's readiness
    - Could delay conversion even if buyer demand is real
    - Map utility queues, host-region politics, and bridge-power options alongside TAE plant timeline
  - - Hospital-based BNCT adoption
    - Clinical enthusiasm may not convert into reimbursed commercial installation volumes
    - Named sites may remain research-stage longer than investors expect
    - Request regulatory roadmap, treatment economics, reimbursement strategy, and signed procurement milestones
  - - Beam technology commercialization
    - UKAEA JV may stay focused on internal / ecosystem development instead of broad external sales
    - Beam proof may support technology credibility without generating diversified revenue
    - Ask for third-party customer pipeline and expected external share of beam revenue
  - - Industrial heat expansion
    - Segment is real but likely later than first-grid deployment and may require bespoke plant design
    - Expansion story can be strategically valuable while remaining financially remote
    - Request target industries, temperature specs, and any named pilot counterparties for process heat
  - - Portfolio complexity
    - Investors may over-credit adjacent businesses as if they de-risked core fusion customer adoption
    - Can mask the lack of utility-scale customer proof in the flagship business
    - Separate fusion, power-solutions, life-sciences, and beam bookings, margins, and pipeline conversion metrics
  notes: Rows focus on land-and-expand logic and concentration risk, not generic company risks. The core issue is whether adjacent proof converts into a repeatable customer-acquisition engine for fusion plants rather than remaining a set of disconnected pilots and partnerships.
