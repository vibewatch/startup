chapter:
  number: 6
  title: Customers
  summary: 'TAE Technologies remains pre-revenue and pre-deployment in fusion power: as of 2026-05-28 there is no public utility offtake, no named production power buyer, and no announced commercial plant host. Customer proof therefore comes from prospective buyer demand and from adjacent businesses — MARA for TAE Power Solutions, hospital and research counterparties for TAE Life Sciences, and the UKAEA joint venture for neutral-beam commercialization — all of which demonstrate interest and pilot traction but not yet durable commercial power-customer economics for TAE fusion plants.'
sections:
- id: section-prospective-buyer-segments
  title: 'Prospective buyer map: utilities, hyperscalers, industrial heat, and enabling counterparties'
  body: |-
    TAE should be analyzed as a company with multiple customer surfaces but only one long-dated core energy product. In fusion power, the eventual buyer is likely a utility, merchant generator, or large corporate energy buyer that needs dependable carbon-free power and can tolerate first-of-a-kind construction and contracting risk. TAE's own siting materials show that the first plant is still at the location-evaluation stage, so the relevant “customers” today are better understood as prospective buyers and enabling counterparties: state and local governments, transmission-connected host regions, regulators, infrastructure partners, and early strategic offtakers. TAE also explicitly markets later plants not only to the grid but to carbon-intensive industrial processes, which creates a second, longer-dated buyer class that cares about both electricity and decarbonized process heat.

    The near-term revenue picture is more concrete in adjacent businesses. TAE Power Solutions is targeting data-center, high-performance-compute, grid-efficiency, and battery-storage buyers that need fast power conditioning and behind-the-meter flexibility rather than fusion electricity. TAE Life Sciences is targeting hospitals, cancer centers, and academic oncology programs for boron neutron capture therapy (BNCT) systems and boron-drug development. TAE Beam UK, the UKAEA joint venture, is not a utility customer at all; it is a commercialization vehicle for neutral-beam technology that can serve TAE's own plants, other fusion developers, and selected non-fusion markets such as cancer therapy, food safety, and homeland security. The chapter therefore has to distinguish carefully among production customers, pilots, prospective installations, and enabling partners rather than treating all named relationships as equivalent revenue proof.
