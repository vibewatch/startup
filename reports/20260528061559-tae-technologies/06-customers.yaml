figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: TAE's path from market need to durable revenue starts with buyer pain, moves through enabling counterparties and pilot proof, and only later reaches repeat fusion-plant customers.
  data:
    nodes:
    - label: Buyer pain emerges
      detail: Utilities need firm carbon-free power, hyperscalers need speed-to-power, hospitals need new cancer-treatment options, and fusion programs need advanced neutral beams.
      tone: neutral
    - label: Prospective counterparties engage
      detail: TAE meets host regions, governments, infrastructure partners, hospitals, and strategic buyers before it can announce a signed commercial customer.
      tone: neutral
    - label: Technical / policy diligence
      detail: Grid access, permitting, siting, procurement rules, clinical validation, and financing structure determine whether interest becomes a contract.
      tone: warning
    - label: Pilot / partner proof
      detail: MARA storage work, UW BNCT planning, Xiamen / CNAO clinical proof, and UKAEA beam commercialization create named evidence without proving fusion-power revenue.
      tone: positive
    - label: First commercial conversion
      detail: Only after a site, offtake structure, and construction plan are locked can TAE claim a true fusion power customer.
      tone: warning
    - label: Operational reference site
      detail: An operating plant or hospital installation would create retention, uptime, and expansion data that do not yet exist publicly.
      tone: positive
    - label: Multi-site expansion
      detail: Repeat sales into utilities, hyperscalers, industrial heat users, and additional hospitals are the path to durability, but remain unproven today.
      tone: neutral
  approximationNotes: The sequence is inferred from public siting, partnership, and clinical-installation evidence rather than from a disclosed TAE customer funnel. It distinguishes pilot proof from durable commercial conversion.
