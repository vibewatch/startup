- id: section-named-proof-and-adjacent-customers
  title: 'Named proof: adjacent pilots and clinical/research counterparties, not commercial fusion power customers'
  body: |-
    The strongest named proof around TAE today sits outside the core fusion-electricity product. On the energy-systems side, MARA and TAE Power Solutions announced a 10 MW clean-energy storage network for hyperscale data centers, HPC, and other power-intensive operations, with prototypes planned for late 2025 and larger commercialization expected in early 2026. That is meaningful buyer proof because a named counterparty is relying on TAE-derived hardware and controls to solve an immediate power problem. It is not, however, evidence that TAE has sold fusion-generated electricity or secured a utility-scale power-plant offtake. The distinction matters because the technology, purchasing process, regulatory path, and risk-sharing structure are very different.

    The same distinction applies in life sciences and beam technology. TAE Life Sciences has a much richer set of named hospital and research counterparties than the fusion-power business: UW-Madison has an MOU to become the first U.S. Alphabeam site and launch clinical trials; company materials say Xiamen Humanity Hospital is already running human clinical trials on a TLS neutron beam system; CNAO in Italy is the next planned Alphabeam installation; and Ohio State has an LOI focused on boron-drug R&D. Likewise, TAE Beam UK is fully funded and formalized with UKAEA, proving there is third-party appetite for TAE's accelerator technology inside the fusion supply chain. Yet every one of these examples is best described as pilot, research, prospective installation, or enabling-partner proof. None show the combination of signed long-term revenue, repeat purchasing, and operational retention that would let an investor treat TAE as already possessing a durable commercial customer base in fusion energy.
