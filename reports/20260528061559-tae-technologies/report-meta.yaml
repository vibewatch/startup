companyProfile:
  summary: >-
    TAE Technologies is a private fusion energy company founded in 1998 as Tri Alpha Energy by
    Norman Rostoker and Michl Binderbauer in Foothill Ranch, California. The company is pursuing
    beam-driven field-reversed-configuration fusion with an eventual hydrogen-boron fuel cycle,
    while also commercializing related accelerator technologies through TAE Beam UK, TAE Life
    Sciences, and TAE Power Solutions. Public materials show real scientific progress and strong
    strategic backers, but the core fusion business remains pre-commercial and is currently being
    financed through milestone capital, subsidiaries, and a pending Trump Media merger.
  foundedDate: '1998-01-01'
  founders:
    - name: Norman Rostoker
      role: Co-founder (deceased 2014)
      background: >-
        UC Irvine plasma physicist whose work on field-reversed configurations formed the scientific
        basis of Tri Alpha Energy and later TAE Technologies.
      claimRefs: []
    - name: Michl Binderbauer
      role: Co-founder; CEO
      background: >-
        Plasma physicist and engineer who co-developed TAE's beam-driven FRC approach and has led
        the company since Rostoker's death in 2014.
      claimRefs: []
  foundingLocation: Foothill Ranch, California
  headquarters: Foothill Ranch, California
  productSummary: >-
    TAE's core product is a future utility-scale fusion power plant built around beam-driven
    field-reversed-configuration plasma confinement and neutral-beam injection. The broader
    platform also includes neutral-beam manufacturing and service, BNCT cancer-treatment systems,
    and power-management hardware derived from the same accelerator and controls stack.
  customerFocus: >-
    Long-term target buyers are utilities, hyperscalers, and industrial energy users that need
    firm carbon-free power and heat. Nearer-term counterparties include fusion ecosystem partners,
    hospitals and research centers for BNCT, and power-intensive infrastructure customers for
    TAE-derived power electronics and storage systems.
  businessModel: >-
    Long-duration value creation is expected to come from electricity and industrial-heat sales or
    project economics from first fusion plants. Nearer-term monetization may come from technology
    licensing, neutral-beam manufacturing/service, BNCT systems and services, and power-management
    hardware, though segment revenue is not publicly disclosed.
  stage: Late-stage private unicorn
  fundingStatus: >-
    More than $1.3B of disclosed equity capital raised, including a $150M June 2025 round led by
    Google and Chevron Technology Ventures. A pending December 2025 merger announcement implies a
    >$6B headline value and up to $300M of merger cash, though $100M remains contingent on an S-4 filing.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO006, CO018, CI027]
