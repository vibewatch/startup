- 'id': 'comparable-set'
  'title': 'Comparable Set and Evidence-Backed Valuation Methods'
  'body': |-
    Three valuation methods are defensible here. First, recent private marks for TAE itself: these are imperfect but still the cleanest anchor because they represent actual market-clearing events or observed secondary signals. Second, milestone-based private fusion comparables: CFS, Helion, Zap, Proxima, and General Fusion show what investors have recently funded at specific levels of plant-readiness, offtake proof, and engineering de-risking. Third, public listed analogs such as Oklo and NuScale provide a sentiment envelope for how public markets can price advanced nuclear narratives. What is not defensible is a faux-precision DCF. TAE has not published enough plant-level economics, commercialization cadence, or capital-structure detail to support one.

    Those methods point in the same direction. Private marks say the observable range is far closer to roughly $2.5-2.9 billion than to >$6 billion. Milestone comps say Helion and CFS deserve premium status because they have stronger disclosed evidence on commercialization path, while Zap, Proxima, and General Fusion show that important fusion milestones can still be financed far below TAE's announced public-market jump. Public analogs widen the range rather than settle it: Oklo proves that listed advanced-nuclear enthusiasm can carry a company to a double-digit-billion market cap before revenue, but NuScale shows the reverse, with a multibillion-dollar market cap that can still compress sharply once execution confidence falls. The correct takeaway is to use scenario ranges anchored to milestone evidence, not a single heroic number.
