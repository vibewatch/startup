- 'id': 'exit-readiness-and-diligence'
  'title': 'Financing Overhang, Exit Readiness, and Final Diligence Asks'
  'body': |-
    The pending TMTG transaction gives TAE a possible liquidity path, but it does not yet make the company public-company ready in an underwriting sense. The announcement answers the headline questions — value, ownership split, and cash commitment — but leaves the most important diligence items outside the retained public record: exact cap-table and preference terms, plant-level capital needs, segment financials, and the eventual merger filing pack. Even bullish observers describe the deal as a reverse-merger or public-capital shortcut, which is useful context. A shortcut can still work, but it is not a substitute for the disclosure quality investors would normally expect before paying a premium valuation.

    That is why the chapter's final stance is strict on entry discipline. Current evidence supports tracking TAE because its science program remains relevant and because the merger could create a real financing advantage. Current evidence does not support buying at the announced price. The next review should therefore be gated by a small set of concrete diligence asks and kill triggers: disclose the preference stack; publish the merger filing pack; show Da Vinci and first-plant capex, schedule, and power economics; and prove whether subsidiaries contribute meaningful value or simply consume capital. If those answers are strong, the story can move back toward the bull case. If they are weak, the >$6 billion headline will look like a financing event rather than a fair value.
