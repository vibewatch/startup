            body: >-
              TAE's customer-risk profile is defined less by churn today than by the complete absence of public
              durability data. None of the available materials disclose contract length, renewal timing, NRR, GRR,
              cohort retention, treatment volumes, reorder history, or customer satisfaction metrics across the fusion,
