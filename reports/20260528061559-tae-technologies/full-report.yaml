      - number: '8.4'
        title: Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes the merger closes on roughly announced terms, site selection and first-plant work
              become concrete, and TAE starts to look more like a Helion/CFS peer than a science-heavy private lab. In
              that world, the market continues to reward fusion and AI-power narratives, and TAE can plausibly trade
              back toward the upper end of its 2022 private mark or even into a lower-end Oklo-style public enthusiasm
              band. But that case is not today's evidence; it is conditional on future milestones.


              The base case is far more conservative. It assumes TAE remains a credible contender with real science
              progress, yet that investors continue to anchor on the June 2025 round, the late-May 2026 Yahoo/Forge
              estimate, and the fact that comparable companies with stronger commercialization proof are not obviously
              cheaper. Under that framing, fair value lives around the low-to-mid $3 billion range, not at >$6 billion.
              The bear case is straightforward: the merger slips or fails, the company still needs more project capital,
              and new financing arrives before plant economics are disclosed. Because TAE has already raised through at
              least 12 rounds, that outcome would not just reduce the headline mark; it could also push effective value
              away from common or new-money holders through dilution and old-preference overhang. The asymmetry is
              therefore poor at the announced price: upside requires several visible wins, while downside needs only one
              financing or execution miss.
            claimRefs:
              - CV029
