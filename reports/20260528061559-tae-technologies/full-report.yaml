  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      TAE's fusion product stack layers accelerator hardware, stabilization controls, software, and plant
      balance-of-system around an FRC core.
    data:
      layers:
        - label: Plant outcome layer
          detail: Dispatchable electricity and industrial-process energy from a future utility-scale fusion plant.
        - label: Power delivery / conversion layer
          detail: >-
            Internal pulse-power handling today; export power architecture remains only conceptually described in
            public.
        - label: FRC confinement vessel
          detail: Compact linear chamber whose plasma self-organizes into an FRC rather than a tokamak torus.
        - label: Neutral beam layer
          detail: Eight angled beam lines delivering heating, current drive, and stability to the plasma core.
        - label: Active stabilization layer
          detail: >-
            Edge biasing, magnetic shaping, fueling, and divertor-side controls keep the beam-driven plasma inside
            stable operating windows.
        - label: Diagnostics + ML layer
          detail: >-
            Bayesian reconstruction, shot analytics, and Optometrist-guided tuning handle the machine's large control
            space.
    approximationNotes: >-
      Public materials disclose the plasma and controls stack in meaningful detail, but not a full plant
      balance-of-plant drawing.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE022
      - CE023
      - CE031
      - CE040
