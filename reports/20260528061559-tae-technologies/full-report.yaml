        - from: power-proof
          to: first-fusion-customer
        - from: clinical-proof
          to: first-fusion-customer
        - from: beam-proof
          to: first-fusion-customer
        - from: first-fusion-customer
          to: repeat-sites
    approximationNotes: >-
      The flow is strategic rather than contractual. It shows how adjacent proof might lower buyer skepticism, but it
      does not imply that adjacent businesses automatically convert into fusion offtakes.
