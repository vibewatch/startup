  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              TAE sits at the awkward intersection of real frontier-science progress and thin price support. The
              positive context is easy to see: Google, Chevron, and NEA backed the June 2025 round; the company
              subsequently announced a public-market merger valued at more than $6 billion; and the merger pitch is
              explicitly tied to a cleaner aneutronic fusion architecture plus the promise of utility-scale,
              data-center-relevant power. That combination explains why TAE can command attention. But it does not by
              itself justify the current announced price. The strongest observable private-market anchors are much
              lower. Yahoo Finance / Forge shows the July 2022 Series 11 at $250 million raised and $5.49 billion
              post-money, the June 2025 Series 12 at $150 million and $2.9 billion post-money, and an estimated
              valuation of only about $2.47 billion by late May 2026. Nasdaq Private Market separately estimated a
              $40.83 per-share value in mid-May 2026, versus the merger's implied $53.89 per share.


              That gap matters because the >$6 billion merger headline is not being underwritten against disclosed
              revenue, margin, or plant-economics evidence. Instead, it is a combination of technical optimism,
              public-market optionality, and the financing leverage of Trump Media's balance sheet. The right reading is
              not that TAE is low quality; it is that current price support is more narrative-driven than
              fundamentals-driven. TAE is worth tracking precisely because the science program remains live and the
              financing pathway could widen. But for a new investor at the announced price, the burden of proof has
              shifted: the company must now show that the merger premium reflects real plant-readiness and not just a
              liquidity shortcut.
