      - number: '8.2'
        title: Thesis, Anti-Thesis, and Recommendation Logic
        blocks:
          - type: paragraph
            body: >-
              The bull case has substance. TAE has survived multiple capital cycles, kept Google engaged for more than a
              decade, and raised another $150 million in June 2025 despite a harsher funding market. The company can
              plausibly argue that late-2025 financing conditions were better than mid-2025 because the merger followed
              a stronger technical narrative and offered access to much deeper public capital. That matters for a fusion
              company whose true bottleneck is no longer only physics, but also the cost and cadence of
              engineering-scale deployment. In other words, one can build a serious long-term thesis that TAE becomes
              one of a small handful of fusion names still standing when first-plant opportunities crystallize.


              The anti-thesis is stronger at today's price. Helion publicly pairs a $5.4 billion valuation with a named
              Microsoft offtake and a 2028 commercialization target, while CFS has nearly $3 billion raised and
              specifically funded SPARC and ARC milestones. TAE's public record is improving, but it still lacks the
              same level of disclosed plant-readiness proof. The market is therefore being asked to value TAE above or
              near better-documented peers while also absorbing reverse-merger governance complexity, uncertain
              public-market timing, and a private cap table built over at least 12 rounds. That is why the
              recommendation logic is price-sensitive: own the company only if price or disclosure moves far enough to
              close the gap. At the announced >$6 billion value, the correct posture is avoid for fresh capital while
              keeping TAE on a watchlist for a later, more evidence-backed entry.
            claimRefs:
