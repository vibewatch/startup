              TAE's aneutronic p-B11 fuel eliminates tritium supply-chain constraints and neutron activation —
              structural advantages that become more valuable as D-T approaches scale and their material science
              limitations manifest. No other private fusion company pursues a zero-neutron commercial approach.
            calloutType: strength
