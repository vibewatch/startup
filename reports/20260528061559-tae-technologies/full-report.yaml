  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology and commercialization risks
        blocks:
          - type: paragraph
            body: >-
              TAE's biggest residual risk remains the step from impressive experimental progress to a bankable
              power-plant program. The company continues to market hydrogen-boron (p-B11) fusion as its long-run
              commercial fuel cycle, and its own materials present that path as cleaner and ultimately more durable than
              deuterium-tritium. That is a real strategic differentiator if it works. The problem is that p-B11 is also
              one of the hardest fusion paths on the table. Independent technical critique argues no reactor has come
              remotely close to p-B11 conditions, and TAE's own January 2026 Q&A still frames Norm Upgrade as needing to
              validate the 100 million degree and hot-enough-for-long-enough milestones before Da Vinci can be treated
              as a credible next step.


              The Norm breakthrough matters because NBI-only formation simplifies the machine and appears to let TAE
              skip Copernicus, but it does not collapse the distance between a national-lab-scale device and a utility
              plant. TechCrunch reported in April 2026 that no fusion startup had reached scientific breakeven, while
              Yahoo Finance and competitor commentary called TAE's 2026 construction timeline highly ambitious.
              GeekWire's competitor quotes are especially important because they attack not TAE's ambition, but the
              specific idea that the science is already solved. Taken together, the evidence supports a harsh
              conclusion: technology risk is no longer a science-fair risk, but it is still a thesis-critical
              commercialization risk.


              The technology story is therefore asymmetric. If TAE continues to hit machine milestones, public capital
              can reward the company quickly. If milestone timing slips, the market will discover that TAE went public
              before independently proving either scientific breakeven or customer-grade plant readiness. That is why
              technology and financing risk transmit into one another so directly in this case.
