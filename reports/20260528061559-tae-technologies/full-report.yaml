      - number: '2.2'
        title: 'Sizing lenses: data-center load, firm-power scarcity, fusion capital formation, and industrial heat pressure'
        blocks:
          - type: paragraph
            body: >-
              This chapter uses multiple lenses because no single public TAM estimate is trustworthy enough for frontier
              fusion. The strongest demand signal comes from large-load power. Berkeley Lab and DOE put U.S. data-center
              electricity use at 176 TWh, or about 4.4% of national electricity consumption, in 2023; Berkeley Lab then
              projects 325-580 TWh and 6.7-12% by 2028. EPRI's 2026 analysis goes further, estimating 380-790 TWh and
              9-17% by 2030, with AI workloads already accounting for 15-25% of data-center electricity use. Goldman
              Sachs and BCG add the market implication: hyperscalers are now looking for 24/7 reliable low-carbon
              supply, and BCG sees a potential 50-80 GW U.S. capacity shortfall by 2030 if generation fails to keep up.
              These are not direct revenue forecasts for TAE, but they are strong evidence that the end-market problem
              TAE wants to solve is becoming economically urgent.


              A second lens is grid deliverability rather than raw energy demand. Americans for a Clean Energy Grid,
              Berkeley Lab's interconnection queue work, and Data Center Dynamics all point to transmission and
              interconnection as the binding constraint. Five-year U.S. peak-load-growth expectations have surged,
              interconnection queues still exceed two terawatts of active capacity, only a small minority of queued
              projects actually reach commercial operation, and regional operators are still missing upgrade deadlines
              that could raise line capacity. This supports a market definition centered on firm clean power that can
              actually be delivered, not just on decarbonization ambition.


              A third lens is whether fusion itself is maturing into a financeable supply category. FIA, DOE, ARPA-E,
              and IEA-linked reporting show an industry with more than 50 companies, around $10 billion in cumulative
              private capital, and rising public support—yet still a large financing gap before pilot plants become
              commonplace. A fourth lens is industrial heat decarbonization: the addressable problem is enormous, but
              adoption will be selective because process temperatures, retrofit complexity, and energy economics vary
              widely by sector. The right conclusion is not to add these lenses together, but to use them to triangulate
              where TAE has a credible first market and where it does not yet.
