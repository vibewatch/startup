companyProfile:
  summary: >-
    TAE Technologies is a private fusion energy company founded in 1998 as Tri Alpha Energy by Norman Rostoker and Michl
    Binderbauer in Foothill Ranch, California. The company is pursuing beam-driven field-reversed-configuration fusion
    with an eventual hydrogen-boron fuel cycle, while also commercializing related accelerator technologies through TAE
    Beam UK, TAE Life Sciences, and TAE Power Solutions. Public materials show real scientific progress and strong
    strategic backers, but the core fusion business remains pre-commercial and is currently being financed through
    milestone capital, subsidiaries, and a pending Trump Media merger.
