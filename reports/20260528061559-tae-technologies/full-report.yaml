      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Avoid at >$6B, Track for a Reprice
            body: >-
              TAE remains worth following because the science program is real and the financing path could strengthen.
              But the announced price is ahead of the best open-market evidence. Revisit only if the valuation
              compresses toward the low-to-mid $3B range or if a merger filing and plant-economics package closes the
              proof gap versus Helion and CFS.
            calloutType: recommendation
            claimRefs:
              - CV040
              - CV045
              - CV046
          - type: callout
            title: The core science case is still investable
            body: >-
              Unlike weaker fusion stories, TAE has continued to attract repeat backing from Google, Chevron, and NEA
              and still commands a credible route to large-scale financing. That is why the right call is
              price-sensitive skepticism, not blanket dismissal.
            calloutType: strength
            claimRefs:
              - CV005
              - CV038
          - type: callout
            title: Dilution and preference overhang are central, not secondary
            body: >-
              At least 12 rounds of financing, a fully diluted 50/50 merger split, and no public preference waterfall
              mean that even a seemingly successful headline valuation may not translate into attractive realized
              returns for new money.
            calloutType: risk
            claimRefs:
              - CV008
