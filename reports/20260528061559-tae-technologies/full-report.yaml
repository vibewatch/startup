      - number: '5.2'
        title: Machine stack, controls, and research validation
        blocks:
          - type: paragraph
            body: >-
              Public technical proof for TAE rests on three linked layers: peer-reviewed plasma-physics results,
              machine-control software, and a broad public research library. The peer-reviewed layer matters because it
              validates specific sub-problems: NBI-only FRC formation, beam-driven ion acceleration, and continuing
              fast-ion work. The controls layer matters because TAE's machine is too complex to tune manually at high
              cadence. Google's write-up of the collaboration makes clear that C-2W / Norman involved more than 1,000
              control parameters and more than 1,000 plasma measurements, with only one experiment every eight minutes;
              that makes optimization, diagnostics, and Bayesian reconstruction central operating technology rather than
              support tooling. TAE therefore looks more like a vertically integrated physics-and-controls company than a
              pure hardware fabricator. At the same time, the public record has limits. TAE advertises a twice-yearly
              independent science panel, but the review process is not itself publicly inspectable. The research library
              is unusually large for a private fusion company and does create external visibility, yet detailed
              machine-performance data still lives mostly in company-hosted papers, partner collaborations, and
              conference material rather than in regulator-reviewed plant filings.
