      - number: '7.2'
        title: Regulatory, safety, and permitting risks
        blocks:
          - type: paragraph
            body: >-
              Regulation is a relative tailwind for TAE, but it is not a permit waiver. The strongest positive fact is
              that the NRC has already chosen the Part 30 byproduct-material framework rather than a fission-style Part
              50 reactor regime. That should lower the burden for early fusion deployment. But the same legal commentary
              that treats Part 30 as favorable also stresses that developers still have to prove their own safety case,
              manage radioactive materials, prepare environmental documentation, and show credible waste and
              emergency-planning assumptions. As of the report run date, the NRC had closed the comment period on the
              proposed rule only one day earlier and had not yet issued a final rule.


              This matters because TAE's public narrative emphasizes the cleaner profile of p-B11 fuel, yet the reviewed
              public sources do not disclose the exact first-plant fuel decision, radiological inventory, or
              project-specific environmental report assumptions. Legal commentary continues to focus on tritium,
              activation products, dust, and site-specific environmental review as the gating issues for commercial
              fusion. TAE may ultimately avoid some of the heaviest tritium burdens if it stays on a pure p-B11 path,
              but investors do not yet have enough public evidence to know what the first licensed plant will actually
              look like.


              Permitting risk is also operational. TAE's own site-tour and merger materials say the first plant depends
              on grid access, land, security, local talent, supportive governments, and formal approvals. Those are
              multi-stakeholder dependencies that often move slower than physics programs. In other words, the company
              can be directionally right on federal policy and still miss its construction and energization schedule
              because local and project-specific execution is not yet locked.
