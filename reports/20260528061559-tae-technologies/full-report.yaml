      - number: '7.5'
        title: Thesis-break triggers and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to think about TAE is not whether fusion is possible in the abstract, but whether this
              specific company can clear a sequence of public proof points before the market or regulatory process
              forces a repricing. The three hardest triggers are easy to observe. First, science and engineering: if TAE
              cannot translate Norm and Norm Upgrade into independently legible breakeven-adjacent performance and a
              plant-grade engineering package, the timeline should be reset. Second, financing: if the S-4 stalls or the
              merger closes without transparent capital-allocation detail, the headline balance-sheet argument should be
              discounted sharply. Third, customer proof: if site selection advances but there are still no visible
              offtake or utility counterparties, commercialization remains theoretical.


              These are not abstract downside scenarios; they are the exact junctions where TAE's strongest mitigants
              can fail. Part 30 regulation helps, but only if project-specific safety and environmental work keeps pace.
              Strategic investors help, but only if they continue bridging capital after the public listing narrative
              cools. Adjacent businesses help, but only if they generate cash fast enough to matter and do not dilute
              management focus. The evidence today says TAE has enough real progress to stay in the conversation, but
              not enough disclosed proof to underwrite the current plan as de-risked.


              The practical diligence implication is straightforward: treat TAE as a milestone-dependent,
              public-market-sensitive frontier-energy investment. Require documentary proof on S-4 terms, board
              independence, siting critical path, fuel-cycle assumptions, and customer pipeline before underwriting any
              claim that financing or regulation has been solved.
