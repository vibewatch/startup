  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Core fusion revenue remains pre-commercial while the few monetization proofs sit in adjacencies
        blocks:
          - type: paragraph
            body: >-
              The public record still reads like a commercialization roadmap, not an operating revenue story. TAE’s own
              merger and FAQ materials focus on siting a first 50 MWe plant in 2026, progressing to Da Vinci, and
              targeting electrons to the grid in the early 2030s. Those are important milestones, but they are not the
              same as disclosed power-sales revenue, customer prepayments, or project backlog. Even PitchBook’s archived
              profile, which labels the latest deal as “Generating Revenue,” leaves the current revenue field blank.
              Across the official funding page, investor page, FAQ, and merger materials reviewed here, there is no
              public revenue number, ARR figure, or gross-margin disclosure for the core fusion business.


              The best public evidence of actual monetization today comes from adjacencies. TAE Life Sciences has a more
              concrete economic narrative than the fusion business itself: an accelerator-based BNCT platform,
              hospital-oriented Alphabeam deployments, installed hardware in China, planned U.S. and Italian sites, and
              a disclosed full-service contract that management described as recurring revenue. TAE Beam UK adds another
              possible early monetization path because it is explicitly set up to manufacture and service neutral beams
              for a wide range of fusion approaches. TAE Power Solutions is also presented as a commercialization
              vehicle, but public materials stop at capability and partnership language rather than giving pricing,
              booked revenue, or customer counts.


              Taken together, the chapter’s evidence supports a mixed conclusion: TAE clearly has multiple mechanisms by
              which technology could convert into revenue, but public proof of current, durable revenue is concentrated
              in subsidiary-level signals rather than the core fusion-power product investors are ultimately being asked
              to finance.
