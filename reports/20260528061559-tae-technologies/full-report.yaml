      - number: '2.4'
        title: >-
          Drivers and adoption constraints: strong pull, but capital intensity, regulation, and interconnection still
          control timing
        blocks:
          - type: paragraph
            body: >-
              The positive side of the market case is straightforward. AI and advanced manufacturing are pulling forward
              demand for dependable electricity; clean-energy investment remains elevated globally; government programs
              increasingly treat power security, grid modernization, and low-carbon supply as industrial policy; and
              fusion has crossed the threshold from isolated science projects to a venture-backed industrial sector with
              sector-wide reporting, dedicated public programs, and a clearer regulatory path. For TAE, this means the
              macro demand problem is real and the policy environment is directionally more favorable than it was even a
              few years ago.


              The harder question is adoption timing. Every external lens in this chapter points back to first-of-a-kind
              execution risk. Fusion companies still report large remaining capital needs before pilot plants come
              online. The NRC's proposed fusion rule is meaningfully lighter than fission-style reactor licensing, but
              it still requires radiation safety, environmental review, materials tracking, and waste pathways;
              regulatory simplification is not the same thing as a commercial shortcut. Interconnection queues remain
              clogged, transmission planning lags the AI build cycle, and even nearer-term solutions such as gas plus
              carbon capture or conventional advanced nuclear are competing to fill the same firm-power gap that TAE
              hopes to address. Industrial heat adds another hurdle because technical fit and project economics differ
              widely by process temperature and by sector.


              The market conclusion is therefore balanced. TAE is pointed at a serious and expanding need—firm clean
              power with optional industrial heat relevance—and its adjacent accelerator businesses broaden the
              platform. But the served market should be underwritten as an execution-constrained infrastructure market,
              not as a simple 'large TAM' story. Until TAE discloses more about plant economics, customer commitments,
              and the path from first plant to repeated deployment, the prudent approach is to treat market size as real
              but serviceability as highly conditional.
