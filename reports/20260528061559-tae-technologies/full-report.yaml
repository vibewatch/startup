  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Relative likelihood, impact, mitigation maturity, and residual exposure across TAE's six main risk clusters as of
      2026-05-28.
    data:
      columns:
        - Technology / commercialization
        - Regulatory / safety
        - Financing / public-market
        - Partner / dependency
        - Supply chain / talent
        - Customer adoption
      rows:
        - label: Likelihood
          values:
            - High
            - Medium
            - High
            - Medium
            - Medium
            - High
        - label: Impact
          values:
            - Critical
            - High
            - Critical
            - High
            - High
            - High
        - label: Mitigation maturity
          values:
            - Medium
            - Medium
            - Low-to-medium
            - Medium
            - Low-to-medium
            - Low
        - label: Residual exposure
          values:
            - Critical
            - High
            - Critical
            - High
            - High
            - High
    approximationNotes: >-
      Ratings are qualitative author codings from reviewed public evidence, not actuarial probabilities. Residual
      exposure stays Critical where public evidence still depends on future milestones rather than completed proof.
    claimRefs:
      - CR002
      - CR011
      - CR021
      - CR025
      - CR037
      - CR045
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How technical, permitting, and financing failures would propagate into valuation, governance, and
      customer-adoption risk.
    data:
      nodes:
        - id: physics-gap
          label: Physics / engineering gap persists
          detail: Norm and Norm Upgrade do not convert into independently legible plant-grade readiness.
        - id: timeline-slip
          label: Plant schedule slips
          detail: 2026 site-and-build narrative or early-2030s first-power narrative moves right.
        - id: capital-burn
          label: Capital burn extends
          detail: Delay increases cash needs before customer proof appears.
        - id: s4-dependence
          label: Merger dependence intensifies
          detail: TAE depends more heavily on S-4 filing and close timing to fund the next step.
        - id: valuation-volatility
          label: Public-market valuation volatility
          detail: A weaker merger currency or governance concerns reduce financing quality.
        - id: customer-proof-delay
          label: Customer proof remains absent
          detail: Without PPAs or utility offtake, commercialization stays theoretical.
        - id: repricing
          label: Thesis reprices downward
          detail: Investors apply a steeper execution and financing discount to TAE.
      edges:
        - from: physics-gap
          to: timeline-slip
          label: causes
        - from: timeline-slip
          to: capital-burn
          label: extends
        - from: capital-burn
          to: s4-dependence
          label: increases
        - from: s4-dependence
          to: valuation-volatility
          label: routes through
        - from: timeline-slip
          to: customer-proof-delay
          label: delays
        - from: valuation-volatility
          to: repricing
          label: drives
        - from: customer-proof-delay
          to: repricing
          label: reinforces
    claimRefs:
      - CR003
      - CR013
      - CR022
      - CR023
      - CR025
      - CR038
      - CR040
      - CR045
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: Critical counterparties and ecosystems that sit between today's TAE progress and a financeable first plant.
    data:
      nodes:
        - id: tmtg
          label: TMTG / S-4 / shareholders
          detail: Merger close and public-market capital bridge.
        - id: nrc
          label: NRC / permitting framework
          detail: Final Part 30 implementation and plant-specific licensing path.
        - id: states
          label: State / utility / interconnection stack
          detail: Site selection, local approvals, and grid access.
        - id: ukaea
          label: UKAEA / Culham
          detail: Beam-tech diversification and supply-chain foothold.
        - id: doe
          label: DOE / national-lab ecosystem
          detail: INFUSE and commercialization support network.
        - id: investors
          label: Google / Chevron / existing syndicate
          detail: Strategic investor support and follow-on credibility.
        - id: binderbauer
          label: Binderbauer / senior leadership
          detail: Science narrative, partner management, and operating execution.
        - id: first-plant
          label: Financeable first plant
          detail: The point where siting, licensing, funding, and customer proof converge.
      edges:
        - from: tmtg
          to: first-plant
          label: funds
        - from: nrc
          to: first-plant
          label: licenses
        - from: states
          to: first-plant
          label: hosts
        - from: ukaea
          to: first-plant
          label: supports ecosystem
        - from: doe
          to: first-plant
          label: validates / collaborates
        - from: investors
          to: first-plant
          label: bridges capital
        - from: binderbauer
          to: first-plant
          label: coordinates
    claimRefs:
      - CR017
      - CR020
      - CR023
      - CR033
      - CR035
      - CR036
      - CR037
      - CR042
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: standard
    summary: >-
      The recommendation chains from real technical progress through financing context and comparable evidence to a
      price-sensitive avoid/track conclusion.
    data:
      nodes:
        - id: n1
          label: Science credibility
          detail: Google-backed progress and continued financing show TAE is not a promotional zero.
          tone: positive
        - id: n2
          label: Recent private marks
          detail: 2025 round and late-May 2026 tracker values cluster far below >$6B.
          tone: warning
        - id: n3
          label: Merger premium
          detail: Public-market route and cash commitments create upside optionality.
          tone: positive
        - id: n4
          label: Peer milestone gap
          detail: Helion and CFS still show stronger disclosed commercialization proof.
          tone: warning
        - id: n5
          label: Dilution overhang
          detail: 12+ rounds and opaque preferences can erode effective upside.
          tone: warning
        - id: n6
          label: Public analog envelope
          detail: Oklo shows upside mood; NuScale shows compression risk.
          tone: neutral
        - id: n7
          label: Current call
          detail: Avoid at >$6B; track if repriced or better disclosed.
          tone: warning
      edges:
        - from: n1
          to: n3
          label: supports
        - from: n2
          to: n7
          label: constrains
        - from: n3
          to: n7
          label: offsets
        - from: n4
          to: n7
          label: constrains
        - from: n5
          to: n7
          label: constrains
        - from: n6
          to: n7
          label: frames-range
    approximationNotes: This is a conceptual synthesis of the chapter's evidence chain, not a quantitative model.
    claimRefs:
      - CV005
      - CV012
      - CV031
      - CV032
      - CV036
      - CV040
      - CV045
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: standard
    summary: >-
      Illustrative valuation anchors using direct private marks, current tracker values, and public/peer comparables
      rather than a DCF.
    data:
      items:
        - label: Late-May 2026 Yahoo/Forge estimate
          value: 2470
          unit: $M equity value
        - label: June 2025 round post-money
          value: 2900
          unit: $M equity value
        - label: Base-case re-entry zone midpoint
          value: 3500
          unit: $M equity value
        - label: Helion disclosed valuation
          value: 5400
          unit: $M equity value
        - label: Pending merger headline
          value: 6000
          unit: $M+ headline value
        - label: Oklo public market cap
          value: 11800
          unit: $M market cap
    approximationNotes: >-
      Bars mix private post-money marks, public market caps, and a scenario midpoint to show order-of-magnitude
      sensitivity only. They are not like-for-like enterprise values.
    claimRefs:
      - CV003
      - CV002
      - CV018
      - CV026
      - CV040
      - CV041
  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: standard
    summary: Scenario ranges express the fair-value debate as probabilities and milestones, not as a precise forecast.
    data:
      items:
        - label: Bear
          low: 1500
          mid: 2000
          high: 2500
          unit: $M equity value
        - label: Base
          low: 3000
          mid: 3500
          high: 4000
          unit: $M equity value
        - label: Bull
          low: 5000
          mid: 5750
          high: 6500
          unit: $M equity value
        - label: Announced price
          low: 6000
          mid: 6000
          high: 6000
          unit: $M+ headline value
    approximationNotes: >-
      Bear assumes merger failure or stressed recapitalization; base anchors to recent private marks plus modest
      milestone uplift; bull assumes merger close plus new site, financing, and commercialization proof. Preference
      waterfall is not modeled and could lower realized equity returns.
    claimRefs:
      - CV029
      - CV040
      - CV041
      - CV042
      - CV043
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring across proof, valuation, disclosure, and downside protection.
    data:
      items:
        - label: Technical proof
          value: 7/10
          note: Credible science progress and repeat sponsor support, but still pre-breakeven.
        - label: Commercial proof
          value: 4/10
          note: No disclosed offtake or plant economics comparable to Helion/CFS public proof.
        - label: Capital access
          value: 8/10
          note: Merger and marquee backers create financing optionality.
        - label: Valuation fairness
          value: 3/10
          note: Open-market private marks are far below the announced price.
        - label: Disclosure quality
          value: 4/10
          note: Headline terms are public; cap table, economics, and filing pack are not.
        - label: Dilution protection
          value: 3/10
          note: Twelve-plus rounds and opaque preferences create overhang risk.
        - label: Exit readiness
          value: 4/10
          note: Liquidity path exists, but public-company diligence package is incomplete.
    approximationNotes: >-
      Scores are author judgments on a 1-10 scale anchored to disclosed evidence; higher is better. The composite
      implication is Track the company but Avoid the announced price.
    claimRefs:
      - CV005
      - CV031
      - CV036
      - CV040
      - CV044
      - CV045
