      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Merger slippage
        - Filing or approval path materially delays beyond management expectation
        - Removes public-capital shortcut and weakens bull-case funding logic
        - Move directly toward bear-case underwriting
      - - Another pre-plant equity raise
        - New capital needed before Da Vinci economics are disclosed
        - Signals that current financing is insufficient and increases dilution overhang
        - Assume valuation moves toward or below recent private marks
      - - No plant-economics disclosure
        - Still no credible capex, output, or offtake frame at next diligence cycle
        - Prevents any upgrade from science thesis to investable infrastructure thesis
        - Maintain avoid stance even if headline price holds
      - - Peer milestone gap widens
        - Helion/CFS continue to add disclosed offtake, construction, or engineering wins while TAE does not
        - Makes comparative premium harder to justify
        - Tighten base-case range downward
      - - Public multiple compression
        - Listed nuclear/fusion analogs de-rate materially from current levels
        - Removes the optimistic public-envelope argument for TAE
        - Use NuScale-style downside rather than Oklo-style upside as the public comp anchor
    notes: >-
      Triggers are monitorable events that would invalidate the current watchlist thesis or justify a stricter downside
