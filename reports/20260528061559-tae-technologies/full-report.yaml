  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The fusion energy competitive landscape spans five categories: (1) direct private-sector fusion peers
              pursuing plasma confinement or compression approaches for electricity generation; (2) government fusion
              programmes such as ITER and the DOE Milestone-Based Fusion Development Program participants; (3) advanced
              fission alternatives — primarily small modular reactors (SMRs) — that target the same utility and
              hyperscaler buyers; (4) renewable-plus-storage solutions that partially substitute for firm power; and (5)
              TAE's own BNCT subsidiary, TAE Life Sciences, which competes in a distinct medical market but absorbs
              executive bandwidth and capital allocation attention.


              Among direct peers, Commonwealth Fusion Systems (CFS) and Helion Energy have raised the most capital and
              achieved the most visible milestones. CFS's SPARC tokamak is under construction in Devens, MA with a
              target Q>1 demonstration in 2027; its ARC power plant design targets commercial operation in the early
              2030s. Helion has signed the world's first fusion PPA with Microsoft, broken ground on its Orion facility
              in Malaga, WA, and received construction permits in 2026. Both companies use D-T or D-He3 fuel, which
              produces neutrons and requires tritium — a supply-chain and regulatory complexity TAE's p-B11 approach
              avoids. General Fusion (Canada) operates LM26, the world's first Magnetized Target Fusion (MTF)
              demonstration machine, targeting Lawson milestones by mid-2028 and announced a plan to go public via SPAC
              in early 2026. Tokamak Energy (UK, $335M raised) commercializes its spherical tokamak plus HTS magnet
              subsidiary (TE Magnetics). Zap Energy uses a sheared-flow-stabilized Z-pinch with no magnets and received
              DOE preconceptual design approval for a 50 MW pilot plant in May 2026.


              SMR substitutes, tracked by the NEA SMR Dashboard, include NuScale, Kairos Power, X-energy, and dozens of
              others. Many target the same utility and data-center buyer segments as fusion and could secure 10-year
              PPAs before fusion is commercial. The BCG 2026 analysis estimates a potential 50–80 GW US capacity
              shortfall by 2030, creating urgency that favors any near-term firm clean power technology over fusion
              approaches with 7-plus-year timelines.
