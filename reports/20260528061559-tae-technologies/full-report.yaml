      - number: '5.3'
        title: Roadmap, deployment dependencies, and commercialization path
        blocks:
          - type: paragraph
            body: >-
              Norm's strongest commercial implication is that it changed TAE's own roadmap. The company now argues that
              NBI-only FRC formation removed the need for the planned Copernicus machine and lets it move directly
              toward Da Vinci. That reduces one intermediate science stage, but it does not collapse the rest of the
              deployment burden. TAE's public siting record shows that first-plant execution now depends on transmission
              access, land, workforce, transportation, incentives, and regulatory approvals. The company targets an
