      - number: '2.3'
        title: 'Buyer, user, and payer segmentation: utilities and large-load developers are the economic gatekeepers'
        blocks:
          - type: paragraph
            body: >-
              The buyer map matters because TAE is selling into infrastructure markets where the person who needs the
              energy is not always the party that buys or finances the asset. In utility-scale power, the economic buyer
              is most likely a utility, independent power producer, or large-load developer seeking dependable
              low-carbon capacity. The operational user is the grid or the large facility that needs power, while the
              payer is ultimately a combination of contracted offtakers, utility capital plans, or rate-base-backed
              customers. In data-center-linked deployments, hyperscalers are often better understood as anchor offtakers
              or co-development partners than as simple end-users: they may sign PPAs, back behind-the-meter generation,
              or steer site selection, but they still depend on a broader financing and permitting stack.


              Industrial heat has a different buying center. The likely buyer is the industrial plant owner or energy
              manager; the user is plant operations and process engineering; the payer is the capex budget, a
              project-finance structure, or in some cases a heat-as-a-service counterparty supported by incentives. That
              makes adoption much more sensitive to retrofit downtime, process compatibility, and local power pricing
              than the headline size of industrial emissions would imply.


              Adjacent accelerator markets break away even further. Hospitals, oncology centers, public laboratories,
              and security-related agencies do not buy power plants; they buy specialized equipment with clinical,
              research, or industrial workflows attached. That is why the accelerator and medical businesses are
              strategically relevant but analytically separate. They can prove manufacturing capability, create earlier
              revenue, and widen strategic partnerships, yet they do not resolve the core market question for TAE's
              valuation: whether the company can sell firm clean power and eventually clean industrial energy at a
              competitive cost and a commercially relevant scale.
