  - - Remaining pilot-plant need
    - $700M median / $77B aggregate stated need
    - 2025 survey
    - FIA
    - Highlights why first-plant deployment remains finance-constrained
    - Aggregate need overstates what surviving leaders will actually require
  - - Commercialization confidence
    - 84% expect grid power before end-2030s; 53% by 2035
    - 2025 survey
    - FIA
    - Supports the idea that early-2030s power markets are the relevant horizon
    - Self-reported optimism from fusion developers
  - - Public technology support
    - $135M new ARPA-E commitment over 18 months
    - Announced Apr 2026
    - ARPA-E
    - Government still sees value in moving fusion from science to commercialization
    - Program support does not eliminate project-level execution risk
  - - Regulatory direction
    - Risk-informed byproduct-material framework rather than fission reactor licensing
    - 2025-2026
    - NRC / ADVANCE Act / JD Supra summary
    - Improves the odds that first commercial machines face a lighter licensing path than fission plants
    - Waste, tritium, environmental review, and state-federal coordination remain unresolved in practice
  notes: Capital and policy signals support market relevance, but they also show how much financing and execution still sit between technical progress and repeated commercial deployment.
