- id: TM005
  title: Growth drivers and constraints table
  columns:
  - factor
  - type
  - timing
  - implication for TAE
  - diligence ask
  rows:
  - - AI-driven data-center load growth
    - driver
    - Now through 2030
    - Creates demand pull for firm low-carbon supply that could support first-of-a-kind projects
    - Which hyperscalers or developers are realistic early anchor offtakers?
  - - Transmission and interconnection bottlenecks
    - constraint
    - Immediate
    - Can slow project siting and commercialization even if demand exists
    - What interconnection timeline and upgrade cost assumptions sit behind TAE's first-plant plans?
  - - Fusion-sector capital formation
    - driver
    - 2025-2026
    - Improves strategic legitimacy and partner availability
    - How much capital must TAE still raise before a commercial plant is financeable?
  - - Remaining pilot-plant capital need
    - constraint
    - Pre-first plant
    - Shows why adoption may lag demand pull
    - What is TAE's plant-level capex and contingency budget?
  - - DOE, ARPA-E, and NRC policy momentum
    - driver
    - 2025-2026
    - Reduces regulatory ambiguity and improves access to demonstration support
    - Which public programs can TAE realistically tap and on what schedule?
  - - Competing near-term firm-power options
    - constraint
    - Now through 2030
    - Fusion must compete against gas+CCUS, advanced nuclear, geothermal, storage, and demand flexibility for the same buyer budgets
    - Where can TAE credibly win on cost, speed, or emissions versus alternatives?
  - - Industrial heat decarbonization pressure
    - driver
    - Structural / long duration
    - Creates a second large problem set beyond grid power
    - Which sectors and temperature bands fit TAE's eventual product most closely?
  - - Industrial retrofit complexity
    - constraint
    - Project-specific
    - Raises switching costs and slows adoption in process industries
    - What balance-of-plant configuration would TAE need to serve heat loads, not just electricity?
  - - Adjacent accelerator commercialization
    - driver
    - Near term relative to fusion
    - Could create earlier revenue and manufacturing proof points
    - How large are those adjacent revenues and do they improve power-plant readiness?
  - - Lack of disclosed customer pipeline and plant economics
    - constraint
    - Current
    - Prevents precise SAM/SOM and forces a lens-based market view
    - Request signed offtakes, LCOE assumptions, and target-customer disclosures
  notes: Driver and constraint rows combine market signals with execution realities; this is a valuation-relevant adoption table, not a generic industry SWOT.
