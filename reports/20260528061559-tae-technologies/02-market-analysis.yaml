tables:
- id: TM001
  title: Market definition table
  columns:
  - segment
  - included spend / use case
  - excluded or substitute spend
  - buyer-user-payer
  - relevance to TAE
  rows:
  - - Utility-scale firm clean power
    - Generation capacity for grid-delivered, dispatchable, low-carbon electricity
    - Retail power sales, consumer devices, generic renewable capacity not aimed at firm delivery
    - 'Buyer: utility/IPP/load developer; user: grid or large load; payer: contracted offtakers / rate base / project finance'
    - Primary served market and valuation anchor
  - - Data-center-anchored firm power
    - Power procurement tied to hyperscale or colocation campuses needing reliable 24/7 electricity
    - Commodity cloud spend, generic IT capex, diesel backup-only systems
    - 'Buyer: developer / utility / generation partner; user: data-center operator; payer: hyperscaler procurement and energy budgets'
    - Demand catalyst and likely early anchor-offtake path
  - - Industrial heat decarbonization
    - Energy supply for carbon-intensive industrial sites where dependable clean energy can displace fossil heat inputs
    - General industrial equipment spend or low-value energy-efficiency projects with no power or heat dependence
    - 'Buyer: plant owner / energy manager; user: process operations; payer: capex budget, incentives, or service contract'
    - Secondary served market once technical fit and economics are proven
  - - Accelerator-based medical systems
    - Hospital and oncology demand for accelerator-based neutron systems such as BNCT platforms
    - Utility-scale power generation or broad medtech categories unrelated to accelerator systems
    - 'Buyer: hospital / cancer center; user: clinicians and researchers; payer: health-system capex and reimbursement-backed programs'
    - Adjacent market using shared accelerator know-how, not the core power TAM
  - - Other accelerator / industrial applications
    - Food safety, homeland security, and research uses of particle-accelerator and neutral-beam technology
    - General industrial automation or unrelated security software
    - 'Buyer: government lab / agency / industrial operator; user: technical teams; payer: public procurement or industrial capex'
    - Optional adjacency that can monetize technology before grid-scale fusion
  notes: Boundary table distinguishes the core firm-power and industrial-heat market from accelerator adjacencies that share technology but not the same budgets or buyers.
