  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: plant economics and bankability
    missingEvidence: TAE has not publicly disclosed first-plant capex, plant-level LCOE assumptions, or the operating assumptions needed to compare fusion power with gas, advanced nuclear, geothermal, or industrial heat alternatives.
    whyItMatters: Without plant economics, the chapter can identify demand pull but cannot convert it into a defensible serviceable market or bankable adoption curve.
    diligencePath: Request TAE's plant economics deck, capital stack, contingency assumptions, and scenario comparisons against competing firm-power options.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: customer and offtake pipeline
    missingEvidence: No public disclosure names anchor utilities, hyperscalers, industrial heat customers, or signed offtakes for TAE's first plant.
    whyItMatters: The buyer map is clear in theory, but underwriting the served market requires evidence that any of those buyers are moving from curiosity to contractual demand.
    diligencePath: Request pipeline detail by segment, stage, geography, and commercial structure, including any exclusivity or contingent site agreements.
    relatedQuestionRefs:
    - QM005
    - QM024
    - QM025
  - type: missing-source
    severity: material
    topic: adjacent-market revenue significance
    missingEvidence: Public sources describe BNCT and accelerator adjacencies but do not quantify expected revenue contribution, margin profile, or timing relative to fusion power commercialization.
    whyItMatters: Adjacencies can matter strategically, but without revenue timing and scale they should not be used to dilute first-plant power risk in valuation.
    diligencePath: Request subsidiary-level revenue outlook, backlog, capital intensity, and transferability of manufacturing capabilities back into the fusion business.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: site-specific interconnection and permitting exposure
    missingEvidence: TAE has disclosed state-level site screening criteria but not interconnection queue position, upgrade costs, permitting path, or transmission studies for any candidate site.
    whyItMatters: The chapter's strongest negative evidence is about deliverability and transmission bottlenecks; without site-specific data, schedule risk remains impossible to underwrite precisely.
    diligencePath: Request candidate-site comparison tables, transmission studies, utility correspondence, and permitting workplans for the first plant.
    relatedQuestionRefs:
    - QM010
    - QM011
    - QM024
    relatedTableRefs:
    - TM005
