evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: exact headcount and organizational structure
    missingEvidence: >-
      The December 2025 merger announcement states >400 employees and 62 PhDs; PitchBook estimates ~600. No public
      source provides a current, reconciled employee count by function or seniority level.
    whyItMatters: >-
      Headcount by function is critical for assessing burn rate, operational scale, and research capacity claims. The
      discrepancy is material for any financial underwriting.
    diligencePath: >-
      Request current headcount by function and location from the company, reconciled with the merger proxy statement
      when filed.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: S-4 filing and merger closing timeline
    missingEvidence: >-
      As of May 28, 2026, neither TAE nor TMTG has publicly disclosed a timeline for filing the S-4 registration
      statement or a target merger closing date.
    whyItMatters: >-
      The merger closing timeline determines when TAE becomes publicly traded, when remaining cash consideration is
      released, and when investor liquidity events occur.
    diligencePath: Monitor TMTG SEC filings on EDGAR; request merger timeline directly from company or IR contact.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: full cap table and round-by-round funding history
    missingEvidence: >-
      TAE has not published a complete round-by-round funding history with dates, sizes, valuations, lead investors, and
      governance rights. PitchBook data is the only public proxy but is incomplete and unverified by the company.
    whyItMatters: >-
      Without the full cap table, it is impossible to assess investor preference stacks, pro-rata rights, anti-dilution
      provisions, or the true dilution experienced by founders and employees.
    diligencePath: >-
      Request audited cap table, investor rights agreements, and preference waterfall from the company data room;
      cross-reference with TMTG merger proxy when filed.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: commercial plant site selection decision
    missingEvidence: >-
      TAE announced the site evaluation tour covering Alabama, Ohio, and Texas in April-May 2026 but has not publicly
      announced a site selection decision as of May 28, 2026.
    whyItMatters: >-
      Site selection will determine permitting jurisdiction, local incentive package, grid connection economics, and
      community engagement requirements for the first commercial plant.
    diligencePath: >-
      Monitor TAE press releases and TMTG merger proxy for site selection announcement; request site evaluation criteria
      and decision framework from company.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: plant economics and bankability
    missingEvidence: >-
      TAE has not publicly disclosed first-plant capex, plant-level LCOE assumptions, or the operating assumptions
      needed to compare fusion power with gas, advanced nuclear, geothermal, or industrial heat alternatives.
    whyItMatters: >-
      Without plant economics, the chapter can identify demand pull but cannot convert it into a defensible serviceable
      market or bankable adoption curve.
    diligencePath: >-
      Request TAE's plant economics deck, capital stack, contingency assumptions, and scenario comparisons against
      competing firm-power options.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: customer and offtake pipeline
    missingEvidence: >-
      No public disclosure names anchor utilities, hyperscalers, industrial heat customers, or signed offtakes for TAE's
      first plant.
    whyItMatters: >-
      The buyer map is clear in theory, but underwriting the served market requires evidence that any of those buyers
      are moving from curiosity to contractual demand.
    diligencePath: >-
      Request pipeline detail by segment, stage, geography, and commercial structure, including any exclusivity or
      contingent site agreements.
    relatedQuestionRefs:
      - QM005
      - QM024
      - QM025
  - type: missing-source
    severity: material
    topic: adjacent-market revenue significance
    missingEvidence: >-
      Public sources describe BNCT and accelerator adjacencies but do not quantify expected revenue contribution, margin
      profile, or timing relative to fusion power commercialization.
    whyItMatters: >-
