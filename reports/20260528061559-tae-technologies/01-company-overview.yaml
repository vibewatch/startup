  - id: section-funding-and-capitalization
    title: Funding history, capitalization, and investor syndicate
    body: >
      TAE has raised more than $1.3 billion in equity capital across eleven or more rounds since
      1998, making it one of the most heavily capitalized private fusion companies globally. The
      company has not published a full round-by-round table in public materials, but individual
      rounds have been announced through press releases and reported by financial media.


      The most recent disclosed round is a $150 million Series G closed in June 2025, co-led
      by Google and Chevron Technology Ventures, with NEA also participating. Google and Chevron
      are described as co-leads; Google's participation spans both financial and strategic
      interest in clean energy sources for its data center portfolio. The round was covered by
      Data Center Dynamics, ESG News, NEI Magazine, MLQ.ai, GlobalCarbonFund, and other outlets,
      all citing the same press release figures.


      Prior investor disclosures have identified Goldman Sachs, Sumitomo Corporation, Wellcome
      Trust, Addison Fischer, Charles Schwab, and the Samberg Family Foundation as having
      participated in earlier rounds. PitchBook's profile, which is the primary analyst data
      source for TAE's funding history, estimated TAE's pre-merger valuation at approximately
      $2 billion, implying investors who participated at earlier rounds may be near breakeven on
      paper returns. This context is relevant to understanding merger motivations: the TMTG
      all-stock deal at a stated enterprise value exceeding $6 billion would, if completed,
      represent a material step-up from the PitchBook estimate and provide earlier investors a
      liquidity path through the public market.


      Under the merger agreement announced December 18, 2025, TMTG agreed to provide $300
      million in cash to TAE: $200 million at signing and an additional $100 million upon filing
      of the S-4 registration statement. As of May 2026, TAE has confirmed receipt of the $200
      million signing cash; the S-4 has not been filed and the merger has not closed.
