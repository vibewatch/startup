company:
  name: TAE Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    TAE Technologies is a private California-based fusion energy company founded in 1998 as Tri Alpha
    Energy at UC Irvine, pursuing aneutronic hydrogen-boron (p-B11) fusion via a beam-driven
    field-reversed configuration (FRC). Having raised more than $1.3 billion across eleven-plus
    rounds—including a $150 million Series G in June 2025 backed by Google and Chevron Technology
    Ventures—TAE demonstrated a breakthrough NBI-only plasma formation in its Norm device in November
    2025 that shortened its commercialization roadmap by eliminating the need for the planned Copernicus
    machine. In December 2025, TAE announced a merger with Trump Media and Technology Group in an
    all-stock transaction valued at more than $6 billion that would make it one of the first publicly
    traded fusion companies; as of May 2026 the merger remained pending, the $200 million signing cash
    had been received, and the S-4 registration statement had not been filed.
sections:
  - id: section-identity-and-technology
    title: Identity, technology approach, and machine history
    body: >
      TAE Technologies (legally TAE Technologies Inc.) was incorporated in 1998 as Tri Alpha Energy,
      drawing its scientific foundations from research conducted at the University of California, Irvine
      by co-founders Norman Rostoker, a theoretical physicist and professor in UCI's Department of
      Physics and Astronomy, and Michl Binderbauer, an engineer and PhD student at UCI. The company
      rebranded to TAE Technologies around 2015 to reflect the broadened scope of its neutral-beam
      injection technology. TAE is headquartered in Foothill Ranch, California, in Orange County, and
      as of December 2025 employed more than 400 people including 62 PhDs. The company has filed more
      than 1,600 patents worldwide.


      TAE's core technical bet is aneutronic hydrogen-boron (p-B11) fusion using a beam-driven
      field-reversed configuration. A field-reversed configuration is a type of compact toroidal plasma
      in which the plasma's own currents reverse the external magnetic field inside the device. TAE adds
      high-energy neutral beams that both heat the plasma and provide non-inductive current drive,
      stabilizing the FRC. The hydrogen-boron fuel cycle is distinct from the deuterium-tritium (D-T)
      approach used in ITER and most other fusion programs: p-B11 fusion releases almost no neutrons,
      eliminating the neutron-activation problem in the reactor structure and producing directly
      harvestable charged-particle energy. The tradeoff is demanding: p-B11 requires plasma temperatures
      in the billions of degrees Celsius, orders of magnitude higher than D-T fusion, and is widely
      regarded as one of the most technically difficult paths to commercial fusion.


      TAE has built five successive experimental devices since its founding. The first-generation C-2
      machine established the beam-driven FRC concept. C-2T and C-2U were iterative improvements. The
      fourth device, C-2W, commissioned in 2017 and named Norman after co-founder Norman Rostoker (who
      died in 2014), demonstrated sustained FRC plasmas at record temperatures for this approach. The
      fifth and current device, Norm, achieved a breakthrough in November 2025 by demonstrating
      neutral-beam-injection-only plasma formation: the device formed and sustained an FRC using only
      NBI, without relying on magnetized plasma guns, a simpler and cheaper architecture for a future
      power plant. This result, published in Nature Communications, allowed TAE to skip the previously
      planned sixth machine (Copernicus) and advance directly to engineering the Da Vinci device, its
      commercial-prototype-scale machine.
