callouts:
  - calloutType: strength
    title: Norm breakthrough shortens commercialization path
    body: >-
      The November 2025 demonstration of NBI-only FRC plasma formation in the Norm device allowed
      TAE to skip the previously planned Copernicus machine, eliminating a multi-year development
      step, reducing projected plant complexity, and accelerating the path to the Da Vinci commercial
      prototype. This is a material, independently published scientific milestone.
    claimRefs:
      - CO009
      - CO010
      - CO037
  - calloutType: risk
    title: Pre-breakeven public merger raises governance and credibility risks
    body: >-
      TAE is pursuing a public-market debut via SPAC-style merger with Trump Media before
      demonstrating scientific breakeven (Q > 1). Competing fusion companies have called TAE's
      "science solved" claim disingenuous. TechCrunch flagged going-public risk. Donald Trump Jr.
      on TMTG's board adds governance concentration concerns. These risks do not negate the
      scientific record but are central to any investment underwriting of the merged entity.
    claimRefs:
      - CO028
      - CO029
      - CO030
      - CO034
      - CO035
