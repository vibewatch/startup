  - id: section-milestones-and-trajectory
    title: Milestones, partnerships, and forward trajectory
    body: >
      TAE's public milestone record runs from a 1998 research founding through multiple plasma
      performance achievements to a 2025 scientific breakthrough and a 2025-2026 commercialization
      push that includes a pending public market transaction, a UK joint venture, and a U.S.
      commercial plant site evaluation.


      Key scientific milestones include progressively higher FRC plasma temperatures and stability
      durations across the C-2, C-2T, C-2U, Norman, and Norm machines. The November 2025 Norm
      breakthrough, published in Nature Communications, eliminated the need for a sixth experimental
      machine and directly enables the Da Vinci device. TAE has stated that Da Vinci will target
      thermonuclear conditions necessary for net energy gain; no public source provides a completion
      date or detailed engineering specifications for Da Vinci.


      In December 2025, TAE and UKAEA (UK Atomic Energy Authority) announced a joint venture,
      TAE Beam UK, to be headquartered at the Culham Campus in Oxfordshire, UK. TAE Beam UK will
      focus on commercializing TAE's neutral beam injection technology for medical and industrial
      applications—businesses separate from energy generation—while also providing a UK regulatory
      and research pathway for fusion activities. As of May 2026, TAE Beam UK had entered the next
      phase of commercialization and was fully established at Culham.


      The U.S. Department of Energy awarded TAE a 2025 INFUSE (Innovation Network for Fusion Energy
      Sciences) award for plasma simulation work in collaboration with Lawrence Berkeley National
      Laboratory, part of the DOE's $134 million INFUSE and FIRE collaborative awards to the U.S.
      fusion industry. In February 2026, TAE published joint research with Japan's National Institute
      for Fusion Science in the peer-reviewed journal Nuclear Fusion.


      In April and May 2026, TAE completed a multi-state site evaluation tour covering Alabama, Ohio,
      and Texas for its planned first commercial plant targeting 50 MWe output. No site selection
      decision has been publicly announced.


      The December 2025 merger announcement with TMTG was met with concern from competing fusion
      startups and financial press. Zap Energy publicly characterized TAE's claim that the science
      "has been solved" as disingenuous. TechCrunch reported in April 2026 that a pre-breakeven SPAC
      merger raises credibility and governance risks for a frontier science company. Donald Trump Jr.
      on TMTG's board adds governance concentration concerns raised by financial analysts. These
      adverse signals do not negate TAE's scientific record but are material to any assessment of
      its public-market transition risk.
