  - id: section-leadership-and-governance
    title: Leadership, governance, and key-person map
    body: >
      Michl Binderbauer has served as CEO since co-founder Norman Rostoker's death in 2014.
      Binderbauer is the public face of TAE's science program and investor relations and is the
      central key-person risk for the company's execution. Toshiki Tajima, TAE's Chief Science
      Officer, is a physicist credited with inventing laser wakefield acceleration and brings
      deep plasma physics credibility. Cedric Burgher was named Chief Financial Officer in
      February 2026, adding capital-markets and public-company readiness expertise immediately
      ahead of the TMTG merger process; prior to TAE, Burgher had CFO experience at publicly
      traded energy companies.


      TAE's commercial leadership reflects an intentional buildout ahead of plant construction.
      Liz Toretta serves as Chief Revenue Officer and Dale McNiel as Chief Growth Officer, roles
      not typical in an early-stage research company but consistent with TAE's claims of moving
      into a commercialization phase. Sergei Putvinski, Senior Vice President of Fusion, leads
      the core physics program.


      The company's board includes Dick Kramlich (co-founder and general partner of NEA, TAE's
      lead institutional investor across multiple rounds), Dale Klein (former chairman of the
      U.S. Nuclear Regulatory Commission), Ernest Moniz (former U.S. Secretary of Energy under
      President Obama), and Michael Schwab (Big Sky Capital). The presence of Klein and Moniz
      adds regulatory and policy credibility but does not substitute for independent scientific
      peer review of plasma performance claims. TAE has not published a full governance charter
      or board committee structure in public materials.
