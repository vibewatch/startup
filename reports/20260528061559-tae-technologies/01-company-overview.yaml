  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: exact headcount and organizational structure
      missingEvidence: >-
        The December 2025 merger announcement states >400 employees and 62 PhDs; PitchBook estimates
        ~600. No public source provides a current, reconciled employee count by function or seniority
        level.
      whyItMatters: >-
        Headcount by function is critical for assessing burn rate, operational scale, and research
        capacity claims. The discrepancy is material for any financial underwriting.
      diligencePath: >-
        Request current headcount by function and location from the company, reconciled with the
        merger proxy statement when filed.
      relatedQuestionRefs:
        - QO006
    - type: missing-source
      severity: material
      topic: S-4 filing and merger closing timeline
      missingEvidence: >-
        As of May 28, 2026, neither TAE nor TMTG has publicly disclosed a timeline for filing the S-4
        registration statement or a target merger closing date.
      whyItMatters: >-
        The merger closing timeline determines when TAE becomes publicly traded, when remaining cash
        consideration is released, and when investor liquidity events occur.
      diligencePath: >-
        Monitor TMTG SEC filings on EDGAR; request merger timeline directly from company or IR contact.
