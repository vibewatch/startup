    severity: moderate
    topic: >-
      Co-founder identity — Tony Kovanen and Naoyuki Kanezawa credited in some sources as co-founders; not confirmed in
      official materials
    missingEvidence: Official Vercel communications credit Guillermo Rauch as the founder; co-founder identities ambiguous.
    whyItMatters: Cap table and founder equity structure affects dilution analysis and key-person risk assessment.
    diligencePath: Review Delaware incorporation filings and confirm co-founder equity structure directly with company.
    relatedQuestionRefs:
