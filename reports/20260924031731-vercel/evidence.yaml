  - type: private-evidence-only
    severity: major
    topic: Profitability and unit economics — gross margin, EBITDA, and net income not publicly disclosed
    missingEvidence: >-
      Vercel has not disclosed gross margin, EBITDA, or path to profitability; all financial data is third-party
      reported.
    whyItMatters: Critical to validating $27x ARR multiple and IPO readiness; public investors will require full P&L.
    diligencePath: 'Request data room access: audited ARR, NRR cohort analysis, gross margin by product line, and burn/free cash flow.'
    relatedQuestionRefs:
