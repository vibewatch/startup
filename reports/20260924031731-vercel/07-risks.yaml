chapter:
  number: 7
  title: Risks
  summary: 'Vercel faces a multi-dimensional risk profile that is elevated relative to its peer group of developer infrastructure
    companies. The most significant risks fall into three categories: competitive displacement, operational security, and
    governance/community trust.


    On the competitive front, Cloudflare represents an existential threat: it owns its network infrastructure (vs. Vercel''s
    AWS-based model), achieves 8-15ms cold starts vs. Vercel''s 30-35ms, and is aggressively pricing to win developer market
    share with a generous free tier. AWS Amplify, as both Vercel''s infrastructure provider and a competing deployment service,
    creates a structural conflict. Next.js concentration risk — 52.9% of the meta-framework market — means any decline in
    React/Next.js adoption would disproportionately impact Vercel. Framework fragmentation (Astro, SvelteKit, Remix, and now
    Nuxt under Vercel''s stewardship) moderates this risk.


    Operationally, the April 2026 supply chain security breach (Context.ai/Lumma Stealer, $2M ransom) is the most concrete
    recent risk materialization. The attack exposed the growing attack surface from AI tool integrations, which will expand
    as v0 and AI SDK deepen third-party LLM dependencies. Pricing controversy-driven billing incidents ($96K bill shock in
    2024) create customer retention and reputational risk. IPO timing risk is a near-term consideration: market conditions,
    lock-up expiry, and unknown dual-class structure could affect public market access and valuation.


    The CEO/key person risk is notably elevated. Guillermo Rauch is the founder, brand, and technical voice of both Vercel
    and Next.js. The September 2025 political controversy (Netanyahu photo post) generated community backlash that could disrupt
    the organic developer adoption flywheel. EU AI Act implications for v0 (as a general-purpose AI system) represent emerging
    regulatory surface area. These risks collectively support a ''medium-high'' risk rating for Vercel at the current $9.3B
    valuation.'
