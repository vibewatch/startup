      - number: '1.2'
        title: 创始人、高管团队与公司治理
        blocks:
          - type: paragraph
            body: >
              Guillermo Rauch（1990 年出生于阿根廷 Lanús）是 Vercel 的创始人兼 CEO。作为自学成才的程序员，他在开发出 Socket.IO 与 Mongoose 之后，凭借
              O-1“杰出人才”签证在 18 岁移居旧金山。创立 ZEIT 之前，他曾先后创办 LearnBoost 与 Cloudup（后者于 2013 年由 Automattic 收购）。他在
              Socket.IO、Next.js 与 Mongoose 等项目的技术威望，使他成为全球最具影响力的 JavaScript 生态构建者之一。


              面向 AI 时代扩张所组建的高管团队（截至 2025 年）包括：CTO Malte Ubl、COO Jeanne Grosser（前 Stripe 首席商务官）、CFO Marten Abrahamsen、CPO
              Tom Occhino、CMO Keith Messick、产品高级副总裁 Aparna Sinha、CAO Werner Schwock 以及首席信息安全官 Talha
              Tariq。这支资深管理团队反映出公司有针对性地从 Stripe、HashiCorp、Capital One、IBM 等企业级基础设施领军企业吸纳人才。关键人风险高度集中于
              Rauch，其公众形象、开源号召力与社区人脉对 Vercel 的开发者优先品牌至关重要。


              董事会席位尚未完全公开；已知席位涵盖来自 CRV（Reid Christian）、GGV Capital（Glenn Solomon）的代表，以及共同领投 Series F 的 Accel 和 GIC
              代表。个人天使投资人包括 React 创作者 Jordan Walke、前 GitHub CEO Nat Friedman、Scale AI CEO Alexandr Wang 以及 JavaScript
              缔造者兼 Brave CEO Brendan Eich。
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO002
