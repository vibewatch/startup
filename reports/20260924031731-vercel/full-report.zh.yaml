  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场界定与业务边界
        blocks:
          - type: paragraph
            body: >
              Vercel 的主营阵地是前端优化型云应用平台（PaaS）细分赛道：面向基于 React、Next.js、Vue/Nuxt 等前沿框架构建的现代 Web 应用，提供云端部署、预览环境、全球
              CDN/边缘分发以及无服务器计算能力。该市场隶属于 2025 年达 $1.13T 的广义云计算生态，但在业务分析上清晰区别于通用 IaaS（AWS EC2、Azure
              虚拟机）、全栈后端计算（Heroku、Railway）以及传统托管服务。


              相邻市场品类对 TAM 建模具有重要参考意义：(1) Web 托管服务（2025 年 $137.7B，CAGR 12.25%）作为上游基础类别；(2) PaaS（2025 年
              $215B）作为核心管理归属范畴；(3) 边缘计算（2025 年 $21.4B，CAGR 28%）作为基础设施使能层；(4) 开发者工具（2025 年 $8.8B，CAGR
              16.2%）作为对标开发者支出预算的对照品类。由 AWS、Azure 与 Google Cloud 主导的全球 IaaS 市场（2024 年达 $171.8B）对 Vercel
              而言既是底层运行的基础成本要素，又构成潜在竞争压力——Vercel 虽构建在 AWS 底层之上，但在部署应用场景中与 AWS Amplify 正面交锋。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
