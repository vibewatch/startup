companyProfile:
  summary: >-
    Vercel 是开创并定义前端云（Frontend Cloud）赛道的领军企业，为现代 Web 开发提供部署基础设施、边缘计算、可观测性与 AI 工具链。创始人 Guillermo Rauch 亲手打造的 Next.js 赋予
    Vercel 结构性护城河。平台每周处理超 9M 次部署，覆盖免费开发者、Pro 团队与大型企业。AI 原生代码生成工具 v0 用户数已破 3.5M，正成为 AI 生成 Web 应用直接部署至 Vercel 的核心入口。2025
    年完成的 Series F 融资引入 GIC Singapore 作为战略投资方，估值达 $9.3B；管理层于 2026 年释放出冲刺 IPO 的明确信号。核心风险涵盖 Cloudflare 竞争施压、对 AWS
    底层基础设施依赖、CEO 个人声誉绑定过深的关键人风险，以及 2026 年 4 月暴露的安全事件。
  foundedDate: '2015-01-01'
  founders:
    - name: Guillermo Rauch
      role: CEO 兼联合创始人
      background: >
        阿根廷裔软件工程师与连续创业者；最主流 React 元框架 Next.js 的开创者；此前创立的 Cloudup 于 2013 年由 Automattic 收购。Rauch 在开发者社群中代表着 Vercel
        品牌形象，既是公司的首要竞争护城河，也是最核心的关键人风险所在。2025 年 9 月其公开合照（与 Netanyahu 会面）引发开发者社区强烈反弹。目前尚未公开披露接班人计划。
      claimRefs: []
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Vercel 平台：面向 Next.js、Nuxt、Astro、SvelteKit、Remix 等主流框架提供零配置部署体验。基础设施涵盖遍布全球 PoP 节点的 Edge Network、Vercel Functions
    无服务器计算，以及 Vercel KV、Blob、Postgres 存储体系，并配备 Web Analytics 与 Speed Insights 性能分析工具。Fluid Compute（2025 年推出）属于边缘原生
    Serverless 运行时。v0 提供 AI 代码生成交互界面，设 Pro 与 Enterprise 订阅层。AI SDK 为开源 TypeScript 工具库，用于集成 LLM。Turbopack、NuxtLabs 与
    Vercel Sandbox 共同完善整体技术栈。
  customerFocus: >
    划分三大客群：(1) 个人开发者与爱好者——免费层、Next.js 原生开发者与开源项目，构成病毒式获客引擎；(2) Pro 团队（$20/人/月）——SMB 研发团队、初创公司与代理机构，自免费层高频转化而来；(3)
    Enterprise 企业客户（定制报价）——财富 500 强及中型市场企业；按年签署合同；估算贡献约 40% 的 ARR。知名企业客户包括 Washington Post、Under
    Armour、Porsche、Replit、Loom、HashiCorp。各层级每周部署量合计超 9M 次。
  businessModel: >
    采用用量计费与订阅叠加的商业模式：Hobby（免费）→ Pro（$20/人/月）→ Enterprise（定制年度合同）。带宽、算力与存储等基础设施用量在订阅费之上额外计费。v0 叠加独立的订阅层（Pro 版
