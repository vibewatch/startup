              - CO004
      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Vercel 历经六轮主要融资累计筹集约 $863M，另有一笔 $300M 的老股要约收购。其融资轨迹呈现三个阶段：(1) 开发者平台验证期（Series A–B，2020 年，共计 $61M）；(2)
              高速扩张基础设施建设期（Series C–D，2021 年，共计 $252M）；(3) 面向 AI Cloud 的企业级转型期（Series E–F，2024–2025 年，共计 $550M）。


              2025 年 9 月完成的 Series F 融资（$300M，投后估值 $9.3B）由 Accel 与 GIC 联合领投——作为新加坡主权财富基金，GIC 为公司带来了全球业务多元化视野与企业级背书。新进投资方
              BlackRock、Khosla Ventures、General Catalyst、StepStone、Schroders 与 Adams Street Partners，与老股东 GV、Notable
              Capital、Salesforce Ventures 及 Tiger Global 一同参与。同期面向早期投资人与员工开展的约 $300M 老股要约收购，显示出公司在精细管理股权结构表并为 IPO
              前流动性做铺垫。核心个人天使投资人则兼具技术背书与网络效应双重价值。
            claimRefs:
              - CO001
              - CO002
