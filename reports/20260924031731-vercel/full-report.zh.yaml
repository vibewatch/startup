  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与核心基础设施
        blocks:
          - type: paragraph
            body: >-
              Vercel 打造的全栈前端云平台建立在三大核心架构层之上：(1) 与 Git 深度绑定的 CI/CD 自动化流水线，代码推送即可自动触发构建与打包；(2) 覆盖全球 100+ 边缘 PoP
              的边缘网络，承载静态资源分发、边缘函数及无服务器计算；(3) 专为 Next.js 定制的存储层（Blob、KV、Postgres），为现代 Web
              应用提供持久化状态支撑。整体部署流程实现全自动化：开发者将代码推送到 GitHub、GitLab 或 Bitbucket，Vercel Webhook
              瞬间触发构建，产出制品原子化分发至全球所有边缘节点，构建失败时支持秒级自动回滚。


              该平台最具突破性的底层架构创新当属 2025 年发布的 Fluid Compute。该项技术彻底改变了传统 Serverless 每次调用独立隔离的单容器模型，开创性地引入高并发共享实例机制。不同于 AWS
              Lambda 每次请求需单独冷启动容器，Fluid Compute 允许多个并发请求复用同一个已激活的热实例，极大消除了冷启动带来的延迟毛刺，并显著降低了单次调用的计算开销。这既解决了传统 Serverless
              最受诟病的冷启动延迟与账单不可控弊端，又完整保留了无服务器部署免运维的核心体验。


              Vercel 的基础设施目前运行于 AWS 之上，叠加了 Vercel 自研的软件抽象层。这表明 Vercel 本质上是构建在 AWS
              之上的增值服务层，在获得成熟全球稳定性的同时，也承担了底层云厂商的成本制约。依托全自建硬件网络的 Cloudflare Workers 可实现 8-15ms 的极速冷启动，相比之下 Vercel 原生冷启动在
              30-35ms 之间，而 Fluid Compute 正是以延长热实例存活有效填补了该性能代差。
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE001
