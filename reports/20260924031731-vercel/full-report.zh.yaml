chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、使命与商业模式
        blocks:
          - type: paragraph
            body: >
              Vercel 是一家总部位于加利福尼亚州旧金山的美国云应用公司，由 Guillermo Rauch 于 2015 年创立，最初命名为 ZEIT，后于 2020 年 4 月 21 日更名为
              Vercel。公司使命是“让全球团队交付卓越产品”——最初表述为将 Amazon、Google、Facebook 等科技巨头内部专属的前端部署基础设施普惠化。伴随技术演进，这一使命已拓展至涵盖“AI 云”（AI
              Cloud），即专门面向 AI 原生应用与 Agent 构建的云平台。


              Vercel 采用免费增值向企业级拓展的商业模式：个人免费 Hobby 层逐步转化为 Pro 层（$20/月）、面向协作团队的 Team 套餐，以及配备专属基础设施、SSO、高可用 SLA
              与直销支持的企业级合同。公司亦依托旗下 v0 这款 AI 工具（Teams 与 Enterprise 账户贡献 v0 收入占比已超 50%）以及 AI SDK 生态推进商业化变现。Next.js
              虽保持开源，却天然形成平台粘性：使用 Next.js 构建项目的团队往往倾向选择 Vercel 获取优化部署。这一从框架到云端的飞轮效应，构成 Vercel 市场开拓护城河的核心。
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO001
            claimRefs:
