      - number: '1.4'
        title: 业务规模、增长指标与核心 KPI
        blocks:
          - type: paragraph
            body: >
              Vercel 的 ARR 增长轨迹十分抢眼：从 2024 年初的 $100M，跃升至 2025 年年中的约 $200M，再到 2026 年 2 月达到 $340M 年化运行率——两年内实现约 3.4 倍的 ARR
              增长。公司在 Series F 完成时披露的营收同比增速达 82%。目前平台上约 30% 的部署源自 AI Agent 而非人类开发者——管理层预计这一结构性需求驱动力还将持续加速。截至 2025 年 9 月的
              12 个月内，Vercel 的用户规模实现翻倍。


              v0 独立用户数已达 3.5M，企业账户贡献了 v0 收入的 50% 以上——这款产品最初定位只是极客工具，如今已展现出扎实的商业化信号。AI SDK 周下载量达 3M；截至 2025 年 9 月的过去 12
              个月内，Next.js 累计下载量突破 500M。全职员工人数从 2025 年的约 550 人增至约 1,011 人（2026 年 3 月），表明在相对挑剔的宏观环境下公司仍在持续吸纳人才。Vercel
              尚未公开披露毛利率、EBITDA 或整体盈利状况。
            claimRefs:
              - CO001
              - CO002
      - number: '1.5'
        title: 关键里程碑与负面事件
        blocks:
          - type: paragraph
            body: >
              Vercel 的里程碑涵盖创立、融资、产品发布、战略收购以及重大负面事件。2021 年收购 Turborepo 确立了 Vercel 作为 Monorepo 首选构建平台的地位。2023 年推出 v0
              促使外界对其定位从托管服务商向 AI 开发者工具平台转变。2025 年 7 月收购 NuxtLabs 将其框架主导权延伸至 Vue/Nuxt，在 Next.js 之外实现多元化，展现出多框架并存的战略导向。


              2025 至 2026 年间发生两起重大负面事件：(1) CEO Guillermo Rauch 于 2025 年 9 月与以色列总理 Netanyahu
              会面，引发开发者社区强烈反弹，部分用户公开表示有意迁移；(2) 2026 年 4 月 19 日，Vercel 披露一起安全事件：攻击者经由第三方 AI 工具 Context.ai（关联 Lumma Stealer
              恶意软件）侵入员工 Google Workspace 账户获取权限，据称索要 $2M 赎金以换取失窃数据。截至 2026 年 5
              月，两起事件均未对其公开披露的营收增速构成实质性损害；但平台深度依赖开发者社区信任，两起风波都是持续存在的声誉隐患。
            claimRefs:
              - CO001
              - CO002
      - number: '1.6'
        title: 图表与要点透视
        blocks:
          - type: callout
            title: AI 时代基础设施转折点：$340M ARR、82% 增速、30% 来自 Agent 部署
            body: >
              Vercel 成功实现从 Jamstack 托管向 AI Cloud 平台的跃迁：2026 年 2 月达 $340M ARR 运行率，同比增速 82%，v0 拥有 3.5M 用户，AI SDK 周下载量达
              3M。平台 30% 的部署量已源自 AI Agent——管理层预计这一结构性需求驱动力还将持续加速。$9.3B 的 Series F 估值反映了这一关键转折，但毛利率与盈利指标仍属未披露的私募数据。
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
          - type: callout
            title: 2025–2026 年负面事件：声誉风波叠加安全事件
            body: >
              两起重大负面事件——CEO 与 Netanyahu 会面（2025 年 9 月，引发用户流失抵制言论）与 2026 年 4 月安全漏洞（泄露环境变量，据称面临 $2M 勒索要价）——截至 2026 年 5
              月尚未对营收产生显性损害，但对依赖开发者信任的平台而言构成长久声誉隐患。安全防御现已提至战略优先级（Talha Tariq 于 2025 年 10 月加盟出任首席安全官）。
            calloutType: insight
            claimRefs:
