      - number: '6.2'
        title: 采用轨迹与业务增长
        blocks:
          - type: paragraph
            body: >-
              Vercel 的采用增速在开发者基础设施领域位居前列。平台 ARR 从 2020 年的 $5M 增至 2026 年 2 月的 $340M 运行率，六年复合增长约 68 倍。Next.js 的普及（周下载量超
              9M）是核心获客渠道——采用 Next.js 的开发者自然将 Vercel 视作默认部署目标，形成了零 CAC 的线索生成引擎。


              拥有 3.5M 独立用户的 v0 开辟了第二条获客路径，既服务开发者，也吸引非技术背景的设计师用自然语言生成 UI 组件。Vercel
              的目标市场由此突破纯开发者边界，延伸至设计师、产品经理和业务人员——他们无需编写代码就能生成可部署代码。周下载量达 3M 的 AI SDK 则推动构建 AI 应用的开发者上云，这些开发者顺理成章地将流式界面部署在
              Vercel 基础设施上。


              PLG 漏斗运转机制十分清晰：Hobby 开发者在个人项目里体验到极简部署 → 团队成员共同采用 → 管理层采购 Teams 或 Enterprise 满足治理需求。这种自下而上的采用模式压低了自助付费层的
              CAC，并以极低获客成本沉淀出优质企业客户线索。Next.js 自然渗透、v0 用户增长与 AI 智能体部署叠加，构筑起复合提速的多层获客漏斗。
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
      - number: '6.3'
        title: 标杆客户验证与生产环境部署
        blocks:
          - type: paragraph
            body: >-
              从任何指标看，Vercel 的企业客户阵容都极具说服力。已确认在生产环境中部署的全球头部品牌包括：Walmart（下一代网店前端）、AT&T（可组合架构）、WPP（数字营销平台）、OpenAI（AI
              产品界面）、Anthropic（开发者文档）、Nike（电商）、Target（零售）、Hulu（流媒体）、PayPal（金融科技）、Under Armour（品牌电商）、HashiCorp（开发者文档）以及
              GitHub（产品官网）。


              这些项目并非试验性试点，而是已确认的生产环境落地，许多还写进了详细案例研究，披露了架构选型、技术指标与业务成效。Walmart 案例详述了基于 Next.js/Vercel
              重构下一代店面以提升性能的过程；AT&T 的可组合架构案例记录了部署周期的缩短。客户验证质量极高：知名企业品牌、多年持续部署、公开的技术架构细节，均表明客户对平台是深度绑定而非浅尝辄止。


              AI 公司客群（OpenAI、Anthropic）提供了极具价值的背书信号：开发底层 AI 并为 Vercel 旗下 v0 供能的公司，本身就是 Vercel 的客户。这催生了正向循环：针对 AI
              基础设施的投入，既能赋能 Vercel 客户，又直接反哺 Vercel 自身的产品研发。
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU003
