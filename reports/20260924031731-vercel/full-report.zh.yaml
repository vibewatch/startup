appendices:
  - id: A
    title: Vercel融资与估值历史
    blocks:
      - type: paragraph
        title: null
        body: >
          Vercel估值轨迹：$21M A轮（2019年）→ 处于ZIRP顶峰的$2.5B C轮（2021年）→ $2.5B D轮（2022年，平价）→ $9.3B
          F轮（2025年9月）。D轮平价反映了2022年SaaS行业的整体下行；从D轮到F轮的3.7倍跃升，既体现了ARR增长（从约$100M增至2024年的约$187M），也反映出开发者AI工具受投资者溢价追捧带来的估值倍数重新扩张。累计融资金额达$863M。$250M
          F轮融资可提供约12-24个月的资金跑道，具体取决于Fluid Compute、v0拓展以及国际企业销售方面的投入节奏。
        claimRefs: []
  - id: B
    title: Next.js与框架生态策略
    blocks:
      - type: paragraph
        title: null
        body: >
          Vercel主导框架生态的治理策略是其竞争护城河的主要源泉。由Guillermo
          Rauch创建并基于MIT许可的Next.js占据元框架市场52.9%的份额，是React企业级应用的默认选择。Vercel深度优化Next.js App Router与边缘部署，使其在Vercel
          Platform上展现最佳性能，实现了框架性能与平台营收的协同绑定。2025年对NuxtLabs的收购将这一策略扩展至Vue.js生态。Turbopack（基于Rust的构建工具）与AI SDK（GitHub
          Star超60K）进一步强化了开发者工具链的锁定效应。治理风险——即社区认为Vercel以牺牲自托管体验为代价专门针对自家平台优化Next.js——是当前需要重点监测的核心博弈点。
        claimRefs: []
  - id: C
    title: v0与AI平台期权价值
    blocks:
      - type: paragraph
        title: null
        body: >
          v0（2023年推出，2024年正式GA）是Vercel在核心部署平台之外最为重大的战略押注。该工具基于Vercel AI
          SDK调用Claude（Anthropic）与GPT-4（OpenAI），能根据自然语言提示词生成全栈Web应用代码。凭借3.5M注册用户以及与Vercel部署流程的深度集成，v0开辟出全新的漏斗顶端转化飞轮：AI生成代码
          → 代码部署至Vercel → 部署转化为付费客户。若v0在$20/月Pro层级实现3-5%的付费转化，当前对ARR的贡献约为$25-42M。到2027年达到$100-200M
          ARR的情景，需要持续的用户增长与转化率改善。2026年4月经由Context.ai发生的供应链安全漏洞事件，进一步凸显深度集成第三方AI工具的安全风险。
        claimRefs: []
