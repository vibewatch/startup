      whyItMatters: Category growth cannot be translated into Nearfield revenue potential or valuation support without a company-specific denominator and penetration assumption.
      diligencePath: Request management's bottom-up market model, product-level pricing, service attach assumptions, and target-account list under NDA.
      relatedQuestionRefs: [QM004, QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: adoption-constraints
      missingEvidence: Independent evidence on qualification duration, repeat-order conversion, customer concentration, and competitive displacement.
      whyItMatters: High-volume deployment and order announcements show traction but do not establish durable share or predictable revenue conversion.
      diligencePath: Obtain anonymized customer references, cohort/order history, backlog aging, and win-loss data from management and reference calls.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: minor
      topic: market-sizing
      missingEvidence: A consistent, methodology-disclosed time series for global metrology market size and growth.
      whyItMatters: The retained $10.3 billion and $15 billion estimates are endpoints without disclosed methodology and should not be treated as independently corroborated.
