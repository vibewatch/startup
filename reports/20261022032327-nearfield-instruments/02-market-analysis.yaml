company:
  name: Nearfield Instruments
chapter:
  number: 2
  title: Market Analysis
  summary: "Nearfield addresses a narrow but strategically important slice of semiconductor process control: in-line, non-destructive three-dimensional metrology for advanced logic, memory, and 3D integration. Public evidence supports strong structural demand and early commercial pull, but does not disclose a company-specific SAM, SOM, pricing, or repeat-order conversion rate."
sections:
  - id: market-boundary
    title: Market boundary and economic job
    body: >-
      The relevant market is semiconductor metrology and inspection used to control
      process dimensions, profiles, and yield during fabrication, with Nearfield
      focused on high-throughput, non-destructive three-dimensional measurements
      for advanced logic, memory, and 3D integration. The boundary excludes
      lithography equipment, deposition, etch, packaging machinery, and broad
      semiconductor revenue except where those adjacent processes create a
      measurement requirement. The buyer's economic job is not simply to obtain a
      microscope: it is to detect process variation early enough to protect yield
      and manufacturability without destroying scarce wafer samples. Public
      descriptions position QUADRA around high-aspect-ratio trenches, GAA
      structures, vias, and multilayer stacks, where conventional optical or
      electron-beam approaches can be insufficient, slow, or destructive.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses and limits
    body: >-
      The available sizing evidence supports a market-level view, not a validated
      Nearfield serviceable obtainable market. One 2026 industry article estimates
      chip metrology at roughly $10.3 billion in 2025 and $15 billion in 2031,
      implying a broad growth opportunity, while a 2024 industry release cites a
      projected $1 trillion global semiconductor industry by 2029. These figures
      are different populations and should not be combined into a conversion
      funnel: semiconductor revenue includes the entire chip industry, whereas
      metrology is a process-control equipment category. A private-company data
      source reports Nearfield's $1.6 billion Series D valuation, but that is a
      financing outcome rather than market size. No retained source isolates the
      portion of metrology that is addressable by Nearfield's product scope, the
      obtainable share, system ASP, or recurring service revenue.
    claimRefs: [CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption drivers, and constraints
    body: >-
      The primary buyer is an advanced semiconductor manufacturer, with process
      control, yield, and manufacturing engineering functions likely shaping the
      specification and fab operations owning deployment. The user is the
      metrology or process engineer; the economic payer is the fab organization
      whose budget is justified by yield, throughput, scrap avoidance, and
      qualification of new device architectures. Evidence of multiple system
      orders from a US customer, a full 2025 order schedule, and QUADRA
      integration in high-volume manufacturing indicates commercial pull rather
      than a laboratory-only use case. Drivers include smaller features, deeper
      trenches, 3D architectures, and demand for higher-performing, lower-energy
      chips. Constraints remain material: qualification cycles are long, incumbent
      trust is high, tool deployment is capital intensive, and the public record
      does not show customer concentration, pricing, backlog conversion, or the
      duration of repeat orders.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
callouts:
  - calloutType: strength
    title: Strategic bottleneck exposure
    body: Nearfield is positioned in a measurement step that becomes more important as advanced nodes add three-dimensional structures and tighter tolerances; disclosed high-volume-fab validation and customer orders are stronger adoption signals than a generic semiconductor TAM.
    claimRefs: [CM003, CM009, CM010]
  - calloutType: risk
    title: Sizing remains evidence-constrained
    body: Public sources support category growth but do not establish Nearfield's addressable share, pricing, service mix, or repeat-order economics; valuation therefore cannot be triangulated from a disclosed operating model.
    claimRefs: [CM006, CM007, CM014]
