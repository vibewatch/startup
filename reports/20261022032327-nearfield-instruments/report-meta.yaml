  topStrengths:
    - Technical product validation and deployment in high-volume semiconductor manufacturing.
    - Strategic relevance to advanced-node, 3D integration, and process-control requirements.
    - Strong financing access and disclosed support from major strategic and institutional investors.
    - Evidence of repeat orders and expanding regional customer support.
  topRisks:
    - Revenue, gross margin, cash burn, backlog, and installed-base metrics are not publicly disclosed.
    - The reported valuation is difficult to underwrite without a revenue denominator, cap table, and preference stack.
    - Customer concentration, repeat-order conversion, and production-scale execution remain incompletely evidenced.
    - Cleanroom, capacity, service, and working-capital expansion may require additional capital.
  unresolvedGaps:
    - Public sources do not disclose revenue, backlog, service mix, gross margin, burn, or installed-base count.
    - Board composition, ownership percentages, investor rights, preference stack, and facility terms remain private.
    - Public evidence is thin on customer concentration, export-approval history, and repeat-order conversion timing.
