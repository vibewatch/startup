companyProfile:
  summary: >-
    Nearfield Instruments is a privately held TNO spin-off developing high-throughput, non-destructive 3D metrology and
    inspection systems for advanced semiconductor manufacturing. Its QUADRA platform is positioned for logic, memory,
    and 3D integration applications, with public evidence of high-volume manufacturing deployment and customer orders.
    The company has expanded its financing, production, applications, and regional support footprint, while key
    operating and ownership metrics remain private.
