      - ["Cybersecurity failure during global customer support", "Medium", "High", "Investment mentioned, controls undisclosed", "Customer qualification or outage impact", "No public certification scope or incident history"]
    notes: "Likelihood and severity are analyst risk ratings tied to disclosed failure modes or planned mitigations; they are not company-reported probabilities."
