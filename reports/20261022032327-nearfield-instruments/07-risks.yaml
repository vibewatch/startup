company:
  name: Nearfield Instruments
chapter:
  number: 7
  title: Risks
  summary: Nearfield has meaningful technical and customer-validation signals, but its risk profile is dominated by scale-up execution, semiconductor-fab dependency, and limited public disclosure on financial resilience, concentration, and controls. The strongest public mitigation evidence is deployment and collaboration activity; the most important residual exposures remain unquantified.
sections:
  - id: risk-prioritization
    title: Risk prioritization
    body: >-
      Nearfield's principal risk is not whether its metrology proposition is technically differentiated, but whether a capital-intensive equipment company can convert validation into repeatable, high-volume delivery. Public reporting describes QUADRA as fully validated and deployed in high-volume manufacturing, while a separate account reports a fully booked 2025 order schedule, multiple orders from an existing client, and plans for larger cleanrooms. Those are positive signals, but they also increase execution exposure: production capacity, facility availability, energy access, automated testing, and customer support must scale together. The $380 million Series D and stated plans to expand production capacity provide financial and organizational support, but public sources do not disclose burn, backlog conversion, gross margin, warranty obligations, or liquidity runway. The risk register therefore ranks scale-up and concentration above technical novelty, with measurable diligence triggers rather than assuming that funding eliminates operating risk.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-technology
    title: Regulatory, legal, and technical exposure
    body: >-
      No assigned source establishes a current lawsuit, enforcement action, export-control violation, privacy incident, or product-safety recall. That is an evidence boundary, not proof that none exists. The available technical reporting does identify a concrete measurement limitation: AUDIRA depends on differences in material properties, and similar materials can reduce contrast; it also describes a tradeoff between measurement depth and resolution. Nearfield's collaboration with Imec is a credible mitigation pathway for next-generation process-development use cases, but it is not evidence of regulatory approval or commercial scale. The appropriate diligence path is to obtain the company's export-approval history, customer qualification records, product liability and warranty terms, cybersecurity controls, and any open or threatened legal matters directly from management and counsel.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: dependencies-and-financial-model
    title: Dependencies and financial-model risk
    body: >-
      Nearfield's operating model is exposed to a small set of difficult dependencies: advanced semiconductor customers, specialized cleanroom and energy infrastructure, a global support footprint, and continued access to capital while production ramps. The February 2025 customer-order release describes a US subsidiary established alongside multiple system orders from a US customer, which supports demand but also highlights geographic and account concentration. The 2026 funding disclosures describe a flexible financing facility from ING and large expansion commitments, yet neither the facility terms nor the percentage of revenue or backlog represented by any customer is public in the assigned evidence. A risk-aware investor should distinguish funding raised from cash available and treat the valuation as unable to absorb execution surprises until working-capital, service, order-conversion, and customer-concentration data are verified.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring, mitigations, and thesis breaks
    body: >-
      The most useful monitoring plan is operational and falsifiable. Nearfield should be asked to report quarterly capacity added, cleanroom and energy readiness, delivery and acceptance-cycle times, repeat orders by customer, field reliability, warranty or rework incidence, and cash conversion. Technical monitoring should track measurement performance by material stack, depth, and resolution rather than relying on aggregate claims. Commercial monitoring should separate development projects, pilots, high-volume deployments, and repeat production orders. Thesis-break conditions include a material delay to capacity expansion, a failed or rescinded customer qualification, recurring measurement failures in target structures, or financing terms that require materially more dilution or secured claims than the public record implies. Until those indicators are documented, the appropriate stance is research-more rather than treating strategic investor participation as a substitute for operating evidence.
    claimRefs: [CR014, CR015, CR016]

