callouts:
  - calloutType: risk
    title: Primary thesis break
    body: A material failure to convert customer validation and the Series D expansion plan into on-time, repeatable high-volume deliveries would undermine the investment case before public evidence can establish sufficient financial resilience.
    claimRefs: [CR003, CR004, CR012, CR015]
  - calloutType: insight
    title: Evidence boundary
    body: The assigned pool contains no regulator, court, certification, or incident record; legal and compliance risk therefore remains an evidence gap rather than a clean bill of health.
    claimRefs: [CR006, CR009, CR014]

