      - ["Advanced process-development access", "Imec", "Multi-year R&D deployment and joint development", "Strategic partner dependence", "Project milestones or technical priorities slip", "Medium", "QUADRA deployment at Imec's Leuven facility", "Medium; commercial conversion not established"]
      - ["Production finance", "ING", "Existing investor and reported flexible financing facility", "Terms undisclosed", "Covenants, collateral, or refinancing pressure", "High", "Series D capital and reported facility", "High until facility terms and liquidity are verified"]
      - ["Facilities and utilities", "Netherlands site and local infrastructure", "Cleanroom, office, energy, and automated-test capacity", "Geographically concentrated", "Space or energy constraint delays scale-up", "High", "Planned larger cleanrooms and infrastructure spending", "Medium-high; schedule and cost remain open"]
    notes: "Counterparty and concentration fields preserve the public record's limits: the named US customer is not identified, and financing terms are not disclosed."
    claimRefs: [CR003, CR010, CR012, CR013]

