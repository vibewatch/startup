evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Audited or management-reported revenue, gross margin, backlog, burn, runway, service mix, and installed-base data.
    whyItMatters: >-
      The Series D valuation cannot be assessed against operating scale or cash requirements from the public record
      alone.
    diligencePath: >-
      Request the latest management accounts, KPI pack, backlog aging, cash forecast, and installed-base bridge under
      NDA.
    relatedQuestionRefs:
      - QO006
      - QO009
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete leadership, supervisory board, ownership, and investor-rights schedule.
    whyItMatters: Founder dependence, control, dilution, and succession risk cannot be assessed from selected public names.
    diligencePath: >-
      Obtain the current organization chart, cap table, shareholder agreement summary, board roster, and succession
      plan.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Named customer count, concentration, repeat-order conversion, and system deployment schedule.
    whyItMatters: >-
      One unnamed US customer and reported high-volume-fab deployment do not establish commercial breadth or recurring
      demand.
    diligencePath: >-
      Request customer reference calls, anonymized order and acceptance schedules, installed-base counts, and renewal or
      repeat-order data.
    relatedQuestionRefs:
      - QO007
      - QO008
      - QO009
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: A reconciled funding ledger across currencies, tranches, and database classifications.
    whyItMatters: >-
      The secondary $596 million total and varied historical round labels may not be directly comparable to
      company-announced amounts.
    diligencePath: Reconcile signed financing documents and investor confirmations to a date- and currency-normalized capital ledger.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A product-level SAM/SOM model with system ASP, service mix, installed base, target-fab count, and geographic
      eligibility.
    whyItMatters: >-
      Category growth cannot be translated into Nearfield revenue potential or valuation support without a
      company-specific denominator and penetration assumption.
    diligencePath: >-
      Request management's bottom-up market model, product-level pricing, service attach assumptions, and target-account
      list under NDA.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent evidence on qualification duration, repeat-order conversion, customer concentration, and competitive
      displacement.
    whyItMatters: >-
      High-volume deployment and order announcements show traction but do not establish durable share or predictable
      revenue conversion.
    diligencePath: >-
      Obtain anonymized customer references, cohort/order history, backlog aging, and win-loss data from management and
      reference calls.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A consistent, methodology-disclosed time series for global metrology market size and growth.
    whyItMatters: >-
      The retained $10.3 billion and $15 billion estimates are endpoints without disclosed methodology and should not be
      treated as independently corroborated.
    diligencePath: Purchase or obtain the underlying analyst report and reconcile scope, geography, currency, and forecast basis.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-benchmark
    missingEvidence: >-
      Comparable list and realized pricing, service fees, contract terms, cycle times, accuracy, and qualification data
      for Nearfield and material alternatives.
    whyItMatters: >-
      Without common commercial and performance units, the capability matrix cannot establish buyer ROI, switching cost,
      or relative value.
    diligencePath: >-
      Request redacted customer proposals, product datasheets, qualification reports, and reference calls covering
      Nearfield and incumbent alternatives.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Installed-base share, customer concentration, repeat-order conversion, multi-homing, and competitor displacement
      outcomes.
    whyItMatters: Reported deployments and orders show adoption signals but do not prove recurring share or lock-in.
    diligencePath: >-
      Obtain customer-level cohort data, order-to-acceptance timing, renewal or expansion evidence, and competitor
      win-loss analysis under diligence.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A validated list of direct metrology competitors, incumbent product families, internal-build alternatives, and
      likely entrants by application.
    whyItMatters: >-
      Public comparison indexes mix adjacent companies with possible competitors and may omit material incumbent
      offerings.
    diligencePath: >-
      Build a procurement-led competitor map from fab evaluations, technical datasheets, patent landscapes, and expert
      interviews.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Product-level list and realized pricing, discounts, service attach rates, and gross-margin bridges for QUADRA and
      AUDIRA.
    whyItMatters: >-
      Without realized pricing and cost-to-serve, demand signals cannot be translated into revenue quality or
      contribution margin.
    diligencePath: >-
      Request product-level bookings, shipments, ASP, discounts, service contracts, warranty reserves, and gross margin
      by quarter.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Cash balance, monthly burn, runway, debt draw, facility covenants, and next-round trigger after the Series D.
    whyItMatters: >-
      Funding raised and valuation do not establish unrestricted cash or the time available to reach self-funding
      operations.
    diligencePath: Obtain a monthly cash bridge, committed capex schedule, debt agreements, and downside runway case.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: revenue-quality
    missingEvidence: Customer-level backlog, acceptance, shipment, revenue-recognition, collection, and concentration schedule.
    whyItMatters: Orders may convert at different timing and margins, and customer concentration can make reported demand fragile.
    diligencePath: >-
      Reconcile the top-customer order book to accepted shipments, invoicing, cash collection, cancellations, and
      repeat-order rates.
    relatedQuestionRefs:
      - QI001
      - QI005
    relatedTableRefs:
