      basis: "Named or specifically described public customer evidence available in the assigned source pool as of 2026-10-22"
    notes: "This is a partial enumeration of publicly disclosed proof, not a complete customer list. Customer-proof claims are supported by multiple assigned sources where available; unnamed counterparties cannot be independently verified by name."
    claimRefs: [CU005, CU006, CU008, CU010]
