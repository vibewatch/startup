    summary: Public evidence shows a progression from first-fab deployment to validation, repeat orders, and regional support expansion, with retention and revenue conversion still unmeasured.
    data:
      nodes:
        - id: first-deployment
          label: First fab deployment
          detail: "First QUADRA system shipped to Samsung Semiconductor in 2020"
        - id: commissioning
          label: Commissioning
          detail: "TNO reports the commissioned system delivered what Nearfield had promised"
        - id: hvm-validation
          label: High-volume validation
          detail: "QUADRA described as fully validated and deployed in a major high-volume fab"
        - id: repeat-orders
          label: Repeat orders
          detail: "Existing-client orders and a fully booked 2025 schedule were reported"
        - id: us-expansion
