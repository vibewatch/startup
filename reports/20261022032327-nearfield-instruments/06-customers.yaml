company:
  name: Nearfield Instruments
chapter:
  number: 6
  title: Customers
  summary: Nearfield has credible evidence of production deployment, repeat orders, and a widening support footprint, but public materials do not disclose customer counts, retention, revenue concentration, or cohort durability. The strongest customer proof is concentrated in named semiconductor-fab relationships and partner-supported scale-up rather than independently audited operating metrics.
sections:
  - id: customer-segments
    title: Buyer segments and commercial use cases
    body: Nearfield sells high-throughput scanning-probe metrology systems to semiconductor manufacturers operating advanced logic, memory, and three-dimensional integration processes. The buyer is an industrial fab or its process-control organization; the user is the engineering and production team that needs rapid, non-destructive measurements during wafer manufacturing; and the economic value is tied to yield, manufacturability, and avoiding destructive sampling. Public evidence names Samsung as a production customer and describes a major high-volume semiconductor fab deployment, while the 2026 company release says the platform is designed for leading semiconductor manufacturers across multiple regions. That supports a strategic-enterprise customer profile, but not a complete customer census or a verified split between memory, logic, packaging, and research users.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption, repeat orders, and support footprint
    body: The disclosed adoption trajectory progresses from a first QUADRA system shipped to Samsung Semiconductor in 2020, to full integration into a major high-volume manufacturing fab, multiple new orders from an existing client and a fully booked 2025 order schedule, and then a 2025 US subsidiary established after multiple system orders from a US customer. Neways separately states that its collaboration with Nearfield began in 2024 and supported the rollout of QUADRA systems to leading semiconductor manufacturers worldwide. These are meaningful commercial signals because they distinguish a deployed system and repeat orders from a logo-only relationship. They still do not establish the number of active systems, utilization, realized revenue, renewal behavior, or the time from pilot to repeat production order.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: customer-durability-and-risk
    title: Named proof, durability, and concentration limits
    body: Named evidence is strongest for Samsung, an unnamed major high-volume fab, and an unnamed US customer whose production-technology program selected QUADRA. The evidence supports production use or orders, but most customer names and outcome denominators are withheld. Nearfield's expansion plan and global applications/support ambitions suggest a high-touch capital-equipment model in which implementation, service, and regional support matter; the public record does not quantify service levels, contract length, gross retention, net retention, churn, customer concentration, backlog conversion, or the share of revenue from any one fab. An independent account also reports that expansion faces space, energy-availability, and financial constraints, which can slow delivery capacity even as demand is strong.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
