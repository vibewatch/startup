callouts:
  - calloutType: strength
    title: Production proof is stronger than logo proof
    body: The public record includes a shipped and commissioned Samsung system, high-volume-fab validation, and multiple orders from an existing client; these are more decision-useful than an unqualified customer-logo list.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Durability and concentration remain unquantified
    body: No assigned source discloses customer count, retention, churn, contract duration, revenue concentration, or backlog conversion. The investment case therefore depends on diligence access to customer references and operating cohorts.
    claimRefs: [CU011, CU012, CU013]
  - calloutType: recommendation
    title: Request cohort and reference evidence
    body: Before underwriting commercial durability, request a customer-by-customer installed-base and order cohort, production-acceptance dates, renewal or repeat-order history, concentration by customer and fab, and references that distinguish pilot, qualification, and volume production.
    claimRefs: [CU010, CU011, CU012]
