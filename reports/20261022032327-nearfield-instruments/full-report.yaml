  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Nearfield Instruments was founded in 2016 as a spin-off from Dutch research institute TNO and is
              headquartered in Rotterdam. Its stated business is semiconductor metrology and inspection: the QUADRA
              platform uses non-destructive, high-throughput atomic force microscopy to measure three-dimensional
              structures in advanced logic, memory, and three-dimensional packaging. The company describes integration
              into high-volume manufacturing environments, while independent coverage describes the commercial model as
              B2B product sales. Public materials identify operations or technical presence in Taiwan, South Korea,
              Japan, Singapore, the United States, and Belgium, in addition to the Netherlands. The evidence supports a
              global operating footprint, but not a complete legal-entity or site inventory; the US subsidiary and
              several technical locations are documented, while the full location-by-location staffing and revenue
              contribution remain undisclosed.
