  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Nearfield's public product story links precision sensing to 3D metrology, fab integration, and regional
      applications support.
    data:
      layers:
        - label: Measurement hardware
          detail: AFM probes, sensors, and precision motion provide atom-scale interaction and stable positioning.
        - label: Probe coordination
          detail: >-
            A proprietary multi-probe architecture is described as increasing measurement throughput while preserving
            resolution.
        - label: Imaging and metrology
          detail: QUADRA provides non-destructive high-throughput 3D metrology; AUDIRA is described as subsurface imaging.
        - label: Fab operating layer
          detail: Automation and process control are intended for integration into high-volume manufacturing.
        - label: Advanced-node applications
          detail: Public application references include high-NA EUV, GAA, CFET, hybrid bonding, and advanced packaging.
        - label: Scale and support
          detail: >-
            Production expansion, applications centers, and regional customer support are part of the stated scaling
            plan.
    approximationNotes: >-
      The stack expresses functional layers, not a disclosed software or hardware bill of materials; AUDIRA and ULSA
      maturity and architecture require customer or technical documentation.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE010
