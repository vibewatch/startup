  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The available evidence places Nearfield in a specialized semiconductor metrology and inspection segment
              rather than in a broad equipment market. Its QUADRA platform is described as a non-destructive,
              high-throughput atomic-force-microscopy system for three-dimensional structures in advanced logic, memory,
              and 3D packaging. The buyer's alternatives therefore include established metrology and inspection
              suppliers, specialist semiconductor-equipment companies, research and development collaborations, and the
              status quo of destructive or lower-throughput characterization. A third-party company index lists Oxford
              Instruments, Sensirion, Chengdu RML Technology, Beijing Aerospace, SmartMore, and proteanTecs as
              comparables, while another index names Plasma-Therm, HTT High Tech Trade, Kyma Technologies, Spectricity,
              and Wise-integration as similar companies. These lists are discovery signals, not proof that every named
              company offers a directly substitutable product. Nearfield's strategic development project with Imec shows
              the buying problem extends across high-NA EUV resist, CFET, and hybrid-bonding process development.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
      - number: '3.2'
        title: Capability, trust, and distribution
        blocks:
          - type: paragraph
            body: >-
              Nearfield's proposed differentiation is a combination of 3D information, non-destructive measurement,
              throughput, and integration into high-volume manufacturing. Its 2026 Sidewall Imaging announcement says
              the mode extends AFM with a patented cantilever, sensor fusion, and trajectory control to capture vertical
              and lateral forces; the 2025 Imec project describes high-aspect-ratio imaging, ultra-large scanning area,
              and applications in advanced lithography and hybrid bonding. These are capability claims from
              company-issued releases, not independent benchmark results. Distribution and trust are strengthened by a
              reported QUADRA deployment at a major high-volume fab, multiple orders from an existing US customer, an
              operating presence in North America, and collaborative work with Imec. The same evidence implies a
              demanding sales and service model: fabs need qualification, local technical support, applications
              engineering, and compatibility with fab standards. No assigned source supplies a comparable price,
              cycle-time benchmark, service contract, or switching-cost estimate for Nearfield versus each incumbent.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
