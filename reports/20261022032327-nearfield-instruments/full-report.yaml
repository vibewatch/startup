  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and commercial use cases
        blocks:
          - type: paragraph
            body: >-
              Nearfield sells high-throughput scanning-probe metrology systems to semiconductor manufacturers operating
              advanced logic, memory, and three-dimensional integration processes. The buyer is an industrial fab or its
              process-control organization; the user is the engineering and production team that needs rapid,
              non-destructive measurements during wafer manufacturing; and the economic value is tied to yield,
              manufacturability, and avoiding destructive sampling. Public evidence names Samsung as a production
              customer and describes a major high-volume semiconductor fab deployment, while the 2026 company release
              says the platform is designed for leading semiconductor manufacturers across multiple regions. That
              supports a strategic-enterprise customer profile, but not a complete customer census or a verified split
              between memory, logic, packaging, and research users.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption, repeat orders, and support footprint
        blocks:
          - type: paragraph
            body: >-
              The disclosed adoption trajectory progresses from a first QUADRA system shipped to Samsung Semiconductor
              in 2020, to full integration into a major high-volume manufacturing fab, multiple new orders from an
              existing client and a fully booked 2025 order schedule, and then a 2025 US subsidiary established after
              multiple system orders from a US customer. Neways separately states that its collaboration with Nearfield
              began in 2024 and supported the rollout of QUADRA systems to leading semiconductor manufacturers
              worldwide. These are meaningful commercial signals because they distinguish a deployed system and repeat
              orders from a logo-only relationship. They still do not establish the number of active systems,
              utilization, realized revenue, renewal behavior, or the time from pilot to repeat production order.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named proof, durability, and concentration limits
        blocks:
          - type: paragraph
            body: >-
              Named evidence is strongest for Samsung, an unnamed major high-volume fab, and an unnamed US customer
              whose production-technology program selected QUADRA. The evidence supports production use or orders, but
              most customer names and outcome denominators are withheld. Nearfield's expansion plan and global
              applications/support ambitions suggest a high-touch capital-equipment model in which implementation,
              service, and regional support matter; the public record does not quantify service levels, contract length,
              gross retention, net retention, churn, customer concentration, backlog conversion, or the share of revenue
              from any one fab. An independent account also reports that expansion faces space, energy-availability, and
              financial constraints, which can slow delivery capacity even as demand is strong.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Production proof is stronger than logo proof
            body: >-
              The public record includes a shipped and commissioned Samsung system, high-volume-fab validation, and
              multiple orders from an existing client; these are more decision-useful than an unqualified customer-logo
              list.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Durability and concentration remain unquantified
            body: >-
              No assigned source discloses customer count, retention, churn, contract duration, revenue concentration,
              or backlog conversion. The investment case therefore depends on diligence access to customer references
              and operating cohorts.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
          - type: callout
            title: Request cohort and reference evidence
            body: >-
              Before underwriting commercial durability, request a customer-by-customer installed-base and order cohort,
              production-acceptance dates, renewal or repeat-order history, concentration by customer and fab, and
              references that distinguish pilot, qualification, and volume production.
            calloutType: recommendation
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk prioritization
        blocks:
          - type: paragraph
            body: >-
              Nearfield's principal risk is not whether its metrology proposition is technically differentiated, but
              whether a capital-intensive equipment company can convert validation into repeatable, high-volume
              delivery. Public reporting describes QUADRA as fully validated and deployed in high-volume manufacturing,
              while a separate account reports a fully booked 2025 order schedule, multiple orders from an existing
              client, and plans for larger cleanrooms. Those are positive signals, but they also increase execution
              exposure: production capacity, facility availability, energy access, automated testing, and customer
              support must scale together. The $380 million Series D and stated plans to expand production capacity
              provide financial and organizational support, but public sources do not disclose burn, backlog conversion,
              gross margin, warranty obligations, or liquidity runway. The risk register therefore ranks scale-up and
              concentration above technical novelty, with measurable diligence triggers rather than assuming that
              funding eliminates operating risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs: []
      - number: '7.2'
        title: Regulatory, legal, and technical exposure
        blocks:
          - type: paragraph
            body: >-
              No assigned source establishes a current lawsuit, enforcement action, export-control violation, privacy
              incident, or product-safety recall. That is an evidence boundary, not proof that none exists. The
              available technical reporting does identify a concrete measurement limitation: AUDIRA depends on
              differences in material properties, and similar materials can reduce contrast; it also describes a
              tradeoff between measurement depth and resolution. Nearfield's collaboration with Imec is a credible
              mitigation pathway for next-generation process-development use cases, but it is not evidence of regulatory
              approval or commercial scale. The appropriate diligence path is to obtain the company's export-approval
              history, customer qualification records, product liability and warranty terms, cybersecurity controls, and
              any open or threatened legal matters directly from management and counsel.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR011
      - number: '7.3'
        title: Dependencies and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Nearfield's operating model is exposed to a small set of difficult dependencies: advanced semiconductor
              customers, specialized cleanroom and energy infrastructure, a global support footprint, and continued
              access to capital while production ramps. The February 2025 customer-order release describes a US
              subsidiary established alongside multiple system orders from a US customer, which supports demand but also
              highlights geographic and account concentration. The 2026 funding disclosures describe a flexible
              financing facility from ING and large expansion commitments, yet neither the facility terms nor the
              percentage of revenue or backlog represented by any customer is public in the assigned evidence. A
              risk-aware investor should distinguish funding raised from cash available and treat the valuation as
              unable to absorb execution surprises until working-capital, service, order-conversion, and
              customer-concentration data are verified.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR012
              - CR013
      - number: '7.4'
        title: Monitoring, mitigations, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The most useful monitoring plan is operational and falsifiable. Nearfield should be asked to report
              quarterly capacity added, cleanroom and energy readiness, delivery and acceptance-cycle times, repeat
              orders by customer, field reliability, warranty or rework incidence, and cash conversion. Technical
              monitoring should track measurement performance by material stack, depth, and resolution rather than
              relying on aggregate claims. Commercial monitoring should separate development projects, pilots,
              high-volume deployments, and repeat production orders. Thesis-break conditions include a material delay to
              capacity expansion, a failed or rescinded customer qualification, recurring measurement failures in target
              structures, or financing terms that require materially more dilution or secured claims than the public
              record implies. Until those indicators are documented, the appropriate stance is research-more rather than
              treating strategic investor participation as a substitute for operating evidence.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis break
            body: >-
              A material failure to convert customer validation and the Series D expansion plan into on-time, repeatable
              high-volume deliveries would undermine the investment case before public evidence can establish sufficient
              financial resilience.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR015
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned pool contains no regulator, court, certification, or incident record; legal and compliance
              risk therefore remains an evidence gap rather than a clean bill of health.
            calloutType: insight
            claimRefs:
              - CR006
              - CR009
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is that Nearfield operates in a strategically important bottleneck: advanced
              semiconductor manufacturing needs high-throughput, non-destructive measurements as device architectures
              become more complex. The 2026 financing announcement describes a $380 million Series D at a $1.6 billion
              transaction valuation, with Fidelity, Temasek, Walden Catalyst Ventures, Innovation Industries, M&G
              Investments, Invest-NL, Qatar Investment Authority, TNO Ventures and ING participating. Earlier evidence
              says QUADRA was fully validated and deployed in high-volume manufacturing at a major fab, while a 2025
              report describes a full order schedule and multiple new orders from an existing client. These are
              meaningful proof points for strategic relevance, financing access and some commercialization progress, but
              they are not substitutes for audited revenue, backlog conversion, gross margin or customer concentration
              data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
      - number: '8.2'
        title: Price, financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The reported $1.6 billion valuation is current financing context rather than a public-market mark, and the
              $380 million financing is capital raised rather than cash available after fees, working-capital needs,
              capex and any debt or preference obligations. A commercial private-market database reports $596 million
              raised across seven rounds and lists a $1.6 billion June 2026 Series D valuation, but it does not disclose
              the underlying cap table or terms and labels some detail as available only to Pro users. Lincoln
              International confirms the 2024 Series C was oversubscribed and used to ramp production and expand the
              product portfolio; it does not disclose price, ownership or liquidation preferences. On the public record,
              a buyer should require the signed term sheet, fully diluted capitalization, preference stack,
              debt/facility terms, audited financials, backlog aging and customer-level bookings before accepting the
              reported valuation as an investable entry price.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more decision-useful than a single target value because the public record supplies
              a financing valuation but not the operating denominator required for a revenue or EBITDA multiple. The
              bull case therefore depends on converting the reported full 2025 order schedule, existing-client repeat
              orders and 2026 production expansion into disclosed recurring revenue, acceptable gross margins and
              repeatable installations. The base case assumes technical validation and strategic demand continue but
              commercialization data remains incomplete, so an investor tracks rather than pays the financing mark
              without stronger terms. The bear case is that cleanroom, energy, cybersecurity and automated-test
              expansion requires more capital or slips, while public semiconductor-equipment multiples compress. Exit
              readiness is not established: the company remains privately held, and no public evidence here provides a
              planned IPO, sale process, liquidity timetable, governance rights or preference waterfall.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV013
      - number: '8.4'
        title: Recommendation and decisive diligence
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, not buy or avoid. The financing syndicate and product deployment
              evidence support a credible strategic asset, but the price is not independently underwritten by public
              operating metrics. The highest-value next work is to reconcile the $1.6 billion transaction valuation to a
              fully diluted share count and preference schedule, then test it against audited revenue, gross margin,
              backlog, shipment timing, installed base, customer concentration, service economics and cash runway. The
              investment call should move toward track or buy only if those data show durable conversion and a
              risk-adjusted return above the entry hurdle; it should move toward avoid or a materially lower price if
              orders are non-binding, concentration is high, expansion capex consumes the round, or preferences leave
              common equity with weak downside protection.
            claimRefs:
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at disciplined terms
            body: >-
              Nearfield has credible strategic and technical proof, but public evidence does not support a conventional
              valuation underwriting at the reported $1.6B financing mark.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV013
          - type: callout
            title: The missing denominator is the central risk
            body: >-
              The key unresolved question is not whether capital was raised, but whether revenue, margin, backlog
              conversion and shareholder terms can support the price after dilution and preferences.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV014
