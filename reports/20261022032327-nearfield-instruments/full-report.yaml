      - number: '4.4'
        title: Financial evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The available evidence is sufficient to frame a financing and monetization hypothesis, but not to
              calculate a revenue multiple, cash runway, gross-margin path, or return profile. The most important
              missing package is a monthly bridge from orders to accepted shipments to recognized revenue and cash
              collection, reconciled to production capacity and field-service obligations. Management should also
              provide customer concentration, backlog aging, warranty and service reserves, inventory turns, supplier
              payment terms, debt documents, and a forward capex plan. Until those items are available, the appropriate
              financial posture is research-more: commercial validation is credible, while the economics and liquidity
