  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic proof and financing validation support continued diligence, while undisclosed operating metrics and
      terms constrain the recommendation to research-more.
    data:
      nodes:
        - id: scale-proof
          label: Scale and technical proof
          detail: >-
            QUADRA reported validated and deployed in high-volume manufacturing; 2025 report describes a full order
            schedule.
        - id: financing-mark
          label: Financing mark
          detail: $380M Series D at reported $1.6B transaction valuation in June 2026.
        - id: evidence-gap
          label: Underwriting gaps
          detail: Revenue, margins, backlog conversion, cap table, preferences and cash plan are not publicly disclosed here.
        - id: terms-check
          label: Terms check
          detail: Test dilution, liquidation preferences, debt, facility obligations and common-equity waterfall.
        - id: downside
          label: Downside controls
          detail: >-
            Test customer concentration, expansion capex, qualification timing, dilution, liquidity and multiple
            compression.
        - id: decision
          label: Research-more
          detail: Require private diligence before paying the financing mark.
