        title: Exhibits
        blocks:
          - type: callout
            title: Strategic bottleneck exposure
            body: >-
              Nearfield is positioned in a measurement step that becomes more important as advanced nodes add
              three-dimensional structures and tighter tolerances; disclosed high-volume-fab validation and customer
              orders are stronger adoption signals than a generic semiconductor TAM.
