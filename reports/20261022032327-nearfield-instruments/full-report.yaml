              - CP002
              - CP005
              - CP007
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              The strongest visible moat signals are application-specific know-how, a stated patent position,
              integration experience, and access to leading research and manufacturing partners. They may raise
              qualification and switching costs, but the public record does not quantify lock-in, multi-homing,
              installed-base share, or repeat-order conversion. The competitive risk is therefore not simply that a
              named peer copies the product; it is that incumbent metrology vendors, customer internal teams, or
              alternative destructive and optical methods can meet enough of the buyer's accuracy, throughput, and cost
              requirements. The reported full 2025 order schedule and planned cleanroom investment indicate demand and
              capacity pressure, but are not evidence of durable share. Public comparison pages also mix direct and
              adjacent companies, so a procurement-grade matrix remains incomplete until Nearfield and each material
              alternative disclose comparable specifications, pricing, qualification status, and field performance.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation wedge
            body: >-
              Nearfield's strongest public wedge is the stated combination of non-destructive 3D sidewall information,
              throughput, and high-volume-fab integration.
            calloutType: strength
            claimRefs:
              - CP005
              - CP007
          - type: callout
            title: Comparison gap
            body: >-
              Public evidence does not provide comparable prices, cycle times, installed-base share, or independent
              performance benchmarks against incumbents and adjacent alternatives.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
          - type: callout
            title: Diligence priority
            body: >-
              Obtain procurement-grade specifications and customer references before treating index-listed companies as
              direct competitors or underwriting a durable moat.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and commercial traction
        blocks:
          - type: paragraph
            body: >-
              Nearfield appears to monetize primarily through sales of specialized semiconductor metrology systems, with
              additional economics likely attached to deployment, support, applications work, and future product lines,
              although public sources do not separate those streams. The company describes QUADRA as available for
              ordering and AUDIRA as a second product, while a February 2025 release says multiple systems were ordered
