              - CM016
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is an advanced semiconductor manufacturer, with process control, yield, and
              manufacturing engineering functions likely shaping the specification and fab operations owning deployment.
              The user is the metrology or process engineer; the economic payer is the fab organization whose budget is
              justified by yield, throughput, scrap avoidance, and qualification of new device architectures. Evidence
              of multiple system orders from a US customer, a full 2025 order schedule, and QUADRA integration in
              high-volume manufacturing indicates commercial pull rather than a laboratory-only use case. Drivers
              include smaller features, deeper trenches, 3D architectures, and demand for higher-performing,
              lower-energy chips. Constraints remain material: qualification cycles are long, incumbent trust is high,
              tool deployment is capital intensive, and the public record does not show customer concentration, pricing,
              backlog conversion, or the duration of repeat orders.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
