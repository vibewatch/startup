        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The June 2026 Series D provides a large disclosed financing event: $380 million at a reported $1.6 billion
              valuation, with proceeds described for production capacity, global applications centers, customer support,
              and collaborative R&D. A separate source reports a flexible ING financing facility, but the public record
              does not disclose cash on hand, debt drawn, covenant terms, monthly burn, runway, capex schedule, or the
              next financing trigger. The 2024 expansion account describes planned investments of tens of millions of
