  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic job
        blocks:
          - type: paragraph
            body: >-
              The relevant market is semiconductor metrology and inspection used to control process dimensions,
              profiles, and yield during fabrication, with Nearfield focused on high-throughput, non-destructive
              three-dimensional measurements for advanced logic, memory, and 3D integration. The boundary excludes
              lithography equipment, deposition, etch, packaging machinery, and broad semiconductor revenue except where
              those adjacent processes create a measurement requirement. The buyer's economic job is not simply to
              obtain a microscope: it is to detect process variation early enough to protect yield and manufacturability
              without destroying scarce wafer samples. Public descriptions position QUADRA around high-aspect-ratio
              trenches, GAA structures, vias, and multilayer stacks, where conventional optical or electron-beam
              approaches can be insufficient, slow, or destructive.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Multiple sizing lenses and limits
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence supports a market-level view, not a validated Nearfield serviceable
              obtainable market. One 2026 industry article estimates chip metrology at roughly $10.3 billion in 2025 and
              $15 billion in 2031, implying a broad growth opportunity, while a 2024 industry release cites a projected
              $1 trillion global semiconductor industry by 2029. These figures are different populations and should not
              be combined into a conversion funnel: semiconductor revenue includes the entire chip industry, whereas
              metrology is a process-control equipment category. A private-company data source reports Nearfield's $1.6
              billion Series D valuation, but that is a financing outcome rather than market size. No retained source
              isolates the portion of metrology that is addressable by Nearfield's product scope, the obtainable share,
              system ASP, or recurring service revenue.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
