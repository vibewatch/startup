        title: Pricing and unit economics
        blocks:
          - type: paragraph
            body: >-
              No public source in the assigned pool provides a list price, realized system price, service attach rate,
              gross margin, customer acquisition cost, sales-cycle duration, payback period, or contribution margin.
              That absence is consequential because a capital-equipment vendor can show strong bookings while still
              carrying long commissioning cycles, high field-service costs, inventory commitments, and customer-specific
              engineering. The public evidence supports a product-sale model and identifies planned spending on
              cleanrooms, automated testing, cybersecurity, and support, but it does not establish the unit economics of
