callouts:
  - calloutType: recommendation
    title: Research-more at disciplined terms
    body: "Nearfield has credible strategic and technical proof, but public evidence does not support a conventional valuation underwriting at the reported $1.6B financing mark."
    claimRefs: [CV003, CV005, CV013]
  - calloutType: risk
    title: The missing denominator is the central risk
    body: "The key unresolved question is not whether capital was raised, but whether revenue, margin, backlog conversion and shareholder terms can support the price after dilution and preferences."
    claimRefs: [CV006, CV008, CV014]
