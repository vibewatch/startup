company:
  name: Nearfield Instruments
chapter:
  number: 8
  title: Valuation
  summary: Nearfield has strong strategic and financing validation, including a reported $1.6 billion Series D valuation, but public evidence does not disclose the revenue, margin, ownership, preference, or facility terms needed to underwrite that price. The appropriate stance is research-more with disciplined entry terms and explicit downside gates.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The positive case is that Nearfield operates in a strategically important bottleneck: advanced
      semiconductor manufacturing needs high-throughput, non-destructive measurements as device
      architectures become more complex. The 2026 financing announcement describes a $380 million
      Series D at a $1.6 billion transaction valuation, with Fidelity, Temasek, Walden Catalyst
      Ventures, Innovation Industries, M&G Investments, Invest-NL, Qatar Investment Authority,
      TNO Ventures and ING participating. Earlier evidence says QUADRA was fully validated and
      deployed in high-volume manufacturing at a major fab, while a 2025 report describes a full
      order schedule and multiple new orders from an existing client. These are meaningful proof
      points for strategic relevance, financing access and some commercialization progress, but they
      are not substitutes for audited revenue, backlog conversion, gross margin or customer
      concentration data.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: price-and-entry
    title: Price, financing context and entry discipline
    body: >-
      The reported $1.6 billion valuation is current financing context rather than a public-market
      mark, and the $380 million financing is capital raised rather than cash available after fees,
      working-capital needs, capex and any debt or preference obligations. A commercial private-market
      database reports $596 million raised across seven rounds and lists a $1.6 billion June 2026
      Series D valuation, but it does not disclose the underlying cap table or terms and labels some
      detail as available only to Pro users. Lincoln International confirms the 2024 Series C was
      oversubscribed and used to ramp production and expand the product portfolio; it does not
      disclose price, ownership or liquidation preferences. On the public record, a buyer should
      require the signed term sheet, fully diluted capitalization, preference stack, debt/facility
      terms, audited financials, backlog aging and customer-level bookings before accepting the
      reported valuation as an investable entry price.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV003]
  - id: scenarios-and-thesis-breaks
    title: Scenarios, exit readiness and thesis breaks
    body: >-
      A scenario framework is more decision-useful than a single target value because the public
      record supplies a financing valuation but not the operating denominator required for a revenue
      or EBITDA multiple. The bull case therefore depends on converting the reported full 2025 order
      schedule, existing-client repeat orders and 2026 production expansion into disclosed recurring
      revenue, acceptable gross margins and repeatable installations. The base case assumes technical
      validation and strategic demand continue but commercialization data remains incomplete, so an
      investor tracks rather than pays the financing mark without stronger terms. The bear case is
      that cleanroom, energy, cybersecurity and automated-test expansion requires more capital or
      slips, while public semiconductor-equipment multiples compress. Exit readiness is not
      established: the company remains privately held, and no public evidence here provides a planned
      IPO, sale process, liquidity timetable, governance rights or preference waterfall.
    claimRefs: [CV009, CV010, CV011, CV012]
    figureRefs: [FV001]
  - id: diligence-conclusion
    title: Recommendation and decisive diligence
    body: >-
      The recommendation is research-more, not buy or avoid. The financing syndicate and product
      deployment evidence support a credible strategic asset, but the price is not independently
      underwritten by public operating metrics. The highest-value next work is to reconcile the $1.6
      billion transaction valuation to a fully diluted share count and preference schedule, then
      test it against audited revenue, gross margin, backlog, shipment timing, installed base,
      customer concentration, service economics and cash runway. The investment call should move
      toward track or buy only if those data show durable conversion and a risk-adjusted return above
      the entry hurdle; it should move toward avoid or a materially lower price if orders are
      non-binding, concentration is high, expansion capex consumes the round, or preferences leave
      common equity with weak downside protection.
    claimRefs: [CV013, CV014, CV015]
    tableRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not underwrite the reported financing valuation as a buy price without private operating and term-sheet evidence."]
      - [Confidence, medium, "The financing and product evidence is clear, but the operating denominator and security terms are not public."]
      - [Risk rating, high, "Commercial scale-up, customer concentration, capex execution and private-market liquidity remain material uncertainties."]
      - [Valuation stance, stretched, "A $1.6B transaction valuation is difficult to test without revenue, margin, ownership and preference data."]
    notes: "Assessment is an evidence-weighted judgment, not a quoted market price; null public operating metrics prevent a conventional multiple-based valuation."
    claimRefs: [CV001, CV005, CV010, CV013]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Strategic bottleneck exposure", "High-throughput, non-destructive metrology is positioned for advanced logic, memory and 3D integration.", "Evidence that customers can substitute the tool or that qualification cycles prevent volume adoption."]
      - ["Technical proof", "QUADRA is reported as fully validated and deployed in high-volume manufacturing at a major fab.", "Independent customer references, uptime, measurement-cycle and yield-impact data."]
      - ["Commercial momentum", "A 2025 report describes a full order schedule and repeat orders from an existing client.", "Signed backlog, shipment timing, cancellations, customer concentration and conversion to recognized revenue."]
      - ["Price risk", "The reported $1.6B valuation is disclosed for the Series D, while operating denominators and terms are not public.", "Audited financials and terms supporting an adequate risk-adjusted return at the proposed entry price."]
    notes: "Rows separate evidence-backed positives from the specific missing evidence that could reverse the investment view."
    claimRefs: [CV002, CV003, CV004, CV005, CV008]
  - id: TV003
    title: Bull, base and bear valuation scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Key risks]
    rows:
      - [Bull, "QUADRA deployment expands; repeat orders convert into disclosed high-margin revenue; production expansion meets demand.", "Potential to justify or exceed the $1.6B financing mark only after audited revenue and margin support a defensible multiple.", "Upside is credible but unproven; require milestone evidence.", "Qualification delays, customer concentration, execution and capex."]
      - [Base, "Technical validation persists; demand grows, but revenue, backlog conversion and terms remain only partially disclosed.", "Track or negotiate a discount to the financing mark; no precise target is supportable from public denominators.", "Most consistent with current evidence.", "Opaque economics, private liquidity and preference overhang."]
      - [Bear, "Orders slip or remain non-binding; cleanroom, energy and cybersecurity expansion costs rise; equipment multiples compress.", "Material downside to common-equity value versus the $1.6B transaction mark; avoid until terms and cash needs are known.", "A live downside case, not a quantified forecast.", "Commercialization failure, dilution, follow-on financing and multiple compression."]
      - [Diligence gate, "Term sheet, cap table, audited financials, backlog aging, customer concentration and cash plan are delivered.", "Upgrade only if risk-adjusted return clears the investment hurdle after preferences and dilution.", "Required before a buy decision.", "Missing evidence itself is the blocker."]
    notes: "No precise valuation range is presented because public sources do not provide the revenue, margin, share-count, preference or cash-flow denominators required for a defensible model."
    claimRefs: [CV005, CV009, CV010, CV011, CV012, CV015]
