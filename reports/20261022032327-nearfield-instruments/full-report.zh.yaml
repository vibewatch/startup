  - id: TV003
    title: 乐观、基准与悲观估值情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 概率信号
      - 主要风险
    rows:
      - - 乐观情景
        - QUADRA 部署范围扩大；重复订单转化为已披露的高毛利收入；产能扩张跟上需求。
        - 只有经审计收入和利润率能够支撑合理倍数后，才有可能证明 $1.6B 融资估值合理，甚至支撑更高估值。
        - 上行空间有一定可信度，但尚未得到验证；需有里程碑证据。
        - 认证延迟、客户集中、执行和资本开支。
      - - 基准情景
        - 技术验证继续成立，需求增长，但收入、订单积压转化和交易条款仍只部分披露。
        - 持续跟踪，或争取低于融资估值入场；公开指标分母不足以支撑精确目标价。
        - 与现有证据最为吻合。
        - 经济性不透明、私人市场流动性不足、优先权造成的压力。
      - - 悲观情景
        - 订单延期或仍不具约束力；洁净室、能源和网络安全扩建成本上升；设备估值倍数收缩。
        - 相较 $1.6B 交易估值，普通股价值可能大幅下行；在明确交易条款和现金需求前应避免买入。
        - 下行情景确实存在，但这不是量化预测。
        - 商业化失败、股权稀释、后续融资及估值倍数收缩。
      - - 尽调门槛
        - 提供条款清单、股权结构表、经审计财务报表、订单积压账龄、客户集中度和现金计划。
        - 只有在考虑优先权和稀释后，风险调整回报仍超过投资门槛，才上调判断。
        - 买入决策前必须满足。
        - 证据缺失本身就是阻碍。
    notes: 公开来源未提供建立可靠估值模型所需的收入、利润率、股份数量、优先权或现金流分母，因此不列出精确估值区间。
    claimRefs:
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
