            body: >-
              Nearfield 的主要风险不在于其计量方案是否具有技术差异化，而在于这家资本密集型设备公司能否把验证成果转化为可重复的大规模交付。公开报道称 QUADRA 已全面验证并投入大规模量产；另有报道表示 2025
              年订单已排满、既有客户多次追加订单，公司也计划建设更大的洁净室。这些都是积极信号，却也加大了执行压力：产能、厂房、能源、自动化测试和客户支持必须同步扩张。$380 million 的 D
              轮融资及扩产计划提供了资金和组织支持，但公开来源没有披露烧钱速度、积压订单转化、毛利率、质保义务或现金跑道。因此，风险排序应把扩产执行和客户集中度放在技术新颖性之前，并设置可量化的尽调触发条件，而不是假设融资能消除运营风险。
