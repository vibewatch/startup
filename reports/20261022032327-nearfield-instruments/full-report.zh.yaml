  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略价值和融资情况已有证据支撑，值得继续尽调；但运营指标和交易条款未披露，因此建议仍限于继续研究。
    data:
      nodes:
        - id: scale-proof
          label: 规模与技术验证
          detail: 据报道，QUADRA 已完成验证并部署在大规模量产环节；一份 2025 年报告称订单排期已满。
        - id: financing-mark
          label: 融资估值
          detail: June 2026 据报道完成 $380M D 轮融资，交易估值为 $1.6B。
        - id: evidence-gap
          label: 投资判断缺口
          detail: 此处未公开收入、利润率、订单积压转化、股权结构表、优先权及现金计划。
        - id: terms-check
          label: 条款核查
          detail: 核查股权稀释、清算优先权、债务、融资安排义务及普通股分配顺序。
        - id: downside
          label: 下行风险控制
          detail: 检验客户集中度、扩张资本开支、认证时间、股权稀释、流动性和估值倍数收缩风险。
        - id: decision
          label: 继续研究
          detail: 在按融资估值买入前，必须完成非公开尽调。
      edges:
        - - scale-proof
          - financing-mark
        - - financing-mark
          - evidence-gap
        - - evidence-gap
          - terms-check
        - - terms-check
          - downside
        - - downside
          - decision
