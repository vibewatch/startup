    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品与运营布局
        blocks:
          - type: paragraph
            body: >-
              Nearfield Instruments 于 2016 年从荷兰研究机构 TNO 孵化成立，总部位于鹿特丹。公司主营半导体计量与检测，QUADRA 平台采用无损、高通量原子力显微镜，测量先进逻辑、存储和 3D
              封装中的三维结构。公司称设备已集成进大规模量产环境；独立报道则将其商业模式描述为 B2B
              产品销售。公开材料显示，公司除荷兰外，还在台湾、韩国、日本、新加坡、美国和比利时设有运营或技术团队。现有证据足以说明其已建立全球运营布局，但不足以列出完整的法人实体和站点清单：美国子公司及若干技术所在地有据可查，各地人员规模与收入贡献则未披露。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
