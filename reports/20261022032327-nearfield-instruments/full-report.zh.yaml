              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据将 Nearfield 定位在专业半导体计量与检测细分市场，而非广义设备市场。QUADRA 被描述为一套无损、高通量原子力显微镜系统，用于测量先进逻辑、存储和 3D
              封装中的三维结构。买方的替代方案包括成熟的计量与检测供应商、专业半导体设备公司、研发合作项目，以及继续采用破坏性或低通量表征方法。第三方公司名录将 Oxford
              Instruments、Sensirion、Chengdu RML Technology、Beijing Aerospace、SmartMore 和 proteanTecs 列为可比公司；另一份名录则列出
              Plasma-Therm、HTT High Tech Trade、Kyma Technologies、Spectricity 和
              Wise-integration。这些名单只能作为发现线索，并不能证明每家公司都提供可直接替代的产品。Nearfield 与 Imec 的战略开发项目显示，买方需求还涵盖高数值孔径（high-NA）EUV
              光刻胶、CFET 和混合键合制程开发。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
      - number: '3.2'
        title: 能力、信任与渠道
        blocks:
          - type: paragraph
            body: >-
              Nearfield 所强调的差异化，在于结合 3D 信息、无损测量、高通量和大规模量产集成。公司在 2026 年发布的 Sidewall Imaging 公告称，该模式通过专利悬臂、传感器融合和轨迹控制扩展
              AFM，可捕捉垂直及横向力；2025 年 Imec 项目则介绍了高深宽比成像、超大扫描面积，以及在先进光刻和混合键合中的应用。这些是公司公告中的能力主张，并非独立基准测试结果。据报 QUADRA
              已部署于一家大型量产晶圆厂，现有美国客户又下了多台订单；加上北美运营布局及与 Imec
              的合作，分销和客户信任有所增强。同一批证据也说明销售与服务模式要求很高：晶圆厂需要完成认证、获得本地技术支持和应用工程服务，设备还须符合晶圆厂标准。现有来源未提供 Nearfield
              相对各成熟供应商的可比价格、周期基准、服务合同或切换成本估算。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
      - number: '3.3'
        title: 护城河持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              目前可见的护城河信号，主要是特定应用领域的专有经验、据称拥有的专利、集成经验，以及接触一流研发和制造伙伴的机会。这些因素可能抬高认证和切换成本，但公开资料未量化锁定效应、多供应商并用、装机份额或复购转化。竞争风险不只是某个同行复制产品；更重要的是，成熟计量厂商、客户内部团队，或其他破坏性与光学方法，是否能满足买方对精度、通量和成本的基本要求。据报
              2025 年订单已排满，且公司计划投资洁净室，这说明需求旺盛、产能承压，却不能证明份额持久。公开可比公司页面还混杂直接与相邻企业；只有 Nearfield
              和各个重要替代方案披露可比规格、价格、认证状态及现场表现后，采购级比较矩阵才算完整。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 差异化切入口
            body: Nearfield 公开材料中最有力的切入口，是其所称无损 3D 侧壁信息、高通量与大规模晶圆厂集成能力的组合。
            calloutType: strength
            claimRefs:
              - CP005
              - CP007
          - type: callout
            title: 可比数据缺口
            body: 公开证据没有提供与成熟供应商及相邻替代方案之间可比的价格、周期、装机份额或独立性能基准。
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
          - type: callout
            title: 尽调重点
            body: 在把名录中的公司视为直接竞争者或将持久护城河纳入投资判断前，先取得采购级规格和客户推荐。
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP012
              - CP013
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现方式与商业进展
        blocks:
          - type: paragraph
            body: >-
              Nearfield 似乎主要靠销售专业半导体计量系统变现；设备部署、支持、应用服务和未来产品线也可能带来收入，但公开来源没有拆分各项收入。公司称 QUADRA 已开放订购，并将 AUDIRA
              列为第二款产品；February 2025 的公告称美国客户订购了多套系统。2024 年行业报道则称 2025
              年订单已排满，且现有客户又下了多笔新订单。这些是有意义的需求信号，但不能等同于收入、积压订单、实际成交价或已确认利润率。最具体的商业信息仍来自公司自身或转述来源，因此投资者应先取得合同层面的订单、发货、验收和收入确认数据，再判断订单势头是否构成经常性增长。
            claimRefs:
