            body: >-
              据报 $1.6 billion 估值反映的是当前融资背景，并非公开市场定价；$380 million
              融资也只是募集金额，不能等同于扣除费用、营运资金、资本开支及债务或优先权义务后的可用现金。商业化私募市场数据库称，公司七轮共募资 $596 million，并列出 June 2026 D 轮估值 $1.6
              billion，但未披露股权结构或条款，部分信息还标注为仅向 Pro 用户开放。Lincoln International 证实，2024 年 C
              轮获得超额认购，资金用于扩产和拓展产品组合；但未披露价格、股权比例或清算优先权。根据公开资料，投资者在接受这一估值作为可投资入场价前，应要求查看签署版条款书、完全稀释后的股本、优先权结构、债务及融资额度条款、审计财报、积压订单账龄和客户级订单数据。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 情景分析、退出准备度与逻辑失效点
        blocks:
          - type: paragraph
            body: >-
              相比给出单一目标估值，情景分析更有决策价值，因为公开资料只有融资估值，却没有计算收入或 EBITDA 倍数所需的经营分母。因此，乐观情景取决于公司能否把据报已排满的 2025 年订单、既有客户复购和 2026
              年扩产，转化为公开披露的经常性收入、可接受的毛利率和可重复安装。基准情景假设技术验证和战略需求持续，但商业化数据仍不完整；在条款更有利之前，投资者应观察而不是照融资估值买入。悲观情景则是洁净室、能源、网络安全和自动化测试扩建需要更多资金或进度延误，同时公开市场半导体设备公司的估值倍数下行。公司尚无明确退出准备：仍为非上市公司，现有公开证据也未显示
              IPO 计划、出售进程、流动性时间表、治理权利或优先权分配顺序。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV013
      - number: '8.4'
        title: 投资建议与关键尽调
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而非买入或回避。投资方阵容和产品部署证据表明这是一项可信的战略资产，但公开经营指标尚不足以独立支撑当前价格。下一步最有价值的工作，是把 $1.6 billion
              交易估值与完全稀释后的股份数及优先权安排核对，再用经审计的收入、毛利率、积压订单、出货时间、装机基数、客户集中度、服务经济性和现金跑道检验估值。只有这些数据证明订单能持续转化、风险调整后回报高于入场门槛，投资建议才应转向观察或买入；如果订单缺乏约束力、客户集中度高、扩产资本开支耗尽本轮资金，或优先权导致普通股下行保护不足，则应转向回避或要求显著更低的价格。
            claimRefs:
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 条款审慎时继续研究
            body: Nearfield 有可信的战略和技术验证，但公开证据不足以支撑以据报 $1.6B 融资估值进行常规估值判断。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV013
          - type: callout
            title: 缺失的经营分母是核心风险
            body: 关键未决问题不是公司是否募到资金，而是收入、利润率、积压订单转化和股东条款能否在考虑稀释及优先权后支撑当前价格。
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV014
