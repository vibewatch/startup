      - number: '2.3'
        title: 买方、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              主要买方是先进半导体制造商，制程控制、良率和制造工程团队可能参与规格制定，晶圆厂运营团队负责部署。使用者是计量或制程工程师；实际出资方是晶圆厂，预算依据是良率、产能、减少报废，以及新器件架构的认证需求。美国客户的多台系统订单、2025
              年订单排满，以及 QUADRA 进入大规模量产，说明需求并非只停留在实验室。驱动因素包括线宽缩小、沟槽加深、3D
              架构兴起，以及市场对高性能、低能耗芯片的需求。制约因素也不容忽视：认证周期长、客户信任成熟供应商、设备部署资本密集，公开资料也未说明客户集中度、定价、积压订单转化情况或复购持续时间。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 切入关键制程瓶颈
            body: 先进制程节点不断引入三维结构并收紧公差，计量环节的重要性随之上升。相比泛化的半导体 TAM，已披露的大规模晶圆厂验证和客户订单更能说明采用进展。
            calloutType: strength
            claimRefs:
              - CM003
              - CM009
              - CM010
          - type: callout
            title: 市场规模仍受证据限制
            body: 公开来源支持行业增长，却无法确认 Nearfield 可触达的市场份额、定价、服务收入占比或复购经济性；缺少经营模型数据，估值也就无从交叉验证。
            calloutType: risk
            claimRefs:
              - CM006
