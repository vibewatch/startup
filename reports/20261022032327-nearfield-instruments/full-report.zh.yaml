  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与客户要解决的问题
        blocks:
          - type: paragraph
            body: >-
              相关市场是半导体制造中的计量与检测，用于控制制程尺寸、轮廓和良率；Nearfield 专注为先进逻辑、存储和 3D
              集成提供高通量、无损三维测量。除非光刻、沉积、刻蚀或封装设备等相邻制程产生测量需求，否则它们不属于这一市场边界；整个半导体行业的收入也不应混入。客户要解决的并非单纯买一台显微镜，而是尽早发现制程偏差、守住良率和可制造性，同时避免破坏稀缺的晶圆样品。公开资料称
              QUADRA 面向高深宽比沟槽、GAA 结构、通孔和多层堆叠；传统光学或电子束方法在这些场景下可能不够用、速度偏慢或具有破坏性。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模的不同口径与局限
        blocks:
          - type: paragraph
            body: >-
              现有规模数据只能描绘市场，无法验证 Nearfield 可服务且可获取的市场。一篇 2026 年行业文章估算，芯片计量市场规模约为 2025 年的 $10.3 billion，至 2031 年将达 $15
              billion，显示整体机会在扩大；一则 2024 年行业公告则预计全球半导体产业到 2029 年将达 $1
              trillion。两者覆盖的市场口径不同，不能拼成一条转化漏斗：半导体收入涵盖整个芯片产业，计量则只是制程控制设备的一个类别。某非上市公司数据库称 Nearfield D 轮估值为 $1.6
              billion，但这是融资结果，不是市场规模。现存来源均未拆出 Nearfield 产品可触达的计量市场份额、可获取份额、系统平均售价（ASP）或经常性服务收入。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
