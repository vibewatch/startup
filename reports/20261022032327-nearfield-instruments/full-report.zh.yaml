        title: 融资、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              目前最有力的融资证据来自 June 2026 的 D 轮：QIA 称本轮融资额为 $380 million，由 Fidelity Management & Research Company
              领投，具名的新老投资者共同参与，估值为 $1.6 billion。公告称资金将用于扩充产能、建设全球应用中心、加强客户支持和开展合作研究。更早的报道记录了 July 2024 的 €135 million C
              轮，并称 QUADRA 已在一家大型半导体晶圆厂通过验证并投入大规模量产。公司还在 February 2025 宣布获得美国客户的多台系统订单；同期荷兰科技报道则称 2025
              年订单已全部排满。公开数据库提供了更长的融资历史，但若融资总额或轮次标签与公司、投资方公告不一致，应视为次级估算。现有来源均未披露收入、经常性收入、毛利率、烧钱速度、积压订单金额、客户数或股权稀释情况。
