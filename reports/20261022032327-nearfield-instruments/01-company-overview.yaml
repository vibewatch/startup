company:
  name: Nearfield Instruments
chapter:
  number: 1
  title: Company Overview
  summary: Nearfield Instruments is a Rotterdam-based, privately held TNO spin-off that sells non-destructive 3D metrology and inspection systems for advanced semiconductor manufacturing. The June 2026 Series D materially increased disclosed capital and valuation, while public evidence still leaves revenue, governance, ownership, and installed-base depth opaque.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: >-
      Nearfield Instruments was founded in 2016 as a spin-off from Dutch research institute
      TNO and is headquartered in Rotterdam. Its stated business is semiconductor metrology
      and inspection: the QUADRA platform uses non-destructive, high-throughput atomic force
      microscopy to measure three-dimensional structures in advanced logic, memory, and
      three-dimensional packaging. The company describes integration into high-volume
      manufacturing environments, while independent coverage describes the commercial model
      as B2B product sales. Public materials identify operations or technical presence in
      Taiwan, South Korea, Japan, Singapore, the United States, and Belgium, in addition to
      the Netherlands. The evidence supports a global operating footprint, but not a complete
      legal-entity or site inventory; the US subsidiary and several technical locations are
      documented, while the full location-by-location staffing and revenue contribution remain
      undisclosed.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder dependence
    body: >-
      Dr. Hamed Sadeghian is identified as co-founder and chief executive officer, and
      independent coverage names Eric Meurice as chair of the supervisory board. Nearfield's
      February 2025 US expansion release identifies Jeroen Verbiest as vice president of
      sales and marketing and Roland van Vliet as a media contact and chief partnership
      officer in the same release. These disclosures show functional coverage across
      executive leadership, commercial expansion, and board oversight, but they do not amount
      to a complete leadership or governance register. The funding syndicate adds strategic
      and financial stakeholders, including Fidelity, Temasek, Walden Catalyst, Innovation
      Industries, M&G Investments, Invest-NL, TNO Ventures, ING, and QIA. Ownership
      percentages, investor rights, board seats, preference terms, and succession depth are
      not publicly disclosed, so founder and key-person dependence should remain an open
      diligence item rather than being inferred from titles alone.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: financing-and-milestones
    title: Financing, scale, and milestones
    body: >-
      The strongest current financing evidence is the June 2026 Series D: QIA reports a
      $380 million round led by Fidelity Management & Research Company with participation
      from named new and existing investors, at a $1.6 billion valuation. The same release
      says the round will fund production capacity, global application centers, customer
      support, and collaborative research. Earlier coverage records a €135 million Series C
      in July 2024 and describes QUADRA as validated and deployed in high-volume
      manufacturing at a major semiconductor fab. The company also announced multiple US
      customer system orders in February 2025 and a fully booked 2025 order schedule in
      contemporaneous Dutch technology coverage. Public databases provide a longer funding
      history, but their totals and round labels should be treated as secondary estimates
      where they differ from company or investor announcements. No source in this pool
      discloses revenue, recurring revenue, gross margin, cash burn, backlog value, customer
      count, or ownership dilution.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
