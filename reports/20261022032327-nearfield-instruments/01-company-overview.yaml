callouts:
  - calloutType: strength
    title: Strategic financing and technical validation
    body: The June 2026 round combines a large disclosed financing with investor-described expansion uses, while earlier coverage reports QUADRA validation and deployment in high-volume manufacturing.
    claimRefs: [CO009, CO010]
  - calloutType: risk
    title: Private-company disclosure remains thin
    body: The public record does not establish revenue, backlog value, margin, burn, customer concentration, ownership, or board rights; the $1.6 billion round valuation should therefore not be treated as a fully underwritten operating valuation.
    claimRefs: [CO014, CO015, CO016]
  - calloutType: insight
    title: Scale-up execution is the next proof point
    body: The stated uses of the Series D and the reported cleanroom and US expansion plans make production ramp, service coverage, and repeat-order conversion the most decision-relevant milestones to verify next.
    claimRefs: [CO012, CO013, CO014]
