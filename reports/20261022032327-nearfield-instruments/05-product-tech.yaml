company:
  name: Nearfield Instruments
chapter:
  number: 5
  title: Product & Technology
  summary: Nearfield Instruments sells semiconductor metrology and inspection equipment built around non-destructive, high-throughput 3D measurement. Public evidence supports a maturing product platform and global deployment/support ambitions, but detailed performance data, integration evidence, security controls, and roadmap milestones remain largely undisclosed.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: Nearfield operates upstream of chip production rather than making processors itself. Its stated customer workflow is to measure advanced structures during fabrication, identify process variation, and provide information that helps fabs improve yield and manufacturability without destroying the wafer. The public product description centers on scanning-probe metrology, atomic-force microscopy, and full 3D imaging for advanced logic, memory, and 3D packaging. This is a high-value workflow because more complex structures create more difficult inspection problems, but the retained evidence does not disclose quantified measurement accuracy, cycle time, defect-detection thresholds, or customer-specific production outcomes. Public descriptions also mix company claims with trade coverage, so the operational benefit should be treated as plausible and strategically relevant rather than independently benchmarked.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture and maturity
    body: >
      The clearest public architecture is a layered measurement system: a QUADRA platform for non-destructive high-throughput AFM and 3D imaging, additional subsurface or acoustic-imaging capability described as AUDIRA, and a supporting automation, integration, and service layer for high-volume manufacturing. A 2024 industry report says QUADRA was fully validated and deployed in a high-volume fab, while a 2026 trade article describes a proprietary multi-probe architecture and identifies the engineering burden of synchronizing probes, motion control, sensors, and data generation. Those are meaningful maturity signals, but the detailed specifications and independent acceptance tests are not public. The 2025 U.S. expansion announcement adds evidence of commercial support infrastructure, including multiple orders from a U.S. customer and a new subsidiary, without disclosing installation count, uptime, service-level performance, or repeat-order conversion.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risk
    title: Differentiation, dependencies, and controls
    body: Nearfield's differentiation is the combination of nanoscale scanning-probe measurement, non-destructive 3D information, and intended production throughput. Its claimed application range includes high-NA EUV, gate-all-around and CFET structures, hybrid-bonded 3D integration, and advanced packaging. The commercial moat therefore depends not only on physics and instrument design but also on calibration, automation, fab integration, reliability, applications engineering, and a geographically distributed support organization. Public sources do not establish patent breadth, quantified head-to-head performance, software or cybersecurity controls, formal certifications, export-control procedures, or incident history. The appropriate diligence posture is to treat the platform as technically credible and commercially advancing, while requiring customer-verified acceptance data and control documentation before underwriting production-scale defensibility.
    claimRefs: [CE009, CE010, CE011, CE012]
