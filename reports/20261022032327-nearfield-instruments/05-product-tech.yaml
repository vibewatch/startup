      - ["Motion and precision mechatronics", "Positions multiple probes and workpiece at production speed", "Mechanical stability and coordinated control", "Throughput may compromise resolution or uptime"]
      - ["3D imaging and data pipeline", "Converts measurements into process-control information", "Algorithms, data quality, and fab interfaces", "Undisclosed software validation and data-integrity controls"]
      - ["Automation and fab integration", "Enables in-line or high-volume manufacturing use", "Customer process recipes and fab standards", "Integration time, interoperability, and change-control burden"]
      - ["Manufacturing and applications support", "Builds systems and supports global deployments", "Cleanroom capacity, trained staff, and regional service", "Capacity, hiring, supply chain, and response-time risk"]
      - ["Quality, security, and compliance controls", "Protects product and customer operations", "Formal procedures, certifications, and export controls", "Public evidence does not establish controls or incident history"]
    notes: This is an analyst synthesis of roles and dependencies described in the retained product and operating evidence; the sources do not publish a complete architecture diagram or control framework.
    claimRefs: [CE006, CE007, CE010, CE011, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Nearfield's public product story links precision sensing to 3D metrology, fab integration, and regional applications support.
    data:
      layers:
        - label: Measurement hardware
          detail: AFM probes, sensors, and precision motion provide atom-scale interaction and stable positioning.
        - label: Probe coordination
          detail: A proprietary multi-probe architecture is described as increasing measurement throughput while preserving resolution.
        - label: Imaging and metrology
          detail: QUADRA provides non-destructive high-throughput 3D metrology; AUDIRA is described as subsurface imaging.
        - label: Fab operating layer
          detail: Automation and process control are intended for integration into high-volume manufacturing.
        - label: Advanced-node applications
          detail: Public application references include high-NA EUV, GAA, CFET, hybrid bonding, and advanced packaging.
        - label: Scale and support
          detail: Production expansion, applications centers, and regional customer support are part of the stated scaling plan.
    approximationNotes: The stack expresses functional layers, not a disclosed software or hardware bill of materials; AUDIRA and ULSA maturity and architecture require customer or technical documentation.
    claimRefs: [CE001, CE006, CE007, CE008, CE010]
callouts:
  - calloutType: strength
    title: Strongest product signal
    body: Public evidence combines a named platform, a reported high-volume-fab deployment, and a later U.S. customer order announcement; that is stronger than a purely conceptual instrument story, although the underlying acceptance metrics remain private.
    claimRefs: [CE005, CE008]
  - calloutType: risk
    title: Principal technical diligence risk
    body: The public record does not quantify throughput, accuracy, uptime, defect-detection performance, integration time, or cybersecurity and quality controls, leaving the most important production-scaling assumptions unverified.
    claimRefs: [CE006, CE011, CE012]
