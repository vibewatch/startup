  evidenceGaps:
    - type: missing-source
      severity: material
      topic: performance
      missingEvidence: Customer- or third-party-verified throughput, accuracy, repeatability, uptime, defect sensitivity, and integration-time data by product and application.
      whyItMatters: These metrics determine whether the product can displace incumbent tools and generate repeatable fab-level value.
      diligencePath: Obtain redacted acceptance-test reports, production qualification records, and customer references covering at least two applications.
      relatedQuestionRefs: [QE003, QE006]
    - type: private-evidence-only
      severity: material
      topic: controls
      missingEvidence: Product quality, cybersecurity, privacy, export-control, and incident-response documentation.
      whyItMatters: Semiconductor fabs impose stringent operational and information-security requirements that can block deployment even when measurement performance is strong.
      diligencePath: Request current certifications, control matrices, audit summaries, export classification, and incident history under NDA.
      relatedQuestionRefs: [QE006, QE007]
    - type: enumeration-incomplete
      severity: minor
      topic: deployment
      missingEvidence: Complete installed-base, product-line, and geographic deployment enumeration.
      whyItMatters: A single reported high-volume-fab deployment and one U.S. customer order do not establish commercial breadth or concentration risk.
      diligencePath: Request a customer-by-customer installed-base schedule, production-versus-pilot status, and regional service footprint.
      relatedQuestionRefs: [QE002, QE004]
