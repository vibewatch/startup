      - [Applications and customer support, "Applications centers, field support, and collaborative R&D", "Deployment, service contract, or project milestone", "Expansion funded as a stated use of proceeds", "Company-described; price and mix unknown", "Separate recurring service, support, and R&D revenue from equipment revenue"]
      - [Repeat customer demand, "Additional systems from an existing customer", "Purchase order", "Multiple new orders reported by an industry publication", "Third-party report; order value unknown", "Provide customer concentration, backlog aging, cancellation terms, and conversion to cash"]
    notes: "Public sources describe mechanisms and demand signals, but do not disclose recognized revenue, realized prices, or stream mix; reported orders are not treated as revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [System list price / ASP, null, low, "Determines revenue capacity and valuation comparability", "Provide list and realized price by QUADRA and AUDIRA configuration"]
      - [Service attach rate and support price, null, low, "Separates equipment economics from potentially recurring support economics", "Provide service contracts, attach rates, renewal terms, and gross margin"]
      - [Sales cycle and acceptance timing, null, low, "Determines working-capital duration and revenue timing", "Provide funnel aging, shipment-to-acceptance days, and acceptance criteria"]
      - [Gross margin and contribution margin, null, low, "Tests whether scale converts into operating leverage", "Provide product, service, warranty, and customer-specific engineering cost bridges"]
    notes: "A null means the assigned public sources did not disclose the metric; it is not a zero and should not be estimated from the financing or valuation."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Capital adequacy and financing dependency
    columns: [Input, Public value or status, Evidence quality, Underwriting implication, Diligence ask]
    rows:
      - [Series D proceeds, "$380M", "Company release reproduced by independent news source", "Large financing supports scale-up but is not cash-on-hand disclosure", "Reconcile gross proceeds, fees, committed uses, and remaining cash"]
      - [Reported Series D valuation, "$1.6B", "Reported financing valuation", "Implies a high bar for revenue and margin conversion", "Obtain cap table, preference stack, and fully diluted ownership"]
      - [Production and facility investment, "Tens of millions of euros planned for cleanrooms and related infrastructure", "Industry report citing company board member", "Signals capex and execution intensity", "Provide capex schedule, supplier terms, depreciation, and utilization plan"]
      - [Debt / flexible financing facility, "Facility reported; amount and draw not disclosed", "Secondary financial database", "Could extend capacity but introduces repayment and covenant risk", "Provide facility agreement, drawn balance, covenants, maturity, and security"]
      - ["Cash, burn, and runway", null, "Not publicly disclosed in assigned sources", "Liquidity cannot be assessed from funding raised alone", "Provide monthly cash bridge, burn, runway, and next-round trigger"]
    notes: "Funding raised, valuation, and a financing facility are distinct from cash available; undisclosed fields remain gaps rather than inferred values."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]

