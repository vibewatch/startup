callouts:
  - calloutType: strength
    title: Commercial validation is visible
    body: "High-volume-manufacturing qualification, reported repeat orders, and a fully booked 2025 schedule support a credible demand thesis, although none of these signals substitutes for recognized revenue or cash collection."
    claimRefs: [CI001, CI003, CI004]
  - calloutType: risk
    title: Liquidity and margin are not underwritten
    body: "The public record does not disclose cash, burn, runway, gross margin, pricing, or debt terms; the $380M raise should not be treated as unrestricted cash available."
    claimRefs: [CI009, CI012, CI014]
  - calloutType: recommendation
    title: Require a shipment-to-cash bridge
    body: "Before underwriting the $1.6B valuation, obtain order, shipment, acceptance, revenue-recognition, service-cost, capex, and liquidity schedules by product and customer."
    claimRefs: [CI005, CI008, CI011, CI014]

