company:
  name: Nearfield Instruments
chapter:
  number: 4
  title: Financials
  summary: Nearfield has public evidence of substantial financing, expanding orders, and production investment, but it does not disclose the revenue, margin, cash, burn, or installed-base data needed for conventional underwriting. The financial case therefore rests on commercial validation and capital deployment signals rather than reported operating metrics.
sections:
  - id: monetization-and-commercial-traction
    title: Monetization and commercial traction
    body: Nearfield appears to monetize primarily through sales of specialized semiconductor metrology systems, with additional economics likely attached to deployment, support, applications work, and future product lines, although public sources do not separate those streams. The company describes QUADRA as available for ordering and AUDIRA as a second product, while a February 2025 release says multiple systems were ordered by a US customer. A 2024 industry account says the 2025 order schedule was fully booked and that multiple new orders came from an existing client. These are meaningful demand signals, but they are not revenue, backlog, realized price, or recognized-margin disclosures. The evidence also remains company-controlled or derivative for the most specific commercial claims, so an investor should require contract-level bookings, shipment, acceptance, and revenue-recognition data before treating the order momentum as recurring growth.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing and unit economics
    body: No public source in the assigned pool provides a list price, realized system price, service attach rate, gross margin, customer acquisition cost, sales-cycle duration, payback period, or contribution margin. That absence is consequential because a capital-equipment vendor can show strong bookings while still carrying long commissioning cycles, high field-service costs, inventory commitments, and customer-specific engineering. The public evidence supports a product-sale model and identifies planned spending on cleanrooms, automated testing, cybersecurity, and support, but it does not establish the unit economics of those investments. Pricing should therefore be treated as unavailable rather than inferred from the financing round or from competitor multiples.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: "The June 2026 Series D provides a large disclosed financing event: $380 million at a reported $1.6 billion valuation, with proceeds described for production capacity, global applications centers, customer support, and collaborative R&D. A separate source reports a flexible ING financing facility, but the public record does not disclose cash on hand, debt drawn, covenant terms, monthly burn, runway, capex schedule, or the next financing trigger. The 2024 expansion account describes planned investments of tens of millions of euros in cleanrooms, office space, cybersecurity, and automated test systems, indicating material working-capital and delivery-execution needs. The funding is a capital-adequacy signal, not proof of cash available after commitments; the central diligence question is whether production scale and support expansion convert the order book into gross-profit-generating shipments before the next capital requirement."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: financial-evidence-gaps
    title: Financial evidence gaps
    body: "The available evidence is sufficient to frame a financing and monetization hypothesis, but not to calculate a revenue multiple, cash runway, gross-margin path, or return profile. The most important missing package is a monthly bridge from orders to accepted shipments to recognized revenue and cash collection, reconciled to production capacity and field-service obligations. Management should also provide customer concentration, backlog aging, warranty and service reserves, inventory turns, supplier payment terms, debt documents, and a forward capex plan. Until those items are available, the appropriate financial posture is research-more: commercial validation is credible, while the economics and liquidity profile remain underdetermined."
    claimRefs: [CI008, CI011, CI012, CI014]

