  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Public price / contract signal
      - Included capabilities
      - Discount / unknowns
      - Implication
    rows:
      - - Divert integrated platform
        - Dynamic pricing and optimized material routing; no public list price
        - Reverse logistics, depackaging, destruction, energy recovery, and data loop
        - Minimum volume, term length, and value-share mechanics undisclosed
        - Buyers likely evaluate total operating outcome, not a posted fee card
      - - Landfill / incineration status quo
        - No public contract pricing in assigned pool
        - Disposal endpoint only
        - Service mix and embedded hauling economics unknown
        - Familiar option can still win when buyers optimize for simplicity
      - - Centralized compost / AD / dehydrator providers
        - ReFED describes category economics, not vendor tariffs
        - Pre-processing or downstream organics diversion
        - Public per-unit economics absent in assigned pool
        - Adjacent vendors can narrow the spread where regulation forces diversion
      - - In-store waste-to-feed pilot
        - Whole Foods hopes feed can cost less than traditional feed
        - In-store processing, feed output, and upstream waste tracking
        - Capex, opex, and store labor requirements are undisclosed
        - Could be attractive where a grocer can absorb in-store workflow change
    notes: >-
      Assigned evidence provides directional pricing signals rather than comparable fee schedules,
      so this table distinguishes public commercial signals from the larger undisclosed contract layer.
    claimRefs: [CP006, CP010, CP014, CP015, CP016]
