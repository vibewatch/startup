      yAxis:
        label: Prevention plus value-recovery depth
        min: 1
        max: 5
        low: Disposal-only
        high: Prevention plus multi-output recovery
        description: Ordinal positioning derived from assigned source descriptions
        scale: ordinal
      points:
        - label: Landfill / incineration
          x: 1
          y: 1
          summary: Disposal endpoint with little recovery and continuing high retail share.
          claimRefs: [CP009]
        - label: Donation + manual sort
          x: 2
          y: 3
          summary: High-priority edible pathway but incomplete for non-donatable food.
          claimRefs: [CP008, CP009]
        - label: Centralized compost / AD providers
          x: 4
          y: 3
          summary: Diversion infrastructure exists, but contamination and downstream access constrain results.
          claimRefs: [CP011, CP012, CP014]
        - label: In-store waste-to-feed
          x: 5
          y: 4
          summary: Decentralized pilot pairs prevention data with feed output, but scaling is early.
          claimRefs: [CP010, CP011]
        - label: Internal build
          x: 4
          y: 2
          summary: Highest control, but manual depackaging and store labor can make execution heavier.
          claimRefs: [CP013]
        - label: Divert integrated platform
          x: 4
          y: 5
          summary: National outsourced platform combining prevention, donation, routing, depackaging, and energy recovery.
          claimRefs: [CP001, CP003, CP004, CP007, CP015]
    approximationNotes: >-
      Coordinates are evidence-backed ordinal judgments from the assigned pool, not source-published
      benchmark scores or market-share percentages.
    claimRefs: [CP001, CP003, CP004, CP007, CP009, CP010, CP011, CP013, CP015]
