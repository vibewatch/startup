  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: underwriting-gap
      missingEvidence: Monthly revenue, gross margin, facility-level P&L, current cash, burn, runway, and cap table information.
      whyItMatters: These are the core inputs required to underwrite valuation, financing dependency, and downside protection.
      diligencePath: Request FY2024-FY2026 monthly management accounts, facility-level income statements, a cash bridge, and current capitalization tables.
      relatedQuestionRefs: [QI007, QI008]
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Sample customer contracts, minimum-volume commitments, fee schedules, and any standalone analytics pricing.
      whyItMatters: Public value claims do not reveal realized pricing, contract stickiness, or whether software economics exist separately from services.
      diligencePath: Request representative retailer, manufacturer, and partner contracts plus the pricing approval matrix.
      relatedQuestionRefs: [QI001, QI002]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: output-economics
      missingEvidence: RNG and fertilizer offtake contracts, realized prices, hedge policy, and yield-per-ton assumptions by facility.
      whyItMatters: Output monetization can change gross margin meaningfully, especially if plant economics are commodity-linked.
      diligencePath: Request current offtake agreements, plant yield curves, and a sensitivity table for gas-price and utilization changes.
      relatedQuestionRefs: [QI004, QI005]
      relatedTableRefs: [TI001, TI003]
    - type: conflicting-data
      severity: material
      topic: traction
      missingEvidence: A reconciled KPI definition and measurement date for customer locations and processed-volume metrics.
      whyItMatters: Inconsistent public scale metrics weaken comparability across periods and reduce confidence in commercial-traction narratives.
      diligencePath: Request the company's KPI glossary and quarter-end metric history for customer locations, active sites, and pounds processed.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: leadership-risk
      missingEvidence: Public or private confirmation of the current COO or equivalent operations leader and the post-transition operating structure.
      whyItMatters: Facility rollout and execution discipline depend on stable operational leadership during a capital-intensive expansion period.
      diligencePath: Request the current operating org chart, role descriptions, and board-approved succession updates since March 2025.
      relatedQuestionRefs: [QI008]
