schemaVersion: "report-v2"
artifact: financials
slug: divert
runDate: 2026-10-16
company:
  name: Divert
chapter:
  number: 4
  title: Financials
  summary: >-
    Divert's public revenue model is understandable at a process level—enterprise diversion and destruction services,
    analytics-enabled waste prevention, and downstream RNG/fertilizer outputs—but not at an underwriting level because
    pricing, revenue, margin, and cash metrics remain undisclosed. Public capital signals point to a highly
    infrastructure-heavy rollout: Divert announced fresh 2026 funding for new facilities, while earlier reporting tied
    the platform to large prior capital commitments and a 30-site ambition.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization architecture
    body: >-
      Divert publicly describes a bundled operating model rather than a clean, disclosed software or commodity revenue
      line. The company markets reverse logistics, certified destruction, donation optimization, analytics, and
      regulatory support as one end-to-end offer for grocers, manufacturers, warehouses, and distributors, then
      monetizes downstream outputs by converting unsold, non-donatable food into renewable natural gas, fertilizer, and
      soil amendments. The value narrative emphasizes waste-hauling savings, better purchasing decisions, brand-safe
      destruction, and compliance support, but the assigned public pages do not expose list pricing, contract minimums,
      revenue mix, or whether analytics is sold separately versus bundled into service contracts. A Waste Today partner
      example adds one important clue: Divert says it uses dynamic pricing and optimized material routing for a
      multi-site destruction program, which implies negotiated pricing tied to volume and logistics complexity rather
      than a standard rate card. That makes the commercial logic legible, but not the realized unit economics.
    claimRefs: [CI001, CI002, CI003, CI006, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics-proxies
    title: Public traction and unit-economics proxies
    body: >-
      Public traction evidence is directionally positive but unevenly defined. Divert's homepage currently advertises
      7.8K customer locations and 4.2 billion pounds processed, while another official Divert page cites 6,683
      customer locations and Waste Today reports more than 7,800 customer locations across the food supply chain. Those
      figures support real scale, but the differences indicate shifting vintages or changing KPI definitions rather than
      a stable audited metric. The most concrete customer-outcome evidence is a company case study in which a
      190-store grocery rollout reportedly reduced unsold-food tonnage by 9% over five years while increasing sales.
      Waste Today's US Cold example adds a second operating proxy: 1,250 tons handled across seven facilities over 15
      months, with dynamic pricing and routed flows into Turlock's anaerobic digestion system. Together these sources
      suggest the business can create customer value and route density, but they still stop short of revealing take
      rates, contribution margins, or payback.
    claimRefs: [CI004, CI005, CI006, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-needs-and-underwriting-blockers
    title: Capital needs and underwriting blockers
    body: >-
      The capital story is clearer than the income statement, and that asymmetry is the chapter's central diligence
      issue. January 2026 funding was announced specifically to support growing operations and the Longview and
      Lexington facility buildout, yet Bioenergy International says the amount was not disclosed. Earlier reporting
      adds scale context: Waste Dive says Ara Partners injected $100 million in 2021, Enbridge committed $1 billion in
      2023 to scale RNG capacity, and management planned a 30-location network. That combination implies a business
      model with substantial project-style capital requirements, but public materials reviewed here still do not expose
      revenue, ARR, gross margin, capex per facility, working-capital needs, burn, or current cash. A further
      execution wrinkle is that Waste Dive reported in March 2025 that Divert had not yet publicly named a COO
      replacement, which matters because the next leg of value creation depends on opening and operating more
      infrastructure, not just signing customers.
    claimRefs: [CI007, CI008, CI009, CI010, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Retail diversion and reverse logistics
        - Enterprise service contracts for collection, landfill diversion, donation optimization, and compliance support
        - Per store or site contract; public exact unit undisclosed
        - Public pages describe the workflow but do not publish rate cards
        - Medium
        - Request sample retailer MSAs/SOWs with fee floors, per-site charges, and renewal terms
      - - Manufacturer destruction and depackaging
        - Processing and certified-destruction fees for residual, contaminated, or recalled food products
        - Per load or per ton contract; public exact unit undisclosed
        - Service is marketed publicly, but realized pricing is not disclosed
        - Medium
        - Request realized fee schedules by product type, contamination status, and logistics profile
      - - Analytics and RFID waste visibility
        - Data tracking, benchmarking, coaching, and waste-prevention support layered onto customer programs
        - Likely bundled service or subscription; public packaging undisclosed
        - Case evidence confirms deployment, but standalone monetization is not public
        - Low
        - Request software-versus-service revenue split and any standalone analytics pricing
      - - RNG, fertilizer, and soil-amendment outputs
        - Monetization of processed organics after depackaging and anaerobic digestion
        - MMBtu and output-volume sales; public realized prices undisclosed
        - Output streams are public, but offtake economics are not
        - Medium
        - Request output volumes, realized prices, counterparties, and gross margin by output stream
    notes: >-
      Public sources establish the service categories and output streams; "undisclosed" means the assigned public pages
      did not provide list pricing or contract terms.
    claimRefs: [CI001, CI002, CI003, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public pricing signal
      - Realized pricing disclosure
      - Evidence
      - Implication
    rows:
      - - Retail reverse logistics and diversion
        - No public rate card; value pitch emphasizes lower hauling costs and regulatory compliance
        - None
        - Official pages frame customer value through savings and compliance, not list prices
        - Negotiated enterprise pricing likely varies by store count, route density, and service scope
      - - Certified destruction and processing
        - No public rate card
        - None
        - Divert markets certified destruction for contaminated and recall-related goods without price disclosure
        - Revenue quality depends on contract mix, urgency premiums, and contamination complexity that are not visible
      - - Multi-site destruction for partners
        - Dynamic pricing reported in an operating example
        - None
        - Waste Today says Divert used "dynamic pricing and optimized material routing" in the US Cold program
        - Route economics and utilization likely drive realized margins more than sticker prices
      - - RNG and recovered outputs
        - Commodity-linked output sales rather than posted list pricing
        - None
        - Turlock output streams are described publicly, but no offtake prices or hedge terms are disclosed
        - Gross profit could swing with commodity prices and contract structure
    notes: >-
      This table records what the assigned public sources do and do not disclose; it does not infer undisclosed fee
      levels or margins.
    claimRefs: [CI002, CI003, CI006, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Customer scale KPI
        - Homepage says 7.8K customer locations; another official page says 6,683; Waste Today says more than 7,800
        - Medium
        - Indicates real commercial footprint, but public KPI definitions and measurement dates are inconsistent
        - Provide KPI glossary distinguishing customer locations, active sites, and cumulative relationships
      - - Processed volume proxy
        - Homepage says 4.2B pounds processed; Turlock capacity is 100,000 tons annually
        - Medium
        - Suggests meaningful throughput but not revenue conversion, utilization, or gross margin
        - Provide facility-level throughput, utilization, revenue yield, and margin by ton
      - - Customer outcome proxy
        - 190-store rollout; 9% reduction in unsold-food tons over five years; significant increase in sales
        - Medium
        - Supports an ROI story, but not Divert's take rate, savings split, or payback period
        - Provide before/after economics including fees, labor savings, shrink reduction, and payback
      - - Route-density / logistics proxy
        - 1,250 tons handled from seven facilities over 15 months with dynamic pricing
        - Medium
        - Suggests utilization and logistics complexity shape pricing and contribution margins
        - Provide route economics, average haul distances, and gross profit per ton by program type
      - - Commodity exposure proxy
        - Henry Hub spot price rose from $3.12/MMBtu to $4.98/MMBtu in one EIA report week
        - Low
        - Highlights how output monetization could be volatile if RNG pricing is unhedged or index-linked
        - Provide RNG offtake formulas, hedge policy, and sensitivity of plant EBITDA to gas prices
    notes: >-
      Values mix company-claimed operating metrics, third-party reported examples, and an external commodity benchmark;
      they are proxies, not a substitute for disclosed Divert financial statements.
    claimRefs: [CI004, CI005, CI006, CI011, CI012, CI013, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Divert converts customer waste-handling workflows into service revenue and downstream recovered-product value, but
      the public sources do not disclose the pricing or gross-profit handoffs between stages.
    data:
      nodes:
        - id: source-stream
          label: Unsold food generated by retailers, warehouses, distributors, and manufacturers
          detail: Input stream that creates waste-hauling, compliance, destruction, and shrink-reduction needs.
        - id: service-layer
          label: Collection, reverse logistics, donation, and certified destruction services
          detail: Commercial front end sold as tailored enterprise programs rather than posted rate cards.
        - id: analytics-layer
          label: RFID tracking, benchmarking, and customer coaching
          detail: Data layer intended to reduce shrink and improve purchasing decisions over time.
        - id: processing-layer
          label: Depackaging and anaerobic digestion at Integrated Diversion & Energy facilities
          detail: Turlock is operating; Longview and Lexington were identified as expansion projects in the 2026 funding announcement.
        - id: output-layer
          label: RNG, fertilizer, soil amendments, and recovered water
          detail: Downstream monetization exists, but public offtake pricing and gross margins are undisclosed.
        - id: value-layer
          label: Customer savings, compliance support, and circularity outcomes
          detail: Public value claims emphasize lower hauling costs, better merchandising, and landfill-diversion compliance.
      edges:
        - from: source-stream
          to: service-layer
        - from: service-layer
          to: analytics-layer
        - from: analytics-layer
          to: processing-layer
        - from: processing-layer
          to: output-layer
        - from: output-layer
          to: value-layer
    claimRefs: [CI001, CI002, CI006, CI007, CI015]
callouts:
  - calloutType: insight
    title: Public traction is real, but public economics remain one layer too shallow
    body: >-
      Divert has enough public evidence to show scale and customer value creation, including thousands of customer
      locations, billions of pounds processed, and named customer-outcome examples, but none of the assigned sources
      bridge those operating proofs into disclosed revenue yield, contribution margin, or customer payback.
    claimRefs: [CI004, CI005, CI011, CI012, CI013, CI014]
  - calloutType: risk
    title: Capital adequacy cannot be underwritten from public sources
    body: >-
      The company is still building infrastructure, has relied on large outside capital commitments, and announced new
      2026 funding without disclosing the amount; absent cash, burn, and capex disclosure, investors cannot determine
      whether the next facility wave is fully funded or what milestone triggers the next financing need.
    claimRefs: [CI007, CI008, CI009, CI010, CI014, CI016]
