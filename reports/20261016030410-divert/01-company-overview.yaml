company:
  name: "Divert"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Divert is a 2007-founded food-waste infrastructure company that says it now supports
    more than 7,800 customer locations through a vertically integrated model spanning
    prevention data, food recovery, and anaerobic-digestion outputs. Public sources
    support current expansion momentum and multiple financing signals, but revenue,
    headcount, exact 2026 round economics, and confirmed COO succession remain
    undisclosed in the assigned evidence set.
sections:
  - id: "identity-and-model"
    title: "Identity, scope, and operating model"
    body: >-
      Divert's current public positioning is consistent across its website and recent
      releases: the company was founded in 2007, describes itself as a circular-economy
      business focused on preventing food from being wasted, and says its model combines
      data-led prevention, edible-food recovery, and conversion of unsold non-donatable
      material into renewable energy and fertilizer. The current operating scope is
      broad rather than single-vertical; Divert markets the platform to grocery
      retailers, food warehouses and distributors, and food manufacturers. Scale claims
      are directionally strong for a private company, with current company materials
      and recent reporting aligning around more than 7,800 customer locations, but
      the underlying commercial mix and revenue contribution by segment are not publicly
      broken out in the assigned pool.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership, governance, and key-person dependence"
    body: >-
      Leadership continuity still centers on the two co-founders. Independent reporting
      identifies Ryan Begin and Nick Whitman as the original founders, and the March
      2025 leadership change shows that founder risk is not theoretical: Whitman left
      the COO seat for a board and strategic-advisor role after nearly 18 years in
      day-to-day operations. The January 2026 financing announcement also shows outside
      governance influence increasing, with additional board appointments tied to fresh
      capital support. That combination cuts both ways for diligence. It broadens
      industrial and energy oversight, but public evidence still does not confirm the
      permanent COO replacement or a full committee-level governance map, so execution
      depth below Begin remains a live diligence question.
    claimRefs: ["CO008", "CO013", "CO014"]
    tableRefs: ["TO002"]
  - id: "capital-base-and-stakeholders"
    title: "Capital base, valuation signals, and stakeholder map"
    body: >-
      Divert's public financing record points to a capital-intensive infrastructure
      story rather than a lightweight software business. TechCrunch reported a 2023
      package of Ara and Enbridge funding plus a large structured-finance commitment,
      the January 2026 company release disclosed fresh funding led by Wittington
      Investments, and transaction counsel said the April 2026 Mitsubishi partnership
      made Mitsubishi the lead investor in a Series C round while taking valuation
      above $1 billion. Those datapoints collectively support that Divert can still
      attract strategic and financial capital, but they do not reveal total shares
      sold, pre-money valuation mechanics, debt covenants, board rights, or current
      ownership concentration. Those missing details matter because the business is
      simultaneously scaling physical facilities, logistics, and energy commercialization.
    claimRefs: ["CO008", "CO009", "CO010", "CO011", "CO012"]
    tableRefs: ["TO003"]
  - id: "milestones-and-open-questions"
    title: "Milestones, operating traction, and unresolved disclosure gaps"
    body: >-
      The dated record shows a company moving from a long-gestation waste-diversion
      operator toward a more explicit infrastructure platform. Public milestones span
      founding in 2007, sponsor-backed scaling in 2021 and 2023, a 2025 founder-role
      transition, and a 2026 sequence of new funding, strategic partnership activity,
      and operational case studies. The strongest recent proof point is not financial
      disclosure but operational evidence: Divert and partner reporting describe a
      California program with United States Cold Storage that processed more than
      2.5 million pounds of unsold product from seven facilities in its first 15 months.
      What remains missing is exactly what later diligence chapters will need most:
      current revenue, margin, headcount, facility-level economics, and a clean read
      on post-transition operating leadership.
    claimRefs: ["CO001", "CO005", "CO007", "CO011", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
