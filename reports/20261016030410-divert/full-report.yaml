chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and operating model
        blocks:
          - type: paragraph
            body: >-
              Divert's current public positioning is consistent across its website and recent releases: the company was
              founded in 2007, describes itself as a circular-economy business focused on preventing food from being
              wasted, and says its model combines data-led prevention, edible-food recovery, and conversion of unsold
              non-donatable material into renewable energy and fertilizer. The current operating scope is broad rather
              than single-vertical; Divert markets the platform to grocery retailers, food warehouses and distributors,
              and food manufacturers. Scale claims are directionally strong for a private company, with current company
              materials and recent reporting aligning around more than 7,800 customer locations, but the underlying
              commercial mix and revenue contribution by segment are not publicly broken out in the assigned pool.
