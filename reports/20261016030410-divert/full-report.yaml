      - number: '2.2'
        title: Public sizing lenses bound the opportunity but do not produce a clean SAM
        blocks:
          - type: paragraph
            body: >-
              Independent market data supports a large underlying waste stream, but the available figures are lenses,
              not a ready-made SAM. ReFED estimates 70 million total tons of U.S. surplus food in 2024, worth $380
              billion and equal to about 29% of the food supply. Applying ReFED's sector mix to that total suggests
              roughly 29.7 million tons across manufacturing, foodservice, and retail, with retail alone near 4.0
              million tons; those are useful directional bounds because they overlap the verticals Divert names, but
              they are still derived estimates. EPA adds a different lens by showing how little of relevant waste is
              already processed through anaerobic digestion, especially outside manufacturing. The result is a credible
              large opportunity with no public dataset that cleanly isolates Divert's monetizable regional, segment, or
              facility-level serviceable market.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM002
