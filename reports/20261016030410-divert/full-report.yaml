              - CE008
              - CE011
      - number: '5.3'
        title: Maturity signals and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              Divert appears differentiated because it combines upstream data capture with downstream owned or aligned
              processing infrastructure, which is harder to replicate than offering analytics or hauling alone. Scale
              claims on the homepage and in third-party summaries reinforce that the platform has moved beyond pilot
              status. The main product risk is not whether depackaging exists; it is whether the category can keep
              scaling without tighter standards for outputs, especially where digestate, packaging residue, and
              regulatory expectations intersect. The assigned pool also leaves material blind spots around
              software-security controls, privacy handling, uptime commitments, and named systems integrations, so
              product diligence still requires technical documentation rather than only marketing proof.
            claimRefs:
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated workflow is the core product advantage
            body: >-
              Divert's defensibility is the combination of data capture, reverse logistics, and conversion
              infrastructure in one customer workflow, not any single module in isolation.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE011
          - type: callout
            title: Depackaging governance remains a live technical risk
            body: >-
              Public evidence still does not close the loop on microplastics measurement, packaging-residue handling, or
              Divert-specific output testing, which matters because those issues sit inside the company's core
              processing model.
            calloutType: risk
            claimRefs:
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix and buying motion
        blocks:
          - type: paragraph
            body: >-
              Divert's public customer story is still retail-first, but the offer is broader than a grocery
              waste-hauling program. Company materials explicitly group grocery retailers, food warehouses and
              distributors, and food manufacturers as target customers, then tailor the pitch by buyer pain point:
              retailers get reverse logistics, analytics, donation optimization, and field coaching; warehouses and
              manufacturers get certified destruction, depackaging, recall support, and compliance help. That breadth
              matters because it suggests Divert is trying to sell a bundled operating workflow into multiple points of
              the food supply chain, not a single disposal service, but the current evidence still shows grocery as the
              clearest adoption surface and the best-documented user workflow.
            claimRefs:
              - CU001
              - CU002
