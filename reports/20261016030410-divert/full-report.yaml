      - number: '6.2'
        title: Deployment proof and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Public proof of real adoption is concrete enough to clear the logo-only bar. Divert says it added more
              than 1,500 retail stores and grew its retail customer base by more than 40% over the two years ending
              August 2022, then now claims support for 7.8K customer locations across the food supply chain. The
              strongest production evidence is a 190-store Mid-Atlantic grocery deployment that started in 2017 and a US
              Cold program spanning seven California facilities over 15 months, with Oatly cited as a downstream brand
              beneficiary. Waste Dive also names Kroger as an example customer and reports that Turlock capacity was
              nearly fully contracted in March 2025, which is a useful demand signal even though revenue conversion and
              renewal terms remain undisclosed.
            claimRefs:
              - CU004
              - CU006
              - CU007
