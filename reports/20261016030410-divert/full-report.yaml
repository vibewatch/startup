              - CR004
              - CR005
              - CR009
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: The service promise is operationally dense and partner dependent
        blocks:
          - type: paragraph
            body: >-
              Divert is not selling a light-touch software workflow; it is selling reverse logistics, certified
              destruction, depackaging, analytics, field support, and anaerobic-digestion throughput across multi-site
              food networks. A company case study says three grocery customers backhauled unsold food from more than 466
              stores into Divert's process, and Waste Today says the US Cold program alone depended on seven California
              facilities routing material into Turlock over a 15-month span. Those same sources also show the
              mitigations Divert emphasizes: dynamic pricing, optimized routing, documentation, customer-success teams,
              and compliance support. The core risk is that any facility-ramp miss, contamination event, data-quality
              error, or logistics breakdown can hit multiple customer outcomes at once because compliance, brand
              integrity, and waste removal are bundled together in the service promise.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
      - number: '7.3'
        title: Expansion still depends on capital, leadership execution, and cleaner metrics
        blocks:
          - type: paragraph
            body: >-
              March 2025 marked a meaningful management handoff: co-founder Nick Whitman stepped out of day-to-day
              operations, Bob Watkins moved up from CIO to COO, and public reporting describes Whitman's prior remit as
              spanning functions well beyond operations. That transition is happening while Divert is still building out
              Longview and Lexington and continues to describe a much larger national-facility ambition, which raises
              the cost of any commissioning delay or management misalignment. Public KPI discipline also remains weaker
              than an investor should accept at face value: official and third-party materials cite more than 5,600,
              6,683, and 7,800 customer locations without a visible bridge between definitions or as-of dates. The
              practical implication is not that the business lacks traction, but that capital efficiency, concentration,
              and ramp progress still require management-pack evidence rather than website-level trust.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              Treat a material delay in Longview or Lexington commissioning, combined with tighter digester-policy or
              financing conditions, as a thesis-break event because the growth plan and route-density economics both
              rely on additional physical capacity.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR012
              - CR016
          - type: callout
            title: Highest-priority diligence pack
            body: >-
              The next diligence round should request facility permits and incident history, top-customer concentration,
              destruction-audit controls, metric definitions, and facility-level financing sensitivity before any
              valuation-sensitive recommendation is upgraded.
            calloutType: assumption
            claimRefs:
