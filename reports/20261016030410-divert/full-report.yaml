      - number: '3.3'
        title: Durability depends on contamination control, capital access, and whether decentralized models scale
        blocks:
          - type: paragraph
            body: >-
              The moat is meaningful but not unassailable. Divert's capital-market position appears stronger than a
              local processor's because the Mitsubishi deal combines equity with preferred RNG offtake rights,
              reinforcing a model that monetizes waste handling and downstream energy. But ReFED also frames the
              category as one attracting fresh capital and warns that depackaging solutions can create PFAS or
              microplastics contamination risk if outputs are not kept clean. At the same time, Mill and Whole Foods are
              testing a different architectural answer: decentralized in-store processing tied to AI/computer-vision
              waste data and lower-cost feed ambitions. Food Tank also highlights the constraint on that pathway—food
              safety, logistics, and limited infrastructure still slow animal-feed adoption—so decentralized entrants do
              not yet eliminate the case for Divert's centralized network. The practical conclusion is that Divert looks
              strongest in complex, multi-site, compliance-heavy flows and less differentiated where a buyer can
              separate one stream and solve it with a simpler disposal or feed pathway.
            claimRefs:
              - CP007
              - CP010
