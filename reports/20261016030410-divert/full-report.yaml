              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
              - CV016
      - number: '8.2'
        title: Financing context and benchmark limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports the view that Divert is still in an expansion and capital deployment phase rather
              than a transparently harvestable cash-flow phase. The January 2026 funding announcement says Wittington
              led a new financing and says Longview and Lexington are expected to commence operations later in 2026,
              while Turlock is already positioned as a 100,000-ton annual facility. WasteDive's historical financing
              summary adds context: Ara injected $100 million in 2021 and Enbridge committed $1 billion in 2023 to scale
              RNG capacity. That capital history raises the underwriting bar for any new round because it implies a
              large infrastructure story, but the latest public financing disclosure still does not give the terms
              needed to judge whether the new money came in at an attractive, flat, or dilutive price. The RNG Coalition
              confirms the existence of an organized North American RNG sector but supplies no transaction multiple,
              while Anaergia's disclosed 2026 revenue, margin, EBITDA, and backlog are useful directional operating
              markers. Neither source can carry a priced multiple comparison without matched Divert financials and
              business-model adjustments.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is driven less by whether Divert has built something useful and more by whether it can
              prove durable economics at scale. The retained sources support a credible platform story: Divert describes
              an integrated stack spanning reverse logistics, depackaging, anaerobic digestion, analytics, and
              compliance support, and third-party reporting shows that customer programs are producing measurable
              landfill diversion and RNG output. The bear side comes from disclosure quality and execution uncertainty,
              not from an outright product failure in public view. Company-controlled pages with no visible publication
              dates report differently defined scale figures, so their 6,683-location and 7.8K-location values cannot be
              treated as a same-period growth series. WasteDive also documents a COO transition whose replacement
              details were still pending in the public record it cited. Before moving beyond track mode, an investor
              should demand current round documents, normalized facility economics, and dated, definition-consistent
              management and operating KPI disclosure.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Public-market discipline: stay in track mode'
            body: >-
              The public record validates demand and infrastructure buildout, but it does not validate the current entry
              price. Without current round terms, matched financial disclosure, and refreshed leadership/operating KPI
              visibility, the investment case is not yet underwriteable as a buy.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV014
              - CV015
