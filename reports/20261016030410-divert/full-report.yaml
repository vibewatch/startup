  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Divert still looks like a company worth tracking, not a company that can be underwritten confidently at an
              undisclosed entry price. The retained 2026 financing sources confirm continued investor appetite and
              active infrastructure expansion, and third-party operating evidence shows the platform can deliver real
              diversion and RNG outcomes. But the same public record leaves out the latest round's amount, valuation,
              and preference stack, while also offering no retained public revenue, margin, or cash disclosure. In
              valuation terms, that means the thesis is evidence-bearing but the price is not. The disciplined posture
              is therefore track / research more, with any change in recommendation contingent on disclosed round terms
              plus lender-grade operating economics.
            claimRefs:
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
