  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Divert actually delivers
        blocks:
          - type: paragraph
            body: >-
              The product is not just a recycling endpoint. Divert markets an end-to-end operating model built around
              three linked outcomes - prevent waste, recover edible food, and convert non-donatable material into energy
              and soil products. In practice, that means the customer-facing offer spans store or facility data capture,
              reverse logistics, donation optimization, secure destruction, compliance support, and downstream
              processing. The strongest evidence is still company-issued, but it is specific enough to show that Divert
              sells an operational system embedded in grocery, warehouse, and food-manufacturing workflows rather than a
              single software module or hauling contract.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
