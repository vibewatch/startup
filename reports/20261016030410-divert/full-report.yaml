      - number: '3.2'
        title: Divert differentiates on workflow breadth and routing flexibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently describes Divert as an end-to-end platform for grocery retailers, warehouses,
              distributors, and manufacturers rather than a niche recycler. Official surfaces emphasize regulatory
              compliance support, reverse logistics, certified destruction, donation optimization, and data analytics,
              while independent coverage shows those capabilities surfacing in real operating programs. The Safeway
              example is important because it ties the platform to measurable store behavior change, with higher food
              donation volumes alongside downstream renewable-energy conversion for inedible material. The US Cold case
              adds a different angle: variable destruction volumes, seasonality, and multi-site routing problems are
              where Divert argues traditional service models break down, and where dynamic pricing plus material routing
              can matter. That combination creates switching cost through process redesign and operating integration,
              not through transparent posted prices.
