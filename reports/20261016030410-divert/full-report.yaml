      plus value-recovery scope they appear to offer in the assigned evidence.
    data:
      xAxis:
        label: Processing control / infrastructure intensity
        min: 1
        max: 5
        low: Asset-light outsourced
        high: Embedded or owned operating infrastructure
        description: Ordinal positioning derived from assigned source descriptions
        scale: ordinal
      yAxis:
        label: Prevention plus value-recovery depth
        min: 1
        max: 5
        low: Disposal-only
        high: Prevention plus multi-output recovery
        description: Ordinal positioning derived from assigned source descriptions
        scale: ordinal
      points:
