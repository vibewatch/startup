      - number: '4.3'
        title: Capital needs and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The capital story is clearer than the income statement, and that asymmetry is the chapter's central
              diligence issue. January 2026 funding was announced specifically to support growing operations and the
              Longview and Lexington facility buildout, yet Bioenergy International says the amount was not disclosed.
              Earlier reporting adds scale context: Waste Dive says Ara Partners injected $100 million in 2021, Enbridge
              committed $1 billion in 2023 to scale RNG capacity, and management planned a 30-location network. That
              combination implies a business model with substantial project-style capital requirements, but public
              materials reviewed here still do not expose revenue, ARR, gross margin, capex per facility,
              working-capital needs, burn, or current cash. A further execution wrinkle is that Waste Dive reported in
              March 2025 that Divert had not yet publicly named a COO replacement, which matters because the next leg of
              value creation depends on opening and operating more infrastructure, not just signing customers.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public traction is real, but public economics remain one layer too shallow
            body: >-
              Divert has enough public evidence to show scale and customer value creation, including thousands of
              customer locations, billions of pounds processed, and named customer-outcome examples, but none of the
              assigned sources bridge those operating proofs into disclosed revenue yield, contribution margin, or
              customer payback.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI012
              - CI013
              - CI014
          - type: callout
            title: Capital adequacy cannot be underwritten from public sources
            body: >-
              The company is still building infrastructure, has relied on large outside capital commitments, and
              announced new 2026 funding without disclosing the amount; absent cash, burn, and capex disclosure,
              investors cannot determine whether the next facility wave is fully funded or what milestone triggers the
              next financing need.
            calloutType: risk
