      - number: '5.2'
        title: How the platform works in the field
        blocks:
          - type: paragraph
            body: >-
              The clearest proof of technical and operational maturity comes from published workflow details. Divert's
              retailer case study shows monthly RFID-based store tracking tied to waste-reduction decisions, while Waste
              Dive's 2022 reporting described a subscription software layer combined with additional processing fees and
              a footprint of modular depackaging sites plus digesters. More recent company and trade-press disclosures
              show the same model extending to warehouses and branded-product destruction through Turlock, with routing,
              destruction documentation, and energy conversion bundled into one service. That is a stronger signal of
              real implementation than generic circular-economy messaging, although the public material still does not
              expose detailed integration architecture or implementation timelines.
            claimRefs:
              - CE004
