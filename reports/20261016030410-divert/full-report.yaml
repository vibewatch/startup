  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competitive set is buyer alternatives, not only venture peers
        blocks:
          - type: paragraph
            body: >-
              The assigned pool points to a broader competitive landscape than a narrow startup-comps list. For a
              grocery retailer or food manufacturer, the practical alternatives are the status-quo landfill or
              incineration path, donation-first sorting, internal handling, generic organics-diversion vendors, and
              newer in-store waste-to-feed systems. ReFED's 2024 landscape shows how sticky the status quo remains: only
              2.5% of total surplus food is donated, 11% goes to livestock feed, and 85% still goes to waste
              destinations, while Food Tank cites nearly 30% of retail surplus food still ending in landfills or
              incinerators. Against that baseline, Divert is not selling a single point solution; it is selling an
              outsourced operating model that combines data, donation recovery, reverse logistics, depackaging, and
              downstream energy recovery. That makes the most relevant comparison set a mix of incumbents and
              substitutes that can win on simplicity, existing routes, or special-case economics rather than a
              head-to-head software matrix alone.
            claimRefs:
              - CP001
