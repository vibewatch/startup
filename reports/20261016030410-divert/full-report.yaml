      - number: '4.2'
        title: Public traction and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction evidence is directionally positive but unevenly defined. Divert's homepage currently
              advertises 7.8K customer locations and 4.2 billion pounds processed, while another official Divert page
              cites 6,683 customer locations and Waste Today reports more than 7,800 customer locations across the food
              supply chain. Those figures support real scale, but the differences indicate shifting vintages or changing
              KPI definitions rather than a stable audited metric. The most concrete customer-outcome evidence is a
              company case study in which a 190-store grocery rollout reportedly reduced unsold-food tonnage by 9% over
              five years while increasing sales. Waste Today's US Cold example adds a second operating proxy: 1,250 tons
              handled across seven facilities over 15 months, with dynamic pricing and routed flows into Turlock's
              anaerobic digestion system. Together these sources suggest the business can create customer value and
              route density, but they still stop short of revealing take rates, contribution margins, or payback.
            claimRefs:
