  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Divert publicly describes a bundled operating model rather than a clean, disclosed software or commodity
              revenue line. The company markets reverse logistics, certified destruction, donation optimization,
              analytics, and regulatory support as one end-to-end offer for grocers, manufacturers, warehouses, and
              distributors, then monetizes downstream outputs by converting unsold, non-donatable food into renewable
              natural gas, fertilizer, and soil amendments. The value narrative emphasizes waste-hauling savings, better
              purchasing decisions, brand-safe destruction, and compliance support, but the assigned public pages do not
              expose list pricing, contract minimums, revenue mix, or whether analytics is sold separately versus
              bundled into service contracts. A Waste Today partner example adds one important clue: Divert says it uses
              dynamic pricing and optimized material routing for a multi-site destruction program, which implies
              negotiated pricing tied to volume and logistics complexity rather than a standard rate card. That makes
              the commercial logic legible, but not the realized unit economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
