        title: Capital base, valuation signals, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Divert's public financing record points to a capital-intensive infrastructure story rather than a
              lightweight software business. TechCrunch reported a 2023 package of Ara and Enbridge funding plus a large
              structured-finance commitment, the January 2026 company release disclosed fresh funding led by Wittington
              Investments, and transaction counsel said the April 2026 Mitsubishi partnership made Mitsubishi the lead
              investor in a Series C round while taking valuation above $1 billion. Those datapoints collectively
              support that Divert can still attract strategic and financial capital, but they do not reveal total shares
              sold, pre-money valuation mechanics, debt covenants, board rights, or current ownership concentration.
              Those missing details matter because the business is simultaneously scaling physical facilities,
              logistics, and energy commercialization.
