              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM011
              - CM014
      - number: '2.3'
        title: Adoption drivers are real, but rollout speed and monetization remain the key constraints
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption drivers are regulatory pressure, direct operating pain, and the need for secure
              destruction plus sustainability outcomes in one workflow. ReFED's policy count and Divert's own retailer
              messaging both point to organic-waste regulation as a live budget trigger rather than a theoretical
              tailwind. At the same time, external reporting shows the service is operationally complex: destruction
              volumes vary by season, product, and site, traditional service models often fail to price that variability
              well, and Divert still needs capital-intensive facility build out to match the addressable stream. Public
              sources support demand and a differentiated operating model, but they stop short of proving how fast the
              company can commission infrastructure, what utilization it can sustain, or how pricing translates into
              durable unit economics.
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market wedge is operational, not generic ESG spend
            body: >-
              Divert's best-fit buyers are enterprises that already own unsold food, disposal risk, and compliance
              obligations; the adoption case is strongest when buyers need secure destruction, reporting, and diversion
              in one workflow.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: callout
            title: Public evidence supports demand, but not underwritten market share
            body: >-
              Available third-party datasets size the broader waste problem and the AD gap, but they do not disclose
              Divert's realized pricing, segment mix, or facility utilization, so public-market sizing remains
              indicative rather than underwriteable.
            calloutType: risk
            claimRefs:
