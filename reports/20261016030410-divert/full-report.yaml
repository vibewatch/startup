      - number: '6.3'
        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              The main customer risk is not absence of adoption proof; it is the narrowness of what public proof
              establishes. Divert's current evidence explains why buyers may adopt the service—packaged food can be
              removed without store staff separating it on site, which lowers labor friction—but early-2025 reporting
              also showed COO turnover while the company was scaling new facilities. Independent sector analysis further
              warns that integrated depackaging-and-digestion models can reduce incentives to prioritize source
              separation upstream. More importantly for underwriting, the retained public sources do not disclose NRR,
              GRR, churn, contract length, cohort behavior, or top-customer revenue share. The chapter therefore
              supports a view that Divert has real customer traction and expansion demand, but not yet a public case for
              customer durability or concentration resilience.
            claimRefs:
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public proof clears the logo-only threshold
            body: >-
              Divert has more than a customer-logo story: the retained sources show a 190-store retailer deployment, a
              seven-facility distributor program, a current 7.8K-location company claim, and third-party reporting that
              new plant capacity was largely contracted.
            calloutType: strength
            claimRefs:
              - CU006
              - CU008
              - CU011
              - CU013
          - type: callout
            title: Durability remains the largest customer diligence gap
            body: >-
              The public record still does not show retention, renewal, or concentration math. Underwriting customer
              quality therefore depends on private disclosure of NRR/GRR, churn, contract length, and top-account
              revenue share rather than on the current anecdotal proof set.
            calloutType: risk
            claimRefs:
              - CU005
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and environmental scrutiny is the hardest downside to dismiss
        blocks:
          - type: paragraph
            body: >-
              Divert's model depends on anaerobic digestion remaining a politically, operationally, and financially
              acceptable end-market for unsold food, yet the strongest independent evidence in the pool shows broader
              digester scrutiny is active rather than hypothetical. Earthjustice says USDA extended a pause on new
              manure-digester loan guarantees through the end of 2026 and separately filed a FOIA lawsuit over digester
              funding records, while The New Lede documented a comparable digester facility's methane leak, odor
              complaints, and permit-renewal pressure. None of that is proof of a Divert facility incident, but it does
              mean the company is expanding into an operating category where subsidy assumptions, permit terms,
              emissions controls, and community tolerance can all change faster than the company discloses publicly.
              Until investors review facility-by-facility permits, emissions monitoring, and violation history for
              Turlock, Longview and Lexington, the residual regulatory risk should be treated as high.
            claimRefs:
              - CR005
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
