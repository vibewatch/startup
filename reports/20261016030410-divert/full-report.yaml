  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Divert converts customer waste-handling workflows into service revenue and downstream recovered-product value, but
      the public sources do not disclose the pricing or gross-profit handoffs between stages.
    data:
      nodes:
        - id: source-stream
          label: Unsold food generated by retailers, warehouses, distributors, and manufacturers
          detail: Input stream that creates waste-hauling, compliance, destruction, and shrink-reduction needs.
        - id: service-layer
          label: Collection, reverse logistics, donation, and certified destruction services
          detail: Commercial front end sold as tailored enterprise programs rather than posted rate cards.
        - id: analytics-layer
          label: RFID tracking, benchmarking, and customer coaching
          detail: Data layer intended to reduce shrink and improve purchasing decisions over time.
        - id: processing-layer
          label: Depackaging and anaerobic digestion at Integrated Diversion & Energy facilities
          detail: >-
            Turlock is operating; Longview and Lexington were identified as expansion projects in the 2026 funding
            announcement.
        - id: output-layer
          label: RNG, fertilizer, soil amendments, and recovered water
          detail: Downstream monetization exists, but public offtake pricing and gross margins are undisclosed.
        - id: value-layer
          label: Customer savings, compliance support, and circularity outcomes
          detail: Public value claims emphasize lower hauling costs, better merchandising, and landfill-diversion compliance.
      edges:
        - from: source-stream
          to: service-layer
        - from: service-layer
          to: analytics-layer
        - from: analytics-layer
          to: processing-layer
        - from: processing-layer
          to: output-layer
        - from: output-layer
          to: value-layer
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Divert's public evidence points to a layered system that starts with customer-site capture and ends with energy
      and soil outputs.
    data:
      layers:
        - label: Customer edge
          detail: Customer sites generate the unsold-food stream and provide the first operational capture point.
          modules:
            - RFID tracking
            - Backroom bins and collection handling
        - label: Data and decisioning
          detail: Divert turns captured waste events into monthly visibility, benchmarking, and prevention insights.
          modules:
            - Waste analytics
            - Donation optimization
        - label: Logistics orchestration
          detail: Reverse logistics and routing connect distributed customer sites to downstream recovery or processing.
          modules:
            - Reverse logistics
            - Dynamic routing
        - label: Compliance and destruction
          detail: The service layer includes secure destruction and recall/compliance workflows before final processing.
          modules:
            - Certified destruction
            - Recall and compliance support
        - label: Processing infrastructure
          detail: Depackaging and liquefaction prepare mixed food streams for conversion at integrated facilities.
          modules:
            - Depackaging
            - Liquefaction
        - label: Energy and soil outputs
          detail: Anaerobic digestion converts prepared feedstock into sellable downstream products.
          outputs:
            - Renewable natural gas
            - Fertilizer, soil amendment, and recovered water
    approximationNotes: >-
      This figure is a synthesized architecture from assigned public sources; it is not a verbatim engineering diagram
      and should not be read as a complete software or plant-control stack.
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Divert sells a bundled operating loop that starts with store or warehouse waste capture and expands through
      measurement, training, and new processing capacity.
    data:
      items:
        - label: Backroom or warehouse waste identified
          stage: Problem discovery
          touchpoints:
            - Unsold or non-donatable packaged food accumulates in stores, warehouses, or manufacturing flows
            - Buyer pain points are shrink, compliance, labor burden, and brand-safe destruction
          tone: neutral
        - label: Reverse-logistics collection configured
          stage: Operational setup
          touchpoints:
            - Divert positions reverse logistics and flexible collection methods for multi-location customers
            - Program design must fit existing store or warehouse operations
          tone: positive
        - label: RFID / data analytics create visibility
          stage: Measurement
          touchpoints:
            - Store-specific unsold-food data is tracked and benchmarked
            - Insights are used to identify prevention and purchasing opportunities
          tone: positive
        - label: Donation and destruction workflow executed
          stage: Disposition control
          touchpoints:
            - Edible food recovery is separated from non-donatable product handling
            - Certified destruction and documentation support brand and compliance needs
          tone: positive
        - label: Depackaging and digestion close the loop
          stage: Processing
          touchpoints:
            - Packaged food can be processed off site without store staff separating it
            - Outputs include renewable energy and soil or fertilizer products
          tone: positive
        - label: Expansion depends on training and new capacity
          stage: Land-and-expand loop
          touchpoints:
            - Field teams and co-training support repeat usage across locations
            - Future onboarding depends on additional facility capacity staying online and contracted
          tone: warning
    claimRefs:
      - CU002
      - CU003
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters in high-impact cells tied to digester policy, facility ramp, and concentration-sensitive
      route density.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from the assigned public evidence, not an incident-frequency estimate.
        - label: Impact
          detail: Potential consequence for facility economics, customer delivery, or underwriting confidence.
        - label: Mitigation maturity
          detail: Publicly visible mitigation only; private controls were not available in the assigned evidence.
      rows:
        - label: Digester policy and financing
          values:
            - label: Medium
              tone: warning
              note: USDA's manure-digester loan pause is category evidence, not a Divert-specific financing action.
            - label: High
              tone: negative
              note: Tighter subsidy or lending conditions could raise the cost of infrastructure expansion.
            - label: Low
              tone: negative
              note: No public downside case shows facility economics without favorable external financing.
        - label: Facility permitting and emissions
          values:
            - label: Medium
              tone: warning
              note: Comparable digester evidence makes this a diligence priority without proving a Divert incident.
            - label: High
              tone: negative
              note: Permit limits, emissions controls, or nuisance complaints could delay or constrain a facility.
            - label: Low
              tone: negative
              note: Facility-level permits, monitoring results, and incident history were not public in the assigned pool.
        - label: New-facility commissioning
          values:
            - label: Medium
              tone: warning
              note: Longview and Lexington remained active buildout projects in the January 2026 company release.
            - label: High
              tone: negative
              note: Delays would defer capacity while capital remains committed to physical expansion.
            - label: Medium
              tone: warning
              note: New funding and an internal COO promotion are visible mitigations, but ramp KPIs are undisclosed.
        - label: Anchor-customer and route density
          values:
            - label: Medium
              tone: warning
              note: Public examples show large multi-location programs, but no concentration schedule.
            - label: High
              tone: negative
              note: Losing an anchor account could reduce both service revenue and collection density.
            - label: Medium
              tone: warning
              note: >-
                Reverse-logistics integration and tailored routing support retention, but contract terms are
                unavailable.
        - label: Certified destruction and compliance
          values:
            - label: Low-Medium
              tone: neutral
              note: No Divert-specific failure was identified in the assigned evidence.
            - label: High
              tone: negative
              note: A control failure could affect customer compliance, recalls, documentation, and brand integrity.
            - label: Medium
              tone: warning
              note: Divert describes dedicated processes and support, but no third-party control audit was available.
        - label: KPI definition and reporting
          values:
            - label: High
              tone: negative
              note: Public pages use different location metrics without dates or a reconciliation.
            - label: Medium
              tone: warning
              note: Non-comparable operating counts weaken baseline underwriting rather than proving operating failure.
            - label: Low
              tone: negative
              note: The assigned public evidence does not provide a metric dictionary or reporting bridge.
    approximationNotes: >-
      Likelihood and impact bins are analyst judgments synthesized from cited evidence; the assigned pool does not
      contain incident-rate or facility uptime datasets for a probabilistic model.
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR009
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified operating proof flows into a track call because valuation and economics remain undisclosed while capital
      and execution risk stay live.
    data:
      nodes:
        - id: verified-funding
          label: Verified 2026 funding
          detail: Wittington-led funding confirms support but not price.
        - id: facility-buildout
          label: Facility buildout
          detail: >-
            Longview and Lexington are expected to commence in 2026; Turlock is already at a 100,000-ton annual capacity
            claim.
        - id: traction-proof
          label: Third-party traction proof
          detail: US Cold case evidence shows multi-site diversion and RNG output.
        - id: economics-opacity
          label: Economics opacity
          detail: No retained public revenue, margin, cash, or round-size disclosure.
        - id: execution-risk
          label: Execution risk
          detail: Leadership transition and prior large capital commitments raise the underwriting bar.
        - id: recommendation
          label: Recommendation
          detail: Track / research more until price and unit economics are disclosed.
      edges:
        - from: verified-funding
          to: facility-buildout
        - from: facility-buildout
          to: traction-proof
        - from: traction-proof
          to: recommendation
        - from: economics-opacity
          to: recommendation
        - from: execution-risk
          to: recommendation
    approximationNotes: >-
      This is a qualitative decision chain, not a weighted scoring model; node order shows logic flow rather than
      probability or magnitude.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV014
      - CV016
