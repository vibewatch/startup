      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity still centers on the two co-founders. Independent reporting identifies Ryan Begin
              and Nick Whitman as the original founders, and the March 2025 leadership change shows that founder risk is
              not theoretical: Whitman left the COO seat for a board and strategic-advisor role after nearly 18 years in
              day-to-day operations. The January 2026 financing announcement also shows outside governance influence
              increasing, with additional board appointments tied to fresh capital support. That combination cuts both
              ways for diligence. It broadens industrial and energy oversight, but public evidence still does not
              confirm the permanent COO replacement or a full committee-level governance map, so execution depth below
              Begin remains a live diligence question.
            claimRefs:
              - CO008
