  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and who pays
        blocks:
          - type: paragraph
            body: >-
              Divert is not selling into the entire food-waste universe. Its own materials define the practical wedge
              around enterprise customers that control unsold commercial inventory: grocery retailers, food warehouses
              and distributors, and food manufacturers. The workflow is also narrower than hauling or compost-only
              alternatives. Divert positions an end-to-end service around reverse logistics, donation optimization,
              certified destruction and depackaging, data analytics, and anaerobic digestion, so the buyer is typically
              an operating or sustainability owner trying to reduce shrink, disposal cost, and compliance friction
              rather than a consumer or municipality. The leadership roster reinforces that this is a segmented
              enterprise motion, with dedicated retail and industrial management rather than a single generic SMB
              channel.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
