schemaVersion: report-v2
artifact: valuation
slug: divert
runDate: 2026-10-16
company:
  name: Divert
chapter:
  number: 8
  title: Valuation
  summary: >-
    Divert shows enough verified operating activity and continued investor support to
    justify staying engaged, but not enough disclosed pricing or economics to underwrite
    an invest-at-price recommendation from public evidence alone. The retained 2026
    sources confirm facility expansion and customer outcomes, while the latest financing
    announcement still omits round size, valuation, and preference terms.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      Divert still looks like a company worth tracking, not a company that can be
      underwritten confidently at an undisclosed entry price. The retained 2026 financing
      sources confirm continued investor appetite and active infrastructure expansion, and
      third-party operating evidence shows the platform can deliver real diversion and RNG
      outcomes. But the same public record leaves out the latest round's amount, valuation,
      and preference stack, while also offering no retained public revenue, margin, or cash
      disclosure. In valuation terms, that means the thesis is evidence-bearing but the
      price is not. The disciplined posture is therefore track / research more, with any
      change in recommendation contingent on disclosed round terms plus lender-grade
      operating economics.
    claimRefs:
      - CV010
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-benchmark-limits
    title: Financing context and benchmark limits
    body: >-
      Public evidence supports the view that Divert is still in an expansion and capital
      deployment phase rather than a transparently harvestable cash-flow phase. The January
      2026 funding announcement says Wittington led a new financing and says Longview and
      Lexington are expected to commence operations later in 2026, while Turlock is already
      positioned as a 100,000-ton annual facility. WasteDive's historical financing summary
      adds context: Ara injected $100 million in 2021 and Enbridge committed $1 billion in
      2023 to scale RNG capacity. That capital history raises the underwriting bar for any
      new round because it implies a large infrastructure story, but the latest public
      financing disclosure still does not give the terms needed to judge whether the new
      money came in at an attractive, flat, or dilutive price. The RNG Coalition confirms
      the existence of an organized North American RNG sector but supplies no transaction
      multiple, while Anaergia's disclosed 2026 revenue, margin, EBITDA, and backlog are
      useful directional operating markers. Neither source can carry a priced multiple
      comparison without matched Divert financials and business-model adjustments.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV012
      - CV013
      - CV014
      - CV015
    tableRefs:
      - TV002
  - id: scenario-framing-and-final-diligence
    title: Scenario framing and final diligence asks
    body: >-
      The scenario spread is driven less by whether Divert has built something useful and
      more by whether it can prove durable economics at scale. The retained sources support
      a credible platform story: Divert describes an integrated stack spanning reverse
      logistics, depackaging, anaerobic digestion, analytics, and compliance support, and
      third-party reporting shows that customer programs are producing measurable landfill
      diversion and RNG output. The bear side comes from disclosure quality and execution
      uncertainty, not from an outright product failure in public view. Company-controlled
      pages with no visible publication dates report differently defined scale figures, so
      their 6,683-location and 7.8K-location values cannot be treated as a same-period growth
      series. WasteDive also documents a COO transition whose replacement details were still
      pending in the public record it cited. Before moving beyond track mode, an investor
      should demand current round documents, normalized facility economics, and dated,
      definition-consistent management and operating KPI disclosure.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
    tableRefs:
      - TV003
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current view
      - Evidence basis
      - What would change the view
    rows:
      - - Recommendation
        - Track / research more
        - Operational proof exists, but price and economics remain undisclosed.
        - Disclosed round terms plus unit economics that support entry pricing.
      - - Confidence
        - Medium-low
        - Multiple independent operating signals exist, but key financial disclosures are missing.
        - Audited or lender-grade revenue, margin, and cash data.
      - - Risk rating
        - High
        - Capital-intensive buildout, leadership transition, and undated KPI disclosure with different metric definitions.
        - Stable leadership bench and dated, definition-consistent operating KPI reporting.
      - - Valuation stance
        - Publicly unsupported
        - Latest funding disclosed no amount, valuation, or preference stack.
        - Signed round documents or a credible independent mark.
      - - Decision implication
        - Stay engaged without underwriting to marketing-scale KPIs
        - Use milestone gating instead of narrative valuation.
        - Price reset or diligence package that normalizes to disclosed comps.
    notes: >-
      Synthesizes retained public evidence only; it is an entry-discipline snapshot, not a
      substitute for private round documents or facility-level financial diligence.
    claimRefs:
      - CV010
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Evidence
      - Valuation implication
      - What would change the view
    rows:
      - - Thesis
        - >-
          Divert combines reverse logistics, donation optimization, depackaging, anaerobic
          digestion, and analytics, while third-party program evidence shows measurable
          diversion and RNG output.
        - >-
          A broader platform can justify premium valuation treatment if it also produces
          repeatable facility economics and customer retention.
        - >-
          Facility-level throughput, gross margin, contract retention, and contribution
          margin disclosure.
      - - Anti-thesis
        - >-
          The latest financing announcement withholds size and price, public KPI pages are
          undated and differently defined, and public leadership-transition disclosure
          remains incomplete.
        - >-
          Public price discovery is unsupported and downside from a flat or investor-unfriendly
          round remains live.
        - >-
          Current cap-table terms, updated management disclosure, and synchronized operating KPIs.
      - - Comparator limit
        - >-
          Anaergia offers disclosed 2026 revenue, gross margin, adjusted EBITDA, and backlog,
          while the RNG Coalition confirms an industry network but provides no transaction
          multiple; Divert does not disclose matched financial outputs in the retained pool.
        - >-
          Multiple-based pricing is fragile until Divert can be normalized to a disclosed
          peer or milestone benchmark.
        - >-
          A revenue, margin, backlog, utilization, and cash bridge that can be compared to
          public alternatives.
    notes: >-
      Uses one public comp and several company disclosures; conclusions are directional and
      explicitly limited by missing Divert pricing and operating-financial disclosure.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Longview and Lexington start on time, the platform converts more multi-site
          customers into recurring throughput, and current financing extends rather than
          constrains the rollout.
        - >-
          Re-rate only after private diligence shows scalable facility economics and a round
          price that still leaves venture-style upside.
        - >-
          Construction ramp, utilization lag, and overbuilding ahead of demand.
        - >-
          Requires new facility commissioning evidence plus disclosed operating metrics.
      - - Base
        - >-
          Divert continues adding infrastructure and customer programs, but public disclosure
          remains good enough to keep interest high and too thin to support priced conviction.
        - >-
          Hold in track mode and underwrite only after a data room bridges the gap between
          platform narrative and unit economics.
        - >-
          Round terms stay opaque, customer concentration stays undisclosed, and KPI drift
          persists across company materials.
        - >-
          Best fits the retained record as of 2026-10-16.
      - - Bear
        - >-
          Expansion absorbs capital faster than economics are proven, management transition
          stretches execution, and the next financing comes with weaker price or preference terms.
        - >-
          A down-round or highly structured round would transfer more upside to new capital
          than to current investors.
        - >-
          Facility delays, fundraising friction, and unreliable public KPI baselines.
        - >-
          Becomes likelier if new disclosures still omit economics after 2026 commissioning milestones.
    notes: >-
      Scenario logic is milestone-based rather than numeric because the retained public pool
      does not disclose Divert revenue, gross margin, cash balance, or current round price.
    claimRefs:
      - CV002
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified operating proof flows into a track call because valuation and economics remain
      undisclosed while capital and execution risk stay live.
    data:
      nodes:
        - id: verified-funding
          label: Verified 2026 funding
          detail: Wittington-led funding confirms support but not price.
        - id: facility-buildout
          label: Facility buildout
          detail: Longview and Lexington are expected to commence in 2026; Turlock is already at a 100,000-ton annual capacity claim.
        - id: traction-proof
          label: Third-party traction proof
          detail: US Cold case evidence shows multi-site diversion and RNG output.
        - id: economics-opacity
          label: Economics opacity
          detail: No retained public revenue, margin, cash, or round-size disclosure.
        - id: execution-risk
          label: Execution risk
          detail: Leadership transition and prior large capital commitments raise the underwriting bar.
        - id: recommendation
          label: Recommendation
          detail: Track / research more until price and unit economics are disclosed.
      edges:
        - from: verified-funding
          to: facility-buildout
        - from: facility-buildout
          to: traction-proof
        - from: traction-proof
          to: recommendation
        - from: economics-opacity
          to: recommendation
        - from: execution-risk
          to: recommendation
    approximationNotes: >-
      This is a qualitative decision chain, not a weighted scoring model; node order shows
      logic flow rather than probability or magnitude.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV014
      - CV016
callouts:
  - calloutType: recommendation
    title: "Public-market discipline: stay in track mode"
    body: >-
      The public record validates demand and infrastructure buildout, but it does not validate
      the current entry price. Without current round terms, matched financial disclosure, and
      refreshed leadership/operating KPI visibility, the investment case is not yet
      underwriteable as a buy.
    claimRefs:
      - CV011
      - CV014
      - CV015
      - CV016
