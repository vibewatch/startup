  evidenceGaps:
    - type: missing-source
      severity: material
      topic: financing-transparency
      missingEvidence: Current round amount, valuation, liquidation preference, and investor allocation for the latest financing.
      whyItMatters: Entry discipline and dilution risk cannot be underwritten without the actual round terms.
      diligencePath: Request the latest financing announcement deck, signed term sheet, and updated cap-table summary.
      relatedQuestionRefs:
        - QV009
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Current revenue, gross margin, facility utilization, contribution margin, cash balance, and runway disclosure.
      whyItMatters: Without operating-financial outputs, even the best public comparable stays directional rather than price-forming.
      diligencePath: Obtain NDA-only monthly KPI packs, lender materials, and a facility-level revenue-to-cash bridge.
      relatedQuestionRefs:
        - QV010
    - type: conflicting-data
      severity: material
      topic: disclosure-consistency
      missingEvidence: One synchronized operating KPI set for customer locations and cumulative pounds processed across current company materials.
      whyItMatters: KPI drift weakens confidence in management's current scale narrative and complicates scenario calibration.
      diligencePath: Ask management to reconcile homepage, marketing, and retailer-page KPI definitions in writing.
      relatedQuestionRefs:
        - QV006
