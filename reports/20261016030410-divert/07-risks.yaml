company:
  name: Divert
chapter:
  number: 7
  title: Risks
  summary: >-
    Divert's highest residual risks cluster around anaerobic-digestion policy
    exposure, physical-network execution, and capital-backed scale-up rather
    than demand creation. Public evidence shows real mitigation levers
    (logistics, analytics, field teams, and new funding), but it does not yet
    close the underwriting gaps on facility permits, concentration, financing
    sensitivity, or KPI consistency.
sections:
  - id: regulatory-and-policy-risk
    title: Regulatory and environmental scrutiny is the hardest downside to dismiss
    body: >-
      Divert's model depends on anaerobic digestion remaining a politically,
      operationally, and financially acceptable end-market for unsold food, yet
      the strongest independent evidence in the pool shows broader digester
      scrutiny is active rather than hypothetical. Earthjustice says USDA
      extended a pause on new manure-digester loan guarantees through the end of
      2026 and separately filed a FOIA lawsuit over digester funding records,
      while The New Lede documented a comparable digester facility's methane
      leak, odor complaints, and permit-renewal pressure. None of that is proof
      of a Divert facility incident, but it does mean the company is expanding
      into an operating category where subsidy assumptions, permit terms,
      emissions controls, and community tolerance can all change faster than the
      company discloses publicly. Until investors review facility-by-facility
      permits, emissions monitoring, and violation history for Turlock, Longview
      and Lexington, the residual regulatory risk should be treated as high.
    claimRefs: [CR005, CR012, CR013, CR014]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-and-partner-execution
    title: The service promise is operationally dense and partner dependent
    body: >-
      Divert is not selling a light-touch software workflow; it is selling
      reverse logistics, certified destruction, depackaging, analytics, field
      support, and anaerobic-digestion throughput across multi-site food
      networks. A company case study says three grocery customers backhauled
      unsold food from more than 466 stores into Divert's process, and Waste
      Today says the US Cold program alone depended on seven California
      facilities routing material into Turlock over a 15-month span. Those same
      sources also show the mitigations Divert emphasizes: dynamic pricing,
      optimized routing, documentation, customer-success teams, and compliance
      support. The core risk is that any facility-ramp miss, contamination
      event, data-quality error, or logistics breakdown can hit multiple
      customer outcomes at once because compliance, brand integrity, and waste
      removal are bundled together in the service promise.
    claimRefs: [CR005, CR006, CR007, CR008, CR015]
    tableRefs: [TR002]
  - id: capital-succession-and-measurement-discipline
    title: Expansion still depends on capital, leadership execution, and cleaner metrics
    body: >-
      March 2025 marked a meaningful management handoff: co-founder Nick
      Whitman stepped out of day-to-day operations, Bob Watkins moved up from
      CIO to COO, and public reporting describes Whitman's prior remit as
      spanning functions well beyond operations. That transition is happening
      while Divert is still building out Longview and Lexington and continues to
      describe a much larger national-facility ambition, which raises the cost
      of any commissioning delay or management misalignment. Public KPI
      discipline also remains weaker than an investor should accept at face
      value: official and third-party materials cite more than 5,600, 6,683,
      and 7,800 customer locations without a visible bridge between definitions
      or as-of dates. The practical implication is not that the business lacks
      traction, but that capital efficiency, concentration, and ramp progress
      still require management-pack evidence rather than website-level trust.
    claimRefs: [CR001, CR002, CR003, CR004, CR009, CR010, CR011, CR016]
    tableRefs: [TR003]
