figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters in high-impact cells tied to digester policy,
      facility ramp, and concentration-sensitive route density.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from the assigned public evidence, not an incident-frequency estimate.
        - label: Impact
          detail: Potential consequence for facility economics, customer delivery, or underwriting confidence.
        - label: Mitigation maturity
          detail: Publicly visible mitigation only; private controls were not available in the assigned evidence.
      rows:
        - label: Digester policy and financing
          values:
            - label: Medium
              tone: warning
              note: USDA's manure-digester loan pause is category evidence, not a Divert-specific financing action.
            - label: High
              tone: negative
              note: Tighter subsidy or lending conditions could raise the cost of infrastructure expansion.
            - label: Low
              tone: negative
              note: No public downside case shows facility economics without favorable external financing.
        - label: Facility permitting and emissions
          values:
            - label: Medium
              tone: warning
              note: Comparable digester evidence makes this a diligence priority without proving a Divert incident.
            - label: High
              tone: negative
              note: Permit limits, emissions controls, or nuisance complaints could delay or constrain a facility.
            - label: Low
              tone: negative
              note: Facility-level permits, monitoring results, and incident history were not public in the assigned pool.
        - label: New-facility commissioning
          values:
            - label: Medium
              tone: warning
              note: Longview and Lexington remained active buildout projects in the January 2026 company release.
            - label: High
              tone: negative
              note: Delays would defer capacity while capital remains committed to physical expansion.
            - label: Medium
              tone: warning
              note: New funding and an internal COO promotion are visible mitigations, but ramp KPIs are undisclosed.
        - label: Anchor-customer and route density
          values:
            - label: Medium
              tone: warning
              note: Public examples show large multi-location programs, but no concentration schedule.
            - label: High
              tone: negative
              note: Losing an anchor account could reduce both service revenue and collection density.
            - label: Medium
              tone: warning
              note: Reverse-logistics integration and tailored routing support retention, but contract terms are unavailable.
        - label: Certified destruction and compliance
          values:
            - label: Low-Medium
              tone: neutral
              note: No Divert-specific failure was identified in the assigned evidence.
            - label: High
              tone: negative
              note: A control failure could affect customer compliance, recalls, documentation, and brand integrity.
            - label: Medium
              tone: warning
              note: Divert describes dedicated processes and support, but no third-party control audit was available.
        - label: KPI definition and reporting
          values:
            - label: High
              tone: negative
              note: Public pages use different location metrics without dates or a reconciliation.
            - label: Medium
              tone: warning
              note: Non-comparable operating counts weaken baseline underwriting rather than proving operating failure.
            - label: Low
              tone: negative
              note: The assigned public evidence does not provide a metric dictionary or reporting bridge.
    approximationNotes: >-
      Likelihood and impact bins are analyst judgments synthesized from cited
      evidence; the assigned pool does not contain incident-rate or facility
      uptime datasets for a probabilistic model.
    claimRefs: [CR001, CR004, CR005, CR009, CR012, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: >-
      Treat a material delay in Longview or Lexington commissioning, combined
      with tighter digester-policy or financing conditions, as a thesis-break
      event because the growth plan and route-density economics both rely on
      additional physical capacity.
    claimRefs: [CR002, CR004, CR012, CR016]
  - calloutType: assumption
    title: Highest-priority diligence pack
    body: >-
      The next diligence round should request facility permits and incident
      history, top-customer concentration, destruction-audit controls, metric
      definitions, and facility-level financing sensitivity before any
      valuation-sensitive recommendation is upgraded.
    claimRefs: [CR008, CR009, CR010, CR011, CR016]
