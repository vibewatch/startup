artifact: customers
slug: divert
runDate: "2026-10-16"
company:
  name: Divert
chapter:
  number: 6
  title: Customers
  summary: >-
    Divert has credible public proof that grocery retailers, distributors, and
    some food brands use its platform in production, but the evidence is much
    stronger on deployment anecdotes than on retention or concentration. The
    strongest adoption proof is retail-led and multi-site, while durability
    metrics, contract economics, and top-account exposure remain private.
sections:
  - id: customer-mix-and-buying-motion
    title: Customer mix and buying motion
    body: >-
      Divert's public customer story is still retail-first, but the offer is
      broader than a grocery waste-hauling program. Company materials
      explicitly group grocery retailers, food warehouses and distributors, and
      food manufacturers as target customers, then tailor the pitch by buyer
      pain point: retailers get reverse logistics, analytics, donation
      optimization, and field coaching; warehouses and manufacturers get
      certified destruction, depackaging, recall support, and compliance help.
      That breadth matters because it suggests Divert is trying to sell a
      bundled operating workflow into multiple points of the food supply chain,
      not a single disposal service, but the current evidence still shows
      grocery as the clearest adoption surface and the best-documented user
      workflow.
    claimRefs: [CU001, CU002, CU003, CU005]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: deployment-proof-and-adoption-signals
    title: Deployment proof and adoption signals
    body: >-
      Public proof of real adoption is concrete enough to clear the logo-only
      bar. Divert says it added more than 1,500 retail stores and grew its
      retail customer base by more than 40% over the two years ending August
      2022, then now claims support for 7.8K customer locations across the food
      supply chain. The strongest production evidence is a 190-store
      Mid-Atlantic grocery deployment that started in 2017 and a US Cold
      program spanning seven California facilities over 15 months, with Oatly
      cited as a downstream brand beneficiary. Waste Dive also names Kroger as
      an example customer and reports that Turlock capacity was nearly fully
      contracted in March 2025, which is a useful demand signal even though
      revenue conversion and renewal terms remain undisclosed.
    claimRefs: [CU004, CU006, CU007, CU008, CU009, CU010, CU011, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risks
    title: Durability, expansion, and concentration risks
    body: >-
      The main customer risk is not absence of adoption proof; it is the
      narrowness of what public proof establishes. Divert's current evidence
      explains why buyers may adopt the service—packaged food can be removed
      without store staff separating it on site, which lowers labor friction—but
      early-2025 reporting also showed COO turnover while the company was
      scaling new facilities. Independent sector analysis further warns that
      integrated depackaging-and-digestion models can reduce incentives to
      prioritize source separation upstream. More importantly for underwriting,
      the retained public sources do not disclose NRR, GRR, churn, contract
      length, cohort behavior, or top-customer revenue share. The chapter
      therefore supports a view that Divert has real customer traction and
      expansion demand, but not yet a public case for customer durability or
      concentration resilience.
    claimRefs: [CU012, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Grocery retailers
        - Enterprise sustainability, operations, merchandising, and store teams
        - Reverse logistics, RFID/data analytics, donation optimization, and store-level training
        - Company cites 7.8K customer locations currently; 190-store Mid-Atlantic retailer case study; 5 Fortune 100 customers and 5,200+ retail stores in 2022
        - Flagship demand surface and clearest cross-location operating proof
        - No public banner-level revenue share, renewal rate, or contract length
      - - Food warehouses & distributors
        - Warehouse operations, inventory, compliance, and sustainability leaders
        - Certified destruction, depackaging, logistics support, and landfill-diversion compliance
        - US Cold program covered seven California facilities over 15 months with measurable diverted volume
        - Extends Divert upstream into distributor-controlled waste streams
        - No disclosed customer count, recurring volume, or contract economics for this segment
      - - Food manufacturers
        - Plant operations, QA/compliance, supply chain, and sustainability teams
        - Production residual handling, contaminated/finished goods destruction, recall support, and liquid/slurry services
        - Official materials say Divert supports major retailers and manufacturers, but retained public proof is mostly solution-description level
        - Potential diversification beyond store-generated waste
        - No named current manufacturer production case study in the retained sources
      - - Food brands via logistics partners
        - Brand owners needing secure disposal; partner warehouse teams execute
        - Brand-safe certified destruction plus documentation and environmental handling
        - Waste Today says Oatly benefited via US Cold's routing of unsold product to Divert
        - Shows partner-mediated value beyond direct retail banners
        - Indirect proof through a partner workflow, not a disclosed direct Divert contract
    notes: >-
      Mix and scale reflect retained public proof only; current sources do not
      disclose revenue split, contract duration, or customer counts by segment.
    claimRefs: [CU001, CU002, CU003, CU005, CU009, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Retail stores added / retail customer-base growth
        - More than 1,500 new retail stores added; retail customer base expanded more than 40% over prior two years
        - "2022-08-24"
        - Divert press release
        - Medium
        - Shows pre-facility-buildout commercial acceleration
        - Starting store base and revenue per added store are not disclosed
      - - Named enterprise anchors
        - Five Fortune 100 companies and more than 5,200 retail stores across all 50 states
        - "2022-08-24"
        - Divert press release
        - Medium
        - Implies large-banner enterprise relationships early in scaling
        - Customer names, spend share, and contract terms are not disclosed
      - - Retail footprint snapshot
        - More than 5,600 retail locations across all 50 states
        - 2026-10-16 access date
        - Divert retail landing page
        - Medium
        - Confirms nationwide retailer coverage
        - Publication date is not stated and metric appears retail-only
      - - All customer locations supported
        - 7.8K customer locations across the food supply chain
        - 2026-10-16 access date
        - Divert homepage
        - Medium
        - Suggests broader footprint than the retail-only count
        - Metric definition and overlap with retail-location count are not disclosed
      - - US Cold deployment scale
        - More than 2.5 million pounds diverted across seven California facilities over 15 months
        - 2026-10-16 access date
        - Waste Today
        - Medium
        - Demonstrates multi-site distributor adoption with measurable throughput
        - No disclosed contract value, renewal status, or share of Divert volume
      - - New-facility demand signal
        - Nearly all capacity contracted at Turlock; Longview ramping
        - "2025-03-18"
        - Waste Dive
        - Medium
        - Suggests customer demand is following new processing capacity
        - Customer mix, pricing, and duration of contracted capacity are not disclosed
    notes: >-
      Dates use publication date when the source states one, otherwise the run
      access date for undated current pages; location metrics are not perfectly
      comparable because public definitions differ.
    claimRefs: [CU004, CU005, CU008, CU011, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Mid-Atlantic grocery retailer (unnamed)
        - Grocery retail
        - RFID-backed reverse logistics and store-level analytics across 190 stores starting in 2017
        - Production
        - Company says tons of unsold food fell 9% over five years while sales increased
        - Anonymous, company-owned case study with no contract economics or current status
      - - United States Cold Storage
        - Warehouse / distributor
        - Secure destruction and diversion workflow for unsold food and beverage products across seven California facilities
        - Production
        - Waste Today reports more than 2.5 million pounds diverted over 15 months
        - Single-program snapshot; revenue contribution and renewal status are undisclosed
      - - Oatly (via US Cold)
        - Food brand via partner channel
        - Unsold product routed through US Cold to Divert's Turlock facility for secure destruction and circular outputs
        - Production via partner
        - Waste Today says the setup gave Oatly confidence that unsold product would be handled with environmental care
        - Indirect reference through US Cold rather than a disclosed direct Divert customer agreement
      - - Kroger
        - Grocery retail
        - Waste Dive cites Kroger as an example of the grocers Divert serves
        - Production implied
        - Provides a named retailer reference beyond anonymous case studies
        - Retained public source gives no deployment scale, duration, or quantified outcome
    notes: >-
      This is a sample, not a full customer roster; Divert does not publish a
      complete current ledger of named production customers and outcomes in the
      retained sources.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of retained public customer proofs; the company does not publish
        a complete current named-customer roster with production status and
        outcomes.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Divert sells a bundled operating loop that starts with store or warehouse
      waste capture and expands through measurement, training, and new
      processing capacity.
    data:
      items:
        - label: Backroom or warehouse waste identified
          stage: Problem discovery
          touchpoints:
            - Unsold or non-donatable packaged food accumulates in stores, warehouses, or manufacturing flows
            - Buyer pain points are shrink, compliance, labor burden, and brand-safe destruction
          tone: neutral
        - label: Reverse-logistics collection configured
          stage: Operational setup
          touchpoints:
            - Divert positions reverse logistics and flexible collection methods for multi-location customers
            - Program design must fit existing store or warehouse operations
          tone: positive
        - label: RFID / data analytics create visibility
          stage: Measurement
          touchpoints:
            - Store-specific unsold-food data is tracked and benchmarked
            - Insights are used to identify prevention and purchasing opportunities
          tone: positive
        - label: Donation and destruction workflow executed
          stage: Disposition control
          touchpoints:
            - Edible food recovery is separated from non-donatable product handling
            - Certified destruction and documentation support brand and compliance needs
          tone: positive
        - label: Depackaging and digestion close the loop
          stage: Processing
          touchpoints:
            - Packaged food can be processed off site without store staff separating it
            - Outputs include renewable energy and soil or fertilizer products
          tone: positive
        - label: Expansion depends on training and new capacity
          stage: Land-and-expand loop
          touchpoints:
            - Field teams and co-training support repeat usage across locations
            - Future onboarding depends on additional facility capacity staying online and contracted
          tone: warning
    claimRefs: [CU002, CU003, CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Public proof clears the logo-only threshold
    body: >-
      Divert has more than a customer-logo story: the retained sources show a
      190-store retailer deployment, a seven-facility distributor program, a
      current 7.8K-location company claim, and third-party reporting that new
      plant capacity was largely contracted.
    claimRefs: [CU006, CU008, CU011, CU013]
  - calloutType: risk
    title: Durability remains the largest customer diligence gap
    body: >-
      The public record still does not show retention, renewal, or
      concentration math. Underwriting customer quality therefore depends on
      private disclosure of NRR/GRR, churn, contract length, and top-account
      revenue share rather than on the current anecdotal proof set.
    claimRefs: [CU005, CU015, CU016]
