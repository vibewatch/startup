        - Lost sales, hauling cost, donation leakage, and state diversion compliance
      - - Refrigerated warehouses and distributors
        - Distribution or logistics leadership
        - DC operators, quality teams, and sustainability staff
        - Logistics, compliance, or destruction budgets
        - Secure destruction, depackaging, material routing, documentation, and RNG conversion
        - SVP logistics, warehouse operations, or sustainability
        - Variable destruction volumes, brand protection, and customer sustainability commitments
      - - Food manufacturers
        - Plant, supply-chain, and quality leadership
        - Plant operators, EHS, recall, and residual-handling teams
        - Plant operations, compliance, and waste-management budgets
        - Residual processing, contaminated-goods destruction, and organics diversion
        - Plant GM, operations, EHS, or quality leaders
        - Residual cost, recall or contamination events, and landfill-diversion mandates
    notes: >-
