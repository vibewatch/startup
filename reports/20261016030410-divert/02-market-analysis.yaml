    claimRefs: [CM001, CM002, CM007, CM009, CM013]
figures:
  - id: FM001
    title: Constrained U.S. market sizing lens
    type: pyramid
    summary: >-
      The broad food-waste problem is large, but the serviceable wedge narrows
      quickly once the lens is limited to Divert-like commercial workflows and
      current facility-scale processing.
    data:
      items:
        - label: U.S. surplus food in 2024
          value: 70
          unit: million tons
          detail: ReFED total surplus-food estimate for the full U.S. supply chain.
        - label: Non-residential surplus food
          value: 46.6
          unit: million tons
          detail: Derived by excluding ReFED's 33.5% residential share from the 70M-ton total.
        - label: Manufacturing + foodservice + retail wedge
          value: 29.7
          unit: million tons
          detail: Derived from ReFED sector shares that most closely overlap Divert's named commercial segments.
        - label: Manufacturing + retail wedge
          value: 17.2
          unit: million tons
          detail: Derived subset that excludes foodservice because Divert's retained sources emphasize retail and industrial workflows.
        - label: Retail-only lens
          value: 4
          unit: million tons
          detail: Derived from ReFED's 5.7% retail share of surplus food.
        - label: One operating facility benchmark
          value: 0.1
          unit: million tons per year
          detail: Divert says its Turlock facility can process 100,000 tons annually.
    approximationNotes: >-
      Layers 2 through 5 are derived by applying ReFED sector shares to ReFED's
      70M-ton total; the final layer uses Divert's stated Turlock annual
      capacity as a throughput benchmark, not as a companywide SOM.
    claimRefs: [CM004, CM011, CM014]
