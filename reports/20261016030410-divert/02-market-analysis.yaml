        - null
        - ReFED modeling and landscape assessment across farm-to-fork surplus food
        - Medium
        - Includes residential and farm surplus that sit outside Divert's core commercial wedge.
      - - ReFED-derived commercial wedge
        - 2024 derived estimate
        - U.S.
        - ~29.7M tons across manufacturing, foodservice, and retail; retail alone ~4.0M tons
        - null
        - Applied ReFED sector shares to the 70M-ton total
        - Medium
        - Derived estimate, not a published spend forecast or Divert-specific SAM.
      - - U.S. EPA
        - 2022-2023 operating data, published 2025
        - U.S. manufacturers and processors
        - 40M tons wasted food; 43% managed by anaerobic digestion
        - null
        - EPA survey of food-waste digesters plus sector estimate
        - Medium
        - Measures one management pathway for one sector, not total willingness to pay.
      - - U.S. EPA
        - 2022-2023 operating data, published 2025
        - U.S. retail, food service, and residential sectors
        - 66M tons wasted food; 1% managed by anaerobic digestion; 75% landfilled or incinerated
        - null
