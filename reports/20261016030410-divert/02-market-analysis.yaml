company:
  name: Divert
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Divert addresses a real and sizeable commercial food-waste problem, but the
    investable wedge is narrower than generic food-waste TAM headlines imply.
    Public evidence supports demand from retailers, distributors, and food
    manufacturers facing disposal, compliance, and sustainability pressure, yet
    public disclosures still do not isolate pricing, utilization, or segment
    revenue well enough to underwrite a clean SAM/SOM.
sections:
  - id: market-boundary
    title: Market boundary and who pays
    body: >-
      Divert is not selling into the entire food-waste universe. Its own
      materials define the practical wedge around enterprise customers that
      control unsold commercial inventory: grocery retailers, food warehouses
      and distributors, and food manufacturers. The workflow is also narrower
      than hauling or compost-only alternatives. Divert positions an end-to-end
      service around reverse logistics, donation optimization, certified
      destruction and depackaging, data analytics, and anaerobic digestion, so
      the buyer is typically an operating or sustainability owner trying to
      reduce shrink, disposal cost, and compliance friction rather than a
      consumer or municipality. The leadership roster reinforces that this is a
      segmented enterprise motion, with dedicated retail and industrial
      management rather than a single generic SMB channel.
    claimRefs: [CM001, CM002, CM007, CM013]
    tableRefs: [TM001, TM003]
  - id: sizing-lenses
    title: Public sizing lenses bound the opportunity but do not produce a clean SAM
    body: >-
      Independent market data supports a large underlying waste stream, but the
      available figures are lenses, not a ready-made SAM. ReFED estimates 70
      million total tons of U.S. surplus food in 2024, worth $380 billion and
      equal to about 29% of the food supply. Applying ReFED's sector mix to
      that total suggests roughly 29.7 million tons across manufacturing,
      foodservice, and retail, with retail alone near 4.0 million tons; those
      are useful directional bounds because they overlap the verticals Divert
      names, but they are still derived estimates. EPA adds a different lens by
      showing how little of relevant waste is already processed through
      anaerobic digestion, especially outside manufacturing. The result is a
      credible large opportunity with no public dataset that cleanly isolates
      Divert's monetizable regional, segment, or facility-level serviceable
      market.
    claimRefs: [CM003, CM004, CM005, CM006, CM009, CM011, CM014, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: drivers-and-constraints
    title: Adoption drivers are real, but rollout speed and monetization remain the key constraints
    body: >-
      The clearest adoption drivers are regulatory pressure, direct operating
      pain, and the need for secure destruction plus sustainability outcomes in
      one workflow. ReFED's policy count and Divert's own retailer messaging
      both point to organic-waste regulation as a live budget trigger rather
      than a theoretical tailwind. At the same time, external reporting shows
      the service is operationally complex: destruction volumes vary by season,
      product, and site, traditional service models often fail to price that
      variability well, and Divert still needs capital-intensive facility build
      out to match the addressable stream. Public sources support demand and a
      differentiated operating model, but they stop short of proving how fast
      the company can commission infrastructure, what utilization it can
      sustain, or how pricing translates into durable unit economics.
    claimRefs: [CM006, CM008, CM010, CM011, CM012, CM014, CM015]
callouts:
  - calloutType: insight
    title: The market wedge is operational, not generic ESG spend
    body: >-
      Divert's best-fit buyers are enterprises that already own unsold food,
      disposal risk, and compliance obligations; the adoption case is strongest
      when buyers need secure destruction, reporting, and diversion in one
      workflow.
    claimRefs: [CM001, CM002, CM007]
  - calloutType: risk
    title: Public evidence supports demand, but not underwritten market share
    body: >-
      Available third-party datasets size the broader waste problem and the AD
      gap, but they do not disclose Divert's realized pricing, segment mix, or
      facility utilization, so public-market sizing remains indicative rather
      than underwriteable.
    claimRefs: [CM014, CM015]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Grocery retail
        - >-
            Reverse logistics, shrink reduction, donation optimization, secure
            destruction, landfill diversion, analytics, and compliance support
            for unsold store inventory.
        - >-
            Residential food waste, municipal collection, and generic hauling
            spend that does not include operational food handling.
        - >-
            Store operations, merchandising, sustainability, and waste or
            facilities budgets at chain level.
        - >-
            Directly named by Divert and supported by buyer pain around lost
            sales, hauling cost, and regulation.
      - - Food warehouses & distributors
        - >-
            Secure destruction, depackaging, logistics coordination, and
            circularity services for unsold or expired inventory in cold-chain
            and distribution networks.
        - >-
            General freight spend and ordinary warehousing services unrelated to
            diversion or destruction.
        - >-
            Distribution operations, logistics, sustainability, and quality or
            compliance owners.
        - >-
            Relevant adjacency where inventory variability and documentation
            needs favor an integrated provider.
      - - Food manufacturers
        - >-
            Processing of production residuals, contaminated goods, recalls, and
            byproducts, plus certified destruction and organics diversion.
        - >-
            Core production equipment, ingredient purchasing, or non-organic
            waste-management services.
        - >-
            Plant operations, EHS, quality, supply chain, and compliance
            budgets.
        - >-
            Directly named by Divert and consistent with its industrial
            operating posture.
      - - Out-of-scope and adjacent streams
        - >-
            Some foodservice and warehouse overflow can be relevant when the
            workflow resembles enterprise reverse logistics and destruction.
        - >-
            Household waste, farms, pure donation logistics, or single-step
            hauling and composting substitutes.
        - >-
            Municipal or consumer budgets rather than enterprise food owners.
        - >-
            Important for boundary discipline because headline food-waste TAMs
            otherwise overstate Divert's practical commercial wedge.
    notes: >-
      Scope combines company-issued workflow descriptions with chapter boundary
      logic; rows distinguish included commercial workflows from adjacent or
      excluded waste-management spend.
    claimRefs: [CM001, CM002, CM007, CM013]
