evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Snapshot KPI table disclosure gaps
    missingEvidence: Current revenue, ARR, gross margin, cash position, and current headcount.
    whyItMatters: >-
      These metrics determine underwriting of growth quality, liquidity, operating leverage, and later valuation
      support.
    diligencePath: >-
      Request the latest management financial package, audited statements, cap-table summary, and current headcount
      report.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: Leadership and founder table public-only coverage
    missingEvidence: A full current executive org chart, permanent COO appointment, and board committee structure.
    whyItMatters: Key-person dependence and succession resilience cannot be assessed from founder-centric public disclosures alone.
    diligencePath: Request the current org chart, board roster, committee assignments, and succession plan updates after March 2025.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder or investor map public-only coverage
    missingEvidence: >-
      Series C size, cap-table detail, Mitsubishi ownership stake, Wittington instrument terms, and creditor covenant
      package.
    whyItMatters: >-
      Control, dilution, and downside protections drive governance and valuation but are not public in the assigned
      source set.
    diligencePath: Request financing documents, cap table, board-right schedules, and debt or structured-finance term summaries.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som-underwriting
    missingEvidence: >-
      Segment-level pricing, average contract value, facility utilization, and revenue mix by retail, warehouse, and
      manufacturer accounts.
    whyItMatters: >-
      Public market-size lenses show demand, but underwriting market share and operating leverage requires monetization
      and throughput data.
    diligencePath: >-
      Request cohort-level customer economics, utilization by operating facility, and a bottoms-up pipeline to
      booked-volume bridge under NDA.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: warehouse-adjacency
    missingEvidence: >-
      Independent public data on refrigerated-warehouse destruction volumes, diversion budgets, and typical tipping-fee
      or service-fee structures.
    whyItMatters: >-
      The warehouse and logistics segment appears promising, but the public evidence does not yet bound its revenue pool
      or conversion economics.
    diligencePath: >-
      Pull third-party cold-chain and destruction-market studies or customer procurement documents that quantify unsold
      inventory destruction spend.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: public-pricing-benchmark
    missingEvidence: >-
      Executed contract terms, per-unit fees, minimum-volume commitments, and any value-share mechanics across Divert
      and adjacent vendors.
    whyItMatters: >-
      Without contract-level economics, switching-cost and margin comparisons stay directional rather than
      underwritable.
    diligencePath: Request customer contracts or RFP responses covering pricing, service-level commitments, and renewal mechanics.
