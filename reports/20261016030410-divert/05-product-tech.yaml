  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-and-privacy-controls
      missingEvidence: Public proof of named security certifications, privacy controls, uptime commitments, incident reporting, or a trust-center equivalent for customer data handling.
      whyItMatters: Divert's product includes customer data capture and operational workflows, so diligence needs more than marketing language to assess enterprise deployment risk.
      diligencePath: Request security questionnaire responses, certification letters, privacy documentation, uptime history, and incident-disclosure policy from management.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: integration-depth
      missingEvidence: Technical documentation on POS, ERP, WMS, or other system integrations, plus implementation timelines and required customer process changes.
      whyItMatters: Integration complexity drives deployment cost, stickiness, and failure risk, but the assigned evidence set only shows the workflow at a marketing level.
      diligencePath: Request architecture diagrams, sample implementation plans, integration lists, and a redacted statement of work from recent customers.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: depackaging-output-testing
      missingEvidence: Divert-specific public testing results or protocols for microplastics, packaging residue, digestate quality, and downstream soil-amendment controls.
      whyItMatters: The core processing model depends on proving that high-volume depackaging outputs remain acceptable to regulators and offtake partners.
      diligencePath: Request facility-level test results, permit correspondence, output specifications, and any third-party verification tied to digestate or fertilizer sales.
      relatedQuestionRefs: [QE007]
