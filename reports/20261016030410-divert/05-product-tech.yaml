    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Data analytics and waste insights, Retail operators and sustainability teams, 'In-market', 'Turns waste events into store-level visibility and benchmarking', 'No public detail on system integrations, reporting frequency beyond monthly, or data model']
      - [Reverse logistics program, Multi-site retailers and distributors, 'In-market', 'Lets customers move unsold food through existing operational flows instead of new disposal routes', 'No public SLA, lane economics, or regional coverage map']
      - [Depackaging and liquefaction, 'Retailers, warehouses, and food manufacturers', 'Scaled but still expanding', 'Enables packaged and contaminated food streams to be processed at industrial scale', 'No Divert-specific public testing protocol for output contamination or packaging residue thresholds']
      - [Integrated Diversion & Energy Facilities, Customers needing secure destruction and downstream conversion, 'Operating in Turlock; Longview and Lexington still scaling in 2026 disclosures', 'Pairs destruction/compliance needs with renewable-gas and soil-product outputs', 'No public facility utilization, uptime, or maintenance data']
    notes: >-
      Status labels reflect the assigned 2022-2026 evidence set; they are not audited operating KPIs, and null detail means
      the public record did not expose the technical detail needed for underwriting.
    claimRefs: [CE001, CE002, CE003, CE007, CE008, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Divert solution
      - Measurable benefit
      - Limitation
    rows:
      - ['Reduce backroom shrink and unsold food in grocery stores', 'Store teams collect unsold food and need visibility into what is being discarded', 'RFID-based tracking plus reverse logistics, donation support, and analytics', 'One retailer using the program across 190 stores reported a 9% reduction in tons of unsold food over five years', 'Benefit is from a company case study, not an independent benchmark']
      - ['Handle variable branded-product destruction at warehouses', 'Cold-storage operators face irregular destruction volumes and brand-protection requirements', 'Dynamic routing, documented destruction, and delivery to Turlock for depackaging plus anaerobic digestion', 'US Cold program diverted more than 2.5 million pounds over 15 months across seven facilities', 'Evidence does not show contract economics or how much of the result generalizes outside California']
      - ['Process production residuals, liquids, and contaminated packaged goods', 'Manufacturers need compliant destruction and landfill-diversion pathways', 'Divert markets certified destruction, liquid/slurry services, recall support, and compliance support', null, 'Assigned evidence does not disclose throughput, onboarding time, or named manufacturer integrations']
    notes: >-
      Measurable benefits mix company case-study outcomes and trade-press reporting; null indicates a marketed use case
      without public operating metrics in the assigned pool.
    claimRefs: [CE002, CE003, CE004, CE005, CE009, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ['Store or warehouse edge capture', 'Collect unsold-food events and identify waste by site or facility', 'RFID-enabled workflow adoption by customer staff', 'Public evidence shows monthly tracking, but not integration depth into POS, ERP, or WMS systems']
      - ['Reverse logistics and collection orchestration', 'Move unsold food into donation, destruction, or processing flows', 'Route density, container handling, and regional transport economics', 'Operational efficiency may vary materially by geography and customer density']
      - ['Donation sorting / compliance services', 'Separate edible recovery from non-donatable destruction streams', 'Customer cooperation, documentation, and local nonprofit pathways', 'Public evidence is stronger on offering breadth than on measured recovery rates']
      - ['Depackaging and liquefaction', 'Prepare mixed or packaged food for downstream conversion', 'Mechanical separation quality and contamination controls', 'Microplastics measurement and packaging-residue standards remain unsettled industrywide']
      - ['Anaerobic digestion and output commercialization', 'Convert prepared feedstock into RNG, fertilizer, soil amendment, and recovered water', 'Facility uptime, offtake agreements, and regulatory compliance', 'Assigned pool does not include independent facility-level uptime, yield, or quality data']
    notes: >-
      This architecture table mixes directly disclosed workflow steps with analyst synthesis about dependencies and risk; it
      should be read as an operating model, not as a published systems diagram from the company.
    claimRefs: [CE001, CE004, CE007, CE008, CE010, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Divert's public evidence points to a layered system that starts with customer-site capture and ends with energy and soil outputs.
    data:
      layers:
        - label: Customer edge
          detail: Customer sites generate the unsold-food stream and provide the first operational capture point.
          modules:
            - RFID tracking
            - Backroom bins and collection handling
        - label: Data and decisioning
          detail: Divert turns captured waste events into monthly visibility, benchmarking, and prevention insights.
          modules:
            - Waste analytics
            - Donation optimization
        - label: Logistics orchestration
          detail: Reverse logistics and routing connect distributed customer sites to downstream recovery or processing.
          modules:
            - Reverse logistics
            - Dynamic routing
        - label: Compliance and destruction
          detail: The service layer includes secure destruction and recall/compliance workflows before final processing.
          modules:
            - Certified destruction
            - Recall and compliance support
        - label: Processing infrastructure
          detail: Depackaging and liquefaction prepare mixed food streams for conversion at integrated facilities.
          modules:
            - Depackaging
            - Liquefaction
        - label: Energy and soil outputs
          detail: Anaerobic digestion converts prepared feedstock into sellable downstream products.
          outputs:
            - Renewable natural gas
            - Fertilizer, soil amendment, and recovered water
    approximationNotes: >-
      This figure is a synthesized architecture from assigned public sources; it is not a verbatim engineering diagram and
      should not be read as a complete software or plant-control stack.
    claimRefs: [CE001, CE004, CE007, CE008, CE011]
