schemaVersion: report-v2
artifact: product-tech
slug: divert
runDate: 2026-10-16
company:
  name: Divert
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Divert delivers a vertically integrated food-waste diversion system: data capture and reverse logistics at the edge,
    then depackaging and anaerobic-digestion infrastructure downstream. The assigned evidence supports real deployment
    maturity in retail and cold-chain workflows, but the public record remains thin on integration depth, software-security
    controls, and Divert-specific testing standards for depackaging outputs.
sections:
  - id: solution-scope
    title: What Divert actually delivers
    body: >-
      The product is not just a recycling endpoint. Divert markets an end-to-end operating model built around three linked
      outcomes - prevent waste, recover edible food, and convert non-donatable material into energy and soil products.
      In practice, that means the customer-facing offer spans store or facility data capture, reverse logistics, donation
      optimization, secure destruction, compliance support, and downstream processing. The strongest evidence is still
      company-issued, but it is specific enough to show that Divert sells an operational system embedded in grocery,
      warehouse, and food-manufacturing workflows rather than a single software module or hauling contract.
    claimRefs: [CE001, CE002, CE003, CE011]
    tableRefs: [TE001, TE002]
  - id: operating-model
    title: How the platform works in the field
    body: >-
      The clearest proof of technical and operational maturity comes from published workflow details. Divert's retailer
      case study shows monthly RFID-based store tracking tied to waste-reduction decisions, while Waste Dive's 2022
      reporting described a subscription software layer combined with additional processing fees and a footprint of modular
      depackaging sites plus digesters. More recent company and trade-press disclosures show the same model extending to
      warehouses and branded-product destruction through Turlock, with routing, destruction documentation, and energy
      conversion bundled into one service. That is a stronger signal of real implementation than generic circular-economy
      messaging, although the public material still does not expose detailed integration architecture or implementation
      timelines.
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: controls-risks
    title: Maturity signals and unresolved technical risk
    body: >-
      Divert appears differentiated because it combines upstream data capture with downstream owned or aligned processing
      infrastructure, which is harder to replicate than offering analytics or hauling alone. Scale claims on the homepage
      and in third-party summaries reinforce that the platform has moved beyond pilot status. The main product risk is not
      whether depackaging exists; it is whether the category can keep scaling without tighter standards for outputs,
      especially where digestate, packaging residue, and regulatory expectations intersect. The assigned pool also leaves
      material blind spots around software-security controls, privacy handling, uptime commitments, and named systems
      integrations, so product diligence still requires technical documentation rather than only marketing proof.
    claimRefs: [CE011, CE012, CE014]
callouts:
  - calloutType: strength
    title: Integrated workflow is the core product advantage
    body: >-
      Divert's defensibility is the combination of data capture, reverse logistics, and conversion infrastructure in one
      customer workflow, not any single module in isolation.
    claimRefs: [CE001, CE004, CE007, CE011]
  - calloutType: risk
    title: Depackaging governance remains a live technical risk
    body: >-
      Public evidence still does not close the loop on microplastics measurement, packaging-residue handling, or
      Divert-specific output testing, which matters because those issues sit inside the company's core processing model.
    claimRefs: [CE014]
tables:
