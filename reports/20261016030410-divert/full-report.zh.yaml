      - number: '4.3'
        title: 资本需求与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              资本故事比利润表更清晰，这种不对称正是本章的核心尽调问题。2026 年 1 月融资明确用于支持运营增长以及 Longview 和 Lexington 设施建设，但 Bioenergy International
              表示金额未披露。早期报道提供了规模背景：Waste Dive 称 Ara Partners 于 2021 年注入 1 亿美元，Enbridge 于 2023 年承诺 10 亿美元以扩大 RNG
              产能，管理层计划建设覆盖 30
              个地点的网络。这种组合意味着业务模式需要大量项目型资本，但本报告审阅的公开材料仍没有披露收入、ARR、毛利率、每座设施资本开支、营运资金需求、现金消耗或当前现金余额。另一个执行层面的变数是，Waste Dive
              报道截至 2025 年 3 月，Divert 尚未公开任命 COO 接任者；这很重要，因为下一阶段价值创造依赖于开设和运营更多基础设施，而不只是签下客户。
