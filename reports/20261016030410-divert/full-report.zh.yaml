            body: >-
              该产品不只是一个回收终点。Divert
              围绕三个相互关联的结果打造端到端运营模式——减少浪费、回收可食用食品，以及将无法捐赠的材料转化为能源和土壤产品。实际而言，面向客户的方案覆盖门店或设施数据采集、逆向物流、捐赠优化、安全销毁、合规支持和下游处理。最有力的证据仍来自公司自身，但细节足以说明
