      - 证据
      - 估值含义
      - 哪些情况会改变判断
    rows:
      - - 投资论点
        - Divert 将逆向物流、捐赠优化、拆包、厌氧消化和分析结合起来，而第三方项目证据显示了可测量的分流量和 RNG 产出
        - 如果平台还能带来可重复的设施经济性和客户留存，更广的平台范围可以支撑溢价估值
        - 设施级吞吐量、毛利率、合同留存率和贡献利润率披露
      - - 反论点
        - 最新融资公告隐去规模和价格，公开 KPI 页面没有日期且定义不一，公开的领导层交接披露仍不完整
