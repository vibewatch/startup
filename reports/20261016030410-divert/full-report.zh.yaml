  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和环境审查是最难排除的下行风险
        blocks:
          - type: paragraph
            body: >-
              Divert 的模式依赖厌氧消化继续成为未售食品在政治、运营和财务上都可接受的终端市场，但资料集中最有力的独立证据表明，对消化设施的更广泛审查正在进行，而非假设情形。Earthjustice 表示，USDA
              将新建粪肥消化器贷款担保的暂停延长至 2026 年底，并另行就消化器融资记录提起 FOIA 诉讼；The New Lede 则记录了一个可比消化设施的甲烷泄漏、异味投诉和许可证续期压力。这些都不能证明
              Divert 设施发生过事故，但说明公司正在进入一个运营类别：补贴假设、许可证条款、排放控制和社区容忍度都可能比公司公开披露的速度更快地变化。在投资者审阅 Turlock、Longview 和 Lexington
              逐设施的许可证、排放监测和违规历史之前，剩余监管风险应视为高。
