    title: 竞争定位图
    type: quadrant
    summary: 根据所需运营基础设施规模，以及指定证据显示的减量和价值回收范围，对买方替代方案进行序数定位。
    data:
      xAxis:
        label: 处理控制 / 基础设施强度
        min: 1
        max: 5
        low: 轻资产外包
        high: 嵌入式或自有运营基础设施
        description: Ordinal positioning derived from assigned source descriptions
        scale: ordinal
      yAxis:
        label: 减量和价值回收深度
        min: 1
        max: 5
        low: 仅处置
        high: 减量加多产物回收
        description: Ordinal positioning derived from assigned source descriptions
        scale: ordinal
      points:
        - label: 填埋 / 焚烧
          x: 1
          'y': 1
          summary: Disposal endpoint with little recovery and continuing high retail share.
          claimRefs:
            - CP009
        - label: 捐赠 + 人工分拣
          x: 2
          'y': 3
          summary: High-priority edible pathway but incomplete for non-donatable food.
          claimRefs:
            - CP008
            - CP009
        - label: 集中式堆肥 / AD 服务商
          x: 4
          'y': 3
          summary: Diversion infrastructure exists, but contamination and downstream access constrain results.
          claimRefs:
            - CP011
            - CP012
            - CP014
        - label: 店内废物转饲料
          x: 5
          'y': 4
          summary: Decentralized pilot pairs prevention data with feed output, but scaling is early.
          claimRefs:
            - CP010
            - CP011
        - label: 内部建设
          x: 4
          'y': 2
          summary: Highest control, but manual depackaging and store labor can make execution heavier.
          claimRefs:
            - CP013
        - label: Divert 一体化平台
          x: 4
          'y': 5
          summary: National outsourced platform combining prevention, donation, routing, depackaging, and energy recovery.
          claimRefs:
            - CP001
            - CP003
            - CP004
            - CP007
            - CP015
    approximationNotes: 坐标是根据指定资料作出的、有证据支持的序数判断，并非来源公布的基准分数或市场份额百分比。
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP007
      - CP009
      - CP010
      - CP011
      - CP013
      - CP015
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: Divert 将客户的废弃物处理工作流转化为服务收入和下游回收产品价值，但公开来源没有披露各阶段之间的定价或毛利润传导。
    data:
      nodes:
        - id: source-stream
          label: 零售商、仓库、分销商和制造商产生的未售食物
          detail: 这股输入流带来废弃物运输、合规、销毁和减少损耗的需求。
        - id: service-layer
          label: 收集、逆向物流、捐赠和合规销毁服务
          detail: 商业前端以定制化企业方案销售，而不是公开价目表。
        - id: analytics-layer
          label: RFID 跟踪、基准比较和客户辅导
          detail: 数据层旨在减少损耗，并持续改善采购决策。
        - id: processing-layer
          label: Integrated Diversion & Energy 设施的拆包和厌氧消化
          detail: Turlock 已投入运营；2026 年融资公告将 Longview 和 Lexington 列为扩建项目。
        - id: output-layer
          label: RNG、肥料、土壤改良剂和回收水
          detail: 下游变现已经存在，但公开的承购价格和毛利率尚未披露。
        - id: value-layer
          label: 客户节省、合规支持和循环利用成果
          detail: 公开价值主张强调降低运输成本、改善商品管理，以及满足分流出填埋场的合规要求。
      edges:
        - from: source-stream
          to: service-layer
        - from: service-layer
          to: analytics-layer
        - from: analytics-layer
          to: processing-layer
        - from: processing-layer
          to: output-layer
        - from: output-layer
          to: value-layer
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Divert 的公开证据指向一套分层系统：从客户现场捕捉废弃物开始，最终产出能源和土壤产品。
    data:
      layers:
        - label: 客户端
          detail: 客户现场产生未售食物流，并提供首个运营捕捉点。
          modules:
            - RFID 跟踪
            - 后场垃圾桶和收集处理
        - label: 数据与决策
          detail: Divert 将捕捉到的废弃物事件转化为月度可视性、基准比较和减量洞察。
          modules:
            - 废弃物分析
            - 捐赠优化
        - label: 物流编排
          detail: 逆向物流和路线规划将分散的客户现场连接至下游回收或处理环节。
          modules:
            - 逆向物流
            - 动态路线规划
        - label: 合规与销毁
          detail: 服务层在最终处理前涵盖安全销毁以及召回 / 合规工作流。
          modules:
            - 合规销毁
            - 召回与合规支持
        - label: 处理基础设施
          detail: 拆包和液化为混合食物流在一体化设施中的转化做好准备。
          modules:
            - 拆包
            - 液化
        - label: 能源与土壤产品
          detail: 厌氧消化将准备好的原料转化为可销售的下游产品。
          outputs:
            - 可再生天然气
            - 肥料、土壤改良剂和回收水
    approximationNotes: 本图是根据指定公开来源综合出的架构，并非逐字还原的工程图，也不应被视为完整的软件或工厂控制栈。
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Divert 销售一套捆绑式运营闭环，从门店或仓库捕捉废弃物开始，再通过测量、培训和新增处理能力持续扩展。
    data:
      items:
        - label: 识别后场或仓库废弃物
          stage: 发现问题
          touchpoints:
            - 未售出或无法捐赠的包装食品在门店、仓库或制造流程中积累
            - 买方痛点包括损耗、合规、人工负担和符合品牌要求的销毁
          tone: neutral
        - label: 配置逆向物流收集
          stage: 运营设置
          touchpoints:
            - Divert 为多地点客户提供逆向物流和灵活收集方式
            - 方案设计必须适配现有门店或仓库运营
          tone: positive
        - label: RFID / 数据分析带来可视性
          stage: 测量
          touchpoints:
            - 跟踪并比较各门店的未售食物数据
            - 利用洞察识别减量和采购机会
          tone: positive
        - label: 执行捐赠与销毁工作流
          stage: 去向控制
          touchpoints:
            - 将可食用食物回收与不可捐赠产品处理分开
            - 合规销毁和文件记录支持品牌及合规需求
          tone: positive
        - label: 拆包和消化完成闭环
          stage: 处理
          touchpoints:
            - 包装食品可在场外处理，无需门店员工先行分拣
            - 产出包括可再生能源以及土壤或肥料产品
          tone: positive
        - label: 扩张取决于培训和新增产能
          stage: 土地与扩张闭环
          touchpoints:
            - 现场团队和联合培训支持各地点重复使用
            - 未来新增地点取决于额外设施产能持续在线并签有合同
          tone: warning
    claimRefs:
      - CU002
      - CU003
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在高影响单元，涉及消化设施政策、设施爬坡，以及对集中度敏感的路线密度。
    data:
      columns:
        - label: 可能性
          detail: 根据指定公开证据作出的定性判断，不是事件频率估计。
        - label: 影响
          detail: 对设施经济性、客户交付或投资判断信心的潜在后果。
        - label: 缓释成熟度
          detail: 仅涵盖公开可见的缓释措施；指定证据中没有私有控制信息。
      rows:
        - label: 消化设施政策与融资
          values:
            - label: 中
              tone: warning
              note: USDA 暂停粪肥消化设施贷款是类别层面的证据，不是针对 Divert 的融资行动。
            - label: 高
              tone: negative
              note: 更严格的补贴或贷款条件可能推高基础设施扩张成本。
            - label: 低
              tone: negative
              note: 没有公开下行情景展示在缺乏有利外部融资时的设施经济性。
        - label: 设施许可与排放
          values:
            - label: 中
              tone: warning
              note: 可比消化设施证据使其成为尽调重点，但并未证明 Divert 发生过相关事件。
            - label: 高
              tone: negative
              note: 许可限制、排放控制或扰民投诉可能延迟或限制设施运营。
            - label: 低
              tone: negative
              note: 指定资料中没有公开设施层面的许可、监测结果和事件历史。
        - label: 新设施投产
          values:
            - label: 中
              tone: warning
              note: Longview 和 Lexington 在 2026 年 1 月的公司公告中仍是推进中的建设项目。
            - label: 高
              tone: negative
              note: 延期会推迟产能释放，而资本仍被锁定在实体扩张上。
            - label: 中
              tone: warning
              note: 新融资和内部提拔 COO 是可见的缓释措施，但爬坡 KPI 尚未披露。
        - label: 锚定客户与路线密度
          values:
            - label: 中
              tone: warning
              note: 公开案例显示存在大型多地点方案，但没有客户集中度表。
            - label: 高
              tone: negative
              note: 失去一个锚定客户可能同时减少服务收入和收集密度。
            - label: 中
              tone: warning
              note: 逆向物流整合和定制化路线有助于留存客户，但合同条款无法获得。
        - label: 合规销毁与合规
          values:
            - label: 低—中
              tone: neutral
              note: 指定证据中未发现 Divert 特有的失败事件。
            - label: 高
              tone: negative
              note: 控制失效可能影响客户合规、召回、文件记录和品牌完整性。
            - label: 中
              tone: warning
              note: Divert 描述了专门流程和支持，但没有第三方控制审计可供查阅。
        - label: KPI 定义与报告
          values:
            - label: 高
              tone: negative
              note: 公开页面使用不同的地点指标，却没有日期或对账说明。
            - label: 中
              tone: warning
              note: 无法比较的运营数量削弱了基线投资判断，但不能证明运营失败。
            - label: 低
              tone: negative
              note: 指定公开证据没有提供指标字典或报告衔接。
    approximationNotes: 可能性和影响分档是根据引用证据综合出的分析师判断；指定资料中没有可用于概率模型的事件率或设施运行时间数据集。
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR009
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 已验证的运营证据导向继续跟踪的建议，因为估值和经济性仍未披露，资本与执行风险也仍在。
    data:
      nodes:
        - id: verified-funding
          label: 已验证的 2026 年融资
          detail: Wittington 领投的融资确认了支持，但没有确认价格。
        - id: facility-buildout
          label: 设施建设
          detail: Longview 和 Lexington 预计于 2026 年启动；Turlock 已被称为具备 100,000 吨年产能。
        - id: traction-proof
          label: 第三方业务牵引力证据
          detail: US Cold 案例证据显示存在多地点分流和 RNG 产出。
        - id: economics-opacity
          label: 经济性不透明
          detail: 留存的公开资料没有披露收入、利润率、现金或轮次规模。
        - id: execution-risk
          label: 执行风险
          detail: 管理层交接和此前的大额资本承诺抬高了投资判断门槛。
        - id: recommendation
          label: 建议
          detail: 在价格和单位经济性披露前继续跟踪 / 深入研究。
      edges:
        - from: verified-funding
          to: facility-buildout
        - from: facility-buildout
          to: traction-proof
        - from: traction-proof
          to: recommendation
        - from: economics-opacity
          to: recommendation
        - from: execution-risk
          to: recommendation
    approximationNotes: 这是定性决策链，而非加权评分模型；节点顺序展示逻辑流，而不是概率或规模。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV014
      - CV016
