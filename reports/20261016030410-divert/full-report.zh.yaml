      - number: '4.2'
        title: 公开牵引力与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引力证据方向上积极，但定义并不统一。Divert 首页目前宣传 7.8K 个客户地点和累计处理 4.2b 磅，另一张官方页面则引用 6,683 个客户地点，Waste Today
              报道食品供应链上的客户地点超过 7,800 个。这些数字支持公司已具备真实规模，但差异表明它们可能来自不同时间点或 KPI
              定义发生变化，而不是稳定的审计指标。最具体的客户成果证据是一项公司案例研究：据报道，一项覆盖 190 家门店的杂货零售项目在五年内将未售食品吨数减少 9%，同时提高了销售额。Waste Today 的 US
              Cold 案例提供了第二个运营代理指标：15 个月内在七个设施处理了 1,250 吨材料，并通过动态定价将物流导入 Turlock
              的厌氧消化系统。这些来源共同说明业务能够创造客户价值并形成路线密度，但仍未披露抽成率、贡献利润率或回本周期。
