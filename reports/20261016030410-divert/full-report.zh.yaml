  - id: FM001
    title: 受限的美国市场规模视角
    type: pyramid
    summary: 广义食物浪费问题规模庞大，但一旦只看类似 Divert 的商业工作流和当前设施级处理能力，可服务市场会迅速收窄。
    data:
      items:
        - label: 2024 年美国剩余食物
          value: 70
          unit: million tons
          detail: ReFED 对美国完整供应链剩余食物的总量估算。
        - label: 非住宅剩余食物
          value: 46.6
          unit: million tons
          detail: 从 70M 吨总量中扣除 ReFED 估算的 33.5% 住宅占比后得出。
        - label: 制造业 + 餐饮服务 + 零售市场
          value: 29.7
          unit: million tons
          detail: 根据 ReFED 的行业占比推导，最接近 Divert 所称商业细分市场的部分。
        - label: 制造业 + 零售市场
          value: 17.2
          unit: million tons
          detail: 这是排除餐饮服务后的推导子集，因为 Divert 留存的资料强调零售和工业工作流。
        - label: 仅零售视角
          value: 4
          unit: million tons
          detail: 根据 ReFED 估算的剩余食物中零售占比 5.7% 推导。
        - label: 单座运营设施基准
          value: 0.1
          unit: million tons per year
          detail: Divert 称其 Turlock 设施年处理能力为 100,000 吨。
    approximationNotes: 第 2 至第 5 层是将 ReFED 的行业占比应用于其 70M 吨总量后推导的；最后一层采用 Divert 所称 Turlock 年处理能力作为吞吐量基准，而不是全公司的 SOM。
