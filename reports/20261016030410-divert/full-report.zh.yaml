        - 市政或消费者预算，而不是企业食品所有者的预算。
        - 这对边界控制很重要，否则标题式食物浪费 TAM 会高估 Divert 的实际商业切入点。
    notes: 范围结合公司发布的工作流描述与章节边界逻辑；各行区分纳入的商业工作流与相邻或排除的废弃物管理支出。
