              Lexington 预计在 2026 年晚些时候开始运营，而 Turlock 已定位为年产能 100,000 吨的设施。WasteDive 的历史融资摘要补充了背景：Ara 于 2021 年注入 1
              亿美元，Enbridge 于 2023 年承诺 10 亿美元以扩大 RNG
              产能。这段资本历史提高了新一轮融资的投资判断门槛，因为它指向一个大型基础设施故事；但最新公开融资披露仍没有提供判断新资金是以有吸引力、持平还是稀释性的价格进入所需的条款。RNG Coalition
              确认北美存在有组织的 RNG 行业，但没有提供交易倍数；Anaergia 披露的 2026 年收入、利润率、EBITDA 和积压订单可作为方向性运营参照。没有匹配的 Divert
              财务数据和业务模式调整，任何一个来源都无法支持有定价依据的倍数比较。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
