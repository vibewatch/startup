        - 当前资本表条款、更新后的管理层披露和同步的运营 KPI
      - - 可比公司局限
        - Anaergia 披露了 2026 年收入、毛利率、调整后 EBITDA 和积压订单；RNG Coalition 证实存在行业网络，但没有交易倍数；Divert 未在留存样本中披露可匹配的财务产出
        - 在 Divert 能与已披露同行或里程碑基准统一口径前，基于倍数定价都很脆弱
        - 可与公开替代方案比较的收入、利润率、积压订单、利用率和现金桥接
    notes: 使用一家公开可比公司和若干公司披露；结论仅指示方向，并明确受 Divert 价格及运营财务披露缺失限制。
