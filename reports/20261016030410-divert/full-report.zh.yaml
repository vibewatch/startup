      - - 食品仓储和分销商
        - 针对冷链和分销网络中未售或过期库存的安全销毁、拆包、物流协调和循环服务。
        - 与分流或销毁无关的一般货运支出和普通仓储服务。
        - 分销运营、物流、可持续发展以及质量或合规负责人。
        - 相关邻近市场：库存波动和文件要求有利于一体化供应商。
      - - 食品制造商
        - 处理生产残余物、受污染商品、召回品和副产品，以及认证销毁和有机物分流。
        - 核心生产设备、原料采购或非有机废弃物管理服务。
        - 工厂运营、EHS、质量、供应链和合规预算。
        - Divert 直接点名的领域，也符合其工业运营定位。
      - - 范围外及相邻流
        - 当工作流类似企业逆向物流和销毁时，部分餐饮服务和仓储溢出量可能相关。
