      - number: '8.3'
        title: 情景框架与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              情景差异的关键不在于 Divert 是否做出了有用的东西，而在于它能否证明规模化后的持久经济性。留存来源支持可信的平台故事：Divert
              描述了覆盖逆向物流、拆包、厌氧消化、分析和合规支持的一体化堆栈，第三方报道也显示客户项目正在产生可量化的填埋分流和 RNG
              产出。看空一侧来自披露质量和执行不确定性，而不是公开视野中已经出现明确的产品失败。公司控制的页面没有明显发布日期，却报告了定义不同的规模数字，因此不能把 6,683 个地点和 7.8K
              个地点视为同一时期的增长序列。WasteDive 还记录了一次 COO 交接，而其引用的公开记录中接任细节仍待确认。在超越跟踪模式前，投资者应要求当前轮次文件、标准化设施经济性，以及有日期且定义一致的管理层和运营
              KPI 披露。
            claimRefs:
