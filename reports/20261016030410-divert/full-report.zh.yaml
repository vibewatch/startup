        title: 资本基础、估值信号与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Divert 的公开融资记录指向资本密集型基础设施故事，而不是轻量级软件业务。TechCrunch 报道了 2023 年 Ara 和 Enbridge 的融资组合及一项大额结构化融资承诺；2026 年 1
              月公司公告披露由 Wittington Investments 领投的新融资；交易法律顾问则称，2026 年 4 月 Mitsubishi 合作使 Mitsubishi 成为 C 轮融资的领投方，并将估值推至
              10 亿美元以上。这些数据点共同说明 Divert
              仍能吸引战略和财务资本，但没有披露售出的总股数、投前估值机制、债务契约、董事会权利或当前所有权集中度。这些缺失信息很重要，因为公司正在同时扩大实体设施、物流和能源商业化。
