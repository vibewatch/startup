chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Divert 当前的公开定位在官网和近期新闻稿中保持一致：公司成立于 2007
              年，自称是一家专注于防止食物被浪费的循环经济企业，并表示其模式结合数据驱动的预防、可食用食品回收，以及将无法捐赠的未售食品转化为可再生能源和肥料。当前运营范围较广，并非单一垂直领域；Divert
              面向杂货零售商、食品仓储和分销商及食品制造商销售平台。这家私营公司的规模声明颇有分量：公司材料和近期报道都指向超过 7,800 个客户地点，但指定资料集没有公开拆分其商业组合和各细分市场的收入贡献。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
