      - number: '2.2'
        title: 公开规模测算框定机会，但无法得出清晰的 SAM
        blocks:
          - type: paragraph
            body: >-
              独立市场数据证明底层废弃物流规模庞大，但现有数字只是观察视角，并不是现成的 SAM。ReFED 估算，2024 年美国剩余食品总量为 7,000 万吨，价值 3,800 亿美元，约占食品供应的 29%。将
              ReFED 的行业构成应用于该总量，制造业、餐饮服务和零售业合计约 2,970 万吨，其中零售业约 400 万吨；这些数字覆盖 Divert 所称的垂直领域，因此可作为方向性边界，但仍是推导得出的估算。EPA
              则提供了另一种视角，显示相关废弃物中已有多少通过厌氧消化处理，尤其是在制造业之外。结果是一个可信的巨大机会，但没有公开数据集能清晰剥离出 Divert 可变现的区域、细分市场或设施层面可服务市场。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
