  - id: TP001
    title: 竞争对手概览表
    columns:
      - 替代方案
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Divert 一体化平台
        - 直接竞争
        - 14 座设施；计划到 2031 年增至 30 座；估值 >$1B；2026 年新获融资
        - 杂货零售商、分销商、制造商
        - 打包提供预防数据、捐赠、逆向物流、拆包、AD 和 RNG 产出
        - 公开定价仍不透明；废弃包装目前仍会被填埋
      - - 填埋 / 焚烧加现有运输
        - 既有方案 / 现状
        - 普遍存在的既有选项；零售剩余物中近 30% 仍流向这里
        - 任何已有废弃物处置合同的食品零售商
        - 流程改动最少，去向也熟悉
        - 价值回收极少；监管和甲烷暴露不断上升
      - - 捐赠优先的人工分拣
        - 替代方案
        - 常见的第一步，但全部剩余食物中只有 2.5% 被捐赠
        - 有可食用剩余物和非营利合作伙伴的零售商
        - 对可食用食物最合适，资本开支低
        - 无法解决不可捐赠的流向或下游处理
      - - 集中式堆肥 / AD / 脱水设备供应商
        - 邻近方案 / 既有供应商
        - 2025 年投入 >$270M，以降低回收和有机物分流的门槛
        - 面临新有机物分流规定的企业
        - 相比仅填埋处理，可以让分流更容易、成本更低
        - 污染风险和不均衡的下游接入仍是问题
      - - Mill / Whole Foods 废弃物转饲料
        - 邻近进入者
        - Whole Foods 计划于 2027 年推广；目标替代 5-10% 的饲料
        - 门店运营受控的大型杂货商
        - 分散式店内处理，加上 AI/CV 废弃物数据
        - 食品安全、物流和基础设施仍限制饲料采用
      - - 内部自建 / 自行拆包
        - 替代方案 / 内部建设
        - 最适合拥有内部物流控制能力的大型多网点运营商
        - 愿意自行设计流程的连锁企业或分销商
        - 对工作流和供应商体系的控制最大
        - 人工拆包浪费时间和资金；波动性会损害经济性
    notes: 规模和融资将公开运营指标与类别层面的市场信号混在一起；定价单列于 TP003，因为指定来源很少公布合同条款。
