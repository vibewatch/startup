              - CO011
      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层连续性仍围绕两位联合创始人。独立报道确认 Ryan Begin 和 Nick Whitman 是最初的创始人；2025 年 3 月的领导层变动也说明创始人风险并非理论问题：Whitman 在近 18
              年的日常运营后离开 COO 职位，转任董事会成员和战略顾问。2026 年 1
              月融资公告还显示外部治理影响力正在上升，新增董事任命与新资本支持相挂钩。对尽调而言，这种变化有利有弊：工业和能源监督范围扩大了，但公开证据仍未确认长期 COO 接任者，也没有完整的委员会级治理图谱，因此
              Begin 之下的执行深度仍是待核实的尽调问题。
            claimRefs:
              - CO008
              - CO013
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO013
              - CO014
