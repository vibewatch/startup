              - CM011
              - CM014
      - number: '2.3'
        title: 采用驱动因素真实存在，但落地速度和变现仍是关键约束
        blocks:
          - type: paragraph
            body: >-
              最清晰的采用驱动因素是监管压力、直接运营痛点，以及在一个工作流中同时实现安全销毁和可持续发展结果的需求。ReFED 的政策统计和 Divert
              自己面向零售商的信息都指向有机废弃物监管：它是现实的预算触发因素，而非理论上的顺风。与此同时，外部报道显示该服务在运营上很复杂：销毁量会随季节、产品和地点变化，传统服务模式往往难以准确为这种波动定价，而
              Divert 仍需要资本密集型设施扩建来匹配可服务的废弃物流。公开来源支持需求和差异化运营模式，但尚未证明公司能多快投产基础设施、能维持多高的利用率，或定价如何转化为持久的单位经济性。
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场切入点是运营需求，而非泛化的 ESG 支出
            body: Divert 最匹配的买方是已经承担未售食品、处置风险和合规义务的企业；当买方需要在一个工作流中完成安全销毁、报告和分流时，采用理由最充分。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: callout
            title: 公开证据支持需求，但不足以支撑可投资的市场份额判断
            body: 现有第三方数据集量化了更广泛的废弃物问题和 AD 缺口，但没有披露 Divert 的实际定价、细分组合或设施利用率，因此公开市场规模测算仍只是指示性的，无法据此做投资判断。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正的竞争集合是买方替代方案，而不只是创业公司同行
        blocks:
          - type: paragraph
            body: >-
              指定资料集呈现的竞争格局比狭窄的创业公司可比名单更广。对于杂货零售商或食品制造商，实际替代方案包括维持现状的填埋或焚烧、先捐赠再分拣、内部处理、通用有机物分流供应商，以及更新的店内废弃物转饲料系统。ReFED 的
              2024 年图景显示现状仍然根深蒂固：全部剩余食品中只有 2.5% 被捐赠，11% 用作牲畜饲料，85% 仍进入废弃物去向；Food Tank 则称，近 30%
              的零售剩余食品仍被送往填埋场或焚烧厂。在这个基准上，Divert
              销售的不是单点解决方案，而是一种外包运营模式，将数据、捐赠回收、逆向物流、拆包和下游能源回收结合起来。因此，最相关的比较集合是现有供应商和替代方案的组合，它们可以凭借简单性、既有路线或特殊场景经济性胜出，而不只是进行软件功能的正面比较。
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP009
              - CP015
