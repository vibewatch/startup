  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Longview 和 Lexington 按时启动，平台将更多多地点客户转化为经常性吞吐量，当前融资能够延长而非限制扩张
        - 只有在私下尽调显示设施经济性可规模化，且融资轮价格仍留下风险投资式上行空间后，才重新评级
        - 建设爬坡、利用率滞后，以及需求尚未跟上就过度建设
        - 需要新的设施投产证据和已披露的运营指标
      - - 基准
        - Divert 继续增加基础设施和客户项目，但公开披露足以维持市场兴趣，却过于单薄，无法支撑有价格约束的高确信度判断
        - 保持跟踪状态，只有数据室弥合平台叙事与单位经济性之间的差距后，才进行投资判断
        - 融资轮条款仍不透明，客户集中度仍未披露，公司材料中的 KPI 漂移持续存在
        - 最符合截至 2026-10-16 的留存记录
      - - 看跌
        - 扩张消耗资本的速度快于商业经济性得到验证的速度，管理层交接拉长执行周期，下一轮融资的价格或优先权条款也可能转弱。
        - 下轮融资若发生估值下调或采用高度结构化条款，新资本分走的上行空间会多于现有投资者。
        - 设施延期、募资阻力，以及不可靠的公开 KPI 基线。
        - 如果 2026 年投产里程碑之后的新披露仍不包含经济性数据，这种情形会更可能发生。
    notes: 由于留存的公开资料没有披露 Divert 的收入、毛利率、现金余额或当前轮次价格，情景逻辑按里程碑而非数字构建。
