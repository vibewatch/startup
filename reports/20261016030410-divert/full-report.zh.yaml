  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与付费方
        blocks:
          - type: paragraph
            body: >-
              Divert 并不是在整个食物浪费市场中销售。公司材料将实际切入点定义为掌控未售商业库存的企业客户：杂货零售商、食品仓储和分销商及食品制造商。其工作流也比运输或仅做堆肥的替代方案更窄。Divert
              围绕逆向物流、捐赠优化、认证销毁与拆包、数据分析和厌氧消化提供端到端服务，因此买方通常是希望降低损耗、处置成本和合规摩擦的运营或可持续发展负责人，而不是消费者或市政机构。领导层名单也印证这是一种分层的企业销售模式：公司设有专门的零售和工业管理团队，而非单一的通用
              SMB 渠道。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
