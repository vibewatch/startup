            body: >-
              有日期的记录显示，公司正从长期培育的废弃物分流运营商转向更明确的基础设施平台。公开里程碑包括 2007 年成立、2021 年和 2023 年在资助方支持下扩张、2025 年创始人角色转换，以及 2026
              年的一系列新融资、战略合作活动和运营案例。近期最有力的证明并非财务披露，而是运营证据：Divert 及其合作方的报道显示，与 United States Cold Storage 合作的加州项目在前 15
              个月内，从七个设施处理了超过 2.5m 磅未售产品。仍缺少的正是后续尽调最需要的内容：当前收入、利润率、员工人数、设施层面的经济性，以及转型后运营领导层的清晰情况。
