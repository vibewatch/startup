      - number: '3.2'
        title: Divert 以工作流广度和路线灵活性实现差异化
        blocks:
          - type: paragraph
            body: >-
              公开证据始终将 Divert
              描述为面向杂货零售商、仓储、分销商和制造商的端到端平台，而不是小众回收商。官方页面强调监管合规支持、逆向物流、认证销毁、捐赠优化和数据分析，独立报道也显示这些能力已出现在真实运营项目中。Safeway
              案例很重要，因为它将平台与可量化的门店行为变化联系起来：食品捐赠量增加，同时不可食用材料被转化为下游可再生能源。US Cold 案例则提供了另一个角度：可变销毁量、季节性和多地点路线问题，正是 Divert
              认为传统服务模式会失灵、动态定价和材料路由可以发挥作用的地方。这种组合靠流程重设计和运营整合带来切换成本，而不是依靠透明的公开价目表。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP013
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
              - CP013
              - CP015
      - number: '3.3'
        title: 持久性取决于污染控制、资本获取以及去中心化模式能否规模化
        blocks:
          - type: paragraph
            body: >-
              护城河有意义，但并非牢不可破。Divert 的资本市场地位似乎强于本地处理商，因为 Mitsubishi 交易将股权与优先 RNG 承购权结合起来，强化了从废弃物处理和下游能源中变现的模式。但 ReFED
              也指出该类别正在吸引新资本，并警告如果不能保持产出清洁，拆包解决方案可能带来 PFAS 或微塑料污染风险。与此同时，Mill 和 Whole Foods 正在测试另一种架构：把店内去中心化处理与 AI /
              计算机视觉废弃物数据和低成本饲料目标结合起来。Food Tank 还强调了这条路径的约束——食品安全、物流和有限的基础设施仍在拖慢动物饲料的采用——因此去中心化进入者尚未消除 Divert
              中心化网络的价值。实际结论是，Divert 在复杂、多地点、合规要求高的流中最强；当买方可以分离单一流并用更简单的处置或饲料路径解决时，其差异化较弱。
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP010
              - CP014
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Divert
              公开描述的是捆绑式运营模式，而不是一条清晰且已披露的软件或商品收入线。公司面向杂货商、制造商、仓储和分销商，将逆向物流、认证销毁、捐赠优化、分析和监管支持作为一个端到端方案销售；随后把未售且无法捐赠的食品转化为可再生天然气、肥料和土壤改良剂，以变现下游产出。价值叙事强调节省废弃物运输费用、改善采购决策、确保品牌安全的销毁以及合规支持，但指定公开页面没有披露挂牌价格、合同最低额、收入组合，也没有说明分析服务是单独销售还是捆绑在服务合同中。Waste
              Today 的合作方案例提供了一个重要线索：Divert 称其对多地点销毁项目采用动态定价和优化材料路由，可见定价会根据数量和物流复杂度协商，而不是采用标准费率表。商业逻辑因此可理解，但实际单位经济性仍不可见。
            claimRefs:
