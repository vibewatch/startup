  topStrengths:
    - 端到端 Mission Foundry 模式叠加 95% 垂直整合，撑起较耐久的制造和运营护城河。
    - 11 颗卫星任务成功率 100%，证明工程执行质量在早期航天硬件公司里少见。
    - 客户横跨国家安全（Space Force、NRO、MDA）、商业 IoT（Hubble Network）和气候（FireSat），降低单一客户集中风险。
    - Series C 超额认购，Google、Salesforce Ventures、Wellington Management 等战略投资者入局，显示科技资本和机构资金都下注。
    - FireSat 入选 TIME Best Inventions of 2025 并获 SpaceNews Icon Award，拉开品牌差异，也强化 ESG 定位。
  topRisks:
    - 制造产能要从当前水平拉到 2027 年 500 颗/年，约 10 倍爬坡，规模化证据仍不足。
    - 高度依赖 SpaceX 拼车发射，排期风险集中；公司也在主动寻找替代发射选项。
    - 估值约 $1.5B，意味着远期倍数偏高（约 24x 2025 ARR）；要撑住估值，需要持续 100%+ 增长。
    - 同一赛道里，资本充足的 Apex Space（$2.3B）和 K2 Space（$6.8B）竞争在加剧。
    - 政府预算周期和 ITAR / 出口管制可能拖慢国际主权客户合同管线。
  unresolvedGaps:
    - 毛利率、烧钱速度、单颗卫星净单位经济性均未披露；这些是判断资本效率的关键。
    - 政府与商业收入占比没有公开拆分，集中风险无法精确量化。
    - 员工数未披露，招聘速度和运营杠杆指标都看不到。
    - Condor-Ultra 平台目标 2028 年推出，但尚未披露客户或合同承诺。
    - Series B1 信贷额度（$45M）条款未披露，杠杆和契约风险未知。
