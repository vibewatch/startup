      - number: '1.3'
        title: 融资历史、估值模糊性与规模信号
        blocks:
          - type: paragraph
            body: >
              最清晰的公开融资事实，是 2025 年 6 月合并后的 Series B 总额，以及 2026 年 8 月完成的 Series C。Muon 自己的新闻稿称，Series C 让累计股权融资超过 $386M，由
              Eclipse Capital 领投，财团包括 Google、Salesforce Ventures、Wellington Management、I Squared Capital、Woven
              Capital，以及 Radical Ventures、Congruent Ventures、Costanoa Ventures、Activate Capital、ACME Capital、ArcTern
              Ventures、Overlap Holdings 等老股东。更早的 Series B 和 B1 公告确认公司合计融资 $146M，其中包含有意义的信贷部分，并把这笔资金用于制造扩张和收购 Starlight
              Engines 推进业务。

              估值的确定性弱于融资事实。多家媒体重复了约 $1.5B 的估值，但 Reuters 报道称公司拒绝确认。运营指标比估值披露更扎实：Muon 报告称已通过六次发射部署 11 颗卫星、在研卫星超过 50
              颗、未来一年已有 13 个发射名额排定，并以 2027 年年产 500 颗卫星为目标。收入质量仍是最大的缺失财务输入。GetLatka 发布了 2025 年收入或 ARR 等价代理指标
              $62.5M；公司也称收入连续第二年同比增长超过 100%。但公开材料仍没有审计后的收入运行率、利润率或员工数桥接。
