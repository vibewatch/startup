      - number: '2.2'
        title: TAM、SAM 与 SOM 需要多重视角，并保留矛盾
        blocks:
          - type: paragraph
            body: >
              Muon 所在领域的公开市场测算方向上向好，但方法并不一致。更宽口径的小卫星来源，从 2025 年约 $7.82B 到 2026 年超过 $15B
              不等；更窄口径的地球观测来源则低得多。这些不是四舍五入差异，而是市场边界不同。有些报告覆盖按重量级别和轨道划分的所有小卫星；另一些只隔离 EO 载荷、EO
              数据或遥感子赛道。因此，单一“市场规模”数字只会制造虚假的精确感，而不会提升尽调质量。

              更合理的结论是：外围市场很大且仍在增长，但 Muon 的可服务市场比标题数字窄。公司自身机会，与其靠一个可直接用于投资判断的 SAM
              金额，不如靠可观察的积压订单和项目规模来证明。因此，本章保留相互矛盾的估计，并采用区间框架；把总可用市场（TAM）当作分层背景，而不是目标；同时把 Muon 在研超过 50 颗卫星和 13
              个已排定发射名额，视为公开材料中最具体的近期可获取市场（SOM）代理指标。
