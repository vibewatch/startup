      - number: '1.2'
        title: 创始人、领导层与关键人物集中度
        blocks:
          - type: paragraph
            body: >
              Muon 的公开领导层叙事明显押在创始团队身上。公司列出五名创始人——Jonny Dyer、Pascal Stang、Reuben Rohrschneider、Paul Day 和 Dan
              McCleese——并且仍把关键执行职能直接连到这支原始团队。Dyer 作为 CEO 仍是公司最主要的外部面孔，Stang 作为 CTO 掌管技术栈，Rohrschneider 负责任务架构，Day
              覆盖生产。关于页面还披露了更宽的管理层，包括总裁 Greg Smirin、CFO Ryan Gray、CLO Shirley Paley，以及增长、任务执行、工程、运营和政府事务等高级负责人。这说明 Muon
              已在创始团队外搭起真实运营层，而不再只是一个小型创始人实验室。

              即便如此，公开治理能见度仍然偏低。材料包识别了运营负责人和战略职能领导者；Jonny Dyer 曾在 Skybox Imaging、Google Maps 数据采集和 Lyft Level 5
              工作，这对一家地球智能和自主系统公司是强烈的创始人与市场匹配信号。但同一材料包没有给出董事会名单、董事会权利或独立董事结构。也就是说，领导层画像在职能覆盖和关键人物履历上可信；但考虑到公司如今关联的资本规模和政府业务暴露，治理控制披露仍不足。
