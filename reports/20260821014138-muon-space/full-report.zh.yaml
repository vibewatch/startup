  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：星座基础设施，不是整个太空经济
        blocks:
          - type: paragraph
            body: >
              分析 Muon 时，不应把它放进所有卫星支出里比较。公司自己的 Mission Foundry 材料把产品定义为完整星座交付：任务设计、航天器、载荷、轨道
              AI、生产和托管服务。因此，真正相关的市场，是面向那些需要可运营空间系统、但不想内部组装全栈的组织，提供外包任务基础设施。这个区分很重要，因为它把几个相邻资金池从可投资市场框架中剔除出去。单纯发射支出、纯下游数据订阅、以及垂直整合的自用星座都靠近
              Muon，但它们不是同一个购买决策。

              因此，最清晰的替代品是分层的。有些买家可以采购发射集成或数据产品等窄模块；另一些买家可以出资组建内部航天器团队并保留系统所有权。即便如此，Muon
              的公开客户和产品叙事反复指向一类买家：他们想要捆绑式星座主承包商。因此，本章后续测算把 Muon 的可服务市场（SAM）视为更广泛小卫星和 EO
              市场中的受限子集，而不是假设公司可以捕获整个太空经济支出的任意比例。
