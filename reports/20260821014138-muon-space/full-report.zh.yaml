  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入可见度与质量
        blocks:
          - type: paragraph
            body: >-
              公开证据支持公司已有真实商业牵引力，但离债权人或公开股票投资者可直接使用的财务图景仍差很远。最强的已披露运营数据，是 Latka 资料显示 2025 年 9 月年经常性收入（ARR）为
              $62.5M，至少把规模锚定在早期试点之上。Muon 随后声称收入连续第二年同比增长 100%+，2024 年签约合同超过 $100M，Halo 相关合同超过 $60M，并有超过 50
              颗在研卫星的积压订单。这组说法暗示，收入不来自单一交易，而是绑定任务集成、载荷工作、托管运营和数据导向产品的组合。正面解读是，积压订单和发射排期意味着需求可见。负面解读是，公开来源仍未披露毛利率、客户集中度、收入确认政策，或硬件、服务与类软件经常性收入之间的拆分。
