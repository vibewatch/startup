      - number: '7.5'
        title: 管理风险、整合风险与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              创始人质量是优势，也是集中度风险。Jonny Dyer 做过 Skybox、Google Maps 和 Lyft Level 5，这种跨领域运营履历，正是 Muon
              能让客户和投资人信服的原因；公开资料还显示，另有四位联合创始人，并且公司后续引入了一些经验较深的高管。资料没有呈现的是正式接班机制、足够细的运营梯队深度，或一套清晰的工厂
              KPI，让外部人能跟踪执行是否追得上野心。因此，投资逻辑破裂标准应保持简单、可衡量：看已点名的发射渠道多元化是否兑现，Starlight
              和更高功率卫星平台能否从承诺走到合格客户交付，以及工厂能否按时产出足够卫星来支撑固定成本扩张。如果这些里程碑延后，估值溢价会更难辩护。
            claimRefs:
