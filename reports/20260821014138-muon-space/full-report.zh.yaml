      - number: '5.2'
        title: 制造栈、设施与执行机制
        blocks:
          - type: paragraph
            body: >-
              Muon 的第二个主要产品主张，是它在搭建工业系统，而不是一次只为一个任务定制航天器。公开记录把这个主张连到一座新的 130,000 square foot San Jose 设施、一座位于 Mountain
              View 的 18,000 square foot 载荷设施、2027 年年产 500 颗卫星的产能目标，以及反复出现的 90%+ 至 95%
              生产垂直整合并在内部完成的表述。这些都是有意义的野心信号，也解释了为什么 FactoryOS 和流程纪律与任何单一卫星平台规格同样重要。它们同时提高了证明门槛。加州制造仍然昂贵且监管负担重；只有当 Muon
              证明良率、节奏、供应商韧性和任务保障都能适应新规模时，高节奏产出才会成为护城河。公开来源尚未提供这些良率或吞吐指标，因此投资者能看到工厂，却还看不到运营仪表盘。这些指标才能说明工厂是否正在变成真正的生产护城河。
