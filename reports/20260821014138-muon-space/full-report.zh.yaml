    notes: 投资逻辑最强在技术可信度，最弱在公开财务透明度。
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑
      - 改变判断的证据
    rows:
      - - Mission Foundry 模型
        - 若执行持续够快，从设计到运营的一体化栈可以支撑溢价
        - 整合也可能放大延误，并遮住单位成本问题
        - 通过验证的平台 KPI 披露和客户重复转化
      - - 市场需求
        - 2026 年 EO、RF、野火和双用途需求都在上行
        - 品类增长不保证 Muon 自身利润率够强
        - 分板块收入和毛利率细节
      - - 客户质量
        - 政府和战略客户验证了任务相关性
        - 政府占比高的业务可能受周期和里程碑驱动
        - 商业经常性收入扩张证据
      - - 退出路径
        - SpaceX IPO 后，航天情绪改善，市场对航天独角兽的兴趣仍高
        - 管理层称，IPO 准备度仍需要更清晰的收入可见度
        - 经审计 ARR 和更清晰的 IPO 准备度信号
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV033
      - CV035
  - id: TV003
    title: 乐观、基准与悲观情景表
    notes: 这些区间是估值经验判断，不是 DCF；公开证据披露的运营细节不足，撑不起稳健的折现现金流模型。
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 增至接近 $100M-$125M，500 颗 / 年爬坡被证明可信，积压订单转化，收入组合拓宽
        - $1.5B-$2.0B
        - 规模放大后执行仍必须顶住
        - 需要多个里程碑相互证实，不能只看积压订单
      - - 基准
        - 公开 ARR 锚点方向正确，但溢价压缩到十几倍中段倍数
        - $0.75B-$1.125B
        - 利润率不透明、转化不均衡，让投资人保持谨慎
        - 最符合当前公开证据
      - - 悲观
        - 收入兑现滞后，类公开市场倍数主导定价，公司还需要再融资
        - $0.5B-$0.8B
        - 发射延误、采购滑坡或工厂利用率偏弱
        - 2027 年规模化任何重大落空都可能把结果推向此情景
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV025
      - CV026
  - id: TV004
    title: 可比估值表
    notes: 本表混合了私营和上市可比公司。有些行是明确估值锚点；另一些是运营模式可比对象，因为保留的公开资料包没有给出干净的 2026 年估值数据。
    enumerationScope:
      coverage: partial
      basis: >-
        Closest retained 2026 comparables spanning private satellite manufacturers, orbital infrastructure companies,
        and public EO operators.
    columns:
      - 可比对象
      - 2026 年指标 / 状态
      - 倍数或估值
      - 与 Muon 的相关性
      - 局限
    rows:
      - - Apex
        - 私营高产能卫星平台制造商
        - $2.3B 估值；峰值产能 200+ 颗卫星 / 年
        - 披露信息中最接近的私营制造可比对象
        - 产品化程度更高，且定位由卫星平台主导
      - - True Anomaly
        - 空间态势感知
        - ~$1.1B 估值
        - 显示以国防为中心的轨道基础设施如何定价
        - 载荷和任务模式不同
      - - Varda
        - 轨道制造
        - ~$1.2B 估值
        - 另一个硬件占比高的私营基础设施可比对象
        - 终端市场和利润率结构差异很大
      - - K2 Space
        - 大卫星制造同业
        - 保留的公开资料包没有清晰披露估值
        - 作为加州制造同业具备参考意义
        - 不能用本资料包给出精确数字锚点
      - - ICEYE
        - 商业 SAR 运营商
        - 已披露收入和积压订单；这里未保留准确 2026 年估值
        - 有助于判断双用途 EO 变现逻辑
        - 更接近数据服务运营商，而非卫星平台制造商
      - - Planet Labs
        - 上市 EO 运营商
        - 保留的市场分析显示，2025 年年化收入约 $280M
        - 用于需求和分析层的上市经常性 EO 可比对象
        - 公开市场流动性和传感器组合不同
      - - Rocket Lab
        - 上市一体化航天系统公司
        - 2026 年评论引用了较高的上市公司收入倍数
        - 说明公开市场仍会奖励已验证的硬件规模
        - 发射业务敞口和上市公司资本结构差异显著
    claimRefs:
      - CV008
      - CV015
      - CV016
      - CV017
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV005
    title: 投资逻辑破裂与放弃触发项表
    notes: 触发项聚焦真正能改变估值结论的证据，而不只是制造短期新闻波动。
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 工厂利用不足
        - 2027 年吞吐量显著低于已披露爬坡
        - 未来规模溢价坍塌
        - 按悲观区间重新核算
      - - 收入质量不透明
        - 经审计 ARR 或利润率与公开叙事显著不符
        - 倍数锚点失效
        - 不要按当前估值标记投资
      - - 发射集中持续
        - 积压订单上升，但没有真正多元化
        - 进度风险保持结构性高位
        - 对所有上行情景施加执行折价
      - - 商业收入组合不及预期
        - 商业经常性收入仍占少数且波动大
        - 政府集中度仍占主导
        - 将可比集合下调至国防承包商或公开市场水平
      - - 近期需要额外资本
        - 在证明积压订单转化前再次融资
        - 稀释和优先股堆叠恶化
        - 把当前轮视为过桥，而非可持续估值标记
    claimRefs:
      - CV021
      - CV024
      - CV025
      - CV026
      - CV029
      - CV030
      - CV032
  - id: TV006
    title: 最终尽调要求表
    notes: 这些要求是最低材料包，用来把基于公开证据的看法转成可投资的估值判断。
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 ARR
        - 已签约收入桥接表，以及审计师支持的 2025 / 2026 ARR
        - 用于锚定倍数测算
        - 财务数据室
      - - 毛利率拆分
        - 硬件、服务、数据和运营分项利润率
        - 决定软件型还是硬件型可比对象更有效
        - 财务 + 运营审查
      - - 积压订单转化
        - 按发射窗口和收入确认时间拆分的已签约积压订单
        - 区分需求叙事和现金兑现
        - 项目和财务审查
      - - 优先股堆叠
        - 清算优先权、期权池变化、反稀释条款
        - 改变真实入场价格和退出回款
        - 法务 / 融资文件
      - - 发射多元化
        - 具名非 SpaceX 供应商和发射档期控制权
        - 影响进度置信度和下行风险
        - 项目管理审查
    claimRefs:
      - CV024
      - CV029
      - CV030
      - CV040
