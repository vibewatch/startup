      - number: '3.3'
        title: 自建还是外包，取决于范围、信任与入轨速度
        blocks:
          - type: paragraph
            body: >
              选择 Muon 的最强理由，不只是“更好的卫星”，而是复杂任务的组织负担更低。Mission Foundry
              把任务设计、载荷、软件、生产和托管运营包进一段关系里。客户想快速获得任务专属系统，却不想内部搭建卫星平台、载荷、软件和运营团队时，这一点很有吸引力。政府和主权买家在这里尤其相关，因为它们往往想要定制任务控制和数据所有权，又不想从零建立完整航天器工业基础。

              不选择 Muon 的理由也同样清楚。如果客户主要想要数据，Planet、ICEYE、Spire 或 Maxar 可能更合适。如果客户看重发射控制或由发射牵头的捆绑方案，Muon
              较弱，因为它不拥有这一层。如果客户已有内部自建所需的规模和人员，Muon 可能输在所有权偏好，而不是能力。因此，竞争场中产品差异化重要，但真正决策取决于买家想外包多少任务栈。
