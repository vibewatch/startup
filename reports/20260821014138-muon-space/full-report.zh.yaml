chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、平台与运营版图
        blocks:
          - type: paragraph
            body: >
              Muon Space 把自己定位为星座主承包商，而不是狭义航天器供应商。公司官网、关于页面和 Mission Foundry
              材料都把它描述成端到端伙伴：从任务设计一路覆盖航天器、载荷、软件、生产和托管运营。这个定位很关键，因为它定义了后续章节应如何看待公司的可服务业务。Muon
              卖的不是单一卫星平台、发射经纪服务或数据订阅，而是把客户送到可运营星座的一体化路径，面向那些想要任务结果、又不想自己拼完整技术栈的客户。

              地理版图也比一个极早期初创公司的画像更厚。Muon 称公司 2021 年创立于加州 Mountain View；关于页面显示，公司目前在硅谷运营两处设施。2026 年 8 月 Series C
              公告中，管理层同时强调新的 San Jose 制造基地，以及公司面向商业、民用和国家安全买家扩展完整系统的能力。合在一起，公开记录支持这样的判断：Muon
              已经走出概念阶段，进入多设施运营模式；但核心身份仍扎在一条硅谷一体化制造与任务交付叙事上。
