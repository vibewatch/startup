        title: 护城河耐久度取决于软件和垂直整合能否跑在商品化前面
        blocks:
          - type: paragraph
            body: >
              Muon 的护城河在需要整合广度的地方最强。公开证据支持这样一家公司：有制造野心、内部推进能力、更大航天器产品线、轨道 AI 叙事，并在工程和运营上跨学科招人。这个组合比单一卫星平台更难复制。它也解释了为什么
              Hubble Network 不只是一个客户 logo：它证明 Muon 可以延展到更大、更吃计算的星座，同时保留单一供应商任务叙事。

              反向观点是，制造可能商品化。Apex 和其他制造商也在募集大额资本以工业化卫星生产，而材料包只提供有限公开定价透明度，无法证明 Muon 能拿到溢价。如果高节奏卫星平台制造成为默认能力，Muon
              的护城河就必须来自软件编排、载荷集成、任务保障和主权信任，而不是硬件本身。因此，主要尽调风险是发射依赖、定价不透明，以及公众仍看不清直接同业在标题叙事之下究竟如何比较。
