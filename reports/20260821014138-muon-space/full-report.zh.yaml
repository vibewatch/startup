      - number: '2.4'
        title: 需求驱动、政策摩擦与 Muon 定位
        blocks:
          - type: paragraph
            body: >
              Muon 市场的增长逻辑建立在三股相互强化的力量上。第一，分布式星座和更小型航天器让高节奏量产具备经济意义，也更有利于为可重复性而生的公司。第二，EO 和 SAR
              需求如今同时覆盖商业与政府买家，尤其集中在热成像、气候、RF 和防务相邻用例。第三，AI
              和平台式访问正在改变买家预期：用户越来越想要快速调度、重复采集和软件驱动的工作流，而不是静态影像交付。这些结构性因素都利好一家出售一体化任务基础设施的公司。

              逆风同样具体。行业商业化后，政策和出口制度正在收紧。SpaceNews
              关于加州制造的报道显示，即便是活跃的生产集群，也背负明显成本和监管负担。发射可用性仍然集中，这意味着进度风险仍可能卡住本来健康的需求。正确的市场判断因此是：支持性强，但并非毫无摩擦。客户需要一个捆绑式、行动快的星座伙伴时，Muon
              看起来站位不错；但只有当公司证明制造规模，并穿越影响整个类别的政策和发射约束时，它的 SAM 才会扩大。
