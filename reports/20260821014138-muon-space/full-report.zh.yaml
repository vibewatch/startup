  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 公开证据显示，市场和技术雄心分数很强，但透明度和入场纪律明显更弱。
    data:
      items:
        - label: 市场机会
          value: Strong (4/5)
          note: EO 和小卫星需求在 2026 年扩张。
        - label: 技术可信度
          value: Strong (4/5)
          note: 11 颗卫星在轨，多类任务形成真实验证。
        - label: 收入质量
          value: Mixed (3/5)
          note: 积压订单可见，但续收性和收入结构仍披露不充分。
        - label: 财务透明度
          value: Weak (1/5)
          note: ARR、毛利率、烧钱速度和优先权仍不透明。
        - label: 估值纪律
          value: Weak (2/5)
          note: 按公开 ARR 看，当前估值标记偏高。
        - label: 退出准备度
          value: Weak (2/5)
          note: 管理层自己也说，IPO 前需要更清晰的收入可见度。
    claimRefs:
      - CV024
      - CV027
      - CV028
      - CV030
      - CV032
      - CV033
appendices:
  - id: A
    title: 关键术语表
    blocks:
      - type: list
        title: 定义
        items:
          - Mission Foundry：Muon 的端到端星座交付模式，整合设计、制造、发射和运营。
          - Condor：Muon 的卫星平台家族（M 约 200kg，XL 约 500kg，Ultra 功率 >20kW，约 2028）。
          - MuonSim：Muon 用于星座设计和任务验证的数字孪生仿真工具。
          - FactoryOS：Muon 的 AI 驱动制造执行与配置管理系统。
          - AICore：Muon 的星载 AI 计算模块，用于航天器上的边缘推理。
          - LEO：低地球轨道（约 160–2,000 km 高度）。
          - EO：地球观测——基于卫星的成像和遥感。
          - OTA：空中下载（在轨航天器的软件更新机制）。
          - SBIR：小企业创新研究——美国政府研发资助机制。
          - OTA（合同）：其他交易授权——灵活的美国政府采购工具。
          - ITAR：国际武器贸易条例——美国针对防务物项的出口管制制度。
        claimRefs: []
