        blocks:
          - type: paragraph
            body: >-
              单位经济指标只露出一部分，因此正确做法是把能计算的东西与仍停留在定性的东西分开。公开来源允许粗略代理指标，例如累计融资 / ARR 和估值 / ARR；但这些只能当作方向性指标，因为它们把 2025 年 9 月的
              ARR 数据点与 2026 年 8 月融资条款放在一起。类似地，把 2024 年已签合同除以在研卫星数量，只能得到每颗卫星合同价值的下限代理指标，而不是利润率或现金转化指标。更持久的洞察来自需求侧支撑：多份
              2026 年地球观测和小卫星市场研究仍描述终端需求扩张，而 Muon 自己的 2026 年客户名单覆盖政府环境监测、野火探测、高光谱和热成像、Bluetooth
              连接以及天气数据。这个背景支持利用率可以随工厂扩建而上升的判断。不过，它不能消除采购时点风险或数据市场价格压力。
