        title: 验证可配置技术栈的用例
        blocks:
          - type: paragraph
            body: >-
              产品质量最强的外部证据不是营销图，而是已经挂在这套技术栈上的任务广度。FireSat 证明它能做专门的野火监测；Hubble 表明 Muon 能把更大平台与新型 Bluetooth
              连接任务配在一起；防务工作则支撑军民两用感知和环境监测项目。这些例子重要，因为它们说明同一种运营模式可以支撑差异很大的载荷和客户结果。它们也提示差异化大概在哪里。Muon
              的优势不太可能是某一个专利子部件，更可能是比低整合度同业更快配置卫星平台、载荷、AI、运营软件和托管服务交付的能力。这让产品很难与普通卫星制造商逐项横向比较。它也意味着 Muon
              必须持续证明，整合复杂度会转化为真实交付速度和可靠性，而不是更高的组织负担。
