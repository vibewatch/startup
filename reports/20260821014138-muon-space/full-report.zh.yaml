  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营规模化与发射依赖
        blocks:
          - type: paragraph
            body: >-
              Muon 进入风险章节时，展现的是可见需求，而不是可见余量。公司称已通过六次发射部署 11 颗卫星，有超过 50 颗卫星在研，并建设了一座 San Jose 工厂，设计目标到 2027 年最高年产 500
              颗卫星。这些都是正面信号，但它们把核心问题变成压缩周期下的执行。Reuters 还报道称，Muon 仍在努力降低对 SpaceX 拼车发射的依赖，并在 SpaceX
              之外寻找专属发射能力。这很重要，因为只有发射通道和制造吞吐保持同步，积压订单才能转化。创造速度的同一套全栈模式，也会集中风险：发射、推进、测试或集成任何一个环节延误，都可能推迟收入、压低客户信心，并迅速暴露
              $1.5B 估值有多少依赖未来产出，而不是当前财务可见度。
