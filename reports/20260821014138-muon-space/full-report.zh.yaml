          - type: callout
            title: 这组风险为何特殊
            body: Muon 的客户和融资动能已经足够强，导致几类风险不是相互抵消，而是互相放大：发射、推进、平台复杂度和政府项目节奏，最终都会汇入同一个交付瓶颈。
            calloutType: insight
