      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 核心投资风险
            body: 最大风险不是需求；真正要看的是，在积压订单节奏、质量或现金消耗打破规模叙事之前，Muon 能否把制造和发射资源工业化。
            calloutType: risk
