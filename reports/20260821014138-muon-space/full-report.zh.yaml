      - number: '6.3'
        title: 耐久度、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Muon 的客户质量足以支撑建设性观点，但其耐久度仍部分藏在采购复杂性和私营公司报告之后。最大的集中度问题不是 Muon 有没有
              logo，而是少数旗舰项目是否主导经济性。公开来源没有回答这个问题。政府工作提升可信度，也常常放大合同规模，但它也带来更慢付款周期、复杂里程碑，以及更严格资格制度的可能性；2026 年关于更严 NRO
              合同结构的报道就反映了这一点。同时，发射集中度和伙伴依赖可能让多个客户的部署时点同时漂移。因此，看起来最耐久的关系，是 FireSat 和 Hubble
              这类范围正在扩大的关系，而不是只披露一次、没有后续细节的关系。尽调中的核心要求很简单：按项目展示客户收入集中度、续约机制和积压订单转化。管理层数据还应把期权量与已经完全签约、获得资金支持的积压订单分开。
