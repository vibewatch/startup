      - number: '1.4'
        title: 里程碑、客户验证与可见风险信号
        blocks:
          - type: paragraph
            body: >
              对一家 2021 年成立的公司来说，Muon 的里程碑推进异常密集。公开记录显示，公司从创立和早期设施建设，推进到 Series B 制造扩张；2026 年 2 月又声称持续执行多任务；再到 2026 年 8
              月，在上半年七次发射和两个具名星座投入运营的基础上完成 Series C。客户验证也足够具体。与 Earth Fire Alliance 和 Google.org 合作的 FireSat、面向 SNC 的
              Vindlér 2.0、以及 U.S. Space Force 环境监测项目，都是具名项目，强化了 Muon 同时服务商业、民用和防务任务的主张。

              反向信号不是生死线，但确实存在。Reuters
              强调估值来自消息源而非管理层确认，这正好暴露了一个披露缺口：公开叙事已经转向独角兽身份，估值却没有被公司确认。材料包还没有解决治理、董事会权利、精确当前员工数和详细债务条款。因此，第 1
              章支持的结论是：这是一家牵引力高、具备真实运营验证且客户相关性广的公司；但在直接尽调财务质量和治理成熟度之前，不能无条件接受私营公司估值或管理层增长叙事。
