      - number: '2.3'
        title: 买家分层、使用者与预算负责人
        blocks:
          - type: paragraph
            body: >
              买家地图比标准航天采购动作更宽。政府和主权买家关注国家安全、环境或民用任务结果。商业星座运营商关注入轨速度和差异化载荷能力。第三类买家位于下游数据经济中：即便最终商业模式是分析或连接，而不是航天器转售，运营方仍可能想控制任务架构。在这三类客户中，技术使用者往往不是付款人。任务团队、分析师或载荷运营人员可能使用系统，而预算掌握在机构拨款、防务项目或企业星座开发条线中。

              这种分裂对 Muon
              很重要，因为它让销售动作更像咨询式、项目式销售，而不是交易式销售。公司获胜的场景，是它能降低组织复杂度：用一个外包星座伙伴，替代多供应商、多年期的自建项目。公司失利的场景，是买家认为数据订阅、单纯发射提供商或内部工程团队足以解决问题。因此，实际分层地图取决于买家想要基础设施所有权、结果订阅，还是混合路径。
