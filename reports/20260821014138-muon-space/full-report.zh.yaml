  foundingLocation: Mountain View, California, USA
  headquarters: San Jose, California, USA
  productSummary: >-
    Mission Foundry：六支柱端到端星座平台，整合任务设计（MuonSim 数字孪生）、Condor 航天器平台（M/XL/Ultra 级别）、定制载荷（EO/IR/RF/多光谱）、轨道 AI（AICore
    星上计算）、星座生产（FactoryOS）以及托管在轨服务（OTA、C3 APIs、Starlink 激光连接）。它能在数月内交付完整可运营星座。
  customerFocus: 美国及盟国国家安全机构、商业卫星星座运营商、环境监测组织和 IoT 基础设施提供商。
  businessModel: 基于合同交付星座并提供托管服务。客户购买完整任务结果——设计、制造、发射和运营——而不是单个硬件部件。收入来自政府合同（固定价合同和 SBIR/OTA 授标）以及商业星座合同。
  stage: Series C
