companyProfile:
  summary: >-
    Muon Space 是一家硅谷航天初创公司，按 Mission Foundry 模式端到端设计、制造并运营高性能卫星星座。公司由五名航天行业老兵于 2021 年创立，已部署 11 颗卫星，任务成功率 100%；并在 San
    Jose 启用一座 130,000 sq ft 生产设施，目标到 2027 年年产最高 500 颗卫星。客户覆盖美国国家安全机构（Space Force、NRO、Missile Defense Agency）、商业
    IoT（Hubble Network）、环境监测（Earth Fire Alliance FireSat）以及国际主权项目。
  foundedDate: '2021-01-01'
  founders:
