      - number: '4.4'
        title: 财务判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              本章的核心结论是：从外部看，Muon
              具备融资能力，但还不足以完整支撑投资判断。强正面因素包括已证明的资本获取能力、可信的积压订单、足够重要的具名合同赢单，以及看起来仍在增长的终端市场。同样重要的是，产品栈似乎被设计成能捕获比单纯卫星平台销售更多的价值：它把载荷、软件和托管任务运营叠加在一起。谨慎点在于，几乎所有决定性投资判断输入仍是私有信息：现金余额、月度烧钱速度、毛利率、营运资本周期、头部客户组合以及各项目实际定价。已披露的信贷额度使用，也增加了在
              NDA 下索取贷款人材料、债务条款和流动性规划的理由。在审阅这些材料前，应把 Muon 视为一家外部动能强、财务前景真实的公司，但烧钱速度、利润率和真实资本效率仍有持续盲点。债权人侧的额外尽调必不可少。
