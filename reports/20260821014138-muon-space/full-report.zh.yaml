            body: >-
              Muon 融资能力很强，但与估值体量和计划的资本密集度相比，财务可见度仍偏弱。公司在 C 轮后披露累计股权融资超过 $386 million，Reuters
              称本轮大部分资金将投入工厂基础设施和团队扩张。作为航天制造商，这样花钱合理；但也意味着，在外部投资人能用审计数据检验毛利率、烧钱纪律或积压订单转化之前，公司已经在重金投入。公开第三方收入跟踪库给出的 2025
              年收入约 $62.5
              million，但同一批数据库在管理层和融资信息上还存在事实错误，削弱了把它们当作主要锚点的可信度。结果就是典型的后期硬件风险：投资人看得到增长和需求，却还看不清底层单位经济，一旦交付节奏延后或成本吸收跟不上，业务韧性到底有多强。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR017
              - CR018
              - CR019
              - CR033
              - CR044
          - type: table
            tableRef: TR004
