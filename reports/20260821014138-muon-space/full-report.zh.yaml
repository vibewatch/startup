      - number: '3.2'
        title: 相邻竞争者可能在航天器采购前拿走预算
        blocks:
          - type: paragraph
            body: >
              Muon 的竞争对象不只是其他卫星制造商。Planet、Maxar、ICEYE 和 Spire
              可以从技术栈的另一层拿走同一笔预算，直接销售影像、SAR、RF、天气或情报结果。只要买家认为数据产品或网络比拥有一个任务专属航天器项目更重要，它们就是替代品。这份材料包中的 EO
              竞争资料足以说明为什么这很重要：Planet 已经几乎每天成像地球全部陆地，Maxar 拥有高分辨率情报工作流，ICEYE 已验证商业 SAR 可服务政府用途，Spire 拥有大型信号数据网络。

              这种替代压力对 Muon 有战略意义。客户一旦把问题从“建一个星座”改写成“买一个答案”，公司即便没有输掉功能比较，也可能丢掉项目。因此，Muon
              的销售动作必须在客户需要专属任务控制、新型载荷集成或主权级处理、且现有数据网络无法干净交付时最强。其他情况下，相邻平台可以提前拦截自建决策。
