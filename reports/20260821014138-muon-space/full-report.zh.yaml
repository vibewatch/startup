  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争对手：Muon 身处正在扩大的制造公司梯队
        blocks:
          - type: paragraph
            body: >
              Muon 的直接制造竞争不只是简单的一对一卫星平台比较。SpaceNews 把 Muon 与 Apex、K2 Space、Millennium Space Systems 和 Terran Orbital
              一起放进当前加州卫星制造扩张中，这是一个有用框架，因为它同时覆盖新兴替代者和既有替代者。在这份材料包中，Apex 是证据最充分的直接同业：它明确营销高节奏、可配置的卫星生产，并以 $2.3B
              估值募集新资本，用来扩充分布式星座产能。K2、Millennium 和 Terran 则把竞争集合扩展到更大规格或更成熟的制造路径，尽管当前材料包对每家公司公开细节较少。

              Muon 的回应，是向更大平台上探，同时守住任务主承包商叙事。由 Hubble Network 锚定的 MuSat XL 或 Condor-XL 故事说明，公司不想被锁在狭窄的 200-kilogram
              细分里。相反，它正在进入更大、更有能力的航天器，同时仍出售一体化星座栈。这意味着直接竞争不只是谁造卫星平台，也是谁能扩大生产，而不滑入商品化硬件竞争。
