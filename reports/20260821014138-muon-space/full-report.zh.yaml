              最好的客户证据来自运营，而不是推荐语。FireSat 在 2026 年已有三颗运营卫星，Vindlér 在 2026 年 Q1 发射三颗卫星，Hubble 选择 Muon 建设 60 颗卫星星座，Space
              Force 合同则提供了 $44.6M 的披露金额锚点。这些数据点意味着 Muon
              已经越过投机性设计赢单阶段，进入实际任务交付。它们也显示出健康的验证组合：在轨运营资产、已签约的未来星座，以及来自成熟政府买家的项目授标。缺失的仍是读者熟悉的 SaaS
              式留存层。材料包中的来源没有提供净留存率（NRR）、续约、流失或直接客户满意度调查。因此，本章只能从后续范围、发射排期，以及客户愿意把更大或额外任务交给 Muon
              来推断黏性；这种推断有用，但不同于干净的留存数据集。它令人鼓舞，但仍只是重复经济和账户级满意度的代理指标。
