  topStrengths:
    - End-to-end Mission Foundry model with 95% vertical integration creates durable manufacturing and operational moat.
    - >-
      100% mission success across 11 satellites demonstrates engineering execution quality rare in early-stage space
      hardware.
    - >-
      Diversified customer base spanning national security (Space Force, NRO, MDA), commercial IoT (Hubble Network), and
      climate (FireSat) reduces concentration risk.
    - >-
      Oversubscribed Series C with strategic investors (Google, Salesforce Ventures, Wellington Management) signals
      conviction across technology and institutional capital.
    - >-
      FireSat named TIME Best Inventions of 2025 and SpaceNews Icon Award creates brand differentiation and ESG
      positioning.
  topRisks:
    - >-
      Manufacturing ramp from current capacity to 500 satellites/year by 2027 is a 10x increase that remains unproven at
      scale.
    - >-
      Heavy SpaceX rideshare dependency creates schedule concentration risk; company actively seeking launch
      alternatives.
    - Valuation of ~$1.5B implies a high forward multiple (~24x 2025 ARR) requiring sustained 100%+ growth to justify.
    - Competition from well-capitalized Apex Space ($2.3B) and K2 Space ($6.8B) intensifying in the same segment.
    - Government budget cycles and ITAR/export constraints could slow international sovereign contract pipeline.
  unresolvedGaps:
    - >-
      Gross margin, burn rate, and net unit economics per satellite are undisclosed; key for evaluating capital
      efficiency.
    - >-
      Revenue mix between government and commercial is not publicly broken out; concentration risk cannot be precisely
      quantified.
    - Headcount is not disclosed; hiring velocity and operational leverage metrics are unavailable.
    - Condor-Ultra platform (2028 target) has no disclosed customers or contract commitments.
    - Series B1 credit facility terms ($45M) are undisclosed; leverage and covenant risk unknown.
