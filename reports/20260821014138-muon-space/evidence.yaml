evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, independent-director presence, and investor control rights were not publicly disclosed in
      the retrieved source pack.
    whyItMatters: >-
      Governance quality matters once the company is carrying large private-market marks and government-program
      execution risk.
    diligencePath: Request a current board deck or cap-table/governance summary from management under NDA.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-opacity
    missingEvidence: >-
      The exact August 2026 post-money valuation and share-count bridge were not confirmed by management in public
      sources.
    whyItMatters: >-
      Valuation discipline depends on the actual post-money mark, share class stack, and any structured investor
      protections.
    diligencePath: Request the Series C term sheet, cap table, and primary-versus-secondary allocation directly from management.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: No audited revenue, ARR definition, margin bridge, or deferred-revenue disclosure was available.
    whyItMatters: >-
      The company's capital intensity and private-market valuation cannot be underwritten cleanly without
      quality-of-revenue detail.
    diligencePath: Request 2024-2026 financial statements with revenue recognition policy and backlog conversion detail.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Public materials confirm rapid hiring but do not provide a reconciled current employee count.
    whyItMatters: Headcount is a useful proxy for operating leverage and manufacturing readiness at the current stage.
    diligencePath: Ask management to reconcile total employees, manufacturing technicians, and program staff as of the run date.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: No public source in the retrieved pack isolates a Muon-specific dollar SAM or SOM with transparent methodology.
    whyItMatters: >-
      Market underwriting is much cleaner when the addressable pool is tied to explicit budgets and realistic share
      assumptions rather than broad category TAMs.
    diligencePath: >-
      Request management's internal pipeline segmentation by customer type, mission class, and expected contract value
      bands.
    relatedQuestionRefs:
      - QM006
      - QM024
  - type: stale
    severity: minor
    topic: buyer-conversion
    missingEvidence: >-
      Public sources do not quantify how many programs choose bundled constellation primes versus data subscriptions or
      internal build.
    whyItMatters: >-
      The conversion rate from broad demand to Muon-eligible programs determines whether backlog can compound
      sustainably.
    diligencePath: >-
      Ask management for win/loss data by substitute path: internal build, data-only, launch-plus-bus, or full-prime
      engagement.
    relatedQuestionRefs:
      - QM023
      - QM024
  - type: private-evidence-only
    severity: material
    topic: launch-risk
    missingEvidence: >-
      The public pack does not disclose launch-provider mix, contingency capacity, or contractual protection against
      manifest slips.
    whyItMatters: Launch concentration can cap revenue realization even when market demand is healthy.
    diligencePath: Review launch agreements, provider diversification plans, and schedule buffers across manifested programs.
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      The retrieved public sources do not disclose standardized price cards or realized contract economics for Muon or
      most peers.
    whyItMatters: >-
      Without packaging economics, it is hard to tell whether Muon wins on premium differentiation or on negotiated cost
      parity.
    diligencePath: Request representative proposals, pricing architecture, and win/loss reasons versus direct and adjacent peers.
    relatedQuestionRefs:
      - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: direct-peer-coverage
    missingEvidence: >-
      The public pack is materially richer on Apex and Muon than on K2, Millennium, and Terran, leaving some direct-peer
      feature comparisons directional.
    whyItMatters: >-
      A fair competitive map needs enough depth on each peer to separate true differentiation from source-pack
      asymmetry.
    diligencePath: >-
      Pull direct product pages, contract wins, and manufacturing disclosures for K2, Millennium, and Terran in the next
      refresh.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: >-
      No public source discloses Muon's win rates, churn, or program displacement patterns versus direct builders and
      adjacent data platforms.
    whyItMatters: Moat durability ultimately depends on buyer behavior, not on product narratives alone.
    diligencePath: Ask management for pipeline stage conversion, win/loss notes, and competitive take-rate by substitute type.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: private-evidence-only
    severity: material
    topic: burn
    missingEvidence: Monthly burn, operating cash flow, and capex are not publicly disclosed.
    whyItMatters: Without burn and capex separation, raise sizes cannot be translated into runway or capital efficiency.
    diligencePath: Request a 24-month monthly cash-flow bridge with operating burn, capex, and debt draws separated.
    relatedQuestionRefs:
      - QI013
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Cash on hand and runway months after the August 2026 Series C are not in the retained sources.
    whyItMatters: Runway determines dilution risk and whether the current factory ramp is comfortably funded.
    diligencePath: Request current unrestricted cash, restricted cash, and board runway scenarios under base and downside cases.
    relatedQuestionRefs:
      - QI014
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: No retained source discloses gross margin or contribution margin by mission type.
    whyItMatters: Backlog quality and path to profitability cannot be judged without margin data.
    diligencePath: Request mission-level gross-margin waterfalls by platform, payload, and service layer.
