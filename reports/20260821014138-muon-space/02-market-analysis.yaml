- id: sizing-lenses
  title: TAM, SAM, and SOM require multiple lenses and preserved contradictions
  body: |
    Public market sizing for Muon’s sector is directionally positive but methodologically inconsistent. Broader small-satellite sources span from roughly $7.82 billion in 2025 to more than $15 billion in 2026, while narrower Earth-observation sources sit much lower. Those are not rounding differences; they reflect different market boundaries. Some reports cover all small satellites by weight class and orbit. Others isolate EO payloads, EO data, or remote-sensing subsegments. A single “market size” number would therefore create false precision rather than better diligence.

                    The right conclusion is that the outer market is large and still growing, but Muon’s serviceable market is narrower than the headlines. The company’s own opportunity is better evidenced by observed backlog and program scale than by a bankable dollar SAM calculation. That is why this chapter preserves contradictory estimates in a range framework, uses TAM as a layered context rather than a target, and treats Muon’s 50-plus satellites in development plus 13 manifested launches as the most concrete near-term SOM proxy available from the public pack.
