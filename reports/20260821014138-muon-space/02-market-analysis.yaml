- id: buyers-and-budgets
  title: Buyer segments, users, and budget owners
  body: |
    The buyer map is broader than a standard aerospace procurement motion. Government and sovereign buyers care about national-security, environmental, or civil-mission outcomes. Commercial constellation operators care about time-to-orbit and differentiated payload capability. A third cluster of buyers sits in the downstream data economy, where an operator may still want control over the mission architecture even if the final business model is analytics or connectivity rather than spacecraft resale. Across all three, the technical user is often not the payer. Mission teams, analysts, or payload operators may use the system while the budget sits in an agency appropriation, a defense program, or a corporate constellation-development line.

                    This split is important for Muon because it makes the sales motion more consultative and programmatic than transactional. The company wins when it can reduce organizational complexity — replacing a multi-vendor, multi-year build program with a single outsourced constellation partner. It loses when a buyer concludes that a data subscription, a launch-only provider, or an internal engineering team is enough to solve the problem. The practical segment map therefore turns on whether the buyer wants infrastructure ownership, outcome subscriptions, or a hybrid path.
  claimRefs:
  - CM018
  - CM019
  - CM020
  - CM034
  - CM035
  - CM039
