  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: No public source in the retrieved pack isolates a Muon-specific dollar SAM or SOM with transparent methodology.
    whyItMatters: Market underwriting is much cleaner when the addressable pool is tied to explicit budgets and realistic
      share assumptions rather than broad category TAMs.
    diligencePath: Request management's internal pipeline segmentation by customer type, mission class, and expected contract
      value bands.
    relatedQuestionRefs:
    - QM006
    - QM024
  - type: stale
    severity: minor
    topic: buyer-conversion
    missingEvidence: Public sources do not quantify how many programs choose bundled constellation primes versus data subscriptions
      or internal build.
    whyItMatters: The conversion rate from broad demand to Muon-eligible programs determines whether backlog can compound
      sustainably.
    diligencePath: 'Ask management for win/loss data by substitute path: internal build, data-only, launch-plus-bus, or full-prime
      engagement.'
    relatedQuestionRefs:
    - QM023
    - QM024
  - type: private-evidence-only
    severity: material
    topic: launch-risk
    missingEvidence: The public pack does not disclose launch-provider mix, contingency capacity, or contractual protection
      against manifest slips.
    whyItMatters: Launch concentration can cap revenue realization even when market demand is healthy.
    diligencePath: Review launch agreements, provider diversification plans, and schedule buffers across manifested programs.
    relatedQuestionRefs:
    - QM018
