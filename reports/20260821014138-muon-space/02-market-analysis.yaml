    - Muon core market
  - - EO data subscriptions
    - Imagery, analytics, API access, tasking, and archive usage
    - Custom spacecraft ownership when the buyer only wants the data outcome
    - Enterprise, government, and analytics users
    - Adjacent substitute
  - - Launch and deployment services
    - Manifest access, payload integration to launcher, deployment hardware
    - Full mission architecture, payload design, and recurring ops
    - Satellite operators and mission integrators
    - Upstream substitute
  - - Captive vertically integrated constellations
    - Internal spacecraft, launch procurement, and operating teams
    - Third-party mission prime services
    - Large operators or primes with internal budgets
    - Status-quo alternative
  - - Sovereign mission outsourcing
    - Mission-specific systems where the customer wants control without owning the full industrial stack
    - Commodity imagery or narrow component purchases
    - Defense ministries, agencies, sovereign programs
    - High-priority Muon segment
  notes: The market boundary is intentionally narrower than “all satellites” and intentionally broader than “spacecraft buses”
    because Muon sells integrated constellation outcomes.
