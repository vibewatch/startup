- calloutType: insight
  title: Why this risk stack is unusual
  body: 'Muon has enough customer and funding momentum that several risks amplify each other rather than offset each other: launch, propulsion, platform complexity, and government timing all flow into the same delivery bottleneck.'
  claimRefs:
