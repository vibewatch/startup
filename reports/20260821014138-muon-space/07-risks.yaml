- id: regulatory-government-and-sovereign-risk
  title: Regulatory, Government, and Sovereign-Customer Risk
  body: 'Muon''s 2026 growth narrative is increasingly tied to government, national-security, and international sovereign missions. That is attractive because those customers can support larger, longer-duration programs, but it also raises the diligence bar materially. Breaking Defense described the NRO moving commercial SAR suppliers into new contracts with rigorous requirements, while 2026 policy commentary emphasized that procurement and risk-acceptance still move slower than industry ambition. Muon itself now talks openly about sovereign customers, which implies export-control, technology-transfer, and data-rights obligations that are not described in public detail. There is no adverse evidence of a failure here, but there is also no public proof of the underlying compliance architecture. For an investor, that means government traction is real yet still fragile: a missed security review, export classification issue, or slower procurement cycle could hit timing, revenue mix, and valuation
    confidence at the same time.'
  claimRefs:
  - CR020
  - CR021
  - CR022
  - CR023
  - CR028
  - CR045
  - CR046
  tableRefs:
  - TR001
  - TR003
