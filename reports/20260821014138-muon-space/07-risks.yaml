company:
  name: Muon Space
chapter:
  number: 7
  title: Risks
  summary: Muon Space's risk stack is dominated by execution concentration rather than demand scarcity. The company has real traction — 11 satellites in orbit, strong fundraising, and a 500-per-year factory target — but that same ambition creates correlated risks around SpaceX dependence, manufacturing scale-up, government procurement cycles, capital efficiency, export-control readiness, and founder concentration. The core investment question is whether Mission Foundry speed becomes a durable moat before the 2027 ramp exposes process, launch, and margin bottlenecks.
sections:
- id: operational-scale-and-launch-dependence
  title: Operational Scale and Launch Dependence
  body: 'Muon enters the risk chapter from a position of visible demand rather than visible slack. The company said it had 11 satellites deployed across six launches, more than 50 satellites in development, and a San Jose factory designed for up to 500 satellites annually by 2027. Those are positive signals, but they make the central question one of execution under compression. Reuters also reported that Muon is still working to reduce reliance on SpaceX rideshare and is seeking dedicated launch capacity beyond SpaceX. That matters because the backlog can only convert if launch access and manufacturing throughput stay synchronized. The same full-stack model that creates speed also concentrates risk: a delay in launch, propulsion, testing, or integration can defer revenue, strain customer confidence, and quickly expose how much of the $1.5 billion valuation depends on future output rather than present financial visibility.'
  claimRefs:
  - CR004
  - CR006
  - CR007
  - CR009
  - CR010
  - CR014
  - CR017
  - CR040
  - CR041
  - CR042
