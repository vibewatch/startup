- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Anchor constellation customers such as FireSat or Hubble
    - High if one flagship program dominates future deployments
    - Large upside if follow-on volume converts, but large downside if schedules slip
    - Request backlog and revenue share by top five programs
  - - Government mission wins
    - Medium-to-high due to procurement cycles and milestone complexity
    - Supports credibility and contract size, but payment timing can be lumpy
    - Request funded vs unfunded backlog and payment schedules
  - - Undisclosed 12+ customers
    - Medium because breadth exists but cannot be inspected
    - Could materially diversify revenue if customer quality is real
    - Request anonymized segment-level ACV and stage mix
  - - Launch ecosystem dependence
    - Medium because multiple programs can slip together
    - Delays can defer revenue recognition and customer satisfaction
    - Request launch manifest dependency map by customer
  - - International / sovereign growth
    - Medium due to export and policy friction
    - Could widen TAM but slow sales cycles
    - Request export-control process and sovereign pipeline details
  notes: Muon's concentration risk is probably program-centric rather than logo-count-centric, but the public record is too
    thin to quantify it.
