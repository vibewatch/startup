- id: verdict
  title: Customer verdict
  body: The retained public record supports a favorable headline conclusion on customer quality. Muon is selling into serious
    buyers, spanning both government and commercial missions, and several programs have progressed beyond slideware into satellites
    that are operating, launched, or manifested. That is a stronger customer story than many private space companies can offer.
    The less favorable conclusion is that public durability evidence remains thin. There are no cohort metrics, no disclosed
    renewal rates, no top-customer revenue splits, and limited visibility into contract structure beyond a few emblematic
    awards. As a result, Muon should be treated as a company with high-quality customer logos and meaningful mission breadth,
    but with unresolved concentration and retention questions that still require management data to underwrite revenue sustainability
    rigorously. Until then, the customer case is promising but still incomplete. The economics need direct disclosure.
  claimRefs:
  - CU020
