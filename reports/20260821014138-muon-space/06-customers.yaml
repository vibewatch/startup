- id: durability-and-concentration
  title: Durability, concentration, and procurement friction
  body: 'Muon''s customer quality is good enough to support a constructive view, but its durability is still partially hidden
    behind procurement complexity and private reporting. The biggest concentration question is not whether Muon has logos;
    it is whether a handful of flagship programs dominate economics. Public sources do not answer that. Government work improves
    credibility and often enlarges contract size, but it also introduces slower payment cycles, milestone complexity, and
    the possibility of stricter qualification regimes, as reflected in 2026 reporting on more rigorous NRO contract structures.
    Meanwhile, launch concentration and partner dependencies can shift deployment timing across multiple customers at once.
    That makes the most durable-looking relationships the ones that appear to be scaling in scope, such as FireSat and Hubble,
    rather than the ones disclosed only once without follow-on detail. In diligence, the central ask is simple: show customer
    revenue concentration, renewal mechanics, and backlog conversion by program. Management data should also separate option
    volume from fully contracted, funded backlog.'
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
