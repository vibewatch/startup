  title: Muon has better named-customer proof than many private space peers
  body: Operational FireSat assets, multi-satellite Vindlér launches, a disclosed $44.6 million Space Force program, and Hubble's
    60-satellite ambition together form a credible customer-quality case. This is not a company surviving on anonymous pilots
    alone.
  claimRefs:
