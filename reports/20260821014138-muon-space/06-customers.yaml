  title: Customer breadth is visible, customer economics are not
  body: Muon's roster looks diversified by mission and logo, but public sources still do not reveal top-customer revenue share,
    renewals, or backlog conversion by program. That means concentration risk may be lower than feared—or substantially higher
    than it appears.
