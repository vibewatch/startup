chapter:
  number: 6
  title: Customers
  summary: Muon Space has unusually strong public logo quality for a private space company, with operational FireSat assets,
    a disclosed $44.6 million Space Force program, and scaled mission evidence across Hubble, SNC Vindlér, Hydrosat, and other
    buyers. The remaining customer question is not whether Muon has real customers; it is whether public evidence understates
    concentration and obscures the renewal mechanics behind a handful of flagship programs.
sections:
- id: roster-and-segments
  title: Roster quality and segment mix
  body: 'Muon''s public roster is notably strong for a still-private space company. On the commercial and climate side, FireSat,
    Hubble Network, Hydrosat, and other application-specific programs show demand for wildfire monitoring, Bluetooth connectivity,
    EO, and weather-related missions. On the government side, U.S. Space Force, NRO-linked work, SpaceWERX/SDA, and MDA SHIELD
    indicate meaningful defense relevance. The positive read is that Muon is not dependent on a single use case: the same
    platform stack is appearing across thermal monitoring, RF analytics, connectivity, and dual-use sensing. The negative
    read is that diversification by logo does not automatically mean diversification by revenue. Public sources name important
    customers, but they do not reveal how much revenue any one of them contributes, which programs are already in full-rate
    production, or how much of the backlog is concentrated in a small set of anchor missions. That opacity is the chapter''s
    central reservation. Detailed cohort economics are still missing from public evidence.'
  claimRefs:
