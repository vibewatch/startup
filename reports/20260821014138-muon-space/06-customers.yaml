- id: adoption-and-proof
  title: Adoption trajectory and proof quality
  body: 'The best customer evidence is operational rather than testimonial. FireSat has three operational satellites in 2026,
    Vindlér launched three satellites in Q1 2026, Hubble selected Muon for a 60-satellite constellation, and the Space Force
    contract provides a disclosed dollar anchor at $44.6 million. Those datapoints imply Muon is past the point of speculative
    design wins and into actual mission delivery. They also show a healthy mix of proofs: operational assets in orbit, contracted
    future constellations, and program awards from sophisticated government buyers. What is still missing is the reader-friendly
    SaaS-style retention layer. No retained source provides NRR, renewals, churn, or direct customer-satisfaction surveys.
    The chapter therefore has to infer stickiness from follow-on scope, manifests, and customer willingness to give Muon larger
    or additional missions, which is useful but not the same as a clean retention dataset. That is encouraging, but it remains
    only a proxy for repeat economics and account-level satisfaction.'
