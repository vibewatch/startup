      - number: '1.4'
        title: Milestones, customer proof, and visible risk flags
        blocks:
          - type: paragraph
            body: >
              Muon’s milestone arc is unusually dense for a company founded in 2021. The public record shows a
              progression from founding and early facility build-out, to Series B manufacturing expansion, to a February
              2026 claim of sustained multi-mission execution, and then to an August 2026 Series C raised on the back of
              seven first-half launches and two named constellations entering operation. The customer proof is also
              specific enough to matter. FireSat with Earth Fire Alliance and Google.org, Vindlér 2.0 for SNC, and the
              U.S. Space Force environmental-monitoring program are all named programs that reinforce Muon’s claim that
              it is serving commercial, civil, and defense missions simultaneously.

                              The adverse signals are not existential, but they are real. Reuters highlighted that the valuation was source-based rather than management-confirmed, which underscores a disclosure gap at exactly the point where public narrative has shifted toward unicorn status. The source pack also leaves governance, board rights, exact current headcount, and detailed debt terms unresolved. As a result, chapter 1 supports a high-traction company with genuine operating proof and broad customer relevance, but it does not support blind acceptance of the private-company valuation or of management’s growth narrative without direct diligence on financial quality and governance maturity.
