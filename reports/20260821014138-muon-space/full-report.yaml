chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating footprint
        blocks:
          - type: paragraph
            body: >
              Muon Space presents itself as a constellation prime rather than a narrow spacecraft vendor. Its homepage,
              about page, and Mission Foundry materials all frame the company as an end-to-end partner that can move
              from mission design through spacecraft, payloads, software, production, and managed operations. That
              positioning matters because it defines what later chapters should treat as the company’s addressable
              business: Muon is not simply selling a bus, a launch brokerage, or a data subscription. It is selling an
              integrated path to an operational constellation for customers that want mission outcomes without stitching
              the stack together themselves.

                              The geographic footprint also looks more substantial than a very early startup profile. Muon states it was founded in 2021 in Mountain View, California, and its about page says it now operates two Silicon Valley facilities. In the August 2026 Series C announcement, management highlighted both the newer San Jose manufacturing site and the company’s ability to scale complete systems across commercial, civil, and national-security buyers. Taken together, the public record supports a company that has moved beyond concept stage into a multi-facility operating model, while still keeping the core identity anchored in one integrated Silicon Valley manufacturing-and-mission-delivery story.
