            body: >-
              The second major product claim is that Muon is building an industrial system, not simply engineering
              custom spacecraft one mission at a time. The public record ties that claim to a new 130,000 square foot
              San Jose facility, an 18,000 square foot payload facility in Mountain View, a 500-satellite annual
              capacity target for 2027, and repeated statements that 90%+ to 95% of production is vertically integrated
              and in-house. Those are meaningful signs of ambition, and they help explain why FactoryOS and process
              discipline matter as much as any one bus specification. They also raise the bar for proof. California
              remains expensive and regulation-heavy for manufacturing, and high-rate output only becomes a moat if Muon
              can prove yield, cadence, supplier resilience, and mission assurance at the new scale. Public sources do
