        - id: a3
          label: Financial opacity
          description: ARR, gross margin, and preference stack are not well disclosed publicly
        - id: a4
          label: Execution premium
          description: Factory ramp and launch diversification are still future-looking
        - id: a5
          label: research-more
          description: Reasonable interest, but not enough evidence for a committed price today
