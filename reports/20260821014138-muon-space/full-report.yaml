        title: Unit-economics proxies and demand backdrop
        blocks:
          - type: paragraph
            body: >-
              Unit economics are only partially visible, so the right approach is to separate what can be computed from
              what remains qualitative. Public sources allow rough proxies such as cumulative funding-to-ARR and
              valuation-to-ARR, but these should be treated as directional because they combine a September 2025 ARR
              datapoint with August 2026 financing terms. Likewise, a simple division of 2024 signed contracts by
              satellites in development produces only a lower-bound contract-value-per-satellite proxy, not a margin or
              cash-conversion metric. The more durable insight comes from demand-side support: multiple 2026
              earth-observation and small-satellite market studies still describe expanding end demand, while Muon's own
              2026 roster spans government environmental monitoring, wildfire detection, hyperspectral and thermal
              imaging, Bluetooth connectivity, and weather data. That backdrop supports the idea that utilization can
              rise into the factory build-out. It does not, however, eliminate procurement timing risk or data-market
