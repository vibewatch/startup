      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The chapter's main conclusion is that Muon looks financeable from the outside, but not yet fully
              underwritable. Strong positives include demonstrated capital access, a credible backlog, named contract
              wins large enough to matter, and end markets that still appear to be growing. Just as important, the
              product stack appears designed to capture more value than a bare satellite-bus sale by layering payloads,
              software, and managed mission operations. The caution is that almost every decisive underwriting input
              remains private: cash balance, monthly burn, gross margin, working-capital cycle, top-customer mix, and
              realized pricing by program. The disclosed use of credit facilities adds another reason to ask for lender
              materials, debt terms, and liquidity planning under NDA. Until those materials are reviewed, Muon should
              be viewed as a company with strong external momentum and real financial promise, but with persistent blind
              spots around burn, margin, and true capital efficiency. Additional lender-side diligence is essential.
