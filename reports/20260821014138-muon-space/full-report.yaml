      - number: '3.2'
        title: Adjacent competitors can win the budget before a spacecraft is ever bought
        blocks:
          - type: paragraph
            body: >
              Muon does not only compete with other satellite manufacturers. Planet, Maxar, ICEYE, and Spire can capture
              the same budget from a different layer of the stack by selling imagery, SAR, RF, weather, or intelligence
              outcomes directly. That makes them substitutes whenever the buyer decides it values the data product or
              network more than ownership of a mission-specific spacecraft program. The EO competitor sources in this
              pack are strong enough to show why that matters: Planet already images nearly all of Earth’s landmass
              daily, Maxar owns high-resolution intelligence workflows, ICEYE has validated commercial SAR for
              government use, and Spire has a large signals-data network.

                          This substitution pressure is strategically important for Muon. A company can lose a program without losing a feature comparison if the customer reframes the problem from “build a constellation” to “buy an answer.” That is why Muon’s sales motion must be strongest where customers need dedicated mission control, novel payload integration, or sovereign handling that existing data networks cannot deliver cleanly. In all other cases, adjacent platforms can pre-empt the build decision entirely.
