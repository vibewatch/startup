      - number: '7.4'
        title: Financial Visibility and Cost-Structure Risk
        blocks:
          - type: paragraph
            body: >-
              Muon's capital access is strong, but its financial visibility is still weak relative to the size of the
              valuation and the capital intensity of the plan. The company disclosed more than $386 million of total
              equity funding after the Series C, and Reuters said much of the round will fund factory infrastructure and
              workforce expansion. That is logical for a space manufacturer, yet it also means the company is investing
              heavily before outsiders can test gross margins, burn discipline, or backlog conversion with audited data.
              Public third-party revenue trackers cite around $62.5 million of 2025 revenue, but those same databases
              contain factual errors elsewhere on leadership and funding, which undermines confidence in using them as
              primary anchors. The result is a classic late-stage hardware risk: investors can see growth and demand,
              but not enough of the underlying unit economics to know how resilient the business remains if timing slips
              or cost absorption lags.
            claimRefs:
              - CR001
