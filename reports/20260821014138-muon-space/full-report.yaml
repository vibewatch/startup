      - number: '7.3'
        title: Technology Roadmap and Competitive Pressure
        blocks:
          - type: paragraph
            body: >-
              The technology stack is ambitious enough that moat and risk are inseparable. Payload reported roughly 90%
              vertical integration for MuSat XL, and Muon has already pushed into in-house propulsion, XL-class buses,
              Starlink-enabled connectivity, and higher-power Condor systems. That can create real speed and margin
              advantages if the company controls the interfaces better than peers. It can also amplify failure modes
              because subsystems that would otherwise be bought from specialists become internal schedule and quality
              obligations. Meanwhile, the peer set is not static. California manufacturing coverage and Apex's own June
              2026 financing update show nearby builders scaling fast, with Apex disclosing 200-plus satellites per year
              of peak capacity and a $2.3 billion valuation. Muon is therefore trying to outrun both execution
              complexity and a rapidly capitalized rival set, while still relying on aspects of the SpaceX ecosystem
              that could eventually become competitive pressure in their own right.
            claimRefs:
