            body: >-
              Muon's public roster is notably strong for a still-private space company. On the commercial and climate
              side, FireSat, Hubble Network, Hydrosat, and other application-specific programs show demand for wildfire
              monitoring, Bluetooth connectivity, EO, and weather-related missions. On the government side, U.S. Space
              Force, NRO-linked work, SpaceWERX/SDA, and MDA SHIELD indicate meaningful defense relevance. The positive
              read is that Muon is not dependent on a single use case: the same platform stack is appearing across
              thermal monitoring, RF analytics, connectivity, and dual-use sensing. The negative read is that
              diversification by logo does not automatically mean diversification by revenue. Public sources name
              important customers, but they do not reveal how much revenue any one of them contributes, which programs
              are already in full-rate production, or how much of the backlog is concentrated in a small set of anchor
              missions. That opacity is the chapter's central reservation. Detailed cohort economics are still missing
