  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: constellation infrastructure, not the whole space economy'
        blocks:
          - type: paragraph
            body: >
              Muon should not be analyzed against every dollar spent on satellites. Its own Mission Foundry materials
              define the product as complete constellation delivery: mission design, spacecraft, payloads, orbital AI,
              production, and managed services. That makes the relevant market outsourced mission infrastructure for
              organizations that need an operational space system but do not want to assemble the entire stack
              internally. The distinction matters because it removes several adjacent pools from the investable market
              frame. Launch-only spending, pure downstream data subscriptions, and vertically integrated captive
              constellations all sit near Muon, but they are not the same purchase decision.

                              The clearest substitutes are therefore layered. Some buyers can contract for narrow pieces such as launch integration or data products, while others can fund an internal spacecraft team and retain system ownership. Still, Muon’s public customer and product narrative repeatedly points at buyers that want a bundled constellation prime. That is why later sizing in this chapter treats Muon’s SAM as a constrained subset of the broader small-satellite and EO markets rather than assuming the company can capture any arbitrary fraction of total space-economy spend.
