  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Multiple Math
        blocks:
          - type: paragraph
            body: >-
              Muon's August 2026 Series C set the headline terms: $250 million raised, more than $386 million of
              cumulative equity funding, and a reported valuation of roughly $1.5 billion. That is a credible late-stage
              mark in a hot category, but it is still only a headline until it is reconciled against operating metrics.
              The cleanest public revenue anchor in the retained pack is GetLatka's $62.5 million 2025 figure, and using
              that number implies a valuation multiple of about 24 times ARR. Even if one assumes the number understates
              Muon's run-rate, the current mark still presumes unusually strong future execution. The key tension is
              that the same Reuters coverage validating the raise also says Muon needs better revenue visibility before
              IPO timing becomes plausible. In other words, the round proves investor demand, but it does not by itself
              prove that the current price is conservatively anchored to realized fundamentals.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV012
              - CV024
              - CV032
