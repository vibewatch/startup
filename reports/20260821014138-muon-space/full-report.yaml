      - number: '7.5'
        title: Management Risk, Integration Risk, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Founder quality is a strength here, but it is also a concentration risk. Jonny Dyer's background across
              Skybox, Google Maps, and Lyft Level 5 is exactly the kind of cross-domain operating history that makes
              Muon credible with customers and investors; the public pack also shows four other co-founders and some
              experienced later hires. What the pack does not show is a formal succession structure, detailed operating
              bench depth, or a clean set of factory KPIs that let an outsider track whether execution is keeping pace
              with ambition. That is why the thesis-break criteria should stay simple and measurable: watch whether
              named launch diversification materializes, whether Starlight and higher-power buses move from promise to
              qualified customer delivery, and whether the factory outputs enough on-time satellites to justify the
              fixed-cost buildout. If those milestones slip, the valuation premium becomes much harder to defend.
            claimRefs:
