              - CV019
              - CV020
              - CV021
              - CV032
      - number: '8.5'
        title: Recommendation and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              On public evidence alone, the right posture is research-more. The bullish case has substance: Muon has
              real operating proof, brand-name investors, multiple mission categories, and a large addressable market.
              But the current valuation is still stretched because it prices in future manufacturing success more than
              current financial clarity. The most important missing pieces are straightforward: audited ARR, margin
              split by business line, timing of backlog conversion into cash, and the exact preference structure of the
              capital stack. Without those, an investor is underwriting a narrative with too wide a spread between bull
              and base outcomes. That does not mean the company is overpriced in every scenario; it means the available
              evidence is not yet strong enough to treat the $1.5 billion mark as a disciplined entry point. A tighter
              recommendation would only be possible after data-room confirmation of the economics behind the headline
              growth.
            claimRefs:
              - CV024
              - CV027
              - CV028
              - CV029
              - CV030
              - CV032
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV024
              - CV029
              - CV030
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Why the valuation is not crazy
            body: >-
              Muon already looks like an operating space company with real mission proof, not a pure concept story, so
              some private premium is warranted.
            calloutType: insight
            claimRefs:
              - CV005
              - CV010
              - CV033
              - CV034
          - type: callout
            title: Why the valuation is still stretched
            body: >-
              At the public ARR anchor, the implied multiple is too high to defend comfortably without much better proof
              on margins, backlog conversion, and launch or factory execution.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV024
              - CV032
          - type: callout
            title: Current recommendation
            body: >-
              Treat Muon as research-more at the current mark and only move to a constructive underwriting stance if the
              data room closes the core transparency gaps.
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV040
