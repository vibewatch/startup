  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: >-
      Public evidence yields strong marks on market and technical ambition, but much weaker marks on transparency and
      entry discipline.
    data:
      items:
        - label: Market opportunity
          value: Strong (4/5)
          note: EO and small-satellite demand are expanding in 2026.
        - label: Technical credibility
          value: Strong (4/5)
          note: 11 satellites in orbit and multiple mission categories create real proof.
        - label: Revenue quality
          value: Mixed (3/5)
          note: Backlog is visible but recurrence and mix are still imperfectly disclosed.
        - label: Financial transparency
          value: Weak (1/5)
          note: ARR, margin, burn, and preferences remain opaque.
        - label: Valuation discipline
          value: Weak (2/5)
          note: Current mark screens stretched on public ARR.
        - label: Exit readiness
          value: Weak (2/5)
          note: Management itself says clearer revenue visibility is needed before IPO.
    claimRefs:
      - CV024
      - CV027
      - CV028
      - CV030
      - CV032
      - CV033
appendices:
  - id: A
    title: Glossary of Key Terms
    blocks:
      - type: list
        title: Definitions
        items:
          - >-
            Mission Foundry: Muon's end-to-end constellation delivery model integrating design, manufacturing, launch,
            and operations.
          - 'Condor: Muon''s satellite platform family (M ~200kg, XL ~500kg, Ultra >20kW power, ~2028).'
          - 'MuonSim: Muon''s digital twin simulation tool for constellation design and mission validation.'
          - 'FactoryOS: Muon''s AI-powered manufacturing execution and configuration management system.'
          - 'AICore: Muon''s onboard AI compute module for edge inference on spacecraft.'
          - 'LEO: Low Earth Orbit (~160–2,000 km altitude).'
          - 'EO: Earth Observation — satellite-based imaging and sensing.'
          - 'OTA: Over-the-Air (software update mechanism for on-orbit spacecraft).'
          - 'SBIR: Small Business Innovation Research — U.S. government R&D grant mechanism.'
          - 'OTA (contract): Other Transaction Authority — flexible U.S. government procurement vehicle.'
          - 'ITAR: International Traffic in Arms Regulations — U.S. export control regime for defense items.'
        claimRefs: []
