  - id: FV001
    title: Recommendation Logic
    type: flow
    summary: >-
      The public-evidence recommendation stays cautious because technical proof and demand are real, but financial
      visibility and valuation support remain incomplete.
    data:
      nodes:
        - id: a1
          label: Operating proof
          description: 11 satellites in orbit, 100% mission success claim, 50+ in development
        - id: a2
          label: Market tailwind
