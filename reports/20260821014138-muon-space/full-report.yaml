      - number: '1.2'
        title: Founders, leadership, and key-person concentration
        blocks:
          - type: paragraph
            body: >
              Muon’s public leadership narrative is unusually founder-forward. The company names five founders — Jonny
              Dyer, Pascal Stang, Reuben Rohrschneider, Paul Day, and Dan McCleese — and still ties key execution
              functions directly to that original team. Dyer remains the principal external face of the business as CEO,
              Stang owns the technical stack as CTO, Rohrschneider is positioned around mission architecture, and Day
              covers production. The about page also discloses a broader executive bench including president Greg
              Smirin, CFO Ryan Gray, CLO Shirley Paley, and senior leaders across growth, mission execution,
              engineering, operations, and government affairs, which suggests Muon has built a real operating layer
              around the founding group rather than remaining a tiny founder-led lab.

                              Even so, public governance visibility remains thin. The source pack identifies operators and strategic functional leaders, and Jonny Dyer’s prior work at Skybox Imaging, Google Maps data collection, and Lyft Level 5 is a strong founder-market-fit signal for an Earth-intelligence and autonomous-systems company. But the same pack does not surface a board roster, board rights, or independent-director structure. That means the leadership picture is credible on functional coverage and key-person pedigree, yet still under-disclosed on governance controls relative to the scale of capital and government exposure now associated with the company.
