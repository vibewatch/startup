            claimRefs:
              - CV024
              - CV027
              - CV028
              - CV030
              - CV032
              - CV033
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The current mark works in the bull case and struggles in the base case. A credible bull path gets Muon to
              something like $100 million-plus ARR, shows that the San Jose facility can convert backlog into on-time
              deliveries, and demonstrates a healthier commercial and government balance; on that path, a $1.5 billion
              to $2.0 billion valuation is not unreasonable. The base case is more conservative: public ARR is
              directionally right, demand remains real, but the premium compresses toward mid-teens multiples because
              investors never receive enough transparency to award software-like credit to a capital-intensive space
              builder. That produces a fair-value zone closer to roughly $750 million to $1.125 billion. The bear case
              is simple: launch or factory execution slips, another raise is needed, or realized margins disappoint. In
              that world, a $500 million to $800 million valuation becomes easier to defend than the present round.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV025
              - CV026
          - type: table
            tableRef: TV003
