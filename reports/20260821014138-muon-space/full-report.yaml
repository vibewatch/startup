  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Mission Foundry as a product system
        blocks:
          - type: paragraph
            body: >-
              Muon is not presenting itself as a merchant small-satellite bus vendor. The company's own architecture
              frames the product as Mission Foundry: a six-pillar system that begins with mission design and simulation,
              moves through spacecraft and payload production, adds onboard AI and factory software, and ends with
              managed orbital services. That matters because it shifts the underwriting lens from component margins to
              system integration. Public product evidence points to a platform family that starts with Condor-M,
              stretches into the larger Condor-XL or MuSat XL class, and eventually reaches the higher-power
              Condor-Ultra roadmap. The same retained sources also show that Muon wants to monetize software, OTA
              updates, and mission operations in addition to spacecraft hardware. In other words, the architecture is
              explicitly designed to turn a one-time satellite build into a longer-lived software-and-services
              relationship when customers keep operating the mission after launch.
