              - CV008
              - CV018
              - CV019
      - number: '8.2'
        title: Why a Premium Exists — and Why It May Still Be Too Rich
        blocks:
          - type: paragraph
            body: >-
              Muon is not being valued like a typical pre-revenue space startup. The retained evidence shows a company
              with a real mission set, important investors, 11 satellites in orbit, a 20-satellite near-term manifest,
              and a multi-mission product thesis that spans spacecraft, payloads, operations, and data delivery. That is
              exactly the type of infrastructure narrative that 2026 valuation commentaries say can command a premium,
              especially when government demand and technical differentiation are visible. Yet those same 2026 surveys
              also stress how fast premium marks can compress when revenue realization, manufacturing cadence, or
              capital efficiency fail to keep pace with the story. Muon therefore sits in a narrow band: clearly
              stronger than a concept-only company, but still rich enough that any miss in 2027 execution, launch
              diversification, or margin disclosure could force investors to re-rate the business toward a more ordinary
              hardware multiple.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV021
              - CV025
              - CV026
              - CV031
              - CV033
