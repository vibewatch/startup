    title: Valuation Sensitivity at a $1.5B Mark
    type: bar
    summary: >-
      Muon looks clearly expensive if public ARR is near $62.5M and becomes merely defensible only if ARR approaches the
      nine-figure zone quickly.
    data:
      items:
