      - number: '4.2'
        title: Capital structure, leverage, and scale-up burden
        blocks:
          - type: paragraph
            body: >-
              Muon has solved the near-term capital-access problem far more convincingly than it has solved the
              external-disclosure problem. The company closed a $250 million Series C in August 2026 after completing a
              $146 million Series B complex that already included an $89.5 million B1 tranche and $45 million of credit
              facilities. That funding stack lifts disclosed lifetime capital above $386 million and gives Muon a
              sizeable balance-sheet cushion for facility build-out, inventory, long-lead parts, and program execution.
              At the same time, the structure shows that Muon is no longer financing growth with equity alone. Credit
              facilities can be attractive because they reduce dilution, but they also introduce repayment, covenant,
              and liquidity-management risk precisely when Muon is attempting to ramp toward 500 satellites of annual
              capacity and absorb a new 130,000 square foot San Jose factory. Without cash, burn, or covenant
              disclosure, outside investors cannot determine whether the Series C meaningfully de-risks runway or merely
              keeps pace with an aggressive fixed-cost ramp.
