  - - Security certifications
    - Not disclosed in retained public sources
    - Trust / cybersecurity diligence
    - Need SOC, ISO, IL or equivalent evidence
  - - Export / policy readiness
    - Policy sources imply importance for sovereign sales
    - Compliance and international delivery
