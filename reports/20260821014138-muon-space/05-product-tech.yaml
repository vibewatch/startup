callouts:
- calloutType: strength
  title: The moat is compositional, not component-level
  body: Muon's strongest product claim is that it can combine mission design, hardware, payload, AI, production software, and managed operations faster than less integrated peers. That kind of moat is harder to patent neatly, but it can be commercially meaningful if it lowers customer coordination cost and shortens time to orbit.
  claimRefs:
  - CE001
  - CE007
  - CE024
  - CE030
  - CE034
- calloutType: risk
  title: Roadmap breadth raises the next diligence burden
  body: The retained public record makes the current integrated stack credible, but it does not yet prove scale economics, Condor-Ultra schedule certainty, or a mature security-and-quality disclosure surface. The next diligence step should test factory yield, supplier resilience, and security governance rather than just reviewing architecture claims.
  claimRefs:
  - CE005
  - CE022
  - CE025
  - CE029
  - CE031
  - CE033
  - CE035
