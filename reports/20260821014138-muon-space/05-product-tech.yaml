- id: use-cases-and-differentiation
  title: Use cases that validate the configurable stack
  body: The strongest external proof of product quality is not a marketing diagram but the breadth of missions already attached to the stack. FireSat demonstrates purpose-built wildfire monitoring, Hubble shows that Muon can pair a larger platform with a novel Bluetooth connectivity mission, and defense work supports dual-use sensing and environmental-monitoring programs. Those examples matter because they show the same operating model can support materially different payloads and customer outcomes. They also highlight where differentiation probably sits. Muon's advantage is less likely to be a single patented subcomponent and more likely to be the ability to configure bus, payload, AI, operations software, and managed-service delivery faster than less integrated peers. That makes the product harder to compare line by line with a generic satellite manufacturer. It also means Muon must keep proving that integrated complexity turns into real delivery speed and reliability rather than simply
    higher organizational overhead.
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE024
  - CE027
  - CE028
  - CE029
  - CE030
  - CE034
