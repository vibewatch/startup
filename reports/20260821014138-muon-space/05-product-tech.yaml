  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-certifications
    missingEvidence: No retained source lists Muon's security certifications, mission assurance regime, or formal software quality framework.
    whyItMatters: Government and sovereign customers will eventually scrutinize cyber, quality, and export controls as heavily as bus specs.
    diligencePath: Request SOC / ISO / NIST evidence, mission-assurance process docs, and export-control operating procedures.
    relatedQuestionRefs:
    - QE019
  - type: private-evidence-only
    severity: material
    topic: yield-and-throughput
    missingEvidence: Public sources do not disclose factory yield, takt time, escape rate, or supplier lead-time metrics.
    whyItMatters: Without throughput metrics, vertical integration is a story rather than a proven manufacturing moat.
    diligencePath: Request line-level throughput dashboards, supplier scorecards, and on-time-delivery history.
    relatedQuestionRefs:
    - QE015
    - QE016
    - QE025
  - type: stale
    severity: minor
    topic: condor-ultra-schedule
    missingEvidence: Condor-Ultra is publicly framed as a 2028 target, but intermediate milestone dates are not retained.
    whyItMatters: Long-horizon platforms often slip or change specification as customer requirements evolve.
    diligencePath: Request PDR/CDR timing, customer anchor commitments, and milestone burn plan for Condor-Ultra.
    relatedQuestionRefs:
    - QE020
    - QE021
