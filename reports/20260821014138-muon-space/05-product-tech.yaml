company:
  name: Muon Space
chapter:
  number: 5
  title: Product & Technology
  summary: 'Muon Space''s product thesis is unusually integrated for a young space company: Mission Foundry spans simulation, platforms, payloads, orbital AI, factory software, and managed services. The best public proof points are real mission wins such as FireSat and Hubble; the biggest remaining questions are scale manufacturability, security disclosure depth, and delivery risk on long-horizon platforms like Condor-Ultra.'
sections:
- id: mission-foundry-stack
  title: Mission Foundry as a product system
  body: 'Muon is not presenting itself as a merchant small-satellite bus vendor. The company''s own architecture frames the product as Mission Foundry: a six-pillar system that begins with mission design and simulation, moves through spacecraft and payload production, adds onboard AI and factory software, and ends with managed orbital services. That matters because it shifts the underwriting lens from component margins to system integration. Public product evidence points to a platform family that starts with Condor-M, stretches into the larger Condor-XL or MuSat XL class, and eventually reaches the higher-power Condor-Ultra roadmap. The same retained sources also show that Muon wants to monetize software, OTA updates, and mission operations in addition to spacecraft hardware. In other words, the architecture is explicitly designed to turn a one-time satellite build into a longer-lived software-and-services relationship when customers keep operating the mission after launch.'
  claimRefs:
