- id: build-vs-buy
  title: Build-vs-buy hinges on scope, trust, and time-to-orbit
  body: |
    The strongest argument for choosing Muon is not simply “better satellite.” It is lower organizational burden for complex missions. Mission Foundry wraps mission design, payloads, software, production, and managed operations into one relationship. That is attractive when a customer wants a mission-specific system quickly but does not want to build the bus, payload, software, and operating team internally. Government and sovereign buyers are especially relevant here because they often want bespoke mission control and data ownership without creating an entire spacecraft industrial base from scratch.

                The reasons to choose away from Muon are equally clear. If the customer mainly wants data, then Planet, ICEYE, Spire, or Maxar may be better fits. If the customer values launch control or a launch-led bundle, Muon is weaker because it does not own that layer. If the customer already has the scale and staff to build internally, Muon can lose on ownership preference rather than on capability. The result is a competitive field where product differentiation matters, but the real decision turns on how much of the mission stack the buyer wants to outsource.
  claimRefs:
  - CP004
