  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: The retrieved public sources do not disclose standardized price cards or realized contract economics
      for Muon or most peers.
    whyItMatters: Without packaging economics, it is hard to tell whether Muon wins on premium differentiation or on negotiated
      cost parity.
    diligencePath: Request representative proposals, pricing architecture, and win/loss reasons versus direct and adjacent
      peers.
    relatedQuestionRefs:
    - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: direct-peer-coverage
    missingEvidence: The public pack is materially richer on Apex and Muon than on K2, Millennium, and Terran, leaving some
      direct-peer feature comparisons directional.
    whyItMatters: A fair competitive map needs enough depth on each peer to separate true differentiation from source-pack
      asymmetry.
    diligencePath: Pull direct product pages, contract wins, and manufacturing disclosures for K2, Millennium, and Terran
      in the next refresh.
    relatedQuestionRefs:
    - QP022
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: No public source discloses Muon's win rates, churn, or program displacement patterns versus direct builders
      and adjacent data platforms.
    whyItMatters: Moat durability ultimately depends on buyer behavior, not on product narratives alone.
    diligencePath: Ask management for pipeline stage conversion, win/loss notes, and competitive take-rate by substitute type.
    relatedQuestionRefs:
    - QP024
    - QP025
