  - Limitation
  rows:
  - - Apex
    - Private high-rate bus manufacturer
    - $2.3B valuation; 200+ sats/year peak capacity
    - Closest disclosed private manufacturing comp
    - Higher productization and different bus-led positioning
  - - True Anomaly
    - Space domain awareness
    - ~$1.1B valuation
    - Shows how defense-centric orbital infrastructure is being priced
    - Different payload and mission model
  - - Varda
    - Orbital manufacturing
    - ~$1.2B valuation
    - Another hardware-heavy private infrastructure comp
    - Very different end-market and margin profile
  - - K2 Space
    - Large-satellite manufacturing peer
    - Valuation not cleanly disclosed in retained public pack
    - Relevant as a California manufacturing peer
    - Cannot use as a precise numerical anchor from this pack
  - - ICEYE
    - Commercial SAR operator
    - Revenue and backlog disclosed; exact 2026 valuation not retained here
    - Useful for dual-use EO monetization logic
    - Closer to data-service operator than bus manufacturer
  - - Planet Labs
    - Public EO operator
    - Approx. $280M annualized 2025 revenue in retained market analysis
    - Public recurring-EO comp for demand and analytics layer
    - Different public-market liquidity and sensor mix
  - - Rocket Lab
    - Public integrated space systems company
    - 2026 commentary cites rich public revenue multiples
    - Shows how public markets can still reward proven hardware scale
    - Launch exposure and public-cap structure differ materially
