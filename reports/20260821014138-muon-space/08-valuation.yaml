- id: recommendation-and-final-diligence
  title: Recommendation and Final Diligence Asks
  body: 'On public evidence alone, the right posture is research-more. The bullish case has substance: Muon has real operating proof, brand-name investors, multiple mission categories, and a large addressable market. But the current valuation is still stretched because it prices in future manufacturing success more than current financial clarity. The most important missing pieces are straightforward: audited ARR, margin split by business line, timing of backlog conversion into cash, and the exact preference structure of the capital stack. Without those, an investor is underwriting a narrative with too wide a spread between bull and base outcomes. That does not mean the company is overpriced in every scenario; it means the available evidence is not yet strong enough to treat the $1.5 billion mark as a disciplined entry point. A tighter recommendation would only be possible after data-room confirmation of the economics behind the headline growth.'
