- id: TV004
  title: Comparable Valuation Table
  notes: This is a mixed set of private and public comparables. Some rows are precise valuation anchors; others are operating-model comps where the retained public pack does not provide a clean 2026 valuation print.
  enumerationScope:
    coverage: partial
    basis: Closest retained 2026 comparables spanning private satellite manufacturers, orbital infrastructure companies, and public EO operators.
  columns:
  - Comparable
  - 2026 metric / status
  - Multiple or valuation
