- id: TV005
  title: Thesis-Break and Kill Triggers Table
  notes: Triggers focus on evidence that can genuinely change the valuation case, not just create short-term headline volatility.
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Factory underutilization
    - 2027 throughput materially misses disclosed ramp
    - Premium for future scale collapses
    - Re-underwrite toward bear range
  - - Opaque revenue quality
    - Audited ARR or margins differ materially from public narrative
    - Multiple anchor fails
    - Do not invest at current mark
  - - Launch concentration persists
    - No real diversification while backlog rises
    - Schedule risk stays structurally high
    - Apply execution discount to all upside cases
  - - Commercial mix disappoints
    - Commercial recurrence stays minority and lumpy
    - Government concentration remains dominant
    - Lower comp set toward defense-contractor or public-market levels
  - - Need for near-term additional capital
    - Another raise before proof of backlog conversion
    - Dilution and preference stack worsen
    - Reframe current round as bridge, not durable mark
