- id: TV006
  title: Final Diligence Asks Table
  notes: These asks are the minimum package needed to convert a public-evidence view into an investable valuation judgment.
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited ARR
    - Signed revenue bridge and auditor-backed 2025 / 2026 ARR
    - Needed to anchor the multiple math
    - Finance data room
  - - Gross margin split
    - Margin by hardware, services, data, and operations
    - Determines whether software-like or hardware-like comps are valid
    - Finance + operating review
  - - Backlog conversion
    - Contracted backlog by launch window and revenue recognition timing
    - Separates demand narrative from cash realization
    - Program and finance review
  - - Preference stack
    - Liquidation preferences, option-pool changes, anti-dilution terms
    - Changes real entry price and exit proceeds
    - Legal / financing documents
  - - Launch diversification
    - Named non-SpaceX providers and slot control
    - Affects schedule confidence and downside risk
    - Program management review
