- id: peer-and-public-market-comparison
  title: Peer Set and Public-Market Comparison
  body: 'The strongest private comparison in the retained pack is Apex: another California-based manufacturing-scale story, but with a disclosed $2.3 billion valuation and more than 200 satellites per year of peak factory capacity. That places Muon below Apex in absolute mark but not by a wide margin, despite Muon still being earlier in disclosed revenue transparency. Orbital Intel also puts Varda and True Anomaly near $1.2 billion and $1.1 billion respectively, while the same survey says the median ex-SpaceX unicorn sits around $1.4 billion. Muon''s $1.5 billion mark is therefore not absurd in cohort terms; it is slightly above the middle of a hot private market. The caution comes from public-market gravity. 2026 commentary points to substantially lower revenue multiples for profitable or publicly traded space businesses than Muon''s implied 24x, which means the private premium only works if Muon grows into it quickly.'
  claimRefs:
  - CV008
  - CV014
