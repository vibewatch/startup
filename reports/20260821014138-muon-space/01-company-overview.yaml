- id: capital-and-scale
  title: Funding history, valuation ambiguity, and scale signals
  body: |
    The clearest public funding facts are the June 2025 combined Series B total and the August 2026 Series C close. Muon’s own release says the Series C brought total equity funding to more than $386 million and was led by Eclipse Capital, with a syndicate spanning Google, Salesforce Ventures, Wellington Management, I Squared Capital, Woven Capital, and returning investors such as Radical Ventures, Congruent Ventures, Costanoa Ventures, Activate Capital, ACME Capital, ArcTern Ventures, and Overlap Holdings. Earlier, the company’s Series B and B1 announcements established a combined $146 million raise, including a meaningful credit component, and tied that capital to manufacturing scale-up and the Starlight Engines propulsion acquisition.

                    Valuation certainty is weaker than funding certainty. Multiple outlets repeated an approximately $1.5 billion mark, but Reuters reported that the company declined to confirm it. Operational metrics are stronger than the valuation disclosure: Muon reported 11 satellites across six launches, 50-plus satellites in development, 13 already manifested for the next year, and a production target of 500 satellites annually by 2027. Revenue quality remains the largest missing financial input. GetLatka published a 2025 revenue or ARR-equivalent proxy of $62.5 million, and the company said growth topped 100% year over year for a second straight year, but there is still no audited public run-rate, margin, or headcount bridge.
