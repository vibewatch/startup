company:
  name: Muon Space
chapter:
  number: 1
  title: Company Overview
  summary: Muon Space is a 2021-founded Silicon Valley satellite-constellation prime that now positions itself as an integrated
    Mission Foundry spanning spacecraft, payloads, software, production, and managed services. Public evidence supports meaningful
    traction — 11 satellites deployed, 50-plus in development, a $250 million Series C, and named commercial plus government
    programs — but valuation confirmation, governance disclosure, and financial transparency still lag the scale narrative.
sections:
- id: identity-and-platform
  title: Identity, platform, and operating footprint
  body: |
    Muon Space presents itself as a constellation prime rather than a narrow spacecraft vendor. Its homepage, about page, and Mission Foundry materials all frame the company as an end-to-end partner that can move from mission design through spacecraft, payloads, software, production, and managed operations. That positioning matters because it defines what later chapters should treat as the company’s addressable business: Muon is not simply selling a bus, a launch brokerage, or a data subscription. It is selling an integrated path to an operational constellation for customers that want mission outcomes without stitching the stack together themselves.

                    The geographic footprint also looks more substantial than a very early startup profile. Muon states it was founded in 2021 in Mountain View, California, and its about page says it now operates two Silicon Valley facilities. In the August 2026 Series C announcement, management highlighted both the newer San Jose manufacturing site and the company’s ability to scale complete systems across commercial, civil, and national-security buyers. Taken together, the public record supports a company that has moved beyond concept stage into a multi-facility operating model, while still keeping the core identity anchored in one integrated Silicon Valley manufacturing-and-mission-delivery story.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
