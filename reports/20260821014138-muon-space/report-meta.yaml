companyProfile:
  summary: "Muon Space is a Silicon Valley aerospace startup that designs, manufactures, and operates high-performance satellite constellations end-to-end under its Mission Foundry model. Founded in 2021 by five space industry veterans, the company has deployed 11 satellites with a 100% mission success record and opened a 130,000 sq ft production facility in San Jose capable of producing up to 500 satellites per year by 2027. Its customer base spans U.S. national security (Space Force, NRO, Missile Defense Agency), commercial IoT (Hubble Network), environmental monitoring (Earth Fire Alliance FireSat), and international sovereign programs."
