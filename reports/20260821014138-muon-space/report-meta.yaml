  foundingLocation: "Mountain View, California, USA"
  headquarters: "San Jose, California, USA"
  productSummary: "Mission Foundry: a six-pillar end-to-end constellation platform integrating mission design (MuonSim digital twin), Condor spacecraft platforms (M/XL/Ultra classes), custom payloads (EO/IR/RF/multispectral), Orbital AI (AICore onboard compute), constellation production (FactoryOS), and managed orbital services (OTA, C3 APIs, Starlink laser connectivity). Delivers complete operational constellations in months."
  customerFocus: "U.S. and allied national security agencies, commercial satellite constellation operators, environmental monitoring organizations, and IoT infrastructure providers."
  businessModel: "Contract-based constellation delivery and managed services. Customers pay for complete mission outcomes — design, build, launch, and operate — rather than individual hardware components. Revenue includes government contracts (fixed-price and SBIR/OTA awards) and commercial constellation contracts."
