callouts:
- calloutType: risk
  title: Runway opacity remains the main underwriting blocker
  body: Muon has raised enough capital to look institutionally financeable, but public sources do not disclose current cash, burn, or debt covenants. That makes it impossible to know whether the Series C created real strategic flexibility or simply keeps pace with a very ambitious manufacturing ramp.
  claimRefs:
  - CI008
  - CI011
  - CI012
  - CI027
  - CI028
  - CI032
  - CI035
- calloutType: insight
  title: Backlog quality matters more than headline ARR alone
  body: The public case for Muon is strongest when ARR, manifests, and signed contracts are read together. Hardware-heavy space companies can look expensive on a simple ARR multiple while still being rationally financed if backlog converts into multi-mission platforms and follow-on service work.
  claimRefs:
  - CI003
  - CI005
  - CI006
  - CI019
  - CI020
