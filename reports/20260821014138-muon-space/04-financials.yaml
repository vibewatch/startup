- id: unit-economics-and-demand
  title: Unit-economics proxies and demand backdrop
  body: 'Unit economics are only partially visible, so the right approach is to separate what can be computed from what remains qualitative. Public sources allow rough proxies such as cumulative funding-to-ARR and valuation-to-ARR, but these should be treated as directional because they combine a September 2025 ARR datapoint with August 2026 financing terms. Likewise, a simple division of 2024 signed contracts by satellites in development produces only a lower-bound contract-value-per-satellite proxy, not a margin or cash-conversion metric. The more durable insight comes from demand-side support: multiple 2026 earth-observation and small-satellite market studies still describe expanding end demand, while Muon''s own 2026 roster spans government environmental monitoring, wildfire detection, hyperspectral and thermal imaging, Bluetooth connectivity, and weather data. That backdrop supports the idea that utilization can rise into the factory build-out. It does not, however, eliminate procurement
    timing risk or data-market pricing pressure.'
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI029
  - CI030
  - CI031
  - CI034
  tableRefs:
  - TI005
  figureRefs:
  - FI002
- id: verdict
  title: Financial verdict and diligence blockers
  body: 'The chapter''s main conclusion is that Muon looks financeable from the outside, but not yet fully underwritable. Strong positives include demonstrated capital access, a credible backlog, named contract wins large enough to matter, and end markets that still appear to be growing. Just as important, the product stack appears designed to capture more value than a bare satellite-bus sale by layering payloads, software, and managed mission operations. The caution is that almost every decisive underwriting input remains private: cash balance, monthly burn, gross margin, working-capital cycle, top-customer mix, and realized pricing by program. The disclosed use of credit facilities adds another reason to ask for lender materials, debt terms, and liquidity planning under NDA. Until those materials are reviewed, Muon should be viewed as a company with strong external momentum and real financial promise, but with persistent blind spots around burn, margin, and true capital efficiency. Additional
    lender-side diligence is essential.'
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI032
  - CI033
  - CI034
  - CI035
