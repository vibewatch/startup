- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Gross margin by product / mission
    - Cannot judge whether backlog converts into attractive cash earnings
    - Request mission-level margin bridge for spacecraft, payload, data, and managed services
  - - Monthly burn and capex split
    - Cannot test runway or capital-efficiency claims
    - Request 24-month cash-flow statement with operating vs factory capex separation
  - - Cash on hand and debt draw status
    - Cannot translate large raises into runway months
    - Request current balance sheet and debt schedule
  - - Customer concentration
    - Cannot tell whether a few flagship programs dominate revenue
    - Request top-10 customer revenue mix and renewal terms
  - - Realized average selling price per satellite or program
    - Cannot compare Muon economics against high-rate peers
    - Request historical ASP, BOM, and contribution margin by platform
  - - Working-capital cycle
    - Cannot assess inventory financing burden in the factory ramp
    - Request AR, AP, inventory days, and long-lead supplier payment terms
  notes: Every row is a blocker to a full financial underwriting despite strong top-line momentum signals.
