company:
  name: Muon Space
chapter:
  number: 4
  title: Financials
  summary: 'Muon Space has credible external momentum: a disclosed $250 million Series C, lifetime funding above $386 million, a reported $62.5 million ARR datapoint, and a 50-plus-satellite backlog. The investment case is therefore not about whether demand exists; it is about whether margin, burn, and working-capital dynamics are attractive enough to justify a factory-heavy ramp toward 500 satellites per year by 2027.'
sections:
- id: revenue-visibility
  title: Revenue visibility and quality
  body: Public evidence supports real commercial traction, but it stops well short of a lender-grade or public-equity-grade financial picture. The strongest disclosed operating datapoint is the Latka profile showing $62.5 million of ARR in September 2025, which at least anchors scale above an early pilot stage. Muon then claimed 100%+ year-over-year revenue growth for a second consecutive year, more than $100 million of contracts signed in 2024, more than $60 million of Halo-related contracts, and a backlog of over 50 satellites in development. That collection of claims suggests revenue is tied to a mix of mission integration, payload work, managed operations, and data-oriented offerings instead of a single transactional sale. The positive read is that backlog and manifests imply visible demand. The negative read is that public sources still do not disclose gross margin, customer concentration, revenue recognition policy, or the split between hardware, services, and software-like recurring
    revenue.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI018
