  rows:
  - - Constellation and satellite manufacturing
    - Custom spacecraft and constellation builds for defense and commercial missions
    - Mission contract / satellite program
    - 50+ satellites in development; 13 next year; 20 over 20 months
    - High demand signal, but realized pricing undisclosed
    - Program-level revenue schedule, acceptance milestones, and cancellation rights
  - - Government environmental-monitoring programs
    - OTA and SBIR-backed constellation work
    - Award value / milestone payments
    - $44.6M U.S. Space Force Phase III OTA disclosed
    - High-quality customer proof but payment timing unclear
    - Award structure, options, funded vs unfunded portions
  - - Muon Halo mission stack
    - Integrated hardware + software + services offering
    - Program value / bundled contract
    - $60M+ Halo contracts by 2024
    - Shows packaged solution, but margin split unknown
    - Halo SKU-level pricing, gross margin, and attach rates
  - - Managed orbital services
    - C3 APIs, OTA software, mission operations, data handling
    - Recurring service fees / software-like support
    - Officially disclosed as a pillar; no public pricing
    - Potentially better margin than hardware, but unsupported externally
    - Service ARR, renewal rates, and support cost per mission
  - - Payload and data products
    - EO/IR, RF, thermal, and other sensing payload outputs
    - Payload contract / data subscription / mission fee
    - Commercial wins cited across hyperspectral, thermal, BLE, weather
    - Evidence of breadth, not of recurring revenue quality
    - Revenue split among payload sales, data rights, and managed delivery
  - - Sovereign and commercial mission integration
    - Turnkey mission engineering and delivery
    - Per program
    - Public sources show multi-segment pipeline, but no revenue mix
    - Diversifies end market exposure
    - Top-10 customers, ACV, and repeat-purchase rate
  notes: Rows synthesize official product pillars and disclosed contract evidence; realized pricing and recurring mix remain private.
