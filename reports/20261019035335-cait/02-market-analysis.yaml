company:
  name: "CAIT"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "CAIT's evidenced market is narrower than a generic EV TAM story: public sources support an integrated intelligent chassis beachhead sold into OEM vehicle programs, not a disclosed broad spend pool. The strongest market signals are Bedrock's 2024 China mass production, a first overseas passenger-vehicle project with Togg covering three B-segment models, and an ecosystem extension through Horizon, while pricing, budget ownership, unit volumes, and homologation readiness remain undisclosed."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitute set"
    body: "The assigned source pool supports a specific market definition rather than a broad electric-vehicle infrastructure claim. CAIT's Bedrock Chassis is described as an integrated intelligent chassis that combines battery, electric drive, thermal management, and chassis control into one platform, so the included spend is platform-level chassis integration, associated engineering services, and adjacent software-hardware integration where that chassis is the anchor. The evidence does not support including CATL's entire battery business, finished-vehicle revenue, or generic EV component spend. The status-quo substitute is also narrow: automakers can keep integrating those systems through in-house engineering and multiple suppliers instead of adopting a pre-integrated skateboard architecture."
    claimRefs: ["CM001", "CM002", "CM008", "CM009", "CM010"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Evidence-constrained sizing and expansion lenses"
    body: "No retained source in the assigned pool discloses TAM, SAM, or SOM dollars for integrated intelligent chassis, so the chapter uses commercialization lenses instead of invented market-size math. The clearest proof point is operational: CATL says Bedrock reached mass production in China in 2024. Expansion evidence then narrows to specific program count and geography: CAIT's partnership with Togg is described as the first overseas passenger-vehicle project for Bedrock, covers three B-segment models, targets Turkish and European markets, and points to a first model entering mass production in 2027. Gasgoo adds a separate scale lens by reporting a more than CNY2 billion financing round earmarked for mass production and next-generation R&D, plus overseas projects across Southeast Asia, the Middle East, and Europe. Those are meaningful adoption indicators, but they still stop short of disclosed revenue pools, unit volumes, or conversion rates from announced cooperation to shipped vehicles."
    claimRefs: ["CM003", "CM004", "CM005", "CM006", "CM007", "CM012", "CM014", "CM015"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyer-drivers-and-constraints"
    title: "Buyer map, adoption drivers, and gating constraints"
    body: "The named counterparties imply that CAIT sells into OEM platform decisions, not directly to consumers. In the Togg and Horizon announcements, the relevant interfaces are product strategy, digital architecture, intelligent-driving, and vehicle-platform teams, which suggests adoption depends on OEM engineering and program owners accepting a new architecture. The strongest adoption drivers in the current evidence are faster program development, packaging and efficiency gains from a battery-centric integrated platform, and the localization model that pairs one chassis platform with one supply-chain path and one domestic brand. The main constraints are equally clear: public sources still do not disclose pricing, buyer budget ownership, contracted unit volumes, or concrete homologation milestones for overseas rollout, so valuation has to underwrite partnership credibility more than proven commercial throughput."
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM013", "CM015"]
    tableRefs: ["TM003"]
