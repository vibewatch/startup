      - number: '3.2'
        title: 差异化集中在集成深度与生态适配
        blocks:
          - type: paragraph
            body: >-
              Bedrock 已披露的主要差异化在于底盘集成程度。留存的官方及联合转载材料始终将该平台描述为把电池、电驱、热管理和底盘域控制器置于同一架构中。Horizon 协议又增加了一层定位：CAIT
              并未声称拥有完整的智能驾驶技术栈，而是把自己的底盘与一家已有广泛出货规模的 ADAS 供应商配对。这提高了市场进入可信度，但也表明 CAIT
              的方案在合作伙伴生态中嵌入时最有优势，而不是作为完整、自包含的自动驾驶平台单独销售。
            claimRefs:
