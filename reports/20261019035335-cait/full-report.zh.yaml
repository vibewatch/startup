      - number: '4.3'
        title: 新资本改善现金跑道预期，但充足性仍无法衡量
        blocks:
          - type: paragraph
            body: >-
              Gasgoo 报道 CAIT-SH 完成首轮外部融资，金额超过 RMB 2 billion，估值超过 RMB 10 billion，资金用于 Bedrock
              量产和下一代底盘研发。这是积极信号，因为它表明现有投资人正在为规模化投入资金，而不只是支持概念开发。但这仍不足以得出偿付能力结论。留存公开来源没有披露现金余额、消耗率、债务或项目融资义务、与 CATL
              的关联方转移定价机制，也没有披露会触发下一轮融资的里程碑。因此，困境尚未得到证明；真正的财务风险在于，投资人能看到战略动能和近期融资支持，却仍无法量化 CAIT 是否能靠经营表现自我资助增长。
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI013
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              CAIT 在战略上看起来可信，因为证据显示它拥有获得融资支持的底盘平台、中国量产历史、具名海外 OEM 项目，以及当前围绕智能驾驶集成与 Horizon
              的战略合作。但从财务角度看，证据基础仍处于投资判断之前。本章可以支持商业化意图真实、当前有资本支持的判断，却不能支持对收入质量、毛利率走势、CAC
              效率、营运资金拖累或独立现金跑道的判断。尽调下一步不是再寻找一个叙事里程碑，而是获取项目、客户和利润率层面的原始经营披露。
