        title: 展示项
        blocks:
          - type: callout
            title: 商业证明仍落后于叙事广度
            body: 证据支持 CAIT 已在 OEM 平台上建立可信切入口，但公开披露仍缺少定价、预算归属、签约数量和认证里程碑，因此市场故事仍由项目推进主导，而不是由收入主导。
            calloutType: risk
            claimRefs:
