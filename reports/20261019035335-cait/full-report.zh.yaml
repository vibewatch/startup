  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持跟踪，因为平台和客户证据确实存在，但财务评估依据仍然薄弱。
    data:
      nodes:
        - label: 产品 / 平台证明
          detail: CIIC 生产基地规划和集成式 Bedrock 架构，说明这是真实运营中的平台。
        - label: 客户 / 落地证明
          detail: Togg 是已点名的海外乘用车项目，但首款车型仍计划于 2027 年量产。
        - label: 发起方依赖
          detail: CATL 母公司的背书仍承担了制造能力、市场信号和市场准入的大部分可信度。
        - label: 估值依据缺口
          detail: 公开证据显示融资估值 >RMB 10 billion，但没有独立收入、利润率、现金消耗或股权结构条款。
        - label: 尽调门槛
          detail: 要形成买入逻辑，还需要股权结构、经济模型和客户转化证据；现有保留的公开来源尚未提供这些信息。
        - label: 建议
          detail: 只有在价格纪律、尽调权利和里程碑证据更充分时，才考虑跟踪或投资。
      edges:
        - from: Product / platform proof
          to: Customer / rollout proof
          label: 技术可信度推动客户采用
        - from: Customer / rollout proof
          to: Valuation support gap
          label: 商业叙事仍跑在经济性前面
        - from: Valuation support gap
          to: Recommendation
          label: 财务评估依据薄弱，因此判断保持谨慎
    approximationNotes: 这是一条逻辑链，不是加权评分模型；它反映的是保留的证据集，而非任何隐含的概率公式。
