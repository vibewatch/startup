      - number: '3.3'
        title: 商业杠杆具备可能性，但公开价格发现缺失
        blocks:
          - type: paragraph
            body: >-
              公开证据更清楚地支持规模扩张雄心，而非商业透明度。Gasgoo 报道首轮外部融资超过 RMB 2 billion，估值超过 RMB 10 billion，资金用于量产和下一代研发，这有助于解释 CAIT
              如何支撑较长的平台开发周期。但官方材料和留存的第三方报道都没有提供 Bedrock
              的目录价、合同结构或折扣细节。即便是最有价值的独立报道，也大多重复公司提供的合作事实，而非给出正面对比的采购证据，因此关于转换成本和利润率的说法目前只能作为方向性线索，尚不足以纳入投资判断。
            claimRefs:
