  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式在业务结构中可见，但尚未体现在已确认收入里
        blocks:
          - type: paragraph
            body: >-
              留存来源支持一种以 Bedrock 底盘项目、相关工程工作和相邻集成收入为核心的 B2B OEM 平台收入模式，而不是已披露的软件 SaaS 模式。CAIT
              及其合作方反复围绕具名车型项目、本地化供应链部署和底盘加智能集成来描述商业化，这符合项目制汽车收入，但不等于公开披露了经常性指标。公开进展以里程碑为主：Gasgoo 报道 Bedrock 于 2024
              年开始量产，多家与 Togg 相关的来源则将首个具名海外乘用车项目描述为一个覆盖 3 款车型的系列，目标于 2027 年首次量产。这能证明商业部署已经存在，但不能证明当前收入规模、实际拿单率或毛利转化。
