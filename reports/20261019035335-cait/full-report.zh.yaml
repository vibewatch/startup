        title: 展示项
        blocks:
          - type: callout
            title: CAIT 销售的是架构项目，而非商品化模块
            body: 已披露的最强差异化是系统集成加项目设计支持。相比单个零部件销售，这可能带来更黏性的 OEM 关系，但前提是 CAIT 持续嵌入本地合作方和智能层协作者。
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP009
          - type: callout
            title: 优势的公开证明仍然单薄
            body: 证据集包含真实的项目进展和融资信号，但其中很大一部分是公司发布后被转载的材料。缺乏独立定价、安全性和并排性能基准，使护城河判断仍只有方向性可信度，尚未得到充分验证。
            calloutType: risk
            claimRefs:
              - CP007
