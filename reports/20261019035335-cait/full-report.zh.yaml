    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Togg 在 2027 年按时发布，CAIT 增加更多海外项目，管理层披露强劲的独立经济性。
        - 只有在收入、利润率和股权结构证明明显改善后，价值才可能超过最新的 >RMB 10 billion 参考值。
        - 执行仍取决于合作伙伴爬坡和母集团协同。
        - 低
      - - 基准
        - Togg 路径维持，中国量产资历不变，财务披露仅逐步改善。
        - 最新披露的估值大致可以维持当前预期，但在经济性变得可见前，上行空间仍受限。
        - 如果商业化仍主要靠宣传推动，叙事会跑在证据前面。
        - 中
      - - 悲观
        - 商业化爬坡延期，公开披露持续稀薄，或发起方依赖掩盖了疲弱的独立表现。
        - 未来一轮融资可能低于当前预期，因为当前公开估值缺乏广泛的经济性支撑。
        - 如果 2027 年里程碑推迟，或客户证明仍然狭窄，下一轮融资风险会上升。
        - 中
