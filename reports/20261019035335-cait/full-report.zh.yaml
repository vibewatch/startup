            body: >-
              最终尽调议程主要是用投资判断证据替代叙事证明。在从继续跟踪转向投资之前，投资人应要求独立收入和毛利率披露、项目级产能爬坡假设、客户集中度、融资后持股、任何清算或结构化优先权条款，以及 CATL
              关系确实有助于而不是掩盖转移定价和治理问题的证据。若 CAIT 无法证明首轮外部融资支持了真实规模化，而不是长期的收入前建设；若 Togg
              时间表走弱且没有新的客户胜出来弥补；或若母公司支持仍是估值得以维持的主要原因，投资论点就会失效。这些是可衡量的尽调门槛，而不是文风问题。
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 除非价格和证明改善，否则继续跟踪
            body: CAIT 拥有可信的平台和客户信号，但留存公开证据仍支持继续跟踪 / 继续研究的结论，除非进入条款能够补偿独立经济性和资本结构可见度的缺失。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV012
          - type: callout
            title: 最新公开估值支撑薄弱
            body: 来源池中最强的公开价格锚点，是一篇 2025 年 10 月关于首轮外部融资超过 RMB 2 billion、估值超过 RMB 10 billion 的报道；其余来源主要佐证战略和商业化叙事，而不是财务投资判断。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV010
              - CV011
