      - number: '2.3'
        title: 买方地图、采用驱动因素与准入约束
        blocks:
          - type: paragraph
            body: >-
              已点名的合作方表明，CAIT 面向的是 OEM 平台决策，而不是直接面向消费者。在 Togg 和 Horizon 的公告中，相关接口包括产品战略、数字架构、智能驾驶和整车平台团队；OEM
              工程团队和项目负责人是否接受新架构。当前证据中最强的采用驱动因素，是更快的项目开发、电池中心一体化平台带来的封装与效率提升，以及把一个底盘平台、一条供应链路径和一个本土品牌配对的本地化模式。约束同样清楚：公开来源仍未披露定价、买方预算归属、签约数量或海外落地的具体认证里程碑，因此估值更需要评估合作可信度，而不是已被证明的商业吞吐。
            claimRefs:
