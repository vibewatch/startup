  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局仍更像合作方驱动，而非同业基准驱动
        blocks:
          - type: paragraph
            body: >-
              留存证据显示，CAIT 参与的是整车架构层竞争，而不是简单的零部件供应。CATL 将 CAIT 描述为围绕 Bedrock Chassis 构建的全资子公司；公司发布和联合转载材料都把 Bedrock
              定位为面向乘用车品牌的独立一体化底盘。这一定位意味着核心竞争集合包括 OEM 内部集成和多供应商模块组装，尽管分配到的来源没有找到具名的第三方底盘竞争者，也没有找到有来源支撑的功能或定价数据。最强的公开证明点是
              Togg 项目：它显示 CAIT 已取得海外进展，但也显示公司目前是通过深度联合开发进入项目，而不是提供标准化现货方案。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
