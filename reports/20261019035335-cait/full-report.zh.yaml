  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              分配到的来源支持一个具体的市场定义，而不是宽泛的电动车基础设施说法。CAIT 的 Bedrock Chassis
              被描述为一体化智能底盘，把电池、电驱、热管理和底盘控制整合到一个平台中，因此纳入的支出应是平台级底盘集成、相关工程服务，以及以该底盘为锚点的相邻软硬件集成。证据不支持把 CATL 的全部电池业务、整车收入或泛化的
              EV 零部件支出纳入其中。现有替代方案也很明确：汽车厂商可以继续依靠内部工程团队和多家供应商分别集成这些系统，而不是采用预集成的滑板式架构。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
