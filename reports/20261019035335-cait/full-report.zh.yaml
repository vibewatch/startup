      - number: '1.2'
        title: 领导层、治理与商业化里程碑
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据有限，但仍可使用。Togg 公告体系将 Hanbing Yang 列为 CAIT CEO；同一签约活动中，Libin Tan 和 Robin Zeng 以 CATL
              高管身份出现。这支持这样一个判断：重大外部合作仍由母公司监督，而非完全由子公司独立推动。商业化方面，2026 年出现两个面向外部的里程碑：2 月与 Horizon Robotics 签署软硬件合作协议，4 月与
              Togg 签署底盘联合开发协议并于 5 月公布，首款 Togg 车型预计于 2027 年量产。同样重要的是，来源池没有显示董事会构成、委员会安排，也没有明确区分 CATL 层面与 CAIT 层面的决策权。
