      - number: '2.2'
        title: 受证据约束的规模与扩张视角
        blocks:
          - type: paragraph
            body: >-
              分配到的来源没有披露一体化智能底盘的 TAM、SAM 或 SOM 金额，因此本章采用商业化视角，而不是编造市场规模。最清晰的证明点是运营事实：CATL 表示 Bedrock 已于 2024
              年在中国实现量产。扩张证据进一步收敛到具体项目数量和地域：CAIT 与 Togg 的合作被描述为 Bedrock 首个海外乘用车项目，覆盖 3 款 B 级车型，目标市场为土耳其和欧洲，首款车型计划于 2027
              年量产。Gasgoo 还提供了另一种规模视角：报道一轮超过 CNY2 billion
              的融资，资金用于量产和下一代研发，并称公司在东南亚、中东和欧洲推进海外项目。这些都是有意义的采用指标，但仍不足以说明已披露的收入池、出货量，或从宣布合作到交付车辆的转化率。
