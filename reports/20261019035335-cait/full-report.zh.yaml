chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、所有权与平台范围
        blocks:
          - type: paragraph
            body: >-
              分配到的证据一致将 Contemporary Amperex Intelligent Technology (Shanghai) Limited（CAIT）定位为 CATL 的滑板式底盘业务，并在 2026 年
              2 月 Horizon 公告中确认其为 CATL 全资子公司。Gasgoo 将该业务的成立时间定为 2021 年，并将其描述为 CATL 进军智能底盘系统的战略动作。在官方发布和合作材料中，CAIT
              的核心产品均为 Bedrock
              Chassis：一个以电池为中心的一体化平台，把电池、电驱、热管理和底盘域控制层整合在一起。公司名称指向上海的法人注册地，但分配到的来源池没有单独发布公司概况或地址记录，因此总部只能视为方向性线索，尚未得到独立确认。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
