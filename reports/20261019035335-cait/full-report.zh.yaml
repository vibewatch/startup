      - number: '4.2'
        title: 定价与单位经济仍是核心披露缺口
        blocks:
          - type: paragraph
            body: >-
              该来源池最强的公开证据描述了产品架构、合作方角色和融资用途，但没有披露目录价、实际项目价格、工程费结构、毛利率、获客成本、回本周期或售后经济性。正确的解读不是这些指标很差，而是它们在本章审阅的公开记录中仍不可得。即使是证据更充分的商业化信号——中国量产、具名海外
              OEM 上市目标和 Horizon 集成协议——也无法回答 CAIT
              的收入主要来自硬件供应、工程服务、里程碑付款、软件打包，还是关联方安排。正因为缺少这层变现细节，本章将收入质量和利润率路径视为待解的投资判断问题，而不是已经解决的事实。
