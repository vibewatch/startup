      - number: '3.4'
        title: 当前护城河更多依赖 CATL 资源与项目胜出，而非外部证明
        blocks:
          - type: paragraph
            body: >-
              按今天的证据，CAIT 的竞争逻辑建立在架构集成、母公司支持的产能扩张，以及与 Togg、Horizon 等伙伴落地本地化旗舰项目的能力之上。这些信号很重要，因为它们让 CAIT
              难以与单一直接创业公司同行简单比较；公司试图占据底盘供应商、平台伙伴和生态集成商之间的系统位置。弱点在于，分配到的来源仍缺少独立定价、认证和并排性能基准。在这些证据出现之前，本章只能支持 CAIT
              具备战略定位优势，不能支持其相对于内部自建或模块化替代路径已经拥有经充分验证的持久护城河。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
