      - number: '1.3'
        title: 融资、规模与待解尽调问题
        blocks:
          - type: paragraph
            body: >-
              最清晰的独立规模数据点来自 Gasgoo 2025 年 10 月的报道：CAIT-SH 完成首轮外部融资，金额超过 RMB 2 billion，估值超过 RMB 10 billion，资金用于 Bedrock
              量产和下一代底盘研发。这轮融资证明外部资本认可，也给出了可识别的投资方名单；但分配到的来源仍未披露独立收入、收入运行率、毛利率、客户数、员工数或经核实的生产基地数量。因此，证据支持把 CAIT
              看作具有战略重要性但仍不透明的成长型子公司，而不是一家仅凭公开材料就能评估单位经济或转化速度的企业。来源池也没有保留独立的不利或监管记录，因此这里没有引用相关事件，不应解读为此类事件不存在。
