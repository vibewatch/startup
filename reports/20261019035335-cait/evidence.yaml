evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: CAIT board composition, committee structure, and separation of CATL-level versus CAIT-level decision rights.
    whyItMatters: >-
      Governance concentration affects minority protections, execution speed, and how much of CAIT's strategy is
      independent versus parent-directed.
    diligencePath: Obtain board materials, financing documents, and corporate registry filings.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Standalone revenue, gross margin, cash burn, customer count, and headcount.
    whyItMatters: >-
      These metrics are necessary to evaluate scale quality, unit economics, and whether valuation is supported by
      operating traction.
    diligencePath: Request audited subsidiary financials, management reporting packs, and lender or investor updates.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Exact post-round ownership, board rights, liquidation preferences, and any secondary share sales.
    whyItMatters: >-
      The financing headline does not reveal control terms, dilution, or how much outside investors can influence CAIT's
      strategy.
    diligencePath: Review the financing term sheet, cap table, and shareholder agreement.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-evidence
    missingEvidence: Independent adverse, legal, or regulatory evidence testing CAIT's execution, safety, or compliance claims.
    whyItMatters: A clean retained record in this worker pool is not proof that no disputes, recalls, or regulatory issues exist.
    diligencePath: Expand to court, regulator, recall, and enforcement records plus skeptical trade press with source-backed dates.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-size-disclosure
    missingEvidence: Independent TAM, SAM, or SOM sizing for integrated intelligent chassis or equivalent OEM platform spend.
    whyItMatters: >-
      Without an external spend baseline, valuation has to rely on program momentum and product logic rather than
      quantified addressable-market capture.
    diligencePath: >-
      Request third-party analyst coverage, OEM procurement benchmarks, or public-company disclosures that isolate
      skateboard or integrated-chassis spend.
  - type: private-evidence-only
    severity: material
    topic: commercial-terms
    missingEvidence: >-
      Program pricing, buyer budget ownership, contracted unit volumes, and conversion from partnership announcement to
      serial production.
    whyItMatters: >-
      Those items determine whether CAIT's market opportunity is large enough and monetized enough to justify scale
      assumptions.
    diligencePath: >-
      Request signed program economics, SOP schedules, and customer contract summaries from management or customers
      under NDA.
  - type: missing-source
    severity: material
    topic: overseas-regulatory-readiness
    missingEvidence: >-
      Independent evidence on homologation, safety validation, or regulatory gating for Bedrock deployments outside
      China.
    whyItMatters: >-
      Overseas rollout timing and risk cannot be underwritten confidently when public evidence stops at partnership
      announcements.
    diligencePath: >-
      Obtain homologation plans, regulator-facing test records, or independent engineering validation for the Togg and
      other overseas programs.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public or customer-verified price architecture, contract terms, and realized economics for Bedrock versus
      substitute chassis paths.
    whyItMatters: >-
      Pricing opacity prevents a source-backed comparison of switching cost, margin potential, and buyer value capture
      across alternatives.
    diligencePath: >-
      Request customer contracts, OEM procurement decks, or partner quotations that show program economics, discounting,
      and scope of included capabilities.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Program-level chassis pricing, engineering-fee structure, discounts, warranty reserves, and whether software or
      service revenue attaches to Bedrock deployments.
    whyItMatters: >-
      Without pricing mechanics, the chapter cannot judge revenue quality, realized ASP, or whether commercialization is
      hardware-heavy, services-heavy, or subsidized.
    diligencePath: Request exemplar customer contracts, pricing schedules, and booked-vs-recognized revenue by program.
    relatedQuestionRefs:
      - QI001
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Standalone revenue, gross margin, burn, cash on hand, runway, and customer concentration for CAIT as a business
      unit.
    whyItMatters: >-
      These metrics determine whether CAIT can finance growth from operations or remains dependent on future parent or
      external capital.
    diligencePath: Obtain monthly management accounts, margin bridge, cash-flow statement, debt schedule, and top-customer exposure.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: program-conversion
    missingEvidence: >-
      Conversion from signed cooperation agreements to shipped vehicle volumes, after-sales obligations, and replacement
      or repair economics.
    whyItMatters: >-
      Named partnerships prove interest, but not whether programs scale into durable production revenue or create costly
      field-service exposure.
    diligencePath: >-
      Request program pipeline by stage, SOP dates, cumulative shipments, warranty claims, and after-sales
      responsibility matrix.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Post-round ownership, investor rights, intercompany transfer-pricing mechanics with CATL, and any debt or
      project-finance obligations linked to Bedrock scale-up.
    whyItMatters: >-
      Capital support is disclosed only at a headline level, so investors cannot tell how much of CAIT's future
      economics are economically attributable to minority investors.
    diligencePath: >-
      Review financing documents, shareholder agreement, board rights, related-party agreements, and any project-level
      financing facilities.
    relatedQuestionRefs:
      - QI002
      - QI006
  - type: missing-source
    severity: material
    topic: safety-compliance-controls
    missingEvidence: >-
      Public homologation, functional-safety, cybersecurity, privacy, quality-control, or certification documents for
