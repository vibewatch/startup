company:
  name: "CAIT"
chapter:
  number: 6
  title: "Customers"
  summary: "CAIT's public customer proof is strongest at the strategic-program level rather than the recurring-revenue level. The 2026 Togg program and the 2026 Horizon partnership show real OEM and ecosystem engagement, but the assigned evidence pool still lacks customer counts, retention metrics, and disclosed concentration data."
sections:
  - id: "customer-base-and-segmentation"
    title: "Customer base is concentrated in OEM and ecosystem counterparties"
    body: >-
      The assigned 2025-2026 evidence points to CAIT selling an integrated chassis
      platform into automaker programs and adjacent vehicle-technology partnerships,
      not into a broad base of publicly documented end customers. The clearest named
      counterparties in this pool are Togg, which is co-developing a B-segment EV
      chassis platform, and Horizon Robotics, which signed a strategic cooperation
      agreement around intelligent-vehicle capabilities for global OEM customers.
      That supports a segmentation frame of OEM buyer, end-user rider/driver, and
      technology-partner ecosystem rather than diversified public proof across
      fleets, distributors, or many named brands.
    claimRefs: [CU001, CU002, CU008]
    tableRefs: [TU001]
  - id: "adoption-proof-and-program-stage"
    title: "Adoption proof is real but still mostly pre-production"
    body: >-
      The strongest customer proof in the pool is the Togg program, because it
      names the counterparty, the intended geography, the scope of the program, and
      the expected launch timing. Multiple sources describe it as the first overseas
      passenger-vehicle project for Bedrock Chassis, covering three B-segment models
      for Turkey and Europe, with the first model expected to reach mass production
      in 2027. That is meaningful commercial validation, but it remains forward
      looking: the public record here still shows a signed development program
      rather than disclosed production volumes, active deployments, or repeat orders.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: "durability-expansion-and-concentration"
    title: "Durability and concentration remain the main analytical gap"
    body: >-
      CAIT can point to international expansion signals, but the pool does not yet
      prove customer durability. Gasgoo says CAIT has a broad collaboration network
      and overseas projects in Southeast Asia, the Middle East, and Europe, yet the
      same evidence set does not disclose active-customer count, retention, renewal,
      churn, NRR, GRR, contract duration, or revenue concentration. Because the
      named public proof here is largely limited to Togg and Horizon, the present
      underwriting question is less "is there interest?" and more "how many
      customer programs convert into repeated production revenue, and how dependent
      is CAIT on a small number of flagship relationships?"
    claimRefs: [CU008, CU009, CU010]
  - id: "evidence-quality-and-diligence-path"
    title: "Some visible customer evidence is syndicated or paid distribution"
    body: >-
      Evidence quality is another constraint. One assigned Yahoo Finance page
      explicitly labels the Togg item as a paid press release, and Thailand Business
      News says its version was produced by Cision PR Newswire and may not reflect
      the outlet's own opinions. Those pages are still useful for preserving the
      company-issued text, but they should not be treated as independent customer
      validation. For diligence, that means the next-value evidence is not another
      republished partnership announcement; it is customer-specific proof of live
      deployments, shipment cadence, contract economics, and referenceable renewal
      behavior from named OEM programs.
    claimRefs: [CU011, CU012]
callouts:
  - calloutType: "insight"
    title: "Best proof is strategic-program depth, not scale"
    body: "The Togg relationship is more substantive than a logo because it includes co-development scope, geography, model count, and timing, but it still does not prove shipped scale or retention."
    claimRefs: [CU003, CU004, CU005, CU006]
  - calloutType: "risk"
    title: "Customer concentration cannot be sized from public evidence"
    body: "The assigned pool names only a small set of counterparties and gives no disclosed customer-count, renewal, or concentration metric, so customer-quality risk remains a core diligence item."
    claimRefs: [CU009, CU010, CU011, CU012]
