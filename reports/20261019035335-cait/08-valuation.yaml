  evidenceGaps:
    - type: missing-source
      severity: material
      topic: standalone-economics
      missingEvidence: Standalone CAIT revenue, gross margin, cash burn, and working-capital disclosure by year or quarter.
      whyItMatters: Without operating economics, the latest public valuation mark cannot be tested against execution quality or downside protection.
      diligencePath: Request audited or management-certified standalone financials tied to the latest financing round and current backlog assumptions.
      relatedQuestionRefs: [QV007]
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-governance
      missingEvidence: Post-round ownership, board rights, liquidation preference, intercompany IP terms, and any transfer-pricing arrangements with CATL.
      whyItMatters: These terms can materially change effective entry price, minority protection, and exit value even if the headline valuation is accurate.
      diligencePath: Obtain the latest term sheet, shareholder agreement, board composition, and related-party agreements before underwriting any entry.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: customer-conversion
      missingEvidence: Program-by-program pipeline, contracted volumes, and milestone gating from announced partnerships into serial production.
      whyItMatters: The latest valuation can hold only if named platform programs convert into repeatable revenue and production ramp, not only promotional partnerships.
      diligencePath: Ask management for signed program schedules, customer concentration, SOP timing, and evidence of volume ramp beyond the first Togg launch.
