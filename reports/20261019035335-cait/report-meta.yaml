  topStrengths:
    - CATL parent backing and a wholly owned subsidiary structure support execution credibility.
    - Bedrock has a real commercialization track record in China and a named overseas OEM program with Togg.
    - The latest disclosed financing round above RMB 2 billion suggests investor appetite for the platform.
  topRisks:
    - Standalone revenue, gross margin, burn, and pricing mechanics remain undisclosed.
    - The Togg launch is still forward-looking, with first mass production only expected in 2027.
    - Governance, transfer-pricing, and CATL dependence remain opaque.
    - The retained pool still lacks independent adverse or regulatory evidence on execution, safety, or compliance.
  unresolvedGaps:
    - Standalone CAIT revenue, gross margin, and cash-burn disclosure
    - Program-by-program conversion from signed cooperation to scaled production shipments
    - Exact post-round ownership, board rights, and CATL intercompany IP or transfer-pricing mechanics
    - Verified headcount, manufacturing footprint, and after-sales / repair responsibility model
    - Independent validation of Bedrock safety, homologation, and overseas compliance readiness
