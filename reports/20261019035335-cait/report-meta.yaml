companyProfile:
  summary: >-
    CAIT is CATL's dedicated intelligent-chassis subsidiary, centered on the Bedrock Chassis platform and positioned as
    a B2B OEM partner for integrated vehicle-platform programs. Public evidence shows a 2024 China mass-production
    milestone, a 2026 Horizon cooperation on intelligent-driving integration, and a first overseas passenger-vehicle
    program with Togg targeting 2027 mass production, but it does not yet disclose standalone revenue, margin, or
    governance detail.
