    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: CAIT board composition, committee structure, and separation of CATL-level versus CAIT-level decision rights.
      whyItMatters: Governance concentration affects minority protections, execution speed, and how much of CAIT's strategy is independent versus parent-directed.
      diligencePath: Obtain board materials, financing documents, and corporate registry filings.
      relatedQuestionRefs: [QO003, QO008]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Standalone revenue, gross margin, cash burn, customer count, and headcount.
      whyItMatters: These metrics are necessary to evaluate scale quality, unit economics, and whether valuation is supported by operating traction.
      diligencePath: Request audited subsidiary financials, management reporting packs, and lender or investor updates.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: ownership
      missingEvidence: Exact post-round ownership, board rights, liquidation preferences, and any secondary share sales.
      whyItMatters: The financing headline does not reveal control terms, dilution, or how much outside investors can influence CAIT's strategy.
      diligencePath: Review the financing term sheet, cap table, and shareholder agreement.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO003]
