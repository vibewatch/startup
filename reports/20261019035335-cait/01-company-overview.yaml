    rows:
      - ["Hanbing Yang", "CAIT CEO", "Named as CAIT CEO in the official Togg release, the PRNewswire release, and Automotive World coverage.", "Operational face of CAIT's external OEM partnerships; strongest named executive signal in the assigned pool.", "High: signatory on flagship outbound partnership."]
      - ["Robin Zeng", "CATL Chairman & CEO", "Present as witness in the Togg signing materials and quoted on Bedrock's global expansion.", "Signals parent-level sponsorship and strategic oversight over CAIT's platform rollout.", "Medium: parent endorsement matters, but day-to-day CAIT operating role is not described."]
      - ["Libin Tan", "CATL Chief Customer Officer / Co-President of Sales & Marketing", "Named CATL commercial executive in the Togg signing materials.", "Commercial bridge between CATL and external OEM counterparties during CAIT's platform expansion.", "Medium: partnership execution appears to rely on CATL commercial infrastructure."]
    notes: >-
      The assigned pool does not disclose CAIT founders, board composition, or
      executive biographies beyond named titles in announcement materials.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to leaders explicitly named in the assigned 2025-2026 source
        pool rather than an exhaustive management roster.
    claimRefs: [CO011, CO014, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - [CATL, "Parent company", "Owns CAIT outright per the Horizon release and provides the corporate umbrella for Bedrock expansion.", "Confirm post-financing ownership, transfer-pricing, and IP licensing boundaries."]
      - [Togg, "OEM development partner", "First disclosed overseas passenger-vehicle project; three-model program and 2027 SOP create a visible commercialization milestone.", "Request program economics, exclusivity terms, and SOP gating milestones."]
      - [Horizon Robotics, "Intelligence-stack partner", "Adds ADAS and cross-domain software-hardware integration to CAIT's platform proposition.", "Clarify revenue split, reference architecture ownership, and commercialization scope."]
      - ["2025 financing syndicate", "External capital providers", "Gasgoo names Boyu Capital, Guotai Haitong Securities, BAIC Industrial Investment, Shanghai STVC, Fortera Capital, and others as backers in the first external round.", "Obtain term sheet, board rights, liquidation preferences, and use-of-proceeds reporting."]
      - [AVATR, "Early OEM validation", "CATL says AVATR was the first automaker to use Bedrock and signed deeper cooperation at launch.", "Verify actual deployment scope, volume, and whether revenue is production or pilot-stage."]
    notes: >-
      This map combines control stakeholders and disclosed ecosystem
      participants; it is not a cap table and does not imply equal economic
      weight across rows.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to stakeholders and investors explicitly named in the assigned
        public source pool; undisclosed board members and other investors may
        exist.
    claimRefs: [CO001, CO005, CO006, CO007, CO008, CO012, CO013]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained evidence shows a progression from 2021 formation to 2024
      China production, 2025 financing, and 2026 strategic partnerships aimed
      at international commercialization.
    data:
      items:
        - year: 2021
          label: CAIT founded
          detail: Gasgoo reports that CAIT-SH was founded in 2021 as CATL's strategic entry into intelligent chassis.
          claimRefs: [CO004]
        - year: 2024
          label: China mass production begins
          detail: Official partnership materials say Bedrock achieved mass production in the Chinese market in 2024.
          claimRefs: [CO006]
        - year: 2024
          label: AVATR deepens cooperation at launch
          detail: At the Bedrock launch ceremony, CATL said AVATR was the first automaker to use the chassis and signed deeper cooperation with CAIT-SH.
          claimRefs: [CO009]
        - date: "2025-10-11"
          label: First external financing round disclosed
          detail: Gasgoo reported a first external round above RMB 2 billion at a valuation above RMB 10 billion.
          claimRefs: [CO005]
        - date: "2026-02-09"
          label: Horizon agreement signed
          detail: CAIT and Horizon Robotics signed a strategic cooperation agreement around intelligent vehicle upgrades.
          claimRefs: [CO012]
        - date: "2026-04-29"
          label: Togg agreement signed
          detail: CAIT and Togg signed a strategic partnership to co-develop a chassis platform for three B-segment models.
          claimRefs: [CO013]
        - date: "2026-05-07"
          label: Togg partnership announced publicly
          detail: CATL and syndicated release channels published the overseas Bedrock project as CAIT's first disclosed passenger-vehicle program outside China.
          claimRefs: [CO001, CO013]
        - year: 2027
          label: First Togg model targeted for mass production
          detail: The Togg partnership materials say the first model under the program is expected to enter mass production in 2027.
          claimRefs: [CO014]
    approximationNotes: null
    claimRefs: [CO004, CO005, CO006, CO009, CO012, CO013, CO014]
