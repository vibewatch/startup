schemaVersion: report-v2
artifact: company-overview
slug: cait
runDate: 2026-10-19
company:
  name: CAIT
chapter:
  number: 1
  title: Company Overview
  summary: >-
    CAIT is evidenced as CATL's dedicated intelligent-chassis subsidiary with a
    2024 China mass-production milestone for Bedrock, a first disclosed
    external financing round above RMB 2 billion at valuation above RMB 10
    billion, and 2026 strategic integrations with Horizon and Togg. The current
    pool is stronger on identity, product scope, and milestone cadence than on
    standalone revenue, customer conversion, headcount, or formal governance,
    so later chapters should reuse this chapter for identity but continue to
    test operating scale independently.
sections:
  - id: identity-platform
    title: Identity, ownership, and platform scope
    body: >-
      The assigned evidence consistently identifies Contemporary Amperex
      Intelligent Technology (Shanghai) Limited (CAIT) as CATL's skateboard
      chassis arm and, in the February 2026 Horizon release, as a wholly owned
      CATL subsidiary. Gasgoo places the business's founding in 2021 and frames
      it as CATL's strategic push into intelligent chassis systems. Across the
      official launch and partnership materials, CAIT's core product is the
      Bedrock Chassis: an integrated, battery-centric platform combining the
      battery, electric drive, thermal management, and chassis-domain control
      layers. The company name points to a Shanghai legal base, but the
      assigned source pool does not separately publish a corporate profile or
      address record, so headquarters should be treated as directionally
      indicated rather than independently confirmed.
    claimRefs: [CO001, CO002, CO003, CO010]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-governance-commercialization
    title: Leadership, governance, and commercialization milestones
    body: >-
      Public leadership evidence is narrow but usable. Hanbing Yang is named as
      CAIT's CEO in the Togg announcement stream, while Libin Tan and Robin
      Zeng appear in senior CATL roles around the same signing, which supports
      the view that major external partnerships are still parent-supervised
      rather than fully independent subsidiary actions. Commercially, 2026
      marked two outward-facing milestones: a software-hardware cooperation
      agreement with Horizon Robotics in February and a chassis co-development
      agreement with Togg signed in April and announced in May, with mass
      production for the first Togg model expected in 2027. What the pool does
      not show is equally important: no board composition, no disclosed
      committee structure, and no explicit separation between CATL-level and
      CAIT-level decision rights.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO002]
  - id: funding-scale-and-open-questions
    title: Funding, scale, and open diligence questions
    body: >-
      The clearest independent scale datapoint is the October 2025 Gasgoo
      report that CAIT-SH completed its first external financing round for more
      than RMB 2 billion at a valuation above RMB 10 billion, with proceeds
      directed toward Bedrock mass production and next-generation chassis R&D.
      That financing confirms outside capital validation and identifies a
      recognizable investor set, but the assigned sources still do not disclose
      standalone revenue, run-rate, gross margin, customer count, headcount, or
      a verified manufacturing-footprint count. The evidence therefore supports
      CAIT as a strategically important, still-opaque growth subsidiary rather
      than a business whose unit economics or conversion velocity can yet be
      underwritten from public materials alone. The source pool also lacks a
      retained independent adverse or regulatory record, so absence of a cited
      incident here should not be read as proof of absence.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO003]
