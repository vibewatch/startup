      - ["Chassis domain controller and motion control", "Coordinates vehicle energy and motion control", "Depends on software validation and safety-case maturity", "No public cybersecurity, functional-safety, or incident-reporting artifacts in retained sources"]
      - ["Upper-body / digital architecture and ADAS partner layer", "Lets OEMs and partners shape UX, product requirements, and intelligent-driving features above the chassis", "Depends on OEM integration quality and Horizon's software-controller stack", "No public interface specification, deployment telemetry, or named launch vehicle"]
    notes: "Architecture layers are synthesized from official and independent descriptions of the Bedrock and Horizon programs, not from public technical documentation."
    claimRefs: [CE002, CE003, CE004, CE005, CE012]
