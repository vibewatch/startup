chapter:
  number: 5
  title: "Product & Technology"
  summary: "CAIT's public product evidence centers on Bedrock, an integrated EV chassis platform that combines battery, drive, thermal, and domain-control subsystems and is now tied to named Horizon and Togg programs. The strongest maturity signals are the company-reported 2024 China rollout and a 2027 overseas Togg target, but public diligence still lacks independent evidence on certification, reliability, cybersecurity, and after-sales execution."
sections:
  - id: "integrated-platform-and-live-programs"
    title: "Integrated platform, not a loose component set"
    body: "Public sources consistently describe CAIT as CATL's intelligent chassis subsidiary and Bedrock as the core product sold into an OEM development workflow rather than to end consumers. The commercial pattern in the retained evidence is a platform-plus-engineering offer: CAIT supplies the lower-body architecture, integration expertise, and localization model, while the automaker shapes product requirements, digital architecture, and user experience. The named Togg partnership matters because it moves the story beyond abstract marketing copy to a disclosed three-model passenger-vehicle program with a 2027 production target. Even so, the evidence base is still announcement-heavy, so CAIT looks more like an OEM platform program in rollout than a broadly evidenced, multi-program production franchise."
    claimRefs: [CE001, CE006, CE007, CE009, CE010, CE013]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-operating-model"
    title: "Battery-centric architecture and partner-dependent operating model"
    body: "The product narrative is technically specific enough to avoid being just a generic 'EV platform' pitch. Across official and independent sources, Bedrock is described as a battery-centric chassis that integrates the battery pack, electric drive, thermal management, and chassis domain control into one platform, with CAIT positioning that integration as a way to coordinate both energy and motion control. CATL's Horizon announcement extends the architecture upward: CAIT supplies the chassis and underlying platform while Horizon contributes driver-assistance software, controllers, and integration capability, implying that CAIT's operating model depends on external software and OEM partners to complete the delivered stack. The architecture is therefore differentiated by integration depth and by decoupling the upper body from the chassis, but deployment remains partner-shaped rather than fully standardized."
    claimRefs: [CE002, CE003, CE004, CE005, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-differentiation-and-control-gaps"
    title: "Maturity signals are real, but control evidence is still thin"
    body: "CAIT has more maturity evidence than a pre-product concept: public sources say Bedrock entered mass production in China in 2024, the company has raised dedicated capital for mass-production and next-generation chassis R&D, and overseas expansion is framed around repeatable localization rather than one-off engineering services. Those are meaningful signals for product seriousness and parent-backed execution. The weak point is that the retained public record proves architecture and partnership momentum better than reliability, certification, safety case, cybersecurity posture, or after-sales responsibility. No retained source provides homologation artifacts, public uptime or incident telemetry, developer documentation, or concrete service metrics. For diligence, that means the technology story is credible at the system-design level, but still under-documented at the operating-control level."
    claimRefs: [CE008, CE009, CE010, CE011, CE013]
