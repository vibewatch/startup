      - number: '5.2'
        title: Battery-centric architecture and partner-dependent operating model
        blocks:
          - type: paragraph
            body: >-
              The product narrative is technically specific enough to avoid being just a generic 'EV platform' pitch.
              Across official and independent sources, Bedrock is described as a battery-centric chassis that integrates
              the battery pack, electric drive, thermal management, and chassis domain control into one platform, with
              CAIT positioning that integration as a way to coordinate both energy and motion control. CATL's Horizon
              announcement extends the architecture upward: CAIT supplies the chassis and underlying platform while
              Horizon contributes driver-assistance software, controllers, and integration capability, implying that
              CAIT's operating model depends on external software and OEM partners to complete the delivered stack. The
              architecture is therefore differentiated by integration depth and by decoupling the upper body from the
              chassis, but deployment remains partner-shaped rather than fully standardized.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
