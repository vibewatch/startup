      - number: '6.3'
        title: Durability and concentration remain the main analytical gap
        blocks:
          - type: paragraph
            body: >-
              CAIT can point to international expansion signals, but the pool does not yet prove customer durability.
              Gasgoo says CAIT has a broad collaboration network and overseas projects in Southeast Asia, the Middle
              East, and Europe, yet the same evidence set does not disclose active-customer count, retention, renewal,
              churn, NRR, GRR, contract duration, or revenue concentration. Because the named public proof here is
              largely limited to Togg and Horizon, the present underwriting question is less "is there interest?" and
              more "how many customer programs convert into repeated production revenue, and how dependent is CAIT on a
              small number of flagship relationships?"
