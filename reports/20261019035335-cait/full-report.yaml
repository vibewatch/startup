        title: Differentiation centers on integration depth and ecosystem fit
        blocks:
          - type: paragraph
            body: >-
              Bedrock's main disclosed differentiator is the degree of chassis integration. Across the retained official
              and syndicated materials, the platform is consistently described as combining the battery, electric drive,
              thermal management, and chassis domain controller in one architecture. The Horizon agreement adds a second
              layer to the positioning story: CAIT is not claiming to own the entire intelligent-driving stack, but
              instead pairs its chassis with a scaled ADAS supplier whose products already ship broadly. That improves
              go-to-market credibility, yet it also suggests that CAIT's offer is strongest when embedded in a partner
              ecosystem rather than sold as a complete self-contained autonomy platform.
