  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Recommendation stays at track because platform and customer evidence are real, but financial underwriting support
      remains shallow.
    data:
      nodes:
        - label: Product / platform proof
          detail: CIIC production-base planning and the integrated Bedrock architecture show a real operating platform.
        - label: Customer / rollout proof
          detail: Togg is a named overseas passenger-vehicle program, but first mass production is still targeted for 2027.
        - label: Sponsor dependence
          detail: >-
            CATL parent sponsorship still carries much of the credibility load for manufacturing, signaling, and market
            access.
        - label: Valuation support gap
          detail: >-
            Public evidence shows a >RMB 10 billion financing mark but not standalone revenue, margins, burn, or
            cap-table terms.
        - label: Diligence hurdle
          detail: >-
            A buy case needs cap-table, economics, and customer-conversion proof that the retained public sources do not
            yet provide.
        - label: Recommendation
          detail: Track or invest only with better price discipline, diligence rights, and milestone proof.
      edges:
        - from: Product / platform proof
          to: Customer / rollout proof
          label: Technology credibility enables customer adoption
        - from: Customer / rollout proof
          to: Valuation support gap
          label: Commercial narrative still runs ahead of economics
        - from: Valuation support gap
          to: Recommendation
          label: Thin underwriting support keeps the call cautious
    approximationNotes: >-
      This is a logic chain rather than a weighted scoring model; it reflects the retained evidence set, not an implied
      probability formula.
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV010
      - CV012
