      - number: '5.3'
        title: Maturity signals are real, but control evidence is still thin
        blocks:
          - type: paragraph
            body: >-
              CAIT has more maturity evidence than a pre-product concept: public sources say Bedrock entered mass
              production in China in 2024, the company has raised dedicated capital for mass-production and
              next-generation chassis R&D, and overseas expansion is framed around repeatable localization rather than
              one-off engineering services. Those are meaningful signals for product seriousness and parent-backed
              execution. The weak point is that the retained public record proves architecture and partnership momentum
              better than reliability, certification, safety case, cybersecurity posture, or after-sales responsibility.
              No retained source provides homologation artifacts, public uptime or incident telemetry, developer
              documentation, or concrete service metrics. For diligence, that means the technology story is credible at
              the system-design level, but still under-documented at the operating-control level.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
