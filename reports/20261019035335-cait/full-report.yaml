  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape still looks more partner-led than peer-benchmarked
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows CAIT competing at the vehicle-architecture layer rather than as a simple
              component vendor. CATL describes CAIT as a wholly owned subsidiary built around the Bedrock Chassis, while
              both company-issued and syndicated rollout materials frame Bedrock as a standalone integrated chassis for
              passenger-vehicle brands. That framing implies the core competitive set includes internal OEM integration
              and multi-supplier module assembly, even though the assigned pool does not surface named third-party
              chassis rivals with source-backed feature or pricing data. The strongest public proof point is the Togg
              program: it shows overseas traction, but it also shows that CAIT currently enters programs through deep
              co-development rather than a standardized off-the-shelf offer.
            claimRefs:
