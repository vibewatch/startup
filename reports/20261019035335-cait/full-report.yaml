      - number: '1.2'
        title: Leadership, governance, and commercialization milestones
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is narrow but usable. Hanbing Yang is named as CAIT's CEO in the Togg
              announcement stream, while Libin Tan and Robin Zeng appear in senior CATL roles around the same signing,
              which supports the view that major external partnerships are still parent-supervised rather than fully
              independent subsidiary actions. Commercially, 2026 marked two outward-facing milestones: a
              software-hardware cooperation agreement with Horizon Robotics in February and a chassis co-development
              agreement with Togg signed in April and announced in May, with mass production for the first Togg model
              expected in 2027. What the pool does not show is equally important: no board composition, no disclosed
              committee structure, and no explicit separation between CATL-level and CAIT-level decision rights.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO011
              - CO014
