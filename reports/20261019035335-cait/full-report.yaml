      - number: '3.4'
        title: Current moat case depends more on CATL access and program wins than on external proof
        blocks:
          - type: paragraph
            body: >-
              On today's evidence, CAIT's competitive case rests on architecture integration, parent-backed
              manufacturing scale-up, and the ability to land localized flagship programs with partners such as Togg and
              Horizon. Those are meaningful signals because they make CAIT harder to compare to a single direct startup
              peer; the company is trying to occupy a systems position between chassis supplier, platform partner, and
              ecosystem integrator. The weakness is that the assigned pool still lacks independent pricing,
              homologation, and side-by-side performance benchmarks. Until those appear, the chapter supports a view
              that CAIT has strategic positioning advantages, but not a fully verified durable moat over internal build
              or modular substitute paths.
