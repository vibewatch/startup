              Evidence quality is another constraint. One assigned Yahoo Finance page explicitly labels the Togg item as
              a paid press release, and Thailand Business News says its version was produced by Cision PR Newswire and
              may not reflect the outlet's own opinions. Those pages are still useful for preserving the company-issued
              text, but they should not be treated as independent customer validation. For diligence, that means the
              next-value evidence is not another republished partnership announcement; it is customer-specific proof of
              live deployments, shipment cadence, contract economics, and referenceable renewal behavior from named OEM
              programs.
            claimRefs:
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Best proof is strategic-program depth, not scale
            body: >-
              The Togg relationship is more substantive than a logo because it includes co-development scope, geography,
              model count, and timing, but it still does not prove shipped scale or retention.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Customer concentration cannot be sized from public evidence
            body: >-
              The assigned pool names only a small set of counterparties and gives no disclosed customer-count, renewal,
              or concentration metric, so customer-quality risk remains a core diligence item.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a commercialization story that is still early, concentrated, and
              partner-led rather than broadly proven in market. Multiple sources describe the Togg program as CAIT's
              first overseas passenger-vehicle project, with the first model only expected to reach mass production in
              2027, so the company is still converting an announced strategic partnership into a live reference
              deployment rather than showing repeatable international shipments. That timing matters because CATL and
              Togg both describe the relationship as deeper than a standard supplier contract: CAIT supplies the Bedrock
              platform and engineering expertise while Togg shapes product requirements and digital architecture. This
              creates a plausible upside path, but it also means delays, integration mistakes, or a scope change by one
              partner can weaken CAIT's main public proof point for overseas expansion.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and liability readiness is still under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The current source set is strong enough to confirm the ambition and structure of the Turkey program, but
              it is weak on the legal and operating details that matter most for underwriting launch risk. The retained
              sources say the platform is aimed at Turkish and European markets and that CAIT is using a 1+1+1
              localization model, yet none of the cited materials disclose who owns homologation milestones, warranty
              reserves, recall liability, repair obligations, or cyber/compliance accountability once the Bedrock
              chassis is embedded in customer vehicles. That does not prove the company lacks those controls, but it
              does mean the assigned evidence supports a diligence conclusion of unresolved legal and regulatory
              exposure rather than a conclusion of readiness.
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR010
      - number: '7.3'
        title: Operational scaling risk remains high because the product promise is system-level
        blocks:
          - type: paragraph
            body: >-
              Bedrock is not a narrow component story. The product is described as integrating the battery, electric
              drive, thermal management, and chassis domain controller into one platform, and CATL's own positioning
              emphasizes software-hardware coordination and localized supply-chain execution. That integration can be a
              moat if it works, but it also raises the severity of any launch slip or quality issue because one failure
              mode can cascade across core vehicle systems. Gasgoo reports that CAIT raised more than 2 billion yuan to
              support mass production and next-generation R&D, which is consistent with a capital-intensive
              industrialization path rather than a light-software rollout. The available evidence does not include
              public field-reliability metrics, warranty data, or defect-history disclosures, so the prudent read is
              that mitigation maturity is still emerging.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Partner and capital dependence are the main thesis-break channels
        blocks:
          - type: paragraph
            body: >-
              CAIT's current public proof set depends heavily on counterparties. Togg is the named overseas
              passenger-vehicle launch partner, Horizon is the disclosed intelligent-driving collaborator, and CATL
              remains the parent ecosystem supplying industrial credibility, product architecture, and strategic
              direction. That mix can accelerate market access, but it also means CAIT has several external failure
              points before the business looks independently repeatable: OEM program delays, partner-roadmap
              misalignment, and the possibility that capital needs stay high until multiple platforms ship at scale.
              Gasgoo's funding report is encouraging, but one disclosed financing round does not answer how much working
              capital, warranty support, or customer-specific engineering spend CAIT may need if multiple overseas
              programs move from announcement to SOP at the same time.
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              If CAIT cannot show documented homologation ownership, warranty allocation, and a credible path to the
              Togg 2027 SOP window before investment underwriting, the current overseas reference case should be treated
              as strategic intent rather than bankable commercial proof.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR010
          - type: callout
            title: Mitigation quality is real but still partner-mediated
            body: >-
              The best visible mitigants are CATL parent backing, Horizon's scaled ADAS footprint, and Togg's
              willingness to co-develop instead of merely procure, but each mitigant also increases dependence on
              third-party execution rather than proving a fully stand-alone CAIT operating model.
            calloutType: insight
            claimRefs:
              - CR003
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The retained valuation evidence is good enough to say CAIT is strategically credible, but not good enough
              to underwrite the latest public price reference aggressively. Gasgoo reported a first external financing
              round above RMB 2 billion at a valuation above RMB 10 billion, which confirms outside investor interest
              and gives a fresh reference point. At the same time, the assigned pool still does not disclose standalone
              revenue, gross margin, cash burn, post-round ownership, or preference terms. That makes the price signal
              real but thinly supported. The cleanest public call is therefore to track the asset or require strong
              price protection and diligence rights rather than paying through the last disclosed mark on strategic
              narrative alone.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV010
              - CV012
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The long case rests on three pieces of evidence that do appear in the pool: CAIT is a CATL-backed
              operating vehicle with a dedicated CIIC production-base plan, it has a technically differentiated
              battery-centric chassis architecture, and it has at least one named overseas passenger-vehicle program
              with Togg. Those points matter because they imply product legitimacy, parent sponsorship, and a pathway to
              broader international customer conversion. The anti-thesis is equally important: much of the evidence is
              company-issued or syndicated company-issued content, the named overseas program still points to a 2027 SOP
              rather than shipped volume today, and the public record does not yet disclose the economic proof points
              that would justify treating CAIT as a de-risked growth business instead of a promising but still
              sponsor-dependent platform bet. Yahoo Finance's explicit labeling of one syndicated Togg item as a paid
              press release further limits the corroborative weight of repeated distribution.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Scenario framing should stay relative to the latest disclosed mark because the pool offers only one
              explicit valuation datapoint. A bull case needs more than technology credibility: it needs visible
              conversion from platform demonstrations into named production programs, on-time Togg execution, and
              disclosure that standalone economics can support scale. A base case keeps CAIT near the latest mark only
              if commercialization continues without governance surprises and with improving financial transparency. A
              bear case is straightforward: if the 2027 overseas launch slips, if customer conversion stays largely
              promotional, or if parent dependence masks weak standalone economics, the next financing could clear below
              current expectations. Exit readiness is therefore limited today by evidence depth rather than by lack of
              strategic narrative.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final diligence agenda is mostly about replacing narrative proof with underwriting proof. Before
              moving from track to invest, an investor should ask for standalone revenue and gross-margin disclosure,
              program-level production ramp assumptions, customer concentration, post-round ownership, any liquidation
              or structured preference terms, and evidence that the CATL relationship helps rather than obscures
              transfer pricing and governance. The thesis breaks if CAIT cannot show that its first external round
              funded real scale-up rather than a long pre-revenue build, if the Togg timetable weakens without
              offsetting customer wins, or if parent sponsorship remains the main reason the valuation can hold. Those
              are measurable diligence gates, not stylistic concerns.
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track unless price and proof improve
            body: >-
              CAIT has credible platform and customer signals, but the retained public evidence still supports a track /
              research-more call unless entry terms compensate for missing standalone economics and cap-table
              visibility.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV012
          - type: callout
            title: Latest public valuation support is thin
            body: >-
              The strongest public price anchor in this pool is one October 2025 report of a first external round above
              RMB 2 billion at a valuation above RMB 10 billion; the rest of the pool mainly corroborates strategic and
              commercialization narrative rather than financial underwriting.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV010
              - CV011
