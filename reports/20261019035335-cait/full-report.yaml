  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visible in structure, not yet in recognized revenue
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a B2B OEM-platform revenue model centered on Bedrock chassis programs,
              associated engineering work, and adjacent integration revenue rather than a disclosed software-SaaS
              profile. CAIT and its partners repeatedly frame commercialization around named vehicle programs, localized
              supply-chain deployment, and chassis-plus-intelligence integration, which is consistent with program-based
              automotive revenue but not with publicly disclosed recurring metrics. Public traction is milestone-heavy:
              Gasgoo reported that Bedrock mass production began in 2024, while multiple Togg-related sources frame the
              first named overseas passenger-vehicle program as a three-model family targeting first mass production in
              2027. That is useful evidence that commercial deployment exists, but it is not evidence of current revenue
              scale, realized take rate, or gross profit conversion.
