      - number: '1.3'
        title: Funding, scale, and open diligence questions
        blocks:
          - type: paragraph
            body: >-
              The clearest independent scale datapoint is the October 2025 Gasgoo report that CAIT-SH completed its
              first external financing round for more than RMB 2 billion at a valuation above RMB 10 billion, with
              proceeds directed toward Bedrock mass production and next-generation chassis R&D. That financing confirms
              outside capital validation and identifies a recognizable investor set, but the assigned sources still do
              not disclose standalone revenue, run-rate, gross margin, customer count, headcount, or a verified
              manufacturing-footprint count. The evidence therefore supports CAIT as a strategically important,
              still-opaque growth subsidiary rather than a business whose unit economics or conversion velocity can yet
              be underwritten from public materials alone. The source pool also lacks a retained independent adverse or
              regulatory record, so absence of a cited incident here should not be read as proof of absence.
            claimRefs:
