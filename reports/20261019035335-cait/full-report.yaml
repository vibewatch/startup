  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute set
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool supports a specific market definition rather than a broad electric-vehicle
              infrastructure claim. CAIT's Bedrock Chassis is described as an integrated intelligent chassis that
              combines battery, electric drive, thermal management, and chassis control into one platform, so the
              included spend is platform-level chassis integration, associated engineering services, and adjacent
              software-hardware integration where that chassis is the anchor. The evidence does not support including
              CATL's entire battery business, finished-vehicle revenue, or generic EV component spend. The status-quo
              substitute is also narrow: automakers can keep integrating those systems through in-house engineering and
              multiple suppliers instead of adopting a pre-integrated skateboard architecture.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
