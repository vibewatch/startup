        - from: industrialization
          to: revenue-recognition
          label: Operational deployment should convert into revenue, but public terms are missing
        - from: revenue-recognition
          to: gross-profit
          label: Undisclosed pricing and cost structure prevent margin underwriting
        - from: capital-support
          to: industrialization
          label: Fresh funding is earmarked for scale-up and next-generation development
    approximationNotes: >-
      This figure maps a source-backed commercialization sequence; it does not estimate undisclosed revenue, take rate,
