      - number: '2.3'
        title: Buyer map, adoption drivers, and gating constraints
        blocks:
          - type: paragraph
            body: >-
              The named counterparties imply that CAIT sells into OEM platform decisions, not directly to consumers. In
              the Togg and Horizon announcements, the relevant interfaces are product strategy, digital architecture,
              intelligent-driving, and vehicle-platform teams, which suggests adoption depends on OEM engineering and
              program owners accepting a new architecture. The strongest adoption drivers in the current evidence are
              faster program development, packaging and efficiency gains from a battery-centric integrated platform, and
              the localization model that pairs one chassis platform with one supply-chain path and one domestic brand.
              The main constraints are equally clear: public sources still do not disclose pricing, buyer budget
              ownership, contracted unit volumes, or concrete homologation milestones for overseas rollout, so valuation
              has to underwrite partnership credibility more than proven commercial throughput.
