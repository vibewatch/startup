chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, ownership, and platform scope
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently identifies Contemporary Amperex Intelligent Technology (Shanghai)
              Limited (CAIT) as CATL's skateboard chassis arm and, in the February 2026 Horizon release, as a wholly
              owned CATL subsidiary. Gasgoo places the business's founding in 2021 and frames it as CATL's strategic
              push into intelligent chassis systems. Across the official launch and partnership materials, CAIT's core
              product is the Bedrock Chassis: an integrated, battery-centric platform combining the battery, electric
              drive, thermal management, and chassis-domain control layers. The company name points to a Shanghai legal
              base, but the assigned source pool does not separately publish a corporate profile or address record, so
              headquarters should be treated as directionally indicated rather than independently confirmed.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
