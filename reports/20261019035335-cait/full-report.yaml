      - number: '3.3'
        title: Commercial leverage is plausible, but public price discovery is absent
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports scale ambition more clearly than commercial transparency. Gasgoo reports a
              first external financing round of more than RMB 2 billion at a valuation above RMB 10 billion, with
              proceeds earmarked for mass production and next-generation R&D, which helps explain why CAIT can fund a
              long platform-development cycle. At the same time, neither the official materials nor the retained
              third-party coverage provide list pricing, contract structure, or discount detail for Bedrock. Even the
              most useful independent pieces largely recycle company-supplied partnership facts instead of supplying
              head-to-head procurement evidence, which makes switching-cost and margin claims directionally interesting
              but not yet underwritable.
