  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the commercialization path from program wins to chassis deployment, but not the monetary
      conversion at each step.
    data:
      nodes:
        - id: program-demand
          label: OEM / partner program demand
          detail: Named signals include Togg's three-model B-segment family and Horizon's intelligent-driving partnership.
        - id: platform-scope
          label: Bedrock chassis + engineering scope
          detail: >-
            CAIT contributes chassis technology, engineering expertise, and integrated battery/e-drive/thermal/control
            architecture.
        - id: industrialization
          label: Localization and launch milestones
          detail: >-
            Bedrock reached Chinese mass production in 2024; the first named overseas passenger-vehicle model targets
            2027.
        - id: revenue-recognition
          label: Revenue recognition
          detail: >-
            Public sources do not disclose whether value lands in hardware ASP, engineering fees, software attach, or
            intercompany arrangements.
        - id: gross-profit
          label: Gross profit conversion
          detail: >-
            Integration efficiency and the 1+1+1 localization model are positioned as economic drivers, but gross margin
            is undisclosed.
        - id: capital-support
          label: Capital support
          detail: Gasgoo reported a >2 billion yuan financing round to fund mass production and next-generation R&D.
      edges:
        - from: program-demand
          to: platform-scope
