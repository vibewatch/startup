        title: Pricing and unit economics remain the central disclosure gap
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence in this pool describes product architecture, partner roles, and funding use
              of proceeds, but it does not disclose list pricing, realized program pricing, engineering-fee structure,
              gross margin, customer acquisition cost, payback, or after-sales economics. The right interpretation is
              not that those metrics are weak, but that they are still unavailable in the public record reviewed for
              this chapter. Even the better-evidenced commercialization signals—mass production in China, a named
              overseas OEM launch target, and a Horizon integration agreement—do not resolve whether CAIT recognizes
              revenue primarily on hardware supply, engineering services, milestone payments, software bundles, or
              intercompany arrangements. That missing monetization detail is why the chapter treats revenue quality and
              margin path as open underwriting questions rather than solved facts.
