  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated platform, not a loose component set
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently describe CAIT as CATL's intelligent chassis subsidiary and Bedrock as the core
              product sold into an OEM development workflow rather than to end consumers. The commercial pattern in the
              retained evidence is a platform-plus-engineering offer: CAIT supplies the lower-body architecture,
              integration expertise, and localization model, while the automaker shapes product requirements, digital
              architecture, and user experience. The named Togg partnership matters because it moves the story beyond
              abstract marketing copy to a disclosed three-model passenger-vehicle program with a 2027 production
              target. Even so, the evidence base is still announcement-heavy, so CAIT looks more like an OEM platform
              program in rollout than a broadly evidenced, multi-program production franchise.
            claimRefs:
