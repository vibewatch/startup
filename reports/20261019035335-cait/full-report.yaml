      - number: '4.3'
        title: Fresh capital improves runway optics, but adequacy is still not measurable
        blocks:
          - type: paragraph
            body: >-
              Gasgoo reported that CAIT-SH completed its first external financing round at more than 2 billion yuan and
              a valuation above 10 billion yuan, with proceeds earmarked for Bedrock mass production and next-generation
              chassis R&D. That is a meaningful positive signal because it suggests current investors are funding
              scale-up rather than only concept development. It still falls short of a solvency conclusion. None of the
              retained public sources disclose cash on hand, burn rate, debt or project-finance obligations,
              intercompany transfer-pricing mechanics with CATL, or the milestone that would trigger the next financing
              event. The financial risk is therefore not proven distress; it is that investors can observe strategic
              momentum and recent financing support but cannot yet quantify whether CAIT can self-fund growth from
              operating performance.
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI013
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              CAIT looks strategically credible because the evidence shows a funded chassis platform with
              mass-production history in China, a named overseas OEM program, and a current strategic tie-up with
              Horizon around intelligent-driving integration. Financially, however, the evidence base is still
              pre-underwriting. The chapter can support a view that commercialization intent is real and capital support
              is currently available, but it cannot support a view on revenue quality, gross-margin trajectory, CAC
              efficiency, working-capital drag, or standalone runway. For diligence, the next step is not another
              narrative milestone; it is primary operating disclosure at the program, customer, and margin level.
