      - number: '2.2'
        title: Evidence-constrained sizing and expansion lenses
        blocks:
          - type: paragraph
            body: >-
              No retained source in the assigned pool discloses TAM, SAM, or SOM dollars for integrated intelligent
              chassis, so the chapter uses commercialization lenses instead of invented market-size math. The clearest
              proof point is operational: CATL says Bedrock reached mass production in China in 2024. Expansion evidence
              then narrows to specific program count and geography: CAIT's partnership with Togg is described as the
              first overseas passenger-vehicle project for Bedrock, covers three B-segment models, targets Turkish and
              European markets, and points to a first model entering mass production in 2027. Gasgoo adds a separate
              scale lens by reporting a more than CNY2 billion financing round earmarked for mass production and
              next-generation R&D, plus overseas projects across Southeast Asia, the Middle East, and Europe. Those are
              meaningful adoption indicators, but they still stop short of disclosed revenue pools, unit volumes, or
              conversion rates from announced cooperation to shipped vehicles.
