chapter:
  number: 7
  title: Risks
  summary: >-
    CAIT's highest risk is not a visible product failure but the concentration of its public proof around a small number of strategic partners while its first named overseas passenger-vehicle program is still targeting 2027 start of production. The retained evidence also shows a technically ambitious, partner-heavy stack and fresh external financing, but it does not publicly document homologation, warranty allocation, or field-reliability evidence for the Turkey/Europe rollout, which keeps residual regulatory and execution risk high.
sections:
  - id: ranked-risk-view
    title: Ranked risk view
    body: >-
      The retained evidence points to a commercialization story that is still early, concentrated, and partner-led rather than broadly proven in market. Multiple sources describe the Togg program as CAIT's first overseas passenger-vehicle project, with the first model only expected to reach mass production in 2027, so the company is still converting an announced strategic partnership into a live reference deployment rather than showing repeatable international shipments. That timing matters because CATL and Togg both describe the relationship as deeper than a standard supplier contract: CAIT supplies the Bedrock platform and engineering expertise while Togg shapes product requirements and digital architecture. This creates a plausible upside path, but it also means delays, integration mistakes, or a scope change by one partner can weaken CAIT's main public proof point for overseas expansion.
    claimRefs: [CR001, CR002, CR003, CR010]
    tableRefs: [TR003]
    figureRefs: [FR001]
  - id: regulatory-and-liability
    title: Regulatory and liability readiness is still under-disclosed
    body: >-
      The current source set is strong enough to confirm the ambition and structure of the Turkey program, but it is weak on the legal and operating details that matter most for underwriting launch risk. The retained sources say the platform is aimed at Turkish and European markets and that CAIT is using a 1+1+1 localization model, yet none of the cited materials disclose who owns homologation milestones, warranty reserves, recall liability, repair obligations, or cyber/compliance accountability once the Bedrock chassis is embedded in customer vehicles. That does not prove the company lacks those controls, but it does mean the assigned evidence supports a diligence conclusion of unresolved legal and regulatory exposure rather than a conclusion of readiness.
    claimRefs: [CR002, CR005, CR006, CR011]
    tableRefs: [TR001]
  - id: operational-scale-and-quality
    title: Operational scaling risk remains high because the product promise is system-level
    body: >-
      Bedrock is not a narrow component story. The product is described as integrating the battery, electric drive, thermal management, and chassis domain controller into one platform, and CATL's own positioning emphasizes software-hardware coordination and localized supply-chain execution. That integration can be a moat if it works, but it also raises the severity of any launch slip or quality issue because one failure mode can cascade across core vehicle systems. Gasgoo reports that CAIT raised more than 2 billion yuan to support mass production and next-generation R&D, which is consistent with a capital-intensive industrialization path rather than a light-software rollout. The available evidence does not include public field-reliability metrics, warranty data, or defect-history disclosures, so the prudent read is that mitigation maturity is still emerging.
    claimRefs: [CR004, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: partner-and-capital-dependence
    title: Partner and capital dependence are the main thesis-break channels
    body: >-
      CAIT's current public proof set depends heavily on counterparties. Togg is the named overseas passenger-vehicle launch partner, Horizon is the disclosed intelligent-driving collaborator, and CATL remains the parent ecosystem supplying industrial credibility, product architecture, and strategic direction. That mix can accelerate market access, but it also means CAIT has several external failure points before the business looks independently repeatable: OEM program delays, partner-roadmap misalignment, and the possibility that capital needs stay high until multiple platforms ship at scale. Gasgoo's funding report is encouraging, but one disclosed financing round does not answer how much working capital, warranty support, or customer-specific engineering spend CAIT may need if multiple overseas programs move from announcement to SOP at the same time.
    claimRefs: [CR001, CR007, CR008, CR010, CR012]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      If CAIT cannot show documented homologation ownership, warranty allocation, and a credible path to the Togg 2027 SOP window before investment underwriting, the current overseas reference case should be treated as strategic intent rather than bankable commercial proof.
    claimRefs: [CR002, CR005, CR006, CR010]
  - calloutType: insight
    title: Mitigation quality is real but still partner-mediated
    body: >-
      The best visible mitigants are CATL parent backing, Horizon's scaled ADAS footprint, and Togg's willingness to co-develop instead of merely procure, but each mitigant also increases dependence on third-party execution rather than proving a fully stand-alone CAIT operating model.
    claimRefs: [CR003, CR010, CR012]
