callouts:
  - calloutType: "insight"
    title: "Commercialization is evidenced by milestones, not by operating disclosure"
    body: >-
      CAIT has enough public evidence to show a real platform, real partners, and fresh funding, but not enough to show recognized revenue quality or margin durability.
    claimRefs: ["CI001", "CI006", "CI009", "CI010", "CI012"]
  - calloutType: "risk"
    title: "Capital dependency cannot yet be sized"
    body: >-
      The latest financing round improves confidence that CAIT can keep funding Bedrock scale-up, but the absence of cash, burn, debt, and gross-margin disclosure means investors still cannot quantify runway or the next financing trigger.
    claimRefs: ["CI001", "CI002", "CI010", "CI013"]
