company:
  name: "CAIT"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Public evidence shows CAIT raising more than 2 billion yuan at a valuation above 10 billion yuan while moving its Bedrock chassis from Chinese mass production into named OEM and ADAS partnerships. The same evidence does not disclose standalone revenue, pricing, gross margin, burn, runway, or customer concentration, so the current financial read is strategic momentum with reinforced financing capacity rather than an underwritable standalone operating model.
sections:
  - id: "revenue-model-and-traction"
    title: "Revenue model is visible in structure, not yet in recognized revenue"
    body: >-
      The retained sources support a B2B OEM-platform revenue model centered on Bedrock chassis programs, associated engineering work, and adjacent integration revenue rather than a disclosed software-SaaS profile. CAIT and its partners repeatedly frame commercialization around named vehicle programs, localized supply-chain deployment, and chassis-plus-intelligence integration, which is consistent with program-based automotive revenue but not with publicly disclosed recurring metrics. Public traction is milestone-heavy: Gasgoo reported that Bedrock mass production began in 2024, while multiple Togg-related sources frame the first named overseas passenger-vehicle program as a three-model family targeting first mass production in 2027. That is useful evidence that commercial deployment exists, but it is not evidence of current revenue scale, realized take rate, or gross profit conversion.
    claimRefs: ["CI004", "CI005", "CI006", "CI007", "CI008", "CI012", "CI014"]
    tableRefs: ["TI001"]
    figureRefs: ["FI001"]
  - id: "pricing-and-unit-economics"
    title: "Pricing and unit economics remain the central disclosure gap"
    body: >-
      The strongest public evidence in this pool describes product architecture, partner roles, and funding use of proceeds, but it does not disclose list pricing, realized program pricing, engineering-fee structure, gross margin, customer acquisition cost, payback, or after-sales economics. The right interpretation is not that those metrics are weak, but that they are still unavailable in the public record reviewed for this chapter. Even the better-evidenced commercialization signals—mass production in China, a named overseas OEM launch target, and a Horizon integration agreement—do not resolve whether CAIT recognizes revenue primarily on hardware supply, engineering services, milestone payments, software bundles, or intercompany arrangements. That missing monetization detail is why the chapter treats revenue quality and margin path as open underwriting questions rather than solved facts.
    claimRefs: ["CI009", "CI010", "CI011", "CI012", "CI014"]
    tableRefs: ["TI002", "TI003"]
  - id: "capital-adequacy"
    title: "Fresh capital improves runway optics, but adequacy is still not measurable"
    body: >-
      Gasgoo reported that CAIT-SH completed its first external financing round at more than 2 billion yuan and a valuation above 10 billion yuan, with proceeds earmarked for Bedrock mass production and next-generation chassis R&D. That is a meaningful positive signal because it suggests current investors are funding scale-up rather than only concept development. It still falls short of a solvency conclusion. None of the retained public sources disclose cash on hand, burn rate, debt or project-finance obligations, intercompany transfer-pricing mechanics with CATL, or the milestone that would trigger the next financing event. The financial risk is therefore not proven distress; it is that investors can observe strategic momentum and recent financing support but cannot yet quantify whether CAIT can self-fund growth from operating performance.
    claimRefs: ["CI001", "CI002", "CI010", "CI013"]
  - id: "financial-verdict"
    title: "Financial verdict"
    body: >-
      CAIT looks strategically credible because the evidence shows a funded chassis platform with mass-production history in China, a named overseas OEM program, and a current strategic tie-up with Horizon around intelligent-driving integration. Financially, however, the evidence base is still pre-underwriting. The chapter can support a view that commercialization intent is real and capital support is currently available, but it cannot support a view on revenue quality, gross-margin trajectory, CAC efficiency, working-capital drag, or standalone runway. For diligence, the next step is not another narrative milestone; it is primary operating disclosure at the program, customer, and margin level.
    claimRefs: ["CI001", "CI006", "CI009", "CI010", "CI012", "CI013"]
