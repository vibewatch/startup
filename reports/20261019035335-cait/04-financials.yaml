      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["External capital raised", ">2 billion yuan in first external financing round", "Medium", "Shows current financing support for scale-up", "Provide close date, investor breakdown, post-money ownership, and cash received net of fees"]
      - ["Reported valuation", ">10 billion yuan", "Medium", "Sets financing context but not operating quality", "Provide post-money basis, instrument terms, and any parent-company rights or preferences"]
      - ["Standalone revenue / ARR", "Not publicly disclosed", "High that the metric is undisclosed in retained sources", "Prevents underwriting revenue quality and growth", "Share recognized revenue by program, billing basis, and customer concentration"]
      - ["Gross margin", "Not publicly disclosed", "High that the metric is undisclosed in retained sources", "Gross margin determines whether platform scale can fund growth", "Share hardware, engineering, and blended gross margin with bridge from BOM and service costs"]
      - ["Burn / runway / cash on hand", "Not publicly disclosed", "High that the metric is undisclosed in retained sources", "Capital adequacy cannot be measured without cash and burn", "Share latest cash balance, monthly burn, debt/project-finance obligations, and runway"]
      - ["Public traction proxy", "Mass production in China in 2024; first named overseas OEM model targeted for 2027", "High", "Provides deployment timing even without revenue disclosure", "Provide shipped units, booked programs, conversion from signed partnerships to production volumes, and after-sales obligations"]
    notes: "Values mix reported financing facts with explicit public-data gaps; null-style disclosure gaps are stated textually because the table tracks diligence status rather than a modeled forecast."
    claimRefs: ["CI001", "CI002", "CI005", "CI007", "CI010", "CI012", "CI013"]
