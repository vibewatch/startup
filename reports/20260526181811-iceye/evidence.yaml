evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-date
    missingEvidence: >-
      A registry-backed incorporation record or company legal-history document that pins the exact formal founding date
      and earliest operating entity.
    whyItMatters: >-
      The chapter can only defend a 2012–2015 origin window today, which is weaker than a precise cover-fact date and
      introduces timeline ambiguity.
    diligencePath: >-
      Request Finnish trade-register records, earliest corporate filings, or Aalto spinout documentation and reconcile
      them against management biographies.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: governance-transparency
    missingEvidence: A current board roster, committee structure, voting rights map, and major shareholder-control summary.
    whyItMatters: >-
      Leadership visibility is decent, but control and oversight cannot be evaluated cleanly from public sources, which
      limits judgment on governance resilience and founder concentration.
    diligencePath: Request current board materials, shareholder rights summary, and post-Series-E governance documents.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: lifetime-capital
    missingEvidence: >-
      A complete financing ledger that reconciles primary equity, debt, secondary sales, and FX treatment into one
      lifetime capital-raised figure.
    whyItMatters: >-
      Public sources support “about €600M” and multiple lower-bound calculations, but not an audit-grade lifetime
      funding total suitable for a zero-caveat cover fact.
    diligencePath: >-
      Request the cap table bridge, debt schedule, and investor update that reconciles disclosed rounds to the current
      total.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: >-
      A current customer-count and revenue-concentration summary split by sovereign, insurance, environmental, and other
      commercial cohorts.
    whyItMatters: >-
      Named contracts prove demand, but without total customer count and concentration data it is impossible to quantify
      platform breadth or account dependence.
    diligencePath: >-
      Request customer cohort counts, top-account revenue concentration, and sovereign versus commercial mix from
      management.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: minor
    topic: litigation-screen
    missingEvidence: >-
      A database-backed legal and regulatory screen across Finland, the EU, the US, sanctions lists, and export-control
      enforcement records.
    whyItMatters: >-
      Public web review did not surface clear actions by the run date, but absence from open news is not equivalent to a
      clean legal screen for a defense-sensitive company.
    diligencePath: Run formal legal-database, sanctions, and export-control checks rather than relying only on open-web reporting.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: iceye-segment-revenue-mix
    missingEvidence: A current split of ICEYE revenue or backlog by defense, insurance, disaster response, and other verticals.
    whyItMatters: >-
      Without segment mix, the chapter can define the market boundary but cannot convert it into a defended bottom-up
      SOM tied to actual customer spend.
    diligencePath: >-
      Request management reporting or board materials showing ARR/revenue, ACV, and renewal rates by vertical and
      geography.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: government-contract-values
    missingEvidence: >-
      Named contract values, annual ceilings, or option values for commercial SAR awards from defense and intelligence
      customers.
    whyItMatters: >-
      Public buyer names prove demand exists, but contract-value opacity prevents triangulating market share or renewal
      concentration risk.
    diligencePath: >-
      Collect procurement notices, budget exhibits, or direct customer disclosures for NRO-like programs and sovereign
      satellite deals.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: material
    topic: sar-only-tam-definition
    missingEvidence: >-
      A consistent public methodology separating SAR-only recurring data-and-derivatives spend from hardware, analytics
      software, and adjacent EO markets.
    whyItMatters: >-
      The published TAM lenses differ by an order of magnitude, so any valuation argument that uses one without boundary
      discipline is fragile.
    diligencePath: >-
      Build a bottoms-up served-market model using named buyers, use cases, and contract types instead of headline
      analyst TAM figures.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: bottom-up-som
    missingEvidence: >-
      Evidence on pricing, attach rates, renewals, and tasking utilization by segment sufficient to estimate an
      attainable three-year SOM.
    whyItMatters: >-
      The chapter can bound the market conceptually, but without unit economics and conversion evidence it cannot say
      how much of that market ICEYE can realistically capture.
    diligencePath: >-
      Request customer cohort data, event-based insurance pricing, sovereign program win-loss data, and SLA-driven price
      premiums by workflow.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: archive-capacity-gap
    missingEvidence: >-
      Comparable public archive-size, backlog, or total taskable-capacity figures for ICEYE, Capella, Umbra, and
      Synspective.
    whyItMatters: >-
      Without capacity comparables it is hard to tell whether ICEYE's constellation scale is merely headline leadership
      or a durable supply-side moat.
    diligencePath: >-
      Request current archive size, average daily collectable km², and priority-window acceptance rates from each vendor
      or their channel partners.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Realized enterprise pricing, minimum commits, discount bands, and package-to-package price comparables across
      ICEYE and private SAR peers.
    whyItMatters: >-
      Packaging is public, but underwriting substitute pressure requires knowing where actual contract economics land
      after negotiation.
    diligencePath: >-
      Collect recent quotes, reseller schedules, or customer order forms from ICEYE, Capella, Umbra, and Synspective;
      benchmark against BlackSky and Satellogic contracts.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Renewal, churn, expansion, or retention metrics for ICEYE and private SAR peers.
    whyItMatters: >-
      Switching-cost claims remain directional without customer-behavior data showing whether deployments actually stick
      after initial pilots or sovereign wins.
    diligencePath: >-
      Ask management for cohort retention, repeat-order rates, and multi-year contract renewal data segmented by defense
      and commercial accounts.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: synspective-scope-gap
    missingEvidence: A public customer or government reference set that demonstrates Synspective distribution breadth outside Japan.
    whyItMatters: >-
      Synspective may be a stronger global threat than public evidence suggests, but current materials do not prove
      broad international traction.
    diligencePath: >-
      Request customer references, reseller lists, or export program disclosures that show non-Japan adoption by defense
      or infrastructure buyers.
    relatedQuestionRefs:
      - QP029
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Net realized pricing by imaging mode, customer type, and sovereign-program discount structure.
    whyItMatters: Public list prices do not reveal actual revenue per image or the pricing power of sovereign programs.
