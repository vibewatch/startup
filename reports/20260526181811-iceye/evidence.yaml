      Request a 2025 gross-to-net pricing waterfall split by archive imagery, new tasking, tactical access, and
      sovereign customers.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: segment-margins
    missingEvidence: Gross margin and contribution margin by imagery, analytics, and sovereign mission segment.
