- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - ICEYE solution
  - measurable benefit
  - limitation
  rows:
  - - Sovereign ISR procurement
    - Stand up a national space-based ISR stack without waiting for a traditional prime-led multi-year program
    - Complete mission including satellites, software, ground systems, training, and support
    - First launch or operational capability marketed inside 12 months
    - Public evidence does not break out sustainment cost or staffing burden after handover.
  - - Tactical monitoring and rapid dissemination
    - Task collection, receive data, exploit imagery, and push intelligence to field users
    - Gen4 plus CONNECT plus ISR Analytics and ISR Cell positioning
    - Company claims compression from tasking to dissemination from hours/days toward minutes
    - Detailed ISR Cell technical specs are not public and the dedicated page was not publicly reachable during review.
  - - Self-service archive or new collection purchase
    - Define AOI, compare archive versus new tasking, pay, download output
    - SkyFi-powered ICEYE US Direct workflow
    - Typical delivery cited within 24 hours, with transparent preview of mode, date, location, and pricing
    - U.S.-oriented surface may not represent the same workflow for all global sovereign buyers.
  - - Automated monitoring pipeline
    - Integrate ordering and archive retrieval into internal software and trigger downstream analysis automatically
    - Tasking API plus Catalog API with STAC outputs and status polling
    - No human-in-the-loop required for routine ordering; supports tip-and-cue workflows
    - Public documentation does not disclose long-term API governance details such as quotas or deprecation policy.
  - - Insurance or disaster-response triage
    - Detect flood, wildfire, or weather impact when optical data is blocked by weather or darkness
    - All-weather SAR with analysis-ready outputs and partner/self-service access
    - Cloud/smoke/night penetration plus rapid tasking and data access
    - Public record is thinner on quantified accuracy by peril than on workflow descriptions.
  - - Maritime and border awareness
    - Monitor ports, dark vessels, border crossings, and critical sites under persistent conditions
    - High-resolution SAR, broad scan modes, and Detect & Classify positioning
    - Wider-area coverage plus Gen4 revisit and AI-assisted identification claims
    - Automatic-detection performance is described publicly mainly through marketing or partner summaries.
  notes: Benefits reflect public workflow claims rather than audited customer KPI studies; limitations mark where diligence should request deployment evidence.
