  evidenceGaps:
  - type: missing-source
    severity: material
    topic: isr-cell-specs
    missingEvidence: Dedicated public technical documentation for the ISR Cell covering hardware footprint, compute boundary, interfaces, and supported analytic workflows.
    whyItMatters: ISR Cell is repeatedly used in ICEYE's tactical-value narrative, but the public record is too thin to underwrite edge deployment complexity or sustainment burden.
    diligencePath: Request product brief, architecture deck, and deployment checklist for ISR Cell from product or mission-engineering leadership, then map dependencies onto the sovereign mission offer.
    relatedQuestionRefs:
    - QE026
  - type: private-evidence-only
    severity: material
    topic: connect-reliability
    missingEvidence: Audited SLA attainment, uptime history, latency percentiles, and customer references for CONNECT and ISR Analytics workflows.
    whyItMatters: The product story relies heavily on sub-hour and sub-minute delivery claims, but investors cannot distinguish steady-state performance from best-case marketing examples.
    diligencePath: Ask for 12-month service-level reports, representative customer operating metrics, and incident history segmented by sovereign versus shared-connectivity deployments.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: security-assurance-depth
    missingEvidence: SOC 2 or equivalent assurance, penetration-test summary, SBOM or secure-development controls, and any FedRAMP or classified-environment roadmap for mission software.
    whyItMatters: ISO and NIST references are positive, but defense and critical-infrastructure buyers often need deeper assurance artifacts before granting broad operational trust.
    diligencePath: Request the latest security assurance pack under NDA, including third-party assessments, development-governance controls, and data-segmentation architecture for sovereign missions.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: api-governance
    missingEvidence: Public documentation on API quotas, SDK support, release/version policy, and deprecation guarantees for integrations.
    whyItMatters: ICEYE's integration-first motion is real, but enterprise adoption risk rises if customers cannot plan around rate limits, schema changes, or support commitments.
    diligencePath: Ask product management for API roadmap, changelog policy, support SLAs, and any customer-facing SDK or reference implementation plan.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
