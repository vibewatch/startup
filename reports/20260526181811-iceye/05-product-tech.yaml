- id: TE001
  title: Product module / asset matrix
  columns:
  - module or asset
  - primary user
  - status or maturity
  - differentiation
  - diligence gap
  rows:
  - - Commercial SAR constellation and archive
    - Defense, insurance, infrastructure, and analytics users
    - Live and globally deployed
    - All-weather/day-night collection plus broad tasking and archive access
    - Public materials still do not disclose hard uptime or sell-through mix by vertical.
  - - Gen4 sovereign SAR satellite
    - National ISR buyers and defense ministries
    - Commercially available in 2025; operational deliveries scaling in 2026
    - 16 cm class imagery, wider field of regard, higher throughput, ITAR-free positioning
    - No public per-satellite cost, mean-time-between-failure, or full lifecycle replacement plan.
  - - Mission ground segment and sovereign control plane
    - National operators and on-prem mission teams
    - Live offer; detailed internal architecture not public
    - National ownership, local tasking/processing/storage, continuous updates without hardware replacement
    - Public engineering detail on the mission software stack and control-plane redundancy is limited.
  - - CONNECT ground network
    - Operators needing rapid downlink and no local antenna buildout
    - Live service with named packages
    - Global qualified-station access, 99% contact-success claim, sub-hour end-to-end target
    - No independent public SLA report or outage history.
  - - ISR Analytics and ATR layer
    - Intelligence analysts and tactical exploitation teams
    - Live productized capability but still brochure-level publicly
    - Manages collection requests through dissemination and adds AI-powered automatic target recognition
    - Limited public model-card detail, false-positive rates, or modality-fusion documentation.
  - - API and self-service access surfaces
    - Integrators, analysts, and lighter-weight commercial/government users
    - Live since 2024-2025
    - Tasking/catalog APIs, STAC-friendly archive outputs, and SkyFi-powered online ordering
    - Public rate limits, SDK strategy, and long-term versioning guarantees are not disclosed.
  notes: Rows separate asset layers that exist in public evidence; maturity is public-signal based rather than an internal product-health score.
