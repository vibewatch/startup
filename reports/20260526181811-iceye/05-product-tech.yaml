- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control or certification
  - status
  - scope
  - public gap
  rows:
  - - ISO/IEC 27001:2022
    - Certified
    - Kiwa certificate covers sales and delivery of production and commercial space missions and satellite data in Finland and Poland through 2028-05-09
    - Public evidence does not expose technical control implementation detail or audit findings.
  - - ISO 9001:2015
    - Certified
    - Trust center frames it as assurance on consistent products/services and regulatory obligations
    - No public program-level defect or field-failure metrics accompany the certification claim.
  - - ICEYE US API security posture
    - Publicly claimed
    - ISO 27001 plus NIST 800-171 alignment with encryption in transit and at rest for sensitive information
    - No public SSP, FedRAMP path, or independent penetration-testing summary.
  - - Export controls and sanctions screening
    - Publicly documented
    - Governance page states compliance with export-control laws, sanctions restrictions, and end-use monitoring
    - Screening workflow thresholds and audit cadence are not public.
  - - Website/customer privacy program
    - Publicly documented
    - GDPR-framed notice covering customer, prospect, and site-visitor data with contract, legitimate-interest, and consent bases
    - Public notice is web-data focused and does not fully describe sovereign mission data-governance boundaries.
  - - Supplier code and whistleblowing
    - Publicly documented
    - Supplier minimums on regulatory compliance and ethics plus whistleblowing process for wrongdoing alerts
    - Useful governance scaffolding, but not a substitute for supply-chain resilience data or component provenance detail.
  notes: The table distinguishes certified controls from policy-level disclosures; the main diligence gap is depth of public implementation evidence, not absence of formal frameworks.
