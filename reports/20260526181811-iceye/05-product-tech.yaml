- id: architecture-stack
  title: Architecture, constellation, and analytics stack
  body: |-
    Public materials describe a stack with five interacting layers: space segment, ground connectivity, tasking/catalog control plane, analytics/exploitation software, and exported data products. The missions page says sovereign systems combine satellites, mission software, analytics, and tactical exploitation tools; the Connect page adds a managed ground network; the data product specification defines how imagery turns into standard amplitude and complex products; and the API surface exposes ordering, status, and archive workflows. In other words, ICEYE has assembled a full operating architecture from collection through dissemination rather than a standalone sensor.

    Gen4 is the clearest technical marker of maturity. ICEYE markets up to 16 cm resolution, 1,200 MHz imaging bandwidth, sub-15-minute revisit with constellation support, 15+ images per acquisition, and up to 700 Mbps downlink with a steerable antenna. The same release also ties Gen4 to a broader workflow claim: more images per pass, simultaneous imaging and downlink, and compatibility with the ISR Cell and mission ground segment. The documentation layer is also stronger than many private space peers. ICEYE’s 2026 data product specification explicitly lays out imaging modes, service levels, tasking framework, archive ordering, and modern product packaging such as Cloud Optimized GeoTIFF and GeoJSON metadata. That reduces integration risk for professional users, even though some mission-system details remain brochure-level rather than engineering-manual level.
