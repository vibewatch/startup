- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer or component
  - role
  - critical dependency
  - main risk
  rows:
  - - Space segment
    - Collects SAR imagery across Gen4 and legacy fleet assets using multiple imaging modes
    - Satellite manufacturing, launch rideshares, in-orbit commissioning
    - Launch cadence or component bottlenecks can constrain both proprietary and sovereign programs.
  - - Imaging modes and product engine
    - Converts collections into GRD, SLC, CSI, VID and related standard outputs
    - Current product-spec maintenance and customer migration from legacy formats
    - Format transitions through December 2026 can create migration work for downstream users.
  - - Ground connectivity
    - Provides command links and rapid downlink through CONNECT or dedicated sovereign antennas
    - Qualified ground-station network, encryption, pass scheduling, and redundancy
    - Public reliability claims are strong, but audited service-performance data is unavailable.
  - - Tasking, catalog, and self-service control plane
    - Handles order creation, contract-aware access, status updates, and archive search
    - API authentication, contract configuration, SkyFi user experience, and payment workflow
    - Public docs do not disclose quota, rollback, or change-management policies.
  - - Analytics and exploitation layer
    - Manages requests and turns imagery into operational outputs including ATR-assisted workflows
    - Model quality, data latency, edge deployment, and user training
    - Public evidence on false positives, benchmark sets, or multimodal fusion depth is sparse.
  - - Compliance and governance overlay
    - Screens end use, manages privacy/security controls, and supports regulated customers
    - ISO controls, privacy program, export controls, supplier code, and ICEYE US security posture
    - Policy-level disclosure is stronger than architecture-level disclosure.
  notes: This is an operating architecture synthesized from official pages, technical docs, partner integrations, and public product workflows rather than a vendor-published systems diagram.
