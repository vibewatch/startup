    - Weather/daylight constraints make it a substitute, not a full SAR replacement
  - - BlackSky
    - Optical + analytics substitute
    - Public Gen-3 provider; >2 dozen new Q1-2026 Gen-3 customers; >$100M defense contract through 2032
