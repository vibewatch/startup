  evidenceGaps:
  - type: missing-source
    severity: material
    topic: archive-capacity-gap
    missingEvidence: Comparable public archive-size, backlog, or total taskable-capacity figures for ICEYE, Capella, Umbra, and Synspective.
    whyItMatters: Without capacity comparables it is hard to tell whether ICEYE's constellation scale is merely headline leadership or a durable supply-side moat.
    diligencePath: Request current archive size, average daily collectable km², and priority-window acceptance rates from each vendor or their channel partners.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Realized enterprise pricing, minimum commits, discount bands, and package-to-package price comparables across ICEYE and private SAR peers.
    whyItMatters: Packaging is public, but underwriting substitute pressure requires knowing where actual contract economics land after negotiation.
    diligencePath: Collect recent quotes, reseller schedules, or customer order forms from ICEYE, Capella, Umbra, and Synspective; benchmark against BlackSky and Satellogic contracts.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Renewal, churn, expansion, or retention metrics for ICEYE and private SAR peers.
    whyItMatters: Switching-cost claims remain directional without customer-behavior data showing whether deployments actually stick after initial pilots or sovereign wins.
    diligencePath: Ask management for cohort retention, repeat-order rates, and multi-year contract renewal data segmented by defense and commercial accounts.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: synspective-scope-gap
    missingEvidence: A public customer or government reference set that demonstrates Synspective distribution breadth outside Japan.
    whyItMatters: Synspective may be a stronger global threat than public evidence suggests, but current materials do not prove broad international traction.
    diligencePath: Request customer references, reseller lists, or export program disclosures that show non-Japan adoption by defense or infrastructure buyers.
