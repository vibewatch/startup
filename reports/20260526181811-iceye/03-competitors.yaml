  - - Copernicus / Landsat open stack
    - Status-quo substitute
    - Free and no-charge public EO programs
    - Analysts, public agencies, cost-sensitive commercial teams, in-house build stacks
    - Zero licensing cost, broad institutional access, baseline coverage for experimentation
    - No priority tasking, no proprietary support model, and no premium low-latency service guarantee
