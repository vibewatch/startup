- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or risk
  - Evidence
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - All-weather time-critical SAR access is ICEYE's core moat
    - ICEYE Tactical Access and 54-satellite sovereign-facing story
    - Capella now offers 25 cm + fast automation and Umbra offers 15 cm-class capability
    - High
    - Request win/loss data on defense deals where resolution or delivery speed outweighed guaranteed-access packaging
  - - Government trust and sovereign programs create switching cost
    - Finland LOI, BlackSky Mission Solutions, Umbra build-own, Capella dedicated systems
    - Sovereign packaging is no longer unique to ICEYE
    - High
    - Ask ICEYE for renewal data and program pipeline by sovereign account
  - - Archive and workflow lock-in can protect incumbents
    - Planet archive/APIs, Capella APIs, BlackSky subscriptions, Satellogic CaaS, Umbra dedicated capacity
    - Multi-homing is increasingly normal through bundle and tip-and-cue workflows
    - Medium-High
    - Validate whether customers typically single-home radar or combine SAR with optical suppliers
  - - Public pricing opacity can support premium selling
    - Most private SAR peers hide realized prices
    - Free/open substitutes and BlackSky-style subscription language can anchor buyers to cheaper alternatives
    - High
    - Collect quote samples, discount bands, and price-per-km² or price-per-site data from channel partners
  - - Peer moats are not uniformly durable
    - BlackSky 10-K customer concentration, Synspective limited rollout, open-data experimentation
    - Some competitor threats may be narrower than headline capability suggests
    - Medium
    - Separate headline sensor specs from actual channel breadth and contract durability in diligence
  - - New-entry risk is constrained at the top end
    - NRO radar Stage III field narrowed to three vendors
    - Concentration may harden the top tier but also intensify rivalry among a small set of validated players
    - Medium
    - Monitor whether any new SAR entrant wins equivalent U.S. or allied validation in the next 12 months
  notes: The register mixes source-backed risk evidence with diligence asks where public data remains insufficient. Severity reflects probable impact on ICEYE differentiation over the next 12-24 months, not long-run existential risk.
