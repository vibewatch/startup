- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public package shape
  - Public unit / cadence
  - Included capabilities or missing data
  - Competitive implication
  rows:
  - - ICEYE
    - Standard tasking + Tactical Access add-on
    - Email order; <8h standard delivery; <1h tactical delivery
    - All-weather SAR, archive access, guaranteed windows; no public list price
    - Strong for urgent defense use cases, but public packaging remains opaque to commercial buyers
  - - Capella
    - Console/API tasking with explicit priority tiers
    - Scheduler every 20 min on 7-day window; cost review before acceptance
    - 0.25 m SAR, repeat tasking, AWS GovCloud workflow; no public rate card
    - Most automation-forward direct SAR peer, which can lower switching friction into Capella
  - - Umbra
    - Build-own / lease / hybrid mission models
    - Custom mission model rather than public per-scene rate card
    - 15 cm-class capability, dedicated capacity, sovereign packaging; no public list price
    - Flexible for states and prime contractors, but quote-based economics are not public
  - - Synspective
    - Archive search + tasking + APIs on limited basis
    - Public workflow exists but service expansion is gradual
    - SAR data, archive, acquisition APIs; no public pricing
    - Commercial readiness exists, but public packaging still looks earlier-stage than ICEYE or Capella
  - - Planet
    - One-time or scalable tasking plus monitoring subscriptions
    - 50 cm tasking, multiple revisits/day, <4h delivery
    - Broad archive, APIs, Tasking Dashboard; no public list price in current source set
    - Powerful substitute when buyers want context and coverage more than all-weather SAR
  - - BlackSky
    - Order-agreement subscription packages; On-Demand and Assured
    - Annual or multi-year contracts; pricing tiers; pilot-to-subscription path
    - 35 cm imagery, AI analytics, Mission Solutions; no public rate card
    - Subscription packaging is more procurement-readable than most private SAR offers
  - - Satellogic
    - Constellation-as-a-Service and direct tasking
    - Private secure tasking over specified areas; no public list rates
    - Sub-meter imagery, high revisit, secure access, Aleph Observer monitoring
    - Positioned to win on economics and dedicated access rather than unique sensor physics
  - - Copernicus / Landsat / open data
    - Free public data access
    - Download via portals or cloud, no premium tasking cadence
    - Zero license cost, broad institutional access, baseline imagery
    - Sets the low-end price anchor and makes premium EO vendors justify latency or insight advantage
