- id: capital-adequacy-financing
  title: Capital adequacy, financing, and liquidity support
  body: |-
    ICEYE’s capital story improved materially between 2024 and mid-2026. In 2024 the company raised $93 million in a growth round, then added a $65 million extension that management explicitly described as a mix of debt and equity, taking 2024 fundraising to $158 million and cumulative capital raised to more than $500 million. By March 2026 the company disclosed over €350 million of cash, over €130 million of operating cash flow for 2025, and more than €100 million of EBITDA. In May 2026 it added a €300 million three-year revolving credit facility. Taken together, those data points imply a company that has moved from venture-funded expansion toward a more diversified capital structure with both internally generated cash and bank liquidity.

    The credit facility is especially revealing because it was not framed as generic balance-sheet padding. ICEYE said the revolver supports customer-contract guarantees and acts as a liquidity backstop. That suggests sovereign contracts create real working-capital and bonding requirements even after the company turned profitable. In other words, the balance sheet looks stronger, but it still has to support performance obligations and delivery risk associated with large defense and sovereign programs. Public reporting that management has no immediate need for new funding is directionally reassuring, yet investors still need covenant detail, restricted-cash splits, guarantee utilization, and a 12- to 24-month cash bridge before concluding the business is fully self-funding.
