callouts:
- calloutType: strength
  title: 2025 moved ICEYE from promise to disclosed profitability
  body: ICEYE now has public revenue, EBITDA, operating cash flow, cash, and backlog figures. That does not remove diligence needs, but it materially improves the starting point versus private space companies that still rely on fundraising narratives alone.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
