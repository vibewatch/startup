    - Determines how much revenue is recurring versus milestone-driven
    - Not disclosed
    - Without mix, backlog quality cannot be translated into valuation quality
    - Request 2025 revenue bridge by product line and customer class.
  - - Realized pricing and discounting
    - Separates public list prices from actual net revenue per order or contract
    - Not disclosed
    - List pricing cannot support a reliable revenue model alone
    - Request gross-to-net waterfall by imaging mode and sovereign program.
  - - Segment gross margin and contribution margin
    - Required to underwrite profitability durability and margin expansion
    - Not disclosed
    - Public EBITDA is encouraging but not enough to price execution risk
    - Request segment P&L for imagery, analytics, and sovereign missions.
  - - Per-satellite build cost, maintenance capex, and depreciation
    - Core to judging true capital intensity and replacement burden
    - Not disclosed
    - Production ramp could absorb far more capital than revenue headlines imply
    - Request capex schedule, useful-life assumptions, and maintenance capex policy.
  - - Working capital, DSO, and guarantee utilization
    - Shows whether sovereign contracts consume cash before recognition
    - Not disclosed
    - RCF purpose suggests this is material to execution risk
    - Request contract-asset, receivable, and guarantee utilization roll-forward.
  - - Customer concentration, renewal rates, and backlog conversion timing
    - Tests dependence on a handful of sovereign customers and timing risk
    - Not disclosed
    - Defense concentration could be acceptable or dangerous depending on concentration and cadence
    - Request top-customer exposure, renewal profile, and backlog recognition calendar.
