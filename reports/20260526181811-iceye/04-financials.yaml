  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Net realized pricing by imaging mode, customer type, and sovereign-program discount structure.
    whyItMatters: Public list prices do not reveal actual revenue per image or the pricing power of sovereign programs.
    diligencePath: Request a 2025 gross-to-net pricing waterfall split by archive imagery, new tasking, tactical access, and sovereign customers.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: segment-margins
    missingEvidence: Gross margin and contribution margin by imagery, analytics, and sovereign mission segment.
    whyItMatters: Profitability cannot be underwritten without understanding whether 2025 EBITDA came from scalable software-like products or project-heavy sovereign delivery.
    diligencePath: Request segment P&L and gross-margin bridge for FY2024-FY2025, including direct support costs and launch expenses.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: satellite-capex
    missingEvidence: Per-satellite build cost, maintenance capex, launch cost burden, and depreciation assumptions.
    whyItMatters: The production ramp and sovereign backlog could be attractive or value-destructive depending on replacement cost and maintenance burden.
    diligencePath: Request manufacturing BOM, launch-cost allocation, capex schedule, useful-life assumptions, and maintenance-capex policy.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: Contract-asset balances, receivable days, guarantee utilization, and restricted-cash requirements by sovereign contract.
    whyItMatters: The revolving credit facility suggests large contracts consume liquidity before revenue recognition, which affects real runway and execution risk.
    diligencePath: Request monthly cash bridge, contract-asset and receivable aging, guarantee schedule, and revolver utilization report.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-audits
    missingEvidence: Audited consolidated financial statements for the parent company, including backlog conversion, debt schedule, and customer concentration.
    whyItMatters: UK subsidiary filings do not answer the underwriting questions for the consolidated business that investors actually fund.
    diligencePath: Request FY2024-FY2025 audited consolidated statements, auditor letters, top-customer concentration, and backlog recognition schedule.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
