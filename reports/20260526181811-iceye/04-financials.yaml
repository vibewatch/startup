- calloutType: risk
  title: The biggest risk is defense-linked concentration, not lack of demand
  body: The company appears to have demand and backlog, but both are increasingly tied to sovereign and defense programs. Competition for those customers is intensifying, which could pressure pricing, terms, or support burdens even if top-line growth stays strong.
  claimRefs:
  - CI026
  - CI029
  - CI038
  - CI042
- calloutType: recommendation
  title: Request segment margins, guarantee schedules, and backlog-conversion timing before underwriting
  body: The public record is now good enough to justify diligence, but not good enough to price the business. The three highest-value asks are a segment P&L, a working-capital and guarantee roll-forward, and a backlog recognition schedule split between imagery, analytics, and sovereign programs.
