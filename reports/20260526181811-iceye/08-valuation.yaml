    "number": 8,
    "title": "Valuation",
    "summary": "ICEYE’s last disclosed valuation of about €2.4 billion is supported by unusually strong public proof for a private space company — >€250 million of 2025 revenue, >€100 million of EBITDA, >€350 million of cash, and a €1.5 billion backlog — but the same public record still does not clear the cap table, contract-margin quality, or revenue-mix questions needed for a buy call. The price therefore looks fair-to-stretched rather than obviously cheap: strong enough to stay engaged, not transparent enough to underwrite aggressively."
  },
  "sections": [
    {
      "id": "valuation-frame-and-recommendation",
      "title": "Valuation frame and recommendation",
      "body": "ICEYE is easier to admire than to underwrite at face value. The company now has a set of public proof points that most late-stage private space companies never reach: revenue above €250 million, EBITDA above €100 million, cash above €350 million, cash generation above €130 million, and a €1.5 billion backlog. Independent reporting also pegs the last disclosed financing at about €2.4 billion, implying roughly 9.6x trailing revenue and about 24x trailing EBITDA before any cap-table adjustments. Those are not absurd multiples for a profitable defense-linked space asset with visible sovereign demand, but they are not obviously cheap either. The right call is therefore research-more / track, not buy. Public evidence supports a strong business, a fair-to-stretched price, and meaningful strategic upside, yet it does not disclose the preference stack, contract-margin durability, or the exact mix between scalable data revenue and hardware-heavy sovereign delivery. Until those gaps close, company quality and entry-price quality are not the same thing.",
