    {
      "id": "financing-context-and-contract-visibility",
      "title": "Financing context and contract visibility",
      "body": "What keeps ICEYE from screening as a simple “expensive private round” is the depth of contract visibility behind the story. The December 2025 financing was not sold as generic runway; it was presented as fuel for sovereign satellite systems and data-intelligence services, and outside reporting said the round included both primary capital and secondary liquidity. The sovereign contract set is unusually concrete. Poland moved from signature to handover in under a year. Sweden is buying a full sovereign stack of satellites, data, software, and ground systems. Portugal chose direct satellite procurement. Germany’s Rheinmetall-linked order is worth about €1.7 billion gross, and the IHI relationship points toward a Japanese constellation of up to 24 satellites. The May 2026 revolving credit facility matters for valuation too: it suggests large contracts require guarantees and working-capital support even after profitability arrives. That mix supports the last-round price better than pure Earth-observation storytelling would, but it also means investors need to know how much of future growth is high-quality recurring service revenue versus lower-multiple project delivery.",
