    {
      "id": "exit-paths-downside-and-diligence",
      "title": "Exit paths, downside risks, and final diligence asks",
      "body": "ICEYE has real exit optionality, but it is not yet de-risked enough to justify paying up without more diligence. An IPO is at least plausible now that profitability, cash generation, and backlog are visible, yet public sources still stop short of giving audited statements, a clear recurring-revenue profile, or a cap-table waterfall. Strategic alternatives are equally credible: the Rheinmetall joint venture shows one industrial path, and the IHI constellation cooperation shows another. The downside is that the same sovereign focus that supports valuation also concentrates risk. If backlog slips, hardware-heavy programs dilute margins, new financing arrives on senior terms, or dual-use scrutiny raises discount rates, ICEYE can re-rate quickly toward less generous Earth-observation comparables. That is why the thesis-break triggers here are operational and financial rather than merely narrative. A positive outcome needs proof that sovereign contracts convert into durable, profitable delivery without surprising common-equity dilution. Until management opens the capital stack, contract economics, and backlog conversion schedule, the correct posture is disciplined tracking, not price-taking enthusiasm.",
