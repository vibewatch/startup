  topStrengths:
    - >-
      ICEYE has unusually strong public operating proof for a private space company, including 2025 revenue above €250M,
      EBITDA above €100M, and a €1.5B backlog.
    - >-
      The company has built a differentiated sovereign-SAR position with publicly evidenced traction in Poland, Sweden,
      Portugal, Germany, Ukraine, and Japan.
    - >-
      ICEYE combines constellation data, tasking software, and sovereign mission delivery, giving it a broader strategic
      role than a pure imagery reseller.
  topRisks:
    - >-
      Growth is increasingly concentrated in sovereign and defense programs, making bookings and cash conversion
      sensitive to procurement cycles, export controls, and geopolitics.
    - >-
      Large sovereign contracts appear to consume guarantees and working capital even after profitability, raising
      execution and treasury risk.
    - >-
      Public evidence still does not disclose the cap table, preference stack, or contract-level margin profile needed
      to judge common-equity entry economics.
    - >-
      Dual-use surveillance scrutiny and tighter licensing rules could raise discount rates or constrain how the company
      serves customers across jurisdictions.
  unresolvedGaps:
    - Cap-table structure, liquidation preferences, and guarantee utilization are not publicly disclosed.
    - Backlog conversion timing and contract-margin quality by sovereign program remain unclear.
    - Exact top-customer concentration, renewal behavior, and total active customer count are not public.
    - >-
      Satellite failure history, deorbit performance, and full export-license inventory are not public enough for full
      underwriting.
