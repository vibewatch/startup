  - id: sales-motion
    title: Sales motion and procurement routes
    body: |-
      Public evidence suggests ICEYE does not rely on one procurement path. Sacra describes three monetization routes — direct imagery
      sales, analytical services, and constellation-as-a-service — and the customer examples in this chapter fit that mix. Poland and
      Ukraine represent direct sovereign defense procurement or direct ministry usage. FEMA shows a partner-mediated government motion:
      New Light Technologies already sits inside FEMA's workflow stack and integrates ICEYE into TEMPO. Carahsoft adds a reseller path
      for U.S. public-sector buyers, while Rheinmetall and IHI show that ICEYE can enter sovereign programs through local industry and
      defense-prime style structures rather than only through a direct export sale. Insurance is again different. The Suncorp example
      runs through Arturo and ICEYE together, while MAPFRE RE licensed a global flood-data feed that looks more like a recurring data
      subscription than a one-off image purchase. That diversity is a commercial strength, but it also means channel control,
      procurement cadence, and margin quality likely vary significantly by segment.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU037
      - CU038
      - CU040
