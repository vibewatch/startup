  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration or friction risk
      - Impact
      - Diligence path
    rows:
      - - Sovereign constellation transfers and ministry contracts
        - A few very large defense programs can dominate revenue and backlog
        - Strong ACV but potentially lumpy cash flow and renewal cliffs
        - Request customer revenue concentration by top 5 and top 10 accounts
      - - U.S. public-sector disaster and intelligence demand
        - Procurement route still depends on short-term extensions and incomplete FY2026 program-of-record funding
        - Could delay scaling in a strategically important market
        - Review NRO and broader U.S. contract pipeline by stage and probability
      - - Partner-led government delivery
        - Dependence on Carahsoft, NLT, Rheinmetall, IHI, or local industry can reduce direct account control
        - Faster market entry but potentially lower margin and weaker ownership of end customer
        - Request gross margin by direct vs channel-led accounts
      - - Insurance and reinsurance data subscriptions
        - Public proof exists, but buyer count and renewal performance are opaque
        - Could be sticky recurring revenue, or could remain a small adjunct to defense
        - Request annualized contract value, cohort renewals, and expansion history for hazard-data products
      - - Defense-demand acceleration in Europe
        - Independent coverage warns about bubble risk if military-spending urgency cools
        - Customer acquisition could stay strong near term but become cyclical
        - Stress-test 2027-2029 bookings under slower sovereign spending
      - - Maritime monitoring adjacency
        - Public marketing is stronger than named-customer proof
        - Hard to underwrite maritime expansion until a reference account is verified
        - Request named maritime customers, use-case mix, and renewal status
      - - Customer contract guarantees
        - Financing facilities are explicitly linked to supporting customer contract guarantees
        - Indicates large-program working-capital demands tied to procurement execution
        - Review guarantee requirements by major sovereign contract and associated cash usage
    notes: The public customer story supports real demand, but it does not disclose the concentration profile needed to underwrite durability.
