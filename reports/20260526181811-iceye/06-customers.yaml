    rows:
      - - Sovereign defense and intelligence
        - Defense ministry or armed-forces procurement buyer; ISR operators are users; state budget is payer
        - Persistent SAR imagery, dedicated capacity, sovereign constellation transfer, battlefield monitoring
        - Ukraine MoD, Polish Armed Forces, IHI/Japan pathway, Rheinmetall JV ecosystem
        - Highest-value contracts and strongest strategic wedge
        - No public renewal schedule or customer-share disclosure
      - - Civil government and emergency management
        - Emergency-management buyer; operations and GIS teams are users; government budget is payer
        - Flood impact mapping, situational awareness, post-event validation, response prioritization
        - FEMA via NLT; Transport for NSW / NSW disaster response context; Carahsoft U.S. public-sector channel
        - Expands recurring public-sector disaster-response usage
        - Direct agency contract terms are rarely public
      - - Primary insurers
        - Claims, catastrophe, or operations leader is buyer; claims teams are users; insurer budget is payer
        - Rapid claims triage, flood monitoring, customer communications, disaster-response planning
        - TMNF and Suncorp are named public references
        - Recurring catastrophe and claims workflows can be sticky
        - Pricing, loss-ratio impact, and renewal data are undisclosed
      - - Reinsurers and broker-style catastrophe teams
        - Catastrophe-response or portfolio-risk buyer; portfolio teams are users; reinsurance budget is payer
        - Portfolio situational awareness, rapid loss estimation, catastrophe event response
        - MAPFRE RE global Flood Insights license
        - Looks closer to subscription-like hazard-data revenue
        - Public customer list beyond MAPFRE RE is thin
      - - Partner-mediated public-sector channels
        - Reseller, systems integrator, or local industrial partner shapes procurement route
        - Integration into agency workflows, local delivery, and contracting acceleration
        - Carahsoft, NLT, Arturo, Rheinmetall, and IHI all appear in the public pack
        - Broadens access to otherwise hard-to-win buyers
        - Channel dependence can reduce margin visibility and direct customer control
      - - Maritime and security end users
        - Security analyst or maritime-operations user; unknown buyer/payer in the reviewed pack
        - Vessel tracking, dark-ship monitoring, maritime-domain awareness
        - Sector appears in ICEYE market descriptions and technical materials, but not as a named customer here
        - Potential adjacent growth vector
        - Named production maritime customer proof is missing
    notes: Public segmentation evidence is strongest for defense, disaster response, and insurance; maritime remains a marketed segment with weaker named-customer proof.
