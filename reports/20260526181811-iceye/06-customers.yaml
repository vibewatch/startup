callouts:
  - calloutType: strength
    title: Cross-sector proof is real, not just logo-based
    body: >-
      ICEYE's customer proof spans multiple live operating contexts: a 2026 Ukraine ministry expansion, a sovereign handover to the
      Polish Armed Forces, multi-season FEMA/NLT disaster-response use, TMNF's long-running claims workflow, Suncorp's at-least-one-
      week response improvement, and MAPFRE RE's 2025 global flood-data license. That is materially better evidence than a generic
      customer-logo wall.
