  - id: named-proof
    title: Named customer proof and deployment evidence
    body: |-
      The best public adoption evidence comes from named deployments with concrete operational context. In defense, Ukraine remains
      the clearest current anchor: ICEYE said in January 2026 that a customer within the Ministry of Defence of Ukraine expanded its
      access to high-resolution SAR imagery, extending a relationship that ICEYE traces back to 2022. Poland provides the clearest
      sovereign-procurement proof, with a roughly EUR200 million 2025 contract and a May 2026 handover that ICEYE says put an
      operational MikroSAR system in Polish military hands in under 12 months. Japan is earlier-stage but still notable: IHI and
      ICEYE announced plans for up to 24 domestically manufactured and operated satellites to support Japanese defense priorities.
      Outside defense, FEMA/NLT is the strongest U.S. disaster-response case, with multi-year use since 2021 and quantified 2024
      hurricane-season outputs. Insurance proof is also real rather than logo-only: TMNF describes a live claims workflow, Suncorp
      says the stack improved customer-response timing by at least one week, and MAPFRE RE licensed ICEYE's global flood data in
      2025. Transport for NSW adds government disaster-response proof, but without the same quantified operating metrics.
