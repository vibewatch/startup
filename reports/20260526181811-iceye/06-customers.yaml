      - TU006
    figureRefs:
      - FU001
  - id: durability-risk
    title: Durability, expansion, and concentration risk
    body: |-
      The public record is good enough to show real adoption and some repeat use, but not good enough to prove durable customer
      economics. Repeat-use signals exist: TMNF says its satellite-claims initiative began in 2017, FEMA/NLT says ICEYE has supported
      the agency since 2021, Suncorp says the technology stack has been operational since the 2022 East Coast floods, and ICEYE says
      Ukraine expanded cooperation again in 2026. Those are encouraging markers. But the same pack never discloses NRR, GRR, churn,
      renewal rates, or even a top-customer exposure schedule. That matters because the external picture increasingly points toward
      large, lumpy sovereign programs. Satellite Today says U.S. commercial-SAR procurement still lacks a fully funded program of
      record, while Insurance Journal notes investor concern that Europe's defense boom could become a bubble. Beinsure's note that a
      EUR300 million credit facility supports customer contract guarantees is another clue that multi-year sovereign deals are central to
      the commercial engine. Net: customer proof is credible, especially in defense and disaster response, but concentration and
      durability remain the chapter's biggest unresolved risks.
