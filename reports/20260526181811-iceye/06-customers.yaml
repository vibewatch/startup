chapter:
  number: 6
  title: Customers
  summary: >-
    ICEYE's customer proof is strongest in sovereign defense and disaster-response deployments, with public evidence for Ukraine,
    Poland, FEMA/NLT, TMNF, Suncorp, and MAPFRE RE. The company appears to sell through a mix of direct sovereign procurement,
    partner-led government channels, and subscription-like insurance data licenses, but public retention, renewal, and customer
    concentration disclosure lags the visible adoption footprint. The main caveat is that named maritime proof and customer-level
    economics remain materially under-disclosed.
sections:
  - id: customer-segments
    title: Customer segments and who pays
    body: |-
      ICEYE's public customer surface is not a single-market story. The visible buyers split into at least five groups: sovereign
      defense and intelligence organizations buying persistent all-weather ISR; civil-government emergency managers using flood or
      wildfire products; primary insurers using flood data to accelerate claims and catastrophe response; reinsurers licensing hazard
      intelligence for portfolio situational awareness; and partner-mediated public-sector or security users reached through resellers,
      system integrators, or local industrial counterparts. Carahsoft's U.S. government page shows the disaster-response motion in
      plain language, while ICEYE's own case-study and insurance pages show the insurer and reinsurer motion. The strongest named
      logos today sit in defense and catastrophe-response workflows, not in generic enterprise analytics. Public maritime messaging is
      present in product and market descriptions, but the reviewed pack does not surface a named paying maritime end customer on the
      same footing as Ukraine, FEMA, TMNF, or Suncorp. That distinction matters for diligence: the segment map is broad, but proof
      quality varies sharply by vertical and by who actually signs the contract.
