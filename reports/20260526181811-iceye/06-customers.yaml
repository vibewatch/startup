  - id: TU006
    title: Sales motion / procurement route table
    columns:
      - Route
      - Typical buyer
      - Public evidence
      - Commercial logic
      - Caveat
    rows:
      - - Direct sovereign SAR contract
        - Ministry of defense or national procurement agency
        - Poland contract and Ukraine usage
        - Large ACV, strategic lock-in, high mission relevance
        - Long cycles and export/security constraints
      - - Sovereign constellation transfer / constellation-as-a-service
        - Government seeking domestic capability
        - Poland handover, IHI/Japan pathway, Sacra business-model description
        - Creates multi-year implementation and support work
        - Capex, guarantees, and local-ground-segment complexity are high
      - - Partner-led U.S. public-sector route
        - Federal, state, or local emergency-management buyer reached through reseller or integrator
        - Carahsoft and NLT/FEMA
        - Lowers procurement friction and embeds ICEYE inside existing workflows
        - Direct economic ownership of end account is less visible
      - - Insurance ecosystem partnership
        - Claims or catastrophe operations buyer, often with partner platform in workflow
        - Arturo + ICEYE + Suncorp; TMNF direct workflow
        - Speeds adoption because ICEYE complements existing claims tooling
        - Pricing power and data ownership may be shared with partners
      - - Reinsurance / analytics license
        - Reinsurance catastrophe or portfolio team
        - MAPFRE RE global Flood Insights license
        - Looks closest to recurring data-subscription revenue
        - Public evidence does not show scale of the installed base
      - - Defense-prime / local-industry JV route
        - Armed forces reached via local industrial champion
        - Rheinmetall joint venture; IHI cooperation
        - Can unlock politically sensitive sovereign deals
        - Joint-venture economics and control rights are undisclosed
    notes: The route-to-market pattern is segment-specific; defense tends toward sovereign programs, while catastrophe customers more often buy data products through existing workflow partners.
