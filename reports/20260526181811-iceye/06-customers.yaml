  - calloutType: risk
    title: Durability and concentration are still under-disclosed
    body: >-
      The same public pack that proves adoption does not disclose NRR, GRR, churn, top-customer concentration, or contract-expiry
      timing. Independent coverage also flags procurement friction in U.S. commercial SAR and concern that Europe's defense-demand
      surge could be cyclical. Investors can underwrite adoption from the public record, but not yet customer durability.
    claimRefs:
      - CU031
      - CU032
      - CU033
