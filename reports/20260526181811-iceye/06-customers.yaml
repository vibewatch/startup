figures:
  - id: FU001
    title: ICEYE customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public customer journeys move from segment discovery into partner-structured procurement, then into operational workflows where
      repeat disasters or national-security needs create expansion opportunities.
    data:
      items:
        - label: Segment discovery
          actor: Sovereign defense or intelligence buyer
          touchpoints:
            - Direct SAR capability and revisit-rate proof
            - Local industry or defense-prime alignment
            - Security and sovereignty review
          emotion: Wants sovereign ISR without waiting years for a domestic build
          painpoint: Export controls, budget cycles, and local-content demands slow buying
          opportunity: ICEYE can package dedicated capacity or full sovereign transfer
        - label: Government route
          actor: Emergency-management or civil-government buyer
          touchpoints:
            - Carahsoft or integrator introduction
            - Event-driven case study review
            - GIS and workflow integration check
          emotion: Needs actionable data during a live event, not generic imagery
          painpoint: Procurement timing and workflow integration can block adoption
          opportunity: Partner-led delivery shortens time to operational use
        - label: Insurance evaluation
          actor: Claims or catastrophe-response leader
          touchpoints:
            - Flood case study or pilot
            - Integration with claims or cat platform
            - Response-time ROI review
          emotion: Wants faster triage and better customer communications
          painpoint: Buyers need proof the data changes claims operations, not just maps
          opportunity: Suncorp and TMNF provide operating proof points
        - label: Operational deployment
          actor: Analyst, operator, or field-response team
          touchpoints:
            - TEMPO or claims-platform ingest
            - Flood or SAR tasking cadence
            - Response and prioritization workflows
          emotion: Focused on speed, repeatability, and confidence under bad conditions
          painpoint: Data must arrive fast enough to influence action
          opportunity: Realtime workflows create stickier account behavior than one-off imagery sales
        - label: Expansion loop
          actor: Existing account sponsor
          touchpoints:
            - Repeat disaster season or defense need
            - Wider geography or higher imagery volume
            - New module or sovereign-capability upsell
          emotion: Expands only after operational proof is visible
          painpoint: Public proof rarely shows pricing or renewal economics
          opportunity: Repeat-use signals exist even though disclosed cohort data does not
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU026
      - CU027
      - CU028
      - CU030
      - CU039
      - CU040
