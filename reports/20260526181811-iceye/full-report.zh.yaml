  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架与建议
        blocks:
          - type: paragraph
            body: >-
              ICEYE 更容易让人佩服，而不是按表面估值直接承销。公司现在拥有一组多数后期私营航天公司从未达到的公开证据点：收入超过 €250 million、EBITDA 超过 €100 million、现金超过 €350
              million、现金生成超过 €130 million，以及 €1.5 billion 积压订单。独立报道还把最近披露的融资估值定在约 €2.4 billion，意味着在任何股权结构表调整前，约为过去 12
              个月收入的 9.6x、过去 12 个月 EBITDA 的 24x。对于一个盈利、与防务相关、且主权需求可见的航天资产来说，这些倍数并不荒唐，但也谈不上明显便宜。因此，正确判断是继续研究 /
              观察，而不是买入。公开证据支持一家强公司、一个合理到偏高的价格，以及有意义的战略上行空间；但它没有披露优先股堆叠、合同利润率持久性，也没有披露可扩展数据收入与重硬件主权交付之间的精确结构。在这些缺口关闭前，公司质量和入场价格质量不是一回事。
