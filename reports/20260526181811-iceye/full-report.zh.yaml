      - number: '8.2'
        title: 融资背景与合同可见度
        blocks:
          - type: paragraph
            body: >-
              ICEYE 之所以没有被简单筛成一轮“昂贵私募融资”，是因为故事背后的合同可见度足够深。2025 年 12
              月融资并不是作为通用现金跑道出售，而是被描述为主权卫星系统和数据情报服务的燃料；外部报道还称该轮包括新股资本和老股交易。主权合同组合异常具体。波兰从签约到移交不到一年。瑞典购买了由卫星、数据、软件和地面系统组成的完整主权栈。葡萄牙选择直接采购卫星。德国与
              Rheinmetall 相关的订单总值约 €1.7 billion，IHI 关系则指向一个最多 24 颗卫星的日本星座。2026 年 5
              月的循环信贷额度对估值也重要：它说明即便公司已经盈利，大型合同仍需要担保和营运资本支持。这种组合比纯地球观测叙事更能支撑上一轮价格，但也意味着投资人必须知道未来增长中，高质量经常性服务收入和估值倍数更低的项目交付各占多少。
