      - number: '3.3'
        title: 分发、信任和监管姿态
        blocks:
          - type: paragraph
            body: >-
              这个市场中的竞争信任越来越取决于谁能接入政府和主承包商工作流，而不只是看谁的图像最好。ICEYE 通过芬兰 LOI 获得可信主权牵引，也面向政府销售灾害响应数据；但 Capella 在公开安全栈上更具体：AWS
              GovCloud、FedRAMP High、端到端加密，以及来自 NGA、NRO、U.S. Air Force、U.S. Space Force 和 DIU 的具名信任。Umbra
              用另一套信任故事反击——监管边缘和主权灵活性。它的 FCC 1,200 MHz 批准、NOAA 许可历史和 Stage III NRO 状态告诉买家，其最激进的性能主张已经通过真实外部门槛。Synspective
              全球厚度较薄，但仍值得注意，因为 2025 年 JASDF 安全指南授标显示，公司正在进入防务级保障工作，而不只是民用分析。


              分发也塑造了每个对手被替换的难度。Capella 通过存档 / 任务 API 访问和协同市场进入支持合作伙伴。Umbra 通过 Maxar 等专用容量合作伙伴关系加深分发。Planet 依靠 API、GIS
              集成和广泛存档可得性，在任务讨论前就先进入分析栈。BlackSky 和 Satellogic
              都明确销售主权能力路径，这能让它们从数据供应商变成系统合作伙伴。这意味着市场已不再只是场景质量竞赛：渠道设计、集成姿态和项目控制选项，越来越决定谁会成为国家、机构或企业工作流中的嵌入式供应商。
