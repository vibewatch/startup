  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 具名交易对手、量化结果和重复使用信号同时出现时，证据质量最强；海事仍是公开证据最弱的垂直领域。
    data:
      columns:
        - 结果具体性
        - 生产成熟度
        - 重复使用可见性
        - 收入可见性
      rows:
        - label: Ukraine MoD
          values:
            - 具名部委客户和任务使用；无合同金额
            - 高 — 2026 年关系仍活跃
            - 中 — 披露了 2022 年至 2026 年的扩张
            - 低 — 支出和期限未披露
        - label: Poland Armed Forces
          values:
            - 披露了合同规模和交付速度
            - 高 — 系统已移交并独立运行
            - 中 — 后续支持不公开
            - 中 — 初始合同金额公开，经常性经济性未公开
        - label: FEMA / NLT
          values:
            - 强 — 量化了 2024 年运营产出
            - 高 — 自 2021 年起上线使用
            - 高 — 支持近二十场事件
            - 低 — 直接合同金额不公开
        - label: TMNF
          values:
            - 中等 — 披露了周期时间改善和运营历史
            - 高 — 工作流被描述为正在使用
            - 高 — 项目可追溯至 2017 年
            - 低 — 合同规模和续约不公开
        - label: Suncorp
          values:
            - 中等 — 响应至少缩短一周
            - 高 — 自 2022 年洪水后运营
            - 中 — 暗示重复使用，但合同层面未量化
            - 低 — 定价和期限未披露
        - label: MAPFRE RE / 海事板块
          values:
            - MAPFRE RE 许可具名；海事部分未具名
            - MAPFRE RE 看起来已上线；海事证明较弱
            - MAPFRE RE 近期已采用；海事重复使用不可见
            - 既未披露公开收入贡献，也未披露海事客户经济性
