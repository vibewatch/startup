      - number: '7.4'
        title: 采购、竞争与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的公开项目呈现出清晰的主权模式：瑞典购买卫星、数据、软件和地面系统；波兰接管一套四星系统并独立控制；葡萄牙直接购买卫星；乌克兰扩大星座访问；日本借 IHI 作为本地工业渠道；德国则通过
              Rheinmetall 合资公司获得独占访问侦察能力。这有力证明 ICEYE 与国家安全买家存在产品市场匹配。它也证明，本地合作伙伴、政府预算、产业政策和地缘政治对齐，已经成了公司销售方式的核心。


              独立来源显示，ICEYE 周边的市场并没有停在原地。SpaceNews 描述了运营商争夺有保障政府访问能力的竞赛。Breaking Defense 显示，Capella、ICEYE 和 Umbra 都把 NRO
              雷达工作保留到 2026 年中，Planet 也向类似买家销售防务和情报解决方案。Quilty 还指出一个更结构性的风险：客户拥有自有能力后，主权卫星制造可能蚕食后续第三方数据需求。结果是双面市场风险。ICEYE
              可能继续赢下大型主权交易，但同一批交易也会加剧竞争、偏向本土冠军，并在当前推动增长的地区减少经常性外部数据支出。
