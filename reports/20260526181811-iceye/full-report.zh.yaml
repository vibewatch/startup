  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: ICEYE 的主要风险不是只有需求缺口，而是沿着积压订单转化、担保、交付可靠性和估值几条线传导。
    data:
      nodes:
        - id: n1
          label: 主权 / 国防集中度
          detail: 公开赢单和积压订单越来越绑定政府安全需求。
        - id: n2
          label: 采购和预算周期
          detail: 拨款、审批和本土合作伙伴结构左右订单。
        - id: n3
          label: 积压订单转化波动
          detail: 大型项目会改变收入确认节奏和组合。
        - id: n4
          label: 担保和营运资本
          detail: 客户合同担保和交付义务会吃掉流动性。
        - id: n5
          label: 制造和发射能力
          detail: 产能爬坡和拼车发射节奏决定可交付星座容量。
        - id: n6
          label: 服务可靠性和调试
          detail: 主权客户移交和星座接入必须按时跑通。
        - id: n7
          label: 利润率和融资灵活性
          detail: 执行压力会压缩利润率，并收紧未来融资选择。
        - id: n8
          label: 估值下行
          detail: 集中度、延误或竞争可能压缩倍数和信心。
        - id: n9
          label: 出口管制和隐私负担
          detail: 许可、制裁和投诉义务可能放慢收入或收窄收入空间。
      edges:
        - from: n1
          to: n2
          label: 政府需求占比较高
        - from: n1
          to: n3
          label: 合同组合不均
        - from: n2
          to: n3
          label: 审批节奏
        - from: n3
          to: n4
          label: 里程碑执行
        - from: n5
          to: n6
          label: 产能和排期
        - from: n6
          to: n3
          label: 验收和交付
        - from: n4
          to: n7
          label: 流动性压力
        - from: n3
          to: n7
          label: 收入 / 利润率节奏
        - from: n9
          to: n3
          label: 资格和审批
        - from: n7
          to: n8
          label: 估值传导
    claimRefs:
      - CR008
      - CR031
      - CR036
      - CR041
      - CR056
      - CR057
      - CR058
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: ICEYE 的主权客户交付模式靠监管审批、发射节奏、本土工业主承包商、银行担保，以及少数大型项目里的客户验收撑住。
    data:
      nodes:
        - id: d1
          label: 主权客户
          detail: 瑞典、波兰、葡萄牙、乌克兰、德国、日本、芬兰。
        - id: d2
          label: 本土工业合作伙伴
          detail: Rheinmetall、IHI、Saab，以及波兰地面段合作伙伴。
        - id: d3
          label: 发射清单
          detail: SpaceX 拼车发射节奏和发射可靠性。
        - id: d4
          label: 制造与测试线
          detail: 内部产能爬坡和自有振动测试。
        - id: d5
          label: 监管机构
          detail: 出口管制、遥感许可、隐私监管机构。
        - id: d6
          label: 银团
          detail: 为合同执行提供担保和流动性后盾。
        - id: d7
          label: ICEYE 主权交付平台
          detail: 星座、运营、软件和地面集成。
      edges:
        - from: d2
          to: d7
          label: 本地交付能力
        - from: d3
          to: d7
          label: 补网和部署
        - from: d4
          to: d7
          label: 吞吐量和质量
        - from: d5
          to: d7
          label: 审批和限制
        - from: d6
          to: d7
          label: 保函和流动性
        - from: d7
          to: d1
          label: 主权能力交付
        - from: d1
          to: d7
          label: 需求集中和要求
    claimRefs:
      - CR021
      - CR039
      - CR040
      - CR055
      - CR056
      - CR059
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: ICEYE 看起来是一家强势的主权航天公司，但资本结构层级和合同利润率细节缺失，挡住了按上一轮价格给出明确买入建议。
    data:
      nodes:
        - id: n1
          label: 2025 验证：>€250M 收入、>€100M EBITDA、€1.5B 积压订单
        - id: n2
          label: 主权需求：波兰、瑞典、葡萄牙、德国、日本都有可见度
        - id: n3
          label: 估值：€2.4B 对应约 9.6x 收入、约 24x EBITDA
        - id: n4
          label: 股权结构表和合同利润率透明度缺失
        - id: n5
          label: 军民两用和集中度风险抬高折现率
        - id: n6
          label: 建议：继续研究 / 观察
      edges:
        - from: n1
          to: n6
          label: 支撑质量判断
        - from: n2
          to: n6
          label: 支撑战略上行空间
        - from: n3
          to: n6
          label: 需要估值纪律
        - from: n4
          to: n6
          label: 挡住明确买入结论
        - from: n5
          to: n6
          label: 压低倍数信心
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV023
      - CV029
      - CV048
      - CV052
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 把不同收入倍数套到 ICEYE 已披露的 2025 收入上，可以看出投资逻辑在多大程度上取决于投资人把 ICEYE 当作高溢价主权航天资产， 还是带有项目风险的地球观测公司。
    approximationNotes: 各柱把示意性收入倍数套用于已披露的 >€250M 2025 收入基数。这是敏感性框架，不是谈判后的公平性意见。
    data:
      items:
        - label: 5x 收入 — 公开市场 EO 倍数重置
          value: 1250
          unit: €M
        - label: 8x 收入 — 审慎溢价
          value: 2000
          unit: €M
        - label: 9.6x 收入 — 上一轮
          value: 2400
          unit: €M
        - label: 12x 收入 — 主权执行强劲
          value: 3000
          unit: €M
        - label: 14x 收入 — 国防航天高溢价情景
          value: 3500
          unit: €M
    claimRefs:
      - CV001
      - CV011
      - CV029
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准和乐观区间显示，即便公司层面证据很强，下行空间仍可能很大，因为资本结构层级和合同质量问题还没解开。
    approximationNotes: 区间来自分析师情景分析，使用已披露的 2025 指标、主权合同可见度和保留的可比公司区间。它们不应被当成点估计。
    data:
      items:
        - label: 悲观 — 积压订单延后或倍数重置
          low: 1200
          high: 1800
          unit: €M
        - label: 基准 — 执行跑近上一轮投资逻辑
          low: 2200
          high: 2800
          unit: €M
        - label: 乐观 — 主权交付兑现，加上高溢价退出选择权
          low: 3500
          high: 4500
          unit: €M
    claimRefs:
      - CV049
      - CV050
      - CV051
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式评分显示，公司在需求、验证和战略位置上很强，但对新投资人来说，价格支撑和透明度只算中等。
    approximationNotes: 分数是 1 到 5 的编辑判断，依据截至 2026-05-26 保留的公开证据。它们用于概括决策，而不是替代底层分析。
    data:
      items:
        - label: 市场拉力
          value: 4
          unit: /5
          note: 主权和国防需求在多个国家都看得见。
        - label: 合同可见度
          value: 4
          unit: /5
          note: 对一家私营航天公司来说，公开合同组合少见地具体。
        - label: 经济性
          value: 4
          unit: /5
          note: 收入、EBITDA、现金和积压订单都很强，但未经审计。
        - label: 竞争护城河
          value: 3
          unit: /5
          note: 商业 SAR 需求真实存在，但 Capella 和 Umbra 让市场保持竞争。
        - label: 估值支撑
          value: 3
          unit: /5
          note: 上一轮价格说得过去，但按历史指标看并不明显便宜。
        - label: 透明度
          value: 2
          unit: /5
          note: 股权结构表、契约条款和合同利润率拆分仍未公开。
        - label: 退出清晰度
          value: 3
          unit: /5
          note: IPO 和战略出售路径都说得通，但还不够具体，不能纳入定价。
    claimRefs:
      - CV001
      - CV005
      - CV023
      - CV041
      - CV044
      - CV048
      - CV052
