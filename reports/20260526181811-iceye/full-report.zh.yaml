      - number: '2.4'
        title: 约束、矛盾和未解决的测算缺口
        blocks:
          - type: paragraph
            body: >-
              最重要的约束是，商品化层的公开定价权很难守住。Copernicus 为较慢工作流提供免费雷达替代；当云层 / 夜间限制可接受时，Planet 等光学存量厂商仍控制许多预算；多个商业 SAR
              厂商如今都在销售亚米级成像、快速任务和防务级工作流。供给基础扩张应能推动采用，但也增加了存档影像、例行监测和无差异采集更难变现的风险。


              第二个约束是分析不透明。公开市场报告把硬件、分析、灾害损失池和相邻软件混在一起，使干净隔离纯 SAR TAM 变得困难。ICEYE
              本身是私营公司，重大政府合同金额很少披露，公开材料也没有清楚拆分防务、灾害和保险收入。结果是，一个站得住脚的 SOM
              仍需要自下而上尽调合同规模、续约率、保险公司挂接点，以及真正需要高端任务的需求比例。因此，本章中的矛盾估算不是缺陷，而是特征：它们说明边界纪律比引用最大可得市场数字更重要。
