chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品和当前阶段
        blocks:
          - type: paragraph
            body: >-
              ICEYE 如今更像一家围绕合成孔径雷达打造的主权情报公司，而不是小众地球观测初创公司。公司页面、防务客户公告和独立报道给出的核心产品逻辑一致：ICEYE 拥有并运营 SAR
              卫星，靠这些卫星在任何天气和光照条件下交付影像和分析服务，也向希望拥有自有系统的政府销售主权任务包。这一组合很关键，因为它把商业模式从简单转售数据，推成硬件、任务系统、数据服务和长期国家安全项目的混合体。


              公开规模信号也指向一家后期私营公司，而不是早期风投故事。ICEYE 称其创立并总部位于芬兰，在全球运营，在欧洲、中东、亚太和美国拥有 1,000+
              名员工。独立数据库大体证实了芬兰根基和大型国际足迹，尽管具体办公室数量和创立年份更嘈杂。因此，后续章节可以复用的运营图景已经足够清楚：ICEYE 是一家扎根芬兰、全球部署的 SAR
              公司，防务拉力很强，但若干“封面事实”仍需要明确保留限定，不能给出虚假精确性。
