      - number: '6.4'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开资料足以证明 ICEYE 已被真实采用，也出现了一些重复使用迹象，但还不足以证明客户经济性足够持久。重复使用信号确实存在：TMNF 称其卫星理赔项目始于 2017 年；FEMA/NLT 称 ICEYE 自
              2021 年起支持该机构；Suncorp 称这套技术栈自 2022 年东海岸洪灾后已经投入运行；ICEYE 称乌克兰在 2026
              年又扩大了合作。这些标志令人鼓舞。但同一组公开资料从未披露净留存率（NRR）、总留存率（GRR）、流失率、续约率，甚至没有披露头部客户敞口表。这很关键，因为外部图景越来越指向大型、块状的主权项目。Satellite
              Today 称美国商业 SAR 采购仍缺少一个资金完全落实的正式项目，Insurance Journal 则提到投资人担心欧洲防务繁荣可能变成泡沫。Beinsure 提到一笔 EUR300 million
              信贷额度用于支持客户合同担保，进一步说明多年期主权交易是商业引擎的核心。结论：客户证据可信，尤其是在防务和灾害响应场景，但集中度和持久性仍是本章最大的未解风险。
