  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度或摩擦风险
      - 影响
      - 尽调路径
    rows:
      - - 主权星座移交和部委合同
        - 少数超大型国防项目可能主导收入和积压订单
        - ACV 强，但现金流可能不平滑，并有续约悬崖
        - 要求提供前 5 和前 10 大账户的客户收入集中度
      - - 美国公共部门灾害与情报需求
        - 采购路径仍依赖短期延期，以及尚未完整落地的 FY2026 正式项目资金
        - 可能拖慢战略重要市场的规模化
        - 按阶段和概率审查 NRO 及更广泛美国合同管线
      - - 合作伙伴主导的政府交付
        - 依赖 Carahsoft、NLT、Rheinmetall、IHI 或本地产业，会削弱直接账户控制力
        - 市场进入更快，但毛利率可能更低，对终端客户的掌控也更弱
        - 要求按直销与渠道主导账户提供毛利率
      - - 保险和再保险数据订阅
        - 有公开证明，但买方数量和续约表现不透明
        - 可能是有粘性的经常性收入，也可能只是国防业务的小附属
        - 要求提供灾害数据产品的年化合同价值、队列续约和扩张历史
      - - 欧洲国防需求加速
        - 独立报道警告，若军费支出紧迫性降温，可能出现泡沫风险
        - 客户获取短期可能仍强，但会转向周期性
        - 在主权支出放缓情景下压力测试 2027-2029 年签约额
