            body: >-
              ICEYE 的公开客户面不是单一市场故事。可见买家至少分成五类：购买持续全天候 ISR
              的主权防务和情报组织；使用洪水或野火产品的民事政府应急管理者；用洪水数据加速理赔和灾害响应的直接保险公司；为组合情境感知许可灾害情报的再保险公司；以及通过经销商、系统集成商或本地工业对口方触达的合作伙伴中介型公共部门或安全用户。Carahsoft
              的美国政府页面用直白语言展示灾害响应动作，ICEYE
              自己的案例研究和保险页面展示保险公司和再保险公司的动作。当前最强具名客户标识位于防务和灾害响应工作流，而不是泛企业分析。海事信息出现在产品和市场描述中，但审阅材料没有浮现与乌克兰、FEMA、TMNF 或
              Suncorp 同等强度的具名付费海事终端客户。这一区分影响尽调：细分图谱很宽，但证据质量因垂直领域和实际签约方而大幅不同。
