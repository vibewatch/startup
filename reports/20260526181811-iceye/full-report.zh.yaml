      - number: '4.4'
        title: 资本充足性、融资和流动性支持
        blocks:
          - type: paragraph
            body: >-
              2024 年到 2026 年中，ICEYE 的资本故事明显改善。2024 年，公司完成 $93 million 成长轮，随后又增加 $65 million 扩展轮；管理层明确称这一扩展轮是债务和股权的混合，使
              2024 年融资达到 $158 million，累计融资超过 $500 million。到 2026 年 3 月，公司披露现金超过 €350 million，2025 年经营现金流超过 €130
              million，EBITDA 超过 €100 million。2026 年 5 月，公司又新增 €300 million
              三年期循环信贷额度。合在一起，这些数据点意味着公司已从风投注资扩张，转向拥有内部现金创造和银行流动性的更多元资本结构。


              这笔信贷额度尤其有信息量，因为公司没有把它框定成泛泛的资产负债表缓冲。ICEYE
              表示，循环贷款支持客户合同担保，并作为流动性后盾。这说明主权合同即使在公司转为盈利后，也会创造真实营运资本和履约担保需求。换句话说，资产负债表看起来更强，但仍必须支撑大型防务和主权项目伴随的履约义务和交付风险。管理层没有近期新融资需求的公开报道在方向上让人安心，但投资者仍需要契约条款细节、受限现金拆分、担保使用情况，以及
              12 至 24 个月现金桥，才能判断业务已完全自我供血。
