      - number: '4.5'
        title: 盈利能力判断和尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              ICEYE
              现在看起来比许多私营航天公司更容易融资，因为它已经从纯粹承诺跨过门槛，披露了收入、EBITDA、经营现金创造和在手订单。公开证据支持这样一个判断：公司已经搭起多个变现渠道，主权需求也在快速转化为大合同。相比早期公开记录只围绕技术里程碑和融资叙事，这确实提升了收入质量。


              但本章仍不能给出干净的核保绿灯，因为剩余私有指标正是判断耐久性所需的指标。公开材料没有把主权硬件和服务收入，与经常性影像或分析收入拆开。它们没有披露分部毛利率、维护性资本开支、折旧、营运资本强度、担保使用或在手订单转化时点。Companies
              House
              可见文件覆盖的是英国子公司，而非合并母公司。主要反向信号也不是运营性，而是战略性：在地球观测竞争推动运营商走向灵活定价、订阅和定制主权星座的同时，公司的增长和在手订单越来越绑定主权和防务需求。因此，正确判断是动能为正，对组合和利润率可见度保持谨慎，并且详细核保仍被阻塞。
