  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和客户工作流
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的产品最适合理解为建立在同一 SAR
              底座上的一组相连运营模式。低端客户购买存档影像、发起新采集任务，或把任务和目录访问集成进自己的软件。高端政府购买主权任务，把卫星、地面基础设施、软件、分析和战术利用工具打包，并宣传可在 12
              个月窗口内获得首个能力。因此，公司卖的不只是像素，而是控制权、延迟压缩、工作流压缩和国家自主性。


              客户工作流也很具体。用户定义感兴趣区域，选择存档数据或新任务，然后把输出路由到自助下载、API 驱动管线，或主权 ISR 运营闭环。SkyFi 的 ICEYE US Direct 页面和 ICEYE 自己的
              API 界面展示了一条实际获取路径：定义 AOI、选择成像模式、监控状态，并接收 GeoTIFF/PNG/GeoJSON 输出。面向开发者的公开界面比典型 SaaS 平台更窄，但它是真实存在的：ICEYE
              维护公开 GitHub 文档仓库，招聘材料也明确提到技术作业和 GitHub 或作品集链接。这种组合说明，产品动作优先考虑集成，而不是开源生态。
