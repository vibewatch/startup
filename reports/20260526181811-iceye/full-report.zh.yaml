      - number: '2.3'
        title: 防务、灾害响应和保险的需求驱动
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动出现在三个地方。第一，防务采购已经把商业 SAR 作为主权系统补充常态化。ICEYE 的芬兰交易、Capella 的 NRO 合同、Umbra 的 Stage III NRO 授标，以及
              Synspective 的 JASDF 安全项目都说明，政府越来越把商业雷达视为 ISR 架构中的永久组成，而不是一次性实验。第二，灾害经济性持续恶化。Swiss Re 如今把年度保险灾害损失超过 $100
              billion 视为常态；Munich Re 围绕更快理赔和应急响应成本明确销售参数化自然灾害解决方案；FEMA/Copernicus 也维持运营性制图项目，把遥感变成有预算的工作流。


              第三，产品经济性越来越偏向能把成像接入更快运营周期的供应商。ICEYE 面向优先用户宣传低于一小时或同周期交付；Capella 宣传每 20 分钟自动任务；Synspective
              把每日重访和轨道设计作为变化检测关键卖点。这些不是面子指标。它们是让政府在任务窗口关闭前做出反应，或让保险公司在定损积压形成前触发分诊的机制。气候风险和地缘政治冲突放大了这些工作流的紧迫性，因此最有价值的支出位于高端、低延迟细分，而不是商品化存档影像。
