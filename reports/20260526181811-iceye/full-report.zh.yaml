  summary: >-
    ICEYE 是一家扎根芬兰的 SAR 卫星公司，已从销售雷达影像扩展到为政府客户搭建主权情报系统，同时仍服务灾害、保险及其他监测工作流。截至 2026 年研究日，公开披露显示，公司拥有 1,000+ 名员工，2025 年收入超过
