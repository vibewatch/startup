      - number: '5.3'
        title: 主权星座方案、制造和发射依赖
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的差异化越来越来自快速打包主权能力，而不只是运营商业舰队。missions 和 federate
              页面销售主权所有权、国家指挥权，以及通过统一软件层汇聚盟友能力且不交出控制权的能力。Transporter-16 发布和 Janes 报道显示，这不是假设：ICEYE
              正把卫星部署进一支混合舰队，同时服务自有商业星座，以及波兰、葡萄牙和 ICEYE US 的主权项目。


              因此，依赖图谱既是工业性的，也是数字性的。发射节奏依赖 SpaceX 拼车和 Exolaunch 等集成伙伴。制造规模依赖 ICEYE 自己的产能爬坡和本地工业伙伴关系。公司称 2026
              年正走向每周一颗卫星；Rheinmetall 计划中的 Neuss 合资公司和 Space42 的阿联酋制造合资公司，则显示公司有意推动生产区域化、供应链本地化，并把 ICEYE
              嵌入国家项目。这会强化政府客户护城河，但也带来对伙伴设施、审批、发射可得性，以及在自有和主权舰队之间保持软件定义升级同步的执行依赖。
