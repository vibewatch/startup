  - id: TV005
    title: 投资逻辑破裂和否决触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 为什么破坏投资逻辑
      - 行动含义
    rows:
      - - 在手订单转化延迟
        - 德国或波兰里程碑明显后移，或 2026 年增长不再像公司所说的规模翻倍叙事。
        - 上一轮价格依赖在手订单转化为已确认的高质量收入。
        - 把假设重置到悲观情景，且不要加仓摊高。
      - - 利润率稀释显现
        - 收入增长，但主权交付被证明硬件和服务占比高，EBITDA 因而守不住。
        - 只有主权增长仍有吸引力的经济性，这个倍数才站得住。
        - 按更低利润率和更低倍数重新承销。
      - - 优先级资本回归
        - 透明度改善前，公司引入新债、结构化股权或偏重优先权的资本。
        - 新融资很可能先保护公司，而不是保护新普通股。
        - 把新一轮视为稀释风险，而不是验证信号。
      - - 防务集中度仍然极高
        - 非防务多元化仍居次要，欧洲主导的主权需求继续主导叙事。
        - 客户和预算集中会抬高折现率，也会缩窄买家范围。
        - 仓位保持小，价格纪律要更严。
      - - 军民两用或政策反弹升温
        - 战争监视审查、出口管制摩擦或政治争议明显增加。
        - 即使需求健康，声誉和政策风险也会压缩倍数。
        - 暂停新增资本，先更新风险备忘录再推进。
    notes: 这些触发因素刻意设计成可用于组合行动，并绑定可观察的财务、交付、融资或政策事件，而不是泛泛的情绪。
    claimRefs:
      - CV009
      - CV025
      - CV027
      - CV028
      - CV047
      - CV048
      - CV051
      - CV053
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表和清算瀑布
        - 当前持股、股份类别条款、反稀释和优先权堆叠。
        - 决定新投资人在下行情景中实际拥有什么。
        - 向管理层或法律顾问索取最新股权结构表和瀑布模型。
      - - 审计财务和分部结构
        - FY2025 审计报表，以及 2026 年中期在影像、软件和主权项目交付之间的拆分。
        - 需要据此判断当前盈利能力是否持久、可扩展。
        - 索取审计财务和管理报表包。
      - - 在手订单转化排期
        - 项目级时间表、收入确认机制、取消权和续约假设。
        - 只有在手订单能干净转化为现金和利润率，它才支撑估值。
        - 审查在手订单账龄和合同里程碑排期。
      - - 合同利润率画像
        - 按德国、波兰、瑞典、葡萄牙、乌克兰和日本项目拆分的毛利率和营运资本强度。
        - 大型主权项目可以证明规模，同时仍可能伤害股权质量。
        - 索取合同级利润率桥接和交付后支持假设。
      - - 担保、契约和受限现金
        - RCF 提款条件、担保使用、抵押包和任何受限现金要求。
        - 这些条款可能显著改变实际杠杆和下行回收。
        - 审查融资额度文件和资金契约模型。
      - - 退出准备度
        - 董事会材料、投行讨论、IPO 准备工作流，或战略兴趣证据。
        - 退出可选性只有不止是叙事时，才有助于估值。
        - 向管理层询问时间表、顾问和关口里程碑。
    notes: 这些是把本章从公开来源价格框架推进到真正承销决策所需的最低问题。
    claimRefs:
      - CV044
      - CV045
      - CV048
      - CV052
      - CV053
