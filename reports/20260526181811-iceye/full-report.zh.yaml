      - number: '7.2'
        title: 监管与法律状态
        blocks:
          - type: paragraph
            body: >-
              ICEYE 自己的治理材料明确显示，合规负担处在业务中心。公司明确强调出口管制、制裁筛查、供应商合规和产品负责任使用，并把 2026 年改善合规培训和监测设为目标。其隐私通知也把 ICEYE
              定位为数据控制者，承担正式的访问、删除、更正、可携带和投诉义务。这些披露方向上是正面信号，因为它们说明管理层没有把合规当成边缘事项。但它们也确认，ICEYE 的增长市场——防务、主权 ISR
              和跨境数据交付——都带着实质性的法律和监管负担。


              外部监管背景也强化了这一点。美国 Office of Space Commerce 表示，私人遥感运营商根据 15 CFR Part 960
              获许可并接受合规监测，并会跨机构协调，以保护国家安全利益和国际义务。即便 ICEYE
              完整许可版图未公开，含义也很直接：最终用途限制、制裁控制、遥感审批和隐私义务，都会压缩可服务客户范围、数据交付方式和主权项目执行速度。经审阅来源中没有出现公开执法记录，但这是披露缺口，不是健康证明。
