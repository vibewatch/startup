      - number: '4.3'
        title: 单位经济代理指标和星座资本强度
        blocks:
          - type: paragraph
            body: >-
              ICEYE 现在已有足够公开数据讨论单位经济代理指标，但还不足以计算真实毛利率或回本。收入侧，公开价目表给出了按需影像变现上限；主权合同则显示，当 ICEYE
              把卫星、软件、地面系统和培训打包时，可以拿到大得多的平均合同价值。成本侧，最有用的公开信号是运营性而不是会计性：NASA 评估显示星座仍在快速扩张，FCC 授权进一步美国持牌增长，外部报道描述了 10 至 11
              周建造周期，产出目标是每年 50 颗卫星，最终达到 100 颗。Payload 和 SatNews 也报道了公司对设施和内部振动测试的投资。


              这些信号指向一家单位经济随规模改善但仍资本密集的公司。同一星座可以服务防务、保险和银行用例，这是真实的固定成本复用优势。不过，公开记录仍遗漏了核保利润率路径最关键的项目：单星建造成本、发射成本负担、维护性资本开支、折旧政策、主权项目直接支持成本，以及影像、分析和硬件较重的任务交付之间的分部毛利率。正确解读不是单位经济很差，而是它们从公开证据看仍只部分可见。
