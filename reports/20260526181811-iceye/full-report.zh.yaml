      - number: '3.4'
        title: 切换成本、护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的护城河只在全天候紧迫性和项目控制同时重要的工作流部分才耐久。Tactical Access 和主权卫星项目确实创造切换成本，但市场证据显示，这些切换成本并非绝对。Capella
              可以在自动化和美国政府就绪度上挑战，Umbra 可以在分辨率和定制主权结构上挑战，BlackSky 可以在订阅采购和长期主权项目上挑战，Planet 可以用存档驱动的上下文加 API
              挑战。多归属已经在证据中可见：Maxar 把 Umbra SAR 打包进多源产品，Planet 也公开销售监测与任务之间的提示引导联动。买家因此可以在紧急 SAR 窗口保留
              ICEYE，同时把其他监测层路由到别处。


              反向证据两面都切。Capella 宣传 25 cm、Umbra 宣传 15 cm 级性能时，ICEYE
              不能声称拥有独一无二的分辨率优势。定价不透明可能支撑溢价销售，但也给开放数据替代品和订阅型光学厂商留下空间，把买家预期锚定在更低位置。与此同时，竞争威胁也不是无敌的。BlackSky 自己的 10-K
              显示收入集中，Synspective 的公开平台仍明确处在从有限可用性扩张的阶段。结论是，ICEYE 的护城河在防务和争议环境任务中最强，在广泛监测或成本敏感账户中更弱，在客户愿意组合
              SAR、光学和开放数据工作流而不是标准化到单一专有栈的地方最脆弱。
