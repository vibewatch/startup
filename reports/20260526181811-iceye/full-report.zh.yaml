      - number: '3.2'
        title: 能力和打包对比
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的公开优势不只是“更好的 SAR”。优势在于全天候成像、时间关键型打包和主权项目可信度的组合。ICEYE 称，标准公开任务仍从电子邮件开始，从下传到交付平均低于四小时；Tactical Access
              则增加保证窗口、直到过境前两小时仍可重定任务，以及 1 小时内交付。这让 ICEYE 在任务紧急、云层遮挡或政治敏感的场景中最强。但分辨率已不再是干净的护城河：Capella 宣传 0.25 m
              方位向分辨率、低于 20 分钟的任务确认、每 20 分钟运行一次的调度器，以及全自动控制台 / API 工作流；Umbra 宣传 15 cm 持牌能力和灵活的自建自有 / 租赁 /
              混合任务模式。Synspective 公开层面没有 Capella 那么强调自动化，但它仍开放存档、任务和 API 功能，并正建设 30 颗卫星星座。


              替代品集合靠工作流宽度和采购简单性竞争。Planet 提供 50 cm 任务、每日多次重访、四小时内交付，以及广泛的存档加 API 平台。BlackSky 把 35 cm Gen-3
              影像、分析和主权服务打包成年费或多年订阅结构，而不是一次性购买单景影像。Satellogic 推动直接任务和星座即服务，并明确围绕频率、分辨率和价格点做表述。免费公共数据则是另一个极端：Copernicus 和
              Landsat 不提供优先任务，但它们把监测起始价格实质性降为零。实际结果是，当买家需要有保障的 SAR 专属访问时，ICEYE 最容易赢；当存档宽度、采购熟悉度或低成本更重要时，替代品更有杠杆。
