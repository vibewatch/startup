  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和测算逻辑
        blocks:
          - type: paragraph
            body: >-
              ICEYE 不应拿整个位置智能栈来测算。公司 2026 年材料本身围绕三个紧急工作流展开：主权和盟友 ISR、政府灾害响应制图，以及保险公司的灾害 /
              参数化产品。这些工作流消耗的是高端全天候持续观测、任务优先级和可直接决策的衍生产品。它们不等于整个地理空间分析市场；后者还包括测绘硬件、制图软件、带导航功能的应用，以及广义企业位置智能。


              公开市场估算之所以分歧很大，是因为它们衡量的层级不同。Grand View 的地理空间分析视角很宽，而且偏软件；MarketsandMarkets 的 EO
              小卫星视角窄得多，更接近硬件加数据栈；它的地理空间影像分析视角则介于两者之间。ICEYE 真正可服务市场还要更窄，因为公司只在买家愿意为雷达日夜不间断、穿云采集以及更快任务和交付支付溢价的地方竞争。免费
              Sentinel-1 数据仍是非紧急监测的有意义替代品，因此可变现边界由紧迫性、重访、分辨率和工作流集成定义，而不是由 SAR 影像存在本身定义。
