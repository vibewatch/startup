      - number: '1.3'
        title: 资本结构和运营规模
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的公开融资路径已经足够深，可以支撑“后期私营公司”分类，尽管准确累计融资总额仍有保留。官方新闻稿记录了 2020 年 $87 million Series C、2022 年 $136 million
              Series D、2024 年 $158 million 债股混合融资，以及 General Catalyst 领投的 2025 年 12 月融资。独立报道补充称，2025 年这一轮包括 €150 million
              新股和 €50 million 老股配售，估值 €2.4 billion。因此，最保守的累计资本表述不是给出完全精确的审计数，而是公司披露的“迄今约 €600 million”，并由 2025 年 12
              月独立报道支撑。


              到 2026 年 3 月，ICEYE 披露未经审计的 2025 年业绩后，公开经营指标明显变强：收入超过 €250 million，EBITDA 超过 €100 million，现金超过 €350
              million，经营现金流超过 €130 million，在手订单 €1.5 billion。这些不是面子指标；它们意味着防务驱动需求、主权项目和长周期合同已经在转化为现金创造。2026 年 5 月的 €300
              million 循环信贷额度进一步说明，短期瓶颈更可能是执行和合同交付，而不是原始资本获取。主要剩余量化缺口是确切客户数、经审计账目，以及完整核对过的累计融资桥。
