      - number: '7.3'
        title: 运营与星座风险
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在节奏、吞吐和补星。Payload 报道称，ICEYE 计划在 2026 年发射超过 25 颗卫星，把产能提升到每年 50 颗卫星，中期冲向 100 颗，并把振动测试内化。Calibre
              Defence 另报道称，2026 年 3 月 Transporter-16 发射后，ICEYE 已有 70
              套系统在轨。这些数据描绘的是一家以极快速度扩大硬件和主权交付的公司，几乎没有余地承受质量滑坡、发射瓶颈或调试延误。它们也意味着，尽管 ICEYE 正把更多测试能力内化，公司仍高度依赖第三方发射节奏。


              星座损耗风险仍披露不足。UNOOSA 的缓解指南要求运营商尽量减少碎片释放、降低解体风险、限制意外碰撞暴露，并在任务结束后移除或以其他方式处置 LEO 航天器。经审阅公开来源没有披露 ICEYE
              的故障率、保险损失记录或离轨执行记录，因此投资人还无法量化真实替换负担。这个风险同时是运营风险和财务风险：任何一组在轨故障、发射延误或处置不合规，都会压低可交付能力、拖延主权验收里程碑，并在积压订单转成现金前迫使公司继续给星座投钱。
