      - number: '8.3'
        title: 可比公司与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比公司分析给出的不是确信，而是纪律。Planet 基于申报文件的公开股权标尺约为收入的 2.4x，BlackSky 和 Satellogic 则说明，当市场情绪摆动时，小市值航天估值会非常波动。Rocket
              Lab 展示了相反极端：多元化防务航天平台可以获得远高于纯地球观测公司的公开市场溢价，但那是更宽产品版图、更大规模和更清晰公开市场可信度的回报。Capella 和 Umbra 作为私营 SAR
              参照很有用，因为它们持续保有 NRO 位置，验证了国家对商业雷达能力的真实需求；但它们不能提供干净的公开定价锚。实际含义是，ICEYE 约 9.6x 的过去 12 个月收入倍数，只有在投资人相信 2025
              年盈利和积压订单质量能延续到 2026-2027 年时才站得住，而不是因为公开可比公司集合逼出了这个答案。按情景看，如果主权项目干净转化，上一轮估值就是合理基准情景；如果重硬件执行或两用用途反弹把倍数压向公开
              EO 标尺，它就显得偏高；如果德国、波兰、瑞典和日本证明主权系统经济性可以在规模化后重复，估值仍可能继续上修。
