      - number: '5.4'
        title: 信任、合规、路线图信号和技术风险
        blocks:
          - type: paragraph
            body: >-
              ICEYE 拥有比许多私营航天公司更可见的信任支撑。其公开治理和信任中心材料展示 ISO/IEC 27001:2022 与 ISO
              9001:2015、出口管制和制裁筛查、供应商准则要求，以及举报流程。网站隐私声明明确按 GDPR 框架表述；ICEYE US API 页面声称传输中和静态加密，并对齐 NIST
              800-171。这些是防务和关键基础设施买家的有意义正向信号，因为它们说明公司把合规理解为产品的一部分，而不是后台事后补课。


              需要保留的点是，最强信任主张大多停留在政策和认证层，而不是深度架构披露。公开记录没有 SOC 2 报告、FedRAMP 包、渗透测试摘要，也没有 ISR Cell 安全边界的详细公开描述。同样，Connect
              和分析性能主张方向上强，但没有独立审计。路线图上，可见顺序是连贯的：2024 年 API，2025 年 Gen4 商业发布和伙伴集成，2025 年通过 SkyFi 自助访问，以及 2026
              年生产和主权制造扩张。因此，主要技术风险不是 ICEYE 缺少产品路线图；而是公司正快速上移到主权系统和订阅访问，公开记录却仍让关键可靠性、安全和生命周期细节保持不透明。
