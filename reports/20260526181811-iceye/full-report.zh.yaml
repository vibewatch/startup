  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >-
              ICEYE 所处的是一个集中度较高的直接同业集合，而不是宽泛无差异的 EO 市场。证据最充分的直接 SAR 同业是 Capella、Umbra 和 Synspective：它们都销售商业 SAR
              任务；Breaking Defense 报道称，NRO 当前 Stage III 商业雷达阵容到 2026 年 7 月只包括 ICEYE US、Capella Space 和
              Umbra。这很关键，因为美国政府是最难赢下的商业雷达买家之一，当前项目验证收窄了可信头部梯队。Synspective 不在这组三家美国雷达供应商中，但它的 StriX 星座、存档 / 任务 API 和
              JASDF 安全工作，仍使其成为亚太政府和基础设施工作流中的真实同业。


              替代品集合比直接 SAR 集合更宽。Planet、BlackSky 和 Satellogic 都能解决同一客户任务的部分需求——持续监测、变化检测和低延迟值守——即使它们无法匹配 ICEYE
              的传感器物理属性。Planet 以 15 年、50 PB 存档和每日陆地覆盖竞争。BlackSky 以 35 cm Gen-3 影像、AI 分析和更容易让部分买家做预算的订阅式采购语言竞争。Satellogic
              以高性价比、高频光学访问和安全直接任务竞争。在低端，Copernicus 和 Landsat 仍是有意义的现状替代方案，因为它们免费或不收费，并且足以支撑基线覆盖或内部分析原型。这意味着 ICEYE 不只和其他
              SAR 厂商竞争；它还在和工作流存量方案以及免费数据竞争。
