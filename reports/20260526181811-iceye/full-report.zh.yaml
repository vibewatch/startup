      - number: '2.2'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              买方结构按垂直领域差异很大。在防务中，买方通常是国防部、情报机构或国家项目办公室；最终用户是 ISR
              分析师或操作员；付款方则是主权安全、现代化或情报预算。这些买家最看重低延迟、安全交付、灵活任务，有时还要掌握卫星本身的主权控制权。ICEYE 的芬兰公告和竞争对手 NRO
              授标显示，商业模式可以从数据即服务延伸到专用容量。


              在灾害响应中，买方是民防机构、联邦应急办公室或地方 / 州政府；用户是 GIS
              团队和应急管理者；付款方通常是韧性、应急管理或保险关联的公共预算。在保险中，买方常位于灾害、理赔、承保或创新团队，付款方则可能是保险公司、再保险公司、公共部门项目或风险池。这些细分的共同点是：当工作流在运营上有时间敏感性时，支付意愿会上升——边境监测、实时灾害评估或赔付自动化都是如此。因此，任务速度、保证采集窗口和机器可读输出，至少和原始影像可得性同样重要。
