        - 配置任何敞口时按下行不对称性定规模，不要追叙事动量。
      - - 估值立场
        - 合理到偏高
        - 如果 2026 年执行守住，~9.6x 过去 12 个月收入和 ~24x 过去 12 个月 EBITDA 还能成立，但明显容错空间不大。
        - 坚持要么拿到更强证据，要么拿到更好价格。
      - - 什么会提升评级
        - 经审计报表、积压订单转化细节、合同利润率证据和股权结构表清晰度
