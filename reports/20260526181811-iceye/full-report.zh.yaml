      - number: '7.5'
        title: 财务与执行层面的否决条件
        blocks:
          - type: paragraph
            body: >-
              财务风险现在不再主要是活下去，而是执行杠杆。ICEYE 的盈利和现金生成是真实的，但 2026 年 5 月的 RCF
              被定义为支持合同担保和流动性，而不是泛泛的资产负债表优化。这种表述意味着，主权合同仍会消耗担保能力和营运资本注意力。Sacra
              和合作伙伴披露也显示，少数大型主权项目就能迅速改变收入结构。如果这些项目滑坡，即便需求没有崩塌，现金转化、利润率兑现节奏和融资灵活性也会恶化。


              这让人员和流程容量变得关键。合规团队必须扩展出口管制和制裁运营。财务部门必须管理担保和银行关系。工程团队必须在扩大产量的同时把测试内化。项目团队必须把可运营星座移交给主权客户，同时不能错过验收里程碑。公开来源仍未披露头部客户集中度、担保使用率、出口许可清单或卫星故障历史。在这些缺口关闭前，最清晰的投资逻辑击穿触发点，是可监控的运营事件：主权集中度继续上升、相对
              2026 年计划出现发射或调试失误、出现担保限制新奖项的证据，或证明主权买家偏好自有能力但减少持续第三方数据购买。
