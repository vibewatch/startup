  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高的剩余风险在于主权客户集中、采购依赖、制造 / 发射执行，以及资本密集型星座支撑。
    approximationNotes: 序数标签是基于证据的分析师判断，不是公司提供的概率或风险分数。
    data:
      columns:
        - 可能性
