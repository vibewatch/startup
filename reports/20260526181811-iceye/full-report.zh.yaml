            body: >-
              最好的公开采用证据来自具名部署，并带有具体运营语境。防务中，乌克兰仍是最清晰的当前锚点：ICEYE 在 2026 年 1 月称，乌克兰国防部体系内一名客户扩大了高分辨率 SAR 影像访问，延续 ICEYE
              可追溯至 2022 年的关系。波兰提供最清晰的主权采购证明：2025 年合同约 EUR200 million，2026 年 5 月移交；ICEYE 称，这让一套可运营 MikroSAR 系统在不到 12
              个月内交到波兰军方手中。日本阶段更早，但仍值得注意：IHI 和 ICEYE 宣布计划制造并运营最多 24 颗本土卫星，以支持日本防务优先事项。

              防务之外，FEMA/NLT 是最强美国灾害响应案例，自 2021 年以来多年使用，并给出了 2024 年飓风季量化输出。保险证明也是真实的，不只是客户标识：TMNF 描述了一条实时理赔工作流，Suncorp
              称该栈把客户响应时间至少改善了一周，MAPFRE RE 在 2025 年许可了 ICEYE 全球洪水数据。Transport for NSW 增加了政府灾害响应证明，但没有同等量化运营指标。
