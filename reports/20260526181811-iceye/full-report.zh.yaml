  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的概览
        blocks:
          - type: paragraph
            body: >-
              ICEYE
              的头号风险不是没有需求。公开资料显示需求强劲、增长很快，主权合同也大得少见。但同一批来源也显示，近期规模越来越依赖国防部、武装部队和安全导向的工业主承包商，而不是一组广泛且多元的具名商业买家。一家曾经卖影像的公司，正越来越多地销售卫星、软件、地面系统、独占访问权和国家安全基础设施。战略价值很高，但相比纯数据订阅模式，签约订单、积压订单转化和营运资本需求更容易受采购日历、出口管制和里程碑交付影响。


              因此，尽管 2025 年已经盈利，承销时仍要按高残余风险看待。ICEYE 新的循环信贷额度明确用于支持合同担保，这是强信号：公司实现 EBITDA
              和经营现金流转正后，主权项目仍会占用资金能力。独立报道还显示，吸引 ICEYE 的同一波需求也在吸引资金充足的竞争对手，并推动各国政府转向主权化采购模式。因此，尽调核心问题是：ICEYE
              能否把防务驱动的增长持续转成耐久经济性，同时不让少数大型主权项目主导收入结构、融资需求和估值。
