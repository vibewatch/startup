      - number: '5.2'
        title: 架构、星座和分析栈
        blocks:
          - type: paragraph
            body: >-
              公开材料描述了一个由五层互动构成的栈：空间段、地面连接、任务 / 目录控制面、分析 / 利用软件，以及导出的数据产品。missions 页面称主权系统结合卫星、任务软件、分析和战术利用工具；Connect
              页面增加了托管地面网络；数据产品规格定义了影像如何变成标准幅度和复数产品；API 界面则暴露下单、状态和存档工作流。换句话说，ICEYE 已拼出从采集到分发的完整运营架构，而不是一个孤立传感器。


              Gen4 是最清晰的技术成熟度标记。ICEYE 宣传最高 16 cm 分辨率、1,200 MHz 成像带宽、在星座支持下低于 15 分钟重访、每次采集 15+ 张图像，以及带可转向天线、最高 700 Mbps
              下传。同一发布还把 Gen4 连接到更宽的工作流主张：每次通过获得更多图像、同步成像和下传，以及与 ISR Cell 和任务地面段兼容。文档层也比许多私营航天同业更强。ICEYE 的 2026
              年数据产品规格明确列出成像模式、服务级别、任务框架、存档下单，以及 Cloud Optimized GeoTIFF 和 GeoJSON
              元数据等现代产品打包。这降低了专业用户的集成风险，即便部分任务系统细节仍停留在宣传册层级，而不是工程手册层级。
