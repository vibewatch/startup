  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 因素
      - 方向
      - 时间
      - 对 ICEYE 的含义
      - 尽调问题
    rows:
      - - 主权 ISR 商业化
        - 驱动因素
        - 当前 / 结构性
        - 越来越多政府愿意购买商业 SAR 或专属容量，而不是等待只服务本国的系统
        - 梳理已披露国防订单的实际合同金额和续约条款
      - - 巨灾损失频率和严重度
        - 驱动因素
        - 当前 / 结构性
        - 经常性承保损失让更快的事件情报和赔付工作流每年都具备经济意义
        - 测试保险公司在哪些环节把损失压力转成经常性数据预算
      - - 参数化保险采用
        - 驱动因素
        - 当前 / 扩张中
        - 客观触发条件形成一个产品界面，SAR 衍生的洪水或灾害信号可以直接进入赔付逻辑
        - 按产品类型验证附着点、触发治理和保费经济性
      - - 延迟敏感的任务调度和交付
        - 驱动因素
        - 当前
        - 高端买家越来越愿意为优先窗口、近实时交付和工作流自动化付费，而不只是为影像付费
        - 按垂直行业量化买家为更低延迟付费的意愿
      - - 开放 Sentinel 替代品
        - 约束因素
        - 当前 / 结构性
        - 公共 SAR 数据压住非紧急用例定价，也收窄 ICEYE 能变现的高端细分市场
        - 明确哪些重访、延迟和分辨率阈值会迫使买家离开开放数据
      - - 多供应商商业 SAR 供给增长
        - 约束因素
        - 当前 / 增强中
        - Capella、Umbra、Synspective 等厂商让高端 SAR 不再稀缺，也提高定价承压的概率
        - 对标归档定价、任务调度 SLA 和赢 / 输单模式
      - - 监管和轨道碎片条件
        - 约束因素
        - 结构性
        - 星座扩张不只取决于需求，还取决于牌照、退轨合规和协调
        - 检查监管节奏是否会卡住容量扩张
      - - 私营经济性不透明
        - 约束因素
        - 当前
        - 没有披露合同金额、留存或细分结构，自下而上的 SOM 仍带有猜测成分
        - 直接向管理层索取客户数、ACV、续约和分部收入证据
    notes: 驱动因素和约束因素放在同一张表里，因为扩大采用的能力提升，也可能加速竞争。时间标签指截至 2026-05-26 本次运行日已经观察到的压力。
