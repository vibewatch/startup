            body: >-
              公开证据显示，ICEYE 不依赖单一采购路径。Sacra 描述了三条变现路径——直接影像销售、分析服务和星座即服务——本章客户例子也符合这种组合。波兰和乌克兰代表直接主权防务采购或直接部委使用。FEMA
              展示了伙伴中介型政府动作：New Light Technologies 已在 FEMA 的工作流栈内，并把 ICEYE 集成进 TEMPO。Carahsoft
