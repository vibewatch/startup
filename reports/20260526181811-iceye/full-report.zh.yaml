            title: ICEYE 的正确 TAM 按工作流定义，而不是按软件定义
            body: >-
              最有用的市场视角不是最大公开数字，而是买家需要全天候持续观测、任务优先级和可直接决策输出的工作流占比。因此，同一组证据可以支撑 $2.64B、$12.12B 或 $102.67B
              视角，而这些数字都不一定“错”。尽调任务是判断管理层到底能捕获哪一层。
