      - number: '4.2'
        title: 合同结构和在手订单构成
        blocks:
          - type: paragraph
            body: >-
              ICEYE 披露的合同集合显示，公司正明显沿价值链上移，走向主权和防务项目。葡萄牙直接购买一颗卫星。瑞典购买卫星、数据、软件和地面系统。乌克兰的 2026 年扩展展示了服务访问端：客户从 ICEYE
              现有星座购买扩大的影像权，而不是自有资产。日本的 IHI 项目和 Rheinmetall 支持的德国合同，把这一模式进一步延伸到星座建设和托管国家能力。波兰的 POLSARIS 交付证明，ICEYE
              可以在公开来源估算约 €200 million 的合同上，用大约一年时间从签约走到可运营主权服务。


              这会影响对在手订单的解读。ICEYE 报告的 €1.5 billion 在手订单不是纯 SaaS
              式递延收入池；它很可能包括影像访问、支持、硬件、软件、培训、地面段交付和长期服务承诺的混合体。这仍可能是高质量收入，尤其在政府希望拥有主权控制和经常性支持的地方；但这意味着投资者需要收入确认节奏和分阶段利润率视图，才能把在手订单转化为现金流信心。换句话说，在手订单是真实且越来越具战略性，但公开记录没有拆开一次性项目里程碑与经常性数据和支持收入。
