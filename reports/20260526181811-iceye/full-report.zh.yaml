            - 事件驱动案例研究复盘
            - GIS 和工作流集成检查
          emotion: 现场事件中需要可行动数据，而不是通用影像
          painpoint: Procurement timing and workflow integration can block adoption
          opportunity: Partner-led delivery shortens time to operational use
        - label: 保险评估
          actor: 理赔或灾害响应负责人
          touchpoints:
            - 洪水案例研究或试点
            - 与理赔或巨灾平台集成
            - 响应时间 ROI 复盘
          emotion: 想更快分流，并改善客户沟通
          painpoint: Buyers need proof the data changes claims operations, not just maps
          opportunity: Suncorp and TMNF provide operating proof points
        - label: 运营部署
          actor: 分析师、操作员或现场响应团队
          touchpoints:
            - TEMPO 或理赔平台摄取
            - 洪水或 SAR 任务节奏
            - 响应和优先级排序工作流
          emotion: 关注恶劣条件下的速度、可重复性和信心
          painpoint: Data must arrive fast enough to influence action
          opportunity: Realtime workflows create stickier account behavior than one-off imagery sales
        - label: 扩张循环
          actor: 现有账户支持者
          touchpoints:
            - 重复灾害季或防务需求
            - 更广地理范围或更高影像量
            - 新模块或主权能力增购
          emotion: 只有运营证明可见之后才会扩张
          painpoint: Public proof rarely shows pricing or renewal economics
          opportunity: Repeat-use signals exist even though disclosed cohort data does not
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU026
      - CU027
      - CU028
      - CU030
      - CU039
      - CU040
  - id: FU002
    title: 公开部署证明漏斗
    type: funnel
    layout: standard
    summary: 公开证明阶梯从具名交易对手收窄到重复使用证据，最后到披露续约经济性；ICEYE 跨过了前几道门槛，但还没跨过最后一道。
    data:
      items:
        - label: 披露具名交易对手
          value: 8
        - label: 可见上线或运营部署
          value: 7
        - label: 量化结果引用
          value: 6
        - label: 重复或扩张关系信号
          value: 4
        - label: 披露公开续约经济性
          value: 0
    approximationNotes: 公开证据计数来自具名证明表，而不是公司报告的 CRM 漏斗。
