      - number: '1.4'
        title: 主权客户动能、里程碑轨迹和风险姿态
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的里程碑路径如今集中在主权防务项目。公司已公开宣布与波兰、瑞典、葡萄牙、乌克兰、德国和日本达成采购或独家访问类交易；独立报道则称公司新增了七个主权客户，并向国家客户售出数十颗卫星。德国
              Rheinmetall 关系尤其重要，因为它把 ICEYE 从卫星数据供应商，变成能支撑多年期、十亿欧元级项目的防务工业供应链一环。与此同时，ICEYE
              仍通过保险、灾害响应、银行和森林砍伐监测展示非防务多元化，这有助于让平台故事不只停留在单一战场用途叙事上。


              声誉层面的取舍是，独立报道越来越多用军民两用或战争监视视角描述 ICEYE。ArcticToday 明确把公司从北极制图转向战争监视的变化框定出来，Privacy International
              的军民两用批评也展示了更广泛的怀疑：民用技术一旦成为军事打击和国家监视的核心，这类公司会受到审视。截至运行日，公开来源审阅没有发现清晰诉讼、制裁或执法行动，但这不等于风险干净。更直接的担忧是主权防务客户集中、董事会不透明、确切创立日期仍不确定，以及
              ICEYE 在欧洲防务架构中角色加深后，伦理审查可能上升。
