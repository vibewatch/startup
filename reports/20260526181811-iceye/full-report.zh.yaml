      - number: '8.4'
        title: 退出路径、下行情景与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              ICEYE 有真实的退出可选性，但风险还没降到可以不做更多尽调就加价买的程度。公司已经披露盈利、现金生成和积压订单，IPO
              现在至少有合理可能；但公开来源仍没有给出审计财报、清晰的经常性收入结构或股权结构表分配瀑布。战略替代路径同样可信：Rheinmetall 合资公司展示了一条工业路径，IHI
              星座合作展示了另一条。下行点在于，支撑估值的同一主权重心也会集中风险。如果积压订单滑坡、重硬件项目稀释利润率、新融资带着更高优先级条款进入，或两用用途审查抬高折现率，ICEYE
              会很快向不那么慷慨的地球观测可比公司重估。这就是为什么这里的投资逻辑击穿触发点是运营和财务事件，而不仅是叙事。正面结果需要证明：主权合同能转成持久且有利润的交付，同时不带来意外的普通股稀释。在管理层打开资本结构、合同经济性和积压订单转化日程之前，正确姿态是有纪律地跟踪，而不是热情追价。
