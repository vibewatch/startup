  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和变现机制
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的公开变现栈比简单按图像收费的数据业务更宽。公司销售直接影像和存档访问，允许客户通过 API
              自动化任务，为保险公司和银行打包灾害分析产品，并越来越多销售主权任务系统：政府采购卫星、软件、地面系统或独家运营支持。这种组合很重要，因为披露增长可能来自经济属性差异很大的来源：交易型影像、更像软件的分析订阅，以及大型项目制主权计划。


              公开定价证据也很混杂。ICEYE 的 API 文档明确说明，价格取决于合同，并会随区域、任务优先级、成像模式、服务级别协议、独占性和 EULA 改变。ICEYE US Direct 帮助中心发布了几个 SAR
              产品的指示性标价，但这些只是标价锚点，并不是实际净价证据。官方文档明确提醒，相同任务在不同合同下可能价格不同，因此核保不能把公开标价当作平均售价。实际结论是，标价有助于做漏斗顶部变现区间校验，但合同结构和主权打包，对公司当前收入质量的驱动远大于公开价目表本身。
