      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              ICEYE 领导层故事中最稳定的一点，是创始人延续性。多方来源仍把 Rafal Modrzewski 放在公司中心位置，担任首席执行官；Pekka Laurila 则是联合创始人兼首席战略官；Craft 还列出
              Eric Jensen 担任 ICEYE US 首席执行官。2025 年，高管阵容明显扩充：Magdalena Bartoś 11 月加入任 CFO，带来明确的 IPO、融资项目和转型经验；Marko
              Ahtisaari 10 月加入任 CMO，帮助塑造全球市场扩张。这些任命符合公司从技术验证走向规模化市场进入和资本市场准备的阶段。


              治理可见度明显弱于管理层可见度。围绕 2025 年 12 月融资的公开报道显示，General Catalyst 的 Jeannette zu Fürstenberg
              加入董事会，但官方页面没有给出清晰、最新的董事会名单或股东控制图谱。这一点很重要，因为公司对 Modrzewski 的关键人物依赖仍显偏高：他既是创始人
              CEO，也是融资发言人，还是公司最重要披露中的公开战略声音。工作结论是，领导层深度已经改善，但董事会和控制权透明度仍是活的尽调缺口，而不是已经解决的事实。
