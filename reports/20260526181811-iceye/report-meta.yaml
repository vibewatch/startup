  productSummary: ICEYE sells all-weather SAR imagery, tasking APIs, analytics, and complete sovereign mission stacks including satellites, ground infrastructure, software, and tactical exploitation tools.
  customerFocus: Sovereign defense and intelligence agencies, civil disaster-response users, insurers, reinsurers, and other buyers needing urgent all-weather monitoring.
  businessModel: ICEYE monetizes data tasking and archive access, analytics and catastrophe products, and increasingly larger sovereign-system programs that package satellites, software, ground systems, and support services.
  stage: Series E
  fundingStatus: December 2025 financing led by General Catalyst reportedly included €150M of new equity plus €50M of secondary liquidity at about €2.4B valuation; ICEYE also added a €300M revolving credit facility in May 2026.
