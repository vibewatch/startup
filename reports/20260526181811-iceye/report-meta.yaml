companyProfile:
  summary: ICEYE is a Finland-rooted SAR satellite company that has expanded from selling radar imagery into building sovereign intelligence systems for government customers while still serving disaster, insurance, and other monitoring workflows. By the 2026 research date, public disclosures showed 1,000+ employees, more than €250 million of 2025 revenue, more than €100 million of EBITDA, and a €1.5 billion backlog, alongside a December 2025 financing that valued the company at about €2.4 billion. The investment case is therefore no longer about basic product-market fit; it is about whether sovereign-program momentum can convert into durable, high-quality economics without concentration, compliance, or capital-structure surprises.
