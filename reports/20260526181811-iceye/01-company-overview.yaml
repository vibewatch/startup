      "id": "leadership-governance",
      "title": "Founders, leadership, and governance visibility",
      "body": "The most stable part of ICEYE’s leadership story is founder continuity. Multiple sources still place Rafal Modrzewski at the center of the company as chief executive and Pekka Laurila as co-founder and chief strategy officer, while Craft also lists Eric Jensen as chief executive of ICEYE US. In 2025 the leadership bench expanded meaningfully: Magdalena Bartoś joined as CFO in November with explicit IPO, funding-program, and transformation experience, and Marko Ahtisaari joined in October as CMO to help shape global market expansion. Those hires fit a company that has moved from technology proof to scaled go-to-market and capital-markets readiness.\n\nGovernance visibility is materially weaker than management visibility. Public reporting tied to the December 2025 financing indicates that General Catalyst’s Jeannette zu Fürstenberg joined the board, but official pages do not expose a clean, current board roster or shareholder-control map. That matters because key-person dependence on Modrzewski still looks elevated: he is the founder-CEO, financing spokesperson, and public strategic voice across the company’s most important disclosures. The working conclusion is that leadership depth has improved, but board and control transparency remain a live diligence gap rather than a resolved fact pattern.",
