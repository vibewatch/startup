      - number: '3.3'
        title: Distribution, Trust, and Regulatory Posture
        blocks:
          - type: paragraph
            body: >-
              Competitive trust in this market is increasingly tied to who can plug into government and prime-contractor
              workflows, not just who has the best image. ICEYE has credible sovereign traction via Finland's LOI and
              markets disaster-response data for governments, but Capella is more explicit in its public security stack:
              AWS GovCloud, FedRAMP High, end-to-end encryption, and named trust from NGA, NRO, U.S. Air Force, U.S.
              Space Force, and DIU. Umbra counters with a different trust story—regulatory edge and sovereign
              flexibility. Its FCC 1,200 MHz approval, NOAA licensing history, and Stage III NRO status tell buyers that
              its most aggressive performance claims have passed real external gates. Synspective is thinner globally
              but still notable because a 2025 JASDF security-guideline award shows the company is entering
              defense-grade assurance work rather than only civil analytics.


              Distribution also shapes how hard each rival is to displace. Capella supports partners with
              archive/tasking API access and coordinated GTM. Umbra deepens distribution through dedicated-capacity
              partnerships such as Maxar. Planet relies on APIs, GIS integrations, and broad archive availability to
              become part of the analysis stack before tasking is even discussed. BlackSky and Satellogic both
              explicitly sell sovereign-capability pathways, which can move them from data vendor to system partner.
              This means the market is no longer a contest of scene quality alone: channel design, integration posture,
              and program-control options increasingly determine who becomes the embedded provider inside a country,
              agency, or enterprise workflow.
            claimRefs:
