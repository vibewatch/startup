      - number: '3.4'
        title: Switching Costs, Moat Durability, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              ICEYE's moat is durable only in the parts of the workflow where all-weather urgency and program control
              matter at the same time. Tactical Access and sovereign-satellite programs create real switching costs, but
              the market evidence suggests those switching costs are not absolute. Capella can challenge on automation
              and U.S. government-readiness, Umbra can challenge on resolution and bespoke sovereign structures,
              BlackSky can challenge on subscription procurement and long-duration sovereign programs, and Planet can
              challenge on archive-driven context plus APIs. Multi-homing is already visible in the evidence: Maxar
              bundles Umbra SAR into multisource offerings, and Planet openly markets tip-and-cue between monitoring and
              tasking. Buyers can therefore keep ICEYE for urgent SAR windows while routing other monitoring layers
              elsewhere.


              Adverse evidence cuts both ways. ICEYE cannot claim a unique resolution edge when Capella markets 25 cm
              and Umbra markets 15 cm-class performance. Pricing opacity may support premium selling, but it also leaves
              room for open-data substitutes and subscription-led optical vendors to anchor buyer expectations lower. At
              the same time, competitor threats are not invincible. BlackSky's own 10-K shows concentrated revenue, and
              Synspective's public platform is still explicitly expanding from limited availability. The upshot is that
              ICEYE's moat looks strongest in defense and contested-environment tasking, weaker in broad monitoring or
              cost-sensitive accounts, and most vulnerable wherever customers are willing to combine SAR, optical, and
              open-data workflows instead of standardizing on one proprietary stack.
