  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring says the company is strong on demand, proof, and strategic position, but only middling on price
      support and transparency for a new investor.
    approximationNotes: >-
      Scores are editorial 1-to-5 assessments based on retained public evidence as of 2026-05-26. They are meant to
      summarize the decision, not replace the underlying analysis.
    data:
      items:
        - label: Market pull
          value: 4
          unit: /5
          note: Sovereign and defense demand is visible across multiple countries.
        - label: Contract visibility
          value: 4
          unit: /5
          note: Public contract set is unusually concrete for a private space company.
        - label: Economics
          value: 4
          unit: /5
          note: Revenue, EBITDA, cash, and backlog are strong, albeit unaudited.
        - label: Competitive moat
          value: 3
          unit: /5
          note: Commercial SAR demand is real, but Capella and Umbra keep the market competitive.
        - label: Valuation support
          value: 3
          unit: /5
          note: The last round is defensible, but not plainly cheap on trailing metrics.
        - label: Transparency
          value: 2
          unit: /5
          note: Cap table, covenant terms, and contract-margin split remain private.
        - label: Exit clarity
          value: 3
          unit: /5
          note: IPO and strategic routes are plausible but not yet concrete enough to price in.
    claimRefs:
      - CV001
      - CV005
      - CV023
      - CV041
      - CV044
      - CV048
      - CV052
