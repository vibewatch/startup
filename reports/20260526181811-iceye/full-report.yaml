  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      ICEYE’s sovereign mission offer depends on launch, industrial partners, ground-network operations, and compliance
      overlays in addition to SAR hardware.
    approximationNotes: >-
      The dependency DAG focuses on public bottlenecks and partners, not every component supplier inside the satellite
      bus or payload.
    data:
      nodes:
        - id: spacex
          label: Launch rideshares
          detail: SpaceX rideshare cadence is a major path to orbit for fleet and sovereign missions.
        - id: exolaunch
          label: Integration partner
          detail: Exolaunch integrated the March 2026 six-satellite mission.
        - id: production
          label: ICEYE production line
          detail: Company says output is scaling toward one satellite per week in 2026.
        - id: rheinmetall
          label: Rheinmetall JV
          detail: Planned Neuss production expands European sovereign manufacturing capacity.
        - id: space42
          label: Space42 JV
          detail: UAE manufacturing and AIT/LEO operations localize supply chain and technology transfer.
        - id: connect
          label: Ground and connectivity layer
          detail: CONNECT and mission ground systems are required to realize the latency promise.
        - id: governance
          label: Compliance and end-use controls
          detail: >-
            Export control, sanctions screening, privacy, and security assurances shape eligible customers and
            deployments.
        - id: sovereign-fleet
          label: Sovereign mission outcome
          detail: National constellations, federated operations, and tactical exploitation capability.
      edges:
        - from: spacex
          to: sovereign-fleet
          label: launch access
        - from: exolaunch
          to: spacex
          label: mission integration
        - from: production
          to: sovereign-fleet
          label: hardware availability
        - from: rheinmetall
          to: production
          label: regional manufacturing scale
        - from: space42
          to: production
          label: localized manufacturing and AIT
        - from: connect
          to: sovereign-fleet
          label: low-latency delivery and control
        - from: governance
          to: sovereign-fleet
          label: customer eligibility and trust boundary
        - from: production
          to: connect
          label: software-defined upgrades must remain synchronized
