  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Backlog conversion slips
        - >-
          Germany or Poland milestones move materially right, or 2026 growth stops resembling the company’s doubled-size
          narrative.
        - The last-round price depends on backlog becoming recognized high-quality revenue.
        - Reset toward bear-case assumptions and do not average up.
      - - Margin dilution emerges
        - Revenue grows but EBITDA fails to hold because sovereign delivery proves hardware- and services-heavy.
        - The multiple only works if sovereign growth keeps attractive economics.
        - Re-underwrite on lower margin and lower multiple.
      - - Senior capital returns
        - New debt, structured equity, or preference-heavy capital arrives before transparency improves.
        - A new financing would likely protect the company before it protects new common equity.
        - Treat the new round as dilution risk, not validation.
      - - Defense concentration stays extreme
        - Non-defense diversification remains secondary while Europe-centered sovereign demand dominates the story.
        - Customer and budget concentration raise the discount rate and narrow the buyer universe.
        - Keep position size small and demand more price discipline.
      - - Dual-use or policy backlash rises
        - War-surveillance scrutiny, export-control friction, or political controversy increases materially.
        - Reputational and policy risk can compress the multiple even if demand remains healthy.
        - Pause new capital and refresh the risk memo before proceeding.
    notes: >-
      These triggers are deliberately portfolio-actionable and tied to observable financial, delivery, financing, or
      policy events rather than to generic sentiment.
