  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              ICEYE’s public monetization stack is broader than a simple per-image data business. The company sells
              direct imagery and archive access, allows customers to automate tasking through APIs, packages catastrophe
              analytics for insurers and banks, and increasingly sells sovereign mission systems in which governments
              procure satellites, software, ground systems, or exclusive operational support. That mix matters because
              it means reported growth can come from very different economic profiles: transactional imagery, more
              software-like analytics subscriptions, and large project-style sovereign programs.


              Public pricing evidence is also mixed. ICEYE’s API documentation makes clear that price is
              contract-dependent and can change with region, task priority, imaging mode, service-level agreement,
              exclusivity, and EULA. The ICEYE US Direct help center publishes indicative list prices for several SAR
              products, but those are only a list anchor and not evidence of realized net price. The official
              documentation explicitly warns that identical tasks can price differently under different contracts, so
              underwriting cannot treat posted list pricing as average selling price. The practical takeaway is that
              list pricing is useful for top-of-funnel monetization range checks, while contract structure and sovereign
              packaging drive far more of the company’s current revenue quality than the public price card alone.
