      - number: '7.5'
        title: Financial and execution kill criteria
        blocks:
          - type: paragraph
            body: >-
              Financial risk now sits less in survival and more in execution leverage. ICEYE’s profitability and cash
              generation are real, but the May 2026 RCF was framed as support for contract guarantees and liquidity, not
              as generic balance-sheet optimization. That language implies sovereign contracts still consume bonding
              capacity and working-capital attention. Sacra and partner disclosures also suggest a contract profile
              where a small number of large sovereign programs can move the revenue mix quickly. If those programs slip,
              cash conversion, margin timing, and financing flexibility can deteriorate even without a collapse in
              demand.


              That makes people and process capacity critical. Compliance teams must scale export-control and sanctions
              operations. Treasury must manage guarantees and bank relationships. Engineering must raise production
              while internalizing testing. Program teams must hand over operational constellations to sovereign
              customers without missing acceptance milestones. Public sources still do not disclose top-customer
              concentration, guarantee utilization, export-license inventories, or satellite failure history. Until
              those gaps are closed, the cleanest thesis-break triggers are monitorable operating events: sovereign
              concentration that keeps rising, launch or commissioning misses against the 2026 plan, evidence that
              guarantees constrain new awards, or proof that sovereign buyers prefer owned capacity but reduce ongoing
              third-party data purchases.
