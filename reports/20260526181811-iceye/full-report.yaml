      - number: '8.3'
        title: Comparable set and scenario range
        blocks:
          - type: paragraph
            body: >-
              The comparable work argues for discipline rather than conviction. Planet’s filing-based public-equity
              marker sits around 2.4x revenue, while BlackSky and Satellogic illustrate how volatile small-cap space
              valuations can become as market sentiment swings. Rocket Lab shows the opposite extreme: diversified
              defense-space platforms can command premium public multiples far above pure Earth-observation names, but
              that is a reward for broader product breadth, larger scale, and clearer public-market credibility. Capella
              and Umbra are useful as private SAR context because their continued NRO positions validate real state
              demand for commercial radar capacity, yet they do not offer clean public pricing anchors. The practical
              implication is that ICEYE’s roughly 9.6x trailing revenue can be defended only if investors believe 2025
              profitability and backlog quality persist into 2026-2027, not because the public comp set forces that
              answer. In scenario terms, the last round looks like a reasonable base case if sovereign programs convert
              cleanly. It looks stretched if hardware-heavy execution or dual-use backlash compresses the multiple
              toward public EO markers, and it can still re-rate higher if Germany, Poland, Sweden, and Japan prove
              repeatable sovereign-system economics at scale.
