          label: 'Valuation: ~9.6x revenue and ~24x EBITDA at €2.4B'
        - id: n4
          label: Missing cap-table and contract-margin transparency
        - id: n5
          label: Dual-use and concentration risks raise discount rate
        - id: n6
          label: 'Recommendation: RESEARCH-MORE / TRACK'
