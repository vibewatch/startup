      - number: '4.2'
        title: Contract structure and backlog composition
        blocks:
          - type: paragraph
            body: >-
              ICEYE’s disclosed contract set shows a pronounced move up the value chain toward sovereign and defense
              programs. Portugal is buying a satellite directly. Sweden is buying satellites, data, software, and ground
              systems. Ukraine’s 2026 expansion shows the service-access end of the spectrum, where the customer buys
              expanded imagery rights from ICEYE’s existing constellation rather than an owned asset. Japan’s IHI
              program and the Rheinmetall-backed German contract extend that model even further toward constellation
              build-out and managed national capability. Poland’s POLSARIS delivery demonstrates that ICEYE can move
              from signature to operational sovereign service in roughly a year on a contract that public sources size
              at about €200 million.


              This matters for backlog interpretation. ICEYE’s reported €1.5 billion backlog is not a pure SaaS-style
              deferred revenue pool; it likely includes a mix of imagery access, support, hardware, software, training,
              ground-segment delivery, and long-duration service commitments. That can still be high-quality revenue,
              especially where governments want sovereign control and recurring support, but it means investors need a
              recognition schedule and margin-by-phase view before translating backlog into cash-flow confidence. In
              other words, the backlog is real and increasingly strategic, yet the public record does not separate
              one-time program milestones from recurring data and support revenue.
            claimRefs:
