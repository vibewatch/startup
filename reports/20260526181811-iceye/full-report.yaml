        - label: 8x revenue — cautious premium
          value: 2000
          unit: €M
        - label: 9.6x revenue — last round
          value: 2400
          unit: €M
        - label: 12x revenue — strong sovereign execution
          value: 3000
          unit: €M
        - label: 14x revenue — premium defense-space case
          value: 3500
          unit: €M
