      - number: '2.2'
        title: Buyer, User, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Buyer structure differs sharply by vertical. In defense, the buyer is typically a ministry of defense,
              intelligence agency, or national program office; the end user is an ISR analyst or operator; and the payer
              is a sovereign security, modernization, or intelligence budget. These buyers care most about low latency,
              secure delivery, flexible tasking, and sometimes sovereign control of satellites themselves. ICEYE’s
              Finland announcement and competitor NRO awards show that the commercial model can range from
              data-as-a-service to dedicated capacity.


              In disaster response, buyers are civil-protection agencies, federal emergency offices, or local/state
              governments; users are GIS teams and emergency managers; and the payer is usually a resilience,
              emergency-management, or insurance-linked public budget. In insurance, the buyer often sits in
              catastrophe, claims, underwriting, or innovation teams, while the payer can be a carrier, reinsurer,
              public-sector program, or risk pool. What unites these segments is that the willingness to pay increases
              when the workflow is operationally time-sensitive: border monitoring, live disaster assessment, or payout
              automation. That is why tasking speed, guaranteed collection windows, and machine-readable outputs matter
              at least as much as raw image availability.
