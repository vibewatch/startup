chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current stage
        blocks:
          - type: paragraph
            body: >-
              ICEYE now presents itself less as a niche Earth-observation startup and more as a sovereign-intelligence
              company built around synthetic-aperture radar. The core product logic is consistent across the company
              page, defense-customer announcements, and independent coverage: ICEYE owns and operates SAR satellites,
              uses them to deliver imagery and analytic services in any weather or light condition, and also sells
              sovereign mission packages to governments that want their own systems. That combination matters because it
              changes the business model from simple data resale into a mix of hardware, mission systems, data services,
              and long-lived national-security programs.


              Public scale signals also point to a late-stage private company rather than an early-stage venture story.
              ICEYE says it is founded and headquartered in Finland, operates globally, and employs more than 1,000
              people across Europe, the Middle East, Asia-Pacific, and the US. Independent databases broadly corroborate
              the Finland base and large international footprint, even if they are noisier on exact office counts and
              founding year. The operational picture is therefore clear enough for later chapters to reuse: ICEYE is a
              Finland-rooted, globally deployed SAR company with strong defense pull, but several “cover fact” details
              still need explicit caveats rather than false precision.
