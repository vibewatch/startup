  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      ICEYE’s main risks transmit through backlog conversion, guarantees, delivery reliability, and valuation rather
      than through demand absence alone.
    data:
      nodes:
        - id: n1
          label: Sovereign / defense concentration
          detail: Public wins and backlog are increasingly tied to government security demand.
        - id: n2
          label: Procurement and budget cycles
          detail: Appropriations, approvals, and domestic-partner structures shape bookings.
        - id: n3
          label: Backlog conversion volatility
          detail: Large programs can move recognition timing and mix.
        - id: n4
          label: Guarantees and working capital
          detail: Customer-contract guarantees and delivery obligations consume liquidity.
        - id: n5
          label: Manufacturing and launch capacity
          detail: Production ramp and rideshare cadence determine deliverable fleet capacity.
        - id: n6
          label: Service reliability and commissioning
          detail: Sovereign handovers and constellation access must work without delay.
        - id: n7
          label: Margin and financing flexibility
          detail: Execution stress can compress margin and tighten future funding options.
        - id: n8
          label: Valuation downside
          detail: Concentration, slippage, or competition can compress multiple and confidence.
        - id: n9
          label: Export-control and privacy burden
          detail: Licensing, sanctions, and complaint obligations can slow or narrow revenue.
      edges:
        - from: n1
          to: n2
          label: government-heavy demand base
        - from: n1
