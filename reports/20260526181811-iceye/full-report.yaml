  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public maturity is strongest in SAR collection, data packaging, and sovereign sales motions; it is weaker in
      externally evidenced reliability and deep security disclosure.
    approximationNotes: Cells reflect public-evidence maturity rather than internal telemetry or customer NPS-style metrics.
    data:
      columns:
        - Public maturity
        - Dependency concentration
        - Diligence posture
      rows:
        - label: Gen4 collection capability
          values:
            - label: Clearly commercialized and technically specific
              tone: positive
            - label: Depends on launch cadence and production throughput
              tone: warning
            - label: Strong public proof on specs, limited proof on lifecycle economics
              tone: warning
        - label: Standard data products and docs
          values:
            - label: High, with current 2026 specification and public docs site
              tone: positive
            - label: Depends on customer migration from legacy formats through 2026
              tone: warning
            - label: Low diligence risk for basic integration, higher for advanced pipelines
              tone: neutral
        - label: CONNECT low-latency ground service
          values:
            - label: Productized with quantitative marketing metrics
              tone: positive
            - label: Relies on qualified global ground network and redundancy
              tone: warning
            - label: Needs audited SLA or customer evidence to move from marketing to underwriting
              tone: warning
        - label: Sovereign mission system
          values:
            - label: High commercial traction and visible national programs
              tone: positive
            - label: Depends on launches, JVs, approvals, and local delivery
              tone: warning
            - label: Strong strategic moat but execution-heavy business model
              tone: warning
        - label: Analytics and ATR layer
          values:
            - label: Publicly positioned and workflow-relevant
              tone: positive
            - label: Depends on model quality and downstream operator process
              tone: warning
            - label: Requires benchmark, false-positive, and multimodal detail
              tone: warning
        - label: Security and compliance assurance
          values:
            - label: Formal frameworks are visible
              tone: positive
            - label: Depends on internal controls not publicly disclosed
              tone: warning
            - label: Missing deep public architecture assurance artifacts
              tone: warning
