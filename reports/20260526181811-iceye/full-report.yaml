        title: Exhibits
        blocks:
          - type: callout
            title: The right TAM for ICEYE is workflow-defined, not software-defined
            body: >-
              The most useful market lens is not the largest published number but the share of workflows where buyers
              need all-weather persistence, tasking priority, and decision-ready outputs. That is why the same evidence
              can support a $2.64B, $12.12B, or $102.67B lens without any of those numbers being “wrong.” The diligence
              job is to decide which layer management can actually capture.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM039
              - CM043
          - type: callout
            title: Open data and multi-vendor supply can commoditize the lower end of SAR
            body: >-
              ICEYE’s defensibility weakens quickly when the workflow does not require urgent tasking or decision-ready
              derivatives. Free Sentinel coverage, strong optical incumbents, and aggressive competitors such as
              Capella, Umbra, and Synspective can all pressure routine imagery pricing. The premium segment should
              therefore be tested on SLA, workflow integration, and renewal behavior rather than on image availability
              alone.
            calloutType: risk
            claimRefs:
