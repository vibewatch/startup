      - number: '7.3'
        title: Operational and constellation risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is concentrated in pace, throughput, and replenishment. Payload reported that ICEYE plans
              to launch more than 25 satellites in 2026, lift production to 50 satellites per year, push toward 100 in
              the medium term, and bring vibration testing in-house. Calibre Defence separately reported that ICEYE had
              70 systems in orbit after the March 2026 Transporter-16 launch. Those datapoints describe a company that
              is scaling hardware and sovereign delivery at a pace that leaves little room for quality slips, launch
              bottlenecks, or commissioning delays. They also imply meaningful dependence on third-party launch cadence
              even as ICEYE internalizes more test capability.


              Constellation attrition risk remains under-disclosed. UNOOSA’s mitigation guidance requires operators to
              minimize debris release, reduce break-up risk, limit accidental collision exposure, and remove or
              otherwise dispose of LEO spacecraft after mission end. Public sources reviewed did not disclose ICEYE’s
              failure rate, insured-loss history, or deorbit-execution record, so investors cannot yet quantify true
              replacement burden. The risk is therefore operational and financial at once: any cluster of on-orbit
              failures, launch slippage, or disposal non-compliance can reduce deliverable capacity, delay sovereign
              acceptance milestones, and force additional capital into the constellation before backlog converts into
              cash.
            claimRefs:
