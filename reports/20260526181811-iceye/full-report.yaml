        - Large sovereign programs can justify scale while still hurting equity quality.
        - Request contract-level margin bridge and post-delivery support assumptions.
      - - Guarantees, covenants, and restricted cash
        - RCF draw conditions, guarantee usage, collateral package, and any restricted-cash requirements.
        - These terms can materially alter effective leverage and downside recovery.
        - Review facility documents and treasury covenant model.
      - - Exit readiness
        - Board materials, banker discussions, IPO readiness workstreams, or strategic-interest evidence.
        - Exit optionality helps valuation only if it is more than narrative.
        - Ask management for timeline, advisors, and gating milestones.
    notes: >-
      These are the minimum asks required to turn this chapter from a public-source price frame into a genuine
      underwriting decision.
    claimRefs:
      - CV044
      - CV045
      - CV048
      - CV052
      - CV053
