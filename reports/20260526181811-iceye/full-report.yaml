  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflows
        blocks:
          - type: paragraph
            body: >-
              ICEYE’s product is best understood as a menu of related operating models built on one SAR base. At the low
              end, customers buy archive imagery, task new collections, or integrate tasking and catalog access into
              their own software. At the high end, governments buy a sovereign mission that bundles satellites, ground
              infrastructure, software, analytics, and tactical exploitation tools, with first capability marketed
              inside a 12-month window. The company is therefore selling not just pixels but control, latency, workflow
              compression, and national autonomy.


              The customer workflow is correspondingly concrete. A user defines an area of interest, chooses archive
              data or a new task, and then routes the output into either a self-service download, an API-fed pipeline,
              or a sovereign ISR operating loop. SkyFi’s ICEYE US Direct page and ICEYE’s own API surface show a
              practical acquisition path: define AOI, select image mode, monitor status, and receive GeoTIFF/PNG/GeoJSON
              outputs. The public developer-facing surface is narrower than a typical SaaS platform, but it is real:
              ICEYE maintains a public GitHub documentation repo and recruiting materials explicitly reference technical
              assignments and GitHub or portfolio links. That mix implies an integration-first product motion rather
              than an open-source ecosystem motion.
