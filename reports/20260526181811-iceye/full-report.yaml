  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked overview
        blocks:
          - type: paragraph
            body: >-
              ICEYE’s top risk is not lack of demand. The public record shows strong demand, fast growth, and unusually
              large sovereign contracts. But those same sources also show that recent scale is increasingly tied to
              ministries of defense, armed forces, and security-focused industrial primes rather than a broad,
              diversified set of named commercial buyers. A business that once sold imagery is increasingly selling
              satellites, software, ground systems, exclusive access, and national-security infrastructure. That is
              strategically valuable, but it makes bookings, backlog conversion, and working-capital needs more
              sensitive to procurement calendars, export controls, and milestone delivery than a pure data-subscription
              model would be.


              The underwriting consequence is a high residual-risk profile despite 2025 profitability. ICEYE’s new
              revolving credit facility explicitly supports contract guarantees, which is a strong signal that sovereign
              wins can still absorb treasury capacity after the company crossed into positive EBITDA and operating cash
              flow. Independent reporting also shows that the same demand wave attracting ICEYE is pulling in
              well-funded rivals and pushing governments toward sovereignized procurement models. The central diligence
              question is therefore whether ICEYE can keep converting defense-led growth into durable economics without
              letting a few large sovereign programs become the overwhelming driver of revenue mix, financing needs, and
              valuation.
            claimRefs:
              - CR004
              - CR006
