  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Applying different revenue multiples to ICEYE’s disclosed 2025 revenue shows how much the thesis depends on
      whether investors treat ICEYE as a premium sovereign-space asset or as an Earth-observation company with project
      risk.
    approximationNotes: >-
      Bars apply illustrative revenue multiples to the disclosed >€250M 2025 revenue base. This is a sensitivity
      framework, not a negotiated fairness opinion.
