      - number: '4.3'
        title: Unit-economics proxies and constellation capital intensity
        blocks:
          - type: paragraph
            body: >-
              ICEYE now has enough public data to discuss unit-economics proxies, but not enough to compute actual gross
              margin or payback. On the revenue side, the public price card gives a ceiling for on-demand imagery
              monetization, while sovereign contracts show that much larger average contract values are available when
              ICEYE packages satellites, software, ground systems, and training. On the cost side, the most useful
              public signals are operational rather than accounting-based: NASA’s evaluation showed a constellation that
              was still expanding quickly, the FCC authorized further U.S.-licensed growth, and external reporting
              described a 10- to 11-week build cycle with output targets of 50 satellites per year and eventually 100.
              Payload and SatNews also reported investments in facilities and in-house vibration testing.


              Those signals point to a business whose unit economics are improving with scale but are still capital
              intensive. The same constellation can serve defense, insurance, and banking use cases, which is a real
              fixed-cost reuse advantage. However, the public record still omits the items that matter most for
              underwriting the margin path: per-satellite build cost, launch cost burden, maintenance capex,
              depreciation policy, direct support costs for sovereign programs, and segment gross margin between
              imagery, analytics, and hardware-heavy mission delivery. The right interpretation is not that unit
              economics are bad, but that they remain only partially visible from public evidence.
