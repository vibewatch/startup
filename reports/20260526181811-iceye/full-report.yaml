  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Logic
        blocks:
          - type: paragraph
            body: >-
              ICEYE should not be sized against the entire location-intelligence stack. The company’s own 2026 materials
              cluster around three urgent workflows: sovereign and allied ISR, disaster-response mapping for
              governments, and catastrophe/parametric products for insurers. Those workflows consume premium all-weather
              persistence, tasking priority, and decision-ready derivatives. They do not equal the whole geospatial
              analytics market, which also includes surveying hardware, mapping software, navigation-enabled
              applications, and broad enterprise location intelligence.


              Public market estimates diverge because they measure different layers. Grand View’s geospatial analytics
              lens is broad and software-heavy; MarketsandMarkets’ EO small-satellite lens is much narrower and closer
              to the hardware-plus-data stack; its geospatial imagery analytics lens sits in between. ICEYE’s real
              serviceable market is narrower still because the company competes only where buyers pay more for radar’s
              day-night and through-cloud collection plus faster tasking and delivery. Free Sentinel-1 data remains a
              meaningful substitute for non-urgent monitoring, so the monetizable boundary is defined by urgency,
              revisit, resolution, and workflow integration rather than by the mere existence of SAR imagery.
