        - id: mission-apps
          label: Mission applications and use cases
          detail: >-
            Defense ISR, border/maritime surveillance, disaster response, insurance, infrastructure, and banking
            workflows consume outputs.
        - id: analytics-layer
          label: Analytics and exploitation layer
          detail: >-
            ISR Analytics, automatic target recognition, and partner or customer decision tools convert imagery into
            mission products.
        - id: control-plane
          label: Tasking, catalog, and self-service control plane
          detail: Tasking API, Catalog API, contracts/authentication, STAC archive search, and SkyFi-powered ordering surface.
        - id: ground-layer
          label: Ground connectivity and sovereign control
          detail: >-
            CONNECT global ground-station network, dedicated sovereign antennas, mission ground segment, and local
            storage/processing.
        - id: space-layer
          label: Space and product layer
          detail: Gen4 and broader SAR fleet, multiple imaging modes, and standard amplitude/complex data products.
