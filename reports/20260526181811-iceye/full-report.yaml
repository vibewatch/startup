      - number: '1.3'
        title: Capital structure and operating scale
        blocks:
          - type: paragraph
            body: >-
              ICEYE’s public financing path is now deep enough to support a “late-stage private” classification even
              though the exact lifetime total still has caveats. Official releases document an $87 million Series C in
              2020, a $136 million Series D in 2022, a $158 million 2024 funding round that mixed debt and equity, and a
              December 2025 financing led by General Catalyst. Independent reporting adds that the 2025 round included
              €150 million in new equity and a €50 million secondary placement at a €2.4 billion valuation. The most
              conservative way to state lifetime capital is therefore not a perfectly precise audited figure, but a
              company-reported “about €600 million to date” supported by independent December 2025 coverage.


              Public operating metrics turned much stronger in March 2026, when ICEYE disclosed unaudited 2025 results:
              revenue above €250 million, EBITDA above €100 million, cash above €350 million, cash from operations above
              €130 million, and a €1.5 billion backlog. Those are not vanity numbers; they imply that defense-driven
              demand, sovereign programs, and long-cycle contracts were already translating into cash generation. The
              May 2026 €300 million revolving credit facility further suggests that the immediate bottleneck is
              execution and contract delivery, not raw access to capital. The main remaining quantitative gaps are exact
              customer count, audited accounts, and a fully reconciled lifetime financing bridge.
