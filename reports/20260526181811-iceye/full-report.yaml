      - number: '5.4'
        title: Trust, compliance, roadmap signals, and technical risks
        blocks:
          - type: paragraph
            body: >-
              ICEYE has more visible trust scaffolding than many private space companies. Its public governance and
              trust-center materials advertise ISO/IEC 27001:2022 and ISO 9001:2015, export-control and sanctions
              screening, supplier-code expectations, and a whistleblowing process. The website privacy notice is
              explicitly GDPR-framed, and the ICEYE US API page claims encryption in transit and at rest plus NIST
              800-171 alignment. Those are meaningful positive signals for defense and critical-infrastructure buyers
              because they suggest that the company understands compliance as part of the product, not as a back-office
              afterthought.


              The caveat is that most of the strongest trust claims remain policy- and certification-level, not deep
              architecture disclosure. There is no public SOC 2 report, FedRAMP package, penetration-testing summary, or
              detailed public description of the ISR Cell security boundary. Likewise, Connect and analytics performance
              claims are directionally strong but not independently audited. On roadmap, the visible sequence is
              coherent: 2024 APIs, 2025 Gen4 commercial launch and partner integrations, 2025 self-service access
              through SkyFi, and 2026 production and sovereign-manufacturing scale-up. The main technical risk is
              therefore not that ICEYE lacks a product roadmap; it is that the company is pushing rapidly up the value
              chain into sovereign systems and subscription access while the public record still leaves key reliability,
              security, and lifecycle details opaque.
