      - number: '3.2'
        title: Capability and Packaging Comparison
        blocks:
          - type: paragraph
            body: >-
              ICEYE's public edge is not simply “better SAR.” It is the combination of all-weather imaging,
              time-critical packaging, and sovereign-program credibility. ICEYE says standard public tasking still
              begins by email and averages under four hours from downlink to delivery, while Tactical Access adds
              guaranteed windows, retasking until two hours before overpass, and under-one-hour delivery. That makes
              ICEYE strongest where missions are urgent, cloud-obscured, or politically sensitive. But resolution is no
              longer a clean moat: Capella markets 0.25 m azimuth resolution, sub-20-minute tasking confirmation, a
              scheduler that runs every 20 minutes, and a fully automated console/API workflow; Umbra markets 15 cm
              licensed capability and flexible build-own / lease / hybrid mission models. Synspective is less
              automation-forward publicly than Capella, but it still exposes archive, tasking, and API functions and is
              building toward a 30-satellite constellation.


              The substitute set competes on workflow breadth and procurement simplicity. Planet offers 50 cm tasking,
              multiple revisits per day, delivery in under four hours, and a broad archive-plus-API platform. BlackSky
              wraps 35 cm Gen-3 imagery, analytics, and sovereign services into annual or multi-year subscription
              constructs rather than one-off scene buying. Satellogic pushes direct tasking and
              Constellation-as-a-Service with explicit language around frequency, resolution, and price point. Free
              public data is the opposite extreme: Copernicus and Landsat do not provide priority tasking, but they make
              the starting price for monitoring effectively zero. The practical result is that ICEYE wins hardest when
              buyers need assured SAR-specific access, while substitutes gain leverage when archive breadth, procurement
              familiarity, or low cost matters more.
