      - CV043
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The bear, base, and bull ranges show that downside can still be substantial despite strong company-level evidence,
      because the capital-stack and contract-quality questions remain unresolved.
    approximationNotes: >-
      Ranges reflect analyst scenario analysis using disclosed 2025 metrics, sovereign-contract visibility, and the
