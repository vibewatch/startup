      - number: '2.4'
        title: Constraints, Contradictions, and Open Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The most important constraint is that public pricing power is difficult to defend at the commodity layer.
              Copernicus offers a free radar substitute for slower workflows; optical incumbents such as Planet still
              dominate many budgets when cloud/night limitations are acceptable; and multiple commercial SAR vendors now
              market sub-meter imaging, rapid tasking, and defense-grade workflows. That expanding supply base should
              help adoption but also increases the risk that archive imagery, routine monitoring, and undifferentiated
              collections become harder to monetize.


              The second constraint is analytical opacity. Public market reports mix hardware, analytics,
              catastrophe-loss pools, and adjacent software, which makes a clean SAR-only TAM hard to isolate. ICEYE
              itself is private, major government contract values are rarely disclosed, and public materials do not
              cleanly separate defense, disaster, and insurance revenue. The result is that a defensible SOM still
              requires bottom-up diligence on contract size, renewal rates, insurer attach points, and the fraction of
              demand that truly needs premium tasking. The contradictory estimates in this chapter are therefore a
              feature, not a bug: they show that boundary discipline matters more than citing the largest available
              market number.
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM033
              - CM034
