  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enforcement-history
    missingEvidence: External legal-database results, counsel letters, and regulator-response history for any ICEYE litigation, sanctions issues, or formal enforcement.
    whyItMatters: The public web corpus did not surface enough evidence to rule out legal or regulatory incidents, so residual legal risk cannot be fully underwritten.
    diligencePath: Run court, sanctions, and regulator database searches across all ICEYE entities and request counsel confirmation letters.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: attrition-history
    missingEvidence: Per-satellite failure history, insured-loss experience, launch-provider mix, and post-mission disposal execution data.
    whyItMatters: Without failure and replacement data, investors cannot quantify true constellation refresh burden or resilience under launch and debris stress.
    diligencePath: Request fleet reliability tables, insurance claims history, and deorbit compliance metrics by generation.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: backlog-concentration
    missingEvidence: Backlog split by customer, program, termination rights, renewal profile, and expected recognition timing.
    whyItMatters: Large sovereign wins are visible, but the public record does not show whether a small number of programs dominate backlog conversion and working capital.
    diligencePath: Request a named-program backlog bridge with top-customer concentration, cancellation clauses, and yearly conversion schedule.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: license-matrix
    missingEvidence: Entity-by-entity export-control classifications, remote-sensing approvals, exemptions, and jurisdiction-specific compliance owners.
    whyItMatters: Compliance risk is clearly material, but the public record does not reveal which licenses and reviews attach to each ICEYE entity or product flow.
    diligencePath: Request a legal-entity licensing matrix covering export controls, remote-sensing approvals, sanctions screening, and national-security review obligations.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: privacy-incident-history
    missingEvidence: Security incident register, DPA interactions, breach-notification history, and independent audit results beyond certification claims.
    whyItMatters: ISO and privacy disclosures are helpful, but they do not show whether operational privacy or security incidents have occurred or how they were resolved.
    diligencePath: Request the last three years of incident logs, supervisory correspondence, pen-test summaries, and customer security commitments.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
    - TR004
