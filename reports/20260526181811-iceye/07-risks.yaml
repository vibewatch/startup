- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Sovereign concentration
    - New bookings mix
    - Two consecutive quarters where sovereign/defense wins dominate and non-sovereign pipeline does not broaden
    - Treat diversification thesis as weakening and re-underwrite exit multiple.
  - - Procurement and political risk
    - Flagship program slippage
    - Any named sovereign program misses commissioning or acceptance milestones by more than two quarters
    - Increase execution discount and re-test working-capital needs.
  - - Launch and replenishment risk
    - Deployment cadence
    - Observed launch or deployment pace falls materially below the public 2026 ramp plan
    - Assume backlog conversion delays and higher replacement burden.
  - - Constellation attrition and debris
    - Loss or disposal exception
    - Any disclosed collision, break-up, or failure cluster without rapid replenishment plan
    - Pause underwriting until fleet resilience and insurance coverage are clear.
  - - Contract-guarantee risk
    - Bonding and bank utilization
    - Guarantee issuance or RCF usage begins to constrain new sovereign awards
    - Revisit liquidity bridge and downside financing case.
  - - Competition and cannibalization
    - Win rate, pricing, or repeat data spend
    - Loss of a major defense contest or evidence sovereign buyers reduce recurring data purchases after owning capacity
    - Lower terminal growth assumptions and compress valuation multiple.
  notes: Thresholds are analyst monitoring rules derived from the disclosed risk mix rather than company guidance; they are intended as thesis-break tests for investment committee use.
