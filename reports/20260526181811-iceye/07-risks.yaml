- id: regulatory-and-legal-posture
  title: Regulatory and legal posture
  body: |-
    ICEYE’s own governance materials make clear that compliance burden is central to the business. The company explicitly highlights export controls, sanctions screening, supplier compliance, and responsible use of its products, and it sets a 2026 target to improve compliance training and monitoring. Its privacy notice also frames ICEYE as a data controller with formal access, erasure, correction, portability, and complaint obligations. Those disclosures are directionally positive because they show management is not pretending compliance is peripheral. But they also confirm that ICEYE’s growth markets—defense, sovereign ISR, and cross-border data delivery—carry meaningful legal and regulatory overhead.

    The external regulatory backdrop reinforces that point. The U.S. Office of Space Commerce says private remote-sensing operators are licensed and monitored for compliance under 15 CFR Part 960, with coordination across agencies to protect national-security interests and international obligations. Even if ICEYE’s full licensing map is not public, the implication is straightforward: end-use restrictions, sanctions controls, remote-sensing approvals, and privacy obligations can all narrow which customers can be served, how data can be delivered, and how fast sovereign programs can be executed. No public enforcement history surfaced in reviewed sources, but that is a disclosure gap, not a clean bill of health.
