tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to ICEYE
  rows:
  - - Premium commercial SAR tasking and data delivery
    - Tasked radar collections, priority access, secure delivery, archive access, direct downlink
    - Commodity archive-only sales, generic GIS licenses, broad mapping SaaS
    - Defense/intelligence agencies, emergency managers, specialist analytics teams; sovereign security and operations budgets
    - Core monetization layer where all-weather persistence and latency matter
  - - Disaster-response SAR derivatives
    - Flood extent, building damage indicators, exposure mapping, response intelligence, event briefings
    - Slow post-event reports, generic climate dashboards with no operational workflow
    - Civil-protection agencies, state/local/federal governments; emergency and resilience budgets
    - Important public-sector workflow and a route into parametric/public-aid programmes
  - - Insurance catastrophe intelligence and parametric triggers
    - Claims triage, catastrophe monitoring, payout triggers, underwriting support for flood/wildfire/storm
    - General actuarial software, traditional loss-adjusting labor without remote triggers
    - Primary insurers, reinsurers, public-sector risk pools; claims, catastrophe, reinsurance, or resilience budgets
    - High-value vertical because objective, rapid data can shorten payout cycles
  - - Sovereign or allied dedicated-capacity deals
    - Dedicated satellites, mission systems, secure ground integration, national ISR capacity
    - Pure data subscriptions without control, generic EO consulting
    - Defense ministries, intelligence services, national program offices; capex and modernization budgets
    - Smaller buyer universe but potentially large contract size and stickier renewal logic
  - - Broad geospatial analytics adjacency
    - Image analytics, location intelligence, remote sensing software, mapping and survey use cases
    - Consumer navigation, ride-hailing, adtech, generic GIS unrelated to EO collection
    - Mixed enterprise and public buyers across industries
    - Useful TAM ceiling but too broad to represent ICEYE’s immediate SAM or SOM
  notes: Boundary logic separates urgent, radar-specific workflows from adjacent geospatial software and public open-data substitutes. Rows mix product and buyer lenses intentionally because the monetizable boundary is workflow-defined.
