- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for ICEYE
  - Diligence Ask
  rows:
  - - Commercialization of sovereign ISR
    - Driver
    - Current / structural
    - More governments are willing to buy commercial SAR or dedicated capacity instead of waiting for national-only systems
    - Map actual contract values and renewal terms for named defense wins
  - - Catastrophe-loss frequency and severity
    - Driver
    - Current / structural
    - Recurring insured losses make faster event intelligence and payout workflows economically relevant every year
    - Test where insurers convert loss pressure into recurring data budgets
  - - Parametric insurance adoption
    - Driver
    - Current / scaling
    - Objective triggers create a product surface where SAR-derived flood or hazard signals can move directly into payout logic
    - Verify attach points, trigger governance, and premium economics by product type
  - - Latency-sensitive tasking and delivery
    - Driver
    - Current
    - Premium buyers increasingly pay for priority windows, near-real-time delivery, and workflow automation rather than for imagery alone
    - Quantify willingness-to-pay for lower latency by vertical
  - - Open Sentinel substitute
    - Constraint
    - Current / structural
    - Public SAR data caps pricing for non-urgent use cases and narrows the premium segment ICEYE can monetize
    - Specify the revisit, latency, and resolution thresholds that force buyers off open data
  - - Multi-vendor commercial SAR supply growth
    - Constraint
    - Current / increasing
    - Capella, Umbra, Synspective and others make premium SAR less scarce and raise the odds of pricing pressure
    - Benchmark archive pricing, tasking SLAs, and win-loss patterns
  - - Regulatory and orbital-debris conditions
    - Constraint
    - Structural
    - Constellation growth depends on licenses, disposal compliance, and coordination rather than demand alone
    - Check whether regulatory cadence could bottleneck capacity expansion
  - - Opaque private economics
    - Constraint
    - Current
    - Without disclosed contract values, retention, or segment mix, bottom-up SOM remains speculative
    - Request customer-count, ACV, renewal, and segment revenue evidence directly from management
  notes: Drivers and constraints are mixed in one register because the same capability gains that expand adoption can also accelerate competition. Timing labels refer to observed pressure as of the 2026-05-26 run date.
