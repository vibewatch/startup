- id: demand-drivers-across-verticals
  title: Demand Drivers Across Defense, Disaster Response, and Insurance
  body: 'The strongest demand drivers are visible in three places. First, defense procurement has normalized the use of commercial SAR as a complement to sovereign systems. ICEYE’s Finland deal, Capella’s NRO contract, Umbra’s Stage III NRO award, and Synspective’s JASDF security project all indicate that governments increasingly treat commercial radar as a permanent part of ISR architecture rather than a one-off experiment. Second, catastrophe economics keep worsening. Swiss Re now treats annual insured catastrophe losses above $100 billion as standard, Munich Re markets parametric natural-catastrophe solutions explicitly around faster settlement and emergency-response costs, and FEMA/Copernicus maintain operational mapping programs that turn remote sensing into a budgeted workflow.


    Third, the product economics increasingly favor vendors that can connect imaging to a faster operational cycle. ICEYE markets sub-hour or same-cycle delivery for priority users; Capella markets automated tasking every 20 minutes; Synspective markets daily revisit and orbit design as key to change detection. These are not vanity metrics. They are the mechanisms that let a government react before a mission window closes, or let an insurer trigger triage before loss-adjustment backlogs form. Climate risk and geopolitical conflict amplify the urgency of those workflows, which is why the most valuable spend sits in premium, low-latency segments rather than in commodity archive imagery.'
