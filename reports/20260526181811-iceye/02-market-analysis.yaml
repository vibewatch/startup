  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: iceye-segment-revenue-mix
    missingEvidence: A current split of ICEYE revenue or backlog by defense, insurance, disaster response, and other verticals.
    whyItMatters: Without segment mix, the chapter can define the market boundary but cannot convert it into a defended bottom-up SOM tied to actual customer spend.
    diligencePath: Request management reporting or board materials showing ARR/revenue, ACV, and renewal rates by vertical and geography.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: government-contract-values
    missingEvidence: Named contract values, annual ceilings, or option values for commercial SAR awards from defense and intelligence customers.
    whyItMatters: Public buyer names prove demand exists, but contract-value opacity prevents triangulating market share or renewal concentration risk.
    diligencePath: Collect procurement notices, budget exhibits, or direct customer disclosures for NRO-like programs and sovereign satellite deals.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: material
    topic: sar-only-tam-definition
    missingEvidence: A consistent public methodology separating SAR-only recurring data-and-derivatives spend from hardware, analytics software, and adjacent EO markets.
    whyItMatters: The published TAM lenses differ by an order of magnitude, so any valuation argument that uses one without boundary discipline is fragile.
    diligencePath: Build a bottoms-up served-market model using named buyers, use cases, and contract types instead of headline analyst TAM figures.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: bottom-up-som
    missingEvidence: Evidence on pricing, attach rates, renewals, and tasking utilization by segment sufficient to estimate an attainable three-year SOM.
    whyItMatters: The chapter can bound the market conceptually, but without unit economics and conversion evidence it cannot say how much of that market ICEYE can realistically capture.
    diligencePath: Request customer cohort data, event-based insurance pricing, sovereign program win-loss data, and SLA-driven price premiums by workflow.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM004
