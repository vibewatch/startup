  - id: FI001
    title: Disclosed capital-to-value conversion path
    type: flow
    summary: >-
      Prior financing funds platform, licensing, and clinical work, but public evidence stops before approval, pricing,
      revenue, or a supported runway.
    data:
      nodes:
        - id: capital
          label: Private financing
          detail: More than $400M at launch; later totals differ by source and are not current cash.
        - id: platform
          label: Mirador360 and data inputs
          detail: Company-reported platform capabilities and more than 2.5M molecular profiles.
        - id: licensing
          label: Asset licensing
          detail: $12M KP-301 signing payment plus unquantified development and sales milestones.
        - id: trials
          label: Clinical execution
          detail: KP-301 Phase 1 planned by year-end 2026 and Phase 2 AAV study in the first half of 2027.
        - id: readouts
          label: Value-inflecting evidence
          detail: Clinical results must establish safety and efficacy before commercial economics can be supported.
        - id: monetization
          label: Potential monetization
          detail: Approval, price, uptake, manufacturing cost, revenue, and margin remain undisclosed or prospective.
      edges:
        - from: capital
          to: platform
          label: funds research infrastructure
        - from: platform
          to: licensing
          label: informs portfolio choices
        - from: licensing
          to: trials
          label: creates development obligations
        - from: trials
          to: readouts
          label: generates clinical evidence
        - from: readouts
          to: monetization
          label: may enable later approval and sales
    approximationNotes: This is an evidence-bound sequence, not a forecast, valuation bridge, or claim that conversion will occur.
    claimRefs:
      - CI001
      - CI005
      - CI007
      - CI008
      - CI009
      - CI015
  - id: FE001
    title: Mirador360 product architecture map
    type: stack
    summary: >-
      A disclosed-to-inferred stack from biological data inputs through clinical development decisions, with explicit
      evidence gaps at each handoff.
    data:
      layers:
        - label: Biological inputs
          detail: Company-described biological and molecular data inputs.
          items:
            - label: Human genetics
              detail: Input described in launch materials.
            - label: Molecular profiles
              detail: More than 2.5 million profiles claimed in the July 2026 release.
        - label: Analytical engine
          detail: Company-described data harmonization and analytical methods.
          items:
            - label: Multi-modal data
              detail: Company describes a multi-modal repository and harmonization.
            - label: AI and advanced analytics
              detail: Company-described methods for target and patient analysis.
        - label: Development decisions
          detail: Company-described target, combination, indication, and patient outputs.
          items:
            - label: Targets and combinations
              detail: Novel targets and potential target pairs are stated outputs.
            - label: Patient stratification
              detail: Patient selection and diagnostic development are stated outputs.
        - label: Clinical execution
          detail: Development programs and evidence required to validate the platform.
          items:
            - label: Clinical programs
              detail: KP-301 is planned for Phase 1 and Phase 2 development.
            - label: Regulatory and quality evidence
              detail: Public sources do not disclose Mirador-specific validation or quality controls.
        - label: Data governance
          detail: Required controls are identified by external privacy and regulatory sources, not disclosed by Mirador.
          items:
            - label: Consent and access
              detail: Genome.gov identifies consent and controlled access as relevant safeguards.
        - label: Partner dependencies
          detail: Licensed assets add counterparties and operational obligations.
          items:
            - label: Kira license
              detail: KP-301 rights and execution depend on the exclusive worldwide license.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
      - CE009
  - id: FU001
    title: Evidence-qualified path from data to a future customer relationship
    type: journey-map
    summary: >-
      Public evidence reaches clinical development but does not yet demonstrate commercial acquisition, retention, or
      expansion.
    data:
      items:
        - label: Molecular-profile input
          value: 2.5M+ profiles
          detail: Company-claimed analytical corpus; not a user or customer count.
        - label: Target and indication selection
          value: Mirador360
          detail: Company says the engine informs targets, combinations, and patient stratification.
        - label: Program formation
          value: Pipeline decisions
          detail: The science page describes translation of insights into pipeline choices.
        - label: Clinical development
          value: ~140 Phase 2 participants
          detail: Secondary report of one IBD study; participants are not customers.
        - label: Clinical readout
          value: Future evidence
          detail: Prospective milestones are not completed outcomes or repeat usage.
        - label: Commercial access and expansion
          value: Not disclosed
          detail: No named buyer, payer, procurement path, renewal, or account expansion is public in the assigned evidence.
    approximationNotes: The sequence is analytical rather than a measured conversion funnel; no stage-to-stage rates are inferred.
