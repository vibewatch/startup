  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and workflow
        blocks:
          - type: paragraph
            body: >-
              Mirador describes Mirador360 as an end-to-end precision discovery and development engine for
              immune-mediated inflammatory and fibrotic diseases. The customer-facing output is therefore a
              drug-development decision set: target hypotheses, combination hypotheses, indication prioritization, and
              patient-selection or diagnostic strategies. The workflow starts with human genetics and multi-modal
              molecular profiles, applies data science, AI, and advanced analytics, and feeds the resulting insights
              into therapeutic programs and clinical strategy. This is a credible operating model for a clinical-stage
              biotech, but the public record does not expose model performance, validation cohorts, data provenance, or
              a reproducible handoff from platform output to a clinical protocol. Its value remains contingent on the
              pipeline generating differentiated efficacy and safety, rather than on the existence of a large repository
              alone.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
