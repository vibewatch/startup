  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Mirador is earlier-stage but more explicitly platform-led, while established biologics have stronger clinical and
      commercial maturity in the retained evidence.
    data:
      xAxis:
        label: Public clinical/commercial maturity
        min: 1
        max: 5
        low: Early or undisclosed
        high: Approved and commercial
        description: Analyst ordinal coding from retained evidence
        scale: 1-5 ordinal
      yAxis:
        label: Explicit precision-platform emphasis
        min: 1
        max: 5
        low: Not evidenced
        high: Central disclosed strategy
        description: Analyst ordinal coding from retained evidence
        scale: 1-5 ordinal
      points:
        - label: Mirador
          x: 2
          'y': 5
          note: Company-described Mirador360; clinical-stage and pre-commercial in retained evidence.
        - label: Tremfya
          x: 5
          'y': 2
          note: Approved IV and subcutaneous IBD options with reported outcomes.
        - label: Skyrizi
          x: 5
          'y': 2
          note: Approved in Crohn's and UC according to retained reporting.
        - label: Omvoh
          x: 4
          'y': 2
          note: Approved UC alternative identified in retained reporting.
        - label: Rinvoq
          x: 5
          'y': 1
          note: Approved in both cited IBD indications; no precision-platform evidence retained.
        - label: KP-301
          x: 2
          'y': 4
          note: Licensed program with planned Phase 1 and long-acting design intent.
    approximationNotes: >-
      Ordinal coordinates are analyst-coded from disclosed maturity and platform descriptions; they are not clinical
