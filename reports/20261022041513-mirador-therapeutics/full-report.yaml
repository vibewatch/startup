  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Mirador Therapeutics announced its launch on March 21, 2024, as a San Diego-based clinical-stage company
              focused on immune-mediated inflammatory and fibrotic diseases. Its public materials describe Mirador360 as
              an end-to-end precision discovery and development engine that combines human genetics, multimodal data,
              AI, and advanced analytics to identify targets, prioritize combinations, and stratify patients. This
              supports a platform-plus-pipeline business model rather than a commercial software model. The assigned
              evidence establishes the disease focus and development intent, but not a marketed product, recurring
              revenue stream, or customer base.
            claimRefs:
              - CO001
              - CO002
              - CO013
          - type: table
            tableRef: TO001
