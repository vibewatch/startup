  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand context
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all prescription medicines. It is specialty therapeutics for chronic
              immune-mediated inflammatory and fibrotic diseases, including inflammatory bowel disease, rheumatoid or
              related inflammatory disease, pulmonary fibrosis, and inflammatory vascular disease. The boundary includes
              branded and biosimilar biologics, oral or injectable small molecules, and diagnostics or stratification
              tools only when they are part of the treatment pathway. It excludes general primary-care medicines,
              unrelated oncology spending, and the full value of drug-discovery software sold independently of a
              therapy. Mirador's own description places its engine and pipeline across immune-mediated inflammatory and
              fibrotic diseases, while the KP-301 announcement extends the stated portfolio into ANCA-associated
              vasculitis. That breadth creates multiple adjacent opportunities, but it also means a single headline TAM
              would mix different buyers, clinical endpoints, and reimbursement regimes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
      - number: '2.2'
        title: Sizing lenses and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports a set of market lenses rather than a single defensible TAM. ASHP reports U.S.
              prescription-drug spending of $915 billion in 2025 and projects more than $1 trillion in 2026, with
              clinics and hospitals seeing different growth profiles; this is a macro spending context, not an
              immunology TAM. CMS shows that ten selected high-expenditure single-source drugs represented $56.2
              billion, or about 20% of Medicare Part D gross covered prescription-drug costs, in 2023, and that
              negotiated prices are intended to reduce net spending.       At the category level, LucidQuest identifies
              entrenched biologics, JAK inhibitors, and payer step edits as adoption hurdles, while Fierce Biotech
              reports that Mirador initially focused on gastrointestinal, lung, and skin diseases. Mirador's
              company-issued materials describe a broad platform and planned clinical expansion, but do not disclose
              asset-level price, eligible-patient, market-share, or response-rate assumptions. Therefore the addressable
              opportunity is strategically meaningful but cannot be converted into a company-specific SAM or SOM without
              indication, line-of-therapy, geography, price, and probability-of-success inputs.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer changes by development stage and indication. In discovery and trials, Mirador's
              internal development organization, investigators, and specialist sites control access to data and
              enrollment. At launch, prescribers and specialist centers influence treatment choice, while commercial
              payers and pharmacy benefit managers control formulary access, prior authorization, and step edits.
              Patients are the treatment users and bear adherence and administration burdens, but are not necessarily
              the budget owners. CMS's negotiation framework explicitly considers therapeutic alternatives, comparative
              effectiveness, unmet need, manufacturer data, and research and development costs, showing why future
              evidence must connect clinical differentiation to payer-recognized value. Mirador's public narrative
              emphasizes target validation, patient stratification, and combination selection; the adoption trigger
              would be prospective evidence that those capabilities produce better outcomes, safer dosing, or meaningful
              convenience against established biologics and biosimilars. Until that evidence exists, switching cost,
              payer access, and platform-to-product translation remain material constraints.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.4'
        title: Evidence gaps and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The public record supports a credible demand thesis but not a fully underwritten market share thesis.
              Mirador has announced a $250 million Series B and multiple future readouts, and its July 2026 release
              describes a Phase 1 target for KP-301 by year-end 2026 and a Phase 2 AAV study in the first half of 2027.
              Those milestones improve the timing narrative, not the denominator used for market sizing. The remaining
              diligence work is indication specific: identify the first commercial asset, define its eligible population
              and treatment line, establish net price and duration assumptions, compare efficacy and safety with
              standard of care, and test whether biomarker enrichment is prospectively validated. A financing or
              platform announcement cannot substitute for clinical proof, payer evidence, or an asset-level forecast.
              The central market conclusion is consequently “large, segmented, and potentially valuable,” with valuation
              sensitivity concentrated in clinical probability of success and reimbursement differentiation rather than
              generic category growth.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market conclusion
            body: >-
              The opportunity is attractive at the category level, but Mirador's investable SAM and SOM remain open
              until a lead asset, target population, clinical effect size, and reimbursement path are disclosed.
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
              - CM016
          - type: callout
            title: Adoption constraint
            body: >-
              A broad precision-immunology platform does not by itself establish payer differentiation; prospective
              biomarker and outcome evidence must clear entrenched biologic, biosimilar, and access hurdles.
            calloutType: risk
            claimRefs:
              - CM008
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and basis of comparison
        blocks:
          - type: paragraph
            body: >-
              Mirador operates in a crowded immunology and inflammation landscape rather than a vacant category. Its own
              materials describe an end-to-end engine that combines biology, multi-modal data, AI, and analytics to
              identify targets, combinations, and patients, while the launch release frames the ambition as first- or
              best-in-class precision medicines for chronic immune-mediated inflammatory and fibrotic diseases.
              BioPharma Dive reported that Mirador had not disclosed which conditions or targets it would pursue at
              launch and separately pointed to Roche and Sanofi activity around TL1A medicines. That combination creates
              a credible strategic thesis but not yet a proven competitive outcome. The relevant alternatives therefore
              include established biologics, precision-oriented entrants, licensing partners, and the status quo of
              broad immunosuppression or internal development. Comparisons below separate sourced facts from unknowns
              rather than treating a vendor claim as an independent benchmark.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
              - CP015
      - number: '3.2'
        title: Competitor profiles and capability tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The strongest incumbent evidence is not a direct head-to-head with Mirador; it is evidence of what
              clinicians can already obtain. Fierce Pharma reports that J&J's Tremfya has both intravenous and
              subcutaneous options across inflammatory bowel disease, with clinical-remission and endoscopic-improvement
              results reported for the injectable UC regimen. The same report names AbbVie's Skyrizi and Rinvoq, Lilly's
              Omvoh, and Stelara as approved alternatives, while reported second-quarter Tremfya sales provide a scale
              signal. These products bring regulatory precedent, distribution, and physician familiarity that Mirador
              must overcome. Mirador's counter-position is earlier-stage: Mirador360 is intended to improve target
              selection and patient stratification, while KP-301 adds a licensed antibody program with a planned Phase 1
              start by year-end 2026. The public record does not establish comparative efficacy, pricing, market access,
              or realized development speed.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Mirador's potential moat is a compound of molecular data, analytics, genetics, diagnostics, and external
              data access; it is not yet a demonstrated commercial lock-in. The 2026 KP-301 announcement says Mirador360
              leverages more than 2.5 million molecular profiles, and a syndicated joint release describes a 23andMe
              collaboration using aggregated, de-identified genetic and phenotypic data. These are company- or
              partner-issued descriptions and should not be treated as independently verified performance. On the other
              side, incumbent products can create practical switching friction through approval status, clinical
              evidence, dosing convenience, reimbursement familiarity, and supply or channel access. FDA's
              phase-transition statistics also underline the execution gap between a planned early-stage program and an
              approved incumbent. Mirador's adverse case is therefore that platform differentiation may fail to
              translate into assets before incumbents or other precision entrants extend their positions.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits summarize only evidence that can be tied to the retained source set. Unknown pricing,
              comparative clinical efficacy, payer access, and customer adoption are deliberately preserved as diligence
              gaps rather than scored as advantages. The quadrant is an ordinal synthesis, not a market-share forecast,
              efficacy comparison, or clinical ranking. The matrix keeps unavailable cells visible so a reader can
              distinguish a true competitive weakness from a missing public disclosure. In underwriting, the unresolved
              translation from platform inputs to validated assets is the central competitive question, while the
              breadth and resources of incumbent and emerging alternatives make execution timing part of the moat
              assessment.
            claimRefs:
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform ambition and capital base
            body: >-
              Mirador combines a named precision-development engine, a broad program-building ambition, and substantial
              disclosed private financing.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP015
          - type: callout
            title: Incumbent execution gap
            body: >-
              Approved competitors already provide clinical evidence, dosing options, and commercial familiarity;
              Mirador has not publicly disclosed comparative efficacy, price, or payer traction.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP012
          - type: callout
            title: Underwrite the translation step
            body: >-
              The next diligence milestone is evidence that Mirador360 improves asset selection or clinical outcomes
              relative to established immunology programs, not another platform description.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP011
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization evidence
        blocks:
          - type: paragraph
            body: >-
              Mirador is still a clinical-stage therapeutics developer, so the public evidence supports potential future
              product economics rather than current recurring revenue. The KP-301 agreement gives Mirador worldwide
              development, manufacturing, and commercialization rights, which creates a possible product-sales route if
              the asset reaches approval. Mirador360 is described as an internal precision-development engine that
              informs target selection, combinations, and clinical strategy; the retained sources do not show that the
              platform is sold as a standalone service. The 23andMe relationship adds targeted, aggregated,
              de-identified genetic and phenotypic data to the development process, but its announcement contains no
              payment terms and is not evidence of customer revenue. Across the retained materials, Mirador discloses
              neither product revenue nor ARR, list or realized pricing, gross margin, commercial customer count, or
              revenue mix. The appropriate underwriting treatment is therefore pre-revenue: future value depends on
              clinical progress, approval, reimbursement, manufacturing economics, and any later partnering terms, none
              of which can yet be converted into a supported revenue forecast.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI010
              - CI011
              - CI015
      - number: '4.2'
        title: Capital formation, commitments, and milestone load
        blocks:
          - type: paragraph
            body: >-
              Financing disclosures require careful labeling rather than a single synthetic cash balance. Mirador
              announced more than $400 million at its March 2024 launch, a figure independently echoed by PharmaPhorum
              and BioSpace. Multiples reports $730 million across three rounds and labels the most recent completed
              round a $250 million Series B in January 2026, while Mirador's July 2026 release says only that it has
              raised more than $650 million. These statements can coexist because “more than $650 million” is not an
              exact total, but Multiples is not an audited financial statement and its $730 million should not be
              treated as cash available. On the use side, the KP-301 license requires $12 million upon signing plus
              unspecified development and sales milestones. Mirador also plans a Phase 1 study by year-end 2026 and a
              Phase 2 AAV study in the first half of 2027. Those disclosed activities create near-term cash demands
              whose size cannot be modeled without trial budgets, manufacturing plans, headcount costs, and the
              milestone schedule.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI008
              - CI009
              - CI015
      - number: '4.3'
        title: Capital adequacy, counterparty risk, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The central financial gap is a current cash bridge. None of the retained evidence discloses Mirador's cash
              balance, burn rate, runway, or debt and credit facilities, so historical funding cannot answer whether the
              company can fund announced studies and a broader pipeline through value-inflecting readouts. The external
              financing backdrop is not closed: xTalks' 2026 list includes clinical-stage biotech IPOs with gross
              proceeds ranging from $172.5 million for SpyGlass to $770.5 million for Parabilis. That range is only
              market context, not evidence that Mirador can access public capital or command comparable terms.
              Counterparty diligence is also warranted. After announcing the Mirador research collaboration, 23andMe
              entered Chapter 11 and disclosed a commitment for up to $35 million of debtor-in-possession financing. The
              filing does not prove that Mirador lost data access or incurred a financial loss, but it does justify
              confirming contract continuity, data rights, transfer provisions, and replacement costs. The verdict is
              research-more: obtain current financial statements, the cap table, monthly burn, asset-level development
              budgets, license obligations, and financing triggers before underwriting runway, revenue quality, margin,
              or valuation.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding raised is not runway
            body: >-
              Reported financing totals do not reveal current cash after operating spend, licensing payments, clinical
              commitments, or restricted balances.
            calloutType: risk
            claimRefs:
