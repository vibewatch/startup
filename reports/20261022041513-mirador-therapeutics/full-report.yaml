              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE009
      - number: '5.2'
        title: Asset map and maturity
        blocks:
          - type: paragraph
            body: >-
              The portfolio combines a platform layer with multiple therapeutic programs. The clearest newly disclosed
              asset is KP-301, obtained through an exclusive worldwide license from Kira Pharmaceuticals. Mirador
              describes KP-301 as a long-acting anti-C5a antibody intended to inhibit C5a/C5aR-mediated inflammation,
              with a Phase 1 study planned by the end of 2026 and a Phase 2 ANCA-associated vasculitis study planned for
              the first half of 2027. Company launch material also says the engine is advancing multiple programs across
              immuno-fibrotic disease. These are company plans and mechanism descriptions, not clinical proof. A
              diligence review should therefore separate licensed rights, preclinical or development-stage claims,
              registered trial status, and observed readouts; the assigned public sources do not provide protocol
              identifiers, trial enrollment, safety data, or asset-level probability of success.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Technical controls, dependencies, and risks
        blocks:
          - type: paragraph
            body: >-
              Mirador's architecture depends on access to sensitive human genomic and molecular data, statistical
              validity of enrichment decisions, and laboratory and clinical execution. FDA guidance recognizes
              enrichment strategies as a way to use participant characteristics to improve clinical investigations, but
              also makes the regulatory context part of the design problem. Genome.gov describes informed consent,
              controlled access, HIPAA protections, GINA, and Certificates of Confidentiality as relevant privacy
              safeguards for genomic research. Mirador's public pages do not specify its consent model,
              de-identification controls, access review, model governance, cybersecurity program, assay quality system,
              or partner-level responsibilities. The Kira license adds a supply and intellectual-property dependency for
              KP-301. The resulting risk is not simply cyber risk: data rights, clinical enrichment validity, regulatory
              acceptance, manufacturing readiness, and evidence of reproducibility all have to survive the path from
              platform to patient.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform-to-pipeline coherence
            body: >-
              Mirador's disclosed engine, target strategy, patient stratification, and clinical pipeline describe a
              coherent precision-immunology operating model rather than a standalone data product.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: callout
            title: Translation remains the gating event
            body: >-
              The assigned evidence supports company-described mechanisms and development plans, but not model
              validation, clinical efficacy, safety, assay performance, or reproducible platform advantage.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
          - type: callout
            title: Request platform and quality evidence
            body: >-
              Before underwriting technical differentiation, request data provenance and consent documentation,
              model-validation packages, assay cut-points, trial identifiers, manufacturing controls, and the Kira
              license's operational obligations.
            calloutType: recommendation
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Beneficiaries are visible; buyers and payers are not
        blocks:
          - type: paragraph
            body: >-
              Mirador describes patients with chronic immune-mediated inflammatory and fibrotic diseases as the
              beneficiaries of its pipeline, and an independent profile names Crohn's disease, ulcerative colitis,
              rheumatoid arthritis, and idiopathic pulmonary fibrosis among the disease areas associated with its
              antibodies. That establishes a patient and indication lens, not a customer roster. The reviewed public
              materials do not identify a paying biopharma customer, health system, prescriber account, payer,
              purchasing body, or commercial channel. Kira Pharmaceuticals appears in the evidence as the licensor of
              KP-301 and a recipient of consideration from Mirador, so counting it as a customer would reverse the
              disclosed economic relationship. Commercial buyer, payer, and site segmentation therefore remains
              unavailable.
            claimRefs:
              - CU001
              - CU003
              - CU010
              - CU012
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU010
              - CU012
              - CU014
      - number: '6.2'
        title: Current adoption signals are clinical-development proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest visible scale measures concern development inputs and trials. Mirador says its engine uses
              more than 2.5 million molecular profiles, while the independent profile reports an approximately
              140-patient Phase 2 inflammatory-bowel-disease study. Neither metric is a customer count: profiles are an
              analytical input and enrolled patients are research participants. The KP-301 announcement set prospective
              Phase 1 and Phase 2 milestones, which indicate planned development activity rather than completed
              deployment or repeat purchase. Even the third-party profile's account of four molecules in the clinic
              describes pipeline maturity, not revenue adoption. Public evidence therefore supports clinical momentum
              but no commercial adoption curve.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU013
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU015
      - number: '6.3'
        title: Named customer proof and durability evidence are absent
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence contains no named paying-customer case study, production deployment, purchaser
              testimonial, contract term, renewal rate, gross or net revenue retention, churn rate, satisfaction score,
              or cohort analysis. The official pages explain Mirador360 and pipeline intentions, but they do not connect
              a named external buyer to a purchase, outcome, or recurring relationship. A syndicated-publisher URL that
              discovery associated with Mirador yielded only generic stock-data attribution in its fetched text, so it
              cannot substantiate the advertised company release or any customer claim. The named-proof table therefore
              separates a licensor and trial participants from customers instead of presenting logos or counterparties
              as evidence of retention.
            claimRefs:
              - CU002
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU007
              - CU010
              - CU012
              - CU013
      - number: '6.4'
        title: Expansion and concentration cannot yet be underwritten
        blocks:
          - type: paragraph
            body: >-
              The public operating path runs from molecular data to target selection, clinical strategy, trials, and
              eventual commercialization. It is not yet a demonstrated land-and-expand loop: no initial account,
              renewal, indication expansion purchased by the same customer, channel contribution, or payer conversion is
              disclosed. Independent medical references reinforce that Crohn's disease and rheumatoid arthritis are
              chronic conditions with persistent treatment needs, but disease burden does not establish Mirador demand
              or willingness to pay. Without customer-level revenue, contracts, pipeline conversion, procurement
              timelines, or channel data, top-customer exposure and partner dependence cannot be quantified. Diligence
              should obtain anonymized account and trial-site cohorts before assigning commercial durability.
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical scale is not customer traction
            body: >-
              Molecular profiles, trial participants, programs, financing, and licensing counterparties should not be
              counted as customers. Commercial diligence remains dependent on private account, payer, procurement, and
              retention evidence.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk prioritization and thesis-break signals
        blocks:
          - type: paragraph
            body: >-
              Mirador is a clinical-stage biotech, so the central risk is not current product reliability but whether
              its precision-development process produces differentiated medicines on the announced schedule. The company
              describes Mirador360 as an engine using human genetics, multimodal data, AI and analytics to identify
              targets, combinations and patients, while its July 2026 license announcement says KP-301 Phase 1 is
              planned by year-end 2026 and Phase 2 in the first half of 2027. Those are company-stated plans, not
              clinical results. A missed filing, delayed trial, negative safety signal, or failure to demonstrate
              patient-selection utility would therefore be a thesis-break indicator rather than a routine operating
              variance. The public record also does not establish a cash runway, burn rate, valuation, clinical success
              probability, or customer revenue. The prudent stance is to monitor milestone delivery and demand evidence
              for data provenance, model validation, and asset-level clinical performance before treating the platform
              as de-risked.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR011
              - CR013
              - CR014
      - number: '7.2'
        title: Data, privacy, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Mirador's stated use of millions of molecular profiles creates a material data governance surface even
              where the company intends to use de-identified data. HHS guidance says the HIPAA de-identification
              standard requires that information not identify an individual and that the covered entity have no
              reasonable basis to believe it can be used to identify one; it describes Expert Determination and Safe
              Harbor as the two methods. The same guidance warns that unique features and rare clinical events can
              create identification risk even after listed identifiers are removed. Separately, the FTC Health Breach
              Notification Rule summary says vendors of personal health records and related entities must notify
              consumers after a breach involving unsecured information, and describes obligations involving service
              providers and certain breaches affecting 500 or more people. These regulatory texts do not establish that
              Mirador is subject to every provision, nor do they show an incident; they define diligence tests for the
              company's data contracts, provenance, de-identification validation, security controls, and breach-response
              allocation. The company has not publicly supplied those artifacts in the assigned evidence.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR009
              - CR015
              - CR016
      - number: '7.3'
        title: Partner, execution, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              The KP-301 transaction adds a concrete external dependency: Mirador receives exclusive worldwide rights to
              develop, manufacture and commercialize the asset, while Kira receives $12 million at signing and may
              receive development and sales milestones. This can broaden the pipeline, but it also introduces
              counterparty, intellectual-property, manufacturing, milestone and trial-execution dependencies. The launch
              financing was reported as more than $400 million in 2024, and the company's later BioSpace profile says it
              has raised over $650 million; Latham's advisory page corroborates the original financing amount. Neither
              amount is cash available today, and neither source discloses burn, obligations, runway or valuation.
              Mirador's official materials describe a broad portfolio and a proprietary engine, but no independent
              source in this pool verifies platform performance or asset-level clinical outcomes. Mitigations should
              therefore be tested through executed trial milestones, independent data review, license diligence, vendor
              concentration disclosure, and a current cash bridge rather than inferred from financing size or management
              assertions.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring plan and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The highest-value monitoring indicators are observable and time-bounded: whether KP-301 enters Phase 1 by
              the company's stated 2026 target, whether the planned 2027 AAV study starts, whether clinical disclosures
              include safety and pharmacology denominators, and whether the company can document lawful, reproducible
              data handling. A second set of triggers concerns financing resilience: current cash, committed milestones
              payable to Kira, manufacturing readiness, and any new financing or licensing terms. The evidence set
              contains no public litigation, breach, outage, recall, or failed-deployment record for Mirador; that is an
              evidence limitation, not proof that none occurred. Before increasing conviction, diligence should obtain
              the data-use and business-associate agreements, de-identification or expert-determination records,
              security assessment, clinical-development plan, IP and license schedules, cash runway, and a complete
              incident and regulatory correspondence log.
            claimRefs:
              - CR015
              - CR016
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Data governance is a thesis-level dependency
            body: >-
              Mirador's platform depends on molecular-profile data, but the assigned public record does not disclose
              provenance, de-identification validation, or breach-response controls. Treat privacy and data-quality
              diligence as a gating item before underwriting platform scale.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: callout
            title: Financing is not runway
            body: >-
              The reported financing totals describe capital raised at historical points, not cash available, burn,
              runway, or obligations. A current cash bridge is required before using financing size to reduce financial
              risk.
            calloutType: assumption
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Milestones should be treated as kill criteria
            body: >-
              Failure to meet the disclosed KP-301 development milestones, or inability to produce independent clinical
              and data-governance evidence, should reduce conviction rather than be absorbed as an unquantified
              execution variance.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Mirador has funded a multi-asset clinical strategy unusually early: the
              company says it closed a $250 million Series B in the third quarter of 2025, has raised more than $650
              million since launch, and expects more than 10 clinical readouts by year-end 2027. Its Mirador360 engine
              is described as combining more than 2.5 million patient profiles with machine learning for target
              discovery, patient stratification, and combination prioritization. The anti-thesis is equally material:
              those are primarily company-described inputs and plans, while the public record supplies no asset-level
              efficacy, probability-of-success, revenue, cash-balance, or post-money valuation. Financing scale
              therefore demonstrates access to capital, not investor return potential.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest disclosed financing context is a $250 million Series B that closed in Q3 2025 and brought total
              capital raised since the March 2024 launch to more than $650 million. The materials identify institutional
              investors and state that proceeds are intended to deliver proof-of-concept across current programs and
              advance additional candidates. They do not disclose the round post-money valuation, share price,
              ownership, liquidation preferences, option pool, debt, cash balance, burn rate, runway, or
              milestone-linked tranches. The 2026 Kira license adds a disclosed $12 million payment obligation at
              signing plus development and sales milestones, which is relevant to capital intensity but cannot be
              treated as a valuation mark. Without those terms, a precise entry multiple or target return would be false
              precision.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV012
              - CV016
      - number: '8.3'
        title: Scenario framing and comparable set
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is possible only as a diligence scaffold, not as a forecast. The bull case requires
              clinical proof-of-concept across one or more programs, continued financing access, and evidence that the
              Mirador360 approach improves development decisions enough to support differentiated assets. The base case
              assumes continued clinical execution but slower or mixed readouts, leaving the company dependent on
              private capital and partnership economics. The bear case is triggered by weak efficacy, safety or
              enrollment outcomes, delayed readouts, or financing on materially worse terms. The only transaction
              reference in the assigned evidence is the predecessor team's Prometheus history: Mirador's launch release
              puts Merck's 2023 acquisition at $10.8 billion, while GEN described it as nearly $11 billion. That
              strategic transaction is evidence of team pedigree, not a like-for-like mark for Mirador's current
              pipeline, so no comparable-derived range is asserted.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV017
              - CV018
      - number: '8.4'
        title: Recommendation, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy or avoid. Mirador has credible financing sponsors, a
              stated capital-efficiency focus, and multiple planned clinical catalysts, but public information is not
              sufficient to determine whether the implied price embeds realistic clinical probabilities or whether
              future dilution and preference overhang could absorb upside. Exit readiness is therefore conditional on
              asset-level proof-of-concept, a current cap table and financing mark, cash and runway, and a clear path to
              a strategic partnership or registration-enabling data. The thesis breaks if readouts materially miss the
              stated timetable, if safety or efficacy undermines the portfolio, or if new financing reveals a valuation
              reset that is not compensated by stronger evidence.
            claimRefs:
              - CV012
              - CV015
              - CV016
              - CV017
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV012
              - CV016
              - CV017
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Defer a buy decision until Mirador supplies a current financing mark, cap-table and preference terms,
              cash/runway, and asset-level clinical evidence. The public evidence supports continued diligence, not a
              defensible price target.
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV017
          - type: callout
            title: Thesis-break trigger
            body: >-
              A material miss against planned clinical readouts, safety or efficacy failure, or a financing round at
              materially worse terms would break the current option-value thesis and require a lower valuation stance.
            calloutType: risk
            claimRefs:
              - CV013
              - CV018
