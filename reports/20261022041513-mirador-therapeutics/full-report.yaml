              - CI004
              - CI005
              - CI016
          - type: callout
            title: Build the model from primary private evidence
            body: >-
              Require bank cash, monthly burn, trial budgets, license milestones, manufacturing assumptions, and
              indication-level pricing before assigning a financing horizon.
            calloutType: recommendation
            claimRefs:
