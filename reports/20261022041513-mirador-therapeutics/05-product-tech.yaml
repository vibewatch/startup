  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: validation
      missingEvidence: Prospective benchmark results, independent replication, and platform-to-clinical translation evidence for Mirador360.
      whyItMatters: Without performance evidence, the platform may be a coherent narrative without a measurable advantage in target selection or clinical success.
      diligencePath: Request validation cohorts, locked model specifications, independent replication, and program-level evidence linking platform outputs to trial decisions.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: clinical-evidence
      missingEvidence: Trial registrations, protocols, enrollment, safety, pharmacokinetics, and efficacy data for KP-301 and other programs.
      whyItMatters: Development timing and mechanism claims are not substitutes for observed clinical maturity or risk-adjusted evidence.
      diligencePath: Obtain registry identifiers, protocols, clinical-study reports, and a current asset-by-asset development package.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
