schemaVersion: report-v2
artifact: product-tech
slug: mirador-therapeutics
runDate: 2026-10-22
company:
  name: Mirador Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: Mirador's product is a precision-immunology development engine paired with a clinical pipeline, not a commercial software product. Public materials describe a data-and-biology workflow that harmonizes molecular profiles, selects targets and combinations, and stratifies patients; the main underwriting gap is whether those platform outputs translate into validated clinical benefit, reproducible diagnostics, and defensible data governance.
sections:
  - id: product-workflow
    title: Product definition and workflow
    body: >-
      Mirador describes Mirador360 as an end-to-end precision discovery and
      development engine for immune-mediated inflammatory and fibrotic diseases.
      The customer-facing output is therefore a drug-development decision set:
      target hypotheses, combination hypotheses, indication prioritization, and
      patient-selection or diagnostic strategies. The workflow starts with
      human genetics and multi-modal molecular profiles, applies data science,
      AI, and advanced analytics, and feeds the resulting insights into
      therapeutic programs and clinical strategy. This is a credible operating
      model for a clinical-stage biotech, but the public record does not expose
      model performance, validation cohorts, data provenance, or a reproducible
      handoff from platform output to a clinical protocol. Its value remains
      contingent on the pipeline generating differentiated efficacy and safety,
      rather than on the existence of a large repository alone.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: asset-maturity
    title: Asset map and maturity
    body: >-
      The portfolio combines a platform layer with multiple therapeutic
      programs. The clearest newly disclosed asset is KP-301, obtained through
      an exclusive worldwide license from Kira Pharmaceuticals. Mirador
      describes KP-301 as a long-acting anti-C5a antibody intended to inhibit
      C5a/C5aR-mediated inflammation, with a Phase 1 study planned by the end
      of 2026 and a Phase 2 ANCA-associated vasculitis study planned for the
      first half of 2027. Company launch material also says the engine is
      advancing multiple programs across immuno-fibrotic disease. These are
      company plans and mechanism descriptions, not clinical proof. A diligence
      review should therefore separate licensed rights, preclinical or
      development-stage claims, registered trial status, and observed readouts;
      the assigned public sources do not provide protocol identifiers, trial
      enrollment, safety data, or asset-level probability of success.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
  - id: controls-and-risks
    title: Technical controls, dependencies, and risks
    body: >-
      Mirador's architecture depends on access to sensitive human genomic and
      molecular data, statistical validity of enrichment decisions, and
      laboratory and clinical execution. FDA guidance recognizes enrichment
      strategies as a way to use participant characteristics to improve
      clinical investigations, but also makes the regulatory context part of
      the design problem. Genome.gov describes informed consent, controlled
      access, HIPAA protections, GINA, and Certificates of Confidentiality as
      relevant privacy safeguards for genomic research. Mirador's public pages
      do not specify its consent model, de-identification controls, access
      review, model governance, cybersecurity program, assay quality system, or
      partner-level responsibilities. The Kira license adds a supply and
      intellectual-property dependency for KP-301. The resulting risk is not
      simply cyber risk: data rights, clinical enrichment validity, regulatory
      acceptance, manufacturing readiness, and evidence of reproducibility all
      have to survive the path from platform to patient.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014]

tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [Module or asset, User, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Mirador360 data layer", "Discovery and clinical teams", "Company-described operating engine", "Harmonizes human genetics and multi-modal molecular profiles", "Data provenance, cohort composition, and access rights are not public"]
      - ["Target discovery", "Translational scientists", "Company-described capability", "Uses genetics and analytics to identify novel targets", "No public hit-rate, validation set, or independent benchmark"]
      - ["Combination and indication selection", "Program and clinical teams", "Company-described capability", "Selects potential target pairs and prioritizes indications", "No disclosed decision threshold or prospective validation"]
      - ["Patient stratification and diagnostics", "Clinical development teams", "Company-described capability", "Aims to identify patients most likely to benefit", "No public assay specification, cut-point, or clinical performance"]
      - ["KP-301", "Patients and clinicians in AAV", "Planned Phase 1 by year-end 2026", "Long-acting anti-C5a antibody with sweeping mechanism", "Trial registration, manufacturing package, and clinical data are not in the pool"]
    notes: Company pages and the July 2026 license release describe capabilities and plans; nulls identify diligence gaps, not negative findings.
    claimRefs: [CE001, CE003, CE005, CE006, CE007, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Find a therapeutic target", "Broad target search followed by experimental validation", "Genetics-led target discovery in Mirador360", "Claimed faster and more accurate development", "No public prospective benchmark"]
      - ["Choose a combination", "Trial-and-error combination exploration", "Data-supported target-pair selection", "Claimed identification of optimal combinations", "No disclosed incremental response or safety result"]
      - ["Choose an indication", "Disease-area prioritization by conventional translational evidence", "Platform-supported indication prioritization", "Intended to focus programs on responsive biology", "No public prioritization score or external replication"]
      - ["Enrich a trial", "Enroll heterogeneous disease populations", "Patient stratification and diagnostic development", "Intended to raise probability of clinical success", "FDA acceptance and assay performance remain unproven for Mirador"]
      - ["Deliver chronic treatment", "Repeated dosing with existing modalities", "KP-301 designed for durable target coverage and infrequent administration", "Potential dosing convenience", "No human pharmacokinetic or clinical tolerability evidence"]
    notes: The table distinguishes intended workflow benefits from demonstrated outcomes; no public source in the assigned pool supplies realized clinical or operational performance.
    claimRefs: [CE002, CE003, CE006, CE008, CE009]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Human genetics and molecular profiles", "Biological input for target and patient hypotheses", "Lawful access to representative data", "Bias, consent, privacy, and data-rights exposure"]
      - ["Multi-modal data harmonization", "Makes heterogeneous measurements usable together", "Data standards and quality control", "Missingness and batch effects may distort associations"]
      - ["AI and advanced analytics", "Identifies associations, combinations, and patient segments", "Validated models and appropriately separated training and test data", "Overfitting or opaque reasoning can weaken regulator and clinician trust"]
      - ["Translational and clinical decision layer", "Converts platform insights into programs and trial designs", "Scientific, clinical, and regulatory review", "Platform signal may not reproduce in prospective trials"]
      - ["Licensed therapeutic execution", "Advances assets such as KP-301 into development", "Kira IP, manufacturing, and trial operations", "Rights, supply, safety, and execution dependencies remain material"]
    notes: Architecture is an evidence-bounded synthesis of disclosed inputs and decision uses; Mirador does not publicly disclose a complete software, laboratory, or quality-system architecture in the assigned sources.
    claimRefs: [CE001, CE002, CE009, CE010, CE011, CE012]

figures:
  - id: FE001
    title: Mirador360 product architecture map
    type: stack
    summary: A disclosed-to-inferred stack from biological data inputs through clinical development decisions, with explicit evidence gaps at each handoff.
    data:
      layers:
        - label: Biological inputs
          detail: Company-described biological and molecular data inputs.
          items:
            - label: Human genetics
              detail: Input described in launch materials.
            - label: Molecular profiles
              detail: More than 2.5 million profiles claimed in the July 2026 release.
        - label: Analytical engine
          detail: Company-described data harmonization and analytical methods.
          items:
            - label: Multi-modal data
              detail: Company describes a multi-modal repository and harmonization.
            - label: AI and advanced analytics
              detail: Company-described methods for target and patient analysis.
        - label: Development decisions
          detail: Company-described target, combination, indication, and patient outputs.
          items:
            - label: Targets and combinations
              detail: Novel targets and potential target pairs are stated outputs.
            - label: Patient stratification
              detail: Patient selection and diagnostic development are stated outputs.
        - label: Clinical execution
          detail: Development programs and evidence required to validate the platform.
          items:
            - label: Clinical programs
              detail: KP-301 is planned for Phase 1 and Phase 2 development.
            - label: Regulatory and quality evidence
              detail: Public sources do not disclose Mirador-specific validation or quality controls.
        - label: Data governance
          detail: Required controls are identified by external privacy and regulatory sources, not disclosed by Mirador.
          items:
            - label: Consent and access
              detail: Genome.gov identifies consent and controlled access as relevant safeguards.
        - label: Partner dependencies
          detail: Licensed assets add counterparties and operational obligations.
          items:
            - label: Kira license
              detail: KP-301 rights and execution depend on the exclusive worldwide license.
    claimRefs: [CE001, CE002, CE003, CE005, CE007, CE009]

callouts:
  - calloutType: strength
    title: Platform-to-pipeline coherence
    body: Mirador's disclosed engine, target strategy, patient stratification, and clinical pipeline describe a coherent precision-immunology operating model rather than a standalone data product.
    claimRefs: [CE001, CE002, CE005]
  - calloutType: risk
    title: Translation remains the gating event
    body: The assigned evidence supports company-described mechanisms and development plans, but not model validation, clinical efficacy, safety, assay performance, or reproducible platform advantage.
    claimRefs: [CE007, CE008, CE009, CE013]
  - calloutType: recommendation
    title: Request platform and quality evidence
    body: Before underwriting technical differentiation, request data provenance and consent documentation, model-validation packages, assay cut-points, trial identifiers, manufacturing controls, and the Kira license's operational obligations.
    claimRefs: [CE009, CE010, CE011, CE012, CE014]

