schemaVersion: "report-v2"
artifact: customers
slug: mirador-therapeutics
runDate: 2026-10-22
company:
  name: Mirador Therapeutics
chapter:
  number: 6
  title: Customers
  summary: >-
    Mirador's public evidence is pre-commercial: patients with immune-mediated disease are
    the intended beneficiaries, while the visible operating activity consists of clinical
    development and an in-licensed program rather than named paying customers. The assigned
    evidence does not disclose commercial deployments, retention, revenue concentration, or
    procurement channels, so trial participation and molecular-profile scale should not be
    mistaken for customer adoption.
sections:
  - id: beneficiary-and-buyer-segmentation
    title: Beneficiaries are visible; buyers and payers are not
    body: >-
      Mirador describes patients with chronic immune-mediated inflammatory and fibrotic
      diseases as the beneficiaries of its pipeline, and an independent profile names
      Crohn's disease, ulcerative colitis, rheumatoid arthritis, and idiopathic pulmonary
      fibrosis among the disease areas associated with its antibodies. That establishes a
      patient and indication lens, not a customer roster. The reviewed public materials do
      not identify a paying biopharma customer, health system, prescriber account, payer,
      purchasing body, or commercial channel. Kira Pharmaceuticals appears in the evidence
      as the licensor of KP-301 and a recipient of consideration from Mirador, so counting it
      as a customer would reverse the disclosed economic relationship. Commercial buyer,
      payer, and site segmentation therefore remains unavailable.
    claimRefs: [CU001, CU003, CU010, CU012, CU014]
    tableRefs: [TU001]
  - id: adoption-is-clinical-not-commercial
    title: Current adoption signals are clinical-development proxies
    body: >-
      The strongest visible scale measures concern development inputs and trials. Mirador
      says its engine uses more than 2.5 million molecular profiles, while the independent
      profile reports an approximately 140-patient Phase 2 inflammatory-bowel-disease study.
      Neither metric is a customer count: profiles are an analytical input and enrolled
      patients are research participants. The KP-301 announcement set prospective Phase 1
      and Phase 2 milestones, which indicate planned development activity rather than
      completed deployment or repeat purchase. Even the third-party profile's account of
      four molecules in the clinic describes pipeline maturity, not revenue adoption. Public
      evidence therefore supports clinical momentum but no commercial adoption curve.
    claimRefs: [CU005, CU006, CU007, CU013, CU015]
    tableRefs: [TU002]
  - id: proof-retention-and-reference-quality
    title: Named customer proof and durability evidence are absent
    body: >-
      The assigned evidence contains no named paying-customer case study, production
      deployment, purchaser testimonial, contract term, renewal rate, gross or net revenue
      retention, churn rate, satisfaction score, or cohort analysis. The official pages
      explain Mirador360 and pipeline intentions, but they do not connect a named external
      buyer to a purchase, outcome, or recurring relationship. A syndicated-publisher URL
      that discovery associated with Mirador yielded only generic stock-data attribution in
      its fetched text, so it cannot substantiate the advertised company release or any
      customer claim. The named-proof table therefore separates a licensor and trial
      participants from customers instead of presenting logos or counterparties as evidence
      of retention.
    claimRefs: [CU002, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: expansion-concentration-and-diligence
    title: Expansion and concentration cannot yet be underwritten
    body: >-
      The public operating path runs from molecular data to target selection, clinical
      strategy, trials, and eventual commercialization. It is not yet a demonstrated
      land-and-expand loop: no initial account, renewal, indication expansion purchased by
      the same customer, channel contribution, or payer conversion is disclosed. Independent
      medical references reinforce that Crohn's disease and rheumatoid arthritis are chronic
      conditions with persistent treatment needs, but disease burden does not establish
      Mirador demand or willingness to pay. Without customer-level revenue, contracts,
      pipeline conversion, procurement timelines, or channel data, top-customer exposure and
      partner dependence cannot be quantified. Diligence should obtain anonymized account and
      trial-site cohorts before assigning commercial durability.
    claimRefs: [CU008, CU009, CU011, CU015, CU016]
    figureRefs: [FU001]
