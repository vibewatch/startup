callouts:
  - calloutType: risk
    title: Clinical scale is not customer traction
    body: >-
      Molecular profiles, trial participants, programs, financing, and licensing
      counterparties should not be counted as customers. Commercial diligence remains
      dependent on private account, payer, procurement, and retention evidence.
    claimRefs: [CU006, CU007, CU010, CU012, CU016]
