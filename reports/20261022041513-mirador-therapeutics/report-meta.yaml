companyProfile:
  summary: >-
    Mirador Therapeutics is a San Diego clinical-stage precision-medicine company developing therapeutics for
    immune-mediated inflammatory and fibrotic diseases. Its Mirador360 platform combines human genetics, multimodal
    data, AI, and advanced analytics to support target discovery, combination prioritization, and patient
    stratification. The company has raised substantial private capital and is advancing a multi-asset clinical pipeline,
    but public disclosures do not establish current valuation, revenue, cash runway, or asset-level efficacy.
