      xAxis: {label: "Public clinical/commercial maturity", min: 1, max: 5, low: "Early or undisclosed", high: "Approved and commercial", description: "Analyst ordinal coding from retained evidence", scale: "1-5 ordinal"}
      yAxis: {label: "Explicit precision-platform emphasis", min: 1, max: 5, low: "Not evidenced", high: "Central disclosed strategy", description: "Analyst ordinal coding from retained evidence", scale: "1-5 ordinal"}
      points:
        - {label: "Mirador", x: 2, y: 5, note: "Company-described Mirador360; clinical-stage and pre-commercial in retained evidence."}
        - {label: "Tremfya", x: 5, y: 2, note: "Approved IV and subcutaneous IBD options with reported outcomes."}
        - {label: "Skyrizi", x: 5, y: 2, note: "Approved in Crohn's and UC according to retained reporting."}
        - {label: "Omvoh", x: 4, y: 2, note: "Approved UC alternative identified in retained reporting."}
        - {label: "Rinvoq", x: 5, y: 1, note: "Approved in both cited IBD indications; no precision-platform evidence retained."}
        - {label: "KP-301", x: 2, y: 4, note: "Licensed program with planned Phase 1 and long-acting design intent."}
    approximationNotes: "Ordinal coordinates are analyst-coded from disclosed maturity and platform descriptions; they are not clinical scores, market shares, or independent benchmarks."
    claimRefs: [CP001, CP003, CP005, CP006, CP008, CP009]
callouts:
  - calloutType: strength
    title: Platform ambition and capital base
    body: "Mirador combines a named precision-development engine, a broad program-building ambition, and substantial disclosed private financing."
    claimRefs: [CP001, CP002, CP015]
  - calloutType: risk
    title: Incumbent execution gap
    body: "Approved competitors already provide clinical evidence, dosing options, and commercial familiarity; Mirador has not publicly disclosed comparative efficacy, price, or payer traction."
    claimRefs: [CP005, CP006, CP012]
  - calloutType: recommendation
    title: Underwrite the translation step
    body: "The next diligence milestone is evidence that Mirador360 improves asset selection or clinical outcomes relative to established immunology programs, not another platform description."
    claimRefs: [CP010, CP011, CP013, CP016]
