      - [Eli Lilly Omvoh, "Approved incumbent biologic", "Funding and product-level scale not quantified in the retained evidence.", "Ulcerative colitis in the retained report.", "Approved IL-23 alternative.", "Relative outcomes, access, and economics are unavailable."]
      - [Roche and Sanofi TL1A programs, "Precision-oriented entrants", "Deal activity reported, but program funding and current scale are unavailable.", "Inflammatory conditions associated with TL1A development.", "Targeted programs backed by large pharmaceutical companies.", "The retained source does not provide current asset-level comparisons."]
