    notes: "Partial public snapshot: scale signals use the period and metric reported by each source; funding is not cash available, and product sales are not company revenue comparables."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP014, CP015]
  - id: TP002
    title: Competitor profile and capability matrix
    columns: [Buying criterion, Mirador, Tremfya / J&J, Skyrizi / AbbVie, Evidence status]
    rows:
      - [Target or patient precision, "Mirador360 is described as using genetics, multi-modal data, and analytics to identify targets and patients.", "Not established by retained source.", "Not established by retained source.", "Mirador cell is company-claimed; incumbent cells unknown."]
      - [Clinical maturity, "Clinical-stage; KP-301 Phase 1 planned by year-end 2026.", "Approved in UC and Crohn's with reported trial outcomes.", "Approved in Crohn's and UC per retained reporting.", "Supported by company announcement and independent trade reporting."]
      - [Dosing convenience, "KP-301 designed for durable target coverage and infrequent administration; not clinically demonstrated here.", "IV and subcutaneous options reported across IBD.", "Comparative dosing details not retained here.", "Mirador is planned/design intent; Tremfya is reported product evidence."]
      - [Distribution and trust, "No public commercial channel or payer data retained.", "Existing J&J commercial and regulatory position is an incumbent advantage by inference.", "Existing AbbVie commercial and regulatory position is an incumbent advantage by inference.", "Distribution scale is not quantified in assigned sources."]
      - [Data or platform breadth, "More than 2.5 million molecular profiles claimed, plus an announced 23andMe data collaboration.", "No comparable platform metric retained.", "No comparable platform metric retained.", "Company- and partner-issued; not independently benchmarked."]
    notes: "Unknown cells are intentional. The matrix compares disclosed capability signals and maturity, not therapeutic equivalence, efficacy, safety, or investment returns."
    claimRefs: [CP001, CP005, CP007, CP008, CP009, CP010, CP011]
  - id: TP003
    title: Pricing, packaging, and switching-cost comparison
    columns: [Dimension, Mirador, Established biologics, Diligence implication]
    rows:
      - [Price or contract model, null, "No price was retained for Tremfya, Skyrizi, or Omvoh.", "Obtain list and net price, gross-to-net, payer restrictions, and site-of-care economics."]
      - [Clinical evidence, "Future clinical readouts; KP-301 Phase 1 and Phase 2 plans announced.", "Tremfya outcomes and approvals are reported; other named products have approvals reported.", "Compare endpoint definitions, population, durability, and safety rather than platform narratives."]
      - [Administration, "KP-301 is designed for long-acting, infrequent dosing; unproven.", "Tremfya offers IV and subcutaneous formats across IBD.", "Convenience may be a switching lever, but actual adherence and total cost are unknown."]
      - [Channel or payer access, null, "Established products have an incumbent access position, but no payer terms were retained.", "Validate formulary placement, reimbursement, infusion economics, and diagnostic coverage."]
      - [Lock-in or multi-homing, "Potential data and diagnostic integration; no customer evidence.", "Physician familiarity, approvals, and treatment experience can create practical friction.", "Test whether Mirador's diagnostics and assets create repeatable workflow lock-in."]
    notes: "No public list or realized pricing was retained for Mirador or the cited incumbents. Null means unavailable in the assigned evidence, not zero."
    claimRefs: [CP005, CP006, CP008, CP009, CP012, CP013]
