schemaVersion: "report-v2"
artifact: valuation
slug: mirador-therapeutics
runDate: 2026-10-22
company:
  name: Mirador Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: Mirador has assembled substantial private financing and a broad clinical portfolio, but the assigned public record does not disclose a post-money valuation, cap-table terms, revenue, or clinical efficacy sufficient to underwrite an entry price. The appropriate stance is research-more with high risk and medium confidence until price, proof-of-concept, and financing terms are verified.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that Mirador has funded a multi-asset clinical
      strategy unusually early: the company says it closed a $250 million
      Series B in the third quarter of 2025, has raised more than $650 million
      since launch, and expects more than 10 clinical readouts by year-end
      2027. Its Mirador360 engine is described as combining more than 2.5
      million patient profiles with machine learning for target discovery,
      patient stratification, and combination prioritization. The anti-thesis
      is equally material: those are primarily company-described inputs and
      plans, while the public record supplies no asset-level efficacy,
      probability-of-success, revenue, cash-balance, or post-money valuation.
      Financing scale therefore demonstrates access to capital, not investor
      return potential.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV002]
  - id: price-and-financing-discipline
    title: Financing context and entry discipline
    body: >-
      The latest disclosed financing context is a $250 million Series B that
      closed in Q3 2025 and brought total capital raised since the March 2024
      launch to more than $650 million. The materials identify institutional
      investors and state that proceeds are intended to deliver
      proof-of-concept across current programs and advance additional
      candidates. They do not disclose the round post-money valuation, share
      price, ownership, liquidation preferences, option pool, debt, cash
      balance, burn rate, runway, or milestone-linked tranches. The 2026 Kira
      license adds a disclosed $12 million payment obligation at signing plus
      development and sales milestones, which is relevant to capital
      intensity but cannot be treated as a valuation mark. Without those
      terms, a precise entry multiple or target return would be false
      precision.
    claimRefs: [CV001, CV002, CV006, CV009, CV012]
    tableRefs: [TV001]
  - id: scenarios-and-comparables
    title: Scenario framing and comparable set
    body: >-
      A scenario framework is possible only as a diligence scaffold, not as a
      forecast. The bull case requires clinical proof-of-concept across one or
      more programs, continued financing access, and evidence that the
      Mirador360 approach improves development decisions enough to support
      differentiated assets. The base case assumes continued clinical
      execution but slower or mixed readouts, leaving the company dependent on
      private capital and partnership economics. The bear case is triggered by
      weak efficacy, safety or enrollment outcomes, delayed readouts, or
      financing on materially worse terms. The only transaction reference in
      the assigned evidence is the predecessor team's Prometheus history:
      Mirador's launch release puts Merck's 2023 acquisition at $10.8 billion,
      while GEN described it as nearly $11 billion. That strategic transaction
      is evidence of team pedigree, not a like-for-like mark for Mirador's
      current pipeline, so no comparable-derived range is asserted.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation, exit readiness, and thesis breaks
    body: >-
      The evidence supports research-more rather than buy or avoid. Mirador
      has credible financing sponsors, a stated capital-efficiency focus, and
      multiple planned clinical catalysts, but public information is not
      sufficient to determine whether the implied price embeds realistic
      clinical probabilities or whether future dilution and preference
      overhang could absorb upside. Exit readiness is therefore conditional on
      asset-level proof-of-concept, a current cap table and financing mark,
      cash and runway, and a clear path to a strategic partnership or
      registration-enabling data. The thesis breaks if readouts materially
      miss the stated timetable, if safety or efficacy undermines the
      portfolio, or if new financing reveals a valuation reset that is not
      compensated by stronger evidence.
    claimRefs: [CV012, CV015, CV016, CV017, CV018]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Financing and pipeline progress are disclosed; price and efficacy are not", "Do not underwrite a buy without private data-room evidence"]
      - [Confidence, medium, "Multiple company, trade, and healthcare sources corroborate financing context", "Confidence should rise only with primary financing and clinical data"]
      - [Risk rating, high, "Clinical, financing, dilution, and commercialization uncertainties remain", "Size only after milestone and downside diligence"]
      - [Valuation stance, unknown, "No public post-money valuation or comparable private mark", "Require price, terms, and cap-table disclosure"]
    notes: "Sources are public disclosures and reporting; unknown valuation fields are not treated as zero and no return is calculated without a price."
    claimRefs: [CV001, CV002, CV006, CV009, CV012, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view, Investment implication]
    rows:
      - ["Capital access and execution capacity", "More than $650M raised and a $250M Series B disclosed", "A current cash bridge and milestone delivery", "Positive capacity signal, not proof of value"]
      - ["Platform and portfolio breadth", "Mirador360 and programs across four named indications", "Replicated asset-level proof-of-concept", "Breadth may diversify risk but can increase burn"]
      - ["Predecessor-team transaction history", "Merck acquired Prometheus in 2023; the assigned sources describe a roughly $11B transaction", "Evidence that Mirador can reproduce asset-level clinical value", "Team pedigree is not a current-company valuation mark"]
      - ["Valuation opacity", "No public post-money valuation, cap table, or clinical efficacy data", "Verified financing terms and clinical readouts", "Primary reason to defer a buy call"]
    notes: "The table separates company claims from the missing evidence needed to convert them into an investable valuation thesis."
    claimRefs: [CV001, CV003, CV011, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Multiple programs produce credible proof-of-concept and financing remains available", "Upside would depend on a disclosed financing mark or strategic transaction; no range asserted", "Clinical failure, safety, and competition", "Plausible but unverified"]
      - [Base, "Mixed or delayed readouts with continued private funding", "Value remains milestone-driven and highly dilution-sensitive; no range asserted", "Burn, down-round risk, and preference terms", "Most consistent with current public evidence"]
      - [Bear, "Readouts disappoint or financing access weakens", "A valuation reset or unfavorable terms could dominate residual option value", "Safety, efficacy, liquidity, and execution", "Material downside cannot be quantified publicly"]
      - [Diligence trigger, "Cap table, cash runway, clinical data, and round price become available", "Replace qualitative cases with a model matched to risk-adjusted pipeline value", "Incomplete data today", "Required before investment approval"]
    notes: "Scenarios are conditional decision rules, not probability-weighted forecasts; the public record lacks the inputs needed for numeric valuation ranges."
    claimRefs: [CV012, CV013, CV014, CV017, CV018]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Capital access and pipeline breadth support continued diligence, while valuation opacity and unproven clinical outcomes constrain the recommendation.
    data:
      nodes:
        - {id: scale, label: "Capital and pipeline scale"}
        - {id: proof, label: "Clinical proof-of-concept"}
        - {id: price, label: "Price and financing terms"}
        - {id: risks, label: "Downside and dilution risks"}
        - {id: decision, label: "Research-more"}
        - {id: trigger, label: "Diligence triggers"}
      edges:
        - {source: scale, target: proof}
        - {source: proof, target: price}
        - {source: price, target: risks}
        - {source: risks, target: decision}
        - {source: trigger, target: decision}
    claimRefs: [CV001, CV006, CV012, CV016, CV017]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: Defer a buy decision until Mirador supplies a current financing mark, cap-table and preference terms, cash/runway, and asset-level clinical evidence. The public evidence supports continued diligence, not a defensible price target.
    claimRefs: [CV016, CV017]
  - calloutType: risk
    title: Thesis-break trigger
    body: A material miss against planned clinical readouts, safety or efficacy failure, or a financing round at materially worse terms would break the current option-value thesis and require a lower valuation stance.
    claimRefs: [CV013, CV018]
