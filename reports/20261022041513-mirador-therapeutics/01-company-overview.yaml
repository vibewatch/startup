  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Mirador is a San Diego clinical-stage precision-medicine company launched in 2024 around the Mirador360 platform and a large private financing base. The refreshed record adds a 2025 Series B and a 2026 KP-301 license, while valuation, commercialization, and complete governance disclosure remain open."
  },
  "sections": [
    {
      "id": "identity-and-business",
      "title": "Identity and business model",
      "body": "Mirador Therapeutics announced its launch on March 21, 2024, as a San Diego-based clinical-stage company focused on immune-mediated inflammatory and fibrotic diseases. Its public materials describe Mirador360 as an end-to-end precision discovery and development engine that combines human genetics, multimodal data, AI, and advanced analytics to identify targets, prioritize combinations, and stratify patients. This supports a platform-plus-pipeline business model rather than a commercial software model. The assigned evidence establishes the disease focus and development intent, but not a marketed product, recurring revenue stream, or customer base.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO013"
      ],
      "tableRefs": [
        "TO001"
      ]
    },
    {
      "id": "leadership-and-governance",
      "title": "Leadership and governance",
      "body": "Mark C. McKenna is identified as founder, chairman, and CEO, with prior leadership at Prometheus Biosciences. GEN also named six Prometheus veterans joining the company and described William J. Sandborn's clinical and entrepreneurial background. This team provenance is a meaningful execution asset for a clinical-stage biotech, especially in immunology and inflammatory disease. It also creates key-person and disclosure risk: the assigned sources do not provide a complete current leadership roster, board composition, voting rights, or explicit division of responsibilities. The leadership table is therefore a partial enumeration, not a complete governance census.",
      "claimRefs": [
        "CO003",
        "CO004",
        "CO005"
      ],
      "tableRefs": [
        "TO002"
      ]
    },
    {
      "id": "capital-and-stakeholders",
      "title": "Capital and stakeholders",
      "body": "The financing record is unusually substantial for a company launched in 2024. Mirador announced more than $400 million at launch, and Los Angeles Times reported a $250 million Series B closed in the third quarter of 2025; the company later stated that total capital raised exceeded $650 million. The Kira agreement adds a portfolio and licensing milestone, with $12 million payable on signing and additional development and sales milestones. These amounts are financing or contractual commitments, not evidence of current cash available. The public record still lacks post-money valuation, cap-table economics, preferences, and a cash bridge.",
      "claimRefs": [
        "CO006",
        "CO007",
        "CO008",
        "CO009",
        "CO014"
      ],
      "tableRefs": [
        "TO003"
      ]
    },
    {
      "id": "milestones-and-open-gaps",
      "title": "Milestones and decision-relevant gaps",
      "body": "The timeline separates completed events from forward-looking company targets. Mirador's July 2026 announcement added KP-301 for inflammatory vascular disease and targeted Phase 1 initiation by year-end 2026 plus a Phase 2 AAV study in the first half of 2027. Synapse's October 22, 2026 snapshot showed three Phase 1 programs and one Phase 2 current project, but some detail was restricted. The company also expected more than ten clinical readouts by the end of 2027. Those targets are useful monitoring milestones, not achieved outcomes. Commercial revenue, active customers, complete asset-level schedules, and valuation remain unresolved.",
      "claimRefs": [
        "CO009",
        "CO011",
        "CO012",
        "CO015",
        "CO016"
      ],
      "figureRefs": [
        "FO001"
      ]
    }
  ],
