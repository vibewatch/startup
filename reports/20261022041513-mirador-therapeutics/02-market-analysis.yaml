      - [Mirador Therapeutics, 2026, Global pipeline, "More than 2.5M molecular profiles in Mirador360", "Multiple readouts anticipated by year-end 2027", Company platform description, Medium, Platform scale is not revenue or market size]
    notes: >-
      Values are kept in their source units and periods. The table intentionally mixes macro,
      payer, competitor, and platform lenses as separate denominators; it does not sum them.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM014]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [IBD, Biotech or pharma development team, Trial investigator and patient, Sponsor during development; commercial payer at launch, Biomarker and endpoint validation, Clinical-development and commercial teams, Reproducible efficacy and safety versus biologics]
      - [Ulcerative colitis, Gastroenterologist, Patient, Commercial plan or Medicare plan, Prescribing and prior authorization, Health plan pharmacy budget, Steroid-free remission or mucosal outcomes with acceptable access]
      - [Crohn's disease, Gastroenterologist, Patient, Commercial plan or Medicare plan, Prescribing and step therapy, Health plan pharmacy budget, Durable response and differentiated benefit]
      - [AAV, Rheumatologist or nephrologist, Patient, Commercial plan or Medicare plan, Specialty referral and infusion or injection pathway, Health plan pharmacy budget, Long-acting dosing and validated complement benefit]
      - [Pulmonary fibrosis, Interstitial-lung-disease specialist, Patient, Commercial plan or Medicare plan, Specialty-center diagnosis and monitoring, Health plan pharmacy budget, Meaningful functional or progression outcome]
      - [Precision stratification, Sponsor and diagnostic partner, Investigator and selected patient, Payer if covered, Testing and treatment selection, Development or medical budget, Prospective biomarker utility and workflow fit]
    notes: >-
      Buyer roles are an evidence-constrained adoption model, not disclosed Mirador customer
      contracts or pricing. Payer pathway varies by indication and approval status.
    claimRefs: [CM010, CM011, CM012, CM013, CM016]
