evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Post-money valuation, cap table, liquidation preferences, debt, and current cash bridge.
    whyItMatters: Capital raised does not establish ownership economics, liquidity, or financing runway.
    diligencePath: Request the latest investor materials, capitalization table, financing documents, and cash forecast.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current leadership, board, committee, and voting-rights disclosure.
    whyItMatters: Key-person concentration and governance quality cannot be assessed from a named-person list alone.
    diligencePath: Obtain the current board roster, committee mandates, executive responsibilities, and succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: Public evidence of revenue, active customers, commercial partnerships, or recurring-revenue metrics.
    whyItMatters: The company is clinical-stage, so commercial validation and financing dependence remain uncertain.
    diligencePath: Request management KPI reporting, partnership contracts, and commercialization plans.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A lead-asset forecast with indication, geography, eligible population, net price, duration, market share, and
      probability-of-success assumptions.
    whyItMatters: >-
      Without a disclosed asset denominator, broad specialty-drug spending cannot establish Mirador's SAM, SOM, or
      valuation sensitivity.
    diligencePath: >-
      Obtain management's indication-level commercial model and reconcile it to trial design, epidemiology, payer
      access, and net-price evidence.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption
    missingEvidence: Prospective biomarker validation, comparative clinical outcomes, and payer-access evidence for a lead program.
    whyItMatters: >-
      Platform claims may not translate into treatment selection, reimbursement, or switching from established biologics
      and biosimilars.
    diligencePath: >-
      Review protocol-level biomarker plans, readouts, health-economic endpoints, and payer research as each program
      advances.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: An indication-specific market series with consistent population, geography, currency, and forecast vintage.
    whyItMatters: >-
      Macro spending, Medicare selected-drug costs, and competitor sales forecasts use different denominators and cannot
      be summed.
    diligencePath: Commission a bottom-up market model and reconcile it to independent epidemiology, claims, and payer data.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: patient-prevalence
    missingEvidence: >-
      Usable text and denominators from the assigned idiopathic pulmonary fibrosis prevalence review; the prefetched
      archive returned only an HHS vulnerability disclosure page.
    whyItMatters: >-
      IPF prevalence and incidence are needed to bound a named fibrotic-disease segment without relying on broad
      pharmaceutical-spending proxies.
    diligencePath: >-
      Retrieve the original peer-reviewed article or another eligible epidemiology source in a future research cycle,
      preserving geography and case definition.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: >-
      Public or diligence-grade list and net pricing, payer access, customer adoption, and channel economics for Mirador
      and relevant comparators.
    whyItMatters: Pricing and access determine whether a platform or product advantage converts into adoption and economic value.
    diligencePath: >-
      Request management's pricing, market-access, and partner/channel materials and compare them with comparator
      net-price and formulary data.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: clinical-comparison
    missingEvidence: >-
      Comparative clinical outcomes, safety, durability, and patient-selection evidence for Mirador assets versus
      approved immunology products.
    whyItMatters: Platform differentiation is not durable without asset-level evidence that changes clinical or commercial outcomes.
    diligencePath: >-
      Obtain current protocols, topline readouts, biomarker strategy, and comparator-adjusted development plans for
      Mirador's lead programs.
    relatedQuestionRefs:
      - QP004
      - QP007
    relatedTableRefs:
      - TP002
  - type: access-blocked
    severity: minor
    topic: fibrosis-competition
    missingEvidence: Readable source text behind the PatSnap page on the competing fibrosis program.
    whyItMatters: The assigned page is an update placeholder and cannot support a substantive competitor claim.
    diligencePath: >-
      Retrieve the underlying trial registry, sponsor release, or peer-reviewed source before using that program in a
      scored comparison.
    relatedQuestionRefs:
      - QP001
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, restricted cash, monthly burn, runway, debt, credit facilities, and committed clinical spending.
    whyItMatters: Historical funding raised cannot establish whether Mirador can finance its announced studies and broader pipeline.
    diligencePath: >-
      Obtain the latest balance sheet, bank reconciliation, monthly cash forecast, debt schedule, and asset-level
      development budgets.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: licensing-obligations
    missingEvidence: >-
      KP-301 development and sales milestone amounts, payment triggers, royalties, termination rights, and accounting
      treatment.
    whyItMatters: The public $12 million signing payment captures only one component of the license's potential cash burden.
    diligencePath: Review the executed Kira license and map every fixed and contingent payment to the clinical plan.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-and-margin
    missingEvidence: >-
      Revenue recognition, product pricing, payer mix, gross-to-net assumptions, manufacturing cost, and gross-margin
      targets.
    whyItMatters: Without these inputs, neither future revenue quality nor contribution margin can be underwritten.
    diligencePath: Request an indication-level commercial model with pricing, access, volume, COGS, royalties, and launch timing.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: partner-risk
    missingEvidence: >-
      Current status of Mirador's 23andMe data access, assignment rights, data retention, transfer restrictions, and
      replacement costs.
    whyItMatters: >-
      23andMe's restructuring may affect a disclosed research input, but public evidence does not establish impact on
      Mirador.
    diligencePath: >-
      Review the collaboration agreement and obtain written confirmation of continuity after the Chapter 11 sale
      process.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: validation
    missingEvidence: >-
      Prospective benchmark results, independent replication, and platform-to-clinical translation evidence for
      Mirador360.
    whyItMatters: >-
      Without performance evidence, the platform may be a coherent narrative without a measurable advantage in target
      selection or clinical success.
    diligencePath: >-
      Request validation cohorts, locked model specifications, independent replication, and program-level evidence
      linking platform outputs to trial decisions.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: clinical-evidence
    missingEvidence: >-
      Trial registrations, protocols, enrollment, safety, pharmacokinetics, and efficacy data for KP-301 and other
      programs.
    whyItMatters: >-
      Development timing and mechanism claims are not substitutes for observed clinical maturity or risk-adjusted
      evidence.
    diligencePath: Obtain registry identifiers, protocols, clinical-study reports, and a current asset-by-asset development package.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: privacy
    missingEvidence: Consent, de-identification, data-access, cybersecurity, model-governance, and quality-system documentation.
    whyItMatters: >-
      Genomic-data misuse, bias, or weak controls could impair participant trust, regulatory acceptance, and the
      platform's ability to support trials.
    diligencePath: >-
      Review data maps, consent language, access logs, security attestations, model-risk controls, and vendor/partner
      responsibilities.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: developer-surface
    missingEvidence: No public developer surface or practitioner-community metric was retained for this clinical-stage biotech.
    whyItMatters: >-
      The absence limits external assessment of software reliability, release discipline, and technical adoption; it is
      not evidence of a defect.
    diligencePath: >-
      Request engineering-quality documentation, reproducibility records, data-pipeline controls, and external
      scientific validation instead of software-community metrics.
    relatedQuestionRefs:
      - QE002
      - QE007
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named customer or payer contracts, production deployments, purchase amounts, use duration, and attributable
      outcomes.
    whyItMatters: Without commercial proof, trial activity and counterparties cannot establish product-market adoption.
    diligencePath: Request a redacted contract and account roster tied to invoices, deployment status, and reference-call permission.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-evidence
    missingEvidence: >-
      Account cohorts, renewal and churn history, contract duration, customer-level revenue, channel contribution, and
      procurement cycle data.
    whyItMatters: >-
      These records are necessary to assess durability, expansion, concentration, and dependence on a small number of
      relationships.
    diligencePath: >-
      Obtain anonymized account-level monthly cohorts, top-customer schedules, contract terms, pipeline stages, and
      lost-deal analyses.
    relatedQuestionRefs:
      - QU004
      - QU005
  - type: missing-source
