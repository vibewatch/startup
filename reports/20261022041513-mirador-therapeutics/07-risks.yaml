callouts:
  - calloutType: risk
    title: Data governance is a thesis-level dependency
    body: "Mirador's platform depends on molecular-profile data, but the assigned public record does not disclose provenance, de-identification validation, or breach-response controls. Treat privacy and data-quality diligence as a gating item before underwriting platform scale."
    claimRefs: [CR006, CR007, CR008, CR009]
  - calloutType: assumption
    title: Financing is not runway
    body: "The reported financing totals describe capital raised at historical points, not cash available, burn, runway, or obligations. A current cash bridge is required before using financing size to reduce financial risk."
    claimRefs: [CR013, CR014]
  - calloutType: recommendation
    title: Milestones should be treated as kill criteria
    body: "Failure to meet the disclosed KP-301 development milestones, or inability to produce independent clinical and data-governance evidence, should reduce conviction rather than be absorbed as an unquantified execution variance."
    claimRefs: [CR003, CR015, CR016]

