      coverage: partial
      basis: "Public regulatory guidance and disclosed Mirador transactions through 2026-10-22; private contracts and agency correspondence are not enumerated."
    claimRefs: [CR006, CR007, CR008, CR009, CR011, CR012]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Data provenance or re-identification failure", "Medium", "High", "Unverified", "High", "No public dataset lineage, de-identification validation, or audit evidence."]
      - ["Platform model or target-selection failure", "Medium", "High", "Unverified", "High", "No independent validation or clinical performance data for Mirador360."]
      - ["Trial delay or adverse safety signal", "Medium", "High", "Partial", "High", "Planned milestones are disclosed, but protocols, enrollment, and safety denominators are not."]
      - ["Manufacturing or supply execution for licensed asset", "Medium", "High", "Unverified", "Medium-high", "No public CMC, supplier, capacity, or release-testing disclosure."]
    notes: "The risk ratings synthesize the assigned public evidence and are not observed incident rates; 'unverified' means the pool did not contain the relevant control or performance artifact."
    claimRefs: [CR002, CR003, CR006, CR008, CR009, CR015, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["KP-301 license", "Kira Pharmaceuticals", "Exclusive worldwide development, manufacturing, and commercialization rights", "Single licensed asset / counterparty", "Termination, IP dispute, milestone dispute, or transfer delay", "High", "Contract diligence, milestone governance, and backup development plan", "Medium-high"]
      - ["Clinical development", "CROs, sites, regulators; names undisclosed", "Trial execution and approvals", "Potentially concentrated by program", "Enrollment, quality, or regulatory delay", "High", "Independent trial oversight and stage gates", "High"]
      - ["Molecular-profile data", "Data providers and custodians; names undisclosed", "Discovery, validation, and patient stratification inputs", "Potentially concentrated; terms undisclosed", "Loss of access, provenance challenge, or privacy event", "High", "Contract audit, lineage controls, and de-identification testing", "High"]
      - ["Capital providers", "ARCH, OrbiMed, Fairmount and other investors", "Fund development and operating runway", "Private financing dependence", "Runway shortfall or unfavorable financing", "Medium-high", "Current cash bridge, burn plan, and financing scenario analysis", "High"]
    notes: "Counterparty names and roles are included only where disclosed; unnamed providers and CROs are explicit diligence gaps, and financing raised is not treated as current cash."
    enumerationScope:
      coverage: partial
      basis: "Disclosed 2024 financing and 2026 Kira license plus inferred operating dependencies; private supplier, CRO, and data contracts are not public."
    claimRefs: [CR004, CR010, CR011, CR012, CR013, CR014]

