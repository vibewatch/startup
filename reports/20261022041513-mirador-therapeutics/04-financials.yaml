schemaVersion: "report-v2"
artifact: financials
slug: mirador-therapeutics
runDate: 2026-10-22
company:
  name: Mirador Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    Mirador has substantial disclosed private financing and a concrete $12 million
    licensing commitment, but the retained public record does not disclose revenue,
    pricing, gross margin, current cash, burn, or runway. Funding raised therefore
    establishes financing capacity at prior closes, not present capital adequacy.
sections:
  - id: monetization-evidence
    title: Revenue model and monetization evidence
    body: >-
      Mirador is still a clinical-stage therapeutics developer, so the public evidence
      supports potential future product economics rather than current recurring revenue.
      The KP-301 agreement gives Mirador worldwide development, manufacturing, and
      commercialization rights, which creates a possible product-sales route if the
      asset reaches approval. Mirador360 is described as an internal precision-development
      engine that informs target selection, combinations, and clinical strategy; the
      retained sources do not show that the platform is sold as a standalone service.
      The 23andMe relationship adds targeted, aggregated, de-identified genetic and
      phenotypic data to the development process, but its announcement contains no
      payment terms and is not evidence of customer revenue. Across the retained
      materials, Mirador discloses neither product revenue nor ARR, list or realized
      pricing, gross margin, commercial customer count, or revenue mix. The appropriate
      underwriting treatment is therefore pre-revenue: future value depends on clinical
      progress, approval, reimbursement, manufacturing economics, and any later
      partnering terms, none of which can yet be converted into a supported revenue
      forecast.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI015]
    tableRefs: [TI001, TI002]
  - id: capital-formation-and-uses
    title: Capital formation, commitments, and milestone load
    body: >-
      Financing disclosures require careful labeling rather than a single synthetic cash
      balance. Mirador announced more than $400 million at its March 2024 launch, a figure
      independently echoed by PharmaPhorum and BioSpace. Multiples reports $730 million
      across three rounds and labels the most recent completed round a $250 million
      Series B in January 2026, while Mirador's July 2026 release says only that it has
      raised more than $650 million. These statements can coexist because “more than
      $650 million” is not an exact total, but Multiples is not an audited financial
      statement and its $730 million should not be treated as cash available. On the use
      side, the KP-301 license requires $12 million upon signing plus unspecified
      development and sales milestones. Mirador also plans a Phase 1 study by year-end
      2026 and a Phase 2 AAV study in the first half of 2027. Those disclosed activities
      create near-term cash demands whose size cannot be modeled without trial budgets,
      manufacturing plans, headcount costs, and the milestone schedule.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy, counterparty risk, and financial verdict
    body: >-
      The central financial gap is a current cash bridge. None of the retained evidence
      discloses Mirador's cash balance, burn rate, runway, or debt and credit facilities,
      so historical funding cannot answer whether the company can fund announced studies
      and a broader pipeline through value-inflecting readouts. The external financing
      backdrop is not closed: xTalks' 2026 list includes clinical-stage biotech IPOs with
      gross proceeds ranging from $172.5 million for SpyGlass to $770.5 million for
      Parabilis. That range is only market context, not evidence that Mirador can access
      public capital or command comparable terms. Counterparty diligence is also
      warranted. After announcing the Mirador research collaboration, 23andMe entered
      Chapter 11 and disclosed a commitment for up to $35 million of debtor-in-possession
      financing. The filing does not prove that Mirador lost data access or incurred a
      financial loss, but it does justify confirming contract continuity, data rights,
      transfer provisions, and replacement costs. The verdict is research-more: obtain
      current financial statements, the cap table, monthly burn, asset-level development
      budgets, license obligations, and financing triggers before underwriting runway,
      revenue quality, margin, or valuation.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Funding raised is not runway
    body: >-
      Reported financing totals do not reveal current cash after operating spend,
      licensing payments, clinical commitments, or restricted balances.
    claimRefs: [CI002, CI004, CI005, CI016]
  - calloutType: recommendation
    title: Build the model from primary private evidence
    body: >-
      Require bank cash, monthly burn, trial budgets, license milestones, manufacturing
      assumptions, and indication-level pricing before assigning a financing horizon.
    claimRefs: [CI005, CI006, CI007, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Potential stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Therapeutic product sales, Sale of approved therapies, Net price per treatment, No product revenue or price disclosed, Unavailable, Indication-level launch timing and gross-to-net assumptions]
      - [Out-licensing or co-development, Partner consideration for asset rights, Agreement and milestones, No Mirador out-license economics disclosed, Unavailable, Executed agreements and probability-weighted receipts]
      - [Mirador360 platform access, External use of development engine or analysis, Program or subscription, No standalone platform revenue disclosed, Unavailable, Confirm whether third parties ever pay platform fees]
      - [Research collaboration, Data-enabled target validation with 23andMe, Collaboration, Relationship disclosed without payment terms, Strategic rather than demonstrated revenue, Contract economics and continuity rights]
    notes: Public-status entries describe the assigned evidence as of 2026-10-22; unavailable metrics are gaps, not zero values or forecasts.
    claimRefs: [CI008, CI009, CI010, CI011, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Economic input, Disclosed value, Evidence status, Underwriting implication, Specific diligence request]
    rows:
      - [Product list price, null, Not publicly disclosed, Revenue cannot be estimated before indication and label assumptions, Proposed wholesale acquisition cost by indication]
      - [Realized net price, null, Not publicly disclosed, Rebates and access terms could materially reduce gross revenue, Payer mix and gross-to-net waterfall]
      - [Manufacturing cost and gross margin, null, Not publicly disclosed, Product contribution margin cannot be estimated, COGS by modality and commercial scale]
      - [23andMe collaboration economics, null, Announcement describes data use but no payment terms, Collaboration is not evidence of revenue, Fees milestones term and termination provisions]
    notes: Null means the retained successful sources do not disclose the value; it does not mean free, zero, or immaterial.
    claimRefs: [CI010, CI011, CI015]
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns: [Metric, Public value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - [Launch financing, "More than $400M announced in March 2024", high, Establishes prior financing capacity but not remaining cash, Reconcile gross proceeds to net cash received]
      - [Total capital raised, "$730M across 3 rounds reported by Multiples; company later said more than $650M", medium, Totals are not audited cash balances, Cap table and round-by-round cash receipts]
      - [KP-301 signing payment, "$12M payable to Kira upon signing", medium, Known immediate license cash use, Payment timing and accounting treatment]
      - [KP-301 contingent payments, Development and sales milestones disclosed without amounts, medium, Unquantified obligations can affect future financing needs, Full milestone and royalty schedule]
      - [Current cash and restricted cash, null, low, Starting point for a runway calculation is unavailable, Latest balance sheet and bank reconciliation]
      - [Monthly burn and runway, null, low, Clinical plans cannot be matched to financing capacity, Monthly cash forecast by asset and function]
      - [Debt and credit facilities, null, low, Senior claims and covenants could constrain financing flexibility, Debt schedule covenants and security interests]
    notes: Funding, obligations, and missing operating metrics use different denominators; no financing total is presented as current cash or runway.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI016]
figures:
  - id: FI001
    title: Disclosed capital-to-value conversion path
    type: flow
    summary: >-
      Prior financing funds platform, licensing, and clinical work, but public evidence
      stops before approval, pricing, revenue, or a supported runway.
    data:
      nodes:
        - id: capital
          label: Private financing
          detail: "More than $400M at launch; later totals differ by source and are not current cash."
        - id: platform
          label: Mirador360 and data inputs
          detail: "Company-reported platform capabilities and more than 2.5M molecular profiles."
        - id: licensing
          label: Asset licensing
          detail: "$12M KP-301 signing payment plus unquantified development and sales milestones."
        - id: trials
          label: Clinical execution
          detail: "KP-301 Phase 1 planned by year-end 2026 and Phase 2 AAV study in the first half of 2027."
        - id: readouts
          label: Value-inflecting evidence
          detail: "Clinical results must establish safety and efficacy before commercial economics can be supported."
        - id: monetization
          label: Potential monetization
          detail: "Approval, price, uptake, manufacturing cost, revenue, and margin remain undisclosed or prospective."
      edges:
        - from: capital
          to: platform
          label: funds research infrastructure
        - from: platform
          to: licensing
          label: informs portfolio choices
        - from: licensing
          to: trials
          label: creates development obligations
        - from: trials
          to: readouts
          label: generates clinical evidence
        - from: readouts
          to: monetization
          label: may enable later approval and sales
    approximationNotes: This is an evidence-bound sequence, not a forecast, valuation bridge, or claim that conversion will occur.
    claimRefs: [CI001, CI005, CI007, CI008, CI009, CI015]
