        - label: Accountability and telemetry
          values: [Medium, High, High, "Attributed-action and log-completeness rate"]
        - label: Regulatory classification
          values: [Medium, High, High, "Mapped systems; open authority questions"]
        - label: Capital and adoption
          values: [Medium, High, High, "Runway, ARR, renewals, deployment conversion"]
    claimRefs: [CR005, CR006, CR009, CR013]
callouts:
  - calloutType: risk
    title: Public evidence supports a high-risk posture, not a recorded Neo breach
    body: "The assigned sources document material agentic-security and regulatory hazards, but they do not establish that Neo has suffered a breach, enforcement action, or control failure. The correct diligence stance is to test the company's safeguards rather than infer either safety or failure from silence."
    claimRefs: [CR005, CR006, CR013]
  - calloutType: recommendation
    title: Make control efficacy a financing and procurement gate
    body: "Before underwriting scale, require independent evidence for inventory coverage, least-privilege enforcement, action attribution, adversarial robustness, rollback, logging, and incident response, alongside current financial and customer-retention metrics."
    claimRefs: [CR009, CR013, CR014]
