schemaVersion: "report-v2"
artifact: risks
slug: neo-security
runDate: 2026-10-25
company:
  name: Neo Security
chapter:
  number: 7
  title: Risks
  summary: Neo is entering a security category whose core exposure is the same autonomy, privilege, and opaque action chains that its platform is intended to govern. Public evidence supports a high regulatory and execution burden, while the available record does not establish Neo's own certifications, incident history, production controls, or customer concentration.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: Neo's product sits at the intersection of AI governance, cybersecurity, identity, and enterprise software procurement. The EU AI Act uses risk-based categories and assigns obligations across providers, deployers, importers, and distributors; its enforcement is hybrid, with national authorities handling many system-level duties and the European Commission supervising GPAI rules. That creates a classification and allocation risk for a control layer operating across agents, applications, plugins, and model-connected workflows. Public guidance also emphasizes that applicable duties vary by intended purpose, system role, deployment context, and the specific regulatory pathway. Neo's launch materials describe inventory, attribution, policy control, and native enforcement, but do not disclose its own conformity assessments, certifications, legal opinions, or customer-specific compliance boundaries. A separate 2020 article uses the phrase "Neo-Security Architecture" for Curity's unrelated identity, API, and entitlement design, so researchers must also guard against search-result attribution errors. The investment implication is not that non-compliance exists; it is that enterprise sales may require auditable classification, logging, oversight, incident reporting, contractual allocation, and evidence that are not publicly demonstrated.
    claimRefs: [CR001, CR002, CR003, CR004, CR015]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, technical, and security risk
    body: The strongest external risk evidence concerns the environment Neo is selling into rather than a recorded Neo incident. Joint Five Eyes guidance identifies privilege, design and configuration, behavioral, structural, and accountability risks in agentic systems, including prompt injection, excessive access, cascading failures, and difficulty reconstructing why an action occurred. It recommends least privilege, defense in depth, secure identities, staged deployment, human checkpoints, and monitoring of internal action chains rather than only inputs and outputs. Cloud Security Alliance analysis similarly describes prompt injection as persistent and difficult to fix and notes that conventional SIEM tooling may not capture probabilistic multi-step behavior at the required granularity. Neo claims real-time attribution and native policy enforcement, which could be strategically relevant, but the public record does not establish detection efficacy, false-positive rates, rollback performance, coverage of unmanaged endpoints, or resilience under adversarial testing. These gaps leave product liability, trust, and execution exposure until independently testable controls are available.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-financial
    title: Partner, dependency, and financial-model risk
    body: Neo emerged from stealth with $100 million from Andreessen Horowitz and Bessemer Venture Partners, with participation from Craft Ventures and Merlin Ventures, and said it would use the capital to scale go-to-market and engineering. The announcement provides funding context but no valuation, revenue, ARR, burn, runway, gross margin, customer count, or renewal data. That makes capital sufficiency and commercial efficiency impossible to underwrite from the assigned public evidence. The product also depends on a changing ecosystem of AI agents, browsers, SaaS platforms, identities, plugins, MCP servers, endpoints, model providers, and enterprise security workflows. External guidance stresses that interconnected tools and multi-agent pipelines expand attack surfaces and can propagate a compromised component downstream. Neo's control-plane thesis therefore carries integration, platform-change, supplier/model, and adoption-timing risk; the company must prove that inventory and enforcement remain complete as counterparties change capabilities, permissions, APIs, and logging behavior.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break triggers
    body: "The public mitigation signal is directionally coherent but not yet company-specific proof. Government guidance recommends starting with low-risk tasks, limiting agent access, using temporary credentials, adding human approval for high-impact actions, and integrating agent governance into existing zero-trust, defense-in-depth, and incident-response structures. EU compliance guidance likewise points to continuous risk management, current technical documentation, logging, post-market monitoring, incident procedures, and clear provider-deployer responsibility. For Neo, diligence should convert these principles into measurable operating tests: inventory coverage across managed and unmanaged endpoints; percentage of actions attributed to a human, agent, application, and identity; policy decision latency; blocked high-risk action recall and false-positive rates; log completeness and retention; rollback time; unresolved critical vulnerabilities; and customer renewal or expansion. A thesis break would be a material uncontained incident, inability to reconstruct consequential actions, repeated control bypasses, a regulatory classification that materially expands obligations without a delivery plan, or evidence that deployment requires broader privileges than customers will accept."
    claimRefs: [CR013, CR014]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Evidence and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [AI-system classification and role allocation, "EU AI Act obligations vary by risk category, intended purpose, provider/deployer role, and enforcement authority; Neo's public materials do not map its control layer to a classification.", High, High, "Not publicly demonstrated", High, "Obtain a jurisdiction-by-jurisdiction classification memo and customer contract responsibility matrix."]
      - [Evidence and logging obligations, "High-risk guidance emphasizes risk management, technical documentation, automatic logging, human oversight, cybersecurity, post-market monitoring, and incident reporting.", Medium, High, "Principles are public; Neo-specific evidence is absent", High, "Review technical documentation, log schema, retention controls, oversight workflow, and incident runbook."]
      - [Regulatory fragmentation and timing, "The AI Act uses hybrid enforcement and current implementation dates and authorities differ by pathway and Member State.", Medium, Medium, "External framework only", Medium, "Confirm target-country obligations, competent authorities, and launch gating for each customer segment."]
      - [Evidence attribution and name collision, "A 2020 Curity article uses 'Neo-Security Architecture' for an unrelated identity, API, and entitlement design.", Medium, Low, "Manual source verification", Low, "Require issuer and company-identity checks before accepting search evidence about Neo Security."]
    notes: "Rows synthesize assigned regulatory and legal sources; Neo-specific certification, licensing, litigation, and enforcement status are not publicly established."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented AI-governance and security obligations relevant to Neo's agentic control-layer exposure as of 2026-10-25."
    claimRefs: [CR001, CR002, CR003, CR004, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Prompt injection or adversarial manipulation redirects an agent, High, High, "Layered controls recommended; Neo efficacy not published", High, "Independent red-team results and action-blocking recall."]
      - [Excessive privilege or weak agent identity causes unauthorized action, Medium, High, "Least privilege and verifiable identity are recommended", High, "Service-account design, temporary credentials, and privilege-breach tests."]
      - [Multi-agent or tool-chain cascade corrupts downstream workflows, Medium, High, "Segmentation, checkpoints, and system-level monitoring recommended", High, "Failure isolation, rollback, and blast-radius test evidence."]
      - [Insufficient telemetry prevents reconstruction of consequential action, Medium, High, "Detailed action-chain monitoring recommended", High, "Log completeness, retention, SOC integration, and forensic replay tests."]
    notes: "Risk categories and mitigations are grounded in joint-government and Cloud Security Alliance guidance; likelihood and residual exposure are diligence judgments pending Neo-specific test evidence."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Model and AI-software ecosystem, "Third-party model, SaaS, browser, plugin, MCP, and agent providers", "Capabilities, permissions, APIs, or logging change faster than Neo's inventory and policy coverage.", High, "Continuously updated knowledge base, inventory, attribution, and native enforcement are company-claimed.", High]
      - [Enterprise endpoint and identity surface, "Customer-managed and unmanaged endpoints plus identities", "Incomplete endpoint visibility or inherited permissions leaves shadow agents outside effective control.", High, "Real-time inventory and identity-specific controls are company-claimed.", High]
      - [Capital and commercial execution, "Venture financing and enterprise go-to-market", "Scaling spend ahead of measurable revenue, renewal, or deployment proof creates runway and efficiency risk.", High, "The company announced $100M of funding and planned GTM and engineering expansion.", High]
    notes: "Counterparties are dependency categories rather than named contracts; public sources do not disclose concentration, exclusivity, unit economics, or runway."
    claimRefs: [CR009, CR010, CR011, CR012]
