  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture
      missingEvidence: Detailed endpoint sensor architecture, supported operating systems, privileges, telemetry paths, privacy controls, and fail-open or fail-closed behavior.
      whyItMatters: These facts determine deployment friction, data exposure, reliability, and whether endpoint enforcement is safe for production use.
      diligencePath: Request current architecture and data-flow documentation, then validate it in a sandbox and controlled enterprise pilot.
      relatedQuestionRefs: [QE003, QE004, QE006]
      relatedTableRefs: [TE002]
    - type: missing-source
      severity: material
      topic: integrations
      missingEvidence: Production integration list, API and identity integration details, support model, and independent performance benchmarks.
      whyItMatters: A control layer is only useful if it covers the buyer's endpoint and SaaS estate without unacceptable latency or operational overhead.
      diligencePath: Obtain an integration matrix and run seeded discovery, attribution, policy, and rollback tests across representative endpoints and tools.
      relatedQuestionRefs: [QE004, QE007, QE009]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: Named production customers, deployment scope, measurable outcomes, and referenceable security-team users.
      whyItMatters: Public product descriptions and investor support do not establish production maturity, retention, or repeatable implementation.
      diligencePath: Request customer references under NDA and verify production versus pilot status, use cases, incidents, and renewal evidence.
      relatedQuestionRefs: [QE004, QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
