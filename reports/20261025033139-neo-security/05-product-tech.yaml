company:
  name: Neo Security
chapter:
  number: 5
  title: Product & Technology
  summary: Neo Security presents an endpoint-resident control layer for agentic software that inventories, attributes, assesses, and enforces policy across agents, plugins, extensions, MCP servers, and agent-enabled applications. The product thesis is technically coherent, but public evidence remains thin on detailed architecture, integrations, performance, pricing, and production customer references.
sections:
  - id: product-and-workflow
    title: Product definition and customer workflow
    body: >-
      Neo positions its product as a real-time control layer for agentic software rather than a
      conventional API gateway or a report-only discovery tool. Its stated workflow is to reveal
      what agentic software exists on endpoints, understand what each component can access and how
      it is configured, attribute activity to a human, agent, or application, and enforce controls
      over tool calls, API access, and data movement. The official company description says Neo
      “inventories, attributes, and enforces across every software class your workforce runs in
      real time on every endpoint, managed or not.” Bessemer describes a related operating loop:
      observe traffic, propose policy from observed behavior, and let security teams extend policy
      in plain language. This is a plausible time-to-value mechanism, but it remains a company and
      investor description rather than independently measured proof of detection quality or policy
      precision.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: modules-and-architecture
    title: Modules and technical architecture
    body: >-
      The public product map has five functional layers. Neoverse is described as the inventory
      layer for AI agents, plugins, extensions, MCP servers, and agentic-enabled applications.
      Capability and risk intelligence maps access and configuration; real-time attribution creates
      an audit trail; granular software control applies identity- or group-level policy; and native
      enforcement blocks risky activity without handing enforcement to another product. The
      differentiator is the endpoint vantage point: Bessemer says Neo built an actual endpoint
      sensor because it is the vantage point that can intercept and govern an agent in real time.
      This could cover local coding assistants and desktop applications that do not traverse a
      network proxy, but the public record does not disclose sensor privileges, operating-system
      coverage, telemetry handling, latency, fail-open behavior, or integration APIs. The architecture
      map therefore represents disclosed functional roles, not a verified implementation diagram.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: maturity-integration-and-differentiation
    title: Maturity, integrations, and differentiation
    body: >-
      Neo has a coherent differentiation thesis: discover agentic software that may not self-report,
      then govern it at the endpoint rather than relying only on API visibility. Security Boulevard
      describes the platform as spanning inventory, monitoring, attribution, and control, while
      Palo Alto's competing Prisma AIRS 3.0 shows that large platform vendors are also assembling
      discovery, assessment, and runtime control across cloud, SaaS, and endpoint environments.
      That competitor evidence means Neo's category is strategically important but not uncontested.
      A separate practitioner-oriented MCP governance source highlights identity federation,
      action-level RBAC, audit logging, and exportable policies as enterprise gateway requirements;
      these are relevant diligence questions for Neo, not proof that Neo provides them. The current
      public record does not establish production integrations, named customers, independent
      benchmarks, roadmap dates, or public pricing. Enera explicitly says Neo has not published
      pricing, detailed architecture documentation, or named customer references.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: trust-safety-and-diligence
    title: Trust, safety, and implementation risk
    body: >-
      The use case is security-sensitive because agents can inherit valid permissions, call tools,
      and move through workflows in ways that appear authorized to legacy controls.       NIST describes
      the AI Risk Management Framework as voluntary guidance intended to improve how organizations
      incorporate trustworthiness into AI design, development, use, and evaluation. IBM's survey of
      2,000 technology executives found that 70% said business teams deploy technology faster than
      IT can track; that figure establishes buyer pain, not Neo product performance. Neo's unresolved
      implementation questions are consequently material: endpoint deployment and permissions,
      privacy and data retention, policy correctness, incident response, rollback, coverage across
      operating systems and SaaS tools, and evidence of reliable enforcement under adversarial or
      degraded conditions. The next diligence step is a controlled pilot with measurable discovery
      coverage, attribution accuracy, block/allow precision, latency, and failure-mode behavior.
    claimRefs: [CE015, CE018]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, User and job, Disclosed maturity/status, Differentiation, Diligence gap]
    rows:
      - [Neoverse software inventory, Security teams discover agents and agentic software, Described as a core capability, "Active discovery across agents/plugins/extensions/MCP servers", Coverage and false-negative rate are not published]
      - [Capability and risk intelligence, Security teams assess access and configuration, Described as a core capability, "Maps what tools can access and risks as capabilities change", No public scoring method or benchmark]
      - [Real-time attribution, Security and audit teams identify responsibility for actions, Described as a core capability, "Links activity to a human, agent, or application", Identity propagation and audit retention are undisclosed]
      - [Granular software control, Security teams enforce tool/API/data policies, Described as a core capability, Identity- or group-level policy, "Precision, rollback, and failure behavior are undisclosed"]
      - [Native endpoint enforcement, Security teams block risky activity, Investor-described product design, Endpoint sensor aims at real-time interception, "OS coverage, privileges, and latency are undisclosed"]
    notes: >-
      Rows summarize capability descriptions from Neo, Bessemer, and external reporting; “core
      capability” is a disclosed description, not an independently verified production status.
    claimRefs: [CE001, CE005, CE006, CE007, CE008, CE009]
  - id: TE002
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or limitation]
    rows:
      - [Endpoint sensor, Observe and potentially intercept local agent activity, Endpoint installation and privileges, "Deployment friction and unsupported operating systems are unknown"]
      - [Inventory and knowledge layer, "Catalog agents plugins extensions MCP servers and agent-enabled applications", Continuous endpoint telemetry, "Completeness and update latency are unverified"]
      - [Policy intelligence, Propose and extend policies from observed behavior, Observed traffic plus LLM-assisted policy interaction, "False positives, false negatives, and explainability are unverified"]
      - [Attribution and audit, Tie actions to a human agent or application, Identity context and retained event data, "Retention, privacy, and tamper resistance are undisclosed"]
      - [Enforcement, Block or permit tool calls API access and data movement, Policy engine plus endpoint control path, "Fail-open behavior, latency, and rollback are undisclosed"]
    notes: >-
      This is an analytical architecture assembled from disclosed functional roles; Neo has not
      published detailed architecture documentation, performance data, or integration specifications.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE013]
  - id: TE003
    title: Workflow, proof, and diligence matrix
    columns: [Buyer job, Current public evidence, Measurable benefit claimed or implied, Limitation, Diligence ask]
    rows:
      - [Inventory agentic software, Neo and external reports describe discovery across endpoint software, Visibility into unmanaged or newly agentic software, No coverage denominator or independent test, Measure discovery recall across a seeded estate]
      - [Understand capability and risk, Neo is described as mapping access and configuration, Risk context for changing capabilities, No published scoring or validation, Review risk taxonomy and calibration against expert labels]
      - [Attribute actions, External reporting describes attribution to human agent or application, Better incident ownership and auditability, No public attribution accuracy, Test identity continuity across delegated workflows]
      - [Enforce policy, Bessemer describes observed-traffic policy proposals and endpoint enforcement, Faster policy creation and direct blocking, No block/allow precision or latency, Run staged allow/block tests with rollback]
      - [Operate at enterprise scale, "IBM reports 70% of surveyed executives say deployment outpaces IT tracking", Buyer need for visibility and control is credible, Neo has no public named customer references, "Verify integrations, support model, and production references"]
    notes: >-
      Benefits are separated from proof: customer pain is supported by IBM's 2,000-executive survey,
      while Neo-specific performance and production maturity remain open evidence gaps.
    claimRefs: [CE002, CE003, CE004, CE010, CE011, CE012, CE014, CE018]
