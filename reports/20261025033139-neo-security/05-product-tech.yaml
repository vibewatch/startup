      Layer order is an analytical presentation of disclosed functional roles, not a verified
      implementation sequence or claim that every layer is generally available.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
callouts:
  - calloutType: strength
    title: Coherent endpoint-control thesis
    body: Neo's disclosed design addresses discovery and enforcement at the endpoint, where local coding assistants and desktop applications may evade a network-only view.
    claimRefs: [CE005, CE009]
  - calloutType: risk
    title: Proof gap is concentrated in implementation
    body: Public material does not establish pricing, detailed architecture, named customer references, production integrations, independent benchmarks, or enforcement reliability.
    claimRefs: [CE013, CE014]
  - calloutType: recommendation
    title: Gate adoption on a measured pilot
    body: Require controlled evidence for discovery coverage, attribution accuracy, policy precision, latency, privacy, and rollback before treating the product as production-ready.
    claimRefs: [CE013, CE014]
