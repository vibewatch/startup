companyProfile:
  summary: >-
    Neo Security emerged from stealth in July 2026 with a stated mission to provide an agentic software control layer
    for enterprise environments. Its public product description centers on inventory, capability and risk intelligence,
    real-time attribution, granular policy control, and native enforcement across agents, applications, browsers,
    identities, plugins, MCP servers, and other software acquiring autonomous capabilities. The company has a
    security-native founding team and substantial reported early funding, but public disclosure remains thin on
    commercial traction, deployment proof, and financial performance.
