company:
  name: Neo Security
chapter:
  number: 6
  title: Customers
  summary: Public evidence places Neo's early customer motion in enterprise security, with pilots reported in financial services, transportation, and energy but without named references, production status, outcomes, retention, pricing, or customer-count denominators. The strongest diligence conclusion is therefore category demand and early evaluation, not demonstrated durable adoption.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: Neo is positioned for enterprise security and IT teams that need to inventory, attribute, and govern autonomous software. The public record points most directly to SecOps and security architecture users, while regulated financial institutions are a particularly important use case because agent permissions, data access, auditability, and third-party risk matter together. The likely economic buyer is an enterprise security or risk owner, but no public source confirms budget ownership, contract structure, pricing, or whether procurement is direct or partner-led. Customer segmentation is therefore directional rather than a measured revenue mix. Transportation and energy references broaden the vertical hypothesis, but they do not show whether Neo's product is repeatable across procurement environments or merely being evaluated by a small design-partner set.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption trajectory and proof quality
    body: The available adoption signal is an early-stage pilot footprint rather than a disclosed customer base. Toflow reports pilots across financial services, transportation, and energy, while independent coverage describes testing with organizations in those sectors without naming them. Neo's own surface describes a real-time control layer and invites evaluation, but does not publish active-account totals, utilization, deployment counts, or customer outcomes. The evidence supports enterprise interest and evaluation activity; it does not support an ARR, retention, active-customer, or conversion claim. The July 2026 launch coverage is recent relative to this refresh, yet the absence of a denominator still prevents a reliable trajectory or growth rate.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named references, retention, and expansion
    body: "No assigned source names a Neo customer or establishes that a reported pilot reached production. The customer-proof record consequently has three sector-level entries with unknown customer identity, deployment stage, and outcome. Public materials also provide no NRR, GRR, churn, renewal, contract-length, cohort, satisfaction, or concentration data. Neo's proposed workflow could support land-and-expand from inventory into attribution and policy enforcement, but that is a product hypothesis, not observed expansion. Buyers and investors should require reference calls, production telemetry, renewal evidence, and concentration disclosure before underwriting durability. This is the key distinction between a plausible security workflow and validated commercial durability: the former is described, while the latter remains private evidence."
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015]
    tableRefs: [TU003]
