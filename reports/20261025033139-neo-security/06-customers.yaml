figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence traces a plausible evaluation path from discovery to controlled deployment, but only the pilot stage is externally reported.
    data:
      items:
        - label: "Discover"
          stage: "1"
          title: "Discover"
          touchpoints: ["Security and IT teams identify agents, extensions, MCP servers, and agentic applications"]
          note: "Product capability described by Neo and third-party coverage; customer usage not independently measured"
        - label: "Attribute"
          stage: "2"
          title: "Attribute"
          touchpoints: ["Map actions to a human, agent, application, or identity"]
          note: "Described platform behavior; no public customer telemetry"
        - label: "Assess"
          stage: "3"
          title: "Assess"
          touchpoints: ["Review permissions, capabilities, access, and policy fit"]
          note: "Use case described for enterprise security teams; no published assessment outcomes"
        - label: "Pilot"
          stage: "4"
          title: "Pilot"
          touchpoints: ["Financial-services, transportation, and energy organizations reportedly test the software"]
          note: "Pilot sectors reported; organizations remain unnamed"
        - label: "Deploy"
          stage: "5"
          title: "Deploy"
          touchpoints: ["Apply policy to tool calls, API access, data movement, or workflows"]
          note: "Production deployment is not publicly confirmed"
        - label: "Expand or renew"
          stage: "6"
          title: "Expand or renew"
          touchpoints: ["Extend coverage and demonstrate repeat value across teams or workflows"]
          note: "No public NRR, GRR, renewal, cohort, or expansion evidence"
    claimRefs: [CU005, CU006, CU012, CU013, CU014, CU015]
callouts:
  - calloutType: insight
    title: Early demand signal, weak referenceability
    body: Neo has a credible enterprise problem and reported pilots across three sectors, but the public record does not yet prove named production deployments, outcomes, or durable expansion.
    claimRefs: [CU005, CU006, CU010, CU014]
  - calloutType: risk
    title: Customer-proof gap
    body: Without named references, contract and pricing evidence, denominated customer counts, or retention data, adoption quality and concentration risk cannot be underwritten from public evidence.
    claimRefs: [CU007, CU008, CU010, CU013, CU015]
