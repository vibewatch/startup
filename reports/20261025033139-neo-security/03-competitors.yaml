company:
  name: Neo Security
chapter:
  number: 3
  title: Competitors
  summary: Neo enters a fast-forming agentic-security category with an endpoint-first control thesis, but the public record shows a crowded field, strong platform incumbents, and limited independent proof of product maturity. Its differentiation is credible at the architectural level; durability depends on deployment coverage, customer validation, and whether the category remains standalone rather than being absorbed into larger security suites.
sections:
  - id: landscape
    title: Category landscape and competitive pressure
    body: >-
      Neo is positioned as a neutral control layer for agentic software, spanning
      discovery, attribution, policy and enforcement across endpoints. Its own
      description says it inventories, attributes and enforces across every software
      class on every endpoint, while independent coverage describes the product as
      a real-time layer that inventories, monitors and governs agents, browsers,
      identities and traditional software. That positioning places Neo between
      specialized agent-security vendors and platform vendors extending existing
      endpoint, identity, network and AI-governance products. Security Boulevard
      reports that the category question is not whether the problem exists but
      whether agentic security becomes a standalone market or a feature absorbed
      by larger platforms. Cisco's acquisition of Astrix illustrates the latter
      path: a large incumbent is adding agent and non-human-identity discovery,
      lifecycle management and threat response to a broader security stack. The
      competitive implication is that Neo must win on cross-platform coverage and
      control quality quickly enough to offset incumbent distribution and bundling.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability
    title: Capability, deployment and trust comparison
    body: >-
      The most material buying distinction is enforcement location and scope. Neo
      claims endpoint visibility into local agents, MCP servers, extensions and
      scripts, with attribution and native blocking; its public About page uses the
      shorter formulation of seeing and controlling every human and non-human action
      on every endpoint in real time. By contrast, a competitor-authored platform
      comparison frames agent security around runtime controls, guardrails,
      observability and testing, and lists Palo Alto, Cisco/Robust Intelligence,
      Microsoft, open-source frameworks and other vendors across different layers.
      Cisco describes its own approach as combining identity discovery and
      management, access enforcement and runtime behavioral protection, with
      Astrix adding non-human identity and agent capabilities. Curity's
      vendor-issued architecture reference is not a Neo product source, but it supplies a useful
      technical baseline: identity, API management, entitlement, machine identity
      and security operations are separate concerns connected through standards.
      Against that baseline, Neo's endpoint-first promise could be differentiated,
      but public evidence does not yet establish breadth across Linux, servers,
      cloud-hosted agents, integrations or production scale.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability
    title: Moat durability, pricing and displacement risk
    body: >-
      Neo's possible moat is the combination of endpoint telemetry, a continuously
      enriched software knowledge base, identity attribution and enforcement at the
      action point. StackScout describes Neoverse as a knowledge base for known
      agentic software and calls native enforcement a differentiator, but the same
      review says there are zero public customer references, no third-party
      validation and no published pricing. These are not minor disclosure gaps for
      a security control product: they make efficacy, total cost and switching
      economics hard for a CISO to underwrite. Security Boulevard's historical
      analogy is adverse to category durability, arguing that network access control
      functions were absorbed into endpoint, identity and networking platforms,
      and identity stacks. Neo therefore has a window to become
      a control-plane platform, but it should be evaluated with a short contract
      and a proof-of-value against the buyer's own agent inventory until coverage,
      latency, policy quality and renewal economics are independently demonstrated.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: diligence
    title: Competitive diligence priorities
    body: >-
      The public evidence supports a differentiated thesis, not a proven moat.
      Buyers should test Neo against platform-bundled alternatives such as
      Microsoft and Cisco, specialist runtime and identity offerings, and the
      status quo of existing endpoint, IAM, SIEM and API controls. The comparison
      should measure discovery completeness, attribution fidelity, policy
      enforcement, cloud and Linux coverage, deployment effort, latency, false
      positives, integration burden and the ability to export telemetry and
      policies if the category consolidates.       Pricing remains an explicit unknown, so the assigned evidence does not support
      a realized price, contract value or valuation input. The central investment risk is not that no competitor
      exists; it is that a well-funded incumbent can reproduce enough of the
      control layer, bundle it into an existing contract and win distribution before
      Neo accumulates customer evidence.
    claimRefs: [CP013, CP014, CP015, CP016]
    tableRefs: []
