  - id: TP003
    title: Pricing, packaging and switching comparison
    columns: [Alternative, Price or contract signal, Included scope signal, Switching or lock-in issue, Diligence implication]
    rows:
      - [Neo Security, "No published pricing; Talk to an Expert", "Enterprise endpoint control, per assigned independent review", "New endpoint agent, policies and integrations may create operational dependency", "Require written endpoint price, minimums, SLA, renewal terms and export rights"]
      - [Noma Security, "No price disclosed in assigned source", "Discovery and governance, secure-by-design controls, and runtime protection", "Runtime and governance policy portability unknown", "Compare deployment effort and evidence under the same test set"]
      - [Cisco / Astrix, "Price and packaging not disclosed in assigned source", "Identity, NHI, access and response integrated into Cisco stack", "Cisco ecosystem can increase bundle leverage", "Test incremental cost versus existing Cisco commitments"]
      - [Microsoft and Palo Alto platforms, "No comparable price disclosed in assigned sources", "Bundled governance, telemetry and security controls", "Existing platform contracts can reduce switching friction", "Separate technical superiority from procurement and bundle economics"]
      - [Internal build and existing stack, "Existing spend may already be contracted; incremental cost unknown", "Known controls but agent-specific gaps", "Lowest new-vendor switching cost, highest engineering and integration burden", "Quantify residual risk, engineering hours and control coverage"]
    notes: "Neo pricing is unavailable; any endpoint range in StackScout is an estimate based on comparables and is not used as a factual price. Contract, discount, implementation and renewal terms remain diligence gaps."
    claimRefs: [CP010, CP012, CP014, CP015]
