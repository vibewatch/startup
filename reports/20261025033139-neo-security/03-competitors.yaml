        - {label: Noma Security, x: 3, y: 2, detail: "Broad agent-security scope; company-issued evidence", tone: neutral}
        - {label: Cisco / Astrix, x: 4, y: 5, detail: "Broad identity, network and infrastructure distribution; integration still forward-looking", tone: positive}
        - {label: Microsoft, x: 3, y: 5, detail: "Strong enterprise distribution and bundled security ecosystem", tone: positive}
        - {label: Palo Alto Networks, x: 3, y: 4, detail: "Broad security-platform route with AI runtime coverage", tone: positive}
        - {label: Specialist runtime or testing tools, x: 2, y: 2, detail: "Focused control layers and varied operational maturity", tone: neutral}
      xAxis: {label: "Cross-vendor control-layer breadth", min: 0, max: 5}
      yAxis: {label: "Incumbent distribution and procurement leverage", min: 0, max: 5}
    approximationNotes: "Coordinates are ordinal analyst judgments anchored to the assigned sources' described scope and distribution, not measured market share or benchmark scores."
    claimRefs: [CP002, CP003, CP004, CP007, CP008, CP013]
callouts:
  - calloutType: strength
    title: Architectural wedge
    body: Neo's endpoint-first control thesis can address local agents, MCP servers and extensions that API-only or gateway-centric controls may not see, if its coverage and enforcement claims hold in production.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Feature absorption and proof gap
    body: "The largest risks are incumbent bundling and insufficient independent proof: the category may be absorbed into platform suites before Neo demonstrates customer outcomes, coverage, pricing and durable switching costs."
    claimRefs: [CP009, CP011, CP016]
