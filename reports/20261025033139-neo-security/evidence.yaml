evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: disclosure
    missingEvidence: >-
      A primary financing document or investor disclosure establishing post-money valuation, security terms, ownership,
      and any debt or credit facility.
    whyItMatters: >-
      The reported $100 million raised is not a valuation or cash-available figure, so return potential and
      capitalization cannot be assessed.
    diligencePath: Request the executed financing summary, capitalization table, and debt schedule under NDA.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >-
      Named customer references, production deployment evidence, retention or expansion metrics, and independent
      performance testing.
    whyItMatters: Unidentified tests do not establish repeatable production adoption, technical efficacy, or commercial traction.
    diligencePath: >-
      Obtain two reference calls, anonymized deployment metrics, integration coverage, and a third-party benchmark or
      test report.
    relatedQuestionRefs:
      - QO004
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Board composition, executive roster beyond the founders, voting control, vesting, and key-person protections.
    whyItMatters: >-
      Founder-market fit is visible, but governance quality and concentration risk cannot be evaluated from the public
      materials.
    diligencePath: >-
      Request the current board and officer list, charter, voting agreements, option plan, and key-person insurance or
      succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named production customers, contract values, pricing model, renewal behavior, and deployment conversion by
      segment.
    whyItMatters: >-
      Without commercial evidence, the broad market forecast cannot be translated into Neo-specific SAM, SOM, revenue
      potential, or willingness to pay.
    diligencePath: >-
      Obtain customer references, anonymized pipeline and cohort data, pricing schedules, and production deployment
      metrics under NDA.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A company-specific bottom-up count of target enterprises, agent populations, attach rates, and serviceable
      geographies.
    whyItMatters: >-
      Published category estimates use broader perimeters and cannot establish Neo's reachable market or conversion
      assumptions.
    diligencePath: >-
      Request a bottom-up SAM/SOM model with named segments, geographic scope, buyer budget, pricing, and explicit
      exclusions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customer references, production deployment counts, retention and independently measured efficacy.
    whyItMatters: >-
      Without customer proof, buyers and investors cannot distinguish a credible architecture from a repeatable
      enterprise product or quantify switching costs.
    diligencePath: >-
      Request reference calls, anonymized deployment telemetry, renewal data and a controlled proof-of-value against
      representative agent workflows.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Neo's list price, realized discounting, minimum commitment, implementation cost, SLA and renewal terms.
    whyItMatters: Pricing opacity prevents a comparable total-cost and procurement-power analysis against bundled incumbents.
    diligencePath: >-
      Obtain a written quote and contract redlines, including endpoint definition, minimums, policy and knowledge-base
      updates, support and export rights.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: material
    topic: coverage
    missingEvidence: Independent validation of Linux, cloud-hosted-agent, server, latency, false-positive and integration coverage.
    whyItMatters: >-
      An endpoint-first product can leave material blind spots if agent workloads run outside managed endpoints or if
      enforcement is operationally noisy.
    diligencePath: >-
      Run a multi-environment benchmark covering endpoint, server, container, cloud-agent and MCP workflows with
      measured latency and policy outcomes.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: missing-source
    severity: blocking
    topic: revenue
    missingEvidence: Audited or management-reported revenue, ARR, bookings, revenue mix, and recognition policy by period.
    whyItMatters: >-
      Without realized revenue and recognition detail, scale, growth, and recurring-quality claims cannot be
      underwritten.
    diligencePath: >-
      Obtain monthly income statements, ARR bridge, bookings ledger, contract samples, and revenue-recognition memo for
      the last eight quarters.
  - type: missing-source
    severity: blocking
    topic: unit-economics
    missingEvidence: Customer-level pricing, implementation cost, gross margin, CAC, sales cycle, retention, and payback cohorts.
    whyItMatters: >-
      The product may be software-like, but telemetry, integrations, enforcement, and support could materially change
      contribution economics.
    diligencePath: >-
      Request cohort-level bookings, deployment hours, cloud and support costs, renewal rates, CAC allocation, and
      payback by segment.
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt or credit facilities, and next-round trigger.
    whyItMatters: >-
      A $100 million funding headline does not establish current liquidity or whether expansion requires another
      financing.
    diligencePath: >-
      Obtain latest balance sheet, thirteen-week cash forecast, debt schedule, board-approved plan, and financing
      milestones.
  - type: enumeration-incomplete
    severity: material
    topic: customers
    missingEvidence: Named or anonymized customer count, deployment footprint, concentration, and renewal status.
    whyItMatters: Enterprise traction and concentration determine revenue durability and the cost of scaling implementations.
    diligencePath: >-
      Request a customer cohort schedule with contract value, go-live date, renewal date, sector, geography, and
      implementation status.
  - type: missing-source
    severity: material
    topic: architecture
    missingEvidence: >-
      Detailed endpoint sensor architecture, supported operating systems, privileges, telemetry paths, privacy controls,
      and fail-open or fail-closed behavior.
    whyItMatters: >-
      These facts determine deployment friction, data exposure, reliability, and whether endpoint enforcement is safe
      for production use.
    diligencePath: >-
      Request current architecture and data-flow documentation, then validate it in a sandbox and controlled enterprise
      pilot.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE006
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: integrations
    missingEvidence: >-
      Production integration list, API and identity integration details, support model, and independent performance
      benchmarks.
    whyItMatters: >-
      A control layer is only useful if it covers the buyer's endpoint and SaaS estate without unacceptable latency or
      operational overhead.
    diligencePath: >-
      Obtain an integration matrix and run seeded discovery, attribution, policy, and rollback tests across
      representative endpoints and tools.
    relatedQuestionRefs:
      - QE004
      - QE007
      - QE009
    relatedTableRefs:
