  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: revenue
      missingEvidence: Audited or management-reported revenue, ARR, bookings, revenue mix, and recognition policy by period.
      whyItMatters: Without realized revenue and recognition detail, scale, growth, and recurring-quality claims cannot be underwritten.
      diligencePath: Obtain monthly income statements, ARR bridge, bookings ledger, contract samples, and revenue-recognition memo for the last eight quarters.
    - type: missing-source
      severity: blocking
      topic: unit-economics
      missingEvidence: Customer-level pricing, implementation cost, gross margin, CAC, sales cycle, retention, and payback cohorts.
      whyItMatters: The product may be software-like, but telemetry, integrations, enforcement, and support could materially change contribution economics.
      diligencePath: Request cohort-level bookings, deployment hours, cloud and support costs, renewal rates, CAC allocation, and payback by segment.
    - type: missing-source
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, runway, debt or credit facilities, and next-round trigger.
      whyItMatters: A $100 million funding headline does not establish current liquidity or whether expansion requires another financing.
      diligencePath: Obtain latest balance sheet, thirteen-week cash forecast, debt schedule, board-approved plan, and financing milestones.
    - type: enumeration-incomplete
      severity: material
      topic: customers
      missingEvidence: Named or anonymized customer count, deployment footprint, concentration, and renewal status.
      whyItMatters: Enterprise traction and concentration determine revenue durability and the cost of scaling implementations.
      diligencePath: Request a customer cohort schedule with contract value, go-live date, renewal date, sector, geography, and implementation status.
