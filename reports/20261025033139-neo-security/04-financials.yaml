callouts:
  - calloutType: strength
    title: Large disclosed capital base
    body: Multiple retained sources report $100 million of aggregate funding, including a $75 million Series A and a previously undisclosed $25 million seed, giving Neo meaningful resources to build and sell the platform.
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Financial transparency is the underwriting constraint
    body: No retained source discloses revenue, ARR, pricing, gross margin, burn, runway, or named customer economics; the recommendation must therefore remain conditional on private diligence.
    claimRefs: [CI006, CI010, CI011, CI012, CI014]
