company:
  name: Neo Security
chapter:
  number: 4
  title: Financials
  summary: Neo has disclosed substantial early capital and a security-control product aimed at a fast-forming enterprise category, but public evidence does not disclose revenue, pricing, gross margin, burn, runway, or customer economics. The underwriting case therefore rests on capital adequacy and category timing rather than demonstrated financial performance.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: Neo describes a platform sold to enterprise security operations teams for inventory, capability and risk intelligence, attribution, policy control, and native enforcement across agentic software. That product description supports a recurring enterprise-software hypothesis, but the public record does not establish whether contracts are priced by endpoint, user, agent, identity, software inventory, usage, or negotiated annual commitment. Neo's official page describes the buyer and control surface but gives no price card, contract terms, customer count, or realized revenue. Independent reporting says the company has tested its software with organizations in financial services, transportation, and energy, while naming none and disclosing neither pricing nor independent performance results. List-like product scope must not be treated as revenue, ARR, or gross margin. The diligence priority is a contract-level bridge from deployed scope to recognized revenue, including implementation, support, renewal, and usage components.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics
    title: Cost structure and unit-economics gaps
    body: "The disclosed operating plan is expansionary: Neo said it would use capital to scale go-to-market and engineering, and coverage describes a 50-person company with 40 employees in Israel. Those signals indicate meaningful forward investment but do not quantify cash burn, gross margin, hosting cost, support burden, sales-cycle length, CAC, payback, or contribution margin. The product's real-time inventory, attribution, policy evaluation, and native enforcement may carry infrastructure, telemetry, integration, and customer-success costs, but the retained sources do not provide measured cost-to-serve. No public evidence establishes that customer revenue offsets this hiring and technical build phase. Underwriting should therefore use an explicit unavailable-data case rather than imputing SaaS benchmarks, and request cohort economics by deployment size and contract vintage."
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: "Neo emerged from stealth with reported aggregate funding of $100 million, described by multiple sources as a $75 million Series A plus a previously undisclosed $25 million seed. The exact cash balance, post-money valuation, liquidation preferences, debt, committed facilities, current burn, and runway remain undisclosed. The funding is a meaningful buffer for building a security platform, but raised capital is not cash available: spending since the seed and Series A, working-capital needs, hiring pace, and obligations are unknown. Reporting that the company planned to expand engineering and go-to-market supports a likely financing-dependent growth posture, not a quantified runway. The financial verdict is track/research-more: capital access looks stronger than financial transparency, while the absence of public revenue and unit economics prevents a margin-path or valuation conclusion. A financing model should be refreshed from bank balance, monthly burn, bookings, renewal data, debt schedule, and next-round trigger."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    tableRefs: []
  - id: diligence-blockers
    title: Underwriting blockers
    body: The central blocker is not a negative reported financial event; it is incomplete disclosure. Public sources support the funding chronology and product thesis, but do not support a revenue run-rate, ARR, revenue mix, gross margin, customer concentration, pricing realization, cash balance, burn, runway, or debt view. Independent commentary also flags that Neo has not disclosed named customers, pricing, detailed architecture, or independent performance results. Those gaps matter because enterprise security companies can have attractive software-like economics only after implementation complexity, support load, data volume, and renewal behavior are demonstrated. The next diligence package should reconcile capitalization-table funding to cash, show bookings-to-revenue recognition, provide customer-level concentration and retention, and separate one-time services from recurring software revenue.
    claimRefs: [CI003, CI006, CI010, CI012, CI014]
