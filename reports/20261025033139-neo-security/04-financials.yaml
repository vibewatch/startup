      - [CAC and payback, null, low, "Expansionary GTM spending is not comparable to efficient growth without cohorts", "Provide fully loaded CAC, sales cycle, and payback"]
      - [Cash burn and runway, null, low, "Funding raised is not current liquidity", "Provide monthly burn, cash balance, and runway forecast"]
      - [Net retention and customer concentration, null, low, "Durability and downside concentration are untested", "Provide cohort retention and top-customer exposure"]
    notes: "Null means not disclosed in the assigned public evidence; no benchmark or zero has been substituted."
    claimRefs: [CI005, CI006, CI007, CI008, CI010, CI011, CI013]
