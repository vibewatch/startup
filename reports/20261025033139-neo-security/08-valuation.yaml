schemaVersion: "report-v2"
artifact: valuation
slug: neo-security
runDate: "2026-10-25"
company:
  name: Neo Security
chapter:
  number: 8
  title: Valuation
  summary: >-
    Neo has verified backing and a plausible control-layer thesis, but the retained public
    record does not disclose its valuation, revenue, retention, pricing, named customers, or
    independent performance results. The appropriate stance is track/research-more with high
    risk and no supportable company-specific valuation range until commercial evidence and
    financing terms are available.
sections:
  - id: recommendation
    title: Recommendation and decision posture
    body: >-
      Neo merits a track/research-more recommendation rather than a priced investment decision.
      The strongest positive evidence is the verified $100 million financing, including an
      independently reported $75 million Series A following a $25 million seed round, and a
      product thesis aimed at inventorying and controlling agentic software at the endpoint.
      Those facts establish investor sponsorship and strategic ambition, not commercial
      validation. The retained public evidence still omits the company's post-money valuation,
      revenue or ARR, retention, pricing, named deployments, and independent performance
      results. Without those inputs, a precise entry price or target return would be false
      precision. Risk is high because execution proof is thin while capital and valuation
      enthusiasm across cybersecurity and AI-security markets remains elevated.
    claimRefs: [CV001, CV002, CV003, CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and financing context
    body: >-
      The thesis is that enterprises need a control plane that can discover agentic software,
      attribute actions, evaluate configuration risk, and enforce policy before sensitive
      systems are touched. Neo also has founders with relevant enterprise-security operating
      backgrounds and enough disclosed capital to pursue engineering and go-to-market
      expansion. The anti-thesis is equally material: agentic security is already crowded,
      incumbents and venture-backed specialists span identity, gateways, runtime, and
      governance, and Neo has not publicly shown customer identities, pricing, detailed
      architecture, or independent results. Financing composition is clearer than valuation:
      third-party reporting identifies a $75 million Series A and prior $25 million seed, but
      no retained source provides post-money value, preferences, ownership, debt, or runway.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenario framework and entry discipline
    body: >-
      Scenario analysis should be milestone-based rather than presented as an absolute dollar
      valuation. Public cybersecurity benchmarks range widely by business quality and
      subsector: one retained market source places the general public cyber index at 7.8 times
      next-twelve-month revenue, security operations at 7.2 times, identity at 10.5 times, and
      cloud security at 13.9 times, while lower-middle-market M&A averages are much lower.
      These are market reference points, not Neo valuation evidence. A bull case requires
      verified recurring revenue, durable retention, referenceable deployments, and technical
      efficacy. A base case preserves optionality but delays pricing. A bear case follows if
      deployments remain undisclosed, product claims lack independent validation, or financing
      terms embed a price that assumes category leadership before commercial proof.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV013, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Neo is not publicly exit-ready on the available evidence. Cybersecurity M&A and funding
      activity provide a credible strategic-exit backdrop, but transactions reward scarce
      scaled assets, growth quality, and demonstrable integration value; category activity
      alone does not establish an exit value for Neo. The investment case should be reopened
      only after management supplies the cap table and preference stack, ARR and revenue
      quality, gross and net retention, gross margin, burn and runway, pricing, pipeline
      conversion, named reference customers, deployment scale, and third-party efficacy tests.
      Thesis-break triggers include inability to convert pilots into paid production
      deployments, weak retention, material sensor or enforcement performance shortfalls,
      excessive preference overhang, or a proposed entry valuation that prices Neo near
      premium public subsectors without comparable revenue quality and proof.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV011, CV012, CV013, CV014, CV015, CV016]
