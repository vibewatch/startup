callouts:
  - calloutType: recommendation
    title: Price is the gating variable
    body: >-
      Neo may become investable, but the retained public record cannot establish whether the
      current private price compensates for commercial, technical, and category risk.
    claimRefs: [CV012, CV013, CV014]
  - calloutType: risk
    title: Funding is not cash availability
    body: >-
      The disclosed $100 million is cumulative financing, not evidence of current cash,
      undrawn capital, burn, runway, or an unencumbered balance sheet.
    claimRefs: [CV001, CV002, CV012]
