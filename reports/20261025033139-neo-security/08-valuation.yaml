      - [Risk rating, High, "Crowded category, limited public proof, and elevated market enthusiasm", "Require milestone and price protection"]
      - [Valuation stance, Unknown, "No post-money valuation, ARR, retention, pricing, or terms in retained evidence", "Reassess only after a complete financing and KPI data room"]
    notes: "Analytical judgment as of 2026-10-25; unknown means the retained evidence cannot support a company-specific valuation, not that Neo has no private valuation."
    claimRefs: [CV001, CV011, CV012, CV013, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence today, What would change the view]
    rows:
      - [Thesis, "A new control layer may be needed for autonomous enterprise software", "Neo describes inventory, posture, attribution, and native enforcement", "Independent validation of coverage and prevention efficacy"]
      - [Thesis, "Team and financing can support initial execution", "$100M total funding and relevant founder backgrounds are disclosed", "Evidence of efficient product delivery and repeatable enterprise sales"]
      - [Anti-thesis, "The category is crowded across multiple security layers", "Independent mapping identifies numerous funded startups and incumbent platform moves", "Clear win/loss evidence and durable product differentiation"]
      - [Anti-thesis, "Commercial and technical proof remains thin", "Named customers, pricing, architecture detail, and independent results are not public", "Reference calls, cohort metrics, architecture review, and third-party testing"]
    notes: "This is a selective thesis table based only on retained public evidence; it is not an exhaustive competitor or customer enumeration."
    claimRefs: [CV003, CV004, CV005, CV011, CV012, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Probability signal]
    rows:
      - [Bull, "Referenceable production deployments, strong ARR growth and retention, validated endpoint enforcement", "Apply an evidence-adjusted premium software multiple only to verified recurring revenue; no absolute range is supportable today", "Named renewals, expansion, independent tests, and disclosed unit economics"]
      - [Base, "Product works in pilots but commercial repeatability and retention remain unproven", "Defer pricing or use a milestone-gated structure; public benchmarks are context, not a direct comp", "Several paid deployments but incomplete cohort and margin evidence"]
      - [Bear, "Slow conversion, weak retention, integration friction, or incumbent bundling compresses willingness to pay", "No defensible public valuation range; protect downside through price, milestones, and preference review", "Missing references persist or management KPIs miss plan"]
      - [Entry guardrail, "Complete cap table, terms, ARR, retention, margin, burn, runway, and customer evidence", "Reject a premium-subsector multiple without comparable growth quality and proof", "Data-room verification closes the major evidence gaps"]
    notes: "Scenario values are intentionally not quantified because Neo-specific revenue, ownership, financing terms, and current private valuation are undisclosed; cited market multiples are non-company benchmarks."
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV015, CV016]
