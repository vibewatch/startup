chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product thesis
        blocks:
          - type: paragraph
            body: >-
              Neo Security presents itself as the Agentic Software Control company, focused on the layer between
              enterprise software adoption and security enforcement. Its official description says the platform
              inventories, attributes, and enforces controls across software classes running on managed and unmanaged
              endpoints. Independent coverage describes the same wedge as a real-time control layer for AI agents,
              agent-enabled applications, browsers, identities, plugins, MCP servers, and traditional software acquiring
              autonomous capabilities. This is a specific positioning choice rather than a generic AI-security label:
              Neo is selling visibility, attribution, and in-line policy enforcement for software acting with legitimate
              permissions. The central diligence question is whether this control plane becomes a durable product
              category or a feature absorbed by broader security, identity, or data-governance platforms.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
