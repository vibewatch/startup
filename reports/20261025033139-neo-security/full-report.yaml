              - CI010
              - CI011
              - CI013
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Neo emerged from stealth with reported aggregate funding of $100 million, described by multiple sources as
              a $75 million Series A plus a previously undisclosed $25 million seed. The exact cash balance, post-money
              valuation, liquidation preferences, debt, committed facilities, current burn, and runway remain
              undisclosed. The funding is a meaningful buffer for building a security platform, but raised capital is
              not cash available: spending since the seed and Series A, working-capital needs, hiring pace, and
              obligations are unknown. Reporting that the company planned to expand engineering and go-to-market
              supports a likely financing-dependent growth posture, not a quantified runway. The financial verdict is
              track/research-more: capital access looks stronger than financial transparency, while the absence of
              public revenue and unit economics prevents a margin-path or valuation conclusion. A financing model should
              be refreshed from bank balance, monthly burn, bookings, renewal data, debt schedule, and next-round
              trigger.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The central blocker is not a negative reported financial event; it is incomplete disclosure. Public
              sources support the funding chronology and product thesis, but do not support a revenue run-rate, ARR,
              revenue mix, gross margin, customer concentration, pricing realization, cash balance, burn, runway, or
              debt view. Independent commentary also flags that Neo has not disclosed named customers, pricing, detailed
              architecture, or independent performance results. Those gaps matter because enterprise security companies
              can have attractive software-like economics only after implementation complexity, support load, data
              volume, and renewal behavior are demonstrated. The next diligence package should reconcile
              capitalization-table funding to cash, show bookings-to-revenue recognition, provide customer-level
              concentration and retention, and separate one-time services from recurring software revenue.
            claimRefs:
