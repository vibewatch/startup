      - number: '4.2'
        title: Cost structure and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating plan is expansionary: Neo said it would use capital to scale go-to-market and
              engineering, and coverage describes a 50-person company with 40 employees in Israel. Those signals
              indicate meaningful forward investment but do not quantify cash burn, gross margin, hosting cost, support
              burden, sales-cycle length, CAC, payback, or contribution margin. The product's real-time inventory,
              attribution, policy evaluation, and native enforcement may carry infrastructure, telemetry, integration,
              and customer-success costs, but the retained sources do not provide measured cost-to-serve. No public
              evidence establishes that customer revenue offsets this hiring and technical build phase. Underwriting
              should therefore use an explicit unavailable-data case rather than imputing SaaS benchmarks, and request
              cohort economics by deployment size and contract vintage.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
