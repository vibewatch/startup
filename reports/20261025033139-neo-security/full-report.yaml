    title: Recommendation logic
    type: flow
    summary: The decision chain separates verified category and financing evidence from the missing proof needed to price Neo.
    data:
      nodes:
        - id: category
          label: Category need
          detail: Autonomous enterprise software creates a plausible new control problem.
        - id: product
          label: Product thesis
          detail: Neo claims inventory, posture, attribution, and endpoint enforcement.
        - id: financing
          label: Capital support
          detail: $100M total financing is corroborated.
        - id: proof
          label: Proof gap
          detail: Named customers, pricing, architecture, and independent results are not disclosed.
        - id: valuation
          label: Valuation gap
          detail: Post-money value, terms, ARR, retention, margins, and runway are unavailable.
        - id: decision
          label: Track / research more
          detail: Require verified KPIs, terms, and price discipline before investing.
