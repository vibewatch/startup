        title: Milestones and remaining verification
        blocks:
          - type: paragraph
            body: >-
              The available record provides a coherent launch sequence: founder experience accumulated before Neo, a
              2025 seed round, rapid growth in the agentic-application problem, and the July 2026 stealth launch and
              Series A. The product announcement describes five capability groups: inventory, capability and risk
              intelligence, real-time attribution, granular policy control, and native enforcement. BARC's July
