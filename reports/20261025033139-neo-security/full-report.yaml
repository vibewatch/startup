            title: Large disclosed capital base
            body: >-
              Multiple retained sources report $100 million of aggregate funding, including a $75 million Series A and a
              previously undisclosed $25 million seed, giving Neo meaningful resources to build and sell the platform.
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: Financial transparency is the underwriting constraint
            body: >-
              No retained source discloses revenue, ARR, pricing, gross margin, burn, runway, or named customer
