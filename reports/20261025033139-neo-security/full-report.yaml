  - id: FE001
    title: Neo disclosed product architecture
    type: stack
    summary: >-
      The disclosed product thesis runs from endpoint discovery through intelligence, attribution, control, and
      enforcement.
    data:
      layers:
        - label: Agentic software surface
          detail: The endpoint software classes Neo says its platform is designed to govern.
          items:
            - name: Agents, plugins, extensions, and MCP servers
              detail: Software classes identified as inputs to Neo's discovery and control workflow.
              status: Disclosed target surface
        - label: Discovery
          detail: Endpoint discovery of agentic software and related assets.
          items:
            - name: Neoverse software inventory
              detail: Catalogs agents, plugins, extensions, MCP servers, and agentic-enabled applications.
              status: Disclosed capability
            - name: Endpoint sensor
              detail: Investor-described endpoint vantage point for real-time interception.
              status: Investor-described design
        - label: Understanding
          detail: Capability and risk intelligence for discovered software.
          items:
            - name: Capability and risk intelligence
              detail: Maps access, configuration, and changing capability risk.
              status: Disclosed capability
        - label: Accountability
          detail: Attribution and auditability for agent activity.
          items:
            - name: Real-time attribution
              detail: Creates an audit trail tying activity to a human, agent, or application.
              status: Disclosed capability
        - label: Control
          detail: Policy controls for tools, APIs, and data movement.
          items:
            - name: Granular software control
              detail: Applies identity- or group-level policies to tool calls, API access, and data movement.
              status: Disclosed capability
        - label: Enforcement
          detail: Direct blocking of risky endpoint activity.
          items:
            - name: Native endpoint enforcement
              detail: Blocks risky activity directly at the endpoint rather than handing enforcement to another product.
              status: Investor-described design
    approximationNotes: >-
      Layer order is an analytical presentation of disclosed functional roles, not a verified implementation sequence or
      claim that every layer is generally available.
