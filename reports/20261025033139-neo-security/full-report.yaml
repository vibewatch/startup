  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying center
        blocks:
          - type: paragraph
            body: >-
              The relevant market is software that identifies, observes, governs, and enforces actions by AI agents and
              agent-enabled applications inside enterprise workflows. It includes inventory and posture, identity and
              delegated authority, runtime policy enforcement, approval controls, auditability, and compliance evidence.
              It excludes general-purpose endpoint, identity, API-gateway, and model-observability spend unless those
              products are specifically extended to govern autonomous software. The boundary matters because Neo is
              described as a real-time control layer across agents, applications, browsers, identities, plugins,
              extensions, MCP servers, and traditional software becoming agentic, while an independent landscape
              separates Identity & Access, Posture, Runtime Protection, Runtime Authorization, and Compliance. The
              primary buyer is therefore likely a security organization, with SecOps owning operational control and
              identity, risk, compliance, and application owners influencing deployment. Adoption is triggered when
              agents gain write access or cross-application reach; the status quo is inventorying manually, relying on
              existing permissions, or accepting application-level controls without agent-specific attribution.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: Sizing lenses and growth drivers
        blocks:
          - type: paragraph
            body: >-
              The most usable sizing lens is a published agentic-AI-security forecast, not a top-down claim that all
              cybersecurity spend is addressable. MarketsandMarkets projects the category from USD 1.65 billion in 2026
              to USD 13.52 billion in 2032 at a 42.0% CAGR, with solutions at 71.32% of 2026 share and North America at
              41.92%; those figures are analyst estimates and include a broad ecosystem of threat detection, guardrails,
              red teaming, identity, and AI workload protection. A second lens is penetration: SiliconANGLE reports
              Gartner's estimate that only 5% of enterprise applications had agentic features at the end of 2025, versus
              more than 40% expected by the end of 2026. The growth case is thus driven by expanding agent exposure and
              the need to connect visibility to action, but the market is still early and the forecast's category
              perimeter is wider than Neo's endpoint and software-control wedge. NIST and the EU AI Act add governance
              and traceability pressure, while the absence of binding agent-specific requirements and fragmented
              standards can slow purchasing and make budgets difficult to assign.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The buyer problem is urgent but not yet a clean, repeatable budget category. EWeek says organizations must
              connect each agent to an owner, approved purpose, permission scope, and expiration policy, and reports
              that Neo has tested its software with unnamed financial-services, transportation, and energy organizations
              while not disclosing pricing, detailed architecture, or independent performance results. That combination
              supports a plausible enterprise need but leaves conversion, willingness to pay, and implementation
              friction unresolved. The product thesis is differentiated from passive monitoring because Neo claims
              native enforcement, granular controls, and attribution; however, a landscape source says most vendors
              concentrate on only one or two capability areas, so Neo will face identity, posture, runtime, compliance,
              and incumbent-security alternatives. EU high-risk obligations emphasize risk assessment, logging,
              documentation, human oversight, cybersecurity, and accuracy, but their application depends on use case and
              transition dates. Valuation should therefore credit category timing and control-layer relevance while
              discounting for unknown pricing, unnamed references, absent independent benchmarks, and uncertain SAM/SOM
              conversion from the broad forecast.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Category timing is strong, category boundaries are not
            body: >-
              The forecasted growth rate and rapid expansion of agentic capabilities support market timing, but the
              published market perimeter includes functions and vendors broader than Neo's control-layer wedge.
