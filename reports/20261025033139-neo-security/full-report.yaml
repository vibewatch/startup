        title: Financing, footprint, and disclosure
        blocks:
          - type: paragraph
            body: >-
              Neo emerged from stealth on July 20, 2026 with $100 million in combined funding. Calcalist and BARC
              describe the disclosed composition as a $75 million Series A led by Andreessen Horowitz and Bessemer
              Venture Partners, plus a previously undisclosed $25 million seed completed in 2025; company-issued launch
