        title: Founding team and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public materials identify Nicholas Warner as CEO and co-founder, Shlomi Salem as CPO and co-founder, and
              Eran Shirazi as CTO and co-founder. Their backgrounds are unusually relevant to the proposed product:
              Warner built SentinelOne's go-to-market organization and helped take it public, Salem led detection
              engineering and threat research there, and Shirazi combines EasySend founding experience with enterprise
              research and development and Unit 8200 vulnerability-research experience. The sources support
              founder-market fit and functional coverage across go-to-market, security research, and engineering. They
              do not establish a board roster, formal governance controls, succession plan, or the degree to which Neo
              depends on any one executive, so those remain diligence items rather than conclusions.
