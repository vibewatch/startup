  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Neo positions its product as a real-time control layer for agentic software rather than a conventional API
              gateway or a report-only discovery tool. Its stated workflow is to reveal what agentic software exists on
              endpoints, understand what each component can access and how it is configured, attribute activity to a
              human, agent, or application, and enforce controls over tool calls, API access, and data movement. The
              official company description says Neo “inventories, attributes, and enforces across every software class
              your workforce runs in real time on every endpoint, managed or not.” Bessemer describes a related
              operating loop: observe traffic, propose policy from observed behavior, and let security teams extend
              policy in plain language. This is a plausible time-to-value mechanism, but it remains a company and
              investor description rather than independently measured proof of detection quality or policy precision.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Modules and technical architecture
        blocks:
          - type: paragraph
            body: >-
              The public product map has five functional layers. Neoverse is described as the inventory layer for AI
              agents, plugins, extensions, MCP servers, and agentic-enabled applications. Capability and risk
              intelligence maps access and configuration; real-time attribution creates an audit trail; granular
              software control applies identity- or group-level policy; and native enforcement blocks risky activity
              without handing enforcement to another product. The differentiator is the endpoint vantage point: Bessemer
              says Neo built an actual endpoint sensor because it is the vantage point that can intercept and govern an
              agent in real time. This could cover local coding assistants and desktop applications that do not traverse
              a network proxy, but the public record does not disclose sensor privileges, operating-system coverage,
              telemetry handling, latency, fail-open behavior, or integration APIs. The architecture map therefore
              represents disclosed functional roles, not a verified implementation diagram.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Maturity, integrations, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Neo has a coherent differentiation thesis: discover agentic software that may not self-report, then govern
              it at the endpoint rather than relying only on API visibility. Security Boulevard describes the platform
              as spanning inventory, monitoring, attribution, and control, while Palo Alto's competing Prisma AIRS 3.0
              shows that large platform vendors are also assembling discovery, assessment, and runtime control across
              cloud, SaaS, and endpoint environments. That competitor evidence means Neo's category is strategically
              important but not uncontested. A separate practitioner-oriented MCP governance source highlights identity
              federation, action-level RBAC, audit logging, and exportable policies as enterprise gateway requirements;
              these are relevant diligence questions for Neo, not proof that Neo provides them. The current public
              record does not establish production integrations, named customers, independent benchmarks, roadmap dates,
              or public pricing. Enera explicitly says Neo has not published pricing, detailed architecture
              documentation, or named customer references.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE010
              - CE011
              - CE012
              - CE014
              - CE018
      - number: '5.4'
        title: Trust, safety, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              The use case is security-sensitive because agents can inherit valid permissions, call tools, and move
              through workflows in ways that appear authorized to legacy controls.       NIST describes the AI Risk
              Management Framework as voluntary guidance intended to improve how organizations incorporate
              trustworthiness into AI design, development, use, and evaluation. IBM's survey of 2,000 technology
              executives found that 70% said business teams deploy technology faster than IT can track; that figure
              establishes buyer pain, not Neo product performance. Neo's unresolved implementation questions are
              consequently material: endpoint deployment and permissions, privacy and data retention, policy
              correctness, incident response, rollback, coverage across operating systems and SaaS tools, and evidence
              of reliable enforcement under adversarial or degraded conditions. The next diligence step is a controlled
              pilot with measurable discovery coverage, attribution accuracy, block/allow precision, latency, and
              failure-mode behavior.
            claimRefs:
              - CE015
              - CE018
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent endpoint-control thesis
            body: >-
              Neo's disclosed design addresses discovery and enforcement at the endpoint, where local coding assistants
              and desktop applications may evade a network-only view.
            calloutType: strength
            claimRefs:
              - CE005
              - CE009
          - type: callout
            title: Proof gap is concentrated in implementation
            body: >-
              Public material does not establish pricing, detailed architecture, named customer references, production
              integrations, independent benchmarks, or enforcement reliability.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
          - type: callout
            title: Gate adoption on a measured pilot
            body: >-
              Require controlled evidence for discovery coverage, attribution accuracy, policy precision, latency,
              privacy, and rollback before treating the product as production-ready.
            calloutType: recommendation
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Neo is positioned for enterprise security and IT teams that need to inventory, attribute, and govern
              autonomous software. The public record points most directly to SecOps and security architecture users,
              while regulated financial institutions are a particularly important use case because agent permissions,
              data access, auditability, and third-party risk matter together. The likely economic buyer is an
              enterprise security or risk owner, but no public source confirms budget ownership, contract structure,
              pricing, or whether procurement is direct or partner-led. Customer segmentation is therefore directional
              rather than a measured revenue mix. Transportation and energy references broaden the vertical hypothesis,
              but they do not show whether Neo's product is repeatable across procurement environments or merely being
              evaluated by a small design-partner set.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The available adoption signal is an early-stage pilot footprint rather than a disclosed customer base.
              Toflow reports pilots across financial services, transportation, and energy, while independent coverage
              describes testing with organizations in those sectors without naming them. Neo's own surface describes a
              real-time control layer and invites evaluation, but does not publish active-account totals, utilization,
              deployment counts, or customer outcomes. The evidence supports enterprise interest and evaluation
              activity; it does not support an ARR, retention, active-customer, or conversion claim. The July 2026
              launch coverage is recent relative to this refresh, yet the absence of a denominator still prevents a
              reliable trajectory or growth rate.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.3'
        title: Named references, retention, and expansion
        blocks:
          - type: paragraph
            body: >-
              No assigned source names a Neo customer or establishes that a reported pilot reached production. The
              customer-proof record consequently has three sector-level entries with unknown customer identity,
              deployment stage, and outcome. Public materials also provide no NRR, GRR, churn, renewal, contract-length,
              cohort, satisfaction, or concentration data. Neo's proposed workflow could support land-and-expand from
              inventory into attribution and policy enforcement, but that is a product hypothesis, not observed
              expansion. Buyers and investors should require reference calls, production telemetry, renewal evidence,
              and concentration disclosure before underwriting durability. This is the key distinction between a
              plausible security workflow and validated commercial durability: the former is described, while the latter
              remains private evidence.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Early demand signal, weak referenceability
            body: >-
              Neo has a credible enterprise problem and reported pilots across three sectors, but the public record does
              not yet prove named production deployments, outcomes, or durable expansion.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU014
          - type: callout
            title: Customer-proof gap
            body: >-
              Without named references, contract and pricing evidence, denominated customer counts, or retention data,
              adoption quality and concentration risk cannot be underwritten from public evidence.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Neo's product sits at the intersection of AI governance, cybersecurity, identity, and enterprise software
              procurement. The EU AI Act uses risk-based categories and assigns obligations across providers, deployers,
              importers, and distributors; its enforcement is hybrid, with national authorities handling many
              system-level duties and the European Commission supervising GPAI rules. That creates a classification and
              allocation risk for a control layer operating across agents, applications, plugins, and model-connected
              workflows. Public guidance also emphasizes that applicable duties vary by intended purpose, system role,
              deployment context, and the specific regulatory pathway. Neo's launch materials describe inventory,
              attribution, policy control, and native enforcement, but do not disclose its own conformity assessments,
              certifications, legal opinions, or customer-specific compliance boundaries. A separate 2020 article uses
              the phrase "Neo-Security Architecture" for Curity's unrelated identity, API, and entitlement design, so
              researchers must also guard against search-result attribution errors. The investment implication is not
              that non-compliance exists; it is that enterprise sales may require auditable classification, logging,
              oversight, incident reporting, contractual allocation, and evidence that are not publicly demonstrated.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
      - number: '7.2'
        title: Operational, technical, and security risk
        blocks:
          - type: paragraph
            body: >-
              The strongest external risk evidence concerns the environment Neo is selling into rather than a recorded
              Neo incident. Joint Five Eyes guidance identifies privilege, design and configuration, behavioral,
              structural, and accountability risks in agentic systems, including prompt injection, excessive access,
              cascading failures, and difficulty reconstructing why an action occurred. It recommends least privilege,
              defense in depth, secure identities, staged deployment, human checkpoints, and monitoring of internal
              action chains rather than only inputs and outputs. Cloud Security Alliance analysis similarly describes
              prompt injection as persistent and difficult to fix and notes that conventional SIEM tooling may not
              capture probabilistic multi-step behavior at the required granularity. Neo claims real-time attribution
              and native policy enforcement, which could be strategically relevant, but the public record does not
              establish detection efficacy, false-positive rates, rollback performance, coverage of unmanaged endpoints,
              or resilience under adversarial testing. These gaps leave product liability, trust, and execution exposure
              until independently testable controls are available.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, dependency, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Neo emerged from stealth with $100 million from Andreessen Horowitz and Bessemer Venture Partners, with
              participation from Craft Ventures and Merlin Ventures, and said it would use the capital to scale
              go-to-market and engineering. The announcement provides funding context but no valuation, revenue, ARR,
              burn, runway, gross margin, customer count, or renewal data. That makes capital sufficiency and commercial
              efficiency impossible to underwrite from the assigned public evidence. The product also depends on a
              changing ecosystem of AI agents, browsers, SaaS platforms, identities, plugins, MCP servers, endpoints,
              model providers, and enterprise security workflows. External guidance stresses that interconnected tools
              and multi-agent pipelines expand attack surfaces and can propagate a compromised component downstream.
              Neo's control-plane thesis therefore carries integration, platform-change, supplier/model, and
              adoption-timing risk; the company must prove that inventory and enforcement remain complete as
              counterparties change capabilities, permissions, APIs, and logging behavior.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The public mitigation signal is directionally coherent but not yet company-specific proof. Government
              guidance recommends starting with low-risk tasks, limiting agent access, using temporary credentials,
              adding human approval for high-impact actions, and integrating agent governance into existing zero-trust,
              defense-in-depth, and incident-response structures. EU compliance guidance likewise points to continuous
              risk management, current technical documentation, logging, post-market monitoring, incident procedures,
              and clear provider-deployer responsibility. For Neo, diligence should convert these principles into
              measurable operating tests: inventory coverage across managed and unmanaged endpoints; percentage of
              actions attributed to a human, agent, application, and identity; policy decision latency; blocked
              high-risk action recall and false-positive rates; log completeness and retention; rollback time;
              unresolved critical vulnerabilities; and customer renewal or expansion. A thesis break would be a material
              uncontained incident, inability to reconstruct consequential actions, repeated control bypasses, a
              regulatory classification that materially expands obligations without a delivery plan, or evidence that
              deployment requires broader privileges than customers will accept.
            claimRefs:
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports a high-risk posture, not a recorded Neo breach
            body: >-
              The assigned sources document material agentic-security and regulatory hazards, but they do not establish
              that Neo has suffered a breach, enforcement action, or control failure. The correct diligence stance is to
              test the company's safeguards rather than infer either safety or failure from silence.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR013
          - type: callout
            title: Make control efficacy a financing and procurement gate
            body: >-
              Before underwriting scale, require independent evidence for inventory coverage, least-privilege
              enforcement, action attribution, adversarial robustness, rollback, logging, and incident response,
              alongside current financial and customer-retention metrics.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision posture
        blocks:
          - type: paragraph
            body: >-
              Neo merits a track/research-more recommendation rather than a priced investment decision. The strongest
              positive evidence is the verified $100 million financing, including an independently reported $75 million
              Series A following a $25 million seed round, and a product thesis aimed at inventorying and controlling
              agentic software at the endpoint. Those facts establish investor sponsorship and strategic ambition, not
              commercial validation. The retained public evidence still omits the company's post-money valuation,
              revenue or ARR, retention, pricing, named deployments, and independent performance results. Without those
              inputs, a precise entry price or target return would be false precision. Risk is high because execution
              proof is thin while capital and valuation enthusiasm across cybersecurity and AI-security markets remains
              elevated.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The thesis is that enterprises need a control plane that can discover agentic software, attribute actions,
              evaluate configuration risk, and enforce policy before sensitive systems are touched. Neo also has
              founders with relevant enterprise-security operating backgrounds and enough disclosed capital to pursue
              engineering and go-to-market expansion. The anti-thesis is equally material: agentic security is already
              crowded, incumbents and venture-backed specialists span identity, gateways, runtime, and governance, and
              Neo has not publicly shown customer identities, pricing, detailed architecture, or independent results.
              Financing composition is clearer than valuation: third-party reporting identifies a $75 million Series A
              and prior $25 million seed, but no retained source provides post-money value, preferences, ownership,
              debt, or runway.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: Scenario framework and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be milestone-based rather than presented as an absolute dollar valuation. Public
              cybersecurity benchmarks range widely by business quality and subsector: one retained market source places
              the general public cyber index at 7.8 times next-twelve-month revenue, security operations at 7.2 times,
              identity at 10.5 times, and cloud security at 13.9 times, while lower-middle-market M&A averages are much
              lower. These are market reference points, not Neo valuation evidence. A bull case requires verified
              recurring revenue, durable retention, referenceable deployments, and technical efficacy. A base case
              preserves optionality but delays pricing. A bear case follows if deployments remain undisclosed, product
              claims lack independent validation, or financing terms embed a price that assumes category leadership
              before commercial proof.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Neo is not publicly exit-ready on the available evidence. Cybersecurity M&A and funding activity provide a
              credible strategic-exit backdrop, but transactions reward scarce scaled assets, growth quality, and
              demonstrable integration value; category activity alone does not establish an exit value for Neo. The
              investment case should be reopened only after management supplies the cap table and preference stack, ARR
              and revenue quality, gross and net retention, gross margin, burn and runway, pricing, pipeline conversion,
              named reference customers, deployment scale, and third-party efficacy tests. Thesis-break triggers include
              inability to convert pilots into paid production deployments, weak retention, material sensor or
              enforcement performance shortfalls, excessive preference overhang, or a proposed entry valuation that
              prices Neo near premium public subsectors without comparable revenue quality and proof.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              Neo may become investable, but the retained public record cannot establish whether the current private
              price compensates for commercial, technical, and category risk.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: callout
            title: Funding is not cash availability
            body: >-
              The disclosed $100 million is cumulative financing, not evidence of current cash, undrawn capital, burn,
              runway, or an unencumbered balance sheet.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV012
