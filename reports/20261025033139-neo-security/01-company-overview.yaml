company:
  name: Neo Security
chapter:
  number: 1
  title: Company Overview
  summary: Neo Security is a Boston-based, American-Israeli cybersecurity startup that emerged from stealth in July 2026 with $100 million of reported funding and a real-time control layer for agentic software. The public record supports a credible founding team and product thesis, but leaves valuation, revenue, customer identities, pricing, and independent performance evidence unresolved.
sections:
  - id: identity-and-product
    title: Identity and product thesis
    body: >-
      Neo Security presents itself as the Agentic Software Control company, focused on the layer between enterprise software adoption and security enforcement. Its official description says the platform inventories, attributes, and enforces controls across software classes running on managed and unmanaged endpoints. Independent coverage describes the same wedge as a real-time control layer for AI agents, agent-enabled applications, browsers, identities, plugins, MCP servers, and traditional software acquiring autonomous capabilities. This is a specific positioning choice rather than a generic AI-security label: Neo is selling visibility, attribution, and in-line policy enforcement for software acting with legitimate permissions. The central diligence question is whether this control plane becomes a durable product category or a feature absorbed by broader security, identity, or data-governance platforms.
    claimRefs: [CO001, CO002, CO003, CO004, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founding team and governance visibility
    body: >-
      Public materials identify Nicholas Warner as CEO and co-founder, Shlomi Salem as CPO and co-founder, and Eran Shirazi as CTO and co-founder. Their backgrounds are unusually relevant to the proposed product: Warner built SentinelOne's go-to-market organization and helped take it public, Salem led detection engineering and threat research there, and Shirazi combines EasySend founding experience with enterprise research and development and Unit 8200 vulnerability-research experience. The sources support founder-market fit and functional coverage across go-to-market, security research, and engineering. They do not establish a board roster, formal governance controls, succession plan, or the degree to which Neo depends on any one executive, so those remain diligence items rather than conclusions.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, footprint, and disclosure
    body: Neo emerged from stealth on July 20, 2026 with $100 million in combined funding. Calcalist and BARC describe the disclosed composition as a $75 million Series A led by Andreessen Horowitz and Bessemer Venture Partners, plus a previously undisclosed $25 million seed completed in 2025; company-issued launch material also names Craft Ventures and Merlin Ventures as participants. Calcalist reports 50 employees, including 40 in Israel, while Dealroom describes a Boston headquarters and Tel Aviv development center. No retained source supplies a post-money valuation, revenue or ARR, customer count, pricing, or named customer references. Funding is therefore evidence of investor commitment, not evidence of cash available after spending, commercial traction, or valuation support.
    claimRefs: [CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Milestones and remaining verification
    body: >-
      The available record provides a coherent launch sequence: founder experience accumulated before Neo, a 2025 seed round, rapid growth in the agentic-application problem, and the July 2026 stealth launch and Series A. The product announcement describes five capability groups: inventory, capability and risk intelligence, real-time attribution, granular policy control, and native enforcement. BARC's July assessment treats agent governance as a young, funded segment and warns of consolidation and overlap with existing security, identity, and data-governance investments. eWeek adds a material counterweight: Neo has tested with organizations in financial services, transportation, and energy, but has not disclosed their names, pricing, detailed architecture, or independent performance results. The next diligence cycle should prioritize production references, technical validation, customer concentration, board and governance records, and financing terms.
    claimRefs: [CO004, CO008, CO012, CO013, CO015]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Security-native founding team
    body: The three co-founders combine security-company operating experience, detection engineering, vulnerability research, and enterprise software delivery, which is directly relevant to a runtime control product.
    claimRefs: [CO005, CO006, CO007]
  - calloutType: risk
    title: Commercial proof remains thin
    body: Public materials do not name the organizations that tested Neo, disclose pricing, or provide independent performance results, leaving adoption and repeatability unverified.
    claimRefs: [CO012, CO014]
  - calloutType: assumption
    title: Category durability is unproven
    body: The product addresses a real control problem, but independent analysis explicitly frames the open question as standalone agent security versus functionality absorbed by larger platforms.
    claimRefs: [CO013]
