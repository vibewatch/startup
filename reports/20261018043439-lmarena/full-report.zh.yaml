        title: 资本结构、里程碑与未解决的信任问题
        blocks:
          - type: paragraph
            body: >-
              里程碑推进得异常紧凑。LMArena 从获得资助的学术项目起步，2025 年 5 月完成 $100 million 种子轮，2025 年 9 月上线 AI Evaluations，12 月披露 $30
