        title: 中立性是最核心的论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              LMArena 的品类地位取决于市场参与者是否相信其排名过程既独立又难以操纵。指定资料反复对这一假设施压。多个独立来源称，公司向主要模型实验室出售评测服务；Miraheze 则称，主要客户包括
              OpenAI、Google DeepMind、Anthropic 和 Meta，既做公开基准，也做私有上线前测试。这种重叠并不能证明存在不当行为，但确实形成了结构性利益冲突风险：基准参与者同时也是商业客户。

              更尖锐的问题是，批评者已经攻击基准完整性。SiliconANGLE 称，2025 年 4 月的一篇论文指责 LMArena 帮助大型实验室以牺牲竞争对手为代价提升排行榜位置；VKTR
              称公司否认了相关基准操纵指控；Miraheze 称 ICML 2025 研究发现，即使操纵无处不在，也能改变排名；36Kr
              称最常见的抱怨是众包投票容易被操纵。对一家评测公司而言，信任流失不是附带问题，而是可能同时损害客户付费意愿、监管者信心和公开排行榜市场标准地位的失效模式。
