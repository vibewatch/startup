  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可守住的市场边界是第三方 AI 模型评测，而不是模型训练、推理、托管或应用开发。LMArena
              的公开产品用盲测两两比较把人类偏好转化为相对排名；商业层则向模型实验室和企业出售评测服务。面向编程、视觉、网页开发、搜索及相关任务的专门竞技场拓宽了评测流程，但没有把公司变成通用 AI
              平台。静态学术基准、供应商自称的上线宣传和内部评测集，是最接近的现状替代方案。它们争夺的是同一个决策角色——判断模型是否适合某项任务——却无法提供持续更新的外部偏好信号。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
              - CM011
      - number: '2.2'
        title: 受证据约束的市场规模判断
        blocks:
          - type: paragraph
            body: >-
              指定来源没有提供能单独剥离 AI 评测支出的第三方市场模型，因此给出数值 TAM、SAM 或 SOM 都会是编造。可用的观察角度包括平台触达、评测活动、模型供给、商业牵引力，以及更广泛的企业 AI
              采用。Pulse 2.0 报道的公司口径数据显示，平台覆盖 150 个国家、月活用户超过 5 million，月度对话数达到 60 million。该报道还称，付费产品在 2025 年 12 月达到 $30
              million 年化消费运行率，距离上线不到四个月。这个指标不是 ARR、已确认收入、现金或市场规模。融资和估值说明投资人看好评测基础设施，却同样不能衡量客户支出。
