              月上线，收入来自付费评测服务。经济逻辑是说得通的：数百万次社区互动有助于建立基准可信度，再把这种可信度包装成面向模型实验室和受监管企业工作流的付费评估。但合同层面的细节仍然缺失。保留的公开来源都没有披露牌价、折扣、最低承诺，或已报告运行率中有多少来自企业重复支出、多少来自上线初期需求。
