  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 投资逻辑
        - LMArena 已将社区规模转化为付费产品，并在上线后数月内达到 $30M 年化运行率。
        - 若独立客户质量报告显示企业业务持续扩张，将强化这一判断。
      - - 投资逻辑
        - 公司快速融资 $250M，并吸引了知名投资者，说明市场对评估基础设施有很强信心。
        - 下一轮融资放缓，或仅由内部投资者参与，将削弱外部验证信号。
      - - 反向逻辑
        - 估值从 $600M 增至 $1.7B 的速度快于公开经营披露的扩展速度，几乎没有可见的安全边际。
        - 进一步披露毛利率、留存和客户集中度，可能为溢价倍数提供依据。
      - - 反向逻辑
        - 中立性在商业上至关重要，但仍存在争议；公开证据也未能解决治理或优先股堆叠带来的悬念。
        - 第三方方法论审计，加上澄清投资者权利的融资文件，将降低这一担忧。
    notes: 这些论点概括了有来源支持的正面和负面因素；判断变化的条件不是预测保证。
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV010
      - CV012
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - 企业评估规模超过已披露的 $30M 运行率，中立性能在商业压力下保持，受监管行业的部署扩大需求。
        - 如果收入质量提升足以支撑当前溢价倍数，估值可能明显高于当前 $1.7B。
        - 执行压力、基准政治反弹，或使用量转化为付费合同的速度放缓。
        - 需要关于留存、客户覆盖面和独立信任度的新证据。
      - - 基准情景
        - 商业进展延续，但公开披露仍不完整；随着品类成熟，估值倍数趋于正常化。
        - 业务可能逐步消化当前价格，但若没有更好的入场条件，按当前价位重新入场的上行空间有限。
        - 倍数收缩或客户质量平庸，抵消经营进展。
        - 与当前证据集最为一致。
      - - 悲观情景
        - 中立性争议、客户集中度或融资条款不对称，削弱市场对当前溢价的支付意愿。
        - 未来一轮融资的定价可能明显低于当前投后估值，并更接近上一轮锚点，而非新的溢价水平。
        - 下轮融资风险、治理摩擦或企业信任流失。
        - 如果尽调无法填补当前披露缺口，这一情景的可能性会上升。
    notes: 由于指定资料池没有披露利润率、留存、完整客户集中度或详细融资条款，情景逻辑是方向性的，而不是模型级结论。
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
