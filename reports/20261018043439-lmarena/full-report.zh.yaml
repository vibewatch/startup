              公开披露的领导班子仍集中在创始研究员和与 Berkeley 有关联的支持者周围。公开来源一致将 Anastasios Angelopoulos 和 Wei-Lin Chiang 认定为实际运营的联合创始人，Ion
              Stoica 则仍是创始故事和整体可信度框架的一部分。治理信息明显薄得多：指定资料显示，a16z 披露其合伙人 Anjney Midha 出任 LMArena
