        title: 投资判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，LMArena 更像一家信任层基础设施公司，而不是有透明席位定价的传统 SaaS
              公司。这一框架有助于解释融资规模和估值跃升，但也意味着中立性是产品本身，而非附带问题。外部报道显示，基准地位已经受到挑战，有人指称大型实验室从平台运营模式中获益；即使管理层否认这些说法，任何中立性受损的观感都可能威胁支撑付费评测的可信度。因此，公开记录足以支撑需求故事，却不足以形成干净的投资判断。在尽调拿到客户集中度、实际定价、毛利率、算力成本、烧钱速度和现金跑道之前，合理的财务结论是：商业化前景可观，但收入质量和资本充足性存在重大盲区。
