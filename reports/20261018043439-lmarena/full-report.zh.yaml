  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开来源支持这样一套分层架构：从盲测式用户比较开始，将结果转化为排名，再把同一引擎复用于公共竞技场和付费评估。
    data:
      layers:
        - label: 社区输入层
          detail: 盲测提示词采集和用户投票产生原始偏好流。
          modules:
            - 盲测提示词提交
            - 模型并排回答
          outputs:
            - 人类偏好投票
        - label: 抽样与匹配层
          detail: 平台决定哪些模型配对和比较流程进入排行榜。
          modules:
            - 匿名模型配对
            - 平票 / 两者都差的投票路径
          outputs:
            - 两两比较数据集
        - label: 排名与控制层
          detail: 统计评分将两两结果转化为公开模型排名。
          modules:
            - Bradley-Terry 或类似 Elo 的分数计算
            - 置信区间和重新加权 / 风格控制
          outputs:
            - Arena Score / 排行榜名次
        - label: 公共产品界面层
          detail: 同一评估引擎通过面向任务的产品界面对外提供服务。
          modules:
            - 公共排行榜
            - 专用竞技场
          outputs:
            - 文本、搜索、代码、视觉和媒体评估
        - label: 企业评估层
          detail: 付费评估将同一套排名机制打包，用于买方和实验室工作流。
          modules:
            - 面向实验室和企业的 AI Evaluations
            - 面向生产环境的模型测试
          outputs:
            - 付费评估报告和采购输入
        - label: 开放工具与证据层
          detail: 公共工具和数据资产进一步强化平台的技术可信度。
          modules:
            - FastChat 和 Arena-Rank
            - Arena-Hard 和公共数据集
            - RouteLLM 及相关支持资产
          outputs:
            - 可复用的研究和基准测试资产
    approximationNotes: 这是根据公开描述提炼的逻辑产品栈；指定资料池没有披露内部基础设施拓扑、托管方式或数据管线归属。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 社区规模使用带来基准可信度，随后主要转化为实验室和企业评估需求；但耐久性指标缺失和中立性担忧限制了最终扩张循环。
    data:
      items:
        - label: 公共盲测对战
          actor: 社区用户
          touchpoints:
            - 覆盖 150 个国家的每月 5M+ 用户
            - 每月 60M+ 次对话
            - 比较 400+ 个模型的 50M+ 次投票
          tone: positive
        - label: 排行榜信号
          actor: 开发者和模型关注者
          touchpoints:
            - 匿名并排投票形成可见的公共评分卡
            - 由于行业缺少公认的独立标准，基准结果很重要
          tone: neutral
        - label: 实验室基准测试需求
          actor: 模型厂商：OpenAI、Google、xAI、Anthropic、Meta
          touchpoints:
            - 已点名的实验室将平台用于公开基准测试和私有测试
            - 公开来源表明，这些可能是最清晰的付费或战略关系
          tone: positive
        - label: 企业私有评估
          actor: 企业 AI 团队
          touchpoints:
            - 私有竞技场、分析仪表盘和 API 访问支持特定领域的评估
            - 目标垂直行业包括软件工程、法律、医疗和科学研究
          tone: neutral
        - label: 试点多元化
          actor: 政府机构和受监管行业
          touchpoints:
            - 有资料提到试点已经开始
            - 没有披露具名的生产部署或公开结果
          tone: risk
        - label: 扩张检查点
          actor: 财务和买方管理层
          touchpoints:
            - $30M 年化运行率表明客户有支付意愿
            - 没有公开 NRR、流失率、合同期限或头部客户占比
            - 中立性和操纵投票的批评，可能放慢企业信任的进一步建立
          tone: risk
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
      - CU009
      - CU010
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 与信任相关的风险仍主导剩余风险敞口。
    data:
      columns:
        - label: 可能性
          note: 未来 12 个月内，该问题损害信任或商业转化的概率。
        - label: 影响
          note: 对基准可信度、企业转化或融资杠杆的影响。
        - label: 剩余风险敞口
          note: 扣除指定资料池中公开描述的缓解措施后的净风险。
      rows:
        - label: 中立性 / 客户重叠
          note: 主要实验室似乎既是客户，也是基准参与者。
          values:
            - text: 高
              tone: high
              note: 收入关系与公共排名权威发生重叠。
            - text: 严重
              tone: critical
              note: 任何付费买排名的观感都会冲击核心价值主张。
            - text: 高
              tone: high
              note: 开放方法有所帮助，但资料池中没有出现独立的中立性审计。
        - label: 基准操纵 / 方法论偏差
          note: 独立批评者指出了刷榜、操纵投票和风格偏差。
          values:
            - text: 高
              tone: high
              note: 多个来源记录的是持续批评，而非已经解决的争议。
            - text: 严重
              tone: critical
              note: 完整性担忧可能降低实验室和买方对基准的接受度。
            - text: 高
              tone: high
              note: 现有防御措施被描述为只有部分效果。
        - label: 受监管企业证明 / 合规
          note: 公开证据显示的是试点，而非经审计的生产采用。
          values:
            - text: 中
              tone: medium
              note: 需求可见，但证据基础仍很薄弱。
            - text: 高
              tone: high
              note: 缺少证明可能推迟价值最高的垂直行业落地。
            - text: 高
              tone: high
              note: 指定资料池中没有出现认证或具名部署证明。
        - label: 变现 / 治理不透明
          note: 相较于估值，收入商业进展仍处于早期，治理披露也仍属私有。
          values:
            - text: 中
              tone: medium
              note: 公司很快从分拆项目走到较高运行率。
            - text: 高
              tone: high
              note: 披露有限，限制了对溢价价格下行空间的分析。
            - text: 中高
              tone: high
              note: 核心尽调仍依赖非公开客户和治理材料。
        - label: 社区流量依赖
          note: 公共基准的相关性取决于用户提示词和投票量能否持续。
          values:
            - text: 中
              tone: medium
              note: 平台当前规模很大，但互动指标仍由公司自述。
            - text: 高
              tone: high
              note: 流量下降会削弱排名的新鲜度和正当性。
            - text: 中高
              tone: high
              note: 网络效应有价值，但尚未经过独立审计。
        - label: 投资者 / 董事会一致性观感
          note: 一位领投投资者还披露担任董事会成员，因此更需要明确的独立性控制。
          values:
            - text: 中
              tone: medium
              note: 董事会与投资者重叠很常见，但在此处格外显眼。
            - text: 中高
              tone: high
              note: 冲突治理不佳，可能削弱买方或实验室的信任。
            - text: 中高
              tone: high
              note: 公开披露尚未展示运营层面的防护边界。
    claimRefs:
      - CR003
      - CR006
      - CR010
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议遵循一条简单链路：快速出现的验证信号是真实的，但估值和披露风险已经跑在公开证据基础之前。
    data:
      nodes:
        - label: 社区规模信号
        - label: 付费产品上线
        - label: $30M 运行率信号
        - label: $1.7B 投后价格
        - label: 中立性和条款不透明
        - label: 观察，而非买入
    approximationNotes: 这是定性的决策链，而不是加权评分模型。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV010
      - CV012
      - CV013
      - CV015
