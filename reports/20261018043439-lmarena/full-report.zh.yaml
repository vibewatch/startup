  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              LMArena 仍是一家从 Berkeley 走出来、商业化异常迅速的评测公司。独立报道和投资人材料均显示，产品最初是 UC Berkeley 的研究项目 Chatbot Arena；Arena
              Intelligence Inc. 于 2025 年 4
              月注册成立后，在公开排行榜之上叠加了付费评测产品。如今的运营模式是双边的：免费众包竞技场负责生成偏好数据和分发，模型实验室与企业则购买付费评测服务。这种组合解释了公司为何能在八个月内从种子轮走到 $1.7
              billion 的 Series A；但目前流传的规模指标仍主要来自公司，而非独立审计。
