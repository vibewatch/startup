            body: >
              当前价格最强的支撑，是 LMArena 似乎用可见的使用和商业化信号跟上了投资人热情。公司支持的来源和第三方来源都称，平台月活用户超过 5 million，月度对话数超过 60 million，并拥有服务 AI
              实验室和企业的付费评测业务。2026 年 1 月这一轮还引入了重复投资人或蓝筹投资人，第三方报道称公司约七个月内融资 $250 million。这些数据支持一个判断：AI
              评测基础设施已经从研究工具变成商业预算项目。但同一批证据仍留下重要的投资判断空洞。一份第三方数据简报称，完整股东名册不公开，并且只根据披露的轮次规模和投后估值估算稀释。公开证据因此支持动能，却无法完整展示动能如何在新老股东之间分配价值。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: 下行风险与尽调触发条件
        blocks:
          - type: paragraph
            body: >
              悲观情景并不主要取决于 LMArena 是否做出了有用的东西，而在于市场是否在治理和中立性问题完全解决前，就按峰值倍数付费。Sherwood
              将排行榜描述为一个竞争激烈的试验场，所在行业仍缺少独立、行业标准的评测；VKTR 报道称，竞争者此前指控与 LMArena
              合作关系有关的基准操纵，公司对此予以否认。即便支持者也把中立性视为必须经受商业压力的关键资产。因此，尽调必须非常具体：投资人需要确认，当评测结果对主要模型提供商不利时，企业需求是否仍然存在；集中度和留存是否健康到足以支撑溢价倍数；融资条款是否会让后续投资人的地位比
              headline 投后估值显示的更差。在这些检查完成前，最站得住脚的情景框架是：只有企业信任快速复利，才有上行；如果信任保持但倍数回归，基准情景围绕当前价格；如果中立性或客户质量问题拖慢采用，则进入下行。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
