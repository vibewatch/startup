      - number: '4.2'
        title: 牵引力、资本与规模代理指标
        blocks:
          - type: paragraph
            body: >-
              公司 2025 年才商业化，但公开的收入端信号异常强。公开来源称，2026 年 1 月公司以 $1.7B 投后估值完成 $150M Series A，约七个月内累计融资达到
              $250M。与此同时，公司口径和第三方摘要称，月活用户超过 5 million，月度对话数约 60 million，2025 年 12 月年化消费运行率达到
              $30M。这种组合说明市场确有拉力，投资人也愿意为基础设施扩张投入大量资本；但它不能证明当前现金状况，也不能回答底层收入是否持久、多元或高效交付。一个声誉较低的指定评论把种子轮融资日期写成 2026 年 5
