      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据支持三类主要参与者。前沿模型实验室在模型发布前或发布前后使用评测，也是付费服务的明确客户。企业在生产部署前比较系统，尤其是在经济价值高或受监管的工作流中。开发者和研究人员把公开排行榜当作免费的发现和筛选入口，但现有资料没有显示他们是有意义的直接付款方。预算可能掌握在模型开发、AI
              平台、产品、风险或治理职能手中，但指定来源没有指明实际签字人或预算科目。因此，采用路径通常从公开比较开始，转为按用例测试；当采购、上线或合规风险值得付费获取外部证据时，再推进到私有评测。
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM010
              - CM011
      - number: '2.4'
        title: 驱动因素、约束与尽调含义
        blocks:
          - type: paragraph
            body: >-
              模型数量激增、企业快速采用，以及对静态或由供应商控制的基准不满，共同推动需求。外部评测有价值，是因为新提示词和独立用户能揭示固定测试集遗漏的偏好差异。但这种设计也带来约束：志愿投票者的构成可能不同于买方的生产用户群，呈现方式可能影响偏好，公开排名也不能直接衡量成本、安全性、事实准确性或受监管工作流的容错度。Trending
              Topics 报道了更广泛的基准有效性批评，并引用一项 500 票分析，对许多用户选择提出异议。这些发现并不能证明 LMArena
              没有价值；它们说明，要达到采购级采用，公开排行榜之外还需要按类别定制、私有且经过独立审计的评测。
            claimRefs:
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场规模仍是证据缺口
            body: 平台活跃度和 $30 million 年化消费运行率说明存在需求，但若没有买方数量、合同金额、留存率、品类支出和明确的市场边界，就不能换算出 TAM、SAM 或 SOM。
            calloutType: insight
            claimRefs:
              - CM004
              - CM006
              - CM016
          - type: callout
            title: 公开偏好不是采购证明
            body: 公开排行榜更适合被当作筛选信号。买方仍需围绕事实准确性、安全性、成本、延迟、用户群匹配度和置信区间获取针对具体任务的证据。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与真实比较集合
        blocks:
          - type: paragraph
            body: >-
              指定的公开证据表明，买方并不是在三个成熟度相当、且都获得风险投资支持的评测供应商之间做选择。首先要校正身份：Arena 在 2026 年 1 月完成品牌重塑后，许多当前比较页面仍把 LMArena、Arena
              AI 和 Arena 列为不同实体，而官方公告明确公司如今使用 Arena
              品牌。完成统一后，竞争格局分成几类：同时拥有公开产品和企业产品的直接领先者；规模更小的基准或聚合工具；以及内部评测或供应商自供评测这一现状方案。审阅材料中的 OpenLM.ai
              更像相邻的聚合和推理选项，而非已被证明的托管评测同类。Growth Engineer 列出的替代方案把 Artificial Analysis 和 Hugging Face Open LLM
              Leaderboard 视为基准发现工具，而非 Arena 那种兼具大规模偏好数据和委托式人工反馈研究的产品。
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP011
              - CP012
      - number: '3.2'
        title: 工作流差异化与买方匹配
        blocks:
          - type: paragraph
            body: >-
              指定资料中，Arena 最强的差异化在工作流，而不只是品牌。公开来源一致把平台描述为基于匿名正面对比的人类偏好排名系统；2025—2026 年的报道又增加了面向企业和模型实验室的付费 AI
              Evaluations，服务于委托式测试。这条采购路径明显不同于静态排行榜或聚合基准视图。相邻工具仍有价值：指定证据把 Artificial Analysis 定位为带有成本和延迟背景的更广泛基准视角，把
              Hugging Face Open LLM Leaderboard 定位为面向开源模型的免费静态基准，把 OpenLM.ai
              定位为更轻量的聚合和推理选项。对买方而言，当决策需要外部人类偏好证据、可审计评测工作流或市场信号时，Arena 看起来最强；如果需求是更低成本的基准广度，或不需要托管评测伙伴的开源模型比较，替代方案会更合适。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP009
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP009
              - CP013
              - CP014
      - number: '3.3'
        title: 持久性、定价不透明与竞争风险
        blocks:
          - type: paragraph
            body: >-
              公开规模信号偏向 Arena。保留的 2025—2026 年融资报道称，公司从 $100 million 种子轮、$600 million 估值，走到了 $150 million Series A、$1.7
              billion 估值；付费 AI Evaluations 据报道在上线数月内达到约 $30 million
              年化运行率。融资和商业化领先很重要，因为指定资料中的相邻替代方案都没有展示可比的公开牵引力。风险在于，Arena 的护城河与信任纠缠在一起。公开报道保留了一场 2025 年的中立性争议：外部研究人员指责
              LMArena
              帮助大型实验室优化排行榜名次，而管理层公开反驳了相关批评。定价透明度也很低：公开来源显示有免费基准和按联系报价的企业产品，却没有价目表、折扣或切换成本证据。因此，竞争判断对动能持正面看法，但对持久性仍不完整。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP011
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 领导地位与中立性相互牵连
            body: Arena 的领先地位来自它是前沿实验室参考的记分板；但正因如此，排名完整性问题不仅是声誉风险，也是竞争风险。
            calloutType: risk
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP013
          - type: callout
            title: 竞争格局按工作流划分，而非按模型数量划分
            body: 指定证据表明，买方是在 Arena 的托管式人类偏好工作流与聚合或静态排行榜等轻量替代方案之间做选择；没有证据显示另一家公开供应商同时匹配 Arena 的社区规模和付费评测业务。
            calloutType: insight
            claimRefs:
              - CP005
