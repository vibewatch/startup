              依赖关系图集中在一小批生态参与者周围，程度异常高。公开排行榜需要持续的用户流量和前沿实验室持续参与，商业业务似乎也依赖其中许多实验室作为客户。这形成微妙的平衡：失去模型实验室的信任会伤害收入，而看起来过于接近它们又会削弱吸引其他所有人的公开基准。Sherwood
