chapter:
  number: 3
  title: "Competitors"
  summary: "Arena is the dominant public benchmark and the only retained competitor with explicit enterprise-evaluation traction, but the public comparison set is narrower than it first appears because 'Arena' and 'LMArena' now describe the same company. The strongest substitutes in the assigned evidence are adjacent tools such as OpenLM.ai, Artificial Analysis, Hugging Face Open LLM Leaderboard, and the status quo of internal or vendor-supplied evaluation rather than another scaled managed human-preference workflow."
sections:
  - id: "landscape-and-real-comparison-set"
    title: "Landscape and real comparison set"
    body: "The assigned public evidence suggests buyers are not choosing among three equally mature venture-backed evaluation vendors. The first adjustment is identity: Arena's January 2026 rebrand means many current comparison pages still list LMArena, Arena AI, and Arena as if they were separate entities, even though the official announcement says the company is now Arena. Once that is normalized, the competitive field breaks into one direct leader with both public and enterprise products, a thinner adjacent set of benchmark or aggregation tools, and the status quo of internal or vendor-supplied evaluation. OpenLM.ai appears in the reviewed comparison materials as an adjacent aggregator and inference option rather than a proven managed-evaluation peer. Growth Engineer's alternative set points to Artificial Analysis and Hugging Face Open LLM Leaderboard as substitutes for benchmark discovery, not for Arena's specific combination of large-scale preference data and commissioned human-feedback studies."
    claimRefs: [CP001, CP002, CP011, CP012, CP014]
    tableRefs: [TP001]
  - id: "workflow-differentiation"
    title: "Workflow differentiation and buyer fit"
    body: "Arena's strongest distinction in the assigned pool is workflow, not just brand. Public sources consistently describe the platform as a human-preference ranking system built on anonymous head-to-head comparisons, while 2025-2026 coverage adds a paid AI Evaluations motion for enterprises and model labs that want commissioned testing. That creates a materially different purchase path from static leaderboards or aggregated benchmark views. Adjacent tools still matter: the assigned evidence frames Artificial Analysis as a broader benchmark lens with cost and latency context, Hugging Face Open LLM Leaderboard as a free static benchmark for open-source models, and OpenLM.ai as a lighter-weight aggregation and inference option. For buyers, this means Arena looks strongest when the decision requires external human-preference evidence, auditable evaluation workflows, or market signaling; substitutes look better when the need is cheaper benchmarking breadth or open-source model comparison without a managed evaluation partner."
    claimRefs: [CP003, CP004, CP005, CP011, CP012, CP013, CP015]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: "durability-pricing-and-risk"
    title: "Durability, pricing opacity, and competitive risk"
    body: "Public scale signals favor Arena. The retained 2025-2026 funding coverage says the company moved from a $100 million seed at a $600 million valuation to a $150 million Series A at a $1.7 billion valuation, while paid AI Evaluations reportedly reached a roughly $30 million annualized run rate within months of launch. That funding and commercialization lead is meaningful because none of the adjacent alternatives in the assigned pool show comparable public traction. The risk is that Arena's moat is entangled with trust. Public reporting preserved a 2025 neutrality dispute in which outside researchers accused LMArena of helping major labs optimize for leaderboard standing, while management publicly disputed the criticism. Pricing transparency is also thin: the public sources show a free benchmark and a contact-priced enterprise offer, but not rate cards, discounting, or switching-cost evidence. That leaves the competitive verdict positive on momentum but incomplete on durability."
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP014, CP015]
    tableRefs: [TP003]
