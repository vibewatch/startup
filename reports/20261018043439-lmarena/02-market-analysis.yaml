      topic: market-sizing
      missingEvidence: A third-party market model with category definitions, geography, buyer counts, spend, growth, and methodology for AI evaluation.
      whyItMatters: Without a bounded market model, valuation work can incorrectly count adjacent model, infrastructure, observability, or application spending.
      diligencePath: Obtain analyst category research and management cohort data that isolate paid evaluation revenue by buyer, workflow, and geography.
      relatedQuestionRefs:
        - QM003
        - QM010
      relatedTableRefs:
