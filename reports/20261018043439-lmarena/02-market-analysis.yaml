    - type: private-evidence-only
      severity: material
      topic: budget-owner
      missingEvidence: Actual contract signatories, budget owners, ACV bands, customer mix, renewal rates, and procurement paths for paid evaluations.
      whyItMatters: Functional buyer hypotheses do not establish who controls spend or how quickly public usage converts to durable revenue.
      diligencePath: Request segmented bookings and retention data, then conduct customer calls with economic buyers and hands-on evaluation users.
