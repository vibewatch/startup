    - type: conflicting-data
      severity: material
      topic: benchmark-validity
      missingEvidence: Independent audit evidence on voter quality, sampling, manipulation resistance, confidence intervals, and regulated-use-case validity.
      whyItMatters: Methodology risk can limit willingness to use public rankings as procurement, compliance, or production evidence.
      diligencePath: Commission an independent statistical audit and compare public rankings with buyer-specific offline evaluations and observed production outcomes.
