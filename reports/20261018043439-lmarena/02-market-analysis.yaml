        - 5M+ monthly users and 60M+ monthly conversations
        - Company-attributed platform disclosure
        - Medium
        - Usage is not paid demand or market revenue
      - - Pulse 2.0
        - December 2025
        - Paid labs and enterprises
        - $30M annualized consumption run rate
        - Company-attributed commercial metric
        - Medium
        - Not disclosed as ARR, recognized revenue, margin, or cash
      - - VKTR
        - January 2026 article
        - Organizations using generative AI
        - 65% regularly use generative AI
        - Secondary adoption statistic in market commentary
        - Low
        - Broad adoption backdrop; does not isolate evaluation spend
      - - VKTR
        - January 2026 article
        - Open and proprietary models
        - 400+ assessments and 50M votes
        - Secondary description of platform activity
        - Medium
        - Activity units are not unique paying customers
      - - Financing reports
        - January 2026
        - Private-company financing
        - $150M Series A at $1.7B post-money valuation
        - Reported financing terms
        - Medium
        - Investor pricing is not a market-size estimate
    notes: >-
      These are separate demand and traction lenses, not additive market layers;
      the assigned pool contains no supportable CAGR or formal TAM/SAM/SOM model.
    claimRefs:
      - CM004
      - CM006
      - CM007
      - CM008
      - CM015
      - CM016
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Frontier model labs
        - Model evaluation or research leadership
        - Researchers and release teams
        - Model lab
        - Pre-release comparison and model refinement
        - Not publicly disclosed
        - New model launch or competitive ranking pressure
      - - Enterprises deploying AI
        - AI platform, product, or risk stakeholder
        - Applied-AI and domain teams
        - Enterprise
        - Use-case testing before production
        - Not publicly disclosed
        - Procurement decision or production-readiness review
      - - Regulated industries and agencies
        - Program, governance, or risk stakeholder
        - Analysts and domain reviewers
        - Institution or agency
        - Private arena or mission-specific validation
        - Not publicly disclosed
        - Auditability or compliance requirement
      - - Developers and application teams
        - Engineering or applied-AI lead
        - Engineers
        - Usually no payer on the public surface
        - Model shortlisting and side-by-side comparison
        - Not publicly disclosed
        - Selecting a model for a specific application
      - - Research and public community
        - Research group or individual participant
        - Researchers and volunteer voters
        - Usually no direct payer
        - Benchmarking and preference-data contribution
        - Not applicable or undisclosed
        - Need for current comparative evidence
    notes: >-
      Segment identities are source-supported, while budget ownership remains a
      diligence gap; undisclosed cells must not be read as evidence of a specific
      department or budget.
    claimRefs:
      - CM005
      - CM010
      - CM011
figures:
  - id: FM001
    title: Evidence ladder for addressable evaluation demand
    type: pyramid
    summary: >-
      Separate adoption, activity, supply, and monetization signals narrow from
      broad AI use to LMArena's reported commercial traction.
    data:
      items:
        - label: Enterprise generative-AI backdrop
          value: 65%
          unit: organizations regularly using generative AI
          note: Broad secondary adoption statistic, not evaluation spend.
        - label: Public user reach
          value: 5M+
          unit: monthly users
          note: Company-attributed figure across 150 countries.
        - label: Public evaluation activity
          value: 60M+
          unit: monthly conversations
          note: Activity does not identify unique buyers.
        - label: Evaluated model supply
          value: 400+
          unit: assessments
          note: Secondary report covering open and proprietary models.
        - label: Commercial product
          value: September 2025
          unit: launch timing
          note: Paid evaluation service for labs and enterprises.
        - label: Early monetization
          value: $30M
          unit: annualized consumption run rate
          note: December 2025 rate; not ARR, revenue, cash, or market size.
    approximationNotes: >-
      The layers use different units and populations and therefore are not a
      conversion funnel or additive TAM/SAM/SOM. Ordering is analytical, from
      broad adoption context to the narrowest reported commercial signal.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM010
