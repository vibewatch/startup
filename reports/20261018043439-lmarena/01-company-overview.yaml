figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: The company moved from Berkeley research project to a $1.7 billion Series A in less than three years, with monetization compressed into the 2025-2026 window.
    data:
      items:
        - date: "2023-04"
          label: Chatbot Arena goes live as a Berkeley research project
          detail: Public sources place the product's origin inside the UC Berkeley / LMSYS research context before formal company formation.
          tone: neutral
          claimRefs: [CO001]
        - date: "2023-12"
          label: Grants and sponsorships fund the pre-company project
          detail: RevenueMemo describes grants and sponsorships, including a16z open-source AI grant support, before venture financing.
          tone: positive
          claimRefs: [CO001, CO016]
        - date: "2024-09"
          label: The leaderboard separates onto lmarena.ai
          detail: RevenueMemo marks September 2024 as the point when the leaderboard moved to its own domain and separated from LMSYS.
          tone: neutral
          claimRefs: [CO002]
        - date: "2025-04"
          label: Arena Intelligence Inc. incorporates
          detail: The commercial entity forms in April 2025, creating the bridge from research project to venture-backed company.
          tone: positive
          claimRefs: [CO002]
        - date: "2025-05-21"
          label: $100M seed announced at a reported $600M valuation
          detail: Independent reporting framed the financing as one of the largest AI seed rounds and the first major commercial validation point.
          tone: positive
          claimRefs: [CO004]
        - date: "2025-09"
          label: AI Evaluations commercial product launches
          detail: The paid service became the first clear monetization layer on top of the public arena.
          tone: positive
          claimRefs: [CO003, CO008]
        - date: "2025-12"
          label: Management cites a $30M annualized consumption run rate
          detail: The disclosure showed rapid commercial uptake, but it remained a company-described run-rate metric rather than audited revenue.
          tone: warning
          claimRefs: [CO008]
        - date: "2026-01-06"
          label: Series A closes at $1.7B post-money
          detail: Felicis and UC Investments led a $150M round that brought total disclosed funding to $250M.
          tone: positive
          claimRefs: [CO005, CO006]
        - date: "2026-10"
          label: Refresh evidence still shows unresolved neutrality and disclosure questions
          detail: Public sources continue to support the business momentum story faster than they resolve governance transparency, customer concentration, or benchmark-neutrality concerns.
          tone: risk
          claimRefs: [CO011, CO012, CO013, CO014, CO016]
    approximationNotes: Timeline dates use the explicit month or day disclosed in the reviewed sources; the final refresh item summarizes the state of evidence as of the run date.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO008, CO011, CO012, CO013, CO014, CO016]
callouts:
  - calloutType: insight
    title: The monetization inflection is recent but real
    body: The public arena appears to have become a paid evaluation business only in September 2025, yet the company was already citing a $30 million annualized run rate by December and raised a $1.7 billion Series A one month later.
    claimRefs: [CO003, CO005, CO008]
  - calloutType: risk
    title: Neutrality risk matters as much as product traction
    body: Public evidence names major model labs as both benchmark participants and commercial counterparties, while 2025 criticism about benchmark gaming remains publicly unresolved enough that later chapters should treat neutrality as an active diligence question.
    claimRefs: [CO012, CO013, CO014, CO016]
