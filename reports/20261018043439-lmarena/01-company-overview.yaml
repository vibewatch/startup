company:
  name: LMArena
chapter:
  number: 1
  title: Company Overview
  summary: >-
    LMArena has scaled from a 2023 UC Berkeley research project into a Series A
    company that public sources consistently place at $250 million raised and a
    $1.7 billion January 2026 valuation. The stronger evidence is around
    financing, product launch cadence, and user-scale claims; governance,
    shareholder rights, and customer concentration remain materially less
    transparent.
sections:
  - id: identity-and-business-model
    title: Identity, stage, and business model
    body: >-
      LMArena still reads as a Berkeley-born evaluation business that
      commercialized unusually quickly. Independent reporting and investor
      materials agree that the product originated as Chatbot Arena, a UC
      Berkeley research effort, before Arena Intelligence Inc. incorporated in
      April 2025 and layered a paid evaluation product onto the public
      leaderboard. The operating model is now two-sided: a free crowdsourced
      arena that generates preference data and distribution, plus paid
      evaluation work for model labs and enterprises. That combination is the
      core reason the company could move from seed to a $1.7 billion Series A
      inside eight months, but the scale metrics in circulation remain mostly
      company-supplied rather than independently audited.
    claimRefs: [CO001, CO002, CO003, CO005, CO006, CO007, CO008, CO015]
    tableRefs: [TO001]
  - id: leadership-governance-and-dependence
    title: Leadership, governance, and key-person dependence
    body: >-
      The named leadership bench is still concentrated around the founding
      researchers and Berkeley-linked backers. Public sources consistently
      identify Anastasios Angelopoulos and Wei-Lin Chiang as the operating
      cofounders, while Ion Stoica remains part of the founding story and
      broader credibility scaffold. The same record is much thinner on formal
      governance: the assigned pool surfaces a16z's disclosure that partner
      Anjney Midha sits on LMArena's board, but it does not produce a full
      board roster, voting-rights detail, or liquidation-preference terms. That
      matters because the company sells evaluation services to some of the same
      frontier labs whose models it ranks, leaving both commercial
      concentration and neutrality assurance dependent on a small founder-led
      team plus governance that is only partially visible.
    claimRefs: [CO009, CO010, CO011, CO014, CO015, CO016]
    tableRefs: [TO002, TO003]
  - id: capitalization-milestones-and-trust
    title: Capitalization, milestones, and unresolved trust questions
    body: >-
      The milestone sequence is unusually compressed. LMArena moved from a
      grant-supported academic project to a $100 million seed in May 2025,
      launched AI Evaluations in September 2025, reported a $30 million
      annualized consumption run rate by December, and then announced a $150
      million Series A at a $1.7 billion post-money valuation in January 2026.
      That pace supports the view that model evaluation became a fundable
      infrastructure layer, but it also coincides with unresolved controversy
      over whether top labs can influence or game benchmark outcomes. The right
      takeaway for later chapters is not that the criticism disproves the
      business, but that the valuation and strategic positioning rely on trust
      in methodological neutrality that has not been independently settled in
      the reviewed evidence base.
    claimRefs: [CO004, CO005, CO006, CO008, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
