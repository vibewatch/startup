    title: "Recommendation summary table"
    columns: ["Dimension", "Assessment", "Basis"]
    rows:
      - ["Recommendation", "track", "Rapid commercialization is real, but the disclosed price already discounts substantial future success."]
      - ["Confidence", "medium", "Funding, launch timing, and run-rate signals are public, but core unit economics and governance terms are still opaque."]
      - ["Risk rating", "high", "Neutrality, customer-quality, and financing-term uncertainty could matter more than topline momentum at this valuation."]
      - ["Valuation stance", "stretched", "The $1.7B post-money price against a disclosed $30M run-rate implies an entry multiple around 57x before other adjustments."]
      - ["Decision implication", "Wait for new proof or a better entry setup", "An upgrade needs deeper disclosure on concentration, retention, margins, and downside-protection terms."]
    notes: "Assessment uses only the assigned 2025-2026 financing and commercialization evidence; no full peer-comp set is available in this chapter pool."
    claimRefs: ["CV001", "CV005", "CV014", "CV015"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Side", "Argument", "What would change the view"]
    rows:
      - ["Thesis", "LMArena has translated community scale into a paid product and reached $30M annualized run rate within months of launch.", "An independent customer-quality readout showing durable enterprise expansion would strengthen this view."]
      - ["Thesis", "The company has raised $250M quickly and attracted brand-name investors, implying strong market belief in evaluation infrastructure.", "A slower next round or insider-only financing would weaken the external validation signal."]
      - ["Anti-thesis", "The valuation expanded from $600M to $1.7B faster than public operating disclosure expanded, leaving little visible margin of safety.", "Additional disclosure on gross margin, retention, and concentration could justify a premium multiple."]
      - ["Anti-thesis", "Neutrality is commercially essential but still contested, and public evidence does not resolve governance or preference-stack overhang.", "A third-party methodology audit plus financing documents that clarify investor rights would reduce this concern."]
    notes: "Arguments summarize source-backed positives and negatives; changes-in-view are diligence conditions, not forecast guarantees."
    claimRefs: ["CV003", "CV005", "CV008", "CV010", "CV012", "CV013"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Enterprise evaluations scale beyond the disclosed $30M run rate, neutrality holds under commercial pressure, and regulated-industry deployments broaden demand.", "Value can move materially above the current $1.7B mark if revenue quality improves fast enough to defend today's premium multiple.", "Execution strain, benchmark-politics backlash, or slower conversion of usage into paid contracts.", "Needs fresh proof on retention, customer breadth, and independent trust."]
      - ["Base", "Commercial traction continues, but public disclosure remains partial and valuation multiples normalize as the category matures.", "The business may grow into the current price, but upside from a new entry is limited around the present mark without a better setup.", "Multiple compression or mediocre customer quality offsets operating progress.", "Most consistent with the current evidence set."]
      - ["Bear", "Neutrality disputes, customer concentration, or financing-term asymmetry undermine willingness to pay the current premium.", "A future round could price materially below the current post-money and move closer to the prior-round anchor than to new premium marks.", "Down-round risk, governance friction, or loss of enterprise trust.", "Becomes likelier if diligence cannot close the current disclosure gaps."]
    notes: "Scenario logic is directional rather than model-grade because the assigned pool does not disclose margins, retention, full customer concentration, or detailed financing terms."
    claimRefs: ["CV001", "CV005", "CV009", "CV010", "CV011", "CV012", "CV013", "CV014", "CV015"]
