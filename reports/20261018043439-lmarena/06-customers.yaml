company:
  name: "LMArena"
chapter:
  number: 6
  title: "Customers"
  summary: "LMArena has strong public-adoption proof and credible evidence that frontier AI labs and enterprises pay for evaluation services, but the customer base remains publicly concentrated in AI labs and lacks disclosed retention, renewal, and expansion metrics. Independent critiques also raise neutrality and representativeness questions that matter because the company's paid product is built on trust in the same evaluation network."
sections:
  - id: "customer-base"
    title: "The customer base splits between a massive public user community and a much narrower paid buyer set"
    body: >
      Public usage is the clearest proof of adoption. Multiple 2026 sources put LMArena above 5 million monthly users across 150 countries and above 60 million monthly conversations, while independent summaries also describe more than 50 million votes across more than 400 models. That scale matters because the public arena is not just a free marketing surface; it is the data-generating top of funnel that makes the benchmark useful to model providers and enterprises deciding which systems perform best in live use. At the same time, paid demand appears concentrated in AI labs and evaluation-heavy enterprises rather than a broad disclosed customer roster. Public materials repeatedly name model providers such as OpenAI, Google, xAI, Anthropic, and Meta, but they do not provide a comparable set of named production customers outside the AI-lab segment.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU007", "CU009"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-and-commercialization"
    title: "Commercialization was rapid, but public evidence is stronger on activity than on durable account economics"
    body: >
      The reported commercialization curve is unusually fast. January 2026 coverage says LMArena launched commercial products in September 2025 and crossed a $30 million annualized revenue run rate by December, less than four months later, while VKTR separately says the community grew more than 25x over the prior year. That points to real willingness to pay for evaluation infrastructure, especially among labs and technically sophisticated buyers. However, the evidence base is still thin on durable customer economics: the same sources do not disclose contract length, renewal rates, GRR, NRR, churn, or segment revenue mix. An additional caution is that an August 2026 tear sheet conflicts with the January 2026 chronology by dating the commercial AI Evaluations launch to September 2024 and the $30M+ run rate to December 2024, so public timeline analysis should be treated as directionally positive but not precise.
    claimRefs: ["CU005", "CU006", "CU008", "CU015", "CU016"]
    tableRefs: ["TU002"]
  - id: "durability-and-concentration-risks"
    title: "Durability hinges on trust, while concentration and representativeness remain unresolved"
    body: >
      The biggest customer risk is not demand creation but trust durability. The public record suggests LMArena's most visible and best-evidenced buyers are the same frontier AI labs whose models dominate benchmark attention, which raises concentration risk even before any account-level numbers are disclosed. Independent criticism sharpens that issue: encyclopedia-style synthesis and enterprise-tech coverage both point to allegations that large labs benefited from private pre-release testing and to research showing the arena can be manipulated with relatively small numbers of votes. Additional criticism says the user base skews toward English-speaking tech enthusiasts and general chat prompts, which may not map cleanly onto specialized enterprise workflows. If those concerns weaken neutrality or enterprise relevance, they could limit expansion beyond current lab-centric demand.
    claimRefs: ["CU007", "CU009", "CU010", "CU011", "CU012", "CU013"]
    tableRefs: ["TU003"]
