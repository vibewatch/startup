    title: "Real adoption exists"
    body: "The strongest customer proof is not logos but usage density: millions of monthly users, tens of millions of conversations, and enough benchmark traffic that leading AI labs reportedly pay for deeper evaluation products."
    claimRefs: ["CU001", "CU002", "CU003", "CU005", "CU007"]
  - calloutType: "risk"
    title: "Trust and concentration are the real customer risks"
    body: "Public evidence points to a buyer base centered on frontier AI labs, while retention, renewals, and concentration are undisclosed and independent critiques question whether the benchmark can stay neutral and enterprise-representative at scale."
    claimRefs: ["CU007", "CU010", "CU011", "CU012", "CU016"]
