        manipulation risk after mitigations.
      whyItMatters: >-
        If neutrality is the moat, unresolved integrity risk can directly impair
        customer trust, model-launch signaling value, and long-term pricing power.
      diligencePath: >-
        Ask for third-party audit work, manipulation-detection metrics, sampling
        policy details, and change logs showing what governance controls were
        added after the 2025 criticism cycle.
      relatedQuestionRefs:
