  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The customer base splits between a massive public user community and a much narrower paid buyer set
        blocks:
          - type: paragraph
            body: >
              Public usage is the clearest proof of adoption. Multiple 2026 sources put LMArena above 5 million monthly
              users across 150 countries and above 60 million monthly conversations, while independent summaries also
              describe more than 50 million votes across more than 400 models. That scale matters because the public
              arena is not just a free marketing surface; it is the data-generating top of funnel that makes the
              benchmark useful to model providers and enterprises deciding which systems perform best in live use. At
              the same time, paid demand appears concentrated in AI labs and evaluation-heavy enterprises rather than a
              broad disclosed customer roster. Public materials repeatedly name model providers such as OpenAI, Google,
              xAI, Anthropic, and Meta, but they do not provide a comparable set of named production customers outside
              the AI-lab segment.
