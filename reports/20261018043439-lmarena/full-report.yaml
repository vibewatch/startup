      - number: '4.3'
        title: Underwriting view and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, LMArena looks more like a trust-layer infrastructure company than a conventional SaaS
              business with transparent seat pricing. That framing helps explain both the capital raised and the
              valuation step-up, but it also means neutrality is part of the product, not a side issue. External
              reporting shows the benchmark position is already contested, with allegations that major labs benefited
              from the platform's operating model; even if management disputes those claims, any perceived loss of
              neutrality would threaten the credibility that supports paid evaluations. The public record is therefore
              strong enough to support a demand story, but not a clean underwriting case. Until diligence gets customer
              concentration, realized pricing, gross margin, compute costs, burn, and cash runway, the right financial
              verdict is promising commercialization with material revenue-quality and capital-adequacy blind spots.
            claimRefs:
