  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public sources support a layered architecture that starts with blind user comparisons, translates them into
      ranking outputs, and reuses that engine in both public arenas and paid evaluations.
    data:
      layers:
        - label: Community input layer
          detail: Blind prompt capture and user voting create the raw preference stream.
          modules:
            - Blind prompt submission
            - Side-by-side model responses
          outputs:
            - Human preference votes
        - label: Sampling and matchup layer
          detail: The platform decides which model pairings and comparison flows feed the leaderboard.
          modules:
            - Anonymous model pairing
            - Tie / both-bad vote paths
          outputs:
            - Pairwise comparison dataset
        - label: Ranking and control layer
          detail: Statistical scoring converts pairwise outcomes into public model ranks.
          modules:
            - Bradley-Terry or Elo-like score computation
            - Confidence intervals and re-weighting / style control
          outputs:
            - Arena Score / leaderboard placements
        - label: Public product surface layer
          detail: The same evaluation engine is exposed through task-specific product surfaces.
          modules:
            - Public leaderboards
            - Specialized arenas
          outputs:
            - Text, search, code, vision, and media evaluations
        - label: Enterprise evaluation layer
          detail: Paid assessments package the same ranking machinery for buyer and lab workflows.
          modules:
            - AI Evaluations for labs and enterprises
            - Production-oriented model testing
          outputs:
            - Paid evaluation reports and procurement input
        - label: Open tooling and evidence layer
          detail: Public tooling and data assets reinforce the platform's technical credibility.
          modules:
            - FastChat and Arena-Rank
            - Arena-Hard and public datasets
            - RouteLLM and related supporting assets
          outputs:
            - Reusable research and benchmarking artifacts
    approximationNotes: >-
      This is a logical product stack distilled from public descriptions; the assigned pool does not expose internal
      infra topology, hosting, or data pipeline ownership.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Community-scale usage feeds benchmark credibility, which then converts primarily into lab and enterprise
      evaluation demand, but the final expansion loop is constrained by missing durability metrics and neutrality
      concerns.
    data:
      items:
        - label: Public blind battles
          actor: Community users
          touchpoints:
            - 5M+ monthly users across 150 countries
            - 60M+ monthly conversations
            - 50M+ votes comparing 400+ models
          tone: positive
        - label: Leaderboard signal
          actor: Developers and model-watchers
          touchpoints:
            - Anonymous side-by-side voting creates a visible public scorecard
            - Benchmark outcomes matter because the industry lacks accepted independent standards
          tone: neutral
        - label: Lab benchmarking demand
          actor: OpenAI, Google, xAI, Anthropic, Meta
          touchpoints:
            - Named labs use the platform for public benchmarking and private testing
            - Public sources suggest these are the clearest paid or strategic relationships
          tone: positive
        - label: Enterprise private evaluations
          actor: Enterprise AI teams
          touchpoints:
            - Private arenas, analytics dashboards, and API access support domain-specific evaluation
            - Targeted verticals include software engineering, law, medicine, and scientific research
          tone: neutral
        - label: Pilot diversification
          actor: Government agencies and regulated industries
          touchpoints:
            - Pilots are mentioned as beginning
            - No named production deployments or public outcomes are disclosed
          tone: risk
        - label: Expansion checkpoint
          actor: Finance and buyer leadership
          touchpoints:
            - $30M annualized run rate suggests willingness to pay
            - No public NRR, churn, contract length, or top-customer share
            - Neutrality and vote-manipulation critiques could slow broader enterprise trust
          tone: risk
