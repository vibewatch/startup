      - number: '5.3'
        title: Product maturity is real, but trust and controls remain the main technical risk
        blocks:
          - type: paragraph
            body: >-
              Usage and funding coverage suggest the product has reached meaningful scale, with public reports citing
              more than five million monthly users, global usage across 150 countries, and tens of millions of monthly
              conversations or votes. That scale is itself part of the differentiation, because LMArena's value
              proposition depends on continuous live preference data. But the same evidence also frames the chapter's
              central risk: neutrality and data handling are core product attributes, yet public reporting still centers
              on benchmark-gaming allegations, coordinated-vote manipulation risk, and prompt-sharing disclosures rather
              than auditable security, SLA, or compliance artifacts. In other words, the public product story is strong,
              while the public control surface is still thin.
