  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and real comparison set
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence suggests buyers are not choosing among three equally mature venture-backed
              evaluation vendors. The first adjustment is identity: Arena's January 2026 rebrand means many current
              comparison pages still list LMArena, Arena AI, and Arena as if they were separate entities, even though
              the official announcement says the company is now Arena. Once that is normalized, the competitive field
              breaks into one direct leader with both public and enterprise products, a thinner adjacent set of
              benchmark or aggregation tools, and the status quo of internal or vendor-supplied evaluation. OpenLM.ai
              appears in the reviewed comparison materials as an adjacent aggregator and inference option rather than a
              proven managed-evaluation peer. Growth Engineer's alternative set points to Artificial Analysis and
              Hugging Face Open LLM Leaderboard as substitutes for benchmark discovery, not for Arena's specific
              combination of large-scale preference data and commissioned human-feedback studies.
