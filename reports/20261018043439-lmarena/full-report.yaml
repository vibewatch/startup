      - number: '1.3'
        title: Capitalization, milestones, and unresolved trust questions
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence is unusually compressed. LMArena moved from a grant-supported academic project to a
              $100 million seed in May 2025, launched AI Evaluations in September 2025, reported a $30 million
              annualized consumption run rate by December, and then announced a $150 million Series A at a $1.7 billion
              post-money valuation in January 2026. That pace supports the view that model evaluation became a fundable
              infrastructure layer, but it also coincides with unresolved controversy over whether top labs can
              influence or game benchmark outcomes. The right takeaway for later chapters is not that the criticism
              disproves the business, but that the valuation and strategic positioning rely on trust in methodological
              neutrality that has not been independently settled in the reviewed evidence base.
