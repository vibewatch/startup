  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Blind human preference is the core product, not a wrapper around static benchmarks
        blocks:
          - type: paragraph
            body: >-
              Public descriptions are consistent that LMArena's core workflow is a live, anonymous side-by-side
              comparison between model outputs, with user votes fed into a Bradley-Terry or Elo-like ranking system
              rather than a fixed benchmark set. That design matters for customer workflow fit: it lets labs,
              developers, and enterprise buyers test frontier models against fresh user prompts instead of relying only
              on static academic suites. The same sources also show that LMArena has already expanded the core arena
              into multiple task-specific surfaces, including vision, web-development, search, repository/code, and
              media-generation arenas, so the product has become a family of evaluation fronts rather than one text-only
              leaderboard.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE014
