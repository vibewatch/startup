      - number: '6.2'
        title: Commercialization was rapid, but public evidence is stronger on activity than on durable account economics
        blocks:
          - type: paragraph
            body: >
              The reported commercialization curve is unusually fast. January 2026 coverage says LMArena launched
              commercial products in September 2025 and crossed a $30 million annualized revenue run rate by December,
              less than four months later, while VKTR separately says the community grew more than 25x over the prior
              year. That points to real willingness to pay for evaluation infrastructure, especially among labs and
              technically sophisticated buyers. However, the evidence base is still thin on durable customer economics:
              the same sources do not disclose contract length, renewal rates, GRR, NRR, churn, or segment revenue mix.
              An additional caution is that an August 2026 tear sheet conflicts with the January 2026 chronology by
              dating the commercial AI Evaluations launch to September 2024 and the $30M+ run rate to December 2024, so
              public timeline analysis should be treated as directionally positive but not precise.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU015
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
