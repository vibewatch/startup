  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Trust-related risks still dominate the residual exposure stack.
    data:
      columns:
        - label: Likelihood
          note: Probability that the issue harms trust or commercial conversion in the next 12 months.
        - label: Impact
          note: Effect on benchmark credibility, enterprise conversion, or financing leverage.
        - label: Residual exposure
          note: Net risk after the mitigations publicly described in the assigned pool.
      rows:
        - label: Neutrality / customer overlap
          note: Major labs appear as both customers and benchmark participants.
          values:
            - text: High
              tone: high
              note: Revenue relationships and public ranking authority overlap.
            - text: Critical
              tone: critical
              note: Any pay-to-play perception would hit the core value proposition.
            - text: High
              tone: high
              note: Open methods help, but no independent neutrality audit appears in the pool.
        - label: Benchmark manipulation / methodological bias
          note: Independent critics cite gaming, vote rigging, and style bias.
          values:
            - text: High
              tone: high
              note: Multiple sources document active criticism rather than a resolved debate.
            - text: Critical
              tone: critical
              note: Integrity concerns could reduce benchmark acceptance across labs and buyers.
            - text: High
              tone: high
              note: Existing defenses are described as only partially effective.
        - label: Regulated-enterprise proof / compliance
          note: Public evidence shows pilots, not audited production adoption.
          values:
            - text: Medium
              tone: medium
              note: Demand is visible, but the evidence base is still thin.
            - text: High
              tone: high
              note: Missing proof could delay the highest-value verticals.
            - text: High
              tone: high
              note: No certification or named deployment proof appears in the assigned pool.
        - label: Monetization / governance opacity
          note: Revenue traction is early relative to valuation and governance disclosure remains private.
          values:
            - text: Medium
              tone: medium
              note: The company moved from spinout to strong run-rate quickly.
            - text: High
              tone: high
              note: Limited disclosure constrains downside analysis at a premium price.
            - text: Medium-High
              tone: high
              note: Core diligence still depends on non-public customer and governance materials.
        - label: Community traffic dependence
          note: Public benchmark relevance depends on continued user prompts and voting volume.
          values:
            - text: Medium
              tone: medium
              note: The platform is large today, but engagement metrics are still company-stated.
            - text: High
              tone: high
              note: Falling traffic would weaken the freshness and legitimacy of rankings.
            - text: Medium-High
              tone: high
              note: The network effect is valuable, but not yet independently audited.
        - label: Investor / board alignment optics
          note: A lead investor also discloses a board role, increasing the need for explicit independence controls.
          values:
            - text: Medium
              tone: medium
              note: Board and investor overlap is normal, but high-profile here.
            - text: Medium-High
              tone: high
              note: Poorly governed conflicts could undermine trust with buyers or labs.
            - text: Medium-High
              tone: high
              note: Public disclosures do not yet show the operating guardrails.
    claimRefs:
      - CR003
      - CR006
      - CR010
      - CR012
      - CR015
      - CR016
