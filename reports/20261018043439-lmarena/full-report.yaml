        title: The commercial stack layers public arenas, open tooling, and paid evaluations
        blocks:
          - type: paragraph
            body: >-
              The assigned sources describe a stack with three visible layers. First, LMArena runs the public arenas and
              leaderboards that generate the vote and conversation flow. Second, it publishes enabling assets such as
              FastChat, Arena-Rank, public datasets, and related benchmark packages that reinforce technical credibility
              and make the methodology easier to inspect. Third, it sells AI Evaluations to labs and enterprises,
              turning the same community-evaluation engine into a paid workflow for prelaunch model testing and
              production-model selection. Public metrics imply the platform is no longer pre-revenue experimentation:
              multiple sources tie the paid product's September 2025 launch to a reported $30 million annualized run
              rate by December 2025.
