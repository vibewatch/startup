        title: Durability, pricing opacity, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Public scale signals favor Arena. The retained 2025-2026 funding coverage says the company moved from a
              $100 million seed at a $600 million valuation to a $150 million Series A at a $1.7 billion valuation,
