  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary is third-party AI model evaluation rather than model training, inference,
              hosting, or application development. LMArena's public product uses blind pairwise comparisons to turn
              human preferences into relative rankings, while the commercial layer sells evaluation services to model
              labs and enterprises. Specialized arenas for coding, vision, web development, search, and related tasks
              broaden the evaluation workflow without making the company a general AI platform. Static academic
              benchmarks, vendor-authored launch claims, and internal evaluation sets are the closest status-quo
              substitutes. They compete for the same decision role—determining whether a model is fit for a task—but do
              not provide the same continuously refreshed external preference signal.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
