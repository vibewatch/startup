      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence supports three principal participant groups. Frontier model labs use evaluation before or
              around model releases and are explicit customers of paid services. Enterprises use evaluation to compare
              systems before production deployment, especially in economically valuable or regulated workflows.
              Developers and researchers use the public leaderboard as a free discovery and shortlisting surface, but
              the pool does not show that they are meaningful direct payers. Likely budget ownership sits with
              model-development, AI-platform, product, risk, or governance functions, yet no assigned source identifies
              actual signatories or budget lines. Adoption therefore starts with public comparison, becomes
              use-case-specific testing, and can progress to private evaluation when procurement, launch, or compliance
              stakes justify paid external evidence.
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM010
              - CM011
      - number: '2.4'
        title: Drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by model proliferation, rapid enterprise adoption, and dissatisfaction with static or
              vendor-controlled benchmarks. External evaluation is valuable because new prompts and independent users
              can reveal preference differences that fixed test sets miss. The same design creates constraints:
              volunteer-voter composition may not match a buyer's production population, presentation style can
              influence preference, and public rankings do not directly measure cost, safety, factuality, or a regulated
              workflow's failure tolerance. Trending Topics reports broader benchmark-validity criticism and a separate
              500-vote analysis that disputed many user choices. These findings do not prove that LMArena lacks value;
              they imply that procurement-grade adoption requires category- specific, private, and independently audited
              evaluation alongside the public leaderboard.
            claimRefs:
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size remains an evidence gap
            body: >-
              Platform activity and a $30 million annualized consumption run rate show demand, but neither can be
              converted into TAM, SAM, or SOM without buyer counts, contract values, retention, category spend, and an
              explicit market boundary.
            calloutType: insight
            claimRefs:
              - CM004
              - CM006
              - CM016
          - type: callout
            title: Public preference is not procurement proof
            body: >-
              The public leaderboard is best treated as a shortlist signal. Buyers still need task-specific evidence
              covering factuality, safety, cost, latency, population fit, and confidence intervals.
            calloutType: risk
            claimRefs:
