              helping major labs optimize for leaderboard standing, while management publicly disputed the criticism.
              Pricing transparency is also thin: the public sources show a free benchmark and a contact-priced
              enterprise offer, but not rate cards, discounting, or switching-cost evidence. That leaves the competitive
