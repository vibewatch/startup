      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              None of the assigned sources supplies a third-party market model that isolates spending on AI evaluation,
              so a numerical TAM, SAM, or SOM would be fabricated. The usable lenses are platform reach, evaluation
              activity, model supply, commercial traction, and broader enterprise AI adoption. Company-attributed
              figures reported by Pulse 2.0 put the platform above 5 million monthly users across 150 countries and 60
              million monthly conversations. The same article says the paid product reached a $30 million annualized
              consumption run rate in December 2025, less than four months after launch. That metric is not ARR,
              recognized revenue, cash, or market size. Funding and valuation show investor appetite for evaluation
              infrastructure but likewise do not measure customer spending.
