chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              LMArena still reads as a Berkeley-born evaluation business that commercialized unusually quickly.
              Independent reporting and investor materials agree that the product originated as Chatbot Arena, a UC
              Berkeley research effort, before Arena Intelligence Inc. incorporated in April 2025 and layered a paid
              evaluation product onto the public leaderboard. The operating model is now two-sided: a free crowdsourced
              arena that generates preference data and distribution, plus paid evaluation work for model labs and
              enterprises. That combination is the core reason the company could move from seed to a $1.7 billion Series
              A inside eight months, but the scale metrics in circulation remain mostly company-supplied rather than
              independently audited.
