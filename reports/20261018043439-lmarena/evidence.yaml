evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-and-cap-table-disclosure
    missingEvidence: >-
      Board roster, investor-rights terms, founder ownership, and liquidation preferences from charter, financing
      documents, or management materials.
    whyItMatters: >-
      Without governance and control detail, the chapter can describe the financing but cannot judge whether investors
      or founders can preserve neutrality under commercial pressure.
    diligencePath: >-
      Request the cap table, board observer list, financing docs, and any shareholder-rights summary during management
      Q&A.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-concentration
    missingEvidence: >-
      Customer count, top-customer concentration, NRR, pricing architecture, and gross-margin/computing-cost detail for
      AI Evaluations.
    whyItMatters: >-
      The current valuation depends partly on paid-evaluation durability, yet public sources do not show how
      concentrated or profitable the revenue base is.
    diligencePath: >-
      Request cohort revenue data, top-customer share, contract mix by lab versus enterprise, and compute-cost
      disclosures.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: neutrality-audit
    missingEvidence: >-
      An independent methodological audit or published third-party analysis that resolves whether commercial
      relationships materially bias benchmark outcomes.
    whyItMatters: >-
      Trust in neutrality is core to both the brand and the premium valuation, so unresolved criticism can affect
      enterprise adoption and investor confidence.
    diligencePath: >-
      Ask management for external audits, governance controls around model-submission fairness, and any counter-evidence
      to the 2025 benchmark-gaming criticism.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A third-party market model with category definitions, geography, buyer counts, spend, growth, and methodology for
      AI evaluation.
    whyItMatters: >-
      Without a bounded market model, valuation work can incorrectly count adjacent model, infrastructure,
      observability, or application spending.
    diligencePath: >-
      Obtain analyst category research and management cohort data that isolate paid evaluation revenue by buyer,
      workflow, and geography.
    relatedQuestionRefs:
      - QM003
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner
    missingEvidence: >-
      Actual contract signatories, budget owners, ACV bands, customer mix, renewal rates, and procurement paths for paid
      evaluations.
    whyItMatters: >-
      Functional buyer hypotheses do not establish who controls spend or how quickly public usage converts to durable
      revenue.
    diligencePath: >-
      Request segmented bookings and retention data, then conduct customer calls with economic buyers and hands-on
      evaluation users.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: benchmark-validity
    missingEvidence: >-
      Independent audit evidence on voter quality, sampling, manipulation resistance, confidence intervals, and
      regulated-use-case validity.
    whyItMatters: Methodology risk can limit willingness to use public rankings as procurement, compliance, or production evidence.
    diligencePath: >-
      Commission an independent statistical audit and compare public rankings with buyer-specific offline evaluations
      and observed production outcomes.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Reference customers or contract exhibits quantifying switching costs, model-routing integration effort, and
      multi-homing behavior across evaluation vendors.
    whyItMatters: >-
      Moat durability depends on whether enterprises can dual-home or replace Arena after evaluation workflows are
      configured.
    diligencePath: Request customer interviews, implementation plans, and redlined statements of work for AI Evaluations deployments.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Actual AI Evaluations rate cards, discounting, minimum commitments, and renewal economics.
    whyItMatters: >-
      Without realized pricing, public free-tier visibility says little about monetization quality or price-based
      switching risk.
    diligencePath: Request sample proposals, customer invoices, and pricing exception logs from management.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: minor
    topic: adjacent-competitor-proof
    missingEvidence: >-
      Independent customer references or procurement records for OpenLM.ai, Artificial Analysis, or HF Open LLM
      Leaderboard as production evaluation vendors.
    whyItMatters: >-
      Public alternative descriptions establish product shape, but not whether any of these substitutes reliably win
      against Arena in paid enterprise workflows.
    diligencePath: Collect customer case studies, procurement records, or credible user interviews for named alternatives.
    relatedQuestionRefs:
      - QP001
      - QP003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public price cards, contract minimums, discount ranges, and realized pricing by buyer type.
    whyItMatters: >-
      Without price realization, the run-rate signal cannot be translated into revenue quality or gross-profit
      potential.
    diligencePath: Request current pricing sheets, sample MSAs / SOWs, and realized ASP by lab versus enterprise cohort.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, compute cost per evaluation, CAC, payback, and contribution margin by product line.
    whyItMatters: These inputs determine whether trust-layer revenue scales efficiently or simply converts capital into usage.
    diligencePath: Review finance model outputs, cloud / inference bills, and cohort-level sales-efficiency reporting.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt obligations, and base-case runway.
    whyItMatters: >-
      Funding raised is not the same as cash remaining, so capital sufficiency cannot be underwritten from the public
      record.
    diligencePath: Request monthly cash bridge, board package liquidity view, and any credit or vendor financing agreements.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share, number of paying labs and enterprises, and net revenue retention.
    whyItMatters: A small set of frontier labs could explain fast early run-rate growth but also make the business fragile.
    diligencePath: Review customer-level ARR / consumption data, renewal cohorts, and concentration thresholds in board reporting.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: security-and-compliance-controls
    missingEvidence: >-
      No assigned source discloses security certifications, uptime history, status-page evidence, retention windows, or
      enterprise data-processing controls for public or paid workflows.
    whyItMatters: >-
      Trust and neutrality are the product, so missing operational controls make it hard to underwrite enterprise
      adoption in regulated workloads.
    diligencePath: >-
      Request SOC 2 or equivalent audit reports, DPA / privacy documentation, uptime history, and internal
      incident-response summaries for both public arena traffic and AI Evaluations customers.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: enterprise-integration-architecture
    missingEvidence: >-
      The assigned pool does not include API docs, deployment architecture, customer integration patterns, or support /
      SLA terms for AI Evaluations.
    whyItMatters: >-
      Commercial maturity cannot be separated from implementation friction, security review burden, and deployment model
      when the buyer is a lab or enterprise team.
    diligencePath: >-
      Obtain product documentation for enterprise onboarding, data flow, supported integrations, support commitments,
      and pricing / packaging.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: conflicting-data
    severity: material
    topic: benchmark-integrity-audit
    missingEvidence: >-
      The assigned pool contains benchmark-gaming allegations and company denials but no independent post-criticism
      audit quantifying residual manipulation risk after mitigations.
    whyItMatters: >-
      If neutrality is the moat, unresolved integrity risk can directly impair customer trust, model-launch signaling
      value, and long-term pricing power.
    diligencePath: >-
      Ask for third-party audit work, manipulation-detection metrics, sampling policy details, and change logs showing
      what governance controls were added after the 2025 criticism cycle.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, contract duration, and cohort retention by paying segment.
    whyItMatters: >-
      Without durability metrics, rapid run-rate growth could still reflect one-off evaluation budgets or launch-driven
      demand rather than sticky recurring usage.
    diligencePath: Request cohort retention, renewal, and contract-length data segmented by model labs versus enterprise adopters.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-enterprise-proof
    missingEvidence: >-
      Named production customers outside frontier AI labs, with deployment scope, outcomes, and whether the relationship
      is public benchmarking, private testing, or recurring enterprise software.
    whyItMatters: >-
      The current named-customer proof is concentrated in AI labs, so diversification and cross-vertical relevance
      remain unproven.
    diligencePath: >-
      Obtain customer references or case studies for non-lab enterprise and regulated-industry accounts, including
      deployment stage and business impact.
