            - text: Medium-High
              tone: high
              note: Poorly governed conflicts could undermine trust with buyers or labs.
            - text: Medium-High
              tone: high
              note: Public disclosures do not yet show the operating guardrails.
    claimRefs: [CR003, CR006, CR010, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Neutrality under commercialization is the decisive risk
    body: >-
      The model-lab customer base powers LMArena's growth, but it also means any perceived
      favoritism can directly damage the benchmark whose credibility makes the business
      valuable in the first place.
    claimRefs: [CR002, CR003, CR004, CR006]
  - calloutType: recommendation
    title: Do not underwrite regulated-enterprise upside without third-party proof
    body: >-
      Investor and company narratives establish demand, but not yet audited production
      evidence. Require named deployments, compliance artifacts, and customer references
      before giving regulated-industry expansion credit in valuation.
    claimRefs: [CR012, CR013, CR016]
