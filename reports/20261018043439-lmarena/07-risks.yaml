  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulated-readiness
      missingEvidence: Named regulated-industry production deployments, customer references, and compliance artifacts such as audit or certification evidence.
      whyItMatters: Without third-party proof, regulated-vertical upside remains a narrative rather than a validated moat.
      diligencePath: Request named pilot-to-production case studies, security/compliance documentation, and customer renewal data for regulated accounts.
    - type: private-evidence-only
      severity: material
      topic: governance-opacity
      missingEvidence: Board composition, liquidation preferences, investor rights, and any formal independence policy governing benchmark participants that are also customers.
      whyItMatters: Governance terms determine how much real protection exists against commercial pressure on public rankings.
      diligencePath: Review board materials, financing documents, and any conflict-management or information-barrier policy before underwriting neutrality.
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Customer concentration, renewal, and net revenue retention data for model-lab and enterprise accounts.
      whyItMatters: The dependency risk cannot be sized from named-customer anecdotes or top-line run-rate alone.
      diligencePath: Obtain cohort retention, top-account revenue share, and logo-to-revenue mapping by customer type.
    - type: missing-source
      severity: minor
      topic: legal-clearance
      missingEvidence: Direct regulator, court, privacy, or procurement records that would confirm whether any unresolved legal or sector-specific obligations apply to private arenas.
      whyItMatters: The assigned pool is strong on commercialization and criticism, but weak on direct legal clearance evidence.
      diligencePath: Run targeted court, regulator, procurement, and certification checks before treating legal risk as cleared.
      relatedTableRefs: [TR001]
