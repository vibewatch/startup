chapter:
  number: 3
  title: Competitors
  summary: Obsidian competes at the intersection of SaaS security and AI-agent controls, where Zenity is a directly described agent-security peer and larger security platforms are potential bundled alternatives. Public evidence describes product approaches and recent funding, but does not establish comparative win rates, realized pricing, or switching costs.
sections:
  - id: landscape
    title: Competitive field and evidence boundaries
    body: >-
      The assigned evidence points to three competitive layers: SaaS-security
      specialists, agent-security specialists, and broader security platforms
      that could extend or bundle into the same buying decision. A third-party
      profile names Grip Security, AppOmni, Adaptive Shield, CrowdStrike,
      Microsoft, Okta, Vorlon, and Valence Security as competitors, and reports
      that an analyst rates Obsidian alongside several of those vendors as a
      leader. Caplight's embedding-similarity list separately surfaces AppOmni,
      Reco, and Delinea; that is a similarity signal, not a feature benchmark.
      Menlo Ventures' 2022 investor post names SaaS-native controls, CASBs, and
      SIEMs as then-current partial substitutes; that is historical context,
      not proof of present-day buyer behavior. The sources provide the most
      detailed product comparison for Obsidian and Zenity. For other named
      alternatives, product scope, price, scale, and customer overlap remain
      unverified in this pool. Internal build is a plausible buyer path, but
      the assigned sources do not measure it.
    claimRefs:
      - CP001
      - CP002
      - CP011
      - CP012
      - CP013
    tableRefs:
      - TP001
  - id: product-comparison
    title: Specialist capabilities and strategic adjacency
    body: >-
      Obsidian's reported differentiation combines security for third-party
      SaaS applications with controls over agent actions in those applications.
      SiliconANGLE describes runtime enforcement against privilege escalation,
      excessive data access, and policy violations, while reporting coverage
      for agent-building and developer environments. Calcalist describes
      Zenity evaluating an agent action's intent before execution and allowing
      a security team to approve, modify, or block it; it also lists support
      for several commercial and developer-agent environments. Both therefore
      make a pre-execution control claim, but the sources do not offer a
      head-to-head efficacy test or a common definition of coverage. The
      SNS Insider also reports AI-agent security additions by Microsoft,
      Google Cloud, Palo Alto Networks, and CrowdStrike; its market-report
      descriptions are not independent product tests. The analyst rating
      reported by CyberCompanyProfiles and the separate similarity list are
      category signals, not evidence that products perform equally or are
      direct substitutes in each buyer workflow.
    claimRefs:
      - CP003
      - CP009
      - CP010
      - CP002
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: economics-and-durability
    title: Pricing, lock-in, and displacement risk
    body: >-
      Public scale signals are not directly comparable across the two
      specialists. SiliconANGLE reports Obsidian's August 2026 Series D at an
      $1.1 billion post-money valuation and more than 100 customers spending
      over $100,000 annually, with more than 14 above $1 million; these are
      company-reported customer-spend thresholds, not disclosed revenue or
      ARR. Calcalist reports Zenity's $125 million Series C and approximately
      $185 million in total funding, while describing its customer base as
      large enterprises. CyberCompanyProfiles reports Obsidian's free tier
      and quote-based paid tiers, but the assigned evidence lacks comparable
      competitor prices, discounts, contract terms, churn, multi-homing, or
      migration costs. Its warning that large platforms could bundle
      alternatives is a plausible displacement risk, not a measured outcome.
      Buyer references, renewal data, and controlled win/loss evidence are
      needed before asserting a durable moat.
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP014
      - CP015
    tableRefs:
      - TP003
localEvidence:
  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitive-switching-costs
      missingEvidence: Customer-level evidence on renewal, churn, multi-homing, migration effort, and competitive wins or losses for Obsidian and its named peers.
      whyItMatters: Without comparable customer and migration evidence, integration depth cannot be translated into retention, pricing power, or a durable switching-cost advantage.
      diligencePath: Request anonymized cohort retention, churn reasons, multi-vendor usage, implementation effort, and win/loss records from Obsidian and reference customers.
      relatedQuestionRefs:
        - QP005
    - type: missing-source
      severity: material
      topic: competitive-pricing
      missingEvidence: Comparable list and realized pricing, packaging, contract length, discounting, and included capabilities for Zenity and other named alternatives.
      whyItMatters: Pricing and packaging determine whether specialists win on product value or are displaced by suite bundling, but the assigned pool supports only Obsidian's described free and quote-based tiers.
      diligencePath: Collect current vendor pricing and procurement evidence, then normalize by seat, protected identity, application, and contract scope before comparing.
      relatedQuestionRefs:
        - QP004
        - QP008
