schemaVersion: "report-v2"
artifact: customers
slug: obsidian-security
runDate: 2026-10-26
company:
  name: Obsidian Security
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to a meaningful large-enterprise customer base, with reported
    annual spend tiers and some customer-reported operational value. However, the counts
    and agent-adoption percentages are company-reported or repeated from company sources;
    named deployments, retention, customer concentration, and cohort expansion remain
    unverified.
sections:
  - id: customer-segments-and-spend
    title: Customer segments and disclosed scale
    body: >-
      The available customer evidence is weighted toward large enterprises rather than a
      disclosed count of all active users or deployments. Sacra estimates more than 100
      customers spend over $100,000 annually and more than 14 spend over $1 million;
      SiliconANGLE separately attributes the same thresholds to CEO Hasan Imam, while
      FinTech Global repeats the spending bands in coverage of the Series D. These are
      useful indicators of paid-account scale, but they are not audited customer counts,
      do not disclose the period-end measurement date, and do not show contract renewal.
      Sacra and a company-sourced Unite.AI article also report 60 Fortune 500 customers.
      None of the available sources names those accounts or maps the spend tiers to
      deployment scope, so the evidence supports enterprise reach more strongly than
      customer-level production proof or concentration analysis.
    claimRefs: [CU001, CU002, CU003, CU016]
    tableRefs: [TU001, TU002, TU003]
  - id: use-cases-and-customer-outcomes
    title: Use cases, deployment evidence, and outcomes
    body: >-
      The clearest first-person usage evidence is a PeerSpot reviewer describing incident
      response work across client environments, especially Microsoft 365 business-email
      compromise investigations. The reviewer says Obsidian helped surface anomalous
      accounts and hardening actions, and reports that some investigations that might
      previously have taken days were reduced to a day or less; this is a single
      customer's account, not a measured average or independently validated outcome.
      Sacra describes three anonymized customer examples: a Global 2000 telecom account
      identifying about $1.95 million in redundant-license savings, another customer
      reporting an 85% reduction in manual SaaS-security work across more than 100
      tenants, and a hospitality customer reporting an initial picture of a security
      event within five minutes across more than 300 cloud applications. The sources do
      not identify these customers, define measurement methods, or provide before/after
      validation; outcomes should therefore be treated as reported case evidence rather
      than generalized ROI.
    claimRefs: [CU007, CU008, CU009, CU013, CU014, CU016]
  - id: adoption-expansion-and-durability
    title: Adoption, expansion, and durability limits
    body: >-
      Company-linked coverage frames agent access as an expansion driver: FinTech Global
      quotes Imam saying more than 70% of customers already let agents into third-party
      applications, Dealroom reports his estimate as nearly 70%, and SiliconANGLE
      separately reports 65% of enterprise customers. Those figures have different
      stated denominators and are not reconciled, so they should not be treated as one
      consistent adoption rate. Menlo Ventures reported 5x growth in deals of $100,000
      or more during the year preceding its April 2022 investment post, but that is
      historical deal growth, not a current customer cohort or retention metric. Public
      review evidence is directionally positive but bounded: Gartner Peer Insights
      displays a 4.8 rating across 28 ratings, while a surfaced review and the PeerSpot
      account include useful product feedback as well as integration and interface
      improvement requests. No assigned source establishes NRR, GRR, churn, renewal,
      revenue concentration, or the conversion of pilots into production deployments.
    claimRefs: [CU004, CU005, CU006, CU010, CU011, CU012, CU015]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and commercial evidence
    columns:
      - Segment or customer evidence
      - Buyer / user / payer
      - Use case or deployment evidence
      - Scale or strategic value
      - Diligence gap
    rows:
      - ["Large enterprise spend cohort", "Buyer and payer are not named; security teams are the described users", "Paid platform use is indicated by annual spend, but deployment scope is not reported", "Sacra estimates 100+ customers spend over $100,000 annually", "Obtain period-end active-account count, contract scope, and renewal status"]
      - ["Highest-spend customer cohort", "Account identities and budget owners are undisclosed", "No customer-specific production or module detail is provided", "Sacra estimates 14+ customers spend over $1 million annually", "Request account-level cohort movement and top-customer revenue shares"]
      - ["Fortune 500 footprint", "Named buyer, user, and payer are not disclosed", "Sources report customer status without named deployments", "Sacra and Unite.AI report 60 Fortune 500 customers", "Verify active production deployments and customer references"]
      - ["Incident-response consulting use", "A PeerSpot reviewer describes use by a consulting organization for clients; payer is unknown", "Microsoft 365 business-email-compromise investigations and security hardening", "Reviewer reports faster investigations, but only from one account", "Confirm whether the reviewer is a reseller, partner, or end customer and validate repeatability"]
    notes: >-
      Spend tiers and Fortune 500 reach are reported or estimated, not audited. The
      consulting example is one reviewer account; neither row-level revenue nor
      customer-level retention is available.
    claimRefs: [CU001, CU003, CU013]
  - id: TU002
    title: Customer growth and adoption evidence
    columns:
      - Metric
      - Value
      - Date or period
      - Source / confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - ["Customers spending >$100,000 annually", "100+", "Reported in August 2026 coverage; precise measurement date not stated", "Sacra estimate and CEO-attributed reporting; medium", "Signals paid enterprise-scale accounts", "Active-account definition, contract cohort, and audit basis"]
      - ["Customers spending >$1 million annually", "14+", "Reported in August 2026 coverage; precise measurement date not stated", "Sacra estimate and CEO-attributed reporting; medium", "Shows a high-value account tier", "Whether spend is ARR, recognized revenue, or contract value is not defined"]
      - ["Customers allowing agents into third-party apps", ">70% (FinTech Global); nearly 70% (Dealroom); 65% of enterprise customers (SiliconANGLE)", "2026 coverage; source-specific denominator and date", "CEO-attributed / company-reported coverage; medium", "Suggests potential product attach and increased customer need", "Definitions differ; reconcile customer versus enterprise-customer denominator and survey date"]
      - ["Deals of $100,000 or more", "5x growth", "Year preceding Menlo Ventures' 2022-04-14 post", "Investor-authored historical statement; medium", "Historical signal of large-deal momentum", "Not current, and deal count, baseline, and subsequent retention are not provided"]
      - ["Gartner Peer Insights rating snapshot", "4.8 across 28 ratings", "Page accessed 2026-10-26; displayed review dated 2026-10-06", "Gartner Peer Insights page; high-reputation platform, medium confidence in representativeness", "Positive review signal with some visible qualitative detail", "Ratings are self-selected and do not measure renewal, production scope, or customer mix"]
    notes: >-
      Values retain each source's own metric name, period, and denominator. The agent
      access percentages are not normalized because the reports use different
      denominators and wording.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - ["Unnamed cohort of 100+ customers spending >$100,000 annually", "Obsidian platform; individual application scope is not stated", "Annual spend indicates commercial use; production status is not separately documented", "Sacra estimates this spend tier; SiliconANGLE and FinTech Global report CEO-attributed figures", "No customer names, renewal data, or cohort method"]
      - ["Unnamed cohort of 14+ customers spending >$1 million annually", "Platform scope and modules are not identified by account", "Annual spend indicates commercial use; production status is not separately documented", "Sacra estimates this tier; SiliconANGLE and FinTech Global report CEO-attributed figures", "No account identities, revenue concentration, or spend definition"]
      - ["60 Fortune 500 customers (reported)", "Specific deployments and use cases are not disclosed", "Customer relationship is reported, but production status and active use are not established", "Sacra and Unite.AI report the customer count", "Company-derived count; no list of named reference customers"]
    notes: >-
      Partial sample of aggregate public customer evidence, not an exhaustive list of
      named deployments. Reported annual spend supports commercial relationships but
      does not establish a particular deployment's production status. Named references,
      outcomes, and independent customer confirmation remain unavailable.
    enumerationScope:
      coverage: partial
      basis: >-
        Public customer evidence in the assigned source pool through 2026-10-26; named
        customer accounts and an exhaustive deployment list were not disclosed.
    claimRefs: [CU001, CU002, CU003, CU016]
figures:
  - id: FU001
    title: Customer use and expansion evidence path
    type: journey-map
    summary: >-
      Available evidence follows enterprise use from evaluation through reported
      investigation outcomes and spend-tier expansion, while leaving renewal unmeasured.
    data:
      items:
        - stage: "1"
          label: Enterprise SaaS security need
          detail: "TNW describes the customer problem as visibility across SaaS applications such as Salesforce, Microsoft 365, and Workday."
          touchpoints: ["Buyer and procurement owner are not established in the assigned sources."]
        - stage: "2"
          label: Incident-response entry
          detail: "A PeerSpot reviewer says the platform is deployed in client environments, particularly for Microsoft 365 investigations."
          touchpoints: ["Reviewer-reported workflow; client names and payer are not disclosed."]
        - stage: "3"
          label: Connector setup
          detail: "The reviewer describes detailed integration walkthroughs and says setup can be easier."
          touchpoints: ["Integration effort is a reported adoption friction, not a quantified deployment-time metric."]
        - stage: "4"
          label: Active investigation and hardening
          detail: "The reviewer describes anomaly alerts, investigation pivots, and security-hardening recommendations."
          touchpoints: ["Single reviewer account; no usage telemetry or frequency data."]
        - stage: "5"
          label: Reported outcomes
          detail: "The reviewer reports some investigations reduced from days to a day or less; Sacra reports anonymized savings and time-to-insight examples."
          touchpoints: ["No independent measurement method or matched control is provided."]
        - stage: "6"
          label: Commercial expansion signal
          detail: "Public sources report customers in >$100,000 and >$1 million annual-spend tiers."
          touchpoints: ["No cohort progression, retention, customer concentration, or renewal evidence."]
    claimRefs: [CU001, CU007, CU008, CU009, CU013, CU014, CU016]
    approximationNotes: >-
      Ordered evidence map, not a measured conversion funnel; stage sequence does not
      imply that every customer follows these steps.
