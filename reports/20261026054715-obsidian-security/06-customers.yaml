  evidenceGaps:
    - type: missing-source
      severity: material
      topic: customer-retention
      missingEvidence: "Current customer cohorts, gross and net revenue retention, churn, renewal rates, contract duration, and expansion by cohort."
      whyItMatters: "Annual spend bands and isolated case examples do not establish renewal durability or whether expansion offsets churn."
      diligencePath: "Request a dated cohort schedule reconciled to billing, including gross retention, net retention, logo churn, renewal rates, and contract terms."
      relatedQuestionRefs: [QU009]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: "Top-customer revenue shares, concentration by industry and channel, and the share of revenue attributable to the largest accounts."
      whyItMatters: "Large spend tiers suggest enterprise value but cannot show whether a small number of accounts dominate revenue or renewals."
      diligencePath: "Obtain a customer concentration schedule by account, vertical, geography, and reseller/channel with current and prior-period revenue shares."
      relatedQuestionRefs: [QU010]
    - type: conflicting-data
      severity: material
      topic: agent-adoption
      missingEvidence: "A dated methodology and consistent denominator for reported agent access among customers, including whether 'customers' and 'enterprise customers' refer to the same population."
      whyItMatters: "The reported percentages range from 65% to more than 70% and use different denominators, so the attach rate and expansion potential cannot be compared reliably."
      diligencePath: "Request the underlying survey or customer-account count, collection date, definition of agent access, and breakdown by production versus exploratory use."
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: "Named, referenceable customer deployments with segment, production status, use case, measured outcome, and permission to contact."
      whyItMatters: "Anonymized case examples and aggregate spend thresholds cannot validate deployment quality or support reference checks."
      diligencePath: "Request three to five customer references and deployment summaries that distinguish pilot, production, and expansion use."
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
