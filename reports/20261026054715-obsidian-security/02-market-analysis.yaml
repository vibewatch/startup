artifact: market-analysis
slug: obsidian-security
runDate: 2026-10-26
company:
  name: Obsidian Security
chapter:
  number: 2
  title: Market Analysis
  summary: Public evidence points to adjacent, rapidly expanding markets in SaaS posture management, non-human identity, and agent security, but their definitions and estimates do not support an additive TAM or a company-specific SAM/SOM. Obsidian's reported large-enterprise adoption and agent-related use cases indicate a plausible buyer, while actual spend, budget ownership, and conversion remain unverified.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Obsidian operates across overlapping categories rather than one cleanly
      measured market. The narrowest useful boundary is software that discovers
      and governs identities, permissions, configurations, and agent activity
      inside third-party SaaS applications; broader non-human-identity (NHI)
      estimates include application, workload, device, and cryptographic
      identities, while
      agent-security estimates can include model, runtime, and governance tools
      beyond SaaS. These adjacent categories are useful demand signals, not
      additive addressable spend. The fetched SSPM market summary describes
      licensed or subscription software for SaaS discovery, configuration,
      identity/access risk, compliance, and remediation, but it also flags
      overlap with IAM, CASB, and CSPM. Manual audits, native application
      controls, identity platforms, and broader security suites are therefore
      plausible status-quo substitutes; the evidence does not quantify their
      displacement or incremental budget.
    claimRefs: [CM001, CM004, CM005, CM009]
    tableRefs: [TM001]
  - id: sizing-and-estimate-quality
    title: Sizing lenses and limits
    body: >-
      Available published estimates vary by category, period, and method.
      MarketsandMarkets reports a global agentic-AI-security estimate of USD
      1.65 billion for 2026 and USD 13.52 billion for 2032, with a 42.0% CAGR
      over 2026-2032; Mordor's broader NHI series is USD 8.22 billion for 2026
      and USD 22.94 billion for 2031. The GII-hosted SSPM summary reports USD
      484.4 million for 2025 and USD 3.53 billion for 2030, while SNS Insider
      gives inconsistent 2025 AI-agent-security figures on the same page.
      These are third-party forecasts, not audited spending, and their scopes
      are not reconciled. They establish category interest, not the amount
      Obsidian can capture. No supported public data isolates its serviceable
      market, pricing, attach rate, or obtainable share; the figure is a
      conceptual scope map, not a proportional market-size pyramid.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer segments, adoption drivers, and constraints
    body: >-
      The clearest buyer hypothesis is a large enterprise with a sprawling
      SaaS estate and security teams accountable for identity, access, and
      compliance risk. A profile attributes 60 Fortune 500 customers to
      company materials, and a separate syndicated announcement describes
      Fortune 500 and Global 2000 organizations as a target; these statements
      show enterprise orientation, not independently measured category
      penetration. Dealroom reports the CEO saying nearly 70% of Obsidian
      customers already let agents interact with business data, a company-level
      signal rather than an industry adoption rate. Analyst summaries
      identify application sprawl, unmanaged SaaS, identity exposure, and
      regulatory pressure as adoption drivers, while also citing integration
      complexity, skills shortages, budget constraints, and overlap with
      adjacent tools. Actual payer, procurement path, willingness to pay, and
      buying trigger by segment remain unverified; the buyer map distinguishes
      reported segmentation from inferred budget ownership.
    claimRefs: [CM014, CM015, CM016, CM017, CM019]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Working market boundary and included spend
    columns: [Scope, Included activity, Excluded or adjacent spend, Buyer/payer evidence, Relevance and limit]
    rows:
      - [Core SaaS security, "SaaS discovery; posture/configuration monitoring; identity and access risk; compliance and remediation software", "General cloud security or endpoint spend without SaaS-specific controls", "Security leadership and SaaS/IAM operators are plausible; budget ownership is not disclosed", "Closest category lens; GII summary excludes professional services and does not isolate Obsidian's obtainable share"]
      - [NHI security, "Application/service, workload/container, device and cryptographic identity security", "Human-only IAM and unrelated infrastructure spend", "Enterprise security/IAM teams are implied by the segment; no buyer budget data is published", "Adjacent, broader identity market; Mordor's NHI value cannot be treated as Obsidian TAM"]
      - [AI-agent security, "Agent identity, policy, runtime monitoring, interaction protection and governance", "Broad AI platform, model development, and general cybersecurity spend", "Enterprise security buyers are discussed, but no verified purchasing budget or agent-security spend is provided", "Emerging adjacent category; SNS and MarketsandMarkets use different labels and materially different estimates"]
      - [Substitutes and status quo, "Manual audits, native SaaS controls, IAM/PAM, CASB/SSE, CSPM and broader security suites", "A separate category total is not established", "Existing IT/security owners may absorb the task; no source quantifies build-versus-buy", "Overlap may defer or bundle purchase; public evidence does not measure displaced spend"]
    notes: >-
      Scope is a qualitative boundary assembled from the cited market summaries.
      Categories overlap; rows are not additive, and buyer/payer assignments
      without direct procurement evidence are explicitly hypotheses.
    claimRefs: [CM001, CM004, CM005, CM009]
  - id: TM002
    title: Published market estimates are non-comparable sizing lenses
    columns: [Publisher and market, Geography and period, Reported value and CAGR, Visible method, Confidence and limitation]
    rows:
      - [MarketsandMarkets, "Global agentic AI security; 2025 base; forecast 2026-2032", "USD 1.65B in 2026; USD 13.52B in 2032; 42.0% CAGR (2026-2032)", "Page states secondary research, expert interviews, and MarketsandMarkets analysis", "Medium-low; forecast methodology and category boundary are not independently validated"]
      - [SNS Insider, "Global AI agent security; 2025-2035, with 2026 estimate", "Overview: USD 18.72B in 2025, USD 26.00B in 2026, USD 507.56B in 2035; 39.12% CAGR (2026-2035)", "Public page gives market narrative and segment claims; full calculation is not visible", "Low; the same page's report-scope table instead gives USD 35.09B for 2025 and USD 507.65B for 2035"]
      - [Mordor Intelligence, "Global NHI security; 2026-2031", "USD 8.22B in 2026; USD 22.94B in 2031; 22.78% CAGR (2026-2031)", "Proprietary estimation framework; page says data updated with information available as of January 2026", "Medium-low; NHI includes identities beyond SaaS agents and is not a company-specific serviceable market"]
      - [GII Research, "Global SSPM software; 2025-2030", "USD 484.4M in 2025; USD 3.53B in 2030; 48.7% CAGR (2025-2030)", "Summary attributes analysis to Frost & Sullivan; software licensing/subscription scope, services excluded", "Low; fetched text is an AI answer overview and does not expose the underlying model or source calculations"]
      - [Research and Markets, "Global SSPM software; listed figures span 2017-2032", "No market value or CAGR available in the fetched text", "Visible contents list top-down, bottom-up, and data-triangulation sections", "Low; the preview does not expose the relevant estimate, assumptions, or a usable crosswalk"]
    notes: >-
      Values are publisher-reported forecasts, not audited market revenue.
      Periods and market definitions differ, SNS has an internal 2025-value
      conflict, and the figures must not be summed or used as a direct TAM/SAM/
      SOM calculation.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM013]
  - id: TM003
    title: "Buyer and adoption map: evidence versus diligence hypotheses"
    columns: [Segment or alternative, Likely buyer and payer, User/workflow, Adoption trigger, Evidence status and open point]
    rows:
      - [Large SaaS-heavy enterprises, "CISO/security leadership is an inference; payer not confirmed", "Security, IAM, and SaaS administrators; manage app access and agent privileges", "Visibility gaps across SaaS applications and greater agent access to business data", "Company profile cites Fortune 500 customers; no named procurement, contract value, or independent penetration denominator"]
      - [Regulated enterprises, "Security and compliance leadership are inferred; budget owner unverified", "Security/compliance teams monitor access, policy, and audit posture", "Regulatory and data-protection requirements cited in market summaries", "Segment relevance appears in analyst commentary; no buyer-level spend or compliance conversion data"]
      - [Mid-sized organizations, "IT/security lead is a hypothesis; payer unknown", "Generalist security teams manage SaaS configuration and identity risks", "SaaS growth and managed-service availability may lower adoption friction", "Public summary notes budget, skills, and integration barriers; actual adoption rate is unavailable"]
      - [Existing platform or internal-build alternative, "Existing IAM, CASB/SSE, CSPM, or security-suite owner", "Reuse native controls, manual audits, or adjacent tools", "Consolidation and tool overlap can reduce incremental procurement", "Analyst summaries identify overlap and consolidation; no comparative win rate or displacement data"]
      - [Agent-using customers, "Security owner and business-system owner likely share approval; not verified", "Govern agent identities and activity inside enterprise applications", "Company CEO reportedly said nearly 70% of customers already let agents interact with business data", "Company-customer observation is not an industry adoption rate and does not establish willingness to pay"]
    notes: >-
      Buyer titles and budget ownership are hypotheses where the sources describe
      market segments but do not document procurement. The rows separate
      reported signals from unresolved purchase economics.
    claimRefs: [CM014, CM015, CM016, CM017, CM019]
