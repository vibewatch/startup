    title: Conceptual scope layers, not an additive TAM
    type: pyramid
    summary: "SaaS posture, NHI, and AI-agent security overlap; their published estimates are not additive or proportional."
    data:
      items:
        - label: "Core: SaaS posture and third-party application access"
          value: "Not isolated"
          detail: "Closest product-market boundary; reported software scope includes SaaS discovery, configuration, identity/access risk, compliance, and remediation."
        - label: "Adjacent: non-human identity security"
          value: "Not isolated"
          detail: "Broader scope includes application, workload, device, and cryptographic identities."
        - label: "Adjacent: AI-agent security"
          value: "Not isolated"
          detail: "Broader definitions may include agent identity, runtime, interaction, and governance controls."
        - label: "SaaS posture software"
          value: "Not isolated"
          detail: "Subscription software for SaaS discovery, configuration, access risk, compliance, and remediation."
        - label: "Agent identity and runtime"
          value: "Not isolated"
          detail: "Overlapping controls for agent permissions, monitoring, policy enforcement, and interaction risk."
        - label: "Obsidian-specific SAM/SOM"
          value: "Not supported"
          detail: "The assigned sources do not provide an eligible-account, pricing, revenue, or obtainable-share denominator."
    approximationNotes: >-
      Conceptual category layers only. Authored order is not a scale, market
      share, conversion funnel, or revenue estimate; the layers overlap and
      published forecasts use non-equivalent definitions.
    claimRefs: [CM001, CM004, CM005, CM009, CM010, CM012]
