evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Audited ARR and recognized revenue, growth rate, gross margin, NRR, churn, customer concentration, cash burn, and
      runway are not supplied by the assigned sources.
    whyItMatters: >-
      Customer spend thresholds and a funding announcement cannot establish recurring revenue quality, cash efficiency,
      or the ability to sustain the reported valuation.
    diligencePath: >-
      Request audited annual financial statements, monthly ARR and revenue bridges, cohort retention, customer
      concentration, and a cash forecast directly from management.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A dated current executive roster, complete board list, founder role status, cap table, and investor voting or
      consent rights are unavailable.
    whyItMatters: >-
      The available investor-authored role descriptions may be historical and do not show key-person dependency,
      control, or governance concentration.
    diligencePath: >-
      Obtain the current leadership and board roster, organizational chart, fully diluted cap table, and financing
      documents including governance and protective provisions.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: company-specific-adverse-events
    missingEvidence: >-
      The assigned evidence does not establish whether Obsidian has faced company-specific litigation, regulatory
      action, outage, breach, or customer-impacting security incident.
    whyItMatters: >-
      A bounded set of funding and company-profile sources cannot establish a clean legal or incident history, and
      absence from these sources is not proof that no event occurred.
    diligencePath: >-
      Run and document a dedicated current legal, regulatory, incident, and customer-reference review before relying on
      an adverse-event conclusion.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-history
    missingEvidence: >-
      Caplight's Early Funding entry has no displayed amount or explanation, and the assigned sources do not provide an
      exhaustive dated history of regulatory, partnership, or adverse milestones.
    whyItMatters: >-
      The timeline is selected from available public records and should not be mistaken for a complete corporate
      chronology.
    diligencePath: >-
      Reconcile the historical financing ledger and request a dated company chronology covering product, partnership,
      regulatory, and incident events.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: company-specific-sizing
    missingEvidence: >-
      A reconciled product-level revenue pool, qualified customer counts, pricing, attach rates, and obtainable share
      for Obsidian's SaaS and agent-security offerings.
    whyItMatters: >-
      Adjacent analyst forecasts have different market boundaries and cannot establish the company's serviceable or
      obtainable market or support an investment valuation.
    diligencePath: >-
      Request management's segment-level TAM/SAM methodology, product revenue split, customer pipeline, price/contract
      ranges, and a bottom-up account-by-account serviceability bridge.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget-evidence
    missingEvidence: >-
      Independent procurement, public budget, or customer evidence identifying the economic buyer, payer, budget source,
      and purchase trigger by enterprise segment.
    whyItMatters: >-
      Reported customer counts and category forecasts do not show who controls incremental budget, whether purchases are
      standalone or bundled, or the conversion cost.
    diligencePath: >-
      Interview security buyers and obtain anonymized contracts, procurement records, renewal/expansion data, and
      segment-specific sales-cycle evidence.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitive-switching-costs
    missingEvidence: >-
      Customer-level evidence on renewal, churn, multi-homing, migration effort, and competitive wins or losses for
      Obsidian and its named peers.
    whyItMatters: >-
      Without comparable customer and migration evidence, integration depth cannot be translated into retention, pricing
      power, or a durable switching-cost advantage.
    diligencePath: >-
      Request anonymized cohort retention, churn reasons, multi-vendor usage, implementation effort, and win/loss
      records from Obsidian and reference customers.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: competitive-pricing
    missingEvidence: >-
      Comparable list and realized pricing, packaging, contract length, discounting, and included capabilities for
      Zenity and other named alternatives.
    whyItMatters: >-
      Pricing and packaging determine whether specialists win on product value or are displaced by suite bundling, but
      the assigned pool supports only Obsidian's described free and quote-based tiers.
    diligencePath: >-
      Collect current vendor pricing and procurement evidence, then normalize by seat, protected identity, application,
      and contract scope before comparing.
    relatedQuestionRefs:
      - QP004
      - QP008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue by stream, ARR definition and period, contract/pricing terms, revenue-recognition policy, and
