figures:
  - id: FE001
    title: Product architecture map from public descriptions
    type: stack
    summary: Public materials describe these product surfaces, but the layer grouping is not a verified architecture or execution sequence.
    data:
      layers:
        - label: Enterprise SaaS applications
          detail: Business applications are the environment named in company and third-party descriptions; exact connected-app coverage is not disclosed.
        - label: Application identities and activity
          detail: Third-party coverage describes human and nonhuman identities, account and configuration monitoring, and activity; source completeness is unverified.
        - label: Cross-application context
          detail: SiliconANGLE reports knowledge-graph usage patterns and identity/activity normalization; underlying schemas and data handling are not documented.
        - label: SaaS-to-SaaS integration risk
          detail: The January launch describes visibility, prevention, early breach detection, and containment for integration risk; production scope remains unverified.
        - label: AI-agent and MCP governance
          detail: Company announcements name agent-permission controls, MCP server and LLM inventory, and monitoring in business applications; inventory completeness and policy scope are untested.
        - label: Runtime policy and response
          detail: Company-described controls can detect or block excessive data access, privilege escalation, and policy violations during execution; independent efficacy is not reported.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE007, CE008]
callouts:
  - calloutType: insight
    title: Product adjacency is credible; efficacy is unproven in this evidence set
    body: >-
      The shared SaaS identity and integration layer provides a plausible path from
      established SaaS security into AI-agent governance, but the assigned evidence does
      not quantify control performance or establish deployment breadth.
    claimRefs: [CE001, CE005, CE006, CE012]
  - calloutType: risk
    title: MCP inventory is not equivalent to MCP security
    body: >-
      OWASP and the Cloud Security Alliance describe risks involving tool behavior,
      permissions, and supply-chain boundaries; diligence should test enforcement and
      change detection rather than relying on inventory claims alone.
    claimRefs: [CE004, CE009, CE010]
