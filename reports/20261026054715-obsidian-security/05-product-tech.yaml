  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: product-validation-gap
      missingEvidence: Independent technical test results for detection and blocking efficacy, false positives, response latency, and application or agent coverage.
      whyItMatters: Announced runtime controls do not establish that the product prevents high-impact agent or integration misuse at acceptable operational cost.
      diligencePath: Request a scoped technical evaluation with representative SaaS and agent workflows, test cases, measured outcomes, and customer references.
      relatedQuestionRefs: [QE003, QE006]
    - type: missing-source
      severity: material
      topic: deployment-and-trust-gap
      missingEvidence: Current architecture and deployment documentation covering connector scope, enforcement points, data handling, reliability, certifications, and operational support.
      whyItMatters: These details determine implementation effort, data exposure, control coverage, and the product's ability to operate in regulated enterprise environments.
      diligencePath: Obtain current architecture, security, privacy, reliability, and integration documents and verify them with a production customer.
      relatedQuestionRefs: [QE003, QE004, QE006]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public engineering or practitioner-community evidence such as release activity, repository participation, package usage, or relevant technical discussions.
      whyItMatters: Without a developer signal, external adoption and ecosystem engagement around the product's integrations and agent tooling remain unassessed.
      diligencePath: Request current release and integration-support records, and review any company engineering or customer-community channels made available in diligence.
      relatedQuestionRefs: [QE008]
