chapter:
  number: 5
  title: Product & Technology
  summary: Obsidian's public product narrative extends SaaS identity and integration monitoring into AI-agent governance, with announced runtime controls, SaaS supply-chain capabilities, and MCP/LLM inventory. Public sources describe the intended operating model, but they do not establish deployment coverage, control efficacy, reliability, or independent differentiation.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Obsidian describes a security layer for third-party business applications that now also
      governs AI agents acting in those environments (CE001). Its August 2026 announcement
      names controls for Claude Code and Cowork, including permission management, restricted
      access to sensitive systems, and monitoring of interactions in business applications
      (CE002). The same announcement says runtime protection can detect and block excessive
      data access, privilege escalation, and policy violations during task execution, and that
      the product inventories MCP servers and large language models (CE003, CE004). These are
      company-described features, not independently measured outcomes.

      The January SaaS-supply-chain launch broadens the described workflow from individual
      account and configuration monitoring to SaaS-to-SaaS integration risk: visibility,
      prevention, early detection, and incident containment (CE005). SiliconANGLE reports
      identity and activity normalization across SaaS applications and a knowledge graph of
      usage patterns (CE006); The Next Web describes monitoring for compromised accounts,
      risky configurations, and identity-based attacks (CE007). The module matrix and workflow
      table distinguish these advertised functions from unknown production maturity and
      unreported customer outcomes.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007]
    tableRefs: [TE001, TE002]
  - id: operating-model
    title: Operating model and technical boundaries
    body: >-
      Public descriptions suggest an operating model that gathers SaaS identity and activity
      context, normalizes it across applications, and uses behavioral analysis to surface
      deviations (CE006, CE008). Menlo Ventures described that approach in an investment
      article; its investor relationship and the article's undated, historical framing make it
      useful as product-history context, not independent current validation (CE008). The
      company’s newer materials position the same SaaS context as a control point for agents
      and integrations (CE001, CE005). This is a description of product intent, not a verified
      architecture diagram: the assigned sources do not specify connector coverage, ingestion
      or retention design, enforcement points, deployment model, or service-level reliability
      (CE012).

      MCP broadens the trust boundary beyond an agent to its host, client, server, tools, and
      data. OWASP identifies prompt/tool poisoning, changing tool definitions, confused-deputy
      behavior, over-scoped permissions, and supply-chain risks; the Cloud Security Alliance's
      March 2026 guide is explicitly a draft and says conventional application-security
      controls are insufficient for the protocol's attack surfaces (CE009, CE010). These
      sources define diligence tests for Obsidian's MCP inventory and runtime controls; they
      do not establish that the company has or lacks any specific control.
    claimRefs: [CE001, CE005, CE006, CE008, CE009, CE010, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-proof
    title: Maturity, differentiation, and proof gaps
    body: >-
      The allocated evidence supports a coherent adjacency: a product already described as
      monitoring SaaS identities and activity is being extended to agent permissions,
      runtime policy, and integration risk in the same application estate (CE001, CE005,
      CE007). UpGuard, a competing security vendor, also characterizes Obsidian as combining
      SSPM, integration risk, AI governance, and identity-threat detection; its comparison is
      vendor-authored and is not an independent benchmark (CE011). The sources do not show
      comparative detection quality, verified prevention rates, false-positive rates,
      coverage by application or agent, or customer-validated time savings (CE012).

      Deployment and operational maturity remain open: the public descriptions in this
      assigned pool do not establish integration counts, implementation time, uptime,
      incident-response commitments, certification scope, or privacy and retention controls
      (CE013). The pool also contains no company repository activity, package downloads, or
      practitioner-community measurements, so developer adoption cannot be assessed (CE014).
      Treat product breadth and the claimed centralized control plane as a thesis to test
      with architecture documentation, a live technical evaluation, and customer references,
      not as evidence of a durable technical moat.
    claimRefs: [CE001, CE005, CE007, CE011, CE012, CE013, CE014]
    tableRefs: []
    figureRefs: []
  - id: diligence-priorities
    title: Diligence priorities
    body: >-
      The highest-value technical diligence is to test agent and integration controls against
      realistic permission escalation, excessive data access, tool-definition changes,
      prompt injection, and cross-application movement (CE003, CE009, CE010). Request
      application-by-application connector and action coverage; evidence of enforcement
      points and auditability; test methodology and false-positive/negative rates; and production
      references that can distinguish a shipped control from a roadmap or launch claim
      (CE002, CE003, CE012, CE013). For MCP, verify discovery completeness, change detection,
      authorization scope, and whether policy is enforced outside the agent's own tool
      descriptions. These requests address the actual dependency chain rather than assuming
      that inventory alone provides prevention.

      No public developer-signal evidence was available in the assigned pool. That is a
      research limitation, not proof that the product has no developer ecosystem or that no
      security incident has occurred (CE014). Ask for release cadence, documented
      integration/version support, independent penetration or control testing, and incident
      history under appropriate confidentiality. Until those records and customer-side
      validation are available, product breadth is more supportable than claims about
      efficacy, reliability, or defensibility.
    claimRefs: [CE002, CE003, CE009, CE010, CE012, CE013, CE014]
    tableRefs: []
    figureRefs: []
