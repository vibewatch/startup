company:
  name: Obsidian Security
chapter:
  number: 8
  title: Valuation
  summary: >-
    Current reporting places Obsidian's Series D at $85 million and a $1.1 billion post-money
    valuation, while company and investor materials describe a credible SaaS- and AI-agent-security
    thesis. The assigned evidence does not establish current recurring economics or capitalization
    terms, so an investable valuation range and return case remain unpriced.
sections:
  - id: entry-conclusion
    title: Entry conclusion and price discipline
    body: >-
      Treat the reported $1.1 billion post-money Series D mark as transaction context, not as a
      verified enterprise-value multiple or a public-market clearing price. SiliconANGLE, Dealroom,
      and The Next Web report an $85 million round; Unite.AI reports more than $200 million raised
      across five rounds, which is capital raised rather than cash available. None of those figures
      supplies the current ARR, recognized revenue, growth, gross margin, retention, burn, runway,
      or security-level financing terms needed to calculate an Obsidian-specific multiple or
      preference-adjusted return. The company site also presents product and ROI claims, but those
      do not substitute for audited recurring economics. I recommend research-more before making a
      price-based investment decision: confidence in the price assessment is low, and valuation
      underwriting risk is high because the transaction mark cannot be tested against its financial
      denominator or common-equity rights. A verified ARR bridge, cohort metrics, cap table, and
      Series D documents could change the call; until then, neither a buy case nor a numeric
      downside range is supported.
    claimRefs: [CV002, CV012, CV013, CV014, CV015]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The product thesis is coherent: Obsidian's site describes real-time visibility, continuous
      governance, and runtime enforcement across agents, identities, and integrations in third-party
      apps, while The Next Web describes the existing SaaS layer as a potential advantage in
      governing agents there. This is evidence of positioning, not independent proof of efficacy.
      The financing coverage also relays large-customer signals: Unite.AI attributes more than 100
      customers spending over $100,000 annually and more than 14 spending above $1 million to the
      company. SiliconANGLE and Unite.AI report different agent-access percentages and denominator
      wording, so those figures should not be combined into one adoption rate. Menlo Ventures'
      investor-authored 5x deal-growth statement is historical and interested-party evidence, not
      current ARR or retention. The anti-thesis is therefore about underwriting rather than product
      relevance: spend thresholds, a funding headline, and seller or investor positioning do not
      establish recurring revenue quality, margins, customer concentration, or returns at the mark.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, comparables, and diligence gates
    body: >-
      The available comparison set is directional rather than a valuation formula. Windsor Drake's
      April 2026 report gives a public cybersecurity median on an NTM-revenue basis and a much wider
      revenue range for AI-native private security, but it is the advisory firm's own synthesis and
      does not show that Obsidian meets the relevant growth, margin, or architecture conditions.
      TechCrunch's reported Cyera financing multiple is competitor-specific, based on unnamed
      sources, and accompanied by a company denial; it is not an independent benchmark for Obsidian.
      The Next Web separately cautions that security valuations have run hot. The bull, base, and
      bear cases below therefore state conditional assumptions and downside triggers, but leave
      numeric equity ranges and probabilities unassigned rather than inventing them. Diligence
      should obtain current ARR and revenue reconciliation, growth, gross margin, retention and
      concentration; cash burn, runway and debt; fully diluted capitalization and preference terms;
      and customer evidence for agent-product adoption. Revisit entry only after normalizing those
      inputs against genuinely comparable transactions and modeling dilution, preferences, and exit
      proceeds.
    claimRefs: [CV007, CV008, CV009, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: ["Decision field", "Evidence-based assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Research more before setting an entry price.", "Do not make a price-based buy decision on the financing mark alone."]
      - ["Confidence", "Low for valuation; the round is reported but its financial denominator and full terms are not established.", "Raise confidence only after primary company financials and executed financing terms are reviewed."]
      - ["Risk rating", "High valuation-underwriting risk; this is not a comprehensive operating-risk score.", "Test downside and preference-adjusted proceeds before committing capital."]
      - ["Valuation stance", "Not independently priceable; $1.1 billion is a reported post-money round mark.", "Do not infer a company multiple or fair value without current revenue and security terms."]
      - ["Decision implication", "Track the product thesis while closing material financial and capitalization gaps.", "Reassess after ARR, growth, retention, margins, dilution, and preferences are verified."]
    notes: >-
      The reported round valuation is transaction context, not an independently verified price or
      a calculated multiple. Customer-spend thresholds and financing raised are not ARR or cash on
      hand.
    claimRefs: [CV002, CV012, CV013, CV014, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: ["Lens", "Evidence-supported thesis", "Anti-thesis or limitation", "What would change the view"]
    rows:
      - ["Product adjacency", "The company positions its platform across third-party apps, identities, and AI agents.", "Company positioning and a media description do not independently demonstrate efficacy or willingness to pay.", "Customer references, deployment scope, renewal, and expansion evidence."]
      - ["Customer monetization", "Company-reported cohorts include more than 100 customers above $100,000 annual spend and more than 14 above $1 million.", "Threshold counts are not ARR, recognized revenue, margin, retention, or customer concentration.", "Audited ARR bridge, cohort retention, gross margin, and top-customer exposure."]
      - ["Agent adoption", "Coverage attributes agent-access figures above 65% and above 70% to Obsidian leadership.", "The reports use different customer denominators; they cannot be averaged or treated as one cohort.", "Dated, consistently defined adoption and paid-conversion data."]
      - ["Historical enterprise traction", "Menlo's investor post describes 5x growth in deals of $100,000 or more over the preceding year.", "The timeframe is not mapped to a current revenue rate, and the investor is an interested party.", "Recent independently verified contract, expansion, and renewal cohorts."]
      - ["Market pricing", "A 2026 sector report offers public and AI-native private revenue references.", "Its ranges are the publisher's synthesis; a disputed competitor multiple is not an Obsidian comparable.", "Transactions matched on ARR basis, growth, margin, business model, and security terms."]
    notes: >-
      Company and investor claims remain attributed as such. Customer thresholds are not converted
      to ARR, and competitor or sector data is context rather than a direct company valuation.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Conditional bull, base, and bear scenarios
    columns: ["Case", "Explicit assumptions", "Valuation / return range", "Probability signal", "Downside trigger or diligence"]
    rows:
      - ["Bull", "Agent governance converts into durable enterprise subscriptions; reported customer-spend cohorts reconcile to recurring revenue with strong retention and margins.", "Not quantifiable from retained evidence; $1.1 billion is the latest reported post-money round mark, not a supported equity range.", "Upside is conditional; no probability is assigned.", "Fail the case if customer tiers do not reconcile to ARR or renewal, expansion, and margin quality."]
      - ["Base", "The SaaS security base persists and agent governance adds measured upsell, while growth and unit economics remain to be verified.", "No numeric range or target return is supportable without ARR, growth, margin, capitalization, and preference data.", "Undetermined; research-more is the current decision signal.", "Revisit only after an ARR bridge, retention, gross margin, concentration, cash runway, and terms are reviewed."]
      - ["Bear", "Agent adoption or monetization stalls, recurring economics disappoint, or dilution and senior preferences reduce common-equity proceeds.", "A value below the reported round mark is possible, but the downside magnitude cannot be calculated from available evidence.", "Material risk; likelihood is not estimable from the retained sources.", "Reprice or pass if verified economics fail the premium case or preference-adjusted proceeds miss return hurdles."]
    notes: >-
      Numerical scenario ranges and probabilities are intentionally unavailable: the sources do not
      provide current company ARR, growth, margins, diluted shares, debt, preference rights, or exit
      assumptions. These are conditional decision cases, not forecasts; the reported round mark is
      not an assumed fair value.
    claimRefs: [CV007, CV008, CV009, CV012, CV013, CV014, CV015]
