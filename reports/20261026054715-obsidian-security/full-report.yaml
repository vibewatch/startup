      - number: '6.2'
        title: Use cases, deployment evidence, and outcomes
        blocks:
          - type: paragraph
            body: >-
              The clearest first-person usage evidence is a PeerSpot reviewer describing incident response work across
              client environments, especially Microsoft 365 business-email compromise investigations. The reviewer says
              Obsidian helped surface anomalous accounts and hardening actions, and reports that some investigations
              that might previously have taken days were reduced to a day or less; this is a single customer's account,
              not a measured average or independently validated outcome. Sacra describes three anonymized customer
              examples: a Global 2000 telecom account identifying about $1.95 million in redundant-license savings,
              another customer reporting an 85% reduction in manual SaaS-security work across more than 100 tenants, and
              a hospitality customer reporting an initial picture of a security event within five minutes across more
              than 300 cloud applications. The sources do not identify these customers, define measurement methods, or
              provide before/after validation; outcomes should therefore be treated as reported case evidence rather
              than generalized ROI.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
              - CU016
      - number: '6.3'
        title: Adoption, expansion, and durability limits
        blocks:
          - type: paragraph
            body: >-
              Company-linked coverage frames agent access as an expansion driver: FinTech Global quotes Imam saying more
              than 70% of customers already let agents into third-party applications, Dealroom reports his estimate as
              nearly 70%, and SiliconANGLE separately reports 65% of enterprise customers. Those figures have different
              stated denominators and are not reconciled, so they should not be treated as one consistent adoption rate.
              Menlo Ventures reported 5x growth in deals of $100,000 or more during the year preceding its April 2022
              investment post, but that is historical deal growth, not a current customer cohort or retention metric.
              Public review evidence is directionally positive but bounded: Gartner Peer Insights displays a 4.8 rating
              across 28 ratings, while a surfaced review and the PeerSpot account include useful product feedback as
              well as integration and interface improvement requests. No assigned source establishes NRR, GRR, churn,
              renewal, revenue concentration, or the conversion of pilots into production deployments.
            claimRefs:
              - CU004
              - CU005
              - CU006
