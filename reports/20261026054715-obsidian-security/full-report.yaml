  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Runtime controls face an evidence gap
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a high-impact threat model, but not a company-specific security failure.
              Token Security describes a separate Salesloft-Drift OAuth compromise that reached Salesforce customer
              environments; The Next Web describes how an over-permissioned or hijacked agent could move quickly across
              enterprise applications. Neither source reports an Obsidian incident, and Token Security is a competing
              vendor promoting its own controls (CR004, CR005). Obsidian's runtime enforcement is described in
              company-issued material and a CEO interview, while the WorkOS comparison says the product monitors
              activity after authentication. WorkOS is a competitor, not an independent benchmark; the pool contains no
              deployment test, independent red-team result, false-positive rate, or enforcement-latency measurement
              (CR001, CR002, CR003). Treat prevention claims as unverified until customer evidence demonstrates
              coverage, fail-open behavior, and response under machine-speed activity. The matrix therefore separates
              unknown likelihood from potential impact rather than assigning incident probabilities (FR001). The
              operational register is deliberately ranked by potential consequence and identifies the evidence needed to
              assess mitigation maturity (TR002).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
