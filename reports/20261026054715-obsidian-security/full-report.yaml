  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial traction is visible, but not revenue
        blocks:
          - type: paragraph
            body: >-
              SiliconANGLE reported that CEO Hasan Imam described more than 100 customers paying over $100,000 per year
              and more than 14 paying over $1 million annually; Unite.AI and other coverage repeated those
              company-reported tiers. These are customer-spend thresholds, not an aggregate revenue figure, ARR,
              recognized revenue, or a customer count distribution. Unite.AI separately reported that 60 Fortune 500
              companies were in the customer base, again without a disclosed denominator for deployment scope, contract
              value, or timing. The evidence therefore supports enterprise reach and a high-spend cohort, but not
              revenue concentration, growth rate, renewal quality, or realized pricing. The available materials also do
              not describe distinct revenue streams, contract terms, or accounting treatment. The table keeps those
              evidence-backed customer tiers separate from the private metrics needed to convert them into an
              underwriting-grade revenue bridge.
