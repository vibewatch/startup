              - CM017
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive field and evidence boundaries
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to three competitive layers: SaaS-security specialists, agent-security
              specialists, and broader security platforms that could extend or bundle into the same buying decision. A
              third-party profile names Grip Security, AppOmni, Adaptive Shield, CrowdStrike, Microsoft, Okta, Vorlon,
              and Valence Security as competitors, and reports that an analyst rates Obsidian alongside several of those
              vendors as a leader. Caplight's embedding-similarity list separately surfaces AppOmni, Reco, and Delinea;
              that is a similarity signal, not a feature benchmark. Menlo Ventures' 2022 investor post names SaaS-native
              controls, CASBs, and SIEMs as then-current partial substitutes; that is historical context, not proof of
              present-day buyer behavior. The sources provide the most detailed product comparison for Obsidian and
              Zenity. For other named alternatives, product scope, price, scale, and customer overlap remain unverified
              in this pool. Internal build is a plausible buyer path, but the assigned sources do not measure it.
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.2'
        title: Specialist capabilities and strategic adjacency
        blocks:
          - type: paragraph
            body: >-
              Obsidian's reported differentiation combines security for third-party SaaS applications with controls over
              agent actions in those applications. SiliconANGLE describes runtime enforcement against privilege
              escalation, excessive data access, and policy violations, while reporting coverage for agent-building and
              developer environments. Calcalist describes Zenity evaluating an agent action's intent before execution
              and allowing a security team to approve, modify, or block it; it also lists support for several commercial
              and developer-agent environments. Both therefore make a pre-execution control claim, but the sources do
              not offer a head-to-head efficacy test or a common definition of coverage. The SNS Insider also reports
              AI-agent security additions by Microsoft, Google Cloud, Palo Alto Networks, and CrowdStrike; its
              market-report descriptions are not independent product tests. The analyst rating reported by
              CyberCompanyProfiles and the separate similarity list are category signals, not evidence that products
              perform equally or are direct substitutes in each buyer workflow.
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP002
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP010
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
