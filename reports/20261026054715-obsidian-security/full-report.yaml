              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Legal and regulatory posture remains unverified
        blocks:
          - type: paragraph
            body: >-
              The assigned pool contains no regulator, court, certification, contract, or company compliance record that
              establishes Obsidian's current legal posture. This is a scoped evidence gap, not evidence that litigation,
              enforcement, or a compliance failure exists. Privacy and AI-governance obligations will depend on the data
              processed, customer use cases, and the company's contractual role; those facts are not established in this
              source set (CR012). The regulatory register is a partial list of diligence scenarios, not a finding that
              any specific regime applies. Until current counsel-reviewed applicability and control evidence are
              supplied, both likelihood and mitigation maturity remain unassessed and residual exposure is material
              (TR001). Obtain current legal and compliance records before relying on certifications, customer
              representations, or applicability conclusions.
            claimRefs:
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR015
      - number: '7.3'
        title: Customer, platform, and financing dependencies need diligence
        blocks:
          - type: paragraph
            body: >-
              Reported customer and financing indicators do not resolve concentration or cash-availability risk.
              SiliconANGLE attributes to CEO Hasan Imam claims that more than 14 customers paid over $1 million annually
              and more than 100 paid over $100,000 per year as of the August 2026 interview; the report gives neither a
              total customer denominator nor customer revenue shares, and the tiers may overlap (CR014). SiliconANGLE
              and The Next Web both report an $85 million Series D at a $1.1 billion post-money valuation, but neither
              metric is cash available or runway (CR006, CR007). Dealroom says the company expects the proceeds to carry
              it to positive cash flow; that is a reported expectation, not a cash-flow result (CR011). Meanwhile, a
              market report lists major platform vendors expanding agent-security capabilities, and SiliconANGLE reports
              a substantial adjacent-market round, increasing execution and competitive pressure (CR009, CR013). The
              dependency register separates customer, SaaS-platform, and capital-provider exposures (TR003); diligence
              should obtain concentration, renewal, integration, burn, and runway schedules.
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR011
              - CR013
              - CR014
          - type: table
