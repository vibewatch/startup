  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Obsidian operates across overlapping categories rather than one cleanly measured market. The narrowest
              useful boundary is software that discovers and governs identities, permissions, configurations, and agent
              activity inside third-party SaaS applications; broader non-human-identity (NHI) estimates include
              application, workload, device, and cryptographic identities, while agent-security estimates can include
              model, runtime, and governance tools beyond SaaS. These adjacent categories are useful demand signals, not
              additive addressable spend. The fetched SSPM market summary describes licensed or subscription software
              for SaaS discovery, configuration, identity/access risk, compliance, and remediation, but it also flags
              overlap with IAM, CASB, and CSPM. Manual audits, native application controls, identity platforms, and
              broader security suites are therefore plausible status-quo substitutes; the evidence does not quantify
              their displacement or incremental budget.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
      - number: '2.2'
        title: Sizing lenses and limits
        blocks:
          - type: paragraph
            body: >-
              Available published estimates vary by category, period, and method. MarketsandMarkets reports a global
              agentic-AI-security estimate of USD 1.65 billion for 2026 and USD 13.52 billion for 2032, with a 42.0%
              CAGR over 2026-2032; Mordor's broader NHI series is USD 8.22 billion for 2026 and USD 22.94 billion for
              2031. The GII-hosted SSPM summary reports USD 484.4 million for 2025 and USD 3.53 billion for 2030, while
              SNS Insider gives inconsistent 2025 AI-agent-security figures on the same page. These are third-party
              forecasts, not audited spending, and their scopes are not reconciled. They establish category interest,
              not the amount Obsidian can capture. No supported public data isolates its serviceable market, pricing,
              attach rate, or obtainable share; the figure is a conceptual scope map, not a proportional market-size
              pyramid.
            claimRefs:
              - CM006
