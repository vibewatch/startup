              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Entry conclusion and price discipline
        blocks:
          - type: paragraph
            body: >-
              Treat the reported $1.1 billion post-money Series D mark as transaction context, not as a verified
              enterprise-value multiple or a public-market clearing price. SiliconANGLE, Dealroom, and The Next Web
              report an $85 million round; Unite.AI reports more than $200 million raised across five rounds, which is
              capital raised rather than cash available. None of those figures supplies the current ARR, recognized
              revenue, growth, gross margin, retention, burn, runway, or security-level financing terms needed to
              calculate an Obsidian-specific multiple or preference-adjusted return. The company site also presents
              product and ROI claims, but those do not substitute for audited recurring economics. I recommend
              research-more before making a price-based investment decision: confidence in the price assessment is low,
              and valuation underwriting risk is high because the transaction mark cannot be tested against its
              financial denominator or common-equity rights. A verified ARR bridge, cohort metrics, cap table, and
              Series D documents could change the call; until then, neither a buy case nor a numeric downside range is
              supported.
            claimRefs:
              - CV002
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The product thesis is coherent: Obsidian's site describes real-time visibility, continuous governance, and
              runtime enforcement across agents, identities, and integrations in third-party apps, while The Next Web
              describes the existing SaaS layer as a potential advantage in governing agents there. This is evidence of
              positioning, not independent proof of efficacy. The financing coverage also relays large-customer signals:
              Unite.AI attributes more than 100 customers spending over $100,000 annually and more than 14 spending
              above $1 million to the company. SiliconANGLE and Unite.AI report different agent-access percentages and
              denominator wording, so those figures should not be combined into one adoption rate. Menlo Ventures'
              investor-authored 5x deal-growth statement is historical and interested-party evidence, not current ARR or
              retention. The anti-thesis is therefore about underwriting rather than product relevance: spend
              thresholds, a funding headline, and seller or investor positioning do not establish recurring revenue
              quality, margins, customer concentration, or returns at the mark.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, comparables, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The available comparison set is directional rather than a valuation formula. Windsor Drake's April 2026
              report gives a public cybersecurity median on an NTM-revenue basis and a much wider revenue range for
              AI-native private security, but it is the advisory firm's own synthesis and does not show that Obsidian
              meets the relevant growth, margin, or architecture conditions. TechCrunch's reported Cyera financing
              multiple is competitor-specific, based on unnamed sources, and accompanied by a company denial; it is not
              an independent benchmark for Obsidian. The Next Web separately cautions that security valuations have run
              hot. The bull, base, and bear cases below therefore state conditional assumptions and downside triggers,
              but leave numeric equity ranges and probabilities unassigned rather than inventing them. Diligence should
              obtain current ARR and revenue reconciliation, growth, gross margin, retention and concentration; cash
              burn, runway and debt; fully diluted capitalization and preference terms; and customer evidence for
              agent-product adoption. Revisit entry only after normalizing those inputs against genuinely comparable
              transactions and modeling dilution, preferences, and exit proceeds.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
