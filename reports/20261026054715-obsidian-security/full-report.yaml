      - number: '2.3'
        title: Buyer segments, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer hypothesis is a large enterprise with a sprawling SaaS estate and security teams
              accountable for identity, access, and compliance risk. A profile attributes 60 Fortune 500 customers to
              company materials, and a separate syndicated announcement describes Fortune 500 and Global 2000
              organizations as a target; these statements show enterprise orientation, not independently measured
              category penetration. Dealroom reports the CEO saying nearly 70% of Obsidian customers already let agents
              interact with business data, a company-level signal rather than an industry adoption rate. Analyst
              summaries identify application sprawl, unmanaged SaaS, identity exposure, and regulatory pressure as
              adoption drivers, while also citing integration complexity, skills shortages, budget constraints, and
              overlap with adjacent tools. Actual payer, procurement path, willingness to pay, and buying trigger by
              segment remain unverified; the buyer map distinguishes reported segmentation from inferred budget
              ownership.
            claimRefs:
