  - id: FU001
    title: Customer use and expansion evidence path
    type: journey-map
    summary: >-
      Available evidence follows enterprise use from evaluation through reported investigation outcomes and spend-tier
      expansion, while leaving renewal unmeasured.
    data:
      items:
        - stage: '1'
          label: Enterprise SaaS security need
          detail: >-
            TNW describes the customer problem as visibility across SaaS applications such as Salesforce, Microsoft 365,
            and Workday.
          touchpoints:
            - Buyer and procurement owner are not established in the assigned sources.
        - stage: '2'
          label: Incident-response entry
          detail: >-
            A PeerSpot reviewer says the platform is deployed in client environments, particularly for Microsoft 365
            investigations.
          touchpoints:
            - Reviewer-reported workflow; client names and payer are not disclosed.
        - stage: '3'
          label: Connector setup
          detail: The reviewer describes detailed integration walkthroughs and says setup can be easier.
          touchpoints:
            - Integration effort is a reported adoption friction, not a quantified deployment-time metric.
        - stage: '4'
          label: Active investigation and hardening
          detail: The reviewer describes anomaly alerts, investigation pivots, and security-hardening recommendations.
          touchpoints:
            - Single reviewer account; no usage telemetry or frequency data.
        - stage: '5'
          label: Reported outcomes
          detail: >-
            The reviewer reports some investigations reduced from days to a day or less; Sacra reports anonymized
            savings and time-to-insight examples.
          touchpoints:
            - No independent measurement method or matched control is provided.
        - stage: '6'
          label: Commercial expansion signal
          detail: Public sources report customers in >$100,000 and >$1 million annual-spend tiers.
          touchpoints:
            - No cohort progression, retention, customer concentration, or renewal evidence.
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU009
      - CU013
      - CU014
      - CU016
    approximationNotes: >-
      Ordered evidence map, not a measured conversion funnel; stage sequence does not imply that every customer follows
      these steps.
  - id: FR001
    title: Risk heatmap with evidence-limited likelihood
    type: matrix
    summary: >-
      Potential impact is qualitative; likelihood remains unquantified because the assigned sources provide no Obsidian
      incident rate or independent control test.
    data:
      columns:
        - Likelihood evidence
        - Potential impact
      rows:
        - label: OAuth token or integration compromise
          values:
            - External examples only; company likelihood unknown
            - High if realized
        - label: Runtime-policy miss or delayed enforcement
          values:
            - No independent efficacy measurement
            - High if production actions are affected
        - label: SaaS API or permission drift
          values:
            - Company-specific rate not disclosed
            - Material to high if coverage degrades
        - label: Customer or cash concentration
          values:
            - Denominators and runway unavailable
            - Material; magnitude unquantified
        - label: Privacy, legal, and certification posture
          values:
            - Obsidian-specific status not established in this pool
            - Potentially material if data or assurance obligations are unmet
        - label: Leadership continuity and execution
          values:
            - Public listing names CEO and eight others; depth unverified
            - Potentially material if key-role gaps impede execution
