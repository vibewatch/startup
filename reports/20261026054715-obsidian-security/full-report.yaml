              - CP012
              - CP013
      - number: '3.3'
        title: Pricing, lock-in, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Public scale signals are not directly comparable across the two specialists. SiliconANGLE reports
              Obsidian's August 2026 Series D at an $1.1 billion post-money valuation and more than 100 customers
              spending over $100,000 annually, with more than 14 above $1 million; these are company-reported
              customer-spend thresholds, not disclosed revenue or ARR. Calcalist reports Zenity's $125 million Series C
              and approximately $185 million in total funding, while describing its customer base as large enterprises.
              CyberCompanyProfiles reports Obsidian's free tier and quote-based paid tiers, but the assigned evidence
              lacks comparable competitor prices, discounts, contract terms, churn, multi-homing, or migration costs.
              Its warning that large platforms could bundle alternatives is a plausible displacement risk, not a
              measured outcome. Buyer references, renewal data, and controlled win/loss evidence are needed before
              asserting a durable moat.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
