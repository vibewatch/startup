      - number: '4.2'
        title: Recurring economics and sales efficiency remain unpriced
        blocks:
          - type: paragraph
            body: >-
              Neither the disclosed customer-spend bands nor the financing coverage establishes gross margin, net
              revenue retention, churn, customer concentration, customer acquisition cost, payback, sales-cycle length,
              or service-delivery cost. Menlo Ventures' 2022 portfolio-investment post said Obsidian had seen 5x growth
              in deals of $100,000 or more over the preceding year. That is a historical deal-count growth proxy from an
              investor with a portfolio relationship; it is not current bookings growth, revenue growth, CAC efficiency,
              or payback. No pricing schedule or realized discount data in the assigned materials lets a reader
              translate annual customer spend into list price or recognized revenue. As a result, the market-facing
              evidence is stronger on customer scale than on revenue quality or margin path. The unit-economics table
              marks each unavailable field as a diligence request rather than filling gaps with SaaS assumptions.
            claimRefs:
              - CI009
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI014
              - CI015
      - number: '4.3'
        title: Capital raised does not establish runway or valuation support
        blocks:
          - type: paragraph
            body: >-
              SiliconANGLE reported an $85 million Series D led by Crescent Cove Advisors at a $1.1 billion post-money
              valuation on August 4, 2026; Unite.AI reported total funding above $200 million after the round. The
              proceeds were described as supporting research and development and go-to-market investment, while Dealroom
              reported that the company said the funding should carry it to positive cash flow. No source in this
              assigned evidence quantifies current cash, burn, debt, working capital, capex, or the timing and
              assumptions behind that target. Funding raised is a historical flow, not cash currently available, and the
              target is not evidence that positive cash flow has been reached. The Next Web's caution that not every
              AI-security company will grow into its price is relevant downside context; without company revenue or
              margins, no revenue-multiple or cash-runway conclusion is supportable.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
              - CI013
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The reported customer bands cannot support a revenue multiple
            body: >-
              More than 100 customers above $100,000 in annual spend and more than 14 above $1 million are useful scale
              indicators, but they do not disclose total revenue, ARR, recognized revenue, margin, or valuation
              denominator. The $1.1 billion post-money valuation therefore cannot be translated into a company revenue
