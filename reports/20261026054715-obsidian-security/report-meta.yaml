  topStrengths:
    - >-
      The August 2026 Series D provides a recent $85 million financing signal and a reported $1.1 billion post-money
      valuation.
    - >-
      Company-reported spend tiers include more than 100 customers above $100,000 annually and more than 14 above $1
      million, alongside 60 Fortune 500 customers.
    - >-
      The product direction extends SaaS-security capabilities into AI-agent permissions and runtime governance in
      third-party applications.
  topRisks:
    - >-
      No audited ARR, recognized revenue, growth, gross margin, retention, or customer-concentration data is available
      to establish durable economics.
    - >-
      The reported valuation is difficult to assess without company revenue figures, and sector-level market estimates
      do not establish a comparable multiple for Obsidian.
    - >-
      Agent-security specialists and broader security platforms are competing for adjacent use cases, while public
      sources provide no independent efficacy benchmark or comparative win-rate evidence.
  unresolvedGaps:
    - >-
      Obtain audited ARR and recognized revenue, a revenue bridge from the disclosed customer-spend tiers, and
      year-over-year growth.
    - >-
      Obtain gross margin, retention, churn, CAC/payback, customer concentration, cash, burn, debt, and runway
      disclosures.
    - >-
      Reconcile the reported $204.5 million of priced equity with the full round history and clarify ownership and
      investor control rights.
    - >-
      Identify named customer deployments and independently verify outcomes, product efficacy, connector coverage,
      privacy controls, and certifications.
    - Confirm current headcount and the company's operating footprint beyond its reported Palo Alto headquarters.
