companyProfile:
  summary: >-
    Obsidian Security is a privately held cybersecurity company founded in 2017 and headquartered in Palo Alto. Its
    public product positioning combines security for third-party SaaS applications with governance of AI-agent activity
    and access. The company announced an $85 million Series D in August 2026 at a reported $1.1 billion post-money
    valuation, while audited recurring financials and independently tested product efficacy remain undisclosed.
