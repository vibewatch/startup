summary:
  headline: >-
    Obsidian pairs substantial enterprise-spend signals with a credible AI-agent-governance position, but opaque
    recurring economics make its $1.1 billion mark difficult to underwrite and favor tracking over conviction pricing.
  overallScore: 6.3
  recommendation: track
