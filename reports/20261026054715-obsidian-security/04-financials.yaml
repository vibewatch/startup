schemaVersion: "report-v2"
artifact: financials
slug: obsidian-security
runDate: 2026-10-26
company:
  name: Obsidian Security
chapter:
  number: 4
  title: Financials
  summary: >-
    Public reporting offers customer-spend tiers and the terms of an $85 million
    Series D, but does not establish company-wide revenue, recurring-revenue
    quality, unit economics, or runway. The financing and stated positive-cash-flow
    objective are not substitutes for cash, burn, or margin disclosure, so the
    available evidence supports a material underwriting gap rather than a
    revenue-based valuation conclusion.
sections:
  - id: visible-commercial-traction
    title: Commercial traction is visible, but not revenue
    body: >-
      SiliconANGLE reported that CEO Hasan Imam described more than 100 customers
      paying over $100,000 per year and more than 14 paying over $1 million
      annually; Unite.AI and other coverage repeated those company-reported tiers.
      These are customer-spend thresholds, not an aggregate revenue figure, ARR,
      recognized revenue, or a customer count distribution. Unite.AI separately
      reported that 60 Fortune 500 companies were in the customer base, again
      without a disclosed denominator for deployment scope, contract value, or
      timing. The evidence therefore supports enterprise reach and a high-spend
      cohort, but not revenue concentration, growth rate, renewal quality, or
      realized pricing. The available materials also do not describe distinct
      revenue streams, contract terms, or accounting treatment. The table keeps
      those evidence-backed customer tiers separate from the private metrics
      needed to convert them into an underwriting-grade revenue bridge.
    claimRefs: [CI003, CI004, CI005, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: economics-not-disclosed
    title: Recurring economics and sales efficiency remain unpriced
    body: >-
      Neither the disclosed customer-spend bands nor the financing coverage
      establishes gross margin, net revenue retention, churn, customer
      concentration, customer acquisition cost, payback, sales-cycle length, or
      service-delivery cost. Menlo Ventures' 2022 portfolio-investment post said
      Obsidian had seen 5x growth in deals of $100,000 or more over the preceding
      year. That is a historical deal-count growth proxy from an investor with a
      portfolio relationship; it is not current bookings growth, revenue growth,
      CAC efficiency, or payback. No pricing schedule or realized discount data
      in the assigned materials lets a reader translate annual customer spend
      into list price or recognized revenue. As a result, the market-facing
      evidence is stronger on customer scale than on revenue quality or margin
      path. The unit-economics table marks each unavailable field as a diligence
      request rather than filling gaps with SaaS assumptions.
    claimRefs: [CI009, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-and-valuation
    title: Capital raised does not establish runway or valuation support
    body: >-
      SiliconANGLE reported an $85 million Series D led by Crescent Cove Advisors
      at a $1.1 billion post-money valuation on August 4, 2026; Unite.AI reported
      total funding above $200 million after the round. The proceeds were
      described as supporting research and development and go-to-market
      investment, while Dealroom reported that the company said the funding
      should carry it to positive cash flow. No source in this assigned evidence
      quantifies current cash, burn, debt, working capital, capex, or the timing
      and assumptions behind that target. Funding raised is a historical flow,
      not cash currently available, and the target is not evidence that positive
      cash flow has been reached. The Next Web's caution that not every
      AI-security company will grow into its price is relevant downside
      context; without company revenue or margins, no revenue-multiple or
      cash-runway conclusion is supportable.
    claimRefs: [CI001, CI002, CI006, CI007, CI008, CI013, CI015]
    tableRefs: []
tables:
  - id: TI001
    title: Reported customer-spend indicators
    columns: [Indicator, Reported value, Attribution and interpretation, Underwriting limitation]
    rows:
      - ["Customers above annual spend threshold", "More than 100 above $100,000 per year", "CEO-reported in SiliconANGLE; also repeated by other coverage", "Not aggregate revenue, ARR, recognized revenue, or a full customer distribution"]
      - ["Customers above annual spend threshold", "More than 14 above $1 million per year", "CEO-reported in SiliconANGLE; also repeated by other coverage", "Does not disclose contract terms, renewal, concentration, or realized margin"]
      - ["Fortune 500 customers", "60", "Reported by Unite.AI as part of the customer base", "Does not specify deployment scope, spend, or revenue contribution"]
      - ["Company-wide revenue / ARR", null, "Not quantified in the assigned public materials", "Request audited revenue, ARR definition, period, and revenue-recognition bridge"]
    notes: >-
      Customer spend thresholds and customer counts are reported company metrics,
      not independently audited revenue; null means the assigned evidence does
      not disclose a value.
    claimRefs: [CI003, CI004, CI005, CI014]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Question, Evidence in assigned materials, Status, Diligence request]
    rows:
      - ["Revenue streams", "Enterprise platform customer-spend tiers are reported", "Partial; product/revenue mix is not stated", "Revenue by product, service, and customer cohort"]
      - ["Price per unit or contract", null, "Not disclosed", "Price metric, contract term, minimum commitment, and renewal schedule"]
      - ["List versus realized pricing", null, "Not disclosed", "Current price book, discounts, and realized ACV by cohort"]
      - ["Revenue recognition", null, "Not disclosed", "Audited accounting policy and deferred-revenue / bookings reconciliation"]
    notes: >-
      This table distinguishes reported customer spend from price, bookings, and
      recognized revenue; null means no value is available in the assigned
      evidence.
    claimRefs: [CI003, CI004, CI014]
  - id: TI003
    title: Unit economics and capital inputs required for underwriting
    columns: [Metric, Value in assigned evidence, Why it matters, Diligence request]
    rows:
      - ["Gross margin", null, "Determines contribution economics and margin path", "Gross margin by product and delivery-cost bridge"]
      - ["CAC and payback", null, "Tests whether growth is capital efficient", "Fully loaded acquisition cost, cohort payback, and attribution period"]
      - ["Sales cycle and win rate", null, "Tests enterprise GTM efficiency", "Median cycle, conversion, and win rates by segment"]
      - ["Retention, churn, and NRR", null, "Tests recurring revenue durability and expansion", "Logo and dollar retention cohorts, gross churn, and NRR definitions"]
      - ["Cash burn and runway", null, "Determines financing dependency and time to target", "Current unrestricted cash, monthly net burn, and runway calculation"]
      - ["Debt, working capital, and capex", null, "Can create obligations beyond reported financing", "Debt schedule, payment terms, working-capital needs, and capex plan"]
    notes: >-
      No unsupported estimates are supplied; null means the assigned evidence
      does not disclose the metric. Funding proceeds and accounting earnings
      cannot substitute for cash balance or cash burn.
    claimRefs: [CI014, CI015]
