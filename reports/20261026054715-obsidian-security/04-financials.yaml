    title: "Revenue-to-cash underwriting bridge: disclosed inputs and gaps"
    type: flow
    summary: >-
      Customer-spend tiers and financing are reported, but conversion to
      recognized revenue, gross profit, and cash runway is not quantified.
    data:
      nodes:
        - id: customer-spend
          label: Customer spend
          detail: "Reported: 100+ customers above $100,000/year; 14+ above $1 million/year"
        - id: recognized-revenue
          label: Recognized revenue
          detail: "Company-wide revenue, ARR, contract terms, and recognition bridge not disclosed in assigned evidence"
        - id: gross-profit
          label: Gross profit
          detail: "Gross margin and service-delivery costs not disclosed"
        - id: operating-cash
          label: Operating cash flow
          detail: "Cash balance, burn, working capital, and runway not disclosed"
        - id: series-d
          label: Series D financing
          detail: "$85 million raised; proceeds described for R&D and go-to-market"
        - id: cash-flow-target
          label: Positive-cash-flow target
          detail: "Company-reported target; timing and assumptions not stated"
      edges:
        - from: customer-spend
          to: recognized-revenue
          label: "conversion not quantified"
        - from: recognized-revenue
          to: gross-profit
          label: "margin not disclosed"
        - from: gross-profit
          to: operating-cash
          label: "cash conversion not disclosed"
        - from: series-d
          to: operating-cash
          label: "funding is not cash-on-hand disclosure"
        - from: operating-cash
          to: cash-flow-target
          label: "target, not achieved result"
    approximationNotes: >-
      Conceptual underwriting sequence only; connectors do not represent
      measured conversion, revenue, margin, or cash-flow values.
    claimRefs: [CI003, CI004, CI001, CI007, CI008, CI014, CI015]
callouts:
  - calloutType: risk
    title: The reported customer bands cannot support a revenue multiple
    body: >-
      More than 100 customers above $100,000 in annual spend and more than 14
      above $1 million are useful scale indicators, but they do not disclose
      total revenue, ARR, recognized revenue, margin, or valuation denominator.
      The $1.1 billion post-money valuation therefore cannot be translated into
      a company revenue multiple from this evidence.
    claimRefs: [CI002, CI003, CI004, CI014]
