company:
  name: Obsidian Security
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Obsidian Security is a privately held, Palo Alto-based cybersecurity company
    founded in 2017 that now positions its SaaS-security platform around governing
    AI agents and non-human identities in third-party applications. Its August
    2026 Series D established a reported $1.1 billion post-money valuation, while
    audited financials, ownership and control rights, a current full leadership
    roster, and company-specific adverse-event evidence remain gaps in the
    assigned sources.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: >-
      Mandos and The Next Web both place Obsidian's founding in 2017, while Mandos
      and the company's August 2026 release identify Palo Alto, California as its
      headquarters. The company's current positioning is narrower than a generic
      cloud-security label: it says it governs data, AI, and agents operating
      inside third-party applications, and its August release describes runtime
      controls intended to detect or block excessive access and policy violations.
      That describes the product thesis, not independently demonstrated prevention
      efficacy. The assigned evidence supports a private-company classification
      and a latest reported Series D, but does not establish a complete product
      portfolio, audited deployment outcomes, or a current geographic footprint.
    claimRefs:
      - CO001
      - CO002
      - CO003
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Mandos lists Hasan Imam as CEO on a profile updated in October 2026, and
      SiliconANGLE identifies him as chief executive in its August funding
      coverage. Menlo Ventures' investor perspective names founders Matt Wolff,
      Glenn Chisholm, and Ben Johnson and records historical operating roles:
      Wolff as chief scientist, Chisholm as chairman and CPO, and Johnson as CTO.
      Menlo is an investor, so that account is useful relationship evidence rather
      than an independent current board roster. The currently assigned pool does
      not establish whether those historical roles remain unchanged, the full
      executive team, board composition, voting control, or succession coverage.
      Those limits matter because the company remains private and the Series D
      investor list does not disclose ownership or governance rights.
    claimRefs:
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO002
  - id: financing-and-scale
    title: Financing, valuation, and operating scale
    body: >-
      Obsidian announced an $85 million Series D led by Crescent Cove Advisors on
      August 4, 2026; SiliconANGLE independently reported the same round and
      $1.1 billion post-money valuation. Mandos' October profile reports $204.5
      million of priced equity across four rounds, while Caplight's preview
      separately lists an unexplained “Early Funding” entry; the total and round
      count bases are not fully reconciled. The company says more
      than 100 customers spend over $100,000 annually, more than 14 spend over
      $1 million, and 60 Fortune 500 companies are customers. These are
      company-reported commercial indicators, not audited revenue,
      ARR, retention, or customer concentration. The release and Caplight's
      preview name overlapping backers, but neither provides ownership shares
      or control rights. Mandos estimates approximately 269 employees as of
      September 2026; no source supplies an audited headcount, burn, runway, or
      operating margin.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO011
      - CO012
      - CO013
      - CO014
    tableRefs:
      - TO003
  - id: milestones-and-open-evidence
    title: Milestones and unresolved diligence
    body: >-
      The funding record shows a progression from early priced rounds to the
      unicorn-marked Series D, alongside a product shift toward agent governance.
      Caplight's public preview supplies dates for Series A through Series D and
      an “Early Funding” entry, but displays no amounts and does not explain that
      2025 entry. Obsidian announced SaaS AI agent defense in September 2025 and
      said in August 2026 that it was extending native governance controls to
      Claude Code and Cowork; these are product-announcement milestones, not
      proof of customer adoption or control effectiveness. The
      Next Web adds a valuation caution, noting that not every AI-security
      startup will grow into its price. No assigned source establishes a
      company-specific lawsuit, regulatory action, outage, or security incident;
      that is an evidence limitation, not evidence that none exists. The dated
      timeline is therefore selective rather than a complete corporate history.
    claimRefs:
      - CO001
      - CO007
      - CO010
      - CO015
      - CO016
    figureRefs:
      - FO001
