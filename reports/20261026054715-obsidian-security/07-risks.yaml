    title: Risk heatmap with evidence-limited likelihood
    type: matrix
    summary: >-
      Potential impact is qualitative; likelihood remains unquantified because
      the assigned sources provide no Obsidian incident rate or independent
      control test.
    data:
      columns:
        - Likelihood evidence
        - Potential impact
      rows:
        - label: OAuth token or integration compromise
          values:
            - External examples only; company likelihood unknown
            - High if realized
        - label: Runtime-policy miss or delayed enforcement
          values:
            - No independent efficacy measurement
            - High if production actions are affected
        - label: SaaS API or permission drift
          values:
            - Company-specific rate not disclosed
            - Material to high if coverage degrades
        - label: Customer or cash concentration
          values:
            - Denominators and runway unavailable
            - Material; magnitude unquantified
        - label: Privacy, legal, and certification posture
          values:
            - Obsidian-specific status not established in this pool
            - Potentially material if data or assurance obligations are unmet
        - label: Leadership continuity and execution
          values:
            - Public listing names CEO and eight others; depth unverified
            - Potentially material if key-role gaps impede execution
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR010
      - CR012
      - CR014
      - CR015
