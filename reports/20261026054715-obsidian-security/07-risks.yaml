schemaVersion: "report-v2"
artifact: risks
slug: obsidian-security
runDate: 2026-10-26
company:
  name: Obsidian Security
chapter:
  number: 7
  title: Risks
  summary: >-
    The most decision-relevant risks are unverified runtime-control efficacy,
    inherited SaaS and OAuth blast radius, unknown customer concentration, and
    unresolved legal and compliance evidence. External incidents and company
    product claims establish the risk mechanisms, not that Obsidian suffered an
    incident or that its controls failed.
sections:
  - id: control-and-incident-risk
    title: Runtime controls face an evidence gap
    body: >-
      The assigned evidence supports a high-impact threat model, but not a
      company-specific security failure. Token Security describes a separate
      Salesloft-Drift OAuth compromise that reached Salesforce customer
      environments; The Next Web describes how an over-permissioned or hijacked
      agent could move quickly across enterprise applications. Neither source
      reports an Obsidian incident, and Token Security is a competing vendor
      promoting its own controls (CR004, CR005). Obsidian's runtime enforcement
      is described in company-issued material and a CEO interview, while the
      WorkOS comparison says the product monitors activity after authentication.
      WorkOS is a competitor, not an independent benchmark; the pool contains no
      deployment test, independent red-team result, false-positive rate, or
      enforcement-latency measurement (CR001, CR002, CR003). Treat prevention
      claims as unverified until customer evidence demonstrates coverage,
      fail-open behavior, and response under machine-speed activity. The matrix
      therefore separates unknown likelihood from potential impact rather than
      assigning incident probabilities (FR001). The operational register is
      deliberately ranked by potential consequence and identifies the evidence
      needed to assess mitigation maturity (TR002).
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: legal-and-regulatory
    title: Legal and regulatory posture remains unverified
    body: >-
      The assigned pool contains no regulator, court, certification, contract,
      or company compliance record that establishes Obsidian's current legal
      posture. This is a scoped evidence gap, not evidence that litigation,
      enforcement, or a compliance failure exists. Privacy and AI-governance
      obligations will depend on the data processed, customer use cases, and
      the company's contractual role; those facts are not established in this
      source set (CR012). The regulatory register is a partial list of
      diligence scenarios, not a finding that any specific regime applies.
      Until current counsel-reviewed applicability and control evidence are
      supplied, both likelihood and mitigation maturity remain unassessed and
      residual exposure is material (TR001). Obtain current legal and
      compliance records before relying on certifications, customer
      representations, or applicability conclusions.
    claimRefs:
      - CR012
    tableRefs:
      - TR001
  - id: commercial-and-partner-dependencies
    title: Customer, platform, and financing dependencies need diligence
    body: >-
      Reported customer and financing indicators do not resolve concentration
      or cash-availability risk. SiliconANGLE attributes to CEO Hasan Imam
      claims that more than 14 customers paid over $1 million annually and
      more than 100 paid over $100,000 per year as of the August 2026
      interview; the report gives neither a total customer denominator nor
      customer revenue shares, and the tiers may overlap (CR014). SiliconANGLE
      and The Next Web both report an $85 million Series D at a $1.1 billion
      post-money valuation, but neither metric is cash available or runway
      (CR006, CR007). Dealroom says the company expects the proceeds to carry it
      to positive cash flow; that is a reported expectation, not a cash-flow
      result (CR011). Meanwhile, a market report lists major platform vendors
      expanding agent-security capabilities, and SiliconANGLE reports a
      substantial adjacent-market round, increasing execution and competitive
      pressure (CR009, CR013). The dependency register separates customer,
      SaaS-platform, and capital-provider exposures (TR003); diligence should
      obtain concentration, renewal, integration, burn, and runway schedules.
    claimRefs:
      - CR006
      - CR007
      - CR009
      - CR011
      - CR013
      - CR014
    tableRefs:
      - TR003
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk domain and scenario
      - Jurisdiction and known status
      - Likelihood and impact
      - Mitigation maturity and residual exposure
      - Diligence path
    rows:
      - - Privacy and customer-data handling
        - >-
          Applicable regimes and data roles are unverified; no current DPA,
          subprocessor list, retention schedule, or data-flow record was in the
          assigned sources.
        - Likelihood unquantified; impact could be high if sensitive SaaS data
          were exposed.
        - Mitigation not independently assessed; residual exposure is material
          pending control evidence.
        - Obtain current DPA, data-flow and retention maps, subprocessor list,
          access-control evidence, and independent audit reports.
      - - AI-governance obligations
        - >-
          Applicability depends on product function and customer use; no
          regulator or counsel record in the assigned sources determines
          jurisdiction or role.
        - Likelihood unknown; impact could be high for regulated or high-impact
          customer workflows.
        - Mitigation maturity unverified; residual exposure remains material
          until applicability is mapped.
        - Have counsel map intended uses, customer roles, applicable regimes,
          control owners, and evidence obligations.
      - - Contract, IP, and third-party data rights
        - >-
          Current customer terms, SaaS API conditions, model-provider terms,
          and IP provenance were not established by the assigned sources.
        - Likelihood unknown; impact could be high if processing or
          indemnification rights are insufficient.
        - Mitigation maturity unverified; residual exposure is material.
        - Review customer and vendor agreements, data-use limits, model terms,
          OSS/IP provenance, and allocation of security liability.
    notes: >-
      Partial qualitative scenarios based on the assigned source pool; no
      primary legal, regulator, contract, certification, or audit record was
      allocated, so likelihood and mitigation maturity are unverified.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of public legal and regulatory diligence scenarios relevant to
        the assigned evidence; this is not a complete jurisdictional register.
    claimRefs:
      - CR002
      - CR004
      - CR015
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood evidence
      - Potential severity
      - Mitigation maturity and residual exposure
      - Unresolved gap and monitoring trigger
    rows:
      - - OAuth token or non-human-identity compromise across SaaS
        - An external Salesloft-Drift incident is reported; no Obsidian incident
          rate is available.
        - High potential impact through trusted access, data exposure, and
          follow-on credential misuse.
        - Obsidian describes monitoring and runtime controls, but independent
          efficacy is unverified; residual exposure is material.
        - Obtain tenant-level incident history and test token scope, revocation
          time, audit visibility, and unusual export alerts.
      - - Runtime policy miss, delayed enforcement, or false positive
        - No independent deployment, red-team, latency, or false-positive
          measurement was present in the assigned sources.
        - High potential impact if an agent action changes or exports
          production data before intervention.
        - Company product claims are not an independent control test; residual
          exposure is unquantified.
        - Review red-team results, enforcement latency, false-positive and
          false-negative rates, fail-open behavior, and customer escalations.
      - - SaaS API, OAuth-scope, or integration-coverage drift
        - Integration coverage, provider-specific failure rates, and API-change
          response times were not quantified in the assigned sources.
        - Material to high impact if permissions or telemetry become incomplete
          without detection.
        - Product coverage is described but not independently validated;
          residual exposure is unverified.
        - Obtain a supported-integration matrix, scope inventory, API-change
          monitoring process, and outage and recovery records.
      - - Agent, model, or MCP inventory and policy drift
        - Company-issued material describes inventory features; no independent
          completeness or update-latency test was assigned.
        - Material to high impact if unsanctioned tools or model substitutions
          evade policy.
        - Mitigation claim is unverified; residual exposure is material until
          coverage and update cadence are tested.
        - Test discovery coverage across sanctioned and unsanctioned agents,
          MCP servers, model substitutions, and customer environments.
    notes: >-
      Qualitative scenarios only. The external incident is not evidence of an
      Obsidian breach; company and competitor descriptions do not establish
      control effectiveness.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR008
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency and counterparty
      - Role and concentration evidence
      - Failure scenario and potential severity
      - Mitigation and residual exposure
      - Monitoring and diligence
    rows:
      - - Enterprise SaaS platforms and OAuth/API providers
        - >-
          Company materials describe controls across third-party applications;
          platform-level customer mix and integration concentration are not
          disclosed in the assigned sources.
        - Provider API changes, outages, or revoked scopes could impair
          visibility or enforcement; severity may be high for affected
          workflows.
        - Redundancy, provider-specific fallbacks, and customer notification
          practices are unverified; residual exposure is material.
        - Request provider coverage and concentration by customer, API-change
          SLAs, fallback modes, and outage history.
      - - Large customer and revenue-tier exposure
        - >-
          CEO-reported tiers were more than 14 customers above $1 million
          annually and more than 100 above $100,000 per year; total customer
          count, overlap, and revenue shares are not reported in the source.
        - Loss or contraction of a small number of large accounts could affect
          growth and cash conversion; likelihood is unquantified.
        - Retention and mitigation by account are unknown; residual exposure
          cannot be quantified.
        - Obtain customer-level revenue bands, renewal dates, churn, expansion,
          gross retention, and top-customer shares.
      - - Series D capital provider and cash conversion
        - >-
          News reports describe an $85 million Series D led by Crescent Cove
          Advisors; available cash, burn, runway, and drawdown terms are not
          disclosed in the assigned sources.
        - The round may not fund planned execution through cash-flow break-even;
          severity is material, with probability unquantified.
        - Dealroom reports management expected proceeds to carry the company
          to positive cash flow; this is not verified cash-flow performance.
        - Obtain current cash, monthly burn, runway, financing terms, milestones,
          and downside hiring or spending plans.
    notes: >-
      Public reporting and company-attributed statements provide partial
      dependency signals, not counterparty concentration, cash availability, or
      independently verified operating outcomes.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR011
      - CR014
figures:
