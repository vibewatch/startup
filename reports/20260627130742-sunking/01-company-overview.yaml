company:
  name: "Sun King"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sun King is a global leader in off-grid solar energy, serving 25+ million homes across Africa and Asia with pay-as-you-go solar systems. The company achieved unicorn status in 2022 with a $330M Series D led by BII and continues to attract major investment, including a $40M equity round from Lightrock in December 2025."
sections:
  - id: identity
    title: "Company Identity & Overview"
    body: |
      Sun King (formerly Greenlight Planet) is a global leader in off-grid solar energy solutions, providing pay-as-you-go (PAYG) solar home systems to customers without reliable electricity access across sub-Saharan Africa and South Asia. Founded in 2007 by Patrick Walsh and Anish Thakkar at the University of Illinois at Urbana-Champaign, the company was incorporated in the United States and later relocated its operational headquarters to Nairobi, Kenya. The company rebranded from Greenlight Planet to Sun King in 2023 to better align with its flagship product brand recognized across emerging markets.

      Sun King designs, manufactures, and distributes solar-powered products ranging from portable lanterns to complete home systems with TVs, fans, and refrigerators. The company pioneered the PAYG model in off-grid solar, enabling low-income customers to acquire solar systems through affordable daily mobile money payments rather than prohibitive upfront costs. This innovative approach has enabled Sun King to serve over 25 million homes and impact more than 100 million people globally.

      The company operates an extensive distribution network spanning Kenya, Uganda, Tanzania, Nigeria, Zambia, Democratic Republic of Congo (DRC), Ethiopia, Mozambique, and several Asian markets including India and Bangladesh. Sun King employs approximately 2,000 full-time staff and works with over 40,000 field sales agents who serve as the last-mile connection to rural customers.
    claimRefs: [CO001, CO002, CO003, CO004, CO013]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership
    title: "Leadership & Governance"
    body: |
      Sun King is led by co-founder Patrick Walsh, who serves as Chief Executive Officer, bringing deep expertise in renewable energy access and social enterprise leadership. Co-founder Anish Thakkar serves in a strategic advisory capacity after his tenure as CEO. The leadership team includes experienced executives from both development finance and consumer technology backgrounds.

      The company has attracted a high-quality investor base including development finance institutions (DFIs) such as British International Investment (BII, formerly CDC Group), International Finance Corporation (IFC), and Proparco, alongside commercial impact investors like Lightrock, LeapFrog Investments, and FMO. This institutional backing provides both capital and governance expertise, with board representation from major investors ensuring alignment with both commercial and impact objectives.

      Sun King's governance structure reflects its dual mission of commercial sustainability and social impact. The company publishes annual Sustainable Finance Reports detailing environmental and social metrics, and has received recognition from TIME magazine as one of the 100 Most Influential Companies of 2026 for its contribution to climate action and energy access.
    claimRefs: [CO015, CO016, CO031, CO032, CO033]
    tableRefs: [TO002]
  - id: funding
    title: "Funding History & Capital Structure"
    body: |
      Sun King has raised over $700 million in total capital across equity rounds, debt facilities, and securitization structures. The company achieved unicorn status in 2022 following a $330 million Series D round led by British International Investment (BII), valuing the company at over $1 billion. This landmark round included participation from existing investors LeapFrog Investments and responsAbility, along with new backers Lightrock and Norfund.

      In December 2025, Sun King secured a $40 million equity investment from Lightrock, the global impact investing platform backed by LGT, the private bank of the Liechtenstein Princely Family. This investment reinforces continued investor confidence in the company's growth trajectory and impact mission. Additionally, in July 2025, the company closed a $156 million securitization facility arranged by Citi, representing one of the largest off-grid solar receivables transactions in the sector's history.

      The company has also secured substantial debt financing, including an $80 million loan facility from IFC to support expansion in Nigeria and broader West African markets. Sun King's capital structure reflects a sophisticated approach combining equity, project finance, and innovative securitization instruments appropriate for its asset-heavy, receivables-based business model.
    claimRefs: [CO005, CO006, CO007, CO008, CO014, CO017, CO023]
    tableRefs: [TO003]
    figureRefs: [FO002]
  - id: operations
    title: "Operational Scale & Key Metrics"
    body: |
      Sun King has achieved significant operational scale, producing approximately 330,000 solar kits monthly by 2025. The company has powered over 25 million homes and served more than 100 million people across its operational markets. The direct distribution model through 40,000 field agents enables deep market penetration in rural areas beyond traditional retail reach.

      The company operates manufacturing facilities in China and has expanded local production with a new factory in Kenya opened in October 2025, creating 3,000 direct jobs. A planned manufacturing facility in Nigeria is expected to further localize production and reduce import dependencies. This manufacturing strategy supports both cost optimization and regional economic development objectives.

      Sun King's PAYG technology platform processes millions of mobile money payments monthly, with integration to M-Pesa, MTN Mobile Money, and other leading mobile payment providers. The company's data analytics capabilities enable sophisticated credit scoring for unbanked customers with limited formal financial histories, reducing default rates while expanding access.
    claimRefs: [CO009, CO010, CO011, CO012, CO019, CO022, CO030]
    figureRefs: [FO003]
  - id: milestones
    title: "Strategic Milestones & Recent Developments"
    body: |
      Sun King's trajectory includes several transformative milestones. The 2022 Series D at unicorn valuation established the company as a category leader. The 2023 rebrand from Greenlight Planet to Sun King unified the company's corporate and product identities. The October 2025 Kenya manufacturing facility launch marked a strategic shift toward localized production.

      Recognition in TIME100's Most Influential Companies for 2026 underscores Sun King's impact leadership. The December 2025 Lightrock investment and July 2025 $156 million securitization demonstrate continued capital market confidence. The company's announcement of plans to raise $1.3 billion in fresh capital signals ambitious expansion objectives.

      Sun King continues to expand its product portfolio beyond basic solar home systems to include larger-capacity systems, solar-powered refrigerators, and financing for agricultural equipment like solar water pumps. This product evolution addresses the broader energy needs of customers as they move up the energy ladder from basic lighting to productive use applications.
    claimRefs: [CO018, CO021, CO024, CO025, CO026]
    tableRefs: [TO004]
