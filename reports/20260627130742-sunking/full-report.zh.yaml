              Sun King 的发展路径中有多个关键转折。2022 年按独角兽估值完成 Series D 轮，确立了公司的品类龙头位置。2023 年从 Greenlight Planet 更名为 Sun
              King，统一了公司身份和产品身份。2025 年 10 月肯尼亚制造设施投产，标志着公司向本地化生产做出战略转向。


              入选 TIME100 2026 年最具影响力公司，凸显 Sun King 的影响力领导地位。2025 年 12 月 Lightrock 投资和 2025 年 7 月 $156M
              证券化，显示资本市场信心仍在。公司宣布计划新募 $1.3B 资本，释放出激进扩张目标。


              Sun King 持续把产品组合从基础太阳能家用系统扩展到更大容量系统、太阳能冰箱，以及太阳能水泵等农业设备融资。客户从基础照明走向生产性用途之后，能源需求变宽，产品演进正是在回应这条升级路径。
