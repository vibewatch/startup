  - id: TV005
    title: 论点破裂与终止触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - PAYG 违约率飙升
        - 肯尼亚或尼日利亚 12 个月群组逾期率 >15%
        - 应收账款池受损；证券化承压；投资者信心受伤
        - 退出仓位；暂停新增承诺；要求审计组合
      - - 非洲外汇篮子贬值
        - KES/NGN/UGX 组合 12 个月内兑 USD 贬值 −30%
        - 美元计价应收款被侵蚀；证券化契约有违约风险；融资更难
        - 降低敞口；重新进入前要求披露对冲
      - - $1.3B 融资停滞或折价轮
        - 18 个月内未完成融资，或估值低于 $900M
        - 显示投资者重估；股权结构承压；人才留存有风险
        - 要求过桥条款或退出；复核 DFI 共同投资人立场
      - - 关键 DFI 降低敞口
        - BII 或 IFC 拒绝跟投或寻求退出
        - DFI 尽调提示未披露的运营 / 财务问题
        - 立即退出；DFI 对组合的了解优于公开信息
      - - 管理层离职
        - CEO 或 CFO 离职，且没有可信内部继任者
        - 执行连续性有风险；投资者信心受冲击
        - 持有；密切监控；新增资本前要求治理更新
    notes: 触发器是基于 PAYG 行业基准和 DFI 投资标准设定的示例阈值；公司特定阈值未公开披露。
    claimRefs:
      - CV049
      - CV050
      - CV051
      - CV052
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 财务表现
        - FY2022–2025 经审计合并利润表、资产负债表和现金流量表
        - 没有财务报表，估值和 IRR 模型都是推测
        - 向 CFO 索取；作为 term sheet 条件
      - - PAYG 组合健康度
        - 按国家、产品和年份批次拆分的违约、逾期和核销率
        - 核心信用风险指标；决定应收账款账面价值和证券化条款
        - 向 CFO/CRO 索取；审查贷款级样本数据
      - - 股权结构和优先权
        - 完整股权结构，含优先权层级、期权池和转换机制
        - 决定普通股分配瀑布；退出经济性取决于清算优先权
        - 通过 data room 索取；审查法律文件
      - - $1.3B 融资条款
        - 投资者承诺、定价基准、交割后备考股权结构
        - 进入估值和稀释取决于新一轮如何定价
        - 关注媒体；term sheet 签署后向 IR 索取
      - - 外汇对冲政策
        - 按国家拆分的对冲工具、对冲比例和对冲成本
        - 外汇是应收款价值最大的外部风险
        - 索取资金政策文件；审查衍生品头寸
      - - 退出路径分析
        - 投行编制或内部退出分析；IPO 可行性研究；战略买家范围
        - 承销退出 IRR 必需；行业退出规模一直偏小或处于困境
        - 委托独立退出顾问；审查 M&A 可比交易
    notes: 尽调要求按重要性排序。1–3 项是任何资本承诺的阻断项；4–6 项重要，但可在 term sheet 之后部分补足。
    claimRefs:
      - CV053
      - CV054
      - CV055
      - CV056
