              Sun King 已证明自身可重复进入资本市场：2023 年 $130M，2025 年再做 $156M，均以肯尼亚先令计价，并由商业银行支持。Moody's 对可持续金融框架给出的 Very
              Good（SQS2）评级验证了应收款质量。部署资本、回收付款、证券化应收款、再部署——这套飞轮是资产轻融资引擎，让公司能快速扩张，而不完全依赖股权稀释。
