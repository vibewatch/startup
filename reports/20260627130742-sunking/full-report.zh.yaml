      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >
              到 2025 年，撒哈拉以南非洲离网太阳能市场年收入约 $2-3B，其中 PAYG 太阳能贡献了大部分销售额。GOGLA 报告称，2025 年全球售出 1020 万套离网太阳能套件，撒哈拉以南非洲占比超过
              90%（926 万套）。


              **TAM 分析：** 可服务市场包括撒哈拉以南非洲 571-600 百万缺电人口，对应 100-120 百万户家庭的潜在需求。按每套系统 $100-200 的平均价值计算，仅太阳能家用系统的 TAM 就超过
              $15B。若纳入生产性用途应用、微电网和经常性服务，到 2030 年可服务市场接近 $30-50B。


              **市场增长：** 2025 年该行业销量同比增长 15%；2025 年上半年 PAYG 销售激增 54%，现金销售下降 35%。Mordor Intelligence
              预计，在技术成本下降、移动支付渗透率提升和发展金融机构（DFI）补贴驱动下，市场到 2031 年将以 22-26% 的 CAGR 增长。


              **区域动态：** 东非仍是最大市场，2025 年售出 743 万套（同比增长 13%），由肯尼亚、乌干达和坦桑尼亚领跑。西非在尼日利亚 World Bank 支持项目带动下快速修复，增长
              33%。南亚是次要市场，印度和孟加拉国潜力显著。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
