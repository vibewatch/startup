      - number: '3.6'
        title: 反向证据与替代风险
        blocks:
          - type: paragraph
            body: >
              多个数据点挑战了「Sun King 竞争位置可维持 5-10 年」这一假设。第一，The Economist 记录到，非洲 PAYG 太阳能公司在最初 2-3
              年付款计划到期、第一代系统需要维护时，面临更高客户违约率和电池更换成本压力——没有竞争对手在披露的单元经济中公开计入这些成本。这意味着随着组合成熟，PAYG 太阳能公司的财务表现会恶化，并给包括 Sun King
              在内的所有既有玩家施压。


              第二，M-KOPA 成功转向更广消费金融科技，说明随着太阳能部件商品化，独立 PAYG 太阳能不太可能提供长期盈利所需的利润率。M-KOPA 现在从非太阳能产品获得有意义的收入份额，这意味着 Sun King
              过去聚焦能源的产品路线图，可能需要延伸到相邻金融服务或生产性用途融资，才能维持增长。公司进入农业设备融资和生产性用途太阳能（泵、制冷）是多元化早期信号，但执行时间表和财务贡献仍不透明。


              第三，SEforALL 数据显示，非洲 6 亿多能源贫困人口中，迄今只有 10-15%
              获得离网太阳能服务，说明剩余市场很大——但这也意味着最容易服务的客户（靠近道路、收入稳定）可能大多已经被拿下。未来增长需要触达更难服务、收入更低、更偏远、信用画像更差的人群。随着可服务市场转向信用质量较低的客户，所有
              PAYG 太阳能运营商的单元经济都会承压。


              第四，KPMG 2026 clean energy outlook 指出，由 World Bank 和 African Development Bank
              支持的电网延伸项目正在尼日利亚、埃塞俄比亚和东非加速。随着电网触达当前未服务地区，这会对离网太阳能需求构成长期威胁。虽然形成有意义替代需要 10 年以上，但以长期现金流给 Sun King
              估值的投资人，应在终值假设中建模电网延伸风险。
