      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              Sun King 的供应链高度集中于中国制造商，超过 90%
              的组件和成品来自中国工厂。中美贸易紧张升级、出口管制扩大，以及关税外溢到非洲进口制度——尤其是尼日利亚日益保护主义的立场——构成系统性中断风险。公司已于 2025 年 10
              月开设肯尼亚制造工厂，并计划建设尼日利亚工厂，但这些设施解决的是组装和最后一公里本地化，而不是组件制造；核心硅料、电芯和半导体供应链仍依赖中国。任何地缘政治冲击——美国或欧盟制裁中国太阳能供应链、港口中断或货币管制——都可能打断每月
              330,000 台的产量。


              PAYG 技术平台每月处理数百万笔移动钱包收款，覆盖 M-Pesa、MTN Mobile Money、Airtel Money 等。Safaricom 的 M-Pesa
              若发生持续宕机——它在肯尼亚收入中占比过高——将使收款停止并触发流动性压力。Safaricom 历史上曾周期性出现服务中断。支付之外，Sun King 的远程锁定执行依赖 GSM
              连接；埃塞俄比亚或莫桑比克农村网络中断，可能让实物取回成为唯一执行机制，大幅抬高运营成本。肯尼亚工厂是单一设施；任何火灾、劳资纠纷或设备故障，都会限制整个东非履约链。


              一线代理质量和流失是持续运营脆弱点。40,000+
              名代理大多是非正式承包商，知识传递、销售行为合规以及销售时做出的系统性能主张都很难审计。误导销售——尤其是对较大生产性用途电器夸大负载能力——会带来监管和声誉后果。公司记录了培训合规项目，但第三方验证有限。
