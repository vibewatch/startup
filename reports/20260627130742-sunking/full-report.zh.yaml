      - number: '4.3'
        title: 成本结构、利润率、营运资金与资本开支
        blocks:
          - type: paragraph
            body: >
              Sun King 的成本结构反映其「硬件 + 融资」混合模式。硬件成本包括零部件采购（主要来自中国）、入境物流、关税，以及自 2025 年 10 月肯尼亚制造设施投产以来越来越多的本地组装（产能：700,000
              套 / 年）。离网领域的太阳能硬件公司通常报告按制造成本计算 30–50% 毛利率，但 PAYG
              结构叠加了额外成本：代理佣金（占单套收入的可观比例）、移动支付交易费、应收账款违约拨备，以及占用在未偿贷款中的营运资金资本成本。


              营运资金强度是 PAYG 模式最核心的财务特征。Sun King 累计 $1.3–1.5B 客户融资，代表庞大的应收账款浮存；在证券化把它们转为流动资本之前，公司必须先为其融资。证券化结构——肯尼亚 2023 年
              $130M、2025 年 $156M，加上尼日利亚 $80M——提供了循环资本的机制，但也带来安排费、信用增级成本，以及维持经审计回款数据以获得商业银行参与资格的要求。Sun King 2025 年 $156M
              交易是南非以外非洲最大证券化，证明这套飞轮在肯尼亚跑得通；尼日利亚因奈拉汇率波动和国内资本市场较浅，结构上更难。


              资本开支正在增长：肯尼亚制造设施和规划中的尼日利亚设施，连同技术基础设施（锁定 / 解锁控制系统、PAYG 平台、Kazi app），都代表重大固定投资。具体 capex 数字未公开披露。2025 年 5 月
              $80M IFC/Stanbic IBTC 尼日利亚贷款，以及 2023 年 $20M BII/Stanbic 营运资金工具，提供了部分持续使用信贷工具的可见度。
