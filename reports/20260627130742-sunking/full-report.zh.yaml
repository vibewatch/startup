      - number: '4.6'
        title: 财务结论：收入质量、利润率路径与尽调阻断点
        blocks:
          - type: paragraph
            body: >
              Sun King 的财务模型确有真实且少见的优势。PAYG 应收款证券化证明了客户基础的信用质量：在肯尼亚，商业银行如今是优先级贷款人，而不只是发展金融机构。$450 million 本币资本，以及
              Moody's 对可持续金融框架给出的 Very Good（SQS2）Second Party Opinion，都释放出机构信心。2017–2025 年月产量增长 33 倍，显示公司能在规模下执行。GOGLA
              报告称 2025 年 PAYG 出货量增长 48%，行业顺风是真实存在的。


              核心担忧是资本强度。Sun King 的模式，是在存在结构性汇率波动的市场里，向缺少正式金融记录的客户发放信用并由此产生收入。每增加 $100 million 客户规模，大致就需要通过证券化或股权循环投入
              $100 million 资本。计划筹集 $1.3 billion
              不是困境信号，但说明公司尚未在目标增速下做到自我供血。若全球信用市场收紧、发展金融机构重新定价风险，或宏观冲击导致肯尼亚或尼日利亚付款拖欠，再融资周期可能被扰动。没有任何关于现金头寸、烧钱速度、违约率或毛利率的公开数据，这一风险无法量化。


              收入质量为中高：PAYG
              融资收入具有重复性，客户切换成本高（硬件已装在家中，付款历史已积累），产品解决的是真实且非可选需求（能源）。利润率路径不清晰，且结构上有挑战——硬件毛利面临中国制造商竞争，本地组装仍在早期，营运资本成本也会抬高有效成本基数。结论是：在重大私有尽调支持下具备可投资性；仅凭公开信息不可投资。主要阻断点包括收入未披露、公开毛利数据为零、尼日利亚外汇敞口未量化、违约率没有独立审计。
