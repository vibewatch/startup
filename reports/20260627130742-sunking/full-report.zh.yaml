  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              离网太阳能市场包括向缺少可靠电网接入的家庭和企业销售的太阳能产品与服务。主要细分市场包括：


              **太阳能家用系统（SHS）：** 提供照明、手机充电和小家电供电的完整系统，通常为 10-200 瓦。这是 Sun King 的核心市场，也是按收入计最大的细分市场。


              **便携灯与微型太阳能：** 提供基础照明和手机充电的入门产品，通常低于 10 瓦。它们是首次购买太阳能客户的入口。


              **生产性用途应用：** 面向创收活动的更高容量系统，包括太阳能水泵、制冷和小企业设备。这是正在兴起的增长细分市场。


              **微电网：** 服务多个家庭或企业的社区级供电系统。Sun King 目前不进入这一细分市场。


              地理范围覆盖撒哈拉以南非洲（主要市场）和南亚（次要市场），这些地区电网基础设施有限或不可靠。买方画像集中在日收入 $2-10 的低收入农村和城郊家庭，通常通过移动支付支持的 PAYG
              融资付款，而不是一次性现金购买。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
