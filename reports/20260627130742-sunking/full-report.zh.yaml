      - number: '6.5'
        title: 扩张与集中度
        blocks:
          - type: paragraph
            body: >
              Sun King 的集中度模式并不寻常：在单个客户层面可能相当分散，因为数百万家庭都在小额付款；但在国家、资金和渠道层面集中。东非仍是最大的离网太阳能区域，因此 Sun King
              最强的装机基础很可能绑定在少数移动钱包发达市场，尤其是肯尼亚、乌干达和坦桑尼亚。尼日利亚是最清晰的当前扩张方向，并受到 African Development Bank 太阳能可及融资和 IFC
              项目参与的强化。肯尼亚也仍是扩张重点，公开报道围绕其触达更多百万家庭的计划。家庭之外，Sun King
              可通过电器、逆变器系统、机构销售和生产性用途场景提升单客平均收入，尤其是在家庭已经信任该品牌的地方。主要限制因素是应收款融资、宏观波动，以及 PAYG 运营商或 Azuri、Angaza
              等软件层赋能者提供的竞争替代方案。由于公开披露对流失和违约很薄，尽调重点应少问需求是否存在——需求显然存在——而更多关注按国家和产品层级划分的组合表现哪里最强。
