            body: >
              Sun King 已经形成显著运营规模，到 2025 年每月生产约 330,000 套太阳能套件。公司在运营市场已为超过 2500 万户家庭供电，服务超过 1 亿人。依托 40,000
              名田野代理的直销模式，让公司能打进传统零售难以覆盖的农村地区。


              公司在中国运营制造设施，并通过 2025 年 10 月投产的肯尼亚新工厂扩大本地生产，创造 3,000
              个直接就业岗位。规划中的尼日利亚制造设施预计将进一步推动生产本地化，降低进口依赖。这一制造策略同时服务于成本优化和区域经济发展目标。


              Sun King 的 PAYG 技术平台每月处理数百万笔移动支付，并接入 M-Pesa、MTN Mobile Money
              等领先移动支付服务商。公司的数据分析能力可为缺少正式金融记录、没有银行账户的客户做更精细的信用评分，在扩大接入的同时降低违约率。
