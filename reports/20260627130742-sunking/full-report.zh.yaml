      - number: '3.4'
        title: 分销力量、锁定与多归属
        blocks:
          - type: paragraph
            body: >
              Sun King 40,000
              多人的自有田野代理网络，是竞争组中最可防守的结构性优势。代理扎根农村社区，上门做信用评估、收取首付款，并提供售后支持——这些功能是电信伙伴分销模式在深度农村场景中很难复制的。M-KOPA 嵌入 Safaricom
              的模式在肯尼亚城市和城郊走廊效率高，但在移动代理密度低的地区表现较弱。BBOXX 在 DRC 的零售门店模式在城市 DRC 很有效，但在农村非洲存在结构性限制。d.light
              的混合零售模式带来更广地理覆盖，但客户亲密度较浅，PAYG 捕获率也更低。


              Sun King 客户的锁定分多层发生。硬件层面，Sun King 的 PAYG 设备使用专有令牌解锁系统（客户必须付款才能继续使用），在付款计划期内形成强锁定（通常 18-36
              个月）。关系层面，田野代理持续接触客户，为追加销售和产品升级铺路。数据层面，Sun King 掌握 2500 万多名客户的支付历史，竞争对手无法获取——这些数据支持复购信用评分，显著降低下一件产品的获客成本。


              多归属（同时使用多个 PAYG 服务商）在实践中少见，因为 PAYG 计划的经济性要求 12-36
              个月承诺；若一个家庭同时从两家服务商获得系统，就要承担双倍日付款压力。不过，在产品品类边界上可以出现多归属：一个家庭可能从 d.light 购买微型灯用于做饭照明，同时从 Sun King 获取完整
              SHS，这代表不同层级上的部分多归属。随着电信公司加深在支付基础设施中的角色，分销力量——尤其是与 MTN、Safaricom 和 M-Pesa 运营方签署排他协议的能力——正成为越来越重要的竞争战场。
