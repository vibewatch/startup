      - number: '8.6'
        title: 最终尽调要求与打破论点的触发器
        blocks:
          - type: paragraph
            body: >
              任何投资者若在当前成长股权阶段评估 Sun King，投前必须完成五项尽调。第一，至少三个财年的经审计合并财务报表——利润表、资产负债表和现金流量表，并拆出国家层面盈利情况。第二，PAYG
              组合表现数据，包括发放量、按 vintage 划分的逾期率、核销率，以及按国家和产品层级切分的回收率。第三，完整资本表，包含优先权堆栈细节、期权池规模和转换机制。第四，计划中 $1.3B
              融资的条款和结构，包括投资者承诺、定价基准和时间表。第五，管理层薪酬结构、共同投资和与退出对齐的归属安排。


              打破论点的触发器分三层：财务、运营和宏观。肯尼亚或尼日利亚（两大市场）PAYG 违约率超过 15%，将意味着信用模型出现结构性恶化，并威胁应收款证券化计划。非洲一篮子货币在 12 个月内对美元合计贬值超过
              30%，会实质侵蚀应收款账本的美元价值，并可能触发证券化契约违约。若 $1.3B 融资在 18 个月内无法完成，将造成资金缺口，迫使公司接受 down-round 或收缩运营。BII 或 IFC
              退出投资财团——表现为降低敞口或拒绝参与后续融资——将是领先信号，说明成熟 DFI 尽调可能发现了未披露问题。


              终止标准刻意绑定可观察、可衡量的事件，而不是软性的市场信号。Angaza PAYG 平台和类似技术提供商会定期发布行业还款率数据，在私有数据可得前，可用作 Sun King 组合健康度的代理指标。
