            body: >
              公开采用证据在触达范围上远强于收入质量。Sun King 称其已为超过 2,500 万户家庭供电、影响超过 1 亿人；当前 impact page 显示已供电 2,720 万户、售出 3,150
              万件太阳能产品，并拥有 41,000+ 名一线代理。Business Daily Africa 另行报道了 2,500
              万户家庭里程碑，帮助印证量级。运营版图至少覆盖东非、西非、中非和南亚十个优先市场，东非仍是行业最重要的区域需求中心。GOGLA 2025 年市场报告显示，东非约占非洲 1,305 万台离网太阳能设备中的 743
