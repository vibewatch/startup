  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价与收入结构
        blocks:
          - type: paragraph
            body: >
              Sun King 的主要收入机制是按用付费（PAYG）太阳能融资——本质上是披着能源订阅外衣的消费信贷产品。客户先支付名义首付（通常 $20–50 USD），再通过 M-Pesa、MTN Mobile
              Money、Airtel Money 等移动支付平台按日、周或月小额付款，日付最低可至 $0.15–0.19。完成全部付款后——通常历时 6 到 24
              个月——客户完全拥有硬件，系统后续运行不再产生成本。付款期内，Sun King 保留远程锁机能力；一旦断供，系统会被停用，把原本难做的消费信贷产品变成「不付费就失去使用权」的工具。


              收入流横跨多个产品层级：入门级灯具、基础太阳能家用系统（SHS）、带家电的多灯系统（风扇、电视、冰箱）、面向家庭和企业的大型逆变器系统，以及不断增长的融资智能手机组合。定价架构从低于 $50
              的基础灯具，到数百美元的逆变器系统。自成立以来，Sun King 累计向客户发放约 $1.3–1.5B 融资。按每月新增部署 330,000 套、平均系统价格 $75–150 估算，隐含年度总部署价值为
              $297–$594M；不过 PAYG 收入在付款期内分期确认，而不是前置确认。


              碳信用和生产性用途融资（太阳能水泵、农业设备）代表早期收入多元化。公司的智能手机融资项目仿照 PAYG 太阳能，让已证明持续付款行为的客户通过同一每日小额支付基础设施获得智能手机。Sun King 的 PAYG
              融资模式同时是产品交付渠道和嵌入式微型金融工具——融资收入体现为高于资本成本的利差，但公司没有单独披露。
