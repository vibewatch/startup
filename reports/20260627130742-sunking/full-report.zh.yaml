      - number: '8.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >
              Sun King 的资本结构叠加了股权、夹层、项目债和证券化，反映出这家公司先用自身资产负债表为太阳能硬件融资、再把应收款货币化的资本密集属性。2022 年由 British International
              Investment（BII）领投的 $330M Series D 确立了独角兽估值。此后，Lightrock 在 2025 年 12 月投入 $40M 股权，2025 年 7 月 Citi 安排 $156M
              证券化，说明投资者在当前估值水平仍有信心；但两笔交易都没有指向明显更高的股权标价。


              IFC 面向尼日利亚扩张提供的 $80M 贷款被归为项目 / 结构性债务，而非股权，因此保留了早期投资者的股权分配瀑布。Proparco 隶属 AFD Group，2025 年在近 200 个项目中承诺
              €2.5B，历史上曾与 BII 一起投资 Sun King，也很可能参与计划中的 $1.3B 融资。Norfund 的投资则加入了北欧 DFI 维度，这在斯堪的纳维亚双边气候融资中很典型。


              资本表上的优先权压力很重要，但具体结构未知。累计融资 $700M+，其中包括可转债工具，完全摊薄后的优先清算权堆栈很可能在 $400–600M。尽调必须盯住这一点：如果退出价值低于
              $1.2B，普通股股东和员工可获得的价值很少。商业少数股投资者若以 $1.5–2B 进入，只要退出目标达到 $2.5B+，优先权压力就没那么关键。


              $156M 证券化证明 PAYG 应收款账本可以规模化货币化——这降低了未来表外融资风险，也支撑了走向轻资产增长的路径。交易由 Citi 安排，并有 FMO
              参与，显示公司具备机构级结构化融资能力。行业内可比交易包括 M-KOPA 2019 年 $20M 票据及后续融资工具；但 Sun King 的 $156M 是有记录以来最大的离网太阳能证券化。
