      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Sun King 的商业模式在结构上依赖少数关键第三方平台。最突出的是 M-Pesa：Sun King 在肯尼亚超过 60% 的客户通过 Safaricom 的 M-Pesa 平台支付 PAYG 款项，而
              Safaricom 处于近乎垄断的位置（截至 2025 年中，在肯尼亚移动钱包市场份额 89%+，虽在下降但仍占主导）。Safaricom 任何提费、API 政策变化或强制数据共享要求，都会直接压缩 Sun
              King 的单位经济性和收款效率。M-Pesa 向莫桑比克、坦桑尼亚和乌干达的国际扩张，为 Sun King 在这些市场扩张带来机会，也带来依赖集中风险。


              资本提供方集中是第二层脆弱性。Sun King 2025 年 7 月由 Citi 安排的 $156M
              证券化工具，是单一最大的结构化资本工具；若到期时无法再融资或展期——无论原因是应收款质量信号恶化、美元利率上升，还是 DFI 风险偏好下降——都会给营运资本带来显著压力。DFI
              贷款人（BII、IFC、FMO、Proparco、Norfund）合计持有 Sun King 非股权资本的大部分。DFI 往往设置社会和环境约束条款；若 Sun King
              影响指标恶化或发生重大安全事件，可能触发违约或加速还款。


              中国组件供应商集中造成上游依赖。前五大中国硬件供应商很可能占电芯和太阳能组件采购的大部分，尽管 Sun King 未公开披露供应商名单。若竞争对手 M-KOPA 或 d.light
              锁定优先供货协议，或某家中国制造商因监管被关停，Sun King 按预算成本获取硬件的能力会受限。GOGLA
              关于融资可及性的研究指出，许多离网太阳能公司都因组件价格波动和物流成本上升而经历利润率压缩。公司计划中的尼日利亚工厂仍未建成，其本地化战略存在实质缺口。
