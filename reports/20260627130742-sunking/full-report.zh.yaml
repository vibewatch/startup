        - 非洲最大离网太阳能区域，与 Sun King 最强且移动支付成熟的市场重合
        - 对需求高度正向，但也形成区域依赖
        - 按肯尼亚、乌干达、坦桑尼亚及周边市场拆分放款、回款和损失
      - - 尼日利亚 DFI 支持扩张
        - 扩张
        - AfDB 和 IFC 参与，支持进入高需求但宏观波动大的市场并规模化增长
        - 上行空间高，执行风险中高
        - 要求尼日利亚州级单位经济性和汇率对冲方案
      - - 电器和系统向上销售
        - 扩张
        - 现有照明客户可升级到电视、风扇、更大 SHS 和逆变器系统
        - 如果复购行为真实，对 LTV 高度正向
        - 向管理层索取升级率和附加购买率队列
      - - 应收账款融资依赖
        - 集中风险
        - PAYG 增长依赖债务、证券化和混合融资，而非纯客户现金购买
        - 如果资金成本上升或投资人收缩，风险高
        - 审阅仓储融资条款、证券化触发条件和契约余量
      - - 竞争替代方案
        - 集中风险
        - Azuri、M-KOPA、d.light、Bboxx，以及 Angaza 等平台赋能方，都在争夺客户、代理或融资注意力
        - 定价和渠道经济性存在中等风险
        - 绘制重点地区的竞争胜率和产品层面份额
      - - 留存和违约数据不透明
        - 集中风险
        - 公开触达指标很强，但组合质量指标很薄
        - 尽调风险高，因为仅凭公开来源无法完整观察客户质量
        - 获取组合表现材料，覆盖活跃账户、违约、流失和按账龄划分的回收
    notes: 风险并不集中在某个具名客户，而更多集中在地域、移动支付通道和融资市场。多项条目基于推断，因为公开组合数据不完整。
