  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 从市场规模、商业证明、风险因素和估值背景，推导至「跟踪」建议的逻辑链。
    data:
      nodes:
        - id: market
          label: 市场规模
          description: 600M+ 人口未通电；离网 TAM 超 $10B；GOGLA 年增长 15%
        - id: proof
          label: 商业证明
          description: 25M+ 家庭；累计融资超 $700M；已完成 $156M 证券化
        - id: risks
          label: FX 与信用风险
          description: 多国家 FX；PAYG 违约不透明；依赖 DFI
        - id: valuation
          label: 估值背景
          description: 2022 年标记估值超 $1B；相对自由现金流偏紧；股东名册由 DFI 主导
        - id: track
          label: 跟踪
          description: 等待盈利能力证据和 $1.3B 融资定价；下次估值标记时重新评估
      edges:
        - from: market
          to: track
          label: 支撑
        - from: proof
          to: track
          label: 支撑
        - from: risks
          to: track
          label: 约束
        - from: valuation
          to: track
          label: 约束
    approximationNotes: 该流程是对建议逻辑的定性呈现；各节点权重是基于现有公开证据做出的分析判断。
