      - number: '7.5'
        title: 缓释措施、否决标准与尽调问题
        blocks:
          - type: paragraph
            body: >
              Sun King 的主要风险缓释包括地域多元化（15+ 个国家限制单一市场集中度）、IFC 和 BII 机构背书（提供资本缓冲和压力下约束条款豁免）、遵循 GOGLA Consumer Protection
              Code（降低监管意外），以及持续投资本地制造（尼日利亚工厂投产后将部分对冲供应链暴露）。Citi 安排的证券化向资本市场证明了应收款质量可信，并打开再融资路径。但若干缓释仍处早期，或依赖未来行动。


              投资 thesis 的否决标准包括：（1）任一单一主要市场（肯尼亚、尼日利亚）PAYG 违约率显著恶化至账面价值 25% 以上，并连续两个季度持续；（2）NERC 或 EPRA
              执法导致运营暂停或强制产品召回；（3）M-Pesa API 政策变化施加交易费或数据共享要求，使 PAYG 单位经济性结构性转负；（4）未能在 18 个月内完成已声明的 $1.3B
              融资，使资本部署能力低于维持当前增长轨迹所需水平；（5）高级管理层离任（CEO Patrick Walsh 或 CFO 等同职位），且 60 天内未宣布可信继任计划。


              关键尽调问题包括：按国家提供 vintage cohort 违约数据的独立应收款审计、FY2024 和 FY2025 经审计财务报表、Citi 证券化的 DFI
              约束条款和合规证书、肯尼亚和尼日利亚的数据保护合规认证、更名后所有市场的确认商标注册状态，以及独立验证一线代理误导销售投诉率。
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
