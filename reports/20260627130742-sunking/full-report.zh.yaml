      - number: '7.4'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >
              最具结构性的财务风险是货币错配：Sun King 主要以美元筹资，却以肯尼亚先令、乌干达先令、尼日利亚奈拉和其他本币收取 PAYG 收入。自 2023 年浮动以来，尼日利亚奈拉兑美元贬值超过 60%，AfDB
              还预计 2025 年会再贬值
              6%。埃塞俄比亚比尔和莫桑比克梅蒂卡尔也出现类似动态。由于硬件成本和债务服务以美元计价，外汇贬值会直接侵蚀应收款的真实价值并压缩利润率。这些货币的对冲工具昂贵、流动性差或不可得，资产负债表上留下剩余敞口。


              PAYG 信用 / 违约风险是第二个重大财务威胁。PAYG 模型向缺少正式信用记录的客户提供隐性信用。离网太阳能行业在压力期的违约率历史上曾达到账面价值的 10-20%，在经历通胀冲击或收入中断的经济体中可升至
              30%+（例如 COVID-19、东非干旱周期）。Climate Policy Initiative 对能源可及融资的分析指出，应收款减值是离网太阳能公司资本减记的首要原因。Sun King 通过 Citi
              证券化肯尼亚应收款，验证了某一时点的应收款质量，但底层客户付款行为尚未在严重宏观情景下接受独立压力测试。


              资本强度是模型可扩展性的结构性约束。每增加一个客户，公司必须先为完整系统成本融资（COGS 加安装），再通过 12-24 个月 PAYG 收款回收。在每月 330,000 台、平均系统成本 $80-120
              的情况下，意味着每月营运资本部署 $26M-$40M，远超任何单一 DFI 工具。公司表示计划筹集 $1.3 billion
              新资本，正是这一缺口的信号，但资本市场准入并无保证，对现有股东的稀释也很实质。由于公开财务披露有限，外部很难评估烧钱和资金续航风险；缺少经审计财务本身就是证据缺口，也是投资人风险。
            claimRefs:
