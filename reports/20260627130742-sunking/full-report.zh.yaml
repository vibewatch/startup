      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              情景分析锚定三个合理未来，核心差异在于：Sun King 能否以有利条款完成 $1.3B 融资，非洲外汇是否稳定，以及公司能否在 2029 年前实现息税前利润（EBIT）盈亏平衡。


              牛市情景下，Sun King 到 2026 年底以 $2.5–3B 估值完成 $1.3B 融资，用资金扩大尼日利亚和刚果（金）分销，进入生产性用途融资（太阳能水泵、冷链），并在 2028 年实现 EBIT
              盈亏平衡。若通过 IPO，或被公用事业公司 / 大型清洁能源企业战略收购，以 $3–4B 退出，相对当前 $1B 估值可实现 3–4x 回报。关键驱动包括核心市场外汇稳定、尼日利亚制造爬坡成功、GOGLA
              行业增速维持每年 12–15%。


              基准情景下，$1.3B 融资以温和上调估值完成（名义估值 $1.5–1.8B），外汇逆风持续但没有明显恶化，公司到 2030 年实现盈亏平衡。2028–2030 年以 $2–2.5B 退出，相对当前估值可实现
              2–2.5x。概率信号是：该基准情景与 2025 年资本市场活动，以及 CPI 气候融资轨迹显示的持续增长相一致。


              熊市情景下，$1.3B 融资停滞，或以不高于 2022 年 $1B 估值的价格完成（down-round）。驱动因素包括全球利率上行、尼日利亚外汇恶化（AfDB 提示 2025 年奈拉最多可能贬值 6%），以及
              PAYG 违约率升至 15% 以上。股权价值压缩至 $600M–$900M，DFI 投资者承受损失并开始降低敞口，商业退出机会枯竭。Wood Mackenzie 对非洲电力市场风险的分析，以及
              responsAbility 面向 PAYG 太阳能的信用风险框架，都把这些渠道列为主要下行传导机制。
