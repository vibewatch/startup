      - number: '5.3'
        title: 制造、供应链与部署
        blocks:
          - type: paragraph
            body: >
              Sun King 的主要硬件制造基地在中国。2025 年 10 月，公司在肯尼亚内罗毕开设首个非洲制造工厂，目标年产能 700,000
              台，初期生产电视和智能手机。公司计划在尼日利亚建设第二座工厂，以支持西非供应链本地化；尼日利亚工厂尚未公开宣布确认开工日期。


              肯尼亚工厂雇用了数百名本地员工，并提供技术培训和技能发展项目。Sun King
              在终端市场附近生产电视和智能手机，目标是降低物流成本、碳排放和进口依赖，同时让更多经济价值留在非洲经济体内。随着制造可行性得到确认，公司正在评估把肯尼亚工厂扩展到更多产品线。


              产品交付和售后服务依赖约 40,000 名一线代理，覆盖 Sun King 15+ 个国家。这些代理负责最后一公里销售、客户注册、免费安装（所有 EasyBuy SHS 购买均包含）和持续支持。Sun King
              的 SHS 产品提供两年硬件保修；PowerHub 逆变器系统提供三年保修。HomePlus 电池按典型日常使用标称 10 年寿命（2,500+ 完整循环），PowerHub 系统每次充电周期最多提供 8
              小时备电。面向机构客户，Sun King 提供带可用性保证的 EaaS 合同，由地面技术团队提供响应式和预测性维护。产品耐用性设计包括适合农村部署环境的 8 米防鼠太阳能板电缆。
