      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Sun King 运营直面消费者的分销模式，核心是遍布运营市场的 40,000–41,000 多名田野销售代理。这些代理在传统零售基础设施够不到的农村和城郊地区逐户上门。除直接田野销售外，公司还在 12
              个国家拥有 440 多家门店，并发展数字渠道。这套端到端模式覆盖产品设计、制造、末端交付、安装、PAYG 融资和长期保修支持，让 Sun King 区别于碎片化的纯分销模式。


              Sun King 自有 Kazi app 支撑代理生产力和销售管理，为代理提供客户追踪、逾期付款提醒、任务管理和免费通话能力。该 app 是一层 GTM 技术，小型竞争对手难以复制。LeapFrog
              的组合数据表明，Sun King 每月通过 PAYG 模式连接超过 250,000 个新的低收入和中等收入家庭，意味着月度获客节奏达到这一量级。约 2,000 名全职员工管理 40,000
              多名代理，这一比例显示每名 FTE 杠杆很高。客户获客成本（CAC）和代理佣金结构未公开披露。


              在肯尼亚，Sun King 注册 PAYG 客户约一半为女性；全部客户中 65–90%
              生活在各自国家贫困线以下。这一人口画像显示强社会影响力，也凸显需求对收入冲击、补贴项目连续性和移动支付基础设施可靠性的敏感度。2026 年 6 月 TIME100
              认可，以及按客户数计的行业领先地位，确认了品牌领导力；但基于公开数据，仍无法与同行做可比 LTV/CAC 基准分析。
