      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: LFP 电池化学体系是耐用品质护城河
            body: >
              Sun King 在 HomePlus SHS 系列中使用磷酸铁锂（LFP/LiFePO4）电池，标称 10 年、2,500+ 完整循环；在潮湿热带气候中，相比使用更便宜 NMC
              或铅酸替代方案的竞争者，这是真实的耐用性优势。LFP 电池热稳定性更强，在部分日循环下衰减更低，日历寿命更长。电池是 SHS 中最昂贵、也最容易出故障的部件；这一化学体系选择是可信的质量信号，并由 VeraSol
              按 IEC 标准独立验证，直接支撑两年保修并降低长期售后成本。
            calloutType: strength
            claimRefs:
              - CE010
              - CE019
              - CE026
              - CE030
          - type: callout
            title: PAYG 设备锁定与消费者保护风险
            body: >
              Sun King 的 PAYG 模型会在客户错过付款时锁定设备。这种做法作为信用控制机制有效，但带来实质性消费者保护风险：合同期内失去电力的家庭，会在照明、食物储存和创收活动上立刻受损。GOGLA 的
              Consumer Protection Code 明确规范锁定如何执行、投诉解决时限和价格透明。Sun King 未公开披露 CPC 自评分、按产品层级划分的 EasyBuy
              违约率，或合同生命周期内至少经历一次设备锁定的客户比例。这些指标对负责任投资分析和声誉风险管理都很重要。
            calloutType: risk
            claimRefs:
              - CE031
              - CE037
          - type: callout
            title: 尽调优先项：后端韧性、多法域隐私与违约数据
            body: >
              三项尽调事项高于其他事项。第一，Sun King 公开隐私政策在 Greenlight Planet 名下引用印度法律，导致其在 15+ 个运营国家、面对不同数据保护框架时存在未验证合规暴露。第二，PAYG
              后端是单点故障：一旦宕机，所有新激活都会被阻断，并会在错过付款窗口中锁定所有客户。尽调应取得后端 uptime 记录、灾难恢复文件，以及一线代理 app 和 keycode API
              的最近一次渗透测试报告。第三，EasyBuy 违约率和还款完成率未公开披露；这些是承保信用质量和单位经济性的核心。
            calloutType: recommendation
            claimRefs:
              - CE013
              - CE029
              - CE031
              - CE036
          - type: callout
            title: 非洲制造是战略对冲，不是短期毛利驱动器
            body: >
              Sun King 肯尼亚工厂初期生产电视和智能手机，而不是驱动其核心 PAYG 业务的高出货 HomePlus 或灯具单元。战略价值真实存在：供应链韧性、降低外汇暴露、本地就业和政府关系。但在 700K 台 /
              年产能下，短期内很难与中国制造达到成本平价。投资人应把非洲制造建模为中期对冲物流成本和外汇风险的工具，而不是立即扩张毛利率的驱动器；若产量和激励框架足以支撑，本地化 SHS 生产则是长期可选项。
            calloutType: insight
            claimRefs:
              - CE015
              - CE016
              - CE024
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Sun King 主要服务电网之下或边缘的家庭：农村和城郊家庭需要可靠照明、手机充电、电视、风扇和小型电器供电，但付不起全额预付款。前文把核心买家界定为日收入约 $2-10
              的家庭，本章客户证据与这一画像高度吻合。公司把宽产品阶梯——从接近 $20 区间的入门灯具，到价格超过 $200
              的太阳能家庭系统和电器套装——与融资阶梯结合，让同一家庭可以先从照明起步，之后升级到更大系统。这使「客户」同时是终端用户和信用交易对手。第二类客户包括机构和生产性用途买家，如学校、农业培训中心、独立广播机构和小企业；他们需要的是逆变器级可靠性，而不只是照明。因此付款方可以是户主、学校管理员或微企业主，但各细分市场的分销动作相似：代理获客、移动钱包还款、现场安装或服务，以及长期重复
              upsell。
