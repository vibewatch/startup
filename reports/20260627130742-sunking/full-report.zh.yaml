      - number: '8.5'
        title: 可比估值与退出准备度
        blocks:
          - type: paragraph
            body: >
              给 Sun King 估值需要混合可比框架：用上市清洁能源技术公司提供倍数参考，再用私营 PAYG 同行做行业校准。完美可比公司并不存在：Enphase
              Energy（ENPH）是发达市场住宅太阳能逆变器公司，EV/收入为 10–15x，明显高于前沿市场 PAYG 提供商应获得的倍数。First Solar 做的是公用事业规模业务，EV/EBITDA 为
              6–9x。两者更像天花板，而不是地板。


              私营同行中，M-KOPA 在 2023 年 Series E 达到 $1B+ 估值，并在肯尼亚、乌干达和尼日利亚服务类似 PAYG 消费金融场景，是结构上最接近的参照。d.light 在 2022 年
              Series G 融资 $270M，隐含估值估计为 $300–500M，反映其规模较小、产品组合也更分散。总部位于英国的离网太阳能竞争对手 BBOXX，在转向能源即服务和智能电表运营前，融资隐含估值低于
              $500M。


              Sun King 2022 年 $1B+ 估值是观察到的私营 PAYG 同行区间（d.light、BBOXX 的 $300M–$500M）的 2–3x，但与 M-KOPA 的可比融资足迹一致。溢价很可能来自
              Sun King 更强的分销规模（40,000 名代理，对比最接近同行的 20,000 名）、证券化能力，以及覆盖 15+ 个国家的地域分散。


              退出准备度为中等。Sun King
              还需要两到三年经审计财务数据、国家层面盈利能力证明，以及干净的资本表结构，才能支撑公开市场进程。最可能的退出路径是被大型能源公用事业公司（Enel、TotalEnergies、ENGIE）战略收购，或在内罗毕 /
              伦敦公开市场融资，并为早期 DFI 投资者配套二级出售。Nation Africa 和 TechCabal 都报道过科技相邻公司在 Nairobi Securities Exchange
              上市的潜力，说明本地资本市场深度在改善。
