      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Sun King 由联合创始人 Patrick Walsh 掌舵，他担任首席执行官，在可再生能源接入和社会企业管理上经验深厚。联合创始人 Anish Thakkar 卸任 CEO
              后担任战略顾问。领导团队还包括来自发展金融和消费科技背景的资深高管。


              公司吸引了高质量投资人，包括 British International Investment（BII，前 CDC Group）、International Finance
              Corporation（IFC）、Proparco 等发展金融机构（DFI），以及 Lightrock、LeapFrog Investments、FMO
              等商业影响力投资人。这类机构支持不仅提供资本，也带来治理经验；主要投资人进入董事会，帮助商业目标与影响力目标保持一致。


              Sun King 的治理结构体现其商业可持续性与社会影响力双重使命。公司每年发布 Sustainable Finance Reports，披露环境和社会指标；凭借气候行动和能源接入贡献，公司入选 TIME 杂志
              2026 年 100 家最具影响力公司。
