  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Sun King 在 15 个以上司法辖区运营，每个辖区都有不同的许可、消费者保护、数据隐私和环境合规制度。在肯尼亚，Energy and Petroleum Regulatory
              Authority（EPRA）监管太阳能产品标准，合规失败可能触发召回令或销售禁令；公司快速扩展到冰箱和生产性用途电器等 SKU，让这一风险被放大。尼日利亚的 Nigerian Electricity
              Regulatory Commission（NERC）要求离网电力供应商持有配电授权；2023 年 Electricity Act 修正案扩大 NERC 离网职权后，执法强度已上升。Federal
              Competition and Consumer Protection Commission（FCCPC）已显示出追查技术驱动消费金融运营商未经授权扣款的意愿，这一风险直接适用于 Sun King 的自动
              PAYG 锁定功能。


              数据保护暴露很重要。Kenya's Data Protection Act 2019 和 Nigeria's NDPA 2023 对 PAYG 客户的生物识别或金融数据收集提出严格要求，包括 Sun King
              用于信用评分的使用模式分析。公司未公开披露尼日利亚 Data Protection Officer 任命，不合规罚款最高可达年营业额 2%。在埃塞俄比亚、莫桑比克和
              DRC，移动金融产品法律框架正在快速演进，形成前瞻性监管风险，公司可能面临追溯性合规要求。


              IP 和品牌风险较低，但并非无关紧要。2023 年从 Greenlight Planet 更名为 Sun
              King，需要在所有运营辖区重新注册商标；公司披露显示，这一流程在若干市场仍未完成。竞争对手或恶意注册者可能已在过渡窗口提交冲突商标。GOGLA 的 Consumer Protection Code
              要求能源输出主张必须符合质量标准并保持透明；Sun King 是签署方，但独立合规审计有限。反向来源分析发现一条消费者投诉论坛帖子，指出 Sun King
              系统在乌干达的表现低于广告规格，尽管该问题尚未升级为正式执法。
            claimRefs:
