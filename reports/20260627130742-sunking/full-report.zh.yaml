      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Sun King 通过股权轮、债务工具和证券化结构累计融资超过 $700M。2022 年，British International Investment（BII）领投 $330M Series D
              轮，公司估值超过 $1B，由此成为独角兽。该标志性轮次包括老股东 LeapFrog Investments 和 responsAbility 参投，也引入 Lightrock、Norfund 等新投资人。


              2025 年 12 月，Sun King 获得 Lightrock 的 $40M 股权投资。Lightrock 是由列支敦士登王室私人银行 LGT
              支持的全球影响力投资平台。这笔投资强化了投资人对公司增长轨迹和影响力使命的持续信心。此外，2025 年 7 月，公司完成 Citi 安排的 $156M
              证券化工具，这是该行业历史上规模最大的离网太阳能应收账款交易之一。


              公司还获得了大量债务融资，包括 IFC 提供的 $80M 贷款工具，用于支持尼日利亚及更广泛西非市场扩张。Sun King
              的资本结构把股权、项目融资和创新证券化工具结合起来，适配其资产较重、以应收账款为基础的商业模式。
