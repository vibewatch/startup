      - number: '2.4'
        title: 市场结构与集中度
        blocks:
          - type: paragraph
            body: >
              离网太阳能市场高度集中在垂直一体化 PAYG 运营商手中。Sun King、Zola Electric、M-KOPA、Bboxx、d.light、Engie Energy Access 和 Lumos
              七家公司控制约 72% 的市场投资，合计服务估计超过 1000 万客户。


              这种集中度反映了 PAYG 运营的资本密集属性：硬件、分销网络和客户应收账款都要先垫资。小型运营商难以在规模上跑出单元经济，也很难募集增长所需的股权和债务资本。


              市场已经出现成熟和整合迹象。多家运营商退出或收缩（包括 Fenix International/Engie、Mobisol 等主要玩家），留下的公司则靠内生增长和收购扩张。Sun King
              按销量居于市场第一，在制造、分销和应收账款融资上获得规模经济。


              市场结构因地区而异。东非已有成熟运营商，集中度较高；西非随着新项目扩张，格局仍更分散。南亚则由本土玩家和不同消费融资模式驱动，竞争动态不同。


              **进入壁垒：**


              新进入者面临显著壁垒，包括应收账款融资的资本要求、农村地区分销网络建设、移动支付接入成本、跨多个司法辖区的监管合规，以及在既有玩家拥有先发优势的市场中获客。
            claimRefs:
