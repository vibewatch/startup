      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >
              Sun King 没有公开披露私募市场投资人理想中想看的 SaaS 式留存指标——允许来源集中未找到 NRR、GRR、cohort
              违约率或客户流失序列。即便如此，耐久性并非不可观察；必须从运营代理指标推断。第一，产品信任由 Lighting Global 到 VeraSol 的质量保证谱系，以及 Sun King
              关联产品出现在该生态中来支撑。第二，GOGLA 的消费者保护框架强调透明融资条款、售后支持、保修和投诉处理；对于 PAYG 模型尤其重要，因为客户可能因不付款或产品不满而流失，而不是正式取消订阅。第三，Sun
              King 自身装机基础和贷款发放数据暗示存在大规模服务运营：影响页面引用 $1.71 billion 太阳能贷款发放额，以及 41,000+
              名负责销售、安装和服务产品的一线代理。这些都是有意义的留存支撑，但不能替代硬组合数据。核心尽调结论是：耐久性很可能在运营层面存在，但量化披露不足。
