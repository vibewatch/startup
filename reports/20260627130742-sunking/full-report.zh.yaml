chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与概览
        blocks:
          - type: paragraph
            body: >
              Sun King（前身为 Greenlight Planet）是全球离网太阳能解决方案龙头，为撒哈拉以南非洲和南亚缺少可靠电力的客户提供按用付费（PAYG）太阳能家用系统。Patrick Walsh 和
              Anish Thakkar 2007 年在 University of Illinois at Urbana-Champaign 创办公司，公司在美国注册，后将运营总部迁至肯尼亚内罗毕。2023 年，公司从
              Greenlight Planet 更名为 Sun King，以更贴合其在新兴市场广为认知的旗舰产品品牌。


              Sun King 设计、制造并分销太阳能产品，从便携灯到配有电视、风扇和冰箱的完整家用系统都有覆盖。公司率先在离网太阳能中跑通 PAYG
              模式，让低收入客户不用一次性支付高额前置成本，而是靠负担得起的每日移动支付获得太阳能系统。这套模式帮助 Sun King 服务全球超过 2500 万户家庭，影响超过 1 亿人。


              公司运营覆盖肯尼亚、乌干达、坦桑尼亚、尼日利亚、赞比亚、刚果民主共和国（DRC）、埃塞俄比亚、莫桑比克，以及印度、孟加拉国等多个亚洲市场的庞大分销网络。Sun King 约有 2,000 名全职员工，并与超过
              40,000 名田野销售代理合作，后者承担连接农村客户的末端触点。
