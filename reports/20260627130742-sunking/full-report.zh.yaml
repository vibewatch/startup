      - number: '4.4'
        title: 公开进展与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              Sun King 公开可得的增长指标很亮眼，也能被多方独立来源交叉印证。到 2025 年底，公司每月部署约 330,000 套太阳能套件（2017 年为每月 10,000 套，八年增长 33
              倍）。自成立以来，公司已在全球交付约 2,900 万件太阳能产品，并向约 1,000 万客户提供 $1.3–1.5 billion 客户融资。TIME100 在 2026
              年的认可中称，其带来电力可及的人群达到「50 million people」。肯尼亚每五户家庭中就有一户（约 30% 的肯尼亚住房）可使用 Sun King 产品，渗透率极高。GOGLA
              数据确认，按客户数量计，在七家主导运营商中 Sun King 是行业第一。


              私有指标缺口很严重。Sun King 是私营公司，没有公开报告义务；公司未披露收入、毛利率、EBITDA、经营现金流、投入资本或经审计财务报表。可比竞争对手 d.light 曾表示年收入约为 $217–309
              million；考虑到 Sun King 按部署量计规模明显更大，其收入很可能显著高于该区间，年化可能在 $400–700 million，但这是基于销量代理指标和同业基准推导出的估计，并非公司披露数据。PAYG
              应收款违约率——证券化模型的关键承保指标——没有公开披露。按 Somali Times/African Exponent 分析，缺少按国际规范标准化的经审计还款数据，仍是整个离网行业尚未完全解决的结构性缺口。


              强运营指标与缺席财务披露之间的反差，意味着如果不能进入内部数据室，外部无法独立承保 Sun King 的单位经济性。
