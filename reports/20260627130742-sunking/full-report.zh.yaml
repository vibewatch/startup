      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >
              **M-KOPA**（2010 年成立于内罗毕）是 Sun King 在东非最强的直接竞争对手。M-KOPA 累计融资超过 $250M，在肯尼亚、乌干达、坦桑尼亚、尼日利亚、加纳和南非服务超过 300
              万名融资客户。独特之处在于，M-KOPA 已从纯太阳能转向消费金融科技公司：它现在用与太阳能产品相同的 PAYG 移动支付基础设施，为智能手机、摩托车、农业投入品和个人保险提供融资。这一转向说明，仅靠 PAYG
              太阳能可能无法产生足够利润率来支撑长期盈利；也把 M-KOPA 重新定位成一家把能源硬件当入口的金融服务公司，而非单纯太阳能公司。M-KOPA
              的分销嵌入电信伙伴渠道（Safaricom、MTN、Airtel），而不是运营自有代理队伍；这让其在城市和城郊走廊获客效率高，但相较 Sun King，农村渗透受限。


              **d.light**（2006 年成立于新加坡 / 旧金山）称已在 70 多个国家影响 1.6 亿多人的生活。其产品范围从低于 $10 的微型灯延伸到 200W 太阳能家用系统。d.light 同时使用
              PAYG（NOVA 品牌）和现金销售渠道，且相当部分收入来自机构和 B2B 渠道（NGO 采购、政府项目）。双渠道策略提升销量，但稀释了 PAYG 专属信用数据，也削弱了 Sun King
              模式中的锁定效应。d.light 的地理广度超过 Sun King，但在东非零售市场的深度较浅。


              **BBOXX**（2010 年成立于伦敦）靠 IoT 做差异化：其 Pulse OS 操作系统每天从 DRC、卢旺达、多哥、喀麦隆、巴基斯坦和肯尼亚部署的 smart-box
              设备中收集数十亿个数据点。Mitsubishi Corporation 自 2018 年起持有 BBOXX 战略股权，带来财务稳定性，但也引发战略独立性疑问。BBOXX 未公开客户数；独立估算显示其部署了
              400,000-600,000 套系统。其在 DRC 和卢旺达的零售门店模式比纯代理模式能建立更深客户关系，但相较 Sun King 的代理网络，地理扩展性受限。


              **Engie Energy Access**（前 Fenix International，2017 年被 ENGIE S.A. 收购）在乌干达、赞比亚、莫桑比克、科特迪瓦、贝宁和尼日利亚，将 PAYG
              太阳能家用系统（ReadyPay 品牌）与微电网运营（PowerCorner）结合起来。ENGIE 的支持（母公司为年收入 $18B+
              的公用事业集团）提供了几乎无限的资本深度，独立竞争对手无法匹配；但集团官僚体系也拖慢产品迭代。Engie 的微电网能力代表一条不同战略路径：一旦电网经济性改善，它可以把客户向上迁移，而不是被替代。


              **Azuri Technologies**（2012 年成立于英国剑桥）在东非和西非运营 PAYG SHS，并销售差异化太阳能电视产品（Quad）。Azuri 估计服务 400,000-500,000
              户家庭，规模明显小于 Sun King，但在肯尼亚和坦桑尼亚具备有意义的品牌存在。Azuri 近期报告了重组活动，融资状况也不如更大同行透明。**Lumos Global**（拉各斯）专注尼日利亚，通过 MTN
              Nigeria 分销，拥有 260,000 多套活跃系统，以替代发电机的价值主张面向城市 / 城郊客户。Lumos 与 MTN 的伙伴关系带来强品牌触达，但若合作变化，业务多元化有限。**Angaza** 是
              PAYG SaaS 平台（不是太阳能制造商），服务 100 多家制造商和分销商，提供支付管理、库存和客户管理软件；它降低了小型竞争对手进入门槛，也加剧了市场低端竞争。
