  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >
              Sun King 所处的离网太阳能市场竞争激烈，可分为三层：拥有全球分销和大量资本的市场龙头（Sun King 和 M-KOPA）、具备强技术或聚焦细分地理市场的挑战者（d.light、BBOXX、Engie
              Energy Access），以及地理或产品范围较窄的细分 / 后期玩家（Azuri Technologies、Lumos Global、Ignite Power）。除直接 PAYG 太阳能同行外，Sun
              King 还要面对有意义的替代方案：煤油灯和柴油发电机（尼日利亚的主流现状，全国估计有 2200 万台发电机）、电网延伸项目（年推进 1-2%），以及 ENGIE
              PowerCorner、CrossBoundary Energy 等新兴微电网运营商。新进入者风险中等：Angaza 等 SaaS 平台降低了小型分销商的技术门槛，Jinkosolar、LONGi
              等中国制造商也在面向非洲分销商扩展完整 SHS 套件。不过，要在规模上竞争，仍需要末端分销、PAYG 信贷基础设施和移动支付集成三者结合，这是一道很高的进入壁垒。GOGLA
              估计，前五大制造商占撒哈拉以南非洲经验证 PAYG 销量约 60-70%，说明市场正向少数大玩家集中。


              横跨所有竞争者类别，Sun King 最差异化的资产是 40,000 人自有田野代理网络、制造规模（月产 330,000 套），以及从 2500 万客户 PAYG 交易中积累的信用数据池。这些优势耗费十年和
              $700M+ 才搭起来，挑战者或新进入者很难在 2-3 年内复制。
