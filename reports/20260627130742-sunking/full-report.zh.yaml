      - number: '2.3'
        title: 市场驱动因素与约束
        blocks:
          - type: paragraph
            body: >
              **主要增长驱动因素：**


              离网太阳能市场受益于中期内不太可能逆转的结构性顺风。非洲 6 亿无电人口代表全球最大的未满足能源需求。电网延伸年均仅增长 1-2%，这意味着到 2030 年，对多数农村人口来说，离网方案仍是唯一可行的电气化路径。


              技术成本下降改变了行业：太阳能 PV 面板成本自 2010 年以来下降 80%，电池成本自 2015 年以来下降 70%。相较煤油和柴油替代方案，太阳能家用系统越来越可负担；后两者估计每年让非洲家庭花掉
              $15-20B。


              移动支付渗透率撑起 PAYG 商业模式。M-Pesa、MTN Mobile Money 等平台每月处理数百万笔小额支付，让客户能按日小额付款，而不用承担高昂前置成本。


              发展金融支持加速了增长。World Bank 的 Lighting Africa 项目、IFC 投资，以及英国、德国、荷兰的双边项目提供优惠资本和基于结果的融资，降低获客成本，并把覆盖范围扩展到更难触达的人群。


              **关键约束：**


              资本强度限制增长。弥合非洲能源接入缺口需要 $20B 投资，远高于当前每年约 $2B 的部署规模。运营商必须先为应收账款组合融资 12-24 个月，才能等到完全回款。


              汇率和宏观风险影响盈利。以本币计价的收入（肯尼亚先令、尼日利亚奈拉、乌干达先令）要面对相对美元计价债务和设备成本的贬值压力。


              客户可负担性仍是金字塔底层人群的硬约束。随着补贴项目结束、通胀侵蚀购买力，2025 年上半年入门级现金销售下降 35%。
