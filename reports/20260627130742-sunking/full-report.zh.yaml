      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 建议：跟踪——等待 $1.3B 融资定价和经审计财务数据
            body: >
              Sun King 是离网太阳能品类里质量最高的资产，值得密切跟踪。公司的市场领导地位、DFI 投资者信心和应收款创新都很有吸引力。但财务数据未披露，加上 2022
              年估值标记偏高，使现阶段无法建立有纪律的入场价格模型。预计到 2026 年底发生的 $1.3B 融资定价，将是判断投资论点是否值得承诺资本的最重要单一数据点。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV021
              - CV032
          - type: callout
            title: 主要风险：外汇贬值侵蚀应收款美元价值
            body: >
              Sun King 的 PAYG 应收款以非洲本币计价。AfDB 预计 2025 年尼日利亚奈拉可能进一步贬值最多 6%。如果一篮子外汇对美元合计贬值
              30%+，应收款账本的美元价值将按比例下降，可能损害证券化工具并触发契约违约。这是需要跟踪的最重要单一宏观风险。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV051
          - type: callout
            title: 结构性强项：DFI 生态与应收款货币化
            body: >
              长期 DFI 股权承诺（BII、IFC、Proparco、Norfund、FMO）与已验证的应收款货币化能力（Citi 和 FMO 参与的 $156M 证券化）叠加，让 Sun King 拥有商业化 PAYG
              同行难以复制的资本结构。IFC 在 FY2025 创纪录承诺 $71.7B，说明机构对新兴市场基础设施仍有胃口。该 DFI 生态构成结构性竞争优势，使 Sun King 的资本成本低于市场利率。
            calloutType: strength
            claimRefs:
