          - type: paragraph
            body: >
              最干净、可公开验证的客户证据来自 Sun King 自己的影响故事，而不是经审计客户名单。这些故事仍有价值，因为它们展示了产品在不同使用场景中发挥作用，而不只是引用抽象触达指标。Zambia Institute
              of Agriculture 的 Dr. Christopher Kapembwa 被呈现为机构客户，使用 Sun King 太阳能逆变器系统替代教育中心的发电机。在多哥，Yawa Kpodo 和家人被展示为使用
              Sun King 太阳能家庭系统提升夜间安全和学习。在尼日利亚，公司重点介绍独立广播人 Prince Adeyemi；据称其工作室采用 Sun King
              后可持续运转，不再依赖发电机燃料。肯尼亚证据个体化程度较低，但仍有商业相关性：Business Daily Africa 和 Nation 描述了肯尼亚的大规模家庭扩张推动，包括 Kiambu County
              背景。允许来源集中，印度证据更弱；公开报道支持农村印度是目标市场和电器升级地区，但没有具名终端客户画像。因此，具名证据方向上强，但不完整。
