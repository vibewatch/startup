      - number: '5.4'
        title: 竞争差异化与技术优势
        blocks:
          - type: paragraph
            body: >
              Sun King 的差异化由几项彼此强化的优势支撑。公司在全球售出超过 3,100
              万件太阳能产品，积累了大规模还款和使用数据，能够为没有正式金融记录的客户建立自有信用评分。这道数据护城河很难快速复制，并且能直接降低违约率，同时把可服务客户扩展到此前无法被银行覆盖的家庭。


              EasyBuy 机制不要求抵押、不要求收入证明，并能在 20 分钟内完成客户准入，带来很强的体验；没有成熟 PAYG 后端基础设施的分销商很难匹配。Sun King 和 EasyBuy
              两个品牌在核心东非和南亚市场认知度强，能以较低边际成本带来复购和口碑获客。


              硬件侧，Sun King 产品符合 Lighting Global Quality Standards（IEC TS 62257-9-8），这是离网太阳能性能、安全和广告真实性的国际公认基准，并由 VeraSol
              独立测试。该认证让 Sun King
              与低价、未经验证的竞争者拉开距离。肯尼亚制造工厂和计划中的尼日利亚扩张开始推动生产本地化，降低物流成本对汇率波动的暴露，并提升供应链韧性。公司表示将把本地制造扩展到更多产品线，释放出进一步垂直整合信号。Malawi
              学校合作和机构 EaaS 模型代表一条由政府背书、切换成本高的收入流。
