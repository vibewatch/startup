      - CU023
      - CU024
      - CU025
      - CU026
      - CU014
      - CU015
    approximationNotes: 证据质量和留存可见度由分析师基于来源独立性、佐证和结果具体度，用高 / 中 / 低量表评估。G2、Capterra 或同类客户评价平台不覆盖离网太阳能 PAYG；证据主要来自公司故事、媒体报道和 DFI 披露。
  - id: FU004
    title: 留存与复购队列（行业基准）
    type: cohort
    layout: standard
    summary: >-
      按客户细分和时间跨度列示 PAYG 太阳能留存代理指标的行业基准。Sun King 未公开披露队列数据；这些数值是来自 GOGLA、IFC 和 PAYG 从业者文献的行业层面估算，仅作为尽调基准，并非已确认的 Sun King
      资产组合数据。
    data:
      columns:
        - 第 6 个月
        - 第 12 个月
        - 第 18 个月
        - 第 24 个月
      rows:
        - label: PAYG 入门灯具客户（行业估算）
          values:
            - 80
            - 65
            - 55
            - 45
        - label: PAYG 太阳能家庭系统客户（行业估算）
          values:
            - 85
            - 75
            - 65
            - 55
        - label: 机构 / 生产性用途客户（行业估算）
          values:
            - 90
            - 82
            - 75
            - 68
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
    approximationNotes: >-
      所有数值都是分析师估算，综合 GOGLA 消费者保护文献、IFC 新兴市场消费金融基准和 PAYG 行业从业者数据得出。它们不是 Sun King 特定队列披露。截至运行日期，Sun King 未发布任何队列、NRR、GRR
      或违约序列。数值代表合理行业区间，而非审计指标；Sun King 实际表现可能存在重大差异。
  - id: FR001
    title: 风险热力图——可能性 vs. 严重性
    type: matrix
    layout: standard
    summary: 严重性—可能性矩阵把 Sun King 的 12 项关键风险放入四个象限；PAYG 信用 / 违约和 FX 贬值处在最高优先级单元。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 低严重性
          values:
            - 电子废弃物合规
            - IP 商标缺口
            - 现场代理流失
        - label: 中严重性
          values:
            - 产品召回（电池）
            - GSM 锁定执行失败
            - FX 贬值——NGN/KES
        - label: 高严重性
          values:
            - CEO 离任
            - M-Pesa API 政策变化
            - PAYG 信用 / 违约
        - label: 关键严重性
          values:
            - 制造设施故障
            - 证券化不续期 / NERC 执法
            - 中国供应链冲击
    approximationNotes: 可能性和严重性评估属于定性判断，基于截至 2026 年 6 月的行业基准和公开证据。未获得内部风险管理数据。
    claimRefs:
      - CR001
      - CR010
      - CR019
      - CR028
      - CR031
      - CR032
      - CR037
