      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 货币错配是结构性 thesis 风险
            body: >-
              自 2023 年以来，尼日利亚奈拉贬值 60%+，已实质侵蚀尼日利亚应收款的美元价值。公司拥有美元计价债务，却在 15
              个市场收取本币收入；外汇风险不是尾部风险，而是嵌在基准情景里。投资人在任何情景分析中，都应对非洲应收款价值额外建模 20-30% 的外汇折价。
            calloutType: risk
            claimRefs:
              - CR029
              - CR033
              - CR034
          - type: callout
            title: PAYG 锁定功能在尼日利亚带来监管责任
            body: >-
              FCCPC 一直积极对被认定为胁迫性的数字金融运营商采取执法行动。Sun King 的自动 PAYG 锁定机制——在错过付款时停用太阳能系统——可能被 FCCPA
              定性为未经授权扣押财产。尚无确认执法行动，但法律风险很重要，前瞻性尽调应纳入一份关于所有市场 PAYG 锁定合规性的正式法律意见。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR008
          - type: callout
            title: DFI 背书能减震，但不能消除风险
            body: >-
              Sun King 的 DFI 投资人基础（BII、IFC、FMO、Proparco、Norfund）带来耐心资本、危机管理经验和约束条款豁免弹性，这些是纯商业借款人拿不到的。但 DFI 对 ESG
              表现、影响指标维持和环境标准设置的约束条款，也会带来自身合规负担；若公司社会影响指标恶化，例如 PAYG 违约率上升、服务家庭减少，就可能触发加速还款。DFI 背书会缓和资本准入风险，但不能消除它。
            calloutType: insight
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR038
              - CR039
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主线与反主线
        blocks:
          - type: paragraph
            body: >
              Sun King 的投资主线建立在四个相互咬合的支柱上：巨大且未被充分服务的可服务市场，已验证、带重复现金流的按用量付费（PAYG）商业模式，覆盖 15+ 个国家、触达 40,000+
              名一线代理的一流分销网络，以及高质量发展金融机构（DFI）投资人基础，后者为资本结构降风险，并传递出行业支持具备持续性的信号。撒哈拉以南非洲和南亚仍有 6 亿人缺少可靠电力，而离网太阳能市场每年产生约 $1B+
              产品销售额；Sun King 作为品类领导者，已为 2,500 万户家庭供电并筹集 $700M+，处在结构性有利位置。


              PAYG 模型把原本一次性的硬件销售，转化为多年融资关系，产生可证券化的应收款——Sun King 在 2025 年 7 月的 $156M 工具中已证明这一点——同时为无银行账户客户建立颗粒度信用局。IFC 在
              FY2025 对私营公司的创纪录 $71.7B 承诺，凸显 DFI 对前沿市场基础设施提供商仍有兴趣。按 CPI 数据，流向撒哈拉以南非洲的气候金融在 2020 至 2022 年间从 $10B 翻倍至
              $19B，进一步强化宏观顺风。


              反主线同样扎实。Sun King 财务仍为私有且未披露，使独立估值几乎不可能，也给商业投资人制造高信息不对称。DFI
              占比较重的股权结构——BII、IFC、Proparco、Norfund——提供低成本资本，但增加治理复杂度，也可能挤出寻求市场化回报的商业投资人。多国非洲外汇暴露很严重：尼日利亚奈拉、肯尼亚先令和乌干达先令兑美元均显著贬值，直接侵蚀
              PAYG 应收款的美元价值。PAYG 违约和拖欠率保密但很重要，行业尚未产生干净的大规模退出：Fenix International 以估计低于 $200M 企业价值出售给 ENGIE，Lumos Global
              商业表现也挣扎。若 Sun King 计划中的 $1.3B 融资停滞或重新定价，当前 $1B+ 标记将面临结构性下行压力。
