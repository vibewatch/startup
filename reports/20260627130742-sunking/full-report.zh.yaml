      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >
              产品能力上，Sun King 的范围最完整，从入门级微型灯到集成电视、风扇和冰箱接口的 200W+ 高端 SHS，覆盖面宽于 BBOXX 的 Smart Box 分层，也可与 d.light
              最宽产品线相比。竞争者的 PAYG 定价大致收敛：入门级 SHS（10-30W）约 $0.30-1.00/天，带媒体设备的 100W+ 高端系统约 $1.50-4.00/天。可比系统分层中，Sun King
              定价大体与 M-KOPA 和 d.light 一致，差异化来自售后支持密度（通过田野代理），而非价格。Sun King、d.light 和 BBOXX 可比 30-50W SHS 系统现金价格集中在
              $70-140，公开价格差异有限。主要竞争对手均未公开经验证的每瓦成本或毛利率数据；因此，定价比较只能依赖披露的 PAYG 日费率和现金价目表，这是最可得的数据点。


              GTM 上，关键差异在分销架构：Sun King 运营业内最大的自有田野代理网络之一（40,000+ 名代理）；M-KOPA 借助电信合作；d.light 使用零售 / PAYG 混合模式；BBOXX
              运营自有门店；Engie Energy Access 同时依赖代理和机构渠道。GOGLA Lighting Global
              质量认证是主要玩家共享的基线，削弱了产品质量差异；竞争优势转而来自分销触达、融资条款和售后服务。消费者在产品层面的切换成本低（主要 PAYG
              系统均使用类似键盘或令牌式支付机制），但平台层面的切换成本中等，因为客户信用历史无法在 PAYG 服务商之间转移。
