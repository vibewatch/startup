      - number: '5.2'
        title: 技术架构与 PAYG 运营模型
        blocks:
          - type: paragraph
            body: >
              Sun King 的技术架构围绕硬件内嵌的 PAYG 控制系统搭建，把设备功能与移动钱包付款事件绑定。每个支持 PAYG 的产品都内置控制单元，包含数字键盘和 LED 状态显示。客户通过 Safaricom
              M-Pesa、MTN Mobile Money 或 Airtel Money 付款后，后端验证付款、生成有时限的数字
              keycode，并通过短信发送给客户。客户在产品键盘上输入代码，延长设备可用窗口。所有分期付清后，设备永久解锁。


              后端基础设施包括 PAYG token 引擎、客户账户管理层、用于 EasyBuy 准入的信用评分系统，以及移动钱包 API 集成。电池化学体系按产品层级不同而变化：HomePlus
              系列使用磷酸铁锂（LFP/LiFePO4），标称寿命 10 年（2,500+ 次循环），热稳定性更强；Pro 灯系列使用更轻的 Li-ion NMC。产品控制单元配备 LED
              显示，可显示电量和充电状态，并支持亮度调节。


              一线代理使用专用 Android 移动应用完成客户注册、产品安装、收款和售后支持。Angaza 的开源 Nexus Keycode library 是事实行业标准 PAYG token 生成协议的 Python
              实现，代表这一类产品的技术参考；但 Sun King 使用该标准还是自有内部协议，公开信息尚未确认。机构系统增加 GSM 模块，用于实时远程监控和故障检测。HomePlus Pro 和 HomePlus Max
              产品同时支持纯太阳能充电和电网补电，适用于混合电网环境。
