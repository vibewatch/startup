      - number: '2.5'
        title: 市场对 Sun King 的相关性
        blocks:
          - type: paragraph
            body: >
              在离网太阳能市场结构中，Sun King 卡位最优。公司处在增长最快的细分市场（PAYG 太阳能家用系统）、最大的地理市场（东非），并拥有市场龙头的规模优势（服务 2500 万户以上家庭、月产 330,000
              套）。


              从现金销售转向 PAYG，直接利好 Sun King 的商业模式。2025 年上半年 PAYG 销售增长 54%，现金销售下降 35%，验证了 Sun King
              把战略重心放在融资型产品而非入门级现金商品上的选择。


              市场时点支持持续增长。「Mission 300」计划到 2030 年为非洲新增 3 亿电力连接，提供了需求底盘；技术成本下降则改善单元经济。Sun King
              扩大制造能力（肯尼亚工厂），让公司有机会从本地化生产中获取利润率。


              关键不确定性包括：（1）相对 $20B 投资缺口，DFI 和商业资本部署速度如何；（2）汇率波动对美元计价投资人的影响；（3）M-KOPA、BBOXX 等资金充足同行的竞争反应；（4）主要市场监管变化可能影响
              PAYG 定价或催收。
