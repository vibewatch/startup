      - number: '5.5'
        title: 信任、安全、安保、隐私与合规
        blocks:
          - type: paragraph
            body: >
              Sun King 以法律实体 Greenlight Planet 名义发布隐私政策，引用 Indian Information Technology Act 2000 和 Sensitive Personal
              Data and Information Rules 2011。这表明该政策可能为印度子公司起草，未必充分反映 Kenya's Data Protection Act 2019、Nigeria's
              NDPR、Uganda's Data Protection Act 或欧洲客户适用的 GDPR 下的义务。数据政策的多法域合规性是未验证缺口，需要公司直接提供法律披露。


              产品质量以 Lighting Global Quality Standards（IEC TS 62257-9-8）为基准，并由 VeraSol 独立验证；VeraSol 是 CLASP 和 Schatz
              Energy Research Center 在 World Bank Group 赞助下管理的质量保证项目。VeraSol 认证产品必须满足流明输出准确性、电池寿命、充电性能和广告真实性标准。GOGLA 的
              Consumer Protection Code（CPC）定义了价格透明、投诉处理和设备锁定政策的最低标准；Sun King 是否已正式完成 CPC 自评，公开信息没有披露。


              Sun King 的 Sustainable Finance Framework 获得 Moody's ESG Solutions 的 Second Party Opinion，验证其与 Social and
              Green Bond Principles 对齐。公司 2025 Allocation and Impact Report 记录，2023 年以来部署的产品中约三分之一由可持续金融工具支持。客户付款通过
              M-Pesa、MTN 和 Airtel 流转，受各国央行监管并适用 AML 和 KYC 要求，为 EasyBuy 客户提供了一层继承而来的身份验证。
