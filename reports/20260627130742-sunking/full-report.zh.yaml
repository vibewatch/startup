            title: 资本强度：$1.3B 融资计划显示融资依赖
            body: >-
              Sun King 公开表示计划筹集 $1.3 billion 新资本，以在 2030 年前扩大到每月 100 万套，这意味着公司在目标增速下尚未自我供血。每增加 $100M PAYG
              客户规模，在证券化之前大致需要等额营运资本。如果全球信用市场收紧、DFI 风险偏好变化，或应收款质量恶化，再融资周期可能不再支撑增长，反而拖慢增长。
            calloutType: risk
            claimRefs:
              - CI025
              - CI034
              - CI044
          - type: callout
            title: PAYG 应收款是隐藏资产负债表
            body: >-
              累计 $1.3–1.5 billion 客户融资是一项结构性资产，只会在证券化前出现在 Sun King 资产负债表上。证券化后，风险转给投资人，Sun King
              保留服务权和客户关系。这种表外结构效率高，但会遮蔽真实杠杆，并制造报告复杂度；外部分析师若无法接触内部数据，很难看清。
            calloutType: insight
            claimRefs:
              - CI002
              - CI029
              - CI031
          - type: callout
            title: 尽调必须从按 cohort 的还款数据开始
            body: >-
              最重要的第一项尽调，是拿到 vintage 级别的 PAYG 还款 cohort 数据，并由独立方按国际标准审计。没有这些数据，毛利率、有效 NPL
              率和单位经济性都无法验证。离网太阳能行业缺少标准化、经审计的还款数据，这是已知结构性缺口；一家寻求 $1.3B 的公司应该能够提供这些数据。
            calloutType: recommendation
            claimRefs:
              - CI044
              - CI009
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户价值主张
        blocks:
          - type: paragraph
            body: >
              Sun King 提供分层太阳能产品组合，从极低价 pico 灯到商用级 AC 逆变器系统，全部由 EasyBuy 按用量付费融资机制串起来。入门层级的 Pico Plus 和 Pro
              系列灯，为从煤油过渡的农村家庭提供基础照明和功能机充电。Pico Plus 由 0.35W 一体化多晶 PET 层压太阳能板和 1.4Wh 磷酸铁锂电池供电，输出 50 流明。Pro 400 最高输出 400
              流明——亮度是煤油灯的 40 倍——配备 9.4Wh Li-ion NMC 电池，低功耗模式续航最长 100 小时。


              太阳能家庭系统（SHS）层级服务多房间住宅客户。HomePlus 配有三盏 LED 灯，总计 480 流明，一块 7W 太阳能板和 8 米防鼠电缆，一块 19.2Wh LFP 电池，以及一个 USB
              手机充电口，按每日使用可达 10 年寿命（2,500+ 次循环）。HomePlus Max 套装把平台扩展到 HD 电视（24"、32" 和 43"）和落地扇，把基础能源系统升级成娱乐与舒适套装。所有
              HomePlus 产品都提供行业领先的两年硬件保修。


              产品组合顶端是 PowerHub 逆变器系统，提供 2kW 至 3.3kW AC 输出、2.5kWh 电池储能，每次充电周期最多可备电 8 小时，适合需要应对限电的城市家庭和中小企业。机构产品线覆盖 200Wp
              到 30kWp，为学校、医疗机构和人道主义运营提供端到端能源即服务（EaaS）安排，并承诺可用性。Sun King 的 EasyBuy 融资不需要抵押、担保或收入证明，通过一次简短顾问电话即可在约 20
