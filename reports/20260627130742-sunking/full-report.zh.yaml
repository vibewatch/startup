      - number: '3.5'
        title: 护城河耐久性与竞争风险清单
        blocks:
          - type: paragraph
            body: >
              Sun King 的竞争护城河来自四个相互咬合的结构性优势：（1）自有田野代理带来的分销密度，需要 5 年以上才能建成，并且要持续管理；（2）PAYG 数据飞轮——2500 万多条客户支付记录驱动信用评分，降低
              CAC 和违约风险；（3）制造规模优势——月产 330,000 套，带来小型竞争者拿不到的零部件成本；（4）在关键市场（肯尼亚、乌干达、尼日利亚）用 18 年建立的品牌认知。IRENA 指出，技术成本下降（太阳能
              PV 自 2010 年以来下降 80%）已经让硬件商品化，差异化必须来自分销、融资和数据——这正是 Sun King 最强的地方。


              最可信的替代风险来自两处：（i）M-KOPA 原生电信分销模式；如果 Safaricom 扩大代理触点，它可能在城市 / 城郊市场更快达到类似 Sun King 的覆盖；（ii）ENGIE Energy
              Access 拥有近乎无限的资本支持，若法国母公司公用事业集团下达指令，它可以补贴获客。两项风险都真实存在，但可管理：M-KOPA 已转向，不再以农村太阳能分销为竞争核心；ENGIE Energy Access
              的战略仍分散在太阳能 + 微电网上。


              低端市场的商品化风险真实存在：中国 SHS 制造商（通过 Alibaba 和本地分销商进入非洲）自 2018 年以来已把微型太阳能价格压低 40-60%，Angaza 的 SaaS
              平台也让小型区域分销商更容易在没有 Sun King 专有基础设施的情况下运营 PAYG。Sun King
              的回应是向高端竞争（带电视、冰箱、水泵的产品），并在本地部署制造（肯尼亚工厂、规划中的尼日利亚工厂），以降低进口成本。这些动作战略上合理，但需要持续资本投入。
