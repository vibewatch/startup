      - number: '4.3'
        title: Cost Structure, Margins, Working Capital & Capex
        blocks:
          - type: paragraph
            body: >
              Sun King's cost structure reflects its hybrid hardware-plus-financing model. Hardware costs include
              component sourcing (primarily from China), inbound logistics, customs duties, and increasingly local
              assembly since the October 2025 launch of the Kenya manufacturing facility (capacity: 700,000 units/year).
              Solar hardware companies in the off-grid segment typically report gross margins of 30–50% on manufactured
              cost, but the PAYG structure layers on additional cost elements: agent commissions (a material percentage
              of unit revenue), mobile money transaction fees, default provisioning on receivables, and the cost of
              capital on the working capital tied up in outstanding loans.


              Working capital intensity is the defining financial characteristic of the PAYG model. Sun King's $1.3–1.5
              billion in cumulative customer financing represents a massive float of receivables that must be funded
              before securitization converts them to liquid capital. The securitization structures — $130M in 2023 and
              $156M in 2025 in Kenya, plus $80M in Nigeria — provide the mechanism for recycling this capital, but they
              carry arrangement fees, credit enhancement costs, and the necessity of maintaining audited collections
              data to qualify for commercial bank participation. Africa's largest securitization ex-South Africa (Sun
              King's 2025 deal at $156M) demonstrates that this flywheel works in Kenya; Nigeria remains structurally
              harder due to naira FX volatility and shallower domestic capital markets.


              Capital expenditure is growing: the Kenya manufacturing facility and planned Nigeria facility represent
              significant fixed investments alongside the technology infrastructure (lock-and-unlock control systems,
              PAYG platform, Kazi app). Specific capex figures are not publicly disclosed. The May 2025 $80 million
              IFC/Stanbic IBTC Nigeria loan and the $20 million BII/Stanbic working capital facility (2023) provide
              partial visibility into ongoing credit facility utilization.
