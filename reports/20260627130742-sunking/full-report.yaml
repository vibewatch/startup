  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition & Boundaries
        blocks:
          - type: paragraph
            body: >
              The off-grid solar market encompasses solar-powered products and services sold to households and
              businesses without reliable electricity grid access. The primary market segments include:


              **Solar Home Systems (SHS):** Complete systems providing lighting, phone charging, and power for small
              appliances, typically 10-200 watts. This is Sun King's core market and the largest segment by revenue.


              **Portable Lanterns & Pico Solar:** Entry-level products providing basic lighting and phone charging,
              typically under 10 watts. These serve as an entry point for first-time solar customers.


              **Productive Use Applications:** Higher-capacity systems for income-generating activities including solar
              water pumps, refrigeration, and small business equipment. This is an emerging growth segment.


              **Mini-Grids:** Community-scale power systems serving multiple households or businesses. Sun King does not
              currently operate in this segment.


              The geographic scope covers Sub-Saharan Africa (primary market) and South Asia (secondary market), where
              grid infrastructure is limited or unreliable. The buyer profile centers on low-income rural and peri-urban
              households with daily incomes of $2-10, typically paying through mobile money-enabled PAYG financing
              rather than upfront cash purchases.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Size & Growth Trajectory
        blocks:
          - type: paragraph
            body: >
              The off-grid solar market in Sub-Saharan Africa generated approximately $2-3 billion in annual revenue as
              of 2025, with the PAYG solar segment representing the majority of sales value. GOGLA reports 10.2 million
              off-grid solar kits were sold globally in 2025, with Sub-Saharan Africa accounting for over 90% (9.26
              million units).


              **TAM Analysis:** The total addressable market includes 571-600 million people lacking electricity access
              in Sub-Saharan Africa, representing potential demand for 100-120 million households. At average system
              values of $100-200, the TAM for solar home systems alone exceeds $15 billion. When including productive
              use applications, mini-grids, and recurring services, the addressable market approaches $30-50 billion
              through 2030.


              **Market Growth:** The sector achieved 15% year-over-year volume growth in 2025, with PAYG sales surging
              54% in H1 2025 while cash sales declined 35%. The market is projected to grow at a 22-26% CAGR through
              2031 according to Mordor Intelligence, driven by declining technology costs, expanding mobile money
              penetration, and development finance institution (DFI) subsidies.


              **Regional Dynamics:** East Africa remains the largest market with 7.43 million units sold in 2025 (13%
              YoY growth), led by Kenya, Uganda, and Tanzania. West Africa is experiencing rapid recovery with 33%
              growth driven by World Bank-backed programs in Nigeria. South Asia represents a secondary market with
              significant potential in India and Bangladesh.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
