        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Sun King's business model is structurally dependent on a small number of critical third-party platforms.
              The most acute is M-Pesa: over 60% of Sun King's Kenyan customer base makes PAYG payments via Safaricom's
              M-Pesa platform, and Safaricom holds a monopoly-adjacent position (89%+ mobile-money market share in Kenya
              as of mid-2025, declining but still dominant). Any fee increase, API policy change, or mandatory
              data-sharing requirement imposed by Safaricom would directly compress Sun King's unit economics and
              collections efficiency. M-Pesa's international expansion into Mozambique, Tanzania, and Uganda creates
              both opportunity and dependency concentration risk as Sun King scales in those markets.


              Capital-provider concentration is a second-order vulnerability. Sun King's $156M securitization facility
              arranged by Citi in July 2025 is the single largest structured capital instrument, and any failure to
              refinance or roll it over at maturity—whether due to adverse receivables-quality signals, rising dollar
              interest rates, or diminished DFI appetite—would impose significant working-capital strain. DFI lenders
              (BII, IFC, FMO, Proparco, Norfund) collectively hold the majority of Sun King's non-equity capital. DFIs
              often impose social and environmental covenants that can trigger default or accelerated repayment if Sun
              King's impact metrics deteriorate or a significant safety incident occurs.


              Component-supplier concentration in China creates upstream dependency. The top five Chinese hardware
              suppliers likely account for the majority of battery cell and solar module procurement, though Sun King
              has not disclosed its supplier list publicly. A competitor—M-KOPA or d.light—securing preferential supply
              agreements or a Chinese manufacturer facing regulatory shutdown would constrain Sun King's access to
              hardware at budgeted costs. GOGLA's access-to-finance research notes that many off-grid solar companies
              have experienced margin compression due to component price volatility and logistics cost increases. The
              company's planned Nigeria factory remains unbuilt, leaving a material gap in its stated localization
              strategy.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
