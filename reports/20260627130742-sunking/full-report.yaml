  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Market Structure
        blocks:
          - type: paragraph
            body: >
              Sun King operates in a competitive off-grid solar market that can be segmented into three tiers: market
              leaders with global distribution and significant capital (Sun King and M-KOPA), challengers with strong
              technology or niche geographic focus (d.light, BBOXX, Engie Energy Access), and niche/late-stage players
              with narrow geographic or product scope (Azuri Technologies, Lumos Global, Ignite Power). Beyond direct
              PAYG solar peers, Sun King competes against meaningful alternatives including kerosene lanterns and diesel
              generators (the dominant status quo in Nigeria, estimated at 22 million generators nationally),
              grid-extension programs (advancing at 1-2% annually), and emerging mini-grid operators such as ENGIE
              PowerCorner and CrossBoundary Energy. New entrant risk is moderate: SaaS platforms like Angaza have
              lowered the technology barrier for smaller distributors, and Chinese manufacturers (e.g., Jinkosolar,
              LONGi) are expanding into complete SHS kits targeting African distributors. However, the combination of
              last-mile distribution, PAYG credit infrastructure, and mobile-money integrations required to compete at
              scale remains a formidable entry barrier. GOGLA estimates that the top five manufacturers account for
              roughly 60-70% of verified PAYG units sold in sub-Saharan Africa, suggesting the market is consolidating
              toward a small number of large players.


              Across all competitor categories, Sun King's most differentiated assets are its 40,000-strong proprietary
              field agent network, manufacturing scale (330,000 units/month), and a credit data pool accumulated from 25
              million customer PAYG transactions — advantages that took a decade and $700M+ to build and cannot be
              easily replicated by challengers or new entrants within a 2-3 year horizon.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
