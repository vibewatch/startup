  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing & Revenue Mix
        blocks:
          - type: paragraph
            body: >
              Sun King's primary revenue mechanism is pay-as-you-go (PAYG) solar financing — a consumer credit product
              disguised as an energy subscription. Customers pay a nominal upfront deposit (typically $20–50 USD) and
              then make daily, weekly, or monthly micro-payments starting from as little as $0.15–0.19 per day through
              mobile money platforms such as M-Pesa, MTN Mobile Money, and Airtel Money. After completing all payments —
              typically over 6 to 24 months — the customer owns the hardware outright and the system runs at zero
              ongoing cost. During the payment period, Sun King retains a remote-lock capability that disables the
              system if payments lapse, converting an otherwise difficult consumer credit product into a "pay or lose
              access" instrument.


              Revenue streams span multiple product tiers: entry-level lanterns, basic solar home systems (SHS),
              multi-light systems with appliances (fans, televisions, refrigerators), larger inverter systems for homes
              and businesses, and a growing portfolio of financed smartphones. The pricing architecture ranges from
              sub-$50 basic lanterns to multi-hundred-dollar inverter systems. Sun King has extended approximately
              $1.3–1.5 billion in total customer financing since inception. At 330,000 new deployments per month and an
              average system price in the $75–150 range, implied annual gross deployment value runs $297–$594 million,
              though PAYG revenue recognition is spread over the payment period rather than recognized upfront.


              Carbon credits and productive use financing (solar water pumps, agricultural equipment) represent nascent
              revenue diversification. The company's smartphone financing program, modeled on PAYG solar, allows
              customers who demonstrated consistent payment behavior to access smartphones via the same daily
              micro-payment infrastructure. Sun King's PAYG financing model functions as both a product delivery channel
              and an embedded micro-finance facility — the financing income represents a spread over cost of capital
              that is not separately disclosed.
