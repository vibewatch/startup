      - number: '1.3'
        title: Funding History & Capital Structure
        blocks:
          - type: paragraph
            body: >
              Sun King has raised over $700 million in total capital across equity rounds, debt facilities, and
              securitization structures. The company achieved unicorn status in 2022 following a $330 million Series D
              round led by British International Investment (BII), valuing the company at over $1 billion. This landmark
              round included participation from existing investors LeapFrog Investments and responsAbility, along with
              new backers Lightrock and Norfund.


              In December 2025, Sun King secured a $40 million equity investment from Lightrock, the global impact
              investing platform backed by LGT, the private bank of the Liechtenstein Princely Family. This investment
              reinforces continued investor confidence in the company's growth trajectory and impact mission.
              Additionally, in July 2025, the company closed a $156 million securitization facility arranged by Citi,
              representing one of the largest off-grid solar receivables transactions in the sector's history.


              The company has also secured substantial debt financing, including an $80 million loan facility from IFC
              to support expansion in Nigeria and broader West African markets. Sun King's capital structure reflects a
              sophisticated approach combining equity, project finance, and innovative securitization instruments
              appropriate for its asset-heavy, receivables-based business model.
