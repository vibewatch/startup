      - number: '4.5'
        title: Capital Adequacy & Financing Dependency
        blocks:
          - type: paragraph
            body: >
              Sun King's capital structure has evolved from pure equity-reliance to a sophisticated blend of equity,
              local-currency securitization, and DFI debt. The historical funding chronology detailed in Company
              Overview spans from early DFI seed capital through the $330 million Series D in 2022. In 2023 and 2025,
              Sun King executed Kenya-shilling-denominated securitizations of $130 million and $156 million respectively
              — the latter being the largest securitization completed in Sub-Saharan Africa outside South Africa. In May
              2025, Sun King closed an $80 million Nigeria debt facility with IFC and Stanbic IBTC. In December 2025,
              Lightrock provided $40 million in equity. Sun King has now raised approximately $450 million in
              local-currency capital across Kenya, Nigeria, and Tanzania, reducing FX mismatch on a significant portion
              of its receivables.


              Despite this capital market sophistication, Sun King remains structurally financing-dependent. The company
              has publicly stated plans to raise $1.3 billion in fresh capital to fund its ambition of reaching 1
              million kits per month by 2030 (from 330,000 currently). This implies a capital need of approximately
              $220–260 million per year in new capital deployment. CEO Patrick Walsh has described the investment
              requirement: "This investment is part of the overall financing required to reach that operational scale."
              The securitization model provides efficient recycling of receivables, but each new funding round and
              facility requires successful execution, favorable credit markets, and continued commercial bank appetite —
              all of which are subject to macro uncertainty, particularly African currency volatility.


              Nigeria represents the most significant capital adequacy risk: it is Sun King's second-largest and
              fastest-growing market, but no naira-denominated securitization has been completed as of June 2026. The
              naira's depreciation of over two-thirds since mid-2023 creates an asset-liability mismatch that cannot be
              resolved by securitization until a naira ABS market develops. This concentrates FX risk in Nigeria
              operations. The combination of $1.3 billion in planned capital requirements, structural barriers in the
              Nigerian market, and the absence of disclosed cash reserves, burn rate, or runway metrics means capital
              adequacy cannot be independently verified and represents a primary diligence blocker.
