      - number: '3.6'
        title: Adverse Evidence & Displacement Risks
        blocks:
          - type: paragraph
            body: >
              Several data points challenge the assumption that Sun King's competitive position is durable across a 5-10
              year horizon. First, The Economist has documented that PAYG solar companies across Africa face elevated
              customer default rates and battery replacement cost pressure as initial 2-3 year payment plans expire and
              first-generation systems need maintenance — costs that no competitor publicly accounts for in disclosed
              unit economics. This suggests that PAYG solar companies' financial performance will deteriorate as
              portfolios mature, creating pressure on all incumbents including Sun King.


              Second, M-KOPA's successful pivot to broader consumer fintech demonstrates that standalone PAYG solar is
              unlikely to deliver the margins necessary for long-term profitability as the solar component commoditizes.
              M-KOPA now derives a meaningful share of its revenue from non-solar products, implying that Sun King's
              product roadmap — which has historically been energy-focused — may need to extend into adjacent financial
              services or productive-use financing to sustain growth. The company's moves into agricultural equipment
              financing and productive use solar (pumps, refrigeration) are early signals of this diversification, but
              the execution timeline and financial contribution remain opaque.


              Third, SEforALL data indicates that only 10-15% of the 600M+ energy-poor in Africa has been served by
              off-grid solar to date, implying a large remaining market — but this also means that the majority of the
              easiest-to-serve customers (those near roads, with steady income) may have already been captured, and
              future growth requires reaching harder-to-serve, lower-income, more remote populations with worse credit
              profiles. This dynamic will pressure all PAYG solar operators' unit economics as the addressable market
              shifts to less creditworthy customers.


              Fourth, KPMG's 2026 clean energy outlook notes that grid extension programs backed by the World Bank and
              African Development Bank are accelerating in Nigeria, Ethiopia, and East Africa — representing a long-term
              threat to off-grid solar demand as grid reaches currently unserved areas. While the timeline for
              meaningful displacement is 10+ years, investors valuing Sun King on long-term cash flows should model
              grid-extension risk in their terminal assumptions.
            claimRefs:
              - CP044
              - CP045
              - CP046
              - CP047
