      - number: '3.2'
        title: Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: >
              **M-KOPA** (founded 2010, Nairobi) is Sun King's most formidable direct competitor in East Africa. Having
              raised $250M+ in total capital, M-KOPA serves more than 3 million financed customers across Kenya, Uganda,
              Tanzania, Nigeria, Ghana, and South Africa. Uniquely, M-KOPA has pivoted its business model from pure
              solar to become a consumer fintech company: it now finances smartphones, motorcycles, agricultural inputs,
              and personal insurance using the same PAYG mobile-money infrastructure as its solar products. This pivot
              signals that PAYG solar alone may not generate sufficient margin to sustain long-run profitability; it
              also repositions M-KOPA as a financial services company that uses energy hardware as a gateway rather than
              a solar company per se. M-KOPA's distribution embeds into telecom partner channels (Safaricom, MTN,
              Airtel) rather than running a proprietary agent force, which makes acquisition efficient in urban and
              peri-urban corridors but limits rural penetration compared to Sun King.


              **d.light** (founded 2006, Singapore/San Francisco) claims to have impacted 160 million+ lives across 70+
              countries. Its product range extends from sub-$10 pico lanterns to 200W solar home systems. d.light uses
              both PAYG (under the NOVA brand) and cash sales channels, with a significant portion of revenue coming
              from institutional and B2B channels (NGO procurement, government programs). This dual-channel strategy
              increases volume but dilutes PAYG-specific credit data and reduces the lock-in that characterizes Sun
              King's model. d.light's geographic breadth is wider than Sun King's but depth is shallower in East
              Africa's retail market.


              **BBOXX** (founded 2010, London) differentiates on IoT: its Pulse OS operating system collects billions of
              data points daily from deployed smart-box units across DRC, Rwanda, Togo, Cameroon, Pakistan, and Kenya.
              Mitsubishi Corporation has held a strategic stake in BBOXX since 2018, providing financial stability but
              raising questions about strategic independence. BBOXX's customer count is not publicly disclosed;
              independent estimates suggest 400,000-600,000 systems deployed. Its retail shop model in DRC and Rwanda
              creates deeper customer relationships than agent-only models, but limits geographic scalability versus Sun
              King's agent network.


              **Engie Energy Access** (formerly Fenix International, acquired by ENGIE S.A. in 2017) combines PAYG solar
              home systems (ReadyPay brand) with mini-grid operations (PowerCorner) in Uganda, Zambia, Mozambique, Ivory
              Coast, Benin, and Nigeria. ENGIE's backing ($18B+ annual revenue utility parent) provides near-unlimited
              capital depth that no independent competitor can match, but also introduces corporate bureaucracy that
              slows product iteration. Engie's mini-grid capability represents a distinct strategic pathway: as grid
              economics improve, it can migrate customers upward rather than replacing them.


              **Azuri Technologies** (founded 2012, Cambridge UK) operates PAYG SHS and a distinctive solar TV product
              (Quad) in East and West Africa. With an estimated 400,000-500,000 households served, Azuri is materially
              smaller than Sun King but has meaningful brand presence in Kenya and Tanzania. Azuri recently reported
              restructuring activities, and its funding position is less transparent than larger peers. **Lumos Global**
              (Lagos) focuses exclusively on Nigeria, distributing through MTN Nigeria with 260,000+ active systems in a
              generator-replacement value proposition targeting urban/peri-urban customers. Lumos's MTN partnership
              gives it strong brand reach but limited diversification if the partnership changes. **Angaza** is a PAYG
              SaaS platform (not a solar manufacturer) that powers 100+ manufacturers and distributors, providing
              software for payment management, inventory, and customer management; it lowers barriers to entry for
              smaller competitors, increasing competitive intensity at the low end of the market.
