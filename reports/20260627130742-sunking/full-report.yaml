      - number: '3.4'
        title: Distribution Power, Lock-In & Multi-Homing
        blocks:
          - type: paragraph
            body: >
              Sun King's 40,000+ proprietary field agent network is the most defensible structural advantage in the
              competitive set. Agents are embedded in rural communities, conduct doorstep credit assessments, collect
              first payments, and provide after-sale support — functions that telecom-partner distribution models cannot
              easily replicate in deep-rural settings. M-KOPA's Safaricom-embedded model is efficient in Kenya's urban
              and peri-urban corridors but underperforms in areas where mobile agent density is low. BBOXX's retail shop
              model in DRC is highly effective in urban DRC but structurally limited in rural Africa. d.light's hybrid
              retail model gives broader geographic coverage but shallower customer intimacy and lower PAYG capture
              rates.


              Lock-in operates at multiple levels for Sun King customers. At the hardware level, Sun King's PAYG units
              use proprietary token-unlocking systems (customers must pay to keep access), creating hard lock-in for the
              duration of the payment plan (typically 18-36 months). At the relationship level, field agents maintain
              ongoing customer contact for upsell and product upgrade pathways. At the data level, Sun King holds
              payment history data on 25M+ customers that competitors cannot access — enabling credit scoring for repeat
              purchases that substantially lowers customer acquisition cost for the next product.


              Multi-homing (using multiple PAYG providers simultaneously) is rare in practice because the economics of a
              PAYG plan require a 12-36-month commitment; a household that acquires a system through two providers
              simultaneously bears double the daily payment burden. However, multi-homing is possible at
              product-category boundaries: a household may purchase a pico lantern from d.light for cooking light while
              acquiring a full SHS from Sun King, representing partial multi-homing at different tiers. Distribution
              power — particularly the ability to sign exclusive agreements with MTN, Safaricom, and M-Pesa operators —
              represents a growing competitive battleground as telecoms deepen their role in payments infrastructure.
