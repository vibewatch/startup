      - number: '5.3'
        title: Manufacturing, Supply Chain, and Deployment
        blocks:
          - type: paragraph
            body: |
              Sun King's primary hardware manufacturing base is in China. In October 2025, the company opened
              its first African manufacturing facility in Nairobi, Kenya, targeting 700,000 units per year
              capacity and initially producing television sets and smartphones. A second facility in Nigeria is
              planned to support supply chain localization across West Africa; no confirmed start date has been
              publicly announced for the Nigeria plant.

              The Kenya factory employs hundreds of locally hired staff supported by technical training and
              skills development programmes. By producing TVs and smartphones near their end markets, Sun King
              aims to reduce logistics costs, carbon emissions, and import dependencies while capturing more
              economic value within African economies. The company is investigating expansion into additional
              product lines at the Kenya facility as manufacturing feasibility is confirmed.

              Product delivery and after-sales service rely on approximately 40,000 field agents operating
              across Sun King's 15+ country footprint. These agents handle last-mile sales, customer enrollment,
              free installation (included with all EasyBuy SHS purchases), and ongoing support. Sun King's SHS
              products carry a two-year hardware warranty; PowerHub inverter systems a three-year warranty. The
              HomePlus battery is rated for 10 years of typical daily use (2,500+ full cycles) and PowerHub
              systems deliver up to eight hours of backup per charge cycle. For institutional customers, Sun King
              offers uptime-guaranteed EaaS contracts with on-ground technical teams providing reactive and
              predictive maintenance. Product durability features include rodent-resistant 8-metre solar
              panel cables for rural deployment conditions.
