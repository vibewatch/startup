            body: >
              Public adoption evidence is much stronger on reach than on revenue quality. Sun King states that it has
              powered more than 25 million homes and impacted more than 100 million people, while its current impact
              page now shows 27.2 million homes powered, 31.5 million solar products sold, and 41,000+ field agents.
              Business Daily Africa separately reported the 25 million homes milestone, helping corroborate the order of
              magnitude. The operating footprint spans at least ten priority markets across East, West, Central, and
              South Asia, with East Africa remaining the sector's most important regional demand center. GOGLA's 2025
              market report indicates East Africa represented about 7.43 million of 13.05 million African off-grid solar
              units, or roughly 57%, which matters because Kenya, Uganda, and Tanzania are among Sun King's
              best-developed markets. The company context also points to manufacturing or sourcing scale of roughly
              330,000 kits per month, suggesting Sun King is not only a distributor but a scaled asset originator for
