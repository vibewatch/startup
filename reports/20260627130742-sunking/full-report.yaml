    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity & Overview
        blocks:
          - type: paragraph
            body: >
              Sun King (formerly Greenlight Planet) is a global leader in off-grid solar energy solutions, providing
              pay-as-you-go (PAYG) solar home systems to customers without reliable electricity access across
              sub-Saharan Africa and South Asia. Founded in 2007 by Patrick Walsh and Anish Thakkar at the University of
              Illinois at Urbana-Champaign, the company was incorporated in the United States and later relocated its
              operational headquarters to Nairobi, Kenya. The company rebranded from Greenlight Planet to Sun King in
              2023 to better align with its flagship product brand recognized across emerging markets.


              Sun King designs, manufactures, and distributes solar-powered products ranging from portable lanterns to
              complete home systems with TVs, fans, and refrigerators. The company pioneered the PAYG model in off-grid
              solar, enabling low-income customers to acquire solar systems through affordable daily mobile money
              payments rather than prohibitive upfront costs. This innovative approach has enabled Sun King to serve
              over 25 million homes and impact more than 100 million people globally.


              The company operates an extensive distribution network spanning Kenya, Uganda, Tanzania, Nigeria, Zambia,
              Democratic Republic of Congo (DRC), Ethiopia, Mozambique, and several Asian markets including India and
              Bangladesh. Sun King employs approximately 2,000 full-time staff and works with over 40,000 field sales
              agents who serve as the last-mile connection to rural customers.
