      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: Track — Await $1.3B Raise Pricing and Audited Financials'
            body: >
              Sun King is the highest-quality asset in the off-grid solar category and merits close monitoring. The
              company's market leadership, DFI investor confidence, and receivables innovation are compelling. However,
              undisclosed financials and a stretched 2022 valuation mark make it impossible to model a disciplined entry
              price at this stage. The $1.3B raise pricing event—expected by late 2026—will be the single most important
              data point for determining whether the investment thesis warrants a commitment.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV021
              - CV032
          - type: callout
            title: 'Primary Risk: FX Depreciation Erodes Receivables Dollar Value'
            body: >
              Sun King's PAYG receivables are denominated in local African currencies. The AfDB projects up to 6%
              further Nigerian naira depreciation in 2025. In a scenario where the combined FX basket depreciates 30%+
              against the USD, the dollar value of the receivable book would decline by a proportional amount,
              potentially impairing securitization facilities and triggering covenant breaches. This is the single most
              important macro risk to monitor.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV051
          - type: callout
            title: 'Structural Strength: DFI Ecosystem and Receivables Monetization'
            body: >
              The combination of long-term DFI equity commitment (BII, IFC, Proparco, Norfund, FMO) and demonstrated
              receivables monetization capacity ($156M securitization with Citi and FMO) provides Sun King with a
              capital structure that commercial-only PAYG peers cannot replicate. IFC's record $71.7B FY2025 commitment
              signals continued institutional appetite for emerging-market infrastructure. This DFI ecosystem is a
              structural competitive advantage that lowers Sun King's cost of capital relative to market rates.
            calloutType: strength
            claimRefs:
              - CV004
              - CV024
              - CV025
              - CV027
