      - number: '6.5'
        title: Expansion and Concentration
        blocks:
          - type: paragraph
            body: >
              Sun King's concentration pattern is unusual: it is probably deconcentrated at the individual-customer
              level because millions of households make small payments, but concentrated at the country, funding, and
              channel level. East Africa remains the largest off-grid solar region, so Sun King's strongest installed
              base is likely tied to a handful of mobile-money-rich markets led by Kenya, Uganda, and Tanzania. Nigeria
              is the clearest current expansion vector, reinforced by African Development Bank financing for solar
              access and by IFC project involvement. Kenya also remains an expansion priority, with public reporting
              around plans to reach millions more homes. Beyond households, Sun King can expand average revenue per
              customer through appliances, inverter systems, institutional sales, and productive-use cases, especially
              where a household already trusts the brand. The main limiting factors are receivables funding, macro
              volatility, and competitive alternatives from PAYG operators or software-layer enablers such as Azuri and
              Angaza. Because public disclosures are thin on churn and defaults, diligence should focus less on whether
              demand exists — it clearly does — and more on where portfolio performance is strongest by country and
