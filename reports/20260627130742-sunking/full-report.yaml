        - No public active-customer count, ARPU, or repayment curve
      - - Aspirational appliance-upgrade households
        - Existing Sun King households upgrading to larger systems or appliances
        - Fans, televisions, higher-capacity batteries, larger home systems
        - Smaller than entry SHS by count but higher value
        - Best land-and-expand opportunity inside existing base
        - No public upgrade or repeat-purchase rate
      - - Institutional buyers
        - >-
          Schools, clinics, agricultural centers, NGOs, and administrators as payers; students, staff, or patients as
          users
        - Inverter systems and backup power for classrooms, clinics, and offices
        - Low count, high ticket
        - Strategic proof that Sun King can move beyond household-only use cases
        - Named examples exist, but public contract economics do not
      - - Microenterprise and productive-use customers
        - Owner-operators pay; staff and customers are downstream users
        - Broadcasting, retail, refrigeration, charging, and other income-supporting power uses
        - Emerging segment; likely smaller than household base
        - Potentially higher repayment discipline if power links to income generation
