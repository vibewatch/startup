  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Sun King operates across more than 15 jurisdictions, each with distinct licensing, consumer-protection,
              data-privacy, and environmental-compliance regimes. In Kenya, the Energy and Petroleum Regulatory
              Authority (EPRA) governs solar product standards, and compliance failures can trigger recall orders or
              sales bans—a risk amplified by the company's rapid SKU expansion into refrigerators and productive-use
              appliances. Nigeria's Nigerian Electricity Regulatory Commission (NERC) requires off-grid electricity
              suppliers to hold distribution authorizations, and enforcement intensity has increased since the 2023
              Electricity Act amendment expanded NERC's off-grid mandate. The Federal Competition and Consumer
              Protection Commission (FCCPC) has demonstrated willingness to pursue technology-enabled consumer-finance
              operators for unauthorized deductions, a risk directly applicable to Sun King's automatic PAYG lockout
              feature.


              Data-protection exposure is material. Kenya's Data Protection Act 2019 and Nigeria's NDPA 2023 impose
              strict requirements on biometric or financial data collected from PAYG customers, including usage-pattern
              analytics that Sun King employs for credit scoring. The company has not publicly disclosed a Data
              Protection Officer appointment in Nigeria, and non-compliance fines of up to 2% of annual turnover are
              possible. Across Ethiopia, Mozambique, and the DRC, legal frameworks for mobile-financial products are
              evolving rapidly and present horizon regulatory risk where the company could face retroactive compliance
              requirements.


              IP and brand risk is lower but not trivial. The 2023 rebrand from Greenlight Planet to Sun King required
              re-registration of trademarks across all operating jurisdictions—a process that remains incomplete in
              several markets according to company disclosures. Competitors or bad-faith registrants may have filed
              conflicting marks in transition windows. GOGLA's Consumer Protection Code mandates quality standards and
              transparency on energy output claims; Sun King is a signatory but independent audits of compliance are
              limited. Adverse-source analysis identified one consumer-complaints forum post flagging Sun King system
              performance in Uganda as below advertised specifications, though this has not escalated to formal
              enforcement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
