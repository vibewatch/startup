      - number: '7.4'
        title: Financial and Model Risk
        blocks:
          - type: paragraph
            body: >
              The most structurally significant financial risk is currency mismatch: Sun King raises capital
              predominantly in US dollars while collecting PAYG revenue in Kenyan shillings, Ugandan shillings, Nigerian
              naira, and other local currencies. The Nigerian naira has depreciated more than 60% against the USD since
              the 2023 float, and the AfDB has projected further 6% depreciation in 2025. A similar dynamic has affected
              the Ethiopian birr and Mozambican metical. Since hardware costs and debt service are dollar-denominated,
              FX depreciation directly erodes the real value of receivables and compresses margins. Hedging instruments
              for these currencies are expensive, illiquid, or unavailable, leaving residual exposure on the balance
              sheet.


              PAYG credit/default risk is the second material financial threat. The PAYG model extends implicit credit
              to customers with limited formal credit histories. Default rates in the off-grid solar sector have
              historically been 10-20% of book value in stress periods, rising to 30%+ in economies experiencing
              inflation shocks or income disruption (e.g. COVID-19, drought cycles in East Africa). The Climate Policy
              Initiative's analysis of energy-access finance notes that receivables impairment is the leading cause of
              off-grid solar company capital write-downs. Sun King's securitization of Kenyan receivables through Citi
              validates receivable quality at a point in time, but the underlying customer payment behavior has not been
              independently stress-tested against severe macro scenarios.


              Capital intensity is a structural constraint on the model's scalability. Each incremental customer
              requires the company to finance the full system cost upfront (COGS plus installation), recouped over 12-24
              months via PAYG collections. At 330,000 units/month and average system cost of $80-120, this implies
              monthly working capital deployment of $26M-$40M, far exceeding any single DFI facility. The company's
              stated ambition to raise $1.3 billion in fresh capital signals this gap, but capital markets access is not
              guaranteed and dilution to existing equity holders is material. Burn and runway risk is difficult to
              assess externally given limited public financial disclosure; the absence of audited financials is itself
              an evidence gap and investor risk.
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
