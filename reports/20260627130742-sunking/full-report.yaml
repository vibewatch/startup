      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: LFP Battery Chemistry Is a Durable Quality Moat
            body: >
              Sun King's use of lithium ferro-phosphate (LFP/LiFePO4) batteries in its HomePlus SHS range— rated at 10
              years and 2,500+ full cycles—represents a genuine durability advantage over competitors using cheaper NMC
              or lead-acid alternatives in humid tropical climates. LFP batteries offer superior thermal stability,
              lower degradation under partial daily cycles, and a longer calendar life. The battery is the most
              expensive and failure-prone component in an SHS; this chemistry choice is a credible quality signal
              independently verified by VeraSol against IEC standards, directly supporting the two-year warranty and
              reducing long-run after-sales cost.
            calloutType: strength
            claimRefs:
              - CE010
              - CE019
              - CE026
              - CE030
          - type: callout
            title: PAYG Device Lock-Out and Consumer Protection Risks
            body: >
              Sun King's PAYG model uses device lock-out when customers miss payments. While effective as a
              credit-control mechanism, this practice raises material consumer protection risks: households that lose
              power mid-contract face immediate harm to lighting, food storage, and income-generating activities.
              GOGLA's Consumer Protection Code explicitly governs how lock-out is applied, complaint resolution
              timelines, and pricing transparency. Sun King has not publicly disclosed its CPC self-assessment score,
              EasyBuy default rate by product tier, or the proportion of customers who experience device lock-out at
              least once during their contract lifecycle. These metrics are material to responsible investment analysis
              and reputational risk management.
            calloutType: risk
            claimRefs:
              - CE031
              - CE037
          - type: callout
            title: 'Diligence Priority: Backend Resilience, Multi-Jurisdiction Privacy, and Default Data'
            body: >
              Three diligence items stand above others. First, Sun King's published privacy policy references Indian law
              under Greenlight Planet, creating unverified compliance exposure across 15+ operating countries with
              distinct data protection frameworks. Second, the PAYG backend is a single point of failure: an outage
              blocks all new activations and would lock out all customers in a missed-payment window. Diligence should
              obtain backend uptime records, disaster recovery documentation, and the last penetration test report for
              the field agent app and keycode API. Third, EasyBuy default rates and repayment completion ratios are not
              publicly disclosed; they are central to credit quality and unit economics underwriting.
            calloutType: recommendation
            claimRefs:
              - CE013
              - CE029
              - CE031
              - CE036
          - type: callout
            title: Africa Manufacturing Is a Strategic Hedge, Not a Near-Term Margin Driver
            body: >
              Sun King's Kenya facility initially produces TVs and smartphones—not the high-volume HomePlus or lantern
              units that drive its core PAYG business. The strategic value is real: supply chain resilience, reduced FX
              exposure, local job creation, and government relations. But cost parity with Chinese manufacturing is
              unlikely in the near term at 700K units/year. Investors should model Africa manufacturing as a medium-term
              hedge against logistics cost and FX risk rather than an immediate gross-margin expansion driver, with the
              long-term optionality of localizing SHS production if volume and incentive frameworks justify it.
            calloutType: insight
            claimRefs:
              - CE015
              - CE016
              - CE024
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              Sun King primarily serves households that sit below the grid or on the edge of it: rural and peri-urban
              families that need reliable lighting, phone charging, television, fans, and small-appliance power but
              cannot afford full upfront payment. Earlier chapters framed the core buyer as households earning roughly
              $2-10 per day, and the customer evidence in this chapter fits that profile closely. The company pairs a
              broad product ladder — from entry lanterns near the $20 range to solar home systems and appliance bundles
              priced above $200 — with a financing ladder that lets the same household begin with lighting and later
              graduate to larger systems. This makes the "customer" both an end-user and a credit counterparty. A second
              segment includes institutional and productive-use buyers such as schools, agricultural training centers,
              independent broadcasters, and small businesses that need inverter-scale reliability rather than just
              lighting. The payer can therefore be a household head, a school administrator, or a microenterprise owner,
              but the distribution motion is similar across segments: agent-led acquisition, mobile-money repayment,
              field installation or service, and repeat upsell over time.
