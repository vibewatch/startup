      - number: '8.5'
        title: Comparable Valuation and Exit Readiness
        blocks:
          - type: paragraph
            body: |
              Valuing Sun King requires a hybrid comparables framework drawing on public clean energy
              technology companies for multiple reference points and private PAYG peers for sector-specific
              calibration. No perfect comparable exists: Enphase Energy (ENPH) is a developed-market
              residential solar inverter company and commands 10–15x EV/revenue, well above what a
              frontier-market PAYG provider should attract. First Solar operates at utility scale with
              6–9x EV/EBITDA. Both establish a ceiling rather than a floor.

              Among private sector comps, M-KOPA reached a $1B+ valuation in its Series E (2023) while
              serving a similar PAYG consumer finance use case across Kenya, Uganda, and Nigeria—the
              closest structural analog. d.light raised $270M in its 2022 Series G at an estimated $300–500M
              implied valuation, reflecting both its smaller scale and more diversified product mix.
              BBOXX, the UK-based off-grid solar competitor, raised at implied valuations below $500M
              before pivoting to energy-as-a-service and smart meter operations.

              Sun King's 2022 $1B+ mark is 2–3x the observed private PAYG peer range ($300M–$500M for
              d.light, BBOXX) but consistent with M-KOPA's comparable financing footprint. The premium
              likely reflects Sun King's superior distribution scale (40,000 agents vs. 20,000 for
              closest peers), the securitization capability, and the geographic diversification across
              15+ countries.

              Exit readiness is medium. Sun King would need two or three additional years of audited
              financials, demonstrated profitability at the country level, and a clean cap table structure
              to support a public markets process. The most likely exit pathway is a strategic acquisition
              by a large-cap energy utility (Enel, TotalEnergies, ENGIE) or a public market raise in
              Nairobi or London combined with a secondary component for early DFI investors.
              Nation Africa and TechCabal have both covered the potential for Nairobi Securities Exchange
              listings for tech-adjacent companies, suggesting improving local capital market depth.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
