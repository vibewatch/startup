        title: GTM Motion & Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              Sun King operates a direct-to-consumer distribution model anchored by over 40,000–41,000 field sales
              agents across its operating markets. These agents travel door-to-door in rural and peri-urban areas that
              are beyond the reach of traditional retail infrastructure. The company supplements direct field sales with
              over 440 shops across 12 countries and a growing digital channel. This end-to-end model — encompassing
              product design, manufacturing, last-mile delivery, installation, PAYG financing, and long-term warranty
              support — differentiates Sun King from fragmented distribution-only models.


              Sun King's proprietary Kazi app underpins agent productivity and sales management, providing agents with
              customer tracking, late payment alerts, task management, and free calling capabilities. The app represents
              a GTM technology layer that is difficult for smaller competitors to replicate. LeapFrog's portfolio data
              indicate Sun King connects more than 250,000 new low- and middle-income households per month via its PAYG
              model, implying a monthly customer acquisition cadence of this scale. With approximately 2,000 full-time
              employees managing 40,000+ agents, the ratio implies significant leverage per FTE. Customer acquisition
              cost (CAC) and agent commission structures are not publicly disclosed.


              Approximately half of Sun King's registered PAYG customers in Kenya are women, and 65–90% of all customers
              live below their respective national poverty lines. This demographic profile signals strong social impact
              but also underscores the sensitivity of demand to income shocks, subsidy program continuity, and mobile
              money infrastructure reliability. The June 2026 TIME100 recognition and sector leadership by customer
              count confirm brand leadership, but comparable LTV/CAC benchmarking against peers remains impossible from
              public data.
