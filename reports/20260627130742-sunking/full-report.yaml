      - number: '7.2'
        title: Operational and Technical Risk
        blocks:
          - type: paragraph
            body: >
              Sun King's supply chain is highly concentrated in Chinese manufacturers, with over 90% of components and
              finished goods sourced from factories in China. Escalating US-China trade tensions, export-control
              expansion, and potential tariff spillover into African import regimes—particularly Nigeria's growing
              protectionist stance—represent a systemic disruption risk. The company opened a Kenya manufacturing
              facility in October 2025 and plans a Nigeria plant, but these facilities address assembly and last-mile
              localization rather than component fabrication; the core silicon, battery cells, and semiconductor supply
              chain remains China-dependent. Any geopolitical shock—US or EU sanctions on Chinese solar supply chains,
              port disruptions, or currency controls—could interrupt monthly production volumes of 330,000 units.


              The PAYG technology platform processes millions of mobile-money collections monthly across M-Pesa, MTN
              Mobile Money, Airtel Money, and others. A sustained outage at Safaricom's M-Pesa—which accounts for a
              disproportionate share of Kenya revenue—would halt collections and trigger liquidity stress. Safaricom has
              historically had periodic service disruptions. Beyond payments, Sun King's remote-lock enforcement relies
              on GSM connectivity, and rural network outages in Ethiopia or Mozambique could render physical
              repossession the only enforcement mechanism, raising operational costs substantially. The Kenya factory is
              a single facility; any fire, labor dispute, or equipment failure would constrain the entire East Africa
              fulfillment chain.


              Field agent quality and attrition is a persistent operational vulnerability. With 40,000+ agents who are
              largely informal contractors, knowledge transfer, sales practices compliance, and system-performance
              claims made during selling are difficult to audit. Mis-selling—particularly of larger productive-use
              appliances with overstated load capacity—carries both regulatory and reputational consequences. The
              company has documented a training-compliance program but third-party verification is limited.
