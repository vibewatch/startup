      - number: '2.3'
        title: Market Drivers & Constraints
        blocks:
          - type: paragraph
            body: >
              **Primary Growth Drivers:**


              The off-grid solar market benefits from structural tailwinds that are unlikely to reverse in the medium
              term. The 600 million people without electricity in Africa represents the largest unmet energy demand
              globally. Grid extension averages only 1-2% annual growth, meaning off-grid solutions remain the only
              viable electrification pathway for most rural populations through 2030.


              Technology cost declines have been transformative: solar PV panel costs dropped 80% since 2010, and
              battery costs fell 70% since 2015. These improvements make solar home systems increasingly affordable
              relative to kerosene and diesel alternatives, which cost African households an estimated $15-20 billion
              annually.


              Mobile money penetration enables the PAYG business model. M-Pesa, MTN Mobile Money, and other platforms
              process millions of micro-payments monthly, allowing customers to pay small daily amounts rather than
              prohibitive upfront costs.


              Development finance support has accelerated growth. The World Bank's Lighting Africa program, IFC
              investments, and bilateral programs from UK, Germany, and Netherlands provide concessional capital and
              results-based financing that reduces customer acquisition costs and expands coverage to harder-to-reach
              populations.


              **Key Constraints:**


              Capital intensity limits growth. The $20 billion investment needed to close Africa's energy access gap far
              exceeds current annual deployment of approximately $2 billion. Operators must finance receivables
              portfolios for 12-24 months before full repayment.


              Currency and macroeconomic risks affect profitability. Revenue in local currencies (Kenyan shilling,
              Nigerian naira, Ugandan shilling) faces devaluation against USD-denominated debt and equipment costs.


              Customer affordability remains the binding constraint for bottom-of-pyramid segments. Entry-level cash
              sales declined 35% in H1 2025 as subsidized programs ended and inflation eroded purchasing power.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Market Structure & Concentration
        blocks:
          - type: paragraph
            body: >
              The off-grid solar market exhibits high concentration among vertically integrated PAYG operators. Seven
              companies—Sun King, Zola Electric, M-KOPA, Bboxx, d.light, Engie Energy Access, and Lumos—control
              approximately 72% of market investment and serve an estimated 10+ million customers collectively.


              This concentration reflects the capital-intensive nature of PAYG operations, which require upfront
              financing of hardware, distribution networks, and customer receivables. Smaller operators struggle to
              achieve unit economics at scale and face difficulty raising the equity and debt capital needed for growth.


              The market shows signs of maturation and consolidation. Several operators have exited or scaled back
              (including major players like Fenix International/Engie and Mobisol), while survivors have expanded
              through organic growth and acquisition. Sun King's position as market leader by unit volume provides
              economies of scale in manufacturing, distribution, and receivables financing.


              Market structure varies by geography. East Africa is relatively consolidated with established operators,
              while West Africa remains more fragmented as newer programs expand. South Asia has different competitive
              dynamics with local players and different consumer financing models.


              **Barriers to Entry:**


              New entrants face significant barriers including: capital requirements for receivables financing,
              distribution network buildout in rural areas, mobile money integration costs, regulatory compliance across
              multiple jurisdictions, and customer acquisition in markets where incumbents have first-mover advantage.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
          - type: figure
            figureRef: FM003
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Market Relevance for Sun King
        blocks:
          - type: paragraph
            body: >
              Sun King is optimally positioned within the off-grid solar market structure. The company operates in the
              fastest-growing segment (PAYG solar home systems), in the largest geographic market (East Africa), with
              the scale advantages of market leadership (25+ million homes served, 330,000 units monthly).


              The shift from cash sales to PAYG directly benefits Sun King's business model. The 54% PAYG sales growth
              in H1 2025 contrasts with 35% decline in cash sales, validating Sun King's strategic focus on financed
              products rather than entry-level cash items.


              Market timing supports continued growth. The "Mission 300" initiative targeting 300 million new African
              electricity connections by 2030 provides a demand floor, while declining technology costs improve unit
              economics. Sun King's manufacturing expansion (Kenya facility) positions the company to capture margin
              from localized production.


              Key uncertainties include: (1) the pace of DFI and commercial capital deployment relative to the $20
              billion investment gap; (2) currency volatility affecting USD-denominated investors; (3) competitive
              response from well-funded peers including M-KOPA and BBOXX; and (4) regulatory developments in major
              markets that could affect PAYG pricing or collections.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
          - type: table
            tableRef: TM004
            claimRefs:
              - CM019
              - CM020
