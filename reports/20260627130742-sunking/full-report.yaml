            title: Proven Securitization Flywheel in Kenya
            body: >-
              Sun King has demonstrated repeatable capital markets access: $130M in 2023 followed by $156M in 2025, both
              Kenya-shilling-denominated and backed by commercial banks. Moody's Very Good (SQS2) rating on the
              sustainable finance framework validates the receivables quality. This flywheel — deploy capital, collect
              payments, securitize receivables, redeploy — is the asset-light financing engine that allows rapid scale
              without pure equity dilution.
            calloutType: strength
            claimRefs:
              - CI019
              - CI020
              - CI026
              - CI029
          - type: callout
            title: Nigeria FX Risk Creates Structural Capital Gap
            body: >-
              No PAYG operator including Sun King has completed a naira-denominated securitization as of June 2026. The
              naira lost over two-thirds of its dollar value since mid-2023. With an $80M IFC debt facility already
              deployed in Nigeria and Nigeria identified as Sun King's fastest-growing market, the inability to
              securitize Nigerian receivables locally creates an accumulating FX mismatch. Naira depreciation erodes the
              USD equivalent of local cash flows and may require additional USD equity to balance the funding stack.
            calloutType: risk
            claimRefs:
              - CI038
              - CI040
              - CI024
          - type: callout
            title: 'Capital Intensity: $1.3B Raise Signals Financing Dependency'
            body: >-
              Sun King's publicly stated plan to raise $1.3 billion in fresh capital to scale to 1 million kits per
              month by 2030 implies the company is not self-funding at its target growth rate. Each $100M of PAYG
              customer growth requires roughly equivalent working capital until securitized. If global credit markets
              tighten, DFI appetite shifts, or receivables quality deteriorates, the refinancing cycle could stall
              growth rather than fund it.
            calloutType: risk
            claimRefs:
              - CI025
              - CI034
              - CI044
          - type: callout
            title: PAYG Receivables Are the Hidden Balance Sheet
            body: >-
              The $1.3–1.5 billion in cumulative customer financing represents a structural asset that only appears on
              Sun King's balance sheet before securitization. Post-securitization, the risk transfers to investors while
              Sun King retains the servicing rights and customer relationship. This off-balance-sheet structure is
              efficient but obscures true leverage and creates reporting complexity that is opaque to outside analysts
              without access to internal data.
            calloutType: insight
            claimRefs:
              - CI002
              - CI029
              - CI031
          - type: callout
            title: Diligence Must Begin with Cohort-Level Repayment Data
            body: >-
              The most important first diligence step is accessing vintage-level PAYG repayment cohort data,
              independently audited to international standards. Without this, gross margin, effective NPL rate, and unit
              economics cannot be validated. The off-grid solar sector's lack of standardized audited repayment data is
              a known structural gap; a company seeking $1.3B should be able to provide this data.
            calloutType: recommendation
            claimRefs:
              - CI044
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Value Proposition
        blocks:
          - type: paragraph
            body: |
              Sun King offers a tiered portfolio of solar energy products spanning from ultra-affordable pico
              lanterns to commercial-scale AC inverter systems, all anchored by the EasyBuy pay-as-you-go
              financing mechanism. At the entry level, the Pico Plus and Pro series lanterns deliver essential
              lighting and feature-phone charging to rural households transitioning from kerosene. The Pico Plus
              delivers 50 lumens from a 0.35W integrated polycrystalline PET-laminated solar panel and a 1.4Wh
              lithium ferro-phosphate battery. The Pro 400 provides up to 400-lumen output—forty times brighter
              than a kerosene lamp—with a 9.4Wh Li-ion NMC battery and up to 100 hours of runtime on low-power mode.

              The solar home system (SHS) tier addresses multi-room residential customers. The HomePlus features
              three LED lights totalling 480 lumens, a 7W solar panel with an 8-metre rodent-resistant cable,
              a 19.2Wh LFP battery, and one USB phone-charging port rated for 10 years of daily use (2,500+
              cycles). HomePlus Max bundles extend the platform to include HD television sets (24", 32", and 43")
              and pedestal fans, turning a basic energy system into an entertainment and comfort package. All
              HomePlus products carry an industry-leading two-year hardware warranty.

              At the top of the portfolio, the PowerHub inverter systems deliver 2kW to 3.3kW of AC output with
              2.5kWh battery storage and up to eight hours of backup per charge cycle, suitable for urban
              households and SMEs protecting against loadshedding. An institutional product line—from 200Wp to
              30kWp—serves schools, health facilities, and humanitarian operations under end-to-end
              energy-as-a-service (EaaS) arrangements with uptime guarantees. Sun King's EasyBuy financing
              requires no collateral, guarantees, or proof of income, qualifying customers in approximately 20
              minutes via a brief advisor call with no collateral requirement.
