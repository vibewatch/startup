            body: >
              Sun King does not publicly disclose the SaaS-like retention metrics that private-market investors would
              ideally want — no NRR, GRR, cohort default rate, or customer churn series were found in the permitted
              source set. That said, durability is not unobservable; it must be inferred from operating proxies. First,
