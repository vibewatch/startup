      - number: '4.6'
        title: 'Financial Verdict: Revenue Quality, Margin Path & Diligence Blockers'
        blocks:
          - type: paragraph
            body: >
              Sun King's financial model has genuine and rare strengths. The PAYG receivables securitization proves the
              credit quality of its customer base: commercial banks in Kenya are now the senior lenders, not just
              development finance institutions. The $450 million in local-currency capital and the Moody's Very Good
              (SQS2) Second Party Opinion on the sustainable finance framework signal institutional confidence. The 33x
              growth in monthly production volume from 2017–2025 demonstrates operational execution at scale. At GOGLA's
              reported 48% PAYG volume growth in 2025, the sector tailwind is real.


              The central concern is capital intensity. Sun King's model generates revenue by extending credit to
              customers with limited formal financial histories in markets with structural FX volatility. Each $100
              million of customer growth requires roughly $100 million of capital recycled through securitization or
              equity. The $1.3 billion planned capital raise is not a sign of distress but it is a signal that the
              company has not yet achieved self-funding at the growth rate it is targeting. If global credit markets
              tighten, development finance institutions reprice risk, or a macro shock triggers payment delinquencies in
              Kenya or Nigeria, the refinancing cycle could face disruption. The absence of any public data on cash
              position, burn rate, default rates, or gross margin makes this risk impossible to quantify.


              Revenue quality is medium-high: PAYG financing income is recurring, customer switching costs are high
              (hardware installed at home, payment history built up), and the product addresses a real and
              non-discretionary need (energy). Margin path is unclear and structurally challenging — hardware margins
              face competition from Chinese manufacturers, local assembly is nascent, and working capital costs add to
              the effective cost base. The verdict is: investable with significant private diligence, not investable on
              public information alone. The primary blockers are undisclosed revenue, zero public margin data,
              unquantified Nigerian FX exposure, and no independent default rate audit.
            claimRefs:
