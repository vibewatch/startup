      - number: '7.5'
        title: Mitigation, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Sun King's primary risk mitigations include geographic diversification (15+ countries limits single-market
              concentration), the IFC and BII institutional backing (which provides both capital buffers and covenant
              waivers in stress), the GOGLA Consumer Protection Code adherence (which reduces regulatory surprise), and
              ongoing investment in local manufacturing (which will partially hedge supply-chain exposure when the
              Nigeria factory opens). The Citi-arranged securitization demonstrates receivable-quality credibility to
              capital markets and opens refinancing pathways. However, several mitigations are nascent or dependent on
              future actions.


              Kill criteria for the investment thesis include: (1) a material PAYG default-rate deterioration above 25%
              of book in any single major market (Kenya, Nigeria) sustained for two consecutive quarters; (2) a NERC or
              EPRA enforcement action resulting in operational suspension or mandatory product recall; (3) an M-Pesa API
              policy change that imposes transaction fees or data-sharing requirements that make PAYG unit economics
              structurally negative; (4) failure to close the stated $1.3B capital raise within 18 months, leaving
              capital-deployment capacity below the level needed to sustain current growth trajectory; (5) a senior
              management departure (CEO Patrick Walsh or CFO equivalent) without a credible succession plan announced
              within 60 days.


              Key diligence asks include: independent receivables-audit with vintage cohort default data by country,
              audited financial statements for FY2024 and FY2025, DFI covenant terms and compliance certificate for the
              Citi securitization, data-protection compliance certification for Kenya and Nigeria, confirmed trademark
              registration status post-rebrand in all markets, and independent verification of field-agent mis-selling
              complaints rates.
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
              - CR043
          - type: table
            tableRef: TR005
            claimRefs: []
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Currency Mismatch Is the Structural Thesis Risk
            body: >-
              The Nigerian naira's 60%+ depreciation since 2023 has materially eroded the USD value of Nigerian
              receivables. With USD-denominated debt and local-currency revenues across 15 markets, FX risk is not a
              tail risk — it is baked into the base case. Investors should model a 20-30% additional FX haircut on
              African receivables value in any scenario analysis.
            calloutType: risk
            claimRefs:
              - CR029
              - CR033
              - CR034
          - type: callout
            title: PAYG Lockout Feature Carries Regulatory Liability in Nigeria
            body: >-
              The FCCPC has actively pursued enforcement actions against digital finance operators for practices deemed
              coercive. Sun King's automated PAYG lockout mechanism — disabling solar systems on missed payments — may
              be characterized as unauthorized seizure of property under the FCCPA. No enforcement action has been
              confirmed, but the legal risk is material and prospective diligence should include a formal legal opinion
              on PAYG lockout compliance in all markets.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR008
          - type: callout
            title: DFI Backing Is a Risk Dampener, Not a Risk Eliminator
            body: >-
              Sun King's DFI investor base (BII, IFC, FMO, Proparco, Norfund) provides access to patient capital,
              crisis-management expertise, and covenant-waiver flexibility unavailable to purely commercial borrowers.
              However, DFI covenants on ESG performance, impact-metric maintenance, and environmental standards create
              their own compliance overhead and potential acceleration triggers if the company's social-impact metrics
              deteriorate — for example, if PAYG default rates rise and fewer households are served. DFI backing dampens
              but does not eliminate capital-access risk.
            calloutType: insight
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR038
              - CR039
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: |
              Sun King's investment thesis rests on four interlocking pillars: an enormous and underserved
              addressable market, a proven pay-as-you-go (PAYG) business model with recurring cash flows,
              a best-in-class distribution network reaching 40,000+ field agents across 15+ countries, and
              a high-quality development finance institution (DFI) investor base that de-risks the capital
              structure and signals durable sector support. With 600 million people still lacking reliable
              electricity access in sub-Saharan Africa and South Asia, and the off-grid solar market
              generating approximately $1B+ in annual product sales, Sun King occupies a structurally
              advantaged position as category leader with 25 million powered homes and $700M+ raised.

              The PAYG model transforms what would otherwise be a one-time hardware sale into a multi-year
              financing relationship, generating receivables that can be securitized—as Sun King demonstrated
              with its $156M facility in July 2025—while simultaneously building a granular credit bureau
              for unbanked customers. IFC's record $71.7B commitment to private companies in FY2025
              underscores continued DFI appetite for frontier-market infrastructure providers. Climate
              finance flows to sub-Saharan Africa doubled from $10B to $19B between 2020 and 2022 per CPI
              data, reinforcing the macro tailwind.

              The anti-thesis is equally substantive. Sun King's financials remain private and undisclosed,
              making independent valuation nearly impossible and creating high information asymmetry for
              commercial investors. The DFI-heavy cap table—BII, IFC, Proparco, Norfund—provides cheap
              capital but creates governance complexity and may crowd out commercial investors seeking
              market-rate returns. Multi-country African FX exposure is severe: Nigeria's naira, Kenya's
              shilling, and Uganda's shilling have all depreciated significantly against the USD, directly
              eroding the dollar value of PAYG receivables. PAYG default and delinquency rates are
              confidential but material, and the sector has not produced a clean large-scale exit:
              Fenix International sold to ENGIE for an estimated sub-$200M enterprise value, and Lumos
              Global struggled commercially. If Sun King's $1.3B planned raise stalls or reprices, the
              current $1B+ mark faces structural downward pressure.
            claimRefs:
