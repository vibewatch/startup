      - number: '4.4'
        title: Public Traction vs. Private Metric Gaps
        blocks:
          - type: paragraph
            body: >
              Sun King's publicly available traction metrics are impressive and independently corroborated across
              multiple sources. The company deployed approximately 330,000 solar kits monthly by end-2025 (up from
              10,000/month in 2017 — a 33x increase in eight years). It has delivered approximately 29 million solar
              products globally since inception and extended $1.3–1.5 billion in customer financing to approximately 10
              million customers. TIME100's 2026 recognition puts the figure at electricity access for "50 million
              people." One in five Kenyan households (approximately 30% of Kenyan homes) has access to a Sun King
              product — an extraordinary penetration rate. GOGLA data confirms Sun King is the sector leader by customer
              count among the seven dominant operators.


              The private-metric gap is severe. Sun King is a private company with no public reporting obligations; it
              has disclosed no revenue figures, gross margin, EBITDA, operating cash flow, capital employed, or audited
              financial statements. A comparable competitor, d.light, has indicated annual revenue of approximately
              $217–309 million; given Sun King's significantly larger scale by deployment volume, its revenue likely
              exceeds this range materially, potentially in the $400–700 million annualized band, but this is an
              estimate derived from volume proxies and peer benchmarking rather than disclosed data. Default rates on
              PAYG receivables — a critical underwriting metric for the securitization model — are not publicly
              reported. The absence of audited repayment data standardized to international norms remains a structural
              gap that the off-grid sector as a whole has not fully resolved, per the Somali Times/African Exponent
              analysis.


              The contrast between strong operational metrics and absent financial disclosure makes independent
              underwriting of Sun King's unit economics impossible without diligence access to internal data rooms.
