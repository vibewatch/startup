companyProfile:
  summary: >-
    Sun King is a private off-grid solar company that combines hardware distribution, mobile-money-enabled PAYG
    financing, and receivables securitization to serve energy-poor households across Africa and South Asia. The company
    sells solar lanterns, home systems, inverters, televisions, and related appliances through a very large last-mile
    field network, then recycles customer repayments through local-currency structured-finance facilities. Public
    evidence supports category leadership by cumulative homes served, but the business remains difficult to underwrite
    precisely because audited financial statements, portfolio delinquency, and profitability data are not publicly
    disclosed.
