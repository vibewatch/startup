      - number: '3.5'
        title: Moat Durability & Competitive Risk Register
        blocks:
          - type: paragraph
            body: >
              Sun King's competitive moat derives from four interlocking structural advantages: (1) distribution density
              via proprietary field agents, which takes 5+ years to build and requires continuous management; (2) PAYG
              data flywheel — 25M+ customer payment records powering credit scoring that lowers CAC and default risk;
              (3) manufacturing scale advantage — 330,000 monthly unit production enabling component costs not available
              to smaller competitors; and (4) brand recognition in key markets (Kenya, Uganda, Nigeria) built over 18
              years. IRENA notes that technology cost declines (solar PV down 80% since 2010) have commoditized
              hardware, meaning differentiation must come from distribution, financing, and data — exactly where Sun
              King is strongest.


              Displacement risk is most credible from two sources: (i) M-KOPA's telecom-native distribution model, which
              could achieve Sun King-like coverage in urban/peri-urban markets faster if Safaricom expands agent
              touchpoints; and (ii) ENGIE Energy Access, which has near-unlimited capital backing and can subsidize
              customer acquisition if directed by its French parent utility. Both risks are real but manageable: M-KOPA
              has pivoted away from competing on rural solar distribution, and ENGIE Energy Access remains strategically
              fragmented across solar+mini-grid.


              Commoditization risk is genuine at the lower end: Chinese SHS manufacturers (entering Africa through
              Alibaba and local distributors) have driven pico solar prices down 40-60% since 2018, and Angaza's SaaS
              platform makes it easier for smaller regional distributors to run PAYG operations without Sun King's
              proprietary infrastructure. Sun King's response has been to compete upmarket (products with TVs, fridges,
              water pumps) and to deploy manufacturing locally (Kenya plant, Nigeria plant planned), reducing import
              costs. These moves are strategically sound but require sustained capital investment.
