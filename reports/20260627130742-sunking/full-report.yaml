      - number: '8.6'
        title: Final Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: |
              For any investor evaluating Sun King at the current growth equity stage, five diligence
              areas are non-negotiable before committing capital. First, audited consolidated financial
              statements—income statement, balance sheet, and cash flow—for at least three fiscal years,
              with country-level profitability breakdowns. Second, PAYG portfolio performance data
              including origination volumes, delinquency rates by vintage, write-off rates, and recovery
              rates segmented by country and product tier. Third, a full cap table with preference stack
              detail, option pool sizing, and conversion mechanics. Fourth, the terms and structure of
              the planned $1.3B raise, including investor commitments, pricing benchmarks, and timeline.
              Fifth, management compensation structure, co-investment, and vesting aligned with exit.

              Thesis-break triggers operate at three levels: financial, operational, and macro. A PAYG
              default rate exceeding 15% in Kenya or Nigeria (the two largest markets) would signal a
              structural deterioration in the credit model and threaten the receivables securitization
              program. A combined African FX basket depreciation exceeding 30% against the USD within
              12 months would materially erode the dollar value of the receivable book and potentially
              trigger securitization covenant breaches. Failure to close the $1.3B raise within
              18 months would create a capital shortfall forcing either a down-round or operational
              contraction. Departure of the BII or IFC from the investor syndicate—signaled by a
              reduction in exposure or refusal of follow-on participation—would be a leading indicator
              that sophisticated DFI due diligence has surfaced unreported problems.

              The kill criteria are deliberately tied to observable, measurable events rather than
              soft market signals. The Angaza PAYG platform and similar technology providers publish
              periodic data on industry repayment rates that can be used as a proxy for Sun King's
              portfolio health before private data is available.
            claimRefs:
