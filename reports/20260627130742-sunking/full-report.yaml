      - number: '5.2'
        title: Technical Architecture and PAYG Operating Model
        blocks:
          - type: paragraph
            body: |
              Sun King's technical architecture is built around a hardware-embedded PAYG control system that
              links device functionality to mobile money payment events. Each PAYG-enabled product contains a
              control unit with a numeric keypad and an LED status display. When a customer makes a mobile
              money payment—via Safaricom M-Pesa, MTN Mobile Money, or Airtel Money—the backend validates the
              payment, generates a time-limited numeric keycode, and delivers it to the customer by SMS. The
              customer enters the code on the product keypad, extending the device's active window. Once all
              installments are completed, the device unlocks permanently.

              The backend infrastructure includes a PAYG token engine, a customer account management layer,
              a credit-scoring system for EasyBuy eligibility, and mobile money API integrations. Battery
              chemistry varies by product tier: lithium ferro-phosphate (LFP/LiFePO4) in the HomePlus range
              provides a 10-year rated lifespan (2,500+ cycles) with superior thermal stability; the Pro lantern
              series uses the lighter-weight Li-ion NMC chemistry. Product control units feature LED displays
              for battery level and charging status with adjustable brightness settings.

              Field agents use a dedicated Android mobile application for customer enrollment, product
              installation, payment collection, and after-sales support. Angaza's open-source Nexus Keycode
              library—a Python implementation of the de facto industry-standard PAYG token generation
              protocol—represents the technical reference for this class of products, though whether Sun King
              uses this standard or a proprietary internal protocol is not publicly confirmed. Institutional
              systems add a GSM module for real-time remote monitoring and fault detection. HomePlus Pro and
              HomePlus Max products support both solar-only and grid-top-up charging for mixed-grid environments.
            claimRefs:
