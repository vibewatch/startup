      - number: '5.4'
        title: Competitive Differentiation and Technology Advantages
        blocks:
          - type: paragraph
            body: |
              Sun King's differentiation rests on several mutually reinforcing advantages. With over 31 million
              solar products sold globally, the company has accumulated large-scale repayment and usage data
              enabling proprietary credit-scoring for customers with no formal financial history. This data moat
              is difficult to replicate quickly and directly reduces default rates while expanding the addressable
              customer segment to previously unbankable households.

              The EasyBuy mechanism—requiring no collateral, no proof of income, and qualifying customers in 20
              minutes—delivers a compelling experience that distributors without sophisticated PAYG backend
              infrastructure cannot easily match. Sun King's brand recognition under "Sun King" and "EasyBuy" is
              strong across core East African and South Asian markets, generating repeat purchase and word-of-mouth
              customer acquisition at lower marginal cost.

              On the hardware side, Sun King's products meet Lighting Global Quality Standards (IEC TS 62257-9-8)—
              the internationally recognized benchmark for off-grid solar performance, safety, and
              truth-in-advertising—with independent testing by VeraSol. This certification differentiates Sun King
              from lower-cost unverified competitors. The Kenya manufacturing facility and planned Nigeria expansion
              begin to localize production, reducing logistics cost exposure to exchange rate fluctuations and
              improving supply chain resilience. The company's stated roadmap to expand local manufacturing to
              additional product lines signals further vertical integration. The Malawi school partnership and
              institutional EaaS model represent a government-backed revenue stream with high switching costs.
            claimRefs:
