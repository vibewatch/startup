company:
  name: "Sun King"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Sun King operates a vertically integrated off-grid solar platform spanning three hardware tiers—pico
    lanterns, solar home systems (SHS), and AC inverter systems—unified by a proprietary PAYG keycode-based
    financing mechanism integrated with M-Pesa, MTN Mobile Money, and Airtel Money. The company's 31M+
    units sold, LFP battery chemistry, Lighting Global / VeraSol quality certification, and Africa-first
    manufacturing strategy create meaningful barriers to replication. Key diligence gaps remain around
    EasyBuy default-rate disclosure, the proprietary versus open-source PAYG protocol architecture,
    multi-jurisdiction data protection compliance, and security audits of the customer-facing mobile app.

sections:
  - id: product-definition
    title: "Product Portfolio and Customer Value Proposition"
    body: |
      Sun King offers a tiered portfolio of solar energy products spanning from ultra-affordable pico
      lanterns to commercial-scale AC inverter systems, all anchored by the EasyBuy pay-as-you-go
      financing mechanism. At the entry level, the Pico Plus and Pro series lanterns deliver essential
      lighting and feature-phone charging to rural households transitioning from kerosene. The Pico Plus
      delivers 50 lumens from a 0.35W integrated polycrystalline PET-laminated solar panel and a 1.4Wh
      lithium ferro-phosphate battery. The Pro 400 provides up to 400-lumen output—forty times brighter
      than a kerosene lamp—with a 9.4Wh Li-ion NMC battery and up to 100 hours of runtime on low-power mode.

      The solar home system (SHS) tier addresses multi-room residential customers. The HomePlus features
      three LED lights totalling 480 lumens, a 7W solar panel with an 8-metre rodent-resistant cable,
      a 19.2Wh LFP battery, and one USB phone-charging port rated for 10 years of daily use (2,500+
      cycles). HomePlus Max bundles extend the platform to include HD television sets (24", 32", and 43")
      and pedestal fans, turning a basic energy system into an entertainment and comfort package. All
      HomePlus products carry an industry-leading two-year hardware warranty.

      At the top of the portfolio, the PowerHub inverter systems deliver 2kW to 3.3kW of AC output with
      2.5kWh battery storage and up to eight hours of backup per charge cycle, suitable for urban
      households and SMEs protecting against loadshedding. An institutional product line—from 200Wp to
      30kWp—serves schools, health facilities, and humanitarian operations under end-to-end
      energy-as-a-service (EaaS) arrangements with uptime guarantees. Sun King's EasyBuy financing
      requires no collateral, guarantees, or proof of income, qualifying customers in approximately 20
      minutes via a brief advisor call with no collateral requirement.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE037, CE040]
    tableRefs: [TE001]
    figureRefs: [FE002]

  - id: architecture
    title: "Technical Architecture and PAYG Operating Model"
    body: |
      Sun King's technical architecture is built around a hardware-embedded PAYG control system that
      links device functionality to mobile money payment events. Each PAYG-enabled product contains a
      control unit with a numeric keypad and an LED status display. When a customer makes a mobile
      money payment—via Safaricom M-Pesa, MTN Mobile Money, or Airtel Money—the backend validates the
      payment, generates a time-limited numeric keycode, and delivers it to the customer by SMS. The
      customer enters the code on the product keypad, extending the device's active window. Once all
      installments are completed, the device unlocks permanently.

      The backend infrastructure includes a PAYG token engine, a customer account management layer,
      a credit-scoring system for EasyBuy eligibility, and mobile money API integrations. Battery
      chemistry varies by product tier: lithium ferro-phosphate (LFP/LiFePO4) in the HomePlus range
      provides a 10-year rated lifespan (2,500+ cycles) with superior thermal stability; the Pro lantern
      series uses the lighter-weight Li-ion NMC chemistry. Product control units feature LED displays
      for battery level and charging status with adjustable brightness settings.

      Field agents use a dedicated Android mobile application for customer enrollment, product
      installation, payment collection, and after-sales support. Angaza's open-source Nexus Keycode
      library—a Python implementation of the de facto industry-standard PAYG token generation
      protocol—represents the technical reference for this class of products, though whether Sun King
      uses this standard or a proprietary internal protocol is not publicly confirmed. Institutional
      systems add a GSM module for real-time remote monitoring and fault detection. HomePlus Pro and
      HomePlus Max products support both solar-only and grid-top-up charging for mixed-grid environments.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE035, CE036, CE039]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: manufacturing-deployment
    title: "Manufacturing, Supply Chain, and Deployment"
    body: |
      Sun King's primary hardware manufacturing base is in China. In October 2025, the company opened
      its first African manufacturing facility in Nairobi, Kenya, targeting 700,000 units per year
      capacity and initially producing television sets and smartphones. A second facility in Nigeria is
      planned to support supply chain localization across West Africa; no confirmed start date has been
      publicly announced for the Nigeria plant.

      The Kenya factory employs hundreds of locally hired staff supported by technical training and
      skills development programmes. By producing TVs and smartphones near their end markets, Sun King
      aims to reduce logistics costs, carbon emissions, and import dependencies while capturing more
      economic value within African economies. The company is investigating expansion into additional
      product lines at the Kenya facility as manufacturing feasibility is confirmed.

      Product delivery and after-sales service rely on approximately 40,000 field agents operating
      across Sun King's 15+ country footprint. These agents handle last-mile sales, customer enrollment,
      free installation (included with all EasyBuy SHS purchases), and ongoing support. Sun King's SHS
      products carry a two-year hardware warranty; PowerHub inverter systems a three-year warranty. The
      HomePlus battery is rated for 10 years of typical daily use (2,500+ full cycles) and PowerHub
      systems deliver up to eight hours of backup per charge cycle. For institutional customers, Sun King
      offers uptime-guaranteed EaaS contracts with on-ground technical teams providing reactive and
      predictive maintenance. Product durability features include rodent-resistant 8-metre solar
      panel cables for rural deployment conditions.
    claimRefs: [CE015, CE016, CE017, CE018, CE019, CE020, CE021, CE022, CE024, CE038]
    tableRefs: [TE005]
    figureRefs: [FE003]

  - id: differentiation
    title: "Competitive Differentiation and Technology Advantages"
    body: |
      Sun King's differentiation rests on several mutually reinforcing advantages. With over 31 million
      solar products sold globally, the company has accumulated large-scale repayment and usage data
      enabling proprietary credit-scoring for customers with no formal financial history. This data moat
      is difficult to replicate quickly and directly reduces default rates while expanding the addressable
      customer segment to previously unbankable households.

      The EasyBuy mechanism—requiring no collateral, no proof of income, and qualifying customers in 20
      minutes—delivers a compelling experience that distributors without sophisticated PAYG backend
      infrastructure cannot easily match. Sun King's brand recognition under "Sun King" and "EasyBuy" is
      strong across core East African and South Asian markets, generating repeat purchase and word-of-mouth
      customer acquisition at lower marginal cost.

      On the hardware side, Sun King's products meet Lighting Global Quality Standards (IEC TS 62257-9-8)—
      the internationally recognized benchmark for off-grid solar performance, safety, and
      truth-in-advertising—with independent testing by VeraSol. This certification differentiates Sun King
      from lower-cost unverified competitors. The Kenya manufacturing facility and planned Nigeria expansion
      begin to localize production, reducing logistics cost exposure to exchange rate fluctuations and
      improving supply chain resilience. The company's stated roadmap to expand local manufacturing to
      additional product lines signals further vertical integration. The Malawi school partnership and
      institutional EaaS model represent a government-backed revenue stream with high switching costs.
    claimRefs: [CE023, CE025, CE026, CE027, CE028]
    tableRefs: [TE002]
    figureRefs: [FE004]

  - id: trust-safety
    title: "Trust, Safety, Security, Privacy, and Compliance"
    body: |
      Sun King publishes a privacy policy under the legal entity Greenlight Planet, referencing the Indian
      Information Technology Act 2000 and Sensitive Personal Data and Information Rules 2011. This
      suggests the policy was drafted for the Indian subsidiary and may not fully reflect obligations
      under Kenya's Data Protection Act 2019, Nigeria's NDPR, Uganda's Data Protection Act, or GDPR
      for European customers. Multi-jurisdiction compliance of the data policy is an unverified gap that
      requires direct legal disclosure from the company.

      Product quality is benchmarked against Lighting Global Quality Standards (IEC TS 62257-9-8) and
      independently verified by VeraSol, the quality assurance programme managed by CLASP and the Schatz
      Energy Research Center under World Bank Group sponsorship. VeraSol-verified products must meet
      standards for lumen output accuracy, battery lifespan, charging performance, and truth-in-advertising.
      GOGLA's Consumer Protection Code (CPC) defines the minimum standards for pricing transparency,
      complaint handling, and device-locking policies; whether Sun King has formally completed a CPC
      self-assessment is not publicly disclosed.

      Sun King's Sustainable Finance Framework received a Second Party Opinion from Moody's ESG Solutions
      validating alignment with Social and Green Bond Principles. The company's 2025 Allocation and Impact
      Report documents approximately one in three products deployed since 2023 backed by sustainable
      finance instruments. Customer payment flows via M-Pesa, MTN, and Airtel are regulated by national
      central banks and subject to AML and KYC requirements, providing an inherited identity verification
      layer for EasyBuy customers.
    claimRefs: [CE029, CE030, CE031, CE032, CE033, CE034]
    tableRefs: [TE004]

