  evidenceGaps:
    - type: missing-source
      severity: material
      topic: payg-default-rates
      missingEvidence: "Verified EasyBuy default rates by product tier, market, and contract vintage—ideally from audited receivables disclosure or investor data room."
      whyItMatters: "Default rates directly determine the credit quality of Sun King's receivables book, which backs its securitisation programme and is central to unit economics and capital adequacy analysis."
      diligencePath: "Request from Sun King management: (1) default and write-off rate by product tier and vintage, (2) repayment completion rate (% of contracts reaching permanent unlock), (3) lock-out event rate and resolution outcomes, (4) recoveries on repossessed or locked devices."
      relatedQuestionRefs: [QE001]

    - type: missing-source
      severity: material
      topic: multi-jurisdiction-privacy-compliance
      missingEvidence: "Country-level data protection compliance certificates or legal opinions for Kenya, Nigeria, Uganda, India, and other primary operating markets."
      whyItMatters: "Sun King's privacy policy references Indian law under Greenlight Planet; Kenya's Data Protection Act 2019, Nigeria's NDPR, and Uganda's DPA impose distinct obligations including localization, regulator registration, and cross-border transfer restrictions."
      diligencePath: "Obtain in-country legal opinions or DPA compliance certificates for each major operating market; confirm whether Sun King has registered with each relevant Data Protection Authority and whether PAYG data is processed under country-specific data processing agreements."
      relatedQuestionRefs: [QE006]

    - type: missing-source
      severity: material
      topic: payg-backend-resilience
      missingEvidence: "Backend uptime SLAs, disaster recovery documentation, and penetration test results for the PAYG token engine, SMS gateway, and field agent mobile application."
      whyItMatters: "The PAYG backend is a single point of failure for all new device activations and keycode deliveries; an outage or security breach would block customer access to power and expose sensitive payment and credit data for millions of households."
      diligencePath: "Request from Sun King: (1) system uptime records for last 24 months, (2) disaster recovery and BCP documentation, (3) last penetration test report for the agent app and customer payment API, (4) third-party security audit status."
      relatedQuestionRefs: [QE011, QE024]

    - type: missing-source
      severity: minor
      topic: verasol-certification-coverage
      missingEvidence: "Complete list of active Sun King SKUs listed in the VeraSol product database with verification date and standard version."
      whyItMatters: "VeraSol certification is a key product quality signal; if recent SKUs (e.g., TV bundles, PowerHub inverters) are not yet certified, the quality advantage applies only to the legacy product range."
      diligencePath: "Search VeraSol database for all Sun King / Greenlight Planet product listings; request from the company a list of certified vs. uncertified active SKUs with target certification dates for any pending models."
      relatedQuestionRefs: [QE002, QE009]

    - type: private-evidence-only
      severity: material
      topic: nigeria-manufacturing-timeline
      missingEvidence: "Confirmed construction start date, capital commitment, and regulatory approvals for the Nigeria manufacturing facility."
      whyItMatters: "Nigeria is Sun King's largest West African market; local manufacturing would support PAYG expansion but the facility is currently only 'planned' with no confirmed timeline or investment disclosure."
      diligencePath: "Obtain from Sun King: (1) land and facility status, (2) capital allocated and disbursed, (3) regulatory approvals needed and current status, (4) revised launch timeline and committed milestones."
      relatedQuestionRefs: [QE023]

    - type: missing-source
      severity: material
      topic: gogla-cpc-and-consumer-metrics
      missingEvidence: "Sun King's formal GOGLA Consumer Protection Code self-assessment score, customer complaint rate, NPS data, and device lock-out frequency."
      whyItMatters: "GOGLA CPC compliance is increasingly required by DFI and impact investors; undisclosed CPC performance and consumer metrics create ESG due diligence exposure and potential reputational risk if consumer harm incidents emerge."
      diligencePath: "Request CPC self-assessment results directly from Sun King; check GOGLA member directory for public commitment disclosures; request complaint volume, resolution time SLA, and NPS data by market."
      relatedQuestionRefs: [QE015, QE016]

    - type: missing-source
      severity: material
      topic: institutional-uptime-performance
      missingEvidence: "Achievement rate for contracted uptime guarantees on institutional EaaS deployments and documented outage response data."
      whyItMatters: "Institutional contracts (NGO, government, schools, health facilities) depend on Sun King's technical ability to deliver contracted uptime; failure to achieve SLAs could trigger financial penalties and reputational damage."
      diligencePath: "Request from Sun King: (1) uptime achievement rate across EaaS portfolio, (2) average time-to-repair for GSM-flagged faults, (3) sample contract SLA terms and breach history."

