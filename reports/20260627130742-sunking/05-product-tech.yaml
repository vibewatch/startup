callouts:
  - calloutType: strength
    title: "LFP Battery Chemistry Is a Durable Quality Moat"
    body: >
      Sun King's use of lithium ferro-phosphate (LFP/LiFePO4) batteries in its HomePlus SHS range—
      rated at 10 years and 2,500+ full cycles—represents a genuine durability advantage over
      competitors using cheaper NMC or lead-acid alternatives in humid tropical climates. LFP batteries
      offer superior thermal stability, lower degradation under partial daily cycles, and a longer
      calendar life. The battery is the most expensive and failure-prone component in an SHS; this
      chemistry choice is a credible quality signal independently verified by VeraSol against IEC
      standards, directly supporting the two-year warranty and reducing long-run after-sales cost.
    claimRefs: [CE010, CE019, CE026, CE030]

  - calloutType: risk
    title: "PAYG Device Lock-Out and Consumer Protection Risks"
    body: >
      Sun King's PAYG model uses device lock-out when customers miss payments. While effective as a
      credit-control mechanism, this practice raises material consumer protection risks: households
      that lose power mid-contract face immediate harm to lighting, food storage, and income-generating
      activities. GOGLA's Consumer Protection Code explicitly governs how lock-out is applied, complaint
      resolution timelines, and pricing transparency. Sun King has not publicly disclosed its CPC
      self-assessment score, EasyBuy default rate by product tier, or the proportion of customers who
      experience device lock-out at least once during their contract lifecycle. These metrics are
      material to responsible investment analysis and reputational risk management.
    claimRefs: [CE031, CE037]

  - calloutType: recommendation
    title: "Diligence Priority: Backend Resilience, Multi-Jurisdiction Privacy, and Default Data"
    body: >
      Three diligence items stand above others. First, Sun King's published privacy policy references
      Indian law under Greenlight Planet, creating unverified compliance exposure across 15+ operating
      countries with distinct data protection frameworks. Second, the PAYG backend is a single point of
      failure: an outage blocks all new activations and would lock out all customers in a missed-payment
      window. Diligence should obtain backend uptime records, disaster recovery documentation, and the
      last penetration test report for the field agent app and keycode API. Third, EasyBuy default rates
      and repayment completion ratios are not publicly disclosed; they are central to credit quality and
      unit economics underwriting.
    claimRefs: [CE013, CE029, CE031, CE036]

  - calloutType: insight
    title: "Africa Manufacturing Is a Strategic Hedge, Not a Near-Term Margin Driver"
    body: >
      Sun King's Kenya facility initially produces TVs and smartphones—not the high-volume HomePlus or
      lantern units that drive its core PAYG business. The strategic value is real: supply chain
      resilience, reduced FX exposure, local job creation, and government relations. But cost parity
      with Chinese manufacturing is unlikely in the near term at 700K units/year. Investors should model
      Africa manufacturing as a medium-term hedge against logistics cost and FX risk rather than an
      immediate gross-margin expansion driver, with the long-term optionality of localizing SHS
      production if volume and incentive frameworks justify it.
    claimRefs: [CE015, CE016, CE024]

