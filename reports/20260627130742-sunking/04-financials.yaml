  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "revenue and financial statements"
      missingEvidence: "Sun King audited annual revenue, gross margin by segment, EBITDA, and operating cash flow for FY2024 and FY2025."
      whyItMatters: "Without these, revenue quality, margin path, capital efficiency, and the sustainability of the $1.3B capital raise plan cannot be independently assessed."
      diligencePath: "Request audited P&L and balance sheet for FY2023-2025 from data room. Request management accounts for Q1-Q2 2026."
      relatedQuestionRefs: [QI002, QI007, QI016, QI025]

    - type: private-evidence-only
      severity: blocking
      topic: "PAYG default and NPL rate"
      missingEvidence: "Vintage-level PAYG repayment cohort data by market, independently audited to international standards."
      whyItMatters: "Default rate is the primary credit quality variable underpinning securitization pricing and working capital adequacy. Sector range is 5–25%; specific Sun King rates are unknown."
      diligencePath: "Request cohort-level repayment analytics; seek independent auditor confirmation per rating agency standards."
      relatedQuestionRefs: [QI010]

    - type: private-evidence-only
      severity: material
      topic: "customer acquisition cost and unit economics"
      missingEvidence: "Fully-loaded CAC by market (agent commissions, training, onboarding, mobile-money fees); PAYG financing spread per tier; LTV/CAC ratio."
      whyItMatters: "Determines whether the PAYG model generates sufficient lifetime value to justify the capital intensity of the agent-heavy GTM model."
