callouts:
  - calloutType: strength
    title: "Proven Securitization Flywheel in Kenya"
    body: "Sun King has demonstrated repeatable capital markets access: $130M in 2023 followed by $156M in 2025, both Kenya-shilling-denominated and backed by commercial banks. Moody's Very Good (SQS2) rating on the sustainable finance framework validates the receivables quality. This flywheel — deploy capital, collect payments, securitize receivables, redeploy — is the asset-light financing engine that allows rapid scale without pure equity dilution."
    claimRefs: [CI019, CI020, CI026, CI029]

  - calloutType: risk
    title: "Nigeria FX Risk Creates Structural Capital Gap"
    body: "No PAYG operator including Sun King has completed a naira-denominated securitization as of June 2026. The naira lost over two-thirds of its dollar value since mid-2023. With an $80M IFC debt facility already deployed in Nigeria and Nigeria identified as Sun King's fastest-growing market, the inability to securitize Nigerian receivables locally creates an accumulating FX mismatch. Naira depreciation erodes the USD equivalent of local cash flows and may require additional USD equity to balance the funding stack."
    claimRefs: [CI038, CI040, CI024]

  - calloutType: risk
    title: "Capital Intensity: $1.3B Raise Signals Financing Dependency"
    body: "Sun King's publicly stated plan to raise $1.3 billion in fresh capital to scale to 1 million kits per month by 2030 implies the company is not self-funding at its target growth rate. Each $100M of PAYG customer growth requires roughly equivalent working capital until securitized. If global credit markets tighten, DFI appetite shifts, or receivables quality deteriorates, the refinancing cycle could stall growth rather than fund it."
    claimRefs: [CI025, CI034, CI044]

  - calloutType: insight
    title: "PAYG Receivables Are the Hidden Balance Sheet"
    body: "The $1.3–1.5 billion in cumulative customer financing represents a structural asset that only appears on Sun King's balance sheet before securitization. Post-securitization, the risk transfers to investors while Sun King retains the servicing rights and customer relationship. This off-balance-sheet structure is efficient but obscures true leverage and creates reporting complexity that is opaque to outside analysts without access to internal data."
    claimRefs: [CI002, CI029, CI031]

  - calloutType: recommendation
    title: "Diligence Must Begin with Cohort-Level Repayment Data"
    body: "The most important first diligence step is accessing vintage-level PAYG repayment cohort data, independently audited to international standards. Without this, gross margin, effective NPL rate, and unit economics cannot be validated. The off-grid solar sector's lack of standardized audited repayment data is a known structural gap; a company seeking $1.3B should be able to provide this data."
    claimRefs: [CI044, CI009]

