  topStrengths:
    - Sun King 在离网太阳能里占据品类领导位置，已为 25M+ 户家庭供电，分销网络能打到深层农村市场。
    - 融资栈足够成熟——移动货币 PAYG、本币债务和证券化——支撑公司持续周转资产组合并放大规模。
    - 产品阶梯从 pico lighting 延伸到逆变器系统和电视套装，提升客户升级潜力，也覆盖更多使用场景。
    - DFI 和影响力投资人背书强，给公司带来信誉、耐心资本，以及小同行拿不到的结构化融资入口。
  topRisks:
    - 公开财务披露仍然很薄：经审计收入、利润率、烧钱速度、现金和资产组合表现指标都不可得。
    - 核心非洲市场一旦遭遇汇率、通胀和可负担性冲击，需求和应收款回收都会承压。
    - PAYG 模式结构性吃资本，依赖公司持续拿到本币贷款机构和发展金融伙伴的资金。
    - 围绕设备锁定、放贷实践和移动货币集成，监管、消费者保护和数据治理要求可能收紧。
  unresolvedGaps:
    - 经审计合并财务报表和国家层面盈利能力仍未进入公开记录。
    - 违约率、逾期分层、核销和回收率等资产组合信用指标没有公开披露。
    - 详细股权结构表经济条款、清算优先权和董事会控制权仍未披露。
    - 客户留存、复购队列和 NRR/GRR 指标没有公开披露。
