      missingEvidence: "Revenue, gross margin, EBITDA, and customer default rates for M-KOPA, d.light, BBOXX, Engie Energy Access, and Azuri are all privately held and not publicly disclosed."
      whyItMatters: "Without competitor financials, it is impossible to independently assess relative profitability, unit economics, or financial sustainability — critical inputs for competitive moat assessment."
