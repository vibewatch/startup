callouts:
  - calloutType: strength
    title: "Distribution Scale Is the Primary Moat"
    body: "Sun King's 40,000+ proprietary field agent network, built over 18 years, is the single hardest competitive asset to replicate. No current competitor has matched this distribution depth in rural sub-Saharan Africa, and the combination of agent density, PAYG credit data, and mobile money integrations represents a self-reinforcing flywheel that creates durable first-mover advantage at scale."
    claimRefs: [CP031, CP032, CP037, CP039]

  - calloutType: risk
    title: "M-KOPA Fintech Pivot Signals PAYG Solar Margin Limits"
    body: "M-KOPA's successful expansion beyond solar into smartphones, motorcycles, and consumer finance indicates that standalone PAYG solar hardware is insufficient for long-run profitability as hardware commoditizes. Sun King's product diversification into agricultural equipment and productive use applications is strategically correct but execution risk remains — the timeline and financial contribution of non-solar revenue are not publicly disclosed."
    claimRefs: [CP011, CP044, CP045, CP047]

  - calloutType: risk
    title: "Commoditization Risk from Chinese Manufacturers"
    body: "Chinese solar manufacturers entering Africa (through Alibaba-linked distributors and direct B2B channels) have already driven pico solar prices down significantly and are now offering complete SHS kits at below-incumbent pricing. This commoditization pressure is most acute at the low end of Sun King's product range (pico and entry SHS) and will intensify as African import infrastructure improves."
    claimRefs: [CP005, CP041, CP048]

