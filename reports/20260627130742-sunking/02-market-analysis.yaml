- id: market-structure
  title: Market Structure & Concentration
  body: 'The off-grid solar market exhibits high concentration among vertically integrated PAYG operators. Seven companies—Sun
    King, Zola Electric, M-KOPA, Bboxx, d.light, Engie Energy Access, and Lumos—control approximately 72% of market investment
    and serve an estimated 10+ million customers collectively.


    This concentration reflects the capital-intensive nature of PAYG operations, which require upfront financing of hardware,
    distribution networks, and customer receivables. Smaller operators struggle to achieve unit economics at scale and face
    difficulty raising the equity and debt capital needed for growth.


    The market shows signs of maturation and consolidation. Several operators have exited or scaled back (including major
    players like Fenix International/Engie and Mobisol), while survivors have expanded through organic growth and acquisition.
    Sun King''s position as market leader by unit volume provides economies of scale in manufacturing, distribution, and receivables
    financing.


    Market structure varies by geography. East Africa is relatively consolidated with established operators, while West Africa
    remains more fragmented as newer programs expand. South Asia has different competitive dynamics with local players and
    different consumer financing models.


    **Barriers to Entry:**


    New entrants face significant barriers including: capital requirements for receivables financing, distribution network
    buildout in rural areas, mobile money integration costs, regulatory compliance across multiple jurisdictions, and customer
    acquisition in markets where incumbents have first-mover advantage.

    '
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM018
  figureRefs:
  - FM003
- id: relevance
  title: Market Relevance for Sun King
  body: 'Sun King is optimally positioned within the off-grid solar market structure. The company operates in the fastest-growing
    segment (PAYG solar home systems), in the largest geographic market (East Africa), with the scale advantages of market
    leadership (25+ million homes served, 330,000 units monthly).


    The shift from cash sales to PAYG directly benefits Sun King''s business model. The 54% PAYG sales growth in H1 2025 contrasts
    with 35% decline in cash sales, validating Sun King''s strategic focus on financed products rather than entry-level cash
    items.


    Market timing supports continued growth. The "Mission 300" initiative targeting 300 million new African electricity connections
    by 2030 provides a demand floor, while declining technology costs improve unit economics. Sun King''s manufacturing expansion
    (Kenya facility) positions the company to capture margin from localized production.


    Key uncertainties include: (1) the pace of DFI and commercial capital deployment relative to the $20 billion investment
    gap; (2) currency volatility affecting USD-denominated investors; (3) competitive response from well-funded peers including
    M-KOPA and BBOXX; and (4) regulatory developments in major markets that could affect PAYG pricing or collections.

    '
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM022
