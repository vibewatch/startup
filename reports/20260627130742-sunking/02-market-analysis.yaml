- id: drivers-constraints
  title: Market Drivers & Constraints
  body: '**Primary Growth Drivers:**


    The off-grid solar market benefits from structural tailwinds that are unlikely to reverse in the medium term. The 600
    million people without electricity in Africa represents the largest unmet energy demand globally. Grid extension averages
    only 1-2% annual growth, meaning off-grid solutions remain the only viable electrification pathway for most rural populations
    through 2030.


    Technology cost declines have been transformative: solar PV panel costs dropped 80% since 2010, and battery costs fell
    70% since 2015. These improvements make solar home systems increasingly affordable relative to kerosene and diesel alternatives,
    which cost African households an estimated $15-20 billion annually.


    Mobile money penetration enables the PAYG business model. M-Pesa, MTN Mobile Money, and other platforms process millions
    of micro-payments monthly, allowing customers to pay small daily amounts rather than prohibitive upfront costs.


    Development finance support has accelerated growth. The World Bank''s Lighting Africa program, IFC investments, and bilateral
    programs from UK, Germany, and Netherlands provide concessional capital and results-based financing that reduces customer
    acquisition costs and expands coverage to harder-to-reach populations.


    **Key Constraints:**


    Capital intensity limits growth. The $20 billion investment needed to close Africa''s energy access gap far exceeds current
    annual deployment of approximately $2 billion. Operators must finance receivables portfolios for 12-24 months before full
    repayment.


    Currency and macroeconomic risks affect profitability. Revenue in local currencies (Kenyan shilling, Nigerian naira, Ugandan
    shilling) faces devaluation against USD-denominated debt and equipment costs.


    Customer affordability remains the binding constraint for bottom-of-pyramid segments. Entry-level cash sales declined
    35% in H1 2025 as subsidized programs ended and inflation eroded purchasing power.

    '
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
