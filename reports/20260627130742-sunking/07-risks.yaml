callouts:
  - calloutType: risk
    title: "Currency Mismatch Is the Structural Thesis Risk"
    body: "The Nigerian naira's 60%+ depreciation since 2023 has materially eroded the USD value of Nigerian receivables. With USD-denominated debt and local-currency revenues across 15 markets, FX risk is not a tail risk — it is baked into the base case. Investors should model a 20-30% additional FX haircut on African receivables value in any scenario analysis."
    claimRefs: [CR029, CR033, CR034]

  - calloutType: risk
    title: "PAYG Lockout Feature Carries Regulatory Liability in Nigeria"
    body: "The FCCPC has actively pursued enforcement actions against digital finance operators for practices deemed coercive. Sun King's automated PAYG lockout mechanism — disabling solar systems on missed payments — may be characterized as unauthorized seizure of property under the FCCPA. No enforcement action has been confirmed, but the legal risk is material and prospective diligence should include a formal legal opinion on PAYG lockout compliance in all markets."
    claimRefs: [CR002, CR003, CR008]

  - calloutType: insight
    title: "DFI Backing Is a Risk Dampener, Not a Risk Eliminator"
    body: "Sun King's DFI investor base (BII, IFC, FMO, Proparco, Norfund) provides access to patient capital, crisis-management expertise, and covenant-waiver flexibility unavailable to purely commercial borrowers. However, DFI covenants on ESG performance, impact-metric maintenance, and environmental standards create their own compliance overhead and potential acceleration triggers if the company's social-impact metrics deteriorate — for example, if PAYG default rates rise and fewer households are served. DFI backing dampens but does not eliminate capital-access risk."
    claimRefs: [CR022, CR023, CR024, CR038, CR039]

