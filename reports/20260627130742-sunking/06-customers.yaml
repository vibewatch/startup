figures:
  - id: FU001
    title: "Customer journey map"
    type: journey-map
    layout: wide
    summary: "Illustrates the typical Sun King customer path from off-grid need recognition to repayment completion, servicing, and upsell."
    data:
      nodes:
        - label: "1. Energy gap recognized"
          detail: "Household, school, or microenterprise lacks reliable grid power or spends too much on kerosene, candles, or generators."
          tone: neutral
        - label: "2. Agent outreach"
          detail: "A field agent demonstrates Sun King products and explains affordability relative to current spending."
          tone: positive
        - label: "3. Product fit"
          detail: "Customer chooses between lantern, SHS, appliance bundle, or inverter-scale system based on load and budget."
          tone: positive
        - label: "4. KYC and mobile-money setup"
          detail: "Customer is onboarded into PAYG or financed purchase using mobile-money rails such as M-Pesa, MTN Mobile Money, or Airtel Money."
          tone: neutral
        - label: "5. Deposit and recurring payments"
          detail: "Customer makes upfront deposit and then daily or frequent installments over an approximately 12-24 month repayment period."
          tone: positive
        - label: "6. Installation and training"
          detail: "Agent installs or activates the system and teaches basic usage, charging, and troubleshooting."
          tone: positive
        - label: "7. Service and collections"
          detail: "Field service, repairs, and collection support keep the device usable and the receivable current."
          tone: neutral
        - label: "8. Unlock / ownership completion"
          detail: "After successful repayment, the customer owns the asset outright and can continue using it without installment pressure."
          tone: positive
        - label: "9. Upgrade, referral, or institutional expansion"
          detail: "Satisfied households may buy TVs or fans, while institutions and microenterprises can move into larger inverter or productive-use systems."
          tone: positive
    claimRefs: [CU002, CU003, CU004, CU006, CU028, CU033]
    approximationNotes: "Journey stages are synthesized from Sun King's customer stories, PAYG sector mechanics, and public mobile-money context. The figure is conceptual rather than a published conversion funnel."

