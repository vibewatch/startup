runDate: "2026-06-27"
company:
  name: "Sun King"
chapter:
  number: 6
  title: "Customers"
  summary: >
    Sun King's customer base is broad by household count but narrow by archetype: low-income,
    rural and peri-urban households in Africa and South Asia buying essential electricity access
    through PAYG financing, supplemented by a smaller but strategically important layer of schools,
    farms, clinics, and microenterprises using larger systems. Public proof is strongest at the
    mass-market level — 25M+ homes powered, 41,000+ field agents, and multiple public customer
    stories — while weak on software-style retention metrics such as NRR, GRR, churn, and default
    rates. Product quality verification, mobile-money collections, and deep field service coverage
    support durability, but expansion remains exposed to country mix, receivables funding, and
    competitive PAYG alternatives.
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation"
    body: |
      Sun King primarily serves households that sit below the grid or on the edge of it: rural and peri-urban families that need reliable lighting, phone charging, television, fans, and small-appliance power but cannot afford full upfront payment. Earlier chapters framed the core buyer as households earning roughly $2-10 per day, and the customer evidence in this chapter fits that profile closely. The company pairs a broad product ladder — from entry lanterns near the $20 range to solar home systems and appliance bundles priced above $200 — with a financing ladder that lets the same household begin with lighting and later graduate to larger systems. This makes the "customer" both an end-user and a credit counterparty. A second segment includes institutional and productive-use buyers such as schools, agricultural training centers, independent broadcasters, and small businesses that need inverter-scale reliability rather than just lighting. The payer can therefore be a household head, a school administrator, or a microenterprise owner, but the distribution motion is similar across segments: agent-led acquisition, mobile-money repayment, field installation or service, and repeat upsell over time.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU001]

  - id: "adoption-trajectory"
    title: "Adoption Trajectory"
    body: |
      Public adoption evidence is much stronger on reach than on revenue quality. Sun King states that it has powered more than 25 million homes and impacted more than 100 million people, while its current impact page now shows 27.2 million homes powered, 31.5 million solar products sold, and 41,000+ field agents. Business Daily Africa separately reported the 25 million homes milestone, helping corroborate the order of magnitude. The operating footprint spans at least ten priority markets across East, West, Central, and South Asia, with East Africa remaining the sector's most important regional demand center. GOGLA's 2025 market report indicates East Africa represented about 7.43 million of 13.05 million African off-grid solar units, or roughly 57%, which matters because Kenya, Uganda, and Tanzania are among Sun King's best-developed markets. The company context also points to manufacturing or sourcing scale of roughly 330,000 kits per month, suggesting Sun King is not only a distributor but a scaled asset originator for receivables-backed PAYG portfolios. What remains missing is the denominator between homes ever reached and customers still actively paying, using, or upgrading.
    claimRefs: [CU005, CU006, CU007, CU008, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: "named-customer-proof"
    title: "Named Customer Proof"
    body: |
      The cleanest publicly verifiable customer proof comes from Sun King's own impact stories rather than audited customer lists. Those stories are still useful because they show the product working across different use cases rather than only quoting abstract reach metrics. Dr. Christopher Kapembwa of the Zambia Institute of Agriculture is presented as an institutional customer using a Sun King solar inverter system to replace generators at an education hub. In Togo, Yawa Kpodo and her family are shown using a Sun King solar home system for evening safety and study. In Nigeria, the company highlights independent broadcaster Prince Adeyemi, whose studio reportedly runs continuously after adopting Sun King instead of depending on generator fuel. Kenya evidence is less individualized but still commercially relevant: Business Daily Africa and Nation describe a large household expansion push in Kenya, including Kiambu County context. India proof is weaker in the allowed source set; public coverage supports rural India as a target market and appliance-upgrade geography, but not a named end-customer profile. As a result, named proof is directionally strong but incomplete.
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU026]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: "retention-and-durability"
    title: "Retention and Durability"
    body: |
      Sun King does not publicly disclose the SaaS-like retention metrics that private-market investors would ideally want — no NRR, GRR, cohort default rate, or customer churn series were found in the permitted source set. That said, durability is not unobservable; it must be inferred from operating proxies. First, product trust is supported by the Lighting Global-to-VeraSol quality-assurance lineage and the presence of Sun King-affiliated products in that ecosystem. Second, GOGLA's consumer-protection framework emphasizes transparent financing terms, after-sales support, warranties, and complaint handling, which are especially important for PAYG models where customers can churn through nonpayment or product dissatisfaction rather than formal subscription cancellation. Third, Sun King's own installed base and loan-extension figures imply a large servicing operation: the impact page cites $1.71 billion of solar loans extended and 41,000+ field agents who sell, install, and service products. These are meaningful retention supports, but they are not substitutes for hard portfolio data. The central diligence conclusion is that durability likely exists operationally, yet is under-disclosed quantitatively.
    claimRefs: [CU003, CU004, CU027, CU028, CU029, CU030, CU031, CU032, CU033]
    tableRefs: [TU004]
    figureRefs: [FU001, FU004]

  - id: "expansion-and-concentration"
    title: "Expansion and Concentration"
    body: |
      Sun King's concentration pattern is unusual: it is probably deconcentrated at the individual-customer level because millions of households make small payments, but concentrated at the country, funding, and channel level. East Africa remains the largest off-grid solar region, so Sun King's strongest installed base is likely tied to a handful of mobile-money-rich markets led by Kenya, Uganda, and Tanzania. Nigeria is the clearest current expansion vector, reinforced by African Development Bank financing for solar access and by IFC project involvement. Kenya also remains an expansion priority, with public reporting around plans to reach millions more homes. Beyond households, Sun King can expand average revenue per customer through appliances, inverter systems, institutional sales, and productive-use cases, especially where a household already trusts the brand. The main limiting factors are receivables funding, macro volatility, and competitive alternatives from PAYG operators or software-layer enablers such as Azuri and Angaza. Because public disclosures are thin on churn and defaults, diligence should focus less on whether demand exists — it clearly does — and more on where portfolio performance is strongest by country and product tier.
    claimRefs: [CU012, CU013, CU014, CU015, CU016, CU017, CU034, CU035, CU036, CU037, CU038]
    tableRefs: [TU005]

