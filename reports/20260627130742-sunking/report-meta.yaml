summary:
  headline: Sun King is a category-leading PAYG solar platform with unmatched distribution and capital-markets innovation,
    but opaque financial disclosure and frontier-market credit/FX risk justify disciplined valuation underwriting rather than
    an immediate buy.
  overallScore: 7.2
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
