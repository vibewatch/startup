companyProfile:
  summary: Sun King is a private off-grid solar company that combines hardware distribution, mobile-money-enabled PAYG financing,
    and receivables securitization to serve energy-poor households across Africa and South Asia. The company sells solar lanterns,
    home systems, inverters, televisions, and related appliances through a very large last-mile field network, then recycles
    customer repayments through local-currency structured-finance facilities. Public evidence supports category leadership
    by cumulative homes served, but the business remains difficult to underwrite precisely because audited financial statements,
    portfolio delinquency, and profitability data are not publicly disclosed.
  foundedDate: '2005-01-01'
  founders:
  - name: Anish Harsh Thakkar
    role: Co-Founder
    background: Co-founded Greenlight Planet/Sun King and helped build the company around affordable solar access for off-grid
      households.
    claimRefs:
    - CO001
  - name: Patrick Walsh
    role: Co-Founder and CEO
    background: Co-founder and current CEO who led Sun King’s scale-up into a multi-country PAYG solar and structured-finance
      platform.
    claimRefs:
    - CO001
    - CO015
  foundingLocation: University of Illinois at Urbana-Champaign, United States
  headquarters: Nairobi, Kenya
  productSummary: Tiered off-grid solar portfolio spanning pico lanterns, solar home systems, TVs and fan bundles, inverter
    systems, and institutional solar assets, distributed through EasyBuy pay-as-you-go financing and field installation.
  customerFocus: Low-income rural and peri-urban households, plus selected productive-use and institutional customers in Africa
    and South Asia that lack reliable grid power or affordable backup energy.
  businessModel: Hardware sales plus PAYG credit collections through mobile-money rails, supported by field-agent acquisition/service,
    local-currency debt facilities, and receivables securitization.
  stage: Growth
  fundingStatus: Unicorn-scale private company with $700M+ raised across equity, debt, and securitization, including a $40M
    Lightrock equity round in December 2025 and a $156M securitization in July 2025.
