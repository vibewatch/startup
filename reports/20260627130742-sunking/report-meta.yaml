  topStrengths:
  - Category leadership in off-grid solar with 25M+ homes powered and a distribution network that reaches deep rural markets.
  - A sophisticated financing stack—mobile-money PAYG, local-currency debt, and securitization—supports continued portfolio
    recycling and scale.
  - Broad product ladder from pico lighting to inverter systems and TV bundles improves customer graduation potential and
    use-case coverage.
  - Strong DFI and impact-investor backing provides credibility, patience, and access to structured finance unavailable to
    smaller peers.
  topRisks:
  - 'Public financial disclosure remains thin: no audited revenue, margin, burn, cash, or portfolio-performance metrics are
    available.'
  - FX, inflation, and affordability shocks in core African markets can pressure both demand and receivables collections.
  - The PAYG model is structurally capital intensive and depends on continued access to local-currency lenders and development-finance
    partners.
  - Regulatory, consumer-protection, and data-governance expectations around device lockouts, lending practices, and mobile-money
    integrations may tighten.
  unresolvedGaps:
  - Audited consolidated financial statements and country-level profitability remain unavailable in the public record.
  - Portfolio credit metrics such as default rates, delinquency buckets, write-offs, and recovery rates are not publicly disclosed.
  - Detailed cap-table economics, liquidation preferences, and board control rights remain undisclosed.
  - Customer retention, repeat-purchase cohorts, and NRR/GRR metrics are not publicly disclosed.
disclaimer: This report is based on publicly available information as of the run date and uses clearly identified third-party
  estimates where Sun King has not published audited or fully reconciled operating disclosures.
