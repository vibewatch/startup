  - id: financing-context
    title: "Financing and Valuation Context"
    body: |
      Sun King's capital structure is layered across equity, mezzanine, project debt, and
      securitization, reflecting the capital intensity of a company that finances solar hardware
      on its own balance sheet before monetizing receivables. The 2022 Series D of $330M led by
      British International Investment (BII) established the unicorn mark. Since then, Lightrock's
      $40M equity in December 2025 and the $156M Citi-arranged securitization in July 2025
      demonstrate continued investor confidence at current valuation levels, though neither
      transaction implies a materially higher headline equity mark.

      IFC's $80M loan for Nigeria expansion is categorized as project/structured debt rather than
      equity, preserving the equity waterfall for earlier investors. Proparco, as part of the AFD
      Group committed €2.5B across nearly 200 projects in 2025, has historically co-invested in
      Sun King alongside BII and is likely a participant in the planned $1.3B raise. The Norfund
      investment adds a Nordic DFI dimension typical for Scandinavian bilateral climate finance.

      The preference overhang on the cap table is material but structure-unknown. With $700M+
      in cumulative capital raised, including convertible debt facilities, the fully diluted
      preference stack likely ranges from $400–600M in senior preferred liquidation preferences.
      This is a critical due diligence item: if the exit value is below $1.2B, common shareholders
      and employees capture little. For commercial minority investors entering at $1.5–2B, the
      preference overhang is less critical provided the exit target is $2.5B+.

      The $156M securitization demonstrates that the PAYG receivables book can be monetized at
      scale—a proof point that de-risks future off-balance-sheet funding and supports a path
      to asset-light growth. The transaction was arranged by Citi and involved FMO, signaling
      institutional-grade structuring capability. Comparable transactions in the sector include
      M-KOPA's $20M note in 2019 and subsequent facilities, though Sun King's $156M is the
      largest off-grid solar securitization on record.
