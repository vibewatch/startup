  - id: scenarios
    title: "Bull, Base, and Bear Scenarios"
    body: |
      The scenario analysis is anchored by three plausible futures that differ principally on
      whether Sun King closes its $1.3B raise on favorable terms, whether African FX stabilizes,
      and whether the company achieves earnings before interest and tax (EBIT) breakeven by 2029.

      In the bull case, Sun King closes the $1.3B raise at a $2.5–3B valuation by end-2026,
      uses the capital to expand Nigeria and DRC distribution, enters the productive-use financing
      segment (solar water pumps, cold chain), and achieves EBIT breakeven by 2028. Exit at
      $3–4B via IPO or strategic acquisition to a utility or large-cap clean energy player would
      deliver 3–4x returns from current $1B mark. Key drivers: FX stability in core markets,
      successful Nigeria manufacturing ramp, sustained GOGLA sector growth of 12–15% per year.

      In the base case, the $1.3B raise completes at a modest step-up ($1.5–1.8B headline valuation),
      FX headwinds persist but do not worsen materially, and the company reaches breakeven by 2030.
      Exit at $2–2.5B in 2028–2030 would deliver 2–2.5x from the current mark. Probability signal:
      the base case is consistent with the 2025 capital markets activity and the CPI climate finance
      trajectory showing consistent growth.

      In the bear case, the $1.3B raise stalls or prices at or below the 2022 $1B mark (a down-round),
      driven by rising global interest rates, FX deterioration in Nigeria (naira depreciation risk
      highlighted by AfDB as up to 6% in 2025), and a rise in PAYG default rates above 15%.
      Equity value compresses to $600M–$900M, DFI investors absorb losses and begin reducing
      exposure, and commercial exit opportunities dry up. Wood Mackenzie's analysis of African
      power market risks and responsAbility's credit risk framework for PAYG solar both highlight
      these channels as the primary downside transmission mechanisms.
