  - id: recommendation-stance
    title: "Recommendation, Confidence, and Valuation Stance"
    body: |
      Sun King receives a "track" recommendation with medium confidence and a "stretched" valuation
      stance at the current $1B+ mark relative to its risk-adjusted free cash flow potential.
      The risk rating is high, driven by undisclosed financials, concentrated FX exposure, and
      dependence on continued DFI participation in future rounds.

      The "track" recommendation acknowledges that Sun King is the highest-quality asset in the
      off-grid solar category and that the underlying market opportunity is real and large. However,
      category leadership alone does not justify a specific entry price when the unit economics of
      a solar loan book in frontier markets—repayment rates, net interest margin, operating
      leverage—remain private. For commercial impact investors, the constellation of SE4All energy
      access data (600M+ unelectrified), IRENA's documentation of 89% solar cost decline since
      2010, and GOGLA's 15% annual sector growth creates a compelling sector narrative. What is
      missing is whether Sun King specifically converts that market tailwind into returns.

      The valuation stance of "stretched" reflects the observation that the company's 2022 Series D
      mark implicitly valued it at 6–10x estimated annualized revenue (based on sector revenue
      intensity ratios), which is above the 3–5x typical for PAYG fintech-adjacent models in
      emerging markets but below the 8–12x commanded by Enphase Energy in developed-market solar.
      KPMG's clean energy insights framework suggests that emerging-market off-grid companies
      warrant a 20–30% discount to developed-market clean energy multiples due to FX, governance,
      and regulatory risk. On that basis, a fair-value range for Sun King is $1.4–2.2B, making the
      $1B+ 2022 mark at the low end of fair and the aspired $2.5–3B bull-case raise target stretched.
