chapter:
  number: 2
  title: Market Analysis
  summary: DentalMonitoring operates in a favorable but hard-to-measure market pocket where adult orthodontic demand, clear-aligner growth, and practice-efficiency pressure all support adoption of asynchronous monitoring. Broad teledentistry and aligner reports validate direction and scale, while AAO data and company-authored case studies show why observation, active-treatment follow-up, and retention workflows can monetize meaningfully inside specialist practices.
sections:
- id: category-definition
  title: Category Definition and Boundary
  body: 'DentalMonitoring does not sit inside one clean market label. The broadest comparable bucket is teledentistry, which market researchers already size in the low-single-digit billions for 2026. That category, however, bundles video consults, communication tools, and software layers that are not all directly relevant to remote orthodontic follow-up. A more commercially useful adjacent market is clear aligners: it is materially larger, more orthodontics-specific, and already anchored around clinician-supervised digital workflows.


    For diligence, the right mental model is a layered stack. Teledentistry is the outer digital-care umbrella; clear aligners and orthodontic workflow software form the practical demand pool; and DentalMonitoring’s true SAM is the subset of practices willing to pay for asynchronous monitoring across observation, active treatment, and retention. Public sources support the direction of category expansion far more confidently than they support a precise standalone TAM for AI orthodontic monitoring.'
