chapter:
  number: 8
  title: Valuation
  summary: DentalMonitoring looks like a strategically valuable orthodontic workflow asset, but the public file is still too thin on retention, financing structure, and audited economics to justify an unconditional buy recommendation around a premium private valuation. The right public-evidence posture is constructive on company quality, cautious on price, and focused on diligence items that could move the call quickly.
sections:
- id: thesis-and-antithesis
  title: Investment Thesis and Anti-Thesis
  body: 'DentalMonitoring has several attributes that matter positively for valuation: visible category leadership in orthodontic remote monitoring, substantial provider and patient scale claims, repeated customer proof across multiple workflows, and evidence that the product can become part of a clinic’s operating layer rather than a superficial add-on. Those are the ingredients investors use to justify strategic premium and recurring-software framing.


    The anti-thesis is not that the company lacks a product. It is that the public file remains too thin on retention, audited margins, financing structure, and precise regulatory scope to support a confident buy recommendation at a full unicorn-style price. This makes valuation a price-and-evidence problem, not a simple quality score. In practice, investors are underwriting the possibility that hidden diligence will confirm quality rather than contradict it.'
