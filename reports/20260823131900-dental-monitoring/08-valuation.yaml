- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Retention cohorts
    - GRR/NRR and logo retention by provider segment
    - Determines whether premium valuation is durable
    - Request cohort dashboards from management
  - - Realized revenue quality
    - Revenue per provider/patient and margin profile
    - Checks whether proxy revenue supports premium price
    - Request financial model and segment detail
  - - Financing terms
    - Preferences, covenants, liquidation and dilution terms
    - Directly changes equity upside
    - Request term sheet and cap-table summary
  - - Regulatory map
    - Module-by-country approval and RUO boundaries
    - Valuation premium needs durable commercial scope
    - Request regulatory matrix
  - - Partner economics
    - Channel mix and dependency exposure
    - Changes exit logic and concentration risk
    - Request partner revenue and roadmap detail
  notes: These asks are the minimum set most likely to move the recommendation.
