- id: recommendation-and-diligence
  title: Recommendation, Confidence, and Diligence Gates
  body: 'On the evidence available publicly, the right posture is to continue diligence rather than rush to conviction. The company looks good enough to stay on the table and too strong to dismiss casually. But it is not disclosed well enough to justify an unconditional buy recommendation around a premium private valuation.


    The recommendation is therefore research more / track closely with medium confidence. The few diligence asks that could change that recommendation quickly are straightforward: retention cohorts, realized revenue per provider or patient, financing terms, and a clean regulatory map by module and geography. If those come back strong, the story could upgrade quickly. If they disappoint, investors should be willing to reframe the company as a good product with mediocre equity upside at the proposed mark.'
