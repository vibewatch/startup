- id: comparable-and-scenario-frame
  title: Comparable Set, Scenario Framing, and Downside
  body: 'The best public comp set is not perfect, but it is useful. Align, Envista, Dentsply, and Straumann are strategically adjacent and provide hard public anchors for scale and valuation, even if their business mixes differ from DentalMonitoring’s software-heavy workflow profile. Those comps imply that investors are paying up for DentalMonitoring based on growth, software characteristics, and strategic relevance rather than on mature current economics.


    That premium can be rational if retention, margins, and regulatory clarity are strong. It can also unwind if those hidden variables disappoint. SmileDirectClub remains a cautionary reminder that orthodontic-adjacent enthusiasm can break quickly when model quality is weaker than expected.'
