- id: unit-economics-and-operating-leverage
  title: Unit Economics and Operating Leverage
  body: 'Public unit-economics evidence is sparse, but enough exists to infer the basic shape. The company’s value proposition clearly turns on chair-time recovery, shorter treatment duration, fewer unnecessary visits, and more scalable observation or retention workflows. Those are practice-level economic benefits that can support recurring software spend if clinical outcomes remain acceptable and compliance stays high.


    The corporate cost structure likely mixes software and services characteristics. Cloud/image-processing infrastructure, customer success, clinical-support labor, onboarding, and hardware logistics all matter. That implies a business that can be attractive if utilization, retention, and workflow standardization are strong, but one whose real gross-margin profile cannot be responsibly underwritten from public material alone.'
