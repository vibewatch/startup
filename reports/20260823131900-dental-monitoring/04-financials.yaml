chapter:
  number: 4
  title: Financials
  summary: 'DentalMonitoring’s public financial story is credible but incomplete: the company appears to run a recurring orthodontic workflow model, introduced a 2026 cap-fee pricing structure, claimed operational profitability in 2025, and then raised $100 million in early 2026. Public tracker revenue and comp data support a specialist growth-company narrative, but the key underwriting metrics that would validate software quality—net retention, gross margin, CAC, burn, and exact financing terms—remain private.'
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Logic
  body: 'DentalMonitoring’s public financial picture starts with business-model shape rather than reported statements. The company appears to sell recurring workflow software to orthodontic practices, monetizing patient monitoring over time instead of collecting one-off consumer fees. The strongest pricing signal in 2026 is the new cap-fee model, which establishes a maximum fee per patient and extends commercial logic across observation, active treatment, and retention. That design suggests management is optimizing for budget predictability and broader lifecycle adoption, not just billing every extra scan opportunistically.


    Public pricing remains thin, but the Ragan case study adds one unusually useful data point: it cites a DM monthly cost without discount of $13 per month. That is not a full price card, yet it helps anchor how practices may translate monitoring into chair-time ROI. In short, the model looks like software-plus-workflow monetization with volume exposure, but not like a transactional consumer-treatment business.'
