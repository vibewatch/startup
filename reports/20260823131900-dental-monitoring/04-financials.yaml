- id: revenue-proxy-and-comp-context
  title: Revenue Proxy and Public-Comp Context
  body: 'GetLatka’s $91 million 2024 revenue figure is the best public corporate revenue proxy available, but it is still only a proxy. Against that backdrop, listed dental comps show just how much smaller DentalMonitoring remains than the large public incumbents. Align, Envista, Straumann, and Dentsply all generate multi-billion-dollar revenue, and their market caps show that investors can still assign meaningful strategic value to dental-technology platforms even without software-style headline multiples.


    These comps are useful, but only up to a point. None is a clean apples-to-apples remote-monitoring software peer. Their main value is context: they demonstrate scale, disclosure quality, and strategic optionality inside dental technology. DentalMonitoring’s public financial story is therefore less about direct comparability and more about whether a specialist workflow company can justify premium positioning despite far smaller revenue.'
