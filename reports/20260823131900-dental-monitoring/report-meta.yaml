summary:
  headline: >
    Dental Monitoring looks like a credible orthodontic workflow leader with unusually
    strong public customer proof, but current public evidence still supports
    research-more rather than a confident premium-price buy because retention,
    financing terms, and audited economics remain private.
  overallScore: 7.2
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: 91
    arrUsdM: 91
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: 8000
    headcount: null
  topStrengths:
    - 'Named customer proof across NHS, observation, braces, aligners, and retention workflows is richer than many private workflow-software peers.'
    - 'Clinician-in-the-loop product positioning reduces some autonomy risk relative to direct-to-consumer orthodontic models.'
    - 'Lifecycle workflow breadth across observation, active treatment, refinements, and retention supports strategic-premium potential.'
    - 'The February 2026 $100M round and claimed 2025 profitability provide real support for continued scale and capital access.'
    - '8,000+ provider and 2M+ patient framing suggests the company is materially beyond pilot-stage adoption.'
  topRisks:
    - 'Retention, concentration, margin quality, and realized revenue per provider/patient remain private, limiting valuation confidence.'
    - 'Regulatory scope and research-use-only boundaries vary by module and territory, creating real diligence risk if commercial scope is over-assumed.'
    - 'Health-data governance and audited security-control depth are not sufficiently disclosed for premium underwriting on public evidence alone.'
    - 'Partner and ecosystem dependence can create bargaining asymmetry even when integrations help growth.'
    - 'A premium private valuation can compress quickly if hidden financing terms, renewals, or regulatory durability disappoint.'
  unresolvedGaps:
    - 'Provider retention cohorts, GRR/NRR, and customer concentration by geography or segment.'
    - 'Audited financial statements, margin profile, and revenue quality beyond tracker-level revenue proxies.'
    - 'Full financing terms from the February 2026 round, including preferences, covenants, and dilution mechanics.'
    - 'Module-by-country regulatory map, including research-use-only boundaries for commercially important workflows.'
    - 'Security architecture, audit cadence, incident history, and processor/data-transfer detail for sensitive health data.'

