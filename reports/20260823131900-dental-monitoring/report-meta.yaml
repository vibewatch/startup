companyProfile:
  summary: >
    Dental Monitoring is a specialist orthodontic workflow platform focused on remote
    monitoring between in-office visits. Its visible strengths are workflow breadth,
    strong named customer proof, and a clinician-in-the-loop product posture that fits
    active treatment, observation, and retention. The company appears strategically
    relevant to orthodontic practices and adjacent aligner ecosystems, and public
    evidence suggests it has crossed beyond pilot-stage credibility. The main weakness
    in public diligence is not product proof but economic opacity: audited revenue,
    margin, retention, concentration, and financing-term detail remain private.
  foundedDate: '2014-01-01'
  founders:
    - name: Philippe Salah
      role: CEO and Co-Founder
      background: >
        Longtime public face of Dental Monitoring and the operating founder most clearly
        documented across funding and company materials.
      claimRefs: []
    - name: Armelle Coquart
      role: Co-Founder
      background: >
        Publicly named as a co-founder in company-profile databases referenced in the
        company-overview chapter, but less prominent in current operating disclosures.
      claimRefs: []
    - name: Emmanuel Salah
      role: Co-Founder
      background: >
        Publicly named as a co-founder in company-profile databases referenced in the
        company-overview chapter, with limited current public operating profile.
      claimRefs: []
  foundingLocation: Paris, France
  headquarters: Paris, France
  productSummary: >
    Core products include AI-assisted remote orthodontic monitoring, patient scanning
    and messaging, clinician dashboards, observation workflows, and retention tools
    such as SmartSTL. The platform is designed to help orthodontists supervise patients
    between in-person appointments using smartphone scans and structured alerts.
  customerFocus: >
    Orthodontic practices and clinical teams across private practices, public-health
    sites, and partner-channeled aligner workflows. Economic value is strongest where
    clinics embed the platform into observation, active treatment, and retention.
  businessModel: >
    Recurring software / workflow pricing tied to monitored patient or practice usage,
    with lifecycle monetization potential across observation, active treatment,
    refinements, and retention. Exact realized revenue mix and retention economics are
    not public.
  stage: 'Late-stage private; internationally deployed; growth-stage with claimed 2025 profitability'
  fundingStatus: >
    Public sources reviewed for this run point to a February 2026 $100M investment
    round and continued unicorn framing. Tracker sources and prior coverage suggest
    substantial prior funding and a large private-capital base, but the exact current
    cap-table and preference structure are undisclosed publicly.
