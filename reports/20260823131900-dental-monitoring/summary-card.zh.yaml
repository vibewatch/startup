  topStrengths:
    - NHS、观察期、牙套、隐形矫治和保持期工作流都有具名客户证据，公开厚度强过许多私有工作流软件同行。
    - 产品把临床医生留在闭环里，相比直接面向消费者的正畸模式，降低了一部分自主性风险。
    - 工作流覆盖观察、主动治疗、精调和保持全生命周期，支撑战略溢价潜力。
    - 2026 年 2 月 $100M 融资，以及公司声称 2025 年已盈利，为继续扩张和获得资本提供了真实支撑。
    - 8,000+ 医疗服务方和 2M+ 患者的口径显示，公司已经明显越过试点采用阶段。
  topRisks:
    - 留存、集中度、利润率质量，以及每名服务方 / 患者实际收入仍未公开，压低估值信心。
    - 各模块、各地区的监管范围和仅限研究使用边界并不一致；如果高估商业化范围，尽调风险会变得真实。
    - 健康数据治理和经审计的安全控制深度披露不足，仅靠公开证据还撑不起溢价承销。
    - 集成能帮助增长，但合作伙伴和生态依赖也可能制造议价不对称。
    - 如果隐藏融资条款、续约表现或监管耐久性不及预期，私募溢价估值可能很快压缩。
  unresolvedGaps:
    - 按地域或客群切分的服务方留存队列、GRR/NRR 和客户集中度。
    - 经审计财务报表、利润率结构，以及超出追踪器收入代理指标的收入质量。
    - 2026 年 2 月融资的完整条款，包括优先权、契约和稀释机制。
    - 按模块、按国家划分的监管地图，包括商业重要工作流的仅限研究使用边界。
    - 敏感健康数据的安全架构、审计频率、事件历史，以及处理方 / 数据传输细节。
