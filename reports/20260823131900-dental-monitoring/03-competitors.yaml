- id: competitive-bottom-line
  title: Bottom-Line Competitive Read
  body: 'DentalMonitoring looks differentiated enough to matter but not insulated enough to relax. The near-term risk comes from specialized monitoring peers that can position around faster adoption or aligner-centric simplicity. The medium-term risk comes from larger ecosystems that can bundle monitoring into broader scanner, aligner, practice, or payments workflows. SmileDirectClub’s collapse is also instructive: it supports the idea that supervised B2B2C care is more defensible than pure DTC, but it does not eliminate the need to prove retention, compliance, and ROI continuously.


    From an investment perspective, the right conclusion is not that DentalMonitoring has no competition; it is that its most plausible moat is workflow depth plus interoperability. Public evidence does not reveal enough cohort data to prove that moat conclusively, so competitive diligence should focus on retention, attach rates, and feature usage in mixed-modality practices.'
