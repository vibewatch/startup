  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Reliable provider share, win-rate, churn, and feature-usage cohorts across monitoring vendors.
    whyItMatters: Product breadth does not guarantee durable leadership without retention and share proof.
    diligencePath: Request competitive win/loss data, gross and net retention by cohort, and module attach rates.
    relatedQuestionRefs:
    - QP025
    - QP027
    relatedTableRefs:
    - TP005
  - type: private-evidence-only
    severity: material
    topic: partner-dependence
    missingEvidence: Attach-rate, referral, and revenue-share terms for Angel, Ormco, and other ecosystem integrations.
    whyItMatters: Channel-helpful partnerships can still create strategic dependency or future disintermediation risk.
    diligencePath: Request partnership economics, attach rates, and renewal dependency analysis.
    relatedQuestionRefs:
    - QP005
    - QP018
    relatedTableRefs:
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: feature-depth
    missingEvidence: A rigorous apples-to-apples feature benchmark versus direct peers across braces, aligners, observation, retention, and refinements.
    whyItMatters: Public product pages often emphasize positioning more than measurable parity tests.
    diligencePath: Run a product demo matrix and request side-by-side RFP responses.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP002
