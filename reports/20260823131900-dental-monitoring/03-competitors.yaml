chapter:
  number: 3
  title: Competitors
  summary: 'DentalMonitoring competes across three layers at once: direct remote-monitoring peers, adjacent workflow substitutes, and larger manufacturer or dental-platform ecosystems that can bundle more of the orthodontic stack. Public evidence suggests DentalMonitoring’s main advantage is workflow breadth and interoperability rather than scale, while its main risk is that bigger ecosystems or narrower specialists can attack one layer of the journey at a time.'
sections:
- id: landscape-structure
  title: 'Landscape Structure: Direct, Adjacent, and Bundled'
  body: 'DentalMonitoring’s competitor set is broader than a normal startup battle card. The closest direct rival is ProMonitoring, which markets remote clear-aligner monitoring explicitly. But the more realistic field includes bundled manufacturers and workflow platforms as well: aligner ecosystems, in-house aligner software, practice-management suites, and financing/case-acceptance tools can all compete for the same orthodontic workflow budget even when they do not replicate DM feature for feature.


    That matters because DentalMonitoring’s real strategic position is full-stack workflow software, not a narrow AI widget. The company is strongest when the decision is “how should a practice run observation, active treatment, retention, and refinement with asynchronous oversight?” It is weakest when a buyer frames the problem more narrowly, such as “how do I add aligner monitoring?” or “how do I bundle more workflow into one software contract?”'
