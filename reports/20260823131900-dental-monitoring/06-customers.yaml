- id: named-customer-proof
  title: Named Customer Proof and Workflow Outcomes
  body: 'The strongest part of the customer evidence base is the named proof set. Monica Reinach provides NHS efficiency evidence. Cornelia Maier, Claire Nightingale, Janka Kochel, Dan Bills, Mike Ragan, Paolo Manzo, Audrey Chokron, Barry Benton, Jean Guilloux, and Eleonóra Ivančová collectively show use across braces, aligners, observation, retention, and mixed workflows. This is not one generic testimonial repeated ten times; it is a fairly rich library of workflow-specific examples.


    The patterns across those examples are strikingly consistent: fewer unnecessary visits, better scheduling flexibility, improved hygiene or communication, and greater clinician control between appointments. That kind of repeated directional proof is helpful, even if most of it remains company-authored. Independent academic literature also points in the same direction, but with more caution about evidence quality and algorithmic limits.'
