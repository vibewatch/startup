- id: patient-experience-and-public-health
  title: Patient Experience, Public Health, and Retention Logic
  body: 'The patient survey is one of the most valuable customer artifacts because it scales beyond a single practice. Across 2,248 respondents in 12 countries, patients reported strong satisfaction, easier communication, reassurance, and convenience from fewer visits. That matters not just as marketing but as a retention signal: asynchronous monitoring only works if patients stay engaged enough to keep scanning and responding.


    Public-health proof strengthens the story further. The NHS and HSE references, plus Monica Reinach’s NHS practice study, show that DM can address capacity constraints and waiting-time pressure in systems where efficiency matters intensely. Those signals suggest the product is not only for premium private workflows; it can also fit institutional care models when implementation is disciplined.'
  claimRefs:
  - CU004
  - CU005
  - CU009
  - CU010
  - CU013
  - CU017
  - CU018
  - CU019
  - CU034
