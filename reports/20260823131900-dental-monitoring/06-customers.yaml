- id: commercial-read-through
  title: Commercial Read-Through and Customer Dependency
  body: 'The public evidence implies that DentalMonitoring can become a core operating layer, not merely a premium add-on, when practices integrate it across observation, active treatment, and retention. Dan Bills’ observation workflow, Claire Nightingale’s case-start expansion, and Janka Kochel’s assistant-led digital journey all point toward the same commercial read-through: the product is most defensible when it gets embedded into staffing patterns and patient communication processes.


    That said, public proof still says more about workflow benefit than about customer economics. There is very little direct disclosure on paid retention, customer concentration, realized revenue per monitored patient, or multi-location expansion behavior. External academic papers also remind investors that positive remote-monitoring results do not automatically mean uniformly strong evidence quality. So the commercial thesis is plausible, but not fully proven.'
  claimRefs:
  - CU008
  - CU015
  - CU016
  - CU021
  - CU022
  - CU025
  - CU026
