company:
  name: Dental Monitoring
chapter:
  number: 6
  title: Customers
  summary: 'DentalMonitoring’s public customer proof is one of the strongest parts of the diligence file: it includes named orthodontic practices, NHS/HSE references, a large patient-attitudes study, and repeated operational examples across aligners, braces, observation, and retention workflows. That evidence supports market credibility and production use, but the most important commercial durability metrics—retention, concentration, and realized revenue per monitored patient—still require private diligence.'
sections:
- id: customer-segments
  title: Customer Segments and Adoption Surface
  body: 'DentalMonitoring’s customers are not limited to one narrow archetype. Public evidence shows private orthodontic practices, digital-first specialist clinics, public-health sites, and observation-heavy pediatric workflows all using the platform. The practical customer is the orthodontic practice or service line, but the user surface spans clinicians, assistants, and patients. That multi-sided model matters because the platform has to deliver value to more than one participant at once: the doctor needs control, the team needs workflow leverage, and the patient needs convenience and reassurance.


    The public adoption markers are meaningful. DM Difference states that 8,000+ providers work with the company, while 2026 funding coverage says the platform serves more than 2 million patients. Those claims need private verification, but they are large enough to support a credible global customer-base narrative.'
