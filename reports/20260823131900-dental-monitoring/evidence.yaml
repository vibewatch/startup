evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: The amortization schedule, covenants, security package, and effective cost of the February 2026 financing.
    whyItMatters: Debt terms determine whether the raise was growth capital or a constraint on future flexibility.
    diligencePath: Request the signed financing summary sheet or board-approved facility memorandum from management.
    relatedQuestionRefs:
      - QO033
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A consistent, accessible post-money valuation reference tied to the February 2026 raise.
    whyItMatters: >-
      Accessible trackers disagree or rely on opaque methodology, limiting precision in underwriting current entry
      price.
    diligencePath: Obtain a cap-table update, investor presentation, or signed financing deck showing post-money valuation.
    relatedQuestionRefs:
      - QO037
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, observer rights, ownership percentages, and any protective provisions for 2026
      investors.
    whyItMatters: Governance rights can materially affect strategic control, future fundraising, and exit optionality.
    diligencePath: Request the latest shareholder agreement, board list, and post-closing capitalization table.
    relatedQuestionRefs:
      - QO033
    relatedTableRefs:
      - TO002
      - TO004
  - type: private-evidence-only
    severity: minor
