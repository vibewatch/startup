- id: mitigations-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: 'Several aspects of the model genuinely mitigate risk. The clinician-in-the-loop design is safer than direct-to-consumer orthodontics, scan standardization reduces some input variability, and partner integrations can reduce workflow friction. But residual risks remain high where the public file is still thin: audited security posture, territory-by-module regulatory mapping, paid retention, and channel dependence.


    For investment purposes, the kill criteria should be explicit. A material narrowing of approved claims, a serious privacy or security incident, evidence of weak provider renewals, or a clear deterioration in partner support would all impair the thesis quickly. In that sense, DentalMonitoring is investable only with disciplined monitoring and targeted confirmatory diligence. Verification should happen before investment committee approval. The practical message for underwriting is straightforward: a good product story does not override unresolved diligence on approvals, privacy controls, and economic durability. If those checks come back strong, risk compresses materially. If they come back weak, valuation and recommendation should both reset quickly.'
