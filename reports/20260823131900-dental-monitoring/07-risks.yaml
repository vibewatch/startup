chapter:
  number: 7
  title: Risks
  summary: DentalMonitoring’s key risks center on regulatory scope, privacy and data governance, evidence quality, ecosystem dependence, and the still-private economics of durable retention. The company’s clinician-in-the-loop posture and growing proof base mitigate some concerns, but they do not remove the need for disciplined diligence on approvals, audited controls, concentration, and financing quality.
sections:
- id: risk-frame
  title: Risk Frame and Severity Ranking
  body: 'DentalMonitoring’s risk profile is best understood as a chain rather than a list. The product has real customer proof, visible workflow utility, and a stronger public evidence base than many private peers. But that strength does not remove the central investment question: whether a clinician-supervised, health-data-heavy orthodontic workflow can scale globally without running into regulatory ambiguity, data-governance friction, ecosystem dependence, or weak cohort economics.


    The highest-severity risks in the current public file are not generic startup risks. They cluster around regulatory scope boundaries, privacy/security verification, evidence quality, and the still-private economics of retention and concentration. Those are the risks most likely to transmit into valuation downside. This ranking is deliberately conservative and prioritizes residual exposure over narrative momentum.'
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR013
  - CR018
  - CR040
  figureRefs:
  - FR001
- id: regulatory-and-legal
  title: Regulatory, Legal, and Privacy Risk
  body: 'The regulatory story is simultaneously reassuring and cautionary. Reassuring, because the company openly frames the product as clinician-assistive and publishes IFU, disclaimer, privacy, and terms pages. Cautionary, because those same materials make clear that module scope and permitted use vary across territories, and that some outputs are still research-use-only. Investors therefore cannot assume that every marketed capability carries the same approval status in every geography.


    Privacy risk is equally material. DentalMonitoring handles sensitive health data, imagery, communications, and workflow metadata. Public legal materials establish baseline duties, but they do not answer the hardest diligence questions around audited controls, regional data architecture, processors, and incident history.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR017
  - CR028
  - CR034
  tableRefs:
  - TR001
  figureRefs:
  - FR002
- id: operational-and-evidence
  title: Operational, Quality, and Evidence Risk
  body: 'Operationally, the model depends on behaviors that management does not fully control: patients must scan correctly and consistently, clinicians or assistants must respond to alerts, and practices must build disciplined protocols around exceptions. The strongest public case studies show those workflows working well, but they also reveal how much implementation quality matters.


    Independent literature adds a second caution. The direction of evidence is broadly supportive, yet evidence certainty remains low and at least one prospective study reports meaningful algorithm-performance limits for some not-tracking predictions. That is not a thesis-breaker on its own, but it does mean investors should resist treating customer testimonials as a substitute for independent validation. Execution quality still matters more than feature count.'
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR018
  - CR020
  - CR036
  - CR037
  - CR038
