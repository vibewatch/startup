      - number: '8.4'
        title: 建议、置信度与尽调关口
        blocks:
          - type: paragraph
            body: >-
              基于公开可得证据，合适姿态是继续尽调，而不是急于形成确信。公司看起来足够好，值得留在桌面上， 也强到不能轻率否定。但公开披露还不足以支撑围绕高溢价私营估值给出无条件买入建议。


              因此，建议是继续研究 / 密切跟踪，置信度为中。少数可以迅速改变建议的尽调问题很直接： 留存队列、按服务提供者或患者实现的收入、融资条款，以及按模块和地区拆分的清晰监管地图。
              如果这些反馈强，故事可以很快上调；如果令人失望，投资人应愿意把公司重新定位为： 产品不错，但在拟议估值下股权上行空间平庸。
