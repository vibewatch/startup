      - number: '7.5'
        title: 缓释因素、监控指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              这套模型确有几项风险缓释因素。临床医生在环的设计比直接面向消费者的正畸更安全， 扫描标准化降低了一部分输入波动，合作伙伴集成也能减少工作流摩擦。但公开资料薄弱之处，
              剩余风险仍高：经审计的安全态势、按地区和模块拆分的监管映射、付费留存，以及渠道依赖。


              投资上，终止标准应当明说。获批声明范围显著收窄、严重隐私或安全事件、服务提供者续约疲软的证据， 或合作伙伴支持明显恶化，都会迅速削弱投资逻辑。因此，DentalMonitoring
              只有在纪律性监控和定向确认尽调之下才具备可投性。 验证应在投委会批准之前完成。对投资判断来说，实际信息很直接：好的产品故事不能覆盖审批、
              隐私控制和经济耐久性上尚未解决的尽调问题。如果这些核查结果强，风险会显著压缩； 如果结果弱，估值和推荐都应迅速重置。
