  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架与严重性排序
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring
              的风险画像最好被理解为一条链，而不是一张清单。产品有真实客户验证、可见工作流效用，公开证据基础也强于许多私营同业。但这些优势没有消除核心投资问题：一个由医生监督、重健康数据的正畸工作流，能否在全球扩张时不撞上监管模糊、数据治理摩擦、生态依赖或薄弱队列经济性。


              当前公开文件中最严重的风险不是泛化创业风险。它们集中在监管范围边界、隐私 /
              安全验证、证据质量，以及留存和集中度这些仍未公开的经济性上。这些风险最可能传导为估值下行。该排序有意保守，优先看残余敞口，而不是叙事动能。
