              公司成本结构很可能混合了软件和服务特征。云端 /
              图像处理基础设施、客户成功、临床支持人力、上线实施和硬件物流都重要。这意味着，如果使用率、留存和工作流标准化足够强，业务可以很有吸引力；但真实毛利率画像无法仅凭公开材料负责任地承销。
