              合作会变成持久渠道还是可替换集成，以及可获得市场数据是否足以支撑精确的当前估值。未解决事项很具体，而非抽象：债务条款、完整董事会结构、经审计收入，以及 2026 年 2 月之后估值的可获取来源。
