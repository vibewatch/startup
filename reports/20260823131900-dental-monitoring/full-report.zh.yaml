  - id: TV005
    title: 投资逻辑破裂与叫停触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 续约疲弱浮现
        - 留存显著低于溢价叙事隐含水平
        - 战略溢价快速消退
        - 重定价或暂停
      - - 融资条款对投资人不友好
        - 优先权或契约显著封顶上行
        - 名义估值高估股权价值
        - 要求更低入场价格
      - - 监管适用范围收窄
        - 商业模块面临审批约束
        - 增长和溢价倍数受压
        - 转为观察 / 不投
      - - 出现安全 / 隐私事件
        - 信任和合规恶化
        - 采用、续约和估值走弱
        - 升级为红旗
      - - 合作伙伴渠道支持减弱
        - 分销和工作流粘性走弱
        - 战略退出逻辑变弱
        - 提高依赖折价
    notes: 这些是面向 IC 的叫停触发因素，不是运营 KPI。
    claimRefs:
      - CV020
      - CV022
      - CV028
      - CV031
      - CV038
  - id: TV006
    title: 最终尽调索要事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 留存队列
        - 按服务方分层的 GRR/NRR 和 logo 留存
        - 决定溢价估值能否守住
        - 向管理层索取队列看板
      - - 已兑现收入质量
        - 单服务方 / 单患者收入及利润率画像
        - 检验代理收入能否支撑溢价价格
        - 索取财务模型和分部明细
      - - 融资条款
        - 优先权、契约、清算和稀释条款
        - 直接改变股权上行空间
        - 索取条款清单和股权结构表摘要
      - - 监管地图
        - 按模块、按国家拆分的审批和 RUO 边界
        - 估值溢价需要可持续的商业范围
        - 索取监管矩阵
      - - 合作伙伴经济性
        - 渠道组合和依赖敞口
        - 改变退出逻辑和集中度风险
        - 索取合作伙伴收入和路线图明细
    notes: 这些索要事项是最可能改变建议的最低集合。
    claimRefs:
