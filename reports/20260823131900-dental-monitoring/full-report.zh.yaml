      - number: '2.4'
        title: 证据强度、地域与限制
        blocks:
          - type: paragraph
            body: >-
              类别动能的正面读法是真实的，但公开证据质量参差不齐。市场报告支撑远程牙科和隐形矫治器的大盘扩张。AAO
              提供了稳健的美国需求快照。但更窄的远程监测层仍高度依赖公司撰写的案例研究、少数论文，以及服务提供者数量或应用商店信号等间接代理值。因此，付费渗透率、细分结构和跨地域附着率仍有未解问题。


              从地域看，北美像是近期最大的商业池；欧洲因产品监管和诊所密度仍具相关性；亚太则是当前报告中增速最快的隐形矫治区域。这些事实支撑全球化雄心，但无法完全解决本地报销、培训或合规差异。纪律严明的投资观点应把类别增长视为证据充分，同时把窄市场精度视为低置信度。
