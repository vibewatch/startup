              公司的里程碑显示，它仍在从单一监测工作流向外拓宽。公开材料提到 ScanBox Pro 发布、与 Angel Aligner 和 Ormco/Spark 的新集成、持续 App 迭代、NHS/HSE 部署，以及与
              2026 年融资相关的新软件开发中心。管理层描述的战略弧线是一个不断扩大的「现代牙科护理操作系统」，而不只是正畸提醒工具。


              最好的公开反向来源是 WOWLS。它把公司框定为一场押注患者依从性的估值赌局，并警告 Align Technology
