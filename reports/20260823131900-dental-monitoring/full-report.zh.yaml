  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 类别定义与边界
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 并不落在一个边界清楚的市场标签里。最宽的可比篮子是远程牙科，市场研究机构已将其 2026
              年规模估在低个位数十亿美元区间。但这个类别把视频问诊、沟通工具和软件层都打包进去，并非全部都与正畸远程复诊直接相关。更有商业解释力的相邻市场是隐形矫治器：它规模更大、更贴近正畸，并且已经围绕医生监督的数字化工作流展开。


              尽调时，更合适的心智模型是一层叠一层的栈。远程牙科是最外层的数字护理伞；隐形矫治器和正畸工作流软件构成实际需求池；DentalMonitoring
              的真实可服务市场（SAM）则是愿意为观察、主动治疗和保持期的异步监测付费的那部分诊所。公开来源对类别扩张方向的支撑，远强于对 AI 正畸监测独立总可用市场（TAM）的精确支撑。
