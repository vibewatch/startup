      - number: '7.3'
        title: 运营、质量与证据风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，这套模型依赖管理层并不能完全控制的行为：患者要正确且持续地完成扫描，临床医生或助理要响应提醒， 诊所还要围绕异常情况建立严格流程。公开案例中最强的那些确实展示了这些工作流跑得很好，
              但也暴露了实施质量有多关键。


              独立文献给出第二层提醒。证据方向整体支持公司叙事，但证据确定性仍然偏低， 至少一项前瞻性研究也报告，在部分未跟踪预测上算法性能存在实质限制。这本身不足以推翻投资逻辑，
              但意味着投资人不能把客户证言当成独立验证的替代品。执行质量仍比功能数量更重要。
