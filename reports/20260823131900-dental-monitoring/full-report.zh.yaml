      - number: '7.4'
        title: 依赖、财务与生态风险
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 的商业模式也有依赖风险。产品承载在 iOS 和 Android 端，依赖患者参与， 也越来越受益于 Angel、Ormco 等合作伙伴渠道。这些集成可以加快分发、加深工作流采用，
              但也带来议价不对称和典型竞合风险暴露。


              财务风险不是消失，而是换了形态。2026 年融资和盈利声明降低了短期偿付风险， 但公开材料仍未解释融资条款、优先权包袱，或盈利质量到底如何。公司也没有披露客户集中度或留存队列。
              因此，模型层面仍有重要风险没有解决。在队列数据证明相反之前，投资人应假定其经济性存在隐性脆弱性。
