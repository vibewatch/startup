      - number: '1.3'
        title: 产品、规模与商业定位
        blocks:
          - type: paragraph
            body: >-
              官方产品叙事异常连贯：DentalMonitoring 把医生仪表盘、患者智能手机 App、基于协议的提醒，以及获得专利的 ScanBox Pro
              影像采集配件组合起来，远程观察治疗进展。产品页称，平台可以检测并监测 130 多种口腔观察项。About 页面称，其自研 AI 基于超过 5 亿张照片处理而成。DM Difference 页面进一步表示，已有
              8,000 多名服务提供者使用平台。


              患者侧规模主张集中出现在 2026 年 2 月融资报道潮中，公司关联来源和独立媒体都指向「超过 200 万名患者」。应用商店证据强化了运营图景：Apple 显示约 14,000 条评分、4.8/5 分、支持 22
              种语言，并披露受监管医疗器械信息及 FDA 所有者 / 运营者编号；Google Play
              则重复医生监督的工作流。这些数据点合在一起，说明这项业务已经不再是早期试验：它有真实用户牵引、以临床为边界的工作流约束，也有足够产品成熟度来支撑全球运营叙事。
