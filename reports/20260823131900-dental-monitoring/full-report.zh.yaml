  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价逻辑
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 的公开财务图景首先呈现的是商业模式形态，而非报告报表。公司似乎向正畸诊所销售经常性工作流软件，通过长期患者监测变现，而不是收取一次性消费者费用。2026
              年最强的定价信号是新的封顶费用模式，它为每名患者设置最高费用，并把商业逻辑延伸到观察、主动治疗和保持期。这个设计表明，管理层优化的是预算可预测性和更广泛的生命周期采用，而不只是机会主义地对每一次额外扫描收费。


              公开定价信息仍偏薄，但 Ragan 案例研究提供了一个少见而有用的数据点：其中引用的 DM 无折扣月费为每月 $13。这不是完整价格表，却能帮助锚定诊所如何把监测转化为椅旁时间
              ROI。简言之，该模式像是带有用量敞口的软件加工作流变现，而不像交易型消费者治疗业务。
