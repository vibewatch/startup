              如果留存、利润率和监管清晰度强，这种溢价可以合理化；如果这些隐藏变量不及预期，溢价也可能回撤。 SmileDirectClub 仍是一个警示：只要模式质量弱于预期，正畸相邻赛道的热情会很快破裂。
