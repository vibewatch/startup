            body: >-
              公司的资本历史方向清楚。多个来源都指向 2021 年一轮重要独角兽融资，以及 2026 年 2 月新的 $100M 融资。与 Lazard Elaia
              相关的融资材料和公司推广报道还称，DentalMonitoring 在新融资前已于 2025
              年实现运营盈利。这个顺序很重要：一家在宣称盈利里程碑后再融资的公司，与一家因核心运营仍结构性缺钱而融资的公司，读法不同。


              即便如此，可获得公开来源仍无法厘清 2026
              年融资的精确性质。追踪页面、新闻稿和投资者材料在金额上基本一致，但对具体工具语言并不总是一致。法国登记文件确认了正式资本变动和治理事件，同时也显示名义股本相对风投支持企业价值极小。投资人因此应把法律形式数据和经济实质分开看。
