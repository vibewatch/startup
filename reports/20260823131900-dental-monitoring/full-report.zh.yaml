companyProfile:
  summary: >
    Dental Monitoring
    是一家专注正畸工作流的垂直平台，核心场景是在到院复诊之间做远程监测。它的可见优势在于工作流覆盖面宽、具名客户证据强，以及保留医生在环的产品姿态，能够覆盖主动治疗、观察和保持期。公司对正畸诊所及相邻的隐形矫治生态似乎具备战略相关性；公开证据也显示，它已经越过试点阶段的可信度门槛。公开尽调的主要弱点不是产品验证，而是经济数据不透明：经审计收入、利润率、留存、客户集中度和融资条款细节仍未披露。
