              DentalMonitoring
              正处在一个有利的市场口袋里：成人正畸需求高，隐形矫治器仍是强相邻支出基础，专科诊所有运营理由采用异步监督。公司的产品也把可触达工作流从主动治疗扩展到观察和保持期；从战略上看，这一点可能比自上而下的远程牙科 TAM
              标题更重要。


              主要限制是分析性的，而不是方向性的。公开市场里没有一套干净数据可以回答「AI
