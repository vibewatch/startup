  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块与资产组合
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 的公开产品组合比类别简称暗示的更宽。核心栈包括面向患者的 App、医生仪表盘、用于标准化居家采集的 ScanBox Pro、用于治疗前适配评估和安全咨询的 DM
              Engage、用于远程 STL 更新的 SmartSTL，以及连接其他软件和隐形矫治生态的集成层。这不只是一个监测功能；公司试图在主动治疗之前、之中和之后，占住更多正畸工作流。


              这种宽度重要，因为它改变了投资问题。狭窄的监测工具更容易被复制或打包。一个多模块工作流系统如果与采集质量、消息、精修和保持期绑定，就更难被压缩成单一功能比较。
