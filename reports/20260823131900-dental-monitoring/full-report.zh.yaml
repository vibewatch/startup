chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与总部
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 位于正畸软件、医疗器械工作流和 AI
              赋能远程护理的交汇处。无论是官网、投资者材料还是第三方追踪网站，都一致把它描述为一家总部位于巴黎的私营公司；其核心产品帮助正畸医生和牙科团队用智能手机影像与引导式流程，在到院复诊之间监测患者。公司称成立于
              2014 年，而主要法国法律实体 Dental Monitoring SAS 到 2016 年末才正式注册。这个差别重要：商业故事从 2014 年开始，但注册时间线显示，当前法律载体比创立叙事晚了大约两年。


              最强的地址证据也相互印证：法国工商登记记录和 Apple 的受监管医疗器械披露都指向 75 rue de Tocqueville, 75017
              Paris。公开数据库也一致将公司列为私营公司，看不到上市股权披露义务的迹象。实际写作中，后续章节可以把 DentalMonitoring 视为一家总部位于巴黎、法律结构为法国 SAS 的牙科 AI
              平台；其商业身份早于当前实体注册。
