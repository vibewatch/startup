  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 有几项对估值有正面意义的特征：在正畸远程监测中具备可见的品类领导地位， 服务提供者和患者规模声明可观，多个工作流反复出现客户证明，也有证据显示，产品能嵌入诊所运营层，
              而不是停留在表层插件。这些要素，是投资人拿来支撑战略溢价和经常性软件叙事的基础。


              反向逻辑不是公司没有产品，而是公开资料在留存、经审计利润率、融资结构和精确监管范围上仍过于单薄， 不足以支撑在完整独角兽式价格下给出有把握的买入建议。因此，估值问题不只是质量打分，
              而是价格与证据是否匹配。实际上，投资人押注的是：隐藏尽调会确认质量，而不是推翻质量。
