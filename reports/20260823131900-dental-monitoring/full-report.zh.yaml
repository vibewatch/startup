  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构：直接、相邻与打包式竞争
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 的竞争者集合比普通创业公司战卡更宽。最接近的直接对手是
              ProMonitoring，后者明确营销远程隐形矫治监测。但更现实的竞争场还包括打包式厂商和工作流平台：隐形矫治生态、院内隐形矫治软件、诊所管理套件，以及融资 / 病例接受工具，即便不逐项复制 DM
              功能，也会争夺同一笔正畸工作流预算。


              这一点重要，因为 DentalMonitoring 真正的战略位置是全栈工作流软件，而不是狭窄的 AI
              小组件。当决策问题是「一家诊所应如何用异步监督来运营观察、主动治疗、保持期和精修」时，公司最强；当买方把问题收窄成「我如何增加隐形矫治监测」或「我如何把更多工作流打包进一份软件合同」时，公司最弱。
