      - number: '2.2'
        title: 需求驱动与数量顺风
        blocks:
          - type: paragraph
            body: >-
              最重要的需求证据来自 AAO。成人正畸需求已不再是边缘现象：AAO 称三分之一患者是成人，其 2025 年普查显示，仅美国会员体系内就约有 191
              万成人患者正在接受治疗。这些数据与隐形矫治器市场报告自然衔接，后者显示，一个由美观、便利和数字化治疗规划带动的支出池规模庞大且仍在增长。


              DentalMonitoring 受益于同样的结构性力量。诊所试图处理更多病例、保住专科医生椅旁时间，并在不丢失临床控制的前提下提供更便利的随访体验。因此，DentalMonitoring
              最强的市场信号不是抽象的远程医疗，而是成人需求上升、隐形矫治渗透率提高，以及专科诊所内部工作流压力三者叠加。
