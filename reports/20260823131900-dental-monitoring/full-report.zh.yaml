  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 留存强、融资条款干净、全球扩张延续、工作流溢价持久
        - 战略溢价坐实后，价值可超过约 1.4B
        - 执行偏差与监管变化
        - 有可能，但公开证据尚未证明
      - - 基准
        - 产品质量健康、经济性证据不完整、没有重大负面意外
        - 约 1.0B-1.3B，入场纪律仍关键
        - 条款和留存不透明
        - 最符合当前证据
      - - 悲观
        - 隐藏融资包袱、留存走弱、估值压缩或监管摩擦
        - 低于约 0.8B，按当前预期上行有限
        - 下行兑现可能快于上行
        - 若尽调不及预期，风险重大
    notes: 情景区间是决策脚手架，不是模型推导出的点估计。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV037
      - CV038
      - CV039
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 状态
      - 参考意义
      - 局限
    rows:
      - - Align
        - 上市战略型正畸龙头
        - 约 2.8x 市值 / 收入
        - 最接近的大型正畸科技锚点
        - 规模更大，业务组合更宽
      - - Envista
        - 上市牙科科技平台
        - 约 1.6x 市值 / 收入
        - 有用的多元化牙科基准
        - 工作流软件纯度较低
      - - Dentsply Sirona
        - 上市牙科老牌公司
        - 约 0.6x 市值 / 收入
        - 低端成熟可比锚点
        - 业务更宽泛，硬件权重更高
      - - Straumann
        - 高质量牙科战略方
        - 约 5.6x 市值 / 收入
        - 显示牙科科技也能跑出高溢价结果
        - 不是直接的正畸工作流类比对象
      - - SmileDirectClub
        - 正畸相邻的下行情景
        - 股权价值被摧毁
        - 模型质量的警示性可比对象
        - 商业模式存在重大差异
    notes: 可比对象具备战略参考价值，但经济口径并不完美。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public orthodontic and dental-tech anchors plus one downside warning, not
        every possible software or medtech comp.
