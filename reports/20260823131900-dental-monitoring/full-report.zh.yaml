              3Shape
              形成另一种压力：它帮助诊所或技工所把隐形矫治设计带到院内，从而降低对部分外部工作流供应商的依赖，并可能增加对更简单、更窄范围监测工具的需求。因此，替代风险真实存在但不完整：许多替代方案可以拿下一层旅程，但看起来较少能同时覆盖观察、主动治疗、保持期和精修。
