      - number: '2.3'
        title: 买方、用户与工作流经济性
        blocks:
          - type: paragraph
            body: >-
              远程监测在诊所层面采购，却由多方共同使用。正畸医生或 DSO 是经济买方，员工和医生操作仪表盘，患者生成影像并通过 App 互动。买方、用户和付费方的拆分很重要，因为 DentalMonitoring
              的投资回报主要来自运营：减少不必要预约、更早干预，并更高效地管理观察或保持期。


              最强的公开案例都指向同一个方向。DentalMonitoring 的案例研究和白皮书库反复把价值框定为释放产能。Dr. Ragan 的报告描述了截断性治疗复诊减少、治疗周期缩短。Dr. Bills
              的观察工作流展示了如何远程监测一个低急迫度的大人群。Paolo Manzo
              的论文把该模式与更少的非计划急诊和更好的卫生提醒联系起来。因此，这个类别最适合被理解为一种软件：它把两次就诊之间的临床不确定性，转化为可分诊的工作流。
