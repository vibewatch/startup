      - number: '1.4'
        title: 融资历史与资本形成
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring 的资本历史方向清楚，即便部分追踪网站的累计口径不同。Tracxn、Golden 和 Seedtable 都显示，公司从 2010 年代中期的早期轮次，推进到 2021
              年大额融资，并在 2026 年 2 月获得新的 $100M 融资。Tracxn 报告称，2021 年轮次规模为 $150M，估值 $1B；这是目前最清晰、可获取的独角兽标记。2026 年融资引入 Lazard
              Elaia Capital 和 ISALT，公司关联来源强调公司已在 2025 年实现运营盈利。


              精确累计融资额没有那么整齐。Tracxn 报告约 $301M、四轮；The Company Check 报告 $300.53M；Seedtable 报告六轮合计 $329.2M；Golden
              列出六次融资，但早期轮次金额无法完全对齐。尽调中更重要的结论是：（1）业务无疑获得了风投 / 私募股权支持；（2）2021 年确立独角兽地位；（3）考虑到盈利说法和持续产品扩张，2026
              年融资看起来更像战略扩张资本，而不是救助性融资。
