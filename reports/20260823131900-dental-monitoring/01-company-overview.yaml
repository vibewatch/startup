company:
  name: Dental Monitoring
chapter:
  number: 1
  title: Company Overview
  summary: DentalMonitoring is a Paris-headquartered dental AI company founded in 2014 that built one of orthodontics' best-known remote monitoring platforms around smartphone image capture, clinician dashboards, and patented ScanBox hardware. Public sources support 2021 unicorn status, a fresh $100 million 2026 financing, more than 2 million patients monitored, and a broadening integration ecosystem, but accessible evidence on current valuation, debt terms, board composition, and audited financial performance remains incomplete.
sections:
- id: identity-founding
  title: Identity, Founding, and Headquarters
  body: 'DentalMonitoring sits at the intersection of orthodontic software, medical-device workflow, and AI-enabled remote care. Across its official site, investor materials, and third-party trackers, the business is consistently described as a Paris-based private company whose core product helps orthodontists and dental teams monitor patients between in-office visits using smartphone images and guided protocols. The company was founded in 2014, while the main French legal entity, Dental Monitoring SAS, was formally incorporated in late 2016. That distinction matters: the commercial story starts in 2014, but the registry timeline shows the current legal vehicle post-dates the founding narrative by roughly two years.


    The strongest address evidence also aligns: French registry records and Apple’s regulated-medical-device disclosure both point to 75 rue de Tocqueville, 75017 Paris. Public databases consistently call the company private, with no signs of listed-equity disclosure obligations. In practice, later chapters can treat DentalMonitoring as a private, Paris-headquartered dental AI platform whose legal structure is French SAS and whose commercial identity was established before the current entity was incorporated.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO046
  tableRefs:
  - TO001
- id: founders-leadership-governance
  title: Founders, Leadership, and Governance
  body: 'Philippe Salah is the clearly documented CEO and public spokesperson across tracker pages, funding announcements, and partnership releases. Co-founder attribution is less clean. The Company Check explicitly names Armelle Coquart, Emmanuel Salah, and Philippe Salah as founders, while Mérieux’s investor page simplifies the story to Philippe Salah alone. That is not a fatal conflict, but it does mean any investment memo should distinguish between “publicly named founder set” and “principal operating founder still serving as CEO.”


    Governance visibility is limited, but 2026 registry events provide useful clues. Le Figaro’s corporate-record timeline shows multiple 2026 capital increases and records Alexandre Margoline joining the strategic committee effective 5 February 2026, consistent with Lazard Elaia’s participation in the new round. Public sources do not disclose the full board, observer rights, or cap-table percentages. The governance read-through is therefore that investor influence increased in 2026, but accessible evidence still stops well short of a complete control map.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO029
