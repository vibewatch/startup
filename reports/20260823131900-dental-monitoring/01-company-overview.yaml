- id: milestones-adverse-signals-and-open-issues
  title: Milestones, Skeptical Views, and Open Issues
  body: 'The company’s milestone stream shows continued broadening beyond a single monitoring workflow. Public materials reference the ScanBox Pro launch, new integrations with Angel Aligner and Ormco/Spark, continued app iteration, NHS/HSE deployments, and a new software development center tied to the 2026 raise. The strategic arc described by management is a widening “operating system for modern dental care,” not just an orthodontic alert tool.


    The best adverse public source is WOWLS, which frames the business as a valuation bet on patient compliance and warns that stronger incumbents like Align Technology could pressure the model. Some of that language is rhetorical, but it surfaces legitimate diligence themes: how sticky weekly scanning behavior really is, whether OEM partnerships become durable channels or replaceable integrations, and whether accessible market data is good enough to support a precise current valuation. The unresolved items are concrete rather than abstract: debt terms, full board structure, audited revenue, and an accessible post-February-2026 valuation source.'
