  shortDescription: >
    Dental Monitoring is a Paris-based orthodontic workflow software company founded in 2014. It sells AI-assisted
    remote monitoring, patient engagement, observation, refinement, and retention tools used by orthodontic practices
    between in-person visits. Public evidence supports 8,000+ providers, 2M+ patients, a claimed 2025 profitability
    milestone, and a $100M investment round announced in February 2026, reinforcing unicorn status but leaving financing
    terms and audited economics opaque.
