  - FE002
- id: architecture-and-dependencies
  title: Architecture, Dependencies, and Interoperability
  body: 'Public material is enough to infer the main operating architecture even though it is not enough to validate it deeply. DentalMonitoring depends on high-quality patient image capture, cloud-side image processing, AI triage, clinician review, messaging loops, and, in some workflows, proprietary hardware. It also relies on named integrations with aligner vendors and other software providers rather than an obvious open-source or open-developer ecosystem.


    That last point is visible in the GitHub search result: no public repository footprint. This does not weaken the clinical product directly, but it does show that DentalMonitoring is not building a bottom-up developer moat in the manner of an API platform. Its moat, if real, is workflow integration and clinical operations, not community extensibility.'
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE021
  - CE025
  - CE028
  - CE030
  tableRefs:
  - TE003
  - TE006
  figureRefs:
  - FE003
- id: compliance-and-evidence
  title: Compliance, Validation, and Evidence Quality
  body: 'The public compliance story is nuanced. Instruction-for-use and terms pages say some modules are medical devices and require HCP supervision. The disclaimer goes further by separating approved uses from outputs considered research-use-only across territories. That is a healthy transparency signal, but it is also a reminder that investors must understand exactly which outputs drive value in each market and which remain more experimental.


    Evidence quality is decent but uneven. The case-study and white-paper library is extensive and useful for workflow understanding, while Nature and JWFO add welcome external validation. Still, much of the proof set remains company-authored, which means a full technical diligence process should press on architecture, controls, model metrics, and post-market performance evidence.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE014
  - CE020
  - CE023
  - CE026
  - CE028
  tableRefs:
  - TE004
  - TE005
- id: product-bottom-line
  title: Bottom-Line Product / Technology Read
  body: 'On public evidence alone, DentalMonitoring looks like a clinically oriented, workflow-deep product with real proprietary assets. The strongest visible differentiators are home-capture standardization, mixed-modality support, and lifecycle reach from observation through retention. The weakest visible area is not product ambition but disclosure depth: there is too little public information on architecture diagrams, security controls, model-performance dashboards, and feature-level cohort usage.


    That combination is encouraging but incomplete. The product appears meaningful enough to support a differentiated thesis, yet private diligence is still required to verify operational robustness and regulatory boundary management. The practical implication is that product breadth appears real, but system quality should still be judged by measured retention, alert accuracy, security posture, and workflow adoption inside clinics rather than by marketing scope alone. Investors should especially verify alert precision, patient adherence, implementation quality, and any difference between approved and research-use-only outputs before assigning premium software value.'
  claimRefs:
  - CE019
  - CE022
  - CE024
  - CE026
  - CE027
  - CE029
  - CE032
  - CE033
  - CE034
  - CE035
