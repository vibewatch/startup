company:
  name: Dental Monitoring
chapter:
  number: 5
  title: Product & Technology
  summary: 'DentalMonitoring’s public product stack now looks like a workflow-deep orthodontic platform rather than a narrow monitoring feature: it combines patient capture, AI triage, clinician workflows, DM Engage, SmartSTL, and partner integrations across observation, active treatment, and retention. The strongest visible strengths are mixed-modality breadth and standardized home capture, while the main diligence gaps remain architecture detail, security controls, and the fact that much of the proof set is still company-authored.'
sections:
- id: module-portfolio
  title: Product Modules and Asset Portfolio
  body: 'DentalMonitoring’s public product portfolio is broader than the category shorthand suggests. The core stack includes a patient-facing app, a clinician dashboard, ScanBox Pro for standardized home capture, DM Engage for pre-treatment suitability and secure consults, SmartSTL for remote STL updates, and an integration layer connecting other software and aligner ecosystems. This is not just a monitoring feature; it is an attempt to own more of the orthodontic workflow before, during, and after active treatment.


    That breadth matters because it changes the investment question. A narrow monitoring tool can be copied or bundled more easily. A multi-module workflow system tied to capture quality, messaging, refinement, and retention is harder to reduce to a single feature comparison.'
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE013
  - CE024
  - CE025
  - CE031
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflow-and-use-cases
  title: Workflow, Use Cases, and Clinical Coverage
  body: 'The product workflow begins with patient-captured smartphone images, runs through AI quality control and detection, and then routes outputs into clinician review and messaging. Public materials and case studies show support across aligners, braces, interceptive treatment, observation, and retention-adjacent workflows. Audrey Chokron highlights aligner unseat detection, Barry Benton and Jean Guilloux show braces-specific capabilities, and Dan Bills plus Mike Ragan show the platform supporting observation and interceptive orthodontics.


    DM Engage and SmartSTL deepen that workflow ownership on both ends. DM Engage reaches upstream into conversion and triage, while SmartSTL reaches downstream into refinements and relapse management. On public evidence, this breadth is one of the clearest product differentiators.'
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE009
  - CE010
  - CE015
  - CE016
  - CE017
  - CE018
  - CE031
