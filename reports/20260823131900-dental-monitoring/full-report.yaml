      - number: '7.3'
        title: Operational, Quality, and Evidence Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the model depends on behaviors that management does not fully control: patients must scan
              correctly and consistently, clinicians or assistants must respond to alerts, and practices must build
              disciplined protocols around exceptions. The strongest public case studies show those workflows working
              well, but they also reveal how much implementation quality matters.


              Independent literature adds a second caution. The direction of evidence is broadly supportive, yet
              evidence certainty remains low and at least one prospective study reports meaningful algorithm-performance
              limits for some not-tracking predictions. That is not a thesis-breaker on its own, but it does mean
              investors should resist treating customer testimonials as a substitute for independent validation.
              Execution quality still matters more than feature count.
            claimRefs:
              - CR006
