      - number: '2.3'
        title: Buyer, User, and Workflow Economics
        blocks:
          - type: paragraph
            body: >-
              Remote monitoring is purchased at the practice level but used by multiple parties. Orthodontists or DSOs
              are the economic buyers, staff and clinicians operate the dashboard, and patients generate the images and
              engage through the app. That buyer-user-payer split matters because DentalMonitoring’s ROI is mostly
              operational: fewer unnecessary appointments, earlier intervention, and more efficient observation or
              retention management.


              The strongest public examples all point the same way. DentalMonitoring’s case-study and white-paper
              library repeatedly frames value as capacity recovery. Dr. Ragan’s report describes fewer interceptive
              visits and shorter treatment duration. Dr. Bills’ observation workflow shows how a large low-acuity
              population can be surveilled remotely. Paolo Manzo’s paper links the model to fewer unscheduled
              emergencies and better hygiene messaging. The category is therefore best understood as software that
              converts between-visit clinical uncertainty into triageable workflow.
