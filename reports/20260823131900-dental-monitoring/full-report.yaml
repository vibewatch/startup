  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Logic
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring’s public financial picture starts with business-model shape rather than reported
              statements. The company appears to sell recurring workflow software to orthodontic practices, monetizing
              patient monitoring over time instead of collecting one-off consumer fees. The strongest pricing signal in
              2026 is the new cap-fee model, which establishes a maximum fee per patient and extends commercial logic
              across observation, active treatment, and retention. That design suggests management is optimizing for
              budget predictability and broader lifecycle adoption, not just billing every extra scan opportunistically.


              Public pricing remains thin, but the Ragan case study adds one unusually useful data point: it cites a DM
              monthly cost without discount of $13 per month. That is not a full price card, yet it helps anchor how
              practices may translate monitoring into chair-time ROI. In short, the model looks like
              software-plus-workflow monetization with volume exposure, but not like a transactional consumer-treatment
              business.
