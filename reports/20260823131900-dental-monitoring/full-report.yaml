            body: >-
              The company’s capital history is directionally clear. Multiple sources converge on a major 2021 unicorn
              round and a fresh $100 million financing in February 2026. Financing materials linked to Lazard Elaia and
              company-promoted coverage also say DentalMonitoring reached operational profitability in 2025 before the
              new raise. That sequence matters: a business raising growth capital after a claimed profitability
              milestone reads differently from a company raising because core operations remain structurally
              underfunded.


              Even so, the exact nature of the 2026 financing remains ambiguous in accessible public sources. Tracker
              pages, press writeups, and investor materials agree on amount, but not always on precise instrument
