      - number: '3.3'
        title: Manufacturer Ecosystems, Partners, and Asymmetric Threats
        blocks:
          - type: paragraph
            body: >-
              The most strategically important competition may come from ecosystems that are not always marketed as
              direct rivals. Align, Envista/Ormco, and other manufacturers control major aligner or dental-distribution
              surfaces. DentalMonitoring’s Angel and Ormco integrations are constructive in the near term because they
              deepen adoption and reduce switching friction. But they also create a classic coopetition problem: the
              partner learns where demand sits, while retaining the option to internalize more workflow over time.


              Public market data reinforce the scale asymmetry. Align, Envista, and Dentsply operate with revenue and
              market-cap resources that dwarf DentalMonitoring’s public revenue proxy. That does not mean they offer
              identical products today. It does mean they have more room to bundle, subsidize, or acquire adjacent
              workflow layers if the category proves valuable enough.
