        title: Direct Monitoring Peers and Product Breadth
        blocks:
          - type: paragraph
            body: >-
              ProMonitoring is the most direct public peer, but it appears more aligner-centric than DentalMonitoring’s
              current positioning. DentalMonitoring’s public footprint now spans braces, observation, retention, and
              SmartSTL-driven mid-course correction or relapse workflows. That breadth is strategically relevant because
              AAO’s own aligner guidance says braces still matter for many cases; in other words, a product optimized
              only for aligner tracking may not own the full orthodontic workflow.


              This is why SmartSTL and ScanBox matter beyond product marketing. They make DentalMonitoring harder to
              reduce to “another monitoring app” by pulling the platform toward refinements, relapse, and standardized
              image capture. Public evidence still does not prove win rates or market share, but it does support a
              product-breadth argument that many narrower alternatives cannot match.
