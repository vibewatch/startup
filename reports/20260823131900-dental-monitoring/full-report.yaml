chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Headquarters
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring sits at the intersection of orthodontic software, medical-device workflow, and AI-enabled
              remote care. Across its official site, investor materials, and third-party trackers, the business is
              consistently described as a Paris-based private company whose core product helps orthodontists and dental
              teams monitor patients between in-office visits using smartphone images and guided protocols. The company
              was founded in 2014, while the main French legal entity, Dental Monitoring SAS, was formally incorporated
              in late 2016. That distinction matters: the commercial story starts in 2014, but the registry timeline
              shows the current legal vehicle post-dates the founding narrative by roughly two years.


              The strongest address evidence also aligns: French registry records and Apple’s regulated-medical-device
              disclosure both point to 75 rue de Tocqueville, 75017 Paris. Public databases consistently call the
              company private, with no signs of listed-equity disclosure obligations. In practice, later chapters can
              treat DentalMonitoring as a private, Paris-headquartered dental AI platform whose legal structure is
              French SAS and whose commercial identity was established before the current entity was incorporated.
