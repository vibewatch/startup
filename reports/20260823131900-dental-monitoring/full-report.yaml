        title: Funding History and Capital Formation
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring’s capital history is directionally clear even if some tracker totals differ. Tracxn,
              Golden, and Seedtable all show a progression from early rounds in the mid-2010s to a major 2021 round and
              a fresh $100 million financing in February 2026. Tracxn reports a $150 million 2021 round at a $1 billion
              valuation; that is the cleanest accessible unicorn marker. The 2026 raise brought in Lazard Elaia Capital
              and ISALT, with company-linked sources emphasizing that the company had already reached operational
              profitability in 2025.


              The exact cumulative amount raised is less tidy. Tracxn reports roughly $301 million over four rounds, The
              Company Check reports $300.53 million, Seedtable reports $329.2 million across six rounds, and Golden
              enumerates six financings with early-round amounts that do not reconcile perfectly. For diligence
              purposes, the important takeaways are: (1) the business is unquestionably venture/private-equity backed,
              (2) 2021 established unicorn status, and (3) the 2026 round appears to be strategic scale capital rather
              than rescue financing, given the profitability claim and continuing product expansion.
