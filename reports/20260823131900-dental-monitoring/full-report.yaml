companyProfile:
  summary: >
    Dental Monitoring is a specialist orthodontic workflow platform focused on remote monitoring between in-office
    visits. Its visible strengths are workflow breadth, strong named customer proof, and a clinician-in-the-loop product
    posture that fits active treatment, observation, and retention. The company appears strategically relevant to
    orthodontic practices and adjacent aligner ecosystems, and public evidence suggests it has crossed beyond
    pilot-stage credibility. The main weakness in public diligence is not product proof but economic opacity: audited
    revenue, margin, retention, concentration, and financing-term detail remain private.
