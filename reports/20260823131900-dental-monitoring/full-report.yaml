      - number: '2.4'
        title: Evidence Strength, Geography, and Limits
        blocks:
          - type: paragraph
            body: >-
              The positive read on category momentum is real, but public evidence quality is uneven. Market reports
              support broad expansion in teledentistry and aligners. AAO offers a robust US demand snapshot. Yet the
              narrower remote-monitoring layer still relies heavily on company-authored case studies, a handful of
              academic articles, and indirect proxies such as provider counts or app-store signals. That leaves open
              questions around paid penetration, segment mix, and cross-geography attach rates.


              Geographically, North America looks like the largest near-term commercial pool, Europe remains relevant
              for both product regulation and practice density, and Asia-Pacific is the fastest-growth aligner region in
              current reports. Those facts support global ambition, but they do not fully solve local reimbursement,
              training, or compliance variation. A disciplined investment view should treat category growth as well
              supported, while treating narrow-market precision as low-confidence.
            claimRefs:
              - CM013
