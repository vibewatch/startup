      - number: '8.2'
        title: Current Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The February 2026 financing is clearly a positive signal. It indicates that sophisticated capital was
              willing to back continued expansion and that the company can pair growth funding with a public
              profitability claim. That combination usually deserves respect.


              But funding headlines are not the same thing as price clarity. Public coverage does not fully disclose
              preferences, covenants, dilution, or the exact post-money framework that would determine equity upside for
              a new investor. Entry discipline therefore matters as much as company quality. It also means investors
              should treat the round as validation of interest, not as outsourced valuation work. The more ambitious the
              entry price, the more important it becomes to inspect downside protections, liquidation economics, and any
              non-obvious investor rights.
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
              - CV018
              - CV024
              - CV028
              - CV037
              - CV038
      - number: '8.3'
        title: Comparable Set, Scenario Framing, and Downside
        blocks:
          - type: paragraph
            body: >-
              The best public comp set is not perfect, but it is useful. Align, Envista, Dentsply, and Straumann are
              strategically adjacent and provide hard public anchors for scale and valuation, even if their business
              mixes differ from DentalMonitoring’s software-heavy workflow profile. Those comps imply that investors are
              paying up for DentalMonitoring based on growth, software characteristics, and strategic relevance rather
              than on mature current economics.


              That premium can be rational if retention, margins, and regulatory clarity are strong. It can also unwind
              if those hidden variables disappoint. SmileDirectClub remains a cautionary reminder that
              orthodontic-adjacent enthusiasm can break quickly when model quality is weaker than expected.
            claimRefs:
