            body: >-
              DentalMonitoring’s public product portfolio is broader than the category shorthand suggests. The core
              stack includes a patient-facing app, a clinician dashboard, ScanBox Pro for standardized home capture, DM
              Engage for pre-treatment suitability and secure consults, SmartSTL for remote STL updates, and an
