      - number: '3.4'
        title: Adjacent Workflow Substitutes and Budget Competition
        blocks:
          - type: paragraph
            body: >-
              Archy and OrthoFi show why orthodontic software competition is often budget competition rather than direct
              feature overlap. Archy offers an all-in-one dental operating platform with communication, imaging, and AI
              surfaces. OrthoFi focuses on case acceptance, financing, insurance, and collections. Neither obviously
              replaces DM’s core clinical-monitoring logic, but both can be purchased from the same operating budget and
              both can tighten workflow control around the patient journey.


              3Shape creates a different kind of pressure: by helping practices or labs bring aligner design in house,
              it reduces dependence on some external workflow vendors and may increase demand for simpler, more tightly
              scoped monitoring tools. That makes the substitution risk real but partial: many alternatives can capture
              one layer of the journey, while fewer appear to cover observation, active treatment, retention, and
              refinement together.
