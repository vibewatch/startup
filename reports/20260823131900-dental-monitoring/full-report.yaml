      - number: '2.5'
        title: Bottom-Line Market Read
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring is operating in a favorable market pocket: adult orthodontic demand is high, aligners
              remain a strong adjacent spend base, and specialist practices have operational reasons to adopt
              asynchronous oversight. The company’s product also expands the addressable workflow beyond active
              treatment into observation and retention, which may matter more strategically than top-down teledentistry
              TAM headlines.


              The main caveat is analytical, not directional. There is no clean public dataset for “AI-powered remote
              orthodontic monitoring market size,” so underwriting must rest on layered proxies rather than one
              authoritative number. That makes the category investable, but it pushes diligence toward bottoms-up
              provider, case-volume, and attach-rate questions instead of trusting broad market reports alone.
