            body: >-
              Philippe Salah is the clearly documented CEO and public spokesperson across tracker pages, funding
              announcements, and partnership releases. Co-founder attribution is less clean. The Company Check
              explicitly names Armelle Coquart, Emmanuel Salah, and Philippe Salah as founders, while Mérieux’s investor
              page simplifies the story to Philippe Salah alone. That is not a fatal conflict, but it does mean any
              investment memo should distinguish between “publicly named founder set” and “principal operating founder
              still serving as CEO.”


              Governance visibility is limited, but 2026 registry events provide useful clues. Le Figaro’s
              corporate-record timeline shows multiple 2026 capital increases and records Alexandre Margoline joining
              the strategic committee effective 5 February 2026, consistent with Lazard Elaia’s participation in the new
              round. Public sources do not disclose the full board, observer rights, or cap-table percentages. The
              governance read-through is therefore that investor influence increased in 2026, but accessible evidence
              still stops well short of a complete control map.
