    Core products include AI-assisted remote orthodontic monitoring, patient scanning and messaging, clinician
    dashboards, observation workflows, and retention tools such as SmartSTL. The platform is designed to help
    orthodontists supervise patients between in-person appointments using smartphone scans and structured alerts.
  customerFocus: >
