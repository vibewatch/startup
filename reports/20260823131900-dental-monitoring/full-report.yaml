      - number: '7.4'
        title: Dependency, Financial, and Ecosystem Risk
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring’s commercial model also carries dependency risk. The product runs through iOS and Android
              surfaces, relies on patient engagement, and increasingly benefits from partner channels such as Angel and
              Ormco. Those integrations can accelerate distribution and deepen workflow adoption, but they also create
              bargaining asymmetry and classic coopetition exposure.


              Financial risk has shifted rather than disappeared. The 2026 raise and profitability claims reduce
              immediate solvency concerns, yet public materials still do not explain financing terms, preference
              overhang, or the true quality of profitability. Nor do they disclose customer concentration or retention
              cohorts. That leaves meaningful model risk unresolved. Investors should assume hidden economic fragility
              until cohort data proves otherwise.
            claimRefs:
