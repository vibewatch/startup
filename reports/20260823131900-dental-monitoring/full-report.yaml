      - number: '1.3'
        title: Product, Scale, and Commercial Positioning
        blocks:
          - type: paragraph
            body: >-
              The official product narrative is unusually coherent: DentalMonitoring combines a clinician dashboard, a
              patient smartphone app, protocol-based alerts, and the patented ScanBox Pro image-capture accessory to
              observe treatment progress remotely. The product page says the platform can detect and monitor more than
              130 oral observations. The About page says the proprietary AI was built by processing more than half a
              billion photographs. The DM Difference page adds that more than 8,000 providers work with the platform.


              Scale claims on the patient side are concentrated in the February 2026 financing wave, where
              company-linked and independent media sources converge on “more than 2 million patients.” App-store
              evidence strengthens the operational picture: Apple shows a 4.8/5 rating from roughly 14,000 ratings, 22
              languages, and a regulated-medical-device disclosure with an FDA owner/operator number, while Google Play
              repeats the clinician-supervised workflow. Together, those data points support a business that is no
              longer an early experiment: it has real user traction, clinically framed workflow constraints, and enough
              product maturity to support a global operating narrative.
