  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Structure: Direct, Adjacent, and Bundled'
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring’s competitor set is broader than a normal startup battle card. The closest direct rival
              is ProMonitoring, which markets remote clear-aligner monitoring explicitly. But the more realistic field
              includes bundled manufacturers and workflow platforms as well: aligner ecosystems, in-house aligner
              software, practice-management suites, and financing/case-acceptance tools can all compete for the same
              orthodontic workflow budget even when they do not replicate DM feature for feature.


              That matters because DentalMonitoring’s real strategic position is full-stack workflow software, not a
              narrow AI widget. The company is strongest when the decision is “how should a practice run observation,
              active treatment, retention, and refinement with asynchronous oversight?” It is weakest when a buyer
              frames the problem more narrowly, such as “how do I add aligner monitoring?” or “how do I bundle more
              workflow into one software contract?”
