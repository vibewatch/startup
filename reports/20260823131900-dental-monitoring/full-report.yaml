  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Frame and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              DentalMonitoring’s risk profile is best understood as a chain rather than a list. The product has real
              customer proof, visible workflow utility, and a stronger public evidence base than many private peers. But
              that strength does not remove the central investment question: whether a clinician-supervised,
              health-data-heavy orthodontic workflow can scale globally without running into regulatory ambiguity,
              data-governance friction, ecosystem dependence, or weak cohort economics.


              The highest-severity risks in the current public file are not generic startup risks. They cluster around
              regulatory scope boundaries, privacy/security verification, evidence quality, and the still-private
              economics of retention and concentration. Those are the risks most likely to transmit into valuation
              downside. This ranking is deliberately conservative and prioritizes residual exposure over narrative
              momentum.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR013
              - CR018
              - CR040
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR011
              - CR013
              - CR018
              - CR029
              - CR040
      - number: '7.2'
        title: Regulatory, Legal, and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory story is simultaneously reassuring and cautionary. Reassuring, because the company openly
              frames the product as clinician-assistive and publishes IFU, disclaimer, privacy, and terms pages.
              Cautionary, because those same materials make clear that module scope and permitted use vary across
              territories, and that some outputs are still research-use-only. Investors therefore cannot assume that
              every marketed capability carries the same approval status in every geography.


              Privacy risk is equally material. DentalMonitoring handles sensitive health data, imagery, communications,
              and workflow metadata. Public legal materials establish baseline duties, but they do not answer the
              hardest diligence questions around audited controls, regional data architecture, processors, and incident
              history.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR017
              - CR028
              - CR034
