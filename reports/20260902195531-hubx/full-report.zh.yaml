      - number: '2.2'
        title: 采用面很广，但变现仍是瓶颈
        blocks:
          - type: paragraph
            body: >-
              这个市场最强的乐观信号是习惯形成。Sensor Tower 称，2025 年生成式 AI 应用下载量翻倍至 3.8B，收入超过 $5B，使用时长达到 48B 小时。Menlo Ventures 和 Pew
              也印证这不再是小众试验：61% 美国成年人近期使用过 AI，95% 听说过 AI，62% 表示每周至少与 AI 互动数次，73% 愿意让 AI 协助日常生活。但变现仍卡住。Menlo 估计，更广义消费 AI
              用户中只有约 3% 为高级服务付费；RevenueCat 解释了原因：订阅流失集中在早期，试用转化集中在第 0 天，昂贵月付计划留存很差。与此同时，Appfigures
              显示，浅层套壳应用仍能赚到可观收入，但很大一部分支出已经流向通用助手和 ChatGPT 主导品类。结论是，市场奖励的是快速兑现价值和垂直场景效用，不只是贴上「AI」标签。
