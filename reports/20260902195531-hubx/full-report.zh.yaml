      - number: '2.3'
        title: 买方分层，以及土耳其为什么在供给侧重要
        blocks:
          - type: paragraph
            body: >-
              HubX
              主要卖给个人，不是采购委员会。在核心应用品类里，用户、买方和付款人往往是同一个人或家庭成员：想更快写作、生成图片、边走边学，或养成更健康习惯的人。但供给侧优势仍重要，因为产品组合必须快速更新，还要用效果营销、本地化、设计和模型集成支撑。土耳其为这种运营模式提供了合理基地。Invest
              in Türkiye 强调，土耳其人口年轻、总量 85.7M，每年近 1M 大学毕业生，工程相关毕业生超过 72,000 人，并且是全球第八大应用下载市场；这些条件让该国成为消费应用的生产和测试场。KPMG 和
              Invest 也显示，本地生态不是纸面故事，而是在加深：本地和外资都活跃，AI 是更有活力的垂直之一，VivaTech 和 Turcorn 100
              等国际展示项目明确面向具备出口能力的创业公司。缺口不在于有没有人才，而是缺少高级 AI 人才和规模化内容运营的精确成本基准。
