chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、地域与中枢-工作室模式
        blocks:
          - type: paragraph
            body: >-
              HubX
              把自己定义为土耳其消费科技平台，而不是单一应用公司。官网称公司是一个技术中枢，负责设计、打造、上线并放大高可扩展应用；同页还解释，自主运作的内部工作室负责具体产品垂直领域，中央中枢提供办公室、数据工具、资金和方法论等共享资源。这个运营设计很关键，因为它最清楚解释了：一家
              2022 年才成立的公司，为什么已经能拿出横跨 AI 聊天、图像生成、学习、健康、植物识别、纹身设计等消费品类的可见产品组合。2026 年融资材料把公司锚定在 Izmir，并称其现在同时在 Izmir 和
              Istanbul 运营。官网联系方式列出 Izmir 总部和 Istanbul Maslak Square 办公室，印证了这两个城市。落到业务上，HubX 卖的是一套可复用的工作室引擎：把集中化变现、获客、数据和
              AI 基础设施包在多个应用概念外面，而不是只押注一个旗舰品牌。
