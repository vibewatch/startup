  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：不是所有 AI，而是付费消费 AI 移动工具
        blocks:
          - type: paragraph
            body: >-
              界定 HubX 市场，最干净的起点是先说明它不是什么。HubX 不是在争夺泛企业 AI
              转型预算，也不是以纯游戏工作室为主。公开产品组合指向的是付费消费工具：聊天助手、图像和视频生成、小颗粒学习、健康，以及相邻生活方式应用，经由移动应用商店分发，主要靠订阅或应用内购买变现。因此，最宽的可比支出池不是总软件支出或总
              AI 投资，而是非游戏移动应用经济。Sensor Tower 估计，2025 年移动 IAP 总收入为 $167B，非游戏应用支出约 $85B，生成式 AI 是增长最快的收入驱动。HubX
              真正服务的市场还更窄：全球移动支出中，消费者会反复付费来省时间、创作内容或提升自我的专业 AI 辅助体验。这个边界重要，因为它同时保留机会和现实；消费 AI
              足够大，值得关注，但也足够小，默认模型提供商和应用商店规则会实质压缩差异化薄弱应用的可寻址池。
