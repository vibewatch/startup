      - number: '8.4'
        title: 决策现在应从叙事转向可衡量门槛
        blocks:
          - type: paragraph
            body: >-
              HubX 现在需要基于门槛的承销，而不是更多泛泛赞赏。乐观情景很直接：私有数据显示 Nova
              不是唯一主要付费引擎，网页端计费正在变得实质性重要，队列留存强，管理层能把新资本和收购用起来，同时不牺牲利润率质量。在这种情况下，披露估值可能被证明合理，甚至有吸引力。基准情景同样成立：HubX
              是强运营商，故事也有溢价，但外部仍不知道足够多，无法判断公司该拿 Duolingo 式、AppLovin
              式，还是更低质量的倍数。悲观情景是，漏斗顶部规模掩盖了集中度、流失和平台税问题；这些问题往往只有轮次关闭后才变得明显。因此，剩余尽调问题比任何更多庆祝式媒体报道都重要。投资人需要
              ARR、产品集中度、留存、毛利率、渠道 mix、优先股堆叠和收购经济性，才应从继续研究转向买入。如果这些数据不披露或偏弱，正确动作不是否认 HubX 的业务存在，而是坚持更强价格纪律，或继续留在观察名单。
