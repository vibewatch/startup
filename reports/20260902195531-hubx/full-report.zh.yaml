        - 融资、规模和可比公司事实可信，但核心未公开分母缺失
        - 继续尽调，而不是直接否决
      - - 风险评级
        - 高
        - 平台依赖、流失风险、AI 捆绑和收购执行仍然重要
        - 需要明确否决触发项和下行保护
      - - 估值立场
        - 取决于未公开指标，介于偏高与合理之间
        - 在 $1.2B 投前估值下，支撑力度取决于尚未公开的 ARR、利润率、集中度和条款
        - 价格必须取决于数据室发现
      - - 决策触发项
        - 只有 ARR、留存、毛利率和条款越过门槛，才推进买入
        - 公开证据缩小了问题范围，但没有给出答案
        - 用基于门槛的投委会流程
    notes: 这是价格敏感型建议，不是否定公司质量。
