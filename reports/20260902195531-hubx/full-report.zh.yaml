  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 和产品结构
        - 当前 ARR、确认收入，以及头部应用按毛利润计的贡献
        - 判断 HubX 是接近 Duolingo、质量更低，还是比公开证据显示的更好
        - 财务团队；经审计的管理层报告
      - - 队列和续费质量
        - 按应用家族拆分的付费订阅者留存、取消、退款和拒付率
        - 区分漏斗顶部规模和可持续客户价值
        - 订阅 / BI 团队；队列导出和计费分析
      - - 毛利率堆栈
        - 按渠道和产品家族拆分的毛利率，包括应用商店费用、AI 成本、支持成本和 Web 经济性
        - 检验溢价软件倍数是否站得住
        - 财务加基础设施审查
      - - Web 与应用商店结构
        - Web、Apple、Google 和任何登记商户合作伙伴的账单占比
        - 验证是否已分散应用商店抽成和政策集中风险
        - 支付 / 增长团队；商户报告
      - - 股权结构表和条款
        - 优先股堆叠、期权池、按比例跟投权、附函和分期机制
        - 好公司对应的证券也可能很差
        - 法务顾问和融资文件
      - - 收购管线
        - 标的标准、整合模型、预期回本和 earn-out 敞口
        - 新资本故事明确包括 M&A，因此执行质量现在纳入估值
        - CEO / 企业发展材料和董事会材料
    notes: 每项要求都要把决策推向买入、重设价格或放弃，而不是堆积泛泛背景信息。
