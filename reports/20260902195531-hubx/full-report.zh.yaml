      - number: '1.3'
        title: 产品版图和共享基础设施
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个判断：共享基础设施是 HubX 核心竞争资产之一。产品页和融资公告反复突出四个头部品牌——Nova、Wiser、DaVinci 和 Lotus Flow——但应用商店页面和 Google
              Cloud 材料显示，长尾产品大得多。Google Play 目前列出 HubX 其他产品，覆盖 AI 视频、室内设计、语言辅导、记笔记、logo 生成、宏量营养追踪、翻译和健身。Google Cloud
              案例研究给出最具体的外部证据，证明中央 AI 技术栈真实且重要：HubX 使用 Google Kubernetes Engine、Cloud Run、TPUs、GPUs 和 Hyperdisk
              ML，把响应时间压到 10 秒以下、推理速度提高 2.5 倍、运营成本降低 40%、启动或部署时间缩短 20 到 30 倍。官网还通过 RevenueX
              补上变现角度；这是内部应用内购买引擎，管理层称它把订阅收入提高 50%，并在面向第三方发行商商业化。合在一起，这些来源描绘的 HubX 更像高速消费 AI 产品的操作系统，而不是简单的应用发行器。
