            body: >-
              公开证据在机制上很强，在总量上仍弱。HubX 自有材料称，公司通过产品运营自筹资金做到盈利；Nova、Wiser、DaVinci 和 Lotus Flow 的 App Store
              页面也呈现同一商业模式：免费进入、多档经常性订阅，有些还叠加广告或终身方案。这不是企业 SaaS
              公司或纯广告网络的变现方式，而是消费应用组合的典型特征：需要快速试用转化，也需要严格续费纪律。组合也明显不止一个爆款。Google Play 显示，HubX
              发布范围覆盖聊天、学习、创意、健身、翻译和笔记。未知的是投资人真正需要建模的部分：收入中有多少来自
              Nova，每个应用家族背后有多少付费用户，账单额中年度和周度占比如何，以及头部组合里究竟有多少产品在经济上有贡献。
