  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据支撑
      - 改变判断的证据
    rows:
      - - 投资逻辑：HubX 具备真实规模和执行体系
        - Point72 融资、盈利说法、40+ 款产品、600M+ 用户、合作伙伴案例和 Google Cloud 性能提升
        - 产品层收入和留存数据证实，规模能转化为持久现金流
      - - 投资逻辑：强劲但未披露的经济性可能支撑估值
        - Web 计费、流失挽回、订阅者基础设施和成本改善都指向正确方向
        - 在 NDA 下披露 ARR、毛利率、渠道结构和集中度
      - - 投资逻辑：公开可比公司显示消费者愿为习惯型产品付费
        - Duolingo 和 Spotify 证明，大型订阅平台能获得可观公开市场价值
        - HubX 展示出可比的续费质量和披露深度
      - - 反向逻辑：公开来源仍未披露真正的测算分母
        - ARR、烧钱速度、毛利率、NRR、退款和产品集中度缺失
        - 数据室用可审计队列数据填补这些缺口
      - - 反向逻辑：平台和应用商店抽成可能被总账单掩盖
        - Duolingo 披露文件明确 15%-30% 应用商店费用，以及对 Apple / Google 的高集中度
        - HubX 按产品家族证明 Web 分流和毛利率韧性
      - - 反向逻辑：更大的 AI 平台可能把同类用例打包进默认产品
        - Alphabet 和 Adobe 正把 AI 嵌入各自生态
        - HubX 展示可防守留存、更强变现，或由收购带来的品类宽度
    notes: 每个投资逻辑项都对应一个可证伪的尽调测试，而不是假定它永久成立。
