      - number: '3.3'
        title: 分发、切换成本和信任才是真正竞争卡点
        blocks:
          - type: paragraph
            body: >-
              这个市场最难的不是做出可用 AI 功能集，而是第一次下载后继续抓住用户注意力。Sensor Tower 和 Menlo 从不同角度指出同一个结构性问题：默认助手拿走了过高使用时长，消费 AI
              切换成本接近零。这意味着 Nova 不只是和另一个聊天应用竞争；它是在和用户打开 ChatGPT 的习惯，或已经嵌进 Google 生态的助手竞争。应用商店又加一层权力，Apple 和 Google
              控制审核政策、订阅披露和推荐位。信任也正在变成竞争过滤器。Canva 推 Shield 和管理员控制，Adobe 强调商业安全生成和内容凭证，Codeway 2026
              年泄露报道则显示，一个高速套壳工作室一旦隐私控制失守，信誉会塌得多快。对 HubX 来说，留存和安全姿态与功能宽度同样重要，因为一旦用户怀疑计费、隐私或输出可靠性，就可以立刻多栖或流失。
