      - number: '8.2'
        title: 可比公司能提供支撑，但不能绕开缺失分母
        blocks:
          - type: paragraph
            body: >-
              抓取到的可比公司集合能支撑估值讨论，不能直接盲目套读。Duolingo 是最好的上市对照，因为它移动端优先、订阅占比高、全球化，并明确披露应用商店依赖和单位成本驱动。按 2026 年 9
              月粗略公开数据，Duolingo 的交易倍数约为年化 Q2 收入的 6.2x。AppLovin 商业模式不同，但它重要在于展示公开市场愿意为顶级移动平台经济性和巨量现金生成支付什么价格：以 2026 年 9
              月市值计，约为年化 Q2 收入的 13.9x。Spotify 对使用习惯、规模和订阅韧性有参考价值，但精确倍数意义较弱，因为抓取到的收入披露以欧元计，市值参考以美元计。更广泛的 BVP Emerging
              Cloud Index 也提醒投资人，多数流动性 AI 和软件基准篮子是云软件篮子，而不是消费移动 AI 组合。换句话说，可比公司能给 HubX 划出区间，却不能替代私人数据。可比公司的正确启示，不是断言
              HubX 一定高估或低估；而是估值支撑取决于 HubX 实际落在何处——更像 Duolingo 式消费订阅，还是更像动量驱动的 AI 叙事。
