      - number: '2.4'
        title: 增长驱动很强，但集中度、政策和信任限制上行空间
        blocks:
          - type: paragraph
            body: >-
              三项结构性驱动支撑 HubX 的市场。第一，全球消费者已经在移动 AI
              工具上花真金白银，专业垂直应用的变现仍好于订阅应用中位数。第二，默认助手行为不会消灭专业产品，只会抬高差异化门槛，尤其当延迟、多模态或工作流明确性很重要时。第三，土耳其应用开发和创业基础让 HubX
              这类工作室比单产品创业公司更快迭代和本地化。约束同样重要。默认助手主导使用时长，Big Tech 发行商快速拿份额，切换成本接近零。上游模型提供商还公布相对较低的 API
              价格，降低进入门槛并鼓励新套壳。政策层面，Apple 和 Google 越来越要求明确订阅透明度，EU AI Act 也加入披露义务和潜在罚款。最后，消费者希望对生活中的 AI
              有更多控制，这意味着激进计费或不透明 AI 行为会把增长变成流失。简言之，市场大且在增长，但分发权和信任成本让它容错率很低。
