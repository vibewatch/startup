companyProfile:
  summary: >-
    HubX 是一家创立于 Izmir 的土耳其消费科技公司，打造并扩张一组 AI 原生移动和网页应用。公开可见的旗舰产品包括 Nova，一个多模型 AI 助手；Wiser，小颗粒学习和心理健康产品；DaVinci，AI
    图像生成应用；以及 Lotus Flow，健康与习惯入口。公开材料称，公司靠自有资金做到盈利，产品扩至 40 款以上，并在 2026 年 8 月从 Point72 获得首笔外部资本前，已覆盖 190 多个国家、累计超过 600M
    用户或下载量。
