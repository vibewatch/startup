      - number: '7.3'
        title: 执行风险现在既关乎整合和地域，也关乎编码速度
        blocks:
          - type: paragraph
            body: >-
              Point72 融资之前，HubX
              主要执行难题是快速推出产品并放大规模。融资之后，难题被拉宽了。公司现在打算把收购叠加到一个中心化平台上；哪怕技术栈很强，整合、治理和文化风险也会随之增加。公开可见的领导层叙事也指向关键人集中：创始人和少数技术负责人撑起了大部分故事线。HubX
              显然在投入人才管线和公开招聘，但高速增长的 AI 工作室很少能把人才风险视为小事。地理位置又加了一层压力。World Bank 材料指出，Türkiye 面临通胀、生产率、FDI
              走弱以及显著物理风险敞口，包括地震集中度。一家扎根这一环境、却面向全球变现的消费公司，业务连续性和宏观纪律比表面的独角兽标签更重要。高估值能容纳试错，却没那么能容纳可避免的运营失序。
