      - number: '4.3'
        title: 融资看起来是机会型增长资金，但并购可能让原本轻的资产负债表变重
        blocks:
          - type: paragraph
            body: >-
              HubX 故事中最强正面财务信号，是公司看起来并不需要救命钱。官方材料反复描述一个盈利、靠自有资金起步的业务，现在融资是为了做更多事——尤其是收购——而不是简单补亏。这一区分很重要。至少，公司已有 Point72
              的首期 $50M；如果选择权行使，可能再拿 $25M。若盈利属实，这笔钱应足够普通应用运营。复杂性不是生存，而是战略：HubX
              正在改变资本模式，把收购计划加到过去内部融资的运营引擎上。收购会带来整合成本、潜在或有支付、法律费用、营运资本支持，并要求更高的执行容错。公开来源没有披露当前现金、烧钱速度或债务，因此投资人看不出新一轮主要是机会型
              M&A 弹药，还是更昂贵下一阶段的缓冲垫。可以把这轮视为支持因素，但不能把它当作现金跑道的完整答案。
