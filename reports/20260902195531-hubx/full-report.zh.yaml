      - number: '7.4'
        title: 只有治理分母补上，剩余风险才可定价
        blocks:
          - type: paragraph
            body: >-
              剩下的风险问题不是概念问题，而是证据问题。公开材料已经证明 HubX
              有需求、有真实产品，也有相当的技术复杂度。它们还没有证明，平台放大到规模后治理是否足够严。投资人仍看不到监管往来、应用商店警告记录、单应用收入集中度、拒付率、退款批准率、正式事故响应材料或安全认证。这些缺口会放大上文所有风险，因为外部无法清楚区分正常成长阵痛和更深层控制薄弱。公司可以扛住一些订阅投诉、一些宏观波动，或一些模型供应商依赖；没有分母，这些问题就很难定价。因此，HubX
              的 thesis-break
              触发点不在原始用户增长，而在投诉强度、商店政策事件、流失质量、集中度漂移，以及管理层能否随着组合扩张拿出控制成熟度文件。同样重要的是，治理缺口不解决，正向信号也会打折；外部看不出当前高增长到底稳、靠促销，还是脆弱。
