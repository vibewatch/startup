        title: 监管和消费者保护风险正在 HubX 经营的关键界面上升
        blocks:
          - type: paragraph
            body: >-
              HubX 的品类组合同时落入多个政策制度。EU AI Act 已不再是遥远概念：欧盟委员会公开材料现在明确列出聊天机器人和 AI 生成内容的透明度义务、GPAI
              相关文档和版权要求，以及围绕文档和纠正措施的后续执法权。这一点很重要，因为 HubX 公开营销聊天助手、图像生成器、创作者界面，以及会微调或构建模型的 AI Lab。AI
              专项监管之外，应用商店层也在持续收紧。Apple 审核规则把用户生成内容审核、健康声明支持和第三方 SDK 问责交给开发者；Google Play
              则持续扩大安全、权限和验证政策。最后一层消费者保护覆盖经常性订阅。FTC 关于默认续订等负面选项计划的指引，加上 HubX 自身取消和退款界面，使计费清晰和易取消从简单客服问题变成法律风险向量。
