      - number: '3.2'
        title: 捆绑和包装决定谁显得贵、谁成为默认、谁还能显得特别
        blocks:
          - type: paragraph
            body: >-
              公开定价数据呈现三种竞争模式。第一类是 ChatGPT、Claude、Gemini、Character.AI 和 Nova 这样的直接消费助手，免费入口加应用内购买或月度升级降低采用摩擦。第二类是 Canva 和
              Adobe Firefly 这样的更宽套件，AI 被捆进设计、编辑和工作流平台；它们解决的不止一个任务，因此能支撑更高支付意愿。第三类是 Headspace 和 Calm
              这样的垂直订阅，买方付费买的是可信赖的习惯系统和内容库，不只是 LLM 响应。HubX 的机会夹在这些桶之间：它聚合模型，可以让通用 AI 比第一方应用更方便；它保持体验轻量，也可以让垂直 AI
              比完整套件更便宜。问题在于，捆绑也会压缩独立产品定价权。当 Google 把 Gemini 加进 Android 和 Search，或 Adobe、Canva 把生成能力折进创作者技术栈时，通用套壳要么在 UX
              上胜出，要么大幅打折。
