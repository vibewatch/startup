  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发项
    rows:
      - - 乐观
        - 多款应用贡献有意义 ARR；Web 计费分散应用商店抽成；毛利率接近软件；收购保持克制
        - 如果收入质量足够持久，本轮估值可显得合理到有吸引力
        - 未公开队列、渠道结构和毛利率都随规模改善
        - Nova 集中度或收购整合比预期更糟
      - - 基准
        - HubX 执行力强，但未公开分母只是不错，并非顶级
        - 本轮介于合理和偏高之间；持股纪律比拿到项目更重要
        - 管理层分享核心指标，但表现参差，不算突出
        - 条款、集中度或流失劣于作为基准的消费订阅龙头
      - - 悲观
        - 漏斗顶部规模真实，但流失、应用商店抽成、支持摩擦和捆绑压力压住盈利质量
        - 公司始终拿不到溢价消费软件倍数，本轮看起来昂贵
        - ARR 披露滞后、毛利率噪声大，或产品依赖仍高
        - 客户质量指标继续隐藏，或未通过门槛测试
    notes: 情景是测算框架，不是公司披露的预测。
