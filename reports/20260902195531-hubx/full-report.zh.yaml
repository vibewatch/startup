      - number: '1.2'
        title: 资本形成、估值与并购转向
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月 Point72 交易是 HubX 公开历史的拐点。此前，公司称自己完全靠自有资金发展。已宣布的轮次不是简单 $75M 现金交割：可获取来源一致描述为先投 $50M、另有 $25M
              选择权，因此标题数字包含执行可选性，不是第一天就全额到账。不过估值信号很清楚。HubX、Newsfile、Türkiye Today、Daily Sabah 和 Bazaar Times 都把这轮定在约
              $1.2B 投前估值，数据聚合方则四舍五入到约 $1.275B 到 $1.3B。管理层把资金定义为 M&A、产品组合扩张和更深中央基础设施投入的加速器，而不是求生融资。HubX
              长期在线的发行商合作、应用收购和创业公司投资页面也强化了这一叙事，说明公司想从高产工作室演进为更广的消费科技平台整合者。已公布顾问也暗示，尽管这是首轮外部融资，流程已有机构级质量。
