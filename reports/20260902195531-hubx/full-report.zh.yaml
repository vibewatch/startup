        title: 图表
        blocks:
          - type: callout
            title: 订阅计费信任，是最尖锐的可见法律与声誉风险点
            body: Trustpilot 投诉、Paddle 支持负担，以及不断演进的取消订阅执行规范指向同一个结论：经常性订阅卫生状况伤害 HubX 的速度，可能比产品需求疲弱更快。
