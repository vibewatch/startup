  - id: FE001
    title: HubX 产品架构栈
    type: stack
    layout: wide
    summary: HubX 的公开架构像一套分层消费者 AI 栈：从移动产品，经编排与部署，延伸到专门的 Google Cloud 基础设施。
    data:
      layers:
        - label: 消费者应用层
          detail: Nova、DaVinci、Wiser、BetterSpeak、NoteAI、HomeAI、Lotus Flow 等面向具体任务的产品，把 AI 打包进订阅型移动体验。
          items:
            - 聊天与研究
            - 图像与视频生成
            - 学习习惯
            - 会议捕捉
            - 语言练习
            - 健康日课
        - label: 体验与工作流层
          detail: 应用加入语音、搜索、文件、摘要、个性化、提醒和结构化流程，让基础模型在具体任务里显得有用。
          items:
            - 语音模式
            - 网页搜索
            - 文件处理
            - 间隔重复
            - 行动项提取
            - 面向风格或目标的用户体验
        - label: 模型编排层
          detail: HubX 将外部前沿模型 API 与 AI Lab 的内部微调目标结合起来。
          items:
            - GPT 系列
            - Gemini
            - Claude
            - DeepSeek
            - 开源基础模型
            - HubX 微调系统
        - label: 部署与控制层
          detail: 公开资料称，工作负载稳定后，HubX 先用 Cloud Run 快速上线，再用 GKE 做规模化控制。
          items:
            - Cloud Run
            - Cloud Run functions 函数
            - GKE
            - AI Hypercomputer
        - label: 加速器与存储层
          detail: 性能调优取决于选对硬件并缩短模型启动时间。
          items:
            - Trillium TPUs
            - A100 GPUs
            - L4 GPUs
