          - type: callout
            title: 依赖既是模式特征，也是模式的主要脆弱点
            body: HubX 增长快，是因为搭上了最强一档的应用商店、云、模型和支付供应商。相同设计也意味着，冲击几乎没有隔离层，会传导到客户体验、利润率和估值。
