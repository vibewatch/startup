  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真实格局是分层的：巨头、垂直应用和应用工厂
        blocks:
          - type: paragraph
            body: >-
              HubX 没有一个清晰的同类公司集合。Nova 直接撞上第一方通用助手——ChatGPT、Gemini 和
              Claude——因为三者现在都把语音、图像、文件、搜索和多设备访问打包进同一个消费者工作流。DaVinci 和相关创意产品遇到的是 Adobe Firefly 和 Canva，在那里 AI
              生成不再是独立应用，而是嵌在更大创作套件中的功能。Wiser、Lotus Flow 以及任何健康相邻产品，与原始模型厂商竞争较少，更多是和 Headspace、Calm
              这类高频习惯品牌抢睡眠、焦虑和自我提升时间。除此之外，HubX 还要面对 Codeway、Bending Spoons
              这类工作室模式运营商，它们证明规模化发行商可以同时上线、收购并优化许多消费应用。这个分层地图重要，因为 HubX
              的优势不是独家模型，而是在单个巨头或另一个工厂吸收同一用例前，跨多个品类包装、测试、交叉销售和迭代的能力。
