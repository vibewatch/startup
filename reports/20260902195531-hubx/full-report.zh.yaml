      - number: '1.4'
        title: 领导层、文化和第一轮尽调警示
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据仍高度创始人中心。可获取官方材料将兄弟 Cem Ortabaş 和 Kaan Ortabaş 列为联合创始人，Google Cloud 案例研究也直接引用两人关于产品速度和 AI
              趋势的表述。Istanbul 办公室开业将两位创始人与外部生态人士放在同一公司里程碑上，进一步强化了创始人集中度。官网招聘画像显示，组织正在工程、增长、产品、支付、分析和创意岗位上扩张，符合中央平台模式，也符合
              300+ 到 370+ 的员工基数。不过三项尽调警示很快浮现。第一，公开记录中的正式治理披露很薄：没有找到可获取的董事会名单或投资人控制条款。第二，公司自有旧页面的关键规模数字滞后于融资公告，官网仍写 350M
              用户，而 2026 年 8 月材料使用 600M。第三，Trustpilot
              上的反向客户评论指称订阅流程误导、退款实践弱、支持差。这些投诉本身不是定论，但足以要求在接受管理层变现说法前，先做支付、流失和合规尽调。
