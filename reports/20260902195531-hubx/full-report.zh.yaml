        title: 商店费用、模型成本和流失让毛利率成为动态目标，而不是静态软件倍数
        blocks:
          - type: paragraph
            body: >-
              HubX 可见标价只是更复杂经济栈的顶线。Apple 和 Google 夹在公司和多数移动账单额之间，公开可比文件显示这可能是一项实质毛利税。Duolingo 的 10-K 是最清楚的类比：应用商店可抽走 15%
              到 30%，单一平台也可能主导收入结构。在渠道费用之外，AI 应用工作室还要为推理、搜索增强、存储和其他工具使用付费。HubX 自己的 Google Cloud
              案例研究把这条直接联动讲得很明确：更低延迟减少流失，更高基础设施效率改善营销能力和底线利润。Anthropic、OpenAI 和 Google Cloud 公开 AI
              价格卡也解释了原因。贡献毛利不只取决于获客，还取决于用户消耗多少 token、输出、搜索增强调用和高级模型请求。最后，RevenueCat 基准显示，即便强 AI 应用也面临第 0
              天转化压力和早期快速取消。下载速度高但成本控制不严，最终可能只有嘈杂的顶线规模和一般的现金盈利。
