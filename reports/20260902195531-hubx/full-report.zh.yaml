      - number: '7.2'
        title: 运营韧性取决于第三方基础设施、模型和支付能否保持对齐
        blocks:
          - type: paragraph
            body: >-
              HubX 的运营风险是应用 AI 工作室的经典权衡：建立在大型外部平台上，所以能跑得更快；但平台变化时，故障也会迅速传导。公开证据显示，公司确实依赖 Google Cloud 基础设施、专用加速器、Cloud
              Run、GKE 和 Hyperdisk ML。产品层也明确依赖多个前沿模型厂商，商户服务和订阅基础设施则依赖 Paddle 或 Adapty。这些并非天然坏事；事实上，HubX
              能扩张，这些合作伙伴就是原因之一。但剩余敞口很明显。模型价格变化、应用商店政策打击、计费伙伴宕机或延迟退化，都可能同时打击客户体验、流失、毛利率和声誉。因此，HubX 自己强调的低于 10 秒基准不只是性能
