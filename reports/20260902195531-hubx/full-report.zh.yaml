  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 门槛或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR / 集中度不透明持续
        - 管理层不愿在 NDA 下分享产品层 ARR、集中度或队列数据
        - 公开叙事始终无法转成可测算的价格支撑
        - 维持继续研究 / 不给带价承诺
      - - 收入质量偏弱
        - 毛利率波动，或显著低于优质消费软件预期
        - 倍数支撑迅速压缩
        - 要求重设价格或回避
      - - 应用商店依赖仍极端
        - 大部分总账单仍依赖应用商店，Web 分流有限或经济性差
        - 平台抽成和政策风险继续嵌在模型里
        - 加大折扣，并提高回报门槛
      - - 客户信任摩擦恶化
        - 退款、支持或拒付数据证实而非反驳公开投诉
        - 流失风险和盈利质量风险同步上升
        - 暂停测算，直到看见补救进展
      - - 收购纪律减弱
        - 新资金投向难整合标的，或回本不清的 earn-out
        - 增长资本变成执行拖累
        - 降低持股意愿或放弃
      - - 既有巨头捆绑加速
        - Google、OpenAI、Adobe 或其他公司压低价格，或把 HubX 用例吸收到默认入口
        - HubX 证明护城河之前，叙事溢价先被压缩
        - 要求更快证明留存和差异化现金流
    notes: 这些触发项用于尽调后持续监控，而不是等本轮定价后才发现。
