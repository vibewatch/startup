    type: flow
    layout: wide
    summary: 消费者 AI 单位经济性取决于三件事：立刻把用户导入试用、把适度比例转成付费，并在扣除费用和模型用量后留住足够净收入，以支撑再获客和产品迭代。
    data:
      nodes:
        - id: u1
          label: 安装
          detail: 通过应用商店和营销获取漏斗顶部消费者。
          tone: positive
        - id: u2
          label: 第 0 天试用启动
          detail: RevenueCat 称，82% 的试用在应用安装当天开始。
          tone: positive
        - id: u3
          label: 付费转化
          detail: 以 Duolingo 作为代理样本，移动免费增值模式大约可从 9% 的 MAU 中变现。
          tone: warning
        - id: u4
          label: 总变现
          detail: RevenueCat 称，AI 应用安装后 60 天每次安装收入可超过 $0.63。
          tone: positive
        - id: u5
          label: 平台费用漏损
          detail: Apple 和 Google 会压低实际净收入。
          tone: warning
        - id: u6
          label: 推理与工具成本
          detail: 模型选择、输出长度以及搜索 / 工具调用会形成可变 COGS。
          tone: warning
        - id: u7
          label: 留存或流失
          detail: 早期取消和退款行为决定首单能否持续复利。
          tone: warning
        - id: u8
          label: 贡献毛利
          detail: 剩余部分必须覆盖获客、工程、支持和产品组合扩张。
          tone: positive
