- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and product mix
    - Current ARR, recognized revenue, and top-app contribution by gross profit
    - Determines whether HubX is Duolingo-like, lower-quality, or better than public evidence suggests
    - Finance team; audited management reporting
  - - Cohort and renewal quality
    - Paid subscriber retention, cancellation, refund, and chargeback rates by app family
    - Separates top-of-funnel scale from durable customer value
    - Subscription / BI team; cohort export and billing analysis
  - - Margin stack
    - Gross margin by channel and product family including store fees, AI cost, support cost, and web economics
    - Tests whether a premium software multiple is justified
    - Finance plus infrastructure review
  - - Web versus store mix
    - Share of billings through web, Apple, Google, and any merchant-of-record partners
    - Validates diversification away from app-store tax and policy concentration
    - Payments / growth team; merchant reports
  - - Cap table and terms
    - Preference stack, option pool, pro rata, side letters, and tranche mechanics
    - A strong company can still be a poor security
    - Counsel and financing documents
  - - Acquisition pipeline
    - Target criteria, integration model, expected payback, and earn-out exposure
    - The new capital story explicitly includes M&A, so execution quality is now part of valuation
    - CEO / corp dev materials and board deck
  notes: Every ask is meant to move the decision toward buy, price-reset, or pass rather than to accumulate generic background information.
