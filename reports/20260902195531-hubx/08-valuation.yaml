- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Multiple apps contribute meaningful ARR; web billing diversifies store take; gross margin is software-like; acquisitions are disciplined
    - Current round can look fair-to-attractive because valuation is supported by durable revenue quality
    - Private cohorts, channel mix, and margin all improve with scale
    - Nova concentration or acquisition integration proves worse than expected
  - - Base
    - HubX is a strong operator but private denominators are only decent, not elite
    - Current round is somewhere between fair and stretched; ownership discipline matters more than headline access
    - Management shares core metrics but they are mixed rather than exceptional
    - Terms, concentration, or churn are worse than benchmarked consumer subscription leaders
  - - Bear
    - Top-of-funnel scale is real but churn, store taxes, support friction, and bundling pressure cap earnings quality
    - Current round looks expensive because the company never earns a premium consumer-software multiple
    - ARR disclosure lags, margin is noisy, or product dependence remains high
    - Customer-quality metrics remain hidden or fail threshold tests
  notes: Scenarios are underwriting frameworks, not company-disclosed forecasts.
