- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - 'Thesis: HubX has real scale and execution systems'
    - Point72 raise, profitability claim, 40+ products, 600M+ users, partner case studies, and Google Cloud performance gains
    - Product-level revenue and retention data confirm that scale translates into durable cash flow
  - - 'Thesis: valuation could be supported by strong hidden economics'
    - Web billing, churn recovery, subscriber infrastructure, and cost improvements all point in the right direction
    - Disclose ARR, gross margin, channel mix, and concentration under NDA
  - - 'Thesis: public comps show consumers will pay for habit products'
    - Duolingo and Spotify show large subscription platforms can earn major public value
    - HubX demonstrates comparable renewal quality and disclosure depth
  - - 'Anti-thesis: public sources still do not disclose the real underwriting denominators'
    - ARR, burn, gross margin, NRR, refunds, and product concentration are absent
    - Data room resolves those gaps with auditable cohort data
  - - 'Anti-thesis: platform and store taxes can hide below gross billings'
    - Duolingo's filing spells out 15%-30% store fees and heavy Apple / Google concentration
    - HubX proves web diversification and margin resilience by product family
  - - 'Anti-thesis: bigger AI platforms can bundle into the same use cases'
    - Alphabet and Adobe are embedding AI across their ecosystems
    - HubX shows defensible retention, superior monetization, or acquisition-led category breadth
  notes: Each thesis item is paired with a falsifiable diligence test rather than assumed to be permanently true.
