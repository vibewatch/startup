- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR / concentration opacity persists
    - Management will not share product-level ARR, concentration, or cohort data under NDA
    - Public narrative never converts into underwritable price support
    - Stay research-more / no priced commitment
  - - Weak revenue quality
    - Gross margin is volatile or materially below premium consumer-software expectations
    - Multiple support compresses quickly
    - Demand price reset or avoid
  - - Store dependence remains extreme
    - Most gross billings still rely on app stores with limited web diversion or poor economics
    - Platform taxes and policy risk stay embedded in the model
    - Apply heavier discount and tighter return hurdle
  - - Customer trust friction worsens
    - Refund, support, or chargeback data validate rather than rebut public complaints
    - Churn risk and earnings-quality risk rise together
    - Pause underwriting until remediation is visible
  - - Acquisition discipline weakens
    - New capital is deployed into hard-to-integrate targets or earn-outs with unclear payback
    - Growth capital becomes execution drag
    - Reduce ownership appetite or pass
  - - Incumbent bundling accelerates
    - Google, OpenAI, Adobe, or others collapse pricing or absorb HubX use cases into default surfaces
    - Narrative premium compresses before HubX proves moat
    - Require faster proof of retention and differentiated cash flow
  notes: These triggers are designed to be monitored after diligence, not discovered after the round is priced.
