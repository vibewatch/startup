  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - Strong company-quality evidence; insufficient price-underwriting evidence
    - Do not treat the current round as a clean buy on public data alone
  - - Confidence
    - Medium
    - Financing, scale, and comp facts are credible, but core private denominators are missing
    - Continue diligence rather than make a terminal pass
  - - Risk rating
    - High
    - Platform dependence, churn risk, AI bundling, and acquisition execution remain material
    - Require explicit kill triggers and downside protections
  - - Valuation stance
    - Stretched to fair depending private metrics
    - At $1.2B pre-money, support depends on ARR, margin, concentration, and terms that are not public
    - Price must remain contingent on data-room findings
  - - Decision trigger
    - Move toward buy only if ARR, retention, gross margin, and terms clear thresholds
    - Public evidence narrows the questions but does not answer them
    - Use a threshold-based IC process
  notes: This is a price-sensitive recommendation, not a dismissal of company quality.
