- id: comparable-support-and-limits
  title: Comparable support exists, but it does not create a shortcut around missing denominators
  body: 'The fetched comp set supports a valuation conversation, not a blind read-through. Duolingo is the best public comparison because it is mobile-first, subscription-heavy, global, and explicit about app-store dependence and unit-cost drivers. On rough September 2026 public data, Duolingo trades around 6.2x annualized Q2 revenue. AppLovin is a different business model, but it matters because it shows what public markets will pay for elite mobile-platform economics and massive cash generation: about 13.9x annualized Q2 revenue on a September 2026 market cap basis. Spotify is useful for habit, scale, and subscription durability but less useful for precise multiple work because the fetched revenue disclosures are in euros while the market-cap reference is in dollars. The broader BVP Emerging Cloud Index also reminds investors that most liquid AI and software benchmark baskets are cloud-software baskets, not consumer-mobile AI portfolios. In other words, comps can bracket HubX, but they
    cannot replace private evidence. The right lesson from comps is not that HubX is overvalued or undervalued with certainty; it is that valuation support depends on where HubX actually sits between a Duolingo-like consumer subscription profile and a more momentum-driven AI narrative.'
