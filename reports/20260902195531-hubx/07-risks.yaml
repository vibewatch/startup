- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Subscription trust erosion
    - Refund and complaint intensity
    - Chargebacks, refund denials, or public complaints trend upward for two quarters
    - Treat as thesis impairment unless remediation is measured and fast
  - - Store-policy dependency
    - App review and policy events
    - Material title rejection, repeated warnings, or ranking suppression
    - Reduce confidence in growth durability
  - - Cloud or model dependence
    - Latency, unit-cost, or API access shock
    - Sustained SLA slippage or major upstream repricing
    - Re-underwrite margin and retention assumptions
  - - Acquisition integration strain
    - Operational incident after integrating new titles
    - Billing, privacy, or uptime issues spike after portfolio additions
    - Pause roll-up assumptions and demand integration evidence
  - - Macro / location shock
    - Turkey FX or physical disruption
    - Business continuity event or macro instability affects support and delivery
    - Stress-test cash, staffing, and failover plans
  - - Governance opacity
    - Data-room weakness persists
    - No credible disclosure on concentration, incidents, or controls post-financing
    - Treat valuation multiple as governance-discounted
  notes: These triggers are investment-monitoring tools, not predictions that the events will occur.
