- id: operational-and-dependency-risks
  title: Operational resilience depends on keeping third-party infrastructure, models, and payments aligned
  body: 'HubX''s operating risk is the classic tradeoff of an applied-AI studio: it can move faster because it builds on large external platforms, but that means failures propagate quickly when those platforms change. Public evidence shows real dependence on Google Cloud infrastructure, specialized accelerators, Cloud Run, GKE, and Hyperdisk ML. It also shows explicit reliance on multiple frontier-model vendors at the product layer and on Paddle or Adapty for merchanting and subscription infrastructure. None of that is inherently bad; in fact, these partners are part of why HubX can scale. But the residual exposure is obvious. A model-pricing shift, a store-policy strike, a billing-partner outage, or a latency regression could hit customer experience, churn, gross margin, and reputation at once. The under-10-second benchmark that HubX itself emphasizes is therefore more than a performance KPI—it is a daily fragility indicator for the whole business, every single day.'
