  summary: HubX's public architecture reads as a layered consumer-AI stack from mobile products through orchestration and deployment into specialized Google Cloud infrastructure.
  data:
    layers:
    - label: Consumer app layer
      detail: Job-specific products such as Nova, DaVinci, Wiser, BetterSpeak, NoteAI, HomeAI, and Lotus Flow package AI into subscription mobile experiences.
      items:
      - Chat and research
      - Image and video generation
      - Learning habits
      - Meeting capture
      - Language practice
      - Wellness routines
    - label: Experience and workflow layer
      detail: Apps add voice, search, files, summaries, personalization, reminders, and structured flows so that foundation models feel useful inside a specific job.
      items:
      - Voice mode
      - Web search
      - File work
      - Spaced repetition
      - Action-item extraction
      - Style- or goal-specific UX
    - label: Model orchestration layer
      detail: HubX combines external frontier-model APIs with internal fine-tuning ambitions from the AI Lab.
      items:
      - GPT family
      - Gemini
      - Claude
      - DeepSeek
      - Open-source base models
      - HubX fine-tuned systems
    - label: Deployment and control layer
      detail: Public sources describe quick launches on Cloud Run and scaled control on GKE once workloads stabilize.
      items:
      - Cloud Run
      - Cloud Run functions
      - GKE
      - AI Hypercomputer
    - label: Accelerator and storage layer
      detail: Performance tuning depends on choosing the right hardware and reducing model boot time.
      items:
      - Trillium TPUs
      - A100 GPUs
      - L4 GPUs
      - Hyperdisk ML
