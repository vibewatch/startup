- id: trust-privacy-and-quality-control
  title: Trust and governance disclosure lag behind the product and infrastructure narrative
  body: 'Public trust evidence is mixed. On the positive side, App Store privacy labels show that HubX is at least participating in platform disclosure systems, Wiser publishes a full privacy policy, and DaVinci''s own website makes explicit user-data and ownership claims. But those are baseline consumer-product disclosures, not the fuller transparency package a diligence process would ideally want from a company claiming hundreds of millions of users and deep AI infrastructure. Across the gathered materials, there is still no clear public status page, security center, certification pack, uptime history, or external audit evidence. The adverse side is more tangible: Trustpilot reviews raise recurring complaints about billing, refunds, and support. Those complaints are not definitive proof of systemic failure, yet they matter because recurring-subscription consumer apps live or die on trust. The practical takeaway is that HubX''s visible controls look adequate for distribution, but not yet
    fully legible for institutional diligence.'
