- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user job
  - Public maturity signal
  - Differentiation
  - Diligence gap
  rows:
  - - Nova
    - General AI help for writing, learning, research, files, coding, and translation
    - Dedicated site copy plus Apple and Google store detail; multimodel branding is explicit
    - Multi-vendor model aggregation and one-subscription cross-device framing
    - No public disclosure of routing logic, model mix by feature, or product-level retention
  - - DaVinci
    - Generate images, video, avatars, tattoos, logos, and creator assets
    - Dedicated domain, App Store detail, and production-speed claims from HubX posts
    - Combines external model access with AI Lab fine-tuned systems and a creator-friendly suite
    - No public model card, training-data provenance, or exact split between HubX-tuned and third-party models
  - - Wiser
    - Consume short-form book learning and build a repeatable self-improvement habit
    - App Store ratings plus HubX Best of 2025 recognition
    - Habit product with summaries, audio, personalization, and spaced repetition rather than generic chat
    - No public cohort retention or content-licensing detail
  - - BetterSpeak
    - Practice speaking a new language with interactive AI feedback
    - Product listing and Android distribution proof
    - Lifelike avatar plus real-time speaking feedback
    - No public proof of speech-model stack or learning-outcome effectiveness
  - - NoteAI
    - Record meetings and receive automated summaries and action items
    - Product listing on HubX portfolio page
    - Clear workflow fit for meeting compression and follow-up
    - No public integration list, enterprise controls, or accuracy benchmarks
  - - HomeAI
    - Visualize interior, exterior, and landscape redesign concepts
    - Product listing and Android distribution proof
    - Consumerized AI architecture workflow aimed at visual inspiration
    - No public CAD/BIM integration, design-rights policy, or rendering-cost disclosure
  - - Lotus Flow
    - Follow guided yoga, pilates, tai chi, mindfulness, and home fitness routines
    - Standalone site, App Store detail, and weekly new content claim
    - Wellness depth, Apple Health support, and structured content plans
    - Higher privacy sensitivity; no public evidence of clinical validation or independent privacy audit
  - - Studio platform
    - Launch, optimize, and eventually acquire more consumer apps on a shared backbone
    - Point72 announcement plus portfolio breadth and developer-signal evidence
    - Centralized AI, data, monetization, and user acquisition capabilities reused across products
    - No public internal tooling map or portfolio-level governance framework
  notes: Rows include both direct products and the shared platform because HubX's technology edge appears to compound at portfolio level.
