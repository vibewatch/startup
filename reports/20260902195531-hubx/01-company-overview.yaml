company:
  name: HubX
chapter:
  number: 1
  title: Company Overview
  summary: HubX is an Izmir-founded Turkish consumer app studio that has scaled a portfolio of more than 40 AI-powered mobile and web products to over 600 million cumulative downloads across 190-plus countries while remaining profitable before taking outside capital. In August 2026 Point72 Private Investments committed an initial $50 million with an option for another $25 million at a $1.2 billion pre-money valuation, validating the company's hub-and-studio model, internal AI/data infrastructure, and acquisition ambitions. The same fast-growth model also carries diligence flags around founder concentration, metric inconsistency across older company surfaces, and adverse customer reviews alleging deceptive subscription and refund practices.
sections:
- id: identity-and-operating-model
  title: Identity, geography, and the hub-to-studio model
  body: 'HubX presents itself as a Turkish consumer technology platform rather than a single-app company. The official homepage calls the company a technology hub that designs, builds, launches, and scales highly scalable apps; the same page explains that autonomous in-house studios own specific product verticals while a central hub supplies shared resources such as office space, data tools, funding, and know-how. That operating design matters because it is the clearest explanation for how a company founded only in 2022 could already show a visible portfolio spanning AI chat, image generation, learning, wellness, plant recognition, tattoo design, and other consumer categories. The 2026 financing materials anchor the company in Izmir and say it now operates from both Izmir and Istanbul. Contact information on the official site corroborates those two cities by listing an Izmir HQ and a Maslak Square office in Istanbul. In practical terms, HubX is selling a repeatable studio engine: centralized
    monetisation, user acquisition, data, and AI infrastructure wrapped around many app concepts rather than one flagship franchise alone.'
