  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting control, and investor rights documents for the Point72 round.
    whyItMatters: Control terms determine founder dependence, downside protection, and future financing flexibility.
    diligencePath: Request cap table, shareholder agreement summary, board roster, and any observer rights memo from management.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited revenue, ARR, gross margin, refund, and churn disclosures at both company and flagship-app level.
    whyItMatters: Profitability and valuation cannot be underwritten rigorously from public claims alone.
    diligencePath: Request audited or management financials with app-level cohort retention, subscriber counts, and chargeback data.
    relatedQuestionRefs:
    - QO024
  - type: conflicting-data
    severity: minor
    topic: metric-consistency
    missingEvidence: A reconciled explanation for why the homepage still cites 350 million users while the August 2026 financing materials cite 600 million.
    whyItMatters: Stale or differently defined metrics reduce confidence in public reporting hygiene.
    diligencePath: Ask management for metric definitions, last-refresh dates, and an official KPI sheet used in fundraising.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO004
