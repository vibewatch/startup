- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Initial new cash
    - $50M initial investment disclosed
    - High
    - Minimum fresh capital available after the round
    - Confirm closing cash actually received and any escrow or conditions
  - - Optional capital
    - $25M option disclosed but not confirmed as funded
    - High
    - Should not be treated as cash-in-hand
    - Confirm option triggers, timeline, and control rights
  - - Profitability status
    - Company says profitable at time of raise
    - High
    - Reduces immediate solvency concern if true
    - Request audited EBITDA, net income, and operating cash flow
  - - Existing cash balance
    - Undisclosed publicly
    - Low
    - Needed for runway and M&A capacity analysis
    - Request current unrestricted cash and short-term investments
  - - Monthly burn
    - Undisclosed publicly
    - Low
    - Needed to translate the round into runway
    - Request normalized monthly burn excluding and including acquisitions
  - - Debt / facilities
    - No public debt facility found in sourced material
    - Low
    - Debt can change runway and acquisition flexibility
    - Request debt, venture lending, seller notes, and earn-out obligations
  - - Primary use of funds
    - Portfolio growth, infrastructure, and acquisition platform
    - High
    - Distinguishes growth capital from rescue capital
    - Break the planned allocation into organic vs M&A buckets
  - - Next-round trigger
    - Unknown; likely tied to acquisition pace or larger-scale expansion
    - Low
    - Determines financing dependency of the new strategy
    - Request board plan for next financing under base and M&A-heavy scenarios
  notes: 'This table is intentionally asymmetric: the round structure is public, but the cash baseline required to assess runway is not.'
