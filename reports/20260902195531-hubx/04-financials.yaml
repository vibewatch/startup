- id: channel-economics-and-cost-structure
  title: Store fees, model costs, and churn make gross margin a moving target rather than a static software multiple
  body: 'HubX’s visible list prices are only the top line of a more complicated economic stack. Apple and Google sit between the company and most mobile billings, and comparable public filings show that this can be a meaningful margin tax. Duolingo’s 10-K is the clearest analogue: app stores can keep 15% to 30%, and a single platform can dominate revenue mix. On top of those channel fees, AI app studios must pay for inference, search grounding, storage, and other tool usage. HubX’s own Google Cloud case study makes the direct linkage explicit: better latency lowers churn and higher infrastructure efficiency improves both marketing capacity and the bottom line. Public AI price cards from Anthropic, OpenAI, and Google Cloud show why. Contribution margin depends not just on acquiring the user, but on how many tokens, outputs, grounding calls, and premium model requests that user consumes. Finally, RevenueCat’s benchmarks show that even strong AI apps face day-zero conversion pressure and sharp
    early cancellations. High download velocity without disciplined cost control can therefore produce noisy top-line scale but mediocre cash earnings.'
