- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Product-level ARR and revenue mix
    - Cannot determine whether HubX is truly diversified or heavily dependent on Nova or one category
    - Request trailing-12-month revenue and ARR by app family with payer counts
  - - Current cash, burn, and runway
    - Cannot judge whether the Point72 capital is growth optionality or essential operating support
    - Request current balance sheet, monthly cash burn, and 12-18 month cash forecast
  - - Gross margin by product
    - Cannot distinguish high-margin chat/wellness apps from heavier creative or search-grounded products
    - Request gross margin waterfall by major app including store fees and model costs
  - - Retention and churn by plan
    - Cannot test whether weekly and annual SKUs produce durable revenue quality
    - Request cohort retention, renewal, involuntary churn, and win-back data
  - - Refunds, chargebacks, and billing disputes
    - Cannot assess whether aggressive paywalls create fragile or reversible revenue
    - Request refund rate, chargeback rate, trust-and-safety complaints, and app-store review trend
  - - Acquisition underwriting model
    - Cannot evaluate whether M&A will improve or dilute returns versus organic launches
    - Request target IRR hurdles, integration budgets, and post-acquisition KPI scorecards
  notes: These are not minor holes. They are the metrics required to distinguish a high-quality consumer subscription portfolio from a high-download but fragile paywall machine.
