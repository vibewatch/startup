- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Paid conversion proxy
    - ~9% of MAUs paid at Duolingo
    - Medium
    - Shows mobile freemium can monetize a single-digit share at scale
    - Request HubX paid conversion by app family and geography
  - - Trial timing
    - 82% of trials start on day 0
    - Medium
    - Implies first-session onboarding and paywall UX dominate payback
    - Request HubX day-0 paywall view and trial-start rates
  - - AI app RPI benchmark
    - '>$0.63 after 60 days'
    - Medium
    - Useful top-line benchmark for AI app monetization quality
    - Benchmark HubX RPI by product against AI-app median and P90
  - - Churn pressure
    - Nearly 30% of annual subs canceled in first month; high-priced monthly plans retain ~6.7% after a year
    - Medium
    - Explains why weak value propositions destroy payback quickly
    - Request gross churn, refund, and involuntary churn by plan type
  - - iOS platform fee
    - 15%-30% depending program and circumstance
    - High
    - Major deduction from gross billings and margin
    - Request actual iOS effective take rate by territory
  - - Android platform fee
    - 10%-15% for subscriptions depending region/billing setup
    - High
    - Potentially better net revenue economics than iOS
    - Request actual Android effective take rate and billing mix
  - - Model cost proxy
    - Anthropic Opus 5 $5 / MTok input and $25 / MTok output; OpenAI and Google priced similarly but with differing tool surcharges
    - Medium
    - Inference intensity can materially change contribution margin
    - Request average token usage, model mix, and tool-call incidence per payer
  - - Infrastructure efficiency proxy
    - HubX says GKE cut operating cost 40% and improved conversion-linked latency
    - Medium
    - Shows infra optimization can fund more marketing or margin
    - Request pre/post infra cost per active user and per paid subscriber
  - - Cash collection proxy
    - Duolingo deferred revenue $496.2M on annual plans
    - Medium
    - Annual subscriptions create upfront cash but deferred recognition
    - Request HubX deferred revenue balance and annual-vs-weekly billing split
  notes: Rows intentionally mix direct public data and comparable proxies because HubX itself does not disclose private unit-economics metrics.
