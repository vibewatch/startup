  productSummary: A multi-app consumer AI portfolio spanning chat assistants, image generation, learning/wellness, and habit products, sold primarily through mobile subscriptions and in-app purchases with growing web-billing support.
  customerFocus: Global consumer users and subscribers across AI assistant, creator, learning, and wellness categories, with the United States a major market.
  businessModel: Direct-to-consumer recurring subscriptions and in-app purchases across multiple mobile apps, supplemented by some web billing and limited ad-supported free usage.
