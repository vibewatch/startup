- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Portfolio launch engine across 40+ products
    - Codeway and other factories can mirror the same playbook; Bending Spoons can acquire scale faster
    - High
    - Request cohort-level cross-sell, launch hit rate, and category margin data to prove engine quality rather than quantity
  - - Multi-model aggregation convenience
    - OpenAI, Google, Anthropic, and others can broaden first-party apps until aggregation matters less
    - High
    - Measure how often Nova users switch models inside one session and whether that improves retention or conversion
  - - Shared infrastructure and latency discipline
    - Any scaled competitor can buy similar cloud tooling and model APIs
    - Medium
    - Request comparative inference-cost curves and SLA targets by product line
  - - Vertical app breadth across creativity, learning, and wellness
    - Bundled suites or specialist brands can outcompete in each vertical separately
    - High
    - Quantify which verticals actually deliver the best retention and LTV rather than assuming breadth is defensive
  - - Trust and privacy as competitive differentiator
    - Public complaints or breaches can reset the category and make users default to first-party apps
    - High
    - Audit refund rates, privacy incidents, app-store reviews, and data-retention controls by product
  - - App-store distribution competency
    - Apple and Google control review, billing disclosure, and discovery surfaces
    - High
    - Review ASO dependence, featuring history, and exposure to billing-policy changes
  - - Potential acquisition strategy
    - Better-capitalized consolidators or incumbents can outbid HubX for attractive targets
    - Medium
    - Request acquisition pipeline criteria, integration playbooks, and target-return thresholds
  - - Localized Türkiye operating base
    - If model access commoditizes, labor-cost advantage alone will not preserve pricing power
    - Medium
    - Test whether speed, not cost, is the real source of advantage in launch and iteration cycles
  notes: Severity ratings are qualitative and reflect the observed ease with which competitors can copy model access, out-distribute HubX, or win trust by bundling into broader ecosystems.
