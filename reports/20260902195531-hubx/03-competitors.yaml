  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Competitor realized pricing and discount ladders
    missingEvidence: Several competitor surfaces disclose only free-plus-IAP labels or plan names, not realized mobile price ladders, discounting, refund behavior, or regional pricing.
    whyItMatters: Without true net pricing the public comparison can show packaging strategy but cannot prove which competitor monetizes best at the margin.
    diligencePath: Collect subscription screenshots by region, refund-policy outcomes, and anonymized receipt data from mobile-intelligence vendors or the company.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: HubX product-level revenue concentration
    missingEvidence: Public sources do not break out HubX revenue, subscriber base, or gross margin by Nova versus the rest of the portfolio.
    whyItMatters: If Nova or one category drives most economics, HubX is less diversified than the portfolio narrative suggests.
    diligencePath: Request product-level revenue mix, subscriber counts, and cohort LTV by app family under NDA.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: Comparative CAC, payback, and retention by competitor class
    missingEvidence: No public dataset shows whether HubX retains or monetizes users better than Codeway, companion apps, or wellness incumbents on a cohort basis.
    whyItMatters: Execution quality is the core moat thesis; without cohort economics the moat remains descriptive rather than proven.
    diligencePath: Obtain cohort retention, payback, and reactivation metrics for major HubX products and benchmark against mobile intelligence or channel partner data.
    relatedQuestionRefs:
    - QP028
