          detail: HubX can upsell via web checkout, plan salvage, or cross-app learning from portfolio experimentation.
          tone: neutral
    approximationNotes: >-
      This map synthesizes recurring consumer flows across HubX's flagship apps and web monetization surfaces rather
      than depicting one exact screen sequence.
    claimRefs:
      - CU008
      - CU014
      - CU015
      - CU023
      - CU034
      - CU038
      - CU042
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      HubX's monetization funnel runs from broad free acquisition into fast trial exposure, paid conversion, and a
      second-stage web recovery or localization layer.
    data:
      nodes:
        - id: f1
          label: App-store or web discovery
          detail: Consumer notices the app through ranking, search, ads, or owned web surfaces.
          tone: neutral
        - id: f2
          label: Install or open
          detail: The user enters a free-to-download or freemium product.
          tone: positive
        - id: f3
          label: Day-0 value moment
          detail: AI output, learning content, or wellness guidance must feel useful immediately.
          tone: positive
        - id: f4
          label: Trial / paywall
          detail: Most trial starts happen immediately after install in subscription apps.
          tone: warning
        - id: f5
          label: Paid subscriber
          detail: User converts through store billing or web checkout.
          tone: positive
        - id: f6
          label: Retention / save motion
          detail: Cancellation flows, payment recovery, and support quality determine durability.
          tone: warning
        - id: f7
          label: Portfolio learning
          detail: A/B tests and paywall experiments are reused across the portfolio.
          tone: neutral
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
        - from: f6
          to: f7
    approximationNotes: >-
      The funnel is based on public consumer-subscription and web-commerce evidence; HubX does not publish exact
      stage-conversion percentages by app.
    claimRefs:
      - CU015
      - CU017
      - CU019
      - CU022
      - CU023
      - CU024
      - CU025
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      HubX's proof quality is highest where flagship apps combine visible ratings with repeat-use narratives; retention
      visibility is weak almost everywhere.
    data:
      columns:
        - Scale proof
        - Satisfaction proof
        - Repeat-use proof
        - Retention visibility
      rows:
        - label: Nova
          values:
            - High
            - Medium-High
            - Medium
            - Low
        - label: DaVinci
          values:
            - High
            - Medium
            - Medium
            - Low
        - label: Wiser
          values:
            - Medium-High
            - High
            - High
            - Low
        - label: Lotus Flow
          values:
            - Medium
            - Medium
            - High
            - Low
        - label: Web checkout customer base
          values:
            - Medium
            - Low
            - Medium
            - Medium
    approximationNotes: Scores are ordinal judgments about evidence density, not internal business KPIs.
    claimRefs:
      - CU007
      - CU009
      - CU010
      - CU011
      - CU019
      - CU020
      - CU034
      - CU038
      - CU040
      - CU045
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: wide
    summary: >-
      RevenueCat's annual-subscription benchmark shows why HubX's true cohort data matters: early churn can be severe
      even in otherwise attractive consumer-subscription categories.
    data:
      columns:
        - Entry
        - Month 1
        - Month 12
      rows:
        - label: Annual-subscription benchmark cohort
          values:
            - value: 100
              displayValue: 100%
            - value: 70
              displayValue: 70%
            - value: 36
              displayValue: 36%
          tone: warning
    approximationNotes: >-
      This is a benchmark curve from RevenueCat rather than a HubX cohort. HubX publishes no product-level cohort
      retention in the public record.
    claimRefs:
      - CU025
      - CU045
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual severity is highest where subscription trust, platform dependence, and regulatory documentation
      obligations can cascade into multiple business lines at once.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Store-policy / billing compliance
          values:
            - Medium-High
            - High
            - Medium
            - High
        - label: Cloud and model-vendor dependence
          values:
            - Medium
            - High
            - Medium
            - High
        - label: Refund / chargeback / complaint erosion
          values:
            - Medium-High
            - High
            - Medium
            - High
        - label: AI Act documentation / transparency
          values:
            - Medium
            - Medium-High
            - Low-Medium
            - Medium-High
        - label: Acquisition integration failure
          values:
            - Medium
            - High
            - Low-Medium
            - Medium-High
        - label: Turkey macro / physical continuity
          values:
            - Low-Medium
            - Medium-High
            - Low-Medium
            - Medium
    approximationNotes: >-
      Ordinal ratings are analytic judgments based on public evidence, not management's internal enterprise-risk
      scoring.
    claimRefs:
      - CR003
      - CR014
      - CR017
      - CR024
      - CR030
      - CR034
      - CR042
      - CR044
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Several risk sources can propagate through the same operating system into churn, margin pressure, or valuation
      compression.
    data:
      nodes:
        - id: a1
          label: Regulatory / legal change
          detail: AI Act, store rules, subscription enforcement
        - id: a2
          label: Platform or vendor shock
          detail: Cloud, model, payment, or subscription tooling changes
        - id: a3
          label: Customer trust failure
          detail: Refund disputes, weak support, billing confusion
        - id: a4
          label: Operational degradation
          detail: Latency, outages, moderation gaps, privacy incidents
        - id: a5
          label: Higher churn / lower conversion
          detail: Users cancel, hesitate, or multi-home elsewhere
        - id: a6
          label: Margin compression
          detail: More support, refunds, infra cost, and compliance burden
        - id: a7
          label: Growth and valuation pressure
          detail: Lower confidence in durability and multiple support
      edges:
        - from: a1
          to: a4
          label: new obligations
        - from: a2
          to: a4
          label: service stress
        - from: a3
          to: a5
          label: users leave
        - from: a4
          to: a5
          label: bad UX
        - from: a4
          to: a6
          label: cost to fix
        - from: a5
          to: a7
          label: slower growth
        - from: a6
          to: a7
          label: lower quality of earnings
    approximationNotes: Transmission links summarize business logic from public evidence rather than company-published causal diagrams.
    claimRefs:
      - CR014
      - CR016
      - CR020
      - CR024
      - CR025
      - CR036
      - CR042
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      HubX's core platform sits at the center of a dense web of external dependencies that each carry their own policy
      or operational risk.
    data:
      nodes:
        - id: d1
          label: HubX platform
          detail: Central AI, data, monetization, and distribution engine
        - id: d2
          label: App stores
          detail: Apple and Google discovery, review, and billing surfaces
        - id: d3
          label: Google Cloud stack
          detail: GKE, Cloud Run, TPUs, GPUs, Hyperdisk ML
        - id: d4
          label: Model providers
          detail: OpenAI, Google, Anthropic, xAI, DeepSeek, open-source bases
        - id: d5
          label: Payments / subscriptions
          detail: Paddle and Adapty
        - id: d6
          label: Regulators and policy makers
          detail: EU AI Office, FTC trend, platform reviewers
        - id: d7
          label: Turkey operating base
          detail: Talent, macro, and physical-location context
        - id: d8
          label: Customers
          detail: Consumer users, subscribers, creators, learners, wellness users
      edges:
        - from: d2
          to: d1
          label: distribution / billing rules
        - from: d3
          to: d1
          label: compute
        - from: d4
          to: d1
          label: model capability
        - from: d5
          to: d1
          label: merchanting / subscription plumbing
        - from: d6
          to: d1
          label: compliance obligations
        - from: d7
          to: d1
          label: talent / continuity
        - from: d1
          to: d8
          label: product delivery
        - from: d8
          to: d1
          label: revenue / data / complaints
    approximationNotes: This is a dependency map of commercial and operational reliance, not a low-level software architecture diagram.
    claimRefs:
      - CR017
      - CR018
      - CR020
      - CR021
      - CR022
      - CR030
      - CR035
      - CR042
      - CR043
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The decision path moves from company-quality evidence to pricing gates rather than from hype to automatic buy.
    data:
      nodes:
        - id: f1
          label: Quality signal
          detail: Profitable, scaled, Point72-backed consumer AI platform
        - id: f2
          label: Operating proof
          detail: Cost, latency, web billing, and subscription-infra evidence
        - id: f3
          label: Public comp bracket
          detail: Rough public references span ~6.2x to ~13.9x current revenue
        - id: f4
          label: Missing denominators
          detail: ARR, concentration, margin, retention, and terms remain private
        - id: f5
          label: Risk discount
          detail: Store dependence, churn, bundling, macro, and acquisition risk
        - id: f6
          label: Current call
          detail: Research-more until private metrics validate price
      edges:
        - - f1
          - f2
        - - f2
          - f3
        - - f3
          - f4
        - - f4
          - f5
        - - f5
          - f6
    approximationNotes: A qualitative investment-committee chain based on fetched evidence and explicit diligence gaps.
    claimRefs:
      - CV001
      - CV005
      - CV010
      - CV043
      - CV049
      - CV051
      - CV052
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: The recommendation is most sensitive to hidden operating denominators rather than to another financing headline.
    data:
      items:
        - label: Current ARR disclosure
          value: 5
          unit: importance /5
        - label: Product concentration
          value: 5
          unit: importance /5
        - label: Gross margin by channel
          value: 5
          unit: importance /5
        - label: Paid retention / churn
          value: 5
          unit: importance /5
        - label: Web-billing mix
          value: 4
          unit: importance /5
        - label: Cap-table terms
          value: 4
          unit: importance /5
        - label: Acquisition discipline
          value: 4
          unit: importance /5
    approximationNotes: >-
      Ordinal sensitivity scores summarize what would most change the investment call; they are not company-published
      KPIs.
    claimRefs:
      - CV010
      - CV019
      - CV049
      - CV050
      - CV052
      - CV056
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Illustrative multiple ranges place HubX between a Duolingo-like lower public benchmark and an AppLovin-like upper
      bound depending what undisclosed ARR actually is.
    data:
      items:
        - label: Duolingo rough public multiple
          low: 6.2
          high: 6.2
          unit: x current revenue
          basis: Sept 2026 market cap divided by annualized Q2 2026 revenue
        - label: HubX implied if ARR = $200M
          low: 6
          high: 6
          unit: x ARR
          basis: $1.2B pre-money divided by illustrative $200M ARR
        - label: HubX implied if ARR = $150M
          low: 8
          high: 8
          unit: x ARR
          basis: $1.2B pre-money divided by illustrative $150M ARR
        - label: AppLovin rough public multiple
          low: 13.9
          high: 13.9
          unit: x current revenue
          basis: Sept 2026 market cap divided by annualized Q2 2026 revenue
    approximationNotes: HubX ARR cases are illustrative arithmetic only; public sources do not disclose actual ARR.
    claimRefs:
      - CV026
      - CV030
      - CV048
      - CV051
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: HubX scores strongly on market and execution signals, but weakly on public underwriting completeness.
    data:
      items:
        - label: Market demand
          value: 4
          unit: /5
          status: strong
        - label: Product breadth
          value: 4
          unit: /5
          status: strong
        - label: Operational proof
          value: 4
          unit: /5
          status: strong
        - label: Revenue disclosure
          value: 1
          unit: /5
          status: weak
        - label: Margin disclosure
          value: 1
          unit: /5
          status: weak
        - label: Valuation support
          value: 2
          unit: /5
          status: weak
        - label: Risk-adjusted entry
          value: 2
          unit: /5
          status: watch
    approximationNotes: Ordinal scorecard synthesized from the fetched evidence; not management guidance.
    claimRefs:
      - CV002
      - CV005
      - CV010
      - CV043
      - CV049
      - CV052
