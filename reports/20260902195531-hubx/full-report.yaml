      - number: '8.4'
        title: The decision should now move from narrative to measurable thresholds
        blocks:
          - type: paragraph
            body: >-
              HubX now needs threshold-based underwriting rather than more generic admiration. The bull case is
              straightforward: private data shows that Nova is not the only major payer engine, web billing is becoming
              meaningfully material, cohort retention is strong, and management can use new capital plus acquisitions
              without sacrificing margin quality. In that case, the disclosed valuation could prove fair or even
              attractive. The base case is also coherent: HubX is a strong operator with a premium story, but outsiders
              still do not know enough to determine whether the company deserves a Duolingo-like, AppLovin-like, or
              lower-quality multiple. The bear case is that top-of-funnel scale hides concentration, churn, and
              platform-tax problems that become obvious only after the round closes. That is why the remaining diligence
              asks matter more than any additional celebratory media coverage. Investors need ARR, product
              concentration, retention, gross margin, channel mix, preference stack, and acquisition economics before
              moving from research-more to buy. If those data are withheld or weak, the correct action is not to argue
              with the existence of HubX's business; it is to insist on better price discipline or stay on watchlist.
