        title: Leadership, culture, and first-pass diligence flags
        blocks:
          - type: paragraph
            body: >-
              Publicly available leadership evidence is still founder-centric. The accessible official materials
              identify brothers Cem Ortabaş and Kaan Ortabaş as co-founders, and the Google Cloud case study quotes both
              directly on product speed and AI trends. The Istanbul office opening reinforces that founder concentration
              by featuring both founders at a symbolic company milestone alongside outside ecosystem figures.
              Recruitment patterns on the homepage suggest the organization is broadening functionally across
              engineering, growth, product, payments, analytics, and creative roles, consistent with a central platform
              model and a 300-plus to 370-plus employee base. Even so, three diligence flags appear quickly. First, the
              public record is thin on formal governance: no accessible board roster or investor control terms were
              found. Second, key scale figures on older company-owned pages lag the financing release, with the homepage
              still citing 350 million users versus the 600 million figure used in August 2026. Third, adverse customer
              reviews on Trustpilot allege deceptive subscription flows, weak refund practices, and poor support. Those
              complaints are not dispositive on their own, but they are credible enough to warrant payment, churn, and
              compliance diligence before taking management's monetisation claims at face value.
