      - number: '7.3'
        title: Execution risk is now as much about integration and geography as about coding speed
        blocks:
          - type: paragraph
            body: >-
              Before the Point72 raise, HubX's main execution challenge was launching and scaling products quickly.
              After the raise, the challenge broadens. The company now intends to layer acquisitions onto a centralized
              platform, which creates new integration, governance, and cultural risks even if the technical stack is
              strong. Public leadership visibility also points to key-person concentration: founders and a small set of
              technical leaders anchor much of the narrative. HubX is clearly investing in talent pipelines and public
              hiring, but fast-growing AI studios rarely find talent risk trivial. The geographic dimension adds another
              layer. World Bank materials highlight inflation, productivity, weaker FDI, and significant physical-risk
              exposure inside Türkiye, including seismic concentration. For a globally monetized consumer company based
              in that environment, business continuity and macro discipline matter more than the topline unicorn label
              suggests. A premium valuation can absorb experimentation; it absorbs preventable operational disorder much
              less well.
