      - number: '6.4'
        title: The remaining diligence problem is concentration and denominator quality
        blocks:
          - type: paragraph
            body: >-
              The open customer question is not whether HubX has real reach; it is whether that reach is concentrated in
              ways the public record cannot show. Adapty's note that Nova is among the world's top-grossing non-game
              apps hints that a few titles may drive a disproportionate share of revenue. Sensor Tower's broader market
              data makes the same concern sharper inside AI assistants, where attention is dominated by a handful of
              first-party defaults. HubX's non-chat products help diversify that risk, but only partially. The missing
              denominators are material: no public source in this chapter provides app-level MAUs, payer counts,
              region-by-region revenue split, or cohort retention by product. Without those, the 600M+ headline is
              impressive but incomplete for underwriting. The working conclusion is positive on reach and monetization
              sophistication, yet still cautious on concentration, retention quality, and how much of the customer base
              is truly durable. That distinction matters because a giant download footprint can still mask short-lived
              usage, thin payer depth, or an overreliance on one geography or one breakout title over time.
            claimRefs:
              - CU027
              - CU028
