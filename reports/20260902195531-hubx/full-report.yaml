companyProfile:
  summary: >-
    HubX is an Izmir-founded Turkish consumer technology company that builds and scales a portfolio of AI-native mobile
    and web apps. Its visible flagship products include Nova, a multi-model AI assistant; Wiser, a bite-sized learning
    and mental-wellness product; DaVinci, an AI image-generation app; and Lotus Flow, a wellness and habit surface.
    Public materials say the company bootstrapped itself to profitability, expanded to more than 40 products, and
    reached more than 600 million users or downloads across 190+ countries before taking its first outside capital from
    Point72 in August 2026.
