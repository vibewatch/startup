      - number: '7.4'
        title: The residual risk is priceable only if governance denominators improve
        blocks:
          - type: paragraph
            body: >-
              The remaining risk problem is not conceptual; it is evidentiary. Public materials already prove that HubX
              has demand, real products, and meaningful technical sophistication. What they do not yet prove is whether
              the system is governed tightly enough at scale. Investors still cannot see regulatory correspondence,
              store-warning history, app-level revenue concentration, chargeback ratios, refund approval rates, formal
              incident response artifacts, or security certifications. Those gaps amplify every other risk described
              above because they prevent clean distinction between normal growing pains and deeper control weakness. A
              company can survive some subscription complaints, some macro volatility, or some model-vendor dependence.
              It is much harder to price those issues without denominators. That is why the thesis-break triggers for
              HubX are less about raw user growth and more about complaint intensity, store-policy incidents, churn
              quality, concentration drift, and whether management can document control maturity as the portfolio
              expands. Just as importantly, unresolved governance gaps make positive signals less valuable because
              outsiders cannot tell whether good current growth is resilient, promotional, or fragile.
            claimRefs:
