      - number: '1.3'
        title: Product footprint and shared infrastructure
        blocks:
          - type: paragraph
            body: >-
              HubX's public evidence supports the thesis that shared infrastructure is one of its core competitive
              assets. The products page and financing announcement repeatedly highlight four headline brands—Nova,
              Wiser, DaVinci, and Lotus Flow—but store pages and Google Cloud materials show that the long tail is
              substantially larger. Google Play currently lists additional HubX products across AI video, interior
              design, language tutoring, note taking, logo generation, macro tracking, translation, and fitness. The
              Google Cloud case study provides the most concrete external proof that the central AI stack is real and
              material: it says HubX uses Google Kubernetes Engine, Cloud Run, TPUs, GPUs, and Hyperdisk ML to push
              response times below ten seconds, improve inference speed by 2.5 times, reduce operating cost by 40
              percent, and cut boot or deployment times by 20 to 30 times. The official website layers in a monetisation
              angle through RevenueX, an internal in-app purchase engine that management says lifted subscription
              revenue by 50 percent and is being commercialized for third-party publishers. Together, these sources
              depict HubX less as an app launcher and more as an operating system for high-velocity consumer AI
              products.
