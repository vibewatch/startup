      - number: '3.3'
        title: Distribution, switching costs, and trust are the real competitive chokepoints
        blocks:
          - type: paragraph
            body: >-
              The toughest part of this market is not building a functional AI feature set; it is holding user attention
              after first download. Sensor Tower and Menlo make the same structural point from different angles: default
              assistants take an outsized share of time spent, and consumer AI switching costs are close to zero. That
              means Nova is not only competing against another chat app; it is competing against the user’s habit of
              opening ChatGPT or the assistant already embedded into Google’s ecosystem. App stores add another layer of
              power because Apple and Google control review policies, subscription disclosure, and merchandising
              surfaces. Trust is also turning into a competitive filter. Canva markets Shield and admin controls, Adobe
              pushes commercially safe generation and content credentials, and Codeway’s 2026 leak reports show how
              quickly a high-velocity wrapper studio can lose credibility if privacy controls fail. For HubX, retention
              and safety posture matter as much as feature breadth because a user who doubts billing, privacy, or output
              reliability can multi-home or churn almost instantly.
