  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and consumer-protection risk is rising around exactly the surfaces HubX operates
        blocks:
          - type: paragraph
            body: >-
              HubX's category mix pulls it into several policy regimes at once. The EU AI Act is no longer a remote
              concept: public Commission materials now spell out transparency obligations for chatbots and AI-generated
              content, GPAI-related documentation and copyright expectations, and eventual enforcement powers around
              documentation and corrective measures. That matters because HubX publicly markets chat assistants, image
              generators, creator-style surfaces, and an AI Lab that fine-tunes or builds models. On top of AI-specific
              regulation, the app-store layer keeps tightening. Apple's review rules make user-generated content
              moderation, health-claim support, and third-party SDK accountability the developer's problem, while Google
              Play keeps expanding safety, permissions, and verification policies. The final consumer-protection overlay
              is recurring subscriptions. FTC guidance on negative-option programs, together with HubX's own
              cancellation and refund surfaces, makes billing clarity and easy cancellation a legal risk vector rather
              than a simple support issue.
            claimRefs:
