  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'The real landscape is layered: incumbents, vertical apps, and app factories'
        blocks:
          - type: paragraph
            body: >-
              HubX does not face one clean peer set. Nova collides directly with the first-party general
              assistants—ChatGPT, Gemini, and Claude—because all three now package voice, images, files, search, and
              multi-device access in the same consumer workflow. DaVinci and related creative products run into Adobe
              Firefly and Canva, where AI generation is no longer a standalone app but a feature nested inside a much
              broader creation suite. Wiser, Lotus Flow, and any wellness-adjacent products compete less with raw model
              vendors than with high-frequency habit brands such as Headspace and Calm that already own sleep, anxiety,
              and self-improvement time. On top of that, HubX also competes with studio-model operators such as Codeway
              and Bending Spoons, which prove that scaled publishers can launch, acquire, and optimize many consumer
              apps at once. This layered map matters because HubX’s advantage is not a unique model; it is the ability
              to package, test, cross-sell, and iterate across multiple categories before a single incumbent or another
              factory absorbs the same use case.
