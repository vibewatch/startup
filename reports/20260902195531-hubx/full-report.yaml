      - number: '2.3'
        title: Buyer segmentation and why Türkiye matters on the supply side
        blocks:
          - type: paragraph
            body: >-
              HubX sells primarily to individuals, not procurement committees. In its core app categories, the user,
              buyer, and payer are often the same person or household member: someone trying to write faster, generate
              imagery, learn on the go, or build healthier habits. But supply-side advantages still matter because the
              product portfolio must be refreshed quickly and supported with performance marketing, localization,
              design, and model-integration work. Türkiye offers a plausible base for that operating model. Invest in
              Türkiye highlights a young population of 85.7 million, nearly one million university graduates per year,
              more than 72,000 engineering-related graduates, and the world's eighth-largest app-download market, all of
              which make the country a production and testing ground for consumer apps. KPMG and Invest also show an
              ecosystem that is deepening rather than hypothetical: local and foreign capital are active, AI is one of
              the more vibrant verticals, and international showcase programs such as VivaTech and Turcorn 100 are
              explicitly geared toward export-ready startups. The missing piece is not talent existence but precise cost
              benchmarking for senior AI talent and scaled content operations.
