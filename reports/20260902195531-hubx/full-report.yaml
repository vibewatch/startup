    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, geography, and the hub-to-studio model
        blocks:
          - type: paragraph
            body: >-
              HubX presents itself as a Turkish consumer technology platform rather than a single-app company. The
              official homepage calls the company a technology hub that designs, builds, launches, and scales highly
              scalable apps; the same page explains that autonomous in-house studios own specific product verticals
              while a central hub supplies shared resources such as office space, data tools, funding, and know-how.
              That operating design matters because it is the clearest explanation for how a company founded only in
              2022 could already show a visible portfolio spanning AI chat, image generation, learning, wellness, plant
              recognition, tattoo design, and other consumer categories. The 2026 financing materials anchor the company
              in Izmir and say it now operates from both Izmir and Istanbul. Contact information on the official site
              corroborates those two cities by listing an Izmir HQ and a Maslak Square office in Istanbul. In practical
              terms, HubX is selling a repeatable studio engine: centralized monetisation, user acquisition, data, and
              AI infrastructure wrapped around many app concepts rather than one flagship franchise alone.
