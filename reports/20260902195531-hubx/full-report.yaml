  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: not all AI, but paid consumer AI mobile utility'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame HubX's market is to start with what it is not. HubX is not competing for generic
              enterprise AI transformation budgets, and it is not primarily a pure gaming studio. Its public portfolio
              points instead to paid consumer utility: chat assistants, image and video generation, bite-sized learning,
              wellness, and adjacent lifestyle apps distributed through mobile app stores and monetized mainly via
              subscriptions or in-app purchases. That makes the broadest comparable spend pool the non-game mobile app
              economy rather than total software or total AI investment. In 2025, Sensor Tower estimated $167 billion of
              total mobile IAP revenue and roughly $85 billion of non-game app spending, with generative AI as the
              fastest-growing revenue driver. HubX's true served market is narrower still: the slice of global mobile
              spend devoted to specialized AI-assisted experiences where consumers repeatedly pay to save time, create
              content, or improve themselves. This boundary matters because it preserves both opportunity and realism;
              consumer AI is large enough to matter, but small enough that default model providers and app-store rules
              can materially compress the addressable pool for thinly differentiated apps.
