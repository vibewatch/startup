callouts:
- calloutType: strength
  title: Public evidence supports real customer reach and real payment sophistication
  body: HubX is not relying on one weak vanity metric. The company has app-store proof, partner-reported subscriber scale, global reach claims that broadly line up across sources, and unusually concrete web-conversion evidence from Paddle and Adapty.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU017
  - CU019
  - CU022
- calloutType: risk
  title: Customer quality is less visible than customer quantity
  body: The public record still omits MAU, DAU, payer mix, app-level retention, and revenue concentration by title or geography, so the 600M+ headline cannot be treated as a full underwriting answer.
  claimRefs:
  - CU004
  - CU025
  - CU040
  - CU041
  - CU045
- calloutType: risk
  title: Billing trust is the sharpest customer-side weakness visible in open sources
  body: Strong product ratings coexist with off-platform complaints about refunds, deceptive billing, and support quality, which is exactly where subscription businesses can destroy otherwise solid demand.
  claimRefs:
  - CU020
  - CU032
  - CU033
  - CU034
