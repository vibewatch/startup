- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Public proof
  - Diligence path
  rows:
  - - Web sales expansion
    - Still additive to app stores rather than independent
    - Improves reach and economics but does not erase store dependence
    - Paddle case study
    - Request channel mix by gross billings and payer acquisition source
  - - Localization and new payment methods
    - Conversion varies sharply by market
    - Can unlock countries previously unattractive
    - Paddle's 91% payment acceptance and local methods narrative
    - Request acceptance and CAC by top country
  - - Flagship title strength
    - Nova may dominate payer economics
    - Revenue concentration risk if one title weakens
    - Adapty top-grossing signal
    - Request top-5 app revenue share and payer concentration
  - - Portfolio diversification
    - Breadth can mask a winner-take-most reality
    - Helps demand resilience but may not diversify revenue proportionally
