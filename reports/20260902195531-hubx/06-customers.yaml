tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Strategic value
  - Gap
  rows:
  - - General AI assistant users
    - Individual user is usually both user and payer
    - Ask, write, translate, research, code, and multitask with AI
    - Nova ratings, 'trusted by millions', top-grossing signal
    - Largest mainstream AI category and likely flagship monetization engine
    - Public revenue share and active-user denominator are missing
  - - Creators and media makers
    - Individual creator or prosumer payer
    - Generate images, videos, logos, avatars, and campaign assets
    - DaVinci 75K ratings; 100M+ creators claimed
    - Diversifies away from pure chat and taps visual creation budgets
    - No public creator retention or export-to-paid-workflow data
  - - Learners / self-improvement users
    - Individual learner is user and payer
    - Consume summaries, audio, and daily learning habit loops
    - Wiser 56K ratings; Best of 2025 recognition; 4/5 users claim
    - Habit-forming use case can support recurring subscription behavior
    - No public completion, renewal, or cohort metrics
  - - Wellness and fitness users
    - Individual wellness user is usually payer
    - Yoga, mindfulness, pilates, habit coaching, low-impact fitness
    - Lotus Flow ratings and site community claims
    - Category breadth reduces dependence on AI-assistant attention
    - Health-adjacent data and lower Android rating create trust sensitivity
  - - Web buyers
    - Payer may still be same consumer, but payment channel shifts to web
    - Buy subscriptions outside app stores using localized checkout
    - Paddle 91% payment acceptance and support-ticket volume
    - Improves economics and market access outside store rails
    - Adds refund, tax, and support complexity
  notes: In HubX's consumer model, buyer, user, and payer are often the same person; the meaningful segmentation variable is use case and channel rather than enterprise org chart.
