    - Request Nova retention vs ChatGPT/Gemini substitution behavior
  - - Billing and support operations
    - High support volume can erode trust if mishandled
    - Affects refunds, reviews, and repeat willingness to pay
    - Paddle billing-ticket volume + Trustpilot complaints
    - Request refund SLAs, dispute rates, and CSAT/NPS
  notes: The core underwriting problem is concentration visibility, not absence of customer demand.
