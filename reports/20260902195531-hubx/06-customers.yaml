figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: HubX typically acquires a consumer through app stores or the web, proves value quickly, then tries to turn initial delight into recurring subscription behavior and cross-app reuse.
  data:
    items:
    - label: Discovery
      detail: User finds a HubX product via app-store ranking, search, ads, or an external web offer.
      tone: neutral
    - label: First session value
      detail: Nova answers a question, DaVinci renders media, Wiser delivers a summary, or Lotus Flow starts a routine.
      tone: positive
    - label: Trial or paywall moment
      detail: The conversion window is early and often immediate after install.
      tone: warning
    - label: Repeat-use habit
      detail: Retention depends on daily learning, routine wellness, recurring utility, or continued creation.
      tone: positive
    - label: Billing or support friction
      detail: Refunds, chargebacks, and cancellation moments can strengthen or damage trust.
      tone: warning
    - label: Expansion loop
      detail: HubX can upsell via web checkout, plan salvage, or cross-app learning from portfolio experimentation.
      tone: neutral
  approximationNotes: This map synthesizes recurring consumer flows across HubX's flagship apps and web monetization surfaces rather than depicting one exact screen sequence.
