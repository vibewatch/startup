evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting control, and investor rights documents for the Point72 round.
    whyItMatters: Control terms determine founder dependence, downside protection, and future financing flexibility.
    diligencePath: Request cap table, shareholder agreement summary, board roster, and any observer rights memo from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited revenue, ARR, gross margin, refund, and churn disclosures at both company and flagship-app level.
    whyItMatters: Profitability and valuation cannot be underwritten rigorously from public claims alone.
    diligencePath: Request audited or management financials with app-level cohort retention, subscriber counts, and chargeback data.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: metric-consistency
    missingEvidence: >-
      A reconciled explanation for why the homepage still cites 350 million users while the August 2026 financing
      materials cite 600 million.
    whyItMatters: Stale or differently defined metrics reduce confidence in public reporting hygiene.
    diligencePath: Ask management for metric definitions, last-refresh dates, and an official KPI sheet used in fundraising.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: leadership-bench
    missingEvidence: A complete public executive team list beyond the founders and investor spokesperson.
    whyItMatters: >-
      A studio platform of this size should have visible functional leaders across engineering, finance, legal, and
      growth.
    diligencePath: Review LinkedIn, company bios, or management materials for CFO, CTO, legal, and studio-lead coverage.
    relatedQuestionRefs:
      - QO004
      - QO018
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: served-market-sizing
    missingEvidence: A management view of HubX's revenue mix, active subscribers, and geography split by flagship vertical.
    whyItMatters: >-
      Without app-level revenue and subscriber splits, the public TAM/SAM/SOM lens cannot be converted into a precise
      served-available market for HubX.
    diligencePath: >-
      Request category-level revenue, subscriber, and country splits for Nova, Wiser, DaVinci, Lotus Flow, and the next
      five products by revenue.
    relatedQuestionRefs:
      - QM026
  - type: missing-source
    severity: material
    topic: turkey-cost-benchmark
    missingEvidence: >-
      Reliable current benchmarks for senior AI engineer, product, and performance-marketing compensation in Izmir and
      Istanbul.
    whyItMatters: >-
      Turkey's talent advantage is intuitive, but valuation work needs a quantified cost advantage versus US and Western
      Europe.
    diligencePath: >-
      Pull salary surveys, recruiting data, or internal payroll benchmarks for senior engineering and growth roles in
      Turkey.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-definition-conflict
    missingEvidence: A single source using the same definition for consumer AI spend across web, mobile, and specialized categories.
    whyItMatters: >-
      Public market estimates disagree because they define the category differently, which complicates headline TAM
      comparisons.
    diligencePath: >-
      Normalize future work by keeping separate lenses for mobile AI app revenue, broader consumer AI spend, and total
      non-game app spend.
    relatedQuestionRefs:
      - QM021
      - QM022
  - type: private-evidence-only
    severity: material
    topic: Competitor realized pricing and discount ladders
    missingEvidence: >-
      Several competitor surfaces disclose only free-plus-IAP labels or plan names, not realized mobile price ladders,
      discounting, refund behavior, or regional pricing.
    whyItMatters: >-
      Without true net pricing the public comparison can show packaging strategy but cannot prove which competitor
      monetizes best at the margin.
    diligencePath: >-
      Collect subscription screenshots by region, refund-policy outcomes, and anonymized receipt data from
      mobile-intelligence vendors or the company.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: HubX product-level revenue concentration
    missingEvidence: >-
      Public sources do not break out HubX revenue, subscriber base, or gross margin by Nova versus the rest of the
      portfolio.
    whyItMatters: If Nova or one category drives most economics, HubX is less diversified than the portfolio narrative suggests.
    diligencePath: Request product-level revenue mix, subscriber counts, and cohort LTV by app family under NDA.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: material
    topic: Comparative CAC, payback, and retention by competitor class
    missingEvidence: >-
      No public dataset shows whether HubX retains or monetizes users better than Codeway, companion apps, or wellness
      incumbents on a cohort basis.
    whyItMatters: >-
      Execution quality is the core moat thesis; without cohort economics the moat remains descriptive rather than
      proven.
    diligencePath: >-
      Obtain cohort retention, payback, and reactivation metrics for major HubX products and benchmark against mobile
      intelligence or channel partner data.
    relatedQuestionRefs:
      - QP028
  - type: private-evidence-only
    severity: material
    topic: HubX ARR and revenue concentration
    missingEvidence: >-
      No public source discloses trailing revenue, ARR, or subscriber counts by app family, and the one low-quality ARR
      signal is not underwriteable.
    whyItMatters: >-
      Without product-level revenue mix, investors cannot know whether HubX is a diversified portfolio or a Nova-heavy
      single-product business in disguise.
    diligencePath: Request trailing-12-month revenue, ARR, payer counts, and gross margin by product family under NDA.
    relatedQuestionRefs:
      - QI026
  - type: private-evidence-only
    severity: material
    topic: HubX cash, burn, runway, and debt
    missingEvidence: The current cash balance, monthly burn, debt obligations, and runway are not publicly disclosed.
    whyItMatters: The $50M initial round can only be translated into runway after those baseline balance-sheet facts are known.
    diligencePath: Obtain current balance sheet, cash-flow forecast, debt schedule, and board-approved operating plan.
    relatedQuestionRefs:
      - QI027
  - id: GE001
    question: >-
      Which shipped product features rely on HubX-trained or fine-tuned models versus third-party APIs, and what
      training-data rights or model-card controls govern them?
    whyItMatters: >-
      This determines whether HubX's differentiation is compounding proprietary know-how or mostly packaging access to
      external models.
    relatedQuestionRefs:
      - QE010
  - id: GE002
    question: >-
      Where is the public status page, uptime history, or product-level SLA evidence for HubX's AI apps and shared
      platform?
    whyItMatters: Without operational transparency, reliability claims are hard to underwrite independently.
    relatedQuestionRefs:
      - QE026
  - id: GE003
    question: >-
      What third-party security or compliance attestations, if any, support HubX's handling of consumer, wellness, and
      AI-generated data?
    whyItMatters: >-
      Institutional diligence needs more than app-store labels and marketing claims for a company operating at global
      consumer scale.
    relatedQuestionRefs:
      - QE027
  - id: GU001
    question: Which products, countries, or channels account for the majority of HubX's paying customers and revenue?
    whyItMatters: Without concentration data, portfolio breadth may overstate business diversification.
    relatedQuestionRefs:
      - QU026
    relatedTableRefs:
      - TU002
  - id: GU002
    question: >-
      What are HubX's actual MAU, DAU, subscriber, renewal, refund, and cohort-retention metrics by flagship app and
      channel?
    whyItMatters: Headline reach is useful, but underwriting customer quality requires denominators and cohort durability.
    relatedQuestionRefs:
