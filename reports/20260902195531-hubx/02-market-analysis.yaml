- id: FM003
  title: Buyer / segment map
  type: flow
  layout: wide
  summary: Consumer AI demand flows from awareness into a default general assistant, then branches to specialized subscription apps only when a specific use case outperforms the default.
  data:
    nodes:
    - id: n1
      label: AI-aware consumer
      detail: Most adults have at least heard of AI and many interact with it weekly.
      tone: positive
    - id: n2
      label: Default general assistant
      detail: ChatGPT, Gemini, Claude, and peers are the first stop for most tasks.
      tone: neutral
    - id: n3
      label: Specialized AI app trial
      detail: Consumer tests a niche app for creativity, learning, wellness, or a specific workflow.
      tone: positive
    - id: n4
      label: Subscription or credit purchase
      detail: Payment happens only if value is immediate and recurring enough to justify another app.
      tone: warning
    - id: n5
      label: Platform billing / policy gate
      detail: Apple and Google shape discovery, approval, billing, and cancellation obligations.
      tone: neutral
    - id: n6
      label: Retention or churn
      detail: Latency, trust, and differentiated output determine whether the app becomes habitual or gets replaced.
      tone: warning
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
    - from: n2
      to: n6
      label: Default wins if niche value is weak
  approximationNotes: The flow is behavioral rather than transactional accounting; it synthesizes survey, platform-policy, and app-economics evidence into one adoption path.
