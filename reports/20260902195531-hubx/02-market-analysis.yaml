- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - AI habit formation
    - Driver
    - Current
    - Downloads, hours, and survey usage all rose sharply in 2025-2026
    - Consumer demand is real, not purely promotional
    - Request HubX cohort retention by product category
  - - Specialized utility monetization
    - Driver
    - Current
    - RevenueCat and Appfigures show niche AI apps can monetize above the median
    - A portfolio strategy can work if each app reaches fast time-to-value
    - Compare RPI and payback by HubX vertical
  - - Türkiye talent and testing base
    - Driver
    - Current / medium term
    - Large graduate pool and heavy mobile usage support rapid iteration
    - Local supply can lower speed-to-launch friction
    - Request compensation and attrition data for key roles
  - - Big Tech default distribution
    - Constraint
    - Current
    - ChatGPT, Gemini, and DeepSeek dominate usage; ChatGPT reached 1B MAU
    - General assistants can absorb generic use cases quickly
    - Measure how many HubX use cases are one-click replaceable
  - - Zero switching costs
    - Constraint
    - Current
    - Menlo says consumers default to familiar tools and switch easily
    - Retention and brand moat are fragile
    - Request win-back and cross-sell performance data
  - - Subscription churn
    - Constraint
    - Current
    - RevenueCat shows heavy first-month cancellations and low retention for pricey monthly plans
    - UA payback can break quickly if product value is slow or unclear
    - Obtain churn, refund, and paywall A/B metrics
  - - Platform and regulatory disclosure
    - Constraint
    - Current to 2027
    - App-store transparency rules and EU AI Act disclosure obligations are tightening
    - Opaque billing or undisclosed AI use can trigger removal or fines
    - Audit subscription UX, AI labeling, and regional compliance
  - - Latency and infrastructure cost
    - Both
    - Current
    - HubX case study says >10-second latency increases churn while GKE lowered costs 40%
    - Product speed is both a growth lever and cost discipline requirement
    - Request per-product inference cost curves and SLA targets
  notes: This table mixes demand drivers with supply and compliance constraints because all three determine whether consumer AI growth converts into durable gross margin.
