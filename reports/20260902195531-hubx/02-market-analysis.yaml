  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: served-market-sizing
    missingEvidence: A management view of HubX's revenue mix, active subscribers, and geography split by flagship vertical.
    whyItMatters: Without app-level revenue and subscriber splits, the public TAM/SAM/SOM lens cannot be converted into a precise served-available market for HubX.
    diligencePath: Request category-level revenue, subscriber, and country splits for Nova, Wiser, DaVinci, Lotus Flow, and the next five products by revenue.
    relatedQuestionRefs:
    - QM026
  - type: missing-source
    severity: material
    topic: turkey-cost-benchmark
    missingEvidence: Reliable current benchmarks for senior AI engineer, product, and performance-marketing compensation in Izmir and Istanbul.
    whyItMatters: Turkey's talent advantage is intuitive, but valuation work needs a quantified cost advantage versus US and Western Europe.
    diligencePath: Pull salary surveys, recruiting data, or internal payroll benchmarks for senior engineering and growth roles in Turkey.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-definition-conflict
    missingEvidence: A single source using the same definition for consumer AI spend across web, mobile, and specialized categories.
    whyItMatters: Public market estimates disagree because they define the category differently, which complicates headline TAM comparisons.
    diligencePath: Normalize future work by keeping separate lenses for mobile AI app revenue, broader consumer AI spend, and total non-game app spend.
