    - label: Use specialized tools too
      value: 60
      unit: index
      note: Menlo says 60% use both general and specialized AI tools.
    - label: Daily AI users
      value: 33
      unit: index
      note: Menlo globalized daily-use cohort implies a much narrower power-user group.
    - label: Premium payers
      value: 3
