    - Useful TAM context, but too broad for underwriting HubX
  - - Non-game mobile apps
    - App-store subscriptions and IAP across productivity, social, creativity, education, wellness, and other utility categories
    - Mobile games, advertising-only revenue, offline services
    - Consumers paying through Apple or Google accounts
    - Best broad spend pool for HubX's distribution model
  - - Mobile generative-AI apps
    - AI assistant, creation, editing, education, and companion apps with recurring spend
    - Enterprise SaaS seats; B2B copilots bought by employers
    - Consumers paying directly for subscriptions or credits
    - Closest public SAM proxy for Nova, DaVinci, Wiser, and adjacent products
  - - HubX-served verticals
    - Specialized subscription-funded consumer AI, learning, creativity, and wellness apps
    - Pure gaming, enterprise AI, agency services, hardware devices
    - User often equals buyer and payer; household decision is instantaneous
    - Most defensible served market definition for product and valuation work
