- id: adoption-and-user-economics
  title: Adoption is broad, but monetization remains the bottleneck
  body: 'The strongest bullish signal in this market is habit formation. Sensor Tower says generative AI app downloads doubled to 3.8 billion in 2025, revenue exceeded $5 billion, and time spent reached 48 billion hours. Menlo Ventures and Pew reinforce that this is no longer niche experimentation: 61 percent of American adults used AI recently, 95 percent have heard of it, 62 percent say they interact with it at least several times a week, and 73 percent would let it assist them in daily life. Yet monetization is still the bottleneck. Menlo estimates only about 3 percent of the broader consumer AI user base is paying for premium services, and RevenueCat shows why: subscription churn is front-loaded, trial conversion is concentrated on day zero, and expensive monthly plans retain very poorly. Appfigures, meanwhile, shows that thin wrappers can still generate meaningful money, but a large share of that spend already flows to general assistants and ChatGPT-led categories. The implication is
    that the market rewards speed to value and niche utility, not just “AI” branding.'
