- id: cover-metrics-and-disclosure-gaps
  title: Cover Metrics, Scale Markers and Disclosure Gaps
  body: 'The verifiable headline metrics are operational rather than financial. Registry and company sources support a 2020 foundation date, a current Beijing headquarters, a reported insured-employee count of 96 on Aiqicha, and a workforce mix that the company says is 70 percent R&D and 65 percent masters or Ph.D. talent. Product-usage evidence is stronger than revenue evidence: TMTPost reports that the 550-qubit cloud platform accumulated more than 18 million task calls, served over 400 institutions across 830 disciplines and produced more than 440 application reports, while the company claims thousands of developers in its Kaiwu community. Those metrics imply ecosystem reach, but they do not prove paying-customer count, recurring software revenue or hardware gross margin. The exact post-money valuation is likewise still opaque in open sources: subscription databases track the company and its Series B status, but open-access outputs do not independently verify the often-repeated unicorn
    figure. We therefore keep valuation, revenue, ARR, burn and runway as unsupported cover metrics.'
  claimRefs:
