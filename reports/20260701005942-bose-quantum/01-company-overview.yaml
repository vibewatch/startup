company:
  name: Bose Quantum
chapter:
  number: 1
  title: Company Overview
  summary: Bose Quantum is a Beijing photonic-quantum hardware company founded in late 2020 that has progressed from a 100-qubit launch to a CNY 1 billion Series B and a 1000-qubit product roadmap, but still keeps revenue, cap-table detail and exact valuation largely private.
sections:
- id: identity-and-stage
  title: Identity, Headquarters and Stage
  body: 'Bose Quantum, also branded in English as Boson Quantum Technology or QBoson, is a private Beijing photonic quantum-computing company whose current legal name is Beijing Boson Quantum Technology Co., Ltd. as a non-listed joint-stock company. Registry records and the official site place the business in Chaoyang District, Beijing, with a founding date of 2020-11-16 and an operating address on Wanhong West Street. The business model is not a pure software stack: the company describes itself as a full-stack photonic-quantum platform provider spanning dedicated quantum-computing hardware, cloud access, development tooling and application deployment for enterprise and research workloads. Public evidence supports a current stage of private Series B hardware scale-up rather than a mature commercial operator. The strongest open sources confirm aggressive technical and manufacturing ambitions, but they do not disclose audited revenue, recurring software economics or a clean post-money valuation,
    so those metrics remain explicit diligence gaps rather than facts.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO026
  - CO027
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Founders, Leadership and Key-Person Dependence
  body: 'The public leadership story centers heavily on founder and CEO Dr. Wen Kai. English trade coverage, the company site and scholarly records align on his Stanford Ph.D. background, prior Google quantum experience and early association with coherent Ising machine research. The official team page also names COO Ma Yin, CTO Wei Hai and chief scientist Wang Chuan as core executives driving productization. Registry-style sources add a thin but useful governance layer: Aiqicha identifies Ma Yin as vice chairman and lists Li Huiling, Jiang Peixing, Ruan Dong and Wang Dan in finance or director roles. That is enough to show the company has evolved beyond a one-person founder narrative, but not enough to verify independent board oversight, shareholder control, board committees or decision rights. Key-person concentration therefore remains material: the technical story, external brand and investor signaling all still route through Wen Kai and the founding technical bench.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO028
  tableRefs:
  - TO002
- id: funding-and-capital
  title: Funding History, Investors and Capital Signal
  body: 'Bose Quantum has raised capital repeatedly since inception, with TMTPost describing the late-2024 A+ extension as the company''s seventh fundraising event since founding. The open-source record is strongest on named rounds rather than on the full cumulative cap table. The 2023 Series A exceeded RMB 100 million and was linked to China Mobile and Tsinghua-affiliated capital. A Beijing government-backed fund led the 2024 A+ financing, the October 2025 A++ round brought in a new group of strategic and financial investors for hundreds of millions of renminbi, and the March 2026 Series B reached CNY 1 billion (about USD 145 million) with a syndicate dominated by state-backed or institutionally connected investors. The pattern matters more than the exact cumulative total: Bose Quantum is being financed as a national-strategic deep-tech manufacturer, not as a lightly capitalized software startup. Even so, open sources do not fully reveal round terms, liquidation preferences, secondaries,
    debt or exact ownership stakes, so capital adequacy beyond the headline round size still needs direct diligence.'
  claimRefs:
