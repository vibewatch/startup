  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: A board-approved post-money valuation, share count and pricing bridge for the 2026 Series B.
    whyItMatters: The recommendation and dilution analysis depend on whether the often-repeated unicorn framing is real, implied or purely database-derived.
    diligencePath: Request the Series B term sheet, cap table and any investor deck page stating price per share and post-money valuation.
    relatedQuestionRefs:
    - QO014
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Revenue, ARR, hardware ASP, gross margin, burn and runway data for 2024-2026.
    whyItMatters: Without commercial economics, later valuation and capital-adequacy judgments must default to caution despite strong technical milestones.
    diligencePath: Request monthly management accounts, revenue by product line, order backlog, gross margin bridge and cash-flow forecast.
    relatedQuestionRefs:
    - QO018
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Board composition, independent-director presence, shareholder voting rights and committee structure.
    whyItMatters: Control rights and founder dependence affect both governance risk and round-term interpretation.
    diligencePath: Request the latest articles of association, board roster, shareholder agreement summary and any observer or veto-right schedule.
    relatedQuestionRefs:
    - QO008
    - QO025
  - type: conflicting-data
    severity: minor
    topic: funding-history
    missingEvidence: A reconciled lifetime-funding table covering all seven fundraising events with exact sizes and dates.
    whyItMatters: Public coverage confirms multiple rounds but not a complete cumulative capital figure, making total-raised comparisons noisy.
    diligencePath: Obtain a company-approved financing chronology and reconcile it against Tracxn, media reports and registry change filings.
    relatedQuestionRefs:
    - QO009
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: A bridge from platform usage metrics to named paying customers, contract values and renewal status.
    whyItMatters: Cloud accesses and institutional reach can overstate commercial traction if they mainly reflect trials, research credits or ecosystem activity.
    diligencePath: Request a customer list with contract type, paid status, deployment stage, ARR contribution and renewal dates.
    relatedQuestionRefs:
    - QO017
    - QO020
