evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: A board-approved post-money valuation, share count and pricing bridge for the 2026 Series B.
    whyItMatters: >-
      The recommendation and dilution analysis depend on whether the often-repeated unicorn framing is real, implied or
      purely database-derived.
    diligencePath: >-
      Request the Series B term sheet, cap table and any investor deck page stating price per share and post-money
      valuation.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Revenue, ARR, hardware ASP, gross margin, burn and runway data for 2024-2026.
    whyItMatters: >-
      Without commercial economics, later valuation and capital-adequacy judgments must default to caution despite
      strong technical milestones.
    diligencePath: >-
      Request monthly management accounts, revenue by product line, order backlog, gross margin bridge and cash-flow
      forecast.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Board composition, independent-director presence, shareholder voting rights and committee structure.
    whyItMatters: Control rights and founder dependence affect both governance risk and round-term interpretation.
    diligencePath: >-
      Request the latest articles of association, board roster, shareholder agreement summary and any observer or
      veto-right schedule.
    relatedQuestionRefs:
      - QO008
      - QO025
  - type: conflicting-data
    severity: minor
    topic: funding-history
    missingEvidence: A reconciled lifetime-funding table covering all seven fundraising events with exact sizes and dates.
    whyItMatters: >-
      Public coverage confirms multiple rounds but not a complete cumulative capital figure, making total-raised
      comparisons noisy.
    diligencePath: >-
      Obtain a company-approved financing chronology and reconcile it against Tracxn, media reports and registry change
      filings.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: A bridge from platform usage metrics to named paying customers, contract values and renewal status.
    whyItMatters: >-
      Cloud accesses and institutional reach can overstate commercial traction if they mainly reflect trials, research
      credits or ecosystem activity.
    diligencePath: Request a customer list with contract type, paid status, deployment stage, ARR contribution and renewal dates.
    relatedQuestionRefs:
      - QO017
      - QO020
  - type: private-evidence-only
    severity: material
    topic: bose-sam-som
    missingEvidence: Disclosed pricing, contract values, paid account counts, and renewal data by segment.
    whyItMatters: Without pricing and conversion evidence, a Bose-specific SAM or SOM would be more narrative than measurement.
    diligencePath: Request pipeline segmentation, average contract value, and paid production conversion by buyer cohort.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: cloud-to-revenue-conversion
    missingEvidence: A public bridge between cloud or SDK usage and recurring paid production revenue.
    whyItMatters: Cloud usage metrics can overstate monetization if experiments do not convert into paid, renewed workflows.
    diligencePath: Ask for cohort conversion data from developers or trial users to paid pilots and production deployments.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: budget-owner-granularity
    missingEvidence: Named budget owners and procurement authority patterns by segment.
    whyItMatters: Budget ownership shapes sales cycle length and the likelihood that pilot activity can become durable spend.
    diligencePath: Map closed-won opportunities by buyer type and ask which function signed or funded each project.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing-boundaries
    missingEvidence: >-
      A like-for-like public dataset that reconciles current revenue, future vendor market, and broader economic value
      without mixing denominators.
    whyItMatters: >-
      Forecast divergence can mislead valuation work if current monetized demand is confused with long-horizon value
      pools.
    diligencePath: >-
      Rebuild the sizing model using one denominator at a time and insist on separate current-revenue, forecast-revenue,
      and economic-value views.
    relatedQuestionRefs:
      - QM010
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Bose-specific list prices, minimum contract structures, cloud billing units and discount conventions.
    whyItMatters: >-
      Without a concrete pricing surface, it is difficult to compare procurement friction or margin potential against
      IBM, Azure or D-Wave access models.
    diligencePath: >-
      Request current price sheets, sample statements of work and at least three recent deal archetypes split by
      hardware sale, cloud access and co-development.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: deployment-scale
    missingEvidence: Bose-specific public installed-base counts, paid customer counts and geographic deployment split.
    whyItMatters: >-
      Public qubit claims say little about whether Bose has repeatable commercial traction relative to Quandela, D-Wave
      or IonQ.
