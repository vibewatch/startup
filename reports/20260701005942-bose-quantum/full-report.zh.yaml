  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 直接的光子与架构同类公司
        blocks:
          - type: paragraph
            body: >-
              Bose 的公开材料明确显示，它卖的不是通用量子软件层，而是一套光子栈，覆盖专用硬件、室温运行、通过 China Mobile 的 Wuyue 平台云端暴露，以及 Kaiwu SDK
              工具。这让它进入的买方讨论，更接近光子或光学优先厂商，而不只是超导或离子阱既有厂商。PsiQuantum 正沿硅光子路线推进实用级系统；ORCA 面向 HPC 集成销售机架式、室温 PT 系统；Quandela
              提供云端和本地 MosaiQ 系统以及 Perceval 工具；Xanadu 继续把 Aurora 定位为可扩展、网络化、模块化的光子计算机。LightSolver
              不是量子公司，但在战略上重要，因为它试图用模拟光学硬件而不是量子比特来赢下优化类预算。结果是，Bose 的核心模态有差异化，但并不独一无二。买方已经有多种方式押注光子、网络化光子或光学计算，而不必专门选择
              Bose。因此，在已审阅材料中，Bose 最强的直接优势是本土渠道适配和部署叙事，而不是对室温或云可访问光子计算的独占主张。
