  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum
              的动能足够支持继续尽调，但披露不足以支持现在投资。可投论点很直接：公司显然不只是实验室项目，短时间内完成多轮融资，选择围绕光子专用量子系统搭建，而不是等待通用容错量子计算，并且有足够产品和部署证据，说明客户与国家相关伙伴认真看待它。反论点同样重要。公开来源仍未披露收入、利润率、轮次条款或投后估值；Jiemian
              的反向报道说收入仍未披露，早期客户往往是超算中心，而不是广泛且续约密集的企业客户群。公开量子可比公司显示，投资人可以为巨大的期权价值支付高溢价，但这些公司披露更多财务信息，同时经济性仍波动很大。审慎结论是
              **research-more**，信心为 **中等**，风险为 **高**；估值立场不是「明显有吸引力」，而是 **仅凭已披露事实仍未知**。
