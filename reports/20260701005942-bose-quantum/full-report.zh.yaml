      - number: '2.4'
        title: 增长驱动、采用约束与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Bose 受益于真实的结构性驱动。中国国家主导的量子生态把大量战略资金、公私协调和实验室到市场的商业化压力导入该行业。QED-C、MERICS 和 USCC
              都指向同一大格局：量子仍然资本密集、供应链敏感，也足够具有战略重要性，以至于政府和大型机构愿意在标准化企业需求显现之前补贴生态建设。这有利于 Bose
              的本土市场。反向力量是，商业化风险仍高。人才稀缺、供应链脆弱、私营市场需求仍难观察，即便看多的来源也把这个市场描述为更奖励准备而非立刻规模化的市场。D-Wave
              努力把自己的付费生产使用与行业其他玩家区分开来，反过来说明真正部署仍然罕见。尽调上，最大的剩余缺口都与 Bose
              自身相关：公开来源没有披露定价、合同金额、从云端试用到付费生产的转化率，也没有透明的中国细分市场拆分。这些缺口让市场方向值得投资人研究，但使精确的 Bose SAM 或 SOM 仍无法落地。
