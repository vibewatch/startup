            - China Mobile 云
            - Kaiwu SDK 任务提交
        - id: stage-domain-fit
          label: 领域验证
          actor: 应用算法团队或实验室团队
          description: 用户把基金优化、肽生成、路线规划、超算调度等领域工作负载映射到 Bose 技术栈。
          channels:
            - 生物医药工作流
            - 金融优化
            - 城市或交通用例
            - 超算集成
        - id: stage-named-proof
          label: 具名项目或部署
          actor: 机构买方或平台运营方
          description: 目前最强的公开证明来自具名云渠道、超算部署，以及 China Merchants Bank Tiancheng AI 这类定制项目。
          channels:
            - China Mobile 渠道
            - Chengdu 超算中心
            - China Merchants Bank 项目
        - id: stage-expand
          label: 扩张或本地化
          actor: 商业负责人或基础设施买方
          description: Bose 的上行情境是，重复工作负载带来私有部署、更多部门采用，或更大的合作伙伴渠道分销，但这一转化尚未公开量化。
          channels:
            - 私有部署
            - 单账户更多工作负载
            - 更多合作伙伴协议
    approximationNotes: 阶段由保留的公开客户证据综合而来，不代表 Bose 的 CRM 阶段或内部漏斗定义。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU007
      - CU009
      - CU015
      - CU018
      - CU021
      - CU026
      - CU027
      - CU036
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开可见的推进路径：从广泛社区触达到更窄的付费或机构锚定部署界面。
    data:
      nodes:
        - id: community
          label: 社区与开发者触达
          detail: 开源仓库、文档、竞赛和社区门户在开发者与研究用户中建立认知。
        - id: cloud
          label: 云试用与按任务定价
          detail: 按任务访问和合作伙伴云引导降低了实验门槛。
        - id: domain
          label: 特定领域验证
          detail: 用户拿金融、生物技术、城市或 AI 工作流测试平台。
        - id: institutional
          label: 具名机构证明
          detail: China Mobile Cloud、Chengdu Supercomputing 和 China Merchants Bank 是最清晰的公开证明。
        - id: private
          label: 私有部署或账户扩张
          detail: Bose 对外推广本地硬件部署，但公开资料没有披露转化规模。
    approximationNotes: 该流程是定性的，因为公开来源披露的是各阶段示例，而不是每一阶段账户数全量。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU018
      - CU019
      - CU022
      - CU023
      - CU026
      - CU027
      - CU037
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 不同具名客户界面的公开证明质量差异很大；部署可见，但留存可见度几乎处处偏弱。
    data:
      columns:
        - 关系类型
        - 生产成熟度
        - 结果具体度
        - 留存可见度
      rows:
        - label: China Mobile Cloud
          values:
            - 合作伙伴云上线且服务可下单
            - 试点至早期商业渠道
            - 中 — 机器规模、SDK 与任务工作流已有描述
            - 低 — 没有活跃账户或续约指标
        - label: Chengdu Supercomputing Center
          values:
            - 具名机构的物理部署
            - 已部署并完成任务测试
            - 中高 — 部署规模和测试工作负载公开
            - 低 — 没有合同金额或续约数据
        - label: China Merchants Bank
          values:
            - 具名银行采购项目
            - 试点或早期生产型项目
            - 中 — 用例和服务范围公开
            - 低 — 没有期限、TCV 或后续支出
        - label: 生物医药生态
          values:
            - 合作与应用工作流
            - 探索至试点
            - 中 — 多个用例和具名合作伙伴
            - 很低 — 没有商业队列数据
        - label: 社区漏斗
          values:
            - 仓库、文档、讲座和社区门户
            - 商业化前漏斗
            - 中 — 使用界面具体可见
            - 无 — 没有转化或流失披露
    approximationNotes: 单元格是基于保留来源的证据判断，不是供应商认证的客户成功指标。
    claimRefs:
      - CU007
      - CU009
      - CU015
      - CU018
      - CU021
      - CU023
      - CU024
      - CU026
      - CU036
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 商业化、工厂执行与跨境合规相互强化之处，剩余敞口最高。
    data:
      columns:
        - 发生概率 (1-5)
        - 影响 (1-5)
        - 缓释成熟度 (1-5)
        - 剩余敞口 (1-5)
      rows:
        - label: 商业化缺口
          values:
            - 4
            - 5
            - 2
            - 5
        - label: 工厂 / 良率爬坡
          values:
            - 4
            - 5
            - 2
            - 4
        - label: 出口管制与投资者摩擦
          values:
            - 3
            - 5
            - 2
            - 4
        - label: 伙伴与客户集中度
          values:
            - 4
            - 4
            - 2
            - 4
        - label: 光子供应链瓶颈
          values:
            - 3
            - 4
            - 2
            - 4
        - label: 治理与人员拉伸
          values:
            - 3
            - 3
            - 2
            - 3
    approximationNotes: 分数是从保留来源推导出的综合判断，用于相对排序，不代表精算概率。
    claimRefs:
      - CR038
      - CR039
      - CR041
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最危险的失效路径，是出口或供应摩擦拖慢工厂产出，削弱部署证据，并触发又一轮融资需求。
    data:
      nodes:
        - id: controls
          label: 出口 / 政策管制
        - id: components
          label: 组件获取
        - id: factory
          label: 工厂产能
        - id: reliability
          label: 可靠性证明
        - id: deployments
          label: 客户部署
        - id: revenue
          label: 收入可见度
        - id: financing
          label: 融资需求
        - id: valuation
          label: 估值下行
      edges:
        - from: controls
          to: components
        - from: components
          to: factory
        - from: factory
          to: reliability
        - from: reliability
          to: deployments
        - from: deployments
          to: revenue
        - from: revenue
          to: financing
        - from: financing
          to: valuation
        - from: controls
          to: financing
        - from: reliability
          to: valuation
    approximationNotes: 边表示承销论点中的因果方向，不是实测弹性。
    claimRefs:
      - CR014
      - CR017
      - CR019
      - CR041
      - CR042
      - CR043
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 可见商业化依赖一组紧密要素：合作伙伴云、机构锚点、政策资本和专用投入品。
    data:
      nodes:
        - id: clouds
          label: 合作伙伴云
        - id: supercompute
          label: 超算中心
        - id: biopharma
          label: 生物医药用户
        - id: universities
          label: 高校
        - id: state-capital
          label: 国资关联资本
        - id: suppliers
          label: 光子供应商
        - id: licenses
          label: 国内牌照
        - id: qboson
          label: QBoson 收入路径
      edges:
        - from: clouds
          to: qboson
        - from: supercompute
          to: qboson
        - from: biopharma
          to: qboson
        - from: universities
          to: qboson
        - from: state-capital
          to: qboson
        - from: suppliers
          to: qboson
        - from: licenses
          to: qboson
        - from: clouds
          to: licenses
        - from: state-capital
          to: supercompute
    approximationNotes: 该图展示依赖集中度，不展示所有权比例或合同规模。
    claimRefs:
      - CR021
      - CR023
      - CR025
      - CR026
      - CR040
      - CR044
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议从真实技术与融资动能出发，落到尚未解决的财务和政策问题；这些问题卡住了定价。
    data:
      nodes:
        - id: n1
          label: 产品与部署证明
          detail: 硬件、云和早期商业交付已经可见
          tone: positive
        - id: n2
          label: 融资支持
          detail: A+、A++ 和 CNY1B B 轮融资显示支持方胃口强
          tone: positive
        - id: n3
          label: 收入不透明
          detail: 没有公开收入、毛利率或现金续航期披露
          tone: negative
        - id: n4
          label: 政策 / 供应链风险
          detail: 中国相关量子资本和供应商面临管制风险
          tone: negative
        - id: n5
          label: 公开市场可比公司期权性
          detail: 量子可比公司估值高，但仍波动大、披露负担重
          tone: neutral
        - id: n6
          label: 建议：research-more
          detail: 密切跟踪，但不要领投未披露价格的轮次
          tone: neutral
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: 流程是分析性而非统计性；它概括了建议背后的关键门槛逻辑。
    claimRefs:
      - CV002
      - CV003
      - CV011
      - CV020
      - CV041
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 承销区间中点受披露和商业化证明影响更大，单靠融资标题难以推动。
    data:
      items:
        - label: 当前基准中点
          value: 475
          unit: USDm
        - label: 加入经审计收入 + 毛利率材料
          value: 650
          unit: USDm
        - label: 加入复购客户队列证明
          value: 725
          unit: USDm
        - label: 加入试产线良率 / 吞吐证明
          value: 800
          unit: USDm
        - label: 扣减惩罚性优先权结构
          value: 300
          unit: USDm
        - label: 扣减政策 / 供应商扰动
          value: 225
          unit: USDm
    approximationNotes: 数值是以百万美元计的分析师敏感性标记，不是公司披露估值；每个条形围绕基准情境中点隔离一个门槛变量。
    claimRefs:
      - CV015
      - CV016
      - CV043
      - CV048
      - CV049
      - CV050
      - CV054
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持宽口径承销区间，而不是 Bose Quantum 的单一公允价值。
    data:
      items:
        - label: 牛市情境
          low: 800
          high: 1200
          unit: USDm
          notes: 需要披露收入规模、复购客户和工厂证明。
        - label: 基准情境
          low: 350
          high: 600
          unit: USDm
          notes: 假设技术继续推进，但不透明度持续，且还需要再融资一步。
        - label: 熊市情境
          low: 100
          high: 250
          unit: USDm
          notes: 假设桥接融资 / 降价轮动态或政策扰动。
    approximationNotes: 情境区间是基于里程碑的承销估计，不应误认为公司披露估值。
    claimRefs:
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Bose Quantum 在动能上得分高，在金融级证据上得分低，因此结论仍是 research-more。
    data:
      items:
        - label: 技术 / 产品证明
          value: 7
        - label: 商业牵引质量
          value: 5
        - label: 融资支持
          value: 8
        - label: 收入透明度
          value: 2
        - label: 制造准备度
          value: 4
        - label: 政策 / 供应链韧性
          value: 3
        - label: 估值可分析性
          value: 2
    approximationNotes: 分数是 1-10 的分析师判断，只基于保留的公开证据；不是公司报告的 KPI。
    claimRefs:
      - CV002
      - CV003
      - CV009
      - CV011
      - CV014
      - CV020
      - CV047
