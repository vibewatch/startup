    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与阶段
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum，英文也使用 Boson Quantum Technology 或 QBoson 品牌，是一家北京私营光子量子计算公司，现行法定名称为 Beijing Boson Quantum
              Technology Co., Ltd.，公司类型为非上市股份有限公司。登记记录和官网把公司定位在北京市朝阳区，成立日期为
              2020-11-16，经营地址在万红西街。业务模式不是纯软件栈：公司称自己是全栈光子量子平台提供商，覆盖专用量子计算硬件、云端访问、开发工具，以及面向企业和科研负载的应用部署。公开证据支持的当前阶段，是一家处于
              B 轮、正在扩张的私营硬件公司，而不是成熟商业运营商。最强公开来源确认了激进的技术和制造野心，但没有披露经审计收入、经常性软件经济性或干净的投后估值，因此这些指标仍是明确的尽调缺口，而不是事实。
