      - number: '3.2'
        title: 既有厂商、云中介与替代路径
        blocks:
          - type: paragraph
            body: >-
              Bose 面临的更难竞争压力，可能来自光子之外。IBM、D-Wave、IonQ、Quantinuum 和 Rigetti 都已经把硬件、云端访问、开发者工具或商业化证明的某种组合，变成公开采购界面。IBM
              发布免费、按量付费、项目制、高级和本地计划，并用 300 多成员网络强化这些方案。D-Wave 把退火和混合求解器包进云服务，宣称可用性，并在公开年报中展示真实收入。IonQ 强调与所有主流云和 SDK
              集成，Quantinuum 则依靠保真度领先和 BMW、bp、SoftBank、Synopsys 等企业案例。Rigetti 的芯片到云叙事和可销售的 Novera
              开发硬件展示了另一种既有厂商模式：让平台更容易试用、更容易教学，也更容易插入现有工作流。云中介会加深挑战。AWS Braket 和 Azure Quantum
              让买方在同一界面比较不同硬件家族，使实验常态化，也削弱单一厂商锁定故事。NVIDIA 和 LightSolver 进一步扩大替代集合，主张部分优化或混合负载可以由加速经典系统或模拟系统赢下，而不必依赖纯量子硬件。
