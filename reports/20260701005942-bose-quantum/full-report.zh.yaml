        title: 市场进入动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Bose 的公开 GTM 动作更像分层漏斗，而不是纯自上而下的资本设备销售。公司通过竞赛、社区参与、开放文档和 GitHub
              示例吸引开发者，再用云端真机访问和额度激励降低试用摩擦。与此同时，三个垂直解决方案页面都把潜在客户导向咨询，这意味着有意义的变现很可能来自企业项目、试点或谈判合同，而不是标准自助结账。现有公开证据足以展示渠道形状，但不足以量化渠道经济性。我们没有看到披露的
              CAC、回收期、NRR、胜率、市场转化率，或与 China Mobile 的收入分成条款。这意味着，可见的开发者和合作伙伴界面更适合作为管道代理指标，而不是收入质量证明。投资人应把社区、云端 beta 和咨询
              CTA 视为严肃商业包装的证据，而不是 Bose 已经解决销售效率的证据。
