    rows:
      - - Bose Quantum 硬件 + SDK
        - 保留的 Bose 产品或 SDK 页面未找到公开标价
        - 未知；可能采用报价制硬件和服务合同
        - 专用光子硬件、经由 China Mobile 的云端触达、Kaiwu SDK
        - 无公开单位定价、最低合同额或付费客户转化数据
        - 外部买方更难对标总成本或采购速度
      - - IBM Quantum Open / PAYG / Flex / Premium / On-Prem 套餐
        - 免费 Open Plan；PAYG 每分钟 $96；Flex 起步为 400 分钟/年、每分钟 $72；Premium 起步为 5200 分钟/年、每分钟 $48；本地部署按报价
        - 免费试用、按秒计费、年度预购、年度订阅或专用系统
        - 托管运行时访问、平台工具、支持和可选网络会员资格
        - 达到有意义规模仍需要高价支出和合同
        - IBM 为企业级量子打包树立透明度标杆
      - - D-Wave Leap
        - 公开服务打包、可用性和访问模式；保留页面无简单分钟费率表
        - 通过云服务访问 QPU 和混合求解器
        - 实时访问、生产级可靠性和优化工作流
        - 保留页面上的定价细节不如 IBM 或 Azure 文档明确
        - 由于服务和可用性主张公开，商业评估仍比 Bose 容易
      - - Amazon Braket
        - 按 shot 加按任务或按小时预约的定价公开
        - 覆盖多种 QPU 和模拟器的用量制经纪模式
        - 通过 Braket Direct 提供一致开发工具、混合工作流和专用预约
        - 具体按 shot 价格因服务商和硬件类型而异
        - 降低在厂商和技术路线之间切换实验的成本
      - - Azure Quantum marketplace 市场
        - 市场和文档披露伙伴自定义套餐与定价结构
        - 在同一经纪入口内提供按服务商划分的订阅、按量付费、token 或运行时计费
        - 访问 IonQ、Quantinuum、Rigetti 和 Pasqal 产品
        - 实际价格取决于服务商、workspace 和 Azure 基础设施费用
        - 形成并排对标，而 Bose 尚未公开提供同等透明度
      - - Quandela Cloud
        - 灵活定价选项公开，但保留页面没有简单通用价目表
        - 从小实验到企业使用的预约服务和平台访问
        - QPU 访问、GPU 增强仿真、SDK/API 和伙伴托管选项
        - 已审公开页面未保留具体费率表
        - 访问模式比 Bose 更透明，但标准化程度不如 IBM 或 Azure
      - - 通过 Azure 使用 Quantinuum
        - Standard 计划：每月 $125,000；Premium 计划：每月 $175,000
