      - number: '7.4'
        title: 缓释准备、监测与退出标准
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum
              确实有实质缓释因素：技术型创始团队、很高的研发人员占比、近期资本，以及足够公开证据证明它不是纸面公司。但这些缓释因素没有补上最大的投资判断缺口。公司仍需要拿出私下证据，覆盖出口管制分类、供应商集中度、工厂良率和在线率、收入结构、续约，以及客户集中度。因此，正确的投资人姿态是有条件推进，而不是悲观否决。如果管理层能证明试验线按计划推进、云或硬件在线率有记录、合规人员配置可信，且至少少数客户在政策相关锚点之外续约或扩容，风险堆栈就更可控。如果这些材料不存在，今天让
              Bose Quantum 显得有野心的同一组事实——工厂扩产、国家相关动能和专用硬件——就会变成放慢甚至退出的理由。否决标准应盯住延期、集中度和融资依赖，而不只看量子比特标题。
