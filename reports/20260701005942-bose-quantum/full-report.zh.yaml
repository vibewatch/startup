        - 延期两个季度，或到下一轮融资时仍没有良率 / 正常运行时间 / 质保材料包
        - 下调扩张假设，把制造扩张视为资本消耗，而非护城河形成。
      - - 客户集中度风险
        - 收入结构仍未披露，或集中在少数机构 / 单一垂直领域
        - 最大垂直领域收入占比超过 40%，或前三大客户超过 60% 且无续约证据
        - 下调商业化信心，并要求集中度契约或里程碑式出资。
      - - 合作伙伴平台依赖
        - 云分发路径丧失或重新定价
        - 失去主要合作伙伴云渠道，或平台经济性发生重大不利变化
        - 重做增长模型，并要求提供直销或本地化替代路径的证据。
      - - 资本强度风险
        - 收入耐久性得到证明前，又进入下一轮融资周期
        - 本轮交割后资金续航少于 24 个月，或单位经济性没有改善路径
        - 在耐久性得到证明前，不要按规模化收入倍数给公司定价。
      - - 运营证明缺口
        - 未出现独立正常运行时间、可靠性或基准测试证据
        - 没有第三方运营材料包、没有事故历史，也没有能证明生产耐久性的客户推荐
        - 将业务视为尚未证明的基础设施，建议维持在继续研究 / 回避区间。
    notes: 这些触发器旨在尽调或下一次刷新周期中可监控；每一项都把叙事风险转成具体决策阈值。
    claimRefs:
      - CR038
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 取值
      - 当前落点原因
    rows:
      - - 建议
        - 继续研究
        - 技术和融资证据足以保持跟进，但价格和财务披露不足以投入资本。
      - - 置信度
        - 中
        - 公开证据方向一致，但重大承销字段仍未披露。
      - - 风险评级
        - 高
        - 商业化、政策和融资不透明都很关键，而且彼此叠加，而不是相互分散。
      - - 估值立场
        - unknown
        - 公开信息没有投后估值或条款清单；任何激进加价都需要私下收入和续约证据支撑。
      - - 决策含义
        - 数据室证据到位前，不担任领投或定价角色
        - 继续跟踪公司，但在承销轮次前必须看到硬尽调证据。
    notes: 判断字段对价格敏感，因此刻意保守；保留下来的公开证据缺少估值条款和经审计的经营经济性。
