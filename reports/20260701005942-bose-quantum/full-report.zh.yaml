      - number: '8.3'
        title: 公开与私有可比样本
        blocks:
          - type: paragraph
            body: >-
              可比样本有信息量，但也危险。公开纯量子标的目前以异常高的市值 / 收入倍数交易：按最新可取得年度收入计算，IonQ 约 152.9x，D-Wave 约 361.0x，Rigetti 约
              904.2x，Quantum Computing Inc. 约 3211.1x。这些数字说明市场愿意为量子期权价值出钱，但不能证明 Bose Quantum
              应该得到同等待遇；恰恰相反，它们显示整个品类仍高度投机。私有样本同样跨度很大。Quantinuum 在 2025 年披露，以 $600 million 融资对应 $10 billion 投前估值；ORCA
              更早的光子 Series A 只有 $15 million。因此，Bose
              位于很不一样的可比坐标之间：比早期光子创业公司更有规模、融资更充足，但披露远不如公开纯量子公司，成熟度也远低于融资最足的私有龙头。可比公司只能提供框架，不能直接给出定价答案。
