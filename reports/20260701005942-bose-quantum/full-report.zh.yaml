      - number: '7.3'
        title: 合作伙伴、客户与模式脆弱性
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum 的客户风险已经可信到必须重视，但公开面仍窄到令人担心。最强的公开证明来自合作伙伴云、超算部署和少数机构背书，而不是披露了大量续约的企业账户。Jiemian
              的报道是关键反向视角：早期客户往往是超算中心，因为它们有公共资金、商业风险低；云端访问则通过 China Mobile、Alibaba Cloud 和 Huawei
              Cloud，以按次付费方式运行。这个分发模式可能帮助采用，但也意味着客户访问、认证和工作流控制有一部分留在合作伙伴基础设施里。披露出来的用户结构也偏集中，生物医药占比明显，大学仍在剩余部分中可见。财务模型风险直接来自这幅商业图景。收入、续约和大客户暴露都未披露，而公开量子同行即便披露更成熟，仍报告亏损、资本需求和客户集中。商业化因此是最大的剩余风险，而不是次要问题。
