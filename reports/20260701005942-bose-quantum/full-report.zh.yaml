  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum 的相关市场是量子计算系统和服务，不是整个量子技术大伞。Bose 自身产品材料和 China Mobile 发布报道描述的栈，包含专用光子硬件、云端运行时访问、Kaiwu
              开发者工具，以及面向应用的支持。QED-C 和 USCC
              通过清晰区分量子计算、量子通信和量子传感，帮助界定这一市场。因此，纳入的支出池是硬件系统、云端或托管访问、工作流工具，以及面向仿真或优化问题的项目制应用工作。被排除或仅相邻的支出池包括通用半导体支出、广义 AI
              基础设施、量子网络和传感预算，除非买方明确在资助混合量子工作流。这个区分很关键，因为 Bose 并不是在和所有企业计算竞争。它是在一组更窄的任务上，与经典 HPC、AI
              模型和启发式优化工具竞争；这些任务的买方相信，光子量子最终可能在速度、搜索广度或仿真保真度上跑赢既有方法。
            claimRefs:
              - CM001
              - CM002
