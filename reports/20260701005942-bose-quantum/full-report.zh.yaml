            body: >-
              远期资本充足性是 Bose 的关键财务问题，公开证据只能部分回答。我们知道的是，公司反复融资，并把资金用于硬件研发、芯片工艺能力、工厂建设和生态扩张。仅 2026 年 B
              轮就资助了芯片中试线和工厂扩产；登记数据还显示，2026 年 6 月公司改制为股份公司，注册资本增至 RMB 3.6
              亿。我们不知道的是，资产负债表能否在不继续融资的情况下支撑下一阶段：公开来源没有披露现金、烧钱速度、跑道期、债务工具或项目融资承诺。D-Wave
              的公开文件在这里是有用的行业基准：即便更商业化的量子玩家，相对于收入仍需要非常大的现金头寸。因此，Bose
              的公开案例支持“商业化认真，但还不能靠公开信息承销”。正确的尽调姿态，是索要私有运营数据，而不是只从融资头条或工厂里程碑外推信心。
