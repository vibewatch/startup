      - number: '4.3'
        title: 成本结构、单位经济性输入与资本强度
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一家承担真实硬件和服务义务的公司。登记文件显示制造和云设备活动，关于页面则指向多个实验室和一座深圳工厂。产品材料补上了财务上重要的运营细节：日可用性目标、MTBF、MTTR、智能自检和功耗。这些指标意味着质保、现场服务、可用性工程和能源成本——正是让这门生意在结构上不同于纯软件公司的成本项。相比低温系统，Bose
              的室温光子定位应当降低冷却和部署负担，但公司没有公布毛利率或服务利润率，因此这一好处无法转化为对单位经济性的信心。资本强度最强的独立确认，来自融资用途：芯片工艺能力、中试线建设、工厂扩张和生态建设。这是靠制造规模推进商业化，不是靠轻量软件铺开；这一区别是承销判断的核心。
