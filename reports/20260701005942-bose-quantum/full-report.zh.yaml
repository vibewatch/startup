      - number: '1.3'
        title: 融资历史、投资人与资本信号
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum 自成立以来多次融资，TMTPost 将 2024 年末的 A+ 延伸轮描述为公司成立后的第七次融资事件。公开记录对已命名轮次最清楚，对完整累计股权表则没有同等透明度。2023 年 A
              轮超过 RMB 1 亿，并与 China Mobile 和清华系资本相关。北京政府背景基金领投 2024 年 A+ 融资；2025 年 10 月 A++ 轮引入新一批战略和财务投资人，金额达数亿元人民币；2026
              年 3 月 B 轮达到 CNY 10 亿（约 USD 1.45 亿），财团由国资背景或机构关联投资人主导。模式比精确累计融资额更重要：Bose Quantum
              正被当作国家战略型深科技制造商融资，而不是轻资本软件创业公司。即便如此，公开来源仍没有完整披露轮次条款、清算优先权、老股转让、债务或精确持股比例，因此除头部融资额之外的资本充足性仍需要直接尽调。
