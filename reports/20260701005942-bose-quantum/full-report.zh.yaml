      - number: '8.2'
        title: 融资背景、定价纪律与证据边界
        blocks:
          - type: paragraph
            body: >-
              融资故事是档案里最清晰的利多事实，也是最需要保持纪律的理由。Bose Quantum 披露了 2024 年 A+ 轮、2025 年后续 A++ / A+ 轮第二阶段，以及 2026 年 3 月 CNY 1
              billion 的 B 轮。B
              轮规模足够大，投资人名单也强，但所有已保留公开来源都没有给出投资人真正需要的条款：没有披露投后估值，没有证券类型细节，没有清算顺位，也没有把融资规模与经营经济性接起来的公开桥梁。这一点很关键，因为公司把资本投向芯片试验线、深圳制造扩张和技术放大，而公开来源尚未证明收入质量可以重复。换句话说，Bose
              Quantum 在透明经济性出现之前，先为工业产能融资。这可能造出超额赢家，也可能留下稀释和优先权包袱，而公开文章看不见这些。任何投资判断都应把披露融资规模视为支持证据，而不是价格公允的证据。
