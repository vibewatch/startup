        - 通过 Azure Quantum 访问 H2 硬件和模拟器
        - 需支付基础设施费用，工作负载成本仍取决于操作次数
        - 展示既有厂商如何公开变现高端企业访问，而不是完全靠不透明报价
    notes: 各行对比买方实际能查看的公开套餐和采购界面。有些方案披露精确费率，有些只披露结构或灵活性；这种差异本身就具有竞争意义。
