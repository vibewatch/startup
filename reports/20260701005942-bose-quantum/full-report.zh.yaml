      - 核心假设
      - 示例价值区间（USD）
      - 概率信号
      - 下行 / 上行驱动因素
    rows:
      - - 牛市
        - 重复客户、披露收入规模、试点线证明，以及可控政策摩擦
        - $0.8B-$1.2B
        - 需要从战略性证明硬转为商业证明
        - 上行来自稀缺光子量子期权与已披露经济性相匹配
      - - 基准
        - 技术进展继续，但商业化仍以试点为主，下一轮融资仍依赖叙事加战略资本
        - $0.35B-$0.6B
        - 与当前公开证据最一致
        - 价值受收入、条款和续约质量不透明拖累
      - - 熊市
        - 工厂扩张快过需求、政策摩擦恶化，或下一笔资本以过桥 / 降估值轮形式到来
        - $0.1B-$0.25B
        - 如果下一轮融资周期启动时仍没有运营证明，这一情景更可能发生
        - 下行由惩罚性条款、优先权堆栈扩大和重复需求疲弱驱动
    notes: 情景区间是分析师假设，不是已报道估值；用途是在明确披露和商业化条件下框定价格纪律。
