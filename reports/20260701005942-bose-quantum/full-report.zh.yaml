      - number: '8.5'
        title: 退出准备度、论点失效触发因素与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum
              还没有公开退出准备度。已保留档案中没有任何信息表明公司具备经审计的公众公司准备度、公开收入透明度，或近期上市安排。更可能的退出是卖给更大的计算、工业或国家相关平台；后续私募融资或资本重组；或者在制造和客户证明改善后，走一条周期很长、逐步扩大披露的路径。这让尽调纪律更重要。论点不应只因量子比特新闻而成立或破裂，而应看决定生存能力的经营事实：可重复付费客户、可信的工厂良率和产出，以及不会把新股权压在隐藏优先权之下的融资条款。给本轮定价之前，投资人应要求经审计收入和毛利率、客户续约分组、股权结构表和分配瀑布细节、制造良率指标，以及可信的出口管制和供应商地图。如果管理层拿不出这些材料，正确动作是继续跟踪，而不是强行给出公开记录无法支撑的精确数字。
