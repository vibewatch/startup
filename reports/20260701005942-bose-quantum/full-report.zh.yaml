      - number: '1.2'
        title: 创始人、管理层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开的领导层叙事高度围绕创始人兼 CEO Wen Kai 博士。英文行业报道、公司网站和学术记录都指向他的 Stanford 博士背景、Google 量子业务经历，以及早期参与相干 Ising
              机研究。官方团队页还把 COO Ma Yin、CTO Wei Hai 和首席科学家 Wang Chuan 列为推动产品化的核心高管。登记类来源增加了一层薄但有用的治理信息：Aiqicha 将 Ma Yin
              标为副董事长，并列出 Li Huiling、Jiang Peixing、Ruan Dong 和 Wang Dan
              在财务或董事岗位任职。这足以说明公司已经不只是单一创始人叙事，但还不足以核实独立董事会监督、股东控制、董事会委员会或决策权。关键人物集中度因此仍然重要：技术故事、外部品牌和投资人信号仍都经过 Wen Kai
              和创始技术团队传导。
