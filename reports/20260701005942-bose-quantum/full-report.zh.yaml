  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 何种情况会改变判断
    rows:
      - - 正方
        - Bose Quantum 显然正在商业化真实的光子量子产品触面，而不只是发表研究。
        - 如果产品主张不再转化为部署或客户案例，证明面会迅速变弱。
      - - 正方
        - 2024-2026 年融资节奏显示，投资者反复有胃口，资本也足以建设制造能力。
        - 如果下一轮规模小、仅由内部人出资，或结构上惩罚性强，今天的融资叙事支撑力会下降。
      - - 正方
        - 早期销售、云端使用和专用定位，给出一条比通用量子路线图更早实现效用的可行路径。
        - 如果这些早期部署不能转化为重复付费项目，专用捷径的价值会下降。
      - - 反方
        - 收入、利润率和资金续航期仍未披露，投资者无法判断采用是真实需求，还是战略性试点活动。
        - 经审计收入、客户分群和毛利率证据会显著提高置信度。
      - - 反方
        - 公开融资文章披露了募资金额，但没有披露投后估值、证券类型或优先权条款。
        - 完整股权结构表和条款清单，可把估值立场从未知转为可分析。
      - - 反方
        - 跨境政策和出口管制不确定性提高了供应商和部分外国资本池的风险。
        - 可信的出口管制备忘录和供应商图谱会降低政策折价。
    notes: 行把可投资优势与最可能改变建议和定价纪律的证据缺口拆开。
    claimRefs:
