  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 室温光子硬件足以让 Bose 差异化
        - ORCA 和 Quandela 也在营销室温或轻数据中心光子部署，Xanadu/PsiQuantum 仍保持光子规模化叙事
        - 高
        - 要求证明买方选择 Bose 不只是因为技术路线，例如赢单 / 输单记录、续约行为或垂直领域特定性能数据
      - - China Mobile 集成创造持久渠道锁定
        - AWS、Azure、IBM 和 D-Wave 在其他市场把云中介实验和多厂商并用变成常态
        - 高
        - 要求 Bose 按国内战略客户与云试用用户拆分管线，并询问是否已有非中国云渠道上线
      - - 不透明定价有助于守住利润率
        - 当 IBM、Azure 和 AWS 发布清晰访问结构时，不透明定价反而会拖慢采购
        - 中
        - 询问实际合同类型、最低交易规模，以及硬件销售、云访问和联合开发工作的定价是否不同
      - - 本土政策契合是纯粹的信任优势
        - USCC 和 MIT 指出，这种在中国有帮助的国家关联姿态，也会让海外信任、出口和采购认知复杂化
        - 高
        - 要求出口管制评审、海外合规文件，以及中国以外任何公共部门采购限制
      - - 早期市场不成熟能保护领先者免受竞争
        - QED-C 和 D-Wave 显示市场确有牵引力，但供应链仍脆弱、人才短缺、销售周期长，所有玩家都可能受罚
        - 高
        - 压测烧钱速度、制造韧性和从试点到付费生产的转化，不要假设品类增长会消化执行风险
      - - 优化工作负载天然属于量子厂商
        - NVIDIA 和 LightSolver 说明，AI 超级计算机和模拟光学加速器不需要完整量子栈，也能吃到同一预算线
        - 高
        - 在认定护城河前，把每个 Bose 用例映射到真实的经典、模拟和退火替代方案
      - - 光子同业还太早，商业上无关紧要
        - Quandela 已展示活跃云用户和交付时间线，ORCA 和 PsiQuantum 也在搭建企业应用叙事
        - 中
        - 按季度跟踪同业客户披露、伙伴数量和部署路径，检验 Bose 是领先者，还是只是拥挤光子队列中的一员
    notes: 严重性评级是基于保留公开证据的分析师判断。登记表关注的是：当买方比较访问模式、信任界面和替代方案，而不只看量子比特标题时，Bose 能否守住差异化。
