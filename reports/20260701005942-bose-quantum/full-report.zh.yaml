            title: 市场确实在形成，但还不是大规模采用
            body: 最强证据支持真实的买方形成过程和可衡量收入基础，但当前生产部署仍然少见，投资人应把市场视为新兴阶段，而不是常态化阶段。
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
