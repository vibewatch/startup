      - number: '3.3'
        title: 定价、分销与转换成本
        blocks:
          - type: paragraph
            body: >-
              定价透明度是 Bose 最明显落后于公开基准的地方之一。Bose 的产品和 SDK 界面展示硬件类别和工具，但不展示标价、消耗定价、最低合同额或任何已披露的付费客户单位经济性。相比之下，IBM
              发布按分钟计费的方案，AWS Braket 解释 shot、task 和 reservation 计费，Azure Quantum 则展示 IonQ、Quantinuum、Rigetti 和 Pasqal
              的合作伙伴专属方案。Quandela
              也没有完整发布一张简单价目卡，但至少宣传灵活定价、预约服务和活跃云端使用。这种不对称很重要，因为买方不会只按架构做量子决策；他们比较的是访问模式、预算科目、采购摩擦、集成路径和可逆性。多平台并用越来越正常。买方可以用
              AWS 或 Azure 测试多种模态，和 IBM 或 D-Wave 使用更成熟的托管访问，也可以停留在 NVIDIA 或 LightSolver
              等替代栈上，同时继续评估量子。因此，转换成本看起来是中等，而不是绝对。只有当团队投入特定工作流工具、主权或本地部署，或长期企业项目时，转换成本才会升高。Bose
              仍可能在中国胜出，因为渠道信任和本地对齐更重要；但离开这一语境后，不透明定价和较窄的公开分销证明会削弱锁定能力。
