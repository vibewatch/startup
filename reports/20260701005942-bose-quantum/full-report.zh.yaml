  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价界面
        blocks:
          - type: paragraph
            body: >-
              Bose 的商业界面比一份简单硬件手册更宽。公司公开展示的栈，从竞赛和开发者社区开始，经由 Kaiwu SDK 工具和云端验证，最终落到实体量子计算机部署。China Mobile 的 Hengshan
              平台提供了一个特别有用的线索：注册后，用户可以在控制台订购真机算力服务，这让云端或按任务计费的收入路径变得可见，尽管 Bose 没有公布费率表。与此同时，Bose 自身页面没有展示硬件标价、按 shot
              或按分钟计费标准，也没有最低合同信息。这迫使投资人用 IBM、AWS Braket 和 Azure Quantum
              的透明同业产品来校准潜在买方预期。因此，证据支持一种混合收入模式——大报价硬件、使用驱动的云端访问、咨询式垂直解决方案工作——但无法清晰看见收入结构、实际定价、折扣或确认政策。公开定价不透明是真正的尽调问题，因为同业已经让量子访问采购清晰得多。
