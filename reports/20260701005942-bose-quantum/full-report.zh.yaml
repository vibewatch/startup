      - number: '2.3'
        title: 买方、用户和付款方分层；采用路径
        blocks:
          - type: paragraph
            body: >-
              公开来源中的买方故事，在科研和战略创新预算边缘最清楚，而不是在大众企业 IT 里最清楚。Bose 和 China Mobile 把今天的服务模式定位为云优先访问，面向科研用户、政府和企业团队，以及希望先通过
              SDK 工具提交任务、再决定是否重部署的开发者。同业光子厂商也指向类似模式：用例集中在制药、化工、材料、金融、物流、能源和网络安全，而企业基准研究突出金融和汽车领域已经投入资源做量子实验的领先者。IQM 2026
              年研究解释了为什么 Bose 短期买方很可能是成熟机构：89% 的受访者已经在动手实践，但只有 3%
              达到规模化部署；预期使用混合或部分本地访问的买方，多于只使用公有云的买方。实践中，买方旅程仍是顺序推进，而不是一蹴而就。团队先学习，测试云端或混合工作流，共同开发商业用例，与现有系统集成，然后才考虑专用容量或重复生产采购。这个阶段式路径支持
              Bose 的 SDK 加云切入点，但也意味着从生态使用转化为经常性付费收入，在公开来源中仍未被证明。
