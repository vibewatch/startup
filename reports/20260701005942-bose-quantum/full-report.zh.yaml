  - id: TV005
    title: 推翻投资论点与终止触发因素表
    columns:
      - 触发因素
      - 可观察阈值
      - 对投资判断的传导
      - 行动含义
    rows:
      - - 无重复付费客户
        - 管理层无法拿出战略试点之外的续约或扩张证据
        - 早期商业化判断失效，部署从收入证明降级成验证秀
        - 不为新一轮定价；退回仅跟踪
      - - 工厂有产出但缺少良率证明
        - 深圳扩建继续推进，但不披露良率、缺陷率或单位产出指标
        - 扩产变成资本消耗，而非护城河扩张
        - 加制造风险折价，或直接放弃
      - - 惩罚性融资条款
        - 下一轮依赖内部过桥资金、高优先级清算权或结构性保护工具
        - 现有融资背书对普通股价值的解释力下降
        - 按清算条款重新承销，而不是看名义估值
      - - 出口管制 / 供应商中断
        - 关键组件或跨境流程出现许可或采购摩擦
        - 执行风险上升，商业化周期可能被拉长
        - 缓释措施被证明前，将估值压到区间低端
      - - 叙事跑在经济性前面
        - 持续发布量子比特或 AI 消息，但收入披露、客户 cohort 和毛利率仍缺位
        - 表明公司仍在证据之前先卖故事
        - 维持 research-more，不接受只靠营销做价格发现
    notes: 终止触发因素关注的是存活能力及其如何传导到承销判断，而不只是技术头条里程碑。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV020
      - CV053
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 融资条款
        - 投后估值、股权类别、清算顺位，以及任何棘轮条款或高优先级保护
        - 没有条款，就无法建模回报或下行。
        - 向 CFO / 法律顾问索取董事会批准的融资文件和 cap table。
      - - 收入质量
        - 经审计收入、毛利率、订单积压和现金消耗
        - 收入质量决定公司是在用资金放大增长，还是在补贴概念验证亏损。
        - 审阅经审计财报和管理账。
      - - 客户 cohort
        - 付费客户数量、续约 / 扩张历史，以及按账户计算的集中度
        - 区分试点和可投资收入引擎，最干净的证据就在这里。
        - 查看 cohort 表和大客户明细。
      - - 制造准备度
        - 试点产线良率、单位产出、缺陷率和 capex 路线图
        - 没有这些数字，工厂扩张只是资本故事。
        - 现场走访，并从 CTO / 制造负责人取得运营资料包。
      - - 政策与供应链
        - 出口管制备忘录、供应商地图和国产替代计划
        - 跨境摩擦可能同时改写时间线和融资范围。
        - 独立贸易律师审查，并访谈供应商。
      - - 治理与退出
        - 董事会权利、关联方风险、审计成熟度和长期退出规划
        - 即使技术跑通，不透明治理也可能抹掉价值。
        - 审阅董事会材料、治理文件和审计准备计划。
    notes: 这些问题是把叙事正面的公司变成可定价投资案例前，至少需要拿到的资料包。
    claimRefs:
      - CV015
      - CV016
      - CV051
      - CV052
      - CV054
