      - number: '2.2'
        title: 受证据约束的规模测算与相互矛盾的市场视角
        blocks:
          - type: paragraph
            body: >-
              公开来源支持市场分析，但不支持把 TAM 简化成一条线。QED-C 给出最干净的当前变现视角：2025 年量子技术市场为 $1.9B，其中计算板块为 $1.4B，并将在 2028 年扩大到 $3B
              以上。McKinsey 提供另一种视角：已有 300 多家组织在与量子厂商合作，2025 年投资额飙升至 $12.6B。Post-Quantum 对 McKinsey 的总结把时间拉得更长，认为 2035
              年内部量子技术市场大约为 $60B 至 $100B，其中量子计算贡献 $43B 至 $71B。这些数字不能直接相加，因为它们混合了当前收入、未来厂商市场预测和更广的经济价值池。对 Bose
              来说，稳妥结论是：当前已变现需求的绝对规模仍小，但买方形成、资本形成和战略政策信号已经足以支撑一场真实的商业化竞赛。因此，最诚实的规模框架是受证据约束，而不是强行堆出 TAM-SAM-SOM。
