        blocks:
          - type: paragraph
            body: >-
              运营风险高，因为 Bose Quantum
              正在把仍未成熟的架构推向工业化。独立报道和公司材料都指向同一件事：公司用新融资扩建深圳工厂、搭建量子芯片试验线、提升可靠性；但这些材料没有给出良率、在线率或质保数据，无法证明转产已经受控。学术和行业证据也提醒谨慎。coherent-Ising
              与光子计算文献表明，混合模拟-数字控制、光子集成电路、探测器、开关和其他光学层不是可互换的细节；每一层都是独立瓶颈，都可能卡住可制造性或性能。更广的供应链研究又加了一层风险：本土化确有进展，但还没补齐，专用矿物和零部件链条仍容易受地缘政治扰动。简言之，Bose
              Quantum 现在背着典型的「先建工厂、后证需求」风险：硬件野心更大、供应链变量更多，而公开证据仍不足以证明放大后的产品可靠到能支撑持久利润率。
