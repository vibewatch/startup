            body: >-
              理解 Bose Quantum 的法律风险，最干净的切口不是已知诉讼，而是监管边界正在外扩。已保留的一手和法律来源显示，美国对外投资规则已明确覆盖与中国相关的量子活动；围绕先进计算出口的 BIS
