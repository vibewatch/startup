  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >-
              Bose 的公开产品界面不止一台单用途机器。审阅过的官方页面显示，一套栈先从专用 100、550 和 1000 量子比特光子系统开始，再叠加云端访问、Kaiwu SDK 工具、面向 PyTorch
              的插件、开发者激励和垂直解决方案模板。按工作流看，客户购买的不是抽象的“量子”，而是一条路径：表达优化或能量型学习问题，把问题路由进 Bose 的相干光子系统，并在
              AI、生物医药和城市级场景中复用这条路径。因此，最强的产品定义信号是架构宽度，而不是无所不能。Bose 明确表示，其系统专门围绕 Ising 或 QUBO 式负载，软件栈则用来让现有 Python
              用户保持生产力。这形成了连贯的产品故事，但也意味着差异化取决于这些相互连接的模块在生产中有多好用，而不只取决于量子比特头条。
