              公开信任界面明显弱于公开产品界面。Bose 确实发布硬件可靠性目标，提到 China Academy of Information and Communications Technology
              验证，并在云端界面宣传企业级安全和数据隔离。但本章审阅的材料没有找到通常会让买方更容易承销这些主张的信任资料：没有保留下来的公开信任中心，没有明显的隐私或安全架构说明，没有公开证书页面，也没有可见的事故档案或状态历史。独立报道也提供了有用反向权重。Jiemian
