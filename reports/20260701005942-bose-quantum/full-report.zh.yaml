      - number: '5.3'
        title: 差异化、研究谱系与制造
        blocks:
          - type: paragraph
            body: >-
              Bose 的差异化案例有三层。第一是模态选择：室温光子相干 Ising 硬件，瞄准优化式负载，而不是通用量子计算。第二是工具选择：面向
              PyTorch、由示例驱动的界面，意在让开发者从熟悉工作流迁移到量子支持的采样或优化。第三是制造选择：比许多同业更早从实验室原型转向深圳工厂和芯片中试线。围绕相干 Ising
              机和脉冲神经网络增强的研究谱系，有助于让架构更容易理解；但公开 IP
              故事仍比公开工作流故事薄得多。同样，制造故事真实到足以重要——多个独立来源提到工厂、芯片线和质量控制功能——但仍缺少良率、吞吐量或出货单元证据。结果是，当前产品壁垒看起来是运营和工程牵引，还没有通过广泛独立基准或披露的单位经济性获得制度化证明。
