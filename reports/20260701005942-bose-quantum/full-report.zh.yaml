      - number: '8.4'
        title: 牛 / 基准 / 熊情景与投资判断区间
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum 不披露收入或估值，因此情景分析应被读作投资判断区间，而不是所谓公允价值。牛情景假设公司把当前战略牵引转化成可重复的企业或政府续约，证明试验线产出和良率，并把 2026
              年融资变成可见商业化，而不只是扩产。在这个世界里，低于 $1.2 billion
              的估值区间可以用私有市场期权价值逻辑来论证。基准情景保守得多：公司继续推进技术和融资，但公开证据仍以试点为主，下一轮融资更依赖故事质量，而不是经审计经济性；这支撑的是数亿美元中段区间，而不是跃上十亿美元。熊情景假设先建工厂、需求未跟上，出口管制摩擦，或下一轮疲弱且条款惩罚性强。沿着这条路径，价值会急剧压缩，普通股风险快速上升。区间的意义不是精确，而是说明定价敏感性主要由披露、重复需求和条款决定。
