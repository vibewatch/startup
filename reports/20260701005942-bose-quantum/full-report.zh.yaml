      - number: '3.4'
        title: 壁垒耐久性、信任姿态与反向证据
        blocks:
          - type: paragraph
            body: >-
              Bose 仍有真实资产。其官方产品页支持室温运行、可编程全连接、面向优化的性能主张，以及与 China Mobile 云生态集成。USCC 和 MIT
              也支持一个判断：中国国家协调的量子建设，可以帮助本土公司获得政策关注、人才和早期基础设施伙伴。但这些政策动态也有两面性。MIT 认为，由于 QPU 多样性，美国在商业化上仍处于领先；USCC
              则用国家战略视角描述中国量子崛起，这可能让跨境信任更复杂。公开证据也不支持对市场成熟度过度自信。QED-C 称整体市场仍只有 $1.9B，供应链脆弱、人才不足；D-Wave
              备案文件显示，即便是行业内更商业化的厂商之一，仍担心销售周期加速和利润率压力。Physics World 又给出更尖锐的反向信号：Baidu 和 Alibaba 都退出了直接量子硬件研究。结论是，Bose
              的壁垒更像有条件成立，而不是默认耐久。它可能在重视中国相关部署的本土战略客户中最强，但容易受到云中介比较、既有厂商生态力量、替代加速器，以及光子主张比客户信任更容易商品化的可能性冲击。
