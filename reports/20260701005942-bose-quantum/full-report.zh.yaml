              同时暴露在边境两侧的监管里：境外投资人和供应商可能遇到尽调或许可摩擦，境内云服务或服务活动仍取决于本地许可和合规运转。国家优先方向是双刃剑。政策支持可以加快补贴、客户和产业协同，但也提高了一个风险：早期增长更像政策塑形，而不是市场已经验证。公开证据仍留下一个关键缺口：已保留来源没有独立排清所有名称变体下的诉讼、制裁或执法暴露。
