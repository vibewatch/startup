      - number: '5.2'
        title: 架构、部署与可靠性
        blocks:
          - type: paragraph
            body: >-
              对一家私营量子创业公司来说，公开运营模型异常具体。Kaiwu 文档展示的开发者路径，从 Python 中的 QUBO 或 Ising 建模开始，经由求解器和优化器模块，再通过在云控制台上传矩阵或从代码调用
              CIMOptimizer 触达真机。Bose 云页面随后补上编排层：统一硬件池、合作伙伴云分发、动态负载均衡和故障切换。硬件端，Bose
              产品页强调室温相干光子运行、全连接、光纤温控和日益自动化的控制系统。这些并不等于独立证明，但足够具体，能看出公司认为运营价值来自哪里：减少低温负担、加强控制器集成，并围绕可用性提高自动化。技术风险在于，这些主张大多仍由公司自己撰写，因此可靠性证据作为架构叙事更强，作为第三方服务保证则弱得多。
