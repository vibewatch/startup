              Bose 比许多深科技创业公司拥有更多公开商业化证明，但大多仍是代理证据。独立报道称深圳工厂已在 2025 年末投产，系统已经交付给 China Mobile 和国家超级计算成都中心等具名机构。China
              Mobile 文章还展示了一项向政府、企业和科研用户开放的云服务。在较软性的牵引端，Bose 声称拥有数千人社区，而 GitHub 和 Kaiwu
              文档证明有真实的开发者上手路径。即便如此，真正决定性的数字指标仍然缺席：没有公开收入、ARR、毛利率、回收期、NRR、积压订单或客户集中度。结果是一个常见的量子投资问题：公司看起来商业活动很活跃，但公开数据无法说明这些活动是否转化为高质量经常性收入。我们可以框定部分技术成本输入，却无法看见足以支撑投资的实际经济性。
