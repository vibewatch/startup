        - 工厂投产和对具名机构的部署
        - 具名部署不披露已售机器小时或装机占用率
        - 要求提供已部署系统利用率、积压订单和维护负载
      - - 现金 / 消耗 / 续航期
        - 无法评估下一轮融资时点
        - 融资新闻和注册资本
        - 已融资金和注册资本不是流动性报表
        - 要求提供现金余额、月度现金消耗、资本开支计划和现金续航期预测
      - - 债务 / 租赁 / 项目融资义务
        - 无法评估隐藏固定费用或约束条款风险
        - 未发现公开披露
        - 沉默不等于零义务
        - 要求提供债务明细、设备租赁和补助或补贴条件
      - - 客户集中度和留存
