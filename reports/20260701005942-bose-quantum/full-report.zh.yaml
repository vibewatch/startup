      - number: '1.5'
        title: 里程碑、商业化与反向背景
        blocks:
          - type: paragraph
            body: >-
              公司时间线显示，它从科研创业公司快速转向制造主张方。Bose Quantum 成立于 2020 年末，2023 年公开发布 100 量子比特相干光子系统，同年晚些时候开通与 China Mobile 相关的
              Hengshan 云平台；2024 年扩展到 550 量子比特机器并完成首个商用光子系统销售；2025 年又把 A++ 轮融资与深圳工厂建设放在一起推进。到 2026 年 3 月至 5 月，公司完成 CNY 10
              亿 B 轮，发布 Yuliang Shanhai 1000 代际，并把自己定位为中国首家大规模专用光子量子制造商。时间线方向很强，但反向背景同样重要。Physics World 记录 Alibaba 和
              Baidu 在 2023-2024 年退出直接量子硬件研究，说明即便资金更充裕的技术平台，中国商业量子市场仍然难做。因此，Bose Quantum
              的里程碑速度值得关注，但还不等于需求已经去风险化，也不等于经济性已经透明。
