  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 最新披露收入或融资锚点
      - 市值 / 估值锚点
      - 隐含倍数或状态
      - Bose 参考意义
      - 主要局限
    rows:
      - - IonQ
        - 上市量子平台
        - $130.0M FY2025 收入
        - $19.88B 市值
        - ~152.9x 收入
        - 展示最高质量的公开市场期权性基准，且有真实规模和现金。
        - 披露、流动性和多元化程度都远高于 Bose Quantum。
      - - D-Wave
        - 上市退火 / 量子系统
        - $24.6M FY2025 收入
        - $8.88B 市值
        - ~361.0x 收入
        - 是仍在变现早期采用的上市量子公司的有用基准。
        - 技术路线和客户结构不同；仍受益于公开市场流动性。
      - - Rigetti
        - 上市超导量子
        - $7.1M FY2025 收入
        - $6.42B 市值
        - ~904.2x 收入
        - 说明即便收入很小，量子期权性也能维持很高估值。
        - 技术路线不同，且现金余额异常大，扭曲了直接比较。
      - - Quantum Computing Inc.
        - 上市光子 / 量子邻近
        - $0.682M FY2025 收入（Stock Analysis）；$0.373M FY2024 10-K 收入
        - $2.19B 市值
        - ~3211.1x 收入
        - 最接近公开市场光子风格情绪标尺，但收入基数很小。
        - 业务组合包括传感和光子学，超出 Bose Quantum 当前画像。
      - - Quantinuum
        - 非上市规模化量子龙头
        - 2025 年 $600M 股权融资
        - 投前估值 $10B
        - 私营后期龙头
        - 规模和声誉强得多时，这一案例给出私营量子公司融资胃口的上沿。
        - 不是中国光量子私营公司的可比样本，运营成熟度也高得多。
      - - ORCA Computing
        - 私营光量子初创公司
        - 2022 年 $15M Series A
        - 仅早期融资
        - 早期光量子参照
        - 可参照早期私营投资人如何给光量子类别投钱。
        - 阶段太早、规模太小，无法直接给 2026 年的 Bose 定价。
    notes: 可比样本组混合了上市纯量子公司和私营参照点，因为没有一个已披露标的能同时匹配 Bose Quantum 的技术路径、地域、披露程度和阶段。
    enumerationScope:
