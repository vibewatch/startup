            title: Named proof is real but still concentrated in institutional and project-style channels
            body: >-
              The strongest retained proofs cluster around China Mobile, Chengdu supercomputing, a single disclosed bank
              procurement, and collaboration-heavy biopharma work. This is enough to show adoption exists, but not
              enough to show a diversified recurring-enterprise base.
