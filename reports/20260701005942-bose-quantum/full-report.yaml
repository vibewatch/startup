  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Investment Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum has enough momentum to deserve diligence, but not enough disclosure to deserve an invest-now
              call. The investable thesis is straightforward: the company is clearly more than a lab project, it has
              assembled multiple rounds of capital in quick succession, it is building around photonic special-purpose
              quantum systems instead of waiting for universal fault tolerance, and it has enough product and deployment
              proof to show that customers and state-linked partners take it seriously. The anti-thesis is just as
              important. Public sources still do not disclose revenue, margins, round terms, or post-money valuation;
              Jiemian’s adverse reporting says revenue remains undisclosed and that early customers are often
              supercomputing centers rather than a broad renewal-heavy enterprise base. Public quantum comparables show
              that investors can pay huge optionality premiums, but those companies also disclose more finance and still
              carry volatile economics. The prudent conclusion is **research-more** with **medium confidence**, **high
              risk**, and a valuation stance that is **unknown on disclosed facts alone** rather than clearly
              attractive.
            claimRefs:
              - CV001
