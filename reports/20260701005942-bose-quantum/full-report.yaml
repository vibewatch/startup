  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Public evidence supports broad underwriting bands rather than a single fair value for Bose Quantum.
    data:
      items:
        - label: Bull case
          low: 800
          high: 1200
          unit: USDm
          notes: Requires disclosed revenue scale, repeat customers, and factory proof.
        - label: Base case
          low: 350
          high: 600
          unit: USDm
          notes: Assumes technical progress but continued opacity and another financing step.
        - label: Bear case
          low: 100
          high: 250
          unit: USDm
          notes: Assumes bridge/down-round dynamics or policy disruption.
    approximationNotes: >-
      Scenario bands are milestone-based underwriting estimates and should not be mistaken for disclosed company
      valuation.
    claimRefs:
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      Bose Quantum scores well on momentum and poorly on finance-grade evidence, which is why the call remains
      research-more.
