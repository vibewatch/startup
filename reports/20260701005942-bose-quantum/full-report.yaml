  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Bose Quantum is quantum computing systems and services, not the whole umbrella of
              quantum technology. Bose's own product materials and China Mobile launch coverage describe a stack that
              includes dedicated photonic hardware, cloud-delivered runtime access, Kaiwu developer tooling, and
              application-facing support. QED-C and USCC help bound that market by clearly separating quantum computing
              from quantum communications and sensing. The included spend pools are therefore hardware systems, cloud or
              managed access, workflow tooling, and project-led application work for simulation or optimization
              problems. Excluded or only adjacent pools include generic semiconductor spend, broad AI infrastructure,
              quantum networking, and sensing budgets unless a buyer is explicitly funding a hybrid quantum workflow.
              That distinction matters because Bose is not competing with all enterprise compute. It is competing with
              classical HPC, AI models, and heuristic optimization tools on a narrower set of jobs where buyers believe
              photonic quantum could eventually outperform incumbent methods on speed, search breadth, or simulation
              fidelity.
            claimRefs:
              - CM001
              - CM002
