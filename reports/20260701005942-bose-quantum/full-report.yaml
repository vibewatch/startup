          - type: callout
            title: Public quantum exuberance is not a valuation answer for Bose
            body: >-
              The public pure-play comps show that investors can pay extraordinary revenue multiples for quantum
              optionality, but they also show how little those prices tell you about fair value for an opaque private
              round.
            calloutType: risk
            claimRefs:
