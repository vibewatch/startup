      - number: '3.2'
        title: Incumbents, Cloud Brokers and Substitute Paths
        blocks:
          - type: paragraph
            body: >-
              The harder competitive pressure on Bose may come from outside photonics. IBM, D-Wave, IonQ, Quantinuum,
              and Rigetti have each turned some combination of hardware, cloud access, developer tooling, or
              commercialization proof into a public procurement surface. IBM posts free, pay-as-you-go, project,
              premium, and on-prem plans, then reinforces them with a 300-plus-member network. D-Wave wraps annealing
              and hybrid solvers inside a cloud service with uptime claims and a public annual report showing real
              revenue. IonQ emphasizes integration with all major clouds and SDKs, while Quantinuum leans on fidelity
              leadership and enterprise case studies from BMW, bp, SoftBank, and Synopsys. Rigetti's chip-to-cloud
              message and sellable Novera development hardware show yet another incumbent pattern: make the platform
              easier to trial, easier to teach, and easier to plug into existing workflows. Cloud brokers deepen the
              challenge. AWS Braket and Azure Quantum let buyers compare hardware families inside one interface, which
              normalizes experimentation and weakens any one-vendor lock-in story. NVIDIA and LightSolver widen the
              substitute set further by arguing that some optimization or hybrid workloads can be won by accelerated
              classical or analog systems instead of pure-play quantum hardware.
