            title: Underwrite Bose as usage-led compute infrastructure until renewals are shown
            body: >-
              The visible monetization surface is task-priced cloud access and task-based bespoke service. That can
              scale, but only if repeated workloads, contract renewals, and multi-department expansion become
              observable. Those are still diligence asks rather than public facts.
