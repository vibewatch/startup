      - number: '6.4'
        title: Expansion loops and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Bose does have plausible expansion loops: community and competition programs can feed cloud trials,
              partner-cloud access can feed named institutional deployments, and bespoke domain projects can feed
              private hardware or broader solution work. The problem is that today’s public evidence still clusters
              around state-linked supercomputing, partner clouds, research-heavy biopharma work, and a small number of
              finance references. Jiemian’s reporting is the clearest cautionary source here: it says supercomputing
              centers are low-risk first customers, that such deployments can be exploratory rather than revenue-led,
              and that repeat-customer economics across the sector remain unclear. Tencent’s founder interview adds a
              second constraint, namely that banks and insurers remain cautious when hard-tech payback is long. The
              result is a customer base that is credible enough to matter, but still concentrated in institutionally
              friendly channels that may validate the technology faster than they validate durable, diversified revenue.
              The missing bridge is revenue mix transparency: none of the retained public sources quantify what share of
              demand comes from cloud subscriptions, supercomputing programs, bespoke banking work, or
              collaboration-heavy science accounts, so top-customer and top-channel dependence remain open underwriting
              questions that still require private diligence before underwriting concentration risk.
