              Bose's public GTM motion looks like a layered funnel rather than a pure top-down capital-equipment motion.
              The company pushes developers through contests, community participation, open documentation, and GitHub
              examples, then uses cloud-based real-machine access and quota incentives to lower trial friction. At the
