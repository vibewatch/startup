  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The midpoint of an underwriting range moves more with disclosure and commercialization proof than with headline
      funding alone.
    data:
      items:
        - label: Base midpoint today
          value: 475
          unit: USDm
        - label: Add audited revenue + gross margin packet
          value: 650
          unit: USDm
        - label: Add repeat-customer cohort proof
          value: 725
          unit: USDm
        - label: Add pilot-line yield / throughput proof
          value: 800
          unit: USDm
        - label: Deduct punitive preference stack
          value: 300
          unit: USDm
        - label: Deduct policy / supplier disruption
          value: 225
          unit: USDm
    approximationNotes: >-
      Values are analyst sensitivity markers in USD millions, not reported company marks; each bar isolates one gating
      variable around the base-case midpoint.
