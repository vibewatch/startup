      - number: '2.2'
        title: Evidence-Constrained Sizing and Contradictory Market Lenses
        blocks:
          - type: paragraph
            body: >-
              Open sources support market analysis, but they do not justify a simplistic single-line TAM. QED-C provides
              the cleanest current monetization lens, placing the 2025 quantum-technology market at $1.9 billion and the
              computing segment at $1.4 billion, with computing scaling above $3 billion by 2028. McKinsey adds a
              different lens: more than 300 organizations are already collaborating with quantum vendors, and investment
              surged to $12.6 billion in 2025. Post-Quantum's summary of McKinsey extends the horizon much further,
              suggesting a 2035 internal quantum-technology market of roughly $60 billion to $100 billion, with quantum
              computing responsible for $43 billion to $71 billion. Those figures are not directly additive because they
              mix current revenue, future vendor-market forecasts, and broader economic value pools. For Bose, the
              defensible conclusion is that current monetized demand is still small in absolute terms, but the buyer
              formation, capital formation, and strategic-policy signals are large enough to justify a real
              commercialization race. The most honest sizing frame is therefore evidence-constrained rather than a
              forced TAM-SAM-SOM stack.
