              - CV050
      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum is not publicly exit-ready. Nothing in the retained file suggests audited public-company
              readiness, public revenue transparency, or a near-term listing setup. The more plausible exits are a
              strategic sale to a larger compute, industrial, or state-linked platform; a later private financing or
              recapitalization; or a very long-duration path toward broader disclosure after manufacturing and customer
              proof improve. That makes diligence discipline even more important. The thesis should break not on qubit
              headlines alone but on the operating facts that determine survivability: repeat paying customers, credible
              factory yield and output, and financing terms that do not subordinate new equity beneath hidden
              preferences. Before putting a price on the round, investors should demand audited revenue and gross
              margin, customer-renewal cohorts, cap-table and waterfall detail, manufacturing-yield metrics, and a
              credible export-control and supplier map. If management cannot produce those packets, the right move is to
              keep tracking rather than force precision that the public record does not support.
            claimRefs:
              - CV051
              - CV052
              - CV053
              - CV054
