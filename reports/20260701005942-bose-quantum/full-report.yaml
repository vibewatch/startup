  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, policy, and compliance stack
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to think about Bose Quantum's legal risk is not as a known lawsuit problem but as a
              growing perimeter problem. The retained primary and legal sources show that U.S. outbound-investment rules
              now explicitly cover China-linked quantum activity and that BIS guidance around advanced-computing exports
              can reach entities headquartered in China even when cross-border structures are more complicated than a
              direct shipment. China adds its own layer through dual-use export-control rules and domestic approvals
              around internet information and telecom-style services. That means Bose Quantum is exposed to regulation
              from both sides of the border: foreign investors and suppliers can face diligence or licensing friction,
              while domestic cloud or service activities still depend on local permissions and compliance operations.
              The state-priority angle cuts both ways. Policy support can accelerate grants, customers, and industrial
              alignment, but it also raises the risk that early traction is more policy-shaped than market-proven.
              Public evidence still leaves one important gap: the retained sources do not independently clear every name
              variant for litigation, sanctions, or enforcement exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
