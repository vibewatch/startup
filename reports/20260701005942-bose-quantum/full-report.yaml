          - type: callout
            title: Developer breadth should not be mistaken for paying-production depth
            body: >-
              Tens of millions of platform calls and a visible open-source or contest ecosystem imply real usage and
              feedback loops, yet none of the retained public sources tie that breadth to renewal, NRR, or per-account
              expansion. Bose appears to have solved awareness better than it has solved disclosure of durability.
            calloutType: insight
            claimRefs:
