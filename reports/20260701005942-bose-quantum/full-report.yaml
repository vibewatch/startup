  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Photonic and Architectural Peers
        blocks:
          - type: paragraph
            body: >-
              Bose's public materials make clear that it is not selling a generic quantum-software layer. It is selling
              a photonic stack that spans dedicated hardware, room-temperature operation, cloud exposure through China
              Mobile's Wuyue platform, and Kaiwu SDK tooling. That puts it in the same buyer conversation as photonic or
              optical-first vendors rather than only with superconducting or trapped-ion incumbents. PsiQuantum is
              pushing a silicon-photonics path toward utility-scale systems; ORCA markets rack-mounted, room-temperature
              PT systems for HPC integration; Quandela offers cloud and on-prem MosaiQ systems plus Perceval tooling;
              and Xanadu continues to frame Aurora as a scalable, networked and modular photonic computer. LightSolver
              is not a quantum company, but it matters strategically because it tries to win optimization-class budgets
              with analog optical hardware rather than with qubits at all. The result is that Bose's core modality is
              differentiated, but not unique. Buyers already have multiple ways to back photonics, networked photonics,
              or optical compute without choosing Bose specifically. Bose's strongest direct edge in the reviewed
              material is therefore domestic channel fit and deployment narrative, not an exclusive claim to
              room-temperature or cloud-addressable photonic computing.
