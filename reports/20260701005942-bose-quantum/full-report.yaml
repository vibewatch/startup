      - number: '8.3'
        title: Public and Private Comparable Set
        blocks:
          - type: paragraph
            body: >-
              The comparable set is informative but dangerous. Public pure-play quantum names currently trade on
              extraordinary market-cap-to-revenue ratios: about 152.9x for IonQ, 361.0x for D-Wave, 904.2x for Rigetti,
              and 3211.1x for Quantum Computing Inc. using the latest accessible annual revenue figures. Those numbers
              show that the market is willing to fund quantum optionality, but they do not prove that Bose Quantum
              deserves the same treatment; if anything, they show how speculative the whole category remains. The
              private set is just as wide. Quantinuum disclosed a $10 billion pre-money valuation on a $600 million
              raise in 2025, while ORCA’s earlier photonic Series A was only $15 million. Bose is therefore sitting
              between very different comparability poles: more scaled and better financed than an early photonic
              startup, but still far less transparent than the public pure plays and far less mature than the
              best-funded private leader. That makes comps a framing tool, not a pricing answer.
            claimRefs:
