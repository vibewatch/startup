              Kaiwu community. Those metrics imply ecosystem reach, but they do not prove paying-customer count,
              recurring software revenue or hardware gross margin. The exact post-money valuation is likewise still
              opaque in open sources: subscription databases track the company and its Series B status, but open-access
              outputs do not independently verify the often-repeated unicorn figure. We therefore keep valuation,
