  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from real technical and financing momentum into unresolved financial and policy questions
      that block price-setting.
    data:
      nodes:
        - id: n1
          label: Product and deployment proof
          detail: Hardware, cloud, and early commercial deliveries are visible
          tone: positive
        - id: n2
          label: Funding support
          detail: A+, A++, and CNY1B Series B show strong backer appetite
          tone: positive
        - id: n3
          label: Revenue opacity
          detail: No public revenue, margin, or runway disclosure
          tone: negative
        - id: n4
          label: Policy / supply-chain risk
          detail: China-linked quantum capital and suppliers face control risk
          tone: negative
        - id: n5
          label: Public comp optionality
          detail: Quantum comps trade rich but remain volatile and disclosure-heavy
          tone: neutral
        - id: n6
          label: 'Recommendation: research-more'
          detail: Track closely, but do not lead an undisclosed-price round
          tone: neutral
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: Flow is analytical rather than statistical; it summarizes the gating logic behind the recommendation.
