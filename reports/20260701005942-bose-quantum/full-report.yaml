      - number: '1.5'
        title: Milestones, Commercialization and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The company chronology shows a rapid shift from research startup to manufacturing claimant. Bose Quantum
              was founded in late 2020, publicly launched a 100-qubit coherent photonic system in 2023, opened the China
              Mobile-linked Hengshan cloud platform later that year, scaled to a 550-qubit machine and a first
              commercial photonic-system sale in 2024, then paired an A++ round with a Shenzhen factory buildout in
              2025. By March through May 2026, the company had closed a CNY 1 billion Series B, launched the Yuliang
              Shanhai 1000 generation and positioned itself as China's first large-scale dedicated photonic-quantum
              manufacturer. The chronology is directionally strong, but the adverse context matters. Physics World
              documented Alibaba and Baidu stepping away from direct quantum-hardware research in 2023-2024,
              underscoring that China's commercial quantum market remains difficult even for better-capitalized
              technology platforms. Bose Quantum's milestone velocity is therefore notable, but not yet equivalent to
              de-risked demand or transparent economics.
