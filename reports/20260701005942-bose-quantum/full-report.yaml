      - number: '1.3'
        title: Funding History, Investors and Capital Signal
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum has raised capital repeatedly since inception, with TMTPost describing the late-2024 A+
              extension as the company's seventh fundraising event since founding. The open-source record is strongest
              on named rounds rather than on the full cumulative cap table. The 2023 Series A exceeded RMB 100 million
              and was linked to China Mobile and Tsinghua-affiliated capital. A Beijing government-backed fund led the
              2024 A+ financing, the October 2025 A++ round brought in a new group of strategic and financial investors
              for hundreds of millions of renminbi, and the March 2026 Series B reached CNY 1 billion (about USD 145
              million) with a syndicate dominated by state-backed or institutionally connected investors. The pattern
              matters more than the exact cumulative total: Bose Quantum is being financed as a national-strategic
              deep-tech manufacturer, not as a lightly capitalized software startup. Even so, open sources do not fully
              reveal round terms, liquidation preferences, secondaries, debt or exact ownership stakes, so capital
              adequacy beyond the headline round size still needs direct diligence.
