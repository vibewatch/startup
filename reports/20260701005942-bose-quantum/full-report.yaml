      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more is effectively a no-price decision
            body: >-
              Bose Quantum may be a real winner in a strategically important category, but the public file still lacks
              the price, terms, and revenue proof needed to convert strategic excitement into an investment
              recommendation.
            calloutType: recommendation
            claimRefs:
