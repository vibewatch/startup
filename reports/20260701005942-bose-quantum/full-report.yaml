              answers it. What we do know is that the company has raised money repeatedly and used that money for
              hardware R&D, chip-process capability, factory buildout, and ecosystem expansion. The 2026 Series B alone
              funded a pilot chip line and factory scale-up, while registry data show a June 2026 conversion to a
              joint-stock company and a registered-capital increase to RMB360 million. What we do not know is whether
              the balance sheet can sustain the next phase without more capital: public sources do not disclose cash,
              burn, runway, debt facilities, or project-finance commitments. D-Wave's public filing is a useful sector
