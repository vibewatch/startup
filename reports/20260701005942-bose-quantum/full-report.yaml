  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters and Stage
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum, also branded in English as Boson Quantum Technology or QBoson, is a private Beijing photonic
              quantum-computing company whose current legal name is Beijing Boson Quantum Technology Co., Ltd. as a
              non-listed joint-stock company. Registry records and the official site place the business in Chaoyang
              District, Beijing, with a founding date of 2020-11-16 and an operating address on Wanhong West Street. The
              business model is not a pure software stack: the company describes itself as a full-stack photonic-quantum
              platform provider spanning dedicated quantum-computing hardware, cloud access, development tooling and
              application deployment for enterprise and research workloads. Public evidence supports a current stage of
              private Series B hardware scale-up rather than a mature commercial operator. The strongest open sources
              confirm aggressive technical and manufacturing ambitions, but they do not disclose audited revenue,
              recurring software economics or a clean post-money valuation, so those metrics remain explicit diligence
              gaps rather than facts.
