            title: Commercial access is more explicit than the average quantum startup
            body: >-
              Bose publicly shows task pricing, partner-cloud onboarding, private deployment language, and a documented
              path from software tooling into real-machine execution. That does not prove broad revenue durability, but
              it does make the commercial surface materially more concrete than pure research-stage peers.
