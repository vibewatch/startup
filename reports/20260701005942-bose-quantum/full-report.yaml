            title: Scenario bands are milestone bands, not discovered marks
            body: >-
              The bull, base, and bear ranges are meant to discipline underwriting under explicit assumptions; they
              should move materially once management shares terms, revenue, cohorts, and manufacturing metrics.
            calloutType: assumption
            claimRefs:
