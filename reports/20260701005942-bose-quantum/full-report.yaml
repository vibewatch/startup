      - number: '1.2'
        title: Founders, Leadership and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              The public leadership story centers heavily on founder and CEO Dr. Wen Kai. English trade coverage, the
              company site and scholarly records align on his Stanford Ph.D. background, prior Google quantum experience
              and early association with coherent Ising machine research. The official team page also names COO Ma Yin,
              CTO Wei Hai and chief scientist Wang Chuan as core executives driving productization. Registry-style
              sources add a thin but useful governance layer: Aiqicha identifies Ma Yin as vice chairman and lists Li
              Huiling, Jiang Peixing, Ruan Dong and Wang Dan in finance or director roles. That is enough to show the
              company has evolved beyond a one-person founder narrative, but not enough to verify independent board
              oversight, shareholder control, board committees or decision rights. Key-person concentration therefore
              remains material: the technical story, external brand and investor signaling all still route through Wen
              Kai and the founding technical bench.
