      - number: '4.3'
        title: Cost Structure, Unit-Economics Inputs, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a business with real hardware and service obligations. Registry filings show
              manufacturing and cloud-equipment activities, while the about page points to multiple labs plus a Shenzhen
              factory. Product materials add the operating detail that matters financially: daily availability targets,
              MTBF, MTTR, intelligent self-check, and power draw. Those metrics imply warranties, field service, uptime
              engineering, and energy costs—exactly the kinds of line items that make this business structurally
              different from software-only companies. Bose's room-temperature photonic positioning should reduce cooling
              and deployment burden compared with cryogenic systems, but the company does not publish gross margin or
              service margin, so the benefit cannot be translated into unit-economics confidence. The strongest
              independent confirmation of capital intensity is how financing is being used: chip-process capability,
              pilot line creation, factory expansion, and ecosystem buildout. This is commercialization through
