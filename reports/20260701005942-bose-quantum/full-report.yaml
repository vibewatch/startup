  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Surface
        blocks:
          - type: paragraph
            body: >-
              Bose's commercial surface is broader than a simple hardware brochure. The company publicly presents a
              stack that starts with competitions and a developer community, moves through Kaiwu SDK tooling and cloud
              validation, and ends at physical quantum-computer deployment. China Mobile's Hengshan platform adds an
              especially useful clue: after registration, users can order real-machine compute service from a console,
              which makes a cloud or task-based revenue path visible even though Bose does not publish rate cards. At
              the same time, Bose's own pages show no list pricing for hardware, no per-shot or per-minute tariffs, and
              no minimum contract information. That leaves investors forced to benchmark likely buyer expectations
              against transparent peer offerings from IBM, AWS Braket, and Azure Quantum. The evidence therefore
              supports a hybrid revenue model—large-quote hardware, usage-led cloud access, and consultative vertical
              solution work—but not a clean view of mix, realized pricing, discounting, or recognition policy. Public
              pricing opacity is a real diligence issue because peers now make quantum access procurement much more
              legible.
