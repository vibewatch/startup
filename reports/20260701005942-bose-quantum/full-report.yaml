        title: Cover Metrics, Scale Markers and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              The verifiable headline metrics are operational rather than financial. Registry and company sources
              support a 2020 foundation date, a current Beijing headquarters, a reported insured-employee count of 96 on
              Aiqicha, and a workforce mix that the company says is 70 percent R&D and 65 percent masters or Ph.D.
              talent. Product-usage evidence is stronger than revenue evidence: TMTPost reports that the 550-qubit cloud
              platform accumulated more than 18 million task calls, served over 400 institutions across 830 disciplines
