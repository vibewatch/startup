  topStrengths:
    - >-
      Real hardware, cloud and tooling surface: public sources verify 100-, 550- and 1000-qubit systems plus Wuyue/Kaiwu
      ecosystem assets.
    - Strong investor support culminated in a CNY 1 billion Series B and a Shenzhen manufacturing push.
    - >-
      Named deployments with China Mobile and other institutions show stronger commercialization signals than a pure lab
      startup.
