- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Outbound-investment / export-control friction
    - Counsel flags covered transaction or supplier licensing delay
    - Any prohibited-investment determination or any critical component license delay above 90 days
    - Pause underwriting or restructure the deal before relying on cross-border capital or component assumptions.
  - - Factory and yield risk
    - Pilot line or factory slips without proof of output quality
    - Two-quarter slip, or no yield / uptime / warranty packet by the next financing event
    - Haircut scale assumptions and treat manufacturing expansion as capital consumption rather than moat creation.
  - - Customer concentration risk
    - Revenue mix remains undisclosed or concentrated in a few institutions or one vertical
    - Top vertical above 40% of revenue or top three accounts above 60% without renewal evidence
    - Reduce commercialization confidence and require concentration covenants or milestone-based funding.
  - - Partner-platform dependency
    - Loss or repricing of cloud distribution route
    - Loss of a major partner-cloud channel or material adverse change in platform economics
    - Rework growth model and demand proof of direct or on-prem alternatives.
  - - Capital-intensity risk
    - Another financing cycle arrives before revenue durability is proven
    - Less than 24 months of runway after round close or no path to improving unit economics
    - Avoid pricing the company on scaled revenue multiples until durability is demonstrated.
  - - Operational-proof gap
    - No independent uptime, reliability, or benchmark evidence appears
    - No third-party operational packet, no incident history, and no customer reference on production durability
    - Treat the business as pre-proof infrastructure and keep recommendation at research-more / avoid territory.
  notes: These triggers are designed to be monitorable in diligence or in the next refresh cycle; each one translates a narrative risk into a concrete decision threshold.
