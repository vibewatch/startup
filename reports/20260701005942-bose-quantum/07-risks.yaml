- id: mitigation-readiness-and-kill-criteria
  title: Mitigation readiness, monitoring, and kill criteria
  body: 'Bose Quantum does have real mitigants: a technical founding team, high R&D staffing intensity, recent capital, and enough public proof to show it is not a paper company. None of those mitigants, however, closes the biggest underwriting gaps. The company still needs private evidence on export-control classification, supplier concentration, factory-yield and uptime performance, revenue mix, renewals, and account concentration. The right investor posture is therefore conditional rather than fatalistic. If management can show that the pilot line is on schedule, that cloud or hardware uptime is documented, that compliance staffing is credible, and that at least a handful of customers are renewing or expanding outside policy-linked anchors, the risk stack becomes more manageable. If those packets do not exist, the same facts that make Bose Quantum look ambitious today—factory scale-up, state-linked momentum, and specialized hardware—become the reasons to slow or walk away. The kill criteria
    should focus on delays, concentration, and financing dependence rather than on qubit headlines alone.'
