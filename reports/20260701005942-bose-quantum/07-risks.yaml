  evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-visibility-gap
    missingEvidence: Official sanctions, court, enforcement, and patent-dispute search results under every Chinese and English company-name variant.
    whyItMatters: Public-web absence checks do not prove the company is free of litigation, sanctions, or IP disputes that could change legal-risk severity.
    diligencePath: Run counsel-supported searches across official court, enforcement, sanctions, and patent forums using every historical and current legal name.
    relatedQuestionRefs:
    - QR004
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: export-controls-us
    missingEvidence: Internal export-classification matrix, denied-party screening logs, and any supplier or investor counsel memos on outbound-investment exposure.
    whyItMatters: Without deal-specific compliance packets, investors cannot tell whether policy risk is theoretical friction or a live blocker for capital, parts, or collaboration.
    diligencePath: Request the company's export-control counsel memo, supplier-license history, and covered-foreign-person analysis before underwriting cross-border assumptions.
    relatedQuestionRefs:
    - QR022
    - QR025
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: evidence-gap-operations
    missingEvidence: Factory yield, cloud uptime, SLA, warranty, incident, and field-service evidence for shipped or deployed systems.
    whyItMatters: Scale-up risk cannot be downgraded without proof that the production and service stack is reliable outside the company narrative.
    diligencePath: Obtain pilot-line yield reports, uptime dashboards, customer SLA samples, and any incident or corrective-action logs.
    relatedQuestionRefs:
    - QR009
    - QR028
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: evidence-gap-supply-chain
    missingEvidence: A supplier map covering detectors, photon sources, PIC fabrication, optical switching, specialized materials, and fallback vendors.
    whyItMatters: Operational and geopolitical risk can look manageable in public until a single constrained component or tool chain causes a quarter of delay.
    diligencePath: Request BOM-level dependency analysis, second-source qualification status, and inventory or lead-time buffers for critical parts.
    relatedQuestionRefs:
    - QR012
    - QR013
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: evidence-gap-commercial
    missingEvidence: Revenue mix, top-customer share, renewal history, cohort durability, and channel mix across partner cloud, supercomputing, and direct enterprise accounts.
    whyItMatters: The highest residual risk is commercialization mismatch, and that cannot be priced correctly without concentration and repeat-demand evidence.
    diligencePath: Request monthly recurring or usage revenue by channel, top-account concentration, renewal schedules, and customer references tied to paid production use.
    relatedQuestionRefs:
    - QR014
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: minor
    topic: people-and-ip
    missingEvidence: Detailed org chart for manufacturing, compliance, field service, and post-conversion governance controls.
    whyItMatters: The science team can be strong while the production and compliance organization is still too thin for the next stage of scale-up.
    diligencePath: Review department-level staffing plan, delegated authorities, and open hiring requisitions tied to factory, quality, and compliance operations.
    relatedQuestionRefs:
    - QR020
    - QR021
    relatedTableRefs:
    - TR004
