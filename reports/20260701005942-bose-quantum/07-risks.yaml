- id: factory-scaleup-and-technical-bottlenecks
  title: Factory scale-up and technical bottlenecks
  body: 'Operational risk is high because Bose Quantum is trying to industrialize a still-maturing architecture. Independent reporting and company materials agree that the company is using new financing to expand a Shenzhen factory, stand up a pilot quantum-chip line, and improve reliability, but they do not show the yield, uptime, or warranty data that would prove that this transition is already under control. The academic and sector evidence is also cautionary. The coherent-Ising and photonic-computing literature says hybrid analog-digital control, photonic integrated circuits, detectors, switches, and other optical layers are not interchangeable details; they are separate bottlenecks that can each limit manufacturability or performance. Broader supply-chain work adds another layer by showing that localization progress is real but incomplete, with specialized minerals and component chains still vulnerable to geopolitical disruption. In short, Bose Quantum now carries a classic factory-before-proof
    risk: more hardware ambition, more supply-chain moving parts, and still-limited public evidence that the scaled product is reliable enough to support durable margins.'
