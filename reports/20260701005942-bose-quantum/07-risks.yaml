- id: partner-customer-and-model-fragility
  title: Partner, customer, and model fragility
  body: 'Bose Quantum''s customer-risk story is credible enough to matter but still narrow enough to worry about. The strongest public proof sits in partner clouds, supercomputing deployments, and a few institutional references rather than in disclosed renewal-heavy enterprise accounts. Jiemian''s reporting is the key adverse lens: it says early customers are often supercomputing centers because they provide public funding and low commercial risk, and it also notes that cloud access runs through China Mobile, Alibaba Cloud, and Huawei Cloud on a pay-per-use basis. That distribution model may help adoption, but it also means customer access, authentication, and workflow control live partly inside partner infrastructure. The disclosed user mix is also concentrated, with biopharma carrying a notable share and universities still visible in the remainder. The financial-model risk follows directly from that commercial picture. Revenue, renewal, and top-customer exposure remain undisclosed, while
    public quantum peers still report losses, capital needs, and customer concentration even with more mature disclosure surfaces. That makes commercialization the top residual risk rather than a secondary concern.'
