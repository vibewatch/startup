  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: Actual Bose price book, customer discount ranges, and contract minimums for hardware and cloud services.
    whyItMatters: Without realized pricing the chapter cannot separate experimental usage, subsidized onboarding, and durable gross-profit-bearing revenue.
    diligencePath: Request top-20 contract excerpts, list-price book, and discount policy by channel and product line.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Revenue-share terms, customer counts, and paid-usage conversion for the China Mobile and community channels.
    whyItMatters: Visible distribution does not prove economic efficiency; partner take rates and conversion determine whether the funnel is accretive.
    diligencePath: Request partner agreements, monthly paid user counts, and conversion by source channel from cloud signup to paid contract.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-proof
    missingEvidence: Gross margin, warranty cost, service cost, and deployed utilization data by hardware, cloud, and solution line.
    whyItMatters: Public room-temperature and automation claims suggest a margin story, but only internal cost data can prove whether that story is economically meaningful.
    diligencePath: Request line-of-business gross margins, field-service cost per deployed system, uptime statistics, and warranty accruals.
    relatedQuestionRefs:
    - QI013
    - QI023
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current cash balance, monthly burn, capex schedule, debt facilities, and any project-finance or equipment-lease commitments.
    whyItMatters: Forward capital adequacy cannot be underwritten from funding headlines or registered capital; runway and hidden fixed charges determine next-round timing and dilution risk.
    diligencePath: Request the latest balance sheet, monthly cash bridge, 12- to 18-month capex plan, and full debt or lease schedule.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: minor
    topic: revenue-recognition-policy
    missingEvidence: Customer contracts or accounting policy detail showing when hardware, cloud compute, and integration revenue are recognized.
    whyItMatters: Recognition timing affects quarterly comparability and the mix between lumpy equipment sales and ratable service revenue.
    diligencePath: Request sample contracts and finance policy memos covering delivery acceptance, cloud usage billing, and service milestones.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI001
