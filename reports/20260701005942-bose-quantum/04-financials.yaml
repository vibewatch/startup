  - TI005
  figureRefs:
  - FI003
- id: capital-adequacy-and-verdict
  title: Capital Adequacy, Financing Dependency, and Verdict
  body: 'Forward capital adequacy is the key financial question for Bose, and public evidence only partially answers it. What we do know is that the company has raised money repeatedly and used that money for hardware R&D, chip-process capability, factory buildout, and ecosystem expansion. The 2026 Series B alone funded a pilot chip line and factory scale-up, while registry data show a June 2026 conversion to a joint-stock company and a registered-capital increase to RMB360 million. What we do not know is whether the balance sheet can sustain the next phase without more capital: public sources do not disclose cash, burn, runway, debt facilities, or project-finance commitments. D-Wave''s public filing is a useful sector benchmark here: even a more commercial quantum player still needed a very large cash position relative to revenue. Bose''s public case therefore supports ''commercially serious, but not yet publicly underwritable.'' The right diligence posture is to ask for private operating
    data, not to extrapolate confidence from funding headlines or factory milestones alone.'
