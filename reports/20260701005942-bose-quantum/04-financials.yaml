- id: gtm-and-sales-proxies
  title: Go-to-Market Motion and Sales-Efficiency Proxies
  body: Bose's public GTM motion looks like a layered funnel rather than a pure top-down capital-equipment motion. The company pushes developers through contests, community participation, open documentation, and GitHub examples, then uses cloud-based real-machine access and quota incentives to lower trial friction. At the same time, all three vertical solution pages route prospects toward consultation, which implies that meaningful monetization likely happens through enterprise projects, pilots, or negotiated contracts instead of standard self-serve checkout. The available public evidence is enough to show channel shape, but not enough to quantify channel economics. We do not see disclosed CAC, payback, NRR, win rate, marketplace conversion, or revenue-share terms with China Mobile. That means the visible developer and partner surfaces are more useful as pipeline proxies than as revenue-quality proof. Investors should treat the community, cloud beta, and consulting CTAs as evidence of serious
    commercial packaging—not as evidence that Bose has already solved sales efficiency.
  claimRefs:
  - CI003
  - CI004
  - CI006
  - CI007
