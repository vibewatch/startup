  - FI004
- id: traction-and-public-metric-gaps
  title: Public Traction Proxies Versus Private-Metric Gaps
  body: 'Bose has more public commercialization proof than many deep-tech startups, but it is still mostly proxy evidence. Independent coverage says the Shenzhen factory started production in late 2025 and that systems have already been delivered to named institutions including China Mobile and the National Supercomputing Center in Chengdu. The China Mobile article also shows a cloud service that was opened to government, enterprise, and research users. On the softer end of traction, Bose claims a community of thousands, while GitHub and Kaiwu docs demonstrate a real developer on-ramp. Even so, the numerically decisive metrics remain absent: no public revenue, ARR, gross margin, payback, NRR, backlog, or customer concentration. The result is a common quantum-investing problem: the company looks commercially active, but the public data stop short of showing whether that activity is translating into high-quality recurring revenue. We can bound some technical cost inputs, but not the actual
    economics that would make them investable.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI036
  - CI040
