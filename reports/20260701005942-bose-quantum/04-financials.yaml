- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on analysis
  - Current public proxy
  - Why the proxy is insufficient
  - Exact diligence path
  rows:
  - - Revenue / ARR by stream
    - Cannot test mix quality or concentration
    - Delivered clients and public cloud beta
    - Commercial activity is not the same as recognized recurring revenue
    - Request audited revenue bridge by hardware, cloud, and services
  - - Realized pricing and discounts
    - Cannot estimate margin or sales efficiency
    - Peer price cards from IBM/AWS/Azure; Bose price absent
    - Competitor tariffs do not reveal Bose ASP, discounting, or contract floor
    - Request price book, deal desk discount bands, and top-20 contracts
  - - Gross margin by business line
    - Cannot judge whether room-temperature design is economically superior
    - Power, uptime, MTBF, and automation claims
    - Technical inputs do not reveal cost of service or warranty accruals
    - Request gross margin by hardware, cloud, and services with cohort trends
  - - Community-to-paid conversion
    - Cannot value free quotas as acquisition engine
    - Community rewards and GitHub activity
    - Usage incentives may generate engagement without monetization
    - Request funnel data from community signup to paid compute to hardware sale
  - - Utilization / installed-base productivity
    - Cannot test factory or service leverage
    - Factory start and deployments to named institutions
    - Named deployments do not reveal machine-hours sold or installed-base occupancy
    - Request deployed-system utilization, backlog, and maintenance load
  - - Cash / burn / runway
    - Cannot assess next-round timing
    - Funding headlines and registry capital
    - Raised capital and registered capital are not liquidity statements
    - Request cash balance, monthly burn, capex plan, and runway forecast
  - - Debt / lease / project-finance obligations
    - Cannot assess hidden fixed charges or covenant risk
    - No public disclosure found
    - Silence is not proof of zero obligations
    - Request debt schedule, equipment leases, and grant or subsidy conditions
  - - Customer concentration and retention
    - Cannot evaluate revenue durability
    - Named institutional deliveries and partner article
    - Reference customers do not show repeat spend or renewal quality
    - Request customer concentration, churn, renewal, and NRR by cohort
  notes: Every missing metric here is material to underwriting. Public traction exists, but the private operating data required to translate traction into revenue quality does not.
