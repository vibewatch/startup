callouts:
- calloutType: risk
  title: Commercialization is hardware-led and therefore capital hungry
  body: The strongest public evidence on Bose financial trajectory is not revenue disclosure but repeated capital deployment into chip processes, labs, and factory buildout. That pattern is consistent with a company still funding commercialization through manufacturing scale rather than through already-proven recurring software economics.
  claimRefs:
  - CI016
  - CI022
  - CI033
  - CI037
- calloutType: insight
  title: The developer funnel is real, but conversion economics are not public
  body: Community quotas, GitHub examples, SDK docs, and cloud-task ordering show Bose has built a credible top-of-funnel and experimentation surface. None of those surfaces disclose the percentage of users who convert into paid compute, enterprise solutions, or hardware deployments.
  claimRefs:
  - CI003
  - CI004
  - CI006
  - CI027
  - CI043
- calloutType: risk
  title: Pricing opacity prevents clean revenue-quality underwriting
  body: Bose peers publish minute, shot, or program-based pricing, while Bose public materials remain silent on list rates and minimum contracts. Without realized pricing and retention data, public evidence supports tracking commercialization progress, not concluding that revenue quality is strong.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI040
  - CI044
