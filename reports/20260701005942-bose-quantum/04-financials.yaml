company:
  name: Bose Quantum
chapter:
  number: 4
  title: Financials
  summary: Bose Quantum has built a credible commercialization surface across hardware, cloud access, SDK tooling, and enterprise solution pages, but public evidence still stops well short of investable financial transparency. The strongest validated facts are that the company is manufacturing-led, repeatedly financed, and scaling a Shenzhen factory and chip pilot line; the weakest area is everything investors need for underwriting—revenue, margins, conversion, burn, runway, and obligations remain private.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Surface
  body: 'Bose''s commercial surface is broader than a simple hardware brochure. The company publicly presents a stack that starts with competitions and a developer community, moves through Kaiwu SDK tooling and cloud validation, and ends at physical quantum-computer deployment. China Mobile''s Hengshan platform adds an especially useful clue: after registration, users can order real-machine compute service from a console, which makes a cloud or task-based revenue path visible even though Bose does not publish rate cards. At the same time, Bose''s own pages show no list pricing for hardware, no per-shot or per-minute tariffs, and no minimum contract information. That leaves investors forced to benchmark likely buyer expectations against transparent peer offerings from IBM, AWS Braket, and Azure Quantum. The evidence therefore supports a hybrid revenue model—large-quote hardware, usage-led cloud access, and consultative vertical solution work—but not a clean view of mix, realized pricing,
    discounting, or recognition policy. Public pricing opacity is a real diligence issue because peers now make quantum access procurement much more legible.'
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
  - CI008
