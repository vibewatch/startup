callouts:
- calloutType: strength
  title: Workflow maturity is more visible than raw science-fiction positioning
  body: Bose has done more than publish modality claims. The retained public surface shows real docs, examples, quota programs, partner-cloud messaging, and concrete matrix-submission workflows. That does not prove broad commercial adoption, but it does make the product stack legible to technical evaluators.
  claimRefs:
  - CE001
  - CE014
  - CE018
  - CE020
- calloutType: strength
  title: Room-temperature packaging and control systems are the clearest near-term moat
  body: 'The most specific differentiation evidence is operational: multiple machine scales, smart-control upgrades, full connectivity, optical thermal control, pooled hardware, and failover messaging. Bose looks strongest when judged as a systems-packaging company, not when judged only by abstract qubit rhetoric.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE009
  - CE034
- calloutType: risk
  title: Trust posture is materially underdocumented for enterprise deployment
  body: The chapter found no retained public trust center, no certification artifact beyond a company claim of CAICT technical verification, and no public SLA or incident-history surface. That is a serious diligence gap if the investment case depends on cloud or private deployment into security-sensitive buyers.
  claimRefs:
  - CE035
  - CE036
  - CE037
  - CE040
- calloutType: risk
  title: Special-purpose positioning may speed commercialization but narrows the buyer story
  body: Independent reporting says Bose is intentionally building a quantum-GPU-like path to market. That may bring revenue sooner than waiting for universal systems, but it also leaves the company exposed if classical or alternative accelerators close enough of the optimization gap for many customers.
  claimRefs:
  - CE026
  - CE027
  - CE038
