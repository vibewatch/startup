  rows:
  - - SPQC-100 / 550 / 1000 hardware
    - Research, enterprise, strategic buyers
    - Dedicated coherent-photonic optimization hardware
    - Publicly shipped / documented family
    - Room-temperature operation, full connectivity, multiple machine scales
    - No public acceptance-test results or shipped-unit counts by SKU
  - - Quantum cloud platform / Quantum Cloud Hub
    - Developers and cloud users
    - Buy, queue, and retrieve real-machine tasks through managed cloud access
    - Live public surface
