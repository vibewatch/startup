- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Six-layer public architecture from developer workflow to photonic hardware operations.
  data:
    layers:
    - label: Application workload
      detail: Optimization, AI, biopharma, and city-use-case workflows framed as QUBO or Ising-compatible tasks rather than raw quantum circuits.
    - label: Modeling and orchestration interfaces
      detail: Kaiwu SDK plus Kaiwu-PyTorch-Plugin expose Python, PyTorch, and solver abstractions to non-quantum-specialist developers.
    - label: Execution path selection
      detail: Users either upload matrices through the cloud console or call CIMOptimizer and related SDK tooling directly from code.
    - label: Cloud and scheduling layer
      detail: Quantum Cloud Hub, account credentials, task queuing, and result retrieval abstract access to real machines and partner-cloud surfaces.
    - label: Machine control and health layer
      detail: L2 intelligent control, environment monitoring, self-checks, and failover claims sit between user jobs and the hardware fleet.
    - label: Photonic compute core
      detail: Room-temperature coherent-photonic systems with full connectivity, optical control modules, and flagship 1000/550/100 machine classes.
