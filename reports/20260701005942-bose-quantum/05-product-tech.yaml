- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in the stack
  - Key dependency
  - Observed risk
  - Why it matters
  rows:
  - - Problem-modeling layer (QUBO / Ising)
    - Translate user workflows into optimization-ready matrices
    - Kaiwu SDK primitives and solver logic
    - Developers must fit problems into Bose's accepted formulations
    - This is the entry point that decides whether workloads are addressable at all
  - - Solver / optimizer layer
    - Move from models into classical, simulated, or CIM-backed execution
    - kaiwu solver, classical, cim, sampler, common modules
    - API or solver evolution can break older code paths
    - This is where Bose makes specialized hardware accessible to non-quantum experts
  - - Cloud submission and queue management
    - Upload matrices, configure tasks, queue runs, and retrieve results
    - Cloud console, account credentials, task orchestration
    - Opaque service behavior or queue delays could hurt user trust
    - This is the public production surface for many non-hardware buyers
  - - Quantum Cloud Hub resource pool
    - Virtualize multiple photonic machines into one managed resource layer
    - Hardware fleet availability and scheduler health
    - Failover and balancing are only company-reported today
    - Pooling is the clearest operational moat signal visible on the cloud page
  - - Machine control system
    - Stabilize runtime modes, smart control, diagnostics, and environment monitoring
    - L2 control stack, sensors, and automation logic
    - Independent evidence on service outcomes is missing
    - Controller quality appears central to uptime and support cost
  - - Photonic compute core and supporting modules
    - Provide room-temperature coherent-photonic optimization hardware
    - Lasers, optical paths, fiber thermal control, and full connectivity
    - Hardware performance still relies heavily on Bose-authored descriptions
    - This is the physical layer that every cloud or SDK workflow ultimately depends on
  notes: Rows emphasize the public architecture and its dependencies, not speculative internal schematics. Risks focus on what would break the externally documented workflow.
