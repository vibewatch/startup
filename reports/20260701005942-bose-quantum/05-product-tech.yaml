- id: trust-safety-and-technical-risks
  title: Trust, Safety, Compliance, and Technical Risks
  body: 'The public trust surface is meaningfully weaker than the public product surface. Bose does publish hardware reliability targets, references a China Academy of Information and Communications Technology validation, and markets enterprise-grade security and data isolation on the cloud surface. But this chapter''s reviewed materials did not yield the usual buyer-facing trust artifacts that would make those claims easy to underwrite: there is no retained public trust center, no obvious privacy or security architecture note, no public certificate page, and no visible incident archive or status history. Independent reporting also adds a useful counterweight. Jiemian captures skepticism that special-purpose machines may stay commercially narrow and that faster classical hardware could keep compressing willingness to pay. That does not negate Bose''s technical progress, but it means the investor must separate ''documented workflow maturity'' from ''trusted enterprise operating maturity.''
    Today, the former is visible; the latter still needs diligence packets rather than webpage reading.'
