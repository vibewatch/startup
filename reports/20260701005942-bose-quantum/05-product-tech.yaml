  evidenceGaps:
  - type: stale
    severity: material
    topic: roadmap-specificity
    missingEvidence: A dated product roadmap with named milestones for CQ-H photonic chips, multi-core parallelism, and the general-purpose photonic program after the current special-purpose systems.
    whyItMatters: Public pages show ambition beyond the current machine family, but the absence of milestone detail makes it hard to underwrite when roadmap items become productizable rather than aspirational.
    diligencePath: Request the internal hardware and software roadmap with milestone owners, target dates, and gating dependencies for the chip pilot line, CQ-H, and post-Shanhai systems.
    relatedQuestionRefs:
    - QE019
  - type: missing-source
    severity: material
    topic: security-compliance-evidence
    missingEvidence: Public trust-center materials such as privacy/security architecture docs, SOC or ISO certificates, penetration-test summaries, or a status / incident surface for Bose cloud services.
    whyItMatters: Enterprise buyers evaluating cloud or private deployments need independent trust artifacts; marketing language alone does not establish data-handling or control maturity.
    diligencePath: Ask Bose for ISO/SOC evidence, privacy and retention documentation, customer security questionnaires, and any public or private status/SLA artifacts tied to cloud or on-prem deployments.
    relatedQuestionRefs:
    - QE021
    - QE024
  - type: private-evidence-only
    severity: material
    topic: independent-reliability-validation
    missingEvidence: Independent test reports or customer references validating uptime, MTBF, MTTR, failover behavior, and CAICT verification scope for the flagship systems.
    whyItMatters: Room-temperature reliability is central to Bose's differentiation story, so investors need more than self-reported metrics to assess service burden and operational risk.
    diligencePath: Request the underlying CAICT validation package, service logs, field-failure statistics, and customer acceptance documents for Shanhai 1000, SPQC-550, and cloud operations.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: minor
    topic: manufacturing-yield-and-scale
    missingEvidence: Factory yield, takt-time, test-escape, or shipped-unit data for the Shenzhen line and any photonic-chip pilot process.
    whyItMatters: Public factory announcements show ambition, but not whether production engineering is repeatable or economically efficient at scale.
    diligencePath: Request manufacturing KPIs, chip and system scrap rates, burn-in results, and customer shipment counts by machine class.
    relatedQuestionRefs:
    - QE018
