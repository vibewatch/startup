  - - Kaiwu SDK
    - Python developers and researchers
    - Model QUBO or Ising problems and submit workloads through Bose tooling
    - Mature documentation surface
    - Direct problem-modeling bridge to real machines
    - Credentialed wheel distribution is heavier than a standard pip-only workflow
  - - Kaiwu-PyTorch-Plugin
    - AI and applied-research teams
    - Expose Boltzmann-machine and QDiffusion workflows through PyTorch
    - Early but concrete developer layer
    - PyTorch-native quantum sampling story rather than a generic API wrapper
    - No public adoption metrics, package-registry stats, or release cadence outside GitHub
  - - Kaiwu community / example repos
    - Students, researchers, developers
    - Examples, contribution surfaces, quotas, and certification funnels
    - Active onboarding layer
    - Hands-on examples and subsidized 550-qubit usage encourage experimentation
    - Conversion from quota usage to paid production is undisclosed
  - - Vertical solutions (AI, biopharma, city)
    - Domain teams and enterprise sponsors
    - Translate the same optimization stack into workflow-specific landing pages
    - Commercial packaging visible
    - Use-case framing reduces the need for buyers to think in raw quantum primitives
    - No public case-study depth proving repeatable production ROI by vertical
  notes: Rows summarize the public product surfaces reviewed for this chapter; they describe what Bose exposes externally, not every internal module or console feature.
