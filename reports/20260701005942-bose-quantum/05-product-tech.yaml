  - - AI energy-based model training
    - Train RBM, BM, QVAE, or QDiffusion workflows inside PyTorch with Kaiwu backends
    - Kaiwu-PyTorch-Plugin on top of Kaiwu SDK
    - Makes the quantum layer look closer to familiar ML tooling
    - No public production customer case quantifies model-quality lift from the plugin
  - - Biopharma or materials discovery workflow
    - Map sequence, docking, or design tasks into quantum-plus-AI optimization problems
    - Solution pages plus plugin / SDK stack
    - Public narrative emphasizes faster search or better exploration of large spaces
    - Public pages remain solution marketing rather than end-to-end validated customer studies
  - - Smart-city optimization workflow
    - Translate bus routing, energy dispatch, fraud, or beamforming into optimization jobs
    - City solution pages plus cloud or direct SDK execution
    - Keeps the product anchored to optimization-heavy operational problems
    - Public evidence does not show procurement terms, SLA obligations, or long-run production economics
  notes: The workflow table stays at the level of documented user journeys and public solution pages; it does not assume undisclosed post-processing or orchestration layers.
