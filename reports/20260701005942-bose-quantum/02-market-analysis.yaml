- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - State funding and public-private coordination
    - driver
    - Current through 2030
    - Accelerates ecosystem buildout and gives Bose a deeper home-market infrastructure base than private demand alone would
      justify
    - How much of Bose's future demand depends on state-linked procurement or grant programs?
  - - Cloud and SDK access
    - driver
    - Current
    - Lets buyers learn and pilot before funding dedicated systems, widening the top of the funnel
    - What share of Bose cloud users or developers convert into paid pilots or production contracts?
  - - Photonic modularity and manufacturability claims
    - driver
    - Current through 2035
    - Could improve serviceability, networking and eventual on-prem deployment fit for enterprise or HPC buyers
    - Which claimed photonic advantages are already reflected in live procurement wins rather than roadmap messaging?
  - - Enterprise competitive pressure in finance, pharma and industrial optimization
    - driver
    - Current through 2030
    - Creates budget for experimentation even before full fault tolerance exists
    - Which verticals already have repeatable willingness-to-pay for Bose-specific workloads?
  - - Cross-disciplinary talent shortage
    - constraint
    - Current
    - Slows pilot design, integration and internal buyer readiness
    - What evidence does Bose have of customer success capacity and training depth by vertical?
  - - Fragile supply chains for advanced quantum components
    - constraint
    - Current through 2030
    - Raises execution risk for hardware scaling and could elongate delivery timelines
    - Which optical, control and component dependencies remain foreign or single-source?
  - - ROI proof and workflow integration requirements
    - constraint
    - Current
    - Buyers increasingly want calibration access, explainability and integration, not qubit-count marketing
    - Can Bose show benchmarked workflow gains on named customer problems?
  - - Scaled production remains rare across the sector
    - constraint
    - Current through 2029
    - Cloud usage or pilots may not translate into durable recurring revenue
    - How many Bose deployments are paying, renewed and in sustained production use?
  notes: Drivers and constraints are mixed because both shape whether Bose's apparent market opportunity becomes monetizable
    on a venture timeline.
