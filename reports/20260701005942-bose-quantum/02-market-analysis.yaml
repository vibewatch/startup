- id: drivers-constraints-and-diligence-gaps
  title: Growth Drivers, Adoption Constraints and Remaining Diligence Gaps
  body: 'Bose benefits from real structural drivers. China''s state-led quantum ecosystem channels large amounts of strategic
    funding, public-private coordination, and lab-to-market commercialization pressure into the sector. QED-C, MERICS, and
    USCC all point to the same broad pattern: quantum remains capital intensive, supply-chain sensitive, and strategically
    important enough that governments and large institutions are willing to subsidize ecosystem buildout before normalized
    enterprise demand is visible. That helps Bose in its home market. The counterweight is that commercialization risk remains
    high. Talent is scarce, supply chains are fragile, private-market demand is still hard to observe, and even bullish sources
    describe the market as one that rewards preparation more than immediate scale. D-Wave''s effort to distinguish its paying
    production use from the rest of the field underlines how exceptional true deployment still is. For diligence, the biggest
    remaining gaps are Bose-specific: public sources do not reveal pricing, contract values, conversion rates from cloud trials
    to paid production, or a transparent China-specific segment split. Those omissions make the market direction investable
    to study, but they keep a precise Bose SAM or SOM out of reach.'
