company:
  name: Bose Quantum
chapter:
  number: 2
  title: Market Analysis
  summary: Bose Quantum is targeting an early but clearly monetizing quantum-computing market whose current revenue remains
    in the low billions, with buyers concentrated in research-intensive and strategically backed institutions. The strongest
    public evidence supports a cloud-to-hybrid adoption path, strong China policy tailwinds, and photonic-specific positioning,
    but not a clean Bose-specific SAM or SOM because pricing, paid production conversion, and contract values remain largely
    private.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend and Status-Quo Alternatives
  body: The relevant market for Bose Quantum is quantum computing systems and services, not the whole umbrella of quantum
    technology. Bose's own product materials and China Mobile launch coverage describe a stack that includes dedicated photonic
    hardware, cloud-delivered runtime access, Kaiwu developer tooling, and application-facing support. QED-C and USCC help
    bound that market by clearly separating quantum computing from quantum communications and sensing. The included spend
    pools are therefore hardware systems, cloud or managed access, workflow tooling, and project-led application work for
    simulation or optimization problems. Excluded or only adjacent pools include generic semiconductor spend, broad AI infrastructure,
    quantum networking, and sensing budgets unless a buyer is explicitly funding a hybrid quantum workflow. That distinction
    matters because Bose is not competing with all enterprise compute. It is competing with classical HPC, AI models, and
    heuristic optimization tools on a narrower set of jobs where buyers believe photonic quantum could eventually outperform
    incumbent methods on speed, search breadth, or simulation fidelity.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
- id: evidence-constrained-sizing
  title: Evidence-Constrained Sizing and Contradictory Market Lenses
  body: 'Open sources support market analysis, but they do not justify a simplistic single-line TAM. QED-C provides the cleanest
    current monetization lens, placing the 2025 quantum-technology market at $1.9 billion and the computing segment at $1.4
    billion, with computing scaling above $3 billion by 2028. McKinsey adds a different lens: more than 300 organizations
    are already collaborating with quantum vendors, and investment surged to $12.6 billion in 2025. Post-Quantum''s summary
    of McKinsey extends the horizon much further, suggesting a 2035 internal quantum-technology market of roughly $60 billion
    to $100 billion, with quantum computing responsible for $43 billion to $71 billion. Those figures are not directly additive
    because they mix current revenue, future vendor-market forecasts, and broader economic value pools. For Bose, the defensible
    conclusion is that current monetized demand is still small in absolute terms, but the buyer formation, capital formation,
    and strategic-policy signals are large enough to justify a real commercialization race. The most honest sizing frame is
    therefore evidence-constrained rather than a forced TAM-SAM-SOM stack.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
