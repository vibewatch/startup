    - Photonic or other quantum-processing systems, control modules, integration and installation
    - Classical servers, generic chips, unrelated optics
    - National labs, HPC centers, enterprise R&D or strategic programs
    - Core Bose wedge because the product page centers on dedicated photonic machines
  - - Quantum cloud access
    - Hosted runtime access, job submission, monitoring, authentication and managed usage
    - General-purpose IaaS without quantum runtime
    - Research institutions, government or enterprise innovation teams
    - Matches the China Mobile platform launch and lowers entry friction for first users
  - - SDK and workflow tooling
    - Developer libraries, simulation environments, notebooks, model translation and validation
    - Generic Python tooling that is not quantum-specific
    - Developers, data scientists, quantum teams
    - Supports Bose's adoption path because Kaiwu is part of the service stack
  - - Application and co-development services
    - Use-case design, pilot support, algorithm tuning, domain-specific integration
    - Broad consulting not tied to quantum workflows
    - Innovation, R&D, or business-unit sponsors
    - Likely required to convert experimental access into sector-specific pilots
  - - Adjacent but excluded categories
    - None beyond the quantum-computing stack above
    - Quantum sensing, quantum communications, generic AI/HPC budgets, broad semiconductor capex
    - Different buyers and budgets
    - Prevents Bose from claiming all quantum or all compute as addressable market
  notes: Included rows define the spend pools that map directly to Bose's public product and cloud stack; excluded rows are
