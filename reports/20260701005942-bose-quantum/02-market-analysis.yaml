- id: buyers-users-payers-and-adoption-path
  title: Buyer, User and Payer Segmentation; Adoption Path
  body: 'The open-source buyer story is clearest at the edge of research and strategic innovation budgets rather than in mass
    enterprise IT. Bose and China Mobile position today''s service model as cloud-first access for research users, government
    and enterprise teams, and developers that want to submit tasks through SDK tooling before committing to heavier deployment.
    Peer photonic vendors point to a similar pattern: use cases cluster in pharma, chemicals, materials, finance, logistics,
    energy, and cybersecurity, while enterprise benchmarking highlights finance and automotive leaders that are already resourcing
    quantum experimentation. IQM''s 2026 study shows why Bose''s near-term buyers are likely to be sophisticated institutions:
    89 percent of respondents are already doing hands-on work, but only 3 percent have reached scaled deployment, and more
    buyers expect hybrid or partly on-prem access than public cloud alone. In practice, the buyer journey still looks sequential
    rather than instant. Teams learn, test a cloud or hybrid workflow, co-develop a business use case, integrate with existing
    systems, and only then consider dedicated capacity or repeated production procurement. That staged path supports Bose''s
    SDK-plus-cloud wedge, but it also means conversion from ecosystem usage to recurring paid revenue remains unproven in
    open sources.'
  claimRefs:
