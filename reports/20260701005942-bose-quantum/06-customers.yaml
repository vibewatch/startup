- id: named-customer-proof-and-maturity
  title: Named customer proof and maturity of evidence
  body: The retained public proof is real, but it is not all the same kind of proof. China Mobile cloud distribution, Chengdu supercomputing deployment, and the China Merchants Bank procurement win are the clearest named surfaces where a third party is visible and the workload is more concrete than a generic solution page. Around those anchors, Bose also discloses deeper but fuzzier collaborations across biopharma and public-sector or transport settings. The key diligence distinction is whether a named reference proves a deployed production environment, a paid pilot, or a collaboration that still sits closer to application exploration. Public sources currently compress those categories together. That is enough to argue Bose has escaped pure concept-stage status, but not enough to assume that every named partner is a large, renewable, revenue-bearing account.
