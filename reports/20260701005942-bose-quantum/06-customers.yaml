callouts:
- calloutType: strength
  title: Commercial access is more explicit than the average quantum startup
  body: Bose publicly shows task pricing, partner-cloud onboarding, private deployment language, and a documented path from software tooling into real-machine execution. That does not prove broad revenue durability, but it does make the commercial surface materially more concrete than pure research-stage peers.
  claimRefs:
  - CU003
  - CU004
  - CU007
  - CU009
  - CU011
  - CU037
- calloutType: risk
  title: Named proof is real but still concentrated in institutional and project-style channels
  body: The strongest retained proofs cluster around China Mobile, Chengdu supercomputing, a single disclosed bank procurement, and collaboration-heavy biopharma work. This is enough to show adoption exists, but not enough to show a diversified recurring-enterprise base.
  claimRefs:
  - CU015
  - CU018
  - CU020
  - CU032
  - CU033
  - CU036
- calloutType: insight
  title: Developer breadth should not be mistaken for paying-production depth
  body: Tens of millions of platform calls and a visible open-source or contest ecosystem imply real usage and feedback loops, yet none of the retained public sources tie that breadth to renewal, NRR, or per-account expansion. Bose appears to have solved awareness better than it has solved disclosure of durability.
  claimRefs:
  - CU022
  - CU023
  - CU026
  - CU027
  - CU028
  - CU035
- calloutType: assumption
  title: Underwrite Bose as usage-led compute infrastructure until renewals are shown
  body: The visible monetization surface is task-priced cloud access and task-based bespoke service. That can scale, but only if repeated workloads, contract renewals, and multi-department expansion become observable. Those are still diligence asks rather than public facts.
  claimRefs:
  - CU004
  - CU019
  - CU035
  - CU037
  - CU042
