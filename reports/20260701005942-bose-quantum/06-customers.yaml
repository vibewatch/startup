- id: durability-and-retention
  title: Durability, repeat usage, and what remains unproven
  body: Bose has enough disclosed usage activity to show that people are touching the platform at scale, but the public durability record is still thin. QbitAI reports tens of millions of cumulative solve calls, hundreds of covered institutions, and a five-figure developer base, while the cloud and documentation surfaces show explicit usage-led workflows. Those are meaningful adoption signals, especially for an emerging quantum stack. But they are still upper- and mid-funnel signals until they are tied to renewal, churn, NRR, or account expansion data. The strongest named financial-services proof is a task-based engagement with China Merchants Bank, and the strongest public cloud proof is a pay-per-use partner platform. Both point toward transactional usage more than toward long-term subscription durability. Until Bose discloses contract lengths, repeat spend, or retention cohorts, outside investors cannot tell whether the current activity is sticky or simply noisy.
