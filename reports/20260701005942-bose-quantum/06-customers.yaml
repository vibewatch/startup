  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-disclosure-gap
    missingEvidence: Public NRR, GRR, churn, renewal-rate, contract-length, or satisfaction data by customer segment.
    whyItMatters: Without retention metrics, the difference between one-time validation projects and durable recurring revenue remains unknowable.
    diligencePath: Request customer cohort data, renewal schedules, churn logs, and account-level ARR or usage-history exports for cloud, banking, and supercomputing customers.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU025
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Contract values, gross margin, and repeat-purchase rates for China Mobile, Chengdu, banking, and biopharma engagements.
    whyItMatters: Named logos are not enough to underwrite revenue concentration or payback if the dollar value and repeatability of each relationship are hidden.
    diligencePath: Ask for contract summaries showing term, value, pricing basis, and expansion milestones for the top ten customer or partner accounts.
    relatedQuestionRefs:
    - QU019
    - QU022
    - QU025
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A complete customer list that distinguishes pilots, paid production deployments, research collaborations, and unpaid community users.
    whyItMatters: Today’s public evidence blends cloud users, collaboration partners, and procurement wins, which can overstate commercial maturity if not separated.
    diligencePath: Request an account-by-account customer ledger with status labels, first revenue date, current annual spend, and most recent usage or renewal event.
    relatedQuestionRefs:
    - QU012
    - QU014
    - QU024
    relatedTableRefs:
    - TU003
  - type: stale
    severity: minor
    topic: developer-to-enterprise-conversion
    missingEvidence: A dated conversion funnel from open-source developers and competition participants into paid cloud users or private-deployment customers.
    whyItMatters: Developer reach is visible, but the board-level question is whether that top-of-funnel reliably converts into spend.
    diligencePath: Ask for monthly funnel data from community signup to first paid task to repeat paid workload to enterprise upsell.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU024
  - type: conflicting-data
    severity: material
    topic: commercialization-vs-exploration
    missingEvidence: Independent post-deployment ROI studies that confirm whether supercomputing, banking, and biopharma engagements are still pilots or have become budgeted production programs.
    whyItMatters: Several retained sources celebrate deployments, while the strongest adverse source says the current market may still be exploratory and government-shaped.
    diligencePath: Obtain customer references, post-mortem case studies, and procurement follow-on documents that show renewal, expansion, or abandonment decisions.
    relatedQuestionRefs:
    - QU017
    - QU020
    - QU022
