  rows:
  - - Research universities and labs
    - Research user / PI or lab / grant or institutional budget
    - 50+ universities and enterprises on cloud page; universities are a large remaining user block
    - Open-source Kaiwu, cloud pay-per-use, competitions, academic sharing plans
    - Low-medium
    - Strong top-of-funnel visibility but weak public renewal data.
  - - Biopharma and health R&D
    - Scientist or platform team / researcher / lab, pharma, or project budget
    - Jiemian names Guangzhou National Laboratory, XtalPi, and BGI; QbitAI lists hospital and university collaborations
    - Cloud tasks, model training workflows, collaborative application exploration
    - Medium
    - Best documented vertical outside infrastructure, but most public evidence is still collaboration- or workflow-oriented.
  - - Financial institutions
    - Innovation or optimization team / quant or data team / bank technology budget
    - China Merchants Bank procurement win; Ping An branch field research; earlier partner list includes Ping An and Huaxia
    - Task-based real-machine service and custom optimization support
    - Medium
    - Named proof exists, but long-term expansion and repeat spend are undisclosed.
  - - Supercomputing and public compute centers
    - Center operator / HPC and research users / public or institutional funding
    - Chengdu supercomputing deployment and fintech task tests
    - Integrated supercomputing plus quantum platform
    - Medium-high
    - This is the strongest infrastructure deployment proof, but it may still be exploratory rather than purely commercial.
  - - Transport, city, and infrastructure operators
    - Operations team / planner / enterprise or municipal budget
    - Official city page plus Science and Technology Daily names Shenzhen Metro
    - Solution projects and potential private deployment
    - Low-medium
    - Named proof is thinner than for cloud, banking, or supercomputing.
  - - Open-source developers and students
    - Developer / learner / no immediate payer
    - GitHub repos, ReadTheDocs, Kaiwu community, MathorCup lectures
    - Community edition, docs, contests, and cloud login
    - Low
    - Visible ecosystem breadth, but this is usage discovery rather than paid production.
  notes: Segment table distinguishes visible users from visible payers; many retained sources describe workflow or collaboration rather than contract economics.
