- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Concentration risk
  - Potential impact
  - Diligence path
  rows:
  - - Partner-cloud and task-pricing entry point
    - 'Medium: easy trial can create many users without creating many durable contracts'
    - Headline activity can rise faster than retained revenue.
    - Ask for paid-account count, repeat-purchase count, and account-expansion history by channel.
  - - Supercomputing-center first-customer pattern
    - 'High: infrastructure validation may depend on state-linked or grant-backed institutions'
    - Technology can look adopted before enterprise economics are proven.
    - Request revenue share from supercomputing, public-sector, and state-linked customers.
  - - Biopharma collaboration depth
    - 'Medium: many named life-science relationships may still be exploratory or project-based'
    - Strong scientific signaling could outrun repeat commercial spend.
    - Request conversion from exploration partner to recurring revenue customer.
  - - Financial-sector procurement friction
    - 'Medium-high: banks and insurers have long payback thresholds and procurement caution'
    - Regulated-sector scale-up may be slower than pilot headlines imply.
    - Request procurement cycle length, budget owner, and expansion milestones for banking customers.
  - - Developer-community funnel
    - 'Medium: a large developer base may stay unpaid if cloud value is not compelling in production'
    - Community reach can overstate monetization maturity.
    - Request conversion funnel from community signup to paid workload to enterprise upsell.
  - - Classical-substitution pressure
    - 'Medium: if classical optimization and AI hardware keep improving, specialized quantum demand may narrow'
    - Renewal and willingness-to-pay could weaken before general-purpose quantum is ready.
    - Request win-loss analysis against classical alternatives and reasons for non-renewal or stalled pilots.
  notes: Risk table emphasizes customer-mix and go-to-market concentration rather than technical risk, which is covered in other chapters.
