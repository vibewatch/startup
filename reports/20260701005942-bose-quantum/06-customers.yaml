figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How Bose moves a prospect from developer awareness into cloud trial, named institutional deployment, and potential private-scale expansion.
  data:
    items:
    - id: stage-learn
      label: Discover and learn
      actor: Developer, researcher, or innovation team
      description: The first touch often happens through open-source repos, Kaiwu documentation, the developer community, or competition lectures rather than through direct enterprise procurement.
      channels:
      - GitHub repos
      - ReadTheDocs / Kaiwu docs
      - MathorCup lecture
      - Kaiwu community
    - id: stage-trial
      label: Cloud trial
      actor: Research user or technical team
      description: Prospects register for cloud access and run task-based workloads through Bose-owned or partner-cloud surfaces with explicit per-task pricing.
      channels:
      - Bose cloud page
      - China Mobile cloud
      - Kaiwu SDK task submission
    - id: stage-domain-fit
      label: Domain validation
      actor: Applied algorithm or lab team
      description: The user maps a domain-specific workload such as fund optimization, peptide generation, route planning, or supercomputing scheduling into Bose’s stack.
      channels:
      - Biopharma workflow
      - Finance optimization
      - City or transport use case
      - Supercomputing integration
    - id: stage-named-proof
      label: Named project or deployment
      actor: Institutional buyer or platform operator
      description: The strongest public proofs today are named cloud channels, supercomputing deployment, and bespoke projects like China Merchants Bank’s Tiancheng AI effort.
      channels:
      - China Mobile channel
      - Chengdu supercomputing center
      - China Merchants Bank project
    - id: stage-expand
      label: Expand or localize
      actor: Commercial owner or infrastructure buyer
      description: Bose’s upside case is that repeated workloads lead to private deployment, more departments, or bigger partner-channel distribution, but that conversion is not yet publicly quantified.
      channels:
      - Private deployment
      - More workloads per account
      - Additional partner agreements
  approximationNotes: Stages are synthesized from retained public customer evidence and do not represent Bose CRM stages or internal funnel definitions.
