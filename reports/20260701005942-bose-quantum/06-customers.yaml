chapter:
  number: 6
  title: Customers
  summary: Bose Quantum has credible customer proof in partner cloud, supercomputing, banking, and biopharma-adjacent workflows, but the public record still skews toward project-style and research-heavy usage rather than disclosed recurring enterprise retention. The clearest strength is explicit access and usage surfaces; the clearest weakness is that public sources still do not show renewals, cohort durability, or concentration by revenue.
sections:
- id: customer-segmentation-and-access
  title: Customer segmentation and access surfaces
  body: Bose now looks more like a segmented quantum-infrastructure vendor than a single-purpose hardware lab. The official cloud and solution pages repeatedly point at biopharma, finance, AI, transport or city operations, materials, energy, and research users, while also distinguishing who merely develops against the stack from who can actually buy compute or hardware. The strongest commercial signal is not a broad enterprise logo wall; it is the existence of explicit access modes, task pricing, private-deployment language, and a real-machine software path that runs from open-source or documentation surfaces into paid compute. Even so, the surface is still uneven. The widest top-of-funnel appears to be universities, developers, and research institutions, while enterprise-grade proof is concentrated in a smaller set of cloud, supercomputing, finance, and domain-application references. That makes segmentation legible, but it does not yet prove equal monetization quality across those segments.
