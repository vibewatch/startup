  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-terms
    missingEvidence: Post-money valuation, share class, liquidation preferences, anti-dilution terms, and any insider bridge protections.
    whyItMatters: Return math and downside protection cannot be analyzed from headline round size alone.
    diligencePath: Obtain executed financing documents, current cap table, and waterfall model from management and counsel.
    relatedQuestionRefs:
    - QV003
    - QV008
    - QV025
    - QV027
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited revenue, gross margin, backlog, burn, and customer-renewal cohorts.
    whyItMatters: These are the core variables that distinguish real commercialization from pilot-heavy strategic deployments.
    diligencePath: Review audited financial statements, management accounts, and cohort reporting in the data room.
    relatedQuestionRefs:
    - QV008
    - QV009
    - QV010
    - QV024
    - QV025
    - QV027
  - type: private-evidence-only
    severity: material
    topic: manufacturing-yield
    missingEvidence: Pilot-line yield, defect rate, unit throughput, and capex-to-output metrics for Shenzhen operations.
    whyItMatters: The bull case depends on manufacturing proof, not just the existence of a factory build-out.
    diligencePath: Conduct site visit and operations review with manufacturing leads and board observers.
