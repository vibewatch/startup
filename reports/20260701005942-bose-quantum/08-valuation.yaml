- id: financing-context-and-price-discipline
  title: Financing Context, Pricing Discipline, and Evidence Limits
  body: |-
    The financing story is the cleanest bullish fact in the file and also the biggest reason to stay disciplined. Bose Quantum disclosed an A+ round in 2024, a follow-on A++ / second-phase Series A+ round in 2025, and a CNY 1 billion Series B in March 2026. The B round was large enough to matter and the investor roster is strong, but every retained public source stops short of the terms investors actually need: there is no disclosed post-money valuation, no security-type detail, no liquidation stack, and no public bridge between funding size and operating economics. That matters because the company is using capital for a pilot chip line, Shenzhen manufacturing expansion, and technical scale-up before public sources prove repeatable revenue quality. In other words, Bose Quantum is financing industrial capacity ahead of transparent economics. That can create an outsized winner, but it can also create dilution and preference overhang that public articles cannot reveal. Any underwriter should treat the disclosed round size as evidence of support, not evidence of a fair price.
