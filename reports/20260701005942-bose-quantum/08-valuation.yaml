- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Observable threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No repeat paying customers
    - Management cannot show renewal or expansion evidence beyond strategic pilot sites
    - Breaks the early-commercial thesis and reframes deployments as validation theater rather than revenue proof
    - Do not price a new round; revert to tracking only
  - - Factory output without yield proof
    - Shenzhen build-out continues but no yield, defect, or unit-throughput metrics are shared
    - Turns scale-up into capital consumption rather than moat expansion
    - Apply a manufacturing-risk discount or walk away
  - - Punitive financing terms
    - Next round relies on insider bridge capital, senior preferences, or structurally protective instruments
    - Makes existing funding support less informative about common-equity value
    - Re-underwrite on liquidation terms, not headline valuation
  - - Export-control / supplier disruption
    - Critical components or cross-border workflows show licensing or sourcing friction
    - Raises execution risk and can elongate commercialization timelines
    - Push valuation to the low end of the range until mitigants are proven
  - - Narrative outruns economics
    - Qubit or AI announcements continue while revenue disclosure, cohorts, and gross margin stay absent
    - Shows the company is still selling story before proof
    - Maintain research-more and refuse price discovery on marketing alone
  notes: Kill triggers focus on survivability and underwriting transmission rather than on technical headline milestones alone.
  claimRefs:
  - CV014
  - CV015
  - CV016
  - CV020
  - CV053
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Round terms
    - Post-money valuation, share class, liquidation stack, and any ratchets or senior protections
    - You cannot model return or downside without terms.
    - Request board-approved financing documents and cap table from CFO / counsel.
  - - Revenue quality
    - Audited revenue, gross margin, backlog, and burn
    - This determines whether the company is funding growth or funding proof-of-concept losses.
    - Review audited statements and management accounts.
  - - Customer cohorts
    - Paying-customer count, renewal / expansion history, and concentration by account
    - This is the cleanest separator between pilots and an investable revenue engine.
    - Inspect cohort tables and top-customer schedule.
  - - Manufacturing readiness
    - Pilot-line yield, unit throughput, defect rates, and capex roadmap
    - Without these numbers, factory expansion is only a capital story.
    - Site visit plus operations packet from CTO / manufacturing lead.
  - - Policy and supply chain
    - Export-control memo, supplier map, and domestic substitution plan
    - Cross-border friction can change both timeline and financing universe.
    - Independent trade counsel review plus supplier interviews.
  - - Governance and exit
    - Board rights, related-party exposure, audit maturity, and long-term exit planning
    - Opaque governance can erase value even if the technology works.
    - Review board package, governance docs, and auditor readiness plan.
  notes: These asks are the minimum packets needed before turning a narrative-positive company into a priceable investment case.
