- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - Bose Quantum is clearly commercializing a real photonic-quantum product surface rather than only publishing research.
    - If product claims stop translating into deployments or customer references, the proof surface weakens fast.
  - - Thesis
    - The 2024-2026 financing cadence shows repeat investor appetite and enough capital to build manufacturing capacity.
    - If the next round is small, insider-only, or structurally punitive, today’s funding narrative becomes less supportive.
  - - Thesis
    - Early sales, cloud usage, and special-purpose positioning create a plausible path to earlier utility than universal-quantum roadmaps.
    - If those early deployments do not convert into repeat paid programs, the special-purpose shortcut loses value.
  - - Anti-thesis
    - Revenue, margin, and runway are still undisclosed, so investors cannot test whether adoption is real or only strategic pilot activity.
    - Audited revenue, customer cohorts, and gross-margin evidence would materially improve confidence.
  - - Anti-thesis
    - Public funding articles disclose amount raised but not post-money valuation, security type, or preference terms.
    - A complete cap table and term sheet could convert valuation stance from unknown to analyzable.
  - - Anti-thesis
    - Cross-border policy and export-control uncertainty raise risk for suppliers and some foreign capital pools.
    - A credible export-control memo and supplier map would reduce the policy discount.
  notes: Rows separate investable strengths from the evidence gaps most likely to move recommendation and price discipline.
