- id: scenario-ranges-and-underwriting
  title: Bull / Base / Bear Cases and Underwriting Ranges
  body: |-
    Because Bose Quantum does not disclose revenue or valuation, the scenario work should be read as underwriting bands rather than claimed fair value. The bull case assumes the company converts current strategic traction into repeat enterprise or government renewals, proves pilot-line output and yield, and turns the 2026 capital raise into visible commercialization rather than only capacity build-out. In that world, a sub-$1.2 billion valuation band can be argued from private optionality logic. The base case is much more conservative: the company keeps advancing technically and raising capital, but public evidence remains pilot-heavy and the next financing still depends on story quality more than on audited economics; that supports a mid-hundreds-of-millions band rather than a billion-dollar leap. The bear case assumes factory-before-demand, export-control friction, or a weak next round with punitive terms. Under that path, value compresses sharply and common-equity risk rises fast. The point of the range is not precision; it is to show that pricing sensitivity is dominated by disclosure, repeat demand, and terms.
  claimRefs:
  - CV042
  - CV043
  - CV048
  - CV049
