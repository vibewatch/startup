- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Room-temperature photonic hardware is enough to differentiate Bose
    - ORCA and Quandela also market room-temperature or datacenter-light photonic deployment, and Xanadu/PsiQuantum keep photonic scale narratives active
    - high
    - Demand evidence that buyers choose Bose for more than modality, such as win-loss notes, renewal behavior, or vertical-specific performance data
  - - China Mobile integration creates durable channel lock-in
    - AWS, Azure, IBM and D-Wave normalize cloud-mediated experimentation and multi-homing in other markets
    - high
    - Request Bose-specific pipeline split by domestic strategic accounts versus cloud trial users and ask whether any non-China cloud channels are live
  - - Opaque pricing helps preserve margin
    - Opaque pricing can instead slow procurement when IBM, Azure and AWS publish clear access structures
    - medium
    - Ask for actual contract archetypes, minimum deal sizes, and whether pricing differs for hardware sale, cloud access and co-development work
  - - Domestic policy alignment is a pure trust advantage
    - USCC and MIT suggest the same state-linked posture that helps in China can complicate foreign trust, export and procurement perceptions
    - high
    - Request export-control review, overseas compliance documentation, and any public-sector procurement restrictions outside China
  - - Early market immaturity protects leaders from competition
    - QED-C and D-Wave show a market with real traction but still fragile supply chains, talent shortages and long sales cycles, which can punish everyone
    - high
    - Pressure-test burn, manufacturing resilience, and conversion from pilots to paid production rather than assuming category growth solves execution risk
  - - Optimization workloads naturally belong to quantum vendors
    - NVIDIA and LightSolver show that AI supercomputers and analog optical accelerators can capture the same budget line without a full quantum stack
    - high
    - Map each Bose use case to its real classical, analog and annealing alternatives before underwriting moat
  - - Photonic peer set is too early to matter commercially
    - Quandela already shows active cloud users and delivery timelines, while ORCA and PsiQuantum are building enterprise application narratives
    - medium
    - Track peer customer disclosures, partner count and deployment pathways quarterly to test whether Bose is leading or just part of a crowded photonic cohort
  notes: Severity ratings are analyst judgments based on retained public evidence. The register focuses on whether Bose can keep differentiation durable once buyers compare access model, trust surface, and substitutes rather than only qubit headlines.
