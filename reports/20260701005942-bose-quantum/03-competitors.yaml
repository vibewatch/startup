- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Offer
  - Public pricing signal
  - Unit / contract model
  - Included capability
  - Unknowns / caveats
  - Implication
  rows:
  - - Bose Quantum hardware + SDK
    - No public list pricing found on retained Bose product or SDK pages
    - Unknown; likely quote-led hardware and service contracting
    - Dedicated photonic hardware, cloud exposure through China Mobile, Kaiwu SDK
    - No public unit pricing, minimum contract, or paid-customer conversion data
    - Harder for outside buyers to benchmark total cost or procurement speed
  - - IBM Quantum Open / PAYG / Flex / Premium / On-Prem
    - Free Open Plan; PAYG at $96 per minute; Flex starts at 400 minutes/year and $72 per minute; Premium starts at 5200 minutes/year and $48 per minute; on-prem by quote
    - Free trial, per-second consumption, annual pre-purchase, annual subscription, or dedicated system
    - Managed runtime access, platform tools, support and optional network membership
    - Meaningful scale still requires premium spend and contracts
    - IBM sets the transparency benchmark for enterprise quantum packaging
  - - D-Wave Leap
    - Public service packaging, uptime and access model; no simple minute-rate card on retained page
    - Cloud-service access to QPUs and hybrid solvers
    - Real-time access, production-grade reliability and optimization workflows
    - Pricing specifics are less explicit on the retained page than IBM or Azure docs
    - Still easier to evaluate commercially than Bose because service and uptime claims are public
  - - Amazon Braket
    - Per-shot plus per-task or hourly reservation pricing is public
    - Consumption-based broker model across multiple QPUs and simulators
    - Consistent development tools, hybrid workflows and dedicated reservations via Braket Direct
    - Specific per-shot prices vary by provider and hardware type
    - Lowers experiment cost of switching among vendors and modalities
  - - Azure Quantum marketplace
    - Marketplace and docs expose partner-defined plans and pricing structures
    - Provider-specific subscription, pay-as-you-go, token, or runtime billing inside one broker surface
    - Access to IonQ, Quantinuum, Rigetti and Pasqal offers
    - Actual price depends on provider, workspace and Azure infrastructure charges
    - Creates side-by-side benchmarking that Bose does not publicly match
  - - Quandela Cloud
    - Flexible pricing options are public, but the retained page does not show a simple universal card
    - Reservation service and platform access from small experiments to enterprise usage
    - QPU access, GPU-enhanced emulation, SDKs/APIs and partner-hosted options
    - Exact rate card is not retained in the reviewed public page
    - More transparent than Bose on access model, less standardized than IBM or Azure
  - - Quantinuum via Azure
    - 'Standard plan: $125,000 per month; Premium plan: $175,000 per month'
    - Monthly subscription with HQC/eHQC usage accounting plus pay-as-you-go option
    - Access to H2 hardware and emulators through Azure Quantum
    - Infrastructure charges apply and workload cost still depends on operation counts
    - Shows how incumbents monetize premium enterprise access in public, not purely by opaque quote
  notes: Rows compare the public packaging surfaces buyers can actually inspect. Some offers disclose exact rates, while others disclose only structure or flexibility; that difference itself is competitively important.
