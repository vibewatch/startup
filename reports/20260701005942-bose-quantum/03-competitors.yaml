  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Bose-specific list prices, minimum contract structures, cloud billing units and discount conventions.
    whyItMatters: Without a concrete pricing surface, it is difficult to compare procurement friction or margin potential against IBM, Azure or D-Wave access models.
    diligencePath: Request current price sheets, sample statements of work and at least three recent deal archetypes split by hardware sale, cloud access and co-development.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: deployment-scale
    missingEvidence: Bose-specific public installed-base counts, paid customer counts and geographic deployment split.
    whyItMatters: Public qubit claims say little about whether Bose has repeatable commercial traction relative to Quandela, D-Wave or IonQ.
    diligencePath: Request a live install base list, paid versus pilot customer counts, and evidence of renewals or follow-on hardware orders.
    relatedQuestionRefs:
    - QP006
    - QP009
  - type: missing-source
    severity: material
    topic: international-trust-posture
    missingEvidence: Public export-control, compliance, sovereign-cloud or foreign procurement documentation tied specifically to Bose.
    whyItMatters: The current trust comparison is inferred from policy context and competitor disclosures rather than from Bose-specific international compliance artifacts.
    diligencePath: Request export-control memos, overseas certifications, named foreign channel partners and any public-sector procurement approvals outside China.
    relatedQuestionRefs:
    - QP021
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Actual Bose customer implementation effort, migration timeline and integration costs compared with cloud-broker alternatives.
    whyItMatters: Public cloud and SDK surfaces imply moderate switching costs, but real lock-in depends on implementation work and contractual structure.
    diligencePath: Interview at least three users or channel partners about onboarding effort, model-porting work, and whether they actively multi-home across vendors.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: china-channel-depth
