- id: moat-durability-trust-and-adverse-evidence
  title: Moat Durability, Trust Posture and Adverse Evidence
  body: 'Bose still has real assets. Its official product page supports room-temperature operation, programmable full connectivity, optimization-oriented performance claims, and integration with China Mobile''s cloud ecosystem. USCC and MIT also support the idea that China''s state-coordinated quantum buildup can help a domestic company secure policy attention, talent, and early infrastructure partners. But those same policy dynamics cut both ways. MIT says the U.S. remains the front-runner in commercialization because of QPU diversity, while USCC frames China''s quantum rise through a national-strategic lens that can complicate cross-border trust. Public evidence also argues against overconfidence in market readiness. QED-C says the market is still only $1.9 billion overall, with a fragile supply chain and insufficient talent, and D-Wave''s filing says even one of the sector''s more commercial vendors still worries about sales-cycle acceleration and margin pressure. Physics World adds a
    sharper adverse signal: Baidu and Alibaba both stepped back from direct quantum-hardware research. The upshot is that Bose''s moat looks conditional rather than durable by default. It may be strongest in domestic strategic accounts that value China-linked deployment, but it is vulnerable to cloud-mediated comparison, incumbent ecosystem power, substitute accelerators, and the possibility that photonic claims become easier to commoditize than customer trust.'
