- id: pricing-distribution-and-switching-costs
  title: Pricing, Distribution and Switching Costs
  body: Pricing transparency is one of the clearest places where Bose lags the public benchmark. Bose's product and SDK surfaces show hardware classes and tooling, but not list pricing, consumption pricing, minimum contracts, or any disclosed paid-customer unit economics. By contrast, IBM publishes minute-based plans, AWS Braket explains shot, task, and reservation billing, and Azure Quantum exposes partner-specific plans from IonQ, Quantinuum, Rigetti, and Pasqal. Quandela does not fully post a simple list card either, but it at least advertises flexible pricing, reservation services, and active cloud usage. That asymmetry matters because buyers do not make quantum decisions on architecture alone; they compare access model, budget line, procurement friction, integration path, and reversibility. Multi-homing is increasingly normal. A buyer can use AWS or Azure to test multiple modalities, work with IBM or D-Wave for more mature managed access, or stay on a substitute stack such as NVIDIA
    or LightSolver while continuing to evaluate quantum. Switching costs therefore look moderate, not absolute. They become higher only when a team commits to workflow-specific tooling, sovereign or on-prem deployment, or a long-term enterprise program. Bose may still win in China where channel trust and local alignment matter more, but outside that context its opaque pricing and narrower public distribution proof weaken lock-in.
