company:
  name: Creatio
chapter:
  number: 8
  title: Valuation
  summary: >-
    Creatio's last independently reported priced financing was a $200 million minority
    round at a $1.2 billion valuation in June 2024. Strong reported growth and partner-led
    distribution support the thesis, but absent public ARR, retention, margin, cap-table,
    and current transaction evidence make a fresh valuation range unsupported and keep the
    recommendation at research-more.
sections:
  - id: recommendation-and-thesis
    title: Recommendation, Thesis, and Anti-Thesis
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and a
      stretched valuation stance relative to the evidence available publicly. The positive
      case is credible rather than conclusive: Reuters reported that revenue had increased
      50% annually for several years, while Creatio later claimed 45% year-over-year
      top-line growth for 2024. Management also told Reuters that the company was cash-flow
      break-even, and both company and press accounts describe a partner channel that
      contributes about half of the business. Those signals support operating momentum and
      capital efficiency. The anti-thesis is that Reuters also said the company was not yet
      profitable, the sampled fundraising materials omit ARR, NRR, and unit-economics
      detail, and Creatio competes in a crowded category that includes Salesforce, HubSpot,
      and Freshworks. Without denominators, growth claims cannot establish that the last
      private mark—or any current asking price—offers an adequate return.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV013
      - CV015
      - CV016
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: financing-and-entry-discipline
    title: Financing Context and Entry Discipline
    body: >-
      The firm and multiple independent publications agree on the core June 2024 event:
      Creatio raised $200 million at a $1.2 billion valuation, led by Sapphire Ventures
      with StepStone Group, Volition Capital, and Horizon Capital participating. Creatio
      described it as a minority investment, which limits what can be inferred about
      control but does not disclose preference seniority, liquidation rights, or dilution.
      Tracxn currently reports $278 million of total funding across three rounds and lists
      an additional $9.53 million Series D transaction dated May 29, 2025. That database
      observation is useful as a freshness signal, not proof of cash available or current
      fair value. The $1.2 billion figure is therefore a historical transaction mark, not
      a present valuation. Entry discipline should require the current fully diluted
      capitalization, security terms, cash balance, and audited operating metrics before
      assigning a price or target return.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV014
      - CV015
  - id: scenarios-and-comparables
    title: Scenario Logic and Comparable Evidence
    body: >-
      Public evidence supports qualitative scenarios, not numerical valuation ranges or
      probability weights. In the bull case, recent growth proves durable, partner-led
      distribution scales efficiently, and the investment in AI, no-code, and global
      expansion converts into independently verified retention and cash generation. The
      base case preserves growth but leaves the return case unresolved until ARR, gross
      margin, NRR, and security terms are disclosed. In the bear case, growth slows,
      competition intensifies, or the gap between cash-flow break-even and accounting
      profitability persists, exposing investors to multiple compression or a down round.
      Tracxn identifies public CRM peers, but the assigned evidence contains no
      period-matched peer revenue, growth, margin, or market-value dataset. Those names are
      a diligence set, not a defensible multiple benchmark. No scenario is assigned a
      valuation range because doing so would manufacture the missing denominator.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV009
      - CV012
      - CV013
      - CV014
      - CV015
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence
    title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
    body: >-
      The $200 million minority financing and institutional investor roster demonstrate
      access to growth capital, but the public record does not disclose an IPO timetable,
      acquisition process, secondary-market mark, or investor liquidity rights. Exit
      readiness is therefore unverified. The next diligence step is a data-room review of
      audited revenue recognition, ARR bridges, gross margin, cohort retention, customer
      concentration, cash and burn, debt, and the full preference stack. Management should
      reconcile the reported 2025 financing entry and distinguish accounting profitability
      from cash-flow break-even. Thesis-break triggers are evidence based rather than
      numerically invented: material growth deceleration, weakening retention or partner
      productivity, sustained accounting losses without improving cash generation, a
      senior preference overhang that absorbs realistic exit proceeds, or a financing
      below the 2024 mark. Verified current fundamentals or a meaningfully lower,
      cleanly structured entry price could move the recommendation; marketing milestones
      alone should not.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV011
      - CV014
      - CV015
      - CV016
tables:
  - id: TV001
    title: Recommendation Summary
    columns:
      - Decision dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Reported growth and a substantial institutional round are positive, but valuation denominators are missing
        - Do not underwrite a new investment before financial and security-term diligence
      - - Confidence
        - medium
        - The 2024 financing is well corroborated; current operating and pricing evidence is not
        - Treat the conclusion as price-sensitive and updateable
      - - Risk rating
        - high
        - No audited public financials, retention cohorts, customer concentration, or preference stack
        - Require downside protection and complete data-room access
      - - Valuation stance
        - stretched
        - The $1.2B historical mark cannot be tested against public ARR, margin, or NRR
        - Do not convert a financing headline into a current fair-value estimate
      - - Target return and hold period
        - not supportable publicly
        - Entry price, dilution, preference rights, and exit timing are undisclosed
        - Set return and duration only after terms and exit pathways are verified
    notes: >-
      Assessments use the last corroborated financing mark and explicitly treat missing
      operating denominators, transaction terms, target return, and hold period as gaps.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV015
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Lens
      - Thesis evidence
      - Anti-thesis or uncertainty
      - What would change the view
    rows:
      - - Growth
        - Reuters reported 50% annual revenue growth for several years; Creatio claimed 45% growth in 2024
        - ARR, organic growth reconciliation, and cohort durability are not public
        - Audited ARR bridges and repeatable growth with stable retention
      - - Capital efficiency
        - Management told Reuters the company was cash-flow break-even
        - Reuters separately reported that the company was not yet profitable
        - Audited cash-flow and income statements reconciling both measures
      - - Distribution
        - Company and press accounts say partners contribute about half of business
        - Partner concentration, sourced pipeline, and economics are undisclosed
        - Partner-level bookings, retention, and contribution-margin evidence
      - - Product and demand
        - The company claims thousands of clients and millions of automated workflows
        - Company-issued scale language lacks period, denominator, and independent verification
        - Customer-level usage, renewal, and realized-value cohorts
      - - Competition
        - No-code CRM and workflow breadth creates multiple expansion paths
        - Independent sources identify large public CRM competitors and thousands of active alternatives
        - Sustained win rates and retention against named enterprise incumbents
    notes: >-
      The table separates reported or company-claimed evidence from missing proof; it does
      not treat marketing scale statements as independently verified operating metrics.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV012
      - CV013
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger or confirming evidence
    rows:
      - - Bull
        - Recent growth persists; partner scale converts to durable retention and cash generation
        - Upside cannot be quantified until ARR, margin, dilution, and entry terms are verified
        - Not assignable from public evidence
        - Independently verified NRR, margins, and efficient enterprise expansion
      - - Base
        - Growth moderates while the business remains cash-flow disciplined
        - The 2024 mark is only a reference point; current fair value remains unpriced
        - Not assignable from public evidence
        - Audited financials support the mark and a clean preference structure
      - - Bear
        - Growth or partner productivity weakens and accounting losses persist
        - Multiple compression or a down round could impair common-equity returns
        - Not assignable from public evidence
        - Financing below the 2024 mark or senior preferences absorbing plausible proceeds
    notes: >-
      Scenarios are qualitative because the assigned public sources do not disclose ARR,
      NRR, gross margin, current security terms, entry price, or a period-matched comp set.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV009
      - CV015
      - CV016
