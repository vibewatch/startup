callouts:
  - calloutType: recommendation
    title: Price Is the Missing Decision Variable
    body: >-
      A strong company can still be a poor investment at the wrong terms. Creatio's
      reported growth and financing quality justify continued diligence, but no public
      evidence supports a fresh valuation range, target return, or hold period.
    claimRefs:
      - CV001
      - CV002
      - CV015
      - CV016
