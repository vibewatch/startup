  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Creatio competes at the intersection of customer relationship management (CRM), low-code/no-code
              application platforms (LCAP), and agentic workflow orchestration. Defining the market boundary requires
              distinguishing core addressable spend from adjacent software categories and traditional internal
              development alternatives. In scope is enterprise software expenditure allocated to front-office customer
              engagement—spanning sales force automation, marketing campaign workflows, and service case
              management—alongside operational business process automation that citizen developers or IT teams configure
              without heavy custom engineering.


              Conversely, excluded spend comprises generic horizontal infrastructure, database layers, specialized
              back-office enterprise resource planning (ERP) ledgers, and standalone point solutions such as basic
              self-service helpdesks designed purely for micro-businesses. In enterprise environments, the most
              entrenched status-quo substitute is not another cloud CRM suite, but rather fragmented legacy
              architectures: decades-old on-premise custom relational databases, brittle script-based middleware
              integrations, and manual spreadsheet trackers. Incumbent suites like Salesforce or Microsoft Dynamics 365
              frequently encounter enterprise resistance due to escalating per-seat costs, complex multi-cloud
              maintenance, and rigid upgrade cycles, opening opportunities for modern composable platforms.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: TAM, SAM, and Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Market sizing for Creatio must be assessed through multiple analytical lenses rather than a single
              monolithic estimate. Broad industry projections frequently cite total CRM market spend exceeding $80
              billion globally and expanding at a compound annual growth rate (CAGR) of 10% to 14%, alongside low-code
              development platforms representing an additional $30 billion to $45 billion aggregate market. However,
              such top-line TAM aggregates inflate realistic platform capture because they lump together consumer-facing
              mass helpdesks, transactional email utilities, and highly commoditized small-business contact lists.


              A disciplined service addressable market (SAM) focuses strictly on mid-market and enterprise organizations
              with 250 to 10,000+ knowledge workers requiring integrated sales, marketing, and service automation across
              complex B2B workflows. Under this constraint, the addressable opportunity represents approximately $18
              billion to $24 billion globally. Within this sphere, Creatio's immediate serviceable obtainable market
              (SOM) is governed by organizations undergoing legacy stack modernizations in regulated and high-touch
              verticals—such as financial services, insurance, manufacturing, and specialized distribution—seeking
              flexible AI-native workflow architectures. The company's reported bookings momentum, reaching 255% of
              prior-year levels in early FY27, demonstrates measurable demand within this focused target layer.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
