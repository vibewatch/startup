      - number: '2.3'
        title: Buyer Personas, Budget Ownership, and Commercial Packaging
        blocks:
          - type: paragraph
            body: >-
              Adoption paths and commercial packaging reflect distinct economic buyers across lines of business and
              central IT leadership. In mid-market organizations, purchasing decisions are frequently co-sponsored by
              the Chief Commercial Officer (or VP of Sales/Marketing) and the Chief Information Officer (CIO), driven by
              the desire to consolidate fragmented point tools into a unified operating interface. In larger enterprise
              tiers, enterprise architects and business operations executives lead technical diligence to ensure
              security governance, custom data model extensibility, and seamless integration with legacy ERP backends.


              Creatio's commercial model historically combined per-user licensing starting around $40 per user monthly
              with product add-ons, but the platform's strategic introduction of an "Unlimited" pricing tier marks a
              deliberate structural shift. By eliminating per-seat metering across users, applications, workflows,
              agents, and API calls, the packaging directly targets enterprise frustration with traditional vendor tax
              models. However, economic buyers must account for the reality that AI execution is not included in base
              platform costs; AI capabilities are metered via annual AI Action packages ranging from $5,000 for entry
              tiers up to $125,000+ for enterprise-scale deployments, shifting the procurement conversation from
              headcount forecasts to projected automated workflow velocity.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Structural Growth Drivers, Switching Friction, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Several secular tailwinds accelerate enterprise consideration of modern workflow platforms. Primary
              drivers include surging corporate demand for agentic automation, widespread dissatisfaction with
              cumulative legacy licensing expenses, and executive prioritization of no-code configurability to relieve
              strained software development backlogs. Independent analyst validations—such as recognition as a Strong
              Performer in The Forrester Wave: Customer Service Solutions Q1 2026 and Visionary status in CRM sales
              evaluations—provide institutional risk mitigation for conservative enterprise procurement committees.


              Conversely, substantial adoption constraints govern enterprise deployment velocity. Mission-critical CRM
              and case management systems carry severe data migration friction, intricate regulatory compliance
              requirements (especially across banking and healthcare), and substantial change-management inertia.
              Transitioning mission-critical operations away from legacy incumbents demands thorough proof-of-concept
              validation and extensive systems-integrator mobilization. Furthermore, critical diligence gaps persist
              regarding Creatio's unverified churn metrics, customer concentration levels, and the long-term cost
              predictability of high-frequency AI action consumption across production workflows.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Strategic Decoupling of Seat Licensing and AI Monetization
            body: >-
              Creatio's "Unlimited" model represents a structural departure from incumbent seat-tax licensing, allowing
              enterprises to scale users without marginal software penalties. However, because AI Actions remain metered
              separately under annual tiers ranging from $5,000 to over $125,000, enterprise procurement teams must
              transition from forecasting headcounts to estimating process execution volumes.
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
              - CM013
          - type: callout
            title: Legacy Incumbent Stickiness and Data Migration Moats
            body: >-
              While enterprise buyers express growing fatigue with expensive legacy platforms, actual migration
              timelines remain extended. Incumbents maintain defensive moats through deeply embedded custom code,
              decades of historical transaction records, and complex compliance integrations that require multi-quarter
              deployment cycles.
            calloutType: risk
            claimRefs:
              - CM004
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Creatio competes across two overlapping categories rather than within a single clean peer set: enterprise
              CRM and workflow/no-code automation. Reuters explicitly framed Salesforce as a competitor, while the
              allocated comparison sources place HubSpot, Kissflow, SharpSpring, FlowForma, and BuildWithHQ against
              different parts of the same buying decision. HubSpot is the clearest broad-suite alternative for buyers
              that favor ease of adoption, a free entry point, and a larger integration ecosystem. Kissflow and
              FlowForma attack workflow automation with simpler or differently packaged models; BuildWithHQ targets
              teams that want to own a differentiated SaaS operating model. Salesforce remains the incumbent benchmark,
              although this pool does not provide a current feature or pricing comparison. Internal build and status-quo
              manual processes are economically relevant substitutes, but the allocated evidence does not quantify their
              use, win rates, or total cost. The positioning map is therefore an ordinal synthesis of disclosed product
              emphasis, not an independent market benchmark.
            claimRefs:
