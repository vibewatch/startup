      - number: '1.3'
        title: Capitalization History, Valuation Benchmarks, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Between 2014 and early 2021, Creatio operated as a self-sustaining entity without institutional outside
              equity, maintaining cash discipline that shaped its capital-efficient operating profile. In early 2021,
              the company completed its first outside institutional funding round of $68M, followed in June 2024 by a
              $200M minority financing round led by Sapphire Ventures with participation from StepStone Group, Volition
              Capital, and Horizon Capital that established a $1.2B post-money valuation. While leadership reported
              consistent 40% to 50% year-over-year top-line expansion and operational cash-flow break-even discipline,
              Creatio is not yet turning an accounting profit according to Reuters financial reporting. Key corporate
              metrics including annual recurring revenue (ARR), gross profit margins, and net retention rates remain
              undisclosed private company figures, requiring institutional investors to verify cap table seniority,
              liquidation preferences, and secondary market pricing during formal diligence.
