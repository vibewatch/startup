      - number: '3.2'
        title: Capability, distribution, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Creatio's strongest differentiation is the combination of CRM, process automation, no-code application
              development, and increasingly governed AI-agent functionality. Its 8.3.1 changelog provides direct
              technical evidence of an analytics agent and more granular agent execution permissions, which is stronger
              evidence of shipping velocity than general marketing language. The tradeoff is implementation intensity:
              competitor comparisons repeatedly describe deeper BPMN and customization capability alongside a steeper
              learning curve, greater admin involvement, and performance or mobile friction. Distribution partly offsets
              that complexity. Creatio reported 250 new partnerships in 2024 and said Deloitte Digital would establish a
              center of excellence and enable 1,000 experts. Those are company-issued expansion claims, not proof of
              partner productivity, customer outcomes, or deployment quality. Trust posture also remains source-limited:
              the pool reports compliance and deployment distinctions, but it contains no independent control audit or
              comparative implementation-success dataset.
            claimRefs:
              - CP001
