    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Key corporate, financing, product, and architectural milestones in Creatio's progression from bootstrapped
      platform to $1.2B AI-native enterprise automation platform.
    data:
      items:
        - date: '2014-10-01'
          label: Corporate Founding
          detail: >-
            Katherine Kostereva establishes Creatio with a small founding team, launching a bootstrapped no-code CRM
            platform.
          tone: neutral
          claimRefs:
            - CO003
        - date: '2019-12-31'
          label: Bootstrap Sustainability
          detail: Company completes five consecutive years of self-funded operations supported solely by client revenue.
          tone: positive
          claimRefs:
            - CO006
        - date: '2021-02-28'
          label: Series A Growth Financing
          detail: Creatio raises $68M in its first external funding round co-led by Volition Capital and Horizon Capital.
          tone: positive
          claimRefs:
            - CO013
        - date: '2024-06-26'
          label: Unicorn Financing ($1.2B Valuation)
