  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Creatio monetizes its AI-native workflow automation and CRM platform primarily through annual recurring
              subscription software licenses, complemented by marketplace application revenue distribution and partner
              program attach fees. The platform combines core CRM modules—Creatio Sales, Creatio Marketing, and Creatio
              Service—with Studio Creatio and the Bank.AI industry suite. List pricing and platform tiers are designed
              around composable components and an Unlimited enterprise model intended to reduce user-seat friction,
              while marketplace applications are distributed through a defined revenue-sharing formula where Creatio
              receives between 20% and 40% of marketplace product sales and no less than 40% of base product list prices
              after partner discounts. While enterprise demand has driven multi-product adoption, actual realized net
              pricing and average contract values (ACVs) are negotiated under non-public multi-year enterprise
              agreements.
