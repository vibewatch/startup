chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Creatio operates as a private enterprise software vendor headquartered in Boston, Massachusetts,
              delivering an AI-native no-code platform designed to converge customer relationship management (CRM) and
              autonomous workflow orchestration. Founded in 2014 by Chief Executive Officer Katherine Kostereva
              following her leadership of predecessor enterprise software firm TS and early career tenure at IBM,
              Creatio developed a composable application architecture that enables business analysts and IT teams to
              assemble and execute workflows without traditional code. The platform integrates core CRM pillars across
              sales force automation, marketing automation, and customer service with out-of-the-box autonomous agent
              capabilities, prebuilt industry workflow templates, and an AI Command Center. Creatio monetizes through
              enterprise software-as-a-service (SaaS) subscriptions and marketplace add-ons, deploying a hybrid
              go-to-market approach combining direct enterprise sales with a partner ecosystem spanning over 550 systems
              integrators, regional consultancies, and strategic alliances including Deloitte Digital.
