  - id: FV001
    title: Recommendation Logic
    type: flow
    summary: >-
      Evidence moves from a corroborated financing mark through operating proof and unresolved pricing inputs to a
      research-more decision.
    data:
      nodes:
        - id: financing-mark
          label: Historical financing mark
          detail: $200M minority raise at a $1.2B valuation in June 2024
        - id: growth-proof
          label: Reported operating momentum
          detail: 50% annual growth reported by Reuters; 45% 2024 growth claimed by Creatio
        - id: profitability-gap
          label: Profitability distinction
          detail: Management claimed cash-flow break-even while Reuters reported no profit
        - id: disclosure-gap
          label: Missing valuation denominators
          detail: No public ARR, NRR, gross margin, cap table, or current transaction terms
        - id: price-discipline
          label: Price discipline
          detail: Historical mark is not a current fair-value range
        - id: decision
          label: Recommendation
          detail: Research-more until operating proof and security terms are verified
      edges:
        - from: financing-mark
          to: growth-proof
        - from: growth-proof
          to: profitability-gap
        - from: profitability-gap
          to: disclosure-gap
        - from: disclosure-gap
          to: price-discipline
        - from: price-discipline
          to: decision
    approximationNotes: >-
      The flow is a qualitative decision sequence and does not imply numerical conversion rates, probabilities, or a
      current valuation.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV009
      - CV015
      - CV016
