  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview and Architectural Foundation
        blocks:
          - type: paragraph
            body: >-
              Creatio positions its enterprise software as an AI-native CRM and workflow automation platform where human
              workers and autonomous AI agents collaborate across customer-facing and operational processes. At the
              foundation of the platform lies Studio Creatio, a composable no-code environment that decouples base
              platform configuration packages from customer customizations. Rather than modifying core codebase files,
              user-built extensions and configurations replace base configuration element schemas, preserving forward
              API and application compatibility across platform updates. The platform is architected as a set of
              autonomous microservices built on modern .NET runtime components, offering flexible deployment models that
              accommodate both cloud SaaS environments and on-premises enterprise data centers. Studio Creatio
              incorporates an intuitive BPMN 2.0-compliant visual Process Designer, the modern Freedom UI Designer for
              page creation, and an Application Designer that allows non-technical business users to assemble functional
              applications using natural-language prompts and pre-built components.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE013
              - CE014
      - number: '5.2'
        title: Core CRM Applications and AI Studio Capabilities
        blocks:
          - type: paragraph
            body: >-
              Creatio's commercial application suite is organized around dedicated functional modules that address the
              end-to-end customer lifecycle while sharing the underlying workflow engine. The primary commercial
              applications include Creatio Sales for pipeline and opportunity orchestration, Creatio Marketing for
              multi-channel lead generation and journey automation, and Creatio Service for customer support and case
              management. In addition to horizontal CRM offerings, Creatio packages specialized vertical solutions, such
              as Bank.AI, tailored for retail banks, credit unions, and insurance providers. AI functionality is unified
              through Creatio AI Studio and the Creatio.ai engine, which embed predictive, generative, and agentic AI
              capabilities directly into CRM workflows. Creatio Energy 8.2 expanded this capability by launching the AI
              Command Center with over twenty pre-packaged AI skills and multi-model connectivity to external foundation
              models, including OpenAI, Anthropic Claude, and Google Gemini. Ecosystem connectors from the Creatio
              Marketplace, such as Photon Commerce for automated document extraction, further extend module
              functionality into specialized back-office workflows.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE010
              - CE012
          - type: table
            tableRef: TE001
