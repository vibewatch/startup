      - number: '1.2'
        title: Leadership Team, Governance, and Workforce Scaling
        blocks:
          - type: paragraph
            body: >-
              Creatio's governance and operational execution remain centered around founder and Chief Executive Officer
              Katherine Kostereva, who has maintained strategic leadership of the platform since its 2014 inception and
              holds long-tenured software leadership experience dating back to 2002. Following an initial five-year
              bootstrapped operating phase where product development and headcount growth were funded entirely through
              client software revenues, Creatio expanded its executive bench across corporate strategy, financial
              management, enterprise sales, and platform architecture. Institutional governance formalized in June 2024
              with the appointment of Sapphire Ventures Managing Director Rajeev Dham to Creatio's Board of Directors
              following its Series B funding round. Operationally, the company expanded from 700 employees across seven
              global offices in mid-2024 to approximately 1,000 employees across ten offices by mid-2026, maintaining
              international operations across Europe, Poland, and Ukraine alongside its United States corporate
              headquarters.
