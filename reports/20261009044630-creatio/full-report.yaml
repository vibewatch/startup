      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public comparison evidence indicates that Creatio combines platform and module charges, with cost rising
              as buyers add users, CRM modules, governance, support, storage, or implementation services. ZoomInfo
              reports a $25-per-user monthly platform starting point plus $15 per CRM module and a $10,000 annual
              minimum; RFP.wiki instead describes platform access starting at $40 per user per month. The difference may
              reflect package definitions rather than a true contradiction, so neither figure should be treated as a
              realized customer price. A FlowForma scenario estimates about $41,000 annually for a 30-user, three-module
              deployment after specified support and limited-user assumptions, explicitly excluding AI tokens, training,
              and integration. Process redesign, custom logic, integrations, and administrator training plausibly create
              switching costs once Creatio is embedded, but APIs and a partner ecosystem also permit multi-homing. The
              moat is therefore implementation- and ecosystem-led, not proven by proprietary data or an independently
              measured performance advantage. Product convergence in AI agents and no-code tooling remains the principal
              commoditization risk.
            claimRefs:
              - CP006
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
