company:
  name: Creatio
chapter:
  number: 1
  title: Company Overview
  summary: "Creatio is a Boston-headquartered AI-native no-code platform providing CRM and workflow automation across sales, marketing, service, and regulated industry workflows. Bootstrapped from 2014 before raising institutional venture capital, the company attained a $1.2B valuation in June 2024 via a $200M minority financing round led by Sapphire Ventures, scaling to 1,000 employees globally by 2026 while maintaining cash-flow break-even operations despite lacking audited public denominator disclosures."
sections:
  - id: corporate-identity-and-operating-model
    title: Corporate Identity, Architecture, and Business Model
    body: "Creatio operates as a private enterprise software vendor headquartered in Boston, Massachusetts, delivering an AI-native no-code platform designed to converge customer relationship management (CRM) and autonomous workflow orchestration. Founded in 2014 by Chief Executive Officer Katherine Kostereva following her leadership of predecessor enterprise software firm TS and early career tenure at IBM, Creatio developed a composable application architecture that enables business analysts and IT teams to assemble and execute workflows without traditional code. The platform integrates core CRM pillars across sales force automation, marketing automation, and customer service with out-of-the-box autonomous agent capabilities, prebuilt industry workflow templates, and an AI Command Center. Creatio monetizes through enterprise software-as-a-service (SaaS) subscriptions and marketplace add-ons, deploying a hybrid go-to-market approach combining direct enterprise sales with a partner ecosystem spanning over 550 systems integrators, regional consultancies, and strategic alliances including Deloitte Digital."
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
  - id: leadership-governance-and-operating-scale
    title: Leadership Team, Governance, and Workforce Scaling
    body: "Creatio's governance and operational execution remain centered around founder and Chief Executive Officer Katherine Kostereva, who has maintained strategic leadership of the platform since its 2014 inception and holds long-tenured software leadership experience dating back to 2002. Following an initial five-year bootstrapped operating phase where product development and headcount growth were funded entirely through client software revenues, Creatio expanded its executive bench across corporate strategy, financial management, enterprise sales, and platform architecture. Institutional governance formalized in June 2024 with the appointment of Sapphire Ventures Managing Director Rajeev Dham to Creatio's Board of Directors following its Series B funding round. Operationally, the company expanded from 700 employees across seven global offices in mid-2024 to approximately 1,000 employees across ten offices by mid-2026, maintaining international operations across Europe, Poland, and Ukraine alongside its United States corporate headquarters."
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
    tableRefs:
      - TO002
  - id: capitalization-and-milestone-chronology
    title: Capitalization History, Valuation Benchmarks, and Diligence Realities
    body: "Between 2014 and early 2021, Creatio operated as a self-sustaining entity without institutional outside equity, maintaining cash discipline that shaped its capital-efficient operating profile. In early 2021, the company completed its first outside institutional funding round of $68M, followed in June 2024 by a $200M minority financing round led by Sapphire Ventures with participation from StepStone Group, Volition Capital, and Horizon Capital that established a $1.2B post-money valuation. While leadership reported consistent 40% to 50% year-over-year top-line expansion and operational cash-flow break-even discipline, Creatio is not yet turning an accounting profit according to Reuters financial reporting. Key corporate metrics including annual recurring revenue (ARR), gross profit margins, and net retention rates remain undisclosed private company figures, requiring institutional investors to verify cap table seniority, liquidation preferences, and secondary market pricing during formal diligence."
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs:
      - TO003
    figureRefs:
      - FO001
