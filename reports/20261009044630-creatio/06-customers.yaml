figures:
  - id: "FU001"
    title: "Customer Adoption and Expansion Path"
    type: "journey-map"
    summary: "An evidence-bounded customer journey from enterprise fit through implementation and expansion, ending with the retention proof still required."
    data:
      items:
        - label: "Enterprise fit"
          detail: "Midsize and large organizations evaluate CRM and operational-workflow needs."
          touchpoints:
            - "Sales, service, marketing, and operations workflows"
            - "Industry and governance requirements"
        - label: "Use-case selection"
          detail: "A department or cross-functional process becomes the initial deployment scope."
          touchpoints:
            - "Customer-facing workflow"
            - "Internal operational workflow"
        - label: "Implementation"
          detail: "Partner guidance indicates an 8-16 week standard mid-market range and longer complex-enterprise programs."
          touchpoints:
            - "Process design"
            - "Integration and migration"
            - "Training and user acceptance"
        - label: "Operational adoption"
          detail: "Named cases report active users, workflow volume, or business outcomes after deployment."
          touchpoints:
            - "User adoption"
            - "Lead, service, or case workflow"
        - label: "Expansion"
          detail: "Creatio attributes growth to larger enterprise accounts, broad usage, and channel-assisted scaling."
          touchpoints:
            - "$1M+ ARR account expansion"
            - "Additional departments and workflows"
        - label: "Durability check"
          detail: "Renewal, retention, churn, contract duration, and concentration must be verified privately."
          touchpoints:
            - "NRR and GRR"
            - "Logo churn and cohort retention"
            - "Top-customer ARR concentration"
    approximationNotes: "This is an analytical sequence, not a measured conversion funnel. It does not imply conversion rates, uniform timing, or that every customer follows the same path."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
      - "CU011"
      - "CU014"
      - "CU015"
callouts:
  - calloutType: "risk"
    title: "Retention and Concentration Remain Unproven"
    body: "Named deployments and company-reported bookings growth establish adoption signals, not durability. The assigned public sources provide no NRR, GRR, logo churn, renewal-rate, contract-duration, cohort, or top-customer concentration data. Investor diligence should obtain those metrics directly and reconcile them to the reported growth in $1M+ ARR accounts."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU013"
  - calloutType: "insight"
    title: "Implementation Evidence Cuts Both Ways"
    body: "Named cases report rapid deployments, but partner guidance still describes multi-week to multi-month implementation programs and a competitor alleges IT and training friction. The competitor source is useful as adverse discovery, not as an independent benchmark; customer references and implementation data should be tested directly."
    claimRefs:
      - "CU007"
      - "CU011"
      - "CU012"
      - "CU015"
