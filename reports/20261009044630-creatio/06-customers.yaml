company:
  name: "Creatio"
chapter:
  number: 6
  title: "Customers"
  summary: "Creatio has credible enterprise adoption signals across multiple industries and named deployments, while company disclosures point to recent growth in bookings and $1M+ ARR accounts. The public evidence does not disclose exact active-customer counts, retention, churn, contract duration, or customer concentration, so durability and revenue quality remain material diligence gaps."
sections:
  - id: "customer-segments"
    title: "Customer Segments and Buying Context"
    body: "Creatio's disclosed customer focus is midsize and large organizations rather than lightweight small-business CRM deployments: the company describes midsize and enterprise use, and Reuters independently characterized its customers as middle-to-large enterprises [CU001]. The official product guide spans customer-facing and operational workflows across more than 20 industries, including financial services, manufacturing, public service, and telecommunications [CU002]. Public materials identify end users in sales, service, marketing, operations, and regulated workflows, but they rarely identify the economic buyer or payer. That omission matters because the cost center, approval authority, and procurement path may differ between a departmental CRM purchase and an enterprise-wide automation program. Table TU001 therefore distinguishes disclosed use cases and scale from buyer roles that remain unverified."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-expansion"
    title: "Adoption Trajectory and Expansion Signals"
    body: "Creatio's August 2026 company-issued release says the platform serves thousands of organizations in more than 100 countries [CU003]. In the same release, Creatio reported first-quarter FY27 bookings at 255% of the prior-year level and said the number of customers with at least $1M in ARR doubled over the preceding year [CU004, CU005]. These metrics indicate commercial momentum, but neither gives an absolute bookings value, starting cohort, ending account count, or bridge between new logos and expansion. A separate company release reported 59% year-over-year revenue growth during 2024 for banks, credit unions, and insurance institutions [CU006]. Because these are company claims rather than audited customer telemetry, they support directional adoption analysis but not a precise active-customer count or retention conclusion."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof"
    title: "Named Deployments and Reference Quality"
    body: "The strongest public proof is a set of named deployments with operating metrics. Creatio materials and ERP Research describe Howdens deploying in 12 weeks, Purplebricks improving lead volume and conversion, BSN SPORTS reporting full sales-team adoption and sales growth, and the City of Boston running a 311 service on the platform [CU007, CU008, CU009, CU010]. These examples span manufacturing and retail, real estate, sporting goods, and public services, which reduces the risk that adoption is confined to one vertical. However, ERP Research explicitly says its figures summarize Creatio's own customer stories and are not independently verified [CU013]. The evidence therefore supports named use and reported outcomes, but not causal attribution, representative cohort performance, renewal, or proof that every deployment remains active."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "durability-and-friction"
    title: "Durability, Delivery Dependence, and Friction"
    body: "Public sources do not provide NRR, GRR, logo churn, renewal rates, contract duration, cohort retention, or top-customer concentration. Those omissions prevent a direct assessment of revenue durability and dependence on a small number of large accounts. Available implementation evidence also points to meaningful delivery work: a Creatio implementation partner describes 8-16 weeks for standard mid-market projects and 4-8 months for complex enterprise deployments [CU011]. A competitor-authored comparison alleges that advanced configuration, training, licensing, and IT dependence can burden smaller organizations; this is adverse evidence but not an independent benchmark [CU012]. ERP Research likewise cautions that case-study outcomes are vendor claims [CU013]. Creatio says channel partners help customers design, deploy, and scale workflows, making partner capacity an important expansion mechanism and a diligence dependency [CU014]."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
