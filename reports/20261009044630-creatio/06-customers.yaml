        - "Official guide reports 700 users, four months to launch, and more than 1,000 requests daily; ERP Research reports 50% of 311 calls routed through Creatio within months"
        - "Metrics come from vendor stories and use different operating denominators"
    notes: "This is a representative sample, not a customer census. ERP Research states that the figures summarize Creatio's own customer stories and are not independently verified; production wording is limited to what the reviewed pages describe."
    enumerationScope:
      coverage: "sample"
