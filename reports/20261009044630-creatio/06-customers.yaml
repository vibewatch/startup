  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-retention"
      missingEvidence: "NRR, GRR, logo churn, renewal rates, contract duration, and cohort retention by segment and customer vintage."
      whyItMatters: "Bookings growth and named outcomes do not establish recurring-revenue durability or show whether expansion offsets customer losses."
      diligencePath: "Request board-level customer cohort schedules and reconcile beginning ARR, new logos, expansion, contraction, churn, and ending ARR to audited revenue."
      relatedQuestionRefs:
        - "QU004"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Top-1, top-5, and top-10 customer ARR concentration; channel-sourced ARR; vertical mix; and absolute count of $1M+ ARR customers."
      whyItMatters: "A doubling in large accounts can coexist with material dependence on a small group of enterprise customers or implementation partners."
      diligencePath: "Obtain an anonymized customer ARR ledger with customer, vertical, geography, channel, contract end date, and renewal status."
      relatedQuestionRefs:
        - "QU006"
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "named-customer-proof"
      missingEvidence: "A complete customer census that includes inactive, churned, failed, and pilot-only deployments rather than selected references."
      whyItMatters: "A reference sample can demonstrate use but cannot establish representative outcomes, deployment success rate, or current production status."
      diligencePath: "Request a complete anonymized deployment register and independently reference-check a stratified sample of active, renewed, and churned accounts."
      relatedQuestionRefs:
        - "QU008"
