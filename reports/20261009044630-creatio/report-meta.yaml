companyProfile:
  summary: >-
    Creatio is a Boston-headquartered private enterprise software vendor that combines no-code CRM, workflow automation,
    and AI-assisted process design for sales, marketing, service, and operational workflows. The company operated for
    years as a bootstrapped business before taking outside capital, and it now markets an AI-native platform with a
    partner-led distribution model and broad enterprise adoption signals, while still leaving key financial and
    cap-table denominators undisclosed.
