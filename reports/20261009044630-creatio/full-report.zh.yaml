      - number: '7.3'
        title: 运营可靠性、安全架构与地缘政治因素
        blocks:
          - type: paragraph
            body: >-
              Creatio 的运营风险集中在系统可靠性、脚本执行边界以及技术人员的地缘集中。Creatio 8.3.4 版本增强了安全架构：AI Tool
              脚本任务默认在调用用户的上下文中执行，而不是以特权系统上下文执行，直接缩小了意外权限提升的攻击面。自主代理执行仍有架构限制：若不手动配置，活动创建代理不会自动解决复杂多分支工作流或条件延迟筛选器。运营上，Creatio
              在 7 个国际办公室雇佣约 700 名员工，软件开发和工程团队大量位于波兰和乌克兰。这一分布让核心开发连续性暴露于区域基础设施中断和地缘政治不稳定，需要验证跨区域灾备和工作负载分配协议。
            claimRefs:
              - CR002
              - CR003
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR009
      - number: '7.4'
        title: 系统集成商依赖、定价摩擦与财务持久性
        blocks:
          - type: paragraph
            body: >-
              Creatio 的市场拓展和商业执行依赖全球系统集成商生态，由此形成结构性的交付和利润率依赖。与 Deloitte Digital、Accenture 和 Coforge
              等大型咨询公司的战略联盟推动大规模企业部署，Deloitte 承诺组建 1,000 人卓越中心就是例子。但采购评估强调，集成失灵和用户采用障碍是企业 CRM
              项目中最常见、代价最高的失败模式。商业方面，Governance Application 在较低层级每用户每月 $50、按用量计费的 AI token 包为每 10 million tokens $150，再加
              $10,000 年度合同最低额，使总拥有成本经常超过基础套餐费。尽管核心 CRM 能力的客户评分仍高达 4.7/5，客户续约队列和伙伴交付差异的不透明尚未解决，执行风险仍然偏高。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR015
