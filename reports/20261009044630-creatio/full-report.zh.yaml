        blocks:
          - type: paragraph
            body: >-
              Creatio 的商业应用套件由专门功能模块组成，共享底层工作流引擎，覆盖完整客户生命周期。主要应用包括负责销售管道和机会编排的 Creatio Sales、负责多渠道获客和旅程自动化的 Creatio
              Marketing，以及负责客户支持和工单管理的 Creatio Service。除横向 CRM 外，Creatio 还提供 Bank.AI 等面向零售银行、信用合作社和保险公司的垂直方案。Creatio AI
              Studio 与 Creatio.ai 引擎统一提供 AI 能力，把预测式、生成式和代理式 AI 直接嵌入 CRM 工作流。Creatio Energy 8.2 推出 AI Command Center，内置超过
              20 项 AI 技能，并可连接 OpenAI、Anthropic Claude 和 Google Gemini 等外部基础模型，进一步扩展了这些能力。Creatio Marketplace
              的生态连接器（如用于自动提取文档的 Photon Commerce）则把模块能力延伸到专门的后台工作流。
