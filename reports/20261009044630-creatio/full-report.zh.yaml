        - 无法根据公开证据赋值
        - 经审计财务数据支持该估值，且优先权结构清晰
      - - 悲观
        - 增长或合作伙伴生产力走弱，账面亏损持续
        - 倍数压缩或下轮融资可能损害普通股回报
        - 无法根据公开证据赋值
        - 融资低于 2024 年估值，或高级优先权吞噬合理的退出收益
    notes: 情景分析是定性的，因为指定公开来源未披露 ARR、NRR、毛利率、当前证券条款、入场价格或期间匹配的可比公司集合。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV009
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Creatio 从自筹资金平台发展为 $1.2B 原生 AI 企业自动化平台过程中的公司、融资、产品和架构关键里程碑。
    data:
      items:
        - date: '2014-10-01'
          label: 公司成立
          detail: Katherine Kostereva 与一支小型创始团队成立 Creatio，推出自筹资金的无代码 CRM 平台。
          tone: neutral
          claimRefs:
            - CO003
        - date: '2019-12-31'
          label: 自筹资金持续运营
          detail: 公司连续 5 年仅靠客户收入支持自筹运营。
          tone: positive
          claimRefs:
            - CO006
        - date: '2021-02-28'
          label: A 轮增长融资
          detail: Creatio 完成首轮外部融资，筹得 $68M，由 Volition Capital 和 Horizon Capital 共同领投。
          tone: positive
          claimRefs:
            - CO013
        - date: '2024-06-26'
          label: 独角兽融资（$1.2B 估值）
          detail: 获得 Sapphire Ventures 领投的 $200M 投资，估值达到 $1.2B，并任命 Rajeev Dham 加入董事会。
          tone: positive
          claimRefs:
            - CO012
            - CO015
        - date: '2024-10-15'
          label: Creatio Energy 8.2 架构
          detail: 发布重大平台升级，通过 AI Command Center 嵌入 Agent、生成式和预测式 AI 模式。
          tone: positive
          claimRefs:
            - CO002
        - date: '2025-06-30'
          label: Creatio 8.3 双版本发布
          detail: 推出支持 BYOM 的无代码 Agent 构建器，并原生集成 Microsoft Teams、Outlook 和 Zoom。
          tone: positive
          claimRefs:
            - CO004
        - date: '2026-05-14'
          label: 员工扩充至 1,000 人
          detail: 公司报告称，全球员工扩充至分布于 10 个办公室的 1,000 人，同时保持 40% 的年营收增长。
          tone: positive
          claimRefs:
            - CO008
            - CO010
        - date: '2026-06-24'
          label: Agent 企业框架
          detail: 在奥兰多举行的 No-Code Days 2026 上，提出由五大支柱组成的战略，统筹自主 AI Agent 与行业工作流。
          tone: neutral
          claimRefs:
            - CO005
    approximationNotes: 里程碑日期对应公开融资公告日期、平台发布窗口和已确认的公司活动披露。
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO008
      - CO010
      - CO012
      - CO013
      - CO015
  - id: FM001
    title: Creatio 可触达市场规模金字塔
    type: pyramid
    summary: 从广泛的全球软件支出逐层收窄至 Creatio 目标可获取现代化细分市场的多层市场规模推演。
    data:
      items:
        - label: 全球宏观软件 TAM
          value: 120
          valueNote: $80B-$120B+ 全球 CRM 与低代码市场合计支出
        - label: 企业 CRM 核心 TAM
          value: 80
          valueNote: $60B-$80B 全球 CRM 平台软件支出
        - label: 中型市场与企业 SAM
          value: 24
          valueNote: $18B-$24B 可配置 B2B 流程自动化与 CRM 支出
        - label: 可组合 LCAP 与工作流 SAM
          value: 12
          valueNote: $10B-$14B 无代码应用现代化支出
        - label: 目标替换 SOM
          value: 4
          valueNote: $2.5B-$4.0B 近期高匹配度替换机会
        - label: 受监管垂直行业 SOM
          value: 2
          valueNote: $1.5B-$2.5B 金融服务、银行和保险重点市场
    approximationNotes: 数值代表依据多来源行业规模视角归一化的示意性中点指数，单位为十亿美元。
    claimRefs:
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 按工作流深度与买方可达性划分的序数竞争定位
    type: quadrant
    summary: Creatio 的工作流深度较高，但在低端市场的可达性不如 HubSpot 或更轻量的工作流产品；定位是受证据约束的序数判断。
    data:
      xAxis: 买方可达性（1 低，5 高）
      yAxis: 工作流与流程深度（1 低，5 高）
      points:
        - label: Creatio
          x: 2
          'y': 5
          detail: 流程和无代码范围较深，但最低消费和实施强度构成抵消。
        - label: HubSpot
          x: 5
          'y': 3
          detail: 可免费入门且生态广泛，但对定制流程深度的侧重较少。
        - label: Kissflow
          x: 4
          'y': 3
          detail: 业务主导的工作流易于使用，但据报道在复杂逻辑和治理上存在局限。
        - label: FlowForma
          x: 3
          'y': 4
          detail: 聚焦受治理的跨部门流程，并按流程打包。
        - label: SharpSpring
          x: 4
          'y': 2
          detail: 聚焦中小企业和代理商营销自动化，当前定价需通过演示获取。
        - label: BuildWithHQ
          x: 2
          'y': 4
          detail: 产品构建灵活性高，但运营模式不同且更依赖构建者。
    approximationNotes: 分数是分析师根据指定厂商和评测对比赋予的序数值，并非实测基准；相差 1 分仅代表方向。
    claimRefs:
      - CP016
  - id: FI001
    title: Creatio 企业客户价值与收入实现流程
    type: flow
    summary: 展示客户采用软件后，如何从无代码平台参与转化为经常性 SaaS 收入、合作伙伴服务交付和毛现金流。
    data:
      nodes:
        - id: lead-inflow
          label: 入站与合作伙伴来源线索
          detail: 超过 750 个全球合作伙伴、营销活动和 No-Code Days 活动带来企业需求。
        - id: subscription-contracting
          label: 核心企业 SaaS 签约
          detail: 在 Creatio Sales、Marketing、Service 和 Bank.AI 套件中执行年度经常性订阅。
        - id: marketplace-attach
          label: 市场与可组合应用附加销售
          detail: 客户部署第三方附加组件和连接器，Creatio 获取 20% 至 40% 的净收入分成。
        - id: partner-delivery
          label: 合作伙伴主导的实施与支持
          detail: 认证系统集成商负责定制部署，替 Creatio 承担专业服务成本。
        - id: cash-generation
          label: 现金流盈亏平衡运营
          detail: 经常性订阅现金流为持续研发和全球 GTM 提供资金，无需消耗运营资本。
        - id: expansion-arr
          label: 企业增购与 ARR 扩张
          detail: 可组合应用扩展至各部门，使 ARR 超过 $1M 的客户账户数量翻倍。
    approximationNotes: 图示依据已发布的合作伙伴条款和商业模式披露，展示运营收入转化顺序。
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示 Creatio 从呈现层到底层基础设施的分层产品架构概念堆栈模型。
    data:
      layers:
        - label: 呈现与互动层
          detail: Freedom UI Web 门户、适用于 iOS 和 Android 的移动应用，以及嵌入式生产力小组件
          items:
            - Freedom UI 设计器
            - Creatio 移动应用
            - 生产力集成（Teams、Zoom、Outlook）
        - label: 业务应用层
          detail: 基于无代码元数据配置的打包 CRM 应用和垂直行业解决方案
          items:
            - Creatio Sales
            - Creatio 营销
            - Creatio 服务
            - Bank.AI 与行业工作流
        - label: 智能体 AI 与编排层
          detail: Creatio AI Studio 与 AI Command Center 协同自主智能体和辅助提示
          items:
            - Creatio.ai 引擎
            - AI Command Center
            - 多 LLM 连接器（OpenAI、Anthropic、Gemini）
            - 自主与辅助 AI 智能体
        - label: 可组合无代码与流程核心
          detail: Studio Creatio 核心平台执行可视化业务逻辑、数据模型和 BPM 工作流
          items:
            - BPMN 2.0 流程设计器
            - 应用设计器
            - 业务规则引擎
            - 可组合组件库
        - label: 集成与扩展层
          detail: 微服务网关提供开放连接能力和市场扩展
          items:
            - REST、SOAP 与 OData API
            - Creatio Marketplace 应用与连接器
            - Photon Commerce IDP 连接器
            - 开发者 IDE 与包管理
        - label: 企业安全与基础设施层
          detail: 多级治理、基于角色的访问控制和灵活的部署运行时
          items:
            - 多级访问权限
            - .NET 微服务运行时
            - 关系型与开源数据存储
            - 云端 SaaS 与本地部署
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE008
      - CE013
      - CE014
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 这是一条受证据边界约束的客户旅程：从企业适配，到实施和扩张，最终仍需验证留存表现。
    data:
      items:
        - label: 企业适配
          detail: 中型和大型组织评估 CRM 与运营工作流需求。
          touchpoints:
            - 销售、服务、营销和运营工作流
            - 行业与治理要求
        - label: 用例选择
          detail: 某个部门或跨职能流程成为首期部署范围。
          touchpoints:
            - 面向客户的工作流
            - 内部运营工作流
        - label: 实施
          detail: 合作伙伴指引显示，中端市场标准周期为 8-16 周，复杂企业项目则更长。
          touchpoints:
            - 流程设计
            - 集成与迁移
            - 培训与用户验收
        - label: 运营采用
          detail: 已点名的案例在部署后披露了活跃用户、工作流量或业务成果。
          touchpoints:
            - 用户采用
            - 线索、服务或案件工作流
        - label: 扩张
          detail: Creatio 将增长归因于更大的企业客户、更广泛的使用，以及渠道助推的规模化。
          touchpoints:
            - $1M+ ARR 客户扩张
            - 新增部门与工作流
        - label: 持续性核查
          detail: 续约、留存、流失、合同期限和客户集中度必须通过私下材料核实。
          touchpoints:
            - NRR 与 GRR
            - 客户标识流失与群组留存
            - 头部客户 ARR 集中度
    approximationNotes: 这是一条分析序列，不是实测转化漏斗；它不代表转化率、统一的时间节奏，也不代表每位客户都会走同一条路径。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: 风险严重度与缓解成熟度矩阵
    type: matrix
    summary: 从固有影响、发生可能性、缓解成熟度和剩余严重度四个维度评估主要风险向量。
    approximationNotes: 定性风险评级综合客户评价数据、厂商技术发布日志和采购评估，截至 2026 年 10 月。
    claimRefs:
      - CR004
      - CR006
      - CR009
      - CR012
      - CR013
    data:
      columns:
        - 固有影响
        - 发生可能性
        - 缓解成熟度
        - 剩余严重度
      rows:
        - label: 财务 / 消耗与定价摩擦
          values:
            - 高
            - 中
            - 中
            - 中
        - label: 监管与合规暴露
          values:
            - 高
            - 低
            - 高
            - 低
        - label: 合作伙伴交付与集成延误
          values:
            - 高
            - 中
            - 中
            - 中
        - label: 地缘政治与分布式劳动力
          values:
            - 中
            - 低
            - 高
            - 低
        - label: AI 脚本执行与安全上下文
          values:
            - 中
            - 中
            - 高
            - 低
        - label: 复杂自主智能体工作流故障
          values:
            - 中
            - 中
            - 高
            - 低
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据从经交叉验证的融资估值，经由运营表现证明和仍未解决的定价输入，最终导向“继续研究”的决定。
    data:
      nodes:
        - id: financing-mark
          label: 历史融资估值
          detail: 2024 年 6 月以 $1.2B 估值完成 $200M 少数股权融资
        - id: growth-proof
          label: 已报道的运营势头
          detail: Reuters 报道年增长率为 50%；Creatio 自称 2024 年增长 45%
        - id: profitability-gap
          label: 盈利能力区分
          detail: 管理层称现金流已达到盈亏平衡，而 Reuters 报道公司没有利润
        - id: disclosure-gap
          label: 缺失的估值分母
          detail: 没有公开 ARR、NRR、毛利率、股权结构表或当前交易条款
        - id: price-discipline
          label: 价格纪律
          detail: 历史估值点不等于当前的公允价值区间
        - id: decision
          label: 建议
          detail: 在运营表现证明和安全条款得到核实前，继续研究
      edges:
        - from: financing-mark
          to: growth-proof
        - from: growth-proof
          to: profitability-gap
        - from: profitability-gap
          to: disclosure-gap
        - from: disclosure-gap
          to: price-discipline
        - from: price-discipline
          to: decision
    approximationNotes: 这是一条定性的决策序列，不代表数值转化率、概率或当前估值。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV009
      - CV015
      - CV016
