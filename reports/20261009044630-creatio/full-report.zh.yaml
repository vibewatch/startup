        blocks:
          - type: paragraph
            body: >-
              在金融服务和医疗等受监管企业市场，合规状况决定厂商能否进入市场及采购速度。Creatio 提供专门的预构建行业工作流，以支持医疗环境中的 HIPAA
              及银行、信用合作社机构的了解你的客户（KYC）要求。平台控制结合自动审计日志、细粒度基于角色的访问管理和结构化政策执行，确保机构可追溯。法律方面，截至 2026 年 10
              月，对公开法院记录和监管执法案卷的广泛检索没有发现针对 Creatio
              的重大在审诉讼、知识产权争议或监管执法行动。不过，开箱即用模板和安全控制只能建立基础准备度，企业客户仍需详细核验客户特定的数据处理附录和司法辖区数据驻留保证。
