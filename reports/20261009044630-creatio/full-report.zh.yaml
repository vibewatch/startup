  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Creatio
              横跨客户关系管理（CRM）、低代码/无代码应用平台（LCAP）和代理式工作流编排三个领域竞争。界定市场边界，首先要把核心可服务支出与相邻软件类别及传统内部开发方案区分开来。纳入范围的是企业在前台客户互动上的软件支出，包括销售队伍自动化、营销活动工作流和服务工单管理，以及业务人员或
              IT 团队无需大量定制工程即可配置的运营流程自动化。


              排除范围则包括通用横向基础设施、数据库层、专门的后台企业资源规划（ERP）账簿，以及只面向微型企业的基础自助式帮助台等独立点解决方案。企业环境中最根深蒂固的现状替代方案并非另一套云
              CRM，而是割裂的遗留架构：运行数十年的本地定制关系数据库、脆弱的脚本式中间件集成和手工电子表格。Salesforce、Microsoft Dynamics 365
              等老牌套件常因不断上涨的席位成本、复杂的多云维护和僵化的升级周期遭遇企业抵触，这给现代可组合平台留下了机会。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: TAM、SAM 与受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              Creatio 的市场规模不能靠一个笼统估算，而应从多个分析视角评估。行业预测常称全球 CRM 市场支出超过 $80 billion，复合年增长率（CAGR）为 10% 至 14%；低代码开发平台还对应 $30
              billion 至 $45 billion 的额外总市场。但这类顶线 TAM 汇总往往高估平台的现实可捕获空间，因为其中混入了面向消费者的大众帮助台、交易型邮件工具和高度商品化的小企业联系人名单。


              严格定义的可服务市场（SAM）只聚焦中型和大型企业：它们拥有 250 至 10,000+ 名知识工作者，需要在复杂 B2B 工作流中整合销售、营销和服务自动化。按此口径，全球可服务机会约为 $18 billion
              至 $24 billion。在这个范围内，Creatio 的近期可获得市场（SOM）取决于正在现代化遗留技术栈、且处于受监管和高接触行业的组织，例如金融服务、保险、制造和专业分销；这些客户寻求灵活的 AI
              原生工作流架构。公司报告称，FY27 初期 bookings 达到上年同期的 255%，说明这一聚焦目标层存在可量化需求。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
