      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 伙伴交付依赖与中型市场定价摩擦
            body: >-
              Creatio 的扩张战略依赖 Deloitte Digital、Accenture 等大型系统集成商，复杂企业实施因此面临交付差异风险。同时，$10,000
              年度最低承诺和模块化附加成本给小型组织造成采购障碍，使增长风险集中在企业账户。
