chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Creatio 是一家总部位于马萨诸塞州波士顿的私营企业软件厂商，提供 AI 原生无代码平台，将客户关系管理（CRM）与自主工作流编排汇于一体。首席执行官 Katherine Kostereva
              曾领导前身企业软件公司 TS，并早年任职于 IBM；她于 2014 年创办 Creatio。公司构建了可组合应用架构，让业务分析师和 IT
              团队无需传统代码即可组装并执行工作流。平台把销售队伍自动化、营销自动化和客户服务等 CRM 核心模块，与开箱即用的自主代理能力、预构建行业工作流模板及 AI Command Center 结合起来。Creatio
              通过企业软件即服务（SaaS）订阅和市场附加组件变现，并采用混合市场拓展模式：既直销企业客户，也依靠覆盖 550 多家系统集成商、区域咨询公司和 Deloitte Digital 等战略联盟的伙伴生态。
