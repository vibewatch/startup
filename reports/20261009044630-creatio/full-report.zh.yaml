      - number: '2.3'
        title: 买方画像、预算归属与商业包装
        blocks:
          - type: paragraph
            body: >-
              采用路径和商业包装对应业务线与中央 IT
              管理层中的不同经济买方。在中型企业，采购决策往往由首席商务官（或销售/营销副总裁）与首席信息官（CIO）共同推动，目标是把割裂的点工具并入统一运营界面。在更大型企业，企业架构师和业务运营高管主导技术尽调，确保安全治理、自定义数据模型扩展能力，以及与遗留
              ERP 后端的无缝集成。


              Creatio 过去采用按用户计费的许可模式，起价约为每用户每月 $40，另加产品附加组件；但平台推出“Unlimited”定价层，意味着有意进行结构性转变。它取消对用户、应用、工作流、代理和 API
              调用的席位计量，直接回应企业对传统厂商税模式的不满。不过，经济买方必须考虑：AI 执行并不包含在基础平台成本中，AI 能力通过年度 AI Action 套餐单独计量，入门层 $5,000 起，企业级部署最高
              $125,000+。采购讨论因此从预测人员数量，转向预测自动化工作流的执行速度。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 结构性增长驱动、切换摩擦与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              几股长期顺风正在加速企业考虑现代工作流平台：企业对代理式自动化的需求激增，对累积的遗留许可费用普遍不满，以及高管优先推动无代码可配置能力，以缓解紧张的软件开发积压。独立分析师的验证——例如在 The
              Forrester Wave: Customer Service Solutions Q1 2026 中获评 Strong Performer，以及在 CRM 销售评估中获评
              Visionary——为保守的企业采购委员会提供了机构层面的风险缓释。


              但企业部署速度也受到明显约束。关键 CRM
              和工单管理系统迁移数据摩擦大，监管合规要求复杂（尤其在银行和医疗领域），组织变革惯性也很强。要把关键运营从老牌系统迁出，必须充分验证概念证明，并调动大规模系统集成商资源。此外，Creatio
              的流失指标、客户集中度以及生产工作流高频消耗 AI Action 的长期成本可预测性，仍存在关键尽调缺口。
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 席位许可与 AI 变现的战略拆分
            body: >-
              Creatio 的“Unlimited”模式脱离了老牌厂商按席位收费的结构，让企业增加用户而不承担边际软件费用。但 AI Actions 仍按年度套餐单独计量，价格从 $5,000 至超过
              $125,000；企业采购团队必须从预测员工数，转向估算流程执行量。
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
              - CM013
          - type: callout
            title: 遗留系统黏性与数据迁移护城河
            body: 企业买方越来越厌倦昂贵的遗留平台，但实际迁移周期仍然漫长。老牌厂商凭借深度嵌入的定制代码、数十年的历史交易记录和复杂合规集成构筑防御性护城河，部署往往要跨越多个季度。
            calloutType: risk
            claimRefs:
              - CM004
              - CM014
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Creatio 并不处于单一、清晰的同业集合，而是在两个重叠类别中竞争：企业 CRM，以及工作流/无代码自动化。Reuters 明确将 Salesforce 列为竞争对手；分配到的比较来源则把
              HubSpot、Kissflow、SharpSpring、FlowForma 和 BuildWithHQ 放在同一采购决策的不同位置。对偏好易采用、免费入口和更大集成生态的买方，HubSpot
              是最清晰的全套替代方案。Kissflow 和 FlowForma 以更简单或不同包装的模式切入工作流自动化；BuildWithHQ 面向希望拥有差异化 SaaS 运营模式的团队。Salesforce
              仍是老牌基准，但本组证据没有当前功能或定价对比。内部自建和现状下的手工流程也是有经济意义的替代方案，不过现有证据没有量化其使用率、赢单率或总成本。因此，这张定位图只是对已披露产品重点的序数综合，不是独立市场基准。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
              - CP010
              - CP012
              - CP016
