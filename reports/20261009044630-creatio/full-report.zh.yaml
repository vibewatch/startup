  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              建议为“继续研究”，信心中等、风险高；相对于公开证据，估值立场偏高。正向论点可信但尚未定论：Reuters 报道收入连续数年每年增长 50%，Creatio 后来称 2024 年收入同比增长 45%。管理层也向
              Reuters 表示公司实现现金流盈亏平衡，公司和媒体报道都称伙伴渠道贡献约一半业务。这些信号支持运营势头和资本效率。反向论点是，Reuters 同时称公司尚未盈利，抽样融资材料缺少 ARR、NRR
              和单位经济细节，而 Creatio 所在品类竞争拥挤，包括 Salesforce、HubSpot 和 Freshworks。没有分母，增长说法无法证明上一轮私募估值或任何当前要价能带来足够回报。
            claimRefs:
              - CV002
              - CV003
