      - number: '3.2'
        title: 能力、分销与信任状况
        blocks:
          - type: paragraph
            body: >-
              Creatio 最强的差异化在于把 CRM、流程自动化、无代码应用开发与日益受治理的 AI 代理能力结合起来。8.3.1
              更新日志直接证明平台推出了分析代理，并细化了代理执行权限；相比泛泛的营销语言，这更能说明交付速度。代价是实施强度：竞争对比反复指出其 BPMN
              和定制能力更深，但学习曲线更陡、管理员参与更多，性能和移动端也存在摩擦。分销部分抵消了这份复杂性。Creatio 报告称 2024 年新增 250 个合作伙伴，并表示 Deloitte Digital
              将建立卓越中心、培养 1,000 名专家。这些是公司发布的扩张说法，并不能证明伙伴生产力、客户结果或部署质量。信任状况同样受来源限制：现有材料报告了合规和部署差异，但没有独立控制审计或可比较的实施成功数据集。
            claimRefs:
              - CP001
              - CP002
