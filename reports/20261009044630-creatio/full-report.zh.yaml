  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与架构基础
        blocks:
          - type: paragraph
            body: >-
              Creatio 将企业软件定位为 AI 原生 CRM 与工作流自动化平台，让人类员工和自主 AI 代理在客户侧及运营流程中协作。平台基础是 Studio
              Creatio，这是一个可组合的无代码环境，把基础平台配置包与客户定制解耦。用户构建的扩展和配置会替代基础配置元素模式，而不是修改核心代码文件，从而在平台更新后保持 API 和应用的前向兼容。平台由基于现代
              .NET 运行时组件构建的自主微服务组成，提供兼容云 SaaS 环境和本地企业数据中心的灵活部署模式。Studio Creatio 包含符合 BPMN 2.0 的可视化 Process
              Designer、用于页面创建的现代 Freedom UI Designer，以及让非技术业务用户借助自然语言提示和预构建组件组装功能应用的 Application Designer。
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE014
