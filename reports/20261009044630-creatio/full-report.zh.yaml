      - number: '3.3'
        title: 定价、切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              公开比较材料显示，Creatio 同时收取平台费和模块费；客户增加用户、CRM 模块、治理、支持、存储或实施服务后，成本会上升。ZoomInfo 报告平台起价为每用户每月 $25，另加每个 CRM 模块
              $15，年度最低消费 $10,000；RFP.wiki 则称平台访问起价为每用户每月 $40。差异可能来自套餐定义，并非真正矛盾，因此不能把任何一个数字当作实际客户价格。FlowForma
              的一个场景估算显示，30 名用户、三个模块的部署在计入指定支持和有限用户假设后每年约 $41,000，并明确排除 AI token、培训和集成。流程重设计、定制逻辑、集成和管理员培训可能造成 Creatio
              嵌入后会形成切换成本，但 API 和伙伴生态也允许多平台并用。因此，护城河靠实施和生态驱动，未经证明：目前没有专有数据或独立测量的性能优势支撑这一判断。AI 代理与无代码工具的产品趋同，仍是主要商品化风险。
            claimRefs:
              - CP006
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
