      - number: '1.2'
        title: 管理团队、治理与员工规模扩张
        blocks:
          - type: paragraph
            body: >-
              Creatio 的治理和运营执行仍以创始人兼首席执行官 Katherine Kostereva 为核心。自 2014 年创立平台以来，她一直负责战略，并拥有可追溯至 2002
              年的长期软件行业领导经验。最初五年，公司完全依靠客户软件收入为产品开发和员工扩张提供资金；此后，Creatio 在公司战略、财务管理、企业销售和平台架构等方向扩充了高管团队。2024 年 6 月完成 Series
              B 融资后，Sapphire Ventures 董事总经理 Rajeev Dham 加入 Creatio 董事会，公司治理由此制度化。运营层面，公司员工从 2024 年年中的 7 个全球办公室、700 人，扩大至
              2026 年年中的 10 个办公室、约 1,000 人；除美国总部外，还在欧洲、波兰和乌克兰开展国际运营。
