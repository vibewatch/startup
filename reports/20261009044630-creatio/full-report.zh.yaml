  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管风险评估与剩余风险敞口
        blocks:
          - type: paragraph
            body: >-
              Creatio 以无代码工作流自动化和嵌入式 AI 代理能力形成差异化企业定位，但其运营模式面临三类关键脆弱点：执行、伙伴依赖和资本效率。公司在 2024 年以 $1.2 billion 估值完成 $200
              million 融资后保持现金流盈亏平衡，却尚未得到经审计的会计净盈利证明。商业扩张也带来明显摩擦，尤其是僵化的 $10,000 年度最低采购门槛，以及可能让扩大规模的中型买方总拥有成本迅速上升的 token 式
              AI 定价。此外，大量工程和运营员工仍位于东欧的波兰和乌克兰，需要持续监控业务连续性。为应对关键任务部署中的治理风险，Creatio 依靠 AI Trust Framework
              和无限组织规模许可层，建立可预测的运行时护栏并缓解按席位扩张的障碍。
            claimRefs:
              - CR004
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
