      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公司与多家独立出版物对 2024 年 6 月的核心事件说法一致：Creatio 以 $1.2 billion 估值融资 $200 million，由 Sapphire Ventures 领投，StepStone
              Group、Volition Capital 和 Horizon Capital 参与。Creatio 称其为少数股权投资，这限制了对控制权的推断，但没有披露优先级、清算权或稀释。Tracxn
              目前报告三轮融资累计 $278 million，并列出一笔日期为 2025 年 5 月 29 日、金额 $9.53 million 的 Series D
              交易。该数据库观察可作为信息新鲜度信号，却不能证明可用现金或当前公允价值。因此，$1.2 billion
              是历史交易价格，不是当前估值。确定价格或目标回报前，入场纪律应要求当前完全摊薄股权资本化、证券条款、现金余额和经审计运营指标。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV014
              - CV015
      - number: '8.3'
        title: 情景逻辑与可比证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持定性情景，不支持数值估值区间或概率权重。乐观情景是近期增长具有持久性、伙伴主导的分销高效扩张，AI、无代码和全球扩张投入转化为经独立验证的留存和现金创造。基准情景保留增长，但在披露
              ARR、毛利率、NRR 和证券条款前，回报逻辑仍未解决。悲观情景是增长放缓、竞争加剧，或现金流盈亏平衡与会计盈利之间的缺口持续，令投资者面临倍数压缩或下轮融资。Tracxn 指出了公开 CRM
              同行，但分配到的证据没有同期同行收入、增长、利润率或市值数据集。这些公司只是尽调名单，不是可辩护的倍数基准。没有任何情景被赋予估值区间，因为那会凭空制造缺失的分母。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              $200 million 少数股权融资和机构投资者名单证明公司能够获得增长资本，但公开记录没有披露 IPO
              时间表、收购流程、二级市场估值或投资者流动性权利。因此退出准备度尚未验证。下一步尽调应进入数据室，审阅经审计收入确认、ARR 桥接、毛利率、队列留存、客户集中度、现金与烧钱、债务及             
              完整优先股堆叠。管理层应核对所报告的 2025
              年融资入场价格，并区分会计盈利与现金流盈亏平衡。论点破坏触发器应以证据为基础，而非凭数字臆造：增长显著放缓、留存或伙伴生产力走弱、会计持续亏损且现金创造没有改善、优先权过重吞噬现实退出收益，或融资价格低于
              2024 年水平。经验证的当前基本面，或明显更低且结构清晰的入场价格，可能改变建议；仅凭营销里程碑不应改变建议。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 价格是缺失的决策变量
            body: 条款不对，优秀公司也可能成为糟糕投资。Creatio 报告的增长和融资质量值得继续尽调，但没有公开证据支持新的估值区间、目标回报或持有期。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV015
              - CV016
