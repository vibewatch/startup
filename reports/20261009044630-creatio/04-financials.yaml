    title: "Capital-Efficient Distribution via Scaled Partner Ecosystem"
    body: "Creatio's partner network spanning 750+ organizations in 110 countries provides global enterprise distribution without requiring a bloated direct professional services headcount. By capturing high-margin software subscriptions while delegating custom delivery and integration services to certified partners, Creatio preserves cash flow break-even dynamics while maintaining 45% to 50% historical annual growth."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI014"
  - calloutType: "risk"
    title: "Private Disclosure Gaps Obscure True Underlying Unit Economics"
    body: "Because Creatio is a privately held corporation, crucial financial underwriting variables—including audited ARR, GAAP gross margin, net revenue retention, and specific cash balances—are not accessible in the public domain. While third-party models estimate ARR around $50M-$200M and bookings surges demonstrate enterprise demand, institutional underwriting requires access to private financial data rooms."
    claimRefs:
      - "CI012"
      - "CI015"
      - "CI016"
