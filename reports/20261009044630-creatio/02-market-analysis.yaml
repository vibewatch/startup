callouts:
  - calloutType: insight
    title: The Strategic Decoupling of Seat Licensing and AI Monetization
    body: Creatio's "Unlimited" model represents a structural departure from incumbent seat-tax licensing, allowing enterprises to scale users without marginal software penalties. However, because AI Actions remain metered separately under annual tiers ranging from $5,000 to over $125,000, enterprise procurement teams must transition from forecasting headcounts to estimating process execution volumes.
    claimRefs:
      - CM011
      - CM012
      - CM013
  - calloutType: risk
    title: Legacy Incumbent Stickiness and Data Migration Moats
    body: While enterprise buyers express growing fatigue with expensive legacy platforms, actual migration timelines remain extended. Incumbents maintain defensive moats through deeply embedded custom code, decades of historical transaction records, and complex compliance integrations that require multi-quarter deployment cycles.
    claimRefs:
      - CM004
      - CM014
      - CM016
