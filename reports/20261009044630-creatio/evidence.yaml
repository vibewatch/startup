evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited consolidated GAAP financial statements disclosing exact ARR, gross margin percentage, net burn rate, and
      cash runway.
    whyItMatters: >-
      Without audited financial denominator metrics, the $1.2B valuation cannot be independently validated against
      industry EV/ARR multiples.
    diligencePath: >-
      Request audited fiscal year income statements, balance sheets, and management ARR waterfall schedules directly
      from Creatio management.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preference-stack
    missingEvidence: >-
      Detailed equity capitalization table specifying class preferences, seniority stacking, liquidation waterfalls, and
      secondary sales.
    whyItMatters: >-
      Minority growth rounds at unicorn valuations often contain liquidation preferences or structured terms that affect
      common equity value.
    diligencePath: >-
      Obtain the formal investor rights agreement, Series B term sheet, and cap table ledger during confirmatory
      investment diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: full-board-and-executive-roster
    missingEvidence: >-
      Comprehensive governance disclosures detailing all voting board directors, independent observers, and executive
      equity ownership.
    whyItMatters: Evaluates key-person dependency on founder Katherine Kostereva and institutional investor control rights.
    diligencePath: >-
      Request the comprehensive corporate bylaws, voting agreement, and current officer directory under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: audited-arr-and-retention
    missingEvidence: >-
      Audited financial disclosure detailing absolute annual recurring revenue (ARR), net revenue retention (NRR), and
      gross retention cohorts.
    whyItMatters: >-
      While bookings growth was reported at 255% of prior-year results in early FY27, lack of baseline ARR obscures the
      true dollar-scale expansion of Creatio relative to incumbent market sizing.
    diligencePath: Obtain confidential financial presentation, investor audit disclosures, or secondary transaction prospectuses.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: ai-action-consumption-patterns
    missingEvidence: Empirical customer workload telemetry and consumption distribution across AI Action tiers (Start through Scale).
    whyItMatters: >-
      Enterprise buyers and investors need visibility into whether customers exceed initial action packages and face
      unexpected overage costs or friction.
    diligencePath: >-
      Interview enterprise systems integrators (such as Customer FX or Deloitte Digital) and review production customer
      usage telemetry.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs: []
  - type: enumeration-incomplete
    severity: material
    topic: landscape-coverage
    missingEvidence: >-
      Buyer win-loss data quantifying Salesforce, internal build, manual status quo, and other alternatives encountered
      in Creatio evaluations.
    whyItMatters: >-
      Without observed buyer choices, the landscape is a source-derived candidate set rather than an exhaustive view of
      competitive frequency.
    diligencePath: >-
      Request the last four quarters of opportunity-level win-loss records and interview a sample of won, lost, and
      no-decision accounts.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current signed order forms showing realized platform, module, support, AI, storage, implementation, discount,
      renewal, and minimum-commitment terms.
    whyItMatters: >-
      Public list prices and competitor scenarios cannot establish realized contract value or directly comparable total
      cost of ownership.
    diligencePath: >-
      Collect anonymized contracts for matched customer sizes and normalize them over a three-year deployment and
      services period.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-validation
    missingEvidence: >-
      Independent benchmark results and customer migration evidence comparing implementation time, workflow complexity,
      reliability, retention, and switching outcomes.
    whyItMatters: >-
      Vendor comparisons establish positioning claims but do not prove durable performance, customer lock-in, or
      superiority over incumbent and adjacent alternatives.
    diligencePath: >-
      Run a matched proof-of-concept and reference calls with recent Creatio adopters, switchers, and customers that
      selected a competitor.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited consolidated financial statements including audited ARR, GAAP revenue recognition, gross margin, and
      departmental OpEx breakdown.
    whyItMatters: >-
      Without audited financial statements, true SaaS gross profitability, software contribution margins, and
      bottom-line economics cannot be independently validated.
    diligencePath: >-
      Request audited financial statements and board-approved financial packets under non-disclosure agreement in
      private data room.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: retention-and-cac
    missingEvidence: >-
      Historical net revenue retention (NRR) cohorts, gross logo retention rates, and customer acquisition cost (CAC)
      payback figures across partner vs direct sales channels.
    whyItMatters: >-
      NRR and CAC payback are essential variables to verify whether enterprise customer expansion offsets churn and
      whether partner distribution economics are genuinely accretive.
    diligencePath: Obtain cohort retention schedules and sales efficiency attribution tables during management diligence.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: cash-and-debt-balances
    missingEvidence: >-
      Exact current unrestricted cash balance, short-term debt instruments, or credit facility drawdowns following the
      2024 $200M funding round.
    whyItMatters: >-
      Verifying exact cash balances confirms whether the company's cash flow break-even claim provides indefinite runway
      or if subsequent debt/equity raises will be needed.
    diligencePath: Review bank balance verifications and credit facility agreements in diligence data room.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: sla-and-disaster-recovery
    missingEvidence: >-
      Publicly verified high-availability uptime SLA figures, independent SOC 2 Type II audit attestations, and measured
      RPO/RTO disaster recovery benchmarks for multi-region cloud deployments.
    whyItMatters: >-
      Enterprise IT buyers require audited availability commitments and disaster recovery benchmarks to underwrite
      mission-critical core CRM and transactional workflow migrations.
    diligencePath: >-
      Request Creatio's current SOC 2 Type II compliance package, cloud service level agreement terms, and disaster
      recovery tabletop test results during technical diligence.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract duration, and cohort retention by segment and customer vintage.
    whyItMatters: >-
      Bookings growth and named outcomes do not establish recurring-revenue durability or show whether expansion offsets
      customer losses.
    diligencePath: >-
      Request board-level customer cohort schedules and reconcile beginning ARR, new logos, expansion, contraction,
      churn, and ending ARR to audited revenue.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer ARR concentration; channel-sourced ARR; vertical mix; and absolute count of $1M+
      ARR customers.
    whyItMatters: >-
      A doubling in large accounts can coexist with material dependence on a small group of enterprise customers or
      implementation partners.
    diligencePath: >-
      Obtain an anonymized customer ARR ledger with customer, vertical, geography, channel, contract end date, and
      renewal status.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete customer census that includes inactive, churned, failed, and pilot-only deployments rather than
      selected references.
    whyItMatters: >-
      A reference sample can demonstrate use but cannot establish representative outcomes, deployment success rate, or
      current production status.
    diligencePath: >-
      Request a complete anonymized deployment register and independently reference-check a stratified sample of active,
      renewed, and churned accounts.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: partner-delivery-metrics
    missingEvidence: >-
      Empirical cohort data detailing enterprise implementation duration, partner delivery budget variances, and
      post-go-live milestone achievement across Deloitte and Accenture deployments.
    whyItMatters: >-
      System integrator execution capability directly affects customer time-to-value, net revenue retention, and
      implementation failure rates.
    diligencePath: >-
      Request blinded partner deployment scorecards, customer references from tier-one SI projects, and implementation
      variance audits.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive non-public compliance audit reports, SOC 2 Type II assessment details, and jurisdictional litigation
      docket checks across global customer subsidiaries.
    whyItMatters: >-
      Public evidence confirms compliance positioning and absence of major public enforcement, but private audits are
      required to verify continuous adherence.
    diligencePath: >-
      Obtain latest SOC 2 Type II third-party auditor report, ISO certification scope documents, and signed
      representations regarding pending legal notices.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operating-denominators
    missingEvidence: >-
      Audited ARR, organic growth bridges, gross margin, NRR, cohort retention, customer concentration, cash, debt, and
      burn
    whyItMatters: >-
      These inputs determine whether reported growth creates durable value and whether the historical financing mark is
      supportable
    diligencePath: Obtain audited statements, board reporting, ARR bridges, and customer cohorts from the company data room
    relatedQuestionRefs:
      - QV003
      - QV009
    relatedTableRefs:
      - TV001
      - TV002
      - TV003
  - type: private-evidence-only
    severity: material
    topic: security-terms
    missingEvidence: >-
      Fully diluted capitalization, liquidation preferences, participation rights, anti-dilution terms, debt, and
      current entry price
    whyItMatters: >-
      Headline valuation and funding raised do not establish proceeds available to common equity or an investable target
      return
    diligencePath: Review the capitalization table, charter, financing documents, debt schedule, and proposed security term sheet
    relatedQuestionRefs:
      - QV003
      - QV010
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      Period-matched public-peer revenue, growth, margin, enterprise value, and transaction-date private or M&A
      benchmarks
    whyItMatters: Company names alone do not provide a comparable multiple or justify a current valuation range
    diligencePath: >-
      Build a transaction-date comp set from audited filings and verified deal documents after revenue and margin
      definitions are reconciled
    relatedQuestionRefs:
      - QV005
    relatedTableRefs:
