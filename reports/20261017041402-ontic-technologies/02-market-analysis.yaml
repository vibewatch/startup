company:
  name: "Ontic Technologies"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Ontic is positioning into a connected-security-operations market centered on corporate and
    government security teams that need a system of record across threat intelligence,
    investigations, incidents, and response. The retained evidence supports buyer/workflow fit
    and several adoption signals, but it does not isolate a defensible TAM/SAM/SOM from
    adjacent services, compliance, and broader security software spend.
sections:
  - id: "market-boundary"
    title: "Boundary and buyer problem"
    body: >
      The company is not describing a generic cybersecurity or guard-services market; it is
      defining a workflow layer for corporate and government security teams that need one
      connected operating picture for threats, investigations, incidents, and response. Across
      the FedRAMP announcement, the platform page, and the mobile listing, Ontic consistently
      frames the problem as fragmented physical-security data, manual triage, and limited
      visibility across people, assets, and incidents. That boundary matters because it keeps the
      relevant spend closer to protective intelligence, GSOC, investigation, and risk-program
      budgets than to broad IT, cyber, or labor-heavy guarding categories. The same evidence also
      shows a multi-role user base: operational analysts and GSOC teams are the hands-on users,
      while security leaders are the budget holders who need measurable response speed, audit
      history, and provable business continuity outcomes. Precise budget ownership remains an
      evidence gap rather than a verified market fact.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM016"]
    tableRefs: ["TM001", "TM003"]
  - id: "adoption-drivers"
    title: "Adoption drivers, channels, and procurement unlocks"
    body: >
      The strongest adoption drivers in the retained pool are operational efficiency, data
      consolidation, and procurement flexibility. Ontic's product copy emphasizes a centralized
      system of record, 60+ integrations, and deployment in either Ontic's cloud or the
      customer's cloud, all of which lower the cost of fitting the product into an existing
      enterprise stack. The current product page adds an AI and workflow-automation narrative
      aimed at reducing manual work, while the Control Risks partnership shows why some buyers may adopt
      through a services-assisted model rather than through a purely self-serve software motion:
      external analysts can work inside the same environment when the customer's internal team
      lacks coverage or capacity. FedRAMP Moderate and an ATO are especially important because
      they move Ontic from a corporate-only narrative to an addressable public-sector procurement
      path, which can matter disproportionately for valuation even before revenue contribution is
      disclosed.
    claimRefs: ["CM005", "CM006", "CM007", "CM008", "CM009", "CM014", "CM015"]
    figureRefs: ["FM001"]
  - id: "sizing-constraints"
    title: "Sizing signals and what remains unproven"
    body: >
      The available numbers are better interpreted as adoption signals than as market size. The
      historical 68% growth in new enterprise clients and 319% user growth show that Ontic found
      demand inside large enterprise accounts, while the platform case study numbers show the kind
      of ROI story security leaders can use to justify spend. But those figures do not reveal the
      size of the serviceable software market, the share of spend attributable to services versus
      platform subscriptions, or whether public-sector demand is material today or still
      aspirational. The retained pool also lacks an independent category-definition source that
      cleanly separates Ontic's connected-intelligence wedge from adjacent spend on consultancies,
      cyber tooling, or labor. The correct diligence posture is therefore to preserve an
      evidence-constrained sizing lens and explicitly log the missing market-size work rather than
      manufacture a broad TAM from unrelated security categories.
    claimRefs: ["CM010", "CM011", "CM012", "CM013", "CM015"]
    tableRefs: ["TM002"]
