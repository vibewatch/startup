      - ["Mobile protective intelligence workflows", "Field/mobile access to threat and investigation data for teams protecting people, customers, and assets", "General consumer safety or employee-experience apps", "Corporate security operations budgets", "Expands user surface beyond desktop analysts via the App Store product"]
      - ["Public-sector protective intelligence", "Agency security operations using the same platform after FedRAMP Moderate and ATO clearance", "Generic agency IT modernization or unrelated compliance software", "Agency security leadership / mission operations budgets", "Creates a regulated-segment path that can expand valuation upside"]
      - ["Partner-enabled intelligence services", "Analyst and advisory workflows run inside Ontic with external specialists or channel partners", "Standalone consulting retainers delivered outside the platform", "Security leaders buying software plus services capacity", "Suggests some demand will be captured through assisted delivery, not only direct-seat software"]
    notes: "Boundary is synthesized from retained product, partner, app-store, and public-sector evidence; rows distinguish Ontic's workflow layer from adjacent security spend rather than claiming an industry-standard taxonomy."
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005", "CM006", "CM015", "CM016"]
  - id: "TM002"
    title: "TAM/SAM/SOM or sizing lens table"
    columns:
      - "Lens"
      - "Publisher / period"
      - "Geography / segment"
      - "Value"
      - "Methodology / what it measures"
      - "Confidence"
      - "Limitation"
    rows:
      - ["New enterprise client growth", "Ontic press release; FY ended 2021-01-31", "Fortune 500 and emerging enterprise clients", "68% YoY growth", "Company-reported growth in total new enterprise clients", "Medium", "Historical company metric; not a current market-size measure"]
      - ["Platform user growth", "Ontic press release; calendar 2020 vs 2019", "Platform users", "319% increase", "Company-reported user growth within the installed base", "Medium", "Internal adoption metric from 2020, not current category demand"]
      - ["Customer efficiency proof", "Ontic platform case study; current marketing surface", "One Fortune 500 insurance customer", "85% manual-work reduction", "Single-customer outcome cited on the product page", "Medium", "Case-study evidence; not a benchmark across customers"]
      - ["Economic proof point", "Ontic platform case study; current marketing surface", "Same Fortune 500 insurance customer", "$2M recovery and cost avoidance", "Single-customer quantified outcome", "Medium", "Not equivalent to ACV, payback period, or average customer ROI"]
      - ["Expansion vector", "AInvest article on 2025 Series C", "Global enterprises and U.S. public sector", "International + public-sector expansion", "Third-party report on intended use of proceeds", "Low", "Expansion intent, not evidence of segment revenue or TAM"]
    notes: "This is an evidence-constrained sizing lens, not a true TAM/SAM/SOM model; the retained pool provides adoption and ROI signals but no independent category estimate or disclosed serviceable-market denominator."
    claimRefs: ["CM010", "CM011", "CM012", "CM013", "CM015"]
  - id: "TM003"
    title: "Segment / buyer map"
    columns:
      - "Segment"
      - "Buyer"
      - "User"
      - "Payer"
      - "Workflow"
      - "Adoption trigger"
    rows:
      - ["Protective intelligence / investigations", "Head of corporate security or protective intelligence", "Protective Intelligence Manager, analysts, investigators", "Corporate security program budget", "Threat intake, assessment, case management, investigations", "Need to replace manual and fragmented threat workflows"]
      - ["GSOC / intelligence operations", "Senior security operations or GSOC leader", "GSOC analysts and intelligence teams", "Security operations budget", "Monitoring, triage, response coordination, reporting", "Need for a unified operational view and faster decision-making"]
      - ["Federal protective security", "Agency security leadership", "Public-sector security and response teams", "Mission or agency security budget", "Threat management, investigations, incident response", "FedRAMP Moderate + ATO unlock procurement eligibility"]
      - ["Partner-assisted programs", "Enterprise security leader working with external specialists", "Control Risks analysts plus client team members", "Security budget plus services spend", "Embedded external intelligence, assessments, crisis-response support", "Internal team lacks global coverage, specialist capacity, or follow-the-sun operations"]
    notes: "Buyer and user roles are inferred from named customer-story roles, public-sector positioning, and partner-delivery evidence; public sources do not disclose precise budget line items or average contract owners."
    claimRefs: ["CM003", "CM005", "CM006", "CM015", "CM016"]
