      - number: '1.3'
        title: Milestones, external validation, and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              The strongest dated milestones in the current pool are financial and go-to-market rather than
              financial-performance disclosures. Ontic's 2025 Series C, April 2026 FedRAMP authorization, and September
              2026 Control Risks partnership all indicate active expansion into public-sector and intelligence-led
              workflows. Great Place To Work adds a current employee-count signal and a multi-year recognition trail,
              but those are softer validation points than audited revenue or customer disclosures. AI Market Watch
