      - number: '4.2'
        title: GTM motion and efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The clearest public commercialization signal is the Europe managing-director job posting, which says Ontic
              is hiring its first regional sales leader to establish market entry, secure early wins, forecast pipeline
              and revenue, and keep pricing, contracting, and negotiation aligned with corporate standards (CI006). That
              reads like a direct, strategic-sales motion with complex deal cycles and heavyweight stakeholder
              management, not a transactional or self-serve model (CI007). Ontic's product pages provide customer ROI
              anecdotes such as less manual work, cost avoidance, and the ability to scale impact with a smaller
              headcount, but those are customer-outcome proxies rather than disclosures of Ontic's own CAC, payback,
              retention, or gross profit profile (CI009). Great Place To Work's 181 U.S.-based-employee snapshot
              provides a partial labor-footprint datapoint, yet it still leaves functional mix, non-U.S. staffing, and
              fully loaded operating cost opaque (CI011).
