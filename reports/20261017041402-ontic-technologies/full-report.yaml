      - number: '3.3'
        title: Durability depends on data context, switching costs, and partner access
        blocks:
          - type: paragraph
            body: >-
              The durability story is credible but not invulnerable. Ontic appears to build switching costs through
              deployment trust, integrations, and embedded workflows rather than through publicly visible lock-in
              mechanics or published price advantages. FedRAMP and ATO matter because they increase buyer confidence for
              public-sector and other high-stakes programs, while deploy-anywhere options, "60+ integrations and
              growing," and partner workflows reduce the appeal of ripping out the system once operating processes are
              centralized. At the same time, Ontic's own 2026 AI launch is a warning that interface-level AI features
              can commoditize quickly; if rivals offer similar summarization or copilots, Ontic's moat has to come from
              accumulated context, integrations, workflow history, and access to external analyst capacity. The weak
              spot in the current evidence set is that named-peer product and pricing proof remains sparse, so the moat
              case is directionally positive but still under-documented by independent head-to-head comparisons.
            claimRefs:
              - CP005
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Ontic competes as an operating system, not just an alert feed
            body: >-
              The strongest retained evidence shows Ontic winning on workflow breadth, deployment trust, and the ability
              to combine software with outside analyst capacity, which is a harder comparison set than a pure
              point-feature bake off.
            calloutType: strength
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP013
          - type: callout
            title: AI alone is not a durable moat
            body: >-
              Ontic's 2026 AI launch strengthens the product, but it also highlights that copilots and summarization can
              diffuse across the category; the moat therefore depends more on connected context, integrations, and
              workflow history than on generic model features.
            calloutType: risk
            claimRefs:
              - CP003
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Ontic's public surfaces describe a software platform sold to corporate and government security teams as a
              centralized system of record for protective intelligence, incident management, investigations, and case
              management, which supports a software-led revenue model rather than a pure services business (CI001). The
              government page and April 2026 FedRAMP/ATO announcement show that the same core platform is being
              positioned for federal buyers as well as enterprise customers, expanding the addressable contract base
              without proving any specific public-sector revenue contribution yet (CI002). What remains notably absent
              is public price discovery: the retained product, government, partnership, and job posting surfaces do not
              publish list price, contract term, or realized pricing benchmarks, so the revenue model can be described
              structurally but not quantified (CI007, CI008). That means the monetization story is credible at the
              mechanism level, but revenue quality still depends on customer contracts and realized attach rates that
              are not publicly visible.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
