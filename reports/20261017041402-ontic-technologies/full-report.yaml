              - CI014
          - type: callout
            title: Capital is buying expansion, not clarity
            body: >-
              The 2025 Series C clearly funds AI, public-sector, and international growth, but the same public record
              still withholds valuation, liquidity, and operating-efficiency metrics.
            calloutType: insight
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Ontic's official platform page describes the product as a system of record for physical-security teams
              rather than a narrow alerting tool, and the adjacent third-party profiles reinforce that category framing
              for both enterprise and government buyers. The visible workflow starts with multi-source monitoring, maps,
              dashboards, and automated feeds, then moves into AI-assisted triage, casework, and reporting. Public
              module evidence is strongest for risk intelligence, investigations, case management, and AI-assisted
              workflow automation; it is weaker on quantitative deployment outcomes beyond selected customer stories and
              marketing statistics. The practical takeaway is that Ontic appears to sell a broad operational layer for
              protective intelligence programs, but buyers still need diligence on where configurable workflow ends and
              where custom implementation begins.
