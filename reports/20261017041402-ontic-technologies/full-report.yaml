    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and product scope
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently describes Ontic as a software platform for corporate and government
              security teams rather than as a services-first consultancy. Company-controlled sources frame the core
              product as a connected intelligence system of record that combines data, workflows, and AI-assisted
              insights, while the Reuters coverage and the Great Place To Work profile reinforce the enterprise-security
              orientation and current scale. The evidence supports Ontic's headquarters, founding year, and current
              Series C stage, but it does not provide audited operating metrics or a disclosed valuation that would let
              later chapters treat top-line scale as settled fact or assume durable commercial performance.
