      - number: '2.3'
        title: Sizing signals and what remains unproven
        blocks:
          - type: paragraph
            body: >
              The available numbers are better interpreted as adoption signals than as market size. The historical 68%
              growth in new enterprise clients and 319% user growth show that Ontic found demand inside large enterprise
              accounts, while the platform case study numbers show the kind of ROI story security leaders can use to
              justify spend. But those figures do not reveal the size of the serviceable software market, the share of
              spend attributable to services versus platform subscriptions, or whether public-sector demand is material
              today or still aspirational. The retained pool also lacks an independent category-definition source that
              cleanly separates Ontic's connected-intelligence wedge from adjacent spend on consultancies, cyber
              tooling, or labor. The correct diligence posture is therefore to preserve an evidence-constrained sizing
              lens and explicitly log the missing market-size work rather than manufacture a broad TAM from unrelated
              security categories.
            claimRefs:
