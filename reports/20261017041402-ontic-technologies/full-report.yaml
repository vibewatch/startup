  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence clusters Ontic's risks around compliance depth, AI execution, and partner-attached delivery rather
      than a single existential flaw.
    data:
      columns:
        - Medium likelihood
        - High likelihood
      rows:
        - label: High impact
          values:
            - text: Assurance depth gap
              detail: Broader third-party proof on incidents, audits, and control effectiveness is still limited in this pool.
            - text: AI roadmap execution
              detail: Part of the 2026 AI feature set is still future-dated rather than fully evidenced as shipped.
        - label: Medium-high impact
          values:
            - text: Integration complexity
              detail: Connected Intelligence depends on keeping data, workflows, and context synchronized across systems.
            - text: Partner-attached service reliance
              detail: >-
                Control Risks analysts and Seerist data can improve outcomes, but they may also hide services
                dependence.
        - label: Medium impact
          values:
            - text: ROI portability
              detail: >-
                Public customer stories are positive but do not yet provide denominator-level deployment and renewal
                benchmarks.
            - text: Customer concentration opacity
              detail: >-
                Fortune 100 and Fortune 500 logos are cited, but public renewal and concentration data remain absent
                here.
        - label: Medium likelihood
          values:
            - text: Market-access expansion burden
              detail: >-
                Federal and enterprise expansion can increase audit, support, and documentation costs even when
                go-to-market access improves.
            - text: Demo-led evidence quality
              detail: >-
                Some retained proof is still marketing-level and forces follow-up diligence before underwriting
                downside.
        - label: Monitoring watchlist
          values:
            - text: Compliance-scope durability
              detail: >-
                Investors should monitor whether public-sector references expand into repeatable deployments with
                unchanged authorization scope.
            - text: Services attach rates
              detail: >-
                If external analysts become essential to value delivery, software economics and portability could
                weaken.
        - label: Lower immediate severity
          values:
            - text: Brand-positioning drift
              detail: >-
                Broad Connected Intelligence messaging is not itself fatal, but it can blur what functionality is
                already production-grade.
            - text: Awards and marketing overhang
              detail: >-
                External awards help awareness but do not independently clear core diligence questions on resilience or
                concentration.
    approximationNotes: Matrix placement is a qualitative synthesis from the retained public evidence rather than a probabilistic model.
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR008
      - CR009
      - CR010
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Category tailwinds and product/public-sector proof are outweighed by valuation opacity and unresolved diligence
      asks.
    data:
      nodes:
        - id: market-tailwind
          label: Growing category
          note: Frost projects $58.84B in 2025 to $170.14B by 2030.
        - id: product-proof
          label: Product depth
          note: Connected Intelligence system of record plus AI-assisted workflows and reporting.
        - id: deployment-proof
          label: Deployment credibility
          note: FedRAMP Moderate authorization and enterprise/federal case-study references.
        - id: capital-base
          label: Capital to scale
          note: $230M Series C follows earlier disclosed funding and supports AI and expansion.
        - id: valuation-gap
          label: Valuation gap
          note: Assigned sources still do not disclose current valuation, preference stack, ARR quality, or margins.
        - id: recommendation
          label: Track
          note: Continue diligence; do not assume fair entry without direct pricing and economics evidence.
      edges:
        - from: market-tailwind
          to: product-proof
          label: supports demand
        - from: product-proof
          to: deployment-proof
          label: enables adoption
        - from: deployment-proof
          to: capital-base
          label: improves scale case
        - from: capital-base
          to: valuation-gap
          label: still needs pricing proof
        - from: valuation-gap
          to: recommendation
          label: determines call
    approximationNotes: Figure expresses decision flow rather than an implied scoring model; it does not infer valuation multiples.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV011
      - CV012
      - CV013
