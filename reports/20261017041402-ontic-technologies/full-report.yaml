            body: >-
              Leadership visibility in the assigned pool is concentrated around co-founder and CEO Lukas Quanstrom. The
              strongest capital signal is the August 2025 Series C led by KKR, with Reuters independently confirming the
              raise while also noting that the company did not disclose valuation. That leaves an important governance
