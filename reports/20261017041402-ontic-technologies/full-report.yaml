      - number: '5.3'
        title: Trust, AI controls, and remaining technical risk
        blocks:
          - type: paragraph
            body: >-
              Ontic's strongest fresh maturity signal is the April 2026 FedRAMP Moderate authorization announcement,
              which pairs compliance language with an Authority to Operate for mission-critical public-sector use. The
              new Ontic AI surface also makes unusually explicit trust claims for a marketing page, stating that
              customer data is not used to train shared models and that humans review outputs before decisions are made.
              Even so, the public evidence is still selective. FedRAMP is a meaningful control signal for one deployment
              path, but there is no public uptime history, detailed API or implementation documentation, model
              evaluation evidence, or customer-level proof of deployment speed and reliability. That leaves underwriting
              risk concentrated in implementation effort, integration maintenance, and AI-governance verification rather
              than in simple product absence.
