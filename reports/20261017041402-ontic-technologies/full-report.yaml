              - CI006
              - CI009
              - CI011
              - CI013
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Reuters and the retained funding coverage confirm Ontic raised a $230 million Series C in August 2025,
              while company-issued funding coverage says the proceeds are meant to fund AI investment, international
              expansion, and further platform development for enterprise and public-sector buyers (CI003, CI005). Those
              planned uses of funds line up with visible cost drivers: public-sector compliance and support, Europe
              buildout, and continued product investment. The Control Risks partnership adds another nuance to cost
              structure by showing that some customer value can be delivered with embedded specialist analysts and
              operating expertise alongside the platform, which may help customer outcomes but also makes the
              software-versus-services mix harder to infer from public materials alone (CI010). Reuters separately noted
              that the company did not disclose the valuation for the Series C, so even the most recent financing round
              leaves a major underwriting input missing (CI004).
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI010
      - number: '4.4'
        title: Diligence blockers and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The retained public record is enough to support a directional verdict but not a modeled one. AI Market
              Watch explicitly says Ontic's specific growth metrics are not publicly disclosed, and the broader retained
              source set similarly omits revenue, ARR, gross margin, cash balance, burn, runway, customer concentration,
              and debt obligations (CI012, CI013). That leaves investors with a coherent strategic picture --
              software-led expansion into government and new geographies with meaningful fresh capital -- but without
              the realized pricing, margin profile, or liquidity facts that would determine how attractive that growth
              is on a risk-adjusted basis (CI014). The right conclusion is not that Ontic is weak financially; it is
              that public evidence is too incomplete to underwrite revenue quality, capital efficiency, or runway
              confidence without management materials.
            claimRefs:
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting blocker
            body: >-
              Public evidence does not disclose realized pricing, revenue scale, margin, burn, cash, or runway, so the
              chapter can explain the business model but cannot underwrite its economics.
            calloutType: risk
            claimRefs:
