              - CM016
      - number: '2.2'
        title: Adoption drivers, channels, and procurement unlocks
        blocks:
          - type: paragraph
            body: >
              The strongest adoption drivers in the retained pool are operational efficiency, data consolidation, and
              procurement flexibility. Ontic's product copy emphasizes a centralized system of record, 60+ integrations,
              and deployment in either Ontic's cloud or the customer's cloud, all of which lower the cost of fitting the
              product into an existing enterprise stack. The current product page adds an AI and workflow-automation
              narrative aimed at reducing manual work, while the Control Risks partnership shows why some buyers may
              adopt through a services-assisted model rather than through a purely self-serve software motion: external
              analysts can work inside the same environment when the customer's internal team lacks coverage or
              capacity. FedRAMP Moderate and an ATO are especially important because they move Ontic from a
              corporate-only narrative to an addressable public-sector procurement path, which can matter
              disproportionately for valuation even before revenue contribution is disclosed.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
