              - CU015
      - number: '6.3'
        title: Durability, concentration, and user-friction evidence remain underdisclosed
        blocks:
          - type: paragraph
            body: >-
              The main diligence gap is not whether Ontic can describe customer value, but whether outside evidence can
              verify durability at scale. Across the reviewed public sources, Ontic does not disclose net revenue
              retention, gross retention, churn, renewal rates, contract length, or top-customer concentration, leaving
              durability and concentration risk effectively unproven in public materials. Even the named or semi-named
              success stories lean on company-issued surfaces and often omit contract size or renewal history.
              Independent user-signal is also shallow on the mobile surface: Apple's app listing shows only five ratings
              and warns that background location use can decrease battery life, which is a modest but real friction
              signal rather than evidence of broad, satisfied end-user adoption.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-sector eligibility is a genuine customer-surface expansion, not just a product badge
            body: >-
              FedRAMP Moderate plus an ATO meaningfully widen Ontic's reachable buyer set by enabling federal security
              teams to adopt the same centralized workflow model already marketed to enterprise customers.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU013
          - type: callout
            title: Public proof is persuasive on workflow fit but weak on durability
            body: >-
              The strongest public evidence shows customer outcomes and workflow breadth, yet it does not disclose
              churn, renewals, top-customer share, or contract length, leaving concentration and durability risk
              unresolved.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory posture is directionally positive, but broader assurance remains under-documented
        blocks:
          - type: paragraph
            body: >-
              The strongest concrete risk mitigation in the assigned pool is Ontic's April 2026 statement that it
              achieved FedRAMP Moderate Authorization and an Authority to Operate for mission-critical security use
              cases. That matters because it gives Ontic a real credential for U.S. government deployment rather than a
              generic security marketing claim. But the same evidence also raises the bar: once Ontic sells into federal
              and Fortune 500 security programs, readers should expect auditable proof on control maturity, incident
              handling, privacy governance, and the exact scope of approved environments. The pool does not provide that
              broader independent package. The government-hosted FedRAMP marketplace fetch is too truncated to
              independently document the listing details, and the chapter's other AI and platform materials remain
              company-controlled. As a result, regulatory risk is not that Ontic lacks a visible compliance story; it is
              that investors still need external evidence to verify how deep that story goes across privacy, AI
              governance, and ongoing continuous-monitoring obligations.
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR012
      - number: '7.2'
        title: The product story is broad, but execution risk sits inside reliability, integrations, and the AI roadmap
        blocks:
          - type: paragraph
            body: >-
              Ontic's product positioning promises one connected operating system for security teams: centralized data,
              AI summarization, workflow automation, role-based access, multi-source monitoring, and measurable
              reporting. That breadth is commercially attractive, but it also means operational risk concentrates in a
              few failure modes. If integrations do not stay reliable, if data quality is weak, or if
              deployment-specific configurations are heavy, the central "connected intelligence" value proposition
              weakens quickly. The AI launch evidence is also mixed. Ontic says summaries and trend grouping are already
              available, but Chat, Deduplication, and Copilot were only expected by the end of 2026, so part of the
              pitch is still forward-looking. The assigned pool does not surface public uptime, outage,
              implementation-time, or security-incident evidence that would independently confirm operating resilience
              at scale. Investors should therefore treat public product claims as plausible mitigations, not as
              completed proof that the operating model is already de-risked.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.3'
        title: Partner-attached delivery and sparse downside disclosure create the main thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most important dependency risk in the assigned pool is not a single named supplier; it is the
              possibility that customer outcomes rely on a blend of Ontic software, external analysts, and third-party
              data feeds that public materials do not fully disaggregate. Ontic's September 2026 partnership with
              Control Risks explicitly embeds outside analysts into customer environments and brings Seerist event data
              into Ontic's Risk Intelligence offering. That can deepen product value, but it also raises questions about
              attach rates, renewal durability, services intensity, and how portable customer workflows remain if a
              partner relationship changes. Separately, Ontic cites Fortune 100 and Fortune 500 usage yet does not
              disclose concentration, churn, or renewal data in the risk evidence assigned here, which keeps the
              downside hard to size. The practical kill criteria are therefore measurable: a slip in promised AI
              availability, loss or narrowing of compliance scope for sensitive deployments, evidence that partner-led
              services are necessary for steady-state value realization, or continued absence of independent assurance
              on incident history and control effectiveness.
            claimRefs:
              - CR005
              - CR006
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR008
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Main thesis-break triggers
            body: >-
              The most actionable kill criteria are a visible slip in promised AI availability, any narrowing or lapse
              in sensitive-deployment compliance posture, evidence that services partners are required to make the
              product work in practice, or credible third-party incident history that contradicts the current
              marketing-led reliability narrative.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR010
              - CR012
          - type: callout
            title: Current mitigations are more visible than current downside proof
            body: >-
              Ontic's assigned risk evidence documents platform controls, FedRAMP progress, and human-in-the-loop AI
              guardrails better than it documents outages, failed deployments, customer concentration, or legal
              exposure. That asymmetry should lower confidence in public downside sizing, not be mistaken for the
              absence of risk.
            calloutType: insight
            claimRefs:
              - CR007
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              Ontic now looks like a real category contender rather than a speculative concept. The evidence set shows a
              platform that has moved beyond point-solution positioning, raised large institutional capital, and added
              public-sector credibility through FedRAMP authorization. Those signals matter because they increase the
              chance that Ontic can stay in competitive enterprise and government evaluations while continuing to invest
              in product and go-to-market depth.


              The same evidence set is still too thin to support a buy recommendation at an undisclosed price. None of
              the assigned sources disclose the post-Series C valuation, liquidation preferences, current ARR, gross
              margin, burn, customer concentration, or churn. That leaves too much uncertainty around what investors
              would actually be paying for and how much downside protection exists if growth slows or software multiples
              compress. The disciplined call is therefore track rather than buy: continue diligence, but do not
              underwrite valuation upside without direct evidence on price and revenue quality.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV006
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Thesis, anti-thesis, and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case starts with category tailwinds and product breadth. Frost & Sullivan's market
              forecast implies that demand for risk-intelligence platforms is expanding quickly, and Ontic's own
              platform materials consistently describe a centralized system of record spanning intelligence,
              investigations, incidents, workflow automation, and AI-assisted prioritization. Official case studies also
              show concrete operational outcomes, including large reductions in manual work and measurable recovery or
              cost-avoidance, which is more useful than abstract product language alone.


              The anti-thesis is not that Ontic lacks product-market relevance; it is that public proof remains heavily
              issuer-controlled. The best commercial and product evidence still comes from company channels or
              syndicated company releases, while the independent pool does not supply enough revenue-quality or price
              data to test whether current momentum translates into attractive entry economics. Even the more
              independent profile sources reinforce that specific growth metrics remain undisclosed. That means
              valuation is highly sensitive to diligence findings: a fair entry could still exist, but public evidence
              does not prove it today.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV013
      - number: '8.3'
        title: Scenarios, downside triggers, and return framing
        blocks:
          - type: paragraph
            body: >-
              The bull case requires three things to happen together: category spending must keep compounding, Ontic
              must convert product leadership and FedRAMP status into broader enterprise and public-sector adoption, and
              the large Series C round must fund efficient expansion rather than merely more expensive growth. In that
              case, today's capital base and partner ecosystem could help Ontic expand internationally and deepen
              workflow penetration before the category consolidates.


              The base case assumes Ontic keeps winning relevant accounts but remains difficult to value because
              investors still cannot verify retention, margins, pricing power, or customer concentration from public
              materials. Under that outcome, the company may be strategically sound but financially impossible to price
              with conviction. The bear case is not product failure alone; it is a combination of opaque economics,
              partner-dependent expansion, and governance or privacy issues that raise diligence friction just as
              capital becomes more expensive. At that point, multiple compression or a later down-round would matter
              more than category narrative.
            claimRefs:
              - CV002
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Before underwriting a price, an investor should request the actual Series C terms, current valuation,
              dilution path, and any investor control or liquidation protections. Those items determine whether the
              company's operating progress accrues to new equity holders or is already embedded in a rich cap table. The
              diligence package should also include current ARR, gross margin, burn, net retention, pipeline conversion,
              customer concentration, and renewal behavior, because none of those metrics are supplied in the assigned
              public evidence.


              A second diligence lane should focus on product governance and deployment risk. Ontic's own materials make
              AI central to the roadmap, and the App Store listing states that the mobile product may collect
              identifiers and diagnostics linked to identity and may use location even when not open. For sensitive
              enterprise and government deployments, that does not invalidate the product, but it does make privacy
              controls, data-handling boundaries, and mobile governance part of the investment case. If management
              cannot resolve those diligence asks with clean evidence, the thesis should remain track or move to avoid
              rather than stretch toward a buy.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommended posture
            body: >-
              Track Ontic until management provides the post-Series C valuation, investor terms, and current
              revenue-quality metrics needed to price upside against dilution and downside risk.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV011
              - CV012
          - type: callout
            title: Most likely thesis-break trigger
            body: >-
              If diligence shows weak retention, concentrated revenue, aggressive preference terms, or unresolved
              privacy controls in sensitive deployments, the call should move from track to avoid.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
