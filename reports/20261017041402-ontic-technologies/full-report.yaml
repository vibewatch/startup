  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competitive set is broader than named software peers
        blocks:
          - type: paragraph
            body: >-
              The retained evidence frames Ontic as a platform for security teams that need one operating system across
              intelligence, investigations, incidents, reporting, and response, rather than as a narrow alerting or
              watchlist product. That broadens the competitive set beyond direct software peers. Ontic's own platform
              and partnership materials repeatedly describe buyers trying to connect fragmented data, workflows, and
              analysts, while the 2026 Frost Radar press release says the category itself includes 15 evaluated vendors.
              Within the assigned evidence, the only independent source that names direct peers points to Resolver,
              AlertMedia, and ThreatConnect, but the deeper practical competition also includes service-led intelligence
              providers, internal-build programs, and the buyer's incumbent mix of point tools, feeds, files, and
              spreadsheets. For diligence purposes, that means the underwriting question is not only "Who else sells
              software here?" but also "Which alternative best collapses workflow fragmentation without adding headcount
              or trust friction?"
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP012
