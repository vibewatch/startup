            body: >-
              Ontic's public surfaces are specific about workflows, integrations, AI assistance, and federal compliance,
              but they do not expose uptime/SLA history, backend/cloud architecture, model evaluation metrics, or
              implementation-reference detail. Technical diligence should request architecture diagrams, API/integration
              documentation, support and incident metrics, and AI-governance artifacts before treating the marketing
              breadth as proven operational depth.
