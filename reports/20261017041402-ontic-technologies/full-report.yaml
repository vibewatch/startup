  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and buyer problem
        blocks:
          - type: paragraph
            body: >
              The company is not describing a generic cybersecurity or guard-services market; it is defining a workflow
              layer for corporate and government security teams that need one connected operating picture for threats,
              investigations, incidents, and response. Across the FedRAMP announcement, the platform page, and the
              mobile listing, Ontic consistently frames the problem as fragmented physical-security data, manual triage,
              and limited visibility across people, assets, and incidents. That boundary matters because it keeps the
              relevant spend closer to protective intelligence, GSOC, investigation, and risk-program budgets than to
              broad IT, cyber, or labor-heavy guarding categories. The same evidence also shows a multi-role user base:
              operational analysts and GSOC teams are the hands-on users, while security leaders are the budget holders
              who need measurable response speed, audit history, and provable business continuity outcomes. Precise
              budget ownership remains an evidence gap rather than a verified market fact.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
