          touchpoints:
            - Entity database
            - Case management
            - Role-based controls
          note: Ontic positions the platform as a centralized operating record for threats, incidents, and investigations.
        - label: Triage with AI
          actor: Analysts and protective intelligence managers
          phase: Prioritization
          touchpoints:
