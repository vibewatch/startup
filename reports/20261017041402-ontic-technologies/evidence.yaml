evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: >-
      Board composition, board seat allocation, and KKR governance or liquidation-right details after the Series C
      round.
    whyItMatters: >-
      Control rights and board structure affect underwriting of strategic flexibility, future dilution, and investor
      influence.
    diligencePath: >-
      Request the cap table, board roster, investor rights summary, and Series C legal documents or a management memo
      that summarizes them.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: core-operating-metrics
    missingEvidence: Source-backed revenue, ARR, customer count, customer concentration, and current valuation figures.
    whyItMatters: >-
      Those metrics are required to anchor later financial, customer, and valuation analysis without over-relying on
      company narrative.
    diligencePath: >-
      Obtain an investor update, board deck, data room KPI snapshot, or audited management reporting that reconciles
      revenue, ARR, customer count, and valuation history.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-evidence
    missingEvidence: >-
      Independent critical coverage or official records on lawsuits, outages, leadership churn, or security incidents
      affecting Ontic.
    whyItMatters: >-
      The company-overview gate expects an adverse lens, and the current assigned pool is heavy on official and
      confirming sources.
    diligencePath: >-
      Add independent legal, regulatory, or incident reporting in the next refresh so the chapter can test downside
      narratives instead of treating the absence of evidence as clearance.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market-size source that separates Ontic's connected-security-operations wedge from adjacent cyber,
      guarding, consultancy, and generic risk software spend.
    whyItMatters: >-
      Without a clean denominator, any TAM/SAM/SOM number would overstate the market and blur software versus services
      economics.
    diligencePath: >-
      Pull current analyst or public-company category estimates for protective intelligence, GSOC software, and
      physical-security operations platforms, then reconcile included and excluded spend explicitly.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Public evidence that identifies the typical budget owner, pricing basis, and ACV/payback profile by segment.
    whyItMatters: >-
      Buyer and payer alignment governs sales cycle length, expansion motion, and valuation quality, but the retained
      pool only implies these economics from product and partner messaging.
    diligencePath: >-
      Request pricing collateral, procurement examples, and customer references that name the approving budget owner and
      expected ROI timing.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: adoption-time-series
    missingEvidence: >-
      A current multi-year time series for customers, users, or segment revenue that connects 2021 traction claims to
      2026 positioning.
    whyItMatters: >-
      Historical growth points and current product messaging cannot by themselves show whether demand accelerated,
      flattened, or shifted by segment.
    diligencePath: >-
      Request updated operating metrics from management or current third-party reporting that bridges enterprise,
      public-sector, and international traction over time.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Public list pricing, package structure, and discount logic for Ontic and named peers.
    whyItMatters: >-
      Pricing opacity prevents clean head-to-head commercial comparison and limits underwriting confidence on switching
      friction.
    diligencePath: >-
      Request current price books, sample MSAs, and discount corridors from management and compare them against live
      competitor quotes.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-benchmarking
    missingEvidence: Independent retained competitor product and trust documentation for Resolver, AlertMedia, and ThreatConnect.
    whyItMatters: The named-peer set is thinly documented, which weakens confidence in capability and regulatory comparisons.
    diligencePath: >-
      Collect direct competitor product, pricing, security, and public-sector deployment pages and re-run the feature
      and pricing comparison with primary evidence.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing
    missingEvidence: Customer contracts, price book, minimum commits, discount waterfall, and realized ACV by segment.
    whyItMatters: Without realized pricing, revenue quality and sales efficiency cannot be underwritten.
    diligencePath: >-
      Request current price book, three signed contracts, and cohort-level realized pricing by enterprise and government
      segment.
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-growth
    missingEvidence: ARR, GAAP revenue, growth rate, churn, net retention, and customer concentration by cohort.
    whyItMatters: >-
      Top-line scale and retention determine whether fresh capital is amplifying a durable software business or masking
      weak revenue quality.
    diligencePath: Request monthly ARR bridge, quarterly revenue history, logo churn, NRR, and top-customer concentration schedule.
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-burn
    missingEvidence: >-
      Gross margin, services margin, hosting/compliance cost, headcount by function, monthly burn, cash balance, runway,
      and debt terms.
    whyItMatters: >-
      These inputs determine whether Ontic's expansion can be funded efficiently and whether the model scales like
      software or a hybrid services business.
    diligencePath: >-
      Request board deck or finance pack with gross margin bridge, opex by function, monthly burn, cash waterfall,
      runway case, and any credit or debt documents.
  - type: private-evidence-only
    severity: material
    topic: public-sector-unit-economics
    missingEvidence: >-
      Government contract vehicles, procurement cycle length, support burden, authorization upkeep cost, and
      public-sector gross margin.
    whyItMatters: >-
      FedRAMP and ATO expand market access, but government growth can dilute margins or absorb working capital if
      support costs are heavy.
    diligencePath: >-
      Request federal pipeline report, win/loss data, implementation staffing model, and cost-to-maintain compliance
      certifications.
  - type: private-evidence-only
    severity: material
    topic: reliability-and-governance-depth
    missingEvidence: >-
      Uptime and incident history, SLA/support metrics, backend/cloud architecture diagrams, model evaluation results,
      and change-management documentation.
    whyItMatters: >-
      Without this evidence, it is hard to underwrite whether Ontic's broad workflow claims translate into durable
      operational reliability and governable AI deployment.
    diligencePath: >-
      Request architecture diagrams, SOC/support runbooks, incident metrics, release/change logs, and AI evaluation or
      red-team documentation during diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: implementation-proof
    missingEvidence: >-
      Independent customer or partner evidence on deployment time, integration burden, admin overhead, and realized
      productivity improvements.
    whyItMatters: >-
      Technical breadth can create hidden implementation cost if integrations, workflow design, or analyst operating
      models are bespoke for each enterprise.
    diligencePath: >-
      Interview recent customers and implementation partners; request integration counts by deployment, time-to-value
      data, and reference architectures by customer segment.
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: Public or dataroom evidence for NRR, GRR, churn, renewal cadence, and average contract duration.
    whyItMatters: >-
      Without durability metrics, it is impossible to assess whether customer value compounds or whether growth depends
      on fresh logo acquisition.
    diligencePath: >-
      Request cohort retention tables, logo churn history, renewal schedules, and a customer-level revenue bridge for
      the last 24 months.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Disclosure of top-customer revenue share, public-sector mix, and partner-sourced bookings.
    whyItMatters: Concentration and channel dependence can materially change downside risk even when adoption stories look strong.
    diligencePath: >-
      Request a customer concentration schedule, segment ARR split, and direct-versus-partner sourced bookings by
      quarter.
  - type: enumeration-incomplete
    severity: material
    topic: proof-quality
    missingEvidence: A fuller named production-customer list with deployment scope, contract age, and referenceability status.
    whyItMatters: >-
      Public proof today is persuasive on workflow fit but too curated and anonymized to verify breadth or replication
      across the installed base.
    diligencePath: >-
      Obtain a customer reference list with at least five named accounts across enterprise and government plus renewal
      status and measurable outcomes.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: adverse-user-signal
    missingEvidence: Independent review volume from broader user communities such as G2, Capterra, or Gartner Peer Insights.
    whyItMatters: >-
      Five App Store ratings and directory-style testimonials are too thin to judge satisfaction, deployment friction,
      or support quality at scale.
    diligencePath: Collect current review-platform exports, support-ticket trends, and churn reasons for mobile and web users.
