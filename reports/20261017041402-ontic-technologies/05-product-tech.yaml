company:
  name: Ontic Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Ontic's public product surface consistently describes a connected-intelligence platform that centralizes physical-security data, workflows, and reporting, with fresh 2026 evidence for FedRAMP authorization and a new AI layer. The product narrative is specific enough to show the workflow and modular breadth, but public evidence remains thin on uptime, backend architecture, implementation effort, and model-governance depth.
sections:
  - id: platform-scope-and-workflow
    title: Platform scope and customer workflow
    body: Ontic's official platform page describes the product as a system of record for physical-security teams rather than a narrow alerting tool, and the adjacent third-party profiles reinforce that category framing for both enterprise and government buyers. The visible workflow starts with multi-source monitoring, maps, dashboards, and automated feeds, then moves into AI-assisted triage, casework, and reporting. Public module evidence is strongest for risk intelligence, investigations, case management, and AI-assisted workflow automation; it is weaker on quantitative deployment outcomes beyond selected customer stories and marketing statistics. The practical takeaway is that Ontic appears to sell a broad operational layer for protective intelligence programs, but buyers still need diligence on where configurable workflow ends and where custom implementation begins.
    claimRefs: [CE001, CE002, CE003, CE006, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-and-extension-model
    title: Architecture, deployment, and extension model
    body: Public materials show a layered operating model rather than a deeply disclosed software architecture. Ontic says the platform centralizes signals into a record layer, adds workflow automation, reporting, and governance controls, and can run in Ontic's cloud or the customer's environment. The 60-plus integration claim, the Control Risks partnership, and the Seerist feed connection together suggest that extensibility and data connectivity are central to the product's value proposition. The developer-signal proxy is a frontend leadership role that calls out React, TypeScript, API integrations, testing, observability, security, and CI/CD, which is useful evidence that the product surface is a substantial modern web application. It still does not reveal the backend stack, data model, or how difficult customer-specific integrations are to implement and maintain.
    claimRefs: [CE004, CE005, CE008, CE009, CE013, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-ai-and-technical-risk
    title: Trust, AI controls, and remaining technical risk
    body: Ontic's strongest fresh maturity signal is the April 2026 FedRAMP Moderate authorization announcement, which pairs compliance language with an Authority to Operate for mission-critical public-sector use. The new Ontic AI surface also makes unusually explicit trust claims for a marketing page, stating that customer data is not used to train shared models and that humans review outputs before decisions are made. Even so, the public evidence is still selective. FedRAMP is a meaningful control signal for one deployment path, but there is no public uptime history, detailed API or implementation documentation, model evaluation evidence, or customer-level proof of deployment speed and reliability. That leaves underwriting risk concentrated in implementation effort, integration maintenance, and AI-governance verification rather than in simple product absence.
    claimRefs: [CE007, CE010, CE011, CE012, CE015]
callouts:
  - calloutType: risk
    title: Public architecture proof trails lag the product breadth
    body: Ontic's public surfaces are specific about workflows, integrations, AI assistance, and federal compliance, but they do not expose uptime/SLA history, backend/cloud architecture, model evaluation metrics, or implementation-reference detail. Technical diligence should request architecture diagrams, API/integration documentation, support and incident metrics, and AI-governance artifacts before treating the marketing breadth as proven operational depth.
    claimRefs: [CE006, CE007, CE011, CE013, CE015]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation signal
      - Diligence gap
    rows:
      - [Ontic Platform, Corporate and government security operations teams, Broadly marketed core platform, "System-of-record positioning across data, workflow, reporting, and governance", "Need customer evidence on deployment time, admin overhead, and realized adoption breadth"]
      - [Risk Intelligence, Protective intelligence and GSOC analysts, Publicly visible and integrated with partner feeds, "Multi-source monitoring plus Seerist event-feed integration", "Need proof of source coverage, alert quality, and analyst productivity lift"]
      - [Incidents / Investigations / Case Management, Security operations and investigations teams, Publicly visible workflow layer, "Combines incidents, investigations, and auditable records in one operating environment", "Need evidence on configurability limits, data model flexibility, and case-volume performance"]
      - [Ontic AI, Analysts and program leads inside the existing platform, Fresh 2026 launch with partial roadmap, "Connected-context summaries, trend grouping, and planned chat/copilot capabilities", "Need model-evaluation, guardrail, and customer-usage evidence beyond launch claims"]
      - [Public-sector deployment surface, Federal security teams, Mature enough for 2026 compliance announcement, "FedRAMP Moderate authorization and ATO widen addressable deployment environments", "Need independent proof of live federal deployments and agency-specific implementation outcomes"]
    notes: Public rows mix official product claims, a 2026 compliance milestone, and third-party framing; they do not prove realized customer breadth or production depth for every module.
    claimRefs: [CE001, CE002, CE003, CE007, CE010, CE012, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow signal
      - Company solution
      - Measurable benefit evidence
      - Limitation
    rows:
      - ["Monitor known and emerging threats", "Teams face scattered systems, teams, and spreadsheets", "Dynamic data monitoring, maps, dashboards, and automated feeds", "Product page cites a structured foundation and customer stories cite faster identification of concerning threats", "No public precision/recall, false-positive, or alert-volume metrics"]
      - ["Triage and investigate incidents", "Security teams need a centralized record and auditable decisions", "AI summarization, entity resolution, tasking, incidents, investigations, and case management", "FedRAMP announcement says workflows reduce noise and streamline investigations", "No public implementation-time or case-throughput benchmarks"]
      - ["Extend analyst capacity", "Security teams can be stretched thin across regions and time zones", "Control Risks analysts can work directly in the Ontic environment", "Partnership page describes a shared operating environment with more visible, auditable handling", "Partner announcement is company-issued and does not prove repeatability across customers"]
      - ["Turn connected data into AI-assisted actions", "Signals are fragmented without prior context, incidents, and protected-person history", "Ontic AI adds summaries, trend grouping, planned chat/deduplication/copilot, and future always-on agents", "Official AI materials frame the benefit as reduced manual review and faster orientation", "Roadmap elements remain forward-looking and lack public adoption or quality metrics"]
    notes: Benefit language is directionally supported by official materials and one partnership case example; null operational metrics remain an explicit diligence ask rather than an implied absence of value.
    claimRefs: [CE001, CE002, CE003, CE008, CE010, CE011, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Signal and data ingestion", "Collect public data, security-system data, social media, dark-web intelligence, and partner/event feeds", "Breadth and quality of external connectors plus customer data hygiene", "Integration breadth is marketed, but public API and connector maintenance evidence is limited"]
      - ["System-of-record and case layer", "Centralize entities, incidents, investigations, and decisions in one operating environment", "Consistent schema, permissions, and workflow configuration across teams", "No public evidence on data model flexibility, scale ceilings, or migration tooling"]
      - ["Workflow automation and reporting", "Automate triage, tasking, alerts, metrics, and program reporting", "Customer-specific process design plus measurable governance requirements", "Risk of long implementation cycles or bespoke workflow debt is not disclosed publicly"]
      - ["Partner and external-analyst extension layer", "Bring Control Risks analysts and Seerist event data into the same operating environment", "Partner feed availability, commercial relationships, and shared operating procedures", "Operational value depends on third-party continuity and joint-service execution"]
      - ["AI assistance layer", "Use connected history and context for summaries, recommendations, and future agentic work", "Underlying permissions, model selection, evaluation, and human-review controls", "Public materials do not expose model quality metrics, rollback controls, or safety-testing evidence"]
    notes: This architecture table reflects the public operating model rather than a disclosed code-level architecture; backend/cloud specifics, API docs, and model-governance artifacts remain unavailable publicly.
    claimRefs: [CE001, CE003, CE004, CE008, CE009, CE010, CE011, CE013, CE015]
