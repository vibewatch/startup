  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-and-governance-depth
      missingEvidence: Uptime and incident history, SLA/support metrics, backend/cloud architecture diagrams, model evaluation results, and change-management documentation.
      whyItMatters: Without this evidence, it is hard to underwrite whether Ontic's broad workflow claims translate into durable operational reliability and governable AI deployment.
      diligencePath: Request architecture diagrams, SOC/support runbooks, incident metrics, release/change logs, and AI evaluation or red-team documentation during diligence.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: implementation-proof
      missingEvidence: Independent customer or partner evidence on deployment time, integration burden, admin overhead, and realized productivity improvements.
      whyItMatters: Technical breadth can create hidden implementation cost if integrations, workflow design, or analyst operating models are bespoke for each enterprise.
      diligencePath: Interview recent customers and implementation partners; request integration counts by deployment, time-to-value data, and reference architectures by customer segment.
