    approximationNotes: Figure expresses decision flow rather than an implied scoring model; it does not infer valuation multiples.
    claimRefs: [CV002, CV004, CV006, CV011, CV012, CV013]
callouts:
  - calloutType: recommendation
    title: Recommended posture
    body: Track Ontic until management provides the post-Series C valuation, investor terms, and current revenue-quality metrics needed to price upside against dilution and downside risk.
    claimRefs: [CV003, CV011, CV012]
  - calloutType: risk
    title: Most likely thesis-break trigger
    body: If diligence shows weak retention, concentrated revenue, aggressive preference terms, or unresolved privacy controls in sensitive deployments, the call should move from track to avoid.
    claimRefs: [CV010, CV011, CV012]
