      - ["Customer ROI proxy", "Product page cites value in weeks, smaller headcount, 85% manual-work reduction, and $2M cost avoidance anecdotes", "Low", "Helpful for customer ROI but not a substitute for Ontic's own unit economics", "Provide measured deployment payback, expansion rates, and retention cohorts"]
      - ["Headcount footprint", "181 U.S.-based employees on Great Place To Work", "Low", "Partial proxy for opex base, but it excludes global staffing and functional mix", "Provide fully loaded headcount by function, geography, and period"]
      - ["Capital base", "$230M Series C announced in August 2025", "High", "Fresh capital supports expansion but does not reveal remaining liquidity", "Provide cash balance, monthly burn, runway, and debt covenants"]
      - ["Gross margin / services mix", null, "Low", "Margin path determines whether Ontic scales like software or a hybrid services model", "Provide gross margin bridge, hosting/compliance costs, and services attach rate"]
      - ["Public-sector expansion cost", "FedRAMP Moderate Authorization and ATO achieved by April 2026", "Medium", "Government access can improve growth while raising compliance and support costs", "Provide authorization upkeep cost, public-sector support headcount, and government gross margin"]
    notes: "Null means the metric was not publicly disclosed in the retained source set; proxies are directional, not management-reported unit economics."
    claimRefs: ["CI003", "CI006", "CI009", "CI011", "CI013"]
