callouts:
  - calloutType: "risk"
    title: "Underwriting blocker"
    body: >-
      Public evidence does not disclose realized pricing, revenue scale, margin, burn, cash, or
      runway, so the chapter can explain the business model but cannot underwrite its economics.
    claimRefs: ["CI008", "CI013", "CI014"]
  - calloutType: "insight"
    title: "Capital is buying expansion, not clarity"
    body: >-
      The 2025 Series C clearly funds AI, public-sector, and international growth, but the same
      public record still withholds valuation, liquidity, and operating-efficiency metrics.
    claimRefs: ["CI003", "CI004", "CI005", "CI014"]
