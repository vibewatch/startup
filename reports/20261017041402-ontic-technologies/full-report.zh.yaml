      - number: '4.2'
        title: GTM 动作与效率代理指标
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开商业化信号是欧洲董事总经理招聘信息：Ontic
              正招聘首位区域销售负责人，负责建立市场入口、拿下早期客户、预测管线和收入，并让定价、合同和谈判符合公司标准（CI006）。这更像直接的战略销售模式，交易周期复杂、利益相关方管理较重，而不是交易型或自助式模式（CI007）。Ontic
              产品页提供了减少人工工作、避免成本以及以更少人手扩大影响等客户 ROI 例证，但它们是客户结果的代理指标，不是 Ontic 自身 CAC、回本周期、留存或毛利润情况的披露（CI009）。Great Place
              To Work 提供了 181 名美国员工的快照，构成部分人力规模数据，但职能构成、美国以外员工和完全计入的运营成本仍不透明（CI011）。
