              - CP012
              - CP015
      - number: '3.3'
        title: 持久性取决于数据上下文、切换成本和合作伙伴接入
        blocks:
          - type: paragraph
            body: >-
              持久性逻辑可信，但并非坚不可摧。Ontic 似乎通过部署信任、集成和嵌入式工作流建立切换成本，而不是依靠公开可见的锁定机制或已公布的价格优势。FedRAMP 和 ATO
              能提升公共部门及其他高风险项目的买方信心；可任意部署的选项、“60+ 个集成且持续增加”以及合作伙伴工作流，则在运营流程集中化后降低了彻底替换系统的吸引力。与此同时，Ontic 自己在 2026 年推出 AI
              也提醒人们，界面层 AI 功能可能很快商品化；如果竞争对手提供类似摘要或副驾驶，Ontic
              的护城河就必须来自累积的上下文、集成、工作流历史和外部分析师产能接入。当前证据集的弱点是，点名同行的产品和价格证明仍然稀少，因此护城河判断方向偏正，但独立的正面对比仍不足。
            claimRefs:
              - CP005
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: Ontic 竞争的是操作系统，而不只是告警数据源
            body: 最强的现有证据表明，Ontic 在工作流广度、部署信任，以及把软件与外部分析师产能结合的能力上占优；这比单纯比较点功能更难。
            calloutType: strength
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP013
          - type: callout
            title: 单靠 AI 不是持久护城河
            body: Ontic 的 2026 年 AI 发布增强了产品，但也凸显副驾驶和摘要功能可以在整个类别中扩散；因此，护城河更多取决于连接式上下文、集成和工作流历史，而不是通用模型功能。
            calloutType: risk
            claimRefs:
              - CP003
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现路径
        blocks:
          - type: paragraph
            body: >-
              Ontic 的公开页面将其描述为面向企业和政府安防团队销售的软件平台，用集中式记录系统承载保护性情报、事件管理、调查和案件管理，这支持软件驱动的收入模式，而非纯服务业务（CI001）。政府页面和 2026 年 4
              月的 FedRAMP/ATO
              公告表明，同一核心平台也在面向联邦买方，而不只是企业客户，扩大了可触达合同基础，但尚未证明任何具体的公共部门收入贡献（CI002）。明显缺失的是公开价格信息：现有产品、政府、合作和招聘页面都没有公布目录价、合同期限或实际定价基准，因此可以描述收入模式的结构，却无法量化（CI007、CI008）。也就是说，变现逻辑从机制上看可信，但收入质量仍取决于公开不可见的客户合同和实际附加率。
            claimRefs:
