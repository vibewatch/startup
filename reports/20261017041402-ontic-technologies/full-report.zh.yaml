  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方痛点
        blocks:
          - type: paragraph
            body: >
              公司描述的不是泛化的网络安全或保安服务市场，而是为企业和政府安防团队定义一层工作流：让他们围绕威胁、调查、事件和响应获得统一的连接式运营视图。FedRAMP
              公告、平台页面和移动端产品页都把问题指向实体安防数据碎片化、人工分流，以及对人员、资产和事件缺乏整体可见性。这一边界很重要，因为相关支出更接近保护性情报、GSOC、调查和风险项目预算，而不是广义
              IT、网络安全或劳动密集型保安类别。同一组证据还显示用户角色不止一种：运营分析师和 GSOC
              团队是直接使用者，安防负责人则是预算持有人，他们需要可量化的响应速度、审计记录和可证明的业务连续性结果。具体预算归属仍是证据缺口，尚非已验证的市场事实。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
