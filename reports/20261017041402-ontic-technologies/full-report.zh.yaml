        - 独立的续约、留存和客户集中度数据，才能让这些证明具备投资价值，而不只是看起来亮眼。
      - - 反论：估值不透明
        - 分配材料未披露当前估值、经常性收入质量、定价、现金消耗或优先权条款。
        - 若能确认 Series C 投后估值、ARR 桥接、毛利率、NRR 和股权结构摘要，判断可能转向合理或有吸引力。
    notes: 本表将公司发布的证明与独立市场背景结合起来；单位经济性披露缺失是主要反论，而不是品类缺乏相关性。
