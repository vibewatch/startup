      - number: '8.3'
        title: 情景、下行触发器与回报框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要三件事同时发生：类别支出继续复合增长；Ontic 把产品领先和 FedRAMP 资质转化为更广泛的企业及公共部门采用；大额 Series C
              资金用于高效扩张，而不只是推动成本更高的增长。若如此，当前资本基础和合作伙伴生态可以帮助 Ontic 在类别整合前实现国际扩张并加深工作流渗透。


              基准情景假设 Ontic
              继续赢得相关客户，但由于投资人仍无法从公开材料验证留存、利润率、定价权或客户集中度，估值依然困难。在这种结果下，公司在战略上可能稳健，却难以有把握地定价。悲观情景也不只是产品失败，而是经济数据不透明、扩张依赖合作伙伴，以及治理或隐私问题叠加，恰好在资本变贵时增加尽调摩擦。到那时，倍数压缩或未来降价融资的重要性会超过类别叙事。
            claimRefs:
              - CV002
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 退出准备度、尽调问题与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              在评估价格之前，投资人应要求查看实际 Series C 条款、当前估值、稀释路径，以及任何投资人控制权或清算保护。这些事项决定公司的运营进展是归于新股东，还是已经被计入一张昂贵的股权结构表。尽调材料还应包括当前
              ARR、毛利率、烧钱、净留存、管线转化、客户集中度和续约行为，因为指定公开证据没有提供这些指标。


              第二条尽调线应聚焦产品治理和部署风险。Ontic 自身材料把 AI 放在路线图中心；App Store
              页面称移动产品可能收集与身份相关的标识符和诊断信息，即使未打开也可能使用定位。对于敏感的企业和政府部署，这不会使产品失效，但会让隐私控制、数据处理边界和移动治理成为投资判断的一部分。如果管理层无法用清晰证据解决这些尽调问题，论点应继续停留在跟踪，或转为回避，而不是勉强升级为买入。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 建议姿态
            body: 在管理层提供 Series C 后估值、投资人条款和当前收入质量指标之前，持续跟踪 Ontic；这些信息是将上行空间与稀释及下行风险进行定价所必需的。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV011
              - CV012
          - type: callout
            title: 最可能的论点破坏触发器
            body: 如果尽调显示留存疲弱、收入集中、优先权条款激进，或敏感部署中的隐私控制未解决，判断应从跟踪转为回避。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
