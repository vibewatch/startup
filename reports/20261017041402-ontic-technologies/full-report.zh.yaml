        title: 身份、定位与产品范围
        blocks:
          - type: paragraph
            body: >-
              指定证据始终将 Ontic 描述为服务企业和政府安防团队的软件平台，而不是以服务为先的咨询公司。公司控制的来源将核心产品定义为连接式智能记录系统，把数据、工作流和 AI 辅助洞察放在一起；Reuters 报道和
              Great Place To Work 资料也印证了其企业安防定位和当前规模。证据支持 Ontic 的总部、成立年份和当前 Series C
              阶段，但没有提供经审计的经营指标或已披露估值，因此后续章节不能把收入规模当作定论，也不能假设商业表现具有持久性。
