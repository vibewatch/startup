      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Reuters 和现有融资报道确认 Ontic 于 2025 年 8 月完成 $230 million Series C；公司发布的融资报道称，资金将用于 AI
              投资、国际扩张，以及面向企业和公共部门买方的进一步平台开发（CI003、CI005）。这些资金用途与可见成本驱动因素相符：公共部门合规和支持、欧洲建设，以及持续的产品投入。Control Risks
              合作又为成本结构增添一层含义：部分客户价值可以由嵌入平台的专业分析师和运营经验交付，这可能改善客户结果，但也让仅凭公开材料更难判断软件与服务的构成比例（CI010）。Reuters 另行指出，公司未披露
              Series C 估值，因此即使是最近一轮融资，也缺少一个重要的投资判断输入（CI004）。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI010
      - number: '4.4'
        title: 尽调阻碍与财务结论
        blocks:
          - type: paragraph
            body: >-
              现有公开记录足以支持方向性判断，但不足以建立模型。AI Market Watch 明确表示 Ontic
              的具体增长指标未公开；更广泛的现有来源同样缺少收入、ARR、毛利率、现金余额、烧钱、现金跑道、客户集中度和债务义务（CI012、CI013）。投资人因此能看到一幅连贯的战略图景——凭借大量新资本，以软件为核心拓展政府和新地域——却缺少实际定价、利润率和流动性事实，无法判断这种增长在风险调整后有多大吸引力（CI014）。正确结论不是
              Ontic 财务状况很弱，而是没有管理层材料，公开证据过于不完整，无法评估收入质量、资本效率或现金跑道的可信度。
