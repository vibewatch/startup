      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业和政府客户通过集中安全数据、将调查流程运营化，再借助新增工作流和合作伙伴输入扩大对 Ontic 的采用。
    data:
      items:
        - label: 暴露风险信号
          actor: 安全情报团队
          phase: 检测
          touchpoints:
            - 公开数据
            - 安全系统
            - 社交媒体
            - 暗网情报
          note: 多来源监测是平台和 FedRAMP 上线页面向买方作出的首项承诺。
        - label: 集中记录
          actor: 安全运营和调查人员
          phase: 记录系统
          touchpoints:
            - 实体数据库
            - 案件管理
            - 基于角色的控制
          note: Ontic 将平台定位为威胁、事件和调查的集中运营记录。
        - label: 用 AI 分流
          actor: 分析师和防护情报经理
          phase: 优先级排序
          touchpoints:
            - AI 摘要
            - 实体解析
            - 工作流自动化
          note: AI 和工作流工具用于减少噪声、加快审查，而不是取代运营人员。
        - label: 调查并响应
          actor: GSOC 和防护服务团队
          phase: 行动
          touchpoints:
            - 调查
            - 事件工作流
            - 威胁响应
          note: Visa 和这家 Fortune 500 保险公司的案例都描述了更快行动和更高的调查吞吐量。
        - label: 在内部证明 ROI
          actor: 安全负责人
          phase: 扩张证明
          touchpoints:
            - 指标与报告
            - 避免成本
            - 人员编制依据
          note: 量化案例强调减少人工工作、避免成本和团队扩张。
        - label: 扩展生态覆盖
          actor: 客户团队与合作伙伴
          phase: 先落地再扩张
          touchpoints:
            - 集成
            - 嵌入式分析师
            - 政府部署
          note: 扩张围绕 60+ 个集成、合作伙伴工作流和新获得资格的联邦部署展开。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，Ontic 的风险集中在合规深度、AI 执行和依附合作伙伴的交付上，而非单一的致命缺陷。
    data:
      columns:
        - 中等可能性
        - 高可能性
      rows:
        - label: 高影响
          values:
            - text: 鉴证深度缺口
              detail: 在这组来源中，关于事件、审计和控制有效性的更广泛第三方证明仍然有限。
            - text: AI 路线图执行
              detail: 2026 年 AI 功能集的一部分仍标注为未来计划，尚无充分证据证明已交付。
        - label: 中高影响
          values:
            - text: 集成复杂度
              detail: Connected Intelligence 依赖于让数据、工作流和背景信息在各系统间保持同步。
            - text: 对合作伙伴附带服务的依赖
              detail: Control Risks 分析师和 Seerist 数据可以改善结果，但也可能掩盖对服务的依赖。
        - label: 中等影响
          values:
            - text: ROI 可迁移性
              detail: 公开客户案例较为积极，但尚未提供可落到分母层面的部署和续约基准。
            - text: 客户集中度不透明
              detail: 这里引用了 Fortune 100 和 Fortune 500 客户标志，但公开续约和集中度数据仍然缺失。
        - label: 中等可能性
          values:
            - text: 市场触达扩张负担
              detail: 即使上市触达改善，联邦和企业扩张也可能增加审计、支持和文档成本。
            - text: 以演示为主的证据质量
              detail: 部分保留证据仍停留在营销话术，投资判断下行风险前必须追加尽调。
        - label: 监测清单
          values:
            - text: 合规范围的持久性
              detail: 投资者应监测公共部门案例是否扩展为可重复部署，同时授权范围保持不变。
            - text: 服务附加率
              detail: 如果外部分析师成为价值交付不可或缺的一环，软件经济性和可迁移性可能减弱。
        - label: 当前严重性较低
          values:
            - text: 品牌定位漂移
              detail: 宽泛的 Connected Intelligence 信息本身并不致命，但可能模糊哪些功能已经达到生产级。
            - text: 奖项与营销负担
              detail: 外部奖项有助于提升认知，但不能单独解决韧性或集中度方面的核心尽调问题。
    approximationNotes: 矩阵位置是对保留公开证据的定性综合，而非概率模型。
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR008
      - CR009
      - CR010
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 品类顺风和产品／公共部门证明，抵不过估值不透明和仍未解决的尽调问题。
    data:
      nodes:
        - id: market-tailwind
          label: 增长中的品类
          note: Frost 预计市场规模将从 2025 年的 $58.84B 增至 2030 年的 $170.14B。
        - id: product-proof
          label: 产品深度
          note: Connected Intelligence 记录系统，加上 AI 辅助工作流和报告。
        - id: deployment-proof
          label: 部署可信度
          note: FedRAMP Moderate 授权以及企业／联邦案例研究引用。
        - id: capital-base
          label: 扩张资本
          note: $230M Series C 接续此前披露的融资，并支持 AI 和扩张。
        - id: valuation-gap
          label: 估值缺口
          note: 指定来源仍未披露当前估值、优先股堆叠、ARR 质量或利润率。
        - id: recommendation
          label: 继续跟进
          note: 继续尽调；没有直接的定价和经济数据证据，不应假设入场价格合理。
      edges:
        - from: market-tailwind
          to: product-proof
          label: 支持需求
        - from: product-proof
          to: deployment-proof
          label: 促成采用
        - from: deployment-proof
          to: capital-base
          label: 改善规模化逻辑
        - from: capital-base
          to: valuation-gap
          label: 仍需定价证明
        - from: valuation-gap
          to: recommendation
          label: 决定结论
    approximationNotes: 图示表达决策流程，而非隐含评分模型；不推断估值倍数。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV011
      - CV012
      - CV013
