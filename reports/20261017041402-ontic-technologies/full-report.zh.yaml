            - 可直接支持决策的运营工作流
          tone: positive
        - label: 合作伙伴与交付扩展
          summary: External analysts and intelligence partners can work inside the same operating environment.
          modules:
            - Control Risks 分析师产能
            - 区域内托管口径
            - 集成生态
          outputs:
            - 扩展的运营产能
          tone: neutral
        - label: AI 辅助与未来代理
          summary: >-
            AI features sit on top of connected operational history, with some capabilities available now and others
            forward-looking.
          modules:
            - 摘要
            - 趋势分组
            - Chat／去重／Copilot
          outputs:
            - 更快了解情况并获得下一步建议
          tone: warning
    approximationNotes: 这是公开运营模型的分层图，不是经过验证的后端拓扑；图中体现的是所述层级和依赖关系，而非已披露的基础设施组件。
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE009
      - CE010
