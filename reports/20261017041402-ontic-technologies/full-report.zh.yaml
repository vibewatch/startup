  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 真正的竞争集合比点名的软件同行更广
        blocks:
          - type: paragraph
            body: >-
              现有证据将 Ontic 定位为一个面向安防团队的平台：让情报、调查、事件、报告和响应共享一套操作系统，而不是狭窄的告警或观察名单产品。因此，竞争集合不只包括直接软件同行。Ontic
              自身的平台和合作材料反复描述买方如何连接碎片化的数据、工作流和分析师；2026 年 Frost Radar 新闻稿则称该类别本身包含 15 家受评估供应商。在指定证据中，唯一点名直接同行的独立来源提到
              Resolver、AlertMedia 和
              ThreatConnect；但实际竞争还包括服务驱动的情报提供商、内部自建项目，以及买方现有的点工具、数据源、文件和电子表格组合。对尽调而言，承销问题不只是“还有谁在这里卖软件？”，还包括“哪种替代方案能在不增加人手或信任摩擦的情况下，最好地消除工作流碎片化？” 
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP012
