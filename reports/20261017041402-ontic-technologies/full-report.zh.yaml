              - CM016
      - number: '2.2'
        title: 采用驱动因素、渠道与采购突破口
        blocks:
          - type: paragraph
            body: >
              现有来源中最强的采用驱动因素是运营效率、数据整合和采购灵活性。Ontic 的产品文案强调集中式记录系统、60+ 个集成，以及可部署在 Ontic
              云端或客户云端，这些都降低了接入现有企业技术栈的成本。当前产品页还加入了减少人工工作的 AI 和工作流自动化叙事；Control Risks
              合作则说明，部分买方可能通过服务辅助模式采用产品，而非完全自助式软件：当客户内部团队覆盖不足或缺乏产能时，外部分析师可以在同一环境中工作。FedRAMP Moderate 和 ATO 尤其重要，因为它们把
              Ontic 从仅面向企业的叙事推向可触达的公共部门采购路径；即使尚未披露收入贡献，这条路径也可能对估值产生不成比例的影响。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.3'
        title: 规模信号与仍未证明的部分
        blocks:
          - type: paragraph
            body: >
              现有数字更适合作为采用信号，而不是市场规模。新企业客户历史增长 68% 和用户增长 319% 表明 Ontic 在大型企业账户中找到了需求；平台案例中的数字则展示了安防负责人可用来证明支出的 ROI
              故事。但这些数字没有说明可服务软件市场的规模、服务与平台订阅各自占据的支出比例，也没有说明公共部门需求如今是否已具规模，还是仅停留在目标设想。现有来源还缺少独立的类别定义来源，无法清晰区分 Ontic
              的连接式智能切入点与咨询、网络工具或人力等相邻支出。因此，正确的尽调姿态是保留受证据约束的规模视角，明确记录缺失的市场规模工作，而不是从无关的安防类别拼出宽泛 TAM。
            claimRefs:
