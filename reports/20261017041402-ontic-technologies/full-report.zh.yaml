  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - FedRAMP 和合作伙伴生态转化为更多企业及公共部门客户，同时 AI 工作流深度提升钱包份额。
        - 只有在尽调确认增长和留存、且当前估值相对适中时，才具备吸引力。
        - 扩张会提高执行复杂度；合作方主导的服务可能稀释软件式利润率。
        - 需要披露 ARR 动能、强劲净留存，以及 Series C 资金正在支持高效增长的证据。
      - - 基准
        - Ontic 持续赢得可信客户，产品覆盖面扩大，但公开经济性仍不透明。
        - 只有完成定价尽调后才跟踪或选择性接触，因为战略证明跑在财务披露前面。
        - 如果看不清续约质量或股权结构保护，投资者可能为增长势头付出过高价格。
        - 与分配材料集最为一致。
      - - 悲观
        - 增长放缓，客户集中度或流失情况被证明比预期更差，而且 Series C 已设定了激进估值。
        - 由于下行保护和真实盈利能力在公开材料中不可见，回报画像会迅速收缩。
        - 不透明的优先股堆叠、估值倍数压缩和更长的公共部门销售周期会放大下行。
        - 如果管理层无法就定价、利润率和集中度提供清晰的尽调材料，该情景的可能性会提高。
      - - 禁止推进触发条件
        - 尽调中出现重大的隐私 / 数据治理摩擦或经济性疲弱。
        - 若当前入场价格下行事实得到确认，建议从继续跟进转为回避。
        - 在敏感部署场景中，移动端数据处理问题和经济数据披露缺失可能成为投资阻断因素。
        - 无法披露估值条款、收入质量或治理边界，都是负面信号。
    notes: 情景仅使用公开定性证据；由于指定来源未披露 Series C 后的官方价格或收入质量数据集，估值和回报逻辑有意保持条件性。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
