  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: durability-gap
      missingEvidence: Public or dataroom evidence for NRR, GRR, churn, renewal cadence, and average contract duration.
      whyItMatters: Without durability metrics, it is impossible to assess whether customer value compounds or whether growth depends on fresh logo acquisition.
      diligencePath: Request cohort retention tables, logo churn history, renewal schedules, and a customer-level revenue bridge for the last 24 months.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Disclosure of top-customer revenue share, public-sector mix, and partner-sourced bookings.
      whyItMatters: Concentration and channel dependence can materially change downside risk even when adoption stories look strong.
      diligencePath: Request a customer concentration schedule, segment ARR split, and direct-versus-partner sourced bookings by quarter.
    - type: enumeration-incomplete
      severity: material
      topic: proof-quality
      missingEvidence: A fuller named production-customer list with deployment scope, contract age, and referenceability status.
      whyItMatters: Public proof today is persuasive on workflow fit but too curated and anonymized to verify breadth or replication across the installed base.
      diligencePath: Obtain a customer reference list with at least five named accounts across enterprise and government plus renewal status and measurable outcomes.
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: adverse-user-signal
      missingEvidence: Independent review volume from broader user communities such as G2, Capterra, or Gartner Peer Insights.
      whyItMatters: Five App Store ratings and directory-style testimonials are too thin to judge satisfaction, deployment friction, or support quality at scale.
      diligencePath: Collect current review-platform exports, support-ticket trends, and churn reasons for mobile and web users.
      relatedQuestionRefs: [QU007]
