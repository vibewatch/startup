artifact: customers
slug: ontic-technologies
runDate: 2026-10-17
company:
  name: Ontic Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports Ontic's core customer base in enterprise and government
    security operations, with FedRAMP-enabled public-sector positioning and enterprise
    case studies such as Visa plus a Fortune 500 insurer. The adoption evidence is
    directionally strong but still heavily company-controlled or anonymized, while no
    public churn, retention, contract-length, or customer-concentration metrics were
    found. Independent proof exists through review and reference directories, but the
    public mobile footprint remains thin and carries a disclosed battery-use tradeoff.
sections:
  - id: customer-base-and-buyers
    title: Customer base, buyers, and purchase motion
    body: >-
      Ontic's documented buyer center is the corporate or government security team rather
      than a broad horizontal operations user. Company materials repeatedly position the
      platform as a system of record for threat intelligence, investigations, and incident
      response, while the April 2026 FedRAMP launch extends that positioning into federal
      procurement. Public evidence also suggests a multi-segment go-to-market motion:
      the company markets to large enterprise security programs, review directories list
      targets from small business through very large enterprise and government, and the
      Series C announcement says new capital will expand coverage across more global
      enterprises and U.S. public-sector agencies. What remains missing is segment mix by
      revenue, seat count, or contract size, so customer breadth is better evidenced than
      monetization concentration.
    claimRefs: [CU001, CU002, CU004, CU005, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-expansion
    title: Adoption proof is strongest in enterprise outcomes and workflow expansion
    body: >-
      Ontic's best public adoption proof comes from outcome-oriented enterprise stories
      rather than from audited customer counts. The product page highlights quantified
      wins for an unnamed Fortune 500 insurance customer and a named Visa deployment,
      while the September 2026 Control Risks partnership shows Ontic being used as the
      operating environment for external analysts and integrated intelligence feeds.
      Together, those examples support a land-and-expand motion built around centralizing
      data, connecting external feeds, and widening the number of workflows run inside the
      platform. However, several of the highest-value examples remain anonymous or
      company-curated, so the public record proves practical usage and workflow fit more
      clearly than it proves the full breadth of production customers or renewal behavior.
    claimRefs: [CU003, CU006, CU007, CU008, CU009, CU010, CU011, CU012, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration-risks
    title: Durability, concentration, and user-friction evidence remain underdisclosed
    body: >-
      The main diligence gap is not whether Ontic can describe customer value, but whether
      outside evidence can verify durability at scale. Across the reviewed public sources,
      Ontic does not disclose net revenue retention, gross retention, churn, renewal rates,
      contract length, or top-customer concentration, leaving durability and concentration
      risk effectively unproven in public materials. Even the named or semi-named success
      stories lean on company-issued surfaces and often omit contract size or renewal
      history. Independent user-signal is also shallow on the mobile surface: Apple's app
      listing shows only five ratings and warns that background location use can decrease
      battery life, which is a modest but real friction signal rather than evidence of
      broad, satisfied end-user adoption.
    claimRefs: [CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Global enterprise security programs
        - CSO, protective intelligence, GSOC, and investigation teams; paid from security operations budgets
        - Threat intelligence, incident management, investigations, and executive protection
        - Visa story plus Fortune 100 and Fortune 500 references across company materials
        - Core proof point for enterprise workflow fit and ROI storytelling
        - No public enterprise customer count, ACV range, or renewal disclosure
      - - Federal and public-sector agencies
        - Government security teams procuring a FedRAMP-authorized system
        - Centralized threat intelligence, investigations, and response in mission-critical environments
        - FedRAMP Moderate authorization and Authority to Operate announced in April 2026
        - Opens a regulated procurement channel and broadens addressable customer set
        - No public agency count, booked ARR, or deployment breadth by agency type
      - - Partner-augmented security programs
        - Client security leaders using outside analysts inside the same operating environment
        - Analyst triage, event-feed ingestion, and decision support inside Ontic
        - Control Risks partnership embeds analysts directly in client Ontic environments
        - Supports expansion without immediate internal headcount growth
        - Revenue split between software and partner-led services is undisclosed
      - - Long-tail marketed segments
        - Small, mid-size, enterprise, nonprofit, startup, and government organizations listed by review directory
        - General protective intelligence and case-management workflows
        - Review directory lists target organization types from small business through government
        - Suggests broad ICP marketing beyond a single niche
        - Directory classification does not prove paying-customer mix or production depth
    notes: >-
      Mix reflects public marketing and proof surfaces, not disclosed revenue composition; null
      segment economics remain a diligence gap.
    claimRefs: [CU001, CU002, CU004, CU012, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Public-sector procurement readiness
        - FedRAMP Moderate authorization plus ATO
        - "2026-04-30"
        - Ontic press release and PRNewswire syndication
        - High
        - Supports entry into federal security programs
        - No public agency count, pipeline, or government revenue contribution
      - - Independent proof corpus
        - 37 testimonials, 13 case studies, 24 customer videos, 4.8/5 score, 744 reference ratings
        - "Accessed 2026-10-17"
        - FeaturedCustomers
        - Medium
        - Indicates substantial curated proof and active reference generation
        - Most references are gated and do not expose renewal, contract value, or named breadth
      - - Enterprise ROI example
        - 85% less manual work; $2M recovery and cost avoidance; 200+ investigations in 6 months; headcount scaled from 4 to 16
        - "Accessed 2026-10-17"
        - Ontic client story
        - Medium
        - Strongest quantified value proof on the public site
        - Customer is anonymized and baseline contract size is undisclosed
      - - Mobile user signal
        - 5 App Store ratings; background location use may reduce battery life
        - "Accessed 2026-10-17"
        - Apple App Store
        - Medium
        - Public mobile engagement proof is thin and carries a disclosed UX tradeoff
        - No install base, MAU, enterprise rollout count, or support trend
    notes: >-
      Trajectory mixes procurement, reference-library depth, outcome case studies, and app-surface
      usage signals because Ontic does not publish a canonical customer-count time series.
    claimRefs: [CU002, CU007, CU008, CU009, CU010, CU011, CU016]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Visa
        - Enterprise / payments
        - Threat research centralization and severe-case escalation
        - Production use implied by a formal client story
        - Improved ability to identify the highest-concerning threats and take faster action
        - No public contract size, duration, or renewal data
      - - Fortune 500 Insurance Company
        - Enterprise / insurance
        - Investigation workflows, reporting, and program scaling
        - Production use implied by mature quantified outcomes
        - 85% cut in manual work, $2M recovery and cost avoidance, 200+ investigations in 6 months
        - Customer remains unnamed and proof is company-issued
      - - American Airlines
        - Enterprise / travel
        - Protective-services workflow aligned with external intelligence expertise
        - Production use implied by executive quote in partner launch
        - Quote says technology and expertise now sit "in the same place"
        - No quantified ROI or deployment scope disclosed
      - - Fortune 100 financial services firm
        - Enterprise / financial services
        - Risk-consultancy analysts triaging threats and logging incidents inside the client's Ontic instance
        - Production use implied by real-time operating description
        - Incidents handled faster with clearer records behind decisions
        - Customer unnamed and partner/company-issued proof only
    notes: >-
      Enumeration is partial and limited to public references the assigned pool exposed; public proof
      skews toward company-issued stories and anonymized brands rather than a full production roster.
    enumerationScope:
      coverage: partial
      basis: Publicly visible named or semi-named customer examples retained from the assigned customer evidence pool as of 2026-10-17.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011, CU012, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Enterprise and government customers adopt Ontic by centralizing security data, operationalizing investigations, and then expanding through added workflows and partner inputs.
    data:
      items:
        - label: Surface risk signals
          actor: Security intelligence team
          phase: Detection
          touchpoints:
            - Public data
            - Security systems
            - Social media
            - Dark web intelligence
          note: Multi-source monitoring is the first buyer promise on the platform and FedRAMP launch pages.
        - label: Centralize records
          actor: Security operations and investigators
          phase: System of record
          touchpoints:
            - Entity database
            - Case management
            - Role-based controls
          note: Ontic positions the platform as a centralized operating record for threats, incidents, and investigations.
        - label: Triage with AI
          actor: Analysts and protective intelligence managers
          phase: Prioritization
          touchpoints:
            - AI summarization
            - Entity resolution
            - Workflow automation
          note: AI and workflow tooling are used to reduce noise and speed review rather than to replace operators.
        - label: Investigate and respond
          actor: GSOC and protective services teams
          phase: Action
          touchpoints:
            - Investigations
            - Incident workflows
            - Threat response
          note: Visa and the Fortune 500 insurer stories describe faster action and higher investigative throughput.
        - label: Prove ROI internally
          actor: Security leadership
          phase: Expansion proof
          touchpoints:
            - Metrics and reporting
            - Cost avoidance
            - Headcount justification
          note: Quantified examples emphasize manual-work reduction, cost avoidance, and team scaling.
        - label: Extend ecosystem coverage
          actor: Client team plus partners
          phase: Land-and-expand
          touchpoints:
            - Integrations
            - Embedded analysts
            - Government deployment
          note: Expansion is framed around 60+ integrations, partner workflows, and newly eligible federal deployments.
    claimRefs: [CU001, CU002, CU005, CU006, CU007, CU010, CU012]
callouts:
  - calloutType: insight
    title: Public-sector eligibility is a genuine customer-surface expansion, not just a product badge
    body: >-
      FedRAMP Moderate plus an ATO meaningfully widen Ontic's reachable buyer set by enabling
      federal security teams to adopt the same centralized workflow model already marketed to
      enterprise customers.
    claimRefs: [CU001, CU002, CU013]
  - calloutType: risk
    title: Public proof is persuasive on workflow fit but weak on durability
    body: >-
      The strongest public evidence shows customer outcomes and workflow breadth, yet it does not
      disclose churn, renewals, top-customer share, or contract length, leaving concentration and
      durability risk unresolved.
    claimRefs: [CU014, CU015, CU016]
