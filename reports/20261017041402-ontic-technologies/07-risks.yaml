    notes: This register mixes company claims with limited outside corroboration; no public uptime or outage evidence appears in the assigned pool.
    claimRefs: [CR002, CR003, CR009, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [Embedded intelligence-services delivery, Control Risks, "Analysts and security expertise work directly inside customer Ontic environments", Medium, "Customer value may depend on external analyst quality or attach rates rather than software alone", High, "Platform remains the system of record while services add capacity", "Need disclosure on attach rates, renewal behavior, and partner concentration"]
      - [Risk-intelligence data feed, Seerist, "Events feed integrated into Ontic Risk Intelligence through the partnership", Medium, "Loss or degradation of the feed could weaken one part of the connected-intelligence narrative", Medium, "Partnership broadens content and expertise access", "Need redundancy, alternative feed strategy, and contractual durability evidence"]
      - [Customer-specific implementation environment, Customer IT / cloud stakeholders, "Ontic can run in Ontic's cloud or the customer's cloud and depends on integrations", Medium, "Heavy deployment requirements could slow implementations or increase services burden", Medium, "Flexible deployment model and open architecture are claimed publicly", "Need average deployment length, failed pilots, and professional-services intensity"]
    notes: The dependency picture is product-plus-services rather than a single vendor concentration, and public materials do not quantify exposure.
    claimRefs: [CR005, CR006, CR008]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Public evidence clusters Ontic's risks around compliance depth, AI execution, and partner-attached delivery rather than a single existential flaw.
    data:
      columns:
        - Medium likelihood
        - High likelihood
      rows:
        - label: High impact
          values:
            - text: Assurance depth gap
              detail: Broader third-party proof on incidents, audits, and control effectiveness is still limited in this pool.
            - text: AI roadmap execution
              detail: Part of the 2026 AI feature set is still future-dated rather than fully evidenced as shipped.
        - label: Medium-high impact
          values:
            - text: Integration complexity
              detail: Connected Intelligence depends on keeping data, workflows, and context synchronized across systems.
            - text: Partner-attached service reliance
              detail: Control Risks analysts and Seerist data can improve outcomes, but they may also hide services dependence.
        - label: Medium impact
          values:
            - text: ROI portability
              detail: Public customer stories are positive but do not yet provide denominator-level deployment and renewal benchmarks.
            - text: Customer concentration opacity
              detail: Fortune 100 and Fortune 500 logos are cited, but public renewal and concentration data remain absent here.
        - label: Medium likelihood
          values:
            - text: Market-access expansion burden
              detail: Federal and enterprise expansion can increase audit, support, and documentation costs even when go-to-market access improves.
            - text: Demo-led evidence quality
              detail: Some retained proof is still marketing-level and forces follow-up diligence before underwriting downside.
        - label: Monitoring watchlist
          values:
            - text: Compliance-scope durability
              detail: Investors should monitor whether public-sector references expand into repeatable deployments with unchanged authorization scope.
            - text: Services attach rates
              detail: If external analysts become essential to value delivery, software economics and portability could weaken.
        - label: Lower immediate severity
          values:
            - text: Brand-positioning drift
              detail: Broad Connected Intelligence messaging is not itself fatal, but it can blur what functionality is already production-grade.
            - text: Awards and marketing overhang
              detail: External awards help awareness but do not independently clear core diligence questions on resilience or concentration.
    approximationNotes: Matrix placement is a qualitative synthesis from the retained public evidence rather than a probabilistic model.
    claimRefs: [CR002, CR003, CR005, CR008, CR009, CR010, CR012]
callouts:
  - calloutType: risk
    title: Main thesis-break triggers
    body: >-
      The most actionable kill criteria are a visible slip in promised AI availability, any narrowing or lapse
      in sensitive-deployment compliance posture, evidence that services partners are required to make the
      product work in practice, or credible third-party incident history that contradicts the current marketing-led
      reliability narrative.
    claimRefs: [CR001, CR002, CR005, CR010, CR012]
  - calloutType: insight
    title: Current mitigations are more visible than current downside proof
    body: >-
      Ontic's assigned risk evidence documents platform controls, FedRAMP progress, and human-in-the-loop AI
      guardrails better than it documents outages, failed deployments, customer concentration, or legal exposure.
      That asymmetry should lower confidence in public downside sizing, not be mistaken for the absence of risk.
    claimRefs: [CR007, CR010, CR011]
