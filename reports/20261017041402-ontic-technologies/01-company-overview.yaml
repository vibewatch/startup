company:
  name: Ontic Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Ontic presents as a well-funded Austin-based security intelligence software company with a recent FedRAMP authorization and a new Control Risks partnership, but public disclosure in the assigned evidence remains thin on valuation, board structure, and core operating metrics.
sections:
- id: identity-and-platform
  title: Identity, positioning, and product scope
  body: The assigned evidence consistently describes Ontic as a software platform for corporate and government security teams rather than as a services-first consultancy. Company-controlled sources frame the core product as a connected intelligence system of record that combines data, workflows, and AI-assisted insights, while the Reuters coverage and the Great Place To Work profile reinforce the enterprise-security orientation and current scale. The evidence supports Ontic's headquarters, founding year, and current Series C stage, but it does not provide audited operating metrics or a disclosed valuation that would let later chapters treat top-line scale as settled fact or assume durable commercial performance.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO008
  tableRefs:
  - TO001
- id: leadership-capital-and-governance
  title: Leadership, capital base, and governance visibility
  body: 'Leadership visibility in the assigned pool is concentrated around co-founder and CEO Lukas Quanstrom. The strongest capital signal is the August 2025 Series C led by KKR, with Reuters independently confirming the raise while also noting that the company did not disclose valuation. That leaves an important governance blind spot: the available sources identify the syndicate and KKR''s strategic rationale, but they do not disclose board composition, investor rights, or economic terms that would clarify control after the round. The chapter can therefore establish investor identity and financing chronology, but not a verified governance map or operating KPI set.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO015
  - CO016
  tableRefs:
  - TO002
  - TO003
- id: milestones-and-refresh-gaps
  title: Milestones, external validation, and unresolved diligence asks
  body: 'The strongest dated milestones in the current pool are financial and go-to-market rather than financial-performance disclosures. Ontic''s 2025 Series C, April 2026 FedRAMP authorization, and September 2026 Control Risks partnership all indicate active expansion into public-sector and intelligence-led workflows. Great Place To Work adds a current employee-count signal and a multi-year recognition trail, but those are softer validation points than audited revenue or customer disclosures. AI Market Watch supplies a limited adverse diligence signal by noting that specific growth metrics are not public and that it found no public patents. The evidence remains weak on independently critical reporting about litigation, outages, or leadership churn, so that risk surface stays open rather than cleared for investors.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  figureRefs:
  - FO001
