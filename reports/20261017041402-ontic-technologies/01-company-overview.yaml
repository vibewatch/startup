  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: Board composition, board seat allocation, and KKR governance or liquidation-right details after the Series C round.
    whyItMatters: Control rights and board structure affect underwriting of strategic flexibility, future dilution, and investor influence.
    diligencePath: Request the cap table, board roster, investor rights summary, and Series C legal documents or a management memo that summarizes them.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: core-operating-metrics
    missingEvidence: Source-backed revenue, ARR, customer count, customer concentration, and current valuation figures.
