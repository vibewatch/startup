companyProfile:
  summary: >-
    Ontic Technologies is an Austin-based connected-intelligence software company that sells a centralized security
    operations platform to corporate and government security teams. The public record supports a Series C-funded
    business with FedRAMP Moderate authorization, a Control Risks partnership, and product breadth across intelligence,
    investigations, incidents, reporting, and AI-assisted workflows, but it still leaves key economics such as
    valuation, pricing, margins, and retention largely undisclosed.
  foundingLocation: Austin, Texas, USA
