chapter:
  number: 5
  title: Product & Technology
  summary: "Gecko Robotics delivers the Cantilever\xAE operating platform, powered by its proprietary AIR\n(Artificial Intelligence + Robotics) technology stack. Robots that climb, crawl, fly, and swim\ncollect full-coverage ultrasonic, visual, lidar, and thermal data on critical infrastructure assets;\nthat data feeds AI/ML models \u2014 including a published reinforcement-learning system for ultrasonic\nthickness measurement \u2014 and a software layer that produces digital twins, predictive maintenance\nrecommendations, scenario planning, and dynamic capital budgeting. The platform is deployed across\nthree workflow modules: BUILD (advanced manufacturing QA/QC), SUSTAIN (maritime fleet health), and\nMODERNIZE (legacy asset digitization). Gecko's durable differentiation rests on 10+ years of\nproprietary training data, a growing patent portfolio, demonstrated dual-use deployability (defense\n+ commercial), and its Forward Deployed Engineering model that deepens customer integration. Key\n\
    diligence gaps include: public source code and third-party security audit details are unavailable;\nfull patent numbers are not enumerated; hardware bill-of-materials and sensor supplier concentration\nare undisclosed; and roadmap commitments beyond announced partnerships lack public confirmation.\n"
sections:
- id: s501
  title: "Product Overview \u2014 Cantilever\xAE and the AIR Platform"
  body: "Gecko Robotics' primary commercial product is Cantilever\xAE, described as \"the world's first\noperating platform powered by AI and Robotics (AIR) technology.\" Launched publicly in November\n2023 alongside a Series C extension, Cantilever ingests data collected by Gecko's robot fleet\nand combines it with customers' existing operational data \u2014 historians, maintenance records,\nfacility documentation \u2014 into a single source of truth for physical asset health. The platform\ndelivers four output types: (1) a baseline health record (digital twin) for each asset;\n(2) dynamic capital budgeting tools that flag which assets need repair and when; (3) AI-powered\nscenario modeling for operational optimizations and repair plan prioritization; and (4) predictive\nscenario planning, including digital-twin-based life-extension projections.\n\nAIR is Gecko's overarching technology thesis: that AI is only as good as the physical data that\ntrains it, and that robots are the only scalable\
    \ method for generating that ground-truth data at\nthe fidelity AI models require. The platform's tagline \"Build. Operate. Maintain.\" maps directly\nto three workflow modules (BUILD, SUSTAIN, MODERNIZE) that correspond to distinct buyer workflows\nin defense manufacturing, maritime sustainment, and legacy infrastructure respectively. As of\nthe September 2026 run date, Cantilever is deployed with U.S. Navy surface fleet assets, nuclear\nsubmarine programs, U.S. Air Force ICBM silo modernization, ADNOC Gas facilities, NAES power\nplants, Trident Maritime Systems fabrication facilities, BPMI nuclear component manufacturing,\nL3Harris aircraft programs, and industrial customers in steel, mining, pulp and paper, and oil\nand gas.\n"
  claimRefs:
  - CE001
  - CE002
  figureRefs:
