callouts:
- calloutType: strength
  title: Proprietary Physical-World Dataset Is a Durable Moat
  body: "Ten-plus years of ultrasonic, visual, lidar, and thermal data collected across thousands of\nassets \u2014 Navy ships, nuclear components, power plants, storage tanks, steel mills \u2014 constitutes\na training corpus that would cost years and hundreds of millions of dollars to replicate.\nThe reinforcement-learning pipeline enables model improvement without proportional labeling\ncost, compounding this advantage.\n"
  claimRefs:
  - CE015
  - CE016
- calloutType: strength
  title: Dual-Use Defense + Commercial Cross-Subsidization
  body: 'Defense contracts provide revenue certainty and classified-environment deployment experience

    that validates the platform for high-stakes commercial applications. Commercial deployments

    generate asset diversity that improves model generalization beyond what defense-only data

    would support. The IDIQ GSA vehicle gives all U.S. military services access, broadening

    the defense TAM.

    '
  claimRefs:
  - CE001
  - CE002
- calloutType: risk
  title: Trust, Security & Compliance Documentation Is Opaque
  body: "The Trust Center serves a JavaScript-rendered page with no enumerated certifications, SOC 2\nstatus, FedRAMP authorization, ITAR registration, or CMMC level confirmation. Given Gecko's\nwork on nuclear submarines, ICBM silos, and Navy surface ships, these controls almost\ncertainly exist \u2014 but the inability to verify them from public sources is a due-diligence\nblocker for institutional investors and procurement officers at enterprises with compliance\nobligations.\n"
  claimRefs:
  - CE003
  - CE004
- calloutType: risk
  title: Hardware Supplier Concentration and BOM Undisclosed
  body: "Gecko's robot performance is critically dependent on ultrasonic transducer quality, sensor\npayload design, and drone hardware. No supplier names, sole-source relationships, or\ngeographic origin of sensor components are disclosed. In a supply-chain-stressed defense\nenvironment, this is a material gap \u2014 particularly relevant given the USAF and Navy's\nconcerns about Chinese-origin components in defense systems.\n"
  claimRefs:
  - CE005
  - CE006
- calloutType: assumption
  title: Cantilever Is a Cloud SaaS Platform (Not Air-Gapped Only)
  body: 'The "Log In" portal on geckorobotics.com and the software demo availability confirm a

    cloud-based SaaS deployment model. Hybrid/air-gapped deployment for classified defense

    environments is implied by the customer base but not explicitly confirmed in public materials.

    Financial model implications (ARR vs. project-based revenue) depend on deployment model.

    '
  claimRefs:
  - CE007
  - CE008
