- id: s505
  title: Differentiation, IP & Proprietary Moats
  body: "Gecko's differentiation rests on four reinforcing layers. First, proprietary training data:\nwith 10+ years of operation and \"thousands of assets analyzed,\" Gecko has accumulated a\nphysical-world dataset for training AI models that would take years and capital to replicate.\nThis flywheel \u2014 more inspections \u2192 more data \u2192 better models \u2192 more inspections \u2014 is a\ndurable competitive moat in a sector where ground-truth data is scarce. Second, a growing\npatent portfolio: geckorobotics.com/patents is a live page (confirming patent activity),\nthough specific patent numbers and claims are not publicly enumerated, representing a diligence\ngap. Third, the published RL paper on RUG demonstrates willingness to publish technical\nmethodology, building developer credibility and attracting ML talent while keeping training\ndata proprietary. Fourth, the dual-use defense + commercial model creates cross-subsidization:\ndefense contracts provide revenue stability and\
    \ classified-environment clearances while\ncommercial deployments generate broad asset data diversity. The Forward Deployed Engineering\nmodel \u2014 where engineers are embedded at single customers to build mission-specific extensions\nof Cantilever \u2014 creates deep technical integration and high switching costs.\n\nThe company is cited twice on the CNBC Disruptor 50 list (2024 and 2025), has published\nin the World Economic Forum, and CEO Jake Loosararian has presented at ADIPEC and Bloomberg TV,\nproviding brand-building signals in both defense and energy sectors. Competitors (Waygate,\nEddyfi, MISTRAS, Flyability, Percepto, Energy Robotics) are either specialized point-solution\nNDT providers, hardware-only drone companies, or operators without AI platforms of comparable\ndepth \u2014 none appears to combine full-lifecycle platform software with a proprietary robot fleet\nand AI trained on a decade of field data.\n"
  claimRefs:
  - CE009
  - CE010
- id: s506
  title: Deployment, Trust, Security & Roadmap
  body: "Gecko maintains a Trust Center at trust.geckorobotics.com, though public content is minimal \u2014\na JavaScript-rendered page with no enumerated certifications, SOC 2 status, FedRAMP\nauthorization, or ITAR compliance documentation. Given that Gecko handles Navy, Air Force,\nand nuclear propulsion program data, ITAR and potentially CMMC compliance are almost certainly\nrequired, but these cannot be independently verified from public sources and represent a\nmaterial diligence gap.\n\nDeployment is via a Forward Deployed Engineering (FDE) model: Gecko engineers embed at\ncustomer facilities and operate the robots while configuring Cantilever to the customer's\nspecific data systems. This model creates deep integration but also implies professional\nservices dependency and limited self-service scalability. Cantilever has a software demo\navailable on the company website, and customers access it via a \"Log In\" portal, confirming\nit is a cloud-based SaaS platform (not on-premise\
    \ only), though hybrid/air-gapped deployment\nfor classified environments is implied by defense use but not confirmed publicly.\n\nKnown roadmap items (from public announcements): (1) GSA IDIQ vehicle expansion to all U.S.\nmilitary services; (2) XR digital-twin aircraft inspection product (with L3Harris, in\nprototype-to-production phase as of April 2025); (3) UAE/international expansion including\nADNOC training programs for UAE nationals; (4) data center inspection application (implied by\nCEO comments on AI infrastructure energy). Formal product roadmap with dates and feature\ncommitments is not publicly disclosed, consistent with Gecko's private-company disclosure\nprofile.\n"
