- id: s503
  title: AI/ML Software Architecture & Data Processing
  body: "Gecko's machine learning pipeline is anchored in supervised and reinforcement learning models\ntrained on its proprietary multi-sensor dataset. A publicly disclosed technical blog post by\nLuke Roberto, ML Engineer, describes in detail the company's reinforcement-learning approach\nto automating ultrasonic thickness measurement (the Rapid Ultrasonic Gridding problem). The\nRL agent observes B-scan data (stacked A-scans across a spatial dimension) and selects\nthickness estimates at each grid point, using a reward function aligned with human-quality\nannotations rather than requiring manual labeling at scale. The system enables the company to\ntrain ML models on the large volumes of RUG data collected by its robots without manual\nlabeling bottlenecks.\n\nBeyond UT measurement, AI is applied to: anomaly and defect classification on sensor data;\npredictive maintenance scheduling based on historical deterioration rates; operational\nefficiency recommendations (Cantilever is claimed\
    \ to identify 3\u20135% power plant efficiency\ngains); and digital-twin-based scenario planning for repair sequencing. The Cantilever platform\nintegrates robot-collected data layers with \"disparate data sources\" from customer systems,\nimplying ERP, historian, CMMS, and maintenance record connectivity, though the specific\nintegration APIs and certifications are not publicly documented. Cantilever is also described\nas dual-use, supporting both defense classified/unclassified environments and commercial\nindustries. The platform's AI ontology is described by CEO Loosararian as starting \"from first\nprinciples and questions the integrity of data \u2014 because in the built world, data is guilty\nuntil proven innocent,\" suggesting an emphasis on data validation and confidence scoring\nrather than accepting sensor data uncritically.\n"
  claimRefs:
  - CE005
  - CE006
  tableRefs:
