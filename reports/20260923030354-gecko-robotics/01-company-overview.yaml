chapter:
  number: 1
  title: Company Overview
  summary: "Gecko Robotics (Pittsburgh, PA; founded 2013) builds AI-powered robotics platforms for critical infrastructure inspection and maintenance. The company's core product, Cantilever\xAE, combines wall-climbing robots, drones, and fixed sensors with an AI operating platform to provide asset health data at scale. Gecko raised a $125M Series D in June 2025 at a $1.25 billion valuation (unicorn), bringing total disclosed capital to roughly $302M. Customers span U.S. defense (Navy, Air Force), energy (NAES, ADNOC), oil and gas, steel, pulp and paper, and mining. Revenue is not publicly disclosed, and headcount is only partially disclosed through public employee data.\n"
sections:
- id: identity-overview
  title: Identity, Product, and Business Model
  body: "Gecko Robotics, Inc. is a Pittsburgh, Pennsylvania-based technology company founded in 2013 by Jake Loosararian (CEO) and Troy Demmer (Chief Product Officer). Both founders attended Grove City College; Demmer also holds a Carnegie Mellon MBA. Gecko's registered address is 100 S Commons, Suite 145, Pittsburgh, PA 15212. The company opened an international headquarters in the United Arab Emirates under the Ministry of Economy's NextGenFDI program, establishing a Middle East presence ahead of the April 2024 ADNOC Gas contract.\n\nGecko's mission is to use AI and robotics to build, operate, and maintain the world's most critical physical infrastructure. The company frames its offering as the \"AIR\" model \u2014 AI + Robotics \u2014 combining autonomous data collection hardware with an AI software platform called Cantilever\xAE. Wall-climbing robots, drones, robot dogs, and fixed sensors collect high-resolution physical data on structures such as ship hulls, boiler tubes, nuclear missile\
    \ silos, and pipeline segments. Cantilever then aggregates these data layers with operational data to produce predictive maintenance recommendations, digital twins, and actionable asset-health insights.\n\nThe business model is contract-based: multi-year service and software agreements with industrial operators, defense agencies, and energy companies. Notable revenue signals include a U.S. Navy IDIQ ceiling of $71M (2026), a NAES energy deal valued at $100M+ (2025), an ADNOC Gas contract of ~$30M (2024), and a Trident Maritime partnership covering 20 facilities (2026). Revenue figures are not publicly disclosed. The company is at Series D stage (pre-IPO) and remains privately held as of the September 2026 run date.\n"
  claimRefs:
  - CO001
  - CO002
- id: founders-leadership
  title: Founders, Leadership, and Governance
  body: 'Jake Loosararian (CEO, co-founder) conceived Gecko while studying electrical engineering at Grove City College after recognizing that power plant boiler inspections were both dangerous and costly. He bootstrapped the company in 2013, accepted a Y Combinator offer in ~2015 (declining an acquisition at the time), and has led the company through four funding rounds to unicorn status. His background spans robotics hardware, big-data engineering (early Palantir alumni hiring), and defense contracts. Loosararian is a World Economic Forum speaker and has testified publicly on defense modernization. Key-person risk is material: he is the primary public face, chief deal-signer, and cited spokesperson across all major contract announcements.


    Troy Demmer (CPO, co-founder) joined from the outset, contributing product strategy and sharing founder equity. His background adds Carnegie Mellon MBA-level business rigor. Amy Kurren serves as General Counsel, providing in-house legal oversight relevant to Gecko''s active federal contracting and trade-secret litigation history.


    Board governance was materially strengthened in December 2023 when USIT Managing Director Gaetano Crupi (co-founder, former CEO of Cabin Technologies) and Trae Stephens (Founders Fund partner; co-founder and executive chairman of Anduril Industries) joined the corporate board. Stephens'' Anduril background signals deep defense-tech connectivity but also creates a potential perception overlap with an adjacent defense robotics firm. Earlier investors YC, Drive Capital, Next 47, XYZ Venture Capital, and Soma Capital hold economic stakes but no public board seats as of this report.


    Leadership change risk: No material senior leadership departures have been publicly disclosed. The 2023 trade-secret lawsuit against Summit NDE (involving two former Gecko employees who joined a competitor) suggests the company has experienced some engineering-level attrition, though the suit outcome and scale of departures were not publicly confirmed.

    '
  claimRefs:
  - CO003
  - CO004
  tableRefs:
  - TO002
- id: funding-capital
  title: Funding History, Valuation, and Capital Structure
  body: "Gecko Robotics has completed at least four disclosed funding events. Y Combinator provided the initial seed investment around 2015. By June 2022, the company had raised $122.3M in total, including a $73.3M Series C announced in March 2022 and led by XN and Mark Cuban; the pre-Series C cumulative raise implied by this figure is approximately $49M. The Series C round valued the company at \"approaching $1 billion.\" In December 2023 Gecko closed a $100M extension to the Series C (bringing Series C total to $173M), adding USIT (Thomas Tull's defense-focused vehicle) and Founders Fund as board-level investors.\n\nThe Series D closed June 2025 at $125M, led by new investor Cox Enterprises, with continuing participation from USIT, XN, Founders Fund, and YCombinator. The round set a post-money valuation of $1.25 billion \u2014 formally unicorn status \u2014 described as doubling the prior round valuation. Total disclosed funding through Series D is approximately $298\u2013302M (depending\
    \ on precise early-round sizing). No public debt facility, secondary transaction, or credit line has been disclosed.\n\nCapital allocation context: Gecko's large government contract pipeline (Navy IDIQ $71M, Air Force Sentinel, NAES $100M+, ADNOC ~$30M) may partially offset ongoing capital burn, but the company's R&D intensity (hardware + software dual investment), international expansion, and headcount growth trajectory suggest continued funding need before profitability. Exact burn rate and runway are unknown.\n"
  claimRefs:
  - CO005
  - CO006
  tableRefs:
  - TO001
  - TO003
- id: scale-operations
  title: Scale, Customers, and Operational Reach
  body: "Gecko's homepage states \"10+ Years Experience. Thousands of Assets Analyzed.\" \u2014 the only publicly disclosed scale metric. Customer-count and revenue figures are not disclosed. Named customer relationships include: the U.S. Navy (surface ships, Columbia-class submarines, Virginia-class submarines), U.S. Air Force (Sentinel/ICBM silo program), NAES (America's largest independent power operator, 65GW under management), ADNOC Gas (subsidiary of Abu Dhabi National Oil Company), Trident Maritime Systems (20 facilities, U.S. naval supply chain), BPMI (defense prime contractor for Naval Nuclear Propulsion Program), and American Bituminous Power (a power plant customer providing a published testimonial).\n\nGeographically, Gecko operates primarily in the United States (Pittsburgh HQ, defense facilities, power plants, industrial sites) with an active international presence in the UAE via NextGenFDI and an expanded ADNOC partnership announced November 2025. The January 2026 CNN AI funding\
    \ in the Gulf article further confirms a Gulf-region expansion focus.\n\nGecko appears to employ roughly 331 people as of September 2026, based on public employee data and company surfaces. Roles visible on the careers page include Forward Deployed Engineers (FDEs), robot field operators, and the General Counsel, indicating a hardware-software-legal triangulated team structure. The company has hired alumni from Palantir (big-data engineering). Industry coverage spans six verticals: Defense, Oil & Gas, Power, Pulp & Paper, Steel, and Mining.\n"
  claimRefs:
  - CO007
  - CO008
  figureRefs:
  - FO002
  - FO003
- id: milestones-trajectory
  title: Milestones and Strategic Trajectory
  body: "Gecko's trajectory reflects a deliberate shift from an industrial inspection services company toward a dual-use AI-data platform company with defense as the primary growth engine. The founding origin story (power plant boiler failures, manual rope-dangling inspectors) anchored the company in unsexy but high-ROI industrial maintenance. YC accelerated the pivot to a scalable technology model.\n\nThe 2022\u20132023 period marked Gecko's explicit defense pivot: the Air Force Sentinel contract (Dec 2022), Columbia-class sub contract (Nov 2023), and Series C extension with defense-aligned investors USIT and Founders Fund (Dec 2023) all followed in rapid succession. The 2025 year saw the NAES $100M energy deal, BPMI partnership, and Series D unicorn round. In 2026, the $71M Navy IDIQ and Trident partnership signal further defense industrial base expansion.\n\nThe 2023 trade-secret lawsuit against Summit NDE, LLC highlights competitive exposure in the inspection technology space and affirms\
    \ that key employees have been pursued by smaller competitors. The case was filed in U.S. District Court (N.D. Indiana) in July 2023; its resolution is not publicly confirmed as of this report.\n\nJake Loosararian's January 2026 World Economic Forum piece (\"From Steel to Data: The Next AI Revolution\") frames Gecko as a platform company competing for the role of the AI revolution's data substrate provider \u2014 positioning analogous to how Carnegie Steel enabled the Industrial Revolution. This narrative consistency across founder communications and investor materials signals strong CEO conviction and alignment but also concentration of strategic messaging in a single founder.\n"
