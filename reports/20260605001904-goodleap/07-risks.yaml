tables:
  - id: TR001
    title: Regulatory / legal risk register
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the principal legal and regulatory surfaces visible from public sources as of the
        2026-06-05 run date. Does not include sealed settlements, non-public regulatory correspondence,
        or potential multi-state enforcement actions not yet filed.
    claimRefs:
        - CR001
        - CR002
        - CR003
        - CR006
        - CR007
        - CR010
        - CR011
    columns:
      - Rule / case
      - Jurisdiction
      - Current public posture
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Minnesota AG v. GoodLeap — Consumer Fraud Act, Deceptive Trade Practices, Deceptive Lending
        - Minnesota (Hennepin County District Court, remanded Jan 2025)
        - Active litigation; GoodLeap contesting; case remanded to state court after Supreme Court Royal Canin ruling
        - High
        - Critical
        - GoodLeap states disclosures comply with TILA and state law
        - Retroactive restitution, injunctive fee-disclosure reform, civil penalties; if remedies are nationwide, model-threatening
        - Monitor docket; obtain outside-counsel exposure memo and insurance coverage analysis
      - - Agency liability for installer acts (Georgia arbitration — Pink Energy)
        - Georgia (arbitration; collateral estoppel implications national)
        - Arbitration lost; $90k loan cancelled, attorney's fees awarded; collateral estoppel theory pending
        - High
        - High
        - Arbitration clause limits class action but not individual claims or state enforcement
        - Compounding arbitration losses, potential issue-preclusion across installer network
        - Quantify installer agreements that replicate Pink Energy control provisions; obtain contractor-liability insurance details
      - - TILA / Regulation Z dealer-fee disclosure (federal)
        - U.S. federal (FTC enforcement, private right of action)
        - Alleged non-disclosure of dealer fees in "amount financed"; GoodLeap contests; no consent decree public
        - High
        - High
        - GoodLeap states all disclosures legally compliant
        - Private TILA claims, CFPB enforcement, civil liability per loan; systemic if fee not properly disclosed
        - Obtain sample loan disclosure packages and outside-counsel TILA compliance opinion
      - - Treasury/CFPB/FTC inter-agency enforcement partnership (solar fintech)
        - U.S. federal (multi-agency)
        - Announced August 2024; GoodLeap named sector; civil penalties sought for predatory solar financing
        - High
        - High
        - No public enforcement action naming GoodLeap individually as of run date
        - Material if individual enforcement action filed; sector enforcement sets precedent
