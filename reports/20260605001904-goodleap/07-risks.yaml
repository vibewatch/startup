  - id: FR001
    title: Risk heatmap — residual severity by category
    type: matrix
    layout: wide
    summary: >-
      Residual severity clusters where regulatory/legal liability, ABS credit deterioration,
      and ITC policy risk overlap, with contractor fraud as a secondary amplifier. The top-right
      quadrant (high likelihood, critical impact) is densely populated for GoodLeap.
    data:
      columns:
        - Medium impact
        - High impact
        - Critical impact
      rows:
        - label: High likelihood
          values:
            - Consumer complaint escalation (BBB, CFPB volumes)
            - TILA/dealer-fee disclosure dispute (Minnesota AG active)
            - ITC termination Dec 31, 2025 removing re-amortization prepayment
        - label: Medium likelihood
          values:
            - Contractor fraud incidents (identity, lien)
            - ABS subordinate-tranche CE exhaustion triggering senior-class review
            - California NEM 3.0 / state solar policy further compression
        - label: Low likelihood
          values:
            - Federal CFPB individual enforcement order against GoodLeap
            - Full ABS market closure for solar tranches
            - Agency-liability cascade across 40,000-contractor network simultaneously
    approximationNotes: >-
      Cell placement reflects public evidence and authorial weighting of residual exposure as of
      June 2026 run date. Likelihood is directional, not a probability model.
