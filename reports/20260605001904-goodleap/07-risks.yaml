  - id: mitigants-and-kill-criteria
    title: >-
      Mitigants are real but dependent on execution; the thesis breaks if ABS access tightens,
      regulatory liability crystallizes, or ITC loss drives origination below model
    body: >-
      Mitigants exist and are not trivial. GoodLeap has completed 24 ABS securitizations
      totaling over $32 billion since 2018, demonstrating sustained access to capital markets
      even through credit stress. Its home improvement loan diversification — three 2025
      securitizations totaling $909 million backed solely by home improvement loans — reduces
      the solar-concentration risk over time. The Reliant Energy virtual power plant partnership
      (targeting 1.5 GW of managed distributed energy over five years) and the 2025 expansion
      to 15,000+ HVAC and plumbing contractor partners represent credible diversification
      vectors. GoodLeap's proprietary AI underwriting technology and contractor-side software
      create genuine switching costs in the installer channel.

      However, each mitigant is conditional on execution, access to capital, and the absence
      of further regulatory crystallization. The asset-light model's dependency on ABS market
      access is the single highest-severity structural risk: if KBRA and Fitch take further
      rating actions, or if institutional buyers reduce solar ABS allocations due to default
      trajectories, GoodLeap cannot hold loans on its own balance sheet at scale. The
      arbitration clause that has historically limited class-action exposure is being eroded
      by individual arbitration victories (full loan cancellations, fee orders), and the
      Minnesota AG case — now returning to state court — bypasses arbitration entirely because
      it is a state enforcement action, not a private claim. TILA and state consumer-protection
      enforcement cannot be arbitrated away.

      The thesis breaks fastest from a combination of two simultaneous events: (1) an adverse
      judgment or settlement in the Minnesota AG case requiring broad fee-disclosure reform
      or restitution that disrupts the dealer-fee revenue model industrywide, and (2) a further
      leg down in ABS performance that closes the securitization window for subordinate tranches.
      Either alone is survivable given the company's scale and $1.8 billion in total equity
      funding. Both together — against a backdrop of ITC expiration reducing new-origination
      economics — would create a financing and revenue gap that the diversification pipeline
      cannot close quickly enough.
