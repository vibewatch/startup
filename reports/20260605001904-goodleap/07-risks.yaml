  - id: policy-and-demand-risk
    title: >-
      The OBBBA accelerates ITC sunset to December 31, 2025, removing the single largest demand
      driver and amplifying loan-performance stress
    body: >-
      GoodLeap's business was built on the 30% federal Investment Tax Credit (ITC) under the
      Inflation Reduction Act of 2022, which — prior to the OBBBA — was scheduled to run at 30%
      through 2032. The One Big Beautiful Bill Act, signed July 4, 2025, terminates the
      residential solar ITC at December 31, 2025 and introduces strict new construction-start
      requirements (physical work of significant nature by July 4, 2026) for any remaining
      commercial/utility credit eligibility. IRS Notice 2025-42 eliminates the 5% safe-harbor
      pathway for most wind and solar projects, replacing it with a physical-work test. Foreign
      entity of concern (PFE) rules now further restrict credit access for projects with
      supply-chain exposure to China, Russia, North Korea, or Iran — directly relevant for solar
      panel supply chains.

      For GoodLeap, the ITC is not just a marketing feature — it is the mechanical basis for
      loan re-amortization. GoodLeap loans are typically structured with an 18-month window
      during which the borrower is expected to apply a ~30% ITC prepayment against the loan
      principal. When the ITC disappears for new installations after December 31, 2025, new
      borrowers will have no tax credit to apply, the re-amortization mechanics become
      economically opaque, and the loan-origination pitch loses its core cost-reduction argument.
      Wood Mackenzie, cited in the Minnesota AG filing, forecast that the loan segment — which
      peaked at nearly 70% market share in 2022 — had already fallen 6% in 2023 and was
      expected to decline further through 2024, with recovery not expected until 2027.

      Separately, California's NEM 3.0 policy (implemented April 2023) sharply reduced net
      metering compensation for new solar installations, removing a key bill-savings argument
      in GoodLeap's largest state market. The combination of ITC expiration, NEM 3.0, and
      elevated interest rates means that the consumer-facing economics of a GoodLeap loan —
      already contested by the Minnesota AG as requiring fee opacity to make the math work —
      are materially weaker for new originations in 2026. Sacra notes that GoodLeap's 2025
      revenue declined slightly from 2024, and GoodLeap's own blog acknowledges that key
      home energy tax credits are ending in 2025.
