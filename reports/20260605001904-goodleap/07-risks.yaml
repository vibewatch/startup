  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: tila-compliance-audit
      missingEvidence: >-
        No public source provides GoodLeap's internal TILA compliance methodology,
        documentation of how dealer fees are disclosed in the "amount financed," or outside-
        counsel opinion on whether its current disclosure practice satisfies TILA and Regulation Z.
      whyItMatters: >-
        The Minnesota AG's core theory is that GoodLeap's TILA disclosures omit dealer fees from
        the "amount financed." If correct, the remedy could require retroactive fee refunds and
        prospective disclosure reform that disrupts the entire dealer-fee revenue model.
      diligencePath: >-
        Obtain outside-counsel TILA compliance opinion, sample loan disclosure packages, consumer-
        complaint response logs, and any regulatory inquiry correspondence for the prior 36 months.
      relatedQuestionRefs:
        - QR008
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: blocking
      topic: abs-subordinate-performance
      missingEvidence: >-
        Detailed monthly distribution reports for subordinate tranches of the 11 downgraded KBRA
        classes are not publicly available; the March 2025 data referenced by KBRA is the most
        recent public data point.
      whyItMatters: >-
        If subordinate-tranche credit enhancement continues to erode, senior-class ratings will
        come under pressure at the next review cycle (likely Q3/Q4 2025), which could trigger
        investor redemptions and close the ABS window for GoodLeap's primary funding source.
      diligencePath: >-
        Request servicer reports, remittance reports, and loss timelines for the 11 downgraded
        classes; model stress cases at prepayment rates of 4-5% CPR and cumulative defaults of
        12-15% to size remaining credit enhancement.
      relatedQuestionRefs:
        - QR013
        - QR025
      relatedTableRefs:
        - TR002
        - TR005
    - type: missing-source
      severity: material
      topic: post-obbba-origination-economics
      missingEvidence: >-
        No public source quantifies how GoodLeap prices new solar loans in an ITC-free environment
        or what the re-amortization mechanic looks like without a 30% prepayment assumption.
      whyItMatters: >-
        The ITC re-amortization was both the loan's affordability pitch to consumers and the
        prepayment assumption on which ABS pricing was built; new-origination economics and
        ABS structure will need to change materially, and the transition risk is unquantified.
      diligencePath: >-
        Obtain sample post-OBBBA loan term sheets, updated ABS term sheets, and management's
        origination volume model under three ITC scenarios (full phase-out, extension, and
        partial credit continuation).
      relatedQuestionRefs:
        - QR022
        - QR025
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: contractor-quality-controls
      missingEvidence: >-
        No public source details GoodLeap's contractor onboarding, identity-verification, or
        fraud-detection controls; the fraud rate claim of <0.05% is unverified by any independent
        source, and the TIME investigation documented a systemic identity-verification gap.
      whyItMatters: >-
        Agency liability has already been established in one adjudicated arbitration; the same
        theory can bind GoodLeap for other installer misconduct across its 40,000-partner network
        if contractor controls are deficient.
      diligencePath: >-
        Request contractor onboarding compliance manuals, identity-verification SLAs, fraud
        incident register for the prior 24 months, FBI and law enforcement referral history,
        and installer termination log.
