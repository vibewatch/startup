  - id: contractor-and-concentration-risk
    title: >-
      A 40,000-contractor network is the business moat and the liability engine; installer
      misconduct binds back to GoodLeap under adjudicated agency theory
    body: >-
      GoodLeap's primary distribution is through a network of approximately 40,000 contractor
      and installer partners who use the GoodLeap Pro mobile app to offer instant financing at
      point of sale. This network is the core competitive moat — enabling same-day loan approvals
      and near-nationwide coverage — but it also creates concentrated liability exposure under
      the agency theory the Georgia arbitrator applied to the Pink Energy relationship.

      The TIME investigation (archived November 2025) documented a synthetic-identity fraud
      scheme in New Orleans in which a contractor (Deep South Renovations) used false Social
      Security numbers and real property addresses to obtain GoodLeap and Dividend loans on
      behalf of homeowners who never consented. GoodLeap's model pays contractors directly
      rather than homeowners, and the TIME investigation found that GoodLeap did not run a title
      search to confirm that the Social Security number on the loan application matched the
      property owner's record. GoodLeap's stated fraud rate is less than 0.05% of transactions,
      but the systemic issue is structural: the door-to-door sales process with iPad-based instant
      approval and next-business-day funding is architecturally optimized for speed, not identity
      verification, and sophisticated fraud schemes exploit that tradeoff.

      Concentration risk is significant in two dimensions. First, residential solar represents
      the dominant revenue source — GoodLeap is the #1 U.S. solar loan originator with ~28%
      market share. The CRL analysis that prompted the Treasury/CFPB/FTC enforcement partnership
      noted GoodLeap was one of five companies collectively accounting for approximately 80% of
      the residential solar financing market. When the market declines (as it has since 2022),
      GoodLeap's origination volume and fee income decline proportionally. Second, GoodLeap's
      ABS investor base is a concentrated pool of asset managers, banks, and insurance companies
      who fund its asset-light model; if credit performance continues to deteriorate, the cost of
      ABS capital will rise and new-deal execution will become harder, creating a liquidity
      tightening that squeezes the originate-to-sell engine at the same time regulatory costs
      are increasing.

      Competitors including Solar Mosaic, Sunnova, and Sunlight Financial have faced their own
      credit and regulatory stress; Sunlight Financial filed for Chapter 11 in October 2023 and
      emerged in December 2025. The competitive restructuring may temporarily reduce funding
      availability to the broader sector, but it also signals systemic fragility in the solar
      ABS market that rating agencies and institutional investors are now pricing into terms.
