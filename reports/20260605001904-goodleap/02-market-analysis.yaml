  - id: buyer-segment-channel
    title: Buyer, payer, and channel structure
    body: >-
      GoodLeap's buyer is the US homeowner—specifically owner-occupants of single-family
      residences who are evaluating sustainable upgrades and lack the liquid capital to pay
      cash. The payer is typically the same homeowner, who repays an installment loan over
      eight to twenty-five years at rates that ranged from roughly 1% to 7% APR nominal, or
      at an effective rate that may be higher once dealer fees are incorporated. In the TPO
      channel, the payer dynamics shift: the system owner (Sunrun, Sunnova, or GoodLeap's own
      Tactical Infrastructure Partners vehicle) finances the installation and the homeowner
      pays a monthly lease or power purchase agreement (PPA) rate. GoodLeap's channel is
      almost entirely contractor-mediated. Its GoodLeap Pros mobile application lets the
      contractor offer a homeowner multiple loan options within seconds at the kitchen table
      via a soft-credit pull, with digital contract execution and next-day funding upon
      project milestone verification. The contractor network stood at 40,000-plus in 2025,
      spanning solar, HVAC, roofing, and window verticals. The contractor is simultaneously
      a distribution partner and a compliance risk: CFPB's 2024 Issue Spotlight identified
      that dealer-fee markups inflating loan principals by 30% or more are frequently
      initiated at the contractor-lender interface, and that door-to-door solar sales
      tactics—common in GoodLeap's network—are a primary vector for misleading disclosures
      about federal tax credits and prepayment expectations. Buyer segmentation within the
      market reflects meaningfully different financing triggers. Solar-first homeowners are
      motivated by bill savings, environmental benefit, and the residual value of the federal
      Section 25D credit (now expired). Storage-add buyers are motivated by backup power,
      VPP income, and resilience. HVAC and heat-pump buyers are typically triggered by an
      aging system replacement event, higher comfort expectations, or IRA-related rebates.
      Roofing buyers respond to storm damage or insurance pressure. Each segment has a
      different average ticket size, financing term, and contractor type, making GoodLeap's
      multi-vertical ambition operationally complex. GoodLeap's 1.3 million-plus homeowners
      served represent significant cross-sell potential for secondary products, as documented
      in the GoodLeap Home app marketplace, but execution evidence across non-solar verticals
      remains limited.
