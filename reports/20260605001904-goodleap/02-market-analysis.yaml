callouts:
  - calloutType: risk
    title: Loan market structural contraction threatens GoodLeap's core business
    body: >-
      The US residential solar loan market—GoodLeap's primary product—contracted from 70%
      to 43% of residential solar financing contracts between 2022 and 2025. The full-year
      impact of Section 25D expiry will further shrink loan market volume in 2026 (SEIA/Wood
      Mackenzie forecast: -18% residential installations). GoodLeap's pivot to TPO and
      adjacent categories is strategically rational but execution in non-solar categories
      remains unproven at scale. Competitor Mosaic's operational pause and Sunlight
      Financial's bankruptcy restructuring signal that capital-markets access for solar loan
      platforms is fragile, not durable.
    claimRefs:
      - CM012
      - CM013
      - CM016
      - CM019
      - CM031
      - CM032

  - calloutType: insight
    title: Battery storage and VPP create a differentiated market layer beyond solar
    body: >-
      Battery attachment rates reached 25% nationally in 2025, and GoodLeap's GoodGrid VPP
      enrolled 165,000 California homeowners as of that year. This grid-services layer—where
      financed residential batteries become dispatchable grid assets—creates a data moat and
      recurring revenue opportunity that pure solar lenders cannot replicate. It also
      positions GoodLeap to benefit from VPP payment streams that regulators and utilities are
      beginning to formalize, potentially replacing some of the homeowner economic benefit
      lost to Section 25D expiry.
    claimRefs:
      - CM036
      - CM037
      - CM038
      - CM042

  - calloutType: risk
    title: CFPB scrutiny of dealer fees and POS solar lending poses material regulatory risk
    body: >-
      The CFPB's 2024 Issue Spotlight on solar financing directly described the dealer-fee
      markup model used by fintech point-of-sale lenders, finding that loan principals are
      regularly inflated 30% or more above the cash price without clear disclosure.
      GoodLeap's contractor-mediated, door-to-door origination channel places it squarely in
      scope. The Center for Responsible Lending named GoodLeap alongside Sunlight, Mosaic,
      Sunrun, and Sunnova as together accounting for 80% of the residential solar market.
      While no formal enforcement action against GoodLeap has been identified, the regulatory
      environment for its core origination model is materially more adverse than it was
      before 2024.
    claimRefs:
      - CM039
      - CM040
      - CM041
      - CM043

