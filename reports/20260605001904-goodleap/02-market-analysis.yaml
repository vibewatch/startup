  - id: sizing-lenses
    title: TAM, SAM, and sizing lenses across methodologies
    body: >-
      No single analyst provides a canonical figure for GoodLeap's serviceable market, so
      judgment requires layering multiple sizing lenses. At the broadest level, GoodLeap uses
      a $450 billion annual US sustainable home upgrade market as its TAM, drawing on the
      overall home improvement market and the proportion of spend directed at energy, solar,
      and efficiency products. Harvard JCHS independently estimated $139 billion in
      energy-related home improvements in 2023. The global residential solar PV market was
      valued at $94.2 billion in 2024 and is projected to reach $198.9 billion by 2034 at a
      7.9% compound annual growth rate (GM Insights). TechNavio's focused US residential
      solar study estimates that the US market will add $13.29 billion in value from 2026 to
      2030 at a 13.2% CAGR. The US residential solar sector installed 4,647 MWdc in 2025, a
      2% decline versus 2024, according to SEIA and Wood Mackenzie's 2025 Year in Review
      report. SEIA and Wood Mackenzie further forecast an approximately 18% year-over-year
      decline in residential installations in 2026 as the full impact of Section 25D expiry
      takes hold. For GoodLeap's narrower SAM—the residential solar financing market—the
      implied scale is roughly $13 to $16 billion annually at recent system cost and
      financing-take-rate levels (average system cost ~$25,000, with 58% of at-home installs
      financed by loan or TPO in 2023 per CFPB data, applied to approximately 4-5 GWdc of
      annual US residential capacity). The loan-only sub-market is smaller still: with loans
      at 43% of contracts in 2024-2025 (down from 70% in 2022), the loan SAM is in the range
      of $9 to $12 billion annually. The broader sustainable home upgrade financing
      opportunity—which GoodLeap is growing into via HVAC, batteries, roofing, and windows—
      may represent $130 to $140 billion of annually financed spend, though GoodLeap's
      penetration outside solar remains limited. Key evidence gaps persist: there is no
      independent sizing of the multi-category sustainable home loan market that disaggregates
      solar from HVAC, battery storage, and roofing.
