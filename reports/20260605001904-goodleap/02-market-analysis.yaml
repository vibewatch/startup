  - id: TM004
    title: Growth drivers and constraints
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication for GoodLeap
      - Diligence ask
    rows:
      - - Section 25D residential solar ITC expiry (Dec 31, 2025)
        - Headwind
        - Immediate (2026)
        - 18% forecast drop in residential installs; accelerates loan-to-TPO shift
        - What is GoodLeap's 2026 residential solar origination volume vs. 2024 peak?
      - - Section 48E commercial credit (TPO eligible through 2027)
        - Tailwind for TPO, headwind for loan product
        - Active 2026-2027
        - Shifts GoodLeap's competitive position; requires scaling TPO securitization program
        - How large is GoodLeap's TPO book relative to loan book? TPO securitization volumes?
      - - IRA consumer credits for heat pumps, HVAC, and efficiency
        - Tailwind
        - 2023–present; uncertain post-2025 federal policy
        - Expands addressable product set beyond solar; IRA backstop for HVAC lending growth
        - Track state-level IRA implementation and rebate availability by state
      - - Rising electricity prices and grid resilience demand
        - Tailwind
        - Ongoing; accelerating post climate events
        - Increases payback period ROI for financed upgrades; supports consumer demand
        - Monitor utility rate trends by state; quantify savings-to-payment ratio by product
      - - CFPB regulatory scrutiny on solar-specific POS loans
        - Headwind
        - Active (2024 Issue Spotlight published); enforcement risk
        - Dealer-fee practices, prepayment structure, and door-to-door sales are in scope
        - Has CFPB opened an investigation or issued an enforcement action against GoodLeap?
      - - High interest rate environment (median solar loan rate ~7.5% in 2025)
        - Headwind
        - Ongoing; rate trajectory uncertain
        - Raises effective monthly payment, reducing GoodLeap loan competitiveness vs. TPO
        - At what rate level does GoodLeap's loan product lose economic viability for borrowers?
      - - Battery attachment rate growth (25% nationally in 2025)
        - Tailwind
        - Accelerating
        - Increases average loan ticket; deepens GoodLeap's grid-services value chain
        - What is GoodLeap's battery attachment rate on its solar originations?
      - - Competitor distress (Mosaic pause, Sunlight Chapter 11, 2025)
        - Near-term tailwind via share gain
        - 2025-2026
        - Opens contractor network and homeowner acquisition opportunities
        - Has GoodLeap formally added distressed-competitor contractors to its network?
      - - PACE financing expansion ($2.8B annual originations, 40 states)
        - Adjacent competitive pressure in efficiency/resilience segment
        - Growing
        - Alternative funding path for property-attached sustainable upgrades
        - Could PACE cannibalize GoodLeap's HVAC and roofing loan pipeline?
      - - Customer acquisition cost spike (~$0.84/W in 2026, +40% YoY)
        - Headwind
        - Immediate (2026)
        - Compresses installer margins; pressures GoodLeap's dealer-fee economics
        - What is GoodLeap's contribution margin per origination at current customer acquisition costs?
    notes: >-
      Direction reflects net effect on GoodLeap's loan-focused business. Some headwinds for
      the loan product are tailwinds for GoodLeap's nascent TPO and services businesses.
      Diligence asks represent open research questions that require private company data.
