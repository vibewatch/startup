company:
  name: GoodLeap
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    GoodLeap sits at the intersection of two overlapping markets: the broad US sustainable
    home upgrade market (company-cited at $450 billion annually) and the narrower residential
    solar financing segment (~$14 billion, contracting in 2026 after Section 25D expiry).
    The loan market—GoodLeap's core product—fell from 70% of residential solar finance in
    2022 to 43% of contracts by 2024-2025 as third-party ownership (TPO) regained share.
    GoodLeap holds approximately 28% of the solar loan market and is pivoting toward a
    broader sustainable home platform spanning HVAC, batteries, roofing, and windows.
    CFPB regulatory scrutiny and the Mosaic and Sunlight Financial distress events signal
    structural fragility in the loan-financing channel that GoodLeap must navigate.

sections:
  - id: market-boundary
    title: Market boundary, segments, and substitutes
    body: >-
      GoodLeap's market boundary is definitionally the financing layer for sustainable home
      upgrades: products that enable US homeowners to fund solar panels, battery storage,
      energy-efficient HVAC and heat pumps, roofing, windows, and water-conservation systems
      through installment loans or third-party ownership (TPO) arrangements at the
      point-of-sale. The company itself cites a $450 billion annual US sustainable home
      upgrade market opportunity, which it derives from the broader $600-plus billion US home
      improvement market. Harvard's Joint Center for Housing Studies estimated total US home
      improvement and repair spending at $608 billion for 2025, while MarketDataForecast
      placed the figure at $549 billion for the same year. Energy-related improvements alone
      hit $139 billion in 2023, nearly four times the 2003 level, driven by solar adoption,
      insulation retrofits, and HVAC replacement. Included spend within GoodLeap's serviceable
      market covers financed upgrades across solar, storage, HVAC, roofing, and windows for
      owner-occupied single-family and multi-family homes in the United States. Excluded spend
      covers cash purchases (which comprised just 19% of residential solar transactions in
      2023), commercial PACE financing (a different credit structure GoodLeap does not
      originate), community solar subscriptions accessible to renters, and broader home
      improvement categories such as kitchen and bathroom renovation where GoodLeap has no
      product presence. The key status-quo substitute for a homeowner is to do nothing, remain
      on grid power, and absorb escalating utility bills without upgrading. Secondary
      substitutes include home equity loans and lines of credit from banks or credit unions
      that displace the specialized solar-specific loan structure. The structural argument for
      the sustainable upgrade market rests on the aging US housing stock (median age 44 years
      as of 2023), persistent electricity price inflation, climate-resilience motivations
      (insurance premiums jumped 17% from 2021 to 2023), and regulatory tailwinds from the
      Inflation Reduction Act's consumer and commercial clean energy credits. The IRA has
      expanded the scope of financeable upgrades beyond solar to heat pumps and battery
      storage, materially broadening GoodLeap's product surface. However, the 2025 expiry of
      the Section 25D homeowner investment tax credit—the 30% federal credit for
      customer-owned residential solar—directly reduces the core market's near-term growth
      rate and shifts the financing mix toward TPO structures where the credit can still be
      claimed by the system owner rather than the homeowner.
