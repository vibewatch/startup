tables:
  - id: TM001
    title: Market definition table — sustainable home upgrade financing
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Status-quo substitute
      - GoodLeap relevance
    rows:
      - - Residential solar financing
        - Point-of-sale loans and TPO arrangements for rooftop solar PV
        - Cash purchases (19% of installs), utility-scale and community solar
        - US homeowner (loan payer) or TPO provider (lease payer)
        - Remain on grid, home equity loan, or pay cash
        - Core product; ~28% solar loan market share in 2025
      - - Battery storage financing
        - Loans for standalone or solar-paired battery systems (e.g., Tesla Powerwall)
        - Utility-scale storage, commercial battery procurement
        - Homeowner; financed separately or bundled with solar loan
        - Cash purchase; utility backup tariff
        - Fast-growing add-on; battery attach rate reached 25% nationally in 2025
      - - HVAC and heat pump financing
        - Loans for energy-efficient HVAC, heat pumps, and electric resistance heaters
        - Commercial HVAC; maintenance contracts; building-owner procurement
        - Homeowner replacing an aging system or upgrading for efficiency/comfort
        - Manufacturer rebate programs, home equity line of credit, utility on-bill financing
        - Strategic growth category post-IRA; lower average ticket than solar (~$8–15k)
      - - Roofing and windows financing
        - Installment loans for roof replacement and energy-efficient windows (via GoodLeap Payments)
        - Commercial roofing and glazing; new construction
        - Homeowner responding to age, damage, insurance requirements, or aesthetic preference
        - Contractor extended payment terms, credit cards, home equity
        - New vertical launched in 2025; non-solar diversification to reduce policy risk
      - - Broader home improvement (excluded core)
        - Kitchen, bathroom, landscaping, and general renovation
        - Explicitly out of scope for GoodLeap's current sustainable-upgrade focus
        - General homeowner
        - Big-box retailer credit, home equity, renovation-specific lenders
        - Represents overall TAM context but GoodLeap has no active product presence
      - - PACE financing (adjacent, not GoodLeap)
        - Property-assessed clean energy assessments repaid through property tax
        - Residential PACE limited by consumer protection rules; C-PACE for commercial
        - Building owner (not GoodLeap's target; different credit structure)
        - Bank loans, equipment finance, utility programs
        - Alternative channel for sustainable upgrades; $2.8B annual originations in 2025
    notes: >-
      Boundary logic is product-based: included spend requires a financed sustainable upgrade
      delivered through GoodLeap's contractor network or TPO platform. PACE is included as
      an adjacent market for context. Excluded categories are out of GoodLeap's current product
      scope as of mid-2026.
