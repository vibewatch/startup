  - id: TM003
    title: Segment and buyer map — US sustainable home upgrade financing
    columns:
      - Buyer segment
      - Financing channel
      - Payer
      - Budget owner
      - Adoption trigger
      - Competitive dynamic
    rows:
      - - Solar-first homeowner (owned system)
        - Solar-specific installment loan (GoodLeap, Mosaic, Dividend Finance)
        - Homeowner repays over 8–25 years
        - Homeowner equity / savings
        - Bill savings; IRA credit (expired 25D); environmental motivation
        - Loan market contracting (-27 pts from 70% to 43% share 2022-2025)
      - - Battery storage adopter
        - Bundled solar+battery loan or standalone storage loan
        - Homeowner
        - Home budget / equity; some utility VPP incentives
        - Backup power; wildfire/storm resilience; VPP income; 25% national attach rate (2025)
        - Growing share within GoodLeap's origination mix
      - - HVAC / heat pump upgrade buyer
        - HVAC installment loan; IRA Section 25C rebate (when available)
        - Homeowner
        - Maintenance budget; utility rebate offset
        - Aging equipment failure or efficiency incentive; IRA expanded credit
        - Fragmented contractor base; banks and credit unions also active
      - - Roofing and windows customer
        - GoodLeap Payments installment loan (launched 2025)
        - Homeowner
        - Maintenance budget; insurance requirements
        - Roof age, storm damage, energy leakage; insurance premium pressure
        - Large fragmented incumbent base; GoodLeap entering an immature POS fintech niche
      - - TPO / lease or PPA adopter
        - Sunrun, Sunnova, or GoodLeap TPO vehicle (lease / PPA)
        - TPO provider owns system; homeowner pays monthly lease or per-kWh rate
        - No homeowner capital required
        - Zero upfront cost; Section 48E still available to TPO provider through 2027
        - Fastest-growing residential solar financing segment in 2025-2026
      - - LMI / underserved homeowner
        - PACE (where eligible), community solar, GGRF grants, credit union loans
        - Varies by channel; PACE repaid via property tax
        - Limited homeowner capital; income-qualified programs
        - Utility bill reduction; energy equity; disaster resilience
        - GoodLeap's penetration limited; CFPB has flagged LMI consumers as most vulnerable
    notes: >-
      Segment boundaries reflect 2025-2026 market structure. TPO share has been rising while
      loan share falls. LMI segment is underserved in GoodLeap's current product mix.
