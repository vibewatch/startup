  - id: homeowner-satisfaction-complaints
    title: Homeowner Satisfaction and Complaints
    body: >-
      Homeowner satisfaction at GoodLeap presents a bimodal distribution: high ratings in app-store environments
      coexist with persistently negative reviews on independent platforms. The GoodLeap Home iOS app carries a 4.8/5
      rating from 2,626+ users as of 2025, reflecting positive experiences with fast approvals, helpful
      representatives, and convenient online payment options. In contrast, Trustpilot scores GoodLeap at 2.6/5 ("Poor"),
      with a strong pattern of negative reviews through 2025 describing predatory loan terms, aggressive contractor-
      facilitated sales tactics, payment-processing errors, duplicate-charge incidents, and customer-service
      failures.


      The BBB has received 1,076 complaints against GoodLeap in the last three years and 443 complaints in the most
      recent 12 months, concentrated in order problems (346), service/repair issues (297), and billing disputes (229).
      The Texas Attorney General's Office has received at least 70 complaints, and the BBB includes a government
      actions alert on GoodLeap's profile. GoodLeap settled a 2022 Minnesota Attorney General lawsuit involving seven
      solar companies for $65,000 with no admission of wrongdoing; the case invoked the federal Holder Rule, which
      GoodLeap writes into its loan agreements.


      Structural complaints cluster around four themes: (1) dealer fees adding 20–35% to loan principal without
      clear disclosure at signing; (2) interest-only payment structures where up to 60–70% of monthly payments
      serve interest, especially during promo periods; (3) contractor abandonment of projects after GoodLeap funds
      the loan, with GoodLeap denying responsibility; and (4) hidden interest triggered by tiny remaining balances
      (one documented case: $593.19 interest on a 3-cent remaining balance). CBS News Texas reported a case in
      which an 80-year-old woman with dementia signed a $60,000 GoodLeap loan from which the 25-year payoff would
      have cost $87,000.


      App reviews confirm a recurring design issue: GoodLeap's loan system actively discourages early principal
      paydown—users report the platform does not allow scheduled recurring extra payments and requires manual
      monthly intervention one week before the due date. Positive counterexamples from app reviews describe smooth
      window and HVAC financing experiences with responsive human support, suggesting satisfaction correlates
      strongly with contractor quality and product category (non-solar projects appear to generate fewer complaints).
