company:
  name: GoodLeap
chapter:
  number: 6
  title: Customers
  summary: >-
    GoodLeap serves two primary customer groups: 1.3 million+ homeowners who finance sustainable home upgrades and
    18,000+ contractor partners who originate loans through its point-of-sale platform. Homeowner satisfaction is
    mixed — the GoodLeap Home app rates 4.8/5 on the Apple App Store, but Trustpilot scores are 2.6/5, with
    recurring complaints about hidden dealer fees, loan-term confusion, payment-processing errors, and poor customer
    service. Contractor adoption is strong and growing: 9 in 10 surveyed contractors report increased profit after
    joining GoodLeap, and GoodLeap Payments (launched June 2025) directly addresses the 60-day payment-cycle gap
    that constrained installer cash flow. Concentration risk is moderate; the network remains solar-heavy despite
    deliberate product diversification into HVAC, roofing, and windows.

sections:
  - id: customer-segmentation
    title: Customer Segmentation
    body: >-
      GoodLeap operates a two-sided marketplace with distinct but interlocked customer segments. On the borrower side,
      residential homeowners are the end consumers: they receive point-of-sale financing for solar panels, battery
      storage, energy-efficient HVAC, heat pumps, roofing, windows, and water conservation products. As of mid-2025,
      GoodLeap has served over 1.3 million homeowners across the United States. The typical borrower is a
      homeowner—not a renter—seeking to reduce utility costs, add resilience through battery backup, or meet
      sustainability goals. GoodLeap explicitly targets the mass-market homeowner, including vulnerable populations
      (elderly, fixed-income, and rural households), which has also been a source of regulatory and reputational risk
      given documented cases of elder abuse facilitated through the contractor channel.


      On the contractor side, GoodLeap's platform customers are licensed solar installers and home improvement
      contractors who embed GoodLeap's point-of-sale financing technology into their sales process. By mid-2025
      this network had grown to 18,000+ active contractor partners, up from earlier estimates of 5,000+ firms. The
      platform serves contractors across all 50 states, with the highest concentration in California, Texas, and
      the Sun Belt. Contractor segments span from large national installers to small regional firms and specialty
      trades (HVAC, roofing, electrical). A third indirect segment consists of institutional capital partners
      (banks, asset managers, securitization buyers) who purchase originated loans, but these are financial
      counterparties rather than product customers.


      Geographically, GoodLeap's homeowner base skews toward states with high solar irradiance and supportive net
      metering policies—California, Texas, Florida, Arizona, and the Southeast. The GoodGrid virtual power plant
      program has further deepened penetration in California (DSGS program), Texas (Reliant partnership), and
      Connecticut (Green Bank partnership), creating a cross-sell surface for battery storage customers already on
      the platform.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
