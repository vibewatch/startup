  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion Driver / Concentration Risk
      - Type
      - Impact
      - Evidence
      - Diligence Path
    rows:
      - - GoodGrid VPP cross-sell to existing borrowers
        - Expansion
        - High — converts one-time borrowers into recurring energy customers; battery attachment rates doubled in TX
        - GoodLeap press releases; CT Green Bank / Reliant partnerships (2025)
        - Track VPP enrollment growth vs. eligible base; ask for retention rate of GoodGrid participants
      - - Non-solar product cross-sell (HVAC, roofing, windows)
        - Expansion
        - Medium — diversifies revenue and reduces solar concentration risk
        - Sacra (non-solar diversification noted as slow); SWOT analysis (cross-sell top opportunity)
        - Request breakdown of loan originations by product category to quantify non-solar traction
      - - Lease/PPA pivot for new homeowner segments
        - Expansion
        - High — unlocks homeowners who reject loans at 7.5% rates; majority of installer demand expected to shift by 2026
        - Solar Power World (GoodLeap COO Dan Lotano, Nov 2025); Sacra securitization data ($323M solar lease/PPA)
        - Verify GoodLeap's lease/PPA origination ramp vs. loan decline rate
      - - Solar-market concentration (>80% of volume)
        - Concentration risk
        - High — solar loan demand declining with rising rates; policy risk from NEM 3.0; residential ITC ended Dec 2025
        - Sacra; SWOT analysis (28% US solar loan market share); EnergySage H1 2025 report
        - Request product-mix revenue breakdown; stress-test downside if solar loan volume falls 30%
      - - Geographic concentration (CA / TX / FL)
        - Concentration risk
        - Medium — state net-metering policy changes (CA NEM 3.0) already impacted demand; Texas policy more stable
        - GoodGrid PR (CA, TX, CT deployments); GoodLeap press releases
        - Request state-level origination distribution; assess exposure to pending NEM rule changes
      - - Contractor misconduct / abandonment tail risk
        - Concentration risk
        - High — structural model pays contractors before inspection; GoodLeap bears reputational risk when installers fail
        - BBB complaints (297 service/repair issues); EnergySage (52 reviews cite uninstalled systems); CBS News TX report
        - Request contractor-quality scoring data and abandonment rate; review indemnification / clawback provisions
      - - Single-lender dependence for installer networks
        - Concentration risk
        - Medium — installers offering only GoodLeap financing are vulnerable if GoodLeap changes terms or tightens credit
        - Wattbot review analysis; SWOT analysis (contractor network dependence)
        - Interview 5+ contractor partners on alternative lender relationships; ask for contractor churn rate
    notes: >-
      Expansion drivers and concentration risks are derived from public press releases, independent review platforms,
      and market research. Non-solar loan volume breakdown is not publicly available; solar concentration estimate
      is approximate.
    claimRefs:
