  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention
      missingEvidence: GoodLeap NRR, GRR, churn rate, and repeat-loan rate by homeowner cohort and product vertical.
      whyItMatters: Without retention metrics, it is impossible to assess whether GoodLeap's homeowner base is a durable recurring revenue asset or a one-time origination pool with no expansion economics.
      diligencePath: Request directly from GoodLeap management in diligence; cross-check against securitization investor presentations that may include vintage performance data.
      relatedQuestionRefs:
        - QU005

    - type: private-evidence-only
      severity: material
      topic: contractor-network
      missingEvidence: Breakdown of loan origination volume by product vertical (solar vs. HVAC vs. roofing vs. windows) and top-10 contractor concentration as share of total.
      whyItMatters: Solar concentration creates outsized policy risk; without a product-mix breakdown, investors cannot assess diversification traction or top-contractor dependency.
      diligencePath: Request origination ledger by product category and installer from GoodLeap CFO; review securitization offering documents for vintage data.
      relatedQuestionRefs:
        - QU016
        - QU021

    - type: missing-source
      severity: material
      topic: regulatory-complaints
      missingEvidence: Total CFPB complaint volume for GoodLeap and any pending UDAAP enforcement actions beyond the 2022 Minnesota settlement.
      whyItMatters: CFPB enforcement would materially impair GoodLeap's lending license and business model; the JS-only CFPB complaint database limited independent verification.
      diligencePath: Download CFPB complaint database bulk data for GoodLeap; obtain confirmation from legal counsel that no open CFPB investigation exists.

    - type: private-evidence-only
      severity: material
      topic: contractor-abandonment
      missingEvidence: GoodLeap's internal contractor-quality scoring system, abandonment rate by installer cohort, and clawback/indemnification provisions enforced.
      whyItMatters: The structural model of pre-inspection funding is the single biggest homeowner-complaint driver; without knowing the abandonment rate and clawback effectiveness, the tail risk cannot be sized.
      diligencePath: Request GoodLeap's contractor risk-management playbook, clawback agreement terms, and historical abandonment-incident data from legal and operations teams.

    - type: private-evidence-only
      severity: material
      topic: geographic-concentration
      missingEvidence: State-by-state origination volume breakdown and top-5 state concentration metric for GoodLeap's loan book.
      whyItMatters: If California, Texas, and Florida together represent 60%+ of volume, state-level policy changes (NEM 3.0, TX grid policy) create correlated geographic risk.
      diligencePath: Request geographic origination distribution from GoodLeap; analyze securitization pool prospectuses for state concentration data.

    - type: enumeration-incomplete
      severity: minor
      topic: contractor-network
      missingEvidence: Named contractor partners beyond the general claim of 18,000+; no top-10 or top-25 contractor list has been published.
      whyItMatters: Named-contractor proof would materially strengthen the assessment of channel quality and diversity; currently only anonymous review-platform cases and institutional VPP partners are named.
      diligencePath: Request named contractor reference list from GoodLeap channel team; search for press announcements from large installers announcing GoodLeap partnership.
      relatedQuestionRefs:
        - QU016
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: loan-performance
      missingEvidence: GoodLeap loan delinquency rate, default rate, and loss-given-default by vintage compared to industry benchmarks (GSE or FHA residential).
      whyItMatters: Delinquency and default rates determine the true credit quality of GoodLeap's origination, affecting securitization pricing, investor appetite, and the risk of a credit-cycle tightening event that could impair the originate-and-sell model.
      diligencePath: Request loan performance data from GoodLeap CFO; review securitization offering documents and rating agency presale reports for delinquency, prepayment, and loss history by vintage.
      relatedQuestionRefs:
        - QU014

    - type: private-evidence-only
      severity: minor
      topic: cross-sell-penetration
      missingEvidence: Quantified cross-sell penetration rate—share of existing homeowners who have taken a second GoodLeap product—and the average lifetime loans per borrower.
      whyItMatters: Without a measured cross-sell rate, the claim that GoodLeap can monetize its 1.3M homeowner base beyond the initial origination event remains speculative.
      diligencePath: Request cross-sell cohort data from GoodLeap product and data teams; ask for average number of GoodLeap products per household across vintages.
      relatedQuestionRefs:
        - QU022

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All five tables include notes fields describing data sources, estimation basis, and coverage limitations.
      The cohort retention figure (FU004) is explicitly labelled as analyst estimates in both the approximationNotes
      and the figure summary, satisfying the tableNotes spirit for the figure artifact.
  - dimension: unverifiedSource
    reason: >-
      SU020 (CFPB complaint database) returned a JS-only page that could not render full content; stance and sourceType
      were assigned based on the known nature of the CFPB database (regulatory, independent, adverse toward companies
      with logged complaints). All other 26 sources were successfully fetched via fetch-url with accessStatus ok.
