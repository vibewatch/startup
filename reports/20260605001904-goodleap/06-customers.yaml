  - id: deployment-use-cases-named-proof
    title: Deployment Use Cases and Named Customer Proof
    body: >-
      GoodLeap's primary homeowner use cases span five product verticals. Solar-only financing remains dominant,
      representing the largest share of the $30 billion+ in cumulative platform financing since 2018. Solar plus
      battery storage is the fastest growing segment, with battery attachment rates in Texas doubling since the
      GoodGrid VPP launch. HVAC, heat pump, and roofing financing represent diversification efforts with lower
      current penetration; no public metric exists for non-solar share of volume. Water conservation (drought-
      resistant landscaping and water-saving appliances) is a nascent category.


      Named reference proofs for the contractor segment include the 2025 ServiceTitan Pantheon event, where
      GoodLeap presented contractor success stories with long-tenured partners describing business growth attributable
      to GoodLeap financing tools. GoodLeap's blog post for Pantheon 2025 is a company-authored source with no
      independent corroboration of named contractor metrics. The GoodGrid VPP program has institutional anchor
      customers: the Connecticut Green Bank (state government partner, August 2025), Reliant Energy/NRG (Texas
      utility partnership, $40/month customer reward program), and California's DSGS program (six documented
      grid-stress relief events). These represent verifiable third-party deployments with public announcements.


      For homeowners, Fortune's 2025 "Change the World" recognition credits GoodLeap with 1.3 million+ homeowners
      served, 20 million metric tons of CO₂ avoided, $30 billion in lifetime utility bill savings enabled, and
      165,000 California homeowners enrolled in GoodGrid. These aggregate figures come from GoodLeap press releases
      and are not independently verified. EnergySage lists GoodLeap Solar with a profile carrying 398 homeowner
      reviews and a claimed BBB A+ rating. The Sacra research note, based on disclosed quarterly financial figures,
      estimates GoodLeap's 2025 home efficiency loan volume at $4.6 billion, a 44% increase from $3.2 billion in
      2024.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
