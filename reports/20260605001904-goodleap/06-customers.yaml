callouts:
  - calloutType: risk
    title: Contractor Moral Hazard Creates Structural Complaint Risk
    body: >-
      GoodLeap funds contractors before final inspection to keep installer satisfaction high, but this creates a
      structural moral-hazard gap. EnergySage analysis found 52 verified reviewer cases where homeowners paid
      monthly loan bills for systems never installed or never turned on. The BBB has documented 1,076 complaints
      in three years, including 297 service/repair issues. GoodLeap's standard response deflects responsibility
      to the installer, but the Holder Rule (written into every GoodLeap loan) makes the lender potentially
      liable for contractor defects. This conflict between the contractor-satisfaction model and homeowner
      protection is a reputational and regulatory overhang.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU021

  - calloutType: strength
    title: Deep Contractor Network Is a Hard-to-Replicate Moat
    body: >-
      GoodLeap's 18,000+ active contractor partners represent years of relationship-building, compliance
      onboarding, and technology integration. The GoodLeap Pros mobile app—enabling instant credit decisions
      at the homeowner's door—creates a switching-cost flywheel: installers who train their sales teams on
      GoodLeap's workflow resist replatforming to a competitor. The June 2025 launch of GoodLeap Payments
      deepens this lock-in by extending from financing to full payment-operations tooling for contractors.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010

  - calloutType: insight
    title: GoodGrid VPP Is the Key Homeowner Retention Mechanism
    body: >-
      Unlike most lenders, GoodLeap has an ongoing post-origination product in GoodGrid, which enrolls existing
      battery customers into a virtual power plant that pays monthly cash rewards. This converts a one-time loan
      event into a recurring energy relationship. Battery attachment rates doubled in Texas following GoodGrid
      launch; 165,000 California homeowners are already enrolled. If GoodLeap can expand GoodGrid nationwide
      and replicate the VPP economics in additional utility markets, it creates a durable retention layer that
      competitors without a VPP platform cannot easily replicate.
    claimRefs:
      - CU029
      - CU030
      - CU031

