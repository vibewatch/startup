  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: profitability
      missingEvidence: >-
        Audited income statement with gross margin, EBITDA, net income, and revenue disaggregated
        by stream (origination fees, servicing fees, securitization premiums).
      whyItMatters: >-
        Without disclosed profitability metrics, the financial health and operational leverage of
        GoodLeap's business model cannot be independently assessed. The $35M EBITDA headwind from
        litigation suggests pressure on an already undisclosed baseline.
      diligencePath: >-
        Request audited financial statements or management accounts from GoodLeap; cross-reference
        against ABS servicer reports and dealer fee disclosures in ABS transaction documents.
      relatedQuestionRefs:
        - QI013

    - type: private-evidence-only
      severity: blocking
      topic: financial-gaps
      missingEvidence: >-
        Comprehensive financial due diligence package including: cash position, monthly burn rate,
        runway, warehouse facility terms, forward purchase agreement coverage ratios, and covenant
        compliance status.
      whyItMatters: >-
        Without these disclosures, diligence blockers cannot be resolved and investment underwriting
        at high confidence is not achievable. The 2021 valuation mark is the most recent available
        and is four years stale in a rate-stressed market.
      diligencePath: >-
        Engage directly with GoodLeap for a data room that includes board-level financial reports,
        warehouse facility summaries, and forward purchase agreement schedules.
      relatedQuestionRefs:
        - QI022

    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        Details of the $428.8M 2024 debt financing round: lender identity, interest rate,
        maturity, security interest, financial covenants, and any cross-default provisions.
      whyItMatters: >-
        Unknown debt terms and covenants may limit GoodLeap's operating flexibility, constrain
        future equity raises, or trigger defaults under adverse credit conditions.
      diligencePath: >-
        Request loan agreement summary, term sheet, or covenant summary from management; verify
        through lender references or SEC lien searches on GoodLeap LLC.
      relatedQuestionRefs:
        - QI021

    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Per-channel customer acquisition cost breakdown, blended CAC, average contractor
        origination cost, and CAC payback period.
      whyItMatters: >-
        CAC and payback are central to evaluating the efficiency and scalability of GoodLeap's
        contractor-mediated GTM motion; without these, GTM economics cannot be assessed.
      diligencePath: >-
        Request per-channel origination cost schedule from GoodLeap; benchmark against solar
        fintech peers (Mosaic, Dividend/Fifth Third) through industry reports and ABS servicer data.
      relatedQuestionRefs:
        - QI025

    - type: missing-source
      severity: material
      topic: credit-quality
      missingEvidence: >-
        Vintage-level loan loss curves, actual cumulative net loss rates, delinquency roll rates,
        and prepayment speeds by pool and origination year, from GoodLeap's internal loan performance
        database rather than ABS trustee reports alone.
      whyItMatters: >-
        Rating agency default assumptions (Fitch: up to 12.50% lifetime for 2024-1) are based
        on observed ABS pool data, but the full loan universe including non-securitized loans is
        not visible; actual portfolio quality may differ from what's observable in ABS reporting.
      diligencePath: >-
        Request historical vintage loss schedule from GoodLeap; independently validate against
        KBRA and Fitch ABS performance data and investor reports from active trusts.
