      GoodLeap has completed 24 cumulative ABS transactions since 2018, totaling $32B+ in
      facilitated financing, and in 2025 continued accessing the market with Bank of America
      as sponsor and Goldman Sachs, Citigroup, and CIBC as joint bookrunners. The frequency
      and scale of issuance demonstrate operational maturity in structured finance and a
      diverse set of institutional capital relationships.
    claimRefs:
      - CI018
      - CI027
      - CI015

  - calloutType: insight
    title: Revenue Compression Despite Volume Growth Signals Fee Pressure
    body: >-
      Home efficiency loan volume grew 44% year-over-year from $3.2B (2024) to $4.6B (2025),
      yet Sacra's 2025 revenue estimate of $361M implies significantly lower revenue per
      dollar originated versus the $500M figure reported for 2024. This compression — if the
      data is accurate — suggests declining origination fee rates, thinner securitization
      premiums, or both, driven by sector-wide competition and tighter credit conditions.
    claimRefs:
      - CI003
      - CI005

  - calloutType: assumption
    title: Asset-Light Model Contingent on Continuous ABS Market Access
    body: >-
      GoodLeap's entire operating model assumes sustained, economically viable access to ABS
      markets. If spread widening, credit-quality concerns, or regulatory pressure constrains
      that access, the company would need to retain loans on balance sheet — requiring
      significant equity capital it has not raised and materially changing its risk profile.
      This structural dependency is the central financial underwriting risk.
    claimRefs:
      - CI006
      - CI029
      - CI034

