company:
  name: GoodLeap
chapter:
  number: 4
  title: Financials
  summary: >-
    GoodLeap operates an asset-light originate-to-sell financing platform earning revenue through
    origination fees, loan servicing, and securitization premiums. Sacra estimates 2025 revenue at
    approximately $361M on $4.6B in home efficiency loan volume, while the company completed seven
    ABS transactions totaling approximately $1.23B in 2025, reaching 24 cumulative securitizations
    and $32B+ in total facilitated financing since 2018. Rating-agency actions in mid-2025 signal
    material credit stress in older solar loan vintages — Fitch downgraded subordinate notes in the
    2023-2 and 2023-3 trusts to B- and CCC territory respectively, and KBRA downgraded 11 of 53
    rated classes across 18 trusts. Gross margin, EBITDA, cash position, and CAC remain undisclosed
    private metrics that constitute the primary diligence blockers.

sections:
  - id: revenue-model
    title: Revenue Model and Fee Structure
    body: >-
      GoodLeap generates revenue through three primary streams: origination fees paid by
      contractor-dealers at loan close, recurring servicing fees on managed loan balances,
      and securitization premiums captured when pools of loans are packaged into asset-backed
      securities and sold to institutional investors. The company does not hold loans on its
      balance sheet beyond a short warehousing window; it pre-sells originations via forward
      purchase agreements with banks, insurance companies, asset managers, and credit unions,
      concentrating economic value on technology and origination rather than net interest margin.
      This asset-light structure distinguishes GoodLeap from portfolio lenders but creates a
      structural dependency on continuous access to wholesale capital markets and ABS investor
      appetite.

      Sacra estimates 2025 revenue at approximately $361M based on disclosed quarterly figures
      of $83M in Q1 and $88M in Q2. Getlatka and IncFact report 2024 revenue above $500M, a
      figure that may reflect ARR or a different accounting convention than the Sacra 2025 run-rate
      estimate; the discrepancy is material and unresolved. The 2025 home efficiency loan volume
      of $4.6B — up 44% from $3.2B in 2024 — suggests revenue per dollar originated may have
      declined as sector headwinds, including elevated interest rates and policy uncertainty,
      compressed origination and securitization economics. Origination fees are the largest estimated
      revenue component (~$280M or roughly 78% of total per third-party estimates), with servicing
      fees and securitization premiums making up the balance. GoodLeap has not publicly confirmed
      any revenue-stream breakdown; all proportional figures are third-party estimates or inferences
      from disclosed loan volumes and fee structures visible in ABS filings.

      GoodLeap's contractor network — comprising 18,000+ approved installation and home improvement
      partners — is the primary origination engine. Contractors use the GoodLeap Pros mobile app
      to present financing options to homeowners at the point of sale, with loan decisions delivered
      in under 60 seconds. The contractor-mediated model reduces direct consumer acquisition cost
      but introduces compliance risk: installer-led sales may obscure loan terms, as documented
      in multiple regulatory and legal actions.
