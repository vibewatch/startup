  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: profitability
    missingEvidence: Audited or company-confirmed EBITDA, gross margin, and unit economics per 
      originated loan for 2024 and 2025.
    whyItMatters: Without profitability data the investment case cannot be assessed; Sacra flagged a
      $35M EBITDA downward revision but no baseline figure is publicly available.
    diligencePath: Request audited financial statements or investor-package deck; ask management for
      confirmed EBITDA bridge and gross margin by product line.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or company-confirmed annual revenue for 2024 and 2025; breakdown by 
      origination fees, servicing fees, and securitization premiums.
    whyItMatters: Sacra ($361M 2025) and GetLatka ($500M 2024) estimates conflict and are unaudited;
      the true figure affects growth-rate and multiple calculations.
    diligencePath: Request financial statements or board presentation; cross-reference with KBRA 
      trustee reports for implied origination volume and pricing.
  - type: private-evidence-only
    severity: material
    topic: ABS-credit-risk
    missingEvidence: Current payment status of GoodLeap ABS bonds that ceased interest payments per 
      July 2025 WSJ report; updated default curves and recovery rates across all 24 trust vintages.
    whyItMatters: Continuing interest payment cessation on additional tranches would impair future 
      ABS issuance capacity, which is the primary funding mechanism for GoodLeap's asset-light 
      model.
    diligencePath: Review monthly KBRA and Fitch surveillance reports for each trust; obtain trustee
      reports showing trigger-event status; request updated loan performance tape.
    relatedQuestionRefs:
    - QO021
    - QO022
  - type: missing-source
    severity: material
    topic: leadership-governance
    missingEvidence: Complete confirmed executive roster with titles and start dates; full board of 
      directors roster including independent member count and investor-nominated seats.
    whyItMatters: Official leadership page is JS-only and could not be scraped. Founder-CEO 
      concentration without confirmed board oversight is a governance risk, particularly given the 
      company's private status.
    diligencePath: Scrape or directly request goodleap.com/leadership content; cross-reference 
      LinkedIn for current executives; request board roster from company investor relations.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: litigation
    missingEvidence: Nature, parties, and current status of lawsuits that caused GoodLeap's 2025 
      EBITDA forecast to be revised downward by $35M; any regulatory actions or CFPB complaints.
    whyItMatters: Litigation costs of $35M are material relative to estimated revenue; if related to
      contractor sales practices, regulatory outcomes could constrain origination volumes.
    diligencePath: PACER search for GoodLeap LLC; CFPB complaint database; state AG press releases; 
      request management legal disclosure schedule.
    relatedQuestionRefs:
    - QO021
  - type: private-evidence-only
    severity: material
    topic: valuation-capital
    missingEvidence: Post-October 2021 equity round, secondary transaction, or board-approved 
      valuation; fully diluted cap table with investor ownership percentages.
    whyItMatters: The $12B valuation is 4+ years stale. Given sector multiple compression and ABS 
      credit deterioration, current fair value could be materially lower. Cap table controls 
      governance leverage.
    diligencePath: Check secondary-market platforms (Forge, Nasdaq Private Market) for transaction 
      prices; review Riverstone or Brookfield fund markings; request 409A or board-approved 
      fair-value opinion.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Private corporate events such as secondary share sales, board composition 
      changes, undisclosed regulatory or legal proceedings, and product launches not covered in 
      press releases.
    whyItMatters: The milestone table covers only publicly announced events; adverse internal events
      (regulatory actions, significant leadership departures) could be material but unreported.
    diligencePath: Request management timeline of significant events since founding; review PACER 
      and state court filings; CFPB consumer complaint data; Glassdoor for culture/leadership 
      signals.
    relatedTableRefs:
    - TO004
sections:
- id: identity-and-model
  title: Identity, product, and business model
  body: GoodLeap should be treated as a private sustainable-home finance and software platform, not 
    as a simple solar installer or balance-sheet lender. Its official pages and 2026 recognition 
    release describe financing and software for solar panels, batteries, HVAC, heat pumps, roofing, 
    windows, and adjacent home-efficiency upgrades, while Sacra frames the system as a three-sided 
    marketplace linking homeowners, contractors, and capital providers. The conservative current 
    scale statement is GoodLeap own more-than-one-million homeowners and more-than-$30B financing 
    since 2018 claim; Sacra 1.3M-plus homeowners and 18,000-plus contractor partners are useful but 
    should be labeled third-party-reported until management reconciles definitions. POWER supplies 
    Roseville California headquarters. This section therefore anchors later analysis on a 
    platform-and-capital-provider model, with customer and partner counts treated as cumulative 
    public indicators rather than audited operating metrics.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO043
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: leadership-and-founder-dependence
  title: Leadership and founder dependence
  body: 'The public company story remains highly founder-centered. GoodLeap official leadership page identifies
    Hayes Barnard as founder chairman and CEO; The Org adds the deeper founder-market-fit narrative from
    Loanpal, Paramount Solar, and SolarCity, including Barnard SolarCity chief revenue officer period.
    That background matters because GoodLeap channel, installer, and capital-provider model depends on
    understanding residential solar sales, point-of-sale credit, and institutional financing. The public
    record is thinner for the rest of the executive team: Matt Dawson appears as chief revenue officer
    in TIP ATLAS coverage, but retained official pages did not expose a full current executive roster.
    Later diligence should separate Barnard domain fit from succession risk. The governance diligence
    ask is explicit because founder quality and founder concentration can both be true at the same time
    for this company.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO040
  - CO044
  tableRefs:
  - TO002
- id: capitalization-and-investor-base
  title: Funding, valuation, and capital providers
  body: 'The last widely reported corporate valuation remains the October 2021 round: more than $800M
    invested at a $12B valuation, led by MSD Partners with BDT Capital Partners and Davidson Kempner alongside
    current shareholders. Canary corroborates the valuation and notes earlier 2021 financing that included
    Brookfield and New Enterprise Associates. Since then, visible financing activity has shifted from
    venture valuation to asset-level and capital-markets structures: the October 2024 TIP ATLAS arrangement
    funded more than $1.5B of residential solar and storage systems for leases and PPAs, while later securitizations
    brought ABS access. That $1.5B transaction should not be treated as a new corporate valuation. Later
    valuation work should therefore separate corporate equity value, asset-level funding capacity, and
    securitized collateral performance before drawing conclusions.'
  claimRefs:
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
  - CO023
  - CO024
  - CO027
  - CO038
  - CO042
  tableRefs:
  - TO003
- id: milestones-and-adverse-record
  title: Milestones, recognition, and adverse record
  body: The chronology has two tracks. Positively, GoodLeap moved from Loanpal to a broader brand in
    2021, scaled sustainable-home financing, announced the 2024 lease/PPA funding structure, 
    continued securitizing loans, and publicized a 2026 reliability recognition. Adversely, 
    Minnesota Attorney General sued GoodLeap and other solar lenders over alleged hidden dealer 
    fees; CRL tied the solar-financing market to federal enforcement concerns; TIME reported 
    fraud-control allegations alongside GoodLeap response; a law-firm source reported a 2026 
    arbitration loss; and KBRA downgraded 18 note classes from 18 GoodLeap-related securitizations. 
    These items are material enough for later legal customer and financing chapters. The adverse 
    chronology is included beside growth milestones so later chapters do not rediscover or 
    underweight the same risk evidence.
  claimRefs:
  - CO013
  - CO014
  - CO019
  - CO022
  - CO023
  - CO025
  - CO026
  - CO028
  - CO029
  - CO030
  - CO031
  - CO032
  - CO033
  - CO034
  - CO035
  - CO036
  - CO037
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: cover-metrics-and-diligence-gaps
  title: Cover metrics and unresolved gaps
  body: The cover-metric posture is deliberately conservative. GoodLeap public materials support 
    cumulative financing above $30B and more than one million homeowners, while Sacra supports a 
    higher 1.3M-plus homeowner and 18,000-plus contractor-partner estimate. The $12B valuation is 
    historical, not refreshed, and no retained source disclosed audited revenue, ARR, gross margin, 
    current headcount, or a management-certified active customer count. Later chapters can reuse 
    private, founder-led, Roseville-based, $30B-plus cumulative financing, one-million-plus 
    homeowners, $12B last reported valuation, and material solar-lending legal regulatory and credit
    adverse scrutiny. Anything more precise requires management evidence or a primary filing. That 
    conservative baseline keeps the report usable while preserving clear next-step requests for 
    management-provided evidence. Management evidence remains required for precision.
  claimRefs:
  - CO003
  - CO004
  - CO006
  - CO016
  - CO028
  - CO029
  - CO033
  - CO038
  - CO039
  - CO040
