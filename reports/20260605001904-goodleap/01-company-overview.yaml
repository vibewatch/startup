  name: GoodLeap
chapter:
  number: 1
  title: Company Overview
  summary: GoodLeap is a Roseville, California-based sustainable-home financing and software 
    platform whose public profile is founder-led around Hayes Barnard, with disclosed scale above 
    $30B of financing and more than one million homeowners served. The company carries a last widely
    reported $12B private valuation from October 2021 and has since leaned on securitization and a 
    2024 TIP/ATLAS lease-and-PPA funding structure rather than a newly disclosed equity mark. The 
    main diligence tension is that distribution scale and capital-markets access are paired with 
    solar-loan dealer-fee litigation, consumer-finance scrutiny, fraud-control allegations, and 2026
    ABS downgrades.
