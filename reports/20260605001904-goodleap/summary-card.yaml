  topStrengths:
    - >-
      Scaled platform with more than 1.3 million homeowners served, 18,000+ contractor partners, and over $32B of
      sustainable-home financing facilitated.
    - >-
      Mature originate-to-sell capital-markets engine with 24 cumulative securitizations and continued 2025 ABS
      execution across loans and lease/PPA structures.
    - >-
      Embedded contractor workflow through GoodLeap Pros, GoodLeap Payments, and integrations with sales/install
      platforms creates real distribution leverage if trust controls hold.
    - >-
      Founder-market fit from Hayes Barnard's Loanpal, Paramount Solar, and SolarCity background supports category
      knowledge and capital-provider narrative.
  topRisks:
    - >-
      The October 2021 $12B valuation implies roughly 24x-33x public revenue estimates and is not supported by current
      ABS, legal, and public-market evidence.
    - >-
      ABS performance has deteriorated, with KBRA and Fitch downgrades, negative excess-spread dynamics, and reported
      interest-payment cessation in some GoodLeap-linked bonds.
    - >-
      Minnesota AG litigation, CFPB/Treasury/FTC scrutiny, arbitration losses, and dealer-fee allegations directly
      challenge the economics and compliance of the contractor-mediated model.
    - >-
      Private disclosure is thin: audited financials, EBITDA, gross margin, cash, cap table, 409A/secondary pricing,
      warehouse capacity, and vintage loss curves remain unavailable.
    - >-
      Policy and demand pressure from residential solar ITC sunset, NEM 3.0, high rates, and solar-finance peer distress
      could pressure originations and securitization access.
  unresolvedGaps:
    - >-
      Current audited revenue by stream, EBITDA after litigation costs, gross margin, cash balance, burn, and
      profitability trajectory.
    - Current cap table, preference stack, 409A, secondary pricing, and any post-2021 valuation reset.
    - >-
      ABS warehouse capacity, forward-purchase commitments, advance rates, spreads, trigger exposure, and current
      vintage loss curves.
    - >-
      Status, reserve size, settlement range, and operating-model impact for Minnesota and related consumer-finance
      matters.
    - >-
      Proof that non-solar home-improvement, lease/PPA, GoodGrid, and GoodLeap Payments growth can offset solar-loan
      demand and credit stress.
