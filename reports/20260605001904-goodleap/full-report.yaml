      - number: '8.3'
        title: 'Scenario framework: ABS access, originations, losses, policy, and legal outcomes drive the range'
        blocks:
          - type: paragraph
            body: >-
              The bull case is still credible but narrow: GoodLeap would need sustained home-improvement originations,
              visible post-ITC product diversification, stable or improving ABS execution, contained legal settlements,
              and proof that its contractor network can generate volume without hidden-fee economics. The base case
              assumes the company survives and remains an active securitization issuer, but its multiple compresses as
              investors demand compensation for rating downgrades, negative headline risk, and private disclosure gaps.
              The bear case is not hypothetical because Sunnova and Mosaic demonstrate that solar finance platforms can
              lose equity value quickly when leverage, policy risk, servicing complexity, and capital-market confidence
              break together. The fastest thesis-break combination is an adverse legal outcome that changes fee
              economics plus further ABS deterioration that raises funding costs or shuts the securitization window.
