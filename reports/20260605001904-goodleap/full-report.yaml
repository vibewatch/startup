              Home efficiency loan volume grew 44% year-over-year from $3.2B (2024) to $4.6B (2025), yet Sacra's 2025
              revenue estimate of $361M implies significantly lower revenue per dollar originated versus the $500M
              figure reported for 2024. This compression — if the data is accurate — suggests declining origination fee
