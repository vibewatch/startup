      - number: '7.2'
        title: >-
          ABS credit deterioration is accelerating — KBRA downgraded 11 classes in May 2025 and some bonds have stopped
          paying interest
        blocks:
          - type: paragraph
            body: >-
              GoodLeap's business model is asset-light by design: it originates solar and home efficiency loans and
              sells them into ABS structures, generating origination fees, servicing fees, and securitization premiums.
              The model requires continuous access to ABS markets. That access is now under pressure from two
              directions: rising defaults on the underlying loan pools, and structural ABS mechanics that amplify credit
              losses when prepayments are low.

              In August 2024, Fitch affirmed ratings on 15 classes across five GoodLeap Solar ABS transactions but
              revised the Outlook on classes B and C of the 2023-2 trust to Negative from Stable. Fitch cited
              lower-than-expected prepayment rates (driven by elevated mortgage rates suppressing housing turnover),
              negative excess spread in some tranches (cost of funds of 2.04%–4.67% against loan yields producing annual
              excess spreads from -1.33% to 0.36%), and a cumulative default rate environment broadly in line with
              expectations but with subordinate tranches losing credit enhancement headroom. Fitch's base-case recovery
              assumption was 25%, with a 48-month recovery lag — reflecting the practical difficulty of repossessing and
              reselling rooftop solar panels.

              In May 2025, KBRA went further: it affirmed 42 classes but downgraded 11 classes of notes across 18
              GoodLeap securitizations, citing ongoing credit performance deterioration using data as of the March 2025
              distribution date. The downgrades cover trusts spanning the 2019 Mill City vintage through the 2023-3
              GoodLeap Sustainable Home Solutions Trust.

              By July 2025, the Wall Street Journal reported — and Sacra confirmed — that some GoodLeap ABS bonds had
              stopped paying interest entirely after trigger events from higher-than-expected defaults, with some bonds
              trading as low as $0.42 on the dollar. Sacra estimates 2025 litigation costs forced a $35M downward
              revision to GoodLeap's EBITDA forecast. The SFA Research Corner (August 2024) documented that GoodLeap's
              annualized net loss rate in the KBRA Solar ABS Index was up 31 basis points year-to-date through June
              2024, while 30-59 day delinquency was up 12 bp and 60-120 day delinquency up 15 bp, and the constant
              prepayment rate had collapsed from a 5-year peak of 20.50% (April 2021) to 6.99% — roughly one-third of
              peak — reducing the principal-paydown speed that ABS structures rely on to outrun credit losses. A
              structural amplifier is the ITC re-amortization mechanic: GoodLeap loans are priced assuming the borrower
              will prepay ~30% of principal (the presumed tax credit) at 18 months; when borrowers do not (or cannot)
              prepay — due to tax-liability mismatches, ITC phase-out, or financial stress — the loan re-amortizes at a
              higher payment, triggering delinquency and amplifying subordinate-tranche credit losses.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
