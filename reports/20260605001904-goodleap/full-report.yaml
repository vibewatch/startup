  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: track / research-more; the 2021 $12B mark is not investable without a reset'
        blocks:
          - type: paragraph
            body: >-
              GoodLeap remains an important scaled platform, but valuation discipline dominates the final
              recommendation. The company last disclosed a $12 billion valuation in the 2021 Series D; fetched public
              sources do not establish a newer equity mark that clears the intervening reset in rates, residential solar
              demand, ABS performance, and litigation risk. On the most valuation-relevant public revenue estimate, that
              historical mark implies roughly 33x 2025 revenue; even using the higher IncFact revenue floor it remains
              at least 24x. That is not an entry price supported by a company whose funding engine depends on
              securitization access and whose core dealer-fee model is under active legal and regulatory attack. The
              appropriate IC action is track / research-more: monitor capital-market access and litigation outcomes,
              request private financials, and engage only if price and structure reflect stressed-finance risk rather
              than 2021 growth-fintech conditions.
            claimRefs:
