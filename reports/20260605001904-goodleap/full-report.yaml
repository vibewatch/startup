            title: Deep Contractor Network Is a Hard-to-Replicate Moat
            body: >-
              GoodLeap's 18,000+ active contractor partners represent years of relationship-building, compliance
              onboarding, and technology integration. The GoodLeap Pros mobile app—enabling instant credit decisions at
              the homeowner's door—creates a switching-cost flywheel: installers who train their sales teams on
              GoodLeap's workflow resist replatforming to a competitor. The June 2025 launch of GoodLeap Payments
              deepens this lock-in by extending from financing to full payment-operations tooling for contractors.
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
