  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product surface: financing plus contractor operating software'
        blocks:
          - type: paragraph
            body: >-
              GoodLeap’s product surface is broader than a single solar-loan checkout. The public evidence points to a
              two-sided platform: homeowners use GoodLeap financing, account-management and monitoring surfaces, while
              contractors use GoodLeap Pros, partner integrations and GoodLeap Payments to sell, underwrite, contract
              and collect. The core financing set includes solar and home-improvement loans, leases and PPAs; the
              home-upgrade scope extends across solar panels, batteries, HVAC, heat pumps, roofing and windows. The
