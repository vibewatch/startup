  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure is live, multi-jurisdictional, and structurally embedded in the business model
        blocks:
          - type: paragraph
            body: >-
              GoodLeap operates at the intersection of consumer lending, point-of-sale fintech, and residential
              construction — a three-sided surface with distinct regulatory risk on each side. The Minnesota Attorney
              General's March 2024 lawsuit, now remanded to Hennepin County District Court after a January 2025 U.S.
              Supreme Court ruling, charges GoodLeap with violations of the Prevention of Consumer Fraud Act, the
              Uniform Deceptive Trade Practices Act, the False Statement in Advertising Act, and Deceptive Lending under
              Minnesota Statute Chapter 56. The core theory is that GoodLeap concealed "dealer fees" averaging 19.32% of
              loan principal ($7,552 per loan on average) within the financed price while advertising low APRs, denying
              consumers the ability to evaluate the true cost of credit. Over 853 Minnesota consumers and at least $6.44
              million in fees are at issue in Minnesota alone; the same fee structure applies nationally.

              Separately, Kneupper and Covey won an arbitration before a former Chief Justice of the Georgia Supreme
              Court, holding GoodLeap liable for the acts of solar installer Pink Energy under an agency theory —
              resulting in full cancellation of a $90,000 loan and attorney's fee payment. The arbitrator found that
              GoodLeap's Solar Financing Agreement with Pink Energy gave GoodLeap control over Pink Energy's customer
              interactions, including warranty support timeframes, required manufacturer warranties, and a broad
              termination right, and that GoodLeap paid kickbacks to Pink Energy for financing referrals. That agency
              finding has collateral estoppel implications across the large installer network.

              At the federal level, in August 2024 the Treasury Department, CFPB, and FTC announced a joint enforcement
              partnership specifically targeting unfair and deceptive acts in residential solar financing, naming
              GoodLeap's sector as a priority. The CFPB's Issue Spotlight on solar financing (2024) documents: hidden
              dealer-fee markups inflating loan principals by 30%+; misleading ITC marketing that treats the 30% credit
              as a guarantee; misrepresentations around voluntary prepayments (the re-amortization mechanic); and
              misleading statements about financial benefits. The Center for Responsible Lending, which analyzed
              GoodLeap specifically, compared these practices to pre-2008 subprime mortgage tactics. GoodLeap has
              received 162 named CFPB consumer complaints as of the TIME investigative report. GoodLeap's stated
              position — that its disclosures comply with TILA and state law — is now the core legal dispute before
              Hennepin County.

              Consumer attorneys report 1,076 BBB complaints filed against GoodLeap in the preceding three years and 443
              complaints closed in the prior 12 months, with recurring patterns around order problems (346),
              service/repair issues (297), and billing disputes (229). The Prevost Law Firm, focused exclusively on
              solar loan disputes, describes GoodLeap's arbitration clause as a material enforcement shield but notes
              that individual arbitrations — where GoodLeap has already lost — are resulting in full loan cancellations,
              attorney's fee orders, and precedent that may compound across the installer base.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
