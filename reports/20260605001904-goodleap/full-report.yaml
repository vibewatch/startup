      - number: '3.4'
        title: Switching costs, lock-in, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              GoodLeap's structural competitive advantages are real but conditional. The contractor channel network of
              18,000+ active sales professionals constitutes a distribution moat: each integrated contractor represents
              a trained user of the GoodLeap POS app, with payment-flow relationships and onboarding that create
              switching friction. The scale of securitization relationships—with Goldman Sachs, Bank of America, ATLAS
              SP, CIBC, and Citigroup as bookrunners on recent transactions—provides capital-market access that smaller
              or newer entrants cannot replicate quickly. The platform's speed (instant soft-credit decisions, next-day
              funding) and coverage (solar, storage, HVAC, roofing, windows) sustain value for installers across a wider
              project set than pure solar lenders.


              The weakness is that the core POS solar lending category is low-friction to multi-home. Installers
              typically maintain relationships with multiple lenders simultaneously, routing customers based on rate,
              term, and credit profile. EnergySage's 2023 survey showed no single lender exceeding 12% of financing
              quotes in the marketplace context—evidence that GoodLeap's ~28% solar loan market share is attributable to
              volume scale and installer breadth, not exclusive control. Mosaic and Sunlight historically held
              comparable installer networks before their distress events; the bankruptcy of both is partly what cleared
              the market for GoodLeap to consolidate share.


              ABS credit deterioration is the sharpest near-term moat risk. If KBRA and Fitch downgrades signal
              structural collateral problems rather than cyclical stress, GoodLeap's capital markets access (the
              backbone of its asset-light model) could become more expensive or constrained. The dealer fee litigation
              adds an earnings risk on top of the credit risk. Both risks are visible to institutional investors
              already: GoodLeap bonds trading at $0.42 on the dollar signal market-wide concern about solar loan
              collateral performance that extends across peers. Sunrun, as the dominant TPO incumbent without loan-book
              credit exposure, is structurally insulated from this vector—a material competitive asymmetry that favors
              TPO models in the 2026 environment.
