      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Loan market structural contraction threatens GoodLeap's core business
            body: >-
              The US residential solar loan market—GoodLeap's primary product—contracted from 70% to 43% of residential
              solar financing contracts between 2022 and 2025. The full-year impact of Section 25D expiry will further
              shrink loan market volume in 2026 (SEIA/Wood Mackenzie forecast: -18% residential installations).
              GoodLeap's pivot to TPO and adjacent categories is strategically rational but execution in non-solar
              categories remains unproven at scale. Competitor Mosaic's operational pause and Sunlight Financial's
              bankruptcy restructuring signal that capital-markets access for solar loan platforms is fragile, not
              durable.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM016
              - CM019
              - CM031
              - CM032
          - type: callout
            title: Battery storage and VPP create a differentiated market layer beyond solar
            body: >-
              Battery attachment rates reached 25% nationally in 2025, and GoodLeap's GoodGrid VPP enrolled 165,000
              California homeowners as of that year. This grid-services layer—where financed residential batteries
              become dispatchable grid assets—creates a data moat and recurring revenue opportunity that pure solar
              lenders cannot replicate. It also positions GoodLeap to benefit from VPP payment streams that regulators
              and utilities are beginning to formalize, potentially replacing some of the homeowner economic benefit
              lost to Section 25D expiry.
            calloutType: insight
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM042
          - type: callout
            title: CFPB scrutiny of dealer fees and POS solar lending poses material regulatory risk
            body: >-
              The CFPB's 2024 Issue Spotlight on solar financing directly described the dealer-fee markup model used by
              fintech point-of-sale lenders, finding that loan principals are regularly inflated 30% or more above the
              cash price without clear disclosure. GoodLeap's contractor-mediated, door-to-door origination channel
              places it squarely in scope. The Center for Responsible Lending named GoodLeap alongside Sunlight, Mosaic,
              Sunrun, and Sunnova as together accounting for 80% of the residential solar market. While no formal
              enforcement action against GoodLeap has been identified, the regulatory environment for its core
              origination model is materially more adverse than it was before 2024.
            calloutType: risk
            claimRefs:
              - CM039
              - CM040
              - CM041
              - CM043
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitor landscape: fintech peers, bank-owned platforms, TPO incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              GoodLeap competes in a market that bifurcates sharply by product type. In solar-specific point-of-sale
              loans, GoodLeap remains the category leader, but the direct peer set has been dramatically thinned by
              bankruptcy. Mosaic Sustainable Finance—the second-largest solar loan originator, with $15 billion in
              cumulative originations—filed for Chapter 11 on June 6, 2025 and subsequently shut down all new loan
              origination; its servicing portfolio was transferred to Solar Servicing LLC, a subsidiary of secured
              creditor Forbright Bank. Sunlight Financial filed for Chapter 11 in October 2023, emerged in December 2023
              under a private consortium led by Greenbacker Capital Management, Sunstone Credit, IGS Ventures, and Cross
              River Bank, and is attempting to rebuild installer relationships with lower dealer fees and faster
              approvals. Dividend Finance, the third major fintech peer, was acquired by Fifth Third Bank in May 2022
              and now operates as a bank subsidiary focused on prime and super-prime borrowers across solar and home
              improvement verticals.


              Alongside fintech peers, the competitive map includes bank-owned POS lenders—GreenSky (now Goldman Sachs
              subsidiary) and Regions/EnerBank (now "Regions Home Improvement Financing")—which compete with GoodLeap's
              expanding home improvement vertical rather than its solar core. TPO solar providers led by Sunrun present
              a structural competitive challenge: as the 25D residential solar tax credit expired at end-2025 under the
              One Big Beautiful Bill, lease and PPA structures that let the system owner claim the commercial 48E credit
              gained structural advantage over loan-funded owner-occupied solar. Sunrun reported 94% of its new customer
              additions on TPO/subscriber models as of August 2025. GoodLeap is itself moving into TPO via a $1.5
              billion lease/PPA program with Tactical Infrastructure Partners and ATLAS SP, a strategic pivot that
              narrows but does not eliminate its exposure to the loan-to-TPO shift.


              Status-quo substitutes include cash purchase (19% of residential solar in 2023 per CFPB), home equity
              loans and HELOCs, and direct financing from local banks and credit unions. EnergySage's H2 2023 survey
              found no single lender exceeding 12% of financing quotes—a fragmented baseline that helps installers
              multi-home across providers. That multi-homing dynamic is a structural ceiling on lock-in for any single
              lender including GoodLeap.
