      - number: '6.2'
        title: Contractor Channel Adoption
        blocks:
          - type: paragraph
            body: >-
              Contractor adoption is the primary growth engine for GoodLeap. The channel model—where licensed installers
              originate loans on behalf of homeowners using GoodLeap's mobile app—has expanded rapidly since 2018. Sacra
              estimates the contractor network at 18,000+ partners as of 2025, with broader market references citing up
              to 40,000 in the full network including affiliates. The GoodLeap Pros mobile app allows salespeople to
              generate instant loan offers within seconds using soft-credit underwriting, significantly shortening the
              solar sales cycle and improving conversion rates for installers.


              A January 2024 survey commissioned by GoodLeap found that 9 out of 10 contractors reported increased
              profit after joining the platform, attributing gains to fast approvals, high loan approval rates,
              competitive homeowner payment options, and seamless mobile workflows. However, this is a
              company-commissioned metric and carries an independence limitation. Third-party contractor reviews on
              EnergySage (398 reviews) reflect a more mixed picture: homeowners who used GoodLeap through contractors
              report a 3.2/5 installation satisfaction rating, with a subset of reviews describing contractors
              abandoning projects after GoodLeap funded the loan—a structural problem in GoodLeap's model where the
              lender pays the contractor quickly, often before final inspections, creating a moral-hazard gap.


              In June 2025, GoodLeap launched "GoodLeap Payments"—a comprehensive contractor payment solution supporting
              Tap-to-Pay, instant eCheck, remote payment links, recurring service-plan billing, and QuickBooks
              integration. The product specifically addresses a 60+ day payment-cycle gap that strains contractor cash
              flow in a $500 billion home improvement market. At the 2025 ServiceTitan Pantheon conference, GoodLeap
              showcased contractor success stories, with long-tenured contractors crediting GoodLeap for enabling
              business growth, and newer partners citing access to consumer-friendly financing as decisive for winning
              jobs.


              The market is also shifting: as median residential solar loan rates climbed to 7.5% on EnergySage's
              platform in H1 2025, 38% of contractors reported decreased loan demand. GoodLeap is pivoting its
              contractor network toward lease/PPA products, expecting leasing to become the predominant financing
              mechanism for installers in the 2026–2028 period. The company has safe-harbored solar equipment
              (inverters, batteries, panels) through 2030 to support this transition.
