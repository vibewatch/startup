      - number: '4.3'
        title: Unit Economics and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              GoodLeap's unit economics are largely opaque because the company has not publicly disclosed gross margin,
              EBITDA, customer acquisition cost, serviced portfolio balance, or a formal cash position. What is publicly
              known is that GoodLeap was last valued at $12B in October 2021 during its Series D round ($800M raised,
              led by MSD Partners with BDT Capital Partners and Davidson Kempner). Total equity raised is estimated at
              approximately $1.6B across all rounds. A 2024 debt financing round of $428.8M was reported at a $12B
              implied valuation; the nature, terms, and covenants of that facility are not public. The company employs
              approximately 1,200 people as of late 2025.

              From origination data, the average loan in 2025 was estimated at approximately $27,400 with a median APR
              of around 4.9%, though these are third-party figures not confirmed by GoodLeap. Standard loan terms span
              10 to 25 years, with no prepayment penalty and an Autopay rate discount of 0.50%. The origination fee rate
              paid by contractor-dealers is estimated at 5 to 8% of loan face value, implying approximately
              $1,370–$2,190 in origination revenue per average loan. Servicing fee rates follow industry convention
              (0.25–1% per annum on managed balance) but specific rates for GoodLeap's portfolio are not disclosed.
              Revenue is largely fee-based rather than net-interest-margin-based, which reduces credit exposure but
              creates dependency on continued origination volume and ABS market access.

              GoodLeap's management has characterized the company as cash-flow positive, though no audited financials
              support this claim publicly. The 2025 EBITDA forecast was reportedly revised down by $35M due to elevated
              litigation costs, creating a material headwind against an already undisclosed profitability baseline.
              Capital market access appears robust based on continued ABS execution frequency; however, the business
              model creates a structural vulnerability: if ABS spreads widen materially or investor demand contracts —
              as deteriorating vintage credit quality could trigger — GoodLeap would need to retain loans on balance
              sheet or curtail origination volumes, materially impairing its fee-revenue base.
