            title: GoodGrid VPP Is the Key Homeowner Retention Mechanism
            body: >-
              Unlike most lenders, GoodLeap has an ongoing post-origination product in GoodGrid, which enrolls existing
              battery customers into a virtual power plant that pays monthly cash rewards. This converts a one-time loan
