      - number: '6.5'
        title: Retention, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              GoodLeap does not publish homeowner NRR or GRR. Given its originate-and-sell model, the company is not a
              subscription SaaS business; retention manifests as repeat borrowing (a second loan for a different home
              improvement product) and GoodGrid enrollment (ongoing energy-management relationship). The GoodLeap Home
              app includes a marketplace for additional products and a referral program, both designed to extend
              homeowner lifetime value beyond the origination event. App store reviews confirm that some homeowners take
              GoodLeap loans for multiple product categories (first solar, then windows), suggesting moderate repeat-use
              potential, but no quantified repeat-purchase rate is public.


              Expansion levers include: (1) GoodGrid VPP enrollment converting existing solar borrowers into ongoing
              energy-management customers; (2) cross-sell of non-solar products (HVAC, roofing, windows) to the 1.3M+
              homeowner base; (3) lease/PPA pivot enabling new homeowners who would not qualify for or choose a loan;
              and (4) GoodLeap Payments extending the contractor relationship beyond financing into full
              business-banking adjacency. The SWOT analysis published by SwotAnalysis.com (2025-Q4) identifies
              cross-sell to the existing homeowner base as the top expansion opportunity, estimating the addressable
              cross-sell pool as very large given that most financed homes have only one GoodLeap product.


              Concentration risk is significant. GoodLeap derives the overwhelming majority of its loan volume from
              solar financing, and the market is shifting: median residential solar loan rates on EnergySage reached
              7.5% in H1 2025, pushing 38% of contractors toward lease alternatives. California, Texas, and Florida
              likely account for a disproportionate share of originations, creating geographic concentration tied to
              state net-metering policy (California NEM 3.0 is a documented threat). The contractor channel itself is a
              concentration risk: contractor misconduct and abandonment are the primary source of adverse customer
              reviews, yet GoodLeap's model requires rapid contractor payout before inspection to maintain installer
              satisfaction. No single contractor is named as representing more than a small share of volume, but the
              dynamic creates correlated tail risk if a large installer network fails (similar to Meraki Solar
              abandonment cases documented in reviews).
