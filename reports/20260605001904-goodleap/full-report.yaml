companyProfile:
  summary: >-
    GoodLeap is a Roseville, California-based sustainable-home financing and software company with roots in Loanpal and
    a June 2021 GoodLeap rebrand. The platform connects homeowners, contractors, and institutional capital providers:
    homeowners finance solar, storage, HVAC, heat pumps, roofing, windows, and related upgrades; contractors originate
    at point of sale through GoodLeap Pros and partner integrations; and GoodLeap monetizes origination, servicing, and
    securitization economics. Public evidence shows substantial scale, including more than 1.3 million homeowners
    served, 18,000+ active contractor partners, over $32B of financing facilitated, and 24 cumulative securitizations by
    late 2025. The same evidence base also shows a stale $12B 2021 valuation, opaque private financials, ABS downgrades
    and interest-payment stress, and live consumer-finance litigation.
