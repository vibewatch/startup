    data:
      columns:
        - Medium impact
        - High impact
        - Critical impact
      rows:
        - label: High likelihood
          values:
            - Consumer complaint escalation (BBB, CFPB volumes)
            - TILA/dealer-fee disclosure dispute (Minnesota AG active)
            - ITC termination Dec 31, 2025 removing re-amortization prepayment
        - label: Medium likelihood
          values:
            - Contractor fraud incidents (identity, lien)
            - ABS subordinate-tranche CE exhaustion triggering senior-class review
            - California NEM 3.0 / state solar policy further compression
        - label: Low likelihood
          values:
            - Federal CFPB individual enforcement order against GoodLeap
            - Full ABS market closure for solar tranches
            - Agency-liability cascade across 40,000-contractor network simultaneously
    approximationNotes: >-
      Cell placement reflects public evidence and authorial weighting of residual exposure as of June 2026 run date.
      Likelihood is directional, not a probability model.
  - id: FR002
    title: Risk transmission map — how regulatory and policy shocks flow to ABS and revenue
    type: dag
    layout: wide
    summary: >-
      ITC termination and dealer-fee regulatory enforcement transmit through distinct but reinforcing paths to reduce
      ABS performance and GoodLeap fee income.
    data:
      nodes:
        - id: itc-expiry
          label: ITC expires Dec 31, 2025
        - id: demand-decline
          label: Solar origination volume decline
        - id: no-reamo-prepayment
          label: No ITC prepayment at re-amortization (18-month)
        - id: cpr-collapse
          label: CPR collapse (6.99% vs 20.5% peak)
        - id: excess-spread-erosion
          label: Negative excess spread in low-rate tranches
        - id: abs-credit-losses
          label: ABS credit losses exceed CE floor
        - id: rating-downgrades
          label: KBRA/Fitch downgrades (11 classes May 2025)
        - id: abs-window-tightening
          label: ABS market access tightening
        - id: fee-income-decline
          label: Origination and securitization fee income decline
        - id: mn-ag-enforcement
          label: Minnesota AG / TILA enforcement
        - id: fee-disclosure-reform
          label: Dealer-fee disclosure reform required
        - id: model-disruption
          label: Revenue model disruption
        - id: litigation-costs
          label: Legal costs ($35M EBITDA revision)
      edges:
        - from: itc-expiry
          to: demand-decline
        - from: itc-expiry
          to: no-reamo-prepayment
        - from: no-reamo-prepayment
          to: cpr-collapse
        - from: cpr-collapse
          to: excess-spread-erosion
        - from: excess-spread-erosion
          to: abs-credit-losses
        - from: abs-credit-losses
          to: rating-downgrades
        - from: rating-downgrades
          to: abs-window-tightening
        - from: abs-window-tightening
          to: fee-income-decline
        - from: demand-decline
          to: fee-income-decline
        - from: mn-ag-enforcement
          to: fee-disclosure-reform
        - from: fee-disclosure-reform
          to: model-disruption
        - from: mn-ag-enforcement
          to: litigation-costs
        - from: litigation-costs
          to: model-disruption
        - from: abs-window-tightening
          to: model-disruption
  - id: FR003
    title: Dependency map — critical partners and counterparties
    type: dag
    layout: wide
    summary: >-
      GoodLeap's asset-light model creates a hub-and-spoke dependency structure with the ABS capital market, federal ITC
      policy, and the installer channel as the three critical hubs. Failure in any one hub transmits to GoodLeap's
      revenue and balance sheet.
    data:
      nodes:
        - id: goodleap
          label: GoodLeap (platform hub)
        - id: installers
          label: 40,000+ installer partners
        - id: homeowners
          label: Homeowners (borrowers)
        - id: abs-investors
          label: ABS institutional investors
        - id: rating-agencies
          label: Rating agencies (KBRA, Fitch)
        - id: federal-itc
          label: Federal ITC / OBBBA policy
        - id: cfpb-ftc
          label: CFPB / FTC / Treasury
        - id: mn-ag
          label: Minnesota AG
        - id: banks
          label: Bookrunner banks (Goldman, Citi, BofA)
        - id: vpp-partners
          label: VPP partners (Reliant Energy)
      edges:
        - from: installers
          to: goodleap
          label: Origination channel
        - from: homeowners
          to: goodleap
          label: Borrower / loan obligor
        - from: goodleap
          to: abs-investors
          label: Loan sales (forward purchase)
        - from: rating-agencies
          to: abs-investors
          label: ABS ratings gate access
        - from: federal-itc
          to: homeowners
          label: Demand incentive / prepayment mechanic
        - from: cfpb-ftc
          to: goodleap
          label: Enforcement partnership pressure
        - from: mn-ag
          to: goodleap
          label: Active consumer-fraud litigation
        - from: banks
          to: goodleap
          label: ABS structuring and distribution
        - from: goodleap
          to: vpp-partners
          label: Battery management / VPP revenue
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Public scale and ABS access are outweighed by stale valuation, credit stress, and legal overhang at the old mark.
    data:
      nodes:
        - id: scale
          label: Scale and continuing ABS issuance
        - id: stress
          label: ABS downgrades and sector bankruptcies
        - id: legal
          label: Dealer-fee litigation and CFPB scrutiny
        - id: mark
          label: $12B 2021 private mark
        - id: decision
          label: Track / research-more; require reset
      edges:
        - from: scale
          to: decision
          label: preserves option value
        - from: stress
          to: decision
          label: raises discount rate
        - from: legal
          to: decision
          label: caps confidence
        - from: mark
          to: decision
          label: too expensive without proof
    approximationNotes: Qualitative decision chain, not a numerical model.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV042
  - id: FV002
    title: Valuation sensitivity to revenue basis
    type: bar
    layout: standard
    summary: The stale $12B mark implies a very high revenue multiple under both public revenue conventions.
    data:
      items:
        - label: Sacra revenue basis
          value: 33
        - label: IncFact floor basis
          value: 24
        - label: Base-case low
          value: 4
        - label: Base-case high
          value: 8
    approximationNotes: Multiples rounded from $12B divided by third-party revenue estimates and base-case scenario ranges.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV033
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Scenario range sits far below the historical $12B mark unless bull assumptions are privately proven.
    data:
      items:
        - label: Bear EV
          low: 0.5
          high: 1.5
        - label: Base EV
          low: 1.5
          high: 3
        - label: Bull EV
          low: 4
          high: 6
        - label: 2021 mark
          low: 12
          high: 12
    approximationNotes: Enterprise value ranges shown in USD billions; the 2021 mark is included as a benchmark, not a current estimate.
    claimRefs:
      - CV001
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: GoodLeap scores high on scale but low on valuation support and disclosure quality.
    data:
      items:
        - label: Market scale
          value: 8
        - label: Capital access
          value: 6
        - label: Economics visibility
          value: 3
        - label: Credit risk
          value: 3
        - label: Legal risk
          value: 2
        - label: Valuation support
          value: 2
        - label: Diligence readiness
          value: 4
    approximationNotes: Scores are 1-10 qualitative IC grades from public evidence, not company-reported KPIs.
    claimRefs:
