              Named reference proofs for the contractor segment include the 2025 ServiceTitan Pantheon event, where
              GoodLeap presented contractor success stories with long-tenured partners describing business growth
              attributable to GoodLeap financing tools. GoodLeap's blog post for Pantheon 2025 is a company-authored
