      - number: '7.3'
        title: >-
          The OBBBA accelerates ITC sunset to December 31, 2025, removing the single largest demand driver and
          amplifying loan-performance stress
        blocks:
          - type: paragraph
            body: >-
              GoodLeap's business was built on the 30% federal Investment Tax Credit (ITC) under the Inflation Reduction
              Act of 2022, which — prior to the OBBBA — was scheduled to run at 30% through 2032. The One Big Beautiful
              Bill Act, signed July 4, 2025, terminates the residential solar ITC at December 31, 2025 and introduces
              strict new construction-start requirements (physical work of significant nature by July 4, 2026) for any
              remaining commercial/utility credit eligibility. IRS Notice 2025-42 eliminates the 5% safe-harbor pathway
              for most wind and solar projects, replacing it with a physical-work test. Foreign entity of concern (PFE)
              rules now further restrict credit access for projects with supply-chain exposure to China, Russia, North
              Korea, or Iran — directly relevant for solar panel supply chains.

              For GoodLeap, the ITC is not just a marketing feature — it is the mechanical basis for loan
              re-amortization. GoodLeap loans are typically structured with an 18-month window during which the borrower
              is expected to apply a ~30% ITC prepayment against the loan principal. When the ITC disappears for new
              installations after December 31, 2025, new borrowers will have no tax credit to apply, the re-amortization
              mechanics become economically opaque, and the loan-origination pitch loses its core cost-reduction
              argument. Wood Mackenzie, cited in the Minnesota AG filing, forecast that the loan segment — which peaked
              at nearly 70% market share in 2022 — had already fallen 6% in 2023 and was expected to decline further
              through 2024, with recovery not expected until 2027.

              Separately, California's NEM 3.0 policy (implemented April 2023) sharply reduced net metering compensation
              for new solar installations, removing a key bill-savings argument in GoodLeap's largest state market. The
              combination of ITC expiration, NEM 3.0, and elevated interest rates means that the consumer-facing
              economics of a GoodLeap loan — already contested by the Minnesota AG as requiring fee opacity to make the
              math work — are materially weaker for new originations in 2026. Sacra notes that GoodLeap's 2025 revenue
              declined slightly from 2024, and GoodLeap's own blog acknowledges that key home energy tax credits are
              ending in 2025.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
          - type: figure
            figureRef: FR002
            claimRefs: []
      - number: '7.4'
        title: >-
          A 40,000-contractor network is the business moat and the liability engine; installer misconduct binds back to
          GoodLeap under adjudicated agency theory
        blocks:
          - type: paragraph
            body: >-
              GoodLeap's primary distribution is through a network of approximately 40,000 contractor and installer
              partners who use the GoodLeap Pro mobile app to offer instant financing at point of sale. This network is
              the core competitive moat — enabling same-day loan approvals and near-nationwide coverage — but it also
              creates concentrated liability exposure under the agency theory the Georgia arbitrator applied to the Pink
              Energy relationship.

              The TIME investigation (archived November 2025) documented a synthetic-identity fraud scheme in New
              Orleans in which a contractor (Deep South Renovations) used false Social Security numbers and real
              property addresses to obtain GoodLeap and Dividend loans on behalf of homeowners who never consented.
              GoodLeap's model pays contractors directly rather than homeowners, and the TIME investigation found that
              GoodLeap did not run a title search to confirm that the Social Security number on the loan application
              matched the property owner's record. GoodLeap's stated fraud rate is less than 0.05% of transactions, but
              the systemic issue is structural: the door-to-door sales process with iPad-based instant approval and
              next-business-day funding is architecturally optimized for speed, not identity verification, and
              sophisticated fraud schemes exploit that tradeoff.

              Concentration risk is significant in two dimensions. First, residential solar represents the dominant
              revenue source — GoodLeap is the #1 U.S. solar loan originator with ~28% market share. The CRL analysis
              that prompted the Treasury/CFPB/FTC enforcement partnership noted GoodLeap was one of five companies
              collectively accounting for approximately 80% of the residential solar financing market. When the market
              declines (as it has since 2022), GoodLeap's origination volume and fee income decline proportionally.
              Second, GoodLeap's ABS investor base is a concentrated pool of asset managers, banks, and insurance
              companies who fund its asset-light model; if credit performance continues to deteriorate, the cost of ABS
              capital will rise and new-deal execution will become harder, creating a liquidity tightening that squeezes
              the originate-to-sell engine at the same time regulatory costs are increasing.

              Competitors including Solar Mosaic, Sunnova, and Sunlight Financial have faced their own credit and
              regulatory stress; Sunlight Financial filed for Chapter 11 in October 2023 and emerged in December 2025.
              The competitive restructuring may temporarily reduce funding availability to the broader sector, but it
              also signals systemic fragility in the solar ABS market that rating agencies and institutional investors
              are now pricing into terms.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
