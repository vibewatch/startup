      - number: '2.4'
        title: Growth drivers, constraints, and policy headwinds
        blocks:
          - type: paragraph
            body: >-
              Growth drivers for GoodLeap's market operate at both macro and micro levels. Macro drivers include rising
              electricity prices, the aging US housing stock (median age 44 years), a stated $450 billion annual
              sustainable upgrade TAM, persistent consumer demand for resilience products after natural disasters, and
              institutional capital appetite for ESG-aligned asset-backed securities. Micro drivers include the IRA's
              continued credits for heat pumps and battery storage through the Section 48E commercial pathway
              (benefiting TPO) and residual state-level incentives that remain active across many markets. Battery
              attachment rates reached 25% nationally in 2025, opening a meaningful incremental ticket on top of each
              solar installation. GoodLeap's GoodGrid virtual power plant network—with 165,000 California homeowners
              enrolled as of 2025— demonstrates a monetizable data and grid-services layer that could extend the value
              of each financed system. The 87% of millennial homeowners who report at least one pending repair project
              (KPMG survey, July 2025) reflects latent demand that point-of-sale financing can unlock, particularly as
              high mortgage rates keep homeowners from moving. Headwinds are equally material. The expiry of Section 25D
              at December 31, 2025, removes the single largest consumer incentive for owned residential solar and is
              forecast by SEIA and Wood Mackenzie to reduce residential installations by 18% in 2026. Customer
              acquisition costs in residential solar spiked approximately 40% to $0.84 per watt in 2026. The structural
              shift toward TPO products means that GoodLeap's core loan business is competing against a market segment
              (TPO) that is growing faster, benefits from Section 48E tax credits that loan products do not, and is
              dominated by well-capitalized incumbents such as Sunrun and Sunnova. Competitor Mosaic issued a pause on
              operations in May 2025 due to capital-markets uncertainty from 25D and 48E guidance, signalling systemic
              fragility in the loan channel. Sunlight Financial exited Chapter 11 in December 2025. Regulatory headwinds
              from the CFPB's 2024 Issue Spotlight on solar financing—which specifically named point-of-sale fintech
              lenders and dealer-fee practices—create compliance cost and litigation exposure for GoodLeap. PACE
              financing ($2.8 billion in annual originations, active in 40 states) represents an alternative channel for
              some sustainable upgrade spend, particularly at the commercial level, though residential PACE remains
              limited by consumer protection rules in most states. On balance, the medium-term market for sustainable
              home upgrade financing remains large and structurally growing, but 2025 to 2026 is a period of meaningful
              disruption driven by policy changes, channel economics shifts, and competitive fragility that GoodLeap
              must navigate carefully.
