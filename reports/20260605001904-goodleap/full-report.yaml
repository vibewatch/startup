      - number: '4.2'
        title: Securitization Program and ABS Performance
        blocks:
          - type: paragraph
            body: >-
              GoodLeap has established itself as a frequent ABS sponsor with 24 cumulative securitizations through
              December 2025, covering residential solar loans (GoodLeap Sustainable Home Solutions Trust), home
              improvement loans (GoodLeap Home Improvement Solutions Trust), and residential solar leases and power
              purchase agreements via joint vehicles with Tactical Infrastructure Partners. The company has facilitated
              over $32 billion in sustainable home financing since 2018, serving more than 1.3 million homeowners.

              In 2025, GoodLeap closed seven ABS transactions totaling approximately $1.23B: three home improvement loan
              securitizations collectively amounting to $909M (GDLP 2025-1 at $349.7M, GDLP 2025-2 at $354.8M, and GDLP
              2025-3 at $522.9M), and two TIP Solar ABS deals ($183.3M and $140.2M) backed by leases and PPAs originated
              on the GoodLeap platform. Bank of America served as sponsor on the largest deal; Goldman Sachs, Citigroup,
              and CIBC acted as joint bookrunners, signaling continued bulge-bracket capital markets access. ATLAS SP
              Partners was sole structuring agent for the Tactical Infrastructure Partners solar ABS vehicles.

              Approximately 23 to 30% of the home improvement loan collateral pools carry promotional periods during
              which borrowers make reduced initial payments before loan re-amortization. This structural feature creates
              payment-shock risk at re-amortization and, as Fitch's June 2025 analysis showed, has been a primary driver
              of below-expectation prepayment rates that extend note lives and amplify the impact of negative excess
              spread on subordinate classes.

              KBRA's May 2025 review of 18 GoodLeap trusts affirmed 42 classes but downgraded 11, citing ongoing credit
              performance deterioration; interest payments had been received on time as of the March 2025 distribution
              date. Fitch's June 2025 action downgraded the 2023-2 class B notes to Bsf (from BBBsf) and class C to B-sf
              (from BBsf), and the 2023-3 class B notes to BBsf (from BBBsf) and class C notes to CCCsf (from BB-sf),
              driven by lower-than-projected prepayments, rising defaults, and sustained negative excess spread. Fitch
              raised its base-case cumulative lifetime default assumption for GoodLeap 2024-1 to 12.50%. By July 2025,
              some GoodLeap-linked solar ABS bonds had stopped paying interest following trigger events from
              higher-than-expected defaults, with certain bonds trading as low as $0.42 on the dollar. These
              developments represent the most material near-term threat to GoodLeap's funding model, since repeat ABS
              access depends on investor confidence in pool credit performance.
