      - number: '4.4'
        title: Adverse Signals, Litigation, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              GoodLeap faces multiple material adverse financial signals beyond ABS credit stress. The Minnesota
              Attorney General filed suit in March 2024 alleging that GoodLeap and three solar lending peers charged
              approximately $35M in hidden fees on nearly 5,000 Minnesota solar loans, inflating borrower costs by 15 to
              54% above disclosed rates through undisclosed dealer markups that were not included in loan disclosures
              and were not permitted to be identified by installers during the sales process. The lawsuit alleges
              violations of Minnesota consumer fraud statutes, the Uniform Deceptive Trade Practices Act, and the Truth
              in Lending Act. As of 2026, the case is active in Minnesota state court following federal remand. GoodLeap
              states its disclosures comply with all applicable lending laws.

              A separate arbitration in Georgia, won by Kneupper & Covey in 2024, held GoodLeap liable under an agency
              theory for the actions of solar installer Pink Energy — resulting in cancellation of a $90,000 solar loan
              and payment of the borrower's attorney fees. The Consumer Financial Protection Bureau had received 162
              complaints naming GoodLeap as of TIME's 2024 investigation, alongside documented fraud incidents in New
              Orleans where contractors took out loans on homeowners' properties without their knowledge using fake
              identity information. GoodLeap states it has experienced fewer than 0.05% fraudulent transactions and
              cooperated with FBI investigations.

              The combination of credit quality deterioration in older ABS vintages, a $35M EBITDA headwind from 2025
              litigation costs, regulatory exposure, and undisclosed core profitability metrics constitutes a
              significant diligence blocker set. Without access to audited financials, a serviced-portfolio report, and
              a vintage loss schedule, an investor cannot underwrite GoodLeap's financial health with high confidence.
              The public financial gaps table below catalogs the specific missing data and diligence paths.
