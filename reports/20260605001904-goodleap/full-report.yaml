              GoodLeap has completed 24 cumulative ABS transactions since 2018, totaling $32B+ in facilitated financing,
              and in 2025 continued accessing the market with Bank of America as sponsor and Goldman Sachs, Citigroup,
              and CIBC as joint bookrunners. The frequency and scale of issuance demonstrate operational maturity in
              structured finance and a diverse set of institutional capital relationships.
