      - number: '6.2'
        title: 承包商渠道采用
        blocks:
          - type: paragraph
            body: >-
              承包商采用是 GoodLeap 的主要增长引擎。渠道模式——持牌安装商用 GoodLeap 移动 App 代表房主发起贷款——自 2018 年以来快速扩张。Sacra 估计，截至 2025 年，承包商网络有
              18,000+ 个伙伴；更广市场口径称，如纳入关联方，完整网络最高可达 40,000。GoodLeap Pros 移动 App
              允许销售人员用软性信用承销在数秒内生成即时贷款报价，显著缩短太阳能销售周期，并提高安装商转化率。


              GoodLeap 委托的 2024 年 1 月调查显示，10 名承包商中有 9
              名表示加入平台后利润增加，原因包括审批快、贷款通过率高、房主付款选项有竞争力，以及移动工作流顺畅。不过，这是公司委托指标，独立性有限。EnergySage 上的第三方承包商评论（398
              条）呈现更混合的图景：通过承包商使用 GoodLeap 的房主给出 3.2/5 的安装满意度评分，其中一部分评论称，GoodLeap 放款后承包商放弃项目——这是 GoodLeap
              模型的结构性问题：贷款人通常在最终验收前就快速向承包商付款，形成道德风险缺口。


              2025 年 6 月，GoodLeap 推出「GoodLeap Payments」——一套综合承包商支付解决方案，支持 Tap-to-Pay、即时 eCheck、远程付款链接、经常性服务计划账单和
              QuickBooks 集成。该产品直指 $500 billion 家装市场中压迫承包商现金流的 60+ 天付款周期缺口。在 2025 年 ServiceTitan Pantheon 大会上，GoodLeap
              展示了承包商成功案例：长期合作承包商称 GoodLeap 推动业务增长，新伙伴则表示，获得对消费者友好的融资工具是赢单关键。


              市场也在转向：2025 年 H1，EnergySage 平台住宅太阳能贷款中位利率升至 7.5%，38% 的承包商报告贷款需求下降。GoodLeap 正把承包商网络转向租赁 / PPA 产品，并预期租赁将在
              2026–2028 年成为安装商的主导融资机制。公司已通过安全港安排锁定太阳能设备（逆变器、电池、组件）至 2030 年，以支持这一转型。
