      - number: '8.4'
        title: 可比公司都在提醒谨慎：Sunrun 支持较低倍数；Sunnova 和 Mosaic 定义下行
        blocks:
          - type: paragraph
            body: >-
              可比公司组合不支持支付风险投资溢价。Sunrun
              是最接近的公开参照，因为它结合了客户合约、融资和分布式能源，但它是上市公司、有杠杆且有机构覆盖；其报告收入和市场倍数更适合作为上限校验，而不是直接回答私营公司估值。SolarEdge
              主要作为太阳能渠道情绪标记有用，因为其硬件敞口和重组画像不同于 GoodLeap 的贷款发放经济性。负面同业组更有启发：Sunnova 和 Mosaic 显示，大型太阳能金融平台即使达到规模，也可能进入
              Chapter 11。这些结果并不意味着 GoodLeap 价值为零，但会显著提高所需回报，并降低在没有私有信用和流动性数据时承销高收入倍数的意愿。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV035
              - CV037
      - number: '8.5'
        title: 任何投资决策前的最终尽调要求和价格纪律
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应设计成用来证伪基准情景。第一，要求经审计或收益质量财务，拆分发放、服务、出售收益和软件 / 平台收入，并给出诉讼和信用成本影响后的 EBITDA。第二，要求 ABS
              包，覆盖按批次损失曲线、逾期滚动率、重新摊销结果、提前还款、仓储额度、垫付率和远期购买承诺。第三，要求股权结构表、优先权、409A 和二级价格证据，把名义估值转译成证券层面的回报。第四，对 Minnesota
              及相关消费金融审查的和解和禁令结果建模。没有这些项目，唯一可辩护的公开立场是在较 2021 年估值大幅折价处观察；只有在估值重置、结构化下行保护到位，并证明 2026 年 ABS
              准入是持久而非偶发之后，买入才可能成立。
            claimRefs:
              - CV032
              - CV037
              - CV038
              - CV039
              - CV040
