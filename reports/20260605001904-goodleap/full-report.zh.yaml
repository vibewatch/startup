      - number: '4.4'
        title: 负面信号、诉讼与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              除 ABS 信用压力外，GoodLeap 还面临多项重大负面财务信号。Minnesota Attorney General 于 2024 年 3 月起诉 GoodLeap 及三家太阳能贷款同行，称它们在近
              5,000 笔 Minnesota 太阳能贷款中收取约 $35M 隐性费用，借未披露的经销商加价把借款人成本推高至披露利率之上 15% 至
              54%；这些加价没有写入贷款披露，销售过程中安装商也不得向客户说明。诉讼指控其违反 Minnesota 消费者欺诈法、Uniform Deceptive Trade Practices Act 和 Truth
              in Lending Act。截至 2026 年，案件经联邦发回后仍在 Minnesota 州法院审理。GoodLeap 称其披露符合所有适用贷款法律。

              Georgia 另一起仲裁由 Kneupper & Covey 于 2024 年胜诉，仲裁员按代理理论认定 GoodLeap 需为太阳能安装商 Pink Energy 的行为负责，结果是取消一笔 $90,000
              太阳能贷款，并支付借款人的律师费。截至 TIME 2024 年调查，Consumer Financial Protection Bureau 已收到 162 起点名 GoodLeap 的投诉；New
              Orleans 也有记录显示，承包商用虚假身份信息在房主不知情的情况下以其房产办理贷款。GoodLeap 称其欺诈交易占比低于 0.05%，并配合 FBI 调查。

              老 ABS 发行批次信用质量恶化、2025 年诉讼成本带来 $35M EBITDA
              逆风、监管敞口、核心盈利指标未披露，这些合在一起构成一组重大尽调阻断项。拿不到经审计财务、服务组合报告和按发行批次列示的损失表，投资人就无法高置信度判断 GoodLeap
              的财务健康。下方公开财务缺口表列出具体缺失数据和尽调路径。
