    columns:
      - 情景
      - 假设
      - 估值区间
      - 概率信号
      - 下行触发项
    rows:
      - - 乐观
        - 发放量有韧性；ABS 利差正常化；法律事项和解且不扰动收费模式
        - $4.0B-$6.0B EV
        - 有可能，但需要私有证据
        - KBRA / Fitch 再次降级或禁令
      - - 基准
        - 仍是活跃发行方，但抽成率更低、融资成本更高，且法律准备金持续
        - $1.5B-$3.0B EV
        - 最符合公开证据
        - 损失曲线恶化，收入收缩
      - - 悲观
        - 法律结果扰动经销商费用；ABS 窗口收紧；板块需求下滑
        - $0.5B-$1.5B EV
        - 同业困境支撑这一下行情景
        - 仓储融资收缩或大范围贷款取消
      - - 接近旧估值不投
        - 价格在没有新证据下锚定 $12B
        - 预期回报为负
        - 高
        - 卖方拒绝重置价格或下行保护
