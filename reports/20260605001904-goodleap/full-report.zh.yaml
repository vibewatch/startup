  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与费用结构
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 通过三类主要收入流变现：贷款成交时由承包商经销商支付的发起费、托管贷款余额上的经常性服务费，以及贷款池打包成
              资产支持证券并出售给机构投资者时获取的证券化溢价。公司不会在短暂仓储窗口之外把贷款留在资产负债表上；它通过远期购买协议
              把发起资产预售给银行、保险公司、资产管理公司和信用社，把经济价值集中在技术和发起，而不是净息差。这种轻资产结构把 GoodLeap 与组合贷款机构区分开，但也造成对批发资本市场持续通道和 ABS
              投资者需求的结构性依赖。

              Sacra 基于 Q1 $83M 和 Q2 $88M 的已披露季度数字，估计 2025 年收入约 $361M。Getlatka 和 IncFact 报告 2024 年收入 超过 $500M；该数字可能反映
              ARR，或采用了不同于 Sacra 2025 年运行率估计的会计口径，差异重大且未解决。2025 年家居能效贷款量 为 $4.6B——较 2024 年 $3.2B 增长
              44%——暗示随着高利率和政策不确定性等行业逆风压缩发起和证券化经济性，单位发起额收入可能下降。 发起费是估计中最大的收入组成（第三方估计约 $280M，约占总额
              78%），服务费和证券化溢价构成其余部分。GoodLeap 尚未公开确认任何 收入流拆分；所有比例数字都是第三方估计，或根据 ABS 文件中可见的贷款量和费用结构推断。

              GoodLeap 的承包商网络——由 18,000+ 个获批安装和家装伙伴组成——是主要发起引擎。承包商使用 GoodLeap Pros 移动应用，在销售点向 房主展示融资选项，贷款决策在 60
              秒内返回。承包商中介模式降低了直接获客成本，但引入合规风险：多个监管和法律行动都记录了安装商 主导销售可能掩盖贷款条款。
