    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 审计财务
        - 按收入流拆分的收入、毛利率、EBITDA 和现金
        - 区分平台质量和出售收益周期性
        - 索取审计报表和 QoE
      - - 信用表现
        - 年份损失、逾期、预付、重新摊还结果
        - 决定 ABS 定价和融资可得性
        - 审查抵押资产明细和服务商报告
      - - 资本市场
        - 仓储额度、预支率、远期购买承诺
        - 检验 2026 年发行是否可持续
        - 访谈融资交易对手，审查融资安排
      - - 法律 / 监管
        - Minnesota 敞口、和解准备金、披露变化敏感性
        - 经销商费用经济性可能受损
        - 律师审查和情景准备金模型
      - - 股权结构表
        - 清算优先权、409A、老股估值
        - 将企业价值转换为证券回报
        - 索取股权结构表和董事会估值材料
      - - 入场结构
        - 优先级、契约、棘轮条款或里程碑
        - 防住不对称下行
        - 投资前谈妥结构化条款
    notes: 这些要求是任何买入建议前的必选项；公开证据不足以支持证券层面的承销。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV044
