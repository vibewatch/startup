  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分与替代方案
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的市场边界，定义上就是可持续住宅升级的融资层：美国房主在销售点通过分期贷款或第三方所有权 （TPO）安排，为太阳能板、电池储能、节能 HVAC 和热泵、屋顶、窗户及节水系统融资。公司自己引用美国
              可持续住宅升级每年 $450B 的市场机会，来源于更广义的 $600B+ 美国家装市场。Harvard Joint Center for Housing Studies 估计 2025 年美国家装与维修总支出为
              $608B，MarketDataForecast 则把同年数字 放在 $549B。仅能源相关改造 2023 年就达到 $139B，接近 2003 年的四倍，驱动来自太阳能采用、保温改造 和 HVAC
              更换。GoodLeap 可服务市场中的纳入支出，包括美国自住房单户和多户住宅在太阳能、储能、HVAC、 屋顶和窗户上的融资升级。排除支出包括现金购买（2023 年占住宅太阳能交易仅 19%）、商业 PACE 融资
              （GoodLeap 不发起的不同信用结构）、租房者可使用的社区太阳能订阅，以及厨房和浴室翻新等 GoodLeap 没有
              产品覆盖的更广家装类别。房主的关键现状替代方案是“不做”，继续使用电网电力，承受不断上涨的公用事业账单 而不升级。次级替代方案包括银行或信用社的房屋净值贷款和信用额度，它们会替代专门的太阳能贷款结构。
              可持续升级市场的结构性逻辑建立在几项因素上：美国住房存量老化（截至 2023 年中位房龄 44 年）、电价 持续通胀、气候韧性动机（保险费 2021 到 2023 年跳升 17%），以及 Inflation
              Reduction Act 消费者和 商业清洁能源抵免带来的监管顺风。IRA 把可融资升级的范围从太阳能扩展到热泵和电池储能，显著拓宽了 GoodLeap 产品面。不过，Section 25D 房主投资税收抵免在
              2025 年到期——即客户自有住宅太阳能 30% 联邦抵免——会直接压低核心市场近期增长率，并把融资组合推向 TPO 结构，因为该抵免仍可由系统所有者而非房主申领。
