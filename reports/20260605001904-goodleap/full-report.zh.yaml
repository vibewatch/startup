      - number: '6.4'
        title: 部署用例和具名客户证明
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的主要房主用例横跨五个产品垂直。纯太阳能融资仍占主导，是自 2018 年以来累计超过 $30 billion 平台融资中的最大部分。太阳能加电池储能增长最快，GoodGrid VPP
              推出后，Texas 的电池附加率翻倍。HVAC、热泵和屋顶融资是多元化尝试，目前渗透率较低；节水（抗旱景观和节水电器）仍是早期品类。


              承包商分层的具名参考证明包括 2025 年 ServiceTitan Pantheon 活动，GoodLeap 在会上展示承包商成功案例，长期伙伴称业务增长归因于 GoodLeap 融资工具。GoodLeap
              关于 Pantheon 2025 的博客文章是公司自写来源，没有对具名承包商指标的独立佐证。GoodGrid VPP 项目拥有机构锚定客户：Connecticut Green Bank（州政府伙伴，2025 年
              8 月）、Reliant Energy/NRG（Texas 公用事业合作，$40 / 月客户奖励计划）以及 California 的 DSGS
              项目（六次有记录的电网压力缓解事件）。这些是有公开公告、可验证的第三方部署。


              房主方面，Fortune 2025 年「Change the World」认可称，GoodLeap 已服务 1.3 million+ 房主、避免 20 million 公吨 CO₂、促成 $30 billion
              终身公用事业账单节省，并让 165,000 名 California 房主加入 GoodGrid。这些汇总数字来自 GoodLeap 新闻稿，未经独立验证。EnergySage 列出 GoodLeap Solar
              档案，包含 398 条房主评论和声称的 BBB A+ 评级。基于披露的季度财务数字，Sacra 研究笔记估计 GoodLeap 2025 年家庭能效贷款量为 $4.6 billion，较 2024 年 $3.2
              billion 增长 44%。
