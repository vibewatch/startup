  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：观察 / 继续研究；没有重置前，2021 年 $12B 估值不可投资
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 仍是重要的规模化平台，但估值纪律决定最终建议。公司最后一次披露估值是 2021 年 Series D 的 $12
              billion；已抓取的公开来源无法证明有更新的股权估值，足以消化此后利率、住宅太阳能需求、ABS 表现和诉讼风险的重置。按最具估值相关性的公开收入估计，这一历史估值约等于 2025 年收入的
              33x；即使用更高的 IncFact 收入下限，也至少是 24x。对于一家融资引擎依赖证券化通道、核心经销商费用模型正遭受法律和监管主动攻击的公司，这不是可被支撑的入场价。合适的 IC 动作是观察 /
              继续研究：跟踪资本市场准入和诉讼结果，索取私有财务，并且只有当价格和结构反映压力金融风险、而不是 2021 年成长型金融科技条件时才接触。
            claimRefs:
