  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：fintech 同业、银行所有平台、TPO 既有公司与替代方案
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 所在市场按产品类型急剧分叉。在太阳能专用销售点贷款中，GoodLeap 仍是品类领导者，但直接同业因 破产大幅变少。Mosaic Sustainable Finance
              是第二大太阳能贷款发起方，累计发起 $15B，2025 年 6 月 6 日 申请 Chapter 11，随后停止所有新贷款发起；其服务组合转给了有担保债权人 Forbright Bank 的子公司 Solar
              Servicing LLC。Sunlight Financial 2023 年 10 月申请 Chapter 11，2023 年 12 月在 Greenbacker Capital
              Management、Sunstone Credit、IGS Ventures 和 Cross River Bank 牵头的私人财团下重组退出， 并试图通过更低经销商费用和更快审批重建安装商关系。第三个主要
              fintech 同业 Dividend Finance 于 2022 年 5 月被 Fifth Third Bank 收购，现在作为银行子公司运营，面向太阳能和家装垂直领域的优质及超优质借款人。

              除 fintech 同业外，竞争地图还包括银行所有的 POS 放贷方——GreenSky（现为 Goldman Sachs 子公司）和 Regions/EnerBank（现为 “Regions Home
              Improvement Financing”）——它们与 GoodLeap 扩张中的家装垂直领域 竞争，而不是其太阳能核心。Sunrun 领衔的 TPO 太阳能提供商构成结构性竞争挑战：随着 One Big
              Beautiful Bill 下的 25D 住宅太阳能税收抵免在 2025 年底到期，能让系统所有者申领商业 48E 抵免的租赁和 PPA 结构，相比 贷款资助的自住房太阳能获得结构性优势。截至 2025 年 8
              月，Sunrun 报告 94% 新增客户采用 TPO / 订阅模式。 GoodLeap 自身正通过与 Tactical Infrastructure Partners 和 ATLAS SP 的 $1.5B 租赁
              / PPA 项目进入 TPO； 这是战略转向，缩窄但不能消除其对贷款转 TPO 的敞口。

              现状替代方案包括现金购买（按 CFPB，2023 年占住宅太阳能 19%）、房屋净值贷款和 HELOC，以及本地银行和 信用社的直接融资。EnergySage 2023
              年下半年调查发现，没有任何单一放贷方超过融资报价的 12%；这个碎片化 基线帮助安装商在多个提供方之间多归属。多归属动态给包括 GoodLeap 在内的任何单一放贷方的锁定效应设下结构性上限。
