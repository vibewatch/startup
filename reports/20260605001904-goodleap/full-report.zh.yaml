  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律敞口仍在进行、横跨多辖区，并结构性嵌入商业模式
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 位于消费贷款、销售点金融科技和住宅施工的交叉处——三侧接触面各自带来不同监管风险。Minnesota Attorney General 2024 年 3 月提起的诉讼，在 2025 年 1 月
              U.S. Supreme Court 裁定后已发回 Hennepin County District Court，指控 GoodLeap 违反 Prevention of Consumer Fraud
              Act、Uniform Deceptive Trade Practices Act、False Statement in Advertising Act，以及 Minnesota Statute Chapter
              56 下的 Deceptive Lending。核心理论是，GoodLeap 在宣传低 APR 的同时，把平均占贷款本金 19.32%（平均每笔
              $7,552）的「经销商费用」藏进融资价格，使消费者无法评估真实信贷成本。仅 Minnesota 就涉及超过 853 名消费者和至少 $6.44 million 费用；同一费用结构适用于全国。

              另外，Kneupper and Covey 在一名前 Georgia Supreme Court 首席大法官主持的仲裁中胜诉，仲裁按代理理论认定 GoodLeap 对太阳能安装商 Pink Energy
              的行为负责，结果是全额取消一笔 $90,000 贷款并支付律师费。仲裁员认定，GoodLeap 与 Pink Energy 的 Solar Financing Agreement 赋予 GoodLeap 对
              Pink Energy 客户互动的控制权，包括保修支持时限、强制制造商保修和广泛终止权，并且 GoodLeap 向 Pink Energy 支付融资转介回扣。该代理认定会在庞大安装商网络中产生附带禁反言影响。

              联邦层面，2024 年 8 月，Treasury Department、CFPB 和 FTC 宣布建立联合执法合作，专门针对住宅太阳能融资中的不公平和欺骗行为，并把 GoodLeap 所在行业列为重点。CFPB
              关于太阳能融资的 Issue Spotlight（2024 年）记录了：隐藏经销商费用加价把贷款本金推高 30%+；误导性 ITC 营销，把 30%
              抵免当作保证；围绕自愿提前还款（重新摊销机制）的误导陈述；以及关于财务收益的误导表述。Center for Responsible Lending 曾专门分析 GoodLeap，并把这些做法与 2008
              年前的次贷抵押贷款手法相比。截至 TIME 调查报道，GoodLeap 已收到 162 起点名的 CFPB 消费者投诉。GoodLeap 的立场是其披露符合 TILA 和州法；这正是 Hennepin
              County 当前法律争议的核心。

              消费者律师报告称，过去三年针对 GoodLeap 向 BBB 提交的投诉有 1,076 起，之前 12 个月关闭的投诉有 443 起，反复集中在订单问题（346）、服务 /
              维修问题（297）和账单争议（229）。专注于太阳能贷款争议的 Prevost Law Firm 称，GoodLeap 的仲裁条款是重大执法护盾，但也指出，GoodLeap
              已经输掉的个人仲裁正在导致全额贷款取消、律师费命令，并形成可能在安装商基础中叠加的先例。
