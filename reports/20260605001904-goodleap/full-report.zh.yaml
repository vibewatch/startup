      - number: '2.2'
        title: TAM、SAM 与不同方法下的规模测算
        blocks:
          - type: paragraph
            body: >-
              没有单一分析师给出 GoodLeap 可服务市场的权威数字，因此判断需要叠加多种规模测算视角。最宽口径下， GoodLeap 使用美国可持续住宅升级每年 $450B 市场作为
              TAM，依据是整体家装市场以及流向能源、太阳能和 能效产品的支出比例。Harvard JCHS 独立估计 2023 年能源相关家装为 $139B。全球住宅太阳能光伏市场 2024 年估值 $94.2B，预计到
              2034 年以 7.9% 复合年增长率达到 $198.9B（GM Insights）。TechNavio 聚焦美国住宅太阳能的研究估计，2026 至 2030 年美国市场将新增 $13.29B 价值，CAGR 为
              13.2%。根据 SEIA 和 Wood Mackenzie 的 2025 Year in Review 报告，美国住宅太阳能行业 2025 年安装 4,647 MWdc， 较 2024 年下降 2%。SEIA
              和 Wood Mackenzie 进一步预测，随着 Section 25D 到期的全部影响显现， 2026 年住宅安装量将同比下降约 18%。GoodLeap 更窄的
              SAM——住宅太阳能融资市场——按近期系统成本和 融资渗透率水平推算，每年约 $13B 至 $16B（平均系统成本约 $25,000，按 CFPB 数据，2023 年 58% 的 家庭安装由贷款或 TPO
              融资，套用美国每年约 4-5 GWdc 住宅容量）。纯贷款子市场更小：2024-2025 年贷款 占合同 43%（2022 年为 70%），贷款 SAM 每年约 $9B 至
              $12B。更广的可持续住宅升级融资机会——GoodLeap 正通过 HVAC、电池、屋顶和窗户切入——可能对应每年 $130B 至 $140B 的融资支出，不过 GoodLeap 在太阳能
              之外的渗透率仍有限。关键证据缺口仍在：没有独立市场规模研究把多品类可持续住宅贷款市场中的太阳能、HVAC、 电池储能和屋顶拆开。
