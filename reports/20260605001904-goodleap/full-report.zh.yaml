  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 运营一个双边市场，客户分层清晰但相互咬合。借款人一侧，住宅房主是最终消费者：他们为太阳能板、电池储能、节能 HVAC、热泵、屋顶、窗户和节水产品获得销售点融资。截至 2025
              年中，GoodLeap 已服务美国各地超过 1.3 million 名房主。典型借款人是房主——不是租客——希望降低公用事业成本、通过备用电池增加韧性，或实现可持续目标。GoodLeap
              明确瞄准大众市场房主，包括脆弱群体（老人、固定收入和农村家庭）；考虑到已有案例显示承包商渠道促成了老人受害，这也成为监管和声誉风险来源。


              承包商一侧，GoodLeap 的平台客户是持牌太阳能安装商和家装承包商，他们把 GoodLeap 的销售点融资技术嵌入销售流程。到 2025 年中，该网络已增长至 18,000+ 个活跃承包商伙伴，高于早期估计的
              5,000+ 家。平台服务覆盖 50 个州的承包商，California、Texas 和 Sun Belt
              集中度最高。承包商分层从大型全国安装商到小型区域公司和专业工种（HVAC、屋顶、电气）都有。第三类间接分层是机构资金伙伴（银行、资产管理公司、证券化买方），它们购买已发放贷款，但更像金融交易对手，而不是产品客户。


              从地域看，GoodLeap 的房主基础偏向太阳辐照度高、净计量政策友好的州——California、Texas、Florida、Arizona 和美国东南部。GoodGrid 虚拟电厂项目进一步加深了在
              California（DSGS 项目）、Texas（Reliant 合作）和 Connecticut（Green Bank 合作）的渗透，为已经在平台上的电池储能客户创造了交叉销售入口。
