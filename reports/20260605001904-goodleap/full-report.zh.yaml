      - number: '7.3'
        title: OBBBA 将 ITC 日落提前至 2025 年 12 月 31 日，移除最大单一需求驱动，并放大贷款表现压力
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的业务建立在 2022 年 Inflation Reduction Act 下 30% 联邦 Investment Tax Credit（ITC）之上；在 OBBBA 之前，该抵免原计划以
              30% 延续至 2032 年。One Big Beautiful Bill Act 于 2025 年 7 月 4 日签署，将住宅太阳能 ITC 终止日在 2025 年 12 月 31 日，并对任何剩余商业 /
              公用事业抵免资格引入严格的新开工要求（到 2026 年 7 月 4 日前完成具有重大性质的实物工作）。IRS Notice 2025-42 取消大多数风电和太阳能项目的 5%
              安全港路径，改以实物工作测试替代。外国受关注实体（PFE）规则现在进一步限制供应链暴露于 China、Russia、North Korea 或 Iran 的项目获得抵免；这与太阳能板供应链直接相关。

              对 GoodLeap 来说，ITC 不只是营销特征——它是贷款重新摊销的机械基础。GoodLeap 贷款通常设置 18 个月窗口，预期借款人把约 30% ITC 提前还款用于偿还贷款本金。2025 年 12 月
              31 日之后，新安装项目的 ITC 消失，新借款人没有税收抵免可用，重新摊销机制在经济上变得不透明，贷款发放话术也失去核心降本论据。Minnesota AG 文件引用的 Wood Mackenzie
              预测，贷款细分市场在 2022 年曾达到近 70% 市占率峰值，2023 年已经下跌 6%，并预计会在 2024 年继续下滑，直到 2027 年才可能复苏。

              另外，California 的 NEM 3.0 政策（2023 年 4 月实施）大幅降低新太阳能安装的净计量补偿，在 GoodLeap 最大州市场移除了关键账单节省论据。ITC 到期、NEM 3.0
              和高利率叠加，意味着面向消费者的 GoodLeap 贷款经济性——Minnesota AG 已质疑其需要费用不透明才能跑通——对 2026 年新发放贷款明显更弱。Sacra 指出 GoodLeap 2025
              年收入较 2024 年略有下滑，GoodLeap 自己的博客也承认关键家庭能源税收抵免将在 2025 年结束。
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
