      - number: '7.2'
        title: ABS 信用恶化正在加速——KBRA 于 2025 年 5 月下调 11 个类别评级，部分债券已经停止付息
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的商业模式设计上就是轻资产：公司发起太阳能和家庭能效贷款并卖入 ABS 结构，从中获得发放费、服务费和证券化溢价。该模型需要持续进入 ABS
              市场。现在，这一通道受到两方面压力：底层贷款池违约上升，以及当提前还款偏低时会放大信用损失的 ABS 结构机制。

              2024 年 8 月，Fitch 确认五笔 GoodLeap Solar ABS 交易中 15 个类别的评级，但把 2023-2 信托 B 类和 C 类的展望从稳定下调至负面。Fitch
              提到的原因包括：提前还款率低于预期（高抵押贷款利率压制住房周转）、部分分层出现负超额利差（资金成本 2.04%–4.67%，贷款收益对应年化超额利差 -1.33% 至
              0.36%），以及累计违约率环境大体符合预期，但次级分层正在失去信用增级余量。Fitch 的基准回收假设为 25%，回收滞后 48 个月——反映收回并转售屋顶太阳能板在实际操作上的困难。

              2025 年 5 月，KBRA 走得更远：其确认 42 个类别评级，但下调 18 笔 GoodLeap 证券化中 11 个票据类别的评级，理由是截至 2025 年 3 月分配日的数据仍显示信用表现恶化。下调覆盖从
              2019 Mill City 批次到 2023-3 GoodLeap Sustainable Home Solutions Trust 的信托。

              到 2025 年 7 月，Wall Street Journal 报道、Sacra 也确认，一些 GoodLeap ABS 债券因高于预期的违约触发事件而完全停止付息，部分债券最低以每美元 $0.42
              交易。Sacra 估计，2025 年诉讼成本迫使 GoodLeap 将 EBITDA 预测下调 $35M。SFA Research Corner（2024 年 8 月）记录称，截至 2024 年 6
              月，GoodLeap 在 KBRA Solar ABS Index 中的年化净损失率年初至今上升 31 个基点，30–59 天逾期上升 12 bp，60–120 天逾期上升 15 bp，固定提前还款率则从 5
              年峰值 20.50%（2021 年 4 月）跌至 6.99%，约为峰值三分之一，削弱了 ABS 结构用来跑赢信用损失的本金回收速度。结构性放大器是 ITC 重新摊销机制：GoodLeap 贷款定价假设借款人在
              18 个月时会提前偿还约 30% 本金（假定的税收抵免）；一旦借款人因税负不匹配、ITC 退坡或财务压力没有（或不能）提前还款，贷款会按更高月供重新摊销，触发逾期，并放大次级分层信用损失。
