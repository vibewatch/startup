      - number: '7.4'
        title: 40,000 个承包商网络既是商业护城河，也是责任引擎；经裁定的代理理论会把安装商不当行为绑定回 GoodLeap
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的主要分销来自约 40,000 个承包商和安装商伙伴组成的网络，他们使用 GoodLeap Pro 移动 App
              在销售点提供即时融资。该网络是核心竞争护城河——支持当天贷款审批和接近全国覆盖——但按照 Georgia 仲裁员在 Pink Energy 关系中适用的代理理论，它也制造了集中的责任敞口。

              TIME 调查（2025 年 11 月归档）记录了 New Orleans 的一起合成身份欺诈计划：承包商 Deep South Renovations 使用虚假 Social Security
              号码和真实房产地址，代表从未同意的房主取得 GoodLeap 和 Dividend 贷款。GoodLeap 模型直接向承包商付款，而非向房主付款；TIME 调查发现，GoodLeap
              没有进行产权搜索，以确认贷款申请上的 Social Security 号码与房产所有者记录相匹配。GoodLeap 宣称欺诈率低于交易的 0.05%，但系统性问题在于结构：上门销售流程、基于 iPad
              的即时审批和次工作日放款在架构上为速度优化，而不是为身份验证优化，复杂欺诈计划正是利用这一取舍。

              集中度风险有两个维度。第一，住宅太阳能是主导收入来源——GoodLeap 是美国 #1 太阳能贷款发起方，市场份额约 28%。促成 Treasury / CFPB / FTC 执法合作的 CRL
              分析指出，GoodLeap 是五家公司之一，这五家公司合计约占住宅太阳能融资市场的 80%。当市场下滑（自 2022 年以来已经如此），GoodLeap 的放款量和费用收入会同比例下降。第二，GoodLeap 的
              ABS 投资者基础集中在一池资产管理公司、银行和保险公司，它们为其轻资产模型提供资金；如果信用表现继续恶化，ABS 资本成本会上升，新交易执行会更难，在监管成本上升的同时形成流动性收紧，挤压「发起后出售」引擎。

              包括 Solar Mosaic、Sunnova 和 Sunlight Financial 在内的竞争对手也遭遇自身信用和监管压力；Sunlight Financial 于 2023 年 10 月申请
              Chapter 11，并于 2025 年 12 月脱离破产。竞争格局重组可能暂时降低整个行业的资金可得性，但也显示太阳能 ABS 市场存在系统性脆弱性，评级机构和机构投资者现在正把这种脆弱性计入条款。
