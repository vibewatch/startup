      - number: '3.2'
        title: 商业模式对比：发起模式、承保、资金与伙伴渠道
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 运行轻资产、费用驱动的发起模式：它借助伙伴银行牌照发起贷款，通过远期购买协议预售给机构投资者， 并赚取发起费、服务费和证券化溢价。公司不长期把贷款放在资产负债表上。自 2018
              年以来，公司已通过 24+ 笔 ABS 交易把超过 $32B 可持续住宅融资证券化，簿记行包括 Goldman Sachs、Bank of America、ATLAS SP 和 Citigroup。仅 2025
              年的三笔家装证券化合计 $909M。

              Mosaic 倒下前模式结构类似——发起、证券化、赚费用——但 Mosaic 没能扛住利率上升、资本市场压力和 2024 年 安装量下降 31% 的组合。Sunlight Financial
              同样依赖银行伙伴模式（Cross River Bank）和 ABS 执行，但其 资产负债表在利率压力下更脆。Fifth Third 旗下 Dividend Finance 的资金模式不同：Fifth Third
              是发起银行， 使用自有存款基础放贷，理论上降低资金成本并去除 ABS 市场依赖。GreenSky 和 Regions/EnerBank 也使用银行发起的 资产负债表模式，在家装领域与 GoodLeap
              竞争，但不直接参与太阳能贷款发起竞争。

              承包商渠道是主要竞争差异点。18,000+ 销售专业人士接入 GoodLeap 自有 POS 技术平台，支持即时软信用审批、 数字签约和下一工作日放款。该平台在太阳能领域采用最广，GoodLeap 称截至
              2025 年末约占美国全部太阳能贷款 发起量的 28%。Mosaic 和 Sunlight 遭遇困境前，也拥有范围相近的安装商网络；Dividend/Fifth Third 的承包商
              基础更小，但更聚焦信用质量。家装产品上，GoodLeap 与 GreenSky 和 Regions/EnerBank 竞争，二者都已有承包商 技术关系。GoodLeap 已把家装承包商基础扩展至 15,000+
              个 HVAC、管道和一般改造伙伴，服务其识别出的 $450B 全量可持续住宅升级市场。

              一个全行业负面信号横穿所有贷款资助模式：2026 年 3 月，KBRA 下调 GoodLeap ABS 分层中 18 个票据类别评级， 理由是抵押品信用表现持续恶化、超额抵押减少，部分初级类别即将延迟付息。The
              Wall Street Journal 2025 年 7 月报道称，一些 GoodLeap 关联债券已经完全停止付息，交易价格低至每美元 $0.42。Fitch 同样指出，非优质借款人 以及 Texas 和
              Florida 的州别集中，是太阳能 ABS 违约率升高的驱动因素。
