companyProfile:
  summary: >-
    GoodLeap 是一家总部位于 Roseville, California 的可持续住宅融资和软件公司，前身可追溯到 Loanpal，2021 年 6 月更名为
    GoodLeap。平台连接房主、承包商和机构资金提供方：房主为太阳能、 储能、HVAC、热泵、屋顶、窗户及相邻升级融资；承包商通过 GoodLeap Pros 和伙伴集成在销售点发起； GoodLeap
    从贷款发起、服务和证券化中变现。公开证据显示公司已具备相当规模，包括到 2025 年底服务 超过 1.3M 名房主、18,000+ 个活跃承包商伙伴、促成超过 $32B 融资、累计完成 24 单证券化。同一证据 基础也显示：2021
    年 $12B 估值已陈旧，私营财务不透明，ABS 遭降级并承受利息支付压力，消费者金融诉讼仍在推进。
