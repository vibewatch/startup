      - number: '3.4'
        title: 切换成本、锁定效应、多归属与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的结构性竞争优势真实存在，但有条件。18,000+ 活跃销售专业人士组成的承包商渠道网络构成分销护城河： 每个已集成承包商都是 GoodLeap POS
              应用的受训用户，支付流关系和入驻流程带来切换摩擦。证券化关系的规模——近期交易 簿记行包括 Goldman Sachs、Bank of America、ATLAS SP、CIBC 和
              Citigroup——提供了较小或较新进入者难以快速复制的 资本市场通道。平台速度（即时软信用决策、次日放款）和覆盖范围（太阳能、储能、HVAC、屋顶、窗户）让安装商在比纯太阳能 放贷方更宽的项目集上获得价值。

              弱点在于，核心 POS 太阳能贷款品类很容易多归属。安装商通常同时维持多个放贷方关系，根据利率、期限和信用画像路由客户。 EnergySage 2023 年调查显示，在市场平台语境下没有单一放贷方超过融资报价
              12%；这说明 GoodLeap 约 28% 的太阳能贷款 市场份额来自规模和安装商广度，而不是排他控制。Mosaic 和 Sunlight 在困境事件前也曾拥有相近安装商网络；二者破产，也在一定程度上 为
              GoodLeap 清出整合份额的市场空间。

              ABS 信用恶化是最尖锐的近期护城河风险。如果 KBRA 和 Fitch 降级指向结构性抵押品问题，而非周期性压力，GoodLeap 资本市场通道
              ——其轻资产模式的骨干——可能变得更贵或受限。经销商费用诉讼在信用风险之上又增加盈利风险。机构投资者已经看见这两类风险： GoodLeap 债券以每美元 $0.42
              交易，表明市场广泛担心太阳能贷款抵押品表现，并且担忧蔓延到同业。Sunrun 作为主导 TPO 既有公司， 没有贷款账簿信用敞口，在结构上避开这一风险向量；这是有利于 2026 年环境下 TPO
              模式的重大竞争不对称。
