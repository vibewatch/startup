      - number: '2.3'
        title: 买方、付款方与渠道结构
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的买方是美国房主，具体是评估可持续升级、但缺少流动资金一次性现金支付的单户住宅自住业主。 付款方通常也是同一房主，在八到二十五年内偿还分期贷款，名义 APR 大约 1% 至
              7%；若计入经销商费用， 实际利率可能更高。在 TPO 渠道，付款动态会变化：系统所有者（Sunrun、Sunnova 或 GoodLeap 自己的 Tactical Infrastructure
              Partners 载体）为安装融资，房主支付月度租赁费或电力购买协议（PPA）费率。 GoodLeap 的渠道几乎完全由承包商中介完成。GoodLeap Pros 移动应用让承包商在厨房餐桌旁通过软信用查询，
              几秒内向房主提供多个贷款选项，并以数字方式签署合同，在项目里程碑验证后次日放款。2025 年承包商网络 超过 40,000 个，覆盖太阳能、HVAC、屋顶和窗户垂直领域。承包商同时是分销伙伴和合规风险源：CFPB
              2024 Issue Spotlight 指出，使贷款本金膨胀 30% 以上的经销商费用加价，经常发生在承包商—放贷方接口； 在 GoodLeap
              网络常见的上门太阳能销售策略，是关于联邦税收抵免和提前还款预期误导性披露的主要载体。 市场内买方细分反映出明显不同的融资触发点。太阳能优先的房主受账单节省、环境收益和 Section 25D 联邦
              抵免剩余价值（现已到期）驱动。增加储能的买方受备用电力、VPP 收入和韧性驱动。HVAC 和热泵买方通常由 老化系统更换、更高舒适度预期或 IRA 返利触发。屋顶买方响应风暴损害或保险压力。每个细分都有不同
              平均客单价、融资期限和承包商类型，使 GoodLeap 的多垂直雄心在运营上变复杂。GoodLeap 已服务 1.3M+ 房主，按 GoodLeap Home
              应用市场记录，意味着显著二次销售潜力；但非太阳能垂直领域的执行证据仍有限。
