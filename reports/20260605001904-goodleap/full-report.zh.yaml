      - number: '4.2'
        title: 证券化项目与 ABS 表现
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 12 月，GoodLeap 已通过 24 笔累计证券化，成为频繁 ABS 发起人，覆盖住宅太阳能贷款（GoodLeap Sustainable Home Solutions
              Trust）、家装贷款（GoodLeap Home Improvement Solutions Trust），以及通过与 Tactical Infrastructure Partners
              共同载体发起的住宅太阳能租赁和电力购买协议。自 2018 年以来，公司已促成超过 $32B 可持续住宅融资，服务超过 1.3M 名房主。

              2025 年，GoodLeap 完成 7 笔 ABS 交易，总额约 $1.23B：三笔家装贷款证券化合计 $909M（GDLP 2025-1 为 $349.7M、GDLP 2025-2 为
              $354.8M、GDLP 2025-3 为 $522.9M），以及两笔由 GoodLeap 平台发起的租赁和 PPA 支撑的 TIP Solar ABS 交易（$183.3M 和 $140.2M）。Bank of
              America 担任最大交易的发起人；Goldman Sachs、Citigroup 和 CIBC 担任联合簿记行，显示大投行资本市场通道仍在。 ATLAS SP Partners 是 Tactical
              Infrastructure Partners 太阳能 ABS 载体的唯一结构设计代理。

              约 23% 至 30% 的家装贷款抵押品池设有促销期，借款人在贷款重新摊销前先支付较低初始款项。这个结构性特征在重新摊销时带来支付冲击风险； Fitch 2025 年 6
              月分析显示，它也是提前还款率低于预期的主要驱动，延长票据期限并放大负超额利差对次级类别的影响。

              KBRA 2025 年 5 月对 18 个 GoodLeap 信托的审查确认 42 个类别评级，但下调 11 个类别，理由是信用表现持续恶化；截至 2025 年 3 月分配日， 利息支付仍按时收到。Fitch
              2025 年 6 月行动将 2023-2 B 类票据下调至 Bsf（从 BBBsf），C 类下调至 B-sf（从 BBsf），并将 2023-3 B 类 票据下调至 BBsf（从 BBBsf）、C 类票据下调至
              CCCsf（从 BB-sf），驱动因素包括提前还款低于预测、违约上升和持续负超额利差。Fitch 将 GoodLeap 2024-1 基准情景累计终身违约假设上调至 12.50%。到 2025 年 7 月，一些
              GoodLeap 关联太阳能 ABS 债券在高于预期违约触发事件后 停止付息，部分债券交易价格低至每美元 $0.42。这些发展构成 GoodLeap 资金模式最重大的近期威胁，因为重复 ABS
              通道取决于投资者对池子信用表现的信心。
