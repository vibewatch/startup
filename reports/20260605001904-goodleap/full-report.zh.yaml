      - number: '6.3'
        title: 房主满意度和投诉
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的房主满意度呈双峰分布：应用商店环境评分很高，独立平台上的负面评论却持续存在。截至 2025 年，GoodLeap Home iOS App 来自 2,626+ 名用户的评分为
              4.8/5，反映了对快速审批、代表有帮助、线上付款便利的正面体验。相反，Trustpilot 给 GoodLeap 的评分为 2.6/5（“差”），且到 2025
              年负面评论高度集中在掠夺性贷款条款、激进的承包商促成式销售话术、付款处理错误、重复扣款事件和客服失败。


              BBB 过去三年收到 1,076 起针对 GoodLeap 的投诉，最近 12 个月有 443 起，主要集中在订单问题（346）、服务 / 维修问题（297）和账单争议（229）。Texas Attorney
              General's Office 至少收到 70 起投诉，BBB 还在 GoodLeap 页面加入政府行动提醒。GoodLeap 就 2022 年 Minnesota Attorney General
              涉及七家太阳能公司的诉讼以 $65,000 达成和解，未承认不当行为；该案援引联邦 Holder Rule，而 GoodLeap 将该规则写入其贷款协议。


              结构性投诉集中在四个主题：（1）经销商费用在签约时没有清晰披露，却给贷款本金增加 20–35%；（2）只付息结构下，月供最高 60–70% 用于支付利息，促销期尤其如此；（3）GoodLeap
              放款后承包商放弃项目，而 GoodLeap 否认责任；（4）极小剩余余额触发隐藏利息（一个记录在案案例：3 美分剩余余额产生 $593.19 利息）。CBS News Texas 报道过一个案例：一名 80
              岁失智女性签署 $60,000 GoodLeap 贷款，25 年还清将花费 $87,000。


              App 评论证实一个反复出现的设计问题：GoodLeap 的贷款系统主动阻碍提前偿还本金——用户报告称，平台不允许设置经常性额外还款，要求每月到期日前一周手动操作。App 评论中的正面反例描述了窗户和 HVAC
              融资流程顺畅、人工支持响应及时，说明满意度与承包商质量和产品类别高度相关（非太阳能项目似乎产生更少投诉）。
