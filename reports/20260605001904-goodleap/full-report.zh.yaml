      - number: '8.2'
        title: 估值背景：陈旧私募估值对比收入、ABS 和公开市场证据
        blocks:
          - type: paragraph
            body: >-
              最可辩护的方法不是干净的 SaaS 倍数或账面价值练习；GoodLeap 是一家费用驱动的「发起后出售」贷款人，价值取决于放款量、经销商 / 抽成率耐久性、服务经济性、ABS
              执行和法律结果。公开证据支持情景范围，而不是点估值。Sacra 对 2025 年收入的 $361 million 估计提供保守锚点，因为其中包含近期季度背景；IncFact 高于 $500 million
              的估计更像上行收入惯例，而非已确认 GAAP 数字。Sunrun 等公开太阳能金融可比公司因持有大量债务和长期客户合约，用企业价值交易；SolarEdge 则只是渠道相邻。合理基准情景因此应使用压缩后的
              4x–7x 收入区间，而不是最后私募估值隐含的 24x–33x。
