        - label: 美国住宅太阳能承包商总数（可触达）
          value: 10000
          unit: contractors
          note: 行业粗略估计；GoodLeap 面向全国
        - label: GoodLeap 认证承包商伙伴（2025）
          value: 18000
          unit: contractors
          note: Sacra / 新闻稿；包括多州大型安装商
        - label: 通过 GoodLeap 获得融资的房主（累计）
          value: 1300000
          unit: homeowners
          note: GoodLeap 新闻稿；自 2018 年以来累计
        - label: 已激活 GoodGrid VPP 注册的房主（CA）
          value: 165000
          unit: homeowners
          note: 仅限加州；Fortune 2025 Change the World 新闻稿
        - label: 报告贷款需求下降的承包商（2025 年上半年）
          value: 38
          unit: pct of surveyed contractors
          note: EnergySage 2025 年上半年市场报告；指向租赁 / PPA 转向
    approximationNotes: >-
      承包商数量不符合典型漏斗逻辑，因为 GoodLeap 的合作伙伴网络（18,000+）可能超过较小安装商 TAM 估计；大型全国性公司每家都会发起许多贷款。1.3M
      房主数字为累计值，不是活跃用户。数值用于展示相对规模，不是严格的漏斗转化。
    claimRefs:
      - CU007
      - CU027
      - CU012
      - CU013
  - id: FU003
    title: 客户证据质量矩阵
    type: matrix
    layout: standard
    summary: GoodLeap 各类客户证据的证据质量、结果具体度和生产成熟度。
    data:
      columns:
        - 证据质量（高 / 中 / 低）
        - 结果具体度
        - 生产环境 vs. 试点
        - 独立性
      rows:
        - label: Connecticut Green Bank（VPP 合作伙伴）
          values:
            - 高
            - 缓解电网压力；房主每月获得现金奖励
            - 生产环境（2025 年 8 月）
            - 独立（州级实体）
        - label: Reliant Energy / NRG（VPP 合作伙伴）
          values:
            - 高
            - TX 电池附加率翻倍
            - 生产环境（2025）
            - 独立（公用事业公司）
        - label: 加州 DSGS（电网运营方）
          values:
            - 高
            - 记录了 6 次电网压力调度事件
            - 生产环境（2024）
            - 独立（州级项目）
        - label: EnergySage 398 条房主评论
          values:
            - 中
            - 平均 3.2/5；52 起案例提到系统未安装
            - 生产环境（持续）
            - 独立评论平台
        - label: BBB 1,076 起投诉
          values:
            - 高
            - 过去 12 个月 443 起投诉；政府警示
            - 生产环境（持续）
            - 独立（BBB）
        - label: ServiceTitan Pantheon 2025 承包商故事
          values:
            - 低
            - 声称业务增长；没有具名承包商指标
            - 生产环境
            - 公司撰写的博客
        - label: Apple App Store 4.8/5（2,626 个评分）
          values:
            - 中
            - 总体评分高；费用和付款设计的负面长尾仍在
            - 生产环境（持续）
            - 平台中介（自选择）
        - label: GoodLeap：9/10 承包商利润提升
          values:
            - 低
            - 声称利润提升；未披露方法论
            - 生产环境（2024 年 1 月调查）
            - 公司委托
    approximationNotes: 证据质量评级是编辑判断，基于来源独立性、可验证性和具体程度。“高”= 独立方验证且有具体指标；“中”= 大样本评论平台；“低” = 公司来源且独立验证有限。
    claimRefs:
      - CU025
      - CU026
      - CU028
      - CU017
      - CU020
      - CU006
  - id: FU004
    title: 留存与重复使用队列（示意）
    type: cohort
    layout: standard
    summary: 用代理指标估算 GoodLeap 产品生命周期各触点的房主参与留存。NRR/GRR 未公开；数值由分析师根据应用评论和产品结构估算。
    data:
      columns:
        - 第 0 个月（贷款发起）
        - 第 6 个月（活跃还款）
        - 第 12 个月（安装后）
        - 第 2 年（交叉销售窗口）
        - 第 3 年（GoodGrid / 租赁合格）
      rows:
        - label: 房主应用参与度（估计 %）
          values:
            - 100
            - 75
            - 60
            - 40
            - 30
        - label: GoodGrid VPP 注册率（估计 %）
          values:
            - 0
            - 5
            - 15
            - 25
            - 35
        - label: 交叉销售 / 第二产品（估计 %）
          values:
            - 0
            - 2
            - 5
            - 12
            - 18
        - label: 投诉 / 争议提交率（估计 %）
          values:
            - 0
            - 8
            - 12
            - 10
            - 8
    approximationNotes: >-
      所有数值都是分析师估计，来自评论模式、GoodGrid 注册数据（1.3M 房主中 165,000 名 CA 房主 ≈ 13%）以及 Apple App Store 参与信号。GoodLeap
      不披露队列留存数据。本图不应被引用为 GoodLeap 披露指标。
    claimRefs:
      - CU031
      - CU032
      - CU033
  - id: FR001
    title: 风险热力图——按类别划分的残余严重性
    type: matrix
    layout: wide
    summary: 残余严重性聚集在监管 / 法律责任、ABS 信用恶化与 ITC 政策风险重叠处，承包商欺诈是次级放大器。对 GoodLeap 而言，右上象限（高可能性、关键影响）分布密集。
    data:
      columns:
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - 消费者投诉升级（BBB、CFPB 数量）
            - TILA / 经销商费用披露争议（明尼苏达州总检察长已介入）
            - ITC 于 2025 年 12 月 31 日终止，取消重新摊销预付款
        - label: 中等可能性
          values:
            - 承包商欺诈事件（身份、留置权）
            - ABS 次级档 CE 耗尽，触发优先级别审查
            - 加州 NEM 3.0 / 州级太阳能政策进一步挤压
        - label: 低可能性
          values:
            - 联邦 CFPB 对 GoodLeap 作出单独执法令
            - 太阳能分档 ABS 市场完全关闭
            - 代理责任在 40,000 名承包商网络中同步级联
    approximationNotes: 单元格位置反映截至 2026 年 6 月运行日的公开证据和作者对残余暴露的权重判断。可能性为方向性判断，不是概率模型。
  - id: FR002
    title: 风险传导图——监管与政策冲击如何流向 ABS 和收入
    type: dag
    layout: wide
    summary: ITC 终止与经销商费用监管执法沿着不同但相互强化的路径传导，压低 ABS 表现和 GoodLeap 手续费收入。
    data:
      nodes:
        - id: itc-expiry
          label: ITC 于 2025 年 12 月 31 日到期
        - id: demand-decline
          label: 太阳能贷款发起量下降
        - id: no-reamo-prepayment
          label: 重新摊销时无 ITC 预付款（18 个月）
        - id: cpr-collapse
          label: CPR 暴跌（6.99% vs 20.5% 峰值）
        - id: excess-spread-erosion
          label: 低利率分档出现负超额利差
        - id: abs-credit-losses
          label: ABS 信用损失超过 CE 下限
        - id: rating-downgrades
          label: KBRA / Fitch 下调评级（2025 年 5 月 11 个级别）
        - id: abs-window-tightening
          label: ABS 市场准入收紧
        - id: fee-income-decline
          label: 发起与证券化手续费收入下降
        - id: mn-ag-enforcement
          label: 明尼苏达州总检察长 / TILA 执法
        - id: fee-disclosure-reform
          label: 必须改革经销商费用披露
        - id: model-disruption
          label: 收入模型受冲击
        - id: litigation-costs
          label: 法律成本（$35M EBITDA 下修）
      edges:
        - from: itc-expiry
          to: demand-decline
        - from: itc-expiry
          to: no-reamo-prepayment
        - from: no-reamo-prepayment
          to: cpr-collapse
        - from: cpr-collapse
          to: excess-spread-erosion
        - from: excess-spread-erosion
          to: abs-credit-losses
        - from: abs-credit-losses
          to: rating-downgrades
        - from: rating-downgrades
          to: abs-window-tightening
        - from: abs-window-tightening
          to: fee-income-decline
        - from: demand-decline
          to: fee-income-decline
        - from: mn-ag-enforcement
          to: fee-disclosure-reform
        - from: fee-disclosure-reform
          to: model-disruption
        - from: mn-ag-enforcement
          to: litigation-costs
        - from: litigation-costs
          to: model-disruption
        - from: abs-window-tightening
          to: model-disruption
  - id: FR003
    title: 依赖地图——关键合作伙伴与交易对手
    type: dag
    layout: wide
    summary: GoodLeap 的轻资产模式形成辐射式依赖结构，ABS 资本市场、联邦 ITC 政策和安装商渠道是三大关键中枢。任一中枢失灵都会传导到 GoodLeap 的收入和资产负债表。
    data:
      nodes:
        - id: goodleap
          label: GoodLeap（平台中枢）
        - id: installers
          label: 40,000+ 安装商伙伴
        - id: homeowners
          label: 房主（借款人）
        - id: abs-investors
          label: ABS 机构投资者
        - id: rating-agencies
          label: 评级机构（KBRA、Fitch）
        - id: federal-itc
          label: 联邦 ITC / OBBBA 政策
        - id: cfpb-ftc
          label: CFPB / FTC / 美国财政部
        - id: mn-ag
          label: 明尼苏达州总检察长
        - id: banks
          label: 簿记管理银行（Goldman、Citi、BofA）
        - id: vpp-partners
          label: VPP 合作伙伴（Reliant Energy）
      edges:
        - from: installers
          to: goodleap
          label: 发起渠道
        - from: homeowners
          to: goodleap
          label: 借款人 / 贷款债务人
        - from: goodleap
          to: abs-investors
          label: 贷款出售（远期购买）
        - from: rating-agencies
          to: abs-investors
          label: ABS 评级闸门准入
        - from: federal-itc
          to: homeowners
          label: 需求激励 / 预付款机制
        - from: cfpb-ftc
          to: goodleap
          label: 执法协作压力
        - from: mn-ag
          to: goodleap
          label: 进行中的消费者欺诈诉讼
        - from: banks
          to: goodleap
          label: ABS 结构设计与分销
        - from: goodleap
          to: vpp-partners
          label: 电池管理 / VPP 收入
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 旧估值水平下，公开规模和 ABS 准入抵不过陈旧估值、信用压力和法律悬顶。
    data:
      nodes:
        - id: scale
          label: 规模和持续 ABS 发行
        - id: stress
          label: ABS 降级和行业破产
        - id: legal
          label: 经销商费用诉讼与 CFPB 审查
        - id: mark
          label: 2021 年 $12B 私募估值
        - id: decision
          label: 观察 / 继续研究；要求估值重置
      edges:
        - from: scale
          to: decision
          label: 保留期权价值
        - from: stress
          to: decision
          label: 抬高折现率
        - from: legal
          to: decision
          label: 限制信心
        - from: mark
          to: decision
          label: 没有证据支撑就太贵
    approximationNotes: 定性决策链，不是数值模型。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV042
  - id: FV002
    title: 估值对收入口径的敏感性
    type: bar
    layout: standard
    summary: 在两种公开收入口径下，陈旧的 $12B 估值都隐含很高收入倍数。
    data:
      items:
        - label: Sacra 收入口径
          value: 33
        - label: IncFact 底线口径
          value: 24
        - label: 基准情景低端
          value: 4
        - label: 基准情景高端
          value: 8
    approximationNotes: 倍数由 $12B 除以第三方收入估计和基准情景范围后四舍五入。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 除非私下证明乐观假设成立，情景区间远低于历史 $12B 估值。
    data:
      items:
        - label: 悲观 EV
          low: 0.5
          high: 1.5
        - label: 基准 EV
          low: 1.5
          high: 3
        - label: 乐观 EV
          low: 4
          high: 6
        - label: 2021 年估值
          low: 12
          high: 12
    approximationNotes: 企业价值区间以十亿美元计；2021 年估值作为基准列入，不代表当前估计。
    claimRefs:
      - CV001
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: GoodLeap 在规模上得分高，但估值支撑和披露质量得分低。
    data:
      items:
        - label: 市场规模
          value: 8
        - label: 资本市场准入
          value: 6
        - label: 经济性可见度
          value: 3
        - label: 信用风险
          value: 3
        - label: 法律风险
          value: 2
        - label: 估值支撑
          value: 2
        - label: 尽调准备度
          value: 4
    approximationNotes: 评分是基于公开证据的 1-10 分定性 IC 评分，不是公司披露的 KPI。
    claimRefs:
      - CV009
      - CV012
      - CV013
      - CV014
      - CV025
      - CV027
      - CV038
