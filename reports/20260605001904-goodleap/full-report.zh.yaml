      - number: '3.3'
        title: TPO 扩张、品类动态与相邻竞争前沿
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 市场中最重要的结构性竞争变化，是从贷款资助的太阳能所有权转向第三方所有权（TPO）结构。按 CFPB， 2023 年贷款占住宅太阳能合同的 58%，TPO 占 23%；到 2024
              年，贷款份额降至 43%，为 2017 年以来最低， 而 TPO 接近平分市场。2025 年后的加速来自两次政策冲击：25D 住宅太阳能税收抵免在 2025 年底落日，移除了 消费者拥有系统的主要经济理由（30%
              税收抵免）；48E 商业 ITC 仍对 TPO 提供方开放，它们可在把节省传给消费者前 先申领并变现。Jefferies 估计 TPO 2026 年将增长 25%；Wood Mackenzie 预计，即使在
              25D 到期全部影响显现前， TPO 到 2026 年也将达到 41% 市场份额。

              Sunrun 是主导 TPO 玩家，截至 2025 年 8 月，94% 新客户采用订阅 / TPO 模式。Palmetto/LightReach、EnFin 和 Tesla PPA（在部分市场）是次级 TPO
              竞争者。GoodLeap 通过 $1.5B Tactical Infrastructure Partners 项目进入租赁 和 PPA，使其站到 TPO 提供方位置上；但相对 Sunrun 已经较晚，也缺少
              Sunrun 的直接安装商销售队伍和端到端客户服务 基础设施。GoodLeap 的 TPO 优势在于既有承包商网络和技术平台，可以在销售点把房主导向贷款或 TPO 产品。

              在家装垂直领域，GoodLeap 面临 Regions/EnerBank 和 GreenSky 等既有公司竞争。Regions Home Improvement Financing 声称，美国家装支出超过 55%
              以某种形式融资，并拥有全国最大的专业承包商融资网络之一。GreenSky 运行与 GoodLeap 相似的银行合作模式，但聚焦家装和医疗保健，并强调移动优先的快速审批。GoodLeap 向
              HVAC、屋顶、热泵和其他家装品类 扩张，直接进入这些既有公司的地盘。

              经销商费用监管环境进一步放大竞争动态。Minnesota 州总检察长 2024 年 3 月就 $35M 隐藏经销商费用起诉 GoodLeap、Mosaic、 Sunlight 和 Dividend，其中
              GoodLeap 在 Minnesota 的平均费用为贷款本金 19.32%，带来诉讼成本逆风。Sacra 估计， 由于法律成本上升，GoodLeap 2025 年 EBITDA 预测被下修
              $35M。如果禁令成功，行业费用模式会改变，同时压缩支撑放贷方 经济收益和安装商激励的经销商利润。
