    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 资金
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - GoodLeap
        - POS 太阳能贷款金融科技公司（品类领导者）
        - 估值约 $12B（2021 年 Series D）；美国太阳能贷款市场份额约 28%；2018 年以来提供融资 $32B+
        - 通过 18,000+ 太阳能和家装承包商触达房主；优质和近优质借款人
        - 最大承包商网络；自研 POS 技术；家装和 TPO 产品在扩展
        - ABS 信用恶化；经销商费用诉讼；安装商多平台合作削弱锁定效应
      - - Mosaic (Mosaic Sustainable Finance)
        - POS 太阳能贷款金融科技公司（破产）
        - 为 500,000+ 家庭提供 $15B+ 资金；2025 年 6 月 6 日申请 Chapter 11；放款已收尾
        - 不再主动放款；存量服务组合归 Forbright Bank 子公司管理
        - 破产前累计放款规模最大；安装商关系广（历史）
        - 贷款放款永久停止；截至 2026 年对新增放款不再构成竞争压力
      - - Sunlight Financial
        - POS 太阳能贷款金融科技公司（已重组）
        - 2023 年 10 月申请 Chapter 11；2023 年 12 月在 Greenbacker、Sunstone、IGS、Cross River Bank 支持下走出破产
        - 太阳能和家装安装商；按新定价再融资的房主
        - 新资金注入；高票息贷款降价；Sunstone / 前创始人牵头恢复
        - 重组后网络更小；公开财务数据不再可得；规模不确定
      - - Dividend Finance（Fifth Third Bank 旗下）
        - 银行持有的 POS 太阳能和家装贷款机构
        - 被 Fifth Third Bancorp 收购（2022 年 5 月）；资产负债表出资；聚焦优质 / 超优质
        - 优质和超优质房主；全美太阳能和家装承包商
        - 银行资产负债表稳定；不依赖 ABS 市场；NABCEP 认证承包商网络
        - 信用准入范围更窄（排除 GoodLeap 可服务的近优质借款人）；受银行约束
      - - Sunrun
        - TPO 太阳能在位者（主导租赁 / PPA 提供方）
        - 上市公司；截至 2025 年 8 月，新客户中 94% 采用订阅 / TPO 模式
        - 偏好 $0 首付且无需维护的房主；净计量政策强的州
        - TPO 市场领导者；25D 到期后凭 48E 抵免获得结构性优势；端到端服务
        - 不发放太阳能贷款；在贷款资助的太阳能中与 GoodLeap 属不同渠道
      - - Palmetto / LightReach
        - TPO 太阳能提供方（增长中）
        - 面向安装商的 TPO 平台在增长；2025 年被 Aurora Solar 列为头部 TPO 提供方之一
        - 25D 后寻求零首付 TPO 产品的房主和太阳能安装商
        - API 和平台对安装商友好；随 TPO 市场迁移一起增长
        - 规模小于 Sunrun；公开财务信息有限
      - - GreenSky (Goldman Sachs)
        - 家装 POS 贷款机构
        - Goldman Sachs 子公司；运营广泛的家装和医疗承包商网络
        - 家装承包商和房主；授信额度最高 $100,000
        - 授信决策快；产品覆盖广（分期和促销）；商户工具强
        - 不发放太阳能贷款；只在家装垂直与 GoodLeap 竞争
      - - Regions / EnerBank（Regions 家装融资）
        - 区域银行家装贷款机构
        - 已完全并入 Regions Bank；最大专业家装贷款机构之一
        - 家装承包商（HVAC、屋顶、窗户）；项目 $5K+ 的房主
        - 现金等价和低月供产品；24 小时放款；家装支出中 55% 来自融资
        - 太阳能贷款放款不是核心；只在家装扩张中与 GoodLeap 竞争
      - - 现金购买 / 银行或信用合作社直接贷款
        - 现状替代方案
        - CFPB 称 2023 年占住宅太阳能 19%；信用合作社 2024 年在太阳能市场拿份额
        - 有储蓄或房屋净值、对成本敏感的房主；会与内含经销商费用贷款对比的借款人
        - 没有隐藏经销商费用；总成本透明；信用合作社利率可与金融科技贷款机构的 APR 竞争
        - 需要前期资本或既有银行关系；没有即时 POS 审批
    notes: 表内覆盖直接金融科技同业、银行持有的 POS 贷款机构、TPO 太阳能在位者、家装竞争者，以及 2025–2026 年公开证据中可见的现状替代方案。Mosaic 作为历史参照保留；它已不再发放新贷款。
