      - number: '7.5'
        title: 缓释因素真实存在但取决于执行；如果 ABS 通道收紧、监管责任落地，或 ITC 流失把发放量压低至模型以下，投资逻辑就会破裂
        blocks:
          - type: paragraph
            body: >-
              缓释因素存在，而且并不轻。自 2018 年以来，GoodLeap 已完成 24 笔 ABS 证券化，总额超过 $32 billion，说明即使经历信用压力，仍能持续进入资本市场。其家装贷款多元化——2025
              年三笔证券化合计 $909 million，完全由家装贷款支持——会随时间降低太阳能集中风险。Reliant Energy 虚拟电厂合作（目标五年管理 1.5 GW 分布式能源）以及 2025 年扩展至
              15,000+ 个 HVAC 和管道承包商伙伴，都是可信的多元化方向。GoodLeap 自研 AI 承销技术和承包商侧软件在安装商渠道中形成真实切换成本。

              但每个缓释因素都取决于执行、资本可得性，以及监管责任没有进一步落地。轻资产模型对 ABS 市场准入的依赖，是严重度最高的单一结构性风险：如果 KBRA 和 Fitch
              进一步采取评级行动，或机构买方因违约轨迹减少太阳能 ABS 配置，GoodLeap
              无法在自有资产负债表上大规模持有贷款。过去限制集体诉讼敞口的仲裁条款，正被个人仲裁胜诉（全额贷款取消、费用命令）侵蚀；Minnesota AG
              案现在返回州法院，由于是州执法行动而非私人索赔，完全绕开仲裁。TILA 和州消费者保护执法不能被仲裁条款排除。

              投资逻辑最快破裂的组合，是两件事同时发生：（1）Minnesota AG 案出现不利判决或和解，要求广泛费用披露改革或赔偿，扰动全行业经销商费用收入模型；（2）ABS
              表现进一步下台阶，关闭次级分层证券化窗口。单独任何一项，凭公司规模和 $1.8 billion 总股权融资仍可承受。两项同时发生——背景还是 ITC
              到期削弱新发放经济性——会制造融资和收入缺口，多元化管线无法足够快地补上。
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
