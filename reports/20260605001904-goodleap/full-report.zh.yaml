  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 改变判断的条件
    rows:
      - - 投资逻辑：规模化品类幸存者
        - ABS 发行持续，历史融资基础庞大
        - 2026 年发放量和 ABS 利差保持健康
      - - 投资逻辑：分散化期权
        - 家装贷款证券化增加非太阳能抵押资产
        - 收入结构显示太阳能贷款集中度下降
      - - 反向逻辑：私募估值过时
        - 2021 年 $12B 估值隐含 24x-33x 收入倍数
        - 409A 或老股数据证明价格更低但可投资
      - - 反向逻辑：信用压力
        - KBRA 和 Fitch 下调 GoodLeap 相关 ABS 分层评级
        - 年份损失企稳，超额利差改善
      - - 反向逻辑：法律敞口
        - Minnesota 和 CFPB 提出的证据挑战经销商费用经济性
        - 和解边界可控，且没有扰动模式的披露变化
      - - 反向逻辑：板块下行
