      - number: '6.5'
        title: 留存、扩张和集中度风险
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 不披露房主 NRR 或 GRR。鉴于其「发起并出售」模型，公司不是订阅 SaaS；留存表现为重复借款（为不同家装产品办理第二笔贷款）和 GoodGrid
              注册（持续能源管理关系）。GoodLeap Home App 包含额外产品市场和推荐计划，二者都意在把房主生命周期价值延伸到发放事件之后。应用商店评论证实，一些房主会为多个产品类别使用 GoodLeap
              贷款（先太阳能，再窗户），说明存在中等重复使用潜力，但公开数据没有量化重复购买率。


              扩张杠杆包括：（1）GoodGrid VPP 注册，把现有太阳能借款人转为持续能源管理客户；（2）向 1.3M+ 房主基础交叉销售非太阳能产品（HVAC、屋顶、窗户）；（3）租赁 / PPA
              转向，触达无法获得贷款资格或不愿选择贷款的新房主；（4）GoodLeap Payments 把承包商关系从融资延伸到完整商业银行相邻领域。SwotAnalysis.com 发布的 SWOT
              分析（2025-Q4）把向现有房主基础交叉销售列为最大扩张机会，并估计该交叉销售可触达池很大，因为大多数获融资住宅只使用一个 GoodLeap 产品。


              集中度风险显著。GoodLeap 绝大部分贷款量来自太阳能融资，而市场正在转向：EnergySage 上住宅太阳能贷款中位利率在 2025 年 H1 达到 7.5%，推动 38%
              的承包商转向租赁替代方案。California、Texas 和 Florida 可能占发放量的过高份额，形成与州净计量政策绑定的地域集中度（California NEM 3.0
              是已记录威胁）。承包商渠道本身也是集中风险：承包商不当行为和弃单是负面客户评论的主要来源，但 GoodLeap
              模型要求验收前快速向承包商付款，以维持安装商满意度。没有任何单一承包商被点名称占比较小以上的放款量，但如果大型安装商网络失败，这种动态会形成相关尾部风险（类似评论中记录的 Meraki Solar 弃单案例）。
