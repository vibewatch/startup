      - number: '2.4'
        title: 增长驱动、约束与政策逆风
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 所在市场的增长驱动同时来自宏观和微观层面。宏观驱动包括电价上涨、美国住房存量老化（中位房龄 44 年）、公司宣称的 $450B 年度可持续升级
              TAM、自然灾害后消费者对韧性产品的持续需求，以及机构资本对 ESG 对齐资产支持证券的兴趣。微观驱动包括 IRA 通过 Section 48E 商业路径继续支持热泵和电池储能（利好
              TPO），以及许多市场仍有效的州级激励。2025 年全国电池搭配率达到 25%，在每套太阳能安装之上打开了有意义 的增量客单。GoodLeap 的 GoodGrid 虚拟电厂网络截至 2025 年已纳入
              165,000 名 California 房主，显示出 可变现的数据和电网服务层，可能延伸每套融资系统的价值。KPMG 2025 年 7 月调查中，87% 的千禧一代房主报告
              至少有一个待维修项目，反映出销售点融资可以释放的潜在需求，尤其在高抵押贷款利率使房主不愿搬家的背景下。 逆风同样重大。Section 25D 于 2025 年 12 月 31
              日到期，移除了自有住宅太阳能最大的单一消费者激励；SEIA 和 Wood Mackenzie 预测，2026 年住宅安装量将下降 18%。2026 年住宅太阳能获客成本大约跃升 40%，至每瓦 $0.84。向
              TPO 产品的结构性转移意味着，GoodLeap 的核心贷款业务正在与一个增长更快的市场细分（TPO）竞争； TPO 受益于贷款产品没有的 Section 48E 税收抵免，并由 Sunrun、Sunnova
              等资本充足的既有公司主导。竞争对手 Mosaic 2025 年 5 月因 25D 和 48E 指引造成的资本市场不确定性暂停运营，显示贷款渠道存在系统性脆弱。 Sunlight Financial 于 2025
              年 12 月退出 Chapter 11。CFPB 2024 Issue Spotlight 对太阳能融资的监管逆风 ——其中明确点名销售点 fintech 放贷机构和经销商费用做法——为 GoodLeap
              带来合规成本和诉讼敞口。PACE 融资 （年度发起 $2.8B，覆盖 40 个州）代表部分可持续升级支出的替代渠道，尤其在商业层面；不过多数州的消费者 保护规则仍限制住宅
              PACE。综合看，中期可持续住宅升级融资市场仍大且结构性增长，但 2025 至 2026 年是一个 重大扰动期，政策变化、渠道经济转移和竞争脆弱性都需要 GoodLeap 谨慎穿越。
