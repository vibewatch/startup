              最清晰的工作流证据来自 Aurora Solar、ServiceTitan 和 Enerflo 文档。在 Aurora 中，GoodLeap 贷款、租赁和 PPA 可在 Sales Mode
              内选择；销售代表可以做软性信用检查、比较选项、提交申请并发送融资文件。ServiceTitan 把类似功能放进现场服务估价里，并加入业务单元、州、工单类型和支出门槛规则，以定制贷款展示。Enerflo 则把
