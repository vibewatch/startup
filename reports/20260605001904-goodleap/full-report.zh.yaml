      - number: '6.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 承包商道德风险造成结构性投诉风险
            body: >-
              GoodLeap 在最终验收前向承包商放款，以维持安装商满意度，但这制造了结构性道德风险缺口。EnergySage 分析发现 52 起经核实评论者案例：房主为从未安装或从未开机的系统支付每月贷款账单。BBB
              三年记录了 1,076 起投诉，其中包括 297 起服务 / 维修问题。GoodLeap 的标准回应是把责任推给安装商，但 Holder Rule（写入每一笔 GoodLeap
              贷款）让贷款人可能要为承包商缺陷负责。承包商满意度模型与房主保护之间的冲突，是声誉和监管包袱。
            calloutType: risk
            claimRefs:
              - CU018
              - CU019
              - CU020
              - CU021
          - type: callout
            title: 深承包商网络是难以复制的护城河
            body: >-
              GoodLeap 的 18,000+ 个活跃承包商伙伴，代表多年关系建设、合规入驻和技术集成。GoodLeap Pros 移动 App 能在房主门口即时给出信用决策，形成切换成本飞轮：安装商一旦训练销售团队使用
              GoodLeap 工作流，就会抗拒迁移到竞争对手平台。2025 年 6 月推出的 GoodLeap Payments 进一步加深锁定，把工具从融资延伸到面向承包商的完整支付运营。
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
          - type: callout
            title: GoodGrid VPP 是关键房主留存机制
            body: >-
              不同于大多数贷款人，GoodLeap 在 GoodGrid 中拥有发放后持续产品，把现有电池客户纳入虚拟电厂，并支付每月现金奖励。这把一次性贷款事件转为经常性能源关系。GoodGrid 推出后，Texas
              电池附加率翻倍；165,000 名 California 房主已经加入。如果 GoodLeap 能把 GoodGrid 扩展至全国，并在更多公用事业市场复制 VPP 经济性，它就能形成一层持久留存，竞争对手没有
              VPP 平台就难以复制。
            calloutType: insight
