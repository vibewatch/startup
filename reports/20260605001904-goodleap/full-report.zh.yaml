      - number: '8.3'
        title: 情景框架：ABS 准入、发放量、损失、政策和法律结果决定估值范围
        blocks:
          - type: paragraph
            body: >-
              乐观情景仍然可信，但路径很窄：GoodLeap 需要家庭装修发放量持续、后 ITC 产品多元化可见、ABS
              执行稳定或改善、法律和解可控，并证明其承包商网络可以在没有隐藏费用经济性的情况下贡献量。基准情景假设公司存活并保持活跃证券化发行方身份，但随着投资人要求为评级下调、负面头条风险和私有披露缺口获得补偿，其倍数会压缩。悲观情景并非假设，因为
              Sunnova 和 Mosaic 已说明，当杠杆、政策风险、服务复杂性和资本市场信心一起断裂时，太阳能金融平台的股权价值可能快速流失。最快打破投资逻辑的组合，是不利法律结果改变费用经济性，再叠加 ABS
              进一步恶化，从而抬高资金成本或关闭证券化窗口。
