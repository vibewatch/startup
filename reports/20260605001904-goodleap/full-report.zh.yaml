      - number: '4.3'
        title: 单位经济与资本充足性
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的单位经济很不透明，因为公司没有公开披露毛利率、EBITDA、获客成本、服务组合余额或正式现金头寸。公开已知的是，GoodLeap 最近一次估值为 2021 年 10 月 Series D 轮的
              $12B（融资 $800M，由 MSD Partners 领投，BDT Capital Partners 和 Davidson Kempner 参投）。累计股权融资估计约 $1.6B，覆盖所有轮次。2024
              年曾报道一轮 $428.8M 债务融资，隐含估值 $12B；该融资工具的性质、条款和契约未公开。截至 2025 年底，公司约有 1,200 名员工。

              从发起数据看，2025 年平均贷款额估计约 $27,400，APR 中位数约 4.9%，但这些是第三方数字，未获 GoodLeap 确认。标准贷款期限为 10 至 25 年，无提前还款罚金， Autopay
              利率折扣 0.50%。承包商经销商支付的发起费率估计为贷款面值的 5% 至 8%，意味着每笔平均贷款约 $1,370–$2,190 发起收入。服务费率遵循行业惯例 （管理余额每年 0.25–1%），但
              GoodLeap 组合的具体费率未披露。收入主要基于费用，而不是基于净息差，这降低信用敞口，但造成对持续发起量和 ABS 市场通道的依赖。

              GoodLeap 管理层称公司现金流为正，但没有经审计财务数据公开支撑该说法。据报道，2025 年 EBITDA 预测因诉讼成本上升被下修 $35M，在本就未披露的盈利能力基线之上形成 重大逆风。基于持续的
              ABS 执行频率，资本市场通道看起来稳健；不过商业模式存在结构性脆弱：如果 ABS 利差显著扩大或投资者需求收缩——信用年份质量恶化可能触发这一点—— GoodLeap
              将需要把贷款留在资产负债表上，或削减发起量，从而显著损害其费用收入基础。
