  - id: section-2
    title: 'Business model comparison: origination model, underwriting, funding, and partner channel'
    body: >-
      GoodLeap operates an asset-light, fee-driven origination model: it originates loans using partner bank
      charters, pre-sells them to institutional investors via forward purchase agreements, and earns origination
      fees, servicing fees, and securitization premiums. The company does not hold loans on balance sheet long
      term. Since 2018 it has securitized over $32 billion in sustainable home financing across 24-plus ABS
      transactions, with bookrunners including Goldman Sachs, Bank of America, ATLAS SP, and Citigroup. Three
      home improvement securitizations in 2025 alone totaled $909 million.


      Mosaic's model was structurally similar before its collapse—originate, securitize, fee-earn—but Mosaic
      could not manage the combination of rising interest rates, capital markets stress, and an installation
      volume decline of 31% in 2024. Sunlight Financial likewise relied on a bank-partner model (Cross River
      Bank) and ABS execution, but its balance sheet proved more brittle under rate pressure. Dividend Finance
      under Fifth Third has a distinct funding model: Fifth Third is the originating bank, lending from its
      own deposit base, which theoretically lowers cost of capital and removes ABS market dependency. GreenSky
      and Regions/EnerBank also use bank-originated balance sheet models, competing with GoodLeap on home
      improvement but not directly on solar loan origination.


      The contractor channel is a primary competitive differentiator. GoodLeap's proprietary POS technology
      platform is accessed by 18,000+ sales professionals, supporting instant soft-credit approvals, digital
      contracting, and next-business-day funding. The platform is the most widely adopted in solar, with
      GoodLeap claiming ~28% of all US solar loan originations as of late 2025. Mosaic and Sunlight had
      installer networks comparable in scope before their distress; Dividend/Fifth Third has a smaller but
      credit-quality-focused contractor base. For home improvement products, GoodLeap competes against
      GreenSky and Regions/EnerBank, both of which have established contractor-technology relationships.
      GoodLeap has expanded its home improvement contractor base to 15,000+ HVAC, plumbing, and general
      remodeling partners as part of a strategy to address the full $450 billion sustainable home upgrade
      market it has identified.


      A sector-wide adverse signal cuts across all loan-funded models: KBRA downgraded 18 classes of notes
      across GoodLeap's ABS tranches in March 2026, citing ongoing collateral credit performance deterioration,
      reduced overcollateralization, and in some cases imminent deferral of interest on junior classes. The
      Wall Street Journal reported in July 2025 that some GoodLeap-linked bonds had stopped paying interest
      entirely and were trading as low as $0.42 on the dollar. Fitch similarly identified non-prime borrowers
      and state concentrations in Texas and Florida as drivers of elevated default rates across solar ABS.
