        - POS solar loan fintech (category leader)
        - ~$12B valuation (2021 Series D); ~28% US solar loan market share; $32B+ financed since 2018
        - Homeowners via 18,000+ solar and home improvement contractors; prime and near-prime borrowers
        - Largest contractor network; proprietary POS tech; broadening home-improvement and TPO products
        - ABS credit deterioration; dealer fee litigation; installer multi-homing limits lock-in
      - - Mosaic (Mosaic Sustainable Finance)
        - POS solar loan fintech (bankrupt)
        - Funded $15B+ across 500,000+ households; filed Ch. 11 June 6, 2025; origination wound down
        - No longer actively originating; legacy servicing portfolio under Forbright Bank subsidiary
        - Largest cumulative origination volume before bankruptcy; broad installer relationships (historic)
        - Loan origination permanently ceased; no competitive pressure in new originations as of 2026
      - - Sunlight Financial
        - POS solar loan fintech (restructured)
        - Filed Ch. 11 Oct 2023; emerged Dec 2023 under Greenbacker, Sunstone, IGS, Cross River Bank
        - Solar and home improvement installers; homeowners refinanced under new pricing
        - Fresh capital; price reductions on high-coupon loans; Sunstone/former founders leading recovery
        - Smaller network post-restructuring; public financial data no longer available; uncertain scale
      - - Dividend Finance (Fifth Third Bank)
        - Bank-owned POS solar and home improvement lender
        - Acquired by Fifth Third Bancorp (May 2022); balance-sheet funded; focus on prime/super-prime
        - Prime and super-prime homeowners; solar and home improvement contractors nationwide
        - Bank balance-sheet stability; no ABS market dependency; NABCEP-certified contractor network
        - Narrower credit acceptance band (excludes near-prime borrowers GoodLeap can serve); bank constraints
      - - Sunrun
        - TPO solar incumbent (dominant lease/PPA provider)
        - Public company; 94% of new customers on subscriber/TPO model as of Aug 2025
        - Homeowners preferring $0-down with no maintenance; states with strong net metering
        - Market leader in TPO; structural advantage post-25D expiry via 48E credit; end-to-end service
        - Does not originate solar loans; separate channel from GoodLeap in loan-funded solar
      - - Palmetto / LightReach
        - TPO solar provider (growing)
        - Growing installer-focused TPO platform; named among top TPO providers by Aurora Solar in 2025
        - Homeowners and solar installers seeking zero-down TPO products post-25D
        - Installer-friendly API and platform; growing alongside TPO market shift
        - Smaller scale than Sunrun; limited public financials
      - - GreenSky (Goldman Sachs)
        - Home improvement POS lender
        - Goldman Sachs subsidiary; operates broad home improvement and healthcare contractor network
        - Home improvement contractors and homeowners; credit limits up to $100,000
        - Speed of credit decision; broad product (installment and promotional); strong merchant tools
        - Does not originate solar loans; competes with GoodLeap only in home improvement vertical
      - - Regions / EnerBank (Regions Home Improvement Financing)
        - Regional bank home improvement lender
        - Fully integrated into Regions Bank; one of the largest specialized home improvement lenders
        - Home improvement contractors (HVAC, roofing, windows); homeowners with $5K+ projects
        - Same-as-cash and low-monthly-payment products; 24-hour funding; 55% of HI spend financed
        - Solar loan origination not core; competes with GoodLeap only in home improvement expansion
      - - Cash purchase / direct bank/CU loan
        - Status quo substitute
        - 19% of residential solar in 2023 per CFPB; credit unions gaining solar market share in 2024
        - Cost-sensitive homeowners with savings or equity; borrowers comparing to dealer-fee embedded loans
        - No hidden dealer fees; transparent total cost; credit union rates competitive with fintech APRs
        - Requires upfront capital or existing banking relationship; no instant POS approval
    notes: >-
      Rows cover direct fintech peers, bank-owned POS lenders, TPO solar incumbents, home improvement competitors,
      and status-quo substitutes visible in public evidence for 2025–2026. Mosaic is included as historical
      reference; it no longer originates new loans.
