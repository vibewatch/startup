callouts:
  - calloutType: strength
    title: GoodLeap is the last major independent solar loan fintech standing
    body: >-
      Mosaic's bankruptcy and Sunlight Financial's restructuring have left GoodLeap as the only at-scale
      independent solar loan originator. This creates near-term share consolidation as distressed installer
      relationships redirect to GoodLeap, but also confirms that the underlying category is structurally stressed.
    claimRefs:
      - CP001
      - CP006
      - CP009
  - calloutType: risk
    title: ABS credit deterioration is the most immediate competitive moat risk
    body: >-
      KBRA's March 2026 downgrade of 18 GoodLeap ABS classes and the July 2025 WSJ reports of bonds trading
      at $0.42 on the dollar indicate collateral performance problems that could constrain GoodLeap's capital
      markets access—the backbone of its asset-light model. If securitization economics deteriorate materially,
      GoodLeap's cost advantage over bank-balance-sheet lenders like Dividend/Fifth Third compresses.
    claimRefs:
      - CP026
      - CP027
      - CP042
  - calloutType: risk
    title: TPO structural shift favors Sunrun and late TPO entrants, not loan-first platforms
    body: >-
      The 25D tax credit sunset ends the primary consumer-facing rationale for solar loan ownership. TPO providers
      retaining the 48E commercial credit hold a structural pricing advantage GoodLeap's loan book cannot match.
      GoodLeap's 2024 entry into TPO via the TIP program is a necessary hedge, but Sunrun has a multi-year head
      start across installer relationships, 48E compliance infrastructure, and end-to-end customer service.
    claimRefs:
      - CP014
      - CP015
      - CP017
      - CP018
      - CP022
  - calloutType: insight
    title: Dealer fee regulatory convergence is the sector's hidden pricing floor threat
    body: >-
      All four leading fintech solar lenders—GoodLeap, Mosaic, Sunlight, and Dividend—were sued in the same
      Minnesota AG action. If dealer fee disclosure mandates or caps are adopted broadly, the loan economics
      that fund both lender margin and installer incentive programs will need to be repriced. This creates
      incentive for installers to shift toward TPO arrangements, where dealer fee controversy does not apply.
    claimRefs:
      - CP019
      - CP020
      - CP021
      - CP039
