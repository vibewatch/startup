  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Sunlight Financial post-restructuring scale
      missingEvidence: >-
        Sunlight Financial is now privately held with no SEC reporting obligation; its current origination
        volume, installer network size, and credit performance are not publicly disclosed.
      whyItMatters: >-
        Without Sunlight's current operational scale, competitive threat assessment is speculative.
        If Sunlight has rebuilt to >10% of GoodLeap's volume, it represents a material pricing pressure.
      diligencePath: >-
        Request origination data directly from Sunlight or track EnergySage/installer survey data
        on lender market share for H2 2025.
      relatedQuestionRefs:
        - QP006
        - QP011
        - QP013
    - type: missing-source
      severity: material
      topic: GoodLeap dealer fee response to Minnesota AG suit
      missingEvidence: >-
        No public evidence confirms whether GoodLeap has reduced dealer fees, improved disclosure
        practices, or offered remediation to borrowers in response to the March 2024 MN AG suit.
      whyItMatters: >-
        If GoodLeap has adjusted fee structure downward in response to litigation, its economics
        and competitive positioning versus post-restructuring Sunlight (which announced fee cuts) changes.
      diligencePath: >-
        Request GoodLeap's current dealer fee schedule and disclosure practices from management;
        review court filings in State v. GoodLeap LLC (0:24-cv-01181) for any consent decree or
        interim order on fee disclosure.
      relatedQuestionRefs:
        - QP015
    - type: missing-source
      severity: material
      topic: GoodLeap non-solar home improvement loan share
      missingEvidence: >-
        No public source independently quantifies what percentage of GoodLeap's current loan volume
        comes from non-solar home improvement products versus solar.
      whyItMatters: >-
        If non-solar home improvement is still a small share of volume, GoodLeap's stated TAM expansion
        is aspirational and the platform's competitive differentiation versus GreenSky/Regions is
        weaker than implied.
      diligencePath: >-
        Obtain product-level volume breakdown from GoodLeap management or via due diligence data room.
