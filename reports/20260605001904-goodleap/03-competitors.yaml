  - id: FP003
    title: Moat and competitive durability KPIs
    type: kpi
    layout: standard
    summary: >-
      GoodLeap holds clear scale leadership in solar loan origination but faces high-severity risks in ABS credit
      quality, dealer fee litigation, and TPO structural transition.
    data:
      items:
        - label: GoodLeap US solar loan market share (2025)
          value: ~28%
          detail: Largest among active solar loan originators; Mosaic exited June 2025.
          tone: positive
        - label: Sustainable financing facilitated since 2018
          value: $32B+
          detail: Securitized across 24+ ABS transactions through Goldman Sachs, BofA, ATLAS SP.
          tone: positive
        - label: Active contractor sales professionals on platform
          value: 18,000+
          detail: Primary distribution moat; installer multi-homing limits exclusivity.
          tone: positive
        - label: Solar loan share of residential solar contracts (2024)
          value: 43%
          detail: Lowest since 2017; structural shift toward TPO post-25D expiry accelerates further.
          tone: warning
        - label: GoodLeap ABS tranches downgraded by KBRA (March 2026)
          value: '18 classes'
          detail: Ongoing collateral deterioration; some classes deferring interest or at risk of principal loss.
          tone: negative
        - label: MN AG dealer fee litigation exposure (MN alone)
          value: $6.4M in MN fees / $35M industry total
          detail: Industry-wide suit; if injunction upheld, fee model economics require restructuring.
          tone: negative
        - label: TPO market share forecast by 2026 (Wood Mackenzie)
          value: 41%
          detail: TPO growth accelerated by 25D expiry; Sunrun and GoodLeap TPO both positioned to benefit.
          tone: neutral
