  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - moat claim
      - threat vector
      - severity
      - mitigation / diligence ask
    rows:
      - - Largest US solar loan contractor network (18,000+ active sales professionals)
        - Mosaic and Sunlight exits freed up installers but also trained installers to multi-home; GreenSky and Regions compete in HI vertical
        - Medium
        - Validate exclusive vs. non-exclusive installer agreements; measure attrition rate post-competitor exits
      - - ABS capital markets access ($32B+ securitized; Goldman, BofA, ATLAS bookrunners)
        - KBRA downgraded 18 ABS tranches in March 2026; some bonds trading at $0.42; rising cost or market closure risk
        - High
        - Audit current warehouse and forward purchase agreement terms; assess tranche-level performance vs. rated pool
      - - Proprietary POS technology platform (instant soft-credit decisions; next-day funding)
        - Sunlight's post-restructuring platform improvements and Dividend's digital-first approach both target same POS speed advantage
        - Low-Medium
        - Verify GoodLeap API/integration adoption rate vs. competitors; assess switching cost of platform migration for installers
      - - Product breadth (solar, storage, HVAC, roofing, heat pumps, windows)
        - Regions/EnerBank and GreenSky have comparable or broader home improvement coverage with better brand recall in that segment
        - Medium
        - Quantify non-solar home improvement loan volume and net promoter data from contractor partners
      - - TPO product launch via $1.5B TIP/ATLAS program
        - Sunrun and Palmetto/LightReach have multi-year head start in TPO; Sunrun's 48E infrastructure is ahead of GoodLeap's
        - High
        - Measure TPO origination ramp-up rate and installer adoption; assess 48E compliance infrastructure
      - - Virtual power plant / grid services revenue (Reliant Energy partnership; 1.5GW target)
        - Early-stage; 5MW managed in May 2025 vs. 60MW target; Sunrun and Tesla have more established battery VPP operations
        - Low-Medium
        - Confirm current MW under management and revenue contribution; assess whether VPP economics justify strategic dependence
      - - Dealer fee model economics (primary revenue driver)
        - MN AG lawsuit; CFPB scrutiny; potential injunction requiring full disclosure or fee caps could compress economics
        - High
        - Assess litigation status and probability of injunction; model revenue impact of fee cap at 10% vs. current ~19% average
    notes: >-
      Severity ratings are qualitative judgments based on public evidence. ABS deterioration and dealer fee
      regulatory risk are rated High given direct evidence of tranche downgrades and active litigation.
