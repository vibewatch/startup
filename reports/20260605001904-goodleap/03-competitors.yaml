  - id: section-3
    title: 'TPO expansion, category dynamics, and adjacent competitive frontiers'
    body: >-
      The most significant structural competitive shift in GoodLeap's market is the transition from loan-funded
      solar ownership to third-party ownership (TPO) structures. In 2023, loans accounted for 58% of residential
      solar contracts and TPO for 23% per CFPB; by 2024, loan share had fallen to 43%—the lowest since 2017—
      while TPO was approaching parity. The acceleration after 2025 reflects two policy shocks: the 25D
      residential solar tax credit sunset at end-2025 removes the primary economic rationale for consumer
      ownership (the 30% tax credit), while the 48E commercial ITC remains available to TPO providers who
      can claim and monetize it before passing savings to consumers. Jefferies estimated TPO will grow 25%
      in 2026; Wood Mackenzie projected TPO reaching 41% market share by 2026 even before the full 25D expiry.


      Sunrun is the dominant TPO player, with 94% of new customers on subscriber/TPO models as of August
      2025. Palmetto/LightReach, EnFin, and Tesla PPAs (in select markets) are secondary TPO competitors.
      GoodLeap's entry into leases and PPAs through the $1.5 billion Tactical Infrastructure Partners program
      positions it as a TPO provider, but it is late relative to Sunrun and lacks Sunrun's direct installer
      sales force and end-to-end customer-service infrastructure. GoodLeap's TPO advantage is its existing
      contractor network and technology platform, which can route homeowners toward either a loan or a TPO
      product at the point of sale.


      On the home improvement vertical, GoodLeap faces incumbent competition from Regions/EnerBank and
      GreenSky. Regions Home Improvement Financing claims over 55% of US home improvement spending is
      financed in some form and has one of the largest specialized contractor-financing networks in the country.
      GreenSky operates a bank-partnership model similar to GoodLeap's but focused on home improvement and
      healthcare with mobile-first fast approvals. GoodLeap's expansion into HVAC, roofing, heat pumps, and
      other home improvements directly enters these incumbents' territory.


      The dealer fee regulatory environment compounds competitive dynamics. The Minnesota AG's March 2024
      lawsuit against GoodLeap, Mosaic, Sunlight, and Dividend for $35 million in hidden dealer fees—with
      GoodLeap's average fee at 19.32% of loan principal in Minnesota—creates litigation cost headwinds.
      Sacra estimates that GoodLeap's 2025 EBITDA forecast was revised downward by $35 million due to higher
      legal costs. If injunctions succeed, the industrywide fee model changes, narrowing the dealer margin
      that funds both lender economics and installer incentives.
