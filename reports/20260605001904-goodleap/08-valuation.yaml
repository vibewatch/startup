- id: comparables-and-downside-lessons
  title: 'Comps are cautionary: Sunrun supports a lower multiple; Sunnova and Mosaic define downside'
  body: 'The comparable set argues against paying a venture premium. Sunrun is the closest public reference because it combines customer contracts, financing, and distributed energy, but it is public, levered, and institutionally covered; its reported revenue and market multiples provide a ceiling check rather than a direct private-company answer. SolarEdge is useful mainly as a solar-channel sentiment marker because its hardware exposure and restructuring profile differ from GoodLeap''s loan-origination economics. The adverse peer set is more instructive: Sunnova and Mosaic show that large solar-finance platforms can enter Chapter 11 even after reaching scale. Those outcomes do not mean GoodLeap is worth zero, but they materially increase the required return and reduce willingness to underwrite a high revenue multiple without private credit and liquidity data.'
  claimRefs:
