- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Audited financials
    - Revenue by stream, gross margin, EBITDA and cash
    - Separates platform quality from gain-on-sale cyclicality
    - Request audited statements and QoE
  - - Credit performance
    - Vintage losses, delinquencies, prepayments, re-amortization outcomes
    - Determines ABS pricing and funding availability
    - Review collateral tapes and servicer reports
  - - Capital markets
    - Warehouse capacity, advance rates, forward purchase commitments
    - Tests whether 2026 issuance is durable
    - Interview financing counterparties and review facilities
  - - Legal/regulatory
    - Minnesota exposure, settlement reserve, disclosure-change sensitivity
    - Dealer-fee economics may be impaired
    - Counsel review and scenario reserve model
  - - Cap table
    - Liquidation preference, 409A, secondary marks
    - Converts enterprise value into security return
    - Request cap table and board valuation materials
  - - Entry structure
    - Seniority, covenants, ratchets or milestones
    - Protects against asymmetric downside
    - Negotiate structured terms before investment
  notes: These asks are mandatory before any buy recommendation; public evidence is insufficient for security-level underwriting.
