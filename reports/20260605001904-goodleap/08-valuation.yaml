- id: valuation-context-and-method
  title: 'Valuation context: stale private mark versus revenue, ABS, and public-market evidence'
  body: The most defensible method is not a clean SaaS multiple or book-value exercise; GoodLeap is a fee-driven originate-to-sell lender whose value depends on origination volume, dealer/take-rate durability, servicing economics, ABS execution, and legal outcomes. Public evidence supports a scenario range rather than a point estimate. Sacra's $361 million 2025 revenue estimate provides the conservative anchor because it includes recent quarterly context; IncFact's above-$500 million estimate acts as an upside revenue convention rather than a confirmed GAAP number. Public solar-finance comps such as Sunrun trade on enterprise value because they carry substantial debt and long-lived customer contracts, while SolarEdge is only a channel adjacency. A reasonable base case therefore uses a compressed 4x-7x revenue range, not the 24x-33x implied by the last private mark.
