    - TV004
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue by stream, gross margin, EBITDA, cash, burn, and litigation-cost normalization.
    whyItMatters: Scenario valuation depends on revenue quality and profitability, not just origination volume.
    diligencePath: Obtain audited statements or QoE package and reconcile to ABS gain-on-sale accounting.
    relatedQuestionRefs:
