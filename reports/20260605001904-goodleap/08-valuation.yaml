- id: diligence-asks-and-final-view
  title: Final diligence asks and price discipline before any investment decision
  body: The next diligence cycle should be designed to falsify the base case. First, request audited or quality-of-earnings financials separating origination, servicing, gain-on-sale, and software/platform revenue, with EBITDA after litigation and credit-cost effects. Second, require an ABS package covering vintage loss curves, delinquency roll rates, re-amortization outcomes, prepayments, warehouse capacity, advance rates, and forward-purchase commitments. Third, demand cap-table, preference, 409A, and secondary-price evidence so the nominal valuation can be translated into security-level return. Fourth, model settlement and injunction outcomes for Minnesota and related consumer-finance scrutiny. Without these items, the only defensible public stance is track at a large discount to the 2021 mark; buy becomes plausible only after a reset, structured downside protection, and proof that 2026 ABS access is durable rather than episodic.
