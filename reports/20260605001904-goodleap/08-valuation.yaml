  - type: missing-source
    severity: material
    topic: abs-performance
    missingEvidence: Full current vintage loss tapes, delinquency roll rates, prepayment curves, warehouse terms, and forward-purchase commitments.
    whyItMatters: ABS access is the core funding dependency and the largest valuation swing factor.
    diligencePath: Request trustee reports, servicer files, warehouse agreements, and rating-agency surveillance packages.
