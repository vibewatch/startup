  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: api openness
    missingEvidence: Authenticated GoodLeap API reference, sandbox credentials, webhook/event documentation, partner
      SLA and historical integration error rates.
    whyItMatters: Partner-embedded distribution is a core moat only if integrations are reliable, supportable and
      extensible beyond named partners.
    diligencePath: Request developer portal access, Postman collection export, partner API contracts, uptime reports
      and support-ticket metrics.
    relatedQuestionRefs:
    - QE013
    - QE021
  - type: private-evidence-only
    severity: material
    topic: security reliability
    missingEvidence: SOC 2 Type II report, penetration-test summary, incident-response policy, status-page history
      and data-retention/subprocessor inventory.
    whyItMatters: GoodLeap handles consumer financial, identity and payment data; public privacy and app-store notices
      are insufficient for security underwriting.
    diligencePath: Request trust package from management and compare controls against app-store data collection
      and partner integration scope.
    relatedQuestionRefs:
    - QE020
    - QE021
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: material
    topic: consumer experience
    missingEvidence: Quantitative support SLA, complaint rate, duplicate-payment incidence, payoff error rate and
      fraud remediation cycle-time by product and channel.
    whyItMatters: Adverse reviews and TIME allegations are anecdotal but directly challenge GoodLeap’s frictionless
      workflow claim.
    diligencePath: Analyze CFPB/BBB/Trustpilot exports, request internal complaint taxonomy, and sample recent closed
      support/fraud cases.
    relatedQuestionRefs:
    - QE022
    - QE023
    - QE024
  - type: private-evidence-only
    severity: minor
    topic: payments proof
    missingEvidence: Customer-level GoodLeap Payments adoption, transaction volume, chargeback rate, ACH return
      rate and DSO improvement distribution.
    whyItMatters: Company-sourced pilot metrics suggest product value but do not establish broad contractor ROI.
    diligencePath: Interview payment-product customers and reconcile transaction cohorts with QuickBooks and payment-processor
      reports.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE005
