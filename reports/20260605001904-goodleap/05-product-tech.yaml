callouts:
- calloutType: strength
  title: Embedded distribution is the technology moat
  body: GoodLeap is present inside proposal and field-service workflows where contractors already sell, which can
    reduce friction and make financing/payment selection a default part of the job workflow.
  claimRefs:
  - CE013
  - CE017
  - CE020
  - CE021
- calloutType: risk
  title: Trust failures hit the product, not just support
  body: Fraud, payoff, duplicate-payment and unclear-loan complaints directly undermine the promise of a fast digital
    financing workflow and should be diligence-tested with service-level metrics.
  claimRefs:
  - CE032
  - CE033
  - CE036
  - CE037
  - CE043
- calloutType: assumption
  title: API maturity needs non-public evidence
  body: Public developer pages are too shallow to underwrite enterprise integration depth; API references, uptime
    commitments, security attestations and webhook coverage require data-room review.
  claimRefs:
  - CE022
  - CE023
  - CE043
