tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Solar and home-improvement loans
    - Homeowner via contractor
    - Mature core product
    - Installer-embedded point-of-sale financing with long terms and multiple loan types
    - Obtain current approval rates, dealer-fee schedule and decline reasons by channel
  - - Lease / PPA TPO products
    - Homeowner and solar sales rep
    - Scaled but newer than loan core
    - Zero-down 25-year structure, balanced billing and post-year-five buyout flexibility
    - Verify state availability, escalator distribution and TPO securitization capacity
  - - GoodLeap Pros mobile app
    - Contractor sales reps
    - Public mobile apps with strong store ratings
    - Offer comparison, real-time updates and mobile sales-pipeline management
    - Review active-user cohort, crash rate, login failure rate and app support tickets
  - - GoodLeap Payments
    - Home-improvement contractors
    - Launched/expanding in 2025-2026
    - Tap to Pay, eCheck, payment links, recurring billing and QuickBooks sync without extra hardware
    - Validate payment loss rates, dispute handling and contractor adoption beyond pilot claims
  - - Partner-platform integrations
    - Aurora, ServiceTitan, Enerflo users
    - Documented in major partner help centers
    - Financing in native proposal/field-service workflows with custom rules
    - Request API contracts, SLA terms, integration error rates and sandbox coverage
  - - Homeowner account / servicing surface
    - Borrowers and TPO customers
    - Visible but public docs limited
    - Account management, monitoring and support channels linked to financing relationship
    - Test payment, payoff, document retrieval and complaint-resolution workflows directly
  notes: Matrix combines official product pages, app stores, partner technical docs and independent reviews; maturity
    is based on public evidence, not internal usage data.
  claimRefs:
  - CE004
  - CE005
  - CE008
  - CE010
  - CE013
  - CE020
  - CE028
  - CE030
- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - GoodLeap solution
  - Measurable benefit claimed or implied
  - Limitation / risk
  rows:
  - - Contractor sells solar or HVAC project
    - Prepare proposal, quote financing, avoid rekeying data
    - GoodLeap Pros plus Aurora or ServiceTitan financing selection
    - Fewer handoffs and real-time offer comparison
    - Installer-mediated sale can obscure borrower understanding of terms
  - - Homeowner applies for financing
    - Provide identity, property, income and disclosures
    - Embedded GoodLeap credit application from Aurora or partner flow
    - Soft credit check and fast approval status within proposal workflow
    - Fraud and identity controls are only partially observable publicly
  - - Solar rep prices lease or PPA
    - Match utility, usage, design and adders to TPO product
    - Aurora GoodLeap TPO rate table and product filter
    - Quote displays solar rate, monthly payment and gross PPW
    - Wrong utility, usage or non-AVL equipment can block pricing
  - - Contractor collects deposits or final payments
    - Checks, cards, invoices and manual reconciliation
    - GoodLeap Payments with tap-to-pay, eCheck and links
    - Company/press sources claim faster collection and lower reconciliation time
    - Pilot metrics are company-sourced and need customer-level proof
  - - Homeowner services account
    - Make payments, resolve payoff or billing questions
    - GoodLeap support, complaint channels and account tools
    - Published support hours and channels are available
    - Trustpilot reviews allege duplicate payments, unclear payoff and poor follow-up
  notes: Workflow rows emphasize where the product touches real users and distinguish documented steps from company-claimed
    benefits.
