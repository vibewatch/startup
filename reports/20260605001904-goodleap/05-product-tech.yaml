  - CE015
  - CE016
  - CE017
  - CE020
  - CE021
  - CE027
  - CE036
  - CE037
  - CE042
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in workflow
  - Dependency
  - Risk
  rows:
  - - Contractor UI layer
    - GoodLeap Pros, ServiceTitan Mobile, Aurora Sales Mode and Enerflo sales flow
    - Mobile app stores, partner admin setup and user permissions
    - Fragmented UX if partner configuration or app access fails
  - - Financing and decisioning core
    - Credit application, soft checks, approvals and product eligibility
    - GoodLeap underwriting logic, KYC/KYB, income/property inputs and disclosures
    - Fraud-control adequacy and false-positive tradeoffs are not publicly quantified
  - - TPO pricing/design layer
    - Lease/PPA rate table and product availability
    - Utility provider, usage profile, AVL panels/batteries and system-design details
    - Non-approved components or market gaps can block quote generation
  - - Payments rail
    - Tap-to-pay, ACH/eCheck, invoices, recurring billing and reconciliation
    - Card networks, ACH, QuickBooks and dispute/refund workflows
    - Payment errors or duplicate payments directly damage servicing trust
  - - Developer/API layer
    - Partner and custom integrations
    - GoodLeap developer portal, Postman resources and partner APIs
    - Public API docs are shallow without authenticated access; SLA/webhook depth unverified
  notes: Architecture is inferred from public integration docs and hiring signals; no internal system diagram, uptime
    history or SOC 2 package was available.
  claimRefs:
  - CE014
  - CE016
  - CE021
  - CE022
  - CE023
  - CE038
  - CE040
  - CE041
- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / metric
  - Status
  - Scope
  - Gap
  rows:
  - - State lending licenses and NMLS disclosure
    - Publicly disclosed
    - GoodLeap LLC state-by-state lending activities
    - Need current license exceptions, exam findings and complaint trends by state
  - - Privacy policy and app-store data safety
    - Publicly disclosed
    - Consumer and contractor data collection, sharing, encryption-in-transit and deletion requests
    - Need data-flow diagram, retention schedule and vendor subprocessors
  - - Support and complaint channels
    - Publicly disclosed but article depth limited
    - Phone hours, complaint contact and support center
    - Need SLA metrics, first-contact resolution and payoff/dispute cycle times
  - - Fraud/risk controls
    - Partially disclosed through TIME response and job postings
    - Synthetic ID, account integrity, KYC/KYB, device intelligence and real-time defenses
    - Need fraud loss rate, manual-review policy and post-incident remediation evidence
  - - SOC 2 / status / reliability evidence
    - Not publicly retained
    - Security, availability and incident transparency
    - Request SOC 2 Type II, penetration-test summary, uptime history and incident response policy
  notes: Trust table intentionally includes absence-of-evidence rows because public security and reliability detail
    is limited relative to fintech platform risk.
  claimRefs:
  - CE024
