company:
  name: ModelBest
chapter:
  number: 1
  title: Company Overview
  summary: >-
    ModelBest is a 2022-founded Chinese edge-AI company emerging from the Tsinghua
    NLP ecosystem, with MiniCPM positioned for on-device deployment across phones,
    PCs, vehicles, robots, and other hardware. April 2026 reporting places the
    company at the unicorn threshold after more than RMB 1 billion of first-quarter
    financing, but headquarters, audited operating metrics, governance, ownership,
    and financing terms remain unverified in the assigned public evidence.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      ModelBest was founded in 2022 and emerged from Tsinghua University's natural
      language processing research ecosystem; reporting places its model research
      and training base in Beijing, but the assigned sources do not establish a
      current legal headquarters. The company presents MiniCPM as a compact
      on-device model family, while independent reporting describes a strategy
      centered on integrating models into phones, AI PCs, intelligent cabins,
      robots, and other constrained hardware. This points to an enterprise and OEM
      integration model rather than a disclosed consumer-subscription business.
      That distinction matters: deployment breadth is visible, but public pricing,
      contract structure, recurring revenue, and gross-margin economics are not.
    claimRefs: [CO001, CO002, CO005, CO006, CO014, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The disclosed leadership combines operating and academic credentials. CEO
      Li Dahai previously served as Zhihu's chief technology officer and executive
      director, while co-founder and chief scientist Liu Zhiyuan is a Tsinghua
      computer-science professor. This pairing supports founder-market fit across
      commercialization and model research, but it also concentrates the public
      narrative around two individuals. The assigned evidence does not provide a
      current board roster, committee structure, voting-control map, or complete
      cap table. Those omissions prevent a reliable assessment of investor control,
      founder dilution, succession depth, and related-party governance.
    claimRefs: [CO003, CO004, CO015]
    tableRefs: [TO002]
  - id: financing-scale-and-stakeholders
    title: Financing, scale, and stakeholders
    body: >-
      ModelBest's financing cadence accelerated in 2026. A February round led by
      China Telecom and an April round co-led by Shenzhen Capital Group and
      Inovance Capital reportedly took first-quarter financing above RMB 1 billion.
      Multiple outlets described the April post-money valuation as crossing the
      unicorn threshold, but none of the assigned sources supplies the exact
      valuation, security type, dilution, liquidation preferences, debt terms, or
      cash balance. Earlier financing included a 2024 round led by Primavera
      Venture Partners and Huawei's Habo. Reported MiniCPM downloads above
      24 million show distribution, not paying customers, revenue, ARR, or cash
      available.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-risk-outlook
    title: Milestones and risk outlook
    body: >-
      The milestone sequence shows a rapid move from a 2022 founding and 2023
      angel financing into the February 2024 MiniCPM release, subsequent
      fundraising, vehicle deployments, and a 2026 unicorn-threshold financing.
      Named production integrations in the Changan Mazda EZ-60 and Geely Galaxy M9
      provide stronger commercialization evidence than download counts alone.
      However, independent analysis identifies a structural dependency: chip,
      handset, and platform vendors control the underlying hardware and can build
      their own edge-AI stacks. ModelBest therefore must sustain an integration or
      model-performance lead while proving contract durability and unit economics;
      the current public record does not yet resolve that test.
    claimRefs: [CO001, CO005, CO007, CO008, CO009, CO010, CO012, CO013, CO016]
    figureRefs: [FO001]
