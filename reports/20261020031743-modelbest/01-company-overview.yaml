callouts:
  - calloutType: risk
    title: Scale signals are not operating metrics
    body: >-
      More than RMB 1 billion of first-quarter financing and over 24 million
      reported downloads indicate capital access and distribution, but neither
      establishes revenue, ARR, cash on hand, paying customers, retention, or
      gross margin.
    claimRefs: [CO008, CO011, CO014]
  - calloutType: insight
    title: Strategic capital may be both an asset and a dependency
    body: >-
      Telecom, automation, device, and state-backed investors can accelerate
      deployment, but diligence must separate signed customer economics from
      ecosystem signaling and clarify platform or governance constraints.
    claimRefs: [CO007, CO008, CO010, CO013, CO015, CO016]
