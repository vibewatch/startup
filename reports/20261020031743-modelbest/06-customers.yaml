figures:
  - id: FU001
    title: Evidence-based customer journey and expansion loop
    type: journey-map
    summary: >-
      Public evidence is strongest at developer discovery and two automotive production
      integrations, while conversion, renewal, and cross-segment expansion remain unreported.
    data:
      items:
        - label: Open-source discovery
          detail: "Developers encounter MiniCPM through Hugging Face and other repositories."
          touchpoints: ["Hugging Face organization", "Open-model downloads"]
          value: "5,838 followers"
          note: "Audience signal, not a customer count."
        - label: Local evaluation
          detail: "Teams select compact checkpoints and runtime-specific formats for local tests."
          touchpoints: ["Ollama page", "GGUF", "MLX", "llama.cpp"]
          value: "Multiple deployment formats"
          note: "No evaluation-to-purchase conversion is disclosed."
        - label: Enterprise co-development
          detail: "OEMs, chipset vendors, and channel partners adapt models to a device workflow."
          touchpoints: ["Automotive OEMs", "Phone makers", "Telecom channel"]
          value: "Several named relationships"
          note: "Pilot, investment, channel, and customer roles are not consistently separated."
        - label: Production integration
          detail: "The clearest public milestone is inclusion in a launched end product."
          touchpoints: ["MAZDA EZ-60", "Geely Galaxy M9"]
          value: "2 named vehicle models"
          note: "No production-volume or contract denominator is public."
        - label: End-user utilization
          detail: "Drivers or device users interact with the embedded model."
          touchpoints: ["Smart cockpit interaction", "Local multimodal assistance"]
          value: null
          note: "Active-user, utilization, satisfaction, and outcome metrics are absent."
        - label: Renewal and expansion
          detail: "A durable loop would add models, devices, locations, or use cases after launch."
          touchpoints: ["Renewal", "Cross-model expansion", "Cross-vertical expansion"]
          value: null
          note: "NRR, GRR, churn, renewal, and expansion economics are not disclosed."
    approximationNotes: "Ordered stages show an evidence-based workflow, not measured conversion rates; null values represent unavailable public metrics rather than zero."
    claimRefs: [CU008, CU009, CU012, CU013, CU014, CU016]
callouts:
  - calloutType: strength
    title: Production proof exists, but it is narrow
    body: >-
      MAZDA EZ-60 and Geely Galaxy M9 are stronger evidence than logos because retained
      sources connect MiniCPM to launched vehicle products. The sources still omit volumes,
      outcomes, contract duration, and renewal behavior.
    claimRefs: [CU004, CU005, CU013]
  - calloutType: risk
    title: Open-source reach is not recurring revenue
    body: >-
      Reported downloads and observed followers indicate distribution and developer interest,
      but the retained record provides no bridge to paid accounts, retention, customer
      concentration, or customer-level revenue.
    claimRefs: [CU006, CU007, CU012, CU014]
