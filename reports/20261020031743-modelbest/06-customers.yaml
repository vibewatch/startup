company:
  name: ModelBest
chapter:
  number: 6
  title: Customers
  summary: >-
    ModelBest has credible production proof in two named vehicle programs and substantial
    developer reach, but the public record still does not disclose paying-customer count,
    retention, contract economics, or concentration. The evidence supports automotive OEMs
    as the strongest commercial segment while phone, PC, home, industrial, and robotics
    relationships remain less specific.
sections:
  - id: customer-segments
    title: Customer segments and buying surfaces
    body: >-
      ModelBest appears to serve two different populations that should not be conflated:
      enterprise device makers buying or integrating edge-model capability, and developers
      consuming open models and deployment packages. Dealroom describes the enterprise client
      base as spanning AI phones and PCs, smart cockpits, smart homes, and embodied robotics,
      and names Huawei, MediaTek, Lenovo, Intel, and Great Wall Motor as strategic partners in
      the revenue model. Company-originated reporting adds Geely, Changan, Volkswagen, and
      Huawei, but generally does not identify the buyer, payer, contract value, or deployed
      volume. Automotive is therefore the only segment with named production products in the
      retained evidence. Developer activity on Hugging Face and an Ollama distribution page
      creates a broad evaluation funnel, but those users are not necessarily paying customers.
      Public-sector and industrial channels are suggested by China Telecom and Inovance-linked
      investor relationships, yet no customer-level commercial terms are disclosed.
    claimRefs: [CU001, CU002, CU003, CU007, CU008, CU009, CU010]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and production proof
    body: >-
      The strongest adoption evidence is product-specific rather than account-count based.
      A December 2025 report says the MAZDA EZ-60 was the first mass-produced vehicle built
      with the on-device model collaboration and that Geely's Galaxy M9 launched globally
      with a MiniCPM multimodal model. Three April 2026 reports repeat a cumulative
      24 million-download milestone across GitHub and Hugging Face, while the current
      Hugging Face organization page independently displays 5,838 followers. These metrics
      demonstrate awareness, experimentation, and distribution, but neither downloads nor
      followers establish active production usage, paid conversion, or retention. The pool
      contains no account denominator, deployment-volume series, utilization measure, or
      outcome comparison. Adoption should therefore be read as a combination of two named
      automotive production references and a much broader, non-monetized developer funnel,
      not as a disclosed customer-growth curve.
    claimRefs: [CU004, CU005, CU006, CU007, CU013, CU014]
    tableRefs: [TU002]
  - id: reference-quality
    title: Named-reference quality and durability
    body: >-
      Changan Mazda and Geely provide the best reference quality because the retained sources
      tie MiniCPM to launched vehicle models. Even for these references, there are no disclosed
      unit volumes, attach rates, contract duration, renewal terms, user outcomes, or expansion
      economics. Huawei, Volkswagen, global phone makers, China Telecom, and other strategic
      counterparties are described as deep collaborations or business coordination, but the
      public evidence does not distinguish paid production, pilot, co-development, investment,
      or channel activity. CaproAsia's August 2026 profile still uses only a general ambition to
      expand with global partners, illustrating that fresher coverage has not closed the
      customer-detail gap. The named-reference set is therefore a sample of public relationships,
      not an exhaustive customer roster, and logos or partnerships should not be treated as
      proof of recurring revenue or durable deployment.
    claimRefs: [CU002, CU003, CU004, CU005, CU009, CU010, CU011, CU013]
    tableRefs: [TU003]
  - id: retention-expansion-risk
    title: Retention, expansion, and concentration risk
    body: >-
      No retained source reports gross or net revenue retention, churn, renewal rate, contract
      length, satisfaction, paying-customer count, top-customer share, or customer-level
      revenue. That absence is not evidence of poor retention; it is a material diligence gap
      that prevents a durability or concentration judgment. The visible commercialization
      proof is concentrated in automotive, and multiple relationships also overlap with
      investors or ecosystem partners, which raises a classification question: strategic
      alignment may accelerate distribution, but it does not by itself demonstrate arm's-length
      demand. An industry source quoted by Eastmoney recommended focusing on vertical use cases
      and avoiding a solution searching for a problem, a direct warning that broad technical
      reach may not translate into repeatable applications. Investment underwriting should
      require a customer ledger separating pilots, production deployments, paid licenses,
      channel-sourced accounts, renewals, and expansion before assigning value to the broader
      partnership list.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
