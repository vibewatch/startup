      - Jurisdiction and status
      - Likelihood
      - Severity
      - Mitigation and maturity
      - Residual exposure and diligence path
    rows:
      - - Advanced-compute export licensing
        - "United States / cross-border; 2026 guidance reported as applying license requirements to advanced chips for China-headquartered entities outside China"
