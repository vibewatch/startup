        - Medium
        - "Mixed: broad vLLM support, but a documented MiniCPM-V-2 fork requirement"
        - "Version-specific integration and upgrade risk"
        - "Supported production matrix, regression results, ownership, and rollback evidence"
      - - Research benchmark claims fail to transfer to customer workloads
        - Medium
        - High
        - "Unverified beyond author-reported paper results"
        - "Accuracy, latency, memory, and hallucination variance by device and workload"
        - "Independent workload tests with baselines, denominators, and production acceptance thresholds"
      - - Mid-2026 hardware products are delayed or miss performance targets
        - Medium
        - Medium
        - "Plan was reported in April 2026; no later assigned source confirms shipment"
        - "Hardware schedule, inventory, certification, support, and working-capital exposure"
        - "Shipment records, certification status, bill of materials, returns, and support metrics"
      - - Vehicle or endpoint reliability, safety, privacy, or security event
        - Unknown
        - High
        - "Unverified despite reported vehicle deployments and broad device scope"
        - "Potential customer, regulatory, recall, and reputation impact"
        - "Incident and recall logs, penetration tests, safety cases, SLAs, and field-failure rates"
    notes: >-
      Qualitative failure-mode assessment based on reported model support, deployment scope, and
      launch plans. No assigned source reported a ModelBest outage, breach, recall, or safety event;
      that absence is not treated as proof that none occurred.
    claimRefs: [CR002, CR004, CR005, CR006, CR010, CR011, CR016]
  - id: TR003
    title: Partner / dependency and financial-model risk register
    columns:
      - Dependency
      - Counterparty or channel
      - Role and concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Advanced compute and inference ecosystem
        - "Chip, cloud, data-center, and runtime suppliers not disclosed in assigned evidence"
        - "Dependency is plausible from model development; concentration is unknown"
        - "Licensing restriction, supply interruption, or unsupported model/runtime version"
        - High
        - "Dual-source and deployment portability plans must be tested; residual exposure remains high until mapped"
      - - OEM and strategic deployment partners
        - "Huawei, MediaTek, Lenovo, Intel, Great Wall Motor, and other reported relationships"
        - "Broad named set, but revenue contribution, contract status, exclusivity, and top-partner concentration are unknown"
        - "Integration cancellation, delayed launch, or partner insourcing"
        - Medium-high
        - "Verify signed design wins, milestones, termination rights, revenue by partner, and replacement pipeline"
      - - External capital
        - "Strategic, state-linked, and financial investors reported across 2024-2026 rounds"
        - "More than RMB 1 billion of estimated Q1 2026 financing is reported; cash availability and runway are not"
        - "Capital is consumed before recurring commercialization supports the cost base"
        - High
        - "Obtain bank cash, use-of-proceeds, monthly burn, debt, commitments, and downside runway; residual exposure unquantified"
      - - Smartphone and edge-device demand
        - "OEM channels and the broader generative-AI smartphone category"
        - "Counterpoint headline forecasts 45% of global smartphone shipments in 2026; ModelBest share is not disclosed"
        - "Category growth accrues to integrated competitors or fails to convert into ModelBest contracts"
        - Medium
        - "Require unit-level design wins, attach rates, pricing, gross margin, renewals, and concentration; residual exposure medium"
    notes: >-
      Counterparties and metrics are source-attributed. Financing is not treated as cash available,
      downloads are not treated as revenue, and market-category growth is not treated as ModelBest
      market share.
    claimRefs: [CR001, CR002, CR003, CR007, CR008, CR009, CR012, CR013, CR014]
