        - High
        - "Unverified; obtain chip, cloud, data-center, reseller, and overseas-entity inventory plus export-control counsel analysis"
        - "High until dependencies and licenses are mapped; inspect invoices, contracts, architecture, and end-user statements"
      - - Privacy, AI governance, security certification, and incident posture
        - "China and every deployment market; assigned public evidence does not establish status"
        - Unknown
        - "High diligence priority because reported endpoints include vehicles and consumer devices"
        - "Unverified; review privacy notices, DPIAs, model cards, security certifications, red-team reports, and incident register"
        - "Unquantified; confirm data residency, telemetry, consent, safety ownership, and customer indemnities"
      - - Open-source, commercial licensing, and model IP
        - "Multi-jurisdiction; public model availability and runtime integration are evidenced, but governing license terms are not established here"
        - Unknown
        - Medium
        - "Early; conduct model-by-model license, training-data provenance, dependency, and software-bill-of-materials review"
        - "Medium until commercial-use rights and pass-through obligations are verified"
    notes: >-
      Partial public-evidence register as of 2026-10-20. Rankings are qualitative diligence
      priorities, not findings of a violation or incident; unknown denotes missing company-specific
      evidence.
    enumerationScope:
      coverage: partial
      basis: >-
        Issues evidenced or exposed by the eight successful prefetched sources assigned to the
        risks chapter; private contracts, regulatory files, and company compliance artifacts were
        unavailable.
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR010, CR016]
