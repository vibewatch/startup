company:
  name: ModelBest
chapter:
  number: 4
  title: Financials
  summary: >-
    ModelBest has disclosed repeated financing, open-source adoption, and device deployments, but
    the assigned public record does not disclose revenue, realized pricing, gross margin, cash,
    burn, or runway. The financial case therefore rests on unverified conversion from technical
    adoption to contracted, cash-generative revenue, while pre-IPO tutoring under rules for
    unprofitable technology companies reinforces the need for primary financial diligence.
sections:
  - id: revenue-model
    title: Commercial surfaces are visible, but revenue conversion is not
    body: >-
      Public reporting identifies several potential monetization surfaces: embedded automotive
      deployments, broader device-OEM relationships, commercialization of on-device models, and
      planned hardware. ModelBest-linked reporting also cites 24 million cumulative MiniCPM
      downloads and production use in named vehicle models. These are useful adoption and
      distribution signals, not revenue measures: the sources do not disclose whether contracts
      are licenses, per-device royalties, engineering fees, usage charges, hardware sales, or
      strategic pilots. They also do not quantify paying customers, contracted volume, renewal,
      recognized revenue, or customer concentration. Underwriting should therefore treat the
      apparent model as a set of plausible revenue channels rather than a verified revenue mix.
    claimRefs: [CI006, CI007, CI008, CI014, CI015, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing, revenue quality, and unit economics remain private
    body: >-
      No retained source supplies list pricing, realized contract pricing, revenue, ARR, gross
      margin, customer acquisition cost, payback, retention, or service-delivery cost. That
      prevents a defensible assessment of whether ModelBest earns recurring software economics,
      lower-margin project revenue, royalty income, or a blended software-and-hardware margin.
      Open-source downloads may widen the developer funnel, while production deployments may
      indicate commercial relevance, but neither supplies a denominator for conversion or a cash
      value. The diligence priority is a contract-to-ledger bridge by revenue stream, including
      discounts, implementation obligations, compute and support costs, warranty exposure, and
      the share of revenue tied to strategic investors or subsidized projects.
    claimRefs: [CI007, CI008, CI011, CI014, CI016]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy
    title: Fresh capital is documented; adequacy and runway are not
    body: >-
      Multiple April reports said ModelBest raised more than RMB1 billion across two first-quarter
      2026 financings and crossed the unicorn valuation threshold. A separate company-linked
      financing report said proceeds would fund on-device-model research and commercialization.
      Those facts establish access to capital, but funding raised is not cash available: none of
      the retained sources discloses closing dates, net proceeds, cash on hand, monthly burn,
      debt, restricted cash, working-capital needs, hardware inventory commitments, or runway.
      The mix of state-backed and industrial investors may improve strategic access, yet it does
      not resolve financing dependency. A primary cash bridge and 24-month operating plan are
      required before concluding the latest rounds adequately fund the commercialization plan.
    claimRefs: [CI003, CI004, CI005, CI012, CI013]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The strongest positive signal is that investors continued to fund ModelBest while reported
      deployments and model adoption expanded. The strongest caution is that Caixin reported
      pre-IPO tutoring and described a potential STAR Market route for unprofitable technology
      companies. That route is not proof of current losses or listing completion, but it is
      adverse context against assuming near-term profitability. A peer financing benchmark also
      shows that headline capital and valuation can be shaped by governance and investor-rights
      structures, making ModelBest's own preference stack and dilution material. Until management
      provides audited financials, customer-level revenue evidence, gross-margin cohorts, and a
      cash runway bridge, revenue quality, margin path, and capital sufficiency remain
      un-underwritable rather than merely conservative.
    claimRefs: [CI001, CI002, CI003, CI010, CI011, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams and monetization status
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Automotive embedded models, OEM integration or license, Vehicle or program, Named production deployments reported, Undisclosed, Executed contracts and recognized revenue by OEM]
      - [Smartphone and PC deployments, Device-maker integration, Device or model family, Deep collaborations claimed, Undisclosed, Contract model and shipped-device royalty statements]
      - [Smart-home and edge devices, Embedded model deployment, Device or endpoint, Scale deployment claimed without volume, Undisclosed, Paying endpoints and realized price per endpoint]
      - [Enterprise customization, Engineering and model adaptation, Project or milestone, Plausible from commercialization activity but not separately disclosed, Unknown, Project backlog and service gross margin]
      - [Developer hardware, Board or edge box sale, Hardware unit, Products were planned in April reporting, Not yet evidenced, Current launch status ASP BOM warranty and inventory plan]
      - [Open-source ecosystem, Conversion from downloads to paid deployment, Developer or organization, 24 million cumulative downloads claimed, Adoption signal only, Funnel conversion from download to paid production]
    notes: >-
      Analytical stream map based on retained reporting; deployment and download signals are not
      recognized revenue, and no source discloses current revenue mix or contract economics.
    claimRefs: [CI005, CI006, CI007, CI008, CI014, CI015, CI016]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer, Price or contract model, List versus realized, Discount or unknown, Source-backed conclusion]
    rows:
      - [Embedded software, Not disclosed, Neither disclosed, Volume tiers and minimum commitments unknown, Production use does not establish per-device pricing]
      - [Customization and integration, Not disclosed, Neither disclosed, Milestones support and acceptance terms unknown, Project economics cannot be separated from recurring software]
      - [Developer hardware, Not disclosed, Neither disclosed, BOM channel margin and warranty reserve unknown, April coverage described plans rather than realized sales]
      - [Open-source-to-enterprise conversion, Not disclosed, Neither disclosed, Paid conversion and renewal unknown, Download count is not a paying-customer count]
    notes: >-
      Null-equivalent entries reflect absent public disclosure in the assigned evidence, not zero
      price, zero revenue, or confirmation that a listed monetization method is currently used.
    claimRefs: [CI007, CI008, CI011, CI014, CI015, CI016]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue and ARR, Not disclosed, High confidence in the disclosure gap, Establishes commercial scale and recurring mix, Audited monthly revenue bridge by stream]
      - [Gross margin, Not disclosed, High confidence in the disclosure gap, Tests software leverage versus services and hardware drag, Gross margin by product and customer cohort]
      - [CAC and sales payback, Not disclosed, High confidence in the disclosure gap, Tests GTM efficiency, Fully loaded CAC sales cycle and payback by segment]
      - [Retention and concentration, Not disclosed, High confidence in the disclosure gap, Tests durability and dependence on strategic accounts, GRR NRR churn and top-ten revenue concentration]
      - [Cash on hand, Not disclosed, High confidence in the disclosure gap, Anchors actual financing capacity, Bank statements and unrestricted cash reconciliation]
      - [Monthly burn and runway, Not disclosed, High confidence in the disclosure gap, Tests the timing of the next financing need, Trailing burn current budget and downside runway]
      - [Debt and investor preferences, Not disclosed, High confidence in the disclosure gap, Determines senior claims dilution and governance burden, Debt schedule cap table and preference waterfall]
    notes: >-
      Public values are unavailable in the retained pool. Confidence applies to the observed
      disclosure gap, not to an estimate of the underlying metric; every row requires primary data.
    claimRefs: [CI003, CI010, CI011, CI012, CI013, CI016]
figures:
  - id: FI001
    title: Evidence bridge from adoption to cash generation
    type: flow
    summary: >-
      Public evidence reaches adoption and deployment, but every financial conversion step remains
      undisclosed.
    data:
      nodes:
        - id: adoption
          label: Open-source adoption
          value: 24 million cumulative downloads claimed
          detail: A top-of-funnel signal without a paying-customer denominator.
        - id: deployment
          label: Production deployment
          value: Named automotive programs reported
          detail: Demonstrates technical and distribution relevance, not contract value.
        - id: contracts
          label: Contract economics
          value: Not disclosed
          detail: License, royalty, project, support, and hardware terms remain unknown.
        - id: revenue
          label: Recognized revenue
          value: Not disclosed
          detail: Revenue, ARR, mix, and concentration are unavailable.
        - id: gross-profit
          label: Gross profit
          value: Not disclosed
          detail: Compute, engineering, support, hardware, and warranty costs are unavailable.
        - id: cash
          label: Cash conversion
          value: Not disclosed
          detail: Working capital, burn, and runway cannot be reconciled.
    approximationNotes: >-
      This is an evidence-availability sequence, not a quantified conversion funnel; no conversion
      rates or proportional values are implied.
    claimRefs: [CI007, CI008, CI011, CI012, CI014, CI016]
callouts:
  - calloutType: risk
    title: Financing headlines do not establish runway
    body: >-
      More than RMB1 billion of reported first-quarter financing cannot be treated as cash on hand
      without closing, net-proceeds, debt, restricted-cash, burn, and spending-plan evidence.
    claimRefs: [CI003, CI012, CI013]
