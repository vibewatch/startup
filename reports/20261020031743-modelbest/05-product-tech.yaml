  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-controls
      missingEvidence: Independent security assessment, certification scope, vulnerability-management process, privacy controls, safety evaluation, incident history, and uptime data.
      whyItMatters: A sandbox label does not establish enterprise security, regulatory compliance, privacy protection, or production reliability.
      diligencePath: Request current SOC 2 or ISO evidence where applicable, penetration-test summaries, architecture and data-flow diagrams, model safety cards, incident logs, and customer service-level reports.
      relatedQuestionRefs: [QE009]
    - type: stale
      severity: material
      topic: hardware-roadmap
      missingEvidence: Current launch, shipment, specification, certification, support, warranty, and production-volume evidence for Songguo Pi and EdgeClaw Box.
      whyItMatters: The retained April announcement targeted mid-2026, which had passed by the run date without confirming evidence in the assigned pool.
      diligencePath: Obtain dated product-release records, bills of materials, certification filings, shipment evidence, channel availability, and support commitments.
    - type: missing-source
      severity: material
      topic: production-reliability
      missingEvidence: Independent customer validation of model versions, deployment volumes, latency distributions, failure rates, update cadence, and measurable outcomes in the named vehicle programs.
      whyItMatters: Named production programs support relevance but do not quantify reliability, adoption depth, or repeatability across OEMs.
      diligencePath: Review OEM acceptance reports, field telemetry, warranty and incident data, release histories, and named customer references under NDA.
    - type: missing-source
      severity: minor
      topic: benchmark-reproduction
      missingEvidence: Independent reproduction of MiniCPM-o 4.5 performance, memory consumption, and full-duplex behavior on representative edge hardware.
      whyItMatters: Author-reported research benchmarks may not transfer to production devices, quantizations, thermal envelopes, or real workloads.
      diligencePath: Commission a standardized device benchmark against named open and proprietary alternatives using identical prompts, memory accounting, latency, power, and quality measures.
