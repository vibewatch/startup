company:
  name: "ModelBest"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    ModelBest addresses the on-device AI software layer across smartphones, PCs,
    automotive cockpits, robotics, and connected devices, where local inference
    can reduce latency, connectivity dependence, and cloud-compute usage. Public
    evidence indicates strong category growth and policy support, but it does not
    isolate ModelBest's serviceable market, obtainable share, buyer budgets, or
    attach-rate economics.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The relevant market is not all artificial intelligence, all smart-device
      revenue, or the full value of vehicles and electronics. ModelBest competes
      in the compact foundation-model, optimization, and deployment layer that
      lets capable models run on constrained local hardware in smartphones, PCs,
      automotive cockpits, robots, and connected devices. The boundary excludes
      device hardware, cloud infrastructure, application revenue unrelated to
      the embedded model, and the rest of the vehicle or automation stack.
      Status-quo substitutes include cloud-only inference, smaller task-specific
      models, OEM internal development, and shipping devices without generative
      features. This definition makes OEM product and engineering organizations
      the immediate buyers even when the ultimate payer is an enterprise customer
      or consumer buying a bundled device.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM009"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Evidence-constrained sizing"
    body: >-
      The available sizing evidence is directional rather than a usable
      TAM/SAM/SOM stack. A syndicated report cites a global edge-AI market
      estimate of RMB 321.9 billion in 2025 rising to RMB 1.2 trillion in 2029,
      while Counterpoint's accessible page title forecasts generative-AI
      smartphones at 45% of global shipments in 2026. Chinese policy reporting
      separately cites a target above 70% penetration for next-generation
      intelligent terminals by 2027. These figures measure different things:
      category revenue, shipment mix, and policy-target penetration. They cannot
      be summed, nested, or converted into ModelBest revenue without device
      volumes, eligible chip configurations, software pricing, attach rates,
      geography, and expected market share. Accordingly, company-specific SAM
      and SOM remain unquantified.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM012"
      - "CM016"
    tableRefs:
      - "TM002"
  - id: "buyers-and-adoption"
    title: "Buyer map and adoption path"
    body: >-
      Evidence points to a business-to-business adoption path led by device OEMs,
      automotive manufacturers, industrial automation groups, and
      telecommunications ecosystems rather than direct consumer acquisition.
      Reported production deployments in Changan Mazda and Geely vehicles show
      that commercialization can proceed through design wins and integration
      into a shipped product. Investments by Huichuan-linked capital and China
      Telecom also indicate potential industrial and cloud-network-edge channels,
      although investment does not prove purchase volume. More than 24 million
      reported MiniCPM downloads are a useful developer-interest signal, but they
      are not paying customers or recurring revenue. Planned development boards
      and edge boxes could shorten prototyping cycles; the available sources do
      not verify whether the mid-2026 launch plans were completed.
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      The central demand driver is economic and operational: local inference can
      reduce dependence on external servers while improving latency and offline
      operation. Industrial and state-backed investors may add distribution,
      integration expertise, and hardware access, but financing should not be
      mistaken for customer demand. Adoption still depends on OEM validation,
      suitable chips, integration cost, power and memory budgets, model quality,
      safety, and a clear end-user application. U.S. enforcement guidance for
      advanced-chip licenses covering China-headquartered entities outside China
      adds a supply-chain constraint to the broader ecosystem, even though the
      cited report does not name ModelBest. For valuation, broad category growth
      supports strategic relevance, but the absence of verified pricing, buyer
      budgets, attach rates, revenue, and renewal data prevents translating that
      relevance into a defensible revenue multiple or obtainable-market share.
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM015"
      - "CM016"
    figureRefs:
      - "FM001"
