  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "sam-som-gap"
      missingEvidence: >-
        Segment pricing, eligible device volumes, geographic scope, attach rates,
        contract duration, expected share, and a company-approved SAM/SOM bridge.
      whyItMatters: >-
        Without these inputs, broad category growth cannot be converted into
        ModelBest-addressable spend, obtainable revenue, or a valuation basis.
      diligencePath: >-
        Obtain management's bottom-up market model and reconcile it to signed OEM
        programs, contracted unit volumes, pricing schedules, and recognized revenue.
      relatedQuestionRefs:
        - "QM003"
      relatedTableRefs:
        - "TM002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "buyer-economics"
      missingEvidence: >-
        Named budget owners, procurement cycles, per-device or license pricing,
        integration fees, renewal terms, and customer concentration.
      whyItMatters: >-
        The evidence establishes plausible buyers and deployments but not the
        conversion of design wins into durable, profitable software revenue.
      diligencePath: >-
        Review a representative set of OEM contracts and interview customer
        product owners about budget source, deployment volume, and renewal criteria.
    - type: "missing-source"
      severity: "minor"
      topic: "market-sizing-methodology"
      missingEvidence: >-
        Underlying definitions, sample, currency assumptions, and methodology for
        the cited edge-AI forecast and generative-AI smartphone shipment share.
      whyItMatters: >-
        Methodology is required to test whether the estimates cover model software,
        hardware, services, or overlapping categories.
      diligencePath: >-
        Acquire the underlying analyst reports and normalize category definitions,
        geographies, periods, and units before using either estimate in valuation.
