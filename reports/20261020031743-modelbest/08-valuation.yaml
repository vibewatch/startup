callouts:
  - calloutType: recommendation
    title: Price is the unresolved variable
    body: >-
      Do not treat the reported unicorn threshold as a supported valuation. Obtain exact
      post-money terms, preference-adjusted ownership, audited operating metrics, and a target
      return model before advancing.
    claimRefs: [CV003, CV008, CV013, CV014, CV016]
