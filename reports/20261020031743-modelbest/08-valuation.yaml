  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Paid OEM scale, repeatable margins, strong retention, and manageable compute access", "No public range supportable; require a priced-round model showing target-return headroom", "Execution and financing dilution", "Audited growth plus multi-year production contracts"]
      - [Base, "Technical traction converts unevenly and additional capital is required", "No public range supportable; negotiate from verified milestones and preference-adjusted ownership", "Slow conversion and multiple compression", "Mixed renewals or delayed vehicle and device programs"]
      - [Bear, "Weak paid conversion, program delays, export friction, or punitive financing terms", "Downside cannot be bounded without liquidation waterfall and burn data", "Down round, preference overhang, liquidity failure", "Missed milestones, shortening runway, or senior capital"]
    notes: "Scenario ranges are intentionally unavailable: the pool contains no exact valuation, audited financials, cap table, or financing waterfall."
    claimRefs: [CV008, CV009, CV011, CV013, CV014, CV015, CV016]
