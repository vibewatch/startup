  - id: FU001
    title: 基于证据的客户旅程与扩张循环
    type: journey-map
    summary: 公开证据在开发者发现和两项汽车量产集成环节最强，而转化、续约和跨客群扩张仍未有报道。
    data:
      items:
        - label: 开源发现
          detail: 开发者通过 Hugging Face 和其他代码库接触 MiniCPM。
          touchpoints:
            - Hugging Face 组织
            - 开放模型下载
          value: 5,838 followers
          note: 受众信号，不是客户数。
        - label: 本地评估
          detail: 团队选择紧凑检查点和适配运行时的格式进行本地测试。
          touchpoints:
            - Ollama 页面
            - GGUF
            - MLX
            - llama.cpp
          value: Multiple deployment formats
          note: 未披露从评估到购买的转化。
        - label: 企业联合开发
          detail: OEM、芯片厂商和渠道合作伙伴将模型适配到设备工作流。
          touchpoints:
            - 汽车 OEM
            - 手机厂商
            - 电信渠道
          value: Several named relationships
          note: 试点、投资、渠道和客户角色没有被一致区分。
        - label: 生产集成
          detail: 最清晰的公开里程碑，是模型被纳入已上市的终端产品。
          touchpoints:
            - MAZDA EZ-60
            - Geely Galaxy M9
          value: 2 named vehicle models
          note: 没有公开生产量或合同分母。
        - label: 终端用户使用
          detail: 司机或设备用户与嵌入式模型互动。
          touchpoints:
            - 智能座舱交互
            - 本地多模态辅助
          value: null
          note: 活跃用户、使用率、满意度和结果指标均缺失。
        - label: 续约与扩张
          detail: 持久循环会在发布后增加模型、设备、地点或使用场景。
          touchpoints:
            - 续约
            - 跨模型扩张
            - 跨垂直领域扩张
          value: null
          note: NRR、GRR、流失、续约和扩张经济性均未披露。
    approximationNotes: 有序阶段展示的是基于证据的工作流，不是实测转化率；null 值代表公开指标不可得，而不是零。
