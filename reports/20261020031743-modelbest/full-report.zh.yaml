  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场不是全部人工智能、全部智能设备收入，也不是整车和电子产品的全部价值。ModelBest
              参与的是紧凑型基础模型、优化和部署层，让能力足够的模型可以在智能手机、PC、汽车座舱、机器人和联网设备等受限本地硬件上运行。市场边界不包括设备硬件、云基础设施、与嵌入式模型无关的应用收入，以及整车或自动化技术栈的其他部分。现状替代方案包括纯云端推理、更小的任务专用模型、OEM
              内部开发，以及不搭载生成式功能的出货设备。按此定义，即使最终付款方是购买捆绑设备的企业客户或消费者，直接买方仍是 OEM 的产品和工程组织。
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM009
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有规模证据只能给出方向，尚不足以形成可用的 TAM/SAM/SOM 体系。一份联合发布报告引用全球边缘 AI 市场规模估计：2025 年为 RMB 321.9 billion，2029 年升至 RMB 1.2
              trillion；Counterpoint 可访问页面的标题则预测，2026 年生成式 AI 手机将占全球出货量的 45%。中国政策报道另称，到 2027 年下一代智能终端渗透率目标超过
              70%。这些数字衡量的对象不同：品类收入、出货结构和政策目标渗透率。没有设备销量、符合条件的芯片配置、软件价格、搭载率、地域和预期市场份额，就不能把它们相加、嵌套或换算成 ModelBest
              的收入。因此，公司层面的 SAM 和 SOM 仍未量化。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
      - number: '2.3'
        title: 买方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据指向一条由设备 OEM、汽车制造商、工业自动化集团和电信生态主导的 B2B 采用路径，而不是直接获客。Changan Mazda 和 Geely
              车型的量产部署据报道已经落地，说明商业化可以通过设计赢单并集成进已出货产品。Huichuan 关联资本和 China Telecom
              的投资也暗示工业渠道以及云、网络、边缘渠道的可能性，但投资不等于采购量。MiniCPM 据报道累计下载量超过 2400
              万，是有用的开发者兴趣信号，但不是付费客户或经常性收入。计划中的开发板和边缘盒子或许能缩短原型周期；现有来源无法确认截至 2026 年年中的发布计划是否已经完成。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              核心需求驱动来自经济性和运营效率：本地推理可以减少对外部服务器的依赖，同时改善延迟和离线运行能力。工业及国资背景投资人可能带来分发、集成经验和硬件准入，但不能把融资误认为客户需求。采用仍取决于 OEM
              验证、合适的芯片、集成成本、功耗和内存预算、模型质量、安全性以及清晰的终端应用。美国针对先进芯片许可证的执法指引覆盖总部位于中国、但实体在境外的企业，为更广泛的生态增加供应链约束，尽管所引报道没有点名
              ModelBest。对估值而言，品类增长支持其战略相关性，但没有经过验证的价格、买方预算、搭载率、收入和续约数据，就无法把这种相关性转化为有依据的收入倍数或可获取市场份额。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
