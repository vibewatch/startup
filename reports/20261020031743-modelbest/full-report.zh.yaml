            body: >-
              ModelBest 据报道拥有战略关系、2026 年第一季度超过 RMB 1 billion 的估计融资、累计超过 24 million 的模型下载量，并暴露于持续增长的生成式 AI
              手机品类。这些是有用的韧性和需求信号，但已募集资金不等于可用现金，下载量不等于付费部署，品类预测也不等于 ModelBest
              的市场份额。所审阅的公开证据没有量化收入、毛利率、烧钱速度、现金跑道、续约、设计赢单集中度或合作伙伴经济性。如果失去合规算力准入、承诺的硬件发布失败或延迟、发生重大生产安全或安全事件，或有证据表明部署和下载无法转化为可重复的签约收入，就应触发投资论点破坏。
