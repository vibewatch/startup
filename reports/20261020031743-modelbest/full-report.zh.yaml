            title: 边缘专业化已有可信的部署信号
            body: ModelBest 将紧凑型开放模型、据报道的汽车量产部署以及云—网络—设备合作结合起来，比单纯的模型下载量更具体地通向嵌入式分发。
            calloutType: strength
            claimRefs:
              - CP003
              - CP012
              - CP014
          - type: callout
