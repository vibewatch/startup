      - number: '1.3'
        title: 融资、规模与利益相关方
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的融资节奏在 2026 年加快。2 月由 China Telecom 领投的一轮融资，以及 4 月由 Shenzhen Capital Group 和 Inovance Capital
              共同领投的一轮融资，据报道使第一季度融资额超过 RMB 1 billion。多家媒体称 4
              月融资后的投后估值跨过独角兽门槛，但指定来源均未给出具体估值、证券类型、稀释、清算优先权、债务条款或现金余额。此前融资包括 2024 年由 Primavera Venture Partners 和 Huawei
              的 Habo 领投的一轮。MiniCPM 据报道累计下载量超过 24 million，说明分发能力，不等于付费客户、收入、ARR 或可用现金。
            claimRefs:
