        title: 展示项
        blocks:
          - type: callout
            title: 市场吸引力不等于可获取市场
            body: 广泛的边缘 AI 增长、智能终端政策目标和开发者下载量支持品类相关性，但没有一项能证明 ModelBest 的价格、搭载率、付费客户数或可获取收入。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM012
              - CM013
          - type: callout
            title: 硬件准入和 OEM 认证决定落地时点
            body: 只有模型质量还不够：部署取决于合适的芯片、针对硬件的优化、OEM 验证以及集成进已出货设备；先进芯片管制还会增加生态不确定性。
            calloutType: risk
            claimRefs:
              - CM006
