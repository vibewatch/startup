  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              ModelBest 位于广泛的中国 AI 供应体系中的专业化位置，而不是一个边界清晰的同业可比组。直接的边缘模型替代方案包括 Alibaba/Qwen 和 Infinigence AI 的紧凑型产品；Baidu
              和 DeepSeek 则代表资金充足或分发广泛的基础模型老牌厂商。Unitree 等设备厂商可以把具身模型内化，买方也可以使用云 API、改造开放权重，或在内部构建任务专用模型。China AI Index
              列出了覆盖手机、PC、机器人和 IoT 的 ModelBest 模型，但同一来源也收录了许多厂商的紧凑型或开放模型。ModelBest 声称只有 Alibaba
              也提供完整的开源边缘模型家族，这可作为定位证据，但不是对所有替代方案的独立完整普查。
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 能力、产品包装与信任姿态
        blocks:
          - type: paragraph
            body: >-
              目前观察到的最强差异在部署形态，而不是绝对模型优势的证明。China AI Index 描述了一款 2.5B 参数的 ModelBest 模型，面向 PC、手机、机器人和 IoT 上的智能体场景，采用
              Apache 2.0 许可；Baidu 则称 ERNIE 5.1 以大幅更低的训练成本实现了同等规模的性能。保留的对比数据公布了几家大模型竞争者的 API token 价格，但没有 ModelBest
              所列模型的价格。因此无法进行同口径的总成本比较：开放权重或许能降低授权摩擦，但集成、设备优化、支持和硬件成本仍未知。信任同样是采购标准，因为中国 2026
              年智能体指引强调安全性、可控性、标准和协议，而不只是能力。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
