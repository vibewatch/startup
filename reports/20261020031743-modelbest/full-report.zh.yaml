    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              ModelBest 成立于 2022 年，源自清华大学自然语言处理研究生态；报道将其模型研究和训练基地置于北京，但指定来源并未证明其当前法定总部所在地。公司将 MiniCPM
              定位为紧凑型端侧模型家族，而独立报道显示，其战略是把模型嵌入手机、AI PC、智能座舱、机器人及其他受限硬件。这更像企业和 OEM
              集成模式，而非已披露的消费者订阅业务。区别很关键：部署范围已经可见，但公开定价、合同结构、经常性收入和毛利率经济性都尚未披露。
