      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              投资逻辑取决于 ModelBest 能否在更大竞争者压缩效率差距之前，把边缘专业化转化为嵌入式分发。Baidu 已在营销参数和训练成本压缩，Alibaba 是 ModelBest
              自己承认在完整边缘模型覆盖上构成竞争的厂商，而 DeepSeek 据报道获得的融资让其模型开发资金基础大得多。监管可能更偏向那些能在多个产品面上投入安全、标准和合规工作的供应商。因此，ModelBest
              的可防御资产或许是工程能力和 OEM
              集成，而不是模型规模或单纯的开源授权。反方情景是商品化：开放权重替代方案变好，硬件厂商内化模型，分发拥有者把足够好的模型捆绑到专业厂商无法匹敌的价格。完成投资判断前，必须取得实际价格、续约数据、合同条款和客户集中度，才能评估护城河是否持久。
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP013
              - CP015
              - CP016
