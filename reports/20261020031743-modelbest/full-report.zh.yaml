      - number: '8.3'
        title: 情景、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持量化的乐观、基准或悲观估值区间，因此这里用决策条件表达情景，而不制造虚假的精确度。乐观情景要求经审计的商业增长、可重复的毛利率、持久的 OEM
              项目，以及在仍能满足投资人要求回报的入场价格下，清晰的优先股堆叠。基准情景假设技术进展只能不均衡地转化，且仍需追加资本；悲观情景则由付费转化疲弱、项目延期、出口管制摩擦或将下行风险转移给新投资人的融资条款触发。经审计财务、治理披露或经过证明的公开市场同业框架，尚未证明其具备退出准备度。因此，在任何价格谈判前，最终尽调应核实收入质量、现金烧钱速度、现金跑道、客户集中度、董事会权利、股权结构表持股、优先权，以及融资到商业里程碑的桥接。
            claimRefs:
              - CV004
              - CV009
              - CV011
              - CV013
              - CV014
