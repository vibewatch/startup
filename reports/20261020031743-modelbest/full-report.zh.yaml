      - number: '7.3'
        title: 运营、质量与安全执行
        blocks:
          - type: paragraph
            body: >-
              技术记录证明了可信的小模型研究和生态兼容性，但没有证明每一种配置都具备量产级可靠性。MiniCPM 作者报告了较高的参数效率，vLLM 也记录了对若干 MiniCPM 架构的原生支持；不过，vLLM
              同时说明，官方 MiniCPM-V-2 在没有分支版本的情况下无法在该运行时工作。这一具体例外体现的是集成风险，而不是整个产品家族失败。已报道的车型部署和 2026
              年年中的硬件计划提高了回归、温度或延迟不达标、不安全输出及交付延迟的后果。要衡量缓解措施的成熟度，还需要验收测试、事故日志、召回历史、模型专项红队结果和发布后的硬件证据。
