      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑建立在三个外部可见信号上：战略和产业投资人持续为公司提供资金；媒体报道 MiniCPM 下载量超过 2400 万；汽车报道确认 Geely 和 Changan Mazda
              车型中的量产部署。Counterpoint 关于生成式 AI 手机可能在 2026 年达到全球出货量 45%
              的标题预测，为端侧需求提供了方向性支持。反向逻辑同样重要：下载量不是收入，已点名部署没有披露合同金额或留存，市场出货预测也不能证明 ModelBest 的份额。OpenAI
              自身的产品披露还说明，模型错误和对提示词的敏感性仍是整个品类的商业化风险；更严格的美国先进芯片指引则增加了与中国相关的供应和训练约束。因此，这些观察更支持按里程碑作投资判断，而不是使用收入倍数。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV015
