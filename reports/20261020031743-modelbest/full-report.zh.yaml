              - CP006
      - number: '3.3'
        title: 分发能力、切换与多归属
        blocks:
          - type: paragraph
            body: >-
              ModelBest 的分发证据多于一家纯模型初创公司：报道指出其在两款车型中实现量产使用，与 China Telecom 在云、网络和设备层合作，并推进大陆地区的 IPO 前流程。据报道累计 2400
              万下载量说明开发者触达，但不等于付费客户、留存使用或经常性收入。老牌厂商可以依靠自有渠道反击：Baidu 称 ERNIE 5.1 正在十多个内容生产智能体平台上推广，消费级 AI
              排名则按月活跃用户组织。Apache 许可的权重便于多归属和内部改造，限制了合同锁定；反过来，设备优化和 OEM 验证可能形成特定于实现的切换成本，但公开记录没有量化这一点。
            claimRefs:
