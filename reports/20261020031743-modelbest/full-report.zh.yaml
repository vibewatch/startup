        title: 里程碑与风险展望
        blocks:
          - type: paragraph
            body: >-
              里程碑序列显示，公司从 2022 年成立、2023 年天使融资，快速推进到 2024 年 2 月发布 MiniCPM，随后继续融资、实现车型部署，并在 2026 年完成达到独角兽门槛的融资。Changan
              Mazda EZ-60 和 Geely Galaxy M9 的已点名量产集成，比单纯下载量提供了更强的商业化证据。不过，独立分析指出一项结构性依赖：芯片、手机和平台厂商掌握底层硬件，也可以自建边缘 AI
              技术栈。因此，ModelBest 必须持续保持集成或模型性能优势，同时证明合同的持续性和单位经济性；截至目前，公开记录尚未解决这一问题。
