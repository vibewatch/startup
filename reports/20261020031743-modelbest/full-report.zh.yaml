      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              已披露的领导层兼具运营和学术背景。CEO Li Dahai 曾任 Zhihu 首席技术官和执行董事；联合创始人兼首席科学家 Liu Zhiyuan
              是清华大学计算机科学教授。这一组合覆盖商业化和模型研究，支持创始人与市场的匹配度，但也让公开叙事高度集中在两个人身上。指定证据没有提供当前董事会名单、委员会架构、投票控制图或完整股权结构表。因此，投资人控制权、创始人稀释、继任梯队和关联方治理都无法可靠评估。
