  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资记录支持战略兴趣，但不能用于价格发现。多篇报道称，ModelBest 在 2026 年 4 月完成了一轮数亿元人民币的融资，第一季度融资超过 RMB 1
              billion，并在融资后跨过独角兽门槛。审阅过的可用报道均未说明确切投后估值、股价、出售股权比例、清算优先权、顺位、反稀释保护或类债务义务。因此，传统的入场倍数或目标回报计算无法进行。建议应是继续研究，而不是买入：只有在管理层提供股权结构表、融资文件和经审计经营桥接后，才应推进。此前，独角兽门槛这一标题只能作为价格信号，不能证明公开证据支持该价格。置信度低、风险高，估值立场偏高，因为上行空间或许存在，但用于估值的分母缺失。
