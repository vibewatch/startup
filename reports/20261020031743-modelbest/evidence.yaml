evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue, ARR, gross margin, monthly cash burn, cash balance, customer count, retention, concentration, and
      current headcount.
    whyItMatters: >-
      Without operating metrics, financing and download signals cannot establish commercial quality, efficiency, or
      runway.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, customer cohort schedules, payroll records, and
      a cash-to-financing reconciliation.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-terms
    missingEvidence: >-
      Current legal headquarters, board and committee roster, cap table, voting rights, dilution by round, liquidation
      preferences, side letters, and debt terms.
    whyItMatters: >-
      Control, downside protection, related-party exposure, and the true economics of the 2026 valuation cannot be
      assessed from headline financing amounts.
    diligencePath: >-
      Obtain corporate registry extracts, charter documents, board minutes, the fully diluted cap table, and executed
      financing agreements.
    relatedQuestionRefs:
      - QO002
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A complete current executive roster, board membership, reporting lines, succession plan, and senior-leader
      turnover history.
    whyItMatters: >-
      The public profile is concentrated around two leaders, preventing a reliable assessment of organizational depth
      and key-person dependence.
    diligencePath: >-
      Request the current organization chart, board roster, executive biographies, attrition data, and succession plans
      for critical technical and commercial roles.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: platform-risk
    missingEvidence: >-
      Customer-side evidence on renewal, switching cost, platform exclusivity, and comparative performance versus
      device-maker internal models.
    whyItMatters: >-
      The central adverse risk is substitution by vertically integrated platforms, but the assigned evidence does not
      quantify customer durability.
    diligencePath: >-
      Interview named OEM customers and review contracts, renewal history, benchmark acceptance tests, exclusivity
      clauses, and win-loss analyses.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Segment pricing, eligible device volumes, geographic scope, attach rates, contract duration, expected share, and a
      company-approved SAM/SOM bridge.
    whyItMatters: >-
      Without these inputs, broad category growth cannot be converted into ModelBest-addressable spend, obtainable
      revenue, or a valuation basis.
    diligencePath: >-
      Obtain management's bottom-up market model and reconcile it to signed OEM programs, contracted unit volumes,
      pricing schedules, and recognized revenue.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Named budget owners, procurement cycles, per-device or license pricing, integration fees, renewal terms, and
      customer concentration.
    whyItMatters: >-
      The evidence establishes plausible buyers and deployments but not the conversion of design wins into durable,
      profitable software revenue.
    diligencePath: >-
      Review a representative set of OEM contracts and interview customer product owners about budget source, deployment
      volume, and renewal criteria.
  - type: missing-source
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: >-
      Underlying definitions, sample, currency assumptions, and methodology for the cited edge-AI forecast and
      generative-AI smartphone shipment share.
    whyItMatters: >-
      Methodology is required to test whether the estimates cover model software, hardware, services, or overlapping
      categories.
    diligencePath: >-
      Acquire the underlying analyst reports and normalize category definitions, geographies, periods, and units before
      using either estimate in valuation.
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized software, support, integration, and hardware pricing by customer and deployment, including discounts,
      minimum commitments, and gross-margin contribution.
    whyItMatters: >-
      Public API prices for cloud competitors are not comparable with an embedded-model license and cannot establish
      ModelBest's pricing power or unit economics.
    diligencePath: >-
      Review current customer contracts, invoices, price lists, support schedules, and a revenue bridge segmented by
      software license, engineering service, and hardware.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-evidence
    missingEvidence: >-
      Customer-level renewal, retention, concentration, multi-homing, implementation effort, and switching data for
      production deployments.
    whyItMatters: >-
      Download counts and named deployments do not show recurring usage, contractual lock-in, or whether buyers can
      replace ModelBest with another open model.
    diligencePath: >-
      Obtain a customer cohort export, top-20 contract schedule, renewal history, churn reasons, deployment
      architecture, and reference calls with automotive and telecom buyers.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, revenue mix, gross margin, operating expense, and cash-flow statements.
    whyItMatters: These records are required to distinguish recurring software economics from project, service, or hardware revenue.
    diligencePath: Obtain audited statements and reconcile monthly management accounts to bank records and signed customer contracts.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Customer contracts showing list price, realized price, discounts, acceptance terms, renewals, and support
      obligations.
    whyItMatters: Public deployment evidence cannot establish revenue quality, pricing power, or sales efficiency.
    diligencePath: Sample the top ten contracts and reconcile billings, collections, implementation effort, and renewal history.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
