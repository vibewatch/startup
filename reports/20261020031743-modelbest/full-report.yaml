  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The risk ranking is evidence-weighted rather than incident-driven. The only directly adverse external
              evidence in the assigned set is 2026 reporting that U.S. Commerce guidance extends advanced-chip license
              requirements to entities headquartered in China even when an entity is located abroad. That creates a
              potentially high-impact dependency risk, but the public record reviewed does not identify ModelBest's chip
              inventory, training providers, overseas entities, or license exposure. Execution risk ranks alongside it:
              ModelBest is reported across phones, PCs, cockpits, homes, robotics, production vehicles, and planned
              hardware, increasing the number of integration, quality, and channel dependencies that diligence must
              test.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Export controls are the clearest externally evidenced regulatory risk, but they are not proof that
              ModelBest currently uses restricted hardware or violates a rule. The correct underwriting response is a
              supplier-and-jurisdiction map tied to model training, fine-tuning, inference, and overseas delivery. The
              assigned evidence also does not establish privacy documentation, security certifications, AI-regulatory
              assessments, incident history, or model-license terms. Those absences matter because reported deployments
              include data-sensitive consumer endpoints and vehicles. Legal diligence should therefore verify data
              flows, software bills of materials, open-source obligations, customer indemnities, and regulatory
              ownership before treating on-device processing as a complete privacy or compliance mitigation.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR010
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR010
              - CR016
      - number: '7.3'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >-
              The technical record establishes credible small-model research and ecosystem compatibility, not
              production-grade reliability across every configuration. MiniCPM authors report strong parameter
              efficiency, while vLLM documents native support for several MiniCPM architectures; however, vLLM also
              states that the official MiniCPM-V-2 does not work in that runtime without a fork. That specific exception
              illustrates integration risk rather than a failure of the broader family. Reported vehicle deployments and
              mid-2026 hardware plans raise the consequence of regressions, thermal or latency misses, unsafe outputs,
              and delayed delivery. Acceptance tests, incident logs, recall history, model-specific red-team results,
              and post-launch hardware evidence are required to measure mitigation maturity.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
              - CR016
      - number: '7.4'
        title: Dependencies, financial model, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              ModelBest has reported strategic relationships, more than RMB 1 billion of estimated first- quarter 2026
              financing, over 24 million cumulative model downloads, and exposure to a growing generative-AI smartphone
              category. These are useful resilience and demand signals, but funding raised is not cash available,
              downloads are not paying deployments, and a category forecast does not establish ModelBest's share. Public
              evidence reviewed does not quantify revenue, gross margin, burn, runway, renewal, design-win
              concentration, or partner economics. A thesis break should be triggered by loss of compliant compute
              access, failed or delayed promised hardware, a material production safety or security event, or evidence
              that deployments and downloads do not convert into repeatable contracted revenue.
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
