          - type: callout
            title: Hardware access and OEM qualification govern timing
            body: >-
              Model quality alone is insufficient: deployment depends on suitable chips, hardware-specific optimization,
              OEM validation, and integration into a shipped device, while advanced-chip controls add ecosystem
              uncertainty.
            calloutType: risk
            claimRefs:
