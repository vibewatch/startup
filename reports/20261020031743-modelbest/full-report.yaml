      - number: '4.2'
        title: Pricing, revenue quality, and unit economics remain private
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies list pricing, realized contract pricing, revenue, ARR, gross margin, customer
              acquisition cost, payback, retention, or service-delivery cost. That prevents a defensible assessment of
              whether ModelBest earns recurring software economics, lower-margin project revenue, royalty income, or a
              blended software-and-hardware margin. Open-source downloads may widen the developer funnel, while
              production deployments may indicate commercial relevance, but neither supplies a denominator for
              conversion or a cash value. The diligence priority is a contract-to-ledger bridge by revenue stream,
              including discounts, implementation obligations, compute and support costs, warranty exposure, and the
              share of revenue tied to strategic investors or subsidized projects.
            claimRefs:
