              - CO011
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The disclosed leadership combines operating and academic credentials. CEO Li Dahai previously served as
              Zhihu's chief technology officer and executive director, while co-founder and chief scientist Liu Zhiyuan
              is a Tsinghua computer-science professor. This pairing supports founder-market fit across
              commercialization and model research, but it also concentrates the public narrative around two
              individuals. The assigned evidence does not provide a current board roster, committee structure,
              voting-control map, or complete cap table. Those omissions prevent a reliable assessment of investor
              control, founder dilution, succession depth, and related-party governance.
            claimRefs:
              - CO003
              - CO004
              - CO015
