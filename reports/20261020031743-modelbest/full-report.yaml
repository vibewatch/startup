        title: Exhibits
        blocks:
          - type: callout
            title: Financing headlines do not establish runway
            body: >-
              More than RMB1 billion of reported first-quarter financing cannot be treated as cash on hand without
              closing, net-proceeds, debt, restricted-cash, burn, and spending-plan evidence.
            calloutType: risk
            claimRefs:
              - CI003
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              ModelBest presents a broad product family rather than a single packaged application. Public descriptions
              span compact language models, multimodal and speech-capable variants, agent tooling, training and
              inference utilities, mobile applications, and announced edge hardware. The customer workflow starts with a
              model or toolkit, continues through adaptation and quantization, and ends in an application running
              locally or within an OEM system. That breadth creates several entry points for developers and device
              makers, but public evidence does not clearly separate maintained commercial SKUs from research projects,
              open-source demonstrations, or roadmap items. The investable product question is therefore not whether
              ModelBest has technical output, but which components have repeatable support, contractual service levels,
              and paid production use.
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE012
              - CE015
