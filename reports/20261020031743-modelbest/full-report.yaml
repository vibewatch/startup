chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              ModelBest was founded in 2022 and emerged from Tsinghua University's natural language processing research
              ecosystem; reporting places its model research and training base in Beijing, but the assigned sources do
              not establish a current legal headquarters. The company presents MiniCPM as a compact on-device model
              family, while independent reporting describes a strategy centered on integrating models into phones, AI
              PCs, intelligent cabins, robots, and other constrained hardware. This points to an enterprise and OEM
              integration model rather than a disclosed consumer-subscription business. That distinction matters:
              deployment breadth is visible, but public pricing, contract structure, recurring revenue, and gross-margin
              economics are not.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO014
              - CO015
