              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Pause or re-underwrite on loss of compliant compute access, a material production safety or security
              event, failure to evidence the reported mid-2026 hardware launch, or proof that downloads and deployments
              are not converting into repeatable contracted revenue.
            calloutType: risk
            claimRefs:
              - CR001
              - CR011
              - CR014
