  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              ModelBest occupies a specialist position within a broad Chinese AI supply set rather than a narrowly
              bounded peer group. Direct edge-model alternatives include compact offerings from Alibaba/Qwen and
              Infinigence AI, while Baidu and DeepSeek represent well-funded or well-distributed foundation-model
              incumbents. Device makers such as Unitree can internalize embodied models, and buyers can also use cloud
              APIs, adapt open weights, or build a task-specific model internally. China AI Index lists ModelBest models
              spanning phones, PCs, robotics, and IoT, but the same source catalogues compact or open models from many
              vendors. ModelBest's claim that only Alibaba also offers a complete open-source edge-model family is
              useful positioning evidence, not an independently verified census of every alternative.
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: Capability, packaging, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The strongest observed distinction is deployment shape, not proof of absolute model superiority. China AI
              Index describes a 2.5B-parameter ModelBest model for agentic use across PCs, phones, robotics, and IoT
              under Apache 2.0, while Baidu describes ERNIE 5.1 as achieving comparable-scale performance with sharply
              lower training cost. The retained comparison data publishes API token prices for several large-model
              competitors but none for ModelBest's listed models. That prevents a like-for-like total-cost comparison:
              open weights may reduce licensing friction, yet integration, device optimization, support, and hardware
              costs remain unknown. Trust is also a buying criterion because China's 2026 agent guidelines emphasize
              safety, controllability, standards, and protocols rather than capability alone.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP006
      - number: '3.3'
        title: Distribution power, switching, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              ModelBest has more distribution evidence than a model-only startup: reporting identifies production use in
              two vehicle models, collaboration with China Telecom across cloud, network, and device layers, and a
              mainland pre-IPO process. The reported 24 million cumulative downloads indicate developer reach, but
              downloads are not paying customers, retained usage, or recurring revenue. Incumbents can counter through
              owned channels: Baidu says ERNIE 5.1 was being rolled out on more than ten creative-production agent
              platforms, and consumer AI rankings are organized around monthly active users. Apache-licensed weights
              enable multi-homing and internal adaptation, limiting contractual lock-in; conversely, device optimization
              and OEM validation may create implementation-specific switching costs that the public record does not
              quantify.
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP011
              - CP012
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The investment case depends on ModelBest converting edge specialization into embedded distribution before
              larger rivals compress the efficiency gap. Baidu already markets parameter and training-cost compression,
              Alibaba is the competitor ModelBest itself acknowledges in full-family edge coverage, and DeepSeek's
              reported financing gives it a vastly larger capital base for model development. Regulation may favor
              vendors that can fund safety, standards, and compliance work across many product surfaces. ModelBest's
              defensible assets may therefore be engineering know-how and OEM integration rather than model size or open
              licensing alone. The adverse case is commoditization: open-weight alternatives improve, hardware vendors
              internalize models, and distribution owners bundle adequate models at prices a specialist cannot match.
              Realized prices, renewal data, contract terms, and concentration must be obtained before underwriting a
              durable moat.
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Edge specialization has credible deployment signals
            body: >-
              ModelBest combines compact open models with reported production vehicle deployments and a
              cloud-network-device collaboration, a more concrete route to embedded distribution than model-download
              counts alone.
            calloutType: strength
            claimRefs:
              - CP003
              - CP012
              - CP014
          - type: callout
            title: Commercial lock-in is not demonstrated
            body: >-
              Public sources do not disclose realized pricing, contract length, renewal, concentration, or switching
              data; open-weight substitutes and incumbent bundling could limit pricing power.
            calloutType: risk
            claimRefs:
              - CP004
              - CP015
