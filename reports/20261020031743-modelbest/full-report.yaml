  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public financing record supports strategic interest but not price discovery. Multiple reports say
              ModelBest completed an April 2026 round of several hundred million yuan, took first-quarter financing
              above RMB 1 billion, and crossed a unicorn threshold after the round. None of the reviewed usable reports
              states the exact post-money valuation, share price, ownership sold, liquidation preference, seniority,
              anti-dilution protection, or debt-like obligations. That makes a conventional entry multiple or
              target-return calculation impossible. The recommendation is therefore research-more rather than buy:
              engage only after management supplies the capitalization table, financing documents, and audited operating
              bridge. Until then, the unicorn-threshold headline is a price signal, not proof that public evidence
              supports the price. Confidence is low, risk is high, and the stance is stretched because material upside
              may exist but the denominator needed to value it is missing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on three externally visible signals. Strategic and industrial investors have repeatedly
              funded the company; media reports describe more than 24 million MiniCPM downloads; and automotive
              reporting identifies production deployment in Geely and Changan Mazda vehicles. Counterpoint's 2026
              headline forecast that generative-AI smartphones could reach 45% of global shipments gives directional
              support to on-device demand. The anti-thesis is equally important: downloads are not revenue, named
              deployments do not reveal contract value or retention, and a market shipment forecast does not establish
              ModelBest's share. OpenAI's own product disclosure also illustrates that model errors and prompt
              sensitivity remain category-wide commercialization risks, while tighter U.S. advanced-chip guidance adds a
              China-linked supply and training constraint. These observations favor milestone underwriting over a
              revenue multiple.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support numerical bull, base, or bear valuation ranges, so the scenarios are
              expressed as decision conditions rather than false precision. A bull case requires audited commercial
              growth, repeatable gross margin, durable OEM programs, and a clean preference stack at an entry price that
              still permits the investor's required return. The base case assumes technical traction converts unevenly
              and further capital is needed; the bear case is triggered by weak paid conversion, program delays,
              export-control friction, or financing terms that transfer downside to new investors. Exit readiness is not
              yet evidenced through audited financials, governance disclosures, or a demonstrated public market peer
              framework. Final diligence should therefore verify revenue quality, cash burn, runway, customer
              concentration, board rights, cap-table ownership, preferences, and the financing-to-commercial-milestone
              bridge before any price negotiation.
            claimRefs:
              - CV004
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the unresolved variable
            body: >-
              Do not treat the reported unicorn threshold as a supported valuation. Obtain exact post-money terms,
              preference-adjusted ownership, audited operating metrics, and a target return model before advancing.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV008
              - CV013
              - CV014
              - CV016
