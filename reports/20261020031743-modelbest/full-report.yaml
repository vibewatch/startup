      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production proof exists, but it is narrow
            body: >-
              MAZDA EZ-60 and Geely Galaxy M9 are stronger evidence than logos because retained sources connect MiniCPM
              to launched vehicle products. The sources still omit volumes, outcomes, contract duration, and renewal
              behavior.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU013
          - type: callout
            title: Open-source reach is not recurring revenue
            body: >-
              Reported downloads and observed followers indicate distribution and developer interest, but the retained
              record provides no bridge to paid accounts, retention, customer concentration, or customer-level revenue.
