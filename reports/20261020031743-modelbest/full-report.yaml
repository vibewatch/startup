      - number: '5.2'
        title: Compact-model and streaming architecture
        blocks:
          - type: paragraph
            body: >-
              The technical thesis is high capability per parameter and per unit of edge memory. The original MiniCPM
              work describes 1.2B and 2.4B non-embedding parameter variants, performance comparable to larger 7B-13B
              models, and a Warmup-Stable-Decay learning-rate schedule intended to support continuous training and
              domain adaptation. MiniCPM-o 4.5 extends that thesis to a 9B omni-modal model that can perceive and
              respond at the same time. Its disclosed Omni-Flow framework aligns inputs and outputs on a shared temporal
              axis, while the paper reports real-time full-duplex operation on devices using less than 12GB of RAM.
              These are author-reported research results, not independently reproduced deployment benchmarks.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE010
              - CE014
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
              - CE014
              - CE015
      - number: '5.3'
        title: Deployment maturity and ecosystem dependencies
        blocks:
          - type: paragraph
            body: >-
              The public developer surface is active and materially broader than a paper-only model program. The OpenBMB
              organization page showed current updates across agent, mobile, retrieval, robotics, and edge-cloud
              projects on the run date, while the company described native mobile operating-system support and multiple
              inference and quantization formats for MiniCPM-V 4.6. Chinese financial reporting also attributed more
              than 24 million cumulative downloads to the MiniCPM family and named production vehicle deployments. Those
              indicators support ecosystem reach, but downloads are not active deployments or revenue. Automotive use
              also introduces dependencies on sensors, connectivity, compute, hardware-software integration, and OEM
              validation that sit outside the model itself.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
              - CE016
      - number: '5.4'
        title: Trust, reliability, and roadmap gaps
        blocks:
          - type: paragraph
            body: >-
              Public materials use trust-oriented language but do not supply an auditable control plane. ModelBest
              described AgentDock as a secure and extensible tool sandbox, yet the assigned evidence contains no
              security architecture, independent penetration test, certification, privacy policy for model telemetry,
              incident history, model-card safety evaluation, or uptime record. The same distinction applies to roadmap
              maturity: April reporting said Songguo Pi and EdgeClaw Box were planned for mid-2026, but the retained
              pool does not verify launch, shipment, support terms, or production volumes as of the run date. Investment
              diligence should require product-by-product release status, supported hardware matrices, failure-rate and
              latency distributions, vulnerability management, data-handling boundaries, and customer acceptance
              criteria.
            claimRefs:
              - CE011
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence is strongest at the model layer
            body: >-
              Public papers and repositories support the compact-model and developer-surface thesis, but they do not
              establish enterprise-grade reliability, security certification, hardware availability, or service-level
              performance.
            calloutType: risk
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE011
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              ModelBest appears to serve two different populations that should not be conflated: enterprise device
              makers buying or integrating edge-model capability, and developers consuming open models and deployment
              packages. Dealroom describes the enterprise client base as spanning AI phones and PCs, smart cockpits,
              smart homes, and embodied robotics, and names Huawei, MediaTek, Lenovo, Intel, and Great Wall Motor as
              strategic partners in the revenue model. Company-originated reporting adds Geely, Changan, Volkswagen, and
              Huawei, but generally does not identify the buyer, payer, contract value, or deployed volume. Automotive
              is therefore the only segment with named production products in the retained evidence. Developer activity
              on Hugging Face and an Ollama distribution page creates a broad evaluation funnel, but those users are not
              necessarily paying customers. Public-sector and industrial channels are suggested by China Telecom and
              Inovance-linked investor relationships, yet no customer-level commercial terms are disclosed.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU014
      - number: '6.2'
        title: Adoption trajectory and production proof
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is product-specific rather than account-count based. A December 2025
              report says the MAZDA EZ-60 was the first mass-produced vehicle built with the on-device model
              collaboration and that Geely's Galaxy M9 launched globally with a MiniCPM multimodal model. Three April
              2026 reports repeat a cumulative 24 million-download milestone across GitHub and Hugging Face, while the
              current Hugging Face organization page independently displays 5,838 followers. These metrics demonstrate
              awareness, experimentation, and distribution, but neither downloads nor followers establish active
              production usage, paid conversion, or retention. The pool contains no account denominator,
              deployment-volume series, utilization measure, or outcome comparison. Adoption should therefore be read as
              a combination of two named automotive production references and a much broader, non-monetized developer
              funnel, not as a disclosed customer-growth curve.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
      - number: '6.3'
        title: Named-reference quality and durability
        blocks:
          - type: paragraph
            body: >-
              Changan Mazda and Geely provide the best reference quality because the retained sources tie MiniCPM to
              launched vehicle models. Even for these references, there are no disclosed unit volumes, attach rates,
              contract duration, renewal terms, user outcomes, or expansion economics. Huawei, Volkswagen, global phone
              makers, China Telecom, and other strategic counterparties are described as deep collaborations or business
              coordination, but the public evidence does not distinguish paid production, pilot, co-development,
              investment, or channel activity. CaproAsia's August 2026 profile still uses only a general ambition to
              expand with global partners, illustrating that fresher coverage has not closed the customer-detail gap.
              The named-reference set is therefore a sample of public relationships, not an exhaustive customer roster,
              and logos or partnerships should not be treated as proof of recurring revenue or durable deployment.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
              - CU010
              - CU011
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              No retained source reports gross or net revenue retention, churn, renewal rate, contract length,
              satisfaction, paying-customer count, top-customer share, or customer-level revenue. That absence is not
              evidence of poor retention; it is a material diligence gap that prevents a durability or concentration
              judgment. The visible commercialization proof is concentrated in automotive, and multiple relationships
              also overlap with investors or ecosystem partners, which raises a classification question: strategic
              alignment may accelerate distribution, but it does not by itself demonstrate arm's-length demand. An
              industry source quoted by Eastmoney recommended focusing on vertical use cases and avoiding a solution
              searching for a problem, a direct warning that broad technical reach may not translate into repeatable
              applications. Investment underwriting should require a customer ledger separating pilots, production
              deployments, paid licenses, channel-sourced accounts, renewals, and expansion before assigning value to
              the broader partnership list.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
