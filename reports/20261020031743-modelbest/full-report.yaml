              - CO015
      - number: '1.3'
        title: Financing, scale, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              ModelBest's financing cadence accelerated in 2026. A February round led by China Telecom and an April
              round co-led by Shenzhen Capital Group and Inovance Capital reportedly took first-quarter financing above
              RMB 1 billion. Multiple outlets described the April post-money valuation as crossing the unicorn
              threshold, but none of the assigned sources supplies the exact valuation, security type, dilution,
              liquidation preferences, debt terms, or cash balance. Earlier financing included a 2024 round led by
              Primavera Venture Partners and Huawei's Habo. Reported MiniCPM downloads above 24 million show
              distribution, not paying customers, revenue, ARR, or cash available.
