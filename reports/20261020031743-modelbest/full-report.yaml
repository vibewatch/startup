  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial surfaces are visible, but revenue conversion is not
        blocks:
          - type: paragraph
            body: >-
              Public reporting identifies several potential monetization surfaces: embedded automotive deployments,
              broader device-OEM relationships, commercialization of on-device models, and planned hardware.
              ModelBest-linked reporting also cites 24 million cumulative MiniCPM downloads and production use in named
              vehicle models. These are useful adoption and distribution signals, not revenue measures: the sources do
              not disclose whether contracts are licenses, per-device royalties, engineering fees, usage charges,
              hardware sales, or strategic pilots. They also do not quantify paying customers, contracted volume,
              renewal, recognized revenue, or customer concentration. Underwriting should therefore treat the apparent
              model as a set of plausible revenue channels rather than a verified revenue mix.
            claimRefs:
