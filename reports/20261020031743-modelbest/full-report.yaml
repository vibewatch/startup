        title: Milestones and risk outlook
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a rapid move from a 2022 founding and 2023 angel financing into the February
              2024 MiniCPM release, subsequent fundraising, vehicle deployments, and a 2026 unicorn-threshold financing.
              Named production integrations in the Changan Mazda EZ-60 and Geely Galaxy M9 provide stronger
              commercialization evidence than download counts alone. However, independent analysis identifies a
              structural dependency: chip, handset, and platform vendors control the underlying hardware and can build
              their own edge-AI stacks. ModelBest therefore must sustain an integration or model-performance lead while
              proving contract durability and unit economics; the current public record does not yet resolve that test.
