              - CI016
      - number: '4.3'
        title: Fresh capital is documented; adequacy and runway are not
        blocks:
          - type: paragraph
            body: >-
              Multiple April reports said ModelBest raised more than RMB1 billion across two first-quarter 2026
              financings and crossed the unicorn valuation threshold. A separate company-linked financing report said
              proceeds would fund on-device-model research and commercialization. Those facts establish access to
              capital, but funding raised is not cash available: none of the retained sources discloses closing dates,
              net proceeds, cash on hand, monthly burn, debt, restricted cash, working-capital needs, hardware inventory
              commitments, or runway. The mix of state-backed and industrial investors may improve strategic access, yet
              it does not resolve financing dependency. A primary cash bridge and 24-month operating plan are required
              before concluding the latest rounds adequately fund the commercialization plan.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal is that investors continued to fund ModelBest while reported deployments and
              model adoption expanded. The strongest caution is that Caixin reported pre-IPO tutoring and described a
              potential STAR Market route for unprofitable technology companies. That route is not proof of current
              losses or listing completion, but it is adverse context against assuming near-term profitability. A peer
              financing benchmark also shows that headline capital and valuation can be shaped by governance and
              investor-rights structures, making ModelBest's own preference stack and dilution material. Until
              management provides audited financials, customer-level revenue evidence, gross-margin cohorts, and a cash
              runway bridge, revenue quality, margin path, and capital sufficiency remain un-underwritable rather than
              merely conservative.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI011
              - CI012
              - CI013
