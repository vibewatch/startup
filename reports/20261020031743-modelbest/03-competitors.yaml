      - Public scale or funding evidence
      - Target segment
      - Observed differentiation
      - Evidence limitation
    rows:
      - [ModelBest, "Direct edge-model specialist", "2.5B September 2026 model; reported 24M cumulative downloads", "Phones, PCs, vehicles, robotics, IoT", "Compact open models plus device and OEM integration", "Downloads and deployment examples do not disclose paying customers or revenue"]
      - [Alibaba / Qwen, "Platform incumbent and direct edge alternative", "China AI Index lists multiple compact and open-weight models", "Cloud, developers, devices, autonomous driving", "Broad model family and distribution ecosystem", "Retained evidence does not isolate edge-model revenue or contract terms"]
      - [Baidu / ERNIE, "Platform incumbent", "ERNIE 5.1 company-reported at about 6% of comparable-model pre-training cost", "Enterprise, agents, creative applications", "Owned platform distribution and efficiency claims", "Performance and cost claims are issuer-reported, not an independent benchmark"]
      - [DeepSeek, "Frontier open-model incumbent", "Reported RMB50B-plus round and valuation above US$50B", "Developers, API users, enterprises", "Large capital base and open-source customization", "Funding is not revenue, cash available, or edge deployment proof"]
      - [Infinigence AI, "Direct compact-model alternative", "China AI Index lists a 3x7B-expert model with 3B active parameters", "On-device and edge deployment", "Compact Apache 2.0 open-weight architecture", "No pricing, adoption, or current funding evidence in the retained source"]
      - [Unitree Robotics, "Integrated-device substitute / likely entrant", "China AI Index lists an onboard G1 humanoid model", "Robotics buyers", "Hardware ownership and vertically integrated deployment", "No like-for-like commercial model or external customer evidence in the retained source"]
    notes: >-
      Scale indicators use different units and are not comparable: model parameters, downloads,
      financing, and deployment examples are shown as sourced signals, not as a common ranking.
    claimRefs: [CP003, CP006, CP009, CP010, CP011, CP012, CP013]
  - id: TP002
    title: Capability and route-to-market matrix
    columns:
      - Buying criterion
      - ModelBest
      - Baidu / ERNIE
      - DeepSeek
      - Alibaba / Qwen
      - Unitree
    rows:
      - ["Compact on-device focus", "Supported: phones, PCs, vehicles, robotics, IoT", "Unknown in retained evidence", "Unknown in retained evidence", "Supported for selected compact models", "Supported on own robot hardware"]
      - ["Open-weight availability", "Supported: Apache 2.0 examples", "Unknown for ERNIE 5.1 in retained evidence", "Supported: described as open-source", "Supported for selected Apache 2.0 models", "Supported for the cited March 2026 model"]
      - ["Multimodal or embodied scope", "Supported across multimodal and VLA entries", "Broad agent and reasoning scope; edge posture unknown", "Multimodal entries exist; edge posture unknown", "Multimodal and autonomous-driving entries exist", "Embodied VLA on owned hardware"]
      - ["Public API token pricing", "Unknown for listed models", "Published for an index-listed model", "Published for index-listed models", "Published for selected index-listed models", "Not applicable or unknown in retained evidence"]
      - ["Distribution evidence", "Two reported production vehicles plus telecom collaboration", "Company says rollout spans more than ten creative platforms", "Large reported financing; deployment proof not retained", "Broad portfolio; specific edge customer proof not retained", "Vertically integrated through Unitree hardware"]
    notes: >-
      “Supported” means the retained source explicitly records the capability; “unknown” does not
      mean absent. Vendor benchmark and efficiency statements remain company claims.
    claimRefs: [CP002, CP003, CP004, CP006, CP007, CP008, CP012, CP013]
  - id: TP003
    title: Public pricing and packaging signals
    columns:
      - Vendor / model signal
      - Public list price in retained evidence
      - Packaging or license
      - What is included
      - Underwriting implication
    rows:
      - [ModelBest, "Not disclosed for listed models", "Apache 2.0 on selected models", "Downloadable edge models; service and support terms unknown", "Request realized software, support, integration, and hardware economics"]
      - ["Baidu ERNIE 5.1", "US$0.59 input / US$2.65 output per 1M tokens", "Hosted access in the index; official page promotes web and AI Studio access", "128K context listed by China AI Index", "Cloud list price is not directly comparable with an embedded license"]
      - ["DeepSeek September 2026 edge/agent model", "US$0.15 input / US$0.60 output per 1M tokens", "Apache 2.0 listed", "1M context listed by China AI Index", "Low API pricing can cap willingness to pay for general tasks"]
      - ["Alibaba compact and flagship entries", "Ranges from unavailable to US$2.00 input / US$6.00 output per 1M tokens in cited entries", "Mix of Apache 2.0, API-only, and planned open weights", "Different modalities and model sizes", "Portfolio breadth enables bundling but prevents a single like-for-like price"]
      - ["Infinigence AI / Unitree", "Not disclosed", "Apache 2.0 for cited Infinigence model; Unitree model described as open-source", "Compact edge or device-integrated models", "Open alternatives increase multi-homing and internal-build leverage"]
    notes: >-
      Prices are public index snapshots, not realized contract prices; currencies, dates, model
      classes, hosting, support, and hardware costs differ. “Not disclosed” means absent from the
      retained evidence, not necessarily unavailable commercially.
    claimRefs: [CP003, CP004, CP006]
figures:
  - id: FP001
    title: "Evidence-backed positioning map: edge specialization versus distribution power"
    type: quadrant
    summary: >-
      Ordinal x scores reflect edge/on-device specialization and y scores reflect evidenced
      distribution or channel power; the map is not a benchmark of model quality.
    data:
      points:
        - label: ModelBest
          x: 5
          y: 4
          detail: "Specialist edge portfolio with reported automotive production and telecom collaboration."
        - label: Baidu / ERNIE
          x: 2
          y: 5
          detail: "Broad foundation-model platform with issuer-reported rollout across more than ten creative platforms."
        - label: DeepSeek
          x: 2
          y: 4
          detail: "General open-model competitor with a very large reported financing round but no retained edge deployment proof."
        - label: Alibaba / Qwen
          x: 3
          y: 5
          detail: "Broad open and hosted portfolio; identified by ModelBest as the other full-family edge competitor."
        - label: Infinigence AI
          x: 5
          y: 2
          detail: "Compact edge-model focus with limited retained distribution evidence."
        - label: Unitree
          x: 5
          y: 3
          detail: "On-device embodied model distributed through the vendor's own robot hardware."
    approximationNotes: >-
      Analyst ordinal scores use a 1–5 scale based only on the cited product, funding, deployment,
      and channel evidence. They are directional judgments, not measured market shares or benchmark
      results, and unknown evidence is scored conservatively.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP009, CP012, CP013, CP014, CP015]
callouts:
  - calloutType: strength
    title: Edge specialization has credible deployment signals
    body: >-
      ModelBest combines compact open models with reported production vehicle deployments and a
      cloud-network-device collaboration, a more concrete route to embedded distribution than
      model-download counts alone.
    claimRefs: [CP003, CP012, CP014]
  - calloutType: risk
    title: Commercial lock-in is not demonstrated
    body: >-
      Public sources do not disclose realized pricing, contract length, renewal, concentration, or
      switching data; open-weight substitutes and incumbent bundling could limit pricing power.
    claimRefs: [CP004, CP015, CP016]
