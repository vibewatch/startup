companyProfile:
  summary: >-
    Founded in 2022 from the Tsinghua natural-language-processing ecosystem, ModelBest develops compact on-device models
    and supporting developer tools. Its public commercialization evidence is strongest in two named automotive
    production programs, while reported financing and open-source adoption show ecosystem interest without establishing
    durable revenue or unit economics.
