              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category Creation vs. Reseller Margin Realities
            body: >-
              Airalo successfully established consumer awareness for international travel eSIMs, but as a digital
              reseller purchasing wholesale capacity from underlying carriers, it remains structurally subject to mobile
              network operator economics. Without proprietary physical network assets, long-term valuation multiples
              must reflect wholesale distributor economics rather than pure software gross margins.
            calloutType: insight
            claimRefs:
              - CV004
              - CV008
              - CV010
          - type: callout
            title: Confirmatory Diligence Gating Criteria
            body: >-
              Prospective investors should maintain a disciplined Track stance until management provides audited carrier
              wholesale rate schedules, cohort-level repeat purchase retention rates, and the definitive Series C
              certificate of incorporation. Capital deployment at or above the $1 billion headline valuation requires
              empirical proof that gross margins exceed 45% and that senior preference overhang does not compromise
              junior equity returns.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV012
