        title: Exhibits
        blocks:
          - type: callout
            title: The Dual Dynamics of Consumer Friction and Loyalty
            body: >-
              Airalo's core consumer value proposition delivers high immediate utility by converting the stressful
              arrival experience into an instantaneous connection. However, the absence of voice/SMS support and
              reliance on fixed data caps create user friction when travelers require local calling or exhaust
              allowances mid-trip, highlighting why the 2025 launch of Unlimited plans is a critical lever for customer
              expansion.
            calloutType: insight
            claimRefs:
