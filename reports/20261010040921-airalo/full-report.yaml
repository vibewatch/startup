        title: Exhibits
        blocks:
          - type: callout
            title: Thick MNA Decoupling Enables Rapid Global Expansion at Latency Cost
            body: >-
              By leveraging IPX Hub Breakout and wholesale base-operator agreements (Singtel, Orange, Play), Airalo
              bypasses slow country-by-country MNO negotiations. However, routing traffic through third-party packet
              gateways (such as Packet Host in Amsterdam and Virginia) introduces a 64% median latency penalty over
              native networks, with 14.5% of roaming connections exceeding 150 ms.
            calloutType: insight
