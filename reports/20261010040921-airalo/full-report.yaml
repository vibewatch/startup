      - number: '8.3'
        title: Scenario Analysis and Return Profiles
        blocks:
          - type: paragraph
            body: >-
              To model Airalo's forward equity value across varying operating trajectories, we construct a tripartite
              scenario framework over a 24-month investment horizon. In the bull case (25% probability), Airalo
              leverages its 30 million user footprint to negotiate 15% to 20% wholesale carrier rate reductions while
              rapidly scaling enterprise B2B corporate partnerships, expanding gross margins to 55%+ and commanding a
              $1.8 billion to $2.2 billion valuation. In the base case (50% probability), retail customer growth
              compounds at a stable 25% to 35% annual rate, balanced against modest price erosion from budget
              competitors and persistent marketing costs, supporting an equity value between $1.1 billion and $1.3
              billion. In the bear case (25% probability), tier-one mobile network operators bundle international
              roaming directly into consumer mobile plans or restrict third-party wholesale bandwidth, driving price
              wars that compress blended gross margins below 25%. Under this downside pressure, multiples contract
              toward asset-light distributor peers, resulting in an implied valuation of $450 million to $600 million.
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
