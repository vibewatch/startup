              Empirical measurements demonstrate that Airalo's bandwidth is determined primarily by visited operator
              throttling policies rather than routing topology, yielding wide performance swings (e.g., 22 Mbps in
              Germany versus 112 Mbps in Spain under identical Play Poland provisioning).
