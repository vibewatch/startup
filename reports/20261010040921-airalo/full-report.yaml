              Airalo's executive leadership combines consumer platform development experience with global
              telecommunications commercialization capabilities [CO001]. Chief Executive Officer Ahmet Bahadir Ozdemir
              provides overall corporate strategy and leads institutional financing rounds, while Chief Operating
              Officer Abraham Burak oversees carrier partnerships, multinational platform infrastructure, and
              distributed remote teams [CO001, CO003]. Co-founder Duran Akcaylier architected the original web
