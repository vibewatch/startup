  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization Channels
        blocks:
          - type: paragraph
            body: >-
              Airalo derives the vast majority of its commercial volume from direct-to-consumer digital transactions,
              selling prepaid travel eSIM data bundles to international travelers across more than 200 geographic
              destinations. The company reported expanding its cumulative user base from 20 million to 30 million
              registered customers in approximately one year, driven by accelerating global adoption of digital eSIM
              connectivity over physical plastic SIM cards. Beyond self-serve consumer applications on iOS and Android,
              Airalo operates an enterprise arm called Airalo Partners that provides centralized billing for corporate
              travel teams alongside wholesale connectivity APIs for travel platforms, airlines, and financial
              applications. The introduction of unlimited data plans in late 2025 across 150 destinations expanded
              catalog volume by 193%, yet realized blended revenue realization and active transactional customer counts
              remain undisclosed.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI007
      - number: '4.2'
        title: Pricing Architecture and Cross-Destination Yields
        blocks:
          - type: paragraph
            body: >-
              Airalo structures retail pricing across three distinct catalog tiers: local single-country plans, regional
              multi-country packages, and global roaming bundles. Entry-level pricing starts at $4.50 for a 1GB
              seven-day package in primary tourist destinations including Japan, the United Kingdom, and the United
              States, providing a low-friction customer acquisition hook for first-time travelers. As data allocations
              scale to 10GB or 20GB, unit pricing drops toward $1.90 to $2.60 per GB for popular corridors, while
              regional and multi-destination global plans command premium rates ranging from $5.90 to $9.00 per GB.
              Independent academic measurement across 219 served countries confirmed a median retail price of $7.90 per
              GB, placing Airalo in the upper pricing quartile compared to alternative marketplace aggregators.
            claimRefs:
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
      - number: '4.3'
        title: Cost Structure, Unit Margins, and Operational Friction
        blocks:
          - type: paragraph
            body: >-
              Airalo functions structurally as a thick Mobile Network Aggregator rather than an infrastructure-owning
              telecommunications operator, sourcing wholesale cellular capacity from six core base mobile network
              operators such as Play Poland to provision roaming access globally. This asset-light architecture avoids
              spectrum licenses and physical cell tower capital expenditure but introduces significant cost sensitivity
              to underlying carrier wholesale data pricing and transit gateway fees. On the operational ledger, customer
              terms restrict refund rights to a 14-day window that terminates upon plan activation, and voluntary
              cancellations default to non-cash in-app Airmoney credits rather than cash refunds, effectively preserving
              working capital. Concurrently, customer support overhead has expanded, with user complaints documenting
              reliance on an automated AI chatbot and 24 to 48 hour delays for human agent dispute resolution across its
              network of 22 disclosed third-party operational subprocessors.
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI006
              - CI011
              - CI012
      - number: '4.4'
        title: Capital Adequacy, Corporate Structure, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Airalo significantly fortified its balance sheet in July 2025 by securing a $220 million Series C
              financing round led by private equity sponsor CVC alongside Peak XV Partners and Antler, raising total
              historical equity funding to $287 million at a $1 billion valuation. Corporate operations are structured
              across two principal corporate entities: AIRGSM PTE. LTD. in Singapore managing international operations
              and AIRGSM HOLDINGS, INC. in Delaware serving as the primary holding company. However, because Airalo
              remains a private entity without public regulatory filings, critical underwriting inputs—including
              recognized annual recurring revenue, gross margin waterfalls, carrier wholesale payables, and forward cash
              burn—remain confidential. Diligence requires audited financial verification before underwriting capital
              adequacy at current unicorn valuation marks.
            claimRefs:
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Downside Exposure from Carrier Wholesale Pricing Power and Opaque Gross Margins
            body: >-
              Airalo operates without owning underlying cellular infrastructure or spectrum, functioning as a Mobile
              Network Aggregator dependent on wholesale capacity sponsored by base MNOs. Because realized carrier data
              contracts, volume discount tiers, and customer refund leakage remain undisclosed, gross margins are highly
              sensitive to wholesale rate increases by dominant telecommunications operators and potential shifts toward
              direct carrier eSIM offerings.
            calloutType: risk
            claimRefs:
              - CI006
              - CI010
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture & Customer Delivery Model
        blocks:
          - type: paragraph
            body: >-
              Airalo delivers global mobile data connectivity through a software-orchestrated eSIM marketplace spanning
              consumer applications and enterprise B2B partner platforms. For retail travelers, the company offers
              downloadable eSIM profiles across more than 200 geographic destinations, categorized into
              single-destination local plans, regional multi-country packages (such as Eurolink and Asialink), and
              global bundles. The consumer workflow is executed entirely within Airalo's mobile applications (iOS and
              Android) or web portal, allowing users to select a destination, procure a data allotment, and install the
              eSIM profile directly onto compatible hardware via Remote SIM Provisioning (RSP) before departure or upon
              arrival. In addition to capped packages, the company introduced unlimited data plans across 150
              destinations in late 2025, which experienced rapid adoption with 193% growth heading into 2026. On the
              commercial side, Airalo provides a B2B partner integration suite that includes a RESTful Partner API,
              pre-built client SDKs, and a turnkey WooCommerce plugin that allows digital travel agencies, airlines, and
              financial platforms to embed eSIM provisioning into their checkout flows in under thirty minutes. These
              enterprise tools enable programmatic inventory management, automated eSIM order generation, balance
              top-ups, and webhook-driven consumption alerting across more than 6,500 integrated corporate partners.
            claimRefs:
              - CE003
              - CE005
              - CE012
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE005
              - CE012
              - CE013
      - number: '5.2'
        title: End-to-End Traveler Workflow & Carrier Selection
        blocks:
          - type: paragraph
            body: >-
              The core customer workflow solves the friction, unpredictable expense, and administrative complexity
              historically associated with international carrier roaming and physical SIM card acquisition. Prior to
              international travel, an end-user browses Airalo's digital catalog, selects an appropriate data tier
              (ranging from 1 GB up to unlimited allocations), and initiates installation through an on-screen prompt or
              QR code. Unlike physical travel SIMs that require airport store queues, passport registration, or manual
              tray extraction, Airalo's software provisioning stores multiple digital profiles directly on the device's
              embedded chip. Once the traveler lands in the destination country, the device connects to an underlying
              visited Mobile Network Operator (v-MNO) governed by Airalo's wholesale carrier agreements. In Germany, for
              example, Airalo plans connect to Telefonica's O2 network with full-speed hotspot tethering enabled,
              presenting a distinct operational profile compared to competing travel providers like Holafly, which
              relies on Vodafone or O2 while frequently blocking mobile hotspot sharing on its unlimited tiers. However,
              because Airalo operates primarily as an aggregator rather than a facility-based operator, subscriber
              throughput is strictly governed by the local radio access network policies, traffic shaping, and
              congestion controls enforced by the visited carrier, resulting in meaningful performance variations across
              different European and international markets.
