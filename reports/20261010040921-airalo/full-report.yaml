chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Headline Scale
        blocks:
          - type: paragraph
            body: >-
              Airalo was founded in 2019 by serial entrepreneur Ahmet Bahadir Ozdemir and operator Abraham Burak as a
              digital travel eSIM marketplace, incorporated in Delaware and managed primarily from operational
              headquarters in Singapore [CO001]. The platform eliminates legacy international roaming charges by
              enabling inbound travelers to purchase and download local and regional data packages directly to
              eSIM-compatible smartphones and tablets across more than 200 geographic destinations [CO001, CO011]. From
              initial pre-seed and seed financing in 2019, the business scaled rapidly through successive equity
              financings, achieving unicorn status in July 2025 following a $220M Series C round led by CVC Capital
              Partners at a $1B post-money valuation [CO004, CO007]. That valuation was predicated on $59M in disclosed
              annual revenue, reflecting a 16.9x multiple [CO008]. Independent intelligence from Growjo estimated
              headcount at 331 employees with annual revenue around $58.9M [CO009]. In June 2026, Airalo reported
              surpassing 30 million cumulative customers worldwide, underscoring substantial top-of-funnel customer
              adoption, although recurring purchase retention and cohort-level unit economics remain closely held by
              management [CO010].
