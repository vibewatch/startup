      - number: '6.4'
        title: Customer Journey, Retention Loops, and Friction Points
        blocks:
          - type: paragraph
            body: >-
              The customer journey for Airalo users begins in high-intent discovery channels, where prospective
              travelers seek affordable data connectivity under immediate travel pressure. The mobile-first checkout
              experience provides immediate digital eSIM delivery and profile installation via QR codes or direct in-app
              configuration, eliminating physical SIM card logistics. While customer sentiment praises seamless arrival
              connectivity, independent testing highlights material product boundaries: Airalo eSIMs provide mobile data
              only, omitting native cellular voice calls and SMS capabilities, while entry-level packages carry finite
              allowances (1 GB to 20 GB) requiring proactive in-trip top-ups. Furthermore, the episodic nature of
              leisure vacations presents structural retention challenges, requiring continuous investment in app store
              acquisition to offset dormant user intervals.
            claimRefs:
