      - number: '1.4'
        title: Operational Milestones, Product Innovation, and Execution Challenges
        blocks:
          - type: paragraph
            body: >-
              Between 2019 and 2026, Airalo transitioned from an experimental travel utility into the global reference
              platform for consumer and enterprise travel eSIMs [CO001, CO011]. Commercial execution progressed from
              catalog expansion across 190+ jurisdictions post-Series A to launching the Airalo Partners B2B
              connectivity infrastructure during Series B [CO005, CO006]. In Q3 2025, Airalo introduced Unlimited data
              packages across 150 destinations, subsequently reporting a 193% surge in adoption among data-intensive
              travelers [CO012]. Global consumer penetration culminated in surpassing 30 million cumulative users in
              June 2026, supported by continuous device hardware proliferation where eSIM adoption is rapidly replacing
              physical SIM cards [CO007, CO010]. However, rapid customer scaling has exposed notable operational
              friction: Trustpilot user reviews as of September 2026 persistently highlight eSIM activation failures,
              delayed customer support responses, and setup complications [CO013]. Simultaneously, expanding into
              enterprise connectivity and international carrier reseller arrangements requires formalized public affairs
              capabilities to navigate telecommunications licensing mandates and cross-border consumer regulations
              [CO014].
