      - number: '8.4'
        title: Exit Readiness and Final Recommendation
        blocks:
          - type: paragraph
            body: >-
              Airalo's ultimate liquidity path hinges on its transition from a transaction-heavy consumer marketplace
              into a software-integrated enterprise connectivity utility. Potential exit routes include a public market
              listing on an international exchange or a strategic buyout by a global telecommunications conglomerate or
              travel tech ecosystem operator. However, public readiness remains constrained by limited visibility into
              repeat purchase cohorts, organic customer acquisition costs, and governance provisions established in the
              CVC-led financing round. Balancing undisputed global brand leadership against opaque carrier cost
              economics and downside risk, our investment stance is designated as Track with a High risk rating and Fair
              valuation stance. Upgrading this posture to an actionable investment requires confirmatory diligence
              access to audited unit economics, wholesale rate agreements, and certificate of incorporation preference
              waterfalls.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV014
