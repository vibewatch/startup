      - number: '6.2'
        title: Adoption Trajectory and Cumulative Scale
        blocks:
          - type: paragraph
            body: >-
              Airalo has demonstrated rapid cumulative user growth since launching in 2019, scaling from 10 million
              registered users in May 2024 to 20 million in mid-2025 and surpassing 30 million customers by June 2026.
              This trajectory reflects broader structural tailwinds in mobile telecommunications, including rising
              global consumer awareness of digital SIM technology and increasing hardware penetration across modern
              smartphones. Product mix evolution has accompanied this expansion: following the introduction of Unlimited
              data plans across 150 destinations in late 2025, adoption of unlimited tiers surged by 193% over
              subsequent quarters. However, external analysts note that cumulative user counts obscure active billing
              accounts, as intermittent travelers often generate single transactions without establishing predictable
              recurring revenue.
