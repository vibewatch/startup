      - number: '3.2'
        title: Product breadth is defensible; price leadership is not established
        blocks:
          - type: paragraph
            body: >-
              Airalo has widened its catalog beyond fixed data bundles: it reports unlimited plans in 150 destinations,
              select data-text-voice packages, and bundle sizes from 1 GB through 30-day unlimited products. That
              reduces the gap with unlimited specialists, yet rivals continue to differentiate on custom duration and
              allowance, persistent profiles, daily high-speed tiers, hotspot policies, and low entry prices. Published
              price comparisons are directional rather than conclusive because most were issued by the competing vendor,
              and plan country count, validity, network, and fair-use rules differ. The October VoyaSIM comparison is
              the closest matched data point in the pool, but it remains a competitor-authored observation rather than
              an independent transaction-level benchmark.
            claimRefs:
              - CP002
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
              - CP016
      - number: '3.3'
        title: Distribution power lowers acquisition friction, not multi-homing
        blocks:
          - type: paragraph
            body: >-
              Airalo's competitive strength extends beyond the consumer app. The company describes enterprise budget
              controls, white-label stores, APIs, reseller tools, and vouchers, while its public site advertises
              round-the-clock multilingual support. These surfaces can embed Airalo in employer and partner workflows
              and may lower repeat-purchase friction. They do not, however, create hard technical lock-in for the
              traveler. VoyaSIM states that its profile can coexist with an Airalo profile and that the user can select
              the active data line in device settings; eSimphony similarly competes by changing profile persistence
              rather than the underlying job. Loyalty balances, service history, partner placement, and onboarding
              familiarity are therefore more plausible switching costs than exclusive device control.
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP015
      - number: '3.4'
        title: Scale funds iteration, while catalog convergence pressures the moat
        blocks:
          - type: paragraph
            body: >-
              Airalo announced a $220 million investment at a valuation above $1 billion, giving it resources to invest
              in support, product breadth, enterprise distribution, and customer acquisition. The adverse signal is
              category convergence: eSimphony, an explicit competitor, argues that coverage and price differentiation
              are shrinking and that user experience is becoming the remaining battleground. That view is
              self-interested but directionally consistent with the range of substitute models in the assigned pool.
              Airalo's scale and polished onboarding may preserve preference, yet the evidence does not show exclusive
              carrier supply, proprietary network economics, independently measured service quality, or durable
              regulatory advantages. The moat should therefore be underwritten as execution and distribution strength
              with meaningful commoditization risk.
            claimRefs:
              - CP006
              - CP008
              - CP010
