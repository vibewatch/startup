      - number: '1.3'
        title: Capitalization History, Investor Syndicate, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              Airalo's balance sheet reflects five successive institutional investment rounds totaling more than $287M
              in aggregate equity capital [CO004, CO007]. After graduating from Antler's 2019 residency program with
              $100K in pre-seed funding, the company raised a $1.9M seed round backed by Antler and Sequoia Capital
              India's Surge [CO004]. In October 2021, Rakuten Ventures led a $5.4M Series A financing that brought in
              strategic corporate venture arms including Singtel Innov8, Telefonica's Wayra, and LG Technology Ventures
              [CO005]. Capitalization expanded markedly in July 2023 with a $60M Series B led by e& capital at a $280M
              post-money valuation, cementing strategic distribution ties across the Middle East and Europe [CO006]. The
              July 2025 Series C round added $220M led by CVC Capital Partners (CVC Asia Fund VI contributing $185M)
              with follow-on support from Antler Elevate and Peak XV Partners, lifting valuation to $1B [CO007]. While
              this funding establishes substantial operational runway, the 16.9x multiple on $59M disclosed revenue
              leaves equity value vulnerable to multiple compression if growth rates moderate [CO008].
