      - number: '8.2'
        title: Valuation Benchmarks and Financing Context
        blocks:
          - type: paragraph
            body: >-
              Airalo entered the unicorn club in July 2025 following a $220 million Series C round led by CVC Capital
              Partners through CVC Asia Fund VI, valuing the business at over $1 billion. Lifetime financing reached
              approximately $287 million across institutional rounds that included Peak XV Partners, Antler, and
              strategic telecommunications investors like e& Capital and Liberty Global. At a $1 billion post-money
              mark, Airalo trades at an estimated enterprise-value-to-revenue multiple between 6.5x and 10.0x relative
              to estimated 2024-2025 revenues. This multiple represents a premium over publicly traded telecom
              aggregators, roaming clearinghouses, and legacy travel technology vendors, which typically trade at
              forward multiples between 2.0x and 4.5x. While entity records indicate Airalo swung to operating net
              profit in 2024, the absence of public carrier cost waterfalls, customer lifetime value figures, and
              cohort-level retention data means the headline unicorn price lacks audited confirmation. In addition, the
              legal seniority and liquidation preferences attached to the $220 million Series C preferred stock create
              structural return overhang for prospective common or junior equity participants.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
