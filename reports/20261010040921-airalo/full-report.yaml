      - number: '5.3'
        title: Operating Architecture, Network Topology & Latency Performance
        blocks:
          - type: paragraph
            body: >-
              Academic measurement research dissecting Airalo across 24 countries demonstrates that the company operates
              as a 'thick' Mobile Network Aggregator (MNA), distinguishing itself from traditional Mobile Virtual
              Network Operators (MVNOs) and lightweight resellers. Rather than operating its own global cellular radio
              access networks, Airalo partners with a small cohort of wholesale base operators (b-MNOs)—including
              Singtel (Singapore), Orange S.A. (France), Play (Poland), and Polkomtel (Poland)—to sponsor and provision
              roaming profiles for 21 out of 24 investigated national destinations, while maintaining native profile
              agreements in only three markets (South Korea via LG U+, Thailand via dtac, and the Maldives via Ooredoo).
              Traffic routing is primarily handled via IPX Hub Breakout (IHBO) and Home Routing (HR), with zero
              instances of Local Breakout (LBO) due to cross-operator billing and fraud management constraints. Under
              IHBO, user data packets travel across private GPRS Tunneling Protocol (GTP) tunnels from the visited
              serving gateway to third-party Packet Data Network Gateways (PGWs) operated by infrastructure hosts such
              as Packet Host (AS54825) and Webbing USA (AS393559). Empirical testing reveals that while IHBO avoids the
              severe 621% latency inflation characteristic of traditional Home Routing back to Singapore or Poland, it
              nevertheless introduces a 64% latency inflation over native cellular connections. Approximately 14.5% of
              tested roaming connections recorded ping times exceeding 150 ms, frequently caused by suboptimal PGW
              assignment where European roamer traffic broke out through gateways in Virginia rather than Amsterdam.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
