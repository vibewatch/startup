          - type: callout
            title: Dormancy and Re-Acquisition Costs in Leisure Travel
            body: >-
              Unlike recurring enterprise SaaS, international travel is intermittent for the majority of retail users.
              Without transparent disclosure of annual cohort retention or active billing users, high headline customer
              counts (30 million) may mask substantial post-trip churn, forcing continuous re-acquisition spend through
              search ads and app store discovery.
