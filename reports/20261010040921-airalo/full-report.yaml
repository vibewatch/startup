  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Commercial Profiles
        blocks:
          - type: paragraph
            body: >-
              Airalo's customer base spans three distinct commercial segments characterized by varying purchasing
              behaviors, price sensitivities, and distribution interfaces. The core volume driver remains consumer
              retail travelers who purchase single-country or regional prepaid data eSIMs directly through mobile
              application storefronts in advance of international trips. To diversify beyond seasonal holiday travel,
              Airalo introduced the Airalo Partners platform, creating dedicated B2B enterprise pathways for corporate
              travel management and B2B2C channels for travel agencies, tour operators, and corporate resellers. In
              addition, white-label and API integration partners embed connectivity packages directly into third-party
              booking workflows, though enterprise contract values and client concentration levels remain closely held
              private data.
