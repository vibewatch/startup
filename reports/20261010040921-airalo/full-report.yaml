  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Profile and Threat Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Airalo's risk profile is fundamentally shaped by its operating model as a thick mobile network aggregator
              (MNA) rather than a facilities-based telecommunications carrier. Because the company procures cellular
              data wholesale from upstream base operators and resells connectivity through its consumer mobile
              application and B2B partner APIs, it does not own physical radio access networks, cellular towers, or
              proprietary spectrum. Consequently, Airalo's primary exposures divide into four interconnected categories:
              partner concentration and routing latency in wholesale telecommunications, regulatory compliance across
              divergent sovereign jurisdictions, operational and device-level onboarding friction, and financial margin
              compression under carrier wholesale pricing structures.


              Empirical network measurement reveals that Airalo's reliance on roaming configurations introduces tangible
              quality-of-service compromises. Roaming packets frequently traverse third-party IPX hub breakouts (IHBO)
              or home-routed (HR) gateways located thousands of kilometers from the user, causing significant latency
              inflation compared to native domestic SIM cards. Concurrently, intensifying regulatory
              attention—exemplified by India's 2025 tourist eSIM rules requiring explicit partner transparency and
              strict identity verification—threatens to introduce friction into Airalo's instantaneous onboarding
              workflow. While Airalo retains first-mover distribution advantages and a global catalog spanning 200+
              destinations, these structural dependencies constrain pricing power and create clear thesis-break
              conditions if carrier partners restrict access or compress unit margins.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
