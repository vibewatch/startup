      - number: '5.4'
        title: Platform Software Stack, Observability & Security Controls
        blocks:
          - type: paragraph
            body: >-
              Airalo's software and systems engineering footprint reflects a modern cloud-native architecture supporting
              millions of concurrent transactions and real-time network interactions. Public engineering hiring signals
              indicate that the backend core is built predominantly on PHP, transitioning from legacy Laravel frameworks
              toward modular Symfony components to handle high-throughput partner API requests and transaction queuing.
              The mobile user experience is powered by native Android implementations in Kotlin and Java alongside
              cross-platform iOS components, while the customer web application leverages Vue.js and modern JavaScript
              tooling. Infrastructure is hosted on Amazon Web Services (AWS) using Kubernetes container orchestration,
              managed via Docker containers and Terraform infrastructure-as-code scripts, with comprehensive telemetry
              collected through Datadog, Prometheus, OpenTelemetry, dbt, and Lightdash. Telecommunications orchestration
              integrates carrier-grade Remote SIM Provisioning platforms and eSIM lifecycle tooling from industry
              vendors Thales and IDEMIA, while active engineering initiatives focus on localizing MVNO core components
              to internalize roaming control. From a security and regulatory perspective, Airalo maintains formal
              compliance certifications including SOC 2 Type II, PCI DSS for payment handling, and GDPR alignment for
              European subscriber data, supplemented by enterprise Single Sign-On (SSO). However, significant technical
              diligence gaps persist regarding the contractual resilience of Airalo's carrier supply agreements, the
              disaster recovery procedures for third-party PGW failures, and the operational cost of customer support
              remediation during international network outages.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE011
