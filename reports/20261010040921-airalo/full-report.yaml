      - number: '7.4'
        title: Wholesale Carrier, IPX Gateway, and Channel Dependencies
        blocks:
          - type: paragraph
            body: >-
              Airalo's operational architecture features extreme concentration at the wholesale carrier layer.
              Independent academic measurements conducted by Nokia Bell Labs, Telefónica Research, and NYU Abu Dhabi
              revealed that Airalo provisions roaming eSIM profiles in 21 of 24 measured countries through just six
              upstream base operators, including Play Poland and Orange. Rather than negotiating direct bilateral
              interconnection agreements with domestic network operators in each of its 200+ markets, Airalo relies
              heavily on the international roaming agreements of these base carriers. This introduces severe
              counterparty exposure: should an upstream carrier alter roaming settlement terms, terminate wholesale
              access, or prioritize native subscribers during network congestion, Airalo's service availability in
              dozens of downstream countries could degrade simultaneously.


              Upstream technical routing choices further impact service quality. Roaming connections predominantly
              utilize Home Routing (HR) and IPX Hub Breakout (IHBO) topologies, completely bypassing Local Breakout
              (LBO) gateways. Consequently, 14.5% of Airalo roaming measurements exhibited round-trip latencies
              exceeding 150 milliseconds, compared to just 3% for local physical SIM cards. Beyond telecom carriers,
              Airalo maintains critical platform dependencies on app store ecosystems and growth attribution software.
              In late 2024, Google's deprecation of Firebase Dynamic Links threatened Airalo's vital customer referral
              engine, which drives 10% of new user acquisitions. While the company successfully migrated its deep
              linking infrastructure to Adjust TrueLink—reducing link generation volume by 30%—the episode illustrates
              Airalo's vulnerability to sudden policy and infrastructure shifts enacted by third-party technology
              monopolies.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
