            title: Vendor comparisons overstate certainty
            body: >-
              Most feature and price comparisons in the assigned pool were issued by Airalo competitors. They show where
              rivals are attacking, but they do not independently establish service quality, savings, or durable
              superiority.
            calloutType: risk
            claimRefs:
