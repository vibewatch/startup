      - number: '7.2'
        title: Regulatory, Licensing, and Jurisdictional Exposures
        blocks:
          - type: paragraph
            body: >-
              Operating across more than 200 sovereign jurisdictions subjects Airalo to a fragmented and evolving web of
              telecommunications regulations, cross-border data transfer mandates, and consumer protection laws. As a
              corporate entity legally registered in Delaware with its principal operational headquarters in Singapore,
              Airalo navigates complex legal questions regarding whether wholesale travel eSIM platforms require formal
              virtual network operator licenses or local telecommunications authorizations in each destination
              territory. While historical enforcement has remained lax due to the transient nature of international
              tourism, regulatory authorities are increasingly scrutinizing digital connectivity services to prevent
              financial fraud and maintain national security oversight.


              The 2025 regulatory update enacted by the Telecom Regulatory Authority of India (TRAI) marks a critical
              inflection point for international eSIM aggregators. TRAI mandated that international providers must
              clearly disclose their domestic carrier aggregation partnerships and enforce transparent identity
              verification for tourist data plans above threshold sizes. Although Airalo successfully adapted by
              operating transparently through established tier-1 partners Bharti Airtel and Reliance Jio, smaller
              competitors lacking formal agreements faced immediate market disruption. However, as additional emerging
              and developed markets evaluate similar SIM-registration and Know Your Customer (KYC) requirements, Airalo
              faces the recurring risk that mandatory identity verification could erode its signature frictionless
              in-app purchase flow and increase operational compliance overhead.
            claimRefs:
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR014
      - number: '7.3'
        title: Operational, Technical Infrastructure, and Service Quality Risks
        blocks:
          - type: paragraph
            body: >-
              Airalo's technical operations must deliver reliable cellular data across thousands of disparate mobile
              device models, operating system releases, and local cellular network protocols. Because digital eSIM
              profiles require over-the-air Remote SIM Provisioning (RSP) and automated Access Point Name (APN)
              configuration, minor firmware variations can result in total connectivity failure upon arrival. Field
              reports and consumer reviews document that certain popular smartphones, such as Samsung Galaxy Android
              devices, occasionally fail to populate the carrier APN automatically, leaving non-technical travelers
              stranded without data until they manually enter technical network parameters.


              Furthermore, Airalo's consumer eSIM packages are constrained by product design limitations: they provide
              mobile data only, omitting native cellular voice telephony, inbound SMS capability, and phone number
              porting. Travelers must also possess an active Wi-Fi connection within their arrival destination to
              download and activate the cellular profile, preventing pre-departure functional validation and creating
              acute vulnerability at airport terminals with broken or insecure public Wi-Fi. When activation failures
              occur, customer support capacity has historically experienced backlogs, resulting in multi-day response
              delays during peak travel seasons and deferred goodwill compensation. Operating with a fully remote team
              of over 400 employees distributed across 50+ countries exacerbates coordination complexity during global
              service outages, requiring rigorous monitoring of internal incident remediation workflows.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
