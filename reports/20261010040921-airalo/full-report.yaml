              - CR006
              - CR007
      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              To counter its structural platform risks, Airalo has pursued architectural and commercial mitigations. By
              securing strategic capital and corporate partnerships from tier-1 telecom operators—including Telefónica,
              Orange, Singtel, and Deutsche Telekom—Airalo has partially aligned wholesale incentives and gained direct
              access to carrier technical resources. Operationally, the company has institutionalized automated deep
              linking management, expanded self-service troubleshooting documentation, and deployed regional eSIM
              bundles to diversify routing options. In addition, its longitudinal Trustpilot rating has stabilized at
              approximately 4.0 stars across more than 50,000 cumulative reviews, demonstrating that mainstream consumer
              utility remains resilient despite technical latency penalties.


              Nonetheless, institutional investors must track specific quantitative triggers that would signal a
              fundamental break in the investment thesis. A critical thesis-break event would occur if wholesale carrier
              partners renegotiate data wholesale agreements to enforce punitive minimum volume commitments or restrict
              international roaming arbitrage, compressing gross margins. Similarly, if major tourist destinations enact
              strict in-person KYC verification mandates that prevent automated in-app profile downloads, Airalo's unit
              economics and customer acquisition velocity would suffer immediate impairment. Diligence must focus on
              auditing carrier master service agreements, historical refund ratios, support remediation ticket duration,
              and customer concentration across wholesale distribution partners.
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR010
              - CR013
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Wholesale Carrier Roaming Concentration
            body: >-
              Airalo's fundamental architecture relies on wholesale roaming agreements across just six core base
              operators rather than direct agreements with local networks in over 200 destinations, exposing the
              platform to packet routing penalties and wholesale contract renegotiations.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Airalo represents a category-defining marketplace in international telecommunications, having scaled from
              an early idea to over 30 million customers across more than 200 countries and regions. The bullish
              investment thesis is driven by rapid structural adoption: mobile device architectures and GSMA standards
              are transitioning permanently from physical removable SIM cards to embedded digital eSIMs. Airalo captures
              strong initial brand recall, extensive global coverage, and growing B2B channel distribution through
              corporate partnerships and white-label integration APIs. Conversely, the anti-thesis centers on the
              structural limitations of operating as a virtual aggregator without proprietary wireless infrastructure.
              Airalo purchases wholesale connectivity from domestic mobile network operators and aggregators, leaving it
              exposed to carrier pricing leverage, potential retail margin compression, and competing direct-to-consumer
              digital roaming offerings from host telcos. Furthermore, consumer eSIM packages remain restricted
              primarily to data services without native voice or SMS, while discount-focused aggregators compete
              aggressively on retail price per gigabyte.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
