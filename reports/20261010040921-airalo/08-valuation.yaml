callouts:
  - calloutType: "insight"
    title: "Category Creation vs. Reseller Margin Realities"
    body: "Airalo successfully established consumer awareness for international travel eSIMs, but as a digital reseller purchasing wholesale capacity from underlying carriers, it remains structurally subject to mobile network operator economics. Without proprietary physical network assets, long-term valuation multiples must reflect wholesale distributor economics rather than pure software gross margins."
    claimRefs:
      - "CV004"
      - "CV008"
      - "CV010"
  - calloutType: "recommendation"
    title: "Confirmatory Diligence Gating Criteria"
    body: "Prospective investors should maintain a disciplined Track stance until management provides audited carrier wholesale rate schedules, cohort-level repeat purchase retention rates, and the definitive Series C certificate of incorporation. Capital deployment at or above the $1 billion headline valuation requires empirical proof that gross margins exceed 45% and that senior preference overhang does not compromise junior equity returns."
    claimRefs:
      - "CV009"
      - "CV012"
      - "CV014"
