chapter:
  number: 5
  title: "Product & Technology"
  summary: "Airalo operates as a 'thick' Mobile Network Aggregator (MNA) that decouples core gateway breakout from visited cellular networks across 200+ destinations via IPX Hub Breakout (IHBO) and Home Routing (HR). Its platform combines direct-to-consumer mobile applications, a B2B Partner API/SDK suite used by over 6,500 integrations, and carrier wholesale agreements with base operators such as Singtel, Orange, Play, and Polkomtel. However, empirical network testing reveals that remote packet gateway routing inflates roaming latency by 64% over native connections, while carrier throttling and compliance across fragmented jurisdictions create operational exposure."
sections:
  - id: "section-product-definition"
    title: "Product Architecture & Customer Delivery Model"
    body: "Airalo delivers global mobile data connectivity through a software-orchestrated eSIM marketplace spanning consumer applications and enterprise B2B partner platforms. For retail travelers, the company offers downloadable eSIM profiles across more than 200 geographic destinations, categorized into single-destination local plans, regional multi-country packages (such as Eurolink and Asialink), and global bundles. The consumer workflow is executed entirely within Airalo's mobile applications (iOS and Android) or web portal, allowing users to select a destination, procure a data allotment, and install the eSIM profile directly onto compatible hardware via Remote SIM Provisioning (RSP) before departure or upon arrival. In addition to capped packages, the company introduced unlimited data plans across 150 destinations in late 2025, which experienced rapid adoption with 193% growth heading into 2026. On the commercial side, Airalo provides a B2B partner integration suite that includes a RESTful Partner API, pre-built client SDKs, and a turnkey WooCommerce plugin that allows digital travel agencies, airlines, and financial platforms to embed eSIM provisioning into their checkout flows in under thirty minutes. These enterprise tools enable programmatic inventory management, automated eSIM order generation, balance top-ups, and webhook-driven consumption alerting across more than 6,500 integrated corporate partners."
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "section-workflow-use-cases"
    title: "End-to-End Traveler Workflow & Carrier Selection"
    body: "The core customer workflow solves the friction, unpredictable expense, and administrative complexity historically associated with international carrier roaming and physical SIM card acquisition. Prior to international travel, an end-user browses Airalo's digital catalog, selects an appropriate data tier (ranging from 1 GB up to unlimited allocations), and initiates installation through an on-screen prompt or QR code. Unlike physical travel SIMs that require airport store queues, passport registration, or manual tray extraction, Airalo's software provisioning stores multiple digital profiles directly on the device's embedded chip. Once the traveler lands in the destination country, the device connects to an underlying visited Mobile Network Operator (v-MNO) governed by Airalo's wholesale carrier agreements. In Germany, for example, Airalo plans connect to Telefonica's O2 network with full-speed hotspot tethering enabled, presenting a distinct operational profile compared to competing travel providers like Holafly, which relies on Vodafone or O2 while frequently blocking mobile hotspot sharing on its unlimited tiers. However, because Airalo operates primarily as an aggregator rather than a facility-based operator, subscriber throughput is strictly governed by the local radio access network policies, traffic shaping, and congestion controls enforced by the visited carrier, resulting in meaningful performance variations across different European and international markets."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE010"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "section-telecom-infrastructure"
    title: "Operating Architecture, Network Topology & Latency Performance"
    body: "Academic measurement research dissecting Airalo across 24 countries demonstrates that the company operates as a 'thick' Mobile Network Aggregator (MNA), distinguishing itself from traditional Mobile Virtual Network Operators (MVNOs) and lightweight resellers. Rather than operating its own global cellular radio access networks, Airalo partners with a small cohort of wholesale base operators (b-MNOs)—including Singtel (Singapore), Orange S.A. (France), Play (Poland), and Polkomtel (Poland)—to sponsor and provision roaming profiles for 21 out of 24 investigated national destinations, while maintaining native profile agreements in only three markets (South Korea via LG U+, Thailand via dtac, and the Maldives via Ooredoo). Traffic routing is primarily handled via IPX Hub Breakout (IHBO) and Home Routing (HR), with zero instances of Local Breakout (LBO) due to cross-operator billing and fraud management constraints. Under IHBO, user data packets travel across private GPRS Tunneling Protocol (GTP) tunnels from the visited serving gateway to third-party Packet Data Network Gateways (PGWs) operated by infrastructure hosts such as Packet Host (AS54825) and Webbing USA (AS393559). Empirical testing reveals that while IHBO avoids the severe 621% latency inflation characteristic of traditional Home Routing back to Singapore or Poland, it nevertheless introduces a 64% latency inflation over native cellular connections. Approximately 14.5% of tested roaming connections recorded ping times exceeding 150 ms, frequently caused by suboptimal PGW assignment where European roamer traffic broke out through gateways in Virginia rather than Amsterdam."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE009"
      - "CE010"
    figureRefs:
      - "FE001"
  - id: "section-technology-stack-security"
    title: "Platform Software Stack, Observability & Security Controls"
    body: "Airalo's software and systems engineering footprint reflects a modern cloud-native architecture supporting millions of concurrent transactions and real-time network interactions. Public engineering hiring signals indicate that the backend core is built predominantly on PHP, transitioning from legacy Laravel frameworks toward modular Symfony components to handle high-throughput partner API requests and transaction queuing. The mobile user experience is powered by native Android implementations in Kotlin and Java alongside cross-platform iOS components, while the customer web application leverages Vue.js and modern JavaScript tooling. Infrastructure is hosted on Amazon Web Services (AWS) using Kubernetes container orchestration, managed via Docker containers and Terraform infrastructure-as-code scripts, with comprehensive telemetry collected through Datadog, Prometheus, OpenTelemetry, dbt, and Lightdash. Telecommunications orchestration integrates carrier-grade Remote SIM Provisioning platforms and eSIM lifecycle tooling from industry vendors Thales and IDEMIA, while active engineering initiatives focus on localizing MVNO core components to internalize roaming control. From a security and regulatory perspective, Airalo maintains formal compliance certifications including SOC 2 Type II, PCI DSS for payment handling, and GDPR alignment for European subscriber data, supplemented by enterprise Single Sign-On (SSO). However, significant technical diligence gaps persist regarding the contractual resilience of Airalo's carrier supply agreements, the disaster recovery procedures for third-party PGW failures, and the operational cost of customer support remediation during international network outages."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE011"
    tableRefs:
      - "TE003"
