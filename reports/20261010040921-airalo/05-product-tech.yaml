callouts:
  - calloutType: "insight"
    title: "Thick MNA Decoupling Enables Rapid Global Expansion at Latency Cost"
    body: "By leveraging IPX Hub Breakout and wholesale base-operator agreements (Singtel, Orange, Play), Airalo bypasses slow country-by-country MNO negotiations. However, routing traffic through third-party packet gateways (such as Packet Host in Amsterdam and Virginia) introduces a 64% median latency penalty over native networks, with 14.5% of roaming connections exceeding 150 ms."
    claimRefs:
      - "CE001"
      - "CE009"
      - "CE010"
  - calloutType: "risk"
    title: "Downlink Throughput and Service Quality Are Constrained by Visited Carrier Policies"
    body: "Empirical measurements demonstrate that Airalo's bandwidth is determined primarily by visited operator throttling policies rather than routing topology, yielding wide performance swings (e.g., 22 Mbps in Germany versus 112 Mbps in Spain under identical Play Poland provisioning)."
    claimRefs:
      - "CE002"
      - "CE009"
      - "CE014"
