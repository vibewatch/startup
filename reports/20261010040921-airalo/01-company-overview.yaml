    title: "Strategic Telco Alignment Mitigates Disintermediation Risk"
    body: "Airalo's shareholder base features direct corporate venture participation from major telecom operators including e&, Singtel, Telefonica, and Deutsche Telekom. By converting potential carrier adversaries into equity-aligned distribution partners, Airalo secures preferred wholesale roaming arrangements while protecting against aggressive retail carrier blocking."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO011"
  - calloutType: "risk"
    title: "High Revenue Multiple Dependent on Quality-of-Service Retention"
    body: "Carrying a $1B valuation against $59M in disclosed revenue (16.9x multiple) leaves Airalo vulnerable to downside re-rating if top-of-funnel customer acquisition does not translate into durable, profitable repeat usage. Persistent Trustpilot user complaints regarding activation failures and slow support present acute retention risks in an increasingly crowded travel eSIM landscape."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO013"
      - "CO014"
