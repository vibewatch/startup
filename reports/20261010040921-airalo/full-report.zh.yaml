      - number: '1.4'
        title: 运营里程碑、产品创新与执行挑战
        blocks:
          - type: paragraph
            body: >-
              2019 至 2026 年间，Airalo 从试验性的旅行工具成长为全球消费者和企业旅行 eSIM 的参考平台 [CO001, CO011]。商业执行从 A 轮后覆盖 190 多个司法辖区的目录扩张，推进到 B
              轮期间上线 Airalo Partners B2B 连接基础设施 [CO005, CO006]。2025 年第三季度，Airalo 在 150 个目的地推出 Unlimited
              数据套餐，随后报告数据密集型旅行者的采用量增长 193% [CO012]。2026 年 6 月，全球消费者渗透最终推动累计用户超过 3000 万；与此同时，设备硬件持续普及，eSIM 正快速替代实体 SIM 卡
              [CO007, CO010]。不过，客户快速增长也暴露出明显的运营摩擦：截至 2026 年 9 月，Trustpilot 用户评论持续提到 eSIM 激活失败、客服响应延迟和设置复杂等问题
              [CO013]。与此同时，企业连接和国际运营商转售安排的扩张，需要更正式的公共事务能力，以应对电信许可要求和跨境消费者监管 [CO014]。
