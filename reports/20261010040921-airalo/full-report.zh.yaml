      - number: '5.3'
        title: 运营架构、网络拓扑与延迟表现
        blocks:
          - type: paragraph
            body: >-
              对 Airalo 在 24 个国家的学术测量研究显示，公司属于“厚型”移动网络聚合商（MNA），不同于传统移动虚拟网络运营商（MVNO）和轻量转售商。Airalo
              不运营自己的全球蜂窝无线接入网络，而是与少数批发基础运营商（b-MNO）合作——包括 Singtel（新加坡）、Orange S.A.（法国）、Play（波兰）和 Polkomtel（波兰）——为 24
              个受测国家中的 21 个提供漫游配置文件，只有三个市场拥有本地配置文件协议（韩国通过 LG U+、泰国通过 dtac、马尔代夫通过 Ooredoo）。流量主要通过 IPX Hub Breakout（IHBO）和
              Home Routing（HR）处理，由于跨运营商计费及反欺诈约束，完全没有 Local Breakout（LBO）实例。在 IHBO 模式下，用户数据包通过私有 GPRS
              隧道协议（GTP）隧道，从访问服务网关传至第三方分组数据网络网关（PGW）；这些网关由 Packet Host（AS54825）和 Webbing USA（AS393559）等基础设施主机运营。实测显示，IHBO
              避免了传统 Home Routing 回到新加坡或波兰时典型的 621% 严重延迟膨胀，但相对本地蜂窝连接仍增加 64% 延迟。约 14.5% 的受测漫游连接记录到超过 150 ms 的 ping
              时间，常见原因是 PGW 分配不佳，例如欧洲漫游者的流量经由弗吉尼亚而非阿姆斯特丹的网关出网。
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
