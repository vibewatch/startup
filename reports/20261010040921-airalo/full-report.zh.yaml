      - CV010
      - CV014
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 投资支柱
      - 核心正论
      - 反论
      - 哪些变化会改变判断
    rows:
      - - 市场地位与规模
        - 品类创建者，拥有 30M+ 用户，乘着全球消费者转向数字 eSIM 连接的长期趋势
        - 低转换门槛让激进定价的同类聚合商得以在热门目的地压低 Airalo 零售价
        - 持续的自然获客效率与不断扩大的客户留存队列，证明品牌忠诚度具有持久性
      - - 运营商动态与成本
        - 可观的采购量带来有利的批发数据分层定价与优先带宽访问
        - 缺少自有网络基础设施，使 Airalo 易受批发利润挤压或运营商直接竞争影响
        - 与全球一线移动运营商签订长期批发价格锁定合同或战略共同投资协议
      - - 企业与 B2B 增长
        - 不断扩大的 B2B 生态拥有超过 5,000 家企业合作伙伴，交钥匙式 API 集成带来经常性商业收入
        - 企业差旅支出具有周期性，企业连接业务还会遇到根深蒂固的电信供应商
        - 披露企业收入占比加速提升并超过总收入的 25%，同时净收入留存率超过 110%
      - - 资本结构与治理
        - 获一流机构投资方（CVC Asia Fund VI、Peak XV Partners（前身为 Sequoia India / Surge））支持，获得资金续航与治理支持
        - $220M C 轮优先股带来清算优先权悬置，可能稀释普通股股东回报
        - 股权结构表披露确认标准 1x 非参与型优先股条款，不含优先级叠加或惩罚性棘轮
    notes: 对比正反论矩阵，呈现 Airalo 的商业规模优势与运营商批发脆弱性、私有资本结构不透明之间的差异。
    claimRefs:
      - CV001
