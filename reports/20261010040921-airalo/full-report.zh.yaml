      - number: '5.2'
        title: 端到端旅行者流程与运营商选择
        blocks:
          - type: paragraph
            body: >-
              核心客户流程解决了国际运营商漫游和购买实体 SIM 卡长期带来的摩擦、不可预测费用和管理复杂度。国际旅行前，用户浏览 Airalo 数字目录，选择合适的数据档位（从 1 GB
              到不限量），然后通过屏幕提示或二维码启动安装。与需要排机场队、登记护照或手动拆卡槽的实体旅行 SIM 不同，Airalo 的软件配置会把多个数字配置文件直接存储在设备内置芯片上。旅行者抵达目的地后，设备连接到受
              Airalo 批发运营商协议管理的当地访问移动网络运营商（v-MNO）。例如在德国，Airalo 套餐连接 Telefonica 的 O2 网络，并支持全速热点共享；这与 Holafly
              等竞争旅行服务商形成明显运营差异，后者依赖 Vodafone 或 O2，却经常在无限档位禁止移动热点共享。但由于 Airalo
              主要是聚合商而非基于设施的运营商，用户吞吐量严格受访问运营商执行的本地无线接入网络政策、流量整形和拥塞控制约束，因此在不同欧洲和国际市场之间会出现明显性能差异。
