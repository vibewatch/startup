  - id: FU001
    title: Airalo 旅行者生命周期与扩张旅程
    type: journey-map
    summary: 从行前发现、旅行中使用到行后再互动循环的端到端客户旅程。
    approximationNotes: 生命周期阶段与行为流失综合自独立增长营销分析及用户评价测试。
    data:
      items:
        - label: 旅行规划与搜索
          detail: 旅行者在出发前识别海外连接需求；通过 App Store 搜索、旅行内容创作者推荐或付费搜索广告发现 Airalo。
          touchpoints:
            - App Store 排名
            - 旅行影响者博客
            - 付费搜索引擎营销
          tone: neutral
        - label: eSIM 目录选择与结账
          detail: 用户在 iOS/Android 应用或网页浏览 200+ 个目的地；选择目的地流量包或区域套餐，并完成即时预付费支付。
          touchpoints:
            - 移动端商店
            - 信用卡 / Apple Pay
            - 语言本地化（53 种语言）
          tone: positive
        - label: 抵达与配置文件安装
          detail: 用户通过应用内自动设置或二维码安装 eSIM 配置文件；抵达目的地机场后激活蜂窝数据漫游。
          touchpoints:
            - 二维码邮件
            - iOS/Android 直接配置文件安装器
            - 本地网络运营商握手
          tone: positive
        - label: 旅途中使用与解困
          detail: 旅行者无需更换实体 SIM，也不会遭遇国内漫游账单冲击，即可立即使用地图、消息与网约车服务。
          touchpoints:
