      - CV006
      - CV009
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 隐含估值区间
      - 概率
      - 核心运营假设
      - 下行触发因素 / 主要风险
    rows:
      - - 乐观情景
        - $1.8B - $2.2B
        - 25%
        - 企业 B2B API 集成加速；运营商批发容量成本下降 20%；综合毛利率超过 55%
        - 运营商抵制批量折扣；企业销售周期拉长；消费者持续流失
      - - 基准情景
        - $1.1B - $1.3B
        - 50%
        - 用户基数按 25-30% 的年速度增长；毛利率稳定在 40% 至 45%；市场平台倍数稳定在约 6x-8x
        - 低成本聚合商导致零售价下滑；搜索与应用商店的付费获客成本上升
      - - 悲观情景
        - $450M - $600M
        - 25%
        - 大型运营商将全球漫游整合进国内套餐；零售利润率被压低至 25% 以下；倍数向批发同业下调
        - 电信商直接去中介化；运营商合作伙伴终止合同；消费者出行整体收缩
    notes: 评估未来 24 个月估值情景模型在不同毛利率特征与竞争环境下的股权回报分布。
