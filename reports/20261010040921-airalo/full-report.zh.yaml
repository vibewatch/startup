      - number: '1.2'
        title: 创始团队、领导结构与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Airalo 的高管团队兼具消费者平台开发经验和全球电信商业化能力 [CO001]。首席执行官 Ahmet Bahadir Ozdemir 负责整体公司战略并主导机构融资，首席运营官 Abraham Burak
              则管理运营商合作、跨国平台基础设施和分布式远程团队 [CO001, CO003]。联合创始人 Duran Akcaylier 在离开公司前于 2020 年搭建了最初的 Web
              应用，核心技术领导层由此完成了一次较早且干净的交接 [CO002]。如今的高管职能由多位资深运营高管支撑，包括负责跨境合规和 IP 的首席法务官 Carolyn Jameson，以及首席增长官 Shelly
              Pearce [CO003]。考虑到公司激进的全球扩张和对多司法辖区运营许可的依赖，关键人依赖仍集中在两位创始人身上；尤其是公司正积极招聘资深公共事务负责人，以对接电信监管机构并降低执法风险 [CO014]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
