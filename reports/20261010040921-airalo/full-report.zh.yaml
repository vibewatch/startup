  - id: TV001
    title: 建议汇总表
    columns:
      - 评估维度
      - 分析判断
      - 实证证据与依据
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 无可匹敌的消费者品牌认知度与 30M+ 用户规模，须与未经验证的毛利率韧性及对运营商的依赖权衡
        - 持续主动跟踪；在审计后的单位经济数据与批发运营商分成瀑布披露前，暂缓股权投入
      - - 信心等级
        - 中
        - 已核实的 $220M C 轮融资、头部投资方与据报道的规模；但私有队列留存率与不透明的运营商合同构成抵消
        - 在评估可执行的买入或成长股权参与前，要求管理层数据室完成核验
      - - 风险评级
        - 高
        - 聚合商商业模式暴露于电信批发定价权、同类聚合商价格战与消费者流失
        - 在潜在入场估值中纳入结构性下行保护与优先权次级化情景
      - - 估值判断
        - 公允
        - $1.0B+ 投后估值意味着约 7x-10x 收入运行率倍数；与成长型市场平台相符，但相对批发电信商享有溢价
        - 严格执行入场纪律；争取有明显折价的老股交易，而不是按本轮完整定价买入
    notes: 分析综合截至 2026 年 10 月形成，依据已核实的融资里程碑、公开规模指标及可比电信倍数。
