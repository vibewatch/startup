        blocks:
          - type: callout
            title: 消费者摩擦与忠诚度的双重动力
            body: >-
              Airalo 的核心消费者价值主张是把紧张的抵达体验转化为即时连接，从而提供很高的即时效用。但缺少语音 / 短信支持，加上固定数据上限，会在旅行者需要本地通话或旅途中耗尽额度时制造摩擦，也解释了为何 2025
              年推出 Unlimited 套餐是扩大客户规模的关键杠杆。
            calloutType: insight
            claimRefs:
              - CU006
              - CU009
              - CU010
          - type: callout
            title: 休眠与休闲旅行中的再获客成本
            body: 对大多数零售用户而言，国际旅行是间歇性的，不像经常性企业 SaaS。若不透明披露年度队列留存或活跃计费用户，高达 3000 万的客户总数可能掩盖大量旅后流失，迫使公司持续通过搜索广告和应用商店发现渠道投入再获客。
            calloutType: risk
            claimRefs:
              - CU001
              - CU008
              - CU011
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 管理层风险画像与威胁分类
        blocks:
          - type: paragraph
            body: >-
              Airalo 的风险画像根本上由其厚型移动网络聚合商（MNA）运营模式塑造，而不是由基于设施的电信运营商模式塑造。公司从上游基础运营商批发采购蜂窝数据，再通过消费者移动应用和 B2B 合作伙伴 API
              转售连接服务，因此不拥有实体无线接入网络、蜂窝塔或专有频谱。由此，Airalo
              的主要风险分为四类相互关联的类别：批发电信中的合作伙伴集中度和路由延迟；不同主权司法辖区的监管合规；运营和设备层面的上手摩擦；以及运营商批发定价结构下的财务利润压缩。

              实证网络测量显示，Airalo 依赖漫游配置会带来切实的服务质量折损。漫游数据包经常穿过距离用户数千公里的第三方 IPX hub breakout（IHBO）或
              home-routed（HR）网关，导致延迟相较本地实体 SIM 卡显著膨胀。与此同时，监管关注不断加强——印度 2025 年的旅行 eSIM
              规则要求运营商明确披露合作伙伴关系并严格核验身份，就是一个例子——这可能给 Airalo 的即时上手流程带来摩擦。Airalo 虽然仍拥有先发分销优势和覆盖 200
              多个目的地的全球目录，但这些结构性依赖限制了定价权；如果运营商伙伴限制接入或压缩单位利润，也会出现明确的投资论点失效条件。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR011
      - number: '7.2'
        title: 监管、许可与司法辖区风险
        blocks:
          - type: paragraph
            body: >-
              Airalo 在 200 多个主权司法辖区运营，面对不断变化且碎片化的电信监管、跨境数据传输要求和消费者保护法。Airalo
              是在特拉华州依法注册、主要运营总部位于新加坡的公司，因此必须处理复杂的法律问题：批发旅行 eSIM
              平台是否需要在每个目的地正式取得虚拟网络运营商牌照或当地电信授权。由于国际旅游具有短期性，历史执法一直较宽松；但监管机构正越来越严格地审查数字连接服务，以防范金融欺诈并维护国家安全监管。

              印度电信监管局（TRAI）在 2025 年颁布的监管更新，是国际 eSIM 聚合商的关键转折点。TRAI 要求国际供应商清晰披露其国内运营商聚合合作关系，并对超过阈值的数据套餐执行透明的身份核验。Airalo
              通过 Bharti Airtel 和 Reliance Jio 等成熟的一线合作伙伴透明运营，成功完成适配；缺乏正式协议的小型竞争者则立即受到市场冲击。但随着更多新兴市场和发达市场评估类似的 SIM
              注册和了解你的客户（KYC）要求，强制身份核验可能侵蚀 Airalo 标志性的无摩擦应用内购买流程，并增加运营合规开支，这一风险会反复出现。
            claimRefs:
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR014
      - number: '7.3'
        title: 运营、技术基础设施与服务质量风险
        blocks:
          - type: paragraph
            body: >-
              Airalo 的技术运营必须在数千种不同移动设备型号、操作系统版本和本地蜂窝网络协议上稳定提供数据连接。数字 eSIM 配置文件需要通过空中远程 SIM
              配置（RSP）和自动接入点名称（APN）配置，轻微的固件差异也可能导致用户抵达后完全无法连接。现场报告和消费者评论显示，部分热门智能手机（如 Samsung Galaxy Android
              设备）偶尔无法自动填入运营商 APN，非技术用户只能手动输入技术网络参数，否则抵达后会无数据可用。

              此外，Airalo 消费者 eSIM 套餐受产品设计限制：只提供移动数据，不含原生蜂窝语音、接收短信能力或电话号码移植。旅行者还必须在抵达目的地后拥有可用
              Wi-Fi，才能下载并激活蜂窝配置文件；这使其无法在出发前完成功能验证，也让机场破损或不安全的公共 Wi-Fi 成为明显脆弱点。激活失败时，客服历史上曾出现积压，旺季可能要数天才能响应，善意补偿也会延后。超过
              400 名员工完全远程办公且分布在 50 多个国家，进一步增加了全球服务中断期间的协调复杂度，要求公司严格监控内部事故补救流程。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: 批发运营商、IPX 网关与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Airalo 的运营架构高度集中在批发运营商环节。Nokia Bell Labs、Telefónica Research 和 NYU Abu Dhabi 的独立学术测量显示，Airalo 在 24 个受测国家中的
              21 个通过仅六家上游基础运营商提供漫游 eSIM 配置，其中包括 Play Poland 和 Orange。Airalo 没有在 200
              多个市场逐一与当地网络运营商谈判双边互联协议，而是高度依赖这些基础运营商的国际漫游协议。这带来严重的交易对手风险：如果上游运营商改变漫游结算条款、终止批发接入，或在网络拥塞时优先服务本地订户，Airalo
              在数十个下游国家的服务可用性可能同时恶化。

              上游技术路由选择还会进一步影响服务质量。漫游连接主要采用 Home Routing（HR）和 IPX Hub Breakout（IHBO）拓扑，完全绕过 Local
              Breakout（LBO）网关。因此，Airalo 的漫游测量中有 14.5% 的往返延迟超过 150 毫秒，而本地实体 SIM 卡只有 3%。除电信运营商外，Airalo
              还依赖应用商店生态和增长归因软件等关键平台。2024 年底，Google 停用 Firebase Dynamic Links，威胁到 Airalo 的关键客户推荐引擎；该引擎带来 10%
              的新用户。公司随后成功把深度链接基础设施迁移到 Adjust TrueLink，使链接生成量减少 30%，但这一事件说明 Airalo 容易受到第三方科技垄断企业突然实施的政策和基础设施变化影响。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
      - number: '7.5'
        title: 缓释措施、监测指标与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              为对冲平台的结构性风险，Airalo 同时推进架构和商业侧的缓释措施。公司从 Telefónica、 Orange、Singtel、Deutsche Telekom
              等头部电信运营商处获得战略资本和企业合作，部分统一了批发端 激励，也直接接入运营商的技术资源。运营团队把深度链接管理自动化，扩充自助排障文档， 并上线区域 eSIM 套餐，以分散路由选择。Trustpilot
              长期评分在累计超过 50,000 条评价中稳定在 约 4.0 星，说明即使存在技术延迟，主流消费者仍认可其使用价值。


              不过，机构投资者必须盯住能证明投资逻辑根本破裂的量化触发点。如果批发运营商重新谈判数据批发 协议，强加惩罚性最低量承诺，或限制国际漫游套利，毛利率就会被压缩，这将构成关键的逻辑破裂事件。
              同样，如果主要旅游目的地要求严格的线下面签 KYC，阻止 App 内自动下载配置文件，Airalo 的单位经济 和获客速度会立即受损。尽调应重点审阅运营商主服务协议、历史退款率、支持修复工单时长，以及各批发
              分销伙伴的客户集中度。
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR010
              - CR013
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 批发运营商漫游集中度
            body: Airalo 的底层架构只依赖六家核心基础运营商的批发漫游协议，而不是与 200 多个目的地的本地网络 直接签约，因此平台容易受到数据包路由惩罚和批发合同重谈的影响。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Airalo 已从早期想法成长为国际电信领域定义品类的 marketplace，覆盖 200 多个国家和地区，客户超过 30 million。看多逻辑来自结构性需求的快速迁移：移动设备架构和 GSMA
              标准正在永久地从可拆卸实体 SIM 卡转向嵌入式数字 eSIM。Airalo 拥有较强的初始品牌认知、广泛的全球覆盖，并借助企业合作和 白标集成 API 扩大 B2B
              渠道分销。反方逻辑则在于：没有自有无线基础设施，虚拟聚合商模式本身存在 结构性限制。Airalo 从国内移动网络运营商和聚合商购买批发连接，因此暴露于运营商定价优势、零售
              利润率可能被压缩，以及东道国电信商面向消费者提供的直接数字漫游服务竞争之下。此外，消费者 eSIM 套餐仍主要限于数据服务，不含原生语音或短信；以折扣为导向的聚合商又在每 GB 零售价上激烈竞争。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV009
      - number: '8.2'
        title: 估值基准与融资背景
        blocks:
          - type: paragraph
            body: >-
              Airalo 在 CVC Capital Partners 通过 CVC Asia Fund VI 领投的 $220 million C 轮融资后，于 2025 年 7 月 进入独角兽行列，公司估值超过 $1
              billion。历轮机构融资累计约 $287 million，投资方包括 Peak XV Partners、Antler，以及 e& Capital、Liberty Global 等战略电信投资者。按 $1
              billion 投后估值计算，相对于预估的 2024-2025 年收入，Airalo 的企业价值 / 收入倍数约为 6.5x 至 10.0x。这个倍数高于
              上市电信聚合商、漫游清算机构和传统旅游科技供应商；后者的远期倍数通常为 2.0x 至 4.5x。实体记录显示 Airalo 在 2024 年转为经营净利润，但由于运营商成本瀑布、客户终身价值和 cohort
              留存数据均未公开，独角兽估值仍缺乏审计确认。此外，$220 million C 轮优先股附带的法律优先级和清算优先权，会给潜在普通股或次级股权投资者带来结构性回报压制。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV014
      - number: '8.3'
        title: 情景分析与回报画像
        blocks:
          - type: paragraph
            body: >-
              为估算不同经营轨迹下 Airalo 的远期股权价值，我们以 24 个月投资期限构建三情景框架。乐观情景 （25% 概率）下，Airalo 利用 30 million 用户基础，谈下 15% 至 20%
              的运营商批发费率降幅，同时快速 扩大企业 B2B 合作，将毛利率提升至 55%+，估值达到 $1.8 billion 至 $2.2 billion。基准情景 （50% 概率）下，零售客户以稳定的 25% 至
              35% 年增长率复合增长，预算型竞争者带来的温和降价和 持续营销成本相互抵消，支撑 $1.1 billion 至 $1.3 billion 的股权价值。悲观情景（25% 概率）下，
              一线移动网络运营商把国际漫游直接打包进消费者移动套餐，或限制第三方批发带宽，引发价格战，使 综合毛利率跌破 25%。在下行情景压力下，倍数向轻资产分销商同业收缩，隐含估值为 $450 million 至 $600
              million。
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 退出准备度与最终建议
        blocks:
          - type: paragraph
            body: >-
              Airalo 最终能否实现流动性退出，取决于它能否从交易驱动的消费 marketplace 转型为软件集成的企业 连接基础设施。潜在退出路径包括在国际交易所上市，或被全球电信集团、旅游科技生态运营商战略收购。
              但由于复购 cohort、有机获客成本和 CVC 领投融资轮设立的治理条款透明度有限，公司距离上市仍有 距离。在明确的全球品牌领先地位与不透明的运营商成本经济、下行风险之间权衡后，我们将投资立场定为
              跟踪，风险评级为高，估值判断为公允。若要升级为可执行投资，必须通过确认性尽调取得经审计的 单位经济、批发费率协议和公司注册证书中的优先权瀑布。
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV009
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 品类创造与转售商利润现实
            body: >-
              Airalo 成功建立了消费者对国际旅行 eSIM 的认知，但作为向底层运营商购买批发容量的数字转售商， 其经济性仍受移动网络运营商结构性支配。没有自有实体网络资产，长期估值倍数就应反映批发分销商
              的经济性，而不是纯软件的毛利率。
            calloutType: insight
            claimRefs:
              - CV004
              - CV008
              - CV010
          - type: callout
            title: 确认性尽调门槛
            body: >-
              在管理层提供经审计的运营商批发费率表、cohort 级复购留存率和最终版 C 轮公司注册证书前，潜在 投资者应维持纪律性的跟踪立场。按 $1 billion 或更高 headline 估值投入资本，需要经验证据
              证明毛利率超过 45%，且优先权压制不会损害次级股权回报。
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV012
              - CV014
