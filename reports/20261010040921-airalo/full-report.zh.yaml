      - number: '5.4'
        title: 平台软件栈、可观测性与安全控制
        blocks:
          - type: paragraph
            body: >-
              Airalo 的软件和系统工程体系采用现代云原生架构，支持数百万并发交易和实时网络交互。公开工程招聘信号显示，后端核心主要用 PHP 构建，正从传统 Laravel 框架转向模块化 Symfony
              组件，以处理高吞吐量合作伙伴 API 请求和交易排队。移动端体验由 Kotlin 和 Java 原生 Android 实现，以及跨平台 iOS 组件共同支撑；客户 Web 应用使用 Vue.js 和现代
              JavaScript 工具链。基础设施部署在 Amazon Web Services（AWS）上，采用 Kubernetes 容器编排，由 Docker 容器和 Terraform 基础设施即代码脚本管理，并通过
              Datadog、Prometheus、OpenTelemetry、dbt 和 Lightdash 收集完整遥测数据。电信编排集成了运营商级远程 SIM 配置平台和 Thales、IDEMIA 等行业供应商的
              eSIM 生命周期工具；当前工程工作重点是把 MVNO 核心组件本地化，以将漫游控制收归内部。从安全和监管角度看，Airalo 维持包括 SOC 2 Type II、负责支付处理的 PCI DSS
              以及面向欧洲订户数据的 GDPR 合规在内的正式认证，并提供企业单点登录（SSO）。但关于 Airalo 运营商供应协议的合同韧性、第三方 PGW
              故障时的灾备流程，以及国际网络中断期间客服补救的运营成本，仍存在明显技术尽调缺口。
