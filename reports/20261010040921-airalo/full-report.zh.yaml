      - CO006
      - CO007
      - CO010
      - CO012
      - CO013
    data:
      items:
        - label: 公司成立与 Antler 孵化
          date: 2019-07
          detail: Ahmet Bahadir Ozdemir、Abraham Burak 与 Duran Akcaylier 通过 Antler Singapore 孵化项目创办 Airalo，获得 $100K 种子前融资。
          tone: positive
        - label: 种子轮与 Sequoia Surge 批次
          date: 2019-10
          detail: 从 Antler 与 Sequoia Capital India 的 Surge 项目获得 $1.9M 种子融资，推出首个全球旅行 eSIM 商店。
          tone: positive
        - label: A 轮电信联盟融资
          date: 2021-10
          detail: 获 Rakuten Ventures 领投的 $5.4M A 轮融资，Singtel Innov8 与 Wayra 参投，将 eSIM 目录扩展至 190+ 个司法辖区。
          tone: positive
        - label: B 轮规模化与 e& capital 基金（Etisalat by e&）合作
          date: 2023-07
          detail: 以 $280M 投后估值完成由 e& capital 基金（Etisalat by e&）领投的 $60M B 轮融资，用户数超过 500 万并推出 Airalo Partners。
          tone: positive
        - label: C 轮独角兽里程碑
          date: 2025-07
          detail: 以 $1B 估值获得 CVC Capital Partners 领投的 $220M C 轮融资，用户数达到 2,000 万，成为首家 eSIM 独角兽。
          tone: positive
        - label: 无限流量套餐推出
          date: 2025-08
          detail: 在 150 个目的地推出 Unlimited 流量套餐，随后在频繁国际旅行者中录得 193% 的采用率增长。
          tone: positive
        - label: 3,000 万客户门槛
          date: 2026-06
          detail: 在智能手机 eSIM 硬件采用加速之际，覆盖 200+ 个目的地，累计客户达到 3,000 万。
          tone: positive
        - label: 公共事务与质量整改
          date: 2026-09
          detail: 开始招聘高级监管事务人员，以应对多司法辖区电信许可问询，同时处理 Trustpilot 激活投诉。
          tone: warning
