        - 无法依据实时延迟动态优化路由
      - - 移动端衡量与深度链接基础设施
        - Adjust（TrueLink 平台）
        - 支撑推荐计划深度链接、归因与获客追踪
        - 单一供应商（从已弃用的 Firebase Dynamic Links 迁移）
        - 归因中断会扰乱 10% 的推荐驱动获客
        - 中
        - 自主掌握链接生成与自动链接过期控制
        - 依赖第三方移动归因 API
      - - 移动应用商店分发
        - Apple App Store 与 Google Play Store
        - 主要的直接分发、安装及应用内结账渠道
        - 双寡头（由 iOS 与 Android 生态控制）
        - 应用商店政策变化或佣金争议导致应用更新延迟
        - 高
        - 基于网页的结账与二维码直接配置门店
        - 平台费用暴露及操作系统对 eSIM 安装的控制
    notes: 评估通过技术网络分析与公司基础设施审计识别出的运营商、运营及平台依赖。
    claimRefs:
