  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 2019 年成立到 2026 年扩张的公司、融资、规模与战略里程碑。
    approximationNotes: 日期反映官方公告与行业登记册披露的公开发布时间及融资交割日期。
    claimRefs:
