chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与规模概览
        blocks:
          - type: paragraph
            body: >-
              Airalo 由连续创业者 Ahmet Bahadir Ozdemir 和运营负责人 Abraham Burak 于 2019 年创立，定位为数字旅行 eSIM 市场，在特拉华州注册，主要从新加坡运营总部管理业务
              [CO001]。平台让入境旅行者无需支付传统国际漫游费，便可在 200 多个地理目的地直接向支持 eSIM 的手机和平板购买并下载本地及区域数据套餐 [CO001, CO011]。公司从 2019 年的
              pre-seed 和 seed 融资起步，连续完成多轮股权融资，2025 年 7 月在 CVC Capital Partners 领投的 $220M C 轮融资后成为独角兽，投后估值达到 $1B [CO004,
              CO007]。这一估值建立在 $59M 已披露年收入之上，对应 16.9x 倍数 [CO008]。Growjo 的独立信息估算公司有 331 名员工，年收入约 $58.9M [CO009]。2026 年 6
              月，Airalo 报告全球累计客户超过 3000 万，显示其漏斗前端获客规模可观；但复购留存和队列层面的单位经济仍由管理层严密掌握 [CO010]。
