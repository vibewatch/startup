      - number: '3.3'
        title: 分销能力降低获客摩擦，但不消除多归属
        blocks:
          - type: paragraph
            body: >-
              Airalo 的竞争力不止于消费者应用。公司介绍了企业预算控制、白标商店、API、转售工具和代金券，其公开网站还宣传全天候多语言支持。这些触点可以把 Airalo
              嵌入雇主和合作伙伴的工作流，并可能降低复购摩擦。但它们并没有给旅行者带来硬性的技术锁定。VoyaSIM 表示，其配置文件可以与 Airalo 配置文件共存，用户还能在设备设置中选择活跃数据线路；eSimphony
              也通过改变配置文件持久性，而不是底层任务，来参与竞争。因此，忠诚度余额、服务历史、合作伙伴位置和上手熟悉度，比独占设备控制更可能构成转换成本。
            claimRefs:
              - CP003
              - CP005
