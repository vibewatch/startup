      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 战略电信合作降低去中介化风险
            body: >-
              Airalo 的股东基础包含多家大型电信运营商的直接企业创投投资，包括 e&、Singtel、Telefonica 和 Deutsche
              Telekom。公司把潜在的运营商对手转化为利益一致的分销伙伴，从而获得优先批发漫游安排，同时防范运营商激进地阻断零售渠道。
            calloutType: insight
            claimRefs:
              - CO005
              - CO006
              - CO011
          - type: callout
            title: 高收入倍数依赖服务质量留存
            body: >-
              以 $1B 估值对应 $59M 已披露收入（16.9x 倍数），意味着如果漏斗前端获客不能转化为持久且有利润的复购使用，Airalo 就容易遭遇下行重估。在日益拥挤的旅行 eSIM 市场中，持续出现的
              Trustpilot 用户投诉——包括激活失败和支持响应缓慢——构成直接的留存风险。
            calloutType: risk
