      - number: '1.3'
        title: 资本化历史、投资者联盟与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              Airalo 的资产负债表反映出五轮连续的机构融资，累计股权资本超过 $287M [CO004, CO007]。公司从 Antler 2019 年驻留项目毕业时获得 $100K pre-seed 融资，随后完成
              $1.9M seed 轮，由 Antler 和 Sequoia Capital India 的 Surge 支持 [CO004]。2021 年 10 月，Rakuten Ventures 领投 $5.4M A
              轮融资，并引入 Singtel Innov8、Telefonica 的 Wayra 和 LG Technology Ventures 等战略企业创投部门 [CO005]。2023 年 7 月，e& capital
              领投 $60M B 轮，投后估值 $280M，资本化规模明显扩大，也巩固了公司在中东和欧洲的战略分销关系 [CO006]。2025 年 7 月的 C 轮融资由 CVC Capital Partners
              领投（CVC Asia Fund VI 出资 $185M），并获 Antler Elevate 和 Peak XV Partners 追加支持，融资额 $220M，估值升至 $1B
              [CO007]。这笔融资提供了可观的运营 runway，但以 $59M 已披露收入计算的 16.9x 倍数，也意味着一旦增速放缓，股权价值可能遭遇估值倍数压缩 [CO008]。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
