        title: 产品架构与客户交付模式
        blocks:
          - type: paragraph
            body: >-
              Airalo 通过软件编排的 eSIM 市场提供全球移动数据连接，覆盖消费者应用和企业 B2B 合作伙伴平台。对于零售旅行者，公司在 200 多个地理目的地提供可下载的 eSIM
              配置文件，分为单一目的地本地套餐、区域多国套餐（如 Eurolink 和 Asialink）及全球套餐。消费者全程在 Airalo 移动应用（iOS 和
              Android）或网页门户中操作：选择目的地、购买数据配额，并通过远程 SIM 配置（RSP）在出发前或抵达后直接把 eSIM 配置文件安装到兼容硬件。除封顶套餐外，公司还在 2025 年底于 150
              个目的地推出无限数据套餐，进入 2026 年时采用量快速增长 193%。商业侧则提供 B2B 合作伙伴集成套件，包括 RESTful Partner API、预构建客户端 SDK 以及即用型
              WooCommerce 插件，让数字旅行社、航空公司和金融平台能在不到 30 分钟内把 eSIM 配置嵌入结账流程。这些企业工具支持程序化库存管理、自动生成 eSIM 订单、余额充值和基于 webhook
              的消费提醒，覆盖 6500 多家已集成的企业合作伙伴。
