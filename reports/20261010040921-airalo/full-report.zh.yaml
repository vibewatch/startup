  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与行业边界
        blocks:
          - type: paragraph
            body: >-
              旅行 eSIM 连接服务位于全球电信行业中的一个专业化跨境细分市场。旅行 eSIM
              平台并不直接争夺本地移动运营商面向常住居民的长期订阅，而是承接跨境旅行者的短期高价值数据需求，帮助他们避开运营商漫游费和购买当地实体 SIM
              的麻烦。市场边界包括数字数据套餐、区域漫游包，以及面向旅行平台的新兴批发 API 分销。固定线路电信、国内硬件设备补贴以及传统语音和短信通信不属于可服务支出，因为旅行 eSIM
              零售产品主要只提供数据。在这一边界内，Airalo 是覆盖 200 多个地理目的地的数字聚合商和虚拟连接市场，把连接服务从实体硬件分销中拆出来。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
      - number: '2.2'
        title: 市场规模、增长轨迹与渗透率视角
        blocks:
          - type: paragraph
            body: >-
              要估算国际旅行 eSIM 机会，需要同时评估硬件结构性变化和旅行者实际采用指标。GSMA 的行业信息显示，到 2030 年，支持 eSIM 的智能手机连接将超过传统实体 SIM 卡；随着硬件制造商取消实体 SIM
              卡槽，2026 年采用率将翻倍。在不断扩大的硬件基础上，Airalo 已展现出快速的品类扩张，从 2000 万名旅行者将客户账户规模提升至一年内超过 3000 万。产品组合也在变化：消费者需求正从受限的低 GB
              配额转向大容量无限套餐；后者在 2025 年底发布后，于 150 个目的地增长了 193%。但由于公司披露有限，精确估算可服务且可获得的市场份额仍受限制，交易总额和活跃复购旅行者队列仍属机密。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
      - number: '2.3'
        title: 买家画像、用户流程与预算动态
        blocks:
          - type: paragraph
            body: >-
              旅行 eSIM
              市场的采用者主要分为三类：休闲度假者、远程数字游民和企业差旅者。休闲旅行者贡献最大的交易量，他们通常在出发日期临近时购买由自己支付的单一目的地套餐，以规避本国运营商的漫游费。数字游民和频繁出境的专业人士平均交易金额更高、复购更频繁，会在多国行程中使用区域套餐。为满足企业需求，Airalo
              设有专门的 B2B 部门，让企业差旅管理员集中配置连接服务、消除意外漫游费用报销，并通过员工移动设备分发数据配额。公司的获客组合包括情绪化的大众品牌营销、目标明确的效果营销（客户获客成本约
              $12.50），以及覆盖新兴旅行线路的区域网红合作。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
      - number: '2.4'
        title: 增长驱动、竞争阻力与采用约束
        blocks:
          - type: paragraph
            body: >-
              推动旅行 eSIM 采用的首要顺风是智能手机向仅支持 eSIM 的形态转变，旗舰设备制造商走在前面，减少了国际旅行者安装实体 SIM
              的麻烦。同时，后疫情时代旅行量上升，以及导航、翻译和通信对移动应用的普遍依赖，让连接服务成为旅行中的刚需。但这一品类仍受明显的结构性约束。独立聚合商始终依赖底层移动网络运营商提供批发数据接入和本地网络质量；批发价格波动会挤压利润。战略分析还显示，当航班取消或安装出错引发服务投诉时，客服能否规模化处理会成为关键运营瓶颈。此外，一线电信运营商推出的激进全球漫游套餐，以及竞争对手
              eSIM 服务商的低价竞争，都威胁长期用户留存。
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 商品化市场中的情绪化品牌定位
            body: Airalo 在 2026 年转向全球情绪化营销（“Connection Means The World”），反映出公司有意在竞争市场的技术数据套餐趋于商品化时，建立品牌资产和用户忠诚度。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
          - type: callout
            title: 基础设施依赖与运营商批发挤压
            body: Airalo 不拥有实体电信基础设施，因此毛利率和服务可靠性取决于批发 MNO 协议，业务会受到定价压力和运营商去中介化的影响。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 方案范围广，不是双寡头市场
        blocks:
          - type: paragraph
            body: >-
              相关市场不只有旅行 eSIM 市场。旅行者可以选择无限流量专家、以安全为卖点的应用、可复用的随用随付配置文件、本地运营商 eSIM，或本国运营商的漫游产品；企业还可以使用托管连接服务以及白标或 API
              分销。Airalo 自报拥有超过 3000 万旅行者、覆盖 200
              多个目的地，分销位置可观，但现有证据并不能确立其品类市场份额。因此，竞争地图把触达范围和套餐模式灵活性视为两条独立的序数维度，而不是把发行方营销材料转化为市场份额估计。直接竞争者可以针对某种窄旅行场景，不必匹配
              Airalo 的完整目录。
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
