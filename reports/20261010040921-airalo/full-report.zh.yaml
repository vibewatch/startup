  - id: FP001
    title: 按覆盖范围与套餐模式灵活性进行竞争定位
    type: quadrant
    summary: 分析师序数图将分发广度与灵活性分开；不估算市场份额、服务质量或单位经济效益。
    data:
      points:
        - label: Airalo
          x: 5
          'y': 3
          detail: 有证据支持的分发覆盖最广；固定流量包现由无限流量及精选语音 / 短信套餐补充。
        - label: 99esim
          x: 3
          'y': 5
          detail: 有证据支持的覆盖范围低于 Airalo，但定制、团体与赠礼结构提升套餐灵活性。
        - label: eSimphony
          x: 2
          'y': 5
          detail: 按其自述，成立较晚且规模较小；以持久的终身配置文件与动态套餐形成差异化。
        - label: Holafly
          x: 4
          'y': 2
          detail: 目的地覆盖广，但集中定位于无限流量 / 按日计费。
        - label: Roamless
          x: 3
          'y': 5
          detail: 可重复使用的全球配置文件与按用量付费模式带来较高使用灵活性。
        - label: 当地运营商 eSIM
          x: 1
          'y': 3
          detail: 地理覆盖较窄，但可能更贴合本地号码与国内服务。
      xAxis:
        label: 分发广度（1=窄，5=广）
      yAxis:
        label: 套餐模式灵活性（1=单一模式，5=多种或可复用模式）
    approximationNotes: 1-5 序数分析师评分仅依据分配的来源描述得出，并非经过测量的市场份额或独立产品基准；网络质量等缺乏支持的维度不纳入。
