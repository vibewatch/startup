      - number: '3.2'
        title: 产品广度可防守；价格领先尚未确立
        blocks:
          - type: paragraph
            body: >-
              Airalo 已将目录从固定数据包扩展出去：公司报告在 150 个目的地提供无限套餐，也提供部分数据、短信和语音组合，以及从 1 GB 到 30
              天无限量产品的不同套餐大小。这缩小了与无限套餐专家之间的差距，但竞争者仍可在自定义时长和额度、持久化配置文件、每日高速档位、热点政策和低起价上做差异化。公开价格比较只能作为方向性参考而非定论，因为大多数比较由竞争供应商发布，且各方案的国家数量、有效期、网络和公平使用规则不同。10
              月的 VoyaSIM 比较是样本中最接近的匹配数据点，但它仍是竞争者自撰观察，而不是独立的交易级基准。
            claimRefs:
