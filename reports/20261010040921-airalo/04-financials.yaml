callouts:
  - calloutType: "risk"
    title: "Downside Exposure from Carrier Wholesale Pricing Power and Opaque Gross Margins"
    body: "Airalo operates without owning underlying cellular infrastructure or spectrum, functioning as a Mobile Network Aggregator dependent on wholesale capacity sponsored by base MNOs. Because realized carrier data contracts, volume discount tiers, and customer refund leakage remain undisclosed, gross margins are highly sensitive to wholesale rate increases by dominant telecommunications operators and potential shifts toward direct carrier eSIM offerings."
    claimRefs:
      - "CI006"
      - "CI010"
      - "CI015"
