company:
  name: "Airalo"
chapter:
  number: 4
  title: "Financials"
  summary: "Airalo operates a high-volume travel connectivity marketplace reaching 30 million cumulative customers, but keeps core financial metrics including gross margin waterfalls, wholesale carrier transit rates, and cash burn private. While consumer list prices reflect healthy top-line yields with a $7.90 per GB median, absence of audited disclosures leaves capital efficiency and post-Series C financial runway unverified for underwriting."
sections:
  - id: "revenue-streams-and-commercial-model"
    title: "Revenue Streams and Commercial Monetization Channels"
    body: "Airalo derives the vast majority of its commercial volume from direct-to-consumer digital transactions, selling prepaid travel eSIM data bundles to international travelers across more than 200 geographic destinations. The company reported expanding its cumulative user base from 20 million to 30 million registered customers in approximately one year, driven by accelerating global adoption of digital eSIM connectivity over physical plastic SIM cards. Beyond self-serve consumer applications on iOS and Android, Airalo operates an enterprise arm called Airalo Partners that provides centralized billing for corporate travel teams alongside wholesale connectivity APIs for travel platforms, airlines, and financial applications. The introduction of unlimited data plans in late 2025 across 150 destinations expanded catalog volume by 193%, yet realized blended revenue realization and active transactional customer counts remain undisclosed."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI007"
      - "CI016"
    tableRefs:
      - "TI001"
  - id: "pricing-architecture-and-realized-yields"
    title: "Pricing Architecture and Cross-Destination Yields"
    body: "Airalo structures retail pricing across three distinct catalog tiers: local single-country plans, regional multi-country packages, and global roaming bundles. Entry-level pricing starts at $4.50 for a 1GB seven-day package in primary tourist destinations including Japan, the United Kingdom, and the United States, providing a low-friction customer acquisition hook for first-time travelers. As data allocations scale to 10GB or 20GB, unit pricing drops toward $1.90 to $2.60 per GB for popular corridors, while regional and multi-destination global plans command premium rates ranging from $5.90 to $9.00 per GB. Independent academic measurement across 219 served countries confirmed a median retail price of $7.90 per GB, placing Airalo in the upper pricing quartile compared to alternative marketplace aggregators."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI002"
  - id: "cost-structure-and-unit-margin-mechanics"
    title: "Cost Structure, Unit Margins, and Operational Friction"
    body: "Airalo functions structurally as a thick Mobile Network Aggregator rather than an infrastructure-owning telecommunications operator, sourcing wholesale cellular capacity from six core base mobile network operators such as Play Poland to provision roaming access globally. This asset-light architecture avoids spectrum licenses and physical cell tower capital expenditure but introduces significant cost sensitivity to underlying carrier wholesale data pricing and transit gateway fees. On the operational ledger, customer terms restrict refund rights to a 14-day window that terminates upon plan activation, and voluntary cancellations default to non-cash in-app Airmoney credits rather than cash refunds, effectively preserving working capital. Concurrently, customer support overhead has expanded, with user complaints documenting reliance on an automated AI chatbot and 24 to 48 hour delays for human agent dispute resolution across its network of 22 disclosed third-party operational subprocessors."
    claimRefs:
      - "CI006"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-underwriting-verdict"
    title: "Capital Adequacy, Corporate Structure, and Diligence Blockers"
    body: "Airalo significantly fortified its balance sheet in July 2025 by securing a $220 million Series C financing round led by private equity sponsor CVC alongside Peak XV Partners and Antler, raising total historical equity funding to $287 million at a $1 billion valuation. Corporate operations are structured across two principal corporate entities: AIRGSM PTE. LTD. in Singapore managing international operations and AIRGSM HOLDINGS, INC. in Delaware serving as the primary holding company. However, because Airalo remains a private entity without public regulatory filings, critical underwriting inputs—including recognized annual recurring revenue, gross margin waterfalls, carrier wholesale payables, and forward cash burn—remain confidential. Diligence requires audited financial verification before underwriting capital adequacy at current unicorn valuation marks."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
