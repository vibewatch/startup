company:
  name: "Airalo"
chapter:
  number: 6
  title: "Customers"
  summary: "Airalo has expanded its customer base to more than 30 million registered users as of June 2026, establishing clear leadership in travel eSIMs across 200+ destinations. While B2C retail adoption is bolstered by strong app store distribution and localized multi-language support, true customer durability remains difficult to evaluate due to intermittent leisure travel cycles, private cohort retention, and early-stage B2B enterprise penetration."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Segmentation and Commercial Profiles"
    body: "Airalo's customer base spans three distinct commercial segments characterized by varying purchasing behaviors, price sensitivities, and distribution interfaces. The core volume driver remains consumer retail travelers who purchase single-country or regional prepaid data eSIMs directly through mobile application storefronts in advance of international trips. To diversify beyond seasonal holiday travel, Airalo introduced the Airalo Partners platform, creating dedicated B2B enterprise pathways for corporate travel management and B2B2C channels for travel agencies, tour operators, and corporate resellers. In addition, white-label and API integration partners embed connectivity packages directly into third-party booking workflows, though enterprise contract values and client concentration levels remain closely held private data."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-headline-scale"
    title: "Adoption Trajectory and Cumulative Scale"
    body: "Airalo has demonstrated rapid cumulative user growth since launching in 2019, scaling from 10 million registered users in May 2024 to 20 million in mid-2025 and surpassing 30 million customers by June 2026. This trajectory reflects broader structural tailwinds in mobile telecommunications, including rising global consumer awareness of digital SIM technology and increasing hardware penetration across modern smartphones. Product mix evolution has accompanied this expansion: following the introduction of Unlimited data plans across 150 destinations in late 2025, adoption of unlimited tiers surged by 193% over subsequent quarters. However, external analysts note that cumulative user counts obscure active billing accounts, as intermittent travelers often generate single transactions without establishing predictable recurring revenue."
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "enterprise-and-channel-deployment-proof"
    title: "Enterprise and Channel Deployment Proof"
    body: "Evidence of enterprise and channel adoption is centered around Airalo's commercial partner ecosystem, which the company reports has surpassed 5,000 active partner entities worldwide. Commercial engagements range from independent travel agencies reselling data bundles to multinational corporations utilizing Airalo for Business to manage employee cellular roaming expenses. Airalo continues active recruitment for enterprise sales leadership in North America and Europe to formalize consultative outreach to Fortune 500 corporate travel procurement teams. Nevertheless, public reference proof remains heavily skewed toward aggregated ecosystem metrics rather than named enterprise logos or audited case studies, leaving institutional concentration and account durability subject to ongoing management verification."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "customer-journey-retention-and-churn-dynamics"
    title: "Customer Journey, Retention Loops, and Friction Points"
    body: "The customer journey for Airalo users begins in high-intent discovery channels, where prospective travelers seek affordable data connectivity under immediate travel pressure. The mobile-first checkout experience provides immediate digital eSIM delivery and profile installation via QR codes or direct in-app configuration, eliminating physical SIM card logistics. While customer sentiment praises seamless arrival connectivity, independent testing highlights material product boundaries: Airalo eSIMs provide mobile data only, omitting native cellular voice calls and SMS capabilities, while entry-level packages carry finite allowances (1 GB to 20 GB) requiring proactive in-trip top-ups. Furthermore, the episodic nature of leisure vacations presents structural retention challenges, requiring continuous investment in app store acquisition to offset dormant user intervals."
    claimRefs:
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
