callouts:
  - calloutType: insight
    title: "The Dual Dynamics of Consumer Friction and Loyalty"
    body: "Airalo's core consumer value proposition delivers high immediate utility by converting the stressful arrival experience into an instantaneous connection. However, the absence of voice/SMS support and reliance on fixed data caps create user friction when travelers require local calling or exhaust allowances mid-trip, highlighting why the 2025 launch of Unlimited plans is a critical lever for customer expansion."
    claimRefs:
      - "CU006"
      - "CU009"
      - "CU010"
  - calloutType: risk
    title: "Dormancy and Re-Acquisition Costs in Leisure Travel"
    body: "Unlike recurring enterprise SaaS, international travel is intermittent for the majority of retail users. Without transparent disclosure of annual cohort retention or active billing users, high headline customer counts (30 million) may mask substantial post-trip churn, forcing continuous re-acquisition spend through search ads and app store discovery."
    claimRefs:
      - "CU001"
      - "CU008"
      - "CU011"
