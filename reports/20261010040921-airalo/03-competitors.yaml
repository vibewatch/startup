      missingEvidence: >-
        Independent, destination-matched testing of price, activation success,
        network quality, latency, throttling, refund outcomes, and support
        response times across Airalo and the principal alternatives.
      whyItMatters: >-
        Most allocated comparisons are competitor-issued, so they identify
        attack vectors but cannot establish durable superiority or normalized
        savings.
