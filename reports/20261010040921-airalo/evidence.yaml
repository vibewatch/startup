    whyItMatters: >-
      Airalo reports 30 million lifetime users but does not disclose annual active users, repeat purchase frequency, or
      cohort decay, obscuring true customer lifetime value.
    diligencePath: >-
      Obtain cohort retention data, monthly active user (MAU) metrics, and repeat purchase ratios from internal BI
