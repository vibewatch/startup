evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Audited gross margins and carrier wholesale cost waterfalls
    missingEvidence: >-
      Audited income statements, gross profit margins, data wholesale cost per gigabyte, and customer refund rates for
      2024 through 2026.
    whyItMatters: >-
      Without carrier cost waterfalls and gross margin profiles, underwriting the durability and profitability of the
      16.9x Series C revenue multiple is impossible.
    diligencePath: >-
      Request audited financial statements, unit economics per destination cohort, and wholesale carrier master service
      agreements under NDA.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: Leadership and founder table
    missingEvidence: >-
      Comprehensive roster of corporate officers, board of directors committee composition, and executive equity
      ownership stakes.
    whyItMatters: >-
      Assessing key-person risk and governance alignment between founders and institutional sponsors requires complete
      cap table and voting details.
    diligencePath: >-
      Obtain the certified capitalization table, voting agreements, and board governance charters during formal
      management diligence.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder or investor map
    missingEvidence: >-
      Detailed Series C share class rights, liquidation preference seniority, drag-along thresholds, and redemption
      covenants.
    whyItMatters: >-
      In a 16.9x multiple financing, senior downside protections or 1x non-participating vs participating preferences
      dictate common equity recovery.
    diligencePath: Examine the Series C Amended and Restated Certificate of Incorporation and Investor Rights Agreement.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited breakdown of Airalo active annual transacting travelers, gross merchandise value (GMV), and net wholesale
      data revenue.
    whyItMatters: >-
      Essential to calculate true SOM capture and determine repeat transaction frequency versus one-off customer
      acquisition.
    diligencePath: >-
      Request management diligence on gross data gigabyte volume, cohort retention, and geographic revenue
      concentration.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      Independent, destination-matched testing of price, activation success, network quality, latency, throttling,
      refund outcomes, and support response times across Airalo and the principal alternatives.
    whyItMatters: >-
      Most allocated comparisons are competitor-issued, so they identify attack vectors but cannot establish durable
      superiority or normalized savings.
    diligencePath: >-
      Commission a blinded multi-country benchmark using identical devices, itineraries, data allowances, validity
      windows, and support scenarios.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP008
  - type: private-evidence-only
    severity: material
    topic: carrier-economics
    missingEvidence: >-
      Carrier concentration, wholesale rate cards, minimum commitments, service-level agreements, and renewal or
      termination terms for Airalo and major rivals.
    whyItMatters: >-
      Supply access and gross-margin resilience determine whether catalog breadth and pricing can remain differentiated
      as retail offers converge.
    diligencePath: >-
      Review carrier contracts, supplier concentration schedules, country-level gross margins, outage credits, and
      renewal calendars in the data room.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: trust-and-regulatory-posture
    missingEvidence: >-
      Independent security audits, privacy-control comparisons, complaint and refund statistics, material incident
      history, and jurisdiction-specific telecom compliance evidence.
    whyItMatters: >-
      The allocated pool does not support a comparative judgment on trust, service reliability, or regulatory
      durability.
    diligencePath: >-
      Obtain audit reports, incident and complaint logs, privacy assessments, regulatory registrations, and matched
      third-party customer evidence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-waterfall
    missingEvidence: >-
      Audited financial disclosure of realized wholesale carrier data costs, gross margin waterfall, and refund cash
      leakage.
    whyItMatters: >-
      Without primary accounting records of wholesale carrier COGS and net revenue realization, investors cannot verify
      whether Airalo achieves sustainable unit-level contribution margins across regional corridors.
    diligencePath: >-
      Request management's audited P&L statement, destination-by-destination wholesale data rate schedules, and
      gross-to-net revenue bridges.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-retention-and-cac
    missingEvidence: >-
      Cohort retention curves, repeat customer purchasing frequency, and blended versus paid customer acquisition cost
      (CAC).
    whyItMatters: >-
      Airalo's headline count of 30 million registered users conceals the proportion of one-off leisure travelers versus
      recurring business users, leaving customer lifetime value (LTV) and marketing payback unverified.
    diligencePath: >-
      Obtain quarterly cohort analysis, repeat transaction frequency data, and breakdown of paid search ad spend versus
      organic viral acquisition.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: telecom-core
    missingEvidence: >-
      Direct disclosures of Airalo's proprietary core network assets, custom gateway implementations, and contractual
      carrier SLA terms versus wholesale MVNO dependency.
    whyItMatters: >-
      Without architectural transparency into proprietary packet gateways versus leased IPX provider infrastructure,
      technical diligence cannot independently verify platform resilience or unit margin defensibility.
    diligencePath: >-
      Request architecture diagrams of proprietary network elements, carrier interconnect agreements, IPX service
      contracts, and failover disaster recovery logs from engineering leadership.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: enterprise-and-partner-customer-concentration
    missingEvidence: >-
      Audited customer concentration figures, top-partner revenue shares across the 5,000+ B2B partner network, and
      contractual commitment terms.
    whyItMatters: >-
      Without disclosure of top-partner concentration, investors cannot determine whether B2B revenue is diversified
      across travel agents or dependent on a handful of major corporate/reseller accounts.
    diligencePath: >-
      Request customer concentration schedule, top-10 partner revenue breakdown, and contract renewal terms during
      management diligence.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: cohort-retention-and-repeat-purchase-rates
    missingEvidence: >-
      Detailed cohort retention curves, annual repeat transaction rates, and net revenue retention (NRR) data across
