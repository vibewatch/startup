evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: >-
      Primary financing documents or management-confirmed round ledger showing security types, round sizes, valuation
      basis, and investor ownership.
    whyItMatters: >-
      Public databases disagree on valuation and do not expose governance rights, which makes ownership and dilution
      risk impossible to underwrite from open sources.
    diligencePath: Request cap table, round summaries, and investor rights documents from management or lead counsel.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Verified ARR, revenue, customer count, pipeline, and recurring-contract metrics for payments, CBDC, or
      digital-health deployments.
    whyItMatters: >-
      The public story is infrastructure-scale and policy-linked, but no open source confirms whether that translates
      into recurring commercial revenue.
    diligencePath: Request management KPI pack and customer-contract summary segmented by product and geography.
    relatedQuestionRefs:
      - QO027
  - type: missing-source
    severity: material
    topic: commercial-deployment
    missingEvidence: >-
      Independent customer or regulator evidence showing production deployment of GVE platforms beyond catalog inclusion
      or presentation materials.
    whyItMatters: >-
      Policy visibility and forum participation are not substitutes for contracted production usage in central-bank,
      bank, or hospital environments.
    diligencePath: >-
      Ask for signed reference customers, live deployment certificates, or regulator acknowledgements tied to production
      rollout.
    relatedQuestionRefs:
      - QO018
      - QO020
      - QO021
