- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No named production deployment
    - Still no regulated customer go-live by next financing cycle
    - Undermines the claim that institutional proof is converting into business quality
    - Stay out / downgrade to option value only
  - - No revenue-quality disclosure
    - Management cannot provide revenue bridge, retention data, or contract durations
    - Breaks the case for premium multiple support
    - Use only downside case or decline
  - - Valuation cannot be reconciled
    - Public marks and signed docs remain inconsistent
    - Breaks confidence in entry price discipline
    - Treat headline valuation as unreliable and step away
  - - Assurance package remains absent
    - No third-party security / compliance proof for critical deployments
    - Weakens procurement and scaling thesis
    - Apply severe discount or decline
  - - Losses widen without customer proof
    - Further loss accumulation with no anchor go-live
    - Signals time-to-proof is stretching
    - Assume dilution / down-round risk
  notes: These are falsifiable triggers that matter more than narrative momentum.
