  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      GVE’s public architecture can be read as a layered stack from endpoints and workflow capture up through
      private-channel security and cross-institution settlement or identity orchestration.
    approximationNotes: This stack synthesizes multiple public sources rather than copying one canonical engineering diagram.
    claimRefs:
      - CE001
      - CE002
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE022
    data:
      layers:
        - label: Workflow / endpoint layer
          detail: >-
            Smartphones, scanners, terminals, passports, and user-facing interactions initiate the process in payments,
            identity, or travel-health use cases.
        - label: Access and authentication layer
          detail: >-
            Access points and private-key / PSK-style authentication establish trusted sessions with reduced handshake
            overhead.
        - label: Security and key-control layer
          detail: >-
            PQC-oriented key generation, key-authority controls, HSM-style protection, and secret-sharing logic protect
            critical credentials.
        - label: Integrity and synchronization layer
          detail: >-
            Three-way database and related storage logic aim to maintain consistency and detect tampering without
            conventional heavy PKI dependence.
        - label: Institutional orchestration layer
          detail: >-
            Hierarchical platform design links banks, governments, local authorities, and partner systems on one logic
            model.
        - label: Outcome layer
          detail: Real-time settlement, identity verification, or secure health-data retrieval occur as workflow outputs.
