      - number: '3.3'
        title: Pricing, Packaging, Switching Cost, and Buyer Preference
        blocks:
          - type: paragraph
            body: >-
              Public pricing is notably weak across GVE’s practical competitor set. That is itself a useful signal. The
              vendors that dominate regulated infrastructure and enterprise security accounts mostly sell through custom
              contracts, account teams, integrators, or bundled platform programs rather than transparent self-serve
              lists. Even when trial access exists, the purchase motion remains enterprise-oriented. For GVE this means
              price disruption alone is unlikely to win deals; buyers will evaluate vendor trust, integration burden,
              approved-vendor status, support depth, and operational continuity ahead of sticker price.


              Switching costs also favor incumbents. Bank payment and identity environments are tightly bound to legacy
              systems, compliance rules, and institutional risk teams. Hospital and public-health environments add
              interoperability and privacy constraints on top of that. The Bank of Japan’s continuing CBDC pilot posture
              and the Digital Agency’s expanding My Number/JPKI stack both reinforce the same lesson: standards fit and
              migration execution matter as much as technical novelty. A new vendor can be adopted only if it clearly
              reduces implementation pain or delivers an outcome that incumbent suites cannot provide.


              This is where GVE’s commercial risk becomes visible. The company may have a genuine differentiation thesis
              in secure low-latency infrastructure, but it appears to lack public evidence of the sort of large-scale
              recurring deployments that make switching easier for cautious buyers. In procurement terms, GVE is likely
              to be considered either a specialist add-on, a pilot vendor, or a design partner rather than a default
              replacement for an incumbent security or health platform. That does not eliminate upside; it just means
              sales cycles and proof demands should be assumed to be heavy.
