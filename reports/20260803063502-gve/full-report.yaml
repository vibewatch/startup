  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Thesis-Integrity Risk
        blocks:
          - type: paragraph
            body: >-
              GVE is trying to sell into the hardest part of the software and infrastructure market: regulated systems
              that touch money, identity, and health data. That creates a structural regulatory risk even before any
              adverse event occurs. The Digital Agency’s materials show that identity, public-health data exchange,
              public procurement, and digital-government workflows in Japan are active and evolving. The White House and
              WHO materials show the same pattern internationally: post-quantum migration, digital-health governance,
              and critical-infrastructure security are moving targets. A company can be directionally right on
              architecture but still lose time or deals if public buyers adopt different standards, procurement rules,
              or compliance requirements than expected.


              The legal risk profile is also real rather than theoretical. GVE publicly disclosed that its trademark
              dispute with Exchangers was resolved by settlement, which means IP conflict has already surfaced once.
              That is not catastrophic, but it matters because GVE’s positioning depends heavily on proprietary
              architecture, patents, and naming. The human-rights policy is a helpful governance signal, yet there is
              still no retained public evidence of enterprise compliance certifications, external audits, or
              jurisdiction-by-jurisdiction approval packages for payments, identity, or health deployments.


              The main thesis-integrity risk is therefore not “regulation will kill the company tomorrow.” It is that
              sales cycles, proof requirements, and compliance burdens may be much heavier than the current public
              evidence set implies. If that happens, commercialization can lag technical ambition for longer than
              investors expect.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
