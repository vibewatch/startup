  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: What the Public Balance Sheets Actually Show
        blocks:
          - type: paragraph
            body: >-
              GVE’s most usable public financial evidence is its annual balance-sheet disclosure. The FY2021 through
              FY2024 statements show a business that has consistently held substantial cash balances, low current
              liabilities in the most recent years, and negative retained earnings that continue to deepen. Cash and
              deposits rose from ¥851.7 million in FY2021 to ¥1.14 billion in FY2023 before falling to ¥938.3 million in
              FY2024. Total net assets stayed above ¥1.18 billion in every disclosed year and stood at ¥1.44 billion in
              FY2024, while total liabilities fell from ¥259.0 million in FY2021 to just ¥16.0 million in FY2024.


              That balance-sheet pattern matters because it suggests GVE has not been operating at the edge of immediate
              liquidity stress. At the same time, it does not prove strong operating performance. The same filings show
              annual net losses worsening from ¥54.0 million in FY2021 to ¥62.1 million in FY2022, ¥109.7 million in
              FY2023, and ¥114.9 million in FY2024. Retained earnings moved further negative each year. In addition,
              part of the asset base is not simple operating cash: the balance sheets include long-term or short-term
              loans and, in FY2024, investments in related companies.


              The public statements therefore support a narrow conclusion: GVE appears solvent on book-value terms and
              lightly levered in recent years, but its internal engine remains opaque. Investors can observe cash,
              liabilities, and loss accumulation. They cannot observe the quality of the revenue that would eventually
              absorb those losses.
            claimRefs:
              - CI001
              - CI002
              - CI003
