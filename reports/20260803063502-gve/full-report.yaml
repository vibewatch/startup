      - number: '5.3'
        title: Deployment, Integration, and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              The most concrete operating workflow in public evidence is VICSA. GVE and CMIC describe a system where
              passport information is read at an airport, the system retrieves the traveler’s vaccination or
              medical-record information from secure infrastructure, checks destination-country requirements, and
              confirms whether entry conditions are satisfied. The page stresses two design choices that matter
              operationally: travelers do not need a dedicated smartphone app, and servers holding sensitive information
              can remain inside each participating country. That points to a product architecture optimized for
              privacy-sensitive cross-border workflows with high interoperability friction.


              The payment workflow is described more conceptually but still reveals important operating assumptions.
              Cabinet materials portray GVE as an account-to-account settlement layer linking users, merchants, and
              banks in real time, while simplifying the legacy chain of issuers, acquirers, processors, and schemes. The
              same materials say the OS can integrate with banking cores and gateways rather than demanding an entirely
              greenfield environment. The identity workflow extends this one layer further: hierarchical identity
              linkage is shown as a method to connect national, prefectural, municipal, and private systems on one
              platform.


              This integration story is powerful on paper but also exposes risk. Every workflow depends on outside
              institutions—banks, ministries, airports, health systems, or local governments—changing operational
              behavior. GVE appears to understand that, which is why many of its public documents read like
              design-partner or feasibility-stage materials rather than mature product manuals. The company has a
              product logic for integration, but public support and reliability detail remain thin.
