      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are visible in both public policy and market research. Yano highlights
              AI-enabled attack democratization, cloud migration, IoT expansion, and the multiplication of remote
              endpoints as reasons Japanese firms are treating cybersecurity as business continuity infrastructure
              rather than optional IT spend. The NCO and METI policy surfaces reinforce the same point from a state
              perspective: Japan is updating national strategy, active-cyber-defense posture, industrial guidelines, and
              trust infrastructure rather than assuming legacy models are sufficient.


              Digital identity and health digitization add two more drivers. The My Number stack keeps expanding into
              health-insurance certificates, mobile credentials, public-money receiving accounts, and APIs for
              businesses and public agencies. In healthcare, Research and Markets, IMARC, and TechSci all point to
              ageing demographics, workforce shortages, and government-backed digital-health standardization as reasons
              EHR/EMR adoption continues. For GVE specifically, that matters because its product narrative is strongest
              when security is bundled with infrastructure modernization rather than sold as a standalone control.


              The constraints are equally important. High implementation and maintenance costs, privacy and
              data-sovereignty concerns, interoperability problems, and the difficulty of integrating with legacy public
              or healthcare systems all slow adoption. TechSci also highlights a concrete exposure point: 57.8% of
              EMR-using hospitals connect those systems to external networks, creating information-leakage risk while
              simultaneously making modernization harder to delay. Digital-identity adoption has similar friction—Japan
              is moving toward chip-based verification precisely because photo-based eKYC has become too vulnerable to
              forgery, but that shift requires NFC-capable devices, app redesign, user support, and regulatory
              execution. The market is therefore clearly growing, but the revenue curve for any infrastructure vendor
              will be gated by implementation complexity and procurement stamina.
