      - number: '1.4'
        title: Capital Structure, Funding Signals, and Balance-Sheet Snapshot
        blocks:
          - type: paragraph
            body: >-
              Public disclosure on capital structure is partial but still more informative than many private startups
              because GVE posts annual balance sheets. The 2021–2024 statements show total assets consistently above
              ¥1.4 billion, modest reported liabilities, and net assets between roughly ¥1.18 billion and ¥1.53 billion.
              They also show persistent negative retained earnings, meaning the balance sheet is not the same as
              operational profitability. Capital stock remains ¥100 million through the recent statements, while stock
              acquisition rights increased from ¥106 million in 2023 to ¥130 million in 2024.


              Funding-round history is much murkier. The official company site preserves a short Sankei-linked note
              saying a 2020 capital increase tied to U.S.-fund investment supported IPO preparation. Startup DB expands
              that into an approximately $25 million financing in May 2020 involving Evolution Financial Group, while
              Caplight lists a Series A in April 2020 followed by 2021 and 2022 rounds plus a last funding event in
              December 2024. These databases are directionally consistent on venture backing and multiple rounds, but
              they do not provide a clean, fully corroborated cap-table history in public view.


              Valuation is the most volatile and least reliable headline metric. Caplight shows an estimated $10.65
              billion valuation as of 1 December 2024 with $30.53 million total funding raised, while INITIAL shows a
              much higher estimated post-money figure in yen as of its July 2026 update. The disparity is so large that
              valuation should be treated as a scenario range rather than a settled fact until management or primary
              legal documents reconcile the capitalization, security type, and pricing basis behind each database
              estimate.
