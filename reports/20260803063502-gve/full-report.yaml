      - number: '4.2'
        title: Revenue Model and Monetization Proxies
        blocks:
          - type: paragraph
            body: >-
              No retained public source discloses GVE’s revenue by product, customer, geography, or contract type. The
              best that can be done is to triangulate monetization from company materials and third-party profiles.
              Caplight labels GVE’s customer profile as B2G with a business model spanning Services & Consulting and
              Subscription SaaS. The VICSA materials say GVE intends to license API invocation functions into airport
              systems and other existing operational environments. The broader platform narrative and startup-database
              profiles imply a mix of platform licensing, implementation work, integration projects, and recurring
              support or subscription elements.


              This is directionally coherent with the company’s product set. CBDC, identity, and secure health-record
              infrastructure are not consumer apps; they are high-touch institutional systems. That implies long sales
              cycles, large design or integration scopes, and revenue recognition that may blend milestone payments,
              service fees, and ongoing platform support. The Gift Pad alliance and policy-facing JETRO / government
              materials also suggest that partnerships and strategic deployments are part of the commercialization path,
              not just standalone software subscriptions.


              The problem is that none of these public clues reveal realized pricing, discounting, renewal behavior, or
              customer concentration. Even the JETRO deck, while financially suggestive, is a scenario document rather
              than evidence of closed contracts. So the revenue model can be sketched, but not underwritten. Publicly,
              GVE looks more like a custom infrastructure vendor with some SaaS characteristics than a clean
              subscription software business.
