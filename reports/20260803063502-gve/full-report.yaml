      - number: '7.4'
        title: Financial, Model, and Valuation Risk
        blocks:
          - type: paragraph
            body: >-
              Financial risk is high mostly because the public record is thin and contradictory. The balance-sheet
              notices are real and useful, but they do not disclose revenue, gross margin, or cash flow. They do show
              persistent losses through FY2021-FY2024. That means investors can observe balance-sheet strength and loss
              accumulation, but cannot independently measure commercial efficiency or runway quality from public
              materials alone. In a company pursuing sovereign and bank sales cycles, that missing middle matters. Long
              procurement cycles can consume time and capital even when strategic value is genuine.


              Public valuation data also diverges sharply. Caplight places GVE at an estimated $10.65B with $30.53M
              raised. Premier Alternatives shows a $2B valuation and $33.8M total funding. INITIAL and STARTUP DB use
              yet another framing, while a GVE post quoting Medical Confidentia mentions a 467.9B-yen market-cap-style
              number. Those marks may reflect different dates, methodologies, or stale data, but the practical investor
              risk is the same: the public market-intelligence surface is noisy enough that headline valuation can
              overstate confidence.


              A separate model risk is business-model ambiguity. Caplight classifies GVE as B2G and mentions
              services/consulting plus subscription SaaS, but retained sources still do not cleanly separate software
              licensing, integration, feasibility studies, partner revenue, and sovereign platform economics. That
              uncertainty makes forecasting difficult and weakens any simple multiple-based valuation argument.
            claimRefs:
              - CR025
