companyProfile:
  summary: >
    GVE Co., Ltd. is a Tokyo-based cybersecurity and digital-infrastructure company founded in November 2017. Public
    materials describe a platform strategy that combines cryptographic security, instant settlement infrastructure,
    digital identity linkage, and privacy-sensitive health-data exchange. The company’s most visible proof points are
    the CMIC partnership and WHO-linked VICSA workflow, a Gift Pad business alliance, and UNIDO-documented feasibility
    work with the National Bank of Ukraine. GVE’s ambition is large and strategically relevant, but public commercial
    proof remains much thinner than its product narrative.
