            - Gift Pad
            - JICA / policy forums
        - label: Pilot / validation stage
          detail: The workflow is framed as joint research, a standards-aligned concept, or a feasibility study.
          touchpoints:
            - WHO DCH
            - Ukraine study
            - PPP survey
        - label: Operational use case
          detail: >-
            Airport vaccination checks, bank settlement modernization, or municipal / enterprise digital programs go
            live if adopted.
          touchpoints:
