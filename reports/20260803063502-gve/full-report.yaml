      - number: '5.5'
        title: Trust, Privacy, Compliance, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Trust is central to GVE’s value proposition because the company targets payment, identity, and health
              data. Public materials repeatedly emphasize privacy protection, data sovereignty, and security controls
              rather than consumer-grade usability alone. The English homepage says critical keys are held in
              hardware-security style modules and that master keys are split using secret sharing to reduce insider and
              disaster risks. VICSA materials say participating countries can keep their data on servers located
              domestically. Cabinet slides frame the design as compliance-by-design and aligned with ISO 24643 and
              EU-style privacy logic.


              There are also softer governance signals. The company has published a group human-rights policy, and the
              public-notices pages show regular corporate disclosure behavior around balance sheets and capital actions.
              WHO Digital Clearing House inclusion for VICSA provides a measure of external vetting for at least one
              workflow. These are useful trust indicators, especially for a small company trying to sell into
              governments and regulated entities.


              But there are also conspicuous gaps. No retained public source shows SOC 2, ISO 27001, HIPAA
              certification, formal uptime metrics, penetration-test summaries, incident disclosures, support SLAs, or
              production reliability metrics. The technology narrative is trust-heavy; the public operating evidence is
              trust-light. That does not invalidate the product, but it means diligence should separate architectural
              promise from operational assurance.
