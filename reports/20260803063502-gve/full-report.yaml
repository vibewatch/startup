      - - Valuation cannot be reconciled
        - Public marks and signed docs remain inconsistent
        - Breaks confidence in entry price discipline
        - Treat headline valuation as unreliable and step away
      - - Assurance package remains absent
        - No third-party security / compliance proof for critical deployments
        - Weakens procurement and scaling thesis
        - Apply severe discount or decline
      - - Losses widen without customer proof
        - Further loss accumulation with no anchor go-live
        - Signals time-to-proof is stretching
        - Assume dilution / down-round risk
    notes: These are falsifiable triggers that matter more than narrative momentum.
    claimRefs:
      - CV031
      - CV033
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Customer proof
        - Named deployment map by account and stage
        - Determines whether proof is pilot-level or production-level
        - Management + reference calls
      - - Financial quality
        - Revenue, gross margin, cash flow, runway, and contract economics
        - Needed to value anything beyond an option on technology
        - Finance data room
      - - Valuation reconciliation
        - Signed round docs, cap table, and any secondary transactions
        - Needed to choose between $2B-style and $10.65B-style public marks
        - Legal / finance diligence
      - - Security assurance
        - Audit package, certifications, incident history, and uptime / SLA metrics
        - Critical for sovereign or bank procurement confidence
        - Security data room
      - - Partner economics
        - CMIC, Gift Pad, and sovereign-partner contract terms
        - Clarifies concentration and monetization path
        - Commercial diligence
      - - Org readiness
        - Hiring plan and operating ownership for delivery / compliance / support
        - Tests whether the team can absorb large regulated deployments
        - HR / operating review
    notes: >-
      If these asks are answered strongly, recommendation and valuation stance can improve quickly; if not, the
      public-evidence caution likely stands.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV039
