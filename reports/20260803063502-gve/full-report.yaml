      - number: '2.2'
        title: 'Sizing Lenses: Broad Cyber TAM, Identity Footprint, and Healthcare IT Adjacency'
        blocks:
          - type: paragraph
            body: >-
              On a broad-lens basis, Japan is already a large and still growing cybersecurity market. Yano estimates
              domestic cybersecurity market size at ¥1.9471 trillion in fiscal 2025 and forecasts ¥2.122 trillion in
              fiscal 2026, while Research and Markets and Mordor Intelligence both place the 2026 Japan cybersecurity
              market at roughly $11.36 billion and forecast high-single- to low-double-digit CAGR through 2031. Those
              numbers are directionally consistent even though the methodologies differ. For chapter purposes, that
              establishes that GVE is operating inside a country where cybersecurity spend is already material and not
              niche.


              The digital-identity lens is different because public adoption is easier to observe than budget size. The
              Digital Agency states that My Number is used to identify individuals across administrative procedures and
              private services, while the same policy stack now includes JPKI, chip-reading software, digital
              authentication APIs, and Mynaportal APIs. UN ESCAP reports that more than 100 million My Number
              Cards—about 80% of the population—had been issued by early 2026, with roughly 63 million public-money
              receiving accounts registered by late 2025. That does not tell us the exact size of Japan’s
              digital-identity security budget, but it does show that the identity substrate is already national in
              scale.


              Healthcare is the most measurable adjacent niche for GVE’s health-data story. Research and Markets
              forecasts the Japan EHR market to grow from about $1.0 billion in 2026 to $1.3 billion in 2031; IMARC puts
              the adjacent EMR market at $977.2 million in 2025 and $1.73 billion by 2034; TechSci estimates $744
              million in 2024 growing to roughly $947 million by 2030. These are not identical market definitions, but
              together they support a conservative conclusion: Japan’s digital health-record market is already large
              enough to matter, yet far smaller than the overall cybersecurity TAM. That is why GVE’s realistic SAM is
              best viewed as a regulated-infrastructure wedge across several budget pools rather than a single headline
              market number.
