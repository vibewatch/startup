      - number: '6.4'
        title: Expansion Loops and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              If GVE wins, it will likely expand by reusing one security and orchestration layer across adjacent
              institutional workflows. The pattern is visible in public materials: a CBDC or instant-settlement
              architecture extends into bank and government payment systems; VICSA extends into broader EMR and
              health-data exchange; identity examples tie My Number-style authentication to private-sector and
              government workflows; and partner channels such as Gift Pad can widen access to enterprise and municipal
              programs. This is a classic infrastructure expansion model in which a small number of reference
              deployments can unlock many higher-value adjacencies.


              The risk is concentration. Almost every strong public proof point clusters around a few entities: CMIC in
              digital health, Gift Pad in municipal or enterprise channel access, Japanese policy forums for sovereign
              payments, and one feasibility thread in Ukraine. That is enough to show seriousness, but not enough to
              prove diversification. The sales motion also appears procurement-heavy and integration-heavy, which means
              long cycles, slow public proof accumulation, and dependence on policy momentum.


              Accordingly, the best current reading is that GVE has an institutional-reference customer base, not yet a
              publicly diversified one. Expansion logic is plausible and potentially large. Commercial concentration,
              partner dependence, and proof-of-scale risk remain material until management discloses which programs are
              pilots, which are paid production deployments, and how revenue is distributed across them.
