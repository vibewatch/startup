  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buying Center
        blocks:
          - type: paragraph
            body: >-
              GVE’s public customer picture is clearer in workflow terms than in disclosed account lists. The Japanese
              and English homepages show the company pursuing two regulated problem sets at once: payment infrastructure
              and privacy-sensitive health or identity infrastructure. That implies several distinct buying centers. In
              payments, the likely payer is a central bank, commercial bank, public payments operator, or sovereign
              program sponsor. In health and border workflows, the payer is more likely to be a ministry, airport
              authority, health agency, or systems integrator, while the day-to-day user is an immigration official,
              hospital worker, or traveler. In identity-linked workflows, the user can be a citizen or enterprise end
              user, but the buyer still looks institutional.


              The public materials repeatedly show that GVE is not selling to a self-serve software buyer. Its visible
              go-to-market path is partner-heavy and institution-heavy. VICSA is jointly presented with CMIC, which
              contributes airport passport-reading and vaccination-management know-how. The Gift Pad alliance suggests a
              different route: channeling GVE’s security stack into a partner that already serves municipalities,
              enterprises, and regional-currency programs. The Digital Agency’s My Number materials also matter here
              because they show the type of identity and health-record use cases that make GVE’s architecture
              commercially relevant, even though they do not prove GVE has won those deployments.


              The key diligence point is that buyer, user, and payer are separated. Citizens, travelers, and bank
              account holders are the end users; ministries, banks, or channel partners are the buyers; and
              implementation is likely mediated by integrators or institutional programs. That structure can support
              very large contracts, but it also lengthens sales cycles and concentrates commercial proof in a few
              reference relationships.
