      - number: '8.3'
        title: Scenario Underwriting and Comparable Anchors
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is useful here only as a boundary condition, not as a direct multiple exercise. Public
              cybersecurity and identity names provide a sense of what investors eventually pay for scaled, proven
              platforms. As of August 2026, Trend Micro is worth roughly $5.23B, Check Point about $12.98B, Okta about
              $24.88B, Fortinet about $118.82B, and Palo Alto Networks about $270.44B. Those are not direct peers in
              scale, revenue quality, or profitability, but they do create a reality check. A $10.65B mark for GVE would
              sit above Trend Micro and near Check Point despite GVE lacking public revenue, margin, and large-scale
              customer evidence.


              That does not make the high-end mark impossible. It means the high-end mark should be treated as
              contingent on milestones rather than on present evidence. The bull case requires named sovereign or bank
              production deployments, an independently credible assurance package, clear revenue proof, and evidence
              that the small team can scale delivery without breaking. The base case assumes the technology option is
              real but that proof remains partner-led and public evidence incomplete. The bear case assumes
              commercialization continues to lag architecture and that the company must raise further capital before
              proving revenue quality.


              Because the public data are this incomplete, scenario ranges are more honest than a single target price.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
