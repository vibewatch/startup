      - number: '7.3'
        title: Partner, Customer, and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              The customer chapter already showed that GVE’s public proof is concentrated in a handful of relationships.
              That becomes a risk chapter issue because partner concentration can become revenue concentration,
              credibility concentration, and delivery concentration all at once. CMIC is the deepest visible reference
              in digital health. Gift Pad is the clearest enterprise/municipal channel. Ukraine, JICA, Saudi, and
              Vietnam-related materials show pipeline and policy engagement, but not diversified recurring revenue. If
              any one of those threads stalls, the external proof set thins quickly.


              There is also a verification-friction risk. A Gift Pad service page linked from the GVE alliance
              announcement currently returns 404. CMIC’s site rejected the fetch run outright. D&B and Tracxn produce
              shallow or broken profile pages. None of those facts prove the underlying business is weak, but together
              they do show that third-party corroboration of counterparties and company status is thinner and noisier
              than investors usually want for infrastructure businesses selling into governments and banks.


              Dependency risk therefore has two layers: actual business concentration and evidence concentration. GVE
              depends on a small number of counterparties to demonstrate credibility, and outside researchers depend on
              an even smaller number of accessible sources to verify that credibility.
