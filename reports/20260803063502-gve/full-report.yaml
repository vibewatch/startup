  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis vs. Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish thesis on GVE is conceptually straightforward. It sits at the intersection of cyber-resilient
              payments, digital identity, and privacy-sensitive health infrastructure—markets that are strategically
              important and hard to commoditize. The company has a real architecture story, patents, standards
              adjacency, and a small but non-zero set of institutional proof points around CMIC, WHO catalog acceptance
              for VICSA, Gift Pad channel access, and Ukraine feasibility work. If one believes sovereign and bank
              digital infrastructure can create very large winner-take-most or winner-take-enough outcomes, then a small
              company with a differentiated security thesis can be worth a great deal before revenue becomes legible.


              The anti-thesis is that public commercial proof is nowhere near clear enough to support a premium headline
              valuation with confidence. The employee count is four. Revenue, margin, and cash flow are undisclosed.
              Customer durability is undisclosed. The strongest public customer evidence is partner-led and
              feasibility-led rather than a diversified list of named paying production deployments. Meanwhile, public
              valuation databases conflict sharply with one another, and some private-market profiles are shallow,
              generic, or broken.


              So the investment question is not whether GVE could become valuable. It is whether today’s public evidence
              supports paying as if it already has.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV010
              - CV015
              - CV028
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV028
      - number: '8.2'
        title: Current Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The public valuation surface for GVE is noisy enough that entry discipline must come before valuation
              creativity. Caplight shows an estimated valuation of $10.65B and describes the company as B2G
              infrastructure spanning payments, identity, and EMR. Premier Alternatives shows a much lower $2B current
              valuation and slightly different funding total. GVE’s own Medical Confidentia post quotes a 467.9B-yen
              market-cap-style number. INITIAL and STARTUP DB provide yet more startup-database framing, while
              PitchBook, CB Insights, and Startup Intros provide only partial or noisy verification in the retained
              source set. Those differences could reflect stale data, secondary pricing vs primary marks, model-driven
              estimates, or promotional framing, but the practical consequence is the same: public marks alone are not
              strong valuation evidence.


              The right way to treat a company like this is milestone-first, price-second. Without revenue disclosure,
              customer cohorts, or signed financing documents, investors cannot responsibly underwrite a tight
              fair-value point estimate. Instead, valuation must be constrained by what the public evidence can actually
              support: a meaningful technology option, some real institutional proof, and a large proof gap between
              promise and commercial certainty.


              That leads to a disciplined conclusion. GVE may deserve serious diligence. It does not, on public evidence
              alone, deserve automatic acceptance of the highest visible headline mark.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
