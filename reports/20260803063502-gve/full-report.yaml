  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Adjacent Spend Pools
        blocks:
          - type: paragraph
            body: >-
              The cleanest starting point is to define the market before trying to size it. Yano Research defines
              Japan’s cybersecurity market as the products—hardware, software, and services—used to protect corporate or
              organizational computers, networks, and data from unauthorized access, cyberattacks, and other threats. On
              that definition alone, the market is broad enough to include endpoint tools, cloud security, managed
              services, network controls, and governance/compliance support. That full market is useful as top-down TAM
              context, but it is too broad to represent the realistic buying arena for GVE.


              GVE’s own product story narrows the target dramatically. The company is not selling generic antivirus,
              consumer privacy tools, or mass-market IAM. Its public materials instead point to four adjacent but
              distinct budget pools: secure payment and settlement infrastructure, CBDC-adjacent or tokenized-money
              modernization, digital identity and JPKI-linked verification rails, and privacy-sensitive health-data
              systems including VICSA and EMR exchange. Those pools sit at the high-assurance edge of the cybersecurity
              market, where products are judged less on feature breadth and more on interoperability, data sovereignty,
              resilience, and regulatory acceptability.


              The main status-quo substitutes are therefore incumbents and legacy processes, not just other startups. In
              payments, the substitute is existing bank cores, card schemes, and public-key-heavy security layers. In
              identity, it is today’s My Number, JPKI, and document-based eKYC stack. In healthcare, it is incumbent
              EHR/EMR vendors plus fragmented local systems. In border-health workflows, the substitute can still be
              paper or app-based document checks. This makes GVE’s addressable market structurally attractive but
              operationally difficult: budgets exist, yet every segment is burdened by legacy integration and
              public-sector trust requirements.
