      - number: '6.3'
        title: Retention, Durability, and Public Proof Gaps
        blocks:
          - type: paragraph
            body: >-
              Customer durability is the weakest part of the public evidence set. No retained source discloses
              active-customer count, renewal rate, churn, NRR, GRR, customer-lifetime value, referenceability rate, or
              average contract duration. There are also no public support SLAs, uptime commitments, or
              customer-satisfaction metrics that would make the institutional relationship base easier to underwrite.
              The most one can say from public materials is that CMIC-related collaboration persists across multiple
              releases, while Gift Pad, JICA-linked public-sector work, and Ukraine-related feasibility all remain
              commercially interesting but economically opaque.


              This matters because GVE’s target buyer set should create naturally sticky relationships once deployed. A
              passport-linked health workflow, a central-bank or bank settlement layer, or a municipal identity
              integration does not look easy to switch out after implementation. But stickiness must be demonstrated,
              not assumed. Public materials still leave open whether GVE is being paid for software, integration, IP
              licensing, feasibility studies, or merely strategic partnership positioning. Even one adverse detail is
              telling: one of the Gift Pad service URLs referenced from GVE’s alliance post currently resolves to a 404
              page, which limits external verification of the exact downstream offerings that were supposed to
              incorporate GVE technology.


              The right diligence stance is therefore two-track. There is enough evidence to believe institutional
              adoption work is happening. There is not enough evidence to claim that customer durability or commercial
              scaling has already been proven.
