chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Founding
        blocks:
          - type: paragraph
            body: >-
              GVE Co., Ltd. presents itself as a Japanese digital infrastructure company whose mission is to
              “Revolutionize Finance and Healthcare for a Digital Future.” The official Japanese homepage identifies the
              legal entity as GVE株式会社 / GVE Ltd., lists its headquarters at Kabutocho in Chuo-ku, Tokyo, and gives an
              exact incorporation date of 10 November 2017. Independent startup-database profiles broadly corroborate
              the same founding window and Tokyo headquarters, which is important because the company’s English
              marketing copy is expansive but often light on hard corporate facts.


              The official homepage is unusually direct about the founding team. It names Koji Fusa as Founder and CEO,
              Yu Kusakabe as Founder and COO, Keita Takamatsu as Founder and CTO, and Susumu Kusakabe as Founder and
              Adviser. That four-person presentation is more specific than some third-party profiles: OMFIF’s exhibitor
              page highlights only Koji Fusa and Susumu Kusakabe as co-founders, while the US patent record for one of
              GVE’s core payment-system patents lists Yu Kusakabe, Koji Fusa, and Keita Takamatsu as inventors and GVE
              Ltd. as assignee. Taken together, the evidence supports a founder-led operating team with Fusa as the
              external face of the company and Kusakabe/Takamatsu as core technical or operating counterparts.


              From day one GVE framed itself less as a narrow app vendor and more as a platform builder. Both the
              Japanese homepage and external company profiles describe a legal-currency digitization or CBDC platform
              for instant settlement, combined with a health-data or EMR platform that emphasizes privacy-preserving
              information exchange. That dual focus—payments plus digital health—distinguishes GVE from conventional
              cybersecurity vendors and is the first clue that later valuation claims reflect infrastructure optionality
              rather than currently disclosed revenue scale.
