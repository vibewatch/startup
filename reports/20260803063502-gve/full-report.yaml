      - number: '4.3'
        title: Unit Economics, Cost Structure, and Sales-Efficiency Gaps
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not permit a normal SaaS or infrastructure-software unit-economics analysis. No
              public source here discloses revenue, gross profit, cost of service, implementation burden, headcount
              expense, CAC, payback period, NRR, pipeline conversion, or average contract value. That means the most
              important underwriting questions remain unanswered: how much it costs GVE to deliver a new deployment, how
              much recurring support the system requires, whether margins expand with scale, and whether the sales
              motion is repeatable without heavy founder involvement.


              There are still a few directional cost-structure hints. GVE’s balance sheets show very limited tangible
              fixed assets, which is consistent with a software-and-services business rather than a manufacturing or
              hardware-heavy company. The company carried large cash balances, but also meaningful loans and advances on
              the asset side in multiple years, plus a related-company investment in FY2024. Those items complicate
              simple interpretations of liquidity because not all reported assets are immediately usable operating cash.
              In 2021, the statements also showed digital currencies, a line item that disappears from later years.


              The correct financial conclusion is therefore not that unit economics are poor, but that they are
              unobservable. Public evidence supports a high-touch enterprise and public-sector GTM motion with
              potentially strong contract values and slow conversion. It does not support any precise statement on
              margin path, CAC efficiency, or cash burn quality.
