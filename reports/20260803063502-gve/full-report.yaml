  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              GVE does not present itself as a point-security vendor. Its public materials instead describe a digital
              infrastructure that can sit underneath payment, identity, and healthcare workflows. On the Japanese
              homepage, the company frames its mission as transforming finance and digital health, with a CBDC platform
              for instant settlement of fiat currencies and a healthcare workflow that lets travelers verify vaccination
              or medical records using only a passport. The English homepage reframes the same idea in technology terms:
              a next-generation secure platform that combines speed, privacy, and quantum-resilience-oriented design.
              Those two narratives are the same product thesis seen from customer and engineering angles.


              From a module perspective, the public product surface has at least five visible assets. First is the CBDC
              / RTGS payment platform, described as an account-to-account settlement system that can span central banks,
              commercial banks, and non-banks. Second is the private-key security layer, which GVE says avoids
              conventional public-key bottlenecks and uses dedicated key-management controls. Third is the
              three-way-database and hierarchical architecture used to synchronize and segment data across layers.
              Fourth is VICSA, the airport and travel-health workflow that links passport data to authentic medical
              records. Fifth is the expansion path from VICSA into broader EMR and identity infrastructure.


              In customer terms, the jobs-to-be-done are clear even if product packaging is not. Banks and public
              authorities want faster, more sovereign settlement rails; governments and regulated enterprises want
              stronger identity linkage; and health or border operators want a secure way to retrieve and validate
              sensitive records without relying on fragile document flows. The product is therefore a workflow engine
              for trusted digital exchange, not just a cryptography component.
            claimRefs:
