      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map differs sharply by segment. In CBDC-adjacent infrastructure, the economic buyer is typically
              a central bank, public financial authority, or a commercial-bank consortium; the user is the payments or
              operations stack running inside those institutions; and the downstream beneficiaries are citizens,
              merchants, and counterparties. The Bank of Japan’s public CBDC experimentation record shows that the
              Japanese market is still in design, pilot, and liaison mode rather than live national rollout mode. That
              means any vendor entering the segment must survive long evaluation cycles before meaningful deployment
              revenue appears.


              In digital identity, the standard setter and ecosystem orchestrator is the Digital Agency, but the
              effective buyer base extends into both local government and private services. The Digital Agency’s own
              materials emphasize JPKI, chip-reading, digital authentication, and Mynaportal APIs for businesses and
              administrative agencies. Residents are the end users, but enterprises, banks, insurers, and public bodies
              become implementers and budget owners once card-based identity verification is embedded in onboarding,
              benefits, health, and payment workflows. The market is thus hybrid B2G/B2B even when the credential itself
              is government-issued.


              In healthcare data security, hospitals and clinics are the most obvious end users, but payers and policy
              drivers are broader: ministries, prefectures, public-health bodies, and large healthcare operators all
              shape the adoption path. TechSci and Research and Markets both frame hospitals as the dominant end-user
              segment in Japan’s EHR market, while the CMIC/GVE VICSA case shows that airport-health workflows and
              government cross-border coordination can also become buying environments. Across all segments, the
              adoption path is similar: policy mandate or operational pain triggers attention, then pilot, integration
              planning, vendor-risk review, and only later scaled rollout. That slow path benefits vendors that can
              satisfy trust and interoperability requirements but punishes those that rely on fast, self-serve sales
              cycles.
