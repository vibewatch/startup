- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'On paper, GVE’s near-term capital adequacy looks better than the public disclosure quality. The FY2024 balance sheet shows ¥938.3 million of cash and deposits against only ¥16.0 million of total liabilities, and net assets of ¥1.44 billion. Even with larger losses in FY2023 and FY2024, those figures do not read like a company facing immediate insolvency. However, runway cannot be robustly calculated because cash-flow statements and operating-burn detail are absent. Using annual net loss as a burn proxy would imply a long runway, but that would be methodologically weak because accounting loss is not cash consumption and because some assets are tied up in loans or investments.


    Financing history is also directionally but not perfectly visible. GVE’s own 2020 capital-increase note says Sankei reported a U.S. fund investment and listing preparation. STARTUP DB says the May 2020 financing totaled about $25 million and implied a ¥55.8 billion valuation at that time. Caplight reports total funding of $30.53 million and a private-equity round dated December 2024. INITIAL, meanwhile, shows a much higher estimated post-money figure that conflicts sharply with Caplight and STARTUP DB. Those disagreements are too large to ignore and too inconsistent to underwrite as fact.


    Capital dependency therefore remains a live diligence issue. GVE may have adequate balance-sheet liquidity for now, but the company still appears to depend on external capital or very large future contracts to justify its ambition. Without revenue, backlog, burn, and cash-flow disclosure, the next-round trigger cannot be estimated reliably from public materials.'
