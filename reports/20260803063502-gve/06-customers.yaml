- id: named-proof-and-adoption-trajectory
  title: Named Proof and Adoption Trajectory
  body: 'The strongest public customer proof is not a broad logo wall; it is a narrow set of named institutional relationships with different maturity levels. CMIC is the clearest counterpart. GVE and CMIC jointly describe VICSA as a passport-linked vaccination and immigration workflow, and both the GVE post and the CMIC PR TIMES release say the concept passed WHO Digital Clearinghouse review in September 2024. Importantly, the public evidence around CMIC also contains real operating metrics: CMIC says its underlying vaccine-care technology helped more than 200 municipalities manage more than one million vaccination records, and that the passport-based overseas-Japanese vaccination workflow was used at Narita and Haneda for more than 30,000 certificates. Those numbers validate workflow relevance, even though they do not prove how much of that footprint translated into revenue for GVE itself.


    Beyond CMIC, the next-most-concrete institutional proof is feasibility- or channel-stage. UNIDO reports that GVE met the National Bank of Ukraine and is conducting a feasibility study on higher-security inter-bank fund transfer. GVE’s JICA note shows the company once had a PPP-oriented public-sector milestone for an instant-payment platform. The Saudi and JETRO materials show an explicit effort to recruit a Saudi partner and form a Riyadh hub for the Middle East and Africa. Gift Pad is not a disclosed sovereign customer, but it is a commercially meaningful channel partner because its own platform already serves a large installed base of enterprises and municipalities.


    Taken together, the adoption trajectory is real but uneven. Public evidence shows a ladder from concept page, to joint research, to WHO catalog acceptance, to feasibility work and channel alliances. What it does not yet show is a long list of named paying production customers with disclosed contract economics or renewals.'
