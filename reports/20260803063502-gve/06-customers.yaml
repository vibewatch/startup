- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Reuse of one security stack across payments, identity, and health
    - Overreliance on architecture story before many production accounts exist
    - Can magnify upside if one anchor wins
    - Request customer-by-product deployment map and cross-sell evidence
  - - CMIC reference in digital health
    - Health proof concentrated in one partner-led relationship
    - Loss or stall of CMIC channel would materially weaken public proof
    - Request exclusivity terms, revenue split, and live-country pipeline
  - - Gift Pad channel to enterprises and municipalities
    - Alliance may not have converted into disclosed production integrations
    - Channel reach can look larger than realized revenue
    - Request integrated live customers and attached ARR
  - - Sovereign / bank sales motion
    - Long procurement cycles and policy dependence
    - Revenue timing volatility and heavy deal concentration
    - Request stage-gated pipeline and weighted probabilities
  - - International expansion threads (Ukraine, Saudi, Vietnam, TICAD)
    - High visibility but uncertain conversion
    - Can consume BD effort without near-term bookings
    - Request resourcing, partner MOUs, and closed-won history
  notes: GVE’s expansion logic is coherent, but the public proof set remains narrow enough that concentration and partner dependence should be treated as live underwriting risks.
