tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Central banks / sovereign payment authorities
    - 'Buyer/payer: sovereign program; user: payment operators'
    - CBDC / RTGS / instant settlement
    - Public positioning on homepages, JICA history, Cabinet and JETRO materials
    - Potentially very large anchor contracts and policy prestige
    - No named production sovereign customer disclosed
  - - Commercial banks / financial institutions
    - 'Buyer/payer: bank or consortium; user: ops and treasury teams'
    - Real-time settlement and private-channel security
    - Ukraine feasibility study and Saudi partner pitch imply banking relevance
    - Could expand from one bank hub to broader banking rails
    - No named bank client or bank renewal metric disclosed
  - - Health ministries / border operators / airports
    - 'Buyer/payer: ministries or airport operators; user: immigration/health staff and travelers'
    - VICSA vaccination and medical-record checks
    - CMIC collaboration, WHO catalog inclusion, airport workflow references
    - Most concrete workflow proof in public set
    - Public proof still stops short of named country rollout by GVE
  - - Municipalities / public-service programs
    - 'Buyer/payer: municipalities or program sponsors; user: residents and admins'
    - Identity-linked services, digital public workflows, regional programs via partners
    - Gift Pad serves 1,132 municipalities; GVE links to My Number-style use cases
    - Large downstream channel if partner integration lands
    - No municipality named as direct GVE customer
  - - Corporate / enterprise channel accounts
    - 'Buyer/payer: enterprise or channel partner; user: customers, employees, residents'
    - Digital gift, coupon, and regional-currency security upgrades
    - Gift Pad serves 1,200+ enterprise customers
    - Faster path to distribution than direct sovereign selling
    - Alliance economics and production case studies are undisclosed
  - - International development / PPP sponsors
    - 'Buyer/payer: public-development sponsor; user: governments and operators'
    - PPP payment infrastructure and modernization studies
    - JICA and TICAD/Aston materials show programmatic access
    - Can open markets where sovereign budgets need external sponsorship
    - Study selection is not proof of procurement award
  notes: The segmentation groups direct institutional buyers, end users, and channel intermediaries because GVE’s public materials suggest a mediated enterprise/government sales motion rather than a single direct SaaS buyer.
