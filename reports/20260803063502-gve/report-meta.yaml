      background: Listed on the official homepage as the technical lead within the founding team.
      claimRefs: [CO003, CO010]
    - name: Susumu Kusakabe
      role: Founder, Adviser
      background: Listed on the official homepage as an adviser within the founding team and appears in some third-party founder references.
      claimRefs: [CO003, CO010, CO014]
  foundingLocation: Tokyo, Japan
  headquarters: Tokyo, Japan
  productSummary: >
    GVE sells a cryptographic security and orchestration layer applied across CBDC / RTGS-style payments,
    digital identity, and health-data workflows. Public materials emphasize private-key-centric security,
    post-quantum positioning, passport-linked VICSA verification, and adjacent EMR / identity expansion.
  customerFocus: >
    Governments, central banks, financial institutions, airports and border-health operators, and channel
    partners that already serve municipalities or enterprises.
  businessModel: >
    Public evidence suggests a B2G / regulated-enterprise model combining platform software, integration,
    feasibility or design-partner work, and partner-led distribution; the exact mix is not publicly clear.
  stage: Private growth stage with disputed public valuation marks
  fundingStatus: >
    Public tracker sources point to funding activity from 2020 through 2024 and roughly $30-34M of total
    raised capital, but valuation estimates conflict sharply. GVE’s own 2020 capital-increase note says a
    U.S. fund investment supported listing preparation.
  disclosureProfile: private-disclosed
  claimRefs: [CO002, CO003, CO004, CO005, CO020, CI023, CI026, CV003, CV010, CV011]
summary:
  headline: >
    GVE has a credible strategic cyber-infrastructure thesis, but current public evidence does not justify
    paying the highest visible valuation marks; track it, do not underwrite it aggressively, until customer
    and financial proof catch up.
  overallScore: 4.1
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: expensive
  keyMetrics:
    valuationUsdM: 10650
