    headcount: 4
  topStrengths:
    - >
      The company is targeting strategically important payment, identity, and health-data infrastructure
      problems rather than a commodity security niche.
    - >
      Public materials show a differentiated architecture thesis with patents, standards adjacency, and some
      real institutional proof points such as CMIC / VICSA, Gift Pad, and Ukraine feasibility work.
    - >
      If sovereign or bank deployment proof materializes, the upside could expand quickly because the addressable
      workflows are high-value and hard to replace once embedded.
  topRisks:
    - >
      The highest public valuation marks run far ahead of public revenue, margin, retention, and customer-scale
      evidence.
    - >
      The disclosed operating footprint is extremely small relative to the breadth of products, geographies,
      and regulated deployment requirements being discussed publicly.
    - >
      Public database and media valuation surfaces conflict materially, making price discovery noisy and forcing
      investors to rely on primary documents rather than trackers.
  unresolvedGaps:
    - >
      Named production customer deployments, renewal evidence, and revenue concentration are not publicly disclosed.
    - >
      Revenue, gross margin, cash flow, and runway quality remain unavailable from public materials.
    - >
      Public valuation marks from Caplight, Premier Alternatives, INITIAL, STARTUP DB, and media-style references
      are not reconciled to signed financing documents.
    - >
      There is no retained public assurance package showing certifications, uptime, incident response, or support
      metrics suitable for critical-infrastructure underwriting.
