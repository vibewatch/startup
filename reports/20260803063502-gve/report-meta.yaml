subtitle: Strategic digital-infrastructure thesis with thin public proof at a high headline valuation
coverageNotes: >
  Public evidence is strong enough to establish GVE as a real company with a differentiated cyber /
  digital-infrastructure thesis, patents, and some institutional proof points. It is weak on revenue,
  margin, retention, deployment breadth, and operating-assurance disclosure. Public valuation and
  funding marks conflict materially across tracker sources, so price discipline matters more than story
  quality. The recommendation therefore reflects public evidence only, not management-access diligence.
