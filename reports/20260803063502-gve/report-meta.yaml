companyProfile:
  summary: >
    GVE Co., Ltd. is a Tokyo-based cybersecurity and digital-infrastructure company founded in November
    2017. Public materials describe a platform strategy that combines cryptographic security, instant
    settlement infrastructure, digital identity linkage, and privacy-sensitive health-data exchange. The
    company’s most visible proof points are the CMIC partnership and WHO-linked VICSA workflow, a Gift
    Pad business alliance, and UNIDO-documented feasibility work with the National Bank of Ukraine.
    GVE’s ambition is large and strategically relevant, but public commercial proof remains much thinner
    than its product narrative.
  foundedDate: '2017-11-10'
  founders:
    - name: Koji Fusa
      role: Founder, CEO
      background: Public-facing chief executive and dominant external spokesperson across product, policy, and forum materials.
      claimRefs: [CO004, CO010]
    - name: Yu Kusakabe
      role: Founder, COO
      background: Listed on the official homepage as a co-founder and operating leader within the four-person founding team.
