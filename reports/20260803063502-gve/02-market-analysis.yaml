company:
  name: GVE Co., Ltd.
chapter:
  number: 2
  title: Market Analysis
  summary: 'GVE’s addressable market should not be mistaken for the full Japanese cybersecurity sector, even though that sector is large and still expanding. The evidence points to a layered opportunity set: a broad domestic cybersecurity market worth roughly ¥2.1 trillion or about $11.4 billion in 2026, a rapidly institutionalizing digital-identity stack around My Number and JPKI, an active but still exploratory Bank of Japan CBDC program, and a Japan EHR / EMR market around $1.0 billion in 2026 with strong interoperability and security needs. GVE’s practical wedge sits inside the overlap of those layers—high-assurance public and regulated infrastructure—where budget ownership is concentrated, procurement is slow, and trust, standards, and integration costs matter as much as raw market size.'
sections:
- id: market-boundary-and-subsegments
  title: Market Boundary and Adjacent Spend Pools
  body: 'The cleanest starting point is to define the market before trying to size it. Yano Research defines Japan’s cybersecurity market as the products—hardware, software, and services—used to protect corporate or organizational computers, networks, and data from unauthorized access, cyberattacks, and other threats. On that definition alone, the market is broad enough to include endpoint tools, cloud security, managed services, network controls, and governance/compliance support. That full market is useful as top-down TAM context, but it is too broad to represent the realistic buying arena for GVE.


    GVE’s own product story narrows the target dramatically. The company is not selling generic antivirus, consumer privacy tools, or mass-market IAM. Its public materials instead point to four adjacent but distinct budget pools: secure payment and settlement infrastructure, CBDC-adjacent or tokenized-money modernization, digital identity and JPKI-linked verification rails, and privacy-sensitive health-data systems including VICSA and EMR exchange. Those pools sit at the high-assurance edge of the cybersecurity market, where products are judged less on feature breadth and more on interoperability, data sovereignty, resilience, and regulatory acceptability.


    The main status-quo substitutes are therefore incumbents and legacy processes, not just other startups. In payments, the substitute is existing bank cores, card schemes, and public-key-heavy security layers. In identity, it is today’s My Number, JPKI, and document-based eKYC stack. In healthcare, it is incumbent EHR/EMR vendors plus fragmented local systems. In border-health workflows, the substitute can still be paper or app-based document checks. This makes GVE’s addressable market structurally attractive but operationally difficult: budgets exist, yet every segment is burdened by legacy integration and public-sector trust requirements.'
