  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend / substitute
  - Primary buyer / payer
  - Relevance to GVE
  rows:
  - - Broad cybersecurity market
    - Security hardware, software, and services protecting enterprise/government systems
    - Consumer antivirus and generic SMB tooling unless used in regulated infrastructure
    - Enterprise CIO/CISO, government bodies
    - Top-down TAM context only
  - - CBDC / settlement security infrastructure
    - Payment-core modernization, RTGS/CBDC rails, bank-to-bank and bank-to-user security
    - Pure crypto trading platforms and consumer wallets without regulated integration
    - Central banks, public financial authorities, commercial-bank consortia
    - Core to GVE’s payments narrative
  - - Digital identity and JPKI infrastructure
    - Card-based identity verification, chip reading, digital signatures, authentication APIs
    - Low-assurance document-photo-only KYC as a declining substitute
    - Digital Agency, local government, regulated enterprises
    - Directly relevant to GVE identity/security positioning
  - - Healthcare data security / EHR / EMR
    - Electronic records, secure data exchange, health-credential interoperability
    - Standalone hospital IT without security or data-sharing elements
    - Hospitals, clinics, ministries, healthcare operators
    - Core to GVE’s VICSA/EMR wedge
  - - Border-health / travel credential workflows
    - Passport-linked health verification and related cross-border data exchange
    - Manual paper checks, fragmented local apps
    - Governments, airports, health authorities
    - Narrow but well matched to VICSA proof point
  notes: The broad cyber market is larger than GVE’s realistic wedge. GVE appears relevant only where cybersecurity overlaps with regulated payment, identity, and health-data infrastructure.
