  evidenceGaps:
  - type: missing-source
    severity: material
    topic: GVE SOM
    missingEvidence: Contracted pipeline, procurement data, or management segmentation that isolates GVE’s actual serviceable obtainable market within Japan or export corridors.
    whyItMatters: Public TAM and adjacent market figures are large, but investment judgment depends on how much of those budgets GVE can realistically win.
    diligencePath: Request pipeline by segment, RFP history, and expected attach rates to CBDC, identity, and health-data deployments.
    relatedQuestionRefs:
    - QM009
    - QM024
  - type: conflicting-data
    severity: minor
    topic: healthcare market sizing
    missingEvidence: One standardized market taxonomy that reconciles EHR versus EMR boundaries and forecast windows across Research and Markets, TechSci, and IMARC.
    whyItMatters: The healthcare-adjacent opportunity is clearly meaningful, but precise sizing varies because vendors define the category differently.
    diligencePath: Normalize market definitions with a paid market-study bundle or management’s own segmentation assumptions.
    relatedQuestionRefs:
    - QM008
    - QM021
  - type: private-evidence-only
    severity: material
    topic: CBDC procurement timing
    missingEvidence: Concrete procurement calendars or budget line items showing when Japan or foreign institutions will convert CBDC experimentation into paid infrastructure awards.
    whyItMatters: The BOJ and policy materials prove serious exploration, but not when revenue-bearing vendor contracts will scale.
    diligencePath: Request target-account roadmap and signed pilot / procurement documentation from management.
    relatedQuestionRefs:
    - QM010
    - QM013
    - QM024
