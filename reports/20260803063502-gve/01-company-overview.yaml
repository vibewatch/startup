  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: Primary financing documents or management-confirmed round ledger showing security types, round sizes, valuation basis, and investor ownership.
    whyItMatters: Public databases disagree on valuation and do not expose governance rights, which makes ownership and dilution risk impossible to underwrite from open sources.
    diligencePath: Request cap table, round summaries, and investor rights documents from management or lead counsel.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO026
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Verified ARR, revenue, customer count, pipeline, and recurring-contract metrics for payments, CBDC, or digital-health deployments.
    whyItMatters: The public story is infrastructure-scale and policy-linked, but no open source confirms whether that translates into recurring commercial revenue.
    diligencePath: Request management KPI pack and customer-contract summary segmented by product and geography.
    relatedQuestionRefs:
    - QO027
  - type: missing-source
    severity: material
    topic: commercial-deployment
    missingEvidence: Independent customer or regulator evidence showing production deployment of GVE platforms beyond catalog inclusion or presentation materials.
    whyItMatters: Policy visibility and forum participation are not substitutes for contracted production usage in central-bank, bank, or hospital environments.
    diligencePath: Ask for signed reference customers, live deployment certificates, or regulator acknowledgements tied to production rollout.
    relatedQuestionRefs:
    - QO018
    - QO020
    - QO021
    - QO022
  - type: enumeration-incomplete
    severity: minor
    topic: investor-map
    missingEvidence: Complete roster of investors and formal board / observer structure.
    whyItMatters: The public stakeholder map captures influence channels but not the full set of economic or governance actors.
    diligencePath: Request shareholder register, board list, and observer-rights schedule.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table TO002
    missingEvidence: A full public governance roster covering all directors, officers beyond founders, and any formal board observers or committees.
    whyItMatters: The leadership table captures the visible founder core, but not the full governance and decision-rights picture required for investor diligence.
    diligencePath: Request board list, officer list, and governance charter from management.
    relatedQuestionRefs:
    - QO010
    - QO026
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table TO004
    missingEvidence: A management-approved chronology linking public milestones to internal product launches, signed contracts, financing closes, and regulatory follow-through.
    whyItMatters: The public milestone table is strong on narrative and policy visibility but incomplete on commercialization and financing documentation.
    diligencePath: Request board materials or investor updates with a verified milestone chronology.
