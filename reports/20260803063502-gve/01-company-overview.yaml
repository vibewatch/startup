- id: leadership-governance-and-network
  title: Leadership, Governance, and Strategic Network
  body: 'Leadership concentration is high. Koji Fusa appears across the official homepage, the VICSA announcement, Saudi-Japan forum deck, and Cabinet Office-linked materials as president, representative director, or CEO, making him the company’s primary public spokesperson. The homepage also gives a compact but useful operating split: Yu Kusakabe is COO, Keita Takamatsu is CTO, and Susumu Kusakabe is Adviser. The OMFIF profile strengthens the view that the firm markets itself through the prior payments pedigree of Fusa and Susumu Kusakabe rather than through a deep bench of visibly disclosed executives.


    Formal governance disclosure is comparatively thin. GVE does disclose a global advisory board, and that board is notable for breadth rather than operational control: members span Oxford pediatrics, international law, capital markets, private banking, and Gulf investment networks. This is relevant because it suggests GVE is trying to compensate for a tiny disclosed employee base with senior outside validators and connectors in finance, health, and cross-border government relationships. However, the public materials do not disclose a conventional venture-backed board roster, director committees, or investor governance rights.


    The strategic network around the company is more visible than the formal board. Public materials show links to CMIC in digital health, Gift Pad in a business alliance, Japanese Cabinet Office meeting materials in 2025, and a Saudi-Japan ministerial investment forum in 2026. Those links do not prove scaled commercial deployment, but they do show that GVE has succeeded in placing its narrative in policy and partner channels that matter for infrastructure sales.'
