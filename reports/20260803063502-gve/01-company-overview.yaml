- id: platform-and-product-scope
  title: Platform Scope, Technology Thesis, and Product Footprint
  body: 'GVE’s product thesis is to replace or bypass portions of legacy public-key-heavy infrastructure with a private-key or post-PKI architecture that it claims is more resilient against future quantum-era threats. The English homepage describes a two-layer approach combining pre-shared-key authentication with post-quantum cryptography for key generation, while the Japanese homepage and Saudi deck repeatedly emphasize private-key-only or quantum-ready infrastructure. The technical and commercial messaging is consistent even if the performance claims are self-authored.


    The product scope is broader than payments alone. On the finance side, the core claim is an instant-settlement platform for legal tender, CBDC, and related banking rails. On the health side, GVE markets a privacy-preserving platform for vaccine credentials, medical records, and electronic medical records. The strongest concrete product proof is VICSA, the Vaccination Information Check System at Airports, which GVE says it built with CMIC and which the company states was included in the WHO Digital Clearing House catalog on 9 September 2024. The same announcement says the company intends to extend the VICSA stack into broader EMR infrastructure.


    Intellectual property is central to the company narrative. GVE’s own patent announcement and the Google Patents record for US10628886B2 confirm a granted US patent assigned to GVE Ltd. with Fusa, Yu Kusakabe, and Takamatsu among the inventors. Cabinet Office and Saudi forum materials also frame the company’s patent estate and ISO/IEC 24643 alignment as strategic differentiators for state-scale or bank-scale deployments. The important diligence caveat is that nearly all performance claims remain company-authored rather than independently benchmarked.'
