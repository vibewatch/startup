  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              GVE 并不把自己包装成单点安全厂商。公开材料把它描述成一套数字基础设施，可以垫在支付、身份和医疗工作流之下。日本官网把使命写成改造金融和数字健康：一边提供能即时结算法币的 CBDC
              平台，另一边提供医疗工作流，让旅客只凭护照就能验证疫苗或病历。英文官网则把同一件事换成技术语言：下一代安全平台，兼具速度、隐私和面向量子韧性的设计。两套叙事其实是同一个产品命题，只是分别站在客户和工程视角。


              从模块看，公开产品界面至少露出五项资产。第一是 CBDC / RTGS 支付平台，公司称它是账户到账户结算系统，可以覆盖央行、商业银行和非银机构。第二是私钥安全层，GVE
              称它绕开传统公钥瓶颈，并采用专门的密钥管理控制。第三是三方数据库和分层架构，用来跨层同步和切分数据。第四是 VICSA，也就是机场和旅行健康工作流，把护照数据与真实病历连接起来。第五是从 VICSA 延伸到更广义
              EMR 和身份基础设施的扩展路径。


              从客户语言看，即便产品包装还不清晰，待完成任务已经很明确。银行和公共机构需要更快、更具主权控制的结算轨道；政府和受监管企业需要更强的身份绑定；医疗或边境运营方需要安全取回并验证敏感记录，同时摆脱脆弱的纸面文件流。因此，这个产品是可信数字交换的工作流引擎，不只是一个密码学组件。
