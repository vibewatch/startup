      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - GVE（Caplight 标记）
        - 估计私募估值
        - $10.65B；Dec 2024 最后一轮背景
        - 当前待检验的公开高端标记
        - 老股式估计，不是披露且经审计的内在价值
      - - GVE（Premier Alternatives 标记）
        - 估计私募估值
        - 当前估值 $2B
        - 当前待检验的公开低端标记
        - 方法和时效性不完全透明
      - - Trend Micro
        - 公开市值
        - $5.23B，截至 Aug 2026
        - 日本网络安全参考点
        - 成熟上市公司，规模和盈利已披露，与 GVE 不同
      - - Check Point Software
        - 公开市值
        - $12.98B，截至 Aug 2026
        - 接近 GVE 高端标记的全球安全平台参考
        - 规模大得多，长期盈利，全球部署
      - - Okta
        - 公开市值
        - $24.88B，截至 Aug 2026
        - 身份 / 安全云参考
        - 产品组合和公有云运营模式不同
      - - Fortinet
        - 公开市值
        - $118.82B，截至 Aug 2026
        - 规模化安全平台上限参考
        - 规模和执行成熟度远超 GVE
      - - Palo Alto Networks
        - 公开市值
        - $270.44B，截至 Aug 2026
        - 平台化结果上限参考
        - 公司过于成熟，不能类比支撑 GVE 当前定价
    enumerationScope:
      coverage: sample
      basis: >-
        This table samples the most decision-useful public comparables and public private-market marks rather than every
        possible cyber, identity, payments, or govtech analog.
    notes: 正确读法是方向性的。GVE 还不能像已验证的上市可比公司那样估值，但这些可比公司也说明 $10.65B 标记已经有多激进。
