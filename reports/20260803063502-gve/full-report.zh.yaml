      - number: '8.4'
        title: 建议、终止触发器与退出准备度
        blocks:
          - type: paragraph
            body: >-
              仅从公开证据看，建议偏谨慎：按当前标题估值水平放弃，同时把 GVE
              放入基于里程碑的观察名单。信心为中等而非高，因为上行明显不是零。风险评级为高，因为公司要求投资者跨过架构叙事与商业证明之间异常大的缺口。估值立场是在最高公开标记下缺乏吸引力，尤其是 Caplight 的
              $10.65B 估算；除非一手尽调发现比公开记录强得多的客户和财务证据。


              关键论点破裂触发器很具体。如果 GVE
              不能展示受监管客户的具名生产部署，不能披露连贯收入模型和留存证据，或者不能用已签融资文件调和冲突估值数据，那么溢价论点会实质性变弱。反过来，如果管理层能拿出主权或银行上线、审计或强保证材料，以及有纪律的财务披露，建议可能快速改善，因为市场和产品雄心足够大。


              以外部投资者视角看，今天的退出准备度低，因为证明包不完整。对于相信创始人和论点的人，这家公司可能仍具备融资准备度；但它尚未具备让广泛投资者基于公开证据形成强信心的准备度。
