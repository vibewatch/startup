  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采购中心
        blocks:
          - type: paragraph
            body: >-
              GVE
              的公开客户图景，在工作流层面比在披露客户名单层面更清楚。日文和英文官网显示，公司同时追逐两组受监管问题：支付基础设施，以及隐私敏感的医疗或身份基础设施。这意味着几个不同的采购中心。在支付场景里，可能付费方是央行、商业银行、公共支付运营方或主权项目发起方。在医疗和边境工作流里，付费方更可能是部委、机场管理方、卫生机构或系统集成商，而日常用户是移民官、医院员工或旅客。在身份连接工作流里，用户可以是公民或企业终端用户，但买方仍然更像机构。


              公开材料反复显示，GVE 不是卖给自助式软件买家。它看得见的商业化路径高度依赖伙伴和机构。VICSA 与 CMIC 联合呈现，后者贡献机场护照读取和疫苗管理经验。Gift Pad 联盟提示另一条路径：把 GVE
              的安全栈导入已经服务市町村、企业和区域货币项目的伙伴。Digital Agency 的 My Number 材料在这里也重要，因为它展示了能让 GVE 架构具备商业相关性的身份和健康记录用例，尽管这些材料不能证明
              GVE 赢得了那些部署。


              关键尽调点在于买方、用户和付费方彼此分离。公民、旅客和银行账户持有人是终端用户；部委、银行或渠道伙伴是买方；实施很可能由集成商或机构项目居中推动。这种结构可以支撑很大的合同，但也会拉长销售周期，并把商业证明集中到少数参考关系上。
