      - number: '8.2'
        title: 当前估值语境与进入纪律
        blocks:
          - type: paragraph
            body: >-
              GVE 的公开估值表面足够嘈杂，进入纪律必须先于估值创意。Caplight 显示估算估值 $10.65B，并把公司描述为横跨支付、身份和 EMR 的 B2G 基础设施。Premier Alternatives
              显示明显更低的 $2B 当前估值和略有不同的融资总额。GVE 自己的 Medical Confidentia 文章引用了 467.9B 日元、类似市值的数字。INITIAL 和 STARTUP DB
              又提供更多创业数据库表述，而 PitchBook、CB Insights 和 Startup Intros
              在保留来源集中只能提供部分或嘈杂验证。这些差异可能来自过时数据、二级定价与一级标记差异、模型驱动估算或宣传性表述，但实际后果相同：仅靠公开标记并不是强估值证据。


              对待这类公司，正确方法是里程碑优先、价格其次。没有收入披露、客户分群或已签融资文件，投资者无法负责任地承保一个紧的公允价值点估计。相反，估值必须受限于公开证据实际能支撑的内容：一个有意义的技术期权、一些真实机构证明，以及承诺与商业确定性之间很大的证明缺口。


              这会导向一个有纪律的结论。GVE 可能值得认真尽调。仅凭公开证据，它不值得自动接受最高可见标题估值。
