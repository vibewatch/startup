      layers:
        - label: 工作流 / 终端层
          detail: 智能手机、扫描仪、终端、护照和面向用户的交互，在支付、身份或旅行健康用例中启动流程。
        - label: 接入与认证层
          detail: 接入点和私钥 / PSK 式认证建立可信会话，并减少握手开销。
        - label: 安全与密钥控制层
          detail: 面向 PQC 的密钥生成、密钥授权控制、HSM 式保护和秘密共享逻辑保护关键凭证。
        - label: 完整性与同步层
          detail: 三向数据库及相关存储逻辑旨在保持一致性、发现篡改，同时不依赖传统重型 PKI。
        - label: 机构编排层
          detail: 分层平台设计用同一套逻辑模型连接银行、政府、地方机构和伙伴系统。
        - label: 结果层
          detail: 实时结算、身份验证或安全健康数据检索成为工作流输出。
