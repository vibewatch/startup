      - number: '6.3'
        title: 留存、耐久性与公开证明缺口
        blocks:
          - type: paragraph
            body: >-
              客户耐久性是公开证据集中最弱的一环。没有保留来源披露活跃客户数、续约率、流失率、NRR、GRR、客户生命周期价值、可引用率或平均合同期限。也没有公开支持 SLA、uptime
              承诺或客户满意度指标，可以让机构关系基础更容易承保。仅从公开材料能说的是，CMIC 相关合作横跨多次发布仍在延续；Gift Pad、JICA 关联公共部门工作和乌克兰相关可行性研究都仍有商业兴趣，但经济性不透明。


              这一点重要，因为 GVE 的目标买方一旦部署，本应天然形成很强黏性。护照连接的健康工作流、央行或银行结算层、或者市政身份集成，实施之后看起来都不容易替换。但黏性必须被证明，不能靠假设。公开材料仍然没有说明，GVE
              到底是在因软件、集成、IP 授权、可行性研究收费，还是仅仅在做战略伙伴定位。即便一个负面细节也值得注意：GVE 联盟文章引用的 Gift Pad 某个服务 URL 目前返回 404，限制了外部对本应纳入 GVE
              技术的下游产品进行准确验证。


              因此，合适的尽调立场是双轨的。有足够证据相信机构采用工作正在发生；没有足够证据声称客户耐久性或商业扩张已经被证明。
