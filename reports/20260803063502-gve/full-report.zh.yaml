chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              GVE Co., Ltd. 将自己定位为一家日本数字基础设施公司，使命是「为数字未来革新金融和医疗」。日本官网列出的法人实体为 GVE株式会社 / GVE Ltd.，总部位于东京中央区兜町，并给出 2017 年
              11 月 10 日这一确切成立日期。独立创业数据库大体印证了同一创立窗口和东京总部；这一点很重要，因为公司的英文营销文案铺得很开，却常缺少硬公司事实。


              官网对创始团队披露得少见地直接。它列出 Koji Fusa 为创始人兼 CEO，Yu Kusakabe 为创始人兼 COO，Keita Takamatsu 为创始人兼 CTO，Susumu Kusakabe
              为创始人兼顾问。这种四人呈现比部分第三方资料更具体：OMFIF 的展商页面只突出 Koji Fusa 和 Susumu Kusakabe 为联合创始人，而 GVE 一项核心支付系统专利的美国专利记录列出 Yu
              Kusakabe、Koji Fusa 和 Keita Takamatsu 为发明人，GVE Ltd. 为受让人。综合来看，证据支持一个由创始人主导的运营团队：Fusa 是公司外部脸面，Kusakabe /
              Takamatsu 则是核心技术或运营搭档。


              从第一天起，GVE 就不像把自己框成一个窄口径应用供应商，而是平台建设者。日本官网和外部公司资料都描述了一个用于即时结算的法币数字化或 CBDC 平台，并搭配一个强调隐私保护信息交换的健康数据或 EMR
              平台。这种支付 + 数字健康的双线，使 GVE 区别于传统网络安全厂商；它也给出第一个线索：后续估值主张反映的是基础设施可选性，而不是当前已披露收入规模。
