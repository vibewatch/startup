      - number: '6.2'
        title: 具名证明与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              最强的公开客户证明不是宽泛客户墙，而是一组狭窄但具名的机构关系，成熟度各不相同。CMIC 是最清楚的交易对手。GVE 和 CMIC 联合把 VICSA 描述为一套连接护照、疫苗和出入境的工作流；GVE 文章和
              CMIC 的 PR TIMES 新闻稿都称，该概念在 2024 年 9 月通过了 WHO Digital Clearinghouse 审查。重要的是，围绕 CMIC 的公开证据还包含真实运营指标：CMIC
              称其底层疫苗护理技术帮助 200 多个市町村管理超过 100 万条疫苗记录，基于护照的海外日本人疫苗工作流在成田和羽田用于超过 30,000 份证明。这些数字验证了工作流相关性，尽管不能证明其中多少足迹转化为
              GVE 自身收入。


              CMIC 之外，次一级具体的机构证明仍处于可行性或渠道阶段。UNIDO 报道称，GVE 会见了乌克兰国家银行，并正在开展更高安全性银行间资金转账的可行性研究。GVE 的 JICA
              说明显示，公司曾经为即时支付平台拥有一个 PPP 导向的公共部门里程碑。沙特和 JETRO 材料显示，公司明确在招募沙特伙伴，并计划在利雅得建立面向中东和非洲的枢纽。Gift Pad
              不是已披露的主权客户，但它是有商业意义的渠道伙伴，因为其自身平台已经服务大量企业和市町村装机基础。


              合起来看，采用轨迹真实但不均衡。公开证据展示了一条阶梯：从概念页面，到联合研究，到 WHO 目录接纳，再到可行性工作和渠道联盟。它尚未展示的，是一长串具名、付费、生产级客户，以及披露的合同经济性或续约。
