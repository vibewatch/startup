  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开资产负债表真正显示了什么
        blocks:
          - type: paragraph
            body: >-
              GVE 最可用的公开财务证据，是年度资产负债表披露。FY2021 至 FY2024 报表显示，公司持续持有可观现金余额，最近几年流动负债较低，留存收益为负且继续加深。现金和存款从 FY2021 的 ¥851.7
              million 增至 FY2023 的 ¥1.14 billion，随后在 FY2024 降至 ¥938.3 million。每个披露年度的净资产总额都高于 ¥1.18 billion，FY2024 为
              ¥1.44 billion；总负债则从 FY2021 的 ¥259.0 million 降至 FY2024 的仅 ¥16.0 million。


              这种资产负债表模式很重要，因为它显示 GVE 并未处在即时流动性压力边缘。但它也不能证明经营表现强劲。同一批文件显示，年度净亏损从 FY2021 的 ¥54.0 million 扩大到 FY2022 的
              ¥62.1 million、FY2023 的 ¥109.7 million 和 FY2024 的 ¥114.9
              million。留存收益逐年更负。此外，部分资产基础不是简单的运营现金：资产负债表包含长期或短期贷款，FY2024 还包含对关联公司的投资。


              因此，公开报表只支持一个窄结论：从账面价值看，GVE 似乎具备偿付能力，最近几年杠杆也轻；但内部引擎仍不透明。投资人能看到现金、负债和亏损累积，却看不到最终能吸收这些亏损的收入质量。
