companyProfile:
  summary: >
    GVE Co., Ltd. 是一家总部位于东京的网络安全和数字基础设施公司，成立于 2017 年 11 月。公开材料描述的平台战略把加密安全、即时结算基础设施、数字身份联动和隐私敏感的健康数据交换组合在一起。公司最可见的验证点包括
    CMIC 伙伴关系和与 WHO 连接的 VICSA 工作流、Gift Pad 业务联盟，以及 UNIDO 记录的与 National Bank of Ukraine 的可行性工作。GVE
    的目标很大，也具备战略意义，但公开商业化证据仍远比产品叙事薄。
