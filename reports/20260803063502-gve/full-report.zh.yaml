        - 具名主权 / 银行生产环境部署、清晰收入证据、强审验材料包、规模化团队
        - 证据追上野心后，$10B+ 左右的公开高端估值才更可信
        - 执行拉伸、采购延迟和标准漂移仍然重要
        - 目前低
      - - 基准
        - 技术期权真实存在，但证据仍由背书伙伴主导，收入披露依然稀疏
        - 较低的数十亿美元区间比最高公开头部估值更站得住
        - 商业转化可能滞后，导致估值压缩或平轮
        - 目前最高
      - - 悲观
        - 锚定部署没有转化，亏损延续，估值信号仍不一致，证据到位前还需要融资
        - 估值向最低公开老股式标记靠拢，甚至跌破它
        - 稀释、下轮降价风险和投资逻辑疲劳
        - 不可忽视
    notes: 情景估值逻辑以里程碑为准，因为保留的公开来源无法支撑严谨的收入倍数框架。
    claimRefs:
      - CV018
      - CV021
      - CV022
      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV004
    title: 可比估值表
    columns:
