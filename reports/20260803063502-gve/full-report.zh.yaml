      - number: '5.5'
        title: 信任、隐私、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任是 GVE
              价值主张的核心，因为公司瞄准的是支付、身份和健康数据。公开材料反复强调隐私保护、数据主权和安全控制，而不只是消费级易用性。英文官网称，关键密钥存放在硬件安全风格模块中，主密钥通过秘密共享拆分，以降低内部人和灾难风险。VICSA
              材料称，参与国可以把数据保留在境内服务器。内阁府幻灯片把设计表述为合规内生，并与 ISO 24643 和欧盟式隐私逻辑保持一致。


              也有一些较软的治理信号。公司发布了集团人权政策，公告页面也显示其围绕资产负债表和资本事项保持定期公司披露。VICSA 被纳入 WHO Digital Clearing
              House，为至少一个工作流提供了一定外部审视。对于一家想卖给政府和受监管实体的小公司来说，这些都是有用的信任指标。


              但显眼缺口同样存在。保留的公开来源没有显示 SOC 2、ISO 27001、HIPAA 认证、正式 uptime 指标、渗透测试摘要、事故披露、支持 SLA
              或生产可靠性指标。技术叙事很重信任，公开运营证据却很轻信任。这并不否定产品，但意味着尽调必须把架构承诺和运营保证分开看。
