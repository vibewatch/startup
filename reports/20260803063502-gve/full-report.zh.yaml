      - number: '1.3'
        title: 平台范围、技术主张与产品足迹
        blocks:
          - type: paragraph
            body: >-
              GVE 的产品主张，是用私钥或后 PKI
              架构替换或绕开部分重度依赖公钥的旧基础设施，并声称这种架构更能抵御未来量子时代威胁。英文官网描述了两层方案，把预共享密钥认证和用于密钥生成的后量子密码学结合起来；日本官网和沙特材料则反复强调纯私钥或量子就绪基础设施。即便性能主张主要来自公司自述，技术和商业表述仍保持一致。


              产品范围不止支付。在金融侧，核心主张是面向法定货币、CBDC 和银行底层轨道的即时结算平台。在健康侧，GVE 销售一个隐私保护型平台，用于疫苗凭证、医疗记录和 EMR。最具体的产品证据是
              VICSA，即机场疫苗信息核验系统；GVE 称该系统由其与 CMIC 共同打造，并称公司在 2024 年 9 月 9 日被纳入 WHO Digital Clearing House 目录。同一公告还称，公司计划把
              VICSA 技术栈延伸到更广的 EMR 基础设施。


              知识产权是公司叙事的核心。GVE 自己的专利公告和 Google Patents 上的 US10628886B2 记录确认，一项授权美国专利已转让给 GVE Ltd.，发明人包括 Fusa、Yu Kusakabe
              和 Takamatsu。内阁府和沙特论坛材料也把公司的专利组合与 ISO/IEC 24643 对齐，塑造成国家级或银行级部署的战略差异点。关键尽调保留意见在于，几乎所有性能主张仍来自公司自述，而非独立基准测试。
