      - number: '2.2'
        title: 规模视角：广义网络安全 TAM、身份覆盖和医疗 IT 邻近市场
        blocks:
          - type: paragraph
            body: >-
              以广义视角看，日本已经是一个规模大且仍在增长的网络安全市场。Yano 估计，2025 财年日本国内网络安全市场规模为 ¥1.9471 trillion，并预测 2026 财年达 ¥2.122
              trillion；Research and Markets 与 Mordor Intelligence 都把 2026 年日本网络安全市场放在约 $11.36 billion，并预测到 2031 年 CAGR
              处于高个位数到低双位数区间。尽管方法不同，这些数字方向一致。本章只需确认一点：GVE 所处的国家市场里，网络安全支出已经相当可观，并非小众。


              数字身份视角不同，因为公共采用比预算规模更容易观察。Digital Agency 称，My Number 用于在行政流程和私营服务中识别个人；同一政策栈现在还包括 JPKI、芯片读取软件、数字认证 API 和
              Mynaportal API。UN ESCAP 报告称，到 2026 年初，已签发超过 100 million 张 My Number Cards，约占人口 80%；到 2025 年末，约 63 million
              个公款收款账户完成登记。这不能告诉我们日本数字身份安全预算的确切规模，但说明身份底座已经达到国家级规模。


              医疗是最能量化、也最贴近 GVE 健康数据故事的相邻小市场。Research and Markets 预测，日本 EHR 市场将从 2026 年约 $1.0 billion 增长到 2031 年 $1.3
              billion；IMARC 将相邻 EMR 市场估为 2025 年 $977.2 million、2034 年 $1.73 billion；TechSci 估计 2024 年为 $744 million，到
              2030 年约 $947 million。这些市场定义并不完全一致，但合在一起支持一个保守结论：日本数字健康记录市场已经大到值得关注，却远小于整体网络安全 TAM。因此，GVE 的现实 SAM
              最适合被看作跨越多个预算池的受监管基础设施切口，而不是单一头部市场数字。
