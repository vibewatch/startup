  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻预算池
        blocks:
          - type: paragraph
            body: >-
              最清晰的起点，是先定义市场，再谈规模。Yano Research
              将日本网络安全市场定义为用于保护企业或组织的计算机、网络和数据，防止未经授权访问、网络攻击及其他威胁的产品——包括硬件、软件和服务。仅按这个定义，市场已经足够宽，可以覆盖端点工具、云安全、托管服务、网络控制，以及治理
              / 合规支持。这个完整市场适合作为自上而下的 TAM 背景，但太宽，不能代表 GVE 现实可争取的采购场。


              GVE 自己的产品故事把目标大幅收窄。公司卖的不是通用杀毒、消费者隐私工具或大众 IAM。公开材料指向四个相邻但不同的预算池：安全支付和结算基础设施、CBDC 相邻或代币化货币现代化、数字身份和 JPKI
              联动验证底层轨道，以及包括 VICSA 和 EMR 交换在内的隐私敏感健康数据系统。这些预算池位于网络安全市场的高保障边缘；买方评判产品时，看重的不是功能广度，而是互操作性、数据主权、韧性和监管可接受性。


              因此，主要现状替代方案是既有厂商和旧流程，而不只是其他创业公司。在支付领域，替代方案是现有银行核心系统、卡组织和重度依赖公钥的安全层。在身份领域，是今天的 My Number、JPKI 和基于证件的 eKYC
              技术栈。在医疗领域，是既有 EHR/EMR 厂商加上碎片化本地系统。在边境卫生流程中，替代方案仍可能是纸质或 app 式证件核验。这使 GVE
              的可触达市场在结构上有吸引力，但落地很难：预算存在，可每个细分市场都背着旧系统集成和公共部门信任要求。
