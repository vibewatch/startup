  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议的核心链条是：市场大、架构有差异，但验证偏薄、风险高，必须守住价格纪律。
    data:
      nodes:
        - id: a
          label: 大型战略市场
        - id: b
          label: 差异化架构
        - id: c
          label: 部分机构验证
        - id: d
          label: 收入 / 持久性证据偏薄
        - id: e
          label: 高风险 / 低验证密度
        - id: f
          label: 按当前公开估值先放弃
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV008
      - CV028
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最能改写估值的是商业化和可信背书里程碑，不是继续讲概念化产品故事。
    data:
      items:
        - label: 具名受监管生产环境部署
          value: 5
        - label: 收入 + 利润率披露
          value: 5
        - label: 续约 / 留存验证
          value: 4
        - label: 第三方审验材料包
          value: 4
        - label: 人员规模 / 交付梯队扩张
          value: 3
        - label: 仅增加思想领导力曝光
          value: 1
    approximationNotes: 数值是 1-5 的估值敏感性相对重要性评分，不是金额变化。
    claimRefs:
      - CV024
      - CV025
      - CV028
      - CV031
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 现有公开证据只能支撑很宽的区间，因为公开估值标记还没有和清晰收入基数对齐。
    data:
      items:
        - label: 公开证据下的悲观区间
          low: 0.8
          mid: 1.5
          high: 2
        - label: 公开证据下的基准区间
          low: 2
          mid: 3.5
          high: 5
        - label: 基于里程碑的乐观区间
          low: 5
          mid: 8
          high: 10.7
    approximationNotes: 区间单位为十亿美元，是情景锚点，不是收入倍数模型的输出；上限卡在可见最高公开估值附近，因为现有证据不足以支撑更高水平。
    claimRefs:
      - CV010
      - CV011
      - CV021
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 市场和护城河得分高于验证、经济性和估值支撑。
    data:
      items:
        - label: 市场吸引力
          value: 4
        - label: 技术 / 护城河潜力
          value: 3.5
        - label: 客户验证质量
          value: 1.5
        - label: 经济性可见度
          value: 1
        - label: 风险调整后入场质量
          value: 1
        - label: 证据质量
          value: 2
    approximationNotes: 评分是基于采信公开证据作出的 1-5 分 IC 式判断，不是内部经营指标。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV015
      - CV028
      - CV029
      - CV030
