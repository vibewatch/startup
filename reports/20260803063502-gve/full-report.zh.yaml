      - number: '7.4'
        title: 财务、模型与估值风险
        blocks:
          - type: paragraph
            body: >-
              财务风险高，主要因为公开记录薄且互相矛盾。资产负债表公告真实且有用，但不披露收入、毛利率或现金流。它们确实显示 FY2021-FY2024
              持续亏损。这意味着投资者能看到资产负债表强度和亏损累积，却无法仅凭公开材料独立衡量商业效率或 runway
              质量。对于一家追逐主权和银行销售周期的公司，这个缺失的中间层很关键。长采购周期即便在战略价值真实时，也会消耗时间和资本。


              公开估值数据也明显分歧。Caplight 给 GVE 的估算估值是 $10.65B，融资额 $30.53M。Premier Alternatives 显示估值 $2B、总融资 $33.8M。INITIAL 和
              STARTUP DB 又采用另一套表述，而 GVE 引用 Medical Confidentia 的文章提到一个 467.9B
              日元、类似市值的数字。这些标记可能反映不同日期、方法或过时数据，但实际投资者风险相同：公开市场情报表面足够嘈杂，标题估值可能夸大确定性。


              另一个模型风险是商业模式模糊。Caplight 将 GVE 归为 B2G，并提到服务 / 咨询加订阅
              SaaS，但保留来源仍没有清楚拆开软件授权、集成、可行性研究、伙伴收入和主权平台经济性。这种不确定性让预测变难，也削弱任何简单基于倍数的估值论证。
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
