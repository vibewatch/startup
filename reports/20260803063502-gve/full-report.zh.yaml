      - number: '5.3'
        title: 部署、集成与客户工作流
        blocks:
          - type: paragraph
            body: >-
              公开证据里最具体的运营工作流是 VICSA。GVE 和 CMIC
              描述了一套系统：在机场读取护照信息，系统从安全基础设施中取回旅客疫苗或病历信息，核对目的地国家要求，并确认入境条件是否满足。页面强调了两个关键运营设计：旅客不需要专门的智能手机
              App，存放敏感信息的服务器也可以留在各参与国境内。这指向一种产品架构，专为隐私敏感、互操作摩擦很高的跨境工作流优化。


              支付工作流的描述更概念化，但仍透露出重要运营假设。内阁府材料把 GVE 描绘成一个账户到账户结算层，实时连接用户、商户和银行，同时简化发行方、收单方、处理机构和卡组织组成的传统链条。同一材料称，该 OS
              可以接入银行核心和网关，而不是要求客户完全重建绿地环境。身份工作流再往前走一层：分层身份连接被展示为一种方法，把国家、都道府县、市町村和私营系统接到同一平台上。


              这套集成故事在纸面上很有力度，但也暴露风险。每个工作流都依赖外部机构——银行、部委、机场、医疗系统或地方政府——改变运营行为。GVE
              似乎明白这一点，所以很多公开文件读起来更像设计伙伴或可行性阶段材料，而不是成熟产品手册。公司有集成产品逻辑，但公开支撑和可靠性细节仍然偏薄。
