      - number: '4.2'
        title: 收入模型与变现代理指标
        blocks:
          - type: paragraph
            body: >-
              保留下来的公开来源没有披露 GVE 按产品、客户、地域或合同类型划分的收入。外部最多只能根据公司材料和第三方资料三角验证变现方式。Caplight 将 GVE 的客户画像标为 B2G，商业模式横跨服务与咨询、订阅
              SaaS。VICSA 材料称，GVE 计划把 API 调用功能授权嵌入机场系统和其他既有运营环境。更广的平台叙事和创业数据库资料暗示，其收入可能混合平台授权、实施工作、集成项目，以及经常性支持或订阅元素。


              这与公司的产品组合在方向上吻合。CBDC、身份和安全健康记录基础设施不是消费者 app，而是高接触度的机构系统。这意味着销售周期长、设计或集成范围大，收入确认也可能混合里程碑付款、服务费和持续平台支持。Gift
              Pad 联盟以及面向政策的 JETRO / 政府材料还显示，伙伴关系和战略部署是商业化路径的一部分，而不只是独立软件订阅。


              问题在于，这些公开线索没有揭示已实现定价、折扣、续约行为或客户集中度。即便 JETRO 材料在财务上有暗示，它仍是情景文件，不是已签合同证据。因此，收入模型可以勾勒，但不能据此承销。公开来看，GVE 更像带有若干
              SaaS 特征的定制基础设施供应商，而不是干净的订阅软件公司。
