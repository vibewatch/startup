      - number: '1.5'
        title: 里程碑、外部认可与负面信号
        blocks:
          - type: paragraph
            body: >-
              最值得关注的里程碑模式不是消费者牵引，而是机构可见度。GVE 外部锚点最强的成就包括：2020 年一项核心交易管理技术获得美国专利授权；2023 年与 Gift Pad 结盟；2024 年 VICSA 被纳入
              WHO Digital Clearing House；2025 年出现在日本内阁府数字产业全球化材料中；2026 年通过 JETRO 分发 Saudi-Japan
              论坛材料。这些事件说明，公司持续找到舞台来讲国家基础设施叙事。


              同时，公开可见度不等于经验证的部署收入。政府和多边机构引用多数只能说明公司或其材料被展示、编入目录或分发；它们还不能证明 GVE 已从央行、部委或医院网络拿到规模化经常性合同。公开记录还包含 2023 年与
              Exchangers Co. 的商标争议，最终以和解告终；这是一个真实但可管理的负面点，不是推翻论点的断点。


              整体看，第一章尽调支持把 GVE
              视为一家创始人主导、政策网络可见、专利叙事靠前的日本基础设施公司。相对于极小的已披露员工基数和偏薄的公开商业化披露，它的主张异常宏大。因此，后续章节需要检验：公司的市场、客户、财务和估值叙事，能否撑住本章已经呈现出的机构级雄心。
