      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开财务结论是混合的。正面看，GVE 不像困境空壳。它披露了可观现金余额、较低的近期负债，以及远高于流动负债的账面净资产。公司也获得了足够外部关注——融资追踪平台、创业数据库、联盟公告、WHO
              连接的可见度和面向政策的展示——说明它不是纯粹投机的纸面实体。


              负面看，几乎所有决策级指标都缺失。保留下来的公开来源没有披露收入、ARR、毛利率、客户集中度、订单储备、CAC、回本、续约、递延收入或经营现金流。公开估值和轮次数据在追踪平台之间冲突很大。单靠资产负债表，看不出
              GVE 是正在复利成一家高质量基础设施公司，还是一边等待商业化一边保存资本。公开信息页反复出现的减资公告也提醒外部：公司过去发生过资产负债表工程和股权结构维护动作。


              因此，尽调阻断项不是「有没有数字？」而是「关键数字是否可得？」答案是否定的。严肃投资人或伙伴在承销价值之前，需要管理层提供一套材料：按产品和客户拆分的收入、经审计或由审计师编制的现金流明细、合同管线、部署经济性，以及资产端贷款或关联公司投资的解释。
