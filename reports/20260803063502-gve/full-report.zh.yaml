  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与论点完整性风险
        blocks:
          - type: paragraph
            body: >-
              GVE 想卖进软件和基础设施市场最难的一块：触及资金、身份和健康数据的受监管系统。即便没有任何不利事件，结构性监管风险已经存在。Digital Agency
              材料显示，日本的身份、公共健康数据交换、公共采购和数字政府工作流仍在活跃演进。白宫和 WHO
              材料显示，国际上也是同样模式：后量子迁移、数字健康治理和关键基础设施安全都是移动靶。公司在架构方向上可能正确，但如果公共买方采用了不同于预期的标准、采购规则或合规要求，仍可能耗掉时间或丢掉交易。


              法律风险画像也不是理论上的。GVE 公开披露，其与 Exchangers 的商标纠纷已通过和解解决，说明 IP 冲突已经出现过一次。这不是灾难性事件，但很重要，因为 GVE
              的定位高度依赖专有架构、专利和命名。人权政策是有帮助的治理信号，但保留的公开证据仍没有显示企业合规认证、外部审计，或按司法辖区拆分的支付、身份、医疗部署审批包。


              因此，主要的论点完整性风险不是「监管明天就会杀死公司」。风险在于，销售周期、证明要求和合规负担可能比当前公开证据集暗示的更重。如果发生这种情况，商业化滞后技术雄心的时间会比投资者预期更久。
