        title: 展示材料
        blocks:
          - type: callout
            title: 风险并非都指向同一方向
            body: 公司确实有一些缓释信号：真实法定披露、专利、顾问委员会、一项已解决诉讼披露，以及机构交易对手，而不是匿名炒作。
