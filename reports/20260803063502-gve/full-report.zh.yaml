      - number: '7.5'
        title: 团队、执行与终止标准
        blocks:
          - type: paragraph
            body: >-
              人员风险一部分可见，一部分只能推断。公开材料高度围绕创始人展开：Koji Fusa
              主导对外叙事，许多国际、媒体或政策引用都集中在他个人身上。这可以帮助业务拓展，但在公开员工数只有四人的情况下，也带来关键人风险。顾问委员会确实很强，为公司增加了领域和地域可信度；但顾问不能替代安全保证、项目交付、公共部门采购和客户成功中的全职运营深度。


              地理和垂直分散进一步放大执行风险。GVE
              同时出现在日本公共部门讨论、沙特扩展材料、乌克兰可行性工作、越南研讨会和非洲发展活动中。这种广度在战略上有吸引力，但如果在一两个锚定部署拿下并运营化之前追逐太多线索，一个极小团队可能被过度拉伸。


              因而，合适的终止标准必须具体。如果 GVE
              不能把一个或多个主权或受监管参考项目转化为具名生产部署，不能展示留存和支持证据，不能调和估值与商业模式模糊性，或者在没有更清楚客户证明的情况下继续扩大亏损，投资论点会实质性变弱。
