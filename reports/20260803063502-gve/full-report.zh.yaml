      - number: '3.2'
        title: GVE 的直接重叠与间接重叠
        blocks:
          - type: paragraph
            body: >-
              GVE
              与既有厂商的直接重叠只集中在一小组问题上：高保障身份核验、安全数据传输、受监管结算现代化，以及隐私敏感的健康信息交换。其公开平台材料强调后量子或纯私钥安全、快速认证、数据主权，以及可用于支付和医疗记录场景的基础设施。VICSA
              材料清楚表明，GVE 已把同一个核心安全模块描述为可用于疫苗记录、绑定护照的检查和未来 EMR。这形成了连贯主张，但它是切口，不是完整套件。


              既有厂商覆盖的地盘更宽。NTT Docomo Business 宣传托管安全、恶意软件防护、认证、安全浏览器、移动设备管理和更广泛 ICT 运营。NRI Secure
              提供咨询、安全评估、监管支持、SOC、身份管理、云控制、漏洞管理和 OT/IoT 监控。Fujitsu 强调整合物理与网络安全、云安全、威胁检测、24/7 监控和恢复。NEC
              提供跨人脸、虹膜、指纹、掌纹、声纹和耳声学认证的生物识别，用例从移民管控延伸到国家 ID 和企业访问。这些组合让买方在偏好已获认可的通用供应商，而非专门架构时，拥有更低风险选项。


              全球厂商的重叠方式不同。Trend Micro、Palo Alto Networks 和 Fortinet 都强调 AI 时代平台和庞大的企业装机基础。它们可能不是 GVE 架构的完美替代品，却能吃到预算，因为
              CISO 已经从它们那里采购更广泛的网络安全项目。Oracle Health
              在密码学上竞争较少，更多掌握医院和公共卫生系统内部的工作流所有权；这仍然重要，因为记录系统往往决定谁能引入新的安全数据层。Soramitsu 正相反：它在 CBDC 和数字资产雄心上更接近
              GVE，但离广义网络安全控制栈更远。因此，Soramitsu 是最清晰的相邻产品对手，即便重叠并不完全。
