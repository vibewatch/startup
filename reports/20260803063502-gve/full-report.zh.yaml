      - number: '1.4'
        title: 资本结构、融资信号与资产负债表快照
        blocks:
          - type: paragraph
            body: >-
              资本结构公开披露不完整，但仍比许多私营创业公司更有信息量，因为 GVE 公布年度资产负债表。2021–2024 年报表显示，总资产持续高于 ¥1.4 billion，账面负债不高，净资产大致在 ¥1.18
              billion 至 ¥1.53 billion 之间。报表也显示留存收益持续为负，说明资产负债表并不等于经营盈利。近期报表中，股本一直保持 ¥100 million，而新股认购权从 2023 年的 ¥106
              million 增至 2024 年的 ¥130 million。


              融资轮历史更浑浊。公司官网保留了一条与 Sankei 报道相关的简短说明，称 2020 年与美国基金投资绑定的增资支持 IPO 准备。Startup DB 将其扩展为 2020 年 5 月一轮约 $25
              million 的融资，参与方包括 Evolution Financial Group；Caplight 则列出 2020 年 4 月 Series A，之后还有 2021 年、2022 年轮次，以及 2024
              年 12 月最后一次融资事件。这些数据库在方向上都支持 GVE 获得风险资本支持且经历多轮融资，但公开信息并没有给出干净、完整、可交叉验证的股权结构历史。


              估值是波动最大、可靠性最弱的头部指标。Caplight 显示，截至 2024 年 12 月 1 日，GVE 估值约 $10.65 billion，累计融资 $30.53 million；INITIAL 在
              2026 年 7 月更新中则给出高得多的日元投后估值估算。差距大到不能把估值当成既定事实；在管理层或一手法律文件解释各数据库估算背后的资本结构、证券类型和定价口径之前，只能把估值视为情景区间。
