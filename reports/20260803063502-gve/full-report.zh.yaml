      - number: '3.3'
        title: 定价、打包、切换成本与买方偏好
        blocks:
          - type: paragraph
            body: >-
              在 GVE
              的现实竞争集中，公开定价信息非常少。这本身就是有用信号。主导受监管基础设施和企业安全账户的厂商，大多通过定制合同、客户团队、集成商或打包平台项目销售，而不是透明自助价目表。即便存在试用入口，采购动作仍然偏企业级。这意味着，GVE
              单靠价格颠覆很难赢单；买方会把供应商信任、集成负担、合格供应商身份、支持深度和运营连续性放在标价之前评估。


              切换成本也偏向既有厂商。银行支付和身份环境被旧系统、合规规则和机构风险团队紧紧绑定。医院和公共卫生环境还叠加互操作性和隐私约束。Bank of Japan 持续处在 CBDC 试点姿态，Digital
              Agency 的 My Number/JPKI 技术栈持续扩展，两者都强化了同一课：标准匹配和迁移执行与技术新颖性同样重要。只有当新供应商明确降低实施痛苦，或交付既有套件无法提供的结果时，它才可能被采用。


              GVE 的商业风险正是在这里显形。公司也许确实有安全低时延基础设施的差异化主张，但公开证据还看不到那类能让谨慎买方更容易切换的大规模经常性部署。按采购语境，GVE
              更可能被视为专门附加组件、试点供应商或设计伙伴，而不是既有安全或医疗平台的默认替代者。这不消除上行空间；它只是意味着销售周期和证据要求都应按沉重来假设。
