  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局形态：既有厂商、全球平台、相邻专家与现状方案
        blocks:
          - type: paragraph
            body: >-
              GVE 的竞争框架异常碎片化，因为公司横跨支付安全、数字身份和健康数据交换，而不是销售单一主流网络安全品类。官方材料描述了一个量子就绪安全平台、CBDC 和结算基础设施、数字身份底层轨道，以及 VICSA
              健康记录核验工作流。这意味着 GVE 主要竞争的不是消费者安全工具或商品化端点厂商；它想进入的，是已经受到公共机构、银行 IT 部门、医院系统和大型企业安全厂商影响的受监管基础设施层。


              最接近的日本机构型对手是 NTT Docomo Business、NRI Secure、Fujitsu 和 NEC。NTT 与 NRI 向企业和公共部门账户销售广泛的托管安全、认证、咨询和监控能力。Fujitsu
              把安全放在更宽的数字化转型和韧性项目中。NEC 在身份侧尤其重要，因为其生物识别认证产品已在全球移民、国家 ID 和企业用例中部署。这些公司未必匹配 GVE 的精确产品主张，但它们已经在 GVE
              必须拿下的账户类型中拥有可信采购入口。


              下一圈是全球平台竞争。Trend Micro、Palo Alto Networks 和 Fortinet 都销售覆盖身份、端点、云、SOC、网络和事件响应的一体化套件，IBM
              则带来咨询很重的转型项目。在医疗领域，Oracle Health 代表一种现状或替代技术栈，因为它把云端健康记录、互操作性、分析和安全控制装进大型既有生态。Soramitsu 是最切近的相邻专家，因为它明确销售
              CBDC、数字资产和支持身份的区块链基础设施。结果是：GVE 有差异化，但几乎每个侧翼都夹在更强分销系统中间。
