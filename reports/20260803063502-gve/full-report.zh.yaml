      - number: '6.4'
        title: 扩展循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              如果 GVE 成功，它很可能靠复用同一安全和编排层，扩展到相邻机构工作流。公开材料里可以看到这种模式：CBDC 或即时结算架构延伸到银行和政府支付系统；VICSA 延伸到更广义的 EMR
              和健康数据交换；身份示例把 My Number 风格认证连接到私营部门和政府工作流；Gift Pad
              等伙伴渠道则可以扩大对企业和市政项目的触达。这是典型基础设施扩展模型，少数参考部署可以打开许多更高价值邻近场景。


              风险在于集中。几乎所有强公开证明点都围绕少数实体聚集：数字健康里的 CMIC，市政或企业渠道触达里的 Gift
              Pad，日本政策论坛中的主权支付，以及乌克兰的一条可行性线索。这足以显示严肃性，却不足以证明多元化。销售动作看起来也很重采购、重集成，意味着周期长、公开证明积累慢，并依赖政策动能。


              因而，目前最佳解读是：GVE
              拥有机构参考客户基础，但还不是公开多元化的客户基础。扩展逻辑可信，潜在空间很大。但在管理层披露哪些项目是试点、哪些是付费生产部署，以及收入如何在项目间分布之前，商业集中、伙伴依赖和规模证明风险仍然重要。
