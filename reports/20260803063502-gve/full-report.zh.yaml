        title: 单位经济、成本结构与销售效率缺口
        blocks:
          - type: paragraph
            body: >-
              保留证据不足以支持常规 SaaS
              或基础设施软件单位经济分析。这里没有公开来源披露收入、毛利、服务成本、实施负担、人员开支、CAC、回本周期、NRR、管线转化或平均合同金额。这意味着最重要的投资判断问题仍未回答：GVE
              交付一个新部署要花多少钱，系统需要多少经常性支持，利润率能否随规模扩大，以及销售动作能否在不重度依赖创始人的情况下重复。


              仍有少数成本结构方向性线索。GVE 资产负债表显示有形固定资产非常有限，这与软件和服务公司一致，而不像制造或硬件很重的公司。公司持有大量现金，但多个年份资产端也有可观贷款与垫款，FY2024
              还有关联公司投资。这些项目让简单解读流动性变得复杂，因为并非所有账面资产都能立即用作运营现金。2021 年报表还出现过数字货币这一科目，后来年份消失。


              因此，正确的财务结论不是单位经济很差，而是外部看不见。公开证据支持一个高接触度企业和公共部门 GTM 动作，潜在合同金额可能较强，但转化慢。它不支持任何关于利润率路径、CAC 效率或现金消耗质量的精确判断。
