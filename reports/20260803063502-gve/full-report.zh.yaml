      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              架构是本章核心，因为 GVE 大部分差异化主张都落在这里。英文官网称，平台把认证和数据传输拆开，采用类似预共享密钥的认证来缩短握手，并结合后量子密码学生成密钥。同一页面还称，最关键的密钥隔离在类似 HSM
              的设备中，并通过秘密共享进一步保护。内阁府演示材料又补上一层：GVE 描述了一套数字原生操作系统，可以接入银行核心、ID 系统和各类平台，同时用一个数字 OS 取代发行方、收单方、处理机构和卡组织等多层链条。


              2025 年内阁府材料和相关 JETRO
              材料还反复出现两个技术积木：三方数据库和分层平台设计。三方数据库被描述为一种机制，通过多份存储之间的比对来同步账本并恢复完整性；分层设计则允许同一套安全逻辑部署到央行、银行、非银机构、政府和地方政府。内阁府材料还明确把同一概念从支付层延伸到国家和市政系统之间的身份连接。


              独立来源没有完全验证性能主张，但支持其架构叙事。UNIDO 称 GVE 对 ISO 24643 的创建起了重要作用，并把该系统描述为乌克兰机构支付现代化的一种更高安全方案。Ecma 417 和 ISO/IEC
              24643 也确认，所引用标准确实是一套分布式实时访问系统架构。NIST 的后量子报告和 2026 年白宫命令说明了 GVE 为什么持续强调密码敏捷性和后量子迁移：宏观问题是真实存在的，即便 GVE
              的实现优势仍主要来自公司自身表述。
