  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 没有具名生产环境部署
        - 到下一轮融资周期仍无受监管客户上线
        - 削弱「机构背书正在转化为业务质量」的说法
        - 继续观望 / 下调到仅有期权价值
      - - 没有收入质量披露
        - 管理层无法提供收入桥、留存数据或合同期限
        - 打破溢价倍数支撑逻辑
        - 只用下行情景，或直接放弃
      - - 估值无法勾稽
        - 公开标记与已签署文件仍不一致
        - 打破进入价格纪律的信心
        - 将头部估值视为不可靠并退出
      - - 审验材料包仍缺失
        - 关键部署没有第三方安全 / 合规证据
        - 削弱采购和规模化逻辑
        - 施加重折价，或放弃
      - - 没有客户证据时亏损扩大
        - 没有锚定客户上线，亏损继续累积
        - 显示拿到证据的时间被拉长
        - 假设存在稀释 / 下轮降价风险
    notes: 这些触发因素可证伪，比叙事动能更重要。
    claimRefs:
      - CV031
      - CV033
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 客户证据
        - 按账户和阶段列出的具名部署地图
        - 判定证据停留在试点级，还是已经到生产级
        - 管理层 + 背调电话
      - - 财务质量
        - 收入、毛利率、现金流、现金跑道和合同经济性
        - 若要把公司估值为技术期权以上，需要这些证据
        - 财务数据室
      - - 估值勾稽
        - 已签署轮次文件、股权结构表和任何老股交易
        - 需要借此在 $2B 式和 $10.65B 式公开标记之间做判断
        - 法务 / 财务尽调
      - - 安全审验
        - 审计材料包、认证、事故历史和正常运行时间 / SLA 指标
        - 对主权或银行采购信心至关重要
        - 安全数据室
      - - 伙伴经济性
        - CMIC、Gift Pad 和主权伙伴合同条款
        - 澄清集中度和变现路径
        - 商业尽调
      - - 组织准备度
        - 交付 / 合规 / 支持的招聘计划和运营归属
        - 检验团队能否吃下大型受监管部署
        - HR / 运营评审
    notes: 如果这些问题得到有力回答，建议和估值立场可以很快改善；否则，基于公开证据的谨慎态度大概率成立。
