      - number: '7.2'
        title: 运营、安全与交付风险
        blocks:
          - type: paragraph
            body: >-
              核心运营风险在于范围与可见运营足迹不匹配。GVE 公开表示，它服务或计划服务 CBDC、银行间结算、数字身份、机场边境健康检查、EMR 和更广义公共部门数字化。但日本官网和 Caplight
              都显示员工数为四人。这并不证明不可能——重伙伴模型可以放大小核心团队——但确实意味着，如果多个项目同时推进，可靠性工程、客户支持、事故响应、监管联络和复杂系统集成都可能被拉紧。


              公开技术故事仍跑在公开运营保证故事前面。保留来源没有显示 SOC 2、ISO
              27001、uptime、SLA、渗透测试或事故报告。也没有公开证明包显示其声称的性能或密码学优势能在生产流量下成立。在受监管基础设施销售里，这个缺口和优雅架构一样重要。买方可以欣赏设计，但如果没有支持流程、验证材料和经审计控制，仍会拒绝部署。


              最后，交付本身重集成。VICSA 材料假设机场、部委和参与国改变工作流；支付材料假设接入银行核心和网关；身份材料假设公共与私营数据共享协调。即便核心技术可靠，每一项依赖都会放大实施风险。
