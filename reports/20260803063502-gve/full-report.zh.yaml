      - number: '1.2'
        title: 领导层、治理与战略网络
        blocks:
          - type: paragraph
            body: >-
              领导权高度集中。Koji Fusa 在官网、VICSA 公告、Saudi-Japan 论坛材料和日本内阁府材料中，以社长、代表董事或 CEO 身份反复出现，是公司的主要公开发言人。官网还给出简明运营分工：Yu
              Kusakabe 任 COO，Keita Takamatsu 任 CTO，Susumu Kusakabe 任顾问。OMFIF 资料进一步说明，公司对外营销更多依赖 Fusa 和 Susumu Kusakabe
              的过往支付履历，而不是一支公开披露的深厚高管梯队。


              正式治理披露相对薄。GVE 披露了全球顾问委员会；这个委员会值得注意的是覆盖面，而非运营控制力：成员横跨 Oxford 儿科、国际法、资本市场、私人银行和海湾投资网络。这一点很关键，因为它暗示 GVE
              正试图用资深外部验证者和连接人，弥补公开披露员工基数很小的问题。不过，公开材料没有披露传统风投支持公司常见的董事会名单、董事会委员会或投资人治理权利。


              围绕公司的战略网络比正式董事会更可见。公开材料显示，GVE 连接了数字健康领域的 CMIC、业务联盟中的 Gift Pad、2025 年日本内阁府会议材料，以及 2026 年 Saudi-Japan
              部长级投资论坛。这些连接不能证明商业部署已有规模，但说明 GVE 已把叙事放进基础设施销售关键的政策和伙伴渠道。
