      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图因细分市场而明显不同。在 CBDC 相邻基础设施中，实际拍板方通常是央行、公共金融主管部门或商业银行联盟；用户是在这些机构内部运行的支付或运营技术栈；下游受益者则是公民、商户和交易对手。Bank of
              Japan 的公开 CBDC 实验记录显示，日本市场仍处在设计、试点和联络模式，而不是全国上线模式。也就是说，任何进入该细分市场的供应商，都必须熬过漫长评估周期，才可能看到有意义的部署收入。


              在数字身份中，Digital Agency 是标准制定者和生态编排者，但有效买方基础延伸到地方政府和私营服务。Digital Agency 自己的材料强调面向企业和行政机构的 JPKI、芯片读取、数字认证和
              Mynaportal API。居民是终端用户；但一旦卡片式身份核验嵌入开户、福利、健康和支付流程，企业、银行、保险公司和公共机构就会成为实施方和预算所有者。因此，即便凭证本身由政府签发，市场仍是 B2G/B2B
              混合型。


              在医疗数据安全中，医院和诊所是最明显的终端用户，但付款方和政策推动方更广：部委、都道府县、公共卫生机构和大型医疗运营方都会塑造采用路径。TechSci 与 Research and Markets
              都把医院列为日本 EHR 市场的主导终端用户；CMIC/GVE 的 VICSA
              案例则显示，机场卫生流程和政府跨境协调也可能成为采购环境。所有细分市场的采用路径相似：政策要求或运营痛点先触发关注，然后进入试点、集成规划、供应商风险审查，最后才规模化铺开。这条慢路径有利于满足信任和互操作性要求的供应商，也会惩罚依赖快速自助销售周期的公司。
