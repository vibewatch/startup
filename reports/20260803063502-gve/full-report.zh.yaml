      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动同时出现在公共政策和市场研究中。Yano 指出，AI 让攻击大众化、云迁移、IoT 扩张和远程端点倍增，推动日本企业把网络安全当作业务连续性基础设施，而不是可选 IT 支出。NCO 和 METI
              的政策材料也从国家视角强化了同一点：日本正在更新国家战略、主动网络防御姿态、产业指南和信任基础设施，而不是假设旧模型已经够用。


              数字身份和医疗数字化又增加了两股驱动力。My Number 技术栈持续扩展到健康保险资格证、移动凭证、公款收款账户，以及面向企业和公共机构的 API。在医疗领域，Research and
              Markets、IMARC 和 TechSci 都指出，老龄化、劳动力短缺和政府支持的数字健康标准化，是 EHR/EMR 继续采用的原因。这一点对 GVE
              很重要：安全与基础设施现代化打包出售，而不是作为单独控制项出售时，它的产品叙事最强。


              约束同样重要。实施和维护成本高、隐私和数据主权顾虑、互操作性问题，以及接入公共部门或医疗旧系统的难度，都会拖慢采用。TechSci 还指出一个具体暴露点：57.8% 使用 EMR
              的医院把这些系统连接到外部网络，一边制造信息泄露风险，一边也让现代化更难继续拖延。数字身份采用存在类似摩擦——日本转向基于芯片的核验，正是因为基于照片的 eKYC 已经太容易被伪造；但这种转向需要支持 NFC
              的设备、app 改造、用户支持和监管执行。因此，市场显然在增长，但任何基础设施供应商的收入曲线都会受制于实施复杂度和采购耐力。
