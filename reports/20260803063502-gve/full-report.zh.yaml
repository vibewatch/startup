        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              纸面上看，GVE 的短期资本充足性比公开披露质量更好。FY2024 资产负债表显示，公司有 ¥938.3 million 现金和存款，对应总负债只有 ¥16.0 million，净资产为 ¥1.44
              billion。即便 FY2023 和 FY2024
              亏损扩大，这些数字也不像一家面临即时资不抵债的公司。不过，跑道无法稳健计算，因为缺少现金流量表和经营烧钱细节。用年度净亏损作为烧钱代理，会推出较长跑道，但方法上很弱，因为会计亏损不是现金消耗，而且部分资产被贷款或投资占用。


              融资历史在方向上可见，但并不完美。GVE 自己的 2020 年增资说明称，Sankei 报道了美国基金投资和上市准备。STARTUP DB 称，2020 年 5 月融资约 $25
              million，并意味着当时估值为 ¥55.8 billion。Caplight 报告累计融资 $30.53 million，并列出一轮日期为 2024 年 12 月的私募股权融资。与此同时，INITIAL
              显示高得多的估算投后估值，与 Caplight 和 STARTUP DB 严重冲突。这些分歧太大，不能忽略，也不能当作事实来承销。


              因此，资本依赖仍是一个活的尽调问题。GVE
              现在也许有足够的资产负债表流动性，但公司仍似乎需要外部资本或未来超大合同来支撑其雄心。没有收入、订单储备、烧钱和现金流披露，外部无法根据公开材料可靠估计下一轮融资触发点。
