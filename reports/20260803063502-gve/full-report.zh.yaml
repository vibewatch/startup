      - number: '8.3'
        title: 情景承保与可比锚点
        blocks:
          - type: paragraph
            body: >-
              可比分析在这里只适合作为边界条件，而不是直接做倍数练习。公开网络安全和身份公司能提供一个感觉：投资者最终会为规模化、已验证平台付多少钱。截至 2026 年 8 月，Trend Micro 市值约
              $5.23B，Check Point 约 $12.98B，Okta 约 $24.88B，Fortinet 约 $118.82B，Palo Alto Networks 约
              $270.44B。它们在规模、收入质量或盈利能力上都不是直接可比公司，但能形成现实校验。GVE 的 $10.65B 标记会高于 Trend Micro，并接近 Check Point，而 GVE
              没有公开收入、利润率和大规模客户证据。


              这并不意味着高端标记不可能成立。它意味着高端标记应被视为取决于里程碑，而不是取决于现有证据。牛市情景要求具名主权或银行生产部署、独立可信的保证包、清晰收入证明，以及小团队可以在不崩溃的情况下放大交付的证据。基准情景假设技术期权真实，但证明仍由伙伴牵引，公开证据不完整。熊市情景假设商业化继续落后于架构，公司必须在证明收入质量之前再次融资。


              由于公开数据如此不完整，用情景范围比给出单一目标价更诚实。
