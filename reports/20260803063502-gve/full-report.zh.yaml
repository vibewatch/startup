      - number: '7.3'
        title: 伙伴、客户与依赖风险
        blocks:
          - type: paragraph
            body: >-
              客户章节已经说明，GVE 的公开证明集中在少数关系中。这进入风险章节，是因为伙伴集中可能同时变成收入集中、信誉集中和交付集中。CMIC 是数字健康里最深的可见参考。Gift Pad 是最清楚的企业 /
              市政渠道。乌克兰、JICA、沙特和越南相关材料显示管线和政策参与，但不是多元化经常性收入。如果其中任一线索停滞，外部证明集会很快变薄。


              还存在验证摩擦风险。GVE 联盟公告链接的某个 Gift Pad 服务页面目前返回 404。CMIC 网站直接拒绝了抓取运行。D&B 和 Tracxn
              给出的公司页面浅薄或损坏。这些事实都不能证明底层业务弱，但合在一起说明，对于一家向政府和银行销售基础设施的公司，第三方对交易对手和公司状态的佐证比投资者通常希望看到的更薄、更嘈杂。


              因此，依赖风险有两层：实际业务集中和证据集中。GVE 依赖少数交易对手来展示可信度，外部研究者则依赖更少数可访问来源来验证这种可信度。
            claimRefs:
