  - TR005
  figureRefs: []
- id: people-execution-and-kill-criteria
  title: People, Execution, and Kill Criteria
  body: 'The people risk is partly visible and partly inferred. Public materials are founder-forward: Koji Fusa dominates the outward-facing narrative, and many international, media, or policy references center on him personally. That can help business development, but it also raises key-person risk when the public employee count is four. The advisory board is genuinely impressive and adds domain and geographic credibility, yet advisers do not replace full-time operating depth in security assurance, project delivery, public-sector procurement, and customer success.


    Execution risk is amplified by geographic and vertical dispersion. GVE is simultaneously visible in Japan public-sector discussions, Saudi expansion materials, Ukrainian feasibility work, Vietnam seminars, and African-development events. This breadth is strategically attractive, but it can overextend a very small team if too many threads are pursued before one or two anchor deployments are secured and operationalized.


    The appropriate kill criteria are therefore concrete. If GVE cannot convert one or more sovereign or regulated reference programs into named production deployments, cannot show retention and support evidence, cannot reconcile valuation and business-model ambiguity, or continues to widen losses without clearer customer proof, the investment thesis weakens materially.'
