- id: operational-security-and-delivery-risk
  title: Operational, Security, and Delivery Risk
  body: 'The central operating risk is mismatch between scope and visible operating footprint. GVE publicly says it serves or plans to serve CBDC, interbank settlement, digital identity, airport-border health checks, EMR, and broader public-sector digitalization. Yet the Japanese homepage and Caplight both indicate an employee count of four. That does not prove impossibility—partner-heavy models can scale a small core team—but it does mean that reliability engineering, customer support, incident response, regulatory liaison, and complex systems integration are likely to be stretched if several programs advance simultaneously.


    The public technology story also still outruns the public operating-assurance story. There are no retained SOC 2, ISO 27001, uptime, SLA, penetration-test, or incident-report sources. Nor is there a public proof pack showing that claimed performance or cryptographic advantages hold under production traffic. In a regulated infrastructure sale, that gap matters as much as elegant architecture. A buyer can admire the design and still refuse deployment without support processes, validation artifacts, and audited controls.


    Finally, delivery itself is integration-heavy. The VICSA materials assume airports, ministries, and participating countries changing workflows; payment materials assume bank-core and gateway integrations; identity materials assume public and private data-sharing coordination. Each dependency multiplies implementation risk even if the core technology is sound.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
  - TR002
