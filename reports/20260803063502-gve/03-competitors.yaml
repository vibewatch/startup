- id: where-gve-overlaps-and-where-it-does-not
  title: Where GVE Overlaps Directly vs. Indirectly
  body: 'GVE overlaps directly with incumbents only in a narrow set of problems: high-assurance identity verification, secure data transport, regulated settlement modernization, and privacy-sensitive health-information exchange. Its public platform materials emphasize post-quantum or private-key-only security, fast authentication, data sovereignty, and infrastructure that can be used in payments and medical-record contexts. The VICSA materials make clear that GVE already frames the same core security module as useful for vaccination records, passport-linked checks, and future electronic medical records. That creates a coherent thesis, but it is a wedge rather than a full suite.


    The incumbents cover wider territory. NTT Docomo Business advertises managed security, malware protection, authentication, secure browsers, mobile-device management, and broader ICT operations. NRI Secure offers consulting, security assessments, regulation support, SOC, identity management, cloud controls, vulnerability management, and OT/IoT monitoring. Fujitsu emphasizes comprehensive protection across physical and cyber security, cloud security, threat detection, 24/7 monitoring, and recovery. NEC offers biometrics across face, iris, fingerprint, palmprint, voice, and ear-acoustic authentication, with uses ranging from immigration control to national ID and corporate access. These portfolios give buyers a lower-risk option when they prefer approved generalists to specialist architectures.


    The global vendors overlap differently. Trend Micro, Palo Alto Networks, and Fortinet all emphasize AI-era platforms and massive enterprise installed bases. They can be imperfect substitutes for GVE’s architecture, yet they capture budget because CISOs already buy broader cyber programs from them. Oracle Health competes less on cryptography and more on workflow ownership inside hospitals and public-health systems, which still matters because the system of record often controls who can introduce a new secure data layer. Soramitsu is the opposite: it is closer to GVE in CBDC and digital-assets ambition, but farther from the broad cyber-control stack. That makes Soramitsu the clearest adjacent product rival, even if the overlap is not total.'
