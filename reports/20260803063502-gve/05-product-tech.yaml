- id: architecture-and-operating-model
  title: Architecture and Operating Model
  body: 'The architecture story is the heart of the chapter because it is where GVE claims most of its differentiation. The English homepage says the platform separates authentication from data transfer, uses pre-shared-key style authentication to shorten handshakes, and combines that with post-quantum cryptography for key generation. The same page says the most critical keys are isolated in HSM-like devices and protected further through secret sharing. Cabinet Office presentation material adds another layer: GVE describes a digital-native operating system that can integrate with banking cores, ID systems, and platforms while replacing multiple layers of issuers, acquirers, processors, and schemes with one digital OS.


    The 2025 Cabinet Office deck and related JETRO material also surface two recurring technical building blocks: the three-way database and the hierarchical platform design. The three-way database is described as a mechanism to synchronize ledgers and restore integrity by comparing across multiple stores, while the hierarchical design allows similar security logic to be deployed across central banks, banks, non-banks, governments, and local governments. The Cabinet deck explicitly extends the same concept from payment layers into identity linking across national and municipal systems.


    Independent sources do not fully validate the performance claims, but they do support the architectural framing. UNIDO says GVE was instrumental in creating ISO 24643 and describes the system as a higher-security payment modernization approach for Ukrainian institutions. Ecma 417 and ISO/IEC 24643 confirm that the referenced standard is indeed an architecture for a distributed real-time access system. NIST’s post-quantum report and the 2026 White House order establish why GVE keeps emphasizing crypto agility and post-quantum migration: the macro problem is real, even if GVE’s implementation advantage remains company-asserted.'
