    - Banks, governments, healthcare/identity operators
    - Core technology claim repeated across homepages, VICSA, patents, and policy decks
    - Private-key-centric design, PQC framing, key authority controls, secrecy / sovereignty emphasis
    - Need third-party security review and implementation detail
  - - Three-way database / hierarchical architecture
    - Platform operators, regulators, public systems integrators
    - Patent-backed architecture concept; public diagrams available
    - Integrity restoration and same-system deployment across multiple institutional layers
    - Need concrete implementation references and scaling evidence
  - - VICSA travel-health workflow
    - Airports, border operators, health authorities, travelers
    - Most concrete public workflow; WHO catalog inclusion and CMIC collaboration
    - Passport-linked record verification without dedicated app, anti-forgery focus
    - Need paid deployment proof and support model
  - - EMR / secure health-data exchange platform
    - Governments, hospitals, health stakeholders
    - Roadmap / extension stage from VICSA
    - Uses same privacy-sensitive infrastructure for broader medical-record exchange
    - Need product boundaries, clinical integrations, and compliance evidence
  - - Hierarchical identity / KYC platform
    - Governments, local authorities, regulated enterprises
    - Conceptual architecture in Cabinet deck; no public rollout disclosed
    - One-platform linkage across national/local/private identity layers
    - Need actual integration reference sites and policy approvals
