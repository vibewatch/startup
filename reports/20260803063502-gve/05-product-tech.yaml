  rows:
  - - CBDC / RTGS platform
    - Central banks, banks, non-banks, merchants
    - Advanced concept with repeated public architecture materials; production scale not public
    - Real-time account-to-account design, card-rail bypass thesis, sovereign deployment framing
    - Need live deployment list, throughput under load, and production support evidence
