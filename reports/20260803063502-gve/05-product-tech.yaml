- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - User endpoint / access point
    - Captures user, passport, identity, or payment interaction
    - Endpoint devices, scanners, mobile or terminal environment
    - Endpoint compromise or poor hardware readiness can break trust chain
  - - Authentication / private-channel layer
    - Authenticates parties and establishes secure communication with reduced handshake burden
    - Private-key / PSK-style controls, device-to-server trust model
    - Operational key management complexity remains opaque publicly
  - - PQC / crypto-agility layer
    - Positions system against future public-key compromise and harvest-now-decrypt-later risk
    - Algorithm choice, migration discipline, standards tracking
    - Company may overclaim relative advantage without independent benchmark
  - - Three-way database / integrity layer
    - Synchronizes and cross-checks data or ledger states for integrity
    - Accurate replication logic and storage coordination
    - Implementation complexity and recovery semantics are not publicly audited
  - - Hierarchical platform layer
    - Allows same security logic to span banks, governments, local authorities, and private systems
    - Institutional interoperability and policy acceptance
    - High coordination burden across many actors
  - - Country-local data residency / server placement
    - Keeps sensitive data inside participating jurisdictions where possible
    - Domestic hosting, sovereign operations, legal compatibility
    - Operating model may be hard to deploy consistently across countries
  notes: This table abstracts across multiple public documents because GVE does not publish one exhaustive engineering reference manual.
