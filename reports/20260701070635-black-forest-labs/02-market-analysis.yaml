- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Model-quality and speed leadership across the FLUX family
    - Driver
    - Ongoing (accelerating with FLUX.2 klein, Jan 2026)
    - Lowers the quality bar competitors must clear; supports premium and volume tiers simultaneously
    - Request independent benchmark results beyond vendor and single-blog comparisons
  - - Falling per-image inference cost ($0.014 floor) and sub-second latency
    - Driver
    - Current, tied to FLUX.2 klein release
    - Expands real-time and high-volume use cases (e.g. e-commerce catalogs)
    - Verify gross margin at the lowest price tiers, not just list price
  - - Rising enterprise generative-AI budget commitment (59% investing $1M+/yr)
    - Driver
    - Current (2026 survey data)
    - Expands total addressable spend pool across image/video tools
    - Determine what share of that budget is earmarked for image/video vs. text/agents
  - - Open-weight distribution flywheel (Hugging Face, GitHub, marketplaces)
    - Driver
    - Ongoing since FLUX.1 (2024)
    - Lowers adoption friction and seeds developer mindshare closed rivals cannot easily match
    - Track download/fine-tune counts over time as a leading indicator
  - - Low enterprise AI ROI realization (only 29% see significant ROI)
    - Constraint
    - Current (2026 survey data)
    - Enterprise budget growth may not convert into durable, renewing vendor spend
    - Track renewal/expansion rates specifically for image-generation line items
  - - EU AI Act GPAI transparency and systemic-risk obligations
    - Constraint
    - Enforcement begins August 2026
    - Directly binding on Freiburg-headquartered BFL as a GPAI model provider
    - Confirm BFL's compliance posture and Code of Practice sign-on status
  - - Industry lobbying to delay AI Act enforcement
    - Constraint (uncertain timing)
    - Active as of 2025-2026
    - Could shift compliance costs/timing but signals broader industry friction, not certainty of delay
    - Monitor whether the Commission grants any delay or narrows scope
  - - Low switching cost via multi-model marketplaces (fal.ai, Replicate, Together AI)
    - Constraint
    - Ongoing
    - Limits BFL's pricing power even where model quality leads, since buyers can swap providers with a config change
    - Assess customer concentration and multi-homing rates among top accounts
  - - Capital intensity of frontier model training and rapid release cadence
    - Constraint
    - Ongoing (two major releases ~7 weeks apart, Nov 2025-Jan 2026)
    - Raises the bar for new entrants but also strains BFL's own compute/capital needs to keep pace
    - Confirm compute budget and roadmap runway behind the release cadence
  notes: Direction is assessed relative to BFL's own growth trajectory, not the market in general; timing reflects the most recent disclosed dates as of the 2026-07-01 run date.
