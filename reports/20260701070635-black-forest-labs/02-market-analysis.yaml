  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: An independent, audited estimate of BFL's own share of API or open-weight-licensing revenue within the broader AI image-generation market.
    whyItMatters: Without a company-specific revenue anchor, sizing lenses only bound the addressable market, not BFL's realistic capture, which limits valuation triangulation.
    diligencePath: Request BFL's disclosed or audited API revenue/ARR figures directly, or obtain analyst estimates that name BFL specifically rather than the market as a whole.
    relatedQuestionRefs:
    - QM010
  - type: enumeration-incomplete
    severity: material
    topic: sizing-gaps
    missingEvidence: A serviceable addressable market specific to open-weight commercial licensing, separate from hosted API usage, is not isolated in any market report reviewed.
    whyItMatters: Blending licensing and API revenue into one sizing lens obscures which channel is actually growing and which buyers are switching between them.
    diligencePath: Commission a bespoke market-sizing exercise segmenting open-weight licensing deals from API consumption, or request this breakdown directly from BFL.
    relatedQuestionRefs:
    - QM029
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A reconciled, single AI image-generation market size figure; five analyst lenses currently diverge by up to roughly 19x for the nearest comparable year.
    whyItMatters: Contradictory sizing materially changes whether BFL's addressable market looks like a few hundred million dollars or hundreds of billions, driving very different growth and valuation narratives.
    diligencePath: Request each publisher's full scope/methodology note and normalize the estimates onto one consistent inclusion boundary before using any single number in valuation work.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
  - type: stale
    severity: minor
    topic: market-sizing
    missingEvidence: Grand View Research's cited AI image generator market figures are anchored to a 2023 base year and were reviewed via a 2025 Wayback Machine snapshot, not a 2026-refreshed report.
    whyItMatters: A stale base year understates recent growth and may not reflect 2025-2026 model releases (e.g., FLUX.2) that likely accelerated adoption.
    diligencePath: Pull Grand View Research's most recent paid update or an equivalent 2026-dated report before citing this lens as current.
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: minor
    topic: enterprise-adoption
    missingEvidence: McKinsey's State of AI research, a leading independent source on enterprise generative-AI adoption, returned a 403 access-denied response on both direct fetch and a Wayback Machine snapshot during this research run.
    whyItMatters: Without McKinsey's data, enterprise-adoption evidence in this chapter leans on a single vendor-authored survey (Writer) that has a commercial interest in AI adoption narratives.
    diligencePath: Retry McKinsey access from a different network/IP, use a library/database proxy, or source an equivalent syndicated summary of the same survey from a secondary outlet.
    relatedQuestionRefs:
    - QM030
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: BFL's actual mix of revenue across its Builder/Platform/Professional/Enterprise pricing tiers is not disclosed publicly.
    whyItMatters: Without a revenue mix, it is not possible to tell whether BFL's growth is concentrated in low-margin self-serve developer usage or higher-value enterprise agreements.
    diligencePath: Request tier-level revenue mix or customer-count breakdown directly from BFL management during diligence calls.
