- id: diligence-gaps
  title: Sizing And Adoption Diligence Gaps
  body: Three gaps limit how far this chapter's sizing work can be pushed toward a company-specific valuation input. First, no reviewed source discloses BFL's own API revenue, unit volume, or share within the $484 million-$9.1 billion range of published market estimates, so the sizing lenses bound the addressable opportunity without pinning down BFL's realistic capture. Second, no report isolates a serviceable addressable market specific to open-weight commercial licensing as distinct from hosted API usage, even though BFL sells both; the two channels are blended in every analyst report reviewed. Third, the enterprise-adoption evidence in this chapter leans heavily on a single vendor-authored survey (Writer, 2026) because McKinsey's State of AI research — a leading independent source — returned a blocked/403 response on both direct and archived access during this research run. Rather than resolve these gaps with invented precision, this chapter preserves them as explicit open questions and
    evidence gaps for follow-on diligence, alongside the roughly 19x spread between the narrowest and broadest published market-size estimates.
  claimRefs:
  - CM041
  - CM042
  - CM043
