  - FM002
- id: buyer-segmentation
  title: Buyer, User, And Payer Segmentation
  body: 'BFL''s own pricing page defines four buyer/payer bands — a self-serve Builder tier for developers and early-stage teams, a Platform tier for product teams shipping at volume, a Professional tier for agencies serving multiple client domains, and custom Enterprise agreements starting at 200,000 generations per month with zero data retention and dedicated endpoints. Budget ownership shifts accordingly, from an individual developer''s card at the Builder tier to enterprise IT and CMO/Digital-Officer sign-off at the Enterprise tier. Beyond BFL''s direct accounts, three additional segments engage with FLUX without a direct billing relationship to BFL: third-party inference marketplaces (fal.ai, Replicate, Together AI) that resell hosted access; consumer/prosumer platforms such as Freepik that list FLUX among several selectable models; and an open-weight community of researchers and fine-tuners distributing and remixing FLUX checkpoints on Hugging Face and Civitai under non-commercial
    license terms. FLUX VTO further shows a vertical-specific adoption trigger: retail and e-commerce teams adopting catalog-scale virtual try-on to lift product-page conversion, a workflow prior AI attempts failed to productionize reliably.'
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
