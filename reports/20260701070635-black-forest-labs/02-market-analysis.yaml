  claims:
  - id: CM001
    statement: Black Forest Labs' commercially captured market is API-metered and enterprise-licensed access to its FLUX image and video generation and editing models, sold on a pay-per-generation and volume-agreement basis rather than as seat-based creative software.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM002
    - SM007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
  - id: CM002
    statement: BFL also captures market value through open-weights licensing that lets enterprises deploy and fine-tune FLUX models on their own infrastructure, a second included-spend channel distinct from hosted API usage.
    type: observed
    topic: market-boundary
    sourceRefs:
    - SM002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
    - QM003
  - id: CM003
    statement: Task-specific FLUX Tools endpoints for outpainting, erase, and virtual try-on extend BFL's addressable spend from generic text-to-image requests into specialized commercial workflows such as catalog imagery and product-page personalization.
    type: company-claimed
    topic: market-boundary
    sourceRefs:
    - SM005
    - SM006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM004
  - id: CM004
    statement: Adobe Firefly, Canva Magic Media, and Figma AI let enterprises generate and edit images natively inside incumbent creative-software subscriptions, so that spend is excluded from BFL's direct market capture even though it satisfies an overlapping end-user need.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM024
    - SM025
    - SM026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM005
  - id: CM005
    statement: Ideogram and Runway represent adjacent status-quo alternatives — an open rival image model and a video-first generative model respectively — that buyers can substitute for or combine with FLUX depending on whether the job is static image generation or video simulation.
    type: observed
    topic: market-boundary
    sourceRefs:
    - SM027
    - SM028
    confidence: medium
    freshness: current
    answersQuestionRefs:
