- calloutType: insight
  title: Public markets are pricing AI-adjacent creative incumbents far below Black Forest Labs' private multiple
  body: Shutterstock trades at roughly 0.5x FY2025 revenue and Adobe's market cap is down ~51% over the trailing
    year as of July 1, 2026, while Black Forest Labs' Series B implies roughly 34x revenue. Public and private markets
    are clearly pricing AI-exposed creative businesses very differently right now, and that gap itself is a valuation
    risk worth underwriting, not just a curiosity.
  claimRefs:
  - CV006
  - CV010
  - CV011
  - CV003
- calloutType: risk
  title: At least one peer is priced even richer than Black Forest Labs
  body: 'Runway''s $5.3 billion valuation against ~$90 million in annualized revenue implies roughly 59x -- higher
    than Black Forest Labs'' own ~34x. This complicates any simple ''BFL is overvalued relative to peers'' narrative:
    the private market for adjacent generative-media companies is pricing at least one comparable even more aggressively.'
  claimRefs:
  - CV013
  - CV015
- calloutType: assumption
  title: A full DCF cannot be responsibly built on today's evidence
  body: Cohort ARR, gross margin by monetization surface, net revenue retention, churn, and monthly burn are all
    undisclosed. Any DCF built on assumed values for these inputs would manufacture false precision rather than
    genuinely reduce uncertainty about Black Forest Labs' fair value, so this chapter deliberately stops short of
    producing one.
  claimRefs:
  - CV004
  - CV005
- calloutType: recommendation
  title: Research-more is the evidence-supported call, not buy or avoid
  body: The recommendation in this chapter is research-more with medium confidence and a high risk rating. This
    reflects insufficient valuation-specific disclosure, not a negative view of the underlying commercial traction
    documented elsewhere in this diligence.
  claimRefs:
  - CV043
  - CV044
