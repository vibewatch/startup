  rows:
  - - Adobe (Firefly, public)
    - Market cap $81.5B (Jul 1, 2026), down ~51% trailing year; Firefly revenue not broken out
    - No clean multiple computable
    - High -- largest incumbent creative-AI distributor and a disclosed BFL enterprise licensee
    - Consolidated multi-segment revenue prevents isolating a Firefly-specific multiple
  - - Shutterstock (public)
    - Market cap ~$512.5M (Jul 1, 2026) vs. FY2025 revenue $989.9M
    - ~0.5x revenue
    - High -- public stock-media incumbent monetizing gen-AI adjacently, and a BFL cap-table strategic investor
    - Legacy licensing-marketplace mix differs from BFL's model-API business
  - - Runway (private)
    - $5.3B valuation (Feb 2026 Series E) vs. ~$90M annualized revenue (mid-2025)
    - ~59x revenue
    - High -- closest well-funded adjacent generative-media peer
    - Video/world-model business model and unit economics are not directly comparable to BFL's image-API model
  - - Midjourney (private, self-funded)
    - ~$500M estimated 2025 revenue; no primary-sourced valuation event; aggregator range $3-6B
    - Not computable from a market-set price
    - High -- closest same-category (image-gen) peer on revenue scale
    - No funding round exists to anchor a defensible multiple; aggregator valuation range is unaudited
  - - Stability AI (private)
    - ~$50M 2024 revenue (stale); ~$225M total funding; aggregator-reported ~$2.8B 2026 valuation (range $1B-$2.8B
      across sources)
    - Not reliably computable given stale revenue and wide valuation range
    - High -- direct open-weight image-model competitor explicitly named against FLUX
    - Revenue figure is nearly two years stale and valuation estimates vary widely by source
  - - Ideogram (private)
    - $80M Series A (Feb 2024); aggregator-reported ~$200M valuation / $20M ARR (2024 vintage)
    - ~10x revenue (2024 figures, unconfirmed for 2026)
    - Medium -- text-to-image peer competing on quality/speed
    - Most recent public financial figures are roughly two years stale relative to the July 2026 run date
