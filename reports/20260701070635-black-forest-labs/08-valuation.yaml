- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cash position and burn
    - Audited cash on hand, monthly burn rate, and runway
    - Determines capital adequacy independent of the Series B headline and whether a bridge round is likely before
      any next priced round
    - Request directly from Black Forest Labs or its Series B lead investors
  - - Customer concentration
    - Contract-level revenue breakdown, especially the reported ~$140M Meta relationship
    - A single large contract concentrates valuation-support risk; renewal terms materially affect the durability
      of the revenue base
    - Request customer-level revenue disclosure or an anonymized concentration schedule
  - - Gross margin by surface
    - Gross margin for hosted API, enterprise contracts, open-weight licensing, and marketplace resale separately
    - Determines which monetization surface is actually profitable and scalable versus subsidized or compute-cost-constrained
    - Request a segment-level P&L or unit-economics breakdown
  - - Cap table and preferences
    - Full cap table, liquidation preference stack, and any debt/convertible terms from the Series B
    - Determines actual downside protection and dilution for any new investor independent of the $3.25B headline
      mark
    - Request cap-table disclosure as a condition of further diligence
  - - GPAI Code of Practice and compute-vendor identity
    - Confirmed EU AI Act GPAI Code of Practice signatory status and identity of the primary GPU/cloud compute vendor
    - Both affect compliance cost exposure and single-vendor dependency risk that could compress future margins
    - Request directly from Black Forest Labs; cross-check the EU AI Office's public signatory list
  - - New financing or secondary pricing since Series B
    - Any funding round, bridge, or secondary transaction since December 2025
    - Would be the most direct, market-set update to the $3.25B valuation mark used throughout this chapter
    - Monitor Sacra, CB Insights, TechCrunch, and Crunchbase on a recurring basis
  notes: Rows are ordered to match the order in which they would most change the valuation call if resolved, per
    the author's judgment.
