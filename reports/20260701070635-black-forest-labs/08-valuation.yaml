- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue growth continues toward Runway's ~$90M or Midjourney's ~$500M scale; enterprise contracts (Meta, Adobe,
      Canva, Snap) renew; private risk appetite for foundation-model companies persists.
    - Multiple holds near or expands beyond ~34x on a larger revenue base, supporting a follow-on round at or above
      $3.25B.
    - Requires both revenue execution and continued private-market willingness to pay AI-era multiples.
    - 'Weak-to-medium: no disclosed 2026 growth data confirms this trajectory is underway.'
  - - Base
    - Revenue grows but the multiple compresses toward the broader, more skeptical 2026 private AI market average.
    - A next round could price at a similar or modestly higher absolute valuation on a lower multiple if revenue
      has grown enough to offset compression.
    - Multiple compression could still produce a materially lower valuation if revenue growth undershoots expectations.
    - 'Medium: consistent with the CNBC/Perspective Labs/GeekWire bubble-skepticism evidence in this chapter.'
  - - Bear
    - The reported Meta contract is not renewed or is renegotiated downward; FLUX benchmark commoditization continues;
      broader down-round pressure (PitchBook's 220+ fallen unicorns) reaches AI-native private companies.
    - A down round below the $3.25B Series B mark, or a bridge/extension round on worse terms.
    - Concentrated customer risk plus sector-wide repricing could compound rather than offset each other.
    - 'Medium: down-round precedent is already broad-based across the venture market per CNBC/PitchBook, though
      not yet company-specific to BFL.'
