- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Loss, non-renewal, or material renegotiation of the reported ~$140M Meta contract
    - Any confirmed reduction >25% of that contract's reported value
    - Removes a large share of the revenue base the 34x multiple is computed against
    - Reassess valuation immediately; treat as a thesis-breaking event pending confirmation
  - - A new financing round priced at or below $3.25B post-money
    - Any confirmed priced round at/below the Series B mark
    - Direct, market-set signal of valuation compression, replacing this chapter's inferred risk with an observed
      one
    - Downgrade valuation stance to 'expensive' or 'down-round confirmed' and reprice any prior entry assumption
  - - A confirmed regulatory finding or lawsuit naming Black Forest Labs directly (vs. category-wide litigation)
      over deepfake/CSAM or copyright issues
    - Any formal complaint, charge, or adverse ruling naming BFL as a party
    - Converts an inferred reputational/regulatory overhang into a direct legal and compliance cost
    - Reassess risk rating to critical and pause any new capital commitment pending resolution
  - - Confirmed benchmark reversal showing FLUX.2 durably behind Nano Banana 2 or another rival across independent
      evaluations
    - Sustained benchmark deficit across 2+ independent evaluation cycles
    - Weakens the model-quality component of the differentiation thesis, pressuring achievable multiple
    - Revisit thesis assumptions on distribution-versus-quality moat durability
  - - Confirmed enterprise-wide generative-AI budget contraction affecting BFL's named enterprise customers
    - Public disclosure of budget cuts or vendor consolidation by Meta, Adobe, Canva, or Snap specifically
    - Enterprise ROI skepticism documented in this chapter (CIO, Axis Intelligence) crystallizes into an actual
      BFL revenue impact
    - Treat as an early demand-side warning signal and re-underwrite growth assumptions
  notes: Thresholds are the author's judgment calls for when an inferred risk becomes a confirmed, thesis-breaking
    event; none are disclosed contractual covenants.
