- id: section-regulatory-legal-risk
  title: 'Regulatory and legal risk: EU AI Act GPAI obligations, an unresolved Grok/xAI deepfake precedent,
    and sector-wide copyright litigation'
  body: 'Black Forest Labs'' Usage Policy, last revised April 2025, explicitly bans generating CSAM or
    non-consensual explicit content, biometric/surveillance use, and political-campaign use, and its Responsible
    AI Development Policy describes a three-stage pre-training/post-training/inference-time mitigation
    process built partly on an Internet Watch Foundation partnership. Those are genuine, independently
    corroborated mitigations, but they sit inside a regulatory environment that is both large and unsettled.
    The EU AI Act''s GPAI obligations under Article 53 became applicable to new models on August 2, 2025,
    with pre-existing models required to comply by August 2, 2027; the voluntary GPAI Code of Practice
    offers a presumption of conformity to signatories, but this chapter could not confirm from a primary
    source whether Black Forest Labs has signed it -- an attempt to verify against a live European Commission
    signatory page returned a page-not-found result during this research, and secondary summaries conflict.
    Separately, the EU AI Office has published a mandatory public training-data summary template under
    Article 53(1)(d); Black Forest Labs'' own ''Training Data Disclosure'' transparency page exists, but
    nothing found confirms it matches that template''s required granularity. The most acute regulatory
    precedent is the 2026 Grok/xAI deepfake and CSAM crisis: the UK ICO and Ofcom, the California Attorney
    General, and at least six distinct US and UK lawsuits were active as of mid-2026, with UK GDPR fines
    of up to £17.5M or 4% of global turnover in play, and a central unresolved legal question -- whether
    Section 230 shields an AI company when the AI itself generates the harmful content -- that could set
    direct-liability precedent for any image-generation provider. This matters directly for Black Forest
    Labs because reporting on the crisis describes Grok''s image generator as built on ''a heavily fine-tuned
    version of the Flux.1 model,'' and TechCrunch''s 2024 coverage already documented direct reputational
    fallout from the relationship years before the 2026 escalation, even though the commercial relationship
    reportedly ended around April 2025. No lawsuit or regulator reviewed names Black Forest Labs directly
    as a defendant. On copyright, the picture is mixed: Stability AI substantially won the UK Getty Images
    case in November 2025, but Andersen v. Stability AI remains in active US discovery with a September
    2026 trial date, and Disney/Universal v. Midjourney continues, so sector-wide training-data litigation
    risk remains open even where one comparable UK case has been resolved favorably for an AI image-generation
    company.'
