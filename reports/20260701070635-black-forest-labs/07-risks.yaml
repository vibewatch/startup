- id: section-operational-trust-risk
  title: 'Operational and trust risk: open-weight fine-tuning, training-data transparency gaps, and unproven
    filter efficacy'
  body: 'Because Black Forest Labs distributes open model weights through Hugging Face, GitHub, and Civitai,
    third parties can download, fine-tune, and re-host derivative models entirely outside the company''s
    own hosted-API safety pipeline; its license language prohibits unlawful misuse including privacy and
    biometric-law violations, but that is a contractual deterrent, not a technical control, and no enforcement
    or takedown track record is disclosed. This gap is not hypothetical: Low-Rank Adaptation (LoRA) fine-tuning
    can produce realistic AI-generated CSAM from as few as 20 images in about 15 minutes, and the Internet
    Watch Foundation recorded a 26,385% year-over-year increase in AI-generated CSAM videos in 2025 --
    a category-wide risk applicable to any open-weight image model that supports third-party fine-tuning,
    FLUX included. Black Forest Labs'' IWF membership, which grants access to a Hash List of more than
    2.7 million known CSAM hashes, is a real and independently confirmed mitigation, but the 2026 Grok
    episode -- an estimated 3 million sexualized deepfake images generated in under two weeks by a system
    built in part on a fine-tuned FLUX-family model -- shows that policy and filter layers have not been
    proven to fully close this risk at the ecosystem level. Training-data provenance is a second gap:
    Black Forest Labs has not published a dataset-level summary at the granularity the EU AI Office''s
    mandatory template requires, so provenance and copyright-compliance quality are unverifiable from
    public sources. Finally, no source discloses the company''s hosted-API uptime history or incident
    record, and violation reporting appears to run through a manual legal-email channel rather than a
    disclosed automated detection system, leaving both reliability and enforcement-scale questions open.'
