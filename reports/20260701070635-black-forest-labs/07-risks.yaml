callouts:
- calloutType: risk
  title: BFL’s own technology lineage is entangled in the 2026 Grok deepfake crisis
  body: Even though Black Forest Labs' commercial relationship with xAI reportedly ended around April
    2025, 2026 reporting on the Grok deepfake and CSAM investigations describes Grok's image generator
    as built on 'a heavily fine-tuned version of the Flux.1 model from Black Forest Labs.' This is a concrete,
    already-experienced reputational and technology-lineage risk, not merely a category-wide one -- and
    it sits alongside six-plus active lawsuits and regulator inquiries in the US, UK, and EU.
  claimRefs:
  - CR021
  - CR042
- calloutType: risk
  title: A single reported Meta contract could exceed all of FY2025 revenue
  body: Independent analyst estimates put Black Forest Labs' FY2025 annualized revenue at roughly $96M,
    while a single reported Meta contract is valued at approximately $140M across its term. Neither company
    has confirmed the deal, but if accurate, this is the starkest customer-concentration exposure in the
    company's public record.
  claimRefs:
  - CR039
  - CR040
- calloutType: assumption
  title: GPAI Code of Practice signatory status could not be confirmed from a primary source
  body: Secondary summaries conflict on whether Black Forest Labs has signed the EU's voluntary GPAI Code
    of Practice, and a direct attempt to check the European Commission's live signatory page returned
    a page-not-found result during this research. This chapter treats the question as unresolved rather
    than asserting an unconfirmed answer, and flags it as a priority diligence item given its direct bearing
    on EU AI Act compliance risk.
  claimRefs:
  - CR013
  - CR015
- calloutType: strength
  title: Safety mitigations are real, not cosmetic, but remain unproven at the ecosystem level
  body: Black Forest Labs' Usage Policy, Responsible AI Development Policy, and Internet Watch Foundation
    membership (with access to a 2.7 million-hash CSAM detection list) are independently corroborated
    mitigations. However, the 2026 Grok episode and the IWF's own AI-CSAM growth data both show that policy
    and filter layers have not been proven to fully close misuse risk once open weights are fine-tuned
    or redistributed outside Black Forest Labs' own hosted API.
  claimRefs:
  - CR038
  - CR028
  - CR036
