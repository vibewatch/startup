company:
  name: Black Forest Labs
chapter:
  number: 7
  title: Risks
  summary: 'Black Forest Labs pairs genuine, independently corroborated safety mitigations -- a published
    Usage Policy, a layered Responsible AI Development Policy, and an Internet Watch Foundation CSAM-detection
    partnership -- with a regulatory and litigation environment that is both large and unsettled: unresolved
    EU AI Act GPAI compliance questions, a 2026 Grok/xAI deepfake and CSAM crisis that implicates BFL''s
    own FLUX.1 technology lineage even after the commercial relationship ended, sector-wide AI-copyright
    litigation, a ~$140M Meta contract that could exceed the company''s entire prior-year revenue, an
    undisclosed compute-vendor dependency, and a ~34x revenue-multiple valuation sitting inside a skeptical
    2026 AI-investment climate. No lawsuit or regulator names Black Forest Labs directly as a defendant
    as of the run date, but the residual exposure across most categories remains high because key facts
    -- GPAI Code of Practice signatory status, compute-vendor identity, cash runway, and headcount trajectory
    -- are undisclosed.'
sections:
- id: section-risk-taxonomy-overview
  title: 'Risk taxonomy overview: six categories, from regulatory exposure to a founder-concentrated team'
  body: 'Black Forest Labs'' risk profile spans six categories that recur across the rest of this chapter:
    EU AI Act regulatory and GPAI compliance risk; deepfake/CSAM technology-lineage and copyright litigation
    spillover; customer, compute, and capital concentration; compute-cost and valuation risk set against
    a skeptical 2026 AI-investment climate; open-weight licensing ambiguity; and small-team execution
    risk. On execution risk specifically, Black Forest Labs'' own careers page describes a team of approximately
    70 people, a small headcount relative to the EU AI Act compliance, multi-jurisdiction deepfake enforcement
    exposure, and enterprise-scale customer commitments the company already carries; Andreessen Horowitz''s
    own jobs listing for the company still reflects Series A-era hiring language, suggesting some public
    documentation has not been refreshed since the December 2025 Series B. No source reviewed discloses
    headcount growth or attrition since that raise. Martin Scorsese''s advisor relationship, promoted
    on Black Forest Labs'' own site, previously drew public backlash from creative-industry peers including
    filmmaker Guillermo del Toro -- one concrete, already-experienced instance of the reputational-risk
    category discussed later in this chapter. Google''s February 2026 Nano Banana 2 launch further compounds
    the competitive benchmark gap already identified against Black Forest Labs'' FLUX.2 in the product-tech
    chapter, intensifying pressure across nearly every category below simultaneously.'
