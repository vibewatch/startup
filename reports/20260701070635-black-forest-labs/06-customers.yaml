  rows:
  - - Creative SaaS / design platforms
    - Platform itself (Envato, Freepik/Magnific, Picsart) is buyer and payer; end-users are consumers and marketers
    - Embedded text-to-image and editing inside consumer creative tools
    - 'Envato: ~25% of image-gen volume, 51M+ images all time'
    - High -- recurring API volume across mass-market products
    - No disclosed per-platform contract value or unit economics
  - - Enterprise brand / telecom marketing
    - Deutsche Telekom's in-house marketing team is buyer, user, and payer
    - Custom fine-tuned model for on-brand campaign imagery
    - One confirmed account, described as in development as of Feb 2025
    - Medium -- bespoke deal, strategic reference-logo value
    - Not confirmed as production-live; no outcome metrics disclosed
  - - AI-assistant / chat-product vendors
    - Mistral AI is buyer/payer; Le Chat end-users are consumers
    - Native image-generation feature inside a competing AI assistant
    - Shipped/production since November 2024
    - Medium -- platform-embedded distribution, no usage volume disclosed
    - No adoption, usage, or renewal data disclosed
  - - Big-tech platform licensing
    - Meta is buyer/payer per secondary reporting
    - Licensing FLUX.2 technology to power Meta's own image-generation capability
    - Reported multi-year deal, unconfirmed by either party
    - High -- reported ~$140M contract is the largest known single deal
    - Deal terms, product surface, and status are officially unconfirmed
  - - Marketplace / API distribution partners
    - fal.ai, Replicate, Together AI, and Runware host the models; developers on those platforms are the actual usage-based
      payers
    - Pay-per-use API access without a direct BFL relationship
    - Together AI reports 1M+ developers with FLUX.2 access
    - Medium -- high-volume channel, thin per-unit economics
    - No visibility into what share of marketplace revenue flows back to BFL
  - - Developer / open-source community
    - Individual developers and researchers downloading open weights; largely non-paying
    - Self-hosted inference, fine-tuning, and research
    - Civitai's FLUX.1 [dev] page shows large download/view counters and 22,673 reviews
    - Low direct revenue -- indirect brand and ecosystem value
    - No conversion-to-paid-tier data disclosed
  - - Individual creative professionals / studios
    - Martin Scorsese (advisor role) and production studios such as Apostle
    - Storyboarding, product photography, OOH creative, and video pre-production
    - Confirmed production use; one advisor relationship; one studio review rated 8.1/10
    - Low individually, but high reference and marketing value
    - Small, self-selected sample; no broader creator-segment data
  - - Former consumer AI-chatbot channel (xAI / Grok)
    - xAI was buyer/integrator; end-users were Grok/X consumers
    - Image-generation feature inside the Grok chatbot
    - Relationship ended April 2025 after safety controversy
    - Was meaningful in 2024 for visibility and revenue; now zero
    - Illustrates realized channel-churn and reputational-concentration risk
