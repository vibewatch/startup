- id: section-adverse-signals
  title: 'Adverse signals: the Grok/xAI episode is the clearest customer-trust risk in the public record'
  body: 'The most substantial adverse evidence in this chapter concerns Black Forest Labs'' former relationship with xAI.
    TechCrunch''s original August 2024 report described Grok''s FLUX-powered image generator as having "very few safeguards,"
    enabling non-consensual depictions of real people, and quoted a public reaction calling it "one of the most reckless and
    irresponsible AI implementations." A January 2026 report ties a later Grok update, "Image Gen 2," to "a heavily fine-tuned
    version of the Flux.1 model from Black Forest Labs" and states that California''s Attorney General and Canada''s Privacy
    Commissioner opened investigations into xAI over non-consensual deepfake generation; that reporting does not allege wrongdoing
    by Black Forest Labs directly, and Sifted''s tracked coverage confirms the two companies had already stopped working together
    by April 2025. A second, smaller adverse signal comes from the creative industry: coverage of Martin Scorsese''s advisor
    role notes public backlash from storyboard artists and peers, including filmmaker Guillermo del Toro, over AI''s growing
    role in creative production work. A third, more procedural signal is licensing friction -- recurring community confusion
    over commercial-use terms for the FLUX.1 [dev] non-commercial license -- which is a milder but real form of customer/procurement
    friction rather than a safety issue. None of these signals individually threatens the current named-customer relationships
    profiled elsewhere in this chapter, but together they establish that customer-adjacent reputational and regulatory risk
    has already materialized once and remains a live consideration for future enterprise licensing decisions.'
