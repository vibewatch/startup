- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Land-and-expand via marketplaces (fal.ai, Replicate, Together AI, Runware)
    - Revenue-share dependency on third-party platforms that could reprice or delist the model
    - A marketplace policy change could compress margins or cut off developer-tier distribution overnight
    - Request % of API revenue by channel (direct vs. marketplace)
  - - Enterprise co-development tier (self-hosted, bespoke fine-tuning)
    - Bespoke deals concentrated in a small number of large accounts (Telekom, Meta)
    - Loss of one or two large accounts could swing revenue materially against a reported ~$96.3M ARR
    - Request top-10-account revenue concentration percentage
  - - Distribution via big-tech platforms (Azure, Meta, Mistral)
    - Reliance on continued commercial goodwill of hyperscaler/AI-assistant partners who could build competing in-house models
    - Platform disintermediation risk if a partner internalizes image generation
    - Review contract renewal terms and any exclusivity or most-favored-customer clauses
  - - Consumer/creator community volume (Envato, Freepik/Magnific, Picsart)
    - Thin per-unit API pricing tied to a high-volume, price-sensitive consumer-creative segment
    - Margin pressure if consumer platforms negotiate down per-image pricing at scale
    - Request blended ARPU / revenue-per-image by channel
  - - Reputational exposure from a past controversial channel (former xAI/Grok deal)
    - Early revenue and visibility were concentrated in one high-profile but controversial customer
    - Regulatory and reputational risk transferred to BFL's brand even after the relationship ended
    - Request BFL's content-use and customer-vetting policy for enterprise licensing deals
  notes: Impact figures combine BFL-disclosed data with secondary-reported financials (ARR, Meta contract); treat quantitative
    impact statements as directional pending official confirmation.
