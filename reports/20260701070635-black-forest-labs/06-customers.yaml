- id: section-named-proof
  title: 'Named customer proof: production depth varies sharply from one detailed case study to several logo-only mentions'
  body: The strongest single piece of customer proof is Black Forest Labs' own case study on Envato, which names a CEO, quotes
    him directly, and discloses a specific usage metric (~25% of image-generation volume, 51M+ images all time) and a production
    timeline (evaluation in early 2023 via a reseller, direct partnership after, day-zero FLUX.2 launch). No other named account
    comes close to that level of detail. Deutsche Telekom's cooperation is confirmed by both the customer's own press release
    and independent German tech press (heise online), but as announced in February 2025 it describes a model still "being
    developed," with no outcome metrics published since. Mistral AI's Le Chat and Freepik's Magnific both confirm FLUX integration
    in their own words, but neither discloses usage volume. Picsart's developer documentation lists Black Forest Labs as an
    integrated model provider without further commentary. The reported Meta deal, potentially the single largest contract,
    rests entirely on secondary financial reporting that neither company has confirmed. Martin Scorsese's storyboarding use
    is well-documented and enthusiastic but is an advisor relationship, not a commercial account, and it drew public criticism
    from creative-industry peers including Guillermo del Toro. Production studio Apostle's 8.1/10 review is a genuine but
    single-firm data point. Taken together, only Envato clears the bar of production-plus-quantified-outcome; every other
    name is either logo-only, unconfirmed, or a single small-sample endorsement.
  claimRefs:
  - CU001
  - CU008
  - CU009
  - CU010
