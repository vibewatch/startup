  - FU002
- id: section-retention-durability
  title: 'Retention and durability: no disclosed NRR, GRR, or churn rate, and one confirmed churn event'
  body: 'Black Forest Labs has not publicly disclosed net revenue retention, gross revenue retention, renewal rates, cohort
    data, or a customer-satisfaction survey as of the run date. The one concrete durability data point available is negative:
    Elon Musk''s xAI, which used FLUX.1 to power Grok''s image generator from mid-2024, stopped working with Black Forest
    Labs by April 2025, confirmed by Sifted''s ongoing coverage and consistent with TechCrunch''s original reporting on the
    partnership. That is a realized logo-churn event involving what was, at the time, one of the company''s most visible customer
    relationships. Attempts to independently verify third-party review-platform ratings (G2) were blocked during this run
    by an anti-bot challenge, so satisfaction evidence is currently limited to a single production studio''s published 8.1/10
    review and Envato''s own account of sustained, expanding usage since FLUX.2''s day-zero launch. Contract length is only
    partially inferable: secondary reporting on the Meta deal implies a roughly two-year structure ($35M in year one, $105M
    in year two), but this has not been officially confirmed and no other account''s contract terms are disclosed. The overall
    picture is a data-availability gap rather than evidence of poor retention, but it is a genuine blocking gap for any durability-based
    valuation view.'
  claimRefs:
  - CU018
  - CU023
  - CU033
  - CU034
  - CU035
  tableRefs:
  - TU004
- id: section-expansion-concentration
  title: 'Expansion and concentration: marketplace breadth cuts both ways, and a few large deals could dominate revenue'
  body: 'Black Forest Labs'' distribution strategy -- open weights plus marketplace listings on fal.ai, Replicate, Together
    AI, and Runware -- is an efficient land-and-expand engine for developer reach, but it also means a meaningful share of
    usage flows through channels the company does not fully control and does not disclose revenue-share terms for. At the
    other end of the size spectrum, the enterprise co-development tier concentrates commercial value in a small number of
    large, bespoke deals: if the reported figures are accurate, the Meta contract alone (~$140M across two years) would be
    equivalent to roughly 145% of Black Forest Labs'' reported ~$96.3M ARR figure from August 2025 -- meaning a single account
    could represent revenue on the same order of magnitude as the company''s entire prior run rate. Distribution through big-tech
    platforms (Azure AI Foundry, Meta, Mistral) extends reach but creates disintermediation risk if any of those partners
    builds a competing in-house model. Procurement friction is visible in the open-weight community itself: recurring Hugging
    Face discussion threads and a BigGo News report both describe confusion and "commercial barriers" around what counts as
    commercial use under the FLUX.1 [dev] Non-Commercial License, requiring a separate self-serve paid-licensing step that
    is not obviously communicated to first-time users. Finally, the company''s history with xAI/Grok shows that customer concentration
    risk is not only financial: a single controversial customer relationship can attach lasting reputational and regulatory
    exposure to the brand even after the commercial relationship ends.'
  claimRefs:
