- id: FU004
  title: Revenue concentration signal
  type: bar
  layout: standard
  summary: The reported Meta contract alone is equivalent to roughly 145% of BFL's reported prior-year ARR, per secondary
    financial reporting.
  data:
    items:
    - label: Reported Meta multi-year contract value ($M)
      value: 140
      tone: risk
    - label: BFL reported ARR, Aug 2025 ($M, secondary report)
      value: 96.3
      tone: neutral
    - label: Projected FY2026 ARR ($M, secondary report)
      value: 300
      tone: positive
  approximationNotes: All three figures originate from a single low-reputation secondary financial report and have not been
    officially confirmed by Meta or Black Forest Labs.
  claimRefs:
  - CU015
  - CU016
  - CU017
callouts:
- calloutType: strength
  title: Envato is a genuine, quantified production reference
  body: Envato is the only named account with a named executive quote, a specific usage share (~25% of image-gen volume),
    and an all-time volume figure (51M+ images), plus a documented reseller-to-direct progression -- the highest-quality customer
    proof in the public record.
  claimRefs:
  - CU008
  - CU009
  - CU010
- calloutType: risk
  title: A single reported contract could rival the company’s entire prior-year ARR
  body: If secondary reporting on the Meta deal is accurate, its ~$140M value is roughly 145% of Black Forest Labs' reported
    ~$96.3M ARR -- a concentration level that would make renewal or loss of one account a first-order revenue event, and neither
    figure is officially confirmed.
  claimRefs:
  - CU015
  - CU016
  - CU017
- calloutType: risk
  title: Customer-adjacent reputational risk has already materialized once
  body: The xAI/Grok relationship drove early visibility but ended in April 2025 amid deepfake/NSFW safety criticism and reported
    regulatory scrutiny of Grok's FLUX-based image generator -- a precedent for how a single controversial customer can attach
    lasting brand risk.
  claimRefs:
  - CU018
  - CU019
  - CU020
- calloutType: insight
  title: Some named logos are investors, customers, or both
  body: Canva and Figma Ventures appear as Series B investors in the same announcement that separately names Canva as a product
    partner "building on" Black Forest Labs' models -- diligence should not assume every logo represents an arm's-length paying
    account.
  claimRefs:
  - CU038
- calloutType: recommendation
  title: Prioritize account-level concentration and retention data in diligence
  body: The single most consequential missing dataset is top-10-account revenue concentration, contract length, and NRR/GRR
    by cohort; request it directly from management rather than relying on logos or secondary press.
  claimRefs:
  - CU033
  - CU035
