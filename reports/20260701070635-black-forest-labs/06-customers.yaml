- id: section-adoption-trajectory
  title: 'Adoption trajectory: broad distribution reach, thin disclosure of usage depth'
  body: Black Forest Labs discloses adoption signals at very different levels of precision. At the vaguest end, its enterprise
    page claims the managed API is "already powering billions of image generations per year" with no exact figure, growth
    rate, or customer breakdown. Together AI states FLUX.2 is available to "1M+" of its developers, which measures platform
    exposure rather than confirmed FLUX usage or paying accounts. Civitai's FLUX.1 [dev] checkpoint page shows large engagement
    counters (344.6k and 140.2m, alongside 22,673 reviews rated "Overwhelmingly Positive") that are directionally impressive
    but not clearly labeled as downloads versus views in the extracted page text, so they should be treated as approximate
    community-reach signals rather than precise KPIs. The one genuinely quantified adoption data point -- Envato's ~25% FLUX
    share of image-generation volume and 51M+ all-time images -- comes from a single BFL-published case study and has not
    been independently audited. Secondary financial reporting adds an ARR figure ($96.3M as of August 2025, projected to $300M
    for FY2026) and a combined contract value of roughly $300M across Adobe, Canva, Snap, and Meta, but this reporting originates
    from one lower-reputation outlet and has not been corroborated by an official company statement, so it should be treated
    as a directional signal pending verification rather than a confirmed baseline.
  claimRefs:
