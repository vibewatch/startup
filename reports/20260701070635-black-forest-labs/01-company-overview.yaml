callouts:
- calloutType: strength
  title: Founder-market fit is unusually well corroborated by primary research
  body: Independent press, an aggregator profile, and the founders' own arXiv-published research all place Robin Rombach, Patrick Esser, and Andreas Blattmann (and, per one source, Dominik Lorenz) as the researchers behind Latent Diffusion Models and the Stable Diffusion 3 rectified-flow architecture before founding Black Forest Labs, giving the team a rare direct line from foundational research to a $3.25B commercial business.
  claimRefs:
  - CO005
  - CO008
  - CO009
  - CO019
- calloutType: risk
  title: Governance, cap-table, and financial disclosure remain materially opaque
  body: No reviewed source discloses a board roster, ownership structure, secondaries, debt facilities, customer count, or revenue for Black Forest Labs, and even the founder count and headcount are disputed across sources; later chapters should treat these as open diligence items rather than settled ground truth.
  claimRefs:
  - CO007
  - CO011
  - CO014
  - CO023
  - CO040
  - CO041
- calloutType: risk
  title: Downstream-misuse and regulatory-lobbying exposure are real, documented risks
  body: The xAI/Grok deepfake-image controversy, Sifted's "most-hyped and elusive" critique, and Black Forest Labs' own July 2025 call (with Mistral and other EU startups) to pause AI Act enforcement together show that platform misuse, public-transparency criticism, and active regulatory lobbying are already part of the company's track record, not merely theoretical risks.
  claimRefs:
  - CO026
  - CO027
  - CO029
  - CO030
  - CO031
