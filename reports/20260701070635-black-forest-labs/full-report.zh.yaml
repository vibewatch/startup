              研究在本轮研究中，无论直连还是归档访问都返回 blocked/403。与其用虚构精度填补这些缺口，本章把它们保留为后续尽调的明确开放问题和证据缺口，同时保留狭义与广义已发布市场规模估算之间约 19 倍的跨度。
