  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 典型 BFL 生产工作流从用户意图开始，经模型选择和 API 或自托管推理，交付带 C2PA 签名的图像输出，并可由安全过滤器拦截。
    data:
      nodes:
        - id: wf1
          label: 用户或开发者发起生成 / 编辑任务
          detail: 入口可以是 BFL Playground、REST API 调用、MCP 客户端提示词（Claude / Cursor），或程序化 Diffusers / ComfyUI 管线。
          tone: neutral
        - id: wf2
          label: 模型选择
          detail: 用户或编排层选择层级：max（最高质量）、pro（生产）、flex（排版）、klein-9B（快速、非商业）、 klein-4B（快速、Apache-2.0）或 dev（研究）。
          tone: neutral
        - id: wf3
          label: 附加参考图像 / 上下文
          detail: 最多提供 10 张参考图像用于多参考条件控制；使用 prior-generation request_id 生成变体；为 Erase 或 Outpainting 提供图像遮罩。
          tone: positive
        - id: wf4
          label: 运行 flow matching 推理
          detail: 在文本 + VLM 条件控制下，rectified flow Transformer 将噪声潜变量映射为图像潜变量；klein 变体靠 4 步蒸馏推理达到亚秒级延迟。
          tone: neutral
        - id: wf5
          label: 安全过滤器拦截（API 路径）
          detail: Hive 和 Microsoft 的推理时过滤器检查文本提示词、输入图像和输出图像中的 CSAM 和 NCII；命中标记即阻断生成。
          tone: warning
        - id: wf6
          label: 生成输出图像（最高 4MP）
          detail: 返回高分辨率图像；API 输出包含 C2PA 加密来源元数据；自托管输出可选包含像素层水印。
          tone: positive
        - id: wf7
          label: 下游使用或迭代
          detail: 用户下载图像、调用 generate_variations 生成替代方案、用 Edit 细化，或把输出作为参考图像送回下一轮生成。
          tone: positive
      edges:
        - from: wf1
          to: wf2
        - from: wf2
          to: wf3
        - from: wf3
          to: wf4
        - from: wf4
          to: wf5
        - from: wf5
          to: wf6
        - from: wf6
          to: wf7
    approximationNotes: 流程代表公开 API 和模型卡文档可观察到的工作流；BFL 内部基础设施细节未公开。
    claimRefs:
      - CE003
      - CE011
      - CE014
      - CE017
      - CE020
      - CE035
      - CE038
