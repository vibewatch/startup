  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释 / 尽调问题
    rows:
      - - BFL 的开放权重分发提升开发者黏性和自托管采用率
        - 开放 checkpoint 权重可由第三方自由再分发、微调、重新打包，限制 BFL 从自身发布中捕获价值的能力
        - 中
        - 要求 BFL 提供托管 API 收入组合与开放权重下载 / 使用遥测，判断开放分发实际转化为付费使用的比例
      - - 前沿模型质量是可防守的差异点
        - 独立基准（Artificial Analysis）显示，数十家厂商模型可直接比较且质量快速收敛，基础模型层正在商品化
        - 高
        - 跟踪 BFL 连续更新中的基准排名轨迹，而不是只看单次快照；要求提供与模型质量感知相关的流失 / 留存数据
      - - 既有创意套件难以追平前沿模型质量
        - Adobe、Canva、Figma 可把「足够好」的生成图像功能打包进买方已续费的订阅，以分发而非质量竞争
        - 高
        - 评估 BFL 可触达需求有多少已落在 Adobe/Canva/Figma 付费席位内，以及这些买方是否会转向独立供应商
      - - 企业买方看重 BFL 的零数据留存和专用端点企业层级
        - Adobe 推出竞争性的 IP 赔偿保证，Bria 主打全授权训练数据，二者都瞄准同一类企业信任 / 合规买方
        - 中
        - 对比企业交易中采购赢单 / 输单原因，特别区分 BFL 与 Adobe/Bria 的信任主张
      - - 生成图像厂商普遍可免受版权责任，因为模型不存储训练图像
        - >-
          Getty v. Stability AI 裁决仅限英国且范围很窄，而 Andersen v. Stability AI 和 Disney/Universal v. Midjourney 在美国仍未了结，2026 年 9
          月陪审团审判待定
        - 高
        - 围绕 Stability AI 与 Midjourney 面临的同类未决法律问题，尽调 BFL 自身训练数据来源和授权姿态
      - - Midjourney 零 VC、Discord 原生增长证明无需付费营销也能建立分发
        - 这种分发模式依赖特定社区平台动态，未必能迁移到 BFL 这类 API 优先、面向开发者 / 企业的厂商
        - 中
        - 评估 BFL 自身开发者社区渠道（Hugging Face、GitHub、Discord 如有）是否呈现可比的自然增长信号
      - - 视频生成收敛（Runway、OpenAI Sora、Google Veo）可能把静态图像生成并入更广的多模态平台
        - 本章审阅的 BFL 路线图和公开披露未显示其拥有 Runway 或 OpenAI 规模的原生视频生成产品
        - 高
        - 要求 BFL 提供视频生成路线图和时间表，并对照 Runway 的 Gen-4.5/GWM-1 与 OpenAI 的 Sora-2 发布
      - - Stability AI 2024 年濒临崩盘表明，即便知名开放模型厂商也可能面临生存级财务风险
        - BFL 自身资本充足性和资金可支撑期已在财务章节覆盖；本登记表提示，竞争对手困境并不保证 BFL 能顶住类似算力成本或融资市场压力
        - 中
        - 将 BFL 的烧钱速度和资金可支撑期（财务章节）与 2024 年几乎拖垮 Stability AI 的算力成本压力交叉核对
    notes: 严重性反映一个耐久性问题可能多大程度改变对 BFL 竞争位置的承销假设，而不是任何单一事件的发生概率。
