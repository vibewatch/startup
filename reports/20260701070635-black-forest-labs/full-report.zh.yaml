      - number: '5.3'
        title: 部署与集成：官方 Diffusers、ComfyUI 和 MCP 支持带来广泛生态触达——路线图正走向实时和智能体式工作流
        blocks:
          - type: paragraph
            body: >-
              BFL 对图像生成两大自托管工作流提供一等集成。Hugging Face Diffusers 通过 FluxPipeline、Flux2KleinPipeline 和 FluxKontextPipeline
              API 支持全部 FLUX.2 模型。ComfyUI 在 FLUX.2 发布当天就获得支持，BFL 和 NVIDIA 提供官方教程和预构建工作流模板；NVIDIA 还优化了 ComfyUI 的权重流式加载，让
              GeForce RTX GPU 可借助系统 RAM 卸载跑 FP8 FLUX.2 [dev] 推理。面向数据中心部署的 TensorRT 集成，则通过 NVIDIA Pytorch container
              提供。BFL MCP 服务器（mcp.bfl.ai）是一台托管的、只支持 OAuth 的远程服务器，把完整 FLUX.2 工具箱——文本生图、多参考图编辑、虚拟试穿、变体生成和历史浏览——暴露给任何 MCP
              兼容客户端。Claude Desktop、Claude.ai、Claude Code、Cursor、Codex、Windsurf，以及通过 mcp-remote 接入的 stdio-bridge
              客户端都受支持，公开 GitHub 仓库里还给出逐客户端设置说明。BFL 直接计费：OAuth 登录时选中的组织按标准 API 费率付费，没有中间商。API 本身文档完整，并有正式发布说明 页面；2026
              年关键里程碑包括 FLUX.2 [klein] 发布（2026 年 1 月，13–29 GB VRAM 下亚秒级生成）、FLUX.2 [pro] 速度提升 2×（2026 年 3 月，价格不变）、FLUX.2
              [flex] 速度提升 3×（2026 年 1 月）、FLUX Outpainting（2026 年 5 月）、FLUX Erase（2026 年 5 月）和 FLUX Virtual Try-On（2026 年
              5 月）。新的 outpainting fast mode 于 2026 年 6 月 9 日上线。发布节奏显示功能推进稳定，大约每月一个主要 endpoint 或性能升级。finetuning API 已在
              2025 年 10 月废弃；对已经基于它搭工作流的团队，这是一个缺口。API
              可靠性通过状态页（status.bfl.ai）跟踪；已审阅的发布说明中没有出现重大结构性故障，不过本次会话的直接探测无法抓取状态页本身。
