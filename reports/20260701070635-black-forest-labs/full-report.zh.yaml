      - number: '7.2'
        title: 监管和法律风险：EU AI Act GPAI 义务、未解决的 Grok/xAI deepfake 先例，以及全行业版权诉讼
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 的 Usage Policy 最后修订于 2025 年 4 月，明确禁止生成 CSAM 或非自愿露骨内容、生物识别 / 监控用途和政治竞选用途；其 Responsible AI
              Development Policy 描述了一套三阶段缓解流程，覆盖预训练、后训练和推理时，其中部分建立在 Internet Watch Foundation
              合作之上。这些缓解措施真实存在，并有独立佐证，但它们处在一个规模庞大且仍未定型的监管环境里。EU AI Act 第 53 条下的 GPAI 义务已于 2025 年 8 月 2 日适用于新模型，存量模型则需在
              2027 年 8 月 2 日前合规；自愿 GPAI Code of Practice 可为签署方提供符合性推定，但本章无法从一手来源确认 Black Forest Labs 是否已经签署——本次研究尝试核验
              European Commission 实时签署方页面时返回页面不存在，二级摘要也互相冲突。另一个问题是，EU AI Office 已根据 Article 53(1)(d)
              发布强制性公开训练数据摘要模板；Black Forest Labs 自己的 “Training Data Disclosure” 透明度页面存在，但没有证据确认它达到该模板要求的颗粒度。最尖锐的监管先例，是
              2026 年 Grok/xAI deepfake 和 CSAM 危机：截至 2026 年中，UK ICO 和 Ofcom、California Attorney
              General，以及至少六起美国和英国诉讼都在进行；UK GDPR 最高 £17.5M 或全球营业额 4% 的罚款风险也在场；一个核心且未决的法律问题是，当有害内容由 AI 自身生成时，Section 230
              是否保护 AI 公司——它可能为任何图像生成提供商确立直接责任先例。这一点与 Black Forest Labs 直接相关，因为围绕危机的报道称 Grok 图像生成器“基于 Flux.1 model
              的高度微调版本”，而 TechCrunch 2024 年报道早在 2026 年升级前数年，就已记录该关系带来的直接声誉外溢，尽管商业关系据报在 2025 年 4
              月前后已经结束。已审阅的诉讼或监管资料中，没有一个把 Black Forest Labs 直接列为被告。版权方面，图景复杂：Stability AI 于 2025 年 11 月在英国 Getty Images
              案中取得实质性胜利，但 Andersen v. Stability AI 仍在美国积极 discovery 阶段，审判日期为 2026 年 9 月；Disney/Universal v. Midjourney
              也仍在继续。因此，即便一个可比英国案件已对 AI 图像生成公司有利地解决，全行业训练数据诉讼风险仍未关闭。
