      - number: '4.2'
        title: 小团队运行 32-billion-parameter 模型：成本结构、算力强度和员工数
        blocks:
          - type: paragraph
            body: >-
              BFL 的成本底座由算力主导，而不是传统 SaaS 成本结构。其旗舰开放权重模型 FLUX.2 [dev] 是 32-billion-parameter rectified flow transformer；公司
              GitHub 仓库显示，速度更快的 klein 家族已于 2026 年 1 月 15 日发布——这说明它训练和发布新模型家族的节奏大约是每几个月一次，而非一年一次。CoreWeave 公开 GPU
              定价可作为该规模工作负载边际成本的有用外部参照：截至 2026 年 6 月，按需 H100 容量约为每 GPU-hour
              $2.70，这为一家大规模服务图像和视频生成的实验室训练和高容量推理可能有多依赖算力成本提供锚点。


              员工数证据显示，相对估值，BFL 是资本较轻的团队：截至 2026 年中，BFL 自有招聘页面和独立职位聚合器都描述一个约 10 到 200 人区间的团队，分布在 Freiburg 和 San
              Francisco；公司正在招聘研究基础设施工程师，基础薪资 $150,000-$300,000 加股权，负责多周 GPU 训练运行。若对照 Sacra 的 ~$96.3M
              收入估算，这样的员工数意味着人均收入远高于典型软件同业，不过仍低于 andrew.ooo 报道的 Midjourney 约 $3M/employee——后者自筹资金、无 VC；这提醒我们，BFL
              主要靠股权融资来的 $450M+ 资本买的是增长和算力容量，而自筹资金的同行不需要这么做。没有受检来源披露 BFL 毛利率或收入成本，因此无法把上述信息换算成实际利润率估算。
