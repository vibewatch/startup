      - number: '8.7'
        title: 论点失效触发器、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开证据中最清晰的投资论点失效触发器，是报道中约 $140M 的 Meta
              合同被确认流失、未续签或实质性重谈，因为这一单一关系可能占公司当前收入基础的很大一部分。第二个更直接的触发器，是任何确认的新融资轮定价等于或低于 $3.25B 的 Series B
              标记估值；截至运行日期，本章审阅的来源没有指出这种融资已经发生或正在被报道，也没有任何来源包含二级市场定价，或专门下修 Black Forest Labs
              自身估值的投资者评论。公司今天的退出准备度还无法成熟评估，因为单位经济未披露：公开证据中没有 IPO 准备迹象；按照本章负面宏观证据，基础模型公司的私募 M&A
              格局仍未稳定。最终尽调的最高优先级问题依次是：经审计的现金 / 烧钱 / 资金续航期数字、客户收入集中度拆分、按变现入口拆分的毛利率，以及 Series B 股权结构 /
              清算优先权条款——这四项在本次尽调的每一章中仍未披露。
