      - number: '5.2'
        title: >-
          架构与运行模型：FLUX.2 在 latent flow matching 框架中，把 32B rectified flow transformer 与 Mistral-3 24B VLM 耦合——原始全精度推理需要
          90 GB VRAM，但 FP8 量化让消费级 RTX 部署成为可能
        blocks:
          - type: paragraph
            body: >-
              FLUX.2 建在 latent flow matching 架构上，训练的是从噪声 latent 到干净图像 latent 的映射，并由文本条件驱动。生成主干是一套 32B 参数 rectified flow
              transformer，负责捕捉空间结构、材质属性、光照和构图逻辑。语义落地和世界知识来自 Mistral-3 24B 视觉语言模型，它通过共享条件机制与 transformer 耦合。新发布的 FLUX.2
              变分自编码器（VAE）采用 Apache-2.0 许可，定义所有模型变体共用的 latent 空间，目标是破解可学习性、质量和压缩之间的三难：它比 FLUX.1 和 Stable Diffusion
              autoencoder 拿到更低的 LPIPS 失真，同时提升生成 FID。FLUX.2 用一个检查点统一文本生图、图像编辑和多参考图合成，省掉了拆分模型的需求。编辑时，图像 latent
              从输入图像初始化，再沿同一套 flow 过程更新，以保住结构。FLUX.2 [klein] 子家族（4B 和 9B 参数模型）由 FLUX.2 基座模型做步骤蒸馏，做到四步推理，目标是亚秒级生成。9B 版本使用
              8B Qwen3 文本嵌入器，FP16 下约需 29 GB VRAM，FP8 量化后约需 15 GB VRAM；4B 版本约需 13 GB VRAM，可在中端消费级 NVIDIA RTX GPU 上运行。全精度
              FLUX.2 [dev] 推理需要 90 GB VRAM，低 VRAM 模式降到 64 GB；BFL 与 NVIDIA、ComfyUI 联合做出的 FP8 量化 pipeline 可进一步降到约 18–24
              GB。NVIDIA 记录的 FP8 量化效果是 VRAM 下降 40%、性能提升 40%。部署模式包括 BFL 托管 API（托管 endpoint）、用 BFL 参考推理代码或 Diffusers
              FluxPipeline 做本地自托管、ComfyUI 原生 FLUX.2 模板配合权重流式加载，以及通过 NVIDIA Pytorch container 跑 TensorRT 推理。第三方
              marketplace 推理可用 FAL.ai、Replicate、Together AI、Runware、Verda、Cloudflare Workers 和 DeepInfra。MCP
              服务器（mcp.bfl.ai）让 Claude、Cursor、Codex、Windsurf 以及任何 MCP 兼容客户端在 OAuth 认证后直接生成图像，不需要管理 API key。
