      - number: '6.3'
        title: 采用轨迹：分销触达很广，用量深度披露很薄
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 披露的采用信号，精确度差异很大。最模糊的一端，是企业页声称 managed API “每年已经支撑数十亿次图像生成”，但没有精确数字、增长率或客户拆分。Together AI
              称 FLUX.2 可触达其 “1M+” 开发者；这衡量的是平台曝光，而不是已确认的 FLUX 用量或付费账户。Civitai 的 FLUX.1 [dev] checkpoint 页面显示大型互动计数（344.6k
              和 140.2m，另有 22,673 条评价、评级为“好评如潮”），方向上可观，但抽取页面文本没有明确标注它们是下载还是浏览，所以应把它们视作近似的社区触达信号，而非精确
              KPI。唯一真正量化的采用数据点——Envato 的约 25% FLUX 图像生成量份额和累计 51M+ 张图像——来自 BFL 发布的单一案例研究，尚未独立审计。二级财经报道还给出 ARR 数字（截至 2025
              年 8 月为 $96.3M，并预计 FY2026 达到 $300M）以及 Adobe、Canva、Snap 和 Meta 合计约 $300M
