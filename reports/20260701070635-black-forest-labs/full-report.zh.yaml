  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Black Forest Labs 主要风险类别如何传导到收入耐久性、利润率、合规成本、声誉以及估值 / 融资通道。
    data:
      nodes:
        - id: t1
          label: EU AI Act / GPAI 监管风险
          detail: 第 53 条的透明度、版权和安全义务。
          tone: warning
        - id: t2
          label: 深度伪造 / CSAM 技术谱系风险
          detail: Grok 深度伪造争议中的 FLUX.1 技术谱系。
          tone: negative
        - id: t3
          label: 版权 / IP 诉讼外溢
          detail: 全行业 AI 训练数据诉讼（Getty、Andersen、Disney/Universal）。
          tone: warning
        - id: t4
          label: 客户集中度（Meta）
          detail: 据报道约 $140M 合同，对比约 $96M FY2025 ARR。
          tone: negative
        - id: t5
          label: 算力 / 云依赖
          detail: 托管 API 的 GPU / 云供应商未披露。
          tone: warning
        - id: t6
          label: 开放权重许可模糊性
          detail: FLUX.1 Kontext 非商业许可证引发社区争议。
          tone: neutral
        - id: t7
          label: 竞争商品化
          detail: Google Nano Banana 2 与开放权重追赶。
          tone: neutral
        - id: t8
          label: 合规与法律成本
          detail: 法务、信任与安全、补救支出。
          tone: warning
        - id: t9
          label: 收入耐久性
          detail: 来自企业和 API 客户的经常性收入。
          tone: positive
        - id: t10
          label: 利润率结构
          detail: 毛利率承受算力成本和定价压力。
          tone: warning
        - id: t11
          label: 声誉信任
          detail: 企业和创意行业对 FLUX 品牌的信任。
          tone: warning
        - id: t12
          label: 估值与融资通道
          detail: 以不低于 $3.25B Series B 标记完成后续融资的可行性。
          tone: negative
      edges:
