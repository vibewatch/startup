        - 拿到现金 / 烧钱 / 跑道、客户集中度细节、毛利率和股权结构条款之前，不要投入新资金；持续跟踪业务，并监控是否出现有定价的后续融资轮。
      - - 跟踪（如果研究访问被拒）
        - 中
        - 高
        - 鉴于约 34x 倍数，而可比公司区间从约 0.5x（Shutterstock）到约 59x（Runway），估值可能偏高
        - 如果无法直接尽调，监控公开可比公司、诉讼状态和任何新融资事件，作为估值信号。
    notes: 这是作者截至 2026 年 7 月运行日期基于证据的建议，不是任何银行、基金或评级机构披露的评级。
