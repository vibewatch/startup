      - number: '3.4'
        title: 切换成本、锁定效应、多归属与分发权力
        blocks:
          - type: paragraph
            body: >-
              不同竞品类别的切换成本和锁定效应差异很大。BFL 的开放权重授权降低了自托管企业的切换成本，因为已经在自有基础设施上运行 FLUX 的被授权方，比锁在封闭、仅 API
              竞品专有格式里的客户迁移摩擦更小。开发者在图像模型供应商之间多归属也相对容易：第三方推理市场和 Artificial Analysis
              这类独立基准网站，让买方用不高的集成成本切换或混用模型，不像按席位锁定的现有套件。Adobe、Canva 和 Figma 制造了相反动态——通过席位制套件订阅形成结构性锁定；离开 Firefly、Magic
              Media 或 Figma AI，通常意味着离开底层设计工具本身，而不只是 AI 功能。分发权力同样不均。Midjourney 借 Discord 原生增长建立了据报道 21M 成员社区，且没有付费营销支出；对于
              BFL 这类 API 优先供应商，除非做出等价消费者社区产品，否则很难复制这条护城河。Runway 与 Getty Images 和 Lionsgate 围绕授权内容定制模型的战略合作，以及与 CoreWeave
              围绕下一代 GPU 容量的基础设施合作，展示了一种供应 / 伙伴访问优势——锁定内容授权加专用算力——较小开放权重供应商否则必须自己拼出来。OpenAI 借 ChatGPT 消费者安装基础和 Microsoft
              企业销售渠道触达一批从未明确评估图像生成供应商的客户；这是 BFL 以及多数其他被画像的纯图像模型竞品目前都没有的渠道权力优势。
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
      - number: '3.5'
        title: 护城河耐久性、商品化 / 替代风险与竞品反向证据
        blocks:
          - type: paragraph
            body: >-
              这个品类的竞争耐久性看起来脆弱，远未尘埃落定，原因有三条正在汇合。第一，模型质量正在快速商品化：覆盖数十家供应商的独立基准，同时削弱任何单一供应商只靠模型质量宣称长期护城河的能力；BFL
              自己的开放权重模型也是双刃剑，它推动开发者采用，却能被第三方在 Hugging Face 和 Civitai 上自由再分发、再包装。第二，现有创意套件供应商带来持久的分发型替代风险，因为 Adobe、Canva
              和 Figma
              能把「足够好」的生成式图像功能打包进买方已经续费的订阅，无需在模型质量上取胜。第三，也是最实质性的反向点，生成式图像版权诉讼仍是整个竞品集合尚未解决的品类风险，而不是已稳定计入经营成本的事项。Stability
              AI 在英国 Getty Images v. Stability AI 判决（2025 年 11
              月）的核心版权问题上胜诉，但胜诉理由很窄，只针对模型权重如何存储信息；法院还认定存在有限的历史商标侵权。在美国，Andersen v. Stability AI——被告包括 Stability
              AI、Midjourney、DeviantArt 和 Runway——仍未解决，jury trial 安排在 2026 年 9 月；Disney 和 NBCUniversal 2025 年 6 月针对
              Midjourney 的诉讼（后来 Warner Bros. Discovery 加入）也处于私下调解，而非已有公开判决。Stability AI 自身 2024 年接近崩盘——创始人辞职、据报道季度亏损超过
              $30M，以及后续债务重组式扭转——进一步说明，即便是知名供应商，品类内竞争位置也可能迅速恶化；尽调 BFL 时，应把 Financials 章节记录的同类算力成本压力拿来检验其资本充足性。
