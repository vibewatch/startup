  - id: FE004
    title: 产品成熟度 / 能力地图
    type: matrix
    layout: wide
    summary: FLUX.2 [pro/max] 在质量和生产就绪度上得分最高，FLUX.2 [klein] 4B 领先开放性和实时部署；相对 Google Nano Banana Pro，所有变体在文本渲染和世界知识上都是稳定弱点。
    data:
