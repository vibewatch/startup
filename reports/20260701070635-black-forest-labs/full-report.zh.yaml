      - number: '8.3'
        title: 可比估值图谱：0.5x 到 59x 的跨度，没有稳定锚点
        blocks:
          - type: paragraph
            body: >-
              本章抓取了 2026 年当前六个可比对象的数字，覆盖上市 incumbent 和私有 peer。Adobe 的市值 在 2026 年 7 月 1 日约为 $81.5 billion，过去一年下跌约 51%；但其
              FY2025 10-K 没有拆分 Firefly 专属收入，因此很难作为干净的单产品可比。Shutterstock 的市值约 $512.5 million，对应 FY2025 revenue $989.9
              million，隐含上市收入倍数只有约 0.5x——与 Black Forest Labs 自身约 34x 私有估值形成强烈反差。私有侧，Runway $5.3 billion 估值对应约 $90 million
              年化收入，隐含约 59x，说明至少一个融资充足的相邻 peer 定价比 Black Forest Labs 还贵。Midjourney、Stability AI 和 Ideogram
              都缺少足够近期、可作为可辩护倍数锚点的一手估值事件：Midjourney 完全没有融资轮，Stability AI 估值估计随来源不同在约 $1 billion 到 $2.8 billion
              之间，Ideogram 最近的公开财务参考点也已约两年过时。诚实的结论是，到 2026 年中，这组可比对象不存在单一稳定倍数；因此，不应只靠 comps 给 Black Forest Labs
              断言一个精确公允价值数字。
