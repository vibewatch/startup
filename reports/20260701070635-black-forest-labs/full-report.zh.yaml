      - number: '3.3'
        title: 能力、定价、GTM / 分发与信任 / 监管对比
        blocks:
          - type: paragraph
            body: >-
              BFL 是这个集合里少数同时交付真实开放权重检查点和托管 API 的供应商之一；在被画像竞品中，只有 Stability AI 也在旗舰规模这样做，Midjourney、Ideogram、Adobe
              Firefly 和 Runway 则都把旗舰模型完全封闭。Artificial Analysis 排行榜上由非供应商撰写的独立基准，把 FLUX.2 变体与 GPT Image 2、Ideogram
              3.0、Recraft V4.1 和 Seedream 5.0 直接放在一起，为买方提供了不依赖任何单一供应商营销说法的中立能力对比。定价模式的差异是结构性的，不只是数字不同：Midjourney 和
              Ideogram 卖固定月费消费者订阅，Stability AI、Recraft 和 BFL 自己按点数或按 megapixel API 计价，OpenAI 把按 token API 定价与 ChatGPT
              席位捆绑混用，Adobe Firefly 则把消耗点数打包进 Creative Cloud 或议价 Enterprise 附加包。分发上，Adobe、Canva 和 Figma
              主要靠嵌入买方已经续费的套件工作流竞争，而不是靠前沿模型质量；OpenAI 和 Google 则能把图像生成捆绑进已有分发的聊天和生产力产品——这是只做 API / 开放权重的 BFL
              不具备的渠道权力。信任和合规上，Adobe 是唯一公开营销捆绑 IP 赔偿保证的被画像竞品；新兴 Content
              Credentials（C2PA）来源追踪标准正在成为行业级信任基准，其重要性正逐渐与供应商专属赔偿方案并列，甚至取代后者。
