  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入增长继续向 Runway 约 $90M 或 Midjourney 约 $500M 规模靠近；企业合同（Meta、Adobe、Canva、Snap）续约；私募市场对基础模型公司的风险偏好延续。
        - 收入基数扩大后，倍数维持在约 34x 附近或进一步扩张，支撑下一轮按 $3.25B 或更高估值融资。
        - 需要收入执行到位，也需要私募市场继续愿意为 AI 时代倍数买单。
        - 弱到中：没有披露的 2026 年增长数据确认这条轨迹已启动。
      - - 基准
        - 收入增长，但倍数向 2026 年更广泛、更谨慎的私募 AI 市场均值压缩。
        - 若收入增长足以抵消倍数压缩，下一轮可在更低倍数下给出相近或温和更高的绝对估值。
        - 如果收入增长低于预期，即便压缩的是倍数，估值也可能明显降低。
        - 中：与本章 CNBC / Perspective Labs / GeekWire 关于泡沫怀疑的证据一致。
      - - 悲观
        - 据报的 Meta 合同未续约或被下调重谈；FLUX 基准商品化继续；更广泛的 down round 压力（PitchBook 的 220+ 家跌落独角兽）蔓延到 AI-native 私有公司。
        - 低于 $3.25B Series B 标记的 down round，或条款更差的桥轮 / 延长期融资。
        - 客户集中风险叠加全行业重估，可能相互放大，而不是相互抵消。
        - 中：按 CNBC/PitchBook，down-round 先例已在创投市场广泛出现，但尚未具体落到 BFL。
    notes: 概率信号是作者对本章证据的定性综合，不是披露或建模后的概率分布。
