      - number: '6.5'
        title: 扩张和集中度：marketplace 广度是一把双刃剑，少数大单可能主导收入
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 的分销策略——开放权重加上 fal.ai、Replicate、Together AI 和 Runware 的 marketplace
              上架——是高效的先落地再扩张引擎，能扩大开发者触达；但这也意味着相当一部分用量流经公司无法完全控制、且未披露收入分成 条款的渠道。在规模谱系另一端，企业 co-development
              档位把商业价值集中到少数大型定制交易中：如果报道数字准确，单一个 Meta 合同（两年约 $140M）就相当于 Black Forest Labs 2025 年 8 月据报约 $96.3M ARR 的约
              145%——也就是说，一个账户的收入量级可能接近公司此前整个收入运行率。通过大型科技平台（Azure AI
              Foundry、Meta、Mistral）分发能扩大触达，但如果这些伙伴自建竞争性内部模型，也会带来被绕开的风险。采购摩擦在开放权重社区内部已经可见：Hugging Face 反复出现的讨论帖和一篇 BigGo
              News 报道都描述了围绕 FLUX.1 [dev] Non-Commercial License 下何为商业用途的困惑和“商业壁垒”；用户需要另走一个独立自助付费许可步骤，而这对初次用户并不明显。最后，公司与
              xAI/Grok 的历史显示，客户集中风险不只是财务问题：一段有争议的单一客户关系，即使商业关系结束，也会给品牌留下持续的声誉和监管暴露。
