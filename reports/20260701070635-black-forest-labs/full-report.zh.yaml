      - number: '4.3'
        title: 资本充足性和融资依赖：资金充足但现金跑道不透明
        blocks:
          - type: paragraph
            body: >-
              BFL 于 2025 年 12 月完成 $300M Series B，投后估值 $3.25B，由 Salesforce Ventures 和 Anjney Midha 的 AMP
              共同领投；该轮也追溯披露了此前未公开、由 Andreessen Horowitz 领投的 2024 年约 $31M Series A。已披露累计融资现已超过
              $450M，投资团包括多家战略企业投资者——NVIDIA、Adobe Ventures、Canva、Figma Ventures、Samsung NEXT 和 Shutterstock——其中数家也是 BFL
              商业客户，让股权结构表激励与产品采用对齐。第三方报道称 Series B 资金将用于 FLUX 模型开发、算力基础设施和商业运营，但本章研究没有发现任何来源发布该描述背后的具体预算分配或烧钱计划。


              真正未披露的是承销意义上的资本充足性：没有受检来源说明 BFL 手头现金、月度烧钱速度或由此得到的现金跑道（月数），也没有披露任何债务设施、项目融资安排或 GPU
              租赁义务；这些都可能在下行情景中排在股权之前。Series B 相关的董事会构成、股权结构表细节、清算优先权或债务契约也无人披露。考虑到 BFL
              自己的模型发布显示出吃算力的多月训练节奏，烧钱和现金跑道数据缺失，是本章最大的单一资本充足性缺口，不能仅靠融资标题自信推断。
