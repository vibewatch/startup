  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Midjourney
        - 直接模型级竞争对手（消费者订阅）
        - ~$500M 2025 收入，~163 名员工，VC 融资 $0
        - 个人创作者、爱好者、自由职业者
        - Discord 原生分发、无免费层级，据报道在消费者工具中市场份额最高
        - 无开放权重、不可自托管、API 面封闭
      - - Stability AI
        - 直接模型级竞争对手（开放 + API）
        - 2024 收入估计 ~$50M，累计融资 ~$225M；2024 领导层 / 财务危机后已趋稳
        - 希望自托管开放模型的开发者和企业
        - 开放权重 Stable Diffusion 系列、SOC 2 / SOC 3 企业层级、EA 共同开发协议
        - 曾陷财务困境且创始人离职；企业信任仍在重建
      - - OpenAI（GPT Image）
        - 直接模型级竞争对手（捆绑 + API）
        - 背靠 OpenAI 更大的 ChatGPT / API 分发规模
        - 已在 ChatGPT / API 生态内的消费者和开发者
        - 捆绑进 ChatGPT Business / Enterprise 席位，同时提供按 token 定价的独立 API
        - 单图成本口径混合了不同模型代际的 token 定价，较难直接比较
      - - Adobe Firefly
        - 既有 / 相邻竞争对手（嵌入式套件）
        - Adobe Creative Cloud 规模；Firefly 可独立销售也可捆绑
        - 既有 Creative Cloud / 企业设计团队
        - IP 赔偿、Content Credentials 来源证明、ETLA 捆绑杠杆
        - 点数超额成本常超预算；赔偿范围 / 条件因合同而异
      - - Ideogram
        - 直接模型级竞争对手（消费者订阅）
        - $22.3M 种子轮后，于 Feb 2024 完成 $80M Series A；a16z 领投
        - 需要强文字入图渲染的专业消费者和开发者
        - 文字渲染准确率强，Free / Plus 分层订阅类似 Midjourney
        - 融资规模和披露收入小于 Midjourney 或 Runway
      - - Runway
        - 相邻竞争对手（视频优先，正扩展到世界模型）
        - Feb 2026 以 $5.3B 估值完成 $315M Series E；累计融资 ~$1.05B；2025 年化收入 ~$90M
        - 电影人、创意工作室、企业媒体团队
        - Artificial Analysis 文生视频基准 No.1；Getty / Lionsgate 授权内容合作
        - 历史上因算力 / 训练成本产生大额 EBITDA 亏损；视频优先，并非静态图像的直接替代
      - - Bria
        - 替代 / 垂直竞争对手（企业、授权数据）
        - Mar 2025 完成 $40M Series B，累计融资 $65M
        - 需要完整授权、IP 安全训练数据的企业
        - 来自 30+ 合作伙伴（Getty、Envato、Alamy）的授权数据，专利归因 / 补偿引擎
        - 融资和公开规模小于 Stability AI、Runway 或 OpenAI
      - - Recraft
        - 替代 / 垂直竞争对手（矢量 / 品牌资产）
        - 第三方报道称，2024 完成 $12M Series A + 2025 完成 $30M Series B；据报道用户 4M+
        - 需要矢量、插画和品牌一致资产的品牌 / 设计团队
        - 相比通用照片级真实感，矢量 / 插画生成是差异化垂直场景
        - 用例窄于通用照片级真实图像模型
      - - Canva / Figma AI
        - 既有 / 相邻竞争对手（嵌入式套件）
        - Canva 和 Figma 既有设计平台席位基础
        - 既有 Canva / Figma 设计工具订阅者
        - 嵌入买方日常使用工具，几乎零摩擦；捆绑 AI 点数额度
        - 生成图像质量和控制深度通常落后于专用模型供应商
      - - 内部自建（自托管开放权重，包括 FLUX / Stable Diffusion）
        - 现状 / 替代方案
        - 除算力外无供应商锁定成本；需要内部 ML 能力
        - 已有 ML / 基础设施团队且有数据主权需求的企业
        - 完全控制模型、数据和部署；避开按次 API 费用
        - 需要 GPU 基础设施、ML 工程投入和持续维护；这些原本由 BFL / 其他供应商承担
    notes: >-
      融资 / 收入数字混合了官方披露、独立分析师估计（Sacra）和风险融资新闻报道；第三方估计应视为方向性参考， 而非审计数字。各行覆盖本章已审阅证据中可见的直接、既有、相邻、替代和现状 / 内部自建类别，
      并非该品类里的每一个部门级工具。
