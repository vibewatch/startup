  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              BFL 通过三条纳入支出范围的渠道，将生成式视觉智能变现：按生成量计费的托管 API，按输出 megapixel 计价（每张图 $0.014 到 $0.07）；开放权重授权，让企业在自有基础设施上微调并自托管
              FLUX；以及面向具体任务的端点——outpainting、erase、virtual try-on——把模型家族延展到商品目录影像等专门商业工作流。第三方市场（fal.ai、Replicate、Together
              AI）转售托管访问，部分捕捉 BFL 触达面，但不能让 BFL 获得完整零售价。边界之外有两个巨大的相邻支出池，本章刻意排除：现有创意软件订阅（Adobe Firefly、Canva Magic
              Media、Figma AI）把生成式图像功能嵌入既有席位授权，而不是把支出导向 BFL；以及 Midjourney 式月费方案等封闭专有消费者订阅。Ideogram 和 Runway
              是相邻的维持现状替代方案——前者是开放式竞品图像模型，后者是视频优先生成模型——买方可以选择它们来替代 FLUX，或与 FLUX 并用。上游 GPU
              和算力成本是供应侧投入，不是买方侧市场支出，因此同样排除在本章需求侧边界之外。
