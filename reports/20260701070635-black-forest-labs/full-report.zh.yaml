            body: >-
              独立分析师估计 Black Forest Labs 2025 年 annualized revenue 约为 $96-96.3M，而单个据报 Meta 合同整个期限价值约
              $140M——按其中一篇报道，结构是第一年 $35M、第二年 $105M——这意味着，如果报道准确，一个客户关系的价值可能超过公司整个上一年收入基数；Meta 和 Black Forest Labs
              都未公开确认交易条款。算力供应商集中度是第二个不那么显眼的依赖：已审阅来源 中没有一个识别出公司托管 Managed API 背后的具体云或 GPU 供应商，因此合约条款和容量风险无法验证。公司与 xAI
              的既往关系又带来第三种不寻常的依赖——即使底层商业关系据报在 2025 年 4 月前后结束，这种依赖仍然存在，因为持续进行的 Grok deepfake 诉讼仍把该产品描述为基于微调 FLUX.1 model，让
              Black Forest Labs 的名字继续挂在一个它已不再商业参与的活跃监管争议上。分销依赖更分散：开放权重触达依靠 Hugging Face、GitHub 和 Civitai，加上产品技术 章节讨论的商业
              marketplaces，把单一平台风险分散到多个渠道。资本侧，2025 年 12 月 Series B 由一个小型投资团 领投 / 参与（公司概览章节列出 a16z、General
              Catalyst、NVIDIA、Salesforce Ventures、Temasek 等）；a16z 自己给该公司的招聘列表仍显示 Series A 时期语言，说明公开投资者文档滞后于当前轮次。最后，Black
