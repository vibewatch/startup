  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户图谱：区分付费客户、分销伙伴、投资方和开源用户
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 的客户基础至少横跨七个容易混淆的群体：把 FLUX 嵌作后端的创意 SaaS
              平台（Envato、Freepik/Magnific、Picsart）；许可定制微调模型的企业品牌和电信营销团队（Deutsche Telekom）；在自家竞争产品里交付 FLUX 驱动功能的 AI
              assistant 厂商（Mistral AI 的 Le Chat）；据称直接许可该技术的大型科技平台（Meta）；marketplace/API
              分销伙伴，其自身开发者才是真正按用量付费者（fal.ai、Replicate、Together AI、Runware）；从 Hugging Face 和 Civitai 下载权重的大型非付费开源 /
              开发者社区；以及一小批个人创意专业人士和工作室（Martin Scorsese、Apostle），其价值更多是声誉而非财务。Black Forest Labs
              自己的企业页为付费群体正式划出三个商业档位——Managed API（零数据保留、200K generations/month
              起量价）、Self-hosted（on-prem/private-cloud，完整数据主权）和 Co-development（定制模型、专用基础设施、white-labeled
              UI）——大致对应更高单笔交易规模和更少买方数量。尽调时关键细节是，部分名字可能同时扮演多个角色：Canva 和 Figma Ventures 是同一轮 Series B 投资方，而公告又单独称 Canva
              是“基于” BFL 模型的产品伙伴，意味着至少一个 logo 模糊了资本提供方和客户之间的边界。
