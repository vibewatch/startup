      - number: '2.2'
        title: 多口径市场规模测算
        blocks:
          - type: paragraph
            body: >-
              没有一个已发布数字能安全定义这个市场。本章直接审阅的五个分析口径，对最接近可比年份的估算相差约 19 倍：Fortune Business Insights 将狭义、独立 AI 图像生成工具类别估为 2026 年
              $484.29M，并以 17.40% CAGR 增至 2034 年 $1.75B；Grand View Research 和 Research and Markets 的范围接近同一狭义口径，分别为
              $349.6M（2023）和 $0.51B（2026）；SkyQuest 用中等范围定义估算 2024 年 $2.39B；Market.us 经 Axis Intelligence Research
              引用，把完整生态——工具、API、编辑和企业视觉流水线——估为 2025 年 $9.1B，并预计到 2035 年达 $272.8B，CAGR 为 40.5%。跨所有模态的更广义生成式 AI 市场在 2025 年约
              $59B，企业生成式 AI 整体支出约 $37B，为图像专用工具之外给出需求侧上限背景。2025 年报告显示北美约占 40% 收入份额，Asia-Pacific 被称为增长最快地区。五个口径没有任何一个拆出
              BFL 自身收入或单量份额，因此本章保留完整区间，而不是把某个数字当作事实锚点。
