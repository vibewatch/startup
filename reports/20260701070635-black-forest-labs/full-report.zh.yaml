  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从披露规模和证据点，经过未解决的财务与宏观风险，推导到继续研究的建议。
    data:
      nodes:
        - id: n1
          label: 已披露规模与证据
          detail: 约 $96.3M 估算收入、4 个变现面、具名企业标识
          tone: positive
        - id: n2
          label: 可比公司组
          detail: Adobe、Shutterstock、Runway、Midjourney、Stability AI、Ideogram 覆盖 0.5x–59x
          tone: neutral
        - id: n3
          label: 客户集中风险
          detail: 据报道约 $140M 的 Meta 合同可能超过上一年收入
          tone: negative
        - id: n4
          label: 未披露财务输入
          detail: 未披露现金、烧钱速度、资金续航期、毛利率或股权结构
          tone: negative
        - id: n5
          label: 2026 年宏观 AI 估值怀疑
          detail: 独角兽倒下、ROI 失败率、token 价格战
          tone: negative
        - id: n6
          label: 没有 DCF 可支撑的公允价值
          detail: 关键输入缺失，无法给出站得住脚的贴现现金流结果
          tone: warning
        - id: n7
          label: 建议：继续研究
          detail: 中等置信度、高风险评级、估值立场未解决
          tone: warning
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
        - from: n6
          to: n7
    approximationNotes: 节点色调和整体链条是作者对本章证据的综合，不是披露的评分模型。
    claimRefs:
      - CV043
      - CV044
      - CV004
      - CV037
  - id: FV002
    title: 估值对收入倍数假设的敏感性
    type: bar
    layout: standard
    summary: 在约 $96.3M 估算收入基数下，按本章可比公司组覆盖的一系列收入倍数，推算 Black Forest Labs 估值。
    data:
      items:
        - label: 按 Shutterstock 约 0.5x 公开市场倍数
          value: 48
          unit: USD millions
          tone: negative
        - label: 按 Ideogram 约 10x（过时的 2024 年）倍数
          value: 963
          unit: USD millions
          tone: warning
        - label: 按 Midjourney 聚合口径隐含约 6–12x 的中点（9x）
          value: 867
          unit: USD millions
          tone: warning
        - label: 按 Black Forest Labs 自身隐含约 34x
          value: 3250
          unit: USD millions
          tone: neutral
        - label: 按 Runway 约 59x 私募市场倍数
          value: 5682
          unit: USD millions
          tone: positive
    approximationNotes: 每根柱都按收入倍数乘以约 $96.3M 的第三方收入估算来重算估值，收入固定、只改变倍数，以隔离倍数假设这个单一敏感性驱动因素。数值是示意性重算，不是已披露或预测估值。
    claimRefs:
      - CV003
      - CV011
      - CV015
      - CV023
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 围绕当前 $3.25B Series B 标记，给出 Black Forest Labs 下一轮融资事件的熊 / 基准 / 牛三档估值区间。
    data:
      items:
        - label: 悲观情形
          low: 1500
          high: 2600
          unit: USD millions
          detail: Meta 合同流失 / 重谈叠加 AI 估值整体重定价，触发降价轮。
          tone: negative
        - label: 基准情形
          low: 2800
          high: 3600
          unit: USD millions
          detail: 收入温和增长，被私募市场倍数继续压缩抵消。
          tone: neutral
        - label: 乐观情形
          low: 3600
          high: 5500
          unit: USD millions
          detail: 收入向 Midjourney / Runway 规模靠拢，倍数维持在当前约 34x 附近或以上。
          tone: positive
    approximationNotes: 区间是作者基于本章牛 / 基准 / 熊假设构造的示意性情景边界，不是公司预测或第三方目标价。
    claimRefs:
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向 IC 的评分，覆盖市场、证据、护城河、经济性、风险、估值和证据质量等维度。
    data:
      items:
        - label: 市场机会
          value: 7/10
          detail: 市场大，但按市场分析章节，规模测算口径相差 19x。
          tone: neutral
        - label: 商业证据
          value: 6/10
          detail: 一个量化参考（Envato），加上几个只有标识或未确认的账户。
          tone: warning
        - label: 护城河 / 差异化
          value: 5/10
          detail: 相对 Nano Banana 2 的基准表现显示商品化压力，抵消开放权重分发护城河。
          tone: warning
        - label: 单位经济可见度
          value: 2/10
          detail: 未披露毛利率、烧钱速度或同期群 ARR。
          tone: negative
        - label: 风险评级
          value: High
          detail: 风险章节显示客户集中、监管悬而未决和技术谱系暴露。
          tone: negative
        - label: 估值支撑
          value: 4/10
          detail: 34x 隐含倍数落在 0.5x–59x 的宽可比区间内，且没有 DCF 托底。
          tone: warning
        - label: 证据质量
          value: 6/10
          detail: 本章覆盖 27 个域名的 34 个来源，但核心收入和估值数字仍是第三方估算。
          tone: neutral
    approximationNotes: 评分是作者为 IC 讨论做出的 0–10（或类别）定性综合，不是披露或审计过的评分框架。
    claimRefs:
      - CV002
      - CV036
      - CV044
      - CV005
