      - number: '8.4'
        title: 不利宏观环境：泡沫怀疑、down-round 先例和企业 ROI 疑虑
        blocks:
          - type: paragraph
            body: >-
              几个彼此独立的 2026 年信号都指向同一件事：任何生成式 AI 估值都应打风险折价，Black Forest Labs 也不例外。Forbes 2026 年 6 月报道称，企业开始反弹 AI
              成本，推动基础模型实验室陷入新一轮 token 价格战——例如 Uber 在四个月内耗尽 2026 年 AI 编码预算后，将每名工程师的 AI 工具支出封顶在每月 $1,500；这种压力可能普遍压缩 AI
              供应链利润率。CNBC 2026 年 6 月报道，PitchBook 数据将 220 多家曾经估值超过 $1B 的美国初创公司列为「陨落独角兽」；2021 年批次公司平均估值低 68%，2022 年批次低
              52%，说明风投支持的科技公司普遍存在下轮降价融资风险，尽管 CNBC 自身信源也显示，AI-native 公司面临的这类压力相对小于「pre-AI」公司。另一个需求侧风险同样直接触及 Black Forest
              Labs 的企业 API 和授权收入线：CIO 与 Axis Intelligence 都引用 MIT 发现，95% 的企业生成式 AI
              项目在六个月内未能体现可衡量的财务回报，项目放弃率也在上升。上述证据都没有点名 Black Forest Labs，因此本章将其视作推断出来的行业层面风险，而不是公司特有风险。
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
