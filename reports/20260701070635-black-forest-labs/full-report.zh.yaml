  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争图谱：直接、现有、相邻、替代与维持现状选项
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 不是在一个同质化竞品集合中竞争，而是面对五类不同替代选项。直接模型级竞品通过自己的托管 API
              或消费者产品出售可比的文生图（并且越来越多扩展到视频）生成能力：Midjourney 的封闭消费者订阅，Stability AI 的开放权重 Stable Diffusion 家族，Ideogram
              聚焦文字渲染的平台，以及捆绑进 ChatGPT 和 OpenAI API 的 OpenAI GPT Image
              模型。现有和相邻竞品通过另一条路径解决同一终端用户任务：把生成式图像功能嵌入买方已经付费的创意软件订阅，如 Creative Cloud 里的 Adobe Firefly、Canva 设计平台里的 AI
              图像生成器、Figma 按席位计价里的 Figma AI。Runway 更适合视为相邻、视频优先竞品，其路线图正扩展到通用「world models」，与 BFL 静态图像 API
              业务有重叠但不完全重复。Bria 和 Recraft 占据更窄替代利基——分别是完全授权的企业训练数据，以及矢量 / 品牌资产生成——它们争夺特定买方细分，而非整个市场。最后，对具备内部 ML
              能力且愿意自托管而非按 API 调用付费的企业来说，使用开放权重检查点（包括 BFL 自己的 FLUX 权重或 Stable Diffusion）内部搭建，仍是可行的维持现状替代方案。OpenAI、Google
              和 Meta 这类基础模型巨头，是最可信的未来进入者或规模威胁，因为它们能以接近零的增量获客成本，把图像生成捆绑进已有分发的消费者和企业产品。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 竞品画像：规模、融资、目标客户、产品范围与战略方向
        blocks:
          - type: paragraph
            body: >-
              九家被画像的竞品横跨很宽的规模和资本结构。Midjourney 是最清楚的离群点：2025 年估算收入 $500M，约 163 名员工，未融资，完全靠四档 $10-$120/月的消费者订阅供血。Stability
              AI 位于资本历史的另一端——创立以来融资约 $225M，2024 年估算收入 $50M，并经历严重的 2024 年财务和领导层危机；随后新 CEO 和新融资让运营稳定下来。Runway
              是资金最充足的相邻竞品，2026 年 2 月完成 $315M Series E，估值 $5.3B（总融资接近 $1.05B），收入从约 $44M（2024）向公司预测的 2025 年底 $265M-$300M
              扩张。Ideogram（2024 年 2 月 $80M Series A）和 Bria（2025 年 3 月 $40M Series B，总融资
              $65M）规模更小，但资本充足，分别押注文字渲染质量和授权数据带来的企业信任。Recraft 把矢量和品牌资产生成作为区别于通用照片级真实感的差异化利基。OpenAI 的 GPT Image 模型，以及
              Adobe Firefly、Canva 和 Figma AI，竞争优势不在独立融资规模，而在 ChatGPT、Creative Cloud、Canva 和 Figma 平台的分发力。BFL 自己的企业级层——每月
              200,000 次生成起、零数据留存、专用端点的定制协议——让它更接近 Bria 的合规优先企业模型，而不是 Midjourney 或 Ideogram 的专业消费者订阅打法。
