              - CV051
      - number: '8.5'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 Black Forest Labs 收入继续向 Runway 约 $90M 或 Midjourney 约 $500M
              的规模靠近，企业合同（Meta、Adobe、Canva、Snap）续签，私募市场对基础模型公司的风险偏好延续，从而支撑下一轮估值维持在或高于当前 $3.25B。基准情景假设收入仍在增长，但倍数本身向 CNBC 和
              Perspective Labs 泡沫怀疑证据所隐含的 2026 年私募 AI 市场更审慎均值压缩，在更低倍数下得到相近或小幅不同的估值。熊市情景假设报道中的 Meta 合同没有续签或下调重谈，FLUX
              基准优势继续商品化，更广泛的下轮降价融资压力传导至 AI-native 私营公司，估值跌破 $3.25B。公开证据无法给这些情景精确分配概率；本章只报告与支撑或削弱各情景的具体证据相绑定的定性概率信号。
