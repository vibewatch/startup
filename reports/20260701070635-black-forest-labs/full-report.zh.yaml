              增长数据都说明，政策和过滤层在生态层面仍未被证明有效；多个重要问题（算力供应商身份、GPAI Code of Practice 签署方状态、现金 runway、headcount
              轨迹）仍未披露。最清晰、可监测的淘汰标准 触发器有三类：诉讼或监管文件直接点名 Black Forest Labs，而不只是 xAI、Stability AI 或 Midjourney；公开确认 Meta
              合同不续约或发生重大重谈；以及在 2025 年 12 月 Series B 之后出现 down round 或后续融资失败。任何一项都会相对于当前估值和客户证据叙事所隐含的
              基准情形，实质性改变公司的风险调整后视角。
