      - number: '5.4'
        title: 差异化、信任与安全：开放核心策略叠加 C2PA 溯源和经对抗测试的安全缓解措施——但许可摩擦和基准商品化是真实风险
        blocks:
          - type: paragraph
            body: >-
              BFL 的核心技术差异化有四根支柱：统一的生成与编辑架构（FLUX.1 Kontext、FLUX.2）；生产级开放权重发布策略（FLUX.1 [schnell] 和 FLUX.2 [klein] 4B 采用
              Apache-2.0，是同质量档位中覆盖最广的开放图像模型）；Diffusers、ComfyUI 和 MCP 集成带来的生态深度；以及 FLUX.2 [klein]
              在消费级硬件上的亚秒级推理。安全与信任上，BFL 搭了多层内容安全栈：预训练数据过滤（包括 IWF CSAM 哈希匹配）、多轮定向安全微调、第三方对文本和图像输入的对抗红队评估（FLUX.1 Kontext
              评估了 21 个 checkpoint）、推理时使用 Hive 和 Microsoft 过滤 CSAM 和 NCII，以及给所有 API 输出加上 C2PA 加密元数据。C2PA 实现符合 Content
              Credentials 标准；内容真实性联盟认可这一标准，出版方也越来越多地要求采用。FLUX.2 [klein] model card 记录：只有在最终第三方评估显示其在 CSAM 和 NCII
              类别上比其他领先开放权重模型更有韧性后，发布才获批准。竞争差异化方面，FLUX.2 [dev] 在开放权重空间里的基准测试胜率很强（相对 Qwen-Image，文本生图胜率 66.6%，多参考图胜率
              63.6%），但 Overchat AI 的独立基准测试发现，FLUX.2 在文字渲染、信息图准确性和风格迁移质量上输给 Google 的 Nano Banana Pro（Gemini 3 Pro
              Image）；后者还可调用实时 Google Search，为信息图内容提供 grounding。FLUX.2 不支持 negative prompts，而是依赖 positive-descriptor
              prompting；MCP 和 API 文档都明确写到这一点。FLUX.2 [dev]、FLUX.1 [dev] 和 FLUX.2 [klein] 9B
              若要自托管商业部署，需要付费许可（Builder、Platform、Professional 或 Enterprise 档）；真正可在 Apache-2.0 下免版税商用的，只有 4B klein 和
              schnell 变体。这造成了双层商业现实：研究和原型用途相当开放，但用最佳开放权重做生产级 SaaS 部署，需要与 BFL 签商业协议。按 FLUX.2 的规模和公开发布范围，EU AI Act 的 GPAI
              义务与公司直接相关；但截至运行日期，BFL 仍未发布详细的 GPAI 合规声明。
