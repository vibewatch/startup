      - number: '7.3'
        title: 运营和信任风险：开放权重微调、训练数据透明度缺口，以及未被证明有效的过滤器
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 通过 Hugging Face、GitHub 和 Civitai 分发开放模型权重，第三方因此可以下载、微调并重新托管衍生模型，完全绕开公司自己的托管 API 安全
              pipeline；许可语言禁止包括隐私和生物识别法律违规在内的非法滥用，但这只是合同威慑，不是技术控制，公司也没有披露执法或下架记录。这个缺口并非假设：Low-Rank
              Adaptation（LoRA）微调可用少至 20 张图像，在约 15 分钟内生成逼真的 AI-generated CSAM；Internet Watch Foundation 记录到 2025 年
              AI-generated CSAM 视频同比增长 26,385%——这是任何支持第三方微调的开放权重图像模型都会面对的类别级风险，FLUX 也包括在内。Black Forest Labs 的 IWF
              会员身份让它可访问超过 2.7 million 个已知 CSAM 哈希的 Hash List，这是真实且独立确认的缓解措施；但 2026 年 Grok 事件——一个部分建立在微调 FLUX-family
              模型之上的系统，在不到两周内生成估计 3 million 张性化 deepfake 图像——说明政策和过滤层还没有在生态层面证明能完全关闭这类风险。训练数据 provenance 是第二个缺口：Black
              Forest Labs 未按 EU AI Office 强制模板要求的颗粒度发布数据集级摘要，因此外界无法从公开来源验证 provenance 和版权合规质量。最后，没有来源披露公司托管 API 的 uptime
              历史或事故记录，违规举报看起来也通过人工法律邮箱渠道处理，而不是已披露的自动检测系统；可靠性和执法规模问题都还悬着。
