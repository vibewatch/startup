  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 现金头寸与烧钱
        - 经审计的账面现金、月度烧钱率和跑道
        - 在 Series B 标题数字之外，判断资本是否充足，以及下一次定价轮前是否可能需要桥轮
        - 直接向 Black Forest Labs 或其 Series B 领投方索取
      - - 客户集中度
        - 合同级收入拆分，尤其是据报约 $140M 的 Meta 关系
        - 单一大合同会集中估值支撑风险；续约条款实质影响收入基数耐久性
        - 索取客户级收入披露，或匿名集中度表
      - - 按变现面拆分毛利率
        - 分别提供托管 API、企业合同、开放权重许可和 Marketplace 转售毛利率
        - 判断哪一个变现面真正盈利且可扩展，哪一个靠补贴或受算力成本约束
        - 索取分部级 P&L 或单位经济性拆分
      - - 股权结构与优先权
        - 完整股权结构、清算优先权堆栈，以及 Series B 中任何债务 / 可转债条款
        - 在 $3.25B 标题估值之外，判断新投资人的实际下行保护和稀释
        - 将披露股权结构作为继续尽调的条件
      - - GPAI Code of Practice 与算力供应商身份
        - 确认是否签署 EU AI Act GPAI Code of Practice，以及主要 GPU / 云算力供应商身份
        - 两者都会影响合规成本敞口和单一供应商依赖风险，并可能压缩未来利润率
        - 直接向 Black Forest Labs 索取；交叉核对 EU AI Office 公开签署名单
      - - Series B 之后的新融资或二级市场定价
        - 2025 年 12 月以来任何融资轮、桥轮或二级交易
        - 这是对本章通篇使用的 $3.25B 估值标记最直接、由市场定价的更新
        - 定期监控 Sacra、CB Insights、TechCrunch 和 Crunchbase
    notes: 各行排序依照作者判断：若问题得到解决，哪些最可能改变估值结论。
    claimRefs:
      - CV050
      - CV004
      - CV020
      - CV048
      - CV049
