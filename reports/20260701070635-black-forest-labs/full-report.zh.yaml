      - number: '4.5'
        title: 财务结论：收入信号可观，margin 路径未解，还有全行业 ROI 逆风
        blocks:
          - type: paragraph
            body: >-
              正向案例真实存在：BFL 已从研究实验室走到一家估算年化收入 ~$96.3M、拥有标志性 $140M Meta 合同、四个不同变现界面、并获得 $3.25B
              估值的公司；最新一轮由包含战略企业投资者的投资团承销，而这些投资者也是客户。用 Sacra 收入估算对应这个估值，隐含倍数约
              34x；只有增长继续以类似节奏推进，这个数字才说得通，因为目前没有披露的现金流或利润率数据能独立支撑它。


              负向案例同样真实，而且对于这类公司来说，背后少见地有全行业宏观逆风。MIT 关联分析研究企业生成式 AI 部署后发现，尽管企业 GenAI 投入达 $30B-$40B，95% 组织没有获得可衡量 ROI，只有
              5% 集成型试点提取到真实价值；这与 BFL 最大已披露合同高度相关，因为这些合同正是企业生成式 AI 部署。另一份 2026
              年开放权重基础模型分析认为，接近零的推理成本会侵蚀持久模型服务利润率，并警告推高基础模型估值的行业循环融资动态可能反转——解读 BFL 自身估值时，这是一条直接警示。品类级诉讼（Andersen v.
              Stability AI，也点名 Midjourney 和 Runway）以及 EU AI Act
              合规义务，还会带来价目表之外的额外成本暴露。合在一起，本章可以支撑一个合理增长叙事，但如果没有公司披露的现金、烧钱速度、利润率和合同条款数据，财务承销案例无法闭合。
