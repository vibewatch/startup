      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              BFL 自己的定价页划出四类买方 / 付款方：面向开发者和早期团队的自助 Builder 档位，面向大规模上线产品团队的 Platform 档位，面向服务多个客户领域的机构的 Professional
              档位，以及每月 200,000 次生成起、零数据留存和专用端点的定制 Enterprise 协议。预算归属随之变化：Builder 档位用个人开发者的信用卡，Enterprise 档位则需要企业 IT 和 CMO
              / Digital Officer 签字。BFL 直接账户之外，还有三类主体使用 FLUX 但不直接向 BFL 付费：转售托管访问的第三方推理市场（fal.ai、Replicate、Together
