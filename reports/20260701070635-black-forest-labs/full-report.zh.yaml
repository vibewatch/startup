  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和变现界面：API 点数、企业合同、开放权重授权与市场转售
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 不是靠单一套餐变现视觉智能模型，而是有四个不同界面：按生成量计费的托管 API，采用点数（credit）系统，1 credit =
              $0.01；通过联系销售售出的定制企业协议；面向自托管其更大、非 Apache-2.0 开放权重检查点的商业付费授权；以及通过第三方推理市场的被动转售。API 界面最清楚，也最可验证：FLUX.1 Kontext
              [pro] 每张图 4 credits（$0.04），[max] 8 credits（$0.08），FLUX1.1 [pro] Ultra 6 credits（$0.06），FLUX.1 Fill [pro] 5
              credits（$0.05），FLUX.2 新的 megapixel 计价从最便宜 klein 4B 档首个 megapixel $0.014 起。点数在组织层面汇总、跨项目共享，并通过 Stripe
              结账流程购买，这是 BFL 收入模式中最清楚、最可验证的部分。


              企业和授权界面更难承销。BFL 企业层宣传每月 200,000 次生成起的批量价格、私有专用端点和本地部署；Sacra 报道 BFL 于 2025 年 9 月签下约 $140M 的 Meta 合同，是估算
              $300M 总合同价值的一部分，覆盖 Meta、Adobe、Canva 和 Snap。另一路，BFL 对更大的 FLUX.2 权重采用非商业许可，只把较小的 4B klein 版本按宽松 Apache-2.0
              条款发布；没有受检来源披露商业自托管授权价格。第三方市场 fal.ai、Replicate 和 Together AI 继续延伸 BFL 触达：fal.ai 将其 FLUX Pro 1.1 端点标为每
              megapixel $0.04，与 BFL 自己类似档位的挂牌价相当，但这些渠道与 BFL 的分成条款均未公开。GTM
              侧，这是一种真正混合的动作——底部是自助购买点数，顶部是联系销售的企业交易，中间还有完全不需要 BFL 直接销售动作的市场分发。
