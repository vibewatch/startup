  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：Black Forest Labs 提供分层图像生成与编辑平台，覆盖开放权重、商业 API、开发者工具和面向任务的 FLUX Tools 端点
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 的产品族，最好理解成一个三层同心圆平台。最内层是模型族本身，按代际和能力档位组织。FLUX.1 [schnell]（Apache-2.0，12B
              参数）是面向个人使用最快的开源档位。FLUX.1 [dev]（非商业，12B 参数）给研究人员和开发者提供质量更高的开放权重。FLUX.1 Kontext [dev/pro/max]
              把图像生成和编辑收进同一套统一架构，支持多轮迭代编辑，并在多次编辑中保持角色和风格一致；BFL 用 KontextBench 验证了这一能力，基准覆盖五类任务、1,026 组图像提示对。FLUX.2
              是第二代模型族：[pro] 和 [flex] 是托管商业 API 档位，[dev] 是 32B 开放权重检查点，[klein]（4B Apache-2.0、9B 非商业）则做了尺寸蒸馏，面向消费级 GPU
              和亚秒级实时生成。中间层是集成生态：Diffusers、ComfyUI 和 TensorRT 的官方连接器；托管在 mcp.bfl.ai、只支持 OAuth 登录的 MCP 服务器；以及
              FAL.ai、Replicate、Together AI、Runware、Cloudflare、DeepInfra 上的 marketplace endpoint。最外层是 FLUX Tools——2026 年
              H1 推出的专项任务 API endpoint，包括 Virtual Try-On（VTO）、Erase 和 Outpainting；每个 endpoint
              都围绕单一任务微调，而不是依赖通用模型。按客户工作流看，编辑产品图的创意专业人士可通过 playground、BFL API 或 marketplace 触达 BFL；构建应用的开发者会集成 Diffusers
              FluxPipeline 或 MCP 服务器；需要品牌一致性的企业则许可开放权重并自托管。访问模式做得宽，是一项有意的产品决策：BFL 的开放核心策略要靠开放权重的开发者广泛采用，形成网络效应和研究可见度；商业
              API 和许可档位再把这种采用转成收入。
