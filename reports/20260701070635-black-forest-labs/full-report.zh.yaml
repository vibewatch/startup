      - number: '1.3'
        title: 融资历史、估值与投资者图谱
        blocks:
          - type: paragraph
            body: >-
              BFL 最清楚的资本锚点是 Series B：公司博客和 TechCrunch 均显示，BFL 于 2025 年 12 月 1 日完成 $300M 融资，投后估值 $3.25B，由 Salesforce
              Ventures 与 Anjney Midha (AMP) 共同领投；参与方名单很长，包括 a16z、NVIDIA、Northzone、Creandum、Earlybird VC、BroadLight
              Capital、General Catalyst、Temasek、Bain Capital Ventures、Air Street Capital、Visionaries Club、Canva 和 Figma
              Ventures。TechNode Global 的独立报道进一步拉长投资者名单（StepStone Group、S32 Ventures、Notion
              Capital、Shutterstock、QuantumLight Capital、Cherry、Adobe Ventures、Deutsche Telekom 的 T.Capital、LEA
              Partners、SV Angel、Lux Capital、Samsung Next、Headline，以及多位具名天使），Unite.AI 和 TechNode Global 也分别确认该轮包含此前未公开的
              Series A。其他来源称较早一轮规模约 $31M，由 a16z 领投、General Catalyst 参与；a16z 自己的 careers 页面也独立把 BFL 列为 Series A
              阶段被投公司——可以佐证轮次存在，但仍不足以官方确认精确金额。


              还有两项融资披露明显不完整。第一，没有受检来源披露老股交易、债务或信用额度，也没有合并股权结构表；累计融资只能从媒体汇总估算为「超过 $450M」，不是经审计数字。第二，BFL
              多位具名投资者同时也是商业伙伴——Canva、Figma 和 Adobe Ventures
              同时出现在投资者名单和企业客户名单里——由此带来利益冲突和收入集中度问题，公开资料没有给出答案。企业采用本身看起来真实：Adobe、Canva、Figma、Meta、Microsoft 和 Deutsche
              Telekom 工作流被称由 FLUX 模型驱动，开发者平台分发则包括 Hugging Face、Replicate、Fal.ai 和 Together AI。
