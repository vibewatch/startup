      - number: '1.2'
        title: 创始人、当前领导层与治理不透明
        blocks:
          - type: paragraph
            body: >-
              即便精确创始人数存在争议，创始人叙事仍少见地扎根在一手研究文献里。TechCrunch 和 AI Companies 都把 Robin Rombach、Patrick Esser、Andreas
              Blattmann 列为 BFL 共同创始人，并称他们是 Stability AI 的 Stable Diffusion 模型创建者；Nextomoro 独立画像更进一步，列出第四位共同创始人 Dominik
              Lorenz。2024 年 rectified-flow scaling 论文（Stable Diffusion 3 研究）的 arXiv 预印本将四人全部列为共同作者，旁边还有其他 Stability AI
              研究员；这能佐证四人在 BFL 创立前同属核心生成建模团队，但不能单独解决法律层面的创始人身份。上述组合给了创始团队异常强的创始人-市场匹配：曾帮助发明潜扩散、又把 rectified-flow
              Transformer 做大的人，现在用自己的品牌把这套技术商业化。


              创始人之外，管理层能见度很低。独立媒体称 Robin Rombach 为联合创始人兼 CEO，BFL 官网也确认 Martin Scorsese 于 2026 年 6
              月以创意顾问和合作伙伴身份加入——这是一次高知名度背书，同时也招来分镜艺术家以及 Guillermo del Toro 等同行公开反弹；撮合方是 BroadLight Capital，这家既有 BFL 投资人与
              Scorsese 经纪人有关联。BFL 官方页面（home、about、careers、enterprise）均未公布董事会名单、股权结构或 CEO 之外具名高管阵容；组织深度最清楚的信号反而来自 Jobera
              和 Built In 上覆盖研究、机器人、合作伙伴和办公室管理岗位的招聘。因此，创始研究团队的关键人依赖看起来很高，治理透明度仍是明确尽调缺口。
