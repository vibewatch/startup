        title: 公开牵引力 vs. 私有指标缺口：分析师估算了什么，BFL 没披露什么
        blocks:
          - type: paragraph
            body: >-
              Sacra 和 CB Insights 两个独立追踪器都将 Black Forest Labs 2025 年年化收入估在约 $96.3M；Sacra 还估计，仅 Meta 合同就可能接近 BFL
              已披露企业合同总价值 ~$300M 的一半——如果该合同按报道规模落地，这是有意义的单一客户集中度信号。上市公司对照披露说明，生成式图像变现既能扩到很大，也能在申报文件中保持不透明：Adobe FY2025
              Form 10-K 完全不单列 Firefly 收入，而是把生成式 credits 折进更宽的 Creative Cloud 和 Firefly 订阅包；Shutterstock 披露的 Data,
              Distribution, and Services 分部——包含生成式 AI 授权——2025 年增长 16% 至 $203.3M（占总收入 21%），即便其核心内容授权业务仍承压。


              这些数字在 BFL 自身没有对应披露。公司没有经审计收入或 ARR 数字，没有披露毛利率或收入成本，除了 Sacra 报道的 Meta
              数字之外没有客户级收入结构，没有大型企业交易的合同级条款（期限、续约、最低承诺），也没有按职能拆分的员工数，无法让尽调团队区分 R&D 成本强度和商业 GTM
              支出。本章每个看起来精确的数字——$96.3M、$140M、$300M——都是第三方估算或报道的交易价值，不是公司披露的财务报表行。
