              三个缺口限制了本章市场规模测算向公司特定估值输入推进的程度。第一，没有受检来源披露 BFL 自身 API 收入、单量或在 $484M-$9.1B
              已发布市场估算区间中的份额，因此这些测算口径只能限定可寻址机会，不能钉住 BFL 的现实获取。第二，没有报告把开放权重商业授权的可服务市场（SAM）从托管 API 使用中单独拆出，尽管 BFL
