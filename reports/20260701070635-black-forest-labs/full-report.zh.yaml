      - number: '8.6'
        title: 建议：继续研究，而非买入或回避
        blocks:
          - type: paragraph
            body: >-
              收入基础未审计、成本结构未披露，单一客户集中风险接近上一全年收入，且本章记录的 2026 年宏观环境整体上对生成式 AI 估值持怀疑态度；在当前 $3.25B 估值下，证据支持对 Black Forest
              Labs 采取继续研究立场，而不是给出买入或回避结论。这不是否定底层业务——市场分析、产品技术和客户章节都记录了真实商业牵引——而是说，截至 2026 年 7
              月，估值特定证据不足以支撑一个有把握的价格。Black Forest Labs 的开放权重分发模式也带来一个建议本身必须标出的结构性风险：Stability AI 2024
              年濒临崩盘就是有记录的警示先例，其开放权重变现被商品化后，自身定价权随时间被侵蚀；所审阅证据没有确认 Black Forest Labs 在结构上能免疫同一动态。
