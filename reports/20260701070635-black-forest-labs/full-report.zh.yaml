        title: 具名客户证据：生产深度差异很大，从一个详细案例研究到多个只有 logo 的提及
        blocks:
          - type: paragraph
            body: >-
              最强的单一客户证据，是 Black Forest Labs 自己发布的 Envato 案例研究：它点名 CEO、直接引用其表述，还披露了具体使用指标（约 25% 的图像生成量、累计 51M+
              张图像）和生产时间线（2023 年初通过转售商评估，之后直接合作，FLUX.2 首日上线）。没有其他具名账户接近这一细节水平。Deutsche Telekom
              的合作同时由客户自己的新闻稿和德国独立科技媒体（heise online）确认，但 2025 年 2 月公告描述的仍是一个“仍在开发”的模型，此后没有发布结果指标。Mistral AI 的 Le Chat 和
              Freepik 的 Magnific 都用自己的话确认了 FLUX 集成，但都未披露用量。Picsart 的开发者文档列出 Black Forest Labs
              是集成模型提供商，没有更多说明。据报道可能是单一最大合同的 Meta 交易，完全依赖二级财经报道，双方都未确认。Martin Scorsese 用于分镜的故事有充分记录且态度积极，但那是 advisor
              关系，不是商业账户，还引来 Guillermo del Toro 等创意行业同行公开批评。制作工作室 Apostle 的 8.1/10 评价真实存在，但只是单家公司样本。合起来看，只有 Envato
              达到“生产部署 + 量化结果”的标准；其他名字要么只有 logo，要么未经确认，要么只是小样本背书。
