    title: 信任 / 质量 / 合规表
    columns:
      - 控制 / 认证 / 质量指标
      - 状态
      - 范围
      - 缺口
    rows:
      - - C2PA 加密内容溯源
        - 已在所有 API 输出上实施
        - 所有 FLUX.2 API 生成图像都会带有加密签名的 C2PA 元数据，标明模型、时间戳和编辑历史
        - C2PA 元数据只覆盖 API 输出；自托管开放权重部署不强制嵌入溯源，但参考代码包含像素层水印示例。
      - - 预训练 CSAM/NSFW 数据过滤
        - 所有模型世代均已部署
        - 预训练数据借助 IWF 合作过滤 NSFW 内容和已知 CSAM 哈希
        - 过滤完整性没有公开审计或外部认证。
      - - 对抗性第三方红队评估
        - FLUX.1 Kontext（21 个检查点）和 FLUX.2 [klein] 发布前已完成
        - 外部评估聚焦通过纯文本和图像参考攻击生成 CSAM 与 NCII；最终评估中，FLUX.1 Kontext [dev] 比其他开放权重模型更抗打
        - 红队范围和方法论只做定性描述；没有公开审计报告。
      - - 推理时 CSAM/NCII 过滤（Hive + Microsoft）
        - BFL API 已上线；CSAM/NCII 类别不可调
        - API 过滤器（Hive + Microsoft）对 CSAM/NCII 不能由开发者移除或调整
        - 过滤只覆盖托管 API；自托管开放权重部署需实施方按许可条款自行配置过滤。
      - - FLUX Non-Commercial License（dev/klein-9B，非商业许可）
        - 已发布并跟踪版本
        - 约束非商用开放权重部署；过滤和人工审核是使用条件；商用部署需要付费许可
        - 开放权重自托管者的许可执行机制未公开记录；合规很大程度依赖自报。
      - - Commercial Self-Hosted License 层级（Builder / Platform / Professional / Enterprise）
        - 可在 BFL 授权页面获取；Platform 及以上需联系销售
        - 授予自托管 FLUX.2 [dev] 和 [klein] 9B 的商用权利；包含微调和 LoRA 权利；域名和用量限制随层级变化
        - Platform、Professional、Enterprise 层级价格未公开列示；需要联系销售。
      - - 欧盟《人工智能法案》GPAI 义务
        - 截至 2026-07-01，未找到公开 GPAI 合规声明
        - FLUX.2 规模为 32B 且广泛分发，按欧盟《人工智能法案》定义很可能属于 GPAI 模型
        - BFL 尚未发布 GPAI 技术文档摘要或欧盟市场义务映射；对在欧盟的企业客户，这是实质性合规缺口。
      - - API 使用政策和开发者条款
        - 发布于 bfl.ai
        - 禁止违法内容、CSAM、NCII、非自愿图像和深度伪造
        - 执法指标和政策违规率未发布。
    notes: 信任与合规控制根据 BFL 模型卡、官方文档和 C2PA 内容凭证标准核验。欧盟《人工智能法案》适用性依据已发布法规文本推断；BFL 尚未确认或否认 GPAI 分类。
