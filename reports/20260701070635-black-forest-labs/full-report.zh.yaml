        - from: t8
          to: t12
        - from: t9
          to: t12
        - from: t10
          to: t12
        - from: t11
          to: t12
    approximationNotes: 边代表作者从风险类别到财务 / 估值结果推导出的传导逻辑，不是披露的因果模型。
    claimRefs:
      - CR060
