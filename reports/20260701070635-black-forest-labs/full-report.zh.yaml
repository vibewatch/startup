      - number: '7.5'
        title: 财务、融资和估值风险：在 2026 年 AI 投资气候转冷中承受约 34x 收入倍数
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 据报 $3.25B Series B 估值对应约 $96M FY2025 收入，隐含收入倍数约 34x——即便按生成式 AI
              行业标准也很激进——而整个市场对这类倍数的胃口正处在真实疑问中。CNBC 2026 年 1 月对 40 位科技领袖和分析师的调查显示，“AI bubble” 辩论仍活跃且未解决：投资人 Michael Burry
              拿 dot-com 时代作类比，Nvidia CEO Jensen Huang 则公开否认泡沫担忧。另一份 2026 年 4 月分析估计，年度 AI 行业投资（约 $400B）与企业 AI 收入（约
              $100B）之间约有 4:1 缺口；90% 的企业称 AI 部署没有带来可衡量生产力提升；并估计自 2025 年末以来，AI 初创公司估值整体下跌 23%——这些都是类别级投资者怀疑信号，而 Black
              Forest Labs 正是在此时完成了自己的高倍数轮融资。没有来源披露公司的现金 runway、burn rate，或下一轮融资时间线，因此除 Series B
              本身这一事实之外，资本充足性风险无法验证。独立欧洲媒体 Sifted 在标题中把公司称为“欧洲最受追捧、也最难捉摸的初创公司”，这是对其披露实践的明确怀疑表述。叠加其上的，是开放权重许可模糊：Black
              Forest Labs 自己的许可页面在自托管权利旁列出分层商业条款（Builder、Professional、Enterprise），但 2025 年中围绕 FLUX.1 Kontext
              非商业许可的社区争议显示，开发者已经公开质疑：需要另行付费才能商用的权重，到底能否被公平称作“开放”。这种模糊同时带来被许可方 法律风险，以及与开源定位绑定的声誉风险。
