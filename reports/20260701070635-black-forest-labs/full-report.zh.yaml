  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 供应商
      - 公开套餐
      - 价格 / 单位 / 合同模型
      - 包含能力
      - 折扣或未知项
      - 含义
    rows:
      - - BFL
        - API + 开放权重授权 + Enterprise 层级
        - 按百万像素 API 定价（$0.014-$0.07），另有起于 200,000 次生成 / 月的定制 Enterprise 协议
        - 托管 API、开放权重自托管、面向任务的端点、零留存企业层级
        - Enterprise 合同价格需协商 / 定制，未公开
        - BFL 是少数同时公开自助单位价格和开放权重路径的供应商之一
      - - Midjourney
        - Basic / Standard / Pro / Mega 月度订阅
        - 每月 $10 / $30 / $60 / $120，Fast GPU 小时分层；年付节省 20%
        - Fast + Relax + Stealth GPU 时间模式，所有付费层级均含商业使用权
        - 无企业 / API 自助层级；无免费试用
        - 消费者定价简单透明，但没有企业 API / 自托管路径
      - - Stability AI
        - Stable Diffusion API + DreamStudio + 开放权重自托管
        - 点数系统，1 个点数 = $0.01；各模型成本大约为 $0.009-$0.08 / 图
        - API 访问、免费 / 本地自托管部署、可用企业 SOC 2 / 3 层级
        - 企业 / 按量价格需协商，未公开
        - 透明自助单位价格搭配真正免费的自托管选项
      - - OpenAI（GPT Image）
        - 按 token 定价的图像 API + ChatGPT Business / Enterprise 捆绑
        - 按 token 定价会随模型代际（GPT Image 2 / 1.5 / 1 mini）和质量层级变化；Business 席位 ~$20-25/user/month
        - 前沿图像模型、与 ChatGPT / Codex 捆绑、管理 / 安全控制
        - 精确单图成本需要把 token 定价换算到固定分辨率假设
        - 分发捆绑定价会遮蔽真实图像生成单位经济性
      - - Adobe Firefly
        - Standard / Pro / Pro Plus / Premium 独立套餐 + Enterprise 附加项
        - 独立版 $9.99-$199.99/month（据第三方定价综合）；Enterprise ~$24/user/month，共享点数池， 据 redress-compliance 分析
        - 图像 / 视频 / 音频生成点数、IP 赔偿、Content Credentials
        - Adobe 官方页面未直接披露精确美元层级；数字来自第三方定价顾问
        - 实际企业账单通常由点数超额成本驱动，而不是标价
      - - Ideogram
        - Free / Plus / 更高付费层级
        - Plus 层级年付 ~$15/month（相比月付节省 25%）；免费层级一直可用
        - 免费点数、社区图库、付费层级 API 访问
        - 本章抓取未完整保留更高层级的精确定价
        - 入门价低于 Midjourney，同时沿用类似的分层订阅模型
      - - Runway
        - 从免费 / 付费层级到企业版
        - 一次性免费 125 个积分；付费自助套餐为 $12-$95/用户/月，另按 GPU 分钟计费
        - Gen-4 文生视频 / 图生视频、Gemini 集成、企业微调
        - 2024 年收入约 ~$44M，同时第三方估算 EBITDA 亏损约 ~$155M
        - 激进算力投入支撑模型快速迭代，但压低近期利润率
      - - Bria
        - API + 企业授权
        - 企业合同和 API 访问；本章来源未保留确切公开价目表
        - 授权数据模型、归因 / 补偿引擎、本地 / 云部署
        - 审阅来源未找到公开自助定价；暗示仅面向企业的联系销售模式
        - 定位完全偏向企业交易，而非自助 / 专业消费者定价
      - - Recraft
        - 免费 / Basic / Pro / Team / Enterprise 套餐 + API
        - 据第三方定价页面，Basic 约 ~$10-$12.50/月，Pro/Advanced 约 ~$16-$27/月，Team 约 ~$18-$30/席位/月，Enterprise 定制
        - 矢量 / 插画生成、付费层级商业所有权、API 访问
        - 积分不滚存；高级工具单次操作可消耗 10–20 倍积分
        - 细分矢量 / 插画定位支撑单独分层定价，区别于写实图像厂商
    notes: 当官方厂商页面未披露确切美元数字（Adobe Firefly、Recraft）时，本表明确引用第三方定价咨询汇总页，而不是猜测；这些单元格应视为方向性准确，而非厂商确认的公开标价。
