      - number: '8.8'
        title: 图表
        blocks:
          - type: callout
            title: 公开市场给 AI 相邻创意软件龙头的定价远低于 Black Forest Labs 的私募倍数
            body: >-
              截至 2026 年 7 月 1 日，Shutterstock 交易价格约为 FY2025 收入的 0.5x，Adobe 市值过去一年下跌约 51%；而 Black Forest Labs 的 Series B
              隐含收入倍数约为 34x。公开市场和私募市场眼下显然在用很不一样的方式给 AI 敞口创意业务定价，这个差距本身就是需要承销的估值风险，不只是一个有趣现象。
            calloutType: insight
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV003
          - type: callout
            title: 至少一家同业估值比 Black Forest Labs 更激进
            body: >-
              Runway 估值 $5.3B，对应约 $90M 年化收入，隐含倍数约 59x，高于 Black Forest Labs 自身约 34x。这让「BFL
              相对同业估值过高」这种简单叙事变得复杂：相邻生成式媒体公司的私募市场至少在给一家可比公司更激进定价。
            calloutType: risk
            claimRefs:
              - CV013
              - CV015
          - type: callout
            title: 以今天证据无法负责任地搭建完整 DCF
            body: >-
              Cohort ARR、按变现入口拆分的毛利率、净收入留存、流失率和月度烧钱都未披露。任何基于假设值搭建的 DCF 都会制造虚假精确感，而不是实质降低 Black Forest Labs
              公允价值的不确定性，因此本章有意止步于 DCF 之前。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: 证据支持继续研究，而非买入或回避
            body: 本章建议是继续研究，置信度为中，风险评级为高。这反映的是估值特定披露不足，不是看空本次尽调其他章节记录的底层商业牵引。
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
