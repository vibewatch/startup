  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Black Forest Labs 的关键外部依赖——客户、算力、分发、监管和资本——以及每项集中度带来的风险。
    data:
      nodes:
        - id: d1
          label: Meta（据报道约 $140M 合同）
          detail: 已披露的最大单一客户关系。
          tone: negative
        - id: d2
          label: 未披露的 GPU / 云算力供应商
          detail: 托管 Managed API 的主要基础设施。
          tone: warning
        - id: d3
          label: xAI / Grok（前客户）
          detail: 商业关系据称于约 2025 年 4 月结束；技术谱系仍然存在。
          tone: warning
        - id: d4
          label: Hugging Face、GitHub、Civitai
          detail: 开放权重分发与开发者社区触达。
          tone: neutral
        - id: d5
          label: EU AI Office / European Commission（监管方）
          detail: 鉴于 BFL 总部在欧盟，GPAI 监管者。
          tone: warning
        - id: d6
          label: Series B 投资者财团
          detail: a16z、General Catalyst、NVIDIA、Salesforce Ventures、Temasek 等。
          tone: neutral
        - id: d7
          label: Internet Watch Foundation
          detail: CSAM Hash List 安全合作。
          tone: positive
        - id: d8
          label: Black Forest Labs（核心）
          detail: 承担各项依赖集中风险的中心实体。
          tone: neutral
        - id: d9
          label: 下游市场平台（fal.ai、Replicate、Together AI）
          detail: 额外的推理分发与规则执行触点。
          tone: neutral
