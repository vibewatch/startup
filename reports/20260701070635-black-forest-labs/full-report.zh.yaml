  - id: TV001
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 立场
      - 什么会改变判断
    rows:
      - - 开放权重 + API 分发把开发者和企业采用面拓宽，超出只做封闭 API 的同业。
        - 投资论点
        - 若证据显示开放权重再分发在蚕食付费 API / 企业收入，而不是扩大漏斗。
      - - 托管 API、企业合同、付费开放权重许可、Marketplace 转售四个变现面，分散了收入来源；相较 Midjourney 或 Ideogram 这类单一变现面的同业更稳。
        - 投资论点
        - 若披露显示某一个变现面（例如 Meta 合同）实际上就是全部业务，而不是四个面之一。
      - - 据报约 $140M 的 Meta 合同，以及 Adobe、Deutsche Telekom、Mistral 等具名企业 Logo，显示相较纯消费者同业，BFL 已有真实企业牵引。
        - 投资论点
        - 若确认只有 Logo 的客户并非实质收入贡献者，或 Meta 合同小于 / 短于报道。
      - - 34x 倍数所用的约 $96.3M 收入，是未经审计的第三方估算，不是公司披露或审计数字。
        - 反论点
        - 公司披露或审计收入，确认或大幅修正第三方估算。
      - - 单个据报约 $140M 的 Meta 合同可能超过上一年全部收入，把估值支撑风险集中在一段关系上。
        - 反论点
        - 披露多元化企业客户群，且没有单一合同超过收入约 20-25%。
      - - FLUX.2 已在多个独立基准中输给 Google 的 Nano Banana 2；2026 年 Grok/xAI deepfake 危机又牵出 BFL 自身技术渊源，两者都压缩可实现倍数。
        - 反论点
        - 相对 Nano Banana 2 的基准反转，或 Grok 渊源敞口在监管 / 法律上明确了结。
    notes: 投资论点行复述市场分析、产品技术和客户章节已有证据；反论点行复述财务、风险和客户章节证据，并在这里专门重构为估值含义。
