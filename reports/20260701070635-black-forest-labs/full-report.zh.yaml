      - number: '6.4'
        title: 留存和耐久性：未披露 NRR、GRR 或客户流失率，且已有一个确认流失事件
        blocks:
          - type: paragraph
            body: >-
              截至运行日期，Black Forest Labs 未公开披露净收入留存、毛收入留存、续约率、cohort 数据或客户满意度调查。唯一具体的耐久性数据点是负面的：Elon Musk 的 xAI 自 2024
              年中开始用 FLUX.1 驱动 Grok 图像生成器，到 2025 年 4 月已经停止与 Black Forest Labs 合作；这一点由 Sifted 持续报道确认，也与 TechCrunch
              最初对该合作的报道一致。这是一次已发生的 logo 流失，涉及当时公司最显眼的客户关系之一。本次尝试独立验证第三方评论平台评分（G2）时，被反机器人挑战阻断，所以满意度证据目前只限于一家制作工作室发布的
              8.1/10 评价，以及 Envato 自述自 FLUX.2 首日上线以来持续且扩大的使用。合同期限只能部分推断：关于 Meta 交易的二级报道暗示其结构约为两年（第一年 $35M，第二年
              $105M），但这一点未获官方确认，其他账户也未披露合同条款。整体画面是数据可得性缺口，而不是留存差的证据；但对任何基于耐久性估值的视角，它都是一个真实阻断点。
