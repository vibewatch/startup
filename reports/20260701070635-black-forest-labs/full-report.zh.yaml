      - number: '1.4'
        title: 里程碑、产品节奏与反向风险信号
        blocks:
          - type: paragraph
            body: >-
              记录中最完整的时间线从创始人 2021 年 Latent Diffusion Models 论文和 2024 年在 Stability AI 的 rectified-flow scaling 工作开始，经由
              2024 年 8 月创立和 FLUX.1 发布，延伸到 2025 年 11 月 FLUX.2 发布（含 32-billion-parameter 开放权重 [dev] 版本）以及 2026 年 1 月
              FLUX.2 [klein] 快速推理家族。2025 年 12 月 Series B、2026 年 3 月加入 NVIDIA Research 的 Nemotron
              Coalition，是近期最强的规模和合作伙伴信号；2026 年 6 月 Training Data Disclosure
              则是公开记录中最清楚的治理里程碑。产品节奏快，该联盟和企业关系（Adobe、Canva、Meta、Microsoft、Deutsche Telekom）也说明商业牵引力真实存在，不只是研究声望。


              反向信号集中但重要。xAI 的 Grok 聊天机器人曾用 BFL 模型生成图像；据报道，双方关系在 2025 年 4 月因 Grok 产出露骨伪造图像的争议而结束。这起下游滥用事件说明，即便 BFL
              自身没有直接造成滥用，平台依赖和声誉风险仍会传导。同月，Sifted 将 BFL 描述为「欧洲最受追捧、也最难看清」的创业公司；2025 年 7 月，BFL 又与 Mistral 等欧洲 AI
              创业公司公开呼吁暂停 EU AI Act 实施，加入更广泛的行业游说（另有 45 位以上 EU 商业领袖单独要求推迟两年）。这类游说面对的是坚硬的监管时间表：EU AI Act 下 GPAI 义务已自 2025
              年 8 月 2 日适用，Commission 执法权从 2026 年 8 月 2 日开始，也就是说 BFL 的合规姿态将在它曾试图延后的同一时间线上受检。媒体报道的 $140M Meta 交易（2025 年 9
              月）仍未获公司确认；低声誉聚合网站把创立年份写成 2022 而非 2024，也说明围绕 BFL 的二级媒体覆盖参差不齐，偶尔并不可靠。
