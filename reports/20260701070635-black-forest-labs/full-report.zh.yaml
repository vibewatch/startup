  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - Rectified flow Transformer（32B，FLUX.2 骨干）
        - 核心生成引擎；学习从噪声到图像的潜空间映射；承担生成和编辑
        - GPU 算力（NVIDIA A100/H100/RTX 5090 或同等设备）；CUDA 运行时
        - 全精度需要 90 GB VRAM；消费级硬件只有 FP8 量化后才可用；除规模和范式外，没有公开架构细节。
      - - Mistral-3 24B VLM（文本条件器）
        - 支撑 FLUX.2 的语义落地、世界知识和复杂提示词遵循
        - Mistral AI 模型许可 / 可用性；随 FLUX.2 权重耦合分发
        - 依赖第三方模型家族带来供应链风险；架构无法独立审计；VLM 路线直接导致 FLUX.2 不支持负向提示词。
      - - FLUX.2 VAE（变分自编码器）
        - 定义潜空间；在可学习性、质量和压缩率之间取平衡；所有 FLUX.2 变体共享
        - Apache-2.0；托管在 Hugging Face；由 BFL 维护
        - 若 BFL 在后续世代更换 VAE，基于当前潜空间构建的自定义管线可能需要重做。
      - - FLUX.2 [klein] 蒸馏（4B / 9B）
        - 步数蒸馏后的推理；4 步采样即可在消费级 GPU 上亚秒级生成
        - 母体 FLUX.2 基础模型；BFL 的蒸馏训练管线
        - 质量上限受蒸馏过程约束；4B 的独立质量基准有限；9B 的非商用许可给商用部署增加摩擦。
      - - Diffusers 集成（FluxPipeline / FluxKontextPipeline / Flux2KleinPipeline）
        - BFL 模型的 Python 推理框架；多数自托管开发者使用
        - Hugging Face Diffusers 库；FLUX.2 和 Kontext 需要 git main 分支
        - Hugging Face 库版本碎片化（FLUX.2 在稳定发布前需要 git main 分支）；VRAM offload 表现随 GPU 和驱动版本变化。
      - - ComfyUI 集成
        - 基于节点的可视化推理工作流；创意专业人士和社区的主要本地部署 UI
        - ComfyUI 开源项目；NVIDIA 权重流式加载；社区模型共享
        - 社区驱动，不受 BFL 直接控制；FLUX.1、Kontext、FLUX.2 的命名体系分裂，带来集成混乱。
      - - BFL API 和托管端点
        - 面向 [pro]、[flex]、[max]、[klein] 商业层的托管推理；主要收入入口
        - BFL 自有基础设施；GPU 算力供应（可能是 CoreWeave 或类似供应商）
        - 云算力成本依赖；状态页（status.bfl.ai）本次未独立核验；API 可用性没有公开 SLA。
      - - MCP 服务器（mcp.bfl.ai，OAuth）
        - AI 编程助手集成界面；不用管理 API key，即可把完整 FLUX.2 工具包暴露给 MCP 客户端
        - OAuth 身份提供方；BFL 账户和积分余额；兼容 MCP 的客户端
        - 只支持 OAuth，无法处理浏览器认证流程的客户端会被挡住，除非加 mcp-remote shim；每个客户端都要单独配置；作为集成层仍处 alpha/beta 成熟度。
      - - 安全过滤（Hive、Microsoft、BFL 内部）
        - 推理时拦截 CSAM/NCII；过滤文本提示词和输出图像
        - 第三方过滤供应商（Hive、Microsoft）；IWF CSAM 哈希数据库
        - 安全关键功能依赖商业第三方过滤商；开放权重自托管部署存在被对抗性提示词绕过过滤的风险。
    notes: 架构细节基于 BFL 自身博客文章、模型卡和官方文档。内部算力基础设施供应商未公开披露；对 GPU 云的依赖是从公开部署模式推断而来。
