  - id: TV002
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参照意义
      - 局限
    rows:
      - - Adobe（Firefly，上市）
        - 市值 $81.5B（2026 年 7 月 1 日），过去一年下跌约 51%；Firefly 收入未拆分
        - 无法计算干净倍数
        - 高——最大在位创意 AI 分发方，且披露为 BFL 企业授权客户
        - 多板块合并收入，无法隔离 Firefly 专属倍数
      - - Shutterstock（上市）
        - 市值约 $512.5M（2026 年 7 月 1 日），FY2025 收入 $989.9M
        - 约 0.5x 收入
        - 高——上市素材媒体在位者，邻近变现生成式 AI，且是 BFL 股东名册上的战略投资者
        - 传统授权 / Marketplace 组合不同于 BFL 的模型 API 业务
      - - Runway（私有）
        - $5.3B 估值（2026 年 2 月 Series E），对比年化收入约 $90M（2025 年中）
        - 约 59x 收入
        - 高——资金最充足、最接近的相邻生成式媒体同业
        - 视频 / 世界模型业务模式和单位经济性，不能直接对比 BFL 的图像 API 模型
      - - Midjourney（私有，自筹资金）
        - 2025 年估算收入约 $500M；无一手来源估值事件；聚合器区间 $3-6B
        - 无法从市场定价计算
        - 高——收入规模上最接近的同品类（图像生成）同业
        - 没有融资轮可锚定可辩护倍数；聚合器估值区间未经审计
      - - Stability AI（私有）
        - 2024 年收入约 $50M（已滞后）；总融资约 $225M；聚合器报告的 2026 年估值约 $2.8B（不同来源区间 $1B-$2.8B）
        - 收入过时且估值区间很宽，无法可靠计算
        - 高——直接的开放权重图像模型竞争者，明确被拿来与 FLUX 对标
        - 收入数字已滞后近两年，且不同来源估值差异很大
      - - Ideogram（私有）
        - $80M Series A（2024 年 2 月）；聚合器报告估值约 $200M / ARR $20M（2024 年口径）
        - 约 10x 收入（2024 年数字，2026 年未确认）
        - 中——在质量 / 速度上竞争的文生图同业
        - 相对 2026 年 7 月运行日期，最近公开财务数字已过时约两年
    notes: 所有倍数都是作者基于引用数字计算的比率，并非公司或投资人披露倍数。没有融资轮或审计收入时，本表报告「无法计算」，而不是生造数字。
