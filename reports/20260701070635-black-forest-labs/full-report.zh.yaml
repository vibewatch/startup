      rows:
        - label: FLUX.2 [max]
          values:
            - label: 最强
              tone: positive
              detail: ELO 最高；grounding search 增加现实世界知识集成。
            - label: 强
              tone: positive
              detail: 最多 10 张参考图像；多轮编辑。
            - label: 封闭
              tone: warning
              detail: 仅 API；无开放权重；商业定价。
            - label: 中
              tone: neutral
              detail: 慢于 pro / flex；grounding search 增加延迟。
            - label: 强
              tone: positive
              detail: FLUX.2 家族中文本能力最佳，但复杂信息图输给 Nano Banana Pro。
            - label: 中
              tone: neutral
              detail: 仅 API；无自托管生态。
        - label: FLUX.2 [pro]
          values:
            - label: 强
              tone: positive
              detail: ELO 1030–1050；相对开放权重替代方案，文生图胜率 66.6%。
            - label: 强
              tone: positive
              detail: 最多 10 张图像多参考；4MP 编辑。
            - label: 封闭
              tone: warning
              detail: 仅 API；商业化；权重不可自托管。
            - label: 强
              tone: positive
              detail: 2026 年 3 月速度提升 2×；价格不变。
            - label: 中
              tone: neutral
              detail: 已有改进，但在长文本墙和多语言信息图上仍落后。
            - label: 强
              tone: positive
              detail: 主要生产端点；通过 FAL / Replicate / Together AI 分发。
        - label: FLUX.2 [dev]
          values:
            - label: 强
              tone: positive
              detail: 开放权重质量最佳；相对 Qwen-Image 的多参考图胜率为 63.6%。
            - label: 强
              tone: positive
              detail: 生成与编辑统一；同一 checkpoint 最多支持 10 张参考图。
            - label: 部分
              tone: warning
              detail: 非商业开放权重；商业自托管需要购买 BFL 许可证。
            - label: 低
              tone: warning
              detail: 全精度需要 90 GB VRAM；FP8 需要 18–24 GB；不量化会慢。
            - label: 中
              tone: neutral
              detail: 文本渲染有进步，但密集排版还不到生产级。
            - label: 最强
              tone: positive
              detail: Diffusers、ComfyUI、TensorRT 和 HuggingFace 集成深度完整。
        - label: FLUX.2 [klein] 4B 模型
          values:
            - label: 中
              tone: neutral
              detail: 按 BFL 说法，质量超过规模大 5× 的模型；独立基准有限。
            - label: 中
              tone: neutral
              detail: 支持多参考图编辑；质量受基础模型蒸馏约束。
            - label: 开放
              tone: positive
              detail: Apache-2.0；商业自托管完全免费；无版税。
            - label: 最强
              tone: positive
              detail: 亚秒级推理；最低 13 GB VRAM；可跑实时交互场景。
            - label: 低
              tone: warning
              detail: 4B 规模下文本渲染偏弱；复杂排版可靠性较低。
            - label: 强
              tone: positive
              detail: 支持 Diffusers 和 ComfyUI；API 与自托管都可用。
        - label: FLUX.1 Kontext [dev] 模型
          values:
            - label: 强
              tone: positive
              detail: KontextBench 多轮编辑一致性得分领先；12B 模型。
            - label: 最强
              tone: positive
              detail: 专为上下文内编辑打造；迭代编辑效果最好，漂移最小。
            - label: 部分
              tone: warning
              detail: 非商业开放权重；商业使用需要付费许可证。
            - label: 中
              tone: neutral
              detail: 靠引导蒸馏提升效率；快于 FLUX.2 [dev]，慢于 klein。
            - label: 中
              tone: neutral
              detail: 支持文本编辑，但不是主要差异点。
            - label: 最强
              tone: positive
              detail: Diffusers 内置 FluxKontextPipeline；Replicate、FAL、Together AI、DataCrunch、Runware 均可用。
    approximationNotes: >-
      单元格是基于官方基准、模型卡和独立 Overchat AI 对比得出的有证据支撑的序位判断。相对 Nano Banana Pro 的文本渲染弱项来自独立基准；BFL 并未 声称文本渲染与 Google Gemini 3 Pro
