      - number: '6.6'
        title: 负面信号：Grok/xAI 事件是公开记录中最清晰的客户信任风险
        blocks:
          - type: paragraph
            body: >-
              本章最实质的负面证据，来自 Black Forest Labs 与 xAI 的旧关系。TechCrunch 2024 年 8 月最初报道说，Grok 由 FLUX
              驱动的图像生成器“几乎没有防护”，可生成真实人物的非自愿描绘，并引用公开反应称其是“最鲁莽、最不负责任的 AI 实现之一”。一篇 2026 年 1 月报道把后续 Grok 更新 “Image Gen 2” 与
              “Black Forest Labs 的 Flux.1 model 高度微调版本” 关联起来，并称 California Attorney General 和 Canada’s Privacy
              Commissioner 已因非自愿 deepfake 生成对 xAI 展开调查；该报道没有直接指控 Black Forest Labs 违法，Sifted 的追踪报道也确认两家公司到 2025 年 4
              月已经停止合作。第二个较小的负面信号来自创意行业：关于 Martin Scorsese advisor 角色的报道提到，分镜艺术家和 Guillermo del Toro 等同行，对 AI
              在创意制作工作中角色扩大表达公开反弹。第三个更偏流程的信号是许可摩擦——社区反复困惑于 FLUX.1 [dev] 非商业许可的商业使用条款——这不是安全问题，但也是较温和且真实的客户 /
              采购摩擦。单看这些信号，没有一个会威胁本章其他地方画像中的当前具名客户关系；合在一起，它们说明客户相邻的声誉和监管风险已经实际发生过一次，并且仍会影响未来企业许可决策。
