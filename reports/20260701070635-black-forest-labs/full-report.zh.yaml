              detail: 面向评估和轻量使用的浏览器生成与编辑。
            - label: BFL API（REST 端点）
              detail: 以程序方式访问全部 FLUX.2 模型，并按模型和分辨率计费。
            - label: FLUX MCP 服务器（mcp.bfl.ai）
              detail: 面向 Claude、Cursor、Codex 和 Windsurf 的 OAuth 认证远程 MCP 端点。
        - label: 模型家族层级
          detail: 不同模型 checkpoint 覆盖质量、速度和开放权重访问层级。
          items:
            - label: FLUX.2 [max / pro / flex] 模型
              detail: 仅 API 商业层级；max 增加 grounding search；flex 暴露 step / guidance 参数。
            - label: FLUX.2 [dev]
              detail: 32B 开放权重非商业 checkpoint；开放模型中质量最高；18–24 GB FP8 VRAM。
            - label: FLUX.2 [klein] 4B / 9B 模型
              detail: 步数蒸馏模型；4B 采用 Apache-2.0，可完全商业使用；9B 非商业；亚秒级推理。
            - label: FLUX.1 Kontext [dev/pro/max] 模型
              detail: 统一生成 + 编辑 12B 模型；多轮编辑保持角色 / 风格一致。
            - label: FLUX Tools（VTO、Erase、Outpainting 工具）
              detail: 面向专门任务微调的 API 端点；可免提示词或低提示词操作。
        - label: 推理与集成层
          detail: 标准化框架和工具把模型权重接入开发者工作流。
          items:
            - label: HuggingFace Diffusers（FluxPipeline / KontextPipeline / Klein Pipeline 框架）
              detail: 主要 Python 自托管框架；支持 FP8 / BF16 量化和 VRAM 卸载。
            - label: ComfyUI 节点式工作流
              detail: 首日支持并提供官方模板；NVIDIA 权重流式加载面向 RTX 消费级部署。
            - label: TensorRT / NVIDIA FP8 容器
              detail: 数据中心推理优化；相比全精度，VRAM 降低 40%、吞吐提高 40%。
        - label: 第三方市场端点
          detail: BFL 权重和 API 通过合作伙伴基础设施平台分发。
          items:
            - label: FAL.ai、Replicate 与 Together AI
              detail: 托管推理市场，提供 FLUX.2 托管端点。
            - label: Runware、Verda、Cloudflare、DeepInfra
              detail: 更多推理合作伙伴，用于更低延迟或特定区域部署。
        - label: 安全与治理层
          detail: 控制覆盖训练、推理和输出阶段。
          items:
            - label: IWF CSAM 哈希过滤 + 安全微调
              detail: 训练前和训练后的数据 / 行为缓解。
            - label: Hive + Microsoft 推理时过滤器
              detail: API 级 CSAM 和 NCII 输出过滤不可调。
            - label: API 输出中的 C2PA 加密元数据
              detail: 按 Content Credentials 标准，为所有 API 生成图像加来源水印。
    approximationNotes: 图层反映公开记录中的产品架构；BFL 未披露内部算力基础设施供应商。
    claimRefs:
