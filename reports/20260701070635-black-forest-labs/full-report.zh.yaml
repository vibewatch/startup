  - id: TV005
    title: 投资论点破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 据报约 $140M 的 Meta 合同流失、未续约或发生重大重谈
        - 该合同报道价值出现任何确认超过 25% 的下调
        - 移除计算 34x 倍数所依赖收入基数中的很大一块
        - 立即重新评估估值；确认前按投资论点破裂事件处理
      - - 新融资轮的 post-money 定价等于或低于 $3.25B
        - 任何确认定价轮等于 / 低于 Series B 标记
        - 市场定价给出的估值压缩直接信号，用可观察事实替代本章推断风险
        - 将估值立场下调为「昂贵」或「已确认 down round」，并重估任何此前入场假设
      - - 监管认定或诉讼确认直接点名 Black Forest Labs（而非品类范围诉讼），涉及 deepfake / CSAM 或版权问题
        - 任何将 BFL 列为当事方的正式诉状、指控或不利裁定
        - 把推断的声誉 / 监管悬顶，转化为直接法律和合规成本
        - 将风险评级重估为关键级，并在解决前暂停任何新资金承诺
      - - 确认的基准反转显示，FLUX.2 在独立评估中持续落后于 Nano Banana 2 或另一竞争对手
        - 连续 2+ 个独立评估周期中的持续基准落差
        - 削弱差异化论点中的模型质量组件，压低可实现倍数
        - 重新审视分发优势与质量护城河耐久性假设
      - - 已确认的企业级生成式 AI 预算收缩，影响 BFL 具名企业客户
        - Meta、Adobe、Canva 或 Snap 公开披露预算削减或供应商整合
        - 本章记录的企业 ROI 怀疑（CIO、Axis Intelligence）具体化为 BFL 实际收入影响
        - 按早期需求侧预警信号处理，并重新承销增长假设
    notes: 阈值是作者对推断风险何时变成已确认、破坏投资论点事件的判断；均非披露的合同契约。
    claimRefs:
