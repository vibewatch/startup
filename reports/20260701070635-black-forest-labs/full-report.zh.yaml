chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与总部
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs (BFL) 是一家私营前沿 AI 研究实验室，自称在「构建视觉智能」。其官网首页、关于页和企业页一致显示，团队总部在德国 Freiburg，并设有 San Francisco
              办公室。公司招聘页和关于页均称，截至 2026 年中团队约 70 人；公司估值已达 $3.25B，却只有约 70 人，团队不大但研究密度很高。创立时间是 2024 年 8 月，同月首批 FLUX.1
              模型（pro、dev、schnell 三档）公开发布，说明公司成立几乎直接接上产品入市，而不是经历了很长的隐身期。


              在私营基础模型公司里，BFL 的商业模式披露得少见清楚：首页把三条商业路径并列摆出——面向生产负载的托管
              API、供自托管和微调部署的开放权重下载，以及面向更大组织的企业级套餐，提供定制、专用基础设施和联合开发。企业页进一步给出具体信任信号（SOC 2 Type II、ISO 27001、GDPR 合规处理）和每月
              200,000 次生成起的批量价格，说明 BFL 不只是靠开放权重服务开发者，也在主动卖给受监管、重安全的买方。2026 年 6 月，BFL 依据 California AB 2013 提交 Training
              Data Disclosure，治理信号又多了一层：公司称其约从 2024 年开始收集自有训练数据，并持续推进，数据混合了授权内容、承包商标注内容、合成内容和内部生成内容；但披露没有点名具体数据来源或授权伙伴。
