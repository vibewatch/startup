  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: Black Forest Labs' cash on hand and monthly cash burn rate.
    whyItMatters: Without cash and burn figures, capital adequacy cannot be assessed independent of the headline Series B
      amount, and any runway estimate is unverifiable.
    diligencePath: Request the latest cash-flow statement, board deck, or investor update showing cash on hand and monthly
      burn.
    relatedQuestionRefs:
    - QI015
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: Black Forest Labs' runway in months.
    whyItMatters: Runway determines the urgency and timing of the next fundraising event and is a core underwriting input
      for capital-intensive AI labs.
    diligencePath: Derive runway once cash on hand and burn rate are disclosed, or request a direct runway estimate from management.
    relatedQuestionRefs:
    - QI016
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy-gap
    missingEvidence: Debt facilities, project-finance arrangements, or GPU lease obligations tied to Black Forest Labs' compute
      infrastructure.
    whyItMatters: Undisclosed debt or lease obligations could materially change the capital structure and residual claims
      ahead of equity holders.
    diligencePath: Request disclosure of any credit facilities, equipment financing, or GPU capacity leases and their repayment
      schedules.
    relatedQuestionRefs:
    - QI018
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Black Forest Labs' gross margin or cost of revenue by product line.
    whyItMatters: Without gross margin, list pricing cannot be translated into profitability, and the compute-cost intensity
      implied by a 32-billion-parameter model cannot be underwritten.
    diligencePath: Request a cost-of-revenue breakdown by API, enterprise, and licensing revenue lines, including GPU utilization
      and reserved-vs-on-demand compute mix.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: minor
    topic: open-weights-licensing
    missingEvidence: The specific commercial license fee for self-hosting Black Forest Labs' larger, non-Apache-2.0 FLUX.2
      model weights.
    whyItMatters: Open-weight commercialization is one of BFL's four monetization streams, but without a published or reported
      fee, its contribution to revenue cannot be sized.
    diligencePath: Request the commercial license fee schedule and count of paid license holders for FLUX.2 [dev] and related
      non-commercial-licensed weights.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI002
  - type: enumeration-incomplete
    severity: material
    topic: contract-terms-gap
    missingEvidence: Contract-level terms (duration, renewal, minimum commitments, termination clauses) for BFL's enterprise
      agreements with Meta, Adobe, Canva, or Snap.
    whyItMatters: Revenue durability and customer-concentration risk cannot be assessed without knowing renewal timing and
      termination rights on the contracts that make up most of BFL's estimated contract value.
    diligencePath: Request redacted master service agreement samples or a contract-renewal schedule for BFL's top enterprise
      accounts.
    relatedTableRefs:
    - TI005
