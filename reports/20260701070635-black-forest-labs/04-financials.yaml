        tone: warning
        detail: Andersen v. Stability AI (naming Midjourney and Runway) and EU AI Act GPAI duties apply category-wide.
      - label: medium
        tone: neutral
        detail: Litigation posture and regulatory text are public, but case outcomes and compliance spend are not.
      - label: low
        tone: warning
        detail: No disclosed legal reserve, settlement exposure, or compliance budget specific to BFL.
