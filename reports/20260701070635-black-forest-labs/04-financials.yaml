      - label: low
        tone: warning
        detail: No disclosed utilization rate, reserved-vs-on-demand mix, or total compute budget.
    - label: Enterprise contract pipeline
      values:
      - label: medium
        tone: neutral
        detail: Meta/Adobe/Canva/Snap relationships are reported, with an estimated ~$300M total contract value.
      - label: medium
        tone: neutral
        detail: Deal existence and approximate size are reported, but not audited.
      - label: low
        tone: warning
        detail: No contract-term, renewal, or termination-clause visibility; concentration risk is high if Meta anchors ~47%
          of value.
    - label: Litigation / regulatory cost exposure
      values:
