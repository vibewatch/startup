callouts:
- calloutType: insight
  title: BFL already has four distinct, partially-verifiable monetization surfaces
  body: A credit-priced hosted API, custom enterprise agreements (Meta reportedly ~$140M), paid open-weight commercial licensing,
    and third-party marketplace resale together support an estimated ~$96.3M in annualized 2025 revenue — a broader revenue
    base than a single-product AI lab, even though none of these figures are company-audited.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI017
- calloutType: risk
  title: Valuation and margin path face a sector-wide GenAI ROI and open-weight margin headwind
  body: An MIT-affiliated analysis found 95% of enterprise generative-AI pilots capture no measurable ROI, and separate 2026
    analysis argues open-weight models face near-zero inference costs that erode durable serving margins and warns that circular
    AI financing dynamics inflating sector valuations could unwind — both directly relevant to interpreting BFL's $3.25B valuation
    and open-weight strategy.
  claimRefs:
  - CI036
  - CI037
  - CI038
  - CI039
  - CI042
- calloutType: recommendation
  title: Do not underwrite BFL's financials without management data on cash, burn, margin, and contract terms
  body: Cash on hand, monthly burn, runway, gross margin, cost of revenue, headcount by function, and contract-level terms
    for BFL's largest enterprise deals are all undisclosed in every reviewed source; a financial diligence case cannot close
    on public evidence alone.
