  - TI004
- id: public-traction-versus-private-metric-gaps
  title: 'Public traction versus private-metric gaps: what analysts estimate and what BFL does not disclose'
  body: 'Two independent trackers, Sacra and CB Insights, both converge on roughly $96.3 million in annualized Black Forest
    Labs revenue as of 2025, and Sacra further estimates that the Meta contract alone could represent close to half of BFL''s
    ~$300 million in disclosed enterprise contract value — a meaningful single-customer concentration signal if that contract
    materializes at its reported size. Comparator disclosures from public companies illustrate both how far generative-image
    monetization can scale and how opaque it can remain even for filers: Adobe''s FY2025 Form 10-K does not break out Firefly-specific
    revenue at all, instead folding generative credits into broader Creative Cloud and Firefly subscription bundles, while
    Shutterstock''s disclosed Data, Distribution, and Services segment — which includes generative-AI licensing — grew 16%
    to $203.3 million in 2025 (21% of total revenue) even as its core content-licensing business faced continued pressure.


    None of BFL''s own equivalents to these figures are public. There is no audited revenue or ARR figure, no disclosed gross
    margin or cost of revenue, no customer-level revenue mix beyond the Sacra-reported Meta figure, no contract-level terms
    (duration, renewal, minimum commitments) for its largest enterprise deals, and no headcount breakdown by function that
    would let a diligence team separate R&D cost intensity from commercial go-to-market spend. Every number in this chapter
    that looks precise — $96.3 million, $140 million, $300 million — is a third-party estimate or reported deal value, not
    a company-disclosed financial statement line.'
