- id: capital-adequacy-and-financing-dependency
  title: 'Capital adequacy and financing dependency: a well-funded balance sheet with an opaque runway'
  body: 'BFL closed a $300 million Series B in December 2025 at a $3.25 billion post-money valuation, co-led by Salesforce
    Ventures and Anjney Midha''s AMP, with the round also retroactively disclosing a previously unannounced ~$31 million Series
    A from 2024 led by Andreessen Horowitz. Cumulative disclosed funding now exceeds $450 million across a syndicate that
    includes strategic corporate investors — NVIDIA, Adobe Ventures, Canva, Figma Ventures, Samsung NEXT, and Shutterstock
    — several of which are also BFL''s commercial customers, aligning cap-table incentives with product adoption. Third-party
    reporting describes the Series B proceeds as earmarked for Flux model development, compute infrastructure, and commercial
    operations, but this chapter''s research found no source publishing a specific budget allocation or burn-rate plan behind
    that description.


    What remains genuinely undisclosed is capital adequacy in the underwriting sense: no reviewed source states BFL''s cash
    on hand, monthly burn, or resulting runway in months, and none discloses any debt facility, project-finance arrangement,
    or GPU lease obligation that could sit ahead of equity in a downside scenario. No source discloses board composition,
    cap table detail, liquidation preferences, or debt covenants tied to the Series B either. Given that BFL''s own model
    releases show a compute-hungry, multi-month training cadence, the absence of burn and runway data is the single largest
    capital-adequacy gap in this chapter, and it cannot be inferred confidently from the funding headline alone.'
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI030
  - CI042
