  - type: missing-source
    severity: blocking
    topic: governance
    missingEvidence: A published board roster, cap table, or ownership/control document for Black Forest Labs.
    whyItMatters: >-
      Without a visible board or ownership map, key-person and control risk cannot be assessed and the
      leadership-and-founder table's governance row cannot be verified beyond hiring-page inference.
    diligencePath: >-
      Request board composition, cap table, and shareholder agreement directly from management or via a data room during
      diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: stakeholder or investor map completeness
    missingEvidence: >-
      Exact equity stakes, board/observer seats, and any secondary sales tied to the investors and enterprise partners
      listed in the stakeholder or investor map.
    whyItMatters: >-
      Public sources name investors and platform partners but not ownership percentages or governance rights, leaving
