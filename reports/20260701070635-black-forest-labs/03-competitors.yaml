    - Bundled into ChatGPT Business/Enterprise seats plus standalone token-priced API
    - Per-image cost basis mixes token pricing across model generations, harder to compare directly
  - - Adobe Firefly
    - Incumbent/adjacent competitor (embedded suite)
    - Adobe Creative Cloud scale; Firefly sold standalone and bundled
    - Existing Creative Cloud/enterprise design teams
    - IP indemnification, Content Credentials provenance, ETLA bundling leverage
    - Credit-overage costs often exceed forecast; indemnity scope/conditions vary by contract
  - - Ideogram
    - Direct model-level competitor (consumer subscription)
    - $80M Series A (Feb 2024) after $22.3M seed; a16z-led
    - Prosumers and developers wanting strong text-in-image rendering
    - Strong text-rendering accuracy, Free/Plus tiered subscription similar to Midjourney
    - Funding scale and disclosed revenue smaller than Midjourney or Runway
  - - Runway
    - Adjacent competitor (video-first, expanding to world models)
    - $315M Series E (Feb 2026) at $5.3B valuation; ~$1.05B total funding; ~$90M annualized 2025 revenue
    - Filmmakers, creative studios, enterprise media teams
    - No.1 on Artificial Analysis text-to-video benchmark; Getty/Lionsgate licensed-content partnerships
    - Historically large EBITDA losses from compute/training costs; video-first, not a direct static-image substitute
  - - Bria
    - Substitute/niche competitor (enterprise, licensed-data)
    - $40M Series B (Mar 2025), $65M total funding
    - Enterprises requiring fully licensed, IP-safe training data
    - Licensed data from 30+ partners (Getty, Envato, Alamy), patented attribution/compensation engine
    - Smaller funding and public scale than Stability AI, Runway, or OpenAI
  - - Recraft
    - Substitute/niche competitor (vector/brand assets)
    - $12M Series A (2024) + $30M Series B (2025) per third-party reporting; reported 4M+ users
    - Brand/design teams needing vector, illustration, and brand-consistent assets
    - Differentiated niche in vector/illustration generation vs. general photorealism
    - Narrower use case than general-purpose photorealistic image models
  - - Canva / Figma AI
    - Incumbent/adjacent competitor (embedded suite)
    - Canva and Figma's existing design-platform seat bases
    - Existing Canva/Figma design-tool subscribers
    - Zero-friction embedding inside tools buyers already use daily; bundled AI-credit allowances
    - Generative image quality and control depth generally lag dedicated model vendors
  - - Internal build (self-hosted open weights, incl. FLUX/Stable Diffusion)
    - Status quo / substitute
    - No vendor lock-in cost beyond compute; requires in-house ML capability
    - Enterprises with existing ML/infra teams and data-sovereignty needs
    - Full control over model, data, and deployment; avoids per-call API fees
    - Requires GPU infrastructure, ML engineering effort, and ongoing maintenance BFL/others otherwise absorb
  notes: Funding/revenue figures mix official disclosures, independent analyst estimates (Sacra), and reported venture-financing news; treat third-party estimates as directional, not audited figures. Rows cover the direct, incumbent, adjacent, substitute, and status-quo/internal-build classes visible in this chapter's reviewed evidence, not every departmental tool in the category.
