- id: TP003
  title: Pricing / packaging comparison
  columns:
  - vendor
  - public package
  - price/unit/contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - BFL
    - API + open-weights licensing + Enterprise tier
    - Per-megapixel API pricing ($0.014-$0.07) plus custom Enterprise agreements from 200,000 generations/month
    - Hosted API, open-weight self-hosting, task-specific endpoints, zero-retention enterprise tier
    - Enterprise contract pricing is negotiated/custom, not published
    - BFL is one of the few vendors publishing both a self-serve unit price and an open-weights path
  - - Midjourney
    - Basic/Standard/Pro/Mega monthly subscriptions
    - $10 / $30 / $60 / $120 per month with tiered Fast GPU hours; annual billing saves 20%
    - Fast + Relax + Stealth GPU-time modes, commercial usage rights on all paid tiers
    - No enterprise/API self-serve tier; no free trial
    - Simple, transparent consumer pricing, but no enterprise API/self-hosting path
  - - Stability AI
    - Stable Diffusion API + DreamStudio + open-weight self-hosting
    - Credit system, 1 credit = $0.01; per-model costs roughly $0.009-$0.08/image
    - API access, free/local self-hosted deployment, enterprise SOC 2/3 tier available
    - Enterprise/volume pricing negotiated, not published
    - Transparent self-serve unit pricing complements a genuinely free self-hosting option
  - - OpenAI (GPT Image)
    - Token-priced image API + ChatGPT Business/Enterprise bundling
    - Per-token pricing varies by model generation (GPT Image 2/1.5/1 mini) and quality tier; Business seats ~$20-25/user/month
    - Frontier image models, bundling with ChatGPT/Codex, admin/security controls
    - Exact per-image cost requires converting token pricing to a fixed resolution assumption
    - Distribution-bundled pricing can obscure true image-generation unit economics
  - - Adobe Firefly
    - Standard/Pro/Pro Plus/Premium standalone plans + Enterprise add-on
    - $9.99-$199.99/month standalone (per third-party pricing synthesis); Enterprise ~$24/user/month credit-pooled, per redress-compliance analysis
    - Generative credits for image/video/audio, IP indemnification, Content Credentials
    - Official Adobe pages did not expose exact dollar tiers directly; figures sourced from third-party pricing advisory
    - Credit-overage costs, not sticker price, typically drive the realized enterprise bill
  - - Ideogram
    - Free/Plus/higher paid tiers
    - Plus tier ~$15/month billed annually (save 25% vs monthly); free tier always available
    - Free credits, community gallery, API access on paid tiers
    - Higher tiers' exact pricing not fully retained from this chapter's fetch
    - Pricing undercuts Midjourney at entry while following a similar tiered-subscription model
  - - Runway
    - Free/paid tiers up to enterprise
    - Free 125 one-time credits; paid self-serve tiers $12-$95/user/month plus metered GPU-minute charges
    - Gen-4 text-to-video/image-to-video, Gemini integration, enterprise fine-tuning
    - 2024 revenue of ~$44M ran alongside a ~$155M EBITDA loss per third-party estimate
    - Aggressive compute spend funds rapid model iteration but pressures near-term margin
  - - Bria
    - API + enterprise licensing
    - Enterprise contracts and API access; exact public rate card not retained in this chapter's sources
    - Licensed-data models, attribution/compensation engine, on-prem/cloud deployment
    - Public self-serve pricing not found in reviewed sources; enterprise-only contact-sales model implied
    - Positioning skews fully toward enterprise deals rather than self-serve/prosumer pricing
  - - Recraft
    - Free/Basic/Pro/Team/Enterprise + API
    - Basic ~$10-$12.50/month, Pro/Advanced ~$16-$27/month, Team ~$18-$30/seat/month, Enterprise custom, per third-party pricing pages
    - Vector/illustration generation, commercial ownership on paid tiers, API access
    - Credits do not roll over; advanced tools can consume 10-20x credits per action
    - Niche vector/illustration positioning commands its own tiered pricing separate from photorealism vendors
  notes: Where official vendor pages did not expose exact dollar figures (Adobe Firefly, Recraft), this table cites third-party pricing-advisory synthesis pages explicitly rather than guessing; those cells should be treated as directionally accurate, not vendor-confirmed list prices.
