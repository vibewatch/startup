  rows:
  - - Midjourney
    - Direct model-level competitor (consumer subscription)
    - ~$500M 2025 revenue, ~163 employees, $0 VC funding raised
    - Individual creators, hobbyists, freelancers
    - Discord-native distribution, no free tier, highest reported market share among consumer tools
    - No open weights, no self-hosting, closed API surface
  - - Stability AI
    - Direct model-level competitor (open + API)
    - ~$50M est. 2024 revenue, ~$225M total funding, 2024 leadership/financial crisis since stabilized
    - Developers, enterprises wanting self-hosted open models
    - Open-weight Stable Diffusion family, SOC 2/SOC 3 enterprise tier, EA co-development deal
