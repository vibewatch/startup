- id: competitor-profiles
  title: 'Competitor Profiles: Scale, Funding, Target Customer, Product Scope, And Strategic Direction'
  body: 'The nine profiled competitors span a wide range of scale and capital structure. Midjourney is the clearest outlier: an estimated $500 million in 2025 revenue with roughly 163 employees and zero venture capital raised, funded entirely through four consumer subscription tiers priced $10-$120 per month. Stability AI sits at the other extreme of capital history — roughly $225 million raised since founding, an estimated $50 million in 2024 revenue, and a severe 2024 financial and leadership crisis from which a new CEO and fresh funding have since stabilized operations. Runway is the best-funded adjacent competitor, having closed a $315 million Series E in February 2026 at a $5.3 billion valuation (total funding near $1.05 billion), with revenue scaling from roughly $44 million (2024) toward a company-forecast $265-300 million by end-2025. Ideogram ($80 million Series A, February 2024) and Bria ($40 million Series B, March 2025, $65 million total) are smaller but well-capitalized niche players targeting text-rendering quality and licensed-data enterprise trust respectively. Recraft targets vector and brand-asset generation as a differentiated niche from general photorealism. OpenAI''s GPT Image models and Adobe Firefly, Canva, and Figma AI compete less on standalone funding scale and more on the distribution power of the ChatGPT, Creative Cloud, Canva, and Figma platforms into which they are bundled. BFL''s own enterprise tier — custom agreements starting at 200,000 generations per month with zero data retention and dedicated endpoints — positions it closer to Bria''s compliance-first enterprise model than to Midjourney''s or Ideogram''s prosumer-subscription approach.'
