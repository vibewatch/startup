callouts:
- calloutType: strength
  title: BFL is one of the few vendors combining open weights with a production API
  body: Only Stability AI matches BFL's open-weight-plus-API distribution model among the nine profiled competitors; every other direct or adjacent rival (Midjourney, OpenAI, Adobe Firefly, Ideogram, Runway, Bria, Canva/Figma) ships a fully closed model, which gives BFL a structurally lower switching cost for self-hosting enterprises.
  claimRefs:
  - CP021
  - CP027
- calloutType: risk
  title: Generative-image copyright litigation is an unresolved, industry-wide category risk
  body: The Getty v. Stability AI ruling was narrow and UK-specific; Andersen v. Stability AI/Midjourney/Runway goes to a US jury trial in September 2026, and Disney/Universal/Warner Bros. Discovery v. Midjourney remains in mediation. BFL's own training-data provenance should be diligenced against the same open legal questions facing its closest competitors.
  claimRefs:
  - CP034
  - CP035
  - CP036
  - CP037
- calloutType: insight
  title: No single competitor holds a runaway lead across funding, revenue, and benchmark rank
  body: Runway's $5.3B valuation, Midjourney's ~$500M zero-VC revenue, and Stability AI's 2024 near-collapse followed by recovery show a fragmented, still-shifting competitive set rather than one dominant incumbent BFL must displace; independent benchmarks show model quality itself converging across vendors.
  claimRefs:
  - CP015
  - CP008
  - CP033
  - CP038
