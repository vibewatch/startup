  evidenceGaps:
  - type: missing-source
    severity: material
    topic: diligence-gap
    missingEvidence: BFL's own market share, seat count, or head-to-head revenue comparison against any named competitor.
    whyItMatters: Without a comparable share metric, the competitive positioning in this chapter rests on independent benchmarks and each vendor's own disclosures rather than a verified head-to-head comparison, which limits how confidently BFL's relative scale can be assessed.
    diligencePath: Request BFL management for internal competitive-share estimates, win/loss data versus named competitors, or third-party API-traffic panel data (e.g., a2z/similarweb-style estimates) covering the same vendor set.
    relatedQuestionRefs:
    - QP028
  - type: conflicting-data
    severity: minor
    topic: diligence-gap
    missingEvidence: A standardized, apples-to-apples per-image price comparison across OpenAI's per-token image pricing, Stability AI's and Recraft's per-credit pricing, and Midjourney's flat monthly GPU-time allowance.
    whyItMatters: Different unit-pricing bases make it easy to under- or over-state BFL's relative cost-competitiveness without a common usage assumption.
    diligencePath: Build a standardized cost-per-generated-image model across vendors using a fixed resolution/quality assumption and re-run it each refresh as vendors update per-unit rates.
    relatedQuestionRefs:
    - QP029
  - type: private-evidence-only
    severity: material
    topic: diligence-gap
    missingEvidence: Negotiated enterprise-tier realized pricing (post-discount) for Adobe Firefly Enterprise, OpenAI Enterprise, and Google/Microsoft AI bundles.
    whyItMatters: List pricing and self-serve tiers do not reflect what large enterprise buyers actually pay, which is the pricing tier most likely to compete directly with BFL's own enterprise agreements.
    diligencePath: Request BFL sales/competitive-intelligence team for redacted enterprise deal comparisons or win/loss notes citing competitor pricing encountered in live procurement processes.
    relatedQuestionRefs:
    - QP029
