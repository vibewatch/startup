  topStrengths:
    - 创始人与市场匹配度很高：核心团队参与创造 latent diffusion，之后又靠开放核心分发模式商业化 FLUX。
    - BFL 有多条变现路径——API、企业授权、商业开放权重使用和市场渠道分发，而不是押在单一窄渠道上。
    - 公开证据显示其生态触达已经覆盖 Adobe、Canva、Figma、Mistral、Deutsche Telekom、Envato 和主要开发者市场。
  topRisks:
    - 审计收入、毛利率、烧钱速度、现金跑道和客户数仍未披露，估值只能依赖第三方估计。
    - 据报道的大客户集中度，尤其尚未确认的 Meta 合同，可能让少数续约对公司影响过大。
    - EU AI Act 合规、xAI/Grok 谱系带来的 deepfake/CSAM 外溢，以及更广泛版权诉讼，让监管和声誉风险维持高位。
    - 开放权重分发扩大采用面，但模型质量商品化后也可能压缩定价权。
