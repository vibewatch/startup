  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - control / certification / quality metric
      - status
      - scope
      - gap
    rows:
      - - C2PA cryptographic content provenance
        - Implemented on all API outputs
        - >-
          All FLUX.2 API-generated images receive cryptographically-signed C2PA metadata indicating model, timestamp,
          and editing history
        - >-
          C2PA metadata applies only to API outputs; self-hosted open-weight deployments are not required to embed
          provenance but reference code includes a pixel-layer watermarking example.
      - - Pre-training CSAM/NSFW data filtering
        - In place across all model generations
        - Pre-training data filtered for NSFW content and known CSAM hashes using IWF partnership
        - No public audit or external certification of filtering completeness.
      - - Adversarial third-party red-team evaluation
        - Conducted pre-release for FLUX.1 Kontext (21 checkpoints) and FLUX.2 [klein]
        - >-
          External evaluations focused on CSAM and NCII generation via text-only and image-reference attacks;
          FLUX.1 Kontext [dev] showed higher resilience than other open-weight models in final evaluation
        - Red-team scope and methodology details are described qualitatively; no public audit report.
      - - Inference-time CSAM/NCII filters (Hive + Microsoft)
        - Live on BFL API; non-adjustable for CSAM/NCII categories
        - API filters (Hive + Microsoft) cannot be removed or adjusted by developers for CSAM/NCII
        - >-
          Filters apply only to the hosted API; self-hosted open-weight deployments require implementers to apply
          their own filters per license terms.
      - - FLUX Non-Commercial License (dev/klein-9B)
        - Published and version-tracked
        - >-
          Governs non-commercial open-weight deployment; filters and manual review required as a condition of use;
          commercial deployment requires a paid license
        - >-
          License enforcement for open-weight self-hosters is not publicly documented; compliance is largely
          self-reported.
      - - Commercial Self-Hosted License Tiers (Builder / Platform / Professional / Enterprise)
        - Available via BFL licensing page; contact sales for Platform and above
        - >-
          Grants commercial rights to self-host FLUX.2 [dev] and [klein] 9B; fine-tuning and LoRA rights included;
          domain and usage limits vary by tier
        - Pricing for Platform, Professional, Enterprise tiers not publicly listed; requires sales contact.
      - - EU AI Act GPAI obligations
        - No public GPAI compliance statement found as of 2026-07-01
        - FLUX.2 at 32B and widely distributed likely qualifies as a GPAI model under EU AI Act definitions
        - >-
          BFL has not published a GPAI technical documentation summary or EU market obligation mapping; this is a
          material compliance gap for EU-based enterprise customers.
      - - API usage policy and developer terms
        - Published at bfl.ai
        - Prohibits unlawful content, CSAM, NCII, non-consensual imagery, and deepfakes
        - Enforcement metrics and policy-violation rates are not published.
    notes: >-
      Trust and compliance controls verified from BFL model cards, official documentation, and the C2PA content
      credentials standard. EU AI Act applicability is inferred from published regulation text; BFL has not
      confirmed or denied GPAI classification.
