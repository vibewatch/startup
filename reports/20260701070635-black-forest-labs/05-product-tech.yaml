  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      FLUX.2 [pro/max] scores highest on quality and production readiness, while FLUX.2 [klein] 4B leads on
      openness and real-time deployment; text rendering and world-knowledge are consistent weak points relative to
      Google Nano Banana Pro across all variants.
    data:
      columns:
        - Output quality
        - Editing capability
        - Openness / licensing
        - Real-time speed
        - Text rendering
        - Developer ecosystem depth
      rows:
        - label: FLUX.2 [max]
          values:
            - label: 'strongest'
              tone: positive
              detail: Highest ELO; grounding search adds real-world knowledge integration.
            - label: strong
              tone: positive
              detail: Up to 10 reference images; multi-turn editing.
            - label: closed
              tone: warning
              detail: API-only; no open weights; commercial pricing.
            - label: medium
              tone: neutral
              detail: Slower than pro/flex; grounding search adds latency.
            - label: strong
              tone: positive
              detail: Best text in FLUX.2 family but loses to Nano Banana Pro on complex infographics.
            - label: medium
              tone: neutral
              detail: API-only; no self-hosting ecosystem.
        - label: FLUX.2 [pro]
          values:
            - label: strong
              tone: positive
              detail: ELO 1030–1050; 66.6% text-to-image win rate over open-weight alternatives.
            - label: strong
              tone: positive
              detail: Multi-reference up to 10 images; 4MP editing.
            - label: closed
              tone: warning
              detail: API-only; commercial; no self-hosting of weights.
            - label: strong
              tone: positive
              detail: 2× speed upgrade in March 2026; no price change.
            - label: medium
              tone: neutral
              detail: Improved but still loses on wall-of-text and multilingual infographics.
            - label: strong
              tone: positive
              detail: Primary production endpoint; FAL/Replicate/Together AI distribution.
        - label: FLUX.2 [dev]
          values:
            - label: strong
              tone: positive
              detail: Best open-weight quality; 63.6% multi-reference win rate vs. Qwen-Image.
            - label: strong
              tone: positive
              detail: Unified generation+editing; multi-reference up to 10 images in one checkpoint.
            - label: partial
              tone: warning
              detail: Non-commercial open weights; commercial self-hosting requires paid BFL license.
            - label: low
              tone: warning
              detail: Full precision 90 GB VRAM; FP8 needs 18–24 GB; slow without quantization.
            - label: medium
              tone: neutral
              detail: Text rendering improved but not production-grade for dense typography.
            - label: 'strongest'
              tone: positive
              detail: Diffusers, ComfyUI, TensorRT, and HuggingFace full integration depth.
        - label: FLUX.2 [klein] 4B
          values:
            - label: medium
              tone: neutral
              detail: Quality exceeds models 5× its size per BFL; limited independent benchmarks.
            - label: medium
              tone: neutral
              detail: Multi-reference editing supported; quality bounded by distillation from base.
            - label: 'open'
              tone: positive
              detail: Apache-2.0; fully free commercial self-hosting; no royalties.
            - label: 'strongest'
              tone: positive
              detail: Sub-second inference; 13 GB VRAM minimum; real-time interactive use cases.
            - label: low
              tone: warning
              detail: 4B scale text rendering is weaker; less reliable on complex typography.
            - label: strong
              tone: positive
              detail: Diffusers and ComfyUI support; API and self-hosting both available.
        - label: FLUX.1 Kontext [dev]
          values:
            - label: strong
              tone: positive
              detail: KontextBench leading scores for multi-turn editing consistency; 12B model.
            - label: 'strongest'
              tone: positive
              detail: Purpose-built for in-context editing; best iterative editing with minimal drift.
            - label: partial
              tone: warning
              detail: Non-commercial open weights; commercial use requires paid license.
            - label: medium
              tone: neutral
              detail: Guidance-distilled for efficiency; faster than FLUX.2 [dev] but slower than klein.
            - label: medium
              tone: neutral
              detail: Text editing supported but not the primary differentiation.
            - label: 'strongest'
              tone: positive
              detail: FluxKontextPipeline in Diffusers; Replicate, FAL, Together AI, DataCrunch, Runware.
    approximationNotes: >-
      Cells are evidence-backed ordinal judgments from official benchmarks, model cards, and the independent Overchat AI
      comparison. Text rendering weakness relative to Nano Banana Pro is from the independent benchmark; BFL does not
      claim text rendering parity with Google Gemini 3 Pro Image.
    claimRefs:
