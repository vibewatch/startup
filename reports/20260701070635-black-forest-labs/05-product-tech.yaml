chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Black Forest Labs has built a multi-generation image-generation and editing platform anchored by the FLUX.2 family
    (32B rectified flow transformer + Mistral-3 24B VLM, up to 4MP, ten-reference editing) and the Apache-2.0 FLUX.2
    [klein] 4B model for consumer deployment. The open-core strategy—pairing inspectable open weights with commercial
    API endpoints—creates broad developer adoption and a defensible ecosystem, but leaves genuine product risks in
    benchmarking commoditization (FLUX.2 loses multiple tests to Google's Nano Banana Pro), the commercial-use friction
    of the non-commercial dev/9B weight tiers, and hardware requirements that exclude most consumer GPUs for the full
    32B model.
sections:
  - id: section-product-definition
    title: >-
      Product definition: Black Forest Labs delivers a tiered image-generation and editing platform spanning open weights,
      commercial APIs, developer tools, and task-specific FLUX Tools endpoints
    body: >-
      Black Forest Labs' product family is best understood as a platform with three concentric rings. The innermost ring
      is the model family itself, organized into generations and capability tiers. FLUX.1 [schnell] (Apache-2.0, 12B
      parameters) is the fastest open-source tier for personal use. FLUX.1 [dev] (non-commercial, 12B parameters)
      provides higher-quality open weights for researchers and developers. FLUX.1 Kontext [dev/pro/max] unifies image
      generation and editing into a single unified architecture, enabling iterative multi-turn editing with character and
      style consistency across edits—a capability BFL validated through the KontextBench benchmark covering 1,026
      image-prompt pairs across five task categories. FLUX.2 is the second-generation family: [pro] and [flex] are
      managed commercial API tiers, [dev] is a 32B open-weight checkpoint, and [klein] (4B Apache-2.0, 9B
      non-commercial) is size-distilled for consumer GPUs and real-time generation at sub-second latency. The middle
      ring is the integration ecosystem—official connectors for Diffusers, ComfyUI, and TensorRT; a hosted MCP server
      at mcp.bfl.ai with OAuth-only sign-in; and marketplace endpoints on FAL.ai, Replicate, Together AI, Runware,
      Cloudflare, and DeepInfra. The outermost ring is FLUX Tools—specialized task-focused API endpoints launched in
      H1 2026, including Virtual Try-On (VTO), Erase, and Outpainting—each fine-tuned to master a single task rather
      than relying on a general-purpose model. From a customer workflow perspective, a creative professional editing
      product images reaches BFL through the playground, the BFL API, or a marketplace; a developer building an app
      integrates the Diffusers FluxPipeline or the MCP server; an enterprise needing brand-specific consistency
      licenses open weights for self-hosting. The breadth of access modes is a deliberate product decision: BFL's
      open-core strategy depends on wide developer adoption of open weights to create network effects and research
      visibility, while the commercial API and licensing tiers convert that adoption into revenue.
