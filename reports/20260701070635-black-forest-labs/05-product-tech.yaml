  - id: section-architecture
    title: >-
      Architecture and operating model: FLUX.2 couples a 32B rectified flow transformer with a Mistral-3 24B VLM in a
      latent flow matching framework—raw full-precision inference requires 90 GB VRAM but FP8 quantization enables
      consumer RTX deployment
    body: >-
      FLUX.2 is built on a latent flow matching architecture that trains a mapping between noisy latents and clean
      image latents conditioned on text. The generative backbone is a 32-billion-parameter rectified flow transformer,
      which captures spatial structure, material properties, lighting, and compositional logic. Semantic grounding and
      world knowledge come from the Mistral-3 24B vision-language model, which is coupled to the transformer through a
      shared conditioning mechanism. A new FLUX.2 variational autoencoder (VAE), released under Apache-2.0, defines
      the latent space across all model variants and is designed to address the learnability-quality-compression
      trilemma: it achieves lower LPIPS distortion than the FLUX.1 and Stable Diffusion autoencoders while improving
      generative FID. FLUX.2 unifies text-to-image synthesis, image editing, and multi-reference composition in a
      single checkpoint, removing the need for separate models. For editing, image latents are initialized from input
      images and updated under the same flow process to preserve structure. The FLUX.2 [klein] sub-family (4B and 9B
      parameter models) are step-distilled from the FLUX.2 base model to achieve four-step inference, targeting
      sub-second generation. The 9B variant uses an 8B Qwen3 text embedder and fits in approximately 29 GB VRAM (FP16)
      or roughly 15 GB VRAM in FP8 quantization, while the 4B variant requires approximately 13 GB VRAM and runs on
      mid-range consumer NVIDIA RTX GPUs. Full-precision FLUX.2 [dev] inference requires 90 GB VRAM, dropping to 64 GB
      in low-VRAM mode, and to approximately 18–24 GB with FP8 quantization in a pipeline created jointly with NVIDIA
      and ComfyUI. NVIDIA documented 40% VRAM reduction and 40% performance improvement from FP8 quantization.
      Deployment modes include BFL's hosted API (managed endpoints), local self-hosting using BFL's reference
      inference code or the Diffusers FluxPipeline, ComfyUI's native FLUX.2 template with weight streaming, and
      TensorRT inference via the NVIDIA Pytorch container. Third-party marketplace inference is available on FAL.ai,
      Replicate, Together AI, Runware, Verda, Cloudflare Workers, and DeepInfra. The MCP server (mcp.bfl.ai) enables
      OAuth-authenticated generation from inside Claude, Cursor, Codex, Windsurf, and any MCP-compatible client with
      no API key management.
