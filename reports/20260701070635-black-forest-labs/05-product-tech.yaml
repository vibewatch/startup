      - CE031
      - CE033
      - CE034

callouts:
  - calloutType: strength
    title: Open-core Apache-2.0 strategy creates durable ecosystem flywheel
    body: >-
      FLUX.1 [schnell] and FLUX.2 [klein] 4B are fully commercial-friendly under Apache-2.0, making BFL models
      the default choice for developers building SaaS products who need open-weight commercial deployment without
      license negotiation. This creates adoption at scale that feeds enterprise sales for the higher tiers.
    claimRefs:
      - CE002
      - CE009
      - CE031
  - calloutType: risk
    title: FLUX.2 loses multiple independent benchmark tests to Google Nano Banana Pro
    body: >-
      An independent head-to-head test by Overchat AI found that Nano Banana Pro won every one of five tests
      including text-to-image quality, world knowledge grounding, prompt following, text rendering, and style
      transfer. FLUX.2's only clear advantage in that test was generation speed. This represents a credible
      differentiation gap on quality-sensitive workflows where text rendering and world knowledge matter.
    claimRefs:
      - CE033
      - CE034
  - calloutType: risk
    title: Commercial licensing friction for the best open weights creates a conversion funnel risk
    body: >-
      FLUX.2 [dev] and FLUX.2 [klein] 9B—the highest-quality open-weight options—require paid commercial
      licenses for production self-hosting. Developers who build on the non-commercial weights and discover this
      constraint at scale face a forced renegotiation. The Apache-2.0 4B model mitigates but does not eliminate
      this friction for quality-sensitive workflows.
    claimRefs:
      - CE036
      - CE037
      - CE039

