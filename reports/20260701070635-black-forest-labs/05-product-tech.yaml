  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-compliance
      missingEvidence: >-
        BFL GPAI technical documentation or EU AI Act compliance statement for FLUX.2 as a general-purpose AI model
        at 32B+ parameter scale with broad public distribution.
      whyItMatters: >-
        The EU AI Act imposes documentation, transparency, and copyright-summary obligations on GPAI models above
        the 10^25 FLOP training threshold; without a published statement, enterprise customers in the EU face
        compliance uncertainty when deploying BFL API products.
      diligencePath: >-
        Request GPAI technical documentation from BFL directly; check the EU AI Office's published GPAI compliance
        registry when it becomes available; review BFL's legal terms for any EU-market-specific disclosures.
      relatedQuestionRefs:
        - QE019

    - type: missing-source
      severity: minor
      topic: API-reliability
      missingEvidence: >-
        Independent SLA documentation or historical uptime metrics for the BFL API (status.bfl.ai); the status page
        was not directly fetchable during this research session.
      whyItMatters: >-
        Enterprise buyers deploying FLUX.2 [pro] in production workflows need to verify reliability SLAs; without
        independent uptime history, the reliability guarantee is based solely on BFL self-reporting.
      diligencePath: >-
        Access status.bfl.ai directly or use an independent uptime monitoring service (e.g., StatusGator) to
        collect historical incident data; request SLA commitments from BFL sales.
      relatedQuestionRefs:
        - QE011

    - type: missing-source
      severity: minor
      topic: research-roadmap
      missingEvidence: >-
        Explicit public roadmap for FLUX.2 multi-modal expansion (video and audio) beyond the March 2026 research
        paper signal; BFL does not publish a public product roadmap.
      whyItMatters: >-
        Investors and enterprise buyers cannot assess the pace or confidence of BFL's multi-modal expansion without
        a public roadmap; the research paper signal alone is insufficient to size the opportunity.
      diligencePath: >-
        Monitor BFL research page and arXiv for follow-on papers; request roadmap briefing from BFL directly.
      relatedQuestionRefs:
        - QE023

    - type: private-evidence-only
      severity: minor
      topic: architecture
      missingEvidence: >-
        Technical architecture details for FLUX.2 [klein] 4B beyond scale (4B parameters) and distillation
        lineage; the text embedder choice for the 4B variant (vs. 8B Qwen3 for the 9B) is not documented.
