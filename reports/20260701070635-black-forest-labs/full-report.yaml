  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer landscape: distinguishing paying customers, distribution partners, investors, and open-source users'
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs' customer base spans at least seven distinct segments that are easy to conflate:
              creative SaaS platforms that embed FLUX as a backend (Envato, Freepik/Magnific, Picsart), enterprise brand
              and telecom marketing teams that license bespoke fine-tuned models (Deutsche Telekom), AI-assistant
              vendors that ship FLUX-powered features inside a competing product (Mistral AI's Le Chat), a big-tech
              platform reportedly licensing the technology outright (Meta), marketplace/API distribution partners whose
              own developers are the actual usage-based payers (fal.ai, Replicate, Together AI, Runware), a large
              non-paying open-source/developer community downloading weights from Hugging Face and Civitai, and a small
              set of individual creative professionals and studios (Martin Scorsese, Apostle) whose value is more
              reputational than financial. Black Forest Labs' own enterprise page formalizes three commercial tiers for
              the paying segments -- Managed API (zero data retention, volume pricing from 200K generations/month),
              Self-hosted (on-prem/private-cloud, full data sovereignty), and Co-development (bespoke models, dedicated
              infrastructure, white-labeled UI) -- which maps roughly to increasing deal size and decreasing buyer
              count. A crucial nuance for diligence is that some names appear in more than one role: Canva and Figma
              Ventures are Series B investors in the same funding round that separately names Canva as a product partner
              "building on" BFL's models, meaning at least one logo blurs the line between capital provider and
              customer.
