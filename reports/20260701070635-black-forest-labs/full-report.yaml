  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and headquarters
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs (BFL) is a privately held frontier AI research lab that positions itself as the company
              "building visual intelligence," with official home, about, and enterprise pages consistently describing a
              Freiburg, Germany-headquartered team also operating a San Francisco office. The company's own careers and
              about pages both cite a team of approximately 70 people as of mid-2026, a small but research-dense
              headcount for a business now valued at $3.25 billion. Founding is dated to August 2024, the same month the
              first FLUX.1 models (pro, dev, and schnell tiers) publicly launched, tying company formation directly to
              product-market entry rather than a longer stealth period.


              The business model is unusually explicit for a private foundation-model company: the homepage frames three
              parallel commercial paths — a managed API for production workloads, open-weights downloads for self-hosted
              and fine-tuned deployment, and an enterprise tier for larger organizations wanting customization,
              dedicated infrastructure, and co-development. The enterprise page adds concrete trust signals (SOC 2 Type
              II, ISO 27001, GDPR-compliant processing) and volume pricing starting at 200,000 generations per month,
              evidence that BFL is actively selling into regulated, security-conscious buyers rather than only serving
              developers through open weights. A June 2026 Training Data Disclosure, filed under California's AB 2013
              law, adds a further governance signal: BFL states it began collecting proprietary training data around
              2024 and continues to do so, using a mix of licensed, contractor-labeled, synthetic, and internally
              generated content, though the disclosure stops short of naming specific data sources or licensing
              partners.
