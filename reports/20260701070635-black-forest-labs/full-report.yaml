      - number: '1.3'
        title: Funding history, valuation, and investor map
        blocks:
          - type: paragraph
            body: >-
              BFL's clearest capital anchor is the Series B: the company's own blog post and TechCrunch agree that BFL
              closed a $300 million round on December 1, 2025 at a $3.25 billion post-money valuation, co-led by
              Salesforce Ventures and Anjney Midha (AMP), with a long list of participants spanning a16z, NVIDIA,
              Northzone, Creandum, Earlybird VC, BroadLight Capital, General Catalyst, Temasek, Bain Capital Ventures,
              Air Street Capital, Visionaries Club, Canva, and Figma Ventures. TechNode Global's independent coverage
              extends that investor list further (StepStone Group, S32 Ventures, Notion Capital, Shutterstock,
              QuantumLight Capital, Cherry, Adobe Ventures, Deutsche Telekom's T.Capital, LEA Partners, SV Angel, Lux
              Capital, Samsung Next, Headline, and several named angels), and both Unite.AI and TechNode Global
              independently confirm that the round included a previously unannounced Series A. That earlier round is
              reported elsewhere at roughly $31 million, led by a16z with General Catalyst participating, and a16z's own
              careers page independently lists BFL as a Series A-stage portfolio company — corroboration that stops
              short of official confirmation of the exact amount.


              Two funding disclosures remain notably incomplete. First, no reviewed source discloses secondaries, debt
              or credit facilities, or a consolidated capitalization table; total lifetime capital is only estimable as
              "more than $450 million" from press aggregation rather than an audited figure. Second, several of BFL's
              named investors are simultaneously commercial partners — Canva, Figma, and Adobe Ventures all appear on
              both the investor list and the enterprise-customer list — which raises a conflict-of-interest and
              revenue-concentration question that public sources do not resolve. Enterprise adoption itself looks real:
              FLUX models are cited as powering Adobe, Canva, Figma, Meta, Microsoft, and Deutsche Telekom workflows,
              alongside developer-platform distribution through Hugging Face, Replicate, Fal.ai, and Together AI.
