  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary And Definition
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs (BFL) monetizes generative visual intelligence through three included-spend channels: a
              pay-per-generation hosted API priced per output megapixel (from $0.014 to $0.07 per image), open-weights
              licensing that lets enterprises fine-tune and self-host FLUX on their own infrastructure, and
              task-specific endpoints — outpainting, erase, and virtual try-on — that extend the model family into
              specialized commercial workflows such as catalog imagery. Third-party marketplaces (fal.ai, Replicate,
              Together AI) resell hosted access, partially capturing BFL's reach without full retail-price capture.
              Outside this boundary sit two large adjacent pools of spend this chapter deliberately excludes: incumbent
              creative-software subscriptions (Adobe Firefly, Canva Magic Media, Figma AI) that embed generative image
              features inside existing seat licenses rather than routing spend to BFL, and closed proprietary consumer
              subscriptions such as Midjourney-style monthly plans. Ideogram and Runway sit as adjacent status-quo
              substitutes — an open rival image model and a video-first generative model, respectively — that buyers can
              choose instead of, or alongside, FLUX. Upstream GPU and compute costs are a supplier-side input, not
              buyer-side market spend, and are likewise excluded from the demand-side boundary used throughout this
              chapter.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
