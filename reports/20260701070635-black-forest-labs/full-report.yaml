      - number: '1.2'
        title: Founders, current leadership, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              The founder story is unusually well anchored in primary research literature even where the exact founder
              count is contested. TechCrunch and AI Companies both name Robin Rombach, Patrick Esser, and Andreas
              Blattmann as BFL's co-founders and describe them as the researchers who created Stability AI's Stable
              Diffusion models; Nextomoro's independent profile goes further and names a fourth co-founder, Dominik
              Lorenz. The arXiv preprint of the 2024 rectified-flow scaling paper (the Stable Diffusion 3 research)
              lists all four names as co-authors alongside other Stability AI researchers, which corroborates that all
              four worked on the same core generative-modeling team immediately before BFL's founding, even though it
              does not by itself settle legal founder status. That combination gives the founding group unusually strong
              founder-market fit: the same people who helped invent latent diffusion and then scaled rectified-flow
              transformers are now commercializing the resulting technology under their own brand.


              Leadership visibility beyond the founders is thin. Independent press names Robin Rombach as Co-Founder and
              Chief Executive Officer, and BFL's own site confirms Martin Scorsese joined as a creative advisor and
              partner in June 2026 — a high-profile validation move that also drew public backlash from storyboard
              artists and peers such as Guillermo del Toro, and that was brokered through BroadLight Capital, an
              existing BFL investor tied to Scorsese's manager. None of BFL's official pages (home, about, careers,
              enterprise) publish a board roster, ownership breakdown, or a named executive bench beyond the CEO; the
              clearest signal of organizational depth instead comes from active hiring across research, robotics,
              partnerships, and office-management roles on Jobera and Built In. Key-person dependence on the founding
              research team therefore looks high, and governance transparency remains a clear diligence gap.
