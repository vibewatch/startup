          detail: One quantified reference (Envato) plus several logo-only or unconfirmed accounts.
          tone: warning
        - label: Moat / differentiation
          value: 5/10
          detail: Open-weight distribution moat offset by benchmark commoditization vs. Nano Banana 2.
          tone: warning
        - label: Unit economics visibility
          value: 2/10
          detail: No disclosed gross margin, burn, or cohort ARR.
          tone: negative
        - label: Risk rating
          value: High
          detail: Customer concentration, regulatory overhang, and technology-lineage exposure per the risks chapter.
          tone: negative
        - label: Valuation support
          value: 4/10
          detail: 34x implied multiple sits inside a wide 0.5x-59x comparable range with no DCF backstop.
          tone: warning
        - label: Evidence quality
          value: 6/10
          detail: >-
            34 sources across 27 domains this chapter, but core revenue and valuation figures remain third-party
            estimates.
          tone: neutral
