        title: 'Cost structure, compute intensity, and headcount: a 32-billion-parameter model run by a still-small team'
        blocks:
          - type: paragraph
            body: >-
              BFL's cost base is dominated by compute rather than a conventional SaaS cost structure. Its flagship
              open-weight model, FLUX.2 [dev], is a 32-billion-parameter rectified flow transformer, and the company's
              GitHub repository shows it shipped the faster klein family on January 15, 2026 — evidence of a training
              and release cadence of new model families roughly every few months rather than once a year. A useful
              external proxy for the marginal cost of running workloads at that scale is CoreWeave's public GPU pricing:
              on-demand H100 capacity was priced at approximately $2.70 per GPU-hour as of June 2026, which anchors how
              compute-cost-sensitive both training and high-volume inference are likely to be for a lab serving image
              and video generation at scale.


              Headcount evidence points to a capital-light team relative to valuation: BFL's own hiring pages and
              independent job aggregators describe a team in roughly the 10-to-200-employee range as of mid-2026 split
              between Freiburg and San Francisco, and the company is actively hiring research infrastructure engineers
              at $150,000-$300,000 base salary plus equity to operate multi-week GPU training runs. Set against Sacra's
              ~$96.3 million revenue estimate, that headcount would imply a revenue-per-employee ratio well above
              typical software peers, though still below andrew.ooo's reported ~$3 million-per-employee figure for the
              bootstrapped, VC-free Midjourney — a reminder that BFL's $450 million-plus of primarily equity-funded
              capital buys growth and compute capacity that a self-funded peer does not need. No reviewed source
              discloses BFL's gross margin or cost of revenue, so none of this can be converted into an actual margin
