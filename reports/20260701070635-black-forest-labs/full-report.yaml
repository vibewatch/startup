            body: >-
              Black Forest Labs' distribution strategy -- open weights plus marketplace listings on fal.ai, Replicate,
              Together AI, and Runware -- is an efficient land-and-expand engine for developer reach, but it also means
              a meaningful share of usage flows through channels the company does not fully control and does not
              disclose revenue-share terms for. At the other end of the size spectrum, the enterprise co-development
              tier concentrates commercial value in a small number of large, bespoke deals: if the reported figures are
              accurate, the Meta contract alone (~$140M across two years) would be equivalent to roughly 145% of Black
              Forest Labs' reported ~$96.3M ARR figure from August 2025 -- meaning a single account could represent
              revenue on the same order of magnitude as the company's entire prior run rate. Distribution through
              big-tech platforms (Azure AI Foundry, Meta, Mistral) extends reach but creates disintermediation risk if
              any of those partners builds a competing in-house model. Procurement friction is visible in the
              open-weight community itself: recurring Hugging Face discussion threads and a BigGo News report both
              describe confusion and "commercial barriers" around what counts as commercial use under the FLUX.1 [dev]
              Non-Commercial License, requiring a separate self-serve paid-licensing step that is not obviously
              communicated to first-time users. Finally, the company's history with xAI/Grok shows that customer
              concentration risk is not only financial: a single controversial customer relationship can attach lasting
              reputational and regulatory exposure to the brand even after the commercial relationship ends.
