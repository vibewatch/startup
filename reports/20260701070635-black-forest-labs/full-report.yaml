  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk taxonomy overview: six categories, from regulatory exposure to a founder-concentrated team'
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs' risk profile spans six categories that recur across the rest of this chapter: EU AI Act
              regulatory and GPAI compliance risk; deepfake/CSAM technology-lineage and copyright litigation spillover;
              customer, compute, and capital concentration; compute-cost and valuation risk set against a skeptical 2026
              AI-investment climate; open-weight licensing ambiguity; and small-team execution risk. On execution risk
              specifically, Black Forest Labs' own careers page describes a team of approximately 70 people, a small
              headcount relative to the EU AI Act compliance, multi-jurisdiction deepfake enforcement exposure, and
              enterprise-scale customer commitments the company already carries; Andreessen Horowitz's own jobs listing
              for the company still reflects Series A-era hiring language, suggesting some public documentation has not
              been refreshed since the December 2025 Series B. No source reviewed discloses headcount growth or
              attrition since that raise. Martin Scorsese's advisor relationship, promoted on Black Forest Labs' own
              site, previously drew public backlash from creative-industry peers including filmmaker Guillermo del Toro
              -- one concrete, already-experienced instance of the reputational-risk category discussed later in this
              chapter. Google's February 2026 Nano Banana 2 launch further compounds the competitive benchmark gap
              already identified against Black Forest Labs' FLUX.2 in the product-tech chapter, intensifying pressure
              across nearly every category below simultaneously.
