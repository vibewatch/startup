          distribution actually converts to paid usage
      - - Frontier model quality is a defensible differentiator
        - >-
          Independent benchmarking (Artificial Analysis) shows dozens of vendors' models directly comparable and rapidly
          converging in quality, commoditizing the base-model layer
        - high
        - >-
          Track BFL's benchmark rank trajectory over successive refreshes rather than a single snapshot; ask for
          churn/retention data tied to model-quality perception
      - - Incumbent creative suites cannot easily match frontier model quality
        - >-
          Adobe, Canva, and Figma can bundle 'good enough' generative image features into subscriptions buyers already
          renew, competing on distribution rather than quality
        - high
        - >-
          Assess how much of BFL's addressable demand sits inside seats already paying for Adobe/Canva/Figma, and
          whether those buyers would ever switch to a standalone vendor
      - - Enterprise buyers value BFL's zero-data-retention and dedicated-endpoint enterprise tier
        - >-
          Adobe markets a competing IP-indemnification guarantee, and Bria markets fully licensed training data, both
          aimed at the same enterprise trust/compliance buyer
        - medium
        - >-
          Compare procurement win/loss reasons across enterprise deals citing BFL versus Adobe/Bria trust claims
          specifically
      - - >-
          Generative-image vendors broadly are shielded from copyright liability because models do not store training
          images
        - >-
          The Getty v. Stability AI ruling is UK-specific and narrow, while Andersen v. Stability AI and
          Disney/Universal v. Midjourney remain unresolved in the US with a September 2026 jury trial pending
        - high
        - >-
          Diligence BFL's own training-data provenance and licensing posture against the same open legal questions
          facing Stability AI and Midjourney
      - - Midjourney's zero-VC, Discord-native growth proves distribution can be built without paid marketing
        - >-
          This distribution model depends on a specific community-platform dynamic that may not transfer to an
          API-first, developer/enterprise-focused vendor like BFL
        - medium
        - >-
          Evaluate whether BFL's own developer-community channels (Hugging Face, GitHub, Discord if any) show comparable
          organic-growth signals
      - - >-
          Video-generation convergence (Runway, OpenAI Sora, Google Veo) could subsume static image generation into
          broader multimodal platforms
        - >-
          BFL's roadmap and public disclosures reviewed in this chapter do not show a competing native video-generation
          product at Runway's or OpenAI's scale
        - high
        - >-
          Ask BFL for its video-generation roadmap and timeline versus Runway's Gen-4.5/GWM-1 and OpenAI's Sora-2
          releases
      - - >-
          Stability AI's 2024 near-collapse shows that even well-known open-model vendors can face existential financial
          risk
        - >-
          BFL's own capital adequacy and runway are covered in the Financials chapter; this register flags that
          competitor distress does not guarantee BFL's own resilience to similar compute-cost or funding-market pressure
        - medium
        - >-
          Cross-reference BFL's burn rate and runway (Financials chapter) against the compute-cost pressures that nearly
          sank Stability AI in 2024
    notes: >-
      Severity reflects how much a durability question could change underwriting assumptions about BFL's competitive
