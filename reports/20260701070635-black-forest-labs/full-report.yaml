            body: >-
              Black Forest Labs has not publicly disclosed net revenue retention, gross revenue retention, renewal
              rates, cohort data, or a customer-satisfaction survey as of the run date. The one concrete durability data
              point available is negative: Elon Musk's xAI, which used FLUX.1 to power Grok's image generator from
              mid-2024, stopped working with Black Forest Labs by April 2025, confirmed by Sifted's ongoing coverage and
              consistent with TechCrunch's original reporting on the partnership. That is a realized logo-churn event
              involving what was, at the time, one of the company's most visible customer relationships. Attempts to
              independently verify third-party review-platform ratings (G2) were blocked during this run by an anti-bot
              challenge, so satisfaction evidence is currently limited to a single production studio's published 8.1/10
              review and Envato's own account of sustained, expanding usage since FLUX.2's day-zero launch. Contract
              length is only partially inferable: secondary reporting on the Meta deal implies a roughly two-year
              structure ($35M in year one, $105M in year two), but this has not been officially confirmed and no other
              account's contract terms are disclosed. The overall picture is a data-availability gap rather than
              evidence of poor retention, but it is a genuine blocking gap for any durability-based valuation view.
