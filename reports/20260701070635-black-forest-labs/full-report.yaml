    rows:
      - - BFL
        - API + open-weights licensing + Enterprise tier
        - Per-megapixel API pricing ($0.014-$0.07) plus custom Enterprise agreements from 200,000 generations/month
        - Hosted API, open-weight self-hosting, task-specific endpoints, zero-retention enterprise tier
        - Enterprise contract pricing is negotiated/custom, not published
