      - - Midjourney
        - Basic/Standard/Pro/Mega monthly subscriptions
        - $10 / $30 / $60 / $120 per month with tiered Fast GPU hours; annual billing saves 20%
        - Fast + Relax + Stealth GPU-time modes, commercial usage rights on all paid tiers
        - No enterprise/API self-serve tier; no free trial
        - Simple, transparent consumer pricing, but no enterprise API/self-hosting path
      - - Stability AI
        - Stable Diffusion API + DreamStudio + open-weight self-hosting
