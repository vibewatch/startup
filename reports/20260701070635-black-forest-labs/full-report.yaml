  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Current financing and valuation context: a $3.25B mark on unaudited revenue'
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs closed a $300 million Series B in December 2025 at a $3.25 billion post-money valuation,
              confirmed by the company's own announcement and independent reporting. Two independent analyst trackers,
              Sacra and CB Insights, separately estimate the company's annualized 2025 revenue at roughly $96.3 million
              -- a figure already flagged in the financials chapter as a third-party estimate rather than an audited or
              company-disclosed number. Dividing the valuation by that revenue estimate implies a multiple of roughly
              34x, a number this chapter treats as directionally informative rather than precise, since both inputs (the
              $96.3M revenue estimate and the underlying methodology behind it) are unverified. Critically, Black Forest
              Labs has not disclosed cash on hand, burn rate, runway, gross margin, or the contract terms behind its
              largest customer relationships as of this run's July 2026 date. Entry discipline for any new investor
              therefore has to start from the position that the denominator of the multiple, not just the multiple
              itself, carries real uncertainty, and that the Series B's preference stack and dilution terms are entirely
              undisclosed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case rests on two structural points already developed elsewhere in this diligence: an
              open-weight-plus-API distribution model that reaches a broader developer and enterprise base than
              closed-API-only peers, and four distinct monetization surfaces -- hosted API credits, enterprise
              contracts, paid open-weight licensing, and marketplace resale -- that diversify revenue relative to
              single-surface peers like Midjourney or Ideogram. The anti-thesis is just as concrete: the ~$96.3 million
              revenue base behind the 34x multiple is an unaudited estimate; a single reported ~$140 million Meta
              contract could exceed all of prior-year revenue, concentrating the valuation's support in one
              relationship; FLUX.2 already loses multiple independent benchmarks to Google's Nano Banana 2; and Black
              Forest Labs' own technology lineage remains entangled in the 2026 Grok/xAI deepfake and CSAM regulatory
              crisis even though the commercial relationship ended around April 2025. None of these anti-thesis points
              is fatal in isolation, but together they mean the bull case requires several specific, currently
              unconfirmed assumptions to hold simultaneously.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
