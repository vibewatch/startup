      - number: '5.3'
        title: >-
          Deployment and integration: official Diffusers, ComfyUI, and MCP support create broad ecosystem reach—roadmap
          shows a march toward real-time and agentic workflows
        blocks:
          - type: paragraph
            body: >-
              BFL offers first-class integration with the two dominant self-hosting workflows for image generation.
              Hugging Face Diffusers supports all FLUX.2 models through the FluxPipeline, Flux2KleinPipeline, and
              FluxKontextPipeline APIs. ComfyUI gained day-0 FLUX.2 support with official tutorials and pre-built
              workflow templates from BFL and NVIDIA; NVIDIA also optimized ComfyUI's weight-streaming feature to allow
              FP8 FLUX.2 [dev] inference on GeForce RTX GPUs via system RAM offload. TensorRT integration is available
              through the NVIDIA Pytorch container for data-center deployments. The BFL MCP server (mcp.bfl.ai) is a
              hosted, OAuth-only remote server that exposes the full FLUX.2 toolkit—text-to-image, multi-reference
              editing, virtual try-on, variations, and history browsing—to any MCP-compatible client. Claude Desktop,
              Claude.ai, Claude Code, Cursor, Codex, Windsurf, and stdio-bridge clients via mcp-remote are all supported
              with specific per-client setup instructions in the public GitHub repo. BFL billing is direct: the
              organization selected during OAuth sign-in is charged at standard API rates with no middleman. The API
              itself is well-documented with a formal release notes page; key 2026 milestones include FLUX.2 [klein]
              launch (January 2026, sub-second generation at 13–29 GB VRAM), FLUX.2 [pro] 2× speed upgrade (March 2026,
              same price), FLUX.2 [flex] 3× speed improvement (January 2026), FLUX Outpainting (May 2026), FLUX Erase
              (May 2026), and FLUX Virtual Try-On (May 2026). A new outpainting fast mode launched June 9, 2026. The
              release cadence shows steady feature velocity with roughly one major endpoint or performance upgrade per
              month. The finetuning API was deprecated as of October 2025, which is a gap for teams that had built
              workflows on it. API reliability is tracked through a status page (status.bfl.ai); no major structural
              outages appear in the reviewed release notes, though the status page itself was not fetchable in this
              session's direct probe.
