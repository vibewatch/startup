      - number: '8.7'
        title: Thesis-break triggers, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The clearest thesis-break trigger identifiable from public evidence is a confirmed loss, non-renewal, or
              material renegotiation of the reported ~$140 million Meta contract, since that single relationship could
              represent a large share of the company's current revenue base. A second, more direct trigger is any
              confirmed new financing round priced at or below the $3.25 billion Series B mark; no source reviewed in
              this chapter identifies such a round having occurred or being reported as underway as of the run date, nor
              does any source contain secondary-market pricing or investor commentary specifically revising Black Forest
              Labs' own valuation. Exit readiness for the company today looks premature to assess in the absence of
              disclosed unit economics: there is no public evidence of IPO preparation, and the private M&A landscape
              for foundation-model companies remains unsettled per the adverse macro evidence in this chapter. The
              highest-priority final diligence asks are, in order: audited cash/burn/runway figures, a
              customer-revenue-concentration breakdown, gross margin by monetization surface, and Series B
              cap-table/liquidation-preference terms -- all four of which remain undisclosed across every chapter of
              this diligence.
