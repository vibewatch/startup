  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      BFL's product stack layers user access surfaces, model tiers, a shared inference framework, and cloud/edge
      deployment—all grounded in the FLUX.2 flow matching backbone.
    data:
      layers:
        - label: User access surfaces
          detail: End-user and developer entry points across hosted, self-hosted, and agentic surfaces.
          items:
            - label: BFL Playground and Web UI
              detail: Browser-based generation and editing for evaluation and casual use.
            - label: BFL API (REST endpoints)
              detail: Programmatic access to all FLUX.2 models with per-model and per-resolution billing.
            - label: FLUX MCP server (mcp.bfl.ai)
              detail: OAuth-authenticated remote MCP endpoint for Claude, Cursor, Codex, and Windsurf.
        - label: Model family tiers
          detail: Distinct model checkpoints spanning quality, speed, and open-weight access levels.
          items:
            - label: FLUX.2 [max / pro / flex]
              detail: Commercial API-only tiers; max adds grounding search; flex exposes step/guidance params.
            - label: FLUX.2 [dev]
              detail: 32B open-weight non-commercial checkpoint; highest open quality; 18–24 GB FP8 VRAM.
            - label: FLUX.2 [klein] 4B / 9B
              detail: Step-distilled models; 4B is Apache-2.0 fully commercial; 9B is non-commercial; sub-second inference.
            - label: FLUX.1 Kontext [dev/pro/max]
              detail: Unified generation+editing 12B model; multi-turn editing with character/style consistency.
            - label: FLUX Tools (VTO, Erase, Outpainting)
              detail: Specialized task-finetuned API endpoints; prompt-free or low-prompt operation.
        - label: Inference and integration layer
          detail: Standardized frameworks and tooling connecting model weights to developer workflows.
          items:
            - label: HuggingFace Diffusers (FluxPipeline / KontextPipeline / Klein Pipeline)
              detail: Primary Python self-hosting framework; supports FP8/BF16 quantization and VRAM offload.
            - label: ComfyUI node-based workflows
              detail: Day-0 support with official templates; NVIDIA weight streaming for RTX consumer deployment.
            - label: TensorRT / NVIDIA FP8 container
              detail: Data-center inference optimization; 40% VRAM reduction and 40% throughput gain vs full precision.
        - label: Third-party marketplace endpoints
          detail: BFL weights and API distributed through partner infrastructure platforms.
          items:
            - label: FAL.ai, Replicate, Together AI
              detail: Managed inference marketplaces with FLUX.2 hosted endpoints.
            - label: Runware, Verda, Cloudflare, DeepInfra
              detail: Additional inference partners for lower-latency or specialized regional deployment.
        - label: Safety and governance layer
          detail: Controls applied at training, inference, and output stages.
          items:
            - label: IWF CSAM hash filtering + safety fine-tuning
              detail: Pre-training and post-training data/behavioral mitigation.
            - label: Hive + Microsoft inference-time filters
              detail: Non-adjustable API-level CSAM and NCII output filtering.
            - label: C2PA cryptographic metadata on API outputs
              detail: Provenance watermarking for all API-generated images per Content Credentials standard.
    approximationNotes: >-
      Layers reflect publicly documented product architecture; internal compute infrastructure vendor is not disclosed
      by BFL.
    claimRefs:
      - CE001
      - CE002
      - CE012
      - CE013
      - CE016
      - CE019
      - CE020
      - CE022
      - CE023
      - CE035
      - CE038
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      A typical BFL production workflow starts with a user intent, routes through model selection and API or self-hosted
      inference, and delivers a C2PA-signed image output with optional safety-filter interception.
    data:
      nodes:
        - id: wf1
          label: User or developer initiates generation / edit task
          detail: >-
            Entry point can be the BFL Playground, REST API call, MCP client prompt (Claude/Cursor), or programmatic
            Diffusers/ComfyUI pipeline.
          tone: neutral
        - id: wf2
          label: Model selection
          detail: >-
            User or orchestration layer selects tier: max (highest quality), pro (production), flex (typography),
            klein-9B (fast, non-commercial), klein-4B (fast, Apache-2.0), or dev (research).
          tone: neutral
        - id: wf3
          label: Reference images / context attached
          detail: >-
            Up to 10 reference images supplied for multi-reference conditioning; prior-generation request_id for
            variations; image mask for Erase or Outpainting.
          tone: positive
        - id: wf4
          label: Flow matching inference runs
