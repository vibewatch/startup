      - number: '8.4'
        title: 'Adverse macro context: bubble skepticism, down-round precedent, and enterprise ROI doubt'
        blocks:
          - type: paragraph
            body: >-
              Several independently sourced 2026 signals argue for a risk discount on any generative-AI valuation,
              including Black Forest Labs'. Forbes reporting from June 2026 describes an emerging token-price war among
              foundation-model labs driven by enterprise pushback on AI costs -- Uber, for instance, capped per-engineer
              AI-tool spend at $1,500 per month after exhausting its 2026 AI coding budget in four months -- a dynamic
              that could compress margins across the AI supply chain broadly. CNBC reported in June 2026 that PitchBook
              data identifies more than 220 formerly billion-dollar-valued U.S. startups as 'fallen unicorns,' with
              2021-vintage companies worth 68% less on average and 2022-vintage companies down 52%, evidencing
              broad-based down-round risk across venture-backed technology generally, even though CNBC's own sourcing
              suggests AI-native companies face relatively less of this specific pressure than 'pre-AI' companies.
              Separately, CIO and Axis Intelligence both cite MIT's finding that 95% of enterprise generative-AI
              projects fail to show measurable financial return within six months, alongside rising project-abandonment
              rates -- a demand-side risk directly relevant to Black Forest Labs' enterprise API and licensing revenue
              lines. None of this evidence names Black Forest Labs specifically, so it is treated here as an inferred,
              sector-level risk rather than a company-specific one.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV051
      - number: '8.5'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Black Forest Labs' revenue keeps growing toward Runway's ~$90 million or
              Midjourney's ~$500 million scale, its enterprise contracts (Meta, Adobe, Canva, Snap) renew, and
              private-market risk appetite for foundation-model companies persists -- supporting a follow-on round at or
              above the current $3.25 billion mark. The base case assumes revenue growth continues but the multiple
              itself compresses toward the more skeptical 2026 private-AI-market average implied by the CNBC and
              Perspective Labs bubble-skepticism evidence, producing a similar or modestly different valuation on a
              lower multiple. The bear case assumes the reported Meta contract is not renewed or is renegotiated
              downward, FLUX benchmark commoditization continues, and broader down-round pressure reaches AI-native
              private companies, producing a down round below $3.25 billion. None of these scenarios can be assigned a
              precise probability from public evidence; this chapter instead reports qualitative probability signals
              tied to the specific evidence supporting or undermining each case.
            claimRefs:
              - CV040
