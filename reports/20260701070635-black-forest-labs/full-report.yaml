  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer / process / component
      - role
      - dependency
      - risk
    rows:
      - - Rectified flow transformer (32B, FLUX.2 backbone)
        - Core generative engine; learns noise-to-image latent mapping; handles generation and editing
        - GPU compute (NVIDIA A100/H100/RTX 5090 or equivalent); CUDA runtime
        - >-
          Full precision requires 90 GB VRAM; accessible on consumer hardware only with FP8 quantization; no published
          architecture details beyond scale and paradigm.
      - - Mistral-3 24B VLM (text conditioner)
        - Semantic grounding, world knowledge, and complex prompt adherence for FLUX.2
        - Mistral AI model license/availability; included in FLUX.2 weights via coupling
        - >-
          Dependency on a third-party model family introduces supply chain risk; architecture not independently
          auditable; FLUX.2 lacks negative prompt support as a direct consequence of the VLM-based approach.
      - - FLUX.2 VAE (variational autoencoder)
        - Latent space definition; balances learnability, quality, and compression; shared across all FLUX.2 variants
        - Apache-2.0; hosted on Hugging Face; BFL-maintained
        - >-
          If BFL changes the VAE in future generations, existing custom pipelines built on current latents may require
          retooling.
      - - FLUX.2 [klein] distillation (4B / 9B)
        - Step-distilled inference; sub-second generation on consumer GPUs via 4-step sampling
        - Parent FLUX.2 base model; distillation training pipeline at BFL
        - >-
          Quality ceiling is bounded by the distillation process; independent quality benchmarks for the 4B are limited;
          non-commercial license for 9B creates commercial deployment friction.
      - - Diffusers integration (FluxPipeline / FluxKontextPipeline / Flux2KleinPipeline)
        - Python inference framework for BFL models; used by the majority of developer self-hosters
        - Hugging Face Diffusers library; requires git main branch for FLUX.2 and Kontext
        - >-
          HuggingFace library version fragmentation (FLUX.2 requires the git main branch until stable release); VRAM
          offload behavior varies by GPU and driver version.
      - - ComfyUI integration
        - Node-based visual inference workflow; primary local deployment UI for creative professionals and community
        - ComfyUI open-source project; NVIDIA weight streaming; community model sharing
        - >-
          Community-driven; not under BFL direct control; workflow fragmentation across FLUX.1, Kontext, and FLUX.2
          naming schemes creates integration confusion.
      - - BFL API and hosted endpoints
        - Managed inference for [pro], [flex], [max], [klein] commercial tiers; primary revenue surface
        - BFL's own infrastructure; GPU compute supply (likely CoreWeave or similar)
        - >-
          Cloud compute cost dependencies; status page (status.bfl.ai) not independently verified in this session; no
          public SLA published for API availability.
      - - MCP server (mcp.bfl.ai, OAuth)
        - AI coding assistant integration surface; exposes full FLUX.2 toolkit to MCP clients without API key management
        - OAuth identity provider; BFL account and credit balance; MCP-compatible client
        - >-
          OAuth-only blocks clients that cannot handle browser-based auth flows without mcp-remote shim; per-client
          setup required; alpha/beta maturity as an integration layer.
      - - Safety filtering (Hive, Microsoft, BFL in-house)
        - Inference-time CSAM/NCII blocking; text prompt and output image filtering
        - Third-party filter providers (Hive, Microsoft); IWF CSAM hash database
        - >-
          Dependency on commercial third-party filter vendors for safety-critical functions; filter evasion risk from
          adversarial prompting in open-weight self-hosted deployments.
    notes: >-
      Architecture details are based on BFL's own blog post, model cards, and official documentation. Internal compute
      infrastructure vendor is not publicly disclosed; GPU cloud dependency is inferred from public deployment patterns.
