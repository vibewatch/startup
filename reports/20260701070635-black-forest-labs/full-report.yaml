      - number: '2.4'
        title: Growth Drivers And Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Four forces push adoption forward: independent comparisons of ten FLUX variants describe clear
              speed/quality/price tiering that lowers the bar rivals must clear; FLUX.2 [klein] claims sub-second
              inference more than 30% faster than competing models at a $0.014 price floor, expanding real-time and
              high-volume use cases; 59% of enterprises now invest at least $1 million annually in AI technology per
              Writer's 2026 survey, growing the addressable budget pool; and open-weight distribution across Hugging
              Face, GitHub, and marketplaces creates an adoption flywheel closed rivals cannot easily replicate. Several
              forces constrain that same trajectory: the same Writer survey found only 29% of companies see significant
              AI ROI and 75% of executives call their AI strategy 'more for show,' meaning budget growth may not convert
              into durable renewals; the EU AI Act's general-purpose-AI transparency and systemic-risk obligations enter
              enforcement in August 2026 and apply directly to Freiburg-headquartered BFL, even as more than 45
              executives have publicly lobbied to delay that enforcement by two years; switching cost is structurally
              low because marketplaces let developers swap FLUX for rival models with a configuration change; and BFL's
              own release cadence — a new FLUX.2 generation roughly every seven weeks across November 2025-January 2026
              — implies sustained, capital-intensive training investment that raises the bar for new entrants while
              straining BFL's own compute budget.
