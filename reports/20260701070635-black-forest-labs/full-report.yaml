      - number: '3.3'
        title: Capability, Pricing, GTM/Distribution, And Trust/Regulatory Comparison
        blocks:
          - type: paragraph
            body: >-
              BFL is one of very few vendors in this set shipping genuine open-weight checkpoints alongside a hosted
              API; Stability AI is the only other profiled competitor doing so at flagship scale, while Midjourney,
              Ideogram, Adobe Firefly, and Runway keep their flagship models fully closed. Independent,
              non-vendor-authored benchmarking on Artificial Analysis's leaderboard places FLUX.2 variants directly
              alongside GPT Image 2, Ideogram 3.0, Recraft V4.1, and Seedream 5.0, giving buyers a neutral capability
              comparison that does not depend on any single vendor's own marketing claims. Pricing models diverge
              structurally rather than just numerically: Midjourney and Ideogram sell flat monthly consumer
              subscriptions, Stability AI, Recraft, and BFL itself price on a per-credit or per-megapixel API basis,
              OpenAI mixes per-token API pricing with ChatGPT seat bundling, and Adobe Firefly bundles consumption
              credits inside Creative Cloud or a negotiated Enterprise add-on. On distribution, Adobe, Canva, and Figma
              compete primarily on workflow embedding inside suites their buyers already renew rather than on frontier
              model quality, while OpenAI and Google can bundle image generation into already-distributed chat and
              productivity products — a channel-power advantage BFL does not have as an API-only/open-weights vendor. On
              trust and compliance, Adobe is the only profiled competitor publicly marketing a bundled
              IP-indemnification guarantee, while the emerging Content Credentials (C2PA) provenance standard is
              becoming an industry-wide trust benchmark that increasingly matters alongside, or instead of,
