              the Series B proceeds as earmarked for Flux model development, compute infrastructure, and commercial
              operations, but this chapter's research found no source publishing a specific budget allocation or
              burn-rate plan behind that description.


              What remains genuinely undisclosed is capital adequacy in the underwriting sense: no reviewed source
              states BFL's cash on hand, monthly burn, or resulting runway in months, and none discloses any debt
              facility, project-finance arrangement, or GPU lease obligation that could sit ahead of equity in a
              downside scenario. No source discloses board composition, cap table detail, liquidation preferences, or
              debt covenants tied to the Series B either. Given that BFL's own model releases show a compute-hungry,
              multi-month training cadence, the absence of burn and runway data is the single largest capital-adequacy
