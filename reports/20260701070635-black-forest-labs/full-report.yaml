      - number: '2.2'
        title: Multi-Lens Market Sizing
        blocks:
          - type: paragraph
            body: >-
              No single published number safely describes this market. Five analyst lenses, reviewed directly for this
              chapter, disagree by roughly 19x for the nearest comparable year: Fortune Business Insights values the
              narrow, standalone AI image-generator tool category at $484.29 million in 2026 growing to $1.75 billion by
              2034 (17.40% CAGR); Grand View Research and Research and Markets sit close to that same narrow scope at
              $349.6 million (2023) and $0.51 billion (2026) respectively; SkyQuest sizes a mid-scope definition at
              $2.39 billion (2024); and Market.us, cited via Axis Intelligence Research, sizes the full ecosystem —
              tools, APIs, editing, and enterprise visual pipelines — at $9.1 billion in 2025, projected to $272.8
              billion by 2035 at a 40.5% CAGR. The broader generative AI market across all modalities is estimated at
              roughly $59 billion in 2025, with enterprise generative-AI spending overall near $37 billion, giving
              upper-bound demand-side context beyond image-specific tools. North America holds roughly 40% revenue share
              in 2025 reporting, with Asia-Pacific cited as the fastest-growing region. None of the five lenses isolates
              BFL's own revenue or unit share, so this chapter preserves the full range rather than picking one figure
              as ground truth.
