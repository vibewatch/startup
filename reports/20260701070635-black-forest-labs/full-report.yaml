            body: >-
              BFL closed a $300 million Series B in December 2025 at a $3.25 billion post-money valuation, co-led by
              Salesforce Ventures and Anjney Midha's AMP, with the round also retroactively disclosing a previously
              unannounced ~$31 million Series A from 2024 led by Andreessen Horowitz. Cumulative disclosed funding now
