      - number: '8.6'
        title: 'Recommendation: research-more, not buy or avoid'
        blocks:
          - type: paragraph
            body: >-
              Given an unaudited revenue base, an undisclosed cost structure, single-customer concentration risk near
              total prior-year revenue, and a 2026 macro climate this chapter documents as skeptical of generative-AI
              valuations broadly, the evidence supports a research-more stance rather than a buy or avoid call on Black
              Forest Labs at its current $3.25 billion mark. This is not a negative judgment on the underlying business
              -- the market-analysis, product-tech, and customers chapters all document real commercial traction -- but
              a statement that the valuation-specific evidence available as of July 2026 is insufficient to underwrite a
              price with confidence. Black Forest Labs' open-weight distribution model also carries a specific
              structural risk worth flagging for the recommendation itself: Stability AI's own 2024 near-collapse, after
              its open-weight monetization was commoditized, is a documented cautionary precedent for how open
              distribution can erode a vendor's own pricing power over time, and nothing in the evidence reviewed
              confirms Black Forest Labs is structurally immune to the same dynamic.
