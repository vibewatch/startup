              Shutterstock trades at roughly 0.5x FY2025 revenue and Adobe's market cap is down ~51% over the trailing
              year as of July 1, 2026, while Black Forest Labs' Series B implies roughly 34x revenue. Public and private
              markets are clearly pricing AI-exposed creative businesses very differently right now, and that gap itself
