      - number: '1.4'
        title: Milestones, product cadence, and adverse risk signals
        blocks:
          - type: paragraph
            body: >-
              The fullest chronology of record runs from the founders' 2021 Latent Diffusion Models paper and their 2024
              rectified-flow scaling work at Stability AI, through the August 2024 founding and FLUX.1 launch, to the
              November 2025 FLUX.2 launch (including a 32-billion-parameter open-weight [dev] variant) and the January
              2026 FLUX.2 [klein] fast-inference family. The December 2025 Series B and the March 2026 Nemotron
              Coalition membership with NVIDIA Research mark the strongest recent scale and partnership signals, while
              the June 2026 Training Data Disclosure is the clearest governance milestone in the public record. Product
              cadence is fast and the coalition and enterprise relationships (Adobe, Canva, Meta, Microsoft, Deutsche
              Telekom) suggest real commercial traction rather than only research prestige.


              Adverse signals are concentrated but material. xAI's Grok chatbot used BFL models for image generation
              before the relationship reportedly ended in April 2025 amid controversy over Grok producing explicit, fake
              images — a downstream-misuse event that shows platform-dependency and reputational risk even when BFL
              itself did not directly cause the misuse. The same month, Sifted characterized BFL as "Europe's most-hyped
              — and elusive" startup, and in July 2025 BFL joined Mistral and other European AI startups in publicly
              calling to pause EU AI Act implementation, aligning with a broader industry lobbying push (more than 45 EU
              business leaders separately sought a two-year delay). That lobbying sits against a firm regulatory
              backdrop: GPAI obligations under the EU AI Act have applied since August 2, 2025, and Commission
              enforcement powers begin August 2, 2026, meaning BFL's compliance posture will be tested on the same
              timeline it lobbied to extend. A reported $140 million Meta deal (September 2025) remains unconfirmed by
              the company, and a low-reputation aggregator's factual error about the founding year (2022 instead of
              2024) further illustrates how uneven and occasionally unreliable BFL's secondary media coverage can be.
