      - number: '8.3'
        title: 'Comparable valuation landscape: a 0.5x-to-59x spread with no consistent anchor'
        blocks:
          - type: paragraph
            body: >-
              This chapter fetched current 2026 figures for six comparables spanning public incumbents and private
              peers. Adobe's market capitalization stood at approximately $81.5 billion on July 1, 2026, down roughly
              51% over the trailing year, though its FY2025 10-K does not break out Firefly-specific revenue, limiting
              it as a clean per-product comparable. Shutterstock's market cap of roughly $512.5 million against FY2025
              revenue of $989.9 million implies a public multiple of only about 0.5x revenue -- a striking contrast to
              Black Forest Labs' own ~34x private mark. On the private side, Runway's $5.3 billion valuation against its
              ~$90 million annualized revenue implies roughly 59x, meaning at least one well-funded adjacent peer is
              priced even richer than Black Forest Labs. Midjourney, Stability AI, and Ideogram all lack a
              primary-sourced valuation event recent enough to anchor a defensible multiple: Midjourney has no funding
              round at all, Stability AI's valuation estimates range from roughly $1 billion to $2.8 billion depending
              on the source, and Ideogram's most recent public financial reference points are roughly two years stale.
              The honest conclusion is that no single consistent multiple exists for this comparable set in mid-2026,
              which argues against asserting a precise fair-value figure for Black Forest Labs from comps alone.
