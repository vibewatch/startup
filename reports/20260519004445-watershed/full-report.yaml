  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape segmentation: direct specialists, suite incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitor set is better understood as two concentric circles rather than one flat leaderboard. The
              closest climate-first specialists are Persefoni, Sweep, Normative, SINAI, Plan A, and Greenly. Independent
              comparison sources repeatedly place those vendors in the same carbon-accounting category as Watershed,
              while TechTarget separately highlights IBM, Microsoft, SAP, and Salesforce as ecosystem-tied platforms.
              That distinction matters because Watershed’s cleanest product overlap is usually with climate-first
              specialists, but its hardest budget competition can come from incumbent suites or disclosure tools that
              ride on an existing ERP, CRM, cloud, or finance program.


              The status quo is also a real rival. SINAI explicitly pitches against spreadsheets and consultants, while
              Normative sells a built-in advisor model that substitutes for external methodology support. Position Green
              similarly markets one ESG data hub that replaces fragmented reporting workflows. In practice, a buyer
              choosing not to adopt Watershed may still satisfy part of the job with an incumbent suite, a disclosure
              layer, internal build, or advisory-heavy process. That makes the real market broader than named software
              logos and supports treating substitute workflows as part of competitive analysis, not as a separate
              chapter-only background fact.
            claimRefs:
