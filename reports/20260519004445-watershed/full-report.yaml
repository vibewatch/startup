  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold / event
      - action implication
    rows:
      - - California demand rollback
        - SB 261 stay persists and SB 253 preparation converts poorly
        - Pipeline or bookings tied to California compliance miss plan for two consecutive quarters
        - Treat compliance-led growth assumptions as overstated and re-underwrite sales efficiency.
      - - EU Omnibus demand compression
        - EU pipeline does not refill after new thresholds are applied
        - Management cannot show stable win rates in the reduced in-scope cohort or outside pure reporting use cases
        - Cut Europe-led growth assumptions and emphasize non-reporting product value in diligence.
      - - Methodology replay
        - Standards update forces broad restatement of historical outputs
        - Multiple customers must rerun footprints, reports, or supplier baselines because standards moved materially
        - Increase expected service cost and treat audit claims as less durable.
      - - AI trust failure
        - Material customer correction, public complaint, or audit miss traces back to AI-generated output
        - One regulated filing or customer report requires public correction because model-generated content was wrong
        - Pause any premium multiple for AI leverage until governance metrics are independently validated.
      - - Bundled competition
        - Incumbent suites win share on price or existing-suite attachment
        - Watershed loses named deals to Microsoft, Salesforce, SAP, or Workiva on bundle economics or CIO preference
        - Assume lower price realization and longer cycles in the base case.
      - - Marketplace credibility
        - Removal project underdelivers or claim language triggers legal scrutiny
        - A curated project reversal, missed delivery, or AB 1305 / FTC complaint touches Watershed-enabled claims
        - Treat the marketplace as a liability amplifier rather than only an upsell vector.
      - - Opacity and concentration
        - Private data reveals concentrated exposure or weak renewals
        - Top-10 customers or sectors drive an outsize share of ARR, or NRR is below software-quality expectations
        - Reset valuation to reflect concentration and implementation-heavy retention risk.
    notes: Thresholds are diligence heuristics for underwriting rather than management guidance or public commitments.
    claimRefs:
