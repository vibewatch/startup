  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and practical substitutes
        blocks:
          - type: paragraph
            body: >-
              Watershed’s practical market is best defined as enterprise climate and sustainability system-of-record
              software rather than the entire climate-tech, consulting, or decarbonization universe. The core included
              spend is software that ingests enterprise and supplier data, calculates Scope 1, 2, and 3 inventories,
              maps controls to disclosure frameworks, supports assurance, and helps teams steer reductions. That broader
              boundary is visible across the retained evidence: analyst pages describe carbon accounting or carbon
              management software, Workiva adds evidence-linked disclosure and assurance workflows, and SAP, Microsoft,
              Salesforce, and IBM all sell ESG data, reporting, and operational steering modules inside larger
              enterprise suites.


              The exclusion line matters just as much. This chapter does not count pure consulting labor, offsets,
              renewable-energy purchases, sensors, or the full contract value of ERP, CRM, or cloud platforms unless the
              spend is directed to climate or ESG modules. The buyer can still solve parts of the job with Excel,
              consultants, supplier questionnaires, or existing suite modules, so the category is real but porous. For
              Watershed, that means the competitive set is broader than point carbon-accounting vendors, while the
              usable TAM is narrower than every dollar ever labeled sustainability.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM045
          - type: table
            tableRef: TM001
