  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what remains opaque
        blocks:
          - type: paragraph
            body: >-
              Watershed's public materials support a straightforward high-level monetization story but not a fully
              underwritable one. Official product pages show a measure-report-act enterprise platform, a dedicated
              supply-chain workflow, and a product-footprint offering for sustainable procurement. That evidence is
              consistent with a modular enterprise software model in which the base platform can expand into supplier
              engagement, reporting, and product-footprint work. What is missing is the commercial layer: the reviewed
              public source set does not disclose Watershed's ARR, total revenue, average contract value, or realized
              pricing. Business Insider provides the clearest public traction clue by quoting Taylor Francis that
              January 2025 was Watershed's best month ever for new revenue, but the article explicitly says he did not
              disclose a figure.


              The contrast with adjacent vendors is useful. Microsoft still publishes list pricing for Sustainability
              Manager, IBM exposes a volume-based pricing estimator with minimum-term language, and Workiva openly says
              its packaging is custom, enterprise, and unlimited-seat oriented. Watershed does not provide an equivalent
              public price card in the retained official materials. That does not imply weak pricing power; it implies
              that public evidence is only strong enough to describe the revenue mechanism as sales-led enterprise
              software with likely module expansion, not to size the business or test price realization.
