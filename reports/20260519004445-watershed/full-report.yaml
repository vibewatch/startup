        title: Founders, leadership, and governance signal
        blocks:
          - type: paragraph
            body: >-
              Independent founder profiles consistently describe Watershed as the work of Taylor Francis, Avi Itskovich,
              and Christian Anderson, who met at Stripe and used Stripe's early climate efforts as the springboard for a
              company aimed at turning climate work into an operating priority for enterprises. Taylor Francis is the
              clearest externally identified CEO in current evidence: Inspired Capital calls him Watershed's CEO, and
              Business Insider profiles him as the cofounder leading the company through a tougher 2025 policy
              environment. Christian Anderson appears repeatedly as a cofounder and operating spokesperson in official
              Watershed announcements, especially around product, science, and expansion topics such as Open CEDA and
              Mexico City.


              The one notable governance-quality caveat is disclosure drift across third-party directories. Craft lists
              Christian Anderson as CEO, which conflicts with the 2024-2025 sources naming Francis as CEO and appears
              more likely to be stale directory data than a real leadership change. Public materials also surface a
              high-profile advisor and investor network that includes Sequoia, Kleiner Perkins, Greenoaks, Christiana
              Figueres, and Al Gore. That network adds credibility, but detailed board composition, investor control
              rights, and cap-table concentrations are still not publicly disclosed in the retained evidence.
