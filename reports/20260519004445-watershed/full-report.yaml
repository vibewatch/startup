      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are still real, but they are no longer one-directional. California continues to create
              concrete deadlines for very large companies, the EU still leaves the largest multinationals in scope even
              after narrowing the regime, and both market-report and vendor sources emphasize audit-ready reporting,
              interoperability, and AI-assisted data management as purchase catalysts. Deloitte also shows that climate
              reporting is not only about compliance: in TMT, 69% of respondents say customers often or always request
              GHG data as an RFP requirement, turning reporting capability into revenue infrastructure.


              The constraints are equally material. The SEC’s rule remains stayed and politically unstable, SB 261’s
              first deadline is under injunction, and the EU omnibus reduced near-term coverage, which can lengthen
              decision cycles or narrow who buys first. Data is still fragmented across enterprise systems, suppliers,
              and disclosure frameworks. WEF and GHG Institute show that Scope 3 methodologies remain hard to
              standardize and compare, especially when supplier incentives are weak and buyers face free-rider problems.
              The category is also crowded by substitutes: SAP, Microsoft, Salesforce, IBM, Workiva, consultants, and
              even spreadsheet-based workflows all compete for the same budget. For Watershed, that means valuation
              should lean more on large-enterprise workflow depth and cross-functional control ownership than on a
              simplistic ‘huge TAM’ narrative.
