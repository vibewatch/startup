              operating leverage. Microsoft is the outlier, trading around 11x revenue because investors are
              underwriting very large AI and cloud growth plus extraordinary commercial backlog.


              SaaS Capital’s broader framing explains why that matters. Its June 2025 median public SaaS ARR multiple
              was 6.7x, with a 2023-2025 “new normal” bounded around 6x to 8x and a middle spread that can run from
              roughly 4x to 10x. In other words, current public software markets do still pay up for exceptional
              winners, but the default state is no longer automatic premium software pricing. For Watershed, that means
              a premium case is possible, but it has to be earned by unusually strong growth, retention, and product
