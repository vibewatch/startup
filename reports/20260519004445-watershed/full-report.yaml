      - number: '6.3'
        title: Buyer behavior, multi-threading, and expansion logic
        blocks:
          - type: paragraph
            body: >-
              The most consistent public buying trigger is not generic ESG branding; it is a concrete operational
              problem that spills across functions. World Market and Harris Farm bought around disclosure deadlines and
              audit readiness. DP World describes rising RFQs and stakeholder data requests. Coupa, Flexera, and Insight
              Global tie climate data to customer questionnaires, RFP throughput, and commercial credibility. Ares and
              Carlyle use Watershed in portfolio and financed-emissions contexts, while Figma, Albany, Burton, and
              Skyscanner show the product expanding from measurement into clean power, removals, or procurement
              decisions. In other words, Watershed’s customer motion looks strongest when the same climate dataset can
              justify spend to sustainability, finance, procurement, and commercial teams at the same time.


              That pattern also hints at expansion logic. The software often appears to land through reporting pain or
              audit risk, then broaden into supplier engagement, portfolio engagement, procurement-grade scenario
              analysis, or action marketplaces. Public case studies imply that Watershed wins not only because a chief
              sustainability officer wants a better footprint, but because adjacent functions can reuse the resulting
              data. That is strategically attractive, since it can raise ACV and stickiness, but it also suggests a
              higher-touch enterprise motion with more implementation work, stakeholder education, and cross-functional
              process change than a lightweight self-serve tool would require.
