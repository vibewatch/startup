      - number: '2.2'
        title: 'Sizing lens: large market, inconsistent labels'
        blocks:
          - type: paragraph
            body: >-
              Published market data supports a meaningful software category, but it does not support one clean canonical
              TAM. The retained sources span carbon accounting software, carbon management systems, carbon management
              software, and sustainability management software, each with different treatment of services, verticals,
              and adjacent reporting workflows. TBRC places carbon accounting software at $27.78 billion in 2026, Mordor
              places carbon management software at $18.17 billion in 2026, and Global Market Insights puts carbon
              management systems at $15.9 billion in 2026. Grand View’s 2025 baseline is $14.13 billion, while
              Technavio’s sustainability-management frame is narrower and disclosure-oriented.


              The useful move is therefore to constrain rather than overstate. Grand View and Mordor both show large
              enterprises dominating spend, and North America remains the largest buyer base. Applying those published
              shares to the 2026 market band yields a rough large-enterprise software SAM of about $10 billion to $20
              billion and a narrower North America large-enterprise lens of about $3.6 billion to $7.7 billion. That
              bottom layer is not a true Watershed SOM; public sources do not isolate what share goes to standalone
              platforms instead of suites, audit stacks, or services.
