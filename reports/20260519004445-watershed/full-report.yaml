      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Buyer ownership in this market is cross-functional, not departmental. Deloitte’s sector survey shows chief
              sustainability officers often own disclosure management, but CFOs frequently share responsibility and ESG
              controllers are taking on more disclosure work. PwC makes the same point more explicitly: CFOs and ESG
              controllers increasingly work with sustainability leaders because they can embed sustainability into
              financial reporting processes and reuse common data foundations across jurisdictions. Workiva’s 2026
              survey explains why finance enters the room: fragmented data is viewed as a material reporting risk, and
              CFOs are told to establish a single source of truth for financial and non-financial data.


              Procurement becomes central once Scope 3 moves from aspiration to operating requirement. CDP positions
              supplier-level climate data as a procurement decision tool, and the World Economic Forum argues that
              credible Scope 3 progress depends on linking disclosure to procurement governance and better supplier
              data. In practice, users span sustainability, finance and controllership, procurement, internal audit, and
              IT or data teams. Budget approval is therefore most likely to sit with finance or a joint
              finance-sustainability program office, while procurement and operations become co-owners when supplier
              data collection or business-process integration becomes the real bottleneck.
            claimRefs:
