      - number: '7.3'
        title: Methodology drift and AI trust are core output-quality risks
        blocks:
          - type: paragraph
            body: >-
              Watershed’s product is strongest where the market is hardest: Scope 3, product footprints, and audit-ready
              reporting. The same evidence also shows why this is risky. GHG Protocol still treats Scope 3 as the
              canonical value-chain framework, but it is updating its corporate suite because the standards ecosystem
              has moved on. The technical guidance places real weight on supplier-specific data and careful treatment of
              hybrid methods, while the new land-and-removals standard expands the accounting perimeter that
              sophisticated buyers now expect software to handle. Watershed’s Product Footprints product leans directly
              into this challenge by automating activity-based Scope 3.1 measurement and factor selection, which is
              powerful but also exposes the company to rework when methods, factors, or customer evidence quality
              change.


              The AI layer sharpens both the upside and the risk. Watershed promises OCR, anomaly detection, report
              drafting, transparent calculations, human review, and multi-model safeguards using Anthropic, OpenAI, and
              Gemini. Those are meaningful controls, and they likely help explain the productivity claims on the site
              and in launch coverage. But the retained public record does not show production hallucination rates,
              override rates, or model-related audit exceptions. That means the chapter should treat AI as a leverage
              tool with real trust risk rather than as a solved feature.
