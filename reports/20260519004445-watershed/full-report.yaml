            body: >-
              The public case for Watershed is strongest on category position and resource commitment, not on explicit
              financial output. The evidence base supports a company that has real enterprise penetration, meaningful
              recent funding, broad functional hiring, and a product set aligned with large-buyer procurement and
              disclosure needs. It also supports a market where incumbents like Microsoft, SAP, IBM, and Workiva can
              influence buying behavior through broader installed bases, packaging, and public-market financial
              strength. For valuation framing, this chapter uses company-level market-cap-to-revenue multiples from
              Workiva, IBM, SAP, and Microsoft as an illustrative bracket rather than a clean peer set; the resulting
              range is directionally helpful but too coarse to map directly onto Watershed because the incumbents are
              diversified and Workiva is disclosure-heavy rather than climate-native.


              As a result, the investability blocker is simple: Watershed's revenue quality is still opaque. Public
              evidence does not reveal ARR, revenue mix, gross margin, net retention, CAC payback, cash balance, or
