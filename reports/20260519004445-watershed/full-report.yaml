  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy whiplash can slow buying even while disclosure need stays real
        blocks:
          - type: paragraph
            body: >-
              Watershed’s growth story is tied in part to companies needing investor-grade climate data before
              California, EU, and investor-facing deadlines bite. The retained source set shows that the demand signal
              is real: CARB is moving forward with SB 253, Watershed itself markets SB 253 and SB 261 support, and
              Trellis reports that mandatory reporting is helping close deals. The problem is timing stability, not
              total market disappearance. The SEC climate rule was adopted and then stayed during litigation, with the
              Commission later moving toward rescission; SB 261 enforcement is stayed pending appeal; and the EU Omnibus
              package narrowed CSRD and CSDDD scope and pushed obligations outward.


              That combination matters for Watershed because buyers do not purchase only on technical elegance; they
              purchase when a regulator, auditor, CFO, or major customer forces action on a timetable. If the timetable
              blurs, the sales motion becomes more consultative and more vulnerable to procurement delay, “wait-and-see”
              budgeting, or narrower first-year deployments that emphasize measurement over broader platform adoption.
              The key company-specific point is that Watershed openly sells against these frameworks, so policy rollback
              shows up first as elongated pipeline conversion and lower urgency, not necessarily as a collapse in
              long-run climate-software relevance.
