  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Last verified mark, known scale, and what is still unknowable publicly
        blocks:
          - type: paragraph
            body: >-
              Watershed’s valuation conversation starts from one hard public anchor and then runs straight into opacity.
              The hard anchor is clear: Watershed’s own Series C announcement and Reuters both say the company raised
              $100 million in February 2024 at a $1.8 billion valuation, after previously raising $70 million at a $1
              billion valuation. The public record also supports that this is a real enterprise platform rather than a
              deck-only story: Watershed says it has nearly 400 employees, global offices, and customers that include
              four of the top six US banks and six of the top 10 private equity firms. Those facts matter because they
              make the $1.8 billion mark at least plausible on category relevance and buyer quality.


              What the public record still does not reveal is the part that actually decides whether the mark is cheap
              or expensive: ARR, recognized revenue, gross margin, services load, net retention, net cash, and the
              preference stack. Because those numbers are missing, this chapter treats the $1.8 billion mark as an
              indicative framework rather than a mark-to-market truth. The only defensible public method is scenario
              math that starts from disclosed equity value and asks what revenue or ARR level would have to exist for
              that value to look attractive, fair, or stretched under current software multiple conditions.
            claimRefs:
              - CV001
              - CV002
              - CV003
