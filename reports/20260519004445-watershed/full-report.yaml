  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current public read
      - Why this is the read
      - Decision implication
    rows:
      - - Recommendation
        - Track / Research-More
        - Company quality may be strong, but core valuation inputs are still undisclosed.
        - Do not underwrite a conviction buy at the last verified mark on public evidence alone.
      - - Confidence
        - Medium
        - Public comp, policy, and peer-funding context is solid, but Watershed-specific economics are not disclosed.
        - Private diligence can still move the call materially in either direction.
      - - Risk rating
        - High
        - Downside comes from both company opacity and external multiple compression or policy delay.
        - Use hard kill criteria rather than narrative optimism.
      - - Valuation stance
        - Stretched
        - The mark only looks fair or attractive if ARR and quality metrics are already unusually strong.
        - Current price needs proof, not just category enthusiasm.
      - - Upgrade trigger
        - ARR / retention / margin proof or lower entry
        - The missing metrics directly determine which multiple band is warranted.
        - Without that proof, stay on watch instead of forcing precision.
    notes: >-
      This table summarizes the current public-evidence call at the last verified February 2024 valuation, not a live
      negotiated term sheet.
