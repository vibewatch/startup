chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current stage
        blocks:
          - type: paragraph
            body: >-
              Watershed presents itself as a sustainability AI platform built to help enterprises measure, report, and
              reduce environmental impact. The company says it started in 2019 and frames its mission as accelerating
              the climate economy, with a stated 2030 goal of helping customers reduce or remove 500 megatonnes of CO2e.
              The core product narrative is no longer just carbon accounting: the current website describes a
              measure-report-act workflow, backed by AI-assisted data cleaning, emissions-factor mapping, and report
              drafting, while the about page emphasizes climate databases, reporting tools, supply-chain engagement, and
              marketplace infrastructure.


              For later chapters, the most reliable stage description is that Watershed remains a private post-Series C
              company. The latest disclosed valuation in fetched evidence is the February 2024 Series C at $1.8 billion,
              and the exact public capital amounts verified in this source pack total at least $170 million across the
              Series B and Series C rounds, with an earlier Series A confirmed but not sized here. Headquarters evidence
              converges on San Francisco, while official materials describe a multi-office footprint spanning North
              America, Europe, and Australia.
