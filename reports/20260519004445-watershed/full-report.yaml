  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / sign
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR below premium-support level
        - Private ARR below roughly $100M
        - Current mark starts to imply >18x revenue or requires unjustified optimism.
        - Do not pay the 2024 mark without a reset or a different structure.
      - - Weak renewals or poor expansion
        - NRR below premium software norms or low module expansion
        - Premium-multiple case collapses because product depth is not monetizing.
        - Move to avoid unless price adjusts materially.
      - - Services-heavy delivery
        - Gross margin or services mix looks materially worse than software-led peers
        - Comparable band migrates toward lower single digits or low-teens at best.
        - Treat current mark as stretched-to-expensive.
      - - Policy-linked pipeline concentration
        - Meaningful share of bookings tied to delayed EU or California timing
        - Demand timing risk becomes valuation risk instead of only growth timing noise.
        - Cut warranted multiple and revisit base / bear case.
      - - Suite bundling wins inside major accounts
        - Large buyers choose Microsoft, Salesforce, SAP, or Workiva modules instead of Watershed expansion
        - Watershed loses the premium-for-depth argument while still bearing standalone go-to-market cost.
        - Re-rate toward mature-suite multiples rather than climate-native premium hopes.
    notes: >-
      These are observable kill criteria that directly change the warranted multiple band rather than just sounding
      directionally negative.
    claimRefs:
      - CV047
      - CV050
      - CV052
      - CV053
      - CV056
      - CV057
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Exact diligence path
    rows:
      - - Current ARR / recognized revenue
        - Current ARR, bookings, and recognized revenue by product
        - This is the single fastest way to test whether the $1.8B mark is fair or stretched.
        - Request monthly ARR bridge, current quarter actuals, and FY2026 board forecast.
      - - Retention and expansion
        - GRR, NRR, cohort expansion, and module attach by customer segment
        - Premium multiples require durable expansion economics, not just strong logos.
        - Request cohort tables and ACV expansion by module.
      - - Gross margin and services mix
        - Software gross margin, professional services attachment, and implementation burden
        - Services-heavy delivery can compress the warranted multiple sharply.
        - Request gross margin split and deployment-hour benchmarks.
      - - Cap table and preferences
        - Liquidation preferences, participation rights, secondaries, and any structure above common
        - The last priced round can overstate common-equivalent value if overhang is meaningful.
        - Request current cap table, charter, and side-letter summary.
      - - Cash and debt bridge
        - Cash, debt, working capital, and any off-balance-sheet obligations
        - Debt or low cash would break the simple equity≈EV assumption used in this chapter.
        - Request latest balance sheet, debt schedule, and covenant summary.
      - - Policy-linked pipeline split
        - Bookings mix driven by reporting mandates versus broader procurement or decarbonization demand
        - This determines how much rollback risk should be applied to growth and multiple assumptions.
        - Request pipeline and bookings by use case, geography, and regulatory trigger.
    notes: >-
      Each diligence ask is framed to answer a valuation question directly rather than to broaden the memo without
      changing the call.
    claimRefs:
      - CV050
      - CV051
      - CV052
      - CV057
