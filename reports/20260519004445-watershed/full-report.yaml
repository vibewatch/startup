      - number: '7.2'
        title: Greenwashing and carbon-market liability can spill back onto Watershed
        blocks:
          - type: paragraph
            body: >-
              The most acute legal risk is not a public lawsuit against Watershed itself in the retained set; it is the
              tightening claim environment around carbon offsets, carbon neutrality, and environmental marketing. FTC
              materials say marketers must avoid environmental claims that are unfair or deceptive under Section 5,
              while California’s AB 1305 forces detailed website disclosures around voluntary carbon offsets, net-zero
              claims, and claim substantiation, with aggregate penalties that can reach $500,000. Faegre and Simpson
              Thacher’s analysis makes the same practical point in plainer English: companies now need to back up public
              carbon claims with specific, reviewable evidence.


              That matters for Watershed because the company does not stop at calculation. Its partner page with CDP and
              its own AI-launch materials both emphasize access to curated, high-additionality carbon-removal supply.
              That is commercially attractive, but it also means a bad project, an unsupported “neutral” claim, or stale
              website language can become a platform-level reputation problem even if the underlying project developer
              caused the operational miss. In other words, Watershed’s marketplace and claims-enablement layer can
              amplify legal and reputational downside relative to a vendor that only delivers measurement software.
            claimRefs:
