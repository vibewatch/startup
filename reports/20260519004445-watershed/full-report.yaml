      - number: '3.2'
        title: Capability overlap and buyer fit
        blocks:
          - type: paragraph
            body: >-
              Watershed’s public product breadth is unusually procurement- and action-oriented for a climate-first
              vendor. Its retained pages describe a single measure-report-act platform, then layer in supplier
              engagement, product-footprint AI, clean power, and carbon-removal execution. That makes Persefoni the
              closest rival on finance-grade measurement and disclosure rigor, while Sweep looks closest on
              collaborative supplier workflows. Plan A and Normative emphasize scientifically grounded compliance and
              guidance, Greenly emphasizes speed and packaged support, and SINAI emphasizes transition economics and
              financial planning.


              Against suite competitors, the overlap shifts from climate depth toward enterprise adjacency. IBM Envizi,
              Microsoft Sustainability Manager, Salesforce Net Zero, SAP Sustainability, and Workiva all sell
              audit-ready reporting and data integration, but their strongest public pitch is connection to broader
              installed bases. Microsoft and SAP are most compelling where the buyer wants carbon embedded in cloud or
              ERP processes. Workiva is strongest where the buying center is finance and assurance. Watershed therefore
              appears best positioned when procurement-led Scope 3 reduction, product-footprint analysis, and
              climate-specific execution matter more than the convenience of extending a broader enterprise stack.
