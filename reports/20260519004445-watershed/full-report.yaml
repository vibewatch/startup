  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Why the thesis exists
      - Why the anti-thesis exists
      - What would change the view
    rows:
      - - Product depth
        - Watershed appears deeper than generic ESG modules on reporting, supply chain, and marketplace workflows.
        - Depth alone does not prove premium economics if services load is heavy or buyers still bundle elsewhere.
        - Show high-margin module expansion and low implementation drag.
      - - Customer proof
        - Blue-chip logos and regulated buyers support enterprise relevance.
        - Logos do not disclose ACV concentration, renewal quality, or realized budget share.
        - Provide top-customer concentration, GRR, and NRR by cohort.
      - - Category demand
        - Climate data and disclosure remain strategic for many large buyers.
        - EU rollback and mandate timing shifts reduce urgency and can stretch sales cycles.
        - Show pipeline durability outside the narrowest policy-driven use cases.
      - - Private-market context
        - Carbon-accounting software is still financeable and peers continue to raise capital.
        - Peer financing is smaller and more profitability-oriented than Watershed’s 2024 mark implies.
        - Show Watershed is closer to premium-growth leaders than to consolidation candidates.
      - - Comp multiple support
        - A premium to mature suite vendors is possible for a climate-native platform.
        - Current public software markets do not hand out premium multiples by default.
        - Show that Watershed belongs in the outlier tail, not just above the median.
    notes: >-
      The table separates company-quality positives from valuation-support negatives so the recommendation stays
      price-sensitive.
