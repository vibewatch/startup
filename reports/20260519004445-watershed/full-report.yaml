      - number: '6.2'
        title: Named deployments and measurable outcomes
        blocks:
          - type: paragraph
            body: >-
              Named customer stories show Watershed being used in production-style programs rather than as a speculative
              pilot tool. Compliance-heavy buyers such as World Market, Harris Farm, Delivery Hero, CDP, AdventHealth,
              and Smiths use it to establish first footprints, compress reporting cycles, or get ready for CSRD, CDP,
              California, and ASRS-style disclosure demands. At the same time, action-oriented customers such as Burton,
              Albany, Figma, Pinterest, Skyscanner, and Braze use the platform for supplier engagement,
              product-footprint analysis, carbon removal, clean power, or cloud-emissions optimization. Public customer
              proof therefore spans both the “measure and disclose” side of the platform and the “act” side that touches
              procurement or capital allocation.


              The measurable outcomes are more operational than classical SaaS metrics. Public stories talk about
