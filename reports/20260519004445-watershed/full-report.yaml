      - number: '8.5'
        title: Entry discipline should be tied to private proof, not to category optimism
        blocks:
          - type: paragraph
            body: >-
              The practical investment question is not whether Watershed is impressive; it is what evidence would make
              the 2024 mark worth paying against in 2026. The answer is straightforward. To underwrite the existing
              price, an investor needs private proof that current ARR is at least roughly $120 million to $150 million
              with strong retention, solid gross margins, and limited services drag—or else a materially lower entry
              price than the last verified mark. If private diligence instead reveals ARR below about $100 million, weak
              renewals, or a pipeline overly concentrated in reporting mandates whose timing has been pushed out, the
              valuation case deteriorates sharply.


              The next diligence steps are therefore specific, not generic. Management should be asked for current ARR
              and recognized revenue, NRR and GRR, gross margin split between software and services, cash and debt,
              cap-table terms and preferences, and a pipeline split between regulation-driven work and broader
              decarbonization procurement. Those items would resolve most of the valuation uncertainty quickly. Until
              then, the chapter’s stance stays deliberately conservative: track the company, keep the category on watch,
              and resist treating the last priced round as self-validating.
