            body: >-
              Watershed’s customer evidence is strongest on logo quality and sector breadth, not on a single clean
              customer-count denominator. The homepage markets 90+ Fortune 500 companies, five of the top six U.S.
              banks, and six of the top ten global private-equity firms. Trellis separately reports that Watershed has
              contracts with hundreds of high-profile corporations and explicitly names FedEx, General Mills, and
              Walmart. Those statements point to a real enterprise foothold, but they are not directly comparable: one
              is a Fortune 500 cohort claim, one is a broader corporation count, and neither tells the reader how many
              accounts are active, how many are in production, or how many modules each customer uses.


              What is verifiable from the retained source set is the quality and diversity of named proof. Watershed has
              current case studies across healthcare, private capital, industrials, logistics, retail, travel, software,
              staffing, and nonprofit reporting. The buyer set is also broader than a single sustainability persona:
              finance, procurement, sales, sourcing, and portfolio teams all show up in the public record. That mix
              supports the idea that Watershed sells into enterprise climate programs when the data can be reused across
              reporting, commercial, and operational workflows, but it also means the public story is much stronger on
