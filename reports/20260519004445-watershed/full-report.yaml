            body: >-
              The most useful public bracket is not a single peer but a layered one. Workiva is the closest
              disclosure-and-controls software analog in the retained set: it reported $738.7 million of 2024 revenue,
              roughly 90% subscription and support mix, 97% gross retention, 112% net retention, and a current market
