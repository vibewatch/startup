      - number: '1.3'
        title: 融资历史、投资方与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              抓取来源包中，2022 年之后的融资历史最扎实。Watershed 官方 Series B 文章称，公司以 $1 billion 估值融资 $70 million，由 Sequoia 和 Kleiner
              Perkins 共同领投。证据更充分的锚点是 February 1, 2024 的 Series C 轮：Watershed、Reuters 以及 Yahoo 对 Reuters 的转载均一致称，公司以 $1.8
              billion 估值融资 $100 million，由 Greenoaks 领投，Sequoia 和 Kleiner Perkins
              参投。后续章节应把这组信息视为最新一轮融资的标准事实；如果未来材料出现不同领投方，除非有抓取证据支持，否则应降低置信度。


              更早历史真实存在，但此处量化不足。Sequoia 的创始人资料称，公司在 mid-2020 完成 Series A 轮，并点名 Sequoia 和 Kleiner Perkins
              共同领投，但保留来源集中未披露轮次金额。归档 Crunchbase 数据把 Series C 参与方扩展到 Galvanize Climate Solutions、Emerson Collective、Elad
              Gil 和 Neo，这对利益相关方图谱有用，但在领投方事实模式上仍应让位于公司和 Reuters。
