      - number: '7.2'
        title: 漂绿和碳市场责任可能反噬 Watershed
        blocks:
          - type: paragraph
            body: >-
              最尖锐的法律风险，并不是保留资料中出现了针对 Watershed 本身的公开诉讼；真正的风险在于围绕碳抵消、碳中和和环境营销的主张环境正在收紧。FTC 材料称，营销方必须避免在第 5
              条下构成不公平或欺骗性的环境主张；加州 AB 1305 则要求围绕自愿碳抵消、净零主张和主张佐证，在网站上做详细披露，合计罚金最高可达 $500,000。Faegre 和 Simpson Thacher
              的分析用更直白的话说了同一件事：企业现在必须用具体、可审查的证据支撑公开碳主张。


              这对 Watershed 很重要，因为公司不止做计算。它与 CDP 的合作伙伴页面，以及自身 AI
              发布材料，都强调可获得经过筛选、额外性高的碳移除供给。商业上这很有吸引力，但也意味着，一个糟糕项目、一项缺乏支撑的「中和」主张，或一段过期网站表述，都可能变成平台级声誉问题，即便运营失误来自底层项目开发方。换句话说，相比只交付测量软件的供应商，Watershed
              的市场平台和主张赋能层会放大法律与声誉下行。
