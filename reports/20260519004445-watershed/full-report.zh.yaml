  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 计入支出
      - 排除支出
      - 典型买方 / 付款方
      - 对 Watershed 的意义
    rows:
      - - 核心碳核算与盘查系统
        - 用于 Scope 1/2/3 数据收集、因子映射、计算、控制和报告的软件
        - 纯咨询盘查、抵消、可再生能源采购、传感器
        - 可持续团队，财务 / 主计长共同发起
        - 这是 Watershed 最明确服务的类别。
      - - ESG 报告与披露编排
        - 证据关联报告、框架映射、鉴证工作流、董事会可用输出
        - 没有气候工作流的通用申报软件
        - 财务、ESG 主计长、可持续负责人
        - 把市场从计算器扩展到披露基础设施。
      - - 供应商参与和价值链数据收集
        - 供应商问卷、采购工作流、Scope 3 请求管理、标准化数据交换
        - 没有气候模块的通用 SRM 支出
        - 采购团队，并由可持续团队监督
        - 在 Watershed 靠 Scope 3 复杂度而不是简单盘查取胜的场景中很关键。
      - - 脱碳规划与转型统筹
        - 情景分析、项目跟踪、目标管理、运营仪表盘
        - 实物项目资本开支和实施人工
        - 可持续、运营、财务
        - 重要的相邻扩张领域，但不等同于报告软件支出。
      - - 套件模块替代品
        - SAP、Microsoft、Salesforce、IBM 和 Workiva 用于气候数据和报告的 ESG 模块
        - 与 ESG 无关的完整 ERP/CRM/云合同价值
        - CIO、CFO、可持续共享预算
        - 这些供应商会吸收本可流向独立平台的预算。
      - - 服务和手工现状
        - 不计入核心软件 TAM；咨询、BPO、审计项目和 Excel 都是替代动作
        - 从软件 TAM 视角看，排除纯服务收入
