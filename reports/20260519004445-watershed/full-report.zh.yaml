      - number: '7.4'
        title: 套件化竞争和企业端不透明让执行风险难以定价
        blocks:
          - type: paragraph
            body: >-
              保留下来的来源支持一个判断：Watershed 是严肃的企业平台，不是小众计算器。Trellis 描述了数百份高知名度企业合同，买方触达财务、供应链、主计长和 IT；官网强调规模与顾问深度；Toolradar
              则把产品定位为仅付费、面向企业。这些都是 ACV 潜力的好信号，但也意味着销售流程比轻量合规工具更政治化。多个内部买方必须达成一致时，即便产品本身很强，监管期限滑动和预算取舍也会拖延决策。


              同时，Watershed 并不是在真空中竞争。Salesforce 推 Agentforce Net Zero，SAP 营销嵌入式 AI 的可持续控制，Microsoft 把 Copilot
              加进可持续工作流，Workiva 则在更大的治理栈中提供面向 SEC、审计就绪的 ESG 数据。任何一家供应商，都可能在 Watershed 进场前就已经存在于客户软件体系里。这形成了典型的独立平台 vs
              套件问题：Watershed 仍可能凭气候深度取胜，但公开资料没有充分展示定价权、续约质量或集中度，无法证明它能在规模化时高效打赢这些仗。
