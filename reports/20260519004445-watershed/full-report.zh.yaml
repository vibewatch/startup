      - number: '7.3'
        title: 方法论漂移和 AI 信任是核心输出质量风险
        blocks:
          - type: paragraph
            body: >-
              Watershed 最强的产品位置，恰好也是市场最难的位置：Scope 3、产品足迹和审计就绪报告。同一组证据也说明了为什么这里风险高。GHG Protocol 仍把 Scope 3
              视为价值链框架的规范基准，但因为标准生态已经前移，它正在更新企业套件。技术指南真正重视供应商特定数据，也要求谨慎处理混合方法；新的土地与移除标准则扩展了成熟买方期望软件处理的核算边界。Watershed 的
              Product Footprints 产品正面切入这一挑战，自动化基于活动的 Scope 3.1 测量和因子选择；这很有力，但一旦方法、因子或客户证据质量变化，公司也会暴露在返工风险中。


              AI 层同时放大上行和风险。Watershed 承诺 OCR、异常检测、报告起草、透明计算、人工复核，以及使用 Anthropic、OpenAI 和 Gemini
              的多模型保护。这些控制有意义，也很可能解释了官网和发布报道中的生产力主张。但保留下来的公开资料没有展示生产环境幻觉率、人工覆写率或模型引发的审计例外。因此，本章应把 AI
              视为带来真实杠杆、但仍有信任风险的工具，而不是已经解决的功能。
