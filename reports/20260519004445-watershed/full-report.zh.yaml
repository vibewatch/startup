      - number: '1.4'
        title: 商业版图、客户结构与平台扩张
        blocks:
          - type: paragraph
            body: >-
              作为一家非上市气候软件供应商，Watershed 已显出可观规模，但公开信息用了几套不同口径描述。官网首页称客户包括 90+ 家 Fortune 500 公司、美国前六大银行中的 5 家、全球前十私募股权公司中的
              6 家；关于页面则称美国前六大银行中有 4 家，而非 5 家。Business Insider 又加入一段创始人引述，称公司拥有超过 500 家客户，并服务 60 家 Fortune 500
              公司。这些并非致命矛盾，但意味着后续章节不应把客户规模压成一个不加限定的单一数字，而要保留来源口径。


              更一致的是平台扩张叙事。官方材料显示，管理中的排放量从 Series B 时的 20 million tonnes 以上，推进到 Series C 时的 479 million tonnes，再到当前官网的 3
              gigatonnes。自 2025 年以来，Watershed 还重点展示 Open CEDA、墨西哥城扩张、Deloitte Netherlands 合作、2025 年超过 160 项产品增强，以及 2026
              年的第三方品类认可声明。这些里程碑合在一起，说明公司正从排放衡量扩展为更广泛的企业可持续发展基础设施。
