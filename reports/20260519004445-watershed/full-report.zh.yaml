      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 当前公开判断
            body: 以上一次可验证的 $1.8B 估值看，Watershed 值得密切跟踪，但没有私有 ARR、留存和毛利率证据时，还不是一个可以放心承销的价格。
