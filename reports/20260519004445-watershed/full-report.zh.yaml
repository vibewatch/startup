  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑为何成立
      - 反向逻辑为何成立
      - 什么会改变判断
    rows:
      - - 产品深度
        - Watershed 在报告、供应链和市场平台工作流上，似乎比通用 ESG 模块更深入。
        - 如果服务负担很重，或买方仍转向捆绑方案，深度本身不能证明溢价经济性。
        - 证明高毛利模块扩张和低实施拖累。
      - - 客户证据
        - 蓝筹客户和受监管买方支撑企业级相关性。
        - 客户名单不披露 ACV 集中度、续约质量或实际预算份额。
        - 提供头部客户集中度，以及按队列划分的 GRR 和 NRR。
      - - 品类需求
        - 气候数据和披露对许多大型买方仍具战略意义。
        - 欧盟回撤和监管时点变化削弱紧迫性，并可能拉长销售周期。
        - 证明最狭窄政策驱动用例之外的销售管线耐久性。
      - - 私募市场背景
        - 碳核算软件仍可融资，同行继续募资。
        - 同行融资规模更小，也比 Watershed 2024 年估值所暗示的更重盈利能力。
        - 证明 Watershed 更接近高溢价增长领军者，而非整合候选者。
      - - 可比倍数支撑
        - 气候原生平台可能较成熟套件厂商享有溢价。
        - 当前公开软件市场不会默认给出溢价倍数。
        - 证明 Watershed 属于离群右尾，而不只是高于中位数。
    notes: 本表将公司质量的正面因素与估值支撑的负面因素分开，使建议保持价格敏感。
