      - - Disclosures
        - 披露负责人；财务；可持续发展
        - 按不同框架起草、更新并提交 ESG / 气候报告
        - 专门披露页面展示 CDP API 提交和可复用报告工作流
        - 同一数据可在多个框架复用，并配套同业基准
        - 没有公开演示完整框架覆盖或验证规则
      - - CSRD 方案
        - 欧盟报告团队；鉴证负责人
        - 收集 ESRS 数据，支持撰写、工作流和可供 XBRL 使用的导出
        - 公开说明了具名连接器、审批流程和 XBRL 导出
        - 把测量、撰写和鉴证支持合进一条流程
        - 大规模生产使用的公开证据仍停留在案例研究层面
      - - 加州方案
        - 美国披露团队；法务 / 风控
        - 借助 AI 起草和鉴证支持生成 SB 253 与 SB 261 披露
        - 公开页面包含验证、引用和 Guaranteed Assurance 服务
        - 把监管模板与公司数据和专家指导相连
        - 诉讼和规则变化仍会不断改写产品要追的目标
      - - Supply Chain
        - 采购；供应商项目；可持续发展
        - 测量供应商排放，呈现目标 / 行动，并运行互动工作流
        - 专门页面展示仪表板、门户、记分卡和供应商情报主张
        - 从问卷走向与行动绑定的供应商工作流
        - 公开文档没有量化门户采用率或回复率
      - - Product Footprints
        - 采购；产品团队；可持续发展
        - 建立产品级足迹，比较供应商 / 材料，并模拟减碳杠杆
        - 官方页面和 2025 年发布报道描述了单品级 AI 工作流
        - 采购级 Scope 3.1 建模，而不是只按支出取平均
        - 生产使用的公开证据仍偏早期、偏发布期
      - - Act + Marketplace
        - 减碳负责人；可持续发展；采购
        - 建模目标，并为清洁电力、碳移除、SAFc 和 VPPA 出资
        - 公开页面和 Canva 案例显示，行动界面已超出报告
        - 把减排规划接到真实的清洁电力和碳移除执行
        - 经济性、组合回报和供应商侧合同条款仍未公开
      - - Finance
        - 资管机构；银行；可持续金融团队
        - 借助 PCAF 和外部数据集汇总跨资产类别的融资排放数据
        - 专门 Finance 产品页列出数据来源和资产类别覆盖
        - 展示 CFO / 组合工作流设计，而不只是企业足迹核算
        - 公开文档未披露按资产类别拆分的估值、定价或客户渗透率
      - - CEDA / Open CEDA 数据集
        - 气候数据团队；模型负责人；高级客户
        - 为基于支出和增强型足迹核算提供排放因子底座
        - 开放版和付费版都有公开文档，并每年更新
        - 这个品类常把因子当黑箱，开放数据楔子并不常见
        - 生产中有多少客户专属因子调优并不清楚
      - - Sustainability AI
        - 可持续发展分析师；报告负责人；采购团队
        - 清洗文件、分析驱动因素、起草报告，并支持情景探索
        - 产品页和 2026 年博客记录了已上线智能体和工作流示例
        - 对模型供应商和审核控制的公开披露少见地明确
        - 没有公开评估仪表板或模型路由文档
    notes: 成熟度反映公开产品证据，而不是私有遥测数据。各行区分了已有清晰文档的界面，以及仍未公开的基础设施和采用细节。
