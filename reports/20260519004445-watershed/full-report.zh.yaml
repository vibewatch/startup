      - - 留存与扩张
        - 没有续约和增购数据，客户 logo 数量很难说明收入质量
        - 未找到公开 NRR、GRR、流失或模块扩张数据
        - 要求提供按细分市场拆分的总留存、NRR、流失和扩张队列表
      - - 实际定价与折扣
        - 公开标价比较无法推导出 ACV 或利润率
        - 未找到 Watershed 公开价目表；邻近厂商混用标价和定制定价
        - 要求提供价格手册、实际折扣区间，以及按模块和客户规模拆分的 ACV
      - - 客户集中度
        - 大客户 logo 可能掩盖对少数客户或行业的依赖
        - 案例研究能证明企业客户质量，但不能证明收入集中度
        - 要求提供前 10 大客户收入占比和行业暴露
      - - 实施周期与服务负荷
        - 没有上线投入数据，CAC 回本和利润率判断不完整
        - 招聘信息显示启用和咨询人力投入不小
