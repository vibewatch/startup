          - type: paragraph
            body: >-
              公共可比区间确定后，核心问题很简单：多大的 ARR 或收入基数，才能让 Watershed 上一轮 $1.8 billion 估值说得通？用公开 SaaS 和可比公司区间作为方向性带宽，$1.8 billion
              分别隐含：18x 时约 $100 million ARR，15x 时 $120 million，12x 时 $150 million，10x 时 $180 million，8x 时 $225
              million，以及按 SaaS Capital 6.7x 中位数计算约 $269 million。因此，当前立场必须对价格敏感。如果 Watershed 的 ARR 已明显高于 $150
              million，且留存强、服务拖累有限，这一估值可能有吸引力。如果 ARR 更接近 $100 million 到 $150 million，估值可能合理，但并不明显便宜。如果 ARR 低于 $100
              million，或重服务工作与政策延迟把合理倍数压向 6x 到 10x，这一估值会很快显得偏高。


              因此，情景表采用明确的乐观、基准和悲观情景，而不是虚假的精确度。乐观情景假设 Watershed
              已经跨入高增长溢价区间，应该获得长尾区间的软件倍数。基准情景假设公司确实有企业牵引力，但披露证据不足以让人放心支付前十分位价格。悲观情景假设，公司仍在向估值爬坡，而公开市场和政策时间表比 2021 年或 2024
              年初更不宽容。
            claimRefs:
              - CV043
              - CV044
