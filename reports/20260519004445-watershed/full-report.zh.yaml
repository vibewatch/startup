      - number: '5.2'
        title: 衡量、数据底座与 AI 架构
        blocks:
          - type: paragraph
            body: >-
              公开材料透露的工作流多于基础设施内部细节，但运营模型仍相当清晰。Watershed
              的碳核算文档描述了经典流程：获取业务活动数据、套用排放因子、识别异常、填补缺口，并产出可审计输出。差异化在于包裹这条流程的气候专用脚手架。CEDA 给 Watershed
              带来一个自研加开放的排放数据库，具备全球覆盖、年度刷新，以及范围拆分、价格或货币调整等付费增强。Product Footprints 和 Supply Chain
              又把模型往前推，从基于支出的平均值转向单品、材料、供应商和工艺细节。


              相比许多企业供应商，Watershed 对 AI 层也异常明确。公司称智能体可以清洗文件、对齐重复项、生成分析、起草报告并给出下钻推理，还公开点名 Anthropic、OpenAI 和 Google Gemini
              是模型栈的一部分。Product Footprints 又为供应链加入 AI 数字孪生叙事，智能体和 PDF
              扫描则直击手工数据准备瓶颈。仍然私有的是这些工作流下方的系统层：公开页面没有暴露租户设计、区域拓扑、正常运行时间承诺，或客户可用的公开 API 参考。
