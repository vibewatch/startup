      - number: '6.3'
        title: 买方行为、多线程销售与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              最一致的公开购买触发因素不是泛泛的 ESG 品牌，而是一个跨职能外溢的具体运营问题。World Market 和 Harris Farm 围绕披露截止日期和审计准备度购买。DP World 描述 RFQ
              和利益相关方数据请求上升。Coupa、Flexera 和 Insight Global 将气候数据连接到客户问卷、RFP 吞吐和商业可信度。Ares 和 Carlyle 在投资组合与融资排放语境中使用
              Watershed；Figma、Albany、Burton 和 Skyscanner
              则显示产品从衡量扩展到清洁电力、移除或采购决策。换句话说，当同一套气候数据能同时向可持续发展、财务、采购和商业团队证明支出合理时，Watershed 的销售推进最强。


              这一模式也暗示扩张逻辑。软件常常通过报告痛点或审计风险落地，然后扩展到供应商互动、投资组合互动、采购级情景分析或行动市场。公开案例研究暗示，Watershed
              胜出不只是因为首席可持续发展官想要更好的足迹，而是因为相邻职能可以复用产出的数据。这在战略上有吸引力，因为它可以提高年合同价值（ACV）和粘性；但它也指向一种更高接触的企业销售模式，比轻量自助工具需要更多实施工作、利益相关方教育和跨职能流程改变。
