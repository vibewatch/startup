chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Watershed 将自己定位为可持续发展 AI 平台，帮助企业衡量、报告并降低环境影响。公司称其 2019 年起步，使命是加速气候经济，并提出到 2030 年帮助客户减少或移除 500 megatonnes
              CO2e 的目标。核心产品叙事已不只是碳核算：当前官网描述的是一套「衡量—报告—行动」工作流，背后有 AI 辅助的数据清洗、排放因子映射和报告起草；关于页面则强调气候数据库、报告工具、供应链互动和市场基础设施。


              供后续章节使用时，最可靠的阶段描述是：Watershed 仍是一家非上市的 Series C 后公司。抓取证据中最新披露估值来自 February 2024 的 Series C 轮，估值 $1.8
              billion；该来源包核实的精确公开融资额来自 Series B 和 Series C 两轮，合计至少 $170 million，且更早的 Series A
              轮已获确认但此处未披露规模。总部证据共同指向旧金山，官方材料则描述公司在北美、欧洲和澳大利亚拥有多个办公室。
