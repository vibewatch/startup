  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层：直接专业厂商、套件巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合更适合看成两个同心圆，而不是一张扁平排行榜。最接近的气候优先专业厂商包括 Persefoni、Sweep、Normative、SINAI、Plan A 和 Greenly。独立比较来源反复把这些供应商与
              Watershed 放在同一碳核算品类中，TechTarget 则单独突出 IBM、Microsoft、SAP 和 Salesforce 这类绑定生态的平台。这个区分很重要：Watershed
              最干净的产品重叠通常来自气候优先专业厂商，但最难打的预算竞争可能来自既有套件或披露工具，因为它们挂在现有 ERP、CRM、云或财务项目上。


              现状本身也是真实对手。SINAI 明确把电子表格和咨询顾问作为竞品来销售，Normative 则出售内置顾问模式，替代外部方法论支持。Position Green 同样营销一个 ESG
              数据中枢，替换碎片化报告工作流。实践中，买方即便不采用
              Watershed，也可能用既有套件、披露层、内部自建或顾问重投入流程完成部分任务。这使真实市场宽于具名软件品牌，也支持把替代工作流纳入竞争分析，而不是仅当作单独章节的背景事实。
