      - number: '4.5'
        title: 财务结论与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              Watershed
              的公开论证最强处在品类位置和资源投入，而不是明确财务产出。证据基础支持这样一家公司：它确实打入企业客户，近期融资有分量，职能招聘覆盖广，产品组合也契合大型买方的采购与披露需求。证据也支持这样一个市场：Microsoft、SAP、IBM
              和 Workiva 等既有厂商可凭更宽的装机基础、打包方式和上市公司财务实力影响购买行为。估值框架上，本章使用 Workiva、IBM、SAP 和 Microsoft
              的公司层面市销率作为说明性区间，而非干净同业组；所得范围有方向性帮助，但太粗，无法直接映射到 Watershed，因为这些既有厂商业务多元，Workiva 又偏披露而非气候原生。


              因此，投资可行性的障碍很简单：Watershed
              的收入质量仍不透明。公开证据没有揭示年经常性收入（ARR）、收入结构、毛利率、净留存率（NRR）、获客成本（CAC）回本、现金余额或现金跑道。最强证据只是融资历史、客户和招聘规模、公开公司基准语境的组合，而不是一个可以逐项验证的已披露经营模型。
