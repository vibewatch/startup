companyProfile:
  summary: >-
    Watershed 是一家总部位于旧金山的非上市企业可持续发展软件公司，由前 Stripe 同事 Taylor Francis、Avi Itskovich 和 Christian Anderson 于 2019
    年创立。公开证据显示，Taylor Francis 目前担任 CEO；公司提供覆盖披露、供应商互动、产品足迹、融资排放工作流以及市场 / 行动模块的「衡量—报告—行动」平台，并已打入 Fortune
    500、银行和私募股权客户群。公开记录还确认，公司曾以 $1B 估值完成 $70M Series B 轮融资，并以 $1.8B 估值完成 $100M Series C
    轮融资，但年经常性收入（ARR）、利润率、留存和当前精确客户数仍未披露。
