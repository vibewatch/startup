  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在不同收入倍数假设下，支撑 $1.8B 估值所需的示意性 ARR。
    approximationNotes: 这些数值假设 Watershed 披露的股权估值大致等同于企业价值，因为未保留公开的债务或净现金桥接项。
