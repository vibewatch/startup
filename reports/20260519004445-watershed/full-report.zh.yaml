      - number: '5.3'
        title: 报告、控制与企业部署
        blocks:
          - type: paragraph
            body: >-
              Watershed 的报告界面面向那些需要可持续发展数据经得住鉴证的团队，而不只是填充仪表盘。披露产品强调 API 和直接上传、公共事业账单扫描、CDP API
              提交、专家指导，以及可一键跨框架更新的报告。CSRD 套件更明确：DMA 上传、具名连接器、评论、注释、审批工作流、权限控制，以及带 XBRL 标记的 Word
              导出，都指向一个协作式写作系统，而非简单导出层。加州披露页面又用 AI 生成初稿、引用和 Guaranteed Assurance 服务扩展这一模型。


              部署含义是，Watershed 看起来不像纯自助 SaaS 工具。Ashby 上的客户数据服务、可持续发展顾问、前置部署工程师和支持专家岗位，说明软件旁边还有重要实施和托管服务层。Deloitte
              的联盟页面进一步强化这一印象，描述 ERP 与计划集成、稳健控制和面向鉴证的工作流。这种混合模式对复杂全球买方是优势，但也意味着比轻量 SMB 工具更重的上手、更强的跨职能变革管理，以及对服务产能更高的依赖。
