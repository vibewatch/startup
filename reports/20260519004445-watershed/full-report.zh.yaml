    type: kpi
    layout: compact
    summary: 压缩视角显示 Watershed 哪里最强，以及邻近竞争会在哪些地方挤压差异化。
    approximationNotes: KPI 取值是基于留存公开证据的定性判断，尽调时应拿赢单 / 输单数据校验。
    data:
      items:
        - label: 气候优先工作流广度
          value: High
          note: Watershed 公开覆盖测量、披露、供应商参与、产品足迹和执行。
        - label: 采购与 Scope 3 差异化
          value: High
          note: 供应商工作流和产品足迹 AI 比通用报告功能更能在公开资料里拉开差异。
        - label: 审计与鉴证可信度
          value: High
          note: Watershed、Persefoni、IBM Envizi 和 Workiva 都宣传可审计或鉴证就绪的姿态，因此这是必要条件，但不是独占优势。
        - label: 邻近套件压力
