      - number: '8.4'
        title: 投资逻辑真实存在，但在当前证据水平下反向逻辑占上风
        blocks:
          - type: paragraph
            body: >-
              Watershed
              的估值投资逻辑并非虚构。公司似乎已经有可观的企业渗透、宽产品面、气候领域专门能力，以及很可能真正重视可审计性而非轻量报告的客户。这些特征可以支撑其相对大套件供应商获得溢价；后者只是把可持续功能接到更大的技术栈上。同业融资也显示，碳核算软件仍能融到钱。但在当前证据水平下，反向逻辑更强：欧洲政策回撤削弱了销售故事里的紧迫性，公开
              SaaS 倍数不再普遍宽松，捆绑型既有厂商能从既有软件体系内部攻击预算，而公开证据也没有披露足以支撑前十分位私募倍数的公司专属经济性。


              这种失衡解释了为什么建议摘要落在观察 / 继续研究，并配以中等置信度、高风险和偏高估值立场。公司质量可能很强，但支撑估值的证据质量并不强。溢价可以成立，但公开资料还没有证明 $1.8 billion
              估值实际上要求投资人支付的那部分溢价。
