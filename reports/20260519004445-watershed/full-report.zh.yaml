      - number: '3.4'
        title: Watershed 差异化的耐久性
        blocks:
          - type: paragraph
            body: >-
              Watershed 看起来最耐久的差异化不是泛泛的 AI。AI 辅助报告、因子匹配和工作流自动化，如今已出现在 Watershed、Persefoni、Microsoft、Salesforce、Plan
              A、Greenly、Position Green 以及其他相邻工具中。更可防守的一层，是 Watershed
              同时具备气候优先的工作流广度、供应商互动、采购挂钩的产品足迹，以及面向鉴证的透明度。对那些需要采购、可持续发展和控制团队基于同一运营模型协作的买方来说，这个组合比单独的聊天助手或报告起草功能更难复制。


              反向情景是：品类足够拥挤，买方在标准化到单一平台前，差异化就已变模糊。套件厂商可以把碳功能打包进更大的合同，Workiva
              可以掌控披露和控制层，电子表格、咨询顾问或内部工作流等替代方案对低复杂度买方仍可信。公开材料说明 Watershed 应该在哪里赢，但没有揭示真实胜率、模块附加率，或客户多大频率会让 Watershed
              与既有套件并行，而不是替换它们。这些是关键尽调缺口，因为它们决定 Watershed 的广度究竟是耐久护城河，还是仍然碎片化购买流程中的一组亮眼功能。
