  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户版图广度、行业组合与规模说法
        blocks:
          - type: paragraph
            body: >-
              Watershed 的客户证据最强之处在客户品牌质量和行业广度，而不是一个干净的客户数分母。官网首页营销 90+ 家 Fortune 500
              公司、美国前六大银行中的五家，以及全球前十私募股权公司中的六家。Trellis 另称 Watershed 与数百家高知名度企业签约，并明确点名 FedEx、General Mills 和
              Walmart。这些说法指向真实企业立足点，但彼此不能直接比较：一个是 Fortune 500 队列声明，一个是更宽的企业数量，且都没有告诉读者多少账户仍活跃、多少已投产，或每个客户用了多少模块。


              保留来源集中可核实的是具名证据的质量和多样性。Watershed
              当前案例研究覆盖医疗、私募资本、工业、物流、零售、旅行、软件、人员外包和非营利报告。买方群体也不止单一可持续发展角色：财务、采购、销售、寻源和投资组合团队都出现在公开记录中。这个组合支持一种判断：当气候数据可以在报告、商业和运营工作流中复用时，Watershed
              能卖进企业气候项目；但也意味着公开故事在头部客户品牌上远强于客户数的耐久精度。
