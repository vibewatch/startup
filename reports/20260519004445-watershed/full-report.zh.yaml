      - number: '3.3'
        title: 打包方式、定价透明度与潜在输赢动态
        blocks:
          - type: paragraph
            body: >-
              公开定价是例外，不是常态。在保留供应商中，Microsoft 最透明，公布 Sustainability Manager Essentials 每租户每月 4,000 dollars，Premium 为
              12,000 dollars；IBM 提供官方估价器，并称价格按数据量扩展、最低期限 12 个月。TechTarget 将 Persefoni、Plan A、Sweep、Watershed、SAP 和
              Salesforce 描述为报价驱动的企业软件，采用分层或定制打包。保留集中，Greenly 是最清晰的低端打包产品，有对比套餐语言和评论覆盖，将其定位为更容易进入的 SMB 入口。


              这种打包形态会带来可预期的竞争动态。大型买方愿意接受销售主导流程，以换取更强供应商工作流、产品足迹深度和气候专用记录系统时，Watershed 更可能赢。购买团队想立刻看清预算、已经运行在 Microsoft 或
              SAP 上，或把可持续发展视为现有 CRM 或报告项目的延伸时，Watershed 优势较弱。多归属也很可能存在：公司可保留 Workiva 做披露，用 SAP 或 Microsoft
              做核心数据和控制，同时仍采用 Watershed 或 Persefoni 这样的专业厂商处理气候专用工作流。这会削弱赢家通吃假设，也让真实输赢数据格外重要。
