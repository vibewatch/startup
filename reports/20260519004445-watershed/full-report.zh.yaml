  - id: TE003
    title: 信任 / 质量 / 合规表
    columns:
      - 控制 / 能力
      - 公开状态
      - 范围 / 证据
      - 运营含义
      - 剩余缺口
    rows:
      - - 审计轨迹与血缘
        - 公开宣称
        - Measure 和碳核算页面承诺完整可追溯性和审计轨迹
        - 支撑企业鉴证姿态和可辩护计算
        - 公开材料没有展示审计日志样例或血缘对象模型
      - - 自动数据质量检查
        - 公开宣称
        - Measure 页面提到 150+ 项自动错误检查和异常检测
        - 降低报告或情景工作前的人工审核负担
        - 阈值逻辑和误报处理未公开
      - - 人工审核与工作流控制
        - 公开宣称
        - AI 页面和 CSRD 页面描述人工审核、审批工作流、评论、备注和权限管理
        - 这是受监管披露和 AI 输出采纳的重要控制层
        - 没有公开角色矩阵、管理员模型或职责分离文档
      - - 鉴证支持
        - 公开宣称
        - 碳核算页面提到审计通过历史；加州页面提供 Guaranteed Assurance
        - 把审计就绪变成产品承诺，而不只是服务承诺
        - 没有关于按模块拆分的鉴证成本、排除项或失败率的公开证据
      - - 安全披露
        - 公开细节有限
        - 安全页面提供负责任披露流程，并把买方引向信任中心
        - 展示获取 NDA 材料和提交漏洞报告的买方路径
        - 在保留来源集中，信任中心细节、认证和技术控制无法公开读取
      - - 可靠性 / 运营透明度
        - 公开细节稀疏
        - 来源审查中未找到保留的公开状态页、SLA 页面或事故历史文档
        - 投资者和企业买方仅凭公开文档无法独立判断可靠性成熟度
        - 需要私下尽调正常运行时间、DR、区域策略和事故响应
    notes: Watershed 对可审计性和工作流控制的表述，远比面向公众的可靠性或安全文档明确。这是有意义的尽调不对称，不等于控制薄弱。
