      - number: '3.2'
        title: 能力重叠与买方匹配
        blocks:
          - type: paragraph
            body: >-
              在气候优先厂商中，Watershed 的公开产品广度异常偏采购和行动。保留页面描述一个统一的「衡量—报告—行动」平台，再叠加供应商互动、产品足迹 AI、清洁电力和碳移除执行。这使 Persefoni
              成为其在金融级衡量和披露严谨性上的最近对手；Sweep 则在协作式供应商工作流上最接近。Plan A 和 Normative 强调有科学基础的合规与指导，Greenly 强调速度和打包支持，SINAI
              强调转型经济性和财务规划。


              面对套件竞争对手，重叠点从气候深度转向企业相邻性。IBM Envizi、Microsoft Sustainability Manager、Salesforce Net Zero、SAP
              Sustainability 和 Workiva 都销售可审计报告和数据集成，但它们最强的公开卖点是连接更广泛的装机基础。买方希望把碳嵌进云或 ERP 流程时，Microsoft 和 SAP
              最有说服力。采购中心在财务和鉴证时，Workiva 最强。因此，采购驱动的 Scope 3 减排、产品足迹分析和气候专用执行比扩展更大企业栈的便利性更重要时，Watershed 似乎位置最好。
