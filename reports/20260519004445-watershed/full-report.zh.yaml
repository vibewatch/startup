  - id: TE004
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Watershed 方案
      - 可量化或引用的收益
      - 限制 / 注意项
    rows:
      - - 企业可持续发展测量
        - 账单、电子表格和跨职能数据收集既慢又乱
        - Measure + 智能体接入、清洗、标准化并计算足迹
        - Watershed 称测试客户的数据收集更快，检查项 150+，行动响应时间改善 80%
        - 公司自称的生产率指标没有独立基准验证
      - - CSRD / ESG 报告负责人
        - 数据收集、叙事起草和鉴证准备彼此割裂
        - Disclosures + CSRD 构建器提供连接器、协同起草、审批和 XBRL 导出
        - 一次测量可复用于多个框架和问题
        - 公开证据没有量化大型申报方节省的中位时间
      - - 加州披露负责人
        - 需要按不断演变的模板提交监管可用的气候风险和排放文件
        - 加州套件用 AI 起草 SB 261 报告，并支持 SB 253 鉴证
        - Watershed 称可在数天内完成初稿，并提供引导式鉴证支持
        - 监管变化可能迫使产品频繁更新
      - - 采购负责人
        - 基于支出的平均值会掩盖真实材料和供应商选择
        - Product Footprints 拆解单品、比较供应商，并模拟变更
        - 官方和新闻来源展示了单品级建模和置信度文档
        - 发布证据很强，但持续生产使用的证明仍稀疏
      - - 供应链项目负责人
        - 供应商问卷很少能大规模推动行动
        - Supply Chain 使用仪表板、门户、记分卡和供应商专属数据工作流
        - Klarna 和 EcoVadis 证据支持可衡量的供应商优先级排序和更好的原始数据
        - 公开文档未披露供应商回复率或持续互动指标
      - - 减碳 / 清洁电力负责人
        - 测量工具往往止步于真实商业行动之前
        - Act + Marketplace + VPPA 结构把目标连接到清洁电力和碳移除执行
        - Canva 案例展示了五家供应商、20 MW 的 VPPA 结构及其足迹影响
        - 经济性、信用支持和项目选择表现仍未公开
      - - 财务 / 投资组合团队
        - 融资排放数据分散在多个来源和资产类别中
        - Watershed Finance 将公司、问卷、PCAF、CDP 和 CEDA 数据整合进一个模型
        - 支持 LP / 监管报告和资产类别扩展
        - Finance SKU 没有公开定价或客户渗透数据
    notes: 该表混合使用官方产品主张、客户案例研究和独立评论，说明平台在真实工作流中看起来最强的位置，以及证据仍依赖公司说法的位置。
