      - number: '8.2'
        title: 公开可比公司显示，Watershed 在低倍数市场里争取溢价
        blocks:
          - type: paragraph
            body: >-
              最有用的公开区间不是单一同业，而是分层可比。Workiva 是保留资料中最接近的披露与控制软件参照：它报告 2024 年收入 $738.7 million，订阅和支持约占 90%，总留存率 97%，净留存率
              112%，当前市值约 $2.79 billion，隐含收入倍数只有约 3.8x。Salesforce、IBM 和 SAP 尽管规模、积压订单和经营杠杆巨大，也都处在类似克制的个位数市值 /
              收入区间。Microsoft 是例外，收入倍数约 11x，因为投资人在承销很大的 AI 和云增长，以及异常强的商业积压订单。


              SaaS Capital 的更宽框架解释了为什么这件事重要。其 2025 年 6 月公开 SaaS ARR 倍数中位数为 6.7x，2023-2025 年的「新常态」大致落在 6x 到 8x，居中区间可从约 4x
              延伸到 10x。换句话说，当前公开软件市场仍会为异常优秀的赢家付出溢价，但默认状态已不再是自动给软件溢价。对 Watershed
              来说，溢价情景可以成立，但必须靠异常强的增长、留存和产品深度挣出来，不能只靠类别标签。
