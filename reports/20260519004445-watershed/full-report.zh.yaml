      - number: '2.2'
        title: 规模测算视角：市场很大，标签不一
        blocks:
          - type: paragraph
            body: >-
              已发布市场数据支持一个有意义的软件品类，但无法支撑单一干净的标准总可用市场（TAM）。保留来源横跨碳核算软件、碳管理系统、碳管理软件和可持续发展管理软件；各来源对服务、垂直行业和相邻报告工作流的处理都不同。TBRC
              将 2026 年碳核算软件市场定为 $27.78 billion，Mordor 将 2026 年碳管理软件定为 $18.17 billion，Global Market Insights 将 2026
              年碳管理系统定为 $15.9 billion。Grand View 的 2025 年基线为 $14.13 billion，而 Technavio 的可持续发展管理框架更窄，且更偏披露。


              因此，有用做法是收束而非夸大。Grand View 和 Mordor 都显示大型企业主导支出，北美仍是最大买方基础。把这些已发布份额套到 2026 年市场区间上，可得到一个大约 $10 billion 至 $20
              billion 的大型企业软件可服务市场（SAM），以及一个更窄、面向北美大型企业的约 $3.6 billion 至 $7.7 billion 视角。该底层并不是 Watershed
              的真实可获取市场（SOM）；公开来源没有拆出有多少份额流向独立平台，而不是套件、审计栈或服务。
