      - number: '7.5'
        title: 缓释措施可信，但投资人仍需要硬性否决条件
        blocks:
          - type: paragraph
            body: >-
              Watershed 并不是空手面对这些风险。相比许多可持续发展供应商，公司公开了更深的控制与可信度表面：内部技术专家、顾问小组、AI 治理语言、数据血缘、匹配分数理由、关于审计表现的公开主张，以及来自 CDP
              的外部合作伙伴验证。这些是真实缓释因素，因为它们表明 Watershed
              明白市场要往哪里走，也已经在可追溯性和方法论这些枯燥工作上投入。它们也解释了为什么公司能把销售从纯报告延伸到供应商参与、产品足迹工作和经过筛选的行动产品。


              但风险章节必须明确，什么情况会真正打破投资逻辑。最干净的否决条件都是可观察的：尽管 SB 253 继续推进，加州带来的预订停滞；Omnibus 门槛重置后，欧盟管线明显走弱；一项面向客户的更正追溯到 AI
              生成内容；一个经过筛选的移除项目演变为公开主张失败；或私下尽调发现，强 logo 背后藏着收入集中和续约偏弱。在管理层用私有数据补上这些证据缺口之前，诚实的残余风险评级仍应偏高，即便类别本身依旧有吸引力。
