              具名客户故事显示，Watershed 被用于生产式项目，而不是投机性试点工具。World Market、Harris Farm、Delivery Hero、CDP、AdventHealth 和 Smiths
              等合规负担重的买方，用它建立首次足迹、压缩报告周期，或为 CSRD、CDP、加州和 ASRS 式披露要求做准备。与此同时，Burton、Albany、Figma、Pinterest、Skyscanner 和
