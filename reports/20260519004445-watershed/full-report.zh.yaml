  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 乐观、基准、悲观三个估值区间来自明确的年经常性收入（ARR）和倍数假设，而不是未披露的公司预测。
    approximationNotes: 这些区间只是把简单倍数带套在示例 ARR 情景上；不是 DCF 结果，也未调整任何未披露的现金、债务或清算优先权。
    data:
      items:
        - label: 悲观情景
          low: 360
          high: 900
          unit: $M
        - label: 基准情景
          low: 1000
          high: 1960
          unit: $M
        - label: 乐观情景
          low: 2100
          high: 3240
          unit: $M
    claimRefs:
      - CV044
      - CV054
      - CV055
      - CV056
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 基于公开证据，对六个最关键维度打分，判断 Watershed 今天是否配得上溢价倍数。
    approximationNotes: 截至 2026-05-19，分数是基于留存公开证据作出的 1–5 分分析判断；目的在于显示公司质量与证据质量之间的不均衡。
    data:
      items:
        - label: 市场相关性
          value: 4
          unit: /5
          note: 大买家仍需要气候数据和采购可见性，即便紧迫性不再一致。
        - label: 产品深度
          value: 4
          unit: /5
          note: 报告、供应链和市场平台覆盖面，支撑真实的溢价逻辑。
        - label: 客户验证
          value: 4
          unit: /5
          note: 蓝筹 logo 和受监管买家支撑企业级可信度。
        - label: 经济性可见度
          value: 1
          unit: /5
          note: ARR、毛利率、净留存率、服务收入占比和现金情况仍未公开披露。
        - label: 倍数支撑
          value: 2
          unit: /5
          note: 溢价仍有可能，但当前公开软件市场已不再天然宽容。
        - label: 下行风险
          value: 2
          unit: /5
          note: 政策回撤、捆绑竞争和股权结构不透明，让剩余风险仍然偏高。
    claimRefs:
      - CV042
      - CV048
      - CV049
      - CV050
      - CV051
      - CV052
