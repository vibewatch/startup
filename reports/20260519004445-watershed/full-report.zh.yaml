  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最近一次可验证估值、已知规模，以及公开层面仍不可知的部分
        blocks:
          - type: paragraph
            body: >-
              Watershed 的估值讨论从一个坚硬的公开锚点出发，然后立刻撞上不透明。硬锚很清楚：Watershed 自己的 C 轮公告和 Reuters 都称，公司在 2024 年 2 月以 $1.8 billion
              估值融资 $100 million；此前曾以 $1 billion 估值融资 $70 million。公开资料也支持一个判断：这是真正的企业平台，不是只停留在融资故事里的公司。Watershed 称自己有近
              400 名员工、全球办公室，以及包括美国六大银行中四家和十大私募股权公司中六家的客户。这些事实重要，因为它们至少从类别重要性和买方质量上，让 $1.8 billion 的估值有可辩护性。


              公开资料仍未揭示的，才是真正决定估值便宜还是昂贵的部分：ARR、确认收入、毛利率、服务负担、净留存、净现金和优先股堆叠。由于这些数字缺失，本章把 $1.8 billion
              估值当作指示性框架，而不是按市值计价的事实。唯一站得住脚的公开方法，是从已披露股权价值出发做情景数学，反推在当前软件倍数环境下，收入或 ARR 需要达到什么水平，才能让该估值显得有吸引力、合理或偏高。
