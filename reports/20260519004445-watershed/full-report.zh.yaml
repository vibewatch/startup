  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与仍不透明的部分
        blocks:
          - type: paragraph
            body: >-
              Watershed
              的公开材料支持一个直观的高层变现故事，但还不足以支撑完整投资测算。官方产品页展示了「衡量—报告—行动」企业平台、专门的供应链工作流，以及面向可持续采购的产品足迹产品。这些证据符合模块化企业软件模式：基础平台可扩展到供应商互动、报告和产品足迹工作。缺失的是商业层：审阅过的公开来源集没有披露
              Watershed 的年经常性收入（ARR）、总收入、平均合同价值或真实定价。Business Insider 给出最清晰的公开牵引线索，引用 Taylor Francis 称 January 2025 是
              Watershed 有史以来新收入最好的一个月，但文章明确说他没有披露数字。


              与相邻供应商的对比有用。Microsoft 仍公布 Sustainability Manager 的标价，IBM 提供基于数据量的定价估价器并写明最低期限，Workiva
              则公开称其打包方式是定制、企业级、无限席位导向。Watershed
              在保留的官方材料中没有提供等价公开价格卡。这不意味着定价权弱；它意味着公开证据只足以把收入机制描述为销售主导的企业软件，且大概率可模块扩张，而不足以给业务定规模或测试价格兑现。
