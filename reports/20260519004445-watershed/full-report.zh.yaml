      - number: '5.4'
        title: 采购级 Scope 3 与行动引擎
        blocks:
          - type: paragraph
            body: >-
              Watershed 最差异化的公开技术故事，是从衡量连到采购和减碳。Supply Chain 不只是一个问卷工作流：它把供应商披露、记分卡、门户和气候教育，与 Product Footprints
              结合起来；后者会把采购商品拆解为材料和工艺，比较供应商和工厂，并让团队在签约前模拟变化如何流经足迹。外部发布报道还给出有用细节，描述置信度评分、来源文档和早期企业试点，这比单纯营销文案证据更强。


              行动层在这个品类中也异常具体。Marketplace 材料展示了碳移除项目的正式审查评分表，以及包含 VPPA、清洁电力和 SAF 证书的菜单；Canva 案例则展示 Watershed
              用这套机器为五家印刷供应商设计固定价格 VPPA。EcoVadis 又给出另一个信号：将供应商一手数据和 PCF 计算直接接入 Watershed 的碳核算引擎。合起来看，这些来源让 Watershed
              不像只做报告的供应商，更像面向可持续发展团队的软件加执行平台，服务采购、财务和供应商协作。剩余不确定性是采用深度：发布和案例研究证据真实存在，但公开的模块级使用数据仍薄。
