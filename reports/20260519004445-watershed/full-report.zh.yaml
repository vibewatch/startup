  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 统一平台图谱
        blocks:
          - type: paragraph
            body: >-
              Watershed 最强的公开产品信号，是它并未把自己卖成狭窄的碳计算器。产品被打包为「衡量—报告—行动」平台，可持续发展 AI
              覆盖整个工作流，因此同一数据底座可以服务足迹、披露、减排规划和采购决策。Measure 层接入 API、直接上传、公共事业账单扫描和杂乱电子表格，再把它们标准化为可复用气候数据集。Watershed
              反复强调可审计运营：内置 500,000 个排放因子、150+ 项自动错误检查、带引用的 AI 输出，以及完整数据血缘，让数字可以追溯到源输入。


              这种打包很重要，因为它把 Watershed 定位为气候数据基础设施，而不是年度报告工具。公开产品界面如今已远超衡量，延伸到财务专用工作流、CSRD
              与加州报告、供应商互动、产品级采购分析、清洁电力和碳移除执行，以及 AI 辅助数据工作。平台看起来面向大型企业设计：可持续发展、财务、采购和鉴证团队需要一个共同记录系统，而不是一堆互不相连的计算器。
