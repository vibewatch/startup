      - number: '4.3'
        title: 从上市可比公司看毛利率与单位经济性基准
        blocks:
          - type: paragraph
            body: >-
              Watershed 不披露毛利率、软件与服务结构、剩余履约义务或留存。保留集中最接近的公开基准是 Workiva，它位于市场的披露与控制端。Workiva 的 10-K 显示，2024 年收入为 $738.7
              million，约 90% 来自订阅和支持，毛利为 $566.6 million，剩余履约义务约 $1.2 billion。若软件层占主导，这为成熟企业报告平台可能呈现的样子提供了有用参照。IBM 和 SAP
              展示了区间另一端：IBM 在更宽的软件—咨询组合上报告 58.2% 毛利率；SAP 即便云和软件达到总收入 88%，服务毛利率仍为 25.1%。


              这些上市公司披露不能让 Watershed 在完全同口径下可比，但能框定可能经济性。若 Watershed
              主要是经常性软件，利润率可能更接近披露软件规范。若上手、数据转换和顾问工作仍占交付很大份额，贡献利润率可能向企业软件现实的低端压缩。公开招聘产品专家、顾问、分析师和战略客户成功岗位，使服务成分难以忽略。
