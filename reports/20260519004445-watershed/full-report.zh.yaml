      - number: '2.3'
        title: 购买方、使用方与付费方分层
        blocks:
          - type: paragraph
            body: >-
              该市场的买方归属是跨职能的，不是单一部门的。Deloitte 行业调研显示，首席可持续发展官常常拥有披露管理，但 CFO 也频繁共同承担责任，ESG 控制人员正在接手更多披露工作。PwC
              把同一点说得更直接：CFO 和 ESG 控制人员越来越多与可持续发展负责人协作，因为他们可以把可持续发展嵌入财务报告流程，并在不同司法辖区复用共同数据底座。Workiva 的 2026
              年调查解释了财务为什么进场：碎片化数据被视为重大报告风险，CFO 被要求为财务和非财务数据建立单一事实源。


              Scope 3 从愿景变成运营要求后，采购就会成为核心。CDP 将供应商级气候数据定位为采购决策工具，World Economic Forum 也认为，可信的 Scope 3
              进展要靠把披露与采购治理、更好的供应商数据连接起来。实践中，用户横跨可持续发展、财务和控制、采购、内审、IT
              或数据团队。因此，预算批准最可能落在财务，或财务与可持续发展共建的项目办公室；当供应商数据收集或业务流程集成成为真正瓶颈时，采购和运营也会变成共同负责人。
