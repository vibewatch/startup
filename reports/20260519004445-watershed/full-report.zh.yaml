      - number: '2.4'
        title: 增长驱动、采用约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              需求驱动仍然真实，但已不再单向。加州继续为超大型公司制造具体截止日期；EU 即使收窄制度后，仍把最大跨国企业留在范围内；市场报告和供应商来源都强调可审计报告、互操作性和 AI
              辅助数据管理是采购催化剂。Deloitte 还显示，气候报告不只是合规问题：在 TMT 中，69% 的受访者称客户经常或总是把 GHG 数据作为 RFP 要求，这把报告能力变成了收入基础设施。


              约束同样实质。SEC 规则仍处于中止且政治上不稳定，SB 261 的首个截止日期受禁令影响，EU omnibus
              又降低近期覆盖面，这些都可能拉长决策周期或缩窄最先购买的人群。数据仍散落在企业系统、供应商和披露框架之间。WEF 和 GHG Institute 显示，Scope 3
              方法仍难以标准化和比较，尤其在供应商激励弱、买方面临搭便车问题时更是如此。该品类还挤满替代方案：SAP、Microsoft、Salesforce、IBM、Workiva、咨询顾问，甚至基于电子表格的工作流，都在争夺同一笔预算。对
              Watershed 来说，估值应更多依托大型企业工作流深度和跨职能控制权，而不是简单的「巨大总可用市场（TAM）」叙事。
