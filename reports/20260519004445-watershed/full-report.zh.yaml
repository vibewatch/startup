      - number: '8.5'
        title: 入场纪律应绑定私有证据，而不是类别乐观
        blocks:
          - type: paragraph
            body: >-
              实际投资问题不是 Watershed 是否令人印象深刻，而是到 2026 年，什么证据才能让 2024 年估值值得支付。答案很直接。若要承销现有价格，投资人需要看到私有证据：当前 ARR 至少大约 $120
              million 到 $150 million，且留存强、毛利率稳、服务拖累有限；否则就需要一个明显低于最近可验证估值的入场价格。如果私下尽调反而显示 ARR 低于约 $100
              million、续约弱，或管线过度集中在时间表已被推迟的报告强制要求上，估值逻辑会迅速恶化。


              因此，下一步尽调必须具体，而不是泛泛而谈。应要求管理层提供当前 ARR 和确认收入、NRR 和
              GRR、软件与服务的毛利率拆分、现金和债务、股权结构条款与优先权，以及管线在监管驱动工作和更广泛脱碳采购之间的拆分。这些项目会迅速解决大部分估值不确定性。在此之前，本章立场保持刻意保守：跟踪公司，把类别放在观察名单上，但不要把上一轮定价当成自我验证。
