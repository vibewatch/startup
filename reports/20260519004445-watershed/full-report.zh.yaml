  - id: TV005
    title: 投资逻辑破裂和放弃触发条件表
    columns:
      - 触发条件
      - 阈值 / 信号
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - ARR 低于支撑溢价的水平
        - 私营口径 ARR 大约低于 $100M
        - 当前估值开始隐含 >18x 收入，或只能靠无依据的乐观假设支撑。
        - 估值不重设、结构不改变，就不要按 2024 年标记价格出价。
      - - 续约弱或扩张差
        - NRR 低于优质软件常模，或模块扩张不足
        - 产品深度不能变现，溢价倍数逻辑随之塌掉。
        - 除非价格大幅调整，否则转向回避。
      - - 交付偏服务化
        - 毛利率或服务收入占比明显弱于软件主导型同业
        - 可比区间会下移到低个位数，最好也只是十倍出头。
        - 把当前估值视为偏高到昂贵。
      - - 政策驱动销售管线集中
        - 相当比例签约额绑定在欧盟或加州延后生效的时间表上
        - 需求兑现时间风险不再只是增长节奏噪音，而会变成估值风险。
        - 下调合理倍数，并重看基准 / 悲观情景。
      - - 大型客户内套件捆绑胜出
        - 大型买方选择 Microsoft、Salesforce、SAP 或 Workiva 模块，而不是扩展 Watershed
        - Watershed 失去“深度值得溢价”的论点，却仍要承担独立获客与销售成本。
        - 向成熟套件倍数重估，而不是继续押注气候原生溢价。
    notes: 这些是可观察的放弃标准，会直接改变合理倍数区间，不只是听起来方向性负面。
    claimRefs:
      - CV047
      - CV050
      - CV052
      - CV053
      - CV056
      - CV057
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 具体尽调路径
    rows:
      - - 当前 ARR / 已确认收入
        - 按产品拆分的当前 ARR、签约额和已确认收入
        - 这是检验 $1.8B 估值是合理还是偏高的最快办法。
        - 索取月度 ARR 桥接表、当前季度实际数和 FY2026 董事会预测。
      - - 留存与扩张
        - 按客户细分拆分的 GRR、NRR、队列扩张和模块挂载
        - 溢价倍数需要可持续的扩张经济性，不能只靠漂亮客户名头。
        - 索取队列表和按模块拆分的 ACV 扩张。
      - - 毛利率与服务组合
        - 软件毛利率、专业服务挂载和实施负担
        - 交付偏服务化会显著压低合理倍数。
        - 索取毛利率拆分和部署工时基准。
      - - 股权结构表与优先权
        - 清算优先权、参与权、老股交易，以及任何高于普通股的结构
        - 如果优先权负担不小，上一轮定价可能高估普通股等价价值。
        - 索取当前股权结构表、公司章程和附函摘要。
      - - 现金与债务桥
        - 现金、债务、营运资本和任何表外义务
        - 有债务或现金不足，都会打破本章采用的简单股权价值≈EV 假设。
        - 索取最新资产负债表、债务明细和财务约束条款摘要。
      - - 政策相关销售管线拆分
        - 由披露强制要求驱动的签约额，与更广泛采购或减碳需求驱动的签约额各占多少
        - 这决定了增长和倍数假设需要承受多大的政策回撤风险。
        - 索取按用例、地区和监管触发因素拆分的销售管线与签约额。
    notes: 每个尽调问题都直接对应一个估值问题，而不是把备忘录拉宽却不改变结论。
    claimRefs:
      - CV050
      - CV051
      - CV052
      - CV057
