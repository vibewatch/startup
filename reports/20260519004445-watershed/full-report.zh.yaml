          - type: callout
            title: 立场为何保持保守
            body: 如果强制要求时间表走弱、捆绑型既有厂商夺走预算份额，合理倍数可能滑入 6x 到 8x 区间；要支撑 2024 年估值，就需要约 $225M 到 $300M 的 ARR。
            calloutType: risk
            claimRefs:
