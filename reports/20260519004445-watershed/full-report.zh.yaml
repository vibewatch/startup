      - number: '4.2'
        title: 从招聘和客户证据看 GTM 模式与成本代理指标
        blocks:
          - type: paragraph
            body: >-
              Watershed 不公布获客成本（CAC）、回本周期或实施时长，因此最好用员工版图和客户证据作为公开代理指标。Watershed 关于页面和 Business Insider 都把公司人数放在 380 至
              400 人左右，招聘页面则描述旧金山—伦敦双总部模式。Built In 职位列表补充了运营细节：岗位分布在伦敦、墨西哥城、旧金山、纽约、柏林和丹佛，职能横跨企业客户经理、SDR
              领导、解决方案咨询、可持续发展产品专家、战略客户成功、顾问、数据和薪酬。这是一家销售主导企业平台的组织架构，不是低接触自助式 SaaS 模式。


              客户证据也支持这一解读。官方案例研究覆盖 Carlyle、Klarna、New Relic、TaskUs 和 JPMorgan Chase，说明 Watershed
              正卖进大型、往往跨职能的项目，采购、财务、可持续发展和运营都很重要。TaskUs 案例在财务上尤其相关，因为它把气候工作描述为客户和供应商的要求，而不是纯自愿行动。这些线索合在一起，意味着 Watershed
              增长大概率依赖昂贵的企业销售和上手服务，但公开记录仍无法把它转化为获客成本（CAC）或回本周期。
