      - number: '1.5'
        title: 监管背景、逆风与可复用事实
        blocks:
          - type: paragraph
            body: >-
              Watershed 的需求叙事建立在真实监管催化剂之上。SEC 在 March 2024 采纳气候披露规则，Reuters 也明确把 Watershed 的 Series C
              轮与气候披露从可选走向强制联系起来。这解释了公司为何把衡量、可审计报告和减碳执行放进同一个平台叙事里。同时，背景并非单向利好。Business Insider 引述 Taylor Francis
              称，政策钟摆没有朝正确方向摆动，尽管企业仍在幕后推进气候工作；该报道还称 Francis 认为 Microsoft 和 Salesforce 是 Watershed 最大竞争对手。


              公开财务披露同样稀薄。Business Insider 称 January 2025 是 Watershed
              有史以来新收入最好的一个月，但没有给出收入或年经常性收入（ARR）数字，因此后续财务分析应把公开收入数据视为不可得，而不是自行推断。本章最干净的可复用事实更窄：Watershed 始于 2019
              年，总部位于旧金山，公开由 Taylor Francis 领导，最近披露的一轮融资是 Greenoaks 领投、规模 $100 million、估值 $1.8 billion 的 Series C
              轮；公司运营一个全球企业可持续发展平台，客户规模指标广泛但描述略不一致。
