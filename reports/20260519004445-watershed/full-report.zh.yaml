      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              独立创始人资料一致将 Watershed 描述为 Taylor Francis、Avi Itskovich 和 Christian Anderson 的项目。三人在 Stripe 相识，并以 Stripe
              早期气候行动为跳板，创办了一家把气候工作转为企业运营优先级的公司。在当前证据中，Taylor Francis 是外部识别最清晰的 CEO：Inspired Capital 称其为 Watershed
              CEO，Business Insider 也将他写成带领公司穿越更艰难 2025 年政策环境的联合创始人。Christian Anderson 则反复以联合创始人和运营发言人身份出现在 Watershed
              官方公告中，尤其围绕 Open CEDA、墨西哥城等产品、科学和扩张话题。


              一个值得注意的治理质量提示，是第三方目录披露漂移。Craft 将 Christian Anderson 列为 CEO，这与 2024-2025 年资料中 Francis 担任 CEO
              的说法冲突，更像是目录数据过时，而非真实领导层变动。公开材料还显示，公司拥有高调顾问和投资人网络，包括 Sequoia、Kleiner Perkins、Greenoaks、Christiana Figueres
              和 Al Gore。该网络增加可信度，但保留证据仍未公开详细董事会构成、投资人控制权和股权结构集中度。
