  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 证据
      - 影响
      - 尽调问题
    rows:
      - - 加州披露截止日期
        - 驱动
        - 2026-2027
        - SB 253 为超大型公司设定了明确覆盖门槛和 2026/2027 报告节奏
        - 即便联邦规则摇摆，也支撑高端企业需求
        - Watershed 管线中有多少来自受加州规则影响的实体？
      - - 欧盟大型公司报告要求仍在
        - 混合驱动
        - 2025-2029
        - Omnibus 缩窄了范围，但最大型跨国公司仍在范围内，并保留有限鉴证
        - 大型企业需求仍在，但中端市场的普遍紧迫感下降
        - 目标客户中有多少比例在 Omnibus 之后仍在适用范围内？
      - - 审计就绪报告和互操作性
        - 驱动
        - 当前
        - PwC、Workiva 和供应商页面都强调控制、鉴证和可复用数据底座
        - 利好同时打通数据血缘、报告和鉴证工作流的平台
        - Watershed 在鉴证或财务控制负责人牵头用例上的附加率是多少？
      - - Scope 3 采购和供应商数据
        - 驱动
        - 当前
        - CDP 和 WEF 显示，供应商数据、采购规则和标准化披露处在核心位置
        - 利好能做透供应商参与的平台，而不只是足迹计算
        - Watershed 的供应商响应率是多少，又自动化了哪些采购工作流？
      - - SEC 规则回撤和诉讼不确定性
        - 约束
        - 当前
        - SEC 规则仍处于搁置状态，委员会也已停止为其辩护
        - 美国联邦层面的紧迫感下降，一些买家可能推迟
        - Watershed 对 SEC 专项销售动作依赖多深？
      - - SB 261 禁令和州级执行不均
        - 约束
        - 当前
        - 诉讼推进期间，CARB 暂停执行 Jan. 1, 2026 截止日期
        - 州级需求仍真实存在，但时点风险拉长销售周期
        - 客户在预算时点上如何区分 SB 261 和 SB 253？
      - - 割裂的手工数据环境
        - 约束
        - 当前
        - Workiva 和 ESG Today 将手工、割裂的数据描述为核心挑战
        - 实施投入仍高，早期项目可能由服务占主导
        - 有多少部署需要重度数据清洗服务？
      - - 供应商参与和搭便车动态
        - 约束
        - 当前
        - WEF 强调 Scope 3 工作中供应商激励弱、共享收益难的问题
        - 没有治理变化，单靠软件解决不了供应商参与
        - Watershed 的价值主张有多依赖客户的采购权力？
      - - 重叠的套件、咨询顾问和电子表格
        - 约束
        - 当前
        - SAP、Microsoft、Salesforce、IBM 以及 Excel 周边工作流都覆盖部分工作
        - 品类重叠会压缩定价，也让胜率分析变复杂
        - Watershed 在哪些场景会稳定替代套件，哪些场景只是共存？
      - - RFP 和商业压力
        - 驱动
        - 当前
        - Deloitte 报告称，69% 的 TMT 受访者经常或总是在 RFP 中遇到 GHG 报告要求
        - 气候报告因此变成促成收入的基础设施，而不只是合规支出
        - 哪些垂直行业能把 RFP 压力最快转成软件采购周期？
    notes: 最强的一组驱动—约束是：一边是监管加商业压力，另一边是政策重置和实施摩擦。 时点和规模同样重要，因为许多买家现在会先排数据底座工作，再启动更广的脱碳项目。
