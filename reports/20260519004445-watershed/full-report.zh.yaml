        title: 耐久度信号、评测面与客户风险
        blocks:
          - type: paragraph
            body: >-
              到客户关系耐久度这一层，公开资料明显变薄。仍有一些有用的重复工作流信号：差旅恢复后，Kainos 需要更频繁地做排放复核；CDP 在多个办公室之间快速完成了首份报告；Figma 和 Smiths
              的客户自有页面也确认，Watershed 不只是在自己官网上展示案例，确实被用于实际工作。FeaturedCustomers
              还提供了可见的引用面，包括评论、案例研究和视频。上述信号有意义，但还不足以按投资人通常需要的方式证明软件留存：保留下来的公开来源没有披露 NRR、GRR、流失率、合同期限或续约率。


              最清晰的反向信号来自独立评测面，而不是流失客户评论。Toolradar
              提到定价不透明、学习曲线风险和集成工作量；这也吻合案例研究里的更大模式——这些案例反复强调上线、审计就绪和跨职能数据工作。这不等于客户质量弱；事实上，已点名的客户组合异常强。但它意味着，剩下的尽调压力集中在三件事：真实活跃客户数、按收入或行业看的集中度，以及这种重交付部署模式最终带来的是持久续约，还是一次性实施成功。
