      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Watershed 最强的硬财务证据仍是融资历史，而不是经营结果。公司自己的 Series B 文章披露了一轮 $70 million 融资，估值 $1 billion；官方 Series C 文章和
              Reuters 均确认，公司在 February 2024 以 $1.8 billion 估值完成 $100 million 融资。这意味着保留来源集中可见的精确披露股权资本，仅这两轮就至少 $170
              million。再叠加约 380 至 400 人团队和多办公室版图，这一资本基础足以支撑严肃的企业软件建设。


              公开证据无法回答的是，相对于当前烧钱速度，这些资本是否仍然充裕。没有审阅来源披露手头现金、月度烧钱速度、现金跑道、债务或契约结构。也没有可见证据显示项目融资、硬件库存或制造资本开支义务，因此可观察资本强度看起来主要由人员、软件和销售与市场拓展驱动，而非资产驱动。即便如此，没有现金桥、董事会材料或管理层对烧钱速度的评论，公开证据只能说
              Watershed 过去已融资不少、目前看起来仍在运营活跃，不能判断它离下一次融资触发点远近。
