  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 最新收入依据
      - 当前市值 / 行业估值
      - 代理倍数 / 状态
      - 相关性
      - 主要局限
    rows:
      - - Workiva
        - 2024 年收入 $738.7M；订阅与支持约 90%；2026 年指引 $1.037B-$1.041B
        - 2026 年 5 月市值 $2.79B
        - 市值 / 2024 年收入约 3.8x
        - 最接近的披露与控制软件类比，留存和增长数据可见。
        - 不是气候原生，且尽管留存强劲，公开市场当前仍给出克制倍数。
      - - Salesforce
        - FY2026 收入 $41.5B；订阅与支持约 95%；当前 RPO $35.1B
        - 2026 年 5 月市值 $146.82B
        - 市值 / FY2026 收入约 3.5x
        - 展示一个有 backlog 支撑的规模化企业软件平台，今天在市场上如何交易。
        - 产品套件比 Watershed 宽得多，并受益于装机基础捆绑。
      - - Microsoft
        - FY2025 收入 $281.7B；Azure >$75B；FY26 Q3 云收入 $54.5B
        - 2026 年 5 月市值 $3.146T
        - 市值 / FY2025 收入约 11.2x
        - 作为 AI 与云的高端离群样本有用，显示公开市场如何奖励非凡规模和动能。
        - 规模太大、业务太分散，不能直接当可比公司；它明显是离群值，不适合作为中位数锚点。
      - - IBM
        - 2025 年收入 $67.5B；毛利率 58.2%；软件约占收入 45%
        - 2026 年 5 月市值 $209.35B
        - 约 3.1x 市值 / 2025 年收入
        - 适合作为成熟套件型下限案例：企业软件占比真实，但业务多元。
        - 混合模式和存量客户基础让它只能当下限，不能类比成长型倍数。
      - - SAP
        - 2025 年收入 €37.804B；毛利 €26.814B；营业利润率 26.1%
        - 2026 年 5 月市值 $205.86B
        - 未做汇率调整前约 5.4x 市值 / 2025 年收入
        - 可作为 ERP 邻近平台参照，用来观察一体化可持续发展工作流。
        - 收入以欧元披露；不做汇率标准化时，这个比率只是近似值。
      - - SaaS Capital Index
        - 2025 年 6 月公开 SaaS ARR 倍数中位数
        - ARR 倍数中位数 6.7x；中间区间 4x-10x
        - 行业区间，不是公司特定口径
        - 留存资料里最好的全行业读数，能看出公开 SaaS 市场眼下奖励什么、惩罚什么。
        - 它不是气候软件专属，也不能直接拿来和 ARR 未知的私营公司相比。
    notes: 这些行把当前上市公司市值 / 收入代理值和一个行业 ARR 倍数指数放在一起，用来框定 Watershed 可能的倍数区间。这只是指示性框架，不是干净的可比公司组，也不是债务调整后的 EV 分析。
