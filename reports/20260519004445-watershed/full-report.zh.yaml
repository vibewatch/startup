  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 加利福尼亚需求回撤
        - SB 261 暂缓持续，SB 253 准备工作转化不佳
        - 与加利福尼亚合规相关的销售管线或预订连续两个季度低于计划
        - 将合规驱动增长假设视为高估，并重新评估销售效率。
      - - EU Omnibus 需求压缩
        - 新门槛应用后，欧盟销售管线未能回补
        - 管理层无法证明缩小后的适用队列中，或纯报告用例之外，赢率保持稳定
        - 下调欧洲驱动的增长假设，并在尽调中强调非报告产品价值。
      - - 方法重跑
        - 标准更新迫使历史输出大范围重述
        - 多名客户因标准发生实质变化，必须重跑足迹、报告或供应商基线
        - 提高预期服务成本，并将审计声明视为耐久性较弱。
      - - AI 信任失效
        - 重大客户更正、公开投诉或审计失误可追溯至 AI 生成输出
        - 一份受监管申报或客户报告因模型生成内容错误而需要公开更正
        - 治理指标获得独立验证前，暂停给予 AI 杠杆任何溢价倍数。
      - - 捆绑竞争
        - 现有套件靠价格或存量套件绑定赢得份额
        - Watershed 因捆绑经济性或 CIO 偏好，在具名交易中输给 Microsoft、Salesforce、SAP 或 Workiva
        - 在基准情景中假设价格实现降低、周期拉长。
      - - 市场平台可信度
        - 移除项目交付不足，或声明措辞引发法律审查
        - 经筛选项目的反转、交付失败，或 AB 1305 / FTC 投诉触及 Watershed 赋能的声明
        - 将市场平台视为责任放大器，而不只是增购向量。
      - - 不透明与集中度
        - 私有数据揭示敞口集中或续约偏弱
        - 前 10 大客户或行业贡献 ARR 比例过高，或 NRR 低于软件质量预期
        - 重置估值，以反映集中度和实施较重的留存风险。
    notes: 阈值是承销用尽调启发式标准，不是管理层指引或公开承诺。
    claimRefs:
      - CR006
      - CR009
      - CR011
      - CR020
      - CR025
      - CR030
      - CR045
      - CR046
      - CR050
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前公开证据判断
      - 判断依据
      - 决策含义
    rows:
      - - 建议
        - 观察 / 继续研究
        - 公司质量可能很强，但核心估值输入仍未披露。
        - 不要仅凭公开证据，在最后一次经验证估值上给出高确信买入。
      - - 信心
        - 中
        - 公开可比公司、政策和同行融资背景扎实，但 Watershed 特定经济指标未披露。
        - 私有尽调仍可能显著改变判断，向上或向下皆有可能。
      - - 风险评级
        - 高
        - 下行同时来自公司不透明，以及外部倍数压缩或政策延期。
        - 使用硬性否决标准，而不是叙事乐观。
      - - 估值立场
        - 偏高
        - 只有 ARR 和质量指标已经异常强劲时，当前估值才显得合理或有吸引力。
        - 当前价格需要证据，而不只是品类热情。
      - - 上调触发因素
        - ARR / 留存 / 利润率证据或更低入场价
        - 缺失指标直接决定应适用哪一档倍数。
        - 没有这些证据，就继续观察，不要强行给出精确判断。
    notes: 本表总结的是截至最后一次经验证的 2024 年 2 月估值时，基于公开证据得出的判断，不代表实时谈判条款清单。
