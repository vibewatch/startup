  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现实替代方案
        blocks:
          - type: paragraph
            body: >-
              Watershed 的现实市场最好定义为企业气候与可持续发展记录系统软件，而不是整个气候科技、咨询或减碳宇宙。核心纳入支出是这类软件：接入企业和供应商数据，计算 Scope 1、2、3
              清单，把控制映射到披露框架，支持鉴证，并帮助团队推动减排。保留证据都能看到这一更宽边界：分析师页面描述碳核算或碳管理软件，Workiva
              加入带证据链的披露和鉴证工作流，SAP、Microsoft、Salesforce 和 IBM 也都在更大的企业套件内销售 ESG 数据、报告和运营引导模块。


              排除边界同样重要。本章不计入纯咨询人力、抵消、可再生能源采购、传感器，或 ERP、CRM、云平台的完整合同价值，除非支出明确指向气候或 ESG 模块。买方仍可用
              Excel、咨询顾问、供应商问卷或既有套件模块解决部分任务，因此该品类真实存在，但边界有孔。对 Watershed
              来说，竞争集合比单点碳核算厂商更宽，而它能实际触达的总可用市场（TAM）又窄于所有被贴上可持续发展标签的美元。
