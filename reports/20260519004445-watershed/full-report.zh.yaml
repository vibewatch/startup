  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 披露需求仍真实，但政策反复会拖慢采购
        blocks:
          - type: paragraph
            body: >-
              Watershed 的增长故事，一部分押在企业需要在加州、欧盟和面向投资人的期限真正到来之前，准备好投资级气候数据。保留下来的来源显示，需求信号是真实的：CARB 正在推进 SB 253，Watershed
              自己也营销 SB 253 和 SB 261 支持，Trellis 还报道强制报告正在帮助成交。问题不在市场彻底消失，而在时间表是否稳定。SEC 气候规则先被通过，后因诉讼暂停执行，之后委员会又转向撤销；SB
              261 的执行也在上诉期间暂停；欧盟 Omnibus 方案缩窄了 CSRD 和 CSDDD 的适用范围，并把义务往后推。


              这种组合对 Watershed 很重要，因为买方不是只为技术优雅买单；只有监管机构、审计师、CFO
              或大客户把行动压到明确时间表上，采购才会发生。一旦时间表模糊，销售动作就会更偏咨询式，也更容易被采购拖延、「观望」预算，或被压缩成第一年只重测量、不重更广泛平台采用的部署。公司层面的关键点是，Watershed
              明确围绕这些框架销售，所以政策回撤最先表现为管线转化拉长、紧迫感下降，而不一定是长期气候软件价值的崩塌。
