  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 公司
      - 打包方式或套餐结构
      - 公开价格可见度
      - 公开信息显示包含的能力
      - 含义
    rows:
      - - Microsoft Sustainability Manager
        - Essentials 和 Premium
        - 明确公开标价
        - Essentials 起价为每租户每月 4,000 美元；Premium 为 12,000 美元，包含全部 15 个 Scope 3 类别、AI 和产品碳足迹管理
        - 最好的公开锚点，用来看套件型竞争者如何把碳管理包装成明码标价的软件模块
      - - IBM Envizi
        - 按范围测算的企业估价器
        - 有官方估价器，但最终报价定制
        - 定价随数据量扩大，合同期至少 12 个月
        - 指向企业级范围界定，也更偏向数据复杂买家，而非 SMB
      - - Salesforce Net Zero Cloud
        - 平台版本和附加模块
        - 有定价页面，但留存来源仍描述为报价驱动的企业级打包
        - Scope 3 枢纽、报告构建器、供应商互动、合作伙伴应用
        - 作为既有 Salesforce 体系内的加购最可能发挥优势
      - - Persefoni
        - Pro 和 Advanced 层级
        - 定制报价加试用版
        - 可审计的 Scope 1 至 3、融资排放、供应商互动，以及 AI 驱动的数据处理
        - 金融级产品，靠企业销售推进，而不是透明自助定价
      - - Plan A
        - Essential、Pro 和 Enterprise 层级
        - 按报价
        - 碳核算、脱碳规划和 ESG 合规支持
        - 打包结构清晰，但大客户仍由销售主导
      - - Sweep
        - 面向中端市场到企业的分层打包
        - 定制报价
        - 协作、数据收集工作流、Scope 3 自动化和 AI 辅助
        - 对部分中端市场团队比 Watershed 更容易进入，但仍不是公开标价的 SaaS
      - - Watershed
        - 高端企业平台，以演示驱动销售
        - 留存来源没有公开层级
        - 测量、报告、供应商互动、产品足迹、清洁电力和碳移除
        - 最适合大型复杂项目，但定价不透明会拖慢早期筛选
      - - Greenly
        - 有打包报价和套餐对比流程
        - 结构比企业级同行更可见，但此处未提取到留存的精确定价
        - GHG 合规、气候行动支持、供应商互动和支持层级
        - 留存样本中进入阻力最低
      - - SAP Sustainability
        - 企业许可加试用
        - 按报价
        - 集成控制塔、足迹管理和 ERP 关联工作流
        - SAP 已是运营核心时，捆绑效果最好
      - - Workiva ESG and Carbon 产品线
        - 定制化、演示驱动的企业打包
        - 留存官方页面没有公开标价
        - ESG 报告、审计历史、XBRL 和碳管理
        - 更靠披露控制栈竞争，而不是气候运营广度
    notes: 留存证据中，只有 Microsoft 和 IBM 直接披露官方定价结构。其他行结合官方打包线索和 TechTarget 评测覆盖，因此本表比较的是价格可见度和签约模式，而非实际合同金额。
