company:
  name: Watershed
chapter:
  number: 2
  title: Market Analysis
  summary: Watershed sells into a real but definitionally messy enterprise carbon accounting and sustainability reporting software market. Public 2025-2026 estimates put the broad category in the mid-teens to high-twenties billions of dollars, but the more decision-useful lens is a roughly $10B-$20B large-enterprise software segment where finance, sustainability, procurement, and IT increasingly co-own buying decisions under patchier regulation and persistent Scope 3 data friction.
sections:
- id: m-market-boundary
  title: Market boundary and practical substitutes
  body: |-
    Watershed’s practical market is best defined as enterprise climate and sustainability system-of-record software rather than the entire climate-tech, consulting, or decarbonization universe. The core included spend is software that ingests enterprise and supplier data, calculates Scope 1, 2, and 3 inventories, maps controls to disclosure frameworks, supports assurance, and helps teams steer reductions. That broader boundary is visible across the retained evidence: analyst pages describe carbon accounting or carbon management software, Workiva adds evidence-linked disclosure and assurance workflows, and SAP, Microsoft, Salesforce, and IBM all sell ESG data, reporting, and operational steering modules inside larger enterprise suites.

    The exclusion line matters just as much. This chapter does not count pure consulting labor, offsets, renewable-energy purchases, sensors, or the full contract value of ERP, CRM, or cloud platforms unless the spend is directed to climate or ESG modules. The buyer can still solve parts of the job with Excel, consultants, supplier questionnaires, or existing suite modules, so the category is real but porous. For Watershed, that means the competitive set is broader than point carbon-accounting vendors, while the usable TAM is narrower than every dollar ever labeled sustainability.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM045
  tableRefs:
  - TM001
- id: m-sizing-lens
  title: 'Sizing lens: large market, inconsistent labels'
  body: |-
    Published market data supports a meaningful software category, but it does not support one clean canonical TAM. The retained sources span carbon accounting software, carbon management systems, carbon management software, and sustainability management software, each with different treatment of services, verticals, and adjacent reporting workflows. TBRC places carbon accounting software at $27.78 billion in 2026, Mordor places carbon management software at $18.17 billion in 2026, and Global Market Insights puts carbon management systems at $15.9 billion in 2026. Grand View’s 2025 baseline is $14.13 billion, while Technavio’s sustainability-management frame is narrower and disclosure-oriented.

    The useful move is therefore to constrain rather than overstate. Grand View and Mordor both show large enterprises dominating spend, and North America remains the largest buyer base. Applying those published shares to the 2026 market band yields a rough large-enterprise software SAM of about $10 billion to $20 billion and a narrower North America large-enterprise lens of about $3.6 billion to $7.7 billion. That bottom layer is not a true Watershed SOM; public sources do not isolate what share goes to standalone platforms instead of suites, audit stacks, or services.
