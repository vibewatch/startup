  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Typical buyer / payer
  - Why it matters for Watershed
  rows:
  - - Core carbon accounting and inventory systems
    - Software for Scope 1/2/3 data collection, factor mapping, calculation, controls, and reporting
    - Consulting-only inventories, offsets, renewable procurement, sensors
    - Sustainability team with finance/controllership co-sponsor
    - This is the category Watershed most clearly serves.
  - - ESG reporting and disclosure orchestration
    - Evidence-linked reporting, framework mapping, assurance workflow, board-ready outputs
    - Generic filing software without climate workflows
    - Finance, ESG controller, sustainability lead
    - Expands the market beyond a calculator into disclosure infrastructure.
  - - Supplier engagement and value-chain data collection
    - Supplier questionnaires, procurement workflows, Scope 3 request management, standardized data exchange
    - Generic SRM spend with no climate module
    - Procurement with sustainability oversight
    - Critical where Watershed wins on Scope 3 complexity rather than simple inventorying.
  - - Decarbonization planning and transition steering
    - Scenario analysis, program tracking, target management, operating dashboards
    - Physical project capex and implementation labor
    - Sustainability, operations, finance
    - Important adjacent expansion area but not identical to reporting software spend.
  - - Suite-module substitutes
    - SAP, Microsoft, Salesforce, IBM, and Workiva ESG modules used for climate data and reporting
    - The full ERP/CRM/cloud contract value unrelated to ESG
    - CIO, CFO, sustainability shared budget
    - These vendors absorb budget that could otherwise go to a standalone platform.
  - - Services and manual status quo
    - No core software TAM counted; consultants, BPO, audit projects, and Excel are substitute motions
    - Pure service revenue from the software TAM lens
    - CFO, procurement, external advisers
    - Explains why software capture can lag the broader climate-reporting workload.
  notes: Core market boundary includes enterprise software that turns climate and ESG data into auditable reporting and operating workflows. Excluded spend still matters competitively because buyers can meet parts of the job with consultants, suites, or spreadsheets.
