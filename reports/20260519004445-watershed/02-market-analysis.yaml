- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - California disclosure deadlines
    - Driver
    - 2026-2027
    - SB 253 sets concrete coverage thresholds and 2026/2027 reporting cadence for very large companies
    - Supports top-end enterprise demand even as federal rules wobble
    - How much of Watershed pipeline comes from California-exposed entities?
  - - EU large-company reporting still persists
    - Mixed driver
    - 2025-2029
    - Omnibus narrowed scope but left the biggest multinationals in scope and kept limited assurance
    - Large-enterprise demand remains, but broad mid-market urgency falls
    - What percent of target accounts still remain in-scope after Omnibus?
  - - Audit-ready reporting and interoperability
    - Driver
    - Current
    - PwC, Workiva, and vendor pages emphasize controls, assurance, and reusable data foundations
    - Favors platforms that combine data lineage, reporting, and assurance workflow
    - What is Watershed’s attach rate for assurance or controller-led use cases?
  - - Scope 3 procurement and supplier data
    - Driver
    - Current
    - CDP and WEF show supplier data, procurement rules, and standardized disclosure are central
    - Favors platforms that win on supplier engagement rather than only footprint calculation
    - What supplier response rates and procurement workflows does Watershed automate?
  - - SEC rollback and litigation uncertainty
    - Constraint
    - Current
    - The SEC rule remains stayed and the Commission stopped defending it
    - US federal urgency is lower and some buyers may defer
    - How dependent is Watershed on SEC-specific selling motions?
  - - SB 261 injunction and uneven state enforcement
    - Constraint
    - Current
    - CARB paused enforcement of the Jan. 1, 2026 deadline while litigation proceeds
    - State demand remains real but timing risk widens sales cycles
    - How do customers treat SB 261 versus SB 253 in budget timing?
  - - Fragmented manual data environments
    - Constraint
    - Current
    - Workiva and ESG Today describe manual, disconnected data as a core challenge
    - Implementation effort stays high and services can dominate early projects
    - What share of deployments require heavy data-wrangling services?
  - - Supplier participation and free-rider dynamics
    - Constraint
    - Current
    - WEF highlights weak supplier incentives and shared-benefit problems in Scope 3 work
    - Software alone cannot solve supplier engagement without governance changes
    - How much of Watershed value proposition depends on customer procurement power?
  - - Overlapping suites, consultants, and spreadsheets
    - Constraint
    - Current
    - SAP, Microsoft, Salesforce, IBM, and Excel-adjacent workflows all cover parts of the job
    - Category overlap can compress pricing and complicate win-rate analysis
    - Where does Watershed consistently displace suites versus coexist with them?
  - - RFP and commercial pressure
    - Driver
    - Current
    - Deloitte reports 69% of TMT respondents often or always face GHG reporting in RFPs
    - Turns climate reporting into revenue-enabling infrastructure, not just compliance spend
    - Which verticals convert RFP pressure into fastest software buying cycles?
  notes: The strongest driver-constraint pair is regulation plus commercial pressure on one side, versus policy resets and implementation friction on the other. Timing matters as much as magnitude because many buyers now sequence data-foundation work before broader decarbonization programs.
