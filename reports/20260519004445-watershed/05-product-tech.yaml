- id: TE004
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Watershed solution
  - Measurable or cited benefit
  - Limitation / caveat
  rows:
  - - Corporate sustainability measurement
    - Bills, spreadsheets, and cross-functional data collection are slow and messy
    - Measure + agents ingest, clean, standardize, and calculate footprints
    - Watershed claims faster collection, 150+ checks, and 80% time-to-action improvements in test customers
    - Company-claimed productivity metrics are not independently benchmarked
  - - CSRD / ESG reporting owner
    - Data collection, narrative drafting, and assurance prep are fragmented
    - Disclosures + CSRD builder provide connectors, collaborative drafting, approvals, and XBRL export
    - One measurement can be reused across multiple frameworks and questions
    - Public evidence does not quantify median time saved for large filers
  - - California disclosure owner
    - Need regulator-ready climate-risk and emissions filings with evolving templates
    - California package drafts SB 261 reports with AI and supports SB 253 assurance
    - Watershed claims first drafts in days and guided assurance support
    - Regulatory changes could force frequent product updates
  - - Procurement lead
    - Spend-based averages hide real material and supplier choices
    - Product Footprints decomposes items, compares suppliers, and simulates changes
    - Official and news sources show item-level modeling and confidence documentation
    - Launch evidence is strong, but durable production usage proof is still sparse
  - - Supply-chain program owner
    - Supplier surveys rarely drive action at scale
    - Supply Chain uses dashboards, portals, scorecards, and supplier-specific data workflows
    - Klarna and EcoVadis evidence support measurable supplier prioritization and better primary data
    - Public docs do not disclose supplier response rates or recurring engagement metrics
  - - Decarbonization / clean-power lead
    - Measurement tools often stop before real commercial action
    - Act + Marketplace + VPPA structures connect targets to clean power and removal execution
    - Canva case shows a five-supplier, 20 MW VPPA structure with footprint impact
    - Economics, credit support, and project-selection performance remain private
  - - Finance / portfolio team
    - Financed-emissions data is fragmented across multiple sources and asset classes
    - Watershed Finance consolidates company, survey, PCAF, CDP, and CEDA data in one model
    - Supports LP / regulatory reporting and asset-class expansion
    - No public pricing or customer-penetration data for the finance SKU
  notes: This table mixes official product claims, customer case studies, and independent reviews to show where the platform appears strongest in real workflows and where evidence still rests on company statements.
