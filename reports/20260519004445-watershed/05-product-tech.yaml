- id: e-measurement-and-ai-architecture
  title: Measurement, data foundation, and AI architecture
  body: |-
    Public materials reveal more about workflow than about infrastructure internals, but the operating model is still fairly legible. Watershed's carbon-accounting docs describe the classic pipeline of taking business activity data, applying emissions factors, detecting anomalies, filling gaps, and producing audit-ready outputs. The differentiator is the climate-specific scaffolding wrapped around that pipeline. CEDA gives Watershed a proprietary-plus-open emissions database with global coverage, annual refreshes, and paid enrichments such as scope splits and price or currency adjustments. Product Footprints and Supply Chain push the model further, moving from spend-based averages toward item, material, supplier, and process detail.

    Watershed is also unusually explicit about its AI layer relative to many enterprise vendors. The company says agents can clean files, reconcile duplicates, generate analysis, draft reports, and produce drill-down reasoning, and it publicly names Anthropic, OpenAI, and Google Gemini as part of the model stack. Product Footprints adds an AI digital-twin framing for supply chains, while agents and PDF scanning attack the manual data-prep bottleneck. What stays private is the systems layer beneath those workflows: public pages do not expose tenancy design, region topology, uptime commitments, or a customer-usable public API reference.
