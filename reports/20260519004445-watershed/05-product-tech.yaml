callouts:
- calloutType: strength
  title: CEDA plus Product Footprints is the clearest technical wedge
  body: Watershed is strongest where it turns broad enterprise accounting into supplier-, item-, material-, and process-level decisions. Open / paid CEDA, Product Footprints, and Supply Chain together create a credible bridge from averages to procurement-grade Scope 3 action.
  claimRefs:
  - CE010
  - CE012
  - CE022
  - CE023
  - CE024
  - CE038
- calloutType: risk
  title: Public workflow detail is richer than public systems detail
  body: The retained sources make Watershed's product flow legible, but they do not provide the infrastructure, uptime, public API, or tenant-isolation detail a technical buyer would want before underwriting platform risk. Independent reviews also flag setup and integration effort.
  claimRefs:
  - CE015
  - CE041
  - CE043
  - CE044
- calloutType: recommendation
  title: Best fit looks like a large, compliance-heavy buyer with procurement leverage
  body: Watershed appears best suited to enterprises that need shared workflows across sustainability, finance, procurement, and assurance. The product is less visibly optimized for a light-touch, self-serve deployment than for a software-plus-expertise motion with high downstream decision value.
  claimRefs:
  - CE018
  - CE019
  - CE041
