  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Public evidence
  - Role in workflow
  - Key dependency
  - Risk / unknown
  rows:
  - - Source-data intake
    - APIs, direct uploads, utility-bill scans, surveys, external datasets
    - Brings fragmented ESG and procurement data into a common workflow
    - Customer business systems and file quality
    - Public docs do not describe connector execution model or API rate-limit handling
  - - Standardization + cleaning
    - AI cleaning, anomaly detection, file reformatting, project-management support
    - Normalizes messy operational data before calculation and reporting
    - Agents, rules, and human review
    - Gap-filling logic and exception handling are described only at a marketing level
  - - Carbon data engine
    - Proprietary engine assigns factors and builds corporate footprints
    - Turns normalized activity data into audit-ready emissions outputs
    - Methodology library plus CEDA
    - No public benchmark data on scale, latency, or reconciliation accuracy
  - - Emissions-factor foundation
    - Open CEDA plus paid CEDA enrichments and broader Watershed factor database
    - Provides globally representative Scope 3 and spend-based coverage
    - Climate-data science team and annual refresh cycle
    - Public docs do not explain customer-specific overrides or custom factor governance
  - - Reporting + analysis fabric
    - Data Explorer, disclosure builder, approvals, peer benchmarks, XBRL export, CDP API submission
    - Repurposes one measurement into many reports and analytic views
    - Framework mappings, connectors, and collaboration workflows
    - No public public API reference for custom report extraction
  - - Action + execution layer
    - Supply Chain, Product Footprints, target modeling, marketplace, finance workflows
    - Converts footprint data into procurement, portfolio, and decarbonization decisions
    - Partners, supplier data, carbon projects, and clean-power structures
    - Module-level adoption, margin profile, and time-to-value remain private
  notes: The architecture is inferred from product, guide, and launch pages rather than from a formal technical whitepaper. Public evidence is strong on workflow layers and weak on infrastructure topology.
