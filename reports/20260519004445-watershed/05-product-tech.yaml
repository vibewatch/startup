tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / SKU
  - Primary buyer / user
  - What it does
  - Public maturity signal
  - Differentiation cue
  - Diligence gap
  rows:
  - - Measure
    - Sustainability team; finance; operations
    - Ingests data, calculates footprints, standardizes metrics, and feeds analysis/reporting
    - Core platform page and carbon-accounting docs are detailed and current
    - Single data model reused across footprints, disclosures, and action modules
    - No public API schema or connector architecture docs
  - - Disclosures
    - Disclosure owner; finance; sustainability
    - Drafts, updates, and submits ESG / climate reports across frameworks
    - Dedicated disclosures page with CDP API submission and reusable report workflows
    - Same data reused across multiple frameworks with peer benchmarks
    - No public demo of full framework coverage or validation rules
  - - CSRD solution
    - EU reporting teams; assurance leads
    - Collects ESRS data, supports authoring, workflows, and XBRL-ready export
    - Named connectors, approval flows, and XBRL export are publicly described
    - Combines measurement, authoring, and assurance support in one flow
    - Public proof of large-scale production usage remains case-study level
  - - California solution
    - US disclosure teams; legal / risk
    - Builds SB 253 and SB 261 disclosures with AI drafting and assurance support
    - Public page includes validation, citations, and Guaranteed Assurance offer
    - Ties regulator templates to company data and expert guidance
    - Litigation and rule changes still create moving-product targets
  - - Supply Chain
    - Procurement; supplier programs; sustainability
    - Measures supplier emissions, surfaces targets/actions, and runs engagement workflows
    - Dedicated page with dashboards, portals, scorecards, and supplier-intelligence claims
    - Moves beyond surveys toward action-linked supplier workflows
    - Public docs do not quantify portal adoption or response rates
  - - Product Footprints
    - Procurement; product teams; sustainability
    - Builds product-level footprints, compares suppliers/materials, and simulates decarb levers
    - Official page plus 2025 launch coverage describe item-level AI workflows
    - Procurement-grade Scope 3.1 modeling instead of spend-only averages
    - Public evidence on production usage is still early and launch-heavy
  - - Act + Marketplace
    - Decarbonization lead; sustainability; procurement
    - Models targets and funds clean power, carbon removal, SAFc, and VPPAs
    - Public pages plus Canva case show action surfaces beyond reporting
    - Connects reduction planning to actual clean-power and removal execution
    - Economics, portfolio returns, and supplier-side contract terms stay private
  - - Finance
    - Asset managers; banks; sustainability finance teams
    - Aggregates financed-emissions data across asset classes with PCAF and external datasets
    - Dedicated finance product page lists data sources and asset-class coverage
    - Shows CFO / portfolio workflow design, not just corporate footprinting
    - Public docs do not disclose valuation, pricing, or customer penetration by asset class
  - - CEDA / Open CEDA
    - Climate data team; model owners; advanced customers
    - Provides the emissions-factor backbone for spend-based and enriched footprinting
    - Open and paid variants are documented publicly and updated annually
    - Open-data wedge is unusual in a category that often treats factors as a black box
    - How much customer-specific factor tuning happens in production is unclear
  - - Sustainability AI
    - Sustainability analysts; reporting owners; procurement teams
    - Cleans files, analyzes drivers, drafts reports, and supports scenario exploration
    - Product page and 2026 blog document live agents and workflow examples
    - Public disclosure of model vendors and review controls is unusually explicit
    - No public evaluation dashboards or model-routing documentation
  notes: Maturity reflects public product evidence, not private telemetry. Rows separate clearly documented surfaces from the infrastructure and adoption details that remain non-public.
