- id: TE003
  title: Trust / quality / compliance table
  columns:
  - Control / capability
  - Public status
  - Scope / evidence
  - Operational implication
  - Remaining gap
  rows:
  - - Audit trails and lineage
    - Publicly claimed
    - Measure and carbon-accounting pages promise full traceability and audit trails
    - Supports enterprise assurance posture and defensible calculations
    - Public materials do not show sample audit logs or lineage object model
  - - Automated data-quality checks
    - Publicly claimed
    - Measure page cites 150+ automated error checks and anomaly detection
    - Reduces manual review load before reporting or scenario work
    - Threshold logic and false-positive handling are not public
  - - Human review and workflow controls
    - Publicly claimed
    - AI page and CSRD page describe human review, approval workflows, comments, notes, and permissioning
    - Important control layer for regulated disclosures and AI output acceptance
    - No public role matrix, admin model, or segregation-of-duties documentation
  - - Assurance support
    - Publicly claimed
    - Carbon-accounting page cites audited-pass history; California page offers Guaranteed Assurance
    - Makes audit-readiness a product promise rather than only a services promise
    - No public evidence on assurance costs, exclusions, or failure rates by module
  - - Security disclosures
    - Limited public detail
    - Security page provides responsible-disclosure process and points buyers to the trust center
    - Shows a buyer path for NDA materials and vulnerability reporting
    - Trust-center details, certifications, and technical controls are not publicly readable from the retained source set
  - - Reliability / operational transparency
    - Sparse public detail
    - No retained public status page, SLA page, or incident-history documentation was found during source review
    - Investors and enterprise buyers cannot independently judge reliability maturity from public docs alone
    - Requires private diligence on uptime, DR, region strategy, and incident response
  notes: Watershed is much more explicit about auditability and workflow controls than about public-facing reliability or security documentation. This is a meaningful diligence asymmetry, not proof of weak controls.
