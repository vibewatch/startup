- id: e-scope3-procurement-and-action
  title: Procurement-grade Scope 3 and action engine
  body: |-
    Watershed's most differentiated public technical story is the bridge from measurement into procurement and decarbonization. Supply Chain is positioned as more than a survey workflow: it combines supplier disclosures, scorecards, portals, and climate education with Product Footprints, which decomposes purchased goods into materials and processes, compares suppliers and plants, and lets teams simulate how changes flow through the footprint before contracts are signed. External launch coverage adds useful detail by describing confidence scores, source documentation, and early enterprise pilots, which is stronger proof than marketing copy alone.

    The action layer is also unusually concrete for this category. Marketplace materials show a formal vetting rubric for carbon-removal projects and a menu that includes VPPAs, clean power, and SAF certificates, while the Canva case demonstrates Watershed using this machinery to structure a fixed-price VPPA across five print suppliers. EcoVadis adds another signal by connecting supplier primary data and PCF calculation directly into Watershed's carbon-accounting engine. Together, these sources make Watershed look less like a reporting-only vendor and more like a software-plus-execution platform for sustainability teams working with procurement, finance, and suppliers. The remaining uncertainty is adoption depth: launch and case-study evidence is real, but public module-level usage data is still thin.
