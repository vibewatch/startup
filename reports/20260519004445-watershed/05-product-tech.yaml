- id: e-reporting-controls-deployment
  title: Reporting, controls, and enterprise deployment
  body: |-
    Watershed's reporting surface is built for teams that need sustainability data to survive assurance, not just populate dashboards. The disclosures product emphasizes API and direct uploads, utility-bill scans, CDP API submission, expert guidance, and reports that can be updated across frameworks with one click. The CSRD package is more explicit still: DMA upload, named connectors, comments, notes, approval workflows, permissioning, and Word export with XBRL tagging point to a collaborative authoring system rather than a simple export layer. California disclosure pages extend that model with AI-generated first drafts, citations, and a Guaranteed Assurance offer.

    The deployment implication is that Watershed does not look like a pure self-serve SaaS tool. Ashby roles for customer data services, sustainability advisors, forward-deployed engineers, and support specialists suggest meaningful implementation and managed-service layers alongside the software. Deloitte's alliance page reinforces that impression by describing ERP and planning integrations, robust controls, and assurance-ready workflows. This hybrid model is a strength for complex global buyers, but it also implies heavier onboarding, more cross-functional change management, and more dependence on services capacity than a lightweight SMB-oriented tool would require.
  claimRefs:
