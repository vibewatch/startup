  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-api-and-topology
    missingEvidence: Detailed public API reference, connector execution model, region topology, disaster-recovery design, and tenancy documentation.
    whyItMatters: The public case for workflow value is strong, but investors and security buyers still cannot independently judge scaling limits, failure domains, or integration operability from retained sources alone.
    diligencePath: Request architecture review materials, API docs, region maps, DR runbooks, and sample customer integration packets from product and security engineering.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE002
    - TE003
  - type: private-evidence-only
    severity: material
    topic: ai-governance-internals
    missingEvidence: Model-routing rules, prompt and output retention policy, evaluation metrics, hallucination-test methodology, and customer-data isolation details for the AI layer.
    whyItMatters: Watershed is unusually explicit about AI use, but the remaining undisclosed controls still determine whether the agents can be trusted in regulated enterprise workflows at scale.
    diligencePath: Request AI governance docs, model cards, privacy retention settings, evaluation dashboards, and examples of red-team or hallucination testing.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: implementation-effort-and-adoption
    missingEvidence: Median implementation duration, services hours, module attach rates, renewal evidence, and adoption depth for newer surfaces such as Product Footprints and AI agents.
    whyItMatters: Public launches and case studies show direction, but they do not yet prove how repeatable the product is across the broader base or how expensive deployment is in practice.
    diligencePath: Collect implementation scorecards, SOW templates, customer references focused on time-to-value, and telemetry on module penetration and usage frequency.
    relatedQuestionRefs:
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: minor
    topic: public-reliability-surface
    missingEvidence: A retained public status page, uptime commitments, incident-history archive, or public SLO documentation.
    whyItMatters: Without a public operational surface, outside buyers have little independent evidence of service maturity beyond product claims and partner marketing.
    diligencePath: Ask for historical uptime reports, incident postmortems, customer contractual SLAs, and status-page access or screenshots under NDA.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE003
