chapter:
  number: 5
  title: Product & Technology
  summary: |-
    Watershed's public product evidence supports a software-plus-services sustainability platform that starts with audit-ready measurement and disclosures, then pushes into supplier engagement, product-level procurement analysis, clean-power and carbon-removal execution, and AI-assisted data work. The strongest technical wedge is the combination of CEDA/open emissions data, line-level traceability, and procurement-grade Product Footprints. The biggest public gaps are infrastructure, SLA, and public-API detail, plus limited independent evidence on deployment effort and module-level adoption.
sections:
- id: e-unified-platform-map
  title: Unified platform map
  body: |-
    Watershed's strongest public product signal is that it is not sold as a narrow carbon calculator. The product is packaged as a measure-report-act platform with sustainability AI spread across the workflow, so the same data foundation can feed footprints, disclosures, reduction planning, and procurement decisions. The Measure layer ingests APIs, direct uploads, utility-bill scans, and messy spreadsheets, then standardizes them into a reusable climate dataset. Watershed repeatedly emphasizes audit-ready operation: 500,000 built-in emissions factors, 150+ automated error checks, cited AI outputs, and full lineage so numbers can be traced back to source inputs.

    That packaging matters because it positions Watershed as climate data infrastructure rather than an annual reporting tool. Public product surfaces now extend well beyond measurement into finance-specific workflows, CSRD and California reporting, supplier engagement, product-level procurement analysis, clean-power and carbon-removal execution, and AI-assisted data work. The platform looks designed for large enterprises where sustainability, finance, procurement, and assurance teams need a common system of record, not a collection of disconnected calculators.
