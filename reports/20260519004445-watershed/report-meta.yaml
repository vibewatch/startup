companyProfile:
  summary: >-
    Watershed is a San Francisco-based private enterprise sustainability software
    company founded in 2019 by former Stripe colleagues Taylor Francis, Avi
    Itskovich, and Christian Anderson. Public evidence shows Taylor Francis as the
    current CEO, a measure-report-act platform spanning disclosures, supplier
    engagement, product footprints, financed-emissions workflows, and
    marketplace/action modules, plus premium enterprise penetration across Fortune
    500, banking, and private-equity cohorts. The public record also confirms a
    $70M Series B at a $1B valuation and a $100M Series C at a $1.8B valuation,
    while leaving ARR, margins, retention, and exact current customer count
    undisclosed.
