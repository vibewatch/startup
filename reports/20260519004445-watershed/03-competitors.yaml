- id: p-packaging-win-loss
  title: Packaging, pricing transparency, and probable win-loss dynamics
  body: |-
    Public pricing is the exception, not the rule. Microsoft is the most transparent retained vendor, publishing Essentials at 4,000 dollars per tenant per month and Premium at 12,000 dollars, while IBM provides an official estimator and says price scales with data volume on minimum 12-month terms. TechTarget describes Persefoni, Plan A, Sweep, Watershed, SAP, and Salesforce as quote-led enterprise software with tiering or custom packaging. Greenly is the clearest packaged lower-end offer in the retained set, with compare-plans language and review coverage that positions it as the easier SMB entry point.

    That packaging shape creates predictable competitive dynamics. Watershed is more likely to win when a large buyer accepts a sales-led process in return for stronger supplier workflows, product-footprint depth, and a climate-specific system of record. It is less advantaged when the buying team wants immediate budget clarity, already runs on Microsoft or SAP, or treats sustainability as an extension of an existing CRM or reporting program. Multi-homing also looks plausible: a company can keep Workiva for disclosure, use SAP or Microsoft for core data and controls, and still adopt a specialist such as Watershed or Persefoni for climate-specific workflows. That weakens winner-take-all assumptions and makes realized win-loss data especially important.
