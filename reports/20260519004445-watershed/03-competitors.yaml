  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: win-rates
    missingEvidence: Segmented competitive win-loss data showing how Watershed performs versus Persefoni, Sweep, SAP, Microsoft, IBM, Salesforce, and Workiva in actual RFPs.
    whyItMatters: Without realized win-rate evidence, the chapter can explain where Watershed should win but cannot confirm whether product breadth truly converts into displacement or standard-of-record status.
    diligencePath: Request the last 12 months of RFP outcomes segmented by buyer archetype, named competitor in final round, module mix, and reason won or lost.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: material
    topic: implementation-intensity
    missingEvidence: Comparable implementation duration, services effort, and internal staffing requirements across Watershed and top direct and suite rivals.
    whyItMatters: Deployment burden shapes total cost of ownership, time-to-value, and whether a buyer can justify a specialist platform over an incumbent bundle.
    diligencePath: Request implementation plans, services statements of work, and time-to-first-report metrics from at least three customers or implementation partners per platform.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized contract values, discounting patterns, module attach, and multi-year terms for Watershed and key rivals.
    whyItMatters: Public packaging cues do not reveal whether Watershed is materially more expensive than incumbent-suite alternatives or how sharply price pressure hits competitive deals.
    diligencePath: Request anonymized pricing schedules, discount policies, and postmortems for deals lost on pricing versus Microsoft, SAP, IBM, and direct specialists.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: multi-homing
    missingEvidence: Named examples showing whether customers run Watershed alongside Workiva, SAP, Microsoft, or IBM rather than replacing them.
    whyItMatters: Coexistence versus displacement changes switching-cost assumptions and determines whether Watershed can become the true system of record.
    diligencePath: Ask for reference architectures, integration case studies, and customer references that explain whether Watershed replaced or complemented incumbent tools.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP004
