- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Packaging or plan structure
  - Public price visibility
  - Included capabilities signaled publicly
  - Implication
  rows:
  - - Microsoft Sustainability Manager
    - Essentials and Premium
    - Explicit public list price
    - Essentials starts at 4,000 dollars per tenant per month; Premium at 12,000 with all 15 Scope 3 categories, AI, and product carbon footprint management
    - Best public anchor for how a suite competitor can frame carbon as a priced software module
  - - IBM Envizi
    - Scoped enterprise estimator
    - Official estimator but custom final quote
    - Pricing scales with data volume and uses a minimum 12-month term
    - Signals enterprise scoping and favors complex-data buyers over SMBs
  - - Salesforce Net Zero Cloud
    - Platform editions and add-ons
    - Pricing section exists but retained sources still describe quote-led enterprise packaging
    - Scope 3 hub, report builders, supplier engagement, partner apps
    - Likely strongest as an upsell inside existing Salesforce estates
  - - Persefoni
    - Pro and Advanced tiers
    - Custom quote plus trial version
    - Audit-ready Scopes 1 to 3, financed emissions, supplier engagement, and AI-led data work
    - Finance-grade product with enterprise sales motion rather than transparent self-serve pricing
  - - Plan A
    - Essential, Pro, and Enterprise tiers
    - Quote-based
    - Carbon accounting, decarbonization planning, and ESG compliance support
    - Structured packaging but still sales-led for larger buyers
  - - Sweep
    - Tiered mid-market to enterprise packaging
    - Custom quote
    - Collaboration, data collection workflows, Scope 3 automation, and AI assistance
    - More accessible than Watershed for some mid-market teams, but still not public-list SaaS
  - - Watershed
    - Premium enterprise platform with demo-led motion
    - No public tiers in retained sources
    - Measurement, reporting, supplier engagement, product footprints, clean power, and carbon removal
    - Strongest fit for large complex programs, but pricing opacity can slow early qualification
  - - Greenly
    - Packaged offers with compare-plans workflow
    - More visible structure than enterprise peers, but exact retained pricing was not extracted here
    - GHG compliance, climate action support, supplier engagement, and support tiers
    - Lowest-friction entry point in the retained set
  - - SAP Sustainability
    - Enterprise licensing plus trial
    - Quote-based
    - Integrated control tower, footprint management, and ERP-linked workflows
    - Bundles best when SAP is already the operational core
  - - Workiva ESG and Carbon
    - Custom demo-led enterprise packaging
    - No public list price in retained official page
    - ESG reporting, audit history, XBRL, and carbon management
    - Competes more on disclosure control stack than on climate-operations breadth
  notes: Only Microsoft and IBM expose direct official pricing structure in the retained evidence. Other rows combine official packaging cues with TechTarget review coverage, so this table compares price visibility and contracting model rather than realized contract values.
