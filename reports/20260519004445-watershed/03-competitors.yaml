- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Watershed moat or exposure
  - Competitive threat
  - Severity
  - Mitigation or diligence ask
  rows:
  - - Climate-first workflow breadth
    - Suite vendors keep adding carbon features and can bundle them into larger software contracts
    - High
    - Request win-loss data segmented by SAP, Microsoft, Salesforce, IBM, Workiva, and direct specialists
  - - Supplier engagement depth
    - Sweep, IBM Envizi, Salesforce Net Zero, and other vendors also market supplier and Scope 3 workflows
    - High
    - Measure supplier response rates, renewal impact, and supplier-data conversion versus named alternatives
  - - Product-footprint and procurement depth
    - SAP, Microsoft, SINAI, and industrial tools also market product or procurement carbon workflows
    - High
    - Request proof of product-footprint usage in production accounts and attach rates to core reporting deals
  - - Audit trail and assurance support
    - Persefoni, IBM Envizi, and Workiva all sell audit-ready or finance-grade disclosure posture
    - Medium high
    - Ask for auditor reference calls, assurance conversion, and controls outcomes by customer segment
  - - AI-led workflow automation
    - AI report authoring, factor matching, and workflow assistance now appear across multiple competitors
    - High
    - Test whether Watershed AI measurably reduces time-to-first-report or improves data quality relative to peers
  - - Pricing transparency
    - Microsoft offers public pricing while Watershed remains quote-led and enterprise-oriented
    - Medium
    - Request pricing bands, discounting discipline, and loss reasons where price transparency blocked a deal
  - - Substitute workflows
    - Buyers can still stay on spreadsheets, consultants, or internal build for lower-complexity programs
    - Medium
    - Ask how often Watershed lands as system of record after advisory-first or spreadsheet-based processes
  notes: Severity is a qualitative judgment based on retained public evidence. The table emphasizes risks that could compress differentiation or slow standardization on Watershed as the system of record.
