- id: u-durability-risks
  title: Durability signals, review surface, and customer risk
  body: |-
    Durability is where the public record gets noticeably thinner. There are some useful recurring-workflow signals: Kainos needed more frequent emissions reviews after travel rebounded, CDP completed an initial report quickly across multiple offices, and customer-owned pages from Figma and Smiths confirm that Watershed is being used for real work outside Watershed’s own website. FeaturedCustomers also shows a visible reference surface with reviews, case studies, and videos. Those are meaningful positives, but they stop short of proving software retention in the way an investor would usually want: no retained public source discloses NRR, GRR, churn, contract length, or renewal rate.

    The clearest adverse signal comes from the independent review surface rather than from lost-customer commentary. Toolradar flags opaque pricing, learning-curve risk, and integration effort, which fits the broader pattern seen in case studies that repeatedly emphasize onboarding, audit readiness, and cross-functional data work. That does not mean customer quality is weak; in fact the named customer set looks unusually strong. It does mean the remaining diligence burden is concentrated in three areas: true active-customer count, concentration by revenue or sector, and whether the high-touch deployment model translates into durable renewals rather than one-off implementation wins.
