- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Evidence
  - Potential impact
  - Current public read
  - Diligence path
  rows:
  - - Reporting-to-procurement expansion
    - Coupa, Burton, DP World, Royal Mail, ESG News Product Footprints coverage
    - Can raise ACV and stickiness if the same data drives supplier and sourcing decisions
    - Credible from case studies and news coverage
    - Ask attach rate for procurement and supplier modules
  - - Portfolio / finance expansion
    - Ares, Carlyle, Smiths, DP World
    - Adds a finance buyer and larger budget pool
    - Credible but concentrated in large enterprises
    - Ask ACV split by finance-led customers
  - - Revenue-defense motion
    - Flexera, Coupa, Insight Global, Medallia
    - Can make the product part of sales enablement and customer diligence workflows
    - Strong anecdotal proof only
    - Ask win-rate lift and renewal lift attributable to climate data
  - - Marketplace / action expansion
    - Figma, Albany, Braze, Skyscanner
    - Adds clean-power, removals, or cohort-buying spend beyond reporting software
    - Strong case-level proof
    - Ask repeat spend and take-rate economics
  - - Large-enterprise / regulatory concentration
    - Smiths, Delivery Hero, World Market, Harris Farm, Royal Mail
    - Regulatory pullback or delayed mandates could slow demand in part of the base
    - Material risk
    - Ask pipeline and ARR share tied to CSRD, California, and ASRS demand
  - - Customer-count ambiguity
    - Homepage cohort stats versus Trellis hundreds versus public case-study counts
    - Makes market-penetration and proof-density analysis harder
    - Material ambiguity
    - Ask active customer count, paid logos, and logos by module
  - - Implementation burden
    - Toolradar plus case studies emphasize integration, audit workflows, and cross-functional change
    - Longer sales cycles and higher services load can slow adoption
    - Material risk
    - Ask time-to-value, implementation staffing, and services gross margin
  - - Retention blind spot
    - No public NRR, churn, contract length, or concentration data retained
    - Hard to underwrite durability even if buyer quality is strong
    - Major diligence gap
    - Request cohort retention bridge and top-account renewal history
  notes: This table separates credible expansion vectors from unresolved concentration and retention questions. The public record supports the motion; it does not yet prove durability economics.
