  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer-level NRR, GRR, renewal rate, average contract length, churn reasons, and a cohort retention bridge by module or customer vintage.
    whyItMatters: Watershed’s public record shows strong logo quality and real workflows, but without durability metrics it is impossible to tell whether implementations renew, expand, or quietly stall after the initial reporting cycle.
    diligencePath: Request a retention bridge, sample MSA terms, and renewal history for the top ten accounts or for recent enterprise cohorts.
    relatedQuestionRefs:
    - QU019
    - QU020
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Active customer count, paying-logo count, top-customer concentration, and sector mix by revenue or ACV.
    whyItMatters: Marquee logos do not reveal how dependent Watershed is on a handful of large regulated accounts or on one budget-sensitive vertical.
    diligencePath: Ask management for current active-customer count, top-ten customer concentration, revenue by vertical, and ARR split between reporting-only and expanded customers.
    relatedQuestionRefs:
    - QU021
    - QU025
  - type: missing-source
    severity: minor
    topic: customer-owned-proof
    missingEvidence: More direct customer-owned references, procurement records, or investor materials that name Watershed outside Watershed’s own case-study library.
    whyItMatters: The retained set shows that Watershed can secure flagship customer-owned confirmation, but the ratio of customer-owned proof to self-published proof is still low enough to create selection-bias risk.
    diligencePath: Request three current customer references from different verticals, one customer-owned disclosure or procurement document per major segment, and one lost-deal reference.
    relatedQuestionRefs:
    - QU017
    - QU026
    relatedTableRefs:
    - TU003
