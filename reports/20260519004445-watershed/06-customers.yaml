figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public customer stories suggest Watershed often enters through reporting, audit, or stakeholder pressure, then expands into procurement, supplier, finance, or action workflows as more teams reuse the climate dataset.
  approximationNotes: Journey stages are synthesized from retained customer case studies and reflect a typical enterprise buying path rather than a single observed universal sequence.
  data:
    nodes:
    - id: pressure
      label: Pressure and trigger
      detail: Regulatory deadlines, audit risk, customer questionnaires, investor scrutiny, or RFQs create urgency to replace spreadsheets and consultants.
    - id: baseline
      label: Baseline and integration
      detail: Sustainability teams consolidate utility, travel, spend, supplier, and operational data into a first credible footprint.
    - id: reporting
      label: Reporting and executive buy-in
      detail: Teams use the data for CDP, CSRD, California, ASRS, or internal target setting and win leadership support through faster, more auditable reporting.
    - id: operational
      label: Operational expansion
      detail: Procurement, sales, sourcing, or portfolio teams begin using the same data for supplier engagement, RFP responses, and investment decisions.
    - id: action
      label: Action and spend
      detail: Some accounts extend from measurement into clean power, carbon removals, portfolio engagement, or product-footprint scenario analysis.
    - id: renewal
      label: Renewal or re-underwrite
      detail: Ongoing reuse is implied by recurring reporting or monthly reviews, but public NRR and contract-renewal metrics remain absent.
