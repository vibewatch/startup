- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Evidence today
  - Exact diligence path
  rows:
  - - ARR and recognized revenue
    - No way to place Watershed on a credible growth or multiple curve
    - Only qualitative best-month comment and customer-count proxies
    - Request monthly ARR, revenue, bookings, and forecast by product and region
  - - Gross margin split
    - Cannot separate software economics from service drag
    - Public comps provide only external bounds
    - Request software gross margin, services margin, hosting spend, and support costs
  - - Cash, burn, and runway
    - Cannot judge financing dependency or next-round timing
    - Funding history exists but balance-sheet liquidity is absent
    - Request monthly cash bridge, debt schedule, and runway scenarios
  - - Retention and expansion
    - Logo count says little about revenue quality without renewals and upsell
    - No public NRR, GRR, churn, or module-expansion data found
    - Request cohort tables for gross retention, NRR, churn, and expansion by segment
  - - Realized pricing and discounting
    - Public list-price comparisons cannot be translated into ACV or margin
    - Watershed public price card not found; adjacent vendors mix list and custom pricing
    - Request price book, realized discount bands, and ACV by module and customer size
  - - Customer concentration
    - Large logos can hide dependence on a handful of accounts or sectors
    - Case studies show enterprise quality but not revenue concentration
    - Request top-10 customer revenue share and sector exposure
  - - Implementation duration and services load
    - Without onboarding effort, CAC payback and margin are incomplete
    - Hiring suggests meaningful enablement and advisory labor
    - Request average time-to-live, PS hours per deployment, and support staffing ratios
  notes: These are the specific public-data holes that still block full underwriting even after source and comp work are complete.
