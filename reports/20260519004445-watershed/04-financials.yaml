- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Watershed public value/status
  - Public comp anchor
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue / ARR
    - Undisclosed; only a qualitative best-month signal is public
    - Workiva disclosed $738.7M revenue in 2024
    - Top-line scale is prerequisite for any valuation or payback analysis
    - Request monthly ARR, recognized revenue, and forecast bridge by product line
  - - Revenue mix
    - Undisclosed
    - Workiva says ~90% of revenue is subscription and support
    - Mix determines gross margin durability and services drag
    - Request software vs services split and module contribution
  - - Gross margin
    - Undisclosed
    - Workiva ~76.7% gross margin; IBM 58.2%; SAP services 25.1%
    - Margin range determines whether Watershed behaves like software or service-heavy enterprise delivery
    - Request software gross margin, services contribution margin, and hosting cost detail
  - - Forward visibility
    - Undisclosed
    - Workiva reported ~$1.2B RPO with ~$627.1M inside 12 months
    - Backlog or RPO helps judge contracted visibility and renewal risk
    - Request ARR bridge, backlog or RPO equivalent, and renewal schedule
  - - Sales efficiency / CAC payback
    - Undisclosed
    - No clean public comp anchor retained
    - Enterprise hiring suggests meaningful acquisition cost but the magnitude is unknowable
    - Request CAC, sales-cycle length, win rate, and payback by segment
  - - Implementation / service intensity
    - Likely meaningful given product-specialist, advisory, and data roles
    - SAP services margin at 25.1% shows service work can be structurally lower-margin
    - High services content can depress blended margins and stretch onboarding
    - Request PS attach rate, average implementation hours, and time-to-live
  - - Retention / expansion
    - Undisclosed
    - No Watershed public NRR or GRR found
    - Expansion economics matter more than logo count in enterprise SaaS
    - Request gross retention, NRR, seat or module expansion, and churn by cohort
  - - Public multiple context
    - Only illustrative via public-company analogs
    - Workiva ~3.8x, IBM ~3.1x, SAP ~5.6x, Microsoft ~11.2x market cap / revenue
    - Provides a rough external bracket while highlighting how noisy the peer set is
    - Use only after Watershed revenue is known and adjust for mix, growth, and scale
  notes: Watershed values are left null or qualitative where the public record does not disclose them. Comp anchors are company-level, not segment-pure, and should not be treated as direct peer multiples.
