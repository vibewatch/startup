- id: i-capital-adequacy
  title: Capital adequacy and financing dependency
  body: |-
    Watershed's strongest hard financial evidence is still financing history, not operating results. The company's own Series B post discloses a $70 million round at a $1 billion valuation, and the official Series C post plus Reuters agree on a $100 million round at a $1.8 billion valuation in February 2024. That means the exact disclosed equity capital visible in the retained source set is at least $170 million across those two rounds alone. Combined with an approximately 380 to 400 person workforce and a multi-office footprint, that capital base is large enough to support a serious enterprise-software buildout.

    What public evidence cannot answer is whether that capital is still abundant relative to current burn. No reviewed source discloses cash on hand, monthly burn, runway, debt, or covenant structure. There is also no visible evidence of project finance, hardware inventory, or manufacturing capex obligations, so the observable capital intensity appears mostly people, software, and go-to-market led rather than asset led. Even so, without a cash bridge, a board deck, or management commentary on burn, public evidence can only say Watershed has raised meaningful money before and still appears operationally active, not whether it is close to or far from its next financing trigger.
  claimRefs:
  - CI005
  - CI006
