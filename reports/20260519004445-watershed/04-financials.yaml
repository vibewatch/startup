  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-traction
    missingEvidence: Monthly ARR, recognized revenue, and bookings by product line and geography.
    whyItMatters: Without a top-line bridge, no public-market multiple or funding history can be converted into a credible underwriting case.
    diligencePath: Request CFO revenue pack with monthly ARR, GAAP revenue, bookings, and forecast versus plan for the last 24 months.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, and runway under base and downside hiring scenarios.
    whyItMatters: Capital adequacy cannot be judged from historic fundraising alone when the current liquidity position is unknown.
    diligencePath: Request month-end cash ledger, 13-week cash flow, board runway analysis, and debt or lease schedules.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Gross retention, net revenue retention, churn, and expansion by cohort, segment, and module.
    whyItMatters: Enterprise customer count is much less informative than renewal quality when assessing durable revenue.
    diligencePath: Request cohort tables showing logo retention, gross revenue retention, NRR, and expansion by year of landing.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Software gross margin, services contribution margin, hosting cost, and support cost detail.
    whyItMatters: Watershed could screen as attractive software or service-heavy enterprise delivery, and public evidence cannot distinguish between them.
    diligencePath: Request management P&L split between subscription, services, support, and cloud infrastructure costs.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Realized contract values, discount bands, and ACV by module and customer segment.
    whyItMatters: Public packaging cues do not reveal monetization discipline, expansion potential, or price pressure versus incumbents.
    diligencePath: Request current price book, realized discount histogram, and ACV distribution for new and renewal contracts.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI002
    - TI005
