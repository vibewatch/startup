- id: i-gtm-cost-proxies
  title: GTM motion and cost proxies from hiring and customer proof
  body: |-
    Because Watershed does not publish CAC, payback, or implementation duration, the best public proxies come from people footprint and customer evidence. Watershed's about page and Business Insider both place the company around 380 to 400 employees, while the careers page describes a dual San Francisco-London headquarters model. Built In job listings add operating detail: roles were posted across London, Mexico City, San Francisco, New York, Berlin, and Denver, and the titles cut across enterprise account executives, SDR leadership, solutions consulting, sustainability product specialists, strategic customer success, advisory, data, and payroll. That is the org chart of a sales-led enterprise platform, not a low-touch self-serve SaaS motion.

    Customer proof points line up with that interpretation. Official case studies span Carlyle, Klarna, New Relic, TaskUs, and JPMorgan Chase, which suggests Watershed is selling into large, often cross-functional programs where procurement, finance, sustainability, and operations all matter. The TaskUs story is especially financially relevant because it frames climate work as a requirement from customers and vendors rather than a purely voluntary initiative. Together, those clues imply that Watershed's growth likely depends on expensive enterprise selling and onboarding, but the public record still cannot translate that into CAC or payback.
