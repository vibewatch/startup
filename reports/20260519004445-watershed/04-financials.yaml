- id: i-margin-benchmarks
  title: Margin and unit-economics benchmarks from public comparables
  body: |-
    Watershed does not disclose gross margin, software-versus-services mix, remaining performance obligations, or retention. The closest public benchmark in the retained set is Workiva, which sits near the disclosure-and-controls end of the market. Workiva's 10-K says 2024 revenue was $738.7 million, about 90% came from subscription and support, gross profit was $566.6 million, and remaining performance obligations were roughly $1.2 billion. That is a useful reference point for what a mature enterprise reporting platform can look like when the software layer is dominant. IBM and SAP show the other side of the range: IBM reported a 58.2% gross profit margin on a much broader software-consulting mix, while SAP reported 25.1% services gross margin even as cloud and software reached 88% of total revenue.

    Those public-company disclosures do not make Watershed comparable on a like-for-like basis, but they do bound the plausible economics. If Watershed is mostly recurring software, margins could be much closer to disclosure-software norms. If onboarding, data transformation, and advisory work remain a large share of delivery, contribution margins could compress toward the lower end of enterprise-software reality. Public hiring for product specialists, advisors, analysts, and strategic customer success makes that services component hard to ignore.
