  topStrengths:
    - >-
      Measure-report-act platform breadth now spans disclosures, supplier engagement, product footprints,
      financed-emissions workflows, and action/marketplace modules rather than a narrow carbon calculator.
    - >-
      Public customer proof and cohort claims indicate premium enterprise traction, including 90+ Fortune 500 companies
      plus strong banking and private-equity penetration.
    - >-
      Watershed has a credible funding and talent base, with nearly 400 employees and verified Series B/C financing
      backed by Greenoaks, Sequoia, and Kleiner Perkins.
    - >-
      Open-data and procurement-grade product-footprint work give Watershed a sharper category wedge than generic
      sustainability suites focused mainly on reporting.
  topRisks:
    - >-
      ARR, revenue, gross margin, retention, services mix, cash, and cap-table terms are still undisclosed, making the
      valuation difficult to underwrite.
    - Policy whiplash across SEC, California, and EU disclosure regimes can delay or narrow compliance-driven demand.
    - >-
      Watershed faces bundled competition from SAP, Microsoft, IBM, Salesforce, and Workiva when buyers prefer extending
      existing enterprise stacks.
    - >-
      Customer-scale statements are directionally strong but imprecise, with 90+ Fortune 500, hundreds of corporations,
      and >500 clients reflecting different source lenses.
    - >-
      The $1.8B mark looks stretched without private proof that ARR and quality metrics already justify a sustained
      premium multiple.
  unresolvedGaps:
    - Current ARR, recognized revenue, gross margin, services mix, and NRR/GRR remain undisclosed.
    - Exact active-customer count, production-module depth, and revenue concentration by cohort are not public.
    - Cash balance, burn, runway, and liquidation preferences are not disclosed.
    - Pipeline durability outside regulation-driven workflows needs private proof as SEC and EU rules shift.
