- id: r-liability-marketplace
  title: Greenwashing and carbon-market liability can spill back onto Watershed
  body: |-
    The most acute legal risk is not a public lawsuit against Watershed itself in the retained set; it is the tightening claim environment around carbon offsets, carbon neutrality, and environmental marketing. FTC materials say marketers must avoid environmental claims that are unfair or deceptive under Section 5, while California’s AB 1305 forces detailed website disclosures around voluntary carbon offsets, net-zero claims, and claim substantiation, with aggregate penalties that can reach $500,000. Faegre and Simpson Thacher’s analysis makes the same practical point in plainer English: companies now need to back up public carbon claims with specific, reviewable evidence.

    That matters for Watershed because the company does not stop at calculation. Its partner page with CDP and its own AI-launch materials both emphasize access to curated, high-additionality carbon-removal supply. That is commercially attractive, but it also means a bad project, an unsupported “neutral” claim, or stale website language can become a platform-level reputation problem even if the underlying project developer caused the operational miss. In other words, Watershed’s marketplace and claims-enablement layer can amplify legal and reputational downside relative to a vendor that only delivers measurement software.
  claimRefs:
  - CR025
  - CR038
  - CR039
  - CR040
  - CR041
  - CR042
  - CR043
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: r-methodology-ai
  title: Methodology drift and AI trust are core output-quality risks
  body: |-
    Watershed’s product is strongest where the market is hardest: Scope 3, product footprints, and audit-ready reporting. The same evidence also shows why this is risky. GHG Protocol still treats Scope 3 as the canonical value-chain framework, but it is updating its corporate suite because the standards ecosystem has moved on. The technical guidance places real weight on supplier-specific data and careful treatment of hybrid methods, while the new land-and-removals standard expands the accounting perimeter that sophisticated buyers now expect software to handle. Watershed’s Product Footprints product leans directly into this challenge by automating activity-based Scope 3.1 measurement and factor selection, which is powerful but also exposes the company to rework when methods, factors, or customer evidence quality change.

    The AI layer sharpens both the upside and the risk. Watershed promises OCR, anomaly detection, report drafting, transparent calculations, human review, and multi-model safeguards using Anthropic, OpenAI, and Gemini. Those are meaningful controls, and they likely help explain the productivity claims on the site and in launch coverage. But the retained public record does not show production hallucination rates, override rates, or model-related audit exceptions. That means the chapter should treat AI as a leverage tool with real trust risk rather than as a solved feature.
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
