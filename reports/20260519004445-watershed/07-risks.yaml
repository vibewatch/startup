- id: r-mitigations-kill-criteria
  title: Mitigations are credible, but investors still need hard kill criteria
  body: |-
    Watershed is not walking into these risks empty-handed. The company publishes a deeper control and credibility surface than many sustainability vendors: in-house technical experts, advisory groups, AI governance language, data lineage, match-score rationale, public claims about audit performance, and external partner validation from CDP. Those are real mitigants because they suggest Watershed understands where the market is headed and has already invested in the boring work of traceability and methodology. They also explain why the company can credibly sell beyond pure reporting into supplier engagement, product-footprint work, and curated action products.

    But a risk chapter should be explicit about what would actually break the thesis. The cleanest kill criteria are observable: California-led bookings stall despite SB 253 moving forward; EU pipeline weakens materially after Omnibus threshold resets; a customer-facing correction traces back to AI-generated content; a curated removal project becomes a public claim failure; or private diligence reveals concentrated revenue and weak renewals hiding behind strong logos. Until management closes those evidence gaps with private data, the honest residual rating stays elevated even though the category itself remains attractive.
