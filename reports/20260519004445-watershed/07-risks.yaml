  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: Final court orders, transposition texts, and agency implementation notices that settle the SEC rescission path, the SB 261 appeal, and member-state rollout after the EU Omnibus package.
    whyItMatters: The risk register can rank public headwinds, but underwriting timing still depends on legal outcomes that are not final in the retained source set.
    diligencePath: Pull the Eighth Circuit docket, Ninth Circuit docket, and any final CARB or EU member-state implementation notices before treating mandate-driven demand as committed pipeline.
    relatedQuestionRefs:
    - QR002
    - QR005
    - QR023
    - QR028
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-economics
    missingEvidence: Active-customer count, ARR, NRR, gross margin by module, average implementation length, and revenue concentration by top accounts or sectors.
    whyItMatters: Without private cohort data, the public record cannot size how much downside sits in a few logos, slow renewals, or delayed enterprise rollouts.
    diligencePath: Request cohort retention, ACV distribution, pipeline conversion by regulatory versus voluntary use case, and top-10 customer revenue share from management.
    relatedQuestionRefs:
    - QR026
    - QR028
  - type: private-evidence-only
    severity: material
    topic: marketplace-quality-history
    missingEvidence: A project-level history of deliveries, reversals, underperformance, replacement actions, buffer use, and customer-claim disclaimers for marketplace inventory.
    whyItMatters: Marketplace credibility is central to Watershed’s differentiation, but public sources do not show loss history or contractual allocation of liability when projects miss.
    diligencePath: Obtain removal-project list, screening memos, monitoring reports, reversal policies, and customer contract language on representations, warranties, and indemnities.
    relatedQuestionRefs:
    - QR027
    - QR030
  - type: private-evidence-only
    severity: material
    topic: ai-governance-benchmarks
    missingEvidence: Production hallucination rates, human-override rates, escalation thresholds, model-change logs, and audit exceptions tied specifically to Watershed AI outputs.
    whyItMatters: Watershed publishes controls and productivity wins, but investors still need evidence that automated outputs stay reliable under real reporting pressure.
    diligencePath: Ask for internal QA metrics, model-risk policy, customer rollback procedures, and examples where human review blocked or corrected model-generated reporting content.
    relatedQuestionRefs:
    - QR029
