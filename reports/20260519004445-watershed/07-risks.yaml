company:
  name: Watershed
chapter:
  number: 7
  title: Risks
  summary: |-
    Watershed’s biggest risks are not demand collapse but demand timing, methodology credibility, and execution under scrutiny. The retained evidence points to five top buckets: policy whiplash across SEC, California, and EU reporting rules; greenwashing and carbon-removal liability; supplier-data and AI-output trust risk in Scope 3 and product footprints; bundled competition from larger software suites; and opaque enterprise economics around pricing, retention, and concentration. Watershed’s expert bench, control surface, and marketplace curation are meaningful mitigants, but they also raise the standard investors should expect the company to keep meeting.
