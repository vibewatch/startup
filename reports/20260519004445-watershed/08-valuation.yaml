- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / sign
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR below premium-support level
    - Private ARR below roughly $100M
    - Current mark starts to imply >18x revenue or requires unjustified optimism.
    - Do not pay the 2024 mark without a reset or a different structure.
  - - Weak renewals or poor expansion
    - NRR below premium software norms or low module expansion
    - Premium-multiple case collapses because product depth is not monetizing.
    - Move to avoid unless price adjusts materially.
  - - Services-heavy delivery
    - Gross margin or services mix looks materially worse than software-led peers
    - Comparable band migrates toward lower single digits or low-teens at best.
    - Treat current mark as stretched-to-expensive.
  - - Policy-linked pipeline concentration
    - Meaningful share of bookings tied to delayed EU or California timing
    - Demand timing risk becomes valuation risk instead of only growth timing noise.
    - Cut warranted multiple and revisit base / bear case.
  - - Suite bundling wins inside major accounts
    - Large buyers choose Microsoft, Salesforce, SAP, or Workiva modules instead of Watershed expansion
    - Watershed loses the premium-for-depth argument while still bearing standalone go-to-market cost.
    - Re-rate toward mature-suite multiples rather than climate-native premium hopes.
  notes: These are observable kill criteria that directly change the warranted multiple band rather than just sounding directionally negative.
