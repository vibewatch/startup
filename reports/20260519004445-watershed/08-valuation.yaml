- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Latest revenue basis
  - Current market cap / sector mark
  - Proxy multiple / status
  - Why relevant
  - Main limitation
  rows:
  - - Workiva
    - 2024 revenue $738.7M; ~90% subscription and support; 2026 guide $1.037B-$1.041B
    - May 2026 market cap $2.79B
    - ~3.8x market cap / 2024 revenue
    - Closest disclosure-and-controls software analog with visible retention and growth data.
    - Not climate-native, and public markets currently value it at a sober multiple despite strong retention.
  - - Salesforce
    - FY2026 revenue $41.5B; ~95% subscription and support; current RPO $35.1B
    - May 2026 market cap $146.82B
    - ~3.5x market cap / FY2026 revenue
    - Shows what a scaled enterprise software platform with backlog support trades at today.
    - Much broader product suite than Watershed and benefits from installed-base bundling.
  - - Microsoft
    - FY2025 revenue $281.7B; Azure >$75B; FY26 Q3 cloud revenue $54.5B
    - May 2026 market cap $3.146T
    - ~11.2x market cap / FY2025 revenue
    - Useful as an upper-end AI-and-cloud outlier showing how public markets reward exceptional scale and momentum.
    - Too large and diversified to be a direct peer; clearly an outlier, not a median anchor.
  - - IBM
    - 2025 revenue $67.5B; 58.2% gross margin; software ~45% of revenue
    - May 2026 market cap $209.35B
    - ~3.1x market cap / 2025 revenue
    - Good mature-suite floor case for a diversified enterprise vendor with real software mix.
    - Hybrid model and legacy base make it a floor, not a growth multiple analog.
  - - SAP
    - 2025 revenue €37.804B; gross profit €26.814B; operating margin 26.1%
    - May 2026 market cap $205.86B
    - ~5.4x market cap / 2025 revenue before FX caveat
    - Useful ERP-adjacent platform reference for integrated sustainability workflows.
    - Revenue is reported in euros, so the ratio is approximate without FX normalization.
  - - SaaS Capital Index
    - June 2025 median public SaaS ARR multiple
    - 6.7x median ARR multiple; 4x-10x middle spread
    - Sector band, not company-specific
    - Best retained sector-wide read on what public SaaS markets currently reward or punish.
    - Not climate-specific and not directly comparable to a private company with unknown ARR.
  notes: Rows mix current public company market-cap-to-revenue proxies with one sector ARR-multiple index to bracket Watershed’s possible multiple range. This is an indicative framework, not a clean peer set or debt-adjusted EV analysis.
