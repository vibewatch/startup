  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-arr
    missingEvidence: Current ARR, recognized revenue, bookings trend, and FY2026 internal forecast by product or module.
    whyItMatters: Without a current revenue base, the $1.8B mark cannot be tested against any multiple band with confidence.
    diligencePath: Request a monthly ARR waterfall, current quarter actuals, and the board-approved FY2026 operating plan.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin split, services attachment, GRR, NRR, churn, and expansion by cohort.
    whyItMatters: Premium multiples require proof that Watershed behaves like high-quality software rather than a services-heavy implementation business.
    diligencePath: Request cohort retention tables plus software-versus-services gross margin and deployment-hour benchmarks.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Current cap table, liquidation preferences, participation rights, side letters, and any meaningful secondary sales.
    whyItMatters: The last priced round can overstate common-equivalent value if preference overhang or structure is material.
    diligencePath: Request the current charter, cap table, and a plain-English summary of all investor rights senior to common.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: net-cash-bridge
    missingEvidence: Cash, debt, lease obligations, working-capital needs, and any project or marketplace balance-sheet exposures.
    whyItMatters: Debt or low cash would break the chapter’s simplifying assumption that equity value roughly approximates enterprise value.
    diligencePath: Request the latest balance sheet, debt schedule, covenant summary, and monthly cash bridge.
    relatedQuestionRefs:
    - QV033
  - type: private-evidence-only
    severity: material
    topic: policy-linked-pipeline
    missingEvidence: Pipeline and bookings split between California or EU reporting triggers and broader procurement or decarbonization use cases.
    whyItMatters: This determines how much policy rollback should change the growth rate and warranted multiple.
    diligencePath: Request pipeline stage, win-rate, and bookings data by use case, geography, and regulatory trigger.
    relatedQuestionRefs:
    - QV032
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A cleaner set of pure-play climate-software public comps or recent disclosed M&A transactions with directly comparable economics.
    whyItMatters: The current comparable table is directionally useful but mixes vertical disclosure software, broad suites, and a sector index.
    diligencePath: Refresh the comp set when a closer public climate-software peer or disclosed transaction becomes available.
    relatedTableRefs:
    - TV004
