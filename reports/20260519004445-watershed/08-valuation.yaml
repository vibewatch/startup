- id: v-scenario-math
  title: Scenario math shows when $1.8B is attractive, fair, or stretched
  body: |-
    Once the public comp bracket is set, the core question becomes simple: what ARR or revenue base would make Watershed’s $1.8 billion last mark make sense? Using public SaaS and comp ranges as directional bands, $1.8 billion implies about $100 million of ARR at 18x, $120 million at 15x, $150 million at 12x, $180 million at 10x, $225 million at 8x, and about $269 million at the 6.7x SaaS Capital median. That is why the current stance is price-sensitive. If Watershed is already well north of $150 million ARR with strong retention and limited services drag, the mark can look attractive. If it is closer to $100 million to $150 million ARR, the mark can look fair but not obviously cheap. If it is below $100 million ARR, or if heavy services work and policy delays push the warranted band down toward 6x to 10x, the mark starts to look stretched quickly.

    The scenario table therefore uses explicit bull, base, and bear cases instead of false precision. The bull case assumes Watershed has already crossed into premium-growth territory and deserves a long-tail software multiple. The base case assumes real enterprise traction but not enough disclosed proof to pay top-decile prices confidently. The bear case assumes the company is still scaling into the valuation while public markets and policy timing offer less forgiveness than they did in 2021 or early 2024.
