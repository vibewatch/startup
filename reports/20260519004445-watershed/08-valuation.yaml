- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Exact diligence path
  rows:
  - - Current ARR / recognized revenue
    - Current ARR, bookings, and recognized revenue by product
    - This is the single fastest way to test whether the $1.8B mark is fair or stretched.
    - Request monthly ARR bridge, current quarter actuals, and FY2026 board forecast.
  - - Retention and expansion
    - GRR, NRR, cohort expansion, and module attach by customer segment
    - Premium multiples require durable expansion economics, not just strong logos.
    - Request cohort tables and ACV expansion by module.
  - - Gross margin and services mix
    - Software gross margin, professional services attachment, and implementation burden
    - Services-heavy delivery can compress the warranted multiple sharply.
    - Request gross margin split and deployment-hour benchmarks.
  - - Cap table and preferences
    - Liquidation preferences, participation rights, secondaries, and any structure above common
    - The last priced round can overstate common-equivalent value if overhang is meaningful.
    - Request current cap table, charter, and side-letter summary.
  - - Cash and debt bridge
    - Cash, debt, working capital, and any off-balance-sheet obligations
    - Debt or low cash would break the simple equity≈EV assumption used in this chapter.
    - Request latest balance sheet, debt schedule, and covenant summary.
  - - Policy-linked pipeline split
    - Bookings mix driven by reporting mandates versus broader procurement or decarbonization demand
    - This determines how much rollback risk should be applied to growth and multiple assumptions.
    - Request pipeline and bookings by use case, geography, and regulatory trigger.
  notes: Each diligence ask is framed to answer a valuation question directly rather than to broaden the memo without changing the call.
