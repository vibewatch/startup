- id: v-public-comp-bracket
  title: Public comps say Watershed is competing for a premium in a lower-multiple market
  body: |-
    The most useful public bracket is not a single peer but a layered one. Workiva is the closest disclosure-and-controls software analog in the retained set: it reported $738.7 million of 2024 revenue, roughly 90% subscription and support mix, 97% gross retention, 112% net retention, and a current market cap of about $2.79 billion, implying only about 3.8x revenue. Salesforce, IBM, and SAP all sit in similarly sober single-digit market-cap-to-revenue territory despite enormous scale, backlog, and operating leverage. Microsoft is the outlier, trading around 11x revenue because investors are underwriting very large AI and cloud growth plus extraordinary commercial backlog.

    SaaS Capital’s broader framing explains why that matters. Its June 2025 median public SaaS ARR multiple was 6.7x, with a 2023-2025 “new normal” bounded around 6x to 8x and a middle spread that can run from roughly 4x to 10x. In other words, current public software markets do still pay up for exceptional winners, but the default state is no longer automatic premium software pricing. For Watershed, that means a premium case is possible, but it has to be earned by unusually strong growth, retention, and product depth rather than by category label alone.
