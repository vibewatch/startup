evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-som
    missingEvidence: >-
      Public revenue segmentation showing what share of the large-enterprise climate-reporting market is captured by
      standalone vendors versus suites or services.
    whyItMatters: >-
      Without that segmentation, Watershed’s true serviceable obtainable market cannot be verified from public data and
      generic TAMs can overstate near-term monetizable demand.
    diligencePath: >-
      Request customer-count by ACV tier, win-loss data versus suite vendors, and revenue mix by product/workflow from
      management or investor materials.
    relatedQuestionRefs:
      - QM006
      - QM026
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-definition-methodology
    missingEvidence: >-
      Transparent methodology appendices that reconcile how the retained market reports define software versus services
      and how they treat adjacent ESG-reporting workflows.
    whyItMatters: >-
      Published estimates differ by category construction as much as by growth outlook, so forcing one TAM would create
      false precision.
    diligencePath: >-
      Obtain full analyst report samples or methodology notes from at least two publishers and normalize the category
      boundary before using TAM in valuation work.
    relatedQuestionRefs:
      - QM004
      - QM026
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: budget-ownership-splits
    missingEvidence: >-
      An independent cross-industry survey quantifying which department actually signs and pays for climate or ESG
      software by company size and sector.
    whyItMatters: >-
      The retained evidence supports a cross-functional buying pattern, but it does not quantify budget share by
      finance, sustainability, procurement, and IT well enough for precise sales-motion planning.
    diligencePath: >-
      Ask management for department-level champion data from recent wins and look for sector-specific surveys that
      quantify software budget ownership rather than process ownership.
    relatedQuestionRefs:
      - QM015
      - QM016
      - QM017
      - QM026
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: blocking
    topic: win-rates
    missingEvidence: >-
      Segmented competitive win-loss data showing how Watershed performs versus Persefoni, Sweep, SAP, Microsoft, IBM,
      Salesforce, and Workiva in actual RFPs.
    whyItMatters: >-
      Without realized win-rate evidence, the chapter can explain where Watershed should win but cannot confirm whether
      product breadth truly converts into displacement or standard-of-record status.
    diligencePath: >-
      Request the last 12 months of RFP outcomes segmented by buyer archetype, named competitor in final round, module
      mix, and reason won or lost.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: implementation-intensity
    missingEvidence: >-
      Comparable implementation duration, services effort, and internal staffing requirements across Watershed and top
      direct and suite rivals.
    whyItMatters: >-
      Deployment burden shapes total cost of ownership, time-to-value, and whether a buyer can justify a specialist
      platform over an incumbent bundle.
    diligencePath: >-
      Request implementation plans, services statements of work, and time-to-first-report metrics from at least three
      customers or implementation partners per platform.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized contract values, discounting patterns, module attach, and multi-year terms for Watershed and key rivals.
    whyItMatters: >-
      Public packaging cues do not reveal whether Watershed is materially more expensive than incumbent-suite
      alternatives or how sharply price pressure hits competitive deals.
    diligencePath: >-
      Request anonymized pricing schedules, discount policies, and postmortems for deals lost on pricing versus
      Microsoft, SAP, IBM, and direct specialists.
