- id: o-funding-stakeholders
  title: Funding history, investors, and milestone record
  body: |-
    The financing history in the fetched source pack is strongest from 2022 onward. Watershed's official Series B post says the company raised $70 million at a $1 billion valuation, co-led by Sequoia and Kleiner Perkins. The better-corroborated anchor is the February 1, 2024 Series C: Watershed, Reuters, and Yahoo's Reuters republication all agree that the company raised $100 million at a $1.8 billion valuation, with Greenoaks leading and Sequoia plus Kleiner Perkins participating. That combination should be treated as the canonical latest-round fact for later chapters; if future materials suggest a different lead investor, they should be treated as lower-confidence unless they are supported by fetched evidence.

    Earlier history is real but less fully quantified here. Sequoia's founder profile says a Series A was raised in mid-2020 and names Sequoia and Kleiner Perkins as co-leads, yet the round amount is not disclosed in the retained source set. Archived Crunchbase data broadens the Series C participant list to include Galvanize Climate Solutions, Emerson Collective, Elad Gil, and Neo, which is useful for stakeholder mapping but still secondary to the company and Reuters for the lead-investor fact pattern.
