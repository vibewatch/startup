- id: o-scale-expansion
  title: Commercial footprint, customer mix, and platform expansion
  body: |-
    Watershed shows meaningful scale for a private climate software vendor, but the public footprint is described through several different lenses. The homepage claims 90+ Fortune 500 customers, 5 of the top 6 US banks, and 6 of the top 10 global private equity firms, while the about page says four of the top six US banks rather than five. Business Insider adds a founder quote that the company has more than 500 clients and serves 60 of the Fortune 500. These are not fatal contradictions, but they do mean later chapters should avoid flattening customer-scale statements into a single unqualified number without preserving the source lens.

    What is more directionally consistent is the platform-expansion story. Official materials show emissions under management progressing from more than 20 million tonnes at Series B to 479 million tonnes at Series C and then to 3 gigatonnes on the current homepage. Since 2025, Watershed has also highlighted Open CEDA, Mexico City expansion, a Deloitte Netherlands partnership, more than 160 product enhancements in 2025, and third-party category recognition claims in 2026. Together those milestones suggest a company broadening from emissions measurement into broader enterprise sustainability infrastructure.
