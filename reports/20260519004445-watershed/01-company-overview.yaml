- id: o-regulatory-risks
  title: Regulatory backdrop, headwinds, and reusable ground truth
  body: |-
    Watershed's demand narrative sits on top of a real regulatory catalyst. The SEC adopted climate-disclosure rules in March 2024, and Reuters explicitly framed Watershed's Series C around climate disclosures moving from optional to mandatory. That helps explain why the company pairs measurement, audit-ready reporting, and decarbonization execution in a single platform narrative. At the same time, the backdrop is not uniformly favorable. Business Insider quotes Taylor Francis saying the policy pendulum is not swinging in the right direction, even though companies continue climate work behind the scenes, and it reports that Francis sees Microsoft and Salesforce as Watershed's biggest competitors.

    The public financial disclosure picture also remains thin. Business Insider says January 2025 was Watershed's best month ever for new revenue, but no revenue or ARR figure is given, so later financial analysis should treat public top-line data as unavailable rather than inferred. The cleanest reusable ground truth from this chapter is therefore narrower: Watershed was started in 2019, is headquartered in San Francisco, is led publicly by Taylor Francis, most recently disclosed a $100 million Series C at a $1.8 billion valuation led by Greenoaks, and operates a global enterprise sustainability platform with broad but somewhat inconsistently described customer-scale metrics.
