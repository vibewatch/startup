  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-metrics
    missingEvidence: Audited revenue, ARR, NRR, gross margin, burn, runway and cash balance.
    whyItMatters: These fields determine whether public growth signals translate into durable financial performance.
    diligencePath: Request audited financial statements, ARR bridge, retention cohorts, COGS schedule and monthly cash-flow
      forecast.
    relatedQuestionRefs:
    - QI024
    - QI025
    - QI035
    - QI036
    - QI042
    relatedTableRefs:
    - TI004
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue and verification-volume concentration by logo and segment.
    whyItMatters: A few high-volume platforms could dominate revenue, usage costs and churn risk.
    diligencePath: Request top-10 customer ARR, usage volume, gross margin, renewal dates and expansion/contraction by cohort.
    relatedQuestionRefs:
    - QI041
    relatedTableRefs:
    - TI003
    - TI006
  - type: conflicting-data
    severity: material
    topic: adverse
    missingEvidence: Definitive post-incident customer churn, pipeline impact, remediation costs and legal reserve data.
    whyItMatters: Adverse privacy scrutiny can affect sales cycles and cost structure, but public reports and company responses
      are contested.
    diligencePath: Review board materials, incident postmortems, customer notices, insurance correspondence and litigation-reserve
      analysis.
    relatedQuestionRefs:
    - QI028
    - QI029
    - QI030
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Reliable current headcount from a primary or high-reputation retained source.
    whyItMatters: Without headcount, revenue per employee and operating leverage cannot be calculated.
    diligencePath: Request current org chart, monthly headcount history and department-level compensation run-rate.
    relatedQuestionRefs:
    - QI039
    relatedTableRefs:
    - TI006
