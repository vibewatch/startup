- id: TI004
  title: Unit economics table
  columns:
  - Metric
  - Public value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Bookings per verification sanity check
    - ~$0.33 if $100M annual contracts and 300M+ verifications are comparable
    - Low
    - Shows rough order of magnitude but mixes timing and product bundles
    - Actual revenue, verification count and platform fees for same period
  - - Gross margin
    - 'Null'
    - Low
    - Core determinant of software versus services/data economics
    - 'COGS split: data, cloud, liveness, support, manual review'
  - - Manual-review rate
    - Null; customer stories imply reduction
    - Low
    - Human review can cap margins and scalability
    - Percent auto-approved, escalated, rejected and reviewed by segment
  - - CAC payback
    - 'Null'
    - Low
    - Enterprise IDV sales may require long cycles and security review
    - Sales cycle, win rate, implementation cost and first-year gross profit
  - - NRR / expansion
    - 'Null'
    - Low
    - Embedded workflows should expand if customers add checks and geographies
    - Cohort ARR, usage expansion, contraction and churn
  - - Security/compliance cost
    - SOC 2 Type II, GDPR/CCPA, encryption and retention controls disclosed
    - Medium
    - Fixed trust costs can be margin drag and moat
    - Security headcount, audits, insurance and legal spend
  notes: Every null reflects unavailable private metrics; the one numerical estimate is a sanity check, not a reported KPI.
