- id: TI002
  title: Pricing / monetization table
  columns:
  - Source
  - Price / contract evidence
  - List versus realized
  - What it implies
  - Key caveat
  rows:
  - - Persona pricing page
    - Volume-based pricing across verification types
    - List/package signal only
    - Usage pricing likely scales with verification complexity
    - No public realized rate or gross margin
  - - Forbes profile
    - Plans start at $250 per month
    - Public starting point
    - Small customers can enter at low monthly price
    - Higher tiers and enterprise contracts not quantified
  - - Trust Swiftly 2026 comparison
    - $250 monthly minimum and 12-month contract required
    - Third-party benchmark
    - Confirms a minimum-contract framing
    - Competitor-authored comparison may have bias
  - - Vendr early-stage benchmark
    - $25K annual contracts for modest volume
    - Anonymized realized-contract proxy
    - Minimums matter more than seat count
    - Benchmarks are aggregate, not audited Persona revenue
  - - Vendr mid-market benchmark
    - $75K-$250K annual spend for 5K-25K verifications/month
    - Anonymized realized-contract proxy
    - Volume discounts shape realized price
    - Exact verification mix not disclosed
  - - Vendr high-volume benchmark
    - $250K+ and sometimes $500K-$1M+ annual contracts
    - Anonymized realized-contract proxy
    - Enterprise accounts can be material ARR contributors
    - Customer concentration unknown
  notes: Pricing rows combine official list/package evidence with third-party procurement benchmarks; realized net pricing
    and discounts must be verified in contracts.
