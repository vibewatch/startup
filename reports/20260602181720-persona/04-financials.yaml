tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Public value/status
  - Revenue quality
  - Diligence ask
  rows:
  - - Verification checks
    - Government ID, selfie, phone, email, database, business registry, TIN, eCBSV and mDL checks
    - Per check / verification type
    - Volume-based pricing; 300M+ verifications in 2024
    - Recurring if embedded in onboarding or compliance; pass-through cost unknown
    - Actual volume, realized price and data-source cost by check type
  - - Workflow platform
    - Rules, approvals, denials, follow-up actions and audit trails
    - Platform/workflow usage or bundled contract
    - No standalone price disclosed
    - Higher stickiness if customer policy logic lives in Persona
    - Contract allocation between workflow fees and usage fees
  - - Cases / review tooling
    - Automated routine cases and consolidated review context
    - Seat, case, or platform bundle unknown
    - No standalone price disclosed
    - Could improve labor leverage and retention
    - Manual-review volumes, automation rate and support staffing cost
  - - Graph / link analysis
    - Fraud link analysis and risk signals across lifecycle
    - Feature bundle or usage unknown
    - No standalone price disclosed
    - Differentiates higher-risk customers but requires signal quality
    - Attach rate, false-positive lift and incremental margin
  - - Enterprise support / compliance
    - Security, privacy, SOC 2, GDPR/CCPA, data retention controls
    - Bundled enterprise commitment
    - No standalone price disclosed
    - Trust premium for regulated buyers
    - Support and compliance cost as percent of ARR
  notes: Public sources disclose mechanisms and selected scale signals, not revenue mix or recognized revenue by product;
    cells marked unknown require management data.
