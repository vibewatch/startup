- id: TI006
  title: Public financial gaps table
  columns:
  - Missing metric or risk
  - Public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue / ARR
    - Only annual-contract and profile estimates retained
    - Cannot distinguish bookings, ARR and GAAP revenue
    - Request audited statements and ARR waterfall
  - - Revenue mix
    - Not disclosed by verification, workflow, Graph, Cases or support
    - Cannot model margin or attach-rate quality
    - Request product-line revenue and gross margin
  - - Gross margin / COGS
    - Not disclosed
    - Cannot classify business as high-margin software versus data/services hybrid
    - Request COGS by data, cloud, manual review and support
  - - Customer concentration
    - Only customer logos and 4,000+ businesses disclosed
    - Top-logo exposure could dominate ARR
    - Request top-10 ARR and volume share
  - - Legal/privacy reserves
    - BIPA and 2026 scrutiny public; reserves not disclosed
    - Could affect cash burn and procurement friction
    - Request litigation status, insurance, reserves and pipeline impact
  - - Headcount and revenue per employee
    - No retained primary source with reliable current headcount
    - Operating leverage cannot be calculated
    - Request headcount by function and ARR per FTE
  notes: This table intentionally lists blockers; each row is a diligence request rather than a claim that the metric is negative.
