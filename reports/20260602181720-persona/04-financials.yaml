- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Persona''s latest disclosed financing is substantial: a $200 million Series D at a $2 billion valuation, with Forbes
    reporting $417 million of total funding. That reduces near-term financing pressure relative to an unfunded startup, but
    public data still cannot answer runway. No retained source discloses cash balance, monthly burn, revenue recognition,
    debt, lease obligations, cloud commitments, or hiring plan. The risk is not only liquidity; it is whether growth depends
    on continued enterprise sales expansion, ongoing investment in compliance and security, and potentially expensive responses
    to biometric or privacy scrutiny. Because the company is private and no audited financial statements were found, the capital
    adequacy conclusion must remain conditional on management-provided financials.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI041
  tableRefs:
  - TI005
  figureRefs: []
- id: adverse-financial-risks-and-diligence-gaps
  title: Adverse financial risks and explicit evidence gaps
  body: 'The adverse record is material for financial diligence because privacy, biometrics, and age-assurance scrutiny can
    affect enterprise procurement, legal reserves, insurance, compliance staffing, and customer retention. The Justia-cited
    Illinois appellate opinion revived plaintiffs'' ability to pursue biometric-privacy claims rather than forcing arbitration.
    Malwarebytes, Cybernews, and Biometric Update each reported 2026 scrutiny of exposed frontend or surveillance-check allegations,
    while Malwarebytes also included Persona''s response that the environment was isolated, no personal data was exposed,
    no customer used all 269 checks, and customers control data handling. The financial conclusion is therefore balanced:
    the public evidence supports strong demand and scaled usage, but it does not prove durable margins or low risk-adjusted
    CAC. The diligence plan should request audited financials, cohort ARR, realized pricing by verification type, data pass-through
    costs, manual-review rates, customer concentration, privacy/legal reserves, insurance premiums, and post-incident churn
    or pipeline effects.'
