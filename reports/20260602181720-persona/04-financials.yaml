runDate: '2026-06-02'
company:
  name: Persona
chapter:
  number: 4
  title: Financials
  summary: Persona shows scaled usage, credible enterprise demand, and a likely hybrid usage-plus-platform revenue model,
    but public evidence stops short of audited ARR, margin, burn, runway, retention, or customer concentration. The financial
    view should treat $100 million of annual contracts, 300 million-plus verifications, and $200 million of fresh capital
    as useful signals rather than complete underwriting proof.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing evidence
  body: 'Persona''s public evidence supports a hybrid usage-and-platform model, not a clean SaaS seat model. The company sells
    verification types, workflows, graph investigation, cases, APIs, and compliance-oriented identity processes; its own pricing
    page says volume-based pricing, while Vendr describes consumption pricing by verification type, monthly volume, commitments,
    and workflow complexity. That makes reported contract value a better public proxy than list price. Public pricing anchors
    are still incomplete: Forbes and Trust Swiftly both point to a $250 monthly starting or minimum level, but enterprise
    economics likely sit in annual commitments that can range from tens of thousands to more than $500,000 depending on volume.
    The key underwriting distinction is that list pricing is not realized revenue, and realized revenue is not gross profit
    because database, biometric, liveness, support, review, compliance, and cloud costs are not disclosed.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI042
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-revenue-quality
  title: Traction, revenue-quality signals, and public estimates
  body: The best public revenue signal is the combination of Persona's own 2024 operating disclosure and Forbes' independent
    April 2025 profile. Persona said it processed more than 300 million verifications in 2024 and doubled revenue and customer
    count year over year; Forbes reported more than 4,000 enterprise businesses and $100 million worth of annual contracts.
    Those are meaningful scale signals, but they are not audited ARR, recognized revenue, gross margin, or net retention.
    Customer proof from OpenAI, Brex, Square, Branch, Outdoorsy, and a grocery technology platform demonstrates high-volume
    and high-compliance use cases where identity checks can be recurring and operationally embedded. Revenue quality appears
    better when Persona is the policy/workflow layer that controls follow-up actions, not merely a replaceable document check.
    However, concentration, committed versus usage-based revenue, expansion rates, churn, and net dollar retention remain
    private.
  claimRefs:
