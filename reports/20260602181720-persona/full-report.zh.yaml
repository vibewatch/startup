  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Persona 是高质量但价格敏感的后期身份验证资产。清晰的公开锚点是 2025 Series D：融资 $200 million， 估值 $2
              billion；公司披露和独立报道相互印证。公开的收入质量锚点更弱：Forbes 报道了 $100 million 年度合同或 ARR 式信号，但经审计
              ARR、确认收入、NRR、毛利率、烧钱速度、客户集中度和股权结构优先权仍未公开。 用 $2 billion 估值简单对比 $100 million 代理指标，约为
              20x；放在快速增长的身份平台上说得通，但还没有便宜到 可以忽略执行和信任风险。因此正确立场是观察 / 继续研究，而不是买入：Persona 也许能用私有证据支撑估值， 但仅凭公开证据，价格介于合理与偏高之间。
