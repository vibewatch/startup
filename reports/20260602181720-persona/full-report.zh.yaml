      - number: '3.3'
        title: 定价、打包、多供应商并用与切换成本
        blocks:
          - type: paragraph
            body: >-
              公开定价证据指向企业定价不透明，而不是清晰的标价可比。Persona 自己的页面称按量定价，Vendr 则描述由验证类型、量、工作流和承诺量驱动的消耗定价。Jumio 和 Socure
              通过采购基准呈现同样模式，而 Entrust、LexisNexis 和 Trulioo 需要报价核验才能确认准确组合。Stripe 是最清晰的采购基线，因为其定价界面强调按用量付费的平台打包，Identity
              页面还提供前 50 次验证免费。这种透明度会压迫简单用例。切换成本真实存在但并非绝对：API/SDK
              工作、调好的政策逻辑、案件复核运营、审计轨迹、数据源组合和转化率风险都会让替换变痛；但买方仍可多供应商并用，把低风险用户路由到更便宜的检查，把 Persona 留给复杂的
              KYB、图谱、制裁或例外工作流。尽调含义是把标价、实际净价、转嫁数据成本和服务成本分开；否则 Persona 看起来可能比真实客户合同经济性更强或更弱。
