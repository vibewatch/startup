      - number: '7.3'
        title: 安全、监控指控和产品控制风险
        blocks:
          - type: paragraph
            body: >-
              Persona 有可信的安全缓释项：FedRAMP Moderate 授权、已发布安全控制、加密声明和技术文档。但风险章节不应让这些控制冲淡 2026 年争议。Cybernews 和 State of
              Surveillance 指称暴露代码显示监控和政府报告能力；Malwarebytes 和 Biometric Update 则报道了 Persona
              的回应：暴露环境是隔离的，没有生产或个人数据暴露。这个问题是有争议，而不是已被排除。产品栈进一步加重尽调负担，因为 Workflows、Cases、Graph、观察名单报告、自拍验证和 inquiry API
              创造了很多决策和数据处理界面。筛查逻辑、工作流配置、图谱链接或人工复核中的错误，都可能变成用户排除、客户摩擦、误报、隐私索赔或声誉损害。
