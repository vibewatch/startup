              公开可比组有参考价值，但并不完美。Mitek 是最接近的纯粹公开身份 / 欺诈锚点；GBG 提供身份数据和欺诈基准， Experian 代表规模化数据网络的质量上限，NICE
              提供相邻金融犯罪分析平台参照。没有一家能干净代理 Persona： 这些公司在上市公司成熟度、利润率披露、业务组合、增长、规模和多元化上都不同。私有身份赛道融资又提供 另一层视角：Socure 和 Veriff
              显示，风投曾给身份欺诈和 IDV 资产支付十亿美元级估值，但这些融资发生在 不同市场窗口，不能证明 2026 年退出倍数。可比结论是一段区间，不是一个点：如果增长和利润率强，Persona 可以享受溢价，但
