  - id: TP005
    title: 替代方案和维持现状图谱
    columns:
      - 替代方案
      - 买方何时选择
      - 为什么能赢过 Persona
      - Persona 仍能赢的原因
    rows:
      - - 人工审核 / 维持现状
        - 量低、能容忍分析师人力，或没有合规触发因素
        - 没有新增供应商成本或集成工作
        - 当规模、欺诈、转化率或可审计性让人工审核撑不住时，Persona 胜出
      - - 自建
        - 拥有支付、风险、合规、ML 和数据基础设施的超大型平台
        - 控制权、数据所有权，以及规模化后的低边际成本
        - 当建设周期、责任和国家 / 数据覆盖超出内部能力时，Persona 胜出
      - - 支付原生 IDV
        - 重度使用 Stripe 的平台，需要围绕付款、入驻或社区做基础验证
        - 集成快、品牌可信、采购透明
        - 当工作流跨越支付、KYB、图谱、制裁名单和案例审核时，Persona 胜出
      - - 欺诈优先工具
        - 团队想在采集 ID 前先拿到设备 / IP / 行为上下文
        - 比证件优先流程更早评估风险
        - 当买方同时需要身份凭证、合规留痕和工作流编排时，Persona 胜出
      - - 全球数据 / KYB 专家
        - 核心任务是跨境 KYC/KYB
        - 覆盖范围和本地数据源匹配率可能主导结果
        - 买方需要多类验证和审核运营时，Persona 可凭编排中枢取胜
    notes: 各行是基于供应商主张和独立对比证据归纳的替代模式。
