            body: >-
              估值风险很直接：$2 billion 的后期私有估值押注的是未来能大规模承载信任，但经审计指标仍然缺位。公开证据 给出了融资、客户和验证量信号，却没有 ARR
              质量、毛利率、烧钱速度、现金跑道、净收入留存、客户集中度、 诉讼准备金、董事会风险归属或保险限额。这种不透明很关键，因为最大风险彼此相关。一旦确认发生生产数据暴露、 BIPA
              不利裁决、未计提准备的集体诉讼和解、知名客户终止供应商关系，或监管限制生物识别留存，法律成本、 客户信任、增长和估值倍数会同时受冲击。因此可投资路径必须有条件：只有尽调证明隐私控制、安全运营、客户
