  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与替代模式
        blocks:
          - type: paragraph
            body: >-
              Persona 的竞争集合比一张证件验证供应商名单更宽。直接同业包括 Jumio、Entrust IDV/Onfido、Socure、LexisNexis Risk Solutions、Trulioo 和
              Stripe Identity，因为它们各自都能满足同一入驻、合规、欺诈或信任安全任务的一部分。Veriff、Sumsub 和 SEON 等相邻供应商也重要：买方可能把任务收窄到更便宜的 IDV 套件，也可能在
              ID 采集前把任务扩展到欺诈信号。现状方案和内部自建仍是真实替代：低量团队可以继续人工复核，而拥有支付、风险、ML 和合规基础设施的超大型平台可能自建，或绕开第三方检查。因此 Persona
              的胜利条件不只是身份验证增长；它必须成为买方可配置的身份决策层，而不是一个可互换的验证步骤。这个框架重要，因为采购不按品类抽象发生：合规负责人、欺诈负责人、信任安全负责人和支付平台都可以购买不同替代品，同时仍把项目称为身份验证。
