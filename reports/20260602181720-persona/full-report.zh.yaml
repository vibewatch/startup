            body: >-
              公开客户证据足以验证需求，但还不足以支撑耐久性判断。OpenAI、Brex 和 Coursera 已展示生产场景， Series D 材料称企业客户超过 3,000 家、年度验证量超过 300 million
              次；但公开来源没有披露头部客户 收入占比、续约队列、合同条款、NRR 或流失率。Persona 平台越宽，依赖风险也越大：客户把 Persona API 嵌进开户、制裁筛查、欺诈和年龄保障流程；Persona
              又依赖客户配置，才能让数据留存和披露选择在法律上站得住。 Discord 相关年龄保障反弹说明，只要终端用户觉得验证流程侵入性强，平台很快就会重新评估供应商。真正的缓释 不在更好看的 logo
