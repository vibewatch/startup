      - number: '5.2'
        title: Workflows、Cases 和 Graph 是最清晰的差异化层
        blocks:
          - type: paragraph
            body: >-
              公开层面最差异化的是编排。Persona Workflows 把无代码拖拽编辑器和自定义代码路径结合起来；公司称规则可以批准、拒绝或标记用户，同时保留审计轨迹。Cases 和 Graph
              把能力延伸到运营：Cases 被定位为人工复核和合规中枢，整合主动、被动和行为信号；Graph
              增加链接分析，用来发现关联账户、模式和欺诈团伙。这一点重要，因为身份供应商常在数据源覆盖上竞争，但客户输赢通常发生在路由上：哪些用户被加摩擦，哪些边缘案例进入复核，什么时候企业实体需要强化尽调，以及可疑活动如何升级。Persona
              的公开证据支持编排护城河，但还没有完整度量；关键缺失尽调项包括规则延迟数据、模型 / agent 表现、错误链接率，以及客户能否安全地版本化、测试和审计复杂工作流变更的证据。
