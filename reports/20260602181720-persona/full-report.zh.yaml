            body: >-
              Persona
              的主要产品技术风险不是没有能力，而是透明度、信任和证明。公开页面显示了宽而可配置的平台，但关键运营指标仍是私有信息：按证件和人口统计队列划分的准确率、活体攻击表现、制裁误报、图谱链接精度、工作流延迟、客户转化提升、SLA
              条款以及按客户映射的子处理方。2026 年前端暴露报道加剧了这个信任缺口。Malwarebytes 报道一个隔离测试环境中有 2,456 个可访问文件，并纳入 Persona
              的澄清：没有个人数据暴露，且该环境不是生产环境；Cybernews 和 State of Surveillance 仍把这些代码描述为广泛监控和报告能力的证据；Biometric Update 报道
              Discord 在英国的短期年龄保障测试结束后，Persona 不再是活跃供应商。另行，Washington v. Persona 显示 BIPA 相关生物识别隐私诉讼风险。对投资人而言，Persona
