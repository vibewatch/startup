      - number: '2.2'
        title: 规模测算口径与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              规模证据支持三层视角。广义 TAM 口径可以使用 2026 年接近 $55-$57B 的数字身份解决方案估计，但这一层只是上限，因为它包含超出 Persona 表面范围的身份基础设施。更窄的 SAM
              口径更适合锚定在身份验证估计上：MarketsandMarkets 报告 2025 年为 $14.34B、2030 年为 $29.32B，IMARC 报告 2025 年为 $15.8B、2034 年为
              $50.2B。这些区间在双位数增长方向上一致，但在品类边界和预测期限上不一致。SOM 不应从公开数据中硬造。Persona 在其他章节披露了公开验证量和客户规模头条，但没有披露当前
              ARR、定价、工作流组合、留存、地域收入或客户集中度。因此本章保留相互矛盾的估计，并把可获取份额视为尽调输出，而不是公开来源事实。这也是表格和区间图使用来源标签、而不是单一混合中点的原因；离散度本身就是市场模糊性的发现，不是需要抹平的数学题。
