  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈：模块化身份基础设施，而不是单点验证器
        blocks:
          - type: paragraph
            body: >-
              Persona 的产品栈更像模块化身份操作系统，而不是单一 KYC 小组件。公开平台页把 Persona
              描述为面向身份验证、KYC/AML、KYB、年龄保障和相邻身份运营的可配置基础设施。在这个伞下，公开可见模块包括政府 ID 验证、权威数据库检查、自拍 / 活体、AML/KYC
              筛查、负面媒体、企业入驻、Workflows、Cases、Graph、API、SDK 和
              webhook。因此技术差异化来自宽度加编排：客户可以把不同验证原语、风险信号、复核步骤和保留选择组装进工作流。对受监管金融科技、市场平台、教育和年龄门槛消费产品来说，这很有价值，因为身份要求会随地域、风险层级和用户旅程变化。尽调保留意见是，Persona
              发布了产品能力主张，但没有给出每个模块的独立准确率、误报、欺诈损失或人口统计偏差基准。
