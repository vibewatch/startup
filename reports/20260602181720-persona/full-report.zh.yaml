      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑在于，Persona 有机会成为 AI 时代欺诈市场里的嵌入式身份决策层，而不只是单点 IDV 供应商。该情景有 投资人质量、公开规模信号和 2026 年更广泛的欺诈威胁背景支撑。反向逻辑是，让
              Persona 变重要的信任触面 也让它变脆弱：隐私、生物识别、监控和安全争议会传导到采购摩擦、流失、法律成本、保险成本和估值倍数压缩。 估值争论因此不在于身份验证是否有战略相关性，而在于 Persona
              是否能拿下足够多的高毛利工作流价值，并守住 足够多客户信任，以支撑后期溢价。没有私有单位经济模型和留存证明，上行空间就应保持有条件。
