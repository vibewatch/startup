      - number: '4.5'
        title: 反向财务风险与明确证据缺口
        blocks:
          - type: paragraph
            body: >-
              隐私、生物识别和年龄保障审查会影响企业采购、法律准备金、保险、合规人员配置和客户留存，因此反向记录对财务尽调具有重大意义。Justia 引用的 Illinois
              上诉意见让原告可以继续追究生物识别隐私索赔，而不是被迫仲裁。Malwarebytes、Cybernews 和 Biometric Update 都报道了 2026
              年对暴露前端或监控检查指控的审查；Malwarebytes 还包含 Persona 的回应：该环境是隔离的，没有个人数据暴露，没有客户使用全部 269
              项检查，且客户控制数据处理。因此财务结论是平衡的：公开证据支持强需求和规模化使用，但不能证明持久利润率或低风险调整后 CAC。尽调计划应索取已审计财务、队列
              ARR、按验证类型的实际定价、数据转嫁成本、人工复核率、客户集中度、隐私 / 法律准备金、保险费，以及事故后流失或销售管线影响。
