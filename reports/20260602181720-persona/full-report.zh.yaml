        title: 安全、合规和隐私架构控制强，但依赖客户配置
        blocks:
          - type: paragraph
            body: >-
              Persona 发布了严肃的安全和隐私姿态。帮助中心称其拥有 SOC 2 Type II 认证、静态 AES-256 加密、传输中 TLS 1.2
              或更高版本、漏洞管理、独立渗透测试、审计日志和优先补丁。安全页面还补充了美国 / 欧盟数据驻留支持，并称 Persona for Government 是运行在 Google Cloud Platform
              上的云原生服务。FedRAMP 独立列出 Persona for Government 已于 2026 年 4 月 10 日通过 20x 获得 FedRAMP Certified，Class C
              Moderate。隐私架构更微妙：Persona
              主要作为客户控制者的处理者，政策称年龄保障和身份验证可能涉及政府证件、自拍、面部几何、设备数据、第三方数据源和一般地理位置。默认删除和编辑控制是正面信号，但实际保留可能取决于客户指令、同意和法律要求。AWS、GCP、MongoDB、FingerprintJS、OpenAI
              和 Anthropic 等子处理方为敏感数据流留下尽调清单。
