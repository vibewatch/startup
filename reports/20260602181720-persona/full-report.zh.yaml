        - 规则、批准、拒绝、后续动作和审计轨迹
        - 平台 / 工作流用量或打包合同
        - 未披露独立价格
        - 客户政策逻辑放在 Persona 内，粘性更高
        - 工作流费用与用量费用在合同中的拆分
      - - Cases / 审核工具
