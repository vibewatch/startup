  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 本章从规模和市场验证讲到估值与负面风险，最后落到跟踪建议。
    data:
      nodes:
        - id: scale
          label: 规模信号：$200M D 轮融资、$2B 估值、$100M 公开收入代理指标
        - id: market
          label: 欺诈防控和 AI 身份需求顺风
        - id: comps
          label: 上市 / 私有公司可比区间，没有干净的单一倍数
        - id: risk
          label: 隐私 / 安全争议和指标不透明
        - id: stance
          label: 估值公允到偏紧；待尽调后继续跟踪
      edges:
        - from: scale
          to: comps
          label: 设定价格锚
        - from: market
          to: stance
          label: 支撑上行空间
        - from: comps
          to: stance
          label: 框定溢价
        - from: risk
          to: stance
          label: 限制信心
    approximationNotes: 定性 IC 逻辑链；不是确定性的评分模型。
    claimRefs:
      - CV001
      - CV004
      - CV022
      - CV027
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 隐含倍数最敏感的变量，是公开收入代理指标到底低估还是接近当前 ARR。
    data:
      items:
        - label: 若收入代理指标为 $75M
          value: 26.7
          unit: x revenue proxy
        - label: 若收入代理指标为 $100M
          value: 20
          unit: x revenue proxy
        - label: 若收入代理指标为 $150M
          value: 13.3
          unit: x revenue proxy
        - label: 若收入代理指标为 $200M
          value: 10
          unit: x revenue proxy
    approximationNotes: 用 $2B 估值除以示意性收入 / ARR 代理指标水平；只有 $100M 公开代理指标有来源支持。
    claimRefs:
      - CV003
      - CV004
      - CV030
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支撑的是较宽的情景区间，而不是一个精确估值。
    data:
      items:
        - label: 熊市情景隐含公允价值
          low: 800
          high: 1200
          unit: USD millions
          note: 用量 / 利润率承压或信任冲击情景
        - label: 基准情景隐含公允价值
          low: 1600
          high: 2400
          unit: USD millions
          note: 靠增长消化当前估值
        - label: 牛市情景隐含公允价值
          low: 3500
          high: 5000
          unit: USD millions
          note: 平台控制、高增长情景
    approximationNotes: 情景估值区间是承销判断，不是市场报价或管理层指引。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Persona 在市场和客户验证上得分最高，经济性、风险控制和估值证据较弱。
    data:
      items:
        - label: 市场顺风
          value: 8
          unit: /10
          note: 欺诈防控和 AI 身份需求
        - label: 产品 / 平台验证
          value: 7
          unit: /10
          note: 可配置身份层叙事
        - label: 客户 / 规模验证
          value: 7
          unit: /10
          note: $100M 公开代理指标和企业客户画像
        - label: 经济性验证
          value: 4
          unit: /10
          note: 毛利率、NRR 和现金消耗未公开
        - label: 风险控制验证
          value: 4
          unit: /10
          note: 2026 年负面报道和法律不透明
        - label: 估值纪律
          value: 5
          unit: /10
          note: 按当前价格看公允到偏紧
        - label: 证据质量
          value: 5
          unit: /10
          note: 融资证据强，私有财务数据弱
    approximationNotes: KPI 得分是分析师判断，锚定已引用证据和缺口。
    claimRefs:
      - CV008
      - CV027
      - CV038
      - CV039
      - CV043
      - CV044
