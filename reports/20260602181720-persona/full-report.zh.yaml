      - CV030
  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 财务证据缺失
        - NDA 下仍没有经审计的 ARR / 收入、NRR、毛利率、烧钱速度或集中度数据
        - 无法验证价格或退出就绪度
        - 不买入；仅保持观察
      - - 倍数压缩
        - 上市身份 / 欺诈可比公司重置到显著低于假设私募溢价
        - 退出倍数和后期估值标记变脆弱
        - 重新谈判入场价格，或要求结构保护
      - - 信任冲击
        - 2026 年争议导致已确认客户流失、监管行动或重大准备金
        - 增长、法律成本和采购信心同时受击
        - 回避或要求大幅折价
      - - 利润率不达预期
        - 验证 / 数据成本让毛利率显著低于软件基准
        - 收入倍数必须向服务 / 用量经济性压缩
        - 按毛利润倍数重新定价
      - - 客户集中度
        - 头部客户或前 10 大客户占比显著集中，且没有耐久合同
        - 收入质量和退出就绪度下降
        - 要求留存契约或降低价格
      - - 优先权拖累
        - 既有优先权或新条款损害普通股上行
        - 名义估值夸大投资人经济回报
        - 推进前先建模完全稀释后回报
    notes: 触发项是会改变估值的尽调阈值，不是失败预测。
    claimRefs:
      - CV024
      - CV027
      - CV033
      - CV034
      - CV040
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - ARR / 收入质量
        - 经审计 ARR、确认收入、承诺收入与用量收入、队列扩张
        - 决定 20x 代理倍数是否合理
        - 复核审计报表和 ARR 桥
      - - 利润率 / 单位经济性
        - 按产品划分毛利率、数据转嫁成本、支持和人工复核成本
        - 决定适用软件倍数还是用量服务倍数
        - 索取产品级毛利润瀑布图
      - - 留存 / 集中度
        - NRR、GRR、流失、头部客户和前 10 大客户占比
        - 决定耐久性和退出就绪度
        - 队列表加客户访谈
      - - 法律 / 隐私准备金
        - BIPA、隐私、事件、保险和准备金明细
        - 量化联动的信任风险
        - 法律顾问复核和董事会准备金材料
      - - 安全 / 事件历史
        - 事件日志、渗透测试、SOC 报告和 2026 年争议影响
        - 决定采购信任和下行冲击风险
        - 安全尽调和客户流失分析
      - - 股权结构表 / 优先权
        - 优先股堆叠、期权池、债务和备考稀释
        - 决定名义估值之外的投资人回报
        - 股权结构模型和条款清单复核
      - - 退出就绪度
        - 审计就绪度、董事会治理、上市公司控制和报告节奏
        - 决定 IPO 或战略收购可行性
        - CFO / 财务主管访谈和就绪度清单
    notes: 尽调要求聚焦对价格至关重要的私有证据；公开来源无法补齐这些缺口。
    claimRefs:
      - CV034
      - CV035
      - CV037
      - CV040
      - CV041
      - CV045
