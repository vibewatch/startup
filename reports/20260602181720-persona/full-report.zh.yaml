      - number: '3.2'
        title: 直接同业画像与逐赛道强项
        blocks:
          - type: paragraph
            body: >-
              被点名的直接竞争者各有可信切入点。Jumio 是成熟的证件 / 活体和 KYX 竞争者，公开声称具备全球 ID 支持、可配置工作流、风险评分、分析和 KYC/AML。Entrust IDV/Onfido
              在收购后带来企业规模，包括 Onfido 披露的收入、员工和客户基础，但也带来 BIPA 诉讼中的生物识别同意尽调。抓取证据中，Socure 是最强的美国合成欺诈专家，其客户和银行渗透声称得到 Thomson
              Reuters 合作伙伴文章印证。LexisNexis 通过 ThreatMetrix 和筛查资产构成现有数据网络替代。Trulioo 是全球 KYC/KYB 数据检查竞争者。Stripe Identity
              范围更窄但危险，因为 Stripe 原生买方可以在支付和付款已经发生的地方加入身份能力。实际结果是一片分赛道战场：每个竞争者都能可信赢下某条具体赛道，因此 Persona
              的负担是证明跨赛道控制和运营杠杆，而不只是列出更多模块。
