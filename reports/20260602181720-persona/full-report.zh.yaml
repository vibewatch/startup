      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方证据分成不同采用路径。金融机构由合规、欺诈、风险、入驻和数字银行负责人牵头采购；用户是运营分析师，以及流经 KYC/KYB
              的申请人。市场平台和零工经济客户会在信任安全团队需要验证快递员、代购员、租户、卖家或商户且不伤害转化时采购。KYB
              把验证对象从个人转向企业、受益所有人和代表，把付款方地图扩大到商户入驻和业务风险团队。年龄受限平台有单独合规触发点，因为年龄阈值、保护隐私的验证和在线安全义务正在成为明确监管议题。Persona 的 Cases
              和 Graph 页面也解释了为什么买方地图会从初始 ID 检查延伸到复核队列和网络分析。分层还说明，单一销售动作不太可能覆盖全部机会：合规团队买可审计性，信任安全团队买吞吐量，欺诈团队买损失下降。
