        - 企业合同打包
        - 未披露独立价格
        - 监管行业买方愿为信任付溢价
        - 支持与合规成本占 ARR 的比例
    notes: 公开来源披露机制和部分规模信号，但不披露收入结构或按产品确认的收入； 标为“未知”的单元格需要管理层数据。
