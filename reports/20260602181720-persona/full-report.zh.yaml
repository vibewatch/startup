        - 询问证件 / 活体 / AML 套餐，以及逐国覆盖定价
      - - Entrust IDV / Onfido
        - 表单获客型企业 IDV 页面，加收购公告
        - 条款未披露；暗示企业级打包
        - 受监管企业和政府级买方大概率走 RFP
        - 询问 Onfido 旧模块、Entrust 套餐和 BIPA 同意控制
      - - Socure
