  - id: FU002
    title: 直营与伙伴 GTM 分发漏斗
    type: funnel
    layout: standard
    summary: 获客可通过企业直销证据、市场集成、可复用身份合作和政府渠道推进。
    data:
      items:
        - label: 直销企业案例
