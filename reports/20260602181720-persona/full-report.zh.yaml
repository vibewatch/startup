companyProfile:
  summary: >-
    Persona 是一家总部位于 San Francisco 的非上市身份验证与身份编排平台，服务受监管和高规模业务。其公开产品覆盖身份验证、KYC/AML、KYB、年龄保障、工作流、案件复核、图谱分析、API 和
    SDK；客户证据显示，Persona 已落地于 AI 安全、金融科技、市场平台、通信、医疗、教育和公共部门渠道。公司公开牵引信号强，包括每年超过 300 million 次验证、超过 4,000 家企业客户，以及估值 $2
    billion 的 $200 million Series D；但投资判断仍受私有财务、客户集中度、治理、法律准备金和安全 / 隐私证据缺口限制。
