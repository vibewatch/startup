  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价证据
        blocks:
          - type: paragraph
            body: >-
              Persona 的公开证据支持一种使用量加平台的混合模型，而不是干净的 SaaS 席位模型。公司销售验证类型、工作流、图谱调查、Cases、API 和面向合规的身份流程；其自有定价页称按量定价，Vendr
              则描述按验证类型、月度量、承诺量和工作流复杂度计费的消耗定价。因此，披露合同价值比标价更适合作为公开代理指标。公开定价锚点仍不完整：Forbes 和 Trust Swiftly 都指向 $250
              的月度起价或最低水平，但企业经济性很可能落在年度承诺上，视量而定可从数万美元到超过
              $500,000。关键投资判断区别在于，标价不是实际收入，实际收入也不是毛利，因为数据库、生物识别、活体、支持、复核、合规和云成本并未披露。
