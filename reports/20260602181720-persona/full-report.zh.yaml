  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先划市场边界，再谈 TAM
        blocks:
          - type: paragraph
            body: >-
              Persona 的市场应围绕企业验证工作流定义，而不是整个数字身份宇宙。纳入的池子包括 KYC/KYB、AML 工作流支持、证件和数据库验证、自拍 /
              活体检测、年龄保障、案件复核和链接分析式欺诈运营。排除的池子同样重要：通用 IAM、无密码认证、政府钱包发行、通用网络安全，以及在入驻或欺诈工作流之外销售的征信局数据，都会在不匹配 Persona
              公开产品证据的情况下虚增
              TAM。客户证明也显示，现状不是电子表格里的抽象项。杂货、快递、金融科技和市场平台案例把人工复核、无法扩展的流程、欺诈暴露和用户转化压力描述为真正要替代的对象。估值层面，这意味着市场有吸引力，但投资判断必须落在工作流特定的合规和欺诈支出上，而不是所有数字身份支出。这个边界也保护后续竞争分析：一家供应商可以在
              KYC 或 KYB 中位置很好，但对市场报告有时捆进数字身份的更大钱包、IAM 或网络安全池子仍然暴露有限。
