    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              Persona 更应被看作一家非上市的已验证身份基础设施公司，而不是狭义的证件核验供应商。其官方界面描述的是模块化构件，覆盖验证、防欺诈、工作流、案件复核、图谱分析，以及横跨
              KYC、KYB、AML、劳动力验证、年龄保障和账号找回的编排能力。最新公开阶段标记是 Series D：Persona 2025 年 4 月 30 日宣布融资 $200 million，估值 $2
              billion，独立金融媒体也印证了金额和估值。封面层面，可支撑的产品线是企业身份验证与编排，可支撑阶段是后期私有风投公司；当前
              ARR、利润率、烧钱速度、现金跑道和员工数没有支撑。因此本章把可复用的底层事实和尽调问题拆开：后续章节可以引用已核实的公司身份、融资和客户规模事实；财务质量、治理、员工数和事故严重性则要等私有文件审阅后再关闭。
