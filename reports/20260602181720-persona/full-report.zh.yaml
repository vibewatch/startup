  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 投资判断视角：信任是风险乘数
        blocks:
          - type: paragraph
            body: >-
              Persona 的风险画像不是一组彼此独立的问题，而是信任集中问题。公司为客户处理身份证件、自拍、设备信号、观察名单检查和工作流决策，而这些客户往往出于监管、欺诈或年龄保障原因必须避免出错。当监管和 AI
              驱动欺诈迫使买方验证更多用户时，这形成强增长逻辑；但它也意味着隐私诉讼、安全争议、高知名度客户回撤或薄弱留存控制，都可能迅速传导到收入质量和估值。本章因此按剩余投资判断影响排序风险，而不是按头条噪音排序。关键点是，FedRAMP、安全控制和已发布隐私政策都是有意义的缓释项；但未解决问题——客户级配置、BIPA
              同意证据、客户集中度、治理控制和已审计财务指标——仍是把 $2 billion 估值承保为持久估值前的尽调关口。
