      - number: '3.4'
        title: Persona 在哪里赢、谁会打败它、尽调什么
        blocks:
          - type: paragraph
            body: >-
              当买方想要一层可配置身份层，横跨证件检查、数据库检查、KYB、制裁 / 负面媒体、工作流、案件处理和图谱调查时，Persona 会赢。当任务更窄，或竞争者的赛道优势占主导时，Persona 会输。Stripe
              可以在支付相邻的简单身份检查和采购摩擦上击败 Persona。Socure 和 LexisNexis 可以在决定变量是合成欺诈或现有数据网络深度时击败它。Trulioo 可以在全球数据源匹配覆盖或跨司法辖区
              KYB 是核心任务时击败它。Jumio 和 Entrust 可以在买方过度看重成熟证件 / 活体证明、企业 IDV 参考或母公司分发时击败它。尽调问题是，Persona
              在客户栈中究竟是主决策层，还是包在第三方数据检查外面的昂贵编排外壳。公开证据支持差异化，但还没有证明胜率、误报改善、匹配率优势或实际净价。应按细分场景索取这些证据，因为 Stripe
              原生市场平台、前五大银行、跨境金融科技公司和年龄受限消费平台，不会用同一套权重看切换成本或差异化主张。
