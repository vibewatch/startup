        title: 开发者体验：API 面宽、公开规格和 SDK 齐全，但源码可审计性有限
        blocks:
          - type: paragraph
            body: >-
              Persona 的集成模型以 API 为先，并提供多种用户体验选项。文档暴露了运营基础——API key、认证、幂等、分页、限流、日志、请求 ID 和版本管理——并把
              accounts、cases、devices、documents、events、graph、inquiries、reports、transactions、verifications、webhooks 和
              workflows 作为一等资源。Inquiries 处理终端用户验证生命周期，Transactions 提供实体 / 工作流建模和生物识别编辑动作。Webhooks 覆盖
              account、case、document、graph、inquiry、selfie、verification 和 workflow 事件。前端集成方面，Persona 记录了托管流程、移动 SDK 和
              React 绑定。公开开发者信号有意义但不深：Persona 维护 OpenAPI 3.1.0 仓库和演示移动 SDK 仓库，已归档的 persona-react
              包也曾显示可观周下载量。但这些界面是集成产物，不是核心验证引擎，因此外部可审计性仍有限。
