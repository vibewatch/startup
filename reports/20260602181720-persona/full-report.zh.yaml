            body: >-
              最好的公开收入信号，是 Persona 自己的 2024 年运营披露与 Forbes 2025 年 4 月独立画像的组合。Persona 称其 2024 年处理超过 300 million
              次验证，收入和客户数量同比翻倍；Forbes 报道其服务超过 4,000 家企业，并有 $100 million 的年度合同额。这些是有意义的规模信号，但不是已审计
              ARR、确认收入、毛利率或净留存。OpenAI、Brex、Square、Branch、Outdoorsy 和一家杂货技术平台的客户证明，展示了高量和高合规用例，身份检查可以反复发生并嵌入运营。当 Persona
              是控制后续动作的政策 / 工作流层，而不仅是可替换的证件检查时，收入质量看起来更好。但集中度、承诺收入与基于使用量收入的比例、扩张率、流失和净美元留存仍属私有信息。
