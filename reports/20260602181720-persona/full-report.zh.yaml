      - number: '2.4'
        title: 增长驱动、约束与采用节奏
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动是监管、欺诈损失和运营杠杆。FATF 和 NIST 让身份核验和客户识别与审计相关；European Commission 的年龄验证工作把受监管身份需求从金融服务扩展出去；Federal
              Reserve、FTC 和 LexisNexis 的证据显示，欺诈和合成身份仍是活跃的预算理由。Persona 通过
              KYC/KYB、年龄验证、案件管理、图谱分析，以及自动化或减少欺诈作为价值主张的客户案例，对应这些驱动。约束同样重大：隐私和生物识别审查、误报、集成成本、供应商风险审查，以及钱包或 mDL
              替代，都可能拖慢采用或压缩定价。因此采用路径不是线性吃掉 TAM。买方从风险触发出发，进入政策设计、数据采集、自动检查、人工例外、图谱升级和定期监控；价值集中在 Persona
              能减少损失或复核人力的地方。这些约束影响采用节奏，因为监管最重的买方可能支付意愿最高，但采购、安全、法律和模型治理审查周期也最长。
