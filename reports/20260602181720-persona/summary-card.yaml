summary:
  headline: >-
    Track Persona: it is a scaled, strategically relevant identity platform, but the $2B Series D valuation is stretched
    on public evidence until private ARR, retention, margin, concentration, legal-reserve, and cap-table diligence
    support it.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 2000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: 100
