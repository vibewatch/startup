    nrrPct: null
    totalRaisedUsdM: 417
    customerCount: 4000
    headcount: null
  topStrengths:
    - >-
      More than 300 million annual verifications and more than 4,000 enterprise businesses indicate substantial public
      scale.
    - >-
      Broad platform breadth across IDV, KYC/KYB, AML, Workflows, Cases, Graph, APIs, SDKs, age assurance, and
      orchestration supports differentiation beyond point document checks.
    - >-
      Named customer proof across OpenAI, Brex, Coursera, Twilio, Lime, Branch, Dakota, healthcare, and public-sector
      channels validates diverse production use cases.
    - >-
      $200 million Series D co-led by Founders Fund and Ribbit Capital provides a strong late-stage capital and
      investor-quality signal.
    - >-
      Security and compliance posture includes SOC 2 claims and FedRAMP Moderate authorization for Persona for
      Government.
  topRisks:
    - >-
      Audited ARR, recognized revenue, gross margin, NRR, burn, runway, and customer concentration are private, limiting
      valuation underwriting.
    - >-
      The $2 billion valuation implies roughly 20x the public $100 million annual-contract proxy, leaving limited room
      for trust or growth setbacks.
    - >-
      Biometric/privacy litigation, age-assurance backlash, and disputed 2026 code-exposure or surveillance allegations
      can affect procurement, churn, reserves, and valuation multiples.
    - >-
      Competitive pressure from Jumio, Entrust/Onfido, Socure, LexisNexis, Trulioo, Stripe Identity, internal build, and
      status quo creates lane-specific substitution risk.
    - >-
      Governance, board composition, preference stack, liquidation preferences, and headcount were not fully disclosed
      in public sources.
  unresolvedGaps:
    - >-
      Audited ARR or recognized revenue bridge, cohort retention, NRR, gross margin by product, burn, runway, and
      revenue-quality proof.
    - >-
      Customer concentration, active customer count, contract durability, renewal cohorts, reference calls, and
      post-controversy churn or pipeline impact.
    - >-
      Legal reserves, insurance coverage, BIPA exposure, consent and retention evidence, deletion logs, and customer
      contract allocation of privacy responsibilities.
    - >-
      Security incident history, 2026 code-exposure postmortem, subprocessor-by-customer mappings,
      accuracy/false-positive benchmarks, and workflow audit controls.
    - >-
      Full cap table, option pool, preference stack, investor rights, board composition, governance controls, and
      downside protections for any new entry.
