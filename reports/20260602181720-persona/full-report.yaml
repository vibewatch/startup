            body: >-
              Public information gives hints, not a full unit-economics model. The numerator can be approximated only
              very roughly: if Forbes' $100 million of annual contracts and Persona's more than 300 million 2024
              verifications were comparable same-period measures, the sanity-check bookings per verification would be
              about $0.33; that estimate is fragile because the contract figure may include platform fees, minimums,
              multi-product bundles, and timing differences. The denominator is even less public. Persona's product
              breadth implies cloud, data-source, liveness, document AI, compliance, security, support,
              customer-success, and manual-review costs. Its Cases, Workflows, Graph, and API surfaces can improve
              operating leverage by automating routine review and consolidating data, but none of the retained sources
              disclose gross margin, false-positive cost, manual-review share, or support cost per verification.
