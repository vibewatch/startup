            body: >-
              The adverse record is material for financial diligence because privacy, biometrics, and age-assurance
              scrutiny can affect enterprise procurement, legal reserves, insurance, compliance staffing, and customer
              retention. The Justia-cited Illinois appellate opinion revived plaintiffs' ability to pursue
              biometric-privacy claims rather than forcing arbitration. Malwarebytes, Cybernews, and Biometric Update
              each reported 2026 scrutiny of exposed frontend or surveillance-check allegations, while Malwarebytes also
              included Persona's response that the environment was isolated, no personal data was exposed, no customer
              used all 269 checks, and customers control data handling. The financial conclusion is therefore balanced:
              the public evidence supports strong demand and scaled usage, but it does not prove durable margins or low
              risk-adjusted CAC. The diligence plan should request audited financials, cohort ARR, realized pricing by
              verification type, data pass-through costs, manual-review rates, customer concentration, privacy/legal
