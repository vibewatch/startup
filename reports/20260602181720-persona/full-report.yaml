  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Underwriting view: trust is the risk multiplier'
        blocks:
          - type: paragraph
            body: >-
              Persona’s risk profile is not a collection of independent issues; it is a trust-concentration problem. The
              company handles identity documents, selfies, device signals, watchlist checks and workflow decisions for
              customers that often have regulatory, fraud or age-assurance reasons to avoid mistakes. That creates a
              powerful growth thesis when regulation and AI-driven fraud force buyers to verify more users, but it also
              means privacy litigation, a security controversy, a high-profile customer rollback or weak retention
              controls can transmit quickly into revenue quality and valuation. The chapter therefore ranks risk by
              residual underwriting impact, not by headline noise. The key point is that FedRAMP, security controls and
              published privacy policies are meaningful mitigants, while the unresolved issues—customer-level
              configuration, BIPA consent evidence, customer concentration, governance controls and audited financial
              metrics—remain diligence gates before underwriting the $2 billion valuation as durable.
            claimRefs:
              - CR001
              - CR004
