      - number: '8.3'
        title: Comparable-company and market context
        blocks:
          - type: paragraph
            body: >-
              The public comp set is informative but imperfect. Mitek gives the closest pure public identity/fraud
              anchor, while GBG provides an identity-data and fraud benchmark, Experian represents a scaled data-network
              quality ceiling, and NICE provides an adjacent financial-crime analytics platform reference. None is a
              clean proxy for Persona because they differ in public-company maturity, margin disclosure, segment mix,
              growth, scale, and diversification. Private identity rounds add another lens: Socure and Veriff show that
              venture investors have paid billion-dollar valuations for identity-fraud and IDV assets, but those rounds
              were struck in different market windows and do not prove 2026 exit multiples. The comp conclusion is a
              range, not a point: Persona can deserve a premium if growth and margins are strong, but a 20x public proxy
              multiple needs proof.
