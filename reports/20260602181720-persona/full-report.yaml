      - number: '2.4'
        title: Growth drivers, constraints, and adoption timing
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are regulation, fraud losses, and operational leverage. FATF and NIST make
              identity proofing and customer identification audit-relevant; the European Commission's age-verification
              work expands regulated identity needs beyond financial services; Federal Reserve, FTC, and LexisNexis
              evidence shows fraud and synthetic identities remain live budget justifications. Persona maps to those
              drivers through KYC/KYB, age verification, case management, graph analysis, and customer examples where
              automation or fraud reduction is the value proposition. Constraints are material: privacy and biometric
              scrutiny, false positives, integration costs, vendor-risk review, and wallet or mDL substitution can slow
              adoption or compress pricing. The adoption path is therefore not linear TAM capture. Buyers move from a
              risk trigger to policy design, data capture, automated checks, manual exceptions, graph escalation, and
              periodic monitoring, with value concentrated where Persona reduces losses or review labor. These
              constraints matter for adoption timing because the most regulated buyers may have the highest willingness
              to pay but also the longest procurement, security, legal, and model-governance review cycles.
