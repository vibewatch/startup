            body: >-
              The most differentiated public layer is orchestration. Persona Workflows combines a no-code drag-and-drop
              editor with custom-code paths, and the company says rules can approve, deny or flag users while preserving
              an audit trail. Cases and Graph extend this into operations: Cases is positioned as a manual-review and
              compliance hub that consolidates active, passive and behavioral signals, while Graph adds link analysis to
              find connected accounts, patterns and fraud rings. This matters because identity vendors often compete on
              data-source coverage, but customers usually win or lose on routing: which users get friction, which edge
              cases go to review, when a business entity requires enhanced due diligence, and how suspicious activity
              gets escalated. Persona’s public evidence supports an orchestration moat, but not a fully measured one;
              the key missing diligence items are rule-latency data, model/agent performance, false-link rates and
              evidence that customers can version, test and audit complex workflow changes safely.
