      - number: '3.2'
        title: Direct peer profiles and lane-by-lane strengths
        blocks:
          - type: paragraph
            body: >-
              The named direct competitors each have a credible wedge. Jumio is the mature document/liveness and KYX
              competitor, with public claims around global ID support, configurable workflows, risk scoring, analytics,
              and KYC/AML. Entrust IDV/Onfido brings enterprise scale after the acquisition, including Onfido's reported
              revenue, employees, and customer base, but also biometric-consent diligence from BIPA litigation. Socure
              is the strongest U.S. synthetic-fraud specialist in the fetched evidence, with customer and bank
              penetration claims corroborated by a Thomson Reuters partnership post. LexisNexis is the incumbent
              data-network substitute through ThreatMetrix and screening assets. Trulioo is the global KYC/KYB
              data-check competitor. Stripe Identity is narrower but dangerous because Stripe-native buyers can add
              identity where payments and payouts already live. The practical result is a segmented battlefield: each
              competitor can credibly win a specific lane, so Persona's burden is to prove cross-lane control and
              operating leverage rather than simply to list more modules.
