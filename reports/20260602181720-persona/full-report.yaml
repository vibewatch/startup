  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product stack: modular identity infrastructure rather than a point verifier'
        blocks:
          - type: paragraph
            body: >-
              Persona’s product stack is best understood as a modular identity operating system rather than a single KYC
              widget. The public platform page frames Persona as configurable infrastructure for identity verification,
              KYC/AML, KYB, age assurance and adjacent identity operations. Under that umbrella, the publicly visible
              modules include government-ID verification, authoritative database checks, selfie/liveness, AML/KYC
              screening, adverse media, business onboarding, Workflows, Cases, Graph, APIs, SDKs and webhooks. The
              technical differentiation is therefore breadth plus orchestration: customers can assemble different
              verification primitives, risk signals, review steps and retention choices into workflows. That is valuable
              for regulated fintech, marketplaces, education and age-gated consumer products because identity
              requirements vary by geography, risk tier and user journey. The diligence caveat is that Persona publishes
              product capability claims but not independent accuracy, false-positive, fraud-loss or demographic-bias
              benchmarks for each module.
