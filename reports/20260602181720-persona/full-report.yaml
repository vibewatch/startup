      - number: '8.4'
        title: Bull, base, bear and return logic
        blocks:
          - type: paragraph
            body: >-
              The bull case requires more than funding momentum. Persona must show that the public $100 million revenue
              proxy understates current scale, that workflow and graph modules carry software-like gross margins, and
              that customers treat Persona as a system of record for identity decisions. The base case is less heroic:
              Persona grows into the $2 billion valuation over time, but current entry is not obviously mispriced
              because material metrics are private. The bear case is a trust-and-multiple compression story: weak gross
              margin, customer concentration, slowing enterprise growth, or a validated adverse privacy/security event
              could force a down-round or strategic sale below the headline mark. The most disciplined approach is to
              probability-weight scenarios and demand price protection where private data cannot close the gaps.
            claimRefs:
