  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Biometric litigation
        - Adverse ruling, settlement or new class action
        - Material uncapped exposure or failed consent control
        - Reprice or pause pending reserves and remediation
      - - Security incident
        - Confirmed production exposure of IDs, selfies or biometric templates
        - Any material production-data exposure
        - Thesis break unless independently scoped and remediated
      - - Age-assurance backlash
        - Platform rollback or public vendor termination
        - Two or more high-profile rollbacks in 12 months
        - Cut growth multiple and demand proof of UX redesign
      - - Customer concentration
        - Top-customer or top-10 share
        - Top customer >15% or top 10 >50% of ARR without multi-year contracts
        - Require lower entry price or stronger downside protection
      - - Financial opacity
        - ARR, margin, burn, NRR unavailable in diligence
        - Company cannot provide board-approved metrics
        - Do not underwrite late-stage valuation
      - - Regulatory tailwind reversal
        - State/federal rules restrict centralized biometric verification
        - Material reduction in addressable regulated workflows
        - Rebuild TAM and growth case
      - - Governance controls
        - No board-level risk owner or insurance disclosure
        - No accountable privacy/security governance forum
        - Condition investment on governance buildout
      - - Mitigation maturity
        - Consent, deletion, audit and appeal controls
        - Controls cannot be demonstrated from customer samples
        - Treat risk as high residual exposure
