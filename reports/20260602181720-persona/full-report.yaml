      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final diligence list is valuation-critical, not administrative. Management must provide audited
              revenue or ARR bridges, cohort retention, gross margin by product, verification/data pass-through cost,
              burn, runway, customer concentration, legal reserves, incident history, insurance, and the full preference
              stack. The absence of those items should block a buy recommendation at the current valuation because it
              prevents an investor from separating durable platform economics from capitalized narrative. Exit readiness
              is similarly conditional: an IPO or strategic acquisition path exists only if Persona can show
              public-company-grade reporting, customer diversification, and mature trust governance. Thesis breaks
              include inability to provide private metrics under NDA, confirmed churn from adverse 2026 controversy,
              material unreserved litigation exposure, or a cap table that leaves new investors with inadequate downside
              protection.
            claimRefs:
