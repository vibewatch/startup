      - number: '7.5'
        title: Governance, valuation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The valuation risk is straightforward: a $2 billion late-stage private valuation is underwriting future
              trust at scale while audited metrics remain unavailable. Public evidence gives financing, customer and
              verification-count signals, but not ARR quality, gross margin, burn, runway, net revenue retention,
              customer concentration, litigation reserves, board risk ownership or insurance limits. That opacity
              matters because the largest risks are correlated. A confirmed production data exposure, adverse BIPA
              ruling, unreserved class-action settlement, high-profile vendor termination, or regulatory restriction on
              biometric retention would hit legal cost, customer trust, growth and multiple at once. The investable path
              is therefore a conditional one: proceed only if diligence proves mature privacy controls, security
              operations, customer diversification, risk governance and financial durability; otherwise the correct
              stance is to price the company as a regulation-dependent and controversy-sensitive execution story.
