  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation logic
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bull
        - ARR materially above public proxy, 40%+ growth, high NRR, software-like gross margin, low legal drag
        - Premium private multiple can be justified; $2B looks fair-to-attractive if revenue scales rapidly
        - Requires management proof of ARR, NRR, gross margin and churn
        - Upside if identity workflow layer becomes system of record
      - - Base
        - Public $100M proxy grows, but margins and concentration remain unknown
        - Current valuation is fair-to-stretched; return depends on growth into the price
        - Public evidence supports quality but not precision
        - Hold/track until private metrics de-risk the model
      - - Bear
        - Growth slows, usage margins thin, privacy trust shock increases churn or legal cost
        - Down-round or impairment risk; $2B looks expensive
        - Adverse 2026 coverage and missing metrics keep probability non-trivial
        - Avoid or demand structure if legal/customer evidence is weak
      - - Exit-ready upside
        - Audited reporting, customer diversification and risk controls support IPO or strategic acquisition
        - Exit multiple can expand if public markets accept Persona as platform infrastructure
        - Requires public-company-grade reporting discipline
        - IPO readiness proven by audited metrics and controls
      - - Structured entry
        - Round terms provide downside protection and cap-table transparency
        - Investor can accept current headline valuation with preference/dilution safeguards
        - Depends on private cap table and legal reserves
        - Proceed only with price protection
    notes: >-
      Scenario ranges are qualitative because public sources do not disclose audited ARR, margin, burn, NRR or cap-table
      structure.
