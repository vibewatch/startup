      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The sizing evidence supports a three-layer view. A broad TAM lens can use digital-identity solutions
              estimates near $55-$57B in 2026, but that layer is an upper boundary because it includes identity
              infrastructure beyond Persona's apparent scope. A narrower SAM lens is better anchored by
              identity-verification estimates: MarketsandMarkets reports $14.34B in 2025 and $29.32B by 2030, while
              IMARC reports $15.8B in 2025 and $50.2B by 2034. Those ranges are directionally consistent on double-digit
              growth but inconsistent on category boundary and forecast horizon. SOM should not be invented from public
              data. Persona discloses public verification and customer-scale headlines in other chapters, but not
              current ARR, pricing, workflow mix, retention, geographic revenue, or customer concentration. The chapter
              therefore preserves contradictory estimates and treats obtainable share as a diligence output, not a
              public-source fact. This is why the table and range figure use source labels rather than a single blended
              midpoint; the dispersion is a finding about market ambiguity, not a math problem to smooth away.
