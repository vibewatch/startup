      - number: '7.2'
        title: Regulatory, privacy and biometric litigation risk
        blocks:
          - type: paragraph
            body: >-
              The hardest legal risk is biometric privacy, not generic data protection. BIPA requires retention policies
              and written informed consent, and Persona has already appeared in litigation alleging facial-geometry
              collection in DoorDash and Sonder-related workflows. Washington matters because the appellate court
              refused to let Persona compel arbitration through a customer contract, weakening a common vendor-defense
              path. The 2026 age-verification wave is a double-edged catalyst: it can expand demand for identity
              vendors, while simultaneously increasing the number of adults asked to submit IDs, selfies or age signals
              and therefore the number of people motivated to challenge retention, consent and surveillance practices.
              The underwriting implication is to reserve upside for regulatory-driven demand only after reviewing
              consent flows, data-processing terms, customer-configured retention policies, deletion logs, litigation
              insurance and reserves.
            claimRefs:
              - CR005
