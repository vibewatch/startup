      - number: '3.4'
        title: Where Persona wins, who beats it, and what to diligence
        blocks:
          - type: paragraph
            body: >-
              Persona wins where the buyer wants one configurable identity layer spanning document checks, database
              checks, KYB, sanctions/adverse media, workflows, case handling, and graph investigation. It loses when the
              job is narrower or the competitor's lane advantage dominates. Stripe can beat Persona on simple
              payment-adjacent identity checks and procurement friction. Socure and LexisNexis can beat it when the
              deciding variable is synthetic-fraud or incumbent data-network depth. Trulioo can beat it when global
              data-source match coverage or KYB across jurisdictions is the primary job. Jumio and Entrust can beat it
              when the buyer overweights mature document/liveness proof, enterprise IDV references, or parent-company
              distribution. The diligence question is whether Persona is the primary decisioning layer in customer
              stacks or an expensive orchestration wrapper around third-party data checks. Public evidence supports
              differentiation, but it does not yet prove win rates, false-positive lift, match-rate superiority, or
              realized net pricing. That evidence should be requested by segment, because a Stripe-native marketplace, a
              top-five bank, a cross-border fintech, and an age-restricted consumer platform will not weight the same
              switching costs or differentiation claims.
            claimRefs:
              - CP029
              - CP030
