      - number: '3.3'
        title: Pricing, packaging, multi-homing, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence points to enterprise opacity rather than clean list-price comparability. Persona's
              own page says volume-based pricing, and Vendr describes consumption pricing driven by verification type,
              volume, workflows, and commitments. Jumio and Socure show the same pattern through procurement benchmarks,
              while Entrust, LexisNexis, and Trulioo require quote validation for exact bundles. Stripe is the clearest
              procurement baseline because its pricing surfaces emphasize pay-as-you-go platform packaging and the
              Identity page offers the first 50 verifications free. That transparency creates pressure on simple use
              cases. Switching costs are real but not absolute: API/SDK work, tuned policy logic, case-review
              operations, audit trails, data-source bundles, and conversion-rate risk make replacement painful, yet
              buyers can still multi-home by routing low-risk users to cheaper checks and reserving Persona for complex
              KYB, graph, sanctions, or exception workflows. The diligence implication is to separate list pricing,
              realized net pricing, pass-through data costs, and services costs; otherwise Persona may appear more or
              less defensible than the actual customer contract economics support.
