  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence support
      - What would change the view
    rows:
      - - 'Thesis: identity trust layer'
        - Persona positions itself as the verified identity layer for AI-era fraud and has top-tier late-stage backers
        - Upgrade if customers show Persona controls identity workflows rather than a replaceable check
      - - 'Thesis: demand tailwind'
        - 2026 fraud-threat reports support urgency around synthetic fraud and verification
        - Upgrade if demand converts into high-retention ARR with strong margins
      - - 'Thesis: scaled enterprise proof'
        - Forbes profile and round coverage support meaningful customer and annual-contract scale
        - Upgrade if audited ARR, NRR and concentration are disclosed
      - - 'Anti-thesis: expensive proxy multiple'
        - Roughly 20x the public $100M revenue/contract proxy is demanding versus many public comps
        - Downgrade if growth decelerates or public multiples compress
      - - 'Anti-thesis: opacity'
        - ARR quality, margin, burn, customer concentration and preference stack remain private
        - Do not buy without private evidence under NDA
      - - 'Anti-thesis: trust shock'
        - 2026 adverse security/surveillance coverage can damage procurement confidence
        - Downgrade if confirmed churn, regulatory action or litigation reserves emerge
    notes: Arguments are decision drivers; missing private data is treated as a material limitation rather than a zero value.
