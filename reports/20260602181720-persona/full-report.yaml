  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Persona is a high-quality but price-sensitive late-stage identity-verification asset. The clean public
              anchor is the 2025 Series D: $200 million raised at a $2 billion valuation, corroborated by company and
              independent coverage. The public revenue-quality anchor is weaker: Forbes reported a $100 million
              annual-contract or ARR-style signal, but audited ARR, recognized revenue, NRR, gross margin, burn,
              customer concentration, and cap-table preferences remain private. A simple comparison of the $2 billion
              valuation with the $100 million proxy implies roughly 20x, which is plausible for a fast-growing identity
              platform but not cheap enough to ignore execution and trust risk. The correct stance is therefore track /
              research-more rather than buy: Persona may justify the valuation with private proof, but public evidence
              alone makes the price fair-to-stretched.
            claimRefs:
              - CV001
