            body: >-
              Persona’s main product-tech risks are not absence of capability; they are transparency, trust and proof.
              Public pages show a broad and configurable platform, but key operating metrics are private: accuracy by
              document and demographic cohort, liveness attack performance, sanctions false positives, graph-link
              precision, workflow latency, customer conversion lift, SLA terms and subprocessor-by-customer mapping. The
              2026 exposed-frontend reporting intensified this trust gap. Malwarebytes reported 2,456 accessible files
              in an isolated testing environment and included Persona’s clarification that no personal data was exposed
              and the environment was not production; Cybernews and State of Surveillance nevertheless framed the code
              as evidence of extensive surveillance and reporting capabilities; Biometric Update reported Discord’s
              short UK age-assurance test ended with Persona no longer an active vendor. Separately, Washington v.
              Persona shows biometric-privacy litigation risk around BIPA. For investors, Persona looks technically
