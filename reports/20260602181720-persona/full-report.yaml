      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Persona can become an embedded identity decisioning layer for an AI-era fraud market,
              not merely a point IDV vendor. That case is supported by investor quality, public scale signals, and a
              broader fraud-threat backdrop in 2026. The anti-thesis is that the same trust surface that makes Persona
              important also makes it fragile: privacy, biometric, surveillance, and security controversy can transmit
              into procurement friction, churn, legal cost, insurance cost, and multiple compression. The valuation
              debate is therefore not whether identity verification is strategically relevant; it is whether Persona
              captures enough high-margin workflow value and retains enough customer trust to merit a premium late-stage
              price. Without private unit economics and retention proof, the upside should remain conditional.
            claimRefs:
              - CV005
