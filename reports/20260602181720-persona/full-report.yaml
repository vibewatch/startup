        title: Customer proof and operating model
        blocks:
          - type: paragraph
            body: >-
              Customer proof shows Persona’s platform is embedded in regulated and high-scale workflows. The OpenAI case
              study says OpenAI screens millions monthly and automates 99% of screenings across more than 225 countries;
              older case studies show Square Capital using Persona for PPP verification, Brex for cash-management
