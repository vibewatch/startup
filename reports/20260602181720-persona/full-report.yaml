  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and substitution pattern
        blocks:
          - type: paragraph
            body: >-
              Persona's competitive set is broader than a list of document-verification vendors. The direct peer set
              includes Jumio, Entrust IDV/Onfido, Socure, LexisNexis Risk Solutions, Trulioo, and Stripe Identity
              because each can satisfy part of the same onboarding, compliance, fraud, or trust-and-safety job. Adjacent
              vendors such as Veriff, Sumsub, and SEON matter when buyers narrow the job to a cheaper IDV suite or
              broaden it to fraud signals before ID capture. The status quo and internal build also remain real
              alternatives: low-volume teams can keep manual review, while very large platforms with payment, risk, ML,
              and compliance infrastructure may build or route around third-party checks. Persona's win condition is
              therefore not simply that identity verification grows; it must become the buyer's configurable identity
              decisioning layer, not one interchangeable verification step. This framing matters because procurement
              does not happen at a category level: a compliance leader, fraud leader, trust-and-safety owner, and
              payments platform can each buy a different substitute while still describing the project as identity
              verification.
