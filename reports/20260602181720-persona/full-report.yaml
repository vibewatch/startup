      - number: '7.4'
        title: Customer, partner and operating-dependency risk
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is strong enough to validate demand but not strong enough to underwrite durability.
              OpenAI, Brex and Coursera show production use cases, and the Series D materials claim more than 3,000
              businesses and more than 300 million annual verifications; however, public sources do not disclose
              top-customer revenue share, renewal cohorts, contract terms, NRR or churn. Persona’s platform breadth also
              creates dependency risk: customers embed Persona APIs into onboarding, sanctions, fraud and age-assurance
              flows, while Persona depends on customer configuration to make retention and disclosure choices legally
              robust. Discord-related age-assurance backlash shows how quickly a platform can reconsider a vendor if end
              users perceive the verification flow as invasive. The mitigation is not a better logo slide; it is
              customer concentration data, cohort retention, reference calls, implementation-failure logs and
              contractual allocation of privacy responsibilities.
