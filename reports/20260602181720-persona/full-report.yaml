            body: >-
              The best public revenue signal is the combination of Persona's own 2024 operating disclosure and Forbes'
              independent April 2025 profile. Persona said it processed more than 300 million verifications in 2024 and
              doubled revenue and customer count year over year; Forbes reported more than 4,000 enterprise businesses
              and $100 million worth of annual contracts. Those are meaningful scale signals, but they are not audited
              ARR, recognized revenue, gross margin, or net retention. Customer proof from OpenAI, Brex, Square, Branch,
              Outdoorsy, and a grocery technology platform demonstrates high-volume and high-compliance use cases where
              identity checks can be recurring and operationally embedded. Revenue quality appears better when Persona
              is the policy/workflow layer that controls follow-up actions, not merely a replaceable document check.
