      - number: '7.3'
        title: Security, surveillance allegations and product-control risk
        blocks:
          - type: paragraph
            body: >-
              Persona has credible security mitigants: FedRAMP Moderate authorization, published security controls,
              encryption claims and technical documentation. But the risk chapter should not let those controls wash out
              the 2026 controversy. Cybernews and State of Surveillance alleged that exposed code showed surveillance
              and government-reporting capabilities, while Malwarebytes and Biometric Update reported Persona’s response
              that the exposed environment was isolated and no production or personal data was exposed. That makes the
              issue disputed, not dismissed. The product stack compounds the diligence burden because Workflows, Cases,
              Graph, watchlist reports, selfie verification and inquiry APIs create many decisioning and data-processing
              surfaces. Errors in screening logic, workflow configuration, graph linkage or manual review can become
              user exclusion, customer friction, false positives, privacy claims or reputational damage.
