  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              Persona's public evidence supports a hybrid usage-and-platform model, not a clean SaaS seat model. The
              company sells verification types, workflows, graph investigation, cases, APIs, and compliance-oriented
              identity processes; its own pricing page says volume-based pricing, while Vendr describes consumption
              pricing by verification type, monthly volume, commitments, and workflow complexity. That makes reported
              contract value a better public proxy than list price. Public pricing anchors are still incomplete: Forbes
              and Trust Swiftly both point to a $250 monthly starting or minimum level, but enterprise economics likely
              sit in annual commitments that can range from tens of thousands to more than $500,000 depending on volume.
              The key underwriting distinction is that list pricing is not realized revenue, and realized revenue is not
              gross profit because database, biometric, liveness, support, review, compliance, and cloud costs are not
              disclosed.
