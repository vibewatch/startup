  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary before TAM
        blocks:
          - type: paragraph
            body: >-
              Persona's market should be defined around enterprise verification workflows rather than the entire digital
              identity universe. The included pool is KYC/KYB, AML workflow support, document and database verification,
              selfie/liveness, age assurance, case review, and link-analysis fraud operations. The excluded pool is
              equally important: general IAM, passwordless authentication, government wallet issuance, generic
              cybersecurity, and credit-bureau data sold outside onboarding or fraud workflows would inflate TAM without
              matching Persona's public product evidence. Customer proof also shows the status quo is not a spreadsheet
              abstraction. Grocery, courier, fintech, and marketplace examples describe manual review, unscalable
              processes, fraud exposure, and user-conversion pressure as the actual displacement targets. For valuation,
              this means the market is attractive but must be underwritten as workflow-specific compliance and fraud
              spend, not all digital identity spend. The boundary also protects later competitive analysis: a vendor can
              be well positioned in KYC or KYB while still having limited exposure to the larger wallet, IAM, or
              cybersecurity pools that market reports sometimes bundle into digital identity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM040
              - CM041
