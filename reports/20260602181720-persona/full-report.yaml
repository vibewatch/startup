    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and stage
        blocks:
          - type: paragraph
            body: >-
              Persona is best treated as a private verified-identity infrastructure company rather than a narrow
              document-check vendor. Its official surfaces describe modular building blocks for verification, fraud
              prevention, workflows, case review, graph analysis, and orchestration across KYC, KYB, AML, workforce
              verification, age assurance, and account recovery. The latest public stage marker is Series D: Persona
              announced a $200 million financing on April 30, 2025 at a $2 billion valuation, with independent finance
              coverage corroborating the amount and valuation. For cover purposes, the supported product line is
              enterprise identity verification and orchestration, the supported stage is late-stage private venture, and
              the unsupported metrics are current ARR, margin, burn, runway, and headcount. This chapter therefore
              separates reusable ground truth from diligence asks: later chapters can cite the verified identity,
              financing, and customer-scale facts, while financial quality, governance, headcount, and incident severity
              remain open until private documents are reviewed.
