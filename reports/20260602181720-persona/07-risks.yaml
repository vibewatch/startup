chapter:
  number: 7
  title: Risks
  summary: 'Persona’s major underwriting risks are correlated around trust: biometric/privacy litigation, age-assurance backlash,
    disputed 2026 code-exposure and surveillance allegations, customer concentration uncertainty, and private-company governance/financial
    opacity. FedRAMP, security controls, privacy policies and named customers are real mitigants, but the investment case
    should remain conditional on proof of customer-level retention controls, legal reserves, concentration data, incident
    history and board-level risk governance.'
sections:
- id: underwriting-view
  title: 'Underwriting view: trust is the risk multiplier'
  body: Persona’s risk profile is not a collection of independent issues; it is a trust-concentration problem. The company
    handles identity documents, selfies, device signals, watchlist checks and workflow decisions for customers that often
    have regulatory, fraud or age-assurance reasons to avoid mistakes. That creates a powerful growth thesis when regulation
    and AI-driven fraud force buyers to verify more users, but it also means privacy litigation, a security controversy, a
    high-profile customer rollback or weak retention controls can transmit quickly into revenue quality and valuation. The
    chapter therefore ranks risk by residual underwriting impact, not by headline noise. The key point is that FedRAMP, security
    controls and published privacy policies are meaningful mitigants, while the unresolved issues—customer-level configuration,
    BIPA consent evidence, customer concentration, governance controls and audited financial metrics—remain diligence gates
    before underwriting the $2 billion valuation as durable.
  claimRefs:
  - CR001
  - CR004
  - CR014
  - CR033
  - CR035
  - CR038
  - CR048
  tableRefs:
  - TR005
  figureRefs:
  - FR001
- id: regulatory-privacy-litigation
  title: Regulatory, privacy and biometric litigation risk
  body: 'The hardest legal risk is biometric privacy, not generic data protection. BIPA requires retention policies and written
    informed consent, and Persona has already appeared in litigation alleging facial-geometry collection in DoorDash and Sonder-related
    workflows. Washington matters because the appellate court refused to let Persona compel arbitration through a customer
    contract, weakening a common vendor-defense path. The 2026 age-verification wave is a double-edged catalyst: it can expand
    demand for identity vendors, while simultaneously increasing the number of adults asked to submit IDs, selfies or age
    signals and therefore the number of people motivated to challenge retention, consent and surveillance practices. The underwriting
    implication is to reserve upside for regulatory-driven demand only after reviewing consent flows, data-processing terms,
    customer-configured retention policies, deletion logs, litigation insurance and reserves.'
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR034
