- id: concentration-dependencies-and-operating-execution
  title: Customer, partner and operating-dependency risk
  body: 'Public customer proof is strong enough to validate demand but not strong enough to underwrite durability. OpenAI,
    Brex and Coursera show production use cases, and the Series D materials claim more than 3,000 businesses and more than
    300 million annual verifications; however, public sources do not disclose top-customer revenue share, renewal cohorts,
    contract terms, NRR or churn. Persona’s platform breadth also creates dependency risk: customers embed Persona APIs into
    onboarding, sanctions, fraud and age-assurance flows, while Persona depends on customer configuration to make retention
    and disclosure choices legally robust. Discord-related age-assurance backlash shows how quickly a platform can reconsider
    a vendor if end users perceive the verification flow as invasive. The mitigation is not a better logo slide; it is customer
    concentration data, cohort retention, reference calls, implementation-failure logs and contractual allocation of privacy
    responsibilities.'
  claimRefs:
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR042
  - CR047
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: governance-valuation-and-thesis-breaks
  title: Governance, valuation and thesis-break triggers
  body: 'The valuation risk is straightforward: a $2 billion late-stage private valuation is underwriting future trust at
    scale while audited metrics remain unavailable. Public evidence gives financing, customer and verification-count signals,
    but not ARR quality, gross margin, burn, runway, net revenue retention, customer concentration, litigation reserves, board
    risk ownership or insurance limits. That opacity matters because the largest risks are correlated. A confirmed production
    data exposure, adverse BIPA ruling, unreserved class-action settlement, high-profile vendor termination, or regulatory
    restriction on biometric retention would hit legal cost, customer trust, growth and multiple at once. The investable path
    is therefore a conditional one: proceed only if diligence proves mature privacy controls, security operations, customer
    diversification, risk governance and financial durability; otherwise the correct stance is to price the company as a regulation-dependent
    and controversy-sensitive execution story.'
