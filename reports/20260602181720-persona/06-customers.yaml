- id: named-customer-proof
  title: Named customer proof is unusually concrete, but still company-controlled
  body: The strongest proof points are not logos; they are case studies with named operators, workflow descriptions and quantified outcomes. OpenAI’s sanctions-screening deployment, Coursera’s global learner verification, Brex’s KYC completion rate, Twilio’s KYB launch timing, Lime’s faster age-verification flow, Branch’s automation rate and Dakota’s KYB speed all show production use tied to operational bottlenecks. Several healthcare and marketplace stories add breadth across patient, volunteer, courier and small-business contexts. The caveat is that most detailed evidence is still published by Persona, so it should be treated as customer proof rather than independent retention evidence. Independent review sites and news corroborate general adoption themes, but they do not validate every outcome metric or contract durability claim.
  claimRefs:
  - CU003
  - CU005
  - CU006
  - CU008
  - CU010
  - CU011
  - CU013
  - CU027
