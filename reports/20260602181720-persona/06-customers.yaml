- id: distribution-and-channels
  title: Distribution extends through integrations, reusable identity and government channels
  body: Persona’s GTM surface is broader than direct enterprise sales. The company publishes marketplace and partner motions that include integration listings, business partners, channel partners and sponsor-bank/FI programs; third-party pages from Auth0 and Oscilar support at least some ecosystem presence outside Persona’s own domain. In 2026, the two most important channel signals are Chainlink and FedRAMP/Carahsoft. Chainlink positions Persona as a reusable-credential issuer for on-chain finance, potentially letting one KYC event travel across protocols and asset managers. FedRAMP Moderate authorization and Carahsoft availability give Persona a more credible path into federal agencies. These channels could expand reach, but they also depend on partner execution and regulated customers’ willingness to standardize on Persona-issued identity signals.
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU044
  tableRefs:
  - TU006
  figureRefs:
  - FU002
- id: review-signals-and-user-risk
  title: Review signals are positive for buyers but adverse end-user evidence matters
  body: 'Independent review surfaces are directionally supportive for business buyers: Gartner’s fetched page shows four- and five-star concentration, while Software Advice, TrustRadius, Slashdot and SourceForge describe workflow automation, coverage and support themes. The adverse side is equally important because Persona is deployed into sensitive consumer moments. Trustpilot shows a very poor end-user rating and complaints about failed document recognition, expired links, lockout consequences and data trust. Discord’s 2026 age-assurance reversal is the clearest customer-side warning: even a limited Persona test became part of a broader privacy backlash, and Discord says it did not continue with Persona after the UK test. For customer diligence, this means buyer satisfaction cannot be treated as equivalent to end-user acceptance.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU035
  - CU036
  - CU042
  - CU043
