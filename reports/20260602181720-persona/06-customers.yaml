  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention gap
    missingEvidence: Net revenue retention, gross retention, churn, renewal rates and contract-length distribution by customer segment.
    whyItMatters: Without cohort retention, customer stories cannot prove durable revenue or expansion quality.
    diligencePath: Request customer cohort exports, renewal bridge and top-20 account renewal notes from management.
    relatedQuestionRefs:
    - QU021
    - QU028
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration gap
    missingEvidence: Top-customer revenue share, customer count, ACV distribution and dependency on the largest platform customers.
    whyItMatters: A few large platforms could drive reported scale and create churn or pricing risk.
    diligencePath: Review anonymized customer revenue waterfall, top-10 contract terms and pipeline concentration.
    relatedQuestionRefs:
    - QU022
    - QU030
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: material
    topic: end-user acceptance
    missingEvidence: Pass rates, abandonment, appeals, support tickets and privacy objections by customer and verification method.
    whyItMatters: Buyer satisfaction can coexist with end-user friction that damages customer brands and causes vendor churn.
    diligencePath: Compare customer pass-rate dashboards against Trustpilot/Discord complaint themes and run reference calls with consumer-platform customers.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU029
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named customer enumeration
    missingEvidence: A complete current customer roster with deployment status, product modules, geography, ACV and renewal status.
    whyItMatters: The public roster is a selected sample, so it may overrepresent successful deployments.
    diligencePath: Ask Persona for a customer list under NDA and sample current references across fintech, healthcare, education and consumer platforms.
    relatedQuestionRefs:
    - QU002
    - QU023
    relatedTableRefs:
    - TU003
