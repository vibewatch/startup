    - id: discover
      label: Customer encounters regulated onboarding need
      stage: Discovery
      description: Fraud, compliance, age, credential or records problem creates budget.
    - id: verify
      label: User verifies with ID, selfie, database, sanctions or KYB checks
      stage: Activation
      description: Persona workflow applies risk-tiered checks.
    - id: review
      label: Exceptions route to manual review or case operations
      stage: Operations
      description: Risk teams handle edge cases and appeals.
    - id: reuse
      label: Verified data reused for lifecycle actions
      stage: Expansion
      description: Account recovery, KYB, reverification or Connect-style sharing.
    - id: risk
      label: Friction, privacy concern or failed verification creates backlash risk
      stage: Risk
      description: Discord and Trustpilot evidence show end-user acceptance matters.
