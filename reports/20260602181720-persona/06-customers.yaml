  - TU004
  figureRefs: []
- id: retention-concentration-and-diligence
  title: Durability and concentration remain private-evidence questions
  body: 'The public record supports real adoption, but it does not support a clean retention or concentration underwriting case. Persona does not disclose net revenue retention, gross retention, churn, renewal rates, average contract value, top-customer share or cohort expansion by vertical. Some stories imply expansion potential—Branch moves from KYC to KYB, OpenAI mentions future developer/business verification, and Persona Connect aims to reuse verified identity across partner networks—but those are not substitutes for booked expansion. The main diligence path is therefore customer-reference driven: verify whether named deployments are current, production-grade and renewing; obtain cohort retention and usage trends; test whether high-friction consumer flows cause customer churn; and understand whether a few very large platforms dominate revenue. This is the chapter’s central underwriting caveat: public adoption evidence is broad enough to justify reference diligence, but not complete
    enough to infer revenue durability without management data.'
  claimRefs:
  - CU018
  - CU028
  - CU039
  - CU040
  - CU041
