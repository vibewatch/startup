schemaVersion: report-v2
artifact: customers
slug: persona
runDate: '2026-06-02'
company:
  name: Persona
chapter:
  number: 6
  title: Customers
  summary: 'Persona has unusually concrete customer proof for a private identity-verification vendor, with named production stories across OpenAI, Coursera, Brex, Twilio, Lime, Branch, Dakota, healthcare and public-sector channels. The caveat is customer-quality risk: most outcomes are company-controlled, retention and concentration are not disclosed, and 2026 Discord/Trustpilot evidence shows end-user privacy and verification friction can derail deployments.'
sections:
- id: segments-and-use-cases
  title: Customer segments cluster around regulated onboarding, trust and lifecycle risk
  body: 'Persona’s customer evidence points to a verticalized trust-and-compliance platform rather than a generic identity widget. The clearest buyer segments are integrity and trust teams at AI platforms, compliance and operations teams in fintech and communications, risk teams in marketplaces, healthcare operators, education credentialing teams and public-sector digital-service buyers. The named deployments show different users and payers: product/integrity teams tune screening at OpenAI, compliance teams manage Twilio KYB, risk teams automate Branch KYC/KYB, city-regulated operators run Lime age checks, and healthcare teams use patient verification to unlock records or prescriptions. This breadth is attractive because the same primitives can attach to high-value regulatory budgets, but it also means Persona’s customer quality depends on customers’ own tolerance for friction, privacy posture and regulatory interpretation.'
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU007
  - CU009
  - CU012
  - CU027
  - CU031
  - CU037
  tableRefs:
