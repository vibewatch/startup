- id: TU005
  title: Expansion and concentration risk register
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Potential impact
  - Diligence path
  rows:
  - - Lifecycle identity expansion
    - Customers may use Persona only for narrow onboarding checks
    - Expansion slower than case studies imply
    - Inspect product attach rates by customer cohort
  - - KYB plus KYC bundling
    - Fintech customers may consolidate vendors or build in-house at scale
    - Pricing pressure and churn risk
    - Review renewal notes and displacement losses
  - - Reusable identity / Connect
    - Network value depends on partner adoption and consent flows
    - Channel may underperform if partners do not standardize
    - Request partner activation, reuse and drop-off metrics
  - - Public-sector FedRAMP channel
    - Federal procurement cycles can be slow despite authorization
    - Delayed revenue conversion
    - Track agency pipeline, awards and Carahsoft resale bookings
  - - Age assurance regulation
    - Privacy backlash can halt or delay customer rollouts
    - Lost consumer-platform deployments
    - Review adverse pilots and regulatory response playbooks
  - - Large-platform customers
    - Top-customer revenue concentration is undisclosed
    - Revenue volatility if a platform churns or insources
    - Obtain top-10 customer share and contract terms
  - - Healthcare compliance
    - Patient friction or failed verification can damage customer experience
    - Support cost, abandonment and reputational risk
    - Analyze patient pass rates and appeals by document type
  notes: Risks are inferred from public proof gaps and adverse evidence; private revenue concentration and retention data are required to size impact.
