    title: Final stance
    body: >-
      Track Persona rather than buy on public evidence alone: the company quality is credible, but the $2B valuation
      already prices substantial growth and trust execution.
    claimRefs:
      - CV009
      - CV010
      - CV044
  - calloutType: risk
    title: Price-critical risk
    body: >-
      The largest valuation risk is not one isolated controversy; it is correlated trust risk transmitting into growth,
      legal cost, customer retention and exit multiple.
