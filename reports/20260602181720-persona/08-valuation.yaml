  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Financial proof missing
        - No audited ARR/revenue, NRR, gross margin, burn or concentration data under NDA
        - Cannot validate price or exit readiness
        - Do not buy; keep track only
      - - Multiple compression
        - Public identity/fraud comps reset materially below assumed private premium
        - Exit multiple and late-stage mark become vulnerable
        - Renegotiate entry or require structure
      - - Trust shock
        - Confirmed customer churn, regulatory action or material reserve from 2026 controversy
        - Growth, legal cost and procurement confidence hit together
        - Avoid or demand large discount
      - - Margin disappointment
        - Verification/data costs make gross margin meaningfully below software benchmark
        - Revenue multiple must compress toward services/usage economics
        - Reprice on gross-profit multiple
      - - Customer concentration
        - Top customer or top-10 share materially concentrated without durable contracts
        - Revenue quality and exit readiness decline
        - Require retention covenants or lower price
      - - Preference overhang
        - Existing preferences or new terms impair common-equity upside
        - Headline valuation overstates investor economics
        - Model fully diluted returns before proceeding
    notes: Triggers are diligence thresholds that would change valuation, not predictions of failure.
    claimRefs:
      - CV024
      - CV027
      - CV033
      - CV034
      - CV040
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - ARR / revenue quality
        - Audited ARR, recognized revenue, committed versus usage revenue and cohort expansion
        - Determines whether 20x proxy is reasonable
        - Review audited statements and ARR bridge
      - - Margins / unit economics
        - Gross margin by product, data pass-through cost, support and manual-review cost
        - Determines software versus usage-services multiple
        - Request product-level gross-profit waterfall
      - - Retention / concentration
        - NRR, GRR, churn, top customer and top-10 share
        - Determines durability and exit readiness
        - Cohort tables plus customer reference calls
      - - Legal / privacy reserves
        - BIPA, privacy, incident, insurance and reserve schedule
        - Quantifies correlated trust risk
        - Counsel review and board reserve materials
      - - Security / incident history
        - Incident log, penetration tests, SOC reports and 2026 controversy impact
        - Determines procurement trust and downside shock risk
        - Security diligence and customer-churn analysis
      - - Cap table / preferences
        - Preference stack, option pool, debt and pro-forma dilution
        - Determines investor return despite headline valuation
        - Cap-table model and term-sheet review
      - - Exit readiness
        - Audit readiness, board governance, public-company controls and reporting cadence
        - Determines IPO or strategic-acquirer feasibility
        - CFO/controller interviews and readiness checklist
    notes: Diligence asks focus on price-critical private evidence; public sources cannot close these gaps.
    claimRefs:
      - CV034
      - CV035
      - CV037
      - CV040
      - CV041
      - CV045
