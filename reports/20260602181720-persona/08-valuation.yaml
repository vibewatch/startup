  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: ARR quality
      missingEvidence: Audited ARR, recognized revenue, committed versus usage revenue, and cohort expansion data.
      whyItMatters: The current valuation multiple cannot be interpreted without knowing durable recurring revenue quality.
      diligencePath: Request audited financials and ARR bridge under NDA.
      relatedQuestionRefs:
        - QV015
        - QV025
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: material
      topic: unit economics
      missingEvidence: >-
        Gross margin by verification type, workflow software margin, data-source pass-through cost, and
        support/manual-review cost.
      whyItMatters: A usage-heavy cost structure would justify a lower multiple than a software-control-plane model.
      diligencePath: Review product-level gross-profit waterfall and vendor cost schedules.
      relatedQuestionRefs:
        - QV016
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: material
      topic: cap table
      missingEvidence: Preference stack, option pool, pro-forma dilution, debt, and investor rights from the latest round.
      whyItMatters: Headline post-money valuation may not equal the economics available to a new investor.
      diligencePath: Request cap table, financing documents, and liquidation-preference model.
      relatedQuestionRefs:
        - QV024
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: Top customer share, top-10 customer share, contract duration, churn, NRR and GRR.
      whyItMatters: Concentration and retention determine whether the public scale signal is durable enough for a premium valuation.
      diligencePath: Review cohort retention exports and run customer reference calls.
      relatedQuestionRefs:
        - QV017
        - QV023
      relatedTableRefs:
        - TV005
        - TV006
    - type: conflicting-data
      severity: material
      topic: adverse controversy impact
      missingEvidence: >-
        Customer churn, pipeline delay, legal reserve, regulatory inquiry and incident-response evidence tied to the
        2026 adverse coverage.
      whyItMatters: The controversy is disputed, but valuation downside depends on customer and regulator reaction.
      diligencePath: Review incident timeline, board materials, counsel memos, customer communications and churn analysis.
      relatedQuestionRefs:
        - QV018
        - QV030
      relatedTableRefs:
        - TV005
    - type: enumeration-incomplete
      severity: minor
      topic: comparable valuation table
      missingEvidence: A full banker-style comp set with live EV, revenue, EBITDA, growth, retention, and segment mix for every peer.
      whyItMatters: The public chapter uses representative comps; an investment memo should refresh all market multiples at pricing.
      diligencePath: >-
        Build a live comp spreadsheet from SEC filings, annual reports, FactSet/CapIQ, and private transaction
        databases.
      relatedQuestionRefs:
        - QV027
      relatedTableRefs:
        - TV004
