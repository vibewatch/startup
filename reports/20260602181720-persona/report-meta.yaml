companyProfile:
  summary: >-
    Persona is a San Francisco-based private identity-verification and identity-orchestration platform for regulated and
    high-scale businesses. Its public product surfaces span identity verification, KYC/AML, KYB, age assurance,
    workflows, case review, graph analysis, APIs, and SDKs, while customer evidence shows deployments across AI safety,
    fintech, marketplaces, communications, healthcare, education, and public-sector channels. The company has strong public
    traction signals, including more than 300 million annual verifications, more than 4,000 enterprise customers, and a
    $200 million Series D at a $2 billion valuation, but investment underwriting remains limited by private financial,
    customer-concentration, governance, legal-reserve, and security/privacy evidence gaps.
