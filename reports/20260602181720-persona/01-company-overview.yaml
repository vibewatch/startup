company:
  name: Persona
chapter:
  number: 1
  title: Company Overview
  summary: Persona is a late-stage private verified-identity platform with a corroborated $200M Series D at a $2B valuation,
    strong public customer/verification scale signals, and material governance, private-metric, biometric-litigation, and
    2026 security/privacy diligence gaps.
sections:
- id: identity-product
  title: Identity, product, and stage
  body: 'Persona is best treated as a private verified-identity infrastructure company rather than a narrow document-check
    vendor. Its official surfaces describe modular building blocks for verification, fraud prevention, workflows, case review,
    graph analysis, and orchestration across KYC, KYB, AML, workforce verification, age assurance, and account recovery. The
    latest public stage marker is Series D: Persona announced a $200 million financing on April 30, 2025 at a $2 billion valuation,
    with independent finance coverage corroborating the amount and valuation. For cover purposes, the supported product line
    is enterprise identity verification and orchestration, the supported stage is late-stage private venture, and the unsupported
    metrics are current ARR, margin, burn, runway, and headcount. This chapter therefore separates reusable ground truth from
    diligence asks: later chapters can cite the verified identity, financing, and customer-scale facts, while financial quality,
    governance, headcount, and incident severity remain open until private documents are reviewed.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO026
  - CO040
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: leadership-governance
  title: Founders, leadership, and governance opacity
  body: Public evidence continues to revolve around founder-led execution. Forbes and other independent coverage identify
    Rick Song as cofounder and CEO, while public company profiles identify Charles Yeh as cofounder and CTO. That founder
    continuity is a strength for product vision because the platform narrative is tightly linked to identity infrastructure
    in an AI-heavy internet. It is also a diligence risk because the fetched sources did not disclose a complete current executive
    roster, board membership, observer rights, voting control, or succession plan. Until those documents are reviewed, the
    correct posture is to carry a key-person and governance-disclosure gap rather than infer institutionalized governance
    from the size of the financing.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  - CO041
  tableRefs:
  - TO002
- id: capital-investors-traction
  title: Capitalization, investors, and traction signals
  body: 'Persona has a well-corroborated financing arc: Series A in 2020, Series B and Series C in 2021, and a Series D in
    2025. The Series D was co-led by Founders Fund and Ribbit Capital, with BOND, Chemistry, Coatue, First Round Capital,
    and Index Ventures participating. Public traction is strong but asymmetrically disclosed. Persona and PR Newswire say
    the company processes more than 300 million verifications annually and doubled revenue and customer count year over year;
    Forbes says Persona helps more than 4,000 enterprise businesses, including OpenAI, Block, and Robinhood. Those metrics
    establish scale, but because absolute revenue, retention, gross margin, and customer concentration are not public, they
    should remain explicit cover gaps. The practical implication is that references to traction should not be converted into
    underwriting assumptions without customer-level exports and contract evidence.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO042
  tableRefs:
  - TO003
- id: customers-operations
  title: Customer proof and operating model
  body: 'Customer proof shows Persona’s platform is embedded in regulated and high-scale workflows. The OpenAI case study
    says OpenAI screens millions monthly and automates 99% of screenings across more than 225 countries; older case studies
    show Square Capital using Persona for PPP verification, Brex for cash-management onboarding, and AngelList for KYC. Persona’s
    processor privacy policy and help center frame Persona as a service provider operating through customers: the customer
    decides the verification flow and required information, while Persona supplies the identity technology. That model supports
    enterprise configurability but also pushes diligence toward customer contract terms, data-retention choices, and how responsibility
    is allocated when end users object to verification decisions.'
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO027
  - CO028
  - CO029
  - CO031
- id: milestones-adverse-events
  title: Milestones and adverse events
  body: 'The public chronology includes product-market expansion, major financings, analyst recognition, and adverse events.
    Gartner and Forrester recognition in 2025 supports category visibility but should not be over-weighted because the fetched
    sources are company announcements about analyst reports. The adverse record is material: Washington v. Persona Identities,
    Inc. preserved biometric-privacy litigation risk after the Illinois appellate court reversed arbitration, and 2026 reporting
    by Malwarebytes, Cybernews, and State of Surveillance alleged a frontend/code exposure and surveillance-oriented capability
    concerns. Persona disputed key severity points, including whether personal data or production systems were exposed, so
    the risk is best recorded as unresolved security/privacy diligence rather than a concluded breach. Material.'
  claimRefs:
