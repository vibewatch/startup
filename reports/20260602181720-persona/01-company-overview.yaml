  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited financial statements, ARR bridge, gross margin, NRR, burn, runway, and cohort economics.
    whyItMatters: Valuation and stage assessment rely on company-reported growth without profitability or retention context.
    diligencePath: Request investor data room financial model, board package, audited statements if available, and revenue
      cohort exports.
    relatedQuestionRefs:
    - QO018
    - QO024
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current employee count supported by company HRIS, payroll, or an official dated company disclosure.
    whyItMatters: Scale, operating leverage, and key-person risk cannot be normalized without current staffing.
    diligencePath: Request current organization chart and payroll headcount by function and geography.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: Leadership and founder table
    missingEvidence: Complete executive roster, board seats, observer rights, and voting-control terms.
    whyItMatters: Governance and key-person dependence cannot be fully scored from founder and press profiles alone.
    diligencePath: Request current cap table, investor rights agreement, board minutes, and executive org chart.
    relatedQuestionRefs:
    - QO014
    - QO015
    - QO016
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: Stakeholder or investor map
    missingEvidence: Complete investor ownership percentages, preference stack, pro rata rights, and customer concentration.
    whyItMatters: Economic control and downside preferences determine who can influence exits or future financing.
    diligencePath: Request post-Series D cap table, financing documents, and top-customer revenue report.
    relatedQuestionRefs:
    - QO006
    - QO009
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table
    missingEvidence: Full internal chronology for product launches, regulatory reviews, customer wins, and incident response.
    whyItMatters: Public milestones identify major events but may omit operational setbacks or delayed initiatives.
    diligencePath: Request board timeline, launch calendar, security incident register, and litigation tracker.
    relatedQuestionRefs:
    - QO013
    - QO027
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: material
    topic: adverse-security
    missingEvidence: Independent forensic report and customer-by-customer exposure assessment for the 2026 frontend/code exposure
      allegations.
    whyItMatters: Persona disputes exposure severity; diligence needs to distinguish reputational risk from actual customer-data
      compromise.
    diligencePath: Request incident report, remediation timeline, customer notices, penetration-test retest, and counsel memo.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO004
