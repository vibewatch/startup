callouts:
- calloutType: strength
  title: Differentiation sits in orchestration breadth
  body: Persona’s clearest moat is the ability to combine many identity primitives with no-code rules, custom code, Cases and Graph, letting customers tune friction and review by risk rather than buying a single document-check API.
  claimRefs:
  - CE001
  - CE006
  - CE007
  - CE008
  - CE009
  - CE040
- calloutType: risk
  title: Biometric and age-assurance trust is now a diligence blocker
  body: Even with Persona’s clarification that the exposed frontend was isolated and contained no personal data, the 2026 reporting raises questions about transparency, code exposure controls and public acceptance of facial age assurance.
  claimRefs:
  - CE036
  - CE037
  - CE038
  - CE041
- calloutType: insight
  title: Security posture is credible but private artifacts matter
  body: SOC 2, encryption, retention controls and FedRAMP listing are meaningful signals, but investors still need the private SOC report, FedRAMP package access, subprocessor mapping and customer-specific retention configurations.
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE028
  - CE029
  - CE042
