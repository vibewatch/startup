schemaVersion: report-v2
artifact: product-tech
slug: persona
runDate: '2026-06-02'
company:
  name: Persona
chapter:
  number: 5
  title: Product & Technology
  summary: Persona is technically differentiated less by a single verification method than by a broad, configurable identity stack spanning IDV, database checks, selfie/liveness, KYB/KYC/AML, Workflows, Cases, Graph, APIs and SDKs. The public evidence supports strong integration, security and compliance posture, including SOC 2 claims and a 2026 FedRAMP listing, but the chapter flags material gaps in independent accuracy benchmarks, workflow-control proof, public source auditability and biometric/privacy trust after 2026 age-assurance controversy.
sections:
- id: product-stack-modules
  title: 'Product stack: modular identity infrastructure rather than a point verifier'
  body: 'Persona’s product stack is best understood as a modular identity operating system rather than a single KYC widget. The public platform page frames Persona as configurable infrastructure for identity verification, KYC/AML, KYB, age assurance and adjacent identity operations. Under that umbrella, the publicly visible modules include government-ID verification, authoritative database checks, selfie/liveness, AML/KYC screening, adverse media, business onboarding, Workflows, Cases, Graph, APIs, SDKs and webhooks. The technical differentiation is therefore breadth plus orchestration: customers can assemble different verification primitives, risk signals, review steps and retention choices into workflows. That is valuable for regulated fintech, marketplaces, education and age-gated consumer products because identity requirements vary by geography, risk tier and user journey. The diligence caveat is that Persona publishes product capability claims but not independent accuracy, false-positive, fraud-loss or demographic-bias benchmarks for each module.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE040
  tableRefs:
  - TE001
  figureRefs:
  - FE001
  - FE004
- id: workflow-orchestration-review
  title: Workflow orchestration, Cases and Graph are the clearest differentiation layer
  body: 'The most differentiated public layer is orchestration. Persona Workflows combines a no-code drag-and-drop editor with custom-code paths, and the company says rules can approve, deny or flag users while preserving an audit trail. Cases and Graph extend this into operations: Cases is positioned as a manual-review and compliance hub that consolidates active, passive and behavioral signals, while Graph adds link analysis to find connected accounts, patterns and fraud rings. This matters because identity vendors often compete on data-source coverage, but customers usually win or lose on routing: which users get friction, which edge cases go to review, when a business entity requires enhanced due diligence, and how suspicious activity gets escalated. Persona’s public evidence supports an orchestration moat, but not a fully measured one; the key missing diligence items are rule-latency data, model/agent performance, false-link rates and evidence that customers can version, test and audit complex workflow changes safely.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE040
  - CE042
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: developer-integration-model
  title: 'Developer experience: broad API surface, public specs and SDKs, but limited source auditability'
  body: 'Persona’s integration model is API-first with multiple user-experience options. The docs expose operational basics—API keys, authentication, idempotence, pagination, rate limiting, logs, request IDs and versioning—and first-class resources for accounts, cases, devices, documents, events, graph, inquiries, reports, transactions, verifications, webhooks and workflows. Inquiries handle the end-user verification lifecycle, while Transactions provide entity/workflow modeling and biometric-redaction actions. Webhooks cover account, case, document, graph, inquiry, selfie, verification and workflow events. For front-end integration, Persona documents hosted flows, mobile SDKs and React bindings. Public developer signal is meaningful but not deep: Persona maintains an OpenAPI 3.1.0 repository and demo mobile SDK repos, and the archived persona-react package showed material weekly downloads. However, these surfaces are integration artifacts, not the core verification engine, so external auditability remains limited.'
  claimRefs:
  - CE010
