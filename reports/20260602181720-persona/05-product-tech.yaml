  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: accuracy-benchmarks
    missingEvidence: Independent module-level accuracy, false-positive, false-negative and demographic-bias benchmarks for government ID, database, selfie/liveness, watchlist and Graph decisions.
    whyItMatters: Persona’s differentiation depends on trust in automated decisions; public product claims cannot prove underwriting-grade performance.
    diligencePath: Request model cards, third-party test reports, customer cohort results, SOC/privacy audit artifacts and red-team liveness test outcomes under NDA.
    relatedQuestionRefs:
    - QE002
    - QE005
    - QE031
  - type: private-evidence-only
    severity: material
    topic: workflow-controls
    missingEvidence: Evidence of workflow versioning, testing, rollback, approval controls, latency and auditability for complex customer configurations.
    whyItMatters: Customer-configured rules are both Persona’s moat and a source of compliance/conversion risk if not governed tightly.
    diligencePath: Run a sandbox workflow build, inspect audit logs/version history, and interview reference customers about change-management practices.
    relatedQuestionRefs:
    - QE008
    - QE019
    - QE031
  - type: conflicting-data
    severity: material
    topic: age-assurance-incident
    missingEvidence: Full Persona post-incident review, remediation evidence and customer communications related to the 2026 exposed-frontend reporting.
    whyItMatters: Public reporting and Persona’s clarifications point in different directions on severity and implications for trust.
    diligencePath: Request incident timeline, root-cause analysis, affected asset inventory, third-party validation and any customer churn or vendor-removal data.
    relatedQuestionRefs:
    - QE029
    - QE030
  - type: private-evidence-only
    severity: minor
    topic: developer-experience
    missingEvidence: Current API uptime history, error budgets, SDK adoption metrics, support response SLAs and current npm/package registry statistics.
    whyItMatters: Public status and package pages are positive but shallow indicators of developer experience at scale.
    diligencePath: Ask for API SLA contracts, incident history export, SDK telemetry and support-ticket metrics from large customers.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE027
