- id: security-compliance-privacy
  title: Security, compliance and privacy architecture is strong on controls but customer-configuration dependent
  body: 'Persona publishes a serious security and privacy posture. The help center states SOC 2 Type II certification, AES-256 encryption at rest, TLS 1.2 or higher in transit, vulnerability management, independent penetration testing, audit logging and priority patching. The security page adds US/EU data residency support and says Persona for Government is cloud-native on Google Cloud Platform. FedRAMP independently lists Persona for Government as FedRAMP Certified as of April 10, 2026, Class C Moderate, via 20x. The privacy architecture is more nuanced: Persona acts mainly as a processor for customer controllers, and the policy says age assurance and identity verification can involve government documents, selfies, face geometry, device data, third-party data sources and general geolocation. Default deletion and redaction controls are positive, but actual retention can depend on customer instruction, consent and legal requirements. Subprocessors such as AWS, GCP, MongoDB, FingerprintJS, OpenAI and Anthropic create a diligence checklist for sensitive-data flows.'
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
