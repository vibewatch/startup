- id: TP005
  title: Substitute and status-quo map
  columns:
  - Substitute
  - When buyer chooses it
  - Why it can beat Persona
  - Why Persona can still win
  rows:
  - - Manual review / status quo
    - Low volume, high tolerance for analyst labor, or no compliance trigger
    - No new vendor cost or integration work
    - Persona wins when volume, fraud, conversion, or auditability makes manual review untenable
  - - Internal build
    - Very large platform with payments, risk, compliance, ML, and data infrastructure
    - Control, data ownership, and low marginal cost at scale
    - Persona wins when build time, liability, and country/data coverage exceed internal capacity
  - - Payment-native IDV
    - Stripe-heavy platform needing basic verification around payouts, onboarding, or communities
    - Fast integration, trusted brand, transparent procurement
    - Persona wins when workflows cross payments, KYB, graph, sanctions, and case review
  - - Fraud-first tool
    - Team wants device/IP/behavioral context before ID capture
    - Risk assessed earlier than document-first flows
    - Persona wins when buyer needs identity evidence, compliance artifacting, and workflow orchestration together
  - - Global data/KYB specialist
    - Cross-border KYC/KYB is primary job
    - Coverage and local data-source match rates may dominate
    - Persona wins as orchestrator if buyer needs multiple verification types and review operations
  notes: Rows are substitution patterns synthesized from vendor claims and independent comparison evidence.
