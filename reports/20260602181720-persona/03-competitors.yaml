schemaVersion: report-v2
artifact: competitors
slug: persona
runDate: '2026-06-02'
company:
  name: Persona
chapter:
  number: 3
  title: Competitors
  summary: Persona sits in a crowded identity-verification landscape where direct IDV peers, risk-data incumbents, global
    KYC/KYB specialists, payment-native substitutes, fraud-first tools, status quo, and internal build all solve parts of
    the same job. Persona wins on configurable workflow breadth; it loses where buyers prioritize transparent low-friction
    checks, synthetic-fraud data depth, incumbent risk networks, or global data-source coverage.
sections:
- id: landscape-and-substitution
  title: Competitive set and substitution pattern
  body: 'Persona''s competitive set is broader than a list of document-verification vendors. The direct peer set includes
    Jumio, Entrust IDV/Onfido, Socure, LexisNexis Risk Solutions, Trulioo, and Stripe Identity because each can satisfy part
    of the same onboarding, compliance, fraud, or trust-and-safety job. Adjacent vendors such as Veriff, Sumsub, and SEON
    matter when buyers narrow the job to a cheaper IDV suite or broaden it to fraud signals before ID capture. The status
    quo and internal build also remain real alternatives: low-volume teams can keep manual review, while very large platforms
    with payment, risk, ML, and compliance infrastructure may build or route around third-party checks. Persona''s win condition
    is therefore not simply that identity verification grows; it must become the buyer''s configurable identity decisioning
    layer, not one interchangeable verification step. This framing matters because procurement does not happen at a category
    level: a compliance leader, fraud leader, trust-and-safety owner, and payments platform can each buy a different substitute
    while still describing the project as identity verification.'
  claimRefs:
  - CP023
  - CP026
  - CP028
  - CP034
  - CP038
  - CP039
  - CP040
  - CP045
  tableRefs:
  - TP001
  - TP005
  figureRefs:
  - FP001
- id: direct-peer-profiles
  title: Direct peer profiles and lane-by-lane strengths
  body: 'The named direct competitors each have a credible wedge. Jumio is the mature document/liveness and KYX competitor,
    with public claims around global ID support, configurable workflows, risk scoring, analytics, and KYC/AML. Entrust IDV/Onfido
    brings enterprise scale after the acquisition, including Onfido''s reported revenue, employees, and customer base, but
    also biometric-consent diligence from BIPA litigation. Socure is the strongest U.S. synthetic-fraud specialist in the
    fetched evidence, with customer and bank penetration claims corroborated by a Thomson Reuters partnership post. LexisNexis
    is the incumbent data-network substitute through ThreatMetrix and screening assets. Trulioo is the global KYC/KYB data-check
    competitor. Stripe Identity is narrower but dangerous because Stripe-native buyers can add identity where payments and
    payouts already live. The practical result is a segmented battlefield: each competitor can credibly win a specific lane,
    so Persona''s burden is to prove cross-lane control and operating leverage rather than simply to list more modules.'
  claimRefs:
