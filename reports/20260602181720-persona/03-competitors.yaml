figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: Persona is strongest in workflow breadth, while Socure and LexisNexis lead on fraud/data depth and Stripe anchors
    low-friction developer substitution.
  data:
    points:
    - label: Persona
      x: 4.5
      y: 3.2
      quadrant: Workflow-led platform
      rationale: Broad verification menu plus workflows and graph, but weaker public data-network proof.
    - label: Jumio
      x: 3.8
      y: 3.6
      quadrant: Mature direct IDV
      rationale: Document/liveness plus platform risk workflows and global ID-type claims.
    - label: Entrust IDV / Onfido
      x: 3.7
      y: 3.8
      quadrant: Enterprise IDV scale
      rationale: Acquired Onfido brings AI IDV, no-code orchestration, and enterprise customer base.
    - label: Socure
      x: 3.0
      y: 4.8
      quadrant: Fraud-data specialist
      rationale: Synthetic fraud and consortium/public-sector proof outweigh workflow breadth.
    - label: LexisNexis RS
      x: 2.8
      y: 4.7
      quadrant: Incumbent data network
      rationale: ThreatMetrix digital identity network and screening products create data-depth advantage.
    - label: Trulioo
      x: 3.2
      y: 3.4
      quadrant: Global data/KYB
      rationale: Global data matching and KYB automation, less evidence of case/graph system-of-record role.
    - label: Stripe Identity
      x: 2.4
      y: 2.9
      quadrant: Developer substitute
      rationale: Payments-native identity is easy to adopt but narrower in workflow breadth.
    - label: Status quo / internal build
      x: 1.5
      y: 2.0
      quadrant: Substitute
      rationale: Can be rational at low volume or very high internal scale, but lacks vendor coverage.
  approximationNotes: Ordinal 1-5 scores are evidence-backed qualitative placements, not market-share measurements.
