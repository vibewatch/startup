  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss and replacement evidence
    missingEvidence: Customer-level win/loss data showing which named competitors Persona replaces, coexists with, or loses
      to by use case.
    whyItMatters: Public positioning does not prove whether Persona is the primary identity decisioning layer or a secondary
      module in multi-vendor stacks.
    diligencePath: Request CRM opportunity history, churn/expansion notes, RFP comparisons, and customer architecture diagrams
      for the top 25 accounts.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: performance benchmarks
    missingEvidence: False-positive rates, match rates, fraud-capture lift, manual-review reduction, and conversion impact
      versus Jumio, Socure, LexisNexis, Trulioo, Stripe, and status quo.
    whyItMatters: Persona differentiation depends on measurable workflow and fraud outcomes, not just feature breadth.
    diligencePath: Run a blinded benchmark on recent customer application cohorts and compare vendor decisions, fraud losses,
      pass rates, and review volumes.
    relatedQuestionRefs:
    - QP021
    - QP024
    - QP026
  - type: missing-source
    severity: minor
    topic: realized pricing
    missingEvidence: Actual contracted net pricing, overage terms, data-source pass-through costs, and bundle discounts by
      verification type and volume.
    whyItMatters: Public and procurement benchmark pricing is too broad to determine gross margin, pricing power, or displacement
      risk.
    diligencePath: Review redacted MSAs, order forms, usage invoices, and renewal quotes for representative enterprise, mid-market,
      and startup customers.
    relatedQuestionRefs:
    - QP017
    - QP018
    - QP019
    relatedTableRefs:
    - TP003
