- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public packaging evidence
  - Pricing model signal
  - Buyer implication
  - Diligence ask
  rows:
  - - Persona
    - Official plan services plus startup program
    - Volume-based; Vendr says $25k to $500k+ ACV range and $0.50-$4.00 per verification depending on mix
    - Good for configurable enterprise workflows; budget sensitive to modules
    - Request quote waterfall by verification type, workflow, data source, and overage
  - - Jumio
    - Official demo-led enterprise platform
    - Vendr benchmark source indicates enterprise volume-based spend
    - Competitive for regulated buyers; less transparent than Stripe
    - Ask for doc/liveness/AML bundle and country-by-country coverage pricing
  - - Entrust IDV / Onfido
    - Form-led enterprise IDV page plus acquisition release
    - Terms undisclosed; enterprise packaging implied
    - Likely RFP for regulated enterprise and government-scale buyers
    - Ask for Onfido legacy modules, Entrust bundles, and BIPA consent controls
  - - Socure
    - Sigma product plus Vendr pricing guide
    - Volume-based, per-transaction, modular pricing across IDV, fraud, DocV, KYC/AML
    - Best where risk model lift offsets cost
    - Ask for risk-score lift, false-positive rates, bias testing, and module-level unit economics
  - - LexisNexis Risk Solutions
    - ThreatMetrix and Bridger product pages
    - Enterprise data-network and screening packages; no list price in fetched pages
    - Powerful incumbent option where data depth matters
    - Ask for data provenance, model explainability, and commit minimums
  - - Trulioo
    - KYC data and KYB automation pages
    - API / one-contract integration; no list price in fetched pages
    - Attractive for cross-border data matching and KYB
    - Ask for match rates by country and separate document/data/KYB pricing
  - - Stripe Identity
    - Identity product, docs, and pricing page
    - Pay-as-you-go platform pricing; first 50 Identity verifications free on Identity page
    - Strong low-friction baseline for Stripe users
    - Ask current account-specific Identity price and volume discounts
  notes: Vendr values are procurement benchmarks, not audited vendor list prices; all enterprise pricing requires quote validation.
