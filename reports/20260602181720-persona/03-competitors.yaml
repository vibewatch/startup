- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Configurable identity workflow layer
    - Jumio and Entrust also publish orchestration/workflow claims
    - High
    - Workflow breadth is not unique if competitors match no-code routing
    - Compare actual policy-builder depth, integrations, and analyst UX in demos
  - - Graph and fraud escalation
    - LexisNexis and Socure have stronger public data-network or synthetic-fraud evidence
    - High
    - Fraud lift may depend more on proprietary data than workflow UI
    - Benchmark detection, false positives, and graph efficacy on customer data
  - - Pricing and packaging flexibility
    - Stripe, Trulioo, Veriff, and Sumsub can unbundle basic checks
    - Medium
    - Simple IDV can be routed away from Persona when cost matters
    - Inspect multi-vendor routing and marginal verification economics
  - - Trust and compliance posture
    - Onfido BIPA and Socure public-sector scrutiny show category-wide consent, privacy, and AI-governance risk
    - Medium
    - Biometric and AI verification can create regulatory and reputational drag
    - Review notices, retention, consent logs, model-governance evidence, and audit history
  - - Enterprise distribution
    - Entrust, LexisNexis, Stripe, Thomson Reuters/Socure partnerships have incumbent channels
    - High
    - Distribution can beat product breadth in regulated enterprise accounts
    - Request win/loss data versus named incumbents and channel partner concentration
  notes: Severity is an evidence-backed diligence ranking, not a measured loss probability.
