- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / public proof
  - Target segment
  - Differentiation
  - Limitation versus Persona
  rows:
  - - Jumio
    - Direct IDV / KYX
    - 5K+ supported global ID types; platform claims 120 TPS
    - Banks, fintech, travel, regulated onboarding
    - Document/liveness maturity, KYC/AML, risk workflows
    - Less evidence of Persona-style graph/case identity layer breadth
  - - Entrust IDV / Onfido
    - Direct enterprise IDV
    - Business Wire reported Onfido had $140M+ revenue, 500+ employees, 1,200+ customers before acquisition
    - Financial institutions, e-commerce, gaming, sharing economy
    - Enterprise parent, AI IDV, biometrics, no-code orchestration
    - BIPA history raises notice/consent diligence
  - - Socure
    - Fraud-risk and synthetic-ID platform
    - 3,000+ customers; 18 of top 20 U.S. banks per Thomson Reuters partnership post
    - U.S. banks, fintech, government, high-risk onboarding
    - Synthetic fraud scoring, consortium/data depth, public-sector authorization signals
    - More risk-data than broad workflow; public AI/privacy scrutiny
  - - LexisNexis Risk Solutions
    - Incumbent risk-data network
    - ThreatMetrix references 3bn+ digital identities and thousands of customers
    - Large financial institutions, insurers, telcos, fraud teams
    - Digital identity network, device/behavioral/risk data, sanctions screening
    - Enterprise incumbent complexity; not a startup-native orchestration layer
  - - Trulioo
    - Global KYC/KYB data checks
    - Worldwide data-source network and one-contract integration
    - Cross-border fintech, marketplaces, crypto, platforms
    - Global match coverage and regional compliance workflows
    - Can be a data layer rather than full identity decisioning system
  - - Stripe Identity
    - Payment-native substitute
    - Stripe says over 100-country ID document support and first 50 verifications free
    - Stripe-native marketplaces, platforms, communities
    - Developer speed, payments adjacency, transparent procurement baseline
    - Narrower identity-workflow scope than Persona
  - - SEON
    - Adjacent fraud-first substitute
    - Competitor comparison emphasizes pre-ID fraud context
    - Fraud teams seeking device/digital footprint signals
    - Risk before camera capture; device/IP/behavior context
    - Vendor-authored comparison; not independent proof
  - - Veriff / Sumsub
    - Adjacent IDV suites
    - Official product surfaces market identity-verification products
    - SMB to enterprise KYC/KYB and compliance teams
    - Potentially lower-cost or region-specific IDV alternatives
    - Less public evidence here of Persona-level orchestration depth
  notes: Scale cells use public vendor or independent claims; absence of a metric is treated as unknown, not zero.
