  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Persona ARR, pricing, retention, win/loss, segment mix, geography, verification volumes by workflow,
      and customer concentration.
    whyItMatters: Without these private metrics, public market size cannot be converted into an obtainable revenue forecast
      or valuation share assumption.
    diligencePath: Request board package, ARR bridge, cohort retention, contract export, pricing schedule, and verification-volume
      dashboard by segment.
    relatedQuestionRefs:
    - QM008
    - QM020
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-size-boundary
    missingEvidence: Comparable analyst definitions that separate identity verification, digital identity solutions, fraud
      orchestration, IAM, and reusable wallet infrastructure.
    whyItMatters: Different category boundaries create a more than threefold spread in headline market estimates, materially
      changing valuation narratives.
    diligencePath: Normalize source methodologies in a sizing workbook and map each Persona module to included and excluded
      spend categories.
    relatedQuestionRefs:
    - QM019
    - QM024
    - QM028
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: buyer-budget
    missingEvidence: Customer procurement documents or budget-owner interviews naming Persona buying committees by segment.
    whyItMatters: Public case studies show use cases but rarely prove who signs, who pays, and how budgets are allocated internally.
    diligencePath: Interview five reference customers and request procurement records, security review timelines, and before/after
      operating metrics.
    relatedQuestionRefs:
    - QM009
    - QM010
    - QM026
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: wallet-substitution
    missingEvidence: Evidence on how Persona prices and integrates reusable wallets, mDLs, and EUDI-style credentials when
      those credentials reduce repeated document checks.
    whyItMatters: Wallet adoption could be a complementary signal source or a gross-margin and volume headwind depending on
      product packaging.
    diligencePath: Request wallet roadmap, relying-party integrations, attach rates, and pricing scenarios for reusable credential
      inputs.
    relatedQuestionRefs:
    - QM018
    - QM028
