company:
  name: Persona
chapter:
  number: 2
  title: Market Analysis
  summary: 'Persona participates in a large but boundary-sensitive identity verification market: narrow identity-verification
    estimates cluster around $14-$16B in 2025, while broader digital-identity solutions estimates are roughly $47-$56B in
    2025-2026. The investable market thesis is strongest where regulation, fraud losses, and operational bottlenecks make
    verification, review, KYB, age assurance, and graph-based escalation budgeted workflows rather than optional checks.'
sections:
- id: market-boundary
  title: Market boundary before TAM
  body: 'Persona''s market should be defined around enterprise verification workflows rather than the entire digital identity
    universe. The included pool is KYC/KYB, AML workflow support, document and database verification, selfie/liveness, age
    assurance, case review, and link-analysis fraud operations. The excluded pool is equally important: general IAM, passwordless
    authentication, government wallet issuance, generic cybersecurity, and credit-bureau data sold outside onboarding or fraud
    workflows would inflate TAM without matching Persona''s public product evidence. Customer proof also shows the status
    quo is not a spreadsheet abstraction. Grocery, courier, fintech, and marketplace examples describe manual review, unscalable
    processes, fraud exposure, and user-conversion pressure as the actual displacement targets. For valuation, this means
    the market is attractive but must be underwritten as workflow-specific compliance and fraud spend, not all digital identity
    spend. The boundary also protects later competitive analysis: a vendor can be well positioned in KYC or KYB while still
    having limited exposure to the larger wallet, IAM, or cybersecurity pools that market reports sometimes bundle into digital
    identity.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM040
  - CM041
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing lenses and contradictory estimates
  body: 'The sizing evidence supports a three-layer view. A broad TAM lens can use digital-identity solutions estimates near
    $55-$57B in 2026, but that layer is an upper boundary because it includes identity infrastructure beyond Persona''s apparent
    scope. A narrower SAM lens is better anchored by identity-verification estimates: MarketsandMarkets reports $14.34B in
    2025 and $29.32B by 2030, while IMARC reports $15.8B in 2025 and $50.2B by 2034. Those ranges are directionally consistent
    on double-digit growth but inconsistent on category boundary and forecast horizon. SOM should not be invented from public
    data. Persona discloses public verification and customer-scale headlines in other chapters, but not current ARR, pricing,
    workflow mix, retention, geographic revenue, or customer concentration. The chapter therefore preserves contradictory
    estimates and treats obtainable share as a diligence output, not a public-source fact. This is why the table and range
    figure use source labels rather than a single blended midpoint; the dispersion is a finding about market ambiguity, not
    a math problem to smooth away.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
