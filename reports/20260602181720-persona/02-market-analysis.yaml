- id: buyers-users-payers
  title: Buyer, user, and payer segmentation
  body: 'Buyer evidence splits into distinct adoption paths. Financial institutions buy through compliance, fraud, risk, onboarding,
    and digital-banking owners; the users are operations analysts and applicants flowing through KYC/KYB. Marketplace and
    gig-economy customers buy when trust-and-safety teams need to verify couriers, shoppers, renters, sellers, or merchants
    without damaging conversion. KYB moves the object of verification from a person to a business, beneficial owners, and
    representatives, broadening the payer map to merchant onboarding and business-risk teams. Age-restricted platforms have
    a separate compliance trigger because age thresholds, privacy-preserving verification, and online-safety obligations are
    becoming explicit regulatory issues. Persona''s Cases and Graph pages also show why the buyer map extends beyond initial
    ID checks into review queues and network analysis. The segmentation also explains why a single sales motion is unlikely
    to cover the whole opportunity: compliance teams buy auditability, trust-and-safety teams buy throughput, and fraud teams
    buy loss reduction.'
  claimRefs:
  - CM011
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM031
  - CM035
  - CM039
