      Analyst-defined scope based on the cited source categories. Rows overlap
      economically and are not additive; electricity use, compute contracts, and
      infrastructure financing are different measures.
    claimRefs: [CM001, CM007, CM012, CM013, CM014, CM015, CM016]
  - id: TM002
    title: Public sizing lenses and unresolved market value
    columns: [Publisher, Period or vintage, Geography, Value and metric, Growth rate, Method and denominator, Confidence, Limitation]
    rows:
      - ["International Energy Agency", "Publication date not visible in fetched text", "Global", "About 415 TWh data-centre electricity consumption in 2024", "12% per year over the preceding five years", "IEA estimate; data-centre electricity consumption", "Medium", "Electricity demand is not revenue and the fetched text does not expose the report publication date"]
      - ["International Energy Agency", "2024", "Global", "About 1.5% of global electricity consumption", "Not applicable", "Share of global electricity consumption", "Medium", "Does not isolate AI workloads or commercial provider revenue"]
      - ["International Energy Agency", "2030 Base Case", "Global", "Around 945 TWh data-centre electricity consumption", "Around 15% per year from 2024 to 2030", "IEA scenario projection; data-centre electricity consumption", "Medium", "Scenario-based and subject to uncertainty in efficiency, uptake, and energy-sector bottlenecks"]
      - ["International Energy Agency", "2030 Base Case", "Global", "Just under 3% of total global electricity consumption", "Not applicable", "Share of total global electricity consumption", "Medium", "A limited share of power demand is not a measure of the addressable compute-services market"]
      - ["European High-Performance Computing Joint Undertaking", "Current page snapshot; publication date not visible", "European Union", "19 AI Factories and 13 AI Factory Antennas", "Not applicable", "Official program count for shared AI-compute facilities and support services", "Medium", "Site counts do not measure capacity, spend, utilization, or Volta-eligible demand"]
      - ["Reuters (via U.S. News & World Report)", "2026-08-04", "Norway / Europe", "133 MW deployment at a Bitdeer-operated data centre", "Not applicable", "Reported capacity tied to a six-year cloud-computing agreement", "Medium", "An announced project is not delivered capacity or total addressable spend; Reuters could not verify the reported customer identity"]
      - ["Public evidence in assigned pool", "Current Volta-specific estimate not found", "Volta target markets", "TAM/SAM/SOM not established", "Not established", "No disclosed workload, eligible customer count, pricing, utilization, or geographic filter", "Low", "Requires private commercial and project-level operating evidence"]
    notes: >-
      TWh denotes electricity consumption, not revenue, ARR, funding, or cash
      available. IEA Base Case values are scenario estimates; the report vintage
      was not visible in the retained text. No unsupported dollar TAM or derived
      Volta share is supplied. EuroHPC site counts and the reported project MW
      are access and capacity measures, not additive market revenue.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM012, CM014]
  - id: TM003
    title: Buyer, user, payer, and adoption path
    columns: [Segment, Buyer, User, Payer or budget owner, Current route or trigger, Evidence limitation]
    rows:
      - ["Frontier AI labs", "Frontier AI labs (company-stated target segment)", "Not specified in public sources", "Not disclosed", "Volta describes dedicated-infrastructure access; purchase triggers and contract terms are unavailable", "Reuters reported one Norway agreement but said the customer identity was not independently verified"]
      - ["AI-native companies", "AI-native companies (company-stated target segment)", "Not specified in public sources", "Not disclosed", "Volta describes dedicated-infrastructure access; no adoption path or pricing is documented", "Coverage names the segment but does not quantify paid demand"]
      - ["Enterprises", "Enterprises (company-stated target segment)", "Not specified in public sources", "Not disclosed", "Volta describes dedicated-infrastructure access; procurement triggers are not reported", "No public pricing, procurement cycle, or adoption rate"]
      - ["SMEs and startups in Europe", "SMEs and startups (EuroHPC program audience)", "SME and startup users (program description)", "Free customized support; compute fees are not specified in the fetched text", "Access to AI Factory support and resources; enrollment mechanics are not described", "EuroHPC program availability does not establish demand for Volta or customer conversion"]
      - ["European industry and scientific users", "European industry and scientific institutions", "Industry and scientific users (EuroHPC description)", "Program resources; funding and fees are not specified", "AI-optimised supercomputer resources and support services", "This is a shared public access route, not evidence of Volta-specific purchasing or utilization"]
    notes: >-
      Volta's commercial segments are company-stated targets; public AI Factories
      are shown separately as an alternative access model. Functional users,
      budget owners, contract values, conversion, and segment size remain
      undisclosed. EuroHPC's free-support language is not assumed to mean every
      compute service is free.
    claimRefs: [CM011, CM012, CM013, CM014, CM016]
figures:
  - id: FM001
    title: Data-centre electricity growth and selected contributors
    type: bar
    summary: IEA growth rates and shares of net increase are shown in separate unit panels; this is an infrastructure-demand lens, not a revenue TAM.
    data:
      items:
        - label: Data centres, five years preceding 2024
          value: 12
          unit: "% per year"
          note: Historical rate reported by IEA
        - label: Data centres, 2024-2030 Base Case
          value: 15
          unit: "% per year"
          note: IEA scenario rate
        - label: Accelerated servers, Base Case
          value: 30
          unit: "% per year"
          note: Mainly driven by AI adoption
        - label: Conventional servers, Base Case
          value: 9
          unit: "% per year"
          note: IEA scenario rate
        - label: Other IT equipment share of net increase
          value: 10
          unit: "% of net increase"
          note: Around 10%
        - label: Cooling and other infrastructure share of net increase
          value: 20
          unit: "% of net increase"
          note: Around 20%
    approximationNotes: >-
      IEA reports the contribution shares as around 10% and 20%; the authored
      numeric values retain those qualifications. Growth series have different
      periods and populations, and contribution shares use the net increase as
      their denominator. The panels are not interchangeable and imply no revenue
      sizing or Volta market share.
    claimRefs: [CM003, CM006, CM007, CM008, CM009, CM010]
callouts:
  - calloutType: risk
    title: Revenue-sized SAM/SOM remains unproven
    body: >-
      Electricity-demand scenarios and announced infrastructure commitments do
      not establish Volta's realized revenue opportunity. Underwriting requires
      customer-level workload, pricing, utilization, power-delivery, and project
      financing evidence.
    claimRefs: [CM001, CM004, CM011, CM016]
