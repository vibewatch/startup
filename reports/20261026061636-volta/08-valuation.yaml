  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure-gap
      missingEvidence: Audited recognized revenue, gross margin, customer concentration, cash flow, runway, capex commitments, and project-level economics.
      whyItMatters: Without operating and cash-conversion inputs, neither a defensible valuation range nor target return can be calculated against the reported $2.4 billion financing mark.
      diligencePath: Request audited financial statements, monthly cash and capex schedules, backlog definitions, customer concentration, and project-level return cases under base and downside utilization.
      relatedQuestionRefs: [QV007]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: project-finance
      missingEvidence: Executed Azora program documents, committed and drawable amounts, project-level recourse, pricing, covenants, security, and cash waterfall.
      whyItMatters: A financing program headline is not cash available to Volta; leverage, recourse, and project allocation determine equity dilution and downside exposure.
      diligencePath: Review executed facility and project-company documents, including draw conditions, guarantees, lender priority, covenants, and repayment sources.
      relatedQuestionRefs: [QV002, QV008]
      relatedTableRefs: [TV002, TV003]
    - type: private-evidence-only
      severity: material
      topic: Norway-project
      missingEvidence: Executed customer and site contracts, commissioning milestones, service levels, payment schedule, termination rights, and verified readiness of the 133 MW project.
      whyItMatters: Capacity and contract value do not establish delivered service or cash collection; delays and conditional financing could materially change project returns.
      diligencePath: Obtain customer and site agreements, construction status reports, equipment delivery evidence, commissioning acceptance criteria, and remedies for missed milestones.
      relatedQuestionRefs: [QV003, QV005, QV008]
      relatedTableRefs: [TV002, TV003]
    - type: private-evidence-only
      severity: material
      topic: share-rights
      missingEvidence: Fully diluted cap table and current articles, including share-class economics, liquidation preferences, conversion rights, warrants, and option pool.
      whyItMatters: Share allotment totals and filing titles do not determine dilution or proceeds available to common equity at an exit.
      diligencePath: Reconcile the current fully diluted capitalization with the latest articles, subscription agreements, preference schedule, and option grants.
      relatedQuestionRefs: [QV006, QV008]
      relatedTableRefs: [TV002, TV003]
