        title: Announced capital and contracts are not operating revenue or liquidity
        blocks:
          - type: paragraph
            body: >-
              RoundOS lists a $300 million Series A dated August 5, 2026, while the company launch announcement says its
              Seed and Series A rounds valued Volta at $2.4 billion. The same company announcement describes a $10
              billion strategic partnership for a Norway AI factory, and a separate Azora program intended to provide $5
              billion of project financing. These are different measures: equity raised, a valuation, a customer
              partnership value, and a financing program do not establish recognized revenue or cash available for
              operations. A separate report says lenders were being approached for a debt package, not that it had
              closed.
            claimRefs:
