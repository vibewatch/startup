  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target buyers and disclosed commercial fit
        blocks:
          - type: paragraph
            body: >-
              Volta describes frontier AI labs, AI-native companies, and enterprises as the intended users of dedicated
              AI infrastructure. Its pitch is that these buyers face limited access to capital for building dedicated
              compute, so Volta combines infrastructure financing with powered land, data centers, compute, software,
              and operations. This is a stated customer proposition, not evidence that each segment has purchased or
              deployed capacity. Public evidence identifies one strategic AI-lab agreement, but the company has not
              named the lab in its launch materials. The segmentation table therefore separates intended buyers from the
              anonymous announced counterparty and from the media-reported identity; none of those categories should be
              read as a verified roster of active users.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU015
      - number: '6.2'
        title: Contract scale is not operating adoption
        blocks:
          - type: paragraph
            body: >-
              The launch announcement anchored Volta's customer proof in a strategic partnership valued at $10 billion
              and a planned Norwegian AI factory. Company materials describe the first project as a 133 MW deployment
              and put near-term power capacity across North America and Europe above 1 GW; these are project and
              pipeline measures, not live customer utilization. Separate reporting describes the Tydal campus as
              unfinished, notes remaining construction and conditional financing, and distinguishes facility capacity
              from IT capacity. The announced agreement and scale are meaningful commercial signals, but the available
              sources do not show commissioning, workload volumes, uptime, customer outcomes, renewals, or expansion.
              The trajectory table preserves the reported metric names and dates while marking the operating denominator
              and delivery evidence as gaps.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named customer proof, concentration, and diligence
        blocks:
          - type: paragraph
            body: >-
              Volta's company-issued launch materials refer only to an “AI Lab.” News coverage attributes the contract
              to Anthropic, but the reviewed reporting says neither Volta nor Anthropic has publicly confirmed that
              identity. That distinction matters: a reported anchor relationship can signal demand without proving an
              active production deployment or customer reference. The sources disclose no independently verifiable
              usage, customer outcomes, renewal behavior, or customer-level revenue concentration. Volta's first
              disclosed project also depends on a development partner and on project financing, so customer delivery
              depends on construction and financing milestones as well as compute supply. Before underwriting
              durability, request executed customer and supplier contracts, commissioning evidence, utilization and
              service-level data, customer references, renewal terms, and a customer-level revenue and backlog schedule.
            claimRefs:
              - CU006
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
