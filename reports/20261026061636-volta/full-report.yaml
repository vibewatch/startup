chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Volta emerged from stealth in August 2026 as a company focused on financing, developing, building, and
              operating dedicated AI infrastructure. The company describes an integrated model spanning institutional
              capital, powered land, data centers, compute, software, and operations; independent coverage also
              characterizes its pitch as combining infrastructure finance with GPU-cloud development rather than as a
              conventional software-only business. This is a company-positioned model, not evidence that its cost of
              capital, customer economics, or delivery speed already outperform alternatives. Public launch materials
              place its team across London, Palo Alto, and New York, but do not establish a legal headquarters. The
              available sources identify Ricard Boada as chief executive and Sofia Gumuzio as chief corporate
              development officer. The Next Web reports that both came from Brookfield's infrastructure business;
              governance beyond the named founders is not documented in the retained evidence. The snapshot below
              therefore separates reported figures from operating metrics that remain unavailable.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
              - CO009
              - CO013
              - CO014
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.2'
        title: Capital, investors, and strategic relationships
        blocks:
          - type: paragraph
            body: >-
              August reporting put Volta's seed and Series A funding at about $300 million and its valuation at $2.4
              billion. The Register and The Next Web describe different subsets of round leadership and participation,
              while the company release names Azora, Andreessen Horowitz, Altimeter, and NVIDIA as leads and names the
              Michael Dell family office and Matter Venture Partners among strategic investors. Those attributions
              should not be collapsed into a single verified cap table. The separate $5 billion AI Infrastructure
              Program is described as financing for future projects, not as equity raised or cash available to Volta.
              The Norway project is linked to Bitdeer and an unnamed AI lab through a six-year, $10 billion compute
              commitment; Volta's spokesperson told The Register it could not officially confirm the lab's identity and
              characterized the relationship as commercial rather than an investment. Thus announced commitments and
              investor backing establish strategic intent, but do not establish deployed capacity, recognized revenue,
              or financing availability on project-specific terms. A Daily.dev summary instead calls the Norway site 121
              MW and reports a 16-year Bitdeer lease, roughly $4.7 billion and extendable to $8 billion, with
              termination only at year ten. Those details conflict with or go beyond other assigned reporting and remain
              diligence leads, not verified contract terms.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO012
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Milestones, scale, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              The disclosed milestones cluster around Volta's August 2026 launch: financing and valuation claims, an
              Azora program, a first Norway project, an asserted pipeline exceeding 1 GW, and a target of multiple
              gigawatts by 2030. The company also says it acquired Genesis Cloud technology earlier in 2026, but the
              assigned sources do not give a transaction date or deployment outcomes. These announcements are not
              equivalent to operating capacity or customer results. The launch materials describe around 100
              professionals across three cities, an issuer-reported estimate rather than an independently audited
              headcount. The retained sources do not quantify recognized revenue, ARR, gross margin, customer count,
              cash burn, runway, or board composition. A Tech Insider page presents a chronology concern: its displayed
              August publication timestamp predates an October loan event described in its text. That account, like the
              Daily.dev lease and capacity summary, is a diligence lead rather than verified financing or contract
              evidence. The assigned pool also does not establish legal or regulatory status, commissioning, or a
              complete adverse-event history; that is a coverage gap, not proof that no such issues exist.
            claimRefs:
              - CO010
              - CO011
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO004
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
