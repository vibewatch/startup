              - CI008
              - CI012
              - CI014
      - number: '4.4'
        title: Capital adequacy remains unproven at project level
        blocks:
          - type: paragraph
            body: >-
              A daily.dev report says JPMorgan was approaching lenders for a $5 billion debt package and describes a
              six-year compute agreement alongside a longer Bitdeer site lease; those terms are single-source reporting
              and should not be treated as executed financing or verified contract economics. The report's 121 MW figure
              also differs from the company's 133 MW announcement. Companies House shows the UK entity's first statutory
              accounts are not due until September 2027, so the registry does not yet supply operating financials.
              Without cash, burn, covenants, draw conditions, project capex, and termination protections, equity raised
              and proposed facilities cannot establish runway or debt capacity.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product proposition and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Volta describes its product as dedicated AI infrastructure for frontier AI labs, AI-native companies and
              enterprises, rather than as a software-only cloud service. Its stated proposition is to develop, finance,
              build and operate AI factories, tying capacity access to project capital and infrastructure delivery. The
              public materials frame the customer problem as securing dedicated compute without independently assembling
              powered land, data centers, hardware, software and operations. This is a company-described value
              proposition, not evidence that delivered capacity is cheaper, faster or more reliable than alternatives.
              The sources do not provide customer-specific workflow maps, deployment timelines, integration
              specifications, service levels or measured customer outcomes; those remain gating diligence items.
            claimRefs:
              - CE001
              - CE002
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE010
              - CE014
      - number: '5.2'
        title: Company-described stack and product modules
        blocks:
          - type: paragraph
            body: >-
              The current company website organizes its offer into six layers: capital, power, data centers, compute,
              software and operations. It describes infrastructure financing and power procurement alongside self-built
              or partner facilities, dedicated NVIDIA systems, in-house provisioning/orchestration software and an
              accountable operating team. The architecture figure captures this disclosed organization only; it does not
              establish that each layer is owned, deployed or integrated at a live customer site. Public reporting adds
              that Volta acquired Genesis Cloud technology for public-cloud and bare-metal cluster management, but the
              available descriptions do not include product documentation, APIs, architecture diagrams, supported
              integrations, or operational test results. The module matrix therefore separates stated scope from
              maturity and evidence gaps.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE010
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE010
      - number: '5.3'
        title: Deployment evidence and maturity
        blocks:
          - type: paragraph
            body: >-
              Launch coverage reports a six-year, $10 billion strategic compute partnership and a 133 MW Norway project
              using NVIDIA Vera Rubin systems; the company website also currently advertises 130 MW+ of gross contracted
              power, a 1 GW+ near-term power pipeline and a 100,000+ GPU pipeline. These are differently named company
              or third-party-reported measures, not interchangeable counts of installed or customer-available capacity.
              One lower-confidence report instead describes a 121-megawatt hydro-powered campus, and no source in this
              pool reconciles the measurement bases. Public accounts describe the Norway site as a project being
              developed, not as a commissioned Volta service with published acceptance or performance results. The gap
              between announced scale and verified operating capacity is material to product maturity.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
      - number: '5.4'
        title: Execution, reliability and trust diligence
        blocks:
          - type: paragraph
            body: >-
              Volta’s integrated model may reduce handoffs if the company can coordinate financing, power, construction,
              hardware and software under one operating plan; that is its stated design thesis, not demonstrated
              customer performance. The company site says compute is provisioned through automation “targeting 100%
              where the industry sits nearer 90%,” but does not name the measure, period, service boundary, exclusions
              or contractual remedy. Daily.dev separately reports a 16-year Bitdeer lease with a termination right only
              at year ten and a financing package under discussion; treat these as adverse reported terms, not verified
              contract facts. The reviewed public material does not disclose detailed security, privacy, compliance,
              export-control, certification, incident-response or support controls. Obtain executed contracts,
              commissioning records, SLO/SLA history, architecture and security documentation, and customer references
              before treating the platform as production-proven.
            claimRefs:
              - CE011
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE010
              - CE011
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product differentiation is also execution concentration
            body: >-
              Volta’s pitch integrates capital and physical delivery with cloud operations, but that design makes the
              investment case depend on successful coordination across financing, power, construction, hardware and
              software.
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
              - CE014
          - type: callout
            title: Announced scale is not operating proof
            body: >-
              The source pool contains announced pipeline and project figures but no site-level commissioning, delivered
              capacity, service history or defined uptime results.
            calloutType: risk
            claimRefs:
              - CE003
              - CE004
              - CE005
