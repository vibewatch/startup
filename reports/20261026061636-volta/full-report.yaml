      - Valuation / return logic
      - Probability signal and trigger
    rows:
      - - Bull
        - >-
          The Norway project commissions on schedule; the customer contract converts to collected cash; project capital
          is available on non-recourse or otherwise bounded terms.
        - >-
          No numeric value range is supportable until revenue, utilization, margins, debt service, and dilution are
          verified; upside would require project returns that justify the reported mark.
        - Unproven; upgrade only after commissioning and audited project economics.
      - - Base
        - >-
          The announced project and financing program progress, but timing, financing terms, operating performance, and
          ownership dilution remain opaque.
        - Use $2.4B only as the reported financing reference, not intrinsic value; no defensible return estimate.
        - Current evidence-weighted case; remain research-more pending primary diligence.
      - - Bear
        - >-
          Construction or financing conditions delay service; costs, contract remedies, or customer concentration weaken
          cash conversion; share rights add dilution or preference overhang.
        - >-
          Downside value cannot be quantified without debt, lease, customer, and cap-table terms; avoid false-precision
          ranges.
        - >-
          Material downside; trigger reassessment on missed milestones, failed financing conditions, or adverse contract
          disclosures.
    notes: >-
      These are conditional decision cases, not forecasts. Numeric valuation ranges and probabilities are omitted
      because the public evidence does not provide the underlying operating, financing, or capitalization inputs.
