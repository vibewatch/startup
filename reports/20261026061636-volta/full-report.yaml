        title: Public evidence does not permit unit-economics underwriting
        blocks:
          - type: paragraph
            body: >-
              The retained company announcement and profiles do not state a compute price per GPU-hour, contract
              minimum, utilization, discount, or customer mix. Nor do they report recognized revenue, ARR, gross margin,
              power costs, hardware depreciation, sales-cycle duration, CAC, or payback. The $10 billion agreement is a
              reported contract or partnership value, not a reported revenue figure; the assigned sources provide no
              recognition schedule to translate it into a period measure. The tables separate disclosed facts from
              unavailable inputs and identify the contracts and operating records needed to test gross profit and sales
              efficiency.
            claimRefs:
              - CI006
              - CI007
              - CI012
              - CI014
          - type: table
