        label: Reported compute or site role
        min: 0
        max: 2
        lowLabel: Not established
        highLabel: Customer-facing compute/cloud
        description: "0=not established in this pool; 1=AI infrastructure or site role; 2=explicit compute/cloud capacity. This is evidence coding, not performance."
      yAxis:
        label: Reported financing role
        min: 0
        max: 2
        lowLabel: Not established
        highLabel: Dedicated or transaction financing
        description: "0=not established in this pool; 1=capital raise reported; 2=dedicated financing or named lease/credit structure. This is not a credit-quality score."
