          x: 2
          y: 0
        - label: SpaceX
          x: 2
          y: 0
        - label: Bitdeer
          x: 1
          y: 2
        - label: Firmus
          x: 1
          y: 1
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP010, CP011, CP014]
