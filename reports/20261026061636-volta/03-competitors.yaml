      - [Bitdeer, "Infrastructure partner and adjacent operator", "StockAnalysis transcript extract reports Q2 2026 AI Cloud ARR of $76M, up 77% QoQ", "Volta tenant and technology partners are identified at the Norway site; excerpt also describes Bitdeer AI Cloud", "Reported 16-year Norway lease valued at $4.7B; excerpt cites $1.3B credit support", "Partner, landlord, and adjacent compute roles overlap; transcript summary is not a full competitor disclosure"]
