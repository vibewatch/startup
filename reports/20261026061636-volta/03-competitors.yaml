  - id: TP003
    title: Commercial durability and diligence comparison
    columns: [Dimension, What the assigned sources establish, Competitive implication, Diligence required]
    rows:
      - ["Price and savings", "Volta describes transparent pricing and lower cost of capital as goals; no realized price or rival tariff is provided", "Differentiation is a financing thesis, not a demonstrated TCO win", "Obtain comparable delivered-cost schedules by GPU-hour, power, networking, support, and utilization"]
      - ["Contract duration and flexibility", "TechCrunch reports a six-year compute arrangement; StockAnalysis extract reports a 16-year Bitdeer lease", "Long-lived infrastructure commitments may not match customer-contract duration", "Review termination rights, take-or-pay exposure, capacity remedies, and assignment provisions"]
      - ["Switching and multi-homing", "No customer switching, renewal, portability, or multi-homing evidence in the assigned pool", "Lock-in and customer dependence cannot be credited or ruled out", "Request customer-level renewal, migration, and multi-provider usage data"]
      - ["Partner and supply access", "Volta's Norway project involves Bitdeer and NVIDIA systems; company says its pipeline exceeds 1 GW", "Project execution depends on partner delivery and site/power readiness; pipeline is not deployed capacity", "Verify power, equipment allocation, commissioning milestones, and partner remedies"]
      - ["Financing and execution risk", "Daily.dev reports a proposed $5B lender package; its details are not corroborated by other assigned sources", "Potential leverage and lease mismatch warrant verification, not a conclusion about distress", "Obtain signed financing documents, committed versus proposed amounts, and debt-service/covenant cases"]
    notes: >-
      Coverage is limited to the cited public reports and company statements. Reported transaction amounts, target capacity, lease terms, and financing proposals have different status and denominators; they should not be combined into a single capital or revenue metric.
    claimRefs: [CP002, CP003, CP004, CP005, CP010, CP011, CP012, CP013, CP014]
