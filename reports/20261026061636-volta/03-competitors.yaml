      Sources: Volta's August 2026 release via Yahoo Finance, Data Centre Magazine, WOWTALE, TechCrunch, StockAnalysis, CompaniesMarketCap, and MarketBeat. Company plans and funding announcements are not commissioned capacity or cash available. Bitdeer ARR is retained as ARR for Q2 2026, not revenue. CoreWeave market-cap observations are dated separately and are not directly comparable to Volta's private valuation.
