      - [Firmus, "Emerging AI-infrastructure entrant", "WOWTALE reports a $2B raise", "Described as an Australian player in the AI-factory race; detailed target segment and product scope unavailable", "No prices or contract model reported in the assigned sources", "Single-source competitor characterization; operating capacity and delivery status are unverified"]
