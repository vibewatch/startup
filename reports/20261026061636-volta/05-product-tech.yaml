    title: Volta’s company-described AI-factory stack
    type: stack
    summary: The company presents six connected layers, from capital and powered sites through compute, software and operations.
    data:
      layers:
        - label: Capital
          detail: Institutional-grade capital and the Azora AI Infrastructure Program.
          items: ["Institutional infrastructure capital"]
        - label: Power
          detail: Near-term capacity through powered land, partnerships and power contracting.
          items: ["Powered land and power contracting"]
        - label: Data centers
          detail: Gigascale campuses developed by Volta or with strategic partners.
          items: ["Self-built facilities and strategic partners"]
        - label: Compute
          detail: Dedicated GPU systems, including NVIDIA Vera Rubin systems reported for Norway.
          items: ["Dedicated NVIDIA systems and customer configurations"]
        - label: Software
          detail: In-house provisioning, orchestration and automation, plus reported Genesis Cloud technology.
          items: ["Provisioning, orchestration and automation"]
        - label: Operations
          detail: A company-described accountable team developing, financing and operating each factory.
          items: ["Factory development, financing and operations"]
    claimRefs: [CE001, CE010]
callouts:
  - calloutType: insight
    title: Product differentiation is also execution concentration
    body: >-
      Volta’s pitch integrates capital and physical delivery with cloud operations, but
      that design makes the investment case depend on successful coordination across
      financing, power, construction, hardware and software.
    claimRefs: [CE001, CE005, CE014]
  - calloutType: risk
    title: Announced scale is not operating proof
    body: >-
      The source pool contains announced pipeline and project figures but no site-level
      commissioning, delivered capacity, service history or defined uptime results.
    claimRefs: [CE003, CE004, CE005, CE011, CE014]
