evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Recognized revenue, ARR, gross margin, cash burn, runway, customer count, customer concentration, secondary
      transactions, debt or credit facilities, and actual drawdowns from the Azora program.
    whyItMatters: >-
      Funding raised, financing programs, and contract value do not establish realized revenue, available liquidity,
      leverage, unit economics, or diversification.
    diligencePath: >-
      Request audited financial statements, a monthly operating model, customer-level revenue and backlog schedules,
      cap-table and secondary records, executed debt or facility documents, and cash-runway reconciliation.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete board, executive roster, ownership, governance rights, and key-person succession arrangements.
    whyItMatters: >-
      Named founders alone do not establish oversight, control, functional coverage, or continuity for a
      capital-intensive buildout.
    diligencePath: >-
      Obtain the current organization chart, board and committee materials, cap table, investor rights, and succession
      plans.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: company-identity
    missingEvidence: Legal headquarters, incorporation jurisdiction, legal entity structure, and exact founding date.
    whyItMatters: Office datelines do not establish domicile, contracting entity, or regulatory and governance obligations.
    diligencePath: Review corporate registry filings, entity organization chart, and current principal-office disclosure.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: norway-project
    missingEvidence: >-
      Executed customer and site agreements, a reconciled 121 MW versus 133 MW capacity definition, lease duration and
      termination terms, construction schedule, committed power, commissioning evidence, and uptime or customer-outcome
      data.
    whyItMatters: >-
      Announced capacity and a short secondary summary do not establish delivery, utilization, enforceable obligations,
      service performance, or project economics.
    diligencePath: >-
      Obtain executed customer, site, lease, and financing documents; reconcile facility versus delivered-compute
      capacity and verify grid, construction, commissioning, and service-level evidence.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-milestones
    missingEvidence: >-
      Dated product, commissioning, regulatory-status, leadership-change, and adverse-event records beyond the August
      2026 launch announcements.
    whyItMatters: The assigned pool concentrates on launch claims and does not establish a complete operating or risk history.
    diligencePath: >-
      Reconcile company and registry records with independent reporting for subsequent financing, product, regulatory,
      and operating milestones.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: Volta-specific SAM and SOM
    missingEvidence: >-
      Customer-level workloads, eligible demand by geography, contracted and realized pricing, utilization,
      commissioning schedules, power access, customer concentration, and project financing are not available in the
      assigned public evidence.
    whyItMatters: >-
      Global electricity-demand estimates and announced project commitments cannot establish Volta's revenue
      opportunity, share, or conversion from pipeline to operating capacity.
    diligencePath: >-
      Obtain a customer- and project-level data room showing signed capacity, workload and utilization profiles,
      contracted pricing and term, powered site status, capex and financing sources, and realized commissioning
      milestones; reconcile it to recognized revenue and cash collections.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-switching-gaps
    missingEvidence: >-
      Comparable realized prices, customer-level switching and multi-homing data, renewal terms, and measured
      delivered-cost outcomes for Volta and alternative providers.
    whyItMatters: >-
      Without common commercial units and buyer behavior, the financing proposition cannot be distinguished from a
      durable cost, retention, or distribution advantage.
    diligencePath: >-
      Request redacted customer contracts, workload-level price schedules, renewal and migration data, and matched TCO
      analyses against cloud and internal-build alternatives.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
      - TP003
  - type: conflicting-data
    severity: minor
    topic: coreweave-market-cap
    missingEvidence: A consistently dated CoreWeave market-cap series and the providers' share-count and pricing methodology.
    whyItMatters: >-
      CompaniesMarketCap and MarketBeat show different values on October 25 and October 23, respectively, limiting
      precision in any public-scale comparison.
    diligencePath: Reconcile the values to the same market close and share-count basis before using them in a valuation comparison.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: execution-risk
    missingEvidence: >-
      Signed and committed financing documents, partner delivery obligations, site commissioning milestones, and
      customer uptime/security evidence.
    whyItMatters: >-
      Volta's differentiating model combines capital and long-lived infrastructure commitments, so financing
      availability and operational execution determine whether announced capacity can serve customers.
    diligencePath: >-
      Verify lender commitments and covenants, lease termination and remedies, power/equipment delivery, commissioning
      tests, and customer security and service-level terms.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash, monthly burn, unrestricted liquidity, committed and drawn debt, covenants, and downside runway.
    whyItMatters: >-
      Equity raised and announced financing programs do not show resources currently available to complete projects or
      meet obligations.
    diligencePath: >-
      Obtain current management accounts, bank confirmations, a 24-month cash forecast, debt term sheets, covenant
      schedules, and downside sensitivities.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Recognized revenue, realized contract pricing, utilization, gross margin, customer acquisition cost, payback, and
      customer concentration.
    whyItMatters: >-
      Without period revenue and project-level contribution economics, the announced partnership and valuation cannot be
      translated into revenue quality or cash generation.
    diligencePath: >-
      Request audited financial statements, customer contracts, revenue-recognition policies, customer-level cohorts,
      utilization reports, and project gross-profit bridges.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI002
      - TI003
