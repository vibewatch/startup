artifact: financials
slug: volta
runDate: "2026-10-26"
company:
  name: Volta
chapter:
  number: 4
  title: Financials
  summary: >-
    Volta's disclosed model combines infrastructure capital, site development,
    compute, software, and operations, but public materials do not establish
    recognized revenue, realized pricing, margins, cash, or runway. A reported
    debt package and long site-lease exposure make project-level contract and
    financing diligence central to underwriting.
sections:
  - id: infrastructure-revenue-model
    title: An infrastructure conversion model, not yet a disclosed earnings engine
    body: >-
      Volta describes a vertically integrated model that joins institutional
      capital with powered land, data centers, compute, software, and operating
      capability. Its commercial proposition is dedicated AI capacity for AI
      labs, AI-native companies, and enterprises; company materials describe
      these stages but do not provide a realized price, utilization level, or
      gross-profit bridge. The announced Norway project gives the model a
      concrete anchor, although public descriptions disagree on capacity and
      do not show the revenue-recognition schedule. The flow below is therefore
      a disclosed operating sequence, not evidence that every stage is
      commissioned or profitable.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI013
    figureRefs:
      - FI001
  - id: announced-financing-and-commercial-traction
    title: Announced capital and contracts are not operating revenue or liquidity
    body: >-
      RoundOS lists a $300 million Series A dated August 5, 2026, while the
      company launch announcement says its Seed and Series A rounds valued
      Volta at $2.4 billion. The same company announcement describes a $10
      billion strategic partnership for a Norway AI factory, and a separate
      Azora program intended to provide $5 billion of project financing. These
      are different measures: equity raised, a valuation, a customer
      partnership value, and a financing program do not establish recognized
      revenue or cash available for operations. A separate report says lenders
      were being approached for a debt package, not that it had closed.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI008
    tableRefs:
      - TI001
  - id: pricing-and-unit-economics
    title: Public evidence does not permit unit-economics underwriting
    body: >-
      The retained company announcement and profiles do not state a compute
      price per GPU-hour, contract minimum, utilization, discount, or customer
      mix. Nor do they report recognized revenue, ARR, gross margin, power
      costs, hardware depreciation, sales-cycle duration, CAC, or payback.
      The $10 billion agreement is a reported contract or partnership value,
      not a reported revenue figure; the assigned sources provide no
      recognition schedule to translate it into a period measure. The tables
      separate disclosed facts from unavailable inputs and identify the
      contracts and operating records needed to test gross profit and sales
      efficiency.
    claimRefs:
      - CI006
      - CI007
      - CI012
      - CI014
    tableRefs:
      - TI002
      - TI003
  - id: capital-adequacy-and-underwriting-risk
    title: Capital adequacy remains unproven at project level
    body: >-
      A daily.dev report says JPMorgan was approaching lenders for a $5 billion
      debt package and describes a six-year compute agreement alongside a
      longer Bitdeer site lease; those terms are single-source reporting and
      should not be treated as executed financing or verified contract
      economics. The report's 121 MW figure also differs from the company's
      133 MW announcement. Companies House shows the UK entity's first
      statutory accounts are not due until September 2027, so the registry
      does not yet supply operating financials. Without cash, burn, covenants,
      draw conditions, project capex, and termination protections, equity
      raised and proposed facilities cannot establish runway or debt capacity.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
tables:
  - id: TI001
    title: Disclosed revenue mechanism and financing signals
    columns:
      - Stream or capital item
      - Public evidence
      - Underwriting interpretation
      - Diligence request
    rows:
      - - Dedicated AI compute
        - "$10B strategic partnership announced; one report says six years."
        - "Partnership value is not recognized revenue; no billing or recognition schedule is shown."
        - "Obtain executed customer contract, payment milestones, utilization commitments, and recognition policy."
      - - AI-factory project financing
        - "$5B Azora AI Infrastructure Program announced for future projects."
        - "A program is not evidence of drawn funds, cash on hand, or project-level recourse."
        - "Review facility documentation, committed versus available amount, draw conditions, fees, and security."
      - - Seed and Series A equity
        - "RoundOS lists a $300M Series A; company launch materials state a $2.4B valuation for Seed and Series A."
        - "Capital raised and valuation do not show current liquidity or the amount remaining after deployment."
        - "Request round closing documents, proceeds use, current cash, and a sources-and-uses schedule."
      - - Software and operating services
        - "Company materials describe software and operations within the platform; no separate sales or margin figures are provided."
        - "No evidence establishes a standalone software subscription or recurring-revenue mix."
        - "Request revenue by product, service-delivery costs, customer concentration, and renewal terms."
    notes: >-
      Announced amounts and third-party reported terms retain their stated
      attribution and status. In particular, the $10B partnership value is not
      treated as recognized revenue, and the $5B program is not treated as
      cash available. The table is partial coverage of public disclosures.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI008
  - id: TI002
    title: Pricing and contract economics disclosed versus missing
    columns:
      - Metric
      - Publicly available value
      - Confidence or limitation
      - Diligence request
    rows:
      - - Compute unit price
        - null
        - "No per-GPU-hour, reserved-capacity, or other realized price appears in the assigned company materials."
        - "Obtain list and realized pricing by hardware, term, utilization, and customer."
      - - Contract term and value
        - "$10B partnership value; six-year term reported by daily.dev."
        - "Term detail is single-source reporting; the amount is not a revenue-recognition schedule."
        - "Reconcile signed term, minimum payments, delivery milestones, and termination rights."
      - - Customer mix and concentration
        - "Company materials name AI labs, AI-native companies, and enterprises; no customer mix is reported."
        - "The announced AI-lab project does not establish diversified revenue or customer concentration."
        - "Request revenue and backlog by customer, pipeline conversion, and anchor-customer concentration."
    notes: >-
      Null means no value was disclosed in the cited assigned sources, not zero.
      Public segment descriptions are not evidence of a realized customer mix.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI009
  - id: TI003
    title: Unit-economics and liquidity inputs required for underwriting
    columns:
      - Metric
      - Public value
      - Why it matters
      - Current evidence limitation
      - Diligence request
    rows:
      - - Recognized revenue, ARR, and gross margin
        - null
        - "Separates contracted potential from revenue quality and contribution economics."
        - "No period revenue, ARR, or gross-margin figure appears in the assigned materials."
        - "Request audited statements, monthly revenue bridge, deferred revenue, and gross-profit reconciliation."
      - - Power, lease, equipment, and delivery costs
        - null
        - "Determines project-level gross profit and exposure to construction or utilization delays."
        - "No project cost schedule or quantified cost-of-service disclosure was retained."
        - "Request site capex, power pricing, lease obligations, GPU financing, depreciation, and operating costs."
      - - CAC, sales cycle, and payback
        - null
        - "Tests how quickly customer acquisition converts into cash generation."
        - "No acquisition-cost, sales-cycle, or payback measure is reported."
        - "Request cohort-level sales and marketing spend, contract conversion, and payback calculations."
      - - Cash, burn, runway, and committed debt
        - null
        - "Establishes capital adequacy and refinancing risk during project delivery."
        - "Assigned sources do not establish cash or burn; debt reporting describes lenders being approached."
        - "Request current cash, monthly burn, debt term sheets, covenants, draw status, and downside runway."
    notes: >-
      Null values are unsupported quantities, not zero. No ARR, revenue, cash,
      burn, margin, or CAC estimate is inferred from funding raised, project
      values, or third-party reported financing.
    claimRefs:
      - CI007
      - CI008
      - CI012
      - CI014
