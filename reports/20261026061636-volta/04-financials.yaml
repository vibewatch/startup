          detail: "Included in the company-described platform; separate economics are not disclosed."
        - id: customer-contract
          label: Contracted customer capacity
          detail: "A $10B strategic partnership was announced; detailed payment terms are unavailable."
        - id: revenue-gross-profit
          label: Recognized revenue and gross profit
