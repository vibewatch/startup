companyProfile:
  summary: >-
    Volta is a private AI-infrastructure company that says it develops, finances, builds, and operates AI factories by
    integrating institutional capital, powered land, data centers, compute, software, and operations. Its public launch
    materials describe Seed and Series A financing, a separate Azora project-financing program, and a planned Norway
    AI-factory partnership. The public record does not establish realized revenue, operating performance, available
    project financing, or a verified customer roster.
