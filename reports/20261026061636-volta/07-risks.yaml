company:
  name: Volta
chapter:
  number: 7
  title: Risks
  summary: Volta's disclosed Norway project and financing model create material execution, contract-tenor, capital-availability, and counterparty questions, while its public project figures are not yet evidence of operating capacity. The assigned evidence also identifies EU AI Act obligations whose application to Volta depends on its role in specific systems; several critical mitigations remain unverified.
sections:
  - id: financing-and-contract-risk
    title: Financing, contract tenor, and concentration
    body: >-
      Volta's company-issued launch announcement describes a $10 billion strategic partnership with an unnamed AI lab for a 133 MW Norway development alongside Bitdeer, and an Azora program offering up to $5 billion for future factories (CR001, CR002). These are announced arrangements, not proof that project capital is drawable or that contracted cash flows cover the full asset life. a16z, a Volta Series A co-lead, says the project was assembled without a hyperscaler or NVIDIA backstop; that is an investor account, not independent verification (CR004). Separately, daily.dev reports a $5 billion lender package under discussion and a six-year customer agreement against a 16-year Bitdeer lease, with termination only at year ten (CR005). That adverse report is a single-source account and the executed documents are unavailable. Underwrite no debt availability, lease matching, or customer diversification until contracts and financing commitments are reviewed.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
    tableRefs:
      - TR003
  - id: delivery-and-operating-readiness
    title: Delivery, commissioning, and operating risk
    body: >-
      Volta describes the Norway deployment as the first project in a pipeline exceeding 1 GW of near-term power capacity and targets multiple gigawatts by 2030; those are company-reported pipeline and target figures, not commissioned capacity (CR003). The reported site size is inconsistent: the company-issued launch materials say 133 MW, while daily.dev says 121 MW, and the assigned evidence does not reconcile the difference (CR006). This is a material diligence issue because project sizing feeds power, equipment, financing, and delivery assumptions. The available sources do not establish commissioning dates, achieved uptime, service remedies, security controls, or actual operating performance (CR011). Treat delivery and reliability mitigations as unverified; require an independently validated project schedule, capacity definition, commissioning acceptance criteria, uptime history or targets, and customer remedies before assigning a lower residual risk.
    claimRefs:
      - CR003
      - CR006
      - CR011
    tableRefs:
      - TR002
  - id: regulatory-and-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      Skadden's May 2026 update reports that EU lawmakers agreed to defer certain high-risk AI Act duties to December 2027 or August 2028, while the remaining transparency obligations were due to apply from 2 August 2026 and be enforced primarily by national regulators (CR007, CR008). The legal exposure for Volta is conditional: the assigned sources do not establish whether Volta acts as an AI-system provider or deployer, which products or customers trigger obligations, or how responsibilities are allocated contractually (CR009, CR010). A CMS Q&A marked last updated in July 2025 describes broader AI Act obligations but predates the cited 2026 changes, so it is background rather than current timing authority (CR009). No conclusion about non-compliance or enforcement is supported. Obtain counsel's product-by-product role assessment and current jurisdictional analysis, and test customer, privacy, security, export-control, and permitting obligations against executed agreements.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
    tableRefs:
      - TR001
  - id: risk-priorities-and-diligence
    title: Risk priorities and diligence gates
    body: >-
      The highest-priority diligence is to reconcile the Norway project's capacity and contract tenor, verify financing sources and draw conditions, and establish what has reached construction or commissioning. The public record in this assigned pool identifies an AI-lab counterparty, Bitdeer site involvement, Azora's announced financing program, and NVIDIA technology, but does not quantify counterparty concentration or demonstrate that announced capacity is operational (CR001, CR002, CR003, CR012). Reported lender discussions and lease terms should be treated as unverified until matched to primary documents (CR005). Monitor executed debt commitments, customer credit and renewal/termination protections, power delivery milestones, commissioned MW, uptime, and incident reporting. If Volta cannot show a financeable project-level capital stack, committed offtake that survives the asset's debt and lease schedule, and measurable operating controls, retain high residual execution risk rather than treating pipeline or funding headlines as proof of mitigation.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR012
      - CR013
    figureRefs:
      - FR001
