    title: Do not equate announced capital with project liquidity
    body: "The up-to-$5 billion Azora program and reported lender discussions do not establish project-level availability, draw conditions, or cash on hand; obtain executed commitments and the integrated debt/offtake/lease schedule before underwriting delivery risk."
