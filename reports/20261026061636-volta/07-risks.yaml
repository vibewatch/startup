        - Announced 133 MW deployment; no commissioning evidence in assigned sources
        - Unknown
        - High
        - Site and technology partners are named; schedule controls are not evidenced
        - High / unverified
        - Validate permits, power delivery, construction milestones, acceptance tests, and remedies
      - - Project capacity or scope mismatch
        - Company release says 133 MW; daily.dev reports 121 MW
        - Reported discrepancy
        - Material
        - No reconciliation in assigned sources
        - Unresolved
        - Confirm gross versus net capacity and the executed project design
      - - Customer-contract and asset-tenor mismatch
        - daily.dev reports six-year customer term versus 16-year Bitdeer lease and year-ten termination
        - Unverified single-source report
        - High
        - No executed contract or debt package reviewed
        - High / unverified
        - Inspect lease, offtake, debt maturity, covenants, termination, and recourse provisions
      - - Uptime, cyber, and operational-control failure
        - Assigned evidence does not specify achieved uptime, SLAs, incident history, or security controls
        - Unknown
        - High
        - Not evidenced in assigned materials
        - Unknown; do not infer absence of incidents
        - Review independent commissioning, resilience tests, security attestations, and incident disclosures
    notes: "Rows distinguish company-announced plans from one adverse secondary report. Qualitative severity is a diligence screen; missing public evidence does not establish that controls or incidents are absent."
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR011
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty and role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation maturity and residual exposure
      - Diligence path
    rows:
      - - Anchor customer and project offtake
        - Unnamed AI lab; announced strategic partnership for first Norway project
        - One disclosed anchor for this project; portfolio-wide concentration is unknown
        - Customer delay, termination, credit deterioration, or insufficient contracted demand
        - High
        - Public announcement only; contract protections and alternatives are unverified
        - Review executed offtake, credit support, take-or-pay terms, termination rights, and replacement demand
      - - Site, equipment, and cloud-platform partners
        - Bitdeer site involvement; NVIDIA systems/platform described in company materials
        - Project-specific dependency disclosed; fallback capacity is unknown
        - Site, power, equipment, or platform delay disrupts commissioning
        - High
        - Partners are named, but responsibility allocation and contingency plans are not disclosed
        - Review supply, site, power, support, step-in, and substitution rights
      - - Project capital providers
        - Azora program announced up to $5 billion; daily.dev separately reports lender discussions
        - Program-to-project allocation and relationship to reported debt package are unclear
        - Funding delayed, repriced, conditioned, or unavailable when project milestones require cash
        - High
        - Announced capital sources are not verified draw-ready financing
        - Obtain executed commitments, draw conditions, intercreditor terms, and downside liquidity plan
    notes: "Partner roles are drawn from company-issued announcements and attributed secondary reporting; concentration, contract terms, and fallback rights remain unquantified."
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR012
      - CR013
