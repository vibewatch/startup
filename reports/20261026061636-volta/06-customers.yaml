company:
  name: Volta
chapter:
  number: 6
  title: Customers
  summary: Volta has announced a $10 billion strategic AI-lab partnership tied to a planned Norway facility, while media reports identify Anthropic as the customer without confirmation from either party. Public evidence describes a large development pipeline and financing model, but does not establish commissioned capacity, customer outcomes, retention, or customer concentration.
sections:
  - id: buyer-segments
    title: Target buyers and disclosed commercial fit
    body: >-
      Volta describes frontier AI labs, AI-native companies, and enterprises as the intended users of dedicated AI infrastructure. Its pitch is that these buyers face limited access to capital for building dedicated compute, so Volta combines infrastructure financing with powered land, data centers, compute, software, and operations. This is a stated customer proposition, not evidence that each segment has purchased or deployed capacity. Public evidence identifies one strategic AI-lab agreement, but the company has not named the lab in its launch materials. The segmentation table therefore separates intended buyers from the anonymous announced counterparty and from the media-reported identity; none of those categories should be read as a verified roster of active users.
    claimRefs: [CU001, CU002, CU003, CU015]
    tableRefs: [TU001]
  - id: adoption-and-deployment
    title: Contract scale is not operating adoption
    body: >-
      The launch announcement anchored Volta's customer proof in a strategic partnership valued at $10 billion and a planned Norwegian AI factory. Company materials describe the first project as a 133 MW deployment and put near-term power capacity across North America and Europe above 1 GW; these are project and pipeline measures, not live customer utilization. Separate reporting describes the Tydal campus as unfinished, notes remaining construction and conditional financing, and distinguishes facility capacity from IT capacity. The announced agreement and scale are meaningful commercial signals, but the available sources do not show commissioning, workload volumes, uptime, customer outcomes, renewals, or expansion. The trajectory table preserves the reported metric names and dates while marking the operating denominator and delivery evidence as gaps.
    claimRefs: [CU004, CU005, CU007, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named customer proof, concentration, and diligence
    body: >-
      Volta's company-issued launch materials refer only to an “AI Lab.” News coverage attributes the contract to Anthropic, but the reviewed reporting says neither Volta nor Anthropic has publicly confirmed that identity. That distinction matters: a reported anchor relationship can signal demand without proving an active production deployment or customer reference. The sources disclose no independently verifiable usage, customer outcomes, renewal behavior, or customer-level revenue concentration. Volta's first disclosed project also depends on a development partner and on project financing, so customer delivery depends on construction and financing milestones as well as compute supply. Before underwriting durability, request executed customer and supplier contracts, commissioning evidence, utilization and service-level data, customer references, renewal terms, and a customer-level revenue and backlog schedule.
    claimRefs: [CU006, CU008, CU013, CU014]
    tableRefs: [TU003]
