    claimRefs: [CU001, CU003, CU006, CU015]
  - id: TU002
    title: Customer adoption and deployment evidence
    columns: [Metric, Value and period, Source basis, Confidence, Customer implication, Missing denominator or qualification]
    rows:
      - ["Strategic AI-lab agreement", "$10 billion; six-year term reported in 2026", "Volta launch announcement and media reports", "Medium: announcement is company-issued; term and customer identity are media-reported", "Large stated commercial commitment", "Executed contract, take-or-pay terms, revenue recognition, start date, and realized delivery not disclosed"]
      - ["Norway project capacity", "133 MW deployment announced; August 2026", "Volta launch materials, relayed by Yahoo Finance and other coverage", "Medium: announced project capacity, not measured delivered compute", "Defines the first disclosed customer-linked project", "Commissioning status and usable IT capacity are not established by this figure"]
      - ["Tydal IT capacity and construction", "121 MW IT capacity reported; first halls expected by end-2026 and remaining halls by March 2027", "Channel Insider reporting on the project", "Medium: third-party reporting; dates are forward-looking", "Shows delivery is dependent on an unfinished site and construction milestones", "Actual completion, available GPUs, workloads, and schedule performance"]
      - ["Near-term power pipeline", "More than 1 GW across North America and Europe; as stated at launch in August 2026", "Volta launch materials and related reporting", "Medium: company-reported pipeline, not operating or contracted customer capacity", "Potential expansion capacity", "Site-by-site status, customer allocation, conversion to operation, and power actually delivered"]
      - ["Customer utilization, retention, and outcomes", "Not disclosed in reviewed sources as of 2026-10-26", "Reviewed company announcement and assigned reporting", "Low: absence in this source set is not proof no data exists", "Durable adoption cannot yet be assessed", "Active workload volumes, uptime, utilization, customer outcomes, renewals, expansion, and denominators"]
    notes: Contract value is not ARR or recognized revenue. Pipeline and facility capacity are not commissioned customer compute. The 133 MW project figure and the separately reported 121 MW IT-capacity figure use different metric labels and should not be treated as equivalent.
    claimRefs: [CU003, CU004, CU005, CU007, CU009, CU010, CU011, CU012]
