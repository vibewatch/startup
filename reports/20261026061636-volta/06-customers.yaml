      - ["Frontier AI labs, AI-native companies, and enterprises", "Volta's stated target buyer segments; user and payer may differ", "Access to dedicated, scalable AI infrastructure supported by infrastructure capital", "No segment-level accounts, spend, deployment count, or conversion data disclosed", "Target segments are not proof of customers; request segment-level pipeline, signed contracts, and active deployments"]
    notes: Public customer and buyer evidence in the assigned sources through 2026-10-26; partial coverage, not a complete customer roster. Media-reported identity and contract terms are not company-confirmed.
