      - ["Other named production customers", "No other named production customer surfaced in the reviewed assigned sources", "Not established", "No qualifying public case study, customer quote, or outcome data in this source set", "This is an evidence gap, not evidence that no other customers exist"]
    notes: Partial enumeration of customer proof found in the assigned sources; unnamed counterparties and target markets are not counted as named customers.
    enumerationScope:
      coverage: partial
      basis: Named customer proof and disclosed target segments surfaced in the assigned sources reviewed through 2026-10-26.
    claimRefs: [CU003, CU006, CU011, CU013, CU015]
