callouts:
  - calloutType: insight
    title: Capital is the stated differentiator, not yet a demonstrated advantage
    body: >-
      Volta's financing-led integration is a coherent company thesis, but the assigned
      sources do not establish lower realized customer costs, completed capacity, or
      recurring operating economics.
    claimRefs:
      - CO001
      - CO007
      - CO010
      - CO014
  - calloutType: risk
    title: Anchor-customer attribution remains unconfirmed
    body: >-
      The $10 billion, six-year relationship is reported as an unnamed AI-lab commitment;
      the sources do not establish the reported Anthropic identity or public contract terms.
    claimRefs:
      - CO008
      - CO012
