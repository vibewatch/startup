        - Infrastructure-finance background is relevant to the stated model; operating record and key-person succession are not documented here.
      - - Sofia Gumuzio
        - Chief Corporate Development Officer; founder
        - The Next Web reports prior work in Brookfield's infrastructure business.
        - Corporate-development coverage is visible; board composition, delegated authority, and succession depth remain unknown.
    enumerationScope:
      coverage: partial
