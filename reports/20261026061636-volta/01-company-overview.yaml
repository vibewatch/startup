      - CO002
      - CO003
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Reported role or relationship
      - Control or economic importance
      - Diligence ask
    rows:
      - - Andreessen Horowitz and NVIDIA
        - The Register reports both led the latest round; Volta's release lists both among the Seed and Series A leads.
        - Equity investors; amount, security, and governance rights are not disclosed in assigned sources.
        - Obtain round documents, ownership, board rights, and any commercial dependencies.
      - - Azora
        - Named by Volta as a round lead and provider of a separate $5 billion AI Infrastructure Program.
        - Potential project-finance source; program terms and committed versus available capital are not established.
        - Review commitments, draw conditions, recourse, pricing, and project allocation.
      - - Michael Dell family office and Matter Venture Partners
        - Volta's release lists them as strategic investors; The Next Web reports Dell participation.
        - Strategic capital and potential ecosystem links; ownership and rights are not disclosed.
        - Confirm investment amount, rights, and any supplier or procurement ties.
      - - Bitdeer
        - Reported project partner for the 133 MW Norway AI-factory development.
        - Site and delivery relationship; final lease, construction, and operating obligations are not public in the assigned evidence.
        - Review site, power, lease, construction, and termination agreements.
      - - Unnamed AI lab
        - Reported six-year, $10 billion compute commitment; Volta has not officially confirmed the counterparty identity.
        - Potential anchor demand, but customer concentration and enforceable contract economics remain unverified.
        - Verify counterparty, take-or-pay terms, milestones, termination, and credit support.
    enumerationScope:
      coverage: partial
      basis: Named investors and counterparties in the assigned August 2026 launch coverage only.
    notes: >-
      The map summarizes reported relationships, not confirmed ownership or executed contract
      terms. The $5 billion program is distinct from the reported $300 million equity funding;
      the reported Bitdeer lease terms also require primary-document verification.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
