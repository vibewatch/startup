  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Recognized revenue, ARR, gross margin, cash burn, runway, customer count, customer concentration, secondary transactions, debt or credit facilities, and actual drawdowns from the Azora program.
      whyItMatters: Funding raised, financing programs, and contract value do not establish realized revenue, available liquidity, leverage, unit economics, or diversification.
      diligencePath: Request audited financial statements, a monthly operating model, customer-level revenue and backlog schedules, cap-table and secondary records, executed debt or facility documents, and cash-runway reconciliation.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO001
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Complete board, executive roster, ownership, governance rights, and key-person succession arrangements.
      whyItMatters: Named founders alone do not establish oversight, control, functional coverage, or continuity for a capital-intensive buildout.
      diligencePath: Obtain the current organization chart, board and committee materials, cap table, investor rights, and succession plans.
      relatedQuestionRefs:
        - QO002
      relatedTableRefs:
        - TO002
        - TO003
    - type: missing-source
      severity: material
      topic: company-identity
      missingEvidence: Legal headquarters, incorporation jurisdiction, legal entity structure, and exact founding date.
      whyItMatters: Office datelines do not establish domicile, contracting entity, or regulatory and governance obligations.
      diligencePath: Review corporate registry filings, entity organization chart, and current principal-office disclosure.
      relatedTableRefs:
        - TO001
    - type: missing-source
      severity: material
      topic: norway-project
      missingEvidence: Executed customer and site agreements, a reconciled 121 MW versus 133 MW capacity definition, lease duration and termination terms, construction schedule, committed power, commissioning evidence, and uptime or customer-outcome data.
      whyItMatters: Announced capacity and a short secondary summary do not establish delivery, utilization, enforceable obligations, service performance, or project economics.
      diligencePath: Obtain executed customer, site, lease, and financing documents; reconcile facility versus delivered-compute capacity and verify grid, construction, commissioning, and service-level evidence.
      relatedQuestionRefs:
        - QO004
        - QO005
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: minor
      topic: adverse-milestones
      missingEvidence: Dated product, commissioning, regulatory-status, leadership-change, and adverse-event records beyond the August 2026 launch announcements.
      whyItMatters: The assigned pool concentrates on launch claims and does not establish a complete operating or risk history.
      diligencePath: Reconcile company and registry records with independent reporting for subsequent financing, product, regulatory, and operating milestones.
