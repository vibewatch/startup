companyProfile:
  summary: >-
    Pudu Robotics was founded in Shenzhen in 2016 by Felix Zhang and remains founder-led in 2026.
    The company has expanded from restaurant delivery robots into a broader commercial robotics stack
    spanning delivery, autonomous cleaning, industrial material transport, and early embodied-AI products.
    Public disclosures indicate more than 120,000 robots shipped across 80+ countries, a channel-heavy
    global footprint, and renewed fundraising momentum after an April 2026 round that pushed valuation
    above $1.5 billion. The company appears commercially real and operationally scaled, but still does not
    publicly disclose audited revenue, gross margin, cap-table terms, customer concentration, or current
    headcount.
  foundedDate: "2016-01-01"
  founders:
    - name: Felix Zhang
      role: Founder & CEO
      background: >-
        Founder-operator with robotics research roots at HKUST and a public record of 350+ robotics-related
        patents; remains Pudu's principal strategist, fundraiser, and spokesperson.
      claimRefs: [CO015, CO016]
  foundingLocation: Shenzhen, China
