  productSummary: >-
    Pudu sells commercial service robotics hardware and related software for restaurant and hotel delivery,
    commercial cleaning, industrial delivery, and emerging embodied-AI workflows. Flagship products include
    BellaBot, KettyBot, HolaBot, FlashBot, SwiftBot, T300, CC1, and MT1, supported by navigation, fleet,
    and building-integration tooling.
  customerFocus: >-
    Multi-site operators in hospitality, foodservice, hotels, healthcare, retail, property services, and
    industrial environments that need indoor automation, labor support, or repetitive delivery and cleaning.
  businessModel: >-
    Primarily robot hardware sales through direct and channel relationships, with recurring service,
    deployment, maintenance, software-management, and ecosystem revenue layered on top where supported.
  stage: Late-stage private
  fundingStatus: >-
