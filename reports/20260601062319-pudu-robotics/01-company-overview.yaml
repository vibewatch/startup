  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Current board roster, committee structure, and any independent-director or observer appointments.
      whyItMatters: Late-stage private governance quality and investor protections cannot be assessed cleanly without knowing who actually governs the company.
      diligencePath: Request the current board deck, shareholder agreement governance schedule, and any board-observer list from management or lead investors.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: material
      topic: 2026-round-investors
      missingEvidence: Signed closing documents or an official company disclosure naming the exact investors and allocations in the 2026 round.
      whyItMatters: Gasgoo supplied a roster for the latest round, but official retained releases did not, leaving investor identity and allocation risk partially unresolved.
      diligencePath: Obtain the financing press release appendix, board consent package, or cap-table update for the April 2026 round.
      relatedQuestionRefs: [QO012]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: core-operating-metrics
      missingEvidence: Current headcount, exact active-customer count, and an absolute revenue figure or audited 2025 financial summary.
      whyItMatters: The company is clearly scaled, but valuation and durability analysis are weaker without knowing people cost, customer breadth, and absolute revenue.
      diligencePath: Request the 2025 management accounts, KPI dashboard, and current HR headcount report.
      relatedQuestionRefs: [QO018]
    - type: missing-source
      severity: minor
      topic: cybersecurity-follow-up
      missingEvidence: Independent post-remediation audit evidence showing whether the 2025 control weaknesses were fully closed and retested.
      whyItMatters: The company says it fixed the issue, but diligence should separate a patched bug from a mature enterprise-security process.
      diligencePath: Request the post-incident report, penetration-test summary, and vulnerability-disclosure policy adopted after the 2025 incident.
      relatedQuestionRefs: [QO024]
      relatedTableRefs: [TO004]
