  - id: S04
    title: Milestones, partnerships, and adverse operating signals
    body: >-
      The milestone record shows a company broadening from restaurant delivery
      robots into cleaning, industrial logistics, and embodied AI. Public
      waypoints include the 2021 Series C, the February 2023 C3 financing, the
      May 2023 C4 financing, a 3,000-unit Skylark order in Japan, and a strategic
      partnership with KONE to build smart-building services. In 2025 the product
      and regulatory signals accelerated: Pudu unveiled FlashBot Arm as a
      semi-humanoid embodied-AI service robot in March, secured CE-MD and CE-RED
      certifications for the T300, and won a Red Dot Award for the T300 as its
      first industrial robot. By November 2025 it was publicly positioning iREX
      2025 as the venue for its newest embodied robot and full lineup.

      The adverse milestone is cybersecurity rather than revenue collapse or legal
      sanction. The Register and Hackmag both reported in late August and early
      September 2025 that a researcher found vulnerabilities allowing attackers
      with valid tokens—obtainable via cross-site scripting or even trial-account
      flows—to redirect robots, rename them, or shut down fleets. Both reports
      say Pudu only engaged seriously after the researcher alerted customers
      including Skylark and Zensho, and both say the company subsequently fixed
      the vulnerabilities and created a dedicated reporting address. The risk
      implication for diligence is twofold: first, Pudu's scale makes
      operational-security mistakes non-trivial; second, the company's remediation
      response shows the issue was fixable, but also that public trust and
      enterprise governance matter more as the company moves toward unicorn-scale
      financing and potential IPO preparation.
