  - calloutType: risk
    title: Founder concentration and governance opacity remain material
    body: >-
      Felix Zhang is well supported as founder-CEO, but the retained public
      record does not disclose a full board or executive bench, leaving
      succession depth and investor governance rights unclear.
    claimRefs:
