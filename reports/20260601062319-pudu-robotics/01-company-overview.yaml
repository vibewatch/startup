  - calloutType: risk
    title: Cybersecurity became a real operating risk in 2025
    body: >-
      Independent reporting showed that Pudu’s robot-control stack was vulnerable
      to misuse until customers were alerted and the company patched the issue, a
      reminder that scaled fleets create scaled trust obligations.
    claimRefs:
      - CO044
      - CO045
      - CO046
  - calloutType: insight
    title: Business mix is shifting beyond restaurant delivery
    body: >-
      The strongest 2025-2026 signals are not just BellaBot-style hospitality
      deployments; they are cleaning-revenue dominance, T300 industrial
      milestones, and embodied-AI launches such as FlashBot Arm.
