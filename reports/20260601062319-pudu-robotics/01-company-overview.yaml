  - id: S02
    title: Founder leadership, governance opacity, and key-person risk
    body: >-
      Retained public materials consistently identify Felix Zhang as founder and
      CEO. The strongest biography source in this run is BEYOND Expo's May 2026
      speaker announcement, which says Zhang founded Pudu in 2016, previously
      researched robotics at the Hong Kong University of Science and Technology,
      has accumulated more than 350 robotics-related patents, and previously
      founded the Leiphone tech-media platform. Pudu's own April 2026 funding
      release and independent coverage from DealStreetAsia and The Robot Report
      also quote Zhang directly as founder and CEO, reinforcing that the company
      still presents a founder-led narrative to the market rather than a
      managerially diffused one.

      The governance problem is not evidence of misconduct; it is evidence of
      disclosure thinness. In the sources retained for this chapter, Pudu does
      not publish a board roster, committee structure, or a detailed executive
      bench beyond Felix Zhang's public role. That makes governance quality hard
      to assess from outside and raises a straightforward key-person risk:
      strategic narrative, product vision, fundraising credibility, and external
      representation all appear concentrated in one founder-CEO. Investors such
      as Meituan, Shenzhen Investment Holdings, Sequoia Capital China, Puhua
      Capital, and the reportedly named 2026 consortium imply outside oversight,
      but the exact board rights, observer rights, and current ownership split
      are not disclosed in the retained public record.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO027
      - CO028
      - CO029
    tableRefs:
      - TO002
  - id: S03
    title: Capital base, investor mix, and metric disclosure gaps
    body: >-
      Pudu is clearly in late-stage private-company territory by June 2026. The
      company announced on April 23, 2026 that it raised nearly $150 million at a
      valuation exceeding $1.5 billion, with cumulative funding above $300
      million. Independent coverage from DealStreetAsia, The Robot Report,
      Frontier Enterprise, and SiliconANGLE all echoed the same headline. Earlier
      financings show a layered capital history rather than a single jump: The
      Robot Report said Pudu's August 2021 Series C totaled $155 million and
      included Meituan and Shenzhen Investment Holdings; Pudu's own May 2023
      release said it followed a February 2023 C3 round of more than $15 million
      from Puhua Capital with a C4 round worth hundreds of millions of yuan; and
      DealStreetAsia said the 2023 Series C+ rounds totaled about $170 million
      and counted Sequoia Capital China, Meituan, and Shenzhen Investment
      Holdings among investors.

      The latest round's investor roster is where disclosure quality drops.
      Official 2026 releases highlight strategic investors and industrial
      partners but do not name them, while Gasgoo later reported that Longgang
      Financial Holding and Ya Capital co-led the round with BAIC Industrial
      Investment, Lens Technology, Highlight Capital, and government-guided funds
      participating. That report is plausible and directionally useful, but it is
      still a third-party roster rather than an officially named cap-table
      disclosure. Metric disclosure is similarly uneven: Pudu publicized 100%
      2025 revenue growth, a revenue mix in which cleaning robots exceeded 70%,
      over 4,000 industrial-delivery units shipped within about a year of launch,
      and a 23% global market share citation from Frost & Sullivan, yet it did
      not disclose absolute revenue, ARR, headcount, or customer count in the
      retained public sources.
