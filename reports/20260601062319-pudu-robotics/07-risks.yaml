- id: adoption-concentration-and-kill-triggers
  title: Adoption Concentration Leaves Less Room for Execution Slips
  body: 'Pudu''s current downside is amplified by concentration. The company says commercial cleaning surpassed 70% of total revenue in 2025, which means one category is now carrying the growth story even as management still frames hospitality labor shortages, guest expectations, and hygiene pressure as important demand drivers. That is not inherently bad—focus often drives scale—but it makes the operating model more sensitive to renewal quality, proof of ROI, and post-install reliability in a smaller number of high-volume use cases. Academic evidence strengthens that caution: hotel-robot continuance depends materially on perceived reliability and assurance, while employee-perception research shows that service robots can trigger concerns about inefficiency, intelligence, and privacy even when they address staffing gaps. In other words, customer adoption does not just depend on labor scarcity; it depends on the robot continuing to work well enough that staff and guests still prefer it after
    the novelty fades.


    This is why the risk chapter does not end at “Pudu raised money.” The latest financing is clearly helpful, but public evidence still points to a company that must keep investing in manufacturing capacity, field support, integrations, and embodied-AI development while proving that concentration in cleaning and hospitality-adjacent demand will not produce slower growth, margin pressure, or higher service obligations. The most actionable diligence move is therefore to convert these risks into hard triggers: recurring cyber incidents, missing certification packets for material SKUs, distributor disputes, slower patching or onboarding, trade-driven lead-time spikes, or evidence that customers hesitate to renew once service robots become operational infrastructure rather than a novelty purchase.'
