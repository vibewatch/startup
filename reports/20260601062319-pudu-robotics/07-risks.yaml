  title: Distributor-led scale improves reach but increases contract and service-friction risk
  body: Pudu's North American footprint appears to depend on a broad authorized-channel network. That helps distribution, but it also means warranty quality, onboarding quality, and dispute handling can vary across counterparties, while lock-out policies create a sharper downside if channel governance breaks.
