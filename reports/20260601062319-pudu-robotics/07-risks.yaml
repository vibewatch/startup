- calloutType: recommendation
  title: Must-close diligence asks before underwriting aggressive upside
  body: Request a model-by-model certification matrix, post-2025 pen-test and incident-response evidence, distributor concentration plus dispute logs, and any product-liability / recall / insurance history. These documents determine whether Pudu's expansion into healthcare, industrial logistics, and embodied AI is operationally mature or still dependent on marketing-level assurances.
