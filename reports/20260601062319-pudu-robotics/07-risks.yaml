company:
  name: Pudu Robotics
chapter:
  number: 7
  title: Risks
  summary: 'Pudu Robotics'' most material downside is no longer purely theoretical: a 2025 disclosed fleet-control vulnerability showed that software weaknesses can spill into physical robot behavior, just as the company pushes deeper into healthcare, industrial, and embodied-AI workflows that carry heavier privacy, safety, and liability consequences. A second major risk is execution dependence on a distributor-heavy channel and China-linked hardware supply chain while EU and U.S. regulatory burdens on machinery, connected devices, data handling, and advanced-computing inputs continue to tighten. Fresh capital, private-cloud options, T300 certifications, and local U.S. support expansion are meaningful mitigants, but cleaning-revenue concentration and thin public disclosure on litigation, warranty disputes, and liability coverage keep residual exposure high.'
sections:
- id: regulatory-and-legal-burden
  title: Regulatory and Legal Burden Is Rising Faster Than Public Disclosure
  body: 'Pudu is moving beyond restaurant delivery into industrial logistics, healthcare delivery, and embodied-AI assistance, which materially raises the compliance burden attached to each deployment. The retained public record shows meaningful policy overlap rather than a single governing rule: EU machinery law now explicitly aims to better cover autonomous mobile machinery; EU radio-equipment cybersecurity rules tie connected devices to network-protection and privacy obligations; U.S. healthcare privacy rules require administrative, physical, and technical safeguards for ePHI; and OSHA still warns that many robot accidents happen during non-routine operating conditions even though the agency has no robotics-specific standard. That combination matters because Pudu''s healthcare pages market medicine, lab-sample, meal, linen, and medical-waste transport, while FlashBot Arm is marketed as an embodied-AI system able to press elevator buttons, swipe cards, and open doors.


    The good news is that mitigation is visible. Pudu publicly shows CE-MD and CE-RED certification for the T300, publishes privacy policies, offers private-deployment and private-cloud options, and frames information security/privacy as governed through formal policies. The problem is that the retained public evidence is uneven across the lineup: it is strongest for the T300 and platform-level privacy controls, but much thinner for model-by-model certification, customer-specific data-processing terms, and any disclosed liability or litigation history. That does not prove a hidden legal problem, but it does mean investors cannot underwrite healthcare or industrial expansion from marketing pages alone. The risk is therefore not just regulation itself; it is the combination of growing legal obligations and incomplete external disclosure about how those obligations are operationalized across SKUs, geographies, and channel partners.'
