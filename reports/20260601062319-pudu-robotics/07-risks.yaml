- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Cyber recurrence
    - Security incident frequency
    - Any new fleet-control exploit or patch window >30 days for critical bug
    - Pause aggressive growth assumptions until controls are re-verified
  - - Certification gap
    - SKU compliance packet completeness
    - Missing CE / RED / safety evidence for a material EU-bound or healthcare SKU
    - Haircut international or healthcare expansion forecast
  - - Channel friction
    - Distributor dispute / lock-out evidence
    - Repeated device lock-outs, warranty conflicts, or partner churn in major regions
    - Lower conversion and support-quality assumptions
  - - Adoption slowdown
    - Renewal / expansion proof
    - Evidence that reliability concerns or employee pushback reduce repeat deployment
    - Cut long-run cleaning / hospitality growth expectations
  - - Trade / supply-chain shock
    - Lead time and landed-cost change
    - Material tariff step-up, export-license friction, or component lead-time doubling
    - Apply margin haircut and slower rollout timing
  - - Liability event
    - Safety or privacy incident severity
    - Major injury claim, hospital privacy breach, or formal recall / regulator action
    - Treat as thesis-break until remediation is evidenced
  notes: Kill criteria convert public risks into IC-usable monitoring rules. The point is not to predict the event, but to define when evidence should change underwriting.
