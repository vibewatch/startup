- id: cybersecurity-safety-and-product-liability
  title: Cybersecurity, Safety, and Product-Liability Risk Are Now First-Order
  body: 'The biggest concrete downside signal in the retained record is the 2025 cybersecurity disclosure. Two independent reports said attackers with valid tokens could redirect robots, rename them, or disable fleets because admin-side controls lacked further checks; both also say the company''s response accelerated only after customers were contacted. For a service-robot vendor this is more serious than a conventional SaaS bug because Pudu''s platform controls physical devices operating around diners, staff, hotel guests, hospital logistics, and industrial material flows. The company has since fixed the issue, paid a bounty, and created a dedicated reporting channel, so the right conclusion is not “unfixable security culture.” The right conclusion is that Pudu has already crossed the threshold where cyber weakness can become an operational and reputational event with customer escalation, patching urgency, and possible product-liability consequences.


    Severity also rises because the deployment envelope is widening. The T300 carries up to 300 kg, Pudu''s healthcare solution handles medicine and waste flows with elevator and access-gate integration, and FlashBot Arm is pitched as an embodied-AI assistant that can manipulate parts of the built environment. Those use cases increase the number of failure modes that could trigger contract disputes, negligence arguments, or site-level shutdowns even if no public lawsuit has yet surfaced in retained sources. Private deployment, private cloud, and formal privacy policies are real mitigants, but they shift diligence toward implementation details: credentialing, patch SLAs, log retention, penetration-testing cadence, customer segmentation, and how responsibilities are split between Pudu, integrators, and distributors when something goes wrong.'
