  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sku-certification-matrix
    missingEvidence: A model-by-model certification matrix covering safety, radio, privacy, and region-specific compliance for every material SKU now sold into hospitality, healthcare, and industrial settings.
    whyItMatters: Public evidence clearly supports T300 certification and platform-level privacy policies, but not equivalent documentation across the entire lineup, limiting confidence in expansion assumptions.
    diligencePath: Request the internal compliance matrix, notified-body / test-lab packets, and geo-specific go-live checklist for each major product line.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: legal-history
    missingEvidence: A public or counsel-supplied record of filed lawsuits, recalls, major warranty claims, or regulator complaints involving Pudu Robotics and its material subsidiaries or distributors.
    whyItMatters: Without a verified legal-history sweep, investors cannot tell whether current public quiet reflects low incident frequency or simple disclosure thinness.
    diligencePath: Run external counsel docket searches in China, the U.S., and the EU and request management's litigation / recall schedule.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: channel-contracts
    missingEvidence: Distributor agreements, indemnity language, lock-out triggers, termination rights, warranty allocations, and historical dispute logs for major geographies.
    whyItMatters: Public partner pages confirm channel dependence and lock-out behavior, but not whether contract design concentrates financial or reputational risk on Pudu when a deployment fails.
    diligencePath: Request the standard distributor agreement, top-partner concentration table, and any dispute / churn summary for the last 24 months.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: liability-coverage
    missingEvidence: Product-liability insurance limits, reserve policy, claims history, and any recall-response framework for robots used in healthcare, hospitality, and industrial settings.
    whyItMatters: The deployment envelope already includes regulated and physically consequential workflows, so insurance depth materially changes downside severity.
    diligencePath: Request certificates of insurance, claims runs, reserve policy, and incident-response / recall playbooks from management or counsel.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR005
