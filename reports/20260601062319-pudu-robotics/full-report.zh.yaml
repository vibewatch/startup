        - 市值 $0.79b
        - ~30x 2026 指引销售额；~293x TTM 销售额
        - 有用的服务机器人可比对象，但基数很小，叙事受收购驱动。
      - - Richtech Robotics
        - 上市
        - FY2026 Q1 收入 $1.14m
        - 市值 $0.67b
        - 年化销售额 ~147x
        - 酒店服务机器人同业，但属微型股，且仍在转向 RaaS。
      - - iRobot
        - 上市
        - FY2024 收入 $681.8m
        - 市值 $14.84m
        - TTM 销售额 ~0.02x
        - 面向消费而非商用，但可作为硬件估值塌陷的下行案例。
      - - Symbotic
        - 上市
        - FY2025 收入 $2.247b
        - 市值 $28.02b
        - TTM 销售额 ~12.5x
        - 这是高端自动化倍数最好的证据，但仓储自动化的规模和披露远领先于 Pudu。
      - - Zebra Technologies
        - 上市
        - 2026 Q1 销售额 $1.495b
        - 市值 $11.60b
        - 年化销售额 ~1.9x
        - 成熟自动化和数据采集基准，有助于判断高质量资产的下沿倍数。
      - - Keenon Robotics
        - 私营融资
        - Series D 规模 $200m
        - 估值未披露
        - 仅轮次规模
        - 显示服务机器人领域资金深度，但不是干净的定价标记。
      - - Bear Robotics
        - 私营交易
        - 基于地方媒体的估值报道
        - TechCrunch 报道隐含 $600m
        - 未确认的私营估值标记
        - 只能用于提醒：私营市场定价可能不透明，也可能噪声很大。
    notes: 覆盖刻意不完整：这些行聚焦 2025-2026 年公开证据中最有支撑的公开和私营参考点，而不是完整机器人宇宙。
    enumerationScope:
