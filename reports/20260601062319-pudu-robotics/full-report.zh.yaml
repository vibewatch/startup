      - number: '8.4'
        title: 退出准备度、尽调请求与否决触发条件
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，普渡尚不具备 IPO
              式承销准备度。公司披露了强劲的部署和融资标志，但没有披露公开买方通常要求的经审计财务历史、治理细节、经常性收入披露或股权表透明度。这并不阻止投资；它改变了可能的退出路径和尽调负担。战略买方、工业合作伙伴或交叉轮投资者可以承销未公开的私有材料，使战略退出或后期交叉轮结果比近期
              IPO
              更可信。对新投资者而言，投委会应把缺失证据视为估值输入，而不是事后补充。决定性请求是经审计收入和按产品线划分的毛利率、客户集中度和重复部署、现金消耗与营运资本需求，以及确切的优先权结构。如果这些项目令人失望——尤其是如果收入使普渡交易在公开市场高溢价倍数之上，或优先权结构吸收了大部分上行空间——投资论点应迅速破裂，而不是继续漂移。
