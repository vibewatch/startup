              年收入翻倍，同时清洁成为收入组合的多数。这些不是微不足道的里程碑，也解释了为什么在机器人融资重新加速时，公司仍能吸引成长资本。问题不在于标题故事的质量；而在于承销这一故事时的价格敏感性。公开证据仍未披露经审计收入、产品线毛利率、ARR、现金消耗或最新融资轮背后的优先权结构。这个缺口意味着投资者无法判断当前估值是在承销成熟自动化公司倍数、投机性小盘机器人公司倍数，还是介于两者之间。因此，在经审计数据和融资条款缩小不确定性之前，正确立场是以中等信心继续研究，风险评级高，估值姿态偏高。
