  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可服务市场框架
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics 很难被干净地放进一个标准市场桶。公司自己的材料描述了四条活跃产品线——服务配送、商用清洁、工业配送和通用具身
              AI——并部署在酒店餐饮、零售、医疗、食品饮料、公共服务和工业设施中。因此，相关市场边界比全球服务机器人总市场更窄，但又比餐厅送餐机器人更宽。本章最可辩护的定义，是用于餐厅、酒店、医院、零售 /
              设施环境和轻工业园区的室内商业服务机器人，以及设施内配送机器人。纳入的支出覆盖这些工作流中的硬件、集群管理软件、维护和机器人即服务合同。


              需要排除的市场包括消费级清洁机器人、手术和康复机器人、户外最后一公里配送机器人，以及 AS/RS 系统和仓库专用拣选机器人等完整仓储自动化栈。因此，公开 TAM 估算只能提供方向。Fortune Business
              Insights 将 2025 年全球服务机器人市场放在 USD 26.35 billion，Precedence Research 为 USD 62.85 billion，Mordor Intelligence
              为 USD 68.31 billion；区间过宽，不能把它当成精确估值锚，因为每份报告的纳入口径不同。Pudu 核心业务最好的公开 SAM
              代理，是酒店餐饮机器人、配送机器人、更宽的清洁机器人、零售机器人和物流机器人。没有任何一个公开来源单独拆出 2025/2026 年中国市场或 Pudu 专属
              SAM，因此本章保留基于代理的测算，而不强行拼出一个虚假的单一 TAM/SAM/SOM 阶梯。
