        - 面向欧盟或医疗场景的重要 SKU 缺少 CE / RED / 安全证据
        - 下调国际化或医疗扩张预测
      - - 渠道摩擦
        - 经销商纠纷 / 锁机证据
        - 主要区域反复出现设备锁机、保修冲突或合作伙伴流失
        - 下调转化率和支持质量假设
      - - 采用放缓
        - 续约 / 扩张证明
        - 可靠性担忧或员工抵触压低重复部署的证据
        - 下调长期清洁 / 酒店场景增长预期
      - - 贸易 / 供应链冲击
        - 交期和到岸成本变化
        - 关税大幅上调、出口许可摩擦，或组件交期翻倍
        - 下调利润率，并放慢铺开节奏
      - - 责任事件
        - 安全或隐私事件严重程度
        - 重大伤害索赔、医院隐私泄露，或正式召回 / 监管行动
        - 在补救证据出现前视为投资逻辑破裂
    notes: 否决标准把公开风险转成 IC 可监控的规则。重点不是预测事件，而是界定什么证据足以改写投资假设。
    claimRefs:
