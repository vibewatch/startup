        title: 展示项
        blocks:
          - type: callout
            title: 建议：按 2026 年 4 月价格继续研究
            body: 普渡有足够商业证据保持可投资性，但没有足够公开财务披露来证明可以在所述 15 亿美元估值以上不计价格地参与。
            calloutType: recommendation
            claimRefs:
              - CV041
