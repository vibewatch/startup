      - number: '6.3'
        title: 部署成熟度、工作流契合与 ROI 可见度
        blocks:
          - type: paragraph
            body: >-
              Pudu 的公开材料显示，多个高频室内工作流中的部署已经具备运营成熟度。医疗解决方案页面声称 100% 配送准确率、员工行走距离减少 99.99%；酒店餐饮和零售页面显示，电梯集成、门禁、自动充电和 24/7
              使用是标准功能，而不是一次性定制工程。具名案例也强化了成熟度：Parkhotel 使用支持电梯的 FlashBot 做客房配送，Food Bayana
              则使用固定机器人区域和专用电梯，支撑全自动食物交接系统。工业方面，T300 看起来在技术上已适配企业——300 kg 载重、快速换电、开放 API
              和连续运行——但公开客户证据仍多为类别级或名单级，而不是逐工厂案例证据。因此，ROI
