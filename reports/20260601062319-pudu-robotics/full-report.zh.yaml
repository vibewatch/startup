      - number: '7.2'
        title: 网络安全、安全与产品责任风险已成为一阶风险
        blocks:
          - type: paragraph
            body: >-
              保留记录中最大的具体下行信号是 2025 年网络安全披露。两份独立报告称，持有有效 token
              的攻击者可以重定向机器人、重命名机器人或停用车队，因为管理端控制缺少进一步检查；两份报告还称，公司响应只是在客户被联系后才加速。对服务机器人供应商而言，这比传统 SaaS 漏洞
              更严重，因为普渡的平台控制的是在食客、员工、酒店住客、医院物流和工业物料流周围运行的物理设备。公司后来修复了问题、支付了赏金并创建了专用报告渠道，因此正确结论并不是“安全文化不可修复”。正确结论是，普渡已经跨过了一个门槛：网络弱点可能演变为伴随客户升级、紧急补丁和潜在产品责任后果的运营与声誉事件。


              严重性也会随部署边界扩大而上升。T300 最高可承载 300 kg，普渡医疗解决方案处理药品和废弃物流，并集成电梯和门禁；FlashBot Arm 则被定位为能够操控部分建成环境的具身 AI
              助手。这些用例增加了可能触发合同争议、过失主张或场地级停运的失效模式数量，即使保留来源尚未出现公开诉讼。私有化部署、私有云和正式隐私政策是真实缓释因素，但它们会把尽调重点转向实施细节：凭证管理、补丁
              SLA、日志留存、渗透测试节奏、客户分段，以及当问题发生时普渡、集成商和经销商之间如何划分责任。
