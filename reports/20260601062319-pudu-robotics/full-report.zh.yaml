    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics（Shenzhen Pudu Technology）把自己定位为一家总部在深圳、成立于 2016
              年、如今全球化运营的商业服务机器人公司。公司当前页面显示，其业务围绕四条产品线展开：服务配送、商用清洁、工业配送和通用具身 AI；留存的产品页面也确认，这些产品线覆盖 BellaBot、CC1
              清洁机器人、T300 工业 AMR、FlashBot 系列，以及仍可访问的 SwiftBot 产品 URL。公司页面还把 Pudu
              放在比单一餐厅机器人供应商更宽的位置：部署场景列出零售、酒店餐饮、制造、食品饮料、医疗、教育、公共服务和物业环境。因此，一句话概括业务模式，就是向多个劳动密集型室内工作流销售并部署商业机器人。

              运营足迹也足够支撑后续章节。Pudu 称已在 80 多个国家和地区出货超过 120,000
              台机器人，并列出深圳和香港两个全球总部，深圳、成都和香港的研发中心，以及日本、韩国、新加坡、美国和荷兰的海外子公司。这些说法来自公司口径，但也被 2026 年 4 月 PRNewswire 新闻稿和 2026 年
              5 月 BEYOND Expo 演讲嘉宾公告重复引用。尽管公司没有发布合并口径的设施清单、准确客户数或员工数，头部规模仍有合理佐证。
