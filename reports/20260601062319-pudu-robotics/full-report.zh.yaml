      - number: '2.2'
        title: 酒店餐饮、清洁、医疗、零售与物流的垂直需求
        blocks:
          - type: paragraph
            body: >-
              酒店餐饮是 Pudu 当前业务最清晰的直接代理。Mordor Intelligence 估计，酒店餐饮机器人市场 2025 年为 USD 0.61 billion，到 2031 年升至 USD 2.23
              billion，CAGR 为 24.10%；The Business Research Company 则把同一细分市场放在 2025 年 USD 0.7 billion、2030 年 USD 2.13
              billion。在该市场内，酒店以 43.35% 占据当前最大收入份额，餐厅和酒吧是增长最快的终端用户，CAGR 为 26.05%；配送系统以 39.05%
              领跑产品组合；北美当前份额领先，亚太增长最快。Precedence 的配送机器人市场更窄，但仍有用：2024 年 USD 409.3 million，到 2034 年增至 USD 6.58
              billion，其中室内配送是增长最快的类型。


              相邻市场大得多，但与 Pudu 的匹配不那么干净。Grand View Research 估计，2024 年物流机器人市场为 USD 14.5
              billion；随着医院自动化药品、食品和样本运输，医疗设施是增长更快的物流终端用户之一。Mordor 更宽的服务机器人研究称，物流和仓储占 2025 年需求的 47.67%，医疗则是到 2031
              年增长最快的终端行业，CAGR 为 20.91%。零售机器人和清洁机器人都在快速增长，但公开定义会高估 Pudu 可触达的部分，因为它们包含货架扫描、结账和消费级清洁产品，而 Pudu
              并未完整覆盖这些领域。实际含义是：Pudu 有多个可信增长池，但酒店餐饮、商用清洁、医疗支持物流和设施内配送，仍是最相关的公开可比市场。
