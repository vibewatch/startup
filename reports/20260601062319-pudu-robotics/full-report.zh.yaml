      - number: '1.2'
        title: 创始人领导、治理不透明与关键人风险
        blocks:
          - type: paragraph
            body: >-
              留存的公开材料一致把 Felix Zhang 认定为创始人兼 CEO。本次研究中最强的履历来源是 BEYOND Expo 2026 年 5 月的演讲嘉宾公告：Zhang 于 2016 年创立 Pudu，此前在
              Hong Kong University of Science and Technology 做机器人研究，已累计超过 350 项机器人相关专利，并曾创办 Leiphone 技术媒体平台。Pudu 自己的
              2026 年 4 月融资新闻稿，以及 DealStreetAsia 和 The Robot Report 的独立报道，也都直接引用 Zhang 的创始人兼 CEO
              身份。这强化了一点：公司面对市场时，仍讲的是创始人主导的叙事，而不是经理人分散治理的叙事。

              治理问题不是不当行为证据，而是披露稀薄。在本章留存来源中，Pudu 没有公布董事会名单、委员会结构，也没有在 Felix Zhang
              的公开职位之外披露详细高管梯队。外部很难据此评估治理质量，也自然形成直接的关键人风险：战略叙事、产品愿景、融资信用和对外代表性都似乎集中在一位创始人 CEO 身上。Meituan、Shenzhen
              Investment Holdings、Sequoia Capital China、Puhua Capital 以及据报道点名的 2026
              年财团等投资者，意味着外部监督存在，但具体董事席位权、观察员权和当前股权拆分，在留存公开记录中都没有披露。
