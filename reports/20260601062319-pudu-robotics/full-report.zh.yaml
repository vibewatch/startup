      - number: '5.4'
        title: 制造足迹、质量控制与合规
        blocks:
          - type: paragraph
            body: >-
              制造和质量故事方向正面，但细节不均。Pudu 自己的第 100,000 台机器人里程碑文章提供了最强规模披露：建湖超级工厂 2024 年 8 月启用，占地超过 40,000 平方米，目标年产能 100,000
              台，并声称具备 IoT 支撑的供应商协作、质量追溯和智能仓储。它看起来是真正的制造基础设施，而不只是研发实验室。细微点在地点。这里检索到的公开来源明确支持深圳是公司和软件基地，因为两个应用商店页面都指向深圳
              Pudu 实体和地址；但明确的工厂规模披露指向江苏建湖，而不是深圳生产基地。合规方面，T300 是最干净的案例：外部报道引用 Pudu 2025 年 3 月新闻稿称，TÜV SUD 已按 EN ISO
              3691-4 和 EN 1175 认证 CE-MD 与 CE-RED；CC1 Pro 材料则引用 IEC
              63327。这些都是好信号，但还没有构成覆盖全产品线、公开可访问的完整认证包。换句话说，公司看起来越来越可制造、越来越适配企业客户，但买方仍需要索取比公开网络更多的包级证明。
