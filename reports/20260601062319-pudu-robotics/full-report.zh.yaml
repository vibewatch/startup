          - type: callout
            title: 未被定价的下行是条款加未披露收入规模
            body: 摧毁上行空间最快的方式并不是产品失败，而是发现当前收入低于本轮融资所隐含的门槛，或优先权结构攫取了大部分价值。
            calloutType: risk
            claimRefs:
              - CV039
