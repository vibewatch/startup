            body: >-
              公开证据支持把 Pudu
              看成多垂直商业机器人供应商，而不是单一餐厅机器人公司。官方解决方案页面把产品组合映射到餐厅、酒店、零售、医疗和工业物流；独立报道和合作伙伴覆盖也显示，这些类别并非停留在理论。餐厅仍是传统锚点：KR Asia
              报道称，2023 年食品服务仍占配送量的 50-60%，参考客户包括 Haidilao、Burger King、KFC 和 Skylark。到 2026 年，可见足迹已经实质拓宽。Pudu
              和多份第三方报道反复提到累计 120,000 多台、覆盖 80 多个国家；仅美洲扩张就据称包括近 15,000 台已部署机器人，以及区域收入同比增长 285%。因此，足迹看起来真实，但分母仍弱：Pudu
