  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Pudu 客户采用通常从针对具体工作流的演示开始，进入真实场地部署，再靠本地服务支撑车队扩张。渠道合作伙伴会在部分地区压缩路径，但也掌握一部分客户关系。
    approximationNotes: 阶段综合了 Skylark、Parkhotel、Food Bayana、Coca-Cola Jordan、美洲分销商增长和 Pudu 解决方案页面中的模式；未披露公开销售周期时长数据。
    data:
      items:
        - id: discover
          label: 工作流痛点出现
          actor: 企业运营方或品牌方
          description: 劳动力短缺、服务速度目标、清洁频次或内部物流摩擦，触发自动化评估。
          channels:
            - 餐厅用工压力
            - 酒店客房配送需求
            - 零售激活或补货需求
            - 医院物流 / 清洁需求
        - id: evaluate
          label: 演示 / 方案设计阶段
          actor: Pudu 或本地合作伙伴售前团队
          description: 客户在真实运营环境中验证导航、载荷、电梯集成和工作流适配。
          channels:
            - 直销
            - 分销商主导演示
            - 合作伙伴主导方案设计
        - id: deploy
          label: 场地上线
          actor: 场地运营人员和实施团队
          description: 机器人完成建图、集成，并被分配到特定区域、路线或服务任务；Parkhotel 和 Food Bayana 是最清晰的公开案例。
          channels:
            - 场地建图
            - 电梯 / 门禁集成
            - 员工培训
            - 云端管理
        - id: support
          label: 本地服务与车队优化
          actor: Pudu 本地办公室或分销商 / 服务合作伙伴
          description: 售后支持、配件供应、工作流调优和维护，决定部署是否足够耐久并继续扩张。
          channels:
            - Dallas 总部和仓库
            - 300+ 个美洲服务商
            - 700+ 个全球合作伙伴组织
            - PUDU CLOUD / 远程支持
        - id: expand
          label: 车队扩张或品类交叉销售
          actor: 集团运营 / 采购
          description: 成功账户会增加更多设备、更多站点，或扩展到清洁、零售激活、工业运输等相邻产品品类。
          channels:
            - 连锁铺开（Skylark）
            - 多机器人酒店栈（Parkhotel）
            - 区域扩张（Food Bayana）
