            body: >-
              Pudu 没有在自有网站公布官方标价，因此最干净的公开变现证据来自渠道伙伴。RobotLAB 标出 CC1 Pro 价格为 USD 24,000，并提供每月 USD 503
              的融资选项；RobotVacuums.com 标出标准 CC1 价格为 USD 22,500；Robonnement 则销售包含安装、培训、维护、保险和软件更新的捆绑月度订阅。这组信息强烈暗示，Pudu
              既可作为前置硬件销售，也可通过融资或租赁型运营合同销售；但实际 ASP、分销商折扣和服务附加率仍未披露。上市公司文件能框定经济性，却无法钉住 Pudu。Richtech FY2024 10-K
              显示，一家服务机器人 OEM 可以混合直销、租赁合同和维护，并在小收入基数上实现 64% 毛利率；iRobot 更大规模的 FY2024 文件则显示 20.9%
              毛利率，以及面对成本压力时转向轻资产、合同制造。两个文件拉出了很宽的代理区间。实际含义是，Pudu 可见的低到中 USD-20k
              清洁价格点，在合适渠道中可以支撑有吸引力的单位经济，但公开数据仍过于稀疏，无法有信心估算 CAC、回本周期或稳态毛利率。
