  - id: TM005
    title: 增长驱动、障碍与买方经济性表
    columns:
      - 因素
      - 证据
      - 经济影响
      - 对采用的影响
      - 尽调问题
    rows:
      - - 酒店餐饮人手短缺
        - BLS 和餐饮行业数据显示，岗位空缺持续存在，自动化投资也在增加
        - 提高配送和清洁机器人的替工价值
        - 餐厅和酒店近期采用的强顺风
        - 确认各目标地域的短缺是否仍然尖锐
      - - 医疗人力压力
        - WHO 报告 2023 年全球护士短缺 5.8M，2030 年仍预计短缺 4.1M
        - 与人力充裕的系统相比，非临床物流自动化更有价值
        - 支撑医院物流需求，尤其是药品和被服运输
        - 按国家验证医院预算负责人和采购周期
      - - RaaS 与更低 TCO
        - Mordor 提到清洁机器人月费 USD 1,500、移动仓储机器人月费 USD 3,000、回本周期不到 18 个月，以及更低五年 TCO
        - 把 capex 转成 opex，缩短回本门槛
        - 把可触达买方从大型连锁和医院扩展出去
        - 验证 Pudu 租赁或订阅渗透率，以及对毛利率的影响
      - - 设施集成与动线适配
        - Frontiers 显示，楼梯、门槛和流程不匹配会触发改造成本
        - 抬高实施成本，放慢从试点到规模化的转化
        - 即便节省人工很明显，也会形成真实障碍
        - 索取部署失败率、电梯 / PMS 集成覆盖率和改造成本
      - - 员工接受度与隐私顾虑
        - MDPI 指出服务机器人采用中的抵触、焦虑和隐私顾虑
        - 可能降低使用率、拖慢部署，或压低续约率
        - 在面向客人的酒店餐饮和医疗环境里尤其相关
        - 索取在运行点位的使用率、NPS、投诉和员工留存数据
      - - 口径过宽的市场代理指标
        - 清洁、零售和大口径服务机器人报告包含 Pudu 范围之外的品类
        - 可能高估 TAM，并低估 Pudu 实际细分市场的竞争强度
        - 投资人应更重视代理指标拼接，而不是一个虚高 TAM 数字
        - 基于出货量、场地数量和 ASP，搭建按地域 / 垂直拆分的自下而上模型
      - - Frost 23% 份额说法
        - PR 引用提供龙头叙事，但本章没有独立审阅的原始方法论
        - 适合讲市场定位，不适合做经审计的估值数学
        - 在拿到原始报告或渠道数据前，只把它当作低置信度 SOM 代理指标
        - 在承销集中度假设前，取得完整 Frost 报告或第三方出货审计
    notes: 经济性基准是市场层面参考，不是 Pudu 定价。表中把有来源的证据和明确尽调问题放在一起，因为该市场仍以试点为主，方法口径也不一致。
