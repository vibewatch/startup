          detail: 产品广度横跨餐饮、清洁、医疗和工业场景，并有欧洲清洁业务扩张及人形机器人或 VLA 路线图；但留存公开规模指标少于 Pudu。
          tone: neutral
        - label: Bear Robotics
          x: 6
