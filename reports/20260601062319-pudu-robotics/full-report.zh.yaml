      - number: '8.3'
        title: 牛市、基准与熊市情景框架
        blocks:
          - type: paragraph
            body: >-
              情景讨论应从当前价格开始，反推所需基本面。在 15 亿美元的估值下，如果收入为 8,000 万美元，普渡实际上约以 18.8x 销售额交易；收入为 1.2 亿美元时为 12.5x；1.5 亿美元时为 10x；2
              亿美元时为
              7.5x。对一家快速增长的自动化公司而言，这些结果并非不可能，但无法从公开证据验证，因为普渡没有披露经审计收入或利润率。这使牛市情景是有条件的，而非已经成立：它需要经审计收入达到低到中段的数亿美元、持久增长，以及干净的融资条款。基准情景只有在这些证明很快落地时，才会让估值维持在接近当前标记。熊市情景并非关于产品无关紧要；而是关于收入规模不及预期、硬件经济性薄弱，或有利于投资人的条款会迫使本轮重新定价。由于公开证据集仍让这些驱动因素悬而未决，尽管公司本身看起来具有战略吸引力，当前“偏高”仍是正确的估值立场。
            claimRefs:
              - CV038
