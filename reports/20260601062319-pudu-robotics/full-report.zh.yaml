              客户关系韧性是普渡公开客户记录中最薄弱的部分。可信的可重复使用迹象确实存在——Skylark 的全链路门店铺开、Parkhotel 的多机器人运营模式、Food Bayana
              的定制化基础设施，以及持续的国际扩张——但普渡并未公开提供客户数量、客户标识 流失率、续约率、总收入留存或净收入留存、合同期限，或来自现有账户的扩张收入。即使本章量化程度最高的客户信号，即 Skylark 的
              67% 满意度调查，也只反映一次铺开和 8 家受访门店，而不是客户群组视角。官方解决方案页面上的医疗 KPI 主张有帮助，但未标明出处，因此不能替代具名客户 ROI
