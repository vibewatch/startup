      - number: '4.4'
        title: 财务结论与公开尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              正向读数很清楚：Pudu 似乎有真实商业动能、可观制造规模，并且持续能拿到私募资本。清洁已成为主导收入池，海外市场似乎贡献了多数销售，公司也有足够市场信用，以独角兽以上估值完成 2026
              年大额融资。反向读数同样重要：几乎所有承销需要的核心数字仍是私有信息。没有公开
              P&L、没有资产负债表、没有债务时间表、没有收入确认政策，也没有按队列拆分的毛利率、服务成本或折扣视图。对任何根植中国的硬件供应链而言，关税和贸易战压力还增加了一层外部风险，即使 Dallas
              物流布局能部分缓释。总体看，财务故事可以作为增长叙事投资，但还不能作为现金流叙事承销。因此，本章对需求质量和品类位置偏正面，对毛利耐久性和资本强度保持谨慎，并明确指出：决定性的尽调包必须包括产品线收入、实际成交定价、毛利率桥、当前现金与烧钱速度，以及全部融资义务。
