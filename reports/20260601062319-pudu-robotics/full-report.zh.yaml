      - number: '7.4'
        title: 采用集中度让执行失误空间更小
        blocks:
          - type: paragraph
            body: >-
              普渡当前的下行风险被集中度放大。公司称商用清洁在 2025 年超过总收入的
              70%，这意味着一个品类正在承载增长故事，尽管管理层仍将酒店餐饮劳动力短缺、客人预期和卫生压力描述为重要需求驱动因素。这并非天然负面——聚焦往往推动规模——但它使运营模式对较少数高出货量用例中的续约质量、ROI
              证明和安装后可靠性更加敏感。学术证据强化了这种谨慎：酒店机器人持续使用很大程度取决于感知可靠性和保障，而员工感知研究显示，即使服务机器人解决用工缺口，也可能引发对低效率、智能水平和隐私的担忧。换言之，客户采用并不只取决于劳动力稀缺；它取决于机器人在新鲜感消退后是否仍然运转得足够好，使员工和客人仍愿意选择它。


              这就是为什么风险章节不能止步于“普渡融到了钱”。最新融资显然有帮助，但公开证据仍指向一家公司：它必须持续投资制造产能、现场支持、集成和具身 AI
              开发，同时证明清洁和酒店餐饮邻近需求的集中不会带来增长放缓、利润率压力或更高服务义务。因此，最可执行的尽调动作是把这些风险转化为硬触发条件：反复出现的网络事件、关键 SKU
              缺失认证包、经销商纠纷、补丁或上线变慢、贸易驱动的交期激增，或有证据显示客户在服务机器人从新奇采购变成运营基础设施后犹豫续约。
