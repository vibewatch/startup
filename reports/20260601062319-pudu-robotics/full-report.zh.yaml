      - number: '1.4'
        title: 里程碑、合作伙伴与反向运营信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正从餐厅送餐机器人扩展到清洁、工业物流和具身 AI。公开节点包括 2021 年 Series C、2023 年 2 月 C3 融资、2023 年 5 月 C4 融资、日本 Skylark 的
              3,000 台订单，以及与 KONE 合作打造智慧楼宇服务。2025 年，产品和监管信号加速：Pudu 3 月发布半人形具身 AI 服务机器人 FlashBot Arm；T300 取得 CE-MD 和
              CE-RED 认证；T300 作为公司首款工业机器人获得 Red Dot Award。到 2025 年 11 月，公司已公开把 iREX 2025 定位为展示最新具身机器人和完整产品线的场合。

              反向里程碑来自网络安全，而不是收入崩塌或法律制裁。The Register 和 Hackmag 分别在 2025 年 8 月下旬和 9 月初报道，一名研究人员发现漏洞：攻击者只要拿到有效
              token——可通过跨站脚本甚至试用账户流程取得——就能重定向机器人、重命名机器人，或关闭机器人集群。两篇报道都称，研究人员提醒 Skylark、Zensho 等客户之后，Pudu
              才认真介入；两篇也都称，公司随后修复了漏洞，并创建专用报告地址。对尽调而言，风险含义有两层：第一，Pudu 的规模让运营安全失误不能被视为小问题；第二，公司补救说明问题可修，但也说明在公司走向独角兽规模融资和潜在
              IPO 准备时，公众信任和企业治理会更重要。
