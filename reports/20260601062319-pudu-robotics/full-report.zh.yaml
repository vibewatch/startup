      - number: '5.3'
        title: 软件平台、开发者界面与运营工具
        blocks:
          - type: paragraph
            body: >-
              Pudu 的公开软件架构看起来是分层的，不是临时拼接。公司级 Open Platform 页面承诺开放导航控制、地图管理、语音定制和运营数据。专门的 open.pudutech.com
              文档走得更远，暴露了机器人任务、回调、调度、控制命令和统计等 Cloud API 类别，同时把机器人侧 SDK 拆成 PdCoreSDK 和
              PdIntegrationSDK。这有意义，因为它意味着低层机器人能力访问和高层业务集成逻辑被拆开。管理平面看起来也有商业活跃度。PUDU Link 同时出现在 Google Play 和 App
              Store，并有 2026 年 3
              月更新、明确的深圳卖家或开发者，以及不收集应用数据的披露。这些应用商店信息不能替代企业安全尽调，但确实说明控制层仍作为活软件维护，而不是被遗忘的配套应用。最终浮现的整体架构，是两层栈：一边是机器人侧控制和可扩展性，另一边是云
              API、调度、仪表盘、回调和移动管理。该架构贯穿配送、工业和清洁机器人，也解释了 Pudu 如何支撑如此宽的产品组合，而不被垂直场景完全切碎。
