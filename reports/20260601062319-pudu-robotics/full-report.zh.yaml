    layout: compact
    summary: 按当前价格看，公司在市场验证和产品广度上得分较高，但估值支撑和披露质量得分偏低。
    approximationNotes: 分数是基于留存证据构建的 1-5 分分析评级，不是公司披露的 KPI。
    data:
      items:
        - label: 市场需求
          value: 4
          unit: /5
          detail: 机器人融资窗口重新打开，Pudu 也明确卖进了真实商业场景。
        - label: 商业验证
          value: 4
          unit: /5
          detail: 部署足迹和据称增长支持公司已越过试点阶段。
        - label: 产品广度
          value: 4
          unit: /5
          detail: 清洁、配送、工业和具身 AI 的产品广度拓宽了可触达市场。
        - label: 经济性披露
          value: 1
          unit: /5
          detail: 未公开审计收入、毛利率、ARR 或现金消耗桥接。
        - label: 估值支撑
          value: 2
          unit: /5
          detail: 当前估值标记只有在尚未被公开证明的收入假设下，才可能合理。
        - label: 退出准备度
          value: 2
          unit: /5
          detail: 战略买家或跨界投资人路径看起来比近期 IPO 更现实。
        - label: 下行保护
          value: 1
          unit: /5
          detail: 优先权和反稀释条款仍未披露。
