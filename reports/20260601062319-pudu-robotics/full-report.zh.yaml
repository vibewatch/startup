      - number: '2.3'
        title: 采用驱动因素、地域组合与政策顺风
        blocks:
          - type: paragraph
            body: >-
              核心需求驱动因素，是重复性服务工作流里的劳动力短缺。Mordor 明确把服务机器人增长与劳动力短缺、医院积压和电商履约压力联系起来。U.S. Bureau of Labor Statistics
              数据显示，2026 年 3 月休闲和酒店餐饮行业仍有约 956,000 个职位空缺，而 2026 年 4 月就业人数仍接近 16.978 million。National Restaurant
              Association 的 2026 年行业展望称，运营方预计就业人数将达到 15.8 million，并仍优先投入技术、自动化和数据分析，以应对成本压力和人员配置不稳定。在医疗领域，WHO 2025
              年护理更新显示，2023 年全球护士短缺仍为 5.8 million，2030 年预计仍短缺 4.1 million，这支撑了非临床物流自动化的逻辑：把稀缺护理时间重新调配出来。


              地域组合分化明显。北美当前在酒店餐饮和配送机器人代理市场中份额领先，但亚太在更宽的服务机器人市场中领先，也是服务、酒店餐饮、零售和物流多个视角下增长最快的地区。这一点重要，因为政策支持在亚洲最强。IFR 称，中国
              2026-2030 年第十五个五年规划把机器人放在现代工业体系核心位置；SCIO/Xinhua 以及 2026 年 MIIT 标准推进也显示，中国正在扩展机器人标准、具身 AI
              基础设施和特殊需求服务机器人类别。日本继续通过 Monozukuri 以及 2026 年数字 / AI 补贴门户补贴设备和数字化，降低中小企业实际采用成本。Singapore 的 NRP 获得约 SGD 60
              million 等值新增资金，用于制造、物流、设施管理和医疗机器人，并推出 RoboNexus 加速商业化。合在一起，这些政策让亚太既是增长最快的需求池，也是 Pudu 产品类别最受国家支持的生态。
