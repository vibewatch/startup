  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 组合宽度与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Pudu 2026 年公开产品技术图景，不是单一机器人故事。官方产品界面把公司分成商用清洁、商业配送、工业配送和 Pudu X-Lab；学院手册索引则把这一视角落到具体支持产品线：仍包括 BellaBot 和
              BellaBot Pro、KettyBot 和 KettyBot Pro、HolaBot、FlashBot 和 FlashBot Max、SwiftBot、T300、CC1 和 CC1 Pro、MT1 变体，以及
              SH1。这一点重要，因为它显示公司维持了宽安装基数支持面，而不是转向狭窄展示型组合。工作流拆分也清楚。BellaBot 和 BellaBot Pro 面向前厅配送和互动；KettyBot Pro
              把配送、接待和广告压进窄通道形态；HolaBot 处理更重的后场和医院转运任务；FlashBot 和 FlashBot Max 进入多楼层楼宇物流；SwiftBot 保持为灵活通用的室内配送机器人；T300
              是工业 AMR；CC1 Pro 和 MT1 覆盖从四合一自主洗地到大型场馆干扫的清洁；FlashBot Arm 则代表具身 AI
              前沿。共同模式是，每个产品都映射到场地工作流中的明确任务，而不是泛泛的人形机器人叙事。
