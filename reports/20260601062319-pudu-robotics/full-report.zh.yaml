      - number: '8.2'
        title: 融资背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月融资的重要性，与其说是虚荣独角兽标签，不如说是一次检验：公开和私募机器人定价是否仍支持高溢价估值。积极的一面是，行业融资明显重新打开：Crunchbase 称机器人初创公司在 2025
              年已融资超过 60 亿美元，而 InforCapital 仅在 2026 年 4 月就统计到 70 起机器人融资公告和 28 亿美元披露融资。这解释了为什么普渡、Keenon、Bear
              以及其他具身或服务机器人公司仍受到关注。谨慎来自公开可比公司。Serve 和 Richtech 在很小的基数上以高得惊人的倍数交易，因为投资者是在资助期权价值，而不是当前盈利。Symbotic
              享有溢价，因为它有规模、现金和公开报告。Zebra 的交易倍数低得多，因为它成熟且多元化。iRobot
              展示了另一个极端：一旦增长和流动性破裂，公开市场可以把一个机器人品牌压到接近零的销售倍数。因此，普渡不能只用一个可比公司判断；它位于一个离散区间内，而披露证据尚未说明它应落在该区间的哪里。
