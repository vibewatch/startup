  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律负担上升速度快于公开披露
        blocks:
          - type: paragraph
            body: >-
              普渡正从餐厅配送扩展到工业物流、医疗配送和具身 AI
              辅助，这会显著提高每次部署所附带的合规负担。保留的公开记录显示的是多项政策重叠，而非单一主导规则：欧盟机械法现在明确旨在更好覆盖自主移动机械；欧盟无线电设备网络安全规则将联网设备与网络保护和隐私义务挂钩；美国医疗隐私规则要求对
              ePHI 采取行政、物理和技术保护措施；OSHA
              仍警告称，许多机器人事故发生在非常规运行条件下，尽管该机构没有机器人专门标准。这一组合很重要，因为普渡的医疗页面营销药品、实验室样本、餐食、布草和医疗废弃物运输，而 FlashBot Arm
              被定位为一种能够按电梯按钮、刷卡和开门的具身 AI 系统。


              好消息是缓释措施可见。普渡公开展示 T300 的 CE-MD 和 CE-RED
              认证，发布隐私政策，提供私有化部署和私有云选项，并将信息安全/隐私描述为通过正式政策治理。问题在于，保留的公开证据在产品线之间并不均衡：对 T300
              和平台级隐私控制最强，但对逐型号认证、客户特定数据处理条款，以及任何披露的责任或诉讼历史要薄得多。这并不证明存在隐藏法律问题，但确实意味着投资者不能仅凭营销页面承销医疗或工业扩张。因此，风险不只是监管本身；而是法律义务增长与外部披露不完整的组合，后者涉及这些义务如何在
              SKU、地域和渠道伙伴之间被运营化。
