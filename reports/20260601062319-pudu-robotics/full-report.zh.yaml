      - number: '2.4'
        title: 市场结构、买方经济性、壁垒与市场份额提示
        blocks:
          - type: paragraph
            body: >-
              市场结构由工作流驱动，不由品类驱动。餐厅买机器人，是为了替代跑堂往返并抹平高峰期吞吐；酒店买机器人，是为了不增加走廊人力也能处理备品或客房服务配送；医院买机器人，是为了减少护士和护工走动时间；设施团队买机器人，是为了稳定覆盖重复清洁；工业场地买机器人，是为了内部物料流转。因此，不同垂直场景里的买方、用户和付款方都会变化：运营负责人通常发起工作流，采购或财务批准预算，一线员工则决定试点后是否续用。公开基准支持经济逻辑，但不应被误认为
              Pudu 定价：Mordor 引用的月费显示，清洁机器人起价约 USD 1,500，移动仓储机器人起价约 USD 3,000；代表性部署的回本周期低于 18 个月，五年持有成本也明显低于早期世代。


              采用壁垒同样真实。Frontiers 2026 年餐厅部署研究强调，楼梯、门槛和设施布局错配会推高改造成本；MDPI 记录了员工与服务机器人共事时的隐私担忧、抵触和焦虑；HBR
              的酒店餐饮综述也解释了为什么劳动力短缺本身不等于无摩擦部署。这些壁垒重要，因为市场仍以试点为主，并非所有运营方都会进入规模化铺开。市场份额证据也需要同样谨慎。PR Newswire 引用 Frost &
              Sullivan 2023 年商业服务机器人报告称，Pudu 按收入拥有 23% 全球份额，位居全球第一。这一说法可作为有来源的市场叙事使用，但本章未独立审阅底层 Frost
              报告或方法。用于估值时，该数字最好视为低置信度 SOM 代理；更宽的结论——Pudu 是全球商业服务机器人领导者之一——则由其出货规模、垂直广度和国际足迹提供方向性支撑。
