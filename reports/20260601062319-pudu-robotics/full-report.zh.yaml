  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、结构与已披露牵引力
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个硬件主导的商业机器人模式，而且重心已经明显转向清洁。Pudu 自有网站现在把商用清洁、商业配送和工业配送列为商业类别；2026 年 Partner Summit 又把通用具身 AI
              作为第四条业务线加入，而不是作为一条独立披露收入线。财务上最重要的公司说法，是收入结构集中：Pudu 2026 年 3 月的清洁文章和 2026 年 4 月融资材料都称，2025 年商用清洁收入超过总收入
              70%，公司总收入同比翻倍。融资报道还称，工业配送产品上市一年内出货超过 4,000 台，说明非清洁业务在增长，但仍处次要位置。牵引力说法很强：Pudu 称已出货超过 120,000 台机器人，在 80
              多个国家和地区运营，并服务 Carrefour、Walmart、EDEKA
              等参考客户。缺失的是会计层。公开材料没有说明硬件收入是在发货、验收、分销商售出，还是在捆绑租赁或服务合同中确认；因此，收入叙事有意义，但还无法审计。
