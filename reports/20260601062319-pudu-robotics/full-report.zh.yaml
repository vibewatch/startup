            body: >-
              资产负债表故事更容易从 Pudu 的足迹读出，而不是从任何已发布财务报表读出，因为这样的报表并不存在。公司称 2026 年 4 月以超过 USD 1.5 billion 估值融资近 USD 150
              million，累计已披露融资现已超过 USD 300 million。管理层把新资本描述为具身
              AI、产品扩展、制造和供应链扩张的燃料，这与一家仍在为增长投入、而不是收割现金的公司相符。制造披露进一步强化了这个判断。Pudu 2025 年第 100,000 台机器人里程碑文章称，江苏超级工厂 2024 年
              8 月投产，占地超过 40,000 平方米，设计年产能 100,000 台。2026 年 4 月 Dallas
              公告又通过区域总部运营、美国双仓和本地化支持，增加了第二层固定成本和营运资本承诺。这些资产可以改善服务水平和渠道效率，但也意味着库存、物流和支持开销。由于公开来源没有披露当前现金、烧钱速度或债务，最新融资提高了对短期资本获取能力的信心，但没有说明准确现金跑道，也没有说明该模式能否不靠下一轮融资自我供血。
