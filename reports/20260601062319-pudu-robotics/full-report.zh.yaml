  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与产品重叠
        blocks:
          - type: paragraph
            body: >-
              Pudu 周围的活跃竞争场不是单一的一对一对手，而是分层格局，不同竞争者攻击不同预算线。Pudu
              当前自有材料显示，公司把食品服务、零售、酒店餐饮、工业仓储物流和医疗打包成一个统一栈来销售；在许多品牌仍以单一明星工作流切入的市场中，这种宽度并不常见。宽度意味着 Pudu
              可以在同一把伞下销售餐厅机器人、酒店客房配送机器人、大堂或零售助手，以及工业运输或清洁工作流，再向相邻场地交叉销售。在这组留存证据中，最接近的同类挑战来自 Keenon；其 2025 和 2026
              年材料已把餐饮机器人、增长中的清洁线、医疗和零售信息，以及具身 AI 路线图连接起来。Bear 仍是更尖的专家型对手：最强公开证据仍集中在酒店餐饮配送和室内物流，而不是完整整合的多垂直套件。Richtech
              在餐厅、酒店、医院、物流、清洁和饮品自动化上有实质重叠，但这种重叠落在一个更小、更偏美国的公开足迹内。Gaussian 主要是清洁侧翼。CloudMinds
              仍应列入表中，因为买方和投资者记得其早期野心；但留存证据显示，它现在更像监管和资本脆弱性的警示，而不是当前高置信度执行威胁。
