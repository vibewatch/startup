  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 指示性估值区间（USD b）
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 乐观
        - 经审计收入约 $200m 或更高，增长可持续，利润率符合高端自动化公司水准，且本轮条款干净。
        - 1.8-2.6
        - 只有扎实尽调扫清收入和条款缺口后才可能成立。
        - 如果 Pudu 证明有 Symbotic 式质量，同时服务机器人增长更快，倍数可以扩张。
      - - 基准
        - 经审计收入处在低至中段的数亿美元区间，部署继续增长，但经济性偏硬件，披露只适度改善。
        - 1.0-1.6
        - 与当前证据组合最一致。
        - 只有尽调没有暴露收入或条款意外时，当前估值才站得住。
      - - 悲观
        - 收入低于约 $100m，利润率薄，客户质量弱于表象，或优先权条款吃掉大部分上行。
        - 0.4-0.9
        - 如果尽调不达预期，风险显著。
        - 若经济性或条款落空，估值会向成熟或困境硬件可比公司重估。
    notes: 这些是低置信度情景估算，不是已披露数值。公开来源没有披露 Pudu 的绝对经审计收入、利润率结构或本轮经济性。
