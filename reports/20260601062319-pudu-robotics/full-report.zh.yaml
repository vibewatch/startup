      - number: '3.2'
        title: 资本、渠道与定价姿态
        blocks:
          - type: paragraph
            body: >-
              规模和渠道杠杆，是这个赛场内最大的分隔线。Pudu 2026 年融资披露对一家私营服务机器人供应商来说异常强：公司称 2026 年融资近 USD 150 million，累计已披露融资超过 USD 300
              million，已出货超过 120,000 台，并在 80 多个国家和地区运营。这组组合比任何单一规格表更重要，因为它意味着更强的采购杠杆、备件覆盖和渠道信心。Bear 在留存证据中没有披露同等单位数据，但 LG
              取得 51 percent 控制权，实质改变了 Bear 的渠道故事：它背后多了一个已经向商业环境销售 B2B 设备的大型母公司。Keenon
              的证据指向另一种模式：本组证据中公开规模细节较少，但持续产品投资和地域推进的信号很强，尤其是欧洲清洁部署和具身 AI 路线图。Richtech 的突出点不是绝对规模，而是透明度。其 SEC 文件显示，公司全面转向
              RaaS，披露了 25 台 ADAM 合同，并在美国本土和 Hawaii 建有活跃部署与维护基础设施。定价是格局中最不透明的部分。官方供应商页面大多采用询价模式。留存公开基准只有分销商式估算和一个
              Richtech 合同案例，因此买方很可能通过渠道、服务条款和机队打包谈判，而不是按整齐标价横向比较。
