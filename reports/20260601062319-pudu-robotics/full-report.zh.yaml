  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态
      - 收入锚点
      - 估值 / 市值
      - 隐含倍数 / 参考
      - 相关性与局限
    rows:
      - - Pudu 当前轮次
        - 私营 / 2026
        - 收入未公开披露
        - 披露估值 >$1.5b
        - 仅为名义标记
        - 这是当前参考点，但公开证据没有显示经审计收入或条款。
      - - Serve Robotics
        - 上市
