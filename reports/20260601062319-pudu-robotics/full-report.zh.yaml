      - - 风险评级
        - 高
        - 未披露的收入规模、硬件利润率和优先权条款，都可能实质性影响股权价值。
      - - 估值判断
        - 偏高
        - 现有公开证据尚未证明超过 $1.5 billion 的估值公允。
