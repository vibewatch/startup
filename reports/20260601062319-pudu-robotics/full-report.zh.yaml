  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 为何破坏投资逻辑
      - 行动含义
    rows:
      - - 收入底线落空
        - 经审计收入算下来，Pudu 的销售倍数大致高过 Symbotic 式水平，但披露质量跟不上 Symbotic。
        - 当前轮次等于要求投资人按高端自动化价格买入，却拿不到高端自动化证据。
        - 下调持仓估值，或拒绝参与本轮。
      - - 优先权悬顶
        - 参与型优先股、重度反稀释，或严重压低普通股上行的投资人权利。
        - 名义投后估值会高估新普通股资本的真实上行。
        - 承诺前重新拆股权结构模型。
      - - 利润率失望
        - 产品线利润率更接近困境硬件，而不是高质量自动化同业。
        - 即使出货量仍高，增长也无法转化为企业价值。
        - 切到悲观情景，并压低价格。
      - - 客户质量落空
        - 头部客户集中度或重复部署疲弱，削弱商业化叙事。
        - 装机基础的宣传口径不等于可持续收入质量。
        - 等队列数据改善后再投资。
      - - 退出准备停滞
        - 下一轮融资周期前仍没有审计包或治理升级。
        - 流动性路径仍窄，非流动性折价应扩大，而不是收窄。
        - 按仅战略买家退出建模，并下调公允价值。
    notes: 这些触发因素为投委会使用而设计：每一项都把具体尽调输出映射到清晰的估值后果。
    claimRefs:
      - CV045
      - CV046
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入桥
        - 2025 年经审计收入，以及按产品线拆分的 2026 年年初至今桥接。
        - 这是公允价值最重要的单一输入。
        - 财务团队 + QoE 服务方。
      - - 产品线毛利率
        - 按清洁、配送、工业和具身 AI 线拆分的毛利率。
        - 估值取决于产品组合究竟是高端自动化，还是薄利硬件。
        - 财务 + 运营审阅。
      - - 客户集中度和队列
        - 头部客户占比、重复部署、留存，以及按车队队列拆分的利用率。
        - 证明 120k+ 台设备能否转化为可持续企业价值。
        - 销售运营 + 客户成功资料室。
      - - 股权结构表和条款清单
        - 2026 年 4 月融资的优先股堆叠、董事会权利、反稀释条款和任何附函。
        - 决定独角兽头衔是否反映普通股经济性。
        - 法律顾问 + 领投方附函。
      - - 现金、烧钱速度和营运资本
        - 现金余额、烧钱速度、库存积累、融资需求和制造产能利用率。
        - 资本密集度决定稀释风险和下一轮融资时点。
        - CFO 材料 + 工厂运营审阅。
      - - IPO 或跨界融资准备度
        - 审计、治理材料、法律实体图谱和报告节奏。
        - 厘清退出路径和所需的流动性折价。
        - 董事会材料 + 外部投行。
    notes: 这些尽调问题按改变建议和投资人愿付价格的速度排序。
    claimRefs:
      - CV005
      - CV040
      - CV046
      - CV047
      - CV050
      - CV051
