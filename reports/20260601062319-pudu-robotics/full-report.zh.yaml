      - number: '1.3'
        title: 资本基础、投资者组合与指标披露缺口
        blocks:
          - type: paragraph
            body: >-
              到 2026 年 6 月，Pudu 显然已进入后期私营公司阶段。公司 2026 年 4 月 23 日宣布融资近 $150 million，估值超过 $1.5 billion，累计融资超过 $300
              million。DealStreetAsia、The Robot Report、Frontier Enterprise 和 SiliconANGLE
              的独立报道都复述了同一头部信息。更早融资显示，其资本历史不是一次跳升，而是层层累积：The Robot Report 称 Pudu 2021 年 8 月 Series C 合计 $155
              million，投资方包括 Meituan 和 Shenzhen Investment Holdings；Pudu 自己 2023 年 5 月的新闻稿称，继 2023 年 2 月从 Puhua Capital
              获得超过 $15 million 的 C3 轮之后，公司又完成数亿元人民币的 C4 轮；DealStreetAsia 则称 2023 年 Series C+ 轮合计约 $170 million，投资方包括
              Sequoia Capital China、Meituan 和 Shenzhen Investment Holdings。

              最新一轮的投资者名单，是披露质量下滑的地方。2026 年官方新闻稿强调战略投资者和产业伙伴，但没有点名；Gasgoo 随后报道称，Longgang Financial Holding 和 Ya Capital
              共同领投，BAIC Industrial Investment、Lens Technology、Highlight Capital
              以及政府引导基金参投。该报道可信且有方向性价值，但它仍是第三方名单，不是官方点名的股权结构披露。指标披露同样不均衡：Pudu 对外称 2025 年收入增长 100%，清洁机器人收入占比超过
              70%，工业配送产品上市约一年内出货超过 4,000 台，并引用 Frost & Sullivan 的 23% 全球市场份额；但在留存公开来源中，公司没有披露绝对收入、ARR、员工数或客户数。
