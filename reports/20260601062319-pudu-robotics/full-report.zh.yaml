        title: 自主栈、导航与楼宇集成
        blocks:
          - type: paragraph
            body: >-
              Pudu 技术护城河中公开记录最强的部分，是反复出现在多个产品家族里的自主栈。BellaBot 披露了 LiDAR 与视觉 SLAM 双导航，以及三颗 RGBD 摄像头实现全向避障；BellaBot Pro
              又加入更丰富的感知包，包括摄像头、RGBD 传感器、雷达和 VSLAM-plus 部署表述。KettyBot Pro 把同一主题移入紧凑服务形态，采用激光加视觉导航，并用 PUDU Scheduler
              做机器人间协调。FlashBot 是楼宇系统真正成为产品楔子的地方：学院介绍和当前 FlashBot Max
              页面都围绕电梯操作展开，官方页面还加入云端和硬件电梯控制路径、闸机集成、舱格校验，以及快速多楼层地图复制。SwiftBot 以电梯控制外设和更丰富通信接口延续同一逻辑；T300 加上单独的 Elevator
