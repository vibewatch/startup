  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑为何成立
      - 反向逻辑为何仍有杀伤力
      - 什么会改变判断
    rows:
      - - 规模证明
        - 120k+ 台设备、80+ 个国家以及 2025 年 100% 增长，说明商业化真实存在，不是概念阶段炒作。
        - 这些指标来自公司口径，不能直接等同于经审计收入或毛利率。
        - 一份经审计收入桥，说明部署如何转化为确认的销售和服务收入。
      - - 产品宽度
        - 清洁、配送、工业物流和具身 AI 扩大了增长触点。
        - 产品线越宽，也越可能掩盖不同产品族的盈利差异和渠道复杂度。
        - 按品类披露产品线毛利率和附加销售率。
      - - 融资渠道
        - 2026 年 4 月融资和 2025-2026 年机器人融资热潮，显示投资者胃口仍在。
        - 有钱可融不代表普通股有上行空间，尤其当条款偏向投资人或价格已打满时。
        - 最新一轮的股权结构表、优先股堆叠和领投方权利。
      - - 可比公司框架
        - Symbotic 和 Zebra 说明，规模和披露足够强时，自动化公司可以支撑高估值。
        - Serve、Richtech 和 iRobot 说明，公开市场既可能为极小收入狂热定价，也可能在经济性破裂时极其严苛。
        - 收入规模进入合适的公开市场倍数区间，且利润率站得住。
      - - 退出路径
        - 战略资本和跨界资本可能按装机基础、供应链和 AI 可选性给 Pudu 定价。
        - 缺少经审计历史、治理细节和经常性收入披露，IPO 准备度仍低。
        - 可直接交给投行的报告包和治理材料。
    notes: 每一行都刻意围绕价格展开：反向逻辑不是否定公司质量，而是提醒披露改善后，投资假设可能大幅改变。
    claimRefs:
