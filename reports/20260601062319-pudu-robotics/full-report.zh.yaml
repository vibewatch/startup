            - 折扣或租赁条款可能推迟现金回收
            - 本地服务改善采用，但增加 opex
            - 关税和采购转移可能压缩利润率
        - id: visible-mitigation
          label: 可见缓释
          values:
            - 2026 年新增股权资本和持续需求增长
