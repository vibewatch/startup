  rows:
  - - Pudu
    - Restaurant delivery, hospitality, retail, logistics, cleaning, healthcare
    - 2026 USD 150M round; USD 300M+ cumulative disclosed funding
    - 120k+ units; 80+ countries and regions
    - Broadest disclosed cross-vertical suite in retained sources
    - Primary pages still do not offer directly comparable public list pricing
  - - Bear Robotics
    - Restaurant or hospitality delivery plus indoor logistics
    - LG controls 51% after exercising its option; initial USD 60M stake in 2024
    - Active markets disclosed in US, South Korea, and Japan
    - Strong hospitality execution plus parent-backed channel leverage
    - Public evidence is thinner outside hospitality and logistics
  - - Keenon
    - Dining robots, cleaning, healthcare, retail, industrial service
    - No retained public 2025 or 2026 round amount, but heavy roadmap investment is visible
    - Operating since 2010; Europe cleaning expansion visible in 2025
    - Closest breadth challenger with delivery, cleaning, and embodied-AI stack
    - Public deployment scale is less transparent than Pudu in retained sources
  - - Richtech
    - Restaurants, hotels, hospitals, logistics, cleaning, beverage automation
    - Nasdaq-listed and disclosing RaaS transition through SEC filings
    - 37 states and 80 cities on IR page; continental US and Hawaii support
    - Most transparent public comp with diversified hospitality workflows
    - Still looks US-centric and smaller than Pudu on visible scale
  - - Gaussian
    - Commercial cleaning only
    - No retained current funding disclosure
    - Multi-product cleaning line, but no retained installed-base disclosure
    - Serious cleaning specialist with autonomy stack depth
    - Not a hotel or restaurant delivery substitute
  - - CloudMinds
    - Historically broad cloud-robotics ambition
    - No retained stable current funding proof; adverse evidence dominates
    - 2025 collapse reporting plus entity-list history
    - Selective comp mainly as a cautionary case on regulatory and capital risk
    - Current operating footprint and product availability remain unclear
