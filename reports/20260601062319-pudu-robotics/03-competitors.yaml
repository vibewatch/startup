- id: TP005
  title: Moat durability and competitive risk register
  columns:
  - Pudu edge or risk
  - Supporting evidence
  - Main threat
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Cross-vertical portfolio
    - One consolidated page spans food service, retail, hospitality, logistics, and healthcare
    - Keenon breadth expansion
    - High
    - Breadth supports cross-sell and helps defend multiple budgets at one account
    - Verify repeat enterprise wins outside restaurants and how often one deployment leads to a second
      workflow
  - - Scale and capital
    - Pudu disclosed a USD 150M 2026 round, 120k+ units, and 80+ countries
    - Bear plus LG and future incumbent spending
    - High
    - Scale affects BOM costs, spares, service density, and channel confidence
    - Request current manufacturing capacity, support SLAs, and regional service coverage
  - - Restaurant execution
    - BellaBot and BellaBot Pro remain credible restaurant or retail products
    - Bear and Keenon delivery specialists
    - Medium
    - Restaurant buyers may prioritize fit, reliability, and aisle performance over platform breadth
    - Collect win-loss data by chain type, aisle width, and service intensity
  - - Cleaning adjacency
    - Pudu says cleaning is already over 70 percent of 2025 revenue
    - Gaussian specialist suite and Keenon KLEENBOT
    - High
    - Cleaning can become the profit pool that funds adjacent expansion and locks in facilities buyers
    - Validate cleaning margins, renewal rates, and cross-sell into non-cleaning workflows
  - - Pricing opacity
    - Official pages do not show directly comparable list prices and partner guides warn prices vary by
      region
    - Distributor-led discounting and feature convergence
    - High
    - Opaque pricing can make a broad category commoditize quickly once hardware features look similar
    - Gather distributor quotes, realized discounts, and service-bundle terms by region
  - - Trust and regulatory resilience
    - CloudMinds shows how sanctions and capital stress can impair a robotics story
    - Supply-chain or export-control shocks across the sector
    - Medium
    - Enterprise buyers care about supply continuity, compliance, and long-term serviceability
    - Review component dependencies, export-control exposure, and fallback suppliers
  notes: Severity is an analytical judgment built from retained public evidence, not management guidance.
