  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized restaurant-robot pricing
    missingEvidence: Current realized ASPs, lease terms, discount bands, and service bundles for live
      Pudu, Bear, and Keenon deployments are not publicly disclosed in retained sources. The available
      pricing evidence is limited to partner estimates and one public RaaS contract example from Richtech.
    whyItMatters: Without realized pricing, the chapter can compare public positioning but cannot prove
      whether Pudu wins on price, margin, or total cost of ownership versus direct peers. Pricing opacity
      is one of the clearest ways a seemingly broad moat can compress into a commodity hardware contest.
    diligencePath: Request distributor quotes and enterprise proposals from at least two regions for Pudu,
      Bear, and Keenon. Ask management for internal competitive pricing decks, realized discount ranges,
      and attach-rate assumptions for software, service, and spare batteries.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: peer deployment counts
    missingEvidence: Current deployed unit counts for Bear, Keenon, Gaussian, and Richtech are incomplete
      or non-comparable in retained public evidence. Pudu discloses shipments, but peer disclosures are
      thinner and often qualitative.
    whyItMatters: Installed-base disclosure is one of the best public proxies for manufacturing scale,
      support density, spare-parts leverage, and data-network effects. Without it, relative scale judgments
      outside Pudu remain directional instead of precise.
    diligencePath: Collect current investor decks, distributor presentations, and regional reseller materials
      for Bear, Keenon, Gaussian, and Richtech. Ask management for internal win-loss files or channel
      dashboards that track competitor installed base by region and vertical.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP004
  - type: access-blocked
    severity: material
    topic: cloudminds current operating footprint
    missingEvidence: Retained public evidence shows CloudMinds on the Entity List and facing 2025 collapse
      reports, but current official operating pages were not reliably retrievable during this run. That
      leaves the company's surviving product availability and regional operating footprint unresolved.
    whyItMatters: CloudMinds matters less as a direct commercial benchmark than as a cautionary case on
      sanctions, supply-chain fragility, and capital stress. Confirming whether it still supports any
      material commercial deployments would sharpen the chapter's view on substitute risk and channel
      durability.
    diligencePath: Retry CloudMinds official pages from a lower-friction network profile or with management-provided
      source packs. Supplement with court records, customer references, and current trade-show appearances
      to determine whether the company is still shipping or only preserving legacy relationships.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
