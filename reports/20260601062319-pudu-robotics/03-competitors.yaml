figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: Pudu combines the broadest retained official portfolio evidence with the strongest currently
    disclosed scale signal; Keenon is the nearest breadth challenger, while Bear and Gaussian are sharper
    specialists.
  data:
    xAxis:
      label: Portfolio breadth (0=narrow specialist, 10=multi-vertical service stack)
    yAxis:
      label: Scale and channel strength (0=impaired, 10=deep capital plus deployment signal)
    points:
    - label: Pudu
      x: 9
      y: 9
      detail: Consolidated coverage across food service, retail, hospitality, logistics, and healthcare
        plus 120k+ units, 80+ countries, and a 2026 funding round.
      tone: positive
    - label: Keenon
      x: 8
      y: 7
      detail: Breadth across dining, cleaning, healthcare, and industrial scenarios with Europe cleaning
        expansion and a humanoid or VLA roadmap, but thinner retained public scale metrics than Pudu.
      tone: neutral
    - label: Bear Robotics
      x: 6
      y: 8
      detail: Hospitality and logistics specialist with strong fleet-control messaging and LG majority
        ownership that upgrades channel leverage.
      tone: neutral
    - label: Richtech
      x: 6
      y: 5
      detail: Publicly disclosed multi-vertical suite and RaaS model, but visible deployment footprint
        remains concentrated in the US.
      tone: neutral
    - label: Gaussian
      x: 3
      y: 4
      detail: Strong cleaning specialist with a broad cleaning lineup, but no retained evidence of comparable
        delivery or hotel-service breadth.
      tone: neutral
    - label: CloudMinds
      x: 2
      y: 1
      detail: Historically ambitious, but sanctions history and 2025 collapse reports materially weaken
        current competitive credibility.
      tone: negative
  approximationNotes: The axes are ordinal judgments synthesized from retained evidence on product breadth,
    parent backing, funding, deployment, and channel strength; they are not audited market-share measurements.
