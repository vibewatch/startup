company:
  name: Pudu Robotics
chapter:
  number: 3
  title: Competitors
  summary: Pudu enters 2026 with the broadest actively evidenced cross-vertical service-robot portfolio
    in this set and the strongest disclosed scale signal, supported by a new USD 150 million round, 120,000-plus
    shipped units, and 80-plus countries. Keenon is the closest active breadth challenger because it now
    combines dining, cleaning, healthcare, and humanoid or VLA messaging, while Bear is the sharpest hospitality
    specialist thanks to LG backing. Richtech is the most transparent public comp but remains smaller
    and US-centric; Gaussian is a cleaning specialist flank; and CloudMinds appears competitively impaired
    rather than a healthy frontline rival.
sections:
- id: landscape-overlap
  title: Landscape and product overlap
  body: 'The active competitive field around Pudu is not a single one-to-one matchup; it is a layered
    field where different rivals attack different budget lines. Pudu''s own current materials show the
    company pitching one consolidated stack across food service, retail, hospitality, industrial warehouse
    logistics, and healthcare, which is unusual in a market where many brands still lead with one hero
    workflow. That breadth means Pudu can sell a restaurant robot, a hotel room-delivery robot, a lobby
    or retail helper, and an industrial transport or cleaning workflow under the same umbrella, then cross-sell
    deeper into adjacent sites. In this retained evidence set, the closest like-for-like challenge comes
    from Keenon, whose 2025 and 2026 materials now bridge dining robots, a growing cleaning line, healthcare
    and retail messaging, and an embodied-AI roadmap. Bear remains a sharper specialist: its strongest
    public evidence still centers on hospitality delivery and indoor logistics rather than a fully consolidated
    multi-vertical suite. Richtech has meaningful overlap across restaurants, hotels, hospitals, logistics,
    cleaning, and beverage automation, but that overlap sits inside a smaller, US-centric public footprint.
    Gaussian matters mainly as a cleaning flank. CloudMinds still belongs in the table because buyers
    and investors remember its earlier ambitions, but the retained evidence now makes it more relevant
    as a warning sign on regulatory and capital fragility than as a current high-conviction execution
    threat.'
