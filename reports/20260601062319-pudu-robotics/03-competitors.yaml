    - Solution-led facility sales motion
    - Specialist focus likely concentrates service and production on cleaning form factors
    - Strong on cleaning depth, not broad service stack
  - - CloudMinds
    - 2025 collapse reports dominate current evidence
    - Channel credibility appears impaired by sanctions and capital stress
    - Entity-list history can complicate supply continuity and customer trust
    - Weak current commercialization signal
