- id: TM004
  title: Geography and Policy Tailwinds Table
  columns:
  - geography_or_policy
  - evidence
  - timing
  - implication_for_pudu
  - limitation_or_caveat
  rows:
  - - Asia-Pacific broad robotics growth
    - 'Mordor service robotics: 38.28% share in 2025 and 20.57% CAGR through 2031'
    - Current plus medium term
    - Home-region demand is structurally attractive for a China-based vendor
    - Broad service-robotics scope includes categories beyond Pudu
  - - North America current commercial demand
    - Hospitality robots 37.70% share in 2025; delivery robots 42% share in 2024
    - Current
    - Pudu must compete in a region that often leads installed share even when APAC leads growth
    - Current share leadership does not guarantee fastest future growth
  - - China 15th Five-Year Plan
    - IFR says 2026-2030 plan puts robotics at heart of modern industrial system
    - 2026 onward
    - Supports domestic robotics investment, standards work, and ecosystem depth
    - Not a direct proof of Pudu-specific procurement preference
  - - China standards push
    - SCIO/Xinhua and MIIT-related coverage show 2026 standards expansion for embodied AI and special-needs
      service robots
    - 2026 onward
    - Raises regulatory legitimacy and may accelerate scenario-based deployment of service robots
    - More focused on standards than direct subsidies
  - - Japan SME support
    - Monozukuri support plus 2026 digital/AI subsidy portals reduce equipment and software adoption cost
    - Active 2026 cycle
    - Could lower buyer capex/opex barriers in a robotics-friendly market
    - Public pages do not confirm Pudu-specific product eligibility
  - - Singapore robotics ecosystem
    - NRP received about SGD 60M new funding and launched RoboNexus to accelerate commercialization
    - 2024-2026
    - Creates reference customers and ecosystem partners in logistics, FM, and healthcare
    - Singapore is strategically important but small in absolute market size
  notes: Policy evidence is strongest for ecosystem support, standards, and subsidy availability. It is
    weaker on Pudu-specific approved-vendor status or procurement quotas.
