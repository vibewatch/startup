company:
  name: Pudu Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Pudu Robotics sits inside a stack of overlapping markets rather than one cleanly published
    TAM: public 2025 service-robotics estimates range from USD 26.35 billion to USD 68.31 billion depending
    on whether analysts include medical, consumer, defense, and logistics categories, while the most directly
    aligned hospitality-robot proxy is only USD 0.61-0.70 billion in 2025. Demand is strongest where labor
    shortages, hygiene requirements, and intra-facility logistics pain intersect — especially hospitality
    delivery, healthcare support, commercial cleaning, and Asia-Pacific-led automation programs — but
    public SAM precision remains poor. A Frost-attributed claim that Pudu held 23% global commercial-service-robotics
    share in 2023 is supportable only as a company-linked PR citation, not as an independently audited
    SOM fact.'
sections:
- id: market-boundary-and-sizing
  title: Market Boundary and Addressable Market Framing
  body: 'Pudu Robotics does not map cleanly to one standardized market bucket. Its own company materials
    describe four active product lines — service delivery, commercial cleaning, industrial delivery, and
    general embodied AI — deployed across hospitality, retail, healthcare, food and beverage, public services,
    and industrial facilities. That means the relevant market boundary is narrower than the full global
    service-robotics universe but broader than restaurant delivery robots alone. The most defensible definition
    for this chapter is indoor commercial service robots plus intra-facility delivery robots used in restaurants,
    hotels, hospitals, retail/facilities environments, and light industrial campuses. This included spend
    covers hardware, fleet-management software, maintenance, and robot-as-a-service contracts for those
    workflows.


    Important exclusions are consumer cleaning robots, surgical and rehabilitation robots, outdoor last-mile
    delivery bots, and full warehouse automation stacks such as AS/RS systems and warehouse-only picking
    robots. Public TAM estimates are therefore only directional. Fortune Business Insights places global
    service robotics at USD 26.35 billion in 2025, Precedence Research at USD 62.85 billion, and Mordor
    Intelligence at USD 68.31 billion; the spread is too wide to treat as one precise valuation anchor
    because each report uses different inclusion logic. The best public SAM proxies for Pudu''s core operations
    are hospitality robots, delivery robots, broader cleaning robots, retail robotics, and logistics robots.
    None isolates a 2025/2026 China-only or Pudu-specific SAM, so the chapter preserves proxy-based sizing
    rather than forcing a false single-number TAM/SAM/SOM stack.'
