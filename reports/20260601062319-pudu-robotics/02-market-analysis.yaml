  evidenceGaps:
  - type: missing-source
    severity: material
    topic: china-or-company-specific-sam
    missingEvidence: A public 2025 or 2026 market model that isolates China-only or Pudu-specific SAM
      across restaurant, hotel, cleaning, healthcare, retail, and intrafacility logistics robots.
    whyItMatters: Without a clean regional or company-specific SAM, valuation has to rely on proxy stacking
      rather than a defendable one-line penetration model.
    diligencePath: Obtain Chinese-language analyst reports, venue-count bottoms-up models, or channel
      shipment data by region and vertical.
    relatedQuestionRefs:
    - QM008
    - QM027
  - type: missing-source
    severity: material
    topic: frost-primary-report
    missingEvidence: The full Frost & Sullivan commercial-service-robotics report, methodology, and share
      table that allegedly support Pudu's 23% 2023 revenue share claim.
    whyItMatters: Leadership claims can meaningfully affect market-structure assumptions and valuation,
      but the chapter only verified a company-linked PR citation.
    diligencePath: Acquire the original Frost report directly from Frost or from management, then reconcile
      its scope against public analyst categories.
    relatedQuestionRefs:
    - QM026
    - QM027
  - type: private-evidence-only
    severity: material
    topic: pilot-conversion-and-utilization
    missingEvidence: Pilot-to-rollout conversion rates, fleet utilization, uptime, and renewal data by
      vertical for hotel, restaurant, hospital, and facilities deployments.
    whyItMatters: Public market growth does not translate directly into durable revenue if pilots fail
      to convert or if utilization is weak after launch.
    diligencePath: Request cohort data from management and channel partners, plus customer references
      covering deployment size, uptime, and renewal.
    relatedQuestionRefs:
    - QM017
    - QM025
    - QM027
  - type: enumeration-incomplete
    severity: minor
    topic: japan-program-eligibility
    missingEvidence: A reviewed approved-product or approved-vendor list confirming whether Pudu's specific
      robots qualify under current Japanese labor-saving catalogs.
    whyItMatters: Japan subsidy support is directionally positive, but buyer economics depend on whether
      Pudu products can actually access those programs.
    diligencePath: Check current Japanese subsidy catalogs, local distributor materials, or application-support
      partners for product-level eligibility.
    relatedQuestionRefs:
    - QM022
    - QM027
    relatedTableRefs:
    - TM004
