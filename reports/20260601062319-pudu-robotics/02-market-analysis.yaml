tables:
- id: TM001
  title: Market Definition Table
  columns:
  - segment_category
  - included_spend
  - excluded_spend
  - buyer_payer
  - relevance_to_pudu
  rows:
  - - Restaurant and hotel indoor delivery robots
    - Indoor tray, amenity, and in-building delivery robots; fleet software; maintenance; RaaS contracts
    - Outdoor last-mile bots; kitchen automation; full warehouse automation
    - Restaurant or hotel operations buyer; ownership, procurement, or property operator payer
    - Core fit for BellaBot and hotel/building delivery workflows
  - - Commercial cleaning robots
    - Autonomous floor scrubbing, sweeping, vacuuming, cleaning dashboards, docks, and service plans for
      hospitality, retail, healthcare, and public venues
    - Residential vacuums; industrial-only cleaning systems unrelated to commercial venues
    - Facilities or housekeeping buyer; property operator or FM contractor payer
    - Core fit for CC1 and other cleaning products, but public market data often includes consumer units
  - - Healthcare logistics robots
    - Medication, food, linen, specimen, and supplies transport inside hospitals and healthcare campuses
    - Surgical, rehab, telepresence, and clinical-treatment robots
    - Hospital logistics/procurement buyer; hospital or health-system payer
    - Relevant adjacency because Pudu competes in non-clinical hospital logistics
  - - Retail and public-service robots
    - In-store delivery, shelf-scanning, cleaning, greeting, and building-service robotics in malls, supermarkets,
      and public venues
    - E-commerce-only fulfillment software, checkout-only kiosks, consumer smart-home devices
    - Store operations or facilities buyer; retailer or venue operator payer
    - Adjacent growth pool; public retail-robotics data is broader than Pudu's current product focus
  - - Industrial in-facility delivery robots
    - Material handling and internal transport robots used inside factories, campuses, and industrial
      facilities
    - Large-scale warehouse orchestration, AS/RS, robotic picking arms, yard automation
    - Plant or industrial operations buyer; factory or campus operator payer
    - Fit for T300 and related intralogistics use cases
  - - Status-quo substitutes
    - Human runner labor, janitorial labor, internal carts, manual shelf audits, porter workflows
    - Any spend unrelated to repetitive internal movement or cleaning
    - Budget owner varies by venue
    - These substitutes determine ROI thresholds and payback expectations
  notes: Included scope is limited to indoor commercial service and intra-facility delivery workflows.
    Public market proxies often overstate Pudu's SAM by bundling consumer cleaning, surgical robots, or
    warehouse-only automation.
