- id: market-structure-and-buyer-economics
  title: Market Structure, Buyer Economics, Barriers, and the Market-Share Caveat
  body: 'The market structure is workflow-driven, not category-driven. Restaurants buy robots to replace
    runner trips and smooth peak-period throughput; hotels buy them to handle amenity or room-service
    runs without adding corridor labor; hospitals buy them to reduce nurse and porter walking time; facilities
    teams buy them for repeatable cleaning coverage; and industrial sites buy them for internal materials
    movement. Buyer, user, and payer therefore change by vertical: operations leaders typically sponsor
    the workflow, procurement or finance approves the budget, and frontline staff determine whether the
    robot is renewed after a pilot. Public benchmarks support the economic logic but should not be mistaken
    for Pudu pricing: Mordor cites monthly fees starting around USD 1,500 for cleaning robots and USD
    3,000 for mobile warehouse robots, with sub-18-month payback in representative deployments and materially
    lower five-year ownership cost than earlier generations.


    Adoption barriers are equally real. Frontiers'' 2026 restaurant deployment research highlights stairs,
    doorsteps, and facility-layout mismatch as drivers of redesign cost; MDPI documents privacy concerns,
    resistance, and anxiety among employees asked to work alongside service robots; and HBR''s hospitality
    review shows why labor scarcity alone does not guarantee frictionless deployment. These barriers matter
    because the market is still pilot-heavy and not all operators progress to scaled rollout. The same
    caution applies to market-share evidence. PR Newswire, citing Frost & Sullivan''s 2023 commercial-service-robotics
    report, says Pudu held 23% global share by revenue and ranked first worldwide. That statement is supportable
    as a cited market narrative, but this chapter did not independently review the underlying primary
    Frost report or methodology. For valuation work, the number is best treated as a low-confidence SOM
    proxy, while the broader conclusion — that Pudu is one of the global leaders in commercial service
    robotics — is directionally supported by its shipped-unit scale, vertical breadth, and international
    footprint.'
