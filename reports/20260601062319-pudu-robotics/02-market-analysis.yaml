- id: TM005
  title: Growth Drivers, Barriers, and Buyer Economics Table
  columns:
  - factor
  - evidence
  - economic_effect
  - implication_for_adoption
  - diligence_ask
  rows:
  - - Labor shortages in hospitality
    - BLS and restaurant-industry data show persistent openings and automation investment
    - Raises labor-replacement value of delivery and cleaning robots
    - Strong near-term adoption tailwind in restaurants and hotels
    - Confirm whether shortages remain acute in each target geography
  - - Healthcare workforce strain
    - WHO reports 5.8M global nurse shortage in 2023, 4.1M still projected in 2030
    - Makes non-clinical logistics automation more valuable than in labor-abundant systems
    - Supports hospital logistics demand, especially for medication and linen transport
    - Validate hospital budget owners and procurement cycles by country
  - - RaaS and lower TCO
    - Mordor cites USD 1,500 monthly cleaning-robot fees, USD 3,000 mobile-warehouse fees, sub-18-month
      payback, and lower five-year TCO
    - Converts capex into opex and shortens payback hurdles
    - Expands addressable buyer base beyond large chains and hospitals
    - Verify Pudu-specific lease or subscription penetration and gross-margin impact
  - - Facility integration and layout fit
    - Frontiers shows stairs, doorsteps, and workflow mismatch can trigger redesign cost
    - Raises implementation cost and slows pilot-to-scale conversion
    - Creates a real barrier even when labor savings are obvious
    - Request deployment failure rates, elevator/PMS integration coverage, and retrofit costs
  - - Employee acceptance and privacy concerns
    - MDPI identifies resistance, anxiety, and privacy concerns in service-robot adoption
    - Can reduce utilization, delay deployment, or cap renewal rates
    - Particularly relevant in guest-facing hospitality and healthcare environments
    - Ask for utilization, NPS, complaint, and employee-retention data from live sites
  - - Over-inclusive market proxies
    - Cleaning, retail, and broad service-robotics reports include categories outside Pudu scope
    - Can overstate TAM and understate competitive intensity in Pudu's actual niches
    - Investors should prefer proxy stacking over one inflated TAM number
    - Build bottom-up geography-by-vertical model from shipped units, venue count, and ASPs
  - - Frost 23% share claim
    - PR citation provides a leadership narrative but no independently reviewed primary methodology in
      this chapter
    - Useful for market-positioning story, not for audited valuation math
    - Treat as low-confidence SOM proxy until primary report or channel data is obtained
    - Obtain full Frost report or third-party shipment audit before underwriting concentration assumptions
  notes: Economic benchmarks are market-level references rather than Pudu pricing. The table mixes sourced
    evidence with explicit diligence asks where the market remains pilot-heavy or methodologically inconsistent.
