- id: FM003
  title: Commercial Service Robot Adoption Funnel
  type: funnel
  layout: standard
  summary: Labor scarcity can open the door to automation, but most commercial buyers still pass through
    integration, pilot, and renewal gates before fleet scale-up.
  data:
    items:
    - label: 1. Workflow pain recognized
      value: 100
      detail: Venue sees labor shortage, hygiene burden, or internal-delivery bottleneck; staffing and
        nursing shortages are the usual trigger.
    - label: 2. Vendors shortlisted
      value: 55
      detail: Buyer compares product fit by vertical, venue layout, and service model rather than by one
        generic robotics category.
    - label: 3. Site and integration assessment
      value: 30
      detail: Floor plan, elevators, door widths, IT systems, and privacy concerns eliminate many opportunities
        before pilot approval.
    - label: 4. Pilot approved and deployed
      value: 18
      detail: Budget owner accepts opex/capex case; frontline users test whether labor relief and guest
        experience are real.
    - label: 5. Scaled rollout / renewal
      value: 8
      detail: Only a subset graduate to fleet rollout because utilization, staff acceptance, and ROI must
        hold in production use.
  claimRefs:
