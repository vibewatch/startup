  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Pudu enters valuation discussion with real operating proof: the company says it raised nearly USD 150
              million in April 2026, crossed a USD 1.5 billion valuation, shipped more than 120,000 robots, operates in
              more than 80 countries, and doubled revenue in 2025 while cleaning became the majority of mix. Those are
              not trivial milestones, and they explain why the company still attracts growth capital while robotics
              funding has reaccelerated. The problem is not the quality of the headline story; it is the price
              sensitivity of underwriting that story. Public evidence still does not disclose audited revenue,
              product-line gross margin, ARR, cash burn, or the preference stack behind the latest round. That gap means
              an investor cannot tell whether the current mark is underwriting a mature automation multiple, a
              speculative micro-cap robotics multiple, or something in between. The right stance is therefore
              research-more with medium confidence, a high risk rating, and stretched valuation posture until audited
              numbers and financing terms narrow the uncertainty.
