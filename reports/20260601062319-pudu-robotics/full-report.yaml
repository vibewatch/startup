      - number: '5.3'
        title: Software platform, developer surface, and operational tooling
        blocks:
          - type: paragraph
            body: >-
              Pudu's public software architecture looks layered rather than ad hoc. The company-level Open Platform page
              promises access to navigation controls, map management, voice customization, and operating data. The
              dedicated open.pudutech.com documentation goes further by exposing Cloud API categories for robot tasks,
              callbacks, scheduling, control commands, and statistics, while separately breaking the robot-side SDK into
              PdCoreSDK and PdIntegrationSDK. That is meaningful because it implies a split between low-level robot
              capability access and higher-level business integration logic. The management plane looks commercially
              active as well. PUDU Link appears both on Google Play and in the App Store with March 2026 updates, a
              named Shenzhen seller or developer, and disclosures that no app data is collected. Those app listings are
              not substitutes for enterprise security diligence, but they do show that the control layer is being
              maintained as live software rather than as a forgotten companion app. The overall architecture that
              emerges is a two-layer stack: robot-side control and extensibility on one side, and cloud APIs,
              scheduling, dashboards, callbacks, and mobile management on the other. That architecture is coherent
              across delivery, industrial, and cleaning robots and helps explain how Pudu can support such a broad
              portfolio without fragmenting completely by vertical.
