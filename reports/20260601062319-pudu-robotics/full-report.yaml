  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio breadth and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Pudu's public 2026 product-tech picture is not a single-robot story. The official products surface groups
              the company into commercial cleaning, commercial delivery, industrial delivery, and Pudu X-Lab, while the
              academy manual index extends that view into a concrete supported lineup that still includes BellaBot and
              BellaBot Pro, KettyBot and KettyBot Pro, HolaBot, FlashBot and FlashBot Max, SwiftBot, T300, CC1 and CC1
              Pro, MT1 variants, and SH1. That matters because it shows the company has kept a broad installed-base
              support surface alive rather than rotating into a narrow showcase set. The workflow split is also clear.
              BellaBot and BellaBot Pro target front-of-house delivery and engagement; KettyBot Pro compresses delivery,
              reception, and advertising into a narrow-aisle form factor; HolaBot addresses heavier back-of-house and
              hospital transfer tasks; FlashBot and FlashBot Max move into multi-floor building logistics; SwiftBot
              stays as a flexible general-purpose indoor delivery robot; T300 is the industrial AMR; CC1 Pro and MT1
              cover cleaning from four-in-one autonomous scrubbing to large-venue dry sweeping; and FlashBot Arm
              represents the embodied-AI frontier. The common pattern is that each product maps to an explicit job in a
              venue workflow rather than to a generic humanoid narrative.
