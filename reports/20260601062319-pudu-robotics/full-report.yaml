  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and product overlap
        blocks:
          - type: paragraph
            body: >-
              The active competitive field around Pudu is not a single one-to-one matchup; it is a layered field where
              different rivals attack different budget lines. Pudu's own current materials show the company pitching one
              consolidated stack across food service, retail, hospitality, industrial warehouse logistics, and
              healthcare, which is unusual in a market where many brands still lead with one hero workflow. That breadth
              means Pudu can sell a restaurant robot, a hotel room-delivery robot, a lobby or retail helper, and an
              industrial transport or cleaning workflow under the same umbrella, then cross-sell deeper into adjacent
              sites. In this retained evidence set, the closest like-for-like challenge comes from Keenon, whose 2025
              and 2026 materials now bridge dining robots, a growing cleaning line, healthcare and retail messaging, and
              an embodied-AI roadmap. Bear remains a sharper specialist: its strongest public evidence still centers on
              hospitality delivery and indoor logistics rather than a fully consolidated multi-vertical suite. Richtech
              has meaningful overlap across restaurants, hotels, hospitals, logistics, cleaning, and beverage
              automation, but that overlap sits inside a smaller, US-centric public footprint. Gaussian matters mainly
              as a cleaning flank. CloudMinds still belongs in the table because buyers and investors remember its
              earlier ambitions, but the retained evidence now makes it more relevant as a warning sign on regulatory
              and capital fragility than as a current high-conviction execution threat.
