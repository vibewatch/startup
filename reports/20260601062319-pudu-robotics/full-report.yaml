      - number: '2.2'
        title: Vertical Demand by Hospitality, Cleaning, Healthcare, Retail, and Logistics
        blocks:
          - type: paragraph
            body: >-
              Hospitality is the clearest direct proxy for Pudu's current business. Mordor Intelligence sizes the
              hospitality-robots market at USD 0.61 billion in 2025, rising to USD 2.23 billion by 2031 at a 24.10%
              CAGR, while The Business Research Company places the same segment at USD 0.7 billion in 2025 and USD 2.13
              billion by 2030. Inside that market, hotels hold the largest current revenue share at 43.35%, restaurants
              and bars are the fastest-growing end-user at 26.05% CAGR, delivery systems lead product mix at 39.05%, and
              North America leads current share while Asia-Pacific grows fastest. Precedence's delivery-robot market is
              narrower but still useful: USD 409.3 million in 2024 growing to USD 6.58 billion by 2034, with indoor
              delivery the fastest-growing type.


              The adjacent markets are much larger but less cleanly matched to Pudu. Grand View Research estimates
              logistics robots at USD 14.5 billion in 2024, with healthcare facilities among the faster-growing
              logistics end users as hospitals automate medication, food, and sample transport. Mordor's broader
              service-robotics work says logistics and warehousing accounted for 47.67% of 2025 demand, while healthcare
              is the fastest-growing end-user industry at 20.91% CAGR through 2031. Retail robotics and cleaning
              robotics are both growing quickly, but their public definitions overstate Pudu's addressable slice because
              they include shelf-scanning, checkout, and consumer cleaning products that Pudu does not fully address.
              The practical implication is that Pudu has several credible growth pools, but hospitality, commercial
              cleaning, healthcare support logistics, and intra-facility delivery remain the most relevant public
              comparables.
