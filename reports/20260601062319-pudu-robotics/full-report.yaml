chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics (Shenzhen Pudu Technology) presents itself as a Shenzhen-based commercial service robotics
              company founded in 2016 and now operating at global scale. The current company page describes a business
              built around four product lines—service delivery, commercial cleaning, industrial delivery, and general
              embodied AI—and the retained product pages confirm that those lines span BellaBot, the CC1 cleaning robot,
              the T300 industrial AMR, the FlashBot family, and a live SwiftBot product URL. The company page also
              frames Pudu as more than a single restaurant-robot vendor: it lists deployments across retail,
              hospitality, manufacturing, food and beverage, healthcare, education, public service, and property
              environments, which supports a one-line business model of selling and deploying commercial robots across
              multiple labor-intensive indoor workflows.

              The operating footprint is also large enough to anchor later chapters. Pudu says it has shipped more than
              120,000 robots across over 80 countries and regions, while listing global headquarters in Shenzhen and
              Hong Kong, R&D centers in Shenzhen, Chengdu, and Hong Kong, and overseas subsidiaries in Japan, South
              Korea, Singapore, the United States, and the Netherlands. Those claims are company-supplied, but they are
              repeated in the April 2026 PRNewswire release and the May 2026 BEYOND Expo speaker announcement, giving
              reasonable corroboration for headline scale even though the company does not publish a consolidated
              facility list, exact customer count, or headcount.
