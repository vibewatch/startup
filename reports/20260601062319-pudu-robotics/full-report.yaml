      - number: '4.4'
        title: Financial verdict and public diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The positive read-through is clear: Pudu appears to have real commercial momentum, meaningful
              manufacturing scale, and continuing access to private capital. Cleaning has become the dominant revenue
              pool, overseas markets appear to contribute the majority of sales, and the company has enough market
              credibility to raise a large 2026 round at unicorn-plus valuation. The negative read-through is equally
              important: almost every number that matters for underwriting remains private. There is no public P&L, no
              balance sheet, no debt schedule, no revenue-recognition policy, and no cohort view of gross margin,
              service cost, or discounting. Tariff and trade-war pressures add another external risk layer for any
              China-rooted hardware supply chain, even with Dallas logistics mitigation. On balance, the financial story
              is investable as a growth narrative but not yet underwriteable as a cash-flow narrative. The chapter
              therefore leans positive on demand quality and category positioning, cautious on margin durability and
              capital intensity, and explicit that the decisive diligence package must include product-line revenue,
              realized pricing, gross-margin bridges, current cash and burn, and all financing obligations.
