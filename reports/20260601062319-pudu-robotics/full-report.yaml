            body: >-
              The manufacturing and quality story is directionally positive but uneven in detail. Pudu's own
              100,000th-robot milestone article provides the strongest scale disclosure: the Jianhu super factory opened
              in August 2024, spans more than 40,000 square meters, targets 100,000 annual units, and claims IoT-backed
              supplier collaboration, quality traceability, and smart warehousing. That looks like real manufacturing
              infrastructure rather than just an R&D lab. The nuance is location. The public sources retrieved here
              support Shenzhen clearly as the corporate and software base because both app-store listings point to
              Shenzhen Pudu entities and addresses, but the explicit factory-scale disclosure points to Jianhu in
              Jiangsu rather than to a Shenzhen production site. On compliance, T300 is the cleanest case: external
              coverage of Pudu's March 2025 PR release says TÜV SUD certified CE-MD and CE-RED against EN ISO 3691-4 and
              EN 1175, while CC1 Pro materials cite IEC 63327. Those are good signals, but they do not yet amount to a
              clean, publicly accessible certification package for the full lineup. In other words, the company looks
              increasingly manufacturable and enterprise-ready, but buyers still have to ask for more packet-level proof
              than the open web currently provides.
