      - number: '1.2'
        title: Founder leadership, governance opacity, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Retained public materials consistently identify Felix Zhang as founder and CEO. The strongest biography
              source in this run is BEYOND Expo's May 2026 speaker announcement, which says Zhang founded Pudu in 2016,
              previously researched robotics at the Hong Kong University of Science and Technology, has accumulated more
              than 350 robotics-related patents, and previously founded the Leiphone tech-media platform. Pudu's own
              April 2026 funding release and independent coverage from DealStreetAsia and The Robot Report also quote
              Zhang directly as founder and CEO, reinforcing that the company still presents a founder-led narrative to
              the market rather than a managerially diffused one.

              The governance problem is not evidence of misconduct; it is evidence of disclosure thinness. In the
              sources retained for this chapter, Pudu does not publish a board roster, committee structure, or a
              detailed executive bench beyond Felix Zhang's public role. That makes governance quality hard to assess
              from outside and raises a straightforward key-person risk: strategic narrative, product vision,
              fundraising credibility, and external representation all appear concentrated in one founder-CEO. Investors
              such as Meituan, Shenzhen Investment Holdings, Sequoia Capital China, Puhua Capital, and the reportedly
              named 2026 consortium imply outside oversight, but the exact board rights, observer rights, and current
              ownership split are not disclosed in the retained public record.
