      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more at the April 2026 price'
            body: >-
              Pudu has enough commercial proof to stay investable, but not enough public financial disclosure to justify
              price-insensitive participation above the stated $1.5 billion mark.
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV048
              - CV055
          - type: callout
            title: The unpriced downside is terms plus undisclosed revenue scale
            body: >-
              The fastest way to destroy upside is not a product failure but discovering that current revenue is below
              the threshold implied by the round or that the preference stack captures most of the value.
            calloutType: risk
            claimRefs:
              - CV039
              - CV040
              - CV050
          - type: callout
            title: The current mark only works if audited revenue lands in the low-to-mid hundreds of millions
            body: >-
              That is the threshold where Pudu can start to look merely premium rather than fully stretched against the
              public automation comp set.
            calloutType: assumption
