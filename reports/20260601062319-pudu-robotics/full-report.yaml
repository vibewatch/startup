  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Revenue floor miss
        - >-
          Audited revenue leaves Pudu above roughly a Symbotic-like sales multiple without Symbotic-like disclosure
          quality.
        - >-
          The current round would be asking investors to pay premium-automation pricing without premium-automation
          proof.
        - Mark the position down or refuse the round.
      - - Preference overhang
        - Participating preferred, heavy anti-dilution, or investor rights that heavily subordinate common upside.
        - Headline post-money would overstate real upside to new common-equity capital.
        - Recut the cap-table model before any commitment.
      - - Margin disappointment
        - Product-line margins look closer to distressed hardware than to quality automation peers.
        - Growth would stop converting into enterprise value even if shipment counts remain high.
        - Move to bear case and tighten price.
      - - Customer quality miss
        - Top-customer concentration or weak repeat deployments undermine the commercialization narrative.
        - Installed-base bragging rights would not equal durable revenue quality.
        - Delay investment until cohort data improves.
      - - Exit-readiness stall
        - No audited package or governance upgrade before the next financing cycle.
        - Liquidity path remains narrow, so the illiquidity discount should widen rather than shrink.
        - Assume strategic-only exit path and lower fair value.
    notes: >-
      Triggers are designed for committee use: each one maps a specific diligence output to a clear valuation
      consequence.
    claimRefs:
      - CV045
      - CV046
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited revenue bridge
        - 2025 audited revenue plus 2026 year-to-date bridge by product line.
        - This is the single biggest input to fair value.
        - Finance team + QoE provider.
      - - Product-line gross margin
        - Gross margin by cleaning, delivery, industrial, and embodied-AI lines.
        - Valuation depends on whether the mix is premium automation or thin hardware.
        - Finance + operations review.
      - - Customer concentration and cohorts
        - Top-customer share, repeat deployments, retention, and utilization by fleet cohort.
        - Proves whether 120k-plus units translate into durable enterprise value.
        - Sales ops + customer success data room.
      - - Cap table and term sheet
        - Preference stack, board rights, anti-dilution, and any side letters from the April 2026 round.
        - Determines whether the unicorn headline reflects common-equity economics.
        - Legal counsel + lead investor side letters.
      - - Cash, burn, and working capital
        - Cash balance, burn rate, inventory build, financing needs, and manufacturing capacity utilization.
        - Capital intensity drives dilution risk and timing of the next raise.
        - CFO package + plant ops review.
      - - IPO or crossover readiness
        - Audits, governance packet, legal-entity map, and reporting cadence.
        - Clarifies exit path and required liquidity discount.
        - Board package + external bankers.
    notes: >-
      These asks are ordered by how quickly they can change the recommendation and the price investors should be willing
      to pay.
    claimRefs:
      - CV005
      - CV040
      - CV046
      - CV047
      - CV050
      - CV051
