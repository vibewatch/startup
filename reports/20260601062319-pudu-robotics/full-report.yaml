      - number: '1.3'
        title: Capital base, investor mix, and metric disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Pudu is clearly in late-stage private-company territory by June 2026. The company announced on April 23,
              2026 that it raised nearly $150 million at a valuation exceeding $1.5 billion, with cumulative funding
              above $300 million. Independent coverage from DealStreetAsia, The Robot Report, Frontier Enterprise, and
              SiliconANGLE all echoed the same headline. Earlier financings show a layered capital history rather than a
              single jump: The Robot Report said Pudu's August 2021 Series C totaled $155 million and included Meituan
              and Shenzhen Investment Holdings; Pudu's own May 2023 release said it followed a February 2023 C3 round of
              more than $15 million from Puhua Capital with a C4 round worth hundreds of millions of yuan; and
              DealStreetAsia said the 2023 Series C+ rounds totaled about $170 million and counted Sequoia Capital
              China, Meituan, and Shenzhen Investment Holdings among investors.

              The latest round's investor roster is where disclosure quality drops. Official 2026 releases highlight
              strategic investors and industrial partners but do not name them, while Gasgoo later reported that
              Longgang Financial Holding and Ya Capital co-led the round with BAIC Industrial Investment, Lens
              Technology, Highlight Capital, and government-guided funds participating. That report is plausible and
              directionally useful, but it is still a third-party roster rather than an officially named cap-table
              disclosure. Metric disclosure is similarly uneven: Pudu publicized 100% 2025 revenue growth, a revenue mix
              in which cleaning robots exceeded 70%, over 4,000 industrial-delivery units shipped within about a year of
              launch, and a 23% global market share citation from Frost & Sullivan, yet it did not disclose absolute
              revenue, ARR, headcount, or customer count in the retained public sources.
