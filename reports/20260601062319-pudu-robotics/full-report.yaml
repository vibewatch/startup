            body: >-
              The scenario debate should start with the current price and work backward into required fundamentals. At
              USD 1.5 billion, Pudu would effectively trade around 18.8x sales at USD 80 million of revenue, 12.5x at
              USD 120 million, 10x at USD 150 million, and 7.5x at USD 200 million. Those are not impossible outcomes
              for a fast-growing automation company, but they are impossible to verify from public evidence because Pudu
              has not disclosed audited revenue or margins. That makes the bull case conditional rather than current: it
              needs audited revenue at the low-to-mid hundreds of millions, durable growth, and clean financing terms.
              The base case keeps valuation near the current mark only if those proofs land soon. The bear case is not
              about product irrelevance; it is about underwhelming revenue scale, thin hardware economics, or
              investor-favorable terms that would force the round to re-mark. Because the public evidence set still
              leaves those drivers open, stretched is the right valuation stance today even though the company itself
