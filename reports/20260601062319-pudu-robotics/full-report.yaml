            body: >-
              Pudu does not yet look ready for IPO-style underwriting on public evidence alone. The company discloses
              strong deployment and fundraising markers, but not the audited financial history, governance detail,
              recurring-revenue disclosure, or cap-table transparency that public buyers normally require. That does not
              block an investment; it changes the likely exit path and the diligence burden. A strategic buyer,
              industrial partner, or crossover investor can underwrite private materials that are not available
              publicly, making a strategic or late-stage crossover outcome more plausible than a near-term IPO. For a
              new investor, the investment committee should treat missing evidence as a valuation input, not an
              afterthought. The decisive requests are audited revenue and gross margin by product line, customer
              concentration and repeat deployments, cash-burn and working-capital needs, and the exact preference stack.
              If those items disappoint—especially if revenue leaves Pudu trading above premium public multiples, or if
