      - number: '3.3'
        title: Moat durability and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              Pudu's core advantage is breadth with live commercial proof, not a single magical feature. The company can
              plausibly walk into the same account with restaurant delivery, hotel room service, retail assistance,
              industrial transport, and cleaning offers, then argue that the buyer should standardize on one vendor.
              That matters because the broader service-robot market is still growing quickly, but it is also crowded and
              converging. IFR shows strong growth in logistics, hospitality, and cleaning, while the restaurant-specific
              market summary highlights intense competition around load capacity, customization, and customer
              experience. In that environment, Pudu's moat is durable only if breadth translates into lower operating
              friction, better service coverage, or better economics. Keenon is the closest breadth challenger because
              it is expanding across cleaning and embodied AI while still keeping a dining-robot franchise. Bear is the
              hospitality specialist most likely to win on deployment quality or channel leverage in restaurant-heavy
              accounts now that LG is the parent. Gaussian can chip away at the cleaning pool that Pudu says already
              drives more than 70 percent of revenue. Richtech shows how a transparent RaaS model can deepen customer
              lock-in even without global scale. CloudMinds shows the opposite lesson: robotics stories can unravel
              quickly when sanctions, supplier trust, and capital stability break. Net result: Pudu still looks best
              positioned overall, but its competitive lead is broad and operational rather than unassailable; the main
              risk is a pincer attack where specialists squeeze restaurant and cleaning categories faster than breadth
              creates lock-in.
