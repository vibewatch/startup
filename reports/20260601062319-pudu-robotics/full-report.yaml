      - number: '2.3'
        title: Adoption Drivers, Geographic Mix, and Policy Tailwinds
        blocks:
          - type: paragraph
            body: >-
              The core demand driver is labor scarcity in repetitive service workflows. Mordor explicitly ties
              service-robotics growth to labor shortages, hospital backlogs, and e-commerce fulfillment pressure. U.S.
              Bureau of Labor Statistics data show leisure and hospitality still carried roughly 956,000 job openings in
              March 2026, while employment remained near 16.978 million in April 2026. The National Restaurant
              Association's 2026 state-of-industry outlook says operators expect employment to reach 15.8 million and
              are still prioritizing technology, automation, and data analytics to handle cost pressure and inconsistent
              staffing. In healthcare, WHO's 2025 nursing update keeps the global nurse shortage at 5.8 million in 2023
              with 4.1 million still projected in 2030, supporting the case for non-clinical logistics automation that
              redeploys scarce nursing time.


              Geographic mix is bifurcated. North America currently leads share in hospitality and delivery-robot
              proxies, but Asia-Pacific leads the broader service-robotics market and is the fastest-growing region
              across service, hospitality, retail, and logistics lenses. That matters because policy support is
              strongest in Asia. IFR says China's 15th Five-Year Plan for 2026-2030 places robotics at the heart of the
              country's modern industrial system, while SCIO/Xinhua and a 2026 MIIT standards push show China expanding
              robotics standards, embodied-AI infrastructure, and special-needs service-robot categories. Japan
              continues to subsidize equipment and digitization through Monozukuri and 2026 digital/AI subsidy portals,
              lowering effective adoption cost for SMEs. Singapore's NRP received about SGD 60 million-equivalent new
              funding for manufacturing, logistics, facilities management, and healthcare robotics, and launched
              RoboNexus to accelerate commercialization. Together these policies make Asia-Pacific both the
              fastest-growing demand pool and the most state-supported ecosystem for Pudu's product categories.
