            body: >-
              The maturity picture is strongest in delivery and cleaning, weaker in industrial proof density, and
              earliest in embodied AI. CC1 Pro and MT1 have clear, workflow-specific public value propositions with
              measurable operating envelopes, integration hooks, and support artifacts. FlashBot Max also looks mature
              because multi-floor delivery is paired with concrete elevator and access-control integrations instead of
              just concept language. T300 has enough manual depth and certification signal to look more than
              experimental, but the open web still gives less deployment detail for industrial AMR economics than for
              hospitality or cleaning. FlashBot Arm is the main roadmap indicator: it is credible as a technical program
              because the launch materials and product page converge on dual 7-DOF arms, dexterous hands,
