  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Addressable Market Framing
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics does not map cleanly to one standardized market bucket. Its own company materials describe
              four active product lines — service delivery, commercial cleaning, industrial delivery, and general
              embodied AI — deployed across hospitality, retail, healthcare, food and beverage, public services, and
              industrial facilities. That means the relevant market boundary is narrower than the full global
              service-robotics universe but broader than restaurant delivery robots alone. The most defensible
              definition for this chapter is indoor commercial service robots plus intra-facility delivery robots used
              in restaurants, hotels, hospitals, retail/facilities environments, and light industrial campuses. This
              included spend covers hardware, fleet-management software, maintenance, and robot-as-a-service contracts
              for those workflows.


              Important exclusions are consumer cleaning robots, surgical and rehabilitation robots, outdoor last-mile
              delivery bots, and full warehouse automation stacks such as AS/RS systems and warehouse-only picking
              robots. Public TAM estimates are therefore only directional. Fortune Business Insights places global
              service robotics at USD 26.35 billion in 2025, Precedence Research at USD 62.85 billion, and Mordor
              Intelligence at USD 68.31 billion; the spread is too wide to treat as one precise valuation anchor because
              each report uses different inclusion logic. The best public SAM proxies for Pudu's core operations are
              hospitality robots, delivery robots, broader cleaning robots, retail robotics, and logistics robots. None
              isolates a 2025/2026 China-only or Pudu-specific SAM, so the chapter preserves proxy-based sizing rather
              than forcing a false single-number TAM/SAM/SOM stack.
