        title: Pricing, GTM motion, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Pudu does not publish official list pricing on its own site, so the cleanest public monetization evidence
              comes from channel partners. RobotLAB lists the CC1 Pro at USD 24,000 with a USD 503 per month financing
              option, while RobotVacuums.com lists the standard CC1 at USD 22,500 and Robonnement markets a bundled
              monthly subscription that includes installation, training, maintenance, insurance, and software updates.
              That combination strongly suggests Pudu can be sold as upfront hardware or via financed or rented
              operating contracts, but realized ASP, distributor discounting, and service attach rates remain
              undisclosed. Public company filings help frame the economics but not pin them down. Richtech's FY2024 10-K
              shows a service-robot OEM can mix direct sales, lease contracts, and maintenance and still post a 64%
              gross margin on a small revenue base, while iRobot's much larger FY2024 filing shows a 20.9% gross margin
              and an asset-light, contract-manufacturing response to cost pressure. Those two filings create a very wide
              proxy band. The practical implication is that Pudu's visible low-to-mid-USD-20k cleaning price point can
              support attractive unit economics in the right channel, but public data is still far too sparse to
              estimate CAC, payback, or steady-state gross margin with confidence.
