      - number: '3.2'
        title: Capital, channels, and pricing posture
        blocks:
          - type: paragraph
            body: >-
              Scale and channel leverage create the biggest separation inside this field. Pudu's 2026 fundraising
              disclosures are unusually strong for a private service-robot vendor: the company says it raised nearly USD
              150 million in 2026, has more than USD 300 million in cumulative disclosed funding, has shipped over
              120,000 units, and operates in more than 80 countries and regions. That combination matters more than any
              individual spec sheet because it suggests stronger procurement leverage, spare-parts coverage, and channel
              confidence. Bear does not publish equivalent unit disclosures in the retained evidence, but LG's move to
              51 percent control materially changes its channel story by giving Bear a much larger parent that already
              sells B2B devices into commercial environments. Keenon's evidence points to a different pattern: less
              public scale detail in this retained set, but strong signs of ongoing product investment and geographic
              push, especially around European cleaning deployments and an embodied-AI roadmap. Richtech stands out on
              transparency rather than raw scale. Its SEC filing shows a full transition toward RaaS, a disclosed
              25-unit ADAM contract, and active deployment and maintenance infrastructure across the continental United
              States and Hawaii. Pricing is the least transparent part of the landscape. Official vendor pages are
              mostly quote-led. The only retained public benchmarks are distributor-style estimates and one Richtech
              contract example, so buyers likely negotiate through channels, service terms, and fleet bundles rather
              than neat list-price comparisons.
