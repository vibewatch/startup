  headline: >-
    Pudu Robotics combines real global deployment scale and strong category breadth with improving capital access, but
    public evidence still leaves too much uncertainty on revenue quality, margins, concentration, and round terms to
    underwrite the April 2026 unicorn valuation aggressively.
