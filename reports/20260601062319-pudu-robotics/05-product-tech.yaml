  - - HolaBot
    - Back-of-house bussing and hospital transfer
    - Mature legacy workflow robot
    - 60 kg payload, 120 L volume, pager and voice tracking, IPX5 inner cabin
    - Limited current public detail on integrations or update cadence
  - - FlashBot Max
    - Hotel / office multi-floor secure delivery
