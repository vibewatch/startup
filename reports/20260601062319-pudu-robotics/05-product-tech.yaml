- id: software-platform-and-developer-surface
  title: Software platform, developer surface, and operational tooling
  body: 'Pudu''s public software architecture looks layered rather than ad hoc. The company-level Open Platform page promises
    access to navigation controls, map management, voice customization, and operating data. The dedicated open.pudutech.com
    documentation goes further by exposing Cloud API categories for robot tasks, callbacks, scheduling, control commands,
    and statistics, while separately breaking the robot-side SDK into PdCoreSDK and PdIntegrationSDK. That is meaningful because
    it implies a split between low-level robot capability access and higher-level business integration logic. The management
    plane looks commercially active as well. PUDU Link appears both on Google Play and in the App Store with March 2026 updates,
    a named Shenzhen seller or developer, and disclosures that no app data is collected. Those app listings are not substitutes
    for enterprise security diligence, but they do show that the control layer is being maintained as live software rather
    than as a forgotten companion app. The overall architecture that emerges is a two-layer stack: robot-side control and
    extensibility on one side, and cloud APIs, scheduling, dashboards, callbacks, and mobile management on the other. That
    architecture is coherent across delivery, industrial, and cleaning robots and helps explain how Pudu can support such
    a broad portfolio without fragmenting completely by vertical.'
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE046
  - CE047
  - CE050
  figureRefs: []
- id: manufacturing-quality-and-compliance
  title: Manufacturing footprint, quality controls, and compliance
  body: 'The manufacturing and quality story is directionally positive but uneven in detail. Pudu''s own 100,000th-robot milestone
    article provides the strongest scale disclosure: the Jianhu super factory opened in August 2024, spans more than 40,000
    square meters, targets 100,000 annual units, and claims IoT-backed supplier collaboration, quality traceability, and smart
    warehousing. That looks like real manufacturing infrastructure rather than just an R&D lab. The nuance is location. The
    public sources retrieved here support Shenzhen clearly as the corporate and software base because both app-store listings
    point to Shenzhen Pudu entities and addresses, but the explicit factory-scale disclosure points to Jianhu in Jiangsu rather
    than to a Shenzhen production site. On compliance, T300 is the cleanest case: external coverage of Pudu''s March 2025
    PR release says TÜV SUD certified CE-MD and CE-RED against EN ISO 3691-4 and EN 1175, while CC1 Pro materials cite IEC
    63327. Those are good signals, but they do not yet amount to a clean, publicly accessible certification package for the
    full lineup. In other words, the company looks increasingly manufacturable and enterprise-ready, but buyers still have
    to ask for more packet-level proof than the open web currently provides.'
  claimRefs:
  - CE039
  - CE040
  - CE041
  - CE042
  - CE044
  - CE045
  tableRefs:
  - TE004
  figureRefs: []
- id: maturity-roadmap-and-diligence-gaps
  title: Maturity, roadmap, and remaining diligence gaps
  body: 'The maturity picture is strongest in delivery and cleaning, weaker in industrial proof density, and earliest in embodied
    AI. CC1 Pro and MT1 have clear, workflow-specific public value propositions with measurable operating envelopes, integration
    hooks, and support artifacts. FlashBot Max also looks mature because multi-floor delivery is paired with concrete elevator
    and access-control integrations instead of just concept language. T300 has enough manual depth and certification signal
    to look more than experimental, but the open web still gives less deployment detail for industrial AMR economics than
    for hospitality or cleaning. FlashBot Arm is the main roadmap indicator: it is credible as a technical program because
    the launch materials and product page converge on dual 7-DOF arms, dexterous hands, VSLAM-plus-LiDAR, and button-pressing
    or door-opening workflows. What is missing is production evidence. More broadly, Pudu''s public gap set is consistent:
    no fleet-wide MTBF or task-success benchmarks, uneven public certification bundles, and shallow public cybersecurity architecture.
    Those gaps do not negate the product stack; they simply mean the chapter''s technology conclusion should land as operationally
    credible with diligence still required on enterprise proof, not as fully underwritten best-in-class software-plus-hardware
    execution.'
