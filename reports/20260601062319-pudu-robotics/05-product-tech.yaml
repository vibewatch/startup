- id: autonomy-and-building-integration
  title: Autonomy stack, navigation, and building integration
  body: 'The strongest publicly documented part of Pudu''s technical moat is the autonomy stack that keeps reappearing across
    product families. BellaBot discloses dual navigation with LiDAR and visual SLAM plus three RGBD cameras for omnidirectional
    obstacle avoidance, and BellaBot Pro adds a richer perception package with cameras, RGBD sensors, radar, and VSLAM-plus
    deployment language. KettyBot Pro moves the same theme into compact service with laser-and-visual navigation and PUDU
    Scheduler for robot-to-robot coordination. FlashBot is where building systems become a real product wedge: the academy
    introduction and current FlashBot Max page both anchor the robot around elevator operation, while the official page adds
    cloud and hardware elevator-control paths, turnstile integration, compartment verification, and rapid multi-floor map
    replication. SwiftBot extends the same logic with elevator-control peripherals and richer communication interfaces, and
    T300 plus the separate Elevator Control 3.0 support surface show that Pudu is reusing these integrations in industrial
    settings. Put differently, the product breadth is credible because the same navigation, obstacle-avoidance, and facility-IoT
    ingredients show up repeatedly across restaurant, hotel, warehouse, and cleaning contexts rather than being reinvented
    one SKU at a time.'
  claimRefs:
  - CE003
  - CE004
  - CE006
  - CE007
  - CE009
