  title: Product & Technology
  summary: 'Pudu''s 2026 product surface is broader than a single restaurant robot: official pages and academy docs show a
    portfolio spanning restaurant delivery, hotel multi-floor delivery, industrial AMRs, autonomous cleaning, and an early
    embodied-AI line. The strongest public proof sits in navigation, building-IoT integration, cleaning autonomy, and support
    tooling; the weakest proof is fleet benchmark disclosure, broad per-SKU certification packs, and commercial deployment
    metrics for FlashBot Arm.'
