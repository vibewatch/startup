callouts:
- calloutType: strength
  title: Breadth rides on a shared control plane
  body: 'The public evidence is most convincing where one stack reappears across many SKUs: navigation, facility IoT, cloud
    APIs, mobile control, and support docs are reused instead of rebuilt for each vertical.'
  claimRefs:
  - CE022
  - CE024
  - CE046
  - CE047
  - CE049
- calloutType: risk
  title: Proof still lags marketing breadth
  body: Public sources document features and support surfaces well, but they do not give an investor-grade benchmark set for
    uptime, task success, or model-level certification coverage across the whole lineup.
  claimRefs:
  - CE043
  - CE044
  - CE045
- calloutType: insight
  title: Shenzhen is clear as the software and corporate base; Jianhu is clearer as scale manufacturing
  body: The fetched evidence points to Shenzhen in app-store developer records while the only explicit high-volume factory
    disclosure points to Jianhu, so investors should separate corporate location from production-site diligence.
  claimRefs:
  - CE039
  - CE040
