    - Public product-market traction is less visible than docs footprint
  - - T300
    - Factory material transfer / large-load delivery
    - Current industrial AMR
    - 300 kg payload, hardware expansion, industrial docs, CE evidence
    - Public deployment density and ROI case studies are sparse
  - - CC1 Pro
    - Large-venue autonomous cleaning
    - Current cleaning flagship
    - Rear AI camera, VSLAM+, 4-in-1 cleaning, heatmaps, IEC 63327
    - No independent productivity or labor-savings study found
  - - MT1
    - Large-venue dry sweeping
