  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fleet-benchmarks
    missingEvidence: Robot-family MTBF, delivery success, elevator success, intervention rate, and fleet utilization benchmarks
      across production deployments.
    whyItMatters: Without benchmark disclosure, the diligence case can verify capabilities and interfaces but cannot underwrite
      operational superiority or support burden with confidence.
    diligencePath: Request customer-level ops dashboards or anonymized fleet KPI exports for BellaBot, FlashBot Max, T300,
      CC1 Pro, and MT1, including intervention and completion rates by site type.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: sku-certification-packages
    missingEvidence: Accessible FCC filings, CE declarations, or equivalent conformity packs for the broader lineup beyond
      the explicit T300 and CC1 Pro references found here.
    whyItMatters: Hardware underwriting, enterprise procurement, and cross-border deployment all depend on model-level proof
      of conformity rather than generalized marketing statements.
    diligencePath: Ask Pudu for per-SKU declaration of conformity packets and FCC or local radio approvals for BellaBot Pro,
      KettyBot Pro, FlashBot Max, SwiftBot, CC1 Pro, and MT1.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: flashbot-arm-commercialization
    missingEvidence: Named paid deployments, deployment counts, manipulation success rates, or uptime metrics for FlashBot
      Arm in production sites.
    whyItMatters: Embodied-AI manipulation looks strategically important, but launch-stage specs alone do not prove reliability,
      labor substitution value, or buying intent.
    diligencePath: Request pilot-to-production conversion data, named reference sites, and task-level success metrics for
      elevator-button pressing, pickup, and secure handoff flows.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: cybersecurity-architecture
    missingEvidence: Public documentation of enterprise security architecture, identity and role controls, audit logs, data
      residency, penetration testing, or formal security certifications for cloud and app layers.
    whyItMatters: PUDU Link, callbacks, and cloud APIs become enterprise control points, so a shallow public security posture
      can slow procurement even when robot hardware is credible.
    diligencePath: Request security white papers, architecture diagrams, and current audit or certification reports covering
      PUDU Link, cloud APIs, and private-cloud deployment modes.
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: shenzhen-manufacturing-footprint
    missingEvidence: A current public source specifying Shenzhen assembly or manufacturing capacity and role after the Jianhu
      super factory ramp.
    whyItMatters: The location of engineering versus mass production affects supply-chain diligence, export exposure, and
      field-service assumptions.
    diligencePath: Ask management for a 2026 manufacturing footprint breakdown separating Shenzhen R&D or pilot manufacturing
      from Jianhu production volumes.
    relatedTableRefs:
    - TE004
sections:
- id: portfolio-and-workflows
  title: Portfolio breadth and workflow coverage
  body: Pudu's public 2026 product-tech picture is not a single-robot story. The official products surface groups the company
    into commercial cleaning, commercial delivery, industrial delivery, and Pudu X-Lab, while the academy manual index extends
    that view into a concrete supported lineup that still includes BellaBot and BellaBot Pro, KettyBot and KettyBot Pro, HolaBot,
    FlashBot and FlashBot Max, SwiftBot, T300, CC1 and CC1 Pro, MT1 variants, and SH1. That matters because it shows the company
    has kept a broad installed-base support surface alive rather than rotating into a narrow showcase set. The workflow split
    is also clear. BellaBot and BellaBot Pro target front-of-house delivery and engagement; KettyBot Pro compresses delivery,
    reception, and advertising into a narrow-aisle form factor; HolaBot addresses heavier back-of-house and hospital transfer
    tasks; FlashBot and FlashBot Max move into multi-floor building logistics; SwiftBot stays as a flexible general-purpose
    indoor delivery robot; T300 is the industrial AMR; CC1 Pro and MT1 cover cleaning from four-in-one autonomous scrubbing
    to large-venue dry sweeping; and FlashBot Arm represents the embodied-AI frontier. The common pattern is that each product
    maps to an explicit job in a venue workflow rather than to a generic humanoid narrative.
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
  - CE008
  - CE010
  - CE015
