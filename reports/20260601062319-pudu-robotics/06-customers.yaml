- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from restaurant delivery into hotels, retail, cleaning, and industrial AMRs
    - Legacy restaurant exposure was still 50–60% of deliveries in 2023
    - Pudu may be more diversified now, but the public record does not quantify how quickly customer mix actually shifted
    - Request 2023–2026 revenue and customer count by vertical
  - - Americas localization (Dallas HQ, warehouses, growing distributors)
    - Rapid growth may be partner-mediated rather than owned account growth
    - Weak visibility into direct-versus-channel economics and renewal control
    - Request direct sales share, distributor terms, and partner concentration by region
  - - Retail brand activations such as Coca-Cola Jordan
    - Campaign-style deployments may not translate into sticky recurring fleets
    - Good marketing proof but weaker recurring revenue proof
    - Request deployment duration, repeat contracts, and conversion from pilot activations to permanent fleets
  - - Japanese scale via Skylark and broader local channels
    - Jiemian reported an exclusive SoftBank proposal that could have displaced existing dealers
    - Customer access in Japan may be vulnerable to channel bargaining power
    - Request current Japan channel map, dealer retention, and service-level responsibilities
  - - Large global-brand roster credibility (Walmart, Carrefour, EDEKA, Honeywell, NASA)
    - Roster names may overstate underlying spend concentration or deployment scope
    - Logo breadth can mask concentration in a few real paying accounts
    - Request top-10 customers by revenue, units, and geography
  - - Security and reliability as expansion prerequisite
    - 2025 vulnerabilities showed that customer fleets can be disrupted at the platform layer
    - Enterprise buyers may slow renewals or expansions if security controls lag
    - Request incident postmortem, SLA terms, and customer remediation commitments
  notes: Concentration risks are inferred from the public evidence mix because Pudu does not disclose top-customer revenue, customer counts, or contract concentration directly.
