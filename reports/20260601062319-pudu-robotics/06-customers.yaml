- id: channels-concentration-risks
  title: Channel dependence, concentration, and skeptical evidence
  body: 'Customer diversity by logo is broad, but customer durability may still be narrower than the roster suggests. The Americas build-out shows a deliberate localization strategy—Dallas headquarters, dual warehouses, and fast-growing distributors—yet that also means a meaningful share of new-customer acquisition and service is partner-mediated. The same dependency is visible in Jordan, where the Coca-Cola deployment ran through Quill, and in Japan, where Jiemian reported that Pudu once explored an exclusive SoftBank arrangement that would have forced termination of existing Japanese dealer relationships. That article also alleged heavy discounting and dealer-led shipment inflation pressure, which is exactly the kind of signal that makes headline unit counts less informative than retention or repeat-purchase data. Separately, Hackmag''s 2025 security report showed that customer fleets could face real operating disruption when platform controls fail. Net result: the chapter supports real
    demand and meaningful cross-vertical adoption, but the main underwriting risk is concentration in a small number of flagship references plus incomplete visibility into partner economics and renewal quality.'
