- id: named-proof
  title: Named customer proof and deployment maturity
  body: 'The best public customer proof comes from a small number of site-level deployments with concrete operating detail. Skylark is the strongest restaurant reference: Pudu''s case study says 3,000 BellaBots were rolled out across more than 2,000 stores in Japan, while KR Asia independently reported the same deployment scale and noted that large buyers adopted Pudu partly because established chains had already validated the product. Parkhotel Eisenstadt is the best hotel reference, with five robots deployed across greeting, restaurant delivery, room service, and cleaning workflows, plus staff quotes describing saved time and reduced physical strain. Food Bayana in Penang shows even deeper deployment maturity, with 30 FlashBots, 20 charging stations, nine elevators, and a fully operational two-story delivery system. Retail evidence is more mixed: Coca-Cola Jordan has a specific activation case, but Walmart, Carrefour, and EDEKA are mostly cited as roster customers rather than deeply documented
    sites. Industrial and healthcare proof exists, but it is generally less specific than the hospitality references.'
