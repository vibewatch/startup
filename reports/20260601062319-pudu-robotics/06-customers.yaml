  evidenceGaps:
  - type: missing-source
    severity: material
    topic: healthcare-kpis
    missingEvidence: Named hospital or elder-care customers with before-and-after KPI baselines, deployment counts, and time windows for the published healthcare metrics.
    whyItMatters: Public healthcare proof currently shows workflow fit but not customer-level ROI quality, making cross-vertical durability comparisons difficult.
    diligencePath: Request named healthcare references, KPI dashboards, and operator testimonials from 2024–2026 production accounts.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, average contract length, and repurchase cadence by major vertical and geography.
    whyItMatters: Without retention data, adoption can be proven but customer durability and land-and-expand economics cannot be underwritten confidently.
    diligencePath: Request cohort tables for 2023–2026 installations and renewal outcomes by vertical.
    relatedQuestionRefs:
    - QU018
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer, top-channel, and top-region concentration measured by revenue, units deployed, and gross margin contribution.
    whyItMatters: The public roster is broad, but investors cannot judge whether revenue is genuinely diversified or concentrated in a few flagship accounts and distributors.
    diligencePath: Request a customer concentration schedule and direct-versus-channel revenue split for 2024–2026.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: An exhaustive list of active named production customers across restaurants, hotels, healthcare, retail, and industrial logistics.
    whyItMatters: The current enumeration table is intentionally a sample because the retained public record contains more logo mentions than fully documented deployments.
    diligencePath: Request a current customer reference list with deployment status, site count, and a named contact for at least one account in each target vertical.
    relatedQuestionRefs:
    - QU001
    - QU006
    - QU015
    - QU016
    relatedTableRefs:
    - TU003
