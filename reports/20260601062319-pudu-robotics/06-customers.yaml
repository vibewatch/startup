figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Pudu customer adoption typically moves from a workflow-specific demo into a live site deployment, then into local-service-backed fleet expansion. Channel partners compress the path in some geographies but also own part of the customer relationship.
  approximationNotes: Stages synthesize patterns from Skylark, Parkhotel, Food Bayana, Coca-Cola Jordan, Americas distributor growth, and Pudu solution pages; no public sales-cycle duration data is disclosed.
  data:
    items:
    - id: discover
      label: Workflow pain emerges
      actor: Enterprise operator or brand owner
      description: Labor shortages, service-speed targets, cleaning frequency, or internal logistics friction create the trigger for automation evaluation.
      channels:
      - Restaurant staffing pressure
      - Hotel room-delivery demand
      - Retail activation or restocking need
      - Hospital logistics / cleaning need
    - id: evaluate
      label: Demo / design phase
      actor: Pudu or local partner pre-sales team
      description: Customer validates navigation, payload, elevator integration, and workflow fit in a live operating environment.
      channels:
      - Direct sales
      - Distributor-led demo
      - Partner-led solution design
    - id: deploy
      label: Site go-live
      actor: Site operators and implementation team
      description: Robots are mapped, integrated, and assigned to specific zones, routes, or service tasks; Parkhotel and Food Bayana are the clearest public examples.
      channels:
      - Site mapping
      - Elevator / door integration
      - Staff training
      - Cloud management
    - id: support
      label: Local service and fleet optimization
      actor: Pudu local office or distributor / service partner
      description: After-sales support, parts availability, workflow tuning, and maintenance determine whether the deployment remains durable enough to expand.
      channels:
      - Dallas HQ and warehouses
      - 300+ Americas providers
      - 700+ global partner organizations
      - PUDU CLOUD / remote support
    - id: expand
      label: Fleet expansion or category cross-sell
      actor: Group operations / procurement
      description: Successful accounts add more units, more sites, or adjacent product categories such as cleaning, retail activation, or industrial transport.
      channels:
      - Chain rollout (Skylark)
      - Multi-robot hotel stack (Parkhotel)
      - Zone expansion (Food Bayana)
      - Cross-sell into cleaning and T-series logistics
  claimRefs:
