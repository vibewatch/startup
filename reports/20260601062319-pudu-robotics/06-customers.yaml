- id: retention-durability
  title: Retention, repeat usage, and disclosure gaps
  body: 'Durability is the weakest part of Pudu''s public customer record. There are credible signs of repeatable usage—Skylark''s chain-wide rollout, Parkhotel''s multi-robot operating model, Food Bayana''s customized infrastructure, and continuing international expansion— but Pudu does not publicly provide customer count, logo churn, renewal rates, gross or net revenue retention, contract duration, or expansion revenue from existing accounts. Even the best quantified customer signal in the chapter, Skylark''s 67% satisfaction survey, reflects one rollout and eight surveyed stores rather than a cohort view. The healthcare KPI claims on the official solution page are helpful but unattributed, so they cannot substitute for named customer ROI evidence. The result is an asymmetric picture: adoption looks real, but retention remains inferred from ongoing deployment activity rather than directly measured through disclosed cohorts or contract data.'
