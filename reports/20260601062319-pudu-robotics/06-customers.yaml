company:
  name: Pudu Robotics
chapter:
  number: 6
  title: Customers
  summary: 'Pudu Robotics has real production-grade customer proof in restaurants and hospitality: Skylark''s 3,000-unit rollout, Parkhotel Eisenstadt''s five-robot operating stack, and Food Bayana''s 30-robot automated food plaza show live usage rather than logo-only marketing. Retail, healthcare, and industrial customer evidence exists but is materially weaker: Walmart, Carrefour, EDEKA, NASA, Honeywell, and healthcare deployments are named without comparable public unit counts, ROI cohorts, or renewal disclosure. The biggest customer diligence risk is not lack of adoption, but lack of validated durability—no public customer-count, churn, NRR/GRR, or top-customer concentration data is disclosed, and channel dependence remains visible.'
sections:
- id: segment-footprint
  title: Segment mix and global footprint
  body: 'Public evidence supports Pudu as a multi-vertical commercial robotics vendor rather than a single restaurant-robot company. Official solution pages map the product set to restaurants, hotels, retail, healthcare, and industrial logistics, while independent and partner coverage shows those categories are not merely theoretical. Restaurants remain the legacy anchor: KR Asia reported that food service still represented 50-60% of deliveries in 2023, with Haidilao, Burger King, KFC, and Skylark among referenced accounts. By 2026, however, the visible footprint had broadened materially. Pudu and multiple third-party reports repeated 120,000-plus cumulative units across 80-plus countries, while the Americas push alone was said to include nearly 15,000 deployed robots and 285% year-over-year regional revenue growth. The footprint therefore looks real, but the denominators remain weak: Pudu discloses shipped robots and countries far more readily than active customer accounts, vertical revenue
    mix by buyer type, or retention by geography.'
