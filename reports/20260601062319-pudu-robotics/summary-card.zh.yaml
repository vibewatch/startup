  topStrengths:
    - 真实部署已被验证：到 2026 年，在 80+ 个国家出货 120,000+ 台机器人
    - 产品面广，覆盖配送、清洁、工业 AMR 和早期 embodied-AI 项目
    - 商用清洁势头强，管理层称其贡献 2025 年收入超过 70%
    - 持续吸引资本的能力已被验证，最终在 2026 年完成估值超过 $1.5B 的轮次
