    - 创始人集中度高，治理披露有限，增加关键人和控制权风险
    - Pudu 控制线下环境里的实体机器人群，网络安全、认证和机器人责任风险不能忽视
    - 客户耐久性、集中度和续约质量仍靠推断，因为 NRR、流失和头部账户暴露未披露
