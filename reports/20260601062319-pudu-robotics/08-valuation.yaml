- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it breaks the thesis
  - Action implication
  rows:
  - - Revenue floor miss
    - Audited revenue leaves Pudu above roughly a Symbotic-like sales multiple without Symbotic-like disclosure quality.
    - The current round would be asking investors to pay premium-automation pricing without premium-automation proof.
    - Mark the position down or refuse the round.
  - - Preference overhang
    - Participating preferred, heavy anti-dilution, or investor rights that heavily subordinate common upside.
    - Headline post-money would overstate real upside to new common-equity capital.
    - Recut the cap-table model before any commitment.
  - - Margin disappointment
    - Product-line margins look closer to distressed hardware than to quality automation peers.
    - Growth would stop converting into enterprise value even if shipment counts remain high.
    - Move to bear case and tighten price.
  - - Customer quality miss
    - Top-customer concentration or weak repeat deployments undermine the commercialization narrative.
    - Installed-base bragging rights would not equal durable revenue quality.
    - Delay investment until cohort data improves.
  - - Exit-readiness stall
    - No audited package or governance upgrade before the next financing cycle.
    - Liquidity path remains narrow, so the illiquidity discount should widen rather than shrink.
    - Assume strategic-only exit path and lower fair value.
  notes: 'Triggers are designed for committee use: each one maps a specific diligence output to a clear valuation consequence.'
  claimRefs:
