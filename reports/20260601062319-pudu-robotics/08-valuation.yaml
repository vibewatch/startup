  - - iRobot
    - Public
    - FY2024 revenue $681.8m
    - $14.84m market cap
    - ~0.02x trailing sales
    - Consumer rather than commercial, yet valuable as a downside case for hardware valuation collapse.
  - - Symbotic
    - Public
    - FY2025 revenue $2.247b
    - $28.02b market cap
    - ~12.5x trailing sales
    - Best evidence for premium automation multiples, but warehouse automation scale and disclosure are far ahead of Pudu.
  - - Zebra Technologies
    - Public
    - Q1 2026 sales $1.495b
    - $11.60b market cap
    - ~1.9x annualized sales
    - Mature automation and data-capture benchmark, helpful for lower-bound quality multiples.
  - - Keenon Robotics
    - Private round
    - Series D size $200m
    - Valuation undisclosed
    - Round size only
    - Shows capital depth in service robotics, but not a clean pricing mark.
  - - Bear Robotics
    - Private transaction
    - Local-outlet-based valuation report
    - $600m implied by TechCrunch report
    - Unconfirmed private mark
    - Useful only as a caution that private pricing can be opaque or noisy.
