- id: financing-context-and-comps
  title: Financing context and comparable set
  body: 'The April 2026 round matters less as a vanity unicorn marker than as a test of whether public and private robotics pricing still supports premium marks. On the positive side, sector funding clearly reopened: Crunchbase says robotics startups had already raised more than USD 6 billion in 2025, while InforCapital counted 70 robotics announcements in April 2026 alone and USD 2.8 billion of disclosed funding. That explains why Pudu, Keenon, Bear, and other embodied or service-robotics names still command attention. The caution comes from the public comps. Serve and Richtech trade at eye-watering multiples on tiny bases because investors are funding option value, not current earnings. Symbotic commands a premium because it has scale, cash, and public reporting. Zebra trades much lower because it is mature and diversified. iRobot shows the other extreme: once growth and liquidity break, the public market can collapse a robot brand to near-zero sales multiples. Pudu therefore cannot be
    judged by one comp alone; it sits inside a dispersion band, and the disclosed evidence does not yet say where in that band it belongs.'
