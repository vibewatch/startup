- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Why the thesis works
  - Why the anti-thesis still bites
  - What would change the view
  rows:
  - - Scale proof
    - 120k+ units, 80+ countries, and 100% 2025 growth imply real commercialization, not concept-stage hype.
    - Those metrics are company-claimed and do not translate directly into audited revenue or gross margin.
    - An audited revenue bridge showing how deployments convert into recognized sales and service revenue.
  - - Product breadth
    - Cleaning, delivery, industrial logistics, and embodied AI expand the surface area for growth.
    - Breadth can also hide uneven profitability and channel complexity across product families.
    - Product-line gross margin and attach-rate disclosure by category.
  - - Capital access
    - The April 2026 round and broader 2025-2026 robotics funding boom show continued investor appetite.
    - Available capital does not prove common-equity upside if terms are investor-friendly or price is already full.
    - Cap table, preference stack, and lead-investor rights from the latest round.
  - - Comparable frame
    - Symbotic and Zebra show that automation businesses can support premium valuation when scale and disclosure are strong.
    - Serve, Richtech, and iRobot show public markets can be either euphoric on tiny revenue or brutal when economics crack.
    - A revenue level that places Pudu in the right public multiple band with defendable margins.
  - - Exit path
    - Strategic and crossover capital could value Pudu for installed base, supply chain, and AI optionality.
    - IPO readiness is low without audited history, governance detail, and recurring-revenue disclosure.
    - A banker-ready reporting package and governance deck.
  notes: 'Each row is intentionally price-sensitive: the anti-thesis is not company quality denial, but a reminder that underwriting changes materially with better disclosure.'
