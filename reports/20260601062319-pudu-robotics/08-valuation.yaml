  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pudu-round-terms
    missingEvidence: Signed term sheet or cap-table materials showing pre-money valuation, exact cumulative capital raised to date, liquidation preference structure, anti-dilution protection, board rights, and any side letters for the April 2026 round.
    whyItMatters: Private-round economics and the exact lifetime funding ledger determine whether the headline unicorn mark is fairly priced for common-equity holders.
    diligencePath: Request the current cap table, the April 2026 financing documents, a prior-round funding ledger, and counsel summary of preference stack economics from management or lead investors.
    relatedQuestionRefs:
    - QV002
    - QV003
  - type: private-evidence-only
    severity: blocking
    topic: pudu-audited-financials
    missingEvidence: Audited 2025 revenue, gross margin, EBITDA or operating-loss bridge, and 2026 year-to-date revenue by product line.
    whyItMatters: Those numbers determine whether the current $1.5 billion mark maps to a mature-automation multiple, a speculative micro-cap multiple, or something in between.
    diligencePath: Obtain audited financial statements or a QoE package plus a management bridge from 2025 actuals to 2026 plan by cleaning, delivery, industrial, and embodied-AI lines.
    relatedQuestionRefs:
    - QV017
    - QV018
    - QV022
  - type: missing-source
    severity: material
    topic: private-comps
    missingEvidence: Supportable 2025-2026 private transaction marks for directly comparable commercial-service-robotics companies, ideally with valuation plus terms rather than only round size.
    whyItMatters: Private comp rows are currently sparse or term-light, so public comps still dominate the valuation frame.
    diligencePath: Collect board-approved financing decks, secondary transaction marks, or investor letters for Bear, Keenon, Gaussian, or other close peers; otherwise keep private comps as directional only.
    relatedQuestionRefs:
    - QV013
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: ipo-readiness
    missingEvidence: Two-year audited reporting package, governance materials, board composition, legal structure map, and recurring investor-reporting cadence.
    whyItMatters: Without IPO-grade disclosure, the near-term exit set is narrower and the current round needs a larger illiquidity discount.
    diligencePath: Ask management for the latest audited financial package, governance documents, legal-entity chart, and any banker readiness materials prepared for crossover or IPO discussions.
    relatedQuestionRefs:
    - QV026
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Customer concentration, repeat deployment cohorts, gross retention, and evidence on fleet utilization by product family.
    whyItMatters: Valuation durability depends on whether the 120k-plus unit base represents recurring expansion from quality customers or one-off hardware placements.
    diligencePath: Request top-20 customer exposure, repeat-order cohorts, utilization metrics, and any renewal or service attach-rate dashboards.
    relatedQuestionRefs:
    - QV029
