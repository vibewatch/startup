- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Explicit assumptions
  - Indicative valuation range (USD b)
  - Probability signal
  - Downside / upside trigger
  rows:
  - - Bull
    - Audited revenue at or above about $200m, durable growth, margins consistent with premium automation, and clean round terms.
    - 1.8-2.6
    - Possible only after hard diligence clears the revenue and term gap.
    - Multiple can expand if Pudu proves Symbotic-like quality with faster service-robotics growth.
  - - Base
    - Audited revenue in the low-to-mid hundreds of millions, continued deployment growth, but hardware-heavy economics and only moderate disclosure improvement.
    - 1.0-1.6
    - Most consistent with today's evidence set.
    - Current mark holds only if diligence does not reveal revenue or term surprises.
  - - Bear
    - Revenue below about $100m, thin margins, customer quality weaker than implied, or preference terms that absorb most upside.
    - 0.4-0.9
    - Material risk if diligence disappoints.
    - Re-rating toward mature or distressed hardware comps if economics or terms miss.
  notes: These are low-confidence scenario estimates, not reported values. Public sources do not disclose Pudu's absolute audited revenue, margin stack, or round economics.
