- id: capital-intensity-manufacturing-and-financing
  title: Capital intensity, manufacturing footprint, and financing dependency
  body: The balance-sheet story is easier to read from Pudu's footprint than from any published financial statement, because no such statement is public. The company says it raised nearly USD 150 million in April 2026 at a valuation above USD 1.5 billion and that cumulative disclosed funding now exceeds USD 300 million. Management framed the new capital as fuel for embodied AI, product expansion, manufacturing, and supply-chain scale-up, which is consistent with a company still investing for growth rather than harvesting cash. Manufacturing disclosures reinforce that reading. Pudu's 2025 milestone release said the Jiangsu super factory started operations in August 2024, spans more than 40,000 square meters, and is designed for annual capacity of 100,000 units. The April 2026 Dallas announcement adds a second layer of fixed-cost and working-capital commitment through regional headquarters operations, dual U.S. warehouses, and localized support. Those assets can improve service levels and
    channel efficiency, but they also imply inventory, logistics, and support overhead. Because public sources do not disclose current cash, burn, or debt, the latest raise improves confidence in near-term capital access, but not in exact runway or in whether the model can self-fund without another round.
