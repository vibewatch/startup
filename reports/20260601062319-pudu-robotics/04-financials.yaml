      - Discounting or rental terms can delay cash recovery
      - Local service improves adoption but adds opex
      - Duties and sourcing shifts can compress margin
    - id: visible-mitigation
      label: Visible mitigation
      values:
      - Fresh 2026 equity capital and ongoing demand growth
      - Partner channels shift some selling burden outside Pudu
      - Local logistics reduces service delay and import friction
      - Mitigated, not eliminated, by localization and supply-chain scale
