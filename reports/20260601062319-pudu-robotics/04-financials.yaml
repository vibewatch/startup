      - Public reseller channels and warehousing disclosures imply stocked inventory
      - Dallas regional hub and coast-to-coast warehouses are disclosed
      - U.S. 2025 tariffs and trade-war commentary raise cost pressure risk
    - id: margin-effect
      label: Likely margin effect
      values:
