sections:
- id: revenue-model-and-disclosed-traction
  title: Revenue model, mix, and disclosed traction
  body: 'Public evidence points to a hardware-led commercial robotics model that has clearly shifted toward cleaning. Pudu''s own site now highlights commercial cleaning, industrial delivery, and commercial delivery as its commercial categories, while the 2026 Partner Summit added general embodied AI as a fourth business line rather than as a standalone disclosed revenue line. The most financially important company claim is mix concentration: Pudu''s March 2026 cleaning article and its April 2026 financing materials both say commercial cleaning exceeded 70% of total revenue in 2025, while total company revenue doubled year over year. Funding coverage also says industrial delivery shipped more than 4,000 units within one year of launch, suggesting the non-cleaning business is growing but still secondary. Traction claims are strong: Pudu says it has shipped more than 120,000 robots, operates in 80-plus countries and regions, and serves reference accounts including Carrefour, Walmart, and EDEKA.
    What remains missing is the accounting layer. Public materials do not disclose whether hardware is recognized at shipment, acceptance, distributor sell-through, or via bundled rental or service contracts, so the topline narrative is meaningful but not yet auditable.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
