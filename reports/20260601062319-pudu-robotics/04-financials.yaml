  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit / pricing basis
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Commercial cleaning robot hardware
    - Outright sale of floor-cleaning robots through direct and partner channels
    - Observed reseller list prices around USD 22.5k-24k per unit
    - Dominant disclosed revenue pool; company says cleaning exceeded 70% of 2025 revenue
    - Medium-high, but still company-claimed and unaudited
    - Request product-line revenue by SKU family and region
  - - Cleaning subscription / rental / financing
    - Monthly financing or rental bundle through channel partners
    - Monthly payment or fee structure; exact contract terms undisclosed
    - Publicly visible in partner channels, but no attach-rate disclosure
    - Medium, because recurring economics exist but are opaque
    - Request rental cohort counts, term lengths, and renewal rates
  - - Industrial delivery robots
    - Hardware sales for industrial logistics use cases
    - Quote-based enterprise pricing; no public Pudu list price found
    - Company says over 4,000 units shipped within one year of launch
    - Medium, because shipment evidence exists but realized revenue is unknown
    - Request revenue contribution, ASP, and channel mix for T-series units
  - - Commercial delivery robots
    - Hardware sales for hospitality, retail, and other service delivery
    - Mostly quote-based or distributor priced
    - Material product line on homepage and partner summit, but no public mix disclosure
    - Medium-low, because line importance is clear but monetization detail is absent
    - Request product-family revenue and gross margin split
  - - After-sales service, maintenance, and software
    - Support, maintenance, updates, and bundled service around deployed fleets
    - Bundled or contract-specific; no public standalone schedule
    - Visible indirectly via rental bundles and public comp analogues
    - Medium-low, because recurring revenue likely exists but is not separately disclosed
    - Request service revenue, attach rate, and support cost by fleet cohort
  notes: Public sources support the existence of multiple monetization paths, but exact revenue recognition and product-line revenue amounts remain undisclosed.
