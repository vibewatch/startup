    - id: cash-demand
      label: Primary cash demand
      values:
      - Factory utilization, tooling, QA, and capacity ramp
      - Stocking units and spare parts across partners and warehouses
      - Dallas HQ, dual warehouses, and field support
      - Tariffs and trade-war friction can raise landed cost
    - id: public-evidence
      label: Public evidence
      values:
