  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-cash-and-burn
    missingEvidence: Current cash balance, monthly operating burn, and monthly working-capital movements.
    whyItMatters: Without balance-sheet liquidity and burn data, runway and financing dependency cannot be underwritten.
    diligencePath: Request the latest monthly management accounts, cash roll-forward, and 12-month operating plan.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-project-finance
    missingEvidence: Debt schedule, lease obligations, guarantees, and any warehouse, channel, or project-finance facilities.
    whyItMatters: Undisclosed leverage or off-balance-sheet obligations can materially change true runway and equity needs.
    diligencePath: Request debt agreements, lease schedule, and board materials covering financing strategy.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-asp-and-discounts
    missingEvidence: Realized ASP by SKU, distributor discount ladders, financing terms, and service attach rates.
    whyItMatters: Observed channel list prices are not enough to convert unit shipments into revenue quality or gross-margin estimates.
    diligencePath: Request invoice-level pricing samples, channel contracts, and average discount data by region and product line.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI007
    - QI025
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-working-capital
    missingEvidence: Gross margin by hardware, service, and rental cohort plus inventory days, receivables aging, and warranty/service cost history.
    whyItMatters: Margin and working-capital economics determine whether scale converts into durable cash generation or continued capital dependence.
    diligencePath: Request product-family gross-margin bridges, warranty reserve policy, and working-capital KPI history.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI009
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-recognition-policy
    missingEvidence: Accounting policy explaining when hardware, rental, maintenance, and channel revenue are recognized.
    whyItMatters: Recognition timing changes how growth, backlog conversion, and working-capital risk should be interpreted.
    diligencePath: Request audited accounting-policy memos or the latest statutory financial statements that describe recognition timing.
    relatedQuestionRefs:
    - QI001
    relatedTableRefs:
    - TI001
