chapter:
  number: 4
  title: Financials
  summary: 'Pudus publicly visible financial story is strong on growth signals but weak on underwriteable statements: company-linked materials say 2025 revenue doubled, commercial cleaning exceeded 70% of revenue, and April 2026 funding added nearly USD 150 million at a valuation above USD 1.5 billion. Public channel evidence shows cleaning robots can be sold outright around the low-to-mid USD 20k range or rented via subscription, while public robot-company filings suggest gross-margin outcomes can vary widely. Exact revenue, gross margin, burn, working capital, debt, and runway remain undisclosed, so the chapters verdict depends more on traction and capital-access signals than on audited profitability evidence.'
