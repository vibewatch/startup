- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on investment decision
  - Exact diligence path
  rows:
  - - Monthly and annual revenue by product line and geography
    - Cannot test whether cleaning dominance, overseas mix, and growth are broad-based or concentrated in a few channels
    - Request monthly revenue bridges by product family, region, and direct vs channel sales
  - - Revenue-recognition policy for hardware, rental, service, and distributor inventory
    - Cannot interpret shipment growth as reported revenue or cash conversion with confidence
    - Request audited accounting-policy memo and statutory financial statements
  - - Realized ASP, discounts, and service attach rate
    - Observed list prices cannot be converted into net revenue or gross-margin forecasts
    - Request invoice samples, channel contracts, and average discount schedules by SKU
  - - Gross margin, warranty cost, and service cost by robot family
    - Cannot determine whether growth is accretive or whether support costs absorb hardware margin
    - Request gross-margin bridges, warranty reserve policy, and service P&L by cohort
  - - Current cash, monthly burn, and debt or lease schedule
    - Cannot underwrite runway, covenant risk, or next-round timing
    - Request latest management accounts, cash roll-forward, and complete obligations schedule
  notes: These are the highest-priority blockers to turning Pudu's growth story into a cash-flow underwriting case.
