evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and any independent-director or observer appointments.
    whyItMatters: >-
      Late-stage private governance quality and investor protections cannot be assessed cleanly without knowing who
      actually governs the company.
    diligencePath: >-
      Request the current board deck, shareholder agreement governance schedule, and any board-observer list from
      management or lead investors.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: 2026-round-investors
    missingEvidence: >-
      Signed closing documents or an official company disclosure naming the exact investors and allocations in the 2026
      round.
    whyItMatters: >-
      Gasgoo supplied a roster for the latest round, but official retained releases did not, leaving investor identity
      and allocation risk partially unresolved.
    diligencePath: Obtain the financing press release appendix, board consent package, or cap-table update for the April 2026 round.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: core-operating-metrics
    missingEvidence: Current headcount, exact active-customer count, and an absolute revenue figure or audited 2025 financial summary.
    whyItMatters: >-
      The company is clearly scaled, but valuation and durability analysis are weaker without knowing people cost,
      customer breadth, and absolute revenue.
    diligencePath: Request the 2025 management accounts, KPI dashboard, and current HR headcount report.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: minor
    topic: cybersecurity-follow-up
    missingEvidence: >-
      Independent post-remediation audit evidence showing whether the 2025 control weaknesses were fully closed and
      retested.
    whyItMatters: >-
      The company says it fixed the issue, but diligence should separate a patched bug from a mature enterprise-security
      process.
    diligencePath: >-
      Request the post-incident report, penetration-test summary, and vulnerability-disclosure policy adopted after the
      2025 incident.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: china-or-company-specific-sam
    missingEvidence: >-
      A public 2025 or 2026 market model that isolates China-only or Pudu-specific SAM across restaurant, hotel,
      cleaning, healthcare, retail, and intrafacility logistics robots.
    whyItMatters: >-
      Without a clean regional or company-specific SAM, valuation has to rely on proxy stacking rather than a defendable
      one-line penetration model.
    diligencePath: >-
      Obtain Chinese-language analyst reports, venue-count bottoms-up models, or channel shipment data by region and
      vertical.
    relatedQuestionRefs:
      - QM008
      - QM027
  - type: missing-source
    severity: material
    topic: frost-primary-report
    missingEvidence: >-
      The full Frost & Sullivan commercial-service-robotics report, methodology, and share table that allegedly support
      Pudu's 23% 2023 revenue share claim.
    whyItMatters: >-
      Leadership claims can meaningfully affect market-structure assumptions and valuation, but the chapter only
      verified a company-linked PR citation.
    diligencePath: >-
      Acquire the original Frost report directly from Frost or from management, then reconcile its scope against public
      analyst categories.
    relatedQuestionRefs:
      - QM026
      - QM027
  - type: private-evidence-only
    severity: material
    topic: pilot-conversion-and-utilization
    missingEvidence: >-
      Pilot-to-rollout conversion rates, fleet utilization, uptime, and renewal data by vertical for hotel, restaurant,
      hospital, and facilities deployments.
    whyItMatters: >-
      Public market growth does not translate directly into durable revenue if pilots fail to convert or if utilization
      is weak after launch.
    diligencePath: >-
      Request cohort data from management and channel partners, plus customer references covering deployment size,
      uptime, and renewal.
    relatedQuestionRefs:
      - QM017
      - QM025
      - QM027
  - type: enumeration-incomplete
    severity: minor
    topic: japan-program-eligibility
    missingEvidence: >-
      A reviewed approved-product or approved-vendor list confirming whether Pudu's specific robots qualify under
      current Japanese labor-saving catalogs.
    whyItMatters: >-
      Japan subsidy support is directionally positive, but buyer economics depend on whether Pudu products can actually
      access those programs.
    diligencePath: >-
      Check current Japanese subsidy catalogs, local distributor materials, or application-support partners for
      product-level eligibility.
    relatedQuestionRefs:
      - QM022
      - QM027
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: realized restaurant-robot pricing
    missingEvidence: >-
      Current realized ASPs, lease terms, discount bands, and service bundles for live Pudu, Bear, and Keenon
      deployments are not publicly disclosed in retained sources. The available pricing evidence is limited to partner
      estimates and one public RaaS contract example from Richtech.
    whyItMatters: >-
      Without realized pricing, the chapter can compare public positioning but cannot prove whether Pudu wins on price,
      margin, or total cost of ownership versus direct peers. Pricing opacity is one of the clearest ways a seemingly
      broad moat can compress into a commodity hardware contest.
    diligencePath: >-
      Request distributor quotes and enterprise proposals from at least two regions for Pudu, Bear, and Keenon. Ask
      management for internal competitive pricing decks, realized discount ranges, and attach-rate assumptions for
      software, service, and spare batteries.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer deployment counts
    missingEvidence: >-
      Current deployed unit counts for Bear, Keenon, Gaussian, and Richtech are incomplete or non-comparable in retained
      public evidence. Pudu discloses shipments, but peer disclosures are thinner and often qualitative.
    whyItMatters: >-
      Installed-base disclosure is one of the best public proxies for manufacturing scale, support density, spare-parts
      leverage, and data-network effects. Without it, relative scale judgments outside Pudu remain directional instead
      of precise.
    diligencePath: >-
      Collect current investor decks, distributor presentations, and regional reseller materials for Bear, Keenon,
      Gaussian, and Richtech. Ask management for internal win-loss files or channel dashboards that track competitor
