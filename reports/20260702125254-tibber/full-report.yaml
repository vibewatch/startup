  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue bridge disappoints
        - 2026 revenue is not convincingly on track toward ~€100m within two years
        - The base case becomes too optimistic and the current entry multiple widens further.
        - Pause or materially reprice the opportunity.
      - - Round terms reveal heavy overhang
        - Preference stack, anti-dilution, or insider protections materially subordinate new common-equity economics
        - Enterprise-value upside no longer maps cleanly into investor returns.
        - Require a very different structure or walk away.
      - - Unit economics are weak
        - Gross margin, burn, or churn are inconsistent with premium software-like multiples
        - The smart-energy narrative fails to translate into durable earnings power.
        - Move the call from research-more toward avoid at the same price.
      - - Footprint or customer quality is overstated
        - >-
          Verified active-customer counts or country operations are materially below the narrative used to pitch the
          round
        - TAM and execution confidence both compress together.
        - Cut scenario ranges and reduce conviction immediately.
      - - Service or regulatory friction rises
        - Customer complaints persist or market-design changes reduce flexibility economics
        - Category relevance remains but monetization quality worsens.
        - Lower the multiple band and shorten acceptable hold assumptions.
    notes: >-
      These are pre-commitment diligence triggers intended to stop a narrative-led investment before capital is priced
      at the wrong level.
    claimRefs:
      - CV026
      - CV039
      - CV041
      - CV042
      - CV043
      - CV045
      - CV049
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - 2025 funding round
        - Signed documents showing amount, instrument, post-money valuation, and insider participation
        - The reported new capital round is central to price-setting but is not fully disclosed on official pages.
        - CFO, lead investor, and financing counsel review.
      - - Revenue quality
        - 2024-2026 bridge by geography, product, and gross versus net revenue treatment
        - The €68m anchor is helpful but insufficient for underwriting growth durability.
        - Finance data room plus management review.
      - - Unit economics
        - Gross margin, contribution margin, CAC payback, NRR, churn, burn, and runway
        - Multiple selection depends on quality of revenue, not just its existence.
        - Board deck, KPI pack, and cohort analysis.
      - - Cap table and preferences
        - Liquidation waterfall, share classes, option pool, anti-dilution, and governance rights
        - A premium enterprise value can still produce weak common-equity returns if preferences are heavy.
        - Counsel packet and fully diluted cap-table model.
      - - Operating footprint
        - Country-by-country user, customer, and revenue counts including launch status
        - >-
          The public record directly supports four-country scale, while the broader footprint narrative remains
          unverified here.
        - Management schedule plus regulator or entity cross-checks.
      - - Exit path
        - Liquidity plan, banker dialogue, secondary process, or strategic-interest evidence
        - Exit timing drives required return and tolerance for paying up now.
        - Management interview and lead-investor reference calls.
    notes: Each ask is directly tied to a valuation variable that is currently opaque in the public record.
    claimRefs:
      - CV012
      - CV026
      - CV045
      - CV049
      - CV050
