            body: >-
              The financial verdict is that Tibber appears more credible than a commodity power reseller, but still not
              fully underwritable from public evidence alone. Revenue quality is improved by the fact that monetization
              is not tied only to reselling kilowatt-hours: recurring access, store attachment, and flexibility
              participation all create potentially better incentives than a classic supplier spread. At the same time,
              revenue quality is still unproven because public sources do not show realized revenue mix, gross margin,
              cash conversion, or retention economics. The strongest positive signal is operational seriousness:
              trading, market integration, support, and AI roles all imply a functioning platform with real scope. The
              strongest blocker is the same operational scope, because it probably carries working-capital, compliance,
              and service costs that are not publicly quantified. Investors should treat the story as promising but
