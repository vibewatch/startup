              - CV049
              - CV050
      - number: '8.5'
        title: Recommendation and Evidence Assessment
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, a high risk rating, and an expensive valuation
              stance. Tibber clears the first screen on company quality: the product is credible, the flexibility story
              is real, customer scale is meaningful, and 2025 operating metrics show movement in the right direction.
              What it does not clear is price support. Even generous assumptions only allow the bull case to defend
              something close to the prompt-supplied late-stage mark, while the base case leaves little margin of safety
              and the bear case implies a painful markdown. The evidence set is directionally useful but structurally
              incomplete. Official and filing sources validate the company, partner and investor sources validate
              operating progress, and competitor pages validate category relevance. None of that substitutes for
              verified round terms, quality-of-revenue data, or liquidity rights. The call should improve only if Tibber
              either delivers significantly more financial transparency or the entry price resets to a level that turns
              opacity from a liability into compensated risk.
            claimRefs:
              - CV001
