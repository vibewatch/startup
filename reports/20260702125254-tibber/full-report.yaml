      - number: '2.2'
        title: Sizing the market with public, evidence-constrained lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence is stronger on market infrastructure, installed asset bases, and observed flexibility
              pools than on a single clean third-party TAM for Tibber. The broadest lens is the exchange layer: Nord
              Pool alone says around 500 TWh is traded annually across 15 countries and 21 bidding zones, while EPEX
              continues to expand pan-European spot trading. The more actionable adoption lens is electrified-home
              hardware. EHPA says 2.62 million residential heat pumps were sold across 16 European countries in 2025 and
              the installed base reached around 28 million, which is a far better proxy for flexible home load than
              generic power-market revenue. The most concrete near-term SOM lens is already activated flexibility:
              Tibber talks about hundreds of thousands of devices inside its VPP, while 1KOMMA5 says it has reached 1 GW
              of shiftable capacity. Public consumer economics from Greenely and Frank show the value pool can include
              ancillary-service payouts and recurring bill savings, not only energy resale.
