      - number: '1.2'
        title: Founders, leadership, and governance controls
        blocks:
          - type: paragraph
            body: >-
              The founders remain central to the public story. Tibber still leads with Daniel Lindén and Edgeir Vårdal
              Aksnes on the about page, and the underlying origin narrative is coherent across official and third-party
              sources: both founders came out of the energy sector and built Tibber around the idea that lower household
              consumption should be a profit center for the customer rather than a revenue leak for the supplier. Public
              visibility beyond the founders is much thinner. The Company Check surfaces a handful of named executives
              and a chair, but the retained official cache does not provide a current public board page, committee
              roster, or detailed biographies for the broader control layer. Governance controls are nonetheless
              visible. Tibber publishes a whistleblowing program, states that a legal-chaired committee handles serious
              reports, and has a May 2024 Supplier Code of Conduct that explicitly covers human rights, anti-corruption,
              cyber security, and environmental reporting. That is enough to show formal governance plumbing, but not
              enough to fully underwrite board depth or succession resilience. Key-person dependence therefore still
              looks meaningful in the public record.
