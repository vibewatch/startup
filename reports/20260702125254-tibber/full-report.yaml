      - number: '7.2'
        title: Operational risk lives inside real-time control, not just retail billing
        blocks:
          - type: paragraph
            body: >-
              Tibber’s product promise depends on reliably turning price signals and household-device telemetry into
              useful control decisions. That makes operations more infrastructure-like than a normal green-power
              reseller. AWS’s case study shows Tibber already handled more than 33 billion messages through AWS IoT Core
              in a single month back in 2021, while Home Assistant confirms that current integrations span real-time
              metering, price sensors, and household-usage views. Tibber’s homepage, App Store listing, sustainability
              page, and Grid Rewards content all point to a business model built on smart charging, smart heating, and
              automated participation in energy markets. This is a strength, but it also creates a wide failure surface.
              If device connectivity, cloud telemetry, or control logic breaks, the customer does not merely lose a
              dashboard; they lose the savings logic at the center of the value proposition. The public sources reviewed
