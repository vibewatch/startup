  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold / event
      - action implication
    rows:
      - - Security and control disclosure gap
        - Independent assurance fails to appear
        - No current certification, incident metrics, or breach-history disclosure is produced in diligence
        - Treat the risk rating as high and require private security diligence before underwriting platform leverage.
      - - Financial-model opacity
        - Energy-supply economics remain undisclosed
        - No current gross-margin, bad-debt, working-capital, or hedging bridge is provided
        - Do not assume software-like margins or low credit exposure in valuation work.
      - - Competitive parity
        - Rivals match Grid Rewards economics or device breadth faster than Tibber differentiates
        - Multiple European rivals show equivalent tariff, charging, and VPP features without a clear Tibber moat
        - Shift the thesis from category winner to one capable operator in a crowded field.
      - - Market-access fragility
        - Exchange or grid-service participation rules tighten materially
        - Country-level access or payout economics deteriorate enough to reduce customer savings or VPP returns
        - Assume slower growth and higher churn until market access stabilizes.
      - - Execution overload
        - Automation quality weakens while device breadth expands
        - Complaint rates, integration failures, or control-loop errors rise as Tibber adds devices and markets
        - Reduce conviction unless operating metrics show scaling without customer-trust damage.
    notes: >-
      These kill criteria are designed to be monitorable during diligence or a later refresh rather than to sound
      dramatic without measurable triggers.
