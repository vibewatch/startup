  - id: TV002
    title: Thesis / Anti-Thesis
    columns:
      - Side
      - Argument
      - Evidence anchor
      - What would change the view
    rows:
      - - Thesis
        - Tibber has a real digital energy product with dynamic pricing, app control, and grid-flex features.
        - Official product pages plus Grid Rewards and the Brreg business purpose.
        - If user engagement or monetization around flexibility proves shallow, the moat narrows quickly.
      - - Thesis
        - >-
          Operating proof extends beyond narrative: 2025 revenue, profitability improvement, VPP capacity, and
          smart-charging activity all moved up.
        - >-
          Summa's 2025 company page reports €68m revenue, stronger Nordic profitability, 33m kWh VPP size, and 27m
          smart-charging sessions.
        - If those metrics stall in 2026, the premium-growth framing weakens materially.
      - - Thesis
        - Customer scale is meaningful, with third-party references to more than one million users.
        - >-
          Atlar cites over one million users across four countries; Balderton documented earlier subscription
          acceleration.
        - If active users or paying households are materially lower than marketed, revenue quality must be repriced.
      - - Thesis
        - Regulatory and category tailwinds support demand-side orchestration.
        - EU market-design reform plus the existence of multiple dynamic-tariff peers show the category is durable.
        - If regulation or consumer economics reduce flexibility incentives, growth and multiple support both compress.
      - - Anti-thesis
        - Official disclosure lags the valuation narrative.
        - >-
          Current Tibber pages do not disclose the reported 2025 funding, current valuation, cap-table, or unit
          economics.
        - A full data room or company-led financing disclosure would close this gap quickly.
      - - Anti-thesis
        - The working late-stage mark screens rich against the only hard revenue anchor.
        - €68m of 2025 revenue versus a roughly $2.2B working mark implies an elite multiple with little room for error.
        - Verified revenue above ~€100m plus strong margins would make the same price easier to defend.
      - - Anti-thesis
        - Public footprint evidence is narrower than the broader underwriting narrative.
        - >-
          Fetched sources directly validate four-country activity or users, not the eight-country footprint referenced
          in the prompt.
        - Management can fix this with a country-by-country operating and customer schedule.
      - - Anti-thesis
        - Service-quality issues and opaque economics create execution risk on top of price risk.
        - Askmeoffers surfaces support complaints while public sources do not disclose margin, churn, or burn.
        - If customer support, churn, and margins all look clean in diligence, this objection should soften.
    notes: Arguments are framed strictly through valuation relevance rather than as a generic company-quality scorecard.
