    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal seat, and business model
        blocks:
          - type: paragraph
            body: >-
              Tibber presents itself in 2026 as a digital electricity supplier that wraps retail power, automation,
              smart-home controls, and bill reduction into one app-led consumer proposition. The homepage, about page,
              and careers surface are all consistent on the strategic direction: Tibber is not trying to look like a
              conventional commodity utility, but like a software-mediated household energy operating system. That
              positioning matters because the company claims to align incentives differently from incumbents. Official
              and partner sources repeatedly say Tibber does not try to earn more by pushing higher electricity
              consumption, and AWS describes the historical commercial model as a flat monthly fee plus energy sold at
              purchase price. The legal structure is more nuanced than the consumer branding. Tibber AS is the Norwegian
              parent with a registered office in Førde, while the privacy notice lists affiliate operating companies for
              Norway, Sweden, Germany, and the Netherlands. Third-party profiles still point to Stockholm as the
              headquarters location, so the cleaner interpretation is that Tibber has a Norwegian legal seat with a
              Sweden-heavy commercial identity and a multi-country operating footprint.
