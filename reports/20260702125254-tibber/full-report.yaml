      - number: '1.4'
        title: Milestones, scale signals, and visible risks
        blocks:
          - type: paragraph
            body: >-
              Tibber's public milestone record supports a company that moved from a 2016 founding story to a much larger
              2025-2026 VPP and smart-energy narrative. Historical scale anchors are strong enough to show real
              adoption: AWS cites 33 billion IoT messages in May 2021, Balderton says subscriptions expanded from
              120,000 to over 400,000 during 2021, and Summa says the VPP reached 33 million kWh in 2025 with 27 million
              smart-charging sessions. At the same time, public disclosure is selective. The careers page hides current
              employee and customer counts behind approximate placeholders, and the best retained staffing figure is
              still The Company Check's 61 employees at the end of 2022. The main adverse evidence is also
              consumer-facing rather than regulatory. Trustpilot still shows a respectable overall rating, but the
              detailed reviews point to support delays, device failures, and billing or meter-settlement friction. Those
              are not thesis-breaking on their own, yet they matter because Tibber's promise depends on reliable
              automation, responsive support, and enough customer trust to hand the company control over charging,
              heating, and home batteries.
