  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently describe Tibber as a digital energy supplier that tries to align itself with
              lower household consumption rather than a markup on energy sold. AWS and Balderton both describe a flat
              recurring fee plus power sold at purchase price, while Tibber’s own pages add two more surfaces: device
              attachment through the store and participation-driven earnings via Grid Rewards. That combination matters
              because it means headline list pricing is only a partial indicator of monetization. The company can
              acquire households through electricity supply, deepen engagement through the app and automation, then
              monetize attached devices or flexibility participation. The weakness is that none of the fetched sources
              disclose realized mix, attach rates, or gross profit by surface, so the reader can see the revenue
              architecture but cannot yet underwrite its quality or durability. A clean diligence package would
              therefore need separate bridges for subscription receipts, energy settlement economics, device attachment,
              and flexibility payouts before any blended recurring-revenue multiple could be justified.
