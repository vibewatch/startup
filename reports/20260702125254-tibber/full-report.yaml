companyProfile:
  summary: >-
    Tibber is a Norway-rooted digital electricity and household flexibility company that sells renewable power,
    app-based energy analytics, device integrations, smart charging, heating optimization, and Grid Rewards / virtual
    power plant participation through one consumer-facing platform. Its public materials consistently position the
    business as an alternative to legacy utilities that profit from higher consumption. The strongest public operating
    signals now come from VPP size, smart-charging session growth, and a broad integration ecosystem rather than from
    traditional financial disclosure.
