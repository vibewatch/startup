  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, hardware-led substitutes, and internal build all matter'
        blocks:
          - type: paragraph
            body: >-
              Tibber competes in a broader field than a simple electricity-retail peer list suggests. The direct
              overlaps are app-first dynamic energy brands such as Octopus Agile, Ostrom, Greenely, Frank, and aWATTar,
              all of which market transparent wholesale-linked pricing and at least some degree of automation or
              smart-home control. But adjacent substitutes matter just as much. 1KOMMA5 and Enpal attack the same
              household energy budget from the hardware side by bundling solar, storage, wallboxes, and AI control into
              financed home-energy propositions. Internal build is the third competitive class: Tibber's own API and
              Home Assistant support prove that technically capable households can replicate a meaningful part of the
              orchestration layer themselves. This means Tibber is not just defending against cheaper tariffs; it is
              defending against platforms that want to own the home-energy operating system, the financed device stack,
              or the enthusiast open-source workflow. The competitive map therefore has to cover direct peers, adjacent
              bundles, low-frills tariffs, and self-build substitutes at the same time.
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP021
              - CP023
              - CP024
