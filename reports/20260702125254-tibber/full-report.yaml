      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The first buyer is usually the digitally engaged household, but the most valuable early customer is not
              the median consumer. Public competitor and ecosystem pages consistently point to homes with controllable
              assets: EVs, chargers, home batteries, and heat pumps. These loads can move substantial consumption
              without forcing people to change their daily routines, which is why the practical SAM is smaller than all
              households in Tibber’s served countries. The adoption motion is also staged. A household first needs
              interval pricing visibility, then compatible metering, then connected devices, then automated control, and
              only later can it participate in ancillary or balancing markets. API and ecosystem openness matter because
              advanced users expect the energy stack to plug into automation systems like Home Assistant or
              device-specific tools such as openWB. That increases retention but also raises the bar for integrations,
              device support, and technical reliability.
