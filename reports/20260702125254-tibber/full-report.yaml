      - number: '2.4'
        title: Growth drivers behind category expansion
        blocks:
          - type: paragraph
            body: >-
              The macro case for Tibber’s category is that electrification keeps raising both electricity demand and the
              need for flexibility. IEA explicitly connects rising demand to the electrification of buildings,
              transport, and industry, then separately says systems need more demand response and batteries to manage a
              more complex supply mix. Business Norway describes the household-level version of that same problem: EV
              charging peaks and intermittent renewables make grid capacity more difficult to manage under traditional
              supply models. Utility and infrastructure players support the same direction of travel. E.ON frames
              battery integration and bidirectional charging as important levers for affordability and security, while
              Landis+Gyr emphasizes the scale of smart-meter and grid-edge data networks needed to operate modern
              systems. In other words, Tibber benefits from a structural market shift in which households are
              increasingly treated as flexible energy actors rather than passive bill payers.
            claimRefs:
              - CM014
              - CM015
              - CM018
              - CM033
              - CM034
