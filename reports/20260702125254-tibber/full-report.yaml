      - number: '7.3'
        title: Dependency density and competitive parity can compress Tibber’s edge quickly
        blocks:
          - type: paragraph
            body: >-
              Tibber’s growth thesis depends on controlling several external layers at once. The company needs device
              adoption, cloud infrastructure, home-automation compatibility, and continued access to exchange-linked or
              grid-linked market economics. It also needs to keep differentiating while competitors copy the same
              building blocks. Frank markets dynamic pricing, EV charging, and congestion services. Enpal says dynamic
              tariffs are now mandatory in Germany and frames VPPs as an emerging mainstream construct. Greenely markets
              quarter-hour pricing, smart charging, and battery-driven grid rewards. Octopus shows how low-carbon demand
              shifting can be productized for consumers. 1KOMMA5° claims million-device control and gigawatt-scale VPP
              capacity while also litigating state-aid design. None of those sources disproves Tibber’s value
              proposition, but together they do show that the category is becoming crowded and policy-sensitive. That
              means partner and market dependencies should be treated as core underwriting risk rather than as
              background context.
