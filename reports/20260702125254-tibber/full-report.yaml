      - number: '8.2'
        title: Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Tibber's last clearly corroborated official financing event in the fetched set remains the $100m Series C
              announced in 2022 by Balderton. A separate 2025 Signalbase item reports a new $300m funding round, and
              Silicon Canals includes Tibber among the largest Nordic rounds in 2024, but Tibber's current official
              pages do not themselves surface that financing history or any updated valuation. Meanwhile, private-market
              platforms such as Accumeo, EquityZen, CB Insights, and Notice all track Tibber stock or valuation, but
              they expose only thin or gated public detail. That is precisely the setup where entry discipline matters
              most. Summa's 2025 revenue anchor of €68m is the only hard topline datapoint in the fetched record. If the
              committee stress-tests the user-provided late-2026 working mark at roughly $2.2B, the implied
              trailing-revenue multiple lands around 29x to 32x depending on currency treatment. That is a premium
              multiple for a business whose operating story is visible but whose financing terms, margin structure, and
              liquidity path remain private. The right stance is therefore price-sensitive: do not underwrite a
              multi-billion entry simply because the company is real and category-relevant.
            claimRefs:
              - CV008
              - CV012
              - CV018
              - CV019
              - CV022
              - CV023
              - CV024
              - CV040
              - CV046
              - CV047
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV012
              - CV040
              - CV044
      - number: '8.3'
        title: Scenario Analysis and Comparable Set
        blocks:
          - type: paragraph
            body: >-
              The scenario work is intentionally simple because the evidence base is thin where precision normally comes
              from. On the positive side, comparable operating-model pages show that dynamic retail, smart-home
              orchestration, and household flexibility are real categories: Octopus powers more than 10 million homes,
              1KOMMA5° serves 120,000-plus households in seven countries, Enpal says it reaches more than 100,000 German
              households, and Ostrom, Greenely, and aWATTar all market digital or dynamic tariff products. That
              validates category relevance. It does not validate Tibber's price. A bull case requires Tibber to compound
              from the €68m 2025 revenue base to roughly €120m-plus by 2027 while preserving a premium multiple more
              typical of a scarce category winner than of a transparent consumer-energy platform. The base case assumes
              continued growth, but at more ordinary multiples and still lands below a late-stage secondary mark. The
              bear case combines slower growth, single-digit multiples, and the reality that public markets often value
              energy-adjacent consumer platforms more harshly once narrative tailwinds cool. The comparable set
              therefore supports interest in the model but argues for underwriting discipline at the current price.
            claimRefs:
              - CV012
