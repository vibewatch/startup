        - label: Home control and automation layer
          detail: App-driven smart charging, heating control, and device-specific power-ups coordinate home behavior.
          modules:
            - Smart Charging
            - Heating control
            - Power-ups
        - label: Device and hardware layer
          detail: Pulse, chargers, batteries, and partner devices supply controllable load and telemetry.
          modules:
