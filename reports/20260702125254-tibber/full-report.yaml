        title: Exhibits
        blocks:
          - type: callout
            title: The company looks real; the price still looks under-documented
            body: >-
              Tibber has visible product, customer, and flexibility proof, but official pages do not yet disclose the
              reported 2025 financing or the economic terms needed to justify a multi-billion valuation.
            calloutType: risk
