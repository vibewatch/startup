  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal surfaces are visible, but assurance around them is still thin
        blocks:
          - type: paragraph
            body: >-
              Tibber’s retained public record is stronger on policy text than on independently verified assurance. The
              company has a legal notice, privacy notice, compliance page, whistleblowing page, Supplier Code of
              Conduct, Data Act policy, and AI-assistant terms. Those materials show that Tibber understands the risks
              created by connected devices, customer data, supplier conduct, and AI-enabled support. They also show that
              the company wants those policies to travel across supplier contracts and customer interactions. What the
              retained record does not show is equally important. There are no current public security certifications,
              no quantified incident history, no published audit outcomes for supplier-code enforcement, and no
              regulator-facing disclosure confirming how connected-device data controls are tested in practice. For a
              company whose product increasingly reaches into household control loops and grid-market participation,
              that gap keeps residual legal and governance risk above average even before any adverse event occurs.
