      - number: '7.4'
        title: The hardest open questions are economic and assurance-related, so kill criteria must stay measurable
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a clear picture of what Tibber wants to be: a household-energy control
              platform with dynamic tariffs, device orchestration, and grid-market monetization. They do not support a
              clear picture of the downside boundaries. Public materials do not quantify current breach history,
              security certifications, vendor concentration, bad-debt exposure, working-capital needs, or gross-margin
              behavior inside the electricity-supply model. Even customer review surfaces are directionally helpful
              rather than decisive: Trustpilot is positive but imperfect, JustUseApp adds a middling automated safety
              score, and Entireweb shows no live crisis on the review date without proving long-run reliability. That
              combination is exactly why the kill criteria need to be tied to evidence that can actually be collected in
              diligence. If Tibber cannot show current assurance on security and data controls, cannot explain
              energy-supply economics, or cannot demonstrate that differentiation survives rising category parity, the
              risk rating should stay high. The multilingual German, Dutch, Norwegian, and Swedish terms pages also
              underline that Tibber must keep consumer-rights and data-handling disclosures coherent across markets
              while the category keeps evolving.
