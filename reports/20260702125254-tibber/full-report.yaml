      - number: '2.5'
        title: Constraints, fragmentation, and unresolved diligence questions
        blocks:
          - type: paragraph
            body: >-
              The same evidence also shows why this is not yet a frictionless mass-market category. aWATTar’s
              network-tariff page requires a smart meter with quarter-hour readout, and Greenely still sells a dedicated
              realtime-meter device for some customers, so metering and hardware remain gating items. Market design is
              fragmented too: the public competitive set spans 15-minute, 30-minute, and hourly settlement rhythms, and
              Tibber’s own contract stack is localized country by country rather than standardized across Europe. Grid
              stress creates opportunity but also complexity: Frank openly markets congestion relief and negative-price
              avoidance, which means customer value increasingly depends on local market rules and not just an elegant
              app. Finally, the public record still does not say what fraction of Tibber customers own compatible assets
              or how Grid Rewards revenue is shared with households. Those missing unit-economics facts are the main
              diligence blockers before converting category momentum into a sharper valuation view.
