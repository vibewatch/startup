      - number: '1.3'
        title: Funding history, investor map, and conflicting third-party records
        blocks:
          - type: paragraph
            body: >-
              Tibber has a credible public funding story, but not a perfectly reconciled one. The cleanest official
              checkpoint is the $100 million Series C described by Balderton, with Summa Equity leading and Balderton,
              Eight Roads, and Schibsted Ventures continuing. Historical media coverage adds earlier capital signals,
              including a Series A path and Balderton's own note that it first invested in November 2020. Beyond that,
              the databases diverge. The Company Check says Tibber has raised $177 million across four rounds and labels
              the latest round a March 2022 Series C. CB Insights instead shows a much larger $375.62 million total,
              including a March 2024 line of credit and a same-day Series C-III entry. Those records may reflect
              differing treatment of debt, secondary liquidity, venture extensions, and later structured financing, but
              the retained cache does not reconcile them. The investor and stakeholder picture is clearer than the exact
              cap table: Summa, Balderton, Eight Roads, Schibsted, Nordea, and possibly DNB all matter economically,
              while Tibber's affiliate structure means local operating entities also matter for market execution.
