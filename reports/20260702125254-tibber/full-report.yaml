  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Tibber’s market is not the whole electricity system and it is not just a commodity power contract. The
              evidence points to a narrower category: consumer electricity retail that uses software, interval pricing,
              and connected devices to turn the home into a flexible node. Tibber’s own Grid Rewards and energy-market
              materials put EVs and batteries at the center of the value proposition, while local terms pages show that
              electricity supply and VPP participation are localized country by country. That means the included spend
              is the household bill plus software-led savings or earnings from load shifting, smart charging, heating
              control, battery optimization, and balancing services. Excluded spend includes conventional fixed-price
              retail, households without interval-meter capability, and hardware that never connects into an
              orchestration layer. The most relevant substitutes are not legacy utilities alone; they are digital-first
              tariffs and device-led energy apps that teach households to optimize timing rather than simply switch
              supplier.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM032
          - type: table
            tableRef: TM001
