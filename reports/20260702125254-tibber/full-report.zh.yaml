            body: >-
              Tibber 保留的公开记录在政策文本上较强，在独立验证的保障上较弱。公司有法律通知、隐私 通知、合规页面、举报页面、Supplier Code of Conduct、Data Act 政策和 AI
              assistant 条款。 这些材料说明 Tibber 理解联网设备、客户数据、供应商行为和 AI 赋能支持带来的风险；也说明
              公司希望这些政策贯穿供应商合约和客户互动。同样重要的是保留记录没有展示的内容：没有当前 公开安全认证，没有量化事故历史，没有关于供应商准则执行的公开审计结果，也没有面向监管的
              披露来确认联网设备数据控制在实践中如何测试。对一家产品越来越深入家庭控制循环和电网市场 参与的公司来说，即使尚未发生负面事件，这个缺口也让剩余法律和治理风险高于平均水平。
