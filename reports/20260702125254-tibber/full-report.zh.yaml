  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、硬件驱动替代品和内部自建都重要
        blocks:
          - type: paragraph
            body: >-
              Tibber 面临的竞争场，比简单电力零售同行名单更宽。直接重叠的是 Octopus Agile、Ostrom、 Greenely、Frank 和 aWATTar 这类 app
              优先的动态能源品牌；它们都营销透明的批发价联动 定价，并至少具备一定程度的自动化或智能家居控制。但相邻替代品同样重要。1KOMMA5 和 Enpal 从硬件侧切入同一个家庭能源预算，把光伏、储能、wallbox
              和 AI 控制打包成带融资的家庭 能源方案。内部自建是第三类竞争：Tibber 自己的 API 和 Home Assistant 支持证明，技术 能力强的家庭可以自己复刻编排层中相当一部分。这意味着 Tibber
              不只是在防守更便宜的电价； 它还要防守那些想掌握家庭能源操作系统、融资设备栈，或发烧友开源工作流的平台。因此， 竞争地图必须同时覆盖直接同行、相邻套装、低配置电价和自建替代品。
