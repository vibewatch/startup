      - number: '1.3'
        title: 融资历史、投资者版图与互相冲突的第三方记录
        blocks:
          - type: paragraph
            body: >-
              Tibber 的公开融资故事可信，但并没有完全对齐。最干净的官方检查点是 Balderton 描述的 $100 million Series C，由 Summa Equity 领投，Balderton、Eight
              Roads 和 Schibsted Ventures 继续跟投。历史媒体报道补充了更早的资本信号，包括 Series A 路径，以及 Balderton 自己称其首次投资发生在 2020 年 11
              月。再往后，数据库开始分叉。The Company Check 称 Tibber 通过四轮融资筹集了 $177 million，并把最新一轮标为 2022 年 3 月 Series C。CB Insights
              则显示更高的 $375.62 million 总额，其中包括 2024 年 3 月一笔授信额度和同日 Series C-III 记录。这些记录可能来自对债务、二级流动性、风险投资延展和后续结构化融资
              的不同处理，但保留缓存无法调和。投资者和利益相关方图谱比精确 cap table 更清楚：Summa、 Balderton、Eight Roads、Schibsted、Nordea，以及可能的 DNB
              都有经济意义；Tibber 的 关联公司结构也意味着本地运营实体会影响市场执行。
