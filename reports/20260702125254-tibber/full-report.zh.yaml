      - number: '2.2'
        title: 用公开且受证据约束的视角测算市场
        blocks:
          - type: paragraph
            body: >-
              公开证据在市场基础设施、已安装资产基础和已观察到的灵活性池上更强；要给 Tibber 找到 一个单一、干净的第三方 TAM，则证据更弱。最宽的视角是交易层：Nord Pool 单独披露，每年 约 500 TWh
              在 15 个国家和 21 个竞价区交易；EPEX 也继续扩展泛欧洲现货交易。更可行动的 采用视角是电气化家庭硬件。EHPA 称，2025 年 16 个欧洲国家售出 2.62 million 台住宅热泵，
              装机基数达到约 28 million 台；这比泛泛的电力市场收入更适合作为灵活家庭负荷代理。最 具体的近期 SOM 视角，是已经激活的灵活性：Tibber 谈到其 VPP 中有数十万台设备，1KOMMA5
              则称已经达到 1 GW 可转移容量。Greenely 和 Frank 披露的公开消费者经济性显示，价值池 可以包括辅助服务支付和经常性账单节省，而不只是能源转售。
