      - number: '5.3'
        title: 部署、支持与信任控制
        blocks:
          - type: paragraph
            body: >-
              Tibber 的支持和信任表面有意义，但不完整。正面看，公司发布了合规、法律、隐私和 Data Act 材料；解释了第三方 app 连接，以及围绕导出、迁移和撤销访问的用户权利；还承认支持渠道 使用 AI
              辅助分诊，并提供转人工选项。Home Assistant 和开发者门户也展示了爱好者 token 和分布式 OAuth 客户端的具体入门路径。弱点在于，公开包没有披露可用性承诺、事故历史、
              安全认证，或云区域与恢复细节。这意味着隐私和数据权利控制可见，但信任的运营保障侧仍 需要私人尽调。这个区分重要，因为一个面向消费者的能源控制产品，可以在隐私权上显得可信，
              但如果可靠性和安全性证据仍只是隐含，仍会让技术买方失望。
