        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >-
              公开来源让 Tibber 更像一个工作流产品，而不只是一个公用事业品牌。家庭可以从数字电力 供应开始，再用 app 查看实时价格和用量分析，接入 Pulse 或其他联网设备，自动化 EV 充电， 最后参与
