  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Tibber 的市场不是整个电力系统，也不只是一个大宗电力合约。证据指向更窄的类别：用软件、 分时电价和联网设备，把家庭变成灵活节点的消费者电力零售。Tibber 自己的 Grid Rewards
              和能源市场材料把 EV 和电池放在价值主张中心，本地条款页面也显示，电力供应和 VPP 参与 按国家本地化。这意味着纳入支出包括家庭电费账单，以及靠负荷转移、智能充电、供暖控制、
              电池优化和调节服务得到的软件驱动节省或收益。排除支出包括传统固定电价零售、没有分时 电表能力的家庭，以及从不接入编排层的硬件。最相关的替代品也不只是传统公用事业公司； 它们还包括数字优先电价和设备驱动能源
              app，这些产品教家庭优化用电时点，而不只是更换 供应商。
            claimRefs:
              - CM001
              - CM002
