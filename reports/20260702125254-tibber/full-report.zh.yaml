      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备具备可能性，但证据还达不到激进入场价所需标准。投资者基础可信，私募市场平台确实跟踪 Tibber 股份，该品类对大型能源、软件或家庭电气化买方有战略价值。但此处抓取的公开来源没有验证正在进行的 IPO
              进程、正式流动性计划，或传闻 2025 年融资的确切结构。实际含义是，下行保护更多取决于数据室揭示的优先权、股类、单位经济和国家层面的耐久性，而不是叙事质量。因此尽调负担高且具体。委员会应坚持拿到
              2024–2026 年收入桥、当前毛利率和现金消耗、NRR 或流失率、完整股权结构瀑布表，并直接确认 Tibber
              在哪里运营、各市场有多少活跃用户或客户。在这些材料给出之前，即使是强战略资产，也应被视作一笔带有信息不对称风险的定价练习。
