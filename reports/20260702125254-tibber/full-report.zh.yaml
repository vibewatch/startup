      - number: '3.4'
        title: 切换成本和分发能力更多来自电表、设备和合约，而不是电价本身
        blocks:
          - type: paragraph
            body: >-
              在这个类别里，换电价通常是最容易的一步；难的是后面的所有步骤。智能电价往往要求分时 电表和设备资格，Octopus 的入门页面把这种摩擦说得很清楚。客户一旦连接 EV 充电器、
              热泵、恒温器或电池，切换成本就会上升，因为排程、设备兼容性和控制逻辑都进入家庭日常。 分发能力也因入口不同而异。Octopus 可以从庞大客户触达起步，Enpal 和 1KOMMA5 可以从带
              融资的家庭硬件起步。Tibber 的公开优势不同：开放性。API 和 Home Assistant 支持让它对 高阶用户和集成商更有吸引力，也能降低黑盒担忧。但同样的开放性也降低了内部自建门槛； Tibber
              既受益于生态，也在赋能一种替代品。最终结果是，护城河强度不太取决于原始电价， 更取决于第一台设备接入后，谁拥有家庭能源工作流。
