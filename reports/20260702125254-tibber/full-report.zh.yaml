      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              第一批买方通常是数字化参与度高的家庭，但最有价值的早期客户不是中位数消费者。公开 竞品和生态页面一致指向拥有可控资产的家庭：EV、充电器、家用电池和热泵。这些负荷可以
              在不迫使人们改变日常习惯的情况下移动大量用电，因此实际 SAM 小于 Tibber 已服务国家的 所有家庭。采用路径也分阶段。家庭先要看到分时电价，再要有兼容电表，随后接入联网设备，
              再让软件自动控制，最后才能参与辅助服务或调节市场。API 和生态开放度重要，因为高级用户 期待能源栈能接入 Home Assistant 之类自动化系统，或 openWB 这样的设备专用工具。这会
              提高留存，但也提高了对集成、设备支持和技术可靠性的要求。
