    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              公开来源一致把 Tibber 描述为一家数字能源供应商，试图让自己与降低家庭用电量保持一致， 而不是赚售电加价。AWS 和 Balderton 都描述为固定经常性费用加按采购价售电；Tibber 自己
              的页面又补充了两个表面：通过商店实现设备绑定销售，以及通过 Grid Rewards 参与带来收益。 这种组合重要，因为它意味着公开标价只能部分说明变现。公司可以用电力供应获客，通过 app
              和自动化加深参与度，再把已连接设备或灵活性参与变现。弱点在于，抓取到的来源都没有披露 已实现收入组合、绑定率或各表面的毛利，因此读者能看清收入架构，却还不能给它的
              质量或耐久性背书。一份干净的尽调包需要分别桥接订阅收入、能源结算经济性、设备绑定销售 和灵活性支付，然后才谈得上给混合经常性收入倍数。
