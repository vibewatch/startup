      - number: '8.5'
        title: 建议与证据评估
        blocks:
          - type: paragraph
            body: >-
              建议为 research-more，置信度中等，风险评级高，估值立场为昂贵。Tibber 通过了公司质量第一道筛选：产品可信、灵活性故事真实、客户规模有意义，2025
              年运营指标也朝正确方向移动。它没有通过的是价格支撑。即便假设慷慨，牛市情景也只能勉强守住接近提示给定的后期估值，基准情景安全边际很薄，熊市情景则意味着痛苦下调。证据集方向有用，但结构上不完整。官方和备案来源验证公司，合作伙伴和投资者来源验证运营进展，竞争对手页面验证品类成立。上述内容都不能替代已验证轮次条款、收入质量数据或流动性权利。只有当
              Tibber 显著提高财务透明度，或入场价重置到让不透明从负债变成有补偿风险的水平时，投资判断才应上调。
