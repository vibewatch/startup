            body: >-
              画像表展示了分发能力上的尖锐不对称。Octopus 是最清楚的规模异类，因为其公司页面声称 覆盖超过 10 million 个家庭，带来小型欧洲大陆 app 优先零售商无法匹配的品牌和支持足迹。 Enpal
              是最清楚的硬件分发异类，因为其消费者页面称已有 100,000+ 户家庭使用其光伏方案， 意味着它可以把能源管理交叉销售进一个由它部分融资的已安装基数。相比之下，从公开来源包 看，欧洲大陆 app
              主导队列——Ostrom、Greenely、Frank 和 aWATTar——更像是功能趋同的场， 而不是规模分化的场。1KOMMA5 之所以具有战略重要性，不是因为这组来源披露了客户数，而是
              因为它从紧密集成的硬件和 AI 套装起步。Tibber 位于这两极之间：比捆绑安装商更开放、更 软件中心化，但这里的公开证据尚未证明它拥有 Octopus 那样的规模信号，或 Enpal 那样的 安装锁定。
