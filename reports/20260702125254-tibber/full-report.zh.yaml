            body: >-
              公开采用证明强于具名客户证明。Tibber 可以指向两条独立节省叙事，它们都称平均客户节省 约 20%；还可以指向 AWS 的历史叙述，称客户数和 IoT 设备数一度每六个月翻倍。市场和评论
              表面也显示真实消费者使用，而不是纯愿景式官网。Trustpilot 有数千条评论，US App Store 有规模较小但仍有意义的评分基础，AppBrain 加 Google Play 证实 Tibber
              已为硬件部署建立 独立安装商工作流。产品深度也真实。AWS 描述客户用 Tibber 确保 EV 在目标时间前充好电， 或回家时屋内已暖；Home Assistant
              暴露价格、用电、发电和收益统计，这些只有用户主动监测 家庭时才有意义。这是可信的采用证据，但它通过使用表面和集成来证明，而不是通过具名家庭 案例或经审计客户数来证明。
