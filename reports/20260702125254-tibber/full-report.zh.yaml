              保留来源对历史资本流入很清楚，但对当前流动性很薄。Tech.eu、Balderton、Tibber 自己的 融资文章和 EU-Startups 都佐证了 2022 年 $100 million Series
              C，并把它框定为技术扩张 资本。Tech.eu 还报道，到 2022 年 3 月累计股权和债务为 $181.5 million；2025 年 Summa
              页面则称北欧盈利能力更强，荷兰增长有意义。这些方向上正面，但仍达不到承销流程现在需要 的程度。备案确认 Tibber 仍足够活跃，已经提交 2024 年年度账目；但抓取到的公开来源没有
              给出当前现金、现金消耗、资金续航、对冲敞口或按市场拆分的债务义务。换言之，公开记录支持一家 有真实资本支撑、仍在运行的平台业务，但还不能给出完整资本充足性答案。这个缺失桥梁尤其
              重要，因为一家结算能源、支持设备并配置客户运营人员的公司，现金消耗方式会与纯 SaaS 供应商非常不同。
