      - number: '8.2'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              在抓取集合中，Tibber 最后一次得到明确佐证的官方融资事件，仍是 Balderton 2022 年宣布的 $100m Series C。另有 Signalbase 2025 年条目称公司完成新一轮 $300m
              融资，Silicon Canals 也把 Tibber 列入 2024 年北欧最大轮次之一；但 Tibber 当前官网页面本身没有呈现这段融资历史或任何更新估值。与此同时，Accumeo、EquityZen、CB
              Insights、Notice 等私募市场平台都跟踪 Tibber 股票或估值，但公开信息很薄，或被门禁挡住。这正是最需要入场纪律的局面。Summa 给出的 2025 年收入锚点
              €68m，是抓取记录里唯一硬性收入数据。如果委员会压力测试用户给定的 2026 年末工作估值约 $2.2B，隐含历史收入倍数会因汇率处理不同落在约
              29x–32x。对于一家运营故事可见、但融资条款、利润率结构和流动性路径仍不公开的业务，这是溢价倍数。因此正确姿态是对价格敏感：不要仅因公司真实且踩中品类，就承销一个数十亿美元级入场价。
            claimRefs:
              - CV008
              - CV012
              - CV018
              - CV019
              - CV022
