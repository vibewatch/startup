              原生界面。这个 宽度重要，因为它是相对简单动态电价的主要差异来源：Tibber 不只是在路由电力，而是试图 掌握控制层，由它决定家庭能源设备何时、如何、在哪里消耗或释放价值。模块图还暗示，Tibber
              想站在多个硬件品牌之上，用软件、数据和市场准入做集成层，而不是迫使客户进入封闭硬件栈。
