              分量。Trustpilot 投诉指向支持慢、电池安装责任缺口、Pulse 断连，以及 15 分钟计费依赖 外部电表流程时的困惑。Home Assistant issue log 在 2026
              年补充了一条更尖锐的技术投诉： 实时实体据称约 24 小时后停止，并反复记录 Invalid token 错误。Tibber 自己的状态页确认， 至少一个重要生态边缘案例——MyEnergi 和 Zappi——到
