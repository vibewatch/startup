  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Tibber 的公开客户档案读起来不像传统公用事业公司，更像一个 app 优先的家庭自动化业务。 可见买方仍是零售账单支付者，但最高价值用户通常是愿意连接设备、跟随价格信号，并让软件
              自动化时点决策的消费者。官方表面反复指向同样的 cohort：动态电价家庭、EV 车主、热泵家庭、 光伏和电池家庭，以及希望在 Home Assistant 或类似仪表盘中获得实时电力数据的高技术参与
              用户。公司现在似乎也有安装商辅助的细分市场，因为 Tibber 为兼容产品的设置和交付维护一款 专用安装商 app。地理覆盖已经足够重要，独立来源仍把零售业务与德国、挪威和瑞典联系起来。
              未公开的是国家层面拆分、各 cohort 的 attach rate，以及有多少用户停留在纯电价层，多少 扩展到设备、Power-Ups 或灵活性产品。
