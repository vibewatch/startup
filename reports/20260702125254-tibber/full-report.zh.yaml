        - 优先股堆叠、反稀释或内部人保护显著压低新普通股经济性
        - 企业价值上行不再顺畅映射为投资者回报。
        - 要求非常不同的交易结构，否则退出。
      - - 单位经济偏弱
        - 毛利率、烧钱速度或流失率支撑不了高端软件式倍数
        - 智能能源叙事没有转化为持久盈利能力。
        - 在同一价格下，把判断从继续研究推向回避。
      - - 足迹或客户质量被夸大
        - 验证后的活跃客户数或国家运营显著低于本轮融资推介叙事
        - TAM 和执行确信度同步压缩。
        - 立即下调情景区间并降低确信度。
      - - 服务或监管摩擦上升
        - 客户投诉持续，或市场设计变化削弱灵活性经济性
        - 品类价值仍在，但变现质量恶化。
        - 下调倍数区间，并缩短可接受持有期假设。
    notes: 这些是预先承诺的尽调触发器，目的在资本被错误定价前阻止叙事驱动型投资。
    claimRefs:
      - CV026
      - CV039
      - CV041
      - CV042
      - CV043
      - CV045
      - CV049
  - id: TV006
    title: 最终尽调事项
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2025 年融资轮
        - 签署文件，显示金额、工具、投后估值和内部人参与
        - 据报道的新一轮资本是定价核心，但官方页面未完整披露。
        - CFO、领投方和融资律师审查。
      - - 收入质量
        - 按地区、产品以及总收入 / 净收入口径拆分的 2024-2026 桥接
        - €68m 锚点有帮助，但不足以承销增长持久性。
        - 财务数据室加管理层复核。
      - - 单位经济
        - 毛利率、贡献利润率、CAC 回本周期、NRR、流失率、烧钱速度和现金跑道
        - 倍数选择取决于收入质量，不只是有没有收入。
        - 董事会材料、KPI 包和队列分析。
      - - 股权结构表和优先权
        - 清算瀑布、股份类别、期权池、反稀释和治理权利
        - 如果优先权很重，高企业价值仍可能带来疲弱的普通股回报。
        - 律师资料包和完全摊薄股权结构模型。
      - - 运营足迹
        - 按国家列出的用户、客户和收入数量，包括上线状态
        - 公开记录直接支持四国规模，而更宽的足迹叙事在此仍未验证。
        - 管理层明细表，加监管方或实体交叉核验。
      - - 退出路径
        - 流动性计划、投行对话、老股流程或战略兴趣证据
        - 退出时点决定所需回报，也决定现在为高价买单的容忍度。
        - 管理层访谈和领投方背调电话。
    notes: 每项要求都直接绑定一个当前在公开记录中不透明的估值变量。
    claimRefs:
      - CV012
      - CV026
      - CV045
      - CV049
      - CV050
