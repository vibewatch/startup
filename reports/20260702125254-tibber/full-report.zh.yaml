      - number: '7.4'
        title: 最难的开放问题与经济性和保障有关，因此叫停标准必须保持可衡量
        blocks:
          - type: paragraph
            body: >-
              保留来源清楚描绘了 Tibber 想成为什么：一个拥有动态电价、设备编排和电网市场变现能力的 家庭能源控制平台。它们没有清楚描绘下行情景边界。公开材料没有量化当前数据泄露历史、安全
              认证、供应商集中度、坏账敞口、营运资本需求，或电力供应模型内的毛利表现。即便消费者评论 表面也只是方向上有帮助，而非决定性：Trustpilot 正面但并不完美，JustUseApp 给出中等的
              自动化安全分数，Entireweb 在评审日期没有显示实时危机，但也不能证明长期可靠性。正因为 如此，叫停标准需要绑定到尽调中实际可以收集的证据。如果 Tibber 无法展示当前安全和
              数据控制保障，无法解释能源供应经济性，或无法证明差异化能在类别趋同上升时保留下来，风险 评级就应保持高位。德语、荷兰语、挪威语和瑞典语条款页面也强调，在类别持续演进时，Tibber
              必须让跨市场消费者权利和数据处理披露保持一致。
