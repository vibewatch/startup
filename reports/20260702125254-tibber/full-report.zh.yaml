chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法定所在地与商业模式
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Tibber 把自己呈现为一家数字电力供应商，用一个 app 把零售电力、自动化、 智能家居控制和账单降低打包成面向消费者的主张。官网首页、关于页面和招聘页面在战略 方向上保持一致：Tibber
              不想像传统大宗商品公用事业公司，而想像一个由软件居中的家庭 能源操作系统。这个定位重要，因为公司声称自己与既有企业的激励不同。官方和合作伙伴 来源反复表示，Tibber 不靠推动更高用电量赚更多钱；AWS
              也把历史商业模式描述为固定 月费加按采购价售电。法律结构比消费者品牌叙事更复杂。Tibber AS 是挪威母公司，注册 办公地在 Førde；隐私通知则列出挪威、瑞典、德国和荷兰的关联运营公司。第三方简介仍 指向
              Stockholm 作为总部所在地，因此更干净的理解是：Tibber 的法定所在地在挪威，商业 身份明显偏瑞典，并拥有多国运营足迹。
