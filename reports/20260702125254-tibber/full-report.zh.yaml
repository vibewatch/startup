      - number: '8.3'
        title: 情景分析与可比组
        blocks:
          - type: paragraph
            body: >-
              情景分析有意保持简单，因为证据基础在通常支撑精确度的地方很薄。正面看，可比经营模式页面显示，动态零售、智能家居编排和家庭灵活性都是真实品类：Octopus 覆盖 1000 多万户家庭，1KOMMA5° 在 7
              个国家服务 120,000 多户，Enpal 称触达 100,000 多个德国家庭，Ostrom、Greenely 和 aWATTar 都在营销数字化或动态电价产品。这证明品类有吸引力，不证明 Tibber
              的价格。牛市情景要求 Tibber 从 2025 年 €68m 收入基数复合增长到 2027 年约
              €120m+，同时维持更像稀缺品类赢家、而非透明消费者能源平台的溢价倍数。基准情景假设公司继续增长，但采用更普通倍数，结果仍低于后期二级市场估值。熊市情景结合增长放缓、个位数倍数，以及叙事顺风冷却后，公开市场往往更严苛定价能源相邻消费者平台这一现实。因此，可比组支持关注该模式，也要求以当前价格承销时保持纪律。
