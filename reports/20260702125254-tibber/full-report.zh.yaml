          to: cust
        - from: comp
          to: cust
        - from: comp
          to: mkt
    approximationNotes: 图中突出决策关键的依赖节点，而不是 Tibber 生态里的每个供应商或硬件 SKU。
    claimRefs:
      - CR010
      - CR011
      - CR020
      - CR024
      - CR030
      - CR031
      - CR032
      - CR040
      - CR041
      - CR046
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: Tibber 通过相关性测试，但尚未通过价格支撑测试。
    data:
      nodes:
        - id: n1
          label: |-
            真正的数字
            能源产品
        - id: n2
          label: |-
            100 万+ 用户 /
            4 国验证
        - id: n3
          label: |-
            2025 年收入 +
            VPP 进展
        - id: n4
          label: |-
            官方定价
            不透明
        - id: n5
          label: |-
            测算估值
            看起来偏高
        - id: n6
          label: |-
            建议：
            继续研究
      edges:
        - from: n1
          to: n6
          label: 支撑兴趣
        - from: n2
          to: n6
          label: 支撑相关性
        - from: n3
          to: n6
          label: 支撑质量
        - from: n4
          to: n6
          label: 阻碍确信
        - from: n5
          to: n6
          label: 倒逼估值纪律
    claimRefs:
      - CV004
      - CV011
      - CV012
      - CV015
      - CV016
      - CV040
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以 2025 年 €68m 收入为锚，即使倍数小幅压缩，Tibber 隐含价值也会明显改变。
    data:
      items:
        - label: €68m × 12x
          value: 816
          unit: EURm
        - label: €68m × 16x
          value: 1088
          unit: EURm
        - label: €68m × 20x
          value: 1360
          unit: EURm
        - label: €68m × 24x
          value: 1632
          unit: EURm
        - label: €68m × 28x
          value: 1904
          unit: EURm
        - label: €68m × 30x
          value: 2040
          unit: EURm
    approximationNotes: 数值四舍五入到最接近的百万，并采用 Summa 的 2025 年 €68m 收入锚点，用简单收入倍数框架计算。
    claimRefs:
      - CV012
      - CV040
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基础和悲观区间相对后期二级交易入场，只留下有限安全边际。
    data:
      items:
        - label: 悲观情景
          low: 550
          mid: 630
          high: 710
          unit: EURm
        - label: 基础情景
          low: 1200
          mid: 1300
          high: 1400
          unit: EURm
        - label: 乐观情景
          low: 1950
          mid: 2100
          high: 2230
          unit: EURm
        - label: 测算入场价
          low: 2000
          mid: 2100
          high: 2200
          unit: EURm
    approximationNotes: 情景区间仅供示意，反映的是收入倍数逻辑而非 DCF，因为公开毛利率和现金流数据不可得。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 市场和产品质量得分较好，估值支撑和证据质量落后。
    data:
      items:
        - label: 市场顺风
          value: 8
          max: 10
          note: 动态电价和灵活性仍是活跃品类。
        - label: 产品相关性
          value: 8
          max: 10
          note: 零售电力、app 控制和 Grid Rewards 都有公开可见证据。
        - label: 客户验证
          value: 7
          max: 10
          note: 100 万+ 用户说法，加上强劲的历史订阅增长。
        - label: 经营势能
          value: 7
          max: 10
          note: 2025 年收入、VPP、智能充电和盈利能力均有改善。
        - label: 证据质量
          value: 4
          max: 10
          note: 轮次条款、利润率、NRR 和股权结构仍未公开。
        - label: 估值支撑
          value: 3
          max: 10
          note: 测算估值相对唯一硬收入锚点显得偏高。
        - label: 退出准备度
          value: 4
          max: 10
          note: 未抓取到任何公开来源能验证 IPO 时间或正式流动性路径。
    claimRefs:
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
      - CV040
      - CV050
