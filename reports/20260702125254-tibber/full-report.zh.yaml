        title: 里程碑、规模信号与可见风险
        blocks:
          - type: paragraph
            body: >-
              Tibber 的公开里程碑记录支持这样一家公司：从 2016 年创立故事，走向 2025-2026 年更大的 VPP 和智能能源叙事。历史规模锚点足以证明真实采用：AWS 称 2021 年 5 月有 33
              billion 条 IoT 消息，Balderton 称订阅量在 2021 年从 120,000 增至超过 400,000，Summa 称 VPP 在 2025 年达到 33 million kWh，并有 27
              million 次智能充电会话。与此同时，公开披露 有选择性。招聘页面把当前员工和客户数藏在近似占位符之后，保留的最佳人员数字仍是 The Company Check 对 2022 年底 61
              名员工的记录。主要负面证据也更多面向消费者，而非监管。 Trustpilot 仍显示不错的总体评分，但详细评论指向支持延迟、设备故障，以及账单或电表 结算摩擦。这些问题本身不会推翻投资论点，但它们重要，因为
              Tibber 的承诺依赖可靠自动化、 及时支持，以及足够的客户信任——客户要把充电、供暖和家庭电池控制权交给公司。
