      - number: '1.2'
        title: 创始人、领导层与治理控制
        blocks:
          - type: paragraph
            body: >-
              创始人仍是公开叙事的中心。Tibber 的关于页面仍把 Daniel Lindén 和 Edgeir Vårdal Aksnes 放在前面，底层起源故事在官方与第三方来源之间也一致：两位创始人都来自能源
              行业，并围绕一个想法搭建 Tibber——降低家庭用电量应当成为客户的利润中心，而不是供应商 的收入流失。创始人之外的公开可见度要薄得多。The Company Check 展示了少数具名高管
              和一位董事长，但保留的官方缓存没有提供当前公开董事会页面、委员会名单或更广控制层 的详细履历。治理控制仍然可见。Tibber 发布了举报计划，说明由法务负责人主持的委员会 处理严重报告，并在 2024 年 5
              月的 Supplier Code of Conduct 中明确覆盖人权、反腐败、 网络安全和环境报告。这足以证明正式治理管线存在，但还不足以完全支撑董事会深度或接班
              韧性。因此，在公开记录里，关键人物依赖仍然明显。
