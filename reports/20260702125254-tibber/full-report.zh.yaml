      - number: '2.5'
        title: 约束、碎片化与未解决的尽调问题
        blocks:
          - type: paragraph
            body: >-
              同一组证据也说明，这还不是一个无摩擦的大众市场类别。aWATTar 的网络电价页面要求智能 电表支持 15 分钟读数，Greenely 仍向部分客户销售专用实时电表设备，因此电表和硬件仍是
              门槛。市场设计同样碎片化：公开竞品集覆盖 15 分钟、30 分钟和按小时结算节奏，Tibber 自己 的合约栈也是按国家本地化，而不是全欧洲标准化。电网压力创造机会，也带来复杂性：Frank
              公开营销拥塞缓解和负价规避，意味着客户价值越来越依赖本地市场规则，而不只是一个优雅 app。最后，公开记录仍没有说明 Tibber 客户中有多大比例拥有兼容资产，也没有说明 Grid Rewards
              收入如何与家庭分成。在把类别动能转化为更清晰估值判断之前，这些缺失的单位经济 事实是主要尽调障碍。
