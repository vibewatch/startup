  - id: TV002
    title: 投资逻辑 / 反向逻辑
    columns:
      - 方向
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - Tibber 有真实的数字能源产品，覆盖动态定价、App 控制和电网灵活性功能。
        - 官方产品页、Grid Rewards，以及 Brreg 登记的经营宗旨。
        - 如果围绕灵活性的用户参与或变现被证明很浅，护城河会迅速变窄。
      - - 投资逻辑
        - 运营验证不止停留在叙事：2025 年收入、盈利改善、VPP 容量和智能充电活动都在上行。
        - Summa 的 2025 年公司页面披露 €68m 收入、北欧盈利能力改善、33m kWh VPP 规模和 27m 次智能充电会话。
        - 如果这些指标在 2026 年停滞，高增长溢价叙事会明显走弱。
      - - 投资逻辑
        - 客户规模有分量，第三方资料提到用户超过一百万。
        - Atlar 提到四个国家超过一百万用户；Balderton 记录了早期订阅加速。
        - 如果活跃用户或付费家庭显著低于营销口径，收入质量必须重定价。
      - - 投资逻辑
        - 监管和品类顺风支持需求侧编排。
        - EU 市场设计改革，以及多个动态电价同行的存在，说明该品类有韧性。
        - 如果监管或消费者经济性削弱灵活性激励，增长和倍数支撑都会被压缩。
      - - 反向逻辑
        - 官方披露落后于估值叙事。
        - 当前 Tibber 页面没有披露据报道的 2025 年融资、当前估值、股权结构表或单位经济。
        - 完整数据室或公司主导的融资披露可以迅速补上这个缺口。
      - - 反向逻辑
        - 相对唯一硬收入锚点，这个后期工作估值显得偏贵。
        - 2025 年收入 €68m，对比约 $2.2B 工作估值，意味着顶级倍数，容错空间很小。
        - 若收入验证超过 ~€100m 且利润率强，同一价格会更容易辩护。
      - - 反向逻辑
        - 公开足迹证据窄于更宽的承销叙事。
        - 抓取来源只能直接验证四国活动或用户，不能验证提示中提到的八国足迹。
        - 管理层可以用按国家拆分的运营和客户明细补上。
      - - 反向逻辑
        - 服务质量问题和经济性不透明，在价格风险之外又叠加执行风险。
        - Askmeoffers 显示客服投诉，而公开来源未披露利润率、流失或烧钱速度。
        - 如果尽调中客服、流失和利润率都干净，这条反对意见应当减弱。
    notes: 这些论点严格围绕估值关联展开，而不是泛泛给公司质量打分。
