      - number: '2.4'
        title: 推动类别扩张的增长驱动
        blocks:
          - type: paragraph
            body: >-
              支撑 Tibber 所在类别的宏观逻辑是：电气化持续推高电力需求，也推高对灵活性的需求。IEA 明确把需求增长与建筑、交通和工业电气化联系起来，又单独指出系统需要更多需求响应和电池，
              才能管理更复杂的供给组合。Business Norway 描述的是同一个问题在家庭层面的版本：EV 充电 峰值和间歇性可再生能源，让传统供应模型下的电网容量更难管理。公用事业和基础设施玩家也
              支持同一方向。E.ON 把电池集成和双向充电视为改善可负担性和安全性的关键杠杆；Landis+Gyr 则强调运行现代系统所需的智能电表和电网边缘数据网络规模。换言之，Tibber 受益于一个
              结构性市场转向：家庭越来越被当作灵活能源参与者，而不是被动付账者。
            claimRefs:
