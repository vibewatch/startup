  - id: TR005
    title: 缓释措施与放弃标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 安全与控制披露缺口
        - 独立鉴证迟迟没有出现
        - 尽调中拿不到当前认证、事件指标或泄露历史披露
        - 将风险评级按高处理，并在承销平台杠杆前要求做私下安全尽调。
      - - 财务模型不透明
        - 能源供应经济性仍未披露
        - 未提供当前毛利率、坏账、营运资金或套保桥接
        - 估值时不要假设软件式利润率或低信用暴露。
      - - 竞争趋同
        - 对手匹配 Grid Rewards 经济性或设备广度的速度快过 Tibber 拉开差异
        - 多个欧洲对手展示等价电价、充电和 VPP 功能，看不到清晰 Tibber 护城河
        - 将投资逻辑从品类赢家下调为拥挤赛道里的一个合格运营商。
      - - 市场准入脆弱
        - 交易所或电网服务参与规则明显收紧
        - 国家级准入或支付经济性恶化，足以压低客户节省或 VPP 回报
        - 在市场准入稳定前，按更慢增长和更高流失处理。
      - - 执行超载
        - 设备广度扩张时，自动化质量走弱
        - Tibber 增加设备和市场时，投诉率、集成失败或控制回路错误上升
        - 除非运营指标证明扩张没有伤害客户信任，否则降低确信度。
    notes: 这些放弃标准用于在尽调或后续刷新中监控，而不是制造没有可衡量触发点的戏剧性判断。
