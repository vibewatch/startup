  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >-
              核心做多逻辑是，Tibber 不是停留在幻灯片上的能源 app。已抓取记录显示：公司有真实的数字化零售和家庭能源控制产品，灵活性层已延伸到电网平衡，并有可衡量的运营证明。Tibber 自家页面围绕动态定价、app
              主导的家庭控制和 Grid Rewards 来定义产品。独立和合作伙伴来源进一步补强：AWS 称，其已在挪威、瑞典和德国供应家庭用户，平均节省约 20%；Summa 披露 2025 年收入
              €68m、北欧盈利能力更强、VPP 容量 33m kWh、智能充电会话 27m 次。Atlar 给出最强的规模信号：四个国家超过 100
              万用户。上述组合支撑的是一条绑定市场、产品、客户和执行的投资逻辑，而不是纯气候品牌叙事。反面论点是估值，不是存在性。本章直接审阅的公开页面没有披露传闻中的 2025
              年融资、确切估值、股权结构条款、NRR、毛利率或现金消耗。更广的提示叙事提到八国版图，但抓取到的公开记录只直接佐证四国运营或用户。换句话说，Tibber 值得关注，但后期溢价仍要靠证据挣出来，不能靠热度。
