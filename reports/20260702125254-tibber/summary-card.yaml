  topStrengths:
    - >-
      Strongly differentiated consumer proposition built around dynamic pricing, smart charging, and connected-home
      energy control rather than pure commodity retail.
    - >-
      Credible VPP and smart-charging traction signals in 2025, including 33 million kWh VPP size and 27 million
      smart-charging sessions.
    - >-
      Multi-country operating footprint and a visible integration ecosystem spanning app stores, Home Assistant,
      installers, and device partners.
    - >-
      Reputable investors and financing history show that sophisticated backers have repeatedly funded the category
      thesis.
  topRisks:
    - >-
      Public financial disclosure is too thin to validate current revenue, gross margin, working-capital drag, or debt
