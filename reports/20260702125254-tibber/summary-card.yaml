    - Public funding and valuation datasets conflict materially, which makes entry-price discipline difficult.
    - Customer-service, hardware, and integration complaints show that service reliability is not yet a solved problem.
    - >-
      Regulatory changes in electricity pricing, grid access, privacy, and cybersecurity can directly affect
      monetization and compliance costs.
  unresolvedGaps:
