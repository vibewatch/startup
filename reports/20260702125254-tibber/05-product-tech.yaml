- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Digital electricity app
    - Household customer
    - Mature and live across multiple markets
    - Combines tariff access with real-time price and usage control
    - Need retention and daily-active usage disclosure
  - - Smart Charging
    - EV owner
    - Mature with 2.0 refresh
    - Shifts charging to cheap hours and now adds more car-centric controls
    - Need success-rate, coverage by OEM, and support burden
  - - Grid Rewards / VPP
    - EV and battery owner
    - Scaling and expanding in 2025
    - Turns household flexibility into energy-market earnings
    - Need verified participation, payout, and availability metrics
  - - Developer API and integrations
    - DIY users and partner apps
    - Live with GraphQL, tokens, OAuth, and explorer
    - Lets third parties consume price, home, and measurement data
    - Need API uptime, rate-limit, and deprecation policy
  - - Store hardware / power-ups
    - Household and installer
    - Live with chargers, Pulse, Bridge, batteries, and partner devices
    - Extends Tibber from tariff into device control and attachment revenue
    - Need attach-rate, SKU margin, and install-quality data
  notes: Maturity ratings reflect visible public evidence, not unpublished internal KPIs.
