chapter:
  number: 5
  title: Product & Technology
  summary: 'Tibber’s product surface is deeper than a tariff app: the retained evidence shows a connected stack spanning electricity supply, smart charging, Grid Rewards/VPP control, third-party integrations, and developer APIs. The biggest remaining gaps are infrastructure assurance, explicit security posture, and a fuller long-range roadmap.'
sections:
- id: product-definition-and-modules
  title: Product definition and module map
  body: 'Public sources make Tibber look like a workflow product, not just a utility brand. A household can start with digital electricity supply, then use the app for real-time price visibility and usage analytics, attach Pulse or other connected devices, automate EV charging, and eventually participate in Grid Rewards to monetize flexibility. The store, Homevolt references, and charger integrations extend that workflow into hardware and power-ups, while Home Assistant shows the same data can travel outside Tibber’s native interface. That breadth matters because it is the main source of differentiation versus a simple dynamic tariff: Tibber is not only routing electricity, it is trying to own the control layer that decides when, how, and where home-energy devices consume or release value. The module map also suggests Tibber wants to sit above multiple hardware brands and use software, data, and market access as the integrating layer rather than force customers into a closed hardware stack.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
