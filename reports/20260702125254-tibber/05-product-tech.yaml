  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-sla
    missingEvidence: Public uptime SLA, incident-history, status-page, or on-call reliability metrics for the app, APIs, and Grid Rewards control surfaces.
    whyItMatters: Supportive product proof exists, but production reliability remains difficult to diligence without service-level evidence.
    diligencePath: Request status-page history, SLA commitments, postmortem samples, and reliability KPIs for app, API, and control services.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: long-range-roadmap
    missingEvidence: A dated roadmap showing planned module releases across app, API, device control, and VPP programs.
    whyItMatters: Current public roadmap proof is tactical; the absence of a multi-module roadmap makes maturity comparisons less precise.
    diligencePath: Request product roadmap, module owners, release gates, and any deprecation plan for existing APIs or device integrations.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: infra-and-security
    missingEvidence: Public detail on cloud regions, disaster recovery, model governance, pentest cadence, and formal security certifications.
    whyItMatters: The platform is clearly real, but cyber and infrastructure diligence cannot be cleared from marketing, docs, and hiring alone.
    diligencePath: Request architecture diagrams, region topology, DR targets, security certifications, and recent pen-test / audit summaries.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE003
    - TE004
