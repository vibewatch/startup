  summary: Tibber’s visible product stack runs from tariff access and app controls through device orchestration, market services, and external developer surfaces.
  data:
    layers:
    - label: Customer entry and account layer
      detail: Households start with digital electricity supply, account setup, and app-based price visibility.
      modules:
      - Electricity contract
      - Account and billing context
      - Real-time price view
    - label: Home control and automation layer
      detail: App-driven smart charging, heating control, and device-specific power-ups coordinate home behavior.
      modules:
      - Smart Charging
      - Heating control
      - Power-ups
    - label: Device and hardware layer
      detail: Pulse, chargers, batteries, and partner devices supply controllable load and telemetry.
      modules:
      - Tibber Pulse
      - Homevolt / batteries
      - EV chargers
      - Partner devices
    - label: Market and flexibility layer
      detail: Grid Rewards and market integrations turn flexible devices into tradable balancing resources.
      modules:
      - Grid Rewards
      - VPP orchestration
      - Supplier switching
      - Metering ingestion
    - label: Developer and ecosystem layer
      detail: GraphQL APIs, tokens, OAuth clients, and Home Assistant-style integrations expose data beyond the native app.
      modules:
      - GraphQL API
      - OAuth clients
      - Personal tokens
      - Home Assistant integration
  approximationNotes: Internal cloud services and model boundaries are not public; the map covers only the externally visible stack.
