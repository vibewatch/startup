- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Customer app and control layer
    - Expose prices, analytics, automation, and account workflow
    - Mobile/web surfaces and local country operations
    - No public uptime or release-quality metric
  - - Device / charger integration layer
    - Connect EV chargers, Pulse, batteries, and third-party apps
    - Device compatibility, partner APIs, and installer quality
    - Hardware support burden and integration drift
  - - Energy-market delivery layer
    - Handle switching, metering ingestion, market integrations, and lifecycle management
    - Regulatory integrations and country-specific processes
    - High operational complexity across four markets
  - - Trading / VPP orchestration layer
    - Balance the grid and monetize flexibility in real time
    - Algorithms, market access, and flexible device pool
    - Opaque performance and capital / risk controls
  - - Developer and data layer
    - Expose GraphQL, tokens, OAuth, schema reference, and explorer
    - API gateway, auth flows, and data rights controls
    - No public rate-limit, uptime, or DR details
  notes: Architecture is reconstructed from public docs, integrations, filings, and hiring; internal service boundaries are not public.
