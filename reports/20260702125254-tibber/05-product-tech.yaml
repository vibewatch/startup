- id: architecture-and-operating-model
  title: Architecture and operating model
  body: 'The technical surface is specific enough to outline a real operating stack. Developer documentation shows a GraphQL API, token-based authentication, OAuth client management, auto-generated schema reference, and a live explorer, while Home Assistant documents real consumption, price, and production data flows into a third-party energy dashboard. Jobs add the market-side layers that customer pages omit: metering-data ingestion, supplier switching, market integrations, algorithmic trading, and an internal AI platform. The result is an architecture with at least five visible layers: customer app and controls, device and charger integration, energy-market and delivery services, API/data surfaces, and support/compliance operations. What remains hidden are cloud-region choices, disaster recovery, and most internal service boundaries, so the chapter can map the public stack but not certify its internals. In diligence terms, the API and ecosystem evidence is good enough to prove the surface
    exists, but not enough to verify non-functional qualities such as resilience, latency, or deprecation discipline.'
  claimRefs:
