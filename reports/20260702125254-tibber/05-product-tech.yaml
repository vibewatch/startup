- id: deployment-support-and-trust
  title: Deployment, support, and trust controls
  body: Tibber’s support and trust surfaces are meaningful but incomplete. On the positive side, the company publishes compliance, legal, privacy, and Data Act materials; it explains third-party app connectivity and user rights around export, porting, and revoking access; and it acknowledges AI-assisted triage in support channels with an option to move to a human. Home Assistant and the developer portal also show concrete onboarding paths for both hobbyist tokens and distributed OAuth clients. On the weaker side, the public pack does not disclose uptime promises, incident history, security certifications, or cloud-region and recovery details. That means privacy and data-rights controls are visible, but the operational assurance side of trust still needs private diligence. That distinction matters because a customer-facing energy-control product can feel trustworthy on privacy rights and still fail a technical buyer if reliability and security evidence remain implicit.
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE043
  - CE044
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: maturity-differentiation-and-risks
  title: Maturity, differentiation, and risks
  body: 'Maturity is strongest where the evidence converges across official pages, external integrations, and technical docs: dynamic pricing, app controls, smart charging, tokenized developer access, and Grid Rewards participation. The developer changelog also gives a useful hard signal that Tibber is still shipping meaningful market-facing functionality, such as quarter-hourly price support, rather than only restating timeless positioning. The main differentiation is integration density: Tibber combines tariff access, smart-device control, developer APIs, VPP participation, and customer support into one loop. The main risk is that product credibility outruns public assurance. Without published uptime, cyber controls, or a more complete roadmap across every module, investors still need private materials to determine whether the current stack is merely compelling or genuinely defensible at scale. The result is a platform that looks commercially real and technically integrated, but still
    needs private architecture and assurance packets before a buyer can score it as enterprise-grade with confidence. Private reliability evidence is still required.'
