- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Tibber solution
  - Measurable benefit
  - Limitation
  rows:
  - - Buy electricity with better timing signals
    - Monitor prices manually or accept flat utility workflow
    - App exposes real-time prices and analytics
    - Potential lower bill and better consumption timing
    - No public quantified retention by market
  - - Charge EV at lowest-cost hours
    - Set timers manually or charge immediately
    - Smart Charging automates charging around cheap hours
    - Lower charging cost and less manual work
    - OEM compatibility and success-rate data are not public
  - - Monitor home energy in third-party dashboard
    - Use fragmented apps or no live dashboard
    - Home Assistant integration exposes price, cost, and real-time consumption data
    - Cross-platform visibility and automation
    - Depends on tokens, setup effort, and supported devices
  - - Earn from flexibility
    - Household device remains passive load
    - Grid Rewards and VPP coordinate EVs and batteries into balancing markets
    - Savings plus earned rewards
    - Regional availability and payout variability apply
  - - Support installed hardware and partners
    - Rely on generic utility support
    - Customer and B2B support teams cover batteries, Pulse, Bridge, installers
    - Better operational adoption and escalation path
    - No public SLA or CSAT segmentation by product
  notes: Benefits are public or third-party-described and should not be confused with audited outcome metrics.
