  topStrengths:
    - Strongly differentiated consumer proposition built around dynamic pricing, smart charging, and connected-home energy control rather than pure commodity retail.
    - Credible VPP and smart-charging traction signals in 2025, including 33 million kWh VPP size and 27 million smart-charging sessions.
    - Multi-country operating footprint and a visible integration ecosystem spanning app stores, Home Assistant, installers, and device partners.
    - Reputable investors and financing history show that sophisticated backers have repeatedly funded the category thesis.
  topRisks:
    - Public financial disclosure is too thin to validate current revenue, gross margin, working-capital drag, or debt economics.
    - Public funding and valuation datasets conflict materially, which makes entry-price discipline difficult.
    - Customer-service, hardware, and integration complaints show that service reliability is not yet a solved problem.
    - Regulatory changes in electricity pricing, grid access, privacy, and cybersecurity can directly affect monetization and compliance costs.
  unresolvedGaps:
    - Current revenue, margin stack, bad-debt profile, and working-capital intensity by market are still private.
    - Current customer count and employee count are not publicly disclosed in a reliable 2026 source.
    - Latest cap table, preferences, debt covenants, and secondary transaction terms remain outside the public record.
    - The Accumeo secondary valuation is only an indicative market-data point rather than a fully transparent priced financing event.
