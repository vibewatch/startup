companyProfile:
  summary: >-
    Tibber is a Norway-rooted digital electricity and household flexibility company that sells renewable power, app-based energy analytics, device integrations, smart charging, heating optimization, and Grid Rewards / virtual power plant participation through one consumer-facing platform. Its public materials consistently position the business as an alternative to legacy utilities that profit from higher consumption. The strongest public operating signals now come from VPP size, smart-charging session growth, and a broad integration ecosystem rather than from traditional financial disclosure.
  foundedDate: '2016-01-01'
  founders:
    - name: Edgeir Vårdal Aksnes
      role: Co-founder & CEO
      background: Co-founded Tibber after working in the energy sector and remains the main public commercial spokesperson.
      claimRefs: [CO004, CO005]
    - name: Daniel Lindén
      role: Co-founder
      background: Co-founded Tibber after prior energy-industry experience and remains central to the product and mission narrative.
      claimRefs: [CO004, CO005]
  foundingLocation: Førde, Norway
  headquarters: Førde, Norway
  productSummary: >-
    Consumer electricity contract, mobile app, smart-home integrations, Tibber Pulse meter hardware, EV smart charging, heat-control workflows, and Grid Rewards / virtual power plant participation that monetizes flexible household loads.
  customerFocus: European residential electricity customers, especially homes with EVs, heat pumps, batteries, solar, or other flexible connected devices.
  businessModel: >-
    Pass-through renewable electricity retail plus software-led optimization, fixed or subscription-like service fees, smart-device commerce, and revenue participation from flexibility and balancing workflows.
  stage: Late-stage private energy platform
  fundingStatus: >-
    Clean public equity anchor is the $100 million Series C led by Summa Equity in 2022; later public databases also report a March 2024 DNB line of credit and extension financing, taking total raised estimates to a conflicting $177 million-$375.62 million range.
  disclosureProfile: private-undisclosed
  claimRefs: [CO005, CO006, CO014, CO028, CO032, CO033, CV049]
