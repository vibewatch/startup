- id: founders-leadership-and-governance
  title: Founders, leadership, and governance controls
  body: 'The founders remain central to the public story. Tibber still leads with Daniel Lindén and Edgeir Vårdal Aksnes on the about page, and the underlying origin narrative is coherent across official and third-party sources: both founders came out of the energy sector and built Tibber around the idea that lower household consumption should be a profit center for the customer rather than a revenue leak for the supplier. Public visibility beyond the founders is much thinner. The Company Check surfaces a handful of named executives and a chair, but the retained official cache does not provide a current public board page, committee roster, or detailed biographies for the broader control layer. Governance controls are nonetheless visible. Tibber publishes a whistleblowing program, states that a legal-chaired committee handles serious reports, and has a May 2024 Supplier Code of Conduct that explicitly covers human rights, anti-corruption, cyber security, and environmental reporting. That
    is enough to show formal governance plumbing, but not enough to fully underwrite board depth or succession resilience. Key-person dependence therefore still looks meaningful in the public record.'
  claimRefs:
  - CO004
  - CO005
  - CO025
  - CO026
  - CO027
  - CO036
  - CO037
  tableRefs:
  - TO002
- id: capital-base-and-stakeholders
  title: Funding history, investor map, and conflicting third-party records
  body: 'Tibber has a credible public funding story, but not a perfectly reconciled one. The cleanest official checkpoint is the $100 million Series C described by Balderton, with Summa Equity leading and Balderton, Eight Roads, and Schibsted Ventures continuing. Historical media coverage adds earlier capital signals, including a Series A path and Balderton''s own note that it first invested in November 2020. Beyond that, the databases diverge. The Company Check says Tibber has raised $177 million across four rounds and labels the latest round a March 2022 Series C. CB Insights instead shows a much larger $375.62 million total, including a March 2024 line of credit and a same-day Series C-III entry. Those records may reflect differing treatment of debt, secondary liquidity, venture extensions, and later structured financing, but the retained cache does not reconcile them. The investor and stakeholder picture is clearer than the exact cap table: Summa, Balderton, Eight Roads, Schibsted, Nordea,
    and possibly DNB all matter economically, while Tibber''s affiliate structure means local operating entities also matter for market execution.'
  claimRefs:
  - CO013
  - CO014
  - CO020
  - CO023
  - CO028
  - CO029
  - CO031
  tableRefs:
  - TO003
- id: milestones-scale-and-visible-risks
  title: Milestones, scale signals, and visible risks
  body: 'Tibber''s public milestone record supports a company that moved from a 2016 founding story to a much larger 2025-2026 VPP and smart-energy narrative. Historical scale anchors are strong enough to show real adoption: AWS cites 33 billion IoT messages in May 2021, Balderton says subscriptions expanded from 120,000 to over 400,000 during 2021, and Summa says the VPP reached 33 million kWh in 2025 with 27 million smart-charging sessions. At the same time, public disclosure is selective. The careers page hides current employee and customer counts behind approximate placeholders, and the best retained staffing figure is still The Company Check''s 61 employees at the end of 2022. The main adverse evidence is also consumer-facing rather than regulatory. Trustpilot still shows a respectable overall rating, but the detailed reviews point to support delays, device failures, and billing or meter-settlement friction. Those are not thesis-breaking on their own, yet they matter because Tibber''s
    promise depends on reliable automation, responsive support, and enough customer trust to hand the company control over charging, heating, and home batteries.'
