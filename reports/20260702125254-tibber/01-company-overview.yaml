company:
  name: Tibber
chapter:
  number: 1
  title: Company Overview
  summary: 'Tibber is a Norway-rooted, app-led energy retailer and household flexibility platform built around lower-consumption incentives rather than utility markups. Public sources clearly confirm the founders, legal parent, multi-country affiliate footprint, and a $100 million Series C in 2022, but they do not cleanly reconcile later debt or extension financing: vendor databases diverge from $177 million to $375.62 million of total raised. The best 2025-2026 scale signals now come from VPP, smart-charging, and review data rather than from a current public employee or revenue fact sheet.'
sections:
- id: identity-and-legal-footprint
  title: Identity, legal seat, and business model
  body: 'Tibber presents itself in 2026 as a digital electricity supplier that wraps retail power, automation, smart-home controls, and bill reduction into one app-led consumer proposition. The homepage, about page, and careers surface are all consistent on the strategic direction: Tibber is not trying to look like a conventional commodity utility, but like a software-mediated household energy operating system. That positioning matters because the company claims to align incentives differently from incumbents. Official and partner sources repeatedly say Tibber does not try to earn more by pushing higher electricity consumption, and AWS describes the historical commercial model as a flat monthly fee plus energy sold at purchase price. The legal structure is more nuanced than the consumer branding. Tibber AS is the Norwegian parent with a registered office in Førde, while the privacy notice lists affiliate operating companies for Norway, Sweden, Germany, and the Netherlands. Third-party profiles
    still point to Stockholm as the headquarters location, so the cleaner interpretation is that Tibber has a Norwegian legal seat with a Sweden-heavy commercial identity and a multi-country operating footprint.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO006
  - CO007
