schemaVersion: report-v2
artifact: market-analysis
slug: tibber
runDate: '2026-07-02'
company:
  name: Tibber
chapter:
  number: 2
  title: Market Analysis
  summary: 'Tibber operates in a hybrid market where residential electricity retail, home-energy software, and household flexibility monetization converge. Public evidence is strongest on constrained lenses rather than one clean TAM headline: Nord Pool alone reports about 500 TWh of annual day-ahead trading, EHPA says Europe now has roughly 28 million installed heat pumps, and rival platforms such as 1KOMMA5 and Greenely show household flexibility can already create grid-relevant capacity and consumer payouts. The market is growing because electrification and congestion increase the value of flexible homes, but the practical SAM is still gated by smart meters, compatible assets, localized contracts, and unresolved take-rate economics.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: 'Tibber’s market is not the whole electricity system and it is not just a commodity power contract. The evidence points to a narrower category: consumer electricity retail that uses software, interval pricing, and connected devices to turn the home into a flexible node. Tibber’s own Grid Rewards and energy-market materials put EVs and batteries at the center of the value proposition, while local terms pages show that electricity supply and VPP participation are localized country by country. That means the included spend is the household bill plus software-led savings or earnings from load shifting, smart charging, heating control, battery optimization, and balancing services. Excluded spend includes conventional fixed-price retail, households without interval-meter capability, and hardware that never connects into an orchestration layer. The most relevant substitutes are not legacy utilities alone; they are digital-first tariffs and device-led energy apps that teach households to
    optimize timing rather than simply switch supplier.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM032
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing the market with public, evidence-constrained lenses
  body: 'Public evidence is stronger on market infrastructure, installed asset bases, and observed flexibility pools than on a single clean third-party TAM for Tibber. The broadest lens is the exchange layer: Nord Pool alone says around 500 TWh is traded annually across 15 countries and 21 bidding zones, while EPEX continues to expand pan-European spot trading. The more actionable adoption lens is electrified-home hardware. EHPA says 2.62 million residential heat pumps were sold across 16 European countries in 2025 and the installed base reached around 28 million, which is a far better proxy for flexible home load than generic power-market revenue. The most concrete near-term SOM lens is already activated flexibility: Tibber talks about hundreds of thousands of devices inside its VPP, while 1KOMMA5 says it has reached 1 GW of shiftable capacity. Public consumer economics from Greenely and Frank show the value pool can include ancillary-service payouts and recurring bill savings, not only
    energy resale.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM013
  - CM016
  - CM017
  - CM019
  - CM020
  - CM021
  - CM023
