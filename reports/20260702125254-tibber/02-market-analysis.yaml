- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Tibber
  - Diligence ask
  rows:
  - - Building, transport, and industry electrification
    - Driver
    - Now through 2030
    - Expands electricity intensity and need for consumer-side orchestration
    - Quantify which electrification loads Tibber captures by country
  - - Demand response and storage need
    - Driver
    - Now through 2030
    - Makes flexible households more valuable to grids and retailers
    - Measure how much flexible capacity Tibber can reliably dispatch
  - - Heat-pump installed-base growth
    - Driver
    - Now through 2026+
    - Adds large, shiftable residential loads
    - Break out Tibber-compatible OEM and thermostat coverage
  - - Utility interest in batteries and bidirectional charging
    - Driver
    - Now through 2026+
    - Supports partnerships and future market access for household flexibility
    - Identify which utilities already accept Tibber-like aggregators
  - - Negative prices and congestion
    - Driver
    - Current
    - Increases consumer willingness to automate charging, heating, and export
    - Model country-specific value under local congestion regimes
  - - Smart-meter and hardware prerequisites
    - Constraint
    - Current
    - Shrinks real SAM versus headline household count
    - Measure what share of target homes already meet prerequisites
  - - Settlement-cadence fragmentation
    - Constraint
    - Current
    - Forces localized product, pricing, and operational design
    - Map cost to support 15-min, 30-min, and hourly markets
  - - Policy distortion toward centralized gas or capacity builds
    - Constraint
    - 2025-2030
    - Could reduce the relative value of distributed flexibility
    - Track market-design reforms and capacity-support schemes
  - - Consumer support / trust variability
    - Constraint
    - Current
    - Can slow mass-market adoption and referral efficiency
    - Request churn, NPS, and support-ticket benchmarks
  - - Opaque revenue-share economics
    - Constraint
    - Current
    - Makes it hard to translate consumer payouts into Tibber margins
    - Obtain VPP revenue waterfall by country and asset type
  notes: Rows combine macro drivers with practical gating items because Tibber’s opportunity is shaped as much by localized market design as by broad electrification.
