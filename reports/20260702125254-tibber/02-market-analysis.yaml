  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: installed-base-opacity
    missingEvidence: Country-by-country share of Tibber customers with EVs, batteries, chargers, or heat pumps connected to the platform.
    whyItMatters: Asset penetration determines the real near-term SOM and the fraction of customers who can move from dynamic pricing into higher-value flexibility products.
    diligencePath: Request an internal cohort cut by country and asset type, or a management KPI deck that breaks out connected-device penetration.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: revenue-share-opacity
    missingEvidence: Tibber’s retained take rate and gross-margin split for Grid Rewards or other VPP revenue streams.
    whyItMatters: Without the platform take rate, public consumer earning examples do not translate into Tibber contribution margin or LTV.
    diligencePath: Ask management for a Grid Rewards revenue waterfall showing gross market revenue, customer payout, partner fees, and Tibber net take.
    relatedQuestionRefs:
    - QM026
  - type: missing-source
    severity: material
    topic: country-unit-economics
    missingEvidence: A comparable public table of per-country settlement cadence, ancillary-market access, network tariffs, and localized gross-margin implications.
    whyItMatters: Tibber sells into multiple power-market designs, so country-level unit economics may diverge even if the app layer looks uniform.
    diligencePath: Build a country-by-country operating model using supplier licenses, exchange access, balancing-market eligibility, and local energy-tax schedules.
    relatedQuestionRefs:
    - QM027
