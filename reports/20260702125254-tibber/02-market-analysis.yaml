  - FM004
- id: drivers
  title: Growth drivers behind category expansion
  body: 'The macro case for Tibber’s category is that electrification keeps raising both electricity demand and the need for flexibility. IEA explicitly connects rising demand to the electrification of buildings, transport, and industry, then separately says systems need more demand response and batteries to manage a more complex supply mix. Business Norway describes the household-level version of that same problem: EV charging peaks and intermittent renewables make grid capacity more difficult to manage under traditional supply models. Utility and infrastructure players support the same direction of travel. E.ON frames battery integration and bidirectional charging as important levers for affordability and security, while Landis+Gyr emphasizes the scale of smart-meter and grid-edge data networks needed to operate modern systems. In other words, Tibber benefits from a structural market shift in which households are increasingly treated as flexible energy actors rather than passive bill payers.'
  claimRefs:
  - CM014
  - CM015
  - CM018
  - CM033
  - CM034
  - CM044
  tableRefs:
  - TM004
- id: constraints-gaps
  title: Constraints, fragmentation, and unresolved diligence questions
  body: 'The same evidence also shows why this is not yet a frictionless mass-market category. aWATTar’s network-tariff page requires a smart meter with quarter-hour readout, and Greenely still sells a dedicated realtime-meter device for some customers, so metering and hardware remain gating items. Market design is fragmented too: the public competitive set spans 15-minute, 30-minute, and hourly settlement rhythms, and Tibber’s own contract stack is localized country by country rather than standardized across Europe. Grid stress creates opportunity but also complexity: Frank openly markets congestion relief and negative-price avoidance, which means customer value increasingly depends on local market rules and not just an elegant app. Finally, the public record still does not say what fraction of Tibber customers own compatible assets or how Grid Rewards revenue is shared with households. Those missing unit-economics facts are the main diligence blockers before converting category momentum
    into a sharper valuation view.'
