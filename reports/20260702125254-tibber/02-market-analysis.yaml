figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Public sizing is most reliable when layered from wholesale infrastructure down to electrified-home assets and already-activated household flexibility pools.
  approximationNotes: This is a constrained market lens, not a classical revenue TAM; each layer uses a different but source-backed public proxy because no reviewed external source isolates a clean Tibber TAM.
  data:
    items:
    - label: Wholesale price-formation layer
      value: Nord Pool ~500 TWh annually + EPEX pan-European spot markets
      detail: Dynamic consumer tariffs depend on deep exchange-based price discovery and localized settlement infrastructure.
    - label: Electrified-home asset layer
      value: ~28M installed European heat pumps after 2025 sales growth
      detail: Installed flexible home assets are a better proxy for Tibber’s practical SAM than total household count.
    - label: Activated residential flexibility layer
      value: Tibber hundreds of thousands of devices; 1KOMMA5 1 GW shiftable capacity
      detail: These are the clearest public signs that household flexibility is already commercially relevant.
