tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Tibber
  rows:
  - - Dynamic residential electricity retail
    - Spot-linked household energy charges, subscription/app fee, bill optimization
    - Fixed-price commodity supply with no interval logic
    - Household payer and user are usually the same person
    - Core entry point for Tibber and most digital competitors
  - - Home energy management / automation
    - Smart charging, heating control, battery dispatch, consumption insights
    - Standalone hardware sold without software control
    - Household payer; power user or app-first homeowner
    - Core software layer that raises switching costs beyond supplier choice
  - - Residential flexibility / VPP monetization
    - Ancillary-service payouts, congestion relief, balancing-market participation
    - Utility-scale batteries and industrial demand response outside the home
    - Household owner participates through an aggregator/app
    - High-value adjacency that can lift LTV beyond energy resale
  - - Full-stack home electrification bundles
    - Financed solar, batteries, heat pumps, and bundled intelligence
    - Unconnected hardware-only sales
    - Homeowner making a capex decision
    - Important adjacent bundle that 1KOMMA5 and Enpal use to compete with app-only offers
  - - Status-quo supply
    - Flat tariffs and manual bill payment
    - Automation and grid-services upside
    - General household
    - Main substitute Tibber is trying to displace
  - - Unconnected households
    - Commodity energy only
    - Any automation or flexibility monetization
    - General household without interval metering or compatible devices
    - Large theoretical TAM but weak near-term SAM
  notes: Boundary is defined from product and competitor pages rather than a single analyst taxonomy; Tibber sits where digital retail, device orchestration, and residential flexibility overlap.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM032
- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Lens
  - Published / observed value
  - Geography
  - What it measures
  - Why it matters
  - Limitation
  rows:
  - - Nord Pool day-ahead throughput
    - ~500 TWh annually
    - 15 countries / 21 bidding zones
    - Observed exchange liquidity behind hourly consumer pass-through offers
    - Best public proxy for the price-formation layer Tibber depends on
    - Exchange throughput is not Tibber revenue or household TAM
  - - Nord Pool participation depth
    - 300+ buyers/sellers; 2,000+ daily orders
    - Nord Pool footprint
    - Breadth of counterparties and auction activity
    - Shows consumer dynamic tariffs rest on a deep wholesale market
    - Liquidity does not reveal retailer margins or household adoption
  - - EPEX pan-European spot layer
    - Pan-European exchange across electricity value chain
    - Europe
    - Spot-market infrastructure and expansion into Baltic markets
    - Confirms Tibber-like products can exist across multiple local power markets
    - No simple public retail TAM number
  - - EHPA annual sales lens
    - 2.62M residential heat pumps sold in 2025
    - 16 European countries
    - New flexible household loads added in one year
    - Good proxy for expansion of automatable demand
    - Heat-pump owners are not automatically Tibber customers
  - - EHPA installed-base lens
    - ~28M installed heat pumps
    - Europe
    - Current stock of electrified thermal assets
    - Better SAM proxy than generic household counts
    - Omits EVs, batteries, and chargers
  - - 1KOMMA5 VPP scale
    - 1 GW shiftable capacity
    - Germany / connected customer base
    - Observed size of a rival residential flexibility pool
    - Shows household flexibility can scale into utility-relevant capacity
    - Competitor self-report, not independent audit
  - - Tibber VPP scale lens
    - Hundreds of thousands of devices
    - Tibber footprint
    - Observed scale of Tibber’s connected flexibility pool
    - Best public sign that Tibber is already beyond concept stage
    - Device count is not the same as active paying households
  - - Consumer value examples
    - SEK 19,720 2024 battery revenue; EUR 209/year smart-heating savings
    - Sweden / Netherlands
    - Illustrative household economics from public competitor pages
    - Shows why consumers may adopt beyond ideology
    - Vendor examples are not standardized or independently audited
  notes: This table uses infrastructure, installed-base, and observed-flexibility lenses instead of forcing one unsupported third-party TAM headline.
