  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: security-disclosure
    missingEvidence: Current certifications, breach history, incident rates, and audit outcomes for Tibber’s real-time control stack.
    whyItMatters: A business that controls household devices and monetizes grid services needs stronger trust evidence than policy text alone.
    diligencePath: Request current ISO/SOC-style artifacts, incident logs, and board-level security reporting from management.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-source
    severity: material
    topic: financial-model
    missingEvidence: A current bridge for gross margin, bad debt, hedging, working capital, and remediation costs inside Tibber’s electricity-supply model.
    whyItMatters: Without it, investors cannot tell whether VPP and automation value is being offset by hidden retail-economics risk.
    diligencePath: Request country-level unit economics and working-capital KPIs for supply and flexibility products.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Quantified vendor concentration and fallback plans across cloud, metering, charger, battery, and home-automation dependencies.
    whyItMatters: High dependency density can turn a product feature into a margin or reliability shock if one critical layer fails.
    diligencePath: Obtain a dependency map with spend, volume, outage fallback, and contract-tenure data for critical external platforms.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: customer-trust
    missingEvidence: Complaint-rate, refund, and customer-remediation metrics for Grid Rewards and other automated controls.
    whyItMatters: Review surfaces are too noisy to substitute for actual retention and support-quality data.
    diligencePath: Ask for program-level complaint rates, support SLAs, and net savings outcomes by geography.
    relatedQuestionRefs:
