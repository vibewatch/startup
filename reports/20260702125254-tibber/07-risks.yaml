  - diligence path
  rows:
  - - Data-rights and privacy compliance obligations
    - EU / Tibber operating markets
    - Tibber publishes privacy, Data Act, and AI-use policies, but public evidence stops at policy text rather than independent audits
    - medium
    - high
    - Customer rights and terms are documented in public legal pages
    - medium-high
    - Request current DPA terms, external privacy/security audits, and any regulator correspondence on connected-device data handling.
  - - Supplier-code and fair-supply-chain execution
    - Global supplier relationships
    - Tibber makes the Supplier Code part of supplier agreements, but public evidence does not show supplier-audit coverage or remediation history
    - medium
    - moderate
    - Supplier standards are explicit and linked from compliance pages
    - medium
    - Review supplier-audit cadence, violation reporting, and high-risk supplier concentration by category.
  - - Whistleblowing and ethics process effectiveness
    - Company-wide
    - Tibber publishes an ethics and whistleblowing page, but public sources do not quantify usage, substantiation rates, or escalation outcomes
    - low-medium
    - moderate
    - Public reporting channel exists and is aligned to ethical principles
    - medium
    - Request policy owner, hotline workflow, annual case counts, and board-level oversight evidence.
  - - Power-market and policy design volatility
    - Nordic / European flexibility markets
    - Dynamic pricing and grid-service economics depend on exchange rules, grid-operator procurement, and contested policy design
    - medium-high
    - high
    - Tibber diversifies across multiple energy-market use cases and geographies
    - high
    - Map each grid-service product to market rules, subsidy exposure, and jurisdiction-specific regulatory change triggers.
  notes: Rows are ordered by residual severity using retained public evidence plus explicit diligence gaps; this is a partial risk register, not an exhaustive litigation schedule.
