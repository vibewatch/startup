- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Concentration / retention risk
  - Impact
  - Diligence path
  rows:
  - - Grid Rewards for EV and battery owners
    - Only a subset of households qualifies
    - Upside depends on attached-device penetration, not the whole retail base
    - Request cohort counts for EV, battery, and active Grid Rewards users
  - - Home Assistant and API-linked power users
    - Retention may be strong for technical users but cohort size is unknown
    - Could create a sticky premium cohort that is invisible in public numbers
    - Ask for MAU and active API-token counts
  - - Installer-assisted hardware onboarding
    - Third-party installation quality may create support burden
    - Battery and hardware complaints can spill into brand trust
    - Request install completion, defect, and warranty metrics
  - - Cross-country retail footprint
    - Country mix is undisclosed
    - One market may dominate growth or support load without public visibility
    - Request active customers, churn, and gross margin by country
  - - Service and integration reliability
    - Complex device journeys create more friction than tariff-only journeys
    - Support intensity can erode retention in valuable cohorts
    - Request support backlog, first-response time, and incident resolution by integration type
  - - Lack of public retention disclosure
    - No NRR, GRR, churn, or contract-length data
    - Investors cannot distinguish broad adoption from durable economics
    - Request cohort retention bridge by segment and device stack
  notes: The central risk is not absence of customers but absence of disclosure about which cohorts are most profitable, most durable, and most support-intensive.
