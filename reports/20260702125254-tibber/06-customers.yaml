  - - App-store users
    - Mobile-app households
    - Check prices, connect devices, and manage electricity use
    - Production-like
    - US and Finland storefront ratings are positive and current
    - Ratings are small versus the full retail base
  - - Installer-app users
    - Hardware-install cohort
    - Set up installations, configure products, and hand over homes to customers
    - Production-like
    - Google Play description and AppBrain download history imply an active install base
    - No public data on completion, defects, or post-install retention
  - - Grid Rewards EV owners
    - EV households
    - Leave the car plugged in so Tibber can optimize charging and earn flexibility rewards
    - Production-like
    - Multiple official pages explain operational behavior and reward mechanics
    - No public participation rate or average earnings per customer
  - - Solar and battery households
    - Prosumer homes
    - Track production, profits, and combine storage or solar with smart charging
    - Production-like
    - Home Assistant docs plus positive 2026 Trustpilot comments show this cohort exists
    - Public proof is anecdotal rather than enumerated by market
  notes: Because Tibber is consumer-facing, the best named proof comes from repeatable proof surfaces and cohorts rather than from enterprise logos or tender disclosures.
