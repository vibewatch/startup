    - No public count of active Home Assistant-linked homes
  - - Trustpilot reviewer base
    - Retail electricity customers
    - Tariff usage, Pulse, smart charging, billing, and service interactions
    - Production-like
    - 4,766 reviews and detailed 2026 examples show real live usage rather than hypothetical interest
