tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale evidence
  - Revenue / strategic value
  - Gap
  rows:
  - - Dynamic-tariff households
    - Household bill payer / app user / same payer
    - Follow day-ahead or quarter-hour prices and cut bills
    - Official app-store and about-us messaging across Norway, Sweden, and Germany
    - Core acquisition wedge into retail power supply
    - No public active-customer count by country
  - - EV owners
    - Household EV owner / driver / same payer
    - Smart charging and Grid Rewards earnings
    - Grid Rewards pages plus AWS task automation examples
    - High-likelihood upsell into automation and flexibility revenue
    - No public attach rate for EV-linked accounts
  - - Heat-pump households
    - Home owner / climate-control user / same payer
    - Shift heating to cheaper or off-peak hours
    - Official about-us and sustainability pages emphasize heating control
    - Broadens value beyond vehicle charging
    - No usage-share disclosure
  - - Solar and battery homes
    - Home owner / prosumer / same payer
    - Track production, profit, and flexibility participation
    - Home Assistant production stats, Trustpilot solar-and-battery usage comments, app-store device merchandising
    - Adds higher-value hardware and flexibility surfaces
    - No public penetration by market or device brand
  - - Home-automation power users
    - Technical household / dashboard user / same payer
    - Pipe Tibber data into Home Assistant dashboards and automations
    - Home Assistant docs and GitHub repo expose MQTT, dashboards, and API-linked usage
    - Deepens retention through workflow embedding
    - Likely a minority cohort but no public share is given
  - - Installer-assisted hardware customers
    - Household buyer / installer / same payer
    - Professional setup and handover of Pulse or compatible hardware
    - Google Play installer page and AppBrain download history
    - Supports hardware growth without purely self-serve onboarding
    - No public conversion from installer jobs to long-term customers
  notes: The visible mix is retail-B2C, but the highest-value cohorts are the device-rich and automation-friendly households rather than the average passive utility customer.
