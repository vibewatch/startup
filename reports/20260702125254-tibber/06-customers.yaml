  evidenceGaps:
  - type: missing-source
    severity: material
    topic: active-customer-count-by-country
    missingEvidence: A country-level 2026 table of active households and recent net additions.
    whyItMatters: Without country counts, investors cannot tell whether Tibber is broadly diversified or effectively dependent on one core retail market.
    diligencePath: Request monthly active customer counts, net adds, and gross adds for Germany, Norway, and Sweden from management.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: device-attach-rates
    missingEvidence: Attach rates for Pulse, EV smart charging, Grid Rewards, Home Assistant, and installer-assisted products.
    whyItMatters: The upside case depends on a deeper device-and-software relationship than a plain tariff contract, so attach rates are central to expansion economics.
    diligencePath: Ask management for cohort penetration by device family and for the share of customers with at least one connected asset.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU001
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-and-support-sla
    missingEvidence: Gross churn, renewal, contract length, first-response time, and complaint-resolution SLA by cohort.
    whyItMatters: Review surfaces show both strong utility and real support friction, but public proxies cannot tell whether that friction is eroding durable customer value.
    diligencePath: Request retention and service KPI dashboards segmented by country, hardware cohort, and tariff-only versus connected-home users.
    relatedQuestionRefs:
    - QU021
    - QU027
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: country-and-cohort-concentration
    missingEvidence: Revenue or gross-margin concentration by country, hardware cohort, and support-intensive product line.
    whyItMatters: Tibber’s public file suggests a richer but potentially more complex customer mix than a standard utility, which could hide concentration or support-cost concentration.
    diligencePath: Request a customer and revenue bridge by geography, hardware attachment, and flexibility-product participation.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-household-proof
    missingEvidence: An auditable roster of representative customer cohorts with actual count ranges and refresh dates.
    whyItMatters: The chapter can prove real usage through reviews and integrations, but not through a direct enumerated customer roster like an enterprise SaaS reference list.
    diligencePath: Ask management for anonymized cohort counts and example households by market, device stack, and tenure band.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU003
  - type: stale
    severity: minor
    topic: historical-growth-bridge
    missingEvidence: A current bridge from historical AWS growth signals to 2026 customer and device metrics.
    whyItMatters: The AWS case study is useful proof that Tibber once scaled quickly, but it does not by itself prove the same pace or mix today.
    diligencePath: Request a 2024-2026 monthly trend for active customers, connected devices, and installer completions.
    relatedQuestionRefs:
    - QU007
    relatedTableRefs:
    - TU002
