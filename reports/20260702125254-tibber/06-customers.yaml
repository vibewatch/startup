- id: satisfaction-retention-and-support-friction
  title: Satisfaction, retention proxies, and support friction
  body: 'The customer-quality signal is mixed rather than uniformly strong. Ratings and review volume show that Tibber is not a ghost product: the App Store surfaces are positive, Trustpilot volume is large, and Entireweb did not show a live outage on the run date. Yet the adverse layer is meaningful. Trustpilot complaints point to slow support, battery-install responsibility gaps, Pulse disconnections, and confusion when 15-minute billing depends on external metering processes. The Home Assistant issue log adds a sharper technical complaint in 2026, with realtime entities reportedly stopping after about 24 hours and logging repeated Invalid token errors. Tibber’s own status page confirms that at least one important ecosystem edge case—MyEnergi and Zappi—remained limited deep into 2026. That combination suggests a customer base with genuine product value, but one that can become support-intensive when the experience crosses from simple tariff switching into hardware, integrations, and grid-service
    automation. Public retention math, however, is still missing.'
