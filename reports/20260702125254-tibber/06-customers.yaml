- id: expansion-and-concentration-risks
  title: Expansion loops and concentration risks
  body: Tibber’s expansion thesis depends on taking a household from a dynamic tariff into a deeper software-and-device relationship. Grid Rewards is explicitly limited to EV and battery owners, Home Assistant and app-store copy point toward high-engagement automation users, and the 8-years article signals a broader Power-Up model that can keep widening wallet share. That is attractive, but it is also where competition is sharpest. Greenely, Frank Energie, aWATTar and Octopus all show strong customer messaging around dynamic pricing, real-time visibility, device control, or sheer scale. The competitive set therefore makes Tibber’s strongest cohorts—EV, battery, real-time-meter, and automation-heavy households—the same cohorts most exposed to feature comparison and switching pressure. Concentration is the other unresolved risk. Public sources do not show whether Tibber’s economics lean heavily on one country, one hardware-heavy segment, or one group of support-intensive users. That gap matters
    because the public complaints already cluster around exactly those more complex, higher-touch journeys.
