chapter:
  number: 6
  title: Customers
  summary: 'Tibber’s public customer proof is strongest on engaged-household behavior rather than named-account disclosure: reviews, app stores, installer tooling, Home Assistant integrations, and AWS workflow descriptions all point to real usage across Germany, Norway, and Sweden. The chapter shows a credible expansion path from tariff to devices and flexibility, but retention, attach-rate, country mix, and concentration data remain undisclosed, and the clearest adverse signals cluster around support-heavy hardware and integration journeys.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'Tibber’s public customer file reads less like a traditional utility and more like an app-first household automation business. The visible buyer is still the retail bill payer, but the highest-value user is usually a consumer willing to connect devices, follow price signals, and let software automate timing decisions. Official surfaces repeatedly point to the same cohorts: dynamic-tariff households, EV owners, heat-pump households, solar and battery homes, and technically engaged users who want real-time electricity data inside Home Assistant or similar dashboards. The company also appears to have an installer-assisted segment now that Tibber maintains a dedicated installer app for setup and handover of compatible products. Geography is broad enough to matter, with independent sources still tying the retail business to Germany, Norway, and Sweden. What is not public is the country-level split, attach rate by cohort, or how many users stay at the pure tariff layer versus expanding
    into devices, Power-Ups, or flexibility products.'
