- id: adoption-proof-and-usage-depth
  title: Adoption proof and usage depth
  body: Public adoption proof is stronger than named-customer proof. Tibber can point to two independent savings narratives, each saying the average customer saves about 20 percent, and to a historical AWS account that says customer and IoT-device counts once doubled every six months. Marketplace and review surfaces also show real consumer usage rather than a purely aspirational homepage. Trustpilot carries thousands of reviews, the US App Store carries a smaller but still meaningful rating base, and AppBrain plus Google Play confirm that Tibber has built a separate installer workflow for hardware deployments. Product depth also looks real. AWS describes customers using Tibber to make sure an EV is charged by a target time or that a home is warm on arrival, while Home Assistant exposes price, consumption, production, and profit statistics that only matter if users are actively instrumenting the home. This is credible proof of adoption, but it is proof through usage surfaces and integrations
    rather than through named household case studies or audited customer counts.
