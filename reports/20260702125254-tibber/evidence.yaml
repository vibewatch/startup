evidenceGaps:
  - type: missing-source
    severity: minor
    topic: Board composition and committee structure
    missingEvidence: >-
      The retained cache does not include a current official board page, committee charter set, or detailed director
      biographies.
    whyItMatters: >-
      Board depth and committee coverage matter for governance underwriting, especially with a multi-country regulated
      consumer business.
    diligencePath: Request a current board list, committee charters, and short bios for each director.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: Current valuation
    missingEvidence: Retained public sources do not provide a clean, current valuation that can be verified independently in 2026.
    whyItMatters: >-
      Valuation is a headline cover metric and affects the company's current stage framing and capital-markets
      read-through.
    diligencePath: Request the latest primary financing documents, cap table summary, and any board-approved valuation marks.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: Current employee count
    missingEvidence: >-
      The best retained employee figure is a 61-person snapshot from December 2022, while the careers page now hides
      live counts behind approximate placeholders.
    whyItMatters: Headcount is a key scale and cost proxy for productivity, burn, and market-coverage assumptions.
    diligencePath: Request a current employee census by country and function plus the historical roll-forward from 2022.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: Outcome of the 2022 growth plan
    missingEvidence: >-
      The retained cache shows a historical plan to reach ten markets and add roughly 300 hires, but it does not clearly
      document the final outcome of that plan.
    whyItMatters: >-
      It affects how aggressively management executed on prior expansion promises and how to interpret current
      geographic ambition.
    diligencePath: Request a market-launch timeline and historical headcount / market rollout review covering 2022-2025.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: installed-base-opacity
    missingEvidence: >-
      Country-by-country share of Tibber customers with EVs, batteries, chargers, or heat pumps connected to the
      platform.
    whyItMatters: >-
      Asset penetration determines the real near-term SOM and the fraction of customers who can move from dynamic
      pricing into higher-value flexibility products.
    diligencePath: >-
      Request an internal cohort cut by country and asset type, or a management KPI deck that breaks out
      connected-device penetration.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: revenue-share-opacity
    missingEvidence: Tibber’s retained take rate and gross-margin split for Grid Rewards or other VPP revenue streams.
    whyItMatters: >-
      Without the platform take rate, public consumer earning examples do not translate into Tibber contribution margin
      or LTV.
    diligencePath: >-
      Ask management for a Grid Rewards revenue waterfall showing gross market revenue, customer payout, partner fees,
      and Tibber net take.
    relatedQuestionRefs:
      - QM026
  - type: missing-source
    severity: material
    topic: country-unit-economics
    missingEvidence: >-
      A comparable public table of per-country settlement cadence, ancillary-market access, network tariffs, and
      localized gross-margin implications.
    whyItMatters: >-
      Tibber sells into multiple power-market designs, so country-level unit economics may diverge even if the app layer
      looks uniform.
    diligencePath: >-
      Build a country-by-country operating model using supplier licenses, exchange access, balancing-market eligibility,
      and local energy-tax schedules.
    relatedQuestionRefs:
      - QM027
  - type: private-evidence-only
    severity: material
    topic: tibber-moat-metrics
    missingEvidence: >-
      Tibber's retention by connected-device cohort, Grid Rewards participation rate, attach rate for EV or heating
      automation, and contribution margin by feature.
    whyItMatters: >-
      Product pages show possible differentiation, but they do not prove whether the strongest features actually improve
      retention, monetization, or switching costs enough to create a durable moat.
    diligencePath: >-
      Request cohort retention, device attach rate, feature adoption, and gross-margin data segmented by tariff-only
      households versus households using Grid Rewards or connected devices.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: private-peer-scale
    missingEvidence: >-
      Comparable public revenue, funding, and customer metrics for Ostrom, Greenely, Frank, and aWATTar under one time
      frame and methodology.
    whyItMatters: >-
      Without comparable scale fields, Octopus and Enpal dominate the visible distribution signals while several direct
      continental peers remain strategically relevant but numerically opaque.
    diligencePath: >-
      Pull latest financing announcements, annual filings where available, or management-provided customer metrics for
      the continental peer set before using any hard ranking beyond product comparison.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: hardware-attachment-rate
    missingEvidence: >-
      Realized hardware attachment rates, average order values, and attach by market for chargers, batteries, Pulse, and
      Bridge.
    whyItMatters: Without attachment data, the hardware contribution to revenue quality and blended gross profit cannot be sized.
    diligencePath: Request cohort-level store revenue, attach-rate, and gross-margin disclosures by product family and country.
    relatedQuestionRefs:
      - QI014
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, runway, and treasury or hedging policy.
    whyItMatters: >-
      Capital adequacy is the key missing variable for underwriting whether the business can self-fund expansion or
      needs new capital.
    diligencePath: >-
      Request the latest management accounts, treasury deck, and board materials showing cash, burn, and runway under
      base and stress cases.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: financing-obligations
    missingEvidence: >-
      Debt facilities, project-finance commitments, collateral, guarantees, and imbalance or procurement obligations by
      market.
    whyItMatters: >-
      The trading and energy-delivery model could create off-balance-sheet or working-capital needs not visible in
      public coverage.
    diligencePath: Request financing agreements, collateral schedules, and market-operations risk reports for each country entity.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: cac-payback-retention
    missingEvidence: CAC, payback, NRR, churn, repurchase, and channel-level conversion for B2C and B2B motions.
    whyItMatters: >-
      The GTM engine cannot be valued on public evidence alone because recurring economics and channel efficiency are
      undisclosed.
    diligencePath: Request funnel dashboards, cohort retention, blended CAC, payback, and channel P&L by market.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: security-sla
    missingEvidence: >-
      Public uptime SLA, incident-history, status-page, or on-call reliability metrics for the app, APIs, and Grid
      Rewards control surfaces.
    whyItMatters: >-
      Supportive product proof exists, but production reliability remains difficult to diligence without service-level
      evidence.
    diligencePath: >-
      Request status-page history, SLA commitments, postmortem samples, and reliability KPIs for app, API, and control
      services.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: long-range-roadmap
    missingEvidence: A dated roadmap showing planned module releases across app, API, device control, and VPP programs.
    whyItMatters: >-
      Current public roadmap proof is tactical; the absence of a multi-module roadmap makes maturity comparisons less
      precise.
    diligencePath: >-
      Request product roadmap, module owners, release gates, and any deprecation plan for existing APIs or device
      integrations.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: material
    topic: infra-and-security
    missingEvidence: >-
      Public detail on cloud regions, disaster recovery, model governance, pentest cadence, and formal security
      certifications.
    whyItMatters: >-
      The platform is clearly real, but cyber and infrastructure diligence cannot be cleared from marketing, docs, and
      hiring alone.
    diligencePath: >-
      Request architecture diagrams, region topology, DR targets, security certifications, and recent pen-test / audit
      summaries.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE003
      - TE004
  - type: missing-source
    severity: material
    topic: active-customer-count-by-country
    missingEvidence: A country-level 2026 table of active households and recent net additions.
    whyItMatters: >-
      Without country counts, investors cannot tell whether Tibber is broadly diversified or effectively dependent on
      one core retail market.
    diligencePath: Request monthly active customer counts, net adds, and gross adds for Germany, Norway, and Sweden from management.
    relatedQuestionRefs:
      - QU025
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: device-attach-rates
    missingEvidence: Attach rates for Pulse, EV smart charging, Grid Rewards, Home Assistant, and installer-assisted products.
    whyItMatters: >-
      The upside case depends on a deeper device-and-software relationship than a plain tariff contract, so attach rates
      are central to expansion economics.
    diligencePath: >-
      Ask management for cohort penetration by device family and for the share of customers with at least one connected
      asset.
    relatedQuestionRefs:
      - QU026
    relatedTableRefs:
      - TU001
      - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-and-support-sla
    missingEvidence: Gross churn, renewal, contract length, first-response time, and complaint-resolution SLA by cohort.
    whyItMatters: >-
      Review surfaces show both strong utility and real support friction, but public proxies cannot tell whether that
      friction is eroding durable customer value.
    diligencePath: >-
      Request retention and service KPI dashboards segmented by country, hardware cohort, and tariff-only versus
      connected-home users.
    relatedQuestionRefs:
      - QU021
      - QU027
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: country-and-cohort-concentration
    missingEvidence: Revenue or gross-margin concentration by country, hardware cohort, and support-intensive product line.
    whyItMatters: >-
      Tibber’s public file suggests a richer but potentially more complex customer mix than a standard utility, which
      could hide concentration or support-cost concentration.
    diligencePath: Request a customer and revenue bridge by geography, hardware attachment, and flexibility-product participation.
    relatedQuestionRefs:
      - QU028
    relatedTableRefs:
      - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-household-proof
    missingEvidence: An auditable roster of representative customer cohorts with actual count ranges and refresh dates.
    whyItMatters: >-
      The chapter can prove real usage through reviews and integrations, but not through a direct enumerated customer
      roster like an enterprise SaaS reference list.
    diligencePath: Ask management for anonymized cohort counts and example households by market, device stack, and tenure band.
    relatedQuestionRefs:
      - QU022
    relatedTableRefs:
      - TU003
  - type: stale
    severity: minor
    topic: historical-growth-bridge
    missingEvidence: A current bridge from historical AWS growth signals to 2026 customer and device metrics.
    whyItMatters: >-
      The AWS case study is useful proof that Tibber once scaled quickly, but it does not by itself prove the same pace
      or mix today.
    diligencePath: Request a 2024-2026 monthly trend for active customers, connected devices, and installer completions.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU002
  - type: access-blocked
    severity: material
    topic: security-disclosure
    missingEvidence: Current certifications, breach history, incident rates, and audit outcomes for Tibber’s real-time control stack.
    whyItMatters: >-
      A business that controls household devices and monetizes grid services needs stronger trust evidence than policy
      text alone.
    diligencePath: Request current ISO/SOC-style artifacts, incident logs, and board-level security reporting from management.
    relatedQuestionRefs:
      - QR026
    relatedTableRefs:
      - TR001
      - TR002
  - type: missing-source
    severity: material
    topic: financial-model
    missingEvidence: >-
      A current bridge for gross margin, bad debt, hedging, working capital, and remediation costs inside Tibber’s
      electricity-supply model.
    whyItMatters: >-
      Without it, investors cannot tell whether VPP and automation value is being offset by hidden retail-economics
      risk.
    diligencePath: Request country-level unit economics and working-capital KPIs for supply and flexibility products.
    relatedQuestionRefs:
      - QR027
    relatedTableRefs:
      - TR005
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
