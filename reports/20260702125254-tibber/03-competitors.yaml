- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Dynamic pricing leadership
    - Equivalent spot-linked tariffs are now widely advertised across Europe
    - High
    - Prove retention and attach-rate uplift from automation, not just tariff cadence
  - - Grid Rewards differentiation
    - Competitors can extend EV or battery flexibility products into mainstream consumer flows
    - Medium
    - Quantify Grid Rewards participation, payouts, and retention impact relative to non-users
  - - Open API and ecosystem
    - Openness attracts power users but also makes internal build easier
    - Medium
    - Measure whether API and integrations drive paid adoption faster than they enable substitution
  - - App-first customer relationship
    - Hardware-led bundles from Enpal and 1KOMMA5 can own the household before Tibber enters
    - High
    - Develop partnership or bundle strategy around solar, storage, and heat pumps
  - - Continental digital-utility positioning
    - Ostrom, Greenely, and Frank show rapid feature convergence around EV and home automation
    - High
    - Track which features are genuinely exclusive versus now category-standard
  - - Cross-market expansion potential
    - Country-specific smart-meter and exchange rules slow product portability
    - Medium
    - Model contribution margin and feature availability by country rather than assuming one reusable playbook
  notes: Severity is a qualitative judgment grounded in product convergence and distribution asymmetry visible in the source pack. Mitigation asks focus on private metrics needed to separate apparent differentiation from durable advantage.
