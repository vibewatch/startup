- id: moat-durability
  title: 'Moat durability: feature convergence is real, but Tibber still has a few differentiated surfaces'
  body: 'The adverse evidence is straightforward: dynamic pricing is commoditizing, competitor savings claims are hard to compare cleanly, and multiple peers now offer EV scheduling, home automation, or some form of flexibility monetization. That weakens any thesis that Tibber wins simply because it has a smart tariff and an app. The more durable positives are narrower. Grid Rewards is clearly articulated as a core consumer product rather than a buried add-on, and Tibber''s public API plus Home Assistant support give it a stronger openness signal than many proprietary rivals. Those strengths matter most with engaged households and technically fluent partners, not necessarily with the broadest mainstream market. The largest unresolved question is whether those strengths translate into retention and higher attach rates once competitors bundle more devices or finance the home-energy stack directly. Public product pages cannot answer that. They show convergence, possible differentiation, and
    distribution asymmetry—but not yet a verified durable moat.'
