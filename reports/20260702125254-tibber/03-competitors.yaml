- id: profiles
  title: 'Competitor profiles: scale and distribution vary more than feature headlines suggest'
  body: 'The profile table shows a sharp asymmetry in distribution power. Octopus is the clearest scale outlier because its corporate page claims more than 10 million homes powered, which gives it a brand and support footprint that smaller continental app-first retailers cannot match. Enpal is the clearest hardware-distribution outlier because its consumer page claims 100,000+ homeowners already use its solar proposition, meaning it can cross-sell energy management into an installed base it partly finances. By contrast, the continental app-led cohort—Ostrom, Greenely, Frank, and aWATTar—looks more like a feature-convergent field than a scale-divergent one from the public source pack. 1KOMMA5 is strategically important not because of a disclosed customer number in this source set, but because it starts from a tightly integrated hardware and AI bundle. Tibber sits between those poles: more open and software-centric than the bundled installers, but not publicly shown here to have the same scale
    signaling as Octopus or the same installation lock-in as Enpal.'
