- id: switching-costs
  title: Switching costs and distribution power come from meters, devices, and contracts more than the tariff itself
  body: 'In this category, the tariff switch is usually the easiest step; the harder steps are everything that follows. Smart tariffs frequently require interval meters and device eligibility, and Octopus'' onboarding pages make that friction explicit. Once customers connect EV chargers, heat pumps, thermostats, or batteries, the switching cost rises because schedules, device compatibility, and control logic all become part of the household routine. Distribution power also differs by entry point. Octopus can start from sheer customer reach, while Enpal and 1KOMMA5 can start from financed home hardware. Tibber''s public advantage is different: openness. The API and Home Assistant support make it more attractive for power users and integrators, and can reduce black-box concerns. But that same openness also lowers barriers for internal build, meaning Tibber benefits from the ecosystem while also enabling a substitute. The net result is that moat strength is less about the raw tariff and more
    about who owns the home-energy workflow after the first device is connected.'
