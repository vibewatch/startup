- id: capabilities-pricing
  title: 'Capability, pricing, and GTM comparison: EV and home control are converging, packaging is not'
  body: 'Feature breadth has started to converge across the peer set. EV charging is already table stakes across Tibber, Octopus, Ostrom, and Greenely; heating or HVAC orchestration appears at Tibber, Ostrom, and Frank; and batteries or grid-services monetization are strongest in Greenely and hardware-led propositions such as 1KOMMA5. Where the models still differ meaningfully is packaging. Tibber''s cited business model uses a subscription fee plus pass-through power. Octopus sells wholesale-linked dynamic tariffs and app-scheduled EV charging. aWATTar and Frank lean more heavily into transparent market pricing. Enpal and 1KOMMA5 start with financed or bundled equipment and use energy management to deepen the relationship later. That GTM difference matters because it determines who owns the household first: the utility app, the EV tariff, or the financed device install. On trust and openness, Tibber has a more public developer surface than many rivals, but openness alone will not protect
    it if consumers increasingly buy energy management through bundled hardware channels.'
