tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value/status
  - Quality
  - Diligence ask
  rows:
  - - Membership fee
    - Recurring household access fee for app and smart-energy services
    - €/home/month
    - AWS cites approximately €3.50 monthly
    - Transparent list price, but country-by-country realization unknown
    - Confirm current fee by market, discounting, and retention by cohort
  - - Electricity supply
    - Household buys power through Tibber at purchase price plus mandatory fees
    - kWh billed
    - Publicly described as pass-through rather than markup
    - Quality depends on procurement, imbalance, and working-capital discipline that are not disclosed
    - Request procurement spread, imbalance cost, and bad-debt history by market
  - - Grid Rewards / flexibility revenue
    - Tibber aggregates EVs and batteries into grid-balancing markets and shares generated revenue
    - Payout per participating device
    - Active feature with regional variation; take-rate undisclosed
    - Potentially high-quality software/services revenue, but gross-to-net split is not public
    - Request Tibber take-rate, participation rate, seasonality, and payout history
  - - Hardware and power-ups
    - Online store and advisory sales attach chargers, Pulse, thermostats, batteries, and integrations
    - Device sale / attach
    - Store and sales roles are public; attach and repeat rates are not
    - Transactional and likely margin-bearing, but attachment mix is opaque
    - Request SKU sales mix, attach by market, and hardware gross margin
  - - B2B device motion
    - Wholesaler and installer support expands distribution for batteries, Pulse, and Bridge
    - Order / channel contract
    - Support and escalation roles are visible in Amsterdam and Stockholm
    - Could broaden distribution efficiently, but no channel economics are public
    - Request channel margin, repeat purchase, and installer retention data
  notes: Public evidence proves the surfaces exist but not the realized revenue split or gross profit by stream.
  claimRefs:
