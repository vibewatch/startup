- id: capital-adequacy-and-disclosure-gaps
  title: Capital adequacy and disclosure gaps
  body: The retained sources are clear on historical capital inflows but thin on present liquidity. Tech.eu, Balderton, Tibber’s own funding article, and EU-Startups all corroborate the 2022 $100 million Series C and frame it as technology-expansion capital. Tech.eu also reports $181.5 million of cumulative equity and debt by March 2022, while the 2025 Summa page claims stronger Nordic profitability and meaningful Netherlands growth. That is directionally positive, but it still stops short of what an underwriting process needs now. The filing confirms Tibber is current enough to have submitted 2024 annual accounts, yet no fetched public source gives current cash, burn, runway, hedge exposure, or debt obligations by market. In other words, the public record supports a live platform business with real capital behind it, but not a finished capital-adequacy answer. That missing bridge is especially important because a company that settles energy, supports devices, and staffs customer operations
    can consume cash very differently from a pure SaaS vendor.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI036
