- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Average customer savings vs prior provider
    - AWS says ~20%
    - Medium
    - Suggests product value and retention potential
    - Obtain audited savings distribution by market and cohort
  - - Historical paying-household scale
    - Tech.eu reported >100k paying households in 2020
    - Medium
    - Shows historical adoption floor, not current revenue power
    - Request current active households and by-country mix
  - - Connected-device scale
    - AI role cites millions of connected smart devices
    - Medium
    - Supports a platform thesis and potential data advantage
    - Request monthly active devices and monetized-device share
  - - Gross margin
    - Not publicly disclosed
    - High
    - Core blocker for underwriting the model
    - Provide energy, hardware, and services gross margin bridge
  - - CAC / payback
    - Not publicly disclosed
    - High
    - Without it the visible sales and support load cannot be benchmarked
    - Share CAC, payback, and channel mix by market
  - - Support operating model
    - Phone, chat, email, escalation, and cross-functional alignment are explicitly staffed
    - Medium
    - Implies real service cost and quality-control burden
    - Share support cost per active customer and SLA attainment
  notes: Null-like rows are intentional because the public pack exposes useful proxies but not the financial numerators management would use internally.
