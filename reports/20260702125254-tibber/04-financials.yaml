- id: gtm-and-operating-economics
  title: GTM and operating economics
  body: 'Hiring evidence shows Tibber is not scaling through a single self-serve loop. The company is staffing warm-lead B2C advisory sales for home batteries and smart charging, a dedicated B2B support motion for installers and wholesalers, and a customer house with separate sales and support roles. At the same time, market and trading postings show real operational complexity behind the consumer proposition: supplier switching, metering ingestion, market integrations, algorithmic trading, and AI-enabled operations. Those signals are useful proxies for cost structure because they point to meaningful labor, compliance, and platform cost below the surface of a simple monthly fee. What remains absent is the counterweight: no public CAC, payback, gross margin, or retention data allows the agent to judge whether Tibber’s visible operating load is comfortably absorbed by recurring gross profit.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI029
