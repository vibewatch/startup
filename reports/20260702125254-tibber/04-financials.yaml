- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Why public evidence is insufficient
  - Exact diligence path
  rows:
  - - Revenue / ARR / country mix
    - Blocking
    - No retained source discloses current revenue or recurring mix by market
    - Request latest management accounts and monthly revenue bridge by country
  - - Gross margin by surface
    - Blocking
    - Public materials describe pricing philosophy but not contribution margins
    - Request gross margin split across energy supply, hardware, and flexibility services
  - - Cash / burn / runway
    - Blocking
    - Neither filings nor investor pages disclose present liquidity
    - Request treasury deck, board pack, and covenant summary
  - - CAC / payback / retention
    - Blocking
    - Hiring data shows spend surfaces but not unit-efficiency outcomes
    - Request cohort retention, CAC, payback, and support-cost per customer
  - - Debt / collateral / procurement obligations
    - Material
    - Tech.eu mentions debt in aggregate but not terms or security
    - Request debt agreements, collateral schedules, and energy procurement risk limits
  notes: These are the minimum private datapoints needed before a serious underwriting memo could move from narrative to model.
