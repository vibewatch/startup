      "id": "valuation-context-and-entry-discipline",
      "title": "Valuation Context and Entry Discipline",
      "body": "Tibber's last clearly corroborated official financing event in the fetched set remains the $100m Series C announced in 2022 by Balderton. A separate 2025 Signalbase item reports a new $300m funding round, and Silicon Canals includes Tibber among the largest Nordic rounds in 2024, but Tibber's current official pages do not themselves surface that financing history or any updated valuation. Meanwhile, private-market platforms such as Accumeo, EquityZen, CB Insights, and Notice all track Tibber stock or valuation, but they expose only thin or gated public detail. That is precisely the setup where entry discipline matters most. Summa's 2025 revenue anchor of €68m is the only hard topline datapoint in the fetched record. If the committee stress-tests the user-provided late-2026 working mark at roughly $2.2B, the implied trailing-revenue multiple lands around 29x to 32x depending on currency treatment. That is a premium multiple for a business whose operating story is visible but whose financing terms, margin structure, and liquidity path remain private. The right stance is therefore price-sensitive: do not underwrite a multi-billion entry simply because the company is real and category-relevant.",
