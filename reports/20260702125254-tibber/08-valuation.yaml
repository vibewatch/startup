    {
      "id": "exit-readiness-and-final-diligence-asks",
      "title": "Exit Readiness and Final Diligence Asks",
      "body": "Exit readiness is plausible but not yet evidenced to the standard needed for an aggressive entry price. The investor base is credible, private-market platforms do track Tibber's shares, and the category has strategic relevance for larger energy, software, or household-electrification buyers. But no fetched public source here verifies a live IPO process, a formal liquidity program, or the exact structure of the reported 2025 financing. The practical implication is that downside protection depends less on narrative quality and more on what the data room reveals about preferences, share classes, unit economics, and country-level durability. The diligence burden is therefore high and specific. The committee should insist on a revenue bridge from 2024 to 2026, current gross margin and burn, NRR or churn, a full cap-table waterfall, and direct confirmation of where Tibber operates and how many users or customers are active by market. Until those materials are produced, even a strong strategic asset should be treated as a pricing exercise with asymmetric information risk.",
