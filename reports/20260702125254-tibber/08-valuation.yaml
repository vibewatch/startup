      "id": "scenario-analysis-and-comparable-set",
      "title": "Scenario Analysis and Comparable Set",
      "body": "The scenario work is intentionally simple because the evidence base is thin where precision normally comes from. On the positive side, comparable operating-model pages show that dynamic retail, smart-home orchestration, and household flexibility are real categories: Octopus powers more than 10 million homes, 1KOMMA5° serves 120,000-plus households in seven countries, Enpal says it reaches more than 100,000 German households, and Ostrom, Greenely, and aWATTar all market digital or dynamic tariff products. That validates category relevance. It does not validate Tibber's price. A bull case requires Tibber to compound from the €68m 2025 revenue base to roughly €120m-plus by 2027 while preserving a premium multiple more typical of a scarce category winner than of a transparent consumer-energy platform. The base case assumes continued growth, but at more ordinary multiples and still lands below a late-stage secondary mark. The bear case combines slower growth, single-digit multiples, and the reality that public markets often value energy-adjacent consumer platforms more harshly once narrative tailwinds cool. The comparable set therefore supports interest in the model but argues for underwriting discipline at the current price.",
