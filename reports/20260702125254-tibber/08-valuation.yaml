    "number": 8,
    "title": "Valuation",
    "summary": "Tibber looks like a real, differentiated European smart-energy platform: Atlar cites more than one million users across four countries, and Summa reports €68m of 2025 revenue plus stronger Nordic profitability. But the current public evidence does not justify paying a prompt-supplied roughly $2.2B secondary mark with confidence, because official pages omit the reported 2025 financing and exact cap-table or unit-economics data. The recommendation is research-more with medium confidence, high risk, and an expensive valuation stance until price or disclosure improves."
  },
  "sections": [
    {
      "id": "investment-thesis-and-anti-thesis",
      "title": "Investment Thesis and Anti-Thesis",
      "body": "The core long case is that Tibber is not a slideware energy app. The fetched record shows a real digital retail and home-energy-control product, a flexibility layer that extends into grid balancing, and measurable operating proof. Tibber's own pages frame the product around dynamic pricing, app-led household control, and Grid Rewards. Independent and partner sources add substance: AWS described households already supplied in Norway, Sweden, and Germany with average savings around 20%, while Summa reported 2025 revenue of €68m, stronger Nordic profitability, 33m kWh of VPP capacity, and 27m smart-charging sessions. Atlar adds the strongest scale signal by describing more than one million users across four countries. That combination supports a thesis tied to market, product, customers, and execution rather than pure climate branding. The anti-thesis is valuation, not existence. Public pages directly reviewed for this chapter do not disclose the reported 2025 financing, exact valuation, cap-table terms, NRR, gross margin, or burn. The broader prompt narrative mentions an eight-country footprint, but the fetched public record directly corroborates only four-country operations or users. In other words, Tibber may deserve interest, but a premium late-stage price still has to be earned with evidence rather than momentum.",
