  - id: FR001
    title: 'Investment risk heatmap: evidence strength versus residual exposure'
    type: matrix
    summary: >-
      Residual risk remains highest where the potential impact is large and the assigned evidence is company-issued,
      competitor-issued, or silent on control effectiveness and economics.
    data:
      columns:
        - label: Likelihood evidence
          detail: Quality of public evidence about frequency or probability, not a modeled probability.
        - label: Potential impact
          detail: Impact if the risk occurs; no monetary loss estimate is available.
        - label: Residual view / trigger
          detail: Monitoring condition that would materially weaken the investment thesis.
      rows:
        - label: Sensitive-system authorization
          note: Broad integration scope raises consequence; no action-error denominator is public.
          values:
            - label: Weak
              tone: warning
            - label: High
              tone: high
            - label: Break on material cross-tenant or unauthorized action
              tone: critical
        - label: Security and privacy controls
          note: SOC 2 Type 2 and a DPA are company-claimed; underlying reports were not assigned.
          values:
            - label: Company claim only
              tone: warning
            - label: High
              tone: high
            - label: Break on adverse audit finding, reportable breach, or unresolved critical test result
              tone: critical
        - label: Platform and model dependencies
          note: Town claims multi-lab routing, but providers, shares, and failover are undisclosed.
          values:
            - label: Partial
              tone: warning
            - label: High
              tone: high
            - label: Break on loss of a critical connector without tested fallback
              tone: critical
        - label: Unit economics and runway
          note: The financing release does not disclose cash available, burn, margin, or runway.
          values:
            - label: Missing
              tone: risk
            - label: High
              tone: high
            - label: Break if verified gross margin or runway cannot support the operating plan
              tone: critical
        - label: Growth execution
          note: ARR and growth rates are company-issued and lack absolute starting denominators.
          values:
            - label: Partial
              tone: warning
            - label: Medium-high
              tone: high
            - label: Break on weak retention, rising support burden, or sustained reliability decline
              tone: critical
        - label: Pricing and deployment control
          note: Pricing and cloud-only claims come from a competitor page and require primary verification.
          values:
            - label: Low-quality external
              tone: warning
            - label: Medium
              tone: medium
            - label: Escalate if regulated buyers cannot meet control or residency requirements
              tone: risk
    approximationNotes: >-
      Qualitative matrix only: likelihood probabilities and loss magnitudes are unavailable, and tones indicate
      diligence priority rather than measured incidence.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The financing and growth claims create interest, but missing underwriting inputs interrupt the path from traction
      to an investable return.
    data:
      nodes:
        - id: launch
          label: June public launch
          detail: $55 million Series A reported alongside launch
        - id: traction
          label: Early traction claims
          detail: Seven-digit ARR in weeks; customers 4x and paying teams 9x since July
        - id: workflow
          label: Broad workflow surface
          detail: Company site shows communications, productivity, CRM, finance, and developer use cases
        - id: series-b
          label: October Series B
          detail: $108 million announced, co-led by Forerunner and Menlo
        - id: mark
          label: Headline valuation
          detail: $1 billion financing mark
        - id: evidence-break
          label: Underwriting evidence gap
          detail: No audited revenue, margins, burn, cap table, preferences, or usable comparable multiple
        - id: decision
          label: Research-more decision
          detail: Require private proof and return-preserving terms before investment
    approximationNotes: This is a qualitative evidence chain, not a quantitative conversion funnel or valuation bridge.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV012
      - CV013
      - CV014
      - CV015
