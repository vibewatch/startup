        title: Milestones and evidence boundaries
        blocks:
          - type: paragraph
            body: >-
              The chronology shows a compressed path from 2024 founding to a June 2026 public launch and an October 2026
              unicorn financing. It also shows why diligence must separate dated events from issuer promotion: the
              strongest current operating metrics originate with Town and are repeated through syndicated releases. An
              adverse-search result about a May 2026 breach concerns Town CPA, an accounting practice, rather than
