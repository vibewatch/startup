chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Town is a private, San Francisco-based Series B company founded in 2024 by Jean-Denis Greze and Tony
              Vincent. Its product is a per-person AI work assistant called a Townie, connected to email, documents,
              calendars, and other work systems. Town positions these assistants as proactive agents that learn an
              individual's context and can coordinate with other employees' Townies while preserving person-specific
              permissions. The commercial evidence is consistent with a paid software model serving both individuals and
              teams, because the company reports paying customers and paying teams, but the reviewed sources do not
              disclose price, contract structure, or gross-margin economics. Product capability and privacy statements
              remain company assertions rather than independently measured productivity or security outcomes.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO013
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
