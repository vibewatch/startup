      - number: '1.3'
        title: Capitalization and early operating signals
        blocks:
          - type: paragraph
            body: >-
              Town's disclosed financing sequence comprises an $18 million seed in March 2025, a $55 million Series A
              announced in June 2026, and a $108 million Series B announced on October 19, 2026. A third-party tracker
              totals disclosed equity funding at $181 million, explicitly excluding debt, grants, acquisitions,
              secondaries, and IPO proceeds. The latest round values the company at $1 billion, but the evidence does
              not specify whether that figure is pre-money or post-money, and funding raised should not be read as cash
              currently available. Town also claims it reached seven-digit ARR within weeks of launch and, since July,
              grew paying customers fourfold and paying teams ninefold. Those are directional traction signals, not
              independently verified customer counts, retention, revenue quality, or cash-burn measures.
