      - number: '4.2'
        title: Traction and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Town says it reached seven-digit ARR within weeks of its June 2026 public launch, that paying customers
              grew fourfold, and that paying teams grew ninefold since July. Independent publications repeat those
              statements, but they attribute them to Town rather than providing primary customer, billing, or audited
              corroboration. The claims indicate a fast initial sales motion, yet their denominators and measurement
              dates are absent. "Seven-digit ARR" spans a wide range, while growth multiples from an undisclosed base
              cannot establish durable scale, retention, expansion, or concentration. A customer-investor testimonial
              that Townies cost less than $100 per month offers a deployment-cost proxy, not Town's realized revenue per
              user or sales efficiency.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public inputs are insufficient to calculate gross margin, contribution margin, CAC payback, net retention,
              or lifetime value. Town's reported credit allowances and overage rates suggest that inference and workflow
              usage matter economically, and its broad integration surface implies continuing engineering and support
              costs. However, the evidence does not disclose model-provider expense, compute per task, human support
              load, failed-task remediation, onboarding cost, commissions, hosting, or payment fees. Pricing and
              traction metrics also use incompatible denominators, so dividing ARR by customer-growth multiples would
              create false precision. Underwriting requires cohort-level billing and consumption data tied to direct
              service-delivery costs.
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Town announced a $108 million Series B at a $1 billion valuation, and independent reporting places
              cumulative funding at at least $160 million. Those figures establish access to capital, not cash currently
              available: the assigned evidence provides no balance-sheet cash, monthly net burn, runway, debt,
              project-finance obligations, hiring plan, or detailed use of proceeds. The historical round chronology
              belongs in Company Overview; the financial issue is whether current resources can fund the model, compute,
              product, and go-to-market burden until repeatable margins emerge. A competitor source flags the absence of
              total customer and revenue figures, but it is not an independent benchmark. Two adverse-search results
              concern Town CPA and Town of Apex, not Town.com, and cannot be attributed to this company. The present
              verdict is therefore strong financing capacity paired with low visibility into revenue quality, margins,
              and forward capital sufficiency.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fast company-reported launch traction
            body: >-
              Town reports seven-digit ARR within weeks of launch and sharp growth in paying customers and teams, but
              the base values and independent billing evidence are not public.
            calloutType: strength
            claimRefs:
              - CI003
              - CI004
          - type: callout
            title: Funding is not runway
            body: >-
              The $108 million Series B demonstrates financing access, while cash on hand, burn, debt, and the operating
              milestones required before another round remain undisclosed.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Town's core product is a personal assistant called a Townie. Company materials say the assistant connects
              to email, documents, calendars, and other work systems, learns the user's relationships, projects, and
              voice, and then drafts or performs work across those systems. The homepage makes the workflow concrete
              through inbox triage, calendar optimization, meeting preparation, document updates, CRM administration,
              expense reconciliation, and engineering-status summaries. Recurring routines can operate on a schedule or
              when new information arrives, moving the product beyond a chat interface into persistent workflow
              automation. The breadth is meaningful, but the examples are company-authored demonstrations rather than
              measured production outcomes. Buyers should therefore separate visible feature breadth from independently
              demonstrated accuracy, time savings, and successful task completion.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
