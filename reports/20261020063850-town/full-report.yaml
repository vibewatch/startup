              - CO012
              - CO013
              - CO016
      - number: '1.2'
        title: Founder coverage and governance gaps
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence centers on the two founders. Greze is identified as co-founder and chief executive and
              brings infrastructure experience from his prior role as Plaid's chief technology officer. Vincent is
              identified as co-founder and brings applied-AI product experience from Google. That pairing covers
              enterprise software infrastructure, product, and applied AI, but it also creates visible founder
              concentration: the assigned evidence does not identify a chief financial officer, chief operating officer,
              independent directors, board committees, or succession plan. The omission is not evidence that these
              functions do not exist; it means governance quality and key-person mitigation cannot be assessed from the
              reviewed public material and should be resolved through corporate records and management diligence.
