  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-quality
      missingEvidence: >-
        Revenue by product and tier, realized pricing, discounts, contract duration, collections,
        deferred revenue, backlog, concentration, and accounting-recognition policy.
      whyItMatters: >-
        List prices and growth multiples cannot establish recurring revenue quality or a reliable
        revenue base for valuation.
      diligencePath: >-
        Reconcile the trailing 18 months of invoices, general ledger, contracts, and bank receipts
        by customer cohort and pricing tier.
      relatedQuestionRefs: [QI001, QI002, QI003]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: >-
        Gross margin, model and compute cost by task, support and onboarding cost, CAC, payback,
        logo churn, net revenue retention, and usage cohorts.
      whyItMatters: >-
        These inputs determine whether rapid adoption compounds gross profit or increases losses and
        future financing needs.
      diligencePath: >-
        Obtain monthly cohort exports joining billed revenue, credits consumed, model-provider cost,
        support time, sales spend, churn, and expansion for each plan.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >-
        Cash on hand, restricted cash, monthly net burn, runway, debt and lease obligations, approved
        hiring plan, Series B use of proceeds, and the next financing trigger.
      whyItMatters: >-
        Funding raised is not cash available, and capital adequacy cannot be judged without the
        expense plan and obligations.
      diligencePath: >-
        Review bank statements, debt and lease schedules, board budget, monthly cash-flow forecast,
        headcount plan, and downside runway sensitivities.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: sales-efficiency
      missingEvidence: >-
        Sales-cycle length, acquisition channels, commissions, partner economics, win rates, and
        fully loaded customer-acquisition cost.
      whyItMatters: >-
        One investor-customer cost testimonial cannot establish repeatable or capital-efficient
        go-to-market performance.
      diligencePath: >-
        Sample CRM opportunities and customer invoices by channel, then reconcile new ARR to sales
        and marketing spend and partner payments.
      relatedQuestionRefs: [QI004]
