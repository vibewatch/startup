companyProfile:
  summary: >-
    Town is a private, San Francisco-based Series B company founded in 2024 by
    Jean-Denis Greze and Tony Vincent. Its Townie product is a personal AI work
    assistant that connects to email, documents, calendars, and business systems,
    runs recurring work, and coordinates with other users' assistants.
