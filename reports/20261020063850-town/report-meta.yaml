  topStrengths:
    - Town reports seven-digit ARR within weeks of launch and rapid growth in paying customers and teams.
    - The company has raised substantial capital from established venture investors.
    - The per-person assistant model spans many work systems and can expand into coordinated team workflows.
  topRisks:
    - Revenue quality, retention, gross margin, burn, cash, and runway are not publicly underwritable.
    - Broad access to sensitive business systems creates material authorization, security, privacy, and reliability exposure.
    - Financing terms, ownership, dilution, and preference protections behind the $1 billion mark are undisclosed.
    - Independent customer proof and comparative product-performance evidence remain thin.
  unresolvedGaps:
    - Exact ARR, recognized revenue, customer and team denominators, cohort retention, concentration, and realized pricing.
    - Gross margin after model and infrastructure costs, customer-acquisition efficiency, cash, burn, debt, and runway.
    - Full SOC 2 package, penetration testing, incident history, tenant isolation, connector privileges, and recovery evidence.
    - Cap table, ownership purchased, option-pool treatment, liquidation preferences, anti-dilution, pro rata rights, and side letters.
    - Independent production customer references with quantified outcomes, deployment scope, and renewal evidence.
