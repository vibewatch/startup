  topStrengths:
    - Town 在上线数周内就报告了七位数 ARR，付费客户和团队数量也增长迅速。
    - 公司已从成熟的风险投资机构筹得大笔资金。
    - 每人一个助手的模式覆盖多个工作系统，并有机会扩展为协同的团队工作流。
  topRisks:
    - 收入质量、留存、毛利率、现金消耗、现金余额和资金可支撑时间均缺乏公开证据，无法纳入投资判断。
    - 广泛接入敏感业务系统，带来了重大的授权、安全、隐私和可靠性风险。
    - 10 亿美元估值背后的融资条款、股权、稀释情况和优先权保护均未披露。
    - 独立客户证明和产品性能对比证据仍然不足。
  unresolvedGaps:
    - 确切 ARR、确认收入、客户和团队分母、队列留存、客户集中度以及实际定价。
    - 扣除模型和基础设施成本后的毛利率、获客效率、现金、现金消耗、债务和资金可支撑时间。
    - 完整 SOC 2 材料、渗透测试、事件历史、租户隔离、连接器权限和恢复能力证据。
    - 股权结构表、收购的股权比例、期权池处理、清算优先权、反稀释条款、按比例认购权和附函。
    - 独立的生产环境客户参考，包括量化结果、部署范围和续约证据。
