  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "security-controls"
      missingEvidence: >-
        SOC 2 report and bridge letter, exceptions, penetration-test summary, security architecture,
        tenant-isolation evidence, incident register, recovery objectives, and remediation history.
      whyItMatters: >-
        Town can access and act across sensitive business systems, so a certification claim alone
        does not establish that authorization, isolation, monitoring, and recovery controls are effective.
      diligencePath: >-
        Review the full assurance package under NDA and run technical red-team tests covering
        cross-tenant access, prompt injection, connector privilege, revocation, rollback, and audit logs.
      relatedQuestionRefs: ["QR002", "QR003"]
      relatedTableRefs: ["TR001"]
    - type: "missing-source"
      severity: "material"
      topic: "incident-history-gap"
      missingEvidence: >-
        Entity-verified Town.com litigation, regulatory, enforcement, outage, breach, and customer-complaint history.
      whyItMatters: >-
        Namesake-heavy results cannot establish either an adverse event or the absence of one, and
        undisclosed history could change legal, security, and reputation risk.
      diligencePath: >-
        Search verified legal entity names and jurisdictions, review regulator and court records, and
        reconcile findings with management representations, insurer loss runs, and the internal incident register.
      relatedQuestionRefs: ["QR003", "QR009"]
      relatedTableRefs: ["TR001"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "model-dependency"
      missingEvidence: >-
        Model-provider and connector workload shares, contracts, data terms, service levels, failure
        modes, fallback tests, switching costs, and subprocessor dependencies.
      whyItMatters: >-
        Multi-provider claims do not establish continuity if critical workloads, permissions, or data
        flows remain concentrated in one provider or connector.
      diligencePath: >-
        Obtain the dependency register and contracts, then witness failover tests for a major model,
        email provider, system-of-record connector, and regional service interruption.
      relatedQuestionRefs: ["QR004"]
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "financial-model-gap"
      missingEvidence: >-
        Cash balance, monthly net burn, runway, gross margin including model costs, cohort retention,
        expansion, customer and team denominators, pricing realization, and support burden.
      whyItMatters: >-
        Funding raised is not cash available, and percentage growth without starting bases or
        retention cannot establish efficient or durable scaling.
      diligencePath: >-
        Reconcile bank statements, board reporting, monthly financials, invoices, model bills, and
        cohort exports to the announced ARR, customer, team, and financing claims.
      relatedQuestionRefs: ["QR005", "QR007", "QR010"]
    - type: "conflicting-data"
      severity: "material"
      topic: "deployment-control"
      missingEvidence: >-
        Primary pricing terms, hosting and data-residency options, export and deletion rights,
        supported MCP boundaries, custom-workflow controls, and customer migration evidence.
      whyItMatters: >-
        The only detailed adverse description is competitor-issued and conflicts in part with Town's
        own claims about user-defined routines and MCP support.
      diligencePath: >-
        Review current order forms, product documentation, architecture, export tests, customer
        references, and a live build of a custom workflow with least-privilege controls.
      relatedQuestionRefs: ["QR006", "QR008"]
