  - id: TE002
    title: Workflow and use-case assessment
    columns:
      - User job
      - Current workflow
      - Town solution
      - Publicly evidenced benefit
      - Limitation
    rows:
      - [Manage inbound communication, Manually sort and respond across inboxes, Auto-inbox labels messages and drafts replies, Reduced manual triage is the stated product outcome, No measured precision or time saved]
      - [Prepare for meetings, Search calendars messages and documents, Meeting Briefing researches and compiles context, Consolidated preparation is demonstrated in product copy, No benchmark for completeness or hallucination]
      - [Maintain business systems, Update CRM finance and project tools separately, Townie drafts or records updates across connected apps, Cross-application action is visibly central to the product, Authorization boundaries are not documented]
      - [Coordinate team work, Request information and wait for colleagues, Townies ask one another questions and hand off work, Company describes fewer stalled handoffs, No independent cycle-time study]
      - [Review consequential actions, Inspect drafts before sending or changing records, Selected actions wait for user approval, Homepage and review both describe human approval controls, Coverage of approval-required action classes is unclear]
    notes: >-
      Benefits are qualitative claims or demonstrated workflows; no retained source provides
      controlled productivity, accuracy, latency, or reliability measurements.
    claimRefs: [CE002, CE003, CE004, CE009, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Publicly described role
      - Dependency
      - Principal risk
    rows:
      - [Connected systems, Supply email document calendar messaging CRM finance and development context, Third-party APIs credentials and connector permissions, Excessive scope or stale access]
      - [Personal context, Represents relationships projects preferences and voice for one user, Accurate ingestion and tenant isolation, Context leakage or incorrect personalization]
      - [Townie orchestration, Uses context to prepare and perform work, External model providers and undisclosed routing logic, Model errors latency and provider changes]
      - [Routine engine, Runs scheduled or event-triggered repeat work, Trigger quality state management and retries, Silent failure duplicate action or runaway usage]
      - [Team coordination and action controls, Coordinates assistants and requests approval where needed, Identity boundaries sharing rules audit logs and human review, Unauthorized disclosure or action across users]
    notes: >-
      This is a functional architecture reconstructed from public product descriptions.
      Infrastructure, security boundaries, service levels, and benchmark results remain undisclosed.
    claimRefs: [CE001, CE003, CE005, CE006, CE007, CE013]
figures:
  - id: FE001
    title: Public product architecture map
    type: stack
    summary: >-
      The product moves from connected work systems through personal context and orchestration
      to routines, team coordination, and approval-controlled actions.
    data:
      layers:
        - label: Connected work systems
          items: [Email, Documents, Calendars, Messaging, Business applications]
          detail: Third-party systems provide the operating context and action surfaces.
        - label: Personal context
          items: [Relationships, Projects, Preferences, Voice]
          detail: Each Townie is described as learning how its assigned person works.
        - label: Townie orchestration
          items: [Task interpretation, Context use, Model selection]
          detail: Town says it can use models from major AI labs for different tasks.
        - label: Routine engine
          items: [Scheduled work, Event-triggered work, Repeat workflows]
          detail: Routines automate recurring tasks beyond one-off chat requests.
        - label: Team coordination
          items: [Questions, Handoffs, Shared workflows]
          detail: Separate Townies can coordinate while remaining assigned to individuals.
        - label: Approval-controlled actions
          items: [Draft, Review, Approve, Execute]
          detail: Public examples place human approval before selected consequential actions.
    approximationNotes: >-
      Functional abstraction from public descriptions; it is not a verified infrastructure
      diagram and does not imply specific data flows or security boundaries.
    claimRefs: [CE001, CE003, CE004, CE006, CE007]
callouts:
  - calloutType: risk
    title: Broad access is both the moat and the attack surface
    body: >-
      Town's usefulness depends on persistent context and the ability to act across many
      systems. The investment case requires connector-level permission documentation,
      adversarial testing, incident history, action-error rates, and enterprise controls
      that are not available in the assigned public evidence.
    claimRefs: [CE002, CE006, CE009, CE013]
