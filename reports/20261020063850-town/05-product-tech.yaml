  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technical-disclosure
      missingEvidence: >-
        Architecture diagrams, connector permission scopes, tenant-isolation design,
        model-routing policy, evaluation methodology, service levels, and incident history.
      whyItMatters: >-
        The product handles sensitive work context and can prepare or execute actions across
        business systems, so architecture and reliability determine enterprise risk.
      diligencePath: >-
        Request a technical diligence session, security architecture packet, subprocessors,
        penetration-test summary, model evaluation results, and twelve months of service metrics.
      relatedQuestionRefs: [QE003, QE005, QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >-
        A Town-owned public repository, package registry, engineering talk, practitioner forum,
        changelog, or other activity signal attributable to the company.
      whyItMatters: >-
        Without a developer or practitioner signal, public evidence cannot test release cadence,
        ecosystem adoption, engineering transparency, or implementation friction.
      diligencePath: >-
        Ask for release history, integration documentation, API materials, engineering references,
        and customer administrators who have deployed multiple connectors.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: >-
        Independent enterprise customer references, production benchmarks, mature review-platform
        data, and third-party assessments of task accuracy and failure handling.
      whyItMatters: >-
        Current evidence is dominated by company materials and one competitor-authored review,
        limiting confidence in product maturity and measurable outcomes.
      diligencePath: >-
        Obtain reference calls, anonymized task-success cohorts, action-error logs, renewal data,
        and independent security and reliability assessments.
      relatedQuestionRefs: [QE004, QE005, QE006]
