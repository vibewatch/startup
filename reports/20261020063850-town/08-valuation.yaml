callouts:
  - calloutType: recommendation
    title: Price is the unresolved variable
    body: >-
      Town may be an attractive company and still be an unattractive investment at
      the wrong security price. The current evidence supports further diligence, not
      a buy decision or a precise valuation range.
    claimRefs: [CV002, CV014, CV015]
