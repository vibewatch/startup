    title: Thesis and anti-thesis
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "A $108 million Series B led by Forerunner and Menlo supplies substantial new financing", "Confirm cash received, planned use, ownership, and security terms"]
      - [Thesis, "Town reports seven-digit ARR in weeks plus 4x paying-customer and 9x paying-team growth since July", "Verify exact ARR, starting denominators, cohorts, retention, and recognized revenue"]
      - [Thesis, "The earlier $55 million Series A and current round indicate rapid investor support after launch", "Show milestone delivery between rounds and capital efficiency"]
      - [Anti-thesis, "Revenue is undisclosed, retention evidence is cohort-qualified, incumbents can bundle, and financing terms are absent", "Provide audited KPIs, full-cohort retention, competitive win/loss data, and the complete preference stack"]
    notes: "Company-issued growth claims are presented as claims rather than independently verified operating results; the Yahoo item is a syndicated company release."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Verified durable ARR growth, broad-cohort retention, healthy gross margin, and favorable entry terms", "A value above the current mark may be supportable only if a private model shows the target return", "Scale costs, security failures, and incumbent response", "No percentage assigned; requires audited cohort and unit-economics evidence"]
      - [Base, "Reported traction is directionally real but exact economics and financing protections remain unknown", "Treat $1 billion as the current financing mark; no public numeric range is supportable", "Dilution, preference overhang, and weak conversion from usage to revenue", "Current evidence supports research-more, not a probability"]
      - [Bear, "Promoted cohorts are not representative, monetization lags, or bundled incumbents cap pricing power", "A down round or capital impairment is plausible; the public record provides no defensible floor", "Revenue shortfall, multiple compression, and unfavorable preferences", "Triggered by weak full-cohort retention, poor margins, or an adverse cap table"]
    notes: "Scenarios are qualitative because the source pool contains no audited financial model, applicable comparable multiple, ownership percentage, or preference terms."
    claimRefs: [CV002, CV005, CV006, CV007, CV010, CV011, CV012, CV014, CV015]
