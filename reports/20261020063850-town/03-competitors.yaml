    columns:
      - Buying criterion
      - Town evidence
      - Listed-alternative evidence
      - Competitive implication
    rows:
      - ["Cross-channel personal assistant", "Email, Slack, WhatsApp, Telegram, and application examples", "Unknown", "Breadth is claimed but not independently benchmarked"]
      - ["Recurring automation", "Stock and custom routines with trigger options by plan", "Unknown", "Could embed Town in repeated work"]
      - ["Business-system integrations", "Examples include CRM, documents, engineering, accounting, and expenses", "Unknown", "Integration coverage can expand distribution and switching cost"]
      - ["Assistant-to-assistant work", "Available in qualifying plans and described for team handoffs", "Unknown", "Potential team-network differentiation"]
      - ["Team administration", "Shared workspace, routines, skills, pooled credits, and organization analytics", "Unknown", "Supports expansion from individual to organization"]
      - ["Model-provider flexibility", "Town says it uses models from major AI labs", "Unknown", "Reduces single-lab dependency but may be replicable"]
      - ["Trust posture", "Company reports SOC 2 Type 2 and a public DPA", "Unknown", "Supports enterprise diligence but is not comparative proof"]
    notes: >-
      Town cells reflect company-issued product and pricing pages; no retained independent
      source establishes the alternatives' capabilities, so those cells remain unknown.
    claimRefs: [CP003, CP004, CP005, CP006, CP007]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Product or plan
      - Starting price
      - Billing unit
      - Free plan
      - Included or distinguishing evidence
      - Qualification
    rows:
      - [Town, "$15", "per month", "Yes", "Starter includes 1,250 monthly credits in Toolradar's review", "Official page also offers higher individual and custom team tiers"]
      - [Motion, "$12", "per user per month", "No", "No retained capability detail", "Third-party comparison only"]
      - [SkedPal, "$9.95", "per month; billing unit not specified", "No", "No retained capability detail", "Third-party comparison only"]
      - [Calendly, "$10", "per month; billing unit not specified", "Yes", "No retained capability detail", "Third-party comparison only"]
      - [Notion AI, "$10", "per month; billing unit not specified", "No", "No retained capability detail", "Third-party comparison only"]
      - [Raycast, "$8", "per month; billing unit not specified", "Yes", "No retained capability detail", "Third-party comparison only"]
      - [Alfred, "$34", "billing period not specified", "Yes", "No retained capability detail", "Not directly comparable with monthly prices"]
    notes: >-
      Prices and free-plan flags are Toolradar's October 2026 comparison; they are starting
      list prices, not realized contract values, and missing billing units are preserved.
    claimRefs: [CP001, CP002, CP003, CP010, CP012]
figures:
