    title: Entry price versus free-plan availability
    type: quadrant
    summary: >-
      Six monthly-priced alternatives cluster between $8 and $15, while free-plan availability
      varies; this maps access economics rather than overall product quality.
    data:
      points:
        - label: Town
          x: 15
          y: 1
          detail: "$15 per month; free plan reported"
        - label: Motion
          x: 12
          y: 0
          detail: "$12 per user per month; no free plan reported"
        - label: SkedPal
          x: 9.95
          y: 0
          detail: "$9.95 per month; billing unit unspecified; no free plan reported"
        - label: Calendly
          x: 10
          y: 1
          detail: "$10 per month; billing unit unspecified; free plan reported"
        - label: Notion AI
          x: 10
          y: 0
          detail: "$10 per month; billing unit unspecified; no free plan reported"
        - label: Raycast
          x: 8
          y: 1
          detail: "$8 per month; billing unit unspecified; free plan reported"
    approximationNotes: >-
      X is Toolradar's reported monthly starting price in US dollars; Y encodes reported
      free-plan availability as 1=yes and 0=no. Alfred is excluded because its $34 price has
      no billing period in the retained source. Positions do not score capabilities.
    claimRefs: [CP011, CP012, CP016]
callouts:
