    - Gross margin after model and infrastructure costs, customer-acquisition efficiency, cash, burn, debt, and runway.
    - >-
      Full SOC 2 package, penetration testing, incident history, tenant isolation, connector privileges, and recovery
      evidence.
    - >-
      Cap table, ownership purchased, option-pool treatment, liquidation preferences, anti-dilution, pro rata rights,
      and side letters.
    - Independent production customer references with quantified outcomes, deployment scope, and renewal evidence.
