            body: >-
              Town 宣布以 $1 billion 估值完成 $108 million Series B，独立报道则将累计融资放在至少 $160
              million。它们证明了融资渠道，而不是当前可用现金：指定证据没有资产负债表现金、月度净现金消耗、现金跑道、债务、项目融资义务、招聘计划或详细资金用途。历史轮次时间线应放在公司概览；财务问题在于当前资源能否支撑模型、算力、产品和上市推广负担，直到可重复的利润率出现。竞争对手来源指出缺少客户总数和收入数字，但它不是独立基准。两个负面搜索结果涉及
              Town CPA 和 Town of Apex，而非 Town.com，不能归因于该公司。因此，当前结论是融资能力强，但收入质量、利润率和前向资本充足性可见度低。
