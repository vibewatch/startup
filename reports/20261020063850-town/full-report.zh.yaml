  - id: FE001
    title: 公开产品架构图
    type: stack
    summary: 产品从连接的工作系统出发，经个人上下文和编排，延伸到例程、团队协作和审批控制的动作。
    data:
      layers:
        - label: 连接的工作系统
          items:
            - 电子邮件
            - 文档
            - 日历
            - 消息
            - 商业应用
          detail: 第三方系统提供运行上下文和动作界面。
        - label: 个人上下文
          items:
            - 关系
            - 项目
            - 偏好
            - 语音
          detail: 据描述，每个 Townie 都会学习其所服务用户的工作方式。
        - label: Townie 编排
          items:
            - 任务理解
            - 上下文使用
            - 模型选择
          detail: Town 称可针对不同任务使用主要 AI 实验室的模型。
        - label: 例程引擎
          items:
            - 定时工作
            - 事件触发工作
            - 重复工作流
          detail: 例程可自动处理一次性聊天请求之外的重复任务。
        - label: 团队协作
          items:
            - 问题
            - 交接
            - 共享工作流
          detail: 不同 Townie 可在分别归属于个人的同时开展协作。
        - label: 审批控制的动作
          items:
            - 起草
            - 审阅
            - 批准
            - 执行
          detail: 公开示例显示，部分重要动作执行前需要人工审批。
    approximationNotes: 基于公开描述的功能抽象；这不是经过核实的基础设施图，也不代表具体数据流或安全边界。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE007
  - id: FU001
    title: 假设的客户切入与扩张路径
    type: journey-map
    summary: 公开产品叙事暗示产品会从个人工作流切入，扩展到团队例程和外部协作，但未披露各阶段之间的实际转化或留存。
    data:
      items:
        - name: Workflow trigger
          label: 工作流触发
          value: Email- and coordination-heavy work
          detail: 个人识别出可以委派的重复性工作。
        - name: Individual activation
          label: 个人激活
          value: Connect personal work context
          detail: Townie 连接电子邮件、文档、日历和核心系统。
        - name: Repeated use
          label: 重复使用
          value: Scheduled or event-driven routines
          detail: 用户将定期简报、收件箱处理和跟进工作委派出去。
        - name: Tool expansion
          label: 工具扩展
          value: Broader integration surface
          detail: 工作延伸到 CRM、生产力、开发和财务工具。
        - name: Team expansion
          label: 团队扩展
          value: Shared workflows and handoffs
          detail: 多个 Townie 在继续绑定个人用户的同时开展协作。
        - name: External coordination
          label: 外部协作
          value: Customers, partners, and candidates
          detail: Townie 通过电子邮件和短信与公司外部沟通。
    approximationNotes: 阶段顺序根据公司产品描述推断；未声称存在任何转化率、队列数量、时间安排或与价值成比例的宽度。
    claimRefs:
      - CU001
      - CU002
      - CU008
  - id: FR001
    title: 投资风险热力图：证据强度与残余暴露
    type: matrix
    summary: 在潜在影响较大、且指定证据由公司或竞争对手发布，或对控制有效性和经济性保持沉默的领域，残余风险最高。
    data:
      columns:
        - label: 可能性证据
          detail: 关于频率或概率的公开证据质量，不是模型计算的概率。
        - label: 潜在影响
          detail: 风险发生时的影响；没有货币损失估算。
        - label: 残余判断 / 触发条件
          detail: 会实质削弱投资论点的监测条件。
      rows:
        - label: 敏感系统授权
          note: 广泛的集成范围放大后果；公开信息没有动作错误分母。
          values:
            - label: 弱
              tone: warning
            - label: 高
              tone: high
            - label: 出现重大跨租户或未授权动作即失守
              tone: critical
        - label: 安全与隐私控制
          note: SOC 2 Type 2 和 DPA 是公司声称的资质；未指定底层报告。
          values:
            - label: 仅有公司声称
              tone: warning
            - label: 高
              tone: high
            - label: 出现不利审计发现、需报告的漏洞或未解决的关键测试结果即失守
              tone: critical
        - label: 平台与模型依赖
          note: Town 声称支持多实验室路由，但供应商、占比和故障切换均未披露。
          values:
            - label: 部分
              tone: warning
            - label: 高
              tone: high
            - label: 关键连接器失效且没有经过测试的备用方案即失守
              tone: critical
        - label: 单位经济性与现金跑道
          note: 融资新闻稿未披露可用现金、消耗、利润率或现金跑道。
          values:
            - label: 缺失
              tone: risk
            - label: 高
              tone: high
            - label: 经核实的毛利率或现金跑道无法支撑运营计划即失守
              tone: critical
        - label: 增长执行
          note: ARR 和增长率由公司发布，且缺少绝对起始分母。
          values:
            - label: 部分
              tone: warning
            - label: 中高
              tone: high
            - label: 留存疲弱、支持负担上升或可靠性持续下降即失守
              tone: critical
        - label: 定价与部署控制
          note: 定价和仅支持云端的说法来自竞争对手页面，需要一手核实。
          values:
            - label: 低质量外部证据
              tone: warning
            - label: 中
              tone: medium
            - label: 若受监管买方无法满足控制或数据驻留要求，则升级风险
              tone: risk
    approximationNotes: 仅为定性矩阵：可能性概率和损失规模均不可得，颜色表示尽调优先级，而非实际发生率。
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资和增长说法带来兴趣，但投资判断所需输入缺失，阻断了从增长到可投资回报的路径。
    data:
      nodes:
        - id: launch
          label: 6 月公开上线
          detail: 上线时一并披露 $55 million A 轮融资
        - id: traction
          label: 早期增长说法
          detail: 数周内 ARR 达到七位数；自 7 月以来客户增长 4 倍、付费团队增长 9 倍
        - id: workflow
          label: 广泛的工作流覆盖
          detail: 公司网站展示通信、生产力、CRM、财务和开发者使用场景
        - id: series-b
          label: 10 月 B 轮
          detail: 宣布融资 $108 million，由 Forerunner 和 Menlo 共同领投
        - id: mark
          label: 标题估值
          detail: $1 billion 融资估值
        - id: evidence-break
          label: 投资判断证据缺口
          detail: 没有经审计的收入、利润率、消耗、股权结构表、优先股堆叠或可用可比倍数
        - id: decision
          label: 继续研究的决定
          detail: 投资前要求私下证明和能够守住回报的条款
    approximationNotes: 这是定性证据链，不是量化转化漏斗或估值桥接。
    claimRefs:
