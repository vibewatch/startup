    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Town 是一家总部位于旧金山的非上市 Series B 公司，2024 年由 Jean-Denis Greze 和 Tony Vincent 创立。其产品是名为 Townie 的个人 AI
              工作助手，可连接邮件、文档、日历和其他工作系统。Town 将这些助手定位为主动型代理：它们学习个人上下文，并可与其他员工的 Townie
              协作，同时保留针对个人的权限。公司披露有付费客户和付费团队，商业证据与服务个人和团队的付费软件模式一致；但审阅来源没有披露价格、合同结构或毛利经济性。产品能力和隐私声明仍是公司口径，而非独立测量的生产力或安全结果。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO013
              - CO014
