  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”的建议，对估值结论的信心低，投资判断风险评级高。Town 10 月的融资作为已宣布交易是真实的：公司及其联合发布稿称完成 $108 million Series B、估值 $1
              billion，Datapile
              也重复了这些数字。这些事实只确立了公开报道中的估值，并不代表这个价格能带来有吸引力的回报。保留来源既没有披露购买的证券、清算优先权、稀释、债务、股权结构表所有权、轮后可用现金，也没有披露投资人保护条款。它们也没有提供经审计收入、毛利率、消耗、跑道或可比倍数。因此，入场应以私域证据为条件，而不是以领投方质量或融资规模为依据。融资金额不等于可用现金，公司的七位数
              ARR 说法也不是经审计收入。在缺少起始持股比例、后续投资储备假设和可支撑退出价值的情况下，既不能负责任地量化目标回报，也不能量化持有期。
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV014
              - CV015
