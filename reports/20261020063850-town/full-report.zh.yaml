  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              可用的独立比较证据将 Motion、SkedPal、Calendly、Notion AI、Raycast 和 Alfred 列为 Town
              的替代方案，但没有建立逐项功能对等关系，也没有证明它们属于单一同质市场。更合理的读法是：这是一组覆盖日程安排、工作区 AI、启动器自动化和广泛工作流辅助的买方选择。人工协调、内部脚本和通用 AI
              助手也可能是现状替代方案，但指定证据池没有量化其采用率或成本。搜索精准度本身就是尽调问题：若干保留结果涉及市政开发或无关的城镇规划软件。这些页面不是竞争对手；它们说明通用品牌词会制造发现噪声，使无监督的市场研究容易出现同名实体错误。
            claimRefs:
              - CP009
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP008
              - CP009
              - CP016
      - number: '3.2'
        title: 能力、工作流与信任差异化
        blocks:
          - type: paragraph
            body: >-
              Town
              的公司材料将产品定位为跨应用工作助手，而非单一用途的日程工具。示例覆盖邮件、日历、消息、CRM、文档、工程、会计和费用系统，周期性流程则自动处理重复工作。更具差异性的主张落在组织协作上：每位用户都有自己的
              Townie，这些助手可以互相提问、交接工作，同时保留个人上下文。Town 还称会在主要模型供应商之间路由工作，降低对单一模型实验室的依赖，并报告 SOC 2 Type 2
              合规和公开数据处理协议。这些是有意义的产品和信任信号，但仍属公司口径；指定的独立来源没有对准确率、延迟、权限处理或工作流完成情况与所列替代方案进行基准比较。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 定价、包装与分销压力
        blocks:
          - type: paragraph
            body: >-
              Town 采用免费增值、按额度计量的价格梯度。其官网提供永久免费计划、付费个人层级、用量超额费用，以及带共享额度、共享工作区、共享流程和技能、组织分析的团队计划。Toolradar 另报 Town 入门价为每月
              $15，并列出六个起价 $8 至 $34 的替代方案；不过 Alfred 引用的 $34 没有月度单位，不应直接与月订阅比较。六个替代方案中，Toolradar
              报告有三个提供免费计划。这种价格聚集限制了单靠价格构筑护城河的空间，也提高了集成、团队上下文和周期性工作流采用在分销中的重要性。保留证据没有公开实际企业定价、折扣、销售周期、渠道经济性或多产品并用行为。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Town 最有潜力的锁定机制，是跨已连接系统累积的工作流上下文，以及多个用户助手之间的协作。多模型策略可能降低 Town
              及其客户对上游模型供应商的锁定，但当竞争产品采用类似路由时，也可能让前沿模型访问不再独占。公司报告的快速上线增长和充足融资说明有资源追逐机会，并不证明持久的产品优势。主要的负面结论来自证据：保留的独立材料比较了标价，却没有测试任务完成质量、可靠性、管理控制或安全结果。在获得买方群组、切换行为和直接基准前，应将护城河判断为集成广度、学习到的上下文和团队网络效应的未经验证组合，而不是已证明的性能领先。
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 独立比较仍是核心缺口
            body: 可用的第三方证据验证了标价定位，但没有验证 Town 的相对任务质量、可靠性、权限控制或客户切换行为。
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Town 可观察到的商业模式是面向个人的 AI 助手，在邮件、文档、日历和已连接系统中执行工作。竞争产品撰写的评测报告称，其从 $0 到每用户每月 $199 采用免费增值梯度，各层包含额度，Pro
