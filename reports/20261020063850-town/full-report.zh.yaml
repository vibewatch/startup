      - number: '8.2'
        title: 投资论点、反论点与证据质量
        blocks:
          - type: paragraph
            body: >-
              正面论点是速度。Town 称 2026 年 6 月以 $55 million Series A 公开发布，数周内达到七位数 ARR，自 7
              月起付费客户增长四倍、付费团队增长九倍。其网站还展示覆盖通信、日历、文档、CRM、财务和开发工具的广泛工作流面。如果在完整客户群中得到验证，这种组合可能支持使用扩张和工作流锁定。反向证据显示，几乎所有当前经营指标都来自公司，缺少分母、确切
              ARR、群组定义或独立验证。早期一份独立分析报告约 10,000 名用户且未披露收入，并警告所引用的两个月 99% 留存只适用于已构建自动化的用户；它不知道有多少用户达到该群组。同一分析将 Microsoft 和
              Google 分销列为结构性风险。搜索池中的两个数据泄露结果涉及 Town CPA 和 Town of Apex，而非 Town.com，不能用作该公司的负面证据。
