      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以给出数字化估值区间或情景概率。乐观情景必须有私下证据证明：已报告的客户和团队增长能够转化为持久 ARR，完整客户群的留存足够强，且毛利率和资本效率足以支撑显著高于 $1 billion
              入场估值的退出价值。基准情景把经营主张视为有希望但未经验证，把当前估值视为融资事实而非内在价值；因此不设数字区间，也不作投资承诺。悲观情景是使用增长无法转化为可规模化收入，同时捆绑销售的在位者压缩定价或获客效率。在这种情景下，标题估值可能重置，投入资本可能受损，但现有证据无法提供负责任的下行底线。在可验证的收入桥接、客户群组留存、毛利率、消耗、所有权和优先股堆叠可得前，情景概率应保持未分配。
            claimRefs:
              - CV002
