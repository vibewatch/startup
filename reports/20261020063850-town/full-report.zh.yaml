            body: >-
              领导层证据集中在两位创始人身上。Greze 被确认是联合创始人兼 CEO，曾任 Plaid 首席技术官，带来基础设施经验。Vincent 被确认是联合创始人，带来来自 Google 的应用 AI
              产品经验。这一组合覆盖企业软件基础设施、产品和应用 AI，但也形成明显的创始人集中度：现有证据没有确认
              CFO、COO、独立董事、董事会委员会或继任计划。缺失并不证明这些职能不存在；它意味着无法依据已审阅的公开材料评估治理质量和关键人物风险缓释，需要通过公司记录和管理层尽调解决。
