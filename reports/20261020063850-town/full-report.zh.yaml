      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据支持自下而上的切入和向企业扩张的路径。个人知识工作者是初始用户，销售、商务拓展和招聘等对外岗位拥有高频邮件与日历工作流。小型和中型企业看起来是自助服务的切入点：创始人、职能负责人或运营负责人可以推动使用，并由公司付款。拟议的中端市场路径是先由少数人连接邮件和日历，在会议准备或文档更新中证明价值，再扩展到
              CRM 和更广泛的 IT 栈。更大规模的部署会引入 CIO、IT、安全和财务利益相关方，因为审计日志、敏感信息控制、合规和 token
              成本可见性会成为购买条件。没有引用证据确认实际合同负责人、采购周期、价格点或预算科目，因此表格将已有证据支持的角色与尽调假设分开，而不是赋予未经支持的经济含义。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM016
      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              邮件、日历和协调工作的高频性、可用集成的广度，以及能在全公司推广前展示价值的产品设计，都有助于采用。Town 还将模型供应商中立、客户拥有累积上下文、默认不使用已连接数据训练、SOC 2 Type 2
              合规和公开数据处理协议，作为回应信任与锁定担忧的措施。同一定位也带来重要约束。企业扩张需要超越个人体验的控制和隐私保障，而公司尚未展示试点如何转化为可重复的大规模部署。更具战略性的是，管理层的可迁移性承诺旨在降低客户切换成本；如果模型供应商或生产力套件复制工作流层，这可能帮助获客，却也会削弱留存和定价权。对估值而言，已披露增长率说明存在需求，但不能替代绝对客户数、定价、留存、利润率或边界清晰的可服务市场。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 数字化市场规模仍未验证
            body: 指定的成功来源中没有适用的独立 TAM、SAM 或 SOM 估算、席位分母、价格或预算负责人。没有绝对数量和定价，已披露的增长倍数无法换算成市场价值。
            calloutType: risk
            claimRefs:
              - CM005
              - CM015
              - CM016
          - type: callout
            title: 可迁移性有助于采用，但可能限制留存
            body: Town 将客户数据所有权和一日切换能力定位为对抗模型实验室的切入点。这降低了买方的锁定，却也意味着持久定价权必须依赖产品质量和工作流价值，而不是合同摩擦。
            calloutType: insight
            claimRefs:
