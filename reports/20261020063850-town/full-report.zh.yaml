          detail: 指定证据未公开直接成本明细。
        - id: gross-profit
          label: 毛利
          detail: 在账单收入与直接服务交付成本完成核对前无法得出。
    approximationNotes: 这是机制图，不是预测。价格和额度来自竞争对手撰写的评测；任何数值都不视为已实现收入，也未估算毛利率。
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI008
