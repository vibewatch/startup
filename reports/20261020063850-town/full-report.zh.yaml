      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              指定证据没有证明退出准备度。没有保留来源提供经审计规模、可用于明确指标的上市公司倍数、私募二级市场价格、相关收购基准或可能的退出窗口。下一步尽调应进行私域数据室审阅：将签约 ARR
              与确认收入核对；按客户群组检查毛留存、净留存、客户 logo
              留存、扩张和集中度；计入模型与基础设施成本后测试毛利率；并核对消耗、现金、债务和跑道。法律审阅应梳理股权结构表、期权池、清算优先权、参与权、反稀释、按比例认购权和任何附函。产品尽调应验证广泛集成能否带来持续付费使用，而不会出现不可接受的安全或权限失效。论点失效触发器包括：完整客户群留存显著低于被宣传的自动化群组、客户增长转化为收入的能力弱、依赖补贴式模型成本、优先股堆叠吞噬合理退出收益，或在位者捆绑销售阻止定价权。若证据通过这些测试，且入场条款保留目标回报，建议可以调整；仅凭公开记录做不到。
            claimRefs:
              - CV009
