  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Town 的相关市场窄于广义人工智能软件，又宽于单一邮件助手。产品边界从连接邮件、文档、日历和核心工作系统的个人 Townie 开始，延伸至 Townie
              之间的协作，以及触达客户、合作伙伴和候选人的工作流。因此，纳入的支出包括用于准备会议、分拣沟通、更新业务系统、协调团队和自动化周期性知识工作的软件或人工预算。通用聊天、仅编码代理、模型基础设施、独立记录系统和无关的消费者助手均被排除，除非
              Town 直接替代或编排这些工作流。现状是人工协调收件箱、日历、消息、文档和点式应用；替代产品包括通用助手、生产力套件原生功能、点式工作流工具和内部自动化。Town
              已放弃的税务产品不在当前边界内，但其年度采购周期和低频使用习惯解释了管理层为何转向更高频的工作。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM010
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持以金额计的 TAM、SAM 或 SOM。Town 报告在 2026 年 6 月公开发布后快速采用，包括自 7
              月起付费客户增长四倍、付费团队增长九倍，但没有提供起始数量、绝对客户总数、席位数、价格、留存或客户结构。这些倍数是增长信号，不是市场规模分母。最强的独立来源提供的是角色和工作流视角，而非公开市场估算：依赖邮件和日历运营的企业，尤其是销售、商务拓展和招聘岗位。指定的自上而下结果讨论的是城市化、市政、地方零售市场、小城镇房地产或无关会计事务所，无法填补缺口。因此，金字塔只展示按顺序排列的可触达性层级，每层都明确未量化；它不按价值比例绘制，也不应被视为投资级市场规模模型。
