callouts:
  - calloutType: risk
    title: Financing proof is not operating proof
    body: >-
      The $1 billion round valuation and $181 million of disclosed equity
      funding do not establish cash available, retention, productivity gains,
      unit economics, or a sustainable revenue base.
    claimRefs: [CO009, CO010, CO012, CO013]
  - calloutType: insight
    title: Adverse-search namesake requires exclusion
    body: >-
      The breach result in the assigned pool concerns Town CPA. It is useful for
      entity disambiguation but provides no evidence of an incident at
      Town.com, Inc.
    claimRefs: [CO015]
