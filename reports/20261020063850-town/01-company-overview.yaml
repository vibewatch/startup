  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Current board roster, observer rights, committee structure, executive
        bench, succession plan, and founder employment or vesting terms.
      whyItMatters: >-
        Founder concentration and investor governance cannot be assessed from
        financing announcements alone.
      diligencePath: >-
        Review the charter, bylaws, board minutes, voting agreements, option
        plan, and founder employment and vesting documents.
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: scale
      missingEvidence: >-
        Point-in-time ARR, recognized revenue, customer and team counts,
        retention cohorts, headcount, locations, cash, burn, and runway.
      whyItMatters: >-
        Growth multiples and funding raised cannot establish revenue quality,
        operating efficiency, or cash available.
      diligencePath: >-
        Obtain monthly management accounts, bank statements, ARR bridge,
        customer-level cohort schedules, payroll roster, and location list.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: valuation-terms
      missingEvidence: >-
        Pre-money or post-money basis, fully diluted share count, security
        terms, liquidation preferences, option-pool treatment, and secondaries.
      whyItMatters: >-
        The announced headline valuation cannot be converted into ownership,
        preference, or dilution economics without these terms.
      diligencePath: >-
        Review the Series B term sheet, stock purchase agreement, pro forma cap
        table, waterfall, and all side letters.
      relatedQuestionRefs: [QO003, QO006]
      relatedTableRefs: [TO001, TO003]
    - type: missing-source
      severity: material
      topic: adverse-events
      missingEvidence: >-
        Company-specific litigation, regulator, outage, incident, sanctions,
        recall, and leadership-change records from authoritative sources.
      whyItMatters: >-
        An unrelated namesake result neither establishes an adverse event nor
        proves that Town has no adverse history.
      diligencePath: >-
        Run entity-verified court, regulator, sanctions, security-incident, and
        executive-change searches using Town.com, Inc. identifiers.
      relatedQuestionRefs: [QO007]
