schemaVersion: "report-v2"
artifact: company-overview
slug: town
runDate: 2026-10-20
company:
  name: Town
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Town is a San Francisco-based, founder-led AI work-assistant company that
    publicly launched in June 2026 and announced a $108 million Series B at a
    $1 billion valuation on October 19, 2026. Financing and company-reported
    early growth are visible, but governance, exact customer and headcount
    figures, valuation terms, and balance-sheet details remain material gaps.
sections:
  - id: identity-and-product
    title: Identity, product, and business model
    body: >-
      Town is a private, San Francisco-based Series B company founded in 2024
      by Jean-Denis Greze and Tony Vincent. Its product is a per-person AI work
      assistant called a Townie, connected to email, documents, calendars, and
      other work systems. Town positions these assistants as proactive agents
      that learn an individual's context and can coordinate with other
      employees' Townies while preserving person-specific permissions. The
      commercial evidence is consistent with a paid software model serving
      both individuals and teams, because the company reports paying customers
      and paying teams, but the reviewed sources do not disclose price,
      contract structure, or gross-margin economics. Product capability and
      privacy statements remain company assertions rather than independently
      measured productivity or security outcomes.
    claimRefs: [CO001, CO002, CO005, CO013, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founder coverage and governance gaps
    body: >-
      Leadership evidence centers on the two founders. Greze is identified as
      co-founder and chief executive and brings infrastructure experience from
      his prior role as Plaid's chief technology officer. Vincent is identified
      as co-founder and brings applied-AI product experience from Google. That
      pairing covers enterprise software infrastructure, product, and applied
      AI, but it also creates visible founder concentration: the assigned
      evidence does not identify a chief financial officer, chief operating
      officer, independent directors, board committees, or succession plan.
      The omission is not evidence that these functions do not exist; it means
      governance quality and key-person mitigation cannot be assessed from the
      reviewed public material and should be resolved through corporate records
      and management diligence.
    claimRefs: [CO002, CO003, CO004, CO016]
    tableRefs: [TO002]
  - id: capitalization-and-scale
    title: Capitalization and early operating signals
    body: >-
      Town's disclosed financing sequence comprises an $18 million seed in
      March 2025, a $55 million Series A announced in June 2026, and a $108
      million Series B announced on October 19, 2026. A third-party tracker
      totals disclosed equity funding at $181 million, explicitly excluding
      debt, grants, acquisitions, secondaries, and IPO proceeds. The latest
      round values the company at $1 billion, but the evidence does not specify
      whether that figure is pre-money or post-money, and funding raised should
      not be read as cash currently available. Town also claims it reached
      seven-digit ARR within weeks of launch and, since July, grew paying
      customers fourfold and paying teams ninefold. Those are directional
      traction signals, not independently verified customer counts, retention,
      revenue quality, or cash-burn measures.
    claimRefs: [CO006, CO007, CO009, CO010, CO011, CO012, CO013, CO016]
    tableRefs: [TO003]
  - id: milestones-and-evidence-boundaries
    title: Milestones and evidence boundaries
    body: >-
      The chronology shows a compressed path from 2024 founding to a June 2026
      public launch and an October 2026 unicorn financing. It also shows why
      diligence must separate dated events from issuer promotion: the strongest
      current operating metrics originate with Town and are repeated through
      syndicated releases. An adverse-search result about a May 2026 breach
      concerns Town CPA, an accounting practice, rather than Town.com, Inc.; it
      must not be treated as evidence of a Town security incident. Conversely,
      that false positive does not prove Town has had no incidents. Company
      claims of SOC 2 Type 2 compliance, a public DPA, and default non-training
      behavior should be tested against the audit report, subprocessors,
      incident history, and contract terms before being treated as verified
      controls.
    claimRefs: [CO002, CO006, CO007, CO008, CO009, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
