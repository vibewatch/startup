  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Customer-level NRR, GRR, gross churn, logo churn, renewal rates, contract duration, satisfaction, cohort curves, and top-customer concentration.
      whyItMatters: Early growth multiples cannot establish durable product-market fit or revenue quality without retention and concentration evidence.
      diligencePath: Request anonymized monthly customer and team cohorts, renewal schedules, churn reasons, contract terms, and top-10 customer revenue concentration from management.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Independent customer-authored production references with deployment dates, user counts, workflow scope, measurable outcomes, and renewal status.
      whyItMatters: A company-hosted testimonial does not establish repeatable production adoption or quantified customer value.
      diligencePath: Obtain three reference calls spanning individual, small-team, and enterprise buyers and reconcile their usage and renewal data with product telemetry.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: adoption-denominators
      missingEvidence: Starting and ending counts underlying the reported 4x paying-customer and 9x paying-team growth, together with exact measurement dates and definitions.
      whyItMatters: Growth multiples without denominators cannot establish absolute scale, team size, conversion, or retention.
      diligencePath: Request a management-certified monthly bridge for paying customers, paying teams, seats, ARR, activations, expansions, contractions, and churn since launch.
      relatedQuestionRefs: [QU002]
