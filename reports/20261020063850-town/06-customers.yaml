    title: Hypothesized customer land-and-expand journey
    type: journey-map
    summary: The public product narrative suggests expansion from an individual workflow foothold into team routines and external coordination, but does not disclose observed conversion or retention between stages.
    data:
      items:
        - name: Workflow trigger
          label: Workflow trigger
          value: "Email- and coordination-heavy work"
          detail: "An individual identifies recurring work that can be delegated."
        - name: Individual activation
          label: Individual activation
          value: "Connect personal work context"
          detail: "The Townie connects to email, documents, calendar, and core systems."
        - name: Repeated use
          label: Repeated use
          value: "Scheduled or event-driven routines"
          detail: "The user delegates recurring briefings, inbox handling, and follow-ups."
        - name: Tool expansion
          label: Tool expansion
          value: "Broader integration surface"
          detail: "Work extends into CRM, productivity, development, and finance tools."
        - name: Team expansion
          label: Team expansion
          value: "Shared workflows and handoffs"
          detail: "Multiple Townies coordinate while remaining attached to individual users."
        - name: External coordination
          label: External coordination
          value: "Customers, partners, and candidates"
          detail: "Townies communicate outside the company over email and text."
    approximationNotes: "Stage order is inferred from company product descriptions; no conversion rates, cohort counts, timing, or value-proportional widths are claimed."
    claimRefs: [CU001, CU002, CU008]
callouts:
  - calloutType: strength
    title: Early adoption signal is unusually fast
    body: Town reports fourfold paying-customer growth and ninefold paying-team growth since July 2026, indicating strong early momentum if definitions and denominators withstand diligence.
    claimRefs: [CU005, CU006]
  - calloutType: risk
    title: Customer durability remains unproven
    body: No retained relevant source discloses retention, churn, renewal, contract-duration, satisfaction, or concentration data, and the only named user proof is a qualitative company-hosted testimonial.
    claimRefs: [CU015, CU016]
