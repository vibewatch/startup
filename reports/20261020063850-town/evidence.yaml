    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Independent customer-authored production references with deployment dates, user counts, workflow scope, measurable
      outcomes, and renewal status.
    whyItMatters: A company-hosted testimonial does not establish repeatable production adoption or quantified customer value.
    diligencePath: >-
      Obtain three reference calls spanning individual, small-team, and enterprise buyers and reconcile their usage and
      renewal data with product telemetry.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: adoption-denominators
    missingEvidence: >-
      Starting and ending counts underlying the reported 4x paying-customer and 9x paying-team growth, together with
