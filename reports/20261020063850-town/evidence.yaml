      Model-provider and connector workload shares, contracts, data terms, service levels, failure modes, fallback
      tests, switching costs, and subprocessor dependencies.
    whyItMatters: >-
      Multi-provider claims do not establish continuity if critical workloads, permissions, or data flows remain
      concentrated in one provider or connector.
    diligencePath: >-
      Obtain the dependency register and contracts, then witness failover tests for a major model, email provider,
      system-of-record connector, and regional service interruption.
    relatedQuestionRefs:
      - QR004
  - type: private-evidence-only
    severity: blocking
    topic: financial-model-gap
    missingEvidence: >-
      Cash balance, monthly net burn, runway, gross margin including model costs, cohort retention, expansion, customer
      and team denominators, pricing realization, and support burden.
    whyItMatters: >-
      Funding raised is not cash available, and percentage growth without starting bases or retention cannot establish
      efficient or durable scaling.
    diligencePath: >-
      Reconcile bank statements, board reporting, monthly financials, invoices, model bills, and cohort exports to the
      announced ARR, customer, team, and financing claims.
    relatedQuestionRefs:
      - QR005
      - QR007
      - QR010
  - type: conflicting-data
    severity: material
    topic: deployment-control
    missingEvidence: >-
      Primary pricing terms, hosting and data-residency options, export and deletion rights, supported MCP boundaries,
      custom-workflow controls, and customer migration evidence.
    whyItMatters: >-
      The only detailed adverse description is competitor-issued and conflicts in part with Town's own claims about
      user-defined routines and MCP support.
    diligencePath: >-
      Review current order forms, product documentation, architecture, export tests, customer references, and a live
      build of a custom workflow with least-privilege controls.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      Relevant public-company metrics, private-round terms, secondary marks, or acquisition benchmarks normalized to a
      defined Town operating metric.
    whyItMatters: Without a comparable metric and defensible multiple, no numeric valuation or target-return range can be supported.
    diligencePath: >-
      Obtain a banker-quality comparable set and reconcile every benchmark to Town's verified ARR, growth, margin, and
      stage.
    relatedQuestionRefs:
      - QV005
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms-gap
