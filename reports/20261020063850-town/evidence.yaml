evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, observer rights, committee structure, executive bench, succession plan, and founder
      employment or vesting terms.
    whyItMatters: Founder concentration and investor governance cannot be assessed from financing announcements alone.
    diligencePath: >-
      Review the charter, bylaws, board minutes, voting agreements, option plan, and founder employment and vesting
      documents.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: >-
      Point-in-time ARR, recognized revenue, customer and team counts, retention cohorts, headcount, locations, cash,
      burn, and runway.
    whyItMatters: Growth multiples and funding raised cannot establish revenue quality, operating efficiency, or cash available.
    diligencePath: >-
      Obtain monthly management accounts, bank statements, ARR bridge, customer-level cohort schedules, payroll roster,
      and location list.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: valuation-terms
    missingEvidence: >-
      Pre-money or post-money basis, fully diluted share count, security terms, liquidation preferences, option-pool
      treatment, and secondaries.
    whyItMatters: >-
      The announced headline valuation cannot be converted into ownership, preference, or dilution economics without
      these terms.
    diligencePath: Review the Series B term sheet, stock purchase agreement, pro forma cap table, waterfall, and all side letters.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Company-specific litigation, regulator, outage, incident, sanctions, recall, and leadership-change records from
      authoritative sources.
    whyItMatters: An unrelated namesake result neither establishes an adverse event nor proves that Town has no adverse history.
    diligencePath: >-
      Run entity-verified court, regulator, sanctions, security-incident, and executive-change searches using Town.com,
      Inc. identifiers.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      An independent market study with a clearly defined workplace-agent category, geography, forecast period, value,
      CAGR, and methodology that can be reconciled to Town's boundary.
    whyItMatters: >-
      Without a denominator, price, and realistic penetration assumption, TAM, SAM, SOM, and valuation comparisons would
      be speculative.
    diligencePath: >-
      Obtain independent analyst data for enterprise AI assistants and triangulate it against role counts, eligible
      organizations, seat deployment, pricing, retention, and attach rate.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: purchasing-economics
    missingEvidence: >-
      Current list and realized pricing, contract length, average seats per account, buyer, budget owner, sales-cycle
      duration, pilot conversion, expansion, and renewal evidence.
    whyItMatters: >-
      These inputs determine serviceable revenue, adoption timing, sales efficiency, and whether disclosed
      customer-growth multiples translate into durable economics.
    diligencePath: >-
      Review pricing and packaging, anonymized contracts, CRM cohorts, pilot-to-paid conversion, deployment and
      retention data, and interview customers and lost prospects.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A current independent, task-level benchmark comparing Town with named alternatives on completion quality,
      reliability, latency, permissions, and administrative control.
    whyItMatters: >-
      Without comparable outcome evidence, integration breadth and assistant collaboration cannot be translated into a
      defensible performance moat.
    diligencePath: >-
      Run a controlled buyer workflow benchmark and obtain reference calls from customers that evaluated Town against at
      least two named alternatives.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort retention, multi-homing rates, workflow depth, time-to-value, and customer migration evidence by individual
      and team plan.
    whyItMatters: >-
      These measures determine whether accumulated context and shared routines create durable lock-in or merely
      temporary convenience.
    diligencePath: >-
      Review anonymized cohort data, expansion and churn by plan, integration counts, and customer interviews focused on
      replacement difficulty.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Revenue by product and tier, realized pricing, discounts, contract duration, collections, deferred revenue,
      backlog, concentration, and accounting-recognition policy.
    whyItMatters: >-
      List prices and growth multiples cannot establish recurring revenue quality or a reliable revenue base for
      valuation.
    diligencePath: >-
      Reconcile the trailing 18 months of invoices, general ledger, contracts, and bank receipts by customer cohort and
      pricing tier.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross margin, model and compute cost by task, support and onboarding cost, CAC, payback, logo churn, net revenue
      retention, and usage cohorts.
    whyItMatters: >-
      These inputs determine whether rapid adoption compounds gross profit or increases losses and future financing
      needs.
    diligencePath: >-
      Obtain monthly cohort exports joining billed revenue, credits consumed, model-provider cost, support time, sales
      spend, churn, and expansion for each plan.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, restricted cash, monthly net burn, runway, debt and lease obligations, approved hiring plan, Series
      B use of proceeds, and the next financing trigger.
    whyItMatters: >-
      Funding raised is not cash available, and capital adequacy cannot be judged without the expense plan and
      obligations.
    diligencePath: >-
      Review bank statements, debt and lease schedules, board budget, monthly cash-flow forecast, headcount plan, and
      downside runway sensitivities.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Sales-cycle length, acquisition channels, commissions, partner economics, win rates, and fully loaded
      customer-acquisition cost.
    whyItMatters: One investor-customer cost testimonial cannot establish repeatable or capital-efficient go-to-market performance.
    diligencePath: >-
      Sample CRM opportunities and customer invoices by channel, then reconcile new ARR to sales and marketing spend and
      partner payments.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: technical-disclosure
    missingEvidence: >-
      Architecture diagrams, connector permission scopes, tenant-isolation design, model-routing policy, evaluation
      methodology, service levels, and incident history.
    whyItMatters: >-
      The product handles sensitive work context and can prepare or execute actions across business systems, so
      architecture and reliability determine enterprise risk.
    diligencePath: >-
      Request a technical diligence session, security architecture packet, subprocessors, penetration-test summary,
      model evaluation results, and twelve months of service metrics.
    relatedQuestionRefs:
      - QE003
      - QE005
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A Town-owned public repository, package registry, engineering talk, practitioner forum, changelog, or other
      activity signal attributable to the company.
    whyItMatters: >-
      Without a developer or practitioner signal, public evidence cannot test release cadence, ecosystem adoption,
      engineering transparency, or implementation friction.
    diligencePath: >-
      Ask for release history, integration documentation, API materials, engineering references, and customer
      administrators who have deployed multiple connectors.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent enterprise customer references, production benchmarks, mature review-platform data, and third-party
      assessments of task accuracy and failure handling.
    whyItMatters: >-
      Current evidence is dominated by company materials and one competitor-authored review, limiting confidence in
      product maturity and measurable outcomes.
    diligencePath: >-
      Obtain reference calls, anonymized task-success cohorts, action-error logs, renewal data, and independent security
      and reliability assessments.
    relatedQuestionRefs:
      - QE004
      - QE005
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer-level NRR, GRR, gross churn, logo churn, renewal rates, contract duration, satisfaction, cohort curves,
      and top-customer concentration.
    whyItMatters: >-
      Early growth multiples cannot establish durable product-market fit or revenue quality without retention and
      concentration evidence.
    diligencePath: >-
      Request anonymized monthly customer and team cohorts, renewal schedules, churn reasons, contract terms, and top-10
