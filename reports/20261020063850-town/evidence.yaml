    whyItMatters: Growth multiples without denominators cannot establish absolute scale, team size, conversion, or retention.
    diligencePath: >-
      Request a management-certified monthly bridge for paying customers, paying teams, seats, ARR, activations,
      expansions, contractions, and churn since launch.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: blocking
    topic: security-controls
    missingEvidence: >-
      SOC 2 report and bridge letter, exceptions, penetration-test summary, security architecture, tenant-isolation
      evidence, incident register, recovery objectives, and remediation history.
    whyItMatters: >-
      Town can access and act across sensitive business systems, so a certification claim alone does not establish that
      authorization, isolation, monitoring, and recovery controls are effective.
    diligencePath: >-
      Review the full assurance package under NDA and run technical red-team tests covering cross-tenant access, prompt
      injection, connector privilege, revocation, rollback, and audit logs.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incident-history-gap
    missingEvidence: Entity-verified Town.com litigation, regulatory, enforcement, outage, breach, and customer-complaint history.
    whyItMatters: >-
      Namesake-heavy results cannot establish either an adverse event or the absence of one, and undisclosed history
      could change legal, security, and reputation risk.
    diligencePath: >-
      Search verified legal entity names and jurisdictions, review regulator and court records, and reconcile findings
      with management representations, insurer loss runs, and the internal incident register.
    relatedQuestionRefs:
      - QR003
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: model-dependency
