    {
      "id": "deployment-fit-and-implementation-friction",
      "title": "Deployment fit and implementation friction",
      "body": "Deployment fit is strongest when matched to the right customer motion. Enterprise merchants need checkout or post-purchase integration and brand-safety controls; advertisers need campaign, creative, CPA/ROAS, and landing-page optimization; Shopify merchants need an installable app with low engineering lift; and mParticle customers need clean event pipelines and integrations. Public materials show all four paths, but the risk profile differs. Beach Bunny’s case study emphasizes operational time saved in channel launches, SoFi emphasizes data-pipeline simplification, and AfterSell emphasizes no-code app setup. The adverse evidence sits mostly in the app-review layer: Shopify shows a small one-star minority, and Digismoothie cites glitches, slower load times, support delays, and analytics-depth limits. For enterprise checkout, diligence should separately test page-load impact, consent provenance, offer suppression, and holdout design.",
      "claimRefs": [
        "CU004",
        "CU017",
        "CU023",
        "CU025",
