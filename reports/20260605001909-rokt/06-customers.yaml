    {
      "id": "retention-expansion-and-durability",
      "title": "Retention, expansion, and durability evidence",
      "body": "Rokt’s public retention proof is better than a logo slide but weaker than a retention cohort. The strongest durability evidence is behavioral: Fanatics returned and publicly planned to start with Pay+ and Thanks before expanding into Ads and Catalog; Backcountry is presented as returning after testing alternatives; onX reports statistical significance without increased cancellations or uninstalls; and AfterSell reviews remain highly positive at scale. These signals suggest customer value can persist when Rokt protects user experience and provides measurable economics. They still do not answer investor-grade retention questions. Public sources do not disclose net revenue retention, gross revenue retention, churn, renewal rates, average contract length, revenue concentration, or cohort performance by segment. Treat public proof as evidence of value creation, not as proof of durable contracted revenue.",
      "claimRefs": [
        "CU005",
