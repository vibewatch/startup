    {
      "id": "named-customer-proof-and-outcomes",
      "title": "Named customer proof and measurable outcomes",
      "body": "The named proof base is unusually rich for a private commerce-media company. Rokt publishes multiple customer stories with explicit outcomes: Wine.com at 5.8x ROAS, Flamingo at 60% lower CPA, Tails.com at 153% conversion uplift, ClassPass at up to 12% CVR lift, onX at 44% upsell-conversion uplift, Tatcha at 8.5x revenue performance, and M&S at £6.5 million in incremental yearly revenue. Independent corroboration is narrower but real: The Drum repeats the Tails.com outcome in an industry article, CB Insights lists a broader customer set and quotes Lyft, and Shopify hosts live AfterSell app ratings and reviews. The chapter therefore treats quantified case studies as production customer proof, while treating logo lists and low-text advertorial references as supporting but weaker evidence.",
