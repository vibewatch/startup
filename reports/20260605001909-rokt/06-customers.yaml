    {
      "id": "adoption-scale-and-platform-reach",
      "title": "Adoption scale and platform reach",
      "body": "Public adoption signals support broad reach but not a clean active-customer denominator. Retail Tech Innovation Hub reports Rokt is on track for more than 10 billion 2026 transactions across 33,000-plus partner companies, while Enterprise Times reports more than 7.5 billion 2025 transactions across thousands of ecommerce businesses. AfterSell adds a separate SMB-style signal, with the app store showing 849 reviews and AfterSell’s site claiming trust from more than 40,000 brands. Platform partners can multiply reach: Afterpay references thousands of retail partners, and Klarna reports 168 million Rokt-powered transactions. These are valuable adoption proxies, but they mix transactions, partners, brands, app users, and customers; diligence should request active accounts by segment, revenue by segment, and the share of transactions that generate monetizable revenue.",
