    {
      "id": "checkout-trust-and-advertiser-quality",
      "title": "Checkout trust, offer quality, and merchant-brand risk",
      "body": "Rokt’s own consumer-guardrails article is useful adverse evidence because it admits the operating constraint: checkout offers work only when relevance, low friction, easy decline, restrained volume, and brand fit are preserved. If irrelevant or excessive offers appear in a retailer’s purchase path, the downside is not just lower click-through; it can transfer resentment to the merchant and advertiser. Rokt’s campaign policies and sensitive-category blocking are meaningful mitigations, but they also prove that the network requires active policing. This is a trust business as much as an ad-tech business. Diligence should sample live placements, review rejected creative logs, test easy-decline behavior on mobile, and inspect complaint escalation by partner and advertiser. A small policy lapse can become a reputation problem if consumers believe the retailer sold access to their completed transaction.",
      "claimRefs": [
