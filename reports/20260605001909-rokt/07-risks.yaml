    "number": 7,
    "title": "Risks",
    "summary": "Rokt’s principal risks concentrate around privacy and consent, checkout consumer protection, merchant trust, platform dependency, M&A integration, IPO timing, and governance execution. Public evidence supports meaningful mitigations, but several residual exposures require private diligence rather than stronger public claims."
  },
  "sections": [
    {
      "id": "risk-ranking-and-scope",
      "title": "Risk ranking and scope",
      "body": "Rokt’s risk profile is not a single existential lawsuit or balance-sheet problem; it is an accumulation of risks created by inserting a data-driven offer engine into the most sensitive moment of ecommerce. The highest residual exposure sits at the intersection of consent, consumer perception, partner brand trust, and platform dependency. Company-specific evidence is strongest for the privacy architecture, offer-policy controls, M&A execution scope, public litigation docket, Shopify merchant sentiment, and IPO-window delay. Sector-wide regulatory evidence is strongest for dark patterns, negative options, commercial email, text-message consent, privacy rights, and platform-gatekeeper scrutiny. The underwriting stance should therefore avoid overstating that regulators have already targeted Rokt for dark patterns, while still treating the transfer risk as material because Rokt’s model depends on relevance, consent, and low-friction acceptance at checkout.",
