    {
      "id": "governance-ma-and-execution-risk",
      "title": "Governance, M&A integration, and execution risk",
      "body": "Execution risk increased as Rokt moved from a focused transaction-moment network into a broader portfolio spanning Aftersell, Upcart, Canal/Catalog, and mParticle. The mParticle transaction adds a real-time CDP, founders in leadership roles, and a data-control promise, but AdExchanger’s independent coverage underscores the strategic question of why an ecommerce offer network should own a CDP at all. AfterSell adds Shopify-native SMB reach and post-purchase functionality, but it also requires maintaining merchant trust, app-store compliance, and product continuity. Governance risk is not a critique of the team; it is a diligence request. Bruce Buchanan is central to public strategy messaging, mParticle founders are central to the CDP integration, and the IPO delay makes private-company governance, board independence, incentive alignment, and integration milestones more important than a near-term public-market discipline mechanism.",
