    {
      "id": "portfolio-expansion-and-product-maturity",
      "title": "Portfolio expansion and product maturity",
      "body": "Rokt\u2019s current product surface is partly organic and partly acquired. AfterSell and Upcart extend the company from enterprise commerce media into Shopify-native post-purchase and checkout upsells, while mParticle supplies a real-time customer-data and identity layer that Rokt now describes as foundational to SDK+. The public evidence supports maturity in merchant-facing workflows: official docs, Shopify listings, mobile SDK repositories, and partner docs show real integration surfaces rather than vaporware. The caveat is that product breadth also raises integration debt: different code paths across SDK+, mParticle, Shopify, Cart API, Catalog, and mobile SDKs must be kept coherent as Rokt adds Canal/Catalog inventory and new shoppable ad demand. Portfolio diligence should therefore test whether these surfaces share a unified identity, permissions, and measurement model or remain stitched together by account-management process.",
      "claimRefs": [
