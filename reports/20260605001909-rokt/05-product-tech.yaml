    "number": 5,
    "title": "Product & Technology",
    "summary": "Rokt delivers a transaction-moment decisioning platform embedded into merchant checkout and post-purchase flows. Public documentation proves real SDK/API/CDP/Shopify surfaces and a plausible first-party data loop, while model performance, incrementality, latency/SLA history, and customer-specific privacy evidence remain the major technical diligence gaps."
  },
  "sections": [
    {
      "id": "transaction-moment-workflow",
      "title": "Transaction-moment workflow and economics",
      "body": "Rokt is best understood as a transaction-moment decisioning layer rather than a conventional SaaS dashboard. A merchant embeds Rokt surfaces into cart, payment, confirmation, or post-purchase pages; Rokt then uses purchase context, first-party signals when supplied, and advertiser or catalog inventory to decide whether to show an offer, upsell, product, payment-related incentive, or nothing. The economic loop is two-sided: merchants seek incremental profit and AOV without degrading checkout conversion, while advertisers pay for outcome-oriented access to high-intent shoppers. Public docs make the workflow concrete through Rokt Ads, Rokt Ecommerce, Thanks, Pay+, and Cart API examples, but investor diligence should keep gross advertiser spend, partner payout, and Rokt net revenue separate because public materials use different denominators for value created and revenue retained.",
      "claimRefs": [
