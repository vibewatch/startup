    {
      "id": "ai-data-advantage-and-measurement",
      "title": "AI, data advantage, and measurement claims",
      "body": "Rokt\u2019s strongest technology claim is not a named model architecture; it is the closed-loop feedback system created by transaction data, merchant first-party signals, advertiser outcomes, and repeated placement tests. Official sources say the Rokt Brain evaluates intent, predicted lifetime value, behavioral context, quality thresholds, and low-latency constraints, and that it learns from impressions and conversions. Those mechanisms are plausible for a high-scale network, especially after the mParticle merger improves identity resolution and event consistency. However, most performance claims remain company-reported: public sources do not disclose holdout design, independent incrementality audits, model cards, feature governance, or accuracy metrics. Treat the AI/data advantage as credible but not independently quantified. The practical test is whether Rokt can prove incremental profit after accounting for offer suppression, no-show decisions, and any checkout completion drag.",
