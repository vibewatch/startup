    {
      "id": "capital-adequacy-and-diligence-gaps",
      "title": "Capital adequacy, liquidity, and diligence blockers",
      "body": "The January 2025 secondary strengthens Rokt’s shareholder base and employee/investor liquidity story, but it does not prove new primary cash on the balance sheet. The company also committed to a US$300 million mParticle investment and had earlier acquired AfterSell on undisclosed terms, so cash use, financing mix, and integration costs are material. Adverse evidence is not existential but matters for timing: BBRW and Grafa reported that Rokt deferred a 2026 IPO amid AI-driven market volatility, delaying public-market liquidity. Blind provides only a weak employee-signal page rather than confirmed layoffs, while the AdsPostX docket shows contractual terms may matter. Before underwriting, investors need audited statements, revenue-recognition memos, cohort economics, top-customer exposure, partner payout schedules, cash, debt, burn, and acquisition ROI.",
