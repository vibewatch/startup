    {
      "id": "monetization-mechanics",
      "title": "Transaction-moment monetization mechanics",
      "body": "Rokt monetizes the moment between purchase intent and confirmation by matching merchants’ owned checkout or post-purchase surfaces with advertiser offers, upsells, and data-driven relevance. Public sources describe two economics that must not be conflated. Rokt says its partner model returns US$7 of every US$8 of value to partners, implying a value-share construct favorable to merchants; Sacra describes a 50/50 split of checkout-offer ad spend with Rokt, which is a different denominator. Advertiser-side economics are clearer: Rokt Ads says brands pay only for outcomes or shopper engagement, and Rokt claims high click-through and conversion rates in transaction-context placements. Diligence should reconcile gross value created, advertiser spend, partner payouts, Rokt net revenue, and the effect on checkout conversion.",
