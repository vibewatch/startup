    "number": 4,
    "title": "Financials",
    "summary": "Rokt’s public financial story supports a fast-growing private commerce-media company at roughly US$600 million of 2024 revenue and a US$3.5 billion January 2025 secondary valuation. The diligence blocker is not top-line evidence; it is the absence of audited margin, gross-to-net, cash, debt, burn, concentration, retention, and acquisition-ROI disclosures."
  },
  "sections": [
    {
      "id": "public-financial-baseline",
      "title": "Public baseline: fast growth, private-company opacity",
      "body": "Rokt’s financial headline is unusually strong for a private commerce-media company but still not audited in the public record. The strongest source is Rokt’s own January 2025 secondary announcement: management said 2024 revenue reached US$600 million, up 43% year over year, and that the company had grown revenue tenfold across six years while maintaining profitability. Sacra independently estimated the same US$600 million 2024 ARR and framed the secondary value as roughly 5.8x forward revenue, but this is still an estimate rather than a filed income statement. The right diligence posture is therefore to accept the revenue claim as well supported by company and analyst/partner repetition, while treating gross margin, EBITDA margin, net income, cash, debt, burn, runway, concentration, and retention as open private-company diligence items. Material caveat.",
