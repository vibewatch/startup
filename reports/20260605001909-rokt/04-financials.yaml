    {
      "id": "revenue-mix-and-acquisitions",
      "title": "Acquisitions broaden the mix but add integration and capital questions",
      "body": "The mParticle and AfterSell acquisitions are financially material because they extend Rokt beyond a pure checkout ad network into first-party data activation and Shopify SMB upsell workflows. mParticle was disclosed as a US$300 million investment and was reported by AdExchanger as a 100% stake; Rokt says it will double investment in the CDP and that joint clients can see up to 50% better outcomes. AfterSell adds more than 20,000 SMB merchants and Shopify upsell capability, but its purchase terms were not disclosed. Sacra’s estimate that roughly 90% of revenue came from advertising before these deals implies revenue mix could shift, but public sources do not yet quantify CDP subscription revenue, AfterSell app revenue, implementation services, or acquisition payback.",
