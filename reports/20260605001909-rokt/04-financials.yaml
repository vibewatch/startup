    {
      "id": "unit-economics-and-comps",
      "title": "Unit economics: benchmarkable drivers, undisclosed Rokt margins",
      "body": "Rokt’s margin path is directionally attractive if it can preserve a net take rate on high-intent transaction surfaces, but public evidence does not disclose Rokt gross margin or EBITDA margin. Public comparables show why the denominator matters. The Trade Desk reports revenue net of supplier payments, while Criteo separates revenue, traffic-acquisition costs, gross profit, and Contribution ex-TAC; Magnite explicitly warns that a lower take rate can reduce revenue and Contribution ex-TAC even when platform spend increases. These filings are not Rokt facts, but they define the underwriting questions: does Rokt report gross or net revenue, how large are partner payouts, how much delivery cost sits in AI/data infrastructure, and how durable are advertiser bid prices after merchants and Rokt share economics?",
