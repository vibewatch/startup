  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Rokt is a 2012-founded, New York-headquartered ecommerce technology company built around AI-powered transaction-moment relevance. Public evidence supports strong 2024 revenue growth, a US$3.5B January 2025 secondary valuation, material 2024-2025 M&A, and a delayed 2026 IPO path, while audited financials, cap-table rights, exact 2026 headcount, and legal/workplace outcomes remain diligence gaps."
  },
  "sections": [
    {
      "id": "identity-product-and-scale",
      "title": "Identity, product model, and visible scale",
      "body": "Rokt’s public identity is unusually consistent across official and independent sources: it is an ecommerce technology company focused on the “Transaction Moment,” using AI and machine learning to match shoppers with relevant offers, products, payment options, or advertiser messages at checkout and post-purchase. The operating model is not simply a SaaS subscription. Rokt describes a closed network and partnership model that returns most created value to partners, while Sacra characterizes the core product as retailer checkout software that splits advertising spend with Rokt. The acquisition trail also broadens the definition: AfterSell adds Shopify upsell tools, mParticle adds a customer-data platform, and Canal adds third-party inventory integration. Current scale is meaningful but still mostly company-reported: official releases cite billions of annual transactions, hundreds of millions of customers, thousands of ecommerce businesses, and 700+ employees in 2025, while precise audited revenue quality, take rate, margin, and active-client retention remain private.",
