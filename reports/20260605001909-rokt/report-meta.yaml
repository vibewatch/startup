    Shopify cart and post-purchase upsells from AfterSell, and real-time customer-data-platform capabilities
    added through mParticle.
  customerFocus: >-
    Enterprise merchants, ecommerce platforms, advertisers, marketplaces, and Shopify merchants seeking to
    monetize or personalize high-intent checkout and post-purchase journeys.
