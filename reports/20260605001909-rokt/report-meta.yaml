companyProfile:
  summary: >-
    Rokt is a 2012-founded, New York-headquartered ecommerce technology company focused on AI-powered
    relevance inside transaction moments. Its platform embeds offers, messages, upsells, and customer-data
    workflows into checkout, cart, and post-purchase surfaces; public evidence supports meaningful scale,
    including claimed US$600 million 2024 revenue, 43% year-over-year growth, profitability, 700+ employees
    in 2025, and a January 2025 secondary transaction valuing the company at US$3.5 billion.
