        title: 图表附录
        blocks:
          - type: callout
            title: 不要夸大公司特定执法风险
            body: 抓取到的一级来源没有显示针对 Rokt 的公开隐私或暗黑模式执法行动；风险来自高审查行业的迁移，并被 Rokt 的结账数据和同意流程放大。
