    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 概率信号
      - 修正触发条件
    rows:
      - - 牛市
        - 收入增长保持在 35% 以上；盈利能力和留存经过审计
        - 以 US$600M 为基准，7-9x 收入的溢价区间意味着价值高于 US$4.2B-US$5.4B
        - S-1 确认利润率、NRR、集中度和同意控制
        - 若价格仍在 US$3.5B 附近，转向买入
      - - 基准
        - 增长放缓但仍强劲；上市广告技术倍数仍分化
        - EV 调整前，5-6x 收入支持约 US$3.0B-US$3.6B
        - 私有尽调确认质量，但经济性不是品类领先
        - 跟踪，或只在有结构保护时出价
      - - 熊市
        - 增长低于 20%、利润率下降、监管收紧或商户流失
        - EV 调整前，2-4x 收入支持约 US$1.2B-US$2.4B
        - 不利监管或商户信任证据增加
        - 回避，或要求大幅折价
      - - IPO 动能
        - 更新的估值传闻高于 US$3.5B
        - 更高价格需要经审计证明，而不是稀缺性溢价
        - S-1 需求和可比公司倍数改善
        - 如果定价依赖炒作，回避
    notes: 情景估值是把收入倍数套用在报道的 US$600M 收入基准上得到的示例区间；不是评估值，也不是企业价值。
    claimRefs:
      - CV004
      - CV005
      - CV029
      - CV030
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 状态
      - 对 Rokt 的参考价值
      - 局限
    rows:
      - - The Trade Desk
        - 上市广告技术平台；2025 Form 10-K
        - 高溢价独立广告技术基准
        - 不是结账场景专属商业媒体
      - - Criteo
        - 商业媒体 / 零售媒体上市公司
        - 最接近的上市零售媒体运营类比
        - 更成熟、增长更低
      - - AppLovin
        - 高倍数移动广告平台
        - 展示规模化算法广告平台的上行空间
        - 移动游戏敞口不是 Rokt 的模式
      - - Klaviyo
        - 上市电商营销自动化平台
        - 同样邻近电商买方和留存预算
        - SaaS 模式不同于平台抽成经济性
      - - Maplebear / Instacart
        - 上市交易挂钩型商业平台
        - 广告附着在零售交易上
        - 杂货平台经济性差异很大
      - - Zeta Global
        - 上市营销技术和数据驱动营销平台
        - 数据、隐私、NRR 和集中度风险可作参考
        - 企业营销云不是结账媒体
      - - Multiples.vc 广告技术指数
        - EV/LTM 收入和 EBITDA 倍数背景
        - 提供市场倍数约束
        - 定价日必须刷新筛选数据
    notes: 这只是部分可比对象；没有上市公司能完全对应 Rokt 的交易时刻网络、商户经济性和 mParticle CDP 组合。
    enumerationScope:
      coverage: partial
      basis: Representative public adtech, martech, commerce-media, and retail-media comparables available before 2026-06-05.
