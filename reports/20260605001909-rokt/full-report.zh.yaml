      - number: '2.2'
        title: 规模测算视角：邻近市场很大，可服务楔形较小
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持区间化判断。IAB 相关报道把 2026 年美国零售媒体规模放在约 $74.06B，EMARKETER 给出相近但更低的美国数字 $69.33B，WARC 相关报道把全球零售媒体放在
              $196.7B。这些数字是可信的邻近市场天花板，不是 Rokt 专属 TAM。务实的 SAM
              筛选应从电商交易量开始，再收窄到流量、利润率、客户信任和结账变现意愿都足够，且不会伤害转化的数字商户。美国人口普查数据称 2025 年 Q2 美国电商销售额为 $304.2B、电商占比
              16.3%，证明交易触点很大，但并没有说明多少广告库存可以安全插入。对 Rokt
              而言，有用的规模模型应分层：全球零售媒体作为天花板，美国零售媒体作为更近的预算池，非零售商业媒体作为扩张选项，结账/购后变现才是可服务楔形。
