  - id: TV005
    title: 投资论点失效和否决触发器表
    columns:
      - 触发器
      - 阈值
      - 如何传导到论点
      - 行动含义
    rows:
      - - 收入增长失速
        - 低于约 20%，且没有利润率扩张抵消
        - 倍数向成熟广告技术压缩
        - US$3.0B 以上回避
      - - 经审计盈利能力不及预期
        - EBITDA 或毛利率显著低于公开信息暗示
        - 高增长叠加盈利能力的溢价叙事减弱
        - 重置估值框架
      - - 集中度暴露
        - 头部商户、广告主或合作伙伴敞口高
        - 网络质量不如声称的多元化
        - 要求折价或保护条款
      - - 同意机制 / 结账审查升温
        - 监管机构或商户限制优惠推荐流程
        - 库存、转化或抽成率下降
        - 暂停，直到合规证据过关
      - - IPO 价格超过证据支撑
        - 没有经审计质量指标，却把价格定在明显高于 US$5.0B
        - 回报不对称性恶化
        - 不参与
      - - 并购整合不达标
        - mParticle 无法交叉销售，或带来成本拖累
        - 扩张论点减弱
        - 下调上行情景
    notes: 触发阈值是投资测算，用来聚焦尽调，不是精确契约。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV030
      - CV034
