        title: 里程碑、负面事件与 IPO 准备度
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，这家公司反复扩展地域、产品范围和资本渠道：2014 年开始进入美国，2015 年上线 Ticketmaster，2016 至 2021 年连续完成主要融资轮，2022 年 Rokt 估值达到
              US$2.4B，2024-2025 年又带来 AfterSell、mParticle、Canal、管理层扩充，以及 US$3.5B 老股交易。同一记录也包含尽调警示。公开法律和负面来源识别出 Rokt 对
              AdsPostX 提起的商业秘密诉讼、Rokt 或相关方否认的职场和合同指控摘要，以及可信度更偏方向性而非确定性的公开裁员讨论页面。最重要的是退出时点：2026 年媒体报道称，Rokt 推迟了原计划 IPO，因为
              AI 驱动的公开市场波动让上市变成干扰；但据 Grafa 报道，公司仍然盈利、无债且现金充足。因此正确的事实底座不是“现在已可
              IPO”，而是“后期公司、按公司表述已盈利、正在为公开市场做准备，但上市时点已明确推迟，法律/职场指控需要由律师主导核验”。
