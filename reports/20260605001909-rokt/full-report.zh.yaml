      - number: '2.4'
        title: 结构性驱动因素与采用阻力
        blocks:
          - type: paragraph
            body: >-
              结构性驱动因素很清楚：隐私规则收紧后，第一方数据更有价值；零售商想要更高利润率的媒体收入；广告主想要闭环归因；结账是确认意图的稀缺时刻。商业、媒体、忠诚度和客户体验团队越来越共同承担增长责任，也让 Rokt
              的逻辑受益。约束同样重要。买方已经被碎片化零售媒体网络、不一致指标、上升成本和围墙花园式报告拖累。若优惠分散购物者注意力、降低转化或损害品牌信任，商户可能抵触。大型零售商一旦拥有受众规模、销售人才和测量基础设施，就能自建媒体网络。隐私监管和同意要求会约束可激活的数据。经济周期可能压低可自由支配的效果预算；若没有增量性证明，Rokt
              可能被视为又一层归因工具，而不是持久收入渠道。
