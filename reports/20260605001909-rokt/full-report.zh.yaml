              Rokt 的公开留存证明强于客户标识幻灯片，但弱于留存队列。最强的耐久性证据是行为：Fanatics 回归，并公开计划先从 Pay+ 和 Thanks 开始，再扩展到 Ads 和
              Catalog；Backcountry 被描述为测试替代方案后回归；onX 报告统计显著且没有增加取消或卸载；AfterSell 评价在规模化后仍高度正面。这些信号说明，只要 Rokt
              保护用户体验并给出可测量经济性，客户价值可以持续。它们仍未回答投资者级别留存问题。公开来源没有披露净收入留存、总收入留存、流失、续约率、平均合同期限、收入集中度或按细分划分的队列表现。应把公开证明视为价值创造证据，而不是持久合同收入证明。
