      - number: '7.4'
        title: 平台、安全、子处理方与反垄断依赖
        blocks:
          - type: paragraph
            body: >-
              Rokt 的增长依赖商户网站、Shopify 应用触点、云和消息供应商、数据平台，以及大型数字生态的访问权。Shopify 公开应用规则把这种依赖说得很清楚：应用必须实现隐私合规
              webhook，否则可能被拒。Rokt 的子处理方清单又增加了第二层运营依赖，覆盖 AI 模型提供商、AWS、Akamai、Google Cloud、SendGrid、Twilio 和可观测性工具。合规门户和
              Nudge 资料上的认证降低了安全尽调风险，但私有 SOC 报告、事件历史、渗透测试结果和子处理方变更控制仍然必要。反垄断风险今天大多是间接的：DMA 针对的是守门人平台而不是
              Rokt，但守门人规则、应用商店政策、浏览器隐私变化，或平台自己的结账变现产品，都可能限制 Rokt 的分发或定价权。
            claimRefs:
