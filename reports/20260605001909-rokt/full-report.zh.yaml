      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景框架应把已报道事实和估算逻辑分开。已报道事实包括 US$3.5 billion 老股估值、US$600 million 收入说法、43% 增长说法、与 mParticle 的组合，以及可见的 IPO
              准备动作。估算逻辑从赋予倍数、增长衰减、利润率耐久性和监管折扣开始。乐观情景里，Rokt 能拿到溢价，因为交易时刻广告可衡量、零售媒体市场继续扩张，且 mParticle 增强数据激活。基准情景里，2025 年
              1 月价格合理，但不明显便宜，因为公开市场广告技术倍数仍不均衡。悲观情景里，增长放缓，商户信任或监管恶化，或火热 IPO
              窗口把公司定价推到证据之上。实际承销立场应要求证据证明：扣除合作伙伴分成后，交易时刻为商户和广告主创造的是增量利润，而不只是总媒体量。这个差别很重要，因为同一个收入口径会因留存、利润率、集中度和投诉率不同，支撑出非常不同的结果。
