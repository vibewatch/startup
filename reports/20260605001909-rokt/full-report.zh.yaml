            body: >-
              最适合理解 Rokt 的方式，是把它看成交易时刻决策层，而不是传统 SaaS 仪表盘。商户把 Rokt 触点嵌入购物车、支付、确认或购后页面；Rokt
              随后用购买情境、商户提供时的第一方信号，以及广告主或目录库存，决定是否展示优惠、增购、商品、支付相关激励，或什么都不展示。经济循环是双边的：商户想在不拖累结账转化的情况下获得增量利润和
              AOV，广告主则为触达高意图购物者的结果导向渠道付费。公开文档通过 Rokt Ads、Rokt Ecommerce、Thanks、Pay+ 和 Cart API
              示例把工作流具体化，但投资者尽调应把广告主总支出、伙伴分成和 Rokt 净收入分开，因为公开材料对创造价值和留存收入使用了不同分母。
