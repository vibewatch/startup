      - number: '7.5'
        title: 财务模型、IPO 时点与集中度风险
        blocks:
          - type: paragraph
            body: >-
              财务风险的核心不在短期偿付能力，而在估值能否撑住、流动性兑现节奏，以及集中度不透明。独立报道称，Rokt 因公开市场围绕 AI 赢家和输家的波动，推迟或暂停了 2026 年
              IPO；另有报道也称，公司仍保持盈利、无债且现金充裕。这个组合不是困境信号，但会削弱公开市场验证的紧迫性，也可能拉长投资者流动性周期。公开资料仍未披露头部商户占比、平台合作伙伴集中度、广告主投放集中度、合同期限、总收入到净收入拆分，或按分部划分的队列留存。如果增长最快的触点依赖少数企业伙伴、Shopify
              分发，或 mParticle 交叉销售，模型从外部看可以很分散，内部却仍保留集中的收入和政策暴露。
            claimRefs:
              - CR023
              - CR024
              - CR039
