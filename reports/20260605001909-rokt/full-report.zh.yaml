      - number: '5.5'
        title: 信任、安全、隐私与技术风险
        blocks:
          - type: paragraph
            body: >-
              对一家私营、邻近广告技术的公司而言，Rokt 的隐私和安全姿态高于平均水平，因为它公开信任中心，并声称拥有 ISO 27001、SOC 1、SOC 2、子处理方控制、隐私监管覆盖和 Bugcrowd
              计划。产品仍依赖敏感数据流：SDK+ 和 mParticle 示例包括明文或哈希邮箱、手机号、客户 ID、支付类型、银行卡
              BIN、订单金额和购物车内容。由此产生的风险不只是泄露风险，还包括同意来源、数据最小化、购物者意外感、品牌安全控制、页面加载影响，以及结账体验带来的法律/声誉外溢。公开负面来源集不能证明产品安全失败，但它强化了尽调应索取事件历史、DPA、子处理方清单、模型治理和商户特定转化留置组数据。这些文件应匹配到每条拟议集成路径，而不是作为通用企业安全材料泛泛审阅。
