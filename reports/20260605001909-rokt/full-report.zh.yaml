  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与购买路径
        blocks:
          - type: paragraph
            body: >-
              不应把 Rokt 的客户基础读成一张同质化 SaaS 账户名单。公开证据基础分成五条路径：广告主在高意图交易时刻购买基于结果的获客；商户或零售商把结账、确认和购后触点变现；Klarna 和 Afterpay
              等平台伙伴能把 Rokt 体验分发给大量用户和零售关系；Shopify 商户用 AfterSell 做无需代码的购后增购；mParticle
              客户在合并后使用第一方数据激活。这种分层很重要，因为每条路径的买方、用户、付款方、部署工作和收入风险都不同。Wine.com 或 Flamingo 案例研究证明广告主需求；Backcountry、Fanatics
              或 Beach Bunny 引用证明商户库存和体验控制；Shopify 评价证明应用市场拉力；M&S、Tatcha、onX 和 SoFi
              证明数据平台相关性。因此，可信的尽调姿态是分别承销每个细分，而不是过度看重客户标识列表或总交易量。
