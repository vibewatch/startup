          detail: US$3.5B 老股交易意味着约 5.8x 收入
        - id: n3
          label: 市场支撑
          detail: 零售 / 商业媒体增长仍向好
        - id: n4
          label: 证据缺口
          detail: 经审计利润率、NRR、集中度和条款缺失
        - id: n5
          label: 反向叠加因素
          detail: 监管风险与 IPO 窗口风险
        - id: n6
          label: 决策
          detail: 观察；非公开尽调后再考虑有条件出价
    approximationNotes: 流程是定性决策链，不是概率模型。
    claimRefs:
      - CV004
      - CV005
      - CV021
      - CV023
      - CV033
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 示意估值区间最受收入倍数影响，而该倍数套在据称收入基准上。
    data:
      items:
        - label: 2x 收入悲观情景
          value: 1200
        - label: 4x 收入悲观 / 基准情景
          value: 2400
        - label: 5.8x 2025 年 1 月锚点
          value: 3500
        - label: 7x 乐观情景
          value: 4200
        - label: 9x 高位乐观情景
          value: 5400
    approximationNotes: 数值单位为 US$ 百万，将收入倍数套用于据称 US$600M 收入，不调整现金、 债务、稀释或优先权。
    claimRefs:
      - CV004
      - CV005
      - CV035
      - CV036
      - CV037
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景估值区间表明，即便公司质量信号强，下行保护仍然重要。
    data:
      items:
        - label: 悲观估值区间
          low: 1200
          high: 2400
        - label: 基准估值区间
          low: 3000
          high: 3600
        - label: 乐观估值区间
          low: 4200
          high: 5400
        - label: 传闻估值警戒区
          low: 5000
          high: 7200
    approximationNotes: 这些区间属于投资测算；纳入传闻估值带只是作为警示参照，并非已验证的 估值意见。
    claimRefs:
      - CV029
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Rokt 在规模和市场上得分较高，但证据质量和估值安全边际压住了建议上限。
    data:
      items:
        - label: 市场顺风
          value: 8
          unit: /10
        - label: 规模证明
          value: 8
          unit: /10
        - label: 产品护城河
          value: 7
          unit: /10
        - label: 财务披露
          value: 4
          unit: /10
        - label: 监管风险
          value: 4
          unit: /10
        - label: 估值安全边际
          value: 5
          unit: /10
        - label: 退出准备度
          value: 6
          unit: /10
    approximationNotes: 这些评分基于公开证据，用来辅助投资委员会判断，不是外部评级。
    claimRefs:
      - CV021
      - CV026
      - CV033
      - CV034
      - CV040
