        blocks:
          - type: paragraph
            body: >-
              下一步投资动作应是收集证据，而不是追求虚假的精确。在 IC 从观察转向买入前，应要求提供经审计收入确认、总收入到净收入的合作伙伴分成经济性、毛利率、EBITDA
              桥接、净收入留存、头部客户集中度、商户流失、广告主队列 ROI、同意 / 投诉报告，以及收购整合指标。IPO 窗口猜测适合放进催化剂观察清单，不适合作为估值证据。如果 Rokt 提交
              S-1，尽调应立即围绕经审计财务、风险因素、关联方或优先权披露，以及募集资金用途刷新。此前，有条件出价应锚定在 2025 年 1 月价格或更低；只有证明其公开市场溢价耐久性后，才保留上行参与。
