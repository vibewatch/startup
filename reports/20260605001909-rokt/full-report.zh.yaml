      - number: '5.4'
        title: AI、数据优势与测量主张
        blocks:
          - type: paragraph
            body: >-
              Rokt 最强的技术主张不是某个具名模型架构，而是由交易数据、商户第一方信号、广告主结果和反复投放测试构成的闭环反馈系统。官方来源称，Rokt Brain
              会评估意图、预测生命周期价值、行为情境、质量阈值和低延迟约束，并从展示和转化中学习。对一个高规模网络而言，这些机制合理，尤其是 mParticle
              合并后改善了身份解析和事件一致性。不过，大多数效果主张仍来自公司披露：公开来源没有披露留置组设计、独立增量性审计、模型卡、特征治理或准确性指标。应把
              AI/数据优势视为可信但未被独立量化。实际测试在于，计入优惠抑制、不展示决策和任何结账完成率拖累后，Rokt 能否证明增量利润。
