      - CV039
      - CV044
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 议题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 经审计财务
        - 收入确认、总额到净额、毛利率、EBITDA、现金、债务
        - 把报道规模转化为企业价值
        - 审阅 S-1 或经审计报表
      - - 队列质量
        - NRR、商户留存、广告主复购率、按分群拆分的流失
        - 检验溢价倍数背后的耐久性
        - 索取队列表和客户访谈
      - - 集中度
        - 头部商户、广告主、合作伙伴和渠道份额
        - 暴露单点风险
        - 按交易对手和地区分析收入
      - - 同意机制和投诉
        - 优惠接受日志、投诉率、退订趋势
        - 监管和商户品牌风险会影响变现
        - 审阅合规仪表盘和法律备忘录
      - - 并购整合
        - mParticle 和 AfterSell 的收入协同、留存、成本
        - 判断收购是在扩展还是稀释模式
        - 审阅整合 KPI 和分部 P&L
      - - IPO 准备度
        - S-1 草稿风险因素、治理、募集资金用途、锁定期结构
        - 公开市场披露可能改变估值立场
        - 申报和路演时刷新
    notes: 尽调问题聚焦公开来源未披露、但会直接改变价格或建议的私有证据。
    claimRefs:
