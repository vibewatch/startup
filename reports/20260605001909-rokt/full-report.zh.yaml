chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与可见规模
        blocks:
          - type: paragraph
            body: >-
              Rokt 的公开身份在官方和独立来源之间异常一致：它是一家电商技术公司，聚焦“交易时刻”，用 AI 和机器学习在结账与购后把购物者匹配到相关优惠、商品、支付选项或广告主信息。其运营模式不只是 SaaS
              订阅。Rokt 描述的是一个封闭网络和伙伴模式，把大部分创造价值返还给伙伴；Sacra 则把核心产品定义为零售商结账软件，由 Rokt 与零售商分成广告支出。收购轨迹也扩大了定义：AfterSell 增加
              Shopify 增购工具，mParticle 增加客户数据平台，Canal 增加第三方库存集成。当前规模可观，但仍主要来自公司披露：官方新闻稿提到每年数十亿笔交易、数亿客户、数千家电商企业，以及 2025 年
              700+ 名员工；经审计收入质量、抽成率、利润率和活跃客户留存仍未公开。
