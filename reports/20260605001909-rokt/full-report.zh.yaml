      - number: '2.3'
        title: 买方、细分与预算路径
        blocks:
          - type: paragraph
            body: >-
              Rokt
              面向的是双边预算路径。供给侧，商户、市场平台、支付钱包、旅行平台、杂货商、票务公司和订阅业务控制结账或确认触点，想要增量收益、更高客单价、忠诚度互动或目录扩展。需求侧，品牌和广告主用效果、增长、零售媒体或商业媒体预算购买结果、获客和增量转化。用户常常是购物者或账户持有人，但付款方通常不是用户；经济决策权在电商、增长、产品、零售媒体或商业负责人手里。PayPal
              和 Venmo 验证了支付钱包延展，Canal 则把 Rokt 推向分布式商业和精选第三方商品目录。预算路径最强的场景，是商户有足够交易量让集成值得做，且广告主相信平台能展示相关优惠而不破坏结账体验。
