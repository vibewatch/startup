            body: >-
              Rokt 当前产品触点一部分来自自研，一部分来自收购。AfterSell 和 Upcart 把公司从企业级商业媒体延展到 Shopify 原生购后和结账增购；mParticle 提供实时客户数据和身份层，Rokt
