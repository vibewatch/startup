      - number: '1.3'
        title: 融资、估值、投资者与流动性
        blocks:
          - type: paragraph
            body: >-
              Rokt 的融资记录更像一家后期私营公司，而不是早期创业故事。官方公司历史列出 US$8M A 轮、US$26M B 轮、US$48M C 轮、US$80M D 轮，以及 US$325M E 轮，随后在 2025
              年出现 US$3.5B 的老股估值。2025 年 1 月老股交易是目前证据最充分的估值锚点，因为 Rokt 自己的公告说明了约 US$335M 的股票购买协议，点名 Tiger Global、Square
              Peg、Barrenjoey、SecondQuarter 和参与的董事会成员，并称该交易把公司估值定为 US$3.5B，同时为员工和早期投资者提供超过 US$100M 的流动性。Startup Daily 和
              Built In 也印证了估值与流动性叙事。围绕 AustralianSuper、Hostplus、Wellington 和 TDM
              的候选事实，除非后续章节取得私人投资者材料，否则应视为股东背景，而不是精确股权结构证明。最重要的未决项是证券层面的条款、老股出售方构成、普通股等价估值、债务，以及后续澳元估值表述究竟反映汇率、组合账面上调，还是一笔真正的新交易。
