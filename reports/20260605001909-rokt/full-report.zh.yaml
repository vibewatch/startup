  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与范围
        blocks:
          - type: paragraph
            body: >-
              Rokt
              的风险画像不是单一起决定作用的诉讼或资产负债表问题，而是把数据驱动优惠引擎插入电商最敏感时刻后形成的一组累积风险。最高剩余敞口位于同意、消费者感知、伙伴品牌信任和平台依赖的交叉点。公司特定证据在隐私架构、优惠政策控制、M&A
              执行范围、公开诉讼案卷、Shopify 商户情绪和 IPO
              窗口推迟上最强。行业层面监管证据在暗黑模式、负面选项、商业邮件、短信同意、隐私权和平台守门人审查上最强。因此，承销立场应避免夸大监管机构已经因暗黑模式盯上 Rokt，同时仍把迁移风险视为重要，因为 Rokt
              的模式依赖相关性、同意和结账时的低摩擦接受。
