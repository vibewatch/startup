  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：以 US$3.5 billion 跟踪，不追逐传闻估值
        blocks:
          - type: paragraph
            body: >-
              Rokt 看起来是一项高质量的私营商业媒体资产，但估值结论应对价格敏感，而不是对品牌敏感。公开资料中佐证最强的锚点是 2025 年 1 月老股交易：Rokt 和 PR Newswire 报道了 US$335
              million 股票购买协议、US$3.5 billion 估值、US$600 million 收入、43% 同比增长、盈利，以及为员工和早期投资者提供超过 US$100 million
              流动性。这些事实支撑的是一家已有规模的真实业务，不是一个创投概念。承销问题在于，同一套公开材料省略了经审计毛利率、净收入留存、客户集中度、现金 / 债务、优先股堆叠和队列经济性。因此我的建议是观察：可信度足以为
              IPO 或老股流程做准备，但在没有私有尽调前，不足以支持高于 2025 年 1 月估值买入。
