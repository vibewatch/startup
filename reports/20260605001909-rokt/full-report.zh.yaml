  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：交易时刻商业媒体，而非全部营销技术
        blocks:
          - type: paragraph
            body: >-
              Rokt 最适合放在交易时刻商业媒体里理解：广告、优惠和分布式商品推荐被插入结账、确认和购后触点，此时购买意图已经明确。这个边界很重要，因为诱人的头部市场远大于 Rokt
              真正可触达的楔形市场。全球零售媒体、美国零售媒体、CDP、个性化软件、联盟营销和一般广告技术都会参与同一类预算讨论，但大部分支出发生在最终交易步骤之外。可防守的边界包括电商结账和购后广告、商户变现，以及支付、旅行、杂货、票务、订阅和市场平台流程中的邻近商业媒体用例。它排除大多数赞助搜索、社交商业广告、通用展示广告、广义
              CDP 授权，以及 Rokt 没有投放或优化角色的零售商自售媒体。这个较窄定义仍留下很大市场，因为交易数据稀缺、已登录并直接绑定转化；但它避免了把每一美元零售媒体或营销技术支出都算给 Rokt 的虚假 TAM
              论证。
