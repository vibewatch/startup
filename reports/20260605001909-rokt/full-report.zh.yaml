      - number: '2.5'
        title: Rokt 的位置与未证实事项
        blocks:
          - type: paragraph
            body: >-
              Rokt 最适合的场景，是控制或影响高意图交易库存，而这些库存稀缺、可测量且尚未充分变现。最有说服力的市场叙事不是 Rokt
              拥有零售媒体，而是它能在商业媒体内部切出一层更接近转化的高价值层，再延展到支付、目录、旅行、票务和订阅流程。投资层面的警示在于，公开来源没有把结账和购后广告作为一个独立市场拆出来，也没有提供经审计的支出、增长或抽成率数据。因此，管理层尽调应测试商户层面的增量利润、广告主重复支出、同意处理、基于留置组的增量性、结账转化影响，以及由未来可能内化该能力的伙伴贡献的交易量占比。在这些测试得到答案前，Rokt
              可以因巨大且增长的邻近市场获得信用，但不能拿到完整零售媒体 TAM 的信用。
