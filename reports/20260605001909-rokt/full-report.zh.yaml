        title: 哪些证据会改变判断
        blocks:
          - type: paragraph
            body: >-
              如果私有尽调证明 Rokt 不只是套利结账注意力，而是在复利一个可防守网络，上行情景会更强：商户留存高、广告主重复投放高、集中度低、增量性可衡量、同意机制扎实，且收入增长高于 35% 时仍有经审计盈利。若更新的
              IPO 前估值标记基于稀缺性和动量，而不是经审计基本面，或订阅和结账优惠审查压缩变现，下行情景就会成为主导。反向来源在这里重要：围绕负选项做法的监管规则制定并非只针对
              Rokt，但会提高所有在敏感交易流中通过优惠变现业务的合规负担。因此建议仍然有条件。
