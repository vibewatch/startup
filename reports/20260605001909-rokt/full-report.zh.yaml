        title: 估值锚点与公开市场三角验证
        blocks:
          - type: paragraph
            body: >-
              简单计算有用，但不是定论。用公司声称的 US$600 million 收入除以 US$3.5 billion 估值，得到约 5.8x
              revenue，且尚未做企业价值调整。这个水平高于打折的广告技术类别，更接近质量更高的商业媒体或营销技术 软件；只有在 Rokt 的增长、盈利能力、增量性和商户耐久性经得起审计时才说得通。可比公司有意放宽：The
              Trade Desk、Criteo、AppLovin、Klaviyo、Instacart/Maplebear 和
              Zeta，展示公开市场如何给广告技术、零售媒体、营销技术和交易关联广告风险定价。这些监管文件不是完美可比，但结论很清楚：公开市场投资者会重度区分增长耐久性、平台依赖、隐私风险和利润率质量。
