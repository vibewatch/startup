          - type: paragraph
            body: >-
              核心法律风险是分布式生态中的同意来源。Rokt 自己的披露提供了建设性缓释：隐私政策描述了优惠选择加入、没有接受优惠义务、Data Privacy Framework
              遵循情况、数据类别，以及向具名广告主或伙伴的披露；DPA 分配服务提供商和企业角色；政策文件要求广告活动真实且有依据。这些控制不能消除剩余敞口。同一批来源显示，Rokt
              可能处理联系、交易、设备、追踪、分群和优惠互动数据；被接受的优惠可能引向电子邮件、SMS、电话、自动拨号或预录语音后续联系。FTC、NAAG、CPPA、CAN-SPAM、负面选项和 TCPA
              材料抬高了清晰披露、肯定性同意、退订处理和隐私选择架构的要求。尽调测试不是 Rokt 是否有政策，而是每个商户投放位、广告主优惠、抑制名单、cookie 路径和后续交接，能否在规模化状态下证明合规同意。
