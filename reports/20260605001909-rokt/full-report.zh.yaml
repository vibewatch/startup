      - number: '7.3'
        title: 结账信任、优惠质量与商户品牌风险
        blocks:
          - type: paragraph
            body: >-
              Rokt
              自己关于消费者护栏的文章是有用的反向证据，因为它承认了运营约束：结账优惠只有在保持相关性、低摩擦、易拒绝、适度频次和品牌匹配时才有效。如果不相关或过量优惠出现在零售商购买路径中，下行不只是点击率下降；不满可能转嫁到商户和广告主身上。Rokt
              的广告活动政策和敏感类别屏蔽是有意义的缓释，但也证明这个网络需要主动巡检。它既是广告技术业务，也是信任业务。尽调应抽样查看实时投放位，审查被拒创意日志，在移动端测试易拒绝行为，并按伙伴和广告主检查投诉升级。若消费者认为零售商把已完成交易的访问权卖了出去，一次小的政策失误也可能变成声誉问题。
            claimRefs:
