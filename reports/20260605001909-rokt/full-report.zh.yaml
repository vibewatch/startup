              对一家私营商业媒体公司而言，Rokt 的财务标题异常强劲，但公开记录中仍未经审计。最强来源是 Rokt 自己在 2025 年 1 月发布的老股交易公告：管理层称 2024 年收入达到 US$600
              million，同比增长 43%，并且公司在六年里收入增长 10 倍，同时保持盈利。Sacra 独立估计 2024 ARR 也为 US$600 million，并把老股估值框定为约 5.8x
              远期收入，但这仍是估计，不是提交的损益表。因此，正确尽调姿态是把收入主张视为受到公司和分析师/伙伴重复引用的有力支持，同时把毛利率、EBITDA
