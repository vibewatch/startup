      - number: '7.6'
        title: 治理、M&A 整合与执行风险
        blocks:
          - type: paragraph
            body: >-
              Rokt 从聚焦交易时刻网络，扩到覆盖 Aftersell、Upcart、Canal/Catalog 和 mParticle 的更宽组合后，执行风险上升。mParticle 交易带来实时
              CDP、进入管理层的创始人，以及数据控制承诺，但 AdExchanger 的独立报道点出了战略问题：一家电商优惠网络为什么要拥有 CDP。AfterSell 带来 Shopify 原生的 SMB
              触达和购后功能，但也要求公司守住商户信任、应用商店合规和产品连续性。治理风险不是对团队的批评，而是尽调要求。Bruce Buchanan 主导公开战略叙事，mParticle 创始人主导 CDP 整合，IPO
              推迟后，私营公司治理、董事会独立性、激励一致性和整合里程碑，比短期公开市场纪律机制更重要。
            claimRefs:
              - CR030
              - CR031
              - CR035
              - CR036
              - CR037
