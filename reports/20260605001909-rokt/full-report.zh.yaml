  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正同业与邻近替代品
        blocks:
          - type: paragraph
            body: >-
              不应把 Rokt 放进单一“商业媒体”类别做基准。其核心交易时刻产品触及三类预算池：商户转化优化、自有结账触点的购后变现，以及广告主出资的商业媒体需求。因此，真正同业分成两组。对 Shopify
              商户而言，直接替代品是 Rebuy、UpsellPlus、Zipify 和更广泛的结账/购后应用生态；AfterSell 被收购后属于 Rokt
              自己的产品组合，应视为产品延展。对大型零售商和广告主而言，Criteo、Zitcha、Kevel、Topsort、Mirakl 和 Walmart Connect
              更接近替代品，因为它们变现第一方商业受众，或为自有零售媒体网络提供基础设施。Nosto 和 Dynamic Yield 是邻近产品，不是直接产品，因为它们解决的是全站个性化和商品编排，而不是封闭的购后广告主市场。
