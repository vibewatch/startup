        - 大型邻近市场和预算来源，但作为 TAM 过宽
      - - 非零售商业媒体
        - 与交易绑定的支付、旅行、金融服务、电信、配送和票务媒体
        - 没有交易数据的开放网络展示广告
        - 垂直平台所有者和效果广告主
        - PayPal / Venmo 逻辑验证的扩张路径
      - - CDP / 个性化软件
        - 提升相关性的数据激活和用户画像编排
