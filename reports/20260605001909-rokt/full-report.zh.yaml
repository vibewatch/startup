        title: 集成架构与数据流
        blocks:
          - type: paragraph
            body: >-
              集成触点足够可见，可以在高层面承销实施风险。Web SDK+ 是主要的浏览器/移动商业层；它加载 Rokt 代码、识别购物者、捕获属性，并调用投放位选择方法。Cart API
              为结账期间必须保留的商品增加后端预留和确认机制。mParticle 路径把 Rokt Thanks 和 Pay+ 变成连接 CDP 的工具包，伙伴在其中映射属性，并通过 mParticle 命名空间调用
              selectPlacements。这套架构强大但敏感：更多标识符和交易属性应能改善相关性和测量，但每增加一个字段，商户就多一层同意、最小化、数据映射和排障义务。
