      - number: '1.2'
        title: 创始人、管理层、董事会与治理
        blocks:
          - type: paragraph
            body: >-
              后续章节采用的标准创立叙事是：Bruce Buchanan 和 Justin Viles 在收购 Rocklive 后于 2012 年创立 Rokt；Hearts & Minds 则另行把 Buchanan
              描述为前 Jetstar 负责人，他创建 Rokt 是为了让电商交易更智能、更赚钱。Bruce Buchanan 仍担任 CEO
              和联合创始人，这有利于连续性，但也让公司叙事集中在一位关键高管身上。当前高管梯队通过招聘和 M&A 扩大：官方新闻稿点名 Terry Bowen 任总裁兼 COO、Jacqueline Purcell 任
              CFO、Claire Southey 任高级 AI/产品负责人、AfterSell 并入后的 Dhruv Patel 任首席产品官、mParticle 并入后的 Andrew Katz 任 CTO、Reuben
              Kan 任首席研究官，以及 Jon Humphrey 作为负责运营和广告的执行委员会领导。治理证据在改善，但仍不完整：Anita Sands 于 2025 年 1 月加入董事会，后续材料提到 David
              Obstler 任审计主席、Matt Briers 任董事会顾问/观察员；详细投票权、董事会委员会、关联方控制和股东保护均未公开。
