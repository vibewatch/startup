  - CV025
  - CV030
  - CV034
  - CV037
  - CV039
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Audited financials
    - Revenue recognition, gross-to-net, gross margin, EBITDA, cash, debt
    - Converts reported scale into enterprise value
    - Review S-1 or audited statements
  - - Cohort quality
    - NRR, merchant retention, advertiser repeat rate, churn by segment
    - Tests durability behind premium multiple
    - Request cohort tables and customer references
  - - Concentration
    - Top merchant, advertiser, partner, and channel shares
    - Reveals single-point risk
    - Analyze revenue by counterparty and geography
  - - Consent and complaints
    - Offer acceptance logs, complaint rates, opt-out trends
    - Regulatory and merchant-brand risk affects monetization
    - Review compliance dashboards and legal memos
  - - M&A integration
    - mParticle and AfterSell revenue synergies, retention, costs
    - Determines whether acquisitions expand or dilute the model
    - Review integration KPIs and segment P&L
  - - IPO readiness
    - Draft S-1 risk factors, governance, use of proceeds, lock-up structure
    - Public-market disclosure may change valuation stance
    - Refresh at filing and roadshow
  notes: Diligence asks focus on private evidence that public sources do not disclose but that would directly change price
    or recommendation.
