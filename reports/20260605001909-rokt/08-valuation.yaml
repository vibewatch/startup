- id: upside-downside
  title: What would change the view
  body: 'The upside case improves if private diligence proves that Rokt is not merely arbitraging checkout attention but compounding
    a defensible network: high merchant retention, high advertiser repeat spend, low concentration, measurable incrementality,
    strong consent hygiene, and audited profitability while revenue grows above 35%. The downside case becomes dominant if
    newer pre-IPO valuation marks are based on scarcity and momentum rather than audited fundamentals, or if subscription
    and checkout-offer scrutiny compresses monetization. Adverse sources matter here: regulatory rulemaking around negative-option
    practices is not aimed only at Rokt, but it can raise the compliance burden for any business monetizing offers in sensitive
    transaction flows. That is why the recommendation remains conditional.'
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV029
