- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / status
  - Relevance to Rokt
  - Limitation
  rows:
  - - The Trade Desk
    - Public adtech platform; 2025 Form 10-K
    - Premium independent adtech benchmark
    - Not checkout-specific commerce media
  - - Criteo
    - Commerce media / retail media public company
    - Closest public retail-media operating analogy
    - More mature and lower-growth profile
  - - AppLovin
    - High-multiple mobile ad platform
    - Shows upside for scaled algorithmic ad platforms
    - Mobile gaming exposure is not Rokt’s model
  - - Klaviyo
    - Public ecommerce marketing automation platform
    - Shares ecommerce buyer and retention-budget adjacency
    - SaaS model differs from marketplace take-rate economics
  - - Maplebear / Instacart
    - Public transaction-linked commerce platform
    - Advertising attached to retail transactions
    - Grocery marketplace economics differ materially
  - - Zeta Global
    - Public martech and data-driven marketing platform
    - Data, privacy, NRR, and concentration risks are relevant
    - Enterprise marketing cloud is not checkout media
  - - Multiples.vc adtech index
    - EV/LTM revenue and EBITDA multiple context
    - Provides market multiple discipline
    - Screening data must be refreshed at pricing date
  notes: Partial comparable set; no listed company exactly matches Rokt’s transaction-moment network, merchant economics,
    and mParticle CDP mix.
  enumerationScope:
