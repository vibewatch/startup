- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation logic
  - Probability signal
  - Trigger to revise
  rows:
  - - Bull
    - Revenue growth stays above 35%; profitability and retention are audited
    - Premium 7-9x revenue range implies value above US$4.2B-US$5.4B on US$600M baseline
    - S-1 confirms margin, NRR, concentration, and consent controls
    - Move toward buy if price remains near US$3.5B
  - - Base
    - Growth moderates but remains strong; public adtech multiples stay mixed
    - 5-6x revenue supports roughly US$3.0B-US$3.6B before EV adjustments
    - Private diligence confirms quality but not category-leading economics
    - Track or bid only with structure
  - - Bear
    - Growth below 20%, lower margins, regulation, or merchant churn
    - 2-4x revenue supports roughly US$1.2B-US$2.4B before EV adjustments
    - Adverse regulatory or merchant-trust evidence rises
    - Avoid or require major discount
  - - IPO momentum
    - Newer valuation rumors exceed US$3.5B
    - Higher price requires audited proof rather than scarcity premium
    - S-1 demand and comp multiples improve
    - Avoid if pricing relies on hype
  notes: Scenario valuations are illustrative ranges from revenue multiples applied to the reported US$600M revenue baseline;
    they are not appraisals or enterprise values.
