company:
  name: Rokt
chapter:
  number: 8
  title: Valuation
  summary: 'Rokt merits a track recommendation at the January 2025 US$3.5 billion valuation anchor: public evidence supports
    scale, growth, profitability claims, and IPO readiness, but audited economics and terms are missing. Upside requires sustained
    premium growth and clean private diligence; downside is driven by public-market multiple compression, checkout-offer regulation,
    and overhyped IPO pricing.'
sections:
- id: stance
  title: 'Recommendation: track at US$3.5 billion, do not chase rumor marks'
  body: 'Rokt screens as a high-quality private commerce-media asset, but the valuation conclusion should be price-sensitive
    rather than brand-sensitive. The best-corroborated public anchor is the January 2025 secondary transaction: Rokt and PR
    Newswire reported a US$335 million stock-purchase agreement, a US$3.5 billion valuation, US$600 million of revenue, 43%
    year-over-year growth, profitability, and more than US$100 million of liquidity for employees and early investors. Those
    facts support a real business at scale, not a venture concept. The underwriting problem is that the same public package
    omits audited gross margin, net revenue retention, customer concentration, cash/debt, preference-stack, and cohort economics.
    My recommendation is therefore track: credible enough to prepare for an IPO or secondary process, but not enough to buy
    above the January 2025 valuation without private diligence.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV033
  - CV045
  tableRefs:
  - TV001
