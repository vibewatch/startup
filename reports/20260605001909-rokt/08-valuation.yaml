  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited economics
    missingEvidence: Audited revenue recognition, gross margin, EBITDA bridge, cash, debt, and preference-stack details.
    whyItMatters: These inputs determine whether the US$3.5 billion valuation is cheap, fair, or expensive on enterprise-value
      and return terms.
    diligencePath: Request audited financial statements, draft S-1, and cap table from management or secondary seller.
    relatedQuestionRefs:
    - QV021
    - QV024
    - QV032
  - type: private-evidence-only
    severity: material
    topic: cohort quality
    missingEvidence: Net revenue retention, merchant retention, advertiser repeat spend, segment churn, and cohort-level ROI.
    whyItMatters: Premium multiples require durable growth rather than one-time transaction volume or paid acquisition.
    diligencePath: Review cohort exports and conduct merchant and advertiser reference calls.
    relatedQuestionRefs:
    - QV019
    - QV024
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table
    missingEvidence: Real-time market-cap, net cash, and consensus revenue estimates for every potential public comparable.
    whyItMatters: The comparable table is representative, not exhaustive, and exact multiples can move quickly before IPO
      pricing.
    diligencePath: Refresh FactSet, CapIQ, or Bloomberg comp sheets when an S-1 or secondary price is available.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: material
    topic: IPO valuation rumors
    missingEvidence: Primary confirmation of later A$7.2 billion or higher pre-IPO valuation marks and the transaction terms
      behind them.
    whyItMatters: Rumor marks can imply a very different entry discipline from the January 2025 secondary anchor.
    diligencePath: Ask brokers and company counsel for transaction documents, share class, and any transfer restrictions.
    relatedQuestionRefs:
    - QV014
    - QV015
  - type: missing-source
    severity: material
    topic: regulatory operating data
    missingEvidence: Complaint rates, opt-out trends, advertiser rejection rates, and merchant-brand incident logs for checkout
      offers.
    whyItMatters: Regulatory and brand-trust risk directly affects inventory availability and take-rate sustainability.
    diligencePath: Request compliance dashboards and review legal correspondence with major merchants.
    relatedQuestionRefs:
    - QV008
    - QV020
    - QV025
