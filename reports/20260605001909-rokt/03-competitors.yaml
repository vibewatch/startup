    {
      "id": "checkout-and-shopify-battlecard",
      "title": "Checkout, post-purchase, and Shopify-native competition",
      "body": "The Shopify layer is the most immediate displacement vector because merchants can compare apps side by side, install multiple solutions, and use Shopify checkout extensibility for narrower native builds. Rokt’s owned AfterSell app has credible marketplace proof and a hybrid monetization pitch through Rokt Thanks, but Rebuy and UpsellPlus are credible external alternatives when the merchant primarily wants cart, checkout, thank-you, and post-purchase upsells rather than advertiser-funded offers. Zipify and other Shopify App Store alternatives further increase multi-homing risk. Rokt’s advantage in this segment is not the editor alone; it is whether the Rokt network can deliver incremental third-party offer yield that the merchant could not produce with product upsells or custom native offer blocks. The diligence burden is proving incrementality after subscription fees, revenue share, and any checkout-experience tradeoff.",
