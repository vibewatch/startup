evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Full cap table, secondary seller list, share classes, liquidation preferences, and investor rights.
    whyItMatters: >-
      The US$3.5B valuation is usable, but investor economics and control cannot be assessed from headline secondary
      coverage.
    diligencePath: >-
      Request the latest cap table, stock-purchase agreement summary, board consent package, and investor-rights
      agreement.
    relatedQuestionRefs:
      - QO010
      - QO012
  - type: private-evidence-only
    severity: material
    topic: financial position
    missingEvidence: Audited 2024-2026 revenue, gross margin, EBITDA, cash, debt, and revenue-recognition policy.
    whyItMatters: >-
      Company and media sources cite US$600M revenue and profitability, but public sources do not prove quality of
      earnings or leverage.
    diligencePath: Obtain audited financial statements, management accounts, debt schedule, and cohort/take-rate bridge.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO017
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Current full executive roster, board committee membership, observer rights, and founder ownership status.
    whyItMatters: IPO readiness and key-person dependence cannot be fully assessed from press releases alone.
    diligencePath: Request organization chart, board minutes index, D&O insurance summary, and governance committee charters.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO007
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Bridge between US$3.5B January 2025 valuation and later A$7.2B media valuation language.
    whyItMatters: >-
      Later reports may reflect currency conversion, internal mark-up, or a new valuation; confusing these would distort
      valuation analysis.
    diligencePath: >-
      Ask management and major shareholders for the valuation mark methodology, FX assumptions, and any later
      transaction evidence.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: legal
    missingEvidence: >-
      Primary pleadings, arbitration status, settlement documents, and counsel assessment for workplace and contract
      allegations.
    whyItMatters: Adverse summaries are enough to flag risk but not enough to quantify liability or IPO disclosure exposure.
    diligencePath: Run litigation docket pulls through counsel and request management’s legal contingencies memo.
    relatedQuestionRefs:
      - QO020
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table TO004 completeness
    missingEvidence: Exact closing dates for some financing, acquisition, partnership, governance, and adverse milestones.
    whyItMatters: The chronology is sufficient for chapter reuse but not a complete legal close-date audit.
    diligencePath: Request management timeline, press archive, transaction closing binders, and board approval calendar.
    relatedQuestionRefs:
      - QO018
      - QO020
      - QO021
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map TO003 completeness
    missingEvidence: Full cap-table stakeholder list, exact economic ownership, board rights, and secondary seller allocations.
    whyItMatters: The stakeholder map names public investors and acquired-team leaders but cannot prove control or economics.
    diligencePath: Request cap table, board observer list, stock transfer ledger, and investor-rights agreement from management.
    relatedQuestionRefs:
      - QO010
      - QO012
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: checkout-post-purchase-market-size
    missingEvidence: Independent market sizing that isolates checkout and post-purchase advertising spend from broader retail media.
    whyItMatters: Without this, Rokt-specific SAM and SOM cannot be separated from broad retail-media forecasts.
    diligencePath: >-
