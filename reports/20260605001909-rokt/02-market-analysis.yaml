    "number": 2,
    "title": "Market Analysis",
    "summary": "Rokt\u2019s credible market is a transaction-moment commerce-media wedge inside the much larger retail-media and ecommerce ecosystem. Public forecasts support very large adjacent pools, but checkout/post-purchase spend is not independently isolated, so the diligence case should use range-based sizing and focus on buyer adoption, incrementality, privacy, and merchant trust."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary: transaction-moment commerce media, not all martech",
      "body": "Rokt fits best inside transaction-moment commerce media: advertising, offers, and distributed product recommendations inserted into checkout, confirmation, and post-purchase surfaces where purchase intent is explicit. That boundary matters because the tempting headline markets are much larger than Rokt\u2019s addressable wedge. Global retail media, U.S. retail media, CDPs, personalization software, affiliate marketing, and general adtech all touch the same budget conversations, but most of their spend occurs away from the final transaction step. The defensible boundary includes ecommerce checkout and post-purchase advertising, merchant monetization, and adjacent commerce-media use cases in payments, travel, grocery, ticketing, subscription, and marketplace flows. It excludes most sponsored search, social commerce ads, generic display, broad CDP licensing, and internally sold retailer media where Rokt has no placement or optimization role. This narrower definition still leaves a large market because transaction data is scarce, logged-in, and directly tied to conversion, but it prevents a false TAM argument that would award Rokt every dollar of retail media or martech spend.",
