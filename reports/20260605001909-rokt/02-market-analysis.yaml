    {
      "id": "buyer-segments-and-budget-motion",
      "title": "Buyer, segment, and budget motion",
      "body": "Rokt sells into a two-sided budget motion. On the supply side, merchants, marketplaces, payment wallets, travel platforms, grocers, ticketing companies, and subscription businesses control the checkout or confirmation surface and want incremental yield, higher order value, loyalty engagement, or catalog expansion. On the demand side, brands and advertisers buy outcomes, acquisition, and incremental conversion using performance, growth, retail-media, or commerce-media budgets. The user is often a shopper or account holder, but the payer is usually not the user; the economic decision sits with ecommerce, growth, product, retail media, or commercial leadership. PayPal and Venmo validate a payments-wallet extension, while Canal moves Rokt into distributed commerce and curated third-party product catalogs. The budget path is strongest where the merchant has enough transaction volume to make integration worthwhile and where advertisers trust the platform to show relevant offers without damaging the checkout experience.",
