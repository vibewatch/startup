    {
      "id": "sizing-lenses",
      "title": "Sizing lenses: large adjacencies, smaller serviceable wedge",
      "body": "The public sizing evidence supports a range-based view. IAB-linked reporting puts 2026 U.S. retail media near $74.06B, EMARKETER puts a similar but lower U.S. figure at $69.33B, and WARC-linked reporting puts global retail media at $196.7B. Those numbers are credible adjacency ceilings, not Rokt-specific TAM. A practical SAM screen should start with ecommerce transaction volume and then narrow to digital merchants with enough traffic, margin, customer trust, and willingness to monetize checkout without harming conversion. U.S. Census data showing $304.2B of U.S. ecommerce sales in Q2 2025 and 16.3% ecommerce share confirms the transaction surface is large, but it does not say how much ad inventory can be inserted safely. For Rokt, the useful sizing model is therefore layered: broad global retail media as the ceiling, U.S. retail media as a nearer budget pool, non-retail commerce media as an expansion option, and checkout/post-purchase monetization as the serviceable wedge.",
