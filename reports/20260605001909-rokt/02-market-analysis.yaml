    {
      "id": "drivers-and-constraints",
      "title": "Structural drivers and adoption blockers",
      "body": "The structural drivers are clear: first-party data is more valuable as privacy rules tighten, retailers want higher-margin media revenue, advertisers want closed-loop attribution, and checkout is a scarce moment of confirmed intent. Rokt\u2019s thesis also benefits from organizational convergence as commerce, media, loyalty, and customer-experience teams increasingly share accountability for growth. The constraints are equally material. Buyers are fatigued by fragmented retail-media networks, inconsistent metrics, rising costs, and walled-garden reporting. Merchants may resist if offers distract shoppers, reduce conversion, or harm brand trust. Large retailers can build in-house media networks when they have audience scale, sales talent, and measurement infrastructure. Privacy regulation and consent requirements constrain what data can be activated. Economic cycles can reduce discretionary performance budgets, and without incrementality proof Rokt risks being treated as another attribution layer rather than a durable revenue channel.",
