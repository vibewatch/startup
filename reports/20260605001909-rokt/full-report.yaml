      - number: '7.4'
        title: Platform, security, subprocessor, and antitrust dependency
        blocks:
          - type: paragraph
            body: >-
              Rokt’s growth depends on access to merchant sites, Shopify app surfaces, cloud and messaging vendors, data
              platforms, and large digital ecosystems. Shopify’s public app rules make the dependency explicit: apps
              must implement privacy compliance webhooks or face rejection. Rokt’s subprocessor list adds a second layer
              of operational dependency across AI model providers, AWS, Akamai, Google Cloud, SendGrid, Twilio, and
              observability tooling. Certifications on the compliance portal and Nudge profile reduce security diligence
              risk, but private SOC reports, incident history, penetration-test findings, and subprocessor change
              controls remain necessary. Antitrust risk is mostly indirect today: the DMA targets gatekeeper platforms
              rather than Rokt, but gatekeeper rules, app-store policies, browser privacy changes, or a platform’s own
              checkout monetization product could restrict Rokt distribution or pricing power.
            claimRefs:
