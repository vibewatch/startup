        title: Integration architecture and data flow
        blocks:
          - type: paragraph
            body: >-
              The integration surface is visible enough to underwrite implementation risk at a high level. Web SDK+ is
              the primary browser/mobile commerce layer; it loads Rokt code, identifies the shopper, captures
              attributes, and calls placement-selection methods. The Cart API adds backend reservation and confirmation
              mechanics for products that must be held during checkout. The mParticle path turns Rokt Thanks and Pay+
              into a CDP-connected kit where partners map attributes and call selectPlacements through the mParticle
              namespace. This creates a powerful but sensitive architecture: more identifiers and transaction attributes
              should improve relevance and measurement, yet every extra field increases consent, minimization,
              data-mapping, and troubleshooting obligations for the merchant.
