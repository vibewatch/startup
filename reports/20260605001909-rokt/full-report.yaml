        title: Valuation anchor and public-market triangulation
        blocks:
          - type: paragraph
            body: >-
              The simple math is useful but not definitive. Dividing the US$3.5 billion valuation by the company-claimed
              US$600 million revenue produces about 5.8x revenue, before any enterprise-value adjustment. That sits
              above discounted adtech categories and closer to higher-quality commerce or martech software, which is
              plausible only if Rokt’s growth, profitability, incrementality, and merchant durability survive audit. The
              comp set is deliberately broad: The Trade Desk, Criteo, AppLovin, Klaviyo, Instacart/Maplebear, and Zeta
              reveal how public markets price adtech, retail media, martech, and transaction-linked advertising risk.
              The filings are not perfect comparables, but they make one conclusion clear: public investors heavily
              differentiate growth durability, platform dependence, privacy risk, and margin quality.
