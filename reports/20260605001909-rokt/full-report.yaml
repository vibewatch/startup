      - number: '1.2'
        title: Founders, leadership, board, and governance
        blocks:
          - type: paragraph
            body: >-
              The canonical founding story for later chapters is that Bruce Buchanan and Justin Viles founded Rokt in
              2012 after acquiring Rocklive; Hearts & Minds separately frames Buchanan as the former Jetstar chief who
              created Rokt to make ecommerce transactions smarter and more profitable. Bruce Buchanan remains CEO and
              co-founder, which is a strength for continuity but also concentrates the narrative around one key
              executive. The current executive bench has widened through both hiring and M&A: official releases name
              Terry Bowen as president and COO, Jacqueline Purcell as CFO, Claire Southey as a senior AI/product leader,
              Dhruv Patel as Chief Product Officer after AfterSell, Andrew Katz as CTO after mParticle, Reuben Kan as
              Chief Research Officer, and Jon Humphrey as an executive-committee leader for operations and advertising.
              Governance evidence is improving but incomplete: Anita Sands joined the board in January 2025, while later
              materials mention David Obstler as audit chair and Matt Briers as board advisor/observer; detailed voting
              rights, board committees, related-party controls, and shareholder protections are not public.
