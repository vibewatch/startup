      - number: '8.3'
        title: Scenario framing and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The scenario frame should separate reported facts from estimate logic. Reported facts are the US$3.5
              billion secondary valuation, the US$600 million revenue claim, the 43% growth claim, the mParticle
              combination, and visible IPO-readiness steps. Estimate logic starts when we assign multiples, growth fade,
              margin durability, and regulatory haircuts. In the bull case, Rokt earns a premium because
              transaction-moment ads are measurable, the retail-media market keeps expanding, and mParticle increases
              data activation. In the base case, the January 2025 price is fair but not obviously cheap because public
              adtech multiples remain uneven. In the bear case, growth slows, merchant trust or regulation worsens, or a
              hot IPO window prices the company above evidence. The practical underwriting stance is to require evidence
              that the transaction moment creates incremental profit for merchants and advertisers after partner revenue
              share, not merely gross media volume. That distinction matters because the same revenue headline can
              support very different outcomes depending on retention, margin, concentration, and complaint rates.
            claimRefs:
