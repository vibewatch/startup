  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: True peers versus adjacent substitutes
        blocks:
          - type: paragraph
            body: >-
              Rokt should not be benchmarked against a single “commerce media” category. Its core transaction-moment
              product touches three budget pools: conversion optimization for merchants, post-purchase monetization for
              owned checkout surfaces, and advertiser-funded commerce-media demand. That means true peers split into two
              groups. For Shopify merchants, direct alternatives are Rebuy, UpsellPlus, Zipify, and the broader
              checkout/post-purchase app ecosystem; AfterSell belongs in Rokt’s own portfolio after the acquisition and
              should be treated as a product extension. For large retailers and advertisers, Criteo, Zitcha, Kevel,
              Topsort, Mirakl, and Walmart Connect are closer substitutes because they monetize first-party commerce
              audiences or provide infrastructure for owned retail-media networks. Nosto and Dynamic Yield are adjacent,
              not direct, because they address sitewide personalization and merchandising rather than a closed
              post-purchase advertiser marketplace.
            claimRefs:
