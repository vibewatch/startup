      - number: '8.5'
        title: Final diligence asks and IPO-window posture
        blocks:
          - type: paragraph
            body: >-
              The next investment step should be evidence collection rather than false precision. Before an IC moves
              from track to buy, it should request audited revenue recognition, gross-to-net partner-share economics,
              gross margin, EBITDA bridge, net revenue retention, top-customer concentration, merchant churn, advertiser
              cohort ROI, consent/complaints reporting, and acquisition integration metrics. IPO-window speculation is
              useful as a catalyst watchlist, not as valuation evidence. If Rokt files an S-1, the diligence posture
              should refresh immediately around audited financials, risk factors, related-party or preference
              disclosures, and use of proceeds. Until then, a conditional bid should anchor around the January 2025
              price or lower, with upside participation reserved for proof of premium public-market durability.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV033
              - CV034
              - CV043
              - CV045
