  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: track at US$3.5 billion, do not chase rumor marks'
        blocks:
          - type: paragraph
            body: >-
              Rokt screens as a high-quality private commerce-media asset, but the valuation conclusion should be
              price-sensitive rather than brand-sensitive. The best-corroborated public anchor is the January 2025
              secondary transaction: Rokt and PR Newswire reported a US$335 million stock-purchase agreement, a US$3.5
              billion valuation, US$600 million of revenue, 43% year-over-year growth, profitability, and more than
              US$100 million of liquidity for employees and early investors. Those facts support a real business at
              scale, not a venture concept. The underwriting problem is that the same public package omits audited gross
              margin, net revenue retention, customer concentration, cash/debt, preference-stack, and cohort economics.
              My recommendation is therefore track: credible enough to prepare for an IPO or secondary process, but not
              enough to buy above the January 2025 valuation without private diligence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
