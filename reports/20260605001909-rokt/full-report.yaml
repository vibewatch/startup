        title: Exhibits
        blocks:
          - type: callout
            title: Do not overstate company-specific enforcement
            body: >-
              No fetched primary source shows a public privacy or dark-pattern enforcement action against Rokt; the risk
              is a high-scrutiny sector transfer amplified by Rokt’s checkout data and consent workflow.
            calloutType: risk
