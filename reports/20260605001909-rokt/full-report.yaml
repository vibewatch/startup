      - number: '1.4'
        title: Milestones, adverse events, and IPO readiness
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that has repeatedly expanded geography, product scope, and capital
              access: US expansion began in 2014, Ticketmaster launched in 2015, major financing rounds followed from
              2016 through 2021, Rokt was valued at US$2.4B in 2022, and the 2024-2025 period brought AfterSell,
              mParticle, Canal, leadership expansion, and the US$3.5B secondary. The same record contains diligence
              caveats. Public legal and adverse sources identify a trade-secret case brought by Rokt against AdsPostX,
              workplace and contract-allegation summaries that Rokt or parties deny, and public layoff-discussion
              surfaces whose reliability is directional rather than definitive. Most importantly for exit timing, 2026
              media reports say Rokt deferred an expected IPO because AI-driven public-market volatility made a listing
              distracting, even as the company remained profitable, debt-free, and cash-rich according to Grafa. The
              correct ground-truth stance is therefore not “IPO-ready now,” but “late-stage, profitable by company
              statements, preparing for public markets, with timing explicitly pushed out and legal/workplace claims
              requiring counsel-led verification.”
