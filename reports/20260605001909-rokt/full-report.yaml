      - number: '3.4'
        title: Personalization, CDP, and AI claim boundaries
        blocks:
          - type: paragraph
            body: >-
              Nosto, Dynamic Yield, and similar personalization/CDP stacks are adjacent substitutes when the buyer’s job
              is sitewide relevance, merchandising, experimentation, or first-party data activation. They can reduce the
              need for Rokt if the merchant decides that owned product recommendations and lifecycle personalization are
              safer than third-party post-purchase offers. However, they do not recreate the same advertiser marketplace
              unless paired with a retail-media stack. The public evidence also supports skepticism about generic AI
              claims: Rokt, Rebuy, AfterSell, Dynamic Yield, and Nosto all use personalization language, but retained
              public sources do not provide an independent benchmark proving that one model generates superior
              incremental profit at checkout. Implementation friction is a differentiator: enterprise personalization
              may be powerful but complex, while Shopify apps are easier to procure and test.
