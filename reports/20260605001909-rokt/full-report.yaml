      - number: '7.5'
        title: Financial model, IPO timing, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The financial risk is less about near-term solvency and more about valuation durability, liquidity timing,
              and concentration opacity. Independent reports say Rokt delayed or paused a 2026 IPO because public
              markets were volatile around AI winners and losers; one report also says the company remained profitable,
              debt-free, and cash rich. That combination is not a distress signal, but it does reduce the immediacy of
              public-market validation and may lengthen investor liquidity horizons. Public sources still do not
              disclose top-merchant share, platform partner concentration, advertiser-spend concentration, contract
              duration, gross-to-net revenue split, or cohort retention by segment. If the highest-growth surfaces are
              dependent on a few enterprise partners, Shopify distribution, or mParticle cross-sell, the model can look
              diversified externally while retaining concentrated revenue and policy exposure internally.
