      - number: '7.2'
        title: Privacy, consent, and consumer-protection exposure
        blocks:
          - type: paragraph
            body: >-
              The central legal risk is consent provenance across a distributed ecosystem. Rokt’s own disclosures are
              constructive mitigants: the privacy policy describes offer opt-in, no obligation to accept offers, Data
              Privacy Framework adherence, data categories, and disclosures to named advertisers or partners; DPAs
              allocate service-provider and business roles; and policy documentation requires truthful, substantiated
              campaigns. Those controls do not eliminate residual exposure. The same sources show that Rokt may process
              contact, transaction, device, tracking, segmentation, and offer-interaction data, and accepted offers can
              lead to email, SMS, phone, autodialer, or prerecorded-message follow-up. FTC, NAAG, CPPA, CAN-SPAM,
              negative-option, and TCPA materials raise the burden on clear disclosures, affirmative consent, opt-out
              handling, and privacy choice architecture. The diligence test is not whether Rokt has policies; it is
              whether every merchant placement, advertiser offer, suppression list, cookie path, and follow-up handoff
              can prove compliant consent at scale.
