        title: Where defensibility is real versus marketing
        blocks:
          - type: paragraph
            body: >-
              Rokt’s defensibility is real where cross-merchant advertiser supply and transaction history create offer
              density, payout, and learning advantages that a single merchant or simple upsell app cannot replicate. It
              is more marketing than moat where the task is only rendering product offers, running checkout A/B tests,
              or customizing thank-you pages; those jobs have visible Shopify-native and app-store substitutes. The
              adverse stance is also important: independent comparison coverage points to enterprise concentration as a
              weakness, and public materials do not disclose win-loss rates, merchant churn, advertiser fill rates, or
              incrementality benchmarks. A buyer should therefore underwrite Rokt as a network-plus-workflow company
              whose moat depends on advertiser liquidity, merchant surface access, and measured incremental profit—not
              as a generic AI personalization vendor.
