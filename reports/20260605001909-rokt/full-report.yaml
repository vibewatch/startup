      - number: '1.3'
        title: Funding, valuation, investors, and liquidity
        blocks:
          - type: paragraph
            body: >-
              Rokt’s financing record supports a late-stage private-company profile rather than an early venture story.
              The official company history lists US$8M Series A, US$26M Series B, US$48M Series C, US$80M Series D, and
              US$325M Series E before a US$3.5B secondary valuation in 2025. The January 2025 secondary is the
              best-supported current valuation anchor because Rokt’s own announcement specifies a roughly US$335M
              stock-purchase agreement, names Tiger Global, Square Peg, Barrenjoey, SecondQuarter, and participating
              board members, and says the transaction valued the business at US$3.5B while giving employees and early
              investors more than US$100M of liquidity. Startup Daily and Built In corroborate the valuation and
              liquidity framing. Candidate facts around AustralianSuper, Hostplus, Wellington, and TDM should be treated
              as stakeholder context rather than precise cap-table proof unless later chapters obtain private investor
              materials. The most important open items are security-level terms, secondary seller mix, common-equivalent
              valuation, debt, and whether the later Australian-dollar valuation language reflects FX, portfolio
              mark-up, or a genuinely new transaction.
