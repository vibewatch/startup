        title: Trust, security, privacy, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Rokt’s privacy and security posture is above average for a private adtech-adjacent company because it
              publishes a trust center, claims ISO 27001, SOC 1, SOC 2, subprocessor controls, privacy-regulation
              coverage, and a Bugcrowd program. The product still depends on sensitive data flows: SDK+ and mParticle
              examples include raw or hashed email, mobile numbers, customer IDs, payment type, card BIN, order values,
              and cart contents. The resulting risk is not merely breach risk; it is consent provenance, data
              minimization, shopper surprise, brand-safety controls, page-load impact, and legal/reputation spillover
              from checkout experiences. The adverse public source set does not prove product-security failure, but it
              reinforces that diligence should request incident history, DPAs, subprocessor lists, model governance, and
              merchant-specific conversion-holdout data. Those documents should be matched to each proposed integration
