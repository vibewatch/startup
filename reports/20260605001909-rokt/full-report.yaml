  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motions
        blocks:
          - type: paragraph
            body: >-
              Rokt’s customer base should not be read as one homogeneous SaaS account list. The public proof base
              separates into five motions: advertisers buying outcome-based acquisition in high-intent transaction
              moments; merchants or retailers monetizing checkout, confirmation, and post-purchase surfaces; platform
              partners such as Klarna and Afterpay that can distribute Rokt experiences across many users and retail
              relationships; Shopify merchants using AfterSell for no-code post-purchase upsells; and mParticle
              customers using first-party data activation after the merger. This segmentation matters because the buyer,
              user, payer, deployment work, and revenue risk differ by motion. A Wine.com or Flamingo case study proves
              advertiser demand; a Backcountry, Fanatics, or Beach Bunny reference proves merchant inventory and
              experience control; Shopify reviews prove app-market pull; and M&S, Tatcha, onX, and SoFi prove
              data-platform relevance. The credible diligence posture is therefore to underwrite each segment separately
              rather than over-weighting a logo list or aggregate transaction count.
