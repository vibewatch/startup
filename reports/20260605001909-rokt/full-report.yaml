  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Transaction-moment workflow and economics
        blocks:
          - type: paragraph
            body: >-
              Rokt is best understood as a transaction-moment decisioning layer rather than a conventional SaaS
              dashboard. A merchant embeds Rokt surfaces into cart, payment, confirmation, or post-purchase pages; Rokt
              then uses purchase context, first-party signals when supplied, and advertiser or catalog inventory to
              decide whether to show an offer, upsell, product, payment-related incentive, or nothing. The economic loop
              is two-sided: merchants seek incremental profit and AOV without degrading checkout conversion, while
              advertisers pay for outcome-oriented access to high-intent shoppers. Public docs make the workflow
              concrete through Rokt Ads, Rokt Ecommerce, Thanks, Pay+, and Cart API examples, but investor diligence
              should keep gross advertiser spend, partner payout, and Rokt net revenue separate because public materials
              use different denominators for value created and revenue retained.
