      - number: '3.3'
        title: Retail media, in-house stacks, and data-control substitutes
        blocks:
          - type: paragraph
            body: >-
              The retail-media competitive set matters most for enterprise retailers and advertisers. Criteo offers
              commerce-media and retail-media products at scale, while Zitcha, Kevel, Topsort, Mirakl, and Walmart
              Connect illustrate the range from off-the-shelf platforms to white-label infrastructure and walled
              gardens. These alternatives challenge Rokt on data ownership and control: a retailer with enough traffic,
              advertiser relationships, and engineering capacity may prefer to own inventory rules, auction design, and
              first-party measurement instead of participating in a closed external marketplace. Rokt’s counter is speed
              and demand aggregation: smaller or less mature merchants may not have sufficient advertiser demand,
              optimization talent, or transaction density to match a network. The most important segmentation is
              therefore not “retail media versus Rokt,” but control-oriented enterprise retailers versus merchants
              seeking low-friction monetization.
