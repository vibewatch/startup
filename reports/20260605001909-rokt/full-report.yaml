      - number: '6.6'
        title: Concentration and credibility limits
        blocks:
          - type: paragraph
            body: >-
              The biggest customer diligence limitation is not absence of proof; it is the lack of denominators. Rokt
              can point to many credible customer outcomes, but public sources do not identify the top customer share,
              the largest merchant or platform partner dependency, advertiser-spend concentration, contract duration, or
              renewal economics. Case studies also come mainly from Rokt-owned pages, which are useful for
              proof-of-value but not sufficient for underwriting a recurring revenue stream. Independent sources help
              triangulate adoption and sentiment, yet some references are low-depth or advertorial. The private
              diligence pack should therefore include source-of-truth customer cohorts, top-account concentration,
              gross-to-net revenue by segment, customer-level expansion histories, churn reasons, implementation
              timelines, and case-study calculation support.
