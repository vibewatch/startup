        - Multiple compresses toward mature adtech
        - Avoid above US$3.0B
      - - Audited profitability disappoints
        - EBITDA or gross margin materially below public implication
        - Premium growth-profitability narrative weakens
        - Reset valuation framework
      - - Concentration emerges
        - Top merchant, advertiser, or partner exposure is high
        - Network quality is less diversified than claimed
        - Require discount or protections
      - - Consent / checkout scrutiny increases
        - Regulators or merchants restrict offer flows
        - Inventory, conversion, or take rate declines
        - Pause until compliance evidence clears
      - - IPO price exceeds evidence
        - Pricing materially above US$5.0B without audited quality metrics
        - Return asymmetry deteriorates
        - Do not participate
      - - M&A integration misses
        - mParticle fails to cross-sell or adds cost drag
        - Expansion thesis weakens
