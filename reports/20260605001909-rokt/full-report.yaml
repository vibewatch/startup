  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: transaction-moment commerce media, not all martech'
        blocks:
          - type: paragraph
            body: >-
              Rokt fits best inside transaction-moment commerce media: advertising, offers, and distributed product
              recommendations inserted into checkout, confirmation, and post-purchase surfaces where purchase intent is
              explicit. That boundary matters because the tempting headline markets are much larger than Rokt’s
              addressable wedge. Global retail media, U.S. retail media, CDPs, personalization software, affiliate
              marketing, and general adtech all touch the same budget conversations, but most of their spend occurs away
              from the final transaction step. The defensible boundary includes ecommerce checkout and post-purchase
              advertising, merchant monetization, and adjacent commerce-media use cases in payments, travel, grocery,
              ticketing, subscription, and marketplace flows. It excludes most sponsored search, social commerce ads,
              generic display, broad CDP licensing, and internally sold retailer media where Rokt has no placement or
              optimization role. This narrower definition still leaves a large market because transaction data is
              scarce, logged-in, and directly tied to conversion, but it prevents a false TAM argument that would award
              Rokt every dollar of retail media or martech spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
