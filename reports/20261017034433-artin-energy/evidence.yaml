evidenceGaps:
  - type: missing-source
    severity: material
    topic: founders-and-incorporation
    missingEvidence: >-
      Founder names, exact incorporation date, and legal entity history supported by corporate registry or filing
      evidence.
    whyItMatters: >-
      Identity and legal-formation certainty are foundational for ownership, diligence scoping, and historical
      accountability.
    diligencePath: >-
      Pull state or national registry records and any incorporation or qualification filings tied to ArtIn's operating
      entities.
    relatedQuestionRefs:
      - QO001
  - type: missing-source
    severity: material
    topic: board-and-counterparty-disclosure
    missingEvidence: >-
      Public board roster, named investment-grade offtakers, and the counterparty or contract terms behind the claimed
      $25.4 billion hydrogen deal.
    whyItMatters: >-
      Governance rights and offtake counterparties are central to underwriting the valuation and project-finance
      narrative.
    diligencePath: Request signed term sheets, board documents, cap-table support, and executed offtake or supply agreements.
    relatedQuestionRefs:
      - QO003
      - QO005
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financial statements, revenue or run-rate, headcount, customer count, and Form D or equivalent financing
      compliance support.
    whyItMatters: >-
      Later valuation, customer, and financial chapters cannot convert headline scale claims into investable unit
      economics without these disclosures.
    diligencePath: >-
      Request audited statements, management accounts, workforce reporting, customer concentration schedules, and
      financing compliance filings.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: scale-claims
    missingEvidence: >-
      Independent corroboration for the $538 billion PPA-asset statement and the reported $34 billion or 876 MW
      hydrogen-pipeline claims.
    whyItMatters: >-
      Extraordinary scale assertions heavily influence perceived maturity, bankability, and valuation, so weak
      corroboration can distort the whole report.
    diligencePath: >-
      Match each claim to named counterparties, executed contracts, asset-level schedules, and third-party financial or
      regulatory records.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent TAM, SAM, or SOM methodology that isolates ArtIn's mixed solar, storage, hydrogen, and optimization
      wedge.
    whyItMatters: >-
      Without a common denominator, the public value lenses cannot show serviceable market share, attainable
      penetration, or whether the valuation rests on one project cluster or a repeatable market.
    diligencePath: >-
      Request the investor deck or board materials that define segment TAM/SAM/SOM and reconcile those slices to
      disclosed projects.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Named investment-grade offtakers, contract tenors, pricing logic, and budget-owner details for the Texas,
      Nebraska, and hydrogen opportunities.
    whyItMatters: >-
      Counterparty quality and contract structure determine bankability, adoption timing, and how much of the headline
      pipeline is actually financeable.
    diligencePath: >-
      Obtain redacted PPA or offtake summaries plus the project-finance model showing counterparties, milestones, and
      payment mechanics.
    relatedQuestionRefs:
      - QM002
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: segment-mix
    missingEvidence: >-
      A breakdown of pipeline, bookings, or revenue by utility-scale projects, distributed solar, and optimization
      services.
    whyItMatters: >-
      The current evidence mixes infrastructure development, customer project delivery, and optimization capabilities,
      which makes segment-level market sizing and margin assumptions easy to overstate.
    diligencePath: >-
      Ask management for segment revenue and pipeline mix by geography, project type, and software or services
      attachment.
    relatedQuestionRefs:
      - QM001
      - QM006
    relatedTableRefs:
      - TM001
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Public tariffs, term sheets, or contract economics for ArtIn and the named comparator cohort.
    whyItMatters: >-
      Without price, tenor, and performance terms, competitive comparison can only judge scope and distribution power,
      not unit economics or buyer ROI.
    diligencePath: >-
      Request sample contracts or pricing schedules from management and collect directly comparable public procurement
      documents from peer developers.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: trust-risk
    missingEvidence: >-
      Independent substantiation for the executive-team page's USD 538 billion PPA-assets claim and fuller disclosure of
      repeatable customer proof.
    whyItMatters: >-
      Trust and moat durability depend on whether very large positioning claims can be matched to real projects,
      counterparties, and repeatable execution.
    diligencePath: >-
      Ask management for audited project lists, signed offtake summaries, and third-party verification for the cited PPA
      asset base.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, cash balance, burn, runway, and working-capital statements.
    whyItMatters: Funding headlines and project claims cannot substitute for operating performance or capital adequacy evidence.
    diligencePath: >-
      Request the latest audited financial statements, management accounts, and monthly cash bridge by project and
      corporate entity.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled financing chronology covering seed, Series A, and the March 2026 Agila transaction.
    whyItMatters: Conflicting round counts make it hard to model dilution, prior capital efficiency, and current investor rights.
    diligencePath: Obtain the cap table, executed financing documents, and closing dates for every primary and secondary transaction.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: blocking
    topic: pricing
    missingEvidence: >-
      Signed contracts or pricing schedules showing development fees, EPC margins, service revenue, and hydrogen
      contract economics.
    whyItMatters: Without realized pricing, revenue quality and margin path remain speculative.
    diligencePath: Review customer contracts, pipeline-by-project economics, and realized gross profit by delivered project cohort.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
  - type: private-evidence-only
    severity: material
    topic: counterparties
    missingEvidence: Identity and credit support of the investment-grade counterparties backing the Texas and Nebraska projects.
    whyItMatters: Project-financeability depends on counterparty quality, contract tenor, and termination protections.
    diligencePath: Obtain the offtake or tolling agreements, counterparty names, tenor, step-in rights, and any parent guarantees.
    relatedQuestionRefs:
      - QI003
      - QI006
  - type: missing-source
    severity: material
    topic: hydrogen-pipeline-claim
    missingEvidence: >-
      Independent disclosure of the 876 MW hydrogen contract counterparty, project site, timeline, and technical
      configuration.
    whyItMatters: >-
      Without independent project-level evidence, the hydrogen roadmap cannot be underwritten as near-term execution
      proof.
    diligencePath: >-
      Obtain signed offtake or EPC counterparties, permitting package, and site-level development schedule for the
      claimed hydrogen contract.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: disclosure-depth
    missingEvidence: >-
      Asset-level uptime, commissioning, telemetry, or software integration documentation for solar, storage, and
      hydrogen assets.
    whyItMatters: >-
      Reliability and implementation risk cannot be assessed from marketing copy alone, especially for utility-scale
      projects and any software control layer.
    diligencePath: >-
      Request commissioning reports, O&M dashboards, integration architecture, and operational KPIs for representative
      deployed assets.
    relatedQuestionRefs:
      - QE002
      - QE005
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: quality-controls
    missingEvidence: >-
      Asset-specific proof showing which IEC, ISO, RETIE, or UPME controls apply to which ArtIn products, projects, or
      suppliers.
    whyItMatters: >-
      Control frameworks are named publicly, but underwriting needs scope, owner, and recency to separate product
      quality from generic supplier or marketing claims.
    diligencePath: >-
      Request certification schedules, issuing bodies, validity windows, and plant-level compliance packages for current
      solar, storage, and hydrogen assets.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Customer count, renewals, churn, NRR/GRR, contract duration, or another direct durability metric.
    whyItMatters: >-
      Without durability data, ArtIn's customer quality cannot be separated from one-time project announcements or
      financing milestones.
    diligencePath: Request cohort, renewal, and backlog schedules by project plus at least one executed contract or renewal summary.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: counterparty-gap
    missingEvidence: >-
      Named counterparties, credit profiles, and contract terms for the Texas and Nebraska projects and for the claimed
      $25.4 billion hydrogen contract.
    whyItMatters: >-
      The investment case depends on contracted cash flows, but the current customer and concentration picture is
      untestable without buyer identity and contract detail.
    diligencePath: >-
      Request executed offtake summaries, PPA or hydrogen-counterparty names, tenor, MW committed, and current project
      milestone status.
    relatedQuestionRefs:
      - QU005
      - QU006
  - type: missing-source
