figures:
  - id: FM001
    title: Evidence-backed opportunity-value lenses
    type: pyramid
    summary: >-
      Publicly disclosed values bound the opportunity narrative, but they mix
      pipeline, contract, project-CAPEX, and financing lenses rather than one
      comparable market denominator.
    data:
      items:
        - label: Claimed total pipeline
          displayValue: $34B
          note: Company-announced pipeline across solar and green hydrogen projects.
          claimRefs: [CM007]
        - label: Announced green hydrogen contract
          displayValue: $25.4B
          note: Single company-announced contract tied to 876 MW of hydrogen facilities.
          claimRefs: [CM006]
        - label: Combined disclosed U.S. project CAPEX
          displayValue: ~$4.0B
          note: Derived from the named Texas and Nebraska projects only.
          claimRefs: [CM005]
        - label: Nebraska project CAPEX
          displayValue: ~$2.6B
          note: One of two named U.S. utility-scale projects in the financing materials.
          claimRefs: [CM004]
        - label: Texas project CAPEX
          displayValue: ~$1.4B
          note: One of two named U.S. utility-scale projects in the financing materials.
          claimRefs: [CM004]
        - label: Agila strategic investment
          displayValue: $255M
          note: Recent financing meant to advance late-stage U.S. development.
          claimRefs: [CM003]
    approximationNotes: >-
      This is not a TAM/SAM/SOM waterfall; it is an ordered set of public value
      lenses, and the ~$4.0B layer is a derived sum of the disclosed $1.4B and
      $2.6B project CAPEX figures.
    claimRefs: [CM003, CM005, CM006, CM007, CM013]
callouts:
  - calloutType: risk
    title: Market story is broader than the underwritten evidence
    body: >-
      The assigned pool supports multiple adjacent wedges, but it does not show
      one independent denominator that turns solar, storage, hydrogen, and
      optimization into a single defensible serviceable market.
    claimRefs: [CM001, CM009, CM010, CM013]
