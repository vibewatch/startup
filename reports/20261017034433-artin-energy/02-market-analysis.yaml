      - Relevance
    rows:
      - ["Utility-scale solar + BESS development", "Project CAPEX, interconnection, engineering, procurement, and construction-readiness capital for large projects", "Retail electricity sales, unrelated hardware manufacturing, and undisclosed O&M revenue", "Utilities, industrial offtakers, and institutional investors under long-term agreements", "This is the clearest near-term wedge in the disclosed U.S. portfolio and funding use case."]
      - ["Green hydrogen + e-methanol infrastructure", "Hydrogen-production facilities, electrolysis-linked infrastructure, and associated large-contract development spend", "Consumer fuel retail, commodity trading spreads, and downstream merchant distribution not disclosed in the sources", "Industrial decarbonization counterparties and other long-term offtake customers; named payers are not disclosed", "This is the largest headline opportunity lens, but it is supported only by company-issued contract claims."]
      - ["Distributed commercial / industrial solar projects", "Onsite solar system design, financing, installation, and in at least one case a PPA-backed deployment", "Residential rooftop, mass-market leasing, and utility ownership models not described here", "Named enterprise and institutional site hosts; contract economics and budget owners are not disclosed", "Case studies prove a second go-to-market motion that is much smaller than the headline utility-scale narrative."]
      - ["AI optimization and monitoring layer", "Forecasting, monitoring, storage optimization, and demand-management functionality attached to solar systems", "Standalone software subscription economics, enterprise SaaS pricing, and third-party integrations not disclosed", "Energy operators or asset owners using ArtIn-managed systems; explicit payer is not disclosed", "This broadens the market boundary into optimization services, but the monetization path is much less transparent than for project development."]
    notes: >-
      Built from assigned company pages plus financing coverage; rows separate
      adjacent wedges so the chapter does not collapse them into one generic
      renewable-energy market.
    claimRefs: [CM001, CM002, CM008, CM009, CM010, CM013]
