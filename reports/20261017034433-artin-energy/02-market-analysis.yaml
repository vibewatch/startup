      - ["Green hydrogen / e-methanol infrastructure", "Industrial decarbonization counterparties not named in the assigned sources", "Industrial heat, power, or fuel users", "Counterparty not disclosed", "Develop production facilities -> secure contract / offtake -> build hydrogen infrastructure", "Not disclosed", "Need for lower-carbon fuel or feedstock replacements in industrial workflows."]
      - ["Distributed commercial / industrial solar", "Named enterprises, schools, exporters, and other site hosts", "Facility operators and onsite energy users", "Host customer or financing partner; exact structure disclosed only partially", "Design / finance / install system -> deliver onsite generation -> in one cited case run under PPA", "Not disclosed; likely facilities, energy, or finance owner at the customer", "Energy-cost reduction and onsite sustainability goals."]
      - ["Optimization / monitoring layer", "Asset owners or operators using ArtIn-managed systems", "Operations teams monitoring generation, storage, distribution, and demand", "Not disclosed", "Analyze historical + real-time data -> forecast output and demand -> optimize storage and distribution", "Not disclosed", "Need for better performance, reliability, and storage or demand management."]
    notes: >-
