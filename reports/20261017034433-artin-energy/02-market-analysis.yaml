      - ["Business Wire / ArtIn Energy; Mercom; Power Technology / GlobalData", "2026", "Texas + Nebraska", "~$4.0B disclosed CAPEX", "n/a", "Arithmetic sum of ~$1.4B Texas CAPEX and ~$2.6B Nebraska CAPEX", "High", "Represents two projects, not a broader SAM."]
      - ["Gulf Oil & Gas citing ArtIn Energy", "2026", "Unspecified U.S. green hydrogen project", "$25.4B contract value; 876 MW capacity", "n/a", "Single company-announced contract lens for hydrogen infrastructure", "Medium", "Company-issued claim with no named counterparty or independent verification in the assigned pool."]
      - ["Gulf Oil & Gas citing ArtIn Energy", "2026", "Global / multi-project pipeline", "$34B claimed pipeline", "n/a", "Company-announced total pipeline across solar and green hydrogen", "Medium", "Pipeline value is not broken into booked revenue, backlog, or project probability."]
      - ["Mercom", "2025 vs 2024", "Large-scale solar funding market", "n/a", "+37% funding growth", "Industry funding growth datapoint cited by Mercom", "Medium", "Supports demand and financing tailwinds, not ArtIn's own share or serviceable market."]
    notes: >-
      These are evidence-constrained sizing lenses, not additive TAM/SAM/SOM
      estimates; the $4.0B figure is a simple sum of disclosed Texas and
      Nebraska CAPEX.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM011, CM014]
