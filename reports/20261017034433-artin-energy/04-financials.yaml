      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Utility-scale solar development, Development and eventual project-finance monetization, Project or MW, "Texas and Nebraska development portfolio funded for late-stage work; realized revenue undisclosed", Medium, "Provide project-by-project development fee model and notice-to-proceed conversion history"]
      - [Battery storage development, Storage asset development tied to utility-scale portfolio, Project or MW, "Included in funded U.S. portfolio; no separate revenue disclosure", Low, "Break out storage backlog, ownership model, and standalone margins"]
      - [Green hydrogen / green fuels, Development and contracted infrastructure delivery, Contract or MW, "Company cites 876 MW / $25.4B hydrogen contract; counterparty and revenue recognition terms undisclosed", Low, "Name the customer, contract structure, milestone schedule, and whether value is EPC, offtake, or asset ownership"]
      - [Commercial and industrial solar installations, Engineering / installation project revenue, Project or kWp, "Company cites 500 kWp Ingredion system and a 10 MWp Colombia farm; recurring revenue not disclosed", Medium, "Provide installed base, average contract value, and service attach rate"]
      - [Optimization / consulting services, Advisory or software-enabled optimization services, Engagement, "Official page describes AI optimization but no public pricing or customer count", Low, "Disclose whether this is paid consulting, bundled software, or internal capability only"]
    notes: >-
      Public sources identify offering categories and selected projects, but none disclose recognized
      revenue, mix, or margin by stream.
    claimRefs: [CI006, CI010, CI011, CI012, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - [Utility-scale solar development, null, "No public list pricing; likely negotiated project economics", "Development fees, ownership share, and tax-equity assumptions undisclosed", "Mercom; Yahoo; company project pages"]
      - [Battery storage development, null, "No public list pricing; bundled with broader infrastructure pipeline", "Capacity pricing, tolling terms, and asset ownership split undisclosed", "Mercom; Yahoo"]
      - [Green hydrogen infrastructure, "$25.4B contract value claimed for 876 MW project", "Claim is contract-value level, not realized pricing", "Counterparty, revenue timing, scope split, and margin undisclosed", "Gulf Oil & Gas company-announcement repost"]
      - [Commercial and industrial solar installations, null, "Project examples published without tariff sheets or contract values", "Customer economics and recurring service fees undisclosed", "ArtIn project pages"]
      - [Optimization / consulting services, null, "No list pricing or subscription schedule published", "Unknown whether monetized separately from projects", "ArtIn consulting page"]
    notes: >-
      Null means the assigned public evidence did not expose a usable price sheet, tariff schedule,
      or realized contract benchmark.
    claimRefs: [CI010, CI011, CI012, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Latest financing, "$255M announced in Mar 2026", Medium, "Sets near-term capital available for development activity", "Provide cash received to date, draw schedule, and restricted-use terms"]
      - [Funding chronology, "Conflicting: 1 round on FundedIQ vs 2 rounds on Tracxn", Low, "Round count inconsistency weakens confidence in financing history", "Reconcile full cap table and closing history"]
      - [Employee footprint, "11-50 employees on FundedIQ; multi-office footprint on company site", Low, "Operating leverage cannot be judged without exact headcount and contractor mix", "Provide functional headcount, payroll, and outsourced development spend"]
      - [Project capex burden, "$1.4B Texas project; $2.6B Nebraska project", Medium, "Shows capital intensity far beyond disclosed financing", "Provide cost-to-complete, sponsor equity needs, and lender assumptions"]
      - [Cash-flow support, "Management says investment-grade counterparties back long-term agreements", Medium, "Counterparty quality is central to project financeability", "Name counterparties and supply contract tenor, termination rights, and credit support"]
      - [Revenue / margin disclosure, null, Low, "Without revenue, gross margin, and working capital data the business cannot be underwritten on operating performance", "Provide audited revenue, gross margin bridge, and cash conversion by business line"]
      - [Runway / burn, null, Low, "Capital adequacy cannot be judged from funding headlines alone", "Provide monthly burn, development cash needs, and downside runway case"]
    notes: >-
      Values reflect public proxies only. Null means the assigned evidence exposed no decision-grade
      disclosure for that metric.
    claimRefs: [CI001, CI002, CI005, CI006, CI007, CI008, CI009, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources imply a development-led path from project origination to eventual contracted
      asset monetization, with gross-profit timing deferred behind permitting, financing, and
      construction milestones.
    data:
      nodes:
        - id: origination
          label: Project origination
          detail: "Solar, storage, hydrogen, and consulting opportunities originate from industrial offtakers, utilities, and enterprise energy needs."
          claimRefs: [CI006, CI009, CI012]
        - id: development
          label: Development work
          detail: "Agila proceeds are earmarked for interconnection, engineering, procurement, and construction-readiness work."
          claimRefs: [CI006, CI007]
        - id: contracts
          label: Contracted pipeline
          detail: "Management cites investment-grade counterparties and a large hydrogen contract, but public counterparties and economics are not disclosed."
          claimRefs: [CI009, CI010]
        - id: capital
          label: Project capital stack
          detail: "Milestone-based equity plus future project finance appear necessary because disclosed project capex exceeds disclosed financing."
          claimRefs: [CI007, CI008]
        - id: delivery
          label: Asset delivery
          detail: "Company pages show delivered installations such as the Ingredion and Casanare projects."
          claimRefs: [CI010, CI011]
        - id: gross-profit
          label: Gross profit conversion
          detail: "No assigned source discloses realized pricing, margin, or cash-conversion data, so this step remains unverified."
          claimRefs: [CI015, CI016]
      edges:
        - from: origination
          to: development
          label: "Pipeline enters development"
          claimRefs: [CI006]
        - from: development
          to: contracts
          label: "Contracts / milestones"
          claimRefs: [CI006, CI009, CI010]
        - from: contracts
          to: capital
          label: "Counterparty-backed financing case"
          claimRefs: [CI007, CI008, CI009]
        - from: capital
          to: delivery
          label: "Construction and installation"
          claimRefs: [CI010, CI011]
        - from: delivery
          to: gross-profit
          label: "Revenue and margin disclosure missing"
          claimRefs: [CI015, CI016]
    approximationNotes: >-
      This is a qualitative flow rather than a quantified waterfall because the assigned sources do
      not disclose customer counts, conversion rates, realized pricing, or gross margin.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011, CI015, CI016]
