  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "ArtIn Energy's public customer evidence is strongest for older Colombia solar deployments and weakest for current U.S. utility-scale counterparties. The assigned pool supports buyer segmentation around industrial offtakers, utilities, and institutional capital providers, but retention, concentration, and named U.S. offtaker proof remain undisclosed."
  },
  "sections": [
    {
      "id": "segment-mix-and-commercial-surface",
      "title": "Segment mix is legible, but mostly from counterparties rather than disclosed customer counts",
      "body": "The assigned pool makes ArtIn's commercial surface easier to infer from who it says it works with than from any disclosed customer denominator. Gaebler, the March 2026 financing release, and two trade-press rewrites all describe the company as partnering with industrial offtakers, utilities, and institutional investors around long-term contracted infrastructure assets, while the company projects page shows a different, older proof set in Colombia for behind-the-meter commercial and institutional solar installations. That creates two parallel customer stories: a current U.S. development pipeline where end buyers remain unnamed, and legacy case-study evidence where the buyer, site, and system size are more concrete but mostly company-authored.",
      "claimRefs": ["CU001", "CU002", "CU003", "CU004", "CU008"],
      "tableRefs": ["TU001"],
      "figureRefs": ["FU001"]
    },
    {
      "id": "named-proof-and-deployment-quality",
      "title": "Named proof exists, but it is concentrated in company-authored Colombia case studies",
      "body": "The best named deployment evidence in the assigned pool comes from ArtIn's own projects page, not from independent customer announcements or procurement records. That page names a 10 MWp Casanare solar farm in Colombia and additional installations tied to Ingredion, Innova Schools Mosquera, Casa Toro, Comercializadora Marden, UNAD, Universal Music Colombia, CDA La Playa, and BBVA-backed financing. The pattern is useful because it proves ArtIn has published specific customer names, capacities, and use cases, and because one deployment explicitly references a PPA structure. But it is still weaker than independently verified production, renewal, or utilization evidence, and the 2026 independent coverage in the assigned pool focuses capital formation rather than live customer operations.",
      "claimRefs": ["CU005", "CU006", "CU007", "CU009"],
      "tableRefs": ["TU003"]
    },
    {
      "id": "durability-expansion-and-concentration-gaps",
      "title": "Durability and concentration are still the largest diligence gaps",
      "body": "The retained sources do not disclose customer count, renewals, churn, NRR, GRR, contract length, or top-customer exposure, so durability still has to be inferred indirectly from pipeline and governance claims rather than operating metrics. The U.S. project narrative is sizable on paper, but the counterparties behind the Texas and Nebraska projects are unnamed, and the claimed $25.4 billion green hydrogen contract likewise appears without a named buyer. That leaves concentration and credit-quality analysis unresolved. Tracxn adds a mildly negative external signal by placing ArtIn 39th with a 46/100 score in its displayed competitor table and by showing only one media event in the last year, which is thinner independent traction evidence than the company-sized valuation narrative would ordinarily warrant.",
      "claimRefs": ["CU010", "CU011", "CU012", "CU013", "CU014"],
      "tableRefs": ["TU002"]
    }
  ],
