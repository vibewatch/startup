tables:
  - id: "TV001"
    title: "Recommendation summary table"
    columns: ["Dimension", "Assessment", "Evidence", "Decision implication"]
    rows:
      - ["Recommendation", "Avoid at current implied price", "Funding event is real, but public evidence does not support paying the implied $14.5B today", "Do not underwrite on headline valuation alone"]
      - ["Confidence", "Medium", "Multiple sources corroborate the round; financial disclosure remains incomplete", "Hold view lightly until diligence pack is reviewed"]
      - ["Risk rating", "High", "Execution, disclosure, and valuation-reset risk dominate the upside case", "Require milestone-based downside protection or pass"]
      - ["Valuation stance", "Expensive", "Implied value references future large-project economics, not disclosed operating performance", "Only revisit after major de-risking or repricing"]
    notes: "Assessment reflects the retained pool only; no audited revenue, margin, or cap-table documents were available in assigned evidence."
    claimRefs: ["CV001", "CV003", "CV011", "CV012", "CV014", "CV015"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Side", "Argument", "What would change the view"]
    rows:
      - ["Thesis", "Agila's $255M commitment and milestone-based governance suggest at least one sophisticated capital provider sees real asset-conversion potential.", "Provide signed financing terms, board rights, and milestone schedules that confirm the transaction economics."]
      - ["Thesis", "If Texas and Nebraska advance into contracted construction-ready assets, the company could earn a premium platform valuation versus single-project developers.", "Disclose counterparties, NTP status, construction financing, and project-level cash-flow assumptions."]
      - ["Anti-thesis", "Independent market data still describes ArtIn as Series A and shows a crowded competitive set, which does not independently validate a premium multi-billion-dollar mark.", "Show third-party marks, secondary transactions, or audited performance that narrows the gap with larger peers."]
      - ["Anti-thesis", "Public proof in the retained pool leans on promotional pipeline claims and smaller historical installations rather than disclosed current earnings power.", "Produce audited financials plus verifiable evidence that flagship U.S. assets are converting beyond development-stage optionality."]
    notes: "Rows separate what is presently supported from what still requires document-level diligence; they are not probability-weighted outcomes."
    claimRefs: ["CV001", "CV004", "CV005", "CV006", "CV009", "CV011", "CV013", "CV014", "CV015"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Texas and Nebraska reach NTP or construction financing, counterparties are disclosed as investment-grade, and milestone funding unlocks further de-risking.", "Current premium mark becomes more defensible as a platform option on contracted infrastructure assets, though still needs audited economics.", "Execution delay, financing-market tightening, and overstated pipeline quality.", "Low until hard milestones and counterparties are publicly evidenced."]
      - ["Base", "Projects continue advancing but audited financials, counterparties, and preference-stack details remain undisclosed.", "Reasonable posture is track / research more rather than paying the current implied valuation.", "Extended opacity keeps new capital from validating the mark independently.", "Most consistent with the retained evidence."]
      - ["Bear", "Development milestones slip, financing terms tighten, or counterparties and project economics prove weaker than advertised.", "Down-round or mark-reset risk dominates because current valuation is already benchmarked to future large-asset outcomes.", "Dilution, governance friction, and inability to convert pipeline into financeable assets.", "Meaningful unless diligence closes the major evidence gaps."]
    notes: "No precise valuation range is asserted because the assigned pool lacks audited revenue, cash-flow, and cap-table inputs needed for defensible numeric scenarios."
    claimRefs: ["CV003", "CV004", "CV010", "CV011", "CV012", "CV013", "CV015"]
