      severity: "material"
      topic: "underwriting-gap"
      missingEvidence: "Audited income statement, cash-flow statement, balance sheet, and project-level development spend for the U.S. assets."
      whyItMatters: "Without audited financials, an investor cannot test whether the current mark is supported by earnings power, asset value, or balance-sheet quality."
      diligencePath: "Request the latest audited financial package and project models directly from management and reconcile them to financing materials."
      relatedQuestionRefs: ["QV001", "QV006"]
    - type: "missing-source"
      severity: "material"
      topic: "counterparty-disclosure"
      missingEvidence: "Named offtake counterparties, contract tenors, pricing terms, and milestone status for the Texas and Nebraska projects and the cited hydrogen contract."
      whyItMatters: "The current valuation relies on counterparties and contractability, yet the assigned pool does not let an outside investor verify those economics."
      diligencePath: "Obtain executed term sheets, offtake agreements, or lender diligence memos that identify counterparties and key commercial terms."
      relatedQuestionRefs: ["QV001", "QV007", "QV008"]
    - type: "missing-source"
      severity: "material"
      topic: "cap-table-terms"
      missingEvidence: "Round price per share, liquidation preferences, board rights, covenants, milestone draw conditions, and any side letters tied to the Agila financing."
      whyItMatters: "Transaction headline value can diverge sharply from true entry economics when preference stacks, protections, or staged funding are significant."
      diligencePath: "Review signed financing documents, board consents, and cap-table schedules before underwriting any entry price."
      relatedQuestionRefs: ["QV002", "QV008"]
    - type: "access-blocked"
      severity: "minor"
      topic: "valuation-corroboration"
      missingEvidence: "Usable article text from the allocated AI Journal funding and valuation result; its successful HTTP prefetch returned unrelated conference text."
      whyItMatters: "The result cannot be treated as corroboration for the financing or valuation while its fetched body is unrelated to ArtIn Energy."
      diligencePath: "In a later research run, retrieve a corrected publisher copy or exclude the URL again if it continues to return unrelated content."
      relatedQuestionRefs: ["QV001"]
