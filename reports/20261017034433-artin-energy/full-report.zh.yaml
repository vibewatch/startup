      - number: '1.4'
        title: 有日期的里程碑与剩余尽调阻碍
        blocks:
          - type: paragraph
            body: >
              相比 ArtIn 的主张规模，带日期的公开轨迹十分稀疏。材料显示公司于 2012 年成立、2024 年 4 月完成首轮融资、2026 年 3
              月发生战略融资，而当前官网仍未披露核心经营指标。同时，证据中还有一些规模极大但佐证薄弱的说法，包括高管页面声称拥有 $538 billion 的 PPA 资产，以及一篇第三方文章重复了 $25.4 billion
              绿色氢能合同和 $34 billion 管线的说法，却没有具名交易对手。这些问题不否定 ArtIn 的存在或近期融资更新，但意味着后文应把 headline
              规模和估值数字视为仍需持续佐证的主张，而非已确定的事实。
            claimRefs:
