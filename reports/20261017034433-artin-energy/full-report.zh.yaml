  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是多条切口，而不是单一清晰的可再生能源 TAM 故事
        blocks:
          - type: paragraph
            body: >-
              证据支持四条相邻的收入叙事，而不是一个边界清晰的市场：公用事业规模太阳能和电池储能开发、绿色氢能和电子甲醇基础设施、分布式商业及工业太阳能项目，以及与能源预测和储能调度相关的类软件优化。泛泛的“可再生能源”TAM
              会把截然不同的买方、采购周期和投资评估标准混在一起。与公司相关的融资公告一贯把核心切口放在由 PPA
              或其他长期协议支撑的公用事业规模项目上；项目案例和优化页面则显示，较小的分布式安装以及咨询、监测业务也并列存在。官网首页的多国联系点说明其对外营销的可服务地理范围可能比融资材料中点名的美国项目更广，但证据仍指向美国公用事业规模项目管线，这是近期最清晰的商业切口。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.2'
        title: 公开规模按项目和合同衡量，而非已披露的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              指定来源没有提供独立市场模型，能够分别测算 ArtIn 在太阳能、储能、氢能和优化领域的可服务市场。相反，证据给出了一组机会视角：近期用于美国后期开发的 $255 million 融资、两个具名美国项目合计约
              $4.0 billion 的已披露 CAPEX、公司宣布的 $25.4 billion 氢能合同，以及更宽泛的 $34 billion
              管线主张。这些数字能框定管理层想要商业化的范围，但不是可以相加的市场规模估计，也不能当作 TAM、SAM 或现金收入。证据中较独立的需求数据点是 Mercom 的说法：大型太阳能项目融资额在 2025 年较
              2024 年增长 37%。这支持资本市场顺风存在，但不能证明 ArtIn 能够捕捉到它。
