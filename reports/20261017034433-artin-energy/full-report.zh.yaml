            title: 规模主张仍跑在验证前面
            body: >
              公开证据支持 ArtIn 的存在、产品重点和 2026 年 3 月的新融资更新，但无法独立验证目前流传的最大几项规模主张。$14.58 billion 隐含估值、高管页面声称的 $538 billion PPA
              资产，以及报道中的 $25.4 billion 氢能合同，都需要更深入的交易对手、合同和财务佐证，才能被视为可靠事实。
