  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开来源显示，公司可能沿着开发驱动的路径，从项目发起走向最终签约资产变现；在许可、融资和建设里程碑完成前，毛利实现时间仍将后移。
    data:
      nodes:
        - id: origination
          label: 项目发起
          detail: 太阳能、储能、氢能和咨询机会，源自工业承购方、公用事业公司及企业能源需求。
          claimRefs:
            - CI006
            - CI009
            - CI012
        - id: development
          label: 开发工作
          detail: Agila 资金指定用于并网、工程、采购和达到可建设状态的工作。
          claimRefs:
            - CI006
            - CI007
        - id: contracts
          label: 已签约管线
          detail: 管理层提及投资级交易对手和一份大型氢能合同，但公开披露中没有交易对手和经济性数据。
          claimRefs:
            - CI009
            - CI010
        - id: capital
          label: 项目资本结构
          detail: 里程碑挂钩的股权融资加上未来项目融资似乎不可或缺，因为已披露项目资本开支超过已披露融资额。
          claimRefs:
            - CI007
            - CI008
        - id: delivery
          label: 资产交付
          detail: 公司页面展示了 Ingredion 和 Casanare 等已交付安装项目。
          claimRefs:
            - CI010
            - CI011
        - id: gross-profit
          label: 毛利转化
