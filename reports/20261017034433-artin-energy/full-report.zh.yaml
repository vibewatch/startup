              - CP014
      - number: '3.2'
        title: 解决方案范围同时带来直接竞品和替代方案
        blocks:
          - type: paragraph
            body: >-
              公司公开页面和报道表明，ArtIn
              试图覆盖多个相邻的待解决任务。其官方绿色氢能页面把氢能定位为燃气轮机、供热、工业应用和交通领域的替代品，因此现状不只是另一家创业公司，还包括既有燃料和现成工业能源系统。同时，ArtIn
              的项目页面展示了已融资并安装的商业太阳能系统，其中包括一个已披露的 PPA 案例，因此公司也与太阳能 EPC、分布式发电和商业 PPA 服务商重叠。官方 AI
              优化页面又把这种重叠延伸到软件驱动的监测和预测。范围越宽，可比较的对象越多，但差异化越难证明，因为每项能力都要面对不同的老牌企业或专业公司。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP015
      - number: '3.3'
        title: 渠道关系比公开标价更重要
        blocks:
          - type: paragraph
            body: >-
              指定证据几乎没有 ArtIn 或具名竞品可用的公开标价。证据显示的是一种靠谈判和关系驱动的获客方式：交易报道提到里程碑式资本、董事会层面监督，以及项目向建设融资推进；公司案例则提到 PPA、ENEL
              并网注入安排，以及 BBVA 或 Bancoldex
              支持的融资。这说明转换成本和赢单率与公开标价的关系较小，更多取决于合作伙伴渠道、融资准备度、交易对手信任，以及能否在一个流程中打包开发、能源供应和资本。Mercom 关于 Swift Current
              融资的案例是有用的基准：成熟的公用事业规模开发商也能通过完成资产层面的融资赢单，不需要完全复制 ArtIn 的多方案叙事。
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP012
              - CP013
      - number: '3.4'
        title: 护城河论证主要来自自述，因此持久性仍未证实
        blocks:
          - type: paragraph
            body: >-
              指定证据最不利的解读不是 ArtIn 缺乏野心，而是相对于其定位主张的规模，持久差异化的公开证明仍很薄弱。Tracxn 的排名把 ArtIn
              列在更大型老牌企业和专业太阳能开发商之后；指定证据也仍缺少公开定价、客户集中度和可重复的业绩基准。信任状况同样复杂：Power Technology 报道 Agila
              交易带来了新的治理控制，但管理团队页面又单独声称 ArtIn 资产负债表上有 USD 538 billion 的 PPA
              资产。没有更多文件，这一数量级很难与其他公开记录对上。在独立基准和商业条款披露前，护城河应被视为假设，而不是既成事实。
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP014
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 广度是核心定位主张
            body: 指定来源一致将 ArtIn 描述为不止一家太阳能开发商，但这种广度也把竞争范围扩展到公用事业、氢能替代方案、PPA 服务商和软件驱动的优化供应商。
            calloutType: insight
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
