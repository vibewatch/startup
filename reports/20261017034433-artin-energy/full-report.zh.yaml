            title: 护城河证据仍落后于定位
            body: 持久差异化的公开证据弱于 ArtIn 叙事的规模：定价、客户证明和可重复基准数据仍然稀缺，一些公司发布的大额主张也仍需独立验证。
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式仍靠推断，未作披露
        blocks:
          - type: paragraph
            body: >-
              指定来源描述了四条变现路径——公用事业规模太阳能开发、电池储能开发、绿色氢能基础设施，以及较小的商业或工业安装和优化服务——但都没有披露确认收入、客户集中度、定价表或毛利转化。独立报道将 2026 年 3 月
              Agila 融资与美国太阳能、储能和绿色燃料资产的后期开发工作联系起来；公司项目页面则展示了更早的自筹安装项目，以及基于太阳能电解的氢能流程。这种组合说明，ArtIn
              目前主要靠开发里程碑、项目执行和最终的项目融资变现，而不是靠可见的经常性软件或签约服务收入。
