      - number: '1.2'
        title: 领导层覆盖与治理透明度
        blocks:
          - type: paragraph
            body: >
              公开披露的领导层信息远不及 2026 年 3 月估值故事的规模。指定证据明确列 Jhon Cohen 为 CEO、Lucia 为 CFO，管理团队页面还列出 Oscar Rodriguez 和 Ancizar
              等业务开发人员。但同一批公开材料没有给出清晰的董事会名单、独立董事名单或持续的治理记录；融资公告却称 Agila
              将获得董事会层面的监督权。这种不对称很重要：现有证据要求投资人在支持性治理记录尚未完全公开前，先评估其机构治理能力。
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO009
              - CO010
      - number: '1.3'
        title: 资本形成信号与利益相关方图谱
        blocks:
          - type: paragraph
            body: >
              刷新后的证据大幅更新了资本形成主张，却没有同步提高支撑性透明度。公司控制的融资披露以及 Power Technology / GlobalData 的转载均指向 Agila 确定投资 $255
              million、隐含估值 $14.58 billion；Tracxn 则称两轮融资、两家机构投资者合计募资 $255
              million。这些事实足以搭起当前的资本故事，但没有披露投资工具、交割机制、股权表持有情况，也没有披露据称支持 Texas 和 Nebraska
              项目的投资级购电方名称。因此，利益相关方图谱的方向已较清楚，但仍缺少可用于尽调的文件。
            claimRefs:
              - CO004
