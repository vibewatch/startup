  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议从真实的融资信号转向较弱的投资判断，是因为公开证明仍取决于里程碑和披露。
    data:
      nodes:
        - id: funding
          label: 2.55 亿美元融资已确认
          summary: Multiple sources corroborate the Agila investment.
        - id: valuation
          label: 145 亿美元隐含估值
          summary: Value is tied to Texas and Nebraska project economics.
        - id: governance
          label: 治理改善
          summary: Milestone funding and board oversight modestly de-risk execution.
        - id: proof-gap
          label: 经审计证明缺口
          summary: No retained audited revenue, cash flow, or cap-table evidence.
        - id: execution
          label: 里程碑仍待完成
          summary: Interconnection, engineering, procurement, NTP, and financing remain key conversion steps.
        - id: decision
          label: 按当前价格回避
          summary: Wait for de-risking or repricing before underwriting.
      edges:
        - from: funding
          to: valuation
          label: 锚定
        - from: valuation
          to: governance
          label: 受到制约
        - from: governance
          to: proof-gap
          label: 无法抵消
        - from: proof-gap
          to: execution
          label: 放大
        - from: execution
          to: decision
          label: 推动
    approximationNotes: 该图为定性图，因为留存证据池对里程碑逻辑的支持强于对精确估值区间的支持。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV011
      - CV012
