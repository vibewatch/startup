      - number: '2.3'
        title: 采用驱动因素清晰，但转化证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              证据表明，采用 ArtIn 的动力来自能源基础设施领域常见的因素：长期购电、公共事业和工业客户对签约清洁电力的需求、联邦政策对太阳能和储能的支持，以及氢能在工业脱碳中的应用。分布式案例还显示，ArtIn
              围绕降低能源成本和部署现场太阳能进行营销；优化页面则主打更好的预测，以及储能或需求管理。即便如此，公开材料仍未披露 Texas、Nebraska
              或氢能主张背后的交易对手，也未说明每个细分市场的预算决策者，更没有给出独立方法把这些相邻切口转化为可辩护的可服务市场。因此，市场吸引力更多取决于项目转化和交易对手质量，而非清洁能源终端市场是否抽象存在。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 市场故事比可用于投资判断的证据更宽
            body: 指定证据支持多条相邻切口，但没有给出一个独立分母，把太阳能、储能、氢能和优化合并成一个可辩护的可服务市场。
            calloutType: risk
            claimRefs:
              - CM001
              - CM009
              - CM010
