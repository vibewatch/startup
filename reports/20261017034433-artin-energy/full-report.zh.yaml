  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与经营概况
        blocks:
          - type: paragraph
            body: >
              指定来源足以确认 ArtIn Energy 的基本身份，但这一身份仍主要依赖公司控制的页面和一个外部数据库档案，而非完整的公开申报材料。Tracxn 将 ArtIn 列为一家总部位于 Tampa、2012
              年成立的 Series A 公司；公司当前融资表述则将其描述为一家全球可再生能源基础设施平台，聚焦公用事业规模太阳能、电池储能、绿色氢能和电子甲醇。当前官网还显示其在 New
              York、Houston、Florida、Utah、Toronto、Delhi 和 Pretoria 设有广泛联系点，说明其商业布局具有国际化色彩，但不能证明每个地点都有员工或资产归属。
            claimRefs:
