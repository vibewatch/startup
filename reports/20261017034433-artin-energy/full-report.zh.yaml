  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据呈现出一套从客户工作流延伸到开发、资产、控制和质量门槛的平台堆栈。
    data:
      layers:
        - label: 客户工作流
          detail: 工业用户、公用事业公司和机构资本，似乎是分布式太阳能、公用事业级资产和可再生燃料业务的主要采购或签约入口。
          modules:
            - 工业与商业电力成本降低
            - 已签约的公用事业级清洁电力交付
            - 低碳燃料及电力 / 热能使用场景
        - label: 开发与签约
          detail: 平台被呈现为一台开发引擎，将融资、承购结构设计、治理和里程碑推进结合起来，推动项目走向建设。
          modules:
            - 里程碑挂钩融资
            - 长期承购协议
            - 董事会席位与模型验证
        - label: 太阳能资产层
          detail: 公开案例显示，公司为商业、教育和工业客户交付了光伏系统，并有并网和 PPA 案例。
          modules:
            - 光伏组件
            - 逆变器与安装
            - 并网或现场消纳
        - label: 储能与燃料层
          detail: 公用事业级电池储能、绿色氢能和电子甲醇被定位为太阳能平台周边的相邻模块，尤其针对美国管线。
          modules:
            - BESS
            - 氢能储存
            - 电子甲醇基础设施
        - label: 优化与监控
          detail: 公司材料描述了用于太阳能发电系统的 AI 预测、实时监控和参数调整。
          modules:
            - 历史数据与天气输入
            - 面板与逆变器实时监控
            - 动态参数调整
        - label: 质量与合规控制
          detail: 公开质量信号包括 IEC 和 ISO 参考，以及案例中关于 RETIE 合规、税收优惠批准和监控的证据。
          modules:
            - IEC 61215 和 IEC 61730 参考
            - ISO 9001、ISO 14001、ISO 45001 参考
            - RETIE 与 UPME 案例控制
    approximationNotes: 该堆栈是公开披露地图，不是经过验证的工程示意图；仅保留分配证据中明确描述的层级。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
      - CE012
