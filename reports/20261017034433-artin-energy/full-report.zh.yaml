              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 最终尽调要求与止损标准
        blocks:
          - type: paragraph
            body: >
              剩余工作并不复杂，但不可省略。在把 Agila
              轮融资视为内在价值而非期权价值的验证前，投资人需要已签署融资文件、董事会权利和优先股堆叠、经审计的历史财务数据、项目层面里程碑计划、具名购电方，以及公司能从较小的历史部署跨越到数十亿美元美国资产的证据。可信的重新进入触发条件是披露
              Texas 和 Nebraska 项目已在交易对手及可独立核查的经济性支持下达到开工通知或建设融资阶段。若有证据表明这些里程碑大幅延误、交易对手弱于暗示，或下一轮融资低于当前 headline
              估值，投资论点就应失效。
