      - number: '4.2'
        title: 资本需求明确，但没有现金创造证据
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务信号是资本密集度。Mercom 和 Yahoo 均称 Texas 和 Nebraska 管线项目的资本开支约为 $1.4 billion 和 $2.6 billion；Yahoo 的报道还称
              Agila
              资金按里程碑拨付，由董事会监督，并配有经过验证的财务模型。这些细节从方向上支持治理，但也说明投资判断依赖未来项目融资、交易对手表现和建设准备度，而不是内部经营现金流。公司控制的页面还显示其经营版图地域广泛，并有一个规模较小的
