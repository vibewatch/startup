  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争版图比普通单产品竞品集更宽
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以为 ArtIn Energy 建立狭窄的可比公司集合。Tracxn 将其置于 2,075 家活跃竞争者中，并明确列出 Enel X、Southern 和 Origis Energy
              为头部竞争者；前十名单还包括公用事业公司、可再生能源项目开发商和分布式太阳能服务商。这份混合名单与其他指定证据相符：2026 年 3 月交易报道将 ArtIn
              描述为覆盖公用事业规模太阳能、电池储能、绿色氢能和电子甲醇的开发商，交易对手包括工业购电方、公用事业和机构投资者。实际买方比较 ArtIn
              时，不只会看直接可再生能源开发商，也会比较公用事业公司、资本密集型老牌企业，以及只解决同一脱碳预算一部分问题的专业公司。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
