              由于保留证据没有提供经审计财务报表、现金流可见性或股权表经济性，情景应围绕里程碑转化，而不是对倍数进行虚假的精确估计。乐观情景下，只有美国项目在披露交易对手和融资方案的情况下推进至开工通知，当前估值才会更可信。基准情景下，公司可能继续推进，但已验证的经济性仍不足以让新投资人有信心评估当前价格。悲观情景下，开发里程碑任何延迟或融资条件恶化，都将暴露显著的下轮融资风险，因为当前估值已经对标数十亿美元的未来项目，而非已证明的当前规模。因此，根据这批证据，正确立场是遵守价格纪律、避免投资，而不是背书。
