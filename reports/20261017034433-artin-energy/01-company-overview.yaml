callouts:
  - calloutType: risk
    title: Scale claims still outrun verification
    body: >
      The public evidence supports ArtIn's existence, product focus, and a fresh March 2026
      financing update, but it does not independently verify the largest scale assertions now in
      circulation. The $14.58 billion implied valuation, the $538 billion PPA-asset claim on the
      executive page, and the reported $25.4 billion hydrogen contract all require deeper
      counterparty, contract, and financial corroboration before they should be treated as durable
      ground truth.
    claimRefs: [CO005, CO010, CO013, CO014, CO015]
