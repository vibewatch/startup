artifact: company-overview
slug: artin-energy
runDate: 2026-10-17
company:
  name: ArtIn Energy
chapter:
  number: 1
  title: Company Overview
  summary: >
    ArtIn Energy presents itself as a global renewable-energy developer spanning utility-scale
    solar, battery storage, green hydrogen, and e-methanol, with a March 2026 financing package
    that claims $255 million of new capital and a $14.58 billion valuation. The assigned
    evidence set establishes a public identity, selected operating history, and named executives,
    but it still leaves core diligence items--counterparties, audited financials, customer count,
    headcount, and board detail--unverified.
sections:
  - id: identity-and-footprint
    title: Identity, footprint, and operating profile
    body: >
      The assigned source set supports a basic identity for ArtIn Energy, but that identity still
      depends on a mix of company-controlled pages and one external database profile rather than a
      comprehensive public filing set. Tracxn lists ArtIn as a Tampa-based Series A company founded
      in 2012, while the company's own current financing language describes a global renewable
      energy infrastructure platform focused on utility-scale solar, battery storage, green
      hydrogen, and e-methanol. Current official pages also show a broad contact footprint across
      New York, Houston, Florida, Utah, Toronto, Delhi, and Pretoria, which signals an
      international commercial posture but does not prove headcount or asset ownership in each
      location.
    claimRefs: [CO001, CO002, CO003, CO011, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership coverage and governance visibility
    body: >
      Public leadership disclosure is narrower than the scale of the March 2026 valuation story.
      The assigned evidence clearly names Jhon Cohen as CEO and Lucia as CFO, and the executive
      team page adds business-development operators including Oscar Rodriguez and Ancizar. However,
      the same public materials do not provide a clean board roster, independent director list, or
      durable governance history, even though the financing announcement says Agila will receive
      board-level oversight rights. That asymmetry matters because the available evidence asks
      investors to underwrite institutional governance before the supporting governance record is
      fully public.
    claimRefs: [CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: capitalization-and-stakeholders
    title: Capitalization signals and stakeholder map
    body: >
      The refresh evidence materially updates capital-formation claims but not the supporting
      transparency. Company-controlled financing disclosures and a Power Technology / GlobalData
      republication point to a definitive $255 million Agila investment and an implied $14.58
      billion valuation, while Tracxn reports $255 million total funding across two rounds and two
      institutional investors. Those facts are enough to anchor the current capital narrative, but
      they do not disclose the investment instrument, closing mechanics, cap-table ownership, or
      the names of the investment-grade offtakers that supposedly support the Texas and Nebraska
      projects. The result is a stakeholder picture that is directionally clear yet still thin on
      diligence-grade documentation.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO014]
    tableRefs: [TO003]
  - id: milestones-and-open-risks
    title: Dated milestones and remaining diligence blockers
    body: >
      The dated public trail is sparse relative to the scale of ArtIn's claims. It shows a 2012
      founding year, a first funding round recorded in April 2024, a March 2026 strategic
      financing event, and current official pages that still omit core operating metrics. At the
      same time, the evidence set contains unusually large but weakly corroborated scale assertions,
      including a $538 billion PPA-asset claim on the executive page and a third-party article that
      repeats a claimed $25.4 billion green-hydrogen contract plus a $34 billion pipeline without
      naming the counterparty. Those issues do not invalidate ArtIn's existence or recent financing
      update, but they do mean later chapters should treat headline scale and valuation numbers as
      claims requiring continued corroboration rather than settled ground truth.
    claimRefs: [CO002, CO004, CO005, CO007, CO010, CO013, CO014, CO015]
    figureRefs: [FO001]
