      - [Southern, Utility incumbent, "Public; Tracxn score 67/100", "Utility, natural gas, and communications customers", "Distribution, regulatory, and utility-scale operating footprint", "Assigned pool does not show renewable-only specialization or hydrogen-specific proof"]
      - [Enel X, Integrated energy competitor, "$168M; acquired; Tracxn score 75/100", "Utility-scale renewable project customers", "Named top competitor with project-development scope", "Assigned pool does not show current package or pricing detail"]
