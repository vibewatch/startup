    columns:
      - Buying criterion
      - ArtIn Energy
      - Direct developers
      - Incumbent utilities / integrators
      - Adjacent distributed providers
      - Evidence note
    rows:
      - ["Utility-scale solar development", "Yes; repeated in March 2026 funding coverage", "Yes; Origis, NextEra, and EDF appear in Tracxn roster", "Yes; Southern and Enel X are listed competitors with broader infrastructure footprints", "Partial or different scope", "Direct-developer and incumbent columns are evidenced through Tracxn descriptions, not detailed product manuals"]
      - ["Battery storage integration", "Yes; public coverage says battery storage is part of the platform", "Unknown in assigned pool", "Unknown in assigned pool", "Unknown in assigned pool", "Only ArtIn's assigned public evidence specifically mentions BESS"]
      - ["Green hydrogen offering", "Yes; official page plus external profiles", "Unknown in assigned pool", "Unknown in assigned pool", "Unknown in assigned pool", "Assigned comparator evidence does not show which named peers currently sell hydrogen"]
      - ["On-site commercial solar / PPA delivery", "Yes; projects page cites commercial installations and a PPA contract", "Unknown in assigned pool", "Unknown in assigned pool", "Likely yes for some providers, but not evidenced in assigned pool", "Do not infer more than the assigned text supports"]
      - ["AI optimization / monitoring", "Yes; official page claims forecasting, monitoring, and storage optimization", "Unknown in assigned pool", "Unknown in assigned pool", "Unknown in assigned pool", "Only ArtIn's own page in the assigned pool discloses this layer"]
    notes: >-
      Unknown means the assigned worker pool did not contain supporting text for that cell; it does
      not imply the competitor lacks the capability.
    claimRefs: [CP003, CP005, CP006, CP007, CP015]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer class
      - Price / contract model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - ["ArtIn utility-scale development", "Milestone-based capital and long-term contracted infrastructure; no public list pricing", "Interconnection, engineering, procurement, and construction-readiness support", "Fee share, target IRR, and contract economics undisclosed", "Competition likely turns on financing readiness and counterparties rather than posted price"]
      - ["ArtIn commercial solar / PPA", "PPA contract disclosed in one case study; no tariff or term sheet published", "Finance, manufacture, installation, monitoring, and grid-injection support", "Rate, tenor, and performance guarantees undisclosed", "ArtIn competes with PPA and EPC providers through bespoke project packaging"]
      - ["ArtIn green hydrogen flagship", "$25.4B contract value disclosed; no unit pricing or offtake economics published", "876 MW hydrogen production facilities and fuel-substitution narrative", "Counterparty identity, delivered price, and contract structure undisclosed", "Buyers will compare project economics against incumbent fuel and electrification alternatives"]
      - ["Named comparator cohort", "No public prices surfaced in assigned evidence for Origis, NextEra, Southern, Enel X, or SolarMax", "Mix of project development, utility supply, and installed solar offerings", "Assigned pool lacks current list pricing or standard package disclosures", "Public comparison is about scope, capital, and distribution power more than posted price"]
    notes: >-
      This table records only terms explicitly visible in the assigned public evidence; absent prices
      and contract parameters remain diligence gaps rather than zero values.
    claimRefs: [CP004, CP009, CP012, CP013]
