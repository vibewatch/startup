          claimRefs: [CP001, CP014]
    approximationNotes: >-
      Coordinates are ordinal judgments derived from the assigned pool's disclosed scope, funding,
      ownership status, and utility footprint; they are not benchmark scores or market-share measures.
    claimRefs: [CP003, CP008, CP014]
callouts:
  - calloutType: insight
    title: Breadth is the core positioning claim
    body: >-
      Assigned sources consistently frame ArtIn as broader than a single solar developer, but that
      same breadth expands the competitor set to utilities, hydrogen substitutes, PPA providers, and
      software-led optimization vendors.
    claimRefs: [CP003, CP005, CP006, CP007]
  - calloutType: risk
    title: Moat proof still lags positioning
    body: >-
      Public evidence of durable differentiation is weaker than the scale of ArtIn's narrative because
      pricing, customer proof, and repeatable benchmark data remain sparse, while some very large
      company-issued claims still need independent verification.
    claimRefs: [CP010, CP012, CP014]
