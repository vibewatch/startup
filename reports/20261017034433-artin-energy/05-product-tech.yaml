  evidenceGaps:
    - type: missing-source
      severity: material
      topic: hydrogen-pipeline-claim
      missingEvidence: Independent disclosure of the 876 MW hydrogen contract counterparty, project site, timeline, and technical configuration.
      whyItMatters: Without independent project-level evidence, the hydrogen roadmap cannot be underwritten as near-term execution proof.
      diligencePath: Obtain signed offtake or EPC counterparties, permitting package, and site-level development schedule for the claimed hydrogen contract.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: disclosure-depth
      missingEvidence: Asset-level uptime, commissioning, telemetry, or software integration documentation for solar, storage, and hydrogen assets.
      whyItMatters: Reliability and implementation risk cannot be assessed from marketing copy alone, especially for utility-scale projects and any software control layer.
      diligencePath: Request commissioning reports, O&M dashboards, integration architecture, and operational KPIs for representative deployed assets.
