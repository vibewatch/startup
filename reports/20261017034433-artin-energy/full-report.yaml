        title: Segment mix is legible, but mostly from counterparties rather than disclosed customer counts
        blocks:
          - type: paragraph
            body: >-
              The assigned pool makes ArtIn's commercial surface easier to infer from who it says it works with than
              from any disclosed customer denominator. Gaebler, the March 2026 financing release, and two trade-press
