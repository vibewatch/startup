      - number: '2.3'
        title: Adoption drivers are visible, but conversion proof is still thin
        blocks:
          - type: paragraph
            body: >-
              The evidence suggests adoption is helped by familiar energy-infrastructure drivers: long-dated offtake,
              utility and industrial demand for contracted clean power, federal-policy support for solar and storage,
              and industrial decarbonization use cases for hydrogen. The distributed case studies also show that ArtIn
              markets around lower energy cost and onsite solar deployment, while the optimization page pitches better
              forecasting and storage or demand management. Even so, the public package stops short of naming the
              counterparties behind the headline Texas, Nebraska, or hydrogen claims, disclosing who owns the budget in
              each segment, or showing an independent methodology that turns these adjacent wedges into a defendable
              serviceable market. As a result, market attractiveness is more a question of project conversion and
              counterparty quality than a question of whether clean-energy end markets exist in the abstract.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market story is broader than the underwritten evidence
            body: >-
              The assigned pool supports multiple adjacent wedges, but it does not show one independent denominator that
              turns solar, storage, hydrogen, and optimization into a single defensible serviceable market.
            calloutType: risk
            claimRefs:
              - CM001
              - CM009
              - CM010
