      - number: '4.2'
        title: Capital needs are explicit; cash-generation evidence is not
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial signal is capital intensity. Mercom and Yahoo each describe the Texas and
              Nebraska pipeline projects as carrying roughly $1.4 billion and $2.6 billion of capital expenditure, and
              the Yahoo coverage says Agila's funding is milestone-based with board-level oversight and validated
              financial models. Those details are directionally supportive for governance, but they also imply that
              underwriting depends on future project finance, counterparty performance, and construction readiness
              rather than internally funded operating cash flow. Company-controlled pages add a geographically broad
              operating footprint and a smaller $8 million Colombia project, but they do not disclose current cash,
              debt, working capital, or burn.
