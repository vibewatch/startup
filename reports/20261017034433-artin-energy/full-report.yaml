      - number: '6.2'
        title: Named proof exists, but it is concentrated in company-authored Colombia case studies
        blocks:
          - type: paragraph
            body: >-
              The best named deployment evidence in the assigned pool comes from ArtIn's own projects page, not from
              independent customer announcements or procurement records. That page names a 10 MWp Casanare solar farm in
              Colombia and additional installations tied to Ingredion, Innova Schools Mosquera, Casa Toro,
              Comercializadora Marden, UNAD, Universal Music Colombia, CDA La Playa, and BBVA-backed financing. The
              pattern is useful because it proves ArtIn has published specific customer names, capacities, and use
              cases, and because one deployment explicitly references a PPA structure. But it is still weaker than
              independently verified production, renewal, or utilization evidence, and the 2026 independent coverage in
              the assigned pool focuses capital formation rather than live customer operations.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU003
