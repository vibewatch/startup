      - number: '4.3'
        title: Financial diligence blockers outweigh the public upside narrative
        blocks:
          - type: paragraph
            body: >-
              The underwriting problem is not lack of ambition; it is lack of decision-grade financial disclosure.
              FundedIQ and Tracxn both support the headline that ArtIn has raised $255 million, but they disagree on
              whether that capital came in one round or two, and Tracxn classifies the company as Series A. Meanwhile,
              management biography pages make extraordinary balance-sheet style claims such as "$538 billion in PPA
              assets" without reconciliation to audited statements, revenue, or project-level economics. Until diligence
              produces audited financials, realized pricing, customer-level contract terms, and project-finance
              obligations, the company should be viewed as a pre-revenue or minimally disclosed development platform
              whose valuation depends far more on execution assumptions than on evidenced unit economics.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI007
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is a bridge, not proof of operating economics
            body: >-
              The $255 million Agila financing improves near-term development capacity, but the disclosed use of
              proceeds is still pre-construction work on multi-billion-dollar projects rather than proof of self-funding
              cash generation.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: callout
            title: Underwrite on milestone conversion and contract proof
            body: >-
              Any investment case should hinge on named counterparties, audited statements, project-level
              cost-to-complete, and realized pricing rather than on pipeline size, management biographies, or
              promotional valuation narratives.
            calloutType: recommendation
            claimRefs:
