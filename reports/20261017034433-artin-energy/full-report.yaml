  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Texas and Nebraska reach NTP or construction financing, counterparties are disclosed as investment-grade, and
          milestone funding unlocks further de-risking.
        - >-
          Current premium mark becomes more defensible as a platform option on contracted infrastructure assets, though
          still needs audited economics.
        - Execution delay, financing-market tightening, and overstated pipeline quality.
        - Low until hard milestones and counterparties are publicly evidenced.
      - - Base
        - >-
          Projects continue advancing but audited financials, counterparties, and preference-stack details remain
          undisclosed.
        - Reasonable posture is track / research more rather than paying the current implied valuation.
        - Extended opacity keeps new capital from validating the mark independently.
        - Most consistent with the retained evidence.
      - - Bear
        - >-
          Development milestones slip, financing terms tighten, or counterparties and project economics prove weaker
          than advertised.
        - >-
          Down-round or mark-reset risk dominates because current valuation is already benchmarked to future large-asset
          outcomes.
        - Dilution, governance friction, and inability to convert pipeline into financeable assets.
        - Meaningful unless diligence closes the major evidence gaps.
    notes: >-
      No precise valuation range is asserted because the assigned pool lacks audited revenue, cash-flow, and cap-table
      inputs needed for defensible numeric scenarios.
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
