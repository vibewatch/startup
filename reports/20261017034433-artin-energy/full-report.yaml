              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price signal and evidence base
        blocks:
          - type: paragraph
            body: >
              The strongest current valuation datapoint in the retained pool is the March 2026 Agila transaction:
              multiple sources say ArtIn Energy agreed a $255 million investment tied to its U.S. renewable portfolio,
              while company-linked releases describe two flagship projects in Texas and Nebraska whose stated capital
              requirements imply roughly a $14.5 billion enterprise value. That is a real market signal, but it is still
              a transaction-level signal rather than a broad underwriting record. The same evidence package does not
              disclose audited revenue, margin, cash generation, named offtake counterparties, or project-level contract
              economics that would let an outside investor test whether the implied valuation is supported by contracted
              cash flows instead of development-stage expectations alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
              - CV012
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >
              The investable thesis is that ArtIn has assembled late-stage U.S. solar, storage, and green-fuels projects
              that could convert into infrastructure-grade assets once interconnection, engineering, procurement, and
              financing milestones are cleared. Governance language around milestone-based funding and board oversight
              marginally improves that case. The anti-thesis remains stronger in public evidence: Tracxn still
              classifies the company as Series A, public operating proof in the pool is mostly smaller historical
              installations, and company-controlled materials make unusually large claims such as $25.4 billion of
              hydrogen contract value, a $34 billion pipeline, and $538 billion of PPA assets without corresponding
              audited disclosures in the assigned evidence set. That combination supports a view that the promotional
              narrative currently runs ahead of independently disclosed fundamentals.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario discipline and valuation stance
        blocks:
          - type: paragraph
            body: >
              Because the retained evidence does not provide audited financial statements, cash-flow visibility, or
              cap-table economics, the scenarios should be framed around milestone conversion rather than false
              precision on multiples. In the bull case, the current mark becomes more credible only if the U.S. projects
              advance to notice-to-proceed with disclosed counterparties and financing packages. In the base case, the
              company may keep progressing but still lacks enough verified economics for a new investor to underwrite
              the current price confidently. In the bear case, any slippage in development milestones or deterioration
              in financing conditions would expose meaningful down-round risk because the current valuation is already
              benchmarked against multi-billion-dollar future projects rather than demonstrated current scale. The right
              stance from this pool is therefore price-disciplined avoidance rather than endorsement.
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Final diligence asks and kill criteria
        blocks:
          - type: paragraph
            body: >
              The remaining work is straightforward but non-optional. Before treating the Agila round as validation of
              intrinsic value rather than optionality, an investor would need the signed financing documents,
              board-rights and preference stack, audited historical financials, project-level milestone schedules, named
              offtake counterparties, and evidence that the company can bridge from smaller historical deployments into
              multi-billion-dollar U.S. assets. A credible re-entry trigger would be disclosure that the Texas and
              Nebraska projects have reached notice-to-proceed or construction financing with counterparties and
              economics that can be independently checked. A thesis-break trigger would be any evidence that those
              milestones slip materially, that counterparties are weaker than implied, or that the next financing occurs
              below the current headline mark.
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Avoid the current price signal unless diligence converts the project-level narrative into auditable
              cash-flow evidence and disclosed financing terms.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV011
              - CV012
          - type: callout
            title: Main downside
            body: >-
              The current valuation is anchored to future flagship-project economics, so any milestone slip or
              weaker-than-advertised counterparty support can force a valuation reset.
            calloutType: risk
            claimRefs:
              - CV003
              - CV012
              - CV015
          - type: callout
            title: What would improve the view
            body: >-
              Named counterparties, signed financing documents, and notice-to-proceed evidence for the Texas and
              Nebraska assets would materially strengthen underwriting confidence.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
