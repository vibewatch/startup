              - CO015
      - number: '1.2'
        title: Leadership coverage and governance visibility
        blocks:
          - type: paragraph
            body: >
              Public leadership disclosure is narrower than the scale of the March 2026 valuation story. The assigned
              evidence clearly names Jhon Cohen as CEO and Lucia as CFO, and the executive team page adds
              business-development operators including Oscar Rodriguez and Ancizar. However, the same public materials
              do not provide a clean board roster, independent director list, or durable governance history, even though
              the financing announcement says Agila will receive board-level oversight rights. That asymmetry matters
              because the available evidence asks investors to underwrite institutional governance before the supporting
              governance record is fully public.
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO009
              - CO010
      - number: '1.3'
        title: Capitalization signals and stakeholder map
        blocks:
          - type: paragraph
            body: >
              The refresh evidence materially updates capital-formation claims but not the supporting transparency.
              Company-controlled financing disclosures and a Power Technology / GlobalData republication point to a
              definitive $255 million Agila investment and an implied $14.58 billion valuation, while Tracxn reports
              $255 million total funding across two rounds and two institutional investors. Those facts are enough to
              anchor the current capital narrative, but they do not disclose the investment instrument, closing
              mechanics, cap-table ownership, or the names of the investment-grade offtakers that supposedly support the
              Texas and Nebraska projects. The result is a stakeholder picture that is directionally clear yet still
              thin on diligence-grade documentation.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO006
              - CO008
              - CO011
              - CO014
      - number: '1.4'
        title: Dated milestones and remaining diligence blockers
        blocks:
          - type: paragraph
            body: >
              The dated public trail is sparse relative to the scale of ArtIn's claims. It shows a 2012 founding year, a
              first funding round recorded in April 2024, a March 2026 strategic financing event, and current official
              pages that still omit core operating metrics. At the same time, the evidence set contains unusually large
              but weakly corroborated scale assertions, including a $538 billion PPA-asset claim on the executive page
              and a third-party article that repeats a claimed $25.4 billion green-hydrogen contract plus a $34 billion
              pipeline without naming the counterparty. Those issues do not invalidate ArtIn's existence or recent
              financing update, but they do mean later chapters should treat headline scale and valuation numbers as
              claims requiring continued corroboration rather than settled ground truth.
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO007
              - CO010
              - CO013
              - CO014
              - CO015
