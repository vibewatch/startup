      - number: '3.2'
        title: Solution scope creates both direct peers and substitute alternatives
        blocks:
          - type: paragraph
            body: >-
              Public company pages and coverage indicate that ArtIn is trying to compete across several adjacent jobs to
              be done. Its official green-hydrogen page frames hydrogen as a substitute for gas turbines, heating,
              industrial applications, and transportation, which means the status quo is not another startup alone but
              incumbent fuels and existing industrial energy systems. At the same time, ArtIn's project page shows
              financed and installed commercial solar systems, including a disclosed PPA case, so the company also
              overlaps with solar EPC, distributed generation, and commercial PPA providers. The official AI
              optimization page extends that overlap into software-led monitoring and forecasting. Breadth expands the
              addressable comparison set, but it also makes differentiated proof harder because each capability is
              benchmarked against a different incumbent or specialist.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP015
      - number: '3.3'
        title: Distribution relationships matter more than public list pricing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence provides almost no usable list pricing for ArtIn or the named peers. What it does
              show is a negotiated, relationship-driven go-to-market motion: transaction coverage describes
              milestone-based capital, board-level oversight, and project advancement toward construction financing,
              while company case studies cite PPAs, ENEL grid-injection arrangements, and BBVA or Bancoldex-backed
              financing. That combination suggests that switching costs and win rates will depend less on public sticker
              price and more on partner access, financing readiness, counterparty trust, and the ability to package
              development, energy supply, and capital in one process. Mercom's Swift Current financing example is a
              useful benchmark because it shows mature utility-scale developers can also win by closing asset-level
              financing without needing ArtIn's exact multi-solution narrative.
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP012
              - CP013
      - number: '3.4'
        title: Durability remains unproven because the moat case is mostly self-described
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse read from the assigned pool is not that ArtIn lacks ambition, but that public proof
              of durable differentiation remains thin relative to the size of its positioning claims. Tracxn places
              ArtIn below larger incumbents and specialist solar developers on its ranked list, while public pricing,
              customer concentration, and repeatable performance benchmarks are still missing from the assigned
              evidence. The trust posture is also mixed: Power Technology reports new governance controls through the
              Agila transaction, but the executive-team page separately claims USD 538 billion of PPA assets on ArtIn's
              balance sheet, a magnitude that is hard to reconcile with the rest of the public record without additional
              documentation. Until independent benchmarking and commercial terms are disclosed, the moat case should be
              treated as a hypothesis rather than an established fact.
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the core positioning claim
            body: >-
              Assigned sources consistently frame ArtIn as broader than a single solar developer, but that same breadth
              expands the competitor set to utilities, hydrogen substitutes, PPA providers, and software-led
              optimization vendors.
            calloutType: insight
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Moat proof still lags positioning
            body: >-
              Public evidence of durable differentiation is weaker than the scale of ArtIn's narrative because pricing,
              customer proof, and repeatable benchmark data remain sparse, while some very large company-issued claims
              still need independent verification.
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model remains inferential, not disclosed
        blocks:
          - type: paragraph
            body: >-
              The assigned sources describe four monetization paths — utility-scale solar development, battery storage
              development, green hydrogen infrastructure, and smaller commercial or industrial installations plus
              optimization services — but none disclose recognized revenue, customer concentration, pricing schedules,
              or gross profit conversion. Independent reporting ties the March 2026 Agila financing to late-stage
              development work on U.S. solar, storage, and green-fuel assets, while company project pages show earlier
              self-financed installation work and a hydrogen workflow based on solar-powered electrolysis. That mix
              implies ArtIn is still monetized primarily through development milestones, project execution, and
              eventually project finance rather than visible recurring software or contracted service revenue.
