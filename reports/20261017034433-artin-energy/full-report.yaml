  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth is wider than a normal single-product competitor set
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not support a narrow peer set for ArtIn Energy. Tracxn classifies the company
              against 2,075 active competitors and explicitly names Enel X, Southern, and Origis Energy as top
              competitors, while its top-ten roster also includes utilities, renewable project developers, and
              distributed solar providers. That mixed list fits the rest of the assigned evidence: March 2026
              transaction coverage describes ArtIn as a developer spanning utility-scale solar, battery storage, green
              hydrogen, and e-methanol, with industrial offtakers, utilities, and institutional investors as
              counterparties. In practice, buyers can compare ArtIn not just with direct renewable developers, but also
              with utilities, capital-heavy incumbents, and narrower specialists that address only one part of the same
              decarbonization budget.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP014
