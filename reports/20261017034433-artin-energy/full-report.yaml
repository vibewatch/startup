  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly evidenced platform stack from customer workflows through development, assets, controls, and quality
      gates.
    data:
      layers:
        - label: Customer workflows
          detail: >-
            Industrial users, utilities, and institutional capital appear as the main buying or contracting surfaces
            across distributed solar, utility assets, and renewable fuels.
          modules:
            - Industrial and commercial power-cost reduction
            - Contracted utility-scale clean-power delivery
            - Low-carbon fuel and power/heat use cases
        - label: Development and contracting
          detail: >-
            The platform is presented as a development engine that combines financing, offtake structuring, governance,
            and milestone progression toward construction.
          modules:
            - Milestone-based funding
            - Long-term offtake agreements
            - Board representation and model validation
        - label: Solar asset layer
          detail: >-
            Public case studies show photovoltaic systems delivered for commercial, educational, and industrial
            customers, with grid-injection and PPA examples.
          modules:
            - PV modules
            - Inverters and installation
            - Grid injection or on-site consumption
        - label: Storage and fuel layer
          detail: >-
            Utility-scale battery storage, green hydrogen, and e-methanol are positioned as adjacent modules around the
            solar platform, especially in the U.S. pipeline.
          modules:
            - BESS
            - Hydrogen storage
            - E-methanol infrastructure
        - label: Optimization and monitoring
          detail: >-
            Company materials describe AI forecasting, real-time monitoring, and parameter adjustment for solar
            generation systems.
          modules:
            - Historical data and weather inputs
            - Real-time panel and inverter monitoring
            - Dynamic parameter adjustment
        - label: Quality and compliance controls
          detail: >-
            Public quality signals include IEC and ISO references plus case-study evidence of RETIE compliance,
            tax-incentive approval, and monitoring.
          modules:
            - IEC 61215 and IEC 61730 references
            - ISO 9001, ISO 14001, ISO 45001 references
            - RETIE and UPME case-study controls
    approximationNotes: >-
      This stack is a public-disclosure map, not a validated engineering schematic; it retains only layers explicitly
      described in the assigned evidence.
