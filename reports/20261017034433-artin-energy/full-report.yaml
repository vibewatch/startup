  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk is development-to-construction financing. Independent reporting describes a $255
              million agreement at a $14.58 billion valuation, while the Texas and Nebraska projects alone carry about
              $1.4 billion and $2.6 billion of capex. The announced investment is therefore about 6.4% of that combined
              capex, or the disclosed projects require roughly 15.7 times the new capital before financing costs and
              other portfolio commitments. The reporting says the money supports interconnection, engineering,
              procurement, and construction readiness rather than fully funded construction. Milestone-based deployment
              and investor board oversight reduce misuse and sequencing risk, but they also create a dependency on
              milestone acceptance and later capital.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not close securities, contracting, accounting, or project approval diligence. A
              third-party filing index shows a June 2024 Form D and two July 2024 amendments, but its captured text does
              not show a filing tied to the announced 2026 agreement; that limited index view is not proof that no
              filing exists. The company separately claims $538 billion of PPA assets on its balance sheet, while a
              syndicated company announcement describes an 876 MW, $25.4 billion green-hydrogen contract. Neither
              retained text supplies audited accounting support, an identified hydrogen counterparty, or permitting and
              safety approvals. Those documents are prerequisites to underwriting legal enforceability, asset
              recognition, and regulatory readiness.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.3'
        title: Operational and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Execution depends on multiple gates outside ArtIn Energy's unilateral control: investor milestones,
              interconnection work, detailed engineering, procurement, construction financing, and long-term offtake
              arrangements. Reporting describes investment-grade counterparties behind the Texas and Nebraska projects,
              but the retained articles do not name them, preventing checks of concentration, enforceability, tenor,
              termination rights, or credit support. Yahoo Finance republishes the Power Technology article rather than
              providing an independent second witness, so repeated coverage should not be treated as corroboration.
              Mercom provides another publisher's account, but it also reports the transaction from the company's
              announcement. Residual risk remains high until executed agreements and a sources-and-uses construction
              plan are reviewed.
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR010
              - CR011
              - CR016
      - number: '7.4'
        title: Mitigations, monitors, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The strongest disclosed mitigants are staged capital, investor board oversight, validated financial
              models, and the claimed use of long-term contracts. These are process controls, not evidence that projects
              are fully financed or ready to build. Monthly monitoring should require milestone notices, interconnection
              progress, executed offtake disclosure, permit status, procurement commitments, and construction-financing
              term sheets. The thesis should break if Agila funding is terminated or materially delayed, if either
              flagship project loses an investment-grade contracted counterparty, if audited statements cannot reconcile
              the claimed PPA assets, or if the hydrogen contract lacks an identifiable solvent counterparty and
              credible approval pathway. Until those tests clear, financing and disclosure risk should remain the
              dominant investment constraints.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              Break the thesis if staged funding is terminated, flagship projects cannot produce executed
              investment-grade contracts and committed construction capital, or audited records cannot substantiate the
              claimed PPA assets and hydrogen contract.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR006
