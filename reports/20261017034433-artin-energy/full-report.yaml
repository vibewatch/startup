  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is multi-wedge, not one clean renewable-TAM story
        blocks:
          - type: paragraph
            body: >-
              The evidence supports four adjacent revenue narratives rather than one neatly bounded market:
              utility-scale solar and battery storage development, green hydrogen and e-methanol infrastructure,
              distributed commercial and industrial solar projects, and software-like optimization tied to energy
              forecasting and storage dispatch. That matters because a generic "renewables" TAM would blur together very
              different buyers, procurement cycles, and underwriting standards. The company-linked financing
              announcements consistently frame the core wedge around utility-scale projects supported by PPAs or other
              long-term agreements, while the project case studies and optimization page show smaller distributed
              installations and advisory/monitoring motions sitting beside that core. The homepage's multi-country
              contact footprint suggests a marketed addressable geography broader than the specific U.S. projects named
              in the funding package, but the evidence still points to the U.S.-focused utility-scale pipeline as the
              clearest near-term commercial wedge.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.2'
        title: Public sizing is project- and contract-based, not a disclosed TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides an independent market model that isolates ArtIn's serviceable market across
              solar, storage, hydrogen, and optimization. Instead, the evidence yields a ladder of opportunity lenses: a
              recent $255 million financing to fund late-stage U.S. development, two named U.S. projects with about $4.0
              billion of combined disclosed CAPEX, a company-announced $25.4 billion hydrogen contract, and a broader
              $34 billion pipeline claim. Those figures are useful because they bound what management is trying to
              commercialize, but they are not additive market size estimates and should not be mistaken for TAM, SAM, or
              cash revenue. The one more independent demand datapoint in the pool is Mercom's note that large-scale
              solar project funding rose 37% in 2025 versus 2024, which supports the existence of capital-market
              tailwinds without proving that ArtIn can capture them.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM014
