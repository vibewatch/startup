              - CU006
              - CU007
              - CU009
      - number: '6.3'
        title: Durability and concentration are still the largest diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not disclose customer count, renewals, churn, NRR, GRR, contract length, or
              top-customer exposure, so durability still has to be inferred indirectly from pipeline and governance
              claims rather than operating metrics. The U.S. project narrative is sizable on paper, but the
              counterparties behind the Texas and Nebraska projects are unnamed, and the claimed $25.4 billion green
              hydrogen contract likewise appears without a named buyer. That leaves concentration and credit-quality
              analysis unresolved. Tracxn adds a mildly negative external signal by placing ArtIn 39th with a 46/100
              score in its displayed competitor table and by showing only one media event in the last year, which is
              thinner independent traction evidence than the company-sized valuation narrative would ordinarily warrant.
            claimRefs:
              - CU010
              - CU011
