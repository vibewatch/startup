      - number: '5.2'
        title: Operating model and deployment maturity
        blocks:
          - type: paragraph
            body: >-
              ArtIn's public materials describe a vertically integrated delivery model that spans development,
              financing, engineering, installation, monitoring, and long-term contracted operation, but the maturity
              profile differs by asset type. The company presents an AI optimization layer for solar forecasting,
              real-time monitoring, and parameter adjustment, and separately explains a green-hydrogen flow based on
              solar-powered electrolysis and stored hydrogen for power or heat. By contrast, the best-documented U.S.
              utility assets are still framed as late-stage development: multiple 2026 sources say new capital is being
              used for interconnection, detailed engineering, procurement, and the path to notice-to-proceed and
              construction financing, which indicates pre-operational execution risk remains central.
            claimRefs:
