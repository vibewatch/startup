chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating profile
        blocks:
          - type: paragraph
            body: >
              The assigned source set supports a basic identity for ArtIn Energy, but that identity still depends on a
              mix of company-controlled pages and one external database profile rather than a comprehensive public
              filing set. Tracxn lists ArtIn as a Tampa-based Series A company founded in 2012, while the company's own
              current financing language describes a global renewable energy infrastructure platform focused on
              utility-scale solar, battery storage, green hydrogen, and e-methanol. Current official pages also show a
              broad contact footprint across New York, Houston, Florida, Utah, Toronto, Delhi, and Pretoria, which
              signals an international commercial posture but does not prove headcount or asset ownership in each
              location.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
              - CO012
