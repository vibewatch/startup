              - CE012
      - number: '5.3'
        title: Differentiation, controls, and proof points
        blocks:
          - type: paragraph
            body: >-
              ArtIn's clearest differentiation claim is breadth: public sources repeatedly frame the company as
              combining solar generation, storage, and renewable-fuel development under one platform, while the
              optimization page adds a software-style control layer on top of asset delivery. The company also cites
              quality and compliance language, including IEC and ISO standards on the hydrogen page and RETIE-compliant
              installation, real-time monitoring, and UPME-approved tax incentives in a named solar case study.
              Financing materials add board representation, validated financial models, and security packages over
              project assets as governance controls, but these are transaction-level assurances rather than operating
              data on availability, hydrogen throughput, or storage performance.
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE009
              - CE012
      - number: '5.4'
        title: Technical risks and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main product-technology risk is that ArtIn's narrative runs ahead of its publicly evidenced operating
              detail. A company-issued hydrogen article claims an 876 MW green-hydrogen contract worth $25.4 billion and
              a broader $34 billion pipeline, yet the assigned pool does not independently identify the counterparty,
              site-level configuration, project schedule, or commissioning status for that program. The same limitation
              appears across the broader platform: the pool shows marketing copy, selected case studies, and financing
              announcements, but no API documentation, integration guides, cybersecurity program disclosures, uptime
              history, or asset telemetry. For underwriting, the missing technical proofs matter more than the breadth
              of the product map.
            claimRefs:
              - CE010
              - CE013
