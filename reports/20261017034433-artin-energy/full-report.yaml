  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and customer workflows
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows ArtIn marketing a multi-asset platform rather than a single product SKU.
              Third-party 2026 coverage and company-issued financing materials consistently describe the U.S. portfolio
              as utility-scale solar, battery storage, green fuels, and in some sources e-methanol, while the company
              site separately foregrounds distributed solar case studies and green-hydrogen explanations. Public proof
              of delivered work is concentrated in named project examples in Colombia, including a 10 MWp
              oil-and-gas-sector solar farm plus smaller commercial and school installations, which means the current
              evidence base is strongest on customer workflow examples and weaker on standardized product packaging or
              repeatable module definitions.
