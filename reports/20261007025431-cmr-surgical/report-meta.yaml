companyProfile:
  summary: >-
    CMR Surgical is a Cambridge-based private surgical robotics company founded in 2014 that develops the modular
    Versius and Versius Plus platforms for soft-tissue minimally invasive surgery. The company has treated more than
    45,000 patients across more than 30 countries, raised over $1.28B in lifetime funding, and is pushing into the U.S.
    market after obtaining FDA 510(k) clearance for cholecystectomy, while public disclosure of revenue quality,
    margins, and runway remains limited.
