      - number: '6.4'
        title: 运营利用率逆风与客户账户持久性
        blocks:
          - type: paragraph
            body: >-
              尽管累计治疗患者数增长强劲，独立行业分析显示 CMR Surgical 面临装机利用率挑战：实体部署增长快于单机手术速度。每台系统的常规
              手术量、跨专科病例组合和多外科医生部门渗透等关键医疗科技运营指标显示，部分医院客户在最初的核心外科医生采用后可能 利用不足。利用不足的机器人单元会拖累医院资本预算和 CMR 服务专家的运营。并且，由于 CMR
              是私营医疗科技公司，净收入留存率（NRR）、 毛收入留存率（GRR）、确切年度账户流失、器械复购率和医院客户集中度等详细留存指标均未公开披露；机构投资判断必须直接访问 保密商业合同登记册。
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示案例
        blocks:
          - type: callout
            title: 模块化资本模式降低非专用手术间的采用摩擦
            body: >-
              Versius 以模块化、可移动的床旁机械臂取代一体化、不可移动的控制台，重置医院采购预期。这一架构让社区医院、NHS trust 和日间
              手术中心可以在多个手术室共享机器人资产，无需数百万美元的结构改造，从而降低初始资本门槛，加快成本敏感型医疗系统的采用。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU007
          - type: callout
            title: 手术机器人装机利用率陷阱
            body: >-
              对手术机器人制造商而言，设备部署增长可能掩盖持续的利用不足。如果医院客户不能从单一核心外科医生扩展到多个专科的高频每周
              排班，单机病例经济性就会恶化。利用不足的设备会增加维护成本，并在资本维护合同到期时提高续约风险。
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 优先级、监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持高度关注的风险姿态，但不能断言每项风险都会大概率兑现。具体法律信号是 2025 年 2 月的雇佣判决：仲裁庭允许 种族骚扰和直接歧视的有限主张，并认定无意识偏见至少部分影响了申诉人的待遇和裁员评分
              [CR001, CR002]。另一份 2024 年 10 月 的初步判决未驳回自动不公平解雇主张，但驳回一项被指称的披露，并允许剩余理论继续；这不是最终责任判决 [CR003, CR004]。
              产品监管是当前商业约束，而非执法事件：公司材料描述了 22 岁及以上成人胆囊切除术的美国许可、已提交的良性妇科申报，以及尚未获准 在美国销售的超声解剖器 [CR007, CR008,
              CR009]。因此，投资判断应把已裁定行为、未决程序和适应症限制分开，而非压成一个概率估计。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
