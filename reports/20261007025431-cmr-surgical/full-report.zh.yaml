  - id: FM001
    title: 受证据约束的市场规模视角
    type: pyramid
    summary: 六层嵌套证据将未量化品类与已证明的采用情况及狭窄的美国切入点区分开来；这些不是按比例表示的市场规模。
    data:
      items:
        - label: 广泛品类
          value: Dollar TAM unavailable
          detail: 软组织机器人微创手术及其现状替代方案。
        - label: 已证明的全球使用
          value: More than 45,000 patients
          detail: 截至 2026-03-26 的公司报告累计患者里程碑。
        - label: 地理覆盖
          value: More than 30 countries
          detail: 公司报告的采用覆盖范围，不含按国家划分的站点数量。
        - label: 临床广度
          value: Five named specialties
          detail: 普外科、结直肠、泌尿、妇科和胸外科。
        - label: 美国获批切入点
          value: Adult cholecystectomy
          detail: 许可适用于 22 岁及以上患者。
        - label: 美国相邻申报
          value: Benign gynecology submitted
          detail: 已提交的申请不代表已获许可或可商业使用。
    approximationNotes: 金字塔是证据层级，而非规模图；各层使用不同单位，不推断换算、面积比例、TAM、SAM 或 SOM。
