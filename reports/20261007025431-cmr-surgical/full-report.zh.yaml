            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: 运营、质量与安全控制
        blocks:
          - type: paragraph
            body: >-
              现有证据同时显示控制框架和控制效果尚未解决。CMR 表示其安全团队通常在三个工作日内回应漏洞报告，与内部团队评估，并可能修复漏洞 或在风险管理中接受漏洞；手术系统补丁通过现有客户服务渠道分发 [CR011,
              CR012]。这些陈述描述的是流程，而非事件频率、补丁延迟或 残余严重性，指定证据也不能证明从未发生过入侵或中断。仲裁庭记录还描述了一件价值约 £7,000、历史上无法追踪的摄像头头部测试部件
              [CR014]。这一孤立事件与库存和供应商质量尽调有关，但本身不能证明当前存在系统性缺陷。CMR 报告的 45,000 名患者、30 个国家装机使用
              基础扩大了服务、质量和网络安全失败的后果，但仍是公司发布的规模主张 [CR013]。数据室审查应测试当前 CAPA、投诉、召回、现场服务、 漏洞和追溯表现，而不是从政策或历史事件外推。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
