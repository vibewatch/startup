      - number: '7.4'
        title: 监测指标、缓释措施与论点失效
        blocks:
          - type: paragraph
            body: >-
              风险登记表应通过可衡量的证据请求管理，而不是无依据的预测。监管监测应跟踪良性妇科申报的公开处置和标注范围，以及任何新增美国 器械或适应症 [CR008, CR009]。法律监测应取得 Roy
              判决的救济及上诉状态，以及 Riaz 程序的最终处置 [CR001, CR003]。运营监测
              应要求投诉、召回、CAPA、正常运行时间、补丁延迟、已接受漏洞和库存追溯指标，因为披露政策或指定证据中缺少不利事件，都不能证明 控制有效 [CR011, CR012,
              CR014]。财务监测应核对现金、受限现金、债务本金、到期、约束和月度现金使用；披露的融资总额不是现金跑道 指标 [CR005,
              CR006]。论点失效触发因素包括阻断美国计划中的专科扩张的重大监管挫折、未及时修复的反复质量或安全失败、限制持续投资的
              债务条款，或表明已裁定的雇佣控制失败没有整改的治理证据。热力图中的定性层级是分析师综合，而非统计预测 [CR016]。
            claimRefs:
