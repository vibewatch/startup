      - number: '5.2'
        title: 软件定义运动学、遥测与数字生态
        blocks:
          - type: paragraph
            body: >-
              与主要依靠刚性结构决定操控特性的传统机器人系统不同，Versius 采用软件定义控制架构。平台将运动学从物理金属约束中解耦， 在用户选择的 Surgical、Compliant、Sleep 和 Locked
              模式下执行运动缩放、震颤过滤、碰撞管理和动态柔顺。运营及手术遥测在 控制台记录，并与 Versius Cloud 同步：通过 Versius Connect 应用生成外科医生表现日志，通过 Versius
              Team 仪表板生成企业利用率 指标。为扩展术中智能，CMR Surgical 于 2025 年底加入 NVIDIA IGX Thor early adopter program，评估可在护理现场直接处理实时
              遥测和视频流的 physical AI 计算能力。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE006
