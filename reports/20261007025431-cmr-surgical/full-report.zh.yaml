      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              2025 年 4 月融资证明公司当时可以取得外部资本，而不是今天仍有多少现金。CMR 宣布为全球商业化、美国发布和持续产品开发筹集 超过 $200M 股债合计资金 [CI003, CI005]。Tracxn
              将同一日期拆分为 $131M D 轮股权和 $68.8M 常规债务，但审阅来源没有披露 手头现金、月度消耗、现金跑道、债务到期、约束、利息、担保或还款计划 [CI004,
              CI012]。公开材料也没有硬件和器械毛利率、制造成本、 保修费用、现场服务经济性、营运资金、资本开支、CAC 和回本期 [CI013]。CMR 确实描述了分发系统补丁的服务安排，证明存在运营服务
              义务，但没有量化其成本或收入贡献 [CI014]。
            claimRefs:
