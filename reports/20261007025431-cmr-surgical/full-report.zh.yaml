  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入证据与商业进展
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务数据点并非 CMR 提供的经审计数字：Tracxn 报告 Cmr Surgical Limited 在截至 2024 年 12 月 31 日的年度 收入介于 £10M 和 £50M，并另报一年收入
              CAGR 为负 28% [CI001, CI002]。区间过宽，无法支持精确收入倍数，也不应视为 ARR。 商业活动比收入质量更清晰。CMR 表示，截至 2026 年 3 月已有超过 45,000 名患者接受
              Versius 治疗，部署覆盖 30 多个国家和 多个专科 [CI006, CI007]。这些累计病例和地理指标证明了使用，但都没有提供当期手术量、装机利用率、客户数、确认收入或经常性 收入构成。
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
