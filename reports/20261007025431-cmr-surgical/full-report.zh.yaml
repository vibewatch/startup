  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 模块化远程操作架构与核心手术硬件
        blocks:
          - type: paragraph
            body: >-
              Versius 从根本上区别于集中式多臂主从架构：它将患者侧推车拆成可独立移动的床旁单元。每套系统包含开放式人体工学外科医生 控制台、支持 0 度或 30 度 3D
              高清内窥镜的成像床旁单元，以及最多三个独立器械床旁单元。每个器械机械臂包含 11 个关节的 运动链，其中 J1 至 J8 控制空间定位和机械臂柔顺性，J9 至 J11
              驱动完全腕式末端执行器。床旁推车是机械解耦的工作站，通过 脐带式数据和电源线缆连接；手术团队可以围绕手术床灵活摆放各机械臂，复现传统腹腔镜端口几何。这种模块化无需专用机器人手术室，
              使移动推车能在手术室之间调配，并由多个专科手术服务共享。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE010
