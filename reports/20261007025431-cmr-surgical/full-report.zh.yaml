      - number: '3.2'
        title: 已记录的差异化与监管范围
        blocks:
          - type: paragraph
            body: >-
              CMR 将 Versius Plus 描述为紧凑、模块化系统，无需专用手术间即可在手术室之间移动，配有独立机械臂、灵活端口放置、
              荧光成像，以及用于手术记录和项目利用率的两个应用。同一公司发布的证据称，Versius 已在 30 多个国家治疗超过 45,000 名
              患者，并称其为全球第二广泛使用的机器人手术平台。这些部署陈述证明了有意义的公开运营历史，但保留的独立目录没有提供 能验证该排名的临床利用率基准。在美国，披露的许可明确针对 22
              岁及以上成人胆囊切除术；在审阅的产品页面上，更广泛的良性 妇科用途仍是已提交的申报。因此，模块化是可信的设计差异，而比较临床广度和美国客户扩张仍存在证据缺口。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP010
      - number: '3.3'
        title: 规模不对称与分销压力
        blocks:
          - type: paragraph
            body: >-
              公开来源的规模比较对 CMR 方向性不利，但并不完全可比。Craft 报告 CMR 有 643 名员工、预计 FY2023 收入为 £52.9 million， 同时用不同货币和财年报告 Intuitive
              Surgical 与 Medtronic 更高的员工和预计收入。这些是聚合器估算，不是经审计的同口径 基准。CMR 另行宣布超过 $200 million
              的股债合计融资，用于全球扩张、美国发布和产品开发；这是募集到的融资，不是收入、可用 现金或累计总融资。指定证据没有衡量 incumbent 的分销能力、渠道经济性和捆绑优势。稳妥结论是：CMR
              必须与规模大得多的组织 竞争，为高支持强度的市场进入融资，而由此造成的销售劣势幅度仍无法量化。
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: 定价、信任、切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              指定的公开证据没有提供 CMR 或其明确竞争者的价目表、合同结构、实际器械经济性、服务费、折扣表或可比总拥有成本。因此，
              断言模块化必然降低成本或切换摩擦属于推测。锁定、多归属、培训负担、整合成本和合作伙伴接入也同样缺乏量化；这些因素对医院 采购很重要，但保留来源没有衡量。CMR
              确实发布了覆盖产品和信息技术的漏洞披露流程，包括评估、修复和通过现有服务渠道分发补丁。 这证明有记录的信任流程，并不证明系统比竞争者漏洞更少。总体护城河能否持久，取决于能否把模块化工作流主张和国际使用转化为更广泛
              的美国适应症、独立基准化的结果和公开的客户经济性。
            claimRefs:
              - CP003
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
