      - number: '1.4'
        title: 展示案例
        blocks:
          - type: callout
            title: 模块化资本模式对比一体化机器人手术间
            body: >-
              Versius 将机械臂拆成轻量、可移动的独立单元，可在标准手术室之间移动，由此区别于 Intuitive Surgical 的 da Vinci 架构。这种模块化降低医院资本锁定，使 ASC 和 NHS
              trust 能在普通、结直肠、妇科和泌尿外科之间扩大 机器人利用率，而无需建设专用机器人手术间。
            calloutType: insight
            claimRefs:
              - CO003
              - CO010
          - type: callout
            title: 资本密集度与美国执行壁垒
            body: >-
              尽管全球已治疗超过 45,000 名患者，CMR Surgical 进入美国仍面临很高的商业壁垒。初始 FDA 适应症仅限胆囊切除术， $68.8M
              债务附带持续的贷款人约束，且私营公司历史上的现金消耗率不透明；要实现可持续的多专科扩张，仍需持续的 临床验证和资本支持。
            calloutType: risk
            claimRefs:
              - CO007
              - CO010
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是软组织微创手术的机器人辅助，包含机器人平台、器械、服务、培训和项目级数字工具。不包含骨科及其他 非软组织机器人、医院底层手术收入、通用医院软件，以及人工开放手术或腹腔镜手术。人工方案仍是机器人系统支出的
              实际现状替代品，而非市场组成部分 [CM001]。在美国，目前有证据支持的商业边界更窄：Versius Plus 获准用于 22 岁及以上成人胆囊切除术
              [CM002]。国际使用覆盖五个明确专科，但不能把这一已装机的临床足迹当成量化的可服务市场 [CM004]。
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              公开证据提供的是采用度标记，而不是可审计的市场模型。CMR 报告截至 2026 年 3 月已治疗超过 45,000 名患者， 覆盖 30 多个国家 [CM003, CM004]。一份第三方 AI 生成的 SWOT
              声称机器人手术渗透率低于 10%，但没有手术数量 分母或一手方法论，因此该百分比只能作为方向性参考 [CM009]。IncFact 的 Florida 页面将收入列为不可用，并提醒 私营公司收入数字只是统计评估
              [CM010]。据报道的 $4 billion 求售估值和超过 $200 million 的融资是资本市场事实， 不是收入、可用现金或 TAM [CM011,
              CM012]。因此，在取得手术量、符合条件的适应症数量、地区定价、设备部署和利用率 前，无法从这组材料计算有说服力的 TAM、SAM 或 SOM [CM015]。
            claimRefs:
