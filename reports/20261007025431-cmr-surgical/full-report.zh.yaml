chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical Limited 最初于 2014 年以 Cambridge Medical Robotics 之名成立，是一家总部位于英国 Cambridge Evolution Business
              Park 的私营有限公司医疗科技企业。公司的全球制造业务集中在 Cambridgeshire 的 Ely；该基地 在获得 £10 million 资本承诺后启用，目标是年产最多 500 台 Versius。CMR
              Surgical 由 Luke Hares、Keith Marshall、Paul Roberts、Mark Slack 和 Martin Frost 创立，旨在挑战 Intuitive Surgical 的
              da Vinci 系统在 软组织微创手术中的历史垄断。其核心产品 Versius Surgical Robotic System 及下一代 Versius Plus 采用开放式
              人体工学控制台、仿腕关节器械和可移动的模块化机械臂；机械臂可以在标准手术室间拆分、重新布置，无需固定在 专用手术间。商业模式将设备部署或租赁与器械、配件、数字生态软件及维护服务合同的经常性销售结合起来。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO010
