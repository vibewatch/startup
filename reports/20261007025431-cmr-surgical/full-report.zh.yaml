      - number: '1.3'
        title: 资本化、商业规模与美国扩张里程碑
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 累计融资超过 $1.28 billion，并在 2021 年 6 月由 Escala Capital 和 SoftBank Vision Fund 2 领投的 $600 million
              D 轮融资中达到 $3.0 billion 投后估值。2025 年 4 月，公司完成超过 $200 million 的追加 成长融资，包括现有投资方 SoftBank、Lightrock 和 Ally
              Bridge Group 提供的 $131 million D 轮股权，以及 Trinity Capital 提供的 $68.8 million 常规债务，用于商业化和临床试验管线。公司商业落地已覆盖全球 30
              多个 国家，2024 年 3 月突破 20,000 例临床手术，2025 年初达到 30,000 例，并在 2026 年 3 月前后全球治疗患者数 超过 45,000。2025 年 12 月取得胆囊切除术 FDA
              510(k) 许可后，CMR 在 SAGES 2026 正式进入美国临床市场；但 综合收益、现金消耗率和单位毛利率的详细数据仍是严格保密的私有信息。
