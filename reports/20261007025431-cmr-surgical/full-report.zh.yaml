      - number: '5.3'
        title: 监管授权、临床安全控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 在监管上取得关键里程碑：FDA 授予 Versius 用于 22 岁及以上成人胆囊切除术的 De Novo 上市授权（DEN230078，建立 21 CFR 878.4964，产品代码
              SCV），随后又批准集成 vLimeLite 吲哚菁绿荧光成像的 Versius Plus 510(k)。CE mark 允许其在胸科、 结直肠、上消化道和妇科手术中开展广泛多专科干预，但在其妇科 510(k)
              申报获审前，美国临床采用仍受法律范围约束。台架和上市前验证 确立了电磁安全、亚毫米器械精度及单一故障条件下的防下垂重力缓解能力。不过，独立安全分析指出分散式机器人固有的持续失效模式，
              包括机械臂之间的实体碰撞、紧凑手术间的线缆绊倒风险、推车稳定性余量和机构学习曲线摩擦。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE008
              - CE009
              - CE012
      - number: '5.4'
        title: 展示案例
        blocks:
          - type: callout
            title: 软件定义模块化降低资本开支
            body: >-
              Versius 的架构展示了软件定义运动学和模块化硬件如何直接挑战传统手术机器人经济性。CMR Surgical 使用带轮的独立协作机械臂，
              而不是一体化的多吨级龙门架，省去结构性手术室改造，并允许医疗系统在多个专科病例之间动态分配机器人机械臂。
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: 高利润美国市场的监管适应症瓶颈
            body: >-
              尽管 Versius 已在欧洲、亚洲和拉丁美洲完成超过 45,000 例手术，覆盖七个外科专科，但其美国商业授权仍严格限于 FDA DEN230078
              下的成人胆囊切除术。腹腔镜胆囊切除术主要是低利润切入口；要在美国医疗系统达到商业规模，完全取决于复杂良性妇科和普通外科适应症 获得许可。
            calloutType: risk
            claimRefs:
              - CE003
              - CE009
              - CE010
              - CE013
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与医疗采购模式
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 面向急症医院网络、国家医疗服务体系、地区医院 trust 和日间手术中心（ASC），这些机构希望获得机器人微创手术的临床 精度，又不承担传统一体化系统的高昂资本开支和固定占地。在英国
              National Health Service（NHS）及欧洲国家体系等公共支付医疗架构中， 采购决策者会评估 Versius
              的总护理成本、器械通用性和手术间吞吐量。私立医院集团和门诊手术中心则优先考虑病例间快速周转以及跨多部门
              手术间的模块化便携性。但医疗系统采购涉及漫长的委员会评估、严格的资本审批门槛和详细的报销代码审查，因此销售周期通常长达 9 至 18 个月。
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
