  - id: FE001
    title: Versius 架构与运营栈
    type: stack
    summary: 覆盖硬件机械、嵌入式软件、可视化和云端遥测的 Versius 平台架构层级。
    data:
      layers:
        - label: 边缘与云端分析
          detail: 术后数据聚合、远程信息日志和临床登记分析
          modules:
            - Versius Connect 应用
            - Versius Team 仪表板
            - 全球临床登记库
        - label: 物理 AI 计算
          detail: 术中物理 AI 加速和高吞吐量即时计算机视觉推理
          modules:
            - NVIDIA IGX Thor 管线
            - 实时视频分析引擎
            - 低延迟传感器融合
        - label: 成像与显示层
          detail: 立体手术视野可视化和实时术中光学引导
          modules:
            - 3D 立体 HUD
            - vLimeLite ICG 荧光
            - 0° 和 30° 硬性内窥镜
            - EIZO CuratOR 系统
        - label: 软件定义控制层
          detail: 确定性实时控制，执行柔顺运动学、震颤过滤和安全联锁
          modules:
            - 确定性实时运动学
            - 多模式柔顺引擎
            - 动态碰撞检测
            - 数字震颤过滤
        - label: 模块化患者接口
          detail: 解耦式移动床旁推车，配备独立的 11 关节运动学臂和制动锁组件
          modules:
            - 可视化床旁推车
            - 1-3 个器械床旁单元
            - J1-J8 空间臂连杆
        - label: 控制台与手术末端执行器
          detail: 开放式人体工学外科医生工作站和精密可关节腕式手术器械
          modules:
            - 开放式人体工学控制台
            - 带电外科触发器的手部控制器
            - 5mm 腕式腔内手术工具（J9-J11）
    approximationNotes: 基于 FDA DEN230078 规格和公司工程公告的子系统集成层概念表示。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 医院实施 Versius 平台的端到端客户采用旅程，涵盖评估、采购、培训、临床使用和机群扩张。
    data:
      items:
        - label: 1. 临床认知与 SAGES 拓展
          summary: >-
            Surgeon engagement through scientific congresses (SAGES), robotic demonstrations, and real-world clinical
            data review.
          touchpoints:
            - 医学会议
            - 同行评审数据
          note: 在普外科和结直肠外科核心医生中激发初步临床兴趣
        - label: 2. 机构采购与商业论证
          summary: >-
            Hospital committee assessment of modular capital acquisition or lease costs versus da Vinci monopoly
            pricing.
          touchpoints:
            - 资本委员会
            - 采购招标
          note: 审批周期长，需要以多手术室共享为基础论证 ROI
        - label: 3. 模拟与 Orsi Academy 培训
          summary: >-
            Intensive simulation training with Versius Trainer and accredited hands-on education at specialized centers
            like Orsi Academy.
          touchpoints:
            - Orsi Academy
            - Versius Trainer
          note: 为主刀医生和护理团队提供床旁单元设置认证
        - label: 4. 手术室集成与床旁工作流
          summary: >-
            Modular bedside units moved into standard operating rooms; open console configuration and port placement
            optimization.
          touchpoints:
            - 手术室设置
            - 仿生臂
          note: 无需专用机器人手术室，从而支持科室间移动
        - label: 5. 常规病例排期与 Versius Connect
          summary: >-
            Surgeons conduct routine cholecystectomy or soft-tissue procedures; digital telemetry tracked via Versius
            Connect and Team apps.
          touchpoints:
            - Versius Connect 应用
            - Versius Team 仪表板
          note: 近实时手术日志和效率追踪
        - label: 6. 利用率审计与账户扩张
          summary: >-
            Evaluating cases per system across surgical specialties to justify additional instrument packs or secondary
            console acquisitions.
          touchpoints:
            - 医院利用率审查
            - 合同续签
          note: 关键医疗科技节点；病例速度低会造成运营利用不足
    approximationNotes: 根据手术机器人采购实践、培训工作流和数字遥测工具综合而成的企业客户旅程概念图。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU008
      - CU010
      - CU012
  - id: FR001
    title: 定性剩余风险热力图
    type: matrix
    summary: 分析师根据定性影响和可能性信号，对已有证据和未解决风险进行定位。
    data:
      columns:
        - 影响
        - 可能性信号
        - 缓解成熟度
      rows:
        - label: 美国适应症范围狭窄
          note: 当前产品范围限制。
          values:
            - label: 严重
              detail: 可能限制多专科利用率和上市经济性。
              tone: critical
            - label: 当前限制
              detail: 公司材料将胆囊切除术列为美国已获批适应症。
              tone: high
            - label: 部分
              detail: 已提交良性妇科申请；此处无法确定其处理结果。
              tone: medium
        - label: 就业与治理整改
          note: 已裁定行为，但整改状态未知。
          values:
            - label: 高
              detail: 造成治理、法律、声誉和人才暴露。
              tone: high
            - label: 已裁定事件
              detail: 据报道，指定判决允许有限的歧视和骚扰主张继续审理。
              tone: critical
            - label: Unknown
              detail: 指定证据无法确定补救、上诉和控制整改情况。
              tone: high
        - label: 债务条款与现金跑道
          note: 融资已披露，但债务条款和现金使用未披露。
          values:
            - label: 严重
              detail: 限制性条款或流动性不足可能约束扩张。
              tone: critical
            - label: Unknown
              detail: 留存来源未公开债务金额、契约、到期日、现金和消耗。
              tone: high
            - label: Unknown
              detail: 融资完成不代表有契约余量或现金跑道。
              tone: high
        - label: 安全与现场服务
          note: 流程已发布，但绩效指标未披露。
          values:
            - label: 高
              detail: 受影响产品在临床环境中运行。
              tone: high
            - label: Unknown
              detail: 无法根据该政策推断当前事件频率。
              tone: high
            - label: 流程已记录
              detail: 已描述受理、风险接受、整改和服务渠道分发。
              tone: medium
        - label: 库存可追溯性
          note: 单一历史事件，不代表已证明的当前模式。
          values:
            - label: 中等
              detail: 指定证据报告财务损失，但没有临床后果。
              tone: medium
            - label: 历史单一事件
              detail: 未确定复发可能性。
              tone: low
            - label: Unknown
              detail: 当前 CAPA 和可追溯性控制需要尽调。
              tone: high
        - label: 器械和 ICG 可用性
          note: 当前产品组合和各国采购限制。
          values:
            - label: 中等
              detail: 可能限制手术流程或荧光成像的使用。
              tone: medium
            - label: 当前限制
              detail: 解剖器械尚未在美国获批；ICG 状态因国家而异。
              tone: high
            - label: 部分
              detail: 客户独立采购 ICG；此处没有替代器械缓解措施的证据。
              tone: medium
    approximationNotes: 仅为分析师的定性综合；定位不是统计概率、事件率或量化损失估计。
    claimRefs:
      - CR016
  - id: FV001
    title: CMR Surgical 投资决策与估值流程
    type: flow
    summary: 将已部署规模、融资结构、竞争摩擦和估值不确定性连接到最终“跟踪”建议的逻辑路径。
    data:
      nodes:
        - id: installed-scale
          label: 临床规模与 45k 例手术
          description: 在 30+ 个国家完成超过 45,000 例手术，使 CMR 成为明确的全球第二大软组织平台。
        - id: fda-clearance
          label: 美国市场准入许可
          description: Versius Plus 获得胆囊切除术 FDA 510(k) 许可，打开了这一顶级机器人市场的商业化通道。
        - id: capital-structure
          label: 结构化融资栈
          description: 2025 年 4 月获得超过 $200M 的股权和 Trinity Capital 债务融资；累计融资超过 $1.4B。
        - id: margin-opacity
          label: 财务与利润率不透明
          description: 系统定价、经常性收入组合和现金消耗未披露，无法建立稳健的基本面 DCF 模型。
        - id: competitive-moat
          label: 现有护城河摩擦
          description: Intuitive Surgical 已建立的生态和医院切换成本限制快速替代。
        - id: recommendation-track
          label: 跟踪建议
          description: 以中等信心维持“跟踪”立场；监测美国利用率，等待数据室财务披露。
      edges:
        - from: installed-scale
          to: fda-clearance
        - from: fda-clearance
          to: capital-structure
        - from: capital-structure
          to: margin-opacity
        - from: margin-opacity
          to: competitive-moat
        - from: competitive-moat
          to: recommendation-track
    approximationNotes: 流程图展示从市场验证点到最终立场的定性决策门控过程。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV010
