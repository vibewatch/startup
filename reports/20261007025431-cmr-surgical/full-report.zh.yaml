        title: 展示案例
        blocks:
          - type: callout
            title: 公开护城河论据尚不足以支撑投资判断
            body: 模块化和据报道的部署是可信差异化因素，但在缺少实际定价、切换成本证据、直接竞争者文件和独立利用率基准的情况下，无法得出 持久护城河结论。
            calloutType: risk
