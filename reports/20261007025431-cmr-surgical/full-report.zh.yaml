      - number: '4.4'
        title: 财务结论与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，目前无法对财务案例作投资判断。临床使用和有资金支持的美国扩张提供需求及投资人支持信号，但不能证明已确认收入质量、 贡献利润率、经营杠杆或充足现金跑道 [CI003, CI006,
              CI016]。报告的收入下滑加大了核对法人账目与集团报告、区分设备部署收入和经常性 手术相关收入的必要性 [CI002]。不利尽调还应纳入或有法律及人员成本：2024 年 Employment Tribunal
              裁决未驳回针对 CMR 的 自动不公平解雇主张，但没有作出最终实体判断 [CI015]。因此，投资批准应以经审计合并账目、合同 cohort、产品级利润率、现金与债务 计划及资金完全覆盖的运营计划为前提。
            claimRefs:
              - CI002
