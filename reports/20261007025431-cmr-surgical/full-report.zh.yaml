      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              有证据支持的买方是医疗服务机构：CMR 表示正在与医院和日间手术中心建立美国合作关系，而外科医生和手术团队是直接 用户
              [CM005]。公开来源没有说明任何指定客户的预算负责人、签约单位、报销分摊、采购周期长度或经济支付方。模块化系统 无需专用手术间即可在手术室间移动，可能降低工作流摩擦
              [CM006]，但便携性本身不能证明购买回报。因此，采用路径应建模为 监管资格、医疗机构评估、资本或合同审批、安装培训、使用率和持续服务；其中只有部分环节有公开证据 [CM016]。待审的良性妇科
              申报可能扩大美国临床切入口，但它仍是申报，而非许可 [CM007]。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与尽调含义
        blocks:
          - type: paragraph
            body: >-
              最强的采用驱动是已被证明的使用：CMR 的患者里程碑、地理覆盖和多专科活动表明 Versius 已超出仅限试点的阶段 [CM003,
              CM004]。主要约束是转化，而不是抽象的品类认知。美国市场目前仅开放一个手术适应症 [CM002]；一份独立但声誉较低的 SWOT 指出医院资本敏感度高、 incumbent 竞争激烈，且公司需要证明总拥有成本
              [CM008]。信任也是采购输入：CMR 发布了 接收漏洞报告并通过客户服务安排分发补丁的流程，但没有披露事件发生率、修复时间或外部认证 [CM013]。一份初步的英国
              雇佣判决涉及解雇和披露问题，而非产品安全、市场需求或买方采用，因此它是执行尽调信号，而不是市场证据 [CM014]。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM013
              - CM014
      - number: '2.5'
        title: 展示案例
        blocks:
          - type: callout
            title: 没有可辩护的公开 TAM
            body: 采用数量、融资和据报道的求售估值，都不能替代符合条件的手术量、定价、设备部署、利用率和服务收入。在取得这些分母前， 不应关闭以美元计价的市场模型。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
          - type: callout
            title: 美国切入口窄于全球足迹
            body: 国际多专科使用证明了临床广度，但当前美国许可仅覆盖成人胆囊切除术，妇科仍处于申报扩展阶段。因此，对美国市场的 投资判断必须按适应症拆开。
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
              - CM007
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局、进入者与未经证实的替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的独立目录持续将 Intuitive Surgical、Medtronic 和 Distalmotion 列入 CMR 的同业集合，同时列出 Virtual Incision 和 Ronovo
              Surgical 等更窄或更早期的方案。这支持一个涵盖规模化行业龙头、直接软组织挑战者、小型化系统和专科进入者的
              竞争格局。但它不能证明监管范围、临床结果、装机量或商业成熟度相当：目录只对相似性分类，而非对性能排名。常规腹腔镜、 继续使用 incumbent 机器人，以及医院内部项目，都是购买新 CMR
              的经济相关替代方案，但指定证据池没有买方证据来量化或排序 这些现状选择。因此，竞争地图应被视为来源可见度地图，而非市场份额或产品质量排名。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
