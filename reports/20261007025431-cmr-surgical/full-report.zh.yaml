  - id: FI001
    title: 有公开证据支持的收入模型桥接
    type: flow
    summary: 公开记录覆盖活动和产品组件，但止步于定价、确认收入和毛利之前。
    data:
      nodes:
        - id: adoption
          label: 医院和 ASC 采用
          detail: 美国合作关系正在建设；客户经济性未披露。
        - id: deployment
          label: Versius Plus 部署
          detail: 便携式模块化系统可在手术室之间移动。
        - id: procedures
          label: 已完成手术
          value: More than 45,000 patients
          valueNote: Cumulative worldwide through March 2026, not annual volume.
        - id: instruments
          label: 使用的器械和配件
          detail: 产品套件已公开；计费单位和实际价格未公开。
        - id: digital-use
          label: 使用遥测
          detail: 应用记录手术日志、病例量和系统效率。
        - id: financial-output
          label: 收入和毛利
          detail: 组合、确认、价格、成本和利润率均未公开披露。
    approximationNotes: 仅为有序的概念桥接；不主张任何产品按手术计费，也不主张各节点共享同一期间或分母。
