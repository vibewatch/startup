      - number: '4.2'
        title: 变现、定价与 GTM 经济性
        blocks:
          - type: paragraph
            body: >-
              CMR 的公开产品页面列出 Versius Plus 系统、器械、成像组件和两个数字应用，但没有说明各组件是销售、租赁、许可、捆绑，还是 按手术收费 [CI008,
              CI010]。模块化系统可以在手术室间移动且无需专用房间，可能扩大部署场景，但没有公开证据量化销售周期、 实施支出、渠道分成、获客成本、折扣或回本期 [CI009, CI013]。EquityZen
              描述了符合条件股东出售私股的渠道，但其抓取的公司页面 没有观察到 CMR 的交易价格；这是流动性渠道，不是运营收入或当前估值的证据 [CI011]。在评估定价能力前，仍需实际合同和客户 层面的经济数据。
