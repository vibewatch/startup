      - number: '6.2'
        title: 临床采用轨迹与手术速度
        blocks:
          - type: paragraph
            body: >-
              Versius 平台的商业采用轨迹显示，累计患者量在连续运营年度中加速增长。CMR Surgical 记录截至 2025 年初在 30 多个国家完成 30,000 多例手术，并在 2026 年 3
              月前后将全球治疗患者数扩大到 45,000 多名。这一手术量使 CMR Surgical 成为全球第二大利用率 的软组织机器人手术平台，              仅次于行业龙头 Intuitive
              Surgical。临床采用覆盖五个核心专科：普通外科、结直肠外科、泌尿外科、妇科 和胸外科。国际监管授权和 2025 年 12 月成人胆囊切除术 FDA 510(k) 许可进一步推动增长，使 CMR 能在
              Tampa, Florida 举行的 SAGES 2026 向美国外科医生正式商业亮相。
