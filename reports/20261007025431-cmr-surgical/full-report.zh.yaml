      - number: '1.2'
        title: 管理层、治理结构与公司运营
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 由经验丰富的管理团队运营，核心成员包括首席执行官 Massimiliano Colella、首席财务官 Andre Nel、 非执行董事长 Dan Moore，以及美国总裁兼总经理
              Chris O'Hara、总法律顾问兼首席合规官 Bart Wilms 等区域负责人。 公司在商业规模化期间经历多次管理层变动和结构重组，包括前 CEO Per Vegard Nerseth 由
              Massimiliano Colella 接任， 以及 2023 年 4 月为使运营支出匹配商业爬坡里程碑而裁撤约 350 名员工。公司维持结构化治理机制，包括面向
              医疗系统的正式产品漏洞处理披露协议；同时还需应对雇佣争议，例如前高级风险与监管专家在 Watford Employment Tribunal 提起的不公平解雇举报诉讼。
            claimRefs:
              - CO005
