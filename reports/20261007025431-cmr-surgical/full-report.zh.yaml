figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: CMR Surgical 从 2014 年成立到 2026 年进入美国市场期间的公司、融资、临床、监管和不利事件关键里程碑。
    data:
      items:
        - label: 2014：公司成立
          date: '2014-01-26'
          detail: 在英国注册 Cambridge Medical Robotics，开发模块化手术机器人。
          tone: positive
        - label: 2018：更名为 CMR Surgical
          date: '2018-03-08'
          detail: 商业发布前正式将公司名称改为 CMR Surgical。
          tone: neutral
        - label: 2019：独角兽里程碑
          date: '2019-07-17'
          detail: 完成 $240M C 轮融资后，达到 $1B+ 独角兽估值基准。
          tone: positive
        - label: 2021：$600M D 轮，估值 $3B
          date: '2021-06-27'
          detail: 以 $600M 融资和 $3.0B 投后估值完成医疗科技领域最大规模的私募轮次。
          tone: positive
        - label: 2023：员工重组
          date: '2023-04-06'
          detail: 宣布裁减约 350 名员工，以遏制运营消耗速度。
          tone: negative
        - label: 2023：英国制造扩张
          date: '2023-10-05'
          detail: 在 Ely 开设专用全球制造工厂，年产能可达 500 套系统。
          tone: positive
        - label: 2024：20,000 例手术里程碑
          date: '2024-03-21'
          detail: 在英国 NHS 和国际医院完成的临床手术超过 20,000 例。
          tone: positive
        - label: 2024：举报人法庭听证
          date: '2024-10-18'
          detail: Watford 就业法庭就不公平解雇争议发布公开初步判决。
          tone: negative
        - label: 2025：$200M 增长资本轮
          date: '2025-04-02'
          detail: 完成 >$200M 混合融资，包括 $131M D 轮股权和 $68.8M Trinity Capital 债务。
          tone: positive
        - label: 2025：FDA 510(k) 许可
          date: '2025-12-01'
          detail: Versius Plus 获得 FDA 510(k) 监管许可，可用于成人胆囊切除手术。
          tone: positive
        - label: 2026：45,000 例手术与 SAGES 美国首秀
          date: '2026-03-26'
          detail: 宣布全球已有 45,000 名患者接受治疗，并在 SAGES 正式启动美国外科医生合作。
          tone: positive
    approximationNotes: 日期代表公司新闻稿、监管记录和法庭记录中的公告日期。
    claimRefs:
      - CO001
