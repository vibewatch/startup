  - id: FP001
    title: 竞争对手公开证据定位图
    type: quadrant
    summary: 序数评分展示指定来源集中证据的广度和规模可见度，不代表市场份额、产品质量或临床表现。
    data:
      xAxis:
        label: 平台证据广度
        min: 1
        max: 5
        lowLabel: Minimal detail
        highLabel: Detailed in assigned sources
        description: Ordinal analyst score based only on product detail in retained fetched text.
        scale: 1-5 ordinal
      yAxis:
        label: 规模与部署证据可见度
        min: 1
        max: 5
        lowLabel: Unquantified
        highLabel: Multiple disclosed scale metrics
        description: Ordinal analyst score based only on quantified scale in retained fetched text.
        scale: 1-5 ordinal
      points:
        - label: CMR Surgical
          x: 5
          'y': 5
          note: 详细的官方产品主张，以及患者、地理、融资和聚合器指标。
        - label: Intuitive Surgical
          x: 2
          'y': 4
          note: 泛化的产品描述，以及 Craft 团队成员和估算收入指标。
        - label: Medtronic
          x: 1
          'y': 4
          note: 被列为竞争对手，并有母公司层面的员工和估算收入指标。
        - label: Distalmotion
          x: 2
          'y': 2
          note: 产品类别和腹部手术描述；未留存部署指标。
        - label: Virtual Incision
          x: 2
          'y': 2
          note: 微型化腹部手术重点，以及 BounceWatch 的融资阶段和融资记录。
        - label: Ronovo Surgical
          x: 2
          'y': 1
          note: 模块化多专科描述，未留存量化规模指标。
    approximationNotes: 评分是根据指定来源文本得出的透明 1-5 证据可见度评估，不衡量竞争实力，也不应替代对竞争对手的直接尽调。
    claimRefs:
