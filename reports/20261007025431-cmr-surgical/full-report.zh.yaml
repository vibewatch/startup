      - number: '6.3'
        title: 机构客户证据与培训合作
        blocks:
          - type: paragraph
            body: >-
              机构采用由知名临床中心、学术医院医疗信托和专业机器人手术培训学院支撑。基础性机构伙伴是比利时 Melle 的 Orsi Academy， 这家全球知名欧洲培训中心与 CMR Surgical
              合作，培训外科医生掌握机器人微创技术。在美国，University of Illinois Chicago 的 Francesco Bianco
              医生等学术临床评估者，已公开评估该平台的多专科临床数据和真实世界表现，CMR 正在准备商业发布。此外，CMR 已与欧洲、中东和拉丁美洲具有前瞻性的医院合作，将 Versius
              嵌入常规软组织手术项目，同时赞助儿科手术和经口机器人手术（TORS） 的多中心前瞻性临床试验，以扩大客户适应症。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
