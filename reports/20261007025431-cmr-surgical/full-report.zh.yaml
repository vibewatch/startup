  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              CMR Surgical 是微创机器人手术中少见的规模化战略资产，开发了 Versius 和 Versius Plus 系统，已在 30 多个国家治疗超过 45,000
              名患者。乐观情景建立在机器人长期采用趋势、偏好多手术间部署的医院资本预算约束，以及为胆囊切除术取得 FDA 许可、从而打开美国顶级手术机器人利润池之上。但反论点同样重大：CMR 累计融资超过 $1.4B，而
              EquityZen 的私募二级交易和公司披露显示，在没有经审计收入运行率、毛利率或手术器械利用率经济数据的情况下，公司仍需要流动性和股权资本重组。此外，Intuitive Surgical 占主导地位的 da
              Vinci 多孔和单孔生态，加上成熟的机器人医院合同，造成严重的客户切换摩擦，威胁 CMR 的资本周转速度。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: 推荐立场与资本结构
        blocks:
          - type: paragraph
            body: >
              我们给予 CMR Surgical Track 推荐，中等置信度、高风险评级，并相对历史私募轮次持偏高估值立场。在 2021 年达到 $3.0B 峰值 D 轮估值后，公司于 2025 年 4
              月完成延伸轮，筹集超过 $200M 股债合计资本，其中包含 Trinity Capital 的优先担保债务工具 （$68.8M 债务部分和 $131M D 轮股权）。这笔资金支持美国商业扩张和 Versius
              Plus 架构的商业发布。然而，缺少公开收入披露， 加上前监管人员提起的举报人雇佣仲裁诉讼涉及驳回程序和披露问题，显示公司在快速规模化期间承受运营压力。在 CMR 证明美国医院中心
              的手术增长和器械利用率具有持久性前，对其按历史倍数或更高估值作投资判断，对纪律严明的成长投资者而言都缺乏依据。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: 情景估值分析与尽调重点
        blocks:
          - type: paragraph
            body: >
              对 CMR Surgical 作投资判断，需要评估未来 24 至 36 个月的三种运营情景。乐观情景下，美国多专科适应症快速扩展至胆囊切除术之外，尤其取得良性妇科 510(k)
              许可，推动医院系统和日间手术中心实现高利用率，最终支持多元化医疗科技集团溢价收购或公司以溢价倍数上市。 基准情景是假设美国医院采用温和增长，同时欧洲及国际临床业务稳定扩张；手术量持续增加，但高运营消耗迫使公司在
              Trinity Capital 约束下进一步获得结构化资本或再融资。悲观情景下，Intuitive Surgical 根深蒂固的市场阻力、美国手术增长迟缓或临床不良事件引发倍数压缩和
              潜在的下轮重组，稀释普通股股东。立即尽调应聚焦单位贡献利润率、债务约束和手术日志。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV013
      - number: '8.4'
        title: 展示案例
        blocks:
          - type: callout
            title: Track 推荐等待美国单位经济性验证
            body: >
              虽然 CMR Surgical 是西方软组织机器人领域最可行的 Intuitive Surgical 挑战者，但在看不到单位贡献利润率、客户流失和债务约束时，
              按数十亿美元估值作股权投资判断会带来不可接受的风险调整后画像。投资者应在采取积极股权立场前，跟踪美国医院部署公告、510(k) 妇科 扩张和经审计财务报表。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV013
          - type: callout
            title: 优先债务悬顶与资本结构风险
            body: |
              2025 年 4 月融资纳入 Trinity Capital 债务，带来优先债权人的债权主张和可能限制未来战略灵活性的运营约束。如果美国医疗系统的商业转化 慢于预期，偿债和清算优先权可能严重损害股权回报。
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV013
