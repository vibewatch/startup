      - number: '7.3'
        title: 资本结构与外部依赖
        blocks:
          - type: paragraph
            body: >-
              2025 年融资缓解了即时资金压力，却留下重大投资判断缺口：CMR 和 MassDevice 都描述了超过 $200 million 的股债合计融资，并 都确认 Trinity Capital 是新的债务投资方
              [CR005, CR006]。公开材料没有披露债务金额、到期、约束、担保、定价或控制权变更条款， 因此募集资金不能视为可用现金，也不能视为现金跑道证据。资金用途是全球商业化，尤其是美国发布，以及产品开发
              [CR015]。执行还依赖 医院和日间手术中心采用系统、客户服务渠道分发手术系统补丁，以及客户在当地许可允许时自行采购吲哚菁绿 [CR010, CR012, CR015]。
              这些是可观察的依赖机制，但交易对手集中度和合同保护并未公开。核心投资风险是里程碑错配：在更广泛适应症和可重复的美国部署得到证明前， 债务和扩张成本可能已经固定下来。
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
              - CR015
