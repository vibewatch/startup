      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Corporate Operations
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical operates under an experienced executive team led by Chief Executive Officer Massimiliano
              Colella, Chief Financial Officer Andre Nel, Non-Executive Chairman Dan Moore, and key regional leaders
              including Chris O'Hara (President & General Manager, U.S.) and Bart Wilms (General Counsel & Chief
              Compliance Officer). The business has navigated several leadership transitions and structural
              reorganizations during its commercial scale-up, including an executive shift from former CEO Per Vegard
              Nerseth to Massimiliano Colella, alongside an April 2023 restructuring that made approximately 350
              employees redundant to align operational expenditures with commercial ramp-up milestones. Corporate
              operations maintain structured governance mechanisms, including a formal product vulnerability handling
              disclosure protocol for health systems, while navigating employment dispute proceedings such as the unfair
              dismissal whistleblowing litigation brought by a former Senior Risk and Regulatory Specialist before the
              Watford Employment Tribunal.
