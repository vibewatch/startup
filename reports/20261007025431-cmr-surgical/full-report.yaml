  - id: FE001
    title: Versius Architecture and Operating Stack
    type: stack
    summary: >-
      Architectural hierarchy of the Versius platform spanning hardware mechanics, embedded software, visualization, and
      cloud telemetry.
    data:
      layers:
        - label: Edge & Cloud Analytics
          detail: Post-procedure data aggregation, telematic logbooks, and clinical registry analytics
          modules:
            - Versius Connect App
            - Versius Team Dashboard
            - Global Clinical Registry
        - label: Physical AI Compute
          detail: Intraoperative physical AI acceleration and high-throughput point-of-care computer vision inference
          modules:
            - NVIDIA IGX Thor Pipeline
            - Real-Time Video Analytics Engine
            - Low-Latency Sensor Fusion
        - label: Imaging & Display Layer
          detail: Stereoscopic operative field visualization and real-time intraoperative optical guidance
          modules:
            - 3D Stereoscopic HUD
            - vLimeLite ICG Fluorescence
            - 0° and 30° Rigid Endoscopes
            - EIZO CuratOR System
        - label: Software-Defined Control Layer
          detail: Deterministic real-time control executing compliant kinematics, tremor filtration, and safety interlocks
          modules:
            - Deterministic Real-Time Kinematics
            - Multi-Mode Compliance Engine
            - Dynamic Collision Detection
            - Digital Tremor Filtration
        - label: Modular Patient Interfaces
          detail: Decoupled mobile bedside carts with independent 11-joint kinematic arms and brake lock assemblies
          modules:
            - Visualization Bedside Cart
            - 1-3 Instrument Bedside Units
            - J1-J8 Spatial Arm Linkages
        - label: Console & Surgical End-Effectors
          detail: Open ergonomic surgeon workstation and precision articulating wristed surgical instruments
          modules:
            - Open Ergonomic Console
            - Hand Controllers with Electrosurgery Triggers
            - 5mm Wristed Endosurgical Tools (J9-J11)
    approximationNotes: >-
      Conceptual representation of subsystem integration layers based on FDA DEN230078 specifications and company
      engineering announcements.
