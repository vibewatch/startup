chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical Limited, originally established in 2014 as Cambridge Medical Robotics, is a private limited
              medical technology company headquartered at Evolution Business Park in Cambridge, United Kingdom. The
              company's global manufacturing operations are centered in Ely, Cambridgeshire, which opened following a
              £10 million capital commitment to support scaled production of up to 500 Versius systems annually. CMR
              Surgical was founded by Luke Hares, Keith Marshall, Paul Roberts, Mark Slack, and Martin Frost to
              challenge the historic monopoly of Intuitive Surgical's da Vinci system in minimally invasive soft-tissue
              procedures. Its core commercial product, the Versius Surgical Robotic System—and its next-generation
              iteration Versius Plus—utilizes an open ergonomic console, biomimicking wristed instruments, and mobile,
              modular robotic arms that can be decoupled and repositioned across standard hospital operating rooms
              rather than remaining tethered to a dedicated surgical suite. The commercial model couples capital system
              placements or leasing structures with recurring instrumentation sales, accessories, digital ecosystem
              software, and service maintenance contracts.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO010
