  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer adoption journey for hospitals implementing the Versius platform, spanning evaluation,
      procurement, training, clinical utilization, and fleet expansion.
    data:
      items:
        - label: 1. Clinical Awareness & SAGES Outreach
          summary: >-
            Surgeon engagement through scientific congresses (SAGES), robotic demonstrations, and real-world clinical
            data review.
          touchpoints:
            - Medical conferences
            - Peer-reviewed data
          note: Initial clinical interest generated among general and colorectal surgical champions
        - label: 2. Institutional Procurement & Business Case
          summary: >-
            Hospital committee assessment of modular capital acquisition or lease costs versus da Vinci monopoly
            pricing.
          touchpoints:
            - Capital committee
            - Procurement tender
          note: Long approval cycle requiring ROI justification based on multi-OR sharing
        - label: 3. Simulation & Orsi Academy Training
          summary: >-
            Intensive simulation training with Versius Trainer and accredited hands-on education at specialized centers
            like Orsi Academy.
          touchpoints:
            - Orsi Academy
            - Versius Trainer
          note: Certification of primary surgeon and nursing team on bedside unit setup
        - label: 4. OR Integration & Bedside Workflow
          summary: >-
            Modular bedside units moved into standard operating rooms; open console configuration and port placement
            optimization.
          touchpoints:
            - OR setup
            - Biomimetic arms
          note: Eliminates need for dedicated robotics theater, enabling inter-departmental mobility
        - label: 5. Routine Case Scheduling & Versius Connect
          summary: >-
            Surgeons conduct routine cholecystectomy or soft-tissue procedures; digital telemetry tracked via Versius
            Connect and Team apps.
          touchpoints:
            - Versius Connect app
            - Versius Team dashboard
          note: Near-real-time procedural logbooks and efficiency tracking
        - label: 6. Utilization Audit & Account Expansion
          summary: >-
            Evaluating cases per system across surgical specialties to justify additional instrument packs or secondary
            console acquisitions.
          touchpoints:
            - Hospital utilization review
            - Contract renewal
          note: Critical medtech juncture where low case velocity risks operational underutilization
    approximationNotes: >-
      Conceptual enterprise customer journey synthesized from surgical robotics procurement practices, training
      workflows, and digital telemetry tools.
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU008
      - CU010
      - CU012
  - id: FR001
    title: Qualitative residual-risk heatmap
    type: matrix
    summary: Analyst placement of evidenced and unresolved risks by qualitative impact and likelihood signal.
    data:
      columns:
        - Impact
        - Likelihood signal
        - Mitigation maturity
      rows:
        - label: Narrow U.S. indication
          note: Current product-scope constraint.
          values:
            - label: Critical
              detail: Can limit multi-specialty utilization and launch economics.
              tone: critical
            - label: Current constraint
              detail: Company materials identify cholecystectomy as the cleared U.S. indication.
              tone: high
            - label: Partial
              detail: A benign-gynecology submission is filed; its disposition is not established here.
              tone: medium
        - label: Employment-governance remediation
          note: Adjudicated conduct with unknown remediation status.
          values:
            - label: High
              detail: Creates governance, legal, reputational, and talent exposure.
              tone: high
            - label: Adjudicated event
              detail: The assigned judgment allowed limited discrimination and harassment claims.
              tone: critical
            - label: Unknown
              detail: Remedy, appeal, and control remediation are not established in the assigned evidence.
              tone: high
        - label: Debt terms and runway
          note: Financing is disclosed, but debt terms and cash use are not.
          values:
            - label: Critical
              detail: Restrictive terms or insufficient liquidity could constrain expansion.
              tone: critical
            - label: Unknown
              detail: Debt amount, covenants, maturity, cash, and burn are not public in the retained sources.
              tone: high
            - label: Unknown
              detail: Closing the financing does not evidence covenant headroom or runway.
              tone: high
        - label: Security and field service
          note: Published process without disclosed performance metrics.
          values:
            - label: High
              detail: Affected products operate in clinical settings.
              tone: high
            - label: Unknown
              detail: No current event frequency can be inferred from the policy.
              tone: high
            - label: Process documented
              detail: Intake, risk acceptance, remediation, and service-channel distribution are described.
              tone: medium
        - label: Inventory traceability
          note: One historical event, not a demonstrated current pattern.
          values:
            - label: Moderate
              detail: The assigned evidence reports financial loss but no clinical consequence.
              tone: medium
            - label: Historical single event
              detail: Recurrence likelihood is not established.
              tone: low
            - label: Unknown
              detail: Current CAPA and traceability controls require diligence.
              tone: high
        - label: Instrument and ICG availability
          note: Current portfolio and country-specific procurement constraints.
          values:
            - label: Moderate
              detail: Can constrain procedure workflow or use of fluorescence imaging.
              tone: medium
            - label: Current constraint
              detail: The dissector is not approved in the U.S.; ICG status varies by country.
              tone: high
            - label: Partial
              detail: Customers source ICG independently; alternative instrument mitigation is not evidenced here.
              tone: medium
    approximationNotes: >-
      Qualitative analyst synthesis only; placements are not statistical probabilities, event rates, or quantified loss
      estimates.
    claimRefs:
      - CR016
  - id: FV001
    title: CMR Surgical Investment Decision and Valuation Flow
    type: flow
    summary: >-
      Logic path linking installed scale, financing structure, competitive friction, and valuation uncertainty to the
      final Track recommendation.
    data:
      nodes:
        - id: installed-scale
          label: Clinical Scale & 45k Cases
          description: >-
            Over 45,000 procedures completed across 30+ countries establishes CMR as clear global #2 soft-tissue
            platform.
        - id: fda-clearance
          label: U.S. Market Entry Clearance
          description: >-
            FDA 510(k) clearance for Versius Plus in cholecystectomy unlocks commercialization in premier robotic
            market.
        - id: capital-structure
          label: Structured Financing Stack
          description: Over $200M secured in April 2025 equity and Trinity Capital debt; cumulative funding exceeds $1.4B.
        - id: margin-opacity
          label: Financial & Margin Opacity
          description: Undisclosed system pricing, recurring revenue mix, and cash burn prevent robust fundamental DCF modeling.
        - id: competitive-moat
          label: Incumbent Moat Friction
          description: Intuitive Surgical's established ecosystem and hospital switching costs constrain rapid displacement.
        - id: recommendation-track
          label: Track Recommendation
          description: >-
            Maintain Track stance at medium confidence; monitor U.S. utilization and await data-room financial
            disclosure.
      edges:
        - from: installed-scale
          to: fda-clearance
        - from: fda-clearance
          to: capital-structure
        - from: capital-structure
          to: margin-opacity
        - from: margin-opacity
          to: competitive-moat
        - from: competitive-moat
          to: recommendation-track
    approximationNotes: Flow diagram illustrates the qualitative decision gating process from market proof points to final stance.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV010
