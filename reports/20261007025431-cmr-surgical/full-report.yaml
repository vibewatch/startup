      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Modular Capital Model Versus Monolithic Robotics Suites
            body: >-
              Versius differentiates from Intuitive Surgical's da Vinci architecture by decoupling robotic arms into
              lightweight, mobile units that move between standard operating rooms. This modularity reduces hospital
              capital lock-in, enabling ASCs and NHS trusts to scale robotic utilization across general, colorectal,
              gynecological, and urological surgery without dedicated robotics suites.
            calloutType: insight
            claimRefs:
              - CO003
              - CO010
          - type: callout
            title: Capital Intensity and US Execution Barrier
            body: >-
              Despite treating over 45,000 patients globally, CMR Surgical faces high commercial barriers entering the
              United States. With a narrow initial FDA indication limited to cholecystectomy, ongoing lender covenants
              on $68.8M of debt, and historically opaque private cash burn rates, sustainable multi-specialty expansion
              will require substantial continuing clinical validation and capital access.
            calloutType: risk
            claimRefs:
              - CO007
              - CO010
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is robotic assistance for soft-tissue minimal-access surgery, including the robotic
              platform, its instruments, service, training, and program-level digital tools. It excludes orthopedic and
              other non-soft-tissue robots, the hospital's underlying surgical procedure revenue, general-purpose
              hospital software, and manual open or laparoscopic surgery. Those manual approaches remain the practical
              status-quo substitutes rather than part of robotic-system spend [CM001]. In the United States, the
              currently evidenced commercial boundary is narrower still: Versius Plus is cleared for cholecystectomy in
              adults aged 22 and older [CM002]. International use spans five named specialties, but that installed
              clinical footprint should not be mistaken for a quantified addressable market [CM004].
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supplies adoption markers, not an auditable market model. CMR reported more than 45,000
              patients treated by March 2026 and use in more than 30 countries [CM003, CM004]. A third-party
              AI-generated SWOT asserts robotic surgery penetration below 10%, but it provides no underlying procedure
              denominator or primary methodology, so the percentage is directional only [CM009]. IncFact's Florida
              profile lists revenue as unavailable and warns that private-company revenue figures are statistical
              evaluations [CM010]. A reported $4 billion sought sale valuation and a financing round above $200 million
              are capital-market facts, not revenue, cash available, or TAM [CM011, CM012]. Accordingly, no defensible
              TAM, SAM, or SOM can be calculated from this pool without procedure volumes, eligible-indication counts,
              geography-level pricing, placement data, and utilization [CM015].
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM016
      - number: '2.3'
        title: Buyers, Users, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The evidenced buyers are provider organizations: CMR says it is building US partnerships with hospitals
              and ambulatory surgery centers, while surgeons and surgical teams are the direct users [CM005]. The public
              sources do not identify the budget owner, contracting unit, reimbursement split, procurement-cycle length,
              or economic payer for any named account. Product fit may lower workflow friction because the modular
              system can move between operating rooms without a dedicated room [CM006], but portability alone does not
              establish a purchase return. The adoption path is therefore best modeled as regulatory eligibility,
              provider evaluation, capital or contract approval, installation and training, utilization, and continuing
              service; only some of those stages are evidenced publicly [CM016]. The pending benign-gynecology
              submission could widen the US clinical wedge, but it is a filing rather than a clearance [CM007].
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM016
      - number: '2.4'
        title: Drivers, Constraints, and Diligence Implications
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption driver is demonstrated use: CMR's patient milestone, geographic footprint, and
              multispecialty activity show that Versius is beyond a pilot-only product [CM003, CM004]. The main
              constraint is conversion, not abstract category awareness. US access is initially limited to one procedure
              [CM002], while an independent but low-reputation SWOT flags hospital capital sensitivity, intense
              incumbent rivalry, and the need to prove total cost of ownership [CM008]. Trust is another procurement
              input: CMR publishes a process for receiving vulnerability reports and distributing patches through
              customer service arrangements, but that process does not disclose incident rates, remediation times, or
              external certifications [CM013]. A preliminary UK employment judgment concerns dismissal and disclosure
              issues, not product safety, market demand, or buyer adoption, so it is an execution-diligence signal
              rather than market evidence [CM014].
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No defensible public TAM
            body: >-
              Adoption counts, funding, and a reported sought valuation cannot substitute for eligible procedure
              volumes, pricing, placements, utilization, and service revenue. A dollar market model should remain open
              until those denominators are obtained.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
          - type: callout
            title: The US entry wedge is narrower than the global footprint
            body: >-
              International multispecialty use demonstrates clinical breadth, while current US clearance is limited to
              adult cholecystectomy and gynecology remains a submitted expansion. US underwriting should therefore be
              indication-specific.
            calloutType: insight
            claimRefs:
