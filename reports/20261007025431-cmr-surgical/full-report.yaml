          date: '2018-03-08'
          detail: Formally changed corporate name to CMR Surgical ahead of commercial launch.
          tone: neutral
        - label: '2019: Unicorn Status Milestone'
          date: '2019-07-17'
          detail: Achieved $1B+ unicorn valuation benchmark following $240M Series C financing.
          tone: positive
        - label: '2021: $600M Series D at $3B Valuation'
          date: '2021-06-27'
