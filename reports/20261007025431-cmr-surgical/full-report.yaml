          are withheld.
        - Reserve valuation underwriting pending confidential data-room verification of revenue and gross margins.
      - - Risk Rating
        - High
        - >-
          Capital intensity, senior debt debt covenants from Trinity Capital, and incumbent competition from Intuitive
          Surgical.
        - High risk of further dilution or liquidation preference overhang on earlier equity tranches.
      - - Valuation Stance
        - Stretched
        - Historical $3.0B post-money valuation benchmark unanchored to disclosed ARR or procedure recurring revenue.
        - Implies entry multiple vulnerable to compression without accelerated procedural utilization.
    notes: >-
      Assessment based on synthesis of April 2025 financing ($200M+ debt/equity) and March 2026 U.S. commercial debut at
      45,000 cases.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
  - id: TV002
    title: Investment Thesis vs Anti-Thesis Matrix
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - Thesis-Break or Reversal Trigger
    rows:
      - - Thesis (Scale & Moat)
        - >-
          Modular architecture and second-largest clinical footprint globally offer hospital flexibility and lower
          barrier to entry.
        - >-
          Over 45,000 patients treated globally across 30+ countries with CE mark and FDA 510(k) clearance for Versius
          Plus.
        - Failure to gain traction in U.S. hospitals or stagnation in clinical procedure volumes.
      - - Thesis (Capital Support)
        - Tier-one investor syndicate continues supporting capital requirements through major growth transitions.
        - Over $200M raised in April 2025 with participation from SoftBank, Lightrock, Ally Bridge, and Trinity Capital.
        - Investor syndicate refuses follow-on participation, prompting emergency down-round.
      - - Anti-Thesis (Financial Opacity)
        - Undisclosed instrument economics, system ASPs, and customer churn prevent rigorous valuation multiples.
        - >-
          Financial metrics absent from public disclosures; UK filing reports historical revenue bands £10M-£50M for
          2024.
        - Release of audited financial statements proving positive unit contribution margin and accelerating ARR.
      - - Anti-Thesis (Competitive & Legal Headwinds)
        - >-
          Dominant incumbent ecosystem and internal personnel/governance disputes create persistent operational
          friction.
        - Intuitive Surgical ecosystem lock-in and UK Employment Tribunal whistleblowing claims (Riaz v CMR Surgical).
        - Securing major U.S. national health system group purchasing contract displacing incumbent systems.
    notes: Synthesizes competitive advantages against disclosed capital intensity and regulatory litigation risks.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: Scenario Underwriting Model (24-36 Month Outlook)
    columns:
      - Scenario
      - Probability
      - Core Assumptions & Operating Milestones
      - Valuation & Exit Logic
      - Downside Triggers & Risks
    rows:
      - - Bull Case
        - 25%
        - >-
          Rapid U.S. adoption across ASCs; 510(k) clearance achieved for gynecology; procedural utilization exceeds 250
          cases/system/year.
        - >-
          Enterprise valuation expands to $4.0B+ via strategic acquisition by major medtech player (e.g., Medtronic,
          J&J, Siemens Healthineers) or dual-track IPO.
        - Regulatory delay in gynecology expansion or aggressive pricing response by Intuitive Surgical.
      - - Base Case
        - 50%
        - >-
          Steady procedural growth in Europe, India, and Latin America; selective U.S. hospital placements for
          cholecystectomy; gross margin improves slowly.
        - >-
          Valuation marks track historical $2.0B-$3.0B range; structured capital or modest debt expansion required to
          achieve cash-flow neutrality.
        - High capital burn rate outpaces procedure revenue growth, exhausting Trinity Capital debt facility.
      - - Bear Case
        - 25%
        - >-
          U.S. hospital commercialization stalls due to clinical preference for da Vinci; capital exhaustion leads to
          punitive recapitalization.
        - >-
          Down-round equity financing or distressed asset sale at $1.0B-$1.5B, triggering severe dilution for common and
          junior preferred shareholders.
        - >-
          Significant clinical adverse event, regulatory enforcement, or technical malfunction triggering product
          recall.
    notes: >-
      Probability-weighted scenario model reflecting capital intensity, commercial hurdles, and strategic M&A
      optionality.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV008
      - CV010
      - CV013
