      - number: '1.3'
        title: Capitalization Profile, Commercial Scale, and US Expansion Milestones
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical has raised more than $1.28 billion across its lifetime funding rounds, achieving a $3.0
              billion post-money valuation during its $600 million Series D financing in June 2021 led by Escala Capital
              and SoftBank Vision Fund 2. In April 2025, the company closed an additional growth financing round
              exceeding $200 million, comprising $131 million in Series D equity from existing sponsors including
              SoftBank, Lightrock, and Ally Bridge Group, alongside a $68.8 million conventional debt facility provided
              by Trinity Capital to fund commercialization and clinical trial pipelines. Commercial traction has
              expanded across more than 30 countries globally, passing 20,000 clinical procedures in March 2024, 30,000
              cases by early 2025, and surpassing 45,000 patients treated globally by March 2026. Following FDA 510(k)
              clearance in December 2025 for cholecystectomy, CMR made its formal U.S. clinical introduction at SAGES
              2026, while detailed comprehensive income, cash burn rates, and unit gross margins remain closely held
              private data.
