              - CM004
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Entrants, and Unevidenced Alternatives
        blocks:
          - type: paragraph
            body: >-
              The retained independent directories consistently place Intuitive Surgical, Medtronic, and Distalmotion in
              CMR's peer set, while also surfacing narrower or earlier-stage approaches such as Virtual Incision and
              Ronovo Surgical. That supports a landscape spanning scaled incumbents, direct soft-tissue challengers,
              miniaturized systems, and specialty-focused entrants. It does not establish equivalent regulatory scope,
              clinical outcomes, installed base, or commercial maturity: the directory sources classify similarity
              rather than benchmark performance. Conventional laparoscopy, continued use of an incumbent robot, and an
              internal hospital program are economically relevant alternatives to a new CMR purchase, but the assigned
              pool contains no buyer evidence with which to quantify or rank those status-quo choices. The competitive
              map should therefore be read as a source-visibility map, not as a market-share or product-quality ranking.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
