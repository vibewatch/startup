      - Metric and denominator
      - Methodology or confidence
      - Limitation
    rows:
      - - CMR Surgical
        - '2026-03-26'
        - Worldwide
        - More than 45,000
        - Patients treated cumulatively with Versius
        - Company-reported milestone; medium confidence
        - Not annual procedures, revenue, installed systems, TAM, SAM, or SOM
      - - CMR Surgical
        - '2026-03-26'
        - More than 30 countries
        - Five named specialties
        - Breadth of clinical adoption
        - Company-reported footprint; medium confidence
        - Country approvals, active sites, case mix, and utilization are undisclosed
      - - SWOTAnalysis.com
        - 2025-Q4 analysis updated 2026-02-10
        - Not specified
        - Less than 10%
        - Asserted robotic-surgery penetration
        - AI-generated synthesis with no shown primary method; low confidence
        - No eligible-procedure denominator, geography, value, or forecast period
      - - MD+DI
        - '2025-06-03'
        - Company-level
        - Up to $4 billion
        - Reported sought transaction valuation
        - Independent trade-press report; medium confidence
        - A sought valuation is not a completed valuation or market size
      - - CMR Surgical and MD+DI
        - 2025
        - Company-level with US expansion focus
        - More than $200 million
        - Equity-and-debt financing round
        - Company announcement corroborated by trade press; high confidence
        - Funding raised is not revenue, cash available, demand, TAM, SAM, or SOM
    notes: >-
      Values preserve each source's metric, period, and denominator; no currency or
      procedure conversion is attempted because pricing and utilization are missing.
