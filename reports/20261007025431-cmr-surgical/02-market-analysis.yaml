figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      Six nested evidence layers separate the unquantified category from demonstrated
      adoption and the narrow US entry wedge; they are not proportional market sizes.
    data:
      items:
        - label: Broad category
          value: Dollar TAM unavailable
          detail: Soft-tissue robotic minimal-access surgery and its status-quo substitutes.
        - label: Demonstrated global use
          value: More than 45,000 patients
          detail: Cumulative company-reported patient milestone as of 2026-03-26.
        - label: Geographic footprint
          value: More than 30 countries
          detail: Company-reported adoption footprint without country-level site counts.
        - label: Clinical breadth
          value: Five named specialties
          detail: General, colorectal, urology, gynecology, and thoracic surgery.
        - label: US cleared wedge
          value: Adult cholecystectomy
          detail: Clearance applies to patients aged 22 and older.
        - label: Adjacent US filing
          value: Benign gynecology submitted
          detail: A filed submission is not evidence of clearance or commercial availability.
    approximationNotes: >-
      The pyramid is an evidence hierarchy, not a scale drawing; layers use different
      units and no conversion, proportional area, TAM, SAM, or SOM is inferred.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM007
      - CM016
callouts:
  - calloutType: risk
    title: No defensible public TAM
    body: >-
      Adoption counts, funding, and a reported sought valuation cannot substitute for
      eligible procedure volumes, pricing, placements, utilization, and service revenue.
      A dollar market model should remain open until those denominators are obtained.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM015
  - calloutType: insight
    title: The US entry wedge is narrower than the global footprint
    body: >-
      International multispecialty use demonstrates clinical breadth, while current US
      clearance is limited to adult cholecystectomy and gynecology remains a submitted
      expansion. US underwriting should therefore be indication-specific.
    claimRefs:
      - CM002
      - CM004
      - CM007
