slug: cmr-surgical
runDate: '2026-10-07'
company:
  name: CMR Surgical
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    CMR Surgical has meaningful adoption evidence - more than 45,000 patients across
    more than 30 countries - but the assigned public evidence does not support a
    defensible dollar TAM, SAM, or SOM. The investable market case therefore rests on
    a narrow US cholecystectomy entry wedge, broader international multispecialty use,
    and whether modular deployment can overcome regulatory, budget, workflow, and
    trust constraints.
sections:
  - id: market-boundary
    title: Market Boundary and Substitutes
    body: >-
      The relevant market is robotic assistance for soft-tissue minimal-access
      surgery, including the robotic platform, its instruments, service, training,
      and program-level digital tools. It excludes orthopedic and other
      non-soft-tissue robots, the hospital's underlying surgical procedure revenue,
      general-purpose hospital software, and manual open or laparoscopic surgery.
      Those manual approaches remain the practical status-quo substitutes rather
      than part of robotic-system spend [CM001]. In the United States, the currently
      evidenced commercial boundary is narrower still: Versius Plus is cleared for
      cholecystectomy in adults aged 22 and older [CM002]. International use spans
      five named specialties, but that installed clinical footprint should not be
      mistaken for a quantified addressable market [CM004].
    claimRefs:
      - CM001
      - CM002
      - CM004
    tableRefs:
      - TM001
  - id: sizing-without-false-precision
    title: Evidence-Constrained Sizing
    body: >-
      Public evidence supplies adoption markers, not an auditable market model. CMR
      reported more than 45,000 patients treated by March 2026 and use in more than
      30 countries [CM003, CM004]. A third-party AI-generated SWOT asserts robotic
      surgery penetration below 10%, but it provides no underlying procedure
      denominator or primary methodology, so the percentage is directional only
      [CM009]. IncFact's Florida profile lists revenue as unavailable and warns that
      private-company revenue figures are statistical evaluations [CM010]. A
      reported $4 billion sought sale valuation and a financing round above $200
      million are capital-market facts, not revenue, cash available, or TAM
      [CM011, CM012]. Accordingly, no defensible TAM, SAM, or SOM can be calculated
      from this pool without procedure volumes, eligible-indication counts,
      geography-level pricing, placement data, and utilization [CM015].
    claimRefs:
      - CM003
      - CM004
      - CM009
      - CM010
      - CM011
      - CM012
      - CM015
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-users-and-adoption-path
    title: Buyers, Users, and Adoption Path
    body: >-
      The evidenced buyers are provider organizations: CMR says it is building US
      partnerships with hospitals and ambulatory surgery centers, while surgeons and
      surgical teams are the direct users [CM005]. The public sources do not identify
      the budget owner, contracting unit, reimbursement split, procurement-cycle
      length, or economic payer for any named account. Product fit may lower workflow
      friction because the modular system can move between operating rooms without a
      dedicated room [CM006], but portability alone does not establish a purchase
      return. The adoption path is therefore best modeled as regulatory eligibility,
      provider evaluation, capital or contract approval, installation and training,
      utilization, and continuing service; only some of those stages are evidenced
      publicly [CM016]. The pending benign-gynecology submission could widen the US
      clinical wedge, but it is a filing rather than a clearance [CM007].
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM016
    tableRefs:
      - TM003
  - id: drivers-constraints-and-diligence
    title: Drivers, Constraints, and Diligence Implications
    body: >-
      The strongest adoption driver is demonstrated use: CMR's patient milestone,
      geographic footprint, and multispecialty activity show that Versius is beyond
      a pilot-only product [CM003, CM004]. The main constraint is conversion, not
      abstract category awareness. US access is initially limited to one procedure
      [CM002], while an independent but low-reputation SWOT flags hospital capital
      sensitivity, intense incumbent rivalry, and the need to prove total cost of
      ownership [CM008]. Trust is another procurement input: CMR publishes a process
      for receiving vulnerability reports and distributing patches through customer
      service arrangements, but that process does not disclose incident rates,
      remediation times, or external certifications [CM013]. A preliminary UK
      employment judgment concerns dismissal and disclosure issues, not product
      safety, market demand, or buyer adoption, so it is an execution-diligence
      signal rather than market evidence [CM014].
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM008
      - CM013
      - CM014
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment or category
      - Included spend or activity
      - Excluded spend or substitute
      - Buyer or payer evidence
      - Relevance to CMR
    rows:
      - - Core soft-tissue robotic surgery
        - Robotic platform, instruments, service, training, and program tools
        - Orthopedic robots, general hospital IT, and procedure reimbursement
        - Hospitals and ASCs are evidenced targets; economic payer is not disclosed
        - Core category for Versius and Versius Plus
      - - US cleared entry wedge
        - Robotic assistance for adult cholecystectomy in patients aged 22 and older
        - Other US procedures not covered by the cited clearance
        - Hospitals and ASCs; budget owner and reimbursement split are not disclosed
        - Current US serviceable boundary
      - - International multispecialty footprint
        - General, colorectal, urology, gynecology, and thoracic procedures
        - Total eligible procedures and unevidenced country-level indications
        - Hospitals; country-specific payer structures are not provided
        - Demonstrates breadth of use, not market size
      - - Status-quo alternatives
        - Open surgery and conventional laparoscopy as ways to perform the clinical job
        - Unrelated capital equipment and non-surgical automation
        - Provider organizations and clinicians; purchasing mechanics are not evidenced
        - Defines the substitution set for adoption analysis
    notes: >-
      Boundary is derived from product labeling and company descriptions; public
      evidence does not disclose contract allocation, reimbursement, or buyer budgets.
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM005
