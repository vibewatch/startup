      - - US health systems
        - Hospital or health-system organization
        - Surgeons introducing Versius Plus
        - Not disclosed in retained sources
        - Initial use limited to cleared adult cholecystectomy
        - Not disclosed in retained sources
        - Cleared indication plus an approved capital or contract case
      - - Ambulatory surgery centers
        - ASC organization
        - Outpatient surgeons and surgical teams
        - Not disclosed in retained sources
        - Modular equipment can move between rooms
        - Not disclosed in retained sources
        - Cholecystectomy fit, portability, service, and evidenced economics
      - - Cost-sensitive provider segment
        - Hospital or surgical center, as asserted by SWOTAnalysis.com
        - Surgeons and operating-room teams
        - Not disclosed in retained sources
        - Flexible deployment proposed as an alternative to fixed-room systems
        - Not disclosed in retained sources
        - Verified total-cost-of-ownership advantage; currently a diligence gap
    notes: >-
      CMR identifies provider settings and users, but the retained sources do not name
