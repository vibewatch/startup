    columns:
      - "Scenario"
      - "Probability"
      - "Core Assumptions & Operating Milestones"
      - "Valuation & Exit Logic"
      - "Downside Triggers & Risks"
    rows:
      - - "Bull Case"
        - "25%"
        - "Rapid U.S. adoption across ASCs; 510(k) clearance achieved for gynecology; procedural utilization exceeds 250 cases/system/year."
        - "Enterprise valuation expands to $4.0B+ via strategic acquisition by major medtech player (e.g., Medtronic, J&J, Siemens Healthineers) or dual-track IPO."
        - "Regulatory delay in gynecology expansion or aggressive pricing response by Intuitive Surgical."
      - - "Base Case"
        - "50%"
        - "Steady procedural growth in Europe, India, and Latin America; selective U.S. hospital placements for cholecystectomy; gross margin improves slowly."
        - "Valuation marks track historical $2.0B-$3.0B range; structured capital or modest debt expansion required to achieve cash-flow neutrality."
        - "High capital burn rate outpaces procedure revenue growth, exhausting Trinity Capital debt facility."
      - - "Bear Case"
        - "25%"
        - "U.S. hospital commercialization stalls due to clinical preference for da Vinci; capital exhaustion leads to punitive recapitalization."
        - "Down-round equity financing or distressed asset sale at $1.0B-$1.5B, triggering severe dilution for common and junior preferred shareholders."
        - "Significant clinical adverse event, regulatory enforcement, or technical malfunction triggering product recall."
    notes: "Probability-weighted scenario model reflecting capital intensity, commercial hurdles, and strategic M&A optionality."
