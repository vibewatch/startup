        - "Over 45,000 patients treated globally across 30+ countries with CE mark and FDA 510(k) clearance for Versius Plus."
        - "Failure to gain traction in U.S. hospitals or stagnation in clinical procedure volumes."
      - - "Thesis (Capital Support)"
