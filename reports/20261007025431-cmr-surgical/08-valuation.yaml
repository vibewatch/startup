callouts:
  - calloutType: "recommendation"
    title: "Track Recommendation Pending U.S. Unit Economic Verification"
    body: >
      While CMR Surgical is the most viable Western challenger to Intuitive Surgical in soft-tissue robotics, underwriting an equity investment at multi-billion dollar valuations without visibility into unit contribution margins, customer churn, and debt covenants represents an unacceptable risk-adjusted profile. Investors should track U.S. hospital placement announcements, 510(k) gynecology expansion, and audited financials before taking an active equity posture.
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV005"
      - "CV007"
      - "CV013"
  - calloutType: "risk"
    title: "Senior Debt Overhang and Capital Structure Risks"
    body: >
      The inclusion of Trinity Capital debt within the April 2025 financing introduces senior creditor claims and potential operational covenants that could constrain future strategic flexibility. In the event of slower-than-expected commercial conversion in the U.S. healthcare system, debt service and liquidation preferences could severely impair equity returns.
    claimRefs:
      - "CV003"
      - "CV007"
      - "CV008"
      - "CV013"
