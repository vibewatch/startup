      - - "Anti-Thesis (Competitive & Legal Headwinds)"
        - "Dominant incumbent ecosystem and internal personnel/governance disputes create persistent operational friction."
        - "Intuitive Surgical ecosystem lock-in and UK Employment Tribunal whistleblowing claims (Riaz v CMR Surgical)."
        - "Securing major U.S. national health system group purchasing contract displacing incumbent systems."
    notes: "Synthesizes competitive advantages against disclosed capital intensity and regulatory litigation risks."
