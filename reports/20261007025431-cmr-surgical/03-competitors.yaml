figures:
  - id: FP001
    title: Competitive Public-Evidence Positioning Map
    type: quadrant
    summary: >-
      Ordinal scores show the breadth and scale visibility of evidence in the
      assigned source set, not market share, product quality, or clinical performance.
    data:
      xAxis:
        label: Platform evidence breadth
        min: 1
        max: 5
        lowLabel: Minimal detail
        highLabel: Detailed in assigned sources
        description: Ordinal analyst score based only on product detail in retained fetched text.
        scale: "1-5 ordinal"
      yAxis:
        label: Scale and deployment evidence visibility
        min: 1
        max: 5
        lowLabel: Unquantified
        highLabel: Multiple disclosed scale metrics
        description: Ordinal analyst score based only on quantified scale in retained fetched text.
        scale: "1-5 ordinal"
      points:
        - label: CMR Surgical
          x: 5
          y: 5
          note: Detailed official product claims plus patient, geography, financing, and aggregator metrics.
        - label: Intuitive Surgical
          x: 2
          y: 4
          note: Generic product description plus Craft employee and estimated revenue metrics.
        - label: Medtronic
          x: 1
          y: 4
          note: Named as a competitor with parent-level employee and estimated revenue metrics.
        - label: Distalmotion
          x: 2
          y: 2
          note: Product category and abdominal-surgery description; no retained deployment metric.
        - label: Virtual Incision
          x: 2
          y: 2
          note: Miniaturized abdominal focus plus a BounceWatch funding-stage and funding entry.
        - label: Ronovo Surgical
          x: 2
          y: 1
          note: Modular multi-specialty description without a retained quantified scale metric.
    approximationNotes: >-
      Scores are transparent 1-5 evidence-visibility assessments derived from
      the assigned source text. They do not measure competitive strength and
      should not be used as a substitute for direct competitor diligence.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP010
      - CP015
callouts:
  - calloutType: risk
    title: The Public Moat Case Is Not Yet Underwritable
    body: >-
      Modularity and reported deployment are credible differentiators, but absent
      realized pricing, switching-cost evidence, direct competitor documentation,
      and an independent utilization benchmark prevent a durable-moat conclusion.
    claimRefs:
      - CP004
      - CP013
      - CP015
      - CP016
