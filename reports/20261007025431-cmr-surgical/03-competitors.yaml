        - Robotic-system capabilities not established by the retained comparison pages
        - Parent-company scale is not robotic-surgery segment scale
      - - Distalmotion
        - Direct private challenger
        - Scale and funding are not stated in the retained Craft comparison
        - Robotic surgery systems
