evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Complete covenant package, interest rates, warrant coverage, and maturity timeline for the $68.8M Trinity Capital
      debt facility.
    whyItMatters: >-
      Debt covenants and senior liens directly constrain corporate liquidity, operational flexibility, and downside
      valuation outcomes.
    diligencePath: Review credit agreements and debt disclosure schedules in corporate data room during financial underwriting.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Full comprehensive register of historical executives and complete founding team equity allocations.
    whyItMatters: Assessing historical key-person retention and equity concentration across early technical architects.
    diligencePath: Inspect UK Companies House register and historical cap table schedules.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: Full liquidation preference stack and detailed percentage ownership distribution among institutional investors.
    whyItMatters: Preference seniorities determine common equity value distribution in potential M&A or public liquidity scenarios.
    diligencePath: Examine complete articles of association and preference share series certificates in the corporate data room.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som-inputs
    missingEvidence: >-
      Eligible annual procedure counts by indication and geography, system and instrument pricing, placements,
      utilization, service revenue, and an explicit inclusion methodology.
    whyItMatters: >-
      Without those denominators, adoption counts, financing, and valuation proxies cannot be converted into a credible
      TAM, SAM, SOM, revenue, or share estimate.
    diligencePath: >-
      Obtain management's bottom-up market model, audited placement and utilization data, geography-level price books,
      and third-party procedure datasets, then reconcile every assumption.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics-and-procurement
    missingEvidence: >-
      Named account budget owners, payer and reimbursement allocation, procurement cycle length, contract form,
      installation and training costs, utilization hurdle, and independently verified total cost of ownership.
    whyItMatters: >-
      These inputs determine whether modular workflow advantages convert into purchases and recurring case volume across
      hospitals and ASCs.
    diligencePath: >-
      Review a representative contract cohort and interview hospital finance, procurement, surgery, and ASC stakeholders
      using a consistent ROI template.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized system, instrument, service, training, and software terms for CMR and like-for-like competitors.
    whyItMatters: Without contract economics, total cost of ownership and price-led differentiation cannot be underwritten.
    diligencePath: Review redacted customer contracts, quotes, renewal schedules, and per-procedure cost models in the data room.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-capability
    missingEvidence: >-
      Current direct product, regulatory, pricing, and clinical documentation from Intuitive, Medtronic, and
      Distalmotion.
    whyItMatters: >-
      Aggregator descriptions cannot establish comparative feature breadth, approved indications, or clinical
      performance.
    diligencePath: >-
      Collect current official labeling, technical specifications, price schedules, and peer-reviewed comparative
      studies for each named platform.
    relatedQuestionRefs:
      - QP001
      - QP003
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Buyer-level evidence on training, implementation, integration, utilization, contract lock-in, and multi-homing.
    whyItMatters: >-
      These inputs determine whether modularity creates an economically durable wedge or only a product-level
      distinction.
    diligencePath: Interview hospital procurement, surgeons, and operating-room leaders and inspect implementation and renewal data.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      An independent denominator-based benchmark of installed systems, annual procedures, outcomes, and active
      utilization.
    whyItMatters: CMR's claimed global rank and deployment momentum cannot be independently compared without a common denominator.
    diligencePath: >-
      Obtain regulator, hospital, registry, or audited market data with platform-level definitions and consistent
      periods.
    relatedQuestionRefs:
      - QP002
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited consolidated revenue, gross profit, operating loss, cash-flow statements, and revenue-recognition
      policies.
    whyItMatters: The public revenue range cannot establish group scale, revenue quality, profitability, or cash consumption.
    diligencePath: Obtain audited consolidated accounts and monthly management reporting for 2024 through the latest available month.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Customer contracts, realized system pricing, instrument pricing, service pricing, discounts, product costs, and
      cohort-level utilization.
    whyItMatters: >-
      Without contract and cost evidence, procedure growth cannot be translated into revenue, contribution margin, or
      payback.
    diligencePath: >-
      Review the contract register, pricing approvals, product-cost ledger, and installation cohorts by geography and
      quarter.
    relatedQuestionRefs:
      - QI002
