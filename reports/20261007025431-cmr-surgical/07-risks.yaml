callouts:
  - calloutType: "risk"
    title: "Do not convert disclosure into runway"
    body: "The >$200 million financing combines equity and debt. Public sources do not disclose debt quantum, cash balance, restricted cash, burn, covenants, or maturity, so neither cash available nor runway can be calculated."
    claimRefs:
      - "CR005"
      - "CR006"
  - calloutType: "recommendation"
    title: "Evidence required before risk can be underwritten"
    body: "Obtain current regulatory records, final employment-case dispositions, security and quality-system metrics, debt documents, and U.S. deployment cohorts. A published process or an absent public incident record is not a substitute for operating evidence."
    claimRefs:
