company:
  name: "CMR Surgical"
chapter:
  number: 7
  title: "Risks"
  summary: "The strongest public risk evidence is an adverse 2025 employment judgment, a separate unresolved-at-preliminary-stage dismissal claim, a narrow initial U.S. indication, and a financing round that includes undisclosed debt terms. CMR publishes product, vulnerability-handling, and funding mitigations, but current litigation outcomes, security performance, debt covenants, and quality-system evidence remain diligence gaps rather than facts that can be inferred from public silence."
sections:
  - id: "priority-and-regulatory-exposure"
    title: "Priority, regulatory, and legal exposure"
    body: >-
      Public evidence supports a high-attention risk posture, but not a claim that every identified
      exposure is likely to crystallize. The concrete legal signal is the February 2025 employment
      judgment: the tribunal allowed limited claims of race harassment and direct discrimination and
      found that unconscious bias played at least some part in the claimant's treatment and redundancy
      scoring [CR001, CR002]. A separate October 2024 preliminary judgment did not strike out an
      automatic-unfair-dismissal claim, while striking one alleged disclosure and allowing the
      remaining theory to continue; it was not a final liability judgment [CR003, CR004]. Product
      regulation is a current commercial constraint rather than an enforcement event: company
      materials describe U.S. clearance for cholecystectomy in adults aged 22 or older, a filed
      benign-gynecology submission, and an ultrasonic dissector that is not approved for U.S. sale
      [CR007, CR008, CR009]. Investment underwriting should therefore separate adjudicated conduct,
      unresolved proceedings, and indication limitations instead of collapsing them into a single
      probability estimate.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-quality-and-security"
    title: "Operational, quality, and security controls"
    body: >-
      The available evidence shows both a control framework and unresolved control effectiveness.
      CMR says its security team normally responds to vulnerability reports within three working days,
      assesses them with internal teams, and may either remediate a vulnerability or accept it within
      risk management; patches for surgical systems use existing customer service channels
      [CR011, CR012]. Those statements describe process, not incident frequency, patch latency, or
      residual severity, and the assigned evidence does not establish that no breach or outage has
      occurred. A tribunal record also describes a historical camera-head test part worth about
      £7,000 becoming untraceable [CR014]. That isolated event is relevant to inventory and supplier-
      quality diligence, but it does not by itself prove a current systemic defect. CMR's reported
      45,000-patient, 30-country installed-use base raises the consequence of service, quality, and
      cybersecurity failures while remaining a company-issued scale claim [CR013]. Data-room review
      should test current CAPA, complaint, recall, field-service, vulnerability, and traceability
      performance rather than extrapolate from either the policy or the historical incident.
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "capital-and-dependency-risk"
    title: "Capital structure and external dependencies"
    body: >-
      The 2025 financing reduced immediate funding pressure but created a material underwriting gap:
      CMR and MassDevice both describe more than $200 million of combined equity and debt, and both
      identify Trinity Capital as a new debt investor [CR005, CR006]. Public materials do not disclose
      the debt amount, maturity, covenants, security, pricing, or change-of-control terms, so funding
      raised cannot be treated as cash available or as evidence of runway. The stated use of proceeds
      is global commercialization, especially the U.S. launch, plus product development [CR015].
      Execution also depends on hospitals and ambulatory surgery centers adopting the system, customer
      service channels distributing surgical-system patches, and customers independently sourcing
      indocyanine green where local approval permits [CR010, CR012, CR015]. These are observable
      dependency mechanisms, but counterparty concentration and contractual protections are not
      public. The central investment risk is therefore milestone mismatch: debt and expansion costs
      can become fixed before broader indications and repeatable U.S. deployment are evidenced.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR010"
      - "CR012"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "monitoring-and-thesis-breaks"
    title: "Monitoring indicators, mitigations, and thesis breaks"
    body: >-
      The risk register should be managed through measurable evidence requests rather than unsupported
      forecasts. Regulatory monitoring should track the public disposition and labeled scope of the
      benign-gynecology filing and any additional U.S. instruments or indications [CR008, CR009].
      Legal monitoring should obtain the remedy and appeal status of the Roy judgment and the final
      disposition of the Riaz proceeding [CR001, CR003]. Operational monitoring should require
      complaint, recall, CAPA, uptime, patch-latency, accepted-vulnerability, and inventory-traceability
      metrics, because neither a disclosure policy nor absence of an assigned adverse incident source
      proves control effectiveness [CR011, CR012, CR014]. Financial monitoring should reconcile cash,
      restricted cash, debt principal, maturity, covenants, and monthly cash use; the disclosed
      financing total is not a runway measure [CR005, CR006]. Thesis-break triggers are a material
      regulatory setback that blocks the planned U.S. specialty expansion, repeat quality or security
      failures without timely remediation, debt terms that constrain continued investment, or
      governance evidence showing that the adjudicated employment-control failures were not remediated.
      The qualitative hierarchy in the heatmap is an analyst synthesis, not a statistical forecast
      [CR016].
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR008"
      - "CR009"
      - "CR011"
      - "CR012"
      - "CR014"
      - "CR016"
