chapter:
  number: 5
  title: "Product & Technology"
  summary: "CMR Surgical has engineered Versius and Versius Plus as modular, software-defined laparoscopic telepresence systems designed to bypass the physical and capital footprint of monolithic surgical robots. The platform combines independent mobile bedside carts, biomimetic wristed instrumentation, and digital analytics, achieving FDA De Novo Class II marketing authorization in cholecystectomy alongside international CE mark clearance across seven surgical specialties."
sections:
  - id: "system-architecture-modular-design"
    title: "Modular Telepresence Architecture and Core Operating Hardware"
    body: "Versius deviates fundamentally from centralized multi-arm master-slave architectures by decomposing the patient-side cart into individually movable bedside units. Each system comprises an open ergonomic surgeon console, a visualization bedside unit supporting a 0-degree or 30-degree 3D high-definition endoscope, and up to three independent instrument bedside units. Each instrument arm incorporates an 11-joint kinematic chain where joints J1 through J8 govern spatial positioning and arm compliance, while joints J9 through J11 articulate fully wristed end effectors. Because bedside carts operate as mechanically decoupled stations connected via umbilical data and power cables, hospital surgical teams can position individual arms flexibly around the surgical bed to mirror conventional laparoscopic port geometry. This modularity eliminates the requirement for dedicated robotic operating theatres, allowing mobile carts to be relocated across operating rooms and shared among multi-specialty surgical services."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "software-defined-robotics-digital-ecosystem"
    title: "Software-Defined Kinematics, Telemetry, and Digital Ecosystem"
    body: "Unlike legacy robotic systems that rely primarily on rigid structural mechanics to dictate handling qualities, Versius employs a software-defined control architecture. The platform decouples kinematics from physical metal constraints, executing motion scaling, tremor filtration, collision management, and dynamic compliance across user-selected operating modes (Surgical, Compliant, Sleep, and Locked). Operational and procedure telemetry is logged at the console and synchronized with the Versius Cloud infrastructure, populating surgeon performance logbooks via the Versius Connect application and enterprise utilization metrics through the Versius Team dashboard. To extend intraoperative intelligence, CMR Surgical joined the NVIDIA IGX Thor early adopter program in late 2025 to evaluate physical AI computing capable of processing real-time telematic and video streams directly at the point of care."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE002"
  - id: "regulatory-clearance-safety-controls"
    title: "Regulatory Authorization, Clinical Safety Controls, and Technical Risks"
    body: "CMR Surgical achieved a critical regulatory milestone when the FDA granted De Novo marketing authorization (DEN230078, creating 21 CFR 878.4964, Product Code SCV) for Versius in cholecystectomy for adult patients aged 22 and older, followed by 510(k) clearance of Versius Plus incorporating vLimeLite indocyanine green fluorescence visualization. While CE mark authorization permits broad multi-specialty intervention across thoracic, colorectal, upper GI, and gynecologic surgery, U.S. clinical adoption remains legally bounded pending review of its gynecologic 510(k) submission. Bench and premarket validation established electromagnetic safety, sub-millimeter instrument accuracy, and anti-droop gravity mitigation under single-fault conditions. However, independent safety analyses underscore persistent architectural failure modes inherent in decentralized robotics, including arm-to-arm physical collisions, cable-trip hazards in compact suites, cart stability margins, and institutional learning curve friction."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
