callouts:
  - calloutType: "insight"
    title: "Software-Defined Modularity as a Capital Expenditure Breaker"
    body: "Versius's architecture demonstrates how software-defined kinematics and modular hardware directly challenge legacy surgical robotics economics. By deploying independent, collaborative robotic arms on wheels rather than a monolithic multi-ton gantry, CMR Surgical removes the need for structural operating room reconstruction and allows health systems to dynamically allocate robotic arms across multi-specialty caseloads."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
  - calloutType: "risk"
    title: "Regulatory Indication Bottleneck in the Lucrative U.S. Market"
    body: "Although Versius boasts more than 45,000 completed surgical procedures across Europe, Asia, and Latin America spanning seven surgical specialties, its commercial authorization in the United States remains strictly confined to adult cholecystectomy under FDA DEN230078. With laparoscopic cholecystectomy functioning primarily as a low-margin entry point, achieving commercial scale in U.S. health systems hinges entirely on obtaining clearances for complex benign gynecology and general surgery indications."
    claimRefs:
      - "CE003"
      - "CE009"
      - "CE010"
      - "CE013"
