callouts:
  - calloutType: "insight"
    title: "Modular Capital Model Versus Monolithic Robotics Suites"
    body: "Versius differentiates from Intuitive Surgical's da Vinci architecture by decoupling robotic arms into lightweight, mobile units that move between standard operating rooms. This modularity reduces hospital capital lock-in, enabling ASCs and NHS trusts to scale robotic utilization across general, colorectal, gynecological, and urological surgery without dedicated robotics suites."
    claimRefs:
      - "CO003"
      - "CO010"
  - calloutType: "risk"
    title: "Capital Intensity and US Execution Barrier"
    body: "Despite treating over 45,000 patients globally, CMR Surgical faces high commercial barriers entering the United States. With a narrow initial FDA indication limited to cholecystectomy, ongoing lender covenants on $68.8M of debt, and historically opaque private cash burn rates, sustainable multi-specialty expansion will require substantial continuing clinical validation and capital access."
    claimRefs:
      - "CO007"
      - "CO010"
      - "CO013"
