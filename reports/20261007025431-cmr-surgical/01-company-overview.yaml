chapter:
  number: 1
  title: "Company Overview"
  summary: "CMR Surgical is a UK-based surgical robotics unicorn founded in 2014 in Cambridge, developing the modular Versius and Versius Plus soft-tissue robotic platforms. Having secured over $1.28B to $1.32B in total financing with a 2021 post-money valuation benchmark of $3.0B, the company has treated over 45,000 patients globally across more than 30 countries and is executing its commercial debut in the United States following FDA 510(k) clearance for cholecystectomy."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Business Model"
    body: "CMR Surgical Limited, originally established in 2014 as Cambridge Medical Robotics, is a private limited medical technology company headquartered at Evolution Business Park in Cambridge, United Kingdom. The company's global manufacturing operations are centered in Ely, Cambridgeshire, which opened following a £10 million capital commitment to support scaled production of up to 500 Versius systems annually. CMR Surgical was founded by Luke Hares, Keith Marshall, Paul Roberts, Mark Slack, and Martin Frost to challenge the historic monopoly of Intuitive Surgical's da Vinci system in minimally invasive soft-tissue procedures. Its core commercial product, the Versius Surgical Robotic System—and its next-generation iteration Versius Plus—utilizes an open ergonomic console, biomimicking wristed instruments, and mobile, modular robotic arms that can be decoupled and repositioned across standard hospital operating rooms rather than remaining tethered to a dedicated surgical suite. The commercial model couples capital system placements or leasing structures with recurring instrumentation sales, accessories, digital ecosystem software, and service maintenance contracts."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO007"
      - "CO010"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance Structure, and Corporate Operations"
    body: "CMR Surgical operates under an experienced executive team led by Chief Executive Officer Massimiliano Colella, Chief Financial Officer Andre Nel, Non-Executive Chairman Dan Moore, and key regional leaders including Chris O'Hara (President & General Manager, U.S.) and Bart Wilms (General Counsel & Chief Compliance Officer). The business has navigated several leadership transitions and structural reorganizations during its commercial scale-up, including an executive shift from former CEO Per Vegard Nerseth to Massimiliano Colella, alongside an April 2023 restructuring that made approximately 350 employees redundant to align operational expenditures with commercial ramp-up milestones. Corporate operations maintain structured governance mechanisms, including a formal product vulnerability handling disclosure protocol for health systems, while navigating employment dispute proceedings such as the unfair dismissal whistleblowing litigation brought by a former Senior Risk and Regulatory Specialist before the Watford Employment Tribunal."
    claimRefs:
      - "CO005"
      - "CO008"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-commercial-scale"
    title: "Capitalization Profile, Commercial Scale, and US Expansion Milestones"
    body: "CMR Surgical has raised more than $1.28 billion across its lifetime funding rounds, achieving a $3.0 billion post-money valuation during its $600 million Series D financing in June 2021 led by Escala Capital and SoftBank Vision Fund 2. In April 2025, the company closed an additional growth financing round exceeding $200 million, comprising $131 million in Series D equity from existing sponsors including SoftBank, Lightrock, and Ally Bridge Group, alongside a $68.8 million conventional debt facility provided by Trinity Capital to fund commercialization and clinical trial pipelines. Commercial traction has expanded across more than 30 countries globally, passing 20,000 clinical procedures in March 2024, 30,000 cases by early 2025, and surpassing 45,000 patients treated globally by March 2026. Following FDA 510(k) clearance in December 2025 for cholecystectomy, CMR made its formal U.S. clinical introduction at SAGES 2026, while detailed comprehensive income, cash burn rates, and unit gross margins remain closely held private data."
    claimRefs:
      - "CO004"
      - "CO006"
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO014"
