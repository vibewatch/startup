      - CI007
      - CI008
      - CI009
      - CI010
callouts:
  - calloutType: recommendation
    title: Gate Financial Underwriting on Data-Room Access
    body: >-
      Do not convert cumulative procedures, funding raised, or product modules into revenue,
      cash, or margin estimates. Require audited accounts, customer contracts, cohort
      utilization, product-level costs, and debt terms before assigning a revenue multiple or
      concluding that the current capital base is adequate.
    claimRefs:
      - CI006
      - CI010
      - CI012
      - CI013
      - CI016
