    rows:
      - - Versius Plus system
        - System deployment
        - Not disclosed
        - Not disclosed
        - Contract register by sale, lease, placement, and geography
      - - Instruments and accessories
        - Product suite is disclosed; billing unit is not
        - Not disclosed
        - Not disclosed
        - Price, reuse limits, volume tiers, and procedure-level revenue
      - - Versius Connect and Versius Team
        - Surgeon logbook and hospital usage dashboard
        - Not disclosed
        - Standalone versus bundled treatment is not disclosed
        - Subscription, license, attach-rate, and recognized-revenue schedules
    notes: >-
      Public product pages identify components and functions but do not establish a sale,
      lease, subscription, bundle, or per-procedure charging mechanism.
    claimRefs:
      - CI008
      - CI010
      - CI013
  - id: TI003
    title: Unit Economics and Capital-Adequacy Diligence
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Required diligence evidence
    rows:
      - - Recognized revenue
        - £10M-£50M legal-entity range for 2024
        - Medium
        - Establishes only a broad historical scale
        - Audited consolidated revenue and recognition policy
      - - Gross margin
        - Not disclosed
        - Low
        - Determines whether procedure growth creates contribution
        - Product and service gross margin bridge
      - - Procedure utilization
        - More than 45,000 patients cumulatively by March 2026
        - High for the stated cumulative metric
        - Utilization drives recurring economics only if pricing is linked
        - Active systems, cases per system, and cohort utilization
      - - Cash burn and runway
        - Not disclosed
        - Low
        - Determines financing timing and dilution risk
        - Monthly cash flow, cash balance, and board-approved forecast
      - - April 2025 financing
        - More than $200M combined equity and debt
        - Medium
        - Funding raised is not cash currently available
        - Sources-and-uses schedule and remaining unrestricted cash
      - - Debt obligations
        - $68.8M conventional debt reported; terms undisclosed
        - Medium for amount; low for obligations
        - Fixed claims may constrain future financing
        - Facility agreement, covenants, maturity, security, and repayment schedule
    notes: >-
      Null public metrics are not estimated; each requires the specified data-room evidence.
      Funding raised is separated from cash available and accounting loss from cash burn.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI006
      - CI012
      - CI013
