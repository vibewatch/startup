        - id: instruments
          label: Instruments and accessories used
          detail: The product suite is public; billing unit and realized price are not.
        - id: digital-use
          label: Usage telemetry
          detail: Apps track procedural logs, case volume, and system efficiency.
        - id: financial-output
          label: Revenue and gross profit
          detail: Mix, recognition, price, cost, and margin are not publicly disclosed.
    approximationNotes: >-
      Ordered conceptual bridge only; it does not assert that any product is billed per
      procedure or that the nodes share a common period or denominator.
    claimRefs:
