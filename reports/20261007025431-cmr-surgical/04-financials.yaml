company:
  name: CMR Surgical
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence shows substantial clinical activity and fresh financing, but it does not
    establish CMR Surgical's pricing, revenue mix, gross margin, cash burn, or runway. A
    third-party revenue range of £10M-£50M for 2024 and a reported one-year decline leave the
    revenue-quality and capital-adequacy cases dependent on data-room evidence.
sections:
  - id: revenue-and-traction
    title: Revenue Evidence and Commercial Traction
    body: >-
      The strongest public financial datapoint is not an audited figure supplied by CMR:
      Tracxn reports that Cmr Surgical Limited generated between £10M and £50M in revenue
      for the year ended 31 December 2024, and separately reports a negative 28% one-year
      revenue CAGR [CI001, CI002]. That range is too wide to support a precise revenue
      multiple, and it should not be treated as ARR. Commercial activity is clearer than
      revenue quality. CMR said more than 45,000 patients had been treated with Versius by
      March 2026, while describing deployments across more than 30 countries and multiple
      specialties [CI006, CI007]. Those cumulative case and geographic metrics demonstrate
      use, but neither metric supplies current-period procedure volume, installed-base
      utilization, customer count, recognized revenue, or recurring-revenue mix.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
    tableRefs:
      - TI001
  - id: monetization-and-gtm
    title: Monetization, Pricing, and GTM Economics
    body: >-
      CMR's public product surface identifies the Versius Plus system, instruments,
      visualization components, and two digital applications, but it does not say whether
      each component is sold, leased, licensed, bundled, or charged per procedure [CI008,
      CI010]. The modular system can move between operating rooms without a dedicated room,
      which could broaden deployment settings, yet no public evidence quantifies sales
      cycle, implementation expense, channel share, customer acquisition cost, discounting,
      or payback [CI009, CI013]. EquityZen describes a route for eligible shareholders to
      sell private shares, but its fetched company page contains no observed CMR transaction
      price; this is a liquidity channel, not evidence of operating revenue or current
      valuation [CI011]. Realized contracts and customer-level economics are therefore
      required before underwriting pricing power.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI013
    tableRefs:
      - TI002
    figureRefs:
      - FI001
  - id: costs-and-capital
    title: Cost Structure and Capital Adequacy
    body: >-
      The April 2025 financing is evidence of available external capital at that date, not
      cash remaining today. CMR announced more than $200M of combined equity and debt for
      global commercialization, a U.S. launch, and continued product development [CI003,
      CI005]. Tracxn itemizes the same date as $131M of Series D equity and $68.8M of
      conventional debt, but the reviewed sources do not disclose cash on hand, monthly
      burn, runway, debt maturity, covenants, interest, security, or repayment schedule
      [CI004, CI012]. Public materials also omit hardware and instrument gross margins,
      manufacturing costs, warranty expense, field-service economics, working capital,
      capex, CAC, and payback [CI013]. CMR does describe service arrangements for
      distributing system patches, confirming an operating service obligation without
      quantifying its cost or revenue contribution [CI014].
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: financial-verdict
    title: Financial Verdict and Underwriting Blockers
    body: >-
      The financial case is not presently underwritable from public evidence. Clinical use
      and a funded U.S. expansion provide demand and investor-support signals, but they do
      not establish recognized revenue quality, contribution margin, operating leverage, or
      sufficient runway [CI003, CI006, CI016]. The reported revenue decline increases the
      need to reconcile legal-entity accounts with group reporting and to distinguish system
      placements from recurring procedure-linked revenue [CI002]. Adverse diligence should
      also include contingent legal and people costs: a 2024 Employment Tribunal ruling did
      not strike out an automatic unfair-dismissal claim against CMR, while making no final
      merits determination [CI015]. Investment approval should therefore require audited
      consolidated accounts, contract cohorts, product-level margins, cash and debt schedules,
      and a fully funded operating plan.
    claimRefs:
      - CI002
      - CI003
      - CI006
      - CI015
      - CI016
