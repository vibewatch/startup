callouts:
  - calloutType: "insight"
    title: "Modular Capital Model Lowers Adoption Friction for Non-Dedicated Suites"
    body: "Versius resets hospital purchasing expectations by offering modular, mobile bedside robotic arms rather than a monolithic, immovable console. This architecture allows community hospitals, NHS trusts, and ambulatory surgery centers to share robotic assets across multiple operating rooms without multimillion-dollar structural renovations, lowering initial capital barriers and accelerating adoption in cost-sensitive healthcare systems."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
  - calloutType: "risk"
    title: "The Installed-Base Utilization Trap in Surgical Robotics"
    body: "For surgical robotics manufacturers, placement growth can obscure persistent underutilization. If hospital accounts fail to broaden usage beyond a single champion surgeon into high-frequency weekly scheduling across multiple specialties, per-system case economics deteriorate. Underutilized units increase servicing costs and elevate renewal risk when capital maintenance contracts expire."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
