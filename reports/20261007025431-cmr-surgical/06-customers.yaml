chapter:
  number: 6
  title: "Customers"
  summary: "CMR Surgical has scaled clinical adoption of its modular Versius surgical robotic system to more than 45,000 patients treated globally across more than 30 countries. While its portable architecture facilitates deployment across NHS trusts, European academic centers, and ambulatory surgery centers without dedicated robotics suites, commercial expansion faces operational utilization hurdles and unverified enterprise retention metrics as it executes its U.S. launch following FDA 510(k) clearance."
sections:
  - id: "customer-segmentation-and-purchasing-dynamics"
    title: "Customer Base Segmentation and Healthcare Purchasing Models"
    body: "CMR Surgical targets acute-care hospital networks, national healthcare services, regional hospital trusts, and ambulatory surgery centers (ASCs) that seek the clinical precision of robotic minimal access surgery without the prohibitive capital expenditure and fixed footprint of traditional monolithic systems. In public-payer healthcare architectures, such as the UK National Health Service (NHS) and European state systems, procurement decision-makers evaluate the Versius platform on total cost of care, instrument versatility, and operating theater throughput. In private hospital groups and outpatient surgical centers, commercial buyers prioritize rapid turnover between cases and modular portability across multi-departmental suites. However, health system procurement involves prolonged committee evaluation, stringent capital approval thresholds, and detailed reimbursement code reviews, meaning sales cycles routinely extend from 9 to 18 months."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "clinical-adoption-and-procedure-velocity"
    title: "Clinical Adoption Trajectory and Surgical Procedure Velocity"
    body: "The commercial adoption trajectory of the Versius platform has demonstrated accelerating cumulative patient volume over consecutive operating years. CMR Surgical documented crossing 30,000 completed surgical procedures across more than 30 countries by early 2025, expanding to over 45,000 patients treated globally by March 2026. This procedure volume positions CMR Surgical as the second most utilized soft-tissue robotic surgery platform worldwide behind market incumbent Intuitive Surgical. Clinical adoption spans five core disciplines: general surgery, colorectal surgery, urology, gynecology, and thoracic surgery. Growth has been reinforced by international regulatory authorizations and the December 2025 U.S. FDA 510(k) clearance for adult cholecystectomy, which enabled CMR to make its formal commercial introduction to American surgeons at SAGES 2026 in Tampa, Florida."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "institutional-reference-proof-and-clinical-partnerships"
    title: "Institutional Customer Evidence and Training Partnerships"
    body: "Institutional adoption is anchored by prominent clinical centers, academic hospital trusts, and specialized robotic surgery training academies. A foundational institutional partner is Orsi Academy in Melle, Belgium, a world-renowned European training center that partners with CMR Surgical to educate surgeons on robotic minimal access techniques. In the United States, academic clinical evaluators including Dr. Francesco Bianco at the University of Illinois Chicago have publicly assessed the platform's multi-specialty clinical data and real-world performance as CMR prepares its commercial rollout. Furthermore, CMR has partnered with forward-thinking hospitals across Europe, the Middle East, and Latin America, embedding Versius into routine soft-tissue surgical programs while simultaneously sponsoring multicenter prospective clinical trials in pediatric surgery and transoral robotic surgery (TORS) to expand customer indications."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "utilization-headwinds-and-retention-uncertainty"
    title: "Operational Utilization Headwinds and Account Durability"
    body: "Despite robust headline growth in cumulative patient treatments, independent industry analysis indicates that CMR Surgical faces an installed-base utilization challenge where physical placements expand faster than per-system procedure velocity. Critical medtech operational indicators—such as routine procedures per system, cross-specialty procedure mix, and multi-surgeon department penetration—reveal that some hospital accounts risk underutilization after initial champion surgeon adoption. Underutilized robotic units represent an operational drag on hospital capital budgets and CMR service specialists. Moreover, because CMR is a private medical technology firm, detailed customer retention indicators including Net Revenue Retention (NRR), Gross Revenue Retention (GRR), exact annual account churn, instrument re-order rates, and hospital customer concentration are not publicly reported, necessitating direct access to confidential commercial contract registers for institutional underwriting."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
