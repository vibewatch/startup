  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: footprint-consistency
    missingEvidence: A management-certified country, city, office, and home-market breakdown as of the run date.
    whyItMatters: Current public materials disagree on how many markets and cities Yassir actually serves, which affects scale comparisons and later market-share work.
    diligencePath: Request the current internal footprint dashboard or the latest investor update used for board reporting.
    relatedQuestionRefs:
    - QO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and post-Series-C cap table.
    whyItMatters: Founder concentration and investor control cannot be judged properly without formal governance documents.
    diligencePath: Ask management for the latest cap table, board observer agreements, and governance chart under NDA.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: series-c
    missingEvidence: Primary documentation for the 2025 Series C, including round size, price per share, valuation, and investor identities.
    whyItMatters: The current public evidence for unicorn status relies on tracker data and secondary references rather than on a public company filing or release.
    diligencePath: Request signed financing documents or an investor letter confirming the 2025 round terms.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO004
  - type: stale
    severity: minor
    topic: current-counters
    missingEvidence: A reconciled 2026 operating-metrics pack that explains how downloads, users, partners, employees, and cities are defined across surfaces.
    whyItMatters: Yassir’s growth story is strong, but inconsistent metric definitions reduce confidence in benchmarking and in cover-fact precision.
    diligencePath: Obtain the latest internal KPI definitions sheet and monthly operating dashboard from finance or strategy.
