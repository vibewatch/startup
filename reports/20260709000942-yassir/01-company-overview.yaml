- id: product-payments-and-operating-expansion
  title: Product breadth, payments infrastructure, and operating expansion
  body: 'Yassir''s expansion logic is visible in how the company links mobility, commerce, and payments. Official pages describe a ride-hailing base with verified drivers, geolocated rides, and upfront pricing, then layer food delivery, grocery delivery, B2B ride management, procurement, parcel delivery, and Yassir Cash on top. The Yassir Cash page is especially important because it shows that the company''s fintech ambition is not abstract: users can top up by bank card or agent, spend balances in-app, and refund through a physical agent network, while would-be agents must meet business and tax-registration requirements. The Morocco licensing story fits that pattern, as Launch Base Africa reports that Yassir applied in January 2024 for payment-institution authorisation with Bank Al-Maghrib and assembled a locally credible board around the process. This is not just a product adjacency; it is the company''s stated way of turning a trusted consumer marketplace into a broader financial-services
    and merchant-services platform. The B2B pages reinforce that point by showing Yassir selling logistics, office mobility, and procurement rather than relying solely on consumer transactions.'
