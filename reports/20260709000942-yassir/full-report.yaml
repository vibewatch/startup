      - number: '1.4'
        title: Milestones now include acquisitions, international branding, and compliance pressure
        blocks:
          - type: paragraph
            body: >-
              Yassir's current profile is shaped less by a single market launch and more by a sequence of milestone
              events that broaden category coverage while raising execution demands. The 2023 PSG partnership shows
              management using sports marketing to internationalise the brand. The 2023 Flink France takeover, where
              Eurofound and Goodwin say Yassir put more than €5 million into a rescue that kept 270 of 480 jobs, shows
              willingness to use distressed-asset deals to enter or reinforce foreign markets. In 2024, Yassir bought
              Tunisian delivery app KooL and pursued a Moroccan payment licence. In 2026, it acquired Kawarizmi to add
              retail-media and adtech capabilities, then moved into physical grocery retail by buying Uno and planning
              to rebrand the chain as Yassir Market with click-and-collect, kiosks, and Yassir Cash at checkout. These
              are ambitious moves that push the company far beyond ride-hailing. The counterweight is operational and
              regulatory risk. Tech in Africa reports that Senegal's data-protection regulator warned Yassir on local
              compliance, and Yassir's own public footprint metrics remain noisy enough that investors should still
              request primary cap-table, organisation, and post-Series-C documentation before underwriting the business
              as a clean unicorn story.
