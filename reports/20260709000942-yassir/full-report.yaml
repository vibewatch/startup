      - number: '2.2'
        title: 'Evidence-constrained sizing: large digital top-of-funnel, much smaller monetizable demand'
        blocks:
          - type: paragraph
            body: >-
              Algeria’s population and connectivity data support a large theoretical funnel, but the monetizable layers
              narrow quickly. World Bank APIs put Algeria’s 2025 population at 47.4 million and urbanization at 75.8%,
              implying roughly 36.0 million urban residents. DataReportal says there were 37.8 million internet users
              and 55.6 million mobile connections by late 2025, while the World Bank’s own internet-use series shows the
              country at 77.4% internet penetration in 2024. If one multiplies 2025 population by urban share and
              end-2025 internet penetration, the immediately relevant pool of connected urban residents is about 28.6
              million. But that is still only a top-of-funnel access number. Trade.gov says just 8.2% of the population
              made purchases online or by phone in 2023 and only 4.7% sent money digitally. World Bank data shows
              account ownership among adults fell to 35.3% in 2024, while Trade.gov says only 2.8% of the population
              held a credit card and 22.9% held a debit card. UNCTAD adds that around 90% of online transactions are
              still cash on delivery and B2C e-commerce equaled only 0.8% of GDP in 2023. So the market is
              unquestionably large in demographic terms, but much smaller in current transaction-readiness terms.
