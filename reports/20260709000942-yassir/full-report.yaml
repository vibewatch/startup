      - number: '2.4'
        title: Growth drivers, market constraints, and adoption timing
        blocks:
          - type: paragraph
            body: >-
              The biggest driver of Yassir’s market is not that Algeria is already fully digital; it is that digital
              access is outrunning digital transaction behavior. Connectivity, urbanization, merchant digitization, and
              startup-policy support are all moving in the right direction. UNCTAD documents 92% annual growth in
              registered e-commerce businesses since 2020, a tripling of online payment transactions between 2020 and
              2024, and mobile broadband coverage above 98% of the population. Trade.gov adds that Algeria now has more
              than 2,000 certified startups, with fintech representing 7% of them. But the constraints are just as
              structural. Trade.gov describes a restrictive and slow-moving digital regulatory regime, while DZWatch
              reports a pending law that could reshape how app-based transport is licensed and supervised. UNCTAD says
              last-mile delivery still needs formalization, and data localization raises compliance costs for any scaled
              payments or consumer-data business. In practice, this means Yassir’s market should expand, but not as a
              frictionless internet-consumer story. The adoption clock will be set by regulatory clarity, wallet
              penetration, merchant onboarding economics, and the company’s ability to maintain dense local supply while
              staying operationally compliant.
