            body: >-
              Public surfaces show that Yassir should be analyzed as a customer ecosystem, not a single B2C app. The
              consumer app bundles ride-hailing, food delivery, grocery or market orders, and payments in one interface.
              On the other side of the marketplace, drivers and couriers are not just supply; they are active users of
              separate partner products with onboarding, training, analytics, and payout workflows. Restaurants and
              stores get dashboards, order management, promotions, and onboarding support. A fifth segment sits on top
              of this stack: business administrators who use Yassir Business for employee transport, office meals,
              procurement, parcel delivery, and gift cards. This breadth matters because it creates cross-sell and
              retention opportunities, but it also means customer quality must be judged across several cohorts with
              different economics and expectations. A rider can be satisfied even when a driver is not; a merchant can
              be retained even if consumer complaint volume rises; an enterprise account can expand even when public
