      - number: '1.2'
        title: Founders, capital stack, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The strongest externally corroborated pieces of Yassir's capital history are its 2021 Series A and 2022
              Series B. TechCrunch and Wamda report that Yassir raised $30 million in Series A in late 2021 after an
              earlier seed round, with WndrCo, DN Capital, Kismet Capital, Spike Ventures, and Quiet Capital among the
              lead backers. One year later, TechCrunch, Wamda, TechCabal, and Yassir's own announcement all reported a
              $150 million Series B led by BOND, taking disclosed funding to $193.25 million and establishing Yassir as
              North Africa's most valuable startup by the company's own framing. That sounds straightforward until one
              reads the current about page, which still says the 2022 round was $130 million. The same public estate
              also varies between older claims of 6 million users and 130,000 partners, newer counters of 8 million-plus
              downloads and 100,000-plus partners, and secondary-market data that implies a later 2025 Series C at a
              $1.43 billion post-money valuation. None of that invalidates the core growth story, but it does mean later
              chapters should prefer directly corroborated financing events and treat unsourced vanity metrics or
              private-market tracker fields as medium-confidence rather than as audited fact.
