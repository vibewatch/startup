  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive field is layered, not singular
        blocks:
          - type: paragraph
            body: >-
              Yassir’s competitive set has to be segmented by job-to-be-done rather than treated as a single ‘African
              super-app’ market. The company’s own public surfaces present a combined stack of ride-hailing, restaurant
              ordering, store fulfilment, wallet payments, and employer transport controls. That means the closest
              direct Algeria mobility pressure comes from apps that clearly advertise Algeria ride service today — most
              notably Heetch and inDrive — while the broader strategic pressure comes from platforms that are stronger
              in delivery, logistics, or super-app breadth across other geographies. Heetch positions itself as a
              city-by-city urban mobility option across multiple Algerian cities and emphasizes compatibility with taxis
              and public transport. inDrive differentiates around negotiated pricing and low commissions. Meanwhile
              Glovo, Bolt, Careem, and Uber matter because they show what deeper capital pools, larger merchant
              ecosystems, or broader service stacks can look like if they localize effectively. The right conclusion is
              not that every rival is equally present in Algeria today; it is that Yassir sits at the intersection of
              narrow local specialists and much larger regional or global benchmark competitors.
