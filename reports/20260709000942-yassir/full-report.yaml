  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model breadth is visible even when exact pricing is not
        blocks:
          - type: paragraph
            body: >-
              Yassir’s public materials make the overall revenue architecture much easier to see than the exact unit
              economics. TechCrunch’s 2021 Series A coverage says the company generates revenue by taking a commission
              on the services it offers. That broad statement is reinforced by current official Yassir pages for
              restaurants, stores, business transport, wallet payments, drivers, and couriers. Taken together, those
              pages imply at least six monetization surfaces: ride commissions, food-delivery take rates, grocery or
              store commissions, payment or wallet fees, enterprise transport budgets, and adjacent commerce or
              merchant-service revenues. The company’s payments layer is particularly important because it appears
              designed not just to process transactions but to move a cash-heavy user base into higher-frequency in-app
              settlement. What is missing is the exact realized pricing: public materials do not disclose merchant
              commission schedules, effective driver or courier commission rates, wallet fee ladders, refund costs, or
              enterprise contract structures. So the chapter can identify the revenue streams with confidence, but not
              yet the realized revenue mix or quality within each stream.
