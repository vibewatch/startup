  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline valuation and what is actually proven
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to confirm that Yassir is not a paper unicorn. The company built real
              product breadth, scaled to millions of users, crossed multiple countries, and attracted large
              institutional backers. The 2025 financing event also appears real enough to use as a market signal: Forge
              records a roughly $1.43 billion post-money valuation, while ALGERIATECH describes an internal Series C of
              about $105 million. That combination matters because it shows insiders or secondary-market observers were
              still willing to underwrite the story after the easy-money cycle ended. What it does not do is solve the
              denominator problem. Public materials still do not give audited revenue, gross margin, cash burn, cohort
              retention, or round terms. The most discoverable revenue datapoint remains a third-party estimate of about
              $225.9 million for 2024, which makes the last mark look expensive enough that investors should treat it as
              a price to test, not a price to accept.
            claimRefs:
              - CV001
