      - number: '8.3'
        title: Scenario view, recommendation, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The bull case is easy to articulate but still missing proof. If the retained revenue estimate materially
              understates 2025 or 2026 run-rate, if Yassir Pay becomes a real payment layer rather than a wallet
              feature, and if new retail-media or physical-retail adjacencies lift revenue quality, then the current
              unicorn mark can be defended as an early claim on a broader North-African platform. The base case is more
              restrained: the company is real, growth likely continues, but public evidence still points to a platform
              that deserves a consumer-internet corridor rather than a premium software one. The bear case is not that
              Yassir is fake; it is that execution, regulation, or customer quality keep the business looking more like
              a volatile logistics marketplace than a compounding fintech platform. That is why the recommendation here
              is research more with medium confidence and strict entry discipline.
