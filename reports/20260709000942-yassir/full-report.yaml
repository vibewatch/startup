          detail: Forge and other sources point to a ~$1.43B 2025-era mark
        - id: gap
          label: Rich Implied Multiple
          detail: About 6.3x trailing sales on retained revenue estimate
        - id: opacity
          label: Disclosure Gap
          detail: No audited revenue quality, burn, or cap-table detail in public view
        - id: decision
