  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product suite spans consumer, merchant, partner, and payment workflows
        blocks:
          - type: paragraph
            body: >-
              Yassir’s public surfaces support a broad, modular product map. The rider app combines ride-hailing, food
              ordering, grocery or store shopping, and payments in one interface. Merchant modules expose dashboards,
              promotions, inventory, and order management. Business users get ride programs, employee grouping, and
              budget controls. Supply-side partners interact through driver and courier onboarding workflows that
              require vehicles, documents, safety guidance, and partner-app use. Yassir Cash adds a payment rail that
              supports rides, meals, shopping, top-ups, and refunds through both bank cards and agents. The important
              analytical point is that Yassir does not deliver one monolithic feature. It coordinates multiple user
              jobs: move, order, fulfil, pay, earn, and administer. That makes the product more defensible
              operationally, but it also makes the underlying system more complex than a simple ride app or delivery
              marketplace. Every added module creates additional workflow dependencies, support needs, and failure
              points.
