      - number: '8.2'
        title: Public comparables and the multiple corridor
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame Yassir is not as a one-to-one peer of any single listed company, but as a
              North-African super-app that sits somewhere between delivery marketplaces, regional consumer platforms,
              and an early payments ecosystem. DoorDash shows what a category leader with improving profitability can
              command. Grab shows a broader super-app with stronger balance-sheet liquidity but a lower multiple.
              Delivery Hero shows that fast growth and multi-vertical ambition do not stop the market from assigning a
              compressed multiple when geography mix and execution complexity stay high. Jumia is not a product twin,
              but it does matter as a public African platform reference because it proves investors will still pay
              growth multiples for regional consumer internet assets while heavily discounting opaque or lower-quality
              economics. Against those references, Yassir’s implied 6.3x trailing-sales mark screens rich rather than
              obviously absurd. Another useful consequence of this peer set is discipline around what not to do. Because
              Yassir mixes mobility, delivery, wallet, and merchant tooling, an investor can always find one optimistic
              analog. The safer approach is to demand that any premium argument be matched by premium disclosure, proven
              repeat behavior, and visible margin progress rather than by optionality language alone.
            claimRefs:
