  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory uncertainty and cross-border data compliance are the most visible external risk cluster
        blocks:
          - type: paragraph
            body: >-
              Yassir now operates in a part of the stack where several legal regimes are moving at once. Algeria is
              formalizing ride-hailing through a draft law that would recognize app-based transport under a clearer
              framework, but the fact that legislation is still being pushed through government confirms that a core
              part of Yassir’s original business has operated in ambiguity. Morocco is even less settled: public
              statements say app-based transport still lacks a clear framework, while the transport minister separately
              says operating without proper authorization is illegal. In Senegal, taxi unions have already pressed their
              case against Yassir and peers in court, and the data-protection regulator has publicly warned Yassir to
              comply with local privacy rules. Those transport and privacy risks sit on top of a broader compliance
              burden. Algeria’s amended Law 18-07 adds DPO, recordkeeping, DPIA, breach-notification, and authorization
              obligations; Morocco’s Law 09-08 and CNDP regime add filing, transfer, and sanctions exposure. For a
              company that collects location, payments, ride history, and merchant data across several countries while
              adding adtech and fintech layers, compliance risk is not peripheral — it is central to whether the
              platform can keep scaling without interruption.
            claimRefs:
              - CR001
