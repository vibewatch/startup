              Yassir’s strongest public trust signals come from policy and workflow controls rather than from externally
              validated technical artifacts. The privacy policy explicitly names local legal entities, addresses,
              privacy laws, and user-data categories across Algeria, Morocco, Tunisia, South Africa, Senegal, France,
              and Canada. It also explains location-data use, ride-data collection, and account-profile information.
              Operationally, the company adds vehicle checks, partner background review, safety guidance, a wallet PIN,
              agent-based top-ups and refunds, and country-specific support channels. These are meaningful signals that
              trust and compliance are being designed at the operating-model level. But the retained public evidence
              does not show a public status page, security whitepaper, formal security certification, external audit
              summary, or incident history repository. That does not mean such controls do not exist internally; it
              means outside investors cannot independently inspect them from current public surfaces. For a platform
