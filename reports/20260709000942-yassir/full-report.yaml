  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the substitutes Yassir is actually displacing
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for Yassir is not generic “African super-app TAM.” It is app-mediated daily
              urban spend across short-distance transport, restaurant delivery, grocery and store fulfilment, embedded
              payments, and employer-managed local mobility. Official Yassir pages make that multisided structure
              explicit: the company separately recruits riders, couriers, restaurants, stores, cash agents, and business
              transport managers. That means the company competes not just against rival apps, but against status-quo
              substitutes such as street taxis, private-car rides, direct phone ordering, cash settlement, and
              internally arranged employee transport. The buyer and payer vary by segment. A passenger often pays
              directly, a restaurant owner pays through take-rate economics, and a fleet manager controls employer
              transport budgets. This matters because each layer has a different adoption trigger and friction profile.
              Grocery and food delivery depend on merchant density and last-mile reliability. Ride-hailing depends on
              local supply liquidity and regulatory permission. Payments depend on trust and top-up infrastructure in a
              market where card usage remains low. The result is a market that is structurally broader than mobility but
              still fundamentally urban, local, and operations-heavy.
            claimRefs:
