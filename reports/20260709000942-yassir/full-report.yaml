              The strongest public traction markers are still operational rather than financial. TechCrunch, Wamda,
              TechCabal, and Yassir’s own 2022 announcement all converge on a $150 million Series B, roughly $193.25
              million of disclosed cumulative funding, and a footprint of 45 cities across six countries with more than
              8 million users and more than 100,000 partners by late 2022. TechCrunch’s 2021 Series A report puts the
