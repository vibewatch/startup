companyProfile:
  summary: >-
    Yassir is a private Algeria-born consumer platform that started in ride-hailing and expanded into food delivery,
    groceries, merchant tools, business transport, and wallet-style payments. Public evidence supports real
    multi-country operating breadth, a credible founder story, and enough product depth to justify comparing the company
    with delivery marketplaces and regional super-apps rather than with a single-line startup. The same record also
    shows that disclosure depth still looks private-company light relative to the public peers investors would naturally
    use to price the asset.
