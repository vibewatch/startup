      - number: '2.3'
        title: Buyer, user, payer, and supply-side segmentation
        blocks:
          - type: paragraph
            body: >-
              Yassir’s buyer map is unusually varied for a company still rooted in North African daily services. The
              consumer-rider segment wants speed, price visibility, and safety. Restaurant partners want order flow,
              promotions, and simple dashboards. Store sellers want inventory visibility and order management. Employers
              or fleet managers want budget controls, employee grouping, and predictable transport programs. On the
              supply side, drivers and couriers are not just “users” of a supply app; they are income-seeking
              micro-entrepreneurs or secondary earners responding to labor-market pressure. Yassir’s own pages highlight
              students, employees, retirees, and self-employed workers, while courier onboarding explicitly requires a
              scooter or motorbike, insurance, and a smartphone. That means labor availability is tied to device
              ownership, vehicle access, and flexible-income appeal rather than to formal workforce planning. Payments
              add another segmentation layer: Yassir Cash users and agents are a bridge between cash-heavy offline
              behavior and digital wallet usage. The chapter’s key analytical point is that Yassir does not serve one
              homogeneous app user. It stitches together households, merchants, informal-to-semi-formal workers, and
              business administrators whose incentives align only when local density and trust are high enough.
