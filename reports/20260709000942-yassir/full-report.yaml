      - number: '4.3'
        title: Marketplace comps imply heavy participant and service-delivery costs
        blocks:
          - type: paragraph
            body: >-
              Because Yassir is private, public-company and sector proxies matter. Uber’s 2024 10-K is especially
              useful: it shows huge gross bookings and revenue scale, but also details how driver incentives, courier
              incentives, insurance, network costs, credit-card processing, advertising, and headcount all compress
              segment profitability. Jumia provides the other side of the picture in Africa. Its filing materials show a
              marketplace-plus-logistics-plus-payments stack, while management’s explanation of the food-delivery exit
              shows how quickly that model can become unattractive when competitive intensity, voucher-led growth, and
              operational complexity outrun the economics. Yassir’s own driver, courier, and wallet pages make it hard
              to imagine a software-like margin profile: onboarding, background checks, partner support, payment
              settlement, agent networks, refunds, and potentially retail fulfilment all carry direct operating costs.
              The company may still have strong long-run economics if cross-category density drives better utilization
              and lower acquisition cost, but that cannot be verified publicly. The prudent assumption is not ‘high SaaS
              margin’ but ‘marketplace margin path that depends on local density, subsidy discipline, and payments
              attach.’
