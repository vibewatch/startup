chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and the super-app scope
        blocks:
          - type: paragraph
            body: >-
              Yassir's public identity is grounded in a familiar founder-return story but backed by a widening legal and
              geographic footprint. The official about page says Noureddine Tayebi conceived Yassir in Palo Alto in 2017
              to solve daily mobility pain points for Algerians, and external coverage consistently identifies Tayebi
              and El Mahdi Yettou as founders. The business has since moved well beyond the original ride-hailing wedge.
              Official product pages and the Google Play listing show a multi-surface consumer stack spanning
              ride-hailing, food delivery, grocery delivery, Yassir Cash, and B2B mobility or procurement tools. The
              privacy policy is unusually useful for a private African startup because it names the Algerian entity as
              EURL Yassir and lists local operating or mailing footprints in Morocco, Tunisia, France, South Africa, and
              Senegal. Even so, the public-country count is not perfectly stable. Different official and semi-official
              surfaces alternately describe six countries, seven countries, eight home markets, 45 cities, 50-plus
              cities, or 58 cities. The right underwriting takeaway is that Yassir has clearly moved beyond Algeria and
              the Maghreb core, but precise current footprint counts remain a diligence item rather than clean ground
              truth.
