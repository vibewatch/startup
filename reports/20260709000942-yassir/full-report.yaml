              condition, courier issues, and drivers trying to renegotiate displayed prices. The signal gets more
              interesting when the driver side is added: the iPhone driver app rating is materially weaker than the
              rider app rating, suggesting that supply-side experience may be more strained than consumer top-line
              sentiment implies. What is missing is the metric set that would actually resolve the debate: repeat-order
              rates, frequency cohorts, churn, NRR, GRR, cancellation rates, failed-delivery rates, refund SLAs, and
              complaint-resolution times. Without those, public ratings are directionally useful but not enough to prove
              durable customer love.
