    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from real operating proof through a rich implied multiple and a disclosure gap to a
      research-more conclusion.
    data:
      nodes:
        - id: scale
          label: Real Platform Proof
          detail: Users, partners, wallet, stores, and drivers all have public evidence
        - id: round
