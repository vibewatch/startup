      - number: '7.4'
        title: Execution risk rises with geography, category count, and acquisition-led expansion
        blocks:
          - type: paragraph
            body: >-
              Yassir is asking management to execute several difficult transitions at once: formalize a once-grey
              transport business, obtain or maintain fintech permissions, integrate a retail chain, absorb an adtech
              acquisition, preserve partner liquidity, and keep support quality from decaying as categories multiply.
              Founder and CEO Noureddine Tayebi remains central to the company’s architecture, strategy, and external
              narrative, which is positive for vision clarity but negative for key-person concentration. The
              organization also needs country-level legal, regulatory, compliance, security, and operations muscle that
              is not visible in public detail. Acquisition-led expansion compounds that problem. KooL, Uno, and
              Kawarizmi are strategically coherent, yet each creates separate integration, culture, governance, and
              reporting burdens. The practical investment question is not whether Yassir has ambition; it clearly does.
              The question is whether it can absorb more regulation and complexity faster than service quality,
              governance, or capital efficiency deteriorate. The clearest thesis-break signals would be a punitive
              Algerian law or slow adoption of the new framework, Moroccan enforcement hardening before legalization, a
              meaningful privacy or cloud incident, persistent support deterioration, or evidence that Uno and Kawarizmi
              are adding complexity faster than value.
