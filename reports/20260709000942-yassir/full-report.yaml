      - number: '4.4'
        title: Capital support is visible; capital adequacy is not
        blocks:
          - type: paragraph
            body: >-
              Funding history shows Yassir has been able to raise meaningful capital, and management has consistently
              framed that capital as fuel for product expansion, engineering build-out, and geographic growth. Series A
              and Series B proceeds were described as support for new products, new services, larger engineering teams,
              and expansion across Africa and adjacent regions. Subsequent strategic moves such as deeper fintech
              rollout and the Uno retail-chain acquisition indicate that Yassir is broadening into businesses that can
              increase capital intensity rather than reduce it. Retail-linked fulfilment, wallet operations, and any
              expansion-by-acquisition strategy all likely increase the need for working capital, compliance spend, and
              execution depth. Yet the core underwriting data remains absent: no current public cash balance, monthly
              burn, runway, debt schedule, or covenant structure appears in retained materials. That means the business
              can be judged as promising but not fully financeable from public evidence alone. The financial verdict is
              therefore cautiously positive on revenue optionality and ecosystem scope, but negative on
              underwrite-ability until management provides current GMV, realized take rates, contribution margins, cash,
