  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Why it matters
      - Observable warning sign
      - Action implication
    rows:
      - - Revenue proof disappoints
        - A premium private mark needs current revenue well above the retained 2024 estimate.
        - Management cannot show 2025 or 2026 revenue bridge that supports the current price.
        - Re-rate toward the low end of the base case or bear case.
      - - Payments expansion stalls
        - A large part of the upside case rests on wallet and licensing progression.
        - No meaningful wallet adoption metrics or licensing progress in Algeria or Morocco.
        - Treat the fintech upside as unproven and cut multiple expectations.
      - - Customer quality worsens
        - Repeat behavior is only valuable if rider, merchant, and driver satisfaction stay intact.
        - Trustpilot complaints, driver frustration, or refund disputes keep rising without counter-metrics.
        - Apply a sharper discount to growth durability.
      - - Regulation tightens
        - Ride-hailing or data-privacy enforcement can raise costs and slow multi-country scaling.
        - Draft rules harden, regulator warnings escalate, or licensing timelines slip.
        - Add policy discount and slow underwriting pace.
      - - Round terms are investor-unfriendly
        - A headline price can look fine while preferences or secondary mix weaken actual economics.
        - Cap-table math still cannot be reconciled after diligence.
        - Walk away from price-sensitive entry even if the business remains interesting.
    notes: >-
      These are the few triggers most likely to move Yassir from an interesting company at a debatable price to an
      unattractive investment at that price.
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV043
      - CV044
