      - number: '3.4'
        title: Adverse evidence suggests execution and compliance matter more than category novelty
        blocks:
          - type: paragraph
            body: >-
              The harshest evidence in this chapter is not a rival bragging about growth; it is the repeated pattern
              that delivery and ride-hailing can remain economically brutal even for scaled operators. Jumia’s exit from
              food delivery in Algeria and six other African markets shows that neither brand recognition nor
              continental footprint guarantees durable returns. Jumia’s CEO explicitly described low barriers to entry,
              aggressive discounting, and deep-pocketed rivals. Rest of World’s reporting on inDrive drivers and African
              gig-driver unions points to another structural risk: lower commissions or more ‘flexible’ pricing do not
              automatically translate into stable worker economics, and weak regulation can become a source of supply
              dissatisfaction rather than a moat. That leaves Yassir with a very specific durability test. If it can
              keep local supply density, merchant tooling, cash-to-wallet conversion, and regulatory readiness ahead of
              rivals, its local operating system can matter. If not, the business is exposed to the same subsidy cycles,
              multi-homing behavior, and compliance shocks that have already broken or weakened other platforms across
              Africa and MENA.
