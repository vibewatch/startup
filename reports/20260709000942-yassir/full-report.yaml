      - number: '6.4'
        title: Cross-sell potential looks meaningful, but concentration and durability remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The customer upside case is intuitive. A user can start with rides, add food, graduate into grocery
              orders, use Yassir Cash, and eventually become a repeat household customer. A company can start with
              employee mobility and expand into meals, procurement, parcels, and vouchers. Merchants can move from
              simple demand capture into deeper operational dependence if order volume and tooling become material. That
              is the theoretical super-app retention engine. The problem is that almost none of the hard concentration
              or durability denominators are public. Yassir does not disclose customer counts by country, active
              merchants by city, the share of GMV from top merchants, enterprise contract counts, cohort retention by
              product, or the share of users adopting multiple categories. Public geography numbers also conflict across
              sources and vintages, indicating real breadth but weak precision. As a result, the expansion story is
              credible conceptually, but concentration risk and lifetime value still require private diligence rather
              than public inference.
