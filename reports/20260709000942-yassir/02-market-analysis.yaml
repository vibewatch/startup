  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-gmv
    missingEvidence: A public, independent GMV or ride-hailing and food-delivery market-size estimate specific to Algeria rather than to broad African or MENA categories.
    whyItMatters: Without a country-specific GMV or segment TAM source, market sizing must rely on constrained user-pool and behavior lenses rather than direct spend data.
    diligencePath: Request country-level GMV from management or secure a paid analyst report covering Algerian ride-hailing and delivery.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: country-mix
    missingEvidence: Yassir’s current country-level volume, order, and revenue mix across Algeria and its expansion markets.
    whyItMatters: A strong home-market position does not reveal how much of current demand still comes from Algeria versus Morocco, Tunisia, Senegal, South Africa, France, or Canada.
    diligencePath: Ask for the latest management dashboard showing orders, GMV, and revenue by country and city.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: metric-definition-mix
    missingEvidence: A reconciled definitions sheet for “users,” “downloads,” “partners,” “cities,” and digital-payment behavior across official and external sources.
    whyItMatters: Market sizing is highly sensitive to whether a metric represents registrations, active users, total population, adult population, or transaction counts.
    diligencePath: Collect the metric definitions management uses internally and remap public sources to those definitions before refresh.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
