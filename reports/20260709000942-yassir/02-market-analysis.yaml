tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Ride-hailing / local mobility
    - Short-distance urban point-to-point rides and employer-sponsored local transport
    - Intercity coaches, rail, airlines, long-haul travel, and vehicle ownership
    - Consumer rider or employer transport budget owner
    - Original wedge that establishes local density and trust.
  - - Food delivery
    - Restaurant ordering, dispatch, and fulfilment within app-mediated urban delivery radii
    - Offline dine-in, catering contracts, and pure restaurant POS software
    - Household consumer; merchant pays take-rate economics
    - High-frequency use case that deepens consumer habit and merchant dependence.
  - - Grocery / store fulfilment
    - On-demand grocery baskets, convenience-store orders, and store fulfilment routed through the app
    - Full national grocery retail spend and offline basket shopping
    - Household consumer; merchant-store owner pays platform economics
    - Expands the app from occasional transport into routine household commerce.
  - - Embedded payments / wallet
    - In-app top-ups, stored value, payouts, and payment rails tied to rides, meals, and goods
    - General-purpose banking, corporate treasury, or offline card acquiring outside the ecosystem
    - Consumer wallet user, merchant, driver, courier, or agent
    - Critical for take-rate expansion in a low-card, cash-heavy economy.
  - - B2B mobility / procurement / parcels
    - Employer travel programs, office meals, purchases, and urgent parcels
    - Large-scale enterprise ERP suites or long-cycle procurement software
    - Employer, fleet manager, or SMB owner
    - Adds a separate budget-owner segment beyond household demand.
  notes: Defines the addressable market by workflow rather than by a generic “super-app” label. Exclusions matter because Algeria’s broader retail and transport spend is far larger than what is practically app-transactable today.
