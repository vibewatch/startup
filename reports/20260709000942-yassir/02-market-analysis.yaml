  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Urban consumer rider
    - Consumer
    - Rider
    - Same consumer; sometimes employer reimbursement
    - Request local trip inside city
    - Individual wallet / cash budget
    - Speed, availability, visible pricing, safety
  - - Restaurant partner
    - Restaurant owner / operator
    - Merchant staff and end customer
    - Merchant pays platform take-rate; customer pays order
    - Receive orders, run promos, manage fulfilment
    - Owner / manager
    - Incremental demand and easier order management
  - - Store / grocer partner
    - Store owner
    - Merchant staff and end customer
    - Merchant pays platform economics; customer pays basket
    - Manage inventory, incoming orders, and promos
    - Owner / manager
    - Access to digital demand without building own channel
  - - Driver supply partner
    - Driver
    - Driver
    - Driver earns commissions per ride
    - Use vehicle to serve local mobility demand
    - Individual earner
    - Supplemental income with flexible schedule
  - - Courier supply partner
    - Courier
    - Courier
    - Courier earns per delivery
    - Use scooter or motorbike to fulfil orders
    - Individual earner
    - Flexible income from short urban delivery loops
  - - Employer / fleet programme
    - Company admin or fleet manager
    - Employees
    - Employer
    - Create ride programmes and allocate rules or budgets
    - Operations / HR / admin
    - Budget control and reliability for staff transport
  - - Cash-to-wallet user / agent pair
    - Consumer or agent
    - Consumer and agent
    - Consumer tops up; agent facilitates cash conversion
    - Top up, spend, and refund value across the ecosystem
    - Household budget or micro-agent float
    - Need to bridge cash behavior into app spending
  notes: Yassir’s market is multisided by design. The same app serves consumers, merchants, workers, and employers, but each segment has a distinct budget owner and adoption trigger.
