- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Publisher / lens
  - Year
  - Geography
  - Value
  - CAGR / growth
  - Methodology
  - Confidence
  - Limitation
  rows:
  - - World Bank population API
    - '2025'
    - Algeria
    - 47.44M total residents
    - Population still rising
    - Observed national population baseline from SP.POP.TOTL API
    - high
    - Too broad to represent app-reachable or urban demand by itself.
  - - World Bank urbanization API
    - '2025'
    - Algeria
    - 35.96M urban residents; 75.82% urban share
    - Urban share still rising
    - Observed SP.URB.TOTL.IN.ZS applied to 2025 population
    - high
    - Urban residents are not the same as digital or transacting users.
  - - DataReportal + World Bank internet lens
    - 2024-2025
    - Algeria
    - 37.8M internet users; ~28.6M connected urban residents
    - Internet use up versus 2024
    - Blend end-2025 internet penetration with 2025 population and urban share
    - medium
    - Derived urban-connected figure mixes vintages and assumes even urban internet access.
  - - Trade.gov online-purchase lens
    - 2023-2025
    - Algeria
    - ~3.89M online purchasers
    - Low current penetration
    - Apply 8.2% online-purchase behavior to 2025 population
    - medium
    - Population-level purchase rate may overstate adult-only or urban-only transactors.
  - - Trade.gov digital-sender lens
    - 2023-2025
    - Algeria
    - ~2.23M digital money senders
    - Early-stage adoption
    - Apply 4.7% digital-transfer behavior to 2025 population
    - medium
    - Money-sending behavior is narrower than total wallet potential.
  - - UNCTAD e-commerce lens
    - 2023-2024
    - Algeria
    - 0.8% of GDP in B2C e-commerce; payments tripled since 2020; 92% annual growth in registered e-commerce businesses since 2020
    - High growth off a small base
    - UNCTAD ecosystem assessment using national e-commerce indicators
    - high
    - Captures ecosystem growth, not Yassir-specific market share or GMV.
  notes: This table intentionally mixes direct observed indicators with constrained derived lenses. No single row is “the TAM”; the market must be sized by stacking access, urban density, payments readiness, and current behavior.
