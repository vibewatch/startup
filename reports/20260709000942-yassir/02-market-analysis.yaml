- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Urbanization above 75%
    - Driver
    - Current / structural
    - Dense cities support more frequent local trip and delivery use cases.
    - Validate city-by-city density and order economics, not only national averages.
  - - Internet and mobile growth
    - Driver
    - Current / structural
    - Broad access enlarges discovery and ordering addressability.
    - Request channel mix for new-user acquisition and retention by city.
  - - Low account ownership and low card usage
    - Constraint
    - Current
    - Hybrid payment behavior slows pure-wallet conversion and raises cash handling complexity.
    - Quantify cash-versus-wallet order mix and take-rate differences.
  - - Cash on delivery dominance
    - Constraint
    - Current
    - Delivery TAM is smaller than headline connectivity suggests because many households still transact offline-at-delivery.
    - Request Yassir's current COD share and wallet-activation conversion by cohort.
  - - Rapid e-commerce business formation
    - Driver
    - Current / near-term
    - Merchant supply can deepen quickly if onboarding and fulfilment stay simple.
    - Request merchant activation, churn, and repeat-order data by category.
  - - Last-mile formalization gap
    - Constraint
    - Near-term
    - Scaling grocery and merchant logistics requires compliance and service reliability improvements.
    - Assess courier productivity, fraud controls, and claim rates by city.
  - - Transport-app regulation under review
    - Constraint
    - Near-term
    - Licensing or safety rules could raise costs but also formalize the market and limit weaker competitors.
    - Obtain management's regulatory-readiness plan and legal contingency scenarios.
  - - Data localization and privacy enforcement
    - Constraint
    - Current / structural
    - Fintech and retail-media ambitions become more expensive and operationally complex.
    - Review data architecture, localisation costs, and regulator engagement plan.
  - - Startup-policy support and 2029 digital strategy
    - Driver
    - Near-term
    - National policy can expand infrastructure and create startup-friendly procurement openings.
    - Determine how much Yassir actually benefits from startup incentives or public contracts.
  - - Cross-border digital trade reforms
    - Driver
    - Medium-term
    - AfCFTA digital rules and single-window trade tools could make regional merchant and logistics expansion easier.
    - Assess whether Yassir is building exportable merchant or wallet tooling, not just local delivery density.
  notes: 'Some “drivers” enlarge the long-run market while still leaving near-term monetization hard. The key is timing: access has moved faster than digital-transaction behavior.'
