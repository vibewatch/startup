company:
  name: Yassir
chapter:
  number: 2
  title: Market Analysis
  summary: 'Yassir’s real market is narrower than “all consumer spending in North Africa” but broader than ride-hailing alone: it sits at the intersection of dense urban mobility, app-mediated food and grocery ordering, hybrid cash-to-digital payments, and small-business logistics. Algeria’s digital adoption base is now large enough to matter — 47.4 million residents, 75.8% urbanization, 37.8 million internet users, and 55.6 million mobile connections — yet monetizable demand still narrows sharply because account ownership, card usage, and online-purchase behavior remain low. That creates a market with genuine long-term headroom but near-term dependence on trust, local density, offline operations, and regulatory clarity.'
sections:
- id: market-boundary-and-status-quo-substitutes
  title: Market boundary and the substitutes Yassir is actually displacing
  body: 'The correct market boundary for Yassir is not generic “African super-app TAM.” It is app-mediated daily urban spend across short-distance transport, restaurant delivery, grocery and store fulfilment, embedded payments, and employer-managed local mobility. Official Yassir pages make that multisided structure explicit: the company separately recruits riders, couriers, restaurants, stores, cash agents, and business transport managers. That means the company competes not just against rival apps, but against status-quo substitutes such as street taxis, private-car rides, direct phone ordering, cash settlement, and internally arranged employee transport. The buyer and payer vary by segment. A passenger often pays directly, a restaurant owner pays through take-rate economics, and a fleet manager controls employer transport budgets. This matters because each layer has a different adoption trigger and friction profile. Grocery and food delivery depend on merchant density and last-mile reliability.
    Ride-hailing depends on local supply liquidity and regulatory permission. Payments depend on trust and top-up infrastructure in a market where card usage remains low. The result is a market that is structurally broader than mobility but still fundamentally urban, local, and operations-heavy.'
