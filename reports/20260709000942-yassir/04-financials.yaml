- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - GMV by category and market
    - Without GMV, revenue quality and take-rate math cannot be reconciled
    - Request rides, food, grocery, wallet, and B2B GMV by country and city
  - - Realized take rates and fee ladders
    - Cannot distinguish list pricing from realized monetization
    - Request current merchant, driver, courier, and wallet fee schedules
  - - Contribution margin by city
    - Cannot separate dense profitable cities from subsidized expansion markets
    - Obtain city-level unit-economics bridge for top ten cities
  - - Cash, burn, and runway
    - Cannot assess financing dependency or next-round timing
    - Request treasury dashboard and latest monthly cash waterfall
  - - Debt, guarantees, or supplier financing
    - Potential hidden capital obligations remain unknown
    - Request full debt schedule and contingent obligations
  - - Wallet economics and fraud loss
    - Payments strategy cannot be underwritten without loss / settlement data
    - Request wallet GMV, fraud loss rate, refund rate, and settlement cost
  - - Retail working capital post-Uno
    - Physical-retail expansion could alter cash conversion cycle
    - Request inventory turns, lease commitments, and store-level gross margins
  - - Merchant and business-account retention
    - Revenue durability cannot be judged from headline partner counts
    - Request merchant and enterprise cohort retention plus logo churn
  notes: This chapter’s strongest conclusion is what still cannot be responsibly underwritten from public evidence.
