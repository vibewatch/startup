      - number: '7.2'
        title: 即使没有公开危机记录，服务质量、安全和云集中度仍会带来运营下行风险
        blocks:
          - type: paragraph
            body: >-
              运营风险图景并不单一：公开资料里没有一场被清楚记录的灾难，但有几组可信的预警信号。Trustpilot 投诉集中在退款、支持慢、车辆状况差、司机对显示价格重新议价。司机端 App 的公开评分弱于乘客端
              App，说明供给侧满意度可能结构性低于需求侧表层情绪。阿尔及利亚的监管报道明确把骚扰、纠纷和乘客安全列为需要正式监管的理由。与此同时，Google Cloud 发布的案例研究显示，Yassir
              的平台从一开始就深度绑在同一个供应商生态里：Google Kubernetes Engine、Cloud Run、Pub/Sub、BigQuery、Dataflow、Dataplex、Security
              Command Center、Vertex AI，以及计划中由 Apigee 带动的 API
              扩张。集中度本身不一定坏——它可能支撑了快速扩张——但确实把宕机、定价、供应商谈判和安全暴露面集中到了一处。Yassir 借 Uno 进入零售、借 Kawarizmi
              进入零售媒体后，运营负担也从纯软件编排扩大到仓库、售货亭、结账流程、画像和数据权利治理。
