      - number: '1.3'
        title: 产品宽度、支付基础设施与运营扩张
        blocks:
          - type: paragraph
            body: >-
              Yassir 把出行、商业和支付连在一起，扩张逻辑很清楚。官方页面先描述一个有认证司机、地理定位行程和预先报价的网约车底座，再往上叠加外卖、杂货配送、B2B 出行管理、采购、包裹配送和 Yassir
              Cash。Yassir Cash
              页面尤其关键，因为它显示公司的金融科技野心不是抽象口号：用户可以用银行卡或代理充值，在应用内消费余额，并通过实体代理网络退款；潜在代理还必须满足商业和税务登记要求。摩洛哥牌照故事也符合这一模式。Launch
              Base Africa 报道，Yassir 于 2024 年 1 月向 Bank Al-Maghrib
              申请支付机构授权，并围绕这一流程组建了在本地有说服力的董事会。这不只是产品相邻项，而是公司把可信消费平台转成更广泛金融服务和商户服务平台的既定路径。B2B 页面进一步说明，Yassir
              正在销售物流、办公室出行和采购，而不只是依赖消费者交易。
