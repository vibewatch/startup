      - number: '7.3'
        title: 经济下行情景说得通，但公开数据太薄，无法精确衡量韧性
        blocks:
          - type: paragraph
            body: >-
              Yassir 的公开财务风险不只是可见压力，也同样是信息不透明。公司仍未公开披露
              GMV、实际抽佣率、贡献利润率、烧钱速度、现金或债务义务，投资者能识别风险向量，却无法量化缓冲垫有多厚。不过方向已经清楚。公司正从网约车和配送扩展到钱包服务、实体零售和广告技术；这些业务都会提高资本强度、治理要求，或扩大欺诈与合规暴露。行业可比公司也提示谨慎：Jumia
              因资金雄厚、打法激进的对手退出餐饮配送，提醒多边配送经济模型会在竞争压力下断裂；Uber Eats 的商户费率结构则说明餐厅仍然价格敏感，平台被迫在抽佣率、服务层级和激励上竞争。Google Cloud
              早期信用额度和战略支持帮过 Yassir 的起步阶段，但也凸显了一个更安静的依赖：如果核心供应商或监管方改条款，Yassir 公开可见的容错空间可能不大。
