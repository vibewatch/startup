  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管不确定性和跨境数据合规是最显眼的外部风险集群
        blocks:
          - type: paragraph
            body: >-
              Yassir 现在所处的产品栈里，几个法律制度正在同时变化。阿尔及利亚正通过一部草案法律把网约车正规化，让基于应用的交通进入更清晰框架；但立法仍在政府中推进这一事实，也确认了 Yassir
              原始业务的核心部分一直在模糊地带运行。摩洛哥更不确定：公开声明称，基于应用的交通仍缺少清晰框架；交通部长又单独表示，没有适当授权的运营是违法的。在塞内加尔，出租车工会已经在法院对 Yassir
              及同业施压，数据保护监管机构也公开警告 Yassir 遵守本地隐私规则。这些交通和隐私风险之上，还有更广泛的合规负担。阿尔及利亚修订后的 Law 18-07 增加了
              DPO、记录留存、DPIA、数据泄露通知和授权义务；摩洛哥 Law 09-08 和 CNDP
              制度增加了备案、传输和制裁风险。对一家跨多个国家收集位置、支付、行程历史和商户数据，同时增加广告技术和金融科技层的公司来说，合规风险不是边缘问题，而是平台能否持续无中断扩张的核心。
