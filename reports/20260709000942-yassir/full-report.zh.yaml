      - number: '2.4'
        title: 增长驱动、市场约束与采用节奏
        blocks:
          - type: paragraph
            body: >-
              Yassir 市场最大的驱动力，不是阿尔及利亚已经完全数字化，而是数字接入正在跑赢数字交易行为。连接率、城市化、商户数字化和创业政策支持都在朝正确方向走。UNCTAD 记录，自 2020
              年以来，注册电商企业年增长 92%，2020 至 2024 年线上支付交易增长三倍，移动宽带覆盖超过 98% 人口。Trade.gov 补充说，阿尔及利亚现在有 2,000 多家认证创业公司，其中 fintech
              占 7%。但约束同样是结构性的。Trade.gov 描述了限制性强、推进缓慢的数字监管制度；DZWatch 报道，一部待审法律可能重塑应用出行的许可和监管方式。UNCTAD
              称最后一公里配送仍需要正规化，数据本地化也会抬高任何规模化支付或消费者数据业务的合规成本。实际含义是，Yassir
              的市场应会扩张，但不是一个无摩擦的互联网消费故事。采用时钟将由监管清晰度、钱包渗透率、商户入驻经济性，以及公司在保持运营合规的同时维持密集本地供给的能力共同决定。
