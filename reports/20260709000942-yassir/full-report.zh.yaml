      - number: '2.3'
        title: 买方、用户、付款方与供给侧分层
        blocks:
          - type: paragraph
            body: >-
              Yassir
              仍扎根北非日常服务，买方地图却异常多元。消费者乘客要速度、价格可见性和安全感。餐厅伙伴要订单流、促销和简单仪表盘。门店卖家要库存可见性和订单管理。雇主或车队管理员要预算控制、员工分组和可预期的交通项目。供给侧上，司机和骑手不只是供给应用的“用户”；他们是寻求收入的微型创业者或副业劳动者，响应的是劳动力市场压力。Yassir
              自己的页面重点提到学生、雇员、退休人员和自雇者；骑手入驻还明确要求有踏板车或摩托车、保险和智能手机。这意味着劳动力可得性连着设备拥有、车辆可得和灵活收入吸引力，而不是正式劳动力规划。支付又增加一层分群：Yassir
              Cash 用户和代理是现金密集的线下行为与数字钱包使用之间的桥。本章的关键分析点是，Yassir
              服务的不是一种同质化应用用户。它把家庭、商户、非正式到半正式劳动者和企业管理员缝在一起；只有本地密度和信任足够高时，这些群体的激励才会对齐。
