chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与超级应用边界
        blocks:
          - type: paragraph
            body: >-
              Yassir 的公开身份来自一个常见的创始人回流故事，但背后已有不断扩大的法律和地理足迹。官方介绍页称，Noureddine Tayebi 2017 年在 Palo Alto 构思了
              Yassir，想解决阿尔及利亚人的日常出行痛点；外部报道也一直把 Tayebi 和 El Mahdi Yettou 识别为创始人。公司后来早已越过最初的网约车切入口。官方产品页面和 Google Play
              列表显示，它已形成覆盖网约车、外卖、杂货配送、Yassir Cash 以及 B2B 出行或采购工具的多入口消费产品栈。隐私政策信息量很高，这在非洲私营创业公司里并不常见：它把阿尔及利亚实体列为 EURL
              Yassir，并列出摩洛哥、突尼斯、法国、南非和塞内加尔的本地运营或通讯足迹。即便如此，公开国家数并不完全稳定。不同官方和半官方页面在六个国家、七个国家、八个主场市场、45 个城市、50 多个城市或 58
              个城市之间切换。尽调结论应该是：Yassir 显然已经走出阿尔及利亚和马格里布核心区，但当前足迹的精确数字仍是尽调事项，不是干净底数。
