      - number: '8.2'
        title: 公开可比公司与倍数走廊
        blocks:
          - type: paragraph
            body: >-
              给 Yassir 定位，最干净的方式不是把它一对一对标某一家上市公司，而是把它看作一个北非超级 App，介于配送市场、区域消费者平台和早期支付生态之间。DoorDash
              展示了盈利能力改善的品类龙头能拿到什么估值。Grab 展示了业务更宽、资产负债表流动性更强但倍数更低的超级 App。Delivery Hero
              说明，高增长和多垂类野心无法阻止市场在地域组合和执行复杂度都高时压缩倍数。Jumia
              不是产品孪生体，但作为公开非洲平台参照仍然重要：它证明投资者仍会为区域消费者互联网资产支付增长倍数，同时大幅折价不透明或质量较低的经济性。对照这些参照，Yassir 隐含的 6.3x
              往绩销售倍数显得偏贵，而不是明显荒唐。这个可比公司组还带来另一条有用纪律：哪些事不该做。Yassir
              混合了出行、配送、钱包和商户工具，投资者总能找到一个乐观类比。更安全的做法是要求任何溢价论点都必须配上溢价级披露、被证明可重复的行为和可见的利润率进展，而不是只靠可选性叙事。
