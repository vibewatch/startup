        blocks:
          - type: paragraph
            body: >-
              Yassir 资本历史中，外部佐证最强的是 2021 年 Series A 和 2022 年 Series B。TechCrunch 和 Wamda 报道，Yassir 在较早的种子轮之后，于 2021 年末完成
              $30 million Series A，WndrCo、DN Capital、Kismet Capital、Spike Ventures 和 Quiet Capital
              等是主要支持者。一年后，TechCrunch、Wamda、TechCabal 以及 Yassir 自己的公告都报道了由 BOND 领投的 $150 million Series B，使已披露融资达到
              $193.25 million，也按公司自己的说法把 Yassir 推成北非最有价值的创业公司。事情看似直接，直到读到当前官方介绍页仍称 2022 年那轮融资是 $130 million。同一套公开资料还在较早的
              600 万用户和 130,000 个伙伴、新近的 800 万以上下载和 100,000 多个伙伴，以及暗示 2025 年后续 Series C、投后估值 $1.43 billion
              的二级市场数据之间摇摆。这些并不推翻核心增长故事，但意味着后续章节应优先采用能直接交叉验证的融资事件，把无来源的门面指标或私募市场跟踪字段视为中等置信度，而不是审计事实。
