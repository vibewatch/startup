        title: 情景视角、建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              牛市情景很容易说清，但仍缺证据。如果保留收入估算明显低估 2025 或 2026 年运行收入，如果 Yassir Pay
              从钱包功能变成真正的支付层，如果新的零售媒体或实体零售相邻业务提高收入质量，那么当前独角兽标记可以被解释为对更大北非平台的早期下注。基准情景更克制：公司真实存在，增长可能延续，但公开证据仍指向一个应落在消费者互联网估值走廊里的平台，而不是应拿溢价软件倍数的平台。熊市情景不是
              Yassir 造假；而是执行、监管或客户质量让业务更像波动的物流市场，而不是可复利的金融科技平台。因此，本报告建议继续研究，置信度中等，并坚持严格入场纪律。
