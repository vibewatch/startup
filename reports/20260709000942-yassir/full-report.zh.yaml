  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 城市化率超过 75%
        - 驱动
        - 当前 / 结构性
        - 高密度城市能支撑更高频的本地出行和配送场景。
        - 不只看全国均值，要逐城验证密度和订单经济性。
      - - 互联网和移动端增长
        - 驱动
        - 当前 / 结构性
        - 广泛接入扩大了发现和下单的可触达面。
        - 索取各城市新用户获客和留存的渠道组合。
      - - 账户持有率和银行卡使用率偏低
        - 约束
        - 当前
        - 混合支付习惯拖慢纯钱包转化，也提高现金处理复杂度。
        - 量化现金订单与钱包订单的结构，以及抽成差异。
      - - 货到付款占主导
        - 约束
        - 当前
        - 许多家庭仍在送达时线下付款，因此配送 TAM 小于表面联网率暗示的规模。
        - 索取 Yassir 当前 COD 占比，以及按用户队列划分的钱包激活转化率。
      - - 电商商户快速涌现
        - 驱动
        - 当前 / 近期
        - 如果入驻和履约足够简单，商户供给可以快速加深。
        - 索取按品类拆分的商户激活、流失和复购数据。
      - - 最后一公里规范化缺口
        - 约束
        - 近期
        - 杂货和商户物流要规模化，合规和服务可靠性必须补上。
        - 按城市评估配送员效率、欺诈控制和索赔率。
      - - 交通 App 监管仍在审议
        - 约束
        - 近期
        - 牌照或安全规则可能推高成本，也可能规范市场、限制弱势竞争者。
        - 获取管理层的监管准备计划和法律应急情景。
      - - 数据本地化与隐私执法
        - 约束
        - 当前 / 结构性
        - 金融科技和零售媒体野心会更烧钱，运营也更复杂。
        - 审查数据架构、本地化成本和监管沟通计划。
      - - 创业政策支持与 2029 数字战略
        - 驱动
        - 近期
        - 国家政策能扩建基础设施，也能打开更利于初创公司的采购机会。
