      - number: '1.4'
        title: 里程碑已延伸到收购、国际品牌和合规压力
        blocks:
          - type: paragraph
            body: >-
              Yassir 当前画像不是由某一次市场上线塑造的，而是由一串里程碑事件共同塑造：它们拓宽了品类覆盖，也抬高了执行要求。2023 年与 PSG 的合作显示管理层用体育营销把品牌国际化。2023 年接手 Flink
              France 时，Eurofound 和 Goodwin 称 Yassir 在救援交易中投入超过 €5 million，保住了 480 个岗位中的 270
              个，说明公司愿意用困境资产交易进入或加固海外市场。2024 年，Yassir 收购了突尼斯配送应用 KooL，并推进摩洛哥支付牌照。2026 年，它收购
              Kawarizmi，补上零售媒体和广告技术能力；随后又通过收购 Uno 进入实体杂货零售，并计划把连锁店改名为 Yassir Market，在结账端加入线上下单到店自提、自助终端和 Yassir
              Cash。这些动作野心很大，把公司推到远超网约车的范围。另一面是运营和监管风险。Tech in Africa 报道，塞内加尔数据保护监管机构曾就本地合规警告 Yassir；Yassir
              自己的公开足迹指标也足够嘈杂，投资人在把它按一个干净独角兽故事承做之前，仍应要求一手股权结构、组织架构和 Series C 之后的文件。
