            body: >-
              因为 Yassir 仍是私营公司，上市公司和行业代理指标就很重要。Uber 2024 年 10-K
              尤其有用：它展示了巨大的总预订额和收入规模，也详细说明司机激励、骑手激励、保险、网络成本、信用卡处理、广告和人员成本如何压缩分部盈利。Jumia
              提供了非洲视角的另一面。它的申报材料展示了平台型市场加物流加支付的组合栈；管理层解释退出外卖业务时，则说明当竞争强度、优惠券驱动增长和运营复杂度跑赢经济性时，这种模型会多快变得缺乏吸引力。Yassir
              自己的司机、骑手和钱包页面让人很难想象一个类似软件的利润率画像：入驻、背景审查、伙伴支持、支付结算、代理网络、退款，以及潜在零售履约都会带来直接运营成本。如果跨品类密度带来更好利用率和更低获客成本，公司长期经济性仍可能很强，但公开资料无法验证。审慎假设不应是“高
              SaaS 利润率”，而应是“依赖本地密度、补贴纪律和支付附着的平台型市场利润率路径”。
