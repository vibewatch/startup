              Yassir 的公开材料让整体收入架构比具体单位经济性更容易看清。TechCrunch 2021 年 Series A 报道称，公司通过对所提供服务抽佣来产生收入。当前 Yassir
              面向餐厅、门店、企业出行、钱包支付、司机和骑手的官方页面进一步支撑了这一宽泛说法。合在一起，这些页面暗示至少六个变现面：出行佣金、外卖抽佣、杂货或门店佣金、支付或钱包费用、企业出行预算，以及相邻商业或商户服务收入。公司的支付层尤其重要，因为它看起来不只是为了处理交易，而是要把高度依赖现金的用户迁到更高频的应用内结算。缺失的是实际落地价格：公开材料没有披露商户佣金表、司机或骑手有效佣金率、钱包费用阶梯、退款成本或企业合同结构。因此，本章可以有把握地识别收入流，但还不能判断每条收入流里的实际收入组合或质量。
