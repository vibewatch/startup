        - 要求提供组织架构图、授权模型和继任计划
      - - 监管 / 合规团队
        - 多国交通、隐私、金融科技和广告技术规则需要深厚本地覆盖
        - 高
        - 高
        - 可能使用了本地顾问
        - 要求提供各国合规负责人和预算
      - - 整合管理
        - KooL、Uno 和 Kawarizmi 带来并行整合负荷
        - 高
        - 高
        - 收购逻辑自洽
        - 要求提供整合路线图、里程碑和 PMO 责任
      - - 客服和合作方运营
        - 服务质量取决于能否快速解决消费者、商户和司机问题
        - 高
        - 高
        - 客服渠道已存在
        - 要求提供人员配置、SLA 仪表盘和升级指标
