  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心估值与真正被证明的内容
        blocks:
          - type: paragraph
            body: >-
              公开证据已经足以确认，Yassir 不是纸面独角兽。公司做出了真实的产品宽度，扩张到数百万用户，跨过多个国家，并吸引了大型机构投资者。2025 年融资事件也足够真实，可以作为市场信号：Forge
              记录的投后估值约为 $1.43B，ALGERIATECH 则描述了一轮约 $105M 的内部 Series
              C。这个组合重要，因为它说明在宽松资金周期结束后，内部人或二级市场观察者仍愿意承销这个故事。但它没有解决分母问题。公开材料仍不给审计收入、毛利率、现金消耗、队列留存或轮次条款。最容易找到的收入数据仍是第三方对
              2024 年约 $225.9M 的估算；按这个数看，最后一轮标价足够贵，投资者应把它当作需要测试的价格，而不是可以接受的价格。
