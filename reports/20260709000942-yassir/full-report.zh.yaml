      - number: '3.3'
        title: 定价压力已经可见；消费者转换成本偏弱，商户转换成本好坏参半
        blocks:
          - type: paragraph
            body: >-
              公开定价和打包证据指向一个结构性竞争市场。根据 2025 年一场采访，inDrive 公开强调乘客和司机议价，以及约 12% 的佣金。Heetch 早期公开描述提到 15% 抽成，并支持现金和银行卡支付。Uber
              Eats 的 2026 年美国商户帮助页面显示，成熟配送平台会把商户经济性明确分层：配送订单费率为 20% 到 30%，自提或自配送费率更低。Glovo、Careem 和 Uber 都借 Prime、Careem
              Plus 和 Uber One 等会员或促销机制刺激下单频次；Bolt
              则营销增量商户订单、新客获取和集成能力。这些信号意味着消费者转换成本低：多数主流应用都承诺快速叫车、实时追踪、促销和熟悉的支付选项。只有当平台证明能带来重复需求、更好分析或流程集成时，商户转换成本才会更高。劳动者一侧的忠诚度也脆弱，因为不同平台和市场的定价、佣金和收入机会都可能快速变化。
