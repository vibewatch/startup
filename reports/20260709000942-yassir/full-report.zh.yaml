      - number: '7.4'
        title: 地理、品类数量和并购扩张叠加，执行风险上升
        blocks:
          - type: paragraph
            body: >-
              Yassir 要求管理层同时跑通几场艰难转型：把曾经灰色的交通业务正规化，取得或维持金融科技许可，整合零售连锁，消化广告技术并购，守住合作伙伴流动性，并在品类增加时不让支持质量下滑。创始人兼 CEO
              Noureddine Tayebi
              仍然是公司架构、战略和外部叙事的核心，这有利于愿景清晰，却加重了关键人集中。组织还需要各国层面的法律、监管、合规、安全和运营能力，而公开资料看不到足够细节。并购驱动的扩张会放大这个问题。KooL、Uno 和
              Kawarizmi 在战略上说得通，但每一笔都带来单独的整合、文化、治理和报告负担。真正的投资问题不是 Yassir
              有没有野心；它显然有。问题是公司能否吸收更多监管和复杂度，速度快过服务质量、治理或资本效率的恶化。最清晰的论点破裂信号包括：阿尔及利亚出台惩罚性法律，或新框架采纳缓慢；摩洛哥在合法化前执法收紧；出现重大隐私或云事件；支持质量持续下滑；或有证据显示
              Uno 和 Kawarizmi 增加复杂度快于创造价值。
