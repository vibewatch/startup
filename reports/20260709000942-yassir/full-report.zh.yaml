              Yassir
              最强的公开信任信号来自政策和流程控制，而不是外部验证过的技术材料。隐私政策明确列出阿尔及利亚、摩洛哥、突尼斯、南非、塞内加尔、法国和加拿大的本地法律实体、地址、隐私法律和用户数据类别。它还解释了位置数据使用、行程数据收集和账户资料信息。运营上，公司增加了车辆检查、伙伴背景审查、安全指引、钱包
