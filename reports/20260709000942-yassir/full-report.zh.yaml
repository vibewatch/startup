  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监控触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 阿尔及利亚监管正式化
        - 草案法结果
        - 惩罚性牌照、高成本负担或长期延误
        - 暂停投资测算，直到法律经济性重新建模
      - - 摩洛哥交通合法性
        - 合法化前执法收紧
        - 扣车、罚款或运营暂停大幅增加
        - 将摩洛哥扩张假设视为受损
      - - 隐私 / 数据执法
        - 监管升级
        - 正式制裁、警告升级为罚款，或数据传输受阻
        - 升级合规尽调，并下调金融科技 / 广告技术上行空间
      - - 云 / 安全集中度
        - 重大故障或数据泄露
        - 多小时故障、监管通知或重大信任事件
        - 重新评估供应商集中度和事件准备度
      - - 支持质量恶化
        - 投诉指标恶化
        - Trustpilot / 退款 / 客服投诉继续上升，且没有 SLA 证明
        - 假定复用和品牌风险承压
      - - 整合过载
        - Uno / Kawarizmi 执行滑坡
        - 门店铺开延迟、治理问题悬而未决，或运营 KPI 偏弱
        - 因复杂度和资本强度下调估值
    notes: 最有用的否决标准来自外部且可观察：监管、投诉、服务中断和集成里程碑。
    claimRefs:
      - CR039
      - CR040
      - CR044
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 理由
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 公司是真实运营，战略上也有看点，但现有公开证据还不能证明按接近上一轮私募估值入场有吸引力。
        - 继续尽调，但不要被迫接受现价决策。
      - - 信心
        - 中
        - 融资事件和规模证据可信，但分母仍依赖估算和稀疏二手数据。
        - 用情景框架，而不是确定性承销。
      - - 风险评级
        - 高
        - 监管、披露缺口和服务质量投诉都可能迅速压缩估值。
        - 设定硬性否决触发器，并持续监控下行风险。
      - - 估值立场
        - 合理偏高
        - 隐含约 6.3x 的过去销售额倍数，高于多数保留的上市可比公司。
        - 只有管理层证明经济性明显更好，才按上一轮估值支付。
      - - 改善判断的因素
        - 价格更低或数据更好
        - 更便宜的入场价格，或达到备案级别的披露，都可能改善风险 / 回报。
        - 数据室审阅后或价格重置后再重看。
    notes: 本表把章节结论压缩成可上 IC 的表述；不能替代股权结构审阅或管理层尽调。
    claimRefs:
      - CV003
      - CV006
      - CV021
      - CV034
      - CV035
      - CV036
      - CV037
      - CV044
  - id: TV002
    title: 正反论点表
    columns:
      - 视角
      - 正方观点
      - 反方观点
      - 改变判断的证据
    rows:
      - - 规模
        - Yassir 已经证明自己能跨国家、跨垂直品类运营，也拿到机构融资背书。
        - 最强的规模数据大多是历史数据，仍不能证明当前经济性。
        - 索取更新后的 2025 和 2026 运营看板。
      - - 支付上行
        - 钱包和支付入口可能把出行、配送建立的信任转化为质量更高的金融科技层。
        - 目前公开证据只证明钱包存在，不能证明高质量支付经济性或牌照确定性。
        - 索取钱包 TPV、抽佣率、活跃用户和监管往来。
      - - 商户生态
        - 门店和司机工具显示，Yassir 可能是在搭可复用平台，而不是单一产品应用。
        - 如果留存和补贴结构不达预期，可复用流程仍可能落到低利润物流经济性。
        - 审阅分部毛利率、复购行为和商户集中度。
      - - 融资轮质量
        - $1.43B 估值和内部跟投支持，说明投资者信念不低。
        - 内部轮次和稀疏二级市场页面，不会自动说明这个价格能在广泛市场出清。
        - 取得已签署条款清单、股权结构表和任何二级交易部分。
      - - 上市可比公司匹配
        - Yassir 同时具备 DoorDash、Grab 和 Jumia 的一些特征，可支撑混合可比公司视角。
        - 正因为它无法干净匹配任何单一可比公司，投资人很容易为可选性付高价。
        - 承销前，先把业务强制落入明确的情景区间。
    notes: 反方观点主要针对估值质量和披露，而不是质疑 Yassir 是否真正在运营。
    claimRefs:
      - CV014
      - CV015
      - CV023
      - CV024
      - CV025
      - CV034
      - CV038
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 指示性价值 / 倍数逻辑
      - 概率信号
    rows:
      - - 乐观
        - 当前收入显著高于保留的 2024 估算，支付业务顺利放量，新邻接业务改善利润质量。
        - $1.35B 至 $1.6B，基于更高收入基数给约 6x+，而不是沿用旧估算。
        - 需要证据表明 Yassir 正变得更像金融科技公司，而不只是铺得更广。
      - - 基准
        - 公司继续增长，但经济性只披露一部分，应给予广义消费平台折价。
        - $565M 至 $1.13B，按保留收入估算套用 2.5x 至 5.0x 区间。
        - 以当前公开证据看最可能。
      - - 悲观
        - 增长放缓、监管收紧，或服务质量和单位经济性更接近低质量市场平台可比公司。
        - $350M 至 $650M，采用压缩后的可比公司逻辑和下行执行假设。
        - 用户队列质量偏弱、监管摩擦或低利润披露会把公司推向该情景。
      - - 等待 / 稍后承销
        - 管理层证明经济性扎实，但当前价格仍不给安全边际。
        - 推迟入场，直到价格重置，或更完整披露提高投资人能自洽的倍数。
        - 如果投资人喜欢公司多过喜欢当前价格，这是最务实路径。
    notes: 区间是基于保留的上市可比公司和现有最佳收入估算做出的情景启发，并非精确内在价值模型。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV038
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值状态
      - 参考价值
      - 局限
    rows:
      - - Yassir 名义估值
        - Forge 投后估值约 $1.43B；保留的 2024 收入估算约 $225.9M；2025 融资约 $105M。
        - 按保留收入估算，过去销售额约 6.3x；私募轮次，二级市场信息有限。
        - 审阅资产的直接当前定价锚。
        - 分母是估算值，条款清单质量未披露。
      - - DoorDash
        - TTM 收入约 $14.72B；Q1 2026 收入增长 +33%；调整后 EBITDA $754M。
        - EV/收入约 5.1x。
        - 规模大且盈利改善的高溢价餐饮配送市场平台，最佳参考。
        - 规模和成熟度远高于 Yassir，披露更强，也有美国市场流动性。
      - - Grab
        - TTM 收入约 $3.55B；市值约 $15.69B；EV 约 $12B；净现金约 $4.53B。
        - EV/收入约 3.1x。
        - 带支付可选性的上市超级应用参考中，最接近的保留样本。
        - 东南亚规模和资本结构远强于 Yassir 的公开文件。
      - - Delivery Hero
        - 收入约 €14.06B；市值约 €11.14B；EV 约 €13.81B；Q1 2026 收入增长 +17.8%。
        - EV/收入约 0.9x。
        - 复杂全球日常应用和即时零售平台的有用底部参考。
        - 地域组合和公司复杂度与 Yassir 差异很大。
      - - Jumia 上市非洲语境
        - 市值约 $832.9M；EV/Sales 约 3.89；有备案支撑的市场平台披露。
        - 语境区间，而非干净锚点。
        - 把非洲公开市场视角留在可比公司集合中。
        - 电商和物流组合不同于 Yassir 以出行为先的起点。
    notes: 本表有意保持不完整：它只纳入本轮保留的高信号上市和私募估值参考，不声称覆盖完整可比公司清单。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-useful retained comparables for Yassir’s current pricing problem rather than a
        full global consumer-internet screen.
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV016
      - CV017
      - CV018
      - CV019
      - CV021
      - CV022
  - id: TV005
    title: 推翻论点与否决触发器表
    columns:
      - 触发器
      - 重要性
      - 可观察预警信号
      - 行动含义
    rows:
      - - 收入证明不达预期
        - 高溢价私募估值需要当前收入明显高于保留的 2024 估算。
        - 管理层无法给出支撑当前价格的 2025 或 2026 收入桥。
        - 把估值重定价到基准情景低端或悲观情景。
      - - 支付扩张停滞
        - 上行情景很大一部分靠钱包和牌照推进。
        - 阿尔及利亚或摩洛哥没有有意义的钱包采用指标或牌照进展。
        - 把金融科技上行视为未证实，并下调倍数预期。
      - - 客户质量恶化
        - 只有乘客、商户和司机满意度保持完好，复购行为才有价值。
        - Trustpilot 投诉、司机不满或退款纠纷持续上升，且没有反向指标。
        - 对增长耐久性施加更大折价。
      - - 监管收紧
        - 网约车或数据隐私执法会推高成本，并拖慢跨国扩张。
        - 规则草案变硬、监管警告升级，或牌照时间表滑坡。
        - 加入政策折价，放慢承销节奏。
      - - 融资条款对投资人不友好
        - 名义价格可以看起来不错，但优先权或二级交易结构会削弱真实经济性。
        - 尽调后股权结构测算仍无法对齐。
        - 即便业务仍有看点，也放弃价格敏感的入场。
    notes: 这几类触发器最可能把 Yassir 从「价格有争议但公司有意思」推到「按该价格不具吸引力」的投资。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 问题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2025 轮次机制
        - 已签署条款清单、精确持股、清算优先权、任何二级交易组合。
        - 需要把 $1.43B 名义估值翻译成真实入场经济性。
        - 索取律师包和更新后的股权结构表。
      - - 当前分部 P&L
        - 出行、餐饮、门店、钱包和新邻接业务的收入、毛利和现金需求。
        - 需要检验扩张是在抬升还是稀释估值质量。
        - 索取按业务线划分的管理层报表。
      - - 单位经济性和队列
        - 抽佣率、贡献利润率、CAC、复购行为、退款和取消指标。
        - 需要知道 Yassir 应落在哪个上市公司倍数区间。
        - 索取队列看板和单位经济性资料包。
      - - 2026 年运行率展望
        - 从 2024 估算到当前运营现实的本季度桥接。
        - 需要判断保留收入估算是低估还是高估现实。
        - 索取董事会材料或当前运营复盘。
      - - 监管姿态
        - 律师对阿尔及利亚网约车规则、塞内加尔数据问题和摩洛哥支付牌照的看法。
        - 需要框定合规和扩张摩擦带来的下行。
        - 取得外部律师备忘录和管理层整改计划。
      - - 退出准备度
        - 审计深度、KPI 节奏和通往上市公司式披露的路线图。
        - 需要判断 Yassir 能否随时间拿到质量更高的估值区间。
        - 索取 CFO 报告路线图和审计包。
    notes: 如果管理层无法回答这些问题，该资产应留在观察名单，而不是进入按价买入的高确信模式。
    claimRefs:
      - CV015
      - CV029
      - CV038
      - CV042
      - CV043
      - CV044
