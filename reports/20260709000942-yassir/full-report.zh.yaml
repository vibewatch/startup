            body: >-
              按能力映射这个市场时，Yassir 的公开产品栈比阿尔及利亚本地出行专家更宽，但披露规模仍窄于最大的区域和全球平台。Yassir
              的应用商店和官方商户页面支持一个组合主张：出行、外卖、杂货或购物、支付、商户仪表盘和雇主出行项目。Heetch 和 inDrive
