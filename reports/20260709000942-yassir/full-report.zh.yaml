              最强的公开牵引指标仍是运营指标，而不是财务指标。TechCrunch、Wamda、TechCabal 和 Yassir 自己的 2022 年公告都指向 $150 million Series B、约
              $193.25 million 已披露累计融资，以及截至 2022 年末覆盖六个国家 45 个城市、超过 800 万用户和 100,000 多个伙伴的足迹。TechCrunch 2021 年 Series A
              报道把更早期平台描述为超过 300 万人和 40,000 个伙伴，显示一年内规模快速上升。Y Combinator 当前公司页面仍把 Yassir 定位为覆盖 45 个城市、获得约 $200 million
              支持的超级应用。这些都是需求和投资人信心的可信信号。但它们不等同于经审计财务表现。留存公开材料中唯一容易找到的收入估计来自 GetLatka，称 Yassir 2024 年收入估计达到 $225.9
              million，员工约 1,500 人。这个估计在方向上有参考价值，但没有公司披露或申报文件佐证，因此应把它当作低置信度区间输入，而不是硬事实。
