              退出阿尔及利亚和另外六个非洲市场的外卖业务，说明品牌认知和洲际足迹都不能保证持久回报。Jumia CEO 明确提到进入壁垒低、激进折扣和资金雄厚的对手。Rest of World 关于 inDrive
