      - number: '2.2'
        title: 证据受限的规模测算：数字漏斗很大，可变现需求小得多
        blocks:
          - type: paragraph
            body: >-
              阿尔及利亚的人口和连接数据支持一个很大的理论漏斗，但能变现的层会迅速收窄。World Bank API 显示，阿尔及利亚 2025 年人口为 47.4 million，城市化率为 75.8%，意味着约 36.0
              million 城市居民。DataReportal 称，截至 2025 年末，该国有 37.8 million 互联网用户和 55.6 million 移动连接；World Bank
              自己的互联网使用序列显示，2024 年互联网渗透率为 77.4%。如果把 2025 年人口乘以城市化率和 2025 年末互联网渗透率，直接相关的联网城市居民池约为 28.6
              million。但这仍只是漏斗顶部的可触达人数。Trade.gov 称，2023 年只有 8.2% 的人口在线或通过电话购物，只有 4.7% 以数字方式汇款。World Bank 数据显示，成年人账户拥有率在
              2024 年降至 35.3%；Trade.gov 还称，只有 2.8% 的人口持有信用卡，22.9% 持有借记卡。UNCTAD 补充说，约 90% 的线上交易仍是货到付款，2023 年 B2C 电商仅相当于
              GDP 的 0.8%。所以，从人口角度看市场无疑很大；从当前交易准备度看，市场小得多。
