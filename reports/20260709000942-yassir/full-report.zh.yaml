  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Yassir 真正在替代的对象
        blocks:
          - type: paragraph
            body: >-
              Yassir 的正确市场边界不是泛泛的“非洲超级应用 TAM”。它是由应用承接的城市日常支出，覆盖短途交通、餐厅配送、杂货和门店履约、嵌入式支付，以及由雇主管理的本地出行。Yassir
              官方页面把这种多边结构讲得很明白：公司分别招募乘客、骑手、餐厅、门店、现金代理和企业出行管理者。这意味着它竞争的不只是其他应用，还包括街头出租车、私家车接送、电话直接点单、现金结算和企业内部安排员工交通等既有替代方案。不同细分里的买方和付款方也不同。乘客通常直接付款，餐厅老板通过抽佣经济付费，车队管理员控制雇主交通预算。这一点很重要，因为每一层的采用触发点和摩擦都不同。杂货和外卖依赖商户密度与最后一公里可靠性。网约车依赖本地供给流动性和监管许可。支付依赖信任和充值基础设施，而当地银行卡使用率仍低。结果是，这个市场结构上比出行更宽，但本质上仍是城市、本地和重运营市场。
