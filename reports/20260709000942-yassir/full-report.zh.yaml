        - 阿尔及利亚本地出行或支付适配的公开证据弱
      - - Bolt
        - 大陆级出行与配送平台
        - 200M+ 客户、4.5M+ 合作伙伴、50+ 个国家、850 个城市
        - 乘客、商户、雇主、配送员
        - 资本底座大，具备商旅工具、餐饮和配送栈
        - 公开证据偏广、偏全球；本资料集尚未确认其当前在阿尔及利亚的消费者存在
      - - Careem
        - MENA 全能 App 标杆
        - 覆盖所列市场 80 个城市；司机历史累计收入超过 $4B
        - MENA 各地消费者和商户伙伴
        - 集成出行、餐饮、杂货、支付、会员、到家服务
        - 与 Yassir 的地理重叠有限，缺少阿尔及利亚公开证据
      - - Uber / Uber Eats
        - 全球出行与配送标杆
        - 全球规模巨大；Eats 公开披露当前商户费率框架
        - 城市乘客、商户、企业账户
        - 覆盖出行、出租车、配送、杂货和会员经济
        - 本资料集中的阿尔及利亚本地当前证据弱；在本地化适配之外往往以银行卡为中心
      - - Jumia Food，历史在位平台
        - 已退出的非洲配送在位者
        - 2023 年底退出阿尔及利亚及另外六个市场的外卖业务
        - 外卖消费者和商户
        - 证明一家知名非洲互联网品牌也曾争夺同一套餐厅配送预算
        - 退出更凸显经济性压力，而不是持久竞争力
    notes: 本画像同时纳入当前直接对手、区域专门平台、全球标杆和一个近期退出的在位者，因为 Yassir 横跨多个品类和地域竞争，不是在一张静态同行清单内竞争。
