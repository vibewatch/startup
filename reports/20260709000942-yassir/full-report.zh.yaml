  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件横跨消费者、商户、伙伴和支付流程
        blocks:
          - type: paragraph
            body: >-
              Yassir
              的公开界面支持一张宽而模块化的产品地图。乘客应用把网约车、外卖点单、杂货或门店购物和支付放在一个界面里。商户模块提供仪表盘、促销、库存和订单管理。企业用户获得出行项目、员工分组和预算控制。供给侧伙伴通过司机和骑手入驻流程交互，这些流程要求车辆、文件、安全指引和伙伴应用使用。Yassir
              Cash 增加了一条支付轨道，支持出行、餐饮、购物、充值，并通过银行卡和代理办理退款。关键分析点是，Yassir
              交付的不是一个单体功能。它协调多种用户任务：出行、下单、履约、支付、赚钱和管理。这让产品在运营上更有防守性，但也让底层系统比简单叫车应用或配送平台更复杂。每增加一个模块，都会带来更多流程依赖、支持需求和故障点。
