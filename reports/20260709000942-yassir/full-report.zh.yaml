companyProfile:
  summary: >-
    Yassir
    是一家诞生于阿尔及利亚的私营消费平台，从网约车起步，延伸到外卖、杂货配送、商户工具、企业出行和钱包式支付。公开证据支持它已有真实的多国运营宽度、可信的创始人故事和足够的产品深度；因此，比起单线创业公司，更适合拿配送平台和区域超级应用作参照。同一组资料也显示，相对于投资人自然会用来定价的上市同行，它的披露深度仍偏轻，仍是典型私营公司水平。
