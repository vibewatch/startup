        - 中到高
        - Google 合作支持工具能力
        - 要求提供模型治理、访问控制和审查委员会
    notes: 执行风险上升，因为 Yassir 已不只是网约车创业公司，而是在变成一个多国、受监管的商业平台。
    claimRefs:
