      - number: '8.4'
        title: 最后尽调问题、论点破裂信号与退出准备
        blocks:
          - type: paragraph
            body: >-
              剩下的工作项，正是把一家有意思的公司转成可承销投资所需的材料。投资者需要 2025
              年轮次的真实机制，包括优先权、任何老股转让部分和完全摊薄所有权。还需要按业务线拆分的当前收入、毛利率形态、现金消耗、抽佣率、队列行为，以及退款或取消指标。投资者也需要阿尔及利亚、摩洛哥和塞内加尔的监管备忘录，以判断支付和网约车故事能否干净扩张，还是合规会继续成为反复出现的估值悬顶。在这套材料出现前，Yassir
              更适合被视为观察名单上的高质量资产，而不是值得按价接盘的高确信机会。退出问题很重要，因为私募标记只有在后续投资者或公开市场能快速看懂资产时，才会继续复利。现在的 Yassir
              仍然更像一个亮眼的私人运营故事，而不是能经受申报文件审查的发行人。
