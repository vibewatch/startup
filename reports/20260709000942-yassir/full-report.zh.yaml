  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争场不是单层市场，而是分层结构
        blocks:
          - type: paragraph
            body: >-
              Yassir
              的竞争集必须按使用任务拆分，不能把它当作单一“非洲超级应用”市场。公司自己的公开界面呈现的是一个组合栈：网约车、餐厅点单、门店履约、钱包支付和雇主出行控制。这意味着，今天对阿尔及利亚出行核心施加最直接压力的，是明确宣传阿尔及利亚网约车服务的应用，尤其是
              Heetch 和 inDrive；更广泛的战略压力则来自在其他地理市场拥有更强配送、物流或超级应用宽度的平台。Heetch
              把自己定位为覆盖阿尔及利亚多个城市的逐城城市出行选项，并强调与出租车和公共交通兼容。inDrive 用议价定价和低佣金做差异化。与此同时，Glovo、Bolt、Careem 和 Uber
              之所以重要，是因为它们展示了更深资本池、更大商户生态或更宽服务栈在有效本地化后可能长成什么样。正确结论不是每个对手今天都同样在阿尔及利亚存在；而是 Yassir
              正站在狭窄本地专家和体量大得多的区域或全球标杆竞争者之间。
