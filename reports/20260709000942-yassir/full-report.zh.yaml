  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河或风险因素
      - 为什么有利于 Yassir
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 本地多品类密度
        - 出行、餐饮、门店和钱包能在同一城市彼此强化
        - 如果竞品 App 快速本地化，仅靠品类宽度可能守不住
        - 高
        - 按市场索取城市级用户队列留存和跨品类附着率
      - - 现金转钱包与代理网络
        - 在银行卡使用率低的环境下，比纯银行卡模式更能搭桥
        - 运营复杂度和欺诈 / 合规风险会侵蚀收益
        - 高
        - 审查钱包激活、代理欺诈控制和钱包 GMV 占比
      - - 商户工具和 B2B 出行功能
        - 可比纯叫车 App 制造更高切换成本
        - 如果订单量弱，或其他平台也做出同等工具，优势会消失
        - 中
        - 索取商户流失、促销 ROI 和企业账户留存数据
      - - 阿尔及利亚网约车直接竞争
        - Heetch 与 inDrive 的业务面窄于 Yassir，钱包覆盖可能也不够宽
        - 消费端出行体验仍接近同质化商品
        - 高
        - 按城市测算乘车频次、价格弹性和竞争胜负
      - - 资金雄厚的区域 / 全球对手
        - 留存来源显示，不少大对手尚未深度本地化到阿尔及利亚
        - 如果 Bolt、Uber、Careem 或 Delivery Hero 把同一批城市列为优先，补贴压力可能陡增
        - 高
        - 在竞争对手补贴情景下压力测试利润率韧性
      - - 劳动力供给满意度
        - 本地品牌和需求密度能吸引司机与骑手
        - 收入偏低或监管压力可能触发供给流失或维权行动
        - 高
        - 索取司机 / 骑手收入分布，以及按平台服务年限拆分的流失率
      - - 监管适应能力
        - 本地化运营商可能比外来者更会处理牌照和支付规则
        - 规则仍可能抬高所有玩家成本，并压缩灵活性
        - 中
        - 审查法律准备方案、本地化成本和保险要求
      - - 品类经济性
        - 如果运营足够精细，Yassir 能比弱玩家熬得更久
        - Jumia Food 退出说明，即便有规模，运营商也可能赚不到回报
        - 高
        - 在把扩张写进投资假设前，要求提供按城市和品类拆分的单位经济性
    notes: 本表把不利竞争证据放在核心位置，而非边缘位置。能穿越艰难市场，比讲一个宽泛的超级应用故事更重要。
