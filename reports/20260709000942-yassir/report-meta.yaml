  headquarters: Birkhadem, Algiers, Algeria
  productSummary: Ride-hailing, food and grocery delivery, merchant storefront and logistics tooling, business transportation
    workflows, and Yassir Cash wallet payments layered onto a shared local-commerce platform.
  customerFocus: Urban consumers, drivers and couriers, merchants and restaurants, business mobility admins, and emerging
    wallet users in Algeria and adjacent expansion markets.
  businessModel: Marketplace commissions and service fees from mobility and delivery, merchant software or enablement surfaces,
    enterprise transport workflows, and longer-term monetization optionality from payments and adjacent retail services.
  stage: Series C / private unicorn
