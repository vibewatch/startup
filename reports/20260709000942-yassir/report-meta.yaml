  topStrengths:
  - Yassir has real multi-vertical product proof across rides, delivery, merchants, and wallet-style payments rather than
    a single-point feature set.
  - Historical scale evidence is substantial, including late-2022 claims of 45 cities, six countries, more than 8 million
    users, and more than 100,000 partners.
  - The 2025 financing signal and Forge-marked $1.43 billion valuation indicate that sophisticated capital remained willing
    to back the story beyond the zero-rate era.
  - 'The company’s platform logic is coherent: merchant tooling, local logistics, and payments can reinforce one another if
    execution remains strong.'
  topRisks:
  - Current public valuation support depends heavily on estimated revenue and secondary-market style signals rather than on
    audited, filing-grade operating disclosure.
  - The implied roughly 6.3x trailing-sales headline screens rich relative to Grab, Jumia, and Delivery Hero and only modestly
    above DoorDash.
  - Ride-hailing, privacy, and payments regulation across Algeria, Senegal, and Morocco can slow expansion or raise compliance
    cost.
  - Public customer sentiment is bifurcated, with strong rider-app ratings but weak Trustpilot complaints and materially softer
    driver-app sentiment.
  - Payments, retail, and ad-tech adjacencies are strategically interesting, but public evidence still does not prove they
    generate premium-quality economics.
  unresolvedGaps:
  - Signed 2025 round term sheet, exact ownership changes, liquidation preferences, and any secondary component.
  - Current segment-level revenue, gross profit, burn, and cash position across rides, delivery, stores, wallet, and new adjacencies.
  - Take rate, contribution margin, CAC, cohort durability, cancellations, refunds, and active-customer behavior by major
    city and product line.
  - Regulatory status and management compliance plan for Algeria ride-hailing rules, Morocco payment licensing, and Senegal
    privacy scrutiny.
  - A fuller comparable sheet and clearer evidence of whether current revenue materially exceeds the retained 2024 estimate.
disclaimer: This report is a public-information diligence snapshot prepared as of 2026-07-09. It is not investment advice.
  Several underwriting-critical inputs remain undisclosed by Yassir, especially cap-table terms, current financial statements,
  margins, burn, retention, and segment economics, so any investment decision should be conditioned on direct management diligence
  and a fuller private data room.
