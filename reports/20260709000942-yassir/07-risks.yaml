chapter:
  number: 7
  title: Risks
summary: Yassir’s biggest near-term risk is not lack of demand but legal and operating formalization. Across Algeria, Morocco, and Senegal, public sources show that ride-hailing and data-protection rules are tightening or being actively tested, while Yassir is simultaneously expanding into payments, retail, and adtech. Operationally, weak complaint-platform signals, lower driver-app sentiment, and a deep Google Cloud concentration create meaningful service, partner, and platform-dependency risk. Financially, the company’s private-market opacity means investors can see the risk vectors clearly but still cannot quantify margin, burn, or runway resilience with confidence.
sections:
- id: regulatory-legal-and-data-governance-risk
  title: Regulatory uncertainty and cross-border data compliance are the most visible external risk cluster
  body: 'Yassir now operates in a part of the stack where several legal regimes are moving at once. Algeria is formalizing ride-hailing through a draft law that would recognize app-based transport under a clearer framework, but the fact that legislation is still being pushed through government confirms that a core part of Yassir’s original business has operated in ambiguity. Morocco is even less settled: public statements say app-based transport still lacks a clear framework, while the transport minister separately says operating without proper authorization is illegal. In Senegal, taxi unions have already pressed their case against Yassir and peers in court, and the data-protection regulator has publicly warned Yassir to comply with local privacy rules. Those transport and privacy risks sit on top of a broader compliance burden. Algeria’s amended Law 18-07 adds DPO, recordkeeping, DPIA, breach-notification, and authorization obligations; Morocco’s Law 09-08 and CNDP regime add filing, transfer,
    and sanctions exposure. For a company that collects location, payments, ride history, and merchant data across several countries while adding adtech and fintech layers, compliance risk is not peripheral — it is central to whether the platform can keep scaling without interruption.'
  claimRefs:
