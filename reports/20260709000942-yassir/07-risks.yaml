- id: operational-service-quality-and-platform-dependency-risk
  title: Service quality, safety, and cloud concentration create operational downside even without a public crisis record
  body: 'The operational risk picture is mixed: there is no single publicly documented catastrophe, but there are several credible warning signals. Trustpilot complaints focus on refunds, slow support, bad vehicle condition, and drivers renegotiating displayed prices. The driver app’s weaker public rating versus the rider app suggests that supply-side satisfaction may be structurally worse than demand-side top-line sentiment implies. Regulatory reporting in Algeria explicitly cites harassment, disputes, and passenger safety as reasons formal oversight is needed. At the same time, Google Cloud’s published case study shows that Yassir’s platform has been deeply tied to one vendor ecosystem from the beginning: Google Kubernetes Engine, Cloud Run, Pub/Sub, BigQuery, Dataflow, Dataplex, Security Command Center, Vertex AI, and planned Apigee-led API expansion. That concentration is not automatically bad — it may have enabled rapid scale — but it does create outage, pricing, vendor-negotiation,
    and security-surface concentration. Yassir’s move into retail through Uno and into retail-media via Kawarizmi further raises the operational burden from pure software orchestration to warehouses, kiosks, checkout flows, profiling, and data-rights governance.'
  claimRefs:
