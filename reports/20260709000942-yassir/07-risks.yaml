  evidenceGaps:
  - type: missing-source
    severity: material
    topic: licensing-and-filing-verification
    missingEvidence: Direct evidence of Yassir’s current transport licenses, payment permissions, privacy declarations, or regulator acknowledgements in each operating market.
    whyItMatters: The legal thesis depends on whether Yassir is merely exposed to future regulation or already fully compliant with current rules and filings.
    diligencePath: Request country-by-country regulator filings, licenses, warning letters, approvals, and outside-counsel opinions for Algeria, Morocco, Senegal, and Tunisia.
    relatedQuestionRefs:
    - QR004
    - QR005
    - QR007
    - QR025
    relatedTableRefs:
