  - type: missing-source
    severity: material
    topic: incident-and-support-metrics
    missingEvidence: Internal support SLAs, refund-resolution times, cancellation rates, safety incidents, fraud losses, and outage history.
    whyItMatters: Complaint-platform anecdotes are enough to flag risk but not enough to determine whether the issue is systemic, worsening, or already under control.
    diligencePath: Obtain support dashboards, safety incident logs, driver complaints, fraud metrics, and postmortem history by country and product line.
