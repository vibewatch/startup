callouts:
- calloutType: risk
  title: Morocco Is the Sharpest Current Legal Exposure
  body: Public statements simultaneously say Morocco lacks a clear ride-hailing framework and that operating without authorization is illegal. That combination creates a high-severity legal overhang for Yassir’s mobility and fintech ambitions in one of its core expansion markets.
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
- calloutType: risk
  title: Google Cloud Concentration Is a Real Operating Dependency, Not an Abstract Architecture Note
  body: Yassir’s own vendor case study says the platform has been powered by Google Cloud from the beginning and now uses a broad stack spanning compute, data, security, analytics, and AI. That enables speed, but it also concentrates outage, pricing, and roadmap risk in one ecosystem.
  claimRefs:
  - CR020
  - CR021
  - CR022
  - CR031
  - CR043
- calloutType: insight
  title: The Main Problem Is Visible Risk Vectors Plus Invisible Financial Cushion
  body: Public sources are enough to identify regulatory, operational, and integration risks, but not enough to size how much margin, cash, or governance capacity Yassir has to absorb them. That mismatch should directly lower valuation confidence.
  claimRefs:
  - CR026
  - CR027
  - CR035
  - CR039
  - CR040
