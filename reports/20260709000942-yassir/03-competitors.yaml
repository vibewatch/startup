    - TP004
  - type: private-evidence-only
    severity: material
    topic: unit-economics-by-category
    missingEvidence: Public current take rates, driver or courier commissions, retention cohorts, and contribution margins for Yassir by rides, food, grocery, and payments.
    whyItMatters: A local-super-app moat only matters if category breadth improves economics rather than simply broadening subsidy exposure.
    diligencePath: Ask management for current take-rate schedules, marketing spend, contribution margins, and cross-category attach rates by core city.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
