  evidenceGaps:
  - type: missing-source
    severity: material
    topic: algeria-market-share
    missingEvidence: A current, auditable, country-level market-share split for Algeria ride-hailing and food delivery across Yassir, Heetch, inDrive, and other relevant operators.
    whyItMatters: Without a clean share view, competitive conclusions rely on product surfaces, city coverage, and indirect scale signals rather than verified demand share.
    diligencePath: Request recent order, GMV, and active-user share estimates by city from management or obtain a paid market study covering Algeria app mobility and delivery.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
