  - - Glovo
    - Public app supports cash, card, PayPal, and Prime membership; merchant fee not disclosed
    - Subscription and promo-led delivery frequency
    - Powerful retention tool for delivery categories
    - medium
    - No public current merchant rate in retained source set
  - - Bolt
    - Ride app shows upfront pricing and multiple payment methods; merchant page highlights pickup/delivery options and POS integrations
    - Business travel plus Bolt Food merchant tooling
    - Competes through convenience and merchant analytics rather than public fee transparency
    - medium
    - Public merchant fee schedule not retained
  - - Careem
    - Careem Plus advertises no delivery fee; food page shows 9,500 restaurants on UAE page
    - Membership-led super-app bundle
    - Shows how larger MENA apps use subscription benefits to retain customers
    - medium
    - Food economics are market-specific and UAE page is not Algeria-local
  - - Uber Eats
    - US help page discloses 20% / 25% / 30% delivery fees, 7% / 10% pickup, 15% self-delivery
    - Tiered visibility and membership economics via Uber One
    - Demonstrates how large delivery platforms explicitly price merchant access and demand generation
    - high
    - Fee schedule is US-specific, not evidence of Algeria pricing
  notes: The table compares public pricing cues, not apples-to-apples audited net takes. Disclosure quality varies sharply by company and region.
