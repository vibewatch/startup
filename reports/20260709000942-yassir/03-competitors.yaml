- id: capability-breadth-and-local-fit
  title: Yassir’s edge is local breadth and payment fit, not globally unique features
  body: 'When the field is mapped by capabilities, Yassir’s public product stack is broader than local Algeria ride specialists but still narrower in disclosed scale than the biggest regional and global platforms. Yassir’s app-store and official merchant pages support a combined proposition of rides, food, grocery or shopping, payments, merchant dashboards, and employer transport programs. Heetch and inDrive look more specialized: each is strong on urban mobility, but neither current public Algeria evidence nor current public app surfaces show the same wallet-agent layer or merchant tooling depth. Glovo is much stronger on multi-category delivery than on mobility. Careem and Uber show the opposite problem for Yassir: they demonstrate how a larger app can combine transport with food, grocery, and memberships, yet their public localization evidence is stronger in other countries than in Algeria itself. Bolt spans mobility, food, and business travel with substantial merchant tooling, but its
    public evidence is again much more continental or global than Algeria-specific. So Yassir’s best differentiation case is not ‘we do something no one else can imagine’; it is ‘we stitched together the categories, payment bridges, and local operating motions that matter in Algeria and adjacent Francophone markets.’'
