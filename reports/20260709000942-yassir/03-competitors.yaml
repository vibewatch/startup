- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk factor
  - Why it helps Yassir
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Local multi-category density
    - Rides, food, stores, and wallet can reinforce each other in the same city
    - If rival apps localize quickly, category breadth alone may not hold
    - high
    - Request city-level cohort retention and cross-category attach by market
  - - Cash-to-wallet and agent network
    - Helps bridge low-card environments better than card-only models
    - Operational complexity and fraud/compliance risk can erode benefits
    - high
    - Review wallet activation, agent fraud controls, and wallet GMV share
  - - Merchant tooling and B2B transport features
    - Can create higher switching costs than pure ride apps
    - Benefits disappear if order volume is weak or tooling parity emerges elsewhere
    - medium
    - Ask for merchant churn, promo ROI, and business-account retention
  - - Direct Algeria ride rivalry
    - Heetch and inDrive are narrower than Yassir and may lack wallet breadth
    - Mobility is still close to commodity at the consumer surface
    - high
    - Measure ride frequency, price elasticity, and win/loss by city
  - - Deep-pocketed regional/global rivals
    - Many large rivals are not yet deeply Algeria-local in retained sources
    - If Bolt, Uber, Careem, or Delivery Hero prioritize the same cities, subsidy pressure can spike
    - high
    - Stress test margin durability under competitor subsidy scenarios
  - - Worker supply satisfaction
    - Local brand and demand density can attract drivers and couriers
    - Low earnings or regulatory pressure can trigger supply churn or activism
    - high
    - Request driver/courier earnings distributions and churn by platform tenure
  - - Regulatory adaptation
    - Localized operators may navigate licensing and payment rules better than outsiders
    - Rules can still raise costs for everyone and narrow flexibility
    - medium
    - Review legal-readiness plan, localization costs, and insurance requirements
  - - Category economics
    - Yassir can outlast weaker players if operations are tight
    - Jumia Food exit shows even scaled operators can fail to earn returns
    - high
    - Demand unit economics by city and category before underwriting expansion
  notes: The register treats adverse competitor evidence as central, not peripheral. Surviving a tough market matters more than telling a broad super-app story.
