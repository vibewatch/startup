- id: pricing-distribution-and-switching-costs
  title: Pricing pressure is visible; switching costs look weak for consumers and mixed for merchants
  body: 'Public pricing and packaging evidence points to a structurally competitive market. inDrive publicly leans on rider-driver fare negotiation and a roughly 12% commission according to a 2025 interview. Heetch’s earlier public description pointed to a 15% cut with both cash and card payment. Uber Eats’ 2026 US merchant help page shows how mature delivery platforms explicitly tier merchant economics at 20% to 30% for delivery orders, with lower pickup or self-delivery rates. Glovo, Careem, and Uber all lean on membership or promotional mechanisms such as Prime, Careem Plus, and Uber One to stimulate order frequency, while Bolt markets incremental merchant order volume, new-customer acquisition, and integrations. Those signals imply low consumer switching costs: most major apps promise fast booking, real-time tracking, promos, and familiar payment options. Merchant switching costs are higher only where a platform proves repeat demand, better analytics, or workflow integration. Worker-side
    loyalty also looks fragile because pricing, commissions, and earnings opportunities can change quickly across platforms and markets.'
