  rows:
  - - Yassir
    - Ride fares shown in app; FAQ still references cash ride settlement; public merchant take rates not disclosed
    - Cross-category app plus wallet and promo capability
    - Helpful consumer/payment fit, but unit economics cannot be underwritten from public materials
    - medium
