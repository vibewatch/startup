tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / alternative
  - Category
  - Scale / funding marker
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Yassir
    - Local super-app
    - 150,000+ partners in 58 cities on Google Play; rides, food, shopping, payments
    - Consumers, merchants, employers, drivers, couriers
    - Local category breadth plus wallet-agent layer and business-transport tooling
    - Public disclosures on active users, GMV, take rates, and country mix remain limited
  - - Heetch
    - Ride-hailing specialist
    - Current Algeria city footprint plus 2019 $42M Series B disclosure
    - Urban riders and drivers in French-speaking Africa
    - Cash/card support, local-taxi adaptation, fair-commission positioning
    - Narrower category scope than Yassir; no evidenced wallet or grocery layer
  - - inDrive
    - Ride-hailing specialist expanding toward super-app
    - Nearly 900 cities globally; ~12% commission per 2025 interview
    - Price-sensitive riders and drivers
    - Negotiated fares, low commission, transparent bids
    - Driver-earnings complaints and limited public Algeria delivery or wallet breadth
  - - Glovo
    - Regional multi-category delivery
    - 80M+ downloads, 240,000 restaurants/stores, 25 countries
    - Consumers, riders, merchants, couriers
    - Strong delivery breadth across food, groceries, shops, and memberships
    - Weak public evidence of local Algeria mobility or payments fit
  - - Bolt
    - Continental mobility and delivery platform
    - 200M+ customers, 4.5M+ partners, 50+ countries, 850 cities
    - Riders, merchants, employers, couriers
    - Large capital base, business-travel tooling, food and delivery stack
    - Public evidence is broad/global; Algeria-specific current consumer presence is not established here
  - - Careem
    - MENA everything-app benchmark
    - 80 cities across listed markets; over $4B earned by captains historically
    - Consumers and merchant partners across MENA
    - Integrated rides, food, groceries, payments, memberships, home services
    - Geographic overlap with Yassir is partial and public Algeria evidence is absent
  - - Uber / Uber Eats
    - Global transport and delivery benchmark
    - Mass global scale; public current merchant fee framework disclosed for Eats
    - Urban riders, merchants, business accounts
    - Breadth in rides, taxi, delivery, grocery, and membership economics
    - Weak current Algeria-local evidence in this source set; often card-centric outside localized adaptations
  - - Jumia Food (historical incumbent)
    - Exited African delivery incumbent
    - Exited food delivery in Algeria plus six other markets at end-2023
    - Food-delivery consumers and merchants
    - Relevant proof that a known African internet brand contested the same restaurant-delivery budget
    - Exit underscores economics stress rather than durable competitive strength
  notes: This profile mixes current direct rivals, regional specialists, global benchmarks, and one recent exited incumbent because Yassir competes across multiple categories and geographies rather than inside one static peer list.
