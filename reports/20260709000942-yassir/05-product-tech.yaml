- id: architecture-and-expansion-layers
  title: The architecture is increasingly layered around payments, retail, and media
  body: 'The visible architecture is operational rather than deeply code-level, but it is still specific enough to map. At the base are consumer ordering and mobility flows. On top of that sit supply-side partner apps and merchant tooling. Above those sits the payment and agent layer, which bridges cash-heavy local behavior into in-app spending and refunds. Recent acquisitions suggest Yassir is adding two entirely new layers: omnichannel retail infrastructure through Uno and retail-media or adtech infrastructure through Kawarizmi. Innovation Village’s reporting on Uno describes digital kiosks, click-and-collect, integrated Yassir Cash payments, and warehouse reorientation, while Wamda’s Kawarizmi coverage describes programmatic advertising, first-party data monetization, and privacy-first media infrastructure across mobile, connected TV, and the open web. Taken together, these moves show a company evolving from pure marketplace orchestration toward a broader commerce stack that combines
    apps, physical nodes, payments, and media monetization.'
