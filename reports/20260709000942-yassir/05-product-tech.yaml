    - TE004
  - type: missing-source
    severity: material
    topic: reliability-quality-metrics
    missingEvidence: Service-level metrics such as dispatch success, cancellation rates, delivery-time reliability, refund rates, wallet fraud, and merchant churn.
    whyItMatters: Without operating metrics, mature-looking workflows cannot be converted into a confident quality or reliability assessment.
    diligencePath: Obtain KPI dashboards for top cities and each major module (rides, food, grocery, wallet).
