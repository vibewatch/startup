- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Consumer app shell
    - Entry point for rides, food, grocery, and payments
    - Mobile app adoption and device permissions
    - App breadth increases QA and support complexity
  - - Partner apps
    - Enable driver and courier fulfilment
    - Driver / courier onboarding and device quality
    - Supply-side churn or poor onboarding can hurt service quality
  - - Merchant dashboards
    - Restaurant and store operations management
    - Merchant adoption and order volume
    - Weak integration depth could reduce retention
  - - Wallet / agent network
    - Top-up, refund, in-app settlement, cash conversion
    - Agents, banking rails, PIN security, compliance
    - Fraud, settlement, and regulatory risk
  - - Location / dispatch / tracking flow
    - Maps demand to supply and supports delivery tracking
    - Location permissions, mapping, mobile connectivity
    - Poor routing or tracking harms trust and unit economics
  - - Retail nodes / fulfilment points
    - Support click-and-collect, inventory, and offline commerce
    - Stores, kiosks, warehouses, procurement
    - Inventory and physical-ops risk
  - - Retail media / adtech layer
    - Monetize first-party data and merchant demand
    - Kawarizmi programmatic expertise and privacy governance
    - Brand-safety, privacy, and integration risk
  - - Support / compliance layer
    - Customer service, legal entities, privacy controls, partner checks
    - Human support teams and country-specific legal setup
    - Process-heavy controls can be costly and inconsistently executed
  notes: This is an operating architecture map inferred from current public surfaces; Yassir does not publish a deep technical architecture diagram.
