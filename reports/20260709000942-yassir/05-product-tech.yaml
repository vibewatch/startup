  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-tech-surface
    missingEvidence: A public API doc set, status page, architecture doc, security whitepaper, or open technical repo directly tied to Yassir’s platform.
    whyItMatters: The platform touches mobility, commerce, payments, and now adtech, but outside investors cannot inspect its public technical maturity the way they can for more developer-facing products.
    diligencePath: Request internal architecture diagrams, API documentation, incident logs, on-call metrics, and external security review materials.
    relatedQuestionRefs:
    - QE017
    - QE023
    relatedTableRefs:
