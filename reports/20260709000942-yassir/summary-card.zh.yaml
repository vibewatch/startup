  topStrengths:
    - Yassir 在出行、配送、商户和类钱包支付上都有多条产品线验证，不只是单点功能。
    - 历史规模证据扎实，包括 2022 年底披露的 45 个城市、6 个国家、超过 8 million 用户和超过 100,000 个合作伙伴。
    - 2025 年融资信号和 Forge 标记的 $1.43 billion 估值表明，零利率时代结束后，成熟资本仍愿意支持这个故事。
    - 公司的平台逻辑自洽：商户工具、本地履约和支付若执行到位，可以相互强化。
  topRisks:
    - 当前公开估值支撑主要靠估算收入和二级市场式信号，而不是经审计、可用于监管申报级别的经营披露。
    - 隐含约 6.3x 过去十二个月销售额的头条倍数，相比 Grab、Jumia 和 Delivery Hero 偏高，仅略高于 DoorDash。
    - Algeria、Senegal 和 Morocco 的网约车、隐私和支付监管可能拖慢扩张，或推高合规成本。
    - 公开客户口碑分化明显：乘客端 App 评分强，但 Trustpilot 投诉偏弱，司机端情绪也明显更软。
    - 支付、零售和广告技术等相邻业务有战略吸引力，但公开证据仍未证明它们能跑出优质经济性。
  unresolvedGaps:
    - 2025 年融资的已签署条款书、精确股权变化、清算优先权，以及是否包含老股交易。
    - 出行、配送、门店、钱包和新相邻业务当前分部收入、毛利润、烧钱速度和现金状况。
    - 按主要城市和产品线拆分的抽佣率、贡献利润率、获客成本（CAC）、队列耐久度、取消、退款和活跃客户行为。
    - Algeria 网约车规则、Morocco 支付牌照和 Senegal 隐私审查的监管状态，以及管理层合规计划。
    - 更完整的可比公司表，以及当前收入是否显著高于沿用 2024 年估算值的更清晰证据。
