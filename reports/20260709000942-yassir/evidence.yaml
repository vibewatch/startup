evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: footprint-consistency
    missingEvidence: A management-certified country, city, office, and home-market breakdown as of the run date.
    whyItMatters: >-
      Current public materials disagree on how many markets and cities Yassir actually serves, which affects scale
      comparisons and later market-share work.
    diligencePath: Request the current internal footprint dashboard or the latest investor update used for board reporting.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and post-Series-C cap table.
    whyItMatters: Founder concentration and investor control cannot be judged properly without formal governance documents.
    diligencePath: Ask management for the latest cap table, board observer agreements, and governance chart under NDA.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: series-c
    missingEvidence: >-
      Primary documentation for the 2025 Series C, including round size, price per share, valuation, and investor
      identities.
    whyItMatters: >-
      The current public evidence for unicorn status relies on tracker data and secondary references rather than on a
      public company filing or release.
    diligencePath: Request signed financing documents or an investor letter confirming the 2025 round terms.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: current-counters
    missingEvidence: >-
      A reconciled 2026 operating-metrics pack that explains how downloads, users, partners, employees, and cities are
      defined across surfaces.
    whyItMatters: >-
      Yassir’s growth story is strong, but inconsistent metric definitions reduce confidence in benchmarking and in
      cover-fact precision.
    diligencePath: Obtain the latest internal KPI definitions sheet and monthly operating dashboard from finance or strategy.
    relatedQuestionRefs:
      - QO014
      - QO015
  - type: missing-source
    severity: material
    topic: independent-gmv
    missingEvidence: >-
      A public, independent GMV or ride-hailing and food-delivery market-size estimate specific to Algeria rather than
      to broad African or MENA categories.
    whyItMatters: >-
      Without a country-specific GMV or segment TAM source, market sizing must rely on constrained user-pool and
      behavior lenses rather than direct spend data.
    diligencePath: >-
      Request country-level GMV from management or secure a paid analyst report covering Algerian ride-hailing and
      delivery.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: country-mix
    missingEvidence: Yassir’s current country-level volume, order, and revenue mix across Algeria and its expansion markets.
    whyItMatters: >-
      A strong home-market position does not reveal how much of current demand still comes from Algeria versus Morocco,
      Tunisia, Senegal, South Africa, France, or Canada.
    diligencePath: Ask for the latest management dashboard showing orders, GMV, and revenue by country and city.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: metric-definition-mix
    missingEvidence: >-
      A reconciled definitions sheet for “users,” “downloads,” “partners,” “cities,” and digital-payment behavior across
      official and external sources.
    whyItMatters: >-
      Market sizing is highly sensitive to whether a metric represents registrations, active users, total population,
      adult population, or transaction counts.
    diligencePath: >-
      Collect the metric definitions management uses internally and remap public sources to those definitions before
      refresh.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM004
  - type: missing-source
    severity: material
    topic: algeria-market-share
    missingEvidence: >-
      A current, auditable, country-level market-share split for Algeria ride-hailing and food delivery across Yassir,
      Heetch, inDrive, and other relevant operators.
    whyItMatters: >-
      Without a clean share view, competitive conclusions rely on product surfaces, city coverage, and indirect scale
      signals rather than verified demand share.
    diligencePath: >-
      Request recent order, GMV, and active-user share estimates by city from management or obtain a paid market study
      covering Algeria app mobility and delivery.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: unit-economics-by-category
    missingEvidence: >-
      Public current take rates, driver or courier commissions, retention cohorts, and contribution margins for Yassir
      by rides, food, grocery, and payments.
    whyItMatters: >-
      A local-super-app moat only matters if category breadth improves economics rather than simply broadening subsidy
      exposure.
    diligencePath: >-
      Ask management for current take-rate schedules, marketing spend, contribution margins, and cross-category attach
      rates by core city.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
      - TP004
  - type: missing-source
    severity: minor
    topic: merchant-and-worker-multi-homing
    missingEvidence: >-
      Direct public evidence on how many Algerian merchants, drivers, or couriers actively multi-home across Yassir and
      rival apps.
    whyItMatters: >-
      Switching-cost and moat claims remain partly inferential without measured overlap on the supply and merchant
      sides.
    diligencePath: >-
      Collect merchant overlap data, driver-app mix surveys, and churn reasons from internal operations teams or
      third-party field research.
