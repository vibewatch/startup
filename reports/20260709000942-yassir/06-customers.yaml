- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer/User/Payer Role
  - Primary Use Case
  - Scale / Proof
  - Revenue / Strategic Value
  - Key Gap
  rows:
  - - B2C consumers
    - User and payer
    - City rides, meals, groceries, in-app payments
    - Consumer app lists four core services; 118k Apple ratings
    - High-frequency transaction demand and cross-sell base
    - No disclosed MAU, order frequency, or cohort retention
  - - Drivers
    - User and supplier
    - Fulfil ride demand and earn flexible income
    - Dedicated driver app; 1.8M AppBrain downloads; named partner stories
    - Liquidity and service availability for mobility
    - No disclosed driver churn, utilization, or payout quality metrics
  - - Couriers / delivery partners
    - User and supplier
    - Fulfil food and grocery orders
    - Dedicated courier onboarding page with requirements and 24-hour assistance
    - Liquidity for food and grocery verticals
    - No disclosed courier productivity, churn, or incentive intensity
  - - Restaurants
    - Merchant and channel partner
    - Acquire orders, manage menu/promotions
    - Restaurant onboarding, dashboard, and named testimonials
    - Expands assortment and frequency of food use case
    - No disclosed merchant count by market, take rate, or retention
  - - Stores / grocers
    - Merchant and channel partner
    - Sell goods through Yassir Market and store tooling
    - Store dashboard page plus named seller testimonials
    - Broadens basket size and household repeat use
    - No disclosed AOV, inventory, or repeat-buyer metrics
  - - Business accounts
    - Buyer/admin, indirect payer
    - Employee transport, meals, procurement, parcels, gift cards
    - Yassir Business page plus Lamaraz and BATIMETAL testimonials
    - Potential higher-value contracts and multi-product expansion
    - No public contract count, spend, renewal, or NRR data
  - - Wallet / payment users
    - User and payer
    - Top-up, store value, and pay in-app
    - Yassir Cash page and app-store descriptions
    - Can raise attach rate and reduce friction across categories
    - No public wallet MAU, balance, fraud, or settlement metrics
  notes: Yassir combines consumer demand, supply-side labor, merchants, and enterprise admins in one ecosystem. Public proof is strongest for existence and workflow, not segment economics.
