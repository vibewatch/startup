- id: repeat-usage-satisfaction-and-support-friction
  title: Satisfaction proxies are positive at the top line, but support and service quality remain the main public friction
  body: 'The public satisfaction record is bifurcated. App-store surfaces look healthy: the main consumer app carries a strong Apple rating and the broader third-party review ecosystem still sees Yassir as broadly legitimate and usable. But complaint-heavy surfaces tell a different story. Trustpilot shows a 1.6 out of 5 score from 75 reviews, with recurring complaints about refund delays, unresponsive support, vehicle condition, courier issues, and drivers trying to renegotiate displayed prices. The signal gets more interesting when the driver side is added: the iPhone driver app rating is materially weaker than the rider app rating, suggesting that supply-side experience may be more strained than consumer top-line sentiment implies. What is missing is the metric set that would actually resolve the debate: repeat-order rates, frequency cohorts, churn, NRR, GRR, cancellation rates, failed-delivery rates, refund SLAs, and complaint-resolution times. Without those, public ratings are directionally
    useful but not enough to prove durable customer love.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
