- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Current Public Signal
  - Likely Impact
  - Diligence Path
  rows:
  - - Consumer multi-category cross-sell
    - Ride + food + grocery + payments sit in one consumer app
    - Could raise order frequency and lower re-acquisition cost
    - Request multi-category adoption and repeat-purchase cohorts
  - - Business land-and-expand
    - Mobility, meals, procurement, parcels, and vouchers appear in one business suite
    - Could raise contract value and stickiness
    - Request enterprise customer count, average spend, and renewals
  - - Merchant ecosystem expansion
    - Restaurant and store tooling indicates deeper merchant dependence potential
    - Could improve assortment and local density
    - Request active-merchant count, merchant retention, and top-city mix
  - - Country concentration
    - Geography breadth is real but city/country counts conflict across sources and vintages
    - One or two core markets may still dominate usage
    - Request GMV, orders, and users by country and top city
  - - Enterprise concentration
    - Only two named business testimonials are public
    - Enterprise business may still be tiny or concentrated
    - Request top-10 business customers and share of B2B revenue
  - - Merchant concentration
    - No top-merchant share or vertical mix disclosed
    - Large merchant loss or sector shock could hurt assortment
    - Request merchant GMV concentration and top-merchant churn
  - - Support / refund failure risk
    - Trustpilot complaints repeatedly cite slow refunds and poor support
    - Can directly depress repeat usage and brand trust
    - Request support backlog, resolution SLA, and complaint trend data
  notes: The expansion logic is credible, but concentration cannot be quantified from public materials. Support quality is the clearest public threat to repeat use.
