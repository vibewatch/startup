figures:
- id: FU001
  title: Customer Journey Map — Multi-Sided Yassir Lifecycle
  type: journey-map
  layout: wide
  summary: Yassir’s lifecycle spans discovery, first transaction, repeat use, cross-sell, support, and advocacy across consumer, merchant, driver, and business cohorts.
  data:
    items:
    - label: Discovery
      description: App-store search, word of mouth, local brand awareness, social media, or direct business outreach introduces the platform.
    - label: Onboarding
      description: Consumer installs app; merchants register and validate; drivers provide documents and training; business admins contact sales and set programs.
    - label: First Transaction
      description: Ride booking, meal order, grocery basket, first driver trip, or first employee transport request creates the initial conversion event.
    - label: Operational Use
      description: Tracking, dispatch, dashboard use, budget control, order management, and partner-app analytics create recurring workflow value.
    - label: Cross-Sell / Expansion
      description: Users add food, groceries, or wallet payments; business accounts add meals, procurement, parcels, and vouchers.
    - label: Support / Advocacy / Churn
      description: Satisfied users rate the app or repeat usage; failures surface through refund, support, vehicle-quality, or price-dispute complaints.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU031
  - CU032
  - CU034
