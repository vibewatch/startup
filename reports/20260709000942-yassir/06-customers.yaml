- id: adoption-trajectory-and-public-customer-proof
  title: Adoption is clearly real, but current public proof is strongest at the proxy level
  body: 'Yassir’s public customer proof is strongest where platforms and pages expose living usage traces rather than where management discloses audited metrics. The iPhone app listing shows a 4.6 out of 5 rating from 118,000 ratings, while the driver iPhone app shows a lower 3.4 out of 5 from 1,300 ratings. Third-party Android intelligence from AppBrain reports about 1.8 million cumulative downloads and roughly 35,000 ratings for the driver app, which is consistent with a genuinely scaled supply-side user base. Official partner pages add production evidence: restaurants and stores are onboarded through registration, validation, training, and dashboard flows; the business page contains named testimonials from Lamaraz Hotel and BATIMETAL; the restaurant and store pages contain named testimonials from operators across Algeria, Morocco, Senegal, and Tunisia. None of this proves exact retention, revenue, or contract quality, but it does prove that Yassir is operating across several active customer
    constituencies rather than presenting a purely aspirational marketplace story.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
