chapter:
  number: 6
  title: Customers
summary: Yassir clearly has real multi-sided adoption, but the public customer record is uneven. App-store evidence, partner onboarding surfaces, and named testimonials confirm that consumers, drivers, merchants, and some business clients actively use the platform across mobility, food, grocery, and payments. At the same time, Yassir discloses almost no cohort retention, repeat-purchase, contract, or concentration data, so durability has to be inferred from proxy signals rather than underwritten directly. The strongest adverse customer evidence is persistent support, refund, vehicle-quality, and price-dispute complaints on public review platforms, plus materially weaker driver-app sentiment than consumer-app sentiment.
sections:
- id: customer-base-and-ecosystem-segmentation
  title: Yassir serves a multi-sided ecosystem rather than a single end-customer segment
  body: 'Public surfaces show that Yassir should be analyzed as a customer ecosystem, not a single B2C app. The consumer app bundles ride-hailing, food delivery, grocery or market orders, and payments in one interface. On the other side of the marketplace, drivers and couriers are not just supply; they are active users of separate partner products with onboarding, training, analytics, and payout workflows. Restaurants and stores get dashboards, order management, promotions, and onboarding support. A fifth segment sits on top of this stack: business administrators who use Yassir Business for employee transport, office meals, procurement, parcel delivery, and gift cards. This breadth matters because it creates cross-sell and retention opportunities, but it also means customer quality must be judged across several cohorts with different economics and expectations. A rider can be satisfied even when a driver is not; a merchant can be retained even if consumer complaint volume rises; an enterprise
    account can expand even when public consumer sentiment is mixed.'
  claimRefs:
