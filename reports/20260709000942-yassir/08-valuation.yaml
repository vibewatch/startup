  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-round-terms
    missingEvidence: The signed 2025 Series C term sheet, exact ownership changes, any preference stack, and any secondary
      component of the round.
    whyItMatters: Without exact security terms and dilution mechanics, the public $1.43B headline cannot be converted into
      reliable entry-price underwriting.
    diligencePath: Request cap-table snapshots, the Series C term sheet, side letters, and a full financing history through
      2026.
    relatedQuestionRefs:
    - QV002
    - QV003
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-cohorts
    missingEvidence: Current take rate, gross margin, CAC, repeat behavior, cancellation rates, refunds, and segment contribution
      margin by core vertical.
    whyItMatters: Those variables determine whether Yassir deserves a richer super-app multiple or should be priced like a
      riskier logistics marketplace.
    diligencePath: Request a segment P&L and cohort pack covering rides, food, stores, wallet, and new adjacencies.
    relatedQuestionRefs:
    - QV020
    - QV021
    - QV023
    - QV027
    relatedTableRefs:
    - TV002
    - TV003
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A fuller peer sheet covering more African, MENA, and listed platform comparables with refreshed revenue
      and valuation captures.
    whyItMatters: The current comp table is sufficient for scenario framing but not exhaustive enough to claim a complete
      peer set for Yassir.
    diligencePath: Extend the comp sheet with additional current public-market captures and private transaction references
      before investment-committee pricing.
