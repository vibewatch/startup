- id: final-diligence-asks-thesis-breaks-and-exit-readiness
  title: Final diligence asks, thesis-breaks, and exit readiness
  body: The remaining work items are exactly the ones that convert an interesting company into an underwritable investment.
    Investors need the actual 2025 round mechanics, including preferences, any secondary component, and fully diluted ownership.
    They need current revenue by line of business, gross-margin shape, cash burn, take rate, cohort behavior, and refund or
    cancellation metrics. They also need regulatory memos for Algeria, Morocco, and Senegal to understand whether the payments
    and ride-hailing stories can expand cleanly or whether compliance will remain a recurring valuation overhang. Until that
    package exists, Yassir looks best treated as a high-quality asset on a watchlist rather than a price-taking conviction
    opportunity. The exit question matters because a private mark only compounds if later investors or public markets can
    understand the asset quickly. Right now, Yassir still looks more like an impressive private operating story than a filing-grade
    issuer.
