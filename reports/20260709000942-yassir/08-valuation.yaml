- id: TV001
  title: Recommendation Summary Table
  columns:
  - Dimension
  - Current view
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - Research more
    - The company looks real and strategically interesting, but current public evidence does not prove that paying near the
      last private mark is attractive.
    - Continue diligence but do not force a price-taking decision.
  - - Confidence
    - Medium
    - The funding event and scale proof are credible, yet the denominator still relies on estimates and thin secondary data.
    - Use scenario framing instead of conviction underwriting.
  - - Risk rating
    - High
    - Regulation, disclosure gaps, and service-quality complaints can all compress valuation quickly.
    - Require hard kill triggers and downside monitoring.
  - - Valuation stance
    - Fair-to-stretched
    - A roughly 6.3x implied trailing-sales mark sits above most retained public comps.
    - Only pay the last mark if management proves materially better economics.
  - - What would improve the call
    - Lower price or better data
    - Either cheaper entry or filing-grade disclosure could improve the risk/reward.
    - Revisit after data room review or a price reset.
  notes: This table compresses the chapter conclusion into IC-ready language; it is not a substitute for cap-table review
