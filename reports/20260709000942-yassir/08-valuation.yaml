- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale
    - Yassir already has multi-country, multi-vertical operating proof and institutional funding validation.
    - Most of the strongest scale datapoints are historical and still do not prove current economics.
    - Request updated 2025 and 2026 operating dashboard.
  - - Payments upside
    - Wallet and payment surfaces could turn mobility and delivery trust into a higher-quality fintech layer.
    - Current public proof shows existence of the wallet, not premium payment economics or licensing certainty.
    - Request wallet TPV, take rate, active users, and regulator correspondence.
  - - Merchant ecosystem
    - Stores and driver tools suggest a reusable platform rather than a single-product app.
    - Reusable workflows can still produce low-margin logistics economics if retention and subsidy profiles disappoint.
    - Review segment gross margin, repeat behavior, and merchant concentration.
  - - Round quality
    - A $1.43B mark and internal follow-on support imply serious investor belief.
    - Internal rounds and thin secondary pages do not automatically mean the price clears in a broad market.
    - Obtain the signed term sheet, cap table, and any secondary component.
  - - Public comp fit
    - Yassir has some attributes of DoorDash, Grab, and Jumia all at once, which can justify a blended peer view.
    - Because it is not a clean match to any one comp, investors can too easily overpay for optionality.
    - Force the business into explicit scenario bands before underwriting.
  notes: The anti-thesis is mostly about valuation quality and disclosure rather than whether Yassir is a real operating company.
