- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation status
  - Relevance
  - Limitation
  rows:
  - - Yassir headline mark
    - Forge post-money valuation about $1.43B; retained 2024 revenue estimate about $225.9M; 2025 financing about $105M.
    - ~6.3x trailing sales on the retained revenue estimate; private round with limited secondary color.
    - Direct current pricing anchor for the asset under review.
    - Denominator is estimated and term-sheet quality is undisclosed.
  - - DoorDash
    - TTM revenue about $14.72B; Q1 2026 revenue growth +33%; adjusted EBITDA $754M.
    - About 5.1x EV/revenue.
    - Best premium food-delivery marketplace reference for scale plus improving profitability.
    - Far larger and more mature than Yassir, with stronger disclosure and US liquidity.
  - - Grab
    - TTM revenue about $3.55B; market cap about $15.69B; EV about $12B; net cash about $4.53B.
    - About 3.1x EV/revenue.
    - Closest retained public super-app reference with payments optionality.
    - Southeast-Asian scale and capital structure are much stronger than Yassir’s public file.
  - - Delivery Hero
    - Revenue about €14.06B; market cap about €11.14B; EV about €13.81B; Q1 2026 revenue growth +17.8%.
    - About 0.9x EV/revenue.
    - Useful floor reference for a complex global everyday-app and quick-commerce platform.
    - Geography mix and corporate complexity differ sharply from Yassir.
  - - Jumia public Africa context
    - Market cap about $832.9M; EV/Sales about 3.89; filing-backed marketplace disclosure.
    - Context band rather than a clean anchor.
    - Keeps an African public-market lens in the peer set.
    - E-commerce and logistics mix differ from Yassir’s mobility-first origins.
  notes: 'This table is intentionally partial: it captures the highest-signal public and private valuation references retained
    in this run rather than claiming an exhaustive peer sheet.'
