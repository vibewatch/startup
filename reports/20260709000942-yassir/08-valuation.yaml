- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Why it matters
  - Observable warning sign
  - Action implication
  rows:
  - - Revenue proof disappoints
    - A premium private mark needs current revenue well above the retained 2024 estimate.
    - Management cannot show 2025 or 2026 revenue bridge that supports the current price.
    - Re-rate toward the low end of the base case or bear case.
  - - Payments expansion stalls
    - A large part of the upside case rests on wallet and licensing progression.
    - No meaningful wallet adoption metrics or licensing progress in Algeria or Morocco.
    - Treat the fintech upside as unproven and cut multiple expectations.
  - - Customer quality worsens
    - Repeat behavior is only valuable if rider, merchant, and driver satisfaction stay intact.
    - Trustpilot complaints, driver frustration, or refund disputes keep rising without counter-metrics.
    - Apply a sharper discount to growth durability.
  - - Regulation tightens
    - Ride-hailing or data-privacy enforcement can raise costs and slow multi-country scaling.
    - Draft rules harden, regulator warnings escalate, or licensing timelines slip.
    - Add policy discount and slow underwriting pace.
  - - Round terms are investor-unfriendly
    - A headline price can look fine while preferences or secondary mix weaken actual economics.
    - Cap-table math still cannot be reconciled after diligence.
    - Walk away from price-sensitive entry even if the business remains interesting.
  notes: These are the few triggers most likely to move Yassir from an interesting company at a debatable price to an unattractive
    investment at that price.
  claimRefs:
  - CV038
  - CV039
  - CV040
  - CV041
  - CV043
  - CV044
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Ask
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - 2025 round mechanics
    - Signed term sheet, exact ownership, liquidation preferences, any secondary mix.
    - Needed to translate the $1.43B headline into true entry economics.
    - Request counsel package and updated cap table.
  - - Current segment P&L
    - Revenue, gross profit, and cash needs for rides, food, stores, wallet, and new adjacencies.
    - Needed to test whether expansion lifts or dilutes valuation quality.
    - Request management reporting by business line.
  - - Unit economics and cohorts
    - Take rate, contribution margin, CAC, repeat behavior, refund and cancellation metrics.
    - Needed to know which public multiple band Yassir deserves.
    - Request cohort dashboard and unit-economics pack.
  - - 2026 run-rate outlook
    - Current-quarter bridge from 2024 estimate to present operating reality.
    - Needed to know whether the retained revenue estimate understates or overstates reality.
    - Request board deck or current operating review.
  - - Regulatory posture
    - Counsel view on Algeria ride-hailing rules, Senegal data issues, and Morocco payment licensing.
    - Needed to bound downside from compliance and expansion friction.
    - Obtain outside-counsel memo and management remediation plan.
  - - Exit readiness
    - Audit depth, KPI cadence, and roadmap toward public-style disclosure.
    - Needed to judge whether Yassir can earn a higher-quality valuation band over time.
    - Request CFO reporting roadmap and audit package.
  notes: If management cannot answer these asks, the asset should remain on watchlist rather than move into price-taking conviction
    mode.
