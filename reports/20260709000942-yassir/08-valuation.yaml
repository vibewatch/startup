- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Explicit assumptions
  - Indicative value / multiple logic
  - Probability signal
  rows:
  - - Bull
    - Current revenue is materially above the retained 2024 estimate, payments scale cleanly, and new adjacencies improve
      margin quality.
    - $1.35B to $1.6B, roughly 6x+ on a higher revenue base rather than on the old estimate.
    - Needs evidence that Yassir is becoming more fintech-like, not just more expansive.
  - - Base
    - The company keeps growing, but economics remain only partly disclosed and deserve a broad consumer-platform discount.
    - $565M to $1.13B using a 2.5x to 5.0x corridor on the retained revenue estimate.
    - Most plausible on current public evidence.
  - - Bear
    - Growth slows, regulation tightens, or service quality and unit economics look closer to lower-quality marketplace comps.
    - $350M to $650M using compressed comp logic and downside execution assumptions.
    - Would follow from weak cohort quality, regulatory friction, or low-margin disclosure.
  - - Wait / underwrite later
    - Management proves solid economics but current price still leaves no margin of safety.
    - Defer entry until price resets or fuller disclosure improves the multiple investors can justify.
    - Most practical path if investors like the company more than the current price.
  notes: Ranges are scenario heuristics anchored on retained public comparables and the best available revenue estimate, not
    intrinsic-value precision models.
