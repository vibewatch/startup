  topStrengths:
    - $350M ARR 和 350,000+ 客户 / 技术团队说明，Oxylabs 已经达到有分量的后期私营规模。
    - 公司把自己定位成 AI 时代实时网页访问基础设施，而不是狭窄的大宗代理卖家。
