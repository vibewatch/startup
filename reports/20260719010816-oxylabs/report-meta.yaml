companyProfile:
  summary: Oxylabs is a Vilnius-based web-data infrastructure company founded in 2015
    inside the Tesonet ecosystem. It began as a premium proxy provider and has expanded
    into a broader stack spanning residential, mobile, ISP, and datacenter proxies,
    Web Scraper API, Web Unblocker, and newer AI-oriented tooling. Public evidence
    supports meaningful commercial scale—roughly $350M ARR and 350,000+ customers
    or tech teams by July 2026—plus real customer deployments in retail intelligence,
    SEO data, and public-sector enforcement. The company took its first outside capital
    in July 2026 from Warburg Pincus at a $3.6B valuation.
