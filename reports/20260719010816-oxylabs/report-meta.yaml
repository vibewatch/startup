  topStrengths:
  - $350M ARR and 350,000+ customers / tech teams indicate that Oxylabs has reached
    meaningful late-stage private scale.
  - The company is positioned as infrastructure for AI-era live web access rather
    than as a narrow commodity proxy seller.
  - Public customer proof from Wiser, Epicup, and the Environmental Protection Department
    supports real production usage.
  - Compliance-heavy branding, KYC, and trust-center disclosures differentiate Oxylabs
    from lower-reputation proxy providers.
  topRisks:
  - No public NRR, gross margin, cash-burn, or customer-concentration data means the
    quality of revenue is still under-disclosed.
  - Platform blocking, publisher monetization, and privacy or AI regulation can compress
    margins and multiples quickly.
  - 'Customer evidence is bifurcated: enterprise users value performance, while smaller
    users show more pricing and support friction.'
  - At roughly 10.3x ARR, the current valuation is no longer obviously cheap relative
    to lower-multiple public data vendors.
  unresolvedGaps:
  - No audited ARR bridge through runDate showing exactly what is included in the
    $350M figure.
  - No public gross-margin, NRR, GRR, churn, or cohort-retention disclosure.
  - No public clarity on top-customer concentration, segment mix, or channel economics.
  - No public detail on Warburg round preferences, governance rights, or dilution
    overhang.
