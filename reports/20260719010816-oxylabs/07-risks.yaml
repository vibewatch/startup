    {
      "id": "people-financial-and-kill-criteria-risk",
      "title": "People, financial-model, and thesis-break risk",
      "body": "The last risk layer is execution under new expectations. Oxylabs spent most of its history bootstrapped and only took its first outside investment in July 2026, which is strategically positive but also changes the operating bar. Institutional capital tends to demand tighter reporting, sharper governance, and less tolerance for legal ambiguity or support inconsistency. That matters because public evidence still leaves major underwriting holes: no public NRR, gross margin, cash burn, top-customer concentration, or subprocessor list, even though some of those materials can apparently be requested privately. The main financial-model risk is therefore not near-term insolvency; it is that premium pricing, compliance cost, and platform-blocking pressure compress margins or slow growth faster than the new valuation can absorb. The thesis breaks if regulators or large platforms materially narrow permissible data collection, if Oxylabs’ success-rate edge visibly degrades, if review and retention evidence worsens in non-enterprise cohorts, or if private diligence reveals materially weaker economics than the public scale story implies. The right investment posture is to treat compliance strength as a mitigation, not as a substitute for current economic proof.",
