    {
      "id": "scenario-valuation-and-recommendation",
      "title": "Scenario valuation and recommendation",
      "body": "Our base case starts from the one public anchor that is clear enough to use: about $350M ARR at the time of the July 2026 round. If Oxylabs is truly a capital-efficient, enterprise-grade infrastructure company with credible compliance controls and strong retention, then a premium to Similarweb, ZoomInfo, and even C3.ai can be justified. But until margins, churn, and concentration are visible, it is hard to justify a public-cloud-style multiple anywhere near Cloudflare or Palantir. That leads to a practical scenario frame. The bear case assumes the business looks more like a well-positioned but legally exposed data vendor, which could drive value toward roughly 5x-7x ARR. The base case assumes premium but not elite economics, supporting roughly 8.5x-11.5x ARR. The bull case assumes management can prove software-like retention, healthy margins, and durable AI tailwinds, supporting roughly 12x-16x ARR. On that basis, the July 2026 $3.6B mark sits inside the base-case band. The current evidence therefore supports a track recommendation with medium confidence, medium-high risk, and a fair valuation stance—not a buy call driven by excitement over the AI narrative alone.",
