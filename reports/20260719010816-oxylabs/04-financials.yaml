    "title": "Financials",
    "summary": "Oxylabs shows unusually strong public top-line signals for a private infrastructure company—management-reported $350M ARR, a $3.6B July 2026 valuation, and years of bootstrapped operation—but the underwriting core remains partly opaque. The evidence supports a recurring-and-usage hybrid model with premium pricing, strong product breadth, and low historical financing dependence, yet realized pricing, gross margin, burn, revenue mix, and retention remain undisclosed, so the financial case is attractive but still incomplete."
