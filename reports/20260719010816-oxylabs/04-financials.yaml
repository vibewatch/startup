    {
      "id": "revenue-model-and-public-traction",
      "title": "Revenue model, pricing architecture, and public traction",
      "body": "Oxylabs’ public financial picture begins with an unusually clear headline and then quickly becomes less precise. The company’s July 2026 investment announcement says Oxylabs is running at $350 million ARR and is trusted by more than 350,000 tech teams worldwide, while the homepage still says it is trusted by 15,000-plus clients globally. Those figures all point to scale, but not to the same denominator, so they should be treated as strong demand evidence rather than a clean customer-cohort model. The monetization surface is clearly hybrid recurring plus usage. Public product pages show residential proxies sold per GB, datacenter proxies sold per IP and per GB, Web Unblocker sold per GB, and Web Scraper API offers that can be sold by traffic or by 1,000 results depending package. This is economically important: Oxylabs is not a pure seat-based SaaS company and not a one-off services business either. It monetizes ongoing access, performance, and workflow convenience. That should support recurring revenue quality, but the public record still does not disclose product-line mix, discounting, or which portion of ARR comes from enterprise contracts versus self-serve or acquired channels.",
