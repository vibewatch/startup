  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and use-compliance risk
        blocks:
          - type: paragraph
            body: >-
              Oxylabs’ legal posture is stronger than the stereotype around the proxy industry, but the perimeter it
              operates inside is getting tighter. The company has built an unusually explicit compliance surface: a
              trust center, a KYC policy that applies to every customer, a general conditions agreement, an acceptable
              use policy, and a data processing agreement. Those are real mitigants, especially because the acceptable
              use policy openly acknowledges that automated data gathering is not automatically illegal yet can cross
              legal thresholds depending on method and use case. The problem is that the external regulatory backdrop is
              still getting harsher. GDPR already governs personal-data processing, and the EDPB’s July 2026
              web-scraping guidance makes clear that public availability does not remove privacy obligations when
              scraped data contains personal data. At the same time, Article 50 transparency rules under the EU AI Act
              come into effect from 2 August 2026 for a wide set of AI interactions and AI-generated outputs, which
              matters because Oxylabs is pushing AI-oriented data-extraction surfaces. Case law remains nuanced rather
              than universally permissive: Meta v. Bright Data was favorable to public logged-off scraping in one
              context, but LinkedIn’s terms still explicitly prohibit scraping and automated collection. The real legal
              risk is therefore not one visible enforcement action against Oxylabs today; it is that endpoint-specific
              terms, privacy law, and AI obligations create a moving compliance burden that customers or regulators
              could test more aggressively over time.
            claimRefs:
