          - type: paragraph
            body: >-
              The chronology of record shows a steady broadening of Oxylabs from proxy infrastructure into AI-oriented
              web-data systems. Key milestones include its 2015 founding, the 2022 Webshare acquisition, the 2025
              ScrapingBee acquisition and AI Studio launch, the March 2026 leadership restructuring, and the July 2026
              Warburg round. The company is also visibly marketing itself to developers and AI builders through AI
