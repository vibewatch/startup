chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Platform Scope
        blocks:
          - type: paragraph
            body: >-
              Oxylabs is a private Lithuania-based web-data infrastructure company founded in 2015 inside the Tesonet
              ecosystem. Official and partner sources describe the business as having started as a premium proxy
              provider and then expanding into a broader full-stack web-data platform spanning residential, mobile, ISP,
              and datacenter proxies; Web Scraper API; Web Unblocker; headless browser; AI Studio; Fast Search API; and
              custom datasets. The home page and product pages position Oxylabs as infrastructure for AI training, RAG,
              pricing intelligence, ad verification, cybersecurity, and travel aggregation rather than as a narrow
              scraping utility. That positioning matters because it reframes the company from a controversial proxy
              seller into an enabling layer for agentic AI and enterprise-grade public-data acquisition. The same
              official materials also emphasize ethics, insurance coverage, and enterprise support, suggesting that
              management wants the company judged on reliability, compliance, and breadth of product stack rather than
              on low-cost access alone.
