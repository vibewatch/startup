      - number: '3.3'
        title: Capability breadth, pricing architecture, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is where the top of the market still separates from commodity proxy resale. Bright
              Data’s own comparison pages and Apify’s June 2026 head-to-head both show that Bright Data and Oxylabs
              cover the core proxy stack plus scraper APIs and datasets, but Bright Data adds a wider dataset
              marketplace, a web IDE, browser-automation and agent tooling, and broader pay-as-you-go packaging. Oxylabs
              narrows that gap with AI Studio, Web Scraper APIs, and Web Unblocker, but public sources still portray it
