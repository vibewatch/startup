      - number: '8.4'
        title: Final diligence and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work before a firm buy recommendation is concentrated in economic truth-finding. Investors
              need an audited ARR bridge through runDate, a product-level and segment-level retention view, gross-margin
              decomposition, customer-concentration analysis, cash and burn, the role of services or support intensity,
              and the exact preference or overhang implications of the new Warburg round. These asks matter because a
              10.3x ARR valuation is neither obviously cheap nor obviously reckless; it becomes attractive only if the
              missing quality indicators are strong. The thesis breaks if the ARR figure includes too much non-recurring
              or indirect volume, if large customers are highly concentrated, if legal or platform friction materially
              raises cost to serve, or if customer satisfaction outside the premium cohort turns out to be too fragile
              to support durable expansion. It also breaks if the next financing or liquidity event needs to clear at a
              much lower multiple because public-market comparables converge toward the lower end of the band. Until
              those questions are answered, discipline matters more than admiration.
