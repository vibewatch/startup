  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Oxylabs is credible. It is a bootstrapped business that reached roughly $350M ARR before
              taking outside capital, it now claims more than 350,000 customers or tech teams, and the customer proof is
              real enough to show deployment in production workflows rather than toy use. The company also sits inside a
              category that the AI boom has made more strategically important: the infrastructure that keeps models and
              agents connected to live public-web data. That combination—scale, relevance, and a compliance-heavy brand
              in a controversial sector—can justify a premium to slower or more commoditized data vendors. The
              anti-thesis is that investors still do not know enough about the quality of that scale. Public materials
              do not disclose NRR, gross margin, cash burn, services intensity, or top-customer concentration. Even the
              customer-count narrative uses multiple definitions, including 15,000+ clients on the homepage and 350,000+
              tech teams in funding materials. The right valuation lens is therefore not “is Oxylabs a good company?”
              but “does the current price already assume software-quality economics that are not yet publicly proven?”
            claimRefs:
