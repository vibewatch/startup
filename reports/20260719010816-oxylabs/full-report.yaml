      - number: '7.3'
        title: Dependency, customer, and market-transmission risk
        blocks:
          - type: paragraph
            body: >-
              Risk transmission at Oxylabs runs through dependencies and customer expectations. The company depends on a
              chain that includes residential IP participants, target-site tolerance, cloud and internet infrastructure,
              third-party subprocessors, and a market narrative that Oxylabs is worth paying a premium for. That premium
              narrative is real—Proxyway and Gartner both frame Oxylabs as especially strong for enterprise or
              high-volume users—but it is not universal. Trustpilot, Thunderbit, and lower-cost competitor surfaces show
              that smaller or more price-sensitive users may experience the platform very differently and may have
              little patience for KYC, onboarding friction, or premium pricing. Webshare broadens channel reach and
              lower-end acquisition, but it also broadens abuse-management and support-complexity risk. Named references
              such as Wiser, Epicup, and the Environmental Protection Department prove embedded workflow usage, which is
              commercially positive but also means that outages, legal restrictions, or performance deterioration could
              interrupt customer operations directly. Public evidence remains weakest on top-customer concentration,
              NRR, and segment revenue mix, so the company’s resilience to dependency shocks cannot yet be modeled with
              confidence.
