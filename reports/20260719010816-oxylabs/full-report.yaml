  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition, module scope, and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Oxylabs’ product surface is no longer just “buy proxies.” The homepage and product pages present a stack
              that starts with residential and datacenter connectivity, but then rises into Web Unblocker, Web Scraper
              API, Fast Search API, and AI Studio applications such as AI-Scraper. In workflow terms, that means
              customers can choose between direct traffic control, managed request execution, domain-specific structured
              extraction, or natural-language-driven data collection for AI pipelines. Official docs make the intended
              progression explicit: the Web Scraper API quick start starts from a single API request that hides proxy
              rotation, rendering, and anti-bot logic; Web Unblocker wraps hard targets behind a proxy endpoint plus
              control headers; AI-Scraper goes one layer higher by letting a user describe the desired output in plain
              English. The most important product conclusion is therefore architectural: Oxylabs is selling
              progressively more abstraction. That is helpful for customer adoption because it maps to distinct
              jobs-to-be-done—from infrastructure-heavy scraping teams to developers and AI builders who care more about
              outputs than about low-level networking decisions.
