      - number: '6.4'
        title: Expansion loops, concentration risk, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a plausible land-and-expand motion but does not quantify it. The product
              stack itself implies a strong expansion path: a customer can start with raw proxies, move into Web Scraper
              API or Web Unblocker, and later adopt Fast Search API or AI-native tools. Named case studies also reflect
              workflow depth rather than one-off purchases, especially Wiser’s multi-domain recurring collection and
              Epicup’s embedded SEO data pipeline. At the same time, the risk picture is meaningful. Thunderbit,
              Trustpilot, Gartner, and Capterra all reinforce that premium pricing and onboarding or KYC friction can be
              barriers for smaller users or for buyers who do not need enterprise-grade service. BestProxyCompare and
              competitor pricing surfaces show that lower-cost substitutes remain plentiful, which means part of
              Oxylabs’ customer-base durability likely depends on continued performance leadership and support quality
              rather than on low price. Public evidence is weakest on concentration. No retained source discloses
              top-customer exposure, contract duration, renewal cohorts, partner dependence, or revenue mix by segment.
              The commercial verdict is therefore balanced: Oxylabs appears to have credible expansion vectors and broad
              adoption, but concentration and retention economics remain major diligence gaps.
