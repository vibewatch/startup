      - number: '7.2'
        title: Operational, reliability, security, and supply risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the most important risk is not a factory or physical plant—it is whether Oxylabs can keep a
              high-success-rate data-collection stack working as the open web becomes more hostile. The trust center,
              SOC 2 Type 2 disclosures for Scraper API and Web Unblocker, and ISO 27001 certification are positive
              signals, and the DPA includes subprocessor, breach-notification, and deletion or return obligations that
              enterprise customers will expect. But the product promise itself raises the bar. Web Unblocker markets
              dynamic strategy discovery and Web Scraper API markets structured ready-to-use output; when customers
              depend on those layers, anti-bot escalation, target-site changes, or infrastructure instability can turn
              quickly into commercial pain. Cloudflare’s pay-per-crawl and default blocking changes are a direct example
              of that pressure. The company also relies on ethically sourced residential proxy supply and on third-party
              network participants staying both consented and commercially available. Public sources do not show a major
              Oxylabs breach or incident, which is directionally reassuring, but absence of public incident evidence is
              not proof that operational risk is low. The residual exposure is therefore moderate-to-high: Oxylabs looks
              more mature than many proxy peers, yet the business still depends on external sites, external networks,
              and continuous technical adaptation to keep customer workloads running.
