      - number: '3.2'
        title: Competitor profiles, scale signals, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently place Oxylabs in the premium cohort rather than the budget tier. Oxylabs’ own
              homepage still centers a 15,000-plus client base and AI-era data workflows, while Bright Data markets the
              largest residential network, the broadest set of adjacent data-access tools, and compliance coverage
              suitable for large procurement-led organizations. Decodo is the most visible value-oriented challenger: it
              pairs a still-large ethically sourced pool with self-serve packaging, pay-as-you-go options, and
              third-party “best value” recognition. SOAX sits between premium and value, leaning into routing quality
              and predictable pricing. Apify is strategically different because it blends proxies with a marketplace of
              AI/data tools, which means it competes for workflow ownership rather than only for proxy traffic.
              Webshare, IPRoyal, and Rayobyte each attack narrower jobs—cheap entry-level traffic, pay-as-you-go
              residential usage, or low-cost datacenter and ISP economics—without matching Oxylabs on full-stack
              enterprise breadth. Taken together, the profile evidence suggests Oxylabs belongs in the short list for
              demanding enterprise workloads, but it is surrounded by competitors that can unbundle portions of the job
              more cheaply or more conveniently.
