      - number: '2.5'
        title: Regulatory, Publisher, and Anti-Bot Constraints
        blocks:
          - type: paragraph
            body: >-
              The same market is also getting harder. DataDome describes scraping as a multi-billion-dollar problem for
              data owners and shows how attackers now use residential proxies, spoofed user agents, and distributed
              attacks. Its 2026 research on agent identity argues that most AI agents still do not identify themselves
              properly and that most websites cannot distinguish a legitimate agent from a spoofed one. Cloudflare’s
              pay-per-crawl launch is another sign of tightening conditions: publishers increasingly want to block or
              charge AI crawlers rather than permit free access by default. The AI Act adds a further compliance layer
              by imposing dataset-quality, traceability, and transparency obligations on high-risk and GPAI-related
              systems, while also explicitly prohibiting untargeted internet scraping for facial-recognition databases.
              Together these forces imply that the category’s future margin pool may shift away from undifferentiated
              proxy resale and toward vendors that can offer lawful sourcing, agent authentication, adaptive anti-bot
              handling, and clearer enterprise governance. Oxylabs’ premium positioning fits that direction, but the
              same trend also raises customer onboarding friction and the importance of legal review.
