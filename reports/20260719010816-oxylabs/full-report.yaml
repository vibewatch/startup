      - number: '1.2'
        title: Leadership Transition, Governance, and Key-Person Dependencies
        blocks:
          - type: paragraph
            body: >-
              Oxylabs underwent a meaningful leadership transition in 2026. The company announced that founder and
              long-time CEO Julius Černiauskas would move into the Chairman role while Vytautas Savickas would become
              chief executive responsible for day-to-day operations. That shift appears to separate founder-level
              strategic influence from operating execution at the precise moment the company accepted its first outside
              capital. Public governance disclosure, however, remains incomplete: Oxylabs names a CFO and a set of risk,
              legal, and governance leaders, but it does not publish a full post-investment board roster, Warburg board
              rights, or detailed shareholder-control information in the sources reviewed. This creates moderate
              key-person and governance diligence risk. Julius remains strategically central as founder-chairman,
              Savickas is now the external face of the company’s AI-era thesis, and CFO Jurgis Rudgalvis is prominently
              quoted on acquisitions and scale strategy. The public record supports confidence in a broadened leadership
              bench but not in the precise governance mechanics behind the new capital structure.
