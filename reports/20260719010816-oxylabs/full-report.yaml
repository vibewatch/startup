              The company homepage says it is trusted by 15,000-plus clients globally, while July 2026 funding materials
              expand that framing to more than 350,000 tech teams worldwide. The case-studies hub further says the
              customer base spans mid-market to enterprise organizations across multiple industries, and case material
              shows real usage in retail intelligence, SEO analytics, and public-sector enforcement. That mix implies
