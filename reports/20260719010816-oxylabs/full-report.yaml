      - number: '1.4'
        title: Scale Metrics, Compliance Posture, and Public Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Oxylabs’ public scale metrics are impressive but require careful interpretation. The company’s investment
              announcement and Tesonet coverage say Oxylabs is at $350 million ARR with more than 350,000 customers,
              while the home page says it is trusted by 15,000+ clients globally and the compliance page says 500+
              experts work at the company. The most likely explanation is that these figures describe different
              populations—such as total developer or tech-team users versus paying enterprise clients—but the company
              does not define them clearly in the reviewed public sources. What is unambiguous is the scale of the
              platform itself: 175M+ residential IPs, 20M+ mobile IPs, a 1.9M+ dedicated datacenter IP pool, and product
              pages showing enterprise-oriented pricing, uptime, and targeting claims. Oxylabs also leans hard into
              compliance and trust messaging through ISO 27001, SOC 2 references, a trust center, legal/compliance
              staffing, KYC requirements, and the ethics narrative it uses to differentiate itself from lower-reputation
              proxy providers.
