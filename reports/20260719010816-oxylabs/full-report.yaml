      - number: '2.2'
        title: Market Sizing Lenses and Regional Structure
        blocks:
          - type: paragraph
            body: >-
              Public market-size estimates point in the same direction—fast growth—but not to the same absolute number.
              The Business Research Company sizes the 2026 web scraping market at $1.17 billion and forecasts $2.28
              billion by 2030, while Mordor Intelligence places the 2026 market at $1.56 billion and the 2031 market at
              $3.49 billion. Those differences are too large to ignore and likely reflect different inclusion rules
              around services, infrastructure, and adjacent products. ScrapingDog and WorldMetrics cite even larger
              context numbers when they pull in alternative data, mainstream analytics adoption, or broader software
              categories. The practical takeaway is that investors should not anchor on a single TAM slide; instead,
              they should treat the market as a layered shell where narrow web-scraping software is a
              low-single-digit-billion category but the broader public-web data stack is larger and increasingly
              strategic because it serves AI, pricing, threat intelligence, and search applications. TBRC also says
              North America was the largest region in 2025 while Asia-Pacific is the fastest-growing region, a pattern
              consistent with mature enterprise demand in the West and expanding digital-commerce and platform scale in
              Asia.
