    {
      "id": "capitalization-and-stakeholders",
      "title": "Funding History, Capitalization, and Strategic Stakeholders",
      "body": "The defining capitalization fact is that Oxylabs remained bootstrapped from 2015 until July 9, 2026, when Warburg Pincus invested $130 million through its Capital Solutions Founders Fund at an approximately $3.6 billion valuation. Multiple official and independent sources frame the round as the company’s first outside investment and a landmark for Lithuania’s startup ecosystem. The round also formalized the company’s move from founder-funded scale-up to externally capitalized growth platform. Public disclosures identify Goldman Sachs as sole placement agent to Oxylabs, Deloitte Lithuania as financial and tax advisor, and several international law firms advising both sides. Management also explicitly linked the new capital to future acquisitions and partnerships, building on the earlier Webshare acquisition in 2022 and the ScrapingBee acquisition in 2025. Because there is still no public breakdown of ownership percentages, liquidation preferences, or Warburg governance rights, investors should treat the headline valuation as verified but the detailed control map as incomplete.",
