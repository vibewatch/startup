    "number": 1,
    "title": "Company Overview",
    "summary": "Oxylabs is a Vilnius-based web-data infrastructure company founded inside the Tesonet ecosystem in 2015 that stayed bootstrapped until Warburg Pincus invested $130 million on 2026-07-09 at a $3.6 billion valuation. Public evidence shows a broad proxy-and-scraping platform, a 2026 CEO transition to Vytautas Savickas, strong compliance positioning, and sizable but somewhat inconsistently defined scale metrics that require diligence on customer-count and governance definitions."
