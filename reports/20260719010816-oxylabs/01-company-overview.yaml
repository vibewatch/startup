    {
      "id": "milestones-and-adverse-signals",
      "title": "Milestones, AI Positioning, and Adverse Signals",
      "body": "The chronology of record shows a steady broadening of Oxylabs from proxy infrastructure into AI-oriented web-data systems. Key milestones include its 2015 founding, the 2022 Webshare acquisition, the 2025 ScrapingBee acquisition and AI Studio launch, the March 2026 leadership restructuring, and the July 2026 Warburg round. The company is also visibly marketing itself to developers and AI builders through AI Predictions 2026, DEVWorld, and the AI Engineer World’s Fair, which supports the claim that Oxylabs sees agentic AI as a major demand driver. The adverse side of the record is less existential but still relevant: Trustpilot, G2, and Capterra all show some criticism around pricing, support response, refunds, KYC friction, and small-user affordability; TNW explicitly notes that the web-data business still carries legal and reputation baggage. Those signals do not undercut the growth story, but they do warn that Oxylabs’ premium valuation depends on maintaining compliance credibility while expanding an industry that remains scrutinized by customers, websites, and regulators.",
