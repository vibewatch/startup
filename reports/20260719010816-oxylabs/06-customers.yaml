    "title": "Customers",
    "summary": "Oxylabs has credible public customer proof across enterprise retail intelligence, SEO analytics, and even public-sector enforcement use cases, and it now claims both 15,000+ clients and 350,000+ tech teams or customers. That is enough to validate broad market adoption and named production usage, but not enough to underwrite retention, concentration, or cohort durability with confidence; the public evidence is much stronger on satisfaction and workflow outcomes than on NRR, churn, or contract economics."
  },
  "sections": [
    {
      "id": "segments-and-adoption-surface",
      "title": "Customer segmentation, buyer mix, and adoption surface",
      "body": "The public customer record suggests Oxylabs serves a layered customer base rather than one narrow segment. The company homepage says it is trusted by 15,000-plus clients globally, while July 2026 funding materials expand that framing to more than 350,000 tech teams worldwide. The case-studies hub further says the customer base spans mid-market to enterprise organizations across multiple industries, and case material shows real usage in retail intelligence, SEO analytics, and public-sector enforcement. That mix implies several distinct buyer/user/payer combinations: enterprise data or operations teams buying premium proxy and scraper infrastructure, software companies embedding Oxylabs inside their own customer-facing products, and public institutions or mission-driven programs using custom crawling to support enforcement or research. It also suggests channel diversity. Oxylabs sells directly under its premium brand, but the Webshare acquisition preserved a lower-friction self-serve path for budget-sensitive or developer-led buyers. The main caveat is definitional clarity: public sources do not explain precisely how “clients,” “tech teams,” and “customers” differ, so segmentation direction is observable, but segment revenue weights remain opaque.",
