      "id": "named-customer-proof-and-deployment-depth",
      "title": "Named customer proof, deployment maturity, and outcome specificity",
      "body": "Named customer proof is strong enough to support the commercial narrative, even if not enough to support a full retention model. Wiser appears to be a production-grade enterprise reference rather than a pilot. Its case study describes a data-intensive retail workflow that hits thousands of domains multiple times per day and cites Oxylabs’ datacenter proxies as a critical part of Wiser’s operations. Epicup is another credible production-style reference: it is an SEO software provider that says Oxylabs’ scraper tooling helped it maintain high-volume, fresh SEO data while meeting pricing, latency, and success-rate requirements. The Environmental Protection Department case is strategically different. It is a public-good or pro bono collaboration rather than classic recurring revenue proof, but it demonstrates deployment depth and measurable operational results. The crawler has been integrated into daily operations since July 2024, scans roughly 400 ads each week, and supported multiple investigations and confirmed violations. Taken together, these examples show that Oxylabs is not just being trialed by curious users; it is embedded in real workflows with recurring operational consequences. The limitation is breadth: the public named-proof set is still small relative to the company’s claimed overall customer base.",
