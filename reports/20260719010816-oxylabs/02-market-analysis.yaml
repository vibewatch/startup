    {
      "id": "market-boundary",
      "title": "Market Boundary, Included Spend, and Substitutes",
      "body": "The relevant market for Oxylabs is broader than generic “proxy servers” and narrower than all enterprise data infrastructure. It includes software and services for collecting public web data, residential and datacenter proxy access, managed scraping APIs, anti-bot bypass, browser automation, and increasingly open-web and AI-grounding infrastructure. TBRC’s segmentation covers software and services, multiple deployment models, and applications such as price monitoring, market research, data aggregation, and competitive intelligence. OpenWebSearch and Cloudflare add another boundary layer: open web indexes and programmatic content access are becoming adjacent infrastructure choices for AI systems. The main substitutes are official APIs, licensed datasets, manual research, in-house crawler stacks, and open-index or search-provider access. This means Oxylabs is not competing only with other proxy vendors; it also competes with internal engineering builds and with platform-level alternatives that trade flexibility for legality, freshness, or cost predictability.",
