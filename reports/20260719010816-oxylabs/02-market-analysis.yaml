    "number": 2,
    "title": "Market Analysis",
    "summary": "Oxylabs sits in a broadened market that spans web-scraping software, proxy access, anti-bot bypass, and AI-era public-web data infrastructure rather than a single “proxy” niche. Public sources agree on double-digit category growth, rising AI and real-time-data demand, and increasing legal, anti-bot, and publisher-monetization constraints; they disagree materially on exact market size because each provider draws the boundary differently."
