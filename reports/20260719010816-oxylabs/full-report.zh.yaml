        - ~2.28x P/S；Q1 2026 收入增长 10%，非 GAAP 经营利润为正
        - 数字情报和网络数据邻近性上最接近的公开可比公司
        - 网站分析和市场情报组合更宽，较少以代理基础设施为中心
      - - ZoomInfo
        - 2026 P/S 比率和 Q1 利润率画像
        - ~0.73x P/S；Q1 2026 收入增长 1.5%，调整后经营利润率 35%
        - 说明公开市场会如何大幅折价增长较慢的大型数据供应商
        - 市场进入情报更偏销售科技，而不是网络数据基础设施
      - - C3.ai
        - 2026 P/S 比率和 FY2026 业绩
        - ~4.60x P/S；FY2026 收入 $250.3M，聚焦重组和降本
        - 可作为中档 AI 软件参照，适合仍在证明经济性持久的公司
        - 应用软件模式与 Oxylabs 的数据获取栈差异明显
      - - Cloudflare
        - 2026 P/S 比率和 Q1 经济性
        - ~45.7x P/S；Q1 2026 收入 $639.8M，增长 34%，毛利率 71.2%
        - 代表有 AI 顺风的高端互联网基础设施估值上沿
        - 平台更宽、公开披露更强，规模验证也强于 Oxylabs
      - - Palantir
        - 2026 P/S 比率和 Q1 监管文件背景
        - ~61.7x P/S；异常强的毛利率和 AI 叙事支撑溢价
        - 展示顶级数据 / AI 平台的溢价天花板
        - 业务组合、政府敞口和披露深度都与 Oxylabs 相距很远
    notes: 可比公司组刻意设得较宽，因为没有一家上市公司能与高端代理加网络数据基础设施完全一一对应。
