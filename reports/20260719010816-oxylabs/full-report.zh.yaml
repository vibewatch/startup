      - number: '7.4'
        title: 人员、财务模型和投资逻辑失效风险
        blocks:
          - type: paragraph
            body: >-
              最后一层风险是新预期下的执行。Oxylabs 历史上大多靠自举发展，直到 2026 年 7
              月才拿到首笔外部投资；战略上这是好事，但也抬高了运营门槛。机构资本通常要求更紧的报告、更清晰的治理，对法律模糊和支持不一致的容忍度更低。问题在于，公开证据仍留下重大投资核验缺口：没有公开净留存率（NRR）、毛利率、现金消耗、头部客户集中度或分处理方清单，虽然其中部分材料似乎可私下索取。主要财务模型风险因此不是短期资不抵债，而是高端定价、合规成本和平台封锁压力挤压毛利或拖慢增长，速度超过新估值所能承受。投资逻辑会在几种情况下失效：监管者或大型平台实质性压窄可允许的数据采集空间；Oxylabs
              的成功率优势明显退化；非企业队列的评价和留存证据恶化；或私下尽调显示经济性明显弱于公开规模故事。正确的投资姿态，是把合规强度视为缓释因素，而不是当前经济证明的替代品。
