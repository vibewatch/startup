      - number: '1.3'
        title: 融资历史、资本结构与战略股东
        blocks:
          - type: paragraph
            body: >-
              资本结构上最关键的事实是，Oxylabs 从 2015 一直自举到 July 9, 2026；当天 Warburg Pincus 通过 Capital Solutions Founders Fund 以约
              $3.6B 估值投资 $130
              million。多家官方和独立来源都把这一轮称为公司的首笔外部投资，也是立陶宛创业生态的标志性事件。这轮融资也正式把公司从创始人自有资金驱动的规模化公司，推向外部资本支持的增长平台。公开披露显示，Goldman
              Sachs 是 Oxylabs 的独家配售代理，Deloitte Lithuania 担任财务和税务顾问，多家国际律所为交易双方提供法律服务。管理层也明确把新资本和未来收购、合作伙伴关系挂钩，延续此前 2022
              收购 Webshare、2025 收购 ScrapingBee 的路径。由于所有权比例、清算优先权或 Warburg 治理权利仍没有公开拆解，投资者可以把标示估值视为已验证，但详细控制图仍不完整。
