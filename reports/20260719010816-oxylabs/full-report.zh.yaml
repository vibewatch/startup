      - number: '1.2'
        title: 管理层交接、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              2026，Oxylabs 经历了一次重要管理层交接。公司宣布，创始人兼长期 CEO Julius Černiauskas 将转任董事长，Vytautas Savickas 将出任
              CEO，负责日常运营。这个安排看起来是在公司接受首笔外部资本的同一时间，把创始人层面的战略影响力和运营执行拆开。不过，公开治理披露仍不完整：Oxylabs 披露了
              CFO，以及风险、法务和治理负责人，但在已审阅来源中没有公布投资后完整董事会名单、Warburg 董事席位权利或详细股东控制信息。因此，关键人和治理尽调存在中等风险。Julius
              作为创始人兼董事长仍是战略核心；Savickas 现在是公司 AI 时代投资逻辑的外部代表；CFO Jurgis Rudgalvis
              在收购和规模化战略上被频繁引用。公开记录能支持领导层梯队已经拓宽，但不足以证明新资本结构背后的具体治理机制。
