      - number: '8.2'
        title: 融资背景和公开可比区间
        blocks:
          - type: paragraph
            body: >-
              融资背景表面上异常干净：Oxylabs 首次外部融资拿到 $130M，估值 $3.6B；此前公司称已建成超过 $350M 的 ARR。单看这一点，约等于 10.3x ARR
              倍数。问题不在于这个倍数无法辩护，而在于公开可比公司的区间太宽，正确答案高度依赖隐藏的质量指标。Similarweb 约 2.3x 销售额、ZoomInfo 约
              0.7x，说明即使数据供应商仍有可观规模，只要增长更慢或挑战更多，公开市场也会打折。C3.ai 约 4.6x，高于成熟信息供应商，但仍远低于高端基础设施龙头。另一端，Cloudflare 和 Palantir 约
              45.7x 和 61.7x，反映的是围绕品类领导力、毛利率、可持续 AI 或基础设施溢价的强得多的公开叙事。因此，Oxylabs 落在一个尴尬但分析上有用的中间地带：明显贵过成熟数据供应商，明显便宜过顶级 AI
              或连接性公司，同时仍足够不透明，投资人还无法判断它到底应落在区间里的哪一段。
