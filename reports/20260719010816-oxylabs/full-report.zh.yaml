      - number: '8.4'
        title: 最终尽调和投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              作出明确买入建议之前，剩余工作集中在经济真实性核验。投资人需要截至 runDate 的经审计 ARR 桥、按产品和细分切分的留存视图、毛利率拆解、客户集中度分析、现金与烧钱速度、服务或支持强度的角色，以及
              Warburg 新一轮融资带来的精确优先权或悬置影响。这些问题重要，是因为 10.3x ARR 估值既不明显便宜，也不明显鲁莽；只有缺失的质量指标足够强，它才有吸引力。投资逻辑会在几种情况下失效：ARR
              数字包含过多非经常性或间接量；大客户高度集中；法律或平台摩擦显著抬高服务成本；或高端队列之外的客户满意度脆弱到无法支撑持久扩张。如果下一轮融资或流动性事件必须以低得多的倍数成交，因为公开市场可比公司向区间低端收敛，逻辑也会失效。在这些问题回答之前，纪律比赞赏更重要。
