  - id: TP003
    title: 定价 / 套餐对比
    columns:
      - 供应商
      - 入门信号
      - 单位 / 合同模型
      - 包含能力
      - 折扣 / 未知项
      - 含义
    rows:
      - - Oxylabs
        - 住宅代理价格处于高端区间；Bright Data 2026 指南显示 Web Unblocker 起价约 $9.4/GB
        - 销售驱动的企业打包与产品级套餐并行
        - 高端代理、Web Unblocker、抓取 API、AI Studio
        - 批量折扣和大额用量的具体条款未完全公开
        - 适合企业；对爱好者或试点买家显然没有那么优化
      - - Bright Data
        - 对比内容显示住宅代理约从 $2.50/GB 起；广泛支持现用现付（PAYG）
        - 按量计费，加产品专属套餐和试用
        - 代理栈、数据集、解锁器、浏览器 / 智能体工具
        - 打包范围很广，也可能显得复杂
        - 全栈菜单最灵活，但复杂度会加重比价疲劳
      - - Decodo
        - 入门套餐住宅代理约 $3.75/GB 起；支持按用量付费
        - 月度订阅加 PAYG
        - 住宅 / 移动 / 数据中心代理和站点解锁器
        - 用量越高折扣越好；提供 3 天试用
        - 最适合想要接近高端能力、但不想承担偏企业定价的买家
      - - SOAX
        - 官方定价强调可预测的成本；公开来源显示住宅代理价格介于高端到中端之间
        - 按国家层级 / 套餐进行按量定价
        - 住宅、移动、ISP 以及地理定位深度
        - 保留下来的公开定价细节少于 Decodo 或 Bright Data
        - 主打稳定性和定位能力，而不是单纯最低价
      - - Webshare
        - 免费层加低成本代理定价
        - 按代理和按 GB 的入门套餐
        - 数据中心、静态住宅和成本更低的轮换选项
        - 付费套餐广度窄于高端同业
        - 适合测试、个人项目，以及不需要高端支持的买家
      - - IPRoyal
        - 强调住宅代理按量付费
        - 现用现付（PAYG）加套餐变体
        - 聚焦住宅和静态住宅
        - 保留证据中企业打包可见度较低
        - 对优先看重灵活性、而非完整平台广度的买家，是有用基准
      - - Rayobyte
        - 便宜的数据中心和 ISP 定价，加免费试用
        - 按产品采用按 IP 或按 GB 模式
        - 数据中心、ISP、住宅和解锁器产品
        - 并非所有产品都能在工作流广度上匹配 Oxylabs
        - 显示低价基础设施如何压制商品化层
      - - ScraperAPI
        - 免费额度 1,000 credits/月；文档和网页引用付费入口为 $49/month
        - 基于积分的 API 打包，高端代理会按倍数消耗
        - 托管抓取、重试、渲染、住宅 / 移动池
        - 高端请求会消耗更多积分
        - 对想要结果、而不是采购代理的开发者，是强替代
    notes: 各供应商公开定价并不均衡，因此本表强调入门信号和打包逻辑，而不是假装每个产品都能用一个简单的每 GB 数字直接比较。
