      - number: '2.5'
        title: 监管、发布方与反机器人约束
        blocks:
          - type: paragraph
            body: >-
              同一个市场也在变难。DataDome 把抓取描述为数据所有者面临的数十亿美元级问题，并展示攻击者如何使用住宅代理、伪造用户代理和分布式攻击。其 2026 的智能体身份研究认为，大多数 AI
              智能体仍不能正确表明身份，大多数网站也无法区分合法智能体和伪造智能体。Cloudflare 推出按爬取付费，是条件收紧的另一个信号：发布方越来越希望默认阻止 AI 爬虫或向其收费，而不是允许免费访问。AI Act
              又加了一层合规要求，对高风险和 GPAI
              相关系统施加数据集质量、可追溯性和透明度义务，同时明确禁止为人脸识别数据库无差别抓取互联网数据。合在一起，这些力量意味着品类未来的利润池可能从无差异代理转售，转向能提供合法来源、智能体认证、自适应反机器人处理和更清晰企业治理的供应商。Oxylabs
              的高端定位符合这个方向，但同一趋势也会抬高客户上手摩擦和法律审查的重要性。
