  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 桥接
        - 从账单、订单额和收入到所称 ARR 的审计后勾稽
        - 当前估值比任何其他变量都更依赖 ARR
        - 与 CFO 核验财务，并审查经审计收入明细
      - - 留存队列
        - 按产品和分部拆分的 NRR、GRR、Logo 流失和队列扩张
        - 决定 Oxylabs 配得上溢价，还是只配稳健的私募倍数
        - 客户分析和董事会 KPI 包
      - - 毛利率和服务成本
        - 产品级、渠道级毛利率，以及基础设施成本驱动因素
        - 说明业务更像软件经济性，还是运营更重的基础设施
        - 财务与工程尽调
      - - 客户集中度
        - 按 ARR、用量和续约日期拆分的 Top-10、Top-20 敞口
        - 客户基数很大，仍可能藏着企业客户集中风险
        - 收入运营和财务审查
      - - 融资轮经济条款
        - 优先权条款、老股 / 新股拆分、治理权利和稀释压力
        - 单看企业价值无法决定投资者回报
        - 法务和股权结构表尽调
      - - 监管 / 平台韧性
        - 对目标站点集中度、封锁率、KYC 执行和合规例外处理的内部判断
        - 一旦边界摩擦出现，估值下行会由它驱动
        - 产品、法务和风险运营尽调
    notes: 这些事项是把合理的公开叙事转成可承销投资判断的最短路径。
