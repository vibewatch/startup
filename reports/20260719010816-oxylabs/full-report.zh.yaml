  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销判断的影响
      - 精确尽调路径
    rows:
      - - 按产品和客户分部拆分的收入结构
        - 没有收入结构，投资者无法判断 ARR 有多少来自高价解封 / API 业务，有多少只是更商品化的代理流量
        - 要求提供住宅代理、数据中心代理、解封器、爬虫 API、搜索 API、数据集和并购渠道之间的 ARR 与总收入拆分
      - - 实际定价和折扣
        - 公开标价可见，但企业客户的实际经济性和竞争性折扣不可见
        - 要求提供前 50 大合同、价格手册、折扣授权规则，以及按产品拆分的净收入实现率
      - - 按业务流拆分的毛利率
        - 只有在资源获取、流量和支持成本之后仍留下可持续毛利，高价定价才有价值
        - 要求按产品族提供毛利率桥，并拆出资源获取、云、支持和合规成本
      - - 获客成本（CAC）、回本周期和销售周期数据
        - 没有获客成本和转化数据，无法承销 PLG 加企业协助销售模式
        - 要求提供自助转化漏斗、现场销售 CAC、回本周期，以及按分部拆分的销售周期长度
      - - NRR、logo 流失和扩张行为
        - 经常性基础设施估值高度依赖队列耐久度和扩张机制
        - 要求提供总留存、NRR、按产品扩张和流失原因的队列表
      - - 现金、烧钱速度、现金跑道和债务明细
        - 仅靠公开记录无法可信建模资本充足性
        - 要求提供月度现金余额、烧钱预测、债务与契约明细，以及下行情景现金跑道分析
      - - 15K 客户与 350K 技术团队的指标定义
        - 除非精确定义这些口径，否则粗略 ARPU 和单位经济估算并不可靠
        - 要求提供客户、委托客户、团队、活跃账户、付费 logo 和企业 logo 的指标字典
    notes: 这些缺口不是表面问题；它们直接决定 Oxylabs 的高价 ARR 和估值主张能否转化为站得住的投资模型。
