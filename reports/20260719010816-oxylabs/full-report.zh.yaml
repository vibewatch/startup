      - number: '7.3'
        title: 依赖、客户和市场传导风险
        blocks:
          - type: paragraph
            body: >-
              Oxylabs 的风险传导链穿过依赖项和客户预期。公司依赖一整条链：住宅 IP 参与者、目标站点容忍度、云和互联网基础设施、第三方分处理方，以及“Oxylabs
              值得溢价付费”的市场叙事。溢价叙事确实存在——Proxyway 和 Gartner 都把 Oxylabs 描述为尤其适合企业或高流量用户——但它并不普遍。Trustpilot、Thunderbit
              和低价竞品页面显示，小型或更价格敏感的用户可能会以很不同的方式体验平台，也可能难以忍受 KYC、上手摩擦或高端定价。Webshare
              拓宽了渠道触达和低端获客，但也放大了滥用管理和支持复杂度风险。Wiser、Epicup、Environmental Protection Department
              等具名客户证明了嵌入式工作流使用，商业上是好事；但这也意味着宕机、法律限制或性能恶化会直接打断客户运营。公开证据在头部客户集中度、净留存率（NRR）和分部收入结构上仍然最弱，因此还无法有信心地建模公司抵御依赖冲击的能力。
