      - number: '8.3'
        title: 情景估值与建议
        blocks:
          - type: paragraph
            body: >-
              我们的基准情景从一个足够清楚的公开锚点出发：2026 年 7 月融资时约 $350M ARR。如果 Oxylabs 真是一家资本效率高、企业级的基础设施公司，合规控制可信、留存强，那么相对
              Similarweb、ZoomInfo 甚至 C3.ai 的溢价都说得通。但在毛利率、流失率和集中度可见之前，很难给出接近 Cloudflare 或 Palantir
              的公有云式倍数。由此得到一个务实的情景框架。悲观情景假设公司更像一家位置不错但有法律敞口的数据供应商，价值可能被压到约 5x-7x ARR。基准情景假设经济性有溢价但未到顶级，支撑约 8.5x-11.5x
              ARR。乐观情景假设管理层能证明软件式留存、健康毛利和可持续 AI 顺风，支撑约 12x-16x ARR。按这个基础，2026 年 7 月 $3.6B
              估值落在基准情景区间内。因此，当前证据支持“观察”建议，信心中等、风险中高、估值立场合理；不是只因 AI 叙事令人兴奋就给出买入。
