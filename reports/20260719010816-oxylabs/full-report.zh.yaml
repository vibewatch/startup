  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Oxylabs 所在市场比泛泛的“代理服务器”更宽，但比所有企业数据基础设施更窄。它包括采集公开 Web 数据的软件和服务、住宅和数据中心代理访问、托管抓取 API、反机器人绕过、浏览器自动化，以及越来越多的开放
              Web 和 AI 事实锚定基础设施。TBRC 的分层覆盖软件与服务、多种部署模型，以及价格监测、市场研究、数据聚合和竞争情报等应用。OpenWebSearch 和 Cloudflare 又加了一层边界：开放
              Web 索引和程序化内容访问，正在成为 AI 系统相邻的基础设施选择。主要替代方案包括官方 API、授权数据集、人工研究、自建爬虫栈，以及开放索引或搜索供应商访问。因此，Oxylabs
              并不只是和其他代理供应商竞争；它也在和内部工程自建、平台级替代方案竞争，后者会在灵活性与合法性、新鲜度或成本可预测性之间取舍。
