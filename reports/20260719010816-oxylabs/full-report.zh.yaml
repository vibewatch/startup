      - 买方得到什么
      - 相较完整抓取栈失去什么
      - 典型买方
      - 为什么 Oxylabs 仍重要
    rows:
      - - 官方 API
        - 合法性高、数据模式稳定、有支持
        - 覆盖有限、配额限制、字段缺失、范围扩张更慢
        - 受监管企业和产品团队
        - 许多重要目标没有暴露足够 API
      - - 授权数据集
        - 数据权利和刷新条款可预测
        - 灵活性低，自定义覆盖更弱
        - 采购主导的企业、金融、研究
        - 自定义目标覆盖和及时性仍需要直接采集
      - - 人工研究
        - 工具支出低，有上下文判断
        - 无法规模化、新鲜度弱、人工成本高
        - 小团队和一次性项目
        - 刷新频率一上来，自动化就胜出
      - - 自建爬虫栈
        - 控制力最大，逻辑可定制
        - 工程负担重，反机器人维护持续消耗
        - 大型平台和数据原生公司
        - 高端提供商缩短见效时间，降低运营风险
      - - 开放 Web 索引访问
        - 搜索 / R&D 用例的广覆盖语料
        - 研究许可或索引约束，按目标定制的控制力较弱
        - 研究人员、主权搜索团队、AI 实验室
        - 精准、交易型或实时目标上，Oxylabs 仍更合适
      - - 低价商品化代理
        - 便宜访问和简单自助
        - 合规弱、IP 质量不稳定、支持深度较低
        - 自由职业者和业余自动化玩家
        - 企业买方往往需要可靠性、KYC 和托管工具
    notes: 表中区分两类选择：一类替代项会消除抓取需求，另一类只是把实现层挪走。
