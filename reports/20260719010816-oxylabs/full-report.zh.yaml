      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场由多个群体采购，他们关心的东西并不相同。大型企业和 SMBs 都出现在 TBRC 的分层中；Apify 的 2026 调查则显示，35.8% 受访者是自由职业者，49.1% 在初创公司或 SMBs
              工作。实际采购群体大致围绕电商和定价情报团队、增长和线索生成团队、市场研究和另类数据团队、网络安全和欺诈团队，以及需要新鲜 Web 数据来训练、检索或驱动智能体的 AI/LLM
              产品团队。预算负责人也随之变化：产品或工程负责人可能负责抓取 API，营销负责人可能负责线索生成抓取，欺诈或威胁情报负责人可能负责对反机器人敏感的数据采集。这种多样性很重要，因为 Oxylabs
              在部分细分市场可以靠企业合规和高端性能取胜，而低成本自助供应商会在自由职业者或小型自动化团队中获胜。销售周期和付费意愿也会随着工作流关键性和法律敏感度显著变化。
