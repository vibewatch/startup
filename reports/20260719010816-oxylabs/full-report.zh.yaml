  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Oxylabs 的乐观情景可信。它是一家自举公司，在拿外部资本之前就做到约 $350M 年经常性收入（ARR）；公司现在声称拥有超过 350,000
              名客户或技术团队，客户证明也足够真实，能显示产品已部署在生产工作流，而不是玩具用例。公司所在类别也因 AI 热潮变得更具战略重要性：这类基础设施让模型和智能体持续连接实时公开 Web
              数据。规模、相关性，以及在争议行业里偏合规的品牌，合在一起，可以支撑相对增长更慢或更商品化数据供应商的溢价。反向逻辑在于，投资人仍然不了解这种规模的质量。公开材料没有披露净留存率（NRR）、毛利率、现金消耗、服务投入强度或头部客户集中度。就连客户数叙事也有多种定义，包括官网首页的
              15,000+ 个客户和融资材料里的 350,000+ 个技术团队。因此，正确的估值问题不是“Oxylabs 是不是好公司？”，而是“当前价格是否已经假设了尚未公开证明的软件级经济性？”
