    sections:
      - number: '7.1'
        title: 监管、隐私和使用合规风险
        blocks:
          - type: paragraph
            body: >-
              Oxylabs 的法律姿态比外界对代理行业的刻板印象更稳，但它能活动的边界正在收紧。公司把合规做得异常外显：信任中心、适用于所有客户的 KYC
              政策、通用条件协议、可接受使用政策和数据处理协议。这些确实能降风险，尤其是可接受使用政策明说，自动化数据采集并非天然违法，但会因方法和使用场景不同触碰法律红线。问题在于，外部监管背景仍在变严。GDPR
              已经约束个人数据处理；EDPB 2026 年 7 月的网页抓取指引也说得很清楚：被抓取数据含有个人数据时，信息公开可得并不会免除隐私义务。与此同时，EU AI Act 下 Article 50 透明度规则将于
              2026 年 8 月 2 日起适用于大量 AI 交互和 AI 生成输出；Oxylabs 正在推进面向 AI 的数据抽取界面，这一点很关键。判例法仍然细腻，并非全面放行：Meta v. Bright Data
              在一个语境下支持公开、未登录抓取，但 LinkedIn 条款仍明确禁止抓取和自动化采集。因此，真正的法律风险不是今天已经看见某个针对 Oxylabs 的执法行动，而是目标站点特定条款、隐私法和 AI
              义务共同制造出不断移动的合规负担，客户或监管者未来可能更激进地测试这条边界。
