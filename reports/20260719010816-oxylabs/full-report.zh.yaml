  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块范围与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Oxylabs 的产品面已经不只是“买代理”。官网和产品页展示的栈从住宅和数据中心连接开始，然后上升到 Web Unblocker、Web Scraper API、Fast Search API，以及
              AI-Scraper 等 AI Studio 应用。放到工作流里，这意味着客户可以在直接流量控制、托管请求执行、特定领域结构化抽取，或面向 AI
              管线的自然语言驱动数据采集之间选择。官方文档把预期递进说得很明确：Web Scraper API 快速上手文档从一次 API 请求开始，隐藏代理轮换、渲染和反机器人逻辑；Web Unblocker
              用代理端点加控制 headers 包住高难目标；AI-Scraper 再往上一层，让用户用自然语言描述想要的输出。因此，最重要的产品结论是架构性的：Oxylabs
              卖的是越来越多的抽象。这有利于客户采用，因为它对应不同待完成任务——从基础设施很重的抓取团队，到更关心输出而非低层网络决策的开发者和 AI 构建者。
