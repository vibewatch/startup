  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与平台范围
        blocks:
          - type: paragraph
            body: >-
              Oxylabs 是一家总部位于立陶宛的私营网页数据基础设施公司，创立于 2015，源自 Tesonet
              生态。官方和合作伙伴资料称，公司最初是高端代理服务商，之后扩展成更完整的全栈网页数据平台，覆盖住宅、移动、ISP 和数据中心代理；Web Scraper API；Web Unblocker；无头浏览器；AI
              Studio；Fast Search API；以及自定义数据集。官网和产品页把 Oxylabs 定位为 AI
              训练、RAG、定价情报、广告验证、网络安全和旅行聚合的基础设施，而不是狭义的抓取工具。这个定位很关键，因为它把公司从有争议的代理销售商，重新定义为智能体 AI
              和企业级公开数据获取的使能层。同一批官方材料也强调伦理、保险覆盖和企业支持，说明管理层希望外界按可靠性、合规和产品栈广度来评价公司，而不是只看低成本访问。
