  - id: TV005
    title: 打穿投资逻辑与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 质量不及预期
        - ARR 桥接显示一次性、低质量或非经常性成分较大
        - 直接削弱 10.3x ARR 锚点
        - 除非价格大幅重置，否则从观察转为放弃
      - - 留存或集中度走弱
        - NRR、流失率或头部客户敞口明显差于预期
        - 推动估值向公开可比区间低端靠拢
        - 用悲观情景倍数重新承销
      - - 法律或平台摩擦上升
        - 平台封锁或监管约束明显推高服务成本
        - 削弱利润率质量和长期可扩展性
        - 下调公允价值区间，并要求缓释证据
      - - 客户体验恶化
        - 企业客户证据停滞，同时退款 / 支持投诉更显眼
        - 暗示旗舰客户群之外的持久性更弱
        - 假设扩张更温和、溢价更低
      - - 后续融资以更低价格成交
        - 下一轮或二级交易在缺少强外生解释时低于当前估值成交
        - 暗示当前价格更多包含稀缺性，而非基本面
        - 将本轮视为私募估值峰值
      - - 治理或优先权悬空问题恶化
        - 轮次条款或未来优先股堆叠明显稀释普通股等效上行
        - 即便企业价值守住，也会压低投资者回报
        - 收紧入场纪律，或回避
    notes: 这些触发项应在尽调或后续融资更新中可观察，而不是笼统的定性担忧。
