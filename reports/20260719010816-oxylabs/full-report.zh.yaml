        - 监管机构正式行动、最终限制性指引，或大客户法律层面的强烈反弹
        - EDPB 指引对 Oxylabs 关键工作流明显收紧，或大客户在法律审查期间暂停部署
        - 从可跟踪的监管风险升级为威胁投资逻辑的合规风险
      - - 平台封锁 / 发布方变现
        - 关键目标类别成功率下降或成本上升
        - 持续劣化，或付费访问成本无法转嫁
        - 下调估值倍数，增加敞口前要求韧性证据
      - - 客户质量恶化
        - 评价结构恶化，或企业客户背书停止扩展
        - 退款 / 支持投诉明显增加，且没有新增企业客户证据抵消
        - 假设长尾留存更弱、支持负担更高
      - - 安全 / 事件处置失败
        - 公开数据泄露、长时间宕机，或认证失效
        - 事件坐实，但缺少有力响应证据
        - 暂停投资判断，直到弄清事件处理和客户影响
      - - 经济性不透明
        - 管理层在尽调中无法提供 NRR、利润率、集中度或现金数据
        - 私有数据仍缺失，或明显削弱公开规模叙事
