  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价架构与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Oxylabs 的公开财务图景以一个异常清晰的核心数字开始，随后很快变得不那么精确。公司 July 2026 投资公告称，Oxylabs 正以 $350 million ARR 运行，并获得全球 350,000
              多个技术团队信任；官网仍称全球 15,000+ 客户信任它。这些数字都指向规模，但分母并不相同，因此应被视为强需求证据，而不是干净的客户队列模型。变现面清楚是经常性加用量的混合模式。公开产品页显示，住宅代理按
              GB 销售，数据中心代理按 IP 和 GB 销售，Web Unblocker 按 GB 销售，Web Scraper API 的报价则可按流量或每 1,000
              个结果销售，取决于套餐。这在经济性上很重要：Oxylabs 既不是纯席位制 SaaS，也不是一次性服务业务。它变现的是持续访问、性能和工作流便利性。这应该支撑经常性收入质量，但公开记录仍未披露产品线组合、折扣，或
              ARR 中来自企业合同、自助渠道和收购渠道的比例。
