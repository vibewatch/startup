      - number: '2.2'
        title: 市场规模口径与区域结构
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估计指向同一个方向——快速增长——但绝对数差异很大。The Business Research Company 估算 2026 的网页抓取市场为 $1.17 billion，并预测到 2030 达到
              $2.28 billion；Mordor Intelligence 则把 2026 市场估为 $1.56 billion、2031 市场估为 $3.49
              billion。这些差异大到不能忽视，可能反映服务、基础设施和相邻产品的纳入规则不同。ScrapingDog 和 WorldMetrics
              在纳入另类数据、主流分析采用或更宽软件类别时，引用的背景数字更大。实际结论是，投资者不应锚定单一 TAM 幻灯片；更合理的做法是把市场看成分层外壳，其中狭义网页抓取软件是低个位数十亿美元级别品类，但更广义的公开
              Web 数据栈更大，而且因为服务 AI、定价、威胁情报和搜索应用而越来越具战略性。TBRC 还称北美是 2025 的最大区域，亚太是增长最快区域，这一格局与西方成熟企业需求、亚洲数字商业和平台规模扩张相一致。
