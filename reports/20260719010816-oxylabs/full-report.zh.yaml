        title: 里程碑、AI 定位与反向信号
        blocks:
          - type: paragraph
            body: >-
              公开时间线显示，Oxylabs 一直从代理基础设施稳步拓展到面向 AI 的网页数据系统。关键里程碑包括创立于 2015、2022 收购 Webshare、2025 收购 ScrapingBee 并推出 AI
              Studio、March 2026 领导层重组，以及 July 2026 Warburg 融资。公司也通过 AI Predictions 2026、DEVWorld 和 AI Engineer World’s
              Fair 明显向开发者和 AI 构建者营销，这支持了 Oxylabs 把智能体 AI 视为主要需求驱动的说法。反向记录没有到生死攸关的程度，但仍相关：Trustpilot、G2 和 Capterra
              都出现了围绕定价、支持响应、退款、KYC 摩擦和小用户可负担性的批评；TNW 也明确指出，网页数据业务仍带有法律和声誉包袱。这些信号不会推翻增长故事，但提醒投资者，Oxylabs
              的高端估值取决于它能否在扩张一个持续受到客户、网站和监管机构审视的行业时，守住合规可信度。
