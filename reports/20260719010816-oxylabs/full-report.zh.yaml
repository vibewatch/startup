  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 收入质量判断
      - 尽调问题
    rows:
      - - 住宅代理
        - 轮换住宅访问及相关附加项带来经常性支出
        - USD / GB
        - 公开套餐显示，入门约 $6/GB，高用量降至 $2.50/GB；提供免费试用
        - 核心经常性用量收入，公开可见高端定价和量价折扣
        - 按住宅代理队列拆分收入占比、流失和毛利率
      - - 数据中心代理
        - 共享、独享和轮换数据中心产品按 IP 和按 GB 变现
        - USD / IP 和 USD / GB
        - 公开定价按产品不同包括 $1.20/IP、$0.70/IP 和 $0.44/GB 入门价
        - 降低对纯住宅支出的依赖，并可能拓宽买家组合
        - 按 IP 与按流量数据中心收入的占比，以及企业支持附加率
      - - Web Unblocker
        - 按流量消耗销售的高端托管反爬访问层
        - USD / GB
        - 公开套餐为 $9.40/GB 至 $7.50/GB，并包含速率限制和充值机制
        - 若性能保持差异化，这可能是价值更高的收入流
        - 毛利率、留存，以及 ARR 中来自 Web Unblocker 工作负载的比例
      - - Web Scraper API
        - 通过 API 套餐和结果 / 流量单位销售的托管结构化数据采集
        - USD / GB 和 USD / 1K 结果
        - 公开页面显示常规定价，以及按目标区分的结果定价和充值机制
        - 把收入从原始连接上移到价值更高的工作流结果
        - 抓取 API、自定义解析器和相关支持服务之间的收入拆分
      - - 搜索 / 快速 API 产品
        - 面向实时 Web / AI 检索用例的搜索型 API 变现
        - USD / 1K 请求
        - Proxyway 显示 Oxylabs 参与快速和常规搜索 API 定价栈
        - AI / 搜索需求可能在代理流量之外创造增量消耗上行
        - 实际收入运行率、产品毛利，以及与核心抓取 API 收入的重叠
      - - 企业定制合同与交叉销售
        - 定制打包、专属客户经理、支持、数据集、合规和收购渠道增售
        - 合同
        - 官方来源提到企业支持、收购、合作伙伴关系和 Fortune 500 / AI 客户，但未披露定价条款
        - 可能是 ACV 最高的收入流，但公开透明度也最低
        - ACV 区间、期限长度、折扣政策，以及收购客户群的扩张
      - - AI Studio
        - 基于积分的 AI 辅助数据提取工作流，按月度套餐打包
        - 月度套餐和额度
