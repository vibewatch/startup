        - ARR 质量高；NRR 和毛利率证明其有类软件经济性；AI 需求继续加速；合规姿态支撑高端企业采用
        - 12x-16x ARR 乘以 ~$350M，对应约 $4.2B-$5.6B
        - 当前不透明可能掩盖较弱经济性；公开可比公司溢价可能均值回归
        - 需要留存、利润率和集中度的强私有证据
      - - 基准
        - 业务质量真实，但并非完全顶级；法律和平台风险仍可控；利润率足够好，但达不到公有云那样的超高水平
        - 8.5x-11.5x ARR 对应约 $3.0B-$4.0B
        - 若 ARR 质量被夸大，投资者仍可能付高价
        - 最符合当前公开证据
      - - 悲观
        - 增长放缓，法律 / 平台摩擦推高服务成本，或客户持久性弱于暗示
        - 5x-7x ARR 对应约 $1.8B-$2.5B
        - 经济性透明后，当前估值被证明过于慷慨
        - 留存弱、集中度高，或倍数向较低公开可比公司压缩时触发
    notes: 情景区间使用 ARR 倍数，因为公开盈利数据过于不完整，无法支撑更精确的 DCF 或 rule-of-40 框架。
