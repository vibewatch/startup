      - number: '7.2'
        title: 运营、可靠性、安全和供应风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，最重要的风险不是工厂或实体设施，而是开放 Web 越来越不友好时，Oxylabs 能否让高成功率数据采集栈持续跑起来。信任中心、Scraper API 和 Web Unblocker 的 SOC 2
              Type 2 披露、ISO 27001 认证都是正面信号；DPA 也包含分处理方、数据泄露通知、删除或返还义务，符合企业客户预期。但产品承诺本身把门槛抬高了。Web Unblocker 主打动态策略发现，Web
              Scraper API 主打结构化、即用型输出；客户一旦依赖这些层，反机器人升级、目标站点改动或基础设施不稳定，都可能很快变成商业痛点。Cloudflare
              的按爬取付费和默认拦截调整，就是这种压力的直接例子。公司还依赖合乎伦理来源的住宅代理供给，并依赖第三方网络参与者持续同意且商业上可用。公开来源没有显示 Oxylabs
              出现重大泄露或事件，这在方向上令人安心，但没有公开事件证据并不等于运营风险低。剩余敞口因此处于中到高：Oxylabs
              看起来比许多代理同行更成熟，但业务仍要靠外部站点、外部网络和持续技术适配来维持客户工作负载运行。
