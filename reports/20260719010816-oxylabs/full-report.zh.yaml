  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 流程 / 组件
      - 角色
      - 依赖项
      - 风险
    rows:
      - - 持有凭证的 API 用户和代理端点
        - 认证访问，并区分产品权限
        - 控制台、凭证发放、用户管理
        - 配置错误或薄弱上手流程会拖慢采用
      - - 输入抽象层
        - 接收 URL、查询、目标 ID、提示词、模式、请求头和地理指令
        - 文档清晰度、SDK、特定目标语法
        - 参数面过于复杂会抬高用户错误率
      - - 网络和路由层
        - 选择 IP 类型、轮换路径、管理重试，并让请求本地化
        - 住宅供应、数据中心机群、地理覆盖、流量管理
        - 来源质量恶化或地理区域被封会拉低表现
      - - 反爬 / 渲染层
        - 处理 CAPTCHA、浏览器指纹、JavaScript 渲染和目标适配
        - 无头 / 浏览器技术、ML 规则、目标监控
        - 防守方持续进化；回归会伤害成功率
      - - 解析和结构化输出层
        - 把原始页面转成结构化 JSON 或 AI 形态输出
        - 特定目标解析器、模式逻辑、提示词保真度
        - 解析器漂移或幻觉式抽取会削弱信任
