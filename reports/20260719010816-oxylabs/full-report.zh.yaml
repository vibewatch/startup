        - ~$350M ARR 以及 350,000+ 客户 / 技术团队叙事，显示品类已有可观规模和相关性
        - 公开利润率和留存指标缺失，规模质量仍不清楚
      - - 市场地位
        - Oxylabs 卖的是智能体网络基础设施，AI 周期中可能获得溢价估值
        - 大平台封锁、隐私压力和法律模糊性可能压住终局倍数
      - - 客户证据
        - 具名客户证据和高端评价信号表明企业场景有真实效用
