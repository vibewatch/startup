      - number: '3.4'
        title: 切换成本、多供应商并用、分发能力与供应获取
        blocks:
          - type: paragraph
            body: >-
              原始代理层的硬锁定效应低于很多企业软件品类，因为底层管道相对标准化。市场上的供应商普遍宣传
              HTTP、HTTPS、SOCKS5、按用量付费或基于用量采购，以及试用或免费层，这降低了只需要传输和轮换的团队的切换摩擦。话虽如此，多供应商并用并非没有成本。一旦买方依赖 Web
              解封锁工具、调好的地理定向、账户支持、特定工作流集成，或供应商托管的反机器人启发式规则，实际切换成本就会上升。分发能力也因类别而异。Bright Data
              受益于围绕数据集、合规和企业级工具的很宽公共叙事；Apify 受益于 Actor 生态和 AI 工具分发。Oxylabs
              的分发看起来最强的是企业采购和高端性能对话，而不是自下而上的免费层采用。不过，真实供给侧护城河的公开证据薄得多：供应商披露代理池规模和伦理来源主张，但不会暴露网络之间的重叠、独家来源合同或按买方队列的流失。这意味着分发和支持比任何可防御的供给独占性更容易被公开观察到。
