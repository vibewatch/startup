evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-control
    missingEvidence: A full board roster, Warburg board rights, founder voting control, and any observer or protective provisions.
    whyItMatters: >-
      Without board and control detail, investors cannot judge governance quality, minority protections, or how much
      practical power shifted after the 2026 round.
    diligencePath: Request the post-close board schedule, investor rights agreement summary, and cap table from management.
    relatedQuestionRefs:
      - QO004
      - QO027
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: customer-metric-definition
    missingEvidence: Formal management definitions for customers, clients, active accounts, and paying enterprise logos.
    whyItMatters: >-
      Valuation and market-position claims can be badly overstated if user-account counts are mixed with paying
      customers or enterprise logos.
    diligencePath: >-
      Ask Oxylabs finance and revops teams for metric definitions used in board materials and fundraising deck
      footnotes.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO005
  - type: private-evidence-only
    severity: material
    topic: capital-structure-detail
    missingEvidence: >-
      Debt facilities, secondary liquidity, preference stack, and any undisclosed side letters tied to the Warburg
      investment.
    whyItMatters: >-
      Headline valuation alone is insufficient for underwriting without knowing leverage, liquidation preferences, or
      shareholder-liquidity terms.
    diligencePath: Obtain financing agreements, shareholder letters, and counsel summary of any debt or secondary components.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: office-footprint
    missingEvidence: A verified list of operating offices, subsidiaries, and legal entities outside Vilnius.
    whyItMatters: >-
      Cross-border employment, tax, and compliance exposure depend on where Oxylabs actually employs people and
      contracts with customers.
    diligencePath: Request legal-entity chart and HR footprint by country from finance or people operations.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO005
      - TO006
  - type: missing-source
    severity: material
    topic: oxylabs-specific-sam
    missingEvidence: >-
      A credible public or management-backed estimate for the serviceable available market specifically addressable by
      Oxylabs’ enterprise-grade public-web data stack.
    whyItMatters: >-
      Generic web-scraping TAMs overstate the directly monetizable opportunity if they include self-build, low-end hobby
      tools, or open-index usage that Oxylabs does not capture.
    diligencePath: Request management’s segment-level TAM/SAM model broken out by enterprise proxy, API, and AI-data workloads.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: ai-demand-mix
    missingEvidence: >-
      A quantified split of current category demand between AI buyers and legacy buyers such as ecommerce, research, and
      cybersecurity.
    whyItMatters: >-
      Valuation narratives increasingly rely on AI tailwinds, but investors need to know whether AI is incremental
      demand or only a fast-growing minority share.
    diligencePath: Ask vendors or management for revenue mix by buyer use case and cohort growth since 2024.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
