schemaVersion: "report-v2"
artifact: customers
slug: orcam-technologies
runDate: 2026-10-26
company:
  name: OrCam Technologies
chapter:
  number: 6
  title: Customers
  summary: Public material documents individual use cases and a one-time 2019 voting deployment, but does not establish a current active-customer base or retention. Reported user-scale figures use different dates and undefined denominators, while 2025 coverage describes OrCam moving away from vision products toward hearing aids.
sections:
  - id: customer-segments-and-access
    title: Users are more visible than buyers or payers
    body: >-
      The assigned evidence identifies blind and visually impaired people, readers with
      learning difficulties, and students as intended users, but it does not segment
      customers by account, revenue, or purchasing authority. The few named accounts are
      individuals describing personal use; the 2019 polling-station example is a public
      access deployment, not evidence of recurring procurement. A CFHU article quotes an
      OrCam spokesperson on specialist distributors, clinics and hospitals, opticians,
      direct sales, and efforts to obtain public or insurance reimbursement. Those are
      company-described routes, not measured channel mix or proof of who ultimately paid.
      A separately quoted MyEye price is undated in the assigned source material, so it
      cannot establish current affordability or reimbursement.
    claimRefs: [CU001, CU002, CU012, CU015, CU016]
    tableRefs: [TU001]
  - id: adoption-metrics-and-vintage
    title: Adoption figures are not a comparable time series
    body: >-
      The public figures are three unlike claims: VisionPlus reported more than 400,000
      people worldwide in a December 2023 article, CFHU quoted a company representative
      describing tens of thousands of users across 50 countries, and OrCam's U.S. site
      says its devices are used by thousands. The latter two have no publication date in
      the retained material, and none defines active versus cumulative users or supplies
      a measurement method. Calcalist separately reported peak annual sales of $50
      million without naming the peak year; this is sales, not ARR or a customer count.
      Apple's 3.5/5 score from two app ratings is a tiny sample about the companion app,
      not a proxy for device adoption. These indicators should remain separate.
    claimRefs: [CU006, CU007, CU008, CU009, CU013, CU014]
    tableRefs: [TU002]
  - id: named-customer-evidence
    title: Named stories show use, not audited outcomes
    body: >-
      The strongest named-use evidence is a set of personal accounts: CFHU recounts
      Dorothy Boyd using MyEye to read screens and printed material and Holly Bonner
      reading a restaurant menu, while VisionPlus recounts student Domingos using the
      device to access books. The same CFHU article reports availability at 12 polling
      stations in Israel's April 2019 election. These examples make the use cases
      concrete, but the assigned sources do not provide independently audited outcomes,
      purchase dates, device activation records, or evidence that the cases represent a
      current production cohort. Product pages help establish context for the described
      functions; they do not independently verify the named individuals or their
      reported outcomes.
    claimRefs: [CU002, CU003, CU004, CU005, CU001, CU014]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Retention and customer concentration remain unverified
    body: >-
      No retained source reports NRR, GRR, churn, renewal rates, contract length,
      repeat-purchase behavior, active deployments, or customer revenue concentration.
      The gap matters because personal testimonials and one election deployment cannot
      establish durable paid usage. Calcalist reported in March 2025 that OrCam had
      discontinued its vision-related products and was focusing on hearing aids, while
      the hearing product had yet to generate revenue at that time. That reporting
      changes the interpretation of legacy MyEye customer evidence but does not identify
      current hearing customers. The journey figure is therefore an evidence map of
      described touchpoints and missing proof, not a measured conversion funnel or a
      claim that every user follows the same route.
    claimRefs: [CU010, CU011, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segments and public access evidence
    columns:
      - Segment
      - Buyer / user / payer evidence
      - Use or route described
      - Scale or commercial significance
      - Diligence gap
    rows:
      - - Blind or visually impaired individuals
        - Named users are described; buyer and payer are not identified.
        - Reading screens, printed text, and a restaurant menu.
        - Individual-use stories, not a representative cohort.
        - Verify active users, purchase dates, and who paid.
      - - Readers with learning difficulties
        - The profile sources identify this as a target user group; no buyer split is reported.
        - Reading and learning support is described in company and profile material.
        - No segment-specific account, utilization, or revenue metric.
        - Request product-level active-user and revenue data.
      - - Public-sector access
        - A 2019 report describes a public voting-station deployment; procurement terms are absent.
        - Technology was made available at 12 Israeli polling stations.
        - A dated deployment example, not proof of a recurring contract.
        - Obtain contract, funding, and repeat-deployment records.
      - - Reimbursement and specialist channels
        - A company spokesperson described possible public or insurance support; actual payer mix is unknown.
        - Specialist distributors, clinics, hospitals, opticians, and direct sales were named.
        - The source gives no channel shares or current status.
        - Confirm current distributors, reimbursement, and net price by market.
      - - Hearing-aid prospects
        - The reported product was nearly ready in March 2025; no paying customer was identified.
        - Calcalist reported a hearing-aid pivot after vision-product discontinuation.
        - The article said the hearing product had not generated revenue at that time.
        - Verify launch status, paid pilots, and current customer count.
    notes: >-
      Partial public-evidence map, not an exhaustive customer enumeration. User, buyer, and
      payer are kept distinct; company-described channels and personal accounts are not
      treated as verified revenue or repeat deployments.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU010, CU011, CU012, CU015, CU016]
  - id: TU002
    title: Public adoption and commercial indicators
    columns:
      - Metric
      - Reported value
      - Date / period
      - Source and confidence
      - Implication and missing denominator
    rows:
      - - People reached worldwide
        - More than 400,000 individuals
        - VisionPlus article published 2023-12-05
        - VisionPlus report; low confidence for current active usage.
        - No definition, method, or distinction between cumulative and active users.
      - - Users across markets
        - Tens of thousands; 25 languages; 50 countries
        - Publication date not supplied in retained material
        - CFHU article quoting an OrCam spokesperson; medium confidence as an attributed company claim.
        - No user definition, measurement method, or comparable reporting period.
      - - Users worldwide
        - Thousands
        - Company page publication date not supplied
        - OrCam-operated site claim; low confidence as a quantified adoption measure.
        - No exact count, period, or active-versus-cumulative definition.
      - - Peak annual sales
        - $50 million
        - Reported by Calcalist in 2025; peak year not stated
        - Independent news report; medium confidence.
        - Sales are not ARR or a customer count; product mix and period are unspecified.
      - - OrCam iOS app rating
        - 3.5 out of 5 from 2 ratings
        - App Store listing as retrieved 2026-10-26
        - Apple listing; high confidence for the displayed app-rating snapshot only.
        - Two app ratings do not measure device adoption, satisfaction broadly, or retention.
    notes: >-
      The user-scale claims are separately attributed and not reconciled: their dates,
      definitions, and denominators differ or are missing. The $50 million figure is
      reported annual sales, not ARR; the app rating is not a device-customer metric.
    claimRefs: [CU006, CU007, CU008, CU009, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or deployment
      - Segment and setting
      - Reported use
      - Production versus pilot / reference quality
      - Source and limitation
    rows:
      - - Dorothy Boyd
        - Visually impaired individual; Florida
        - CFHU recounts use for iPad and Kindle screens, print Bible and prayers, and presentations.
        - Personal testimonial; purchase, activation, and outcome are not independently audited.
        - CFHU account; product-context sources do not independently verify her identity or experience.
      - - Holly Bonner
        - Visually impaired individual; Staten Island
        - CFHU recounts that she read a restaurant menu herself during a dinner outing.
        - Personal testimonial; no contract, purchase, or longitudinal outcome data.
        - CFHU account; the broader product descriptions are context, not corroboration of this case.
      - - Domingos
        - Blind student; Bahia, Brazil
        - VisionPlus recounts that MyEye enabled access to books and information.
        - Named-user story; no independently measured educational outcome or purchase record.
        - VisionPlus account; other product material does not independently verify this case.
      - - Israeli polling stations, April 2019
        - Public-sector access; 12 polling stations
        - CFHU reports that OrCam made its technology available to support independent voting.
        - Dated deployment example; contract value, duration, and repeat use are not reported.
        - CFHU report; no procurement or election-authority record is in the assigned pool.
    enumerationScope:
      coverage: sample
      basis: Selected named cases and one public deployment in assigned sources, not an exhaustive customer list or verified production cohort.
    notes: >-
      Selected examples only. Each account is attributed to its reporting source; any
      second source linked at table level provides product context, not independent
      verification of the named person, deployment, or outcome.
    claimRefs: [CU002, CU003, CU004, CU005, CU001, CU014]
figures:
  - id: FU001
    title: Customer journey evidence map
    type: journey-map
    summary: Public sources describe possible user, access, setup, and usage touchpoints, but provide no conversion, payer, or retention series.
    data:
      items:
        - label: Need and user segment
          touchpoints: People with vision impairment or reading difficulties are identified as target users; segment size and payer are not established.
        - label: Discover and access
          touchpoints: A company spokesperson named specialist distributors, clinics, hospitals, opticians, and direct sales; channel mix is unknown.
        - label: Select and fund
          touchpoints: CFHU quoted a $4,500 MyEye price without a publication date in the retained material; current price and reimbursement are unknown.
        - label: Configure and support
          touchpoints: Apple and Google Play listings describe an app for device controls and support; listing presence does not establish active use.
        - label: Use in daily tasks
          touchpoints: Reports describe reading, individual testimonials, and a 2019 voting-station deployment; outcomes are not audited.
        - label: Retain or expand
          touchpoints: No cohort, renewal, churn, or expansion data is public in the assigned evidence; 2025 reporting describes a product pivot.
    claimRefs: [CU002, CU003, CU004, CU005, CU010, CU014, CU015, CU016]
