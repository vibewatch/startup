  evidenceGaps:
    - type: missing-source
      severity: material
      topic: active-customer-count
      missingEvidence: A dated, product-level count of active and cumulative customers with definitions, reporting periods, and geographic coverage.
      whyItMatters: The retained public figures are differently attributed and lack comparable periods or denominators, so they cannot establish current commercial adoption.
      diligencePath: Request management's monthly active-device and cumulative-customer series by product, with reconciliation to paid units and returns.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A current and complete list of named production deployments with customer permission, deployment dates, outcomes, and reference contacts.
      whyItMatters: The selected public stories are a sample and cannot establish the breadth, repeatability, or current status of OrCam's customer deployments.
      diligencePath: Request a dated deployment register and obtain permission to speak with a representative mix of current and former customers.
      relatedQuestionRefs: [QU002, QU005]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Product- and cohort-level renewal, churn, repeat-purchase, utilization, and customer satisfaction data.
      whyItMatters: Named testimonials and isolated access examples do not show whether customers continue using or paying for devices.
      diligencePath: Obtain anonymized cohorts with activation dates, usage, returns, support cases, and renewal or replacement behavior.
      relatedQuestionRefs: [QU006]
    - type: private-evidence-only
      severity: material
