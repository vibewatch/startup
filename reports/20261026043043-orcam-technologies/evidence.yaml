evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A reconciled financing schedule with transaction dates, amounts, round labels, secondary sales, debt or credit
      balances, and sources of funds, including the reported SAFE.
    whyItMatters: >-
      Tracxn, Startup Nation Central and FundedIQ report materially different cumulative funding totals and round
      counts, which cannot be treated as cash available.
    diligencePath: >-
      Request the company financing ledger, signed instruments, audited statements and investor-by-investor cap table,
      then reconcile them to all three platform records.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated employee and contractor count with consistent definitions and geographic coverage.
    whyItMatters: >-
      The undated FundedIQ band and Tracxn's August 2026 count use different formats and do not establish current
      operating scale.
    diligencePath: >-
      Obtain a current HR roster and contractor schedule with an as-of date, then reconcile both public database
      snapshots.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: >-
      Audited current revenue, gross margin by product, cash balance, cash-flow or burn data, active customer
      denominator, and Hear product sales.
    whyItMatters: >-
      Historical reported revenue and a planned shift to Hear do not demonstrate current liquidity, product economics or
      commercial traction.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, product-line revenue and margin, cash-flow
      bridge, cohort/return data, and Hear launch and sales records.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: current-leadership-governance
    missingEvidence: >-
      A current executive and board roster, organization chart, voting/control schedule and related-party transaction
      approvals.
    whyItMatters: >-
      Available coverage identifies founders and a historical investor dispute but does not verify current governance or
      key-person dependencies.
    diligencePath: >-
      Request the current board and officer register, shareholder agreement, governance minutes and related-party
      transaction approvals.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: OrCam-specific SAM and SOM
    missingEvidence: >-
      Current eligible product scope, realized price, sales geography, customer count, payer coverage, and product-level
      sales needed to calculate an OrCam-specific serviceable or obtainable market.
    whyItMatters: >-
      Broad impairment populations, global low-vision-device revenue, and adjacent AI-medical-device estimates do not
      establish the buyers, budgets, or company share that drive valuation.
    diligencePath: >-
      Obtain current product-level revenue and unit data, price and gross margin by product, country availability,
      reimbursement and procurement records, and a bottom-up eligible-user conversion model from management and channel
      partners.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitive-pricing
    missingEvidence: >-
      Current vendor quotes and comparable realized prices, contract terms, reimbursement, service, and warranty costs
      for OrCam and direct peers.
    whyItMatters: >-
      Without a common price and service basis, the report cannot assess buyer trade-offs, affordability, or price-based
      defensibility.
    diligencePath: >-
      Collect dated quotes for matched user tasks from OrCam, eSight, Ocutech, Freedom Scientific, and relevant
      distributors; record configuration, support, and payer.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level renewal, migration, multi-device use, training, service, and channel data for OrCam and alternative
      solutions.
    whyItMatters: >-
      Product descriptions alone cannot establish retention, switching friction, distribution advantage, or durable
      lock-in.
    diligencePath: >-
      Request cohort retention and replacement data, channel contracts, support obligations, customer references, and
      customer interviews segmented by task.
    relatedQuestionRefs:
      - QP007
  - type: stale
    severity: material
    topic: competitor-currentness
    missingEvidence: >-
      Dated 2026 status checks for competitor product availability, launches, target segments, and OrCam's vision-device
      sales and support status.
    whyItMatters: >-
      The strongest adverse product report is from March 2025, and the fetched company page is undated; either may
      misstate the current competitive set.
    diligencePath: >-
      Verify active SKUs, availability, and support directly with the company and competitors, then obtain current
      product documentation and dated customer references.
    relatedQuestionRefs:
      - QP009
  - type: conflicting-data
    severity: material
    topic: product-status
    missingEvidence: >-
      Primary, dated confirmation of whether OrCam still sells, services, or supports vision products alongside its
      hearing-aid activity.
    whyItMatters: >-
      The 2025 third-party report and current-facing but undated company page imply different product availability and
      strategic focus.
    diligencePath: >-
      Confirm active catalog, inventory, sales by product line, and support obligations with OrCam; reconcile the answer
      to dated reseller and customer records.
    relatedQuestionRefs:
      - QP002
      - QP009
  - type: missing-source
    severity: material
    topic: landscape-coverage
    missingEvidence: >-
      Named buyer internal-build cases, a dated likely-entrant pipeline, and comparable current privacy, regulatory,
      support, and partner-channel evidence.
    whyItMatters: >-
      Without these inputs, the landscape cannot determine whether native tools or new entrants weaken dedicated-device
      differentiation, or whether trust and distribution reinforce it.
    diligencePath: >-
      Interview accessibility buyers on build-versus-buy choices; check current product announcements and regulatory
      documentation; confirm channel terms and support arrangements with the company and distributors.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited current revenue by product and geography, units, net realized prices, gross margin, COGS, warranty/service
      cost, and reconciled revenue-recognition policy.
