company:
  name: OrCam Technologies
chapter:
  number: 1
  title: Company Overview
  summary: OrCam is an assistive-technology company associated with wearable and handheld vision products, founded in Jerusalem in 2010. Public reporting describes a shift from vision products toward hearing technology, investor disputes and sharply lower reported revenue; current financials, cap table, headcount and commercial traction remain unverified.
sections:
  - id: identity-and-product
    title: Identity, products and evidence of use
    body: >-
      Bloomberg describes OrCam as a developer of handheld and wearable assistive
      devices for people with visual and learning challenges; FundedIQ's profile
      likewise describes AI-enabled products for reading, product identification
      and face recognition (CO001). These descriptions establish the product
      category, not current availability or unit economics. In July 2024, CTech
      reported that OrCam said it would stop further Low Vision product
      development and shift its focus to the Hear division, which was entering
      marketing and sales (CO010). That is a dated company statement relayed by
      a news outlet, not confirmation of the portfolio in October 2026. Abilities
      Expo reproduces an individual user's account of reading independently
      with OrCam Read (CO014); it is a qualitative testimonial, not a measured
      customer outcome or representative adoption sample. Current product
      availability, sales channels and customer totals are gaps.
    claimRefs: [CO001, CO010, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership and governance
    body: >-
      Tracxn and Startup Nation Central identify Amnon Shashua and Ziv Aviram
      as OrCam's co-founders and place the company in Jerusalem at its 2010
      founding (CO002). 2025 reporting identifies them as controlling
      shareholders; the latter also reports that they jointly put about $9
      million into a SAFE financing and sought a conversion valuation of
      $30–40 million (CO007, CO008). Calcalist and Globes describe a dispute
      with institutional investors over SAFE conversion and dilution terms
      (CO008). These reports show founder influence and a financing
      concentration, but do not establish current board composition, voting
      rights, executive responsibilities or the operative SAFE documents.
      The 2024 profile also names Elad Serfaty as CEO, but does not verify his
      role in October 2026 (CO013). The leadership table therefore treats
      founder status as established history and flags current roles and
      key-person arrangements for direct diligence.
    claimRefs: [CO002, CO007, CO008, CO013]
    tableRefs: [TO002, TO003]
  - id: funding-and-operating-scale
    title: Funding, valuation and operating scale
    body: >-
      Historical financing records do not reconcile to one total. Tracxn
      reports $86.4 million across four rounds, Startup Nation Central reports
      $131.4 million across seven rounds, and FundedIQ displays $181 million
      across one recorded round, which it dates to July 2024 (CO004, CO005).
      Those platform figures are not equivalent to cash available.
      Separately, Tracxn lists a 2018 financing of $30.4 million at a $1
      billion post-money valuation (CO003), and CTech reported a $50
      million raise at a $1.5 billion valuation in March 2021 (CO015).
      Globes later reported revenue of $45–50 million in 2023 and $16 million
      in 2024, mainly from smart reading glasses (CO006); these are reported
      revenue figures, not ARR, audited results or cash burn. Current revenue,
      margins, liquidity and financing terms are not established. Employee
      snapshots also differ: Tracxn lists 171 as of August 31, 2026, while
      FundedIQ gives an undated 251–500 band (CO012). The KPI table
      preserves the dates and gaps rather than selecting a current value.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO012, CO015]
  - id: milestones-and-diligence
    title: Milestones and unresolved diligence
    body: >-
      The dated sequence shows an assistive-vision business founded in 2010,
      historical financing at large reported valuations, and a 2024 pivot
      followed by 2025 financing stress. The February 2024 hearing-activity
      spin-off plan comes from Startup Nation Central's company profile
      (CO016); the July 2024 Low Vision change is a company statement carried
      by CTech (CO010). In March 2025, CTech reported a SAFE-conversion dispute
      and a requested $2 million loan, while Globes described the recovery
      plan and a steep decline in estimated valuation (CO008, CO009). Neither
      the 2024 pivot nor the 2025 financing accounts establish today's
      operating position. The timeline anchors what the assigned evidence
      actually dates; later milestones, current leadership, a verified
      financing/cap-table record, current sales and Hear unit economics remain
      open diligence items.
    claimRefs: [CO003, CO008, CO009, CO010, CO011, CO015, CO016]
    figureRefs: [FO001]
