    title: Confirm whether vision devices remain a live commercial line
    body: >-
      CTech's 2025 report of discontinued vision products conflicts with
      OrCam's undated product marketing. Confirm active SKUs, inventory,
      support obligations, and current sales before underwriting a vision
      product moat or comparing current scale.
    claimRefs:
      - CP001
      - CP003
