company:
  name: OrCam Technologies
chapter:
  number: 8
  title: Valuation
  summary: Public evidence shows a steeply deteriorated operating profile and a disputed 2024 SAFE conversion, but it does not establish current revenue, financing terms, or an investable price. The evidence supports a research-more decision with low confidence and high risk, not a point valuation or return forecast.
sections:
  - id: public-price-and-performance
    title: Public price marks do not establish current value
    body: >-
      The available valuation markers are historical and inconsistent in date and meaning. Tracxn records a $1 billion post-money mark for February 2018, while SetterVC lists a $1.5 billion mark for March 2021; neither is a current transaction or a realizable exit value (CV001). More recent operating evidence is more decision-relevant: Calcalist reported annual sales near $50 million at peak and about $16 million in 2024, while SetterVC summarizes 2023 sales at $45–50 million (CV004). These are reported sales, not audited revenue or ARR, and the 2024 number is not a 2026 run rate. Startup Nation Finder and SetterVC also publish different cumulative-funding totals and round counts (CV008), underscoring that database totals are not a substitute for a reconciled capitalization history. The current official product pages still list vision-assistance devices (CV006), but listings and company-reported user reach do not establish current sell-through, gross margin, retention, or cash generation (CV007). No current equity price can be inferred from the old marks or marketing evidence.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
  - id: financing-and-ownership
    title: Financing uncertainty dominates entry risk
    body: >-
      Calcalist reported that the founders put about $9 million into a SAFE round around eight months before its March 2025 article and sought conversion at a $30–40 million valuation; institutional investors opposed the conversion mechanism, and the company disputed their position (CV002). The article also reported a requested additional $2 million loan and further workforce reductions while OrCam worked on a hearing product that had not yet generated revenue (CV003, CV005). These are dated reported positions, not proof that the SAFE converted, that the loan closed, or that the same terms remain outstanding in October 2026. The assigned sources do not disclose a current cap table, preference stack, debt schedule, or final SAFE conversion outcome (CV012). The value transfer between founders and earlier investors could therefore differ materially from headline enterprise value. Before underwriting any security, obtain executed financing documents, fully diluted ownership, senior claims, cash and debt balances, and a current board-approved operating plan; otherwise a nominal share price cannot be translated into common-equity proceeds.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV012
    tableRefs:
      - TV002
  - id: scenario-and-comparable-screen
    title: Scenarios are conditional, not numeric forecasts
    body: >-
      A bull case requires evidence that the hearing product is launched, gains paying customers, and produces positive contribution after commercialization costs; the assigned March 2025 reporting said it had not yet generated revenue (CV005). The base case is continued uncertainty: legacy product listings remain visible, but current audited financials and unit economics are unavailable (CV006, CV012). The bear case is a failed pivot alongside unresolved dilution or financing claims, which could impair common holders even if the products retain user value (CV002, CV013). None can responsibly be assigned a company valuation range or probability from these sources. The comparison screen also fails to supply a usable multiple: Mobileye's cited market capitalization is for an autonomous-driving business, and Sonova's fetched official page describes a large, vertically integrated hearing-care operator but provides no OrCam-specific valuation basis (CV009, CV010). Neither is treated as an independent OrCam benchmark. Sight-device company claims and competitor descriptions are similarly not substitutes for like-for-like financials. The scenario table therefore leaves ranges unestimated pending primary financial and transaction evidence.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
      - CV013
    tableRefs:
      - TV003
  - id: recommendation-and-diligence
    title: Research more before setting an entry price
    body: >-
      The evidence supports research-more, low confidence, and high risk, with no defensible public entry price today (CV013). The product proposition is credible as a company-described accessibility use case, and the company continues to display products, but public usage claims are not independently verified commercial traction (CV006, CV007). Conversely, the reported sales contraction, disputed financing mechanics, and missing current financial statements make a valuation based on the old billion-dollar marks especially unreliable (CV001, CV002, CV004, CV012). Ethical and reputational scrutiny is also a possible diligence topic: an advocacy profile explicitly frames tension between the company's assistive-technology purpose and its political context, but provides no evidence that this has caused lost customers, procurement restrictions, or reduced value (CV011). A price-sensitive decision should wait for audited recent revenue and margins, current cash and obligations, confirmed SAFE and preference terms, and proof of hearing-product commercialization. Revisit only if those materials support an equity-level return case after senior claims, rather than relying on a financing headline or mission value.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV001
    figureRefs:
      - FV001
