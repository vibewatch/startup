  - id: TV001
    title: Recommendation summary
    columns:
      - Decision dimension
      - Evidence-based position
      - Investment implication
    rows:
      - - Recommendation
        - Research-more; no entry price endorsed
        - Require primary financial and financing evidence before committing
      - - Confidence and risk
        - Low confidence; high risk
        - Private-company data gaps and disputed financing terms prevent reliable equity underwriting
      - - Valuation stance
        - Not currently underwritable
        - Do not translate historical marks or reported conversion proposals into a present value
    notes: Historical marks and reported financing positions are not current transaction prices; no return or valuation range is estimated.
    claimRefs:
      - CV001
      - CV002
      - CV012
      - CV013
  - id: TV002
    title: Investment thesis and anti-thesis
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Assistive-product proposition
        - OrCam's current official pages list MyEye, Read 3, and Read; its user-reach statement is company-reported
        - Independent paid-user, renewal, and channel data with product-level contribution margins
      - - Commercial momentum
        - Calcalist reported annual sales near $50 million at peak and about $16 million in 2024
        - Audited 2025–2026 revenue, gross margin, inventory, and cash-conversion data
      - - Hearing pivot
        - March 2025 reporting said the hearing product had not yet generated revenue
        - Verified launch, paying customers, repeat use, and unit economics
      - - Capital structure
        - Calcalist reported a disputed SAFE conversion proposal and a requested additional loan
        - Executed SAFE, loan, preference, and fully diluted cap-table documents
    notes: Reported operating figures and financing positions retain their source dates; company statements are not treated as independent demand validation.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: Conditional bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions and signal
      - Valuation / return logic
      - Downside trigger and diligence
    rows:
      - - Bull
        - Hearing product launches and converts into paid, repeatable demand; low-confidence upside signal
        - No numerical valuation range is supportable without current revenue, margins, cash needs, and security terms
        - Failure to demonstrate paying customers or positive product contribution invalidates the case
      - - Base
        - Current evidence remains incomplete; vision-device listings persist, while hearing commercialization and current economics are unverified
        - No public price or forecast supports a numerical value or target return; hold for diligence
        - Obtain audited recent financials, customer economics, and fully diluted capitalization
      - - Bear
        - Hearing pivot stalls and financing or dilution disputes remain unresolved; material downside signal, not a probability estimate
        - Common-equity value and loss severity cannot be quantified from available public evidence
        - Confirm debt, preferences, SAFE conversion, liquidity needs, and product discontinuation exposure
    notes: Scenario ranges and probability percentages are deliberately not fabricated; scenario signals are qualitative and conditional on evidence not yet available.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV012
      - CV013
      - CV014
