              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite to a stale unicorn mark
            body: >-
              The cited $1B and $1.5B valuations are historical reports; the 2025 down-valuation is an estimate, not a
              priced financing. Obtain current cap-table, SAFE, liquidation-preference and audited operating data before
              assigning value to either the vision business or Hear.
