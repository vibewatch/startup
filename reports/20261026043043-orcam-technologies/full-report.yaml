        - >-
          High strategic exposure if lower-cost general-purpose tools replace paid device use; no comparable performance
          or customer-substitution study is available.
        - No product differentiation, retention, or benchmark evidence in this pool establishes a durable mitigation.
        - >-
          Request current independent task-level benchmarks, customer interviews, renewal and usage data, and product
          roadmap evidence.
    notes: >-
      Dated press reports and company marketing are not current operating metrics. The workforce snapshots are not
      directly comparable and do not establish a headcount trend.
    claimRefs:
      - CR003
      - CR004
      - CR009
      - CR010
      - CR011
      - CR012
  - id: TR003
    title: Partner and capital dependency register
    columns:
      - Dependency and counterparty
      - Role and concentration
      - Failure scenario and severity
      - Mitigation and residual exposure
      - Diligence path
    rows:
      - - Institutional investors and SAFE holders
        - >-
          Calcalist named Clal, Harel, Leumi, and Meitav in a reported dispute; ownership percentages and concentration
          are not established here.
        - Conversion or investor-rights disagreement could impede recovery financing; severity is material.
        - No resolved terms or signed waiver are evidenced; residual exposure remains material.
        - >-
          Reconcile investor register, SAFE mechanics, preference stack, voting rights, and written consent to any
          bridge financing.
      - - Founders and bridge capital
        - >-
          Calcalist reported founder investment of around $9 million and a request for an additional $2 million loan;
          receipt and terms are unknown.
        - >-
          Failure to fund or disagreement over conversion could constrain cash and governance; the current likelihood
          and cash balance are unknown.
        - Requested funding is not cash available; no verified runway or contingency plan is in the pool.
        - >-
          Confirm executed loan documents, drawdown, maturity, security, repayment priority, and a current 13-week cash
          forecast.
      - - Hear manufacturing, distribution, and support counterparties
        - >-
          No named supplier, manufacturer, distributor, or service partner for Hear is established in the assigned
          sources.
        - >-
          A single-source or unavailable partner could delay launch and installed-base support; concentration and
          likelihood are unknown.
        - No alternate-source or continuity plan is evidenced; residual exposure is unquantified.
        - >-
          Obtain named-counterparty contracts, capacity and quality records, service-level commitments, inventory, and
          second-source plans.
    notes: >-
      Counterparty concentration and financing availability are not quantified by the cited material; the register
      distinguishes reported requests from executed or available capital.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR015
