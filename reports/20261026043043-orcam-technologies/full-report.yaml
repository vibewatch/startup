  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market before sizing it
        blocks:
          - type: paragraph
            body: >-
              The underlying need is not itself OrCam's addressable market. WHO reports at least 2.2 billion people with
              near or distance vision impairment, and says at least 1 billion cases could have been prevented or remain
              unaddressed; these are condition and access measures, not counts of prospective device purchasers (CM001,
              CM002). A defensible boundary therefore separates eye-care prevention and correction, the residual
              functional needs that may call for assistive tools, and sales of low- vision devices. TBRC's device
              category includes optical and electronic products, reading tools, screen readers, braille displays, and
              wearable systems, well beyond any single OrCam product (CM007, CM013). Population prevalence cannot be
              multiplied into TAM without evidence for unmet device-specific need, willingness to pay, payer, and
              eligible geography.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
              - CM014
              - CM015
              - CM017
      - number: '2.2'
        title: Public estimates bound a category, not OrCam's SAM
        blocks:
          - type: paragraph
            body: >-
              The closest accessible revenue lens is TBRC's global low-vision assistive-devices category: it reports
              $1.23 billion for 2025, $1.34 billion for 2026, and a forecast of $1.89 billion in 2030, with 8.9%
              historical and 9.0% forecast CAGR figures for their stated periods (CM008). Its market value uses
              manufacturer/creator factory-gate sales of goods and services, excludes downstream resales, and spans
              multiple product classes rather than OrCam alone (CM009, CM013). WHO's global impairment counts and the
              NEI/CDC U.S. surveillance context describe population need and measurement, not payer-qualified device
              demand (CM001, CM002, CM003). TechList reports about 50.5K monthly visits to orcam.com, which is web
              traffic rather than purchasers, revenue, or conversion (CM018). The available evidence cannot isolate
              OrCam's current product-fit users, payer coverage, price, or sales, so a company-specific SAM or SOM
              remains unquantified (CM016).
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM013
              - CM016
              - CM018
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM016
              - CM018
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
              - CM009
              - CM016
      - number: '2.3'
        title: Users are segmented; payment paths are not
        blocks:
          - type: paragraph
            body: >-
              The market taxonomy distinguishes magnifiers, reading devices, wearables, screen readers, and other
              products; it also groups use into education, healthcare, and personal use, with children, adults, and
              older people as end-user categories (CM013). OrCam's own page targets people who are blind, visually
              impaired, or have reading challenges (CM005); an Abilities Expo case page says the Northern Ireland
              Policing Board decided to provide funding for one board member's OrCam MyEye (CM010). That is a specific
              institutional-use example, not evidence of completed payment, routine coverage, or broad procurement. The
              market report lists online, specialty, and optical channels but does not identify who controls each budget
              or typical device prices (CM013, CM016). WHO reports that one in two people globally who need cataract
              surgery cannot access it, while CDC notes affordable eyeglasses and eye care may prevent unnecessary
              vision loss; these are care-access constraints, not device conversion rates (CM006). NEI and CDC also
              stress that population surveillance estimates depend on collection and participation, so prevalence is a
              starting point for segmentation rather than a sales forecast (CM003). Product-specific buyers, payers,
              channel prices, and sales remain diligence priorities.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM005
              - CM010
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM013
              - CM016
              - CM017
              - CM018
      - number: '2.4'
        title: Need growth competes with substitution and product focus
        blocks:
          - type: paragraph
            body: >-
              WHO identifies population aging and growth as factors increasing vision- impairment risk, while
              affordability, eye-care availability, and awareness vary by geography (CM004, CM006). Those forces can
              enlarge unmet need without guaranteeing demand for a premium wearable. In July 2024, Globes reported OrCam
              would halt development of visual-aid devices and focus on hearing products; the company attributed the
              shift to advances in image processing by language models (CM014). Separately, Globes reported that OpenAI
              was developing similar technology for use from mobile phones, a potential substitute rather than proof of
              adoption or equivalent performance (CM015). In March 2025, CTech reported that Hear was nearing market
              readiness but had not generated revenue at that time (CM017). TechList's estimate of monthly visits to
              orcam.com is a website-interest proxy only; it does not establish device demand or purchasing conversion
              (CM018). Current product availability, sell- through, and payer economics remain essential gaps.
            claimRefs:
              - CM004
              - CM006
              - CM014
              - CM017
              - CM015
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer's alternatives span more than device brands
        blocks:
          - type: paragraph
            body: >-
              The prefetched evidence identifies several dedicated product peers, but it does not establish a ranked
              market or comparable market shares. Tracxn names Ocutech, Freedom Scientific, and Deep Optics among
              OrCam's competitors; its descriptions distinguish Ocutech's bioptic low-vision aids from Deep Optics'
              adaptive glasses. The Business Research Company (TBRC) lists a wider set of low-vision suppliers,
              including HumanWare, HIMS, IrisVision, eSight, and Vispero, without assigning share or verifying
              head-to-head capability. Caplight's related-company list is based on embedding similarity and is therefore
              an adjacency signal, not a direct-comparison benchmark. These directories help define a diligence
              universe, not establish which vendor wins a buyer's workflow. The pool does not document buyer
              internal-build cases or a named likely-entrant pipeline, so those parts of the landscape remain unassessed
              rather than presumed absent. (CP007, CP008, CP009, CP013, CP015)
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP015
      - number: '3.2'
        title: Product overlap is visible; workflow and switching evidence is not
        blocks:
          - type: paragraph
            body: >-
              OrCam's public-facing product surfaces describe assistive vision and reading support through wearable and
              handheld devices. The company's Read product is presented as a handheld reader, and its iOS app listing
              describes settings and device-management functions; neither source establishes realized pricing or user
              retention. TBRC reports eSight's July 2025 eSight Go launch with camera and display specifications, which
              establishes a current-at-publication wearable product example but not equivalent reading, recognition, or
              text-to-speech performance. For navigation and daily independence, APH ConnectCenter documents
              orientation-and-mobility instruction using nonvisual cues as another way to address parts of the user's
              job. The available sources do not disclose switching costs, multi-homing, or channel access on a basis
              that supports a lock-in conclusion. (CP001, CP002, CP010, CP012, CP015, CP016)
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP012
              - CP015
              - CP016
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP008
              - CP010
              - CP012
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP014
              - CP016
      - number: '3.3'
        title: The most consequential pressure is strategic, not a proven feature gap
        blocks:
          - type: paragraph
            body: >-
              CTech's March 2025 report described OrCam as having discontinued its vision products and focused on
              hearing aids, while still completing hearing-aid development and liquidating remaining vision inventory.
              The same report said the relatively bulky camera-and-glasses product had become less attractive as the
              market shifted toward software-based solutions. That is adverse, dated reporting, not a current audited
              product-status update. In tension, OrCam's undated site still markets artificial-vision products.
              AskCyborg separately flags consumer smartphones with advanced AI and computer vision as a possible
              substitute, but labels its own research AI-generated and unverified. The evidence therefore supports a
              substitution and execution risk to diligence, not a conclusion that smartphones already match OrCam's
              performance. (CP001, CP003, CP006, CP011)
            claimRefs:
              - CP003
              - CP006
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
              - CP013
      - number: '3.4'
        title: Price, current status, and defensibility remain unverified
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence pool contains no comparable list or realized prices for OrCam devices and the named
              peers, and it does not show contracts, reimbursement, service terms, or renewal economics. Nor do the
              reviewed pages quantify switching friction, multi-homing, customer acquisition channels, partner access,
              or current market shares. These absences limit both a buyer-value comparison and any moat assessment. The
              2025 product-pivot report and the undated current-facing product page should be reconciled directly with
              the company before treating either vision devices or hearing aids as the current commercial focus. A
              positioning map below codes only source-described product specialization and task overlap on ordinal
              scales; it is not a performance, pricing, market-share, or independent benchmark. (CP001, CP003, CP014,
              CP015)
            claimRefs:
              - CP001
              - CP003
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Confirm whether vision devices remain a live commercial line
            body: >-
              CTech's 2025 report of discontinued vision products conflicts with OrCam's undated product marketing.
              Confirm active SKUs, inventory, support obligations, and current sales before underwriting a vision
              product moat or comparing current scale.
            calloutType: risk
            claimRefs:
              - CP001
              - CP003
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue mechanism and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              OrCam's public product surface is centered on wearable and handheld assistive devices, and a
              private-company data provider characterizes its business model as product sales. That supports a
              hardware-led revenue hypothesis, not a recurring-revenue or subscription conclusion (CI001). OrCam's iOS
              companion app is listed as free and offers device controls; this does not establish that the hardware is
              free or that the company earns recurring app revenue (CI002). The reviewed official product page does not
              state current list prices, realized prices, discounting, or channel economics (CI013). Therefore neither
              product-level revenue mix nor gross profit per device can be reconstructed from the public material
              retained here.
            claimRefs:
              - CI001
              - CI002
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI013
      - number: '4.2'
        title: Public traction is historical and inconsistent
        blocks:
          - type: paragraph
            body: >-
              Multiples.vc records $10 million as OrCam's latest revenue in April 2017 and cautions that such deal-time
              values may represent run-rate or last-twelve-month revenue; it is not a current ARR figure (CI003).
              Calcalist reported that annual sales peaked at $50 million and that the nearly market-ready Hear product
              had yet to generate revenue, as of its March 2025 report (CI004). A July 2024 Calcalist article separately
              described a revenue rate approaching $100 million and profitability around an earlier IPO plan; it does
              not define the measure or make it directly comparable to the reported annual-sales peak (CI014). An
              AI-generated profile says specific revenue figures are not publicly disclosed but cautions that its
              analysis is not independently verified (CI011); that statement is not proof that current revenue does not
              exist. Current audited revenue, ARR, growth, product mix, and recognition policy remain unverified. The
              third-party funding summaries also report materially different historical totals, so neither is a
              reconciled capital ledger (CI005, CI006).
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI011
              - CI014
      - number: '4.3'
        title: Capital need is visible; liquidity is not
        blocks:
          - type: paragraph
            body: >-
              Calcalist reported in March 2025 that founders sought to convert roughly $9 million invested through a
              SAFE at a $30–40 million valuation, while institutional investors opposed the conversion mechanism
              (CI007). The same report said the founders requested a further $2 million loan while planning additional
              workforce reductions (CI008). These are reported financing needs and disputed terms, not evidence that
              funds closed or remain available. The reviewed sources do not disclose cash on hand, monthly cash burn,
              debt obligations, runway, working capital, capex, COGS, gross margin, customer acquisition cost, or
              payback (CI012, CI013). A third-party employee estimate dated August 2026 is not a verified payroll and is
              not a substitute for burn data (CI009).
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The operating reset materially weakens confidence in extrapolating historical vision-device sales:
              Calcalist reported that OrCam closed vision-device development and shifted focus toward Hear after
              smartphone image-processing advances pressured its low-vision business (CI010). Reported historical
              revenue also uses different labels: the March 2025 article cites a $50 million annual-sales peak, while
              the July 2024 article describes a revenue rate approaching $100 million around an earlier IPO plan (CI004,
              CI014). Later investor and loan reporting reinforces capital-adequacy risk, but does not quantify solvency
              or establish a financing close (CI007, CI008, CI012). The revenue-model figure therefore shows the
              evidence path and the missing conversion inputs, rather than implying a measured funnel or forecast.
              Underwriting should remain conditional on current audited financials, product-level sales and margins,
              cash/debt schedules, and signed financing terms; none is supplied by the assigned public sources.
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI010
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
