  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Product transition and operating execution
        blocks:
          - type: paragraph
            body: >-
              The most visible operating risk is a strategic pivot under pressure rather than a verified current outage
              or safety event. Calcalist reported in July 2024 that OrCam was closing development of its reading
              glasses, cutting staff, and shifting focus to Hear after smartphone-based generative-AI capabilities
              weakened the case for further Low Vision development (CR003, CR004). Its March 2025 report said the
              hearing product was nearly ready for market but had not generated revenue at publication (CR009). That is
              a dated revenue gap, not proof of present-day failure or current revenue.

              The evidence does not establish whether Hear launched, has customers, or has secured manufacturing and
              distribution capacity since that reporting. Calcalist's March 2025 description of a company reduced to a
              few dozen employees also differs from later workforce figures on Tracxn and Startup Nation Central; the
              snapshots do not establish a reliable current staffing trajectory (CR010). OrCam's fetched U.S. storefront
              still promotes vision products, but undated marketing does not establish orderability, warranty coverage,
              repairs, or ongoing development (CR011). Until those points are documented, legacy-user continuity and the
              Hear launch remain material execution exposures.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR010
              - CR012
              - CR013
      - number: '7.2'
        title: Financing, governance, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Calcalist reported in March 2025 that institutional investors objected to the conversion mechanism for a
              SAFE financing round and that the founders sought conversion at a $30–40 million valuation, sharply below
              the several-hundred-million-dollar valuations at which the same investors had previously invested (CR005,
              CR006). The article also reported that the founders had injected around $9 million and requested a further
              $2 million loan while planning additional workforce reductions (CR006, CR007). These are reported
              financing terms and a requested loan—not evidence that the loan closed, that funds remain available, or
              that any valuation is current.

              Calcalist described historical peak annual sales of $50 million and said Hear had not yet generated
              revenue as of its March 2025 report (CR008, CR009). Neither figure is current ARR, audited revenue, cash
              burn, or runway. The reporting therefore supports a financing-and-commercialization diligence gate, not a
              precise solvency conclusion: require current company-approved cash and debt schedules, executed SAFE and
              loan documents, and evidence of shipped Hear units and collected revenue before treating the pivot as
              funded or commercially validated (CR001).
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR015
      - number: '7.3'
        title: Legal, regulatory, privacy, and customer exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not include court records, regulator notices, product registrations, privacy
              terms, or independent safety assessments. They therefore do not establish whether OrCam faces current
              litigation, has all approvals required in its markets, or has experienced a security or safety incident;
              the lack of those records here is not evidence that none exists (CR014). Startup Nation Central describes
              MyEye as recognizing faces and identifying products, which makes the applicable privacy, consent,
              retention, and data-processing controls a concrete diligence question, not a finding of non-compliance
              (CR013).

              An adverse GoodIndex advocacy profile characterizes the 2024 cessation of reading-glasses development as
              abandonment of a core accessibility product, but the fetched page provides no user-level evidence
              establishing harm or the availability of alternatives (CR002). Calcalist independently reports the
              product-development closure and staffing cuts (CR003). The investor decision should remain conditional on
              primary documentation: counsel-reviewed financing and regulatory records, privacy documentation, and a
              written plan for existing-device support and customer communication. Supplier, manufacturing, and
              distribution counterparties for Hear are likewise not identified in the assigned evidence (CR015).
            claimRefs:
              - CR002
              - CR003
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Gate capital on verifiable milestones
            body: >-
              Do not infer solvency or a successful pivot from historical sales, a requested loan, or undated product
              marketing. Require current financing documents, cash and debt schedules, Hear launch and revenue evidence,
              and a documented support plan for legacy users before underwriting recovery.
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR009
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public price marks do not establish current value
        blocks:
          - type: paragraph
            body: >-
              The available valuation markers are historical and inconsistent in date and meaning. Tracxn records a $1
              billion post-money mark for February 2018, while SetterVC lists a $1.5 billion mark for March 2021;
              neither is a current transaction or a realizable exit value (CV001). More recent operating evidence is
              more decision-relevant: Calcalist reported annual sales near $50 million at peak and about $16 million in
              2024, while SetterVC summarizes 2023 sales at $45–50 million (CV004). These are reported sales, not
              audited revenue or ARR, and the 2024 number is not a 2026 run rate. Startup Nation Finder and SetterVC
              also publish different cumulative-funding totals and round counts (CV008), underscoring that database
              totals are not a substitute for a reconciled capitalization history. The current official product pages
              still list vision-assistance devices (CV006), but listings and company-reported user reach do not
              establish current sell-through, gross margin, retention, or cash generation (CV007). No current equity
              price can be inferred from the old marks or marketing evidence.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Financing uncertainty dominates entry risk
        blocks:
          - type: paragraph
            body: >-
              Calcalist reported that the founders put about $9 million into a SAFE round around eight months before its
              March 2025 article and sought conversion at a $30–40 million valuation; institutional investors opposed
              the conversion mechanism, and the company disputed their position (CV002). The article also reported a
              requested additional $2 million loan and further workforce reductions while OrCam worked on a hearing
              product that had not yet generated revenue (CV003, CV005). These are dated reported positions, not proof
              that the SAFE converted, that the loan closed, or that the same terms remain outstanding in October 2026.
              The assigned sources do not disclose a current cap table, preference stack, debt schedule, or final SAFE
              conversion outcome (CV012). The value transfer between founders and earlier investors could therefore
              differ materially from headline enterprise value. Before underwriting any security, obtain executed
              financing documents, fully diluted ownership, senior claims, cash and debt balances, and a current
              board-approved operating plan; otherwise a nominal share price cannot be translated into common-equity
              proceeds.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: Scenarios are conditional, not numeric forecasts
        blocks:
          - type: paragraph
            body: >-
              A bull case requires evidence that the hearing product is launched, gains paying customers, and produces
              positive contribution after commercialization costs; the assigned March 2025 reporting said it had not yet
              generated revenue (CV005). The base case is continued uncertainty: legacy product listings remain visible,
              but current audited financials and unit economics are unavailable (CV006, CV012). The bear case is a
              failed pivot alongside unresolved dilution or financing claims, which could impair common holders even if
              the products retain user value (CV002, CV013). None can responsibly be assigned a company valuation range
              or probability from these sources. The comparison screen also fails to supply a usable multiple:
              Mobileye's cited market capitalization is for an autonomous-driving business, and Sonova's fetched
              official page describes a large, vertically integrated hearing-care operator but provides no
              OrCam-specific valuation basis (CV009, CV010). Neither is treated as an independent OrCam benchmark.
              Sight-device company claims and competitor descriptions are similarly not substitutes for like-for-like
              financials. The scenario table therefore leaves ranges unestimated pending primary financial and
              transaction evidence.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Research more before setting an entry price
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more, low confidence, and high risk, with no defensible public entry price
              today (CV013). The product proposition is credible as a company-described accessibility use case, and the
              company continues to display products, but public usage claims are not independently verified commercial
              traction (CV006, CV007). Conversely, the reported sales contraction, disputed financing mechanics, and
              missing current financial statements make a valuation based on the old billion-dollar marks especially
              unreliable (CV001, CV002, CV004, CV012). Ethical and reputational scrutiny is also a possible diligence
              topic: an advocacy profile explicitly frames tension between the company's assistive-technology purpose
              and its political context, but provides no evidence that this has caused lost customers, procurement
              restrictions, or reduced value (CV011). A price-sensitive decision should wait for audited recent revenue
              and margins, current cash and obligations, confirmed SAFE and preference terms, and proof of
              hearing-product commercialization. Revisit only if those materials support an equity-level return case
              after senior claims, rather than relying on a financing headline or mission value.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not price from legacy marks
            body: >-
              The 2018 and 2021 valuation marks and the reported SAFE conversion proposal describe different dates and
              instruments; none establishes an October 2026 entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
