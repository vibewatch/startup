  - id: FP001
    title: Qualitative map of product specialization and task overlap
    type: quadrant
    summary: >-
      Dedicated-device descriptions cluster separately from the broader orientation-and-mobility status quo; coordinates
      are ordinal judgments, not measured performance.
    data:
      xAxis:
        label: Specialization described in retained evidence (ordinal)
        min: 1
        max: 5
        low: General-purpose or no specialist product detail
        high: Purpose-built vision-assistance device
        description: Analyst coding of source descriptions, not product performance.
        scale: ordinal
      yAxis:
        label: Evidence of overlap with reading/visual-access tasks (ordinal)
        min: 1
        max: 5
        low: Mobility-only or no task-overlap detail
        high: Reading or visual-recognition functions explicitly described
        description: Source-described task overlap, not comparative test results.
        scale: ordinal
      points:
        - label: OrCam
          x: 5
          'y': 5
          note: >-
            Company-issued materials describe reading and recognition use cases; these are product claims, not
            independent performance results.
          claimRefs:
            - CP001
            - CP002
        - label: eSight Go
          x: 5
          'y': 3
          note: >-
            TBRC describes a wearable low-vision device; the retained report does not establish matched text-reading
            performance.
          claimRefs:
            - CP010
        - label: Deep Optics
          x: 4
          'y': 2
          note: Tracxn describes adaptive glasses for vision correction; reading or recognition overlap is not established.
          claimRefs:
            - CP008
        - label: Ocutech
          x: 4
          'y': 2
          note: Tracxn describes bioptic low-vision aids; no like-for-like reading performance is reported.
          claimRefs:
            - CP008
        - label: Freedom Scientific
          x: 3
          'y': 2
          note: Sources identify an assistive-technology provider but do not document product-level features.
          claimRefs:
            - CP007
            - CP009
        - label: Orientation and mobility instruction
          x: 1
          'y': 1
          note: >-
            APH describes nonvisual mobility instruction, which addresses navigation rather than text reading or object
            recognition.
          claimRefs:
            - CP012
    approximationNotes: >-
      Ordinal analyst coding from the source-described product categories: 1=low and 5=high. The x-axis reflects
      dedicated vision-assistance-device specialization; the y-axis reflects described overlap with reading or vision
      tasks. Source detail is uneven, so ties and positions are directional. This is not a performance test, price
      comparison, market-share estimate, or independent competitor benchmark.
