  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Products and maturity
        blocks:
          - type: paragraph
            body: >-
              OrCam's documented vision products address reading and access to visual information. Company materials
              describe MyEye as a small camera mounted to eyeglasses that reads printed or digital text aloud, while its
              handheld Read device targets longer reading tasks; a 2023 product article also described Read 3 features
              including OCR, navigation within text, and online-only English summarization (CE001, CE002, CE003). A
              Startup Nation Central profile also describes Learn as an interactive reading solution for students, but
              does not establish its current availability (CE015). These descriptions establish intended functions, not
              current inventory or audited performance. A separate company-published user story recounts one student's
              reported reading experience, but it is a testimonial rather than an independently measured outcome
              (CE009). Maturity is a material caveat: in March 2025, Calcalist reported OrCam was liquidating remaining
              vision-device inventory, discontinuing vision products, and focusing on hearing aids; it also reported
              Hear was nearly ready but had not generated revenue at that time (CE008). Current product availability
              remains unverified.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE008
              - CE009
              - CE015
      - number: '5.2'
        title: Workflow value and limits
        blocks:
          - type: paragraph
            body: >-
              The user workflow is direct: select or point at text, let the device interpret it, then receive spoken
              output. MyEye is positioned for reading in place, including on printed surfaces and screens, whereas Read
              is handheld and can read a page or screen. Company materials describe offline use for both devices and say
              one featured MyEye user's text is not stored; those statements are not independently validated (CE001,
              CE002, CE010). For group conversations, Hear pairs a phone attachment and app with earbuds so a listener
              can select voices; Engadget and Forbes reporters described CES demonstrations of that workflow (CE005).
              Engadget also reported a slight audio delay and some distortion during its demo, so the evidence supports
              a promising demonstration rather than production-grade reliability or clinical benefit (CE006). The
              sources provide user jobs and qualitative experiences, but no independently verified current outcomes,
              adoption denominators, or comparative performance measures.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE009
              - CE010
      - number: '5.3'
        title: Operating model, differentiation, and diligence
        blocks:
          - type: paragraph
            body: >-
              The available descriptions support a functional workflow map, not a verified internal software or hardware
              architecture. Public materials identify camera-based capture, pointing or gaze activation, OCR and
              text-to-speech for vision products, and a phone-connected dongle, speaker profiles, app selection, and
              earbuds for Hear (CE001, CE003, CE004, CE005). Engadget's demonstration also showed a newly recognized
              speaker appearing as an anonymous profile that could be selected in the app (CE014). Company materials
              describe offline operation for MyEye and Read, and say one featured MyEye user's text is not stored; no
              current independent security assessment, certification record, integration specification, service-level
              data, or reliability testing appears in this assigned evidence set (CE010, CE012). Hear's maturity signal
              is mixed and dated: CES reporters tested a demonstration in January 2024, while a March 2025 article
              described it as nearly ready for market but without revenue (CE006, CE007, CE008). The technological
              differentiation is therefore plausible at the product-workflow level, but defensibility, production
              readiness, and support obligations remain diligence gaps.
