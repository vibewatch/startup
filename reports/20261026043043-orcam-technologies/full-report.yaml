  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Users are more visible than buyers or payers
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies blind and visually impaired people, readers with learning difficulties,
              and students as intended users, but it does not segment customers by account, revenue, or purchasing
              authority. The few named accounts are individuals describing personal use; the 2019 polling-station
              example is a public access deployment, not evidence of recurring procurement. A CFHU article quotes an
              OrCam spokesperson on specialist distributors, clinics and hospitals, opticians, direct sales, and efforts
              to obtain public or insurance reimbursement. Those are company-described routes, not measured channel mix
              or proof of who ultimately paid. A separately quoted MyEye price is undated in the assigned source
              material, so it cannot establish current affordability or reimbursement.
            claimRefs:
              - CU001
              - CU002
              - CU012
              - CU015
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
              - CU011
              - CU012
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption figures are not a comparable time series
        blocks:
          - type: paragraph
            body: >-
              The public figures are three unlike claims: VisionPlus reported more than 400,000 people worldwide in a
              December 2023 article, CFHU quoted a company representative describing tens of thousands of users across
              50 countries, and OrCam's U.S. site says its devices are used by thousands. The latter two have no
              publication date in the retained material, and none defines active versus cumulative users or supplies a
              measurement method. Calcalist separately reported peak annual sales of $50 million without naming the peak
              year; this is sales, not ARR or a customer count. Apple's 3.5/5 score from two app ratings is a tiny
              sample about the companion app, not a proxy for device adoption. These indicators should remain separate.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
      - number: '6.3'
        title: Named stories show use, not audited outcomes
        blocks:
          - type: paragraph
            body: >-
              The strongest named-use evidence is a set of personal accounts: CFHU recounts Dorothy Boyd using MyEye to
              read screens and printed material and Holly Bonner reading a restaurant menu, while VisionPlus recounts
              student Domingos using the device to access books. The same CFHU article reports availability at 12
              polling stations in Israel's April 2019 election. These examples make the use cases concrete, but the
              assigned sources do not provide independently audited outcomes, purchase dates, device activation records,
              or evidence that the cases represent a current production cohort. Product pages help establish context for
              the described functions; they do not independently verify the named individuals or their reported
              outcomes.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU001
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
