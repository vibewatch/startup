              - CU004
              - CU005
              - CU001
              - CU014
      - number: '6.4'
        title: Retention and customer concentration remain unverified
        blocks:
          - type: paragraph
            body: >-
              No retained source reports NRR, GRR, churn, renewal rates, contract length, repeat-purchase behavior,
              active deployments, or customer revenue concentration. The gap matters because personal testimonials and
              one election deployment cannot establish durable paid usage. Calcalist reported in March 2025 that OrCam
              had discontinued its vision-related products and was focusing on hearing aids, while the hearing product
              had yet to generate revenue at that time. That reporting changes the interpretation of legacy MyEye
              customer evidence but does not identify current hearing customers. The journey figure is therefore an
              evidence map of described touchpoints and missing proof, not a measured conversion funnel or a claim that
              every user follows the same route.
            claimRefs:
              - CU010
