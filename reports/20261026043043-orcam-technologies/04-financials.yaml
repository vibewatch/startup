company:
  name: OrCam Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    OrCam's public evidence points to a device-led business with a historical
    revenue record and material restructuring, but no current revenue, margin,
    cash, or runway data adequate for underwriting. Recent reporting describes
    a contested financing mechanism and a requested founder loan; neither
    funding raised nor a requested loan establishes cash available.
sections:
  - id: revenue-mechanism
    title: Revenue mechanism and pricing visibility
    body: >-
      OrCam's public product surface is centered on wearable and handheld
      assistive devices, and a private-company data provider characterizes its
      business model as product sales. That supports a hardware-led revenue
      hypothesis, not a recurring-revenue or subscription conclusion (CI001).
      OrCam's iOS companion app is listed as free and offers device controls;
      this does not establish that the hardware is free or that the company
      earns recurring app revenue (CI002). The reviewed official product page
      does not state current list prices, realized prices, discounting, or
      channel economics (CI013). Therefore neither product-level revenue mix
      nor gross profit per device can be reconstructed from the public material
      retained here.
    claimRefs: [CI001, CI002, CI013]
    tableRefs: [TI001, TI002]
  - id: traction-and-metric-quality
    title: Public traction is historical and inconsistent
    body: >-
      Multiples.vc records $10 million as OrCam's latest revenue in April 2017
      and cautions that such deal-time values may represent run-rate or
      last-twelve-month revenue; it is not a current ARR figure (CI003).
      Calcalist reported that annual sales peaked at $50 million and that the
      nearly market-ready Hear product had yet to generate revenue, as of its
      March 2025 report (CI004). A July 2024 Calcalist article separately
      described a revenue rate approaching $100 million and profitability
      around an earlier IPO plan; it does not define the measure or make it
      directly comparable to the reported annual-sales peak (CI014). An
      AI-generated profile says specific revenue figures are not publicly
      disclosed but cautions that its analysis is not independently verified
      (CI011); that statement is not proof that current revenue does not exist.
      Current audited revenue, ARR, growth, product mix, and recognition policy
      remain unverified. The third-party funding summaries also report
      materially different historical totals, so neither is a reconciled
      capital ledger (CI005, CI006).
    claimRefs: [CI003, CI004, CI005, CI006, CI011, CI014]
  - id: costs-capital-and-runway
    title: Capital need is visible; liquidity is not
    body: >-
      Calcalist reported in March 2025 that founders sought to convert roughly
      $9 million invested through a SAFE at a $30–40 million valuation, while
      institutional investors opposed the conversion mechanism (CI007). The
      same report said the founders requested a further $2 million loan while
      planning additional workforce reductions (CI008). These are reported
      financing needs and disputed terms, not evidence that funds closed or
      remain available. The reviewed sources do not disclose cash on hand,
      monthly cash burn, debt obligations, runway, working capital, capex,
      COGS, gross margin, customer acquisition cost, or payback (CI012,
      CI013). A third-party employee estimate dated August 2026 is not a
      verified payroll and is not a substitute for burn data (CI009).
    claimRefs: [CI007, CI008, CI009, CI012, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      The operating reset materially weakens confidence in extrapolating
      historical vision-device sales: Calcalist reported that OrCam closed
      vision-device development and shifted focus toward Hear after smartphone
      image-processing advances pressured its low-vision business (CI010).
      Reported historical revenue also uses different labels: the March 2025
      article cites a $50 million annual-sales peak, while the July 2024
      article describes a revenue rate approaching $100 million around an
      earlier IPO plan (CI004, CI014). Later investor and loan reporting
      reinforces capital-adequacy risk, but does not quantify solvency or
      establish a financing close (CI007, CI008, CI012). The revenue-model figure therefore shows the evidence
      path and the missing conversion inputs, rather than implying a measured
      funnel or forecast. Underwriting should remain conditional on current
      audited financials, product-level sales and margins, cash/debt schedules,
      and signed financing terms; none is supplied by the assigned public
      sources.
    claimRefs: [CI004, CI007, CI008, CI010, CI012, CI013, CI014]
    figureRefs: [FI001]
