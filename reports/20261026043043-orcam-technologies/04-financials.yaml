        - "$10M latest recorded revenue in Multiples.vc."
        - "April 2017; source says it may be deal-time run-rate or LTM."
        - "Historical, third-party estimate; not current ARR."
      - - "Peak annual sales"
        - "$50M peak annual sales reported by Calcalist."
        - "Reported March 2025; peak year and accounting basis not stated."
        - "Third-party reported; do not treat as current run-rate."
      - - "Revenue rate before IPO"
        - "Calcalist described a revenue rate approaching $100 million and profitability."
        - "Reported July 2024 about an earlier IPO plan; exact period and metric definition not stated."
        - "Historical revenue-rate description, not current revenue or ARR; do not compare directly with annual sales."
      - - "Gross margin, COGS, and service cost"
        - "No numerical values disclosed in the reviewed assigned sources."
        - "Current private evidence gap."
        - "Unavailable; request audited product-level gross-profit bridge."
      - - "Cash, burn, and runway"
        - "No cash balance, burn rate, or runway disclosed; founders reportedly sought a $2M loan."
        - "Loan request reported March 2025; completion not established."
        - "Material capital-adequacy gap; a request is not cash available."
      - - "Financing and historical capital"
        - "Finder reports $131.4M across 7 rounds; Tracxn reports $86.4M across 4 rounds."
        - "Historical database totals with differing coverage or methodology."
        - "Unreconciled totals; raised capital is not current liquidity."
    notes: >-
      Metrics retain each source's stated label and period. Historical revenue
      and capital totals are not current ARR, cash, or burn; no gross margin or
      runway estimate is inferred.
    claimRefs: [CI003, CI004, CI005, CI006, CI008, CI012, CI013, CI014]
