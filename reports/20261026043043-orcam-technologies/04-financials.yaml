      - - "Realized price"
        - "No contract, invoice, discount, or refund data is in the assigned sources."
        - "ASP, discounts, warranty credits, and reimbursement are unknown."
        - "Request trailing 24-month unit and net-price data."
      - - "Companion app"
        - "Listed as free in Apple's US App Store."
        - "The listing is for the app, not the wearable or handheld device."
        - "Confirm whether any paid digital services or device-linked fees exist."
      - - "Channel economics"
        - "The reviewed sources do not quantify direct, distributor, retailer, or institutional sales."
        - "Channel mix, commissions, sales cycle, CAC, and payback are unknown."
        - "Request sales by channel, customer type, and net contribution."
    notes: >-
      The free-app listing is not a hardware price; absence of prices in this
      limited public-source set is an evidence gap, not proof that no prices
      exist.
    claimRefs: [CI001, CI002, CI013]
  - id: TI003
    title: Unit economics, traction, and capital adequacy
    columns:
      - Metric or input
