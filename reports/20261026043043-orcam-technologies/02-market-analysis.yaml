figures:
  - id: FM001
    title: Evidence layers from need to company-specific opportunity
    type: pyramid
    summary: >-
      A qualitative sequence narrows from population need to device category
      and company-specific evidence gaps; it is not a numeric market funnel.
    data:
      items:
        - label: "Vision-impairment population"
          value: "At least 2.2 billion people"
          detail: "WHO burden context; people with impairment are not equivalent to device buyers."
        - label: "Preventable or unaddressed cases"
          value: "At least 1 billion cases"
          detail: "WHO measure of unmet or preventable need, not an assistive-device eligible count."
        - label: "Assistive-device category"
          value: "$1.23B (2025); $1.89B forecast (2030)"
          detail: "TBRC's global low-vision assistive-device revenue estimate; 9.0% CAGR forecast for 2026–2030, not OrCam-specific."
        - label: "OrCam-specific eligible market"
          value: "Not quantified"
          detail: "Assigned evidence does not isolate product-fit users, eligible geographies, or payer coverage."
        - label: "OrCam SAM"
          value: "Not established"
          detail: "No supported product-level price, buyer, reimbursement, or addressable-sales calculation."
        - label: "OrCam SOM"
          value: "Not established"
          detail: "No current company-specific eligible revenue, customer penetration, or conversion evidence."
    approximationNotes: >-
      Conceptual ordering only: layer widths do not represent population size,
      market value, conversion, or a shared unit. Population counts and
      category revenue are not numerically comparable.
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM007
      - CM008
      - CM009
