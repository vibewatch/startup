company:
  name: OrCam Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    OrCam sits within a broad, clinically defined vision-impairment burden but
    a much narrower assistive-device category; public evidence does not isolate
    a product-specific SAM or SOM. A 2026 market-research estimate sizes global
    low-vision assistive devices at $1.23 billion in 2025, while buyer budgets,
    current OrCam sales, and the commercial effect of smartphone-based
    substitutes remain unverified.
sections:
  - id: market-boundary
    title: Define the market before sizing it
    body: >-
      The underlying need is not itself OrCam's addressable market. WHO reports
      at least 2.2 billion people with near or distance vision impairment, and
      says at least 1 billion cases could have been prevented or remain
      unaddressed; these are condition and access measures, not counts of
      prospective device purchasers (CM001, CM002). A defensible boundary
      therefore separates eye-care prevention and correction, the residual
      functional needs that may call for assistive tools, and sales of low-
      vision devices. TBRC's device category includes optical and electronic
      products, reading tools, screen readers, braille displays, and wearable
      systems, well beyond any single OrCam product (CM007, CM013). Population
      prevalence cannot be multiplied into TAM without evidence for unmet
      device-specific need, willingness to pay, payer, and eligible geography.
    claimRefs:
      - CM001
      - CM002
      - CM007
      - CM013
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Public estimates bound a category, not OrCam's SAM
    body: >-
      The closest accessible revenue lens is TBRC's global low-vision
      assistive-devices category: it reports $1.23 billion for 2025, $1.34
      billion for 2026, and a forecast of $1.89 billion in 2030, with 8.9%
      historical and 9.0% forecast CAGR figures for their stated periods
      (CM008). Its market value uses manufacturer/creator factory-gate sales
      of goods and services, excludes downstream resales, and spans multiple
      product classes rather than OrCam alone (CM009, CM013). WHO's global
      impairment counts and the NEI/CDC U.S. surveillance context describe
      population need and measurement, not payer-qualified device demand
      (CM001, CM002, CM003). TechList reports about 50.5K monthly visits to
      orcam.com, which is web traffic rather than purchasers, revenue, or
      conversion (CM018). The available evidence cannot isolate OrCam's
      current product-fit users, payer coverage, price, or sales, so a
      company-specific SAM or SOM remains unquantified (CM016).
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM008
      - CM009
      - CM013
      - CM016
      - CM018
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-adoption
    title: Users are segmented; payment paths are not
    body: >-
      The market taxonomy distinguishes magnifiers, reading devices, wearables,
      screen readers, and other products; it also groups use into education,
      healthcare, and personal use, with children, adults, and older people as
      end-user categories (CM013). OrCam's own page targets people who are
      blind, visually impaired, or have reading challenges (CM005); an
      Abilities Expo case page says the Northern Ireland Policing Board
      decided to provide funding for one board member's OrCam MyEye (CM010).
      That is a specific institutional-use example, not evidence of completed
      payment, routine coverage, or broad procurement. The market report lists online, specialty, and optical
      channels but does not identify who controls each budget or typical
      device prices (CM013, CM016). WHO reports that one in two people
      globally who need cataract surgery cannot access it, while CDC notes
      affordable eyeglasses and eye care may prevent unnecessary vision loss;
      these are care-access constraints, not device conversion rates (CM006).
      NEI and CDC also stress that population surveillance estimates depend
      on collection and participation, so prevalence is a starting point for
      segmentation rather than a sales forecast (CM003). Product-specific
      buyers, payers, channel prices, and sales remain diligence priorities.
    claimRefs:
      - CM003
      - CM004
      - CM006
      - CM005
      - CM010
      - CM013
      - CM016
    tableRefs:
      - TM003
  - id: growth-and-constraints
    title: Need growth competes with substitution and product focus
    body: >-
      WHO identifies population aging and growth as factors increasing vision-
      impairment risk, while affordability, eye-care availability, and
      awareness vary by geography (CM004, CM006). Those forces can enlarge
      unmet need without guaranteeing demand for a premium wearable. In July
      2024, Globes reported OrCam would halt development of visual-aid devices
      and focus on hearing products; the company attributed the shift to
      advances in image processing by language models (CM014). Separately,
      Globes reported that OpenAI was developing similar technology for use
      from mobile phones, a potential substitute rather than proof of adoption
      or equivalent performance (CM015). In March 2025, CTech reported that
      Hear was nearing market readiness but had not generated revenue at that
      time (CM017). TechList's estimate of monthly visits to orcam.com is a
      website-interest proxy only; it does not establish device demand or
      purchasing conversion (CM018). Current product availability, sell-
      through, and payer economics remain essential gaps.
    claimRefs:
      - CM004
      - CM006
      - CM014
      - CM017
      - CM015
      - CM018
