company:
  name: OrCam Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    OrCam's public materials describe wearable and handheld vision-assistance devices, while independent CES demonstrations documented a separate voice-isolation product. The strongest product evidence is historical: a 2025 report said OrCam was discontinuing vision products and had not yet generated revenue from Hear, leaving current availability, reliability, and technical controls unverified.
sections:
  - id: product-portfolio
    title: Products and maturity
    body: >-
      OrCam's documented vision products address reading and access to visual information. Company materials describe MyEye as a small camera mounted to eyeglasses that reads printed or digital text aloud, while its handheld Read device targets longer reading tasks; a 2023 product article also described Read 3 features including OCR, navigation within text, and online-only English summarization (CE001, CE002, CE003). A Startup Nation Central profile also describes Learn as an interactive reading solution for students, but does not establish its current availability (CE015). These descriptions establish intended functions, not current inventory or audited performance. A separate company-published user story recounts one student's reported reading experience, but it is a testimonial rather than an independently measured outcome (CE009). Maturity is a material caveat: in March 2025, Calcalist reported OrCam was liquidating remaining vision-device inventory, discontinuing vision products, and focusing on hearing aids; it also reported Hear was nearly ready but had not generated revenue at that time (CE008). Current product availability remains unverified.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE008
      - CE009
      - CE015
    tableRefs:
      - TE001
  - id: user-workflows
    title: Workflow value and limits
    body: >-
      The user workflow is direct: select or point at text, let the device interpret it, then receive spoken output. MyEye is positioned for reading in place, including on printed surfaces and screens, whereas Read is handheld and can read a page or screen. Company materials describe offline use for both devices and say one featured MyEye user's text is not stored; those statements are not independently validated (CE001, CE002, CE010). For group conversations, Hear pairs a phone attachment and app with earbuds so a listener can select voices; Engadget and Forbes reporters described CES demonstrations of that workflow (CE005). Engadget also reported a slight audio delay and some distortion during its demo, so the evidence supports a promising demonstration rather than production-grade reliability or clinical benefit (CE006). The sources provide user jobs and qualitative experiences, but no independently verified current outcomes, adoption denominators, or comparative performance measures.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE009
      - CE010
    tableRefs:
      - TE002
  - id: operating-architecture
    title: Operating model, differentiation, and diligence
    body: >-
      The available descriptions support a functional workflow map, not a verified internal software or hardware architecture. Public materials identify camera-based capture, pointing or gaze activation, OCR and text-to-speech for vision products, and a phone-connected dongle, speaker profiles, app selection, and earbuds for Hear (CE001, CE003, CE004, CE005). Engadget's demonstration also showed a newly recognized speaker appearing as an anonymous profile that could be selected in the app (CE014). Company materials describe offline operation for MyEye and Read, and say one featured MyEye user's text is not stored; no current independent security assessment, certification record, integration specification, service-level data, or reliability testing appears in this assigned evidence set (CE010, CE012). Hear's maturity signal is mixed and dated: CES reporters tested a demonstration in January 2024, while a March 2025 article described it as nearly ready for market but without revenue (CE006, CE007, CE008). The technological differentiation is therefore plausible at the product-workflow level, but defensibility, production readiness, and support obligations remain diligence gaps.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE012
      - CE014
    tableRefs:
      - TE003
    figureRefs:
      - FE001
tables:
  - id: TE001
    title: Product module and maturity matrix
    columns:
      - Product or module
      - User and job
      - Documented function and status
      - Differentiation
      - Diligence gap
    rows:
      - - OrCam MyEye
        - Blind or low-vision user; access printed and digital text
        - Company materials describe an eyeglass-mounted camera that reads text aloud and recognizes faces and products; current availability is not verified.
        - Wearable, hands-free activation is described in company materials.
        - Verify current product support, model availability, accuracy, and privacy controls.
      - - OrCam Read
        - Reader with dyslexia, reading fatigue, or mild-to-moderate vision loss
        - Company materials describe a handheld full-page/screen reader; the same source says it operates offline.
        - Handheld reading workflow with spoken output.
        - Confirm current sales status, supported formats, language coverage, and measured reading outcomes.
      - - OrCam Read 3
        - Reader seeking text capture, navigation, or spoken summarization
        - 2023 article describes OCR, word/section navigation, and English summarization requiring Wi-Fi.
        - Adds connected summarization to the described reading workflow.
        - Verify whether this model and the stated feature set remain available and supported.
      - - OrCam Learn
        - Students with reading and learning differences
        - Startup Nation Central's profile describes an interactive reading solution and lists the product stage as released.
        - Reading fluency, accuracy, and comprehension support are described.
        - Confirm current availability, supported devices, and measured learning outcomes.
      - - OrCam Hear
        - Person with hearing loss seeking a selected voice in group conversation
        - CES 2024 reporters demonstrated phone-connected voice selection; a 2025 report said it was nearly ready but had no revenue then.
        - App-selected voice isolation across a phone attachment and earbuds.
        - Establish current launch status, production performance, supported phones, and support model.
    notes: >-
      Product status is time-qualified: Read 3 details are from a 2023 article, Hear demonstration evidence is from CES 2024, and the reported vision-product discontinuation and Hear revenue status are from March 2025. Qualitative benefits are not independently measured.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE008
      - CE009
      - CE015
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow
      - OrCam solution described
      - Reported benefit or observation
      - Limitation or missing evidence
    rows:
      - - Read a printed page or screen
        - A reader needs assistance to access text visually.
        - MyEye or Read captures text and speaks it aloud.
        - Company materials describe real-time or full-page reading; a customer story reports one student's use.
        - No independent outcome study or current accuracy measure is in this evidence set.
      - - Navigate a document or locate text
        - A reader must find a particular word or passage.
        - Read 3's described Smart Reading feature locates words or sections; summarization requires Wi-Fi and English text.
        - The feature description is specific to the 2023 product article.
        - Current model availability and feature persistence are unverified.
      - - Follow a selected speaker in a group
        - Listener faces competing voices in a noisy setting.
        - Hear uses a phone attachment, app, and earbuds to select a voice.
        - Engadget and Forbes reporters described voice-isolation demonstrations at CES 2024.
        - Engadget noted delay and distortion; no production reliability data was supplied.
      - - Read confidential or personal material
        - User reads a document without a separate screen-based workflow.
        - Company materials say MyEye works offline and does not store a featured user's text; Read is described as offline.
        - This is a company statement about design intent.
        - No independent security audit, retention test, or current data-flow documentation is supplied.
    notes: >-
      Evidence combines company descriptions, a company-published testimonial, and dated reporter demonstrations; it does not establish population-level outcomes or current product access.
    claimRefs:
