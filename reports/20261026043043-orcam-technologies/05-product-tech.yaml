      - Documented role
      - Dependency
      - Risk or uncertainty
    rows:
      - - Optical capture and user selection
        - MyEye uses an eyeglass-mounted camera; Read is handheld; company materials describe pointing or gaze activation.
        - Device optics and user-directed selection.
        - No current hardware specifications or component sourcing details.
      - - Vision interpretation
        - Company sources describe OCR, computer vision, and text-to-speech; Read 3's summarization is described as an AI assistant feature.
        - Local device processing for core reading; Wi-Fi for the described summarization.
        - No benchmark, model documentation, error rate, or independent security review.
      - - Voice isolation
        - CES reports describe sampling voices, app-controlled selection, and audio delivered through earbuds.
        - Phone attachment, companion app, and earbuds; the 2024 report said Hear was in technology preview.
        - Current release state, phone compatibility, latency, distortion, and support are unverified.
      - - Audio output and privacy
        - MyEye and Read speak captured text; company materials say they work offline and do not store read text.
        - Audio interface; connected features may require network access.
        - Company assertions are not a substitute for current independent data-handling or safety assurance.
    notes: >-
      This table maps only components and dependencies described in the assigned evidence; it is not an engineering teardown or a complete architecture inventory.
