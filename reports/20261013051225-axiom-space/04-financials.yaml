        - Key indicator of whether commercial spaceflight generates positive operating cash flow
        - Flight-by-flight income statements separating launch costs, NASA fees, and crew training
      - - SpaceX Falcon 9 / Crew Dragon Seat Cost
        - ~$35M-$45M (estimated)
        - medium
        - Dominant variable cost-of-goods-sold driver for all private astronaut missions
        - Executed SpaceX launch services agreements and volume price escalator schedules
      - - Monthly Net Cash Burn Rate
        - null
        - low
        - Determines operational runway following February 2026 $350M debt/equity round
        - Monthly cash burn statements and trailing twelve-month operational cash flow reconciliations
      - - Total Backlog to Cash Conversion Rate
        - null
        - low
        - Verifies whether headline $2.2B contract backlog converts to cash without write-downs
        - Contract backlog audit schedule segmented by customer tier and milestone timing
    notes: All null metrics represent confidential private operating figures where company disclosure is absent; estimates are derived from industry benchmarks.
