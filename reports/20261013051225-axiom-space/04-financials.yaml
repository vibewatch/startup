    title: Pricing / monetization table
    columns:
      - Offering / Contract
      - Price / Unit / Contract Model
      - List vs. Realized Pricing
      - Discounts, Concessions & Unknowns
      - Source & Verification
    rows:
      - - Commercial ISS Seat (PAM)
        - List priced in mid-$60M range per seat for 10-day mission
        - Realized per-seat net price undisclosed after SpaceX launch and NASA cargo fees
        - Sovereign volume discounts and multi-seat government concessions undisclosed
        - Company disclosure (Bhatia, 2024) and secondary transaction reviews
      - - NASA NextSTEP ISS Module (PPTM)
        - $140M firm-fixed-price development award
        - Milestone-gated payments; contractor bears structural cost overruns
        - Thales Alenia Space subcontract absorption and scope adjustments unknown
        - NASA procurement records and trade press reporting
      - - NASA xEVAS Spacesuit Task Orders
        - Task orders against $1.26B contract ceiling ($228.5M initial)
        - Milestone-tied task order payments subject to test performance
        - Delivery delay penalties and schedule friction cited by NASA Inspector General
        - NASA award documentation and analyst reports (Sacra)
      - - Orbital Data Center Nodes
        - $100M corporate equity framework from Hungary's 4iG Group
        - Commercial compute service pricing model (capacity lease vs. per-TB) unfinalized
        - Power, bandwidth, and edge compute revenue-sharing terms undisclosed
        - 4iG corporate filings and Axiom partnership releases
    notes: Pricing figures distinguish between public list pricing, firm-fixed-price federal contract ceilings, and unverified commercial realization rates.
