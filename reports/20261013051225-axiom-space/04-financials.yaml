    rows:
      - - Private Astronaut Missions (PAM)
        - Turnkey commercial human spaceflight missions to ISS
        - Mid-$60M list price per 10-day astronaut seat
        - 4 missions flown (Ax-1 through Ax-4); Ax-5 awarded for NET Jan 2027
        - Volatile flight cadence and negative mission operating margins
        - Seat-level realized margin schedules and customer prepayment terms
      - - NASA Spacesuit Contract (AxEMU)
        - Milestone-based federal procurement (xEVAS)
        - Fixed-price milestone task orders under $1.26B ceiling
        - Sole active provider for Artemis III lunar and ISS suits
        - High-grade federal backlog subject to delivery performance and OIG scrutiny
        - Cumulative milestone billing schedule and task order margin realizations
      - - NASA ISS Commercial Module (PPTM)
        - Fixed-price development contract (NextSTEP)
        - $140M total contract ceiling
        - Module welding and machining underway at Thales Alenia Space
        - Non-recurring development revenue with cost overrun risk absorbed by Axiom
        - Milestone payment milestones recognized to date and variance-to-budget
      - - Orbital Data Compute & In-Space R&D
        - Commercial data center infrastructure & sovereign partnerships
        - Strategic equity and development frameworks ($100M 4iG agreement)
        - AxDCU-1 prototype deployed to ISS; free-flying data nodes planned
        - Early-stage commercial pipeline with speculative customer conversion
        - Binding service agreements and recurring commercial capacity commitments
    notes: Revenue streams reflect disclosed contract ceilings, per-seat pricing statements, and partner agreements across commercial and government programs.
