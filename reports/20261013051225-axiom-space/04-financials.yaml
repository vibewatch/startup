callouts:
  - calloutType: risk
    title: Mission Negative Gross Margins and Federal Schedule Exposure
    body: Although private astronaut missions generate high-profile headlines and substantial gross billings, independent reporting indicates they currently operate at an accounting loss due to steep launch procurement and orbital accommodation fees. Furthermore, Axiom's sole-provider position on NASA's spacesuit program exposes the company to acute milestone delivery risk if lunar landing timelines face further technical adjustments.
    claimRefs:
      - CI004
      - CI007
      - CI010
  - calloutType: insight
    title: Capital Structure Pivot Toward Strategic and Sovereign Financing
    body: Axiom has successfully diversified its capital base beyond traditional Silicon Valley venture capital by securing backing from sovereign entities like Qatar Investment Authority and strategic telecommunications partners like Hungary's 4iG Group. However, the inclusion of debt components in its February 2026 financing indicates that future equity underwriting must carefully evaluate debt service obligations alongside capital expenditures.
    claimRefs:
      - CI012
      - CI013
      - CI014
