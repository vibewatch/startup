evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-unit-margins
    missingEvidence: >-
      Audited financial statements detailing gross margins per astronaut mission, cost of goods sold, recognized revenue
      under GAAP, and net cash burn.
    whyItMatters: >-
      Without audited figures, it is impossible to evaluate whether the astronaut missions generate positive operating
      margins after paying launch and ISS fees or if they are structurally subsidized by equity capital.
    diligencePath: >-
      Request audited 2024-2025 financial statements, CFO commentary on gross margin breakdown between PAM flights and
      NASA development contracts, and trailing-twelve-month operating cash burn.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-investor-cap-table
    missingEvidence: >-
      Complete cap table schedule showing ownership percentages, share classes, liquidation preferences, and senior
      secured debt covenants from the 2026 financing.
    whyItMatters: >-
      The 2026 round involved structured debt and equity from sovereign and strategic investors; understanding
      liquidation stack seniority is vital to assessing common stock downside risk.
    diligencePath: >-
      Obtain updated cap table summary, Series C/2026 investor rights agreements, and terms of debt instruments issued
      in the February/June 2026 rounds.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: station-sam
    missingEvidence: Current contracted station demand by customer, service, start date, capacity, price, and renewal term.
    whyItMatters: >-
      Without contracted utilization and capacity data, broad market estimates cannot be converted into a defensible
      station SAM.
    diligencePath: Review executed tenancy, access, and agency agreements alongside the station capacity and commissioning plan.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: axiom-som
    missingEvidence: >-
      Current mission pipeline, seat volume, payload volume, station utilization, renewal, pricing, and gross-margin
      assumptions.
    whyItMatters: >-
      These inputs determine Axiom's obtainable share, revenue durability, and the cash return on a capital-intensive
      station build.
    diligencePath: >-
      Obtain the commercial pipeline, signed backlog by program, customer cohort renewals, unit economics, and capacity
      model.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-disclosure
    missingEvidence: >-
      Current direct primary evidence for competitor funding, signed backlog, technical readiness, target segments,
      launch schedules, pricing, and regulatory posture.
    whyItMatters: >-
      Without comparable current data, relative scale, price-performance, and time-to-capacity cannot be ranked
      reliably.
    diligencePath: >-
      Obtain current competitor filings, official technical updates, NASA milestone records, procurement documents, and
      customer contracts, then normalize scope and date.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer contracts showing integration fees, exclusivity, renewal terms, capacity reservations, data portability,
      and termination rights.
    whyItMatters: Public product breadth does not establish economic lock-in, realized pricing, or durable customer retention.
    diligencePath: Review representative mission, payload, station-access, and government agreements in a management data room.
    relatedQuestionRefs:
      - QP004
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Flight-level audited gross margin schedules and seat-level cost allocations for private astronaut missions to the
      ISS.
    whyItMatters: >-
      Without flight-level gross margins, investors cannot determine whether private human spaceflight is structurally
      profitable or an operating loss leader.
    diligencePath: Request audited management accounts and flight-by-flight contribution margin analyses under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-burn
    missingEvidence: >-
      Current monthly net cash burn rate, working capital obligations, and debt repayment amortization schedules
      following the February 2026 financing.
    whyItMatters: >-
      Axiom's capital intensity and station construction commitments require clear runway visibility to gauge future
      dilution risk.
    diligencePath: >-
      Examine trailing twelve-month cash flow statements, debt covenants, and capital expenditure forecasts for PPTM
      integration.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: developer-surface-proxy
    missingEvidence: Public developer repositories, open API telemetry, or software development kits for orbital payload interfacing.
    whyItMatters: >-
      Human spaceflight and space station hardware operate under strict ITAR and EAR export controls and proprietary
      aerospace designs, precluding an open-source software developer ecosystem.
    diligencePath: >-
      Request customer payload interface control documents (ICDs), developer payload software specs, and integration
      guidelines under non-disclosure agreement.
  - type: missing-source
    severity: material
    topic: station-schedule-verification
    missingEvidence: >-
      Independent engineering audit of Thales Alenia Space factory acceptance milestones for the Payload, Power, and
      Thermal Module pressure hull in Turin.
    whyItMatters: >-
      Achieving free-flight operations before International Space Station decommissioning requires timely delivery of
      the primary structure to Cape Canaveral without thermal or power qualification delays.
    diligencePath: >-
      Inspect NASA Commercial LEO Destinations quarterly milestone reviews and Thales Alenia Space hardware delivery
      schedules.
  - type: private-evidence-only
    severity: material
    topic: spacesuit-development-economics
    missingEvidence: >-
      Audited manufacturing cost per AxEMU spacesuit unit and life-cycle maintenance cost structure under NASA xEVAS
      task orders.
    whyItMatters: >-
      Lunar and station EVA spacesuit hardware development carries substantial recurring technical risk and capital
      requirements that must be distinguished from commercial station infrastructure.
    diligencePath: Request internal program budget allocations and NASA xEVAS contract cost performance reports.
  - type: missing-source
    severity: material
    topic: retention-and-renewal-durability
    missingEvidence: >-
      Audited cohort data on repeat non-government microgravity research customers and long-duration commercial tenant
      renewals for Axiom Station.
    whyItMatters: >-
      Without verified retention metrics, customer lifetime value and the durability of commercial demand separate from
      government subsidies remain unproven.
    diligencePath: >-
      Request audited revenue breakdowns by customer cohort, contracted backlog run-off schedules, and binding tenant
      pre-lease agreements.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive non-redacted registry of all private astronaut flight contracts, sovereign pricing riders, and
      commercial payload sponsors.
    whyItMatters: >-
      Sample enumeration of public flights masks private passenger contract terms, cancellation clauses, and individual
      seat subsidies.
    diligencePath: Review customer mission orders and commercial flight service agreements during confirmatory diligence under NDA.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Audited breakdown of debt covenants, senior liens, interest rates, and liquidation preferences in the February
      2026 $350M financing.
    whyItMatters: Debt seniority over common equity could impair equity recovery in downside operational delay scenarios.
    diligencePath: Request private capitalization table, debt schedule, and preferred share purchase agreements from lead investors.
    relatedQuestionRefs:
      - QR007
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Complete unredacted task order milestones and schedule variance tracking from NASA JSC for Artemis spacesuits.
    whyItMatters: Determines whether lunar suit qualification slips past the mid-2027 Artemis III target date.
    diligencePath: File Freedom of Information Act requests or inspect NASA Commercial Crew and Cargo audit updates.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: unverified-financial-metrics
    missingEvidence: >-
      Audited financial statements for 2025-2026 detailing recognized revenue, gross margin per astronaut seat, and debt
      repayment schedules.
    whyItMatters: >-
      Without verified operating margins and debt covenants, investors cannot determine whether the ~$2.5B valuation
      rebound reflects sustainable economics or structural dilution overhang.
    diligencePath: >-
      Request confidential disclosure of the J.P. Morgan February/June 2026 financing memorandum, debt maturity profile,
      and NASA milestone cash burn schedules.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
