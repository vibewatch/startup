              - CM008
              - CM010
              - CM011
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              买方分为主权项目、私人宇航员、研究机构和工业用户。Axiom 前 3 次任务证明了国际和研究需求：公司称机组来自 8 个国家，完成了超过 105 项研究活动，并拥有超过 50 家研究合作方。Intro-act
              还报道称，截至 2023 年 8 月，已有超过 9 个国家加入不同层级的 Access Program，ESA 也成为重复购买方。这些是有用的采用信号，但属于历史信息，未披露当前合同金额或续约率。

              不同细分市场的预算归属不同。国家部委和航天机构为宇航员访问和战略能力提供资金；个人或赞助方支付私人任务；大学、资助项目和企业研发团队为载荷提供资金；政府采购则支持宇航服和空间站开发。采用通常从任务、载荷或任务订单开始，之后可能扩展为经常性空间站访问。Access
              Program 的分层方案涵盖数据共享、研究与制造载荷、宇航员时间以及潜在舱段所有权，降低了各国自行建设完整主权体系的需求。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
