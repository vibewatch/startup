              - CM010
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不止商业空间站
        blocks:
          - type: paragraph
            body: >-
              Axiom 最直接的竞争对手是载人商业空间站开发商，包括 Orbital Reef 和 Starlab；保留的 2023 年分析师报告还列出 Northrop Grumman、Above: Space 和
              Vast。但买方真正的选择集合更广。NASA
              及其合作机构可以延长或重新分配公共基础设施工作；国家项目可以建设主权产能；研究人员可以使用机器人或短时平台；政府也可以购买任务服务而不承诺租用空间站。对多数买方而言，自建在经济上不现实，但对大型主权客户仍有战略意义。因此，Axiom
              面对的是目的地、访问和任务替代方案的组合，而不是单一的空间站正面对决。
            claimRefs:
              - CP003
              - CP006
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP012
      - number: '3.2'
        title: Axiom 最强的差异化在于一体化访问与执行
        blocks:
          - type: paragraph
            body: >-
              Axiom 当前的证明来自运营，而不只是架构设计：公司称其前 3 次私人任务覆盖 8 个国家，完成超过 105 项研究相关活动，并拥有超过 50
              家研究合作方。其定位结合端到端机组任务集成、从国际空间站向独立空间站过渡的计划、微重力研究和制造、AxEMU 宇航服及轨道计算。相比全新的自由飞行目的地，依托国际空间站的路径和 NASA
              关系可能降低获客摩擦；已完成的设计审查和制造活动也增强了可信度。但其中多项表述来自公司自身，不能独立证明进度、成本或技术优越性。
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
