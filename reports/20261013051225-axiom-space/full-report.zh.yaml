              - CP010
              - CP011
      - number: '3.3'
        title: 任务价格可见，空间站竞争却不透明
        blocks:
          - type: paragraph
            body: >-
              Axiom 披露 2024 年十天任务的单座价格约为 $60M
              中段，为其打包任务产品提供了少见的公开参照点。指定证据中没有出现可比的当前空间站租赁、载荷、制造或竞争对手价格表，因此无法支持标准化的价格—性能比较。宇航员训练、任务保障、载荷集成和政府审批若长期打包，转换成本应当最高；相比国家宇航员项目，研究载荷更可能采用多平台。Axiom
              的 NASA 访问权、国际关系和合作伙伴网络是渠道优势，但公司依赖发射、舱段、机构和技术合作方，无法控制完整交付链。
            claimRefs:
              - CP002
              - CP007
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP013
      - number: '3.4'
        title: 壁垒取决于把特权访问转化为按时产能
        blocks:
          - type: paragraph
            body: >-
              Axiom 的领先地位最好理解为具有时效性的执行优势。2023 年分析师论点强调 2026 年初发射首个舱段以及国际空间站独家附着权；较新的行业目录则称，顺序改为 2027 年初先发射动力舱，随后与 Hab
              One 交会。这一变化削弱了进度领先作为长期壁垒的作用，也提高了无需国际空间站集成、能够独立形成产能的竞争者的价值。Axiom
