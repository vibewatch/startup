      - number: '4.4'
        title: 资本充足性、消耗信号与投资判断
        blocks:
          - type: paragraph
            body: >-
              Axiom Space 的激进运营扩张造成了严重的资本充足性压力。2024 年 9 月，媒体披露公司面临工资压力、约 100 人裁员、自愿降薪 20%，并延迟向包括 SpaceX 在内的关键供应商付款。公司通过
              2025 年 3 月一轮 $100M 融资解决即时流动性需求，但估值降至 $2.0B，低于 2023 年的 $2.6B；同时与匈牙利 4iG Group 达成 $100M 战略合作。2026 年 2
              月，Axiom 完成由 Type One Ventures 和 Qatar Investment Authority 共同领投的 $350M 新融资，使累计融资超过 $850M。该笔资金增强了空间站制造和
              AxEMU 宇航服开发的短期资金余量，但债务工具也抬高了固定义务。评估 Axiom Space 时，必须核实现有现金储备能否支撑到商业空间站脱离，而不需要进一步稀释性资本重组。
