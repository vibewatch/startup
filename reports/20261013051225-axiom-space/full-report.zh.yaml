    rows:
      - - 乐观情景
        - 2027 年春季赢得 NASA CLD Phase 2 主合同；2028 年发射 PPTM 模块；AxEMU Sortie Suit 按时获认证
        - 自主轨道空间站运营并上市后，企业估值扩大至 $6.0B-$8.0B
        - Turin 结构制造延迟，或未能获得 CLD Phase 2 锚定资金
        - 25%（政府及商业项目均需完美执行）
      - - 基准情景
        - 获得 CLD Phase 2 共享合同；模块目标于 2028 年末发射；宇航服于 2027 年通过认证
        - 估值维持在 $2.5B-$3.5B；高额开发消耗要求 2028 年前再进行一轮大额融资
        - 私人航天市场倍数压缩，且持续承担偿债义务
        - 50%（已验证的主权支持与航天项目持续延期相互拉扯）
      - - 悲观情景
        - CLD Phase 2 合同输给 Vast 或 Starlab；AxEMU 宇航服推迟至 2028 年之后；高额偿债消耗流动性
        - 估值跌破 2025 年 3 月下轮融资水平（<$1.5B），触发资本重组或困境出售
        - 承包商付款争议再起；主权投资人拒绝后续次级股权融资
        - 25%（与 2024 年末现金紧张及高额固定管理费用相符）
    notes: 情景基于 NASA 奖项选择、组装时间表及流动性需求，对 2026-2030 年结果建模。
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 2016 至 2026 年的创立、NASA 合同授予、私人宇航员任务、领导层更替及融资。
    approximationNotes: 里程碑日期反映公开公告及任务飞行窗口；未来模块发射日期代表修订后的基准时间表。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
      - CO009
      - CO010
      - CO012
      - CO013
    data:
      items:
        - label: 创立及注册
          date: '2016'
          detail: Axiom Space 由 Kam Ghaffarian 和前 ISS 项目经理 Michael Suffredini 在 Houston 创立，旨在开发商业航天基础设施。
          tone: positive
        - label: NASA ISS 商业模块遴选
          date: 2020-01
          detail: NASA 选定 Axiom Space 独家使用 ISS 前向端口对接商业模块，并授予 $140M 合同。
          tone: positive
        - label: B 轮融资及航天独角兽
          date: 2021-02
          detail: 获得由 C5 Capital 领投的 $130M B 轮融资，用于模块开发及载人轨道飞行运营。
          tone: positive
        - label: Axiom Mission 1（Ax-1）发射
          date: 2022-04
          detail: 搭乘 SpaceX Crew Dragon 完成首个全私人宇航员 ISS 任务，开展 25 项以上微重力研究。
          tone: positive
        - label: NASA xEVAS 宇航服唯一供应商地位
          date: 2024-06
          detail: Collins Aerospace 退出后，成为 NASA xEVAS 项目 Artemis 月球及 ISS 宇航服的唯一现役供应商。
          tone: positive
        - label: 流动性紧张及公司重组
          date: 2024-09
          detail: 面临现金流压力，导致承包商付款延迟、约 100 名员工被裁、自愿降薪 20% 及 CEO 更替。
          tone: negative
        - label: Axiom Mission 4 及 CEO 更替
          date: 2025-10
          detail: 与国际宇航员完成为期 18 天的 Ax-4 飞行；Tejpaul Bhatia 任职六个月后，Dr. Jonathan Cirtain 获任 CEO。
          tone: neutral
        - label: 超额认购的 $525M+ 融资交割
          date: 2026-06
          detail: 与 Type One Ventures、QIA、MUFG Bank 及 4iG 完成扩大至 $525M+ 的融资，用于 Axiom Station PPTM 模块及 AxEMU 宇航服生产。
          tone: positive
  - id: FM001
    title: 市场规模证据层级
    type: pyramid
    summary: 该层级从宽泛且相互冲突的经济规模估算，逐步落到与公司相关的输入及尚未解决的 SAM/SOM；它不是可相加的漏斗。
    data:
      items:
        - label: 全球航天经济规模估算
          value: 546
          unit: USD billions
          detail: Space Foundation 2022 年估算，由 Intro-act 报道
        - label: 全球航天市场规模估算
          value: 447
          unit: USD billions
          detail: McKinsey 2022 年估算，由 Intro-act 报道
        - label: 全球航天市场潜力
          value: 1000
          unit: USD billions
          detail: McKinsey 对 2030 年的可能性判断，由 Intro-act 报道
        - label: 机构支出迁移愿景
          value: 2
          unit: USD billions per year
          detail: Axiom 管理层于 2023 年披露的愿景；并非已签约需求
        - label: 私人任务单价
          value: 60
          unit: USD millions per seat
          detail: 十天任务处于中 $60M 区间，公司于 2024 年披露
        - label: Axiom Station SAM
          value: Not publicly isolated
          detail: 需要当前需求、利用率、定价及产能证据
        - label: Axiom 可获得份额 / SOM
          value: Not publicly isolated
          detail: 需要已签约租赁、任务节奏、续约及利润率证据
    approximationNotes: 各数值保留来源各自的指标、期间及单位。$60M 点仅为可视化而取已披露中 $60M 区间的下沿；宽泛估算、愿景、单价及缺失的 SAM/SOM 不可比较，也不可相加。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM010
      - CM011
  - id: FP001
    title: 受证据约束的竞争定位
    type: quadrant
    summary: 序数定位将运营证明与所提供解决方案的广度分开；分数是分析性分类，不是实测表现。
    data:
      xAxis:
        label: 运营证明
        min: 1
        max: 5
      yAxis:
        label: 综合服务广度
        min: 1
        max: 5
      points:
        - label: Axiom Space
          x: 5
          'y': 5
          detail: 已完成私人任务，覆盖空间站、宇航服、研究、制造及计算业务。
        - label: Orbital Reef
          x: 2
          'y': 4
          detail: 直接的空间站替代方案；指定证据未量化当前准备度。
        - label: Starlab
          x: 2
          'y': 4
          detail: 直接的空间站替代方案；指定证据未量化当前准备度。
        - label: Vast
          x: 2
          'y': 3
          detail: 保留来源确认的空间站新进入者，但本证据池中的可比证据有限。
        - label: ISS 或主权基础设施
          x: 5
          'y': 3
          detail: 运营证明及战略控制力强，但并非同类商业组合。
        - label: 机器人或短时长平台
          x: 3
          'y': 2
          detail: 无需完整载人目的地的工作负载，可改用这类范围更窄的平台。
    approximationNotes: 分数为序数（1 低至 5 高），依据保留证据得出；不是预测、市场份额或技术基准结果。
    claimRefs:
      - CP006
      - CP012
      - CP014
      - CP015
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 从初始合同签订及高成本 ISS 任务，走向自由飞行商业轨道运营的收入转化路径。
    data:
      nodes:
        - id: contract-capture
          label: 主权及私人合同获取
          detail: 以每座位中 $60M 的价格锁定 PAM 座位，并获得 NASA 固定价格奖项（$140M 空间站模块、$1.26B 宇航服）。
        - id: milestone-deliveries
          label: 里程碑及硬件开发
          detail: 与 Thales Alenia Space 进行硬件制造，开发 AxEMU 宇航服，并在 Houston 开展宇航员训练。
        - id: flight-execution
          label: 任务飞行执行
          detail: 通过 Falcon 9 和 Crew Dragon 发射前往 ISS；截至 2025 年中已完成 4 次任务，Ax-5 目标于 2027 年执行。
        - id: gross-margin-burn
          label: 直接任务交付成本
          detail: SpaceX 发射成本、NASA 集成费用及分包商支出，导致任务运营亏损。
        - id: capex-station-build
          label: 基础设施资本开支
          detail: 制造 PPTM 和 Hab-1 模块、Axiom Docking Adapter 及洁净室组装基础设施。
        - id: station-free-flight
          label: 独立轨道商业化
          detail: 商业空间站运营（不早于 2028 年）、与 4iG 合作的轨道数据中心计算及主权租户租赁。
    approximationNotes: 节点反映运营阶段，而非经审计的损益表项目；时间安排及转化效率均为估算。
    claimRefs:
      - CI002
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 分层架构展示标准化轨道底座与可定制任务交付之间的区隔。
    data:
      layers:
        - label: 交付及任务定制层
          detail: 客户专属载荷、国家科研设备、科学集成及商业品牌。
        - label: 乘组运营及训练层
          detail: 宇航员训练课程、离心机 / EVA 准备、医疗监测及飞行运营支持。
        - label: 运输及发射集成层
          detail: 供乘组及货物进入轨道的商业发射服务商接口（SpaceX Falcon 9 和 Crew Dragon）。
        - label: 自由飞行公用设施及空间站系统层
          detail: 自主制导、导航、推进、对接机构及高带宽通信。
        - label: 生命支持及环境控制（ECLSS）层
          detail: 大气再生、压力保持、主动热管理及水循环。
        - label: 核心结构底座层
          detail: Thales Alenia Space 制造的铝合金承压壳体、微流星体碎片防护及通用泊位接口。
    approximationNotes: 分层反映 Orbital Progress 和 NASA CLD 评审记录的 Axiom 技术架构模型。
    claimRefs:
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户从初步任务范围界定，推进至私人宇航员飞行执行及长期商业空间站租赁。
    data:
      nodes:
        - label: 需求发现及定义
          summary: >-
            Sovereign space agencies or private customers define astronaut mission objectives, scientific payloads, and
            flight duration requirements.
          touchpoints:
            - Axiom Commercial Outreach
            - Feasibility Assessment
        - label: 任务协议及座位签约
          summary: >-
            Customer signs binding flight service agreement with fixed seat pricing ($55M-$65M per seat) and payload
            integration specifications.
          touchpoints:
            - Commercial Contract Execution
            - SpaceX Launch Manifesting
        - label: 宇航员训练及载荷准备
          summary: >-
            Crewmembers undergo comprehensive orbital flight training and centrifuge preparation alongside mission
            payload certification.
          touchpoints:
            - NASA JSC Facilities
            - Axiom Training Program
        - label: 轨道任务执行
          summary: >-
            Launch aboard commercial transport to the ISS, executing planned microgravity science, technology
            demonstrations, and media events.
          touchpoints:
            - ISS Commercial Berthing
            - Flight Operations Center
        - label: 飞行后数据及对外传播交付
          summary: Payload recovery, scientific sample distribution to researchers, and sovereign public diplomacy engagement.
          touchpoints:
            - Earth Return Recovery
            - Mission Debriefing
        - label: 商业空间站租赁扩张
          summary: >-
            Transition from ad-hoc 10-day ISS sorties into multi-month leased lab space and long-duration orbital berths
            on Axiom Station.
          touchpoints:
            - Axiom Station PPTM Pre-Lease
            - Long-Term Tenancy Contract
    approximationNotes: 旅程阶段概括主权及私人任务的商业生命周期；合同条款及任务提前期因客户类别而显著不同。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU008
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 从可能性、严重程度、缓解措施成熟度及残余暴露四个维度评估 Axiom Space 的主要风险向量。
    approximationNotes: 评估定性综合 NASA OIG 结论、公司融资公告及独立航天报道。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR006
      - CR007
      - CR011
    data:
      columns:
        - 可能性
        - 影响严重程度
        - 缓解措施成熟度
        - 残余风险分数
      rows:
        - label: 宇航服进度延误
          values:
            - 高
            - 严重
            - 发展中
            - 严重
        - label: 营运资金及薪资流动性
          values:
            - 高
            - 严重
            - 发展中
            - 严重
        - label: Axiom Station 发射延迟
          values:
            - 高
            - 高
            - 已建立
            - 高
        - label: NASA 锚定客户集中度
          values:
            - 高
            - 严重
            - 初现
            - 高
        - label: 高管层人员流动
          values:
            - 中
            - 高
            - 初现
            - 中
        - label: 对发射器的单一依赖
          values:
            - 中
            - 严重
            - 低
            - 高
  - id: FV001
    title: 建议决策逻辑链
    type: flow
    summary: 决策流程将执行证明、资本密集度、估值重估及缺失的单位经济数据映射至进一步研究的立场。
    approximationNotes: null
    data:
      nodes:
        - id: operational-execution
          label: 1. 运营执行证明
          description: 已完成 4 次成功的私人宇航员任务（Ax-1 至 Ax-4），ISS 模块焊接正在进行。
        - id: capital-intensity
          label: 2. 极高资本密集度
          description: 累计融资超过 $1B；2024 年末现金消耗加剧，导致裁员、降薪以及拖欠承包商款项。
        - id: sovereign-rebound
          label: 3. 主权方主导的资本注入
          description: 2026 年 2 月的 $350M 轮融资（QIA、Type One）到 2026 年 6 月扩大至 $525M+，由股权和债务共同构成。
        - id: valuation-rebound
          label: 4. 估值回升
          description: 估值从 2025 年 3 月下行轮的 $2.0B 回升至 2026 年约 $2.5B，但未披露 ARR。
        - id: programmatic-milestones
          label: 5. 项目集中度
          description: 收入延续取决于 2027 年拿下 NASA CLD Phase 2，并在 2028 年交付 AxEMU 宇航服。
        - id: investment-verdict
          label: 6. 建议：继续研究
          description: 保持克制的观望立场；入场前必须核实毛利率、债务安排和空间站 RFP 结果。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV012
      - CV014
