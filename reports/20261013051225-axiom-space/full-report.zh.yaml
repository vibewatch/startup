              Axiom Space 的商业定价区分公开标价和实际合同金额。私人宇航员任务的座位，标准十天国际空间站任务每位约标价 $55M 至 $60M 中段。虽然单座标价看起来很强，但公司未披露扣除 SpaceX
              发射载具采购、NASA 空间站资源费和休斯顿 15 周专属宇航员训练项目后的实际净利润率。固定价格政府项目带来不同的定价机制：NASA 提供明确的里程碑付款，但 Axiom
