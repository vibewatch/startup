      - number: '1.2'
        title: 领导层、治理与高管变动
        blocks:
          - type: paragraph
            body: >-
              Axiom Space 由 Kam Ghaffarian 博士和 Michael Suffredini 共同创立，结合了空间站运营权威与商业工程承包经验。Suffredini 曾在 NASA
              管理国际空间站项目长达 10 年，负责其向商业化利用过渡；Ghaffarian 则创办了 NASA 第二大工程承包商 Stinger Ghaffarian Technologies。2024 年末至 2025
              年末，公司治理和高管稳定性经历明显动荡。Suffredini 于 2024 年 8 月卸任 CEO，Ghaffarian 随后担任临时负责人，直到前首席营收官 Tejpaul Bhatia 于 2025 年 4
              月接任 CEO。Bhatia 任职 6 个月后离开，Jonathan Cirtain 博士于 2025 年 10 月出任 CEO 兼总裁，意味着公司在 14 个月内迎来第 3 位 CEO。Ghaffarian
              继续以执行董事长和直接股权支持者的身份维持治理连续性；载人航天负责人 Peggy Whitson 等资深宇航员也提供了领导支持。
