      - number: '1.3'
        title: 资本结构、融资历程与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              自 2016 年成立以来，Axiom Space 累计筹集的股权和债务资本超过 $1.0B，融资从早期种子轮和可转债逐步发展到 2021 年 $130M 的 B 轮和 2023 年 $350M 的 C
              轮。2026 年 6 月，公司完成超过 $525M 的超额认购融资方案，规模高于 2026 年 2 月公布的初始 $350M 债股混合融资。银团由 Type One Ventures 和 Qatar
              Investment Authority 牵头，MUFG Bank、1789 Capital、LuminArx Capital Management 以及匈牙利 4iG Group 参与。Axiom
              的估值轨迹波动显著：2023 年 C 轮时估值基准达到 $2.6B；在现金大量消耗后，2025 年 3 月以 $2.0B 的下调估值融资；PitchBook 估计，2026 年融资完成后估值回升至 $2.5B
              以上。业务在过渡到空间站部署前，流动性资本需求仍然很高。
