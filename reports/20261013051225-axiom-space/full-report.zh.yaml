        blocks:
          - type: paragraph
            body: >-
              Axiom Space 的商业收入来自 3 条主要运营线：前往国际空间站的私人宇航员任务、由里程碑驱动的联邦太空合同，以及正在形成的商业基础设施服务。公司报告 2023 财年收入为
              $400M，政府机构和私人客户签署的客户合同总额超过 $2.2B。联邦合同上，Axiom 通过 NextSTEP 项目从 NASA 获得 $140M 固定总价合同，用于建造并附着首个商业目的地舱段。2024 年
              Collins Aerospace 缩减范围后，Axiom 又成为 NASA 新一代宇航服 Exploration Extravehicular Activity Services
              合同下的唯一活跃供应商，该合同总上限为 $1.26B。这些长期联邦协议提供了较强的订单稳定性，但现金流确认严格取决于完成工程和资格认证里程碑。
