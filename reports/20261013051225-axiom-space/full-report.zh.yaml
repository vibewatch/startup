chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Axiom Space, Inc. 是一家总部位于休斯顿的商业航天制造商和轨道航天运营公司，成立于 2016
              年。公司业务覆盖载人航天服务、商业空间站开发和新一代行星表面宇航服。它不是火箭发射商，而是主承包任务集成商：向 SpaceX 采购商业发射和载人飞船运输，把私人宇航员送往国际空间站，同时制造自有的 Axiom
              Station 舱段。十天轨道任务的商业座位价格历史上每位约为 $55M–$65M，客户包括主权政府和私人研究机构。商业航天任务虽能带来收入活动，但毛利率和按 GAAP
              确认的收入运行率仍是未披露的私人数据。Axiom 的总部、工程集成设施和宇航员训练基础设施均位于得州休斯顿。
