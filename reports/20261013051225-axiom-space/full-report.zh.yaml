            body: >-
              Axiom Space 的成本结构以极高的任务交付变动费用和密集的资本开支需求为特征。公司完全依赖 SpaceX Falcon 9 发射载具和 Crew Dragon
              飞船把机组送入轨道，这是其最大的单项变动成本。对于轨道基础设施开发，Axiom 与意大利都灵的 Thales Alenia Space 合作，制造 Payload Power Thermal Module 和
              Habitat One 舱段的加压主结构及微流星体防护层。由于私人宇航员飞行目前受高昂初始发射成本影响而处于会计亏损，近期任务本质上是建立宇航员训练流程和任务控制能力的运营引流产品。真正的商业盈利要等到
              Axiom Station 最早预计 2028 年实现自由飞行运营后才可能出现；届时持续的多租户研究、制造和轨道数据中心可以带来更高毛利的经常性收入。
