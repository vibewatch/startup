  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 狭窄的商业低地球轨道边界
        blocks:
          - type: paragraph
            body: >
              Axiom
              的相关市场，是围绕轨道上人员和生产性工作的付费服务层：端到端载人航天任务、空间站访问与居住、微重力研究和制造服务、轨道数据计算，以及先进宇航服。边界不包括发射载具制造、卫星星座、地面实验室，以及主流太空经济预测中计入的大部分国防和通信支出。Axiom
              是任务集成商和空间站开发商，不是发射商；运输由 SpaceX 等合作伙伴提供。这一区分意味着不能把广义太空经济直接当成公司的 TAM。

              现状同样重要。主权买方可以运营本国项目、通过政府机构购买访问权限，也可以完全放弃载人航天；研究或工业买方则可以留在地面实验室。Axiom
              用共享、托管式访问模式，替代建设轨道设施、发射能力、医疗与训练项目及配套基础设施的成本。因此，这个市场由具体机构预算和高价值工作流组成，而不是一个同质化的大池子。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM015
      - number: '2.2'
        title: 不制造虚假精确度的规模测算视角
        blocks:
          - type: paragraph
            body: >
              可用的自上而下估算从起点就彼此冲突。Intro-act 报道 McKinsey 估计 2022 年全球太空市场约为 $447B，2030 年可能达到 $1T；同一报告又引用 Space Foundation 对
              2022 年太空经济 $546B 的估算，并预计 5 年增长 41%。这些都是边界不同的宽泛二手估算，既没有单独拆出商业低轨目的地、载人航天集成，也没有拆出 Axiom
              可获得的份额。它们只能提供背景，不能直接用于估值的 TAM。

              自下而上的证据对决策更有用，但仍不完整。Axiom 披露 2024 年十天任务的座位价格约为 $60M 中段；一份 2023 年分析师报告称，管理层希望每年约 $2B 的机构支出转向 Axiom
              Station。前者是单价，不是年度需求；后者是愿景，不是签约市场。公开来源没有披露计算 SAM 和 SOM
              所需的当前座位量、空间站租赁、利用率、续约或利润率假设。因此，这张图展示的是证据层级，而不是可相加的层层市场。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
