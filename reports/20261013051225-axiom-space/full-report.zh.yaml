      - number: '5.2'
        title: Axiom Station 工程与重构后的组装顺序
        blocks:
          - type: paragraph
            body: >-
              Axiom Station 是公司的旗舰基础设施资产，设计为先附着在国际空间站 Node 2 的前向接口，随后脱离成为独立的自由飞行综合体。Axiom 与 NASA 协调后重构组装顺序，先发射
              Payload、Power 和 Thermal Module，而不是 Habitat 1。这一调整让附着综合体直接获得专用发电、主动热控和推进能力，最早可在 2028 年脱离。分离后，Axiom 计划继续对接
              Habitat 1、气闸舱、Habitat 2 以及专用研究与制造设施，在政府空间站退役前完成商业轨道前哨。
