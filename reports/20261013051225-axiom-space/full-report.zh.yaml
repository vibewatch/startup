      - number: '1.4'
        title: 运营飞行记录、不利历史与轨道路线图
        blocks:
          - type: paragraph
            body: >-
              Axiom Space 在商业载人航天领域建立了独特的运营记录：2022 至 2025 年间，搭乘 SpaceX Dragon 飞船完成了 4
              次前往国际空间站的载人任务。公司不止于太空旅游，还获得了国际空间站前向接口的独家商业对接权，并在 Collins Aerospace 于 2024 年 6 月退出后，成为 NASA xEVAS
              月球宇航服合同的唯一活跃承包商。然而，运营扩张与 2024 年严重的现金流压力同时发生，公司出现有记录的工资延迟、向发射合作方 SpaceX 延迟付款、约 100 人裁员，以及高管和员工自愿降薪
              20%。为管理技术风险和离轨时间表，Axiom 重构了空间站架构，先部署 Payload Power Thermal Module，在国际空间站计划退役前建立独立的自由飞行轨道平台。
