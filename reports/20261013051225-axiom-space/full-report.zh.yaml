              - CM015
      - number: '2.4'
        title: 需求催化剂与采用约束
        blocks:
          - type: paragraph
            body: >
              最明确的催化剂，是国际空间站可能在 2030 年前后退役，为替代性载人基础设施设定了截止期限。Axiom
              还指出半导体、光纤、纳米材料、再生医学、生物制剂、医疗器械、疾病建模和生物打印等用例。这些应用提供了可信的用户管线，飞行硬件制造也在实质性推进产能。但用例广度并不能证明存在可重复的商业需求或规模化经济生产。

              约束同样重要。一份独立的 2026 年画像把空间站时间表，以及轨道研究、制造和数据服务是否有足够需求列为悬而未决的问题。Built In 明确标注未经审阅的 LLM 摘要指出 NASA
              集中度、基于里程碑的固定价格项目、进度变更和现金压力；这是弱信号，不是已验证证据。Axiom 在 2026 年获得的 $350M
              债股融资凸显了资本强度，而对国际空间站过渡时间和合作方运输的依赖又放大了执行风险。因此，估值应锚定已签约利用率和现金转化，而不是广义市场增长。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 评估利用率，不要锚定主流太空经济
            body: 可辩护的投资判断需要空间站租赁、机构承诺、任务频率、利用率、续约和现金转化的合同证据。在这些输入可用前，广义市场预测只能用于构建背景，不能作为估值锚点。
            calloutType: recommendation
            claimRefs:
              - CM006
