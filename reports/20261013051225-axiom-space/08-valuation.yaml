callouts:
  - calloutType: "recommendation"
    title: "Disciplined Stance: Maintain Research-More Pending Unit Economics"
    body: "While Axiom Space has re-established liquidity with over $525M in 2026 financing and holds an exclusive NASA commercial docking port, the ~$2.5B valuation represents a stretched multiple over undisclosed recurring revenues. Equity investors should maintain a disciplined research-more position until audited gross margins, debt seniority structures, and NASA CLD Phase 2 contract selections are verified."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV005"
      - "CV014"
  - calloutType: "risk"
    title: "Structural Dilution and Debt Covenants Overhang"
    body: "The inclusion of debt in the 2026 financing package, following the March 2025 down-round to $2.0B and late-2024 contractor arrears, creates significant downside vulnerability. Failure to win an anchor role in NASA's spring 2027 CLD Phase 2 competition would impair commercial station viability and accelerate liquidity pressure on junior equity holders."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV012"
