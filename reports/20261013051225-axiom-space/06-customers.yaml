figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Customer progression from initial mission scoping to private astronaut flight execution and long-duration commercial station tenancy.
    data:
      nodes:
        - label: Discovery & Requirement Definition
          summary: Sovereign space agencies or private customers define astronaut mission objectives, scientific payloads, and flight duration requirements.
          touchpoints:
            - Axiom Commercial Outreach
            - Feasibility Assessment
        - label: Mission Agreement & Seat Contracting
          summary: Customer signs binding flight service agreement with fixed seat pricing ($55M-$65M per seat) and payload integration specifications.
          touchpoints:
            - Commercial Contract Execution
            - SpaceX Launch Manifesting
        - label: Astronaut Training & Payload Preparation
          summary: Crewmembers undergo comprehensive orbital flight training and centrifuge preparation alongside mission payload certification.
          touchpoints:
            - NASA JSC Facilities
            - Axiom Training Program
        - label: Orbital Mission Execution
          summary: Launch aboard commercial transport to the ISS, executing planned microgravity science, technology demonstrations, and media events.
          touchpoints:
            - ISS Commercial Berthing
            - Flight Operations Center
        - label: Post-Flight Data & Outreach Delivery
          summary: Payload recovery, scientific sample distribution to researchers, and sovereign public diplomacy engagement.
          touchpoints:
            - Earth Return Recovery
            - Mission Debriefing
        - label: Commercial Station Tenancy Expansion
          summary: Transition from ad-hoc 10-day ISS sorties into multi-month leased lab space and long-duration orbital berths on Axiom Station.
          touchpoints:
            - Axiom Station PPTM Pre-Lease
            - Long-Term Tenancy Contract
    approximationNotes: Journey stages generalize the commercial lifecycle across sovereign and private missions; contracting terms and mission lead times vary significantly by customer category.
