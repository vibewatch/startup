callouts:
  - calloutType: insight
    title: Sovereign Agency Demand Drives Flight Revenue
    body: While Axiom Space originated in high-profile private space tourism, its enduring customer volume has shifted toward sovereign space agencies in emerging spacefaring nations such as Saudi Arabia, Turkey, and Italy seeking turn-key national astronaut access without domestic orbital infrastructure.
    claimRefs:
      - CU002
      - CU006
      - CU007
  - calloutType: risk
    title: Severe Customer Concentration and Mission Margin Squeeze
    body: Axiom Space faces acute revenue concentration around NASA anchor procurement and lumpy, ad-hoc sovereign missions. Because commercial missions operate at thin or negative gross margins after accounting for contracted launch integration, flight execution delays directly threaten operational cash flow.
    claimRefs:
      - CU010
      - CU011
      - CU012
