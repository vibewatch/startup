      - - Sovereign Space Agencies
        - National governments, ministries of defense, and civil space agencies
        - National astronaut prestige, sovereign scientific missions, and human spaceflight workforce training
        - 8 nations flown across first 3 missions (Saudi Arabia, Turkey, Italy, Sweden, etc.)
        - High contract value ($55M+ per seat); establishes diplomatic and institutional credibility
        - Lumpy transaction frequency with unproven recurring annual procurement budgets
      - - Private Astronaut Participants
        - Ultra-high-net-worth individuals and corporate-sponsored private citizens
        - Orbital spaceflight tourism, private research experiments, and personal philanthropy
        - Multiple private flyers across Ax-1 through Ax-4 missions
        - Immediate upfront cash collections; broadens commercial spaceflight awareness
        - Highly elastic luxury demand vulnerable to macroeconomic cycles and flight safety incidents
      - - Microgravity Research & Biotech
        - Pharmaceutical companies, biotech firms, research universities, and institutes
        - Protein crystal growth, stem cell research, materials synthesis, and cellular biology
        - Over 105 research activities completed with 50+ research partners
        - Establishes scientific foundation for scalable in-space manufacturing applications
        - Low individual contract revenue and heavy reliance on government research grant funding
      - - Anchor Government Defense & Civil
        - NASA (National Aeronautics and Space Administration)
        - Commercial LEO Destinations module integration and Artemis lunar EVA spacesuit services
        - $140M initial module award; $1.26B max spacesuit contract ceiling
        - Underwrites foundational capital expenditure and provides core institutional revenue baseline
        - Extreme counterparty concentration and vulnerability to federal procurement audits and delays
