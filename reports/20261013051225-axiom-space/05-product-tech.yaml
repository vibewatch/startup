      - CE011
      - CE012
callouts:
  - calloutType: insight
    title: Architectural Separation of Standardized Substrate and Delivery Layer
    body: Axiom Space avoids the historical aerospace trap of bespoke design by standardizing core pressure vessels, ECLSS life support baselines, and common docking interfaces. Customization is strictly confined to the upper delivery layer, allowing sovereign customers to tailor research experiments, national insignia, and crew composition without forcing costly engineering changes onto the underlying station bus.
    claimRefs:
      - CE007
      - CE011
  - calloutType: risk
    title: Assembly Restructuring Accelerates Free Flight but Shifts Integration Risk
    body: Launching the Payload, Power, and Thermal Module first allows Axiom Station to detach as early as 2028 before the International Space Station retires in 2030. However, this strategy concentrates critical solar power generation, active thermal rejection, and orbital propulsion onto the initial module, increasing single-point development sensitivity.
    claimRefs:
      - CE001
      - CE009
  - calloutType: strength
    title: Operational Credibility Established Through Four Flown Missions
    body: By completing four crewed missions to the International Space Station, Axiom has established verified operational cadence in commercial crew training, SpaceX launch integration, joint flight operations, and on-orbit research management that purely theoretical station competitors cannot match.
    claimRefs:
      - CE003
      - CE013
