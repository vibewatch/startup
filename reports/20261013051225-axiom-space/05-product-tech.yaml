      - CE003
      - CE004
      - CE014
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job / Mission
      - Pre-Axiom Legacy Workflow
      - Axiom Solution & Delivery
      - Measurable Benefit
      - Technical & Operational Limitation
    rows:
      - - Sovereign Astronaut Flight
        - Bespoke intergovernmental treaties and bilateral NASA/Roscosmos diplomatic agreements
        - Productized mission procurement with commercial seat contracts and end-to-end training
        - Shortens sovereign preparation timeline from decades to 12-24 months
        - High seat cost (mid-$60M range) and limited annual flight slots
      - - Microgravity R&D Payload
        - Multi-year government science peer review and complex NASA payload integration cycles
        - Commercial locker integration with standardized power and telemetry interfaces
        - Rapid flight manifesting and streamlined commercial intellectual property terms
        - Restricted crew time for manual experiment interaction aboard visiting vehicles
      - - Orbital Technology Maturation
        - Expensive dedicated free-flyer satellites with no physical sample return capability
        - Pressurized habitat test platforms with astronaut monitoring and cold-stowage return
        - Enables human-in-the-loop troubleshooting and physical retrieval of test articles
        - Dependent on SpaceX Cargo/Crew Dragon launch and landing schedules
      - - Commercial LEO Habitation
        - Entirely non-existent commercial market; government-exclusive station occupancy
        - Commercial destination modules initially attached to ISS then detached as free-flyer
        - Continuous commercial presence without waiting for government station construction
        - Absolute dependency on ISS structural integrity and NASA docking availability until detachment
    notes: 'Source: Orbital Progress analysis, NASA LEO transition roadmap, and Axiom Space operational filings.'
    claimRefs:
      - CE001
      - CE005
      - CE006
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer / Component
      - Functional Role
      - Key Supplier & Partner Dependency
      - Primary Technical & Execution Risk
    rows:
      - - Primary Pressure Shell
        - Houses crew atmospheric volume and provides micrometeoroid debris shielding
        - Thales Alenia Space (Turin, Italy)
        - Manufacturing schedule slippage and international logistics transit risk
      - - Launch & Orbital Insertion
        - Transports crew and modules from Earth surface to orbital rendezvous
        - SpaceX (Falcon 9 and Crew Dragon) and heavy commercial launch vehicles
        - Launch vehicle availability, pad scheduling, and commercial launch cost inflation
      - - Power & Thermal Utility (PPTM)
        - Generates solar electrical power, radiates heat, and provides station orbit-raising delta-v
        - Internal Axiom systems engineering and prime aerospace subsystems suppliers
        - Thermal radiator deployment failures and solar array articulation reliability
      - - Environmental Life Support (ECLSS)
        - Controls oxygen, carbon dioxide scrubbing, humidity, water recycling, and cabin pressure
        - Specialized aerospace environmental control subcontractors and NASA heritage baselines
        - Transitioning from ISS-dependent resource sharing to autonomous closed-loop recycling
    notes: 'Source: NASA CLD program reports, Thales Alenia Space disclosures, and Axiom Space technical profiles.'
    claimRefs:
      - CE007
      - CE008
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Layered architecture showing the separation between standardized orbital substrate and customizable mission delivery.
    data:
      layers:
        - label: Delivery & Mission Customization Layer
          detail: Customer-specific payloads, national research equipment, science integration, and commercial branding.
        - label: Crew Operations & Training Layer
          detail: Astronaut training curriculum, centrifuge/EVA preparation, medical monitoring, and flight operations support.
        - label: Transportation & Launch Integration Layer
          detail: Commercial launch provider interfaces (SpaceX Falcon 9 and Crew Dragon) for crew and cargo orbital insertion.
        - label: Free-Flying Utility & Station Systems Layer
          detail: Autonomous guidance, navigation, propulsion, docking mechanisms, and high-bandwidth communications.
        - label: Life Support & Environmental Control (ECLSS) Layer
          detail: Atmosphere revitalization, pressure containment, active thermal management, and water recycling.
        - label: Core Structural Substrate Layer
          detail: Thales Alenia Space manufactured aluminum-alloy pressurized hulls, micrometeoroid debris protection, and common berthing.
    approximationNotes: Layer breakdown reflects Axiom technical architecture model documented by Orbital Progress and NASA CLD reviews.
