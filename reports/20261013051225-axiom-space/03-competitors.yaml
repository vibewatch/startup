      - ["Orbital data-compute offering", "Development program included in retained evidence", "Unknown in assigned evidence", "Ground and satellite compute are substitutes for some workloads", "Adds scope but remains a developing capability"]
      - ["Research and manufacturing access", "Bundled with mission and planned station services", "Expected category capability; specifics unknown here", "ISS and robotic platforms remain substitutes", "Buyer choice depends on human tending, duration, and integration needs"]
    notes: >-
      Capability labels are observed or reported only where the assigned sources support them;
      competitor cells without direct current evidence are marked unknown rather than scored.
    claimRefs: [CP001, CP004, CP009, CP010, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offer, Public price or contract model, Included scope, Discount or unknowns, Competitive implication]
    rows:
      - ["Axiom ten-day astronaut mission seat", "Mid-$60M range per seat, company-reported in 2024", "Mission integration and approximately ten days in orbit", "Realized price, discounts, launch allocation, and margin are not disclosed", "Provides a visible premium bundled-service anchor"]
      - ["Axiom station access or tenancy", "Not disclosed in assigned evidence", "Potential physical and digital space, research, manufacturing, and mission services", "No normalized unit, term, utilization, or service-level data", "Cannot compare station economics with peers"]
      - ["Direct commercial-station peers", "Not disclosed in assigned evidence", "Future destination access and related services", "No comparable pricing, capacity, or contract terms", "Price leadership cannot be established"]
      - ["Status quo or internal sovereign capacity", "Budget or program cost rather than a public list price", "Infrastructure control, strategic autonomy, and mission access", "Non-comparable accounting and policy objectives", "Axiom must compete on time-to-access and avoided infrastructure burden"]
    notes: >-
      Public list or quoted pricing is not realized revenue or margin; missing competitor prices are
      evidence gaps, not zero values.
    claimRefs: [CP002, CP013]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates operating proof from breadth of the offered solution; scores are
      analytical classifications, not measured performance.
    data:
      xAxis:
        label: Operating proof
        min: 1
        max: 5
      yAxis:
        label: Integrated service breadth
        min: 1
        max: 5
      points:
        - label: Axiom Space
          x: 5
          y: 5
          detail: "Completed private missions plus station, suit, research, manufacturing, and compute scope."
        - label: Orbital Reef
          x: 2
          y: 4
          detail: "Direct station alternative; current readiness is not quantified in the assigned evidence."
        - label: Starlab
          x: 2
          y: 4
          detail: "Direct station alternative; current readiness is not quantified in the assigned evidence."
        - label: Vast
          x: 2
          y: 3
          detail: "Station entrant identified in retained sources, with limited comparable evidence in this pool."
        - label: ISS or sovereign infrastructure
          x: 5
          y: 3
          detail: "High operating proof and strategic control, but not a like-for-like commercial bundle."
        - label: Robotic or short-duration platforms
          x: 3
          y: 2
          detail: "Narrower substitutes for workloads that do not require a full crewed destination."
    approximationNotes: >-
      Scores are ordinal (1 low to 5 high) and derived from the retained evidence; they are not
      forecasts, market shares, or technical benchmark results.
    claimRefs: [CP006, CP012, CP014, CP015]
callouts:
  - calloutType: strength
    title: Integrated commercial mission proof is the clearest edge
    body: >-
      Axiom has already operated private ISS missions and can use that activity to build relationships,
      integration know-how, and demand ahead of its own station.
    claimRefs: [CP001, CP009]
  - calloutType: risk
    title: Schedule advantage is not the same as a durable moat
    body: >-
      The documented change from an early habitat launch plan to a power-module-first sequence shows
      that roadmap timing can move before competitive capacity is operational.
    claimRefs: [CP005, CP014]
