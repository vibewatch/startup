  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Significant funding rebound and mission execution balanced against missing audited unit economics
        - Maintain disciplined hold; avoid purchasing pre-IPO common shares without cap table and debt visibility
      - - Confidence
        - medium
        - Public filing evidence verifies capital raises and NASA awards but lacks margin disclosures
        - Condition any investment decision on obtaining non-public financial disclosures and debt schedules
      - - Risk Rating
        - high
        - Structural cash burn, late-2024 contractor payment delays, and technical spacesuit mass challenges
        - Require senior liquidation preferences or secured debt terms if participating in growth rounds
      - - Valuation Stance
        - stretched
        - Valuation rebound to ~$2.5B following March 2025 down-round to $2.0B lacks supporting ARR verification
        - Refrain from paying premium multiples that assume uninterrupted commercial station commercialization
    notes: Assessment synthesized from 2025-2026 funding rounds, leadership restructuring, and NASA contract updates.
