              - CO010
              - CO011
              - CO014
      - number: '1.2'
        title: Leadership, Governance, and Executive Transitions
        blocks:
          - type: paragraph
            body: >-
              Axiom Space was co-founded by Dr. Kam Ghaffarian and Michael Suffredini, pairing institutional space
              station operational authority with commercial engineering contracting experience. Suffredini managed the
              International Space Station program at NASA for a decade through its transition to commercial utilization,
              while Ghaffarian founded Stinger Ghaffarian Technologies, NASA second-largest engineering contractor.
              Governance and executive stability underwent significant turbulence between late 2024 and late 2025.
              Suffredini stepped down as Chief Executive Officer in August 2024, prompting Ghaffarian to serve as
              interim executive until former Chief Revenue Officer Tejpaul Bhatia assumed the CEO role in April 2025.
              Bhatia departed after six months, leading to the October 2025 appointment of Dr. Jonathan Cirtain as CEO
              and President, marking the organization third chief executive in fourteen months. Ghaffarian continues to
              provide governance continuity as Executive Chairman and direct cap-table backer, supported by experienced
              astronaut leadership including Director of Human Spaceflight Peggy Whitson.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.3'
        title: Capital Structure, Funding History, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              Axiom Space has raised more than $1.0 billion in cumulative equity and debt capital since its 2016
              inception, progressing through early seed and convertible rounds to a $130 million Series B in 2021 and a
              $350 million Series C in 2023. In June 2026, the company finalized an oversubscribed financing package
              exceeding $525 million, expanding an initial $350 million debt and equity raise announced in February
              2026. The syndicate was anchored by Type One Ventures and the Qatar Investment Authority, with
              participation from MUFG Bank, 1789 Capital, LuminArx Capital Management, and Hungary 4iG Group. Axiom
              valuation trajectory demonstrates significant volatility: the company achieved a $2.6 billion valuation
              benchmark during its 2023 Series C round, absorbed a down-round valuation of $2.0 billion in March 2025
              amidst severe cash burn, and is estimated by PitchBook to have rebounded above $2.5 billion following the
              2026 financing close. Liquid capital demands remain intense as the business bridges to station deployment.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
              - CO013
      - number: '1.4'
        title: Operational Flight Record, Adverse History, and Orbital Roadmap
        blocks:
          - type: paragraph
            body: >-
              Axiom Space has established a unique operational track record in commercial human spaceflight by
              completing four crewed missions to the International Space Station between 2022 and 2025 aboard SpaceX
              Dragon spacecraft. The company expanded beyond space tourism by securing exclusive commercial docking
              rights to the forward port of the ISS and establishing a sole-active contractor monopoly on NASA xEVAS
              lunar spacesuit contract following Collins Aerospace June 2024 withdrawal. However, operational expansion
              coincided with severe cash-flow pressures in 2024, when the company experienced documented payroll delays,
              late vendor payments to launch partner SpaceX, approximately 100 employee layoffs, and voluntary 20%
              executive and staff pay cuts. To manage technical risk and deorbit timelines, Axiom restructured its
              station architecture to deploy the Payload Power Thermal Module first, establishing an independent
              free-flying orbital platform ahead of scheduled ISS retirement.
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO012
              - CO013
