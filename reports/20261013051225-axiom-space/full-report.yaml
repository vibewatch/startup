  - id: TV002
    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Commercial Station
        - >-
          Exclusive ISS commercial docking rights allow seamless module attachment and customer transition before ISS
          retirement
        - First module launch slipped from 2026 to 2028; competitors Vast and Starlab threaten first-mover advantage
        - >-
          Successful module structure shipment from Thales Alenia and anchor NASA CLD Phase 2 contract award in spring
          2027
      - - Spacesuit Monopoly
        - Sole contractor for Artemis IV lunar suits under $1.26B contract ceiling following Collins Aerospace descope
        - NASA OIG warned suit testing could slip toward 2031; NASA ordered mass reduction into a lighter Sortie Suit
        - Demonstrated qualification testing milestones in 2026-2027 and successful flight demonstration
      - - Institutional Backing
        - Demonstrated access to sovereign capital, securing $350M in Feb 2026 expanding past $525M by June 2026
        - Financing package incorporates debt components following severe late-2024 cash burn and contractor arrears
        - Full visibility into debt covenants, interest burden, and confirmed operational cash runway beyond 2027
      - - Mission Track Record
        - Successfully executed four crewed missions (Ax-1 through Ax-4) carrying 16 astronauts and scientific payloads
        - Private astronaut missions operate at narrow margins or losses due to heavy SpaceX launch and training costs
        - Disclosed positive gross margins per commercial seat or contracted multi-mission sovereign subsidies
    notes: Pillars contrast strategic commercial advantages against disclosed operational and financial headwinds.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Scenario Analysis (2026-2030)
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation / Return Logic
      - Downside Triggers & Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Wins primary NASA CLD Phase 2 award in spring 2027; launches PPTM module in 2028; AxEMU Sortie Suit certified
          on time
        - Enterprise valuation expands to $6.0B-$8.0B upon autonomous orbital station operations and public listing
        - Structural manufacturing delays in Turin or failure to secure anchor CLD Phase 2 funding
        - 25% (requires perfect execution across government and commercial programs)
      - - Base Case
        - Secures shared CLD Phase 2 award; module launch targets late 2028; spacesuit qualification passes in 2027
        - Valuation sustains at $2.5B-$3.5B; high development burn necessitates another large funding round before 2028
        - Multiple compression in private space markets and ongoing debt service obligations
        - 50% (balances proven sovereign support against persistent aerospace schedule slippage)
      - - Bear Case
        - Loses CLD Phase 2 award to Vast or Starlab; AxEMU suit slips past 2028; heavy debt service drains liquidity
        - >-
          Valuation contracts below March 2025 down-round levels (<$1.5B), triggering recapitalization or distressed
          sale
        - Contractor payment disputes re-emerge; sovereign investors decline follow-on junior equity financing
        - 25% (consistent with late-2024 cash crunch and substantial fixed overhead)
    notes: Scenarios model 2026-2030 outcomes based on NASA award selections, assembly timelines, and liquidity requirements.
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV011
      - CV012
