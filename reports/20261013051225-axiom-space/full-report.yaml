              - CE006
      - number: '5.3'
        title: Technical Operating Stack and Hardware Subsystem Integration
        blocks:
          - type: paragraph
            body: >-
              Axiom's technology operating architecture decouples a standardized structural and utility substrate from a
              flexible customer delivery layer. Through an industrial partnership with Thales Alenia Space in Turin,
              Italy, Axiom leverages flight-proven heritage in aluminum-alloy pressurized hulls and micrometeoroid
              debris protection systems. Above the structural shell, the company integrates environmental control and
              life support systems, power conditioning, and common berthing mechanisms. This modular approach allows
              external commercial users and international space agencies to integrate custom research payloads,
              pharmaceutical crystallization racks, and specialized instruments without altering core station flight
              software or primary life support parameters.
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
      - number: '5.4'
        title: Operational Safety, Regulatory Oversight, and Critical Path Dependencies
        blocks:
          - type: paragraph
            body: >-
              Operating human missions to the International Space Station requires rigorous compliance with NASA
              commercial crew safety standards, FAA commercial space transportation licensing, and international
              aerospace quality regimes. Axiom coordinates directly with NASA Johnson Space Center flight directors and
              SpaceX mission controllers to conduct multi-agency flight readiness reviews, emergency evacuation drills,
              and microgravity research certification. Despite demonstrated operational success across multiple orbital
              flights, Axiom faces critical path schedule dependencies. The primary risk centers on timely delivery of
              the Payload, Power, and Thermal Module before 2030, as any manufacturing slippage at European sub-tier
              suppliers could compress the transition window between government station retirement and commercial
              free-flight viability.
            claimRefs:
              - CE005
              - CE006
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Separation of Standardized Substrate and Delivery Layer
            body: >-
              Axiom Space avoids the historical aerospace trap of bespoke design by standardizing core pressure vessels,
              ECLSS life support baselines, and common docking interfaces. Customization is strictly confined to the
              upper delivery layer, allowing sovereign customers to tailor research experiments, national insignia, and
              crew composition without forcing costly engineering changes onto the underlying station bus.
            calloutType: insight
            claimRefs:
              - CE007
              - CE011
          - type: callout
            title: Assembly Restructuring Accelerates Free Flight but Shifts Integration Risk
            body: >-
              Launching the Payload, Power, and Thermal Module first allows Axiom Station to detach as early as 2028
              before the International Space Station retires in 2030. However, this strategy concentrates critical solar
              power generation, active thermal rejection, and orbital propulsion onto the initial module, increasing
              single-point development sensitivity.
            calloutType: risk
            claimRefs:
              - CE001
              - CE009
          - type: callout
            title: Operational Credibility Established Through Four Flown Missions
            body: >-
              By completing four crewed missions to the International Space Station, Axiom has established verified
              operational cadence in commercial crew training, SpaceX launch integration, joint flight operations, and
              on-orbit research management that purely theoretical station competitors cannot match.
            calloutType: strength
            claimRefs:
              - CE003
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Commercial, Sovereign, and Research Buyer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Axiom Space serves a multifaceted customer universe spanning three distinct purchaser profiles: national
              space agencies, private spaceflight participants, and microgravity research institutions. Sovereign
              governments represent the highest strategic and financial value, purchasing dedicated seats for national
              astronauts to achieve human spaceflight prestige without sustaining domestic launch or orbital
              infrastructure. Private participants—historically ultra-high-net-worth individuals—purchase individual
              orbital seats at price points ranging from $55 million to the mid-$60-million range for 10-day orbital
              stays. Meanwhile, institutional research teams and corporate partners utilize Axiom missions to conduct
              life sciences, materials synthesis, and technology demonstrations in microgravity. While these disparate
              segments provide initial mission volume, long-term commercial durability requires converting
              short-duration flight customers into long-duration tenants on Axiom Station.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
