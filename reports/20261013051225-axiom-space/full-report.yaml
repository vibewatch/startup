chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Axiom Space, Inc. is a Houston-based commercial aerospace manufacturer and orbital spaceflight operations
              company founded in 2016. The enterprise operates across human spaceflight services, commercial space
              station development, and next-generation planetary surface spacesuits. The company functions as a prime
              mission integrator rather than a rocket launch provider, procuring commercial launch and capsule
              transportation from SpaceX to conduct private astronaut missions to the International Space Station while
              concurrently fabricating its proprietary Axiom Station modules. Commercial seat pricing for ten-day
              orbital missions has historically cleared between $55 million and $65 million per astronaut, serving
              sovereign governments and private research institutions. Although commercial spaceflight missions generate
              top-line activity, gross margins and recognized GAAP revenue run-rates remain undisclosed private figures.
              Axiom maintains its primary headquarters, engineering integration facilities, and astronaut training
              infrastructure in Houston, Texas.
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO008
              - CO010
              - CO011
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
