companyProfile:
  summary: >-
    Axiom Space is a Houston-based private human-spaceflight and orbital-infrastructure company that combines ISS
    mission integration, commercial station development, and AxEMU spacesuit programs. It has completed four private
    astronaut missions, secured more than $525 million of financing in 2026, and is still working through the capital
    intensity and execution risk of converting that operating proof into a durable free-flying station business.
