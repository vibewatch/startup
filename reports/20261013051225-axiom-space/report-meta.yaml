  topStrengths:
    - Completed private astronaut missions and operating proof in a hard-to-enter orbital niche.
    - A stronger 2026 financing base with sovereign and strategic backers.
    - Broad product scope across missions, station infrastructure, and spacesuits.
  topRisks:
    - Station schedule and capital intensity remain highly execution-sensitive.
    - Private unit economics and debt terms remain opaque.
    - Heavy dependence on NASA, SpaceX, and other partners concentrates delivery risk.
  unresolvedGaps:
    - Recognized revenue, gross margin, and seat or contract-level unit economics.
    - Cap-table seniority, liquidation preferences, and the exact debt schedule from the 2025-2026 financings.
    - Cash runway, burn rate, and backlog-to-cash conversion.
    - Station-module and AxEMU critical-path schedules with current variance-to-plan detail.
    - Signed long-duration station tenants and repeat non-NASA customer durability.
