    approximationNotes: "Likelihood and residual exposure are qualitative analyst assessments based on the cited evidence and explicit evidence gaps; the matrix is not a measured probability model."
    claimRefs: [CR003, CR007, CR012, CR013, CR015]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: The most decision-relevant unknowns are current privacy/security assurance, district renewal and concentration data, and post-acquisition operating performance. Public requirements and workflow evidence establish why these matter, but not whether Newsela currently clears them.
    claimRefs: [CR003, CR010, CR012, CR015]
  - calloutType: assumption
    title: Kill-criteria discipline
    body: Treat a verified material privacy incident, sustained renewal deterioration, or measurable quality/support regression after expansion as thesis-break evidence; do not infer any of these events from the assigned sources alone.
    claimRefs: [CR007, CR012, CR015]
