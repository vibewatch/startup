      - [Professional learning and support, "Training, implementation, account management, and data reviews", Service component, "Included services described; separate fees unavailable", "May improve renewal but dilute margin", "Service revenue, delivery cost, and utilization"]
    notes: "Rows synthesize current official packaging and the 2023 Newsela-authored procurement response; they do not establish recognized revenue, ARR, or product-level margins."
    claimRefs: [CI001, CI002, CI008, CI016]
  - id: TI002
    title: Pricing and monetization
    columns: [Term, Public evidence, Period or unit, What is known, What remains unknown]
    rows:
      - [Sample contract total, "$3.788 million", "10/1/2023-3/31/2025", "One Wayne RESA sample agreement", "Representativeness and product-level allocation"]
      - [Billing, "Upfront in full; net 30", Contract, "Payment timing in sample agreement", "Collection history and deferred-revenue treatment"]
      - [Renewal, "Successive periods at prevailing rates", Contract, "Renewal mechanism in sample agreement", "Renewal probability, uplift, and negotiated discounts"]
      - [Cooperative fee, "2% administrative fee", Actual sales volume, "Fee stated for Wayne RESA/CoPro+", "Applicability outside this channel"]
      - [General pricing, Quote-based, School or district, "Two independent reviews describe institutional quoting", "List price, realized price, discounting, and ACV distribution"]
    notes: "The sample contract is company-issued and contract-specific; it is not a list-price schedule or evidence of company-wide realized pricing."
    claimRefs: [CI002, CI003, CI004, CI005, CI006]
  - id: TI003
    title: Unit economics and capital evidence
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Annual revenue, "$109M in December 2024", "Medium-low; source not recorded", "Directional scale only; not identified as ARR", "Audited revenue and recognition bridge"]
      - [Gross margin, null, Unavailable, "Tests scalability of content and service delivery", "Product-level gross-profit bridge"]
      - [CAC and payback, null, Unavailable, "Tests district-sales efficiency", "CAC by segment and cohort payback"]
      - [GRR and NRR, null, Unavailable, "Tests recurring revenue durability", "Renewal and expansion cohorts"]
      - [Cash and runway, null, Unavailable, "Determines financing dependency", "Cash, burn, debt, covenants, and 18-month forecast"]
      - [Funding total, "$170.3M Latka / $189M EquityZen", Conflicting, "Financing history is not cash available", "Signed financing ledger and cap table"]
      - [Employees, "452 in November 2025", "Medium; LinkedIn attributed by Latka", "Operating-scale proxy, not cost evidence", "Payroll, contractor, and functional headcount schedule"]
      - [Public peer revenue, "$1.03B in 2025; $1.14B 2026 TTM", "Medium; CompaniesMarketCap", "Scale context only; business models differ", "Use public filings, not this comparison, for benchmark margins"]
    notes: "Null means unavailable, not zero. Dollar figures preserve the cited period and source convention; funding is not cash, revenue is not ARR, and Duolingo is contextual rather than directly comparable."
    claimRefs: [CI009, CI010, CI011, CI012, CI014, CI015, CI016]
figures:
