  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Current cash, monthly gross and net burn, debt and credit facilities, covenants, runway, planned uses of funds, and the next financing trigger."
      whyItMatters: "Historical funding raised does not establish cash available or the probability and timing of another financing."
      diligencePath: "Request current management accounts, bank and debt statements, a covenant schedule, an 18-month cash forecast, and the board-approved financing plan."
      relatedQuestionRefs: [QI007]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: "Gross margin by product, CAC, sales cycle, implementation cost, support intensity, payback, GRR, and NRR."
      whyItMatters: "Revenue scale can coexist with weak contribution economics when content, implementation, and customer-success costs rise with deployment."
      diligencePath: "Request product-level P&Ls and customer cohorts showing acquisition cost, implementation effort, gross margin, renewal, and expansion."
      relatedQuestionRefs: [QI009]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: funding
      missingEvidence: "Primary financing records reconciling the $170.3 million and $189 million third-party funding totals."
      whyItMatters: "Different inclusion of debt, secondary transactions, or announced versus closed capital can distort dilution and available-capital analysis."
      diligencePath: "Reconcile the signed financing ledger and cap table by round, security, primary proceeds, secondary proceeds, and debt."
      relatedQuestionRefs: [QI006]
    - type: missing-source
      severity: material
      topic: revenue-quality
      missingEvidence: "Revenue recognition, ARR definition, customer concentration, realized pricing, discounting, GRR, NRR, and renewal cohorts by product."
      whyItMatters: "The reported revenue figure cannot distinguish durable recurring software revenue from concentrated, discounted, or service-intensive revenue."
      diligencePath: "Request audited statements, the revenue-recognition memo, top-customer schedule, contract-level pricing, and bookings-to-revenue cohort bridges."
      relatedQuestionRefs: [QI001, QI002, QI005]
      relatedTableRefs: [TI001, TI002]
