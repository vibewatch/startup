    title: Observed revenue-to-gross-profit workflow
    type: flow
    summary: The public evidence supports an institutional contracting sequence but does not quantify conversion, revenue recognition, or gross profit.
    data:
      nodes:
        - id: district-need
          label: District instructional need
          detail: Literacy, curriculum, assessment, and data workflows
        - id: procurement
          label: Quote and procurement
          detail: Contract-specific price, terms, and channel requirements
        - id: suite-access
          label: Suite access
          detail: Content, scaffolds, assessment, analytics, and curriculum modules
        - id: implementation
          label: Implementation and training
          detail: Rostering, professional learning, support, and data reviews
        - id: subscription-revenue
          label: Subscription revenue
          detail: Recognition, mix, retention, and concentration are not public
        - id: gross-profit
          label: Gross profit
          detail: Content, editorial, infrastructure, and service costs are not quantified
      edges:
        - from: district-need
          to: procurement
        - from: procurement
          to: suite-access
        - from: suite-access
          to: implementation
        - from: implementation
          to: subscription-revenue
        - from: subscription-revenue
          to: gross-profit
    approximationNotes: "This is a qualitative operating sequence, not a conversion funnel or quantified waterfall; no rates, values, or proportional widths are implied."
    claimRefs: [CI001, CI002, CI003, CI007, CI008, CI016]
callouts:
  - calloutType: risk
    title: Reported revenue is not ARR
    body: "The retained source calls the $109 million figure annual revenue, says its source was not recorded, and provides no recurring-revenue definition or recognition schedule."
    claimRefs: [CI009]
  - calloutType: recommendation
    title: Underwrite contracts and cohorts
    body: "Require contract-level realized pricing, concentration, renewal cohorts, product gross margins, cash, debt, and a financing forecast before relying on headline revenue or funding totals."
    claimRefs: [CI005, CI010, CI011, CI016]
