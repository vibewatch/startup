    claimRefs: [CU001, CU006, CU007, CU013]
callouts:
  - calloutType: strength
    title: Named district proof is real but not retention proof
    body: "Norwalk and SFUSD provide concrete deployment and implementation evidence; the missing contract, utilization, and renewal data prevents a stronger durability conclusion."
    claimRefs: [CU006, CU007, CU012]
  - calloutType: risk
    title: Customer quality remains opaque
    body: "Public sources do not disclose GRR, NRR, churn, active usage depth, account concentration, or product-level revenue, leaving expansion and durability unverified."
    claimRefs: [CU012, CU015, CU016]
