    enumerationScope:
      coverage: partial
      basis: "Publicly accessible named customer and reference pages retained in the October 2026 pool"
    columns: [Customer or reference set, Segment, Deployment / use case, Production vs pilot, Outcome or signal, Limitation]
    rows:
      - [Norwalk Public Schools, "Public school district; 11,000 students", "Newsela Science, ELA, Social Studies, and SEL; differentiated curriculum and formative assessment", "Deployment described; production status not independently audited", "Case study says the solution supported engagement, instructional structure, and classroom climate", "Company case-study format; no renewal or measured outcome denominator"]
      - [San Francisco Unified School District, "Public school district", "Newsela assignments, quizzes, write prompts, annotations, and Binder review", "Training and support page; paid production status not quantified", "Official district page documents implementation and training workflow", "No license scope, active usage, contract value, or renewal disclosed"]
      - [Illinois educator community, "District or educator community; exact organization unnamed", "Formative common assessments, shared question library, weekly performance review", "Customer story described; production status not audited", "CIOCoverage reports daily instruction use and district-wide performance review", "Customer is unnamed and source independence is limited"]
      - [FeaturedCustomers reference set, "Customer-reference marketplace", "Case studies and testimonials", "Reference set, not a deployment census", "4.8/5.0 based on 1,946 reference ratings; 23 case studies listed", "Full sample, dates, and selection process are not disclosed"]
    notes: "Enumeration is partial because public customer pages do not provide a complete customer list. Logos or references are not treated as proof of retention or production usage unless the source describes a deployment."
    claimRefs: [CU007, CU009, CU010, CU011]
