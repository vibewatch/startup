      - ["Assessment and teacher insight", "Quizzes, annotations, writing prompts, reporting, and Binder workflows are described across assigned sources", "G2 feedback indicates assessment depth can be a weakness versus ReadWorks in one use case", medium]
      - ["Distribution and rostering", "Google Classroom add-on supports SSO, roster sync, links, grading, and feedback", "Integration reduces setup friction but also makes workflow platforms a potential control point", high]
      - ["Procurement and implementation", "LTC describes a purchasing-program contract, building-scaled discounts, and professional learning", "District budget cycles and implementation support can favor vendors with procurement infrastructure", medium]
      - ["Trust and content posture", "Sources describe authentic content from named publishers and standards alignment", "The assigned pool does not provide a comparable independent content-quality benchmark", low]
    notes: "Comparison records documented capabilities and explicit unknowns; it does not imply feature parity or an apples-to-apples product test."
    claimRefs: [CP002, CP005, CP006, CP008]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offering or alternative, Price / unit / contract model, Included capability evidence, Discount or unknown, Underwriting implication]
    rows:
      - [Newsela, "District or school purchasing program; public list price not found in assigned sources", "Differentiated content, assessments, reporting, integrations", "LTC describes scaled discounts by participating buildings", "Realized price, gross margin, and renewal economics require diligence"]
      - [Newsela Pro, "Quote-based school or district pricing described by an independent teacher guide", "Paid tier described as including broader differentiation and assessment features", "Exact quote and contract terms are unknown", "Price sensitivity and packaging remain unverified"]
      - [ReadWorks, "Unknown in assigned pool", "Assessment comparison appears only in one G2 review", "Current price and scope unknown", "Do not infer a cost advantage without current pricing evidence"]
      - ["Google Classroom plus linked content", "Google Classroom pricing for this use case not established", "Workflow integration and grading path are documented", "Newsela content subscription remains separate or unspecified", "Potential multi-vendor stack can increase procurement complexity"]
      - ["Core curriculum incumbents", "Unknown in assigned pool", "Freedonia names the category and vendors", "Contract pricing and bundle terms unknown", "Incumbent bundle power cannot be quantified from this pool"]
    notes: "Pricing coverage is partial: assigned sources provide packaging descriptions but no comparable realized prices, discounts, or contract lengths across alternatives."
    enumerationScope:
      coverage: partial
      basis: "Publicly visible packaging and procurement descriptions in the assigned pool; no private bids, contracts, or current quote sheets were available."
    claimRefs: [CP008, CP011, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Newsela is positioned on documented differentiation and workflow integration; alternative coordinates are ordinal heuristics where the assigned evidence is incomplete.
    data:
      xAxis: "Differentiated content and assessment breadth (ordinal 1-5)"
      yAxis: "Workflow and distribution integration (ordinal 1-5)"
      points:
        - {label: Newsela, x: 5, y: 4, note: "Five reading levels, integrated assessments, reporting, and classroom integrations are documented"}
        - {label: "Google Classroom plus linked content", x: 2, y: 5, note: "Workflow and roster integration are documented; equivalent leveled-content breadth is not"}
        - {label: ReadWorks, x: 3, y: 2, note: "One G2 reviewer preferred ReadWorks for assessment; current breadth and integrations are unknown"}
        - {label: "Core curriculum incumbents", x: 4, y: 4, note: "Named in the reading-market competitive landscape; product-level coordinates are not directly measured"}
        - {label: "Teacher-created / OER", x: 2, y: 1, note: "Can be locally tailored but no common workflow or assessment layer is evidenced"}
        - {label: "Newsela Learning Suite", x: 5, y: 4, note: "Current official materials describe cross-curricular content and writing practice; price and outcomes remain unknown"}
    claimRefs: [CP002, CP005, CP006, CP009, CP010]
callouts:
  - calloutType: strength
    title: Differentiation is the clearest wedge
    body: Newsela's combination of shared topics and multiple reading levels is repeatedly documented, while the assigned evidence does not show a comparable current feature-level benchmark for alternatives.
    claimRefs: [CP001, CP002]
  - calloutType: risk
    title: Workflow advantage can become stack dependence
    body: Google Classroom and district rostering integrations reduce adoption friction, but they also leave Newsela dependent on adjacent workflow control points and undisclosed renewal economics.
    claimRefs: [CP006, CP012]
  - calloutType: assumption
    title: Pricing remains an underwriting gap
    body: Public packaging evidence is insufficient to determine whether Newsela wins on total cost of ownership, realized price, or implementation burden.
    claimRefs: [CP008, CP011]
