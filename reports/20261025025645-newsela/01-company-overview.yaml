callouts:
  - calloutType: strength
    title: Differentiated content is the durable starting point
    body: >-
      The strongest public evidence is the repeated product mechanism: authentic
      content is offered at multiple reading levels and paired with instructional
      workflows, giving Newsela a coherent wedge into district adoption.
    claimRefs: [CO001, CO002, CO003]
  - calloutType: risk
    title: Current private-company visibility is limited
    body: >-
      The assigned evidence does not establish current ARR, active paid seats,
      profitability, cap-table terms, board composition, or a current priced valuation.
      Historical financing and reach claims should not be used as substitutes.
    claimRefs: [CO010, CO013, CO014]
  - calloutType: insight
    title: Expansion increases both scope and integration burden
    body: >-
      Formative, Generation Genius, Schoolytics, and EveryDay Labs extend Newsela
      across assessment, STEM, analytics, and attendance; the strategic logic is
      visible, but acquisition economics and integration outcomes remain unreported.
    claimRefs: [CO012, CO016]
