company:
  name: Newsela
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Newsela is a privately held K-12 instructional-content and assessment company
    launched in 2013 by Matthew Gross and Dan Cogan-Drew, although EquityZen lists
    2012 as its founding year. Public evidence supports a
    differentiated-content platform that has expanded into assessment, analytics,
    attendance, and STEM through acquisitions, while current audited financials,
    cap-table detail, and several operating metrics remain undisclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and operating model
    body: >-
      Newsela began in 2013 around a simple classroom problem: make the same subject
      accessible at different reading levels without separating students from the
      shared discussion. YesPress describes Matthew Gross and Dan Cogan-Drew as the
      founders and says the product grew from roughly 100 prepared articles to more
      than 18,000 differentiated fiction and nonfiction pieces. The platform combines
      leveled content with standards mapping, assignments, annotations, quizzes, and
      reporting. EquityZen instead lists a 2012 founding year; without an incorporation
      record, 2013 is best treated as the supported launch year rather than an
      undisputed legal founding date. A current Newsela Help Center page says the legacy Blended Learning
      Suite was retired in 2025 and existing subscribers should transition to the
      newer Learning Suite. The commercial model is institution-led: public reporting
      describes paid products at $6-$14 per student in 2021, while a teacher-focused
      guide says current pricing is quote-based at school or district level. These
      observations support a district SaaS model, but not a current price or revenue
      estimate.
    claimRefs: [CO001, CO002, CO003, CO004, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      The founding team is linked to the product's instructional premise: YesPress
      identifies Matthew Gross and Dan Cogan-Drew, describing Gross's experience as a
      parent of a struggling reader and Cogan-Drew's classroom and Navy background.
      The public record also shows a leadership transition: YesPress says Pep Carrera
      now leads Newsela while Gross is described as co-founder and former CEO. EquityZen
      lists Pep Carrera as CEO and Severine Armand Vieux as CFO, but the source is a
      private-market listing rather than a filing or audited governance disclosure.
      No assigned source provides a complete board roster, control rights, option-pool
      structure, or formal key-person plan. The reasonable diligence conclusion is
      that founder history remains strategically relevant, while governance depth and
      succession resilience are not fully observable from the current public record.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-scale-and-milestones
    title: Financing, scale, and milestone record
    body: >-
      Newsela's last clearly priced financing in the assigned evidence is its
      February 2021 Series D: TechCrunch and the company-syndicated release report
      $100 million led by Franklin Templeton and TCV, with a $1 billion valuation.
      The same reporting describes 2020 ARR growth of 81% and bookings growth of 115%,
      but these are historical company estimates and cannot be treated as current
      revenue, ARR, or cash generation. HolonIQ's May 2026 update says Newsela was
      removed from its unicorn list in January 2024 as lapsed because more than 24
      months had passed since its last priced round and implied valuation had fallen
      below $1 billion by its methodology. Newsela subsequently expanded through
      Formative, Generation Genius, Schoolytics, and EveryDay Labs, but acquisition
      consideration and post-acquisition operating metrics are not disclosed in the
      assigned sources. The milestone record therefore supports strategic expansion,
      not a current valuation conclusion.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
