evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Current ARR, revenue, gross margin, cash balance, burn, runway, active paid seats, and renewal metrics.
    whyItMatters: Historical growth and registered reach do not establish present scale, efficiency, or financial durability.
    diligencePath: >-
      Request a current management KPI pack, audited or reviewed financial statements, cohort retention, and customer
      concentration schedule.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete board roster, cap table, liquidation preferences, debt, option pool, and recent secondary transactions.
    whyItMatters: Investor outcomes and key-person dependence cannot be assessed from financing announcements alone.
    diligencePath: Obtain the latest capitalization table, charter, investor-rights agreements, debt schedule, and board materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: A post-2021 priced financing, independent secondary mark, or other current valuation reference.
    whyItMatters: The 2021 unicorn valuation and HolonIQ's later lapsed classification point in different directions over time.
    diligencePath: >-
      Request the latest 409A, preferred-share financing terms, secondary transaction evidence, or board-approved
      valuation work.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A complete dated chronology of product launches, acquisitions, leadership changes, regulatory events, and
      partnerships.
    whyItMatters: The timeline is assembled from public snippets and may omit material operating or governance events.
    diligencePath: Reconcile company newsroom, corporate filings, acquisition agreements, and board-approved milestone records.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current third-party estimate of paid U.S. K-12 instructional-content and formative-assessment software spend,
      segmented by district, school, and product category.
    whyItMatters: >-
      Without a comparable spend denominator, Newsela reach claims cannot be translated into TAM, SAM, SOM, or market
      share.
    diligencePath: >-
      Obtain current analyst, procurement, or public-budget datasets and reconcile geography, buyer, product scope, and
      fiscal period.
    relatedQuestionRefs:
      - QM002
      - QM006
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: paid-penetration
    missingEvidence: >-
      Paid districts, active users, renewal rates, seat expansion, average contract value, and revenue concentration by
      buyer segment.
    whyItMatters: Public reach figures are not evidence of paid penetration or recurring budget quality.
    diligencePath: Request cohort-level ARR, GRR/NRR, usage, contract, and renewal data under NDA.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: historical-reach
    missingEvidence: A current, independently verifiable update to the historical 2017 reach and country figures.
    whyItMatters: Historical platform descriptions may overstate current adoption or fail to reflect product and budget changes.
    diligencePath: >-
      Validate current active districts, students, teachers, countries, and paid-versus-free usage directly with Newsela
      and procurement records.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      Independent reconciliation of the $190.3 billion relief backdrop with district-level recurring edtech budgets
      relevant to Newsela.
    whyItMatters: Relief totals are not equivalent to available software spend and may distort top-down sizing.
    diligencePath: >-
      Compare state and district budget documents with procurement awards and renewal notices for curriculum and
      assessment tools.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current comparable Newsela and competitor list prices, realized discounts, contract lengths, renewal rates, and
      implementation fees.
    whyItMatters: >-
      Price and retention determine whether differentiated content and workflow integration translate into durable
      economic advantage.
    diligencePath: >-
      Request current district quote sheets, anonymized order forms, renewal cohorts, and implementation statements of
      work.
