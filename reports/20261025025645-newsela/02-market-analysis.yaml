    approximationNotes: "The layers are ordered evidence lenses, not proportional values or conversion stages; unlike units, populations, and periods must not be combined."
    claimRefs: [CM005, CM011, CM013]
callouts:
  - calloutType: insight
    title: Budget durability is the gating variable
    body: The opportunity is structurally meaningful, but the 2026 evidence points to a shift from temporary relief dollars toward recurring district and state budgets; renewal proof matters more than a broad reach claim.
    claimRefs: [CM011, CM012, CM013, CM014]
  - calloutType: risk
    title: Public data does not isolate paid market share
    body: Newsela's reported reach, funding context, and product scope do not establish paid penetration, active usage, renewal quality, or a defensible SAM/SOM; those remain material diligence gaps.
    claimRefs: [CM005, CM011, CM013]
