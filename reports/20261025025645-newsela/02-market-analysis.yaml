    notes: "Values are not additive and do not form a TAM/SAM/SOM funnel; they are separate reach, funding, and policy lenses with different populations, units, and dates."
    claimRefs: [CM005, CM011, CM013, CM014]
  - id: TM003
    title: Buyer, payer, user, and adoption map
    columns: [Segment, Buyer, Daily user, Payer / budget owner, Adoption trigger, Primary constraint]
    rows:
      - [District curriculum team, "Curriculum director or chief academic officer", Teacher and student, "District curriculum budget", "Need aligned differentiated content at scale", "Renewal evidence and implementation load"]
      - [School or grade-band team, "Principal or instructional coach", Teacher and student, "School or site budget", "Immediate classroom differentiation need", "Training and local champion dependence"]
      - [District assessment and data team, "Assessment or data leader", "Administrators and educators", "District technology or data budget", "Need cross-system trend visibility", "Integration, privacy, and data governance"]
      - [State or consortium program, "State education agency or consortium buyer", "Districts and schools", "State program or grant funds", "State literacy or digital-learning initiative", "Grant expiration and procurement cycle"]
    notes: "Buyer roles are an evidence-backed operating map, not a disclosed Newsela segmentation or contract mix; public sources do not quantify revenue by segment."
    claimRefs: [CM007, CM008, CM011, CM013, CM015]
