      - [Pandemic funding backdrop, "Civic IQ; July 21, 2026", "United States K-12", "$190.3B across three relief packages", "Policy and board-agenda synthesis", "Medium", "Relief funding is not recurring addressable spend"]
      - [Durable funding capacity, "Benton summary of SETDA; September 10, 2025", "U.S. states", "6% reported durable ongoing-edtech funding plans vs 27% in 2024", "Survey summary", "Medium", "Respondent share is not district expenditure"]
