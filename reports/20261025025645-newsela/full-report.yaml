              - CP004
              - CP009
              - CP010
              - CP013
      - number: '3.2'
        title: Differentiation, workflow, and distribution
        blocks:
          - type: paragraph
            body: >-
              Newsela's strongest documented buying advantages are the ability to keep a shared topic while varying
              reading difficulty and the ability to connect content to assessment and teacher review. G2 user evidence
              describes level adjustment and current-event discovery as useful, while also calling the quiz feature
              limited. District and partner surfaces show that procurement and distribution can run through purchasing
              contracts, Google Classroom roster synchronization, and assignment/grading workflows. These are meaningful
              switching-cost levers because a district adopting Newsela may be buying content, implementation routines,
              and data workflows together. They are not proof of exclusive distribution or renewal power.
            claimRefs:
              - CP005
              - CP006
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
