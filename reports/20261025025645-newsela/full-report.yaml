  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              The relevant market is paid K-12 instructional content and adjacent formative-assessment workflow software
              used by teachers, schools, and districts. It includes differentiated nonfiction and curriculum-aligned
              resources, embedded assignments and assessment, teacher analytics, and district-level data workflows; it
              excludes general consumer reading, standalone learning-management systems, student-information systems,
              and broad connectivity or device spend. Newsela's product description supports this narrower boundary:
              content is adapted across five reading levels, assessments are embedded, and the platform spans ELA,
              social studies, science, and SEL. The buyer is usually a district or school administrator, while teachers
              and students are the daily users and curriculum, assessment, and technology leaders influence renewal.
              This creates a multi-stakeholder sale in which instructional relevance and implementation simplicity must
              coexist with procurement, privacy, rostering, and data-governance requirements.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM013
              - CM015
      - number: '2.2'
        title: Sizing lenses and budget durability
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not isolate Newsela's SAM or SOM, and the available sources do not provide a
              comparable top-down market total for this exact product boundary. The evidence-constrained sizing case is
              therefore a set of lenses rather than a single TAM: platform capability and reach establish the
              addressable workflow, district procurement establishes a paid route to market, and budget evidence
              determines conversion and renewal quality. EquityZen reproduces Newsela's claims of 90% of U.S. schools,
              37 million students, and more than 2.5 million teachers, but those figures are company claims rather than
              independently audited market share. The stronger market signal is budget durability. Civic IQ describes
              roughly $190.3 billion of pandemic relief expiring into 2025-26 and 2026-27 budgets, while the SETDA
              reporting summarized by Benton says only 6% of respondents had durable funding plans for ongoing edtech
              work, down from 27% in 2024. This supports meaningful demand but argues against treating pandemic-era
              spend as recurring market capacity.
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM011
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM011
              - CM013
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is helped by a clear classroom problem: one topic can be assigned at different reading levels
              with embedded checks for understanding, and a district can extend the workflow toward cross-system data
              analysis through Schoolytics. Newsela's March 2026 Learning Suite documentation also shows product
              packaging is still changing, including retirement of the legacy Blended Learning Suite in 2025 and
              migration guidance for existing subscribers. That can create expansion potential, but it also raises
              switching, training, and renewal questions. The main constraints are district budget cycles, procurement
              and privacy review, the risk that low-usage or duplicative tools are cut, and the absence of public
              evidence that the broad reach claims translate into paid, active, renewing accounts. The valuation
              implication is a wide outcome range: workflow integration and durable curriculum placement could support
              retention, while temporary relief-funded demand, product transition friction, or weak usage would compress
              the multiple.
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM010
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate market boundary, sizing context, and buyer workflow because the underlying evidence
              uses different populations, units, geographies, and time bases. The reach claims are not treated as paid
              market share, the relief total is not treated as recurring software spend, and the survey percentage is
              not treated as a conversion rate. This structure preserves uncertainty while still showing how product
              fit, budget durability, and procurement ownership interact in the adoption case.
            claimRefs:
              - CM005
              - CM011
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Budget durability is the gating variable
            body: >-
              The opportunity is structurally meaningful, but the 2026 evidence points to a shift from temporary relief
              dollars toward recurring district and state budgets; renewal proof matters more than a broad reach claim.
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: callout
            title: Public data does not isolate paid market share
            body: >-
              Newsela's reported reach, funding context, and product scope do not establish paid penetration, active
              usage, renewal quality, or a defensible SAM/SOM; those remain material diligence gaps.
            calloutType: risk
            claimRefs:
              - CM005
              - CM011
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Newsela competes for the job of helping schools deliver differentiated reading and content-rich
              instruction, not only for a standalone article library. Its public surfaces describe five reading levels,
              integrated quizzes, annotations, writing prompts, reporting, and content across ELA, science, social
              studies, and SEL. A district can instead use a free or lower-cost supplemental library, a general
              learning-management workflow with linked content, a core-curriculum incumbent, or internal teacher-created
              materials. The evidence therefore supports a landscape of direct differentiated-reading tools, adjacent
              classroom workflow platforms, incumbent curriculum suites, and status-quo substitutes; it does not support
              assuming that every named alternative offers equivalent product scope.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
