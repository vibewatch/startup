              - CP005
              - CP006
              - CP009
              - CP010
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is conditional rather than absolute. Newsela has evidence of breadth, differentiated content, and
              workflow integration, but users can substitute general classroom systems, free content libraries, core
              curriculum suites, or teacher-built materials. A teacher review explicitly identifies ReadWorks as
              stronger for assessment in one use case, and the current product materials show that the company is
              expanding its suite rather than defending a single narrow feature. District procurement pressure is also
              moving toward integrated reading systems with implementation support, assessment connections, and
              actionable data. The public record does not disclose comparable contract prices, retention, win rates, or
              feature-level competitor benchmarks, so durability remains an evidence gap.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is the clearest wedge
            body: >-
              Newsela's combination of shared topics and multiple reading levels is repeatedly documented, while the
              assigned evidence does not show a comparable current feature-level benchmark for alternatives.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Workflow advantage can become stack dependence
            body: >-
              Google Classroom and district rostering integrations reduce adoption friction, but they also leave Newsela
              dependent on adjacent workflow control points and undisclosed renewal economics.
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
          - type: callout
            title: Pricing remains an underwriting gap
            body: >-
              Public packaging evidence is insufficient to determine whether Newsela wins on total cost of ownership,
