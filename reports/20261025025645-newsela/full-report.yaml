chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Newsela began in 2013 around a simple classroom problem: make the same subject accessible at different
              reading levels without separating students from the shared discussion. YesPress describes Matthew Gross
              and Dan Cogan-Drew as the founders and says the product grew from roughly 100 prepared articles to more
              than 18,000 differentiated fiction and nonfiction pieces. The platform combines leveled content with
              standards mapping, assignments, annotations, quizzes, and reporting. EquityZen instead lists a 2012
              founding year; without an incorporation record, 2013 is best treated as the supported launch year rather
              than an undisputed legal founding date. A current Newsela Help Center page says the legacy Blended
              Learning Suite was retired in 2025 and existing subscribers should transition to the newer Learning Suite.
              The commercial model is institution-led: public reporting describes paid products at $6-$14 per student in
              2021, while a teacher-focused guide says current pricing is quote-based at school or district level. These
              observations support a district SaaS model, but not a current price or revenue estimate.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
