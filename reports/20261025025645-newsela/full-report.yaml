      - number: '4.1'
        title: Revenue model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Newsela monetizes instructional content, assessment, analytics, and support through school and district
              procurement rather than transparent self-serve pricing. Its current Help Center describes a Learning Suite
              and says the legacy Blended Learning Suite was retired in 2025, while a 2023 Wayne RESA proposal shows how
              content, curriculum complements, Formative, professional learning, and customer success can be bundled
              into a larger institutional contract. The evidence supports a recurring subscription shape, but not a
              revenue-recognition conclusion: no retained source defines ARR, separates software from services,
              discloses product mix, or reports renewal cohorts. Revenue quality therefore depends on private contract
              and cohort data rather than the breadth of the public product catalog.
