  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Newsela's core workflow starts with content discovery and assignment, then connects differentiated reading
              to assessment and teacher review. The HundredED description says articles are offered in five reading
              levels and pair with quizzes, annotations, and writing prompts; SFUSD training materials independently
              describe assignments, formative assessment, and review of student work in the Binder. This creates a
              coherent teacher loop: select a standards-relevant text, assign a level and activity, inspect responses,
              and adjust instruction. The product is therefore more than a content library, but the public evidence does
              not quantify completion rates, latency, or the share of assignments using each activity. Newsela also
              supports offline and print use according to HundredED, which broadens deployment options but makes actual
              digital usage harder to infer from public descriptions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE010
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
