              - CE007
              - CE008
              - CE009
              - CE016
      - number: '5.2'
        title: Suite expansion and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The product surface is expanding from differentiated instructional content toward a connected district
              data and intervention suite. Newsela's March 2026 announcement describes EveryDay Labs joining Schoolytics
              and positions the combined portfolio across instruction, assessment, attendance, and MTSS. The same
              announcement says the companies planned to integrate the products soon, which is a roadmap statement
              rather than proof of completed technical integration. The Formative acquisition supplied a second
              expansion vector: Education Week Market Brief reported that Newsela intended to weave Formative assessment
              and data analysis into its content, while noting that deal terms were undisclosed. Public integration
              listings show SSO, roster synchronization, and assignment/grading workflows through Google Classroom,
              Clever, and Canvas, but do not disclose API limits, tenant isolation, deployment effort, or service-level
              performance.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
