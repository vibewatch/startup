  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Newsela progressed from leveled content to a broader instruction, assessment, analytics, and attendance platform,
      with the last assigned priced financing in 2021.
    data:
      items:
        - date: '2013'
