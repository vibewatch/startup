  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Product utility and district evidence support continued tracking, while stale price discovery and private-company
      gaps prevent a fresh buy.
    data:
      nodes:
        - id: scale
          label: District and platform utility
          detail: Formative, Learning Suite, and SFUSD evidence
        - id: proof
          label: Operating proof
          detail: $109M reported 2024 revenue; source not recorded
        - id: price
          label: Price visibility
          detail: $1B Series D reference from February 2021
        - id: risks
          label: Downside checks
          detail: Retention, substitution, implementation, concentration
        - id: decision
          label: Recommendation
          detail: Track / research-more
        - id: diligence
          label: Diligence gate
          detail: Current cap table, retention, and module economics
      edges:
        - from: scale
          to: proof
        - from: proof
          to: price
        - from: price
          to: risks
        - from: risks
          to: decision
        - from: decision
          to: diligence
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV011
      - CV014
