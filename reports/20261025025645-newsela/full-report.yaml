        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The founding team is linked to the product's instructional premise: YesPress identifies Matthew Gross and
              Dan Cogan-Drew, describing Gross's experience as a parent of a struggling reader and Cogan-Drew's
              classroom and Navy background. The public record also shows a leadership transition: YesPress says Pep
              Carrera now leads Newsela while Gross is described as co-founder and former CEO. EquityZen lists Pep
              Carrera as CEO and Severine Armand Vieux as CFO, but the source is a private-market listing rather than a
              filing or audited governance disclosure. No assigned source provides a complete board roster, control
              rights, option-pool structure, or formal key-person plan. The reasonable diligence conclusion is that
              founder history remains strategically relevant, while governance depth and succession resilience are not
              fully observable from the current public record.
