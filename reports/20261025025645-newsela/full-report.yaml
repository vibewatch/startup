  - id: FM001
    title: Market sizing lenses rather than a comparable TAM funnel
    type: pyramid
    summary: >-
      Separate evidence lenses show reach and funding context without implying that unlike populations convert into a
      single market total.
    data:
      nodes:
        - label: Broad product reach claim
          value: 90% of U.S. schools
          note: Company claim reproduced by EquityZen; not audited
        - label: Learner reach claim
          value: 37 million students
          note: Company claim reproduced by EquityZen; not audited
        - label: Teacher reach claim
          value: '>2.5 million teachers'
          note: Company claim reproduced by EquityZen; not audited
        - label: Pandemic funding context
          value: $190.3B
          note: Three U.S. relief packages; not recurring Newsela market spend
        - label: Durable funding plans
          value: 6%
          note: SETDA survey summary for ongoing edtech work
        - label: Unisolated SAM/SOM
          value: Not disclosed
          note: No public source isolates comparable Newsela market spend
    approximationNotes: >-
      The layers are ordered evidence lenses, not proportional values or conversion stages; unlike units, populations,
      and periods must not be combined.
    claimRefs:
      - CM005
      - CM011
      - CM013
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Newsela is positioned on documented differentiation and workflow integration; alternative coordinates are ordinal
      heuristics where the assigned evidence is incomplete.
    data:
      xAxis: Differentiated content and assessment breadth (ordinal 1-5)
      yAxis: Workflow and distribution integration (ordinal 1-5)
      points:
        - label: Newsela
          x: 5
          'y': 4
          note: Five reading levels, integrated assessments, reporting, and classroom integrations are documented
        - label: Google Classroom plus linked content
          x: 2
          'y': 5
          note: Workflow and roster integration are documented; equivalent leveled-content breadth is not
        - label: ReadWorks
          x: 3
          'y': 2
          note: One G2 reviewer preferred ReadWorks for assessment; current breadth and integrations are unknown
        - label: Core curriculum incumbents
          x: 4
          'y': 4
          note: Named in the reading-market competitive landscape; product-level coordinates are not directly measured
        - label: Teacher-created / OER
          x: 2
          'y': 1
          note: Can be locally tailored but no common workflow or assessment layer is evidenced
        - label: Newsela Learning Suite
          x: 5
          'y': 4
          note: >-
            Current official materials describe cross-curricular content and writing practice; price and outcomes remain
            unknown
    claimRefs:
      - CP002
      - CP005
      - CP006
      - CP009
      - CP010
  - id: FI001
    title: Observed revenue-to-gross-profit workflow
    type: flow
    summary: >-
      The public evidence supports an institutional contracting sequence but does not quantify conversion, revenue
      recognition, or gross profit.
    data:
      nodes:
        - id: district-need
          label: District instructional need
          detail: Literacy, curriculum, assessment, and data workflows
        - id: procurement
          label: Quote and procurement
          detail: Contract-specific price, terms, and channel requirements
        - id: suite-access
          label: Suite access
          detail: Content, scaffolds, assessment, analytics, and curriculum modules
        - id: implementation
          label: Implementation and training
          detail: Rostering, professional learning, support, and data reviews
        - id: subscription-revenue
          label: Subscription revenue
          detail: Recognition, mix, retention, and concentration are not public
        - id: gross-profit
          label: Gross profit
          detail: Content, editorial, infrastructure, and service costs are not quantified
      edges:
        - from: district-need
          to: procurement
        - from: procurement
          to: suite-access
        - from: suite-access
          to: implementation
        - from: implementation
          to: subscription-revenue
        - from: subscription-revenue
          to: gross-profit
    approximationNotes: >-
      This is a qualitative operating sequence, not a conversion funnel or quantified waterfall; no rates, values, or
      proportional widths are implied.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI008
      - CI016
  - id: FE001
    title: Newsela product architecture map
    type: stack
    summary: >-
      Newsela's public product surface layers content and differentiation with assessment, integrations, and district
      intervention products.
    data:
      layers:
        - label: Content and curriculum
          detail: Product content and curriculum assets used as the instructional foundation.
          items:
            - label: Leveled articles
              detail: Same topic offered at multiple reading levels for differentiated instruction.
            - label: Learning Suite
              detail: >-
                Curriculum complements, novel and book studies, and decodable texts are described in the official Help
                Center.
        - label: Learning workflow
          detail: Classroom actions that connect content to assessment and teacher review.
          items:
            - label: Assignments
              detail: Teachers select content, reading level, activities, and due dates.
            - label: Embedded assessment
              detail: Quizzes, annotations, and writing prompts connect activity to instructional review.
        - label: Identity and integrations
          detail: Account provisioning and learning-management-system connections.
          items:
            - label: Rostering and SSO
              detail: Public listings describe Clever, Google Classroom, and Canvas workflows.
            - label: Teacher and district analytics
              detail: Binder and integrated grading/feedback surfaces support review of student work.
        - label: District intervention
          detail: District-level data and intervention products extending beyond core reading.
          items:
            - label: Schoolytics
              detail: Positioned as a district data and actionable-insight platform.
            - label: EveryDay Labs
              detail: Attendance and behavioral-science tools announced for integration into Schoolytics.
        - label: Governance and operations
          detail: Privacy, compliance, reliability, and support controls required for district deployment.
          items:
            - label: Privacy and compliance
              detail: District deployments must operate within COPPA and FERPA obligations.
            - label: Reliability and support
              detail: Public sources do not disclose uptime, incident, or support-performance metrics.
        - label: Technical diligence
          detail: Operating evidence required to validate the connected-suite thesis.
          items:
            - label: Architecture and data flows
              detail: Obtain diagrams and migration evidence across acquired products.
            - label: Service performance
              detail: Obtain uptime, incident, integration, and support metrics.
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The observable customer path moves from district approval and provisioning through teacher workflow adoption,
      student activity, and potential multi-product expansion.
    data:
      nodes:
        - id: district-procurement
          label: District or school approval
          touchpoints:
            - SFUSD implementation and training surface
            - Quote-based school or district pricing is reported by an educator guide
        - id: implementation
          label: Rostering and teacher setup
          touchpoints:
            - HundrED describes teacher registration, class creation, and student assignment
            - SFUSD lists training and support materials
        - id: classroom-use
          label: Differentiated content and assessment
          touchpoints:
            - Leveled articles, quizzes, annotations, and writing prompts
            - Norwalk case study describes cross-subject deployment
        - id: student-signal
          label: Student activity and teacher feedback
          touchpoints:
            - Weekly quiz monitoring and Binder review
            - Formative announcement describes real-time data for instructional decisions
        - id: expansion
          label: Multi-product or suite expansion
          touchpoints:
            - Formative acquisition joins content and assessment
            - Learning Suite transition follows retirement of the legacy Blended Learning Suite
        - id: renewal-diligence
          label: Renewal and expansion diligence
          touchpoints:
            - GRR, NRR, churn, contract length, and account concentration are not publicly disclosed
            - Management cohort data is required to verify durability
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU013
