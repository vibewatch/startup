companyProfile:
  summary: >-
    Newsela is a private K-12 instructional-content and assessment company founded by Matthew Gross and Dan Cogan-Drew.
    Its core product adapts shared content to multiple reading levels and pairs it with quizzes, writing, annotations,
    reporting, and district workflow integrations. The company has expanded through Formative, Generation Genius,
    Schoolytics, and EveryDay Labs, but the public record does not establish current paid-seat scale, retention,
    profitability, or valuation.
