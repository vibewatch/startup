      - ["Binder and teacher insights", "Teachers and administrators", "Core workflow", "Review of student work and progress in the platform", "Validate analytics latency, export, and role-based access"]
      - ["Learning Suite collections", "District curriculum leaders and teachers", "Current suite described by official Help Center", "Curriculum complements, novel studies, and decodable texts", "Verify adoption and migration from legacy Blended Learning Suite"]
      - ["Formative capabilities", "Teachers and districts", "Acquired/expanding", "Broadens assessment types and real-time feedback", "Confirm integration completion and product overlap"]
      - ["Schoolytics and EveryDay Labs", "District leaders and support teams", "Integration announced/planned", "Extends from academics into attendance, early warning, and MTSS", "Obtain product integration roadmap and live-customer proof"]
    notes: Public company, customer, and partner descriptions; maturity labels are evidence-based but public sources do not provide operating KPIs or independent technical verification.
    claimRefs: [CE001, CE005, CE006, CE010, CE015]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Newsela solution, Measurable benefit, Limitation or diligence ask]
    rows:
      - ["Assign accessible reading", "Select an article and level for a class or student", "Five-level differentiated articles and assignment controls", "One topic can support mixed reading levels", "Validate level-selection accuracy and learning outcomes"]
      - ["Check comprehension", "Students complete an embedded quiz", "Quiz results are visible in teacher workflows", "Faster feedback than separate worksheets", "Obtain item-level validity and response-time data"]
      - ["Support close reading", "Students annotate assigned text", "Annotations are reviewed in the Binder", "Makes written responses part of the workflow", "Confirm retention, visibility, and export controls"]
      - ["Roster a district", "District provisions accounts through an LMS or rostering service", "SSO and roster sync are listed for Clever, Google Classroom, and Canvas", "Reduces manual account setup", "Confirm sync error handling and identity matching"]
      - ["Extend intervention", "District combines academic and attendance signals", "Schoolytics and EveryDay Labs are positioned as a connected suite", "Potentially unifies intervention context", "Integration and efficacy remain to be demonstrated"]
    notes: Workflow descriptions are drawn from SFUSD, official/partner integration listings, and product descriptions; measurable benefits are stated as workflow implications, not independently measured outcomes.
    claimRefs: [CE002, CE003, CE007, CE008, CE009, CE016]
  - id: TE003
    title: Technology and operating architecture table
    columns: [Layer or process, Role, Dependency, Risk, Evidence status]
    rows:
      - ["Content layer", "Curated and standards-aligned articles", "Publisher/content relationships and editorial operations", "Licensing breadth, refresh cadence, and source provenance", "Public descriptions support function; controls undisclosed"]
      - ["Differentiation layer", "Multiple reading levels and adaptive assignment choices", "Leveling methodology and student performance history", "Quality or bias in level assignment", "Public descriptions support feature; methodology undisclosed"]
      - ["Assessment layer", "Quizzes, annotations, writing prompts, and real-time feedback", "Item bank, scoring, and teacher workflow", "Assessment validity and data retention", "Feature evidence exists; operating metrics unavailable"]
      - ["Identity and integration layer", "SSO, roster sync, LMS and classroom workflows", "Clever, Google Classroom, Canvas, and district systems", "Sync failures and permission drift", "Partner listings confirm integrations; SLAs undisclosed"]
      - ["Analytics and intervention layer", "Student progress, attendance, and MTSS signals", "Schoolytics, EveryDay Labs, and acquired data models", "Data unification and governance across products", "Acquisition announcement supports direction; completion unverified"]
      - ["Governance layer", "Privacy, consent, access, and security controls", "District contracts and applicable COPPA/FERPA obligations", "Regulatory exposure and configuration errors", "Regulatory requirements are clear; Newsela controls not fully public"]
    notes: Architecture is a diligence model assembled from disclosed product functions and integration surfaces; it is not a verified internal system diagram and should not be read as proof of a common production stack.
    claimRefs: [CE005, CE007, CE008, CE009, CE012, CE013, CE017]

figures:
  - id: FE001
    title: Newsela product architecture map
    type: stack
    summary: Newsela's public product surface layers content and differentiation with assessment, integrations, and district intervention products.
    data:
      layers:
        - label: Content and curriculum
          detail: Product content and curriculum assets used as the instructional foundation.
          items:
            - label: Leveled articles
              detail: Same topic offered at multiple reading levels for differentiated instruction.
            - label: Learning Suite
              detail: Curriculum complements, novel and book studies, and decodable texts are described in the official Help Center.
        - label: Learning workflow
          detail: Classroom actions that connect content to assessment and teacher review.
          items:
            - label: Assignments
              detail: Teachers select content, reading level, activities, and due dates.
            - label: Embedded assessment
              detail: Quizzes, annotations, and writing prompts connect activity to instructional review.
        - label: Identity and integrations
          detail: Account provisioning and learning-management-system connections.
          items:
            - label: Rostering and SSO
              detail: Public listings describe Clever, Google Classroom, and Canvas workflows.
            - label: Teacher and district analytics
              detail: Binder and integrated grading/feedback surfaces support review of student work.
        - label: District intervention
          detail: District-level data and intervention products extending beyond core reading.
          items:
            - label: Schoolytics
              detail: Positioned as a district data and actionable-insight platform.
            - label: EveryDay Labs
              detail: Attendance and behavioral-science tools announced for integration into Schoolytics.
        - label: Governance and operations
          detail: Privacy, compliance, reliability, and support controls required for district deployment.
          items:
            - label: Privacy and compliance
              detail: District deployments must operate within COPPA and FERPA obligations.
            - label: Reliability and support
              detail: Public sources do not disclose uptime, incident, or support-performance metrics.
        - label: Technical diligence
          detail: Operating evidence required to validate the connected-suite thesis.
          items:
            - label: Architecture and data flows
              detail: Obtain diagrams and migration evidence across acquired products.
            - label: Service performance
              detail: Obtain uptime, incident, integration, and support metrics.
    claimRefs: [CE001, CE005, CE007, CE008, CE009, CE010]

callouts:
  - calloutType: strength
    title: Integrated instructional loop
    body: >-
      The strongest product evidence is the connection between leveled content, embedded formative activity, and teacher review rather than any single content feature.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Integration maturity is not yet measurable
    body: >-
      Acquisitions and partner listings establish product direction, but public evidence does not establish that identity, analytics, privacy controls, and reliability are unified across the expanding suite.
    claimRefs: [CE005, CE006, CE015, CE017]

