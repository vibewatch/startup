          detail: "Track / research-more"
        - id: diligence
          label: "Diligence gate"
          detail: "Current cap table, retention, and module economics"
      edges:
        - from: scale
          to: proof
        - from: proof
          to: price
        - from: price
          to: risks
        - from: risks
          to: decision
        - from: decision
          to: diligence
    claimRefs: [CV001, CV005, CV007, CV011, CV014]
callouts:
