  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: private-financials
      missingEvidence: "Current ARR or revenue bridge, growth, gross margin, net retention, debt, fully diluted shares, preferences, and liquidation waterfall."
      whyItMatters: "Without these inputs, the 2021 valuation reference cannot be translated into current equity value or investor return."
      diligencePath: "Request a current management data room, cap table, debt schedule, cohort retention, module P&L, and latest board-approved financing materials."
      relatedQuestionRefs: [QV006, QV008]
    - type: stale
      severity: material
      topic: valuation
      missingEvidence: "A financing, tender, secondary, or independent mark after the February 2021 Series D."
      whyItMatters: "A five-year-old private valuation may not reflect current growth, margins, capital needs, or market multiples."
      diligencePath: "Obtain the latest preferred financing documents, 409A or independent valuation, and any recent secondary transaction terms."
      relatedQuestionRefs: [QV002, QV006]
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: "Like-for-like public-company or private-transaction comparables using comparable revenue definitions and periods."
      whyItMatters: "A mixed or stale comp set would create false precision in a target valuation or return."
      diligencePath: "Build a dated comp set with revenue basis, growth, gross margin, net retention, and enterprise-value methodology documented for each peer."
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: monetization-risk
      missingEvidence: "Evidence on renewal losses, AI or free-tool substitution, district concentration, and implementation cost by module."
      whyItMatters: "Downside drivers can reduce durable revenue and compress the multiple even if product breadth expands."
      diligencePath: "Review lost-customer cohorts, product usage, competitive win/loss notes, implementation hours, and customer-success cost by segment."
      relatedQuestionRefs: [QV005, QV009]
