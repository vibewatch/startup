- id: TI004
  title: Capital adequacy table
  columns:
  - cash on hand
  - monthly burn
  - runway months
  - planned use of funds
  - next-round trigger
  - debt/project-finance obligations
  rows:
  - - £62.3m cash at 31 March 2025
    - Not disclosed as a simple monthly burn figure
    - Not explicitly disclosed
    - Fund receivables growth, platform scaling, and expansion
    - Likely tied to growth pace and capital-market conditions rather than immediate distress
    - £150m securitisation plus later expansion
  - - Positive adjusted operating cash flow of £15.0m
    - Operating cash flow still negative before debt-facility movement
    - Formal runway remains undisclosed
    - Support working-capital intensity more efficiently
    - Would need renewed equity or debt if receivables outgrow facility headroom
    - Debt facility performance covenants and availability matter
  - - Consumer loan receivables £112.8m
    - Receivable growth can consume capital fast
    - Runway depends on turn speed and funding access
    - Originate and fund consumer loans
    - Could tighten if losses rise or funding terms worsen
    - Further £79.4m drawdown used during FY2025
  - - November 2025 raise of >$175m debt + equity
    - Burn normalized by new capital not public
    - Extended but not quantified
    - Accelerate growth, AI-led expansion, product roadmap
    - Another round could be needed if growth or losses miss plan
    - Raise includes expanded Deutsche-led securitisation
  - - Companies House latest filed period ended 31 March 2025
    - No audited FY2026 cash-bridge yet
    - Public runway is therefore stale
    - N/A
    - Fresh audited accounts are next hard checkpoint
    - Next accounts due by 31 December 2026
  notes: The public record supports improved capital adequacy, but not a precise investor-quality runway calculation.
