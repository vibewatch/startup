  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized merchant pricing
    missingEvidence: Detailed merchant fee schedules, subsidy economics, and realized take-rate dispersion by category.
    whyItMatters: The public record proves revenue exists but does not prove the durability or margin quality of merchant-funded economics.
    diligencePath: Request top-merchant contracts, pricing cards, and realized take-rate data by category.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: material
    topic: cohort payback and LTV
    missingEvidence: A cohort-level CAC payback and lifetime-value analysis by channel and product.
    whyItMatters: CAC/revenue ratio alone is too blunt to underwrite durable growth efficiency.
    diligencePath: Request monthly acquisition cohorts with payback, retention, and loss-adjusted contribution margin.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: runway and covenant headroom
    missingEvidence: A management runway model showing cash, debt-facility usage, covenant triggers, and downside cases.
    whyItMatters: Capital adequacy depends on more than year-end cash; it depends on receivables turn speed and facility headroom under stress.
    diligencePath: Request treasury forecast and lender reporting pack.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: contribution margin by product
    missingEvidence: Product-level contribution margin after funding cost, rewards, losses, and servicing cost.
    whyItMatters: This is the cleanest test of whether recent growth is creating durable economic value.
    diligencePath: Review product P&Ls and monthly margin bridge by payment journey.
    relatedQuestionRefs:
    - QI018
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: minor
    topic: post-March-2025 audited performance
    missingEvidence: An audited or at least board-approved FY2026 trading update following the November 2025 raise.
    whyItMatters: The late-2025 capital raise and new products could have materially changed the FY2026 trajectory versus the last audited accounts.
    diligencePath: Request latest management accounts, board pack, and covenant certificate.
    relatedQuestionRefs:
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
