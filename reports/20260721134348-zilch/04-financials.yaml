  figureRefs:
  - FI004
- id: financial-verdict
  title: Financial verdict and remaining diligence blockers
  body: 'Public evidence is strong enough to support a positive update in the investment narrative but not yet a fully closed underwriting case. Zilch has clearly improved the shape of the business: revenue quality looks better than a classic late-fee-heavy BNPL provider, gross margin and operating leverage improved sharply, and adjusted operating cash flow turned positive. However, the model still depends on receivables funding, favourable capital-market access, and continued execution on higher-margin merchant and advertising economics. The next diligence step is therefore not to debate whether financial progress is real - it is - but to test whether the improvement is durable at larger scale and under tighter regulation. Missing visibility on realized merchant pricing, cohort CAC payback, runway months, and loss-adjusted contribution margin prevents a fully confident underwriting verdict today. Another useful corroborating point is that partner case studies already describe Zilch building
    more revenue-bearing surfaces such as storefront placements, travel, and acquiring infrastructure, which fits the audited diversification story even though the precise economics stay private.'
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
