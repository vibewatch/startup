  title: Funding infrastructure is part of the product, not just the balance sheet
  body: The model scales because receivables funding scales. Any investor should treat securitisation terms, covenant headroom, and funding-market appetite as first-order underwriting variables.
  claimRefs:
  - CI021
  - CI022
