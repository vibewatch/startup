- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Realized merchant fee schedules and subsidy rates
    - Cannot verify whether merchant-funded economics are structurally superior or promotional
    - Request top-merchant contracts, blended take rate, and subsidy economics by category.
  - - Cohort CAC payback and LTV by acquisition channel
    - Cannot test whether growth remains efficient as channels broaden
    - Request monthly cohort payback, retention, and revenue yield by channel.
  - - Loss-adjusted contribution margin by product
    - Cannot separate healthy growth from temporarily subsidized growth
    - Request contribution margin after funding cost, losses, and rewards.
  - - Runway-month and covenant-headroom model
    - Cannot quantify downside resilience under slower growth or higher losses
    - Request treasury forecast showing facility usage, covenant triggers, and equity needs.
  - - FY2026 audited performance since the November 2025 raise
    - Cannot confirm whether profitability progress continued post-balance-sheet date
    - Request management accounts and latest board pack through June 2026.
  notes: These gaps are not minor polishing items; they are the core blockers to a fully confident underwriting stance.
