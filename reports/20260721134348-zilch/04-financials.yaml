  - TI002
  figureRefs:
  - FI001
- id: margin-and-unit-economics
  title: Traction, gross margin, and unit-economics signals
  body: 'FY2025 was a genuine step-change in operating leverage. GMV, order frequency, annual spend per active customer, take rate, and gross margin all improved, while administrative expenses grew far more slowly than revenue. Gross profit more than doubled and the company reduced both operating and net losses sharply. Importantly, this did not come from ignoring credit risk: credit losses as a percentage of GMV ticked up only modestly even as Zilch onboarded newer users and expanded Pay over 3 months. Management also reports that acquisition spend rose substantially, yet CAC as a share of revenue fell because payback remained healthy. Those are encouraging unit-economics signals, but they are still partial. Public filings do not disclose cohort-level contribution margin, realized lifetime value, or vintage-level loss curves, so the investor can observe improving efficiency without yet fully decomposing it.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
