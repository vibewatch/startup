  - - Transaction revenue
    - Network or payment-related revenue on transactions
    - £m
    - £21.7m in FY2025
    - Meaningful and growing with usage scale
    - Request breakdown by in-network, out-of-network, and card usage.
  - - Feature revenue
    - Premium product or feature monetization, including longer-tenor offerings
    - £m
    - £3.1m in FY2025
    - Small today but fastest-growing percentage line
    - Request feature attach rates and margin by feature.
  - - Advertising revenue
    - App placements, stories, featured deals, merchant demand generation
    - £m
    - £9.8m in FY2025
    - Important proof that merchant media is real
    - Request revenue concentration by advertiser and repeat spend.
  - - Combined transaction + advertising
    - Payment + media monetization beyond pure credit
    - £m
    - £31.5m in FY2025, more than a quarter of total revenue
    - Supports diversification narrative
    - Request whether these lines carry higher gross margin than credit revenue.
  notes: Revenue lines are audited, but the public record does not disclose the gross margin or retention profile of each stream separately.
