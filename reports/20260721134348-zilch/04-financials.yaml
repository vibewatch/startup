  - - Loss-adjusted contribution margin
    - 'null'
    - low
    - Critical to underwriting durability of the model
    - Request product-level contribution margin after funding cost and losses.
  notes: The key public gap is that several promising efficiency signals exist, but the full contribution-margin bridge is still private.
