company:
  name: Zilch
chapter:
  number: 4
  title: Financials
  summary: 'Zilch''s audited FY2025 financial profile is materially better than the market stereotype of loss-heavy BNPL. Revenue grew 93% to £110.3m, GMV rose 73% to £1.893bn, gross margin expanded to 49%, and net losses fell 79% to £10.5m. The numbers support a real path toward profitability, helped by improving take rate, better supplier and funding terms, and a multi-stream model that now includes meaningful transaction and advertising revenue. But the business is still balance-sheet intensive: consumer receivables reached £112.8m, securitisation drawdowns funded much of the working-capital expansion, and the public record still lacks enough detail on realized merchant pricing, cohort CAC payback, and runway months to treat the model as fully underwritten.'
sections:
- id: revenue-model
  title: Revenue streams and monetization quality
  body: The strongest audited conclusion is that Zilch no longer looks like a single-stream BNPL lender. Its FY2025 revenue base split across credit, transaction, feature, and advertising lines, with transaction plus advertising revenue already representing more than a quarter of the total. That matters because it lowers dependence on any one pricing lever and supports management's claim that the platform monetises both consumer credit activity and merchant attention. The rollout of Pay over 3 months appears financially important because management explicitly links it to higher average fees per transaction and a stronger mix of app-led journeys. Combined with the company's no-late-fee posture, the monetization story is less about penalising stressed consumers and more about merchant-funded economics, product mix, and higher-value journeys. The caution is that public sources do not disclose realized merchant fees or subsidy rates, so investors can see the outputs of diversification but not
    yet the contract-level economics underneath them.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI028
  - CI029
  - CI030
