  - list vs realized pricing
  - discounts/unknowns
  - source
  - implication
  rows:
  - - Pay over 6 weeks and pay over 3 months consumer journeys
    - Product-level consumer economics partially observable, realized pricing undisclosed
    - Merchant subsidy and consumer fee mix not public
    - Annual report; product launch pages
    - Investors see monetization outputs, not the exact contract inputs.
  - - Merchant commissions and lead-generation economics
    - Only described qualitatively in public materials
    - Realized rates, category spreads, and performance pricing are unknown
    - Annual report; founder interview
    - Merchant-media moat cannot be fully underwritten publicly.
  - - Advertising placements and featured deals
    - Revenue line is disclosed, rate card is not
    - Placement yield and repeat advertiser behaviour unknown
    - Annual report
    - Useful proof of revenue diversity, limited pricing transparency.
  - - Interchange / card-linked economics
    - Physical-card strategy suggests broader payments monetization
    - Net interchange, issuer economics, and card cost stack not public
    - Visa partnership release
    - Card expansion could help revenue quality but exact margin is unknown.
  - - No late fees on customer loans
    - Consumer price headline is clear
    - Yield replacement sources must be inferred from other revenue lines
    - Annual report; Which?
    - Better consumer optics but heavier dependence on merchant and funding economics.
  notes: This table is intentionally partial because list pricing is far less transparent than audited revenue outputs.
