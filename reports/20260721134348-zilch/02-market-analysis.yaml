- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer
  - workflow
  - budget owner
  - adoption trigger
  rows:
  - - Everyday UK consumer
    - Provider selected through merchant checkout or wallet app
    - Consumer
    - Merchant plus sometimes consumer fee on non-subsidised journeys
    - Select pay-later or pay-now-with-rewards at checkout
    - Household cash flow
    - Convenience and short-term budget smoothing.
  - - Larger-ticket shopper
    - Consumer seeking more time for travel, electronics, home repairs or holidays
    - Consumer
    - Merchant / lender / sometimes consumer
    - Use longer-tenor regulated instalment option
    - Household discretionary budget
    - Need to spread medium-ticket spend without revolving-card APRs.
  - - Retail merchant / brand
    - Merchant selects provider or app placement
    - Consumer is end user
    - Merchant pays commission / placement / promo spend
    - Integrate provider into checkout or app placement
    - Marketing and ecommerce budget
    - Conversion uplift and customer acquisition efficiency.
  - - Warehouse capital provider
    - Credit fund or bank provides debt capacity
    - N/A
    - Lender/funder
    - Fund receivables book via facility
    - Treasury / portfolio-allocation capital
    - Attractive credit performance and covenant protection.
  - - Regulator / consumer-protection layer
    - FCA and Treasury set rules; FOS handles disputes
    - Consumer benefits from outcomes
    - Compliance cost borne by provider
    - Authorisation, disclosure, affordability, complaints flows
    - Compliance and risk budget
    - Consumer-harm mitigation and market standardisation.
  notes: This table frames the market as a multi-sided system. Zilch’s uniqueness rests on capturing value from both merchant budgets and consumer payment behaviour while also satisfying funders and regulators.
