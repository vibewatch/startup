- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Cost-of-living pressure and demand for flexible cash flow
    - positive
    - current
    - Supports short-duration pay-later adoption for discretionary and semi-essential purchases.
    - 'Measure use-case mix: convenience versus financial stress.'
  - - Mobile-wallet and app-native payment adoption
    - positive
    - current to long term
    - Helps Zilch extend beyond ecommerce checkout into habitual wallet share.
    - Quantify share of Zilch volume online vs in-store and wallet-linked vs app-initiated.
  - - Merchant demand for conversion and media efficiency
    - positive
    - current
    - Creates room for ad-subsidised economics and merchant-funded rewards.
    - Request hard merchant ROI cohorts and subsidy rates by category.
  - - July-2026 BNPL regulation and affordability checks
    - negative
    - current / near term
    - Raises compliance burden and could reduce approvals or increase servicing cost.
    - Model approval-rate change, CAC impact, and compliance opex under the new regime.
  - - Loan stacking and consumer-harm scrutiny
    - negative
    - current
    - Makes frequent-user growth more politically and regulatorily sensitive.
    - Request delinquency, plan-stacking, and vulnerable-customer metrics.
  - - Warehouse funding dependence
    - negative
    - current
    - Scaling is constrained by funding cost, covenant headroom, and receivables performance.
    - Review facility triggers, borrowing base, and stress scenarios.
  notes: The positive drivers are real, but the market is moving from permissive growth into regulated-credit discipline. The best operators will need payments UX, underwriting quality, and funding resilience simultaneously.
