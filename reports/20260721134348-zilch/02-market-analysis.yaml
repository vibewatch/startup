- id: sizing-and-adoption
  title: Sizing lenses and adoption trajectory
  body: 'Public market lenses agree on one point: BNPL is already mainstream in the UK, even if exact totals differ by methodology. FCA materials and derivative statistics put 2024 transaction value above £13 billion, up from roughly £60 million in 2017. The FCA’s Financial Lives data says 20% of UK adults, or 10.9 million people, used unregulated BNPL in the 12 months to May 2024; Business Expert estimates roughly 54% of UK adults have used BNPL at some point by 2026. Forecast vendors go higher still, with Kandoo citing UK BNPL spending of roughly £29.85 billion in 2024 rising toward £47.27 billion by 2029, though those vendor forecasts mix a broader spend concept than the FCA’s transaction-value framing. Digital-wallet adoption is the adjacent habit that matters most for Zilch’s expansion beyond pure checkout lending: Finder says 57% of UK adults had a mobile payment service in 2024 and 40% of UK online purchases already used digital wallets. Zilch’s market is therefore large enough, but
    the real analytical challenge is not proving size; it is proving which slices of that size Zilch can capture profitably under regulation.'
