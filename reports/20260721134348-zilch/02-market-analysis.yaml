  title: The addressable demand is real and already mainstream
  body: The main debate is not whether BNPL exists at meaningful scale in the UK. FCA materials, survey data, and vendor forecasts all show a market that is already mainstream and still expanding into adjacent wallet behaviour.
  claimRefs:
