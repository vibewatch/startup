  title: Regulation changes the market from checkout convenience into regulated-credit discipline
  body: July 2026 regulation makes affordability, complaints handling, and conduct quality central to growth. This should favour disciplined operators, but it will also reduce tolerance for weak underwriting and hidden-debt behaviour.
  claimRefs:
