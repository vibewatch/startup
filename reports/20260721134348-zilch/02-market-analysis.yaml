- id: constraints-and-regulatory-reset
  title: Growth drivers, constraints, and the 2026 regulatory reset
  body: 'The strongest demand drivers for this market are clear: cost-of-living pressure, the convenience of app-native payments, merchant demand for higher conversion, and the migration of shopping into wallets and embedded payments. But the constraint set is equally material. FCA papers, Treasury updates, and independent commentary all emphasise that hidden debt, weak upfront information, and insufficient affordability checks are the reasons BNPL is being brought into full regulation from July 2026. FCA analysis says deferred-payment-credit users are more likely to be in financial difficulty than the general population, and Business Expert highlights loan stacking among young users. The resulting regime adds affordability checks, Financial Ombudsman access, Consumer Duty expectations, and section 75-style protections for eligible purchases, all of which make BNPL look more like mainstream regulated credit. For Zilch this may be a relative advantage because it entered early with regulation
    and credit-bureau reporting, but it also narrows the growth playbook by raising compliance cost, potentially excluding weaker applicants, and increasing the importance of robust underwriting and funding discipline.'
