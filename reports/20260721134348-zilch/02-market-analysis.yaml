tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Third-party deferred payment credit
    - Interest-free instalment products repaid in 12 or fewer instalments within 12 months
    - Merchant-provided instalment credit where lender and seller are the same party
    - Consumer borrower; lender underwrites; merchant presents offer
    - Core regulatory category that captures most BNPL models relevant to Zilch.
  - - General-purpose digital wallet payments
    - Wallet-stored credentials and app-native payment flows used online and in-store
    - Traditional cash and offline-only merchant financing
    - Consumer user; card networks and wallet providers facilitate
    - Important adjacency because Zilch uses virtual and physical card credentials.
  - - Short-duration checkout credit
    - Pay in 3, pay in 4, pay in 30, pay over 6 weeks, pay over 3 months
    - Long-term instalment loans, personal loans, revolving card balances
    - Consumer borrower; merchant and lender share economics
    - Closest substitute set for Zilch conversion and underwriting economics.
  - - Merchant-funded acquisition / media layer
    - Affiliate commissions, app placement, merchant-funded rewards, ad-subsidy
    - Pure consumer-fee models without merchant economics
    - Merchant and advertiser are the primary payer
    - Differentiates Zilch from providers whose model relies more directly on late fees or APR income.
  - - Status-quo substitutes
    - Credit cards, debit cards, overdrafts, savings, personal loans
    - N/A
    - Consumer decides payment method; incumbent issuers/payments providers earn economics
    - Defines the real competitive set constraining Zilch adoption.
  notes: Boundary follows FCA and Treasury deferred-payment-credit framing and adds the payment-wallet layer needed to understand Zilch’s virtual-card and physical-card strategy.
