chapter:
  number: 2
  title: Market Analysis
  summary: 'Zilch operates inside the UK deferred-payment-credit and broader consumer-payments market rather than a standalone niche checkout widget category. Public regulatory and market-data sources show BNPL has already reached mainstream scale: FCA policy materials put 2024 UK deferred-payment-credit transaction value above £13 billion and 20% of UK adults, or 10.9 million people, using unregulated BNPL in the year to May 2024, while broader statistics suggest even higher lifetime penetration. The demand case is supported by cost-of-living pressure, mobile-wallet adoption, and merchant appetite for conversion and advertising efficiency, but the same market is being structurally reshaped by July 2026 regulation, affordability checks, and loan-stacking concerns. For Zilch, the opportunity is large and growing, yet the real addressable market is constrained by regulation, underwriting discipline, and the still-unproven portability of its ad-subsidised model beyond high-intent consumer categories.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: 'The right market definition for Zilch is UK third-party deferred-payment credit layered into broader digital consumer payments. FCA policy documents define deferred payment credit as interest-free credit used to finance goods or services, repayable in 12 or fewer instalments within 12 months or less. That boundary matters because it includes merchant-integrated pay-later products such as Klarna, Clearpay, PayPal Pay Later-style offers, and Zilch’s own regulated instalment products, but excludes ordinary debit-card spending, revolving credit cards, and merchant-provided instalment credit where the lender and merchant are the same party. Zilch also stretches this category by bundling debit rewards, virtual-card acceptance, and merchant-media monetisation into the same wallet experience. The status-quo substitute set is therefore wider than classic BNPL: credit cards, debit cards, overdrafts, personal loans for larger purchases, and increasingly general-purpose digital wallets all
    compete for the same checkout event. The market is best analysed as a payments-and-credit wedge, not as an isolated lending niche.'
  claimRefs:
