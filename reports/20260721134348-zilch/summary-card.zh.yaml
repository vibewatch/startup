  topStrengths:
    - 经审计 FY2025 收入、收窄的亏损和 500 万以上客户规模，说明 Zilch 已经越过概念阶段。
    - 相比传统 BNPL，Zilch 把卡驱动受理、奖励驱动借记和商户出资商业经济模型拼在一起，模式有差异。
    - 支付牌照、Intelligent Commerce 和 Zilch Pay 的产品扩张，让平台上行空间不只来自普通分期信贷。
  topRisks:
    - 英国 BNPL 监管已经落地，可负担性、行为规范、投诉处理和结果监测的负担都会上升。
    - 商户留存、集中度、队列耐久性和监管落地后的单位经济，公开证据仍薄。
    - 股权结构条款、清算优先权和伙伴集中度仍过于不透明，难以支撑高确信度的价格承保。
  unresolvedGaps:
    - ASPN 和 Intelligent Commerce 的商户留存、续约与贡献利润率数据仍未公开。
    - 监管落地后的单位经济、投诉趋势和 Consumer Duty 准备度证据尚未公开。
    - 当前股权结构条款、清算优先权和下行保护仍未披露。
