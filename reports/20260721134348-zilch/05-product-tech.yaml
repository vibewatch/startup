tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - module/asset/product line
  - user
  - status/maturity
  - differentiation
  - diligence gap
  rows:
  - - Pay Now rewards
    - Consumer
    - Live / mature
    - Turns debit-like spend into rewards and shopping engagement
    - Need economics by rewards-funded versus subsidised merchant journeys.
  - - Pay over 6 weeks
    - Consumer
    - Live / mature
    - Core short-duration instalment product with card-led acceptance
    - Need approval-rate and loss-rate disclosure by channel.
  - - Pay over 3 months
    - Consumer
    - Live / scaling
    - Longer regulated product for bigger-ticket purchases with bureau reporting
    - Need take-up, repeat-use, and margin by cohort.
  - - Intelligent Commerce
    - Merchant / brand
    - Beta to early commercial rollout
    - Uses first-party spend data and AI targeting for merchant ROAS
    - Need audited proof of retention and advertiser spend durability.
  - - Zilch Pay
    - Merchant + consumer
    - Announced for H1 2026
    - One-click checkout connecting app, wallet, and card
    - Need exact merchant integration model and rollout milestones.
  - - Zilch Travel
    - Consumer + merchant partner
    - Live
    - White-label travel shopping and payments surface inside ecosystem
    - Need GMV and repeat-use disclosure versus core commerce flows.
  notes: The module set is broader than classic BNPL. Public evidence supports all six surfaces, but commercial maturity is clearest for the original payment products and weaker for newer merchant-media tooling.
