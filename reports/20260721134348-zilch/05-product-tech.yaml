  - FE003
- id: operations-and-controls
  title: Deployment, support, and trust controls
  body: 'Several partner case studies give unusually useful visibility into day-to-day product operations. Contentstack shows that Zilch runs its storefront as a living app surface with approval workflows, staging, rapid publishing, and retailer-oriented placements that can change in minutes. Tonkean shows a similar pattern in support operations, where Zilch connected messaging, ticketing, and customer-service workflows to create a more unified customer view. On trust and compliance, the UK privacy notice explicitly covers automated decision making, data security, data retention, international transfer, and controller responsibilities, while the US product page markets multi-factor verification, data encryption, and payment authentication. These disclosures support the thesis that product operations and compliance are treated as product features, not just back-office obligations. What remains unclear is the hard reliability layer: public sources still do not disclose uptime, incident history,
    or service-level targets. From an investor standpoint, this means public trust artefacts are good enough to prove intent and governance posture, but not good enough to clear deep technical diligence without internal control evidence. The absence of a public developer portal or public service-status history also makes it difficult to benchmark Zilch against infrastructure-oriented payments peers.'
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE033
