- id: architecture
  title: Technology and operating architecture
  body: The most supportable architecture reading is layered rather than vertically pure. Zilch owns the app experience, underwriting logic, merchant storefront, and much of the data flywheel, but it clearly relies on major partners for key rails. Checkout.com supports global acquiring, Mastercard and Visa expand acceptance, and Monavate’s case study shows how early card-programme, BIN, and digital-wallet capabilities were assembled. AWS underpins the company’s data lake and AI tooling, and public partner releases say SageMaker and Bedrock are used for underwriting, fraud detection, and buyer-intent models. In other words, Zilch appears to combine proprietary decisioning and merchandising with outsourced infrastructure components chosen for scale and speed. That is a sensible fintech architecture, but it means the moat is partly integration quality rather than absolute ownership of every layer.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
