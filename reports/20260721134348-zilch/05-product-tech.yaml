  evidenceGaps:
  - type: missing-source
    severity: material
    topic: api and sdk surface
    missingEvidence: A public API documentation portal, SDK reference, or integration guide detailed enough to audit external developer experience and merchant implementation complexity.
    whyItMatters: Without developer-facing materials, it is hard to judge how scalable Zilch Pay or merchant integrations are beyond marketing claims.
    diligencePath: Request product and engineering docs for merchant integration, sandbox setup, and API versioning.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: reliability and uptime
    missingEvidence: A public status page, uptime history, incident log, or service-level commitment for payment authorization, content operations, and support workflows.
    whyItMatters: Breadth without reliable operations creates hidden execution risk, especially as Zilch expands into one-click checkout and merchant tooling.
    diligencePath: Request uptime dashboards, postmortems, and SLA commitments for core payment and storefront services.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: model governance and AI performance
    missingEvidence: Internal evidence on fraud-model lift, underwriting model drift, personalization model governance, and override policies.
    whyItMatters: AI and data claims are central to the moat thesis but cannot be underwritten from partner announcements alone.
    diligencePath: Review model-governance pack, validation cadence, and measured business lift by model class.
    relatedQuestionRefs:
    - QE007
    - QE008
    - QE025
  - type: private-evidence-only
    severity: material
    topic: partner economics and substitution risk
    missingEvidence: Commercial terms and fallback plans for acquiring, network, issuance, and cloud partners.
    whyItMatters: Product quality depends on partner services, so concentrated dependencies can compress margin or slow roadmap delivery.
    diligencePath: Request major partner contracts, renewal timelines, and contingency architecture.
    relatedQuestionRefs:
    - QE006
    - QE021
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: roadmap delivery readiness
    missingEvidence: Programme-level milestones, staffing, and launch-readiness criteria for Zilch Pay and Intelligent Commerce.
    whyItMatters: The roadmap is promising, but public statements do not show whether internal delivery capacity matches ambition.
    diligencePath: Request quarterly roadmap, staffing plan, and post-launch KPI owners.
    relatedQuestionRefs:
    - QE014
    - QE015
    - QE024
    relatedTableRefs:
    - TE005
