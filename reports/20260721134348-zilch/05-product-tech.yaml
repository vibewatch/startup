- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer/process/component
  - role
  - dependency
  - risk
  rows:
  - - Mobile app and wallet experience
    - Primary customer interface
    - Internal product plus app-store distribution
    - Hard to separate genuine engagement from promotional behaviour.
  - - Acquiring and payment processing
    - Authorize and route transactions
    - Checkout.com and related acquiring rails
    - Service interruptions or unfavorable terms could affect conversion and unit economics.
  - - Card-network acceptance
    - Expand merchant acceptance online and offline
    - Mastercard historically, Visa expanding
    - Network rule changes or partner shifts could change economics and roadmap speed.
  - - Card programme / wallets
    - Support virtual cards and mobile-wallet use
    - Early Monavate support and broader issuer stack
    - Public architecture ownership boundaries are not fully disclosed.
  - - AI and data-lake layer
    - Personalization, fraud, affordability, buyer intent
    - AWS cloud services and internal models
    - Model-quality drift or cloud concentration risk could weaken both underwriting and ad targeting.
  - - Storefront content operations
    - Merchant placements, stories, approvals, staging
    - Contentstack workflows
    - Fast iteration is useful, but no public uptime or failure-rate history is disclosed.
  notes: Architecture is public enough to map dependencies, but not public enough to audit core in-house services or resilience.
