- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Everyday purchase with immediate savings
    - Open app or linked card, choose pay now
    - Pay Now rewards
    - Up to advertised cashback / reward value
    - Merchant subsidy economics are not publicly disclosed.
  - - Short-term budget smoothing
    - Select Zilch at or before checkout and repay over six weeks
    - Pay over 6 weeks
    - Zero-interest spreading for eligible purchases
    - Public sources do not disclose precise approval funnel or loss-adjusted margin.
  - - Bigger-ticket purchase or emergency spend
    - Choose longer-tenor regulated option with affordability limits
    - Pay over 3 months
    - Longer zero-interest window and credit-building behaviour
    - Need product-level profitability and borrower-segment performance.
  - - Merchant wants higher conversion and targeted spend
    - Buy placement or partner with Zilch storefront / campaigns
    - Intelligent Commerce and storefront tenancy
    - Reported 20-50% ROAS lift in beta claims
    - Evidence is still mostly company-authored.
  - - Consumer wants low-friction repeat checkout
    - Use one-click button connected to wallet and card
    - Zilch Pay
    - Lower cart abandonment and easier repeat purchase
    - Still roadmap, not yet publicly measured.
  notes: Benefits are strongest where public disclosures provide real-world examples, and weakest where the company is still previewing roadmap features.
