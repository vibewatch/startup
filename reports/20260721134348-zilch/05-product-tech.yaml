company:
  name: Zilch
chapter:
  number: 5
  title: Product & Technology
  summary: 'Zilch has outgrown the label of a single-feature BNPL app. Public evidence shows a consumer product stack spanning pay now rewards, pay over 6 weeks, pay over 3 months, virtual and physical card-led acceptance, and newer merchant products such as Intelligent Commerce and Zilch Pay. The operating model appears to sit on a layered partner stack: Checkout.com for acquiring, Mastercard and Visa for network reach, Monavate for early programme and wallet rollout, AWS for data and AI infrastructure, and tooling such as Contentstack and Tonkean for storefront and support workflows. This breadth is strategically attractive because it ties first-party data to both lending and merchant monetization, but the public record still leaves important holes around API surface, uptime, and the boundaries between proprietary advantage and partner dependence.'
sections:
- id: product-suite
  title: Product definition and module map
  body: 'Zilch’s product definition is broader than a classic pay-in-4 widget. The public-facing consumer stack covers pay now rewards, pay over 6 weeks, pay over 3 months, and a card-led acceptance model that is designed to work online and offline rather than only inside a small set of retailer checkouts. The product portfolio has also widened at the edges: Zilch Travel is now a distinct white-label travel surface, while Intelligent Commerce and Zilch Pay extend the platform into merchant marketing and one-click conversion tooling. This matters because it shows Zilch trying to capture more of the shopping journey instead of only the financing moment. The product family now looks like a consumer wallet plus merchant monetization layer built around multiple payment modes.'
