- id: dependencies-and-financial-risk
  title: Partner, funding, and financial transmission risk
  body: Zilch remains a highly integrated fintech rather than a vertically self-contained bank. The product depends on acquiring partners, card-network economics, cloud infrastructure, and funding partners that support receivables growth. That architecture is rational for speed and scale, but it means concentration and outage risks can travel quickly into customer experience and profitability. Even if credit performance is improving, higher compliance costs, partner renegotiations, or a weaker funding market could still compress returns. The public record also does not disclose the fallback architecture, covenant triggers, or concentration splits needed to quantify resilience precisely. Investors therefore have to treat partner and funding risk as real, measurable, and only partially mitigated by Zilch’s scale and product breadth.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: execution-and-kill-criteria
  title: Execution risk, mitigations, and kill criteria
  body: 'The company is trying to do several hard things at once: absorb a new regulatory regime, expand into one-click checkout and merchant AI, deepen memberships, and preserve improving credit economics. That makes people and execution risk more important than a simple point-in-time loss ratio. A founder-led culture can be decisive in product and fundraising, but the same speed can become a governance issue if control buildout lags commercial ambition. The right response is not to assume failure; it is to define hard kill criteria and monitoring rules up front. If affordability evidence weakens, complaints escalate, partner outages surface, or merchant retention fails to justify the platform narrative, the thesis should change quickly. Zilch has visible mitigations, but the burden of proof now sits with measured operational discipline rather than visionary product positioning. That is why investors should insist on ongoing evidence, not one-time promises. The right question is whether
    management can surface emerging conduct, complaints, and dependency problems fast enough to adapt before they become capital or regulatory events.'
