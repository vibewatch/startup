chapter:
  number: 7
  title: Risks
  summary: 'Zilch’s risk profile is no longer defined only by generic BNPL concerns. The main issue in 2026 is transition risk: UK Deferred Payment Credit moved inside full FCA supervision on 15 July 2026, meaning Zilch now has to evidence consumer-duty outcomes, affordability, complaints handling, arrears treatment, and product disclosures at a materially higher standard. That external pressure lands at the same time the company is broadening product scope, increasing partner dependence, and deepening its data-driven merchant products. The result is not an obvious red flag, but a concentrated operating challenge in which conduct, credit, partner, and execution risks can transmit into one another quickly.'
sections:
- id: regulatory-legal
  title: Regulatory and legal risk
  body: 'Regulatory risk is the core issue for this company in 2026. FCA supervision of BNPL is no longer an abstract future threat; it is now live, and the new regime forces firms to operate like regulated consumer-credit providers rather than light-touch checkout tools. For Zilch, that shift matters because its proposition combines flexible credit, card-led acceptance, consumer marketing, and merchant monetization. Public legal and regulatory sources make clear that firms must now show robust creditworthiness checks, intelligible key product information, proactive support for customers in difficulty, and complaints processes that can stand up to Financial Ombudsman scrutiny. Zilch has some visible mitigations, including an FCA payments licence, public support content, and a StepChange pathway for vulnerable users. But none of those remove the basic risk that a fast-scaling product business can fail the new conduct standard at the edges, especially if features such as Snooze, memberships,
    or longer-tenor products are not monitored tightly enough. Another subtle risk is timing: firms that were built for growth speed have to retrofit proof, auditability, and board-ready management information without impairing customer experience. In practice, that often becomes an execution test long before it becomes a headline enforcement event.'
  claimRefs:
