  - - Complaints deterioration
    - Complaints or ombudsman escalation
    - Sharp rise in unresolved complaints or upheld cases
    - Reassess customer-quality and conduct assumptions.
  - - Credit deterioration
    - Arrears / losses / DRA referrals
    - Reversal of loss trend or rising 60+ day delinquency
    - Cut confidence in unit economics and scale quality.
  - - Partner fragility
    - Outage or contract concentration evidence
    - Major outage, adverse renegotiation, or concentrated counterparty exposure
    - Increase discount rate and narrow acceptable entry price.
  - - Merchant flywheel weakness
    - Renewal / spend deterioration
    - Weak pilot conversion or poor advertiser retention
    - Reduce moat and valuation assumptions.
  notes: Each trigger is designed to be observable in diligence or future reporting rather than argued abstractly.
