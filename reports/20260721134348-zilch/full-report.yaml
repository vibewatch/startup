  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Zilch is intellectually coherent. The company has real audited revenue, a
              differentiated merchant-funded model, improving credit-loss optics, and product breadth that could let it
              earn a better multiple than a plain BNPL lender. Intelligent Commerce, Zilch Pay, payments licensing, and
              card-led acceptance together support a thesis that Zilch is trying to become a wider payments-and-commerce
              operating layer. The anti-thesis is just as important: most of the valuation premium rests on optionality
              that still lacks mature public proof. There is not enough external evidence yet on merchant renewal,
              retention, concentration, or post-regulation unit economics to pay blindly for the platform narrative.
              That is why the right answer is not “great company, therefore buy”; it is “interesting company, therefore
              price matters a lot.”
            claimRefs:
              - CV005
              - CV006
              - CV014
              - CV015
              - CV016
              - CV031
