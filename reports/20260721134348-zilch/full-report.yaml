  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market definition for Zilch is UK third-party deferred-payment credit layered into broader
              digital consumer payments. FCA policy documents define deferred payment credit as interest-free credit
              used to finance goods or services, repayable in 12 or fewer instalments within 12 months or less. That
              boundary matters because it includes merchant-integrated pay-later products such as Klarna, Clearpay,
              PayPal Pay Later-style offers, and Zilch’s own regulated instalment products, but excludes ordinary
              debit-card spending, revolving credit cards, and merchant-provided instalment credit where the lender and
              merchant are the same party. Zilch also stretches this category by bundling debit rewards, virtual-card
              acceptance, and merchant-media monetisation into the same wallet experience. The status-quo substitute set
              is therefore wider than classic BNPL: credit cards, debit cards, overdrafts, personal loans for larger
              purchases, and increasingly general-purpose digital wallets all compete for the same checkout event. The
              market is best analysed as a payments-and-credit wedge, not as an isolated lending niche.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
