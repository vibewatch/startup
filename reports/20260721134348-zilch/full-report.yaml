      - number: '3.2'
        title: Competitor profiles and capability comparison
        blocks:
          - type: paragraph
            body: >-
              On product breadth, Zilch is credible but not category-leading. Its public proposition spans pay-now
              rewards, pay over 6 weeks, and pay over 3 months with a physical-card expansion path. Klarna is broader
              still, combining pay in full, pay in 30, pay in 3, and financing, plus memberships, cashback, and a card
              ecosystem. Clearpay remains more tightly focused around pay-in-4 over six weeks, but its app, virtual
              card, and retailer-discovery surfaces give it more than enough functional parity to compete for the same
              shopper. PayPal’s pay-later proposition is narrower on standalone app identity but stronger on checkout
              ubiquity and consumer protection. Monzo Flex is different again: it is not primarily a
              merchant-acquisition engine, but for a Monzo customer it already solves the same instalment need using an
              existing banking interface. In other words, Zilch’s public feature set is good enough to matter, yet it
              does not obviously dominate any single buying criterion except its merchant-funded,
              no-credit-card-repayment positioning.
