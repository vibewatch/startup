  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and current scale
        blocks:
          - type: paragraph
            body: >-
              Zilch was founded in 2018 and launched publicly in the UK in 2020 as a consumer payments platform built
              around regulated, interest-free instalment credit plus debit-style rewards. The company is headquartered
              in London and describes its mission as eliminating the high cost of consumer credit. What differentiates
              Zilch from classical BNPL providers is the emphasis on its ad-enabled payments network: management argues
              that merchants and advertisers, not just borrowers, subsidise the economics through commissions, placement
              fees, and advertising. That matters because it gives Zilch a different unit-economics story from peers
              that depend more directly on merchant discount plus late-fee income. Audited FY2025 accounts showed £110.3
              million revenue on £1.893 billion GMV with 49% gross margin, while later 2025 company updates said the
              platform had surpassed 5.3 million customers and processed more than £5 billion of commerce. The current
              product stack spans Pay Now debit-style payments with rewards, Pay over 6 weeks, Pay over 3 months, a
              growing merchant-media layer, and newer category products such as travel. The evidence supports genuine
              scale and product breadth, but several headline numbers remain company-asserted rather than verified
              through an independently filed public-market disclosure.
