      - number: '8.4'
        title: Recommendation, confidence, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The best current recommendation is research-more with selective interest. Zilch clearly merits continued
              diligence because the core operating story is strong enough to matter, yet too many valuation-critical
              variables remain private. Confidence should be moderate: enough to keep working, not enough to wave
              through the price. The next step is straightforward. Investors should request hard evidence on merchant
              retention, cohort durability, post-regulation economics, partner concentration, and private security
              terms. If those materials are strong, the latest valuation may prove acceptable or even attractive. If
              they are weak, the right move is to step back before the optionality premium hardens into a capital-loss
              risk. In other words, this is a case where diligence quality should determine conviction more than
              management narrative or raw user growth. A good private process should therefore resemble a confirmatory
              underwriting exercise, not a narrative debate. The burden is on the company to prove that the private
              round price captures durable quality rather than simply strong fundraising momentum.
            claimRefs:
