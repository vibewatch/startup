      - number: '7.3'
        title: Partner, funding, and financial transmission risk
        blocks:
          - type: paragraph
            body: >-
              Zilch remains a highly integrated fintech rather than a vertically self-contained bank. The product
              depends on acquiring partners, card-network economics, cloud infrastructure, and funding partners that
              support receivables growth. That architecture is rational for speed and scale, but it means concentration
              and outage risks can travel quickly into customer experience and profitability. Even if credit performance
              is improving, higher compliance costs, partner renegotiations, or a weaker funding market could still
              compress returns. The public record also does not disclose the fallback architecture, covenant triggers,
              or concentration splits needed to quantify resilience precisely. Investors therefore have to treat partner
              and funding risk as real, measurable, and only partially mitigated by Zilch’s scale and product breadth.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
