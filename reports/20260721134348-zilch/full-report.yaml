      - number: '3.3'
        title: Switching cost, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The structural problem for every standalone BNPL brand is that both consumers and merchants can
              multi-home. Which? notes that some retailers have offered as many as six BNPL schemes at checkout, which
              means the shopper often picks from what is already displayed rather than from deep loyalty to a single
              provider. That dynamic weakens consumer lock-in and raises the importance of distribution power. PayPal is
              strongest here because it converts an existing wallet login into a pay-later option. Klarna is strongest
              among specialists because it combines merchant reach, app discovery, and brand recognition at scale.
              Clearpay’s retailer network and consumer-frequency claims support a similar, if narrower, distribution
              moat. Zilch’s card-based universal acceptance and merchant-funded rewards strategy are clever responses to
              this problem because they seek to escape pure merchant-by-merchant integration dependence. But public
              evidence still does not quantify overlap between Zilch’s customers or merchants and those of its largest
              rivals, so any precise switching-cost narrative remains more hypothesised than proven.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP034
              - CP035
      - number: '3.4'
        title: Moat durability and commoditization risk
        blocks:
          - type: paragraph
            body: >-
              The most important adverse conclusion is that Zilch’s moat is still conditional. Regulation may help
              disciplined operators by eliminating weaker competitors and forcing the category into more consistent
              affordability, complaints, and credit-reporting standards. Zilch’s payments licence and already-regulated
              posture could therefore matter at the margin. But the same regulatory tightening also standardises the
              category and makes it easier for buyers to compare products on familiar credit dimensions rather than on
              novelty. That pushes the market toward scale, capital, trust, and distribution—areas where Klarna and
              PayPal remain stronger on public evidence. Public merchant pricing is also too opaque to prove that Zilch
              wins on economics rather than on narrative, and rivals such as Clearpay and Klarna are already encroaching
              on app, rewards, and card-led territory. The strategic implication is clear: Zilch must prove that
              merchant-media economics create measurable repeat wallet share and better unit economics, or else the
              category risks collapsing into a mostly commoditised set of well-regulated instalment interfaces.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP036
