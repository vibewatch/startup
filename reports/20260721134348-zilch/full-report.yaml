            body: >-
              Operational risk is partly what the company says publicly, and partly what it does not. Public help pages
              show a visible control framework for complaints, missed payments, live support, Snooze, and debt recovery,
              which is better than many peers expose. However, those same pages also surface the most important failure
              modes: missed repayments can reduce credit limits and lead to debt-recovery referral; Snooze monetises
              deferral through small fees and now includes selective eligibility and automated behaviour; and complaints
              can escalate outside the company if customers remain dissatisfied. Public sources still do not show
              uptime, incident logs, or model-governance internals, so investors are being asked to trust that a broader
              and more automated product stack is being run well without seeing the evidence usually used to verify that
              claim. That does not prove weakness, but it meaningfully raises diligence requirements around reliability,
              fairness, and fraud control.
