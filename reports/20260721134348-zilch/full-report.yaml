      - number: '8.2'
        title: Current financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Late-2025 financing materially improved the conversation by proving capital access at a $1B+ valuation and
              by moving the narrative away from a pure down-round hangover. But it did not erase the past. The current
              mark still looks below the earlier $2B peak, which means investors should view the latest round as a
              repriced recovery rather than a fully validated premium. Entry discipline matters because public evidence
              still shows a company with audited losses, credit exposure, regulatory transition risk, and incomplete
              cap-table transparency. Those are not fatal issues, yet they are exactly the issues that separate
              disciplined private marks from hopeful ones. Investors should therefore start from the latest financing as
              a reference point, not as proof that the price is automatically attractive. This is especially true in a
              market that has already shown a willingness to punish listed flexible-payments names after IPO, even when
              revenue growth remains healthy.
            claimRefs:
              - CV001
