      - number: '4.3'
        title: Capital adequacy, securitisation dependence, and liquidity
        blocks:
          - type: paragraph
            body: >-
              Zilch's model is capital hungry in a very specific way: it requires working funding for receivables growth
              more than it requires hardware capex or giant fixed assets. Consumer loan receivables nearly doubled in
              FY2025 and that increase was materially supported by further securitisation drawdowns. The Deutsche-led
              refinancing and later facility expansion therefore are not side notes; they are core financial
              infrastructure. Management argues this debt line improves capital efficiency and lowers funding cost, and
              the audited numbers support at least part of that claim because interest expense relative to revenue
              improved while cash ended the year higher. The late-2025 $175m combined raise further strengthened the
              balance sheet. Even so, public evidence still stops short of a formal runway analysis, because debt
              headroom, equity access, and adjusted operating cash flow are disclosed, but a management runway-month
              bridge is not. The right framing is that capital adequacy is improved, not fully de-risked.
