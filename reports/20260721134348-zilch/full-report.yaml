      - number: '7.4'
        title: Execution risk, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The company is trying to do several hard things at once: absorb a new regulatory regime, expand into
              one-click checkout and merchant AI, deepen memberships, and preserve improving credit economics. That
              makes people and execution risk more important than a simple point-in-time loss ratio. A founder-led
              culture can be decisive in product and fundraising, but the same speed can become a governance issue if
              control buildout lags commercial ambition. The right response is not to assume failure; it is to define
              hard kill criteria and monitoring rules up front. If affordability evidence weakens, complaints escalate,
              partner outages surface, or merchant retention fails to justify the platform narrative, the thesis should
              change quickly. Zilch has visible mitigations, but the burden of proof now sits with measured operational
              discipline rather than visionary product positioning. That is why investors should insist on ongoing
              evidence, not one-time promises. The right question is whether management can surface emerging conduct,
              complaints, and dependency problems fast enough to adapt before they become capital or regulatory events.
            claimRefs:
              - CR033
              - CR034
