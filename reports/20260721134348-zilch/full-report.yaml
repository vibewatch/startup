        title: Leadership, governance, and organisational control
        blocks:
          - type: paragraph
            body: >-
              Leadership remains founder-centric. Public Zilch materials and founder profiles consistently place Philip
              Belamant at the centre of strategy, fundraising, product positioning, and public-market ambition; official
              and third-party descriptions increasingly describe the founding group as Philip Belamant, Serge Belamant,
              and Sean O’Connor. The FY2025 annual report shows a five-member board consisting of Serge Belamant as
              chair, Philip Belamant as CEO and director, Sean O’Connor as co-founder/director, plus independent
              non-executives Pavel Chernyshov and Mark Wilson. Wilson’s August 2024 appointment mattered because
              management explicitly framed it as a governance-strengthening step toward sustained profitability and
              eventual listing readiness. Companies House filings also show ongoing board evolution, including Serge and
              Sean becoming directors of the new holding company structure in April 2024 and Dame Clare Barclay joining
              in June 2026 after the FY2025 reporting period. The governance picture is therefore improving, but still
              unusually dependent on a small founder group and on management credibility for key forward-looking
              statements about product roadmap, funding, and public-listing preparedness. The post-period Clare Barclay
              appointment also suggests the board is still being actively assembled rather than already in a settled
