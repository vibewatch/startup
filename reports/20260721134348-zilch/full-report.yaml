  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization quality
        blocks:
          - type: paragraph
            body: >-
              The strongest audited conclusion is that Zilch no longer looks like a single-stream BNPL lender. Its
              FY2025 revenue base split across credit, transaction, feature, and advertising lines, with transaction
              plus advertising revenue already representing more than a quarter of the total. That matters because it
              lowers dependence on any one pricing lever and supports management's claim that the platform monetises
              both consumer credit activity and merchant attention. The rollout of Pay over 3 months appears financially
              important because management explicitly links it to higher average fees per transaction and a stronger mix
              of app-led journeys. Combined with the company's no-late-fee posture, the monetization story is less about
              penalising stressed consumers and more about merchant-funded economics, product mix, and higher-value
              journeys. The caution is that public sources do not disclose realized merchant fees or subsidy rates, so
              investors can see the outputs of diversification but not yet the contract-level economics underneath them.
