      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Zilch’s market has a three-sided economic structure. The user and borrower is the consumer who wants
              flexibility, zero-interest short-duration credit, rewards, or a smoother cash-flow profile. The payer is
              partly the same consumer for some fee-bearing or non-subsidised use cases, but Zilch’s differentiation
              depends on merchants and advertisers paying for customer acquisition, placement, and commissions so that
              the consumer cost stays lower than in card-led alternatives. A third capital provider layer—warehouse
              lenders and securitisation investors—funds receivables and therefore shapes how fast the product can
              scale. Adoption typically starts at checkout or inside a wallet app, moves through an eligibility and
              affordability screen, and then deepens if the user returns frequently enough for the provider to become a
              habitual spend destination rather than a one-off financing button. Merchant-side adoption depends less on
              abstract TAM language and more on measurable conversion uplift, repeat usage, and acquisition efficiency.
              This is why Zilch repeatedly frames itself as a direct-to-consumer media-and-payments network instead of a
              simple lender.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
