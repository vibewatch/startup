  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape across peer classes
        blocks:
          - type: paragraph
            body: >-
              Zilch is not only fighting a few branded BNPL logos at checkout. The company now sits in a layered field
              that includes direct BNPL specialists such as Klarna and Clearpay, wallet incumbents such as PayPal,
              account-linked instalment substitutes such as Monzo Flex, and the broader status quo of cards and
              regulated credit. That distinction matters because each class attacks Zilch differently. Klarna competes
              on breadth and scale, Clearpay on merchant distribution and pay-in-4 familiarity, PayPal on embedded reach
              and trust, and Monzo on an already-captive banking relationship. Public comparison sources also make clear
              that these products are no longer niche: Which? treats Klarna, Clearpay, PayPal and Zilch as the leading
              UK BNPL options, while independent guides increasingly group Monzo Flex and similar account-linked
              products into the same consumer decision set. The result is a market where the customer job—smoothing a
              purchase without defaulting to a traditional revolving credit card—can be solved through several delivery
              models that do not require Zilch specifically.
            claimRefs:
