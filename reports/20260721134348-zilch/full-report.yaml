  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is the core issue for this company in 2026. FCA supervision of BNPL is no longer an
              abstract future threat; it is now live, and the new regime forces firms to operate like regulated
              consumer-credit providers rather than light-touch checkout tools. For Zilch, that shift matters because
              its proposition combines flexible credit, card-led acceptance, consumer marketing, and merchant
              monetization. Public legal and regulatory sources make clear that firms must now show robust
              creditworthiness checks, intelligible key product information, proactive support for customers in
              difficulty, and complaints processes that can stand up to Financial Ombudsman scrutiny. Zilch has some
              visible mitigations, including an FCA payments licence, public support content, and a StepChange pathway
              for vulnerable users. But none of those remove the basic risk that a fast-scaling product business can
              fail the new conduct standard at the edges, especially if features such as Snooze, memberships, or
              longer-tenor products are not monitored tightly enough. Another subtle risk is timing: firms that were
              built for growth speed have to retrofit proof, auditability, and board-ready management information
              without impairing customer experience. In practice, that often becomes an execution test long before it
              becomes a headline enforcement event.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
