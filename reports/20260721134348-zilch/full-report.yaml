companyProfile:
  summary: >-
    Zilch is a London-headquartered consumer-payments platform founded in 2018 and publicly launched in 2020. It blends
    rewards-led debit, short-duration BNPL, newer pay-monthly credit, and merchant-funded offers inside a card-led
    wallet model intended to work online and in-store. Public evidence now shows meaningful audited revenue, more than 5
    million customers, and expanding merchant-facing products such as Intelligent Commerce and Zilch Pay, but the
    business remains private with limited disclosure on retention, concentration, and current private security terms.
