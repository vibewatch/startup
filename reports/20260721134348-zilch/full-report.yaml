      - number: '8.3'
        title: Comparable set and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The listed comp set gives a useful but sobering frame. Klarna is the best directional BNPL analogue
              because it combines scale, public-market scrutiny, and a still-fresh price signal. In July 2026 Klarna
              traded at roughly a little above 2x 2025 revenue, while Affirm carried a far richer double-digit multiple
              and mature payments platforms such as PayPal and Block sat much lower on a revenue basis than high-growth
              fintech narratives would suggest. This dispersion shows why Zilch cannot be valued by one lazy comp. If
              Zilch proves it is becoming a high-quality platform with resilient merchant economics, it can argue for a
              premium. If it looks more like a regulated credit-and-payments hybrid with thinner proof, its multiple
              should compress. The valuation debate is therefore about business quality under proof, not just about
              revenue growth headlines. In that sense, the comp work is a discipline tool. It stops investors from
              paying for every possible future at once and forces explicit thinking about what evidence is required to
              earn a richer multiple.
            claimRefs:
