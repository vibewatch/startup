  topStrengths:
    - Audited FY2025 revenue, improving losses, and 5M+ customer scale show Zilch is past the concept stage.
    - The model is differentiated versus classic BNPL because it combines card-led acceptance, rewards-led debit, and merchant-funded commerce economics.
    - Product expansion into payments licensing, Intelligent Commerce, and Zilch Pay creates plausible platform upside beyond plain instalment lending.
  topRisks:
    - UK BNPL regulation is now live, raising the burden on affordability, conduct, complaints handling, and outcome monitoring.
    - Public evidence remains thin on merchant retention, concentration, cohort durability, and post-regulation unit economics.
    - Cap-table terms, liquidation preferences, and partner concentration are still too opaque for high-conviction price underwriting.
  unresolvedGaps:
    - Merchant retention, renewal, and contribution-margin data for ASPN and Intelligent Commerce remain private.
    - Post-regulation unit economics, complaint trends, and Consumer Duty readiness evidence are not public.
    - Current cap-table terms, liquidation preferences, and downside protections are undisclosed.
disclaimer: This report is based on publicly available information as of 2026-07-21 and is not investment advice.
