companyProfile:
  summary: Zilch is a London-headquartered consumer-payments platform founded in 2018 and publicly launched in 2020. It blends
    rewards-led debit, short-duration BNPL, newer pay-monthly credit, and merchant-funded offers inside a card-led wallet
    model intended to work online and in-store. Public evidence now shows meaningful audited revenue, more than 5 million
    customers, and expanding merchant-facing products such as Intelligent Commerce and Zilch Pay, but the business remains
    private with limited disclosure on retention, concentration, and current private security terms.
  foundedDate: '2018-01-01'
  founders:
    - name: Philip Belamant
      role: Co-founder and CEO
      background: South African-born fintech entrepreneur leading Zilch's product, capital, and commercial strategy.
    - name: Serge Belamant
      role: Co-founder
      background: Payments and smart-card pioneer whose prior experience informs the company's card-led payments architecture.
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: Card-led consumer payments platform spanning pay now rewards, pay over 6 weeks, pay monthly, virtual and
    physical card acceptance, and newer merchant products such as Intelligent Commerce, ASPN, Zilch Travel, and Zilch Pay.
  customerFocus: UK mainstream consumers seeking flexible payments and rewards, plus merchants/brands using Zilch for customer
    acquisition, conversion, and ad-funded commerce flows.
  businessModel: Merchant-funded and ad-enabled payments network monetizing interchange-/payments-adjacent economics, merchant
    acquisition spend, and selected consumer membership/credit products.
  stage: Late-Stage Private (Unicorn)
  fundingStatus: November 2025 raise of more than $175M at a disclosed valuation above $1B, following earlier ~$2B-era financing
    and 2024 Deutsche Bank-led credit facility expansion.
