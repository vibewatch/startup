  - type: missing-source
    severity: material
    topic: merchant renewal and concentration
    missingEvidence: Top-merchant spend share, renewal rates, pilot-to-production conversion, and advertiser concentration for ASPN or Intelligent Commerce.
    whyItMatters: The merchant side of the flywheel could be concentrated even if consumer adoption looks broad.
    diligencePath: Request top-10 merchant concentration, renewal cohorts, and customer-acquisition economics by partner.
