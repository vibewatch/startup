- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Plus / Extra memberships
    - Paid-tier adoption may be narrower than headline user count
    - Could overstate monetizable loyalty
    - Request member counts, ARPU, and churn.
  - - Pay monthly / longer-tenor products
    - Higher-ticket usage may concentrate in smaller credit-eligible segments
    - Could weaken growth quality if take-up is shallow
    - Request penetration and loss rates by product.
  - - Merchant-funded offers / ASPN
    - Economics may depend on a small set of large advertisers
    - Revenue volatility and lower ROAS proof durability
    - Request top-10 merchant spend share and renewal rates.
  - - Travel expansion
    - Partner dependence on lastminute.com or similar channels
    - Category growth could be partner-concentrated
    - Request travel GMV split and partner economics.
  - - UK-heavy customer base
    - Geographic expansion proof remains limited
    - International upside may be less mature than narrative suggests
    - Request active-user split by geography and channel.
  notes: Expansion opportunities are real, but concentration disclosure is still thin.
