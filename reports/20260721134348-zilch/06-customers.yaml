company:
  name: Zilch
chapter:
  number: 6
  title: Customers
  summary: 'Zilch’s customer evidence is stronger than the average private fintech’s. Public materials support mass-market consumer adoption in the UK, named production use cases in destination retail and travel, and a high-volume review footprint that points to real repeat usage rather than a hollow signup story. The company has also evolved segmentation through memberships and broader payment options, giving it multiple levers to deepen share of wallet after first use. The weak spot is durability proof: there is still no public cohort, churn, NRR, GRR, or concentration disclosure robust enough to underwrite how sticky merchant demand or consumer loyalty would look through a harsher credit or macro cycle.'
sections:
- id: segments-and-scale
  title: Customer segments and scale
  body: 'Zilch’s customer base is broad rather than niche. The public evidence consistently describes a mainstream UK consumer audience that uses the product either for rewards-led debit spending or for short-duration interest-free credit, with newer longer-tenor options available based on eligibility. The help centre makes this segmentation more concrete by showing Standard, Plus, and Extra plans with different reward rates, support levels, and flexibility. That is important because it means the customer model is no longer just “everyone gets pay-in-4.” It is a tiered acquisition-and-expansion funnel. Scale is the strongest part of the story: official releases say Zilch moved beyond 5 million customers by May 2025 and equated that to one in seven UK working adults, while independent coverage earlier in the year had already put the user base at 4.5 million. Those numbers do not prove quality by themselves, but they do make it much harder to dismiss Zilch as a thinly adopted fintech brand.'
