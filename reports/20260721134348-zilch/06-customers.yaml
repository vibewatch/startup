- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer/user/payer
  - use case
  - scale
  - revenue/strategic value
  - gap
  rows:
  - - Mainstream UK consumers
    - Buyer=user=payer
    - Everyday spending, smoothing cash flow, rewards
    - Millions of registered users
    - Core transaction volume and brand reach
    - Need active-user and prime-segment mix.
  - - Eligibility-qualified credit users
    - Buyer=user=payer
    - Pay over 6 weeks / pay monthly
    - Subset of total base
    - Drives credit revenue and deeper wallet share
    - Need approval-rate and loss-rate split.
  - - Membership users (Plus / Extra)
    - Buyer=user=payer
    - Higher rewards, premium support, flexibility
    - Not disclosed
    - Subscription revenue and loyalty lever
    - Need paid-member count and churn.
  - - Travel shoppers
    - Buyer=user=payer
    - Flights, hotels, package bookings via Zilch Travel
    - Named product live
    - Expands into higher-ticket categories
    - Need travel GMV and repeat-booking rate.
  - - In-store destination shoppers
    - Buyer=user=payer
    - Tap-and-pay in physical retail destinations
    - Named proof at Bicester
    - Shows offline reach and zero-integration adoption
    - Need current in-store merchant count.
  notes: Segmentation is strong on use-case clarity but weak on denominator disclosure within each segment.
