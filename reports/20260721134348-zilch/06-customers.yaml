- id: named-proof
  title: Named customer proof and real-world use
  body: 'Public named proof is decent and notably better than simple logo pages. Bicester Village shows that Zilch can operate in a complex in-store retail environment without asking each merchant to integrate a bespoke point-of-sale connection, which matters for adoption outside conventional ecommerce checkout. Travel provides another tangible use case: lastminute.com powers Zilch Travel as a fully integrated white-label experience, indicating Zilch can attach itself to a higher-ticket category where flexible payments and rewards can shape purchase behaviour. StepChange is different but still important. It is not a paying merchant customer, yet it demonstrates that Zilch has built at least one operational path for vulnerable borrowers to receive outside help, which improves confidence that the customer experience includes more than growth marketing. The caveat is that most merchant-outcome evidence remains company-authored, so the named deployments prove use, but not full portfolio durability.'
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU029
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: repeat-usage-and-satisfaction
  title: Repeat usage, service quality, and satisfaction
  body: 'Retention is where the customer story shifts from strong to incomplete. On the positive side, Zilch’s own and secondary sources describe unusually frequent engagement: users reportedly open the app more than 25 times a month and transact about 60 times a year, which is much closer to habitual shopping behaviour than occasional emergency credit use. The review footprint also matters. Trustpilot alone shows more than 81,000 reviews and a 4.4 score, while review summaries emphasise flexibility, ease of use, benefits, and payment management. That does not make reviews a substitute for cohort data, but it is still meaningful evidence that many customers had enough real usage to leave detailed feedback. The downside is visible too: complaints cluster around payment confusion, inability to transfer funds, or inconsistent customer service responses. Meanwhile, the help centre proves dispute and support pathways exist, but it does not publish service quality metrics such as response time,
    resolution rate, or customer effort score. As a result, public evidence suggests real usage and mostly positive sentiment, yet still falls short of investor-grade retention transparency.'
  claimRefs:
  - CU010
  - CU011
  - CU018
  - CU019
