- id: expansion-and-concentration
  title: Expansion levers and concentration blind spots
  body: Zilch has multiple ways to deepen value after first acquisition. Memberships add premium rewards and support, pay-monthly products lift average ticket size, merchant-funded offers create repeat app-open behaviour, and travel or in-store use cases expand the footprint beyond standard ecommerce. In parallel, ASPN and Intelligent Commerce suggest the business wants consumers and merchants to reinforce each other in a closed-loop flywheel. That is strategically attractive because stronger engagement can improve both lending economics and advertiser demand. The unresolved issue is concentration. Public evidence does not say how dependent Zilch is on a small number of retailers, travel partners, or merchant-funded campaigns, and it also does not provide merchant NRR or renewal rates for newer media-like products. The customer thesis is therefore credible on growth and product breadth, but still partially blind on how concentrated or cyclical the underlying demand base may be.
  claimRefs:
