  evidenceGaps:
  - type: missing-source
    severity: material
    topic: consumer cohort retention
    missingEvidence: Public MAU/WAU, transacting-user share, repeat-purchase cohorts, and churn by product or membership tier.
    whyItMatters: Customer count alone cannot show whether the user base is deepening, flattening, or decaying beneath headline growth.
    diligencePath: Request monthly cohort tables by plan, product, and geography.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU025
    relatedTableRefs:
