- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Merchant-funded rewards and ads differentiate Zilch
    - Clearpay and Klarna are also building app discovery, rewards, and card surfaces
    - high
    - Request merchant ROI cohorts showing repeat usage, subsidy efficiency, and contribution margin by category.
  - - Card-led universal acceptance reduces merchant-integration dependence
    - PayPal and Monzo already own strong wallet or account distribution
    - high
    - Quantify active-card usage, repeat frequency, and share of volume coming from universal-acceptance journeys.
  - - Regulated posture should help under FCA rules
    - Large incumbents may benefit more because they have deeper compliance and funding resources
    - medium
    - Request pre/post-regulation operating-cost model and approval-rate deltas versus peers.
  - - No-late-fee consumer experience supports trust
    - Klarna and PayPal can match some fee-light messaging while offering broader product breadth
    - medium
    - Test whether no-late-fee policy increases retention or lowers loss-adjusted yield.
  - - Fast growth proves competitive momentum
    - High growth does not prove durable economics or low multi-homing
    - high
    - Request cohort overlap, merchant concentration, and CAC payback by acquisition channel.
  notes: The central diligence question is whether Zilch’s differentiation survives once product parity and regulation increase, not whether the company can win a headline growth narrative.
