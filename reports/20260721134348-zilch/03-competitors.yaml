  evidenceGaps:
  - type: missing-source
    severity: material
    topic: merchant pricing transparency
    missingEvidence: A like-for-like public schedule of merchant fees, subsidy rates, or MDRs across Zilch, Klarna, Clearpay, PayPal, and Monzo-linked instalment options.
    whyItMatters: Without clean pricing disclosure, investors cannot tell whether Zilch wins on actual unit economics or on branding and subsidy spend.
    diligencePath: Request merchant contracts, blended take rates, incentive schedules, and category-level commission terms for direct benchmarking.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: consumer overlap
    missingEvidence: Publicly disclosed overlap or exclusivity metrics between Zilch users and users of Klarna, Clearpay, PayPal, or Monzo Flex.
    whyItMatters: Registered-customer counts are overstated as a moat if the same users hold several BNPL accounts and switch opportunistically.
    diligencePath: Request cohort overlap studies, app-install overlap, and repeat-usage data by acquisition channel.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: material
    topic: merchant overlap and concentration
    missingEvidence: A category- and merchant-level view of where Zilch competes head-to-head with the same retailer base as Klarna, Clearpay, and PayPal.
    whyItMatters: Switching costs and pricing power depend on merchant overlap and category concentration, not just on total merchant logos.
    diligencePath: Request top-merchant lists, category GMV mix, and competitor co-installation data.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP004
  - type: private-evidence-only
    severity: material
    topic: merchant-media ROI
    missingEvidence: Internal proof that merchant-funded rewards and advertising yield better retention, conversion, or contribution margins than competitor offers.
    whyItMatters: This is the heart of the Zilch moat thesis and cannot be underwritten from public marketing copy alone.
    diligencePath: Review merchant cohort dashboards, contribution-margin analysis, and repeat-frequency data for reward-funded cohorts.
    relatedQuestionRefs:
    - QP018
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: regulation readiness benchmark
    missingEvidence: Internal benchmarking of approval rates, complaints operations, and compliance cost deltas versus major peers after July 2026 rules.
    whyItMatters: Public sources show the direction of travel, but not whether Zilch is genuinely ahead of Klarna, Clearpay, or PayPal in operational readiness.
    diligencePath: Request board-level regulatory readiness packs and post-rule operating metrics.
    relatedQuestionRefs:
    - QP021
