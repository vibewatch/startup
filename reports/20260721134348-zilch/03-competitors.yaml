- calloutType: risk
  title: PayPal’s distribution advantage is the hardest moat to dislodge
  body: Zilch can out-innovate on app experience or rewards, but PayPal starts one layer earlier in the purchase flow by already owning checkout identity for millions of users and merchants.
  claimRefs:
  - CP005
  - CP014
  - CP027
- calloutType: strength
  title: Zilch is more differentiated than a plain pay-in-4 clone
  body: The physical-card strategy, merchant-funded rewards, and no-credit-card-repayment stance give Zilch a more distinctive public story than many UK BNPL peers, even if that edge still needs economic proof.
  claimRefs:
  - CP008
  - CP020
  - CP021
  - CP025
- calloutType: insight
  title: Competitive victory depends on proving merchant-media economics, not just user growth
  body: If merchant-funded rewards and advertising do not translate into better retention or contribution margins, the category likely compresses toward whichever player has the most scale, trust, and funding.
