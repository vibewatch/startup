  figureRefs: []
- id: moat-and-risk
  title: Moat durability and commoditization risk
  body: 'The most important adverse conclusion is that Zilch’s moat is still conditional. Regulation may help disciplined operators by eliminating weaker competitors and forcing the category into more consistent affordability, complaints, and credit-reporting standards. Zilch’s payments licence and already-regulated posture could therefore matter at the margin. But the same regulatory tightening also standardises the category and makes it easier for buyers to compare products on familiar credit dimensions rather than on novelty. That pushes the market toward scale, capital, trust, and distribution—areas where Klarna and PayPal remain stronger on public evidence. Public merchant pricing is also too opaque to prove that Zilch wins on economics rather than on narrative, and rivals such as Clearpay and Klarna are already encroaching on app, rewards, and card-led territory. The strategic implication is clear: Zilch must prove that merchant-media economics create measurable repeat wallet share
    and better unit economics, or else the category risks collapsing into a mostly commoditised set of well-regulated instalment interfaces.'
