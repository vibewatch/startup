- id: switching-distribution
  title: Switching cost, multi-homing, and distribution power
  body: The structural problem for every standalone BNPL brand is that both consumers and merchants can multi-home. Which? notes that some retailers have offered as many as six BNPL schemes at checkout, which means the shopper often picks from what is already displayed rather than from deep loyalty to a single provider. That dynamic weakens consumer lock-in and raises the importance of distribution power. PayPal is strongest here because it converts an existing wallet login into a pay-later option. Klarna is strongest among specialists because it combines merchant reach, app discovery, and brand recognition at scale. Clearpay’s retailer network and consumer-frequency claims support a similar, if narrower, distribution moat. Zilch’s card-based universal acceptance and merchant-funded rewards strategy are clever responses to this problem because they seek to escape pure merchant-by-merchant integration dependence. But public evidence still does not quantify overlap between Zilch’s customers
    or merchants and those of its largest rivals, so any precise switching-cost narrative remains more hypothesised than proven.
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
  - CP028
