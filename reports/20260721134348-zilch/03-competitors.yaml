- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider
  - core public plan
  - consumer fee model
  - ticket / repayment model
  - merchant economics disclosure
  - implication
  rows:
  - - Zilch
    - Pay now rewards; pay over 6 weeks; pay over 3 months
    - Annual report says no interest and no late fees on customer loans
    - Short-duration instalments; broader acceptance via card strategy
    - Not publicly transparent enough to benchmark MDR or subsidy rates
    - Great consumer headline but investor cannot verify merchant-margin durability publicly.
  - - Klarna
    - Pay in full, 30 days, 3 instalments, financing
    - Interest-free short plans; financing at 21.9% APR; late fees may apply on some plans
    - 3 instalments, 30 days, or 6-24 months financing
    - Merchant pricing not publicly disclosed in a comparable UK schedule
    - Breadth is a strategic advantage even if merchant pricing remains opaque.
  - - Clearpay
    - Pay in 4 over 6 weeks
    - £6 late fee plus potential second £6 for eligible orders; caps apply
    - Four instalments; digital-wallet card for in-store
    - Merchant benefits are marketed, but fee schedules are not fully public
    - Consumer simplicity is high, but late-fee optics are worse than Zilch or PayPal.
  - - PayPal
    - Pay in 3 and Pay in 30
    - 0% and no late fees in core pay-later products
    - £20-£3,000 for Pay in 3; one repayment after 30 days or three instalments
    - PayPal discloses terms but not a clean merchant BNPL fee benchmark
    - Distribution and trust may outweigh narrower standalone feature depth.
  - - Monzo Flex
    - 0% in 3 months plus longer-tenor card options
    - 0% on 3-month option; APRs on other variants
    - Card-linked instalments, primarily for existing users
    - No merchant economics because it rides card/account relationship
    - Strong substitute for card users, weak direct substitute for merchant-funded checkout marketing.
  notes: This table is intentionally partial on merchant fees because public sources describe product terms much more clearly than commercial pricing.
