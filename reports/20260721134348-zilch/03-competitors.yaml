tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Zilch
    - Direct UK BNPL / wallet hybrid
    - 5.0m FY2025 registered customers; 5.3m+ by late 2025
    - UK consumer shoppers and merchants seeking rewards plus instalments
    - Merchant-funded rewards, card-led general acceptance, no-credit-card-repayment stance
    - Public merchant count, overlap, and unit economics remain weakly disclosed
  - - Klarna
    - Direct BNPL specialist / money app
    - 119m users worldwide; 1m+ merchants
    - Mass-market consumers and merchants wanting several payment modes
    - Broadest product stack, strong app, memberships, cashback, financing
    - Late-fee exposure and larger organisation can reduce simplicity relative to Zilch
  - - Clearpay
    - Direct BNPL specialist / merchant network
    - 200k active merchant partners globally; large UK retailer footprint
    - Fashion and lifestyle merchants plus frequent short-cycle shoppers
    - Pay in 4 simplicity, app discovery, merchant acquisition pitch, in-store wallet card
    - More concentrated around pay-in-4 than broader wallet economics
  - - PayPal Pay Later
    - Wallet incumbent
    - Embedded in existing PayPal checkout and account base
    - Merchants already using PayPal and consumers valuing buyer protection
    - Distribution, trust, Pay in 3 + Pay in 30, no late fees
    - Less differentiated as a standalone destination or shopping app
  - - Monzo Flex
    - Bank-linked instalment substitute
    - 15m personal and business customers at Monzo group level
    - Existing Monzo users wanting card-linked instalments
    - Primary banking relationship, instant app controls, 0% in 3 months
    - Requires Monzo account and does not itself create merchant acquisition demand
  - - Paidy
    - Adjacent global benchmark
    - 700k+ merchants in Japan
    - Consumers wanting post-pay via email/phone identity
    - Shows general-acceptance post-pay model can scale without a traditional UK BNPL framing
    - Japanese market context is not directly transferable to UK regulation or merchant economics
  notes: Scale metrics use whichever public KPI each provider actually discloses; they are not perfectly comparable and should be read as orientation rather than a rank-ordered market-share table.
