company:
  name: Zilch
chapter:
  number: 3
  title: Competitors
  summary: Zilch competes in a crowded UK pay-over-time arena where product parity is rising faster than durable moats. Klarna remains the broadest direct specialist, Clearpay is strong in merchant distribution and in-store pay-in-4, PayPal brings the most embedded checkout reach, and Monzo Flex shows how bank-linked instalments can absorb the same use case without merchant acquisition. Public evidence suggests Zilch’s distinctive angle is merchant-funded rewards plus general card acceptance, but that edge is still strategically narrower than it sounds because rivals also offer wallet cards, discovery surfaces, and broader consumer-finance ecosystems. The investability question is therefore not whether Zilch has competitors—it clearly does—but whether its merchant-media economics can stay differentiated as regulation, credit-bureau reporting, and consumer UX increasingly standardise the category.
sections:
- id: competitive-classes
  title: Competitive landscape across peer classes
  body: 'Zilch is not only fighting a few branded BNPL logos at checkout. The company now sits in a layered field that includes direct BNPL specialists such as Klarna and Clearpay, wallet incumbents such as PayPal, account-linked instalment substitutes such as Monzo Flex, and the broader status quo of cards and regulated credit. That distinction matters because each class attacks Zilch differently. Klarna competes on breadth and scale, Clearpay on merchant distribution and pay-in-4 familiarity, PayPal on embedded reach and trust, and Monzo on an already-captive banking relationship. Public comparison sources also make clear that these products are no longer niche: Which? treats Klarna, Clearpay, PayPal and Zilch as the leading UK BNPL options, while independent guides increasingly group Monzo Flex and similar account-linked products into the same consumer decision set. The result is a market where the customer job—smoothing a purchase without defaulting to a traditional revolving credit
    card—can be solved through several delivery models that do not require Zilch specifically.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
