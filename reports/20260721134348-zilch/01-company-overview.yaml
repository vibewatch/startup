company:
  name: Zilch
chapter:
  number: 1
  title: Company Overview
  summary: Zilch is a London-headquartered UK consumer-payments and BNPL platform founded in 2018 and publicly launched in 2020. The company positions itself as an ad-enabled or ad-subsidised payments network rather than a conventional late-fee-led BNPL lender, using merchant-funded economics, rewards, and regulated instalment credit to acquire consumers and monetise retailer demand. Audited FY2025 results showed £110.3 million of revenue, £1.893 billion of GMV, 5 million registered customers, and a sharply reduced £10.5 million net loss, while later company updates pushed customer count above 5.3 million and announced a $176.7 million debt-and-equity raise in November 2025. The core diligence tension is that Zilch has real scale and improving economics, but still depends on warehouse funding, regulatory execution, and management claims for several current-state metrics such as valuation and merchant count.
sections:
- id: identity-model-scale
  title: Identity, model, and current scale
  body: 'Zilch was founded in 2018 and launched publicly in the UK in 2020 as a consumer payments platform built around regulated, interest-free instalment credit plus debit-style rewards. The company is headquartered in London and describes its mission as eliminating the high cost of consumer credit. What differentiates Zilch from classical BNPL providers is the emphasis on its ad-enabled payments network: management argues that merchants and advertisers, not just borrowers, subsidise the economics through commissions, placement fees, and advertising. That matters because it gives Zilch a different unit-economics story from peers that depend more directly on merchant discount plus late-fee income. Audited FY2025 accounts showed £110.3 million revenue on £1.893 billion GMV with 49% gross margin, while later 2025 company updates said the platform had surpassed 5.3 million customers and processed more than £5 billion of commerce. The current product stack spans Pay Now debit-style payments
    with rewards, Pay over 6 weeks, Pay over 3 months, a growing merchant-media layer, and newer category products such as travel. The evidence supports genuine scale and product breadth, but several headline numbers remain company-asserted rather than verified through an independently filed public-market disclosure.'
