  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current fully diluted private valuation, round structure, and investor-rights package after the November 2025 raise.
    whyItMatters: Entry price and preference stack are central to any venture-return analysis and cannot be inferred reliably from marketing language alone.
    diligencePath: Request the latest cap table, financing documents, and board materials summarising post-round ownership and preferences.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: material
    topic: merchant count / TO003
    missingEvidence: A dated, independently corroborated current merchant-partner count.
    whyItMatters: Merchant breadth is core to network effects, conversion claims, and ad-subsidy durability, but public materials only say “thousands” or cite selected brands.
    diligencePath: Request a current merchant cohort breakdown by active merchants, subsidised merchants, and top-merchant concentration.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: board independence
    missingEvidence: Current post-June-2026 board committee composition and formal independence assessments.
    whyItMatters: Listing-readiness and governance maturity depend on committee design, not just appointment headlines.
    diligencePath: Request current board pack, committee charters, and governance org chart.
    relatedQuestionRefs:
    - QO007
  - type: private-evidence-only
    severity: material
    topic: warehouse funding
    missingEvidence: Detailed securitisation covenants, advance rates, borrowing-base rules, and triggers.
    whyItMatters: Debt availability is operationally foundational to Zilch’s underwriting capacity and could tighten in stress scenarios.
    diligencePath: Review the warehouse agreement, reporting package, and lender monitoring thresholds.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: minor
    topic: international traction / TO004
    missingEvidence: A clear, current public disclosure of live US-market customer, GMV, and revenue contribution.
    whyItMatters: Several partner and company materials reference US infrastructure or earlier launch plans, but current commercial relevance is unclear.
    diligencePath: Request geographic revenue/GMV split and current live-market summary by country.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
