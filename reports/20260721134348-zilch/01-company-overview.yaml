- id: capital-milestones-and-open-points
  title: Capital history, milestones, and open diligence points
  body: 'Zilch’s capital story moved from venture-backed challenger to debt-supported scale-up. The annual report records Series A, B, and C equity rounds between 2020 and 2022, while 2024 introduced a more consequential warehouse-finance phase: the company refinanced into a new Deutsche Bank-led securitisation in June 2024, then expanded the facility to £150 million in October with an ability to scale to £400 million. That funding underpins the receivables book and is therefore operationally important, not just incremental balance-sheet support. November 2025 then brought a new $176.7 million debt-and-equity raise led by KKCG with participation from BNF Capital and the expanded Deutsche Bank line. On the operating side, 2024-2025 milestones included the Pay over 3 months launch, Checkout.com becoming primary global acquirer, FT/Deloitte recognition for growth, Visa partnership and physical-card launch plans, Zilch Travel, and an FCA payments licence in December 2025. The main remaining
    overview-level gaps are the exact current private valuation after the late-2025 raise, precise merchant-partner count, full current cap table, and independently verified traction of the newer international and product-expansion initiatives. That gap is especially important because later valuation work depends less on whether Zilch is a legitimate scale asset—which the evidence supports—and more on the exact terms on which that scale has been financed. Public materials are unusually helpful on operating milestones, but still too thin on control rights, debt covenants, and post-round dilution to substitute for direct investor diligence.'
