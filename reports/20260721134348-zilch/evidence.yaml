evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Current fully diluted private valuation, round structure, and investor-rights package after the November 2025
      raise.
    whyItMatters: >-
      Entry price and preference stack are central to any venture-return analysis and cannot be inferred reliably from
      marketing language alone.
    diligencePath: >-
      Request the latest cap table, financing documents, and board materials summarising post-round ownership and
      preferences.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: material
    topic: merchant count / TO003
    missingEvidence: A dated, independently corroborated current merchant-partner count.
    whyItMatters: >-
      Merchant breadth is core to network effects, conversion claims, and ad-subsidy durability, but public materials
      only say “thousands” or cite selected brands.
    diligencePath: >-
      Request a current merchant cohort breakdown by active merchants, subsidised merchants, and top-merchant
      concentration.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: board independence
    missingEvidence: Current post-June-2026 board committee composition and formal independence assessments.
    whyItMatters: Listing-readiness and governance maturity depend on committee design, not just appointment headlines.
    diligencePath: Request current board pack, committee charters, and governance org chart.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: warehouse funding
    missingEvidence: Detailed securitisation covenants, advance rates, borrowing-base rules, and triggers.
    whyItMatters: >-
      Debt availability is operationally foundational to Zilch’s underwriting capacity and could tighten in stress
      scenarios.
    diligencePath: Review the warehouse agreement, reporting package, and lender monitoring thresholds.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: minor
    topic: international traction / TO004
    missingEvidence: A clear, current public disclosure of live US-market customer, GMV, and revenue contribution.
    whyItMatters: >-
      Several partner and company materials reference US infrastructure or earlier launch plans, but current commercial
      relevance is unclear.
    diligencePath: Request geographic revenue/GMV split and current live-market summary by country.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: zilch sam / som
    missingEvidence: A company-verified bottom-up SAM or SOM for Zilch within UK BNPL and adjacent wallet payments.
    whyItMatters: Without a defined SAM/SOM, valuation relies on top-down category narratives that may overstate addressable demand.
    diligencePath: Request management market-sizing deck with cohort-level penetration logic and current active-user segmentation.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: channel mix
    missingEvidence: A disclosed split of Zilch volume and users by online, in-store, app-initiated, and physical-card channels.
    whyItMatters: Wallet-share expansion depends on channel mix, not just registered-user count.
    diligencePath: Request 12-month GMV and active-user mix by channel plus monthly trend.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: merchant economics
    missingEvidence: Merchant cohort data showing conversion uplift, acquisition cost, subsidy rate, and retention by category.
    whyItMatters: Zilch’s differentiated market thesis depends on merchant-funded economics rather than pure lending spreads.
    diligencePath: Review merchant ROI dashboards and category-level commercial terms.
    relatedQuestionRefs:
      - QM012
  - type: private-evidence-only
    severity: material
    topic: approval-rate impact
    missingEvidence: Modeled effect of July 2026 affordability and creditworthiness rules on approval rates and active customer growth.
    whyItMatters: Regulation could materially shrink the reachable customer base or raise acquisition costs.
    diligencePath: Request pre/post-rule scenario modelling from risk and compliance teams.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: minor
    topic: young user risk
    missingEvidence: Internal plan-stacking, vulnerable-customer, and repeat-use monitoring data for younger cohorts.
    whyItMatters: Sector-level loan-stacking concerns may or may not map onto Zilch’s specific portfolio quality.
    diligencePath: Request cohort-level delinquency and concurrent-plan distribution metrics.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: merchant pricing transparency
    missingEvidence: >-
