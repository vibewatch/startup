- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple/valuation/status
  - relevance
  - limitation
  rows:
  - - Klarna
    - 2025 revenue $3.5B; Jul-2026 market cap ~$7.2B
    - ~2x revenue
    - Closest public BNPL / flexible-payments analogue with live market price
    - Larger scale and public-company controls make it a harsher benchmark.
  - - Affirm
    - FY2025 revenue $2.33B; Jul-2026 market cap ~$25B
    - Double-digit revenue multiple
    - Shows how public markets can reward higher-growth fintech narratives
    - US-centric and structurally different in product mix and credit perception.
  - - PayPal
    - 2025 revenue $33.17B; Jul-2026 market cap ~$49B
    - Low-single-digit revenue multiple
    - Frames mature payments downside boundary
    - Too mature and diversified to map directly onto Zilch.
  - - Block
    - 2025 revenue $24.19B; Jul-2026 market cap ~$48B
    - ~2x revenue
    - Frames lower-multiple payment / commerce infrastructure comp
    - Business mix is much broader than BNPL or wallet-led credit.
  notes: Comparable set is intentionally mixed because no single comp captures Zilch’s hybrid model.
  enumerationScope:
    coverage: exhaustive
    basis: 'Covers the four most decision-useful public comparables found in this run: the closest BNPL analogue, the richest growth-fintech analogue, and two mature payment-platform boundary comps.'
