company:
  name: Zilch
chapter:
  number: 8
  title: Valuation
  summary: Zilch is easier to believe as a company than as a valuation. Public evidence supports a real and differentiated fintech with audited revenue, improving losses, broad customer reach, and plausible upside from merchant-media and payments infrastructure expansion. What it does not support is casual pricing. The latest $1B+ valuation may be reasonable as a selective, price-sensitive entry point if Zilch can keep compounding while complying with the new FCA regime, but the evidence base is still too incomplete on retention, concentration, and cap-table structure to justify a clean buy recommendation. The right lens is disciplined interest with a willingness to pass if the private data do not prove the platform story.
sections:
- id: thesis-vs-anti-thesis
  title: Investment thesis versus anti-thesis
  body: 'The bullish case for Zilch is intellectually coherent. The company has real audited revenue, a differentiated merchant-funded model, improving credit-loss optics, and product breadth that could let it earn a better multiple than a plain BNPL lender. Intelligent Commerce, Zilch Pay, payments licensing, and card-led acceptance together support a thesis that Zilch is trying to become a wider payments-and-commerce operating layer. The anti-thesis is just as important: most of the valuation premium rests on optionality that still lacks mature public proof. There is not enough external evidence yet on merchant renewal, retention, concentration, or post-regulation unit economics to pay blindly for the platform narrative. That is why the right answer is not “great company, therefore buy”; it is “interesting company, therefore price matters a lot.”'
  claimRefs:
  - CV005
  - CV006
  - CV014
  - CV015
  - CV016
  - CV031
  - CV034
  tableRefs:
  - TV001
  - TV002
