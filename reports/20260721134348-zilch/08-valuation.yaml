- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Regulatory or conduct weakness
    - Material FCA remediation, poor complaint trend, or affordability evidence gap
    - Breaks premium-platform narrative and increases cost of capital
    - Pause or pass.
  - - Credit deterioration
    - Reversal in loss trend or worsening delinquency quality
    - Damages both economics and public-market credibility
    - Recut downside case and demand lower price.
  - - Merchant traction weakness
    - Poor pilot conversion, renewal, or advertiser durability
    - Undercuts merchant-media optionality
    - Move valuation toward mature or lower-quality financial-services comps.
  - - Partner concentration or outage evidence
    - Major single-point dependency or adverse renegotiation
    - Raises fragility discount and weakens exit readiness
    - Increase discount rate and narrow price range.
  notes: These are the trigger points most likely to change the investment call rather than merely the narrative tone.
  claimRefs:
  - CV037
  - CV038
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Merchant retention
    - Renewal cohorts, spend retention, pilot-to-production conversion
    - Proves whether merchant-media upside is real or narrative-heavy
    - Request sales / finance cohort pack.
  - - Consumer durability
    - Active-user cohorts, repayment behaviour, churn by product and plan
    - Separates headline customer count from durable usage
    - Request product / risk cohort dashboard.
  - - Regulation and controls
    - Consumer Duty MI, complaint trend, affordability governance
    - Determines whether valuation should reflect premium or penalty
    - Request compliance readiness pack.
  - - Cap table and preferences
    - Current investor rights, liquidation preferences, dilution waterfalls
    - Affects real entry economics and downside protection
    - Request legal cap-table package.
  - - Partner concentration
    - Top counterparty exposure, SLAs, fallback architecture
    - Determines fragility discount and business continuity confidence
    - Request infrastructure and treasury concentration review.
  notes: These asks are the minimum set needed to turn directional interest into an investable underwriting view.
  claimRefs:
  - CV018
  - CV032
  - CV037
  - CV040
