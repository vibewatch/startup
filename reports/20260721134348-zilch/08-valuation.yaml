- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - what would change the view
  rows:
  - - Merchant-funded model plus payments / data stack can justify a better multiple than plain BNPL
    - Need audited proof of merchant retention, contribution economics, and regulatory-grade controls.
  - - Customer scale and improving loss profile show a real business, not a concept asset
    - Would weaken if credit metrics reverse or active-user quality disappoints.
  - - Platform optionality from Intelligent Commerce and Zilch Pay could create multiple expansion
    - Would strengthen only after measurable adoption and merchant spend durability.
  - - Current public evidence is still too thin on concentration, cap table, and private terms
    - Would improve with board pack, data room, and investor-rights visibility.
  notes: The anti-thesis is serious enough that recommendation and price discipline should move together.
