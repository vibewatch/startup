- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Strong revenue growth, merchant-media traction, compliance proof, improving losses
    - 'Range: $1.4B-$1.8B; upside comes from earning a premium growth-fintech multiple'
    - Merchant retention or control failures undermine rerating
    - Needs several private-data upgrades to become credible.
  - - Base
    - Growth continues, but proof gaps remain and multiple stays disciplined
    - 'Range: $0.9B-$1.2B; roughly anchored around latest financing with limited rerating'
    - Control costs, moderate multiple compression, concentration uncertainty
    - Most consistent with current public evidence.
  - - Bear
    - Regulatory drag, weaker credit outcomes, or disappointing merchant traction
    - 'Range: $0.5B-$0.8B; valuation compresses toward lower-quality financial-services comps'
    - Round terms and preferences can worsen effective outcome
    - Plausible if optionality premium evaporates.
  notes: Ranges are broad by design because the public record is not sufficient for narrow point estimates.
