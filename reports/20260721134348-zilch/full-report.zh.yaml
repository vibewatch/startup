      - number: '1.3'
        title: 资本历史、里程碑和未决尽调点
        blocks:
          - type: paragraph
            body: >-
              Zilch 的资本故事从风投支持的挑战者，走到依赖债务支撑的规模化公司。年报记录了 2020 至 2022 年的 Series A、B、C 股权轮；到 2024 年，更关键的是仓储融资阶段：公司在 2024 年
              6 月再融资，接入 Deutsche Bank 牵头的新证券化结构，随后 10 月把额度扩至 £150 million，并可扩至 £400
              million。该融资支撑应收款账本，因此是运营核心，不只是资产负债表上的增量支持。2025 年 11 月又出现 KKCG 领投的新一轮 $176.7 million 债务和股权融资，BNF Capital
              以及扩大的 Deutsche Bank 额度参与。运营侧，2024-2025 的里程碑包括 Pay over 3 months 上线、Checkout.com 成为主要全球收单方、FT/Deloitte
              增长认可、Visa 合作和实体卡发行计划、Zilch Travel，以及 2025 年 12 月取得 FCA 支付牌照。概况层面剩下的主要缺口，是 2025
              年末融资后的确切当前私人市场估值、精确商户伙伴数量、完整当前股权结构表，以及较新的国际化和产品扩张举措经独立验证的牵引力。这个缺口尤其重要，因为后续估值工作更少取决于 Zilch
              是否已是真实的规模化资产——证据支持这一点——更多取决于这种规模是以什么条款融出来的。公开材料对运营里程碑异常有帮助，但在控制权、债务契约和轮后稀释方面仍太薄，不能替代投资人的直接尽调。
