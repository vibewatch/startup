      - number: '2.4'
        title: 增长驱动、约束和 2026 年监管重置
        blocks:
          - type: paragraph
            body: >-
              这个市场最强的需求驱动很清楚：生活成本压力、App 原生支付的便利、商户对更高转化的需求，以及购物向钱包和嵌入式支付迁移。但约束同样关键。FCA 文件、Treasury
              更新和独立评论都强调，隐藏债务、薄弱前置信息和不足的负担能力检查，是 BNPL 自 2026 年 7 月起被纳入全面监管的原因。FCA 分析称，递延支付信贷用户比总体人群更可能陷入财务困难；Business
              Expert 突出年轻用户的贷款叠加。由此形成的制度会增加负担能力检查、Financial Ombudsman 通道、Consumer Duty 预期，以及符合条件购买的 section 75
              式保护，所有这些都会让 BNPL 更像主流受监管信贷。对 Zilch
              而言，这可能是相对优势，因为它较早进入监管和征信报告；但它也会提高合规成本、潜在排除较弱申请人，并提高稳健承保和融资纪律的重要性，从而收窄增长打法。
