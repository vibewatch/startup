    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Zilch 把消费者需求、商户出资经济性、仓储融资和受监管支付基础设施连成一个增长飞轮。
    data:
      nodes:
        - id: consumers
          label: 5.0m-5.3m+ 客户
          detail: 庞大消费者基数拉动交易频次、第一方数据和营销价值。
          tone: positive
        - id: merchants
