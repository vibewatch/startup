companyProfile:
  summary: >-
    Zilch 是一家总部位于伦敦的消费者支付平台，成立于 2018 年，并于 2020 年公开上线。它在以卡为核心、面向线上和线下使用的钱包模式里，融合了奖励驱动的借记支付、短期
    BNPL、较新的按月还款信贷，以及商户资助优惠。公开证据现在显示，Zilch 已有可观的经审计收入、超过 5 million 客户，并在拓展 Intelligent Commerce、Zilch Pay
    等面向商户的产品；但公司仍为私营，对留存、集中度和当前私募证券条款披露有限。
