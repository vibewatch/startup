            body: >-
              Zilch 的模式以一种很具体的方式吃资本：它更需要为应收款增长提供周转资金，而不是硬件资本开支或巨额固定资产。FY2025
              消费者贷款应收款几乎翻倍，而这项增长得到了进一步证券化提款的实质性支持。因此，Deutsche
              牵头的再融资和后续额度扩张不是旁注，而是核心金融基础设施。管理层认为，这条债务额度提高资本效率并降低融资成本；经审计数字至少支持部分说法，因为相对收入的利息费用改善，年末现金也更高。2025 年末 $175m
              综合融资进一步强化了资产负债表。即便如此，公开证据仍不足以做正式现金跑道分析，因为债务余量、股权准入和调整后经营现金流已有披露，但管理层没有给出现金跑道月数桥。合适的表述是，资本充足性有所改善，但尚未完全去风险。
