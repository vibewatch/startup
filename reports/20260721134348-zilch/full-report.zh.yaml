            body: >-
              公开证据足以支持投资叙事的正向更新，但还不足以关闭一个完整承销案例。Zilch 显然改善了业务形态：收入质量看起来好于典型重滞纳金的 BNPL
              提供商，毛利率和经营杠杆大幅改善，调整后经营现金流转正。不过，模型仍依赖应收款融资、有利资本市场准入，以及在更高毛利商户和广告经济上的持续执行。因此，下一步尽调不是争论财务进展是否真实——它是真实的——而是测试这种改善在更大规模和更严监管下是否可持续。实际商户定价、队列
              CAC 回本、现金跑道月数和扣除损失后的贡献利润率可见度不足，使今天还无法给出完全自信的承销结论。另一个有用的佐证点是，合作伙伴案例研究已经描述 Zilch
              正在搭建更多可带来收入的界面，如店铺展示位、旅行和收单基础设施；这与经审计的多元化故事相符，尽管精确经济性仍属私有。
