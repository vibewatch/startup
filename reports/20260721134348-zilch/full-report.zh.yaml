  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险是这家公司 2026 年的核心问题。FCA 对 BNPL 的监管已不再是抽象的未来威胁；新制度已经生效，并迫使公司像受监管消费者信贷提供商一样运营，而不是像轻触式结账工具。对 Zilch
              而言，这一转变很重要，因为它的主张结合了灵活信贷、卡基受理、消费者营销和商户变现。公开法律和监管来源明确显示，公司现在必须拿出稳健的信用状况检查、易懂的关键产品信息、主动支持困难客户，以及经得起
              Financial Ombudsman 审查的投诉流程。Zilch 有一些可见缓释措施，包括 FCA 支付牌照、公开支持内容，以及面向脆弱用户的 StepChange
              路径。但这些都不能消除一个基本风险：快速扩张的产品业务可能在边缘场景达不到新行为标准，尤其当
              Snooze、会员或更长期限产品没有被足够严密监控时。另一个更隐蔽的风险是时点：为增长速度而搭建的公司，必须在不伤害客户体验的情况下补上证明、可审计性和董事会可用管理信息。实践中，这往往先成为执行测试，远早于成为头条执法事件。
