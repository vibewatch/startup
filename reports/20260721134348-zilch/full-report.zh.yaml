            body: >-
              公司正在同时做几件困难的事：吸收新监管制度，扩展到一键结账和商户
              AI，深化会员，并守住正在改善的信用经济性。这让人员和执行风险比简单的某个时点损失率更重要。创始人主导的文化可以在产品和融资上很有决定力，但如果控制建设落后于商业野心，同样的速度也会变成治理问题。正确反应不是假定失败，而是预先定义硬性退出标准和监测规则。如果负担能力证据转弱、投诉升级、伙伴宕机浮现，或商户留存无法支撑平台叙事，投资逻辑就应迅速改变。Zilch
              有可见缓释措施，但举证责任现在落在可衡量的运营纪律上，而不是愿景式产品定位上。因此，投资人应坚持持续证据，而不是一次性承诺。真正的问题是，管理层能否足够快地暴露新出现的行为、投诉和依赖问题，以便在它们变成资本或监管事件前调整。
