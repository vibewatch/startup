        title: 客户细分和规模
        blocks:
          - type: paragraph
            body: >-
              Zilch 的客户基础广而非窄。公开证据一贯描述其面向英国主流消费者：用户要么用它做奖励驱动的借记消费，要么用它做短期免息信贷；较新的更长期限选择则基于资格开放。帮助中心通过 Standard、Plus 和
              Extra 计划把这种分层说得更具体，不同计划有不同奖励率、支持水平和灵活性。这一点重要，因为客户模型已不再是「人人都拿 pay-in-4」。它是一个分层获客和扩张漏斗。规模是故事里最强的部分：官方发布称
              Zilch 到 2025 年 5 月已超过 5 million 客户，并称相当于每 7 名英国劳动年龄成年人中就有 1 名；年初独立报道已把用户基础放在 4.5
              million。这些数字本身不能证明质量，但确实让人更难把 Zilch 视为采用度很浅的金融科技品牌。
