  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Zilch 的乐观情景逻辑上站得住。公司有真实且经审计的收入、差异化的商户出资模式、持续改善的信用损失观感，也有更宽的产品边界；这些因素可能让它拿到高于普通 BNPL 放贷机构的倍数。Intelligent
              Commerce、Zilch Pay、支付牌照和以卡为核心的受理能力，共同支撑一个投资逻辑：Zilch
              正试图做成更宽的支付与商业运营层。反向逻辑同样重要：大部分估值溢价仍押在可选性上，而成熟的公开证据还不够。商户续约、留存、集中度和监管后单位经济，外部证据都不足以让投资人盲目为平台叙事买单。因此，正确答案不是“公司很好，所以买入”；而是“公司有意思，所以价格非常重要”。
            claimRefs:
