  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: 受限的英国测算视角比单一巨大 TAM 更可信：年度活跃用户和受监管 DPC 交易额，比夸大的总量预测更重要。
    data:
      nodes:
        - label: 英国曾使用 BNPL 人群
          detail: Business Expert 估计，到 2026 约 29.9m 英国成年人（54%）使用过 BNPL。
        - label: 年度活跃 BNPL 用户
          detail: FCA Financial Lives 数据显示，截至 May 2024 的 12 个月内，有 10.9m 成年人使用了未受监管 BNPL。
        - label: 2024 英国 DPC 交易额
          detail: FCA 政策材料显示，2024 纳入受监管范围的交易额超过 £13bn。
        - label: Zilch 披露客户基数
