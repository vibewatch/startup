  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代方案
        blocks:
          - type: paragraph
            body: >-
              对 Zilch 更合适的市场定义，是嵌入更广泛数字消费者支付中的英国第三方递延支付信贷。FCA 政策文件将递延支付信贷定义为用于购买商品或服务的免息信贷，并在 12 个月或更短时间内以 12
              期或更少期数偿还。这个边界重要，因为它纳入 Klarna、Clearpay、PayPal Pay Later 式产品和 Zilch
              自身受监管分期产品等商户集成的延后支付产品，但排除普通借记卡消费、循环信用卡，以及贷款方和商户同一主体时的商户提供分期信贷。Zilch
              还把借记奖励、虚拟卡受理和商户媒体变现打包进同一个钱包体验，从而拉伸了这个类别。因此，现状替代集合比传统 BNPL
              更宽：信用卡、借记卡、透支、大额购买的个人贷款，以及越来越多的通用数字钱包，都在争夺同一个结账场景。这个市场最好按支付 + 信贷切口来分析，而不是当作孤立的借贷小众市场。
