  - id: TV005
    title: 投资逻辑破坏与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 监管或行为合规弱点
        - 重大 FCA 整改、投诉趋势差，或负担能力证据缺口
        - 打破平台溢价叙事，并推高资本成本
        - 暂停或放弃。
      - - 信贷恶化
        - 损失趋势反转，或逾期质量恶化
        - 同时伤害经济性和公开市场可信度
        - 重切下行情景，并要求更低价格。
      - - 商户牵引力不足
        - 试点转化、续约或广告主韧性差
        - 削弱商户媒体可选性
        - 把估值推向成熟或低质量金融服务可比公司。
      - - 合作伙伴集中或宕机证据
        - 重大单点依赖或不利重谈
        - 抬高脆弱性折扣，并削弱退出准备度
        - 提高折现率，收窄价格区间。
    notes: 上述触发点最可能改变投资判断，而不只是叙事语气。
    claimRefs:
      - CV037
      - CV038
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 商户留存
        - 续约队列、支出留存、试点到生产转化
        - 证明商户媒体上行是真实机会，还是叙事偏重
        - 索取销售 / 财务队列材料。
      - - 消费者韧性
        - 活跃用户队列、还款行为、按产品和方案拆分的流失
        - 区分表层客户数和可持续使用
        - 索取产品 / 风险队列仪表盘。
      - - 监管与控制
        - Consumer Duty MI、投诉趋势、负担能力治理
        - 决定估值应反映溢价还是折价
        - 索取合规准备材料。
      - - 股权结构表和优先权
        - 当前投资者权利、清算优先权、稀释瀑布
        - 影响真实入场经济性和下行保护
        - 索取法务股权结构表材料。
      - - 合作伙伴集中度
        - 头部交易对手敞口、SLA、备用架构
        - 决定脆弱性折扣和业务连续性信心
        - 索取基础设施和资金集中度审查。
    notes: 上述要求是把方向性兴趣变成可投资承销判断所需的最低集合。
    claimRefs:
      - CV018
      - CV032
      - CV037
      - CV040
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Zilch 从 2018 创立，走到英国受监管上线、债务支持下规模化、获得增长品牌认可，并在 late-2025 完成资本与支付栈升级。
    data:
      items:
        - date: '2018-01-01'
          label: 创立
          detail: Zilch 在伦敦创立，使命是降低消费者信贷成本。
          tone: positive
        - date: '2020-04-01'
          label: FCA 授权与英国上线
          detail: 消费信贷许可和公开上线，使 Zilch 成为早期受监管 BNPL 参与者。
          tone: positive
        - date: '2021-01-01'
          label: 1m 客户；Series B/C 扩张
          detail: 客户牵引和大额风险投资轮支撑品类突破。
          tone: positive
        - date: '2022-01-01'
          label: Series C 延展轮
          detail: 在金融科技融资更艰难时，公司拿到追加股权融资。
          tone: neutral
        - date: '2023-01-01'
          label: 征信机构报送协议
          detail: Zilch 称，用户可以在英国主要机构建立信用记录。
          tone: positive
        - date: '2024-02-22'
          label: Pay over 3 months 上线
          detail: 更长期限的受监管分期产品扩大钱包份额野心。
          tone: positive
        - date: '2024-10-28'
          label: Deutsche 牵头证券化达 £150m
          detail: 仓储融资成为年度放款和商业增长的核心推动力。
          tone: positive
        - date: '2025-01-13'
          label: Zilch Travel 上线
          detail: lastminute.com 合作把品类覆盖从普通零售结账外扩。
          tone: positive
        - date: '2025-06-03'
          label: Visa 战略交易与实体卡计划
          detail: Zilch 将更多规模迁移到 Visa，并准备实体卡使用场景。
          tone: positive
        - date: '2025-11-13'
          label: $176.7m 融资
          detail: KKCG 牵头轮次叠加 Deutsche 扩容，为迈向 2026 的下一阶段提供资金。
          tone: positive
        - date: '2025-12-11'
          label: FCA 支付牌照
          detail: 支付牌照获批和 Visa 主会员资格降低第三方依赖。
          tone: positive
