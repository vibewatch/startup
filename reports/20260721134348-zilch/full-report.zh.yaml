              收入基础分布在信贷、交易、功能和广告几条线上，其中交易加广告收入已占总额超过四分之一。这一点重要，因为它降低了对任一价格杠杆的依赖，也支撑管理层关于平台同时变现消费者信贷活动和商户注意力的说法。Pay over
              3 months 推出看起来在财务上很重要，因为管理层明确把它与更高的单笔交易平均费用和更强的 App
              引导旅程组合联系起来。结合公司不收滞纳金的姿态，变现故事不再主要是惩罚承压消费者，而是商户资助经济、产品组合和更高价值旅程。需要谨慎的是，公开来源不披露实际商户费率或补贴率，因此投资人能看到多元化的产出，却还看不到底层合同级经济性。
