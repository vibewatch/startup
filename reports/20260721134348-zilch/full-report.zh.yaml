      - number: '8.3'
        title: 可比公司组与情景框架
        blocks:
          - type: paragraph
            body: >-
              上市可比公司给了有用但偏冷的框架。Klarna 是方向上最好的 BNPL 类比对象，因为它兼具规模、公开市场审视，以及仍很新鲜的价格信号。July 2026，Klarna 的交易价格大约略高于 2025 收入的
              2x；Affirm 的收入倍数则高得多，达到两位数；PayPal、Block 等成熟支付平台按收入看又远低于高增长金融科技叙事会暗示的水平。这种分散度说明，不能用一个偷懒的可比公司给 Zilch 定价。如果
              Zilch
              证明自己正在变成商户经济韧性强的高质量平台，它可以争取溢价；如果它更像证据较薄的受监管信用与支付混合体，倍数就该压缩。因此，估值争论的核心，是证据支持下的业务质量，而不只是收入增长标题。从这个角度看，可比公司分析是纪律工具：它防止投资人为所有可能的未来一次性付费，并迫使投资人明确思考，要拿到更高倍数需要什么证据。
