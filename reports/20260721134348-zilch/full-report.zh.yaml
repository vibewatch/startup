      - number: '8.2'
        title: 当前融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Late-2025 融资实质性改善了讨论基础：它证明公司能以 $1B+ 估值拿到资本，也把叙事从单纯的下轮融资后遗症中拉出来。但过去并没有被抹掉。当前估值看起来仍低于早前 $2B
              峰值，因此投资人应把最新一轮视为重新定价后的恢复，而不是已经被充分验证的溢价。入场纪律重要，因为公开证据仍指向一家存在经审计亏损、信用敞口、监管切换风险和股权结构表透明度不足的公司。这些问题不致命，却正是区分有纪律私人估值和乐观估值的分水岭。因此，投资人应把最新融资作为参考点，而不是价格自然有吸引力的证明。在上市灵活支付公司
              IPO 后，即便收入增长仍健康，市场也已经表现出惩罚意愿，这一点尤其成立。
            claimRefs:
              - CV001
