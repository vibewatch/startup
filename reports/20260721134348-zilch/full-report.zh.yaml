  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 跨同业类型的竞争版图
        blocks:
          - type: paragraph
            body: >-
              Zilch 的竞争不只是结账页上的几个 BNPL 品牌 Logo。公司现在处在分层战场：直接 BNPL 专家如 Klarna 和 Clearpay，钱包既有玩家如 PayPal，账户关联分期替代品如 Monzo
              Flex，以及更广泛的银行卡和受监管信贷现状。这个区分重要，因为每一类攻击 Zilch 的方式不同。Klarna 靠广度和规模竞争，Clearpay 靠商户分发和 pay-in-4 熟悉度竞争，PayPal
              靠嵌入式触达和信任竞争，Monzo 靠已经锁住的银行关系竞争。公开比较来源也清楚说明，这些产品不再小众：Which? 将 Klarna、Clearpay、PayPal 和 Zilch 视为英国领先 BNPL
              选择，独立指南也越来越把 Monzo Flex 和类似账户关联产品放进同一消费者决策集。结果是，客户任务——不默认使用传统循环信用卡，却平滑一笔购买——可以通过几种交付模式解决，并不非 Zilch 不可。
