      - number: '2.2'
        title: 规模测算视角和采用轨迹
        blocks:
          - type: paragraph
            body: >-
              公开市场视角至少在一点上相同：BNPL 在英国已经主流化，尽管不同方法给出的总量不一。FCA 材料和衍生统计把 2024 年交易额放在 £13 billion 以上，高于 2017 年约 £60
              million。FCA 的 Financial Lives 数据称，截至 2024 年 5 月的 12 个月内，20% 英国成年人，即 10.9 million 人，使用过未受监管 BNPL；Business
              Expert 估计，到 2026 年约 54% 英国成年人曾在某个时点使用 BNPL。预测供应商给得更高，Kandoo 引用的英国 BNPL 支出约为 2024 年 £29.85 billion，并到 2029
              年趋近 £47.27 billion；不过这些供应商预测混入了比 FCA 交易额口径更宽的支出概念。数字钱包采用是 Zilch 走出纯结账借贷时最关键的相邻习惯：Finder 称，2024 年 57%
              英国成年人拥有移动支付服务，40% 英国线上购买已使用数字钱包。因此，Zilch 的市场足够大；真正的分析难题不是证明规模，而是在监管下证明 Zilch 能盈利地拿下哪些细分。
