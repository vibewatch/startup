      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Zilch 的市场是三边经济结构。用户和借款人是消费者，他们需要灵活性、免息短期信贷、奖励，或更平滑的现金流。部分付费方也是同一消费者，对应一些收费或无补贴用例；但 Zilch
              的差异化取决于商户和广告主为获客、展示位和佣金付费，从而让消费者成本低于以卡为核心的替代方案。第三层资本提供方——仓储贷款人和证券化投资人——为应收款供资，因此塑造产品扩张速度。采用通常从结账或钱包 App
              内开始，经过资格和负担能力筛查；如果用户回访足够频繁，提供商才会从一次性融资按钮变成习惯性消费入口。商户侧采用不太取决于抽象 TAM 话术，更取决于可衡量的转化提升、重复使用和获客效率。因此，Zilch
              反复把自己定位为直面消费者的媒体和支付网络，而不是简单贷款方。
