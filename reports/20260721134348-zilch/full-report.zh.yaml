chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、模式和当前规模
        blocks:
          - type: paragraph
            body: >-
              Zilch 成立于 2018 年，2020 年在英国公开上线，是一个围绕受监管、免息分期信贷和借记式奖励搭建的消费者支付平台。公司总部在伦敦，自称使命是消除消费者信贷的高成本。Zilch 与传统 BNPL
              提供商的区别，在于它强调广告驱动的支付网络：管理层认为，补贴经济模型的不只是借款人，商户和广告主也通过佣金、展示位费用和广告买单。这一点重要，因为它让 Zilch
              的单位经济叙事不同于更直接依赖商户折扣和滞纳金收入的同业。经审计 FY2025 账目显示，公司在 £1.893 billion GMV 上取得 £110.3 million 收入，毛利率 49%；2025
              年后续公司更新称，平台客户已超过 5.3 million，处理了超过 £5 billion 的商业交易。当前产品栈覆盖带奖励的 Pay Now 借记式支付、Pay over 6 weeks、Pay over 3
              months、增长中的商户媒体层，以及旅游等新类别产品。证据支持 Zilch 确有规模和产品广度，但若干头部数字仍由公司口径给出，并非通过独立提交的公开市场披露验证。
