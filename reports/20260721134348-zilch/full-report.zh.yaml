      - number: '1.2'
        title: 领导层、治理和组织控制
        blocks:
          - type: paragraph
            body: >-
              领导层仍高度围绕创始人。Zilch 公开材料和创始人履历一直把 Philip Belamant 放在战略、融资、产品定位和上市野心的核心；官方和第三方描述也越来越常将创始团队写作 Philip
              Belamant、Serge Belamant 和 Sean O’Connor。FY2025 年报显示，董事会有 5 名成员：Serge Belamant 任主席，Philip Belamant 任 CEO
              兼董事，Sean O’Connor 任联合创始人 / 董事，另有独立非执行董事 Pavel Chernyshov 和 Mark Wilson。Wilson 2024 年 8
              月的任命重要，因为管理层明确把它包装为加强治理、走向持续盈利和最终上市准备的一步。Companies House 文件还显示董事会持续演进，包括 Serge 和 Sean 在 2024 年 4
              月成为新控股公司架构的董事，以及 Dame Clare Barclay 在 FY2025 报告期后于 2026 年 6
              月加入。因此，治理图景正在改善，但关键的前瞻性表述——产品路线图、融资、上市准备——仍异常依赖少数创始人和管理层可信度。Clare Barclay 期后任命也说明董事会仍在积极组建，并未进入稳定的公众公司终局。
