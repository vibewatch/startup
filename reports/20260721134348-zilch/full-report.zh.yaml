      - number: '8.4'
        title: 建议、信心与后续尽调问题
        blocks:
          - type: paragraph
            body: >-
              当前最合适的建议是带选择性兴趣地继续研究。Zilch
              显然值得继续尽调，因为核心运营故事强到不能忽视，但太多影响估值的关键变量仍在私下。信心应为中等：足以继续推进，不足以直接放行价格。下一步很简单。投资人应要求公司拿出商户留存、队列韧性、监管后经济性、合作伙伴集中度和私募证券条款的硬证据。如果材料扎实，最新估值可能可接受，甚至有吸引力；如果材料薄弱，正确动作是在可选性溢价固化为资本损失风险前退一步。换句话说，这个案子里，尽调质量应比管理层叙事或原始用户增长更能决定信念。好的私人市场流程应该像一次确认性承销，而不是叙事辩论。公司需要证明，私人轮价格反映的是可持续质量，而不只是强劲募资动能。
