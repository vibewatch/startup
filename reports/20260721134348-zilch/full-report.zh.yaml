      - number: '3.3'
        title: 切换成本、多平台并用和分发权力
        blocks:
          - type: paragraph
            body: >-
              每个独立 BNPL 品牌的结构性问题在于，消费者和商户都可以多平台并用。Which? 指出，一些零售商在结账时曾提供多达六种 BNPL
              方案，这意味着购物者通常从已经展示出来的选项里挑，而不是出于对单一提供商的深度忠诚。这个动态削弱消费者锁定效应，也抬高分发权力的重要性。PayPal
              在这里最强，因为它把现有钱包登录转化为延后支付选项。Klarna 是专家型玩家中最强的，因为它把商户触达、App 发现和规模化品牌认知结合起来。Clearpay
              的零售商网络和消费者频次说法，也支撑类似但更窄的分发护城河。Zilch 的卡基通用受理和商户资助奖励策略，是对这个问题的聪明回应，因为它试图摆脱纯粹逐商户集成的依赖。但公开证据仍未量化 Zilch
              的客户或商户与最大竞争对手之间的重叠，因此任何精确的切换成本叙事仍更像假设，而非已证实。
