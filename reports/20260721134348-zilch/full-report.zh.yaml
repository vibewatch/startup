            body: >-
              运营风险一部分来自公司公开说了什么，一部分来自它没说什么。公开帮助页面展示了投诉、逾期付款、实时支持、Snooze
              和债务催收的可见控制框架，比许多同业披露得更好。不过，这些页面也暴露出最重要的失效模式：逾期还款可能降低信用额度，并导致转入债务催收；Snooze
              通过小额费用变现延期，现在还包含选择性资格和自动化行为；如果客户仍不满意，投诉可以升级到公司外部。公开来源仍不展示正常运行时间、事故日志或模型治理内部情况，因此投资人被要求相信，更宽、更自动化的产品栈运行良好，却看不到通常用来验证这一点的证据。这不能证明弱点，但确实显著提高了围绕可靠性、公平性和欺诈控制的尽调要求。
