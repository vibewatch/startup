- id: competition-channel-and-downside
  title: Competition, channel control, and valuation downside
  body: 'Midi''s competitive risk is more subtle than simple product substitution. The company has real demand signals, a $100 million Series D, more than 25,000 weekly patients, and broad commercial coverage claims. But the most relevant rivals are not only menopause-only clinics; they are broader benefits platforms that can package menopause inside a larger employer or payer relationship. Progyny markets a curated 50-state menopause network tied to workforce retention. Maven markets 24/7 midlife support inside a global women''s and family-benefits platform, and Elektra offers menopause coaching and employer programs as a lighter-weight option. LeadersEdge notes that only about 15% of U.S. employers currently offer menopause benefits, which means there is room to grow, but also a land-grab for early budget ownership. That competition intersects with capital-market risk. Rock Health''s Q1 2026 overview says digital health funding was concentrated in a handful of mega-deals, the exit window
    remained narrow, and the market was active but selective. Midi''s unicorn valuation therefore raises the downside cost of any execution miss: if employer channel wins slow, if reimbursement economics disappoint, or if service quality slips, the company could discover that private-market enthusiasm outran the public evidence base supporting long-duration cash flows.'
