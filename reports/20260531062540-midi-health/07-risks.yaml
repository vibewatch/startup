- id: mitigation-monitoring
  title: Mitigations, monitoring indicators, and kill criteria
  body: Midi does have credible mitigants. Official sources point to board-certified clinicians, ongoing training, insurance-backed access, and real patient enthusiasm when the workflow fits the case. The company has also raised enough capital to invest in compliance, staffing, and systems rather than operating at subscale. Even so, the best investment posture is to treat risk reduction as evidence-driven, not story-driven. The key monitoring questions are whether claim denials and surprise bills stay contained, whether privacy controls remain ahead of tracker and data-use complexity, whether clinician hiring keeps pace with service-line expansion, and whether employer buyers keep choosing specialist depth over bundled platform breadth. A thesis break would not require total demand collapse. It would require repeated proof that reimbursement durability, service quality, regulatory hygiene, or distribution leverage is weaker than the valuation assumes. Public sources today do not yet resolve
    those questions with enough precision to underwrite the downside away.
