  evidenceGaps:
  - type: missing-source
    severity: material
    topic: payer-economics
    missingEvidence: Payer-level reimbursement, denial, prior-authorization, and patient-responsibility data by major plan and service line.
    whyItMatters: Without remits and denial trends, investors cannot test whether commercial coverage actually produces durable margin and retention at the current valuation.
    diligencePath: Request a 12-month payer-mix and remittance deck with denial reasons, average patient responsibility, and retention by plan cohort.
    relatedQuestionRefs:
    - QR027
    - QR028
  - type: private-evidence-only
    severity: material
    topic: provider-supply
    missingEvidence: Clinician hiring funnel, turnover, wait-time coverage, malpractice coverage structure, and state-level capacity by specialty.
    whyItMatters: A 50-state specialist clinic can look scalable publicly while still failing in access, continuity, or liability economics if provider capacity is thin.
    diligencePath: Request provider headcount by license state and specialty, attrition, fill rates, wait times, and malpractice / claims history.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: testosterone-safety
    missingEvidence: Adverse-event, discontinuation, lab-monitoring, and clinical-outcomes data for compounded testosterone and adjacent medication-heavy programs.
    whyItMatters: Compounded testosterone is the sharpest clinical-governance edge case in the current public product set, and safety visibility remains too thin to dismiss the risk.
    diligencePath: Request protocol, informed-consent language, adverse-event logs, discontinuation reasons, and outcomes review from the clinical-governance committee.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: downside-underwriting
    missingEvidence: Service-line contribution margin, burn, cash runway, debt covenants, and employer renewal / churn metrics.
    whyItMatters: A unicorn valuation supported mostly by growth and scale claims can reprice quickly if unit economics or channel durability are weaker than implied.
    diligencePath: Request board materials or lender / investor updates covering cash runway, debt, gross margin by line, and employer renewal performance.
    relatedQuestionRefs:
    - QR027
    - QR028
    relatedTableRefs:
    - TR005
