    "title": "Valuation",
    "summary": "Midi Health looks like a real category winner in midlife women’s telehealth, but the latest >$1 billion mark implies about 6.7x the company’s disclosed $150 million run rate—well above the roughly 0.3x to 2.5x public-comp band reviewed here. Public evidence supports scale, demand, and TAM headroom, yet it still omits the private proof that matters most at this price: cohort retention, payer yield, audited profitability, and the preference stack. The recommendation is research-more and the valuation stance is stretched."
