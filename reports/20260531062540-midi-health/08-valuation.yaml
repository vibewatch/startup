    {
      "id": "reimbursement-retention-and-downside-scenarios",
      "title": "Reimbursement, retention, and downside scenarios",
      "body": "Midi's business model is attractive because it avoids one major trap of menopause startups: pure out-of-pocket dependence. The company says it is in-network with most PPO plans, can bill claims through employer-recognized plans, and can complement health-system care. That can support lower effective patient acquisition cost, better affordability, and broader reach than cash-pay HRT peers. But the same structure creates underwriting sensitivities. Midi explicitly excludes Medicaid and Medi-Cal and treats Medicare only as self-pay, so today's reimbursed TAM is narrower than the headline need suggests. Meanwhile CMS continues to define eligible telehealth reimbursement at the service level, and even with some permanent 2026 flexibilities it did not broaden every requested telehealth category.\n\nRetention is the swing factor. The upside case is intuitive: menopause is a multi-stage journey, product lines now extend into weight management, longevity, and Custom Rx, and public studies suggest symptoms persist long enough to support ongoing care relationships. The downside case is that public evidence never discloses repeat-visit cadence, payer yield, gross margin, or cohort retention. Complaints on Trustpilot around billing confusion, no-show visits, rescheduling, and poor fit for special-case patients show where the model could leak value even if top-line demand is real. The resulting valuation ranges are therefore best understood as underwriting brackets, not point estimates. At a >$1 billion entry mark, the base case only works if reimbursement quality and retention convert scale into durable economics; otherwise the bear case falls well below the last round.",
