      "id": "comparable-set-and-multiple-framework",
      "title": "Comparable set, public multiple band, and TAM capture",
      "body": "The cleanest valuation anchor in the public record is not a DCF but a multiple sanity check. Midi's latest disclosed mark implies about 6.7x valuation-to-run-rate revenue using the $150 million run rate reported around the Series C period. That sits well above the public analog set reviewed here: Hims at about 2.5x, LifeStance at about 2.2x, Progyny at about 1.8x, Privia at about 1.6x, and Teladoc at roughly 0.3x. None of those are perfect comps. Hims is more cash-pay and consumerized, Teladoc is a mature conglomerate, Progyny is fertility and employer benefits, Privia is physician enablement, and LifeStance is mental health. But together they establish that public markets in 2026 are not generally paying 6x-plus revenue for telehealth or care-delivery businesses without unusually strong proof.\n\nThe bullish counterargument is that Midi may deserve a premium because it sits at the intersection of a large, underdiagnosed women's-health need and a still-early employer reimbursement market. PwC frames menopause as a $10 billion to $15 billion market that can grow to $15 billion to $25 billion by 2030, while Mayo and Monash reinforce that the symptom burden is large and undertreated. Midi's own disclosed penetration remains tiny versus its coverage base: 230,000 cumulative patients against 45 million covered women is still only about half of one percent. That supports TAM headroom, but it does not itself justify the current multiple. The premium only works if Midi converts that headroom into repeat utilization, product attach, and durable payer economics faster than public analogs have done.",
