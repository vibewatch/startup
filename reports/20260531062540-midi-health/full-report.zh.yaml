      - number: '1.4'
        title: 规模、分发与产品扩张
        blocks:
          - type: paragraph
            body: >-
              从多个指标看，Midi 的公开运营版图已经是全国性。官方和投资人来源称覆盖超过 45 million 名女性，平台每周接诊超过 25,000 名患者；官方医生页面和用户证言页面称超过 230,000
              名患者使用过服务。Fierce 还补充称其在 50 个州拥有 500 名服务提供者网络。分发也不只是纯 DTC 漏斗。雇主材料称 Midi 可以借现有的全国网内理赔关系切入，公司提到 Fortune 100
              雇主，以及与 Progyny 和 Cleo 的福利平台关系；Memorial Hermann 公开描述其在 Texas 的协同照护路径；医生转诊页面把 Midi
              定位为现有诊疗的延伸，而不是替代所有线下触点。产品范围也随版图扩张：TIME 提到 2025 年 5 月 AgeWell 上线，公开页面现在除了更年期照护，还销售长寿、体重和预防风险支持。Parade
              报道的自费价格显示，自付更像兜底选项，而不是核心经济模型。
