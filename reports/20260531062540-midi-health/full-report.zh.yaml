      - 因素
      - 方向
      - 时点
      - 证据
      - 对 Midi 的含义
    rows:
      - - 更年期护理缺口与症状负担
        - 顺风
        - 当下
        - 症状人群庞大，诊断不足、治疗不足
        - 打开了普通初级保健填不上的专科可及性缺口
      - - 雇主医疗成本通胀
        - 顺风
        - 2025-2026
        - KFF、Mercer 和 Business Group 显示保费和趋势走高
        - 买方更愿意接受定位为预防和导航的方案
      - - 药房通胀与 GLP-1 使用
        - 利弊并存
        - 2025-2026
        - 雇主对成本敏感，但也在围绕高价药主动重设计福利
        - 支撑体重管理邻近业务，同时抬高 ROI 审查门槛
      - - 远程医疗常态化
        - 顺风
        - 疫情后基线
        - 虚拟问诊使用率仍明显高于疫情前
        - 让虚拟专科护理从试验性交付变成默认选项
      - - 临时 Medicare 政策支持
        - 2027 年后逆风
        - 2026-2028
        - 若不续法，居家和不受地域限制的灵活政策将到期
        - Medicare 扩张风险维持高位，也限制高龄支付方上行空间
      - - 供给端培训与认证短缺
        - 逆风
        - 结构性
        - BCG 记录住院医培训覆盖薄弱，更年期认证渗透率低
        - 临床人员招聘和培训可能成为真正的增长瓶颈
      - - 品类融资与 D2C 动能
        - 顺风
        - 2025-2026
        - Rock Health 显示资本仍可得，消费者健康兴趣回暖
        - 支撑估值和认知度，也会吸引更多新进入者和整合方
    notes: 驱动与约束的时点基于截至运行日的当前公共政策窗口和雇主福利调查周期。
