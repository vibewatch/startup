  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从市场需求和规模证据，到估值溢价和证据缺口，再到最终推荐的逻辑链条。
    data:
      nodes:
        - id: n1
          label: 大量未满足需求
        - id: n2
          label: 保险支撑的分销
        - id: n3
          label: 已披露规模证据
        - id: n4
          label: 当前价格溢价
        - id: n5
          label: 缺少留存和支付方数据
        - id: n6
          label: 继续研究 / 估值偏高
      edges:
        - from: n1
          to: n2
          label: 支撑需求
        - from: n2
          to: n3
          label: 推动增长
        - from: n3
          to: n4
          label: 支撑部分溢价
        - from: n4
          to: n5
          label: 但还需要证据
        - from: n5
          to: n6
          label: 阻碍明确买入
    approximationNotes: 证据链的概念性综合；箭头描述尽调判断逻辑，而不是字面运营流程。
    claimRefs:
      - CV015
      - CV021
      - CV042
      - CV045
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 将选定收入倍数套用到 Midi 披露的 $150M 运行率，得到隐含估值。
    data:
      items:
        - label: 上市可比公司中点（1.8×）
          value: 270
          unit: USD M
          note: 按 $150M 计算，约为 Progyny 和 Privia 式上市公司倍数中点。
        - label: 高增长上市可比公司（2.5×）
          value: 375
          unit: USD M
          note: Hims 式倍数套用到 $150M。
        - label: 高溢价医疗平台情景（4.0×）
          value: 600
          unit: USD M
          note: 示意性溢价，仍低于当前轮估值。
        - label: 当前隐含标记（6.7×）
          value: 1000
          unit: USD M
          note: 最新披露的私募估值套用到已报告运行率。
    approximationNotes: 使用 Series C 前后报道的 $150M 运行率，以及选定上市可比公司的大致市值 / 收入倍数；数值只表示方向，不追求企业价值精度。
    claimRefs:
      - CV006
      - CV026
      - CV028
      - CV030
      - CV032
      - CV034
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 相对当前 >$1B 基准，给出 Midi 的乐观、基准和悲观价值区间。
    data:
      items:
        - label: 悲观情景
          low: 350
          mid: 450
          high: 550
          unit: USD M
          note: 留存或报销质量偏弱，可比倍数压缩。
        - label: 当前标记
          low: 1000
          mid: 1000
          high: 1000
          unit: USD M
          note: 最新披露的私募轮估值。
        - label: 基准情景
          low: 950
          mid: 1100
          high: 1250
          unit: USD M
          note: 增长适中，留存有所改善；勉强高于入场价。
        - label: 乐观情景
          low: 2000
          mid: 2300
          high: 2600
          unit: USD M
          note: 队列质量强，加上溢价定价持续。
    approximationNotes: 三年情景区间来自公开运行率和选定倍数假设；未建模优先清算瀑布，因此悲观情景下的股权结果可能比图示更差。
    claimRefs:
      - CV042
      - CV045
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投资委员会式评分卡，权衡市场需求、证据、经济性可见度和价格支撑。
    data:
      items:
        - label: 市场需求
          value: 8/10
          detail: 品类大、诊断不足、与雇主相关，症状负担证据强。
          tone: positive
        - label: 分销证据
          value: 7/10
          detail: 全国 PPO 定位、雇主理赔计费和医疗系统合作支撑真实渠道广度。
          tone: positive
        - label: 报销韧性
          value: 5/10
          detail: 商业保险模式有吸引力，但 Medicare 和 Medicaid 仍被排除在外。
          tone: neutral
        - label: 留存可见度
          value: 4/10
          detail: 纵向需求存在，但没有披露公开队列或复诊数据。
          tone: warning
        - label: 单位经济可见度
          value: 3/10
          detail: 没有公开毛利率、CAC、支付方收益率或现金跑道桥接。
          tone: warning
        - label: 可比价格支撑
          value: 3/10
          detail: 当前标记显著高于已审阅上市公司倍数。
          tone: warning
        - label: 宣称纪律 / 信任
          value: 4/10
          detail: NAD 质疑和投诉主题增加了不可忽视的执行风险。
          tone: warning
        - label: 证据质量
          value: 5/10
          detail: 公开披露好于许多私营初创公司，但单靠这些还不足以消化定价风险。
          tone: neutral
    approximationNotes: 评分是对保留证据的判断性综合，不是统计模型。
    claimRefs:
      - CV015
      - CV018
      - CV021
      - CV041
      - CV042
      - CV045
      - CV049
