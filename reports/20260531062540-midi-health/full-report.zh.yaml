      - number: '7.4'
        title: 缓释措施、监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              Midi
              确有可信的缓释因素。官方来源指向通过专科委员会认证的临床医生、持续培训、保险支持的可及性，以及流程匹配时真实的患者热情。公司也融到足够资本，可以投向合规、人员和系统，而不是在亚规模状态下硬撑。即便如此，最佳投资姿态仍应把风险下降视为证据驱动，而不是故事驱动。关键监测问题包括：理赔拒付和意外账单能否被控制住；隐私控制能否跑在追踪器和数据使用复杂度前面；临床人员招聘能否跟上服务线扩张；雇主买家是否继续偏好专科深度，而非捆绑平台的宽度。要打破投资假设，并不需要需求全面崩塌；只需要反复证明报销韧性、服务质量、监管卫生或分销杠杆弱于估值假设。公开来源目前还不能精确回答这些问题，不足以把下行风险完全消掉。
