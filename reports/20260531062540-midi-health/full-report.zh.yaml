      - number: '1.2'
        title: 领导层、治理与地点信号
        blocks:
          - type: paragraph
            body: >-
              在仍未上市的女性健康创业公司里，Midi 的公开领导班底异常成熟，也解释了为什么后期投资人似乎把它当作更宽的平台来判断，而不是单一病种远程医疗品牌。联合创始人兼 CEO Joanna Strober 曾创办
              Kurbo，并在健康和消费领域投资超过二十年；Sharon Meers 带来 Goldman Sachs 和 eBay 运营经验；Kathleen Jordan 与 Mindy Goldman 分别带来
              Dignity/Tia 和 UCSF 背书的资深临床领导力；Jason Wheeler 则从 Tesla 和 Google
              带来上市公司财务深度。公司官网还展示了横跨市场、技术、商业、医疗体系和临床运营的更大高管团队，公开 Series B 材料还把 Jill Herzig
              列入创始团队。主要治理疑点在披露深度：已留存公开材料没有展示董事会名单或投资人董事席位。地点披露也有一处不一致：融资公告使用 Palo Alto 电头，而当前条款页面把法律通知导向 Los Angeles
              邮寄地址。
