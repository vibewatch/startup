        - from: midi
          to: clinicians
          label: 产能与质量
        - from: midi
          to: employers
          label: 分销预算
        - from: midi
          to: trackers
          label: 消费者获客 / 分析
        - from: patients
          to: midi
          label: 需求、留存、评价
        - from: medicalgroups
          to: payers
          label: 资质认证与报销
        - from: clinicians
          to: patients
          label: 诊疗体验与结果
