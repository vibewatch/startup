      - number: '5.3'
        title: 运营架构与信任控制
        blocks:
          - type: paragraph
            body: >-
              公开材料里最清楚的架构细节，是患者商务界面、临床记录系统和外部执行伙伴之间的拆分。Midi 帮助中心称，Midi Portal 处理排期和购买，Athena Portal
              处理记录、安全消息和实验室结果查看。条款随后把更宽的服务栈描述为一个协调平台，位于各自独立组织的医疗集团、服务提供者、实验室和药房之上。对受监管线上诊所来说，这是务实架构：公司可以集中用户体验和工作流逻辑，同时不声称每个受监管功能都落在单一公司实体上。


              安全和合规姿态看起来更偏运营，而不是产品化。HHS 指南要求远程医疗预约、消息和账单数据使用安全通信和存储；Midi 与 JumpCloud 的供应商案例研究则描述了
              SSO、MFA、MDM、基于角色的访问控制、条件访问、补丁管理和年度 HIPAA 培训。在临床医生效率侧，Midi 与 Ambience 描述了深度集成 Athena 的 AI
              文档层，可以减少行政工作、改善事先授权文档，并加快入职。因此，公司技术边缘优势似乎来自工作流自动化加临床专科训练，而不是公开开发者平台或外部可审计的 API 资产。
