        - 参考 ACOG/FDA 的方案和专家领导
        - 审查方案更新、病例复盘频率和不良事件升级处理。
      - - 账单 / 支持运营
        - 按保险计划变化的费用分担和患者协调，仍需要高频人工支持。
        - 高
        - 中高
        - 标准化定价措辞和门户工作流
        - 索取支持人员配比、回电 SLA 和投诉趋势线。
      - - 隐私 / 合规领导力
        - HIPAA 加消费者数据的混合模式，需要产品、营销和诊疗运营之间明确政策归属。
        - 中
        - 高
        - 成体系的隐私实践和泄露通知流程
        - 索取组织架构图、审计范围和追踪器治理签批模型。
    notes: 执行风险不主要来自总人数，而来自服务目录扩张时，能否守住临床医生质量、支持响应速度和治理纪律。
    claimRefs:
