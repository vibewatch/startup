      - number: '8.4'
        title: 投资判断、反命题与尽调问题
        blocks:
          - type: paragraph
            body: >-
              核心论点 很直接：Midi 已证明中年女性健康里存在一个巨大、可报销、由专科牵引的需求池；它已经取得全国规模，并在 2026 年数字健康融资只偏爱少数赢家时吸引了集中资本。反命题
              同样直接：当前价格已经提前计入了很大一部分成功，而外部人还看不到队列 留存、实际报销、利润率或清算优先权层级。公开可比公司显示，市场通常给照护交付收入的定价远低于 Midi
              最新融资隐含水平；围绕理赔纪律和服务摩擦的负面证据，也说明这里有真实执行风险，而不只是数据缺口。


              结论因此对价格敏感。作为公司，Midi
              看起来值得融资；但仅凭公开记录，还不足以把当前轮次视为显然有吸引力。正确姿态是继续研究，而不是放弃：披露证据足够让公司留在名单上，却不足以在没有私下尽调时越过溢价入场门槛。若投资人能验证留存、付款人实收和
              股权结构表干净度，仍可能证明这个价格合理；若不能，就应假设基准情景只提供有限的总账面上行空间，而且一旦计入稀释和优先权，低于 $1B 的结果可能很快损害回报。
