  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与临床工作流
        blocks:
          - type: paragraph
            body: >-
              Midi 的产品应被看成一套工作流化的线上诊所，而不是单功能更年期 app。公开入口从保险覆盖查询和预约开始，随后进入由临床医生撰写的 Care
              Plan，可包括激素处方、非激素药物、补充剂和生活方式调整。公开模块页面显示，公司已经把同一套基础运营模型延伸到 AgeWell
              长寿问诊、体重管理、情绪和记忆支持、睡眠支持、性健康，以及更窄的睾酮项目。这个宽度很重要，因为它让 Midi 能扩大钱包份额，而不用假装自己是全栈初级保健替代品。


              工作流有意采用混合形态。Midi 自己的页面称，公司可以与其他医生共享照护计划和检测结果；医生页面和医疗体系页面则描述了转诊接收、安全信息共享，以及把乳腺 X
              光、活检、超声、手术和其他线下工作转回体系的交接。换句话说，产品承诺是在既有服务提供者关系之上叠加专科远程医疗。这种设计在运营上有吸引力，因为 Midi
              留在高摩擦的诊断、处方和协调层，把影像、操作和急诊留给既有体系。
