        title: 资本充足性与公开规模
        blocks:
          - type: paragraph
            body: >-
              Midi 披露的融资历史足以显示真实规模，并降低了近期融资风险。官方和独立来源支持公司在 2026 年 2 月以超过 $1 billion 的估值完成 $100 million Series D；此前还有
              2025 年 $50 million Series C、2024 年 $60 million Series B 和 2023 年 $25 million Series A。Fierce Healthcare 称
              Series D 后累计资本超过 $250 million；Business Insider 报道 2025 年收入运行率约 $150 million，高于 2024 年底约 $60
              million。官方和独立来源还支持每周超过 25,000 名患者、累计服务超过 230,000 名女性或患者，以及覆盖 50
              个州。这足以说明，抽象意义上公司已经不再缺资本。但资本充足不等于现金跑道可见。已审阅的公开来源均未披露账上现金、月度烧钱、债务余额、契约或量化盈亏平衡时间表。结果是：公司看起来有充足资金继续增长，但公开证据仍不足以把流动性承销清楚。
