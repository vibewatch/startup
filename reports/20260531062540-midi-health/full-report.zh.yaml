  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价与变现面
        blocks:
          - type: paragraph
            body: >-
              Midi 的公开财务故事，起点不是一份干净的审计 P&L，而是收入模型的形状。官方定价页面把业务定位为面向商业保险女性的保险支持专科照护，用标准共付额和免赔额替代宽泛的自费订阅模型。这很关键，因为 Midi
              显然围绕可报销临床问诊搭建，而不只是依赖消费者健康支出。公开页面还显示，变现面正从更年期问诊向外扩：公司现在销售体重管理照护、癌症幸存者照护、AgeWell 长寿问诊，以及面向皮肤、头发、性健康、体重和长寿的
              Midi Custom Rx
              产品。门户栈和照护流程页面显示，一次问诊可包括处方、实验室检测、筛查、安全消息和产品履约，从而支撑单个患者的长期收入。公开记录仍没有展示的是：报销问诊收入、药房或产品附加，以及任何更高价值专科项目之间的拆分。投资人可以判断多条收入流存在，但还不能判断其结构或毛利质量。
