        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              因此，Midi 确有护城河，但比泛泛的“品类领导者”故事更窄。保险覆盖、专科信任和雇主或医疗体系分发同时重要时，Midi 的护城河最强。这套组合很难被低成本直接竞争者快速复制，也解释了为什么 Gennev
              是最有意义的同类校验。但同一条护城河在两个地方变弱。第一，自费用户可以比较简单公开价格，并得出 Alloy、Evernow 或 Winona
              更便宜、行政流程更省事的结论。第二，雇主和支付方买方可以判断，更宽的女性健康平台在战略上优于最佳单项更年期供应商。Evernow 与 Progyny
              的绑定显示，这些网络层内部可能几乎没有排他性。公开来源也没有披露核心企业端经济性，所以切换摩擦、PMPM 和赢单率仍无法判定。耐久结论是：当买方看重保险原生专科照护时，Midi
              会赢；当买方更看重价格简单性或打包渠道控制，而不是独立临床聚焦时，Midi 会失地。
