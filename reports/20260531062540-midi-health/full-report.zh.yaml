      - number: '7.2'
        title: 数据、运营和医护供给风险
        blocks:
          - type: paragraph
            body: >-
              下一组风险更偏运营，而不是纯法律问题。Midi 的隐私政策称，PHI 按 HIPAA 和医疗集团隐私实践通知处理；但同一政策和条款也把更广泛的个人数据与服务交互划入 Midi 的消费者隐私框架。公司还披露使用
              Meta 和 Google 像素以及 Mixpanel；FTC 指引提醒健康 App
              运营方，即使不落入传统受监管实体逻辑，隐私内嵌设计、真实披露和泄露响应仍然适用。这一点关键，因为做大后的面向消费者诊所，同时是医疗交付业务、理赔和客服流程，也是数据密集的营销界面。公开评论显示，执行并不总是顺滑：部分用户说就医快、被认真对待，另一些用户则提到处方漏发、账单混乱和预约失序。临床人员供给是另一个结构性卡点。Midi
              称其在 50 个州使用通过专科委员会认证、持续接受培训的临床医生；但 The Menopause Society 仍指出绝经照护存在临床教育缺口，AAMC 也预计到 2036
              年医生整体短缺。若从核心绝经问诊扩展到体重管理和其他专科，生命周期价值可能提高，但招聘、督导、排班覆盖和临床 QA
              的压力也会上升。简言之，运营风险不是某个灾难性单点故障，而是隐私、客服、人员配置或照护协调的接缝，可能在公司规模叙事完全可审计之前先开裂。
