        title: 福利平台替代与渠道控制
        blocks:
          - type: paragraph
            body: >-
              雇主侧更深的威胁可能来自渠道控制方，而不是另一家只做更年期的诊所。Maven、Progyny 和 Ovia
              都把更年期作为更宽女性健康或家庭福利关系中的一个模块来销售。这很关键，因为雇主赞助福利的买方往往想要一个合同、一层报告和一个横跨生育、孕产、育儿与中年期的照护导航故事。Maven 把中年期项目与
              2,000-plus 家雇主、健康计划侧 4 million 覆盖人群，以及面向消费者的激素照护边缘产品配在一起。Progyny 把经过更年期训练的服务提供者、照护顾问、50-plus 健康计划整合和 50
              州专科网络配在一起。Ovia 作为处方替代品较弱，但作为导航和参与层很强，可以嵌在既有福利栈中，把成员留在健康计划设计的旅程内。对支付方或雇主来说，即便这些更宽平台在逐次问诊深度上不等同于 Midi
