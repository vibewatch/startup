      - number: '4.2'
        title: 分发规模与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Midi 的获客模式比典型只面向雇主的数字化点状解决方案更宽。官方雇主页和医疗体系页面，加上 Keck 与 Mount Sinai 合作发布，展示了三车道分发系统：女性可以直接来到
              Midi，雇主可以借网内理赔准入把成员导入，医疗体系可以在保持本地服务提供者连续性的同时把患者转给
              Midi。这种分发宽度可能比标价更重要，因为它降低了对单一获客路径的依赖。最好的公开单位经济信号是运营性的，而不是会计性的。Ambience 称其 Athena 集成 AI 工具每天为临床医生节省超过 3
              小时，每天增加约 3 名患者，并将入职培训时间削减 50%；Midi 则称临床医生会经过 50+
              门课程和每周讲座。这些数字说明，公司正在用临床医生生产率、文档效率和更快爬坡来打毛利，而不是靠公开价格明显更高。结果指标也支持支付方 ROI，最高总照护成本降低
              13%，筛查依从性更好，但这些仍是公司口径证据，不是经审计的队列经济。
