      - number: '7.3'
        title: 竞争、渠道控制与估值下行
        blocks:
          - type: paragraph
            body: >-
              Midi 的竞争风险比简单的产品替代更隐蔽。公司有真实需求信号、$100M Series D 轮、每周超过 25,000
              名患者，以及广泛商业覆盖的说法。但最关键的对手并不只是绝经垂直诊所；更宽的福利平台也能把绝经服务打包进雇主或付款人关系。Progyny 主打一个覆盖 50 州、围绕员工留存设计的绝经网络。Maven 把 24/7
              中年支持嵌入全球女性与家庭福利平台，Elektra 则以更轻的方式提供绝经指导和雇主项目。LeadersEdge 指出，美国目前只有约 15%
              的雇主提供绝经福利，意味着仍有增长空间，但也意味着早期预算归属正在被争抢。竞争还与资本市场风险交织。Rock Health 的 2026 年 Q1
              概览称，数字健康融资集中在少数超大交易，退出窗口仍窄，市场活跃但挑剔。因此，Midi
              的独角兽估值放大了任何执行失误的下行成本：如果雇主渠道获客放慢、报销经济性不及预期，或服务质量下滑，公司可能会发现，私募市场热情已经跑在支撑长期现金流的公开证据之前。
