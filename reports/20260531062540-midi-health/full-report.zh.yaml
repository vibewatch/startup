      - number: '5.2'
        title: 保险、履约与照护协调
        blocks:
          - type: paragraph
            body: >-
              Midi 的运营模型依赖于让远程医疗在行政流程上比本地替代方案更轻。公开保险材料把服务定位为与多数 PPO
              计划网内，但帮助中心文章清楚显示，真实体验仍围绕免赔额、共同保险、共付额、就诊后患者责任和留卡扣款展开。公司明确排除 Medicare、Medicaid 和 Medi-Cal
              路径，因此服务优化对象是商业保险或自费用户，而不是最宽的支付方组合。


              药物履约也分成标准处方和 Midi Custom Rx 商务两条线。标准处方可以发送到患者偏好的药房，包括 Capsule 这类偏配送的选项。Midi Custom Rx
              则走门户购买流程，付款后由药房合作伙伴直接发货，并根据合作伙伴覆盖存在州级排除。遇到短缺时，工作流会变得更手动：临床医生建议提前续配、90
              天供应、替代配方或转药房。这能维持照护连续性，但也暴露出体验仍高度依赖外部药房、事先授权执行和本地库存可得性。
