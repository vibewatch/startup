        blocks:
          - type: paragraph
            body: >-
              公开记录足以支持对 Midi
              经济性的方向性结论。公司似乎在中年女性健康中找到了一个由报销支撑的真实增长楔子，把它扩进相邻服务线，并用风险资本搭建全国交付系统，运营杠杆也在增加。反向证据不是在质疑需求是否存在，而是在质疑透明度和承销深度。Trustpilot
              投诉包括账单困惑、自付成本预期无法满足、预约爽约，以及患者认为照护过度先用药。更重要的是，硬财务盲点仍未解开：没有公开服务线结构、没有实际单次问诊报销、没有毛利率、没有 CAC /
              回本周期、没有留存或集中度，也没有现金或债务桥。这意味着，只看公开证据，合理投资姿态应保持平衡。Midi
              更像一个有规模、多产品的线上照护平台，而不是脆弱的单服务创业公司；但投资人仍需要队列经济、支付方汇款明细和当前流动性包，才能把当前估值视为已充分承销。
