      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              虽然服务是一名患者一次一次交付，Midi 的采用路径在结构上是 B2B2C。终端用户是正在经历围绝经期或更年期症状的女性；机构买方可以是自保雇主、医疗体系，或已把 Midi
              纳入网内的健康计划；支付方通常是为门诊和处方理赔买单的商业保险。公司自己的材料反复强调这一区别：它是医疗提供方，不是点状解决方案供应商；它已出现在部分雇主福利菜单中；它可以用标准理赔支付嵌入医疗体系和健康计划工作流，而不是新增一条单独的
              PMPM 费用。这种结构很关键，因为可触达需求最强的地方，是雇主面对高龄员工理赔通胀、留才风险，以及成员对碎片化照护不满的场景。KFF 显示，员工年龄更大的企业家庭保费更高；Midi
              的雇主页则把未治疗更年期表述为劳动力和生产率问题。服务也适合那些想增加女性健康差异化、但不想再签一个独立合同的买方。覆盖排除仍然重要：多数 PPO 计划可用，但 Medicare、Medicaid 和
              Medi-Cal 不在报销核心内，这压缩了近期支付方触达，也让最佳契合点留在商业保险雇主和相邻医疗体系。
