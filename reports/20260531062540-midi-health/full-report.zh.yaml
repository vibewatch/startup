      - number: '6.3'
        title: 满意度、复用与准入摩擦
        blocks:
          - type: paragraph
            body: >-
              Midi 有足够多的公开使用和满意度代理指标，可以暗示真实复用行为，但还不足以证明 SaaS 意义上的耐久留存。公司 2023 年 50 州雇主公告引用了 95% 患者满意度；雇主材料提到约 70,000
              名患者有 3+ 次就诊、3,600 名患者有重复实验室数值、4,816 名患者首次就诊为体重管理。这些都是有意义的复用信号，因为它们说明服务不是一次性潮热咨询；患者会回来做随访、监测、筛查和相邻中年期需求。


              但消费者信任不是一边倒。官方证言强调当日预约、接受保险和症状快速缓解；存档的 Trustpilot 页面显示总体评分 4.3/5，并有强正面评价描述次日预约、响应迅速的临床医生和立即开始
              HRT。同一份存档也有关于账单跟进、预约变更、成本困惑，以及边缘临床情境的投诉；部分女性觉得流程太刚性或个性化不足。官方账单 FAQ
              也解释了为什么这种摩擦会出现：自付责任取决于计划设计，对账单可能在裁定后才到达，自费工作流也在 2026 年 5 月发生变化。因此，信任足以支撑增长，但还不足以把评价风险视为已解决。
