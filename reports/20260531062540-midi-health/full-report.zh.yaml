  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、报销与临床治理风险
        blocks:
          - type: paragraph
            body: >-
              Midi 采用的架构在风投支持的远程医疗公司里并不罕见，但规模做大后仍然天然脆弱。条款把受监管的医疗服务放在关联医疗集团和药房，而不是 Midi 本体；同一批文件也写明，Midi 通过平台销售的服务不走
              Medicare、Medicaid 和 Medi-Cal 报销。有效付款人池因此收窄到商业 PPO
              计划和少量自费边缘场景。雇主支持的需求强时，这套模式跑得通；一旦商业覆盖收紧，或自付摩擦上升，模型缓冲就更薄。按州拆开的结构还会拖慢合规。Midi 要求患者就诊时身处配送地址所在州；HHS
              指引则显示，跨州远程医疗仍取决于完整执照、临时执业例外、互认或注册路径，各州规则不一。临床治理是另一个锋利边缘。Midi 的睾酮项目公开承认，美国没有专门以女性为适应证的 FDA
              批准睾酮产品，并且只在部分州提供配制型睾酮。与此同时，ACOG 认为，有 FDA 批准替代方案时，不应常规开具配制型绝经期激素治疗；它也指出睾酮使用的长期安全数据有限。因此，风险不在于 Midi
              没有市场，而在于一家报销优先的诊所仍可能被执照、覆盖范围和对指南敏感的处方边界拖住。
