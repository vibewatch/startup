      - number: '2.2'
        title: 规模测算口径与品类时点
        blocks:
          - type: paragraph
            body: >-
              Midi 的合理测算框架应使用多个口径，而不是单个被抬高的 TAM。最宽口径下，Business Research Insights 估计全球更年期健康市场 2026 年为 $18.74 billion，到
              2035 年增至 $37.84 billion，但这个口径包含补充剂、个人护理和其他低急性度品类，远超 Midi 由支付方报销的临床模型。对决策更有用的美国口径来自 BCG：如果中重度症状女性得到充分治疗，到
              2030 年美国年度更年期医疗支出可接近 $40 billion；当前线上中年健康品类估值已经超过 $500 million。这个机会下方的可服务底座是雇主赞助保险市场：KFF 称，雇主赞助保险覆盖 154
              million 名 65 岁以下人群，家庭保费在五年上涨 26% 后，于 2025 年达到 $26,993。品类时点也有利。Rock Health 记录 2025 年美国数字健康融资 $14.2
              billion，仅 2026 年 Q1 就有 $4.0 billion，并明确在 Midi 完成 $100 million Series D、服务超过 230,000
              名患者后将其列为独角兽。因此，这个市场已不再处于成形前阶段；资金、买方痛点和公开品类语言足以支撑专科领导者，但仍早到份额远未定局。
