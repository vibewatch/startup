  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资基准与 Series C 轮桥接
        blocks:
          - type: paragraph
            body: >-
              Midi 已不再是一个概念型投机公司；它披露了真实规模。但融资路径很重要，因为价格走得比公开承保深度更快。公司 2026 年 2 月的 Series D 轮把公开估值标记推到超过 $1B；该轮融资
              $100M，并披露了迄今最强的经营指标：覆盖超过 45M 名女性、每周超过 25,000 名患者、500 名临床服务者网络，累计服务超过 230,000
              名患者。上述规模足以证明它在一个真实市场里具备品类领导地位，而不只是一个小众远程医疗订阅故事。


              更难的问题是 2024 年 4 月 Series B 到 2025 年 Series C 之间发生了什么。公开证据显示，Series B 定价约 $300M–$310M，2025 年春 Series C 又增加
              $50M，到 2026 年初 Series D 已超过 $1B。Business Insider 还称，Midi 披露约 $150M
              收入年化规模时仍未盈利。换言之，公司确实完成了一次重大规模跃迁，但投资人仍在给一个私有、未审计、尚未盈利的资产重新定价。Series C
              背景因此是建设性的，却不完整：后来的独角兽标记方向上验证了该轮，但公开证据仍无法告诉外部投资人，这次上调来自队列 质量、渠道效率，还是仅仅来自女性健康资本市场升温中的强劲动能。
