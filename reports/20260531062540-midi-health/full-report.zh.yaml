            body: >-
              真实采用的公开证据，在合作渠道里最强，而不是来自一长串公开雇主 logo。Midi 自己的医生和转诊页面称，平台已帮助超过 230,000 名患者；2026 年 Series D 公告称，每周已有超过
              25,000 名患者寻求照护。准入并不限于消费者自助获客：医生转诊承诺 15 分钟内联系，医疗体系页面强调重新激活预防照护，伙伴材料则展示行政和导航整合，让服务看起来更像嵌入式专科照护层，而不是独立 app。


              具名客户集合可信，但集中。医疗体系验证包括 Memorial Hermann、Mount Sinai、Keck Medicine of USC 和 Lifepoint。福利和雇主渠道验证包括 Collective
              Health、Hinge Health、Cleo、Beacon Wellness Brands，以及 MobiHealthNews 报道的 Progyny
              关联可用性。这些来源展示了多个获客面：直接消费者、医生转诊、医疗体系协作和雇主福利平台；但它们没有给出已签雇主数量或渠道级收入贡献的干净公开口径。含义是，Midi
              确有企业和伙伴牵引力，但外部投资人仍无法仅凭公开材料看清客户集中度的完整形状。
