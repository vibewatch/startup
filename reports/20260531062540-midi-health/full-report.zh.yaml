      - number: '1.5'
        title: 里程碑与反向信号
        blocks:
          - type: paragraph
            body: >-
              增长故事之外，有两个尽调限制需要重视。第一，已留存材料里最清晰的反向来源不是诉讼或监管行动，而是客户评价数据。存档的 Trustpilot 页面显示总体评分不错，但也有关于账单、排期摩擦，以及患者寻求直接延续
              HRT 却被转到别处后的不满。这些信号不能证明存在系统性临床失败，但确实说明，准入摩擦和流程刚性会侵蚀消费者体验。第二，公开披露仍有选择性。Medicare 和 Medicaid
              排除条款压缩了当前可触达需求；已留存来源也没有清楚披露董事会构成、确切总部、收入运行率或员工数。公司现在把自己包装为全国健康平台，但这些缺口限制了外部投资人仅凭公开材料判断治理、经营杠杆和司法辖区确定性的能力。
