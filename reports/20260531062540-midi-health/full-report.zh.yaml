  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与疾病负担
        blocks:
          - type: paragraph
            body: >-
              Midi Health 所处品类边界很窄，但正在被正式化：它是面向中年女性，尤其是围绝经期和更年期的、由保险覆盖的线上专科照护，而不是宽泛的初级保健远程医疗或消费者健康
              app。需求底座大，而且具有临床持续性。联邦和非营利来源把典型更年期过渡放在 45 至 55 岁之间，更年期本身约发生在 51 至 52 岁；围绝经期通常持续 4 至 8 年，有时长达 14
              年。公开来源对每年新增人群口径不一：SWHR 称美国每年约 1.3 million 名女性，BCG 则使用约 2
              million。因此，审慎读法是年度发病或进入人群很大，但精确数量取决于来源指的是最终绝经，还是更宽的过渡期队列。痛点不只是患病率，而是治疗不足：34% 有症状女性没有被诊断，20% 等待正式评估超过一年；BCG
              称，症状明显的女性中只有 60% 寻求照护，其中又只有 25% 接受治疗。这让 Midi 面向的市场更像一个夹在妇产科、初级保健、药房和雇主福利之间的专科准入缺口，而不是泛远程医疗口径。
