        title: 护城河、成熟度与局限
        blocks:
          - type: paragraph
            body: >-
              临床运营和技术相互强化时，Midi 的护城河最强。公司已经搭起可识别的中年期照护品牌、专科医生训练、保险方对齐、转诊通道，以及伙伴称显著提升产能的 AI 辅助文档工作流。公开招聘也显示，公司继续投入
              AI、平台、全栈、产品和商务岗位，说明它仍在把更多工作流栈内化，而不是停在外包远程医疗原语上。


              局限同样清楚。公开材料没有暴露
              API、架构图、模型治理细节或经审计的工作流指标，所以许多最重要的技术主张仍来自公司或伙伴口径。条款明确称，远程医疗并不适合所有病症，州级规则也可能改变服务可用性。复方激素边缘案例仍敏感：ACOG 警示，在存在
              FDA 批准选项时，不应常规使用复方更年期激素治疗；Midi 自己的睾酮页面也承认，美国没有 FDA
              批准、适用于女性的制剂。最后，客户评价显示，即使工作流总体受欢迎，也仍可能在账单、回电、排期和特殊临床适配边界上断裂。
