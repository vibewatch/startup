  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Midi 的运营模式要靠医疗集团、支付方、药房、临床人员、雇主和消费者数据触点协同跑通。
    data:
      nodes:
        - id: midi
          label: Midi 运营核心
        - id: medicalgroups
          label: 关联医疗集团
        - id: pharmacies
          label: 药房 / 复方药合作伙伴
        - id: payers
          label: 商业支付方
        - id: clinicians
          label: 50 州临床人员网络
        - id: employers
          label: 雇主 / 支付方买方
        - id: trackers
          label: 分析 / 跟踪层
        - id: patients
          label: 患者与评价
      edges:
        - from: midi
          to: medicalgroups
          label: 医疗服务交付结构
        - from: midi
          to: pharmacies
          label: 处方履约
        - from: midi
          to: payers
