chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Midi Health 是一家 100% 线上诊所，聚焦围绝经期、更年期和中年期相邻健康问题。公司称其 2021 年成立，2022 年在加州带着保险覆盖商业化上线，之后扩至全国。截至本报告运行日，Midi 在
              50 个州销售由保险覆盖的线上问诊和处方服务，把自己定位为不同于普通妇产科或初级保健体验的专科替代方案，并强调商业保险报销，而不是订阅模式。公开页面现在把产品集从核心更年期照护延伸到体重管理、性健康、癌症康复和
              AgeWell 长寿服务。因此，更准确的理解是：Midi 是一家保险原生的线上专科诊所，靠雇主、支付方、医疗体系和医生转诊分发，不是自费 app。主要公共准入限制在报销端：Midi 定价页面明确排除
              Medicare、Medicaid 和 Medi-Cal 覆盖。
