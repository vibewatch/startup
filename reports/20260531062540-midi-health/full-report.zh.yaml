  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 边界
      - 纳入的支出或服务
      - 排除的支出或约束
      - 主要买方 / 付款人
      - 与 Midi 的相关性
    rows:
      - - 核心绝经与围绝经期照护
        - 虚拟专科问诊、实验室检查、处方、症状管理、激素和非激素治疗
        - 不包括通用急诊式问诊或年度 PCP 体检
        - 商业保险加患者共付
        - 核心可报销切入口和品牌身份
      - - 同一中年健康旅程内的邻近服务
        - 体重管理、慢病风险管理、骨骼、情绪、睡眠和预防性筛查协调
        - 不包括完整心脏科或肿瘤科照护周期
        - 雇主、医疗系统和商业保险计划
        - 提高钱包份额，同时不离开专科赛道
      - - 雇主渠道
        - 福利发现、理赔计费访问、员工生产力叙事
        - 在公司叙事中，不是纯 PMPM 健康福利应用
        - 自保或全保雇主
        - 在计划已认可 Midi 的地方降低签约摩擦
      - - 医疗系统渠道
        - 转诊、专科访问、筛查、照护计划共享
        - 不拥有全服务线下绝经中心
        - 医疗系统加商业付款人
        - 在本地中年专科能力稀缺的地区扩大触达
      - - 消费者健康 / 补剂市场
        - 补剂、护肤、静修、非处方症状支持
        - 大多在 Midi 核心可报销照护模型之外
        - 自费消费者
        - 可作为宽 TAM 背景，但对承保 Midi 来说过于宽泛
      - - 政府项目
        - 长期潜在的老龄化和低收入需求
        - Medicare、Medicaid 和 Medi-Cal 目前被排除在可报销核心访问之外
        - 公共付款人
        - 重要的未来上行，但也是当前近端市场约束
    notes: 边界逻辑把 Midi 的付款人计费专科诊所，与通用远程医疗、纯 PMPM 点解决方案和自费健康产品区分开。
