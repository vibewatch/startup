  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图分层与替代层
        blocks:
          - type: paragraph
            body: >-
              Midi 的竞争场不是一个干净的同业集合。直接替代品是患者决定求医时，可以替代 Midi 选择的更年期远程医疗诊所：Alloy、Evernow、Gennev 和
              Winona。这些供应商在消费者可见的决策变量上竞争，包括是否接受保险、标价是否简单、专科强度、消息响应节奏，以及治疗立场偏 FDA
              批准选项还是复方配制。第二层竞争的对象不是患者单次就诊，而是预算所有者。Maven、Progyny 和 Ovia
              把更年期打包进更宽的女性健康、家庭福利或导航关系，雇主或支付方可以不采购独立更年期诊所，也能满足这个需求。第三层仍是现状：普通妇产科、初级保健医生或健康计划导航工作流；直接远程医疗供应商明确把这些路径描述为太慢、太轻视症状，或训练不足。结果是一个分层市场，买方在专科照护、低摩擦自费和打包福利之间选择，而不是一个赢家通吃的单一品类。
