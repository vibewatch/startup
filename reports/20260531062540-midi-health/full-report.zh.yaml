      - number: '3.2'
        title: 直接远程医疗同行：价格、准入与临床立场
        blocks:
          - type: paragraph
            body: >-
              在直接同行中，Midi 最强的差异点是兼容保险的专科照护。已留存官网页面强调全国可用、主流保险覆盖、PPO 网内定位，以及雇主或医疗体系入口。Gennev
              是最像的对标替代方案，因为它同样组合了更年期训练医生、30 分钟视频问诊、保险工作流、全国可用性和营养师提供的生活方式支持。Evernow 从另一个角度进攻：它把保险覆盖的视频问诊与 $150 自费选项、每月
              $35 会员入口、消息沟通和快速准入放在一起，Progyny 会员还可获得 48 小时内预约。Alloy 的公开定位更强调价格和指南，评测来源把其可见自付成本列在 Midi 之下，官网页面则强调 FDA
              批准选项。Winona
              是最清楚的便利性加生物同质替代方案，把复方或生物同质激素定位、送货上门履约和持续社区支持打包在一起。简言之，直接竞争不是一张功能清单，而是患者最看重哪种取舍：保险经济性、最低可见价格、消息便利性，还是生物同质的简单性。
