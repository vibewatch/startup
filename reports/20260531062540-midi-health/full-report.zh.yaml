  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 患者画像与支付方结构
        blocks:
          - type: paragraph
            body: >-
              Midi 最清晰的客户，是一名商业保险覆盖的中年女性：她需要更年期或围绝经期专长，但不想等几个月才见到线下妇产科医生。官方雇主页和消费者页面把服务围绕大约 35-65 岁或
              40+、正在经历激素过渡的女性来叙述；照护模型本身也明确是保险原生，而不是固定费用的健康订阅。公司称其在 50 个州可用、与多数 PPO 计划网内，并能通过主流商业保险结算问诊和处方。相比自费更年期
              app，这显著扩大了可触达人群。


              支付方结构仍有倾斜。Midi 明确排除 Medicaid 和 Medi-Cal 患者，也不参与 Medicare；Medicare
              受益人只能作为自费用户使用服务，不能为问诊或药物提交理赔。因此，实际支付方结构压倒性偏向商业保险，自费更像兜底，而不是主导模型。雇主覆盖是主要获客面，因为员工可以查询自己的雇主是否提供
              Midi；面向雇主的销售话术则是，服务可以直接走理赔结算，不增加雇主费用。实际上，公开客户图景就是 B2B2C：用户是患者，经济闸门通常是商业保险和雇主；自费主要在覆盖失败时存在。
