      - number: '8.2'
        title: 可比公司、公开倍数区间与 TAM 捕获
        blocks:
          - type: paragraph
            body: >-
              公开记录里最干净的估值锚点不是 DCF，而是倍数合理性校验。按 Series C 前后报道的 $150M 收入年化规模计算，Midi 最新披露估值约为收入年化规模的
              6.7x。这个水平明显高于本文核对的公开可比组：Hims 约 2.5x、LifeStance 约 2.2x、Progyny 约 1.8x、Privia 约 1.6x，Teladoc 约
              0.3x。这些都不是完美可比。Hims 更偏自费和消费者化，Teladoc 是成熟综合体，Progyny 做生育和雇主福利，Privia 做医生赋能，LifeStance 做心理健康。但放在一起，它们说明
              2026 年公开市场通常不会在缺乏异常强证据时，为远程医疗或照护交付公司支付 6x 以上收入倍数。


              看多的反驳是，Midi 或许值得溢价，因为它站在一个巨大、诊断不足的女性健康需求和仍处早期的雇主报销市场交界处。PwC 将绝经视为 $10B–$15B 市场，到 2030 年可增长至 $15B–$25B；Mayo
              和 Monash 也强化了症状负担大且治疗不足这一点。相对覆盖基数，Midi 自身披露的渗透率仍很小：覆盖 45M 名女性，累计患者 230,000 名，仍只有约 0.5%。这支持 TAM
              余量，但不能单独证明当前倍数合理。只有当 Midi 比公开可比公司更快把这块余量转化成重复使用、产品附加和可持续付款人经济性，溢价才成立。
