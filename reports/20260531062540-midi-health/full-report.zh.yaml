      - number: '8.3'
        title: 报销、留存与下行情景
        blocks:
          - type: paragraph
            body: >-
              Midi 的商业模式有吸引力，因为它避开了绝经创业公司的一大陷阱：纯自费依赖。公司称其接入大多数 PPO 计划网络，可通过雇主认可的计划进行理赔，也能补充健康系统照护。这可能比自费 HRT
              同行带来更低的有效获客成本、更好的可负担性和更广触达。但同一结构也带来投资承保敏感性。Midi 明确排除 Medicaid 和 Medi-Cal，并把 Medicare 仅作为自费处理，所以今天可报销 TAM
              比表面需求更窄。与此同时，CMS 继续在服务层面定义合格远程医疗报销，即便 2026 年部分灵活性永久化，也没有放开每一个被请求的远程医疗类别。


              留存是摆动因素。上行情景直观：绝经是多阶段旅程，产品线已延伸到体重管理、长寿和 Custom Rx，公开研究显示症状持续时间足以支撑持续照护关系。下行情景则是，公开证据从未披露复诊节奏、付款人实收、毛利率或队列
              留存。Trustpilot 上关于账单混乱、未按约发生的问诊、改期和特殊病例匹配差的投诉，显示即使顶线需求真实，模型也可能漏掉价值。因此，这些估值区间最好被理解为承保括号，而不是点估计。在 >$1B
              入场标记下，基准情景只有在报销质量和留存把规模转化为可持续经济性时才成立；否则，悲观情景会远低于上一轮。
