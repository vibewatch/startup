      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Midi 融资节奏快，而且资金前置。Forbes 报道公司在 2022 年 10 月完成 $14 million 种子轮并只在加州上线；GV 称其最早在 2023 年 Series A 投资，Sacra
              将该轮规模标为 $25 million。2024 年 4 月增长轮的方向清楚，但公开报道里的数字并不干净：公司官方公告称新增融资 $60 million、累计融资达到 $100 million；Fierce
              把一个名人支持的 SPV 算进去后，将其记为 $63 million Series B。不论采用哪种口径，2024 年都是 Midi 从细分创业公司跃迁为全国品类建设者的一年，Emerson Collective
              领投，GV 继续参与。随后 Sacra 报道 2025 年 10 月由 Advance Venture Partners 领投的 $50 million Series C，接着是 2026 年 2 月
              Goodwater 领投、估值超过 $1 billion 的 $100 million Series D。按已披露轮次计算，累计融资约 $249 million，与 Fierce “more than $250
              million”的简写一致，但公开来源没有披露债务、老股交易或 Series C 估值。
