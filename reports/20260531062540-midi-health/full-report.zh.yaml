  - id: TV001
    title: 推荐摘要表
    columns:
      - 指标
      - 评估
      - 证据
      - 决策含义
    rows:
      - - 推荐
        - 继续研究
        - 公司质量和需求验证都真实存在，但当前轮次在私有尽调前已经把相当多上行计入价格。
        - 只有能拿到尽调权限时才让 Midi 留在管线里；不要仅凭公开证据放行入场。
      - - 置信度
        - 中
        - 这家私营远程医疗公司的公开记录优于平均水平，但仍缺少经审计盈利能力、NRR、支付方收益率和优先权分配瀑布条款。
        - 把本章当作投资测算框架，而不是私有材料的替代品。
      - - 风险评级
        - 高
        - 商业保险集中度、报销排除、服务质量投诉和宣传口径纪律问题，都让下行传导真实存在。
        - 假设留存或报销不及预期时，下行可以跌破当前估值标记。
      - - 估值立场
        - 偏贵
        - Midi 约 6.7x 的隐含收入倍数高于本章审阅的 0.3x-2.5x 公开可比区间。
        - 需要更低价格、更强私有证据，或两者兼具。
      - - '>$1B 入场的基准情景总回报'
        - 稀释前约 1.0x-1.2x
        - 基准情景只小幅跑赢最近一轮，优先权条款还可能进一步压窄普通股回报。
        - VC 式结果需要走出乐观情景，而不是基准情景。
    notes: 仅用公开数据估算的决策摘要；估值和回报含义均为总额口径，未建模现金、债务、税项或优先权分配瀑布。
    claimRefs:
      - CV042
      - CV048
      - CV049
      - CV051
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资论点：需求大且渗透不足
        - PwC、Mayo 和 Monash 都支持一个规模大、治疗不足的中年护理问题，且有空间做纵向管理。
        - 如果证明公司无法把症状负担转成重复变现，这根支柱会被削弱。
      - - 投资论点：保险方支持的分销有差异化
        - Midi 称，它可以通过认可健康计划计费，并通过雇主和医疗系统触达患者，而不只是直接自费获客。
        - 如果实际支付方收益率或拒付率偏弱，CAC 和可负担性优势会下降。
      - - 投资论点：产品宽度可抬升生命周期价值
        - 体重管理、长寿健康和 Custom Rx 把 ARPU 选项扩到单次更年期就诊之外。
        - 如果附加购买率或续方行为偏低，高端平台叙事就会失效。
      - - 反论点：当前价格已假设高质量溢价增长
        - 最新估值标记隐含约 6.7x 年化收入，而审阅后的公开区间更接近 0.3x-2.5x。
        - 如果入场价格明显更低，或队列与利润率的私有证据很强，这一异议会缓和。
      - - 反论点：可报销 TAM 窄于标题级需求
        - Midi 排除 Medicaid 和 Medi-Cal，且目前只以自费方式服务 Medicare 人群。
        - 如果有可信且合规的路径进入更多支付方人群，可变现 TAM 会扩大。
      - - 反论点：执行和治理信号并不干净
        - Trustpilot 投诉和 NAD 挑战显示，服务摩擦和宣传纪律会损害信任。
        - 如果公司拿出投诉解决记录、可量化质量结果和更强合规报告，这一担忧会下降。
    notes: 投资论点行概括可投性驱动因素；反论点行概括当前价格下仍阻碍投资测算的因素。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV017
      - CV018
      - CV019
      - CV041
      - CV042
      - CV046
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 到 2028 年，收入借助强劲商业保险增长、高重复就诊和有意义的产品附加购买，达到约 $400M-$475M。
        - 按 5.0x-5.5x 倍数，对应 $2.0B-$2.6B 估值区间；从 >$1B 入场看，稀释前总回报约 2.0x-2.6x。
        - 需要高溢价倍数持续、队列表现强劲，以及干净的支付方经济性。
        - 需要私有数据显示留存、CAC 回收和利润率改善；公开记录尚未提供。
      - - 基准
        - 到 2028 年收入达到约 $270M-$310M，商业保险增长延续，但留存和附加购买改善只属中等。
        - 按 3.5x-4.0x 倍数，对应 $0.95B-$1.25B 估值区间；从最新估值标记看，稀释前总回报约 1.0x-1.2x。
        - 几乎容不下报销滑坡或优先权压力。
        - 这是让当前价格大致站得住的最低路径。
      - - 悲观
        - 到 2028 年收入仅约 $170M-$220M，原因是重复使用、报销质量或渠道扩张不及预期。
        - 按 2.0x-2.5x 倍数，对应 $0.35B-$0.55B 估值区间；稀释前总回报约 0.3x-0.6x。
        - 若温和退出中优先权吸收价值，普通股结果可能更差。
        - 账单摩擦、队列表现偏弱或渠道采用放慢，都会指向这一情景。
    notes: 情景区间根据公开年化收入、可比倍数和投资测算假设估算；并非公司指引或经审计预测。
    claimRefs:
      - CV006
      - CV042
      - CV045
      - CV046
      - CV048
      - CV049
      - CV050
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Midi Health
        - 2025 年年化收入 / 最新私募轮
        - 基于 ~$150M 年化收入的 >$1.0B（约 6.7x）
        - 本章直接入场基准。
        - 私有公司、未经审计，盈利能力仍未披露。
      - - Hims & Hers
        - 公开市值 / 收入
        - 约 2.5x 市值 / 收入
        - 高增长远程医疗和消费者健康基准，带有类订阅行为。
        - 更偏 DTC 和现金自费；不是保险主导的更年期护理。
      - - Teladoc
        - 公开市值 / 收入
        - 约 0.3x 市值 / 收入
        - 成熟、多元化虚拟医疗的远程医疗下界基准。
        - 业务组合复杂且增长更慢，可能让类比被过度惩罚。
      - - Progyny
        - 公开市场市值 / 收入
        - ~1.8x 市值 / 收入
        - 最接近的上市可比公司，横跨雇主福利和女性健康邻近赛道。
        - 生育业务经济性和雇主模式不同于绝经护理。
      - - Privia Health
        - 公开市场市值 / 收入
        - ~1.6x 市值 / 收入
        - 有用的保险方协同护理交付可比公司，带有商业支付方敞口。
        - 医生赋能平台，不是专科女性健康品牌。
      - - LifeStance
        - 公开市场市值 / 收入
        - ~2.2x 市值 / 收入
        - 基于问诊的医疗交付里，混合护理增长基准。
        - 心理健康专科和诊所模式都不同于 Midi。
      - - Maven Clinic
        - 私募融资 / 估值
        - 2022 年 Series E 轮 $90M，估值 $1.35B；15M 覆盖人群，客户留存率 96%
        - 说明私募买方愿意为规模化雇主端女性健康平台付费。
        - 只是历史数据点，且覆盖更宽的家庭健康范围。
      - - Kindbody
        - 私募融资 / 估值
        - 2023 年融资 $100M，估值 $1.8B；2.4M 覆盖人群，31 家诊所
        - 说明有雇主分发的专科女性健康平台可以拿到溢价定价。
        - 生育 / 诊所模式比 Midi 更重资本。
    notes: 选取与模式匹配的上市和私有可比公司，覆盖远程医疗、雇主福利和专科女性健康平台；各数据日期并不完全对齐，列表也不穷尽。
    enumerationScope:
      coverage: sample
      basis: >-
        Selected model-appropriate public and private analogs spanning telehealth, employer benefits, and women’s-health
        platforms using 2022-2026 disclosed marks; not an exhaustive market map.
    claimRefs:
      - CV026
      - CV028
      - CV030
      - CV032
      - CV034
      - CV035
      - CV036
      - CV042
  - id: TV005
    title: 投资论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 留存不及预期
        - 复购使用或队列留存显著低于尽调假设
        - 会打穿纵向持续护理投资论点，让溢价倍数失去支撑。
        - 重新定价或放弃。
      - - 实际支付方收益不及预期
        - 按支付方 / 州拆分的报销弱、拒付高，或回款慢
        - 会压缩毛利率，让保险方主导分发不如宣传中有吸引力。
        - 等理赔数据跑清楚后再投资。
      - - 买方采用停滞
        - 雇主和支付方扩张在当前足迹之外仍是小众
        - 实际 TAM 变小，当前估值标记背后的规模化故事也变弱。
        - 下调增长假设，重新审视可比倍数。
      - - 信任或理赔纪律问题恶化
        - 反复出现投诉模式，或出现新的监管 / 合规行动
        - CAC、流失和治理风险会同时抬升。
        - 暂停尽调，或要求增强合规报告。
      - - 出现结构化或低价下一轮
        - 未来融资重置估值，或加入很重的优先经济条款
        - 证实公开证据撑不起此前的溢价价格。
        - 不要追当前估值标记，等待价格发现。
    notes: 否决触发项是可监测的尽调和投后信号，直接绑定当前价格，而不只是抽象的公司质量判断。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV046
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 队列留存
        - 复诊曲线、产品附着、续方行为，按渠道拆分的 NRR 或 LTV
        - 只有 Midi 真是纵向持续护理、而非一次性服务，溢价入场才成立。
        - 投资人尽调：调阅资料室中的队列表和渠道切片。
      - - 支付方经济性
        - 实际报销、拒付、回款、按州拆分的支付方组合
        - 公司按保险支持平台定价，总额到净额质量就很关键。
        - 财务和收入周期管理复核，并抽查支付方回款明细样本。
      - - 股权结构 / 优先权栈
        - 股价、优先权、可转债、期权池、备考稀释
        - 下行情景下普通股价值可能远差于企业价值情景所暗示的结果。
        - 法务复核股票购买协议和董事会材料。
      - - 盈利能力桥
        - 经审计的 2025 年收入、毛利率、EBITDA、现金、烧钱速度、跑道
        - 运行率规模不会自动变成持久经济性。
        - 审计包加月度管理账。
      - - 渠道组合与 CAC
        - 直销、雇主和医疗系统获客组合，以及按队列拆分的回本期
        - 决定全国规模是高效扩张，还是靠重营销堆出来。
        - 增长和财务工作组，配合队列 CAC 分析。
      - - 质量 / 合规控制
        - 投诉解决指标、临床医生爽约率、广告审核流程
        - 信任和理赔纪律也是估值下行情景的一部分。
        - 运营和合规尽调；复核 SOP 和 QA 仪表盘。
    notes: 要把本章从公开市场框架推演变成完整承销后的投资决定，这些问题是最低证据包。
    claimRefs:
      - CV039
      - CV041
      - CV045
      - CV046
      - CV049
      - CV051
