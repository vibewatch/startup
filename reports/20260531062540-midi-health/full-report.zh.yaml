      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              Midi 所在品类最强的驱动因素，是成本通胀、专科医生稀缺、远程医疗行为已沉淀，以及足够长、足以影响商业采用的政策支持。大型雇主面对的 2026 年医疗成本趋势约在 6.7% 至 9.0%
              之间，具体取决于调查和计划设计假设；GLP-1 等专科药带来的药房压力，也迫使买方审视哪些方案能把支出导向预防、依从性和更好的专科准入。远程医疗仍足够嵌入，可以支撑这个模型：McKinsey
              仍发现使用率远高于疫情前水平，并存在 $250 billion 的虚拟照护机会；联邦政策也把主要 Medicare 远程医疗灵活性延长至 2027
              年。同样的事实也定义了约束。灵活性仍是临时的；如果没有新立法，许多非行为健康 Medicare 规则将在 2028 年恢复；Midi 今天本身不在 Medicare 和 Medicaid 报销范围内；BCG
              还描述了结构性供给短缺，住院医培训中的更年期训练薄弱，认证覆盖不到美国活跃执照医生的 1%。从估值看，这意味着 Midi
              受益于品类时点和分发验证，但投资人应把它看作一家正在抢时间锁定支付方准入和临床供给的公司；否则，政策支持收窄或更大规模的在位者吞掉这个细分市场，都会改变估值基础。
