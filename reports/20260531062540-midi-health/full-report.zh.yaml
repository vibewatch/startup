      - number: '6.4'
        title: 耐久性与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Midi 的公开客户证据支持一套宽渠道策略，但还不是完整的耐久性文件。公司可以指向直接消费者准入、雇主福利、医生转诊、医疗体系合作和福利平台整合，这应能降低对单一获客动作的依赖。可是，相比 Midi
              网站上的规模语言，具名客户名单仍偏窄；公开验证在医疗体系和伙伴平台上强得多，在长名单披露雇主上弱得多。


              更大的尽调问题是分母数据缺失。公开材料没有披露雇主数量、平均合同规模、头部客户敞口、续约率、总留存率（GRR）、净留存率（NRR）、流失率，或直接消费者、雇主赞助、医疗体系转诊和福利平台量之间的拆分。即便商业
              PPO 参与是模型核心，材料也没有展示按保险方划分的集中度；公共保险项目排除仍很明确。因此，Midi
              的公开客户章节读起来像一个强采用故事，但商业透明度不完整：真实患者和真实分发有清晰证据，披露却不足以量化收入基础到底有多黏、多集中，或多依赖渠道。
