  - id: TR005
    title: 缓释与终止条件表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 商业报销耐久性
        - 拒付、意外账单或患者自付责任上升
        - 头部商业保险计划中，拒付持续增加或患者费用投诉反复出现
        - 在拿到支付方级回款和留存证据前，暂停上调估值。
      - - 州执照 / 监管规范性
        - 因地理位置、注册失效或新的州级限制导致的就诊取消
        - 核心州出现任何重复服务撤出，或出现影响远程医疗运营的监管通知
        - 重新评估 50 州规模化假设，并要求合规整改计划。
      - - 隐私 / 安全
        - 需报告的泄露、OCR 投诉或 FTC 式消费者健康数据问题
        - 任何涉及消费者健康数据的需报告泄露，或追踪器治理偏离政策的证据
        - 在根因、范围和控制重设计得到独立验证前，按投资论点破裂处理。
      - - 临床治理
        - 睾酮安全信号、保险方限制或方案逆转
        - 不良事件聚集、州层面收缩，或有记录显示偏离指南支持的使用
        - 下调高风险服务线增长假设，并重新审视诊疗范围策略。
      - - 临床医生供给
        - 等待变长、专科覆盖变薄或临床医生流失上升
        - 无法在主要州或新扩专科维持及时可及性
        - 压缩增长、上调服务成本假设，并测试雇主买方是否察觉质量下滑。
      - - 渠道控制 / 竞争
        - 雇主或支付方流失到打包式女性健康平台
        - Progyny、Maven 或 Elektra 式替代方案造成实质性不续约、赢单率放慢或定价压力
        - 下调终局倍数预期，并认为单靠专科深度不足以构成护城河。
    notes: 触发项聚焦会改变投资测算的可观察事件，而不是泛泛的管理层愿景；公开证据目前不完整，部分触发项需要私有尽调材料。
    claimRefs:
