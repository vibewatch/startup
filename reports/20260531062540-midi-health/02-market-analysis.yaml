- id: SM002
  title: Sizing lenses and category timing
  body: 'The right sizing framework for Midi uses multiple lenses instead of one inflated TAM. At the broadest end, Business Research Insights estimates a global menopause-wellness market of $18.74 billion in 2026 growing to $37.84 billion by 2035, but that lens includes supplements, personal care, and other lower-acuity categories that extend well beyond Midi’s payer-billed clinical model. A more decision-useful US lens comes from BCG: if women with moderate to severe symptoms were sufficiently treated, annual US menopause healthcare spend could reach almost $40 billion by 2030, versus a current virtual-midlife category already valued above $500 million. The serviceable substrate underneath that opportunity is the employer-sponsored market: KFF says employer-sponsored insurance covers 154 million people under age 65, with family premiums at $26,993 in 2025 after a 26% rise over five years. Category timing also looks favorable. Rock Health logged $14.2 billion of US digital-health funding
    in 2025 and $4.0 billion in Q1 2026 alone, and it explicitly identified Midi as a unicorn after a $100 million Series D while serving more than 230,000 patients. The market is therefore no longer pre-formation; it has enough funding, buyer pain, and public-category language to support specialist leaders, but it is still early enough that share is far from settled.'
