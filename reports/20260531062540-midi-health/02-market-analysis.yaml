  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Public PMPM pricing, employer contract economics, or visit-level reimbursement yields for Midi.
    whyItMatters: Without disclosed unit economics, it is difficult to translate patient scale and employer distribution into durable revenue quality or gross-margin assumptions.
    diligencePath: Request employer pricing decks, de-identified reimbursement examples, and contract archetypes by payer class.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: payer-breadth
    missingEvidence: Named commercial payer contracts, Medicare Advantage participation status, and geographic in-network depth by carrier.
    whyItMatters: Coverage breadth determines real serviceable demand and whether apparent all-state availability converts into reimbursed visits for target members.
    diligencePath: Ask management for current payer roster, in-network states by carrier, denial rates, and any Medicare Advantage roadmap.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: employer-utilization
    missingEvidence: Employer-level utilization, repeat-visit rates, and ROI outcomes for named customer cohorts.
    whyItMatters: Public proof of Fortune 100 distribution does not reveal adoption intensity, retention, or measurable economic impact after launch.
    diligencePath: Request anonymized employer case studies with eligibility counts, enrollment, visit frequency, and medical-cost or absenteeism outcomes.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: clinician-capacity
    missingEvidence: Current clinician count, certification mix, hiring velocity, and visit availability by state.
    whyItMatters: Provider scarcity appears to be the main structural scaling constraint for the category, but public sources do not show whether Midi has solved it better than peers.
    diligencePath: Request clinician roster by credential, open-panel capacity, wait-time metrics, and training pipeline documentation.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM004
