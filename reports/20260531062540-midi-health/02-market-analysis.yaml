tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / boundary
  - Included spend or service
  - Excluded spend or constraint
  - Primary buyer / payer
  - Relevance to Midi
  rows:
  - - Core menopause & perimenopause care
    - Virtual specialty visits, labs, prescriptions, symptom management, hormone and non-hormone treatment
    - Not generic urgent care or annual PCP physicals
    - Commercial insurer plus patient cost share
    - Core reimbursed wedge and brand identity
  - - Adjacencies inside the same midlife journey
    - Weight management, chronic-disease risk management, bone, mood, sleep, and preventive screening coordination
    - Not full cardiology or oncology episodes of care
    - Employer, health system, and commercial plan
    - Raises wallet share without leaving the specialty lane
  - - Employer channel
    - Benefit discovery, claims-billed access, workforce productivity framing
    - Not a pure PMPM wellbeing app in the company narrative
    - Self-insured or fully insured employer
    - Reduces contracting friction where plans already recognize Midi
  - - Health-system channel
    - Referral, specialist access, screenings, care-plan sharing
    - Not full-service brick-and-mortar menopause center ownership
    - Health system plus commercial payer
    - Extends reach where local midlife expertise is scarce
  - - Consumer wellness / supplement market
    - Supplements, skincare, retreats, non-prescription symptom support
    - Mostly outside Midi’s core reimbursed care model
    - Self-pay consumer
    - Useful as broad TAM context, but too expansive for underwriting Midi
  - - Government programs
    - Potential long-run aging and lower-income demand
    - Medicare, Medicaid, and Medi-Cal are currently excluded from reimbursed core access
    - Public payers
    - Important future upside but current near-term market constraint
  notes: Boundary logic distinguishes Midi’s payer-billed specialty clinic from generic telehealth, pure PMPM point solutions, and self-pay wellness products.
