    {
      "id": "underwriting-gaps-and-financial-verdict",
      "title": "Underwriting gaps and financial verdict",
      "body": "The public record is strong enough to support a directional verdict on Midi's economics. The company appears to have found a real reimbursement-backed growth wedge in midlife women's health, expanded that wedge into adjacent service lines, and used venture capital to build a national delivery system with increasing operational leverage. The adverse evidence is not about existential demand; it is about transparency and underwriting depth. Trustpilot complaints include billing confusion, unsupported expectations on out-of-pocket cost, appointment no-shows, and perceptions of medication-first care. More importantly, the hard financial blind spots remain unresolved: no public service-line mix, no realized reimbursement per visit, no gross margin, no CAC/payback, no retention or concentration, and no cash or debt bridge. That means the right investment stance from public evidence is balanced. Midi looks more like a scaled, multi-product virtual care platform than a fragile single-service startup, but investors still need cohort economics, payer remits, and a current liquidity package before treating the current valuation as fully underwritten.",
      "claimRefs": [
