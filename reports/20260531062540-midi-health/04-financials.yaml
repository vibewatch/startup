    {
      "id": "distribution-scale-and-unit-economics-proxies",
      "title": "Distribution scale and unit-economics proxies",
      "body": "Midi's go-to-market model looks broader than a typical employer-only digital point solution. Official employer and health-system pages, plus Keck and Mount Sinai partnership releases, show a three-lane distribution system: women can come directly to Midi, employers can steer members through in-network claims-based access, and health systems can refer patients into Midi while preserving continuity with local providers. That distribution breadth likely matters more than list pricing because it lowers dependence on any single acquisition path. The best public unit-economics signals are operational rather than accounting-based. Ambience said its Athena-integrated AI tools save clinicians more than three hours per day, add roughly three patients per day, and cut onboarding time by 50%, while Midi says clinicians go through 50+ courses and weekly lectures. Those figures suggest the company is attacking margin through clinician productivity, documentation efficiency, and faster ramp, not through visibly higher public prices. Outcomes claims—up to 13% lower total cost of care and better screening adherence—also support payer ROI, but they are still company-framed evidence rather than audited cohort economics.",
