  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Midi Health has unusually strong public financing and demand disclosure for a private virtual clinic: official and independent sources support a $100 million Series D at a $1+ billion valuation, about $150 million of 2025 revenue run rate before that raise, more than 25,000 weekly patients, and coverage reaching more than 45 million women. The public record also shows an insurance-first, multi-channel model spanning direct patient acquisition, employers, health-system referrals, and growing product/service extensions such as weight management, AgeWell, and Custom Rx. But it still omits the underwriting inputs that matter most—cash, burn, debt, gross margin, CAC/payback, retention, and service-line revenue mix—so the chapter can support a scale verdict, not a full downside model."
  },
  "sections": [
    {
      "id": "revenue-model-pricing-and-monetization-surfaces",
      "title": "Revenue model, pricing, and monetization surfaces",
      "body": "Midi's public financial story starts with the shape of the revenue model rather than a clean audited P&L. Official pricing pages position the business as insurance-backed specialist care for commercially insured women, with standard copays and deductibles replacing a broad cash-pay subscription model. That matters because Midi is clearly building around reimbursed clinical visits, not just consumer wellness spend. Public pages also show the monetization surface widening beyond menopause visits: the company now markets weight-management care, cancer-survivor care, an AgeWell longevity visit, and Midi Custom Rx products for skin, hair, sexual health, weight, and longevity. The portal stack and care-flow pages show that visits can include prescriptions, labs, screenings, secure messaging, and product fulfillment, which supports longitudinal revenue per patient. What the public record still does not show is the split between reimbursed visit revenue, pharmacy or product attach, and any higher-value specialty programs. Investors can underwrite the existence of multiple revenue streams, but not yet their mix or margin quality.",
