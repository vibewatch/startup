- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Midi solution
  - Measurable benefit
  - Limitation
  rows:
  - - Book an insured specialist visit
    - Check coverage, register, and schedule virtually
    - Coverage-check flow plus virtual clinician visit
    - Remote access with PPO acceptance and broad state reach
    - Medicare and Medicaid pathways are excluded
  - - Maintain care plan between visits
    - Async follow-up after visit
    - Athena secure messaging plus shareable care plan and results
    - Keeps specialist support tied to ongoing care
    - Patient must monitor messages and attachments
  - - Get labs and screenings ordered
    - Use local lab / imaging / specialist network
    - Clinician orders labs and can refer back for imaging or procedures
    - Bridges virtual care into local in-person infrastructure
    - Execution depends on external providers and local scheduling
  - - Fill standard medications
    - Preferred local or delivery pharmacy
    - Midi sends prescriptions to patient-selected pharmacy from questionnaire
    - Patient choice and home-delivery options
    - Stockouts and prior-auth friction remain external
  - - Buy or refill Midi Custom Rx
    - Portal purchase after prescription creation
    - App-based order + Buy Now flow + refill prompts
    - Centralized commerce and direct shipping
    - State exclusions and payment processing can still delay care
  - - Refer a patient from outside practice
    - Online or fax referral into Midi
    - Referral form with secure visit-detail sharing back to referrer
    - Public promise to contact patient within 15 minutes
    - No public data on conversion or close-the-loop speed
  notes: Measurable benefits are workflow-level benefits stated or implied by public docs; they are not audited
    clinical-outcome metrics.
