  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: Detailed architecture of Midi's proprietary AI engine, model ownership versus vendor systems,
      validation metrics, and human-oversight controls by use case.
    whyItMatters: The public story leans heavily on AI-enabled scalability, but without governance and validation
      detail it is hard to separate durable internal IP from vendor-enabled workflow lift.
    diligencePath: Request architecture review materials, model cards, vendor contracts, QA metrics, and internal
      dashboards for chart analysis, triage, and documentation use cases.
    relatedQuestionRefs:
    - QE015
    - QE023
    - QE025
  - type: missing-source
    severity: material
    topic: developer-auditability
    missingEvidence: Public API documentation, repo activity, external architecture docs, or other developer-facing
      artifacts beyond hiring pages and patient help content.
    whyItMatters: Without inspectable technical artifacts, product-tech diligence relies heavily on company narratives
      and partner case studies rather than on externally auditable engineering signals.
    diligencePath: Ask for API docs, integration specs, sandbox access, SDLC and security-process docs, and any
      public or customer-facing developer materials.
    relatedQuestionRefs:
    - QE014
    - QE025
  - type: missing-source
    severity: material
    topic: outcomes-validation
    missingEvidence: Independent validation of claimed screening lift, capacity gains, wait-time benefits, onboarding
      savings, and care-management accuracy.
    whyItMatters: Workflow productivity can be a moat, but only if the gains hold outside partner-authored case
      studies and company-funded releases.
    diligencePath: Request audited KPI definitions, cohort methodology, raw before-and-after comparisons, and customer
      references willing to discuss operational outcomes.
    relatedQuestionRefs:
    - QE016
    - QE023
    - QE025
  - type: missing-source
    severity: minor
    topic: state-coverage-and-slas
    missingEvidence: State-by-state matrix for testosterone and Custom Rx eligibility plus referral-closure, prior-authorization,
      and handoff service-level metrics.
    whyItMatters: State rules and external execution quality directly shape conversion and continuity-of-care performance,
      especially for newer modules and high-friction therapies.
    diligencePath: Obtain state launch matrix, pharmacy-partner coverage map, prior-auth dashboards, and referral-closure
      reporting by partner and geography.
    relatedQuestionRefs:
    - QE011
    - QE017
    - QE024
    - QE025
    relatedTableRefs:
    - TE005
