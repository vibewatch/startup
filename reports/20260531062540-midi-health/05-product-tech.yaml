- id: moat-maturity-and-limitations
  title: Moat, maturity, and limitations
  body: |-
    Midi’s moat is strongest where clinical operations and technology reinforce each other. The company has built a recognizable midlife-care brand, specialist clinician training, insurer alignment, referral rails, and an AI-assisted documentation workflow that partners say has meaningfully increased capacity. Public hiring also shows continued investment in AI, platform, full-stack, product, and commerce roles, which suggests the company is still internalizing more of the workflow stack instead of stopping at outsourced telehealth primitives.

    The limitations are equally visible. Public materials do not expose APIs, architecture diagrams, model governance details, or audited workflow metrics, so many of the most important technology claims remain company- or partner-reported. The terms explicitly say telehealth is not suitable for every condition and that state rules can change service availability. Compounded-hormone edge cases remain delicate: ACOG cautions against routine use of compounded menopausal hormone therapy when FDA-approved options exist, and Midi’s own testosterone page acknowledges that no FDA-approved U.S. formulation is indicated for women. Finally, customer reviews show that even a well-liked workflow can still break at billing, callback, scheduling, and special-case-clinical-fit boundaries.
  claimRefs:
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
  - CE037
