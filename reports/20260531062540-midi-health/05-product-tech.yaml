- id: insurance-fulfillment-and-care-coordination
  title: Insurance, fulfillment, and care coordination
  body: |-
    Midi’s operating model depends on making telehealth feel administratively lighter than the local alternative. Public insurance materials position the service as in-network with most PPO plans, but the help-center articles make clear that the real experience is still built around deductibles, coinsurance, copays, post-visit patient responsibility, and card-on-file billing. The company explicitly excludes Medicare, Medicaid, and Medi-Cal pathways, so the service is optimized for commercially insured or self-pay users rather than for the broadest possible payer mix.

    Medication fulfillment is also split between standard prescriptions and Midi Custom Rx commerce. Standard prescriptions can be routed to the patient’s preferred pharmacy, including delivery-oriented options such as Capsule. Midi Custom Rx instead runs through a portal purchase flow, with pharmacy partners shipping directly after payment and with state-level exclusions depending on partner coverage. When shortages hit, the workflow becomes more manual: clinicians recommend early refills, 90-day supplies, alternative formulations, or pharmacy transfers. That keeps continuity of care moving, but it also exposes how dependent the experience remains on outside pharmacies, prior authorization execution, and local stock availability.
