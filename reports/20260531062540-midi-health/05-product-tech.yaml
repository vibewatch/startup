callouts:
- calloutType: strength
  title: Operational moat beats pure software moat
  body: Midi’s strongest product advantage is the combination of specialist training, payer alignment, referral
    rails, and AI-assisted clinician workflow. The reviewed evidence supports a service-operations moat more strongly
    than a platform-API moat.
  claimRefs:
  - CE001
  - CE032
  - CE034
  - CE037
- calloutType: risk
  title: Medication and reimbursement edges remain brittle
  body: Custom Rx state exclusions, public-program reimbursement exclusions, external-pharmacy shortages, and review-reported
    billing confusion are not side issues; they are product risks because they sit inside the user journey.
  claimRefs:
  - CE017
  - CE020
  - CE021
  - CE038
  - CE042
- calloutType: insight
  title: Public AI claims outpace public technical detail
  body: Midi and its partners describe meaningful AI-enabled gains in chart analysis, documentation, and throughput,
    but the public record still lacks model-governance, architecture, and validation detail needed to underwrite
    those claims as durable technical IP.
  claimRefs:
  - CE032
  - CE033
  - CE034
  - CE035
