- id: operating-architecture-and-trust-controls
  title: Operating architecture and trust controls
  body: |-
    The clearest architectural detail in public materials is the split between patient-commerce surfaces, clinical systems of record, and external execution partners. Midi’s help center says the Midi Portal handles scheduling and purchases, while the Athena Portal handles records, secure messaging, and lab-result review. Terms and conditions then describe the broader service stack as a coordinating platform sitting above separately organized medical groups, providers, labs, and pharmacies. That is a pragmatic architecture for a regulated virtual clinic: it lets the company centralize user experience and workflow logic without claiming that every regulated function sits on a single corporate entity.

    Security and compliance posture look more operational than productized. HHS guidance establishes that telehealth appointments, messages, and billing data must ride secure communications and storage, and Midi’s own vendor case study with JumpCloud describes SSO, MFA, MDM, role-based access, conditional access, patch management, and annual HIPAA training. On the clinician-efficiency side, Midi and Ambience describe a deep Athena-integrated AI documentation layer that reduces admin work, improves prior-authorization documentation, and speeds onboarding. The company’s technology edge therefore appears to come from workflow automation plus clinical-specialty training rather than from a public developer platform or externally inspectable API estate.
  claimRefs:
  - CE012
  - CE013
  - CE023
