  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Real PMPMs, contracted rates, enrollment minima, and utilization curves for Midi versus Maven, Progyny, and Gennev.
    whyItMatters: Public pages prove the existence of enterprise competition but not who wins economically or how costly switching is.
    diligencePath: Request anonymized employer contracts, pricing sheets, or broker comparison decks before underwriting buyer-side moat claims.
