    - Measure CAC and conversion separately for insured versus cash-pay leads
  - - Employer and health-system embedding
    - Bundled women's-health platforms can absorb menopause into broader contracts
    - high
    - Maven, Progyny, and Ovia all sell broader family-health or navigation relationships
    - Test win rates whenever a broader suite is already in an employer's stack
  - - Clinical specialization
    - Gennev replicates much of the insurer-billable specialist model
    - medium-high
    - Gennev also offers menopause-trained doctors, insurance workflows, and nationwide reach
    - Benchmark outcomes, referral depth, and employer renewal reasons versus Gennev
  - - Fast access and convenience
    - Evernow reduces friction with messaging and under-48-hour access inside Progyny
    - medium
    - Evernow pairs rapid access with flexible coverage and messaging
    - Publish wait-time and refill-service levels to defend against convenience-led switching
  - - National reach story
    - Winona and review-site rivals imply broad availability while official counts remain volatile
    - medium
    - Retained evidence shows both a historical 30-state figure and broader 2026 review language
    - Maintain a live state/licensure map and update buyer materials continuously
  - - Standalone category ownership
    - Benefits buyers may prefer one women's-health partner over a best-of-breed menopause clinic
    - high
    - Employer pages across Maven, Progyny, and Ovia stress ROI, retention, and integrated support
    - Prove that a focused menopause clinic can coexist with broader platforms and still move outcomes
