- id: durability-and-risk
  title: Moat durability, switching cost, and displacement risk
  body: Midi therefore has a real moat, but it is narrower than a generic "category leader" story would imply. Its moat is strongest where insurance coverage, specialist trust, and employer or health-system distribution all matter at once. That bundle is hard for low-cost direct rivals to replicate quickly and explains why Gennev is the most relevant like-for-like check. But the same moat weakens in two places. First, cash-pay shoppers can compare simple public price points and conclude that Alloy, Evernow, or Winona is cheaper or administratively easier. Second, employer and payer buyers can decide that a broader women's-health platform is strategically better than a best-of-breed menopause vendor. Evernow's Progyny tie-up shows how little exclusivity may exist inside those network layers. Public sources also leave the core enterprise economics private, so switching friction, PMPMs, and win rates remain underdetermined. The durable takeaway is that Midi wins when buyers value insurance-native
    specialist care, and loses ground when buyers value price simplicity or bundled channel control more than standalone clinical focus.
