- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Public pricing / contract model
  - What is included publicly
  - Insurance handling
  - Medication / pharmacy model
  - Implication
  rows:
  - - Midi
    - Insurance-eligible; independent review cites roughly $95-$250 self-pay per visit
    - Specialist visit plus tailored care plan
    - In-network with most PPO plans; no Medicare/Medicaid/Medi-Cal
    - Prescriptions may be covered through plan/pharmacy
    - Very attractive when covered; less simple for cash-pay shoppers
  - - Alloy
    - Independent review range roughly $45-$99 per month
    - Lower-cost menopause telehealth and follow-up subscription framing
    - Limited on retained public review sources
    - Mixture of FDA-approved and some compounded offerings
    - Sets a lower visible cash-pay anchor than Midi
  - - Evernow
    - $150 self-pay video or memberships starting at $35 per month
    - Video care, messaging, and personalized plan
    - Major commercial plans for video visits
    - Local pharmacy; meds may be covered separately
    - Flexible entry points reduce friction for undecided shoppers
  - - Gennev
    - Insurance, out-of-network, or direct billing; exact public cash rate not surfaced
    - 30-minute doctor visits plus possible dietitian support
    - Insurance-first with cash fallback
    - Prescriptions sent to local pharmacy
    - Closest insurer-oriented alternative to Midi
  - - Maven Hormone Care
    - $150 one-time fee plus separate medication costs
    - Two video consults, secure messaging, and prescription support; no subscription
    - Medication coverage depends on the patient's plan
    - Filled and billed by the patient's pharmacy
    - Adjacent consumer option, but not a bundled employer price benchmark
  - - Winona
    - Independent review range roughly $99-$165 per month
    - Bundled consultation, delivery, and ongoing access around bioidentical HRT
    - Not accepted on retained comparison sources
    - Direct-to-door delivery of prescribed therapy
    - Most predictable bundled cash-pay alternative
  - - Maven / Progyny / Ovia enterprise offers
    - Contract terms and PMPMs not public on retained sources
    - Benefits administration, navigation, network access, and reporting
    - Employer or health-plan sponsored
    - Varies by partner design
    - Buyer-layer substitution exists, but public apples-to-apples price benchmarking is not possible
