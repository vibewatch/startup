- id: direct-telehealth-peers
  title: 'Direct telehealth peers: price, access, and clinical posture'
  body: 'Among direct peers, Midi''s strongest differentiator is insurance-compatible specialist care. Its retained official pages emphasize nationwide availability, major-insurer coverage, PPO in-network posture, and employer or health-system entry points. Gennev is the closest like-for-like alternative because it also combines menopause-trained clinicians, 30-minute video visits, insurance workflows, nationwide availability, and lifestyle support through dietitians. Evernow attacks from a different angle: it mixes covered video visits with a $150 self-pay option, a $35-per-month membership entry point, messaging, and rapid access, including under-48-hour appointments for Progyny members. Alloy is more price-forward and guideline-forward in public positioning, with review sources pegging it below Midi on visible out-of-pocket cost and official pages emphasizing FDA-approved options. Winona is the clearest convenience-plus-bioidentical alternative, bundling compounded or bioidentical hormone
    positioning with shipped-to-door fulfillment and persistent community support. In short, direct competition is less about one feature checklist and more about which trade-off a patient values most: insurance economics, lowest visible price, messaging convenience, or bioidentical simplicity.'
