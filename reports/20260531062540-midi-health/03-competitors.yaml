  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / distribution signal
  - Target segment
  - Key differentiation
  - Main limitation
  rows:
  - - Midi
    - Direct specialist clinic + employer/payer channel
    - All 50 states; Fortune 100 employer presence; health-system pages
    - Insured women in perimenopause and menopause, plus employer-covered populations
    - Insurance-compatible specialist visits with tailored care plans and broader midlife scope
    - Self-pay can look expensive versus subscription rivals; not covered by Medicare/Medicaid/Medi-Cal
  - - Alloy
    - Direct DTC menopause telehealth
    - National consumer brand; review sites position it as lower-cost cash-pay
    - Cost-conscious menopause/perimenopause patients
    - Board-certified expert physicians plus FDA-approved treatment emphasis
    - Public retained sources show limited insurance compatibility and some compounding exposure
  - - Evernow
    - Direct digital-first clinic
    - Progyny network access; under-48-hour appointments for Progyny members
    - Patients wanting flexible video or messaging-based care
    - $150 self-pay video or $35/month membership with commercial-plan video coverage
    - Lighter-touch relationship than insurer-native specialist workflows
  - - Gennev
    - Direct insurer-billable clinic
    - All 50 states; employer offer; doctor+RDN model
    - Patients and employers wanting medical plus lifestyle support
    - 30-minute visits, same-day prescriptions, dietitians, and insurance workflows
    - Public enterprise economics remain undisclosed
  - - Winona
    - DTC bioidentical / compounded HRT clinic
    - Official press showed 30 states and territories; independent review suggests broader reach
    - Cash-pay users prioritizing bioidentical convenience
    - Bundled support around delivered hormone therapy and ongoing portal/community access
    - Insurance not accepted in retained reviews; exact current footprint still partly unresolved
  - - Maven
    - Adjacent women's-health platform + direct hormone-care edge offer
    - 2,000+ employers; 4M+ covered lives; 30+ specialties
    - Employers, health plans, and midlife consumers using broad benefits stacks
    - Broad platform plus $150 no-subscription Hormone Care entry point
    - Not menopause-only; buyer relationship often sits above the clinic level
  - - Progyny
    - Payer/employer women's-health network
    - 50+ health plans; 50-state menopause specialists; decade-long retention claim
    - Employers and health plans
    - Network, care advocates, and one-stop benefits administration
    - Mostly a buyer-layer substitute rather than a simple self-serve clinic
  - - Ovia
    - Digital navigation and coaching substitute
    - 22M+ journeys supported; 2,000+ clients; 30-90+ interactions per member per month
    - Employers and health plans wanting engagement and navigation
    - Symptom tracking, menopause coaches, and benefits integration
    - Weakest direct substitute for specialist prescribing depth
  notes: Rows mix official company pages with retained independent comparison sources; scale uses public distribution proxies when funding or contract data is not disclosed.
