  - type: stale
    severity: material
    topic: state-coverage
    missingEvidence: A current 2026 state-by-state licensure map for Winona and an exact current state count for every cash-pay direct peer.
    whyItMatters: State coverage changes substitution risk and TAM, but retained public sources disagree or stay approximate for some vendors.
    diligencePath: Request each vendor's live licensure matrix or scrape official state-availability pages at the same time window used for buyer diligence.
    relatedQuestionRefs:
