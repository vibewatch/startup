chapter:
  number: 3
  title: Competitors
  summary: Midi's closest direct substitutes are menopause-focused telehealth clinics such as Alloy, Evernow, Gennev, and Winona, but its hardest employer-side competition comes from broader women's-health platforms like Maven, Progyny, and Ovia that control payer and employer distribution. Midi's moat is strongest when insurance-compatible specialist care matters more than cash-pay simplicity, and weakest when buyers prioritize bundled channel control or lower visible out-of-pocket pricing.
sections:
- id: landscape-segmentation
  title: Landscape segmentation and substitute layers
  body: 'Midi''s competitive field is not one clean peer set. The direct substitutes are menopause-focused telehealth clinics that a patient can choose instead of Midi at the moment she decides to seek care: Alloy, Evernow, Gennev, and Winona. Those vendors compete on visible consumer decision variables such as insurance acceptance, list-price simplicity, specialist intensity, messaging cadence, and FDA-approved versus compounded treatment posture. A second layer competes for the budget owner rather than the patient visit itself. Maven, Progyny, and Ovia package menopause into broader women''s-health, family-benefits, or navigation relationships that can satisfy an employer or payer without buying a standalone menopause clinic. A third layer remains the status quo: ordinary OB-GYN, PCP, or health-plan navigation workflows that direct-telehealth vendors explicitly frame as too slow, dismissive, or insufficiently trained. The result is a segmented market where buyers choose among specialist
    care, low-friction cash pay, or bundled benefits rather than a single winner-take-all category.'
  claimRefs:
