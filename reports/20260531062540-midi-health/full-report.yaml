        - stage: Ongoing support
          actors:
            - Patient
            - Care team
          touchpoints:
            - 24/7 messaging
            - Follow-up appointments
            - Portal billing and prescriptions
          emotion: Repeat value depends on easy follow-up and clear billing
          label: Ongoing support
        - stage: Referral or expansion
          actors:
            - Patient
            - Local physician / health system
            - Benefits platform
          touchpoints:
            - Back-referral for imaging / procedures
            - Employer rollout
            - Partner-platform navigation
          emotion: Expansion happens when Midi fits into broader care and benefits workflows
          label: Referral or expansion
