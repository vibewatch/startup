  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing benchmark and the Series C bridge
        blocks:
          - type: paragraph
            body: >-
              Midi is no longer a speculative concept company; it has real disclosed scale, but the financing path
              matters because the price moved faster than public underwriting depth. The company's February 2026 Series
              D put a public flag in the ground at more than $1 billion of valuation, backed by a $100 million round and
              the strongest disclosed operating metrics yet: more than 45 million covered women, more than 25,000 weekly
              patients, and a 500-provider network serving more than 230,000 cumulative patients. That is enough to show
              category leadership in a real market, not just a niche telehealth subscription story.


              The harder question is what happened between the April 2024 Series B and the 2025 Series C. Public
              evidence says Series B was priced around $300 million to $310 million, Series C added $50 million in
              spring 2025, and Series D topped $1 billion by early 2026. Business Insider also said Midi was still
              unprofitable when it disclosed a roughly $150 million revenue run rate. In other words, the company did
              earn a major scale step-up, but investors were still repricing a private, unaudited, not-yet-profitable
              asset. That leaves the Series C context constructive but incomplete: the round looks directionally
              validated by the later unicorn mark, yet public evidence still cannot tell an outside investor whether the
              step-up came from cohort quality, channel efficiency, or simply strong momentum into a hotter
              women's-health capital market.
            claimRefs:
              - CV001
              - CV002
              - CV003
