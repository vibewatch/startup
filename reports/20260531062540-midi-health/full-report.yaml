  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cohort retention
        - Repeat-visit curves, product attach, refill behavior, NRR or LTV by channel
        - The premium entry only works if Midi is truly longitudinal, not episodic.
        - Investor diligence with data-room cohort tables and channel cuts.
      - - Payer economics
        - Realized reimbursement, denials, collections, payer mix by state
        - The company is priced as an insurer-backed platform, so gross-to-net quality matters.
        - Finance and revenue-cycle review with payer-remit samples.
      - - Cap table / preference stack
        - Share prices, preferences, convertibles, option pool, pro forma dilution
        - Downside common-equity value can be far worse than enterprise-value scenarios imply.
        - Legal review of stock purchase agreements and board materials.
      - - Profitability bridge
        - Audited 2025 revenue, gross margin, EBITDA, cash, burn, runway
        - Run-rate scale does not automatically translate into durable economics.
        - Audit package plus monthly management accounts.
      - - Channel mix and CAC
        - Direct, employer, and health-system acquisition mix with payback by cohort
        - Determines whether national scale is efficient or marketing-heavy.
        - Growth and finance workstream with cohort CAC analysis.
      - - Quality / compliance controls
        - Complaint-resolution metrics, clinician no-show rates, advertising-review process
        - Trust and claims discipline are part of the valuation downside case.
        - Operations and compliance diligence; review SOPs and QA dashboards.
    notes: >-
      These asks are the minimum package required to turn the chapter from a public-market framing exercise into a fully
      underwritten investment decision.
