              hiring also shows continued investment in AI, platform, full-stack, product, and commerce roles, which
              suggests the company is still internalizing more of the workflow stack instead of stopping at outsourced
              telehealth primitives.


              The limitations are equally visible. Public materials do not expose APIs, architecture diagrams, model
              governance details, or audited workflow metrics, so many of the most important technology claims remain
