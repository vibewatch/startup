      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers for Midi’s category are cost inflation, specialist scarcity, durable telehealth
              behavior, and policy support that is long enough to matter for commercial adoption. Large employers face
              2026 medical cost trends around 6.7% to 9.0% depending on survey and plan-design assumptions, while
              pharmacy pressure from GLP-1s and other specialty drugs is forcing buyers to scrutinize solutions that can
              redirect spend toward prevention, adherence, and better specialist access. Telehealth remains embedded
              enough to support this model: McKinsey still finds utilization far above pre-pandemic levels and a
              potential $250 billion virtual-care opportunity, while federal policy has extended major Medicare
              telehealth flexibilities through 2027. Those same facts also define the constraints. Flexibilities remain
              temporary; many non-behavioral Medicare rules revert in 2028 without new legislation; Midi itself is
              excluded from reimbursed Medicare and Medicaid today; and BCG describes a structural supply shortage, with
              weak menopause training in residency and certification reaching fewer than 1% of actively licensed US
              doctors. For valuation, that means Midi benefits from category timing and distribution proof, but
              investors should value it as a company racing to lock in payer access and clinician supply before policy
              support narrows or more scaled incumbents absorb the niche.
