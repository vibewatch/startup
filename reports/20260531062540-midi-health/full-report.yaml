chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Midi Health is a 100% virtual clinic focused on women navigating perimenopause, menopause, and adjacent
              midlife health issues. The company says it was founded in 2021 and launched commercially in California in
              2022 with insurance coverage before expanding nationally. As of the run date, Midi markets
              insurance-covered virtual visits and prescriptions in all 50 states, positions itself as a specialist
              alternative to generalist OB-GYN or primary-care experiences, and emphasizes commercial-plan reimbursement
              rather than a subscription model. Public pages now extend the product set beyond core menopause care into
              weight management, sexual wellness, cancer survivorship, and AgeWell longevity services. The model is
              therefore best understood as an insurance-native virtual specialty clinic with employer, payer,
              health-system, and clinician-referral distribution—not a cash-pay app. The main public access caveat is
              reimbursement: Medicare, Medicaid, and Medi-Cal coverage are explicitly excluded on Midi's pricing page.
