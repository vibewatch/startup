  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape segmentation and substitute layers
        blocks:
          - type: paragraph
            body: >-
              Midi's competitive field is not one clean peer set. The direct substitutes are menopause-focused
              telehealth clinics that a patient can choose instead of Midi at the moment she decides to seek care:
              Alloy, Evernow, Gennev, and Winona. Those vendors compete on visible consumer decision variables such as
              insurance acceptance, list-price simplicity, specialist intensity, messaging cadence, and FDA-approved
              versus compounded treatment posture. A second layer competes for the budget owner rather than the patient
              visit itself. Maven, Progyny, and Ovia package menopause into broader women's-health, family-benefits, or
              navigation relationships that can satisfy an employer or payer without buying a standalone menopause
              clinic. A third layer remains the status quo: ordinary OB-GYN, PCP, or health-plan navigation workflows
              that direct-telehealth vendors explicitly frame as too slow, dismissive, or insufficiently trained. The
              result is a segmented market where buyers choose among specialist care, low-friction cash pay, or bundled
              benefits rather than a single winner-take-all category.
            claimRefs:
