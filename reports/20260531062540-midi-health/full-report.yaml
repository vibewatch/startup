  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Commercial reimbursement durability
        - Denied claims, surprise bills, or rising patient responsibility
        - Persistent increase in denials or repeated patient-cost complaints across top commercial plans
        - Pause valuation expansion until payer-level remits and retention evidence are supplied.
      - - State licensure / regulatory hygiene
        - Visit cancellations tied to geography, registration lapse, or new state restrictions
        - Any repeated service withdrawal in core states or regulator notice affecting telehealth operations
        - Re-underwrite 50-state scale assumptions and require compliance remediation plan.
      - - Privacy / security
        - Reportable breach, OCR complaint, or FTC-style consumer-health-data issue
        - Any reportable breach involving consumer health data or evidence that tracker governance is out of policy
        - Treat as a thesis-break until root cause, scope, and control redesign are independently validated.
      - - Clinical governance
        - Testosterone safety signal, insurer restriction, or protocol reversal
        - Adverse-event cluster, state pullback, or documented drift from guideline-supported use
        - Reduce growth assumptions for higher-risk service lines and revisit care-scope strategy.
      - - Provider supply
        - Longer waits, thinner specialty coverage, or rising clinician churn
        - Inability to maintain timely access in major states or newly expanded specialties
        - Compress growth, increase service-cost assumptions, and test whether employer buyers notice deterioration.
      - - Channel control / competition
        - Employer or payer losses to bundled women's-health platforms
        - >-
