      - number: '1.2'
        title: Leadership, governance, and location signals
        blocks:
          - type: paragraph
            body: >-
              Midi's public leadership bench is unusually developed for a still-private women's-health startup and helps
              explain why later-stage investors appear to underwrite it as a broader platform rather than a
              single-condition telehealth brand. Joanna Strober, the co-founder and CEO, previously founded Kurbo and
              spent more than two decades investing in health and consumer companies; Sharon Meers brings Goldman Sachs
              and eBay operating experience; Kathleen Jordan and Mindy Goldman give the company senior clinical
              leadership with Dignity/Tia and UCSF credibility; and Jason Wheeler adds public-company finance depth from
              Tesla and Google. Official company pages also show a broader executive bench across marketing, technology,
              commercial, health systems, and clinical operations, with public Series B materials additionally placing
              Jill Herzig in the founding team. The main governance caveat is disclosure depth: retained public
              materials do not show the board roster or investor-director seats. Another disclosure wrinkle is location:
              financing announcements use a Palo Alto dateline, while the current terms page routes legal notices to a
              Los Angeles mailbox.
