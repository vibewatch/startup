      - number: '1.5'
        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Two caveats matter for diligence despite the growth story. First, the clearest adverse source in the
              retained corpus is customer review data, not litigation or regulator action. The archived Trustpilot page
              shows a solid overall rating, but it also contains complaints about billing, scheduling friction, and
              frustration when patients sought straightforward HRT continuation and were redirected elsewhere. Those
              signals do not prove systemic clinical failure, yet they do suggest that access frictions and protocol
              rigidity can erode the consumer experience. Second, public disclosure remains selective. Medicare and
              Medicaid exclusions narrow accessible demand today, and no retained source cleanly discloses board
              composition, exact headquarters, revenue run-rate, or employee headcount. For a company now framing itself
              as a national health platform, those omissions limit the amount of governance, operating leverage, and
              jurisdictional certainty an outside investor can derive from public materials alone.
