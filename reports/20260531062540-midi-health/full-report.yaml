  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Patient persona and payer mix
        blocks:
          - type: paragraph
            body: >-
              Midi's clearest customer is a commercially insured woman in midlife who wants menopause or perimenopause
              expertise without waiting months for an in-person OB-GYN visit. Official employer and consumer pages frame
              the service around women roughly 35-65 or 40+ dealing with hormonal transition, while the care model
              itself is explicitly insurance-native rather than a flat-fee wellness subscription. The company says it is
              available in all 50 states, in-network with most PPO plans, and able to bill visits and prescriptions
              through major commercial insurance, which materially broadens the reachable population relative to
              cash-pay menopause apps.


              The payer mix is still skewed. Midi explicitly excludes Medicaid and Medi-Cal patients and does not
              participate in Medicare; Medicare beneficiaries can only use the service as self-pay and cannot submit
              claims for visits or medications. That makes the practical payer mix overwhelmingly commercial insurance,
              with self-pay as a fallback rather than the lead model. Employer coverage is a major acquisition surface
              because workers can check whether their employer offers Midi, and the employer-facing pitch is that
              services can be billed directly to claims with no incremental employer fee. In effect, the public customer
              picture is B2B2C: the user is the patient, the economic gatekeeper is usually the commercial insurer and
              employer, and self-pay exists mainly where coverage fails.
