  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, reimbursement, and clinical-governance risks
        blocks:
          - type: paragraph
            body: >-
              Midi operates through a structure that is normal for venture-backed telehealth but still inherently
              fragile at scale. The terms place regulated care with affiliated medical groups and pharmacies rather than
              with Midi itself, and the same documents make clear that the company is outside Medicare, Medicaid, and
              Medi-Cal reimbursement for the services it sells through the platform. That narrows the effective payer
              pool toward commercial PPO plans and self-pay edge cases, which is workable when employer-sponsored demand
              is strong but gives the model less cushion if commercial coverage tightens or out-of-pocket friction
              rises. The same state-by-state structure also creates compliance drag. Midi requires patients to be in the
              same state as their shipping address during a visit, while HHS guidance shows that cross-state telehealth
              still depends on full licenses, temporary practice exceptions, reciprocity, or registration pathways that
              vary by jurisdiction. Clinical-governance risk is the other sharp edge. Midi's testosterone program openly
              acknowledges there is no FDA-approved testosterone product specifically indicated for women in the U.S.
              and offers compounded testosterone in only a subset of states. ACOG, meanwhile, says compounded menopausal
              hormone therapy should not be prescribed routinely when FDA-approved alternatives exist and notes limited
              long-term safety data for testosterone use. The risk is therefore not that Midi lacks a market, but that a
              reimbursement-first clinic can still be slowed by licensure, coverage, and guideline-sensitive prescribing
              boundaries.
