  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Chain from market need and scale proof through valuation premium and evidence gaps to the final recommendation.
    data:
      nodes:
        - id: n1
          label: Large untreated need
        - id: n2
          label: Insurance-backed distribution
        - id: n3
          label: Disclosed scale proof
        - id: n4
          label: Premium current price
        - id: n5
          label: Missing retention and payer data
        - id: n6
          label: Research-more / stretched valuation
      edges:
        - from: n1
          to: n2
          label: supports demand
        - from: n2
          to: n3
          label: enables growth
        - from: n3
          to: n4
          label: justifies some premium
        - from: n4
          to: n5
          label: but requires proof
        - from: n5
          to: n6
