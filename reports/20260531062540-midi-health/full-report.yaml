  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Implied valuation at selected revenue multiples applied to Midi's disclosed $150M run rate.
    data:
      items:
        - label: Public comp midpoint (1.8×)
          value: 270
          unit: USD M
          note: Approximate midpoint of Progyny and Privia style public multiples on $150M.
        - label: High-growth public comp (2.5×)
          value: 375
          unit: USD M
          note: Hims-like multiple on $150M.
        - label: Premium care-platform case (4.0×)
          value: 600
          unit: USD M
          note: Illustrative premium still below the current round.
        - label: Current implied mark (6.7×)
          value: 1000
          unit: USD M
          note: Latest disclosed private valuation on reported run rate.
    approximationNotes: >-
      Uses the $150M run rate reported around the Series C period and approximate market-cap-to-revenue multiples from
      selected public analogs; values are directional, not enterprise-value precision.
    claimRefs:
      - CV006
      - CV026
      - CV028
      - CV030
      - CV032
      - CV034
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bull, base, and bear value ranges for Midi relative to the current >$1B benchmark.
    data:
      items:
        - label: Bear case
          low: 350
          mid: 450
          high: 550
          unit: USD M
          note: Weak retention or reimbursement quality with comp-multiple compression.
        - label: Current mark
          low: 1000
          mid: 1000
          high: 1000
          unit: USD M
          note: Latest disclosed private-round valuation.
        - label: Base case
          low: 950
          mid: 1100
          high: 1250
          unit: USD M
          note: Moderate growth and some retention improvement; barely clears entry.
        - label: Bull case
          low: 2000
          mid: 2300
          high: 2600
          unit: USD M
          note: Strong cohort quality plus sustained premium pricing.
    approximationNotes: >-
      Three-year scenario ranges derived from public run-rate and selected multiple assumptions; preference waterfall
      not modelled, so bear-case equity outcomes could be worse than shown.
    claimRefs:
      - CV042
      - CV045
      - CV048
      - CV049
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard balancing market need, proof, economics visibility, and price support.
    data:
      items:
        - label: Market need
          value: 8/10
          detail: Large, underdiagnosed, and employer-relevant category with strong symptom burden evidence.
          tone: positive
        - label: Distribution proof
          value: 7/10
          detail: >-
            National PPO positioning, employer claims billing, and health-system partnerships support real channel
            breadth.
          tone: positive
        - label: Reimbursement durability
          value: 5/10
          detail: Commercial-insurance model is attractive, but Medicare and Medicaid are still excluded.
          tone: neutral
        - label: Retention visibility
          value: 4/10
          detail: Longitudinal need exists, but no public cohort or repeat-visit data is disclosed.
          tone: warning
        - label: Unit-economics visibility
          value: 3/10
          detail: No public gross margin, CAC, payer-yield, or cash-runway bridge.
          tone: warning
        - label: Comparable price support
          value: 3/10
          detail: Current mark sits well above reviewed public multiples.
          tone: warning
        - label: Claims discipline / trust
          value: 4/10
          detail: NAD challenge and complaint themes add nontrivial execution risk.
          tone: warning
        - label: Evidence quality
          value: 5/10
          detail: Better public disclosure than many private startups, but still not enough to clear pricing risk alone.
          tone: neutral
    approximationNotes: Scores are judgmental synthesis of retained evidence, not a statistical model.
    claimRefs:
      - CV015
      - CV018
      - CV021
      - CV041
      - CV042
      - CV045
      - CV049
