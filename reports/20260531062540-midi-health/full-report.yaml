      - number: '1.4'
        title: Scale, distribution, and product expansion
        blocks:
          - type: paragraph
            body: >-
              Midi's public operating footprint now looks national by several measures. Official and investor sources
              say coverage reaches more than 45 million women, the platform sees more than 25,000 patients each week,
              and official clinician plus testimonial pages say more than 230,000 patients have used the service. Fierce
              adds a 500-provider network across all 50 states. Distribution is also broader than a pure
              direct-to-consumer funnel. Employer materials say Midi can ride existing in-network claims relationships
              nationwide, the company cites Fortune 100 employers and benefits-platform relationships with Progyny and
              Cleo, Memorial Hermann publicly describes a collaborative care pathway in Texas, and clinician-referral
              pages position Midi as an extension to existing practices rather than a replacement for every in-person
              touchpoint. Product scope has expanded alongside that footprint: TIME highlighted the May 2025 AgeWell
              launch, and public pages now market longevity, weight, and preventive-risk support in addition to
              menopause care. Parade's reported self-pay prices suggest out-of-pocket pricing is a fallback rather than
              the core economic model.
