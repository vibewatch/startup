            body: >-
              Midi has enough public usage and satisfaction proxies to suggest real repeat behavior, but not enough to
              prove durable retention in the SaaS sense. The company's 2023 50-state employer announcement cites a 95%
              patient satisfaction score, and employer materials reference cohorts of roughly 70,000 patients with 3+
              visits, 3,600 patients with repeat lab values, and 4,816 patients whose first visit was for weight
              management. Those are meaningful repeat-engagement signals because they imply the service is not just a
              one-off consult for hot flashes; patients are returning for follow-up, monitoring, screening, and adjacent
              midlife needs.


              Consumer trust, however, is mixed rather than uniformly excellent. Official testimonials emphasize
              same-day appointments, insurance acceptance, and quick symptom relief, while the archived Trustpilot page
              shows a 4.3/5 overall rating plus strong positive reviews describing next-day appointments, responsive
              clinicians, and immediate HRT starts. The same archive also includes complaints about billing follow-up,
              appointment changes, cost confusion, and edge-case clinical situations where women felt the protocol was
              too rigid or insufficiently personalized. Official billing FAQs reinforce why this friction appears:
              out-of-pocket responsibility depends on plan design, statements may arrive after adjudication, and
              self-pay workflows changed in May 2026. Trust therefore looks good enough to support growth, but not
              strong enough to treat review risk as solved.
