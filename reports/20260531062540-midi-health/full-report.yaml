  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'Thesis: large underpenetrated need'
        - >-
          PwC, Mayo, and Monash all support a large, undertreated midlife-care problem with room for longitudinal
          management.
        - Proof that the company cannot convert symptom burden into repeat monetization would weaken this pillar.
      - - 'Thesis: insurer-backed distribution is differentiated'
        - >-
          Midi says it can bill through recognized health plans and meet patients through employers and health systems,
          not only direct self-pay acquisition.
        - Evidence that realized payer yield or denial rates are weak would reduce the CAC and affordability advantage.
      - - 'Thesis: product breadth can lift lifetime value'
        - Weight management, longevity, and Custom Rx expand ARPU options beyond a single menopause visit.
        - If attach rates or refill behavior are low, the premium platform narrative breaks down.
      - - 'Anti-thesis: current price already assumes premium quality growth'
        - The latest mark implies ~6.7x run-rate revenue versus a reviewed public band closer to 0.3x-2.5x.
        - A materially lower entry price or strong private proof on cohorts and margins would soften this objection.
      - - 'Anti-thesis: reimbursed TAM is narrower than the headline need'
        - Midi excludes Medicaid and Medi-Cal and only serves Medicare on self-pay terms today.
        - A credible, compliant expansion path into additional payer populations would widen the monetizable TAM.
      - - 'Anti-thesis: execution and governance signals are not spotless'
        - Trustpilot complaints and the NAD challenge show that service friction and claims discipline can impair trust.
        - >-
          Demonstrated complaint resolution, measured quality outcomes, and stronger compliance reporting would reduce
          this concern.
    notes: >-
      Thesis rows summarize investability drivers; anti-thesis rows summarize what still blocks underwriting at the
