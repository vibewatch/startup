  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention underwhelms
        - Repeat utilization or cohort retention materially below diligence case
        - Breaks the longitudinal-care thesis and removes support for a premium multiple.
        - Reprice or walk away.
      - - Realized payer yield disappoints
        - Weak reimbursement, high denials, or slow collections by payer/state
        - Compresses gross margin and makes insurer-led distribution less attractive than advertised.
        - Hold investment until claims data clears.
      - - Buyer-side uptake stalls
        - Employer and payer expansion remains niche beyond the current footprint
        - Shrinks practical TAM and weakens the scaling story behind the current mark.
        - Downgrade growth assumptions and revisit comp multiple.
      - - Trust or claims-discipline issues worsen
        - Recurring complaint patterns or new regulatory/compliance actions emerge
        - Raises CAC, churn, and governance risk at the same time.
        - Pause diligence or require enhanced compliance reporting.
      - - Structured or lower-priced next round appears
        - Future financing resets valuation or adds heavy senior economics
        - Confirms public evidence did not support the prior premium price.
        - Do not chase the current mark; wait for price discovery.
    notes: >-
      Kill triggers are monitorable diligence and post-investment signals tied to the current price, not just to company
      quality in the abstract.
