      - number: '1.3'
        title: Funding history and capitalization
        blocks:
          - type: paragraph
            body: >-
              Capital formation has been fast and front-loaded. Forbes reported a $14 million seed round and
              California-only launch in October 2022; GV says it first invested at the 2023 Series A, which Sacra sizes
              at $25 million. Midi's April 2024 growth round is directionally clear but numerically messy in public
              reporting: the company's official announcement says it raised an additional $60 million and reached $100
              million total funding, while Fierce counted a $63 million Series B after including a celebrity-backed SPV.
              Either way, 2024 marked the jump from niche startup to national category builder, with Emerson Collective
              leading and GV staying engaged. Sacra then reports a $50 million Series C in October 2025 led by Advance
              Venture Partners, followed by the February 2026 $100 million Series D led by Goodwater at a valuation
              above $1 billion. Using disclosed rounds implies roughly $249 million raised, consistent with Fierce's
              “more than $250 million” shorthand, but public sources do not disclose debt, secondaries, or the Series C
              valuation.
