      - number: '7.2'
        title: Data, operational, and provider-supply risks
        blocks:
          - type: paragraph
            body: >-
              The next risk cluster is operational rather than purely legal. Midi's privacy policy says PHI is handled
              under HIPAA and the medical groups' notice of privacy practices, but the same policy and terms carve out
              broader personal data and service interactions that can be governed under Midi's consumer privacy
              framework. The company also discloses Meta and Google pixels plus Mixpanel, while FTC guidance reminds
              health-app operators that privacy-by-design, truthful disclosure, and breach response still apply outside
              classic covered-entity logic. That matters because a scaled consumer-facing clinic is simultaneously a
              care delivery business, a claims-and-support workflow, and a data-rich marketing surface. Public reviews
              reinforce that operational execution is not uniformly smooth: some users describe fast, validating care,
              while others report missed prescriptions, billing confusion, and appointment chaos. Provider supply is the
              other structural choke point. Midi says it uses board-certified clinicians with ongoing training across
              all 50 states, but The Menopause Society still describes clinician education gaps in menopause care, and
              AAMC projects a broader physician shortage through 2036. Expanding beyond core menopause visits into
              weight management and other specialties may improve lifetime value, yet it also raises the burden on
              hiring, supervision, coverage scheduling, and clinical QA. In short, the operational risk is not one
              catastrophic failure mode; it is the cumulative chance that privacy, support, staffing, or
              care-coordination seams break before the company's scale narrative becomes fully auditable.
