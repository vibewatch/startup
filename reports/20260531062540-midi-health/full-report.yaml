      - CU003
      - CU007
      - CU012
      - CU013
      - CU014
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Customer acquisition is multi-entry: direct consumer discovery, clinician referral, employer benefits, and partner
      platforms all feed into the same virtual-care and follow-up engine.
    data:
      nodes:
        - id: discover
          label: Discovery
          detail: Women arrive via symptoms, employer benefits, clinician recommendation, or partner-platform navigation.
        - id: coverage
          label: Coverage check
          detail: Patient confirms employer eligibility, insurance participation, or self-pay fallback.
        - id: visit
          label: First virtual visit
          detail: >-
            Midi clinician creates a personalized plan covering hormones, non-hormonal options, lifestyle, and
            preventive needs.
        - id: support
          label: Ongoing support
          detail: Portal scheduling, 24/7 messaging, prescriptions, and follow-ups keep care active.
        - id: partner-loop
          label: Partner / system loop
          detail: Health systems, Hinge, Cleo, Collective, or employers continue to route or monitor members.
        - id: expand
          label: Expansion
          detail: Care broadens into weight, longevity, screening, or adjacent midlife conditions when trust holds.
      edges:
        - from: discover
          to: coverage
          label: Interest converts only if access and coverage look credible
        - from: coverage
          to: visit
          label: Insurance-covered or self-pay path supports booking
        - from: visit
          to: support
          label: Care plan, messaging, and follow-ups create repeat usage
        - from: support
          to: partner-loop
          label: Partners and local systems see activity and can route more patients
        - from: partner-loop
          to: expand
          label: Broader use cases and adjacent conditions increase value over time
        - from: support
          to: expand
          label: Satisfied patients continue into screening, weight, or longevity care
    claimRefs:
      - CU007
      - CU012
      - CU014
      - CU019
      - CU020
      - CU021
      - CU022
      - CU039
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Midi's public customer proof is strongest where a partner or platform describes a live access route; durability
      visibility is much weaker across almost every named account.
    data:
      columns:
        - Production evidence
        - Access route
        - Outcome specificity
        - Durability visibility
      rows:
        - label: Memorial Hermann
          values:
            - Live collaboration on partner site
            - Direct signup plus physician referral
            - 'Medium: insurance-covered access and return path for screenings/procedures'
            - 'Low: no throughput or renewal KPI'
        - label: Mount Sinai
          values:
            - Exclusive collaboration announced on Mount Sinai site
            - Direct, physician-referral, and employer-sponsored access
            - 'Medium: named integrated-care rationale'
            - 'Low: no visit volume or contract term'
        - label: Keck Medicine of USC
          values:
            - Joint announcement via PR Newswire
            - Direct URL plus physician referral
            - 'Low-medium: access route clear, outcomes not quantified'
            - 'Low: no utilization or renewal data'
        - label: Lifepoint Health
          values:
            - Official network collaboration
            - Hospital referral and telemedicine expansion
            - 'Medium: target is thousands of women across the country'
            - 'Low: rollout by facility not public'
        - label: Collective Health
          values:
            - Integrated partner profile
            - Portal tile plus utilization data ingestion
            - 'Medium: confirms enterprise administration and outcome measurement intent'
            - 'Low: client count not public'
        - label: Cleo
          values:
            - Official joint press release
            - Family-care platform routes members to Midi
            - 'Medium: 3.5M platform reach disclosed'
            - 'Low: actual Midi conversion unknown'
        - label: Hinge Health
          values:
            - Official press release + trade coverage
            - In-network Hinge members get directed to Midi care
            - 'Medium: adjacent-condition care use case is explicit'
            - 'Low: no conversion or retention data'
        - label: Beacon Wellness Brands
          values:
            - Named employer benefit launch
            - Employer-funded stipend for menopause care
            - 'Medium: specific benefit design disclosed'
            - 'Low: single-employer example only'
