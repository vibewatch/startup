            body: >-
              Midi has disclosed enough financing history to show real scale and a reduced near-term financing risk
              profile. Official and independent sources support a $100 million Series D in February 2026 at a valuation
              above $1 billion, following a $50 million Series C in 2025, a $60 million Series B in 2024, and a $25
              million Series A in 2023. Fierce Healthcare said the Series D pushed lifetime capital above $250 million,
              while Business Insider reported a 2025 revenue run rate of about $150 million, up from roughly $60 million
              at the end of 2024. Official and independent sources also support more than 25,000 weekly patients, more
              than 230,000 women or patients served, and national coverage across all 50 states. That is enough to say
