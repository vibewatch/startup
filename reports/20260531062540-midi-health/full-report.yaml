      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Midi’s adoption path is structurally B2B2C even though the service is delivered one patient at a time. The
              end user is a woman navigating perimenopause or menopause symptoms; the institutional buyer can be a
              self-insured employer, a health system, or a health plan that already has Midi in-network; and the payer
              is usually the commercial insurer funding office-visit and prescription claims. The company’s own
              materials emphasize this distinction repeatedly: it is a provider rather than a point-solution vendor, it
              already appears in some employer benefit menus, and it can be embedded into health-system and plan
              workflows through standard claims payment rather than a separate PMPM line item. That structure matters
              because the addressable demand is strongest where employers face older-workforce claims inflation,
              retention risk, and member frustration with fragmented care. KFF shows higher family premiums in firms
              with older workforces, while Midi’s employer page frames untreated menopause as a workforce and
              productivity problem. The service also fits buyers that want women’s-health differentiation without adding
              another standalone contract. At the same time, coverage exclusions matter: most PPO plans are eligible,
              but Medicare, Medicaid, and Medi-Cal are outside the reimbursed core, which narrows near-term payer reach
              and keeps the best fit in commercially insured employers and adjacent health systems.
