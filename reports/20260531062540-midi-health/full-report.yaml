      - number: '6.4'
        title: Durability and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Midi's public customer evidence supports a broad channel strategy, but not a complete durability file. The
              company can point to direct consumer access, employer benefits, clinician referrals, health-system
              partnerships, and benefits-platform integrations, which should reduce dependence on any single acquisition
              motion. Yet the named-customer roster is still narrow relative to the scale language on Midi's site, and
              public proof is much stronger for health systems and partner platforms than for a long list of disclosed
              employers.


              The bigger diligence issue is missing denominator data. Public materials do not disclose employer count,
              average contract size, top-customer exposure, renewal rates, GRR, NRR, churn, or the split between direct
              consumer, employer-sponsored, health-system-referred, and benefits-platform volume. Nor do they show
              concentration by insurer, even though commercial PPO participation is central to the model and
              public-program exclusions remain explicit. As a result, Midi's public customer chapter reads as a strong
              adoption story with incomplete commercial transparency: there is clear evidence of real patients and real
              distribution, but not enough disclosure to quantify how sticky, concentrated, or channel-dependent the
              revenue base actually is.
