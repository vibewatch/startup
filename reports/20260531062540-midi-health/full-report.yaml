        title: Product scope and clinical workflow
        blocks:
          - type: paragraph
            body: >-
              Midi’s product should be read as a workflowed virtual clinic, not a single-feature menopause app. The
              public surface starts with coverage checking and booking, then moves into a clinician-authored Care Plan
              that can include hormonal prescriptions, non-hormonal medications, supplements, and lifestyle changes.
              Public module pages show that the company has extended the same base operating model into AgeWell
              longevity visits, weight management, mood and memory support, sleep support, sexual wellness, and a
              narrower testosterone program. That breadth matters because it lets Midi widen share-of-wallet without
              pretending to be a full-stack primary-care replacement.


              The workflow is intentionally hybrid. Midi’s own pages say the company can share care plans and test
              results with other doctors, while its clinician and health-system pages describe referral intake, secure
              information sharing, and return-to-system handoffs for mammograms, biopsies, ultrasounds, surgeries, and
              other in-person work. In other words, the product promise is specialist telehealth layered on top of
              existing provider relationships. That design is operationally attractive because it keeps Midi in the
              high-friction diagnostic, prescribing, and coordination layer while leaving imaging, procedures, and
              emergency care to incumbent systems.
