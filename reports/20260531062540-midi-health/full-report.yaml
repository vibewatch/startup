  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and disease burden
        blocks:
          - type: paragraph
            body: >-
              Midi Health operates in a narrowly defined but newly formalizing category: insurance-covered virtual
              specialty care for women in midlife, especially perimenopause and menopause, rather than broad
              primary-care telehealth or consumer wellness apps. The demand substrate is large and clinically
              persistent. Federal and nonprofit sources place the typical menopause transition between ages 45 and 55,
              with menopause itself occurring around age 51 to 52, and with perimenopause often lasting four to eight
              years and sometimes as long as fourteen. Public sources disagree on annual entrants—SWHR cites about 1.3
              million US women a year, while BCG uses roughly 2 million—so the prudent read is that the annual incident
              population is large, but exact counts depend on whether the source means final menopause or the broader
              transition cohort. The pain point is not only prevalence but under-treatment: 34% of symptomatic women are
              not diagnosed, 20% wait more than a year for formal assessment, and BCG says only 60% of significantly
              symptomatic women seek care and only 25% of those are treated. That makes the relevant market less a
              generic telehealth bucket than a specialty-access gap sitting between OB-GYN, primary care, pharmacy, and
              employer benefits.
