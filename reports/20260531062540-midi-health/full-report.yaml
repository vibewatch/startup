      - number: '3.3'
        title: Benefits-platform substitutes and channel control
        blocks:
          - type: paragraph
            body: >-
              The deeper employer-side threat may come from channel owners rather than from another menopause-only
              clinic. Maven, Progyny, and Ovia all market menopause as one module inside a broader women's-health or
              family-benefits relationship. That matters because the buyer for an employer-sponsored benefit often wants
              one contract, one reporting layer, and one care-navigation story across fertility, maternity, parenting,
              and midlife. Maven pairs a midlife program with 2,000-plus employers, 4 million covered lives on the
              health-plan side, and a consumer hormone-care edge offer. Progyny pairs menopause-trained providers with
              care advocates, 50-plus health-plan integrations, and a 50-state specialist network. Ovia is weaker as a
              prescribing substitute, but strong as a navigation and engagement layer that can sit inside an existing
              benefit stack and keep members in a plan-designed journey. For a payer or employer, those broader
              platforms can look like enough menopause coverage even when they do not match Midi's focused clinic depth
              on a visit-by-visit basis.
