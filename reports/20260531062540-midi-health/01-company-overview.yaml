callouts:
  - calloutType: "strength"
    title: "Insurance-native national distribution is the core moat signal"
    body: >-
      Midi's strongest public differentiator versus many menopause telehealth peers is not just category focus; it is the combination of commercial insurance reimbursement, all-50-state coverage, employer claims integration, health-system partnerships, and clinician-referral channels. That bundle makes the company look more like a lightweight specialty health platform than a narrow direct-to-consumer app.
    claimRefs: [CO004, CO023, CO024, CO031, CO032, CO033, CO034, CO042]

  - calloutType: "risk"
    title: "Public disclosure is still thin relative to a unicorn narrative"
    body: >-
      Even after the Series D, retained public sources still leave board composition, exact headquarters, revenue, and headcount unresolved. Trustpilot complaints and public-program reimbursement exclusions add practical execution risk on top of those disclosure gaps, so later diligence should focus on governance rights, economic quality, and patient-experience consistency rather than growth headlines alone.
    claimRefs: [CO006, CO015, CO018, CO036, CO037, CO038, CO039]

