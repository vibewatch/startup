artifact: "company-overview"
slug: "midi-health"
runDate: "2026-05-31"
company:
  name: "Midi Health"

chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Midi Health is an insurance-native virtual women's-health clinic founded in 2021 and launched commercially in California in 2022 with a $14 million seed round. It has since expanded into a national platform spanning all 50 states, more than 230,000 patients, over 25,000 weekly patients, and insurance reach to more than 45 million women, while adding employer, health-system, clinician-referral, and longevity-care channels. Capital formation accelerated from GV's 2023 Series A to a 2024 Series B, a 2025 Series C, and a February 2026 $100 million Series D at a valuation above $1 billion, but public disclosure still leaves exact headquarters, board composition, revenue, and headcount unresolved and customer reviews surface billing, scheduling, and HRT-path complaints.

sections:
  - id: "identity-business-model"
    title: "Identity and business model"
    body: >-
      Midi Health is a 100% virtual clinic focused on women navigating perimenopause, menopause, and adjacent midlife health issues. The company says it was founded in 2021 and launched commercially in California in 2022 with insurance coverage before expanding nationally. As of the run date, Midi markets insurance-covered virtual visits and prescriptions in all 50 states, positions itself as a specialist alternative to generalist OB-GYN or primary-care experiences, and emphasizes commercial-plan reimbursement rather than a subscription model. Public pages now extend the product set beyond core menopause care into weight management, sexual wellness, cancer survivorship, and AgeWell longevity services. The model is therefore best understood as an insurance-native virtual specialty clinic with employer, payer, health-system, and clinician-referral distribution—not a cash-pay app. The main public access caveat is reimbursement: Medicare, Medicaid, and Medi-Cal coverage are explicitly excluded on Midi's pricing page.
    claimRefs: [CO001, CO002, CO004, CO005, CO007, CO008]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: "leadership-governance"
    title: "Leadership, governance, and location signals"
    body: >-
      Midi's public leadership bench is unusually developed for a still-private women's-health startup and helps explain why later-stage investors appear to underwrite it as a broader platform rather than a single-condition telehealth brand. Joanna Strober, the co-founder and CEO, previously founded Kurbo and spent more than two decades investing in health and consumer companies; Sharon Meers brings Goldman Sachs and eBay operating experience; Kathleen Jordan and Mindy Goldman give the company senior clinical leadership with Dignity/Tia and UCSF credibility; and Jason Wheeler adds public-company finance depth from Tesla and Google. Official company pages also show a broader executive bench across marketing, technology, commercial, health systems, and clinical operations, with public Series B materials additionally placing Jill Herzig in the founding team. The main governance caveat is disclosure depth: retained public materials do not show the board roster or investor-director seats. Another disclosure wrinkle is location: financing announcements use a Palo Alto dateline, while the current terms page routes legal notices to a Los Angeles mailbox.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO043]
    tableRefs: [TO002]

  - id: "funding-capitalization"
    title: "Funding history and capitalization"
    body: >-
      Capital formation has been fast and front-loaded. Forbes reported a $14 million seed round and California-only launch in October 2022; GV says it first invested at the 2023 Series A, which Sacra sizes at $25 million. Midi's April 2024 growth round is directionally clear but numerically messy in public reporting: the company's official announcement says it raised an additional $60 million and reached $100 million total funding, while Fierce counted a $63 million Series B after including a celebrity-backed SPV. Either way, 2024 marked the jump from niche startup to national category builder, with Emerson Collective leading and GV staying engaged. Sacra then reports a $50 million Series C in October 2025 led by Advance Venture Partners, followed by the February 2026 $100 million Series D led by Goodwater at a valuation above $1 billion. Using disclosed rounds implies roughly $249 million raised, consistent with Fierce's “more than $250 million” shorthand, but public sources do not disclose debt, secondaries, or the Series C valuation.
    claimRefs: [CO003, CO019, CO020, CO021, CO022, CO026, CO027, CO028, CO041]
    tableRefs: [TO003]
    figureRefs: [FO001]

  - id: "scale-distribution"
    title: "Scale, distribution, and product expansion"
    body: >-
      Midi's public operating footprint now looks national by several measures. Official and investor sources say coverage reaches more than 45 million women, the platform sees more than 25,000 patients each week, and official clinician plus testimonial pages say more than 230,000 patients have used the service. Fierce adds a 500-provider network across all 50 states. Distribution is also broader than a pure direct-to-consumer funnel. Employer materials say Midi can ride existing in-network claims relationships nationwide, the company cites Fortune 100 employers and benefits-platform relationships with Progyny and Cleo, Memorial Hermann publicly describes a collaborative care pathway in Texas, and clinician-referral pages position Midi as an extension to existing practices rather than a replacement for every in-person touchpoint. Product scope has expanded alongside that footprint: TIME highlighted the May 2025 AgeWell launch, and public pages now market longevity, weight, and preventive-risk support in addition to menopause care. Parade's reported self-pay prices suggest out-of-pocket pricing is a fallback rather than the core economic model.
    claimRefs: [CO004, CO008, CO023, CO024, CO025, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO042]
    figureRefs: [FO003]

  - id: "milestones-adverse-signals"
    title: "Milestones and adverse signals"
    body: >-
      Two caveats matter for diligence despite the growth story. First, the clearest adverse source in the retained corpus is customer review data, not litigation or regulator action. The archived Trustpilot page shows a solid overall rating, but it also contains complaints about billing, scheduling friction, and frustration when patients sought straightforward HRT continuation and were redirected elsewhere. Those signals do not prove systemic clinical failure, yet they do suggest that access frictions and protocol rigidity can erode the consumer experience. Second, public disclosure remains selective. Medicare and Medicaid exclusions narrow accessible demand today, and no retained source cleanly discloses board composition, exact headquarters, revenue run-rate, or employee headcount. For a company now framing itself as a national health platform, those omissions limit the amount of governance, operating leverage, and jurisdictional certainty an outside investor can derive from public materials alone.
    claimRefs: [CO006, CO015, CO018, CO036, CO037, CO038, CO039]
    tableRefs: [TO004]

