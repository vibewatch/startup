tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Direct commercially insured patient
    - 'Buyer: patient; User: patient; Payer: commercial PPO / employer plan'
    - Perimenopause, menopause, weight, sleep, mood, survivorship, longevity support
    - All 50 states; major-insurer coverage pages
    - Core visit-and-prescription revenue base
    - No public mix by insurer or state
  - - Employer-sponsored employee/member
    - 'Buyer: employer / benefits team; User: employee; Payer: insurer via claims'
    - Covered menopause benefit through existing health plan
    - Fortune 100 claim; employer lookup page; all 50 states for employers
    - Efficient B2B2C distribution with no extra employer fee
    - No public employer count or renewal data
  - - Health-system referred patient
    - 'Buyer: patient / health system; User: patient; Payer: insurer'
    - Specialty virtual care plus return path for imaging, surgery, biopsies, and screenings
    - Memorial Hermann, Mount Sinai, Keck, Lifepoint
    - Improves trust and clinician referral density
    - Economics of each collaboration undisclosed
  - - Independent clinician referral
    - 'Buyer: referring clinician; User: patient; Payer: insurer / self-pay'
    - Fast referral handoff for patients needing menopause expertise
    - Online referral form; 15-minute outreach promise
    - Creates inbound flow beyond consumer marketing
    - Referral conversion and acceptance rates undisclosed
  - - Benefits-platform / navigation member
    - 'Buyer: employer / platform; User: member; Payer: insurer or employer benefit budget'
    - Access through Collective Health, Cleo, Hinge, Progyny-linked availability
    - At least one Collective client; Cleo reach 3.5M; Hinge integration live
    - Expands distribution without building every employer relationship directly
    - Platform-driven utilization and margin share not disclosed
  - - Self-pay / coverage-excluded patient
    - 'Buyer: patient; User: patient; Payer: self-pay'
    - Fallback for uncovered visits or Medicare beneficiaries
    - $250 first visit / $150 follow-up
    - Captures some uncovered demand
    - Medicaid/Medi-Cal excluded entirely; Medicare claims cannot be submitted
  notes: Segmentation is inferred from official access pages, help-center billing policies, and named partner announcements. Public sources do not disclose revenue share or visit volume by segment, so the strategic-value and gap columns are analytical rather than disclosed metrics.
