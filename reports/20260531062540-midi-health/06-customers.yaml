- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Commercial PPO in-network model
    - Heavy dependence on commercial coverage rules
    - Access and affordability deteriorate quickly when coverage is absent or misquoted
    - Request payer mix by insurer, denial rate, and out-of-network share
  - - Employer benefits channel
    - Employer count and top-account exposure undisclosed
    - A few large employers could matter disproportionately without public visibility
    - Request top-10 customer concentration and renewal schedule
  - - Health-system referral channel
    - Named partners exist but volume by system is unknown
    - Partner logos may overstate actual patient throughput
    - Request visits, referral conversion, and revenue by system
  - - Benefits-platform distribution
    - Platform partners may control member discovery and utilization data
    - Margin share and dependence on third-party navigation are opaque
    - Request economics and exclusivity terms for Cleo, Hinge, Collective, and similar partners
  - - Public-program exclusions
    - Medicaid / Medi-Cal excluded; Medicare only self-pay
    - Large older or lower-income cohorts remain unreachable or lower-conversion
    - Request roadmap for public-program participation or alternate reimbursement models
  - - Billing workflow complexity
    - Patient responsibility is hard to predict before claim adjudication
    - Surprise bills can weaken trust and reduce repeat usage
    - Request pre-visit cost-estimation accuracy and complaint-resolution metrics
  - - Sparse named-employer proof
    - Fortune 100 claim outpaces public customer roster detail
    - Hard to assess vertical diversification or case-study depth
    - Request full customer list by segment, spend band, and deployment maturity under NDA
  notes: This table focuses on channel durability and concentration rather than generic operating risk. Every row is tied to a concrete diligence path because public sources show real adoption but insufficient disclosure on customer economics and retention.
