- id: named-customer-proof-and-channel-evidence
  title: Named customer proof and channel evidence
  body: 'Public proof of real adoption is strongest in partnership channels rather than in a long public list of employer logos. Midi''s own clinician and referral pages say the platform has helped more than 230,000 patients, and the 2026 Series D announcement says more than 25,000 patients now seek care each week. Access is not limited to consumer self-serve acquisition: clinician referrals promise contact within 15 minutes, health-system pages stress preventive-care reengagement, and partner materials show administrative and navigation integrations that make the service look more like an embedded specialty-care layer than a standalone app.


    The named-customer set is credible but concentrated. Health-system proof includes Memorial Hermann, Mount Sinai, Keck Medicine of USC, and Lifepoint. Benefits and employer-channel proof includes Collective Health, Hinge Health, Cleo, Beacon Wellness Brands, and Progyny-linked availability reported by MobiHealthNews. These sources show multiple acquisition surfaces—direct consumer, physician referral, health-system collaboration, and employer benefits platforms—but they do not provide a clean public count of signed employers or channel-level revenue contribution. The implication is that Midi has real enterprise and partner traction, yet outside investors still cannot see the full shape of customer concentration from public materials alone.'
