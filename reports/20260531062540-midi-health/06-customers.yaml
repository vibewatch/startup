  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-transparency
    missingEvidence: Renewal rate, GRR, NRR, churn, and contract-length data by employer, health-system, and platform channel.
    whyItMatters: Without contractual retention data, the chapter can only infer durability from operational proxies like repeat visits and messaging.
    diligencePath: Request a channel-level customer retention table with contract terms, renewal cohorts, and gross/net retention metrics from management.
    relatedQuestionRefs:
      - QU021
    relatedTableRefs:
      - TU004
      - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-employer-visibility
    missingEvidence: A complete employer roster or at least a segmented list of named customers, by vertical and deployment maturity.
    whyItMatters: Public proof is concentrated in partners and health systems, making it hard to assess employer diversification or top-customer concentration.
    diligencePath: Request the full customer list or a redacted top-20 account table showing segment, geography, live date, and spend band.
    relatedQuestionRefs:
      - QU022
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: payer-mix-transparency
    missingEvidence: Volume and revenue split across employer-sponsored visits, direct consumer acquisition, clinician referrals, health-system referrals, and self-pay users.
    whyItMatters: The public story implies a diversified B2B2C model, but underwriting channel risk requires actual mix and concentration by payer and insurer.
    diligencePath: Request a payer-mix bridge by visits, unique patients, and revenue, including top insurers and denial/out-of-network rates.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU001
      - TU005
  - type: missing-source
    severity: material
    topic: independent-durability-evidence
    missingEvidence: Independent cohort studies or customer-published case studies showing long-term adherence, satisfaction, or clinical outcomes by channel.
    whyItMatters: Current public outcome evidence is mostly company-authored and does not fully prove long-term retention or channel-level ROI.
    diligencePath: Request third-party case studies, payer analyses, or anonymized cohort reports that track repeat usage, symptom improvement, and employer outcomes over time.
    relatedQuestionRefs:
      - QU025
    relatedTableRefs:
      - TU002
      - TU004
