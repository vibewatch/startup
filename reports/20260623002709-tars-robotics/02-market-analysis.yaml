- id: buyers-geographies-and-adoption-path
  title: Buyers, geographies, and adoption path
  body: The buyer map is already splitting into distinct markets with different decision makers. Industrial and logistics deployments have the clearest early path because they offer structured environments, labor-substitution logic, and ROI narratives. Agility explicitly describes deployment as an assess-validate-operate sequence, which mirrors enterprise automation buying behavior more broadly. At the same time, vendors such as Figure and 1X are targeting home-help and personal-assistance cases where budgets, unit economics, safety expectations, and social acceptance differ materially. Geography matters too. China is emerging as the deepest supply-side market thanks to scale, policy, and ecosystem density, while the US still contributes many of the leading software and capital-backed players. For TARS, the most relevant submarket is the industrial and precision-manipulation wedge inside this broader market, not the consumer humanoid narrative that dominates media attention.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
