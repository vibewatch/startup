  figureRefs: []
- id: constraints-and-underwriting-implications
  title: Constraints and underwriting implications
  body: 'The strongest counterweight to bullish market narratives is that the hardest adoption problems are still unresolved. Goldman highlights component bottlenecks, grinding-capacity limits, and incomplete software maturity in manipulation and interaction. WEF adds a different layer of risk: privacy, job displacement, reliability, and the need for explicit safety guardrails. Even the most promising vendors show how varied commercialization still is: some emphasize production deployment, some advertise home-help prototypes, and others remain technical benchmarks without broad commercial availability. For investors, that means broad market growth does not automatically translate into monetizable demand for every entrant. The disciplined underwriting approach is to translate TAM into buyer workflow questions: which budget owner signs, what pilot hurdle must be cleared, how much integration is required, and how quickly a narrow success case can expand. TARS benefits from strong industrial
    tailwinds, but its real market should be sized from customer workflow conversion outward, not from top-down robot hype inward. Investors should also separate prototype excitement from procurement reality: even improving markets can stay bottlenecked for years if reliability, safety certification, and integration labor do not improve together. Today.'
