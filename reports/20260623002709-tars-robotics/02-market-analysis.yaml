  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: A public source that isolates SAM or SOM for precision industrial dexterity tasks such as wire harness assembly or flexible-material manipulation.
    whyItMatters: Without a constrained segment model, top-down humanoid TAMs overstate the revenue pool relevant to TARS.
    diligencePath: Build bottom-up sizing from target workflows, buyer counts, and likely deployment density with management and customer interviews.
    relatedQuestionRefs:
    - QM039
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: Actual enterprise budgets, pilot conversion rates, and payback thresholds for precision humanoid deployments.
    whyItMatters: The market chapter can identify likely buyers but cannot prove willingness to pay at TARS's target price-performance point.
    diligencePath: Request active pipeline data, pilot economics, and three anonymized buyer cases from management.
    relatedQuestionRefs:
    - QM036
    - QM040
  - type: conflicting-data
    severity: minor
    topic: forecast-spread
    missingEvidence: Comparable methodologies behind the $38B, $66B, and $154B market scenarios.
    whyItMatters: Differences in horizon, included categories, and adoption assumptions can mislead valuation discussions if treated as interchangeable.
    diligencePath: Normalize forecast scopes before using any market number in valuation work.
    relatedQuestionRefs:
    - QM010
