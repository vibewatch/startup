- id: policy-and-structural-drivers
  title: Policy and structural drivers
  body: 'Policy is not a side variable in embodied AI; it is shaping both supply and demand. SCIO’s summary of the national humanoid standards framework signals that China is formalizing a stack that spans basic components, complete machines, applications, and safety and ethics. Shanghai goes further by underwriting the local cluster with pilot-cost subsidies, sales incentives, and compute and data support. Those measures matter because early adoption is capital intensive, integration heavy, and still operationally risky. Public data also suggests China has already crossed a threshold in scale: more than 140 manufacturers, more than 330 models, and a 2025 “first year of mass production.” In practice, this means startups like TARS are entering a market where policy and supply chains may accelerate winners faster than pure software companies can.'
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM033
  - CM034
  - CM035
  - CM037
