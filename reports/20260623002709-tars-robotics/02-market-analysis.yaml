callouts:
- calloutType: insight
  title: China is the supply-side center of gravity
  body: The combination of policy support, manufacturing depth, and patent activity makes China the most important geography for scaling embodied-intelligence hardware. That matters directly for TARS because local policy and supply chains can amplify execution speed.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM034
  - CM035
- calloutType: risk
  title: TAM is broad, but buyer conversion is still narrow
  body: Top-down market forecasts are useful for direction, yet they are too contradictory and too high-level to substitute for workflow-by-workflow buyer proof. For TARS, the real diligence test is whether one precision industrial wedge converts reliably into paid deployment.
