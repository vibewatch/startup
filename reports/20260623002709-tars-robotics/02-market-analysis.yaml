chapter:
  number: 2
  title: Market Analysis
  summary: The relevant market for TARS is the industrial and logistics wedge of embodied robots, where structured-environment demand, China policy support, and falling component costs are pulling adoption forward. Public TAMs are directionally large but highly inconsistent, so underwriting should emphasize buyer workflow conversion over generic market headlines.
sections:
- id: market-boundary-and-size
  title: Market boundary and sizing lens
  body: 'The central market question is not whether robotics is a huge category in the abstract; it is which slice of embodied intelligence matters for TARS. The relevant spend pool is the set of workflows where buyers will pay for dexterous, adaptable, human-form or adjacent embodied systems because fixed automation, manual labor, or narrow robots cannot do the job well enough. That makes the market narrower than “all automation,” but also more investable because it aligns to specific deployment economics. Public estimates vary sharply. Robozaps places the 2025 humanoid market at about $2.9 billion, while Goldman sees a $38 billion market by 2035 in a base case and a much larger $154 billion upside if cost, design, and acceptance barriers fall. WEF cites an even faster external path to $66 billion by 2032. Those numbers are directionally useful, but the spread itself is a warning: market sizing is still scenario-driven, so valuation should not rely on one headline TAM alone.'
  claimRefs:
