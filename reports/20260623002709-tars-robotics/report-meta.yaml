companyProfile:
  summary: >-
    TARS Robotics (Trusted AI and Robotics Solution) was founded on February 5,
    2025 in Shanghai by a team of former Huawei, Baidu, DJI, and Tsinghua
    University executives and scientists. In just 16 months the company raised
    $697 million across three rounds—a record pace for China's embodied AI
    sector—and achieved a Guinness World Record for sub-millimeter wire-harness
    assembly precision. TARS builds a full-stack embodied intelligence platform
    comprising the AWE 3.0 foundation model, the SenseHub human-motion data
    engine, the T-Series bipedal humanoid robot, the A-Series wheeled industrial
    robot, and the DexHand 21-DOF dexterous hand. The company targets the
    hardest unautomated manufacturing tasks—wire harness assembly, embroidery,
    and precision flexible-material handling—where 1 million+ industrial workers
    remain without viable automation today.
