- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Post-money valuation
    - Cannot assess dilution or entry price
    - Financing size alone is not enough for underwriting
    - Request cap table and term sheet summary
  - - Revenue and ARR
    - Cannot model scale or growth quality
    - Need baseline for any multiple-based analysis
    - Request monthly revenue history and backlog
  - - Gross margin
    - Cannot judge business quality
    - Hardware/service mix may be margin-compressive
    - Request margin bridge by revenue stream
  - - Burn and runway
    - Cannot judge financing dependency
    - Determines next-round urgency
    - Request cash, burn, and budget plan
  - - Customer concentration
    - Cannot test revenue durability
    - A few pilots may not equal repeatability
    - Request customer roster and pipeline concentration
  - - Net price realization
    - Cannot compare peers fairly
    - List price does not equal realized ASP or profitability
    - Request quote-to-close pricing data
  notes: Every missing field is material to underwriting because TARS is private and unusually lightly disclosed for its funding scale.
