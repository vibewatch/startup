company:
  name: TARS Robotics
chapter:
  number: 4
  title: Financials
  summary: TARS is exceptionally well funded for a company founded in 2025, with roughly $697 million of disclosed financing by April 2026, but the public record does not support a conventional underwriting model because valuation, revenue, margin, burn, and runway remain undisclosed. The right current view is strong capital access paired with high operating-evidence risk.
sections:
- id: funding-base-and-disclosure-limits
  title: Funding base and disclosure limits
  body: 'Public evidence supports one thing very clearly: TARS has raised extraordinary amounts of capital very quickly. The chronology is unusually compressed for a startup founded in early 2025: a $120 million angel round, a $122 million angel+ round, and a $455 million Pre-A round by April 2026. That puts cumulative disclosed financing near $697 million within roughly fourteen months. The investor set also matters, because it combines venture, strategic, and state-backed capital. Yet the strength of the funding record is offset by weak operating disclosure. No public source in the reviewed set discloses post-money valuation, revenue, ARR, gross margin, burn, runway, or customer concentration. As a result, this chapter can document financing history and likely financial implications, but it cannot underwrite the business the way one would a more transparent software or public hardware company.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  tableRefs:
