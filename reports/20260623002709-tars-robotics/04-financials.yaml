- id: capital-market-context-and-comparables
  title: Capital market context and comparables
  body: 'TARS did not raise into a neutral market. The broader private-capital environment in 2025 rewarded AI platforms, hard-tech narratives, and national-priority sectors even while Asia-wide VC conditions remained soft. KPMG describes AI as the hottest global funding theme and notes government-backed capital programs aimed at accelerating strategic technologies. China''s policy backdrop matters here: the emergence of a 138 billion yuan national venture capital guidance fund and the concentration of state-backed capital into AI-related firms help explain why an opaque young robotics company could attract large rounds. Comparable humanoid financings reinforce the point. Figure publicly disclosed a 2025 Series C at a $39 billion post-money valuation, while TechCrunch reported Apptronik around $5.3 billion after raising $935 million. Those comparables do not reveal TARS''s valuation, but they show the capital market was willing to price leading humanoid narratives very aggressively.'
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
