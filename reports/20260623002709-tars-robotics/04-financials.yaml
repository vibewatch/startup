  - TI005
  figureRefs: []
- id: revenue-model-and-unit-economics
  title: Revenue model and unit-economics uncertainty
  body: 'The most supportable public financial model for TARS is a hybrid of robot hardware, deployment or integration services, and possibly software or support layers, but none of those revenue components are quantified publicly. Even the price signal most often repeated for TARS is not official; it comes from independent directories that place the robot around $95,000. That is useful as a reference point, but not as evidence of realized ASP, attach revenue, or gross margin. The company''s public messaging is much more product- and research-centric than commercially detailed, emphasizing dexterity breakthroughs and technical credentials over recurring revenue or buyer conversion. That pattern is typical for early robotics firms, but it leaves every serious unit-economics question unresolved: contribution margin, services burden, utilization, customer payback, and post-sale support cost are all missing from the public file. Publicly, none of those links are quantified. That remains entirely
    unresolved.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI034
  - CI035
  - CI036
