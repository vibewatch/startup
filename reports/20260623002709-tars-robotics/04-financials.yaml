callouts:
- calloutType: insight
  title: Funding strength is real, but financial transparency is not
  body: TARS has clearly attracted exceptional capital for its age. The problem is not weak funding; it is that the public record still does not reveal valuation, revenue, margin, or runway, which are the metrics needed to underwrite the business economically.
  claimRefs:
  - CI004
  - CI007
  - CI009
  - CI029
  - CI040
- calloutType: risk
  title: Financing momentum may be ahead of commercialization proof
  body: 'The strongest adverse evidence in the chapter is not a failed product signal but a disclosure imbalance: enormous capital formation, minimal public operating metrics, and skeptical outside commentary about traction. That mismatch is the main financial risk today.'
  claimRefs:
  - CI011
  - CI037
  - CI038
  - CI039
