  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation, security type, dilution, and board rights for the latest round.
    whyItMatters: Without valuation and terms, investors cannot judge ownership outcomes or whether financing enthusiasm has outrun business fundamentals.
    diligencePath: Request full cap table, term sheet summary, and board deck on the latest financing.
    relatedQuestionRefs:
    - QI007
    - QI008
  - type: private-evidence-only
    severity: blocking
    topic: operating-metrics
    missingEvidence: Revenue history, gross margin, burn, runway, backlog, and customer concentration.
    whyItMatters: These are the minimum inputs for a defensible operating model and capital-adequacy view.
    diligencePath: Request audited or board-reported monthly financials plus cohort or customer concentration detail.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI028
    - QI029
    - QI034
    - QI038
  - type: stale
    severity: minor
    topic: filing-proxies
    missingEvidence: A directly readable public-company filing proxy for robotics hardware economics; SEC and HKEX lookup pages were not easily consumable in this run.
    whyItMatters: Comparable filing data would sharpen margin and balance-sheet benchmarks for hardware peers.
    diligencePath: Use a maintained IR annual report PDF or manually retrieve the filing outside the current fetch constraints.
