evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation, round price, and dilution data for the April 2026 Pre-A round.
    whyItMatters: >-
      Valuation is necessary to judge entry price, ownership outcomes, and whether financing momentum is outrunning
      intrinsic progress.
    diligencePath: Request the latest cap table, term sheet summary, and any internal 409A or board-approved valuation memo.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Named customers, signed contracts, revenue run rate, and any pilot-to-production conversion data.
    whyItMatters: >-
      Without commercialization evidence, investors cannot determine whether technical milestones are translating into
      repeatable market demand.
    diligencePath: Request customer roster, booked revenue by quarter, top pilot metrics, and at least two deployer references.
    relatedQuestionRefs:
      - QO029
      - QO030
      - QO031
      - QO044
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: Authoritative corporate registration or management confirmation of the current headquarters city.
    whyItMatters: >-
      Location affects policy eligibility, hiring assumptions, and which local ecosystem support should be treated as
      directly relevant.
    diligencePath: Request business registration documents and current office addresses from management.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: access-blocked
    severity: minor
    topic: secondary-profile
    missingEvidence: The AIWiki profile contents could not be reviewed because access was rate-limited.
    whyItMatters: The blocked source is not central, but unreviewed secondary profiles can hide stale or contradictory data points.
    diligencePath: Retry access later or ignore the source if better corroborated sources remain available.
    relatedQuestionRefs:
      - QO041
  - type: private-evidence-only
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: Formal board list, reporting lines, and independent governance details beyond the named public leadership team.
    whyItMatters: >-
      The leadership table is intentionally partial because public evidence identifies executives but not full
      governance coverage or succession depth.
    diligencePath: Request org chart, board roster, and committee structure from management.
    relatedTableRefs:
