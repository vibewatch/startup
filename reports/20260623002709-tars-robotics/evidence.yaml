  - type: private-evidence-only
    severity: material
    topic: TO003 investor map completeness
    missingEvidence: Complete cap table with ownership, pro rata rights, and board seats for all investors.
    whyItMatters: >-
      The investor map is partial because public round coverage names many investors but not economic control, exact
      ownership, or rights.
    diligencePath: Request the full financing history, current cap table, and investor rights summary.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: TO004 chronology completeness
    missingEvidence: >-
      Complete dated internal chronology covering all product, governance, and partnership events not publicly
      announced.
    whyItMatters: >-
      The milestone table captures major public events, but management may have material internal milestones or adverse
      events not disclosed externally.
    diligencePath: Request an internal milestone chronology and compare it with the public record for omissions.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A public source that isolates SAM or SOM for precision industrial dexterity tasks such as wire harness assembly or
      flexible-material manipulation.
    whyItMatters: Without a constrained segment model, top-down humanoid TAMs overstate the revenue pool relevant to TARS.
    diligencePath: >-
      Build bottom-up sizing from target workflows, buyer counts, and likely deployment density with management and
      customer interviews.
    relatedQuestionRefs:
      - QM039
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: Actual enterprise budgets, pilot conversion rates, and payback thresholds for precision humanoid deployments.
    whyItMatters: >-
      The market chapter can identify likely buyers but cannot prove willingness to pay at TARS's target
      price-performance point.
    diligencePath: Request active pipeline data, pilot economics, and three anonymized buyer cases from management.
    relatedQuestionRefs:
      - QM036
      - QM040
  - type: conflicting-data
    severity: minor
    topic: forecast-spread
    missingEvidence: Comparable methodologies behind the $38B, $66B, and $154B market scenarios.
    whyItMatters: >-
      Differences in horizon, included categories, and adoption assumptions can mislead valuation discussions if treated
      as interchangeable.
    diligencePath: Normalize forecast scopes before using any market number in valuation work.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: deployment-proof
    missingEvidence: Named customers, pilot conversion rates, and repeat deployment data for TARS versus industrial peers.
    whyItMatters: >-
      Without deployment proof, TARS cannot be compared fairly against competitors that already disclose partners or
      commercial readiness signals.
    diligencePath: >-
      Request pipeline stages, signed customers, pilot results, and reference calls to compare against Agility- and
      Boston-style proof surfaces.
    relatedQuestionRefs:
