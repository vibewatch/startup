callouts:
- calloutType: strength
  title: TARS is not fighting the same battle as home-help humanoids
  body: The public evidence suggests TARS should be judged against industrial precision work, not against the home-assistance story pursued by Figure and 1X. That narrower lane can be defensible if the company proves workflow-level superiority before general-purpose models catch up.
  claimRefs:
  - CP003
  - CP009
  - CP012
  - CP026
- calloutType: risk
  title: Commercial proof still favors Agility and Boston
  body: Agility and Boston Dynamics disclose far more about deployment motion, integrations, certifications, and enterprise adoption surfaces than TARS does today. That does not mean TARS loses technically, but it does mean buyers and investors currently have more proof from those rivals.
