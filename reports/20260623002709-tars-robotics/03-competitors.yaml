  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: deployment-proof
    missingEvidence: Named customers, pilot conversion rates, and repeat deployment data for TARS versus industrial peers.
    whyItMatters: Without deployment proof, TARS cannot be compared fairly against competitors that already disclose partners or commercial readiness signals.
    diligencePath: Request pipeline stages, signed customers, pilot results, and reference calls to compare against Agility- and Boston-style proof surfaces.
    relatedQuestionRefs:
    - QP035
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized contract pricing, service attach rates, and discounting data for TARS and peers.
    whyItMatters: Public list prices and targets are signaling devices, not proof of gross-margin or buyer willingness-to-pay.
    diligencePath: Request quote history, list-versus-net pricing, and services revenue splits from management and channel partners.
    relatedQuestionRefs:
    - QP025
  - type: conflicting-data
    severity: minor
    topic: maturity-scoring
    missingEvidence: Standardized third-party benchmark data comparing dexterity, uptime, and safety across vendors.
    whyItMatters: Public vendor pages emphasize different dimensions, making cross-company rankings inherently noisy.
    diligencePath: Use a common test harness or third-party benchmark protocol in technical diligence.
    relatedQuestionRefs:
    - QP028
    - QP036
