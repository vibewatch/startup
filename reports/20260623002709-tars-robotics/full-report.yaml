      - number: '8.4'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              Three scenarios bracket the credible outcome distribution. The bull case assumes TARS signs its first
              large enterprise contract by Q4 2026, deploys 300–500 units by 2027, and closes a Series A at $6 billion
              or above on the strength of measured commercial traction. Under this path, a 2028–2030 IPO at $10–15
              billion generates a 4–6× return on entry at $2.5 billion. The catalysts—JD.com as an early anchor, the
              LogiMAT European purchase-intent signals, and the full-stack AI advantage—are real. The risk is that
              conversion from intent to contract typically takes 12–24 months in industrial automation.


              The base case assumes one or two small-volume pilot deployments by H2 2027, a Series A closing at $3–4
              billion by late 2027, and continued technical milestones without yet reaching the unit volume needed to
              demonstrate unit economics. The implied return on a $2.5 billion entry is 1.2–1.6× over a 3–4 year
              hold—below typical venture return thresholds but consistent with a track record being built. The key swing
              variable is whether the JD.com relationship converts to a deployment contract.


              The bear case assumes no confirmed revenue by end of 2027, a competitive squeeze from AgiBot and Figure AI
              locking up key Chinese industrial customers, geopolitical headwinds from U.S. export controls tightening,
              and a down-round Series A at $1.5–2 billion. On a $2.5 billion entry, this scenario implies a loss of
              20–40%. The probability signal is 30%—elevated because zero revenue and no customers provides little
              cushion if capital markets shift away from pre-revenue hardware at this valuation level. MachineBrief's
              skepticism about the gap between TARS's funding narrative and its actual traction is the public expression
              of this bear risk.
