        title: Leadership depth and governance concentration
        blocks:
          - type: paragraph
            body: >-
              Leadership is the clearest source of early credibility. Chen Yilun combines robotics research, machine
              vision, automotive autonomy, and operating experience from DJI, Huawei ADS, and Tsinghua AIR, which makes
              the founder-market fit unusually strong for a company only months old. Li Zhenyu adds autonomous-driving
              platform and commercialization experience from Baidu Apollo, while Ding Wenchao and Chen Tongqing add
              high-end technical coverage across embodied control, navigation, and spatial perception. This
              concentration of elite resumes is likely why investors financed TARS so aggressively, but it also creates
              a governance asymmetry: public narratives remain overwhelmingly centered on Chen Yilun. There is no clear
              public board structure, no visible independent director layer, and no disclosed succession depth beyond
              the named founding team. That means the same factor that strengthens technical credibility also heightens
              execution concentration risk. Investors should treat leadership quality as a strength and single-founder
              signaling dependence as a real diligence topic, not a footnote.
