      - number: '6.5'
        title: Expansion Trajectory and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              China's industrial automation market is both TARS's largest near-term opportunity and its most significant
              concentration risk. With approximately 470 industrial robots per 10,000 manufacturing workers—three times
              the global average—and accounting for roughly 36% of global robotics investment, China represents a
              uniquely deep pool of potential industrial customers. TARS's Beijing-Shanghai dual headquarters, combined
              with state capital participation from both cities in the Pre-A round, provides preferential access to
              procurement programs tied to the government's 50-billion-yuan embodied intelligence industry target by
              2027. European market exposure through LogiMAT 2026 is real but early; CE certification and EU regulatory
              compliance for commercial sales have not been publicly confirmed.


              Customer concentration risk is latent but material if deployments materialize. If JD.com, Meituan, or a
              single large state-backed manufacturer represents the majority of early contracts, TARS's revenue would be
              highly concentrated with a single counterparty. The company has not publicly addressed concentration risk
              mitigation strategies. The wire harness sector itself is geographically and sectorally
              concentrated—primarily in Asian automotive and consumer electronics supply chains—which limits geographic
              diversification without targeting new verticals. Embroidery, precision assembly, and intralogistics
              provide portfolio breadth, but no public evidence suggests parallel customer traction across more than one
              vertical simultaneously.


              A single battery electric vehicle contains 1,500 to 3,000 wires totaling more than 5 kilometers, creating
              urgent and scalable demand for TARS's core dexterous manipulation capability in the automotive supply
              chain. The Pandaily June 2026 Smart Expo coverage confirms continued buyer-side momentum in Chinese
              logistics robotics, and aparobot analysis reinforces China's structural advantage in the automation race.
              TARS's embroidery demonstration confirmed the applicability of its manipulation platform to flexible
              material handling beyond wire harness, a meaningful indication of cross-vertical potential—even if no
              textile-sector customers have been named. Overall, TARS's expansion path is geographically and sectorally
              concentrated, making early customer diversity a critical risk-management priority once commercial
              contracts begin.
