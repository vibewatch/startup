            body: >
              The most concrete named proof in TARS's public record is strategic investor evidence rather than direct
              customer evidence. Meituan's strategic investment arm co-led the Angel+ round ($122 million, July 2025)
              and participated in the Pre-A round ($455 million, April 2026). Shoucheng Holdings disclosed a strategic
