  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: T-Series and A-Series hardware platform
        blocks:
          - type: paragraph
            body: >-
              TARS operates two distinct hardware lines that serve complementary industrial contexts. The T-Series is a
              full bipedal humanoid standing 167 cm tall and weighing 80 kg, built around 35 degrees of freedom and
              actuated by electric servo motors with harmonic gear transmission. This design choice delivers
              sub-millimeter repeatability for precision manufacturing tasks — threading needles, routing cables,
              inserting connectors — while maintaining the dynamic balance capabilities needed in real factory
              environments. T-Series supports bipedal walking, stair climbing, obstacle avoidance, stand-up-from-fall
              recovery, and short-run locomotion. Connectivity is provided through a 5G-A interface for low-latency
              remote operation alongside a Linux-based industrial OS with ROS and Python API integration. An independent
              directory cites an approximate list price of $95,000, though TARS has published no official pricing. The
              A-Series is a wheeled industrial robot line designed for structured logistics and factory-floor
              deployment. The A1 variant made its overseas debut at LogiMAT — a leading international intralogistics
              trade fair — in 2026, where it demonstrated general operational capabilities and reportedly secured
              documented purchase interest from clients across European industries and countries. The parallel
              deployment of bipedal T-Series and wheeled A-Series options allows TARS to address different automation
              contexts under the same full-stack AI architecture, reducing the incremental cost of expanding from one
              deployment segment to another. Both lines share the AWE model and SenseHub data stack, giving either
              hardware form factor access to the same trained skill library.
