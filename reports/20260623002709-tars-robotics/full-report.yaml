      - number: '8.5'
        title: Thesis-Break Triggers, Exit Readiness, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              TARS is not yet exit-ready for a public listing, and the pathway to a 2028–2030 IPO depends on at least
              three milestones that remain undemonstrated: signed commercial contracts with disclosed revenue, unit
              economics that support positive contribution margin, and an explicit compliance posture on export controls
              and cross-border data governance. The most realistic near-term exit scenario is a strategic acquisition by
              a Chinese industrial conglomerate or a co-investment by a Tier-1 automotive or logistics player who needs
              the full-stack AI capability and can absorb the geopolitical risk premium.


              Thesis-break triggers are specific and monitorable. If TARS has zero named customers by end of 2027 (two
              and a half years after founding), the evidence-free commercialization narrative collapses. If the company
              or any key hardware supplier appears on the U.S. BIS Entity List, overseas deployment and compute access
              is materially impaired. A Series A priced below $2 billion would signal investor confidence has collapsed
              faster than the technical roadmap warrants. The departure of CEO Chen Yilun or Chairman Li Zhenyu would
              sever the key investor relationships and strategic vision that justify the premium over commercial-stage
              peers. Table TV005 captures the full trigger set.


              Final diligence (Table TV006) is gateable into three priority tiers. The blocking items— undisclosed
              post-money valuation, revenue and signed customer contracts, and monthly burn rate—must be resolved before
              any co-investment at an undisclosed price. The material items— IP and patent portfolio, export compliance
              status, manufacturing COGS, and cap table—are necessary for modeling and preference-stack analysis. The
              minor items—Series A timeline, scientific advisory board depth—inform strategic positioning. Investors who
              can secure data-room access should prioritize the blocking tier before any capital commitment.
