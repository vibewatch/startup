      - number: '6.2'
        title: Adoption Trajectory and Evidence Stage
        blocks:
          - type: paragraph
            body: >
              TARS is unambiguously pre-revenue as of June 2026. No production deployments, signed customer contracts,
              or revenue figures have been disclosed in any public source, investor filing, or third-party analysis
              reviewed for this chapter. The company's adoption evidence sits almost entirely at the capability
              demonstration and purchase-signal stages of the customer adoption funnel. The key public proof points are:
              the August 2025 embroidery demonstration establishing flexible manipulation; the ICRA 2026 showcase with
              the DexHand performing live wire harness insertion with real-time error correction; the Guinness World
              Record for sub-millimeter wire harness assembly; and the LogiMAT 2026 A1 debut in Stuttgart where trade
              publication Gasgoo reported "clear purchase intentions from clients across various industries and European
              countries."


              The Guinness achievement is a controlled-benchmark capability proof, not a commercial deployment—it
              demonstrates the robot's manipulation accuracy under managed conditions. The LogiMAT purchase intention
              claim is sourced from Gasgoo's Seeds Discovery column, a company-profile and partnership channel rather
              than independent journalism; the claim should be treated as company-associated and unconfirmed. No
              independent European buyer has been named, quoted, or independently verified. JD.com's mention in TARS
              funding coverage reflects JD's own declared robotics ambitions—a publicly disclosed plan to procure 3
              million robots over five years—rather than a confirmed TARS supplier relationship.


              Overall, TARS has executed a credible public proof-of-concept roadmap—embroidery to wire harness benchmark
              to international trade show debut—consistent with a pre-commercial customer development process. Evidence
              freshness is adequate: the most recent customer-relevant signal (LogiMAT) dates to May 2026, less than two
              months before this chapter's research date. Conversion of these signals into signed pilots or production
              revenue remains unverified by any source available to this chapter.
