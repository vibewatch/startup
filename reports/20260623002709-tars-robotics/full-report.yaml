      - number: '3.3'
        title: Where TARS is strong and where it trails
        blocks:
          - type: paragraph
            body: >-
              TARS looks strongest when the comparison emphasizes high-precision dexterity. Public reviews position it
              around wire harness, embroidery, and other tasks that require steadier fine motor control than many
              general-purpose humanoid narratives highlight. That specialization may make it more relevant than
              consumer-leaning peers for certain factory workflows. But the same specialization becomes a weakness if
              the market shifts toward generalist systems that become “good enough” across many tasks while selling at
              much lower price points. TARS also trails the most mature disclosed competitors on public commercial
              proof. Agility names partners and describes deployment stages, Boston articulates a full enterprise stack,
              and UBTECH benefits from public-company credibility. By contrast, TARS still relies heavily on product
              demos, fundraising momentum, and technical claims rather than named customer evidence. This makes
              comparative underwriting less about who has the flashiest robot and more about who can turn a narrow
              advantage into repeat deployments first.
