      - number: '3.4'
        title: Moats, risks, and competitive durability
        blocks:
          - type: paragraph
            body: >-
              The core moat question is whether TARS's dexterity niche is durable before the market commoditizes around
              cheaper and more general systems. Today, lower-cost entrants are already compressing expectations on
              humanoid pricing, and multiple vendors are building narratives around flexible labor substitution in the
              same broad workflows. Distribution power also matters. Companies with named partners, certifications, or
              hundreds of customers can convert enterprise caution into procurement momentum faster than startups that
              mainly show technical progress. Switching costs are real, but they do not yet look like software-style
              lock-in; they come from safety approval, integration effort, workflow redesign, and operator training.
              That means multi-homing is plausible at the pilot stage and buyers can compare humanoids against manual
              labor or fixed automation rather than committing to one vendor quickly. The main adverse conclusion is
              straightforward: if TARS cannot prove real deployment traction soon, its technical niche may be swallowed
              by a market that is getting cheaper, louder, and more crowded. In other words, the competitive clock is
              speeding up even if customer adoption remains gradual, so TARS must prove execution before the market
              narrative gets standardized around cheaper generalists.
