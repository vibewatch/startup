      - number: '7.5'
        title: Mitigation Strategies and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Effective risk management for a TARS investment requires monitored early-warning triggers and
              pre-specified thesis-break events. Mitigations exist for several risks but are immature or unconfirmed;
              investors should treat the following as diligence obligations rather than resolved items.

              On regulatory risk, TARS can partially mitigate BIS export control risk by qualifying domestic AI compute
              (Huawei Ascend-class chips for inference, domestic DRAM for training) before advanced foreign chips become
              unavailable. MIIT standard compliance is manageable as a first-mover—TARS's participation in the HEIS
              process (through industry body membership) would provide advance visibility of specification changes. For
              EU AI Act compliance, early engagement with a notified body for conformity assessment of the A1 in
              manufacturing contexts would reduce time-to-market risk if and when TARS targets European customers.

              On operational risk, supply chain diversification (qualifying two or more actuator and harmonic gear
              vendors) and inventory buffering are standard mitigations that TARS should have in place before Series A.
              Battery certification (IEC 62133-2) and ISO 10218-compliant safety system design should be prerequisites
              for any customer pilot. The sim-to-real gap can be partially addressed by expanding SenseHub's data
              collection scope to diverse factory environments, but this takes time and customer access.

              On financial risk, securing at least two named enterprise pilot contracts with committed purchase order
              language (not just MOUs) before the next fundraise would significantly de-risk the capital story. Capital
              burn management through staged hardware development (prioritizing DexHand software and AWE model over full
              A1 production units) could extend runway by 12–18 months.

              Kill criteria are specific, measurable events that should trigger divestment consideration: (1) Chen Yilun
              departure within 24 months; (2) BIS entity list addition for TARS or its key chip suppliers; (3) cash
              runway below 12 months without a committed new round; (4) three consecutive failed enterprise pilot
              attempts where robots are replaced rather than purchased; (5) Unitree G1 achieves sub-5mm insertion
              accuracy in wire harness tasks (removing TARS's differentiation claim). Each trigger should prompt
              immediate reassessment.
