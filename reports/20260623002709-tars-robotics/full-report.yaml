              TARS has not published any named enterprise customer list, pilot partner announcement, or purchase order.
              The only public evidence of external interest from potential buyers is the Gasgoo LogiMAT report. For the
              embroidery and wire harness use cases, TARS has referenced the broader industrial labor market—embroidery
              employs hundreds of thousands and wire harness assembly employs more than one million workers in China—as
              its intended customer base, without naming any specific employer or manufacturing facility. The Finanzwire
              and Pressrelease Hub ICRA coverage confirm the wire harness demonstration's technical content but contain
              no customer references.


              JD Logistics' October 2025 announcement of a 5-year procurement plan for 3 million robots and 1 million
              autonomous vehicles shows the scale of intent among Chinese logistics platforms. JD's Wolf Pack robot was
              already deployed across 20+ Chinese provinces and 10+ countries as of late 2025, establishing JD as an
              active industrial robot buyer at scale—even though no TARS-specific deal has been disclosed. The June 2026
              Smart Expo coverage shows JD Logistics and robot partners continuing to exhibit automation capability,
