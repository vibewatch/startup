    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, location, and operating scope
        blocks:
          - type: paragraph
            body: >-
              TARS Robotics presents as an unusually well-capitalized embodied-AI startup that is still defining its
              public identity layer. The strongest common facts across independent coverage are that the company was
              founded on February 5, 2025, operates from Shanghai, and is building a full-stack stack that links data
              capture, foundation models, and robot hardware. The homepage itself is sparse, so most diligence-grade
              identity facts come from independent funding coverage, interviews, and product releases rather than a
              mature corporate disclosure surface. That gap matters because several core cover metrics, including
              valuation, revenue, named customers, and confirmed office footprint, are not disclosed on owned channels.
              The only visible contradiction inside the public corpus is headquarters labeling: most sources place TARS
              in Shanghai, while one independent directory calls it Beijing-based. For underwriting purposes, Shanghai
              should be treated as the working assumption because it is repeated in financing coverage and reinforced by
              the policy context, but the discrepancy should be closed in management diligence.
