            body: >-
              The fairest financial conclusion is that TARS appears very well funded for its age but still cannot be
              underwritten on conventional operating metrics. Near-term capital adequacy looks strong on paper because
              $697 million is a large disclosed war chest for a private robotics startup. But that is only a
              surface-level view. Public sources do not disclose cash on hand, monthly burn, debt, project finance,
              working capital strain, or manufacturing obligations. Peer disclosures show why this matters: scaling
              humanoid companies spend heavily on manufacturing, compute, data collection, integration tooling, and
              field support. Publicly, TARS faces the additional risk that its funding record can be mistaken for
              traction proof. Skeptical coverage explicitly flags that concern. Until investors can test valuation,
              revenue quality, margin path, and customer proof directly, the right stance is not that TARS is weak
              financially, but that its operating economics remain substantially unverified. Investors also need to know
