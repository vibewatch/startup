      - number: '5.3'
        title: AWE 3.0 foundation model and VLTA architecture
        blocks:
          - type: paragraph
            body: >-
              AWE (AI World Engine) is TARS's embodied AI foundation model, currently at version 3.0, and represents the
              analytical core of the company's full-stack thesis. Unlike conventional Vision-Language-Action
              architectures that map visual and linguistic inputs directly to discrete action tokens, AWE is built
              around a latent-space world-model approach: the model maintains a compressed internal representation of
              environment and task state, which enables higher-frequency continuous action generation and more stable
              manipulation under real-world perturbation. This design corresponds to the RTR research paper — "Learning
              High-Frequency Continuous Action Chunks in Latent Space" — accepted at ICML 2026, which provides external
              peer validation of the core technical architecture. The VLTA (Vision-Language-Tactile-Action) multimodal
              design integrates visual streams from body-mounted and fingertip cameras, language task specifications,
              tactile data from DexHand's elastomer sensors, and continuous action outputs into a unified learned
              representation. AWE 3.0 is trained on massive volumes of human first-person data collected through
              SenseHub, which TARS reports reduces task jitter and improves success rates for tasks approached from
              novel camera angles. At ICRA 2026, AWE 3.0 powered multi-step autonomous backpack packing and live error
              correction in wire-harness insertion. Dr. Ding Wenchao delivered the ICRA 2026 industry keynote "General
              Physical Intelligence," presenting TARS's full-stack technology roadmap from academic research to
              industrial-scale deployment. Independent observers noted the distinction between AWE's world-model
              approach and the VLA trend dominant elsewhere in the industry, positioning it as more
              generalization-capable but also less battle-tested at scale.
            claimRefs:
              - CE018
