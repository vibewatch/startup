  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and segmentation
        blocks:
          - type: paragraph
            body: >-
              The competitive field around TARS is broader than a simple list of humanoid startups. It includes direct
              industrial peers, consumer-oriented humanoids, general-purpose platforms, and status-quo substitutes such
              as manual labor, fixed automation, and special-purpose mobile robots. TARS sits in a narrower wedge than
              many high-profile names: it is trying to win on dexterity and precision industrial manipulation rather
              than on generic home assistance or broad brand visibility. That matters because many media comparisons
              flatten the field into one “humanoid race,” while actual buyers evaluate different jobs, price points, and
              trust thresholds. In practice, Figure and 1X are more relevant as long-run AI or home-help comparables;
              Agility, Apptronik, Boston Dynamics, and selected Chinese industrial peers are closer operational
              comparables. Investors should therefore segment the field before judging whether TARS is meaningfully
              differentiated or simply another expensive prototype.
            claimRefs:
              - CP001
