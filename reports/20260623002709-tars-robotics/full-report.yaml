  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding base and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports one thing very clearly: TARS has raised extraordinary amounts of capital very
              quickly. The chronology is unusually compressed for a startup founded in early 2025: a $120 million angel
              round, a $122 million angel+ round, and a $455 million Pre-A round by April 2026. That puts cumulative
              disclosed financing near $697 million within roughly fourteen months. The investor set also matters,
              because it combines venture, strategic, and state-backed capital. Yet the strength of the funding record
              is offset by weak operating disclosure. No public source in the reviewed set discloses post-money
              valuation, revenue, ARR, gross margin, burn, runway, or customer concentration. As a result, this chapter
              can document financing history and likely financial implications, but it cannot underwrite the business
