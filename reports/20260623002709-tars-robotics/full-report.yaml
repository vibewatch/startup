      - number: '8.2'
        title: Financing Context, Entry Discipline, and Implied Valuation
        blocks:
          - type: paragraph
            body: >
              TARS raised capital in an unusually compressed timeline that makes conventional dilution math difficult to
              apply cleanly. The angel round ($120 million, March 2025) was the largest angel round in China's
              embodied-AI history at the time. The $122 million angel-plus round (July 2025) followed four months later.
              The $455 million Pre-A (April 2026) set a new record for a single financing round in China's embodied-AI
              sector. In aggregate, $697 million was committed before the company's first full year as an operating
              entity had elapsed.


              Without a disclosed post-money valuation, an entry-discipline analysis requires inference. If the Pre-A
              round ($455 million) represents 25–35% primary dilution—within the range for a competitive Chinese
              embodied-AI Pre-A in 2025–2026—the implied post-money ranges from $1.3 billion (at 35%) to $1.82 billion
              (at 25%). Adding the earlier angel tranches with cumulative dilution of 20–25%, the fully-diluted implied
              valuation is most consistent with a $2.0–3.0 billion range, with $2.5 billion as the central estimate used
              throughout this chapter. This is our own analytical inference; no primary source discloses the actual
              figure. The KPMG Q1 2026 Venture Pulse confirms that AI-focused companies continue to command premium
              round prices globally, which supports the upper end of the range. TechCrunch reported Apptronik at
              approximately $5.3–5.47 billion after its $935 million Series A, suggesting a roughly 2–2.5× premium over
              TARS's implied range for a US humanoid company one stage further.


              Entry discipline should gate on three conditions: a disclosed post-money valuation or a verified cap table
              review, evidence of at least one signed commercial contract, and disclosure of the monthly burn rate.
              Without those three items, a co-investment at an undisclosed valuation introduces an information
              disadvantage relative to the existing institutional syndicate. State capital participation (Beijing and
              Shanghai government funds) creates implicit valuation floors but also complicates future preference-stack
              and exit dynamics.
