      - number: '7.3'
        title: Financial and Capital Risk
        blocks:
          - type: paragraph
            body: >
              TARS's financial risk profile is dominated by three structural tensions: a massive capital requirement
              against zero disclosed revenue; a price point that faces severe downward competition; and a state-funding
              dependency that introduces political risk.

              Capital intensity: TARS has raised $697M in total ($242M angel, $455M pre-A), placing it among the
              most-funded pre-revenue robotics companies globally. Yet humanoid robot development is extraordinarily
              capital-intensive. Goldman Sachs projects the global robotics market reaching only $38B by 2035—a long
              timetable requiring sustained investment. KPMG's Q1 2026 Venture Pulse shows global VC funding is
              increasingly concentrated in proven revenue-generating companies, suggesting that late-stage fundraising
              without commercial contracts will face headwinds. If TARS does not secure named enterprise customers by
              mid-2027, its Series A will need to be raised on promise rather than performance.

              Pricing risk: TARS's A1 is listed at approximately $95,000 per unit—5.9 times Unitree's G1 at $16,000.
              Unitree claims profitability since 2020 from its quadruped business, providing a structural cost base that
              TARS cannot match. If general-purpose humanoid robots continue to commoditize at the hardware layer
              (Unitree R1 at $4,900, Figure targeting ~$20,000), TARS's premium will only be sustainable if its
              precision-AI software stack demonstrably reduces total cost of ownership versus hiring human workers for
              wire harness assembly. The MachineBrief analysis questioned whether TARS's $122M angel valuation was
              justified given only prototypes existed at the time, flagging the risk of a valuation reset if commercial
              milestones are not met.

              State funding dependency: A portion of TARS's capital comes from state-linked vehicles. Shanghai
              government subsidies (up to 20M RMB for pilot projects), MIIT support programs, and alignment with China's
              15th Five-Year Plan create a policy-dependent revenue environment. If China's industrial policy priorities
              shift—for example, to nationalize humanoid robot development or pivot focus to defense robotics—TARS could
              lose access to state-backed co-investment and pilot deployment opportunities. This dependency is difficult
              to hedge without diversified international revenue, which is itself blocked by regulatory risk.
