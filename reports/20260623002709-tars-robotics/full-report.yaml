      - number: '1.3'
        title: Funding trajectory and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              TARS moved from launch to one of China''s most heavily funded embodied-AI startups in roughly fourteen
              months. The financing sequence is unusually compressed: a $120 million angel round in March 2025, a $122
              million angel+ round in July 2025, and a $455 million Pre-A round in April 2026. That pace produced a
              cumulative public funding total near $697 million and brought in a mix of venture firms, strategic
              platforms, and state-backed funds. The structure suggests investors are not merely backing an interesting
              demo team; they are funding a platform they believe can matter in industrial humanoids, logistics, and
              upstream embodied-model infrastructure. Even so, the public record does not reveal the company''s
              valuation, secondaries, debt lines, or cap-table control dynamics. Database sources also appear somewhat
              stale relative to the latest round reporting. The result is a strong capital signal with incomplete price
              and governance transparency, which is typical for private Chinese frontier-AI companies but still material
              for investment judgment.
