      - number: '3.2'
        title: Competitor profiles and buying criteria
        blocks:
          - type: paragraph
            body: >-
              The field splits along three axes: deployment maturity, generality of capability, and pricing
              accessibility. Unitree is dangerous because it pairs breadth and cost compression; H2 alone comes in far
              below TARS's indicative price. Figure is dangerous because Helix suggests a scalable AI layer that could
              generalize beyond today's specific task demos. 1X offers a consumer-facing price anchor that changes
              market expectations even if its product path differs from TARS's. UBTECH has public-company weight, while
              Agility has the best publicly disclosed deployment proof and enterprise selling motion. Apptronik frames
              Apollo around broad labor-substitution economics, and Boston Dynamics sets the hardest benchmark on
              mobile-robot sophistication and enterprise tooling. From a buyer perspective, the most relevant criteria
              are deployment readiness, dexterity, price accessibility, workflow specificity, and systems
              integration—not valuation headlines or robot-demo virality.
