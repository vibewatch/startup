  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Target Verticals
        blocks:
          - type: paragraph
            body: >
              TARS Robotics has publicly identified wire harness assembly and flexible-material precision manufacturing
              as its primary commercial targets. The company's CEO Chen Yilun stated in a public interview that wire
              harness assembly was deliberately chosen as the first go-to-market vertical because more than one million
              workers in China still perform this task manually, making it the deepest and most urgent
              labor-substitution opportunity for dexterous humanoid robots. Secondary verticals demonstrated publicly
              include embroidery—first shown in the August 2025 capability demo—and light intralogistics operations
              addressed by the A-Series wheeled robot. TARS's T-Series bipedal robot targets precision workcell tasks
              requiring hand dexterity, while the A-Series addresses intralogistics and warehouse transport.


              The primary payer profile for near-term deployments is an industrial automation procurement manager inside
              a mid-to-large Chinese or European manufacturing facility. Strategic corporate investors including Meituan
              (delivery and logistics platform) and Shoucheng Holdings (logistics infrastructure, HKEX: 0697) represent
              the most concrete potential anchor customer categories disclosed. No consumer-facing or healthcare
              verticals have been announced. Independent product directories estimate the T-Series list price at
              approximately $95,000 per unit; no official TARS pricing has been published.


              The global wire harness assembly automation market was valued at $3.8 billion in 2025 and is projected to
              reach $7.6 billion by 2034 at an 8.1% CAGR, with Asia-Pacific accounting for approximately 41% of
              revenue—a direct analog to TARS's target geography. This market-level data validates the size of the
              opportunity but does not confirm any TARS deployment contracts. China controls roughly 36% of global
              robotics investment and has crossed an industrial threshold of approximately 470 robots per 10,000
              manufacturing workers by end-2024, three times the global average, creating a structurally favorable
              domestic customer environment for humanoid robots targeting repetitive industrial tasks.
