        title: Milestones, external proof, and unresolved risks
        blocks:
          - type: paragraph
            body: >-
              Public milestones show real technical ambition, but they do not yet eliminate commercialization risk. TARS
              has demonstrated embroidery, highlighted wire-harness manipulation, taken AWE 3.0 and DexHand to ICRA
              2026, and reportedly generated purchase interest for its A1 wheeled robot at LogiMAT. The policy
              environment also improved in parallel, with China publishing a national humanoid standard system and
              Shanghai expanding embodied-intelligence incentives. These are useful signals because TARS is targeting
              industrial workflows that fit both national and city-level priorities. Still, the strongest adverse
              evidence remains compelling: independent skeptical coverage notes that funding velocity can outpace
              customer proof, and public materials still do not name live customers or disclose revenue. The
              inaccessible AIWiki page is a minor issue, but the bigger diligence gap is repeatable deployment evidence.
              The company therefore looks promising as a technically elite, capital-rich early platform, yet still needs
              customer, valuation, and commercialization proof before its financing record can be treated as validated
