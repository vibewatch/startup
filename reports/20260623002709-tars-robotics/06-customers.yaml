  - id: retention-durability-and-gaps
    title: Retention, Durability, and Data Gaps
    body: |
      Because TARS has not entered commercial production, no retention metrics—net revenue retention, gross renewal rates, repeat order data, or customer satisfaction scores—exist in the public record. This section characterizes expected retention dynamics based on analogous industrial automation economics and the nature of TARS's target workflows. Wire harness assembly is a repetitive, high-volume, multi-shift task; once a robot platform is validated for a production cell, the economic and operational switching cost is high. Reconfiguring a precision workcell involves retraining, re-certification, and integration overhead, which supports the hypothesis that successful early deployments would show strong retention and repeat purchase behavior.

      MachineBrief's skeptical coverage of the August 2025 funding noted that "many are skeptical about the flashy funding rounds translating into tangible, on-the-ground change" and characterized parts of the sector as "riding the AI hype wave." This adverse signal represents the clearest available public market skepticism about TARS and comparable pre-revenue humanoid robotics startups converting investor interest into enterprise customer adoption. The risk is not hypothetical: the gap between public capability demonstrations and signed enterprise commitments is exactly where many hardware robotics companies stall, even when the technical demonstrations are genuine.

      Comparable deployments in the global market—Agility Robotics' Digit at Amazon and GXO Logistics, and Figure AI robots at BMW—illustrate that enterprise-scale customers typically begin with controlled small pilots before committing to rollout. TARS would face the same dynamic. The estimated $95,000 unit price implies that even a modest 10-unit pilot engagement would require approximately $950,000 in capital commitment from a customer, a meaningful adoption hurdle for pre-production hardware that lacks a field reliability track record. High switching costs post-adoption are a retention advantage, but only if the initial adoption hurdle is cleared.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
