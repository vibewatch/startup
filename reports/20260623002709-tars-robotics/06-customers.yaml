  - id: adoption-trajectory-and-stage
    title: Adoption Trajectory and Evidence Stage
    body: |
      TARS is unambiguously pre-revenue as of June 2026. No production deployments, signed customer contracts, or revenue figures have been disclosed in any public source, investor filing, or third-party analysis reviewed for this chapter. The company's adoption evidence sits almost entirely at the capability demonstration and purchase-signal stages of the customer adoption funnel. The key public proof points are: the August 2025 embroidery demonstration establishing flexible manipulation; the ICRA 2026 showcase with the DexHand performing live wire harness insertion with real-time error correction; the Guinness World Record for sub-millimeter wire harness assembly; and the LogiMAT 2026 A1 debut in Stuttgart where trade publication Gasgoo reported "clear purchase intentions from clients across various industries and European countries."

      The Guinness achievement is a controlled-benchmark capability proof, not a commercial deployment—it demonstrates the robot's manipulation accuracy under managed conditions. The LogiMAT purchase intention claim is sourced from Gasgoo's Seeds Discovery column, a company-profile and partnership channel rather than independent journalism; the claim should be treated as company-associated and unconfirmed. No independent European buyer has been named, quoted, or independently verified. JD.com's mention in TARS funding coverage reflects JD's own declared robotics ambitions—a publicly disclosed plan to procure 3 million robots over five years—rather than a confirmed TARS supplier relationship.

      Overall, TARS has executed a credible public proof-of-concept roadmap—embroidery to wire harness benchmark to international trade show debut—consistent with a pre-commercial customer development process. Evidence freshness is adequate: the most recent customer-relevant signal (LogiMAT) dates to May 2026, less than two months before this chapter's research date. Conversion of these signals into signed pilots or production revenue remains unverified by any source available to this chapter.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: named-customer-proof-and-purchase-signals
    title: Named Customer Proof and Purchase Signals
    body: |
      The most concrete named proof in TARS's public record is strategic investor evidence rather than direct customer evidence. Meituan's strategic investment arm co-led the Angel+ round ($122 million, July 2025) and participated in the Pre-A round ($455 million, April 2026). Shoucheng Holdings disclosed a strategic investment in TARS as part of the Pre-A round in a Hong Kong Stock Exchange filing (2026041600229). Both investors operate large logistics and delivery networks that would be natural early deployment sites for an intralogistics humanoid robot, but neither has announced a deployment contract, pilot agreement, or letter of intent with TARS.

      TARS has not published any named enterprise customer list, pilot partner announcement, or purchase order. The only public evidence of external interest from potential buyers is the Gasgoo LogiMAT report. For the embroidery and wire harness use cases, TARS has referenced the broader industrial labor market—embroidery employs hundreds of thousands and wire harness assembly employs more than one million workers in China—as its intended customer base, without naming any specific employer or manufacturing facility. The Finanzwire and Pressrelease Hub ICRA coverage confirm the wire harness demonstration's technical content but contain no customer references.

      JD Logistics' October 2025 announcement of a 5-year procurement plan for 3 million robots and 1 million autonomous vehicles shows the scale of intent among Chinese logistics platforms. JD's Wolf Pack robot was already deployed across 20+ Chinese provinces and 10+ countries as of late 2025, establishing JD as an active industrial robot buyer at scale—even though no TARS-specific deal has been disclosed. The June 2026 Smart Expo coverage shows JD Logistics and robot partners continuing to exhibit automation capability, suggesting an active procurement environment for the types of systems TARS offers.
    claimRefs:
