      - number: '8.3'
        title: 可比估值组与市场背景
        blocks:
          - type: paragraph
            body: >
              可比公司分四层：（1）已确认估值的私营龙头，如 Figure AI（2025 年 9 月确认 $39B Series C）和 Apptronik（确认
              $5.47B）；（2）中国和韩国公开市场基准——UBTECH（HKEX: 9880.HK，2026 年 6 月约 $6.85B）和 Rainbow Robotics（KOSDAQ: 277810，约
              $7.37B）——其市价反映战略合作溢价（Rainbow 的 Samsung）和本土政策顺风；（3）瞄准 IPO 的中国同行，包括 Unitree（STAR Market 目标约 $7B）和
              AgiBot（HKEX 目标约 $6.4B），二者商业化阶段更接近 TARS；（4）相邻 AI 自动化上市公司 Symbotic（$24.3B）和 Teradyne（$71.5B），展示了有真实收入的规模化 AI
              硬件自动化能达到的估值。


              最有参考价值的直接映射是 AgiBot。创始人来自 Huawei，AI-first，Pre-IPO，瞄准中国工业客户——AgiBot 几乎精准复刻 TARS 的画像。其 $6.4B IPO 目标意味着相对
              TARS 推断 $2.5B 区间约 2.5× 溢价，这与 AgiBot 更接近 IPO、披露牵引更多相一致。Agility Robotics（$2.12B）给出下限：它已有真实商业部署（Amazon
              物流）、聚焦用例和战略支持，估值却低于 TARS 的隐含进入价。要解释这道差距，只能靠 TARS 的全栈 AI 优势，以及中国工业市场规模带来的期权。Goldman Sachs 基准情形预测全球人形机器人市场到
              2035 年达到 $38B，支持强劲长期收入 TAM，但商业化时间仍未确认。IFR 2026 年 6 月数据确认，中国是全球最大机器人市场（截至 2024 年年安装量 295,000+，约为美国 10×），为
              TARS 初始客户提供天然本土部署基础。
