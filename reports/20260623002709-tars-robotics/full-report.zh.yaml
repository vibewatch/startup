            body: >
              MachineBrief 对 TARS $122M angel-plus 轮的报道明确质疑，公司商业实质是否足以支撑 headline
              融资规模。这种怀疑性框架在后续每次融资公告中反复出现并被放大，是熊市风险最简洁的公开表达：世界级叙事背后，商业基础尚未被验证。在披露收入和客户之前，这一反向信号应作为 TARS 融资和技术成就的合适制衡。
            calloutType: risk
            claimRefs:
