  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              核心市场问题并不是抽象意义上机器人是不是大品类，而是哪一块具身智能真正与 TARS
              有关。相关支出池，是那些买方愿意为灵巧、可适应、人形或邻近形态具身系统付费的流程，因为固定自动化、人工或窄场景机器人都不够好。这让市场比「所有自动化」更窄，但也更适合投资，因为它能落到具体部署经济性。公开估算差异很大。Robozaps
              认为 2025 年人形机器人市场约 $2.9 billion；Goldman 的基准情形是到 2035 年达 $38 billion，若成本、设计和接受度障碍下降，上行情形可达 $154 billion。WEF
              引用的外部路径更快，到 2032 年达 $66 billion。这些数字方向上有用，但差距本身就是警告：市场规模仍由情景驱动，估值不能只押一个醒目的 TAM 标题。
