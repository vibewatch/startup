      - number: '6.2'
        title: 采用轨迹与证据阶段
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，TARS
              明确处于收入前阶段。本章审阅的任何公开来源、投资人文件或第三方分析，均未披露生产部署、已签客户合同或收入数字。公司的采用证据几乎全部停留在客户采用漏斗中的能力演示和采购信号阶段。关键公开证明点包括：2025 年
              8 月确立柔性操作能力的刺绣演示；ICRA 2026 上 DexHand 现场完成线束插入并实时纠错；亚毫米级线束装配 Guinness World Record；以及 2026 年在 Stuttgart
              LogiMAT 的 A1 首秀，贸易媒体 Gasgoo 报道称其获得「来自欧洲多个行业和国家客户的明确采购意向」。


              Guinness 成就是受控基准能力证明，不是商业部署；它展示的是机器人在可控条件下的操作精度。LogiMAT 采购意向说法来自 Gasgoo 的 Seeds Discovery
              栏目，这是公司画像和合作渠道，而非独立新闻；该说法应视为与公司相关、尚未确认。没有任何独立欧洲买方被具名、引用或独立验证。TARS 融资报道中提到 JD.com，反映的是 JD
              自身公开宣布的机器人雄心——五年采购 300 万台机器人——而不是已确认的 TARS 供应商关系。


              总体看，TARS 已执行一条可信的公开概念验证路线图——从刺绣到线束基准，再到国际展会首秀——符合收入前客户开发流程。证据新鲜度足够：最近的客户相关信号（LogiMAT）发生在 2026 年 5
              月，距离本章研究日期不到两个月。将这些信号转化为已签试点或生产收入，仍未被本章可用任何来源验证。
