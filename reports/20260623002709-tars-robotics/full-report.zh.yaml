      - number: '3.4'
        title: 护城河、风险与竞争耐久性
        blocks:
          - type: paragraph
            body: >-
              核心护城河问题是，在市场围绕更便宜、更通用的系统商品化之前，TARS
              的灵巧性利基能否守住。今天，低成本进入者已经在压缩人形机器人价格预期，多家厂商也围绕相同宽泛流程中的弹性劳动替代搭建叙事。分销能力同样关键。拥有具名伙伴、认证或数百客户的公司，能比主要展示技术进展的创业公司更快把企业谨慎转化为采购动能。切换成本真实存在，但还不像软件那样形成锁定；成本来自安全审批、集成工作量、流程再设计和操作员培训。这意味着试点阶段多供应商并行是可能的，买方也可以把人形机器人与人工或固定自动化对比，而不是快速押注单一厂商。主要反向结论很直接：如果
              TARS 不能很快证明真实部署牵引力，它的技术利基可能被一个更便宜、更喧闹、更拥挤的市场吞没。换句话说，即使客户采用仍然渐进，竞争时钟也在加速；在市场叙事被更便宜的通才标准化之前，TARS 必须证明执行力。
