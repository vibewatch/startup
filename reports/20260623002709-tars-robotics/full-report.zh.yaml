  - id: FV004
    title: 投资 KPI 评分卡——TARS Robotics 投委会看板
    type: kpi
    layout: wide
    summary: |
      仅使用公开证据，对截至 2026 年 6 月 TARS Robotics 的九项投资维度给出可供投委会使用的评分。
    data:
      items:
        - label: 市场机会
          value: 'Goldman Sachs $38B by 2035; China #1 global robot market (54% share)'
          status: strong
        - label: 技术验证
          value: VLTA + Guinness record + AWE 3.0 + DexHand; credible but pre-commercial
          status: conditional
        - label: 商业验证
          value: Zero revenue; no named customers; LogiMAT purchase intents only
          status: adverse
        - label: 团队质量
          value: Ex-Huawei CTO + ex-Baidu IDG president; top-5 founding team in Chinese embodied AI
          status: strong
        - label: 竞争护城河
          value: Full-stack AI differentiation; no confirmed patents; AgiBot and Figure closing gap
          status: conditional
        - label: 资金与续航期
          value: $697M raised; 2–3yr estimated runway; no burn or cash disclosed
          status: neutral
        - label: 估值纪律
          value: Implied $2.0–3.0B; stretched vs. Agility ($2.12B commercial) but defensible vs. AgiBot ($6.4B targeted)
          status: demanding
        - label: 地缘政治风险
          value: Material; US export controls, Taiwan supply chain, EU AI Act all unresolved
          status: adverse
        - label: 证据质量
          value: High on capital/team/tech; low on commercial/financial; medium overall
          status: conditional
    claimRefs:
