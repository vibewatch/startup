      - number: '7.3'
        title: 财务与资本风险
        blocks:
          - type: paragraph
            body: >
              TARS 的财务风险主要由三组结构性张力主导：零披露收入对应巨额资本需求；定价点面临强烈下行竞争；依赖国资引入政治风险。

              资本密集度：TARS 累计融资 $697M（天使轮 $242M，Pre-A $455M），跻身全球融资最多的营收前机器人公司之列。但人形机器人开发极其烧钱。Goldman Sachs 预测全球机器人市场到
              2035 年也只有 $38B，时间表很长，需要持续投资。KPMG 2026 年 Q1 Venture Pulse 显示，全球 VC
              资金越来越集中到已被验证、能产生收入的公司；这意味着没有商业合同的后期融资会遇到逆风。如果 TARS 到 2027 年中仍未拿下有名称的企业客户，Series A 就只能靠愿景而不是业绩来融资。

              定价风险：TARS A1 标价约 $95,000/台，是 Unitree G1 $16,000 的 5.9 倍。Unitree 声称自 2020 年起四足机器人业务已盈利，拥有 TARS
              难以匹配的结构性成本基础。如果通用人形机器人的硬件层继续商品化（Unitree R1 售价 $4,900，Figure 目标约 $20,000），TARS 的溢价只有在其精密 AI
              软件栈可被证明相较雇佣人工线束装配能降低总拥有成本时才可持续。MachineBrief 分析质疑，当时只有原型机的 TARS 估值 $122M 天使轮是否合理；若商业里程碑未兑现，估值重置风险会被放大。

              国资依赖：TARS 部分资本来自国资相关主体。上海政府对试点项目最高 2,000
              万元人民币补贴、工信部支持项目，以及与中国「十五五」规划方向对齐，共同构成一个依赖政策的收入环境。如果中国工业政策优先级发生变化——例如将人形机器人开发国有化，或转向国防机器人——TARS
              可能失去国资共同投资和试点部署机会。若没有多元化国际收入，这种依赖很难对冲；而国际收入本身又受监管风险阻挡。
