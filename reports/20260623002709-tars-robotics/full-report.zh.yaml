      - number: '7.5'
        title: 缓释策略与否决标准
        blocks:
          - type: paragraph
            body: >
              投资 TARS 若要有效管控风险，需要持续监测早期预警触发器，并预先定义投资论断失效事件。部分风险存在缓释手段，但仍不成熟或未经确认；投资人应把以下事项视为尽调义务，而不是已解决问题。

              监管风险方面，TARS 可在先进海外芯片变得不可用之前，先验证国内 AI 算力（推理用 Huawei Ascend 级芯片、训练用国产 DRAM），以部分缓释 BIS
              出口管制风险。工信部标准合规作为先发者是可管理的；TARS 若通过行业组织会员身份参与 HEIS 流程，可提前看到规范变化。欧盟 AI 法案合规方面，如果 TARS
              未来瞄准欧洲客户，尽早与公告机构接触，对制造场景下的 A1 做合格评定，可降低上市时间风险。

              运营风险方面，供应链多元化（认证两家或更多执行器和谐波减速器供应商）以及库存缓冲，都是 TARS 在 Series A 前应落实的标准缓释措施。电池认证（IEC 62133-2）和符合 ISO 10218
              的安全系统设计，应成为任何客户试点的前置条件。扩大 SenseHub 数据采集范围，覆盖多样化工厂环境，可部分解决 sim-to-real 缺口；但这需要时间，也需要客户开放现场。

              财务风险方面，在下一轮融资前至少拿下两份有名称的企业试点合同，并包含明确采购订单语言（而不只是 MOU），将显著降低资本故事风险。通过分阶段硬件开发管理烧钱速度——优先推进 DexHand 软件和 AWE
              模型，而不是完整 A1 量产单元——可能把 runway 延长 12–18 个月。

              否决标准是具体、可衡量、应触发减持考虑的事件：（1）Chen Yilun 在 24 个月内离职；（2）TARS 或其关键芯片供应商被加入 BIS Entity List；（3）没有已承诺新融资且现金 runway
              低于 12 个月；（4）连续三次企业试点失败，机器人被替换而非采购；（5）Unitree G1 在线束任务中实现低于 5mm 的插入精度，削弱 TARS 的差异化主张。每个触发器都应立即启动重新评估。
