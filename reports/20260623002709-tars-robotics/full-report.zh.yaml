        - Goldman Sachs 预计到 2035 年全球人形机器人市场达到 $38B；IFR 确认中国占全球机器人装机量的 54%
        - 市场预测依赖尚未验证的商业化时间表；TAM 在进入成本竞争前，可能无法转化为可服务收入
        - 已确认的大型企业部署合同，并披露收入 run-rate
      - - 技术差异化
        - VLTA 架构 + Guinness 纪录线束装配 + AWE 3.0 + DexHand 2026，构成可信的全栈护城河
        - AgiBot 和 Figure AI 也在打造通用世界模型；尚未看到已确认的持久 IP 护城河或已提交专利
        - 同行评审基准，或独家数据集授权协议；已提交 CNIPA/USPTO 专利
      - - 团队履历
        - CEO Chen Yilun（前 Huawei CTO 自动驾驶）和董事长 Li Zhenyu（前 Baidu IDG 总裁）拥有中国最深的相关网络
        - 自动驾驶履历不能一一映射到机器人商业化；公开信息看不到过往硬件规模化经验
        - 创始团队端到端管理的首个商业部署
      - - 客户信号
        - LogiMAT 2026 来自欧洲客户的购买意向；JD.com 战略入股带来潜在锚定客户
        - 截至 2026 年 6 月，没有已确认合同、具名客户或复购订单
        - 已签 LOI 或部署合同，并披露收入条款
      - - 资本可得性
        - $697M 资金弹药，叠加国资和 Tier-1 VC 共同投资，意味着 2–3 年 runway
        - 未披露 burn rate、现金余额或 runway；制造爬坡可能比预期更快消耗资本
        - 披露月度 burn 和已确认账面现金；清晰的股权结构和优先权安排
      - - 地缘政治位置
        - 北京和上海国资参与，提供国内政策保护
        - 美国出口管制、BIS Entity List 风险、台湾执行器供应链以及 EU AI Act 合规均未解决
        - 明确的 BIS/OFAC 法律意见；经第三方审计的 EU AI Act 合规路线图
