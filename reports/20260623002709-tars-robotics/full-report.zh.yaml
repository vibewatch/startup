      - number: '5.4'
        title: SenseHub 数据引擎与 WIYH 数据集
        blocks:
          - type: paragraph
            body: >-
              SenseHub 是 TARS 以人为中心的数据采集平台，处在 DATA-AI-PHYSICS 技术循环的数据层。SenseHub
              不依赖合成仿真或第三方数据集，而是通过人类遥操作和第一视角示范采集丰富真实运营数据，把人体动作直接映射进 AWE 训练管线。这个方法旨在从一开始就把真实物理变化嵌入训练分布，解决 sim-to-real
              缺口；对于线缆、织物和可变形组件等柔性材料的灵巧操作尤其重要，因为这些材料出了名地难以准确仿真。最终形成的数据集 WIYH（World-In-Your-Hands）已在 GitHub 的
              tars-robotics 组织下开源；公司和 InforCapital 将其描述为全球首个具身 VLTA（Vision-Language-Tactile-Action）多模态数据集。截至 2026 年 5
              月，WIYH 仓库有 125 个 GitHub 星标，使用 Python 实现。第二个开源仓库 RTR 托管 ICML 2026 论文代码，截至 2026 年 5 月有 18
              个星标。两个仓库共同构成公司当前面向公开开发者的信号足迹。开源策略能建立研究可信度并邀请外部验证，但相比成熟开源机器人平台，GitHub 活跃度仍然有限，这限制了现阶段围绕 TARS 工具的独立开发者社区。
