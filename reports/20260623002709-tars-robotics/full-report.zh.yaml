      - number: '6.4'
        title: 留存、耐久性与数据缺口
        blocks:
          - type: paragraph
            body: >
              TARS 尚未进入商业化生产，公开记录中没有任何留存指标：净收入留存、毛续约率、复购数据或客户满意度评分都缺位。本节只能借助相近的工业自动化经济学和 TARS
              目标工序的性质，刻画其预期留存动态。线束装配是重复、高量、多班次任务；机器人平台一旦在生产单元中通过验证，经济和运营层面的切换成本都很高。重构一个精密工作站，需要重新培训、重新认证并承担集成开销。因此，如果早期部署成功，TARS
              理应体现出较强留存和复购行为。


              MachineBrief 对 2025 年 8 月融资的怀疑性报道指出，「许多人怀疑这些耀眼融资轮能否转化为真实、落地的改变」，并称行业部分公司在「乘着 AI
              炒作浪潮」。这是目前公开市场上最清晰的反向信号：TARS
              以及类似的营收前人形机器人创业公司，能否把投资人兴趣转成企业客户采用，仍受质疑。风险并非假设。公开能力演示与签署企业订单之间的缺口，正是许多硬件机器人公司卡住的地方，即便技术演示本身真实。


              全球市场中的可比部署——Agility Robotics 的 Digit 进入 Amazon 和 GXO Logistics，Figure AI 机器人进入
              BMW——说明企业级客户通常先做受控小规模试点，再决定是否铺开。TARS 也会面对同样节奏。估算 $95,000 的单价意味着，即便只是 10 台的小型试点，客户也要投入约 $950,000
              资本；对于缺少现场可靠性记录的量产前硬件，这是一道不低的采用门槛。采用之后的高切换成本有利于留存，但前提是先跨过初始采用门槛。
