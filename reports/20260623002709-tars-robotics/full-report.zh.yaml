        title: 融资基础与披露边界
        blocks:
          - type: paragraph
            body: >-
              公开证据非常清楚地支持一件事：TARS 在极短时间内融到了异常多的资本。对一家 2025 年初成立的创业公司来说，时间线压缩得少见：$120 million 天使轮、$122 million 天使+轮，到
              2026 年 4 月完成 $455 million Pre-A 轮。大约 14 个月内，累计公开融资接近 $697
              million。投资人组合也重要，因为它同时包含创投、战略和国资资本。但强融资记录被薄弱运营披露抵消。已审阅的公开来源中，没有任何一处披露投后估值、收入、ARR、毛利率、烧钱速度、现金跑道或客户集中度。因此，本章可以记录融资历史和可能的财务含义，却无法像分析更透明的软件公司或上市硬件公司那样承销这门生意。
