  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: T-Series 与 A-Series 硬件平台
        blocks:
          - type: paragraph
            body: >-
              TARS 运营两条不同硬件线，服务互补的工业场景。T-Series 是完整双足人形机器人，身高 167 cm、体重 80 kg，围绕 35
              个自由度设计，采用带谐波齿轮传动的电动伺服电机驱动。这个设计选择为精密制造任务提供亚毫米级重复精度——穿针、布线、插接头——同时保留真实工厂环境所需的动态平衡能力。T-Series
              支持双足行走、爬楼梯、避障、跌倒后站起恢复和短距离移动。连接层通过 5G-A 接口实现低时延远程操作，并配有基于 Linux 的工业 OS，集成 ROS 和 Python API。独立目录引用的近似标价为
              $95,000，但 TARS 未发布官方价格。A-Series 是面向结构化物流和工厂地面部署的轮式工业机器人线。A1 变体于 2026 年在
              LogiMAT——领先的国际内部物流展会——完成海外首秀，展示通用运营能力，并据称从欧洲多个行业和国家的客户处获得有记录的采购兴趣。双足 T-Series 与轮式 A-Series 选项并行部署，让 TARS
              能在同一套全栈 AI 架构下覆盖不同自动化场景，降低从一个部署细分扩展到另一个细分的增量成本。两条产品线共享 AWE 模型和 SenseHub 数据栈，因此任一硬件形态都可调用同一套训练技能库。
