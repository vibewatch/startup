      - number: '8.4'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >
              三种情景框定可信结果分布。牛市情形假设 TARS 在 2026 年 Q4 前签下首个大型企业合同，2027 年部署 300–500 台，并凭借可测量商业牵引以 $6B 或更高估值完成 Series
              A。在这条路径下，2028–2030 年以 $10–15B IPO，可在 $2.5B 进入价上产生 4–6× 回报。催化剂是真实的：JD.com 作为早期锚点、LogiMAT 欧洲采购意向信号、全栈 AI
              优势。风险在于，工业自动化从意向转为合同通常需要 12–24 个月。


              基准情形假设 2027 年 H2 有一到两个小批量试点部署，2027 年末以 $3–4B 完成 Series A，并继续达成技术里程碑，但还未达到证明单位经济性的出货量。以 $2.5B 进入价计算，3–4
              年持有期的隐含回报为 1.2–1.6×，低于典型 VC 回报门槛，但符合 track record 正在建立的状态。关键摆动变量是 JD.com 关系能否转化为部署合同。


              熊市情形假设到 2027 年底仍无确认收入，AgiBot 和 Figure AI 锁定关键中国工业客户形成竞争挤压，美国出口管制收紧带来地缘政治逆风，并以 $1.5–2B 完成 down-round Series
              A。以 $2.5B 进入价计算，该情景意味着 20–40% 亏损。概率信号为 30%，偏高；因为在这个估值水平下，零收入、无客户提供的缓冲很少，一旦资本市场转离营收前硬件，TARS
              会很脆弱。MachineBrief 对 TARS 融资叙事与实际牵引之间缺口的怀疑，是这一熊市风险的公开表达。
