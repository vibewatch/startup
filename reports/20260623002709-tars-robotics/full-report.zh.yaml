      - number: '3.3'
        title: TARS 的强项与短板
        blocks:
          - type: paragraph
            body: >-
              当比较重点落在高精度灵巧性上，TARS 看起来最强。公开评测把它放在线束、刺绣等任务周围，这些任务需要比许多通用人形叙事更稳定的精细运动控制。对某些工厂流程而言，这种专精可能让 TARS
              比偏消费者的同行更相关。但如果市场转向在大量任务上「足够好」、且售价低得多的通才系统，同样的专精也会变成弱点。TARS 在公开商业证明上也落后于最成熟的已披露竞争者。Agility
              公开伙伴并描述部署阶段，Boston 勾勒完整企业栈，UBTECH 则受益于上市公司可信度。相比之下，TARS
              仍高度依赖产品演示、融资势能和技术主张，而不是具名客户证据。这让比较承销的重点，不再是谁的机器人最吸睛，而是谁能率先把窄优势转成可重复部署。
