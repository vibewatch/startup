      - number: '2.3'
        title: 政策与结构性驱动
        blocks:
          - type: paragraph
            body: >-
              在具身 AI 里，政策不是边缘变量；它同时塑造供给和需求。SCIO
              对国家人形机器人标准框架的概述显示，中国正在把一套覆盖基础部件、整机、应用、安全与伦理的体系正式化。上海走得更远，用试点成本补贴、销售激励、算力和数据支持来托举本地集群。这些措施重要，因为早期采用资本开支高、集成重，运营风险也仍然存在。公开数据还显示，中国已经跨过规模阈值：超过
              140 家制造商、超过 330 款型号，以及 2025 年「量产元年」。实际含义是，TARS 这样的创业公司进入的是一个政策和供应链可能比纯软件公司更快放大赢家的市场。
