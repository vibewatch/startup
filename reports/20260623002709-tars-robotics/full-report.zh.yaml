      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议——继续研究，估值立场偏紧
            body: >
              TARS 是中国技术可信度最高的商业化前人形机器人公司之一，拥有精英团队和 $697M 资金弹药。密切跟踪的理由很强。按未披露估值投入资本、且没有收入或客户证据，理由很弱。重点观察首份已签商业合同、披露的
              Series A 估值，以及 burn-rate 透明度。若这三个催化剂均为正面，建议可上调为买入。
            calloutType: recommendation
