      - number: '1.4'
        title: 里程碑、外部证明与未解风险
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示 TARS 技术野心真实，但尚不能消除商业化风险。公司展示过刺绣，突出线束操作，把 AWE 3.0 和 DexHand 带到 ICRA 2026，并据称在 LogiMAT 为 A1
              轮式机器人获得采购兴趣。政策环境也同步改善：中国发布国家人形机器人标准体系，上海扩大具身智能激励。这些都是有用信号，因为 TARS
              瞄准的工业流程同时契合国家和城市层面的优先方向。可是，最强的反向证据仍有分量：独立怀疑性报道指出，融资速度可能跑在客户证明前面；公开材料至今没有列出活跃客户或披露收入。AIWiki
              页面无法访问只是小问题，更大的尽调缺口是可重复部署证据。因此，TARS 看起来像一个技术班底顶尖、资本充足的早期平台，但在把融资记录视为已验证的市场牵引力之前，仍需补上客户、估值和商业化证明。
