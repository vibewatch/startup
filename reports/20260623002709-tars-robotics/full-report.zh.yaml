      - number: '5.3'
        title: AWE 3.0 基础模型与 VLTA 架构
        blocks:
          - type: paragraph
            body: >-
              AWE（AI World Engine）是 TARS 的具身 AI 基础模型，目前版本为 3.0，也是公司全栈论点的分析核心。传统 Vision-Language-Action
              架构通常把视觉和语言输入直接映射到离散动作 token；AWE 则围绕潜空间世界模型方法构建：模型维护一份压缩的环境与任务状态内部表征，从而生成更高频的连续动作，并在真实扰动下实现更稳定的操作。这个设计对应
              RTR 研究论文——「Learning High-Frequency Continuous Action Chunks in Latent Space」——该论文被 ICML 2026
              接收，为核心技术架构提供了外部同行验证。VLTA（Vision-Language-Tactile-Action）多模态设计把机身和指尖摄像头的视觉流、语言任务描述、DexHand
              弹性体传感器的触觉数据，以及连续动作输出整合进统一的学习表征。AWE 3.0 使用 SenseHub 采集的大量人类第一视角数据训练；TARS 称，这能减少任务抖动，并提高从新颖摄像角度执行任务的成功率。在
              ICRA 2026 上，AWE 3.0 驱动多步骤自主背包打包，以及线束插入中的实时纠错。丁文超博士发表 ICRA 2026 行业主题演讲「General Physical Intelligence」，展示
              TARS 从学术研究到工业规模部署的全栈技术路线图。独立观察者注意到，AWE 的世界模型方法不同于行业其他地方占主导的 VLA 趋势；这让它看起来更有泛化能力，但大规模实战检验也更少。
