  - id: TV005
    title: 投资假设破裂与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 到 2027 年底仍没有具名客户
        - 成立 30 个月后，已确认付费客户为 0
        - 没有证据支撑的商业化叙事坍塌；资本市场溢价蒸发
        - 重新评估为回避；没有商业证明，牛市情景不再成立
      - - 被加入 BIS Entity List
        - TARS、关键供应商或关键算力提供方被加入美国 Bureau of Industry and Security Entity List
        - 海外部署受阻；算力获取受损；出口管制合规成本飙升
        - 立即组合复盘；大概率下调至回避；可能造成资本减值
      - - Series A 下轮融资
        - Series A 关闭时 post-money 估值低于 $2B
        - 投资人对商业化时间表的信心恶化；burn 可能不可持续
        - 降低持仓或避免跟投；此前入场按账面标记亏损 20–40%
      - - CEO 或董事长离职
        - Chen Yilun 或 Li Zhenyu 在未来 24 个月内退出
        - 投资人信任锚定在创始团队；战略关系和政府关系面临风险
        - 重新评估假设锚点；继任计划清晰前暂停任何跟投
      - - 竞争对手锁定锚定客户
        - AgiBot、Figure AI 或 Unitree 签下 TARS 正在争取的大型中国工业客户
        - 目标细分市场的先发优势丧失；TARS 被迫进入二级市场
        - 持续监测；TARS 在其他细分市场仍可能成立，但目标回报被压缩
      - - 人形机器人 AI 出口管制升级
        - 新美国行政令或 BIS 规则限制向中国出口双足机器人 AI 模型
        - 技术转移限制削弱海外合作和数据收集
        - 评估敞口；如果 TARS 国际战略依赖美国技术准入，则退出或对冲
    notes: |
      触发项基于公开可监测事件。它们不是内部 KPI 阈值，应在每个季度监测周期复核。
    claimRefs:
      - CV028
      - CV037
      - CV040
      - CV042
      - CV044
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Post-money 估值（阻断项）
        - 三轮融资均未披露轮次估值
        - 无法确认入场纪律；无法评估稀释或优先权结构
        - 直接向管理层索取；任何共同投资前要求审查 cap table
      - - 收入和客户合同（阻断项）
        - 未披露收入；没有客户名称；公开渠道没有已签 LOI 或合同
        - 无法建模回本周期、增长率或商业证明；牛市情景无法验证
        - 客户背调电话；NDA 下提供已签 LOI 或合同摘要；试点现场走访
      - - 月度 burn 和现金头寸（阻断项）
        - 未披露账面现金、月度净 burn 和 runway
        - 无法计算稀释时间线，或评估生产放量所需资本是否充足
        - CFO 简报；经审计月度管理账；从 burn 到下一里程碑的桥接
      - - IP 和专利组合（重要）
        - 尚未公开确认 CNIPA、USPTO 或 EPO 申请专利
        - 可持续护城河要靠受保护 IP；开源数据集不是耐久壁垒
        - 专利局检索（CNIPA/USPTO/EPO）；IP 律师审查；WIYH 数据集许可条款
      - - 出口管制合规姿态（重大）
        - 未披露 BIS/OFAC 审查或出口管制风险法律意见
        - 地缘政治逆风可能卡住海外扩张和美国投资者参与
        - 内部或外部律师审查 BIS EAR、OFAC 和 CFIUS 风险敞口
      - - 制造计划与 COGS（重大）
        - 只有概念性制造路线图；未公开供应商 BOM 或单台成本估算
        - 无法评估单位经济、毛利潜力或生产风险
        - 现场走访；列明一级供应商的原型 BOM；装配 COGS 拆分
      - - 股权结构和优先权栈（重大）
        - 未披露股权结构；国资参与带来不寻常的优先权动态
        - 清算优先权顺序和国资参与带来的稀释仍不清楚
        - 完整股权结构及优先权安排；清算瀑布分析
      - - Series A 时间表和条款（次要）
        - 未披露 Series A 计划或时间表
        - 下一轮稀释事件和估值上调不确定，会影响持有期规划
        - 与管理层讨论融资路线图；确认 Series A 目标价格区间
    notes: |
      优先级（阻断 / 重大 / 次要）反映进入不同投资动作层级前所需的最低证据。若估值未披露，任何共同投资都必须先解决阻断项。
    claimRefs:
      - CV002
      - CV028
      - CV029
      - CV030
      - CV043
      - CV044
