      - number: '2.4'
        title: 约束与承销含义
        blocks:
          - type: paragraph
            body: >-
              看多市场叙事最大的反力，是最难的采用问题仍未解决。Goldman 强调零部件瓶颈、磨削产能限制，以及操作和交互软件成熟度不足。WEF
              叠加了另一层风险：隐私、岗位替代、可靠性，以及明确安全护栏的必要性。即使是最有希望的厂商，商业化形态也差异很大：有的强调生产部署，有的宣传居家帮助原型，还有的停留在技术基准，尚未广泛商业可得。对投资人来说，广阔市场增长并不会自动转化为每个进入者都能货币化的需求。更有纪律的承销方法，是把
              TAM 拆成买方流程问题：哪个预算负责人签字、试点门槛是什么、需要多少集成、一个窄成功案例能多快扩张。TARS
              受益于强工业顺风，但其真实市场应从客户流程转化向外测算，而不是从自上而下的机器人热度向内推。投资人还应区分原型兴奋与采购现实：即便市场在改善，如果可靠性、安全认证和集成劳动力不能同步改善，瓶颈仍可能持续多年。今天如此。
