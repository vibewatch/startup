      - number: '1.3'
        title: 融资轨迹与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              TARS 从成立到跻身中国融资最重的具身 AI 创业公司之一，只用了大约 14 个月。融资序列压缩得异常：2025 年 3 月 $120 million 天使轮，2025 年 7 月 $122 million
              天使+轮，2026 年 4 月 $455 million Pre-A 轮。由此形成接近 $697 million
              的公开累计融资，并引入创投机构、战略平台和国资基金的组合。这个结构说明，投资人并不只是押注一个有趣的演示团队；他们在资助一个被认为可能影响工业人形机器人、物流和上游具身模型基础设施的平台。即便如此，公开记录没有揭示公司估值、老股转让、债务额度或股权结构控制动态。数据库来源相对最新轮融资报道也显得有些滞后。结果是资本信号很强，但价格和治理透明度不足；这在中国私营前沿
              AI 公司中常见，却仍会实质影响投资判断。
