  - id: FU004
    title: 按垂直场景划分的客户采用证据
    type: bar
    layout: standard
    summary: 统计 TARS 公开点名的各商业垂直场景中独立公开采用信号数量，显示线束是公司证据最充分的商业化切入重点。
    claimRefs:
      - CU001
      - CU011
      - CU014
    data:
      items:
