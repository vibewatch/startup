      - number: '8.5'
        title: 论断失效触发器、退出准备与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              TARS 还未准备好公开上市退出；通向 2028–2030 年 IPO
              的路径，至少依赖三项尚未证明的里程碑：签署商业合同并披露收入；单位经济性支持正贡献毛利；在出口管制和跨境数据治理上形成明确合规姿态。近期最现实的退出情景，是被中国工业集团战略收购，或由需要全栈 AI
              能力且能吸收地缘政治风险溢价的 Tier-1 汽车或物流玩家共同投资。


              论断失效触发器具体且可监测。如果 TARS 到 2027 年底（成立两年半后）仍没有有名称客户，缺乏证据的商业化叙事就会坍塌。如果公司或任何关键硬件供应商出现在美国 BIS Entity List
              上，海外部署和算力获取将受到实质削弱。Series A 定价低于 $2B，将说明投资人信心下滑速度快于技术路线图所能解释的程度。CEO Chen Yilun 或董事长 Li Zhenyu
              离开，会切断支撑其相对商业化阶段同行溢价的关键投资人关系和战略愿景。Table TV005 收录完整触发器集合。


              最终尽调（Table TV006）可分为三档优先级。阻断项——未披露投后估值、收入和已签客户合同、月度 burn rate——必须在任何按未披露价格共同投资前解决。实质项——IP 和专利组合、出口合规状态、制造
              COGS、cap table——是建模和 preference stack 分析所必需。次要项——Series A 时间线、科学顾问委员会深度——用于判断战略定位。能够进入 data room
              的投资人，应在任何资本承诺前优先处理阻断项。
            claimRefs:
