        title: 格局与分层
        blocks:
          - type: paragraph
            body: >-
              TARS 周围的竞争场域，不只是人形机器人创业公司清单。它包括直接工业同行、面向消费者的人形机器人、通用平台，以及人工、固定自动化、专用移动机器人等现状替代方案。相比许多高曝光名字，TARS
              处在更窄的楔子里：它试图靠灵巧性和精密工业操作取胜，而不是靠通用居家辅助或广泛品牌声量。这个差异重要，因为许多媒体比较把整个赛道压平成一场「人形机器人竞赛」，而真实买方评估的是不同工种、价格点和信任门槛。实际看，Figure
              和 1X 更适合作为长期 AI 或居家帮助可比对象；Agility、Apptronik、Boston Dynamics 以及部分中国工业同行，在运营上更接近。投资人在判断 TARS
              是否真正差异化、还是又一个昂贵原型前，应先切分赛道。
