companyProfile:
  summary: >-
    TARS Robotics（Trusted AI and Robotics Solution）由一支来自 Huawei、Baidu、DJI 和 Tsinghua University 的高管与科学家团队于 2025 年 2 月 5
    日在上海创立。短短 16 个月，公司完成三轮融资共 $697 million，刷新中国具身 AI 赛道融资速度纪录，并凭亚毫米级线束装配精度获得 Guinness World Record。TARS 打造全栈具身智能平台，覆盖
    AWE 3.0 基础模型、SenseHub 人体运动数据引擎、T-Series 双足人形机器人、A-Series 轮式工业机器人，以及 DexHand 21-DOF
    灵巧手。公司瞄准最难自动化的制造环节——线束装配、刺绣和精密柔性材料处理；今天仍有 100 万以上产业工人缺少可行自动化方案。
