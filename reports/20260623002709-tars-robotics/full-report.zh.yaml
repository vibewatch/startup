chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、所在地与经营边界
        blocks:
          - type: paragraph
            body: >-
              TARS Robotics 呈现出一种少见的状态：作为具身 AI 创业公司，它资本极其充足，但公开身份层仍在成形。独立报道交叉验证后，最稳的共同事实是：公司成立于 2025 年 2 月 5
              日，以上海为运营地，正在搭建一套连接数据采集、基础模型和机器人硬件的全栈体系。公司官网信息稀疏，因此多数可用于尽调的身份事实来自独立融资报道、访谈和产品发布，而不是成熟的企业披露页面。这个缺口很重要，因为估值、收入、具名客户、已确认办公版图等几项核心封面指标，均未在自有渠道披露。公开材料中唯一可见的矛盾是总部标注：多数来源把
              TARS 放在上海，一家独立目录则称其总部在北京。承销判断上，应把上海作为工作假设，因为融资报道反复提及上海，政策语境也支持这一点；但管理层尽调必须补齐这个差异。
