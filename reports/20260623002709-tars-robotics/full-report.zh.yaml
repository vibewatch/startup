      - number: '6.5'
        title: 扩张轨迹与集中度风险
        blocks:
          - type: paragraph
            body: >
              中国工业自动化市场既是 TARS 近期最大的机会，也是最重的集中度风险。中国每 10,000 名制造业工人约配备 470 台工业机器人，是全球平均水平的三倍，并贡献全球机器人投资约
              36%，因此构成极深的潜在工业客户池。TARS 采用北京—上海双总部，Pre-A 轮又有两地国资参与，这有助于接入与政府 2027 年 500 亿元具身智能产业目标挂钩的采购项目。借 LogiMAT 2026
              触达欧洲市场是真实进展，但仍很早；商业销售所需的 CE 认证和欧盟合规尚未公开确认。


              一旦部署落地，客户集中度风险会从潜在问题变成实质问题。如果 JD.com、Meituan 或某一家大型国资背景制造商占据早期合同大头，TARS
              收入将高度绑定单一交易对手。公司尚未公开说明如何缓释集中度风险。线束行业本身也在地域和行业上集中，主要位于亚洲汽车与消费电子供应链；若不切入新垂直，地域多元化空间有限。刺绣、精密装配和厂内物流拓宽了产品组合，但没有公开证据显示
              TARS 能同时在一个以上垂直拿到并行客户牵引。


              一辆纯电动车包含 1,500 到 3,000 根线，总长度超过 5 公里，为 TARS 在汽车供应链中的核心灵巧操作能力创造了紧迫且可放大的需求。Pandaily 2026 年 6 月 Smart Expo
              报道确认，中国物流机器人买方动能仍在延续；aparobot 分析也强化了中国在自动化竞赛中的结构优势。TARS
              的刺绣演示证明，其操作平台可延伸到线束之外的柔性材料处理；即便尚未公布纺织行业客户，这仍是跨垂直潜力的重要信号。整体看，TARS
              的扩张路径在地域和行业上都偏集中；商业合同启动后，早期客户多元化将成为关键风险管理优先项。
