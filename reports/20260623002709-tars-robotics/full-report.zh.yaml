      - number: '7.4'
        title: 竞争与执行风险
        blocks:
          - type: paragraph
            body: >
              TARS 进入的是一个拥挤市场：西方竞争对手资金更充足，中国本土也有数十家对手；各方都在争夺 TARS 瞄准的同一个精密制造差异化。

              西方竞争：Figure AI 完成 Series C，投后估值 $39B，背后有 Microsoft、OpenAI、Nvidia、Intel 和 Bezos 支持；其产品开发和 go-to-market
              资本基础约为 TARS 估算资本的 55 倍。Apptronik 融资超过 $935M，估值 $5.47B，有 Google 和制造合作伙伴 Jabil 支持，可以推进工业规模生产。Boston Dynamics
              Atlas 已部署在企业场景中，并有被验证的可靠性。这些公司可以获取完整前沿 AI 芯片栈（Nvidia Blackwell、HBM3e），而 BIS 出口管制会限制 TARS。Boston Dynamics
              Atlas 的 IP67 防护、-20°C 至 40°C 工作范围和 50kg 载荷，设定了工程标杆；TARS A1 必须在可靠性上追上，企业才会采用。

              中国本土竞争：2025 年，140 多家本土制造商发布 330 多款人形机器人。AgiBot 正瞄准 2026 年在香港以 $6.4B 估值 IPO。UBTECH 的 Walker S2
              已在大规模交付，尽管争议不少。Fourier Intelligence 估值 $1.1B，并获 SoftBank 支持，是既有玩家。上述任一公司都可能凭借更强制造基础设施，复制 TARS
              的精密装配定位。Unitree 已盈利的成本基础，也让它能在硬件层激进降价。

              执行风险：TARS 成立 16 个月，尚未披露量产客户合同。精密制造机器人的企业销售周期很长，从初始试点到生产采购订单通常需要 6–18
              个月，中间要完成安全验证、系统集成测试和流程文件。这意味着即便销售今天已经启动，TARS 也不太可能在 2026 年末或 2027 年初之前报告有意义收入。关键人集中度很高：CEO Chen Yilun
              是融资负责人、技术愿景核心和主要公开面孔；联合创始人 Ding Wenchao 是首席科学家，并发表 ICRA 2026 主题演讲；联合创始人 Li Zhenyu（前 Baidu Intelligent
              Driving）负责商业战略。未来 12 个月内任何创始成员离开，都可能引发投资人担忧和客户犹豫。TARS 尚未披露管理层继任计划。
