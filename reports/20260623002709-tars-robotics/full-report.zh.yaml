  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              TARS 处在三套主要监管体系的交汇处，每一套都带来实质投资风险。第一，美国商务部工业与安全局（BIS）出口管制最近一次于 2024 年 12
              月更新，对面向中国及全球范围内总部位于中国的实体的先进高带宽内存（HBM）芯片施加全国性限制。CSIS 分析确认，这些管制专门针对 AI 训练硬件，许可证政策采用「推定拒绝」，覆盖
              HBM2e/HBM3/HBM3e/HBM4 等层级；现代 AI 训练负载依赖这些芯片，TARS 开发 AWE 模型也需要同类能力。如果 TARS 的训练算力管线依赖海外 GPU 集群或 HBM
              驱动芯片，出口管制升级可能限制其 AI 模型进步，使其落后于仍可不受限制获取芯片的美国和欧洲竞争对手。

              第二，中国工信部于 2026 年 3 月发布首个面向人形机器人与具身 AI 的国家标准体系，由 HEIS（Humanoid Robots and Embodied Intelligence
              Standardization，人形机器人与具身智能标准化）牵头，120 多家机构参与制定。该标准体系覆盖安全与伦理、应用场景、「类脑智能计算」等六大领域。遵循这些标准可能让 TARS
              在中国获得先发优势，但也会带来持续认证和产品资质义务。TARS 尚未公开披露标准合规路线图或时间表。

              第三，SenseHub
              平台采集的数据——来自人类工人的制造车间运动数据——受中国《个人信息保护法》（PIPL）和《数据安全法》（DSL）约束。若这些数据跨境传输，例如送至中国境外云算力用于模型训练，需通过政府安全评估或完成标准合同备案。另一个维度是，TARS
              潜在进入欧盟市场会触发《欧盟 AI 法案》（Regulation 2024/1689）义务：用于高风险制造场景的工业 AI 系统，可能按附件 III
              被归为高风险，在欧盟辖区商业部署前需要完成合格评定、风险管理文件和人工监督协议。欧盟 AI 法案的高风险义务自 2026 年 8 月起生效。BIS 联网汽车规则（与机器人 AI
              限制相近）进一步显示，美国对中国自主系统进入本土的监管姿态正在收紧。
