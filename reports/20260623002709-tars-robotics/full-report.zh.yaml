        title: 买方、地域与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图已经分化成决策者不同的多个市场。工业和物流部署拥有最清晰的早期路径，因为环境更结构化，劳动替代逻辑成立，也更容易讲清 ROI。Agility
              明确把部署描述为评估—验证—运营序列，这与更广泛的企业自动化采购行为一致。与此同时，Figure 和 1X
              等厂商瞄准居家帮助和个人辅助场景；这些场景的预算、单位经济性、安全预期和社会接受度都明显不同。地域同样重要。凭借规模、政策和生态密度，中国正在成为最深的供给侧市场；美国仍贡献许多领先的软件型和资本支持型玩家。对
              TARS 来说，最相关的子市场是大市场内部的工业与精密操作楔子，而不是媒体最关注的消费级人形叙事。
