      - number: '5.2'
        title: DexHand 21-DOF 灵巧手系统
        blocks:
          - type: paragraph
            body: >-
              DexHand 是 TARS 的人手尺度灵巧末端执行器，2026 年 6 月在维也纳 ICRA 2026 首次全球亮相。DexHand 围绕 21 个自由度构建，其中包括符合人体解剖结构的拇指关节；它把抽象 AI
              能力与精密工业环境中的物理任务执行连接起来。触觉感知层在指尖和掌面分布弹性体传感器，让机器人在操作中实时分类纹理、硬度和滑度。指尖微型摄像头向 AWE 3.0
              模型提供高分辨率视觉反馈，使系统能感知传统腕部摄像头会错过的精细表面细节。驱动采用准直驱设计，使用三类电机和三类减速器；TARS 称，这种架构通过减少组件种类，支持灵巧手本身的自动化大规模制造。在 ICRA
              2026 上，DexHand 实时演示了全部 26
              个英文字母手势，并能流畅切换。现场演示还展示了多步骤背包打包和亚毫米级线束插入；当操作员故意在任务中途移动线缆端口时，系统会重新感知、重新规划，并在无人干预下完成操作。丁文超博士称 DexHand
              是「人类智能与机器人动作之间经过优化的接口」。简化后的电机—减速器架构旨在随产量扩大降低制造成本并提升良率，但公司尚未公布产量、良率或经验证的 BOM 成本。
