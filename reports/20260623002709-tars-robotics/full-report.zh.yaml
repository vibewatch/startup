  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与目标垂直
        blocks:
          - type: paragraph
            body: >
              TARS Robotics 已公开把线束装配和柔性材料精密制造列为主要商业目标。公司 CEO 陈亦伦在公开访谈中表示，线束装配被有意选为首个市场进入垂直，是因为中国仍有超过 100
              万工人手工完成该任务，这构成灵巧人形机器人最深、最紧迫的劳动替代机会。公开展示过的次级垂直包括刺绣——首次出现于 2025 年 8 月能力演示——以及由 A-Series
              轮式机器人覆盖的轻型内部物流作业。TARS 的 T-Series 双足机器人瞄准需要手部灵巧性的精密工位任务，A-Series 则覆盖内部物流和仓储运输。


              近期部署的主要付款人画像，是中大型中国或欧洲制造工厂内部的工业自动化采购经理。包括 Meituan（配送和物流平台）与 Shoucheng Holdings（物流基础设施，HKEX:
              0697）在内的战略企业投资方，是已披露的最具体潜在锚定客户类别。公司尚未宣布面向消费者或医疗健康垂直。独立产品目录估算 T-Series 标价约为每台 $95,000；TARS 未发布官方定价。


              全球线束装配自动化市场 2025 年价值 $3.8 billion，预计到 2034 年达到 $7.6 billion，CAGR 为 8.1%；亚太贡献约 41% 收入，直接对应 TARS
              的目标地域。这个市场层面数据验证了机会规模，但不能确认任何 TARS 部署合同。中国约控制全球机器人投资的 36%，到 2024 年底已跨过每 10,000 名制造业工人约 470
              台机器人的工业阈值，是全球平均水平的三倍；这为瞄准重复工业任务的人形机器人创造了结构性有利的国内客户环境。
