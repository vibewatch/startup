      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              TARS 的运营风险由三件事定义：供应链脆弱、量产制造尚未被验证，以及可靠工业部署存在技术门槛。供应侧，A1 机器人使用电伺服执行器和谐波减速器，均来自第三方供应商；TARS
              尚未公开披露供应商身份。关键运动部件依赖单一来源或有限来源，是原型阶段机器人的常见做法；但公司一旦承诺量产，这会变成关键脆弱点。任何扰动——从供应商破产到精密机械部件贸易限制——都会让规模化停摆。

              AI 芯片获取也是并行脆弱点。大规模训练 AWE 3.0 模型需要高带宽内存算力集群。2024 年 12 月 BIS 管制以全国范围限制 HBM2e 及更新内存芯片流向中国；国内替代品（Huawei
              Ascend、国产 DRAM）虽存在，但性能落后于前沿芯片。如果 AWE 模型质量与训练算力质量绑定，出口管制可能让 TARS 的模型改进节奏慢于资源充足的西方同行。

              sim-to-real 迁移是最实质的技术风险。McKinsey
              分析指出，这是实验室演示与量产级部署之间的主要障碍：模型在仿真或已训练任务类别中表现出色，遇到新工厂布局、环境光变化、零件公差漂移或意外人机互动时，性能可能显著下降。TARS
              已在受控条件下演示亚毫米级线束装配，但未披露连续工业运行中的统计可靠性数据，例如平均故障间隔时间、首次尝试成功率。21 自由度 DexHand
              设计带来额外故障点：微型摄像头、触觉弹性体传感器、复杂电机—减速器架构，在粉尘、振动重、温度极端的工厂环境中都可能退化。电池安全也是额外担忧：双足机器人在靠近人类工人和易燃材料的环境中使用锂聚合物电池组，需要明确的
              IEC 62133 认证和逐场地风险评估；目前没有披露这类认证。
