            body: >-
              TARS 融资时，面对的并不是中性市场。2025 年更广泛的私募资本环境奖励 AI 平台、硬科技叙事和国家优先赛道，即使亚洲整体 VC 条件仍偏疲弱。KPMG 将 AI
              描述为全球最热融资主题，并提到旨在加速战略技术的政府支持资本项目。中国政策背景在这里很关键：规模 1380 亿元的国家创业投资引导基金出现，国资集中投向 AI
              相关公司，这有助于解释为何一家不透明的年轻机器人公司能吸引大额融资。可比人形机器人融资强化了这一点。Figure 公开披露 2025 年 Series C 轮投后估值 $39 billion；TechCrunch
