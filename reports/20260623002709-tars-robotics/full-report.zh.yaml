      - number: '1.2'
        title: 领导层厚度与治理集中度
        blocks:
          - type: paragraph
            body: >-
              早期可信度最清晰的来源是领导团队。陈亦伦横跨机器人研究、机器视觉、汽车自动驾驶，以及 DJI、Huawei ADS 和 Tsinghua AIR
              的运营经历；对一家成立才数月的公司来说，这种创始人—市场匹配度异常强。李震宇带来 Baidu Apollo
              的自动驾驶平台和商业化经验，丁文超、陈同庆则补齐具身控制、导航和空间感知等高端技术覆盖。精英履历的集中，大概率解释了投资人为何如此激进地为 TARS
              注资；但它也制造了治理不对称：公开叙事几乎全部围绕陈亦伦展开。公开层面看不到清晰董事会结构、独立董事层，也没有披露除具名创始团队以外的接班梯队。也就是说，增强技术可信度的同一因素，也抬高了执行集中风险。投资人应把领导力质量视为优势，同时把单一创始人信号依赖当成实质尽调议题，而非脚注。
