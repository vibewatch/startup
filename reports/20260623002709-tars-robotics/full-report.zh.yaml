            body: >-
              这个赛道沿三条轴线分化：部署成熟度、能力通用性和价格可及性。Unitree 危险在于，它把产品宽度和成本压缩结合起来；仅 H2 的价格就远低于 TARS 的指示性价格。Figure 危险在于，Helix
              暗示一种可扩展 AI 层，可能越过今天的具体任务演示实现泛化。1X 给出面向消费者的价格锚，即使产品路径不同于 TARS，也会改变市场预期。UBTECH 有上市公司体量；Agility
              则拥有最佳公开部署证明和企业销售动作。Apptronik 围绕广义劳动替代经济性包装 Apollo，Boston Dynamics
              则在移动机器人复杂度和企业工具链上设定最高标尺。站在买方视角，最相关的标准是部署就绪度、灵巧性、价格可及性、流程针对性和系统集成，而不是估值标题或机器人演示的传播度。
