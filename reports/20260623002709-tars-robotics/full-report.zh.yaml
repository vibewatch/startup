              最公平的财务结论是：按年龄看，TARS 资金非常充足，但仍无法用传统运营指标承销。短期资本充足性账面很强，因为 $697 million
              对一家私营机器人创业公司来说是很大的已披露弹药库。但这只是表层视角。公开来源未披露账上现金、月度烧钱、债务、项目融资、营运资本压力或制造义务。同行披露说明为什么这些问题重要：扩张人形机器人公司会在制造、算力、数据采集、集成工具和现场支持上重投入。公开层面，TARS
              还面临额外风险：融资记录可能被误读为牵引力证明。怀疑性报道明确指出了这一担忧。除非投资人能直接检验估值、收入质量、利润率路径和客户证明，否则正确姿态不是认为 TARS
              财务虚弱，而是承认其运营经济性仍大幅未验证。投资人还需要知道，这个资本基础是在转化为可重复商业引擎，还是只是资助更长的技术验证周期。转化可见之前，公司仍可融资，但还不可建模。
