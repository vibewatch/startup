      - number: '5.6'
        title: 研究基础、团队厚度与技术风险清单
        blocks:
          - type: paragraph
            body: >-
              对一家成立不到两年的公司来说，TARS 的研究导向异常重。超过 80% 员工被归为研发人员，超过 80% 拥有硕士或博士学位。团队在机器人感知、全身控制和通用任务执行等领域发表超过 40 篇论文，且有工作被
              ICRA 和 ICML 2026 接收；这说明公司具备真实研究执行力，而不只是营销能力。研究人才密度是持续模型和硬件开发的最强基础。不过，它也带来运营风险：从研究能力走向通过认证、可量产的工业部署，路径很长，而
              TARS 尚未公开记录这条路径。关键未解技术风险包括：（1）依赖专有 SenseHub
              数据，这限制第三方可复现性；如果遥操作扩张成本过高，还会带来数据连续性风险；（2）谐波齿轮和精密执行器上的硬件供应链集中，容易受针对中国制造的贸易限制影响；（3）缺少 CE 标志或 UL
              标准等工业部署安全认证的公开披露；（4）没有具名商业客户或独立验证的部署 ROI；（5）从 GitHub 星标数看，开源开发者社区相对较小。独立报道明确质疑 TARS
              融资速度是否跑在商业证明前面；考虑到公司年龄和公开客户名称缺失，这一担忧合理。2026 年 3 月，中国发布国家人形机器人标准化框架，为 TARS 必须进入的目标市场提供了正在成形的合规要求。
            claimRefs:
              - CE033
