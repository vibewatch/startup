  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与投资建议
        blocks:
          - type: paragraph
            body: >
              TARS Robotics 的核心投资问题是：其突出的技术差异化——线束装配 Guinness World Record、VLTA（Vision-Language-Tactile-Action）架构、AWE
              3.0 世界模型，以及 2026 年 6 月 DexHand 首秀——能否在竞争对手追近能力差距、融资优势收窄之前，转化为商业上可防守的业务。自 2025 年 2 月成立后 14 个月内，TARS 已融资
              $697M，建立起全球人形机器人领域最大的营收前资本池之一。投资人组合包括 Hillhouse、Sequoia China、GL
              Ventures、Meituan、北京和上海国资；这直接说明，多个独立来源的成熟资本同时认可其技术叙事和市场紧迫性。


              尽管融资成绩突出，今天承销 TARS 的证据基础仍结构性不完整。三轮融资均未披露投后估值。收入为零。客户名称缺失。烧钱速度和现金余额未披露。MachineBrief 对 $122M angel-plus
              轮的怀疑性报道明确质疑，业务牵引是否足以支撑 headline 融资金额；同样的警示也适用于 $455M Pre-A。当前合理建议是
              research-more：牛市情形可信，但还不能承销；熊市情形同样真实，也不能忽视。


              我们的建议摘要（Table TV001）给出正式立场：recommendation 为 research-more，confidence 为 medium，risk 为 high，valuation stance
              为 stretched。stretched 立场反映了一个事实：对一家零收入、商业化前公司，在未披露但推断为 $2.0–3.0B 投后估值下投入 $697M
              隐含资本，已经计入大量商业化期权。与更接近商业化阶段的可比公司 Agility Robotics（$400M 融资后投后 $2.12B）相比，隐含进入倍数要么相当，要么已经偏高。正反论点分析（Table
              TV002）捕捉两边的具体论据。投资 KPI 图（Figure FV001）把证据链连接到建议。
