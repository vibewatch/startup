              TARS 进行战略投资。两家投资人都运营大型物流和配送网络，天然适合作为内部物流人形机器人的早期部署场地，但两者均未宣布与 TARS 的部署合同、试点协议或意向书。


              TARS 未发布任何具名企业客户名单、试点伙伴公告或采购订单。潜在买方外部兴趣的唯一公开证据，是 Gasgoo 的 LogiMAT 报道。针对刺绣和线束用例，TARS
              引用了更广泛的工业劳动力市场——刺绣雇佣数十万人，线束装配在中国雇佣超过 100 万工人——作为目标客户基础，但没有点名任何具体雇主或制造设施。Finanzwire 和 Pressrelease Hub 的
              ICRA 报道确认了线束演示的技术内容，但没有客户引用。


              JD Logistics 2025 年 10 月宣布的五年采购 300 万台机器人和 100 万辆自动驾驶车辆计划，显示中国物流平台意向规模。到 2025 年底，JD 的 Wolf Pack 机器人已部署到中国
              20 多个省份和 10 多个国家，说明 JD 是活跃且规模化的工业机器人买方——尽管尚未披露任何 TARS 专属交易。2026 年 6 月 Smart Expo 报道显示，JD Logistics
              和机器人伙伴继续展示自动化能力，说明 TARS 所提供系统类型的采购环境仍然活跃。
