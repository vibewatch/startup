  - id: FV001
    title: 推荐逻辑——TARS Robotics 估值链条
    type: flow
    layout: wide
    summary: |
      决策链把 TARS 的资本结构、技术验证、商业缺口、同业估值背景与风险画像，连接到继续研究 / 估值偏高的建议。
    data:
      nodes:
        - id: capital
          label: 14 个月融资 $697M；顶级 VC + 国家资本
          type: input
        - id: tech
          label: VLTA + AWE 3.0 + 吉尼斯线束 + DexHand 2026
          type: input
        - id: team
          label: 前 Huawei CTO + 前 Baidu IDG 总裁；产业网络深
          type: input
        - id: no-revenue
          label: 零收入；无具名客户；无商业合同
          type: input
        - id: comps
          label: 同业区间从 $2.12B（Agility）到 $39B（Figure）；AgiBot 目标 $6.4B
          type: input
        - id: risks
          label: 地缘政治 + 竞争 + 资本开支 + 降估值融资风险（均未解决）
          type: input
        - id: macro
          label: Goldman 预计 2035 TAM $38B；中国“十五五”机器人部署要求
          type: input
        - id: scenarios
          label: Series A 牛市 $6–8B / 基准 $3–4B / 熊市 $1–1.5B；隐含入场 $2.5B
          type: process
        - id: recommendation
          label: 继续研究 | 置信度：中 | 风险：高 | 立场：估值偏高
          type: output
      edges:
        - from: capital
          to: scenarios
          label: 隐含 $2.0–3.0B 入场区间
        - from: tech
          to: scenarios
          label: 支撑牛市溢价
        - from: team
          to: scenarios
          label: 提高退出溢价概率
        - from: no-revenue
          to: scenarios
          label: 限制基准情景确定性
        - from: comps
          to: scenarios
          label: 锚定估值分布
        - from: risks
          to: scenarios
          label: 放大下行情景概率
        - from: macro
          to: scenarios
          label: 验证长期牛市 TAM
        - from: scenarios
          to: recommendation
          label: 导向
