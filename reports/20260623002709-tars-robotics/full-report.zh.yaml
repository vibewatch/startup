          value: 1
          detail: 仅有 LogiMAT 2026 海外首秀；未确认 CE 认证或具名欧洲买家
  - id: FR001
    title: 风险热力图——TARS Robotics 关键风险的发生可能性与影响
    type: matrix
    layout: wide
    summary: |
      将 TARS 的 12 项关键风险放入三档发生可能性（高、中、低）与四档影响等级（关键、高、中、低）。右上象限的风险（高可能性 + 关键 / 高影响）是投资监控的首要事项。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - CFIUS / 被列入实体清单；电池安全事故
            - 国家资金政策逆转；资金耗尽
            - BIS 切断 HBM 芯片获取；Series A 前无企业收入
        - label: 高影响
          values:
            - CEO / 关键创始人离职；不符合 EU AI Act
            - Sim-to-real 精度失败；DexHand 可靠性失败；违反中国 PIPL
            - 不符合 MIIT 标准；制造爬坡失败；执行器供应中断
        - label: 中影响
          values:
            - 数据安全泄露；制造质量缺陷
            - 企业销售周期拉长；电池认证延迟
            - Unitree 价格压力；国内同行竞争拥挤
        - label: 低影响
          values:
            - 单个试点表现不达预期
            - 政府关系恶化
            - 学术会议披露 IP
    approximationNotes: |
      发生可能性和影响评估是分析师基于截至 2026-06-23 公开信息给出的估计，不代表精算概率。各项风险未单独加权；图中位置仅反映相对定性判断。
    claimRefs:
      - CR001
      - CR009
      - CR015
      - CR026
      - CR037
      - CR041
  - id: FR002
    title: 风险传导图——TARS 风险如何层层传导至估值
    type: dag
    layout: wide
    summary: |
      展示 TARS 主要风险如何沿经营机制传导，最终影响估值结果。多条风险向量汇聚到无收入与资金耗尽节点，形成复合失败情景。
    data:
      nodes:
        - id: r1
          label: BIS 出口管制（HBM）
        - id: r2
          label: 不符合 MIIT 标准
        - id: r3
          label: Sim-to-real 缺口
        - id: r4
          label: Unitree 价格压力
        - id: r5
          label: 无具名企业客户
        - id: r6
          label: AI 芯片供应中断
        - id: r7
          label: 制造延迟
        - id: r8
          label: 资金耗尽风险
        - id: r9
          label: 竞争失利（Figure / Apptronik）
        - id: r10
          label: 估值受损
        - id: r11
          label: 政府政策逆转
        - id: r12
          label: 关键人物离职风险
      edges:
        - from: r1
          to: r6
          label: 限制先进芯片获取
        - from: r6
          to: r7
          label: 放慢 AWE 模型训练；冲击硬件
        - from: r2
          to: r7
          label: 阻断产品审批
        - from: r3
          to: r5
          label: 试点失败，无法转化为订单
        - from: r7
          to: r5
          label: 产品延迟削弱管线
        - from: r4
          to: r9
          label: 低成本替代方案侵蚀差异化
        - from: r5
          to: r8
          label: 无收入加速烧钱
        - from: r9
          to: r8
          label: 丢单拉大烧钱与收入缺口
        - from: r11
          to: r8
          label: 国家资本撤出压缩资金续航期
        - from: r8
          to: r10
          label: 资金续航压力迫使降估值融资或陷入困境
        - from: r12
