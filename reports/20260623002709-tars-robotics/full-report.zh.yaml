      - number: '8.2'
        title: 融资背景、进入纪律与隐含估值
        blocks:
          - type: paragraph
            body: >
              TARS 在异常压缩的时间线内完成融资，常规稀释测算很难干净套用。天使轮（$120M，2025 年 3 月）是当时中国具身 AI 史上最大天使轮。四个月后，$122M angel-plus 轮（2025 年 7
              月）跟进。$455M Pre-A（2026 年 4 月）刷新中国具身 AI 单轮融资纪录。合计看，公司运营满一整年之前，已获得 $697M 资本承诺。


              未披露投后估值时，进入纪律分析只能做推断。如果 Pre-A 轮（$455M）对应 25–35% 的 primary dilution——处在 2025–2026 年中国具身 AI 竞争性 Pre-A
              的合理区间内——隐含投后估值从 $1.3B（35%）到 $1.82B（25%）不等。再把早期天使轮分批融资及 20–25% 累计稀释纳入，完全摊薄隐含估值最符合 $2.0–3.0B 区间，本章统一使用 $2.5B
              作为中位估计。这是我们的分析推断；没有一手来源披露真实数字。KPMG 2026 年 Q1 Venture Pulse 确认，AI 聚焦公司在全球仍能拿到溢价融资价格，支持区间上沿。TechCrunch 报道
              Apptronik 在 $935M Series A 后估值约 $5.3–5.47B，意味着这家更进一步的美国人形机器人公司，相比 TARS 隐含区间大约有 2–2.5× 溢价。


              进入纪律应卡住三项条件：披露投后估值或完成经验证的 cap table 审阅；证明至少一份已签商业合同；披露月度 burn
              rate。缺少这三项，按未披露估值共同投资，会让新投资人相对既有机构财团处于信息劣势。国资参与（北京和上海政府基金）形成隐含估值底部，但也会让未来 preference stack 和退出动态更复杂。
