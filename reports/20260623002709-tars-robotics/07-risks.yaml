company:
  name: TARS Robotics
chapter:
  number: 7
  title: Risks
  summary: >
    TARS faces a compounding risk stack: US BIS export controls restrict advanced
    AI chip access, China's new MIIT national standard imposes compliance obligations,
    and the EU AI Act creates high-risk certification burdens for any Western market
    entry. Operationally, the company has no production deployment track record after
    16 months, relies on unconfirmed actuator suppliers, and has yet to demonstrate
    the sim-to-real reliability that enterprise customers require. Financially, $697M
    raised with zero disclosed revenue and a $95,000 price point facing Unitree's
    $16,000 G1 creates a capital burn dilemma. Government-dependency risk, three
    hyper-funded Western competitors (Figure at $39B, Apptronik at $5.47B, Boston
    Dynamics), and key-person concentration around CEO Chen Yilun round out a risk
    profile that demands rigorous kill-criteria monitoring.

sections:
  - id: regulatory-legal-risk
    title: Regulatory and Legal Risk
    body: >
      TARS operates at the intersection of three major regulatory regimes that each carry material
      investment risk. First, US Bureau of Industry and Security (BIS) export controls, most
      recently updated in December 2024, impose country-wide restrictions on advanced
      High-Bandwidth Memory (HBM) chips to China and any entity headquartered in China globally.
      CSIS analysis confirms these controls specifically target AI training hardware with a
      "presumption of denial" license policy, covering the HBM2e/HBM3/HBM3e/HBM4 tiers that
      power modern AI training workloads including the kind TARS needs for AWE model development.
      If TARS's training compute pipeline depends on foreign GPU clusters or HBM-powered chips,
      export control escalation could constrain its AI model advancement relative to US and
      European competitors who retain unconstrained chip access.

      Second, China's MIIT released its first national standard system for humanoid robotics and
      embodied AI in March 2026, developed by over 120 institutions under HEIS (Humanoid Robots
      and Embodied Intelligence Standardization). The standard system spans six domains including
      safety and ethics, application scenarios, and "brain-like intelligent computing." While
      compliance with these standards may create a first-mover advantage for TARS in China, it
      also imposes ongoing certification and product qualification obligations. TARS has not
      publicly disclosed a standards compliance roadmap or timeline.

      Third, data collected by the SenseHub platform—manufacturing-floor motion data captured
      from human workers—is subject to China's Personal Information Protection Law (PIPL) and
      Data Security Law (DSL). Cross-border transfer of this data (for example to cloud compute
      outside China for model training) requires a government security assessment or standard
      contract filing. Separately, TARS's potential EU market entry triggers EU AI Act (Regulation
      2024/1689) obligations: industrial AI systems used in high-stakes manufacturing may qualify
      as high-risk under Annex III, requiring conformity assessment, risk management documentation,
      and human oversight protocols before commercial deployment in EU jurisdictions. The EU AI Act
      high-risk obligations take effect from August 2026. The BIS connected-vehicle rule (a near
      analog to robotics AI restrictions) further signals the direction of US regulatory posture
      toward Chinese autonomous systems on American soil.
