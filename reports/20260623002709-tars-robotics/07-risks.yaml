  - id: mitigation-kill-criteria
    title: Mitigation Strategies and Kill Criteria
    body: >
      Effective risk management for a TARS investment requires monitored early-warning triggers
      and pre-specified thesis-break events. Mitigations exist for several risks but are immature
      or unconfirmed; investors should treat the following as diligence obligations rather than
      resolved items.

      On regulatory risk, TARS can partially mitigate BIS export control risk by qualifying domestic
      AI compute (Huawei Ascend-class chips for inference, domestic DRAM for training) before
      advanced foreign chips become unavailable. MIIT standard compliance is manageable as a
      first-mover—TARS's participation in the HEIS process (through industry body membership)
      would provide advance visibility of specification changes. For EU AI Act compliance, early
      engagement with a notified body for conformity assessment of the A1 in manufacturing contexts
      would reduce time-to-market risk if and when TARS targets European customers.

      On operational risk, supply chain diversification (qualifying two or more actuator and
      harmonic gear vendors) and inventory buffering are standard mitigations that TARS should
      have in place before Series A. Battery certification (IEC 62133-2) and ISO 10218-compliant
      safety system design should be prerequisites for any customer pilot. The sim-to-real gap
      can be partially addressed by expanding SenseHub's data collection scope to diverse factory
      environments, but this takes time and customer access.

      On financial risk, securing at least two named enterprise pilot contracts with committed
      purchase order language (not just MOUs) before the next fundraise would significantly
      de-risk the capital story. Capital burn management through staged hardware development
      (prioritizing DexHand software and AWE model over full A1 production units) could extend
      runway by 12–18 months.

      Kill criteria are specific, measurable events that should trigger divestment consideration:
      (1) Chen Yilun departure within 24 months; (2) BIS entity list addition for TARS or its
      key chip suppliers; (3) cash runway below 12 months without a committed new round;
      (4) three consecutive failed enterprise pilot attempts where robots are replaced rather than
      purchased; (5) Unitree G1 achieves sub-5mm insertion accuracy in wire harness tasks (removing
      TARS's differentiation claim). Each trigger should prompt immediate reassessment.
    claimRefs:
      - CR030
      - CR033
      - CR036
    tableRefs:
      - TR005

callouts:
  - calloutType: risk
    title: Entity List Risk Is Non-Zero
    body: >
      TARS's AI model development, state-linked investor profile, and strategic manufacturing
      focus in sectors adjacent to China's national security supply chain create conditions
      under which US authorities could add TARS or its component suppliers to the BIS Entity List.
      While no such action is imminent, the pattern of BIS additions in 2022–2024 (140 entities
      in one round) shows escalatory potential. Diligence should confirm TARS's investor registry
      against OFAC and CMIC lists.
    claimRefs:
      - CR001
      - CR003
      - CR045

  - calloutType: risk
    title: "$697M Raised, Zero Revenue: Capital Clock Is Ticking"
    body: >
      TARS is among the most-funded pre-revenue companies in the humanoid robotics sector. Its
      $697M raise at an estimated multi-billion-dollar valuation implies a high hurdle for the
      next financing round. With competing platforms achieving $20K–$39B valuations on similar
      or shorter timelines, TARS needs at least one named production customer with a purchase
      order before its current runway exhausts. The MachineBrief skeptical framing—"What's the
      Real Story?"—is the market-facing adverse narrative that TARS must overcome with commercial
      evidence, not press releases.
    claimRefs:
      - CR009
      - CR010
      - CR021
      - CR029

