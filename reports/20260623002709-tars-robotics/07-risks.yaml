  - id: operational-technical-risk
    title: Operational and Technical Risk
    body: >
      TARS's operational risk profile is defined by supply chain fragility, an absence of
      proven production manufacturing, and technical barriers to reliable industrial deployment.
      On the supply side, the A1 robot uses electric servo actuators and harmonic gears that
      are sourced from third-party suppliers—neither of which TARS has disclosed publicly.
      Single-source or limited-source dependency for critical motion components is standard
      practice in prototype-stage robotics but becomes a critical vulnerability once the company
      commits to production volume. Any disruption—ranging from supplier insolvency to trade
      restrictions on precision mechanical components—would halt scale-up.

      AI chip access is a parallel vulnerability. Training the AWE 3.0 model at scale requires
      high-bandwidth memory compute clusters. The December 2024 BIS controls restrict HBM2e and
      newer memory chips to China on a country-wide basis; while domestic alternatives (Huawei
      Ascend, domestic DRAM) exist, they lag frontier chips on performance. If AWE model quality
      is linked to training compute quality, export controls could slow TARS's model improvement
      cadence relative to well-resourced Western peers.

      The sim-to-real transfer problem is the most material technical risk. McKinsey analysis
      identifies this as the primary barrier separating lab demonstrations from production-grade
      deployments: a model that excels in simulation or on trained task classes can degrade
      significantly when encountering novel factory layouts, ambient lighting variation, part
      tolerance shifts, or unexpected human interactions. TARS has demonstrated sub-millimeter
      wire harness assembly in controlled conditions, but has not disclosed statistical reliability
      data (mean time between failure, first-attempt success rate) from continuous industrial
      runs. The 21-DoF DexHand design introduces additional failure points: micro-cameras,
      tactile elastomer sensors, and a complex motor-reducer architecture each represent
      degradation pathways in dusty, vibration-heavy, thermally extreme factory environments.
      Battery safety is an additional concern: lithium-polymer packs in a bipedal robot operating
      near human workers and flammable materials require explicit IEC 62133 certification and
      site-by-site risk assessment—no such certification has been disclosed.
