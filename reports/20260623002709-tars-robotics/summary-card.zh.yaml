  topStrengths:
    - 在亚毫米线束和刺绣任务中刷新世界级灵巧度纪录，正面切入工业自动化最难的前沿场景，而现有厂商尚无可行方案。
    - 全栈能力少见：同一组织里同时做基础模型研发、硬件开发和量产准备，目前只有 TARS 打出这种组合。
    - 创始团队密度极高：四位联合创始人此前在 Huawei、Baidu、DJI 和 Tsinghua AIR 担任过 CTO、总裁、首席科学家等职位。
    - 14 个月内完成三轮融资、募资 $697M，Sequoia China、Hillhouse、GL Ventures 等一线 VC 与国资共同入场，现金跑道异常充足。
    - 中国首个人形机器人国家标准和上海 500 亿元具身 AI 政策一起形成监管顺风，也打开补贴入口。
  topRisks:
    - 公司仍处于未创收原型阶段，没有具名客户或商业合同；融资速度与产品落地之间的牵引缺口，是核心悲观情景。
    - 关键人物集中度高：CEO Chen Yilun 承载全部公开叙事、融资和战略愿景；一旦离开，冲击会很大。
    - 如果 TARS 依赖受限组件，美国对先进 AI 芯片（NVIDIA A/H100、TSMC 先进制程）的出口管制可能卡住硬件生产链条。
    - 机器人天然吃资本：$697M 看似充裕，但硬件开发、制造爬坡和企业销售周期可能比预期更快吃掉资金。
    - 资金充足的对手正在挤压差异化窗口：Figure AI 估值 $39B，Unitree 把价格打到 <$20K，AgiBot 则是中国直接同行。
  unresolvedGaps:
    - Pre-A 轮投后估值——评估稀释和入场倍数必须先拿到。
    - 任何具名付费客户或已确认商业合同，用来验证需求。
    - 收入、烧钱速度和毛利率——判断资本充足性时不可缺。
    - 硬件 BOM 和芯片供应商名单——评估出口管制暴露所必需。
    - 员工数和运营成本结构——搭建单位经济模型的基础。
    - 需要澄清不同来源中上海与北京总部表述的冲突。
