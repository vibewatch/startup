summary:
  headline: >-
    TARS is China's best-funded pre-revenue humanoid robotics startup with a credible technical edge in dexterous
    manipulation, but the absence of customer proof, revenue, and disclosed financials warrants a Research-More stance
    ahead of Series A diligence.
