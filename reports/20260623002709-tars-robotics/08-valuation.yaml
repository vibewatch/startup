  - id: comparable-set-and-market-context
    title: Comparable Valuation Set and Market Context
    body: >
      The peer set spans four tiers: (1) confirmed-valuation private leaders such as Figure AI
      ($39 billion Series C, confirmed September 2025) and Apptronik ($5.47 billion confirmed);
      (2) public market benchmarks in China and Korea—UBTECH (HKEX: 9880.HK, ~$6.85 billion as
      of June 2026) and Rainbow Robotics (KOSDAQ: 277810, ~$7.37 billion)—where market prices
      reflect strategic partnership premiums (Samsung for Rainbow) and domestic policy tailwinds;
      (3) targeted-IPO Chinese peers including Unitree (~$7 billion STAR Market target) and AgiBot
      (~$6.4 billion HKEX target), both closer in commercialization stage to TARS; and (4) adjacent
      AI-automation public companies—Symbotic ($24.3 billion) and Teradyne ($71.5 billion)—that
      demonstrate what scaled AI-hardware automation can achieve with real revenue.


      The most instructive direct read-through is to AgiBot. Founded by a former Huawei engineer,
      AI-first, pre-IPO, targeting Chinese industrial customers—AgiBot mirrors TARS's profile almost
      exactly. Its $6.4 billion IPO target implies a roughly 2.5× premium over TARS's inferred
      $2.5 billion range, which is consistent with AgiBot's being further along the IPO path and
      having more disclosed traction. Agility Robotics ($2.12 billion) provides the lower bound:
      a company with real commercial deployments (Amazon logistics), a focused use case, and
      strategic backing, yet trading below TARS's implied entry. That gap can only be justified by
      TARS's full-stack AI advantage and the optionality that the Chinese industrial market provides
      at scale. Goldman Sachs projects the global humanoid market at $38 billion by 2035 in a
      base scenario, supporting a strong long-term revenue TAM, but commercialization timing remains
      unconfirmed. The IFR's June 2026 data confirms China as the world's largest robot market
      (295,000+ annual installations as of 2024, ~10× US levels), providing the natural domestic
      deployment base for TARS's initial customers.
