  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Post-money valuation (BLOCKING)
        - No round valuation disclosed for any of the three funding rounds
        - Cannot confirm entry discipline; cannot assess dilution or preference stack
        - Request directly from management; require cap table review before any co-investment
      - - Revenue and customer contracts (BLOCKING)
        - No revenue disclosed; no customer names; no signed LOIs or contracts public
        - Cannot model payback, growth rate, or commercial proof; bull case unverifiable
        - Customer reference calls; signed LOI or contract summary under NDA; pilot-site visit
      - - Monthly burn and cash position (BLOCKING)
        - Cash on hand, monthly net burn, and runway undisclosed
        - Cannot calculate dilution timeline or assess capital adequacy for production scale-up
        - CFO briefing; audited monthly management accounts; burn bridge to next milestone
      - - IP and patent portfolio (MATERIAL)
        - No CNIPA, USPTO, or EPO filed patents publicly confirmed
        - Sustainable moat depends on protected IP; open-sourced dataset is not a durable barrier
        - Patent office searches (CNIPA/USPTO/EPO); IP counsel review; license terms for WIYH dataset
      - - Export-control compliance posture (MATERIAL)
        - No disclosed BIS/OFAC review or legal opinion on export-control risk
        - Geopolitical headwinds could block overseas expansion and US investor participation
        - In-house or external counsel review of BIS EAR, OFAC, and CFIUS exposure
      - - Manufacturing plan and COGS (MATERIAL)
        - Only conceptual manufacturing roadmap; no supplier BOM or per-unit cost estimate public
        - Cannot assess unit economics, gross margin potential, or production risk
        - Site visit; prototype BOM with tier-1 suppliers named; assembly COGS breakdown
      - - Cap table and preference stack (MATERIAL)
        - No disclosed cap table; state-capital participation creates unusual preference dynamics
        - Liquidation preference order and dilution from state-capital involvement is unclear
        - Full cap table with preference schedule; liquidation waterfall analysis
      - - Series A timeline and terms (MINOR)
        - No disclosed Series A plans or timeline
        - Next dilution event and valuation step-up uncertainty affects hold-period planning
        - Management discussion on funding roadmap; confirm Series A target price range
    notes: >
      Priority tiers (BLOCKING / MATERIAL / MINOR) reflect the minimum evidence required before
      proceeding to different investment action levels. BLOCKING items are prerequisites for any
      co-investment at an undisclosed valuation.
