callouts:
  - calloutType: recommendation
    title: Recommendation — Research-More, Stretched Valuation Stance
    body: >
      TARS is among the most technically credible pre-commercial humanoid robotics companies in
      China, backed by an elite team and a $697 million war chest. The case for tracking closely
      is strong. The case for committing capital at an undisclosed valuation without revenue or
      customer evidence is weak. Monitor for the first signed commercial contract, a disclosed
      Series A valuation, and burn-rate transparency. Those three catalysts, if positive, move
      the recommendation to buy.
    claimRefs:
      - CV001
      - CV002
      - CV023
      - CV028
  - calloutType: risk
    title: MachineBrief Adverse Signal — Traction Gap Behind the Headlines
    body: >
      MachineBrief's coverage of TARS's $122 million angel-plus round explicitly questioned
      whether the company's commercial substance justified the scale of the headline financing.
      That skeptical framing—repeated and amplified across each subsequent funding announcement—
      is the most concise public expression of the bear risk: a world-class narrative with an
      unverified commercial foundation. Until revenue and customers are disclosed, this adverse
      signal is the appropriate counterweight to TARS's funding and technical achievements.
    claimRefs:
      - CV020
      - CV028

