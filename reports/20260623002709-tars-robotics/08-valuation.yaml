  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Zero named customers by end of 2027
        - 0 confirmed paying customers 30 months after founding
        - Evidence-free commercialization narrative collapses; capital market premium evaporates
        - Reassess to avoid; no bull case remains without commercial proof
      - - BIS Entity List addition
        - TARS, key supplier, or critical compute provider added to US Bureau of Industry and Security Entity List
        - Overseas deployment blocked; compute access impaired; export-control compliance cost spikes
        - Immediate portfolio review; likely downgrade to avoid; potential capital impairment
      - - Down-round Series A
        - Series A closes at valuation below $2B post-money
        - Investor confidence in commercialization timeline has deteriorated; burn likely unsustainable
        - Reduce position or avoid follow-on; prior entry loses 20–40% on paper mark
      - - CEO or Chairman departure
        - Chen Yilun or Li Zhenyu exits within the next 24 months
        - Investor trust anchored to founding team; strategic and government relationships at risk
        - Re-evaluate thesis anchor; pause any follow-on until successor plan is clear
      - - Competitor locks anchor customer
        - AgiBot, Figure AI, or Unitree signs a large Chinese industrial customer that TARS was targeting
        - First-mover advantage in the target segment is lost; TARS forced into secondary market
        - Monitor; TARS may still be viable in a different segment but target return compresses
      - - Export-control escalation on humanoid AI
        - New US executive order or BIS rule restricts export of bipedal robot AI models to China
        - Technology-transfer restrictions impair overseas partnerships and data collection
        - Evaluate exposure; if TARS's international strategy depends on US technology access, exit or hedge
    notes: >
      Triggers are based on public-monitorable events. They are not internal KPI thresholds and
      should be reviewed at each quarterly monitoring cycle.
    claimRefs:
