- calloutType: strength
  title: Elite technical founding bench
  body: Few seed-stage robotics companies combine DJI, Huawei ADS, Baidu Apollo, and Tsinghua AIR pedigrees in one team. That concentration helps explain why capital formation outran conventional commercialization milestones.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
- calloutType: risk
  title: Capital proof is ahead of customer proof
  body: TARS has unusually strong financing and compelling demos, but the public file still lacks named customers, revenue, valuation, and replicated deployment evidence. That gap is the central underwriting risk in this chapter.
  claimRefs:
  - CO017
  - CO019
  - CO020
  - CO030
  - CO031
  - CO044
