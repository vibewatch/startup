  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: production-readiness
    missingEvidence: No industrial safety certifications (CE, UL, ISO 10218) have been publicly disclosed for any TARS hardware platform.
    whyItMatters: Missing certifications are a near-term blocker for commercial deployment in regulated European and North American industrial facilities, the markets where A1 showed initial traction at LogiMAT.
    diligencePath: Request CE conformity declaration, UL file number, and ISO 10218 compliance testing schedule from TARS management.
    relatedQuestionRefs:
    - QE028
    - QE025
    - QE029
  - type: not-public
    severity: material
    topic: named-customers
    missingEvidence: No named production customers or independently verified deployments with documented ROI have been published.
    whyItMatters: Without named deployments, the entire product-tech story rests on controlled demo proof points; commercial viability is unverified.
    diligencePath: Request customer list, pipeline, signed LOI or order list, and any site-acceptance test results with cycle times.
    relatedQuestionRefs:
    - QE007
    - QE025
  - type: unverified
    severity: moderate
    topic: open-source-adoption
    missingEvidence: WIYH GitHub star count (125) and RTR star count (18) are low relative to leading open-source robotics projects. No evidence of third-party adoption, downstream paper citations, or community contributions.
    whyItMatters: Low community signal reduces external validation of TARS's data and model claims and limits talent-attraction from open-source community.
    diligencePath: Track download counts, citation count for WIYH in subsequent papers, and pull-request activity.
    relatedQuestionRefs:
    - QE030
  - type: private-evidence-only
    severity: moderate
    topic: dexhand-production-economics
    missingEvidence: DexHand BOM cost, production yield rate, and assembly cycle time have not been disclosed. The quasi-direct-drive design is cited as enabling automated manufacturing but no production numbers have been published.
    whyItMatters: DexHand is the highest-differentiation element of the TARS stack; its manufacturing economics determine whether the $95K robot price is defensible or will compress.
    diligencePath: Request DexHand BOM and prototype yield data in technical due diligence.
    relatedQuestionRefs:
    - QE010
    - QE025
    - QE027
