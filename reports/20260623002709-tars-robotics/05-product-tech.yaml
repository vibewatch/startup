- id: research-foundation-and-technical-risk
  title: Research foundation, team depth, and technical risk register
  body: 'TARS operates with an unusually heavy research orientation for a company less than two years old. More than 80% of personnel are classified as R&D staff, and over 80% hold master''s or doctoral degrees. The team has published more than 40 papers across robotics fields including perception, whole-body control, and generalized task execution, with work accepted at ICRA and ICML 2026 — indicative of genuine research execution rather than marketing-only capability. This density of research talent is the single strongest foundation for continued model and hardware development. However, it also creates operational risk: the pathway from research capability to certified, production-ready industrial deployment is long and not yet publicly documented for TARS. Key unresolved technical risks include: (1) dependence on proprietary SenseHub data, which limits third-party reproducibility and creates data-continuity risk if teleoperation scale-up proves costly; (2) hardware supply-chain concentration in harmonic gears and precision actuators — sensitive to any trade-related restrictions on Chinese manufacturing; (3) absence of publicly disclosed safety certifications such as CE marks or UL standards for industrial deployment; (4) no named commercial customers or independently verified deployment ROI; and (5) a relatively small open-source developer community as evidenced by GitHub star counts. Independent coverage has explicitly questioned whether TARS''s funding velocity is ahead of its commercial proof, which is a legitimate concern given the company''s age and the absence of public customer names. China published a national humanoid robotics standardization framework in March 2026, providing emerging compliance requirements TARS must navigate in its target markets.'
  claimRefs:
  - CE033
  - CE034
  - CE035
  - CE040
  - CE042
