- id: dexhand-manipulation-system
  title: DexHand 21-DOF dexterous hand system
  body: 'DexHand is TARS''s human-scale dexterous end-effector, first unveiled globally at ICRA 2026 in Vienna in June 2026. Built around 21 degrees of freedom — including an anatomically faithful thumb joint structure — DexHand bridges the gap between abstract AI capabilities and physical task execution in precision industrial environments. Its tactile sensing layer uses elastomer sensors distributed across the fingertip and palm surface, allowing the robot to classify texture, hardness, and slipperiness in real time during manipulation. Fingertip-mounted micro-cameras provide high-resolution visual feedback to the AWE 3.0 model, enabling the system to perceive fine surface detail that conventional wrist-mounted cameras would miss. Actuation follows a quasi-direct-drive design using three motor types and three reducer types — an architecture TARS says supports automated mass manufacturing of the hand itself by minimizing component variety. At ICRA 2026, DexHand demonstrated real-time performance of all 26 English alphabet hand gestures with fluid transitions. Live demonstrations showed it executing multi-step backpack packing and sub-millimeter wire-harness insertion, including error recovery when operators deliberately repositioned cable ports mid-task — re-perceiving, replanning, and completing the operation without human intervention. Dr. Ding Wenchao described DexHand as "the optimized interface between human intelligence and robotic action." The simplified motor-reducer architecture is intended to lower manufacturing cost and increase yield as production scales, though no production volume, yield rate, or verified BOM cost has been published.'
  claimRefs:
