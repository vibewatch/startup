- id: sensehub-data-engine-and-wiyh
  title: SenseHub data engine and WIYH dataset
  body: 'SenseHub is TARS''s human-centric data acquisition platform and occupies the data layer of the DATA-AI-PHYSICS technology loop. Rather than relying on synthetic simulation or third-party datasets, SenseHub captures rich real-world operational data through human teleoperation and first-person demonstration, mapping human motion directly into the training pipeline for AWE. This approach is intended to address the sim-to-real gap by embedding real-world physical variation into the training distribution from the outset — a particularly important consideration for dexterous manipulation of flexible materials like cables, fabric, and deformable assemblies, which are notoriously difficult to simulate accurately. The resulting dataset — WIYH (World-In-Your-Hands) — has been open-sourced on GitHub under the tars-robotics organization and is described by the company and by InforCapital as the world''s first embodied VLTA (Vision-Language-Tactile-Action) multimodal dataset. As of May 2026, the WIYH repository had 125 GitHub stars and is implemented in Python. A second open repository, RTR, hosts code for the ICML 2026 paper and had 18 stars as of May 2026. Together, these repositories represent the company''s current public-facing developer-signal footprint. The open-source strategy builds research credibility and invites external validation, but GitHub activity levels remain modest relative to established open-source robotics platforms, which limits the independent developer community around TARS tools at this stage.'
  claimRefs:
