company:
  name: Zhiyuan Robot
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Zhiyuan Robot is a Shanghai embodied-AI and general-purpose robotics company founded in
    February 2023 by Deng Taihua and Peng Zhihui. Public evidence indicates rapid scaling in
    product releases, shipments and financing, but the latest valuation, profitability,
    ownership and IPO path remain partly reported or undisclosed rather than independently
    verified.
sections:
  - id: identity-and-product
    title: Identity, product system and operating footprint
    body: >-
      Zhiyuan Robot, also branded AgiBot, is described by a company-profile source as a
      Shanghai embodied-AI company designing general-purpose humanoid and industrial robots
      together with the software that runs them. The same source identifies Deng Taihua and
      Peng Zhihui as founders, February 2023 as the founding month, and Shanghai as
      headquarters. Its reported product scope spans full-size humanoids, smaller humanoids,
      wheeled industrial platforms and related software, indicating a platform strategy
      rather than a single-model company. Independent reporting dates the A2 release to
      August 2024, while a later reference dates the commercial-grade A3 release to February
      2026. A third-party profile lists 663 employees, but the retained Qichacha page is a
      repost of company hiring material and cannot independently validate that headcount.
      The chapter therefore treats employee count, office count and customer count as
      explicit diligence gaps rather than verified scale metrics.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO008]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance and key-person exposure
    body: >-
      Public reporting identifies Deng Taihua as CEO and Peng Zhihui as a co-founder who had
      already built technical visibility through robotics work and engineering roles before
      founding the company. The available evidence is stronger on founder identity and
      functional leadership than on the full board, voting rights or succession plan. Dealroom
      says some founders and operators are hidden on its public profile, while its cap-table
      view labels ownership percentages as indicative. This creates a material governance
      diligence gap: the investor list is extensive, but the public record does not establish
      control rights, board composition, liquidation preferences or how dependent execution is
      on the two visible technical and operating leaders. Archived job postings show technical
      hiring breadth across robotics systems, multimodal knowledge, speech algorithms and
      large-model training, which supports organizational build-out but is not evidence of
      current staffing levels or completed governance depth.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-scale-and-disclosure
    title: Funding, valuation and scale disclosure
    body: >-
      The assigned evidence records multiple financing milestones. A 36Kr report says a
      Tencent-led round closed in March 2025 and that JD.com and the Shanghai Embodied
      Intelligence Fund participated in a subsequent round, alongside existing investors.
      A later report describes a prospective Hong Kong IPO valuation of HK$40-50 billion,
      but also says timing and terms could change; the company-profile source states that
      the October 2026 private round was still closing at a reported valuation of about RMB
      50 billion. The profile also reports more than RMB 3 billion raised by August 2025.
      These figures are not equivalent to cash available, and the retained evidence does not
      establish audited revenue, profitability, debt, liquidation preferences or current
      liquidity. The public record therefore supports financing momentum, not a fully
      verified capitalisation table or runway assessment.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-diligence-gaps
    title: Milestones, policy context and unresolved diligence
    body: >-
      The evidence shows a fast progression from founding to product launch, mass production,
      commercial deployment and financing. 36Kr reports the first 1,000 general-purpose
      embodied robot units leaving production in January 2025 and describes the company's
      three product lines and education, factory, reception and exhibition use cases. Forbes
      reports 5,000 robots shipped in three months and 10,000 total shipped by March 2026.
      Forbes also cautions that humanoid robotics remains nascent and that premature scaling
      can squander momentum if products do not deliver. These figures use different verbs
      and source relationships, so they should not be collapsed into one audited shipment
      series. The Ministry of Industry and Information Technology explicitly notes sector
      gaps in components, operating systems, complete products, leading firms and industrial
      ecosystems while calling for safety governance. The company has visible scale
      evidence, yet audited financials, cash burn, customer concentration, incident controls
      and complete governance remain open questions.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
