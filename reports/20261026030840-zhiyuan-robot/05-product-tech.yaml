chapter:
  number: 5
  title: Product & Technology
  summary: Zhiyuan presents a full-stack embodied-AI platform spanning humanoid hardware, robot-learning data, foundation models, and deployment services. Public evidence shows a credible path from research assets to factory deployments, but field reliability, integration economics, and safety controls remain less disclosed than the product breadth.
sections:
  - id: product-surface
    title: Product surface and workflow fit
    body: >-
      Zhiyuan's public product surface is a family of embodied systems rather than a single software SKU. The
      available profile describes Yuanzheng/Expedition, Lingxi, and Genie robot families, plus GO-1 and AIDEA,
      while the Expedition A3 evidence specifies a full-size humanoid aimed at guidance, shopping assistance,
      entertainment, and light-duty grasp-and-deliver work. A3's stated 3 kg arm-end load, 2 m/s TCP speed,
      dual-battery design, and up to eight hours of runtime describe a commercial interaction platform, not proof
      of general autonomous labor. Independent factory reporting gives a more operational use case: four A2-W
      robots sorted more than 800 boxes in three hours at Fulin Precision. The same report says an A2-W performs
      at 0.7 of a human worker in normal operation and 1.4 to 2 workers when operated 24/7, figures that are
      site-specific estimates rather than a generalized productivity guarantee. The product implication is a
      portfolio that can address staged deployments, but each workflow still needs task-level validation.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-learning
    title: Architecture, data, and deployment model
    body: >-
      The technology stack is unusually explicit in public materials. Zhiyuan's profile names VLA+RL, WBC,
      WAM, and AgiBot World, while the public repository exposes GO-1, GO-1 Air, a dataset with about 1,003,672
      trajectories, model checkpoints, fine-tuning scripts, and a deployment server. The repository says the
      data was collected at 30 Hz for GO-1 pre-training and describes remote inference because a real robot may
      not have a powerful GPU. That is meaningful developer evidence of a reproducible research-to-deployment
      loop, but it does not establish production support levels or customer-specific uptime. Yicai adds an
      important deployment constraint: training relies on 95% simulated data and 5% real-world data, and
      unexpected situations still require continued real-world data and algorithm optimization. Initial
      deployments reportedly take three to four months, falling to three weeks or hours when 80% of a new
      environment overlaps a prior site. This supports a transfer-learning and integration-services thesis, while
      also identifying site variance as a principal scaling bottleneck.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-risk-controls
    title: Maturity, differentiation, and control gaps
    body: >-
      Maturity is strongest where public artifacts are concrete: an open dataset and model stack, named robot
      lines, factory deployments, and a reported 10,000th general-purpose embodied robot rolling off the line in
      March 2026. Differentiation therefore appears to combine hardware iteration, data scale, embodied-model
      know-how, and a growing deployment ecosystem rather than a single disclosed patent or benchmark lead.
      China’s policy and standards environment reinforces the direction of travel: MIIT's guidance calls for
      breakthroughs in the robot “brain,” “small brain,” limbs, operating systems, application platforms, and
      safety governance, while the 2026 standards system spans data, model training and deployment, applications,
      and safety and ethics. Those are ecosystem-level requirements, not evidence that Zhiyuan has completed each
      control. The factory account is candid that the robot stopped when approached for safety reasons and that
      operation and maintenance require higher technical expertise. Public evidence remains insufficient on
      incident rates, cybersecurity, privacy, certification, failure recovery, and service-level commitments.
      These gaps should be treated as underwriting blockers for high-consequence or unattended deployments.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: []
    figureRefs: []
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate disclosed product attributes from operating assumptions and unresolved diligence
      items. Nulls mean that the assigned public sources did not provide a verifiable value, not that the metric is
      zero or absent. The architecture map is a presentation of documented layers and interfaces; it does not
      certify reliability, safety, or commercial performance. It should therefore be read as a diligence map:
      documented interfaces show where evidence exists, while blank controls and unmeasured outcomes remain
      explicit underwriting questions for any proposed deployment.
    claimRefs: [CE003, CE007, CE014]
