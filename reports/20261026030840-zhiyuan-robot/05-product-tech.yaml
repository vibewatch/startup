callouts:
  - calloutType: strength
    title: Research-to-deployment loop is unusually visible
    body: Public code, datasets, model checkpoints, factory deployment, and named integration operations provide more evidence of a repeatable learning and deployment loop than a pure product announcement would.
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
  - calloutType: risk
    title: Site variance remains the scaling constraint
    body: The 95% simulated-data mix, the need for real-world adaptation, and the reported multi-month first deployment indicate that integration and safety work may scale more slowly than robot production.
    claimRefs: [CE007, CE008, CE009]
