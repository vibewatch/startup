evidenceGaps:
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited 2025-2026 revenue, gross margin, cash balance, debt and monthly burn.
    whyItMatters: Reported revenue and financing do not establish profitability, liquidity or runway.
    diligencePath: Request audited statements, management accounts, bank/debt schedules and a cash-flow bridge from the company.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO008
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Verified cap table, board composition, voting rights, preference stack and succession plan.
    whyItMatters: Investor names alone do not show control, dilution, downside protection or key-person resilience.
    diligencePath: >-
      Obtain the latest capitalization table, shareholder agreements, board materials and management succession
      coverage.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A reconciled series connecting produced units, shipped units, paid deployments and recognized revenue.
    whyItMatters: The retained sources report different metrics, periods and denominators that cannot be treated as one series.
    diligencePath: Request monthly production, shipment, acceptance, deployment and revenue schedules by product family.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: missing-source
    severity: material
    topic: safety
    missingEvidence: Enterprise safety, privacy, cybersecurity, liability and incident-control documentation.
    whyItMatters: MIIT guidance makes safety governance a sector requirement, while deployment scale increases operational exposure.
    diligencePath: >-
      Request certifications, incident logs, recall procedures, insurance, data-governance controls and customer
      acceptance criteria.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: material
    topic: company-sizing
    missingEvidence: A current Zhiyuan-specific SAM, SOM, pricing, utilization, and segment-level revenue bridge.
    whyItMatters: Industry TAM estimates do not establish the company's serviceable opportunity or revenue conversion potential.
    diligencePath: >-
      Obtain management's bottom-up market model by geography, product line, buyer segment, price, deployment count, and
      attach-rate assumptions.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Customer-level pilot-to-production conversion, uptime, payback, service burden, and renewal or expansion data.
    whyItMatters: Adoption claims cannot be translated into repeatable unit economics without workflow and cohort evidence.
    diligencePath: >-
      Request anonymized customer cohorts, deployment logs, task-level productivity metrics, and signed commercial
      terms.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM009
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      A reconciled explanation of why published market-size estimates differ in scope, segmentation, and forecast
      assumptions.
    whyItMatters: The range between publisher forecasts is large enough to change valuation and capacity conclusions.
    diligencePath: >-
      Map each forecast's inclusion rules, revenue base, geography, component treatment, and scenario assumptions before
      using it in a model.
    relatedQuestionRefs:
      - QM002
  - type: stale
    severity: material
    topic: standards
    missingEvidence: Current implementation status, certification requirements, and procurement impact of the 2026 standards framework.
    whyItMatters: A standards announcement may enable adoption but can also increase qualification cost and time.
    diligencePath: >-
      Interview certification bodies and enterprise buyers about the standards that are mandatory, voluntary, or already
      embedded in tenders.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable purchase prices, lease rates, service fees, discounts, warranty terms, and realized total cost by
      workflow.
    whyItMatters: >-
      Without normalized commercial terms, pricing power and payback versus labor or fixed automation cannot be
      compared.
    diligencePath: >-
      Request redacted contracts and invoices for matched China industrial, tourism, and reception deployments and
      normalize them by term and utilization.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: safety
    missingEvidence: >-
      Comparable certifications, safety cases, intervention rates, privacy controls, and incident histories for Zhiyuan
      and direct peers.
    whyItMatters: >-
      Enterprise adoption and insurability depend on controls that product demonstrations and shipment counts do not
      establish.
    diligencePath: >-
      Obtain certification packs, incident logs, penetration-test summaries, deployment risk assessments, and customer
      safety acceptance records.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Customer-level renewal, expansion, multi-homing, integration effort, retraining cost, and replacement history
      versus internal or fixed automation.
    whyItMatters: Shipment leadership is not durable if buyers can switch hardware while retaining workflows, data, and integrators.
    diligencePath: >-
      Interview matched customer cohorts and inspect contracts, integration architecture, fleet-management data
      portability, and replacement decisions.
    relatedQuestionRefs:
      - QP010
  - type: conflicting-data
    severity: minor
    topic: specifications
    missingEvidence: A dated manufacturer specification sheet defining the A3 battery test protocol and validated operating duration.
    whyItMatters: >-
      The eight-hour and 10-hour public figures are not comparable without workload, standby, and battery-swap
      assumptions.
    diligencePath: >-
      Request the controlled specification, test conditions, and third-party runtime results for the same A3
      configuration.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt profile, and downside runway plan.
    whyItMatters: Reported funding raised does not establish cash available to finance production, support, or working capital.
    diligencePath: >-
