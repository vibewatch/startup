    title: Public commercialization evidence versus resource and distribution leverage
    type: quadrant
    summary: >-
      Ordinal coding places Zhiyuan and Unitree furthest toward demonstrated scale, while Apptronik and
      Tesla retain resource leverage despite less public deployment evidence.
