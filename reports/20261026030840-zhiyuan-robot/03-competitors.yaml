    approximationNotes: >-
      Analyst-coded 1-5 ordinal scores from cited shipment, funding, partner, production, and channel
      evidence; x is public commercialization evidence and y is resource/distribution leverage. Scores
      are directional, not a benchmark, and cohort-level evidence is deliberately qualified.
    claimRefs: [CP005, CP006, CP008, CP009, CP016]
callouts:
  - calloutType: strength
    title: Deployment breadth is the clearest current edge
    body: >-
      Zhiyuan combines multi-thousand-unit scale evidence with tourism, industrial, reception, education,
      data-collection, leasing, and supplier-channel signals that few peers match in one public record.
    claimRefs: [CP001, CP002, CP003, CP006, CP011, CP014]
  - calloutType: risk
    title: Scale can commoditize hardware before it proves a moat
    body: >-
      Unitree's economics and capacity, Apptronik's capital and partners, and a broad U.S. entrant set mean
      that shipment leadership must convert into reliability, software, service, and customer retention.
    claimRefs: [CP005, CP007, CP008, CP009, CP016]
