      - [Zhiyuan A3 lease, "Lease offered through Qingtian Rent; rate undisclosed", "Partner network spans more than 60 Chinese cities", "Reservations are not active paid units; utilization and maintenance economics absent", "May lower buyer capex but shifts service risk to lessor"]
      - [Apptronik Apollo, "Investor expectation of about $80,000 per year at future high volume", "Factory and warehouse tasks in designated pilot areas", "Expectation is not a current list price or signed contract", "Useful future benchmark, not a present apples-to-apples quote"]
      - [Unitree humanoids, "Price and contract model not in assigned pool", "Humanoids exceeded 51% of 2025 company revenue according to prospectus data cited by TrendForce", "Model mix and realized prices absent", "Commercial traction is visible but price competition cannot be quantified"]
      - [Fixed automation / internal build / labor, "No comparable cost evidence in assigned pool", "Narrow workflow fit and buyer control", "Integration, labor, maintenance, and change-management costs unavailable", "Remains the diligence baseline rather than a priced competitor"]
    notes: >-
      No row should be interpreted as a normalized total-cost comparison; currencies, service scope,
      contract term, utilization, and deployment maturity are unavailable or non-comparable.
    claimRefs: [CP002, CP007, CP009, CP010, CP012, CP013, CP015]
