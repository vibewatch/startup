    notes: "Market forecasts and third-party database figures are directional or incomplete and are not interchangeable with audited company results."
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Repeat deployments, improving unit economics, and financing access", "Upside requires a new primary mark supported by revenue and margin", "Possible but unproven", "No audited conversion from shipments to sales"]
      - [Base, "Commercialization progresses while economics remain private", "Track and wait for price discovery or a discounted secondary", "Most defensible on current evidence", "Financing terms remain undisclosed"]
      - [Bear, "Customer pilots fail to repeat and factory/support costs consume capital", "Mark compresses; dilution and preferences reduce common-equity return", "Material risk", "Down-round, delayed listing, or rising warranty burden"]
      - [Stress, "Competitive share and pricing compress before cash generation", "Capital preservation dominates target-return pursuit", "Must be monitored", "Shipment growth without cash or contribution margin"]
    notes: "Scenarios are qualitative because the assigned pool lacks audited revenue, gross margin, cash balance, cap table, preference terms, and a defensible public comparable multiple."
    claimRefs: [CV012, CV014, CV015, CV016, CV017]

