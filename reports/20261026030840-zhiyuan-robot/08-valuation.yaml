company:
  name: Zhiyuan Robot
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a track recommendation rather than a buy call. Zhiyuan has unusual manufacturing and shipment momentum, but the public record does not provide audited revenue, margin, cash, cap-table, or exact financing terms needed to underwrite a price-sensitive investment at the reported private marks.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The appropriate stance is Track, with high risk and low-to-medium confidence in
      any precise price. GetLatka reports annual revenue of $10.8M in June 2025,
      valuation of $6.4B, and total raised of $520M, while a later Zhidx report says
      informed sources put March 2026 valuation at $2.07B and an aspirational Hong
      Kong IPO valuation at RMB36.3B-45.5B. These are not reconciled marks, and the
      GetLatka page says its revenue source was not recorded. The result is not a
      basis for a buy recommendation: a buyer should require a current financing
      instrument, fully diluted cap table, preference stack, audited revenue and
      gross-margin bridge, and cash/runway evidence. A meaningful entry discount is
      warranted until those documents show that shipments convert into repeatable
      contribution profit rather than primarily funded scale.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is operational scale: Forbes reports that Agibot shipped
      5,000 humanoid robots in the three months before March 30, 2026, reaching
      10,000 total, and TrendForce separately reports a 10,000th general-purpose
      robot milestone and a rise from 1,000 units in 2025 to 5,000 and then 10,000
      within three months. The market backdrop is also supportive: Mordor estimates
      a $3.93B humanoids market in 2026 reaching $17.80B by 2031, although those are
      proprietary estimates. The anti-thesis is that production and market size do
      not establish realized revenue, gross margin, service cost, retention, or
      customer concentration. A 36Kr investigation describes a heavy-asset factory,
      broad capital deployment, and investor pressure for commercial results as
      valuation rises. The thesis therefore depends on converting scale into
      disclosed economics, not on shipment headlines alone.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenario framework and comparable context
    body: >-
      A defensible scenario model should use shipment-to-revenue conversion, gross
      margin, service burden, working capital, and financing dilution as explicit
      drivers. The current evidence supports directional scenarios only. Bull case:
      repeatable industrial and commercial deployments, a mature supply chain, and
      a successful listing or strategic financing improve liquidity and valuation.
      Base case: demand grows but price discovery remains private, financing continues
      to fund capacity, and the investor waits for audited unit economics. Bear case:
      the reported mark compresses as customers delay scaled rollouts, heavy factory
      costs and support obligations absorb capital, or a down-round and preference
      stack transfer value away from common equity. TrendForce's report that Unitree
      and Agibot could approach 80% of Chinese shipments is a competitive benchmark,
      not a valuation multiple for Zhiyuan. Mordor's forecast is likewise a market
      size input, not company revenue. No public source here supplies a comparable
      company's transaction multiple that can be applied without false precision.
    claimRefs: [CV012, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-and-breaks
    title: Exit readiness and thesis-break triggers
    body: >-
      Exit readiness is not established by reported IPO planning. Zhidx says the
      company planned a Hong Kong listing and a 15%-25% share issuance, but the
      article does not provide an exchange filing, prospectus, pricing, or confirmed
      timetable. The diligence gate should therefore be documentary: obtain the
      latest term sheet, cap table, liquidation preferences, debt and guarantees,
      monthly burn and runway, audited revenue by product and customer, gross margin
      after field service, backlog cancellation terms, and evidence of repeat orders.
      The investment thesis breaks if the current mark cannot be reconciled to
      revenue and cash generation, if top-customer concentration makes shipments
      non-repeatable, if quality or safety incidents materially increase warranty
      cost, or if an IPO process reveals a down-round or adverse preference stack.
      Re-underwrite after each financing, major production milestone, or disclosed
      customer cohort update; until then, preserve optionality rather than chase
      private-market momentum.
    claimRefs: [CV017, CV020, CV021]

