      - ["China data and cybersecurity obligations", "China and potentially extraterritorial", "Exposure certain; violation likelihood unknown", "Critical if triggered", "Framework identified; Zhiyuan controls not publicly verified", "High pending control evidence", "Obtain data map, lawful bases, retention schedule, incident plan, and audit evidence"]
      - ["AI safety, product liability, and accountability", "Deployment jurisdictions", "Unknown", "Critical if physical harm occurs", "Engineering claims visible; liability allocation and safety case not verified", "High pending safety evidence", "Review hazard analysis, human override, insurance, contracts, and incident records"]
      - ["Cross-border sanctions, export controls, and supply-chain conflict", "China plus overseas markets", "Unknown", "High if delivery or market access is blocked", "No public jurisdiction-by-jurisdiction control evidence in assigned sources", "High pending dependency mapping", "Map components, customers, data transfers, distributors, and escalation licenses"]
      - ["Privacy and biometric or workplace data", "China and customer jurisdictions", "Exposure certain; violation likelihood unknown", "High if sensitive data is affected", "General legal requirements documented; company implementation unknown", "High pending control evidence", "Test consent, minimization, access controls, model-training provenance, and breach reporting"]
    notes: >-
      Severity and residual exposure are analytical ratings grounded in the cited
      legal requirements and the absence of company-specific control evidence; they
      are not disclosed incident findings. Jurisdiction and enforcement scope must
      be confirmed for each deployment.
    enumerationScope:
      coverage: partial
      basis: "Public legal and regulatory sources reviewed for China operations and cross-border deployments as of 2026-10-26"
    claimRefs: [CR001, CR003, CR005, CR006, CR007]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Physical injury or unsafe autonomous behavior", "Unknown", "Critical if harm occurs", "Product capability claims; independent safety record unavailable", "High pending safety evidence", "Obtain safety case, near-miss log, validation coverage, and liability allocation"]
      - ["Data leakage or unlawful training or telemetry use", "Unknown", "Critical if a major incident occurs", "Legal framework and recommended controls identified; implementation unverified", "High pending control evidence", "Provide data lineage, access logs, DPIA/PIPIA, incident drills, and customer notices"]
      - ["Battery, actuator, sensor, or software reliability failure", "Unknown", "High if field deployment is interrupted", "Production milestones reported; reliability and warranty data unavailable", "High pending reliability evidence", "Provide field failure rates, MTBF, warranty returns, recalls, and service SLAs"]
      - ["Production scale not converting to paid durable deployments", "Unknown", "High if revenue conversion is weak", "Milestones reported by secondary sources; paid cohort and utilization evidence unavailable", "High pending cohort evidence", "Reconcile shipped, installed, active, paid, repeat, and expanded units by customer"]
    notes: >-
      Production milestones and product specifications are reported by secondary
      sources and do not establish reliability, safety, paid adoption, or uptime.
      Null-like gaps are intentionally expressed as diligence asks rather than
      estimated values.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR013]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Components and manufacturing inputs", "Actuators, batteries, sensors, and contract or internal production partners", "Unknown", "Export or supplier interruption delays delivery or increases cost", "High", "Obtain approved-vendor list, dual-source status, inventory buffers, and substitution qualification", "High"]
      - ["Cloud, data, and platform interfaces", "Cloud providers, customer IT, ROS ecosystem", "Unknown", "Data-transfer or interface change disrupts operation or creates compliance exposure", "High", "Map data paths, offline fallback, API dependencies, and change-control obligations", "High"]
      - ["Distribution and deployment partners", "Overseas distributors and enterprise integrators", "Unknown", "Partner failure leaves robots unsupported or exposes Zhiyuan to local compliance failures", "Medium", "Review contracts, training, service ownership, insurance, and termination rights", "Medium"]
      - ["Customer acceptance and service network", "Industrial and commercial customers", "Unknown", "Pilot or demonstration success fails to become repeat paid use", "High", "Provide customer cohort, acceptance, uptime, renewal, and support-cost data", "High"]
    notes: >-
      The assigned sources confirm multi-country sales language and ecosystem
      compatibility but do not disclose counterparty names, concentration, or
      contractual protections. Ratings therefore remain conservative and require
      direct company evidence.
    claimRefs: [CR008, CR009, CR012, CR014]
figures:
  - id: FR001
    title: Risk impact versus public mitigation evidence
    type: matrix
    summary: >-
      Residual exposure remains concentrated in data governance, physical safety,
      and commercialization controls that are not publicly verified.
    data:
      columns: ["Potential impact", "Public mitigation evidence", "Company-specific evidence gap"]
      rows:
        - label: "Data and cybersecurity compliance"
          values: ["Critical if a major incident occurs", "Applicable laws and general legal guidance", "Data map, audits, and incident records not verified"]
        - label: "Physical safety and liability"
          values: ["Critical if a person is harmed", "General humanoid-risk analysis", "Safety case and liability allocation not verified"]
        - label: "Reliability and field service"
          values: ["High if deployments are interrupted", "Production milestones and product specifications", "Failure, warranty, recall, and uptime data not verified"]
        - label: "Supply-chain and market access"
          values: ["High if delivery or overseas access is blocked", "Current counter-extraterritoriality guidance", "Supplier and jurisdiction maps not verified"]
        - label: "Commercial conversion"
          values: ["High if production does not become paid use", "Secondary-source production milestones", "Paid, active, retained, and expanded cohorts not verified"]
        - label: "Financial model"
          values: ["High if economics cannot support deployment", "Low-confidence revenue and valuation database entries", "Audited economics, cash, burn, and financing terms not verified"]
    approximationNotes: >-
      Placement is a diligence-priority assessment, not an incident finding or
      probability estimate. "No company-specific evidence" refers only to the
      assigned public source set and does not prove that a control is absent.
    claimRefs: [CR001, CR003, CR010, CR012, CR014]
callouts:
  - calloutType: risk
    title: Data and safety controls are thesis-critical
    body: >-
      Zhiyuan's public production and product signals do not substitute for a
      verified safety case, data lineage, incident-response record, or
      jurisdiction-by-jurisdiction compliance map. A material incident without
      documented containment and customer notification would be a thesis-break.
    claimRefs: [CR001, CR003, CR010, CR013]
  - calloutType: assumption
    title: Scale claims require commercial reconciliation
    body: >-
      Public sources report 1,000th and 10,000th production milestones, but the
      assigned evidence does not reconcile those counts to paid, active, retained,
      or profitable deployments. Investment judgment should keep those denominators
      separate until management provides a cohort bridge.
    claimRefs: [CR008, CR009, CR012]
