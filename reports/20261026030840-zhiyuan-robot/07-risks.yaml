slug: zhiyuan-robot
runDate: 2026-10-26
company:
  name: Zhiyuan Robot
chapter:
  number: 7
  title: Risks
  summary: >-
    Zhiyuan's principal risk is not a single disclosed failure but the combination
    of fast embodied-AI commercialization, safety-sensitive deployment, and a
    rapidly tightening China data and cybersecurity regime. Public evidence supports
    a high residual-risk posture because operating scale and control maturity are
    not disclosed in comparable detail.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis breaks
    body: >-
      The highest-consequence risks are regulatory/data compliance and physical
      safety or liability. China's Data Security Law applies to data processing in
      China and can reach processing outside China where it harms Chinese national
      security, public interests, or lawful rights; the law defines processing
      broadly to include collection, storage, use, transmission, provision, and
      disclosure (SR004). The 2026 cybersecurity amendments further emphasize AI
      risk monitoring and safety oversight, raise the general administrative-fine
      cap from RMB1 million to RMB10 million, and increase serious data-leakage
      penalties to RMB500,000–10 million (SR005). For a robot company collecting
      visual, voice, telemetry, and workplace data, the investment implication is
      that compliance evidence must scale with deployments, not merely with
      engineering capability. A thesis break is a confirmed material incident,
      regulator investigation, or inability to demonstrate lawful data lineage,
      incident response, and customer controls.
    claimRefs: [CR001, CR002, CR003, CR004]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory, legal, and cross-border exposure
    body: >-
      The regulatory exposure is both domestic and cross-border. The Data Security
      Law assigns obligations to anyone processing data and requires data to be
      effectively protected and lawfully used (SR004). A 2026 legal guide describes
      China's cybersecurity framework as the Cybersecurity Law, Data Security Law,
      and Personal Information Protection Law, supplemented by regulations, and
      states that the amended Cybersecurity Law applies to overseas organizations
      whose activities endanger China's cybersecurity (SR006). Its practical
      checklist includes data mapping, classified management, technical safeguards,
      emergency response, breach reporting, compliance audits, and impact
      assessments (SR006). The 2026 China supply-chain and extraterritoriality
      regulations create an additional conflict for multinationals complying with
      foreign sanctions, export controls, forced-labor rules, or disclosure
      obligations, with possible trade, data-transfer, entry, and personnel
      consequences (SR008). Zhiyuan's overseas sales and ecosystem compatibility
      therefore create a monitoring requirement for jurisdiction-by-jurisdiction
      data flows, cloud access, components, and support obligations; no public
      source in this pool confirms that Zhiyuan has completed that control package.
    claimRefs: [CR001, CR003, CR005, CR006, CR007]
    tableRefs: [TR001]
  - id: operational-and-dependency
    title: Operational, technical, and dependency risks
    body: >-
      Zhiyuan's product evidence shows both commercialization momentum and
      execution exposure. A 42HOW report says the company operates three robot
      families, sells in multiple countries and regions, and put its 1,000th
      general-purpose embodied robot into production in January; the fetched
      article does not state the year for that relative date (SR001). A
      Baidu Baike entry reports a March 28, 2026 10,000th general-purpose robot
      production milestone, first-batch A3 delivery in April, and an eight-hour
      full-charge runtime claim for the A3 (SR003). These figures are not
      independently reconciled in the pool and should not be treated as proof of
      paid deployment, uptime, or unit economics. The same product expansion
      increases exposure to battery, actuator, software, sensor, field-service,
      and integration failures. Humanoid-law analysis identifies safety,
      accountability, biometric-data handling, and uncertain autonomy as
      structural risks, including uncertainty over whether the manufacturer,
      operator, or software provider is responsible after harm (SR007). Public
      evidence also does not identify Zhiyuan's supplier concentration, failure
      rates, recall history, service-level performance, or customer concentration.
      Those omissions are material diligence gaps rather than evidence that no
      incident or dependency exists.
    claimRefs: [CR008, CR009, CR010, CR011, CR012]
    tableRefs: [TR002, TR003]
  - id: monitoring-and-diligence
    title: Mitigations, monitoring indicators, and diligence asks
    body: >-
      The available evidence points to a control agenda rather than a verified
      mitigation record. The legal guidance recommends documented data mapping,
      emergency response, breach reporting, technical safeguards, and periodic
      compliance audits (SR006); the amended cybersecurity regime makes prompt,
      documented remediation relevant to mitigation of sanctions (SR005). For
      Zhiyuan, management should provide a deployment-level data inventory,
      retention and deletion rules, model-training provenance, cross-border transfer
      map, incident register, safety case, human-override design, supplier
      dependency map, warranty and recall policy, and customer acceptance metrics.
      Monthly monitoring should track reportable incidents, near misses, warranty
      returns, mean time to repair, production-to-paid-deployment conversion,
      service gross margin, top-customer share, and regulator or customs actions.
      Kill criteria should include a material safety event without a verified root
      cause, a reportable data incident without timely notice and remediation, a
      supplier or export-control interruption that prevents contracted delivery,
      or evidence that public production milestones are not translating into
      commercially accepted deployments. Financial verification is also weak:
      GetLatka displays $10.8 million of annual revenue for June 2025 while
      explicitly saying the source was not recorded, and separately displays a
      $6.4 billion valuation without a visible source in the fetched text
      (SR002). Those figures are neither audited economics nor evidence of cash
      available. Until operating, control, and financial records are supplied,
      the residual exposure remains high despite credible engineering and
      production signals.
    claimRefs: [CR003, CR006, CR010, CR013, CR014, CR015, CR016]
