      severity: blocking
      topic: controls
      missingEvidence: "A company-issued safety, security, privacy, and incident-control pack for deployed robots."
      whyItMatters: "The core risks involve physical harm, sensitive data, and regulatory exposure, but public sources do not establish control maturity."
      diligencePath: "Request the safety case, hazard analysis, security architecture, data map, incident log, breach procedures, insurance, and customer control attestations."
      relatedQuestionRefs: [QR001, QR003, QR007]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: dependencies
      missingEvidence: "Supplier, platform, distributor, and customer concentration data with contractual protections."
      whyItMatters: "A production milestone can still be fragile if a single component, platform, partner, or customer controls delivery or support."
      diligencePath: "Obtain the approved-vendor list, dual-source coverage, inventory policy, partner contracts, top-customer share, and service economics."
      relatedQuestionRefs: [QR005]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: "A reconciled cohort bridge from units produced to paid, active, retained, and expanded deployments."
      whyItMatters: "Reported production counts do not establish customer acceptance, utilization, recurring revenue, or margin."
      diligencePath: "Request customer-level shipment, installation, activation, uptime, renewal, expansion, support-cost, and gross-margin data."
      relatedQuestionRefs: [QR004, QR008]
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: "Audited revenue, gross margin, cash, debt, burn, working capital, and financing terms."
      whyItMatters: "The only retained revenue and valuation figures are low-confidence database entries and cannot establish economics, liquidity, or downside runway."
      diligencePath: "Obtain audited financial statements, bank and debt schedules, monthly burn, unit economics, and the cap table with financing preferences."
      relatedQuestionRefs: [QR007]
