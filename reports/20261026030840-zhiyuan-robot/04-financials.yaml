      - [Debt and project-finance obligations, null, "Low", "Potential fixed claims on future cash flow are unknown", "Debt, guarantees, leases, and supplier-finance schedule"]
      - ["CAC, sales cycle, and payback", null, "Low", "Commercial efficiency and repeatability remain unproven", "Cohort-level funnel, sales-cycle, CAC, and payback data"]
