          value: "RMB 1.05B in 2025"
        - id: gross-profit
          label: "Gross profit"
          value: null
        - id: cash-conversion
          label: "Cash and runway"
          value: null
    approximationNotes: "The sequence is an analytical bridge, not a reconciled waterfall: public sources do not establish that production units, deployment units, pricing, and reported revenue share the same period or denominator."
    claimRefs: [CI001, CI003, CI012, CI014, CI015]
callouts:
  - calloutType: strength
    title: Commercial scale is no longer purely conceptual
    body: Reported revenue, shipment milestones, and a near-100-unit industrial deployment provide stronger commercialization evidence than a laboratory-only profile.
    claimRefs: [CI001, CI003, CI012]
  - calloutType: risk
    title: Margin and runway remain the gating unknowns
    body: Neither cash on hand, monthly burn, gross margin, nor realized unit economics is disclosed in the retained evidence, so financing momentum cannot establish capital adequacy.
    claimRefs: [CI014, CI015, CI016]
  - calloutType: recommendation
    title: Underwrite only after a unit-level financial pack
    body: Request model-level realized pricing, COGS, deployment and service cost, customer payback, cash flow, debt, and repeat-order cohorts before relying on the reported growth trajectory.
    claimRefs: [CI006, CI010, CI014, CI015, CI016]
