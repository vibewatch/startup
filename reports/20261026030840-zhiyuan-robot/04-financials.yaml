      - [A2-W normal-operation productivity, "0.7 of a human worker", "Low", "Shows that one-shift economics may not support a simple substitution case", "Measure utilization and output over a representative period"]
      - [A2-W continuous-operation productivity, "1.4-2 workers", "Low", "Indicates multi-shift uptime is central to payback", "Obtain uptime, intervention, maintenance, and safety logs"]
      - [Independent 18-month payback hurdle, "Below CNY150,000 at CNY108,000 annual labor cost", "Medium", "Shows why installation, maintenance, and price must fall or output must rise", "Build customer-specific payback cases with all operating costs"]
    notes: "Productivity and payback figures are site-level estimates or analytical assumptions, not company-wide realized unit economics; null fields are unresolved rather than zero."
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011]
  - id: TI003
    title: Financial underwriting data availability
    columns: [Metric, Public status, Confidence, Underwriting implication, Specific diligence request]
    rows:
