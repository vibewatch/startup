  - id: FP001
    title: Public commercialization evidence versus resource and distribution leverage
    type: quadrant
    summary: >-
      Ordinal coding places Zhiyuan and Unitree furthest toward demonstrated scale, while Apptronik and Tesla retain
      resource leverage despite less public deployment evidence.
    data:
      points:
        - label: Zhiyuan / AgiBot
          x: 5
          'y': 4
          detail: Multi-thousand shipment estimates, broad applications, supplier coordination, and a leasing channel.
        - label: Unitree
          x: 4
          'y': 4
          detail: Second-place shipment estimate, disclosed humanoid revenue contribution, and planned capacity.
        - label: Apptronik
          x: 2
          'y': 5
          detail: Factory and warehouse pilots paired with $935M Series A capital and major strategic partners.
        - label: Figure / Agility
          x: 1
          'y': 3
          detail: Low cohort-level shipment evidence; durability-first development noted, but company-level data are absent.
        - label: Tesla Optimus
          x: 1
          'y': 5
          detail: Early R&D commercialization evidence but potentially substantial manufacturing and capital leverage.
        - label: Boston Dynamics / 1X
          x: 2
          'y': 3
