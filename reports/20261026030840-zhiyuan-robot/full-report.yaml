  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public descriptions support a hardware-led model spanning humanoid and wheeled robot sales, deployment
              support, and related software/data systems. The strongest disclosed revenue series is reported by the
              AgiBot profile as RMB 0.3 million in 2023, more than RMB 60 million in 2024, and RMB 1.05 billion in 2025;
              the source attributes the figures to Gasgoo, so they should be treated as reported rather than audited
              company financials. This is a sharp scale-up, but the public record does not provide a revenue-recognition
              policy, shipment-to-revenue bridge, mix between hardware and recurring software or services, returns,
              warranty reserves, or customer concentration. The Fulin Precision deployment gives a monetization anchor:
              an industry insider placed comparable humanoid robots at CNY400,000 to CNY800,000 per unit, while the
              near-100-unit agreement was described as worth tens of millions of yuan. Those are not a published Zhiyuan
              price list or realized gross-margin data. The underwriting implication is that reported revenue is
              directionally encouraging, while revenue quality remains unresolved until contracts, delivery terms,
              acceptance criteria, and recurring service economics are disclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              The operating evidence points to a cost structure dominated by hardware production, integration,
              deployment engineering, and ongoing operation and maintenance. At Fulin Precision, four A2-W robots
              reportedly handled more than 800 boxes in three hours, but the customer’s chief engineer emphasized that
              operation and maintenance require higher technical expertise and add to total expense. The same source
              estimated one robot at 0.7 of a human worker under normal operations and as much as 1.4 to 2 workers when
              running continuously, against a local annual labor cost of CNY80,000 per worker. These are site-level
              observations and estimates, not audited unit economics. The Wire China analysis adds an independent
              hurdle: for an 18-month payback, a robot replacing a worker earning CNY108,000 annually would need to be
              priced below CNY150,000 if installation and maintenance remained modest. That hurdle is materially below
              the CNY400,000-CNY800,000 market price range cited by Yicai, which underscores the importance of
              utilization, multi-shift operation, deployment reuse, service revenue, and lower manufacturing cost.
              Public sources do not disclose COGS, gross margin, warranty cost, installation cost, utilization, or
              CAC/payback.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan appears to have financing access, but financing access is not the same as cash available for
              operations. The assigned sources report more than RMB 3 billion raised by August 2025 and a further RMB
              1-1.5 billion private round nearing close in October 2026, alongside a reported approximately RMB 50
              billion valuation. The 36Kr report corroborates the 2025 financing sequence, including Tencent-led March
              financing and participation by JD.com and the Shanghai Embodied Intelligence Fund, but does not disclose
              proceeds available for working capital, debt, liquidation preferences, or burn. The company profile says
              profitability remains undisclosed and that the company was still privately held; no assigned source
              supplies cash on hand, monthly burn, runway, debt obligations, or a next-round trigger. Industry evidence
              is also mixed: TrendForce describes rising commercialization and order-driven manufacturing, while The
              Wire China cautions that many deals remain proof-of-concept or policy-driven until stable operation,
              measurable savings, and repeat orders are demonstrated. The financial verdict is therefore conditional:
              shipment and revenue momentum support continued diligence, but the public economics are insufficient to
              underwrite margin durability or capital adequacy. The immediate diligence ask is an audited or
              management-prepared 2025-2026 bridge from orders and units to recognized revenue, gross profit, cash burn,
              and remaining runway.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI012
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial scale is no longer purely conceptual
            body: >-
              Reported revenue, shipment milestones, and a near-100-unit industrial deployment provide stronger
              commercialization evidence than a laboratory-only profile.
            calloutType: strength
            claimRefs:
              - CI001
              - CI003
              - CI012
          - type: callout
            title: Margin and runway remain the gating unknowns
            body: >-
              Neither cash on hand, monthly burn, gross margin, nor realized unit economics is disclosed in the retained
              evidence, so financing momentum cannot establish capital adequacy.
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
