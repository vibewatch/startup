            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Funding, valuation and scale disclosure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence records multiple financing milestones. A 36Kr report says a Tencent-led round closed
              in March 2025 and that JD.com and the Shanghai Embodied Intelligence Fund participated in a subsequent
              round, alongside existing investors. A later report describes a prospective Hong Kong IPO valuation of
              HK$40-50 billion, but also says timing and terms could change; the company-profile source states that the
              October 2026 private round was still closing at a reported valuation of about RMB 50 billion. The profile
              also reports more than RMB 3 billion raised by August 2025. These figures are not equivalent to cash
              available, and the retained evidence does not establish audited revenue, profitability, debt, liquidation
              preferences or current liquidity. The public record therefore supports financing momentum, not a fully
              verified capitalisation table or runway assessment.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
      - number: '1.4'
        title: Milestones, policy context and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The evidence shows a fast progression from founding to product launch, mass production, commercial
              deployment and financing. 36Kr reports the first 1,000 general-purpose embodied robot units leaving
              production in January 2025 and describes the company's three product lines and education, factory,
              reception and exhibition use cases. Forbes reports 5,000 robots shipped in three months and 10,000 total
              shipped by March 2026. Forbes also cautions that humanoid robotics remains nascent and that premature
              scaling can squander momentum if products do not deliver. These figures use different verbs and source
              relationships, so they should not be collapsed into one audited shipment series. The Ministry of Industry
              and Information Technology explicitly notes sector gaps in components, operating systems, complete
              products, leading firms and industrial ecosystems while calling for safety governance. The company has
              visible scale evidence, yet audited financials, cash burn, customer concentration, incident controls and
              complete governance remain open questions.
