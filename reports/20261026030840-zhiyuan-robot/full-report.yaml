      - number: '5.3'
        title: Maturity, differentiation, and control gaps
        blocks:
          - type: paragraph
            body: >-
              Maturity is strongest where public artifacts are concrete: an open dataset and model stack, named robot
              lines, factory deployments, and a reported 10,000th general-purpose embodied robot rolling off the line in
              March 2026. Differentiation therefore appears to combine hardware iteration, data scale, embodied-model
              know-how, and a growing deployment ecosystem rather than a single disclosed patent or benchmark lead.
              China’s policy and standards environment reinforces the direction of travel: MIIT's guidance calls for
              breakthroughs in the robot “brain,” “small brain,” limbs, operating systems, application platforms, and
              safety governance, while the 2026 standards system spans data, model training and deployment,
              applications, and safety and ethics. Those are ecosystem-level requirements, not evidence that Zhiyuan has
              completed each control. The factory account is candid that the robot stopped when approached for safety
              reasons and that operation and maintenance require higher technical expertise. Public evidence remains
              insufficient on incident rates, cybersecurity, privacy, certification, failure recovery, and service-level
              commitments. These gaps should be treated as underwriting blockers for high-consequence or unattended
              deployments.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate disclosed product attributes from operating assumptions and unresolved diligence
              items. Nulls mean that the assigned public sources did not provide a verifiable value, not that the metric
              is zero or absent. The architecture map is a presentation of documented layers and interfaces; it does not
              certify reliability, safety, or commercial performance. It should therefore be read as a diligence map:
              documented interfaces show where evidence exists, while blank controls and unmeasured outcomes remain
              explicit underwriting questions for any proposed deployment.
            claimRefs:
              - CE003
              - CE007
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-to-deployment loop is unusually visible
            body: >-
              Public code, datasets, model checkpoints, factory deployment, and named integration operations provide
              more evidence of a repeatable learning and deployment loop than a pure product announcement would.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Site variance remains the scaling constraint
            body: >-
              The 95% simulated-data mix, the need for real-world adaptation, and the reported multi-month first
              deployment indicate that integration and safety work may scale more slowly than robot production.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan's visible customer motion is enterprise-led and scenario-specific rather than consumer-led. The
              evidence spans automotive and EV parts manufacturing, telecom, retail, entertainment, logistics, and
              public-facing guidance or performance use cases. Fulin Precision is described as an auto-parts supplier
              whose customers include Volkswagen, General Motors, BYD, NIO, and XPeng, but that does not make those
              automakers Zhiyuan customers. China Mobile's tender is a procurement event and therefore stronger than a
              logo, but the public article does not state deployment timing, acceptance criteria, or renewal. Retail and
              entertainment deployments show different buyer jobs: repetitive material handling, store interaction, and
              visitor engagement. This diversity is strategically useful, yet it also implies different integration,
              service, safety, and procurement requirements. Public sources do not disclose the share of revenue by
              vertical, buyer, geography, or channel, so apparent breadth should not be read as diversified revenue.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption trajectory and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory has several observable milestones, but the units are not interchangeable. Yicai
              reports a CNY124 million China Mobile tender, with CNY78 million attributed to AgiBot full-size bipedal
              robots; Assembly reports nearly 100 A2-W robots purchased by Fulin P.M.; and the company profile reports
              100 X2 units across 100 ASD retail stores, more than 300 robots at Chimelong, and 20,000 cumulative robots
              produced by September 2026. Production is a company-profile metric, whereas a tender and a purchase are
              commercial commitments; neither proves active utilization, gross margin, service burden, or repeat orders.
              A Shanghai government page reprinting Jiefang Daily provides unusually concrete Fulin operating detail: a
              three-hour livestream described two logistics shifts and more than 800 cargo boxes per shift with almost
              zero errors, but the report does not provide an audited trial protocol or longer-run failure rate. The
              public record therefore supports increasing commercial proof, not a verified retention curve.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named deployments, durability, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Named customer evidence is strongest when it identifies a counterparty, product, use case, and transaction
              or operating detail. Fulin provides a named buyer and a factory workflow, while China Mobile provides a
              named procurer and tender value. Public profiles also name ASD, Chimelong, and other scenario partners,
              yet they do not disclose contract duration, renewal, uptime, paid-versus-pilot status, or
              customer-specific outcomes. The company profile's 100 X2 units across 100 ASD stores and more than 300
              robots at Chimelong are useful scale indicators, but the denominator is a deployment count rather than a
              customer cohort. There is no public top-10 customer concentration, churn, NRR, GRR, contract length, or
              service-cost disclosure. The diligence implication is to obtain a customer-level deployment ledger and
              reconcile orders, acceptance, live utilization, support tickets, renewals, and expansion by account.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU011
              - CU014
              - CU016
      - number: '6.4'
        title: Expansion path and unresolved customer diligence
        blocks:
          - type: paragraph
            body: >-
              The observable expansion path is land-and-expand within operational settings: a robot is first
              demonstrated against a job, then a larger fleet or broader scenario is described. Fulin's reported
              conversion from a July demonstration to nearly 100 purchased A2-W units is the clearest example, while the
              China Mobile tender suggests a channel or institutional procurement route rather than a single-site pilot.
              Zhiyuan also has multiple product families and scenario labels, which could support cross-selling, but no
              source quantifies attach rates, pricing, deployment lead times, integration cost, or gross retention. The
              evidence does not establish whether the same buyer returns for additional robots, whether deployments are
              financed or sold, or how much field labor is required. Until those records are provided, customer quality
              should be assessed as promising but unproven on durability and economics, with concentration and
              implementation risk treated as material open questions.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite named deployments, not logo breadth
            body: >-
              Request signed order forms, acceptance records, live-robot counts, utilization logs, support tickets,
              renewal status, and account-level revenue before treating customer traction as durable.
            calloutType: recommendation
            claimRefs:
              - CU011
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence risks are regulatory/data compliance and physical safety or liability. China's
              Data Security Law applies to data processing in China and can reach processing outside China where it
              harms Chinese national security, public interests, or lawful rights; the law defines processing broadly to
              include collection, storage, use, transmission, provision, and disclosure (SR004). The 2026 cybersecurity
              amendments further emphasize AI risk monitoring and safety oversight, raise the general
              administrative-fine cap from RMB1 million to RMB10 million, and increase serious data-leakage penalties to
              RMB500,000–10 million (SR005). For a robot company collecting visual, voice, telemetry, and workplace
              data, the investment implication is that compliance evidence must scale with deployments, not merely with
              engineering capability. A thesis break is a confirmed material incident, regulator investigation, or
              inability to demonstrate lawful data lineage, incident response, and customer controls.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR012
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and cross-border exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory exposure is both domestic and cross-border. The Data Security Law assigns obligations to
              anyone processing data and requires data to be effectively protected and lawfully used (SR004). A 2026
              legal guide describes China's cybersecurity framework as the Cybersecurity Law, Data Security Law, and
              Personal Information Protection Law, supplemented by regulations, and states that the amended
              Cybersecurity Law applies to overseas organizations whose activities endanger China's cybersecurity
              (SR006). Its practical checklist includes data mapping, classified management, technical safeguards,
              emergency response, breach reporting, compliance audits, and impact assessments (SR006). The 2026 China
              supply-chain and extraterritoriality regulations create an additional conflict for multinationals
              complying with foreign sanctions, export controls, forced-labor rules, or disclosure obligations, with
              possible trade, data-transfer, entry, and personnel consequences (SR008). Zhiyuan's overseas sales and
              ecosystem compatibility therefore create a monitoring requirement for jurisdiction-by-jurisdiction data
              flows, cloud access, components, and support obligations; no public source in this pool confirms that
              Zhiyuan has completed that control package.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational, technical, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan's product evidence shows both commercialization momentum and execution exposure. A 42HOW report
              says the company operates three robot families, sells in multiple countries and regions, and put its
              1,000th general-purpose embodied robot into production in January; the fetched article does not state the
              year for that relative date (SR001). A Baidu Baike entry reports a March 28, 2026 10,000th general-purpose
              robot production milestone, first-batch A3 delivery in April, and an eight-hour full-charge runtime claim
              for the A3 (SR003). These figures are not independently reconciled in the pool and should not be treated
              as proof of paid deployment, uptime, or unit economics. The same product expansion increases exposure to
              battery, actuator, software, sensor, field-service, and integration failures. Humanoid-law analysis
              identifies safety, accountability, biometric-data handling, and uncertain autonomy as structural risks,
              including uncertainty over whether the manufacturer, operator, or software provider is responsible after
              harm (SR007). Public evidence also does not identify Zhiyuan's supplier concentration, failure rates,
              recall history, service-level performance, or customer concentration. Those omissions are material
              diligence gaps rather than evidence that no incident or dependency exists.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR014
      - number: '7.4'
        title: Mitigations, monitoring indicators, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a control agenda rather than a verified mitigation record. The legal
              guidance recommends documented data mapping, emergency response, breach reporting, technical safeguards,
              and periodic compliance audits (SR006); the amended cybersecurity regime makes prompt, documented
              remediation relevant to mitigation of sanctions (SR005). For Zhiyuan, management should provide a
              deployment-level data inventory, retention and deletion rules, model-training provenance, cross-border
              transfer map, incident register, safety case, human-override design, supplier dependency map, warranty and
              recall policy, and customer acceptance metrics. Monthly monitoring should track reportable incidents, near
              misses, warranty returns, mean time to repair, production-to-paid-deployment conversion, service gross
              margin, top-customer share, and regulator or customs actions. Kill criteria should include a material
              safety event without a verified root cause, a reportable data incident without timely notice and
              remediation, a supplier or export-control interruption that prevents contracted delivery, or evidence that
              public production milestones are not translating into commercially accepted deployments. Financial
              verification is also weak: GetLatka displays $10.8 million of annual revenue for June 2025 while
              explicitly saying the source was not recorded, and separately displays a $6.4 billion valuation without a
              visible source in the fetched text (SR002). Those figures are neither audited economics nor evidence of
              cash available. Until operating, control, and financial records are supplied, the residual exposure
              remains high despite credible engineering and production signals.
            claimRefs:
              - CR003
              - CR006
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Data and safety controls are thesis-critical
            body: >-
              Zhiyuan's public production and product signals do not substitute for a verified safety case, data
              lineage, incident-response record, or jurisdiction-by-jurisdiction compliance map. A material incident
              without documented containment and customer notification would be a thesis-break.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR013
          - type: callout
            title: Scale claims require commercial reconciliation
            body: >-
              Public sources report 1,000th and 10,000th production milestones, but the assigned evidence does not
              reconcile those counts to paid, active, retained, or profitable deployments. Investment judgment should
              keep those denominators separate until management provides a cohort bridge.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR009
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate stance is Track, with high risk and low-to-medium confidence in any precise price.
              GetLatka reports annual revenue of $10.8M in June 2025, valuation of $6.4B, and total raised of $520M,
              while a later Zhidx report says informed sources put March 2026 valuation at $2.07B and an aspirational
              Hong Kong IPO valuation at RMB36.3B-45.5B. These are not reconciled marks, and the GetLatka page says its
              revenue source was not recorded. The result is not a basis for a buy recommendation: a buyer should
              require a current financing instrument, fully diluted cap table, preference stack, audited revenue and
              gross-margin bridge, and cash/runway evidence. A meaningful entry discount is warranted until those
              documents show that shipments convert into repeatable contribution profit rather than primarily funded
              scale.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV008
              - CV012
              - CV017
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is operational scale: Forbes reports that Agibot shipped 5,000 humanoid robots in the
              three months before March 30, 2026, reaching 10,000 total, and TrendForce separately reports a 10,000th
              general-purpose robot milestone and a rise from 1,000 units in 2025 to 5,000 and then 10,000 within three
              months. The market backdrop is also supportive: Mordor estimates a $3.93B humanoids market in 2026
              reaching $17.80B by 2031, although those are proprietary estimates. The anti-thesis is that production and
              market size do not establish realized revenue, gross margin, service cost, retention, or customer
              concentration. A 36Kr investigation describes a heavy-asset factory, broad capital deployment, and
              investor pressure for commercial results as valuation rises. The thesis therefore depends on converting
              scale into disclosed economics, not on shipment headlines alone.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario framework and comparable context
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario model should use shipment-to-revenue conversion, gross margin, service burden,
              working capital, and financing dilution as explicit drivers. The current evidence supports directional
              scenarios only. Bull case: repeatable industrial and commercial deployments, a mature supply chain, and a
              successful listing or strategic financing improve liquidity and valuation. Base case: demand grows but
              price discovery remains private, financing continues to fund capacity, and the investor waits for audited
              unit economics. Bear case: the reported mark compresses as customers delay scaled rollouts, heavy factory
              costs and support obligations absorb capital, or a down-round and preference stack transfer value away
              from common equity. TrendForce's report that Unitree and Agibot could approach 80% of Chinese shipments is
              a competitive benchmark, not a valuation multiple for Zhiyuan. Mordor's forecast is likewise a market size
              input, not company revenue. No public source here supplies a comparable company's transaction multiple
              that can be applied without false precision.
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
              - CV017
      - number: '8.4'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by reported IPO planning. Zhidx says the company planned a Hong Kong
              listing and a 15%-25% share issuance, but the article does not provide an exchange filing, prospectus,
              pricing, or confirmed timetable. The diligence gate should therefore be documentary: obtain the latest
              term sheet, cap table, liquidation preferences, debt and guarantees, monthly burn and runway, audited
              revenue by product and customer, gross margin after field service, backlog cancellation terms, and
              evidence of repeat orders. The investment thesis breaks if the current mark cannot be reconciled to
              revenue and cash generation, if top-customer concentration makes shipments non-repeatable, if quality or
              safety incidents materially increase warranty cost, or if an IPO process reveals a down-round or adverse
              preference stack. Re-underwrite after each financing, major production milestone, or disclosed customer
              cohort update; until then, preserve optionality rather than chase private-market momentum.
            claimRefs:
              - CV017
              - CV020
              - CV021
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The public record supports monitoring Zhiyuan's commercialization, but not underwriting a purchase at an
              unverified private mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
          - type: callout
            title: Mark-to-economics gap
            body: >-
              Reported valuation figures are not reconciled to audited revenue, margins, cash, dilution, or preference
              terms.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV017
          - type: callout
            title: Scale is a real positive signal
            body: >-
              Independent reporting describes rapid production and shipment growth, which merits continued diligence
              rather than dismissal.
            calloutType: strength
            claimRefs:
              - CV006
              - CV007
              - CV009
