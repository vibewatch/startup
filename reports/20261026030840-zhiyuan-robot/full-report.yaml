            title: Underwrite only after a unit-level financial pack
            body: >-
              Request model-level realized pricing, COGS, deployment and service cost, customer payback, cash flow,
              debt, and repeat-order cohorts before relying on the reported growth trajectory.
            calloutType: recommendation
            claimRefs:
