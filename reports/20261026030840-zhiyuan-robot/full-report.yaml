              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive field is already stratifying around deployment scale
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan, also reported internationally as AgiBot, should be compared first with Unitree rather than with
              prototype-only developers. Forbes cited Omdia estimates of just under 5,200 Zhiyuan/AgiBot units and 4,200
              Unitree units, versus roughly 150 for the first U.S. manufacturers as a cohort. TrendForce separately
              projects Zhiyuan and Unitree together at nearly 80% of 2026 shipments in China, making production learning
              and supplier access immediate advantages. Apptronik represents a different threat: lower disclosed
              deployment scale, but $935 million in Series A capital and factory or warehouse pilots with Mercedes-Benz,
              GXO Logistics, and Jabil. Figure, Agility, Tesla, Boston Dynamics, and 1X remain material entrants, while
              fixed automation, conventional service robots, outsourced labor, and internal integration remain
              status-quo substitutes where a general humanoid does not yet clear reliability or cost thresholds.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP016
      - number: '3.2'
        title: Breadth and channel experimentation are strengths, but not proof of repeatable economics
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan has a broader public application footprint than a single-purpose robotics vendor. Reporting
              describes three product lines across education, factories, reception, and exhibition guidance; the A3 adds
              tourism and performance deployments, while the A2-W has a reported near-100-unit industrial project. Its
              leasing route through Qingtian Rent may lower customer capital expenditure and extends service reach
              through a network spanning more than 60 Chinese cities. Supplier participation also matters: Yicai Global
              reports that Monkey Robot cooperates on mass production of the wheeled Expedition line at stated capacity
              of 200 units per month. These are credible routes to distribution and after-sales learning, but
              reservations, capacity, and project size are not the same as paid deployments, utilization, or recurring
              gross profit.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP009
              - CP011
              - CP014
              - CP015
      - number: '3.3'
        title: Public comparison breaks down at price, safety, and switching cost
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not provide a current Zhiyuan list price, realized lease rate, service
              contract, warranty, or total cost of ownership. Apptronik's only public price signal in the pool is an
              investor expectation of roughly $80,000 per year at future high volume, not a current offer. Even basic
              specifications need caution: one report states up to 10 hours of A3 operation, while a Baidu reference
              page states eight hours. Apptronik's use of external sensors and light curtains in designated pilot areas
              also shows that collaborative safety remains an implementation constraint, not a solved category feature.
              Without comparable uptime, intervention, certification, data-rights, and service-level evidence, neither
              lock-in nor multi-homing resistance can be underwritten.
            claimRefs:
              - CP010
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP010
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: The moat is a deployment-feedback loop, and rivals are attacking every component
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan's best-supported differentiation is the combination of shipment volume, broad product coverage,
              supplier coordination, leasing distribution, and early field placements. That can create a feedback loop
              in which more deployments improve reliability, service playbooks, and component purchasing. It is not
              exclusive: TrendForce attributes similar supply-chain standardization and order-driven manufacturing to
              the leading cohort; Unitree reports meaningful humanoid revenue and high combined segment gross margin;
              and Apptronik can pair deep financing with global industrial partners and Google DeepMind models. The most
              credible displacement risk is therefore commoditization of hardware before Zhiyuan proves
              workflow-specific software, safety assurance, uptime, and after-sales economics. Internal build and
              conventional automation remain viable where buyers value determinism over humanoid generality.
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment breadth is the clearest current edge
            body: >-
              Zhiyuan combines multi-thousand-unit scale evidence with tourism, industrial, reception, education,
              data-collection, leasing, and supplier-channel signals that few peers match in one public record.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP011
              - CP014
          - type: callout
            title: Scale can commoditize hardware before it proves a moat
            body: >-
              Unitree's economics and capacity, Apptronik's capital and partners, and a broad U.S. entrant set mean that
              shipment leadership must convert into reliability, software, service, and customer retention.
            calloutType: risk
            claimRefs:
