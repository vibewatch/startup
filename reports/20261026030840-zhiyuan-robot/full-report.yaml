              - CO014
      - number: '1.2'
        title: Leadership, governance and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              Public reporting identifies Deng Taihua as CEO and Peng Zhihui as a co-founder who had already built
              technical visibility through robotics work and engineering roles before founding the company. The
              available evidence is stronger on founder identity and functional leadership than on the full board,
              voting rights or succession plan. Dealroom says some founders and operators are hidden on its public
              profile, while its cap-table view labels ownership percentages as indicative. This creates a material
              governance diligence gap: the investor list is extensive, but the public record does not establish control
              rights, board composition, liquidation preferences or how dependent execution is on the two visible
              technical and operating leaders. Archived job postings show technical hiring breadth across robotics
              systems, multimodal knowledge, speech algorithms and large-model training, which supports organizational
              build-out but is not evidence of current staffing levels or completed governance depth.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
