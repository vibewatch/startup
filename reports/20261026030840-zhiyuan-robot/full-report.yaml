        - Pilot or demonstration success fails to become repeat paid use
        - High
        - Provide customer cohort, acceptance, uptime, renewal, and support-cost data
        - High
    notes: >-
      The assigned sources confirm multi-country sales language and ecosystem compatibility but do not disclose
      counterparty names, concentration, or contractual protections. Ratings therefore remain conservative and require
      direct company evidence.
    claimRefs:
      - CR008
      - CR009
      - CR012
      - CR014
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Do not buy at an unverified public mark
      - - Confidence
        - Low-to-medium on price; higher on risk direction
        - Require primary financial and financing documents
      - - Risk rating
        - High
        - Size for dilution, liquidity, commercialization, and execution risk
      - - Valuation stance
        - Stretched / unverified
        - Demand a material entry discount until economics reconcile
    notes: >-
      Public sources provide conflicting private valuation references and incomplete operating economics; null or
      unverified inputs are not treated as zero.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Manufacturing scale can create a learning advantage
        - Forbes reports 10,000 total shipments; TrendForce reports a 10,000th robot milestone
        - Audited shipment-to-revenue and gross-margin bridge
      - - Market demand is large enough to support multiple winners
        - Mordor forecasts $3.93B in 2026 and $17.80B in 2031
        - Independent realized-demand and pricing evidence
      - - The private mark may already price in success
        - GetLatka reports $6.4B valuation and $10.8M annual revenue
        - Verified current revenue, margin, and financing instrument
      - - Heavy scaling can destroy equity value
        - 36Kr describes a self-built factory and investor pressure for commercial results
        - Cash runway, capacity utilization, warranty, and service-cost disclosure
    notes: >-
      Market forecasts and third-party database figures are directional or incomplete and are not interchangeable with
      audited company results.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Repeat deployments, improving unit economics, and financing access
        - Upside requires a new primary mark supported by revenue and margin
        - Possible but unproven
        - No audited conversion from shipments to sales
      - - Base
        - Commercialization progresses while economics remain private
        - Track and wait for price discovery or a discounted secondary
        - Most defensible on current evidence
        - Financing terms remain undisclosed
      - - Bear
        - Customer pilots fail to repeat and factory/support costs consume capital
        - Mark compresses; dilution and preferences reduce common-equity return
        - Material risk
        - Down-round, delayed listing, or rising warranty burden
      - - Stress
        - Competitive share and pricing compress before cash generation
        - Capital preservation dominates target-return pursuit
        - Must be monitored
        - Shipment growth without cash or contribution margin
    notes: >-
      Scenarios are qualitative because the assigned pool lacks audited revenue, gross margin, cash balance, cap table,
      preference terms, and a defensible public comparable multiple.
    claimRefs:
      - CV012
      - CV014
      - CV015
      - CV016
      - CV017
