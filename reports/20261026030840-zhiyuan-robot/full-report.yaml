chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product system and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan Robot, also branded AgiBot, is described by a company-profile source as a Shanghai embodied-AI
              company designing general-purpose humanoid and industrial robots together with the software that runs
              them. The same source identifies Deng Taihua and Peng Zhihui as founders, February 2023 as the founding
              month, and Shanghai as headquarters. Its reported product scope spans full-size humanoids, smaller
              humanoids, wheeled industrial platforms and related software, indicating a platform strategy rather than a
              single-model company. Independent reporting dates the A2 release to August 2024, while a later reference
              dates the commercial-grade A3 release to February 2026. A third-party profile lists 663 employees, but the
              retained Qichacha page is a repost of company hiring material and cannot independently validate that
              headcount. The chapter therefore treats employee count, office count and customer count as explicit
              diligence gaps rather than verified scale metrics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
