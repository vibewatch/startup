  - id: FR001
    title: Risk impact versus public mitigation evidence
    type: matrix
    summary: >-
      Residual exposure remains concentrated in data governance, physical safety, and commercialization controls that
      are not publicly verified.
    data:
      columns:
        - Potential impact
        - Public mitigation evidence
        - Company-specific evidence gap
      rows:
        - label: Data and cybersecurity compliance
          values:
            - Critical if a major incident occurs
            - Applicable laws and general legal guidance
            - Data map, audits, and incident records not verified
        - label: Physical safety and liability
          values:
            - Critical if a person is harmed
            - General humanoid-risk analysis
            - Safety case and liability allocation not verified
        - label: Reliability and field service
          values:
            - High if deployments are interrupted
            - Production milestones and product specifications
            - Failure, warranty, recall, and uptime data not verified
        - label: Supply-chain and market access
          values:
            - High if delivery or overseas access is blocked
            - Current counter-extraterritoriality guidance
            - Supplier and jurisdiction maps not verified
        - label: Commercial conversion
          values:
            - High if production does not become paid use
            - Secondary-source production milestones
            - Paid, active, retained, and expanded cohorts not verified
        - label: Financial model
          values:
            - High if economics cannot support deployment
            - Low-confidence revenue and valuation database entries
            - Audited economics, cash, burn, and financing terms not verified
    approximationNotes: >-
      Placement is a diligence-priority assessment, not an incident finding or probability estimate. "No
      company-specific evidence" refers only to the assigned public source set and does not prove that a control is
      absent.
    claimRefs:
      - CR001
      - CR003
      - CR010
      - CR012
      - CR014
