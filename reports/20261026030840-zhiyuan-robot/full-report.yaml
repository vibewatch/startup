  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan's public product surface is a family of embodied systems rather than a single software SKU. The
              available profile describes Yuanzheng/Expedition, Lingxi, and Genie robot families, plus GO-1 and AIDEA,
              while the Expedition A3 evidence specifies a full-size humanoid aimed at guidance, shopping assistance,
              entertainment, and light-duty grasp-and-deliver work. A3's stated 3 kg arm-end load, 2 m/s TCP speed,
              dual-battery design, and up to eight hours of runtime describe a commercial interaction platform, not
              proof of general autonomous labor. Independent factory reporting gives a more operational use case: four
              A2-W robots sorted more than 800 boxes in three hours at Fulin Precision. The same report says an A2-W
              performs at 0.7 of a human worker in normal operation and 1.4 to 2 workers when operated 24/7, figures
              that are site-specific estimates rather than a generalized productivity guarantee. The product implication
              is a portfolio that can address staged deployments, but each workflow still needs task-level validation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Architecture, data, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The technology stack is unusually explicit in public materials. Zhiyuan's profile names VLA+RL, WBC, WAM,
              and AgiBot World, while the public repository exposes GO-1, GO-1 Air, a dataset with about 1,003,672
              trajectories, model checkpoints, fine-tuning scripts, and a deployment server. The repository says the
              data was collected at 30 Hz for GO-1 pre-training and describes remote inference because a real robot may
              not have a powerful GPU. That is meaningful developer evidence of a reproducible research-to-deployment
              loop, but it does not establish production support levels or customer-specific uptime. Yicai adds an
              important deployment constraint: training relies on 95% simulated data and 5% real-world data, and
              unexpected situations still require continued real-world data and algorithm optimization. Initial
              deployments reportedly take three to four months, falling to three weeks or hours when 80% of a new
              environment overlaps a prior site. This supports a transfer-learning and integration-services thesis,
              while also identifying site variance as a principal scaling bottleneck.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
