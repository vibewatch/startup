company:
  name: Zhiyuan Robot
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Zhiyuan operates in a humanoid and embodied-robotics market moving from technical
    demonstrations toward scaled, workflow-specific deployment. Public estimates differ
    materially by scope and methodology, so the opportunity is best framed through
    separate global market lenses, policy and standards readiness, and buyer adoption
    constraints rather than a single additive TAM.
sections:
  - id: market-boundary
    title: Market boundary and value chain
    body: >-
      The relevant market is the sale and deployment of humanoid and embodied robots,
      including complete platforms, controls, software, sensors, actuators, dexterous
      hands, integration, and lifecycle support. It excludes general industrial robots,
      fixed automation, and unrelated AI software unless those products are directly
      incorporated into an embodied-robot deployment. This boundary matters because
      published estimates use different inclusions: Mordor describes a humanoids market
      segmented by motion, component, end-user industry, form factor, and geography,
      while GM Insights covers a broader global humanoid-robot market across product
      types, components, applications, and regions. Zhiyuan's product range spans
      complete robots and components, while the Gasgoo account shows its OmniHand can
      be compatible with robots from other manufacturers. The commercial opportunity is
      therefore both an OEM market and an upstream component market, but the two should
      not be added together without avoiding double counting.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and commercialization trajectory
    body: >-
      Public sizing supports a large but highly uncertain opportunity. GM Insights
      estimates the global humanoid-robot market at USD 7.9 billion in 2025, USD 10.9
      billion in 2026, and USD 192.7 billion in 2035, implying a 37.6% 2026-2035 CAGR.
      Mordor estimates a narrower humanoids market at USD 3.93 billion in 2026 and USD
      17.80 billion in 2031, with a 35.26% CAGR. These figures are not interchangeable:
      they have different market boundaries, forecast horizons, and proprietary methods.
      The operational signal is stronger than the headline TAM: TrendForce expects
      Chinese output growth of up to 94% in 2026 and says the sector will focus on
      tangible user value in the second half of 2026. Its report also describes AgiBot
      production rising from 1,000 to 5,000 and then 10,000 units, but those are
      company-level production observations, not a market-wide revenue forecast.
      Zhiyuan-specific SAM and SOM remain unisolated in the public evidence.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption drivers, and constraints
    body: >-
      The near-term buyer is more likely to be an industrial or institutional operator
      with a defined workflow than a general consumer. MIIT's policy interpretation
      identifies special environments, manufacturing, healthcare, household services,
      agriculture, and logistics as target application directions, with manufacturing
      examples including 3C and automotive. TrendForce similarly points to automotive,
      consumer electronics, and logistics orders as evidence of movement from trials
      toward demand. Budget ownership therefore sits with operations, manufacturing,
      logistics, facilities, or innovation teams, while engineering, safety, and IT
      functions influence acceptance. Adoption is constrained by integration, uptime,
      safety, certification, data governance, and total cost of ownership. China's
      2026 standards framework covers the full value chain and lifecycle, including
      applications, safety, ethics, data, training, inference, and deployment. This is
      a market-enabling signal, but it also raises qualification requirements. Gasgoo's
      account of Zhiyuan's dexterous-hand spinout illustrates a strategic choice between
      in-house control and specialized supply; the commercial outcome of that model is
      not yet proven.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: The investable market is workflow repeatability, not headline TAM
    body: >-
      The evidence points to a deployment market where repeatable tasks, production
      learning, integration effort, and safety acceptance determine conversion from
      pilot to recurring demand. Published TAM figures should be treated as scenario
      lenses rather than a directly serviceable revenue pool.
    claimRefs: [CM007, CM008, CM011, CM012]
  - calloutType: risk
    title: Zhiyuan-specific SAM and SOM are not publicly disclosed
    body: >-
      Public sources describe product scope, industry direction, and market forecasts,
      but do not disclose a reconciled Zhiyuan serviceable market, win rate, pricing,
      utilization, or recurring software contribution.
    claimRefs: [CM003, CM009, CM014]
