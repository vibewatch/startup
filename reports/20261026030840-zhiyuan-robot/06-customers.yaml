    rows:
      - [Fulin P.M. / Fulin Precision, Automotive and EV parts manufacturing, "A2-W robots moving cargo boxes between assembly stations", "Reported purchase after demonstration; production use is reported", "More than 800 boxes per shift over two shifts with almost zero errors in a livestream", "No audited long-run reliability, contract length, or renewal data"]
      - [China Mobile, Telecom and institutional procurement, "Tender for full-size and smaller humanoid robots", "Procurement award; deployment status not stated", "CNY124 million combined tender, including CNY78 million for AgiBot", "Tender is not proof of acceptance, utilization, or repeat purchase"]
      - [ASD, Retail, "100 X2 units across 100 retail stores", "Deployment stated in profile; paid status not stated", "Named multi-location deployment", "No store-level utilization, economics, or renewal data"]
      - [Chimelong, Entertainment and tourism, "More than 300 robots", "Deployment stated in profile; contract status not stated", "Named large-fleet venue deployment", "No task mix, uptime, revenue, or expansion data"]
    notes: "Enumeration is partial because public sources do not provide a complete customer list; company-profile entries are retained as reported but are not independent customer attestations."
    claimRefs: [CU006, CU007, CU010, CU011]
