company:
  name: Zhiyuan Robot
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Zhiyuan has moved beyond demonstrations into named industrial and telecom procurement, but the available record does not establish retention, repeat purchasing, customer-level economics, or concentration. The strongest proof is deployment-specific: Fulin Precision, China Mobile, ASD retail stores, and Chimelong are described, while cohort denominators and renewal data remain gaps.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Zhiyuan's visible customer motion is enterprise-led and scenario-specific rather than consumer-led. The evidence spans automotive and EV parts manufacturing, telecom, retail, entertainment, logistics, and public-facing guidance or performance use cases. Fulin Precision is described as an auto-parts supplier whose customers include Volkswagen, General Motors, BYD, NIO, and XPeng, but that does not make those automakers Zhiyuan customers. China Mobile's tender is a procurement event and therefore stronger than a logo, but the public article does not state deployment timing, acceptance criteria, or renewal. Retail and entertainment deployments show different buyer jobs: repetitive material handling, store interaction, and visitor engagement. This diversity is strategically useful, yet it also implies different integration, service, safety, and procurement requirements. Public sources do not disclose the share of revenue by vertical, buyer, geography, or channel, so apparent breadth should not be read as diversified revenue.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and evidence quality
    body: >-
      The adoption trajectory has several observable milestones, but the units are not interchangeable. Yicai reports a CNY124 million China Mobile tender, with CNY78 million attributed to AgiBot full-size bipedal robots; Assembly reports nearly 100 A2-W robots purchased by Fulin P.M.; and the company profile reports 100 X2 units across 100 ASD retail stores, more than 300 robots at Chimelong, and 20,000 cumulative robots produced by September 2026. Production is a company-profile metric, whereas a tender and a purchase are commercial commitments; neither proves active utilization, gross margin, service burden, or repeat orders. A Shanghai government page reprinting Jiefang Daily provides unusually concrete Fulin operating detail: a three-hour livestream described two logistics shifts and more than 800 cargo boxes per shift with almost zero errors, but the report does not provide an audited trial protocol or longer-run failure rate. The public record therefore supports increasing commercial proof, not a verified retention curve.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-deployments-and-durability
    title: Named deployments, durability, and concentration risk
    body: >-
      Named customer evidence is strongest when it identifies a counterparty, product, use case, and transaction or operating detail. Fulin provides a named buyer and a factory workflow, while China Mobile provides a named procurer and tender value. Public profiles also name ASD, Chimelong, and other scenario partners, yet they do not disclose contract duration, renewal, uptime, paid-versus-pilot status, or customer-specific outcomes. The company profile's 100 X2 units across 100 ASD stores and more than 300 robots at Chimelong are useful scale indicators, but the denominator is a deployment count rather than a customer cohort. There is no public top-10 customer concentration, churn, NRR, GRR, contract length, or service-cost disclosure. The diligence implication is to obtain a customer-level deployment ledger and reconcile orders, acceptance, live utilization, support tickets, renewals, and expansion by account.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: expansion-and-gaps
    title: Expansion path and unresolved customer diligence
    body: >-
      The observable expansion path is land-and-expand within operational settings: a robot is first demonstrated against a job, then a larger fleet or broader scenario is described. Fulin's reported conversion from a July demonstration to nearly 100 purchased A2-W units is the clearest example, while the China Mobile tender suggests a channel or institutional procurement route rather than a single-site pilot. Zhiyuan also has multiple product families and scenario labels, which could support cross-selling, but no source quantifies attach rates, pricing, deployment lead times, integration cost, or gross retention. The evidence does not establish whether the same buyer returns for additional robots, whether deployments are financed or sold, or how much field labor is required. Until those records are provided, customer quality should be assessed as promising but unproven on durability and economics, with concentration and implementation risk treated as material open questions.
    claimRefs: [CU014, CU015, CU016]
