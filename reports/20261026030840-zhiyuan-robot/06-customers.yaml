      - [Cumulative robots produced, "20,000 units", "2026-09", "Silicon Valley Invest Club profile; medium confidence", "Manufacturing scale signal", "Produced units are not shipments, live deployments, or paid customers"]
      - [Chimelong deployment, "More than 300 robots", "2026 profile", "Silicon Valley Invest Club profile; medium confidence", "Named venue-fleet signal", "No utilization, revenue, or renewal denominator"]
    notes: "Values are reported in different units and periods; production, tender value, purchased units, and operating throughput must not be combined into a conversion funnel or treated as equivalent adoption stages."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
