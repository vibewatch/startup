        - label: Scenario fit
          title: Repetitive or public-facing job
          touchpoints: ["Factory logistics, retail interaction, venue guidance or performance"]
        - label: Proof event
          title: Live task demonstration
          touchpoints: ["Fulin demonstration reported two logistics shifts", "Outcome and protocol are not independently audited"]
        - label: Initial commercial commitment
          title: Named purchase or tender
          touchpoints: ["Nearly 100 A2-W units reported for Fulin", "China Mobile tender reported at CNY124 million"]
        - label: Fleet deployment
          title: Multi-site or venue scale
          touchpoints: ["100 X2 units across 100 ASD stores", "More than 300 robots reported at Chimelong"]
        - label: Expansion
          title: Repeat purchase or broader workflow
          touchpoints: ["Not disclosed in retained sources", "Obtain account-level order and expansion history"]
        - label: Durability
          title: Renewal and utilization
          touchpoints: ["NRR, GRR, churn, uptime, and service burden not disclosed", "Treat retention as an open diligence question"]
    claimRefs: [CU006, CU007, CU010, CU011, CU014, CU016]
callouts:
  - calloutType: recommendation
    title: Underwrite named deployments, not logo breadth
    body: Request signed order forms, acceptance records, live-robot counts, utilization logs, support tickets, renewal status, and account-level revenue before treating customer traction as durable.
    claimRefs: [CU011, CU012, CU016]
