  - id: partner-network-dependency-risk
    title: Partner, Network, and Technology Dependency Risk
    body: >-
      Rain's business model creates a concentrated dependency on two card networks—Visa and Mastercard—both of which are now actively developing competing stablecoin infrastructure. Rain holds dual principal membership in both Visa and Mastercard, an unusual position that provides global card acceptance across 150+ countries. However, this also means Rain's entire card-acceptance surface depends on adherence to Visa and Mastercard operating regulations, BIN sponsorship agreements, and principal member eligibility requirements that either network can modify. Visa currently accounts for over 90% of on-chain card transaction volume in the stablecoin space, making it Rain's critical dependency: any change to Visa's stablecoin principal member policies, settlement rules, or merchant category restrictions would directly impact Rain's business. The BVNK/Visa Direct partnership, announced January 2026, demonstrates that Visa is building an alternative stablecoin infrastructure lane separate from Rain—giving it direct leverage over Rain's competitive position if Visa were to preference BVNK's technology post-Mastercard acquisition. Mastercard's definitive agreement to acquire BVNK for up to $1.8 billion (announced March 2026) represents the single largest near-term risk to Rain's partnership strategy: it removes BVNK as an independent competitor but replaces it with a Mastercard-backed stablecoin infrastructure capability that could directly displace Rain in enterprise accounts. Mastercard's own expansion of stablecoin settlement capabilities in June 2026 confirms this trajectory. Rain's announced ACH and SEPA integration plans depend on unspecified partner banks whose terms and availability are not public. Cloud infrastructure and smart contract dependencies are not publicly disclosed. Circle and Tether as stablecoin issuers whose tokens Rain's cardholders spend represent custodial counterparties whose operational integrity Rain cannot fully control.
