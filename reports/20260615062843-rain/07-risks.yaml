tables:
  - id: TR001
    title: Regulatory / Legal Risk Register
    columns:
      - Rule / License / Framework
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - GENIUS Act PPSI licensing / AML rules
        - United States
        - Rulemaking in progress; effective Jan 2027 or 120 days after final rules
        - High
        - Critical
        - Rain plans to secure US operational license with Series C capital; dual Mastercard/Visa memberships help establish credibility
        - Full compliance cost/timeline unknown; licensing denial or delay would block US market entry
        - Confirm Rain has filed or is preparing PPSI application; identify partner bank for PPSI subsidiary structure
      - - EU MiCA authorization (EMT issuer / CASP)
        - European Union
        - MiCA fully applicable December 2024; EMT authorization requires national regulator approval
        - High
        - High
        - Rain's stated plan includes EU licensing; ESMA MiCA passport enables EU-wide operation once one member state approves
        - Operating without authorization exposes Rain and its EU partners to enforcement action; timing unconfirmed
        - Confirm which EU member state Rain is targeting for MiCA authorization; review whitepaper and reserve disclosures
      - - Multi-state / federal MSB money transmission licensing
        - United States (51 jurisdictions)
        - GENIUS Act federally preempts state laws for qualifying PPSIs; transition period unclear for non-issuer facilitators
        - Medium
        - High
        - GENIUS Act's federal preemption reduces state-by-state burden; Rain's principal membership may provide partial regulatory coverage
        - Non-PPSI infrastructure facilitators may still require state licenses in some states during transition period
        - Obtain Rain's current state license inventory; confirm legal opinion on GENIUS Act preemption scope for infrastructure providers
      - - FinCEN / OFAC AML / sanctions enforcement
        - United States
        - Proposed rule published April 8, 2026; comment period closed June 9, 2026; final rule and compliance timeline pending
        - Medium
        - Critical
        - Rain's existing OFAC screening, transaction monitoring, and KYB/KYC programs are a partial mitigant; partner-managed programs require Rain to trust partner compliance quality
        - Enforcement actions for AML failures can reach $100K per day; reputational and network standing damage
        - Request AML program documentation and last independent audit report; confirm SAR filing capability and BSA officer appointment
      - - VASP / EMI licensing in key EM markets (LatAm, APAC, MENA)
        - Brazil, Singapore, UAE, others
        - Regulatory frameworks vary; Singapore MAS and UAE CBUAE have established VASP frameworks
        - Medium
        - High
        - Rain's partner-managed model may allow local partners to hold required licenses; Rain holds infrastructure-level risk only in some markets
        - Unclear which markets require Rain-level versus partner-level licensing; enforcement exposure in markets without compliant local partner
        - Map Rain's top LatAm and APAC markets against VASP license requirements; confirm which partners hold local licenses
      - - FATF Travel Rule compliance
        - Global (73% of countries enacted Travel Rule by Jan 2026)
        - FATF June 2025 update requires originator / beneficiary data to accompany transfers above threshold; 27% of countries not yet compliant
        - Medium
        - Medium
        - Rain screens wallet addresses and requires KYC at onboarding; Travel Rule obligations for cross-VASP transfers require technical solution
        - Cross-chain bridging can break Travel Rule data chains; 27% of Rain's 150+ country footprint may lack equivalent Travel Rule enforcement
        - Confirm Rain's Travel Rule implementation status; review technical solution for handling unhosted wallet transfers
    notes: >-
      Risk register covers publicly evidenced regulatory frameworks as of June 2026. Severity ratings reflect potential business impact if risk materializes without mitigant. 'Likelihood' refers to the probability of the risk event affecting Rain specifically within 24 months given current regulatory trajectory. Absence of a specific regulatory jurisdiction does not imply zero risk; Rain's 150+ country footprint means numerous additional local licensing requirements exist that are not fully enumerated here.
    enumerationScope:
      coverage: partial
      basis: >-
        Regulatory and legal risks publicly evidenced for Rain's stablecoin card-issuing and payment infrastructure business as of June 2026; excludes non-public regulatory correspondence, private contract disputes, and country-specific licensing requirements for all 150+ markets; rows ordered by severity.
