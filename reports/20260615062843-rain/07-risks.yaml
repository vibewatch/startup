company:
  name: Rain
chapter:
  number: 7
  title: Risks
  summary: >-
    Rain faces a layered risk profile dominated by regulatory uncertainty, network concentration, and competitive displacement. The highest-severity risks are: (1) multi-jurisdiction licensing requirements under the US GENIUS Act and EU MiCA that require substantial capital and uncertain timelines; (2) single-network dependency on Visa's principal membership rules and BVNK's integration with Visa Direct; (3) Mastercard's $1.8 billion acquisition of direct competitor BVNK, which threatens Rain's partnership lane at the world's second-largest card network; and (4) the stablecoin sector's structural AML/illicit-finance exposure—84% of 2025 illicit crypto flows involved stablecoins—which creates ongoing regulatory scrutiny risk for infrastructure providers like Rain. Mitigants include Rain's embedded compliance controls, KYB/KYC programs, dual Visa/Mastercard principal membership, and $338M in capital for licensing and infrastructure. Critical unresolved diligence gaps include undisclosed partner concentration, burn rate, security certifications, and succession planning.

sections:
  - id: regulatory-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      Rain operates in a rapidly crystallizing regulatory environment that represents both the largest near-term threat and the most defensible moat if navigated correctly. The US GENIUS Act, enacted July 18, 2025, established the first comprehensive federal framework for payment stablecoins, requiring permitted payment stablecoin issuers (PPSIs) to maintain 1:1 reserves in high-quality liquid assets and comply with full Bank Secrecy Act obligations. The OCC issued its Notice of Proposed Rulemaking on February 25, 2026, covering reserve assets, redemption, risk management, audits, and capital requirements. Critically, FinCEN and OFAC jointly proposed on April 8, 2026, that PPSIs be treated as financial institutions under the BSA—requiring written AML/CFT programs, mandatory OFAC sanctions compliance programs (the first time such a mandate has been legislated), and ongoing risk assessments. The full GENIUS Act regime becomes effective January 18, 2027, or 120 days after final rules are issued. Rain as a payment infrastructure provider—not a stablecoin issuer—faces a nuanced compliance position: it likely must ensure partner PPSIs are compliant with GENIUS Act requirements, but Rain itself may need to obtain or partner with licensed entities in the US market. The EU MiCA regulation, fully applicable since December 2024, requires stablecoin issuers and electronic money institutions operating in the EU to obtain authorization from national competent authorities. Rain operates in 150+ countries, requiring simultaneous compliance with multiple regulatory regimes. The Series C announcement explicitly states plans to secure operational licenses in North America, South America, Europe, Asia, and Africa—a multi-year, multi-jurisdiction licensing campaign that will consume significant capital and management attention with uncertain timelines and costs. PayPal's 2026 10-K confirms that digital asset regulatory fragmentation is a primary risk factor even for established platforms. Rain has not disclosed specific licenses held by jurisdiction beyond its Mastercard and Visa principal memberships, leaving investors without full visibility into its regulatory standing.
