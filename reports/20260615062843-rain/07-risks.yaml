  - id: TR002
    title: Operational / Quality / Security Risk Register
    columns:
      - Failure Mode
      - Likelihood
      - Severity
      - Mitigation Maturity
      - Residual Exposure
      - Unresolved Gap
    rows:
      - - AML / sanctions compliance breach (partner-side failure)
        - Medium
        - Critical
        - Partial — Rain transfers AML responsibility to partners in partner-managed programs; quality depends on partner compliance sophistication
        - Regulatory enforcement action against Rain or partner; reputational damage; potential loss of Visa/Mastercard principal membership
        - No public information on Rain's partner compliance audit cadence or results
      - - Card fraud / synthetic identity attack on partner program
        - High
        - High
        - Established — Rain uses velocity limits, MCC blocking, real-time transaction monitoring, and 3D Secure; acknowledges these are imperfect
        - Fraud losses primary responsibility of merchants / partners; Rain's exposure is reputational and operational
        - No public disclosure of Rain's annualized fraud rate or fraud-to-volume ratio
      - - Smart contract vulnerability in stablecoin wallet / card infrastructure
        - Low
        - Critical
        - Partial — external auditor reviews smart contracts before deployment; no continuous audit disclosed
        - Material loss of user funds in a smart contract exploit; loss of Visa/Mastercard program approval
        - No named auditor publicly disclosed; no public audit reports available
      - - Platform outage affecting card authorization globally
        - Low
        - High
        - Unknown — Rain does not publicly disclose uptime SLAs, redundancy architecture, or incident history
        - Partner programs go offline; contractual SLA breaches; partner churn
        - No public uptime history or disaster recovery documentation available
      - - Cross-chain bridging AML monitoring gap
        - High
        - High
        - Emerging — FATF March 2026 report identifies cross-chain bridging as a primary compliance blind spot; Rain has an onchain screening program but limited public detail on cross-chain coverage
        - Illicit funds transiting Rain's infrastructure via cross-chain routes could trigger regulatory action
        - No public documentation of Rain's cross-chain analytics capability
    notes: >-
      Failure modes represent operational and security risk scenarios identified from public sources and Rain's own risk disclosures. Mitigation maturity is assessed from public information only; Rain may have undisclosed controls. Severity is assessed relative to Rain's business continuity and regulatory standing.

  - id: TR003
    title: Partner / Dependency Risk Register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Visa card network
        - Visa Inc.
        - Global merchant acceptance network; BIN sponsorship; principal membership; stablecoin settlement
        - Critical — Visa accounts for >90% of on-chain stablecoin card volume; Rain holds Visa principal membership
        - Visa modifies principal member eligibility rules, stablecoin settlement access, or fees; or terminates Rain's membership
        - Critical
        - Rain holds dual Mastercard membership as partial fallback; Visa relationship is commercial not solely regulatory
        - Near-total dependency on Visa acceptance for Rain's card programs globally; Mastercard fallback not yet at scale
      - - Mastercard card network
        - Mastercard Inc.
        - Card network for non-Visa programs; principal membership; stablecoin settlement expansion
        - High — Rain holds Mastercard principal membership but most programs currently Visa-issued
        - Mastercard acquires BVNK and pivots away from Rain in favor of in-house BVNK infrastructure for enterprise clients
        - High
        - Rain's dual membership means Mastercard cannot easily terminate without consequence; existing programs protected
        - Mastercard/BVNK integration could divert new enterprise opportunities away from Rain over 12-24 months
      - - Circle (USDC issuer)
        - Circle Internet Financial
        - Primary stablecoin issuer for cardholder balances; settlement currency for Visa stablecoin programs
        - High — USDC is the primary stablecoin in Visa's stablecoin settlement pilot with Rain
        - Circle operational failure, regulatory license revocation, or USDC depeg event
        - High
        - USDC has maintained its peg and Circle has strong regulatory standing; regulatory risk is lower under GENIUS Act regime
        - A USDC depeg or Circle failure would directly affect Rain's Visa settlement pipeline
      - - Tether (USDT)
        - Tether Limited
        - Dominant stablecoin in LatAm and APAC where Rain has significant partner deployments
        - Medium — USDT represents ~64% of stablecoin supply globally; Rain partners in LatAm primarily use USDT
        - Tether excluded from GENIUS Act PPSI regime; regulatory action against Tether; USDT depeg
        - High
        - Rain can support multiple stablecoin types; partners could migrate to USDC or other compliant stablecoins
        - A Tether adverse event would disproportionately affect Rain's LatAm deployment base
      - - Partner banks (ACH/SEPA)
        - Undisclosed
        - Partner bank relationships for US ACH and EU SEPA network integrations planned in Series C roadmap
        - Unknown — Rain has announced plans but not named specific banking partners
        - Partner bank terminates relationship or fails to receive approval for Rain integration
        - High
        - Rain stated this as a development plan in Series C materials; execution risk before launch
        - Unconfirmed banking partnerships create execution dependency for US and EU market expansion
    notes: >-
      Dependencies assessed from public disclosures as of June 2026. Concentration ratings reflect Rain's current public business model; actual concentration may differ materially. Counterparty risk for undisclosed banking partners cannot be fully assessed without diligence.

