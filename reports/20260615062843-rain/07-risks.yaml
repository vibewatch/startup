  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: concentration-risk
      missingEvidence: Rain's top-10 partner list with annual transaction volume and revenue concentration percentage by partner
      whyItMatters: Without knowing revenue concentration, investors cannot assess the risk of major partner churn; a 3–5 partner exit could be thesis-breaking
      diligencePath: Request from Rain's investor relations team — top-10 partner list with annual card transaction volume, partner NRR, and program termination history since 2023
      relatedQuestionRefs:
        - QR010
      relatedTableRefs:
        - TR004

    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: Rain's current monthly operating run rate, burn rate, and runway with $338M total raised
      whyItMatters: Burn rate uncertainty makes it impossible to assess whether Series C funding will last through Rain's multi-jurisdiction licensing campaign and infrastructure buildout
      diligencePath: Request from Rain — last-12-months operating expense run rate, projected burn through major licensing milestones, next fundraising trigger thresholds
      relatedQuestionRefs:
        - QR011

    - type: private-evidence-only
      severity: material
      topic: key-person-risk
      missingEvidence: Succession plan for CEO Farooq Malik and detailed executive team composition beyond CEO and named co-founder
      whyItMatters: Key person concentration in a founder-CEO is a material governance risk for a company scaling rapidly through critical regulatory windows; investors need succession clarity
      diligencePath: Request from Rain — full C-suite list with roles and tenures; succession planning documentation; equity vesting and retention structures for key executives; board composition and oversight function
      relatedQuestionRefs:
        - QR012
        - QR028

    - type: missing-source
      severity: material
      topic: security-risk
      missingEvidence: Third-party security certifications (SOC 2 Type II, PCI DSS, ISO 27001) and independent penetration testing reports for Rain's infrastructure
      whyItMatters: Absence of published security certifications increases enterprise partner due diligence risk and may limit Rain's ability to win regulated financial institution accounts that require certified infrastructure
      diligencePath: Request from Rain — current certification portfolio, audit schedule, and most recent penetration test executive summary; confirm smart contract auditor names and report publication status
      relatedQuestionRefs:
        - QR021

    - type: private-evidence-only
      severity: material
      topic: settlement-risk
      missingEvidence: Rain's contractual protections against stablecoin depeg events and its reserve and counterparty risk management approach for Circle/USDC and Tether/USDT exposures
      whyItMatters: A major stablecoin depeg event (>5%) could generate material losses for Rain's partners and create reputational damage for Rain's infrastructure brand
      diligencePath: Request from Rain — describe reserve management practices, insurance or hedging against stablecoin issuer default, partner indemnification provisions, and circuit-breaker mechanisms for depeg scenarios
      relatedQuestionRefs:
        - QR025
        - QR032

    - type: private-evidence-only
      severity: minor
      topic: regulatory-licensing
      missingEvidence: Detailed timeline, cost estimates, and legal counsel arrangements for Rain's planned multi-jurisdiction licensing campaign in 5 regions
      whyItMatters: Licensing timelines and costs directly affect Rain's burn rate and market expansion schedule; delays could trigger need for additional capital before profitability
      diligencePath: Request from Rain — regulatory roadmap by jurisdiction with expected application dates, external legal counsel arrangements, and capital reserves allocated for licensing fees and compliance infrastructure build
      relatedQuestionRefs:
        - QR003
      relatedTableRefs:
        - TR001

