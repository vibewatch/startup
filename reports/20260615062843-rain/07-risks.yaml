  - id: mitigation-kill-criteria
    title: Mitigation, Monitoring, and Kill Criteria
    body: >-
      Rain's mitigants are most mature in its compliance and operational controls and least mature in its regulatory licensing pipeline and competitive positioning. The company's embedded KYB/KYC, OFAC screening, transaction monitoring, and smart contract audit practices are above industry average for a Series C stablecoin company. Rain's dual principal membership in Visa and Mastercard creates network diversification that reduces—but does not eliminate—single-network dependency. The $338M total capital raise provides a licensing war chest. Investors should track the following kill criteria as thesis-break triggers: (1) any regulatory enforcement action or license denial in a core market (US, EU, UK, or Singapore) within 12 months; (2) Mastercard/BVNK successfully onboarding 3+ of Rain's top 10 partners to a competing infrastructure; (3) Rain failing to file for at least one major market operational license within 6 months; (4) any material AML compliance failure or sanctions breach that triggers FinCEN/OFAC enforcement; (5) a co-founder or CTO departure within 12 months; and (6) Rain's growth figures reverting to sub-10x year-over-year upon independent measurement. Core diligence asks that remain unanswered: top-10 partner revenue concentration, monthly burn rate and runway, security certifications (SOC 2/PCI DSS), succession plan, and the specific license portfolio by jurisdiction.
