callouts:
  - calloutType: risk
    title: Mastercard / BVNK Acquisition — Highest Near-Term Competitive Risk
    body: >-
      Mastercard's definitive agreement to acquire BVNK for up to $1.8 billion (announced March 2026) is the single most strategically threatening near-term development for Rain. BVNK was already powering stablecoin payments for Visa Direct pilot programs as of January 2026—demonstrating its capability to operate across both major card networks simultaneously. Once Mastercard fully integrates BVNK, it will have a captive stablecoin infrastructure capability that it can offer to enterprise clients as a bundled solution, potentially displacing Rain in accounts that value a single-vendor Mastercard relationship. Rain's mitigant is its existing Visa principal membership and embedded partner relationships; but the 12–24 month post-acquisition integration window is the highest-risk period. Investors should monitor BVNK product announcements and any Rain partner migrations to Mastercard/BVNK as the primary thesis-break signal.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR041

  - calloutType: risk
    title: GENIUS Act Compliance Window — 18-Month Regulatory Deadline
    body: >-
      The GENIUS Act's full regulatory regime is expected to become effective in January 2027 or within 120 days of final rules being issued—creating an 18-month compliance window for Rain to secure PPSI-compatible arrangements in the US market. FinCEN and OFAC's proposed AML rules closed their comment period June 9, 2026, and final rules are expected in late 2026. Rain must decide whether to become a PPSI, partner with an insured depository institution PPSI subsidiary, or operate purely as a non-issuing infrastructure provider (a position that may still require regulatory clarity on AML obligations). Failure to achieve a compliant structure by the January 2027 effective date could expose Rain and its US-based partners to enforcement risk. This risk is material but not catastrophic: Rain's announced use of Series C capital explicitly includes licensing, and the company is already engaged with regulators through its Mastercard and Visa principal memberships.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR020
      - CR030
      - CR035

