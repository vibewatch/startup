      - Dependency or Gap
      - Likelihood
      - Severity
      - Mitigation
      - Diligence Path
    rows:
      - - CEO (Farooq Malik)
        - Rain's founder-CEO is the primary external spokesperson for all major partnerships and fundraising; no public succession plan
        - Low
        - Critical
