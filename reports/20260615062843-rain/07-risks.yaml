  - id: fraud-aml-security-risk
    title: Fraud, AML, and Security Risk
    body: >-
      The stablecoin payments sector faces a structural AML/illicit-finance liability that creates ongoing regulatory and reputational risk for infrastructure providers like Rain. FATF's March 2026 targeted report found stablecoins accounted for 84% of all illicit virtual asset transaction volume in 2025—including money laundering by state-linked actors from North Korea and Iran, ransomware proceeds, and sanctions evasion. Chainalysis reported total illicit crypto activity reached $154 billion in 2025, up 162% year-over-year, while TRM Labs estimated $158 billion. Both FATF and compliance analysts identify cross-chain bridging as a primary monitoring blind spot: stablecoins that are bridged from one blockchain to another can exit compliance controls applied on the original chain, and regulators have not yet closed this gap. Rain's compliance framework addresses several vectors: it completes KYB/KYC due diligence on all partners before program launch, applies OFAC-compliant geographic and sanctions controls at onboarding, monitoring, and transaction levels, continuously monitors blockchain addresses for suspicious activity, and has smart contracts reviewed by external auditors. In partner-managed programs, however, Rain transfers primary AML and fraud risk responsibility to the partner—creating dependence on the compliance quality of every entity in its 200+ partner network. Rain's risk guide explicitly acknowledges that card sharing, credential theft, and secondary markets exist across all card-based payment systems, and that fraud losses are primarily the responsibility of merchants and partners. The GENIUS Act's proposed AML rules, if finalized, will require Rain or its PPSI partners to file Suspicious Activity Reports, maintain risk assessments, and implement sanctions compliance programs—capabilities that represent both cost and ongoing operational risk. PwC's analysis notes the new framework focuses on program effectiveness, not just existence, meaning enforcement exposure scales with compliance maturity.
