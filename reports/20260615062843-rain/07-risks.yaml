        - "Request from Rain: succession plan documentation, equity/retention structure for CEO, board composition and oversight"
      - - Co-Founder / CTO / Engineering Leadership
        - Rain's technical architecture (smart contracts, card issuing, compliance platform) has concentrated knowledge risk; no public CTO named
        - Low
        - High
        - Technical team depth not publicly disclosed; $338M funding enables competitive compensation
        - "Request from Rain: full executive team with roles; key engineer retention agreements; documented architecture and bus-factor mitigation"
      - - Compliance / Legal team scaling
        - Rapidly expanding regulatory obligations (GENIUS Act, MiCA, FATF Travel Rule) require significant compliance headcount additions
        - High
        - High
        - Rain's compliance framework already exists; Series C provides capital to hire; compliance team size not disclosed
        - "Request from Rain: current compliance headcount and structure; planned hiring for GENIUS Act and MiCA compliance; key compliance officer tenure"
      - - Multi-jurisdiction licensing execution
        - Securing operational licenses in 5+ regions requires dedicated regulatory affairs teams and legal counsel in each jurisdiction
        - Medium
        - High
        - Rain has stated this as a primary use of Series C capital; timeline and execution uncertainty is high
        - "Request from Rain: license application status by jurisdiction; external regulatory counsel arrangements; milestone timeline"
    notes: >-
      People and execution risks assessed from public disclosures. Actual team composition, retention arrangements, and succession planning are not publicly disclosed; this table reflects publicly available evidence and inferred gaps. Severity is assessed relative to Rain's ability to execute its stated strategy.

  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Regulatory license denial or enforcement action
        - Public regulatory filings, FinCEN/OCC announcements, Visa/Mastercard network status
        - Any enforcement action, license denial, or cease-and-desist from a Tier 1 regulator (OCC, FinCEN, FCA, ESMA)
        - Thesis-break; material business risk; initiate position review immediately
      - - Mastercard/BVNK displaces Rain in 3+ named enterprise accounts
        - Partner press releases, BVNK product announcements, Rain customer win/loss reporting
        - 3+ of Rain's publicly named top-tier partners (Western Union, Nuvei, KAST, Nomad) announce migration to BVNK or comparable competitor within 18 months
        - Thesis-break signal; revenue concentration risk materially elevated; re-evaluate competitive moat
      - - Stablecoin AML enforcement action against Rain or major Rain partner
        - FinCEN SAR data, OFAC SDN list updates, news monitoring for Rain or named partner names
        - Any SAR filing publicly linked to Rain, or named partner placed on OFAC SDN list
        - Immediate regulatory and reputational risk; Visa/Mastercard membership at risk; re-evaluate investment
      - - Growth figure independent verification failure
        - On-chain analytics (Dune Analytics, Nansen), Visa/Mastercard issuer volume disclosures, partner press releases
        - Rain's actual annualized card volume independently measured below $1.5B (vs. $3B stated) or YoY growth below 10x
        - Investment thesis depends on growth; thesis downgrade to 'track' pending re-verification
      - - Burn rate exceeds $30M/month with less than 18 months runway
        - Board updates, investor letters, new fundraising announcements
        - Rain begins Series D process within 18 months of Series C close, or discloses operating losses exceeding $300M annualized
        - Capital risk; dilution risk; re-evaluate if new round is at flat or down valuation
    notes: >-
      Kill criteria are advisory thresholds for investment monitoring purposes. Triggers are based on public observability; some events may not be publicly disclosed in real time. Regulatory enforcement actions are typically disclosed through public databases (FinCEN enforcement, OFAC SDN list, SEC filings) within 30-90 days of occurrence.

