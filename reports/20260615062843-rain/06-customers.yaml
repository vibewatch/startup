- id: adoption-trajectory-and-growth-signals
  title: Adoption trajectory and growth signals
  body: 'Rain''s adoption narrative is carried by company-stated metrics that appear consistently across funding announcements and the CEO''s Series B letter. The most frequently cited numbers are: card transactions up 10x since January 2025; card base grew 30x year-over-year entering 2026; payment volume grew 38x year-over-year entering 2026; end users transacting in over 150 countries; and a single Rain integration unlocking a serviceable market of over 1.5 billion people. These figures appear in official company materials and are summarized by Forbes and The Block in their Series C coverage, but no independent audit or third-party source has verified the underlying unit economics. The growth context is important: stablecoins processed $27.6 trillion in transaction volume in 2024—more than Visa and Mastercard combined per company disclosures—while total stablecoin market capitalization surpassed $300 billion in 2025. The number of active stablecoin wallets exceeded 30 million globally, growing 50% year-over-year. Rain''s trajectory sits against this tailwind. At the regional level, Latin America shows concentrated adoption: Takenos (LatAm, 20 countries, $560M+ volume, 20% MoM growth through 2025) and Félix Pago ($6B+ in remittances) are the two LatAm-focused public deployments using Rain-issued cards or Rain-adjacent stablecoin infrastructure. Rain''s LatAm report notes USDT and USDC together account for more than 90% of stablecoin transfer volume in the region. Monad integration brought two additional early-stage builders (Rhythmic and Avici) to the pipeline, signaling developer-side demand even if not yet at production scale.'
