figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Rain's visible customer journey starts with a partner embedding the Rain API, moves through program configuration and compliance onboarding, then splits into production deployment for end users across five distinct buyer verticals.
  data:
    nodes:
    - id: jm1
      label: Partner discovers Rain
      detail: Fintech, enterprise, government entity, or AI company identifies stablecoin card or payments infrastructure need; Rain acquired via network, marketing, or strategic partnership (Nuvei, Western Union).
      tone: neutral
    - id: jm2
      label: API integration and program setup
      detail: Partner integrates Rain's single API; configures card program (virtual/physical, credit/prepaid), wallet type, and compliance controls. Rain claims 8–12 week launch timeline versus months for alternatives.
      tone: positive
    - id: jm3
      label: Compliance onboarding
      detail: Rain embeds KYC, AML, transaction monitoring, and card-network compliance into the program. Partners deploying agentic cards go through Rain's Know Your Agent process.
      tone: neutral
    - id: jm4
      label: Production launch
      detail: Live card or payment product deployed to end users. Examples include Spritz Card, Lydian Visa Platinum, FRNT state card, KAST Visa card, Sponge agent cards.
      tone: positive
    - id: jm5
      label: Expansion surface
      detail: Partner scales existing program, adds new geographies (via Visa/Mastercard principal membership), or adds modules (wallets, payments, accounts) through the same integration.
      tone: positive
    - id: jm6
      label: Network access (Western Union / Nuvei)
      detail: Strategic partners extend Rain's distribution without Rain owning the sales channel. Western Union cash-out adds 150+ countries; Nuvei adds enterprise payment stack integration.
      tone: positive
    - id: jm7
      label: Concentration and churn risk
      detail: No disclosed NRR, logo churn, or partner count. Small named partner base and undisclosed revenue distribution create unquantified concentration risk.
      tone: negative
