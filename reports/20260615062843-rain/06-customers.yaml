- id: customer-validation-gaps
  title: Customer validation gaps and open questions
  body: 'The most significant customer validation gaps for Rain are: (1) No disclosed partner count — Rain''s website, investor materials, and press releases have never stated how many active card program partners or API customers it has. The named case studies (six to eight) almost certainly understate the actual number, but diligence cannot assess concentration without knowing the denominator. (2) No disclosed retention metrics — NRR, GRR, and logo churn are the standard metrics for a B2B SaaS or payments infrastructure business; Rain has not disclosed any of them. (3) Growth figure independence — the 30x card and 38x volume growth numbers are company-stated and appear in funding documents; no independent measurement source (interchange data, on-chain analytics, or card network reporting) has corroborated them. (4) Enterprise depth — Nuvei and Western Union are announced partnerships, not documented deployments with outcome metrics; the actual transaction volume flowing through these partnerships is unknown. (5) Developer ecosystem — Rain''s API documentation is gated behind login at docs.rain.xyz, and the public GitHub organization (github.com/userain) shows minimal activity. Community-side signals (HackerNews, forums) are thin. This limits external assessment of integration quality and developer experience. For investors, the key diligence requests are: a top-10 partner list with annual transaction volume, card program NRR and gross renewal rate, revenue concentration by partner, and any partner churn or program termination history since 2023.'
