- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact if materialized
  - Diligence path
  rows:
  - - API-first single integration attracts new fintech builds
    - Unknown number of unnamed partners; disclosed names are few
    - If top 3 partners drive 70%+ of volume, churn risk is existential
    - Request partner count, top-10 volume share, and HHI index
  - - Visa + Mastercard principal membership enables geography expansion
    - Geographic expansion concentrates on partner willingness to expand programs
    - Partner growth stalls if key partners hit their own market limits
    - Request partner expansion roadmaps and multi-geography deployment commitments
  - - Western Union distribution amplifies cash-out geography
    - Single large distribution partner dependence
    - WU program rules or strategy change could reduce Rain''s cash-out geography
    - Review WU integration contract terms, exclusivity clauses, and volume minimums
  - - Nuvei integration adds enterprise channel
    - Enterprise adoption depends on Nuvei''s own sales motion
    - Nuvei contract changes or competitive moves by Mastercard (acquiring BVNK) could redirect enterprise flow
    - Verify Nuvei integration depth and exclusivity; assess Mastercard-BVNK competitive risk
  - - Agentic commerce opens new buyer cohort
    - Regulatory uncertainty around AI agents as payment principals
    - Regulatory intervention could restrict or ban autonomous payment agents, reducing this vertical
    - Track CFPB and card-network policy on agentic payments; review Rain''s regulatory position
  - - LatAm fintech growth (Takenos, Félix Pago, Nomad) adds geography depth
    - Currency instability and regulation make LatAm concentration a two-edged sword
    - Regulatory restrictions on stablecoins in Brazil or Argentina could halt key programs
    - Assess local licensing status of each LatAm partner; review stablecoin regulation per country
  notes: Concentration impact assessments are hypothetical; Rain has not disclosed revenue distribution or partner count. Diligence paths reflect standard infrastructure investment diligence.
