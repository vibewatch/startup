company:
  name: Rain
chapter:
  number: 6
  title: Customers
  summary: 'Rain operates as a B2B2C infrastructure provider; its direct buyers are fintechs, enterprises, exchanges, neobanks, and government entities, who embed Rain''s stablecoin card and payments platform into products that their own end users consume. Publicly disclosed named deployments span five verticals — crypto-native consumer fintechs (Spritz, Lydian, KAST), cross-border and remittance fintechs (Nomad, Takenos, Felix Pago), enterprise and institutional payments (Nuvei, Western Union), government and public-sector (FRNT/Wyoming Stable Token), and agentic AI commerce (Sponge). Growth signals are strong but company-stated — Rain reports card transactions up 10x since January 2025, a 30x year-over-year card base, and 38x payment volume entering 2026, with end users in over 150 countries. Customer-facing evidence quality is best for the crypto-native vertical where detailed case studies exist; enterprise and government deployments are evidenced by press releases but lack outcome metrics. Critical gaps include no disclosed NRR or churn data, no independent verification of growth figures, and no publicly disclosed total partner count — all of which are standard diligence requests for a B2B payments platform at this stage.'
sections:
- id: customer-segmentation-and-buyer-profiles
  title: Customer segmentation and buyer profiles
  body: 'Rain targets a B2B audience of fintechs, enterprises, exchanges, marketplaces, and developers who want to issue stablecoin-powered cards or move money globally without building banking infrastructure themselves. Five distinct buyer segments are publicly evidenced. First, crypto-native consumer fintechs: companies like Spritz, Lydian, and KAST whose end users hold stablecoins and want to spend them in everyday commerce. These buyers need Visa acceptance, no-lockup card funding, and compliance built in. Second, cross-border payment and remittance platforms: Nomad (3.8M+ Brazilian users), Takenos (20-country LatAm coverage, $560M+ in volume), and Felix Pago ($6B+ in WhatsApp-based remittances) use Rain''s stablecoin wallets and cards as the "spend" layer for dollar savings products. Third, enterprise and institutional platforms: Nuvei integrates Rain card issuing into its enterprise payment stack, and Western Union''s Digital Asset Network uses Rain-powered wallets to bridge stablecoin balances to cash at 150+ country retail locations. Fourth, government and public-sector entities: Wyoming''s Frontier Stable Token (FRNT) program uses a Rain-issued card as the first production deployment of a U.S. state-issued digital asset, demonstrating a regulatory blueprint others could follow. Fifth, agentic AI commerce: Sponge (YC-backed) uses Rain''s Agent Control Layer to issue stablecoin-funded Visa cards for autonomous AI agents. Each segment has a different procurement decision-maker: a product or engineering leader at a fintech, a payments strategist or treasurer at an enterprise, a government procurement office at the state level, or an AI infrastructure team at an agent-first company. Rain''s API-first model and single integration point covering card issuing, wallets, accounts, and payments means the same platform serves all five personas without customization overhead.'
