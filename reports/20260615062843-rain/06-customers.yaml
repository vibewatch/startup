  evidenceGaps:
  - type: missing-source
    severity: high
    topic: total partner count and customer concentration
    missingEvidence: Rain has not disclosed its total active partner count, revenue distribution, or what percentage of transaction volume any single partner contributes.
    whyItMatters: Concentration risk cannot be assessed without knowing how many partners exist and whether the disclosed six to nine named customers represent 50% or 90% of volume.
    diligencePath: Request a full partner list, top-10 revenue concentration, and HHI index for card transaction volume by partner program.
    relatedQuestionRefs:
    - QU021
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: high
    topic: retention and churn metrics
    missingEvidence: No public source discloses NRR, GRR, logo churn, cohort-level retention, contract length, or renewal history across any Rain partner segment.
    whyItMatters: A B2B payments infrastructure business at Rain's stage should be able to evidence retention in the 90%+ range; absence of any retention data makes durable customer value unverifiable.
    diligencePath: Request NRR, GRR, contract renewal rate, and logo churn by partner vintage cohort. Request standard contract terms and termination-for-convenience provisions.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU004
    relatedFigureRefs:
    - FU004
  - type: missing-source
    severity: high
    topic: independent verification of growth metrics
    missingEvidence: Rain's 30x card growth and 38x volume growth are company-stated in funding documents with no independent audit, on-chain corroboration, or card network reporting.
    whyItMatters: If stated growth figures are based on a small base or include non-recurring deployment events, the underlying run-rate economics could be significantly different from the headline numbers.
    diligencePath: Request audited or independently certified transaction volume and card issuance data by period, or cross-reference with card network interchange reports.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU002
  - type: restricted-access
    severity: notable
    topic: enterprise and institutional deployment outcomes
    missingEvidence: Nuvei and Western Union partnerships are announced but lack deployment outcome metrics, live transaction volumes, or operational case studies.
    whyItMatters: Strategic partnerships with Nuvei and Western Union are prominent in Rain's customer narrative; without outcome data, they represent announced intent rather than proven customer value.
    diligencePath: Request deployment timeline, go-live dates, monthly transaction volume, and named enterprise customer examples from each strategic partnership.
    relatedQuestionRefs:
    - QU011
    - QU017
    - QU018
    relatedTableRefs:
    - TU003
  - type: restricted-access
    severity: notable
    topic: developer ecosystem and API community
    missingEvidence: Rain's API documentation is gated; public GitHub activity is minimal; HackerNews and developer community signals are thin. No third-party developer reviews or integration testimonials are publicly available.
    whyItMatters: Developer adoption depth is a leading indicator for enterprise stickiness; limited developer community visibility makes platform depth difficult to assess independently.
    diligencePath: Request developer onboarding analytics, active API key counts, integration support ticket volumes, and developer NPS scores.
    relatedQuestionRefs:
    - QU024
    - QU026
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: notable
    topic: agentic commerce and Latin American partner volume data
    missingEvidence: Sponge's production deployment scope on Rain's Agent Control Layer and Latin American partners' (Takenos, Felix Pago) actual transaction volumes through Rain infrastructure are not publicly disclosed.
    whyItMatters: The agentic and LatAm customer segments are positioned as growth vectors; without volume or usage depth data, their contribution to Rain's overall payment volume cannot be independently estimated.
    diligencePath: Request production partner deployment metrics for Sponge and regional volume data for Takenos and Felix Pago, including monthly active users, card GMV, and wallet funding volumes.
    relatedQuestionRefs:
    - QU014
    - QU015
    relatedTableRefs:
    - TU003
