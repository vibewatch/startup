- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale indicator
  - Revenue / strategic value
  - Key gap
  rows:
  - - Crypto-native consumer fintech
    - Fintech product team (buyer); crypto wallet holders (user)
    - Spend stablecoin balances at any Visa merchant without lockup or conversion steps
    - Spritz, Lydian, KAST — multiple named deployments
    - Direct transaction fee revenue per swipe; high-frequency spend
    - No disclosed per-partner transaction volume or GMV
  - - Cross-border / remittance fintech
    - Fintech or remittance platform (buyer); migrant workers, gig workers (user)
    - Instant spendable remittances; dollar-denominated savings + card
    - Nomad (3.8M+ users), Takenos ($560M+), Félix Pago ($6B+)
    - High-volume cross-border flows; growth markets (LatAm, Africa)
    - Rain's specific revenue share from these flows not disclosed
  - - Enterprise and institutional payments
    - Payments platform (Nuvei) or financial network (Western Union) (buyer); B2B merchants (user)
    - Stablecoin card issuing within enterprise stack; stablecoin-to-cash at retail
    - Nuvei, Western Union — enterprise-scale distribution
    - Very high strategic value if transaction volumes ramp; may drive disproportionate volume
    - Partnership announced only; no live-volume metrics disclosed
  - - Government and public-sector
    - State or government agency (buyer); citizens and contractors (user)
    - State-issued stablecoin card program; government-to-business payments
    - FRNT (Wyoming Stable Token) — first U.S. state production deployment
    - High reputational and regulatory-precedent value; monetization path less clear
    - Single state pilot; no replication to other states or federal programs confirmed
  - - Agentic AI commerce
    - AI product company or enterprise AI team (buyer); AI agent (automated user)
    - Scoped virtual cards for autonomous agents; programmable per-agent spend limits
    - Sponge (YC-backed) — confirmed production; category is early
    - Emerging category; long-term volume potentially large if agentic commerce scales
    - Regulatory treatment of AI as payment principal unresolved; fraud model early-stage
  notes: Segment scale indicators derive from named public deployments only; actual partner count per segment is not disclosed. Revenue / strategic value is inferred, not company-stated.
