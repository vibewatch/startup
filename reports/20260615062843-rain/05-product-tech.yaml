  rows:
  - - Card issuing
    - Fintechs, wallets, exchanges, brands, DAOs
    - Production — Visa and Mastercard principal membership, 150+ countries, 175M+ merchants
    - Daily stablecoin settlement, 60% lower collateral, 8–12-week launch vs. 5–12 months
    - Credit-loss exposure, underwriting standards, interchange split economics
  - - Payments / disbursements
    - Enterprises, payroll processors, marketplace operators
    - Production — 24/7 cross-border with liquidity-aware routing and programmable flows
    - Single API across fiat, stablecoin, and cross-chain; built-in FX conversion
    - Network reliability SLAs, custody chain during routing, FX spread disclosure
  - - Wallets
    - Crypto-native consumers, fintechs, exchanges
    - Production — multi-chain, custodial and non-custodial, embedded or headless
    - Built-in AML/KYC from day one, brandable, connects directly to card programs
    - Non-custodial security model, smart-contract audit scope, wallet insurance coverage
  - - Accounts / on-ramps
    - All partner types needing ACH or wire-to-stablecoin entry
    - Production — ACH, wire, and direct stablecoin funding; FDIC-eligible via SSB
    - Dual fiat and stablecoin funding path; no crypto knowledge required for users
    - Banking-partner concentration (SSB), FDIC coverage limits, on-ramp fee disclosure
  - - Agentic payment cards
    - AI agents operating in enterprise contexts
    - Early production — programmatic single-use virtual-card issuance for AI agents
    - Scoped spend limits, compliance controls at program level, verified account binding
    - Volume scale, fraud model for autonomous agents, regulatory recognition of AI principals
  - - Cross-chain routing (Multiplex via Fern)
    - All modules requiring multi-chain liquidity
    - Production — 10+ blockchains, sub-week developer deployment
    - Acquired capability; eliminates per-chain integration; supports stablecoin-fiat movement
    - Multiplex smart-contract audit status, bridge security model, chain outage fallback
