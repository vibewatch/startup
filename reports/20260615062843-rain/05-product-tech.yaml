chapter:
  number: 5
  title: Product & Technology
  summary: Rain operates a vertically integrated stablecoin payments platform comprising four primary modules—card issuing, payments, wallets, and accounts—all exposed through a single API. As both a Visa and Mastercard Principal Member, Rain eliminates traditional banking intermediaries to offer card programs usable at 175-plus million merchant locations across 210-plus countries. Its defining technical differentiator is daily stablecoin settlement (including weekends and holidays) that cuts partner collateral requirements by up to 60 percent versus fiat programs. The 2025 acquisition of cross-chain routing startup Fern added a Multiplex engine that spans 10-plus blockchains and enables sub-week developer deployment. Compliance controls—PCI DSS, SOC 2, audited smart contracts, built-in KYC/AML—are embedded natively, not bolted on. Developer documentation is gated behind login and GitHub presence is minimal, which limits third-party auditability of the technical stack. Key open questions include blockchain-network concentration risk, regulatory-license scope per jurisdiction, and depth of financial controls in the settlement layer.
sections:
- id: product-suite-and-customer-workflows
  title: Product suite, module map, and customer workflow
  body: 'Rain''s product suite maps cleanly onto the four stages of a stablecoin payment lifecycle: money-in (accounts and on-ramps), storage (wallets), spending (card issuing), and money-out (payments and disbursements). The card-issuing module is the most mature and publicly evidenced component. As a Visa Principal Member since March 2025 and a Mastercard Principal Member announced in April 2026, Rain can sponsor card programs across key regions through a single operational model, accepting cards at over 175 million Mastercard and over 150 million Visa merchant locations globally. Rain issues both virtual and physical credit and prepaid cards, supports Apple Pay and Google Pay, and offers configurable spend controls for consumer, business, and agentic use cases. The payments module provides 24/7 cross-border payment execution with built-in currency conversion, automatic swap routing across liquidity sources, and programmable conditional logic for disbursements, treasury rebalancing, marketplace payouts, and merchant settlements. The wallets module offers custodial and non-custodial options, multi-chain asset support, and a fully brandable embedded wallet-in-a-box with headless API or flexible UI components. The accounts module manages virtual account creation and funding through ACH, wire, or direct stablecoin transfer. Customer use cases visible in public materials include crypto-native consumer cards (Spritz, Lydian), state-issued stablecoin programs (Wyoming FRNT on Avalanche), enterprise cross-border payroll (Nomad), marketplace payouts, and AI-agent scoped virtual cards. The Lydian card demonstrates a premium consumer use case where Tether-backed spending converts to merchant-accepted local currency in real time without cardholder conversion steps.'
