- id: compliance-security-and-developer-experience
  title: Compliance, security controls, and developer experience
  body: 'Rain''s compliance posture is built into the product, not layered on afterward. KYC requirements, transaction monitoring, and risk controls are embedded from day one across wallets and card programs. Cards are issued by Third National pursuant to a Visa license, with Rain (Signify Holdings, Inc.) operating as the program manager and principal network member. The platform implements 3D Secure protection for card transactions, as confirmed in the Spritz case study, and role-based access controls with granular delegated permissions for institutional and enterprise use cases. Real-time webhooks monitor balance updates and transaction events. The Fern acquisition brought regulatory compliance monitoring as a native capability. The compliance stack is specifically cited as supporting the GENIUS Act in the U.S. and the MiCA framework in Europe, with Rain explicitly expanding into those regulatory corridors. For agentic payments, Rain supports real-time issuance of single-use virtual cards programmatically by authorized AI agents, tied to verified accounts, with defined spend limits and program-level compliance controls. Developer experience has visible limitations: Rain''s API documentation is gated behind login at docs.rain.xyz, and the public GitHub organization (rainxyz) contains only one repository—suggesting the core platform is proprietary and closed to external audit. Blockworks reports that Rain positions itself as "API-first," enabling fintechs, corporations, and financial institutions to build stablecoin-linked cards and settlement tools across multiple jurisdictions, but public developer community signals such as open-source contributions, GitHub stars, or package downloads are absent. The adverse finding here is reputational rather than technical: stablecoins accounted for 84 percent of all illicit crypto transaction volume in 2025 per Chainalysis data cited by The Block, which means Rain''s AML and transaction-monitoring controls face a structurally high-risk environment regardless of their stated quality.'
