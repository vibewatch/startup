  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow (without Rain)
  - Rain solution
  - Measurable benefit (claimed or cited)
  - Known limitation
  rows:
  - - Spend stablecoins at merchants
    - Convert to fiat at exchange, withdraw to bank, wait 2+ days
    - Rain-powered card debits wallet directly at checkout
    - Eliminates 3–5-step conversion process; immediate merchant access
    - Credit product requires underwriting; USDT not part of Visa native settlement pilot
  - - Launch a global card program
    - Engage issuing bank, program manager, BIN sponsor per region; 6–18 months
    - Rain provides single integration, principal membership, card issuance across 150+ countries
    - 8–12 weeks to launch; no regional rebuild needed
    - Regulatory licensing still evolving across all target jurisdictions
  - - Cross-border payroll in stablecoin
    - ACH or wire per country, currency conversion, bank delays
    - Rain API disburses to 150+ countries with built-in FX conversion
    - Near-instant cross-border settlement; not constrained by banking hours
    - Local compliance obligations and payout rails per country not fully disclosed
  - - Issue AI-agent payment cards
    - Manual procurement card, shared credentials, no programmatic issuance
    - Rain generates single-use virtual cards programmatically for AI agents at runtime
    - Real-time issuance with predefined spend limits; compliance controls enforced
    - Regulatory treatment of AI as payment principal unclear; fraud model early-stage
  - - Government stablecoin program (FRNT)
    - Contractor payment took 45 days via legacy government systems
    - FRNT on Avalanche via Rain-issued card; payment in seconds
    - Contractor payment compressed from 45 days to seconds (99.99995% efficiency gain)
    - Limited to Wyoming pilot; no other state or federal replication confirmed yet
  - - Stablecoin wallet-to-card spending (Spritz)
    - Staking, lockup, or conversion required before spending
    - Spritz Card funds from crypto wallet with no lockup; multi-chain support
    - Instant access, global Visa acceptance, 3D Secure protection
    - Premium user segment only; mainstream consumer adoption path not yet proven
