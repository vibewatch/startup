    Andreessen Horowitz Crypto, Founders Fund, Tiger Global, Sapphire Ventures, Dragonfly, Bessemer, Galaxy Ventures,
    FirstMark, Lightspeed, Norwest, and Endeavor Catalyst. Post-money valuation approximately $1.95 billion. Cumulative
    disclosed funding exceeds $338 million.
