companyProfile:
  summary: >-
    Rain is a private enterprise stablecoin payments infrastructure company founded in 2021 by Farooq Malik (CEO) and
    Charles Naut and headquartered in New York. The company enables fintechs, neobanks, enterprises, and developers to
    issue stablecoin-funded cards, run cross-border payouts, embed wallets, and manage fiat-to-stablecoin conversion
    through a single API. Rain holds dual principal membership in both Visa and Mastercard — a rare competitive position
    that gives card programs access to more than 175 million merchant locations globally. Since its March 2025 Series A
    the company has moved through three funding rounds in under a year: a $24.5M Series A (Norwest), a $58M Series B
    (Sapphire Ventures), and a $250M Series C (ICONIQ Growth, a16z Crypto, Founders Fund, Tiger Global) at a $1.95
    billion post-money valuation. Company-stated traction at Series C close includes 30x year-over-year card base
    growth, 38x payment volume growth, more than $3 billion in annualized transaction volume, and 200+ enterprise
    partners across 150+ countries. Revenue, gross margin, headcount, and board composition remain undisclosed.
  foundedDate: '2021-01-01'
  founders:
    - name: Farooq Malik
      role: CEO & Co-founder
      claimRefs:
        - CO009
    - name: Charles Naut
      role: Co-founder
      claimRefs:
        - CO010
  foundingLocation: New York, New York, USA
  headquarters: New York, New York, USA
  productSummary: >-
    Rain sells a vertically integrated stablecoin payments platform comprising four modules — card issuing (Visa and
    Mastercard principal member), payments (cross-border payouts, 24/7 settlement), wallets (custodial and
    non-custodial, multi-chain), and accounts (ACH, wire, stablecoin funding). The platform features daily on-chain
    settlement including weekends and holidays, configurable spend controls, built-in KYC/AML and PCI DSS compliance,
    and a Multiplex cross-chain engine (from the 2025 Fern acquisition) spanning 10+ blockchains. Card programs launch
    in 8–12 weeks versus five-plus months for legacy alternatives.
  customerFocus: >-
    B2B buyers: fintechs, neobanks, exchanges, remittance operators, enterprise platforms, payroll processors, and
    developers that want to embed stablecoin card or payment infrastructure without building regulated banking rails
    themselves. Notable deployments include Spritz, Lydian, KAST, Nomad, Takenos, Felix Pago, Nuvei, Western Union, and
    Wyoming's FRNT state stablecoin program.
  businessModel: >-
    Primary revenue mechanism is interchange and card-program fees earned when enterprises issue Rain-powered cards.
    Additional monetization surfaces are inferred to include orchestration, wallet, payout, and rewards fees across the
    full-stack platform. Take rates and contract structures are not publicly disclosed. The model is asset-light from a
    balance-sheet perspective due to daily stablecoin settlement, reducing partner reserve requirements.
  stage: Series C private company
  fundingStatus: >-
