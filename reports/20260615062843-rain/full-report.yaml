  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Rain's platform is organized in four tiers: the network and regulatory access layer at the top, the settlement and
      routing engine in the middle, the core product modules, and the partner and developer integration layer at the
      base. Each layer introduces dependencies and risk.
    data:
      layers:
        - label: Network & regulatory access
          detail: >-
            Visa and Mastercard Principal Membership; direct card-network settlement; regulatory licenses per
            jurisdiction; GENIUS Act and MiCA compliance posture
          modules:
            - Visa Principal Member (March 2025)
            - Mastercard Principal Member (April 2026)
            - Third National as BIN issuer
            - Regional license expansion (Series C roadmap)
        - label: Settlement & routing engine
          detail: >-
            Daily stablecoin settlement with card networks (including weekends/holidays); Multiplex cross-chain router
            via Fern acquisition (10+ blockchains); liquidity-aware payment routing; FX conversion
          modules:
            - Stablecoin settlement (USDC-primary on Visa pilot)
            - Multiplex cross-chain routing (Fern)
            - FX and swap execution
            - Liquidity-source aggregation
        - label: Core product modules
          detail: >-
            Card issuing (virtual and physical, credit and prepaid, AI-agent-capable); Payments (cross-border, 24/7,
            programmable flows); Wallets (multi-chain, custodial and non-custodial); Accounts (ACH, wire, stablecoin
            on-ramp via SSB)
          modules:
            - Card issuing — virtual, physical, credit, prepaid
            - Payments — cross-border disbursements, treasury
            - Wallets — multi-chain, embedded or headless
            - Accounts — ACH, wire, fiat on-ramp
        - label: Compliance & security controls
          detail: >-
            Embedded KYC/AML, transaction monitoring, sanctions screening; PCI DSS, SOC 2, audited smart contracts; 3D
            Secure card authentication; RBAC and delegated access
          modules:
            - KYC/AML with transaction monitoring
            - PCI DSS and SOC 2
            - Audited smart contracts
            - 3D Secure; RBAC
        - label: Partner & developer integration
          detail: >-
            Single API for all modules; headless UI components; webhooks and real-time monitoring; gated developer
            documentation at docs.rain.xyz; proprietary core (1 public GitHub repo)
          modules:
