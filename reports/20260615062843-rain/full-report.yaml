              coverage all identify him as CEO and co-founder. Charles Naut is consistently named as the other
              co-founder, and founder-story coverage fills in the company’s earliest product evolution from the
              SignandWire side project into Rain’s Web3 spend-management tooling. Governance visibility is thinner than
