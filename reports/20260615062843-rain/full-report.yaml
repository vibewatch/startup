        title: Funding trajectory, operating scale, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Rain’s financing history is unusually compressed. The March 2025 Series A raised $24.5 million and paired
              capital with Visa principal-membership expansion. Five months later the August 2025 Series B added $58
              million, lifted total funding to $88.5 million, and publicly claimed 10x volume growth plus potential
              reach to 1.5 billion people. Four months after that, the January 2026 Series C added $250 million, took
              total funding above $338 million, and valued the company at $1.95 billion. The traction indicators
              attached to that round are substantial: 30x growth in active card base, 38x growth in annualized payment
              volume, more than $3 billion in annualized transactions, and more than 200 partners. The underwriting
              problem is disclosure depth, not lack of momentum. Public materials still do not disclose revenue, ARR, or
              a canonical current headcount, and they reveal only fragments of board composition. Investors can clearly
              see funding velocity and partner adoption, but not yet the unit economics or organizational maturity that
              would fully justify the valuation step-up.
