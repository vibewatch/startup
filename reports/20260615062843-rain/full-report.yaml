  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Type
      - Revenue / Volume
      - EV or Valuation
      - EV/Revenue Multiple
      - Relevance to Rain
      - Key Limitation
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Selected from public comps, M&A transactions, and private rounds in card issuing and stablecoin payments
        infrastructure; cross-referenced against Finro Q1 2026 dataset, SaaS Valuation Multiple Q1 2026 analysis, and
        SEC filings; covers the material comp set for a stablecoin card issuing infrastructure company at Series C stage
    rows:
      - - Marqeta (MQ)
        - Public — card issuing platform
        - $625M net revenue FY2025 (+23%); $383B TPV (+31%)
        - ~$1.62B market cap (June 2026)
        - ~1.5x LTM EV/Revenue
        - Closest public comp; card-issuing-as-a-service for fintechs and enterprises; global principal member
        - >-
