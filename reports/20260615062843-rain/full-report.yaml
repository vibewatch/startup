  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape across direct peers, incumbents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Rain’s direct peers are the platforms selling programmable stablecoin payment infrastructure to
              enterprises. Bridge, now owned by Stripe, is the cleanest API-first rival: it markets
              receive/store/convert/issue/spend APIs and now sits inside Stripe’s global merchant distribution. BVNK
              competes as a global stablecoin-powered payments stack for enterprises with strong fiat/stablecoin
              orchestration, while Zero Hash targets white-label B2B2C stablecoin infrastructure under broad licensing
              coverage. Circle and Ripple are adjacent but important because they control or sponsor stablecoin
              rails—USDC and RLUSD respectively—giving them issuer-led trust and liquidity advantages even when they are
              not the best fit for branded card issuance. Fireblocks, BitGo, and Cobo are not mirror-image substitutes,
              but they increasingly compete whenever the buyer prioritizes custody, policy controls, and treasury-grade
              security over go-live speed. PayPal PYUSD and Stripe-native products matter as distribution-heavy
              substitutes that can bundle stablecoins into massive existing payment ecosystems. Internal build,
              bank-sponsored treasury stacks, and incumbent card or payout processors remain status-quo alternatives,
              especially when customers prefer to assemble multiple components rather than adopt one integrated vendor.
