      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The best market proof is not ideology but workflow replacement
            body: >-
              Across Transak, OpenFX, and Rain’s own materials, the strongest evidence is that stablecoins solve
              concrete treasury and payment problems: trapped liquidity, multi-day settlement, fragmented balances, and
              poor FX transparency. That is a better adoption driver than generic crypto enthusiasm.
