      - number: '2.2'
        title: Sizing lenses from global payments to enterprise-ready stablecoin flows
        blocks:
          - type: paragraph
            body: >-
              The usable market picture comes from stacked lenses rather than one heroic TAM number. At the top of the
              funnel, the global cross-border payments market is enormous, with AlphaPoint citing roughly $190 trillion
              of transaction value in 2023 and a path toward $300 trillion by 2033. Stablecoins are already large in
              absolute terms within that backdrop: Transak says they processed $33 trillion in 2025, while PayRam
              describes a 2026 annualized stablecoin economy around $46 trillion. But those figures overstate the
              segment Rain can monetize directly because they still include non-payment activity. The cleaner lens is
              real-economy stablecoin usage. Transak cites $9 trillion of genuine economic transactions in 2025 and
              notes that B2B flows became the largest use case, with more than $76 billion of direct B2B payments out of
              $122 billion in real-economy stablecoin payments. OpenFX adds the most sobering caveat: stablecoins may
              total trillions of dollars of throughput, yet they still represent about 1% of global payment flows. For
              Rain, that means TAM is very large, SAM is the regulated enterprise subset of those real-economy flows,
              and current SOM is better proxied by the company’s own >$3 billion annualized volume than by all on-chain
              transfers globally.
