      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for Rain-like infrastructure is usually not a crypto trader or end consumer. It is a
              product, treasury, payments, or platform operator trying to improve working-capital efficiency or open new
              corridors without rebuilding regulated infrastructure from scratch. The most natural buyer segments are
              PSPs, fintech apps, neobanks, remittance operators, payroll and contractor-payment platforms, exchanges
              extending spending use cases, and global marketplaces that need embedded wallets or cards. Their users
              vary by workflow: finance teams use treasury and payout rails; operations teams use reconciliation and
              reporting; end-customers or contractors may only see a branded card or wallet. The payer is often the
              enterprise that licenses infrastructure, while the user may be a business account, merchant, creator,
              contractor, or consumer. Adoption usually begins with one painful workflow such as cross-border supplier
              payments or card-linked stablecoin spend, then expands into adjacent modules once compliance, liquidity,
              and user experience prove reliable. This is why single-integration platforms matter: buyers want one
              provider to solve network access, embedded wallets, cards, KYC/AML, and settlement rather than stitching
              together five vendors and internal treasury logic.
