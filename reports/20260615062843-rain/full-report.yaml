  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Rain operates in a rapidly crystallizing regulatory environment that represents both the largest near-term
              threat and the most defensible moat if navigated correctly. The US GENIUS Act, enacted July 18, 2025,
              established the first comprehensive federal framework for payment stablecoins, requiring permitted payment
              stablecoin issuers (PPSIs) to maintain 1:1 reserves in high-quality liquid assets and comply with full
              Bank Secrecy Act obligations. The OCC issued its Notice of Proposed Rulemaking on February 25, 2026,
              covering reserve assets, redemption, risk management, audits, and capital requirements. Critically, FinCEN
              and OFAC jointly proposed on April 8, 2026, that PPSIs be treated as financial institutions under the
              BSA—requiring written AML/CFT programs, mandatory OFAC sanctions compliance programs (the first time such
              a mandate has been legislated), and ongoing risk assessments. The full GENIUS Act regime becomes effective
              January 18, 2027, or 120 days after final rules are issued. Rain as a payment infrastructure provider—not
              a stablecoin issuer—faces a nuanced compliance position: it likely must ensure partner PPSIs are compliant
              with GENIUS Act requirements, but Rain itself may need to obtain or partner with licensed entities in the
              US market. The EU MiCA regulation, fully applicable since December 2024, requires stablecoin issuers and
              electronic money institutions operating in the EU to obtain authorization from national competent
              authorities. Rain operates in 150+ countries, requiring simultaneous compliance with multiple regulatory
              regimes. The Series C announcement explicitly states plans to secure operational licenses in North
              America, South America, Europe, Asia, and Africa—a multi-year, multi-jurisdiction licensing campaign that
              will consume significant capital and management attention with uncertain timelines and costs. PayPal's
              2026 10-K confirms that digital asset regulatory fragmentation is a primary risk factor even for
              established platforms. Rain has not disclosed specific licenses held by jurisdiction beyond its Mastercard
              and Visa principal memberships, leaving investors without full visibility into its regulatory standing.
