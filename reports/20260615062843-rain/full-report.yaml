  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing logic, and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real but incomplete monetization story. The clearest disclosed revenue engine
              is interchange: SiliconANGLE says enterprises issuing Rain-powered cards generate revenue from interchange
              fees, and Rain’s product stack shows why customers would pay for the platform even without direct
              stablecoin expertise. Cards, wallets, on/off ramps, rewards, payouts, and embedded accounts can all be
              sold under one enterprise integration, which strongly suggests a SaaS-plus-usage model, but Rain does not
              publish list pricing or realized economics. That matters because the spread between top-line transaction
              volume and actual net revenue could vary widely depending on how much value accrues to Rain versus card
              networks, issuing banks, sponsors, and partners. The available data therefore supports one high-confidence
              conclusion and one lower-confidence inference: high confidence that interchange and card usage matter
              economically, and medium confidence that additional orchestration, wallet, rewards, and payout fees likely
              round out the model. What the market still lacks is visibility into take rates, contract structure, and
              revenue mix by product line.
