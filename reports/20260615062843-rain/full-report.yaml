              informally by noting key partners are "growing at an extraordinary pace." Rain raised $338 million through
              its Series C but is actively deploying capital toward licensing, infrastructure, and market expansion—the
              company has not disclosed profitability timelines or burn rate, making runway assessment difficult. The
              agentic AI commerce product (Agent Control Layer) introduces a novel emerging risk: Know Your Agent (KYA)
