  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product suite, module map, and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Rain's product suite maps cleanly onto the four stages of a stablecoin payment lifecycle: money-in
              (accounts and on-ramps), storage (wallets), spending (card issuing), and money-out (payments and
              disbursements). The card-issuing module is the most mature and publicly evidenced component. As a Visa
              Principal Member since March 2025 and a Mastercard Principal Member announced in April 2026, Rain can
              sponsor card programs across key regions through a single operational model, accepting cards at over 175
              million Mastercard and over 150 million Visa merchant locations globally. Rain issues both virtual and
              physical credit and prepaid cards, supports Apple Pay and Google Pay, and offers configurable spend
              controls for consumer, business, and agentic use cases. The payments module provides 24/7 cross-border
              payment execution with built-in currency conversion, automatic swap routing across liquidity sources, and
              programmable conditional logic for disbursements, treasury rebalancing, marketplace payouts, and merchant
              settlements. The wallets module offers custodial and non-custodial options, multi-chain asset support, and
              a fully brandable embedded wallet-in-a-box with headless API or flexible UI components. The accounts
              module manages virtual account creation and funding through ACH, wire, or direct stablecoin transfer.
              Customer use cases visible in public materials include crypto-native consumer cards (Spritz, Lydian),
              state-issued stablecoin programs (Wyoming FRNT on Avalanche), enterprise cross-border payroll (Nomad),
              marketplace payouts, and AI-agent scoped virtual cards. The Lydian card demonstrates a premium consumer
              use case where Tether-backed spending converts to merchant-accepted local currency in real time without
              cardholder conversion steps.
