      - number: '4.2'
        title: Unit economics, settlement economics, and working-capital effects
        blocks:
          - type: paragraph
            body: >-
              Rain’s most tangible unit-economics advantage in public materials is not a gross-margin percentage; it is
              a working-capital claim. The company argues that stablecoin-backed card programs can launch in months
              rather than many months and can settle daily with card networks, including weekends and holidays, instead
              of forcing customers to maintain three to five days of projected spend in reserve. That is financially
              important because less idle collateral should improve customer ROI and make Rain more attractive for
              global card programs. Rain further argues that one integration across multiple markets cuts expansion
              friction and lowers the number of intermediaries required to go live. The counterpoint is that strong
              economics at the customer level do not automatically mean high software margin for Rain. Public sources do
              not disclose how interchange splits, rewards costs, fraud losses, compliance operations, FX costs, or
              customer incentives affect contribution margin. Benchmarks from Mastercard’s filings show that large
              payment networks live with significant pricing concessions and rebate structures, a reminder that scaled
              payments revenue can still be commercially competitive and margin-sensitive.
