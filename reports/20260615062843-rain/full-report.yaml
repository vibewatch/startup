    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and product scope
        blocks:
          - type: paragraph
            body: >-
              Rain’s best-supported identity is an enterprise stablecoin payments infrastructure company headquartered
              in New York and founded in 2021. The official homepage and funding announcements consistently frame the
              business as infrastructure for enterprises, neobanks, platforms, and developers rather than a retail
              crypto app. The product scope now spans global card programs, stablecoin wallets, digital-dollar accounts,
              fiat-to-stablecoin conversion, payouts, and cross-border payment flows. That breadth matters because Rain
              is no longer just a crypto-card wrapper; it is selling a full orchestration layer that lets a partner
              handle money-in, storage, spend, and money-out through one integration. Historical founder material shows
              the company started from a more crypto-native treasury and spend-management wedge around SignandWire and
              DAO workflows, but the 2025-2026 source pack shows a clear repositioning toward broader enterprise payment
              infrastructure with compliance, controls, and embedded-wallet tooling at the center.
