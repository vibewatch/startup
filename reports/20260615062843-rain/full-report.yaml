      - number: '3.4'
        title: Moat durability, bundling risk, and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              The main adverse evidence is that the strongest rivals do not need to look identical to be dangerous.
              Stripe can bundle Bridge into the default payments stack for existing merchants. Circle can use reserve
              transparency, USDC liquidity, and institutional distribution to pull infrastructure toward issuer-led
              rails. Fireblocks can make custody and compliance the decisive buying criterion for larger institutions.
              Ripple can sell RLUSD and Ripple Payments into banking and remittance relationships that are difficult for
              younger vendors to replicate. BVNK’s Visa Direct and Mastercard relationships show that payments
              incumbents are willing to attach themselves to other infrastructure providers as well, shrinking the
              uniqueness of network adjacency. Even PayPal’s PYUSD reminds the market that consumer and merchant
              distribution can matter as much as developer elegance. Rain therefore has a credible but not impregnable
              moat. Its best defenses are product integration, card-network expertise, faster launch, and enterprise
              design. Its biggest vulnerabilities are commoditization of stablecoin orchestration APIs, distribution
              capture by giant incumbents, and the possibility that institutional buyers increasingly prefer
              custody-first or issuer-led models over independent card infrastructure vendors.
