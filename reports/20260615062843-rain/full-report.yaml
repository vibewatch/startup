            body: >-
              No public source discloses Rain's NRR, GRR, logo churn, or contract-level renewal data. The retention
              picture must be inferred from expansion signals in the public record. Positive signals include: the
              Western Union partnership building on earlier wallet deployment (a follow-on commercial relationship),
              Nuvei extending Rain's enterprise reach through an integration (a distribution expansion), the Series C
              announcement explicitly stating partners are growing at an extraordinary pace and the raise ensures Rain
              can scale infrastructure alongside them, and the FRNT deployment moving from controlled testnet to
              full-scale production (a lifecycle progression). These signals collectively suggest stickiness, but they
              are anecdotal and cannot substitute for disclosed retention metrics. Concentration risk is the largest
              unquantified customer risk. Rain does not disclose its total partner count, revenue distribution, or what
              percentage of card transaction volume any single partner contributes. Given the small number of named case
              studies (six to eight), it is plausible that a few partners—Spritz, KAST, or Nomad—drive a
              disproportionate share of current transaction volume. If any of those partners were to shift to a
              competing stablecoin infrastructure provider (BVNK, Nium, or a self-built solution), the impact would be
              material and unquantifiable from public evidence. Expansion dynamics favor lock-in: Rain's
              single-integration model, embedded compliance controls, and global card network membership make it
              expensive to migrate. Card programs carry existing BIN configurations, compliance histories, and user
              enrollment records that are difficult to port. This stickiness is positive for retention but also means
              Rain bears the execution risk if a partner program scales faster than Rain's infrastructure can absorb.
