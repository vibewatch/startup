      - number: '6.2'
        title: Named customer proof and deployment evidence
        blocks:
          - type: paragraph
            body: >-
              Rain has the strongest customer evidence of any chapter in this report. Five case studies and multiple
              press releases document specific deployments with named counterparties. Spritz: a crypto-native fintech
              that built its Visa Signature card entirely on Rain. The case study confirms instant wallet-to-card
              funding across thousands of supported crypto assets, multi-chain compatibility, 3D Secure protection,
              Apple Pay and Google Pay support, and global Visa merchant acceptance. Lydian: a premium Visa Platinum
              card backed by Tether, with Carl Grimstad (CEO) quoted saying Rain's stablecoin infrastructure is
              invisible to the cardholder—merchants receive local currency while cardholders spend their stablecoin
              balance. Rain confirms this case requires no changes to merchant POS systems. FRNT (Wyoming Stable Token):
              the first production deployment of a U.S. state-issued stablecoin on a public blockchain. Built on
              Avalanche for sub-second finality and low fees, FRNT is backed 102% by T-bills and USD per the Wyoming
              Stable Token Act. A pilot with Hashfire compressed contractor payment timelines from 45 days to seconds—a
              99.99995% efficiency gain cited directly in the case study. Western Union: Rain joined WU's Digital Asset
              Network in November 2025 (announced by PR Newswire), allowing holders of Rain-powered stablecoin wallets
