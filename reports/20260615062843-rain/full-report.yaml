  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Rain is not pursuing the entire digital-asset market. The more precise boundary is enterprise
              infrastructure that lets regulated operators embed stablecoin-funded cards, wallets, cross-border payouts,
              treasury transfers, and fiat-to-stablecoin conversion into normal payment workflows. That includes card
              issuance, wallet accounts, B2B supplier payments, payroll and contractor disbursements, remittance-linked
              payouts, and treasury rebalancing where settlement speed and liquidity matter. It excludes pure crypto
              trading, speculative DeFi leverage, self-custody investing, and generalized blockchain infrastructure that
              does not directly solve a payment or treasury workflow. The status quo substitutes are correspondingly
              broad: correspondent-bank wires over SWIFT, PSP-led cross-border payout stacks, card issuing processors,
              local wallet schemes, manual treasury operations, and internal builds using bank and compliance vendors.
              This boundary matters because it prevents the chapter from calling every stablecoin transfer part of
              Rain’s addressable market. The company’s real market sits where stablecoins outperform legacy rails on
              cost, speed, reach, or capital efficiency while remaining acceptable to enterprise risk and compliance
              teams.
