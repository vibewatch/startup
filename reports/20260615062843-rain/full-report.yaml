  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: wide
    summary: >-
      Rain's implied EV/Revenue multiple across six take-rate and exit-scenario combinations, benchmarked against the
      public comparables range.
    data:
      items:
        - label: Rain (1% take rate, $30M rev)
          value: 65
          detail: Extreme; $1.95B / $30M implied revenue. No comparable payments infra company sustains 65x long-term.
        - label: Rain (3% take rate, $90M rev)
          value: 22
          detail: >-
            High-growth infra scenario. Consistent with early-stage premium platform positioning but requires rapid
            revenue scaling.
        - label: Rain (5% take rate, $150M rev)
          value: 13
          detail: >-
            Best-case revenue scenario. Approaches Adyen territory; defensible if software-economics model is
            demonstrated.
        - label: Adyen (public, Q1 2026)
          value: 8
          detail: >-
            8.1x LTM EV/Revenue; global multi-rail payments platform; premium public anchor for infrastructure
            companies.
        - label: Payments median (Q1 2026)
          value: 4
          detail: 3.6x median EV/Revenue across public payments companies per Finro Q1 2026 dataset (416 companies).
        - label: Marqeta (public, Q1 2026)
          value: 2
          detail: >-
            ~1.5x LTM EV/Revenue; closest public card-issuing comp; compressed due to customer concentration and slower
            growth.
    approximationNotes: >-
      Rain's implied EV/Revenue multiples are analytical estimates based on $3B annualized TPV and assumed take rates
      (1%, 3%, 5%); Rain's actual revenue is not disclosed. Bar values are rounded for readability. Public comp
      multiples (Adyen, Marqeta) are sourced from SaaS Valuation Multiple Q1 2026 analysis. The payments median is from
      Finro's Q1 2026 dataset. Comparison is directional and illustrative — Rain's growth rate far exceeds Adyen and
      Marqeta, which would justify premium multiples if revenue is proven.
