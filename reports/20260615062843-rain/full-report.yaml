      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Rain's most plausible exit paths are strategic M&A and a deferred public market listing. On the M&A front,
              the natural acquirers are the major card networks (Visa, Mastercard), large payment platforms (Stripe,
              PayPal), or financial infrastructure incumbents seeking stablecoin capabilities. The Stripe/Bridge and
              Mastercard/BVNK precedents establish that acquirers will pay $1–2B for stablecoin infrastructure platforms
              before significant revenue is demonstrated—but those acquisitions happened earlier in Rain's lifecycle
              analogy; at $1.95B, Rain may need to demonstrate more financial evidence to justify a premium exit above
              its current valuation. On the IPO path, public market comps (Marqeta at 1.5x, Flywire at 2.1x, PayPal at
              1.36x) suggest that a Rain public listing at current valuation would require demonstrating revenue
              substantially above what current activity metrics imply—absent that, an IPO at $1.95B would carry
              significant down-round risk. Visa's $40B revenue and 257.5B annual transactions (FY2025) contextualize the
              scale ceiling: Rain's $3B TPV is well under 1% of Visa's transaction base, confirming enormous upside if
              the growth trajectory holds but also illustrating how far Rain must scale to reach a sustainable
              independent public company status. Rain's exit readiness today is pre-commercial: it has disclosed partner
              relationships but not revenue, which limits the universe of institutional buyers or public market
              investors who can underwrite the price. The critical diligence asks are revenue and gross margin by
              product line, partner concentration (top-10 partner share of TPV), burn rate and runway, actual take rate
              by partner tier, and the status of licensing applications in North America and the EU. Without these, any
              investment thesis rests on activity proxies rather than financial fundamentals.
            claimRefs:
              - CV043
              - CV046
              - CV047
              - CV048
              - CV049
              - CV050
