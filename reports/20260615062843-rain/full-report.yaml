              Total stablecoin throughput is already measured in trillions, but much of that is still outside Rain’s
              addressable enterprise payment workflows. The relevant market is the regulated, infrastructure-dependent
              slice of real-economy payments, not every token transfer on public blockchains.
            calloutType: risk
