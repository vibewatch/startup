  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Rain has executed three disclosed funding rounds in approximately four years, each materially re-rating
              the business: a $24.5M Series A led by Norwest Venture Partners, a $58M Series B led by Sapphire Ventures,
              and a $250M Series C led by ICONIQ Growth with participation from Andreessen Horowitz Crypto, Founders
              Fund, Tiger Global Management, and others, closed January 2026. The Series C brings total disclosed
              capital to over $332.5M and values the company at approximately $1.95 billion post-money—confirmed by
              multiple independent sources including The Block and Forbes, which both reported the figure in January
              2026 alongside Rain's own press release. The round was framed as infrastructure capital: Rain stated plans
              to deploy proceeds toward operational licensing in North America, South America, Europe, Asia, and Africa;
              enterprise sales expansion; and product depth in agentic commerce. This is relevant to valuation because
              heavy capital deployment into licensing and global buildout means Rain is pre-profitability with uncertain
              timelines—the valuation is therefore a growth-equity bet on future revenue scale, not a reflection of
              current financial productivity. The platform's stated operating metrics at Series C close were 30x
              year-over-year growth in card user base, 38x growth in payment volume, $3B or more in annualized card
              transaction volume, and 200+ enterprise partners across 150+ countries. None of these metrics have been
              independently verified by third-party analytics providers; Artemis research data from January 2026
              corroborated that the broader crypto card payments market reached $18B annualized volume with 106% annual
              growth, which is consistent with Rain's claimed trajectory if it holds a meaningful market share.
