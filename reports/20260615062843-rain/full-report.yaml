      - CV033
      - CV034
      - CV037
  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: standard
    summary: >-
      Rain exit valuation range under bull, base, and bear scenarios with key assumptions and implied multiple on $1.95B
      Series C entry.
    data:
      items:
        - label: Bull exit valuation
          low: 3000
          mid: 6000
          high: 12000
          unit: USD millions
          detail: >-
            10x TPV to $30B; 5% take rate (~$1.5B rev); 8x forward rev multiple; 2–6x on Series C entry. Requires
            extraordinary execution and M&A or IPO by 2030.
        - label: Base exit valuation
          low: 600
          mid: 1400
          high: 2000
          unit: USD millions
          detail: >-
            TPV $10B; 3–4% take rate (~$300–400M rev); M&A at 4–5x; 0.3–1x on Series C entry. Near-flat to modest loss
            at midpoint; modest gain at high end.
        - label: Bear exit valuation
          low: 200
          mid: 700
          high: 1200
          unit: USD millions
          detail: >-
            TPV stalls at $3–5B; regulatory delays; Mastercard/BVNK competition; down-round before exit; 0.1–0.6x on
            Series C entry. Klarna-style re-rating risk.
    approximationNotes: >-
      Exit valuations are analytical scenarios constructed from public comparable multiples (Adyen, Marqeta, Bridge M&A,
      BVNK M&A) applied to estimated revenue ranges. Revenue is estimated from take-rate scenarios; Rain's actual
      revenue is not disclosed. USD values are in millions. Probability-weighted expected value is between base and bear
      midpoints given current evidence. Bull scenario requires simultaneous execution success, regulatory clearance, and
      no major competitive displacement — a low but non-zero probability.
    claimRefs:
      - CV039
      - CV040
      - CV047
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring of Rain's investment thesis across market, proof, moat, economics, risk, valuation, and evidence
      quality dimensions.
    data:
      items:
        - label: Market signal
          value: High
          detail: Stablecoin card payments grew 106% YoY to $18B annualized; TAM inflection is real and accelerating
        - label: Product/tech proof
          value: Medium-High
          detail: >-
            Dual Visa/MC principal membership, 200+ partners; operating in 150+ countries; platform maturity confirmed
            by Western Union and Nuvei integrations
        - label: Competitive moat
          value: Medium
          detail: >-
            Principal memberships create entry barriers but Mastercard/BVNK and Visa internal capabilities are direct
            networked threats; moat durability is uncertain
        - label: Financial evidence
          value: Low
          detail: >-
            Revenue, gross margin, profitability timeline undisclosed; implied 13–65x EV/Revenue range; cannot formally
            underwrite the price
        - label: Risk profile
          value: Medium-High risk
          detail: >-
            Regulatory licensing campaign across 5 continents; BVNK competitive displacement; partner concentration;
            financial opacity; all material
        - label: Valuation
          value: Stretched
          detail: >-
            $1.95B is at or above M&A precedents (Bridge $1.1B, BVNK up to $1.8B); defensible at 5% take rate but
            demands exceptional execution
        - label: Evidence quality
          value: Medium
          detail: >-
            Strong public activity metrics and tier-1 investors; weak financial disclosure; no independent revenue
            verification; company-stated metrics only
        - label: Overall signal
          value: research-more
          detail: >-
            Compelling growth story and real market; but financial opacity means entry at $1.95B requires accepting
            unquantifiable multiple risk
    approximationNotes: >-
      KPI scores are qualitative assessments based on the weight of evidence from all eight chapters of the Rain
      diligence report. Scores are not quantitative ratings on a defined scale. 'High/Medium/Low' labels reflect the
      strength of public evidence available, not inherent business quality. A company can have a 'High' market signal
      and 'Low' financial evidence simultaneously if the market opportunity is confirmed but financials are not
      disclosed.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
      - CV031
      - CV036
