  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer profiles
        blocks:
          - type: paragraph
            body: >-
              Rain targets a B2B audience of fintechs, enterprises, exchanges, marketplaces, and developers who want to
              issue stablecoin-powered cards or move money globally without building banking infrastructure themselves.
              Five distinct buyer segments are publicly evidenced. First, crypto-native consumer fintechs: companies
              like Spritz, Lydian, and KAST whose end users hold stablecoins and want to spend them in everyday
              commerce. These buyers need Visa acceptance, no-lockup card funding, and compliance built in. Second,
              cross-border payment and remittance platforms: Nomad (3.8M+ Brazilian users), Takenos (20-country LatAm
              coverage, $560M+ in volume), and Felix Pago ($6B+ in WhatsApp-based remittances) use Rain's stablecoin
              wallets and cards as the "spend" layer for dollar savings products. Third, enterprise and institutional
              platforms: Nuvei integrates Rain card issuing into its enterprise payment stack, and Western Union's
              Digital Asset Network uses Rain-powered wallets to bridge stablecoin balances to cash at 150+ country
              retail locations. Fourth, government and public-sector entities: Wyoming's Frontier Stable Token (FRNT)
              program uses a Rain-issued card as the first production deployment of a U.S. state-issued digital asset,
              demonstrating a regulatory blueprint others could follow. Fifth, agentic AI commerce: Sponge (YC-backed)
              uses Rain's Agent Control Layer to issue stablecoin-funded Visa cards for autonomous AI agents. Each
              segment has a different procurement decision-maker: a product or engineering leader at a fintech, a
              payments strategist or treasurer at an enterprise, a government procurement office at the state level, or
              an AI infrastructure team at an agent-first company. Rain's API-first model and single integration point
              covering card issuing, wallets, accounts, and payments means the same platform serves all five personas
              without customization overhead.
            claimRefs:
