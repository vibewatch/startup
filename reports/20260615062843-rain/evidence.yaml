evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, and take-rate disclosure for Rain’s enterprise stablecoin programs.
    whyItMatters: The Series C valuation can be observed publicly, but the underlying revenue base and unit economics cannot.
    diligencePath: >-
      Request board deck or investor update with run-rate revenue, gross margin, cohort growth, and capital-efficiency
      metrics.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A canonical current employee count and geographic staffing split.
    whyItMatters: Headcount is a basic operating-scale and burn proxy, especially after a fast fundraising cycle.
    diligencePath: Request current org chart or HRIS snapshot and reconcile it to hiring plans described after Series B and Series C.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete board roster, observer rights, and governance terms attached to the 2025-2026 financings.
    whyItMatters: >-
      Public sources show who led rounds but not how control rights or board composition changed as valuation
      accelerated.
    diligencePath: Request cap table, voting agreements, and current board/observer list from counsel or the company.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: licensing-footprint
    missingEvidence: Jurisdiction-by-jurisdiction list of licenses, sponsor arrangements, and live market coverage.
    whyItMatters: Expansion claims are global, but launch feasibility depends on local licensing and network permissions.
    diligencePath: >-
      Request an operating-market matrix showing network memberships, regulated entities, and rollout status by
      geography.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-share-audits
    missingEvidence: >-
      Independent audited dataset that reconciles total stablecoin throughput, real-economy payments, and
      enterprise-only payment flows using one methodology.
    whyItMatters: >-
      Current public market sizing relies on multiple providers with different definitions, which can easily overstate
      or understate Rain’s addressable market.
    diligencePath: >-
      Request internal market model or commission third-party market-sizing work that isolates regulated enterprise
      payment workflows by corridor and use case.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-power
    missingEvidence: Rain pricing, take rates, implementation fees, and margin by workflow or customer cohort.
    whyItMatters: >-
      Large market size only matters if Rain can capture attractive economics rather than acting as pass-through
      infrastructure.
    diligencePath: Request pricing schedules, customer cohorts, and gross-margin bridge by product line.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: corridor-specific-adoption
    missingEvidence: Verified corridor-level adoption and transaction data by region, industry, and enterprise workflow.
    whyItMatters: >-
      Market adoption is heterogeneous, and corridor economics likely determine near-term SAM more than generic global
      TAM.
    diligencePath: Request customer case studies or internal volume mix by corridor, geography, and workflow.
    relatedQuestionRefs:
      - QM020
  - type: missing-source
    severity: minor
    topic: licensing-constraints
    missingEvidence: Country-by-country matrix of payment, EMI/PI, or virtual-asset permissions needed for each target market.
    whyItMatters: The difference between global possibility and near-term SAM is often regulatory permissions, not raw demand.
    diligencePath: Build a regulatory market-entry matrix pairing token type, customer type, and required local permissions.
    relatedQuestionRefs:
      - QM011
      - QM024
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Actual take rates, implementation fees, and contract minimums across Rain and key competitors.
    whyItMatters: >-
      Competitive positioning changes materially if large rivals subsidize pricing through other businesses or if Rain
      monetizes cards differently from orchestration APIs.
    diligencePath: Request customer contracts or pricing sheets across Rain, Bridge/Stripe, Fireblocks, BVNK, and Circle.
    relatedQuestionRefs:
      - QP013
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Production win/loss data by segment showing where Rain actually beats Bridge, Fireblocks, Circle, or BVNK.
    whyItMatters: Public positioning pages show intent, not who wins live competitive deals.
    diligencePath: Request sales pipeline data, top-20 deal notes, and competitor displacement examples.
    relatedQuestionRefs:
      - QP019
      - QP020
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Measured migration cost, implementation time, and churn history for platforms moving between stablecoin providers.
    whyItMatters: Moat durability depends on operational lock-in, not just feature breadth.
    diligencePath: Request implementation timelines, churn cases, and reference calls from customers that evaluated multiple vendors.
    relatedQuestionRefs:
      - QP017
      - QP018
  - type: missing-source
    severity: minor
    topic: competitor-scale-drift
    missingEvidence: >-
      A like-for-like, dated scale dataset for every provider using the same volume, customer-count, and geography
      definitions.
    whyItMatters: >-
      Public competitor disclosures frequently mix cumulative volume, annualized volume, or geography reach in
      inconsistent ways.
    diligencePath: Normalize each competitor’s disclosed metrics in an internal benchmark sheet before using them for hard ranking.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: income-statement
    missingEvidence: Current revenue, ARR, gross margin, and product-line revenue mix.
    whyItMatters: Without income-statement detail, neither valuation nor quality of revenue can be underwritten from public data.
    diligencePath: Request monthly revenue by cards, payouts, wallets, and platform fees plus gross margin by line.
    relatedQuestionRefs:
      - QI010
      - QI023
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, restricted reserves, debt facilities, and runway under base and downside scenarios.
    whyItMatters: Capital adequacy cannot be assessed from funding history alone.
    diligencePath: Request treasury dashboard, cash bridge, debt schedule, and board-approved operating plan.
    relatedQuestionRefs:
      - QI019
      - QI020
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer and top-partner revenue / volume concentration plus churn history.
    whyItMatters: Partner count can mask concentration risk and bargaining leverage.
    diligencePath: Request top-10 customer revenue and TPV concentration table, renewals, and churn notes.
    relatedQuestionRefs:
      - QI022
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Actual pricing schedules, discounts, and blended realized take rates by product.
    whyItMatters: >-
      The gap between transaction volume and net revenue could be wide depending on card-network economics and
      concessions.
    diligencePath: Request pricing matrix, customer contracts, and waterfall from TPV to net revenue.
    relatedQuestionRefs:
      - QI003
      - QI013
  - type: private-evidence-only
    severity: blocking
    topic: regulatory-licenses
    missingEvidence: Specific regulatory licenses by jurisdiction currently held by Rain are not disclosed publicly.
    whyItMatters: >-
      Rain's ability to operate card programs in key markets depends on regulatory approval; the scope of current
      licenses cannot be verified from public sources.
    relatedQuestionRefs:
      - QE020
  - type: restricted-access
    severity: notable
    topic: developer-ecosystem
    missingEvidence: >-
      Rain's core platform is proprietary; API documentation requires account login; no public GitHub contributions,
      Stack Overflow traffic, or community metrics available.
    whyItMatters: >-
      Key-person and platform-lock risks cannot be assessed without understanding the developer ecosystem depth and
      engineering team redundancy.
    relatedQuestionRefs:
      - QE024
  - type: restricted-access
    severity: notable
    topic: smart-contract-audit
    missingEvidence: >-
      Smart-contract audit reports, auditor identities, and findings are not disclosed; only the existence of audits is
      confirmed by Fintechfutures.
    whyItMatters: >-
      Bridge security in the Multiplex/Fern cross-chain layer and settlement smart contracts are critical risk surfaces;
      audit scope and findings would materially affect technical due diligence.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: high
    topic: total partner count and customer concentration
    missingEvidence: >-
      Rain has not disclosed its total active partner count, revenue distribution, or what percentage of transaction
