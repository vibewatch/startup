- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - GENIUS-style U.S. stablecoin clarity
    - Positive
    - Near term
    - Makes stablecoin usage easier to approve inside regulated enterprises
    - Which geographies and token types can Rain serve under current rules?
  - - MiCA authorization and supervision
    - Mixed positive
    - Near term
    - Creates legal clarity in Europe but narrows acceptable tokens and providers
    - Which Rain corridors and partners are MiCA-ready today?
  - - Speed advantage vs SWIFT
    - Positive
    - Current
    - Settlement in minutes rather than days supports treasury and supplier-payment ROI
    - What corridors create the largest working-capital gain for Rain customers?
  - - Lower all-in payment cost
    - Positive
    - Current
    - 0.1%-0.5% style claims can materially undercut wire fees and FX spreads
    - What portion of savings does Rain capture as take rate or pricing power?
  - - Need for ERP / treasury integration
    - Constraint
    - Current
    - Adoption stalls if stablecoins live outside existing finance systems
    - How deep are Rain’s API and reconciliation hooks into enterprise workflows?
  - - Illicit-finance scrutiny and sanctions monitoring
    - Constraint
    - Current
    - Raises compliance cost and may cap token or corridor availability
    - How much manual review or screening burden falls on Rain versus customer?
  - - Depeg and reserve-concentration risk
    - Constraint
    - Persistent
    - Stablecoin systemic risk can slow treasury adoption despite cost advantages
    - What is Rain’s token-support policy and contingency plan for depegs?
  - - Incumbent response from Visa, Mastercard, SWIFT, and banks
    - Mixed
    - Current to medium term
    - Validates demand but compresses differentiation for standalone infrastructure vendors
    - Which capabilities remain proprietary or defensible for Rain?
  notes: Rows combine market tailwinds with friction points because both govern adoption timing and valuation relevance.
