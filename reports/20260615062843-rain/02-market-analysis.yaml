callouts:
- calloutType: strength
  title: The best market proof is not ideology but workflow replacement
  body: 'Across Transak, OpenFX, and Rain’s own materials, the strongest evidence is that stablecoins solve concrete treasury and payment problems: trapped liquidity, multi-day settlement, fragmented balances, and poor FX transparency. That is a better adoption driver than generic crypto enthusiasm.'
  claimRefs:
  - CM003
  - CM008
  - CM019
  - CM020
- calloutType: risk
  title: Huge stablecoin volumes do not automatically translate into Rain’s monetizable SAM
  body: Total stablecoin throughput is already measured in trillions, but much of that is still outside Rain’s addressable enterprise payment workflows. The relevant market is the regulated, infrastructure-dependent slice of real-economy payments, not every token transfer on public blockchains.
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM037
  - CM040
- calloutType: insight
  title: Incumbent adaptation is both validation and compression
  body: Mastercard, Visa, and SWIFT are not ignoring stablecoins. Their adaptation validates stablecoins as a serious rail, but it also means infrastructure providers such as Rain must win on integration depth, compliance execution, and partner distribution rather than novelty alone.
  claimRefs:
  - CM011
  - CM031
  - CM038
  - CM041
