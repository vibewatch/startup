chapter:
  number: 2
  title: Market Analysis
  summary: 'Rain sells into the enterprise stablecoin-payments infrastructure market: a narrow but fast-growing slice of global payments where cards, wallets, treasury, payouts, and cross-border settlement converge. The best-supported sizing lenses show stablecoins operating at payment-network scale in aggregate while still accounting for only a small share of global payment flows, which means the opportunity is large but highly contingent on regulatory clarity, ERP integration, and compliance-ready distribution. For Rain specifically, the most relevant near-term market is not all crypto volume but the regulated, enterprise-ready subset of cross-border B2B, wallet, and card use cases where stablecoins materially improve speed, liquidity, and capital efficiency.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and status-quo substitutes
  body: 'Rain is not pursuing the entire digital-asset market. The more precise boundary is enterprise infrastructure that lets regulated operators embed stablecoin-funded cards, wallets, cross-border payouts, treasury transfers, and fiat-to-stablecoin conversion into normal payment workflows. That includes card issuance, wallet accounts, B2B supplier payments, payroll and contractor disbursements, remittance-linked payouts, and treasury rebalancing where settlement speed and liquidity matter. It excludes pure crypto trading, speculative DeFi leverage, self-custody investing, and generalized blockchain infrastructure that does not directly solve a payment or treasury workflow. The status quo substitutes are correspondingly broad: correspondent-bank wires over SWIFT, PSP-led cross-border payout stacks, card issuing processors, local wallet schemes, manual treasury operations, and internal builds using bank and compliance vendors. This boundary matters because it prevents the chapter from
    calling every stablecoin transfer part of Rain’s addressable market. The company’s real market sits where stablecoins outperform legacy rails on cost, speed, reach, or capital efficiency while remaining acceptable to enterprise risk and compliance teams.'
  claimRefs:
