  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - GENIUS 式美国稳定币清晰监管
        - 利好
        - 近期
        - 受监管企业内部更容易批准稳定币使用
        - 按现行规则，Rain 能服务哪些地区和代币类型？
      - - MiCA 授权和监管
        - 偏利好
        - 近期
        - 欧洲获得法律清晰度，但可接受代币和提供商范围收窄
        - Rain 哪些走廊和合作伙伴今天已具备 MiCA 准备？
      - - 相比 SWIFT 的速度优势
        - 利好
        - 当前
        - 分钟级而非数日级结算，支撑资金管理和供应商付款 ROI
        - 哪些走廊能为 Rain 客户带来最大的营运资本收益？
      - - 更低的综合支付成本
        - 利好
        - 当前
        - 0.1%-0.5% 一类说法可能显著低于电汇费和外汇点差
        - Rain 把多少节省转化为抽成率或定价权？
      - - 需要接入 ERP / 资金系统
        - 约束
        - 当前
        - 稳定币如果停留在既有财务系统之外，采用会卡住
        - Rain 的 API 和对账钩子有多深地嵌入企业工作流？
      - - 非法金融审查和制裁监控
        - 约束
        - 当前
        - 合规成本上升，也可能限制代币或走廊可用性
        - 人工复核或筛查负担有多少落在 Rain 身上，有多少落在客户身上？
      - - 脱锚和储备集中风险
        - 约束
        - 持续
        - 尽管有成本优势，稳定币系统性风险仍可能拖慢资金部门采用
        - Rain 的代币支持政策是什么？脱锚时有什么应急方案？
      - - Visa、Mastercard、SWIFT 和银行等既有玩家反击
        - 混合
        - 当前至中期
        - 验证需求存在，但压缩独立基础设施厂商的差异化
        - Rain 哪些能力仍然是专有或可防守的？
    notes: 行同时纳入市场顺风和摩擦点，因为两者共同决定采用时点和估值相关性。
