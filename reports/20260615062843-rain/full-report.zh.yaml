      - number: '4.2'
        title: 单位经济、结算经济与营运资本影响
        blocks:
          - type: paragraph
            body: >-
              Rain
              公开材料中最具体的单位经济优势，不是某个毛利率百分比，而是营运资本主张。公司认为，稳定币支持的卡项目可以在几个月而不是很多个月内上线，并可与卡网络每日结算，包括周末和节假日；传统项目则迫使客户预先留出三到五天预计支出的准备金。这在财务上重要，因为闲置抵押更少，应能改善客户
              ROI，并让 Rain 对全球卡项目更有吸引力。Rain 还主张，一次集成覆盖多个市场，可以降低扩张摩擦，减少上线所需中介数量。反面是，客户层面的强经济性不会自动意味着 Rain
              拥有高软件利润率。公开资料未披露交换费分成、奖励成本、欺诈损失、合规运营、FX 成本或客户激励如何影响贡献利润率。Mastercard
              申报文件中的基准显示，大型支付网络长期承受显著定价让利和返利结构；这提醒我们，即便支付收入规模化，商业竞争和利润率敏感性仍可能很强。
