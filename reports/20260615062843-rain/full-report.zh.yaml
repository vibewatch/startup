      - number: '5.3'
        title: 合规、安全控制与开发者体验
        blocks:
          - type: paragraph
            body: >-
              Rain 的合规姿态内嵌在产品里，而不是事后叠加。KYC 要求、交易监控和风险控制从第一天起就嵌入钱包和卡项目。卡由 Third National 根据 Visa 许可发行，Rain（Signify
              Holdings, Inc.）担任项目管理方和网络主会员。平台为卡交易实施 3D Secure 保护，Spritz 案例研究对此有确认；机构和企业用例还支持基于角色的访问控制与细粒度委派权限。实时
              webhooks 监控余额更新和交易事件。Fern 收购带来了原生监管合规监控能力。合规栈被明确描述为支持美国 GENIUS Act 和欧洲 MiCA 框架，Rain 也明确正扩展到这些监管走廊。面向
              agentic payments，Rain 支持授权 AI agents 以编程方式实时发行一次性虚拟卡，绑定已验证账户，并带有明确消费限额和项目级合规控制。开发者体验存在可见限制：Rain 的 API 文档在
              docs.rain.xyz 后台登录墙之后，公开 GitHub 组织（rainxyz）只有一个仓库——这表明核心平台是专有系统，外部审计不可见。Blockworks 报道称 Rain
              将自己定位为「API-first」，让金融科技公司、企业和金融机构在多个司法辖区构建稳定币相关卡和结算工具；但开源贡献、GitHub stars
              或包下载等公开开发者社区信号缺席。这里的反向发现更多是声誉而非技术：The Block 引用 Chainalysis 数据称，2025 年稳定币占所有非法加密交易量的 84%，这意味着无论 Rain
              声称质量如何，其 AML 和交易监控控制都面对结构性高风险环境。
