      - number: '5.4'
        title: 差异化、竞争护城河与产品路线图
        blocks:
          - type: paragraph
            body: >-
              Rain 的差异化建立在四个公开可观察支柱上：双卡网络主会员资格（Visa + Mastercard）、原生稳定币结算把抵押要求最多降低 60%、通过 Fern 收购获得的跨链路由层，以及满足 MiCA 和
              GENIUS Act 要求的企业合规栈。Forbes 竞争分析确认，Rain 和 Reap 是仅有的全栈发行平台，既取得 Visa
              主会员资格，又实现直接稳定币结算；这种位置绕开银行中介，改善项目经济性。根据公司披露，进入 2026 年时 Rain 卡基数同比增长 30 倍、支付量增长 38
              倍，说明核心价值主张正在被合作伙伴接受。公开资料中的路线图信号包括通过合作银行集成 ACH 和 SEPA、在北美、南美、欧洲、亚洲和非洲获得更多监管许可，以及为 AI agents 提供
              agentic-payment 基础设施。Western Union 合作把 Rain 驱动钱包里的稳定币连接到 WU 的全球零售取现网络，使可触达地理范围超出卡受理商户网络。与 Wyoming 的 FRNT
              部署展示了 Rain 服务政府发行稳定币项目的雄心——这是一个差异化且高门槛的用例。Nuvei 合作把 Rain
              的稳定币发卡能力集成进企业支付栈，确认了从产品到企业分发的需求。关键缺口包括公开资料中没有专利申请、没有公开 API 文档来确认开发者生态深度，也没有披露技术 SLA 或 uptime 记录供尽调验证。
