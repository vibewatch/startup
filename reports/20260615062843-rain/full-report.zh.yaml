        - from: reg-risk
          to: regulatory-penalty
          label: 不合规导致执法
        - from: aml-risk
          to: regulatory-penalty
          label: AML 违规触发执法行动
        - from: aml-risk
          to: partner-churn
          label: AML 违规造成声誉损害
        - from: network-risk
          to: revenue-impact
          label: Visa 规则变化限制刷卡受理
        - from: network-risk
          to: partner-churn
