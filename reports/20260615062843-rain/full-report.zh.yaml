      - number: '8.4'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Rain 的投资逻辑建立在四个结构性支柱上。第一，稳定币卡支付量每年增长 106%，并正接近点对点稳定币转账的 $19B 水平，说明稳定币正在从加密原生场景快速转向主流企业用途——这是一次 TAM 拐点，Rain
              可凭全栈基础设施捕捉。第二，Rain 同时拥有 Visa 和 Mastercard 主会员资格，这是真正的差异化能力，需要多年时间和大量资本才能取得；新进入者若想在 150
              多个国家竞争卡受理覆盖，必须复制这一能力，因此形成持久进入壁垒。第三，企业伙伴基础（200 多家公司）带来收入集中度风险，也带来切换成本收益：一旦伙伴的卡项目建在 Rain
              基础设施上，迁移到替代方案的运营成本很高。第四，Rain 的 $338M+ 资本基础提供了多年
              runway，可支撑其推进美国、欧盟、亚洲和非洲运营所需的监管牌照战役。反向逻辑同样建立在结构性挑战上。Mastercard 收购 BVNK——Rain
              最直接的竞争者——制造了一个资本雄厚、由网络支持的对手，可能以优惠经济性直接部署到企业账户，且无需 Rain 参与。Visa 同时也在建设自己的稳定币结算基础设施，并与 BVNK 合作 Visa
              Direct。规模化后，两大网络都没有商业动机优先选择 Rain 而非自身能力。Rain 没有披露收入、毛利率或盈利路径；在 65 倍隐含 EV/Revenue（熊市 take-rate
              情景）下，任何倍数压缩都会带来严重稀释。IMF 分析还提示，稳定币会在新兴市场造成货币替代和金融稳定风险，而这些市场正是 Rain 的主要增长向量，可能触发其最重要增长地区的监管限制。
