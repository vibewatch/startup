      - number: '4.4'
        title: 公开财务缺口、类比基准与判断
        blocks:
          - type: paragraph
            body: >-
              因此，财务判断受限于缺失变量，而不是市场活动不足。Rain 可能受益于公共网络和数字钱包业务都在追逐的广义结构优势：基于交易的收入、跨境量敏感性，以及在支付流之上叠加增值服务的能力。Mastercard
              申报文件展示了规模化网络业务如何变现 GDV、switch transactions 和跨境流，同时处理返利、激励、交换费压力和大客户集中。PayPal 申报文件和 PYUSD
              产品姿态展示了另一条路径：消费者分发经济里，钱包规模和补贴可能与单笔交易利润同样重要。Rain 介于这些模型之间。它看起来比 PayPal 更偏基础设施和企业客户，但比 Mastercard
              这类纯四方网络更偏直接发行和卡项目。结果是理论上有吸引力，实践中披露不足。在收入、毛利率、烧钱和集中度通过私下资料披露之前，财务判断必须保持暂定：收入质量信号有前景，营运资本逻辑强，但公开数据不足以通过完整承保门槛。
