      - number: '6.4'
        title: 留存、扩张动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开来源没有披露 Rain 的 NRR、GRR、客户流失或合同级续约数据。留存图景只能从公开记录里的扩张信号反推。正面信号包括：Western Union 合作建立在此前钱包部署之上，属于后续商业关系；Nuvei
              通过集成扩大了 Rain 的企业触达，属于分销扩张；Series C 公告明确称合作伙伴正以非凡速度增长，本轮融资确保 Rain 能随之扩展基础设施；FRNT
              部署从受控测试网走向全面生产，显示生命周期推进。这些信号合在一起说明有粘性，但仍是轶事，不能替代已披露的留存指标。集中度风险是最大的未量化客户风险。Rain
              没有披露合作伙伴总数、收入分布，也没有披露任何单一伙伴贡献了多少卡交易量。鉴于具名案例只有六到八个，少数伙伴——Spritz、KAST 或
              Nomad——很可能贡献了当前交易量中过高的份额。如果其中任何伙伴转向竞争性稳定币基础设施提供商（BVNK、Nium 或自建方案），影响将是实质性的，而且公开证据无法量化。扩张动态有利于锁定：Rain
              的单一集成模式、嵌入式合规控制和全球卡网络会员资格，让迁移成本很高。卡项目带着既有 BIN 配置、合规历史和用户开户注册，这些都难以迁移。这种粘性有利于留存，但也意味着，如果伙伴项目扩张速度超过 Rain
              基础设施的承载能力，执行风险就落在 Rain 身上。
