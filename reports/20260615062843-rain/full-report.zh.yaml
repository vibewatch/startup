  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: standard
    summary: Rain 的客户工作流展示了合作方如何从接入走到真实卡项目，也展示终端用户如何从稳定币余额完成商户购买——两条路径都穿过 Rain 的基础设施，终端用户不需要理解区块链机制。
    data:
      nodes:
        - id: n1
          label: 合作方接入
          detail: 企业接入 Rain 单一 API，用于卡、钱包、支付或账户
        - id: n2
          label: 项目设计与上线
          detail: Rain 团队帮助界定范围、设计并在 8–12 周内上线卡项目；合规、争议和报告在平台内处理
        - id: n3
          label: 终端用户开户
          detail: 用户通过稳定币钱包链接或法币 ACH/电汇给 Rain 账户入金；KYC/AML 检查内嵌其中
        - id: n4
          label: 卡交易
          detail: 用户在任何 Visa 或 Mastercard 商户刷卡、挥卡或线上结账；稳定币余额实时扣减
        - id: n5
          label: 稳定币结算
          detail: Rain 每天用稳定币向卡网络结算 100% 卡交易量，包括周末和假日；合作方抵押品要求最多降低 60%
        - id: n6
          label: 商户收款
          detail: 商户通过现有 Visa/Mastercard 收单基础设施收到本地货币付款；结账流程不变
        - id: n7
          label: 合作方资金管理
          detail: 合作方获得实时资金可视性、再平衡能力和 webhook 提醒；无需重建即可扩展到新市场
