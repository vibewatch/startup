      - number: '2.2'
        title: 从全球支付到企业可用稳定币流的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              可用的市场图景来自多层视角叠加，而不是一个英雄式 TAM 数字。漏斗顶端，全球跨境支付市场巨大：AlphaPoint 引用 2023 年约 $190T 的交易价值，并指向 2033 年 $300T
              的路径。在这个背景下，稳定币绝对规模已经很大：Transak 称其在 2025 年处理 $33T；PayRam 描述 2026 年年化稳定币经济约 $46T。但这些数字会夸大 Rain
              可直接变现的部分，因为它们仍包含非支付活动。更干净的视角是真实经济中的稳定币使用。Transak 引用 2025 年 $9T 的真实经济交易，并指出 B2B 流成为最大用例，在 $122B
              真实经济稳定币支付中，直接 B2B 支付超过 $76B。OpenFX 给出最清醒的提醒：稳定币吞吐量可能达到数万亿美元，但仍只占全球支付流约 1%。对 Rain 来说，这意味着 TAM 很大，SAM
              是这些真实经济流中受监管的企业子集，而当前 SOM 用公司自己的年化量 >$3B 来代理，比用全球所有链上转账更合理。
