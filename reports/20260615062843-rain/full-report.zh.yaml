    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与产品范围
        blocks:
          - type: paragraph
            body: >-
              Rain 最有公开依据的身份，是一家总部位于纽约、成立于 2021
              年的企业稳定币支付基础设施公司。官网与融资公告始终把公司定位成面向企业、neobank、平台和开发者的基础设施，而不是零售加密应用。产品范围已经覆盖全球卡项目、稳定币钱包、数字美元账户、法币到稳定币转换、付款和跨境支付流。这个宽度很关键：Rain
              不再只是加密卡外壳，而是在销售一层完整编排能力，让合作伙伴用一次集成处理入金、存储、消费和出金。早期创始人材料显示，公司起点更偏加密原生的资金管理和支出管理楔子，围绕 SignandWire 与 DAO
              工作流展开；但 2025–2026 年资料包显示，Rain 明确转向更广义的企业支付基础设施，并把合规、控制和嵌入式钱包工具放在中心。
