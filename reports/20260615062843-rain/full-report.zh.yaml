  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - Rain 的双网络卡位置稀缺
        - Stripe、Mastercard、Visa 和 PayPal 可以把稳定币打包进更大的网络
        - 高
        - 测试客户已经使用 Stripe 或卡组织既有系统时，Rain 是否仍能赢单
      - - 单一集成技术栈减少供应商数量
        - 买方可以分别使用发行方、托管方和编排供应商，实现多归属
        - 高
        - 追问初次上线之后，哪些模块实际上仍会一起部署
      - - 稳定币原生经济性提升资本效率
        - 结算现代化之后，既有玩家可以复制经济性
        - 中
        - 验证 Rain 的储备和结算模型是否仍具结构性优势
      - - 合规就绪基础设施很难搭建
        - Circle、Ripple、Zero Hash、Fireblocks 和 BVNK 都在营销强监管姿态
        - 高
        - 对照每个竞争对手，基准比较牌照、发起银行和可上线地区
      - - 快速上线和开发者友好是差异化因素
        - 尽管推出更慢，安全优先的机构仍可能偏好 Fireblocks 或 BitGo
        - 中
        - 按机构类型拆分赢率，不要把所有潜在客户混在一起取平均
      - - 品类碎片化让垂直专家可以共存
        - Stripe、Mastercard 或 PayPal 若整合市场，可能挤压利润率和分销入口
