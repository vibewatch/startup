  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              Rain 在约四年内完成了三轮已披露融资，每一轮都显著重估公司：Norwest Venture Partners 领投 $24.5M Series A；Sapphire Ventures 领投 $58M
              Series B；ICONIQ Growth 领投 $250M Series C，Andreessen Horowitz Crypto、Founders Fund、Tiger Global Management
              等参投，交易于 2026 年 1 月完成。Series C 使已披露总融资超过 $332.5M，公司 post-money 估值约 $1.95B——The Block 和 Forbes 等多个独立来源均在
              2026 年 1 月报道了这一数字，并与 Rain 自身新闻稿相互印证。本轮被包装为基础设施资本：Rain 称计划把资金用于北美、南美、欧洲、亚洲和非洲的运营牌照，企业销售扩张，以及 agentic
              commerce 产品深度。估值上，这一点很重要，因为大量资本将投向牌照和全球建设，意味着 Rain
              仍处在盈利前阶段，时间表不确定——因此该估值是一次押注未来收入规模的成长股投资，而不是当前财务产出的反映。Series C 完成时，平台披露的运营指标为：卡用户基数同比增长 30 倍、支付量增长 38
              倍、年化卡交易量达到 $3B 或以上，并在 150 多个国家拥有 200 多家企业伙伴。这些指标均未被第三方分析提供商独立验证；Artemis 2026 年 1 月研究数据佐证了更广泛的加密卡支付市场达到
              $18B 年化交易量、年增长 106%，如果 Rain 拥有有意义的市场份额，这与其声称的轨迹相符。
            claimRefs:
              - CV001
