      - number: '7.5'
        title: 缓释、监测与止损标准
        blocks:
          - type: paragraph
            body: >-
              Rain 最成熟的缓释手段在合规和运营控制，最不成熟的在监管牌照管线和竞争定位。公司的嵌入式 KYB/KYC、OFAC 筛查、交易监测和智能合约审计实践，在 Series C 稳定币公司中高于行业平均。Rain
              同时拥有 Visa 和 Mastercard 主会员资格，形成网络多元化，降低了单一网络依赖，但没有消除这种依赖。累计 $338M 融资提供了牌照弹药。投资者应把以下止损标准作为投资逻辑破裂触发器跟踪：（1）12
              个月内，在核心市场（美国、欧盟、英国或新加坡）出现任何监管执法行动或牌照被拒；（2）Mastercard / BVNK 成功把 Rain 前 10 大伙伴中的 3 个以上迁移到竞争基础设施；（3）Rain 在 6
              个月内未能申请至少一个主要市场运营牌照；（4）任何重大 AML 合规失败或制裁违规触发 FinCEN / OFAC 执法；（5）12 个月内联合创始人或 CTO 离职；（6）经独立测量后，Rain
              增长数字回落到同比低于 10 倍。仍未回答的核心尽调问题包括：前 10 大伙伴收入集中度、月度 burn rate 和 runway、安全认证（SOC 2 / PCI
              DSS）、继任计划，以及按司法辖区列出的具体牌照组合。
