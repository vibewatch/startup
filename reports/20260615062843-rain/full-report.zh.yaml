      - number: '7.3'
        title: 伙伴、网络与技术依赖风险
        blocks:
          - type: paragraph
            body: >-
              Rain 的商业模式高度依赖两大卡网络——Visa 和 Mastercard，而两者都在积极开发竞争性的稳定币基础设施。Rain 同时拥有 Visa 和 Mastercard 主会员资格，这一位置并不常见，可在
              150 多个国家提供全球卡受理。不过，这也意味着 Rain 整个卡受理面都取决于是否遵守 Visa 和 Mastercard 的运营规则、BIN 赞助协议和主会员资格要求，而任一网络都可以修改这些要求。Visa
              目前占稳定币领域链上卡交易量的 90% 以上，是 Rain 的关键依赖：Visa 若调整稳定币主会员政策、结算规则或商户类别限制，都会直接冲击 Rain 业务。2026 年 1 月宣布的 BVNK / Visa
              Direct 合作表明，Visa 正在建设一条与 Rain 分开的替代稳定币基础设施通道——如果 Visa 在 Mastercard 收购后偏向 BVNK 技术，它将直接掌握影响 Rain
              竞争位置的杠杆。Mastercard 已签署最终协议，以最高 $1.8B 收购 BVNK（2026 年 3 月宣布），这是 Rain 伙伴战略面临的最大短期风险：它让 BVNK 不再是独立竞争者，却换成了
              Mastercard 支持的稳定币基础设施能力，可能在企业账户中直接替代 Rain。Mastercard 于 2026 年 6 月继续扩展稳定币结算能力，也确认了这一路径。Rain 已宣布的 ACH 和 SEPA
              集成计划依赖未具名合作银行，其条款和可用性并不公开。云基础设施和智能合约依赖也未公开披露。Circle 和 Tether 是稳定币发行人，Rain 持卡人花费其代币；它们也是托管交易对手，运营完整性并不完全受
              Rain 控制。
