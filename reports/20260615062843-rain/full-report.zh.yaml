  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同行、既有巨头与替代方案构成的版图
        blocks:
          - type: paragraph
            body: >-
              Rain 的直接同行，是向企业销售可编程稳定币支付基础设施的平台。已被 Stripe 收购的 Bridge，是最干净的 API-first 对手：它销售
              receive/store/convert/issue/spend APIs，现在坐在 Stripe 的全球商户分发里。BVNK 以面向企业的全球稳定币支付栈竞争，具备强法币 / 稳定币编排能力；Zero
              Hash 则在广泛牌照覆盖下，瞄准白标 B2B2C 稳定币基础设施。Circle 和 Ripple 是相邻但重要的对手，因为它们控制或赞助稳定币轨道——分别是 USDC 与
              RLUSD——即便并非品牌化发卡的最佳选择，也能获得发行方主导的信任和流动性优势。Fireblocks、BitGo 和 Cobo
              不是镜像替代品，但当买家更看重托管、策略控制和资金级安全，而非上线速度时，它们越来越会竞争同一预算。PayPal PYUSD 和 Stripe
              原生产品，是分发能力很强的替代方案，能把稳定币打包进巨大的既有支付生态。内部自建、银行赞助的资金栈、既有发卡或付款处理商仍是现状替代品，尤其在客户更愿意组装多个组件、而不是采用一家整合供应商时。
