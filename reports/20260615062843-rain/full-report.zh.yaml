      - number: '2.3'
        title: 买家分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Rain 这类基础设施的经济买家通常不是 crypto 交易者或终端消费者，而是产品、资金、支付或平台运营者；他们想提升营运资本效率，或在不从零重建受监管基础设施的情况下打开新走廊。最自然的买家细分包括
              PSP、fintech 应用、neobank、汇款运营商、薪资和承包商支付平台、扩展消费用例的交易所，以及需要嵌入式钱包或卡的全球
              marketplace。用户随工作流变化：财务团队使用资金和付款轨道，运营团队使用对账和报告，终端客户或承包商可能只看到一张品牌卡或钱包。付费方往往是授权使用基础设施的企业，使用者则可能是企业账户、商户、创作者、承包商或消费者。采用通常从一个痛点工作流开始，例如跨境供应商付款或与卡相连的稳定币消费；等合规、流动性和用户体验证明可靠后，再扩展到相邻模块。这正是单一集成平台有价值的原因：买家希望一个供应商解决网络接入、嵌入式钱包、卡、KYC/AML
              和结算，而不是拼接五家供应商和内部资金逻辑。
