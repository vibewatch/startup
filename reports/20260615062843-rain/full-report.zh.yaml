  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 收入 / 交易量
      - EV 或估值
      - EV/Revenue 倍数
      - 与 Rain 的相关性
      - 主要局限
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Selected from public comps, M&A transactions, and private rounds in card issuing and stablecoin payments
        infrastructure; cross-referenced against Finro Q1 2026 dataset, SaaS Valuation Multiple Q1 2026 analysis, and
        SEC filings; covers the material comp set for a stablecoin card issuing infrastructure company at Series C stage
    rows:
      - - Marqeta (MQ)
        - 上市公司 — 发卡平台
        - 2025 财年净收入 $625M（+23%）；TPV $383B（+31%）
        - 约 $1.62B 市值（2026 年 6 月）
        - 约 1.5x LTM EV/Revenue
        - 最接近的上市可比公司；面向 fintech 和企业提供发卡即服务；全球 principal member
        - 收入基数更高；盈利路径更清晰；单一网络历史包袱；不聚焦稳定币；客户集中度更高（Block、Uber 占主导）
      - - Adyen
        - 上市公司 — 全球支付平台
        - 约 $3B 净收入；多轨道（收单 + 发卡）
        - 约 $36B 市值（2026 年 Q1）
        - 约 8.1x LTM EV/Revenue
        - 全球支付基础设施的高端基准，平台多轨道、企业级、支持多币种
        - 规模更大；收单主导而非发卡主导；没有稳定币；欧洲锚点；Rain 收入需达到 5x+ 才有可比性
      - - Flywire
        - 上市公司 — B2B 支付走廊
        - 2026 财年指引按固定汇率 +15–21%；EBITDA 利润率约 22.5%；估算净收入约 $430M
        - 约 $900M 市值（2026 年 Q1）
        - 约 2.1x LTM EV/Revenue
        - B2B 支付垂直专精；经常性收入特征；增长率中等
        - 教育 / 医疗垂直领域，不是加密；增长较低；约 2x 倍数反映早期成熟，而非早期阶段
      - - Bridge（Stripe 收购）
        - M&A — 稳定币编排
        - 收购时稳定币年化交易量 $10B+
        - Stripe 以 $1.1B 收购（2025 年 2 月）
        - 约 0.11x EV/TPV（未披露收入）
        - 最接近的 M&A 可比案例；Stripe 以 $1.1B 收购稳定币 API 基础设施；为稳定币基础设施 M&A 设定底价
        - 未披露收入；偏编排而非偏发卡；Stripe 战略溢价抬高价格，不能等同独立公司价值
      - - BVNK（Mastercard 收购）
        - M&A — 稳定币卡基础设施
        - 未披露；2026 年 1 月为 Visa Direct 试点合作伙伴
        - 最高 $1.8B（2026 年 3 月宣布）
        - 无法计算（收入未披露）
        - Rain 最直接的竞争对手；同样做稳定币卡基础设施 + 企业客户；Mastercard 最高支付 $1.8B
        - 交易尚待完成；准确价格不确定（earnout 结构）；Mastercard 战略溢价可能高于独立公司价值
      - - Klarna（IPO）
        - 上市公司 — BNPL / 消费支付
        - IPO 层面未披露收入；基于 GMV
        - IPO 时 $15B（2025 年 9 月）；低于 2021 年峰值 $45.6B
        - 不可比；仅作示例
        - 展示 fintech 倍数压缩风险；尽管继续增长，4 年间估值从 $45.6B 重估至 $15B
        - 消费 BNPL 不是支付基础设施；模式完全不同；这里只作为倍数压缩先例，不是业务可比公司
    notes: >-
      倍数来自 Finro 2026 年 Q1 fintech 数据集（416 家公司）、SaaS Valuation Multiple 2026 年 Q1 分析，以及 Marqeta（2025 财年）和 Visa（2025 财年）的
      SEC 文件。Rain 未披露收入，无法计算 EV/Revenue；本章所有 Rain 相关隐含倍数都是基于 take-rate 假设的分析情景。M&A 价格按公告口径； earnout 部分未必能完全实现。Stripe 和
      BVNK 可比价格属于战略 M&A，通常高于独立公司公允价值。
