      - number: '4.3'
        title: 资本充足性、融资依赖与公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Rain 的公开牵引力代理指标足以支持严肃尽调，但不足以完成承保。Series B 与 Series C 披露显示，2025 年交易量增长 10 倍，进入 2026 年活跃卡基数增长 30 倍，年化交易量超过
              $3B，合作伙伴超过 200 家。这些数字方向上支持公司，因为它们暗示真实网络使用和不断增长的装机基础。公司也明确表示，Series C 资金将用于更多监管牌照、战略收购和地域扩张，这说明 Rain
              仍处在资本投入型建设期，而不是已经宣布具备自我维持经营杠杆的阶段。公开材料未披露手头现金、月度烧钱、资金 runway、债务设施、储备余额或信用损失敞口。因此，资本充足性仍是开放问题。Rain
              显然筹到了足够资金继续扩张，但市场无法判断，如果增长放缓、激励上升或监管扩张慢于预期，公司有多少缓冲。换句话说，融资依赖是可见的，精确 runway 仍不可见。
