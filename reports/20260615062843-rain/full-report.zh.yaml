              SignandWire 副项目演进到 Rain 的 Web3 支出管理工具的早期产品路径。相比融资可见度，治理可见度要薄得多。当前最清楚的公开董事会信号，是 Sapphire Ventures 总裁 Jai
              Das 在 2025 年 8 月 Series B 时加入董事会；Norwest 与 ICONIQ 的投资人评论表明赞助方参与度很强，但没有披露完整董事会名单或委员会结构。Rain
              不到一年就从早期创业公司拉到接近独角兽以上的估值区间，这使 Malik 的关键人依赖和记录不足的治理图景都变得重要。后续尽调的缺口不是谁创立了
              Rain，而是决策权还集中到什么程度，以及加速融资序列附带了哪些投资人治理权。
