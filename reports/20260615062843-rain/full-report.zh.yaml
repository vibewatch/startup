      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              Rain 位于几个领域的罕见交叉点：发卡基础设施（最接近的上市可比是 Marqeta）、高增长支付平台（Adyen 作为溢价锚点），以及稳定币原生 M&A
              标的（Bridge、BVNK）。上市可比共同讲出一个估值倍数高度分散的故事：Adyen 的 LTM EV/Revenue 为 8.1 倍，代表具备多轨网络效应的全球支付基础设施溢价端；Marqeta 约 1.5
              倍，代表发卡平台的压缩端，虽有收入验证，但增长较慢并有客户集中历史；Flywire 的 2.1 倍和 PayPal 的 1.36 倍，落在垂直专业化和成熟支付业务的中低区间。Finro 覆盖 416 家
              fintech 公司的 2026 年 Q1 数据集显示，支付公司平均 EV/Revenue 为 7.7 倍，但中位数只有 3.6
              倍——少数溢价平台运营商（Adyen、Stripe）抬高平均值，使其明显高于多数支付公司实际交易水平。Fintech 整体平均 14.5 倍、中位数 7.6 倍，也体现了同样的溢价离群扭曲。私营和 M&A
              可比中，最直接相关的交易是 Stripe 以 $1.1B 收购 Bridge（2025 年 2 月完成；当时 Bridge 年化稳定币交易量超过 $10B），以及 Mastercard 宣布以最高 $1.8B
              收购 BVNK（2026 年 3 月；BVNK 是 Rain 在稳定币卡基础设施中最接近的直接竞争者）。Stripe 本身在 2026 年 2 月二级 tender offer 中估值 $159B，按估计
              $1.9T 总支付量推算，收入倍数为高个位数。Rain 的 $1.95B 估值略高于 BVNK M&A 先例，远低于 Stripe 溢价——这说明市场将 Rain 定价为可信但尚未占主导的稳定币基础设施玩家。
