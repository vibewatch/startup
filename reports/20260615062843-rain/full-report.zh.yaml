      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Rain 最可能的退出路径是战略 M&A 和推迟后的公开市场上市。M&A 方面，自然买方包括主要卡网络（Visa、Mastercard）、大型支付平台（Stripe、PayPal），或寻求稳定币能力的金融基础设施
              incumbents。Stripe / Bridge 和 Mastercard / BVNK 先例说明，收购方愿意在收入显著证明之前，为稳定币基础设施平台支付 $1–2B；但这些收购发生在 Rain
              生命周期类比中更早的阶段。以 $1.95B 估值看，Rain 可能需要拿出更多财务证据，才能支撑高于当前估值的溢价退出。IPO 路径上，上市可比（Marqeta 1.5 倍、Flywire 2.1
              倍、PayPal 1.36 倍）表明，如果 Rain 按当前估值上市，就必须证明收入显著高于当前活动指标所暗示的水平；否则，以 $1.95B IPO 会有明显 down-round 风险。Visa 的 $40B
              收入和 257.5B 年交易笔数（FY2025）提供了规模上限背景：Rain 的 $3B TPV 远低于 Visa 交易基础的 1%，这既确认了增长轨迹若能保持，向上空间巨大，也说明 Rain
              要成为可持续独立上市公司还差得很远。Rain
              当前的退出准备度仍是商业化前：它披露了伙伴关系，但没有披露收入，限制了能够承销这一价格的机构买方或公开市场投资者范围。关键尽调问题包括：按产品线拆分的收入和毛利率、伙伴集中度（前 10 大伙伴占 TPV
              比例）、burn rate 和 runway、按伙伴层级划分的实际 take rate，以及北美和欧盟牌照申请状态。没有这些，任何投资逻辑都建立在活动代理指标上，而非财务基本面。
