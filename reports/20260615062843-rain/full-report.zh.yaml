companyProfile:
  summary: >-
    Rain 是一家私营企业稳定币支付基础设施公司，2021 年由 Farooq Malik（CEO）和 Charles Naut 创立，总部位于纽约。公司通过单一
    API，帮助金融科技公司、neobank、企业和开发者发行稳定币资金支持的卡、运行跨境付款、嵌入钱包，并管理法币与稳定币之间的转换。Rain 同时拥有 Visa 和 Mastercard
    的主会员资格——这是少见的竞争位置，让卡项目可触达全球 1.75 亿多个商户受理点。自 2025 年 3 月 Series A 以来，公司不到一年完成三轮融资：$24.5M Series A（Norwest）、$58M Series
    B（Sapphire Ventures），以及由 ICONIQ Growth、a16z Crypto、Founders Fund、Tiger Global 领投 / 参投的 $250M Series C，投后估值
    $1.95B。公司在 Series C 完成时披露的牵引力包括卡基数同比增长 30 倍、支付量增长 38 倍、年化交易量超过 $3B，以及覆盖 150+ 国家 / 地区的 200+
    企业合作伙伴。收入、毛利率、员工数和董事会构成仍未披露。
