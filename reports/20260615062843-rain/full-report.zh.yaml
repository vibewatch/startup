      - number: '7.4'
        title: 竞争、集中度与财务风险
        blocks:
          - type: paragraph
            body: >-
              Rain 面临快速升温的竞争格局，同时还有实质性的集中度和财务模型风险。竞争端，Stripe 以 $1.1B 收购 Bridge，把全球最大的私营支付基础设施公司直接带入稳定币编排层；Nium 也在 2026 年
              3 月推出自己的稳定币发卡平台。Forbes 2026 年 1 月的竞争分析指出，部分玩家（尤其 Gemini）会故意在加密卡上亏钱，以此获客——这意味着资本充足的竞争者可能用补贴后的卡经济性压低 Rain
              的伙伴定价。Rain 融资时 $1.95B 的 Series C 估值只有在当前增长轨迹延续时才站得住：30 倍卡基数和 38 倍支付量增长由公司披露，未被第三方分析、卡网络数据或链上监测独立验证。公司披露了
              $3B 年化卡交易量，但没有披露收入 run rate、毛利率或单位经济性。集中度方面，除「200+ 伙伴」外，Rain
              没有公开披露合作伙伴总数，也没有披露各伙伴收入分布。基于公开证据，少数具名伙伴——Spritz、KAST、Nomad、Western Union 和 Nuvei——很可能贡献了当前交易量中过高的份额；Rain
              非正式承认了这一点，称关键伙伴正「以非凡速度增长」。Rain 到 Series C 已融资 $338M，但正把资本投向牌照、基础设施和市场扩张；公司没有披露盈利时间表或 burn rate，runway
              难以评估。Agentic AI commerce 产品（Agent Control Layer）又引入一种新兴风险：Know Your Agent（KYA）合规标准尚未进入正式监管，而 Rain
              在这一市场的早期定位可能带来先发监管暴露。
