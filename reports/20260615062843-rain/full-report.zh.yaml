          label: AML / 欺诈风险
        - id: network-risk
          label: Visa / 网络依赖
        - id: competitive-risk
          label: 竞争替代（BVNK / Stripe）
        - id: concentration-risk
          label: 合作伙伴集中风险
        - id: revenue-impact
          label: 收入流失
        - id: partner-churn
          label: 合作伙伴流失
        - id: network-access
          label: 失去银行卡网络接入
        - id: regulatory-penalty
          label: 监管处罚 / 执法
        - id: valuation-impact
          label: 估值压缩
      edges:
        - from: reg-risk
