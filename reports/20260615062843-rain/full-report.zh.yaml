  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价逻辑与变现面
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个真实但不完整的变现故事。披露最清楚的收入引擎是交换费：SiliconANGLE 称，企业发行 Rain 驱动卡会从交换费中产生收入；Rain
              的产品栈也解释了客户为什么即便没有直接稳定币专业能力，也会为平台付费。卡、钱包、出入金通道、奖励、付款和嵌入式账户，都可以在一个企业集成下销售，这强烈指向 SaaS 加用量模式，但 Rain
              不公布标价或实际经济性。这很重要，因为表层交易量与实际净收入之间的差距可能很大，取决于价值在
              Rain、卡网络、发卡银行、赞助方和合作伙伴之间如何分配。因此，现有数据支持一个高置信结论和一个较低置信推断：高置信的是交换费和卡使用在经济上重要；中等置信的是，额外的编排、钱包、奖励和付款费用可能补足模型。市场仍缺少抽佣率、合同结构和按产品线划分的收入组合。
