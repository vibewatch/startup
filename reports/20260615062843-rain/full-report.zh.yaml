  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Rain
        - 全栈卡 / 钱包 / 付款基础设施
        - Series C 轮，估值 $1.95B；年化交易量 >$3B；200+ 合作伙伴
        - 企业、Neobank、平台
        - 双网络发卡，加上钱包和付款，合在一套技术栈里
        - 已安装分发规模小于 Stripe、PayPal、Mastercard 或 Circle
      - - Bridge / Stripe
        - API 优先的稳定币编排
        - Stripe 以 $1.1B 收购 Bridge；Stripe 拥有商户和付款规模
        - 金融科技公司、PSP、市场平台、Stripe 商户
        - 开发者优先 API 加上 Stripe 分发
        - 独立 Bridge 定位可能被 Stripe 打包销售吸收
      - - Circle
        - 发行方主导的稳定币支付轨道
        - USDC 流通量 $74.8B；1000+ 合作伙伴；34 条链
        - 机构、交易所、PSP、开发者
        - 储备透明度和原生 USDC 流动性
        - 默认不是完整的品牌发卡技术栈
      - - Fireblocks
        - 托管优先的结算基础设施
        - 已保护交易 >$14T；数千家机构；150+ 条区块链
        - 银行、PSP、机构资金团队
        - MPC 托管、政策控制、机构级安全
        - 上线由企业门槛控制，卡分发也不够即开即用
      - - BVNK
        - 稳定币驱动的企业支付技术栈
        - $25B+ 至 $30B+ 年吞吐量信号；130+ 个国家
        - 企业、PSP、平台
        - 法币 / 稳定币编排，并接入 Visa Direct 和 Mastercard
        - 公开交易量数字在不同来源间不一致，卡专业化也不如 Rain 核心
      - - Ripple
        - 发行方和银行网络主导的支付轨道
        - RLUSD 加 Ripple Payments；第三方指南称有 300+ 家金融机构
        - 银行、PSP、汇款提供商
        - 银行关系和合规跨境结算
        - 对开发者自助不够友好，也不围绕品牌卡项目
      - - Zero Hash
        - 白标 B2B2C 基础设施
        - 51 个美国司法辖区，以及 MiCAR+EMI 欧洲布局
        - 金融科技公司、Neobank、券商、支付平台
        - 牌照覆盖广，白标嵌入模式
        - 产品和分发品牌在终端买方面前不够可见
      - - PayPal PYUSD
        - 消费者 / 商户分发邻近场景
        - PayPal 70 个市场路线图；商户结账接受
        - 消费者、商户、PayPal 生态合作伙伴
        - 大规模分发和简单的钱包原生 UX
        - 不是为最深的独立企业基础设施层而建
    notes: 规模单元格混合了公司官方披露和可信第三方报道。公开数字冲突或不完整时，本表保留区间，不强行给出虚假的精确度。
