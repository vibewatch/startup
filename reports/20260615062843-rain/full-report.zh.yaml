      - number: '7.2'
        title: 欺诈、AML 与安全风险
        blocks:
          - type: paragraph
            body: >-
              稳定币支付行业承担结构性的 AML / 非法金融责任，这给 Rain 这样的基础设施提供商带来持续监管和声誉风险。FATF 2026 年 3 月定向报告发现，稳定币占 2025 年全部非法虚拟资产交易量的
              84%，包括朝鲜和伊朗等国家关联行为人的洗钱、勒索软件收益和规避制裁。Chainalysis 报告称，2025 年非法加密活动总额达到 $154B，同比增长 162%；TRM Labs 估计为
              $158B。FATF 和合规分析师都把跨链桥接识别为主要监测盲区：稳定币从一条链桥接到另一条链后，可能绕开原链上的合规控制，监管机构尚未补上这个缺口。Rain 的合规框架覆盖了几个向量：所有伙伴项目上线前完成
              KYB/KYC 尽调；在开户注册、监测和交易层面应用符合 OFAC 的地域和制裁控制；持续监测区块链地址的可疑活动；并让外部审计机构审查智能合约。不过，在伙伴管理的项目里，Rain 将主要 AML
              和欺诈风险责任转给伙伴——这意味着其 200 多个伙伴网络中每个实体的合规质量都会影响 Rain。Rain
              的风险指南明确承认，所有基于卡的支付系统都存在卡共享、凭证盗窃和二级市场，欺诈损失主要由商户和伙伴承担。如果 GENIUS Act 拟议 AML 规则最终落地，Rain 或其 PPSI 伙伴将需要提交
              Suspicious Activity Reports、维护风险评估并实施制裁合规计划——这些能力既是成本，也是持续运营风险。PwC
              分析指出，新框架关注计划有效性，而不只是是否存在，这意味着执法暴露会随合规成熟度放大。
