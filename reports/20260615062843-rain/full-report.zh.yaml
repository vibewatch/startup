  productSummary: >-
    Rain 销售一套垂直整合的稳定币支付平台，由四个模块组成：发卡（Visa 与 Mastercard 主会员）、支付（跨境付款、24/7
    结算）、钱包（托管与非托管、多链）和账户（ACH、电汇、稳定币入金）。平台支持包括周末和节假日在内的每日链上结算、可配置消费控制、内置 KYC/AML 与 PCI DSS 合规，以及覆盖 10+ 条区块链的 Multiplex
    跨链引擎（来自 2025 年收购 Fern）。卡项目可在 8–12 周上线，而传统替代方案通常需要五个多月。
  customerFocus: >-
    B2B 买家包括 fintech、neobank、交易所、汇款运营商、企业平台、薪资处理商，以及希望嵌入稳定币卡或支付基础设施、但不想自己搭建受监管银行轨道的开发者。已知部署包括
    Spritz、Lydian、KAST、Nomad、Takenos、Felix Pago、Nuvei、Western Union，以及 Wyoming 的 FRNT 州稳定币项目。
  businessModel: 主要收入机制来自企业发行 Rain 驱动卡时产生的交换费和卡项目费用。其他变现面推测包括全栈平台上的编排、钱包、付款和奖励费用。抽佣率与合同结构未公开披露。每日稳定币结算降低了合作伙伴准备金要求，使该模式从资产负债表角度看更轻。
