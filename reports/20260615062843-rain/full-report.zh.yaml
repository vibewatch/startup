  - id: FR003
    title: 依赖图——Rain 的关键外部依赖
    type: dag
    layout: wide
    summary: 有向依赖图展示 Rain 的关键外部交易对手和基础设施依赖，并在边上标注依赖类型和 Rain 的控制水平。
    data:
      nodes:
        - id: rain
          label: Rain
        - id: visa
          label: Visa（主会员资格）
        - id: mastercard
          label: Mastercard（主会员资格）
        - id: circle
          label: Circle / USDC
        - id: tether
          label: Tether / USDT
        - id: partner-banks
          label: 合作银行（ACH / SEPA）
        - id: partners
          label: 200+ 个项目合作伙伴
        - id: cloud
          label: 云 / 区块链基础设施
        - id: auditors
          label: 智能合约审计方
      edges:
        - from: rain
          to: visa
          label: 刷卡受理和主会员资格（关键、合同约束）
        - from: rain
          to: mastercard
          label: 刷卡受理和主会员资格（重要、合同约束）
        - from: rain
          to: circle
          label: Visa 项目以 USDC 作为结算货币（高依赖）
        - from: rain
          to: tether
          label: 面向拉美 / 亚太合作伙伴支持 USDT（中等依赖）
        - from: rain
          to: partner-banks
          label: 计划通过银行合作接入 ACH / SEPA（开发中）
        - from: rain
          to: partners
          label: 收入来源；Rain 依赖合作伙伴增长和合规质量
        - from: rain
          to: cloud
          label: 基础设施托管和区块链节点运营（供应商未披露）
        - from: rain
          to: auditors
          label: 部署前完成智能合约安全审计
        - from: partners
          to: rain
          label: 交易量和 AML 合规质量会回流影响 Rain 的风险画像
    approximationNotes: 依赖关系由公开披露推断；具体云服务商、银行合作伙伴和智能合约审计方未公开点名。边标签基于公开商业模式描述，标示 Rain 的控制水平和依赖类型。
    claimRefs:
      - CR014
      - CR021
