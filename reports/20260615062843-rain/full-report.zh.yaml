  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 隐含收入 / 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市（3–5 年视角）
        - TPV 扩大到 $30B（10x）；take rate 为 5%（软件 / API 平台经济性）；美国、欧盟、APAC 监管牌照落地；无重大合作伙伴流失；Mastercard/BVNK 集成延迟，或仅限单独企业层
        - 5% take rate 下收入约 $1.5B；8x 远期收入（Adyen 级别）意味着 $12B 退出估值；相对 $1.95B 入场约 6x；或以 6–8x 收入并购，对应 $9–12B
        - Mastercard/BVNK 激进部署，Visa 直接扩张稳定币削弱 Rain 网络优势；监管延迟到 2028 年以后，限制扩张
        - 中低；需要超强执行和有利监管环境同时出现
      - - 基准（3–5 年视角）
        - TPV 增至 $10B；take rate 为 3–4%；到 2028 年取得美国和一个主要非美国牌照；合作伙伴流失温和；Mastercard/BVNK 竞争限制企业份额提升
        - 3–4% take rate 下收入约 $300–400M；以 4–5x 收入并购退出，对应 $1.2–2B，接近 $1.95B 入场价；IPO 以 3–4x 计，对应 $900M–$1.6B，小幅亏损
        - 盈利前烧掉 $200M+；竞争替代加速；净收入倍数压到 3x 以下，压缩退出回款
        - 中；与当前证据和竞争市场中基础设施金融科技的可比结果最一致
      - - 熊市（2–4 年视角）
        - TPV 停滞在 $3–5B；Mastercard/BVNK 替代 Rain 企业管线的 30%+；美国 / 欧盟牌照被拒或延迟到 2029 年；竞争价格压力使 take rate 低于 2%
        - 2% take rate 下收入约 $60–100M；需要下轮融资延长跑道；下一轮价格低于 $1.95B；出现类似 Klarna 从峰值约 2x 到 0.7x 的重估
        - 稳定币基础设施遭遇更多监管执法；关键合作伙伴加速离开；烧钱率超过每年 $100M，且没有盈利路径
        - 中低；考虑监管和竞争轨迹，概率不低，但需要多个不利事件同时发生
    notes: >-
      情景假设以 Rain 公开披露的 $3B 年化 TPV 为当前基线。Take rate 根据发卡和支付基础设施平台的行业常态估算；Rain 实际 take rate 未披露。收入数字是分析估算，不是 Rain
      提供的数字。概率信号基于行业可比公司和公开证据权重的定性评估。熊市情景引用 Klarna 重估，是金融科技倍数压缩的示例先例，不是直接商业模式对比。
    claimRefs:
