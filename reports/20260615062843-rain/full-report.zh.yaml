  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Rain 身处快速成形的监管环境。短期内，这是最大威胁；若处理得当，也可能成为最可防守的护城河。美国 GENIUS Act 于 2025 年 7 月 18
              日颁布，建立了首个支付稳定币的全面联邦框架，要求获准支付稳定币发行人（PPSI）以高质量流动资产维持 1:1 储备，并履行完整 Bank Secrecy Act 义务。OCC 于 2026 年 2 月 25
              日发布拟议规则制定通知，覆盖储备资产、赎回、风险管理、审计和资本要求。关键在于，FinCEN 和 OFAC 于 2026 年 4 月 8 日联合提议，将 PPSI 视为 BSA 下的金融机构——要求书面
              AML/CFT 计划、强制 OFAC 制裁合规计划（首次由立法强制），以及持续风险评估。完整 GENIUS Act 制度将在 2027 年 1 月 18 日，或最终规则发布后 120 天生效。Rain
              是支付基础设施提供商，而非稳定币发行人，因此合规位置更微妙：它很可能必须确保合作 PPSI 符合 GENIUS Act 要求，但 Rain 自身在美国市场可能需要取得牌照，或与持牌实体合作。欧盟 MiCA 自
              2024 年 12 月起全面适用，要求在欧盟经营的稳定币发行人和电子货币机构获得国家主管机构授权。Rain 在 150 多个国家运营，必须同时满足多个监管制度。Series C
              公告明确称，公司计划在北美、南美、欧洲、亚洲和非洲取得运营牌照——这是一场跨多年、跨多司法辖区的牌照战役，会消耗大量资本和管理层注意力，时间表和成本均不确定。PayPal 2026 年 10-K
              确认，即便对成熟平台而言，数字资产监管碎片化也是首要风险因素。除 Mastercard 和 Visa 主会员资格外，Rain 没有按司法辖区披露已持牌照，投资者无法完整看清其监管状态。
