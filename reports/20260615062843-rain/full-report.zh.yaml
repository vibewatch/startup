    columns:
      - 维度
      - 评估
      - 理由
    rows:
      - - 建议
        - 继续研究
        - Rain 增长极强，但收入、利润率和盈利时间线未披露；没有财务尽调，无法正式承销 $1.95B 的 Series C 价格
      - - 置信度
