          detail: 与卡网络做每日稳定币结算，包括周末和假日；通过 Fern 收购获得 Multiplex 跨链路由器，覆盖 10+ 条区块链；感知流动性的支付路由；FX 转换
          modules:
            - 稳定币结算（Visa 试点以 USDC 为主）
            - Multiplex 跨链路由（Fern）
            - FX 与 swap 执行
            - 流动性来源聚合
        - label: 核心产品模块
          detail: >-
            发卡（虚拟卡和实体卡、信用卡和预付卡，支持 AI agent）；Payments（跨境、24/7、可编程流程）；Wallets（多链、托管和非托管）；Accounts（ACH、电汇、通过 SSB 的稳定币
            on-ramp）
          modules:
            - 发卡 — 虚拟卡、实体卡、信用卡、预付卡
            - Payments — 跨境付款、资金管理
            - Wallets — 多链、嵌入式或无头
            - Accounts — ACH、电汇、法币 on-ramp
        - label: 合规与安全控制
          detail: 内嵌 KYC/AML、交易监控、制裁筛查；PCI DSS、SOC 2、已审计智能合约；3D Secure 卡认证；RBAC 和委托访问
          modules:
            - KYC/AML，含交易监控
            - PCI DSS 和 SOC 2
            - 已审计智能合约
            - 3D Secure；RBAC
        - label: 合作方与开发者接入
          detail: 所有模块共用一个 API；无头 UI 组件；webhook 和实时监控；docs.rain.xyz 的开发者文档设门槛；核心代码专有（1 个公开 GitHub 仓库）
          modules:
            - 统一单一 API
            - 无头和嵌入式 UI 组件
            - Webhook 和监控
            - 设门槛的 API 文档（docs.rain.xyz）
    approximationNotes: 分层结构来自官方产品页、媒体报道和案例研究推断。未找到公开架构图或技术白皮书。
