        blocks:
          - type: paragraph
            body: >-
              Rain 在本报告所有章节中拥有最强的客户证据。五个案例研究和多篇新闻稿记录了与具名交易对手的具体部署。Spritz：一家 crypto 原生 fintech，完全基于 Rain 构建其 Visa
              Signature 卡。案例研究确认了钱包到卡的即时入金、覆盖数千种受支持 crypto 资产、多链兼容、3D Secure 保护、Apple Pay 和 Google Pay 支持，以及全球 Visa
              商户受理。Lydian：一张由 Tether 支持的高端 Visa Platinum 卡，CEO Carl Grimstad 引述称 Rain
              的稳定币基础设施对持卡人不可见——商户收到本地货币，持卡人花费稳定币余额。Rain 确认该案例不要求商户 POS 系统做任何改变。FRNT（Wyoming Stable
              Token）：美国州政府发行稳定币在公链上的首个生产部署。FRNT 构建在 Avalanche 上，以获得亚秒级最终性和低费用；根据 Wyoming Stable Token Act，FRNT 由 T-bills
              和 USD 以 102% 支持。Hashfire 试点把承包商付款周期从 45 天压缩到几秒，案例研究直接引用效率提升 99.99995%。Western Union：Rain 于 2025 年 11 月加入
              WU 的 Digital Asset Network（PR Newswire 公告），允许 Rain 驱动稳定币钱包持有人在 WU 覆盖 150+ 国家 / 地区和 130+
              货币的全球零售网络中兑换本地现金。Western Union 副总裁 Malcolm Clarke 的引述支持 Rain 在该网络中的角色。Nuvei：战略合作把 Rain 的稳定币发卡 API 集成进
              Nuvei 更广泛的企业支付栈，使 Rain 无需为每笔交易自建企业销售团队，也能扩大到企业和机构客户。KAST（kast.xyz）：KAST 明确面向自由职业者、远程工作者和 crypto 用户在全球提供
              Rain 驱动的 Visa 卡；它与 YC 有关联，并提供最高 3% cashback。
