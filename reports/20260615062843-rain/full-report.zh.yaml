  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买家画像
        blocks:
          - type: paragraph
            body: >-
              Rain 瞄准的是 B2B 受众：fintech、企业、交易所、marketplace
              和开发者。他们希望发行稳定币驱动的卡，或在不自己搭建银行基础设施的情况下全球转移资金。公开证据支持五类清晰买家。第一，crypto 原生消费者 fintech：Spritz、Lydian、KAST
              这类公司，其终端用户持有稳定币，并希望在日常商业中消费。它们需要 Visa 受理、无锁定卡入金和内置合规。第二，跨境支付和汇款平台：Nomad（3.8M+ 巴西用户）、Takenos（覆盖 20
              个拉美国家，交易量 $560M+）和 Felix Pago（基于 WhatsApp 的汇款额 $6B+）把 Rain 的稳定币钱包和卡用作美元储蓄产品的「消费」层。第三，企业和机构平台：Nuvei 将 Rain
              发卡集成进其企业支付栈；Western Union 的 Digital Asset Network 用 Rain 驱动的钱包，把稳定币余额连接到 150+ 国家 /
              地区零售点的现金。第四，政府和公共部门实体：Wyoming 的 Frontier Stable Token（FRNT）项目使用 Rain
              发行的卡，成为美国州政府发行数字资产的首个生产部署，展示了其他州可复制的监管蓝图。第五，agentic AI commerce：YC 支持的 Sponge 使用 Rain 的 Agent Control
              Layer，为自主 AI agents 发行稳定币资金支持的 Visa 卡。每个细分都有不同采购决策者：fintech 的产品或工程负责人、企业的支付策略负责人或财务主管、州级政府采购办公室，或
              agent-first 公司的 AI 基础设施团队。Rain 的 API-first 模式和单一集成点覆盖发卡、钱包、账户和支付，使同一平台无需定制开销即可服务五类画像。
