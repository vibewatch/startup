      - number: '8.3'
        title: 情景分析——牛市、基准与熊市情形
        blocks:
          - type: paragraph
            body: >-
              Rain 不披露收入，因此情景框架以 $3B 年化卡 TPV 作为活动锚点，并用支付基础设施行业常见 take rate 估算隐含收入。发卡方和支付基础设施平台通常可从处理量中获得 0.5–5%
              的净收入，具体取决于交换费参与、收费结构和服务层级。1% take rate 意味着年收入约 $30M——按 $1.95B 估值，对应约 65 倍 EV/Revenue
              隐含倍数；即便对高增长支付基础设施也非常极端，只有在 Rain 处于很早期商业化阶段且前方增长坡道巨大时才说得通。3% take rate 意味着约 $90M，对应约 22
              倍——与具备已验证网络效应的溢价早期基础设施公司一致。5% take rate 意味着约 $150M，对应约 13 倍——接近 Adyen 区间，如果 Rain 的 API /
              平台经济性带来经常性、高毛利收入，而非纯交易抽成，可能合理。牛市情形：Rain 在 3 年内实现 TPV 增长 10 倍（至 $30B 年化），达到 5%+ take-rate 软件经济性，并取得接近 Adyen
              的约 8 倍远期收入倍数——公司估值 $3–6B，Series C 投资回报 2–3 倍。基准情形：Rain 将 TPV 增至 $10B，在 3–5% take rate 下证明 $150–300M 收入，并以
              4–6 倍收入倍数通过 M&A 退出，退出估值 $600M–$1.8B——相当于持平或较 $1.95B Series C 入场价小幅亏损。熊市情形：Mastercard / BVNK 竞争和监管延误压缩 Rain
              企业管线，TPV 增长放缓至 $4–5B，收入仍不清晰，下一轮融资存在显著 down-round 风险；Klarna 从 $45.6B（2021 年）重估至 $15B（2025 年 IPO）的案例，是
              fintech 倍数压缩的警示先例。
