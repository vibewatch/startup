  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Rain 追逐的不是整个数字资产市场。更精确的边界，是让受监管运营商把稳定币资金支持的卡、钱包、跨境付款、资金划拨和法币到稳定币转换嵌入常规支付工作流的企业基础设施。它包括发卡、钱包账户、B2B
              供应商付款、薪资和承包商发放、与汇款相连的付款，以及对结算速度和流动性敏感的资金再平衡。它不包括纯 crypto 交易、投机性 DeFi
              杠杆、自托管投资，也不包括不直接解决支付或资金工作流的通用区块链基础设施。因此，现状替代方案也很宽：SWIFT 上的代理行电汇、PSP
              主导的跨境付款栈、发卡处理商、本地钱包方案、手工资金运营，以及用银行和合规供应商拼出的内部自建。这个边界很重要，因为它避免本章把每一笔稳定币转账都算进 Rain 的可触达市场。Rain
              真正的市场，位于稳定币在成本、速度、覆盖或资本效率上优于传统轨道，同时又能被企业风险与合规团队接受的交叉点。
