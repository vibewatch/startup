  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件、模块地图与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Rain 的产品套件清晰对应稳定币支付生命周期的四个阶段：入金（账户和入金通道）、存储（钱包）、消费（发卡）和出金（支付与发放）。发卡模块最成熟，也最有公开证据。Rain 自 2025 年 3 月成为 Visa
              Principal Member，并在 2026 年 4 月宣布成为 Mastercard Principal Member；它能通过单一运营模型在关键地区赞助卡项目，让卡可在全球超过 1.75 亿个
              Mastercard 商户和超过 1.5 亿个 Visa 商户受理点使用。Rain 发行虚拟和实体信用卡、预付卡，支持 Apple Pay 与 Google Pay，并为消费者、企业和 agentic
              用例提供可配置消费控制。支付模块提供 24/7 跨境支付执行，内置货币转换、跨流动性来源的自动 swap 路由，以及面向发放、资金再平衡、marketplace
              付款和商户结算的可编程条件逻辑。钱包模块提供托管与非托管选项、多链资产支持，以及可完全品牌化的嵌入式钱包即服务，支持 headless API 或灵活 UI 组件。账户模块通过
              ACH、电汇或直接稳定币转账管理虚拟账户创建和入金。公开材料可见的客户用例包括加密原生消费者卡（Spritz、Lydian）、州发行稳定币项目（Avalanche 上的 Wyoming
              FRNT）、企业跨境薪资（Nomad）、marketplace 付款，以及 AI agent 范围内的虚拟卡。Lydian 卡展示了高端消费者用例：Tether
              支持的消费可实时转换成商户接受的本地货币，持卡人无需执行转换步骤。
