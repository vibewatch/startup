  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管牌照被拒或执法行动
        - 公开监管申报、FinCEN/OCC 公告、Visa/Mastercard 网络状态
        - 任何来自 Tier 1 监管机构（OCC、FinCEN、FCA、ESMA）的执法行动、牌照拒绝或停止令
        - 投资逻辑破裂；重大业务风险；立即启动持仓复核
      - - Mastercard/BVNK 在 3+ 个具名企业账户中替代 Rain
        - 合作伙伴新闻稿、BVNK 产品公告、Rain 客户赢单 / 输单报告
        - Rain 公开点名的头部合作伙伴（Western Union、Nuvei、KAST、Nomad）中，3 家以上在 18 个月内宣布迁移至 BVNK 或同类竞争对手
        - 投资逻辑破裂信号；收入集中度风险显著抬升；重新评估竞争护城河
      - - 针对 Rain 或主要 Rain 合作伙伴的稳定币 AML 执法行动
        - FinCEN SAR 数据、OFAC SDN 名单更新、Rain 或具名合作伙伴新闻监测
        - 任何公开关联 Rain 的 SAR 申报，或具名合作伙伴被列入 OFAC SDN 名单
        - 监管和声誉风险立即上升；Visa/Mastercard 会员资格面临风险；重新评估投资
      - - 增长数据独立验证失败
        - 链上分析（Dune Analytics、Nansen）、Visa/Mastercard 发行方交易量披露、合作伙伴新闻稿
        - 独立测算的 Rain 实际年化卡交易量低于 $1.5B（相较其声称的 $3B），或同比增长低于 10x
        - 投资逻辑依赖增长；在重新验证前，将投资判断下调为「跟踪」
      - - 烧钱率超过每月 $30M，且跑道不足 18 个月
        - 董事会更新、投资人信、再融资公告
        - Rain 在 Series C 交割后 18 个月内启动 Series D，或披露年化经营亏损超过 $300M
        - 资本风险；稀释风险；若新一轮为平轮或下轮，需重新评估
    notes: 否决标准是投资监测用途的建议阈值。触发因素基于公开可观察性；部分事件可能不会实时公开披露。监管执法行动通常会在发生后 30–90 天内通过公开数据库（FinCEN 执法、OFAC SDN 名单、SEC 申报）披露。
  - id: TV001
