  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 决策链从市场证据、竞争位置、财务证据质量和估值出发，落到继续研究建议，并给出有条件上调路径。
    data:
      nodes:
        - id: market
          label: 市场验证
          detail: 加密卡增长 106%；年化 $18B；稳定币 TAM 拐点已确认
        - id: product
          label: 产品和护城河
          detail: 同时拥有 Visa/MC 主会员资格；200+ 个合作伙伴；全栈 API 平台
        - id: competition
          label: 竞争风险
          detail: Mastercard/BVNK 和 Visa 内部基础设施是有网络背书的威胁，并享有优先分发
        - id: financials
          label: 财务证据
          detail: 收入、利润率、盈利时间表均未披露；隐含 13x–65x 倍数区间
        - id: valuation
          label: 估值评估
          detail: $1.95B 达到或高于 M&A 先例；3–5% take rate 下可辩护；1–2% take rate 下要求很高
        - id: recommendation
          label: 继续研究
          detail: 有条件正面；承销 Series C 价格前，需要披露收入和单位经济
        - id: upgrade-path
          label: 上调至买入
          detail: 收入 >$100M，毛利率 >50%，头部合作伙伴集中度 <30%
      edges:
        - from: market
          to: valuation
          label: 正向信号；支持溢价
        - from: product
          to: valuation
          label: 网络护城河支撑基础设施溢价
        - from: competition
          to: valuation
          label: 削弱护城河价值；压缩合理倍数
        - from: financials
          to: valuation
          label: 证据缺口；阻止正式承销
        - from: valuation
          to: recommendation
          label: 未披露收入时估值偏紧
        - from: recommendation
          to: upgrade-path
          label: 财务披露将打开买入论证
    approximationNotes: 流程代表分析师对各维度证据如何传导到最终建议的判断。节点是第 2 章（市场）、第 3 章（竞争）、第 4 章（财务）和第 8 章（估值）多因素分析的简化摘要。边标签表达方向性信号，不是量化权重。
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV031
      - CV036
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Rain 在六种 take rate 和退出情景组合下的隐含 EV/Revenue 倍数，并与上市可比公司区间对标。
    data:
      items:
        - label: Rain（1% take rate，$30M 收入）
          value: 65
          detail: 极端；$1.95B / $30M 隐含收入。没有可比的支付基础设施上市公司能长期维持 65x。
        - label: Rain（3% take rate，$90M 收入）
          value: 22
          detail: 高增长基础设施情景。与早期高溢价平台定位一致，但需要收入快速放量。
        - label: Rain（5% take rate，$150M 收入）
          value: 13
          detail: 最优收入情景。接近 Adyen 区间；如果能证明软件经济模型，估值可辩护。
        - label: Adyen（上市，2026 年 Q1）
          value: 8
          detail: 8.1x LTM EV/Revenue；全球多轨支付平台；基础设施公司高溢价上市锚点。
        - label: 支付公司中位数（2026 年 Q1）
          value: 4
          detail: Finro 2026 年 Q1 数据集（416 家公司）显示，上市支付公司 EV/Revenue 中位数为 3.6x。
        - label: Marqeta（上市，2026 年 Q1）
          value: 2
          detail: ~1.5x LTM EV/Revenue；最接近的上市发卡可比公司；受客户集中和增速放缓拖累，倍数已被压缩。
    approximationNotes: >-
      Rain 的隐含 EV/Revenue 倍数是基于 $3B 年化 TPV 和假设 take rate（1%、3%、5%）得出的分析估计；Rain
      实际收入未披露。柱状值为便于阅读已四舍五入。上市可比公司倍数（Adyen、Marqeta）来自 SaaS Valuation Multiple Q1 2026 分析。支付公司中位数来自 Finro 2026 年 Q1
      数据集。比较只作方向性和示意性用途——Rain 增速远高于 Adyen 和 Marqeta，如果收入得到验证，可支撑溢价倍数。
    claimRefs:
      - CV018
      - CV019
      - CV032
      - CV033
      - CV034
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 牛市、基准和熊市情景下的 Rain 退出估值区间，包含关键假设以及相对 $1.95B Series C 入场价的隐含倍数。
    data:
      items:
        - label: 牛市退出估值
          low: 3000
          mid: 6000
          high: 12000
          unit: USD millions
          detail: TPV 增至 $30B（10x）；5% take rate（约 $1.5B 收入）；8x 远期收入倍数；相对 Series C 入场价回报 2–6x。需要非凡执行，并在 2030 年前完成 M&A 或 IPO。
        - label: 基准退出估值
          low: 600
          mid: 1400
          high: 2000
          unit: USD millions
          detail: TPV $10B；3–4% take rate（约 $300–400M 收入）；按 4–5x M&A；相对 Series C 入场价回报 0.3–1x。中点接近持平到小幅亏损；高端略有收益。
        - label: 熊市退出估值
          low: 200
          mid: 700
          high: 1200
          unit: USD millions
          detail: TPV 卡在 $3–5B；监管拖延；Mastercard/BVNK 竞争；退出前出现 down-round；相对 Series C 入场价回报 0.1–0.6x。存在 Klarna 式重估风险。
    approximationNotes: >-
      退出估值是将上市可比公司倍数（Adyen、Marqeta、Bridge M&A、BVNK M&A）套用到估算收入区间后构建的分析情景。收入由 take rate 情景估算；Rain
      实际收入未披露。美元金额以百万计。按当前证据，概率加权预期值位于基准和熊市中点之间。牛市情景需要执行成功、监管放行且没有重大竞争替代同时发生——概率低但并非为零。
    claimRefs:
      - CV039
      - CV040
      - CV047
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的 Rain 投资论证评分，覆盖市场、验证、护城河、经济性、风险、估值和证据质量维度。
    data:
      items:
        - label: 市场信号
          value: High
          detail: 稳定币卡支付同比增长 106% 至年化 $18B；TAM 拐点真实存在且在加速
        - label: 产品 / 技术验证
          value: Medium-High
          detail: 同时拥有 Visa/MC 主会员资格，200+ 个合作伙伴；在 150+ 个国家运营；Western Union 和 Nuvei 集成确认平台成熟度
        - label: 竞争护城河
          value: Medium
          detail: 主会员资格构成进入壁垒，但 Mastercard/BVNK 和 Visa 内部能力是直接的网络化威胁；护城河耐久性仍不确定
        - label: 财务证据
          value: Low
          detail: 收入、毛利率、盈利时间表未披露；隐含 13–65x EV/Revenue 区间；无法正式承销该价格
        - label: 风险画像
          value: Medium-High risk
          detail: 横跨 5 大洲推进监管牌照；BVNK 竞争替代；合作伙伴集中；财务不透明；均为重大风险
        - label: 估值
          value: Stretched
          detail: $1.95B 达到或高于 M&A 先例（Bridge $1.1B、BVNK 最高 $1.8B）；5% take rate 下可辩护，但要求卓越执行
        - label: 证据质量
          value: Medium
          detail: 公开活动指标强，一级投资人背书强；财务披露弱；没有独立收入验证；仅有公司自述指标
        - label: 整体信号
          value: research-more
          detail: 增长故事有吸引力，市场也真实存在；但财务不透明意味着，以 $1.95B 入场必须接受无法量化的倍数风险
    approximationNotes: >-
      KPI 分数是基于 Rain 尽调报告全部八章证据权重作出的定性评估。分数不是既定量表上的量化评级。「高 / 中 /
      低」标签反映公开证据强度，而非业务质量本身。如果市场机会已确认但财务未披露，一家公司可以同时拥有「高」市场信号和「低」财务证据。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
      - CV031
      - CV036
