  - id: TV005
    title: 证伪论点与终止触发因素表
    columns:
      - 触发事件
      - 可观察阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Mastercard/BVNK 全面部署到 Rain 企业账户
        - 公开宣布 BVNK 技术作为 Mastercard 原生稳定币卡平台提供给企业合作伙伴；确认 Rain 合作伙伴迁移至 BVNK/MC 平台
        - 竞争护城河支柱失效；20%+ 合作伙伴流失会把 TPV 增速压到基准情景以下，并表明 Rain 守不住平台优势
        - 立即尽调合作伙伴留存数据；把估值重估至熊市情景
      - - Rain 在美国或欧盟监管牌照被拒
        - 美国或主要欧盟司法辖区的监管机构正式驳回 Rain 的 PPSI（GENIUS Act）或 MiCA 授权申请
        - 堵住主要收入增长市场；显著拉长资本投放周期；迫使公司用 down-round 为替代策略融资
        - 复核 Rain 的监管策略和替代司法辖区时间表；估值压缩概率高
      - - Rain 下一轮融资 down-round
        - Series D 或过桥融资估值低于 $1.95B
        - 直接表明投资人对 Rain 轨迹的共识已经恶化；除非伴随有战略溢价的收购方，否则 Series C 回报被摧毁
        - 退出或对冲；监测内部人主导过桥融资这一早期信号
      - - 任意规模下收入披露低于 $50M ARR
        - Rain 主动披露或通过投资人披露显示，在 $3B+ TPV 下收入低于 $50M 年化
        - 证实 take rate 低于 1.7%；意味着 39x+ EV/Revenue 倍数，除早期一次性案例外，与任何可比支付基础设施公司都不匹配
        - 重估至熊市情景；维持头寸前要求披露盈利路径
      - - 前三大新兴市场之一限制稳定币监管
        - 印度、巴西或尼日利亚（稳定币用户最多的新兴市场）禁止或严厉限制稳定币卡支付；IMF 推动的政策压力落地
        - Rain 声称的 EM-first 增长策略依赖稳定币需求最高的高增长市场；一个主要新兴市场受限，就会实质缩小 TAM
        - 每季度监测印度、巴西、尼日利亚监管提案；IMF 工作人员关于稳定币政策的指导是领先指标
    notes: >-
      触发因素来自第 6 章（客户）、第 7 章（风险）和第 8 章（估值）识别出的结构性最高风险。可观察阈值设计为可通过新闻稿、监管数据库或申报披露公开监测。传导逻辑沿用估值情景框架：熊市情景条件对应触发因素 1–3；触发因素 4
      给出直接财务证据；触发因素 5 影响 TAM 假设。终止标准意味着，只要多个触发因素同时出现，无论入场价格如何，投资论点都需要彻底重置。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV044
      - CV049
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和毛利率
        - Rain 的收入 run rate、按产品线划分的毛利率（发卡、付款、钱包），以及各交易层级 take rate
        - 没有这些就无法计算 EV/Revenue 倍数或搭建财务模型；隐含倍数会随 take rate 假设在 13x 到 65x 之间变化
        - Rain CFO / 投资人 data room；要求提供 3 年历史 P&L，并按产品线拆分
      - - 合作伙伴集中度和流失
        - Top-10 合作伙伴 TPV 占比、年度合作伙伴收入，以及任何合作伙伴 NPS 或流失数据
        - 合作伙伴集中度是 Rain 收入模型里最大的隐藏风险；3–5 个合作伙伴退出就可能击穿投资论点
        - Rain 投资者关系；data room NDA；与合作伙伴公开披露交叉核对（Nuvei、Western Union、KAST）
      - - Burn rate 和 runway
        - 月度经营现金消耗，以及按当前投放速度测算的预计 runway
        - 累计融资 $338M；牌照推进、基础设施建设和企业销售会吃掉大量资本；runway 可见度直接影响轮次定价
        - Rain CFO / 董事会级披露；6 个月 burn 历史，以及按 use-of-proceeds 类别拆分的资本分配计划
      - - 各司法辖区牌照状态
        - 美国、欧盟、英国、新加坡、阿联酋、巴西和尼日利亚的监管申请状态；首张牌照取得时间表
        - 牌照是 Rain 声称的 Series C 资本首要用途，也是释放受监管市场全部收入潜力的闸门
        - Rain General Counsel / Regulatory Affairs；与 OCC、FinCEN 和 FCA 公开牌照数据库交叉核对
      - - 按合作伙伴层级划分的单位经济
        - Rain 当前规模下的每合作伙伴收入、每项目毛利率，以及每笔交易基础设施成本
        - 单位经济决定 Rain 的模式能否在 TPV 增长时盈利扩张，还是成本同步放大；承销任何退出倍数都离不开它
        - Data room；要求按项目规模和地理区域拆分合作伙伴 cohort economics
      - - 股权结构和优先权结构
        - Series C 清算优先权、参与权、反稀释条款，以及完全摊薄股数
        - $1.95B post-money 下，优先权堆积决定退出时普通股的真实价值；若以 $1.95B 或更低价格退出，创始人和早期员工普通股价值可能归零
        - Rain General Counsel / Series C term sheet；NDA 后按标准流程分析 cap table
    notes: >-
      尽调请求按对投资决策的重要性排序。没有收入和毛利率，就没有可辩护的估值模型，这两项是阻断项。没有合作伙伴集中度和 burn rate，就无法形成风险调整后的回报情景，也是阻断项。牌照状态和单位经济很重要，但可在签署 term
      sheet 后通过确认性尽调取得。Cap table 分析属于标准流程，并假设走正常 NDA。所有请求都是 Series C 投资人在这个价格承诺前应当拿到的信息。
    claimRefs:
      - CV031
      - CV046
      - CV049
      - CV050
