        title: 客户验证缺口与未解问题
        blocks:
          - type: paragraph
            body: >-
              Rain 最重要的客户验证缺口包括：（1）未披露合作伙伴数量——Rain 的网站、投资者材料和新闻稿从未说明有多少活跃卡项目伙伴或 API
              客户。具名案例（六到八个）几乎肯定低估了实际数量，但尽调不知道分母，就无法评估集中度。（2）未披露留存指标——NRR、GRR 和客户流失是 B2B SaaS 或支付基础设施业务的标准指标；Rain
              一个也没有披露。（3）增长数字的独立性——30 倍卡增长和 38 倍交易量增长由公司披露，并出现在融资文件中；没有独立测量来源（交换费数据、链上分析或卡网络报告）予以佐证。（4）企业深度——Nuvei 和
              Western Union 是已宣布的合作，不是附带结果指标的文档化部署；实际通过这些合作流转的交易量未知。（5）开发者生态——Rain 的 API 文档被登录墙挡在 docs.rain.xyz 后面，公开
              GitHub 组织（github.com/userain）活动很少。社区侧信号（HackerNews、论坛）也很弱。这限制了外部对集成质量和开发者体验的评估。投资者需要重点索取：按年度交易量列出的前 10
