        - label: Competitive moat
          value: Medium
          detail: "Principal memberships create entry barriers but Mastercard/BVNK and Visa internal capabilities are direct networked threats; moat durability is uncertain"
        - label: Financial evidence
          value: Low
          detail: "Revenue, gross margin, profitability timeline undisclosed; implied 13–65x EV/Revenue range; cannot formally underwrite the price"
        - label: Risk profile
          value: Medium-High risk
          detail: "Regulatory licensing campaign across 5 continents; BVNK competitive displacement; partner concentration; financial opacity; all material"
        - label: Valuation
          value: Stretched
          detail: "$1.95B is at or above M&A precedents (Bridge $1.1B, BVNK up to $1.8B); defensible at 5% take rate but demands exceptional execution"
        - label: Evidence quality
          value: Medium
