  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger Event
      - Observable Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Mastercard/BVNK full deployment to Rain enterprise accounts
        - Public announcement that BVNK technology is offered as a Mastercard-native stablecoin card platform to enterprise partners; confirmed Rain partner migration to BVNK/MC platform
        - Invalidates the competitive moat pillar; 20%+ partner churn would compress TPV growth below base-case trajectory and signal Rain cannot defend its platform advantage
        - Immediate diligence on partner retention data; reassess valuation to bear scenario
      - - US or EU regulatory license denial for Rain
        - Official regulatory rejection of Rain's PPSI (GENIUS Act) or MiCA authorization application in the US or a primary EU jurisdiction
        - Blocks the primary revenue growth markets; significantly lengthens the capital deployment runway; forces a down-round to fund alternative strategies
        - Review Rain's regulatory strategy and alternative jurisdiction timeline; high probability of valuation compression
      - - Rain down-round in next financing
        - Series D or bridge financing at a valuation below $1.95B
        - Direct signal that investor consensus on Rain's trajectory has deteriorated; destroys Series C returns unless accompanied by a strategic premium acquirer
        - Exit or hedge; monitor for insider-led bridge financing as early signal
      - - Revenue disclosure below $50M ARR at any scale
        - Rain voluntarily or via investor disclosure reveals revenue below $50M annualized at $3B+ TPV
        - Confirms take rate below 1.7%; implies 39x+ EV/Revenue multiple, inconsistent with any comparable payments infrastructure company except early-stage one-off cases
        - Reassess to bear case; require profitability path disclosure before maintaining position
      - - Stablecoin regulatory restriction in a top-3 EM market
        - India, Brazil, or Nigeria (top emerging market stablecoin users) enact prohibitions or severe restrictions on stablecoin card payments; IMF-driven policy pressure materializes
        - Rain's stated EM-first growth strategy relies on high-growth markets where stablecoin demand is highest; restriction in even one major EM materially reduces the TAM
        - Monitor regulatory proposals in India, Brazil, Nigeria quarterly; IMF staff guidance on stablecoin policy is a leading indicator
    notes: >-
      Triggers are derived from the most structurally significant risks identified across chapters 6 (customers), 7 (risks), and 8 (valuation). Observable thresholds are designed to be publicly monitorable from press releases, regulatory databases, or filing disclosures. Transmission logic follows the valuation scenario framework: bear-scenario conditions map to triggers 1–3; trigger 4 provides direct financial evidence; trigger 5 affects TAM assumptions. Kill criteria imply that multiple simultaneous triggers would require a complete thesis reset regardless of entry price.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV044
      - CV049

  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and gross margin
        - Rain's revenue run rate, gross margin by product line (card issuing, payouts, wallets), and take rate per transaction tier
        - Cannot calculate EV/Revenue multiple or build a financial model without this; implied multiple ranges from 13x to 65x depending on take rate assumption
        - Rain CFO / investor data room; request 3-year historical P&L with product line breakout
      - - Partner concentration and attrition
        - Top-10 partner share of TPV, annual partner revenue, and any partner NPS or churn data
        - Partner concentration is the single largest hidden risk in Rain's revenue model; 3–5 partner exits could be thesis-breaking
        - Rain investor relations; data room NDA; cross-check with partner public disclosures (Nuvei, Western Union, KAST)
      - - Burn rate and runway
        - Monthly operating cash burn and projected runway at current deployment rate
        - $338M total raised; licensing campaign, infrastructure build, and enterprise sales will consume significant capital; runway visibility is critical for round-pricing
        - Rain CFO / board-level disclosure; 6-month burn history and capital allocation plan by use-of-proceeds category
      - - License status by jurisdiction
        - Regulatory application status in each of US, EU, UK, Singapore, UAE, Brazil, and Nigeria; timeline for first-license receipt
        - Licensing is Rain's stated primary use of Series C capital and the gating item for unlocking full revenue potential in regulated markets
        - Rain General Counsel / Regulatory Affairs; cross-check with OCC, FinCEN, and FCA public licensing databases
      - - Unit economics by partner tier
        - Revenue per partner, gross margin per program, and infrastructure cost per transaction at Rain's current scale
        - Unit economics determine whether Rain's model scales profitably as TPV grows or whether costs grow proportionally; critical for underwriting any exit multiple
        - Data room; request partner cohort economics segmented by program size and geography
      - - Cap table and preference structure
        - Series C liquidation preferences, participation rights, anti-dilution provisions, and fully diluted share count
        - At $1.95B post-money, preference overhang determines actual common equity value at exit; exit at or below $1.95B could produce zero common equity value for founders and early employees
        - Rain General Counsel / Series C term sheet; standard cap table analysis post-NDA
    notes: >-
      Diligence asks are prioritized by criticality to the investment decision. Revenue and gross margin are blocking without a defensible valuation model. Partner concentration and burn rate are blocking without a risk-adjusted return scenario. License status and unit economics are material but could be obtained post-term sheet subject to confirmatory diligence. Cap table analysis is standard and assumes a normal NDA process. All asks represent information that a Series C investor should expect to receive before committing at this price.
    claimRefs:
      - CV031
      - CV046
      - CV049
      - CV050

