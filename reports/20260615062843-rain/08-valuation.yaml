company:
  name: Rain
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rain's $1.95 billion post-money Series C valuation (January 2026) prices in extraordinary growth metrics—30x card user base expansion and 38x payment volume growth year-over-year—and a first-mover position in stablecoin card issuing infrastructure with dual Visa and Mastercard principal memberships. The valuation cannot be formally anchored to a revenue multiple because Rain does not disclose revenue, gross margin, or a profitability timeline. Scenario analysis using $3B annualized card transaction volume and estimated take rates of 1–5% implies a 13x–65x EV/Revenue range—a wide band that straddles plausible infrastructure multiples but includes scenarios where the current valuation is very demanding. The nearest public comp, Marqeta (card issuing platform), trades at approximately 1.5x LTM EV/Revenue on $625M revenue with a $1.62B market cap; premium infra platform Adyen trades at 8.1x. The clearest M&A anchors—Stripe's $1.1B Bridge acquisition and Mastercard's up-to-$1.8B BVNK acquisition—establish that strategic buyers pay $1–2B for stablecoin infrastructure assets, placing Rain at or slightly above M&A precedent. The recommendation is research-more with medium-high risk: Rain's growth story is compelling and the market is real, but the evidence base needed to underwrite the current price—revenue, unit economics, partner concentration, and burn rate—remains undisclosed. Primary thesis-break triggers are Mastercard/BVNK deployment displacing Rain in enterprise accounts, a regulatory license denial in a core market, and multiple compression driven by insufficient demonstrated revenue velocity.

sections:
  - id: financing-history-valuation-context
    title: Financing History and Valuation Context
    body: >-
      Rain has executed three disclosed funding rounds in approximately four years, each materially re-rating the business: a $24.5M Series A led by Norwest Venture Partners, a $58M Series B led by Sapphire Ventures, and a $250M Series C led by ICONIQ Growth with participation from Andreessen Horowitz Crypto, Founders Fund, Tiger Global Management, and others, closed January 2026. The Series C brings total disclosed capital to over $332.5M and values the company at approximately $1.95 billion post-money—confirmed by multiple independent sources including The Block and Forbes, which both reported the figure in January 2026 alongside Rain's own press release. The round was framed as infrastructure capital: Rain stated plans to deploy proceeds toward operational licensing in North America, South America, Europe, Asia, and Africa; enterprise sales expansion; and product depth in agentic commerce. This is relevant to valuation because heavy capital deployment into licensing and global buildout means Rain is pre-profitability with uncertain timelines—the valuation is therefore a growth-equity bet on future revenue scale, not a reflection of current financial productivity. The platform's stated operating metrics at Series C close were 30x year-over-year growth in card user base, 38x growth in payment volume, $3B or more in annualized card transaction volume, and 200+ enterprise partners across 150+ countries. None of these metrics have been independently verified by third-party analytics providers; Artemis research data from January 2026 corroborated that the broader crypto card payments market reached $18B annualized volume with 106% annual growth, which is consistent with Rain's claimed trajectory if it holds a meaningful market share.
