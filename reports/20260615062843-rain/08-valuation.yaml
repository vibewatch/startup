  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-and-gross-margin
      missingEvidence: >-
        Rain's revenue run rate, gross margin by product line (card issuing, payouts, wallets), and disclosed take rate per transaction tier. No public source confirms any revenue figure.
      whyItMatters: >-
        Without revenue disclosure, it is impossible to calculate an EV/Revenue multiple or build a financial model. The implied multiple ranges from 13x to 65x depending solely on assumed take rate, creating unacceptable uncertainty for an institutional investment decision at the $1.95B Series C price.
      diligencePath: >-
        Request from Rain CFO via NDA-governed data room: 3-year historical P&L by product line, take rate schedule by partner tier, and unit economics per active program.
      relatedQuestionRefs:
        - QV024
      relatedTableRefs:
        - TV006
