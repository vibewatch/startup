  - id: comparable-company-analysis
    title: Comparable Company Analysis
    body: >-
      Rain sits at an unusual intersection of card issuing infrastructure (closest public comp: Marqeta), high-growth payments platform (Adyen as premium anchor), and stablecoin-native M&A targets (Bridge, BVNK). The public comparables collectively tell a story of severe multiple dispersion: Adyen at 8.1x LTM EV/Revenue represents the premium end for global payments infrastructure with multi-rail network effects; Marqeta at approximately 1.5x represents the compressed end for card-issuing platforms with demonstrated revenue but slower growth and a customer concentration legacy; Flywire at 2.1x and PayPal at 1.36x populate the middle and lower ranges for vertically specialized and mature payments businesses. Finro's Q1 2026 dataset covering 416 fintech companies found that payments averages 7.7x EV/Revenue but the median is only 3.6x—a gap created by a small number of premium platform operators (Adyen, Stripe) lifting the average well above where most payments companies actually trade. Fintech overall averaged 14.5x but with a 7.6x median, illustrating the same premium-outlier distortion. For private and M&A comps, the most directly relevant transactions are Stripe's acquisition of Bridge at $1.1B (February 2025, closed; Bridge had $10B+ in annualized stablecoin transaction volume at the time) and Mastercard's announced acquisition of BVNK at up to $1.8B (March 2026; BVNK is Rain's closest direct competitor in stablecoin card infrastructure). Stripe itself was valued at $159B in a February 2026 secondary tender offer, implying high single-digit revenue multiples on estimated $1.9T total payment volume. Rain's $1.95B valuation places it modestly above the BVNK M&A precedent and well below the Stripe premium—suggesting the market is pricing Rain as a credible but not yet dominant stablecoin infrastructure player.
