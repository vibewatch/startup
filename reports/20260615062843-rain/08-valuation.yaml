  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Key Assumptions
      - Implied Revenue / Valuation Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull (3–5 year horizon)
        - "TPV scales to $30B (10x); take rate 5% (software/API platform economics); regulatory licenses secured in US, EU, APAC; no major partner churn; Mastercard/BVNK integration delayed or limited to separate enterprise tier"
        - "Revenue ~$1.5B at 5% take rate; 8x forward revenue (Adyen-tier) implies $12B exit valuation; ~6x on $1.95B entry; OR M&A at 6–8x revenue implies $9–12B"
        - "Mastercard/BVNK deploys aggressively, Visa direct stablecoin expansion reduces Rain's network advantage; regulatory delay beyond 2028 caps expansion"
        - Low-medium; requires extraordinary execution and favorable regulatory environment simultaneously
      - - Base (3–5 year horizon)
        - "TPV grows to $10B; take rate 3–4%; US and one major non-US license secured by 2028; partner attrition modest; Mastercard/BVNK competition limits enterprise share gains"
        - "Revenue ~$300–400M at 3–4% take rate; M&A exit at 4–5x revenue implies $1.2–2B exit; near par on $1.95B entry; IPO at 3–4x implies $900M–$1.6B, a modest loss"
        - Burn rate consumes $200M+ before profitability; competitive displacement accelerates; net revenue multiple below 3x compresses exit proceeds
        - Medium; most consistent with current evidence and comparable outcomes for infrastructure fintechs in competitive markets
      - - Bear (2–4 year horizon)
        - "TPV plateaus at $3–5B; Mastercard/BVNK displaces 30%+ of Rain's enterprise pipeline; US/EU license denied or delayed to 2029; take rate under 2% due to competitive pricing pressure"
        - "Revenue ~$60–100M at 2% take rate; down-round required to extend runway; next round price below $1.95B; Klarna-style re-rating from ~2x peak to 0.7x"
        - Further regulatory enforcement on stablecoin infrastructure; key partner departures accelerate; burn rate exceeds $100M/year with no profitability path
        - Low-medium; meaningful probability given regulatory and competitive trajectory but requires multiple adverse events simultaneously
    notes: >-
      Scenario assumptions use $3B annualized TPV as the current baseline from Rain's public disclosures. Take rates are estimated from industry norms for card issuing and payment infrastructure platforms; Rain's actual take rates are not disclosed. Revenue figures are analytical estimates, not Rain-provided numbers. Probability signals are qualitative assessments based on industry comparables and the weight of public evidence. The Bear scenario references Klarna's re-rating as an illustrative fintech multiple compression precedent, not as a direct business model comparison.
