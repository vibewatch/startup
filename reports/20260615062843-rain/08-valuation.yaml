  - id: TV001
    title: Recommendation Summary Table
    columns:
      - Dimension
      - Assessment
      - Rationale
    rows:
      - - Recommendation
        - research-more
        - Rain's growth is extraordinary but revenue, margin, and profitability timeline are undisclosed; cannot formally underwrite the $1.95B Series C price without financial diligence
      - - Confidence
        - Medium
        - High conviction on market opportunity and network positioning; low conviction on financial model due to absence of disclosed P&L metrics
      - - Risk Rating
        - Medium-High
        - Regulatory licensing uncertainty, Mastercard/BVNK competitive displacement risk, and financial opacity combine to produce an elevated risk profile
      - - Valuation Stance
        - Stretched on evidence; justified if growth holds
        - $1.95B is priced above BVNK M&A precedent ($1.8B) without revenue disclosure; defensible only if take rate is 3–5% and growth trajectory is sustained
      - - Decision Implication
        - "Conditional: obtain revenue, unit economics, and partner concentration data before committing capital at Series C price"
        - Entry at current valuation without diligence data implies accepting >22x unverified revenue multiple at best-case take-rate scenario
    notes: >-
      Recommendation uses the standard five-level framework (strong-buy, buy, track, research-more, avoid). Risk rating reflects both financial evidence gaps and competitive/regulatory threat severity. Valuation stance is based on scenario analysis using disclosed TPV and estimated take-rate ranges; no actual revenue was available to confirm the multiple. 'research-more' does not imply a negative view on Rain's business; it reflects the evidentiary constraint of investing at a $1.95B pre-revenue-disclosure price.
