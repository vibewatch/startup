  - id: scenario-analysis
    title: Scenario Analysis — Bull, Base, and Bear Cases
    body: >-
      Because Rain does not disclose revenue, the scenario framework uses $3B annualized card TPV as the activity anchor and assumes take rates derived from payment infrastructure industry norms to estimate implied revenue. Card issuers and payment infrastructure platforms typically earn 0.5–5% of processed volume as net revenue depending on interchange participation, fee structures, and service tiers. A 1% take rate implies approximately $30M in annual revenue—producing a ~65x EV/Revenue implied multiple at $1.95B, which is extreme even for high-growth payments infra and only defensible if Rain is in the very early monetization phase with a massive growth ramp ahead. A 3% take rate implies approximately $90M, producing a ~22x multiple—consistent with premium early-stage infra companies with demonstrated network effects. A 5% take rate implies approximately $150M, producing a ~13x multiple—comparable to Adyen territory and potentially warranted if Rain's API/platform economics deliver recurring, margin-rich revenue rather than pure transaction take-rate. Bull case: Rain demonstrates 10x TPV growth (to $30B annualized) within 3 years, reaches 5%+ take-rate software economics, and achieves an Adyen-comparable ~8x forward revenue multiple—valuing the company at $3–6B, a 2–3x return on Series C. Base case: Rain grows TPV to $10B, demonstrates revenue in the $150–300M range at 3–5% take rate, and exits via M&A at 4–6x revenue, producing a $600M–$1.8B exit valuation—at par or modest loss on the $1.95B Series C entry. Bear case: Mastercard/BVNK competition and regulatory delays compress Rain's enterprise pipeline, TPV growth slows to $4–5B, revenue remains unclear, and the next financing round carries a significant down-round risk—with Klarna's re-rating from $45.6B (2021) to $15B (2025 IPO) as the cautionary precedent for fintech multiple compression.
