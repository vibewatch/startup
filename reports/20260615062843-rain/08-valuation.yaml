  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Argument
      - What Would Change the View
    rows:
      - - Market
        - Stablecoin card payments grew 106% annually to $18B (Artemis, Jan 2026); approaching peer-to-peer stablecoin volume; Rain is positioned to capture enterprise share
        - Market is still nascent; most volume is concentrated in a few corridors and driven by promotional adoption that may not be sticky
        - Independent volume data from Artemis, Visa, or Mastercard confirming $10B+ annualized Rain TPV with multi-quarter retention
      - - Competitive Moat
        - Dual Visa/Mastercard principal membership creates a multi-year replication barrier; 200+ enterprise partners have built programs on Rain's infrastructure, creating switching costs
        - Mastercard/BVNK and Visa's internal stablecoin infrastructure are network-backed alternatives that can be offered at preferential commercial terms to enterprise customers
        - Evidence of partner churn rate below 10% annually and confirmation that card networks have not offered Rain partners a direct switch incentive
      - - Financial Model
        - 30x card base and 38x payment volume growth (company-stated) imply rapid TAM capture; infrastructure economics can reach high gross margins at scale
        - Revenue, gross margin, and profitability timeline are undisclosed; implied take rate uncertainty spans 1–5%, producing a 13x–65x valuation multiple range
        - Disclosure of revenue exceeding $100M with gross margins above 50% would materially de-risk the valuation
      - - Regulatory
        - $338M+ capital base provides multi-year runway for global licensing; GENIUS Act and MiCA create frameworks that reward compliant infrastructure providers
        - Multi-jurisdiction licensing is a 3–5 year, $50M+ campaign with uncertain timelines; license denial in the US or EU would block Rain's primary growth markets
        - First US or EU license issued, with a public disclosure of Rain's regulatory application pipeline by jurisdiction
      - - Exit / Return
        - M&A from Visa, Mastercard, Stripe, or PayPal at 4–10x revenue at scale offers 2–4x return; IPO path opens as stablecoin infra multiples mature
        - Klarna's re-rating from $45.6B to $15B at IPO illustrates how quickly fintech multiples compress; Rain at $1.95B without revenue disclosure faces the same risk
        - Revenue verification and a demonstrated path to EBITDA break-even would support a premium exit above Series C entry
      - - Evidence Quality
        - Series C funded by tier-1 investors (ICONIQ, a16z Crypto, Founders Fund) signals institutional confidence in Rain's trajectory
        - Tier-1 investors have historically backed over-valued fintech companies; round size and investor prestige do not substitute for financial disclosure
        - Access to data room with audited financials, revenue cohort data, and partner-level economics
    notes: >-
      Thesis and anti-thesis pillars are based on public evidence as of June 2026. Arguments are rated on the weight of public evidence available; they do not reflect any non-public information. 'What would change the view' is a single specific, verifiable data point that would materially shift the valuation assessment in each case.
