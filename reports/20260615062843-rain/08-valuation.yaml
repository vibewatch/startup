  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Type
      - Revenue / Volume
      - EV or Valuation
      - EV/Revenue Multiple
      - Relevance to Rain
      - Key Limitation
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Selected from public comps, M&A transactions, and private rounds in card issuing and stablecoin payments infrastructure; cross-referenced against Finro Q1 2026 dataset, SaaS Valuation Multiple Q1 2026 analysis, and SEC filings; covers the material comp set for a stablecoin card issuing infrastructure company at Series C stage
    rows:
      - - Marqeta (MQ)
        - Public — card issuing platform
        - "$625M net revenue FY2025 (+23%); $383B TPV (+31%)"
        - "~$1.62B market cap (June 2026)"
        - "~1.5x LTM EV/Revenue"
        - Closest public comp; card-issuing-as-a-service for fintechs and enterprises; global principal member
        - Higher revenue base; profitable trajectory; single-network legacy; no stablecoin focus; more customer-concentrated (Block, Uber dominate)
      - - Adyen
        - Public — global payments platform
        - "~$3B net revenue; multi-rail (acquiring + issuing)"
        - "~$36B market cap (Q1 2026)"
        - "~8.1x LTM EV/Revenue"
        - Premium benchmark for global payments infrastructure with multi-rail, enterprise-grade, multi-currency platform
        - Larger scale; acquiring-led not issuing-led; no stablecoin; European anchor; requires 5x+ Rain revenue to be comparable
      - - Flywire
        - Public — B2B payments corridors
        - "FY26 guide +15–21% FX-neutral; EBITDA margin ~22.5%; est. ~$430M net revenue"
        - "~$900M market cap (Q1 2026)"
        - "~2.1x LTM EV/Revenue"
        - B2B payments vertical specialization; recurring revenue profile; moderate growth rate
        - Education/health verticals, not crypto; lower growth; ~2x multiple reflects early maturity, not early stage
      - - Bridge (Stripe acquisition)
        - M&A — stablecoin orchestration
        - "$10B+ annualized stablecoin transaction volume at acquisition"
        - "$1.1B acquisition by Stripe (Feb 2025)"
        - "~0.11x EV/TPV (no revenue disclosed)"
        - Closest M&A comp; stablecoin API infrastructure acquired by Stripe at $1.1B; establishes floor for stablecoin infra M&A
        - No revenue disclosed; orchestration-focused vs. card-issuing-focused; Stripe strategic premium inflated price vs. standalone
      - - BVNK (Mastercard acquisition)
        - M&A — stablecoin card infrastructure
        - "Not disclosed; Visa Direct pilot partner Jan 2026"
        - "Up to $1.8B (announced March 2026)"
        - "Not calculable (revenue undisclosed)"
        - Rain's most direct competitor; similar stablecoin card infra + enterprise focus; Mastercard paying up to $1.8B
        - Pending deal close; exact price uncertain (earnout structure); Mastercard strategic premium may inflate vs. standalone value
      - - Klarna (IPO)
        - Public — BNPL / consumer payments
        - "Revenue not disclosed at IPO level; GMV-based"
        - "$15B at IPO (Sep 2025); down from $45.6B 2021 peak"
        - "Not comparable; illustrative only"
        - Illustrates fintech multiple compression risk; $45.6B to $15B re-rating over 4 years despite continued growth
        - Consumer BNPL not payments infra; different model entirely; cited as multiple-compression precedent, not business comp
    notes: >-
      Multiples sourced from Finro Q1 2026 fintech dataset (416 companies), SaaS Valuation Multiple Q1 2026 analysis, and SEC filings for Marqeta (FY2025) and Visa (FY2025). Rain's EV/Revenue cannot be calculated due to non-disclosure of revenue; all Rain-specific implied multiples in this chapter are analytical scenarios based on take-rate assumptions. M&A prices are as announced; earnout components may not be fully realized. Stripe and BVNK comparable prices are for strategic M&A, which typically carries a premium above standalone fair value.
