- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Rain’s dual-network card position is rare
    - Stripe, Mastercard, Visa, and PayPal can bundle stablecoins into larger networks
    - High
    - Test whether Rain still wins when a customer already runs on Stripe or a card incumbent
  - - Single-integration stack reduces vendor count
    - Buyers can multi-home using issuer, custody, and orchestration vendors separately
    - High
    - Ask which modules actually remain deployed together after initial launch
  - - Stablecoin-native economics improve capital efficiency
    - Incumbents can replicate economics as settlement modernizes
    - Medium
    - Validate whether Rain’s reserve and settlement model stays structurally better
  - - Compliance-ready infrastructure is hard to build
    - Circle, Ripple, Zero Hash, Fireblocks, and BVNK all market strong regulatory posture
    - High
    - Benchmark licenses, sponsor banks, and go-live geography against each rival
  - - Fast launch and developer friendliness are differentiators
    - Security-first institutions may still prefer Fireblocks or BitGo despite slower rollout
    - Medium
    - Segment win rates by institution type rather than averaging all prospects
  - - Category fragmentation helps specialists coexist
    - Consolidation by Stripe, Mastercard, or PayPal could compress margins and distribution access
    - High
    - Track whether large incumbents continue to acquire or bundle stablecoin vendors
  notes: Severity scores are analytical judgments based on competitor positioning, bundling power, and regulatory posture rather than one single source.
