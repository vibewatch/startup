- id: switching-costs-and-multi-homing
  title: Switching cost, lock-in, and multi-homing dynamics
  body: 'Switching costs in this market are real, but they are not absolute. Buyers integrate with regulated providers, reconcile stablecoin and fiat flows, map treasury approvals, build wallet or card UX, and embed reporting—all of which makes any production migration painful. Fireblocks and BitGo deepen switching costs through custody and policy controls; Circle and Ripple deepen them through token liquidity and institutional partnerships; Stripe and PayPal deepen them through distribution and existing payment workflows. At the same time, the stack is still modular enough for multi-homing. A company can use Circle or Ripple for issuance liquidity, Fireblocks or BitGo for custody, and Rain or Bridge for card or payout orchestration. Stablecoin Insider’s 2026 competitive guide reinforces this by describing different vendors as best for different buyer segments rather than pointing to a single dominant platform. For Rain, the implication is mixed: it does not need to beat every rival on every
    layer to win, but it also cannot assume one successful product wedge will keep competitors out. Moat durability will depend on whether its card-network, wallet, and payout combination becomes hard to replace operationally, not just desirable in demos.'
