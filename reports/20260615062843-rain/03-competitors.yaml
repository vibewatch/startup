callouts:
- calloutType: strength
  title: Rain is one of the few competitors that clearly combines cards, wallets, and payouts in one stablecoin-native stack
  body: Bridge and BVNK compete most directly on orchestration, but Rain’s card-network memberships plus embedded account tooling give it a differentiated product shape. The company is closer to a modern issuer stack than to a pure routing API.
  claimRefs:
  - CP001
  - CP002
  - CP023
  - CP037
- calloutType: risk
  title: Bundling by larger incumbents is the most credible moat-eroding threat
  body: Stripe can distribute Bridge to existing merchants, Mastercard is buying BVNK, Circle controls the dominant regulated stablecoin rail, and PayPal can inject PYUSD into existing consumer and merchant surfaces. Rain therefore faces more strategic bundling risk than product-comparison risk alone.
  claimRefs:
  - CP003
  - CP014
  - CP018
  - CP020
  - CP032
  - CP033
- calloutType: insight
  title: The market is modular enough that Rain does not need to beat every rival at every layer
  body: Customers can choose orchestration from Rain or Bridge, custody from Fireblocks or BitGo, and issuer liquidity from Circle or Ripple. This supports a multi-homing view of competition and makes operational fit more important than headline scale alone.
  claimRefs:
  - CP025
  - CP026
  - CP027
  - CP030
  - CP031
  - CP040
