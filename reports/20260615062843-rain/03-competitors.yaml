tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Rain
    - Full-stack card / wallet / payout infrastructure
    - Series C at $1.95B; >$3B annualized volume; 200+ partners
    - Enterprises, neobanks, platforms
    - Dual-network card issuing plus wallets and payouts in one stack
    - Smaller installed distribution than Stripe, PayPal, Mastercard, or Circle
  - - Bridge / Stripe
    - API-first stablecoin orchestration
    - Stripe acquired Bridge for $1.1B; Stripe merchant and payout scale
    - Fintechs, PSPs, marketplaces, Stripe merchants
    - Developer-first APIs plus Stripe distribution
    - Independent Bridge positioning may be subsumed by Stripe bundling
  - - Circle
    - Issuer-led stablecoin rail
    - USDC at $74.8B circulation; 1000+ partners; 34 chains
    - Institutions, exchanges, PSPs, builders
    - Reserve transparency and native USDC liquidity
    - Not a full branded card-issuing stack by default
  - - Fireblocks
    - Custody-first settlement infrastructure
    - '>$14T secured transactions; thousands of organizations; 150+ blockchains'
    - Banks, PSPs, institutional treasury teams
    - MPC custody, policy controls, institutional security
    - Enterprise-gated go-live and less turnkey card distribution
  - - BVNK
    - Stablecoin-powered enterprise payments stack
    - $25B+ to $30B+ annual throughput signals; 130+ countries
    - Enterprises, PSPs, platforms
    - Fiat/stablecoin orchestration with Visa Direct and Mastercard ties
    - Public volume figures vary across sources and card specialization is less central than Rain
  - - Ripple
    - Issuer- and bank-network-led payment rail
    - RLUSD plus Ripple Payments; 300+ financial institutions in third-party guide
    - Banks, PSPs, remittance providers
    - Banking relationships and compliant cross-border settlement
    - Less self-serve for developers and not centered on branded card programs
  - - Zero Hash
    - White-label B2B2C infrastructure
    - 51 U.S. jurisdictions and MiCAR+EMI Europe posture
    - Fintechs, neobanks, brokerages, payments platforms
    - Licensing breadth and white-label embed model
    - Product and distribution brand are less visible to end buyers
  - - PayPal PYUSD
    - Consumer / merchant distribution adjacency
    - 70-market roadmap on PayPal; merchant checkout acceptance
    - Consumers, merchants, PayPal ecosystem partners
    - Mass distribution and simple wallet-native UX
    - Not built to be the deepest independent enterprise infrastructure layer
  notes: Scale cells mix official company disclosures and reputable third-party reporting. Where public numbers conflict or are partial, the table preserves the range rather than forcing false precision.
