- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Price / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Rain
    - Enterprise contract; public list pricing unavailable
    - Cards, wallets, payouts, on/off-ramps, compliance stack
    - Realized pricing unknown
    - Consultative sale likely preserves flexibility but reduces self-serve speed
  - - Bridge / Stripe
    - Enterprise API model; Stripe stablecoin payments cited at 1.5% in third-party guide
    - Stablecoin APIs, issuance, merchant integration via Stripe
    - Bridge standalone pricing not public
    - Stripe bundling may make adoption easy for existing Stripe customers
  - - Circle
    - Enterprise / institutional product mix
    - USDC issuance/redemption, Circle Mint, reserve transparency, partner network
    - Pricing mostly custom or context-specific
    - Circle sells trust and liquidity more than simple merchant pricing
  - - Fireblocks
    - Institutional enterprise pricing
    - Custody, settlement, compliance, policy controls
    - Pricing not public
    - Best fit when security budget outweighs need for low-friction onboarding
  - - BVNK
    - Enterprise contract model
    - Send, receive, convert, store, and embedded stablecoin payments
    - Public take rates not disclosed
    - Payments-stack breadth competes on workflow breadth over transparent list pricing
  - - Ripple
    - Enterprise sales model
    - RLUSD, Ripple Payments, on/off ramps, FX settlement
    - Pricing not public
    - Banking-relationship sale can be sticky but slower
  - - Zero Hash
    - Embedded infrastructure contract model
    - Cross-border payments, commerce, trading, payroll, tokenization, on/off ramps
    - Pricing not public
    - White-label model can appeal to platforms wanting invisible infrastructure
  - - PayPal PYUSD
    - Zero-fee buy/send on PayPal plus 4% rewards for holders
    - Consumer wallet, merchant acceptance, transfers
    - Enterprise economics not fully disclosed
    - Powerful for distribution, weaker for infrastructure-level underwriting
  notes: This comparison intentionally preserves “unknown” where vendors do not publish list pricing. In this market, packaging clarity often matters more than a nominal fee headline.
