company:
  name: Rain
chapter:
  number: 3
  title: Competitors
  summary: Rain competes most directly with API-first stablecoin infrastructure vendors such as Bridge/Stripe and BVNK, but the broader competitive set also includes custody-first institutional platforms like Fireblocks, issuer-led rails like Circle and Ripple, and consumer-distribution adjacencies such as PayPal PYUSD. Rain’s clearest differentiation is its dual-network card-issuing position and single-partner stack for cards, wallets, and payouts; its clearest risks are bundling by larger incumbents, deeper licensing by regulated issuers, and security/compliance moats held by custody-led players. The landscape remains fragmented enough that no rival clearly dominates every buyer criterion, which supports a multi-homing and rapid-bundling view of competition rather than a winner-take-all market.
sections:
- id: competitive-landscape
  title: Landscape across direct peers, incumbents, and substitutes
  body: 'Rain’s direct peers are the platforms selling programmable stablecoin payment infrastructure to enterprises. Bridge, now owned by Stripe, is the cleanest API-first rival: it markets receive/store/convert/issue/spend APIs and now sits inside Stripe’s global merchant distribution. BVNK competes as a global stablecoin-powered payments stack for enterprises with strong fiat/stablecoin orchestration, while Zero Hash targets white-label B2B2C stablecoin infrastructure under broad licensing coverage. Circle and Ripple are adjacent but important because they control or sponsor stablecoin rails—USDC and RLUSD respectively—giving them issuer-led trust and liquidity advantages even when they are not the best fit for branded card issuance. Fireblocks, BitGo, and Cobo are not mirror-image substitutes, but they increasingly compete whenever the buyer prioritizes custody, policy controls, and treasury-grade security over go-live speed. PayPal PYUSD and Stripe-native products matter as distribution-heavy
    substitutes that can bundle stablecoins into massive existing payment ecosystems. Internal build, bank-sponsored treasury stacks, and incumbent card or payout processors remain status-quo alternatives, especially when customers prefer to assemble multiple components rather than adopt one integrated vendor.'
