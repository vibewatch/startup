  topStrengths:
    - >-
      Dual Visa and Mastercard principal membership is a structurally defensible differentiator that took years of
      capital and licensing to obtain and creates a direct-network cost advantage across 175M+ merchant locations.
    - >-
      Company-stated growth metrics are extraordinary — 30x card base and 38x payment volume year-over-year — and are
      corroborated directionally by independent market data showing 106% annual growth in stablecoin card payment
      volume.
    - >-
      Named enterprise deployments span five distinct verticals (crypto-native fintechs, cross-border remittance
      platforms, enterprise payments, government/public sector, and agentic AI commerce), reducing concentration and
      demonstrating broad platform applicability.
    - >-
      $338M+ capital base from tier-1 investors (ICONIQ, a16z Crypto, Founders Fund, Tiger Global, Norwest, Sapphire)
      provides multi-year runway for the global licensing and expansion campaign required to defend the valuation.
  topRisks:
    - >-
      Mastercard's announced acquisition of BVNK — Rain's closest direct competitor — creates a Mastercard-backed
      stablecoin infrastructure rival that could displace Rain in enterprise accounts at preferential network economics,
      without Rain being involved.
    - >-
      Revenue, ARR, gross margin, burn rate, and take rates remain entirely undisclosed; scenario analysis implies
      13x–65x EV/Revenue depending on assumed take rate, making the current $1.95B valuation extremely difficult to
      underwrite.
    - >-
      Multi-jurisdiction licensing under the GENIUS Act (effective January 2027), EU MiCA, and parallel regimes in
      LatAm, Asia, and Africa will consume significant capital and management attention with uncertain timelines and
      outcomes.
    - >-
      Visa holds 90%+ of on-chain card volume and is simultaneously building competing stablecoin settlement
      infrastructure; any change to Visa's principal-member policies or preference toward its own stablecoin
      capabilities could materially impact Rain's core business.
  unresolvedGaps:
    - >-
      Revenue run rate, gross margin by product line, take rates, burn, cash runway, and a concrete path to
      profitability — the minimum financial disclosure needed to underwrite the $1.95B Series C price.
    - >-
      Partner concentration: whether Nuvei, Western Union, Nomad, or any other single partner accounts for a
      disproportionate share of TPV; customer-level economics and NRR/churn data remain absent.
    - >-
      Regulatory license inventory by jurisdiction: which specific licenses Rain holds versus plans to obtain in North
      America, Europe, LatAm, Asia, and Africa, and the realistic timeline and cost for each.
    - >-
      Full board composition, liquidation preference stack from the three rounds, exact dilution impact on common
      equity, and any debt or secondary components embedded in the Series C.
