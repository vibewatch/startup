company:
  name: Rain
chapter:
  number: 1
  title: Company Overview
  summary: Rain is a New York-based stablecoin payments infrastructure company founded in 2021 that has expanded from crypto-native spend management into enterprise card issuing, wallets, payouts, and fiat-stablecoin orchestration. Public evidence supports a rapid three-round financing path from a $24.5 million Series A in March 2025 to a $250 million Series C in January 2026, lifting lifetime funding above $338 million and valuation to $1.95 billion. The strongest diligence caveats are the absence of public revenue, ARR, headcount, and full board disclosure despite clear traction signals around >$3 billion in annualized volume, 200+ partners, and dual-network Visa/Mastercard card infrastructure.
sections:
- id: identity-and-product-scope
  title: Identity, headquarters, and product scope
  body: Rain’s best-supported identity is an enterprise stablecoin payments infrastructure company headquartered in New York and founded in 2021. The official homepage and funding announcements consistently frame the business as infrastructure for enterprises, neobanks, platforms, and developers rather than a retail crypto app. The product scope now spans global card programs, stablecoin wallets, digital-dollar accounts, fiat-to-stablecoin conversion, payouts, and cross-border payment flows. That breadth matters because Rain is no longer just a crypto-card wrapper; it is selling a full orchestration layer that lets a partner handle money-in, storage, spend, and money-out through one integration. Historical founder material shows the company started from a more crypto-native treasury and spend-management wedge around SignandWire and DAO workflows, but the 2025-2026 source pack shows a clear repositioning toward broader enterprise payment infrastructure with compliance, controls, and embedded-wallet
    tooling at the center.
