callouts:
- calloutType: strength
  title: Dual-network positioning gives Rain more than a crypto middleware narrative
  body: Visa principal membership already underpinned Rain’s stablecoin card economics, and the 2026 Mastercard principal membership adds a second global network plus potential onchain-settlement collaboration. That combination is stronger proof of distribution readiness than a typical API-only crypto payments startup can show.
  claimRefs:
  - CO021
  - CO035
  - CO036
  - CO037
- calloutType: risk
  title: The valuation step-up is easier to see than the financial model
  body: Rain’s public materials clearly support a jump to a $1.95 billion valuation and strong activity growth, but they still do not disclose revenue, ARR, or current headcount. That means investors can underwrite momentum and partnerships faster than they can underwrite unit economics or operating leverage.
  claimRefs:
  - CO023
  - CO024
  - CO027
  - CO028
  - CO041
  - CO042
- calloutType: insight
  title: Rain’s story is a wedge-expansion story from crypto-native spend to enterprise infrastructure
  body: Founder-story material and early profiles show Rain beginning around crypto-native spend management and DAO treasury pain points. The 2025-2026 product and financing pack shows the company broadening that wedge into a general enterprise stablecoin stack spanning cards, wallets, payouts, and embedded accounts.
  claimRefs:
  - CO011
  - CO020
  - CO039
  - CO047
