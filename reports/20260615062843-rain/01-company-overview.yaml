  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, and take-rate disclosure for Rain’s enterprise stablecoin programs.
    whyItMatters: The Series C valuation can be observed publicly, but the underlying revenue base and unit economics cannot.
    diligencePath: Request board deck or investor update with run-rate revenue, gross margin, cohort growth, and capital-efficiency metrics.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A canonical current employee count and geographic staffing split.
    whyItMatters: Headcount is a basic operating-scale and burn proxy, especially after a fast fundraising cycle.
    diligencePath: Request current org chart or HRIS snapshot and reconcile it to hiring plans described after Series B and Series C.
    relatedQuestionRefs:
    - QO023
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete board roster, observer rights, and governance terms attached to the 2025-2026 financings.
    whyItMatters: Public sources show who led rounds but not how control rights or board composition changed as valuation accelerated.
    diligencePath: Request cap table, voting agreements, and current board/observer list from counsel or the company.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: licensing-footprint
    missingEvidence: Jurisdiction-by-jurisdiction list of licenses, sponsor arrangements, and live market coverage.
    whyItMatters: Expansion claims are global, but launch feasibility depends on local licensing and network permissions.
    diligencePath: Request an operating-market matrix showing network memberships, regulated entities, and rollout status by geography.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO004
