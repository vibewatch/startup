- id: founders-and-governance
  title: Founders, named leaders, and governance visibility
  body: 'Farooq Malik is the clearest public operating anchor: official Rain materials and third-party funding coverage all identify him as CEO and co-founder. Charles Naut is consistently named as the other co-founder, and founder-story coverage fills in the company’s earliest product evolution from the SignandWire side project into Rain’s Web3 spend-management tooling. Governance visibility is thinner than fundraising visibility. The clearest current public board signal is Sapphire Ventures president Jai Das joining the board at the August 2025 Series B, while investor commentary from Norwest and ICONIQ establishes strong sponsor engagement without revealing a full board roster or committee structure. That leaves meaningful key-person dependence on Malik and an under-documented governance picture for a company that scaled valuation from early-stage startup to near-unicorn-plus territory in under a year. For later diligence, the gap is not who founded Rain, but how much decision-making
    power remains concentrated and what investor governance rights came with the accelerated financing sequence.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO019
  - CO044
  tableRefs:
  - TO002
  - TO003
- id: funding-trajectory-and-scale
  title: Funding trajectory, operating scale, and disclosure gaps
  body: 'Rain’s financing history is unusually compressed. The March 2025 Series A raised $24.5 million and paired capital with Visa principal-membership expansion. Five months later the August 2025 Series B added $58 million, lifted total funding to $88.5 million, and publicly claimed 10x volume growth plus potential reach to 1.5 billion people. Four months after that, the January 2026 Series C added $250 million, took total funding above $338 million, and valued the company at $1.95 billion. The traction indicators attached to that round are substantial: 30x growth in active card base, 38x growth in annualized payment volume, more than $3 billion in annualized transactions, and more than 200 partners. The underwriting problem is disclosure depth, not lack of momentum. Public materials still do not disclose revenue, ARR, or a canonical current headcount, and they reveal only fragments of board composition. Investors can clearly see funding velocity and partner adoption, but not yet the
    unit economics or organizational maturity that would fully justify the valuation step-up.'
