- id: capital-adequacy-and-public-traction
  title: Capital adequacy, financing dependency, and public traction proxies
  body: Rain’s public traction proxies are strong enough to justify serious diligence but not enough to complete underwriting. Series B and Series C disclosures show 10x transaction-volume growth in 2025, 30x active-card-base growth entering 2026, more than $3 billion in annualized transaction volume, and more than 200 partners. Those numbers are directionally supportive because they imply real network usage and a growing installed base. The company also explicitly said Series C proceeds would fund additional regulatory licensing, strategic acquisitions, and geographic expansion, which suggests a continued capital-intensive buildout rather than a business already declaring self-sustaining operating leverage. Public materials do not disclose cash on hand, monthly burn, runway, debt facilities, reserve balances, or credit-loss exposure. That leaves capital adequacy as an open question. Rain clearly raised enough to keep scaling, but the market cannot tell how much cushion the company has if
    growth slows, incentives rise, or regulatory expansion takes longer than expected. In other words, financing dependency is visible even though the precise runway is not.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI031
