  - FI003
- id: diligence-blockers-and-financial-verdict
  title: Public financial gaps, analog benchmarks, and verdict
  body: 'The financial verdict is therefore limited by missing variables, not by lack of market activity. Rain likely benefits from the same broad structural advantages that public networks and digital-wallet businesses chase: transaction-based revenue, cross-border volume sensitivity, and the ability to layer value-added services on top of payment flows. Mastercard’s filings illustrate how scaled network businesses monetize GDV, switched transactions, and cross-border flows while contending with rebates, incentives, interchange pressure, and concentration among large customers. PayPal’s filings and PYUSD product posture illustrate another path: consumer-distribution economics where wallet scale and subsidy can matter as much as per-transaction margin. Rain sits somewhere between those models. It appears more infrastructure- and enterprise-oriented than PayPal, but more direct-issuance and card-program focused than a pure four-party network like Mastercard. The result is attractive in theory
    and under-disclosed in practice. Until revenue, gross margin, burn, and concentration are disclosed privately, the financial judgment must remain provisional: promising quality-of-revenue signals, strong working-capital logic, but insufficient public data to clear a full underwriting threshold.'
