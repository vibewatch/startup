callouts:
- calloutType: strength
  title: Rain’s public unit-economics story is strongest on working-capital efficiency, not revenue multiple optics
  body: Daily settlement, lower reserve drag, and faster launch are the most defensible public financial positives. These are customer-ROI claims that can drive adoption even before public revenue disclosure appears.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI010
  - CI030
- calloutType: risk
  title: The absence of public revenue, margin, burn, and concentration data is the core underwriting blocker
  body: Rain has enough activity evidence to justify deeper diligence, but not enough disclosed financial detail to justify conviction on valuation or margin path. The company remains financially interesting and still financially opaque.
  claimRefs:
  - CI011
  - CI015
  - CI016
  - CI031
  - CI032
  - CI038
- calloutType: insight
  title: Payments-network benchmarks imply that volume scale alone does not guarantee attractive vendor economics
  body: Mastercard’s filings show a business model built on fees, incentives, and pricing trade-offs rather than frictionless margin expansion. Rain’s economics could be excellent, but public data do not yet prove that >$3B of annualized volume translates into similarly attractive margins.
  claimRefs:
