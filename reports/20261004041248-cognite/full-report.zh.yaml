chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、管理层与治理架构
        blocks:
          - type: paragraph
            body: >-
              Cognite 是一家面向能源、制造和公用事业等资产密集型行业的全球软件即服务供应商，提供工业数据运营和生成式人工智能能力。
              公司最初成立于挪威奥斯陆，后来将全球总部设在亚利桑那州，同时扩大挪威和印度的研发中心，并在休斯敦、东京和阿布扎比设立商业分支机构。 董事长兼 CEO Girish Rishi 负责管理层，他接替了联合创始人兼前
              CEO Dr. John Markus Lervik。工业控股集团 Aker 是控股多数股东， 与成长型股权投资方 TCV 共同构成治理核心；在 2021 年那轮标志性融资后，TCV 普通合伙人 Jake
              Reynolds 进入 Cognite 董事会。 2025 年，Cognite 招募 Chirayu Shah 担任首席产品官、Sandy Joung 担任首席营销官、Bill Owen
              担任首席服务官，扩充高管团队， 以管理核心平台和 AI 智能体产品的全球扩张。
            claimRefs:
              - CO001
              - CO002
              - CO003
