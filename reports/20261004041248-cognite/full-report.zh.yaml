              公开提及的企业客户证明，Cognite Data Fusion 和 Cognite Flows 已在真实的关键生产环境运行，而不是停留在概念验证沙盒。 德国医疗技术跨国公司 B. Braun 使用 Cognite
              Flows，在制造运营中建立实时资产透明度和运营智能。日本炼化企业 Idemitsu Kosan 部署 Cognite Flows，系统性解决资产不合规事件并加快工程根因分析。挪威勘探生产运营商 Aker BP
