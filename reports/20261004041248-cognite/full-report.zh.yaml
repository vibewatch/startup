              Cognite 报告新客户群 NRR 为 150%，说明工业账户整合运营数据模型并启用高价值分析后，净扩张显著。企业扩张以 Moonshot 承诺为核心，目标到 2035 年累计交付 $100 billion
              客户价值，并配有正式的 Value Realisation Workshops、专门指导委员会和承担配额的商业销售团队。 但披露限制仍很严重。Cognite 只报告新客户的群组
              NRR，而不是覆盖整个历史客户群的综合净留存率，因此老客户或未扩张客户的流失可能被掩盖。 此外，付费企业客户总数、logo 流失率、毛收入留存率（GRR），以及包括创始关联方 Aker BP
              在内的头部锚定客户收入集中度， 均未在经审计披露中出现，账户脆弱性无法量化。
