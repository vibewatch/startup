      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 商业不透明造成总拥有成本不确定性
            body: Cognite 不在 hyperscaler 市场公布标准自助定价层级或用量费率表。软件许可还要叠加专业服务、Success Track 项目和部署加速器， 如果初始实施范围扩大，企业采购团队可能面临预算超支。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: 系统集成商联盟是关键执行因素
            body: >-
              Cognite Data Fusion 需要连接异构 OT 现场硬件与企业 IT 软件，因此 Cognite 进军制药、制造和供应链市场高度依赖 Deloitte、Radix 等伙伴。 保持伙伴赋能，对扩大
              ARR 与核心产品工程同样关键。
            calloutType: insight
            claimRefs:
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与并购交易背景
        blocks:
          - type: paragraph
            body: >-
              Cognite 的投资逻辑已从独立 SaaS 独角兽扩张故事，转向被收购的工业智能平台。2026 年 6 月 30 日，Schneider Electric 宣布协议， 以 $3.1 billion
              全现金交易收购 Cognite Holding B.V. 100% 股权。收购价相当于 Cognite 2025 年收入的 18.2 倍，而该年收入超过 $170 million。 Cognite 的核心优势，是
              Cognite Data Fusion（CDF）内统一的工业数据模型和 Atlas AI 智能体层，两者共同连接重资产行业复杂的 OT 与企业 IT 数据。 在 Schneider Electric
              旗下，Cognite 计划与 AVEVA 整合，并纳入 Schneider Electric 工业自动化业务，把工业数据语境化能力与 AVEVA 的 CONNECT 平台直接结合，覆盖全球工业站点。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV013
      - number: '8.2'
        title: 融资历史与估值倍数纪律
        blocks:
          - type: paragraph
            body: >-
              在 $3.1 billion 收购协议前，Cognite 通过三轮主要私募融资筹集约 $225 million。2020 年 10 月，Accel 领投 $75 million 的 Series A， 公司估值
              $550 million。2021 年 5 月，成长型股权公司 TCV 领投 $150 million 的 Series B，使 Cognite 以 $1.6 billion 投后估值跻身独角兽。 2022 年
              2 月的后续二级交易引入 Saudi Aramco，当时估值为 $1.5 billion。Forge Global 等二级和 IPO 前市场记录了有限交易，但没有活跃报价； 第三方市场跟踪机构 Latka
              和聚合器 Multiples 都把 $3.1 billion 收购价视为 $170 million 历史 ARR/收入的激进 18.2 倍。 这一溢价反映的是工业 GenAI
              与智能体工作流编排的战略稀缺价值，而不是标准化软件交易倍数。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: 情景分析、执行风险与尽调要求
        blocks:
          - type: paragraph
            body: >-
              评估 Cognite，需要分别考察交易完成后的整合、监管长期延误和交易破裂情景。基准情景是全现金收购在未来几个季度经过惯常监管审查后完成， 以 $3.1 billion 带来流动性，并让 Cognite 借助
              AVEVA 进入 Schneider Electric 的全球客户群交叉销售。乐观情景假设企业渗透加快， Cognite Flows 和 Atlas AI 等智能体工具推动 ARR 扩张远超 36%
              的预订增长，释放更深的工业自动化协同。悲观情景则考虑反垄断或跨境监管审查 延迟交割或迫使让步，使 Cognite 面临高现金消耗，并将独立估值重置到 ARR 的 8 倍至 10 倍私营软件倍数。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: Schneider Electric 收购的决策含义
            body: >-
              Schneider Electric 已签署最终协议，以 $3.1 billion 现金收购 Cognite Holding B.V. 100% 股权；私募市场投资者应从交易完成和并购后整合的角度看待该资产，
              而不是把它当作投机性风险融资机会。Schneider Electric 以收入 18.2 倍的倍数，为 Cognite 的工业知识图谱和智能体 AI 工具支付了完整的战略价格。 在交割确认和监管批准前，我们维持
              TRACK 建议。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
          - type: callout
            title: 监管交割延迟时的下行风险
            body: 尽管全现金收购协议缓解了独立运营的流动性担忧，交易仍取决于惯常交割条件和各司法辖区的监管批准。如果意外的反垄断审查或外资审查拖延交割， Cognite 可能遭遇运营中断，估值倍数也可能向私营软件可比公司水平压缩。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
