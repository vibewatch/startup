          summary: High build and maintenance friction with 18-24 month time-to-value lag and execution risk
  - id: FI001
    title: 收入模型桥接与缺失的毛利转化
    type: flow
    summary: 公开证据将企业销售流程与软件及服务收入信号连接起来，但没有量化最终的毛利转化。
    data:
      nodes:
        - id: buyer-scope
          label: 工业用例与部署范围
          detail: 站点、资产、数据量、集成和工作流共同定义购买场景。
        - id: demo-quote
          label: 演示与定制报价
          detail: 官网将潜在客户引导至现场演示；公开标准定价不存在。
        - id: subscription-order
          label: 核心订阅订单
          detail: 定制企业订阅构成主要软件收入机制。
        - id: services-order
          label: 服务与成功订单
          detail: 专业服务、Success Track 和加速器可能单独签约。
        - id: deployment-cost
          label: 部署与基础设施成本
          detail: 提取器、身份管理、OT 连接和集成范围会影响整体交付经济性。
        - id: expansion
          label: Atlas AI 与 Flows 扩张
          detail: 订单和赋能显示采用情况，但不代表单独确认的收入。
        - id: annual-revenue
          label: 2025 财年年收入超过 $170M
          detail: 公司披露的会计期间规模；经常性收入构成未披露。
        - id: gross-profit-gap
          label: 毛利与现金转化不可得
          detail: 合并毛利率、现金消耗和资金续航需要私人证据。
      edges:
        - from: buyer-scope
          to: demo-quote
        - from: demo-quote
          to: subscription-order
        - from: subscription-order
          to: services-order
        - from: services-order
          to: deployment-cost
        - from: deployment-cost
          to: expansion
        - from: expansion
          to: annual-revenue
        - from: annual-revenue
          to: gross-profit-gap
    approximationNotes: 仅为概念流程；不估算价格、收入分配、利润率或转化率。
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI008
      - CI009
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从工业数据源到情境化、开发者接口和面向操作员的应用，各层均有证据支持。
    data:
      layers:
        - label: 工业源系统
          items:
            - 历史数据库与 PLC
            - IT 与 OT 系统
            - 工程数据
            - AWS 数据服务
          detail: 专用原生提取器摄取源数据。
        - label: 摄取与质量
          items:
            - 提取器
            - 验证检查
            - 转换
            - 实体匹配
          detail: 管道在应用使用前准备源记录并建立关联。
        - label: 工业知识图谱
          items:
            - 空间
            - 容器
            - 视图
            - 节点
            - 直接关系与边
          detail: 共享情境层连接工业实体与数据。
        - label: 平台与开发者接口
          items:
            - API 与 SDK
            - 工具包
            - 工作流
            - 工业 MCP
          detail: 开发者配置、部署、编排并开放情境化数据。
        - label: AI 与应用层
          items:
            - Atlas AI
            - Cognite Flows
            - Canvas
            - InField
            - Charts
          detail: AI、原生应用和定制工作流共同使用这一数据基础。
        - label: 工业用户与合作伙伴
          items:
            - 操作员
            - 工程师
            - 数据团队
            - 应用构建者
          detail: 用户通过面向不同角色的体验使用情境化数据。
    approximationNotes: 排列综合 Cognite、AWS 和 SLB 的描述；不代表实测延迟、通用部署拓扑或统一的生产成熟度。
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE009
      - CE013
      - CE016
  - id: FU001
    title: Cognite 企业客户采用与扩张生命周期
    type: journey-map
    summary: 多阶段客户扩张循环，展示从初始 OT/IT 数据摄取到自主多工厂代理式工作流运营的进阶。
    data:
      items:
        - label: 阶段 1：初步发现与连接器摄取
          stage: 初步评估与数据集成
          title: OT/IT Data Connector Ingestion
          description: 客户使用预构建工业连接器，将分散的历史数据库、SCADA、传感器和 ERP 数据摄取到 Cognite Data Fusion。
          touchpoints:
            - 首席数字官提供高管支持
            - 向历史数据库和 ERP 部署产品化连接器
            - 举办首场价值实现工作坊，建立 ROI 指标
        - label: 阶段 2：语义数据建模与情境化
          stage: 情境化与数据建模
          title: Industrial Knowledge Graph Expansion
          description: 数据被置入语义数据模型，将物理设备标签与 3D 模型和维护工单连接起来。
          touchpoints:
            - 通过 Radix、Deloitte 或 L&T 引入系统集成商
            - 客户数据建模实例翻倍
            - 将数百万条时序数据流进行情境化
        - label: 阶段 3：高级 AI 分析与 Atlas AI 赋能
          stage: 应用与代理式工作流激活
          title: Atlas AI and Cognite Flows Enablement
          description: 运营团队部署生成式和代理式工作流，用于根因分析、不合格项跟踪和供应链可视化。
          touchpoints:
            - Atlas AI 覆盖 59% 的客户 ARR
            - Cognite Flows 覆盖超过 30% 的客户群
            - 部署面向一线角色的代理应用
        - label: 阶段 4：自动化根因分析与工作流编排
          stage: 工作流加速
          title: Cognite Flows Execution
          description: 一线工程师和工厂操作员将常规不合格项分析及资产维护审查自动化。
          touchpoints:
            - 在 Idemitsu Kosan 和 B. Braun 部署
            - 运营工作流创建速度快速提升 100 倍
            - 整合一线数字化体验
        - label: 阶段 5：供应链与跨设施韧性
          stage: 供应链集成
          title: Integrated Supply Chain Optimization
          description: 将入厂物流遥测和 FourKites 可视化直接接入工厂现场排程。
          touchpoints:
            - 集成 FourKites 实时在途跟踪
            - Deloitte 运营韧性咨询
            - 动态评估各生产线的约束条件
        - label: 阶段 6：多地点企业标准与规模化
          stage: 企业规模化与净扩张
          title: Multi-Site Enterprise Standard
          description: 在全球设施网络中全面推广，带来强劲的净收入留存和嵌入式运营依赖。
          touchpoints:
            - 高管指导委员会治理
            - 跨工厂部署数百个工业 AI 代理
            - 借助 FourKites 扩展至集成供应链运营
    approximationNotes: 生命周期进阶综合 Cognite 商业项目管理工作流、客户会议披露和发布公告。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU011
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 从可能性和严重性两个维度评估 Cognite 面临的主要组织与技术风险。
    data:
      columns:
        - 低严重性
        - 中严重性
        - 高严重性
      rows:
        - label: 高可能性
          values:
            - null
            - 商业定价不透明
            - OT-IT 集成延迟
        - label: 中等可能性
          values:
            - null
            - AI 治理与监管暴露
            - 锚定客户集中度
        - label: 低可能性
          values:
            - null
            - 一线采用阻力
            - 资不抵债时的数据可移植性风险
        - label: 极低可能性
          values:
            - null
            - null
            - 核心遥测管道中断
        - label: 监控优先级
          values:
            - 第 3 级观察
            - 第 2 级商业 / 治理
            - 第 1 级关键运营
        - label: 缓释路径
          values:
            - 标准 SLA
            - SI 合作伙伴赋能
            - 知识图谱连接器
    approximationNotes: 可能性和严重性分类映射自定性专家技术基准与商业披露。
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR009
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从工业数据基础和财务规模，逐步推导至估值评估与跟踪建议。
