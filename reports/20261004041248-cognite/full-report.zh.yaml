  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规框架
        blocks:
          - type: paragraph
            body: >-
              Cognite 为北美、欧洲和亚洲的工业企业处理数据，因此必须遵守包括欧盟《通用数据保护条例》（GDPR）在内的地区数据保护标准。 公司标准《数据处理协议》划定严格的运营边界，要求发现个人数据泄露后立即、且不晚于
              72 小时通知数据控制者。 Cognite 还在合同中保证，如果发生潜在破产，数据导出和自动迁移工具在永久删除前的 30 天过渡期内仍可访问。 但 Cognite
              在跨国云环境和混合本地环境中处理运营遥测及个人数据，跨境传输限制和外国机构传票调取构成持续的合规摩擦，需要主动治理。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营复杂度与集成摩擦
        blocks:
          - type: paragraph
            body: >-
              在重资产制造和能源设施部署工业 AI，让 Cognite 面临严重的集成和运营风险。一线采用 Cognite Data Fusion 与 Cognite Flows， 需要把分散的 ERP、仓库管理系统和 OT
              historian 进行语境化。第三方基准显示，Cognite 擅长语境化数据建模和企业多站点集成， 但原生协议网关深度不足，并高度依赖客户侧或伙伴主导的集成工具。商业评估强调，Cognite Data
              Fusion 通过定制企业订阅订单销售， 而非透明的自助层级；专业服务、Success Track 和 Development Accelerators 另行收费。消费阈值和集成劳动投入缺少透明度，
              使工业买方面临总拥有成本波动。
