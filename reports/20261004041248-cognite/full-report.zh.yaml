      - number: '1.3'
        title: 产品演进、工业 AI 部署与里程碑轨迹
        blocks:
          - type: paragraph
            body: >-
              Cognite 的技术平台以 Cognite Data Fusion 为核心，这是一个部署在 bp、Mitsubishi 和 Saudi Aramco 等企业客户中的工业数据运营与语境化引擎。
              公司按季度迭代产品路线，最终推出工业智能体工作台 Cognite Atlas AI，以及把运营工作流与智能体 AI 结合起来的行动层 Cognite Flows。 FY2025
              客户采用指标显示，工业知识图谱纳入的时间序列数据点超过 80 trillion，增长 48%；AI token 使用量近乎增长 500%，月活用户增长 26%。
              但客户案例仍集中在重工业，客户数量披露也大多不公开。Cognite 承诺了 Moonshot 目标：到 2035 年累计创造 $100 billion 客户业务价值，
              但完整客户群的财务回报指标尚未经过审计验证，这仍是持续存在的尽调缺口。
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO016
      - number: '1.4'
        title: 图表
        blocks:
          - type: callout
            title: 强大的工业基因与核心平台采用
            body: >-
              Cognite 既有 TCV 的一线成长资本支持，也能触达 Saudi Aramco、bp 和 Mitsubishi 等大型工业客户。旗舰产品 Cognite Data Fusion 语境化引擎和 Atlas
              AI 采用势头强劲，59% 的客户 ARR 已在使用 Atlas AI。
            calloutType: strength
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
          - type: callout
            title: 私营财务不透明与估值差异
            body: >-
              管理层报告 FY2025 收入超过 $170 million，但该指标仍属初步、未经审计，且没有合并 GAAP 资产负债表披露。第三方跟踪机构给出的成立日期互相矛盾，
              二级估值数字（$3.1B）也缺乏一手交易验证。
            calloutType: risk
            claimRefs:
              - CO009
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与相邻行业
        blocks:
          - type: paragraph
            body: >-
              Cognite 将主要可触达品类定义在工业 DataOps 和运营智能软件领域，重点面向能源、化工、电力、公用事业和制药等资产密集型行业 [CM001]。
              平台架构的核心，是把非结构化数据、运营数据和工程数据统一到语境化知识图谱中，这使其区别于通用企业数据湖或横向云存储基础设施 [CM002]。 相邻市场包括历史时间序列 historian、专业运营分析引擎和企业
              AI 编排套件 [CM003]。交易导向的企业资源规划系统、边缘硬件控制器， 以及缺少行业资产语境化能力的通用商业智能仪表盘，不在这一边界内 [CM004]。Cognite 有意把 Cognite Data
              Fusion 和 Atlas AI 放在资产所有者 从被动的描述性遥测转向自主智能体工作流的关键位置 [CM005]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与可触达支出层
        blocks:
          - type: paragraph
            body: >-
              评估工业 DataOps 和运营 AI 的可触达市场，需要多层规模视角，而不是单一的自上而下总量预测 [CM006]。最宽的视角涵盖全球工业软件和企业运营技术现代化， 对应一个覆盖全球能源设施和离散制造工厂的巨大
              TAM [CM007]。在这笔宏观支出中，可服务市场聚焦于全球资产运营商部署的工业智能、语境化平台和 DataOps 层，用来打通信息孤岛 [CM008]。Cognite
              的可获得市场体现为后期成长型企业部署，2025 年收入 $170 million 以及在重资产企业中的既有覆盖面 都是佐证 [CM009]。但由于分析师分类之间的定义重叠，关于纯工业 DataOps
              精确美元上限，尚无全面、独立的第三方共识可供验证 [CM010]。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 买方细分、采购路径与商业摩擦
        blocks:
          - type: paragraph
            body: >-
              资产密集型组织的企业买方主要分为企业 IT 领导、运营技术负责人和工厂工程主管 [CM011]。数字化转型项目与企业工业 AI 架构通常由首席数字官和 首席信息官推动，他们寻找高 ROI
              的运营用例，并希望集中治理数据 [CM012]。工厂经理和运营工程师则更看重设备正常运行时间、流程安全和直接的 运营工作流改进，部署往往依赖合作伙伴系统集成商
              [CM013]。企业订阅的打包方式带来显著商业摩擦；Cognite Data Fusion 需要定制报价、主服务协议， 以及强制性的专业服务或实施加速器，既不利于透明的自助采用，也会拉长采购周期
              [CM014]。此外，外部品类评估认为，相比通用企业数据管理平台， Cognite 在更广泛的 AI 数据分析排名中的认知度有限 [CM015]。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 市场转向智能体运营 AI
            body: >-
              工业数据市场正经历结构性范式转变，从旧式 IoT 遥测采集转向智能体驱动的运营执行 [CM005]。随着工业运营商面对日益复杂的运营环境和人员退休，
              市场需求集中到语境化知识图谱上，让自主智能体能够跨工程图纸、维护日志和实时传感器流进行推理 [CM002]。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
          - type: callout
            title: 采购不透明与服务依赖限制中端市场覆盖
            body: >-
              Cognite 依赖定制企业订单、未披露的目录价和大量实施加速器，形成很高的商业进入门槛 [CM014]。没有透明的自助层级，销售周期会持续偏长，
              并且高度依赖头部企业客户，令更广泛的中端市场服务不足，容易被专业化点解决方案切走 [CM014]。
            calloutType: risk
            claimRefs:
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              Industrial DataOps 是运营中间件层，用于提取、语境化、建模并治理横跨 OT、企业 IT 和 ET 的分散遥测。在这一品类中，Cognite 面临四条竞争路径：
              传统工业自动化集团、云原生点解决方案、横向企业数据结构，以及内部 DIY 工程构建。AVEVA、Siemens 和 Rockwell Automation 等成熟自动化领导者，
              在全球制造基地拥有根深蒂固的硬件基础、专有 SCADA 系统和本地 historian。但旧架构经常把运营遥测困在专有协议和供应商锁定的信息孤岛中， 阻碍跨工厂语境化分析。Litmus 和 Sight
              Machine 等云原生挑战者瞄准车间遥测快速接入，却往往缺少多站点企业知识图谱建模能力。 通用企业 hyperscaler 与横向数据平台又缺少原生工业协议提取器和语境化 ISA-95
              资产层级模型。因此工业买方必须权衡，是拼装分散的开源数据湖， 还是部署专门的商业平台。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
      - number: '3.2'
        title: 架构差异：工业知识图谱与传统孤岛
        blocks:
          - type: paragraph
            body: >-
              Cognite Data Fusion（CDF）的核心技术差异，在于 Industrial Knowledge Graph 和自动数据语境化引擎。不同于主要作为扁平时间序列标签档案的 OSIsoft PI，
              Cognite 把非结构化文档、P&ID、3D CAD 模型和实时传感器流映射到统一语义图谱。独立采购基准给其 OT/IT/ET 数据整合 4.8/5.0、工业资产建模 4.9/5.0，且有超过 90
              个预构建连接器。Atlas AI 和 Cognite Flows 的运营化引入智能体 AI，让一线人员直接基于语境化工厂数据构建自动化工作流并执行根因诊断。
              但其原生车间边缘执行和亚秒级控制环路存在明显限制，边缘处理基准只有 2.8/5.0。由于 Cognite 依赖容器化本地提取器缓冲遥测后上传处理， 而非作为分布式确定性边缘运行时，关键安全系统和闭环控制仍需由本地
              PLC 与 DCS 管理。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP009
              - CP014
      - number: '3.3'
        title: 商业打包、交易架构与总拥有成本
        blocks:
          - type: paragraph
            body: >-
              Cognite 的 GTM 依赖高价值、多年期企业 SaaS 订阅，通过定制主服务协议（MSA）签订，而非透明自助或公开价目表。 为保护高毛利软件经济性并满足 ASC 606
              收入确认标准，公司在收入运营团队内设立专门的交易设计治理职能，把低毛利、服务密集型实施任务拆分到 Professional Services、Development Accelerators 和 Success
              Track 的独立咨询订单中。与按标签收取限制性许可费的传统自动化厂商不同， Cognite 订阅鼓励企业广泛连接。但 TCO 分析显示采购风险明显：第一年支出高度偏向可计费咨询工时、定制提取器配置和语境
              schema 设计。 底层用量指标（如数据吞吐量和 3D 接入速率）又处于保密状态，未在公开市场清单中编入索引；当多站点遥测超过初始试点预测时，企业买方可能面临预算扩张。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 护城河持久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Cognite 的长期竞争护城河来自深度运营集成带来的高切换成本，而非合同锁定。通过把开放 REST API、GraphQL 端点和 Python SDK 嵌入企业 IT 环境， Cognite 将 CDF
              定位为协作式数据解放层，与现有 historian 共存，而不是要求立即推倒重建。工业运营商一旦在多个设施配置复杂的跨资产关系、 定制机器学习管道和一线 Flows
              工作区，提取这套组织运营语境并迁移到替代平台，就会造成严重工程中断。但 Cognite 仍有战略脆弱点： Palantir 和 Databricks 等企业云软件平台正在扩展垂直工业制造加速器，Schneider
              Electric 等工业集团也在寻求统一自动化硬件与软件平台。 此外，客户集中在资本密集型能源和流程行业，使软件扩张速度暴露于大宗商品与资本开支周期。Cognite 要保持差异化，必须守住数据建模优势，
              同时缩小云端智能与车间边缘执行之间的延迟差。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP009
              - CP012
              - CP014
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 知识图谱互操作性作为竞争楔子
            body: Cognite 以开放的语义语境化层，从现有系统提取数据，不迫使客户基础设施淘汰，从而绕开与根深蒂固 historian 之间传统的推倒重建竞争。
            calloutType: insight
            claimRefs:
              - CP005
              - CP014
          - type: callout
            title: 关键运营环路中的边缘劣势
            body: Cognite 在全企业语境化建模和智能体 AI 工作区占优，但原生边缘数据处理评分较低，使亚秒级控制和隔离网确定性自动化容易受到传统自动化厂商冲击。
            calloutType: risk
            claimRefs:
              - CP006
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入质量与增长信号
        blocks:
          - type: paragraph
            body: >-
              Cognite 报告 FY2025 年收入超过 $170 million，另一个 ARR 预订指标同比增长 36% [CI001, CI002]。两者不能混为一谈：
              年收入是会计期间结果，预订增长则是前瞻性商业信号，但其期初余额和转化为确认收入的情况没有披露。扩张证据集中在部分客户： Cognite 报告新客户 NRR 为 150%，并非整个存量客户群
              [CI003]。产品采用或许支持扩张：Atlas AI 纳入 2025 年超过 70% 的预订， 按 ARR 计有 59% 的客户已将其投入运营 [CI004, CI016]。收入集中度有所下降但仍很明显，因为
              Cognite 表示 2025 年约 40% 的收入来自油气以外 [CI005]。
            claimRefs:
              - CI001
