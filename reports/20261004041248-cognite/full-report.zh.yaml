      - number: '5.3'
        title: 成熟度、控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Q3 2026 更新显示，产品组合的成熟度并不均衡，并非整套都已达到生产就绪。一些搜索、3D、InField、Canvas 和自定义应用能力被标为生产版， Industrial MCP 和 Agent
              Builder CLI 仍是预览版，Atlas AI Sandboxes 仍属私有预览。持续迭代说明交付活跃，但也让采用新 AI 能力的客户暴露在版本、 支持和变更管理风险中。数据模型文档规定了 schema
              与实例权限、设施级实例空间、索引和受控部署。AWS 描述了使用 IAM、KMS、Secrets Manager、 Shield、CloudWatch 和 CloudTrail 的参考设计，但这些控制体现的是
              AWS 解决方案模式，不是 Cognite 全公司的认证或审计结论。 公司发布的工程岗位转发还显示其在多租户、多云编排、可观测性、SLO 和事件响应上投入；这是招聘信号，不是已达到可靠性目标的证明。
              投资判断因此应要求服务级历史、事件记录、渗透测试摘要、认证范围，以及按工作负载拆分的成本和性能数据。
            claimRefs:
              - CE004
              - CE010
              - CE011
              - CE012
              - CE015
              - CE016
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与目标画像
        blocks:
          - type: paragraph
            body: >-
              Cognite 面向资产密集型工业垂直领域的企业客户，主要包括油气、能源、电力与公用事业、化工、制药和离散制造。
              这些组织的商业采购权通常掌握在首席数字官、运营技术副总裁和首席信息官等数字化转型高管手中，他们希望统一数据语境。
              一线用户包括可靠性工程师、工厂运营经理、维护技术员、供应链排程员和工业数据科学家。该商业模式服务于企业级设施， 其中 ERP 与运营 historian
              之间跨数据孤岛的延迟，会造成数百万美元的停机或产量损失。Cognite 依靠现场销售和技术解决方案架构师， 配合 Deloitte、Radix、L&T Technology Services、RoviSys
              等企业集成伙伴，以及 FourKites 等供应链网络伙伴，先进入大型工业园区，再推动部门扩张。
            claimRefs:
