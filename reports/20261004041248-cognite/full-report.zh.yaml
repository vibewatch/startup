      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              历史融资不能证明当前流动性。Tracxn 报告总融资 $225 million，而 CNBC 2026 年资料列为 $300 million；这两个不一致的数字需要对照资本化表核对 [CI013, CI014]。
              有记录的 2021 年 $150 million 投资将 Cognite 估值推至 $1.6 billion，但不能把这笔历史融资视为 2026 年仍可用的现金 [CI015]。
              现有来源均未披露当前现金、运营现金消耗、现金 runway、债务或授信、契约风险，或下一轮融资的触发条件。财务结论因此是混合的：
              已披露的收入和预订指标支持商业势头，但收入质量、利润率韧性和资本自给能力仍未验证。投资判断应以经审计报表、客户群经济性、 合同数据和当前流动性桥接为前提。
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI014
              - CI015
