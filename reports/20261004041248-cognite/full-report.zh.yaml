      - number: '5.2'
        title: 架构与部署模式
        blocks:
          - type: paragraph
            body: >-
              文档中的架构将数据模型分为源、企业和解决方案三层。源层保留系统数据，企业层整合并验证共享语境，解决方案视图服务于特定应用， 通常不会重复存储数据。Cognite 描述了一种由
              spaces、containers、views、nodes、edges 和共享标识符构成的属性图模型。默认使用直接关系， edges 则保留给关系元数据或高基数多对多链接；文档称列表中当前最多支持 2,000
              条外发直接关系。AWS 补充了部署视角： 专用提取器和原生 AWS 连接器接入工业数据源，质量检查与实体匹配构建知识图谱，再由应用或 AWS 服务消费结果。Cognite 建议通过 Toolkit， 以 Git
              配置即代码的方式跨开发、预发布和生产环境部署。架构具体且可组合，但现有证据没有独立的吞吐量、延迟或可用性测量。
            claimRefs:
