            body: >-
              Cognite 的客户采用正从基础时间序列语境化，大幅扩展到智能体 AI 和工作流执行。2025 年 ARR 预订同比增长 36%，客户部署的月活用户增长 26%。
              运营用量也明显加深：覆盖客户群的语境化知识图谱超过 80 trillion 个时间序列数据点，年增 48%；客户数据建模实例翻倍，工业 AI token 用量近增 500%。 Atlas AI 采用率同比增长近
