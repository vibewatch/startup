  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与工业工作流
        blocks:
          - type: paragraph
            body: >-
              Cognite 提供的是平台，而不是单一的点应用。其文档把产品分为 Flows 与现场运营、知识图谱与数据集成、生产部署和开发者工具。 AWS 将 Cognite Data Fusion 描述为统一 IT、OT
              和工程数据的层，并通过 Canvas、AI Copilot、InField、InRobot、Maintain 和 Charts 等应用呈现语境化信息。 Cognite 2026 年 5 月的发布公告把 Flows
              放在这层基础之上，作为一线用户和开发者组装运营工作流的行动层。公告还列出 B. Braun 和 Idemitsu Kosan
              为用户，但采用率和速度说法均来自公司，既没有客户数分母，也没有独立基准。产品逻辑是连贯的：整合分散的工业数据，把它放进知识图谱中语境化，
              缩短从数据到运营人员行动的路径。尽调要问的是，这套逻辑能否在存量客户中稳定转化为生产结果。
            claimRefs:
              - CE001
              - CE007
              - CE009
              - CE013
              - CE014
