      - number: '1.2'
        title: 资本化轨迹、运营规模与财务表现
        blocks:
          - type: paragraph
            body: >-
              2021 年 5 月，成长型股权投资公司 TCV 领投 $150 million 融资，Cognite 投后估值达到 $1.6 billion，跻身独角兽。 这轮融资补充了 Accel
              早期的机构风投，以及工业母公司 Aker 提供的多数资本。到 FY2025，公司运营规模大幅扩大； 管理层宣布截至 FY2025 的年收入超过 $170 million，ARR 预订同比增长
              36%，新客户群体的净收入留存率为 150%。 全球员工人数同比增长 21%，超过 800 人，分布在美洲、EMEA、亚洲和日本。尽管运营势头强劲且有公司自报指标， 第三方数据库对历史成立日期说法不一，且有关
              $3.1 billion 后期估值的说法未经证实；私营状态下，主要经审计资产负债表和股权结构表分配仍未披露。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
