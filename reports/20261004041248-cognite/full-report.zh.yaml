      - number: '4.2'
        title: 定价、签约与 GTM 经济性
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，这是一种销售辅助的企业模式，而不是自助漏斗。Cognite 官网引导潜在客户申请现场演示；RFP.wiki 则称 Cognite Data Fusion 通过定制订阅订单购买，且不公布标准单价
              [CI008, CI006]。同一比较指出，专业服务、Success Track 和 Development Accelerators 与核心订阅分开下单
              [CI007]。这种打包可能形成多条收入流，但公开来源没有披露其构成、折扣、合同期限或实际价格。 客户基础设施和服务成本还可能包括本地提取器、身份集成和 OT 连接
              [CI009]。因此，仅凭现有材料无法评估目录价到实际价的转化、CAC、销售周期或回本期。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: 单位经济性与成本基础可见度
        blocks:
          - type: paragraph
            body: >-
              公开记录提供了增长代理指标，却没有完整的单位经济模型。新客户 NRR 为 150%，说明该群体扩张强劲，但没有涵盖老客户群、logo 流失、收缩， 也缺少推广到全体客户所需的分母 [CI003]。2025
              年员工人数增长 21%，超过 800 人；这体现规模和潜在运营成本，并非消耗率的直接衡量 [CI012]。 RFP.wiki 称 Cognite 没有公开 EBITDA 披露，其审查无法验证盈利能力和消耗
              [CI010]。公开证据还缺少合并毛利率、软件与服务毛利率、 云托管成本、实施利用率、CAC 和回本期。结果是收入增长叙事可信，但信息不足以检验经营杠杆。
            claimRefs:
              - CI003
              - CI010
              - CI012
