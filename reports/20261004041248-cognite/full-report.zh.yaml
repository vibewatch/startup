            body: >-
              Cognite 的商业轨迹显示出明显的交易对手和客户集中风险。历史记录显示，公司与大型油气运营商存在锚定部署关系，尤其是 Aker BP； 在 Saudi Aramco Overseas 于 2022
              年收购股权前，Aker BP 曾是 Cognite 的基础客户。为扩大复杂制造工作流的交付，Cognite 高度依赖 Deloitte、 Radix、L&T Technology Services 和
              RoviSys 等系统集成商与解决方案伙伴。如果战略系统集成商降低 Cognite 架构的优先级，
              或关键能源锚定账户放慢扩张，净收入留存和客户获取速度都会明显受压。持续监测伙伴赋能带宽和大客户续约计划，是必要的尽调工作。
