chapter:
  number: 6
  title: "Customers"
  summary: "Cognite serves heavy asset-intensive enterprise accounts across energy, process manufacturing, power/renewables, and pharmaceuticals, evidenced by production deployments at Idemitsu Kosan and B. Braun. The company reports 150% NRR on newer customer cohorts and 36% ARR booking expansion alongside rapid Atlas AI and Flows workflow adoption; however, total enterprise client counts, full-base net retention, and customer concentration ratios remain undisclosed."
sections:
  - id: "customer-segmentation-and-targeting"
    title: "Customer Base Segmentation and Target Personas"
    body: "Cognite targets enterprise accounts within asset-intensive industrial verticals, primarily oil and gas, energy, power and utilities, chemicals, pharmaceuticals, and discrete manufacturing. Within these organizations, commercial purchasing authority typically sits with executive digital transformation leaders such as Chief Digital Officers, Vice Presidents of Operational Technology, and Chief Information Officers seeking unified data contextualization. Frontline users include reliability engineers, plant operations managers, maintenance technicians, supply chain schedulers, and industrial data scientists. The commercial model addresses enterprise-scale facilities where cross-data-silo latency between enterprise resource planning systems and operational historian systems creates multi-million dollar downtime or yield penalties. Cognite's GTM motion relies on field sales reps paired with technical solution architects, enterprise integration partners such as Deloitte, Radix, L&T Technology Services, and RoviSys, and supply chain network partners like FourKites to land within major industrial complexes before driving departmental expansion."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-consumption"
    title: "Adoption Trajectory, Consumption Scaling, and AI Workflows"
    body: "Cognite's customer adoption trajectory exhibits heavy expansion from foundational time-series contextualization toward active agentic AI and workflow execution. In 2025, Cognite achieved 36% year-over-year ARR bookings growth, while monthly active users across customer deployments expanded by 26%. Operational consumption deepened dramatically: the contextualized knowledge graph spanning Cognite's customer base exceeded 80 trillion time-series data points, reflecting a 48% annual increase, while customer data modeling instances doubled and industrial AI token consumption expanded by nearly 500%. Adoption of Atlas AI expanded nearly 700% year-over-year, reaching 59% of overall customer accounts weighted by ARR. Furthermore, by mid-2026, more than 30% of Cognite's customer base and strategic integration partners had been enabled on Cognite Flows to execute root cause analysis and non-conformance workflows, demonstrating rapid uptake of new operational experience modules."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-production-proof"
    title: "Named Customer Proof, Deployment Scale, and Value Delivery"
    body: "Publicly referenced enterprise accounts validate that Cognite Data Fusion and Cognite Flows operate in live mission-critical production environments rather than stalled proof-of-concept sandboxes. German medical technology multinational B. Braun utilizes Cognite Flows to establish real-time asset transparency and operational intelligence across manufacturing operations. In Japan, refining and petrochemical enterprise Idemitsu Kosan deployed Cognite Flows to systematically resolve asset non-conformance incidents and accelerate engineering root cause analysis. Norwegian exploration and production operator Aker BP has integrated Cognite at the core of its operational model, scaling hundreds of AI agents across offshore assets. Joint deployments with engineering integration partners such as Radix, L&T Technology Services, and RoviSys demonstrate third-party delivery repeatability. However, outside selected marquee references, individual account ARR contributions and contract durations remain confidential."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Dynamics, Account Durability, and Concentration Gaps"
    body: "Cognite reports 150% Net Revenue Retention (NRR) for newer customer cohorts, signaling substantial net expansion once industrial accounts integrate operational data models and activate high-value analytics. Enterprise expansion is structured around a Moonshot commitment to deliver $100 billion in cumulative customer value by 2035, supported by formal Value Realisation Workshops, dedicated steering committees, and quota-carrying commercial sales teams. Nevertheless, severe disclosure limitations persist. Cognite reports cohort-specific NRR for newer customers rather than a blended net retention rate across its entire historical customer base, masking potential attrition among legacy or un-expanded accounts. Furthermore, total paying enterprise client counts, logo churn rates, gross revenue retention (GRR), and revenue concentration among top anchor clients—such as founding affiliate Aker BP—are completely omitted from audited disclosures, leaving account vulnerability unquantified."
    claimRefs:
      - "CU006"
      - "CU014"
      - "CU015"
      - "CU016"
