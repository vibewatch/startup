callouts:
  - calloutType: "insight"
    title: "High Switching Costs Anchored in 80 Trillion Contextualized Data Points"
    body: "Cognite's customer stickiness is fundamentally driven by deep operational data integration rather than basic dashboarding. With over 80 trillion time-series data points structured within customer knowledge graphs and 59% of ARR operationalized on Atlas AI, replacing Cognite would require industrial enterprises to undertake multi-year re-architectures of complex OT-IT contextualization pipelines."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU014"
  - calloutType: "risk"
    title: "Selective Cohort Retention Disclosure Masks Base Concentration"
    body: "While a 150% NRR figure for newer customers demonstrates robust initial expansion, the omission of blended full-base NRR, gross churn, and total client count represents a material diligence gap. Given Cognite's historical origins with Aker BP, potential revenue concentration among anchor accounts remains unquantified."
    claimRefs:
      - "CU006"
      - "CU014"
      - "CU016"
