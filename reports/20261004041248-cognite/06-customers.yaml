figures:
  - id: "FU001"
    title: "Cognite enterprise customer adoption and expansion lifecycle"
    type: "journey-map"
    summary: "Multi-stage customer expansion loop illustrating progression from initial OT/IT data ingestion to autonomous multi-plant agentic workflow operations."
    data:
      items:
        - label: "Stage 1: Initial Discovery and Connector Ingestion"
          stage: "Initial Evaluation & Data Integration"
          title: "OT/IT Data Connector Ingestion"
          description: "Customer ingests fragmented historian, SCADA, sensor, and ERP data into Cognite Data Fusion using pre-built industrial connectors."
          touchpoints:
            - "Executive sponsorship from Chief Digital Officer"
            - "Deployment of productized connectors to historians and ERPs"
            - "Initial Value Realisation Workshop to establish ROI metrics"
        - label: "Stage 2: Semantic Data Modeling and Contextualization"
          stage: "Contextualization & Data Modeling"
          title: "Industrial Knowledge Graph Expansion"
          description: "Data is contextualized into semantic data models, connecting physical equipment tags to 3D models and maintenance work orders."
          touchpoints:
            - "Systems integrator engagement via Radix, Deloitte, or L&T"
            - "Doubling of customer data modeling instances"
            - "Contextualization of millions of time-series data streams"
        - label: "Stage 3: Advanced AI Analytics and Atlas AI Enablement"
          stage: "Application & Agentic Workflow Activation"
          title: "Atlas AI and Cognite Flows Enablement"
          description: "Operational teams deploy generative and agentic workflows for root cause analysis, non-conformance tracking, and supply chain visibility."
          touchpoints:
            - "Adoption of Atlas AI across 59% of customer ARR"
            - "Cognite Flows enablement across >30% of customer base"
            - "Deployment of frontline role-based agent applications"
        - label: "Stage 4: Automated Root Cause and Workflow Orchestration"
          stage: "Workflow Acceleration"
          title: "Cognite Flows Execution"
          description: "Frontline engineers and plant operators automate routine non-conformance analysis and asset maintenance reviews."
          touchpoints:
            - "Deployment at Idemitsu Kosan and B. Braun"
            - "Rapid 100x acceleration in operational workflow creation"
            - "Frontline digital experience consolidation"
        - label: "Stage 5: Supply Chain and Cross-Facility Resilience"
          stage: "Supply Chain Integration"
          title: "Integrated Supply Chain Optimization"
          description: "Integration of inbound logistics telemetry and FourKites visibility directly into factory floor scheduling."
          touchpoints:
            - "FourKites real-time transit tracking integration"
            - "Deloitte operational resilience advisory"
            - "Dynamic constraint evaluation across production lines"
        - label: "Stage 6: Multi-Site Enterprise Standard and Scaling"
          stage: "Enterprise Scaling & Net Expansion"
          title: "Multi-Site Enterprise Standard"
          description: "Full enterprise roll-out across global fleet of facilities, driving strong net revenue retention and embedded operational reliance."
          touchpoints:
            - "Executive steering committee governance"
            - "Cross-plant deployment of hundreds of industrial AI agents"
            - "Expansion into integrated supply chain operations with FourKites"
