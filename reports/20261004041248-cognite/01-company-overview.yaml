company:
  name: "Cognite"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Cognite is an industrial AI and data software enterprise founded in Norway that established its global headquarters in Arizona. Having achieved unicorn status in 2021 via a $150 million TCV-led investment, the company scaled to over $170 million in annual revenue ending fiscal year 2025 behind Cognite Data Fusion, Atlas AI, and Cognite Flows while retaining material disclosure gaps around private ownership, consolidated ARR, and post-2021 valuation benchmarks."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Executive Leadership, and Governance Architecture"
    body: "Cognite operates as a global software-as-a-service provider delivering industrial data operations and generative artificial intelligence capabilities to asset-intensive sectors including energy, manufacturing, and utilities. Originally founded in Oslo, Norway, the company established its global corporate headquarters in Arizona while maintaining expanding development hubs in Norway and India alongside commercial branch offices in Houston, Tokyo, and Abu Dhabi. Executive leadership is directed by Chairman and Chief Executive Officer Girish Rishi, who succeeded co-founder and former Chief Executive Officer Dr. John Markus Lervik. Governance is anchored by industrial holding group Aker as the controlling majority stakeholder alongside growth equity partner TCV, whose general partner Jake Reynolds holds a seat on Cognite's board of directors following their landmark 2021 funding round. In 2025, Cognite undertook an executive management scale-up by recruiting Chirayu Shah as Chief Product Officer, Sandy Joung as Chief Marketing Officer, and Bill Owen as Chief Services Officer to manage global expansion across core platform and AI agent offerings."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
      - "TO003"
    figureRefs: []
  - id: "capitalization-scale"
    title: "Capitalization Trajectory, Operating Scale, and Financial Performance"
    body: "Cognite attained unicorn status in May 2021 after securing a $150 million funding round led by growth equity firm TCV, valuing the enterprise at $1.6 billion post-money. This financing supplemented earlier institutional venture backing from Accel and majority capitalization from industrial parent Aker. Operating scale expanded substantially through fiscal year 2025, with management announcing that Cognite surpassed $170 million in annual revenue ending FY2025, accompanied by 36% year-over-year expansion in annual recurring revenue bookings and a net revenue retention rate of 150% among newer customer cohorts. Global associate headcount increased by 21% year over year to exceed 800 employees across the Americas, EMEA, Asia, and Japan. Despite strong operational momentum and self-reported performance indicators, third-party databases report conflicting historical launch dates and uncorroborated later-stage valuations reaching $3.1 billion, while primary audited balance sheets and equity cap-table allocations remain undisclosed under private ownership."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "product-evolution"
    title: "Product Evolution, Industrial AI Deployment, and Milestone Trajectory"
    body: "Cognite's technology platform centers on Cognite Data Fusion, an industrial data operations and contextualization engine deployed across enterprise accounts including bp, Mitsubishi, and Saudi Aramco. The company accelerated its product roadmap through quarterly enhancements, culminating in the launch of Cognite Atlas AI, an industrial agent workbench, and Cognite Flows, an action layer integrating operational workflows and agentic AI. Customer adoption metrics reported for fiscal year 2025 show the industrial knowledge graph surpassing 80 trillion time-series data points in context, representing 48% growth, while AI token usage increased nearly 500% and monthly active users grew 26%. However, customer proofs remain concentrated in heavy industry, and customer count disclosures remain largely private. Cognite committed to a Moonshot objective targeting $100 billion in cumulative customer business value by 2035, though audited validation of financial return metrics across the complete customer base represents an ongoing diligence gap."
    claimRefs:
      - "CO001"
      - "CO009"
      - "CO010"
      - "CO016"
    tableRefs: []
    figureRefs: []
