    title: "Commercial Opacity Poses Total Cost of Ownership Uncertainty"
    body: "Cognite does not publish standard self-serve pricing tiers or consumption rate cards on hyperscaler marketplaces. Software licenses are coupled with separate professional services, Success Track engagements, and deployment accelerators, creating potential budget overruns for enterprise procurement teams if initial implementation scope expands."
    claimRefs:
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "System Integrator Alliances Are Critical Execution Determinants"
    body: "Because Cognite Data Fusion requires bridging heterogeneous OT field hardware and enterprise IT software, Cognite's expansion into pharmaceuticals, manufacturing, and supply chains relies heavily on partners like Deloitte and Radix. Maintaining partner enablement is as critical to scaling ARR as core product engineering."
