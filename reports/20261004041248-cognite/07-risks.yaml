chapter:
  number: 7
  title: "Risks"
  summary: "Cognite faces material operational, customer concentration, pricing transparency, and regulatory governance exposures across its asset-heavy industrial customer base. While the company demonstrates enterprise traction with 150% NRR for newer customers and formal GDPR data processing frameworks, significant dependencies on custom enterprise contracting, complex OT-IT integration scopes, and anchor energy counterparties introduce execution and commercial vulnerabilities."
sections:
  - id: "regulatory-legal-risk"
    title: "Regulatory and Legal Compliance Framework"
    body: "Cognite operates as a data processor for industrial enterprises across North America, Europe, and Asia, necessitating formal compliance with regional data protection standards including the European Union General Data Protection Regulation (GDPR). The company's standard Data Processing Agreement establishes strict operational boundaries, requiring notification of personal data breaches to data controllers without undue delay and no later than 72 hours following discovery. Furthermore, Cognite contractually warrants that data exports and automated migration tools remain accessible during a 30-day transitional period following any potential insolvency event before permanent erasure. However, because Cognite processes operational telemetry and personal data across multinational cloud and hybrid on-premises environments, cross-border data transfer restrictions and foreign authority subpoena access represent persistent compliance friction points that require active governance."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
    tableRefs:
      - "TR001"
  - id: "operational-quality-security-risk"
    title: "Operational Complexity and Integration Friction"
    body: "Industrial AI deployment across heavy-asset manufacturing and energy facilities exposes Cognite to severe integration and operational risks. Frontline adoption of Cognite Data Fusion and Cognite Flows requires contextualizing disparate enterprise resource planning systems, warehouse management systems, and operational technology (OT) historians. Third-party benchmarks indicate that while Cognite excels at contextual data modeling and enterprise multi-site integration, it lacks native protocol gateway depth and relies heavily on customer-side or partner-led integration tooling. Commercial evaluations emphasize that Cognite Data Fusion is sold through custom enterprise subscription orders rather than transparent self-serve tiers, with professional services, Success Track, and Development Accelerators billed separately. Incomplete visibility into consumption thresholds and integration labor creates total cost of ownership volatility for industrial buyers."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-customer-dependency-risk"
    title: "Partner Dependence and Customer Concentration"
    body: "Cognite's commercial trajectory demonstrates significant counterparty and customer concentration risk. Historical company records show anchor deployment relationships with major oil and gas operators, notably Aker BP, which served as Cognite's foundational customer prior to Saudi Aramco Overseas acquiring an equity stake in 2022. To scale delivery across complex manufacturing workflows, Cognite relies heavily on system integrators and solution partners such as Deloitte, Radix, L&T Technology Services, and RoviSys. If strategic systems integrators deprioritize Cognite architectures or key anchor energy accounts decelerate expansion, net revenue retention and customer acquisition velocity would suffer material compression. Monitoring partner enablement bandwidth and large-account renewal schedules remains an essential diligence requirement."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR003"
