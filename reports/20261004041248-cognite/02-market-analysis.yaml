callouts:
  - calloutType: "insight"
    title: "Market Transition Toward Agentic Operational AI"
    body: "The industrial data market is undergoing a structural paradigm shift from legacy IoT telemetry ingestion to agentic operational execution [CM005]. As industrial operators face escalating operational complexity and workforce retirements, demand has concentrated on contextualized knowledge graphs that allow autonomous agents to reason across engineering diagrams, maintenance logs, and real-time sensor streams [CM002]."
    claimRefs:
      - "CM002"
      - "CM005"
  - calloutType: "risk"
    title: "Procurement Opacity and Service Dependency Inhibit Mid-Market Reach"
    body: "Cognite's reliance on custom enterprise order forms, undisclosed list pricing, and extensive implementation accelerators creates a high commercial barrier to entry [CM014]. Without transparent self-serve tiers, sales cycles remain prolonged and heavily tied to top-tier enterprise accounts, leaving the broader mid-market underserved and susceptible to specialized point solutions [CM014]."
    claimRefs:
      - "CM014"
