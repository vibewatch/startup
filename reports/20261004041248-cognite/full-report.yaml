              - CR005
              - CR009
      - number: '7.3'
        title: Partner Dependence and Customer Concentration
        blocks:
          - type: paragraph
            body: >-
              Cognite's commercial trajectory demonstrates significant counterparty and customer concentration risk.
              Historical company records show anchor deployment relationships with major oil and gas operators, notably
              Aker BP, which served as Cognite's foundational customer prior to Saudi Aramco Overseas acquiring an
              equity stake in 2022. To scale delivery across complex manufacturing workflows, Cognite relies heavily on
              system integrators and solution partners such as Deloitte, Radix, L&T Technology Services, and RoviSys. If
              strategic systems integrators deprioritize Cognite architectures or key anchor energy accounts decelerate
              expansion, net revenue retention and customer acquisition velocity would suffer material compression.
              Monitoring partner enablement bandwidth and large-account renewal schedules remains an essential diligence
              requirement.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial Opacity Poses Total Cost of Ownership Uncertainty
            body: >-
              Cognite does not publish standard self-serve pricing tiers or consumption rate cards on hyperscaler
              marketplaces. Software licenses are coupled with separate professional services, Success Track
              engagements, and deployment accelerators, creating potential budget overruns for enterprise procurement
              teams if initial implementation scope expands.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: System Integrator Alliances Are Critical Execution Determinants
            body: >-
              Because Cognite Data Fusion requires bridging heterogeneous OT field hardware and enterprise IT software,
              Cognite's expansion into pharmaceuticals, manufacturing, and supply chains relies heavily on partners like
              Deloitte and Radix. Maintaining partner enablement is as critical to scaling ARR as core product
              engineering.
            calloutType: insight
            claimRefs:
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and M&A Transaction Context
        blocks:
          - type: paragraph
            body: >-
              Cognite's investment thesis has transitioned from an independent SaaS unicorn expansion story to an
              acquired industrial intelligence powerhouse. On June 30, 2026, Schneider Electric announced an agreement
              to acquire 100% of Cognite Holding B.V. in an all-cash transaction valued at $3.1 billion. The acquisition
              price reflects an 18.2x multiple on Cognite's 2025 revenue, which exceeded $170 million. Cognite's core
              strength lies in its unified industrial data model within Cognite Data Fusion (CDF) and its agentic AI
              layer Atlas AI, which together bridge complex operational technology (OT) and enterprise IT data across
              heavy-asset industries. Under Schneider Electric's ownership, Cognite is planned to be integrated with
              AVEVA and consolidated within Schneider Electric's Industrial Automation business, directly combining
              industrial data contextualization with AVEVA's CONNECT platform across global industrial sites.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV013
      - number: '8.2'
        title: Financing History and Valuation Multiple Discipline
        blocks:
          - type: paragraph
            body: >-
              Prior to the $3.1 billion acquisition agreement, Cognite raised approximately $225 million across three
              primary private financing rounds. In October 2020, Accel led a $75 million Series A round that valued the
              company at $550 million. In May 2021, growth equity firm TCV led a $150 million Series B investment that
              propelled Cognite to unicorn status at a post-money valuation of $1.6 billion. A subsequent secondary
              transaction in February 2022 brought in Saudi Aramco at a $1.5 billion valuation mark. While secondary and
              pre-IPO marketplaces such as Forge Global tracked limited marketplace trading activity without active
              pricing quotes, third-party market tracker Latka and aggregator Multiples both evaluate the $3.1 billion
              acquisition price as an aggressive 18.2x multiple on $170 million of historical ARR/revenue. This premium
              reflects strategic scarcity value in industrial GenAI and agentic workflow orchestration rather than a
              standardized software trading multiple.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario Analysis, Execution Risks, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Cognite requires examining outcomes under closed transaction integration, extended regulatory
              delays, or a broken deal scenario. In the base case, the all-cash acquisition closes in the coming
              quarters following customary regulatory reviews, delivering liquidity at $3.1 billion and positioning
              Cognite within AVEVA to cross-sell into Schneider Electric's global customer base. The bull case assumes
              accelerated enterprise penetration where agentic tools like Cognite Flows and Atlas AI drive ARR expansion
              well beyond 36% bookings growth, unlocking deeper industrial automation synergies. Conversely, the bear
              scenario examines antitrust or cross-border regulatory scrutiny that could delay closing or force
              concessions, leaving Cognite exposed to high cash burn and standalone valuation reset toward standalone
              private software multiples of 8x to 10x ARR.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision Implication of the Schneider Electric Acquisition
            body: >-
              With Schneider Electric entering a definitive agreement to acquire 100% of Cognite Holding B.V. for $3.1
              billion in cash, private market investors should view the asset through the lens of transaction completion
              and post-merger integration rather than speculative venture fundraising. At an 18.2x revenue multiple,
              Schneider Electric is paying a full strategic price for Cognite's industrial knowledge graph and agentic
              AI tools. We maintain a TRACK recommendation pending closing confirmation and regulatory clearance.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
          - type: callout
            title: Downside Risks in Case of Regulatory Closing Delays
            body: >-
              Although the all-cash acquisition agreement resolves standalone liquidity concerns, the transaction
              remains subject to customary closing conditions and regulatory approvals across jurisdictions. If
              unexpected antitrust scrutiny or foreign investment reviews stall closing, Cognite could face operational
              disruption and valuation multiple compression toward private software comps.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
