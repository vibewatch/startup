      - number: '1.2'
        title: Capitalization Trajectory, Operating Scale, and Financial Performance
        blocks:
          - type: paragraph
            body: >-
              Cognite attained unicorn status in May 2021 after securing a $150 million funding round led by growth
              equity firm TCV, valuing the enterprise at $1.6 billion post-money. This financing supplemented earlier
              institutional venture backing from Accel and majority capitalization from industrial parent Aker.
              Operating scale expanded substantially through fiscal year 2025, with management announcing that Cognite
              surpassed $170 million in annual revenue ending FY2025, accompanied by 36% year-over-year expansion in
              annual recurring revenue bookings and a net revenue retention rate of 150% among newer customer cohorts.
              Global associate headcount increased by 21% year over year to exceed 800 employees across the Americas,
              EMEA, Asia, and Japan. Despite strong operational momentum and self-reported performance indicators,
              third-party databases report conflicting historical launch dates and uncorroborated later-stage valuations
              reaching $3.1 billion, while primary audited balance sheets and equity cap-table allocations remain
              undisclosed under private ownership.
            claimRefs:
