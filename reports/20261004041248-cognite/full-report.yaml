              - CU014
      - number: '6.2'
        title: Adoption Trajectory, Consumption Scaling, and AI Workflows
        blocks:
          - type: paragraph
            body: >-
              Cognite's customer adoption trajectory exhibits heavy expansion from foundational time-series
              contextualization toward active agentic AI and workflow execution. In 2025, Cognite achieved 36%
              year-over-year ARR bookings growth, while monthly active users across customer deployments expanded by
              26%. Operational consumption deepened dramatically: the contextualized knowledge graph spanning Cognite's
              customer base exceeded 80 trillion time-series data points, reflecting a 48% annual increase, while
              customer data modeling instances doubled and industrial AI token consumption expanded by nearly 500%.
              Adoption of Atlas AI expanded nearly 700% year-over-year, reaching 59% of overall customer accounts
              weighted by ARR. Furthermore, by mid-2026, more than 30% of Cognite's customer base and strategic
              integration partners had been enabled on Cognite Flows to execute root cause analysis and non-conformance
              workflows, demonstrating rapid uptake of new operational experience modules.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
