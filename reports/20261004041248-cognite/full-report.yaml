      - number: '5.3'
        title: Maturity, controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The Q3 2026 update shows uneven maturity across the portfolio rather than a uniformly production-ready
              stack. It labels some search, 3D, InField, Canvas, and custom-app capabilities as production, while
              Industrial MCP and the Agent Builder CLI are previews and Atlas AI Sandboxes remain private preview. That
              cadence is evidence of active delivery, but it also creates versioning, support, and change-management
              exposure for customers building on newer AI surfaces. The data-model documentation specifies separate
              schema and instance permissions, facility-level instance spaces, indexing, and controlled deployment. AWS
              describes a reference design using IAM, KMS, Secrets Manager, Shield, CloudWatch, and CloudTrail, but
              those controls characterize an AWS solution pattern rather than a Cognite-wide certification or audited
              control conclusion. A company-authored engineering job repost further indicates investment in
              multi-tenant, multi-cloud orchestration, observability, SLOs, and incident response; it is a hiring
              signal, not proof that stated reliability targets are met. Underwriting should therefore require
              service-level history, incident records, penetration-test summaries, certification scope, and
              workload-level cost and performance data.
            claimRefs:
              - CE004
              - CE010
              - CE011
              - CE012
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Personas
        blocks:
          - type: paragraph
            body: >-
              Cognite targets enterprise accounts within asset-intensive industrial verticals, primarily oil and gas,
              energy, power and utilities, chemicals, pharmaceuticals, and discrete manufacturing. Within these
              organizations, commercial purchasing authority typically sits with executive digital transformation
              leaders such as Chief Digital Officers, Vice Presidents of Operational Technology, and Chief Information
              Officers seeking unified data contextualization. Frontline users include reliability engineers, plant
              operations managers, maintenance technicians, supply chain schedulers, and industrial data scientists. The
              commercial model addresses enterprise-scale facilities where cross-data-silo latency between enterprise
              resource planning systems and operational historian systems creates multi-million dollar downtime or yield
              penalties. Cognite's GTM motion relies on field sales reps paired with technical solution architects,
              enterprise integration partners such as Deloitte, Radix, L&T Technology Services, and RoviSys, and supply
              chain network partners like FourKites to land within major industrial complexes before driving
              departmental expansion.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
