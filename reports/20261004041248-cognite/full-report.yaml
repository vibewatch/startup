        - Sustained ARR growth re-accelerating above 50% YoY with operating margins rapidly expanding post-acquisition.
      - - 'Anti-Thesis: Transaction Closing'
        - >-
          The transaction remains subject to customary closing conditions including regulatory approvals across multiple
          jurisdictions.
        - Unconditional regulatory clearances received across all key antitrust jurisdictions without remedy demands.
    notes: >-
      Thesis drivers evaluated against reported fiscal 2025 financial disclosures and announced strategic acquisition
      framework.
