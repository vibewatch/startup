        title: Exhibits
        blocks:
          - type: callout
            title: Strong Industrial Pedigree and Core Platform Adoption
            body: >-
              Cognite combines tier-one growth backing from TCV with operational access to major industrial accounts
              like Saudi Aramco, bp, and Mitsubishi. Its flagship Cognite Data Fusion contextualization engine and Atlas
              AI achieve high adoption momentum, with 59% of customer ARR operationalizing Atlas AI.
            calloutType: strength
