      - number: '4.2'
        title: Pricing, Contracting, and GTM Economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a sales-assisted enterprise motion rather than a self-serve funnel. Cognite's
              own site directs prospects to request a live demonstration, while RFP.wiki reports that Cognite Data
              Fusion is purchased through custom subscription order forms and does not publish standard unit prices
              [CI008, CI006]. The same comparison says professional services, Success Track, and Development
              Accelerators are ordered separately from the core subscription [CI007]. That packaging can create multiple
              revenue streams, but public sources do not disclose their mix, discounts, contract duration, or realized
              price. Customer infrastructure and service costs can also include on-premises extractors, identity
              integration, and OT connectivity [CI009]. Consequently, list-to-realized pricing, CAC, sales-cycle length,
              and payback cannot be underwritten from the available material.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Unit Economics and Cost-Base Visibility
        blocks:
          - type: paragraph
            body: >-
              The public record provides growth proxies but not a complete unit-economic model. Newer-customer NRR of
              150% suggests strong expansion in that cohort, yet it omits legacy cohorts, logo churn, contraction, and
              the denominator needed to generalize across the customer base [CI003]. Headcount grew 21% in 2025 to more
              than 800 employees, a scale indicator and potential operating-cost signal rather than a direct measure of
              burn [CI012]. RFP.wiki states that Cognite has no public EBITDA disclosure and that profitability and burn
              could not be verified in its review [CI010]. Public evidence also lacks consolidated gross margin,
              software versus services margin, cloud hosting cost, implementation utilization, CAC, and payback. The
              result is a credible top-line growth narrative without enough information to test operating leverage.
            claimRefs:
              - CI003
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI010
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Capital history does not establish current liquidity. Tracxn reports $225 million of total funding, while
              CNBC's 2026 profile lists $300 million; these incompatible totals require reconciliation against the
              capitalization table [CI013, CI014]. A documented $150 million 2021 investment valued Cognite at $1.6
              billion, but that historical financing cannot be treated as cash still available in 2026 [CI015]. No
              assigned source discloses current cash, operating cash burn, runway, debt or credit facilities, covenant
              exposure, or the trigger for another financing. The financial verdict is therefore mixed: disclosed
              revenue and bookings indicators support commercial momentum, but revenue quality, margin durability, and
              capital self-sufficiency remain unverified. Underwriting should remain conditional on audited statements,
              cohort economics, contract data, and a current liquidity bridge.
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
