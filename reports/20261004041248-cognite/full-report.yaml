      - number: '1.3'
        title: Product Evolution, Industrial AI Deployment, and Milestone Trajectory
        blocks:
          - type: paragraph
            body: >-
              Cognite's technology platform centers on Cognite Data Fusion, an industrial data operations and
              contextualization engine deployed across enterprise accounts including bp, Mitsubishi, and Saudi Aramco.
              The company accelerated its product roadmap through quarterly enhancements, culminating in the launch of
              Cognite Atlas AI, an industrial agent workbench, and Cognite Flows, an action layer integrating
              operational workflows and agentic AI. Customer adoption metrics reported for fiscal year 2025 show the
              industrial knowledge graph surpassing 80 trillion time-series data points in context, representing 48%
              growth, while AI token usage increased nearly 500% and monthly active users grew 26%. However, customer
              proofs remain concentrated in heavy industry, and customer count disclosures remain largely private.
              Cognite committed to a Moonshot objective targeting $100 billion in cumulative customer business value by
              2035, though audited validation of financial return metrics across the complete customer base represents
              an ongoing diligence gap.
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO016
