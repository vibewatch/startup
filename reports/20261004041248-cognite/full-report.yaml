  - id: FM001
    title: Constrained Market Sizing Layers for Industrial DataOps and AI
    type: pyramid
    summary: >-
      Six-tier market sizing framework structuring macro industrial software spend down to Cognite's captured revenue
      footprint.
    data:
      items:
        - label: Macro Industrial Software Envelope (TAM Macro)
          detail: >-
            Global industrial digital transformation, plant automation, and OT software modernization across heavy asset
            sectors.
          valueNote: Broadest macro spending envelope spanning global OT and industrial automation investments.
        - label: Industrial Operational Software (TAM Segmented)
          detail: Plant operations, maintenance management, asset lifecycle software, and operational data systems.
          valueNote: Software systems directly touching production operations and industrial asset management.
        - label: Industrial Intelligence & DataOps (SAM Broad)
          detail: Cross-system data integration, industrial knowledge graphs, and hybrid operational AI platforms.
          valueNote: Specialized platforms bridging operational technology silos across multi-site enterprises.
        - label: Target Enterprise Contextualization (SAM Core)
          detail: Cloud-native industrial DataOps focused on complex energy, chemicals, power, and life sciences facilities.
          valueNote: Asset-intensive operations with thousands of telemetry streams requiring automated data modeling.
        - label: Near-Term Deployable Segment (SOM Pipeline)
          detail: Enterprise accounts actively transitioning from legacy IoT pilots to production agentic AI workflows.
          valueNote: Immediate addressable pipeline driven by Atlas AI and low-code industrial flows.
        - label: Captured Commercial Footprint (SOM Realized)
          detail: Cognite commercialized revenue base exceeding $170M annual revenue with 36% ARR bookings expansion.
          valueNote: Confirmed contracted recurring software revenue and enterprise customer footprint.
    approximationNotes: >-
      Upper tiers represent qualitative industry boundary layers; the realized SOM layer reflects confirmed fiscal 2025
      financial disclosures.
