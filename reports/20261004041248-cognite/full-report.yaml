chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Cognite operates as a global software-as-a-service provider delivering industrial data operations and
              generative artificial intelligence capabilities to asset-intensive sectors including energy,
              manufacturing, and utilities. Originally founded in Oslo, Norway, the company established its global
              corporate headquarters in Arizona while maintaining expanding development hubs in Norway and India
              alongside commercial branch offices in Houston, Tokyo, and Abu Dhabi. Executive leadership is directed by
              Chairman and Chief Executive Officer Girish Rishi, who succeeded co-founder and former Chief Executive
              Officer Dr. John Markus Lervik. Governance is anchored by industrial holding group Aker as the controlling
              majority stakeholder alongside growth equity partner TCV, whose general partner Jake Reynolds holds a seat
              on Cognite's board of directors following their landmark 2021 funding round. In 2025, Cognite undertook an
              executive management scale-up by recruiting Chirayu Shah as Chief Product Officer, Sandy Joung as Chief
              Marketing Officer, and Bill Owen as Chief Services Officer to manage global expansion across core platform
              and AI agent offerings.
            claimRefs:
              - CO001
