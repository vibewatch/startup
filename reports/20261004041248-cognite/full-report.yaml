              - CE013
              - CE014
              - CE016
      - number: '5.2'
        title: Architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The documented architecture separates source, enterprise, and solution data models. Source layers preserve
              system data, the enterprise layer integrates and validates shared context, and solution views serve
              application-specific needs without routinely duplicating data. Cognite describes a property-graph model
              built from spaces, containers, views, nodes, edges, and shared identifiers. Direct relations are the
              default, while edges are reserved for relationship metadata or very high-cardinality many-to-many links;
              the documentation notes a current limit of 2,000 outgoing direct relations in a list. AWS adds a
              deployment view: purpose-built extractors and native AWS connectors ingest industrial sources, quality
              checks and entity matching construct the knowledge graph, and applications or AWS services consume the
              result. Cognite recommends Git-based configuration-as-code deployment through Toolkit across development,
              staging, and production. This is a specific, composable architecture, although the assigned evidence does
              not provide independent throughput, latency, or availability measurements.
            claimRefs:
              - CE002
              - CE003
              - CE005
