  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Industry Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Cognite defines its primary addressable category within the industrial DataOps and operational
              intelligence software landscape, specifically targeting asset-intensive industries including energy,
              chemicals, power, utilities, and pharmaceuticals [CM001]. The platform's architectural core focuses on
              unifying unstructured, operational, and engineering data into contextualized knowledge graphs,
              distinguishing it from generic enterprise data lakes or horizontal cloud storage infrastructure [CM002].
              Adjacent market segments include historical time-series historians, specialized operational analytics
              engines, and enterprise AI orchestration suites [CM003]. Excluded from this boundary are
              transaction-oriented enterprise resource planning systems, edge hardware controllers, and generic business
              intelligence dashboards that lack domain-specific asset contextualization [CM004]. Cognite's deliberate
              boundary strategy positions Cognite Data Fusion and Atlas AI directly where asset owners seek to
              transition from passive descriptive telemetry toward autonomous agentic workflows [CM005].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Addressable Spending Layers
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for industrial DataOps and operational AI requires multi-tier sizing
              lenses rather than a single monolithic top-down projection [CM006]. The broadest lens encompasses global
              industrial software and enterprise operational technology modernization, representing a vast total
              addressable market spanning global energy and discrete manufacturing facilities [CM007]. Within this macro
              spend, the serviceable addressable market isolates industrial intelligence, contextualization platforms,
              and DataOps layers deployed by global asset operators to bridge information silos [CM008]. Cognite's
              serviceable obtainable market reflects late-stage growth enterprise deployments, evidenced by $170 million
              in 2025 revenue and an established footprint across heavy asset enterprises [CM009]. However,
              comprehensive third-party independent consensus regarding the precise dollar ceiling of pure-play
              industrial DataOps remains an evidence gap given overlapping definitions across analyst categories
              [CM010].
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyer Segmentation, Procurement Paths, and Commercial Friction
        blocks:
          - type: paragraph
            body: >-
              Enterprise buyer personas within asset-heavy organizations are divided across corporate IT leadership,
              operational technology heads, and plant engineering directors [CM011]. Digital transformation initiatives
              and enterprise industrial AI architectures are typically championed by Chief Digital Officers and Chief
              Information Officers seeking high-ROI operational use cases and centralized data governance [CM012]. In
              contrast, departmental plant managers and operations engineers prioritize uptime, process safety, and
              direct operational workflow enhancements, often relying on partner systems integrators for deployment
              execution [CM013]. Commercial friction remains significant due to enterprise subscription packaging;
              Cognite Data Fusion pricing requires custom quotes, master service agreements, and mandatory professional
              services or implementation accelerators, preventing transparent self-serve adoption and prolonging
              procurement cycles [CM014]. Furthermore, external category evaluations note that Cognite commands modest
              mindshare in broader AI data analysis rankings relative to general enterprise data management platforms
              [CM015].
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Transition Toward Agentic Operational AI
            body: >-
              The industrial data market is undergoing a structural paradigm shift from legacy IoT telemetry ingestion
              to agentic operational execution [CM005]. As industrial operators face escalating operational complexity
              and workforce retirements, demand has concentrated on contextualized knowledge graphs that allow
              autonomous agents to reason across engineering diagrams, maintenance logs, and real-time sensor streams
              [CM002].
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
          - type: callout
            title: Procurement Opacity and Service Dependency Inhibit Mid-Market Reach
            body: >-
              Cognite's reliance on custom enterprise order forms, undisclosed list pricing, and extensive
              implementation accelerators creates a high commercial barrier to entry [CM014]. Without transparent
              self-serve tiers, sales cycles remain prolonged and heavily tied to top-tier enterprise accounts, leaving
              the broader mid-market underserved and susceptible to specialized point solutions [CM014].
            calloutType: risk
            claimRefs:
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Structural Alternatives
        blocks:
          - type: paragraph
            body: >-
              Industrial DataOps represents an operational middleware layer designed to extract, contextualize, model,
              and govern disparate telemetry across operational technology (OT), enterprise information technology (IT),
              and engineering technology (ET). In this category, Cognite confronts four distinct competitive vectors:
              legacy industrial automation conglomerates, cloud-native point solutions, horizontal enterprise data
              fabrics, and in-house do-it-yourself (DIY) engineering builds. Established automation leaders like AVEVA,
              Siemens, and Rockwell Automation maintain deeply entrenched hardware footprints, proprietary supervisory
              control and data acquisition (SCADA) systems, and on-premises historians across global manufacturing
              sites. However, these legacy architectures frequently trap operational telemetry in proprietary protocols
              and vendor-locked silos, impeding cross-facility contextual analytics. Concurrently, cloud-native
              challengers including Litmus and Sight Machine target rapid shop-floor telemetry ingestion, yet often lack
              multi-site enterprise knowledge graph modeling capabilities. Meanwhile, generic enterprise hyperscalers
              and horizontal data platforms lack native industrial protocol extractors and contextual ISA-95 asset
              hierarchy models. Consequently, industrial buyers must evaluate whether to assemble fragmented open-source
              data lakes or deploy purpose-built commercial platforms.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
      - number: '3.2'
        title: 'Architectural Differentiation: Industrial Knowledge Graphs versus Legacy Silos'
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator for Cognite Data Fusion (CDF) centers on its Industrial Knowledge Graph
              and automated data contextualization engine. Unlike conventional process historians such as OSIsoft PI,
              which primarily function as optimized flat time-series tag archives, Cognite maps unstructured documents,
              piping and instrumentation diagrams (P&IDs), 3D computer-aided design (CAD) models, and real-time sensor
              streams into a unified semantic graph. Independent procurement benchmarks evaluate Cognite exceptionally
              high on OT/IT/ET data integration (4.8/5.0) and industrial asset modeling (4.9/5.0), bolstered by over 90
              pre-built connectors. Furthermore, the operationalization of Atlas AI and Cognite Flows introduces agentic
              AI capabilities that allow frontline operators to construct automated workflows and execute root-cause
              diagnostics directly against contextualized plant data. Conversely, Cognite demonstrates material
              limitations in native plant-floor edge execution and sub-second control loops, scoring only 2.8/5.0 in
              edge processing benchmarks. Because Cognite relies on containerized on-premises extractors that buffer
              telemetry for upstream processing rather than functioning as a distributed deterministic edge runtime,
              mission-critical safety systems and closed-loop control must remain governed by local programmable logic
              controllers (PLCs) and distributed control systems (DCS).
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP009
              - CP014
      - number: '3.3'
        title: Commercial Packaging, Deal Architecture, and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Cognite's go-to-market motion relies on high-value, multi-year enterprise SaaS subscriptions structured
              through customized master services agreements (MSAs) rather than transparent self-serve or public
              rate-card pricing. To protect high-margin software economics and satisfy ASC 606 revenue recognition
              standards, Cognite maintains a dedicated deal design governance function within its revenue operations
              group. This team actively unbundles low-margin, service-heavy implementation tasks into separate
              Professional Services, Development Accelerators, and Success Track advisory order forms. In contrast to
              legacy automation incumbents that penalize sensor instrumentation expansion via restrictive per-tag
              licensing fees, Cognite's platform subscription encourages broad enterprise connectivity. However, total
              cost of ownership (TCO) analysis reveals material procurement risks: year-one expenditure is heavily
              weighted toward billable consulting hours, custom extractor configurations, and contextual schema design.
              Moreover, because underlying consumption metrics (such as data-volume throughput and 3D ingestion rates)
              remain confidential and unindexed in public marketplace listings, enterprise buyers face potential budget
              expansion as multi-site telemetry scales beyond initial pilot projections.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Cognite's long-term competitive moat rests on high switching costs created by deep operational integration
              rather than contractual lock-in. By embedding open REST APIs, GraphQL endpoints, and Python SDKs into
              enterprise IT environments, Cognite positions CDF as a collaborative data liberation fabric that coexists
              with existing historians rather than demanding immediate rip-and-replace displacement. Once an industrial
              operator configures complex cross-asset relationships, custom machine learning pipelines, and frontline
              Flows workspaces across multiple facilities, extracting that institutional operational context and
              migrating to an alternative platform entails severe engineering disruption. Nevertheless, Cognite faces
              meaningful strategic vulnerabilities. Enterprise cloud software platforms such as Palantir and Databricks
              are expanding verticalized industrial manufacturing accelerators, while industrial conglomerates
              (including Schneider Electric, which maintains a pending acquisition agreement) seek to unify automation
              hardware with software platforms. Additionally, customer concentration in capital-intensive energy and
              process sectors exposes software expansion rates to macro commodity and capital expenditure cycles.
              Maintaining durable differentiation will require Cognite to defend its data modeling superiority while
              bridging the latency gap between cloud intelligence and plant-floor edge execution.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP009
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Knowledge Graph Interoperability as a Competitive Wedge
            body: >-
              Cognite bypasses the traditional rip-and-replace battle against entrenched historians by serving as an
              open, semantic contextualization layer that extracts data from existing systems without forcing customer
              infrastructure obsolescence.
            calloutType: insight
            claimRefs:
              - CP005
              - CP014
          - type: callout
            title: Edge Disadvantage in Mission-Critical Operational Loops
            body: >-
              While Cognite dominates enterprise-wide contextual modeling and agentic AI workspaces, its lower ratings
              in native edge data processing leave sub-second control and air-gapped deterministic automation vulnerable
              to automation incumbents.
            calloutType: risk
            claimRefs:
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Quality and Growth Signals
        blocks:
          - type: paragraph
            body: >-
              Cognite reported annual revenue above $170 million for fiscal 2025, while its separate ARR-bookings metric
              grew 36% year over year [CI001, CI002]. The two measures are not interchangeable: annual revenue is an
              accounting-period outcome, whereas bookings growth is a forward commercial signal whose opening balance
              and conversion to recognized revenue were not disclosed. Expansion evidence is strongest within a subset:
              Cognite reported 150% NRR for newer customers, not for the full installed base [CI003]. Product adoption
              may support expansion, with Atlas AI included in more than 70% of 2025 bookings and operationalized by 59%
              of customers measured by ARR [CI004, CI016]. Revenue concentration has moderated but remains meaningful
              because Cognite said roughly 40% of 2025 revenue came from outside oil and gas [CI005].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
