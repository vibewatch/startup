              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named Customer Proof, Deployment Scale, and Value Delivery
        blocks:
          - type: paragraph
            body: >-
              Publicly referenced enterprise accounts validate that Cognite Data Fusion and Cognite Flows operate in
              live mission-critical production environments rather than stalled proof-of-concept sandboxes. German
              medical technology multinational B. Braun utilizes Cognite Flows to establish real-time asset transparency
              and operational intelligence across manufacturing operations. In Japan, refining and petrochemical
              enterprise Idemitsu Kosan deployed Cognite Flows to systematically resolve asset non-conformance incidents
              and accelerate engineering root cause analysis. Norwegian exploration and production operator Aker BP has
              integrated Cognite at the core of its operational model, scaling hundreds of AI agents across offshore
              assets. Joint deployments with engineering integration partners such as Radix, L&T Technology Services,
              and RoviSys demonstrate third-party delivery repeatability. However, outside selected marquee references,
              individual account ARR contributions and contract durations remain confidential.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Retention Dynamics, Account Durability, and Concentration Gaps
        blocks:
          - type: paragraph
            body: >-
              Cognite reports 150% Net Revenue Retention (NRR) for newer customer cohorts, signaling substantial net
              expansion once industrial accounts integrate operational data models and activate high-value analytics.
              Enterprise expansion is structured around a Moonshot commitment to deliver $100 billion in cumulative
              customer value by 2035, supported by formal Value Realisation Workshops, dedicated steering committees,
              and quota-carrying commercial sales teams. Nevertheless, severe disclosure limitations persist. Cognite
              reports cohort-specific NRR for newer customers rather than a blended net retention rate across its entire
              historical customer base, masking potential attrition among legacy or un-expanded accounts. Furthermore,
              total paying enterprise client counts, logo churn rates, gross revenue retention (GRR), and revenue
              concentration among top anchor clients—such as founding affiliate Aker BP—are completely omitted from
              audited disclosures, leaving account vulnerability unquantified.
            claimRefs:
              - CU006
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Switching Costs Anchored in 80 Trillion Contextualized Data Points
            body: >-
              Cognite's customer stickiness is fundamentally driven by deep operational data integration rather than
              basic dashboarding. With over 80 trillion time-series data points structured within customer knowledge
              graphs and 59% of ARR operationalized on Atlas AI, replacing Cognite would require industrial enterprises
              to undertake multi-year re-architectures of complex OT-IT contextualization pipelines.
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
              - CU014
          - type: callout
            title: Selective Cohort Retention Disclosure Masks Base Concentration
            body: >-
              While a 150% NRR figure for newer customers demonstrates robust initial expansion, the omission of blended
              full-base NRR, gross churn, and total client count represents a material diligence gap. Given Cognite's
              historical origins with Aker BP, potential revenue concentration among anchor accounts remains
              unquantified.
            calloutType: risk
            claimRefs:
              - CU006
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Framework
        blocks:
          - type: paragraph
            body: >-
              Cognite operates as a data processor for industrial enterprises across North America, Europe, and Asia,
              necessitating formal compliance with regional data protection standards including the European Union
              General Data Protection Regulation (GDPR). The company's standard Data Processing Agreement establishes
              strict operational boundaries, requiring notification of personal data breaches to data controllers
              without undue delay and no later than 72 hours following discovery. Furthermore, Cognite contractually
              warrants that data exports and automated migration tools remain accessible during a 30-day transitional
              period following any potential insolvency event before permanent erasure. However, because Cognite
              processes operational telemetry and personal data across multinational cloud and hybrid on-premises
              environments, cross-border data transfer restrictions and foreign authority subpoena access represent
              persistent compliance friction points that require active governance.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Complexity and Integration Friction
        blocks:
          - type: paragraph
            body: >-
              Industrial AI deployment across heavy-asset manufacturing and energy facilities exposes Cognite to severe
              integration and operational risks. Frontline adoption of Cognite Data Fusion and Cognite Flows requires
              contextualizing disparate enterprise resource planning systems, warehouse management systems, and
              operational technology (OT) historians. Third-party benchmarks indicate that while Cognite excels at
              contextual data modeling and enterprise multi-site integration, it lacks native protocol gateway depth and
              relies heavily on customer-side or partner-led integration tooling. Commercial evaluations emphasize that
              Cognite Data Fusion is sold through custom enterprise subscription orders rather than transparent
              self-serve tiers, with professional services, Success Track, and Development Accelerators billed
              separately. Incomplete visibility into consumption thresholds and integration labor creates total cost of
              ownership volatility for industrial buyers.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
