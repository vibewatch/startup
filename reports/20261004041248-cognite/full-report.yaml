  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and industrial workflows
        blocks:
          - type: paragraph
            body: >-
              Cognite delivers a platform rather than a single point application. Its documentation divides the surface
              into Flows and field operations, knowledge-graph and data-integration capabilities, production deployment,
              and developer tools. AWS describes Cognite Data Fusion as the layer that unifies IT, OT, and engineering
              data and exposes contextualized information through applications including Canvas, AI Copilot, InField,
              InRobot, Maintain, and Charts. Cognite's May 2026 launch release positions Flows above that foundation as
              an action layer where frontline users and developers assemble operational workflows. That release also
              names B. Braun and Idemitsu Kosan as users, but its adoption and speed claims remain company-issued and
              disclose neither a customer-count denominator nor an independent benchmark. The product thesis is
              therefore coherent: consolidate fragmented industrial data, contextualize it in a knowledge graph, and
              shorten the path from data to operator action. The diligence question is how consistently that thesis
              translates into production outcomes across the installed base.
            claimRefs:
              - CE001
              - CE007
              - CE009
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
