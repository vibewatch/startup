evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Audited cap-table ownership breakdown, share class preferences, and post-2021 primary valuation filings.
    whyItMatters: >-
      Without primary cap-table documentation, secondary tracker claims of a $3.1 billion valuation cannot be confirmed
      or reconciled against 2021's $1.6 billion benchmark.
    diligencePath: >-
      Request private share registry disclosures, shareholder voting agreements, and secondary trading records from
      management.
    relatedQuestionRefs:
      - QO003
      - QO006
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements confirming consolidated GAAP/IFRS revenue, operating margins, and total contractual
      ARR.
    whyItMatters: >-
      Preliminary company-announced revenue of $170M+ and selective 150% cohort NRR may omit legacy contract attrition
      or non-recurring professional services fees.
    diligencePath: Obtain independent auditor reports and detailed ARR bridge schedules from CFO and corporate accounting.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete listing of all operational vice presidents, regional managing directors, and board observer appointments.
    whyItMatters: >-
      The leadership enumeration table captures core C-level officers and founders but omits lower-level business unit
      leaders who manage day-to-day deployment across EMEA and APAC.
    diligencePath: Review full organizational charts and corporate registry filings in Norway and the United States.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular third-party research reports quantifying the exact TAM dollar ceiling for pure-play industrial DataOps
      software separate from broader automation spend.
    whyItMatters: >-
      Without segmented third-party TAM forecasts, addressable market sizing relies partially on qualitative category
      bounds and macro automation proxies.
    diligencePath: >-
      Obtain dedicated industrial software research studies from specialized industrial market research analysts such as
      Verdantix or ARC Advisory Group.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Standard pricing schedules, discounting schedules, per-tag or per-asset licensing costs, and typical year-one
      software-versus-services spend ratios.
    whyItMatters: >-
      Opaque custom order forms prevent objective evaluation of total cost of ownership and pricing competitiveness
      against lower-cost analytics tools.
    diligencePath: >-
      Review redacted customer enterprise master service agreement schedules and marketplace private offer order forms
      during confidential diligence.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-tco
    missingEvidence: >-
      Disclosed unit pricing schedules, per-tag or per-gigabyte consumption rate cards, and standard discount tiering
      for Cognite Data Fusion subscriptions.
    whyItMatters: >-
      Without public rate cards or standard enterprise tiers, buyers cannot independently verify total cost of ownership
      or model expansion economics as data telemetry scales.
    diligencePath: >-
      Request anonymized customer MSA order forms, rate schedules, and year-one versus year-three realized spend
      breakdowns during commercial diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: edge-performance-benchmarks
    missingEvidence: >-
      Independent low-latency sub-second benchmark data comparing Cognite on-premises extractors against native edge
      industrial control systems.
    whyItMatters: >-
      Determines whether mission-critical real-time control loops can safely migrate to Cognite or must permanently
      reside on legacy OT platforms.
    diligencePath: >-
      Review technical proof-of-concept latency telemetry and test failover behavior in disconnected plant network
      environments.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: Consolidated and segmented gross margin, hosting cost, services utilization, CAC, sales-cycle, and payback data.
    whyItMatters: >-
      Without these inputs, investors cannot test software operating leverage, implementation drag, or acquisition
      efficiency.
    diligencePath: >-
      Request audited segment margins, cloud-cost schedules, services utilization, and cohort CAC/payback from Cognite
      under NDA.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Current cash, operating cash burn, runway, debt and credit facilities, covenants, planned use of funds, and
      next-round trigger.
    whyItMatters: Historical funding does not show present liquidity or whether growth can be financed without another round.
    diligencePath: Obtain current balance sheet, monthly cash bridge, debt schedule, covenant package, and management runway plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: A primary capitalization schedule reconciling the $225 million and $300 million public funding totals.
    whyItMatters: >-
      Different totals may reflect omitted rounds, secondary transactions, or inconsistent definitions and cannot
      establish cash available.
    diligencePath: >-
      Reconcile signed financing documents, proceeds, secondary sales, and investor ownership to the current
      capitalization table.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Independent uptime history, incident reports, latency distributions, recovery performance, and missed-SLA data are
      not present in the assigned evidence.
    whyItMatters: >-
      Industrial workloads can be safety- and production-critical, so architecture descriptions do not substitute for
      achieved service reliability.
    diligencePath: >-
      Request 24 months of service-level reports and severity-one incident postmortems, then corroborate them with
      customer references.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: security
    missingEvidence: >-
      The assigned sources do not establish certification scope, penetration-test results, privacy controls, data
      residency coverage, or audited control effectiveness.
    whyItMatters: >-
      Reference-design controls show available components but do not prove Cognite-wide implementation or operating
      effectiveness.
    diligencePath: >-
      Review current SOC 2 and ISO reports, penetration-test summaries, subprocessor and residency matrices, and
      customer security exceptions.
  - type: missing-source
    severity: material
    topic: performance
    missingEvidence: >-
      No independent benchmark quantifies ingestion throughput, graph-query latency, implementation effort, or cost by
      workload.
    whyItMatters: >-
      Performance and implementation economics determine whether the differentiated industrial model scales beyond
      flagship deployments.
    diligencePath: >-
      Run a representative proof of value with fixed source volumes, query patterns, service levels, staffing, and
      total-cost measurements.
  - type: missing-source
    severity: material
    topic: total-customer-count-and-concentration
    missingEvidence: >-
      Audited enterprise customer account count, top-5 and top-10 customer revenue concentration percentages, and
      historical account logo churn rates.
    whyItMatters: >-
      Without total customer count and concentration figures, diligence cannot determine Cognite's dependency on
      founding anchor client Aker BP or evaluate revenue durability against enterprise account attrition.
    diligencePath: >-
      Request private commercial diligence metrics detailing customer cohort retention tables, customer ARR distribution
      tiers, and Aker BP contract revenue share.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: full-base-net-revenue-retention
    missingEvidence: >-
      Blended gross revenue retention (GRR) and full-base net revenue retention across all legacy customer cohorts
      rather than selectively reported newer cohorts.
    whyItMatters: >-
      Selective reporting of 150% NRR for newer customers risks survivorship bias and may obscure stagnation or churn
      among mature industrial deployments.
    diligencePath: Obtain unaudited customer cohort expansion and contraction matrices spanning 2021 through 2026.
    relatedQuestionRefs:
      - QU004
      - QU008
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: >-
      Exact percentage of recurring revenue attributable to top five enterprise accounts including Saudi Aramco and Aker
      group entities.
    whyItMatters: >-
      Heavy concentration in upstream oil and gas exposes Cognite to capital expenditure volatility during energy
      commodity downturns.
    diligencePath: >-
      Request customer cohort revenue concentration tables and contract expiration schedules under non-disclosure
      agreement during formal diligence.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: pricing rate cards
    missingEvidence: Standardized per-user, per-asset, and ingested data-volume tier pricing schedules.
    whyItMatters: >-
      Enterprise buyers face unquantifiable budget expansion risks when operational telemetry and professional services
      needs scale across multiple production facilities.
    diligencePath: >-
      Obtain standard commercial price books and historical enterprise discount schedules directly from sales
      leadership.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: minor
    topic: litigation and claims history
    missingEvidence: >-
      Confidential settlement records or customer arbitration claims concerning industrial downtime or data extraction
      errors.
    whyItMatters: >-
      Private corporate structure obscures customer dispute frequency and liability claims arising from operational
      automation recommendations.
    diligencePath: Review litigation disclosure exhibits and professional liability insurance loss runs in virtual data room.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
