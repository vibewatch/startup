        - from: "deployment-cost"
          to: "expansion"
        - from: "expansion"
          to: "annual-revenue"
        - from: "annual-revenue"
          to: "gross-profit-gap"
    approximationNotes: "Conceptual flow only; it does not estimate prices, revenue allocation, margin, or conversion rates."
    claimRefs:
