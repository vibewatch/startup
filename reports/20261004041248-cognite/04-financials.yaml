    title: "Revenue model bridge and missing gross-profit conversion"
    type: "flow"
    summary: "The public evidence connects an enterprise sales process to software and services revenue signals, but it does not quantify the final gross-profit conversion."
    data:
      nodes:
        - id: "buyer-scope"
          label: "Industrial use case and deployment scope"
          detail: "Sites, assets, data volume, integrations, and workflows define the buying context."
        - id: "demo-quote"
          label: "Demo and custom quote"
          detail: "The official site routes prospects to a live demo; public standard pricing is absent."
        - id: "subscription-order"
          label: "Core subscription order"
          detail: "Custom enterprise subscription creates the principal software revenue mechanism."
        - id: "services-order"
          label: "Services and success orders"
          detail: "Professional services, Success Track, and accelerators may be contracted separately."
        - id: "deployment-cost"
          label: "Deployment and infrastructure cost"
          detail: "Extractors, identity, OT connectivity, and integration scope affect total delivery economics."
        - id: "expansion"
          label: "Atlas AI and Flows expansion"
          detail: "Bookings and enablement show adoption, but not standalone recognized revenue."
        - id: "annual-revenue"
          label: "FY2025 annual revenue above $170M"
          detail: "Company-reported accounting-period scale; recurring mix is undisclosed."
        - id: "gross-profit-gap"
          label: "Gross profit and cash conversion unavailable"
          detail: "Consolidated gross margin, burn, and runway require private evidence."
      edges:
        - from: "buyer-scope"
          to: "demo-quote"
        - from: "demo-quote"
          to: "subscription-order"
        - from: "subscription-order"
          to: "services-order"
        - from: "services-order"
