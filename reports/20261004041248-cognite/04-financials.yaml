company:
  name: "Cognite"
chapter:
  number: 4
  title: "Financials"
  summary: "Cognite reported more than $170 million of fiscal-2025 annual revenue, 36% year-over-year growth in ARR bookings, and 150% NRR for newer customers. Those signals do not resolve realized pricing, consolidated gross margin, cash burn, runway, or debt obligations, so the financial case remains dependent on private diligence."
sections:
  - id: "revenue-quality-and-growth"
    title: "Revenue Quality and Growth Signals"
    body: >-
      Cognite reported annual revenue above $170 million for fiscal 2025, while its
      separate ARR-bookings metric grew 36% year over year [CI001, CI002]. The two
      measures are not interchangeable: annual revenue is an accounting-period
      outcome, whereas bookings growth is a forward commercial signal whose opening
      balance and conversion to recognized revenue were not disclosed. Expansion
      evidence is strongest within a subset: Cognite reported 150% NRR for newer
      customers, not for the full installed base [CI003]. Product adoption may support
      expansion, with Atlas AI included in more than 70% of 2025 bookings and
      operationalized by 59% of customers measured by ARR [CI004, CI016]. Revenue
      concentration has moderated but remains meaningful because Cognite said roughly
      40% of 2025 revenue came from outside oil and gas [CI005].
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI016"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-gtm"
    title: "Pricing, Contracting, and GTM Economics"
    body: >-
      Public evidence points to a sales-assisted enterprise motion rather than a
      self-serve funnel. Cognite's own site directs prospects to request a live
      demonstration, while RFP.wiki reports that Cognite Data Fusion is purchased
      through custom subscription order forms and does not publish standard unit
      prices [CI008, CI006]. The same comparison says professional services, Success
      Track, and Development Accelerators are ordered separately from the core
      subscription [CI007]. That packaging can create multiple revenue streams, but
      public sources do not disclose their mix, discounts, contract duration, or
      realized price. Customer infrastructure and service costs can also include
      on-premises extractors, identity integration, and OT connectivity [CI009].
      Consequently, list-to-realized pricing, CAC, sales-cycle length, and payback
      cannot be underwritten from the available material.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI002"
  - id: "unit-economics-and-cost-base"
    title: "Unit Economics and Cost-Base Visibility"
    body: >-
      The public record provides growth proxies but not a complete unit-economic
      model. Newer-customer NRR of 150% suggests strong expansion in that cohort, yet
      it omits legacy cohorts, logo churn, contraction, and the denominator needed to
      generalize across the customer base [CI003]. Headcount grew 21% in 2025 to more
      than 800 employees, a scale indicator and potential operating-cost signal rather
      than a direct measure of burn [CI012]. RFP.wiki states that Cognite has no public
      EBITDA disclosure and that profitability and burn could not be verified in its
      review [CI010]. Public evidence also lacks consolidated gross margin, software
      versus services margin, cloud hosting cost, implementation utilization, CAC,
      and payback. The result is a credible top-line growth narrative without enough
      information to test operating leverage.
    claimRefs:
      - "CI003"
      - "CI010"
      - "CI012"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: >-
      Capital history does not establish current liquidity. Tracxn reports $225
      million of total funding, while CNBC's 2026 profile lists $300 million; these
      incompatible totals require reconciliation against the capitalization table
      [CI013, CI014]. A documented $150 million 2021 investment valued Cognite at
      $1.6 billion, but that historical financing cannot be treated as cash still
      available in 2026 [CI015]. No assigned source discloses current cash, operating
      cash burn, runway, debt or credit facilities, covenant exposure, or the trigger
      for another financing. The financial verdict is therefore mixed: disclosed
      revenue and bookings indicators support commercial momentum, but revenue quality,
      margin durability, and capital self-sufficiency remain unverified. Underwriting
      should remain conditional on audited statements, cohort economics, contract
      data, and a current liquidity bridge.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI013"
      - "CI014"
      - "CI015"
