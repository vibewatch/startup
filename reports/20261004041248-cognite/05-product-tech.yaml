company:
  name: "Cognite"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Cognite Data Fusion is presented as an industrial data foundation that ingests and
    contextualizes IT, OT, and engineering data, then exposes that context through applications,
    APIs, developer tooling, Atlas AI, and Cognite Flows. The technical surface is broad and
    actively shipping, but most evidence is company- or partner-issued and does not establish
    independently measured reliability, security certification coverage, or production economics.
sections:
  - id: "product-surface-and-workflows"
    title: "Product surface and industrial workflows"
    body: >-
      Cognite delivers a platform rather than a single point application. Its documentation divides
      the surface into Flows and field operations, knowledge-graph and data-integration capabilities,
      production deployment, and developer tools. AWS describes Cognite Data Fusion as the layer
      that unifies IT, OT, and engineering data and exposes contextualized information through
      applications including Canvas, AI Copilot, InField, InRobot, Maintain, and Charts. Cognite's
      May 2026 launch release positions Flows above that foundation as an action layer where
      frontline users and developers assemble operational workflows. That release also names B.
      Braun and Idemitsu Kosan as users, but its adoption and speed claims remain company-issued
      and disclose neither a customer-count denominator nor an independent benchmark. The product
      thesis is therefore coherent: consolidate fragmented industrial data, contextualize it in a
      knowledge graph, and shorten the path from data to operator action. The diligence question is
      how consistently that thesis translates into production outcomes across the installed base.
    claimRefs: [CE001, CE007, CE009, CE013, CE014]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-deployment-model"
    title: "Architecture and deployment model"
    body: >-
      The documented architecture separates source, enterprise, and solution data models. Source
      layers preserve system data, the enterprise layer integrates and validates shared context,
      and solution views serve application-specific needs without routinely duplicating data.
      Cognite describes a property-graph model built from spaces, containers, views, nodes, edges,
      and shared identifiers. Direct relations are the default, while edges are reserved for
      relationship metadata or very high-cardinality many-to-many links; the documentation notes a
      current limit of 2,000 outgoing direct relations in a list. AWS adds a deployment view:
      purpose-built extractors and native AWS connectors ingest industrial sources, quality checks
      and entity matching construct the knowledge graph, and applications or AWS services consume
      the result. Cognite recommends Git-based configuration-as-code deployment through Toolkit
      across development, staging, and production. This is a specific, composable architecture,
      although the assigned evidence does not provide independent throughput, latency, or
      availability measurements.
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-controls-and-technical-risk"
    title: "Maturity, controls, and technical risk"
    body: >-
      The Q3 2026 update shows uneven maturity across the portfolio rather than a uniformly
      production-ready stack. It labels some search, 3D, InField, Canvas, and custom-app capabilities
      as production, while Industrial MCP and the Agent Builder CLI are previews and Atlas AI
      Sandboxes remain private preview. That cadence is evidence of active delivery, but it also
      creates versioning, support, and change-management exposure for customers building on newer
      AI surfaces. The data-model documentation specifies separate schema and instance permissions,
      facility-level instance spaces, indexing, and controlled deployment. AWS describes a reference
      design using IAM, KMS, Secrets Manager, Shield, CloudWatch, and CloudTrail, but those controls
      characterize an AWS solution pattern rather than a Cognite-wide certification or audited
      control conclusion. A company-authored engineering job repost further indicates investment in
      multi-tenant, multi-cloud orchestration, observability, SLOs, and incident response; it is a
      hiring signal, not proof that stated reliability targets are met. Underwriting should therefore
      require service-level history, incident records, penetration-test summaries, certification
      scope, and workload-level cost and performance data.
    claimRefs: [CE004, CE010, CE011, CE012, CE015, CE016]
