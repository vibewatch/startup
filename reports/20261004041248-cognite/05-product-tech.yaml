      - ["Cognite Flows", "Frontline teams, subject-matter experts, and developers", "Launched in May 2026; native and custom capabilities show mixed production and preview status", "Action layer combines data, AI, apps, and adaptable workflows", "Company speed claims lack independently measured baseline and sample detail"]
      - ["InField, Canvas, and operational apps", "Operators, supervisors, and reliability teams", "Several Q3 2026 features are production; some collaboration features remain preview", "Applications share the contextualized data foundation", "Module-level adoption, renewal, and reliability are undisclosed"]
      - ["Developer platform and Toolkit", "Customer and partner developers", "APIs, SDKs, CLI, and configuration-as-code deployment are documented", "Composable build-and-deploy surface across applications and data models", "Public package usage, contributor activity, and support responsiveness are not quantified"]
    notes: >-
      Statuses reflect Cognite documentation, its Q3 2026 product update, and AWS partner guidance;
      company launch claims are not treated as independent maturity verification.
    claimRefs: [CE001, CE002, CE006, CE009, CE011, CE012, CE013]
  - id: "TE002"
    title: "Workflow and use-case evidence"
    columns: ["User job", "Prior friction described", "Cognite surface", "Reported benefit", "Evidence limitation"]
    rows:
      - ["Unify industrial data", "Siloed IT, OT, engineering, historian, PLC, and cloud data", "CDF extractors, connectors, quality checks, and Industrial Knowledge Graph", "A cohesive data environment for applications and analytics", "Architecture is partner-described; no measured implementation duration"]
      - ["Build frontline workflows", "Operators switch among fragmented systems and manually retrieve context", "Cognite Flows", "Single-screen adaptive workflows grounded in operational context", "100x build-speed claim is company-issued and lacks benchmark methodology"]
      - ["Investigate asset health", "Teams lack a unified contextualized view", "Flows and the CDF data foundation", "B. Braun reported rapid UX refinement and near-instant feedback updates", "Customer quote is carried in Cognite's launch release, not an independent study"]
      - ["Capture operating knowledge", "Specialized plant expertise is difficult to digitize", "Flows applications using real-time knowledge graphs", "Idemitsu described a path from visualization toward proactive agents", "Forward-looking customer expectation; quantified outcome is not provided"]
      - ["Optimize production workflows", "Reservoir, well, and facility data are fragmented", "CDF with SLB domain and AI capabilities", "Integrated data foundation and standardized workflows", "Partner page does not quantify deployment scale, economics, or reliability"]
    notes: >-
      Benefits preserve the issuer and qualification in each source; no company or partner claim is
      presented as an independently verified outcome.
    claimRefs: [CE007, CE008, CE013, CE014, CE016]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer / component", "Role", "Key dependency", "Principal technical risk"]
    rows:
      - ["Industrial source ingestion", "Ingest historian, PLC, IT, OT, engineering, and cloud data", "Extractors, connectors, source-system availability, and mapping quality", "Connector drift or poor source data propagates into downstream context"]
      - ["Source data model", "Retain a raw copy and upstream lineage for each source", "Producer ownership and freshness monitoring", "Shared-instance deletion choices can create data-loss exposure"]
      - ["Enterprise data model", "Integrate and validate cross-source entities and relationships", "Containers, views, identifiers, indexing, and entity matching", "Schema sprawl or weak indexing can degrade query performance"]
      - ["Solution views and applications", "Expose application-specific read views and operational experiences", "Stable enterprise model and access-scoped data", "Application coupling and preview features can increase change-management burden"]
      - ["Security and governance", "Separate schema access from data-instance access and isolate facilities", "Correct spaces, groups, permissions, and deployment controls", "Misconfiguration can expose or unintentionally delete shared industrial data"]
      - ["Deployment and operations", "Version models and deploy Toolkit configuration through CI/CD", "Git, environment promotion, observability, and incident processes", "Public evidence does not disclose achieved SLOs, incident rates, or recovery performance"]
    notes: >-
      Architecture is synthesized from Cognite technical documentation and AWS guidance; the risk
      column is analytical and highlights dependencies rather than documented incidents.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE010]
