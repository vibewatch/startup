      layers:
        - label: "Industrial source systems"
          items: ["Historians and PLCs", "IT and OT systems", "Engineering data", "AWS data services"]
          detail: "Purpose-built and native extractors ingest source data."
        - label: "Ingestion and quality"
          items: ["Extractors", "Validation checks", "Transformations", "Entity matching"]
          detail: "Pipelines prepare and relate source records before application use."
        - label: "Industrial Knowledge Graph"
          items: ["Spaces", "Containers", "Views", "Nodes", "Direct relations and edges"]
          detail: "The shared contextual layer connects industrial entities and data."
        - label: "Platform and developer interfaces"
          items: ["APIs and SDKs", "Toolkit", "Workflows", "Industrial MCP"]
          detail: "Developers configure, deploy, orchestrate, and expose contextual data."
        - label: "AI and application layer"
          items: ["Atlas AI", "Cognite Flows", "Canvas", "InField", "Charts"]
          detail: "AI, native apps, and custom workflows consume the common data foundation."
        - label: "Industrial users and partners"
          items: ["Operators", "Engineers", "Data teams", "Application builders"]
          detail: "Users act on contextualized data through role-specific experiences."
    approximationNotes: >-
      The ordering is a synthesis of Cognite, AWS, and SLB descriptions; it does not imply measured
      latency, universal deployment topology, or uniform production maturity.
    claimRefs: [CE001, CE007, CE008, CE009, CE013, CE016]
