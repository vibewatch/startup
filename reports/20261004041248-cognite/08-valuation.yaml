chapter:
  number: 8
  title: "Valuation"
  summary: "Schneider Electric's June 2026 definitive agreement to acquire 100% of Cognite Holding B.V. for $3.1 billion in cash crystallizes an 18.2x multiple on fiscal 2025 revenue of over $170 million. While historical venture rounds valued Cognite at $1.6 billion in May 2021 and $1.5 billion in February 2022, the pending transaction removes standalone private liquidity risk while shifting investor focus toward closing condition execution and integration into Schneider Electric's AVEVA and Industrial Automation units."
sections:
  - id: "investment-thesis-and-context"
    title: "Investment Thesis and M&A Transaction Context"
    body: "Cognite's investment thesis has transitioned from an independent SaaS unicorn expansion story to an acquired industrial intelligence powerhouse. On June 30, 2026, Schneider Electric announced an agreement to acquire 100% of Cognite Holding B.V. in an all-cash transaction valued at $3.1 billion. The acquisition price reflects an 18.2x multiple on Cognite's 2025 revenue, which exceeded $170 million. Cognite's core strength lies in its unified industrial data model within Cognite Data Fusion (CDF) and its agentic AI layer Atlas AI, which together bridge complex operational technology (OT) and enterprise IT data across heavy-asset industries. Under Schneider Electric's ownership, Cognite is planned to be integrated with AVEVA and consolidated within Schneider Electric's Industrial Automation business, directly combining industrial data contextualization with AVEVA's CONNECT platform across global industrial sites."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "valuation-discipline-and-multiples"
    title: "Financing History and Valuation Multiple Discipline"
    body: "Prior to the $3.1 billion acquisition agreement, Cognite raised approximately $225 million across three primary private financing rounds. In October 2020, Accel led a $75 million Series A round that valued the company at $550 million. In May 2021, growth equity firm TCV led a $150 million Series B investment that propelled Cognite to unicorn status at a post-money valuation of $1.6 billion. A subsequent secondary transaction in February 2022 brought in Saudi Aramco at a $1.5 billion valuation mark. While secondary and pre-IPO marketplaces such as Forge Global tracked limited marketplace trading activity without active pricing quotes, third-party market tracker Latka and aggregator Multiples both evaluate the $3.1 billion acquisition price as an aggressive 18.2x multiple on $170 million of historical ARR/revenue. This premium reflects strategic scarcity value in industrial GenAI and agentic workflow orchestration rather than a standardized software trading multiple."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis-and-diligence"
    title: "Scenario Analysis, Execution Risks, and Diligence Asks"
    body: "Evaluating Cognite requires examining outcomes under closed transaction integration, extended regulatory delays, or a broken deal scenario. In the base case, the all-cash acquisition closes in the coming quarters following customary regulatory reviews, delivering liquidity at $3.1 billion and positioning Cognite within AVEVA to cross-sell into Schneider Electric's global customer base. The bull case assumes accelerated enterprise penetration where agentic tools like Cognite Flows and Atlas AI drive ARR expansion well beyond 36% bookings growth, unlocking deeper industrial automation synergies. Conversely, the bear scenario examines antitrust or cross-border regulatory scrutiny that could delay closing or force concessions, leaving Cognite exposed to high cash burn and standalone valuation reset toward standalone private software multiples of 8x to 10x ARR."
    claimRefs:
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV003"
