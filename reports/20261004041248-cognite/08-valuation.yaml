callouts:
  - calloutType: "recommendation"
    title: "Decision Implication of the Schneider Electric Acquisition"
    body: "With Schneider Electric entering a definitive agreement to acquire 100% of Cognite Holding B.V. for $3.1 billion in cash, private market investors should view the asset through the lens of transaction completion and post-merger integration rather than speculative venture fundraising. At an 18.2x revenue multiple, Schneider Electric is paying a full strategic price for Cognite's industrial knowledge graph and agentic AI tools. We maintain a TRACK recommendation pending closing confirmation and regulatory clearance."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV008"
      - "CV010"
  - calloutType: "risk"
    title: "Downside Risks in Case of Regulatory Closing Delays"
    body: "Although the all-cash acquisition agreement resolves standalone liquidity concerns, the transaction remains subject to customary closing conditions and regulatory approvals across jurisdictions. If unexpected antitrust scrutiny or foreign investment reviews stall closing, Cognite could face operational disruption and valuation multiple compression toward private software comps."
    claimRefs:
      - "CV010"
      - "CV011"
      - "CV012"
