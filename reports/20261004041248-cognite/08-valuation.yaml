      - "Valuation / Return Logic"
      - "Key Risks"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Smooth regulatory clearance; rapid AVEVA cross-selling; Cognite Flows expands into manufacturing and pharma at >40% ARR growth."
        - "Transaction closes at $3.1B; enterprise strategic value exceeds $4.5B within Schneider Electric ecosystem."
        - "Product cannibalization with existing AVEVA software modules or partner friction with third-party cloud providers."
        - "Medium (rapid commercialization of agentic AI workflows and Atlas AI adoption)."
      - - "Base Case"
        - "Transaction completes in coming quarters post-regulatory review; 2025 revenue ($170M) scales moderately at ~30% ARR growth."
        - "Schneider Electric completes 100% all-cash purchase at agreed $3.1B valuation (18.2x multiple)."
        - "Extended integration timelines and retention costs for critical data science personnel."
        - "High (definitive agreement signed with backing from majority shareholder Aker ASA)."
      - - "Bear Case"
        - "Antitrust intervention or national security regulatory blocks delay or terminate deal; standalone liquidity needed."
        - "Valuation resets to standalone private market levels of 8x-10x ARR ($1.4B-$1.7B EV), wiping out recent multiple expansion."
        - "Cash burn acceleration and potential down-round financing if standalone capital injection is required."
        - "Low (transaction structure is strategic industrial expansion without horizontal monopoly concentration)."
    notes: "Scenario analysis models announced $3.1B transaction vs standalone fallback valuation multiples."
