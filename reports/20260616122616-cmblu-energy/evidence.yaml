evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: revenue
    missingEvidence: CMBlu has not disclosed any revenue, ARR, or gross margin figures in public sources as of June 2026.
    whyItMatters: >-
      Financial performance is essential for assessing unit economics, path to profitability, and whether the EUR 1B+
      valuation is supported by operating fundamentals.
    diligencePath: >-
      Request unaudited management accounts, LOI pipeline values, and customer contract revenue commitments from
      management under NDA.
    relatedQuestionRefs:
      - QO013
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: CMBlu does not publicly disclose a total customer count, revenue by customer, or churn and retention data.
    whyItMatters: >-
      Customer concentration risk is unquantifiable without at minimum a count of active accounts and the revenue share
      of top customers such as Uniper and SRP.
    diligencePath: >-
      Request full customer list under NDA; determine revenue attribution and contract commitment across Uniper, SRP,
      Burgenland Energie, WEC, and Mercedes-Benz.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Supervisory board composition beyond Dr. Peter Geigle and equity stakes of all shareholders other than STRABAG are
      undisclosed.
    whyItMatters: >-
      Ownership concentration, board control dynamics, founder exit alignment, and governance risk cannot be assessed
      without cap table and board documentation.
    diligencePath: Request shareholders agreement, full capitalization table, and supervisory board member list from the company.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: >-
      No regulatory filings, litigation records, or government enforcement actions involving CMBlu were found in public
      sources through June 2026.
    whyItMatters: >-
      Absence of public adverse records does not confirm absence of material legal or operational issues given the
      company's private status and no mandatory disclosure regime.
    diligencePath: >-
      Conduct legal due diligence search on CMBlu Energy AG in German commercial and court registers; request reps and
      warranties from management.
    relatedQuestionRefs:
      - QO022
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Private co-investors in the Series C round have not been individually named in any public CMBlu announcement.
    whyItMatters: >-
      Unknown investor identities prevent assessment of governance conflicts, follow-on financing capacity, and investor
      quality beyond Samsung and STRABAG.
    diligencePath: Request full capitalization table and Series C investor list from the company under NDA.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Internal R&D milestones, intellectual property patent filing dates, and pre-2023 commercial trial results are not
      captured in public sources.
    whyItMatters: Undisclosed milestones may reveal delays, failed pilots, or IP challenges not visible from press coverage.
    diligencePath: >-
      Request IP landscape analysis and timeline of patent filings; review any German and Austrian regulatory
      pilot-project filings.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: LDES-barriers
    missingEvidence: >
      Independent third-party LCOE comparison of CMBlu SolidFlow versus Chinese vanadium flow batteries at 10-year and
      20-year system lifetimes, with costs stated in comparable per-MWh terms at the same discharge duration (10 hours).
    whyItMatters: >
      Without a credible LCOE comparison, it is not possible to verify whether organic flow batteries are
      cost-competitive versus Chinese VRFB at scale—a key question for utility procurement decisions and investor due
      diligence on pricing risk.
    diligencePath: >
      Commission an independent energy storage consultant (e.g., Lazard, Aurora Energy Research) to model LCOE for
      SolidFlow versus the leading Chinese VRFB system at 10- and 20-year lifetimes, normalizing for the same duration
      and cycling assumptions.
    relatedQuestionRefs:
      - QM016
  - type: private-evidence-only
    severity: minor
    topic: CMBlu
    missingEvidence: >
      CMBlu's full commercial sales pipeline beyond the publicly announced Uniper 5 GWh agreement and the SRP Desert
      Blume project; additional utility, industrial, or data center customers that may have signed letters of intent,
      MOUs, or early-stage framework agreements.
    whyItMatters: >
      Customer concentration risk is material if only two customers (Uniper, SRP) represent the entire commercialized
      pipeline heading into scale-up; the full picture of committed demand versus manufacturing capacity is needed for
      supply-demand forecasting.
    diligencePath: >
      Request a pipeline summary from CMBlu management under NDA; cross-check with public news monitoring and
      patent/project permit filings in target geographies.
    relatedQuestionRefs:
      - QM020
  - type: missing-source
    severity: minor
    topic: LDES-market
    missingEvidence: >
      Detailed LDES value chain cost breakdown allocating total system cost among battery stack/cells,
      electrolyte/active material, balance-of-system components, EPC/installation, and O&M—publicly available for
      organic flow batteries specifically.
    whyItMatters: >
      Without a value chain cost breakdown it is difficult to assess where manufacturing scale-up will drive the
      steepest cost reductions, and whether CMBlu's organic chemistry cost advantage over vanadium flows through to
      system-level economics or is offset by BOS/EPC costs.
    diligencePath: >
      Seek publicly available NREL or DOE studies on flow battery system cost decomposition; compare against CMBlu's own
      quoted system price per kWh.
    relatedQuestionRefs:
      - QM026
  - type: missing-source
    severity: material
    topic: cost-claims-unverified
    missingEvidence: >-
      Independent third-party audited LCOS and installed cost data from CMBlu's first commercial GWh-scale deployment
      under the Uniper supply agreement.
    whyItMatters: >-
      CMBlu's $0.05/kWh LCOS and $15M/GWh CAPEX claims are company-asserted; investors and off-takers need real-world
      operational data at scale before committing project finance at competitive cost of capital.
    diligencePath: >-
      Request access to Uniper pilot deployment cost and performance data when first unit is commissioned (expected
      2027); commission independent techno-economic assessment against comparable VRFB and iron-flow projects.
    relatedQuestionRefs:
      - QP009
      - QP011
  - type: private-evidence-only
    severity: material
    topic: bankability
    missingEvidence: >-
      Third-party bankability certification or lender technical acceptance from a major project-finance institution for
      CMBlu's Organic SolidFlow technology.
    whyItMatters: >-
      Without lender technical acceptance, large utility project finance for CMBlu projects carries a higher cost of
      capital, slowing growth relative to bankable alternatives such as Eos Energy (DOE-backed) and lithium-ion
      (established track record with lenders).
    diligencePath: >-
      Request insurance terms, lender technical assessments, performance guarantees, and any independent reliability
      testing from CMBlu's current commercial pipeline projects.
    relatedQuestionRefs:
