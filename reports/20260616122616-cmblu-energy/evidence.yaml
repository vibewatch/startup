  - type: private-evidence-only
    severity: material
    topic: certification documentation
    missingEvidence: >
      Published IEC 62619, IEC 62933, UL 9540, and UL 1973 certificate numbers and issuing lab reports for the SolidFlow
      commercial product.
    whyItMatters: >
      Utility grid interconnection, project financing, and insurance typically require confirmed compliance with IEC/UL
      certification stacks. CMBlu describes ISO and IEC compliance but does not publish certificate numbers or test
      report summaries.
    diligencePath: >
      Request CMBlu's certification register and test lab names directly. Cross-check against UL Solutions and TÜV SÜD
      online certificate databases. If certificates are pending, confirm expected timeline and whether Uniper/SRP have
      executed provisional compliance agreements.
