  - type: missing-source
    severity: material
    topic: organic molecule stability at commercial scale
    missingEvidence: >
      Peer-reviewed or independently validated data on CMBlu's specific proprietary organic compound degradation rates
      under commercial cycling conditions (>2,000 cycles, commercial temperatures, varying states-of-charge).
    whyItMatters: >
      The shuttle effect and oxidative decomposition of organic molecules are known failure modes in the ORFB
      literature. Without CMBlu-specific stability data, it is not possible to independently assess whether the
      20,000-cycle claim is achievable with the specific lignin-polymer chemistry in the deployed product.
    diligencePath: >
      Review CMBlu's internal cycling test reports if accessible under NDA. Monitor academic publications from
      Argonne/INL co-investigators. Search for any peer-reviewed publications co-authored by CMBlu scientists on
      electrolyte stability.
  - type: missing-source
    severity: minor
    topic: developer and practitioner community engagement
    missingEvidence: >
      Evidence of CMBlu's engagement with the broader electrochemical engineering and energy storage practitioner
      community (publications, conference presentations, open-source tooling, standards-body participation).
    whyItMatters: >
      CMBlu is a hardware manufacturer with no public software/API developer surface. Limited public engineering
      discourse reduces external scrutiny of technical claims and may slow identification of deployment issues.
    diligencePath: >
      Search IEEE Xplore and ECS Digital Library for publications by CMBlu authors. Check Energy Storage Summit and EES
      Europe conference proceedings. Request CMBlu's list of industry working group memberships.
