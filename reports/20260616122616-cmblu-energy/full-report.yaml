      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Research-More at Stretched Valuation
            body: >-
              At €1B+ ($1.17B) post-money with approximately $1M in estimated current revenue, CMBlu Energy's valuation
              is priced for near-perfect execution through 2028. The LDES opportunity is structural and real, SolidFlow
              is credibly differentiated, and the Uniper agreement provides a visible commercial pathway. However, the
              evidence base does not yet support a buy recommendation. The investment decision should be deferred until
              cap-table transparency, audited financials, Uniper contract firmness, and manufacturing scale-up
              credibility are established through direct diligence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV046
              - CV021
