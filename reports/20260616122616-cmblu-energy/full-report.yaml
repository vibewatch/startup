  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Diligence Path
    rows:
      - - Revenue and financial model
        - Audited revenue, ARR, burn rate, and gross margin for FY2024 and FY2025
        - >-
          Cannot assess valuation multiple or runway without actual financials; estimated $1M revenue implies >1,000x
          multiple; burn rate determines Series C runway adequacy
        - >-
          Request management accounts or auditor letter from CMBlu CFO; cross-check against STRABAG annual report if
          CMBlu is a material consolidated entity
      - - Cap table and preference stack
        - >-
          Full cap table including STRABAG €100M liquidation preferences, anti-dilution provisions, and participating
          rights from all prior rounds
        - >-
          STRABAG's preferential terms could severely dilute Series C investors in a down-round or moderate-exit
          scenario; effective entry price for common equity could be substantially worse than the €1B+ headline
        - >-
          Request waterfall model from CMBlu management; independent legal review of STRABAG investment agreement under
          NDA
      - - Uniper contract conditions precedent
        - >-
          Full list of conditions precedent, technical acceptance thresholds, and delivery schedule under the 5 GWh
          framework agreement
        - >-
          The conditional contract is the primary commercial anchor for the bull thesis; if conditions are stringent or
          linked to unachievable milestones the pipeline could evaporate before any revenue
        - >-
          Review full contract documents with CMBlu and Uniper legal counsel; obtain written confirmation from Uniper on
          current conditions status and next milestones
      - - Manufacturing scale-up plan
        - >-
          Detailed capex budget, equipment sourcing, milestone schedule, and independent technical risk assessment for
          scaling from 1 GWh/year to 10 GWh/year by 2029
        - >-
          Scale-up is the single largest execution risk; organic chemistry manufacturing at industrial scale is novel
          for this chemistry; cost over-runs or delays directly collapse the base and bull cases
        - >-
          Commission independent technical due diligence (TÜV SÜD, EPRI, or equivalent); review factory design and
          supplier contracts; validate US and Greece site plans
      - - Competitive LCOS benchmarking
        - >-
          Independent levelized cost of storage comparison of SolidFlow versus vanadium flow battery and lithium-ion
          BESS for 5–24 hour applications under real-world operating conditions
        - >-
          CMBlu claims $15M/GWh CAPEX vs $100M for Li-ion; independent validation needed to confirm cost advantage
          durability as Li-ion prices fall and vanadium flow matures
        - >-
          Engage Wood Mackenzie or BNEF for independent cost benchmarking study; cross-check against vanadium CAPEX data
          and Fluence/Tesla pricing for equivalent duration systems
    notes: >-
      Diligence paths are recommended approaches; access to CMBlu management accounts requires NDA and investor
      engagement; Uniper contract review requires bilateral permission.
