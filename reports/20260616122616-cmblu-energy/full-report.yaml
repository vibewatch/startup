      - number: '7.2'
        title: Technical and Operational Risks
        blocks:
          - type: paragraph
            body: >
              CMBlu's primary technical risk is insufficient long-term commercial field data. The company's first major
              industrial deployment—an 11 MWh system at Mercedes-Benz Rastatt—was planned for Q2 2025, and the Arizona
              Desert Blume SRP pilot (5 MW/10-hour) was in engineering as of March 2025 with operational targets
              extending to 2027. While Argonne National Laboratory and Idaho National Laboratory are validating CMBlu's
              SolidFlow battery, no multi-year commercial-scale performance dataset is yet publicly available. Salt
              River Project's Chico Hunter stated directly that SRP wants "a few years" of real-world data before
              committing to the technology at scale.


              The organic electrolyte chemistry presents two specific degradation vectors: molecule decomposition under
              repeated redox cycling (which can reduce capacity and require electrolyte replenishment) and crossover of
              organic molecules through the ion-exchange membrane (which causes irreversible capacity fade). CMBlu's
              solid-state storage materials partially mitigate crossover compared with pure liquid flow batteries, but
              neither risk has been quantified over 10–20-year commercial lifetimes.


              At the operational level, CMBlu must scale from 1 GWh/year at its Alzenau gigafactory to 10+ GWh/year
              across Germany, Greece, and the US by 2029—a 10x increase in 36 months. The Greece facility (targeting 800
              MW/~4 GWh annual capacity) requires construction starting in H2 2025 and production in late 2026. Flow
              battery manufacturing lacks standardized equipment and processes, requiring bespoke production lines for
              stacks, membranes, tanks, and control electronics. Battery gigafactory capex averages $80/kWh-pa globally,
              with US and EU costs up to 2x Chinese competitors. CMBlu's own CAPEX target of $15M/GWh has not yet been
              validated at multi-GWh commercial scale.
