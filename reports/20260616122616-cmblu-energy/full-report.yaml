      - number: '6.2'
        title: Named Deployments and Commercial Adoption Trajectory
        blocks:
          - type: paragraph
            body: >
              CMBlu's commercial deployment sequence began in July 2023 with Burgenland Energie's pilot at the
              Schattendorf wind-solar hybrid park in eastern Austria—the world's first operational Organic SolidFlow
              installation, initially housed in a 40-foot container connected directly to a 15 MW PV plant. In the same
              month, CMBlu announced a demonstration project with WEC Energy Group and EPRI at WEC's Valley Power Plant
              in Milwaukee, Wisconsin, targeting 1–2 MWh over 5–10 hour discharge durations, with testing beginning in
              Q4 2023. Burgenland Energie's CEO Stephan Sharma stated a goal of 300 MWh of SolidFlow storage capacity by
              2030, indicating expansion intent.

              In September 2023, Salt River Project (SRP) selected CMBlu through a competitive RFP process for the
              "Desert Blume" project: a 5 MW / 50 MWh pilot at SRP's Copper Crossing Energy and Research Center in
              Florence, Arizona. CMBlu builds, owns, and operates the system on SRP's behalf—a build-own-operate model
              that shifts capital risk to CMBlu. SRP's CEO Jim Pratt confirmed the project supplements the utility's
              power system for "longer periods, especially in times of fluctuating, high energy demand." EPRI was
              engaged for independent performance monitoring. Construction was initially targeted for early 2025 with a
              December 2025 go-live; the SRP press release was updated to reflect a revised online date of December
              2027—a two-year slippage. In March 2025, CMBlu announced Rubicon Professional Services as design and
              engineering partner, confirming active construction preparation.

              In March 2024, Mercedes-Benz placed a single-digit-euro-investment order for an 11 MWh SolidFlow system at
              its Rastatt, Germany production facility, with installation planned for the second half of 2025. In
              December 2023, Argonne National Laboratory and Idaho National Laboratory were selected by the DOE's Office
              of Clean Energy Demonstrations as one of six long-duration storage lab demonstrations to validate
              SolidFlow for microgrid and EV charging use cases (multi-year, 2024–2027).

              The commercial milestone of the period was the January 20, 2026 conditional supply framework with Uniper
              Kraftwerke GmbH—structured as 5 GWh minimum, callable in 100 MWh tranches starting in 2027, through 2037.
              This followed a successful Site Acceptance Test (SAT) of a 1 MW / 1 MWh SolidFlow system at Uniper's
              Staudinger power plant in Germany. Uniper's Director of Innovation stated publicly that while the
              technology is "promising," its "performance and economic viability still need to be further demonstrated
              in large-scale deployment." In April 2026, CMBlu crossed the €1 billion valuation threshold with a €50
              million Series C initial close, supported by Samsung Ventures and all existing investors including STRABAG
              SE.
