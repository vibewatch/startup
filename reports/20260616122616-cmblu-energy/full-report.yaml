  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buyer Landscape
        blocks:
          - type: paragraph
            body: >
              CMBlu Energy's commercial focus spans three principal buyer segments: utility and grid operators seeking
              long-duration renewable firming and grid balancing; commercial and industrial (C&I)
              facilities—particularly manufacturers—wanting to achieve 24/7 clean energy by pairing solar generation
              with multi-hour storage; and data center and hyperscaler operators whose AI and cloud workloads require
              dependable overnight capacity as electricity demand outpaces grid expansion. Of these three, only utility
              and C&I segments have named deployments or commercial agreements as of June 2026. The data center segment
              is actively positioned in CMBlu's public messaging—the April 2026 Series C press release explicitly frames
              SolidFlow as "baseload infrastructure for AI and data centers"— but no data center contract has been
              publicly announced.

              Within the utility segment, buyers span three countries: Germany (Uniper, with a 5 GWh conditional supply
              framework), Austria (Burgenland Energie, the world's first commercial SolidFlow deployment at Schattendorf
              since July 2023), and the United States (Salt River Project in Arizona with its 5 MW / 50 MWh Desert Blume
              pilot and WEC Energy Group in Milwaukee, Wisconsin, with a 1–2 MWh test). In the C&I segment,
              Mercedes-Benz ordered an 11 MWh system for its Rastatt manufacturing plant in Germany in March 2024. The
              CMBlu homepage also lists PPC (Greek public power utility) under "Trusted By," but no specific project for
              PPC has been publicly disclosed. The US Department of Energy, through Argonne and Idaho National
              Laboratories, is conducting a multi-year SolidFlow demonstration that validates technology for microgrid
              and EV charging applications but does not represent a commercial revenue customer. CMBlu's customer
              acquisition pathway follows an RFP-to-pilot-to-commercial-framework progression, with typical multi-year
              lead times between initial engagement and supply agreement, as evidenced by the Uniper relationship
              described as "long-standing" prior to the January 2026 framework.
