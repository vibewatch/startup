      - number: '2.2'
        title: Market Sizing – Global, European, and German Context
        blocks:
          - type: paragraph
            body: >
              The global LDES market was valued at $3.27 billion in 2025 and is projected to reach $3.4 billion in 2026,
              growing to $4.93 billion by 2034 at a 4.75% CAGR according to Fortune Business Insights—a conservative
              estimate reflecting a narrow technology scope. Global Market Insights places the 2026 figure somewhat
              higher at approximately $3.9 billion, with a CAGR of 10.5–13.9% through 2035 reflecting a broader
              definition. The discrepancy in estimates (ranging from $3.4 billion to over $6 billion depending on
              methodology) reflects divergent scope assumptions and growth-rate forecasts; this chapter treats the
              Fortune / GMI range as the primary sizing reference and notes that project-finance mobilization is
              typically 3–5× the revenue-based figure. The flow battery sub-segment within LDES was valued at $1.12–1.15
              billion in 2025, growing to $1.22–1.39 billion in 2026. Mordor Intelligence projects flow batteries at
              $3.88 billion by 2031 (22.84% CAGR), driven by declining electrolyte leasing costs and mandates for 8-hour
              discharge capability; Fortune Business Insights is more conservative at $2.88 billion by 2034 (11.28%
              CAGR). Europe accounted for approximately $1.03–1.07 billion in 2025–2026 (31.5% of the global LDES
              total), with Germany as the most dynamic single market. Germany's total installed battery capacity reached
              17.9 GW / 27.2 GWh by end of Q1 2026, but Fraunhofer ISE estimates the country needs 104 GWh by 2030 and
              up to 180 GWh by 2045—a structural gap of several multiples. Globally, battery additions reached 108 GW in
              2025 per IEA data, a 40% year-on-year increase driven by utility-scale deployments and a 90%+ decline in
              battery costs since 2010. The LDES Council projects that 8 TW / 85–140 TWh of LDES will be needed globally
              by 2040 for a net-zero power system, requiring a 50-fold acceleration in deployment speed—underscoring the
              massive structural opportunity relative to current deployment.
