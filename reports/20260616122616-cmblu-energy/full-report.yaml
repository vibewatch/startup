  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - Organic active material (solid polymer)
        - Stores electrochemical energy as solid redox particles in tanks
        - Lignin/bioplastics feedstock supply; synthesis scale-up
        - Organic molecule degradation (shuttle, oxidative decomposition) under extended cycling
      - - Aqueous organic electrolyte (liquid phase)
        - Carries ions; suspends/interacts with solid particles; pumped to stacks
        - Water quality; electrolyte chemistry stability
        - Viscosity changes at high concentrations; membrane fouling over time
      - - Ion-exchange membrane / separator
        - Separates anolyte/catholyte; permits ionic conductivity; blocks macromolecule crossover
        - Membrane supplier qualification; chemical compatibility
        - Selectivity-conductivity trade-off; potential organic crossover reducing capacity
      - - Electrochemical cell stack
        - Site of oxidation/reduction reactions; determines power output (kW/MW)
        - Electrode material quality; stack manufacturing precision
        - Stack performance consistency at scale; efficiency losses at high current density
      - - 'Balance-of-plant (BOP): pumps, valves, tanks, thermal management'
        - Circulates electrolyte; manages flow rates, temperature, pressure
        - Pump reliability; materials compatibility with organic electrolyte
        - Auxiliary load contributes to ~15% efficiency gap vs cell-level spec; pump MTBF at 20yr lifetime TBD
      - - Software-defined Battery Management System (BMS)
        - Controls charge/discharge cycles; predictive maintenance; grid integration
        - Proprietary software; cybersecurity
        - BMS maturity for utility SCADA integration not yet independently validated
    notes: >
      Architecture layers derived from CMBlu product documentation, Utility Dive technical interview, PV Magazine
      technical description, and Argonne partnership announcement. BOP efficiency drag is an analytical inference from
      the 75%/90% efficiency discrepancy; exact auxiliary-load split is not publicly disclosed.
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE008
      - CE031
      - CE033
      - CE039
      - CE042
