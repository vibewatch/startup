    title: Product Maturity / Capability Matrix
    type: matrix
    layout: wide
    summary: >
      Assessment of CMBlu SolidFlow maturity across six capability dimensions versus vanadium redox flow and lithium-ion
      benchmarks.
    data:
      columns:
        - CMBlu SolidFlow
