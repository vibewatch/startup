  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >
              Long-duration energy storage (LDES) is defined by the US Department of Energy as storage systems capable
              of delivering electricity for ten or more hours at rated power. CMBlu's Organic SolidFlow battery is an
              electrochemical LDES technology combining organic redox flow chemistry with solid-state storage materials,
              specifically designed for multi-hour stationary applications of 10 hours or more. The primary addressable
              market boundary encompasses all stationary electrochemical storage deployments of 10+ hours duration that
              serve grid operators, utilities, industrial off-takers, and data center operators in front-of-meter and
              behind-the-meter configurations. Included spend covers utility-scale grid balancing (renewable firming,
              capacity market participation, frequency regulation), industrial backup power, and data center multi-hour
              infrastructure. Excluded from the primary boundary are lithium-ion systems below four hours' duration (the
              dominant BESS market), pumped hydroelectric storage, compressed air energy storage, gravity storage,
              thermal energy storage, and consumer residential systems. Status-quo substitutes include short-duration
              lithium-ion paired with gas peakers, diesel generators for backup, and vanadium redox flow batteries from
              Asian manufacturers. Within the flow battery sub-segment, organic chemistry (used by CMBlu) is
              differentiated from vanadium redox (the dominant sub-type at ~80% revenue share) by its avoidance of
              critical minerals, non-flammable water-based electrolytes, and claimed energy density of 5 to 10 times
              that of conventional flow batteries. This market definition establishes the analytic boundary for all
              sizing, buyer, and driver analysis in this chapter.
