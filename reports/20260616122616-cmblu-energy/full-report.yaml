      - number: '4.2'
        title: Unit Economics and Cost Architecture
        blocks:
          - type: paragraph
            body: >-
              CMBlu's unit economics case rests on two company-claimed benchmarks: a manufacturing capital intensity of
              approximately $15 million per GWh (versus roughly $100 million per GWh for lithium-ion) and a lifetime
              LCOS target of $0.05/kWh. Both metrics flow from CMBlu's decision to build SolidFlow using organic
              polymers and water-based electrolytes that do not require clean-room assembly, eliminate the need for
              critical minerals, and allow power and energy capacity to scale independently. Because the energy storage
              tank can be enlarged independently of the power stack, per-kWh cost falls as system duration extends— a
              structural advantage that CMBlu claims makes SolidFlow cost-competitive with lithium-ion at durations
              above approximately five hours and increasingly advantageous at 10+ hours.


              The company's US president Giovanni Damato confirmed in Utility Dive coverage that SolidFlow is
              competitive with lithium-ion for durations above five hours, while acknowledging that gathering sufficient
              operational data to finance large commercial projects is the single biggest hurdle as of early 2026.
              Uniper's innovation director reinforced this point, stating that SolidFlow's economic efficiency still
              needs confirmation at commercial scale. These corroborating adverse statements underscore that the
              $15M/GWh and 5 ¢/kWh claims remain unverified targets rather than proven commercial-scale economics. Flow
              battery companies at comparable early-commercial stages typically carry negative or very low gross margins
              due to R&D amortization, manufacturing ramp costs, and low initial volumes.


              Industry benchmark installed capex for vanadium redox flow batteries in 2026 ranges from approximately
              $450–$750 per kWh at typical utility scale (2–8-hour duration), with best-in-class long-duration projects
              approaching $284–$450/kWh. Organic flow batteries sit at an earlier commercialization stage and lack a
              validated market-wide benchmark. CMBlu's claimed manufacturing economics are substantially more aggressive
              than both the vanadium and organic flow precedents, which heightens the importance of independent
              verification.
