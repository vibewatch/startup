      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              CMBlu Energy AG was founded in 2014 by Dr. Peter Geigle, a German biotech entrepreneur who began research
              into organic flow battery chemistry as early as 2011. Geigle served as founder and CEO from incorporation
              through early 2024. In March 2024, Constantin Eis was appointed CEO with Dr. Geigle transitioning to
              Supervisory Board Chair, consistent with the German Aktiengesellschaft two-tier governance model that
              formally separates executive management from supervisory oversight. This transition signals a deliberate
              shift from founder-led R&D toward commercial industrialization.

              The current executive leadership team consists of Dr. Nastaran Krawczyk as Chief Technology Officer, Olaf
              Althaus as Interim CFO, Markus Geigle as EVP Sales and Marketing, Dr. Jan Prochnow as EVP Product
              Development, Alexander Stripling as EVP Operations, Dr. Marco Brand as General Counsel, Giovanni Damato as
              President of the United States division based in Petaluma, California, and George Paterakis as President
              of Greece operations. CMBlu's workforce includes over 150 scientists and engineers among its 250-plus
              total employees, reflecting significant R&D depth and a technology-first culture inherited from the
              company's research-lab origins.

              Key-person dependency is a material governance consideration. Dr. Geigle holds the founding IP vision and
              deep organic electrochemistry expertise; his retention on the Supervisory Board mitigates transition risk,
              but the company's scientific credibility remains closely tied to his research legacy. The Interim
              designation for the CFO role creates succession uncertainty in a capital-intensive phase. The broader
              Supervisory Board composition beyond Dr. Geigle is not publicly disclosed, which is a governance
              transparency gap. No major adverse leadership events—departures, public disputes, or enforcement
              actions—have been publicly reported against any named executive.
