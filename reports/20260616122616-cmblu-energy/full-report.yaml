      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: FEOC-Safe, Non-Lithium Architecture — Structural Competitive Advantage
            body: >
              CMBlu's SolidFlow technology avoids all Foreign Entity of Concern supply chains, making it fully eligible
              for US IRA tax incentives including the Section 45X advanced manufacturing credit and the domestic content
              ITC adder, potentially reaching a 40 percent ITC benefit. At a moment when FEOC restrictions are actively
              tightening and lithium-ion OEMs face growing procurement uncertainty, CMBlu's organic chemistry and
              localized supply chain represent a structurally differentiated competitive position that is difficult for
              China-supply-dependent competitors to replicate quickly.
            calloutType: strength
            claimRefs:
              - CO039
              - CO040
          - type: callout
            title: Commercial Scale Unproven; Execution Timeline Already Slipped
            body: >
              Uniper's Director of Innovation stated at the January 2026 framework agreement signing that SolidFlow's
              "performance and economic viability still need to be further demonstrated in large-scale deployment." The
              Desert Blume project with SRP has already been delayed by two years from December 2025 to December 2027.
              CMBlu has no publicly disclosed revenue, and the 10 GWh capacity target by 2029 remains a company claim
              without independent validation. The combination of a conditional offtake, a slipped pilot timeline, and
              zero disclosed revenue at EUR 1 billion valuation represents material execution risk.
            calloutType: risk
            claimRefs:
              - CO034
              - CO023
              - CO019
          - type: callout
            title: Unicorn Valuation at Pre-Revenue Commercial Stage Reflects Forward-Looking Bet
            body: >
              CMBlu achieved a EUR 1 billion valuation with no disclosed revenue, a 1 GWh/year manufacturing facility,
              and its largest customer commitment conditional on further performance demonstrations. The valuation is
              driven by forward-looking expectations around the non-lithium LDES market, FEOC policy tailwinds, and AI
              data center energy demand. Investors are pricing future gigawatt-hour deployment capacity rather than
              current operating fundamentals, which creates both significant upside potential if scale-up succeeds and
              meaningful downside risk if execution, cost, or technology challenges delay the pathway to commercial
              gigawatt-scale deployment.
            calloutType: insight
            claimRefs:
