  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: SolidFlow Core Architecture and Chemistry
        blocks:
          - type: paragraph
            body: >
              CMBlu's Organic SolidFlow battery is a hybrid architecture that fuses the decoupled power-energy scaling
              of a redox flow battery with the higher energy density achievable when solid organic polymer particles
              supplement the dissolved electrolyte. The active chemistry consists of carbon-based organic compounds —
              derived from lignin-based and related bioavailable feedstocks — stored as solid particles in external
              tanks alongside a water-based (aqueous) organic electrolyte. During operation, this electrolyte-slurry
              mixture is pumped from the storage tanks into electrochemical cell stacks, where oxidation (charging) and
              reduction (discharging) reactions occur at porous electrodes within separate anolyte and catholyte
              circuits. A selective ion-exchange membrane separates the two half-cells, allowing small ions to migrate
              for charge balance while blocking the larger organic macromolecules to prevent crossover and capacity
              fade.


              The fundamental advantage of the SolidFlow architecture is the decoupled scaling principle: power output
              (kW/MW) is determined solely by the size and count of electrochemical cell stacks, whereas storage
              capacity (kWh/MWh/GWh) is governed entirely by the volume of active material in the external tanks.
              Increasing duration therefore requires adding electrolyte volume and organic solid, not additional power
              electronics. This renders the CAPEX curve for long-duration applications structurally different from
              lithium-ion, where both power and energy scale together.


              The base commercial module delivers 10 kW of power output and 100 kWh of capacity in a compact 1.14 × 1.14
              × 1.60 m footprint. The official product spec sheet lists a 75% round-trip (AC-to-AC system) efficiency.
              Early award documentation cited 90% DC-to-DC efficiency at the cell/stack level — a materially different
              measurement that excludes pumping loads, power conversion losses, and thermal management; analysts
              treating the 90% figure as system efficiency will overstate project economics. The system operates at
              approximately atmospheric pressure (~1 atm), reducing parasitic loads and mechanical wear on pumps,
              valves, and seals compared to metal-based flow batteries that require elevated pressures for efficient ion
              exchange.
