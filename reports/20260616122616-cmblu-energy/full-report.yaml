      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >
              The primary buyers of multi-hour LDES are utilities and grid operators, followed by independent power
              producers (IPPs), data centers, and commercial and industrial operators. In Germany and the EU,
              traditional energy companies converting legacy fossil-fuel grid connections into battery storage assets
              dominate large-scale deployments: 9 of Germany's 14 largest battery installations commissioned in 2025
              belong to incumbents such as RWE, Uniper, LEAG, STEAG, and Verbund. These companies hold the pre-existing
              380 kV grid connections that are now the scarcest input for utility-scale BESS projects, creating a
              structural procurement advantage. CMBlu has already secured a 5 GWh conditional supply agreement with
              Uniper for deliveries from 2027 through 2037, representing the clearest validation of this buyer segment.
              Budget ownership in the utility segment spans regulated CAPEX for asset-owning utilities, project finance
              backed by long-term power purchase agreements for IPPs, and forthcoming capacity market remuneration
              expected from 2027. The second emerging buyer segment is hyperscale and AI data center operators, facing
              rising power density requirements (120–300 kW per rack for AI workloads) and increasing pressure to
              replace diesel backup generators. A 2026 survey by ZincFive found that 57% of data center professionals
              cite AI workloads as a driver of higher power density and footprint needs, and 52% highlight AI dynamic
              power management as a top battery selection criterion. Fire safety (76% priority) and total cost of
              ownership (84% priority) are the leading selection criteria, both advantageous for organic flow batteries.
              The third segment is commercial and industrial operators seeking behind-the-meter resilience and
              demand-charge management; the global C&I energy storage market is estimated at $7.94–18.7 billion in 2026.
              CMBlu's first US utility deployment with Salt River Project (SRP) at Desert Blume (5 MW, 10 hours)
              demonstrates early validation in the utility buyer segment outside Germany.
