      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Organic Chemistry Eliminates Critical-Mineral Risk
            body: >
              SolidFlow's feedstock — carbon-based organic compounds from lignin and bioplastics — contains no lithium,
              cobalt, nickel, or rare-earth metals. This makes it structurally immune to vanadium price volatility,
              Chinese supply-chain dependencies, and FEOC restrictions under the US Inflation Reduction Act, positioning
              CMBlu as one of very few long-duration storage technologies with a fully domesticatable supply chain.
            calloutType: strength
