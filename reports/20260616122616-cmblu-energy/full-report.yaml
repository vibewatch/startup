            title: Scale-Up Proof Remains the Critical Gate
            body: >
              All CMBlu's performance claims — 20,000 cycles, 20-year lifetime, $15M/GWh CAPEX, $0.05/kWh LCOS — derive
              from component testing, modeling, and small-scale pilots. TRL 7/8 is meaningful but not the same as
              bankable commercial deployment. CMBlu's own US president acknowledges that financing depends on field data
              not yet public. The 2027 Uniper tranches and the completed Mercedes-Benz/SRP installations will provide
