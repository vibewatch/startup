  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >
              CMBlu operates under three distinct regulatory regimes simultaneously—EU, Germany, and the United
              States—each experiencing significant instability or compliance deadlines in 2026. The EU Battery
              Regulation 2023/1542, fully in force since August 2025, imposes mandatory carbon-footprint declarations
              for all rechargeable industrial batteries above 2 kWh starting February 18, 2026, with a Digital Battery
              Passport requirement following in February 2027. These compliance costs are material for a scale-up stage
              company and require bespoke IT infrastructure and lifecycle assessment documentation that competitors with
              established compliance teams can absorb more easily.


              In Germany, the November 2025 EnWG amendment initially recognized large-scale BESS as privileged
              infrastructure, only for the Geothermal Energy Acceleration Act passed weeks later to restrict that
              privilege to facilities within 200 meters of substations or adjacent to 50+ MW generation plants. White &
              Case characterized the resulting framework as "still unclear and risks slowing growth." Germany's four
              TSOs have received nearly 700 grid-connection requests totaling ~250 GW but have installed only 3.5 GWh of
              large-scale BESS, underscoring how permitting friction can strand pipeline value. The EU's state aid
              approval for the German Renewable Energy Act expires December 31, 2026, creating further policy
              uncertainty around capacity market design.


              In the United States, NFPA 855:2026 now mandates a formal Hazard Mitigation Analysis (HMA) for nearly all
              stationary energy storage system installations, plus large-scale fire testing (LSFT) requirements. While
              CMBlu's non-flammable water-based electrolytes reduce fire risk compared with lithium-ion, the company
              must still complete HMA documentation for each US deployment. IRS Section 45X manufacturing credits
              ($35/kWh for battery cells) create a strong incentive for US production, but require "substantial
              transformation" in the US and FEOC-clean supply chains. On the IP front, CMBlu holds 20+ US and EU
              patents; no active litigation has been identified as of June 2026, but the risk of IP challenges increases
              as the company's commercial profile grows.
