chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              CMBlu Energy AG is a German deep-tech developer and manufacturer of long-duration energy storage systems,
              headquartered in Alzenau, Bavaria, Germany, near Frankfurt. Founded in 2014 by biotech entrepreneur Dr.
              Peter Geigle, the company emerged from one of Europe's largest lithium-free battery research laboratories
              and has since grown into a commercial energy storage scale-up with global ambitions. The company's stated
              mission is "empowering the world with unlimited energy storage inspired by nature." CMBlu describes itself
              as the sole inventor of the SolidFlow battery class and the largest battery business in the world not
              dependent on lithium.

              CMBlu's proprietary SolidFlow battery architecture combines organic redox flow and solid-state battery
              technologies. The system uses non-flammable, water-based electrolytes and avoids all critical raw
              materials including lithium, cobalt, and nickel, making it inherently safe, recyclable, and independent of
              constrained or geopolitically sensitive supply chains including FEOC-restricted sources. SolidFlow
              batteries are engineered to deliver ten hours or more of dispatchable energy per cycle, addressing one of
              the most urgent structural constraints limiting hyperscale data center growth.

              CMBlu's business model is hardware-first: the company designs, manufactures, and sells or deploys Organic
              SolidFlow battery systems to utilities, grid operators, data centers, and commercial and industrial
              customers. Manufacturing is anchored at its automated gigafactory in Alzenau, Germany, commissioned in
              2024 at 1 GWh/year initial capacity, with additional facilities under construction in Greece and in
              planning in Petaluma, California. The company differentiates on safety, long duration, FEOC-clean supply
              chains, and a claimed manufacturing CAPEX of approximately $15 million per GWh versus $100 million per GWh
              for comparable lithium-ion production facilities, an 85 percent cost advantage claimed by management that,
              if sustained at commercial scale, could reshape LDES economics.
