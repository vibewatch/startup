      - number: '8.4'
        title: Recommendation and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              CMBlu Energy presents a high-risk, high-optionality opportunity at the current €1B+ entry. The SolidFlow
              technology is credibly differentiated, the LDES tailwind is structural and accelerating, and the Uniper
              relationship provides a gateway to European utility-scale revenue. DOE support and national laboratory
              partnerships add institutional credibility. However, the valuation is stretched relative to current proof
              points. The implied revenue multiple exceeds 1,000x, the flagship commercial contract is conditional,
              cap-table dynamics are opaque, and the manufacturing scale-up from 1 GWh/year to 10 GWh/year is an
              unproven execution challenge for an organic chemistry process at industrial scale.

              The recommendation is research-more. An investment decision should be deferred until: (1) audited
              financials or management accounts confirm revenue trajectory and burn runway, (2) the full Uniper
              conditions precedent are disclosed and assessed for achievability, (3) the cap-table preference stack from
              STRABAG's €100M investment is reviewed under downside scenarios, (4) the 2027 manufacturing scale-up capex
              and milestones are independently validated, and (5) competitive pricing dynamics versus vanadium flow
              alternatives are independently benchmarked.

              The thesis-break triggers are clear and measurable: failure to deliver the first Uniper tranche by H1
              2028, manufacturing capacity remaining below 3 GWh/year by end 2028, a competitor securing a major
              hyperscale data-center contract ahead of CMBlu, significant lithium-ion BESS price compression making the
              5–10 hour window uneconomic, or a down-round within the next 12 months. The exit pathway most plausibly
              involves strategic acquisition by an energy major or infrastructure conglomerate—STRABAG's construction
              and infrastructure expertise suggests ongoing M&A interest—or a later-stage IPO following 2–3 years of
              commercial revenue track record.
            claimRefs:
              - CV049
