          - type: callout
            title: Efficiency Gap Creates Economic Modeling Risk
            body: >
              CMBlu's official product spec lists 75% AC-to-AC system efficiency, yet award submissions and early PR
              materials cite 90% DC-to-DC cell-level efficiency. A 15% gap is material to LCOS models. Uniper's
              conditional agreement and SRP's "wait-and-see" posture reflect this uncertainty. Buyers and financiers
              must demand independently measured AC system efficiency from deployed projects — not cell-level
              specifications — before committing to utility-scale procurement contracts.
            calloutType: risk
