      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Structural Market Undersupply: LDES Council Projects 8 TW / 85–140 TWh Needed by 2040'
            body: >
              The LDES Council's net-zero scenario analysis projects that global LDES capacity must reach 8 terawatts /
              85–140 terawatt-hours by 2040—a 50-fold acceleration over current deployment pace. Against this, global
              BESS (all durations) added only 108 GW in 2025 per IEA data, and the LDES sub-segment is a fraction of
              that. This structural gap between what renewable-heavy grids require and what is commercially deployed
              today represents the long-term market rationale for CMBlu's organic flow technology.
            calloutType: strength
            claimRefs:
              - CM017
              - CM015
              - CM016
          - type: callout
            title: 'Germany Regulatory Reversal: Grid Backlog and Policy Instability Threaten Project Bankability'
            body: >
              Germany's battery storage regulatory environment entered 2026 with significant uncertainty: building-code
              privileges granted to BESS in November 2025 were materially tightened within weeks, and the abolition of
              first-come-first-served grid connections has created a vacuum while a replacement maturity-scoring process
              is still being finalized. With 720 GW of pending grid connection requests—nine times Germany's peak
              load—and FCR revenue expected to compress as more batteries enter the market, project economics for new
              developments are under pressure. This is the most material near-term market constraint for CMBlu's
              European growth pipeline.
            calloutType: risk
            claimRefs:
              - CM038
              - CM039
              - CM040
          - type: callout
            title: AI Data Center Demand Creates New Buyer Segment for Fire-Safe Multi-Hour Storage
            body: >
              Hyperscale AI data centers are emerging as a structurally new buyer for organic flow batteries: 57% of
              data center professionals cite AI workloads as a driver of higher power density needs, and 76% prioritize
              chemistry safety in battery selection—precisely the two attributes where non-flammable organic flow
              batteries outperform lithium-ion. The CMBlu–EnergyTech framing of the Uniper agreement as equivalent to
              powering a 1 GW data center for five hours signals the company's awareness of this buyer segment, though
              no confirmed data center deal is public as of Q2 2026.
            calloutType: insight
            claimRefs:
              - CM023
              - CM024
              - CM031
          - type: callout
            title: Prioritize Utility Segment in EU While Building US Data Center Track Record
            body: >
              CMBlu's strongest near-term market is German/EU utilities with legacy grid connections and
              renewable-firming mandates—the Uniper framework validates this. A parallel strategy to secure one or two
              data center pilot contracts in the US or EU (leveraging fire-safe advantages and IRA FEOC-free
