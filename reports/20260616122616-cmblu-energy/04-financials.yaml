  - id: financial-gaps-and-diligence-blockers
    title: Financial Gaps and Diligence Blockers
    body: >-
      As a private company in early commercialization, CMBlu's financial disclosure
      is highly limited. No audited financial statements, P&L data, or cash flow
      information are in the public domain. Aggregated revenue estimates from third-
      party data services vary by more than an order of magnitude—from below $1M for
      the US subsidiary to $54M for the German parent—reflecting different legal
      entities, time periods, and estimation methodologies rather than verified
      figures. None of these estimates is corroborated by management or filed
      accounts, and reliance on them for underwriting would be inappropriate.


      The five blocking or material gaps are: (1) revenue and ARR/GMV—without which
      growth rate, revenue quality, and customer concentration cannot be assessed;
      (2) gross margin—without which the path to profitability and manufacturing
      efficiency cannot be evaluated; (3) cash burn and runway—without which the
      adequacy of the April 2026 Series C can only be estimated; (4) debt and full
      capital structure—there is no evidence of debt but no confirmed absence;
      (5) commercial-scale unit economics—the $15M/GWh CAPEX claim requires independent
      verification against Alzenau factory accounting and the first Uniper delivery
      economics. CMBlu's US head's own candid admission that the biggest hurdle is
      "getting more data and experience to finance projects" signals these gaps are
      recognized internally. Uniper's director similarly noted that SolidFlow
      "performance and economic efficiency still need to be further confirmed in
      large-scale use." Until audited financials or a transparent cap-table/P&L
      disclosure is provided, any financial model for CMBlu requires wide scenario
      bounds and should treat all line items below the valuation level as estimates.
    claimRefs:
      - CI023
      - CI024
      - CI035
      - CI036
      - CI031
      - CI043
