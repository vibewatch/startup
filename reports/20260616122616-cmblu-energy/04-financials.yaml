callouts:
  - calloutType: risk
    title: Unit Economics Claims Are Company-Stated Targets
    body: >-
      CMBlu's headline $15M/GWh manufacturing CAPEX and 5¢/kWh LCOS claims are
      stated on official company materials but have not been independently verified
      at multi-GWh commercial scale. First significant commercial deliveries begin
      with Uniper in 2027. Until field-validated economics are available—and
      confirmed by an independent cost audit—these figures should be treated as
      aspirational targets, not underwriting inputs.
    claimRefs:
      - CI031
      - CI035
      - CI036

  - calloutType: strength
    title: FEOC-Safe Supply Chain Unlocks US Policy Premium
    body: >-
      CMBlu's organic polymer chemistry avoids lithium, cobalt, nickel, and all
      foreign-entity-of-concern (FEOC) supply chains, giving US-deployed systems
      access to the Section 45X Advanced Manufacturing Production Credit and a
      domestic content ITC adder worth up to 40% combined once US manufacturing
      scales. This is a structural, reproducible cost advantage unavailable to
      Chinese-sourced battery competitors and meaningfully improves project
      economics for US customers under the post-Inflation Reduction Act regulatory
      environment.
    claimRefs:
      - CI020
      - CI030
      - CI022

  - calloutType: assumption
    title: Burn Rate and Runway Are Analyst Estimates Only
    body: >-
      No financial data confirming CMBlu's cash burn rate, monthly operating expense,
      or post-Series C runway has been publicly disclosed. The €2–5M/month estimate
      and 18–30-month runway range in this chapter are inferences from headcount and
      typical deep-tech cost profiles. Actual figures may differ materially. Any
      model relying on these numbers must apply wide scenario bands and should be
      updated from CFO-level disclosure before underwriting.
