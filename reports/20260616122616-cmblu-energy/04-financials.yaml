company:
  name: CMBlu Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    CMBlu Energy's revenue is anchored on B2B hardware system sales of SolidFlow
    long-duration battery technology to utilities, industrial facilities, and data
    centers, with a 5 GWh framework agreement with Uniper as the largest disclosed
    customer commitment. The company targets $15M/GWh manufacturing CAPEX and a
    5 ¢/kWh LCOS—claims not yet independently verified at commercial scale. With
    approximately $165M in disclosed equity raised and a Series C post-money
    valuation above €1B, near-term capital is adequate, but undisclosed revenue,
    gross margin, and burn rate prevent rigorous underwriting.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing Structure
    body: >-
      CMBlu Energy operates a pure B2B hardware-sales model: it manufactures and
      sells SolidFlow organic flow battery systems directly to utilities, grid
      operators, industrial facilities, and hyperscale data centers under long-term
      supply agreements. The Uniper framework agreement—signed January 2026 for at
      least 5 GWh deliverable between 2027 and 2037 in tranches of 100 MWh—is the
      largest publicly disclosed customer commitment and illustrates the company's
      go-to-market motion: technology-validation pilots leading to multi-GWh supply
      contracts. The detailed commercial pricing terms of the Uniper deal are not
      publicly disclosed, a structural opacity common in B2B infrastructure contracts.


      CMBlu's official manufacturing page lists a target system CAPEX of approximately
      $15 million per GWh and a target LCOS of as little as $0.05/kWh over system
      lifetime. Both figures are company-stated; neither has been independently audited
      at multi-GWh commercial scale as of June 2026. The $15M/GWh figure refers to the
      capital intensity of CMBlu's manufacturing approach—made possible by avoiding
      clean-room processes—rather than a universally confirmed per-unit sold price.
      Service and maintenance agreements are planned as a recurring-revenue layer
      alongside hardware supply, but details of these arrangements have not been
      publicly disclosed.


      CMBlu's preferred partnership with STRABAG SE opens a co-development channel
      where STRABAG's construction and infrastructure expertise is combined with
      CMBlu's battery technology to build "energy warehouses" for industrial and
      municipal customers. This channel does not change the hardware-centric revenue
      recognition model but expands distribution into STRABAG's project pipeline.
      Government demonstration projects—such as the US Department of Energy's Office
      of Clean Energy Demonstrations program with Argonne and Idaho National
      Laboratories—provide validation and some non-cash cost-sharing value but
      represent no material revenue stream as disclosed.
