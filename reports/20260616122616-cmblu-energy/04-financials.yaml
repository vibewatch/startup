  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        Audited or management-disclosed annual revenue, ARR, or revenue run-rate for
        CMBlu Energy AG and its subsidiaries for 2024–2025.
      whyItMatters: >-
        Without revenue data, investors cannot assess growth trajectory, revenue
        quality, customer concentration risk, or the company's proximity to
        commercial scale-up milestones.
      diligencePath: >-
        Request audited P&L under NDA directly from CMBlu's CFO; also seek
        the Uniper contract value and first-tranche delivery economics when available
        post-2027.
      relatedQuestionRefs:
        - QI011

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Gross margin percentage on hardware system sales and service delivery cost
        structure for CMBlu Energy AG.
      whyItMatters: >-
        Gross margin is the primary indicator of whether CMBlu's manufacturing
        economics are tracking toward the claimed $15M/GWh CAPEX target and whether
        the business can ever be self-funding.
      diligencePath: >-
        Request management accounts or P&L summary from CFO; cross-check against
        factory unit economics disclosure for the first Uniper 100 MWh tranche.
      relatedQuestionRefs:
        - QI012

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: >-
        Monthly cash consumption, quarterly operating cash flow, and post-Series C
        runway as confirmed by management.
      whyItMatters: >-
        Without burn data, the adequacy of the €50M Series C initial close cannot
        be confirmed, and the timeline to the next capital raise is unknown.
      diligencePath: >-
        CFO interview or board-level budget review; also assess headcount cost
        breakdown between R&D and commercial functions.
      relatedQuestionRefs:
        - QI013

    - type: missing-source
      severity: material
      topic: sales-cycle
      missingEvidence: >-
        Customer acquisition cost, average sales cycle length, and conversion rate
        from pilot project to full supply framework agreement for CMBlu.
      whyItMatters: >-
        Long B2B sales cycles (the Uniper deal followed a multi-year pilot) affect
        revenue visibility, working capital requirements, and the pace of pipeline
        conversion to recognized revenue.
      diligencePath: >-
        CFO or VP Sales disclosure; request pipeline data showing stage, expected
        close dates, and deal size for all active prospects.
      relatedQuestionRefs:
        - QI019

    - type: private-evidence-only
      severity: material
      topic: working-capital
      missingEvidence: >-
        Working capital profile, inventory position, and receivables/payables cycle
        for CMBlu's Alzenau gigafactory at current 1 GWh/year production.
      whyItMatters: >-
        Hardware manufacturing requires significant working capital for raw material
        inventory, work-in-progress, and potentially long customer payment terms on
        infrastructure-scale contracts.
      diligencePath: >-
        Request balance sheet and working capital schedule from CFO; assess
        inventory financing requirements for scale-up to 4 GWh at Alzenau.
      relatedQuestionRefs:
        - QI025

