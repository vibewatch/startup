  - id: capital-adequacy-and-financing
    title: Capital Adequacy and Financing History
    body: >-
      CMBlu has raised approximately $165 million in disclosed equity funding across
      two principal tranches: a €100 million ($106.7M) strategic equity investment
      from STRABAG SE in October 2023, and a €50 million initial close of its Series C
      round completed April 30, 2026, with participation from Samsung Ventures and all
      existing investors including STRABAG. Nordic9 reports total disclosed investment
      at $164.9M; Trending Topics cites industry-source estimates of approximately
      €250M total to date (including earlier pre-STRABAG investment), implying
      additional undisclosed early-stage capital. The company issued convertible
      preferred shares in the Series C at a post-money valuation exceeding €1 billion
      (~$1.17 billion at April 2026 exchange rates), crossing the unicorn threshold.
      The round remained open as of CEO Constantin Eis's May 2026 statements to
      Handelsblatt, suggesting a final close has not yet been announced.


      The Series C proceeds are designated for manufacturing scale-up and early
      commercial deployments in Europe and the United States. A 250-person workforce
      with 150+ scientists and engineers implies a significant payroll component; at
      typical deep-tech labor costs in Germany and the US, monthly cash consumption is
      likely in the €2–5M range, implying an estimated 18–30-month runway on the €50M
      initial close—though no burn rate or runway figures have been publicly confirmed
      by CMBlu. No publicly disclosed debt facilities, bond issuances, or project
      finance obligations have been identified; the company has relied entirely on
      equity financing through April 2026.


      US policy incentives represent a potential capital-efficiency lever. CMBlu's
      FEOC-safe supply chain and domestic US manufacturing roadmap position it to
      access the Section 45X Advanced Manufacturing Production Credit and a domestic
      content ITC adder, which together could provide up to a 40% effective investment
      tax credit benefit once US production is established—currently planned for 2029.
      Energy storage sector venture investment reached $4.8 billion across 75 deals
      in 2025 (a 30% YoY increase per Mercom Capital), providing a favorable backdrop
      for CMBlu's planned subsequent closes of the Series C and eventual next round.
