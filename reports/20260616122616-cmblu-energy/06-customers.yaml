callouts:
  - calloutType: risk
    title: "Single-Customer Concentration: Uniper Deal Carries Conditional Optionality"
    body: >
      The Uniper 5 GWh conditional supply framework is CMBlu's largest disclosed commercial
      anchor—but it is not a firm purchase order. Uniper retains full discretion to call off
      (or not) each 100 MWh tranche from 2027. Uniper's own Director of Innovation publicly
      qualified the deal: "performance and economic viability still need to be further
      demonstrated in large-scale deployment." If Uniper delays or reduces tranche calls,
      CMBlu loses its principal near-term revenue ramp while its manufacturing capacity
      scales at the Alzenau gigafactory.
    claimRefs:
      - CU016
      - CU025
      - CU026
      - CU031

  - calloutType: strength
    title: "Deepest Customer Validation: Utility Breadth Across Three Continents"
    body: >
      CMBlu has secured pilot or framework agreements with five distinct named customers
      across three countries (Germany, Austria, USA), spanning two utility markets and one
      C&I industrial reference—a meaningful breadth for a pre-commercial hardware company.
      The Uniper SAT completion represents the strongest form of third-party grid-services
      endorsement available for an early-stage LDES technology, and the SRP competitive RFP
      selection (from an open field of LDES entrants) confirms market-validated procurement
      interest. Burgenland Energie's multi-year operational continuity without a disclosed
      discontinuation is the strongest proxy for durable customer satisfaction.
    claimRefs:
      - CU007
      - CU011
      - CU013
      - CU014
      - CU021
      - CU023

  - calloutType: insight
    title: "Data Center Segment Is Marketing-Stage Only: No Customer Has Been Announced"
    body: >
      CMBlu's April 2026 Series C press release explicitly frames SolidFlow as "baseload
      infrastructure for AI and data centers," and the company's US strategy targets
      hyperscaler operators for its Petaluma, California facility. However, no data center
      or hyperscaler contract, LOI, or pilot agreement has been publicly disclosed. Investors
      valuing CMBlu on data center penetration should treat this segment as an aspiration
      rather than a proven channel, pending a named customer announcement.
    claimRefs:
      - CU004
      - CU034
      - CU043

