  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: retention
      missingEvidence: >
        CMBlu's publicly disclosed NRR, GRR, customer churn rate, or any form of cohort
        retention analysis—even as an industry benchmark proxy applied to CMBlu's customer base.
      whyItMatters: >
        Without retention metrics, it is impossible to assess whether CMBlu's pilots convert
        to recurring revenue or one-time placements, which is central to long-term customer
        value and investment thesis durability.
      diligencePath: >
        Request from CMBlu CFO or IR: (1) contracted backlog by customer, (2) repeat-order
        rate from existing pilot customers, (3) Burgenland Energie actual installed MWh as of
        2026 vs. 2030 target, (4) WEC Energy pilot EPRI results publication date.
      relatedQuestionRefs:
        - QU012

    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: >
        Evidence of any prospective customer choosing a competitor (e.g., Eos Energy,
        VoltStorage, Form Energy, Invinity) after evaluating CMBlu, or any documented
        failed RFP bid, which would quantify win/loss rates and market position.
      whyItMatters: >
        Without win/loss data, the 5-customer pilot portfolio cannot be distinguished from
        a broader commercial traction story versus a selective cherry-picking of the easiest
        early adopters with no hard competitive wins against incumbent alternatives.
      diligencePath: >
        Review US LDES RFPs from 2023–2026 (CPUC, NYPSC, MISO, PJM procurement dockets)
        for CMBlu participation; ask CMBlu for voluntary pipeline funnel data under NDA.
      relatedQuestionRefs:
        - QU023

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        Any public disclosure of revenue, contract values, MWh delivered, or project economics
        for CMBlu's sub-Uniper customer deployments (Burgenland Energie, WEC Energy, SRP, Mercedes-Benz).
      whyItMatters: >
        The absence of revenue data from all non-Uniper deployments makes it impossible to
        confirm whether CMBlu's revenue base beyond the conditional Uniper framework is
        material or negligible in sizing the commercial opportunity.
      diligencePath: >
        Request project-by-project revenue disclosure under NDA from CMBlu; review
        Burgenland Energie annual report for energy storage capital expenditure line items;
        cross-check with SRP regulatory filings in Arizona for Desert Blume project spend.
      relatedQuestionRefs:
        - QU026

    - type: stale
      severity: material
      topic: named-deployments
      missingEvidence: >
        Operational confirmation that the Mercedes-Benz Rastatt 11 MWh system was successfully
        installed in H2 2025 and is generating expected performance data as of June 2026.
      whyItMatters: >
        If the Mercedes-Benz installation was delayed, reduced in scope, or encountered
        technical issues, it would be a meaningful negative signal for the C&I segment
        readiness and CMBlu's delivery credibility.
      diligencePath: >
        Contact CMBlu PR (DJM Communication GmbH, Dr. Kai-Nils Eicke) for post-installation
        update; check Mercedes-Benz sustainability report 2025 for energy storage references;
        monitor CMBlu press releases.
      relatedTableRefs:
        - TU003

    - type: enumeration-incomplete
      severity: minor
      topic: customer-segmentation
      missingEvidence: >
        Confirmed project details (scale, timeline, use case) for PPC (Greek public power
        utility) listed as a "Trusted By" logo on the CMBlu homepage without any accompanying
        project announcement.
      whyItMatters: >
        PPC is one of Europe's largest utilities and could represent a material near-term
        customer in Greece. Without project confirmation, PPC's presence as a logo risks
        being interpreted as aspirational marketing rather than an active engagement.
      diligencePath: >
        Search Greek Ministry of Energy and PPC annual reports for CMBlu energy storage
        references; contact CMBlu's Athens subsidiary for PPC project status update.
      relatedTableRefs:
