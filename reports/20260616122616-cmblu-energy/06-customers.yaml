  - id: retention-expansion-concentration
    title: "Retention Evidence, Expansion Potential, and Concentration Risk"
    body: >
      CMBlu does not publicly disclose net revenue retention (NRR), gross revenue retention
      (GRR), or customer churn metrics. Given that the business is pre-commercial in revenue
      terms—all five named customers are in pilot or construction phase—traditional SaaS-style
      retention metrics are not applicable in their standard form. The closest proxy for
      retention durability is pilot continuation: Burgenland Energie has been operationally
      active since July 2023 (3+ years) without publicly announced discontinuation, and the
      Uniper pilot progressed from initial testing to a commercial supply framework, which
      represents the strongest evidence of customer satisfaction and intent to expand.

      Expansion potential within existing customers is material but conditional. Burgenland
      Energie has articulated a 300 MWh target by 2030 from an initial container-scale
      pilot—a 40× notional expansion. Uniper's framework allows tranches up to the 5 GWh
      aggregate, with service and maintenance agreements planned alongside supply contracts,
      providing long-term revenue extension. Mercedes-Benz's modular system is explicitly
      designed for future scaling ("easily go from a five- or six-hour base up to a 10- or
      12-hour base," per CMBlu's US president). However, all expansion is contingent on
      performance validation in each deployment.

      Concentration risk is acute. The Uniper 5 GWh framework represents CMBlu's only
      disclosed large-scale supply commitment and likely accounts for the vast majority of
      pipeline value. However, the agreement is conditional—Uniper controls the call-off
      timing and minimum tranche size, and may choose not to order. No financial terms (unit
      price, total contract value) have been disclosed. All other named customer deployments
      are in the sub-25 MWh range, and no revenue or contract values from these projects are
      publicly available. CMBlu's US president acknowledged in early 2024 that the biggest
      hurdle is "getting more data and experience to finance these projects." The data center
      and hyperscaler segment, which CMBlu is marketing aggressively as a growth vector,
      has no announced customer as of June 2026. Canary Media's independent analysis noted
      in 2023 that flow batteries historically carry "an outsize ratio of hype to actual
      performance," and SRP's Manager of Innovation stated that "the chance of guessing
      right on the first try is not high"—signals that procurement commitment for non-lithium
      LDES remains cautious even among engaged customers.
