  - id: TU005
    title: "Expansion Potential and Concentration Risk"
    columns:
      - Dimension
      - Description / Data Point
      - Impact
      - Diligence Path
    rows:
      - - Uniper concentration risk
        - "Single customer (Uniper) holds CMBlu's only publicly disclosed large-scale supply anchor at 5 GWh conditional. No other supply contract of comparable scale announced."
        - Critical—if Uniper does not call off tranches, CMBlu's largest near-term revenue source evaporates
        - Verify whether other utility supply discussions (pre-NDA) exist; monitor Uniper's annual grid storage investment plans
      - - Conditional optionality risk (Uniper deal)
        - "Framework is a call-option structure: Uniper may order 100 MWh+ tranches starting 2027, or decline. Financial terms undisclosed. Not a firm purchase order."
        - Material—conditional structure caps CMBlu's ability to book revenue or secure project financing against the deal
        - Request term sheet summary or confirmation of any non-refundable deposit; monitor each Uniper tranche call-off announcement
      - - Land-and-expand opportunity (Burgenland Energie)
        - "300 MWh target by 2030 from container-scale pilot; implies 40× expansion in storage capacity if target is met."
        - Material upside if achieved; validates CMBlu as primary LDES vendor for Austrian renewable hybrid parks
        - Confirm current installed capacity at Schattendorf; request annual expansion milestones from Burgenland Energie
      - - Land-and-expand opportunity (Uniper framework)
        - "5 GWh in 100 MWh tranches from 2027–2037; additional service/maintenance contracts planned across full system lifetime."
        - Significant—structured to expand incrementally across Uniper's 14 GW European generation portfolio if technology validated at scale
        - Track individual 100 MWh call-offs; confirm service agreement terms once supply begins
      - - Data center / hyperscaler channel risk
        - "CMBlu has publicly positioned SolidFlow as 'baseload infrastructure for AI and data centers' but has announced zero hyperscale contracts. No channel partner or reseller in this vertical disclosed."
        - Material downside risk if CMBlu's Series C is priced on data center penetration that does not materialize
        - Ask for LOI/MOU pipeline in data center segment; confirm Samsung Ventures strategic introductions
      - - SRP procurement non-exclusivity
        - "SRP Manager of Innovation confirmed the utility takes a 'technology-agnostic' approach and will use competitive RFPs for future storage. No exclusive relationship with CMBlu."
        - Medium—CMBlu must win each future procurement on merit; no lock-in
        - Monitor SRP storage RFPs for subsequent phases at Copper Crossing
    notes: >
      Concentration metrics are inferred from publicly available deal announcements. No
      customer revenue share data has been disclosed. All expansion figures (e.g., Burgenland
      300 MWh) are targets stated by the customer, not confirmed deployments.
    claimRefs:
      - CU025
      - CU026
      - CU031
      - CU034
      - CU045

