chapter:
  number: 6
  title: Customers
  summary: >
    CMBlu Energy's customer base as of June 2026 comprises five named pilot or pre-commercial
    deployments across Europe and North America—Uniper, Salt River Project, Mercedes-Benz,
    Burgenland Energie, and WEC Energy—anchored by a conditional 5 GWh framework supply
    agreement with Uniper signed January 2026 as the company's largest commercial milestone.
    All deployments remain in pilot or construction phase; the Uniper agreement's call-option
    structure (100 MWh minimum tranches, Uniper's discretion) limits revenue certainty, and
    no NRR, GRR, or churn metrics are publicly disclosed.

sections:
  - id: customer-segments-and-buyer-landscape
    title: "Customer Segments and Buyer Landscape"
    body: >
      CMBlu Energy's commercial focus spans three principal buyer segments: utility and grid
      operators seeking long-duration renewable firming and grid balancing; commercial and
      industrial (C&I) facilities—particularly manufacturers—wanting to achieve 24/7 clean
      energy by pairing solar generation with multi-hour storage; and data center and
      hyperscaler operators whose AI and cloud workloads require dependable overnight capacity
      as electricity demand outpaces grid expansion. Of these three, only utility and C&I
      segments have named deployments or commercial agreements as of June 2026. The data center
      segment is actively positioned in CMBlu's public messaging—the April 2026 Series C press
      release explicitly frames SolidFlow as "baseload infrastructure for AI and data centers"—
      but no data center contract has been publicly announced.

      Within the utility segment, buyers span three countries: Germany (Uniper, with a 5 GWh
      conditional supply framework), Austria (Burgenland Energie, the world's first commercial
      SolidFlow deployment at Schattendorf since July 2023), and the United States (Salt River
      Project in Arizona with its 5 MW / 50 MWh Desert Blume pilot and WEC Energy Group in
      Milwaukee, Wisconsin, with a 1–2 MWh test). In the C&I segment, Mercedes-Benz ordered
      an 11 MWh system for its Rastatt manufacturing plant in Germany in March 2024. The CMBlu
      homepage also lists PPC (Greek public power utility) under "Trusted By," but no specific
      project for PPC has been publicly disclosed. The US Department of Energy, through Argonne
      and Idaho National Laboratories, is conducting a multi-year SolidFlow demonstration that
      validates technology for microgrid and EV charging applications but does not represent
      a commercial revenue customer. CMBlu's customer acquisition pathway follows an
      RFP-to-pilot-to-commercial-framework progression, with typical multi-year lead times
      between initial engagement and supply agreement, as evidenced by the Uniper relationship
      described as "long-standing" prior to the January 2026 framework.
