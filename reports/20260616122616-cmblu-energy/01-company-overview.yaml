  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: revenue
      missingEvidence: "CMBlu has not disclosed any revenue, ARR, or gross margin figures in public sources as of June 2026."
      whyItMatters: "Financial performance is essential for assessing unit economics, path to profitability, and whether the EUR 1B+ valuation is supported by operating fundamentals."
      diligencePath: "Request unaudited management accounts, LOI pipeline values, and customer contract revenue commitments from management under NDA."
      relatedQuestionRefs:
        - QO013

    - type: missing-source
      severity: material
      topic: customers
      missingEvidence: "CMBlu does not publicly disclose a total customer count, revenue by customer, or churn and retention data."
      whyItMatters: "Customer concentration risk is unquantifiable without at minimum a count of active accounts and the revenue share of top customers such as Uniper and SRP."
      diligencePath: "Request full customer list under NDA; determine revenue attribution and contract commitment across Uniper, SRP, Burgenland Energie, WEC, and Mercedes-Benz."
      relatedQuestionRefs:
        - QO024

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Supervisory board composition beyond Dr. Peter Geigle and equity stakes of all shareholders other than STRABAG are undisclosed."
      whyItMatters: "Ownership concentration, board control dynamics, founder exit alignment, and governance risk cannot be assessed without cap table and board documentation."
      diligencePath: "Request shareholders agreement, full capitalization table, and supervisory board member list from the company."
      relatedQuestionRefs:
        - QO009
      relatedTableRefs:
        - TO002
        - TO003

    - type: missing-source
      severity: minor
      topic: adverse
      missingEvidence: "No regulatory filings, litigation records, or government enforcement actions involving CMBlu were found in public sources through June 2026."
      whyItMatters: "Absence of public adverse records does not confirm absence of material legal or operational issues given the company's private status and no mandatory disclosure regime."
      diligencePath: "Conduct legal due diligence search on CMBlu Energy AG in German commercial and court registers; request reps and warranties from management."
      relatedQuestionRefs:
        - QO022

    - type: enumeration-incomplete
