  - id: scale-kpis-and-milestones
    title: "Scale, KPIs, and Commercial Milestones"
    body: >
      CMBlu's operational scale reflects a company transitioning from R&D-stage to early commercial
      manufacturing. The Alzenau gigafactory, commissioned in 2024 with ABB robotics automation, operates
      at 1 GWh per year initial capacity on a stated path to 4 GWh/year. A second facility in Greece is
      under construction targeting 4 GWh/year with production from 2027, co-funded by EU-backed grant
      capital. A third US facility in Petaluma, California is in the planning stage with production targeted
      for 2029. CMBlu states a combined target exceeding 10 GWh annual capacity by 2029. The company employs
      more than 250 people including 150-plus scientists and engineers across Alzenau and Obernburg
      (Germany), Athens (Greece), and Petaluma, California (US).

      Key commercial milestones include the first commercial deployment in Austria with Burgenland Energie
      in July 2023; the 5 MW and 50 MWh Desert Blume pilot with Salt River Project in Florence, Arizona
      expected operational in December 2027 with EPRI performance monitoring; a 1-2 MWh pilot with WEC
      Energy Group in Milwaukee, Wisconsin; a 20 MWh deployment at Mercedes-Benz's Rastatt production
      facility; and the January 2026 conditional framework agreement with Uniper Kraftwerke GmbH for 5 GWh
      through 2037 with first deliveries from 2027. CMBlu won The smarter E Award 2025 in Energy Storage.

      Key technology specifications include a claimed round-trip efficiency of approximately 75 percent, a
      stated service life of up to 20 years, and a target levelized cost of storage as low as 5 cents per
      kWh. Revenue is not publicly disclosed, and there is no published ARR or customer count. Uniper's
      Director of Innovation cautioned at the January 2026 framework agreement signing that "performance and
      economic viability still need to be further demonstrated in large-scale deployment," underscoring that
      commercial proof points remain in progress. The Desert Blume operational date was revised from
      December 2025 to December 2027, reflecting execution timeline risk already materialized.
