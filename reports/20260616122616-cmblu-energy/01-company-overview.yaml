  - id: funding-history-capital
    title: "Funding History and Capital Structure"
    body: >
      CMBlu Energy has raised approximately $170 million in total capital across government grants,
      strategic equity investment, and venture capital through the Series C initial close in April 2026.
      The company received two small government grants in 2019 and 2022 as early R&D support prior to
      attracting institutional capital. The transformational financing event came in October 2023, when
      Austrian infrastructure group STRABAG SE made a $106.7 million strategic equity investment, the
      single largest financing at the time and STRABAG's first investment in an energy storage technology
      developer. This capital influx enabled manufacturing scale-up and cemented a strategic partnership
      that leverages STRABAG's large-infrastructure construction capabilities for future project delivery.

      In November 2024, CMBlu received a EUR 30 million grant from the Greek Ministry of Environment and
      Energy under the EU-funded Produc-e Green Recovery and Resilience program, the largest single award
      from that initiative. This non-dilutive capital enables construction of a second gigafactory in Greece
      without shareholder dilution and reflects EU-level support for European battery manufacturing
      independence from Asian supply chains.

      In April 2026, CMBlu closed the initial tranche of its Series C at EUR 50 million (approximately
      $58.5 million), led by Samsung Ventures with participation from all existing investors including
      STRABAG SE. This round crossed the EUR 1 billion valuation threshold, making CMBlu Germany's first
      non-lithium battery unicorn. The Series C round is reported to remain open for additional investors.
      No secondary transactions or debt financings have been publicly reported. Revenue and gross margin
      are not publicly disclosed, preventing independent assessment of the valuation's operational basis.
