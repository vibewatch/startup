callouts:
  - calloutType: risk
    title: STRABAG Concentration Is the Single Largest Capital Risk
    body: >-
      STRABAG SE contributed the majority of CMBlu's ~€250M lifetime capital, re-participated in the Series C, and is an industrial partner for manufacturing scale-up. Any strategic shift at STRABAG—management change, construction sector downturn, regulatory pressure in Austria—directly threatens CMBlu's funding continuity at a moment when hundreds of millions more are needed for Greece and US gigafactories. This is a kill-criteria-grade risk with no readily available substitute at equivalent scale.
    claimRefs:
      - CR030
      - CR040

  - calloutType: risk
    title: Uniper Deal Is Conditional and the Only Large Offtake Commitment
    body: >-
      The 5 GWh Uniper supply agreement—CMBlu's highest-profile commercial anchor—is explicitly conditioned on the successful outcome of a pilot site acceptance test. Uniper's deal runs through 2037 and would represent a transformational revenue stream, but its conditional nature means any pilot failure, scope dispute, or Uniper strategic change resets CMBlu's revenue timeline by several years and removes the primary commercial validation that underpins the €1B+ valuation.
    claimRefs:
      - CR038
      - CR039

  - calloutType: risk
    title: ESS Inc Near-Shutdown Is the Sector's Precedent Warning
    body: >-
      Iron flow battery startup ESS Inc nearly closed its Oregon plant in June 2025 due to financing shortfalls, warning of "substantial doubts" about going-concern status in its SEC 10-K. ESS had raised over $300M including a DOE loan guarantee, had UL-certified products, and had multiple utility customers. CMBlu's trajectory at a similar stage—pre-commercial-revenue, capital-dependent, building toward its first large-scale delivery—follows the same risk pattern. LDES startups require both technology validation and sustained financing in parallel; the absence of either is fatal.
    claimRefs:
      - CR034
      - CR035

  - calloutType: insight
    title: Non-Flammable Chemistry Reduces Safety Permitting Risk but Does Not Eliminate It
    body: >-
      CMBlu's water-based, non-flammable organic electrolytes significantly reduce fire risk versus lithium-ion, simplifying NFPA 855 Hazard Mitigation Analysis documentation and improving permitting timelines for urban and industrial sites. This is a genuine competitive advantage in an era when Li-ion BESS fires have led to municipal moratoria. However, CMBlu's aqueous flow battery system is now explicitly named in NFPA 855:2026, meaning it faces prescribed testing requirements rather than the previously lighter "other technologies" threshold.
    claimRefs:
      - CR006
      - CR007
      - CR014

  - calloutType: assumption
    title: Manufacturing CAPEX Target of $15M per GWh Is Unvalidated at Scale
    body: >-
      CMBlu claims a capital expenditure of approximately $15M/GWh for SolidFlow manufacturing, compared to ~$100M/GWh for lithium-ion. This claim is a core pillar of the investment thesis but is a forward-looking cost target, not a validated cost from a multi-GWh commercial facility. Industry benchmarks for flow battery gigafactories are not yet established. If actual capex tracks closer to the $80/kWh-pa average seen across conventional battery gigafactories, total scale-up cost to 10 GWh/year would exceed €800M—materially higher than CMBlu's current capital base.
    claimRefs:
      - CR023
      - CR036

