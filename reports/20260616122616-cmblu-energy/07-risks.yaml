  - id: partner-competitive
    title: Partner, Competitive, and Dependency Risks
    body: |
      STRABAG SE represents the most concentrated dependency in CMBlu's capital structure: the Austrian construction group invested ~€100M in 2023 and re-invested in the Series C, making it the dominant financial backer by a wide margin. Any scenario involving STRABAG's strategic reorientation—management change, Austrian regulatory pressure, construction market downturn—would directly threaten CMBlu's funding continuity and its planned STRABAG-supported manufacturing scale-up. The Uniper 10-year conditional supply agreement (5 GWh, first deliveries from 2027) is similarly concentrated: it is the company's largest commercial commitment and is explicitly conditioned on a successful pilot site acceptance test. If the Uniper pilot fails or is delayed, CMBlu's revenue timeline shifts materially.

      On the competitive front, CMBlu's core addressable market—multi-hour grid and industrial storage above 8 hours—faces converging threats. CATL controls 40%+ of global EV battery market share and is actively expanding into stationary storage. Form Energy's iron-air battery secured a $1B Google deployment agreement in February 2026. Vanadium flow battery providers (Invinity, CellCube, Dalian Rongke Power) are also addressing the same multi-hour duration segment. Energy Revolution Ventures assessed in July 2025 that flow batteries face "a steep climb" because "performance alone is no longer a compelling sell"—the market now demands speed to scale and clear cost trajectories, areas where lithium-ion has a growing head start.

      Within the organic flow battery niche, Quino Energy, Jena Flow Batteries (which deployed the world's largest organic flow battery at 20 MWh in Inner Mongolia), and XL Batteries are all competing for the same technology differentiation position. Samsung Ventures' investment in CMBlu adds a potential strategic supply chain partner, but Samsung is also a major lithium-ion manufacturer, creating an inherent interest tension. The IRA FEOC rules structurally advantage CMBlu in the US market over Chinese suppliers, but the structural advantage depends on regulatory continuity that is not guaranteed post-2026.
