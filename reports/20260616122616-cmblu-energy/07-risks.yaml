  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-risk
      relatedTableRefs:
        - TR001
      missingEvidence: >-
        Enumeration of regulatory and legal risks covering CMBlu's planned Greece and
        Asia operations, where EU Battery Regulation enforcement and local grid-connection
        rules have not yet been publicly documented for CMBlu's specific deployment context.
      whyItMatters: >-
        TR001 covers EU, Germany, and US jurisdictions only; Greece gigafactory and future
        Asia deployments introduce additional regulatory compliance costs not yet enumerated,
        making the register partial.
      diligencePath: >-
        Review Greek Ministry of Environment and Energy permit conditions for Sindos facility;
        request CMBlu legal assessment of EU Battery Regulation obligations for Greece operations.
      relatedQuestionRefs:
        - QR021

    - type: missing-source
      severity: blocking
      topic: technology-risk
      missingEvidence: >-
        Multi-year commercial field data from at least one CMBlu SolidFlow deployment showing
        degradation curves, round-trip efficiency evolution, and electrolyte crossover rates
        over 1,000+ cycles.
      whyItMatters: >-
        Without field data, organic electrolyte degradation and membrane crossover risk cannot
        be quantified; investors and project finance lenders cannot model lifetime O&M costs
        or validate the 20-year service life claim, blocking bankability.
      diligencePath: >-
        Request SRP Desert Blume commissioning data when available (late 2025/early 2026);
        request Argonne DOE test program interim reports; review Mercedes-Benz Rastatt
        operational data once system completes first year of cycling.
      relatedQuestionRefs:
        - QR007
        - QR008

    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: >-
        CMBlu's cash balance, monthly burn rate, Series C total target size, and
        planned capital deployment schedule for Greece and US gigafactories.
      whyItMatters: >-
        With Series C still open and gigafactory buildout requiring hundreds of millions
        more, investors cannot assess whether current capital is sufficient to reach
        first commercial delivery to Uniper in 2027 without a further emergency round.
      diligencePath: >-
        Request financial model projections from CMBlu directly; negotiate right to
        quarterly reporting as condition of any commitment; check whether Samsung
        Ventures' participation includes any debt or convertible component.
      relatedQuestionRefs:
        - QR012

    - type: missing-source
      severity: material
      topic: manufacturing-risk
      missingEvidence: >-
        Confirmed construction contract or engineering milestone report for the Greece
        gigafactory, validating the H2 2025 construction start and late-2026 production
        target.
      whyItMatters: >-
        Greece adds 4 GWh of planned annual capacity that underpins the Uniper delivery
        timeline; if construction is behind schedule, CMBlu cannot meet 2027 first
        delivery obligations without Alzenau alone.
      diligencePath: >-
        Request construction timeline and engineering contract from CMBlu or GEK TERNA;
        check Greek Ministry of Energy permit filings for Sindos industrial site.
      relatedQuestionRefs:
        - QR023

    - type: stale
      severity: minor
      topic: competitive-risk
      missingEvidence: >-
        Updated 2026 LCOS benchmark for 8–10 hour lithium-iron-phosphate storage
        at utility scale, quantifying whether the Li-ion cost curve has reached
        CMBlu's $0.05/kWh LCOS target range.
      whyItMatters: >-
        If Li-ion LCOS for 8–10 hour duration crosses below CMBlu's target cost,
        the economic thesis for SolidFlow narrows materially; this is the single most
        important competitive threshold.
      diligencePath: >-
        Subscribe to BNEF LCOS tracker; request Wood Mackenzie's 2026 LDES cost
        comparison report; monitor Form Energy and ESS commercial pricing announcements.
      relatedQuestionRefs:
        - QR029
        - QR032

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Tables TR001 and TR002 already contain notes fields with data-source
      caveats explaining the qualitative basis of likelihood and severity ratings;
      the tableNotes warning is acknowledged for TR005 which is a pure risk
      framework table whose threshold values are explicitly disclosed as
