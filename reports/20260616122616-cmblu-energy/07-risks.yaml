  - id: financial-execution
    title: Financial and Execution Risks
    body: |
      CMBlu's €50M Series C initial close in April 2026 represents the first tranche of a round that remains open, with CEO Constantin Eis confirming the company is "in contact with further investors." Total cumulative funding stands at an estimated €250M+—substantial for a flow battery startup but modest against the capital requirement of scaling to 10+ GWh/year across three countries. Battery gigafactory scale-up to 10 GWh/year implies roughly €800M+ in cumulative capex at industry benchmarks, far exceeding current cash resources. The company is pre-revenue at the multi-GWh scale, dependent on milestone-based capital tranches.

      The LDES sector has a documented bankability problem. The LDES Council's December 2025 report found that commercial banks view new LDES technologies as too risky for traditional project finance due to limited operational datasets and uncertain revenue from stacked value streams. ESS Inc's near-closure of its Oregon plant in June 2025—requiring emergency capital to avoid shutdown—is the sector's most vivid execution precedent. ESS reported a net loss of $63.4M on $1.6M revenue in 2025 before its partial pivot to the Energy Base platform.

      CMBlu's executive team carries execution risk concentrated at the top. Constantin Eis became CEO in March/April 2024—18 months before the critical Uniper delivery window opens—with a background in consumer tech (Casper, Lichtblick, Home24) rather than heavy industrial manufacturing. The CFO position is held by Olaf Althaus on an interim basis, with no permanent appointment publicly announced. While the CTO (Dr. Nastaran Krawczyk) provides R&D continuity, the absence of a permanent CFO is a governance gap at a moment of major capital raising and gigafactory buildout execution.
