  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "LDES-barriers"
      missingEvidence: >
        Independent third-party LCOE comparison of CMBlu SolidFlow versus Chinese vanadium flow
        batteries at 10-year and 20-year system lifetimes, with costs stated in comparable per-MWh
        terms at the same discharge duration (10 hours).
      whyItMatters: >
        Without a credible LCOE comparison, it is not possible to verify whether organic flow batteries
        are cost-competitive versus Chinese VRFB at scale—a key question for utility procurement
        decisions and investor due diligence on pricing risk.
      diligencePath: >
        Commission an independent energy storage consultant (e.g., Lazard, Aurora Energy Research) to
        model LCOE for SolidFlow versus the leading Chinese VRFB system at 10- and 20-year lifetimes,
        normalizing for the same duration and cycling assumptions.
      relatedQuestionRefs: [QM016]

    - type: private-evidence-only
      severity: minor
      topic: "CMBlu"
      missingEvidence: >
        CMBlu's full commercial sales pipeline beyond the publicly announced Uniper 5 GWh agreement and
        the SRP Desert Blume project; additional utility, industrial, or data center customers that may
        have signed letters of intent, MOUs, or early-stage framework agreements.
      whyItMatters: >
        Customer concentration risk is material if only two customers (Uniper, SRP) represent the
        entire commercialized pipeline heading into scale-up; the full picture of committed demand
        versus manufacturing capacity is needed for supply-demand forecasting.
      diligencePath: >
        Request a pipeline summary from CMBlu management under NDA; cross-check with public news
        monitoring and patent/project permit filings in target geographies.
      relatedQuestionRefs: [QM020]

    - type: missing-source
      severity: minor
      topic: "LDES-market"
      missingEvidence: >
        Detailed LDES value chain cost breakdown allocating total system cost among battery
        stack/cells, electrolyte/active material, balance-of-system components, EPC/installation,
        and O&M—publicly available for organic flow batteries specifically.
      whyItMatters: >
        Without a value chain cost breakdown it is difficult to assess where manufacturing scale-up
        will drive the steepest cost reductions, and whether CMBlu's organic chemistry cost advantage
        over vanadium flows through to system-level economics or is offset by BOS/EPC costs.
      diligencePath: >
        Seek publicly available NREL or DOE studies on flow battery system cost decomposition; compare
        against CMBlu's own quoted system price per kWh.
      relatedQuestionRefs: [QM026]

