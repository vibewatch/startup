figures:
  - id: FM001
    title: "Market Sizing Lens: LDES TAM / Flow Battery SAM / Organic Flow SOM (2026)"
    type: pyramid
    layout: standard
    summary: >
      TAM/SAM/SOM pyramid showing LDES global market ($3.4–6.2B), flow battery sub-segment ($1.2–1.4B),
      European LDES ($1.07B), and organic flow battery addressable (~$0.3–0.4B) in 2026.
    data:
      items:
        - label: "TAM: Global LDES Market (2026)"
          value: "~$3.4–6.2B"
          description: >
            Total addressable market for all LDES technologies globally (10+ hours duration). Range
            spans Fortune Business Insights ($3.4B, conservative) to Global Market Insights ($6.25B,
            broader scope including thermal/mechanical).
        - label: "SAM-Global: Flow Battery Market (2026)"
          value: "~$1.2–1.4B"
          description: >
            All flow battery chemistries (vanadium, zinc-bromine, iron, organic) serving stationary
            grid and industrial applications globally. VRFB holds ~80% share; organic flow is <5%.
        - label: "SAM-Europe: European LDES Market (2026)"
          value: "~$1.07B"
          description: >
            European LDES market; Germany is the most dynamic single country with 17.9 GW/27.2 GWh
            installed by Q1 2026, but needs 104 GWh by 2030 (Fraunhofer ISE).
        - label: "SOM: Organic Flow Battery Addressable (2026)"
          value: "~$0.3–0.4B"
          description: >
            Organic/non-vanadium flow battery sub-segment addressable by CMBlu; growing at ~15–16%
            CAGR within broader redox flow market; premium niche targeting fire-safe,
            critical-mineral-free stationary deployments.
    approximationNotes: >
      Organic flow SOM is estimated by applying the non-VRFB share of the global flow battery market
      (~$0.37B for redox flow per Verified Market Reports) as a proxy; no independent organic-specific
      revenue figure is publicly available. All values in nominal USD.
    claimRefs: [CM001, CM006, CM009, CM011, CM018]

