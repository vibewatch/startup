  - id: FM004
    title: "LDES Adoption Funnel: Stages from Market Awareness to Commercial Operation"
    type: funnel
    layout: standard
    summary: >
      Adoption funnel for multi-hour LDES projects illustrating the large drop-off from market-aware
      developers to commercially operating projects, driven by bankability, grid access, and
      CAPEX barriers in 2026.
    data:
      items:
        - label: "Market Awareness"
          value: 100
          description: >
            Grid operators, industrials, and data centers aware of LDES as an option beyond 4-hour Li-ion;
            represented by the 720 GW German grid connection application pipeline and global LDES pipeline announcements.
        - label: "Technical Qualification"
          value: 42
          description: >
            Projects proceeding to feasibility study with LDES included; grid connection siting
            qualified; technology short-listed. Bottleneck: grid connection availability in Germany.
        - label: "Business Case / LCOE Analysis"
          value: 22
          description: >
            Projects with positive LDES LCOE analysis versus alternatives; revenue stack modeled
            (arbitrage + FCR + capacity market); bankability reviewed. Bottleneck: high LDES CAPEX.
        - label: "RFP / Procurement"
          value: 10
          description: >
            Formal procurement or framework agreement issued; technology partners selected;
            diligence on track record and supply chain FEOC status.
        - label: "Contract / FID"
          value: 4
          description: >
            Final investment decision or conditional supply agreement signed; construction planned.
            Example: CMBlu–Uniper 5 GWh framework (signed Feb 2026); SRP Desert Blume (FID 2025).
        - label: "Commercial Operation"
          value: 1
          description: >
            System in commercial operation delivering multi-hour energy services. Very few LDES
            projects at this stage globally; CMBlu first delivery to Uniper targeted 2027.
    approximationNotes: >
      Funnel values are indicative percentage indices based on industry patterns, not empirical
      project counts. The large drop from awareness to qualification reflects Germany's grid
      connection backlog. CMBlu examples are used illustratively at the FID stage.
    claimRefs: [CM028, CM033, CM034, CM037, CM038, CM040]

callouts:
  - calloutType: strength
    title: "Structural Market Undersupply: LDES Council Projects 8 TW / 85–140 TWh Needed by 2040"
    body: >
      The LDES Council's net-zero scenario analysis projects that global LDES capacity must reach
      8 terawatts / 85–140 terawatt-hours by 2040—a 50-fold acceleration over current deployment
      pace. Against this, global BESS (all durations) added only 108 GW in 2025 per IEA data, and
      the LDES sub-segment is a fraction of that. This structural gap between what renewable-heavy
      grids require and what is commercially deployed today represents the long-term market rationale
      for CMBlu's organic flow technology.
    claimRefs: [CM017, CM015, CM016]

  - calloutType: risk
    title: "Germany Regulatory Reversal: Grid Backlog and Policy Instability Threaten Project Bankability"
    body: >
      Germany's battery storage regulatory environment entered 2026 with significant uncertainty:
      building-code privileges granted to BESS in November 2025 were materially tightened within
      weeks, and the abolition of first-come-first-served grid connections has created a vacuum
      while a replacement maturity-scoring process is still being finalized. With 720 GW of pending
      grid connection requests—nine times Germany's peak load—and FCR revenue expected to compress
      as more batteries enter the market, project economics for new developments are under pressure.
      This is the most material near-term market constraint for CMBlu's European growth pipeline.
    claimRefs: [CM038, CM039, CM040]

  - calloutType: insight
    title: "AI Data Center Demand Creates New Buyer Segment for Fire-Safe Multi-Hour Storage"
    body: >
      Hyperscale AI data centers are emerging as a structurally new buyer for organic flow batteries:
      57% of data center professionals cite AI workloads as a driver of higher power density needs,
      and 76% prioritize chemistry safety in battery selection—precisely the two attributes where
      non-flammable organic flow batteries outperform lithium-ion. The CMBlu–EnergyTech framing of
      the Uniper agreement as equivalent to powering a 1 GW data center for five hours signals the
      company's awareness of this buyer segment, though no confirmed data center deal is public as
      of Q2 2026.
    claimRefs: [CM023, CM024, CM031]

  - calloutType: recommendation
    title: "Prioritize Utility Segment in EU While Building US Data Center Track Record"
    body: >
      CMBlu's strongest near-term market is German/EU utilities with legacy grid connections and
      renewable-firming mandates—the Uniper framework validates this. A parallel strategy to secure
      one or two data center pilot contracts in the US or EU (leveraging fire-safe advantages and
      IRA FEOC-free positioning) would diversify buyer segments and address the high concentration
      risk of relying on a single utility customer before manufacturing scale is achieved.
    claimRefs: [CM022, CM025, CM030, CM037]

