companyProfile:
  summary: >-
    CMBlu Energy is a German long-duration energy storage company commercializing Organic SolidFlow batteries for
    multi-hour stationary storage in grid, industrial, and data-center applications. The company pairs a non-flammable,
    lithium-free chemistry with an in-house manufacturing scale-up plan and strategic backers including STRABAG and
    Samsung Ventures, but it remains early in commercial revenue realization.
  foundedDate: '2014-01-01'
  founders:
    - name: Dr. Peter Geigle
      role: Founder; former CEO; current supervisory board chair
      background: Founded CMBlu in 2014 and led the company through early technology development before moving to board leadership in 2024.
      claimRefs:
        - CO001
        - CO010
  foundingLocation: Alzenau, Bavaria, Germany
  headquarters: Alzenau, Bavaria, Germany
  productSummary: >-
    CMBlu sells modular Organic SolidFlow battery systems designed for ten-plus hours of dispatchable energy using
    water-based, non-flammable electrolytes and no lithium, cobalt, or nickel.
  customerFocus: Utilities, independent power producers, data centers, and industrial sites needing multi-hour backup or grid-balancing storage.
  businessModel: Hardware-plus-project deployment model centered on utility-scale battery systems, manufacturing scale-up, and partner-led commercial projects.
  stage: Series C
  fundingStatus: >-
    Initial €50 million Series C close in April 2026 at a €1B+ post-money valuation, with the round still open for
    additional investors and proceeds targeted to manufacturing and early deployments.
