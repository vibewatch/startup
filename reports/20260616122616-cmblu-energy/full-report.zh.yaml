        - label: 商业案例 / LCOE 分析
          value: 22
          description: |
            项目在 LDES LCOE 与替代方案对比中跑出正向结果；收入栈已建模（套利 + FCR + 容量市场）；可融资性已审查。 瓶颈：LDES CAPEX 高。
        - label: RFP / 采购
          value: 10
          description: |
            正式采购或框架协议发布；技术合作伙伴已选定；围绕履约记录和供应链 FEOC 状态开展尽调。
        - label: 合同 / FID
          value: 4
          description: |
            最终投资决策或有条件供货协议签署；建设已规划。示例：CMBlu–Uniper 5 GWh 框架（2026 年 2 月签署）； SRP Desert Blume（FID 2025）。
        - label: 商业运行
          value: 1
          description: |
            系统进入商业运行，提供多小时能源服务。全球走到这一阶段的 LDES 项目很少；CMBlu 目标 2027 年向 Uniper 首次交付。
    approximationNotes: |
      漏斗数值是基于行业模式的指示性百分比指数，不是实证项目计数。从认知到资格筛选的大幅下降，反映德国电网连接积压。 CMBlu 示例在 FID 阶段仅作说明。
