  - id: TU005
    title: 扩张潜力与集中度风险
    columns:
      - 维度
      - 描述 / 数据点
      - 影响
      - 尽调路径
    rows:
      - - Uniper 集中度风险
        - 单一客户（Uniper）持有 CMBlu 唯一公开披露的大规模供应锚点：有条件的 5 GWh。未宣布其他同等规模供应合同。
        - 关键——如果 Uniper 不认购交付批次，CMBlu 最大的近期收入来源就会消失
        - 核实是否存在其他公用事业供应谈判（NDA 前）；跟踪 Uniper 年度电网储能投资计划
      - - 有条件选择权风险（Uniper 交易）
        - 框架采用认购期权结构：Uniper 可从 2027 年起订购 100 MWh+ 批次，也可以放弃。财务条款未披露。它不是确定采购订单。
        - 重大——有条件结构限制 CMBlu 围绕该交易确认收入或获取项目融资的能力
        - 索取条款清单摘要，或确认是否有任何不可退还保证金；跟踪每次 Uniper 批次认购公告
      - - Land-and-expand 机会（Burgenland Energie）
        - 如果 2030 年 300 MWh 目标兑现，集装箱级试点的储能容量将扩大 40×。
        - 若实现，带来重大上行；验证 CMBlu 可成为奥地利可再生混合园区的主 LDES 供应商
        - 确认 Schattendorf 当前装机容量；向 Burgenland Energie 索取年度扩容里程碑
      - - Land-and-expand 机会（Uniper 框架）
        - 2027–2037 年分批交付 5 GWh，每批 100 MWh；全系统寿命期内还计划签订服务 / 维护合同。
        - 重要——若技术在规模化场景得到验证，该结构可在 Uniper 14 GW 欧洲发电资产组合内逐步扩张。
        - 跟踪每个 100 MWh 订单的调用；供货开始后确认服务协议条款
      - - 数据中心 / hyperscaler 渠道风险
        - CMBlu 公开把 SolidFlow 定位为「AI 和数据中心的基荷基础设施」，但尚未宣布任何 hyperscale 合同。公司未披露该垂直领域的渠道伙伴或经销商。
        - 若 CMBlu 的 Series C 定价押注数据中心渗透、但最终没有兑现，下行风险重大
        - 索取数据中心板块的 LOI/MOU 管线；确认 Samsung Ventures 的战略引荐
      - - SRP 采购非排他性
        - SRP 创新经理确认，该公用事业公司采取「技术中立」路线，未来储能采购将采用竞争性 RFP。CMBlu 与 SRP 没有排他关系。
        - 中等——CMBlu 必须凭实力赢下每一轮未来采购；没有锁定
        - 监测 Copper Crossing 后续阶段的 SRP 储能 RFP
    notes: |
      集中度指标根据公开交易公告推断。公司未披露客户收入占比数据。所有扩张数字（例如 Burgenland 300 MWh）均为客户给出的目标，不是已确认部署。
