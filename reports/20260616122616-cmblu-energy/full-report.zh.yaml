        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              CMBlu Energy 位于新兴有机液流电池赛道，背后是覆盖多种电化学技术的 LDES 大盘。直接竞争者包括 Quino Energy（Series A，$16M，醌基有机化学）以及更早期的 XL
              Batteries 和 Flux XII。CMBlu 最接近的功能替代品是 vanadium redox flow battery（VRFB）赛道，由 Invinity Energy
              Systems（英国上市，2025 年收入 £17M）、VRB Energy（中国 / 美国，已融资 $55M）和 CellCube（Stryten / Atlas Holdings，美国 DoD
              支持）主导。铁液流由 ESS Inc. 领先（NASDAQ: GWS，2026 年 8.5 GWh 供货协议）。Form Energy（铁空气，已融资 $1.4B）服务 100
              小时超长时储能，是相邻且部分可替代赛道；其 $1B Google 合同将落地 Minnesota 300 MW / 30 GWh 数据中心项目，已经验证需求。Eos Energy（NASDAQ:
              EOSE，2026 年 Q1 收入 $57M）领跑锌溴。短时替代品方面，锂离子集成商 Tesla（2025 年部署 42.1 GWh）和 Fluence（FY2026 收入指引 $3.2–$3.6B）会争夺所有
              6 小时以下用例。钠离子玩家 CATL Naxtra、BYD 正进入 6–8 小时时长区间，电芯成本快速下行（$55–70/kWh）。数据中心和工业备电中，柴油发电机仍是 incumbent，尽管 BESS
              正在主要应用中替代柴油。全球 LDES 市场预计从 2024 年 2.4 GW 增至 2030 年 18.5 GW，这条可服务跑道支撑 CMBlu 的商业爬坡。
