              - CP033
              - CP034
              - CP036
          - type: callout
            title: 有机化学护城河在 IP 和供应链两端都可防守
            body: >-
              CMBlu 围绕木质素衍生有机聚合物电解质的专利组合，加上不依赖关键矿物，形成双重护城河：化学端有 IP 壁垒，供应链端有地缘政治 / FEOC
              安全优势。没有可比的商业活跃竞争者在规模化部署同类聚合物化学体系。Quino Energy 使用不同有机化学体系（醌基），商业成熟度约落后 CMBlu 3–5 年，给 CMBlu
              在有机液流赛道留下有意义的先发窗口。
