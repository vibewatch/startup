      - number: '7.2'
        title: 技术与运营风险
        blocks:
          - type: paragraph
            body: >
              CMBlu 的首要技术风险是长期商业现场数据不足。公司首个重大工业部署——Mercedes-Benz Rastatt 的 11 MWh 系统——原计划 Q2 2025；Arizona Desert Blume
              SRP 试点（5 MW/10 小时）截至 2025 年 3 月处于工程阶段，运营目标延伸到 2027 年。虽然 Argonne National Laboratory 和 Idaho National
              Laboratory 正在验证 CMBlu 的 SolidFlow 电池，但尚无公开的多年商业规模性能数据集。Salt River Project 的 Chico Hunter 直接表示，SRP
              希望在规模化承诺前看到「几年」真实世界数据。


              有机电解液化学体系带来两个具体退化向量：反复氧化还原循环下的分子分解（会降低容量并需要补充电解液），以及有机分子穿过离子交换膜的 crossover（导致不可逆容量衰减）。相比纯液态液流电池，CMBlu
              的固态储能材料部分缓解 crossover，但两个风险都没有在 10–20 年商业寿命尺度上被量化。


              运营层面，CMBlu 必须在 2029 年前从 Alzenau gigafactory 的 1 GWh/year 扩至德国、希腊和美国三地合计 10+ GWh/year——36 个月内提升 10x。希腊工厂（目标
              800 MW/~4 GWh 年产能）需要在 H2 2025 开工，并于 2026 年底投产。液流电池制造缺少标准化设备和流程，电堆、膜、储罐和控制电子都需要定制产线。全球电池 gigafactory
              资本开支平均为 $80/kWh-pa，美国和欧盟成本最高可达中国竞争者的 2x。CMBlu 自身 $15M/GWh 的 CAPEX 目标尚未在多 GWh 商业规模下验证。
