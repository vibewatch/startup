      - number: '3.4'
        title: 护城河耐久性与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              CMBlu 的可持续竞争优势建立在四根支柱上：（1）覆盖木质素衍生与胺化有机聚合物化合物及其氧化还原液流应用的专利组合，提供国际 IP 保护并抬高复制门槛；（2）专有电解质配方无法用大宗化学品替代，在 20
              年系统寿命内形成复购耗材锁定；（3）长期供货合同（Uniper 至 2037 年）通过特定场址基础设施投资嵌入转换成本；（4）在有机液流商业规模上具备先发优势，截至 2026 年中没有可比有机竞争者达到
              gigawatt-hour 生产。主要护城河风险包括：相较锂离子的可融资性缺口（项目融资贷款人偏好 GW 级部署历史）、Eos Energy 和钠离子供应商成本快速下行并在 8–12 小时重叠区构成威胁、Form
              Energy 的大型 Google 合同显示 hyperscaler 可能偏好超长时铁空气，以及 CMBlu 未验证成本主张（$0.05/kWh LCOS、$15M/GWh CAPEX）在首个 GWh 级
              Uniper 部署（预计 2027 年）中可能无法兑现。Quino Energy 的醌基路线带来 IP 稀释风险，值得做 freedom-to-operate 分析。Uniper
              协议中的有条件条款，是实质性近端执行风险。
