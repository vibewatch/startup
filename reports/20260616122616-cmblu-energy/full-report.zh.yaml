      - number: '2.2'
        title: 市场规模——全球、欧洲与德国语境
        blocks:
          - type: paragraph
            body: >
              Fortune Business Insights 估计，全球 LDES 市场 2025 年价值 $3.27 billion，2026 年将达 $3.4 billion，到 2034 年增至 $4.93
              billion，CAGR 为 4.75%；这是一个口径较窄的保守估计。Global Market Insights 给出的 2026 年数字略高，约 $3.9 billion，并预测到 2035 年 CAGR 为
              10.5–13.9%，反映更宽的定义。各家估计从 $3.4 billion 到超过 $6 billion 不等，取决于方法论；本章把 Fortune / GMI
              区间作为主要规模参考，并指出项目融资动员额通常是基于收入数字的 3–5 倍。LDES 内部的液流电池子赛道 2025 年价值 $1.12–1.15 billion，2026 年增至 $1.22–1.39
              billion。Mordor Intelligence 预测液流电池到 2031 年达到 $3.88 billion（CAGR 22.84%），驱动来自电解质租赁成本下降和 8 小时放电能力要求；Fortune
              Business Insights 更保守，预计 2034 年为 $2.88 billion（CAGR 11.28%）。欧洲在 2025–2026 年约占 $1.03–1.07 billion（全球 LDES
              总量的 31.5%），德国是最活跃的单一市场。到 2026 年 Q1 末，德国总装机电池容量达到 17.9 GW / 27.2 GWh，但 Fraunhofer ISE 估计德国到 2030 年需要 104
              GWh，到 2045 年最高需要 180 GWh，结构性缺口达当前水平数倍。IEA 数据显示，2025 年全球电池新增装机 108 GW，同比增长 40%，由公用事业级部署和 2010 年以来超过 90%
              的电池成本下降驱动。LDES Council 预测，净零电力系统到 2040 年全球需要 8 TW / 85–140 TWh LDES，部署速度需提升 50 倍——相较当前部署规模，结构性机会巨大。
