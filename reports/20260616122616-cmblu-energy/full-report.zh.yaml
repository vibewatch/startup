  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方格局
        blocks:
          - type: paragraph
            body: >
              CMBlu Energy 的商业重心覆盖三类主要买方：需要长时可再生能源出力支撑和电网平衡的公用事业与电网运营商；希望把太阳能发电与多小时储能配对、实现 24/7
              清洁能源的商业与工业（C&I）设施，尤其是制造商；以及 AI 和云工作负载推高电力需求、而电网扩建跟不上的数据中心和 hyperscaler 运营商。截至 2026 年 6 月，三类中只有公用事业和 C&I
              板块拥有具名部署或商业协议。数据中心板块已被 CMBlu 在公开传播中积极定位——2026 年 4 月 Series C 新闻稿明确把 SolidFlow 定义为「AI
              和数据中心的基荷基础设施」——但尚无公开宣布的数据中心合同。

              公用事业板块的买方横跨三国：德国（Uniper，5 GWh 有条件供应框架）、奥地利（Burgenland Energie，2023 年 7 月起在 Schattendorf 运行全球首个商业 SolidFlow
              部署）和美国（Arizona 的 Salt River Project，拥有 5 MW / 50 MWh Desert Blume 试点；以及 Wisconsin Milwaukee 的 WEC Energy
              Group，拥有 1–2 MWh 测试）。C&I 板块中，Mercedes-Benz 于 2024 年 3 月为其德国 Rastatt 制造工厂订购 11 MWh 系统。CMBlu 官网还在「受信任客户」下列出
              PPC（希腊公共电力公用事业），但 PPC 的具体项目尚未公开披露。美国 Department of Energy 通过 Argonne 和 Idaho National Laboratories 开展多年
              SolidFlow 示范，验证微电网和 EV 充电应用，但这并不代表商业收入客户。CMBlu 的获客路径遵循 RFP—试点—商业框架的推进顺序；从初始接触到供应协议通常需要多年，Uniper 关系在 2026 年
              1 月框架前被描述为「长期」就是证据。
