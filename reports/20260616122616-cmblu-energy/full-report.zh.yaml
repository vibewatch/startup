      - number: '5.5'
        title: 安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >
              CMBlu 的安全叙事建立在有机水系电解液的四个属性上：不可燃、不可爆、不产生有毒烟气，并消除热失控风险。这些属性内生于水基化学体系，不依赖主动热管理系统；相比需要空调和消防基础设施的锂离子 BESS
              安装，这显著简化系统，在高密度城市或工业环境中降低许可复杂度并改善经济性。


              TÜV SÜD 于 2023 年完成 Technical Due Diligence（TDD），确认整体系统达到 TRL 7、电化学核心达到 TRL 8，并通过大量实验室和现场测试验证性能与可靠性。公司称已获得
              ISO 9001（质量管理）、ISO 14001（环境管理）和 ISO 45001（职业健康与安全）认证。公用事业并网方面，SolidFlow 系统必须符合 IEC 62619（固定式电池安全）和 IEC
              62933（ESS 安全与安装）；CMBlu 尚未公布具体 IEC 证书编号，这给受监管市场的项目融资方留下尽调缺口。


              三类技术风险最突出：（1）有机分子长期稳定性——按学术文献，多硫化物穿梭效应、氧化分解和膜污染仍是有机液流化学体系的主要退化路径；CMBlu 的专有方案有所缓解，但无法消除。（2）效率缺口——75% 系统级规格与
              90% 电芯级主张之间的差距，给项目级经济模型带来不确定性；Uniper 自身也表示「性能和经济可行性仍需在大规模场景中证明」。（3）规模化不确定性——SRP 表示希望在承诺前看到「数年性能数据」，CMBlu
              美国总裁也承认融资取决于更多真实世界数据。员工评价平台（Kununu，2026 年 3 月）还提示管理沟通透明度问题。Argonne/INL 示范项目和 SRP Desert Blume
              项目的独立多年现场数据，将是关闭这些风险的关键。
