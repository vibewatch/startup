  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与入场分析
        blocks:
          - type: paragraph
            body: >-
              CMBlu Energy 于 2026 年 4 月 30 日跨过 €1 billion（$1.17B）独角兽门槛，此前完成 €50 million（$58M）Series C 首关；Samsung
              Ventures 作为新投资者加入，所有现有股东继续参与，其中最突出的是 2023 年 10 月承诺 €100 million 的奥地利建筑集团 STRABAG SE。据报道，CMBlu 累计投入资本约 €250
              million（$293M），Series C 投后估值出现大幅抬升。该轮仍在开放，公司预计还会追加关闭。资金用途指向欧洲和美国的制造规模化及早期商业部署。

              这轮融资背景立即引出估值纪律问题。按估计，当前年收入约 $1 million，来自试点和商业化前项目。公司未公开披露经审计收入、ARR、毛利率或现金消耗率。股权结构——包括 STRABAG €100M
              战略投资的清算优先权及任何参与权——并不透明，给新进投资者带来有意义的下行情景不确定性。Series C 定价意味着投资者几乎完全在为未来期权价值付费，而不是为当前现金流付费；按公开估计，隐含收入倍数超过
              1,000x。

              对照 LDES 可比公司，Form Energy 是最接近的长时储能同行，上一轮估值 $3.4B+，且拥有 $1B Google 交易，商业化进度明显更靠前。ESS Tech（NYSE:
              GWH）是一家商业阶段相近的上市铁液流电池公司，市值约 $23.5M，显示私人 LDES 独角兽定价中嵌入的严重溢价。Fluence（NASDAQ: FLNC）已是完全商业化规模的电池集成商，按 Q1 2026
              约 $475.2M 季度收入和约 $5.5B 订单积压，交易倍数约为收入的 2–2.5x。这些对比确认，CMBlu 的 €1B+ 主要是对商业化成功的前瞻押注，而非当前基本面的反映。
