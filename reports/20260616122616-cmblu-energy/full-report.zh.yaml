  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              CMBlu 同时处在三套不同监管制度之下——欧盟、德国和美国——且每套制度在 2026 年都面临显著不稳定或合规期限。EU Battery Regulation 2023/1542 已于 2025 年 8
              月全面生效，要求自 2026 年 2 月 18 日起，所有超过 2 kWh 的可充电工业电池必须提交碳足迹声明，并在 2027 年 2 月跟进 Digital Battery Passport
              要求。对扩张阶段公司而言，这些合规成本并不轻，需要定制 IT 基础设施和生命周期评估文件；拥有成熟合规团队的竞争对手更容易吸收这些成本。


              在德国，2025 年 11 月 EnWG 修正案最初将大型 BESS 认定为特权基础设施；但数周后通过的 Geothermal Energy Acceleration Act 又把该特权限制在距离变电站 200
              米以内或毗邻 50+ MW 发电厂的设施。White & Case 将由此形成的框架描述为「仍不清晰，并有放缓增长的风险」。德国四家 TSO 已收到近 700 个并网申请，总计约 ~250 GW，但实际安装的大型
              BESS 仅 3.5 GWh，凸显许可摩擦如何让管线价值搁浅。欧盟对 German Renewable Energy Act 的国家援助批准将于 2026 年 12 月 31
              日到期，进一步增加容量市场设计的政策不确定性。


              在美国，NFPA 855:2026 现在要求几乎所有固定式储能系统安装都进行正式 Hazard Mitigation Analysis（HMA），并满足大规模火灾测试（LSFT）要求。CMBlu
              的不可燃水基电解液相比锂离子降低火灾风险，但公司仍必须为每个美国部署完成 HMA 文件。IRS Section 45X 制造抵免（电芯 $35/kWh）强力激励美国生产，但要求在美国发生「实质性转型」，并采用
              FEOC-clean 供应链。IP 方面，CMBlu 拥有 20+ 项美国和欧盟专利；截至 2026 年 6 月未发现活跃诉讼，但随着公司商业可见度提高，IP 挑战风险会上升。
