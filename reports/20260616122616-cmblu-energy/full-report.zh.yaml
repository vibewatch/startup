    rows:
      - - 正论
        - LDES 市场结构性巨大且快速增长，AI 数据中心需求正在加速
        - LDES 预计到 2030 年达 $10.43B；Fluence 2026 YTD 积压订单翻倍至 $5.6B
        - 市场进入平台期，或锂离子拿下多小时细分市场 >80% 的经济性
      - - 正论
        - SolidFlow 有机化学体系在架构上有差异化，并带来 FEOC 合规护城河
        - $15M/GWh CAPEX vs $100M 锂离子；不可燃；符合美国 IRA 的 FEOC 要求
        - 锂离子装机成本跌破 $50/kWh，使 10 小时时长失去经济性，或钒达到平价
      - - 正论
        - Uniper 5 GWh 有条件协议验证了公用事业规模商业路径
        - 2026 年 1 月框架在德国 Site Acceptance Test 成功后签署
        - 因性能不足，Uniper 到 2028 年 H1 仍未发出首个 100 MWh 调用订单
      - - 正论
        - Samsung Ventures 与 STRABAG 以 €1B+ 估值共同投资，释放 Tier 1 机构信心信号
        - Samsung 为新投资方；STRABAG 多轮支持，2023 年以 €100M 锚定
        - 领投方释放 down-round 意向，或在二级市场退出持股
      - - 反论
        - 收入前估值 €1B+，一旦执行滑坡，下行风险很重
        - 收入估计约 $1M；首批重大交付 2027 年；制造能力 1 GWh/年
        - 经审计账户确认收入 run rate 在 12 个月内超过 $50M
      - - 反论
        - 液流电池行业商业化记录参差不齐；多个玩家在规模化中失败
        - ESS Tech 市值跌至 $23.5M；行业范围内的交付延误已有记录
        - CMBlu 按成本目标持续准时交付 Uniper 批次
