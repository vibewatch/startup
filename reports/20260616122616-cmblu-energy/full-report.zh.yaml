              Invinity Energy Systems 是欧洲商业化最活跃的 VRFB 供应商，2025 年收入 £17M，公用事业项目管线包括欧洲最大的 VRFB——位于 East Sussex Copwood 的
              20.7 MWh 项目，预计 2026 年底投运。其 Endurium 产品目标到 2026 年底降本 66%，2027 和 2028 年收入预测分别为 £49M 和 £234M。Eos Energy
