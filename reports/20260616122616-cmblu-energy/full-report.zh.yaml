  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入和财务模型
        - FY2024 和 FY2025 经审计收入、ARR、烧钱速度和毛利率
        - 没有真实财务数据，就无法判断估值倍数或 runway；估算 $1M 收入意味着 >1,000x 倍数； 烧钱速度决定 Series C runway 是否充足
        - 向 CMBlu CFO 索取管理账或审计师函；若 CMBlu 是重大并表实体，与 STRABAG 年报交叉核对
      - - 股权结构和优先权栈
        - 完整 cap table，包括 STRABAG €100M 清算优先权、反稀释条款，以及所有前序轮次的参与权
        - STRABAG 的优先条款可能在 down-round 或中等退出场景下严重稀释 Series C 投资者； 普通股有效入场价可能远差于 €1B+ headline
        - 向 CMBlu 管理层索取 waterfall 模型；在 NDA 下独立法律审查 STRABAG 投资协议
      - - Uniper 合同先决条件
        - 5 GWh 框架协议下的完整先决条件、技术验收阈值和交付排期
        - 这份有条件合同是牛市论点的核心商业锚点；若条件严苛或绑定无法达成的里程碑，管线可能在任何收入出现前蒸发
        - 与 CMBlu 和 Uniper 法务审阅完整合同文件；从 Uniper 获取当前条件状态和下一里程碑的书面确认
      - - 制造扩产计划
        - 从 1 GWh/年扩到 2029 年 10 GWh/年的详细 capex 预算、设备采购、里程碑排期和独立技术风险评估
        - 扩产是最大执行风险；这种化学体系的有机化学制造在工业规模仍属新事物；成本超支或延误会直接压垮基准和牛市情景
        - 委托独立技术尽调（TÜV SÜD、EPRI 或同等级机构）；审阅工厂设计和供应商合同；验证美国和希腊建厂计划
      - - 竞争性 LCOS 基准
        - 在真实运行条件下，独立比较 SolidFlow、钒液流电池和锂离子 BESS 在 5–24 小时应用中的平准化储能成本
        - CMBlu 声称 CAPEX 为 $15M/GWh，而锂离子为 $100M；随着锂离子价格下跌、钒液流成熟，需要独立验证成本优势能否维持
        - 委托 Wood Mackenzie 或 BNEF 做独立成本基准研究；对照钒液流 CAPEX 数据，以及同等时长系统的 Fluence/Tesla 定价
    notes: 尽调路径是建议做法；获取 CMBlu 管理账需要 NDA 和投资者沟通；审阅 Uniper 合同需要双方许可。
    claimRefs:
      - CV030
      - CV050
      - CV051
      - CV052
      - CV014
      - CV042
figures:
  - id: FO001
    title: CMBlu Energy — 关键里程碑时间线
    type: timeline
    layout: wide
    summary: |
      按时间梳理 CMBlu Energy 从 2014 年到 2026 年 4 月成为独角兽期间的创立、融资、产品、规模化、治理和合作里程碑。
    data:
      items:
        - label: 创立
          date: '2014'
          detail: CMBlu Energy AG 在德国 Alzenau 成立，由 Dr. Peter Geigle 基于 2011 年启动的有机电池研究创立
          tone: positive
        - label: 首笔 R&D 补助
          date: 2019-12
          detail: 早期政府补助（约 $884K）；在机构资本进入前，先获得公共部门 R&D 初步验证
          tone: neutral
        - label: 第二笔 R&D 补助
          date: 2022-11
          detail: 第二笔政府补助（约 $1.05M）；同期 IRA 通过，推动美国市场进入规划
          tone: neutral
        - label: 美国子公司设立
          date: 2023-01
          detail: CMBlu 在 CA Petaluma 设立美国子公司，瞄准 IRA 激励；定位 FEOC-clean 供应链
          tone: positive
        - label: 首个商业部署
          date: 2023-07
          detail: Organic SolidFlow 与奥地利 Burgenland Energie 部署——首个付费欧洲客户
          tone: positive
        - label: Desert Blume 试点获批
          date: 2023-09
          detail: 与 Salt River Project 在 AZ Florence 做 5 MW / 50 MWh 试点；EPRI 监测；首个规模化美国公用事业客户
          tone: positive
        - label: STRABAG EUR 100M 投资
          date: 2023-10
          detail: STRABAG SE 投入 EUR 100M（$106.7M）战略股权；支持制造扩产和施工合作
          tone: positive
        - label: Alzenau gigafactory 投产
          date: '2024'
          detail: 1 GWh/年自动化生产，采用 ABB 机器人；首个 GWh 级非锂电池制造产线
          tone: positive
        - label: CEO 交接
          date: 2024-03
          detail: Constantin Eis 出任 CEO；Dr. Geigle 转任 Supervisory Board Chair；商业化阶段开启
          tone: neutral
        - label: 希腊 EUR 30M 补助
          date: 2024-11
          detail: 希腊部委提供 EUR 30M 欧盟支持补助；为最大 Produc-e Green 奖项；希腊 gigafactory 建设因此启动
          tone: positive
        - label: Uniper 5 GWh 框架
          date: '2026-01-20'
          detail: 与 Uniper 签署截至 2037 年的有条件 5 GWh 供货协议；2027 年开始交付；此前已成功通过 SAT
          tone: positive
        - label: EUR 1B+ 独角兽地位
          date: '2026-04-30'
          detail: Samsung Ventures 领投 EUR 50M Series C；估值 EUR 1B+；德国首家非锂电池独角兽
          tone: positive
        - label: SRP 锂离子火灾（背景）
          date: '2022'
          detail: SRP 2022 年锂离子电池火灾推动其关注不可燃替代方案；这是 Desert Blume 的背景
          tone: adverse
    approximationNotes: |
      早期补助金额和确切拨付日期为分析师估算，未获公司确认。Alzenau gigafactory 已确认于 2024 年投产， 但具体月份未公开。SRP 火灾背景条目是说明采用理由的历史负面事件，不是 CMBlu 事件。
