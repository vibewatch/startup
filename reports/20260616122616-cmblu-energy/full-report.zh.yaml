      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              六个结构性增长驱动正在加速 CMBlu 目标市场的 LDES 采用。第一，可再生能源渗透率提升带来电网不稳定：德国 2025 年录得 575 小时负电价，创历史新高，为多小时储能带来强套利经济性。第二，德国
              2026 年启动的容量市场将招标 2 GW 技术中立容量，明确纳入 BESS，完整市场设计目标为 2027 年，从而增加可预测收入。第三，IEA 数据显示，2025 年全球 BESS 新增 108 GW（同比增长
              40%），说明商业接受度已进入主流，融资周期缩短。第四，AI 驱动的数据中心增长创造了新的买方群体，它们看重防火安全、多小时备电和不含关键矿物。第五，锂和钒供应链承受地缘政治压力，二者均被 DOE
              列为关键材料；使用丰富地球材料的有机液流电池因此受益，尤其适合寻求供应链韧性和 IRA FEOC-free 合规的美国与 EU 买方。第六，EU 与美国政策框架（Net-Zero Industry Act、IRA
              investment tax credits）激励本土 LDES 制造。与这些驱动相对，四个约束压低采用节奏。第一，LDES CAPEX 仍高，LCOS 为
              $120–$350/MWh，项目要具备可融资性通常需要长期包销协议；多数 LDES 项目必须先有框架协议或 PPA，项目融资才能关闭。第二，德国 720 GW 电网接入积压相当于全国峰值负荷 9
              倍，已拖慢项目交付；新的成熟度队列评分系统将延迟拉长 12–18 个月。第三，BNEF 数据确认，未来十年中国以外 LDES 成本下降会慢于锂离子，因为锂离子享有 EV 驱动的规模经济，而 LDES
              没有。第四，中国液流电池制造商靠纵向一体化（钒电解液 RMB 180–220/kg）在 turnkey 系统定价上具备 30–40% 成本优势；德国 FCR 市场收入预计会在未来 2–3
              年随着更多电池上线而显著压缩，项目经济性压力上升。
