      - number: '8.4'
        title: 建议与最终尽调
        blocks:
          - type: paragraph
            body: >-
              以当前 €1B+ 入场价看，CMBlu Energy 是高风险、高期权性的机会。SolidFlow 技术具备可信差异化，LDES 顺风是结构性且在加速，Uniper 关系提供了通向欧洲公用事业级收入的入口。DOE
              支持和国家实验室伙伴关系增加机构可信度。但相对于当前证据点，估值已经拉伸。隐含收入倍数超过 1,000x，旗舰商业合同有条件，股权结构动态不透明，从 1 GWh/year 扩至 10 GWh/year
              的制造规模化，对工业规模有机化学流程而言仍是未验证的执行挑战。

              建议为继续研究。投资决定应推迟到以下事项完成：（1）经审计财务或管理账确认收入轨迹和现金可支撑时长；（2）披露完整 Uniper 先决条件，并评估其可达成性；（3）在下行情景下审查 STRABAG €100M
              投资形成的股权结构优先权栈；（4）独立验证 2027 年制造扩产资本开支和里程碑；（5）独立对标与钒液流替代方案的竞争性定价动态。

              论点失效触发条件清晰且可衡量：未能在 H1 2028 前交付首个 Uniper 分批；到 2028 年底制造产能仍低于 3 GWh/year；竞争对手先于 CMBlu 拿下重大 hyperscale
              数据中心合同；锂离子 BESS 价格显著压缩，使 5–10 小时窗口失去经济性；或未来 12 个月内发生下调估值融资。最可能的退出路径是由能源巨头或基础设施集团战略收购——STRABAG
              的建筑和基础设施专长暗示持续 M&A 兴趣——或在 2–3 年商业收入记录之后进行后期 IPO。
            claimRefs:
              - CV049
              - CV050
              - CV051
              - CV052
              - CV053
