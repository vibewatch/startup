  - id: FR001
    title: 风险热力图 – CMBlu Energy
    type: matrix
    layout: standard
    summary: 截至 2026 年 Q2，按发生可能性（纵轴）和影响（横轴）定性放置 CMBlu 的主要风险。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高 / 关键影响
      rows:
        - label: 高可能性
          values:
            - 有机液流效率落后 Li-ion（75% 对 95%）
            - 德国 BESS 并网监管不确定性
            - 制造扩产失败（到 2029 年从 1→10 GWh）
        - label: 中等可能性
          values:
            - 欧盟电池法规数字护照合规成本
            - 有机电解液降解 / 交叉渗透
            - STRABAG 集中度 / 退出风险
        - label: 中低可能性
          values:
            - 现有厂商发起知识产权专利挑战
            - Li-ion 在 8 小时时长达到价格平价
            - Uniper 条件性交易取消
        - label: 低可能性
          values:
            - NFPA 855 HMA 文件不合格
            - CEO 或 CFO 离职
            - ESS Inc 式接近停摆
    approximationNotes: 可能性和影响为基于已收集证据得出的定性估计；未开展正式概率分析或 Monte Carlo 模拟。
    claimRefs:
      - CR003
