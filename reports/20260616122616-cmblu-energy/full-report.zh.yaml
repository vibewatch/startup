            title: 不可燃化学体系降低安全许可风险，但不能消除风险
            body: >-
              CMBlu 的水基不可燃有机电解液相比锂离子显著降低火灾风险，简化 NFPA 855 Hazard Mitigation Analysis 文件，并改善城市和工业场址的许可时间表。在 Li-ion BESS
              火灾已导致市政暂停许可的时代，这是真实竞争优势。但 CMBlu 的水系液流电池系统如今已被 NFPA 855:2026 明确点名，意味着它面对的是规定测试要求，而不是此前较轻的「其他技术」门槛。
