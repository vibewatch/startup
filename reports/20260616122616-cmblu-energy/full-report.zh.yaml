  - id: FE004
    title: 产品成熟度 / 能力矩阵
    type: matrix
    layout: wide
    summary: |
      从六个能力维度评估 CMBlu SolidFlow 成熟度，并与钒氧化还原液流和锂离子基准对比。
    data:
      columns:
        - CMBlu SolidFlow
        - 钒氧化还原液流（VRFB）
        - 锂离子（LFP）
        - CMBlu 证据等级
      rows:
        - label: 长时储能（>8h）经济性
          values:
            - 强 — 边际成本仅为储罐体积
            - 中 — 钒电解质成本限制 >8h 竞争力
            - 弱 — 随时长线性扩展成本
            - 公司声称；独立经济建模有限
        - label: 现场验证循环稳定性（>5,000 次循环）
          values:
            - 部分 — TRL 7/8 已验证；20,000 次循环说法未在规模化场景证明
            - 强 — 公用事业规模已展示 20,000+ 次循环
            - 强 — LFP 的 2,000–6,000 次循环有充分记录
            - TÜV SÜD TRL 已确认；循环说法来自公司表述
        - label: 安全性 / 热失控风险
          values:
            - 很强 — 不可燃水系；本质上无热失控
            - 强 — 有硫酸危害，但无热失控
            - 中 — 需要主动热管理；火灾风险已有记录
            - 化学体系内生；未发布独立大规模火灾测试
        - label: 供应链独立性（无关键矿物）
          values:
            - 很强 — 有机材料来自生物塑料 / 木质素；不受 FEOC 约束
            - 弱 — 钒价格波动；约 80% 供应来自中国 / 俄罗斯
            - 弱 — 锂、钴、镍来自地缘政治敏感来源
            - 专利化学体系和多个独立来源确认
        - label: 制造可扩展性（CAPEX $/GWh）
          values:
            - 公司声称强 — $15M/GWh，对比锂离子 $100M（公司表述）
            - 中 — 钒电解质采购资本密集
            - 中 — 超级工厂规模生产需要 $50–100M/GWh
            - 公司表述；Alzenau 1 GWh/年仅验证工艺
        - label: 认证 / 可融资性
          values:
            - 弱 — TRL 7/8 已确认；IEC/UL 证书未公开发布
            - 强 — 十年公用事业部署；完整 IEC 认证栈
            - 很强 — 认证完整；可保险；在所有主要市场可融资
            - EU 和美国市场项目融资的关键尽调缺口
    claimRefs:
      - CE002
      - CE006
      - CE011
      - CE013
      - CE020
      - CE029
