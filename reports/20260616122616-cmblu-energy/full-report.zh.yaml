            claimRefs:
              - CP007
              - CP008
              - CP029
              - CP035
          - type: callout
            title: CMBlu 的竞争窗口在 8 小时以上显著打开
            body: >-
              Li-ion 的 LCOS 在放电超过 6 小时后急剧上升，因为每增加一小时都需要按比例增加电芯。CMBlu 的能量与功率解耦架构意味着，10h+ 的 LCOS 结构性更低，且不完全取决于生产规模。4
              小时时，CMBlu 不具竞争力；10 小时时，成本平价具备可能性；20 小时时，CMBlu 声称 LCOS 优势为 3–5 倍。战略问题在于：在 Form
              Energy（铁空气，100h）从上方、钠离子从下方挤压前，这个窗口是否足够大且稳定，足以支撑一门独立业务。
