      - number: '7.4'
        title: 合作伙伴、竞争与依赖风险
        blocks:
          - type: paragraph
            body: >
              STRABAG SE 是 CMBlu 资本结构中最集中的依赖：这家奥地利建筑集团 2023 年投资约 €100M，并在 Series C 中再次参投，成为远超其他方的主导财务支持者。任何涉及 STRABAG
              战略转向的情形——管理层变动、奥地利监管压力、建筑市场下行——都会直接威胁 CMBlu 的融资连续性，以及其计划中由 STRABAG 支持的制造规模化。Uniper 10 年有条件供应协议（5 GWh，2027
              年开始首批交付）同样高度集中：它是公司最大的商业承诺，并明确以试点现场验收测试成功为条件。若 Uniper 试点失败或延迟，CMBlu 的收入时间表将发生实质性后移。


              竞争端，CMBlu 的核心可寻址市场——8 小时以上的多小时电网和工业储能——正面临多股威胁汇合。CATL 控制全球 EV 电池市场 40%+ 份额，并积极扩张固定式储能。Form Energy 的铁空气电池于
              2026 年 2 月获得 $1B Google 部署协议。钒液流电池供应商（Invinity、CellCube、Dalian Rongke Power）也在争夺同一多小时时长板块。Energy
              Revolution Ventures 在 2025 年 7
              月评估称，液流电池面临「陡峭爬坡」，因为「仅靠性能已经不再是有说服力的卖点」——市场现在要求扩产速度和清晰成本轨迹，而锂离子在这些方面领先优势还在扩大。


              在有机液流电池细分中，Quino Energy、Jena Flow Batteries（在 Inner Mongolia 部署了全球最大 20 MWh 有机液流电池）和 XL Batteries
              都在争夺同一种技术差异化位置。Samsung Ventures 投资 CMBlu 带来潜在战略供应链伙伴，但 Samsung 同时也是主要锂离子制造商，存在内在利益张力。IRA FEOC 规则在美国市场上给
              CMBlu 相对中国供应商的结构性优势，但该优势依赖 2026 年后并不保证延续的监管连续性。
