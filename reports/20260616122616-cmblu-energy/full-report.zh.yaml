  - id: FE001
    title: SolidFlow 产品架构栈
    type: stack
    layout: standard
    summary: |
      Organic SolidFlow 电池的五层架构，从电化学核心到系统辅助设备再到软件，展示关键组件及其作用。
    data:
      layers:
        - label: 活性材料层
          detail: 固体有机聚合物颗粒 + 水系有机电解质，储存在负极液和正极液储罐中。它提供能量容量（kWh）， 与功率相互独立。
        - label: 电化学电堆层
          detail: 多孔电极 + 选择性离子交换膜；氧化还原反应发生在这里。它决定功率输出（kW/MW）， 可独立于储罐体积扩展。
        - label: 液流与热管理层
          detail: 泵、流量计、压力传感器、换热器、阀门。电解质在约 1 atm 下于储罐和电堆之间循环。 寄生负载带来约 15% 效率拖累。
        - label: 电力电子与 BMS 层
          detail: 逆变器、DC/DC 转换器、集成式软件定义 BMS。控制充放电循环、健康状态监测、预测性维护和电网接入。
        - label: 系统集成与控制层
          detail: SCADA 接口、远程监控、场站安全联锁、电网互联。模块化串级开关支持 80 串独立控制 （SRP Desert Blume 模型）。
    approximationNotes: |
      层级描述综合自 CMBlu 产品页、Utility Dive 技术访谈和 PV Magazine 架构描述。确切 BMS 软件栈和 SCADA 协议为专有信息，未公开记录。
    claimRefs:
      - CE003
      - CE005
      - CE031
      - CE033
      - CE041
  - id: FE002
    title: 客户流程：电网太阳能套利（公用事业用例）
    type: flow
    layout: standard
    summary: |
      端到端流程展示 SolidFlow 电池如何帮助公用事业公司把白天过剩太阳能发电转移到夜间需求高峰。
    data:
      nodes:
        - id: solar
          label: 太阳能发电（白天）
          description: 公用事业级 PV 在正午时段发出超过实时需求的多余电力。
        - id: charge
          label: SolidFlow 充电循环
          description: 多余电力注入 SolidFlow：电解质流经电堆；有机分子发生氧化 / 还原；能量以化学势形式储存在储罐中。
        - id: tanks
          label: 活性材料储罐
          description: 带电有机浆料保存在负极液和正极液储罐中；能量一直保存到调度时释放。体积决定储能时长 （kWh/MWh 规模）。
        - id: discharge
          label: SolidFlow 放电循环
          description: 收到调度指令后，电解质被泵回电堆；逆向氧化还原反应释放电子；储存 AC 能量的 75% 回送电网。
        - id: grid
          label: 电网调度（傍晚 / 夜间）
          description: 放电功率在傍晚峰值需求或夜间空调负荷期间送入电网（SRP Desert Blume 模型）。
        - id: bms
          label: BMS 与 SCADA 控制
          description: 软件定义 BMS 优化充放电时机，管理电芯串健康，并与公用事业 SCADA 对接以提供电网服务。
      edges:
        - from: solar
          to: charge
          label: 多余 AC 电力
        - from: charge
          to: tanks
          label: 带电浆料
        - from: tanks
          to: discharge
          label: 调度信号
        - from: discharge
          to: grid
          label: 送入电网的 AC 电力
        - from: bms
          to: charge
          label: 充电控制
        - from: bms
          to: discharge
          label: 调度控制
    claimRefs:
      - CE025
      - CE041
      - CE006
