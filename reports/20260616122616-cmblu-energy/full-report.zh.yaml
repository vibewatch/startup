      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 4 月 Series C 首关，CMBlu Energy 通过政府补助、战略股权投资和风险资本累计募集约 $170 million。公司在 2019 年和 2022
              年获得两笔小额政府补助，作为吸引机构资本前的早期研发支持。真正改变公司轨迹的是 2023 年 10 月的融资：奥地利基建集团 STRABAG SE 进行 $106.7 million
              战略股权投资，这是当时单笔最大融资，也是 STRABAG 首次投资储能技术开发商。这笔资金推动制造爬坡，并巩固双方战略合作：未来项目交付可借助 STRABAG 的大型基础设施建设能力。

              2024 年 11 月，CMBlu 获得希腊 Ministry of Environment and Energy 发放的 EUR 30 million 补助，资金来自 EU-backed Produc-e
              Green Recovery and Resilience program；这是该计划的最大单笔授予。该非稀释资本让公司无需摊薄股东，即可建设希腊第二座超级工厂，也体现了 EU
              层面对欧洲电池制造摆脱亚洲供应链的支持。

              2026 年 4 月，CMBlu 完成 Series C 首批交割，金额 EUR 50 million（约 $58.5 million），由 Samsung Ventures 领投，包括 STRABAG SE
              在内的所有既有投资者参投。本轮把公司估值推过 EUR 1 billion 门槛，使 CMBlu 成为德国首家非锂电池 unicorn。据报道，Series C
              仍向更多投资者开放。公开信息中，未发现二级交易或债务融资。收入和毛利率未公开披露，因此无法独立评估该估值的经营基础。
