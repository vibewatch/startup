      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 可融资性缺口是最主要的近端竞争风险
            body: >-
              CMBlu 缺少 Li-ion incumbents（Fluence、Tesla）甚至 DOE-backed 锌液流（Eos Energy）已经拿到的部署历史和第三方项目融资认证。在 Uniper 5 GWh
              项目交付商业运行数据（预计 2027 年）之前，贷款人会用更高资本成本为 CMBlu 项目定价，使公司在大型公用事业项目融资中处于结构性劣势。该风险尤其尖锐，因为 CMBlu
              的客户群（公用事业公司、hyperscalers）通常把项目融资作为标准采购工具。
            calloutType: risk
