      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 结构性供给不足：LDES Council 预测 2040 年需要 8 TW / 85–140 TWh
            body: >
              LDES Council 的净零情景分析预测，到 2040 年，全球 LDES 容量必须达到 8 terawatts / 85–140 terawatt-hours，部署速度需较当前提升 50
              倍。与之相比，IEA 数据显示，2025 年全球 BESS（所有时长）仅新增 108 GW，而 LDES 子赛道只是其中一小部分。可再生能源占比高的电网所需能力，与今天商业化部署规模之间存在结构性缺口，这正是
              CMBlu 有机液流技术的长期市场逻辑。
            calloutType: strength
            claimRefs:
              - CM017
              - CM015
              - CM016
          - type: callout
            title: 德国监管反转：电网积压与政策不稳定威胁项目可融资性
            body: >
              2026 年初，德国电池储能监管环境进入显著不确定期：2025 年 11 月授予 BESS 的建筑法规优先权数周内被实质收紧，先到先得电网接入机制被废除，而替代的成熟度评分流程仍未定稿。待处理电网接入申请达
              720 GW，是德国峰值负荷 9 倍；同时 FCR 收入预计会随着更多电池进入市场而压缩，新项目经济性承压。这是 CMBlu 欧洲增长管线最实质的近端市场约束。
            calloutType: risk
            claimRefs:
              - CM038
              - CM039
              - CM040
          - type: callout
            title: AI 数据中心需求创造防火多小时储能新买方
            body: >
              Hyperscale AI 数据中心正成为有机液流电池的结构性新买方：57% 的数据中心专业人士认为 AI 工作负载推高功率密度需求，76%
              在电池选择中优先考虑化学安全——这两个属性正是不可燃有机液流电池相对锂离子的强项。CMBlu 与 EnergyTech 将 Uniper 协议表述为相当于为 1 GW 数据中心供电 5
              小时，说明公司已意识到这一买方群体；但截至 2026 年 Q2，尚无公开确认的数据中心交易。
            calloutType: insight
            claimRefs:
              - CM023
              - CM024
              - CM031
          - type: callout
            title: 优先深耕 EU 公用事业市场，同时打造美国数据中心案例
            body: >
              CMBlu 近端最强市场是德国 / EU 公用事业公司：它们拥有遗留电网接入，也承担可再生能源 firming 任务，Uniper 框架协议验证了这一点。公司可并行争取一两个美国或 EU
              数据中心试点合同，利用防火安全优势和 IRA FEOC-free 定位，分散买方结构，并在制造规模化前降低对单一公用事业客户的高度集中风险。
            calloutType: recommendation
            claimRefs:
              - CM022
              - CM025
              - CM030
              - CM037
  - number: 3
    title: 竞争对手
    sections:
