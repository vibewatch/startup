  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从 LDES 市场证据和技术差异化，经过商业验证、估值纪律和风险评估，推导到继续研究建议的决策链。
    data:
      nodes:
        - id: market
          label: 到 2030 年 LDES 市场达 $10.43B —— AI 数据中心需求构成结构性拉动
        - id: tech
          label: SolidFlow：符合 FEOC，$15M/GWh CAPEX，10+ hr 时长，20 年寿命
        - id: commercial
          label: Uniper 5 GWh 条件性协议；SRP Desert Blume；Mercedes-Benz 20 MWh
        - id: valuation
          label: €1B+ 投后（约 $1.17B）对应约 $1M 收入 —— 隐含倍数 >1,000x
        - id: risks
          label: 收入前；制造未规模化（1 GWh/年）；Uniper 有条件；股权结构不透明
        - id: recommendation
          label: 继续研究：等 5 道尽调关口清晰后再推进
      edges:
        - from: market
          to: tech
          label: 拉动需求
        - from: tech
          to: commercial
          label: 已在试点中验证
        - from: commercial
          to: valuation
          label: 锚定管线价值
        - from: valuation
          to: risks
          label: 但估值已按完美执行定价
        - from: risks
          to: recommendation
          label: 未解决关口挡住买入
