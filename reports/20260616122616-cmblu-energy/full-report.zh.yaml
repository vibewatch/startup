      - number: '4.4'
        title: 财务缺口与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              作为处于早期商业化的私营公司，CMBlu 的财务披露非常有限。公开领域没有审计财报、P&L 数据或现金流信息。第三方数据服务给出的汇总收入估计相差超过一个数量级——从美国子公司低于 $1M，到德国母公司 $54M
              不等；差异来自不同法人实体、时间区间和估算方法，而非已验证数字。管理层或备案账目均未佐证这些估计，用它们做承销依据并不合适。


              五个阻断性或实质性缺口是：（1）收入与 ARR/GMV——缺失后无法评估增长率、收入质量和客户集中度；（2）毛利率——缺失后无法判断盈利路径和制造效率；（3）现金消耗和 runway——缺失后只能估算 2026
              年 4 月 Series C 的充足性；（4）债务与完整资本结构——没有债务证据，但也没有确认不存在；（5）商业规模单位经济——$15M/GWh CAPEX 主张需要用 Alzenau 工厂会计和首批
              Uniper 交付经济性做独立验证。CMBlu 美国负责人的坦率表述「需要更多数据和经验来为项目融资」说明，公司内部也承认这些缺口。Uniper director 也指出，SolidFlow
              的「性能和经济效率仍需在大规模使用中进一步确认」。在获得审计财务或透明 cap table / P&L 披露前，任何 CMBlu 财务模型都必须采用宽情景区间，并把估值以下所有科目视为估计。
