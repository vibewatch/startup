  - id: FU003
    title: 客户证据矩阵：按已命名客户评估证据质量
    type: matrix
    layout: wide
    summary: 评估 CMBlu 五个已命名部署和研究合作伙伴的证据强度、生产状态、约束力水平、留存可见度和商业规模。
    data:
      columns:
        - 部署状态（2026 年 6 月）
        - 证据强度
        - 合同约束力
        - 留存信号
        - 规模（MWh）
      rows:
        - label: Uniper（DE）
          values:
            - 已签商业框架；试点 SAT 通过；2027 年起交付
