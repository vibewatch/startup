      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 有机化学体系消除关键矿物风险
            body: >
              SolidFlow 的原料——来自木质素和生物塑料的碳基有机化合物——不含锂、钴、镍或稀土金属。因此，它在结构上免疫于钒价波动、中国供应链依赖以及美国 Inflation Reduction Act 下的
              FEOC 限制，使 CMBlu 成为极少数具备完全本土化供应链潜力的长时储能技术之一。
            calloutType: strength
            claimRefs:
              - CE013
              - CE032
          - type: callout
            title: 效率缺口带来经济建模风险
            body: >
              CMBlu 官方产品规格列出 75% AC-to-AC 系统效率，但获奖申报和早期 PR 材料引用的是 90% DC-to-DC 电芯级效率。15% 的差距足以显著影响 LCOS 模型。Uniper
              的有条件协议和 SRP 的「观望」姿态都反映了这种不确定性。买方和融资方在承诺公用事业级采购合同前，必须要求已部署项目提供独立测量的 AC 系统效率，而不是电芯级规格。
