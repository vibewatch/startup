      - number: '5.3'
        title: 市场应用与用例覆盖
        blocks:
          - type: paragraph
            body: >
              SolidFlow 电池针对 8–24 小时储能区间优化；在这个区间，锂离子经济性开始吃紧。2026
              年公司主攻三类用例：（1）公用事业与电网级可再生能源整合——吸收白天太阳能富余，并在夜间需求高峰调度释放。SRP 的 Desert Blume 试点正是这个模型：在 Arizona
              太阳能发电高峰时段储电，再在傍晚和夜间空调负荷期间放电。（2）AI 与 hyperscale 数据中心电力韧性——提供 10+ 小时可调度备电，同时避开锂离子在高密度园区的热失控许可风险。Uniper 协议（5
              GWh）规模足以为 1 GW 数据中心供电五小时。（3）商业与工业（C&I）脱碳——Mercedes-Benz 的 Rastatt 项目展示了工业设施如何把现场可再生能源与表后储能配对，实现全天候绿色用能。


              在公用事业板块，SolidFlow 的模块化是关键运营资产：SRP 试点将使用 80
              条可独立切换的串组，单个模块故障不会级联成全系统停机。该设计也与抽水蓄能等替代方案形成规模经济对比；后者成本基本线性扩张。CMBlu 美国总裁称，相比锂离子，成本竞争力大约从 5–6
              小时储能开始出现，并随时长增加而改善，因为增加储罐体积的边际成本低于增加电堆。
