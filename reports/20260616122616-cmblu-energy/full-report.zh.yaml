  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: SolidFlow 核心架构与化学体系
        blocks:
          - type: paragraph
            body: >
              CMBlu 的 Organic SolidFlow
              电池采用混合架构：既保留氧化还原液流电池功率与能量可拆开扩展的特性，又靠固态有机聚合物颗粒补充溶解电解液，提高可达到的能量密度。其活性化学体系由碳基有机化合物构成——来自木质素及相关生物可得原料——这些化合物以固体颗粒形式储存在外部储罐中，并与水基（水系）有机电解液并存。运行时，电解液浆料混合物从储罐泵入电化学电堆，在独立的阳极液和阴极液回路中，于多孔电极上发生氧化（充电）和还原（放电）反应。选择性离子交换膜隔开两个半电池，允许小离子迁移以平衡电荷，同时阻挡更大的有机大分子，避免串液和容量衰减。


              SolidFlow
              架构的根本优势在于解耦扩展：功率输出（kW/MW）只由电化学电堆的尺寸和数量决定，储能容量（kWh/MWh/GWh）则完全取决于外部储罐中的活性材料体积。因此，要延长放电时长，增加的是电解液体积和有机固体，而不是额外功率电子设备。长时储能的
              CAPEX 曲线由此与锂离子电池出现结构性差异；后者的功率和能量必须同步扩展。


              基础商用模块在 1.14 × 1.14 × 1.60 m 的紧凑占地内，提供 10 kW 功率输出和 100 kWh 容量。官方产品规格表列出的往返效率为 75%（AC-to-AC 系统）。早期获奖材料曾引用电芯
              / 电堆层面的 90% DC-to-DC 效率——这是完全不同的口径，不包含泵送负载、功率转换损耗和热管理；若分析师把 90% 当作系统效率，会高估项目经济性。系统在接近大气压（~1
              atm）下运行；与需要较高压力来实现高效离子交换的金属基液流电池相比，泵、阀门和密封件的寄生负载与机械磨损更低。
