      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              CMBlu Energy AG 由德国生物科技创业者 Dr. Peter Geigle 于 2014 年创立；他早在 2011 年就开始研究有机液流电池化学。Geigle 自公司注册起担任创始人兼 CEO，直至
              2024 年初。2024 年 3 月，Constantin Eis 出任 CEO，Dr. Geigle 转任监事会主席。这符合德国 Aktiengesellschaft
              双层治理模式：执行管理与监督职能正式分离。该交接显示，公司有意从创始人主导的研发阶段，转向商业工业化。

              现任高管团队包括：Dr. Nastaran Krawczyk 任 Chief Technology Officer，Olaf Althaus 任 Interim CFO，Markus Geigle 任 EVP
              Sales and Marketing，Dr. Jan Prochnow 任 EVP Product Development，Alexander Stripling 任 EVP Operations，Dr.
              Marco Brand 任 General Counsel，Giovanni Damato 任美国分部 President（驻 Petaluma, California），George Paterakis
              任希腊业务 President。CMBlu 总员工超过 250 人，其中 150 多名是科学家和工程师，体现出公司从研究实验室起步后留下的深厚研发底盘和技术优先文化。

              关键人物依赖是实质性治理议题。Dr. Geigle 掌握创始 IP 愿景和深厚有机电化学经验；他留任监事会可缓释交接风险，但公司的科学可信度仍与其研究传承高度绑定。CFO 职位仍是
              Interim，给资本密集阶段带来继任不确定性。除 Dr. Geigle 外，监事会其他成员未公开披露，构成治理透明度缺口。公开信息中，未发现任何已点名高管涉及重大负面领导事件——包括离职、公开争端或监管执法。
