    rows:
      - - 德国：2025 年出现 575 个负电价小时；可再生能源发电占比 >60%
        - 驱动因素
        - ↑ 正向
        - 近期（2026–2027）
        - 多小时储能获得即时套利拉力；印证 Uniper 交易逻辑
        - 确认 Uniper 首批部署时间表和电网接入状态
      - - 德国容量市场：2026 年 2 GW 技术中性招标；2027 年完成完整设计
        - 驱动因素
        - ↑ 正向
        - 近期（2026–2028）
        - 套利之外新增可预测容量收入；提高项目可融资性
        - 评估容量补偿费率，以及 LDES 相比 2 小时锂电的折减方法
      - - EU Net-Zero Industry Act + 美国 IRA 对电池储能的 FEOC-free 要求
        - 驱动因素
        - ↑ 正向
        - 近期（持续）
        - 政策激励欧洲 LDES 制造；德国制造 SolidFlow 受益
        - 确认 CMBlu 供应链 FEOC 认证和 EU 战略项目状态
      - - AI 驱动的数据中心需求：功率密度升至每机柜 120–300 kW
        - 驱动因素
        - ↑ 正向
        - 中期（2026–2030）
        - 为非易燃、无关键矿物的多小时备份打开新买方类别
        - 量化 CMBlu 在公开 SRP/Uniper 引用之外的数据中心管线
      - - 锂 / 钴 / 钒关键矿物承受地缘政治压力；供应链多元化要求
        - 驱动因素
        - ↑ 正向
        - 近期（持续）
        - 有机液流的无矿物化学体系成为美国和欧盟买方的采购差异点
        - 跟踪钒和锂价格波动，作为竞争优势强度的代理指标
      - - LDES CAPEX 高：LCOS $120–$350/MWh；项目融资需要长期购电协议
        - 约束
        - ↓ 负向
        - 近期
        - 限制自融资 SME 买方；迫使公司依赖公用事业级框架协议
        - 验证 CMBlu 每 kWh 系统定价，以及 10 年 Uniper 结构能否复制
      - - 德国电网接入积压：待接入 720 GW，对比截至 2025 年已接入约 2.5 GW
        - 约束
        - ↓ 负向
        - 近期（2026–2027）
        - 即使有需求，项目部署也会放慢；成熟度队列增加 12–18 个月
        - 将 CMBlu 项目管线映射到已知并网场址；评估首批地点
      - - 中国液流电池成本优势：交钥匙价格低 30–40%；钒价 RMB 180–220/kg
        - 约束
        - ↓ 负向
        - 近期
        - 有机化学体系必须在规模化后证明 LCOS 优势足以与 VRFB 竞争
        - 委托独立 LCOE 对比：SolidFlow vs. 中国 VRFB，按 10 年 / 20 年寿命
    notes: >
      时间判断基于截至 2026 年二季度的政策时间表和市场数据。方向从 CMBlu 市场机会视角出发。 德国 FCR 收入压缩是另一项约束，未单列：Wood Mackenzie 预计，到 2030 年， 套利将取代辅助服务，成为
      BESS 主导收入来源，从而压缩近期依赖 FCR 的项目经济性。
