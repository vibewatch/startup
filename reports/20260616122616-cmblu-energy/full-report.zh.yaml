      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: FEOC 安全、非锂架构——结构性竞争优势
            body: >
              CMBlu 的 SolidFlow 技术避开所有 Foreign Entity of Concern 供应链，因此完全有资格获得美国 IRA 税收激励，包括 Section 45X 先进制造抵免和国内含量 ITC
              加计，ITC 收益可能达到 40%。FEOC 限制正在收紧，锂离子 OEM 面临越来越大的采购不确定性；CMBlu 的有机化学体系和本地化供应链，构成难以被依赖中国供应的竞争对手快速复制的结构性差异。
            calloutType: strength
