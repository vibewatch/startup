      - number: '7.3'
        title: 财务与执行风险
        blocks:
          - type: paragraph
            body: >
              CMBlu 于 2026 年 4 月完成 €50M Series C 首关；这是仍在开放融资轮的第一批资金，CEO Constantin Eis 确认公司正「接触更多投资者」。累计融资总额估计为
              €250M+——对液流电池初创公司而言不小，但相比在三国扩至 10+ GWh/year 的资本需求仍然有限。按行业基准，电池 gigafactory 扩至 10 GWh/year 意味着累计资本开支约
              €800M+，远超当前现金资源。公司在多 GWh 规模上仍处于收入前阶段，依赖基于里程碑的资本分批注入。


              LDES 板块存在有记录的可融资性问题。LDES Council 2025 年 12 月报告发现，由于运营数据有限、叠加价值流收入不确定，商业银行认为新型 LDES 技术对传统项目融资过于高风险。ESS Inc
              于 2025 年 6 月接近关闭 Oregon 工厂、需要紧急资本避免停摆，是该板块最鲜明的执行先例。ESS 在部分转向 Energy Base 平台前，2025 年收入 $1.6M、净亏损 $63.4M。


              CMBlu 高管团队的执行风险集中在顶部。Constantin Eis 于 2024 年 3 月 / 4 月出任 CEO，距离关键 Uniper 交付窗口开启只有 18
              个月；其背景是消费科技（Casper、Lichtblick、Home24），而非重工业制造。CFO 职位由 Olaf Althaus 临时担任，尚无公开宣布的永久任命。CTO（Dr. Nastaran
              Krawczyk）提供 R&D 连续性，但在重大融资和 gigafactory 建设执行节点，缺少永久 CFO 是治理缺口。
