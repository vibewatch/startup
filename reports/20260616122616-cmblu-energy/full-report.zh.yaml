      - number: '6.2'
        title: 具名部署与商业采用轨迹
        blocks:
          - type: paragraph
            body: >
              CMBlu 的商业部署序列始于 2023 年 7 月 Burgenland Energie 在奥地利东部 Schattendorf 风光混合园区的试点——这是全球首个投运的 Organic SolidFlow
              装置，最初置于一个 40 英尺集装箱内，并直接连接 15 MW 光伏电站。同月，CMBlu 宣布与 WEC Energy Group 和 EPRI 在 Wisconsin Milwaukee 的 WEC
              Valley Power Plant 开展示范项目，目标为 1–2 MWh、5–10 小时放电时长，测试自 Q4 2023 开始。Burgenland Energie CEO Stephan Sharma
              表示，到 2030 年 SolidFlow 储能容量目标为 300 MWh，显示出扩张意图。

              2023 年 9 月，Salt River Project（SRP）通过竞争性 RFP 流程选择 CMBlu 承担「Desert Blume」项目：位于 Arizona Florence 的 SRP Copper
              Crossing Energy and Research Center 的 5 MW / 50 MWh 试点。CMBlu 代表 SRP 建设、拥有并运营系统——建设、拥有、运营模式把资本风险转给
              CMBlu。SRP CEO Jim Pratt 确认，该项目将在「更长时段，尤其是能源需求波动且高企时」补充该公用事业的电力系统。EPRI 受聘进行独立性能监测。施工最初目标为 2025 年初启动、2025 年
              12 月上线；SRP 新闻稿后来更新，修订上线日期为 2027 年 12 月——延后两年。2025 年 3 月，CMBlu 宣布 Rubicon Professional Services
              担任设计和工程合作伙伴，确认施工准备仍在推进。

              2024 年 3 月，Mercedes-Benz 为其德国 Rastatt 生产设施下单一套 11 MWh SolidFlow 系统，投资额为个位数百万欧元，计划 2025 年下半年安装。2023 年 12
              月，Argonne National Laboratory 和 Idaho National Laboratory 被 DOE Office of Clean Energy Demonstrations
              选为六个长时储能实验室示范之一，用于验证 SolidFlow 在微电网和 EV 充电用例中的适配性（多年期，2024–2027）。

              该阶段的商业里程碑是 2026 年 1 月 20 日与 Uniper Kraftwerke GmbH 签署有条件供应框架——最低 5 GWh，自 2027 年起可按 100 MWh 分批调用，至 2037
              年有效。此前，CMBlu 在德国 Uniper Staudinger 电厂完成 1 MW / 1 MWh SolidFlow 系统的现场验收测试（SAT）。Uniper
              创新总监公开表示，虽然该技术「有前景」，但其「性能和经济可行性仍需在大规模部署中进一步证明」。2026 年 4 月，CMBlu 完成 €50 million Series C 首关，Samsung
              Ventures 与包括 STRABAG SE 在内的所有现有投资者支持，公司估值跨过 €1 billion 门槛。
