  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >-
              CMBlu Energy 采用纯 B2B 硬件销售模式：公司制造 SolidFlow 有机液流电池系统，并通过长期供货协议直接销售给公用事业公司、电网运营商、工业设施和 hyperscale 数据中心。2026
              年 1 月签署的 Uniper 框架协议，是公开披露的最大客户承诺：2027 至 2037 年间至少交付 5 GWh，按 100 MWh 分批交付。该协议也展示了公司的 go-to-market
              路径：先用技术验证试点，再进入 multi-GWh 供货合同。Uniper 交易的详细商业定价条款未公开披露，这是 B2B 基础设施合同中常见的结构性不透明。


              CMBlu 官方制造页面列出目标系统 CAPEX 约 $15 million/GWh，生命周期 LCOS 目标低至 $0.05/kWh。两项数据均由公司给出；截至 2026 年 6 月，尚未在 multi-GWh
              商业规模上接受独立审计。$15M/GWh 指的是 CMBlu 制造方法的资本强度——避开 clean-room 流程使其成为可能——而不是经普遍确认的单套售出价格。公司计划在硬件供货之外叠加服务和维护协议，形成
              recurring-revenue 层，但这些安排的细节尚未公开披露。


              CMBlu 与 STRABAG SE 的优先合作打开了一条联合开发渠道：STRABAG 的施工和基础设施能力与 CMBlu
              电池技术结合，为工业和市政客户建设「能源仓库」。该渠道不会改变以硬件为中心的收入确认模式，但能把分销扩展到 STRABAG 的项目管线。政府示范项目——例如美国 Department of Energy 的
              Office of Clean Energy Demonstrations program 与 Argonne、Idaho National Laboratories
              的项目——提供验证和部分非现金成本分摊价值，但按披露信息看，不构成实质收入流。
