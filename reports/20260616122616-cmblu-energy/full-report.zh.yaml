      - number: '2.3'
        title: 买方与细分市场地图
        blocks:
          - type: paragraph
            body: >
              多小时 LDES 的核心买方首先是公用事业公司和电网运营商，其次是独立电力生产商（IPP）、数据中心和工商运营商。在德国和
              EU，大型部署主要由传统能源公司主导，这些公司把遗留化石燃料电网连接改造成电池储能资产：2025 年投运的德国 14 个最大电池项目中，有 9 个属于 RWE、Uniper、LEAG、STEAG 和
              Verbund 等 incumbents。它们掌握既有 380 kV 电网接入，而这正成为公用事业级 BESS 项目最稀缺的投入，形成结构性采购优势。CMBlu 已与 Uniper 签下 5 GWh
              有条件供货协议，交付期从 2027 年延续至 2037 年，这是该买方细分市场最清晰的验证。公用事业板块的预算归属包括：资产型公用事业公司的受监管 CAPEX、IPP 依托长期 power purchase
              agreements 的项目融资，以及预计 2027 年起兑现的容量市场报酬。第二个新兴买方是 hyperscale 和 AI 数据中心运营商，它们面临更高功率密度要求（AI 工作负载每机架 120–300
              kW），也承受替换柴油备电发电机的压力。ZincFive 2026 年调查显示，57% 的数据中心专业人士认为 AI 工作负载推高功率密度和占地需求，52% 把 AI
              动态电力管理列为电池选择的首要标准。消防安全（76% 优先）和总拥有成本（84% 优先）是领先选择标准，二者都利好有机液流电池。第三个细分是寻求表后韧性和需量电费管理的工商运营商；全球 C&I 储能市场 2026
              年估计为 $7.94–18.7 billion。CMBlu 在 Desert Blume（5 MW、10 小时）与 Salt River
              Project（SRP）的美国首个公用事业部署，显示其在德国之外的公用事业买方群体也获得早期验证。
