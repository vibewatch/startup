            title: STRABAG 集中度是最大单一资本风险
            body: >-
              STRABAG SE 贡献了 CMBlu 约 €250M 生命周期资本中的多数，继续参与 Series C，并且是制造规模化的工业伙伴。只要 STRABAG
              出现任何战略变化——管理层变动、建筑行业下行、奥地利监管压力——都会在希腊和美国 gigafactory 仍需要数亿新增资本时，直接威胁 CMBlu
              的融资连续性。这是一票否决级风险，且没有容易获得、规模相当的替代方。
