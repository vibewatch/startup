      - number: '6.3'
        title: 留存证据、扩张潜力与集中度风险
        blocks:
          - type: paragraph
            body: >
              CMBlu 未公开披露净收入留存（NRR）、总收入留存（GRR）或客户流失指标。考虑到业务在收入意义上仍处于商业化前阶段——五个具名客户均为试点或建设阶段——传统 SaaS
              式留存指标不适用于其标准形态。最接近留存韧性的代理指标是试点延续：Burgenland Energie 自 2023 年 7 月以来持续运行（3+ 年），没有公开宣布终止；Uniper
              试点从初始测试推进到商业供应框架，是客户满意度和扩张意图的最强证据。

              现有客户内的扩张潜力很大，但有条件。Burgenland Energie 从最初集装箱级试点提出到 2030 年达到 300 MWh 的目标，名义扩张约 40×。Uniper 框架允许分批调用至 5 GWh
              总量，并计划在供应合同之外配套服务和维护协议，提供长期收入延伸。Mercedes-Benz 的模块化系统明确为未来扩展设计（CMBlu 美国总裁称可「轻松从五六小时基线提升到 10 或 12
              小时基线」）。但所有扩张都取决于各部署中的性能验证。

              集中度风险尖锐。Uniper 5 GWh 框架是 CMBlu 唯一披露的大规模供应承诺，很可能占管线价值的绝大部分。但该协议是有条件的——Uniper
              控制调用时间和最低分批规模，也可能选择不下单。财务条款（单价、合同总价值）均未披露。其他具名客户部署均低于 25 MWh，也没有公开收入或合同金额。CMBlu 美国总裁在 2024
              年初承认，最大障碍是「获得更多数据和经验，以便为这些项目融资」。CMBlu 正积极营销的数据中心和 hyperscaler 板块，截至 2026 年 6 月没有已宣布客户。Canary Media 2023
              年独立分析指出，液流电池历史上「炒作与实际性能不成比例」；SRP 创新经理也表示「第一次就猜对的概率并不高」——这些信号说明，即便在已接触客户中，非锂 LDES 的采购承诺仍然谨慎。
