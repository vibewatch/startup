  - id: TV005
    title: 论点失效和终止触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 监测指标
      - 行动含义
    rows:
      - - Uniper 框架未激活
        - 到 2028 年上半年未发出 100 MWh call-off
        - 抹掉主要 5 GWh 收入管线；释放技术无法规模验证的信号
        - Uniper 新闻稿；CMBlu 投资者更新；Staudinger 现场建设活动
        - 退出或减记；触及该触发器即投资论点失效
      - - 制造爬坡未达标
        - 2028 年底产能低于 3 GWh/年（对比 2029 年 10 GWh 目标）
        - 无法履约 Uniper 或超大规模订单；单位经济性仍未在 GWh 规模验证
        - CMBlu 产能公告；Alzenau、美国和希腊招聘；资本开支披露
        - 降低仓位；进一步出资前，要求更新后的扩产计划并经独立验证
      - - 竞争对手抢占超大规模客户
        - Form Energy 或钒液流玩家早于 CMBlu 拿下 >500 MW 超大规模合同
        - 击穿 CMBlu 的数据中心先发叙事；压缩可实现估值倍数
        - Google、Microsoft、Amazon、Meta 储能采购公告
        - 重估竞争护城河；推动管理层加快美国 go-to-market 时间表
      - - 锂离子成本压缩
        - 到 2027 年，已安装 2 小时锂离子 BESS 价格跌破 $50/kWh
        - CMBlu 在 5–10 小时时长的成本优势明显收窄；可服务市场缩水
        - BNEF 电池价格追踪；Tesla Megapack 定价公告；拍卖结果
        - 寻找证据，证明 CMBlu 能切入 24 小时以上应用，而锂离子在这些场景仍结构性不具竞争力
      - - Down-round 或困境融资
        - CMBlu 以低于 €700M 投后估值融资，或接受惩罚性条款的过桥
        - 释放投资者信心失效信号；可能触发 STRABAG 优先股栈的反稀释
        - 任何新融资公告；PitchBook 或 Preqin 的二级市场信号
        - 亏损退出；投资论点结构性破裂；优先权悬顶让普通股回收希望很低
    notes: 触发器是基于公开证据搭建的分析框架；实际合同条件和清算优先权 ratchet 细节并未公开披露。
