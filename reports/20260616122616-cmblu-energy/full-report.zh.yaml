      - number: '4.2'
        title: 单位经济与成本架构
        blocks:
          - type: paragraph
            body: >-
              CMBlu 的单位经济叙事压在两个公司声称的基准上：制造资本强度约 $15 million/GWh（锂离子约 $100 million/GWh）以及生命周期 LCOS 目标 $0.05/kWh。两项指标来自
              CMBlu 对 SolidFlow 的设计选择：使用有机聚合物和水基电解质，不需要 clean-room 装配，避开关键矿物，并让功率与能量容量可独立扩展。储能罐可以独立于功率 stack
              扩大，因此系统时长越长，单位 kWh 成本越低——CMBlu 称，这一结构性优势让 SolidFlow 在约 5 小时以上时长可与锂离子竞争，并在 10+ 小时时越来越占优。


              公司美国 President Giovanni Damato 在 Utility Dive 报道中确认，SolidFlow 在超过 5 小时时长上可与锂离子竞争，同时承认截至 2026
              年初，为大型商业项目融资收集足够运行数据，是最大障碍。Uniper 的 innovation director 也强化了这一点，称 SolidFlow
              的经济效率仍需要在商业规模确认。这些反向佐证说明，$15M/GWh 和 5¢/kWh
              仍是未经验证的目标，而非已跑通的商业规模经济性。处于类似早期商业阶段的液流电池公司，通常因研发摊销、制造爬坡成本和初始销量较低，毛利率为负或很低。


              2026 年行业基准显示，vanadium redox flow batteries 的安装 CAPEX 在典型公用事业规模（2–8 小时时长）下约为 $450–$750/kWh，最佳长时项目接近
              $284–$450/kWh。有机液流电池商业化更早，缺少经市场验证的广泛基准。CMBlu 声称的制造经济性明显激进于钒液流和有机液流先例，因此独立验证格外关键。
