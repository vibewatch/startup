            - 中 — BOO 协议；计划由 EPRI 验证；SRP 保留评估权
            - 无 — 尚未运行
            - '50'
        - label: Mercedes-Benz（DE）
          values:
            - 计划 2025 年 H2 安装；运行确认待定
            - 高 — CMBlu 官方新闻稿；引用客户董事会成员
            - 低 — 单笔采购订单，个位数百万欧元；未宣布后续订单
            - 未知 — 未发布安装后更新
