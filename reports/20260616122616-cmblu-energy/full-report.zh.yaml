      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议——估值拉伸下继续研究
            body: >-
              CMBlu Energy 投后估值 €1B+（$1.17B），当前估计收入约 $1M，估值已押注 2028 年前近乎完美执行。LDES 机会结构性且真实，SolidFlow 具备可信差异化，Uniper
              协议提供了可见商业路径。但现有证据基础尚不足以支持买入建议。应等到股权结构透明度、经审计财务、Uniper 合同确定性和制造规模化可信度通过直接尽调建立后，再作投资决定。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV046
              - CV021
              - CV047
              - CV052
          - type: callout
            title: 主要风险——收入前独角兽定价
            body: >-
              最高确定性的风险是，CMBlu 超过 €1B 的估值明显高于现有证据能支撑的水平。ESS Tech 是一家上市铁液流电池公司，商业化阶段相近，公开市场估值约 ~$23.5M。没有经审计收入、Uniper
              协议带有条件、股权结构优先权不透明，三者叠加后，进入 Series C 的投资者在熊市情形下可能面对 40–60%
              的估值下调。液流电池行业已有的商业化记录也喜忧参半，这进一步强化了担忧：多家公司融了大笔资金，却卡在工业规模落地。
            calloutType: risk
            claimRefs:
              - CV034
              - CV046
              - CV043
              - CV047
          - type: callout
            title: 战略优势——FEOC 合规与机构背书
            body: >-
              在现行 IRA 执法框架下，CMBlu 符合 FEOC 要求的供应链，是其在美国市场可持续的结构性优势。Samsung Ventures 作为新的 Series C 投资者加入，STRABAG
              也持续支持，说明这项技术已经通过 Tier 1 机构尽调。Argonne 和 Idaho National Laboratory 的测试合作、2025 年 smarter E Award 储能创新奖，以及 DOE
              LDES 示范项目支持，共同把技术可信度推到预商业化公司少见的水平；即便商业收入还没有落地，这一点仍然成立。
            calloutType: strength
            claimRefs:
              - CV017
