        - BNEF LCOS 基准；锂离子电芯价格指数（CATL、BYD 现货定价）
        - 8–12 小时锂离子的行业共识 LCOS 到 2028 年降至 $0.055/kWh 以下
        - 压缩 CMBlu 可触达市场窗口；对 CMBlu $0.05/kWh 目标压力测试 LCOS 假设
      - - Series C 融资缺口
        - 融资公告；Series C 最终交割日期
        - Series C 到 2026 年 Q3 末最终交割总额低于 €100M
        - 运营风险标记；2027 年交付义务需要追加制造 capex；谈判里程碑融资
    notes: 阈值基于公开财务基准和 CMBlu 披露的产量目标，仅作示例；并非基于 CMBlu 内部财务模型。投资者应结合自身组合监测框架校准这些触发项。
