            title: Uniper 交易有条件，且是唯一大型承购承诺
            body: >-
              Uniper 5 GWh 供应协议——CMBlu 最受关注的商业锚点——明确以试点现场验收测试成功为条件。Uniper 交易持续至 2037 年，若兑现将形成转型级收入流；但其条件性意味着任何试点失败、范围争议或
              Uniper 战略变化，都会把 CMBlu 的收入时间表重置数年，并拿掉支撑 €1B+ 估值的主要商业验证。
