chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              CMBlu Energy AG 是一家德国深科技长时储能系统开发商和制造商，总部位于德国巴伐利亚州 Alzenau，靠近法兰克福。公司由生物科技创业者 Dr. Peter Geigle 于 2014
              年创立，脱胎于欧洲最大的无锂电池研究实验室之一，之后成长为具备全球野心的商业化储能成长型企业。公司给出的使命是「以自然为灵感，让世界拥有无限储能」。CMBlu 称自己是 SolidFlow
              电池类别的唯一发明者，也是全球最大的不依赖锂的电池企业。

              CMBlu 的专有 SolidFlow 电池架构把有机氧化还原液流与固态电池技术结合起来。系统使用不可燃的水基电解质，避开锂、钴、镍等所有关键原材料，因此天然安全、可回收，也不依赖受限或地缘政治敏感供应链，包括受
              FEOC 限制的来源。SolidFlow 电池设计为每个循环输出 10 小时以上可调度电力，直指限制超大规模数据中心增长的最紧迫结构性瓶颈之一。

              CMBlu 的商业模式以硬件为先：公司设计、制造并销售或部署 Organic SolidFlow 电池系统，客户包括公用事业公司、电网运营商、数据中心以及工商客户。制造锚点是德国 Alzenau
              的自动化超级工厂，2024 年投产，初始产能 1 GWh/年；希腊工厂在建，Petaluma, California 工厂处于规划阶段。公司用安全性、长时长、不含 FEOC 风险的供应链和制造 CAPEX 约每
              GWh $15 million 来做差异化；管理层称，可比锂离子产线 CAPEX 为每 GWh $100 million，CMBlu 具备 85% 成本优势。若商业规模上能守住这一差距，LDES
              经济性可能被重塑。
