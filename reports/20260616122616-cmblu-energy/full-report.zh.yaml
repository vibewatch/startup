      - number: '5.2'
        title: 制造基础设施与商业部署
        blocks:
          - type: paragraph
            body: >
              CMBlu 在德国 Alzenau 的 Battery Production Center（BPC）生产 SolidFlow 电池。该中心自 2024 年投产，目前按 1 GWh
              年装机产能生产。工厂实现完全垂直整合，覆盖材料开发、电化学电堆组装、模块集成和系统测试；全流程不需要锂离子生产中抬高成本和复杂度的洁净室。公司管理层把所需制造技能描述为「汽车型」，意味着现有工业劳动力可以经过培训进入流程，也让未来工厂选址更灵活。


              CMBlu 的三地 gigafactory 路线图目标是到 2029 年总年产能超过 10 GWh。第二座工厂位于希腊 Athens 附近，由希腊环境与能源部提供 €30 million 赠款共同资助，2027
              年投产后最高将新增 4 GWh。第三座工厂规划在 California Petaluma，目标 2029 年启动，瞄准北美 hyperscale 和数据中心需求；在 Inflation Reduction Act
              之下，CMBlu 的不可燃化学体系和 FEOC-clean 供应链构成竞争优势。


              截至 2026 年 6 月的商业部署里程碑包括：（1）CMBlu 与 Uniper 于 2026 年 1 月签署有条件 5 GWh 框架协议，此前其在 Uniper Staudinger
              电厂完成现场验收测试（SAT）；2027 至 2037 年间将以 100 MWh 分批交付。（2）Mercedes-Benz 于 2024 年 3 月为 Rastatt 工厂订购 11 MWh 系统，目标 H2
              2025 投运。（3）Salt River Project（SRP）Desert Blume：位于 Arizona Florence 的 5 MW/50 MWh 项目，是 2025 年 9 月宣布的
              Google-SRP 清洁能源研究合作的一部分，最初目标是 2025 年 12 月运行。（4）WEC Energy Group Valley Power Plant 试点（Milwaukee）：1–2
              MWh、5–10 小时时长，并由 EPRI 评估。（5）DOE OCED 资助的 Argonne National Laboratory 和 Idaho National Laboratory
              示范项目，面向微电网和 EV 充电应用，2023 年 9 月入选。


              公司声称制造 CAPEX 约为每 GWh $15 million，而锂离子约为每 GWh $100 million——资本成本优势达 85%；若该优势在完全商业化规模下维持，将重塑长时储能经济性。目标 LCOS
              约为 $0.05/kWh。
