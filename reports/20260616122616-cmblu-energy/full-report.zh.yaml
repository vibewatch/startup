      - number: '8.3'
        title: 情景分析与可比估值
        blocks:
          - type: paragraph
            body: >-
              多头情景假设 CMBlu 到 2028 年成功扩至每年交付 5+ GWh，激活 Uniper 框架，并至少签下一项 hyperscale 数据中心协议。若 2028–2029 年收入运行率预计达到
              $200M+，并采用 15x 前瞻收入倍数（与增长拐点前商业化 LDES 公司的溢价定价一致），隐含企业价值达到 $3B+，较当前 €1B 入场约 2.5x 回报。该情景需要：大规模现场验收测试成功、到 2028
              年 gigafactory 扩至 5 GWh/year、签下 hyperscale 数据中心合同，并且锂离子价格下跌不造成实质性挫折。

              基准情景预计首批 Uniper 交付于 2027 年初开始，2028 年底爬坡至 2 GWh/year，2029 年收入达到 $80–100M。按 12x 前瞻收入倍数，隐含企业价值约
              $1.2–1.5B；较当前估值只是温和抬升，3–4 年名义回报 1.0–1.3x，以当前入场价格看，风险调整后补偿不足。

              空头情景假设 Uniper 条件未满足，制造延误把首批收入推迟到 2028 年以后，且 Form Energy 等资本充足的竞争对手拿下 hyperscale 数据中心管线。在这种情景下，CMBlu 于
              2027–2028 年以 €400–600M 估值进行下调估值融资，较 Series C 投后估值下降 40–55%。鉴于该板块已有商业化时间表屡次错失的记录，这一情景并不牵强。

              LDES 板块可比估值分布很宽。Form Energy 估值 $3.4B+（铁空气，Google 锚点），ESS Tech 公开市场市值已跌至 $23.5M（上市、铁液流、经营承压），Fluence
              在规模化阶段约按收入 2–2.5x 交易（$5.6B 订单积压）。相较技术成熟度相近的上市同行，私人 LDES 公司享有高额溢价。上市液流电池可比公司进一步支持谨慎判断：Invinity 报告 FY2025
              收入和赠款合计 £17.8 million，但仍亏损；Energy Vault FY2025 收入 $203.7 million、订单积压 $1.3 billion，却仍远低于私人独角兽倍数。CMBlu 的
              €1B+ 位于 ESS Tech 低迷公开估值和 Form Energy 资本充足扩张之间，与其阶段相符，但需要近乎无瑕疵执行才能证明合理。2025 年全球储能 VC 融资达到 $4.8B（YoY
              +30%），显示即便公开市场仍怀疑，投资者对该板块的兴趣仍在延续。
