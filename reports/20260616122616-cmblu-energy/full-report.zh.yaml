      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              CMBlu 的多头论点建立在四个相互咬合的支柱上。第一，LDES 市场结构性扩张：全球板块预计从 2026 年约 $3.4B 增至 2030 年
              $10.43B（MarketsandMarkets），动力来自电网脱碳、AI 数据中心电力需求和长时储能强制要求。BloombergNEF 预计，到 2030 年全球储能装机将达到 137 GW / 442
              GWh，CAGR 为 21%。第二，CMBlu 的 SolidFlow 技术在架构上差异化：专利有机氧化还原液流与固态混合化学体系、FEOC-compliant 供应链、相同时长下约 $15M/GWh CAPEX
              对比锂离子的 $100M/GWh、90% DC-DC 往返效率、20 年设计寿命，以及超过 20,000 次循环稳定性。公司持有覆盖该架构的已授权专利。第三，与 Uniper 的有条件 5 GWh
              供应框架（2027 年起交付，有效至 2037 年）是公司史上最大商业承诺；若大规模验证成功，将提供可信的前瞻收入管线。第四，Salt River Project（Arizona 50 MWh Desert
              Blume）、Mercedes-Benz（Rastatt 20 MWh）和 WEC Energy 的概念验证部署，加上 Argonne 与 Idaho National Laboratory
              测试伙伴关系，在公用事业、工业和研究场景验证技术。

              反论点同样扎实。CMBlu 实际上仍处于收入前阶段，首批重大商业交付预计要到 2027 年。Uniper 合同明确有条件——Uniper 创新总监指出，性能和经济可行性仍需在大规模使用中确认。把当前 1
              GWh/year 产能扩至 2029 年 10+ GWh/year，对有机化学工艺而言是尚未证明的工业挑战。全球锂离子 BESS
              价格继续下行，压缩时长优势窗口。更广泛的液流电池板块商业命运参差不齐，多家公司未能从试点转向商业规模。CMBlu 在低于 $5M 收入时获得 €1B+ 估值；若 2027–2028 年交付不及预期，或
              Uniper 框架未被激活，下轮估值下调风险很高。
