  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              美国 Department of Energy 将长时储能（LDES）定义为：额定功率下可供电 10 小时或更久的储能系统。CMBlu 的 Organic SolidFlow 电池是一种电化学 LDES
              技术，把有机氧化还原液流化学与固态储能材料结合起来，专门面向 10 小时以上的多小时固定式应用。核心可服务市场包括所有 10+
              小时固定式电化学储能部署，服务电网运营商、公用事业公司、工业购电方和数据中心运营商，覆盖表前和表后配置。纳入支出包括公用事业级电网平衡（可再生能源
              firming、容量市场参与、频率调节）、工业备电和数据中心多小时基础设施。不纳入核心边界的是 4 小时以下锂离子系统（主导 BESS
              市场）、抽水蓄能、压缩空气储能、重力储能、热储能和家用住宅系统。现状替代方案包括短时锂离子搭配燃气调峰机组、备电柴油发电机，以及亚洲制造商的 vanadium redox flow
              batteries。在液流电池子赛道中，有机化学体系（CMBlu 所用）区别于 vanadium redox（约占收入份额 80%
              的主导子类型）：它避开关键矿物，采用不可燃水基电解质，并声称能量密度是传统液流电池的 5 至 10 倍。该市场定义为本章所有规模测算、买方和驱动因素分析划定边界。
