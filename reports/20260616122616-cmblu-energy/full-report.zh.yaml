              CMBlu 的所有性能主张——20,000 次循环、20 年寿命、$15M/GWh CAPEX、$0.05/kWh LCOS——均来自组件测试、建模和小规模试点。TRL 7/8
              有意义，但不等同于可融资的商业部署。CMBlu 美国总裁也承认，融资依赖尚未公开的现场数据。2027 年 Uniper 分批交付以及已完成的 Mercedes-Benz/SRP 安装，将首次真正压力测试这些主张。
