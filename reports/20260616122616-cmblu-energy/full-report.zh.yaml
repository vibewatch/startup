              CMBlu 声称 SolidFlow 制造资本开支约为 $15M/GWh，而锂离子约为 ~$100M/GWh。该主张是投资论证的核心支柱，但它是前瞻性成本目标，不是多 GWh 商业工厂验证过的成本。液流电池
              gigafactory 的行业基准尚未建立。若实际资本开支更接近传统电池 gigafactory 中观察到的 $80/kWh-pa 平均水平，扩至 10 GWh/year 的总成本将超过 €800M——明显高于
