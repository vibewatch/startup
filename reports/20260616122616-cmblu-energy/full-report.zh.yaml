  - id: FM001
    title: 市场规模视角：LDES TAM / 液流电池 SAM / 有机液流 SOM（2026）
    type: pyramid
    layout: standard
    summary: |
      TAM/SAM/SOM 金字塔展示 2026 年 LDES 全球市场（$3.4–6.2B）、液流电池子板块（$1.2–1.4B）、 欧洲 LDES（$1.07B）和有机液流电池可服务市场（约 $0.3–0.4B）。
    data:
      items:
        - label: TAM：全球 LDES 市场（2026）
          value: ~$3.4–6.2B
          description: >
            全球所有 LDES 技术的总可寻址市场（10+ 小时时长）。区间从 Fortune Business Insights（$3.4B， 保守口径）到 Global Market
            Insights（$6.25B，更宽口径，包含热储能 / 机械储能）。
        - label: SAM-Global：液流电池市场（2026）
          value: ~$1.2–1.4B
          description: |
            服务全球固定式电网和工业应用的所有液流电池化学体系（钒、锌溴、铁、有机）。VRFB 占约 80% 份额； 有机液流低于 5%。
        - label: SAM-Europe：欧洲 LDES 市场（2026）
          value: ~$1.07B
          description: |
            欧洲 LDES 市场；德国是最活跃的单一国家，2026 年 Q1 已安装 17.9 GW/27.2 GWh， 但到 2030 年需要 104 GWh（Fraunhofer ISE）。
        - label: SOM：有机液流电池可服务市场（2026）
          value: ~$0.3–0.4B
          description: |
            CMBlu 可服务的有机 / 非钒液流电池子板块；在更广义氧化还原液流市场中以约 15–16% CAGR 增长； 这是一个溢价利基，瞄准防火安全、无关键矿物的固定式部署。
    approximationNotes: |
      有机液流 SOM 以全球液流电池市场的非 VRFB 份额为代理估算（Verified Market Reports 的氧化还原液流约 $0.37B）；没有独立的有机专属收入数据公开可得。所有数值均为名义美元。
