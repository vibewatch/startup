            - 中 — PV Magazine + CMBlu；无独立性能报告
            - 低 — 试点协议；未披露商业供应合同
            - 最佳代理 — 运行时间最长的活跃部署；300 MWh 扩张目标
            - 集装箱试点；可扩展
        - label: SRP Desert Blume（US）
