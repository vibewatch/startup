          - type: callout
            title: ESS Inc 接近停摆是板块先例警告
            body: >-
              铁液流电池初创公司 ESS Inc 因融资缺口在 2025 年 6 月几乎关闭 Oregon 工厂，并在 SEC 10-K 中警告持续经营状态存在「重大疑虑」。ESS 曾融资超过 $300M，包括 DOE
              贷款担保，拥有 UL 认证产品和多个公用事业客户。CMBlu 在类似阶段的轨迹——商业收入前、依赖资本、走向首个大规模交付——遵循同一风险模式。LDES
              初创公司必须同时获得技术验证和持续融资；缺少任一项都可能致命。
