      - number: '4.3'
        title: 资本充足性与融资历史
        blocks:
          - type: paragraph
            body: >-
              CMBlu 已通过两笔主要融资披露募集约 $165 million 股权资金：2023 年 10 月 STRABAG SE 的 €100 million（$106.7M）战略股权投资，以及 2026 年 4 月
              30 日完成的 €50 million Series C 首关，参投方包括 Samsung Ventures 和 STRABAG 在内的所有既有投资者。Nordic9 报告披露总投资为
              $164.9M；Trending Topics 引用行业来源估计，至今总额约 €250M（包括 STRABAG 之前的早期投资），意味着还有未披露早期资本。公司在 Series C
              中发行可转换优先股，投后估值超过 €1 billion（按 2026 年 4 月汇率约 $1.17 billion），跨过 unicorn 门槛。截至 CEO Constantin Eis 2026 年 5 月对
              Handelsblatt 的表述，本轮仍未关闭，说明最终交割尚未宣布。


              Series C 资金用途是欧洲和美国的制造爬坡及早期商业部署。250 人团队、其中 150+ 科学家和工程师，意味着工资支出显著；按德国和美国深科技公司的典型人力成本，月度现金消耗可能在 €2–5M
              区间，意味着 €50M 首关资金可支撑约 18–30 个月 runway——但 CMBlu 未公开确认 burn rate 或 runway。公开信息中未发现债务额度、债券发行或项目融资义务；截至 2026 年
              4 月，公司完全依赖股权融资。


              美国政策激励可能提升资本效率。CMBlu 的 FEOC-safe 供应链和美国本土制造路线图，使其有机会获得 Section 45X Advanced Manufacturing Production
              Credit 以及国内含量 ITC 加计；美国生产一旦建立，二者合计可提供最高 40% 的有效投资税收抵免收益——目前计划在 2029 年。Mercom Capital 数据显示，储能行业 2025
              年风险投资达到 $4.8 billion、共 75 笔交易（同比增长 30%），为 CMBlu 后续 Series C 交割和最终下一轮融资提供了有利背景。
