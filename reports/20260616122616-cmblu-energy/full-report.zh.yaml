      - number: '1.4'
        title: 规模、KPI 与商业里程碑
        blocks:
          - type: paragraph
            body: >
              CMBlu 的运营规模显示，公司正从研发阶段转向早期商业制造。Alzenau 超级工厂于 2024 年投产，采用 ABB 机器人自动化，初始产能 1 GWh/年，公司称路径目标为 4
              GWh/年。希腊第二座工厂在建，目标 4 GWh/年，并计划 2027 年投产，部分资金来自 EU-backed 补助。美国第三座工厂位于 Petaluma, California，仍处规划阶段，目标 2029
              年投产。CMBlu 称，到 2029 年合计年产能目标超过 10 GWh。公司员工超过 250 人，其中 150 多名科学家和工程师，分布在 Alzenau 与 Obernburg（德国）、Athens（希腊）和
              Petaluma, California（美国）。

              关键商业里程碑包括：2023 年 7 月在奥地利与 Burgenland Energie 完成首个商业部署；与 Salt River Project 在 Florence, Arizona 的 Desert
              Blume 试点，规模 5 MW / 50 MWh，预计 2027 年 12 月投运，并由 EPRI 监测性能；与 WEC Energy Group 在 Milwaukee, Wisconsin 的 1–2
              MWh 试点；Mercedes-Benz Rastatt 生产基地的 20 MWh 部署；以及 2026 年 1 月与 Uniper Kraftwerke GmbH 签署有条件框架协议，到 2037 年供应 5
              GWh，首批交付自 2027 年开始。CMBlu 获得 The smarter E Award 2025 储能奖项。

              关键技术规格包括：公司声称往返效率约 75%，使用寿命最高 20 年，目标平准化储能成本最低 5 cents/kWh。收入未公开披露，也没有已发布 ARR 或客户数量。2026 年 1
              月框架协议签署时，Uniper 的 Director of Innovation 提醒称，「性能和经济可行性仍需在大规模部署中进一步验证」，说明商业验证仍在推进中。Desert Blume 投运日期已从 2025
              年 12 月推迟至 2027 年 12 月，执行时间线风险已经实质化。
