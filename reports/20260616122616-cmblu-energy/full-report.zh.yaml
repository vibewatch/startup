      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              CMBlu 的 Organic SolidFlow 独特之处在于把矿物独立性、10+ 小时时长、20 年设计寿命，以及公司声称的 $0.05/kWh LCOS
              结合起来；在等同时长下，这是所有竞争技术中最低的目标值，但尚未在 GWh 规模验证。Tesla Megapack 3 标价约 $170/kWh 硬件成本，完全安装成本 $350–$600/kWh，但在超过 6
              小时时长下结构性不经济。Vanadium flow 系统（Invinity、VRB）通常安装成本 $350–$500/kWh，使用寿命 15–25 年，但承受钒供应链波动。铁空气（Form
              Energy）目标规模化后容量成本低于 $20/kWh，但往返效率仅 40–50%，只适合低频放电的多日事件。GTM 方面，CMBlu
              通过直销触达公用事业和工业客户（Uniper、Mercedes-Benz、Salt River Project 试点），并建设德国 gigafactory，同时规划美国和希腊扩张。Fluence 和 Tesla
              依托大型项目开发商网络与成熟项目融资，具备 CMBlu 仍在建立的可融资性优势。钠离子电芯成本 $55–70/kWh，正越来越多地进入 6–8 小时区间，挤压短 LDES 与长 LDES 的重叠空间。
