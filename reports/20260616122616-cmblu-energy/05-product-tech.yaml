  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "long-term field performance validation"
      missingEvidence: >
        Multi-year (3–5 year) real-world cycling data from deployed systems showing actual
        capacity retention, round-trip efficiency, and degradation rates at MWh and above
        scale.
      whyItMatters: >
        CMBlu's 20,000-cycle and 20-year lifetime claims are not yet supported by
        independent long-term field data. Utility financiers (SRP) and offtakers (Uniper)
        have explicitly conditioned commitment on this data, making it the key bankability
        gating factor.
      diligencePath: >
        Request performance data reports from the Mercedes-Benz Rastatt and Desert Blume
        SRP installations after first full year of operation. Monitor Argonne/INL
        demonstration results (expected 2025–2026). Ask CMBlu for any cycle-life reports
        from the Uniper Staudinger SAT.
      relatedQuestionRefs: [QE019]

    - type: private-evidence-only
      severity: material
      topic: "certification documentation"
      missingEvidence: >
        Published IEC 62619, IEC 62933, UL 9540, and UL 1973 certificate numbers and
        issuing lab reports for the SolidFlow commercial product.
      whyItMatters: >
        Utility grid interconnection, project financing, and insurance typically require
        confirmed compliance with IEC/UL certification stacks. CMBlu describes ISO and IEC
        compliance but does not publish certificate numbers or test report summaries.
      diligencePath: >
        Request CMBlu's certification register and test lab names directly. Cross-check
        against UL Solutions and TÜV SÜD online certificate databases. If certificates
        are pending, confirm expected timeline and whether Uniper/SRP have executed
        provisional compliance agreements.
      relatedQuestionRefs: [QE020]

    - type: missing-source
      severity: material
      topic: "organic molecule stability at commercial scale"
      missingEvidence: >
        Peer-reviewed or independently validated data on CMBlu's specific proprietary
        organic compound degradation rates under commercial cycling conditions (>2,000
        cycles, commercial temperatures, varying states-of-charge).
      whyItMatters: >
        The shuttle effect and oxidative decomposition of organic molecules are known
        failure modes in the ORFB literature. Without CMBlu-specific stability data,
        it is not possible to independently assess whether the 20,000-cycle claim is
        achievable with the specific lignin-polymer chemistry in the deployed product.
      diligencePath: >
        Review CMBlu's internal cycling test reports if accessible under NDA. Monitor
        academic publications from Argonne/INL co-investigators. Search for any
        peer-reviewed publications co-authored by CMBlu scientists on electrolyte stability.

    - type: missing-source
      severity: minor
      topic: "developer and practitioner community engagement"
      missingEvidence: >
        Evidence of CMBlu's engagement with the broader electrochemical engineering
        and energy storage practitioner community (publications, conference presentations,
        open-source tooling, standards-body participation).
      whyItMatters: >
        CMBlu is a hardware manufacturer with no public software/API developer surface.
        Limited public engineering discourse reduces external scrutiny of technical claims
        and may slow identification of deployment issues.
      diligencePath: >
        Search IEEE Xplore and ECS Digital Library for publications by CMBlu authors.
        Check Energy Storage Summit and EES Europe conference proceedings. Request
        CMBlu's list of industry working group memberships.

