  - id: safety-compliance-risk
    title: "Safety, Compliance, and Technical Risk"
    body: >
      CMBlu's safety case rests on four properties of the organic aqueous electrolyte:
      non-flammability, non-explosiveness, absence of toxic fume generation, and the
      elimination of thermal runaway risk. These properties are inherent to the water-based
      chemistry and do not depend on active thermal management systems — a significant
      simplification versus lithium-ion BESS installations that require air conditioning
      and fire suppression infrastructure, reducing permitting complexity and improving
      economics in dense urban or industrial environments.


      TÜV SÜD conducted a Technical Due Diligence (TDD) in 2023 that confirmed TRL 7 for
      the overall system and TRL 8 for the electrochemical core, validating performance
      and reliability through extensive lab and field testing. The company reports ISO
      9001 (quality management), ISO 14001 (environmental management), and ISO 45001
      (occupational health and safety) certifications. For utility interconnection,
      SolidFlow systems must comply with IEC 62619 (stationary battery safety) and IEC
      62933 (ESS safety and installation) — CMBlu has not published specific
      IEC certificate numbers, creating a diligence gap for project financiers in
      regulated markets.


      Three technical risks stand out: (1) Organic molecule long-term stability — polysulfide
      shuttle effects, oxidative decomposition, and membrane fouling remain the primary
      degradation pathways for organic flow chemistries per academic literature; CMBlu's
      proprietary approach mitigates but does not eliminate these. (2) Efficiency gap — the
      gap between the 75% system-level spec and the 90% cell-level claim creates uncertainty
      in project-level economic models; Uniper itself stated that "performance and economic
      viability still need to be demonstrated at large-scale." (3) Scale-up uncertainty — SRP
      noted they want "a few years of performance data before committing," and CMBlu's US
      president acknowledged that financing is conditional on additional real-world data.
      Employee review platforms (Kununu, March 2026) also flag management communication
      transparency concerns. Independent multi-year field data from Argonne/INL demonstrations
      and the SRP Desert Blume project will be critical to closing these risks.
