callouts:
  - calloutType: strength
    title: "Organic Chemistry Eliminates Critical-Mineral Risk"
    body: >
      SolidFlow's feedstock — carbon-based organic compounds from lignin and bioplastics —
      contains no lithium, cobalt, nickel, or rare-earth metals. This makes it structurally
      immune to vanadium price volatility, Chinese supply-chain dependencies, and FEOC
      restrictions under the US Inflation Reduction Act, positioning CMBlu as one of very
      few long-duration storage technologies with a fully domesticatable supply chain.
    claimRefs:
      - CE013
      - CE032

  - calloutType: risk
    title: "Efficiency Gap Creates Economic Modeling Risk"
    body: >
      CMBlu's official product spec lists 75% AC-to-AC system efficiency, yet award
      submissions and early PR materials cite 90% DC-to-DC cell-level efficiency. A 15%
      gap is material to LCOS models. Uniper's conditional agreement and SRP's
      "wait-and-see" posture reflect this uncertainty. Buyers and financiers must demand
      independently measured AC system efficiency from deployed projects — not cell-level
      specifications — before committing to utility-scale procurement contracts.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE035
      - CE036

  - calloutType: risk
    title: "Scale-Up Proof Remains the Critical Gate"
    body: >
      All CMBlu's performance claims — 20,000 cycles, 20-year lifetime, $15M/GWh CAPEX,
      $0.05/kWh LCOS — derive from component testing, modeling, and small-scale pilots.
      TRL 7/8 is meaningful but not the same as bankable commercial deployment. CMBlu's
      own US president acknowledges that financing depends on field data not yet public.
      The 2027 Uniper tranches and the completed Mercedes-Benz/SRP installations will
      provide the first real stress test of these claims.
    claimRefs:
      - CE010
      - CE020
      - CE021
      - CE035
      - CE037

