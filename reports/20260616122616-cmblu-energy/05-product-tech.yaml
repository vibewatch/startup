  - id: use-cases
    title: "Market Applications and Use-Case Coverage"
    body: >
      SolidFlow batteries are optimized for the 8–24 hour storage range where lithium-ion
      becomes economically challenged. Three primary use-case verticals are being targeted
      in 2026: (1) Utility and grid-scale renewable integration — absorbing daytime solar
      surplus and dispatching through the overnight demand peak. SRP's Desert Blume pilot
      is exactly this model: store Arizona solar during peak generation hours, discharge
      through the evening and night air-conditioning load. (2) AI and hyperscale data center
      power resilience — providing 10+ hours of dispatchable backup that avoids the thermal
      runaway permitting risks of lithium-ion in dense campuses. The Uniper agreement
      (5 GWh) is large enough to power a 1 GW data center for five hours. (3) Commercial
      and industrial (C&I) decarbonization — Mercedes-Benz's Rastatt installation exemplifies
      industrial facilities pairing on-site renewables with behind-the-meter storage to
      enable around-the-clock green energy use.


      For the utility segment, SolidFlow's modularity is a key operational asset: the SRP
      pilot will use 80 independently switchable strings so that failure of a single module
      does not cascade to a full system outage. This design also creates economies of scale
      contrast to alternatives like pumped hydro, which scales linearly in cost. CMBlu's
      US president has stated that cost competitiveness versus lithium-ion begins at roughly
      5–6 hours of storage and improves at longer durations due to the marginal cost
      advantage of adding tank volume versus adding cell stack.
