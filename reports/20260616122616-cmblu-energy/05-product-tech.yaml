  - id: manufacturing-deployments
    title: "Manufacturing Infrastructure and Commercial Deployments"
    body: >
      CMBlu manufactures SolidFlow batteries at its Battery Production Center (BPC) in
      Alzenau, Germany, which has been operational since 2024 and currently produces at
      1 GWh per year of installed capacity. The facility is fully vertically integrated —
      covering materials development, electrochemical stack assembly, module integration,
      and system testing — all without the clean-room requirements that add cost and
      complexity to lithium-ion production. Company leadership has described the required
      manufacturing skill set as "automotive-type," meaning existing industrial labor pools
      can be trained for the process, enabling flexible site selection for future factories.


      CMBlu's three-site gigafactory roadmap targets more than 10 GWh of total annual
      capacity by 2029. The second facility, near Athens, Greece, is being co-funded by a
      €30 million grant from the Greek Ministry of Environment and Energy and will add up
      to 4 GWh when production begins in 2027. A third factory in Petaluma, California, is
      in the planning stage for a 2029 start, aimed at North American hyperscale and data
      center demand where CMBlu's non-flammable chemistry and FEOC-clean supply chain are
      competitive advantages under the Inflation Reduction Act.


      Commercial deployment milestones as of June 2026: (1) CMBlu and Uniper signed a
      conditional 5 GWh framework agreement in January 2026, following a successful Site
      Acceptance Test (SAT) at Uniper's Staudinger power plant — deliveries begin in 100 MWh
      tranches from 2027 through 2037. (2) Mercedes-Benz ordered an 11 MWh system for its
      Rastatt plant in March 2024, targeting H2 2025 commissioning. (3) Salt River Project
      (SRP) Desert Blume: 5 MW/50 MWh in Florence, Arizona, part of a Google-SRP clean
      energy research collaboration announced September 2025, originally targeting December
      2025 operation. (4) WEC Energy Group Valley Power Plant pilot (Milwaukee): 1–2 MWh,
      5–10 hour duration, with EPRI evaluation. (5) DOE OCED-funded Argonne National Laboratory
      and Idaho National Laboratory demonstration project for microgrid and EV-charging
      applications, selected September 2023.


      Manufacturing CAPEX is claimed at approximately $15 million per GWh versus roughly
      $100 million per GWh for lithium-ion — an 85% capital cost advantage that, if
      sustained at full commercial scale, would reshape the long-duration economics. Target
      LCOS is approximately $0.05/kWh.
