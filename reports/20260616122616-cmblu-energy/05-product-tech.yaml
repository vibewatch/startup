figures:
  - id: FE001
    title: "SolidFlow Product Architecture Stack"
    type: stack
    layout: standard
    summary: >
      Five-layer architecture of the Organic SolidFlow battery from electrochemical core
      through balance-of-plant to software, showing key components and their roles.
    data:
      layers:
        - label: "Active Material Layer"
          detail: "Solid organic polymer particles + aqueous organic electrolyte stored in anolyte and catholyte tanks. Provides energy capacity (kWh) independently of power."
        - label: "Electrochemical Stack Layer"
          detail: "Porous electrodes + selective ion-exchange membrane; site of redox reactions. Determines power output (kW/MW). Scales independently from tank volume."
        - label: "Flow & Thermal Management Layer"
          detail: "Pumps, flow meters, pressure sensors, heat exchangers, valves. Circulates electrolyte between tanks and stacks at ~1 atm. Contributes ~15% efficiency drag via parasitic loads."
        - label: "Power Electronics & BMS Layer"
          detail: "Inverters, DC/DC converters, integrated software-defined BMS. Controls charge/discharge cycles, state-of-health monitoring, predictive maintenance, grid integration."
        - label: "System Integration & Control Layer"
          detail: "SCADA interface, remote monitoring, site safety interlocks, grid interconnection. Modular string-level switching enables 80-string independent control (SRP Desert Blume model)."
    approximationNotes: >
      Layer descriptions synthesized from CMBlu product page, Utility Dive technical
      interview, and PV Magazine architecture description. Exact BMS software stack and
      SCADA protocols are proprietary and not publicly documented.
    claimRefs:
      - CE003
      - CE005
      - CE031
      - CE033
      - CE041

  - id: FE002
    title: "Customer Workflow: Grid Solar Arbitrage (Utility Use Case)"
    type: flow
    layout: standard
    summary: >
      End-to-end workflow showing how the SolidFlow battery enables a utility to shift
      excess daytime solar generation into the overnight demand peak.
    data:
      nodes:
        - id: solar
          label: "Solar Generation (daytime)"
          description: "Utility-scale PV generates excess power during midday hours beyond real-time demand."
        - id: charge
          label: "SolidFlow Charging Cycle"
          description: "Surplus electricity pumped into SolidFlow: electrolyte circulated through stacks; organic molecules oxidized/reduced; energy stored as chemical potential in tanks."
        - id: tanks
          label: "Active Material Storage Tanks"
          description: "Charged organic slurry held in anolyte and catholyte tanks; energy held until dispatch. Volume determines storage duration (kWh/MWh scale)."
        - id: discharge
          label: "SolidFlow Discharge Cycle"
          description: "On dispatch command, electrolyte pumped back through stacks; reverse redox reaction releases electrons; 75% of stored AC energy returned to grid."
        - id: grid
          label: "Grid Dispatch (evening/overnight)"
          description: "Discharged power delivered to grid during evening peak demand or overnight air-conditioning load (SRP Desert Blume model)."
        - id: bms
          label: "BMS & SCADA Control"
          description: "Software-defined BMS optimizes charge/discharge timing, manages cell-string health, and interfaces with utility SCADA for grid services."
      edges:
        - from: solar
          to: charge
          label: "Surplus AC power"
        - from: charge
          to: tanks
          label: "Charged slurry"
        - from: tanks
          to: discharge
          label: "Dispatch signal"
        - from: discharge
          to: grid
          label: "AC power to grid"
        - from: bms
          to: charge
          label: "Charge control"
        - from: bms
          to: discharge
          label: "Dispatch control"
