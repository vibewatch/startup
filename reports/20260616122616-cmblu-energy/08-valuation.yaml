  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: STRABAG liquidation preferences, anti-dilution provisions, and participating rights from the €100M strategic
      investment and any earlier rounds.
    whyItMatters: Undisclosed preferential terms could severely dilute new Series C investors in a down-round or moderate-exit
      scenario, making the effective entry price for common equity materially worse than the €1B+ headline valuation implies.
    diligencePath: Request full cap table and waterfall model from CMBlu management under NDA; independent legal review of
      the STRABAG investment agreement; cross-check against any STRABAG annual report disclosures referencing CMBlu.
    relatedQuestionRefs:
    - QV019
  - type: private-evidence-only
    severity: material
    topic: revenue-and-financials
    missingEvidence: Audited revenue, ARR, gross margin, burn rate, and cash runway for FY2024 and FY2025.
    whyItMatters: Cannot verify the actual valuation multiple, assess burn duration from Series C proceeds, or model the revenue
      ramp without confirmed financials. The estimated $1M revenue makes the >1,000x implied multiple extremely sensitive
      to actual results.
    diligencePath: Request management accounts or auditor letter from CMBlu CFO; cross-check against STRABAG annual report
      if CMBlu is a material consolidated entity within the STRABAG group.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: down-round-risk-signals
    missingEvidence: Secondary market transaction data, PitchBook or Preqin secondary marks, or any indication of investor
      sentiment on CMBlu equity valuations outside primary round press releases.
    whyItMatters: Down-round risk is a first-order concern at a >1,000x revenue multiple; the absence of secondary market
      data makes it impossible to assess whether the €1B+ post-money is a live market valuation or an insider-supported mark
      with no external price discovery.
    diligencePath: Query PitchBook, Preqin, and dedicated climate-tech secondary market brokers for any CMBlu secondary transaction
      history; solicit bid/ask levels from specialist secondaries funds with LDES exposure.
    relatedQuestionRefs:
    - QV032
  - type: private-evidence-only
    severity: material
    topic: uniper-contract-conditions-precedent
    missingEvidence: The specific technical acceptance thresholds, performance warranties, ordering schedule, and conditions
      precedent under the Uniper 5 GWh framework that must be satisfied before binding purchase orders are issued.
    whyItMatters: The Uniper deal is the primary commercial anchor for the bull thesis; if conditions are stringent or tied
      to performance milestones that are difficult to achieve at scale, the contract pipeline could evaporate before generating
      any revenue.
    diligencePath: Review full contract documents with CMBlu and Uniper legal teams under NDA; obtain written confirmation
      from Uniper on current conditions status, which milestones have been met, and next decision points.
    relatedQuestionRefs:
    - QV010
  - type: missing-source
    severity: low
    topic: private-ldes-comparable-valuations
    missingEvidence: Disclosed post-money valuations for other private LDES companies (Ambri, Noon Energy, Malta, EnerVault
      successors) to complete the comparable valuation set.
    whyItMatters: TV004 is limited to six comparables; most private-stage LDES companies do not disclose valuations, making
      the comparable set representative but not exhaustive. Additional private data points would improve the confidence of
      the stretched-valuation assessment.
    diligencePath: Query PitchBook, Preqin, or CTVC climate-tech databases for private LDES company valuations; engage specialist
      climate-tech VC advisors for unpublished comparable marks.
    relatedQuestionRefs:
