  title: Recommendation — Research-More at Stretched Valuation
  body: At €1B+ ($1.17B) post-money with approximately $1M in estimated current revenue, CMBlu Energy's valuation is priced
    for near-perfect execution through 2028. The LDES opportunity is structural and real, SolidFlow is credibly differentiated,
    and the Uniper agreement provides a visible commercial pathway. However, the evidence base does not yet support a buy
    recommendation. The investment decision should be deferred until cap-table transparency, audited financials, Uniper contract
    firmness, and manufacturing scale-up credibility are established through direct diligence.
  claimRefs:
  - CV001
  - CV046
  - CV021
  - CV047
  - CV052
- calloutType: risk
  title: Primary Risk — Pre-Revenue Unicorn Pricing
  body: 'The highest conviction risk is that CMBlu''s €1B+ valuation materially exceeds what current evidence supports. ESS
    Tech—a public iron-flow battery company at a comparable commercial stage—is valued at ~$23.5M in public markets. The absence
    of audited revenue, the conditional nature of Uniper, and opaque cap-table preferences collectively create a scenario
    where incoming Series C investors could face a 40–60% markdown in the bear case. The flow battery sector''s documented
    mixed commercialization record reinforces this concern: multiple companies have raised significant capital only to stall
    at industrial scale.'
  claimRefs:
  - CV034
  - CV046
  - CV043
  - CV047
- calloutType: strength
  title: Strategic Strength — FEOC Compliance and Institutional Validation
  body: CMBlu's FEOC-compliant supply chain is a durable structural advantage in the US market under current IRA enforcement.
    Samsung Ventures' participation as a new Series C investor alongside sustained STRABAG backing signals the technology
    has passed Tier 1 institutional due diligence. Argonne and Idaho National Laboratory testing partnerships, the smarter
    E Award 2025 for Energy Storage innovation, and DOE's LDES demonstration program support all reinforce technology credibility
    at a level rarely seen for a pre-commercial company, even if commercial revenue has yet to materialize.
  claimRefs:
  - CV017
  - CV002
  - CV004
  - CV019
  - CV018
  - CV045
