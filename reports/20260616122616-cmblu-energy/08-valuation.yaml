- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold / Event
  - Transmission to Thesis
  - Monitoring Indicator
  - Action Implication
  rows:
  - - Uniper framework not activated
    - No 100 MWh call-off issued by H1 2028
    - Eliminates primary 5 GWh revenue pipeline; signals technology validation failure at scale
    - Uniper press releases; CMBlu investor updates; site construction activity at Staudinger
    - Exit or write-down; thesis breaks at this trigger
  - - Manufacturing ramp misses targets
    - Capacity below 3 GWh/year by end 2028 (vs 10 GWh 2029 target)
    - Cannot fulfill Uniper or hyperscale order; unit economics remain unverified at GWh scale
    - CMBlu production announcements; job postings in Alzenau, US, and Greece; capex disclosures
    - Reduce position; demand updated scale-up plan with independent validation before further capital
  - - Competitor hyperscale pre-emption
    - Form Energy or vanadium player secures >500 MW hyperscale contract before CMBlu
    - Destroys CMBlu's data-center first-mover narrative; compresses achievable valuation multiple
    - Google, Microsoft, Amazon, Meta energy storage procurement announcements
    - Reassess competitive moat; pressure management to accelerate US go-to-market timeline
  - - Li-ion cost compression
    - Lithium-ion 2-hour BESS prices fall below $50/kWh installed by 2027
    - CMBlu's cost advantage for 5–10 hour duration narrows materially; addressable market shrinks
    - BNEF battery price trackers; Tesla Megapack pricing announcements; auction results
    - Seek evidence CMBlu can target 24-hour+ applications where Li-ion remains structurally uncompetitive
  - - Down-round or distressed funding
    - CMBlu raises new equity below €700M post-money or accepts bridge on punitive terms
    - Signals investor confidence failure; likely triggers anti-dilution from STRABAG preference stack
    - Any new funding announcement; secondary market signals via PitchBook or Preqin
    - Exit at loss; thesis structurally broken; preference overhang makes recovery for common equity unlikely
  notes: Triggers are analytical constructs based on publicly available evidence; actual contract conditions and liquidation
    preference ratchet details are not publicly disclosed.
