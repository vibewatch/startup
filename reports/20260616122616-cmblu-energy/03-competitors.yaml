  - id: moat-durability-risk
    title: Moat Durability and Competitive Risk Assessment
    body: >-
      CMBlu's durable competitive advantages rest on four pillars: (1) a patent portfolio covering
      lignin-derived and aminated organic polymer compounds and their redox flow application,
      granting international IP protection that raises replication barriers; (2) proprietary
      electrolyte formulation that cannot be substituted with commodity chemicals, creating
      recurring consumable lock-in over a 20-year system life; (3) long-term supply contracts
      (Uniper through 2037) that embed switching costs via site-specific infrastructure investment;
      and (4) a first-mover advantage in organic flow at commercial scale with no comparable
      organic competitor at gigawatt-hour production as of mid-2026. Principal moat risks are
      the bankability gap relative to lithium-ion (project finance lenders favor GW-scale
      deployment histories), the threat from Eos Energy and sodium-ion vendors whose costs
      are falling rapidly in the 8–12 hour overlap zone, Form Energy's massive Google contract
      signaling hyperscaler preference for iron-air at ultra-long duration, and the risk that
      CMBlu's unverified cost claims ($0.05/kWh LCOS, $15M/GWh CAPEX) do not hold at the
      first GWh-scale Uniper deployment (expected 2027). IP dilution risk from quinone-based
      Quino Energy warrants a freedom-to-operate analysis. Conditional contract clauses in the
      Uniper agreement represent a material near-term execution risk.
    claimRefs:
      - CP006
      - CP007
