  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cost-claims-unverified
      missingEvidence: Independent third-party audited LCOS and installed cost data from CMBlu's first commercial GWh-scale deployment under the Uniper supply agreement.
      whyItMatters: CMBlu's $0.05/kWh LCOS and $15M/GWh CAPEX claims are company-asserted; investors and off-takers need real-world operational data at scale before committing project finance at competitive cost of capital.
      diligencePath: Request access to Uniper pilot deployment cost and performance data when first unit is commissioned (expected 2027); commission independent techno-economic assessment against comparable VRFB and iron-flow projects.
      relatedQuestionRefs: [QP009, QP011]

    - type: private-evidence-only
      severity: material
      topic: bankability
      missingEvidence: Third-party bankability certification or lender technical acceptance from a major project-finance institution for CMBlu's Organic SolidFlow technology.
      whyItMatters: Without lender technical acceptance, large utility project finance for CMBlu projects carries a higher cost of capital, slowing growth relative to bankable alternatives such as Eos Energy (DOE-backed) and lithium-ion (established track record with lenders).
      diligencePath: Request insurance terms, lender technical assessments, performance guarantees, and any independent reliability testing from CMBlu's current commercial pipeline projects.
      relatedQuestionRefs: [QP027]

    - type: missing-source
      severity: minor
      topic: organic-flow-ip-landscape
      missingEvidence: Freedom-to-operate analysis comparing CMBlu's organic polymer electrolyte patent portfolio against Quino Energy's quinone-based electrolyte patents and other emerging organic flow IP.
      whyItMatters: IP overlap between CMBlu's lignin-derived chemistry and Quino's quinone-derived chemistry could constrain CMBlu's technology access or create cross-licensing dependencies.
      diligencePath: Commission FTO analysis by IP counsel covering quinone, lignin, and sulfonated organic electrolyte patent families; reference the RSC Advances 2025 review of organic flow electrolyte IP landscape.
