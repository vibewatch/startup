  - id: competitor-profiles
    title: Competitor Profiles
    body: >-
      Invinity Energy Systems is the most commercially active VRFB vendor in Europe, with 2025
      revenue of £17M and a pipeline of utility projects anchored by Europe's largest VRFB at
      Copwood, East Sussex (20.7 MWh), expected operational by late 2026. Its Endurium product
      targets a 66% cost reduction by late 2026, with 2027 and 2028 revenue projections of £49M
      and £234M respectively. Eos Energy is the fastest-scaling non-lithium LDES company by
      revenue: Q1 2026 revenue of $57M (+445% YoY), $644.6M order backlog, a $305.3M DOE loan
      guarantee, and $300–$400M FY2026 guidance. Form Energy's iron-air battery operates at
      100-hour duration; its 300 MW/30 GWh Google deal establishes the benchmark for hyperscaler
      long-duration storage. ESS Inc. secured an 8.5 GWh Alsym Energy supply agreement and
      acquired VoltStorage GmbH IP in early 2026. Quino Energy, CMBlu's nearest organic chemistry
      peer, is at Series A ($16M total) with pilot-scale assets and no commercial utility
      deployments as of mid-2026—approximately 3–5 years behind CMBlu in commercialization.
      VRB Energy raised $55M and CellCube received $19M from US DoD for military installations.
      Fluence guides for $3.2–$3.6B FY2026 revenue with a $5.3B backlog, but primarily competes
      in the 1–4 hour band where LFP excels. CATL Naxtra sodium-ion reached mass production at
      $55–70/kWh cell cost with 10,000-cycle life, posing a structural threat to the 6–8 hour
      overlap zone.
