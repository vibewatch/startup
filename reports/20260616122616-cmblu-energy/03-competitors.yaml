callouts:
  - calloutType: risk
    title: Bankability Gap Is the Primary Near-Term Competitive Risk
    body: >-
      CMBlu lacks the deployment history and third-party project-finance certifications that Li-ion
      incumbents (Fluence, Tesla) and even DOE-backed zinc-flow (Eos Energy) have secured. Until
      the Uniper 5 GWh project delivers commercial operating data (expected 2027), lenders will
      price CMBlu projects at higher cost of capital, creating a structural disadvantage in large
      utility project finance. This risk is acute because CMBlu's customer base (utilities, hyperscalers)
      relies on project finance as the standard procurement vehicle.
    claimRefs:
      - CP033
      - CP034
      - CP036

  - calloutType: strength
    title: Organic Chemistry Moat Is Defensible on Both IP and Supply-Chain Grounds
    body: >-
      CMBlu's patent portfolio on lignin-derived organic polymer electrolytes—combined with the
      absence of critical minerals—creates a dual moat: IP barriers on the chemistry side and
      geopolitical/FEOC-safety advantage on the supply-chain side. No comparable commercially
      active competitor deploys the same polymer chemistry at scale. Quino Energy uses a different
      organic chemistry (quinone-based) and is approximately 3–5 years behind CMBlu in commercial
      readiness, giving CMBlu a meaningful first-mover window in the organic flow segment.
    claimRefs:
      - CP007
      - CP008
      - CP029
      - CP035

  - calloutType: insight
    title: CMBlu's Competitive Window Opens Sharply Above 8 Hours Duration
    body: >-
      Li-ion LCOS escalates sharply above 6 hours of discharge because each additional hour requires
      proportionally more cells. CMBlu's decoupled energy and power architecture means LCOS at 10h+
      is structurally lower, independent of production scale. At 4 hours, CMBlu is uncompetitive; at
      10 hours, cost parity is plausible; at 20 hours, CMBlu claims a 3–5x LCOS advantage. The strategic
      question is whether this window is large and stable enough to sustain a standalone business before
      Form Energy (iron-air, 100h) and sodium-ion compress it from above and below.
    claimRefs:
      - CP002
      - CP004
      - CP025
      - CP031

