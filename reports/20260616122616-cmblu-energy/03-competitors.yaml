  - id: capability-pricing-gtm
    title: "Capability, Pricing, and GTM Comparison"
    body: >-
      CMBlu's Organic SolidFlow uniquely combines mineral independence, 10+ hour duration,
      a 20-year design life, and a claimed LCOS of $0.05/kWh—the lowest target of any competing
      technology at equivalent duration, though unverified at GWh scale. Tesla Megapack 3 lists
      at approximately $170/kWh hardware cost per unit with $350–$600/kWh fully installed, but
      is structurally uneconomic for durations exceeding 6 hours. Vanadium flow systems (Invinity,
      VRB) typically run $350–$500/kWh installed with 15–25 year service lives, but carry vanadium
      supply-chain volatility. Iron-air (Form Energy) targets sub-$20/kWh capacity cost at scale
      but operates at only 40–50% round-trip efficiency, limiting it to infrequent-discharge
      multi-day events. On GTM, CMBlu competes through direct utility and industrial sales (Uniper,
      Mercedes-Benz, Salt River Project pilot) and is building a German gigafactory with planned
      US and Greece expansions. Fluence and Tesla operate through large project-developer networks
      with established project finance, providing a bankability advantage CMBlu is still building.
      Sodium-ion at $55–70/kWh cell cost increasingly competes in the 6–8 hour zone, compressing
      the overlap between short LDES and long LDES.
