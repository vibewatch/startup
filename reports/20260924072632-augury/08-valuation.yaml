company:
  name: Augury
chapter:
  number: 8
  title: Valuation
  summary: Augury still looks like a real late-stage industrial software asset, but the valuation case is only as good as
    the assumptions behind its private revenue and ARR estimates. On the visible numbers, the company is expensive enough
    to require confidence in continued growth and strong retention.
sections:
- id: current-valuation
  title: Current valuation frame
  body: Public sources continue to anchor Augury at about $1 billion after the February 2025 round. The company also keeps
    pointing to strong customer ROI and expanding product scope, which helps explain why it can still be financed as a unicorn
    even without public-market scale. The question is less whether the business has value and more what multiple is justified
    for a still-private industrial AI vendor. Put differently, the market is paying for proof of durable plant-level adoption,
    not just for a good story, and the public evidence is only partially complete. That leaves the company in a familiar late-stage
    private-market zone where it is real, valuable, and still hard to price exactly.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: multiple-and-comps
  title: Public multiples and private comps
  body: The company profile implies a revenue multiple in the high single digits to low double digits depending on whether
    you use the $100 million, $155 million, or company-quoted revenue basis. That makes the valuation look plausible for a
    fast-growing industrial software vendor, but not obviously cheap. The refresh does not provide enough audited data to
    argue for a cheaper stance than fair, and the peer set remains too noisy to anchor a precise discount or premium. In other
    words, the range is useful for framing but not for precision. The right mental model is a valuation band, not a point
    estimate.
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV002
  figureRefs: []
- id: stance-and-scenario
  title: Stance and scenarios
  body: The base case is that Augury deserves a premium software multiple if growth stays strong and the process-health expansion
    holds. The bear case is that disclosure opacity, support burden, and customer concentration erode confidence in the revenue
    quality behind the multiple. That is why the valuation stance remains fair rather than attractive, with upside only if
    the company can convert product breadth into cleaner, repeatable economics. The public record still reads like a solid
    business priced at a solid multiple, and the decision mainly turns on conviction in durability.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  tableRefs:
  - TV003
  figureRefs: []
