company:
  name: Augury
chapter:
  number: 3
  title: Competitors
  summary: Augury sits in a crowded industrial AI / predictive maintenance market with specialist startups, adjacent edge
    platforms, and incumbent industrial software vendors. It still looks differentiated on machine-health depth and data scale,
    but the market is broad enough that defensibility depends on execution, integration, and service quality.
sections:
- id: direct-competitors
  title: Direct competitors and specialists
  body: 'The strongest direct competitors are other predictive-maintenance and asset-analytics vendors. Public competitor
    lists repeatedly surface Uptake, TRACTIAN, Infinite Uptime, I-Care, Uptime AI, Nanoprecise, Falkonry, CorrosionRADAR,
    Novity, SparkCognition, and MachineMetrics. These vendors vary by geography and product emphasis, but they all attack
    the same buyer budget: reduce unplanned downtime and improve equipment reliability. The crowded field matters because
    the buyer usually has several ways to solve the same reliability pain, and any one plant may evaluate several vendors
    before standardizing. That makes brand, services, and implementation quality especially important, and it keeps price
    pressure alive.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: adjacent-substitutes
  title: Adjacent substitutes and incumbents
  body: Not every alternative is a pure Augury clone. Incumbent industrial software suites, equipment OEMs, and edge / fleet-management
    platforms can absorb some of the same budget if they bundle analytics with existing plant systems. The market is therefore
    not only a startup race; it is also a packaging and distribution race against larger industrial software stacks. That
    makes the substitute set strategically important even when it does not look like a direct product comparison, because
    the buyer can solve the problem indirectly. In some deals, the substitute is really the customer's existing operating
    stack, which makes replacement inertia a real barrier.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP008
  tableRefs:
  - TP002
  figureRefs: []
- id: differentiation
  title: Differentiation and durability
  body: 'Augury''s best differentiation story is the combination of machine-health data scale, prescriptive diagnostics, process-health
    expansion, and service-heavy deployment help. That is credible, but the moat is not absolute: public comparison pages
    still note limited OT protocol coverage, deployment effort, and pricing opacity. The company''s edge therefore looks real
    but workmanlike rather than unassailable, and it will depend on how much plant workflow it can own. That is the core diligence
    question in a category where feature parity can arrive quickly. The more workflow the platform controls, the harder it
    is to swap, but the more support it must deliver. Execution quality is therefore part of the moat, and so is customer
    success.'
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP012
  tableRefs:
  - TP003
  figureRefs: []
