  name: Augury
chapter:
  number: 2
  title: Market Analysis
  summary: Augury sells into the overlap of machine health, asset performance management, condition-based monitoring, and
    industrial AI for manufacturing. The market is real and growing, but public sizing is fragmented enough that the refresh
    has to lean on multiple lenses rather than a single clean TAM.
sections:
- id: market-boundary
  title: Market boundary and buyer
  body: The relevant market is not generic AI; it is the manufacturing reliability stack where plants buy monitoring, diagnostics,
    and optimization to reduce downtime and improve throughput. Buyers are usually reliability, maintenance, operations, or
    plant leaders, sometimes with procurement and IT / OT gating the decision. That means the market is shaped as much by
    integration and trust as by raw software feature breadth, and by the ability to justify attention on the plant floor.
    In other words, budget ownership is technical, operational, and political at the same time. The buying committee usually
    wants proof that the system works on existing equipment, not just in greenfield demos. That pushes vendors to sell implementation
    confidence, not just software features.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-and-adoption
  title: Sizing lenses and adoption
  body: 'Public sizing is best understood as a set of imperfect lenses: an older McKinsey estimate for predictive factory
    maintenance, ABI Research category coverage for industrial and manufacturing markets, and Gartner''s 2026 market guide
    for APM software. None of these gives a single clean answer, but together they confirm that Augury sits inside a sizable,
    analyst-recognized industrial software segment with real budget ownership. The practical takeaway is that the category
    is big enough to matter, even if no single source nails the exact overlap. That makes the sizing exercise directional
    rather than precise, and the market boundary should be read as a working thesis rather than a fact table.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM002
  - TM003
  figureRefs: []
- id: drivers-and-constraints
  title: Growth drivers and constraints
  body: 'The growth case is straightforward: aging workforce, downtime pressure, sustainability goals, and the need to extract
    more output from existing assets. The constraint set is equally clear: brownfield integration, long sales cycles, trust
    in recommendations, and the possibility that incumbents or OEMs bundle enough functionality to blunt a pure-play pitch.
    The market should therefore grow, but not frictionlessly, and buyer confidence will remain a gating variable. If the vendor
    cannot reduce plant complexity, the category will still grow but adoption will lag the hype cycle. That creates a steady
    market, not a shortcut to rapid standardization, and it keeps services central to the sell.'
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  figureRefs: []
