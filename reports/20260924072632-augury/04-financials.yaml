chapter:
  number: 4
  title: Financials
  summary: Augury remains a heavily funded, late-stage private company with a $1 billion valuation and a long funding trail.
    The refresh still shows strong growth signals, but audited revenue, margin, and cash-flow disclosure remain sparse.
sections:
- id: funding-history
  title: Funding history and ownership
  body: Augury's financing trail runs from a 2014 seed round to a February 2025 Series F. Public sources agree on the $75
    million Series F and the $1 billion valuation, but the exact total raised varies slightly by source. The company's investor
    base mixes industrial strategics, software VCs, and climate / infrastructure investors, which suggests the capital stack
    is as strategic as it is financial. That matters because industrial AI buyers often read investor quality as a proxy for
    persistence, support depth, and follow-on capital access. The funding path also signals that the company has been able
    to keep interest from both strategic and financial backers for a long time.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  - TI003
  figureRefs: []
- id: revenue-and-scale
  title: Revenue, ARR, and growth signals
  body: 'The company and its third-party profiles cite strong top-line momentum: revenue reportedly increased five-fold since
    the 2021 round, a 2026 profile lists $155 million ARR, and the CEO said Augury expected to reach $100 million ARR in the
    coming year. These are not audited figures, but they are consistent with the company''s late-stage growth narrative and
    unicorn valuation. The practical underwriting question is whether the growth is broad-based plant adoption or a narrower
    set of large accounts compounding over time. If the latter is true, the number can still be large while the underlying
    revenue quality remains less diversified than it first appears.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI002
  figureRefs:
  - FI001
- id: disclosure-quality
  title: Disclosure quality and capital efficiency
  body: The main financial diligence issue is disclosure quality rather than direction of travel. Different public databases
    disagree on total raised by a few million dollars, and profit, margin, retention, and burn are not publicly audited. That
    leaves the company investable as a scaled industrial software story, but it still needs private-market style skepticism
    on unit economics and capital efficiency. Until the company publishes a tighter financial bridge, the best view is that
    revenue quality is plausible but only partially verifiable. That is a solvable problem, but it remains a real underwriting
    gap.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs: []
  figureRefs: []
