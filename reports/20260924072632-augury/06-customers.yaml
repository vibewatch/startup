company:
  name: Augury
chapter:
  number: 6
  title: Customers
  summary: Augury appears to have a real blue-chip manufacturing customer base, with repeated mentions of PepsiCo, Colgate-Palmolive,
    DuPont, Nestlé, ICL, Heineken Mexico, and others. The harder question is not whether the product is used, but how broad
    and durable the deployment footprint is relative to the company's claims.
sections:
- id: customer-footprint
  title: Named customers and breadth
  body: Across company press, customer case studies, and buyer-intent databases, Augury is repeatedly associated with large
    manufacturers in food, beverage, CPG, chemicals, and industrial equipment. The consistent pattern is not a single marquee
    logo but a portfolio of deployments across many plants, with the company stressing global reach and broad customer trust.
    That suggests the buyer motion is enterprise-led and account expansion matters as much as logo count. It also implies
    that the sales motion is likely multi-site and relationship-driven rather than purely transactional. In that setup, plant-level
    wins can expand into broader account coverage and become sticky operational programs. The customer base therefore looks
    broad, but not necessarily shallow.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  figureRefs: []
- id: customer-outcomes
  title: Operational outcomes and ROI claims
  body: 'The strongest customer evidence comes from case studies and press claims: less downtime, fewer failures, better yield,
    lower energy use, and quicker maintenance response. The numbers are mostly company-quoted or partner-quoted, but they
    do point to a product that is judged on financial impact rather than only on technical accuracy. In diligence terms, that
    means the commercial question is whether those outcomes recur consistently enough to drive renewals and expansion. If
    the ROI is real but too site-specific, the story remains useful but not yet fully scalable. The key question is whether
    the gains survive broader deployment and whether plant teams actually keep using the system. That is ultimately a retention
    question, not just a launch question.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: coverage-and-risk
  title: Coverage gaps and concentration risk
  body: The customer story is still partly anecdotal. Public sources do not fully disclose retention, concentration, or logo-by-logo
    churn, so the refresh can confirm usage breadth but not contract durability. That leaves room for upside if the install
    base keeps expanding, but it also keeps customer concentration and renewal quality as open diligence items. The most useful
    next proof would be named renewals, cohort retention, or expansion-by-site evidence, ideally from sources that are not
    company-authored. The public record is strong on logos and weaker on durability, which keeps underwriting cautious and
    makes renewal evidence disproportionately valuable.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU003
  figureRefs: []
