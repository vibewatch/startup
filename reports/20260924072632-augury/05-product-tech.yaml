company:
  name: Augury
chapter:
  number: 5
  title: Product Tech
  summary: Augury's product stack combines sensor-driven machine-health monitoring, process-health optimization, and a growing
    layer of AI agents and open knowledge conventions. The technical story is credible and increasingly platform-like, but
    it still depends on complex field deployment and cloud integration.
sections:
- id: platform-architecture
  title: Core platform architecture
  body: The core stack starts with sensors and machine telemetry, then pushes data into analytics systems that help diagnose
    failure modes, prioritize alerts, and recommend corrective action. Public material repeatedly references vibration, sound,
    temperature, magnetic fields, and machine readings as the input layer. The latest company messaging also stresses that
    Augury now packages machine health and process health into AI agents that can act across the plant workflow rather than
    just alert on anomalies. That makes the platform feel more like a decision layer than a single-purpose monitoring tool,
    and it helps explain why the company talks about workflow and knowledge capture. The architecture is therefore broader
    than a sensor bundle and narrower than a general industrial ERP layer.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: deployment-and-cloud
  title: Deployment model and cloud integration
  body: 'The company''s reference implementations show a hybrid deployment model: Google Cloud for data processing and AI
    training, Azure / AKS for some customer workloads, and production integrations that must work across brownfield manufacturing
    environments. That is a real advantage for reach, but it also means Augury has to earn trust on uptime, cost, and integration
    complexity at every customer site. In practice, the deployment model is as much about field reliability as it is about
    cloud architecture, because a weak rollout can erase the benefit of a strong model. The more plants it covers, the more
    operational discipline matters.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE002
  figureRefs: []
- id: open-standards-and-expansion
  title: Open standards and product expansion
  body: 'In 2026 Augury moved beyond pure monitoring into an open-source industrial profile for Google Cloud''s Open Knowledge
    Format. That matters because it turns the company from a device-and-model vendor into a potential context layer for manufacturing
    AI. The product surface is therefore broader than machine health: it now includes process optimization, role-based agents,
    and a vocabulary for human-verified plant knowledge. That expansion is strategically useful, but it also widens the implementation
    surface and the diligence burden. The upside is platform leverage; the downside is more places for execution to slip.
    This is the classic tradeoff when a point solution becomes a platform.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE003
  figureRefs: []
