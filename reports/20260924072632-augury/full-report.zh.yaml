      - number: '3.3'
        title: 差异化优势与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Augury 的差异化主要来自几项能力的组合：机器健康数据规模、处方式诊断、工艺健康拓展，以及重服务的部署支持。这套优势有说服力，但护城河并非绝对：公开对比页面仍指出，Augury 的 OT
              协议覆盖有限、部署费力，定价也不透明。它的优势真实但并非牢不可破，能否守住还要看平台能掌控多少工厂工作流。这是功能很快可能趋同的赛道里最重要的尽调问题：平台控制的工作流越多，客户越难替换，但公司也必须提供更多支持。执行质量和客户成功同样是护城河的一部分。
