  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台架构
        blocks:
          - type: paragraph
            body: >-
              这套系统从传感器和机器遥测开始，再把数据送入分析系统，用来诊断故障模式、排列告警优先级并推荐纠正措施。公开资料反复提到，输入包括振动、声音、温度、磁场和机器读数。Augury
              最新的公司表述还强调，机器健康与工艺健康已被整合进 AI
              Agent，可在工厂工作流中采取行动，而不只是发现异常后发出告警。平台因此更像决策层，而非单一监测工具；这也解释了公司为何强调工作流和知识沉淀。其架构比传感器套件更广，但仍窄于通用工业 ERP。
            claimRefs:
              - CE001
