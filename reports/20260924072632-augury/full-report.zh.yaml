  - id: FV001
    title: 估值区间
    type: flow
    summary: 说明 Augury 的估值为何合理但不便宜。
    data:
      nodes:
        - id: anchor
          label: 独角兽锚点
          description: 公开报道显示，2025 年融资后 Augury 的估值仍在 $1B 附近。
        - id: multiple
          label: 收入倍数区间
          description: 视测算基准不同，隐含收入倍数落在高个位数至低双位数区间。
        - id: opacity
          label: 披露不透明
          description: 公开资料中未提供经审计的收入、ARR 或利润率明细。
        - id: growth
          label: 增长与投资回报叙事
          description: 客户 ROI 说法与产品覆盖广度支撑其软件估值溢价。
        - id: stance
          label: 估值研判结论
          description: 业务扎实、具备价值，但称不上明显便宜。
        - id: downside
          label: 下行风险情景
          description: 服务支持负担、客户集中度或增速放缓都可能压低估值倍数。
      edges:
        - source: anchor
          target: multiple
        - source: multiple
          target: stance
        - source: opacity
          target: stance
        - source: growth
          target: stance
        - source: downside
          target: stance
    approximationNotes: 本图仅为研判框架展示，非具体点位估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV006
