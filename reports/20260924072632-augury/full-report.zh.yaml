            body: >-
              公司新闻、客户案例和买方意向数据库都显示，Augury
              的客户包括食品、饮料、CPG、化工和工业设备领域的大型制造商。它的客户证明不只来自一个知名品牌，而是覆盖多家工厂；公司也强调其全球触达和广泛的客户信任。这说明销售面向大型企业推进，既要拓展现有客户，也要增加新客户。销售很可能依赖多厂区部署和长期客户关系，而非一次性交易；单厂落地后，还可能扩展到集团更多工厂，成为日常运营项目。客户覆盖面看起来广，也不一定只是浅层铺开。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 运营成效与 ROI 论断
        blocks:
          - type: paragraph
            body: >-
              最有力的客户证据来自案例研究和媒体报道中的成效说法：停机和故障减少、良率提高、能耗下降、维护响应加快。数据大多来自公司或合作伙伴，但也说明客户看重的是财务成效，而不只是技术精度。尽调要看这些结果能否持续重现，并推动续约和扩张。即使
              ROI 真实，若过于依赖个别工厂，也还不能证明模式已具备规模化能力。关键是收益能否在更多工厂延续，以及现场团队是否持续使用产品——这最终关乎留存，而不只是首次上线。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU012
      - number: '6.3'
        title: 覆盖盲区与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户故事仍有一部分停留在个案。公开资料没有完整披露留存、客户集中度或逐个客户的流失情况，因此能确认使用范围，却无法判断合同能否长期维持。若装机基数继续扩大，仍有上行空间；但客户集中度和续约质量仍待核实。最有价值的后续证据包括具名续约、客户队列留存率或按厂区扩张的数据，最好由公司以外的来源佐证。公开记录在客户品牌覆盖上证据较强，对客户关系持久度的证明则弱得多；因此投资判断仍需谨慎，续约证据也格外重要。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: 附图与附表
        blocks:
          - type: callout
            title: 需求集中于高价值工厂
            body: 最可信的客户证据高度聚集于对运行时间极其敏感的大型工厂，此类场景下单一故障便会造成极高的经济损失或安全风险。
            calloutType: insight
            claimRefs:
              - CU001
              - CU005
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 部署交付、实施与产品风险
        blocks:
          - type: paragraph
            body: >-
              Augury
              面向存量工厂销售，那里集成复杂、连续运行要求高，变更管理也不容易。产品必须在真实工厂里跑得起来，而不只是演示时表现良好。让平台有价值的现场复杂度，也抬高了试点、推广和支持成本。运营风险不在于某个灾难性故障，而在于问题可能在不同工厂反复出现：每增加一道集成步骤，都可能拖慢采用、加重服务负担。支持质量一旦下滑，利润率影响就可能迅速累积。更常见的早期信号是扩张变慢，而非明显停机，因此容易被忽略。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 商业与财务风险
        blocks:
          - type: paragraph
            body: >-
              商业故事有吸引力，但披露仍不完整。公开资料显示公司在增长，同时也显示它仍是私营企业，收入和员工数依赖估算，商业模式的验证又集中在少数大型制造商。风险不在于业务完全行不通，而在于实际经济性可能比品牌形象暗示的更难规模化。披露不足，让投资者无法像评估成熟上市软件公司那样判断它，也留下利润率意外下滑的空间。若客户集中度高于客户名单所显示，或续约需要的服务投入多于公司所说，风险尤其突出。市场可能奖励其故事，也会因信息不透明而打折。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
      - number: '7.3'
        title: 外部与市场风险
        blocks:
          - type: paragraph
            body: >-
              制造业买方承受着人手短缺、供应链波动和资本开支审查压力，但这些因素也拉长预算周期、令采购委员会更加谨慎。Augury
              还要面对老牌工业软件套件，以及成本更低或更容易规模化部署的单点产品。品类确实在增长，替代风险也同样存在。如果买方从现有套件中就能获得 70% 的价值，Augury
              的定价能力会更难维持。竞争压力会体现在赢单率和续约谈判上，尤其当买方比较总拥有成本（TCO），而不只看单点准确度时。厂商必须持续证明差异化，才能守住位置。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 附图与附表
        blocks:
          - type: callout
            title: 真正风险在于服务交付层的规模化瓶颈
            body: Augury 的产品颇具说服力，但服务、技术支持及交付落地的层层摩擦若未得到严密管控，将严重压缩其经济效益。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR006
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值框架
        blocks:
          - type: paragraph
            body: >-
              2025 年 2 月融资后，公开资料仍将 Augury 的估值锚定在约 $1B。公司持续强调客户 ROI
              强劲、产品范围扩大；即使业务尚未达到上市公司规模，这也解释了它为何仍能以独角兽估值融资。问题不在于业务有没有价值，而在于一家未上市工业 AI
              公司应获得多高的估值倍数。市场买的是工厂持续采用产品的证据，不只是好故事；但公开证据尚不完整。因此，Augury 处在后期私募市场常见的位置：业务真实、有价值，却很难精确定价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
      - number: '8.2'
        title: 上市公司倍数与一级市场对标
        blocks:
          - type: paragraph
            body: >-
              按公开公司资料中的 $100M、$155M
              或公司自述收入口径计算，隐含收入倍数约在高个位数至低双位数之间。一家快速增长的工业软件公司拿到这样的估值，说得过去，但谈不上明显便宜。本次更新没有足够的审计数据支持低于“合理”的估值判断，同业数据也太杂，无法锚定明确的折价或溢价。这个区间适合用来判断大致位置，而非追求精确；应把估值看作一段区间，而不是一个点。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 投资态度与情景假设
        blocks:
          - type: paragraph
            body: >-
              基准情景是增长保持强劲，工艺健康业务拓展也能站稳脚跟；若如此，Augury
              值得获得软件公司的估值溢价。悲观情景则是披露不透明、支持负担沉重和客户集中度削弱了投资者对收入质量的信心。因此，估值判断仍是“合理”，而非“有吸引力”；只有产品范围扩大能转化为更清晰、可重复的经济效益，才有上行空间。公开资料勾勒出一家业务扎实、估值也不低的公司，最终判断取决于投资者对其长期经营韧性的信心。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 附图与附表
        blocks:
          - type: callout
            title: 估值公允，但谈不上便宜
            body: 增长和成效证据可以支撑当前定价，但公开披露缺口太大，暂不足以说 Augury 股票或私募轮次明显有吸引力。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV009
