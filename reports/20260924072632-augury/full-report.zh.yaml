  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采购方
        blocks:
          - type: paragraph
            body: >-
              Augury 面向的不是通用 AI 市场，而是制造业可靠性技术栈：工厂采购监测、诊断和优化工具，以减少停机、提高产出。买方通常是可靠性、维护、运营或厂区负责人，采购部门及 IT / OT
              有时也会参与决策。这个市场不只看软件功能，还看系统能否集成、能否赢得信任，以及能否证明车间现场的投入价值。预算归属因此同时涉及技术、运营和组织层面的考量。采购委员会通常要确认系统能否在现有设备上正常运行，而不只是看新建工厂的演示；供应商卖的不只是软件，也要让客户相信项目能顺利落地。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: figure
            figureRef: FM001
            claimRefs:
