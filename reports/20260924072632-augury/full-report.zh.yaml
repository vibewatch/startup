        - 对后期软件公司而言虽有溢价，但并非不合理
      - - 经审计公开数据
        - 暂无
        - 低
        - 无法建立可靠的同业对标组
      - - B2B 工业 AI 可比公司群
        - 参差不齐 / 不透明
        - 低
        - 可比数据极为匮乏
    notes: 因顶线收入基准未经审计，该倍数仅供粗略参考。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 估值研判表
    columns:
      - 情景
      - 成立前提
      - 参考研判立场
    rows:
      - - 乐观情景
        - 维持 5x 增长、客户留存强劲，并成功落地工艺健康方案
        - 具吸引力
      - - 基准情景
        - 增长维持强劲，但信息披露依然有限
        - 合理
      - - 悲观情景
        - 增速放缓，且客户集中度与支持服务负担显现
        - 偏高
    notes: 本表属定性研判，而非预测模型。
    enumerationScope:
      coverage: sample
      basis: Three-scenario private-market valuation framing for the refresh
    claimRefs:
