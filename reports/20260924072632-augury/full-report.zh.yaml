              - CM005
              - CM007
      - number: '2.2'
        title: 规模测算视角与采纳度
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据只能从几种不完美的视角拼起来：McKinsey 较早对预测性工厂维护的估算、ABI Research 对工业与制造业类别的覆盖，以及 Gartner 2026 年的 APM
              软件市场指南。它们没有给出一个明确答案，但合在一起说明，Augury
              所在的工业软件细分市场规模不小、得到分析师认可，而且买方预算明确。这个品类足够重要，即使没有哪个来源能精确界定业务重叠范围。市场规模因此只能作方向性判断，不能精确量化；市场边界也应视为待检验的工作假设，而非事实表。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
