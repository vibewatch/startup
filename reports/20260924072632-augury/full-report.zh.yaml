        title: 附图与附表
        blocks:
          - type: callout
            title: 规模测算依赖多重视角，而非单一数字
            body: 虽然没有单一公开数字覆盖 Augury 的全部业务范围，但相关市场仍有可信依据。
            calloutType: assumption
            claimRefs:
