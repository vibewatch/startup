              2026 年，Augury 从单纯监测延伸到为 Google Cloud 的 Open Knowledge Format 发布开源工业画像。这让公司有机会从设备与模型供应商，进一步成为制造业 AI
              的上下文层。产品如今也覆盖机器健康以外的领域，包括工艺优化、按角色提供的 Agent
