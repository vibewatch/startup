      - number: '2.3'
        title: 增长驱动因素与制约条件
        blocks:
          - type: paragraph
            body: >-
              劳动力老龄化、停机压力、可持续发展目标，以及从现有资产中提高产出的需求，都是增长动力。制约因素也很明确：存量工厂集成难、销售周期长、买方未必信任系统建议，老牌厂商或 OEM
              也可能靠捆绑功能削弱专业厂商的卖点。市场会增长，但不会一路顺畅；买方信心仍是关键门槛。若供应商不能降低工厂现场的复杂度，品类虽会继续增长，采纳却可能落后于炒作周期。市场会稳步发展，而非迅速标准化；服务也仍是销售不可或缺的一环。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
