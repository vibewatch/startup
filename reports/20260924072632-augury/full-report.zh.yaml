    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位、产品与业务布局
        blocks:
          - type: paragraph
            body: >-
              Augury 将自己定位为提升设备正常运行时间和生产效率的工业 AI 公司，产品涵盖机器健康监测、工艺健康优化，以及面向制造工厂、按角色设计的 AI
              Agent。公司称，系统结合传感器、分析能力和专家服务，帮助减少停机、提高良率并支持可持续发展。公开资料普遍显示，公司成立于 2011 年，总部位于纽约，研发和办公室则设在以色列。本次更新还显示，Augury
              正从设备传感器延伸到更完整的工厂运营场景与工作流；这关系到后续预算拓展、交叉销售、大客户扩张、伙伴合作深度和整体规模。
