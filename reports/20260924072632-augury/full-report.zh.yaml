        title: 部署模式与云端集成
        blocks:
          - type: paragraph
            body: >-
              公司的参考案例显示其采用混合部署：用 Google Cloud 处理数据并训练 AI，以 Azure / AKS 承载部分客户工作负载，同时还要把生产系统接入各类存量工厂。这种模式有助于拓展客户，但 Augury
              必须在每个现场证明系统运行稳定、成本可控且易于集成。部署成败不只取决于云架构，也取决于现场交付是否可靠；交付不佳足以抵消模型的价值。覆盖的工厂越多，运营管理就越要到位。
