        blocks:
          - type: paragraph
            body: >-
              Augury 的融资从 2014 年种子轮延续到 2025 年 2 月的 F 轮。公开资料对 $75M F 轮和 $1B 估值说法一致，但累计融资额因来源不同略有差异。投资方包括工业战略投资者、软件 VC 和气候
              / 基础设施基金，资本既有产业属性，也有财务属性。工业 AI 买方常把投资方质量视作公司能否长期经营、能获得多深支持以及能否继续融资的参考。融资历程也说明，公司多年持续获得产业方和财务投资者的关注。
