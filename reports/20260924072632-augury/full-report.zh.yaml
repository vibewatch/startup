  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争对手与垂直专精厂商
        blocks:
          - type: paragraph
            body: >-
              最直接的竞争来自其他预测性维护和资产分析厂商。公开竞品名单反复出现 Uptake、TRACTIAN、Infinite Uptime、I-Care、Uptime
              AI、Nanoprecise、Falkonry、CorrosionRADAR、Novity、SparkCognition 和
              MachineMetrics。各家覆盖的地区和产品重点不同，但争夺的是同一类预算：减少非计划停机、提高设备可靠性。买方有多种办法解决可靠性问题，单家工厂在选定标准方案前也可能评估多家供应商。竞争者越多，品牌、服务和实施质量越重要，价格压力也越难消退。
