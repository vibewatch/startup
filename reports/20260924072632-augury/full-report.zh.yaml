companyProfile:
  summary: >-
    Augury 是一家处于后期阶段的未上市工业 AI 公司，面向制造业客户提供机器健康、工艺健康监测和基于角色的工厂工作流。公开资料普遍将其归入制造业可靠性技术栈，而非通用
    AI；公司拥有众多蓝筹客户，总部位于纽约，研发和运营也延伸至以色列。
