        title: 管理团队、公司治理与资本结构
        blocks:
          - type: paragraph
            body: >-
              现任管理团队已不止最初的两位创始人，包括 CEO Elan Greenberg、执行董事长 Saar Yoskovitz、CRO Brian Germain、CFO Ori Franco 和 CPTO Anoop
              Mohan。融资仍是公司发展故事的重要一环：Augury 于 2025 年 2 月完成 $75M F 轮融资，估值维持在 $1B；8 轮累计融资接近 $369M。Lightrock、Baker
              Hughes、Insight Partners、Eclipse、Qumra Capital、Qualcomm Ventures、SE Ventures 和 Munich Re
              等战略投资者多次参与融资。这些投资方既为其工业业务背书，也为后期融资提供支持。
