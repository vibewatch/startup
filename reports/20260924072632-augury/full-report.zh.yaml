      - number: '3.2'
        title: 相邻替代方案与老牌厂商
        blocks:
          - type: paragraph
            body: >-
              替代方案不一定是 Augury 的直接复制品。老牌工业软件套件、设备 OEM
              和边缘或设备机群管理平台，都可能把分析功能并入现有工厂系统，分走同一笔预算。因此，这不只是初创企业之间的竞争，也是大型工业软件栈比拼产品打包与渠道分发。即便不是直接的产品对标，这些替代方案仍很重要，因为买方可以绕开专用产品解决问题。有些交易里，客户现有的运营系统本身就是替代方案，既有系统带来的惯性也会抬高更换门槛。
