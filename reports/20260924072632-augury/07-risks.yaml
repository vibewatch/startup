- id: TR003
  title: Market and competitive risk table
  columns:
  - Risk
  - Mechanism
  - Why now
  - Mitigation question
  rows:
  - - Incumbents
    - Large industrial software vendors can bundle similar functions
    - APM market is maturing
    - How strong is switching cost?
  - - Specialists
    - Predictive maintenance startups compete on narrower use cases
    - More VC capital in the category
    - What is Augury's moat?
  - - Buyer caution
    - Capex and maintenance budgets face scrutiny
    - Macro uncertainty persists
    - Does Augury deliver fast payback?
  - - Talent shortage
    - Manufacturers may still struggle to operate the system
    - Aging workforce / retirements
    - How much service is bundled?
  notes: These are market-structure risks rather than company-specific defects.
