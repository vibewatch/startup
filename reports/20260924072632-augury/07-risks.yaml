company:
  name: Augury
chapter:
  number: 7
  title: Risks
  summary: 'Augury''s biggest risks are not existential but operational: execution in brownfield plants, customer concentration
    opacity, opaque financials, and competitive pressure from adjacent predictive-maintenance vendors and incumbents. The
    company has enough proof to look real, but not enough disclosure to remove diligence friction.'
sections:
- id: operational-risks
  title: Deployment, implementation, and product risk
  body: Augury sells into brownfield manufacturing environments where integrations are messy, uptime expectations are high,
    and change management is hard. That means the product has to work in the plant, not just in a demo. The same complexity
    that makes the platform valuable also makes pilots, rollouts, and support expensive. The operational risk is therefore
    less about one catastrophic bug and more about repeated friction across many plants. Every extra integration step can
    slow adoption and increase service burden. If support quality slips, the margin impact can compound quickly. This is the
    kind of risk that shows up as slower expansion rather than a visible outage, which makes it easier to miss early.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  tableRefs:
  - TR001
  figureRefs: []
- id: commercial-and-financial-risks
  title: Commercial and financial risk
  body: The commercial story is strong but still imperfectly disclosed. Public sources point to growth, yet they also show
    a company that is still privately held, still using estimates for revenue and headcount, and still relying on a concentrated
    set of large manufacturers to validate the model. The risk is less that the company does not work and more that the economics
    are harder to scale than the branding suggests. Disclosure gaps keep this from underwriting like a mature public software
    name, and they leave too much room for margin surprises. That is especially true if customer concentration turns out to
    be higher than the logos imply, or if renewals require more service than the company admits. The market can still reward
    the story while penalizing the opacity.
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: external-and-market-risks
  title: External and market risk
  body: Manufacturing buyers are under pressure from staffing shortages, volatile supply chains, and capex scrutiny, but those
    same conditions make budget cycles long and buying committees cautious. Augury also has to defend against incumbent industrial
    software stacks and point solutions that can be cheaper or easier to standardize at scale. That means category growth
    is real, but so is substitution risk. If the buyer can get 70% of the value from an incumbent suite, pricing power gets
    harder. Competitive pressure therefore shows up both in win rates and in renewal negotiations, especially when buyers
    compare total cost of ownership rather than point accuracy. The result is a market where differentiation must stay visible
    year after year.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  tableRefs:
  - TR003
  figureRefs: []
