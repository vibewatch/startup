        title: Disclosure quality and capital efficiency
        blocks:
          - type: paragraph
            body: >-
              The main financial diligence issue is disclosure quality rather than direction of travel. Different public
              databases disagree on total raised by a few million dollars, and profit, margin, retention, and burn are
              not publicly audited. That leaves the company investable as a scaled industrial software story, but it
              still needs private-market style skepticism on unit economics and capital efficiency. Until the company
              publishes a tighter financial bridge, the best view is that revenue quality is plausible but only
              partially verifiable. That is a solvable problem, but it remains a real underwriting gap.
            claimRefs:
