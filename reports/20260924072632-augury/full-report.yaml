    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and footprint
        blocks:
          - type: paragraph
            body: >-
              Augury positions itself as industrial AI for uptime and productivity: machine-health monitoring,
              process-health optimization, and role-based AI agents for manufacturing plants. The company says its
              systems combine sensors, analytics, and expert services to reduce downtime, improve yield, and support
              sustainability. Public profiles converge on 2011 as the founding year, New York as the headquarters, and
              Israel-based R&D and offices as part of the operating footprint. The refresh also shows that the company
              is broadening from an equipment sensor story into a larger plant-context and workflow story, which matters
              for future budget expansion, cross-sell, account expansion, partner depth, scale, overall now.
