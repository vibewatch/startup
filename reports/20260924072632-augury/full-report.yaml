              The current executive stack is broader than the original founder pair and now includes Elan Greenberg as
              CEO, Saar Yoskovitz as executive chairman, Brian Germain as CRO, Ori Franco as CFO, and Anoop Mohan as
              CPTO. Funding remains a key part of the story: Augury closed a $75 million Series F in February 2025, kept
