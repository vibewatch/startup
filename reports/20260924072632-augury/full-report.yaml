  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core platform architecture
        blocks:
          - type: paragraph
            body: >-
              The core stack starts with sensors and machine telemetry, then pushes data into analytics systems that
              help diagnose failure modes, prioritize alerts, and recommend corrective action. Public material
              repeatedly references vibration, sound, temperature, magnetic fields, and machine readings as the input
              layer. The latest company messaging also stresses that Augury now packages machine health and process
              health into AI agents that can act across the plant workflow rather than just alert on anomalies. That
              makes the platform feel more like a decision layer than a single-purpose monitoring tool, and it helps
              explain why the company talks about workflow and knowledge capture. The architecture is therefore broader
              than a sensor bundle and narrower than a general industrial ERP layer.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
      - number: '5.2'
        title: Deployment model and cloud integration
        blocks:
          - type: paragraph
            body: >-
              The company's reference implementations show a hybrid deployment model: Google Cloud for data processing
              and AI training, Azure / AKS for some customer workloads, and production integrations that must work
              across brownfield manufacturing environments. That is a real advantage for reach, but it also means Augury
              has to earn trust on uptime, cost, and integration complexity at every customer site. In practice, the
              deployment model is as much about field reliability as it is about cloud architecture, because a weak
              rollout can erase the benefit of a strong model. The more plants it covers, the more operational
              discipline matters.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
      - number: '5.3'
        title: Open standards and product expansion
        blocks:
          - type: paragraph
            body: >-
              In 2026 Augury moved beyond pure monitoring into an open-source industrial profile for Google Cloud's Open
              Knowledge Format. That matters because it turns the company from a device-and-model vendor into a
              potential context layer for manufacturing AI. The product surface is therefore broader than machine
              health: it now includes process optimization, role-based agents, and a vocabulary for human-verified plant
              knowledge. That expansion is strategically useful, but it also widens the implementation surface and the
              diligence burden. The upside is platform leverage; the downside is more places for execution to slip. This
              is the classic tradeoff when a point solution becomes a platform.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Data moat plus workflow moat
            body: >-
              The company's strongest product argument is not just model quality; it is the combination of proprietary
              machine data, plant context, and a workflow layer that can move from alerting to action.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Named customers and breadth
        blocks:
          - type: paragraph
            body: >-
              Across company press, customer case studies, and buyer-intent databases, Augury is repeatedly associated
              with large manufacturers in food, beverage, CPG, chemicals, and industrial equipment. The consistent
              pattern is not a single marquee logo but a portfolio of deployments across many plants, with the company
              stressing global reach and broad customer trust. That suggests the buyer motion is enterprise-led and
              account expansion matters as much as logo count. It also implies that the sales motion is likely
              multi-site and relationship-driven rather than purely transactional. In that setup, plant-level wins can
              expand into broader account coverage and become sticky operational programs. The customer base therefore
              looks broad, but not necessarily shallow.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Operational outcomes and ROI claims
        blocks:
          - type: paragraph
            body: >-
              The strongest customer evidence comes from case studies and press claims: less downtime, fewer failures,
              better yield, lower energy use, and quicker maintenance response. The numbers are mostly company-quoted or
              partner-quoted, but they do point to a product that is judged on financial impact rather than only on
              technical accuracy. In diligence terms, that means the commercial question is whether those outcomes recur
              consistently enough to drive renewals and expansion. If the ROI is real but too site-specific, the story
              remains useful but not yet fully scalable. The key question is whether the gains survive broader
              deployment and whether plant teams actually keep using the system. That is ultimately a retention
              question, not just a launch question.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU012
      - number: '6.3'
        title: Coverage gaps and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The customer story is still partly anecdotal. Public sources do not fully disclose retention,
              concentration, or logo-by-logo churn, so the refresh can confirm usage breadth but not contract
              durability. That leaves room for upside if the install base keeps expanding, but it also keeps customer
              concentration and renewal quality as open diligence items. The most useful next proof would be named
              renewals, cohort retention, or expansion-by-site evidence, ideally from sources that are not
              company-authored. The public record is strong on logos and weaker on durability, which keeps underwriting
              cautious and makes renewal evidence disproportionately valuable.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand is concentrated in high-value plants
            body: >-
              The most credible customer evidence clusters around large, uptime-sensitive plants where a single failure
              has outsized cost or safety implications.
            calloutType: insight
            claimRefs:
              - CU001
              - CU005
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Deployment, implementation, and product risk
        blocks:
          - type: paragraph
            body: >-
              Augury sells into brownfield manufacturing environments where integrations are messy, uptime expectations
              are high, and change management is hard. That means the product has to work in the plant, not just in a
              demo. The same complexity that makes the platform valuable also makes pilots, rollouts, and support
              expensive. The operational risk is therefore less about one catastrophic bug and more about repeated
              friction across many plants. Every extra integration step can slow adoption and increase service burden.
              If support quality slips, the margin impact can compound quickly. This is the kind of risk that shows up
              as slower expansion rather than a visible outage, which makes it easier to miss early.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Commercial and financial risk
        blocks:
          - type: paragraph
            body: >-
              The commercial story is strong but still imperfectly disclosed. Public sources point to growth, yet they
              also show a company that is still privately held, still using estimates for revenue and headcount, and
              still relying on a concentrated set of large manufacturers to validate the model. The risk is less that
              the company does not work and more that the economics are harder to scale than the branding suggests.
              Disclosure gaps keep this from underwriting like a mature public software name, and they leave too much
              room for margin surprises. That is especially true if customer concentration turns out to be higher than
              the logos imply, or if renewals require more service than the company admits. The market can still reward
              the story while penalizing the opacity.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
      - number: '7.3'
        title: External and market risk
        blocks:
          - type: paragraph
            body: >-
              Manufacturing buyers are under pressure from staffing shortages, volatile supply chains, and capex
              scrutiny, but those same conditions make budget cycles long and buying committees cautious. Augury also
              has to defend against incumbent industrial software stacks and point solutions that can be cheaper or
              easier to standardize at scale. That means category growth is real, but so is substitution risk. If the
              buyer can get 70% of the value from an incumbent suite, pricing power gets harder. Competitive pressure
              therefore shows up both in win rates and in renewal negotiations, especially when buyers compare total
              cost of ownership rather than point accuracy. The result is a market where differentiation must stay
              visible year after year.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The real risk is scaling the service layer
            body: >-
              Augury's product is credible, but every layer of service, support, and implementation friction can
              compress economics if it is not tightly managed.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation frame
        blocks:
          - type: paragraph
            body: >-
              Public sources continue to anchor Augury at about $1 billion after the February 2025 round. The company
              also keeps pointing to strong customer ROI and expanding product scope, which helps explain why it can
              still be financed as a unicorn even without public-market scale. The question is less whether the business
              has value and more what multiple is justified for a still-private industrial AI vendor. Put differently,
              the market is paying for proof of durable plant-level adoption, not just for a good story, and the public
              evidence is only partially complete. That leaves the company in a familiar late-stage private-market zone
              where it is real, valuable, and still hard to price exactly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
      - number: '8.2'
        title: Public multiples and private comps
        blocks:
          - type: paragraph
            body: >-
              The company profile implies a revenue multiple in the high single digits to low double digits depending on
              whether you use the $100 million, $155 million, or company-quoted revenue basis. That makes the valuation
              look plausible for a fast-growing industrial software vendor, but not obviously cheap. The refresh does
              not provide enough audited data to argue for a cheaper stance than fair, and the peer set remains too
              noisy to anchor a precise discount or premium. In other words, the range is useful for framing but not for
              precision. The right mental model is a valuation band, not a point estimate.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Stance and scenarios
        blocks:
          - type: paragraph
            body: >-
              The base case is that Augury deserves a premium software multiple if growth stays strong and the
              process-health expansion holds. The bear case is that disclosure opacity, support burden, and customer
              concentration erode confidence in the revenue quality behind the multiple. That is why the valuation
              stance remains fair rather than attractive, with upside only if the company can convert product breadth
              into cleaner, repeatable economics. The public record still reads like a solid business priced at a solid
              multiple, and the decision mainly turns on conviction in durability.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Fair, not cheap
            body: >-
              The price can be justified by growth and proof points, but the disclosure gap is too large to call the
              stock or private round obviously attractive.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV009
