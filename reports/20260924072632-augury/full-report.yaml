  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not generic AI; it is the manufacturing reliability stack where plants buy
              monitoring, diagnostics, and optimization to reduce downtime and improve throughput. Buyers are usually
              reliability, maintenance, operations, or plant leaders, sometimes with procurement and IT / OT gating the
              decision. That means the market is shaped as much by integration and trust as by raw software feature
              breadth, and by the ability to justify attention on the plant floor. In other words, budget ownership is
              technical, operational, and political at the same time. The buying committee usually wants proof that the
              system works on existing equipment, not just in greenfield demos. That pushes vendors to sell
              implementation confidence, not just software features.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM007
      - number: '2.2'
        title: Sizing lenses and adoption
        blocks:
          - type: paragraph
            body: >-
              Public sizing is best understood as a set of imperfect lenses: an older McKinsey estimate for predictive
              factory maintenance, ABI Research category coverage for industrial and manufacturing markets, and
              Gartner's 2026 market guide for APM software. None of these gives a single clean answer, but together they
              confirm that Augury sits inside a sizable, analyst-recognized industrial software segment with real budget
              ownership. The practical takeaway is that the category is big enough to matter, even if no single source
              nails the exact overlap. That makes the sizing exercise directional rather than precise, and the market
              boundary should be read as a working thesis rather than a fact table.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.3'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The growth case is straightforward: aging workforce, downtime pressure, sustainability goals, and the need
              to extract more output from existing assets. The constraint set is equally clear: brownfield integration,
              long sales cycles, trust in recommendations, and the possibility that incumbents or OEMs bundle enough
              functionality to blunt a pure-play pitch. The market should therefore grow, but not frictionlessly, and
              buyer confidence will remain a gating variable. If the vendor cannot reduce plant complexity, the category
              will still grow but adoption will lag the hype cycle. That creates a steady market, not a shortcut to
              rapid standardization, and it keeps services central to the sell.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Sizing is lens-based, not single-number based
            body: The market is credible even though no single public number captures Augury's full scope.
            calloutType: assumption
            claimRefs:
              - CM005
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct competitors and specialists
        blocks:
          - type: paragraph
            body: >-
              The strongest direct competitors are other predictive-maintenance and asset-analytics vendors. Public
              competitor lists repeatedly surface Uptake, TRACTIAN, Infinite Uptime, I-Care, Uptime AI, Nanoprecise,
              Falkonry, CorrosionRADAR, Novity, SparkCognition, and MachineMetrics. These vendors vary by geography and
              product emphasis, but they all attack the same buyer budget: reduce unplanned downtime and improve
              equipment reliability. The crowded field matters because the buyer usually has several ways to solve the
              same reliability pain, and any one plant may evaluate several vendors before standardizing. That makes
              brand, services, and implementation quality especially important, and it keeps price pressure alive.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP009
      - number: '3.2'
        title: Adjacent substitutes and incumbents
        blocks:
          - type: paragraph
            body: >-
              Not every alternative is a pure Augury clone. Incumbent industrial software suites, equipment OEMs, and
              edge / fleet-management platforms can absorb some of the same budget if they bundle analytics with
              existing plant systems. The market is therefore not only a startup race; it is also a packaging and
              distribution race against larger industrial software stacks. That makes the substitute set strategically
              important even when it does not look like a direct product comparison, because the buyer can solve the
              problem indirectly. In some deals, the substitute is really the customer's existing operating stack, which
              makes replacement inertia a real barrier.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Differentiation and durability
        blocks:
          - type: paragraph
            body: >-
              Augury's best differentiation story is the combination of machine-health data scale, prescriptive
              diagnostics, process-health expansion, and service-heavy deployment help. That is credible, but the moat
              is not absolute: public comparison pages still note limited OT protocol coverage, deployment effort, and
              pricing opacity. The company's edge therefore looks real but workmanlike rather than unassailable, and it
              will depend on how much plant workflow it can own. That is the core diligence question in a category where
              feature parity can arrive quickly. The more workflow the platform controls, the harder it is to swap, but
              the more support it must deliver. Execution quality is therefore part of the moat, and so is customer
              success.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is real but not exclusive
            body: >-
              Augury looks differentiated on machine-health depth and industrial trust, but several competitors can
              compete on parts of the same budget.
            calloutType: risk
            claimRefs:
              - CP001
              - CP009
              - CP012
  - number: 4
