              source. The company's investor base mixes industrial strategics, software VCs, and climate /
              infrastructure investors, which suggests the capital stack is as strategic as it is financial. That
              matters because industrial AI buyers often read investor quality as a proxy for persistence, support
              depth, and follow-on capital access. The funding path also signals that the company has been able to keep
