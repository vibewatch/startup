company:
  name: Augury
chapter:
  number: 1
  title: Company Overview
  summary: Augury is a late-stage private industrial AI vendor focused on machine health, process health, and production productivity
    for manufacturers. The company remains well funded and visibly expanding its product surface, but the refresh still has
    data quality gaps around current headcount and audited revenue.
sections:
- id: identity-and-positioning
  title: Identity, product, and footprint
  body: 'Augury positions itself as industrial AI for uptime and productivity: machine-health monitoring, process-health optimization,
    and role-based AI agents for manufacturing plants. The company says its systems combine sensors, analytics, and expert
    services to reduce downtime, improve yield, and support sustainability. Public profiles converge on 2011 as the founding
    year, New York as the headquarters, and Israel-based R&D and offices as part of the operating footprint. The refresh also
    shows that the company is broadening from an equipment sensor story into a larger plant-context and workflow story, which
    matters for future budget expansion, cross-sell, account expansion, partner depth, scale, overall now.'
  claimRefs:
  - CO001
  - CO002
  - CO004
  - CO008
  tableRefs:
  - TO001
  figureRefs: []
- id: leadership-and-capital
  title: Leadership, governance, and capital
  body: 'The current executive stack is broader than the original founder pair and now includes Elan Greenberg as CEO, Saar
    Yoskovitz as executive chairman, Brian Germain as CRO, Ori Franco as CFO, and Anoop Mohan as CPTO. Funding remains a key
    part of the story: Augury closed a $75 million Series F in February 2025, kept its $1 billion valuation, and reported
    a total raised figure near $369 million across eight rounds. Strategic investors such as Lightrock, Baker Hughes, Insight
    Partners, Eclipse, Qumra Capital, Qualcomm Ventures, SE Ventures, and Munich Re recur across the financing trail. That
    mix matters because it anchors both industrial credibility and late-stage financing support.'
  claimRefs:
  - CO003
  - CO005
  - CO006
  - CO007
  tableRefs:
  - TO002
  - TO003
  figureRefs: []
- id: milestones-and-open-questions
  title: Milestones and refresh gaps
  body: 'Since the prior refresh, the company has pushed beyond machine health into process health, launched an open industrial
    profile for Google Cloud''s Open Knowledge Format, and continued to frame its value proposition around trusted AI for
    brownfield manufacturing environments. The main refresh gap is scale precision: third-party sources disagree on current
    headcount, and revenue remains a mix of company quotes and third-party estimates rather than audited disclosure. That
    makes the company feel more mature operationally than financially transparent, even though the 2026 narrative is clearly
    more expansive than the old sensor-only framing.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs: []
  figureRefs:
  - FO001
