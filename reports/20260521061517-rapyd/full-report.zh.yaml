      - number: '1.3'
        title: 融资、估值、监管与里程碑
        blocks:
          - type: paragraph
            body: >
              当前最有支撑的资本锚点，是 2025 年 3 月用于完成 PayU 交易的融资：Calcalist 报道 Rapyd 以约 $4.5B 估值融资 $500M，大部分为股权，另有较小债务部分。独立来源还列出
              General Catalyst、Vista Credit Partners、TAL Ventures、Coatue、Oak HC/FT、Target Global、Tiger Global、SoftBank 和
              Durable Capital 等主要支持者，但具体持股比例和控制权没有公开。更大的估值叙事比单纯增长故事复杂得多。2021–2022 年金融科技热潮中，Rapyd 曾被描述为达到更高的私募峰值估值；但
              TechCrunch 和 Globes 后来都报道，公司洽谈再融资 $300M、估值 $3.5B，意味着即便 PayU
              交割后也经历了大幅重置。监管仍是公司最强的资产之一。官方合规页面指向冰岛、英国、新加坡和美国运营结构，以色列进展则从 2025 年支付机构牌照推进到 2026 年 4
              月直接接入该国银行卡支付轨道。合在一起，里程碑记录显示：私募市场定价变得更苛刻时，Rapyd 仍在加深牌照栈和地理覆盖。
