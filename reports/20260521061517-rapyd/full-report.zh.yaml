  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与渠道架构
        blocks:
          - type: paragraph
            body: >-
              Rapyd 公开呈现的客户图谱，不只是简单的商户收单名单。公司把自己面向「every business」定位，但可验证的客户证据更具体：可见需求中，很大一部分来自渠道中介——推荐伙伴、顾问、ISO、PayFac
              和编排平台；这些中介再把自己的商户接入 Rapyd 轨道。因此，买方、用户和付款方的角色，比官网文案看起来更分层。很多场景里，经济买方是支付中介或平台，实际操作用户是商户运营、风控或产品团队，最终付款方则是通过
              Rapyd 的收款、付款或账户栈转移资金的商户或终端客户。


              垂直行业分布也很关键。当前推荐伙伴和案例研究集中在机会大或摩擦高的细分市场：iGaming、在线交易、创作者经济、旅行、酒店餐饮、BNPL、交通和工资类付款。这一分布与 Rapyd
              的产品形态和监管姿态一致：商户需要更快入驻、更多支付方式覆盖，或需要跨多个司法辖区运营时，平台更容易赢。反向角度在于，同一模式也意味着更高的采购摩擦和更强的渠道依赖。最有力的公开证据中，很多来自商户服务伙伴，而不是终端商户本身；因此，公开记录证明了真实市场牵引力，但仍不能充分说明装机客户中有多少是直接、活跃且耐久的客户。
