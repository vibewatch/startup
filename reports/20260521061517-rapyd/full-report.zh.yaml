      - number: '8.2'
        title: 可比框架：足以给 Rapyd 划区间，不足以假装精确
        blocks:
          - type: paragraph
            body: >-
              可比公司组只有在克制使用时才有信息量。Rapyd 位于两类公司之间：一类是 Payoneer 这类公开跨境或 SMB 赋能公司，另一类是 Adyen
              这类溢价更高的基础设施公司；Airwallex、Checkout.com 和 Stripe 等私有成长同业，则展示了私有投资者愿意为规模、产品广度和平台深度支付什么价格。这些参照很重要，因为它们说明 Rapyd
              并不是在真空中运营：优质支付基础设施可以拿到中到高个位数收入参照，而披露较少或信任度较低的公开公司，交易水平可以更接近一到两倍收入。


              但每个可比公司都有实质局限。Adyen 更干净，更偏企业客户，也透明得多。Wise 更聚焦，盈利能力强得多。Payoneer 更公开、倍数更低，但也更偏 SMB 和付款。Airwallex
              是披露规模上最接近的私有现代商业金融类比，但它的运行率披露仍不同于经审计收入。Checkout.com 主要作为重估可比参照有用，说明私有支付龙头可以被大幅重标价，同时仍在增长并恢复盈利。Stripe
              是上限里程碑可比公司，但其披露收入不足以做严格倍数工作。


              因此，一个有纪律的结论是：可比公司可以圈出 Rapyd 的估值走廊，但不能给出投行级单点公允价值。正确做法是使用区间，并把假设说清楚。在这个基础上，Rapyd
              看起来比降轮标题本身暗示的更好，但并没有便宜到可以忽略缺失的资本结构细节。
