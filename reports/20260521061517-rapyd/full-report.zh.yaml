      时间线显示，Rapyd 从创立和基础设施搭建出发，经由并购驱动的规模扩张，进入监管覆盖继续扩大、但估值和 IPO 时间更不确定的阶段。
    data:
      items:
        - date: '2015'
          label: 创立
          detail: 外部报道称 Arik Shtilman、Arkady Karpman 和 Omer Priel 是创始人
          tone: positive
        - date: '2016'
          label: 基础设施转向
          detail: 公司历史称，Rapyd 目标是搭建全球钱包和支付集成层
          tone: positive
        - date: '2022'
          label: 收购 Valitor
          detail: 报道中的 $100M 收购，后来体现在英国实体历史中
          tone: positive
        - date: 2023-08
          label: 签约 PayU
          detail: Rapyd 同意收购 PayU 的全球支付组织资产
          tone: positive
        - date: 2025-02
          label: 低价轮谈判被报道
          detail: TechCrunch 和 Globes 报道称，Rapyd 可能以约 $3.5B 估值融资 $300M
          tone: negative
        - date: 2025-03
          label: $500M 融资与 PayU 交割
          detail: 融资以约 $4.5B 估值完成，用于交割 $610M 的 PayU 交易
          tone: positive
        - date: 2025-03
          label: 规模重置
          detail: 独立报道援引交割后覆盖 100+ 个国家、1,200+ 种支付方式和 41 张许可
          tone: positive
        - date: 2025-07
          label: 以色列支付牌照
          detail: ISA 牌照允许转账、外汇、钱包和计息账户
