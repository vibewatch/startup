      - number: '7.2'
        title: 运营韧性和伙伴依赖会直接传导到商户信任
        blocks:
          - type: paragraph
            body: >-
              公开案例研究显示，Rapyd 不是脆弱的早期系统；但这些案例也显示，平台的运营负担异常高。Akamai 把 API 描述为关键任务，并且全天候处理数十亿美元。MySQL
              描述了早期环境在升级期间有明显停机，且数据库资源可见性有限。PerfectScale 描述了迁移期先资源超配、再做资源调优。Tidio
              描述了高量且技术复杂的商户询问，以及一个支持自动化项目，但大多数案例仍要交给人工。单独看，这些事实没有一项构成一票否决；合在一起，它们说明 Rapyd
              的风险在运营层面高度密集。同样的逻辑也适用于外部依赖。Rapyd 自己的材料称，公司在美国依赖伙伴银行，在其他地区依赖选定网络伙伴，在多个市场有直接收单关系，并且正在扩张由
              ISO、PayFac、推荐代理和软件供应商组成的伙伴渠道。网络健康时，这是优势，因为它扩大触达并降低客户摩擦；但这也是风险，因为覆盖范围、服务质量和商户组合，都受 Rapyd
              无法完全控制的交易对手影响。投资者应假设：运营事故、文档缺口、伙伴争议或低质量渠道，都可能很快转化为商户痛点、支持成本和声誉拖累。
