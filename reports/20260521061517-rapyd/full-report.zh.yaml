    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、平台与商业模式
        blocks:
          - type: paragraph
            body: >
              Rapyd 把自己定位成 AI
              原生金融科技基础设施提供商，而不是面向消费者的银行品牌。官方材料始终讲的是一个单一平台：收款、付款、发卡、提供多币种企业账户，并越来越多地支持稳定币结算。公司自己的叙事称，当前基础设施业务是在更早的移动支付阶段之后成形，2016
              年转向解决全球规模下本地支付集成碎片化的问题。独立报道把公司创立时间定在 2015 年，因此本章应把 2015 年作为外部创立锚点，把 2016 年作为管理层所述基础设施建设的起点。商业姿态明显是
              B2B/B2B2X：Rapyd 面向需要受监管支付通道的商户、平台、伙伴、ISO、PayFac
              和软件供应商，而不是直接建立零售银行关系。官方文档和合作伙伴材料也支撑其在美洲、欧洲、中东和亚太的广泛运营足迹；公司靠牌照和伙伴安排补上本地市场要求。
