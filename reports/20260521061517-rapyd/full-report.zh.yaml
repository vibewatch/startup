          detail: 公司关联的 Nilson 报道强调商户规模和 2027 年上市目标
          tone: neutral
        - date: '2026-04-26'
          label: BOI 支付轨道接入
          detail: RAPYD Israel Payments Ltd. 完成接入 SHVA 银行卡支付基础设施
