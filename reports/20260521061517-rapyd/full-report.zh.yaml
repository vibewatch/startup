  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >
              Rapyd 应作为全球支付基础设施来分析，而不是单一狭窄金融科技品类。其自有定位把收款、付款、多币种账户、发卡和嵌入式金融服务放在一个平台上，落在三组公开市场视角的交集：跨境支付、嵌入式金融和更广义 B2B
              支付流。这个交集重要，因为 TAM 标题数字对统计口径极其敏感。Mordor 的 B2B 支付数字是一个巨大的底层支出池，包含国内支付流，因此更说明支付量机会，而不是供应商收入。Allied 的跨境支付估计更接近
              Rapyd 使用场景，但仍包括在位银行电汇、代理行和卡网络，范围远宽于 Rapyd 直接收入池。Grand View 的嵌入式金融估计更接近软件和基础设施变现，但也包含借贷、保险等 Rapyd
              并不明显拥有的邻近领域。正确结论不是把这些数字相加，而是：Rapyd 运行在一个庞大且快速数字化的基础设施层；由于 take rate、TPV 和分部组合等关键输入未披露，精确的公开 SAM 和 SOM
              仍无法拆出。
