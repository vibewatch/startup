  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价姿态与实际变现内容
        blocks:
          - type: paragraph
            body: >
              公开证据支持 Rapyd 是多通道支付基础设施业务，而不是单一费率收单方。官方产品和文档界面展示 Rapyd Collect、Disburse、Wallet、Issuing、虚拟账户、稳定币结算以及欺诈 /
              合规工具。这意味着几条变现路径：商户受理费、付款和 FX
              费用、账户和钱包服务、发卡经济性以及伙伴产生的交易量。伙伴计划尤其关系到收入质量，因为它显示渠道经济性是模型的一部分，而不是纯获客线索的附属品。推荐伙伴赚佣金，ISV 可以从用户交易变现，ISO 或 PayFac
              则依赖 Rapyd 做结算、拒付和合规支持。

              更难的问题是实际价格。公开记录很薄。本次审阅的 Rapyd
              界面没有发布标准卡处理、FX、钱包或发卡费率表。措辞停留在竞争性定价、更低费用或一站式平台效率。法律和监管页面还称服务实体取决于服务和司法辖区，这意味着实际价格很可能随地理、监管路径和客户类型变化。结果是：模型商业面很宽，产品通道清晰可见，但哪些通道利润率最高、最经常性、最集中，公开能见度很差。
