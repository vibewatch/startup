  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 对象
      - 状态 / 模式
      - 已披露规模指标
      - 估值指标
      - 对 Rapyd 的参考意义
      - 主要限制
    enumerationScope:
      coverage: partial
      basis: >-
        The table covers the most decision-useful public and private payments references available from retained
        2025-2026 sources; it is not exhaustive and intentionally excludes legacy card processors and opaque
        database-only private comps.
    rows:
      - - Rapyd
        - 私有目标 / 多产品支付平台
        - PayU 后合并收入 >$1B；商户 250k；100+ 个国家
        - 名义估值对合并收入低于 4.5x；精确 EV / 收入缺乏支撑
        - 直接标的；说明当前私有估值买到的资产。
        - 债务金额、现金和干净 LTM 收入桥接未披露。
      - - Adyen
        - 上市企业支付基础设施
        - 2025 年收入 $3.10B
        - ~7.3x EV / 收入
        - 显示一个上市、高质量支付基础设施资产能维持的倍数。
        - 企业客户结构更干净，公开披露远强于 Rapyd。
      - - Wise
        - 上市跨境转账与账户平台
        - FY2025 收入 £1.2119B；报告 PBT £565M
        - ~8x 市值 / 收入，按粗略美元换算
        - 有助于判断跨境变现质量和公开市场纪律。
        - 产品范围更窄，披露成熟得多。
      - - Payoneer
        - 上市 SMB 与跨境支付平台
        - 2026 年收入指引 $1.10-1.14B
        - ~1.2-1.3x 远期 EV / 收入
        - 给出跨境平台的低倍数上市走廊。
        - 结构不同，SMB 暴露更高，且已嵌入公开市场审视。
      - - Airwallex
        - 私有现代企业金融与全球支付平台
        - 2025 年 10 月年化收入 >$1B
        - ~6.7-8.0x，上次估值 / 运行率收入
        - 按阶段和全球野心看，是最接近的私有现代金融平台参照。
        - 运行率收入不等于经审计收入，私有估值也可能大幅波动。
      - - Checkout.com
        - 私有企业支付平台
        - 2025 年净收入增长 >30%；收入未披露
        - 估值从 $40B 峰值重置到 $12B 内部估值；没有干净收入倍数
        - 最好的警示样本：披露不完整时，私有支付龙头也会被重估。
        - 缺少收入披露，无法做严格倍数分析。
      - - Stripe
        - 私有全球支付与金融基础设施龙头
        - 2025 年 TPV $1.9T；Revenue suite 运行率 $1B
        - $159B 要约估值，但不是干净的总收入倍数
        - 品类龙头和投资人风险偏好的上限里程碑可比。
        - 这里未披露公司总收入，所以比例不是同口径。
    notes: 指标刻意混用了 EV / 收入、市值 / 收入、上次估值 / 运行率等参照，因为这是最诚实的可用框架；假装它们完全相同，会夸大精度。
