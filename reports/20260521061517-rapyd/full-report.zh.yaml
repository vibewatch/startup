      - number: '7.3'
        title: 最难处理的反向角度，是真实估值重估后的财务不透明
        blocks:
          - type: paragraph
            body: >-
              Rapyd 的财务和执行风险重要，并不是因为公司体量小，而是因为市场定价已经明显重估后，公开披露仍被收购叙事塑形。2025 年 2 月的独立报道称，Rapyd 正在讨论一轮 $300 million 融资、估值
              $3.5 billion，远低于早前峰值；随后 3 月报道显示，公司完成一轮约 $4.5 billion 估值的 $500 million 融资，用于交割
              PayU。这并不致命；许多金融科技公司都会重估。问题在于，投资者仍缺少一座桥，无法知道自己现在到底在承销什么。公开收入和员工数都是 PayU 后合并指标。2025
              年融资中的债务部分得到承认，但没有量化。管理层关于盈利能力和 AI 效率的叙事在方向上可能成立，但最强说法仍依赖管理层或伙伴证词，而不是独立经审计的运营披露。Payoneer 和 Adyen
              等同业让这种不透明更显眼，因为它们会发布 Rapyd
              没有的、反复出现的投资者指标。因此，正确的破坏投资逻辑风险表述应该很具体：如果牌照或伙伴银行出现摇摆，如果整合或支持质量下滑，如果自动化削弱控制，或如果下一轮融资低于 2025
              年标记且没有更好披露，那么当前「暂时重估、整合带来上行」的叙事就应被视为破裂。在这些触发因素出现前，Rapyd 仍有可能成立，但并未完全去风险。
