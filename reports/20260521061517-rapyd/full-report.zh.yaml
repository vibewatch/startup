      - number: '2.3'
        title: 增长驱动、标准与信任要求
        blocks:
          - type: paragraph
            body: >
              多个结构性驱动支撑全球支付基础设施需求继续增长。企业用 API 化、实时、数据更丰富的通道，替代纸质、批处理和碎片化银行流程，跨境与 B2B 支付工作流加速数字化。Mordor
              明确把增长同实时支付、营运资本优化、虚拟卡和电子发票强制要求联系起来。Grand View 将嵌入式金融增长与智能手机和互联网渗透率相连，并指出嵌入式支付是 2023
              年最大的嵌入式金融细分。监管和标准机构即便不能立刻消除摩擦，也在强化方向。BIS 认为，协调一致的 ISO 20022 数据使用应让跨境支付更快、更便宜、更透明；FSB
              路线图则把速度、成本、可及性和透明度作为明确改革目标。Open Banking UK 和 FDX
              显示出互补的数据层趋势：经授权访问账户数据和发起支付趋于标准化，扩大了嵌入式金融工作流的表面积。与此同时，官方和同业营销清楚表明，信任仍是准入门槛。Airwallex、Thunes、Checkout.com 和
              Stripe 都强调牌照、受保护资金、合规、欺诈和本地化，因为买方仍把这些当作采购标准，而不是基础卫生项。
