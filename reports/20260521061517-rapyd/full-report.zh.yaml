  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 多司法辖区牌照是最结构性的风险类别
        blocks:
          - type: paragraph
            body: >-
              Rapyd 最强的公开风险信号，不是某一起诉讼或事故，而是经营边界本身的形态。公司称，服务提供方式随产品和司法辖区变化：美国依赖伙伴银行，欧洲和英国通过 EMI
              实体承接，以色列在新支付牌照下开放，其他市场则通过选定网络伙伴触达。这套架构商业上很强，但也意味着执行质量取决于多张牌照、条款和本地交易对手能否保持一致。监管风险因此是累积的：牌照条件、客户资金保护、AML、消费者保护和支付基础设施连接必须同时成立。PayU
              交割强化了这一点，因为交易需要七家监管机构批准，交割后的整合仍意味着本地整改工作。反向角度在于，英语可访问来源中的直接一手验证仍不完美：保留的 ISA 英文页面被访问拦截，保留的 FCA
              抓取结果拿到的是搜索门户，而不是具名 CashDash
              实体记录。这不代表牌照无效；它意味着证明负担仍有一部分落在公司披露和投资者尽调上。因此，监控重点应放在实体地图、监管往来、客户资金保护控制，以及任何特定国家的上线或整改延迟上，而不是泛泛的「全球金融科技」叙事。
