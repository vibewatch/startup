      - number: '6.4'
        title: 扩张、集中度与同业透明度
        blocks:
          - type: paragraph
            body: >-
              Rapyd 最可见的扩张循环，从覆盖范围和入驻开始，再通过相邻产品和市场复利。伙伴或平台可以先用收单，再添加付款或多币种账户，随后扩展到资金管理、卡或新地域。具名证据反复展示这一模式：Gotrade
              增加本地存取款，Kadmos 扩大付款国家和方式，Paybyrd 改善多市场商户对账，PayFacto UK 用收单广度拿下酒店餐饮账户，Spreedly 在不要求客户替换所有既有 PSP
              的情况下扩大商户覆盖。这是一套说得通的先落地再扩张动作。


              风险在于，公开透明度还没有跟上这个故事。已审阅来源没有量化头部客户占比、头部伙伴占比、垂直行业结构或伙伴来源收入占比。2025
              年估值大幅重估也给出反向提醒：外部并不能完全看清增长质量和渠道经济性。Wise、Thunes、Nium 等公开同业披露的客户或网络使用背景多于 Rapyd；Stripe、Payoneer 和 Checkout
              也用更清晰的公开基准描述运营工具和商业结果。Rapyd 的客户叙事仍有说服力，但从尽调角度看，验证广度和渠道动能更容易；验证集中度、续约质量，或存量客户中有多少真正守得住，则难得多。
