      - number: '6.3'
        title: 留存、支持与关系耐久性
        blocks:
          - type: paragraph
            body: >-
              关系耐久性这一项，是 Rapyd 公开证据明显变弱的地方。定性代理证据还算充足：Segpay 描述了一段五年关系，Alcaston 和 VP Solutions 把 Rapyd 定位为长期伙伴，PayAtlas
              强调可靠的长期解决方案，Paynt 则称切换后服务中断为零。Tidio 又给出另一类耐久性信号：Rapyd 的实时商户活动足够多，需要 AI 分流、Salesforce 工单自动化，以及 30
              天内数千次支持互动。合在一起，这些来源支撑一个判断：Rapyd 运营的是真实、持续的客户底盘，而不是宣传册业务。


              但本章最关键的投资承销提示是，这些都不能替代 NRR、GRR、流失、续约、合同期限或头部账户留存数据。Rapyd 在已审阅材料中没有披露这些指标。即便支持透明度也并不一致：ISO 和 PayFac
              页面承诺白手套或 24/7
              支持，但公开联系页面对部分渠道披露了更窄的服务时间。这不能证明服务有问题，却说明买方体验可能会随伙伴类型、支持队列和升级路径而显著不同。尽调层面，公开记录支持运营深度和轶事层面的粘性，但不能证明量化留存质量。
