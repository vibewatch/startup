      - number: '4.2'
        title: 销售动作、渠道经济性代理指标与收入质量判断
        blocks:
          - type: paragraph
            body: >
              Rapyd 可见的销售和渠道动作由伙伴协助，且偏企业客户。伙伴页面瞄准推荐代理、顾问、ISO、PayFac 和 ISV；案例研究显示伙伴用 Rapyd
              赢得高潜力或受监管商户。财务上这很重要，因为渠道驱动增长可以降低部分细分的直接销售负担，同时也引入佣金、收入分成、支持义务和结算复杂度。最佳公开效率代理不是传统 SaaS 指标，而是运营指标。Rapyd
              声称授权率最高可达 97%，一家伙伴报告商户入驻增加至 3 倍、安装速度快 65%，渠道案例反复强调一次集成、一次对账和简化多国运营。

              这些是积极信号，但不能替代 CAC、回本周期或 cohort 数据。PayU 之后超过 $1B 的收入锚点也不是干净的 Rapyd 独立口径，因为它发生在重大收购之后，并以合并基础呈现。商户数为公司声称的
              250,000+，但公开来源仍未显示产品组合、take rate、经常性占比、集中度，或原 Rapyd 与收购 PayU 流量之间的拆分。比如 Nium 的资源中心公开营销透明 FX 费率和覆盖 190+
              个国家的付款能力，提醒我们：一些付款聚焦型替代方案，比 Rapyd
              更容易从公开材料理解走廊经济性。因此收入质量结论更偏中等而非高：业务看起来多元且可能有黏性，但公开披露仍无法证明多少交易量能转化为持久、高利润率、可重复收入。
