      - number: '2.4'
        title: 采用约束、负面视角与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >
              负面视角不是市场小，而是最亮眼的自上而下数字，单独拿来最难直接纳入投资判断。支付基础设施供应商普遍营销「一个平台」故事，同业也挤满了类似的广覆盖主张，横跨支付、付款、钱包、账户、风险、税务、资金管理和嵌入式金融。这种趋同意味着市场增长不会自动转化为差异化定价权。监管也是双刃剑：标准议程承诺改善互操作性，但买方和供应商仍要处理碎片化本地牌照、合作银行、卡组织依赖、制裁和各国结账行为。公开同业披露凸显，即便已成规模的运营商也使用混合模式，依赖网络成员、本地轨道或受监管银行伙伴，而不是在每个市场都完全拥有端到端基础设施。买方一旦集成，确实会在开户、付款编排、欺诈、税务和对账上形成切换成本；但这些切换成本也会拖慢初始销售周期、抬高信任门槛。就
              Rapyd 而言，公开证据支持战略相关性和现有覆盖，但不能支持精确公开 SAM/SOM 或持久利润率判断。缺失项包括支付量、take rate、cohort 经济性、产品组合、集中度和走廊级伙伴敞口。
