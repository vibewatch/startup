        - $10.0-13.5B
        - 2.2-3.0x
      - - 基准
        - 50%
        - 收入约 $1.4-1.6B；协同兑现中等；披露仍不完整但在改善。
        - 按收入 3.5-4.5x，低于高溢价的上市优质标的，但高于信任度较低的上市跨境可比公司。
        - $5.0-7.0B
        - 1.1-1.6x
      - - 下行
        - 30%
        - 收入约 $0.9-1.1B；整合或监管摩擦拖慢进展；再融资或退出承压。
        - 按收入 1.5-2.5x，接近信任度较低的上市支付公司。
        - $1.4-2.8B
        - 0.3-0.6x
      - - 概率加权视角
        - 100%
        - 规模真实存在，但披露和资本结构不透明，让下行情景仍有分量。
        - 由上述情景推导出的加权中枢区间。
        - $5.2-6.6B
        - 1.2-1.5x
    notes: 所有情景都是明确的假设区间，不是预测。采用收入倍数框架，是因为公开证据不足以支撑精确 DCF 或 EV 桥接。
