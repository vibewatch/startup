      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              买方范围不止「线上商户」。Rapyd 的产品和文档页面暗示三类主要商业动作：企业把结账和结算扩展到新地区；平台、市场平台和软件公司把支付与资金流嵌入自己的产品；全球运营的 SMB 或出口商需要收款、FX
              和付款能力，却不想自建本地银行栈。同业定位强化了这种分层：Stripe Connect 直接卖给平台和市场平台，Wise Business 面向活跃跨境的 SMB，dLocal
              面向在新兴市场扩张的商户和平台，Thunes 或 Nium 面向网络密集型付款、汇款和资金管理场景。实际采购中，经济买方通常是支付、财务或 GM
              负责人；日常用户往往是产品、运营、工程或资金团队；付款方则是受益于市场扩张、更高转化或更快结算的
              P&L。采用也常分阶段，而不是一次性全量上线：公司先推出一条走廊、一种支付方式或一个付款用例；集成嵌入核心运营后，再加入账户、发卡、欺诈、税务或资金管理工作流。
