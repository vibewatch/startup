  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 维度
      - 正向论点
      - 反向论点
      - 改变判断的证据
    rows:
      - - 规模
        - Rapyd 已是实打实的全球支付资产：收入 >$1B、商户 250k，PayU 之后覆盖面很广。
        - 合并规模只知道门槛值，底层质量仍缺一条干净的公开桥接。
        - 经审计的合并报表和分部披露。
      - - 产品宽度
        - 收单、付款、账户、发卡和伙伴工作流，带来交叉销售空间，也让分发更黏。
        - 产品越宽，多个实体和支付轨道上的支持、合规、执行负担也越重。
        - 打包使用率与利润率同步改善的证据。
      - - 分发
        - 伙伴渠道和地理覆盖能加速增长，不必每条路径都自己搭。
        - 渠道越宽，越可能藏住集中度、质量差异或控制力更低的收入。
        - 渠道收入结构、分群留存和伙伴集中度数据。
      - - 经济性
        - 首次盈利信号说明，整合后模型可能更高效地放大。
        - 公开盈利证据仍不完整；合并成本基底完全摊开后，利润率未必守得住。
        - 经审计的合并利润率桥接表和协同计分卡。
      - - 估值语境
        - 名义价格低于若干高溢价同业参照，又高于信任度较低的上市可比公司，仍留有上行空间。
        - 当前估值看起来合理，可能只是因为 EV 桥接和优先权堆栈缺失。
        - 能证明普通股上行真实存在的股权结构表和债务披露。
      - - 退出路径
        - IPO 目标可信到足以影响判断，二级交易或战略退出也仍有可能。
        - 公开证据更多证明的是愿景，而非准备就绪；退出时间和倍数仍不确定。
        - 董事会层面的 IPO 准备材料和上市公司级内控证据。
    notes: 这张表把公司质量和投资论证质量拆开；两者都改善，买入判断才站得住。
