      - number: '1.4'
        title: 规模信号、负面进展与关键尽调缺口
        blocks:
          - type: paragraph
            body: >
              Rapyd 最强的规模信号是方向性的，而不是完整财务披露。PayU 交割后，合并收入被报道提升到 $1B 以上，员工约 1,600 人；公司自有材料后来声称全球商户超过
              250,000。技术和伙伴证据也与一个大型复杂平台方向一致：Akamai 描述公共 API 全天候处理数十亿美元资金，PerfectScale 指出其有 15+ 个 Kubernetes
              集群并投入大量云效率工作，Tidio 描述 AI 改善了大规模商户支持流程。客户案例也显示其覆盖券商、海事薪资、交通和高监管收单。负面一面同样重要。Globes 报道 2022 至 2024 年多轮裁员，并给出
              PayU 交割前基于 LinkedIn 的员工数快照，明显低于后来的合并口径；TechCrunch 和 Globes 都报道过可能以 $3.5B 估值进行降估值融资。IPO 时间也未定：管理层关联内容指向
              2027 年，但 2025 年 3 月的分析仍把 2026 年视为取决于市场情绪。尽调需要补齐的，是 2026 年独立口径精确员工数、当前 run-rate 或 EBITDA，以及真实的治理 /
              控制视图，而不只是职能高管姓名。
