      - number: '1.2'
        title: 创始人、领导层、治理与办公室足迹
        blocks:
          - type: paragraph
            body: >
              Rapyd 的公开领导层材料将 Arik Shtilman 列为 CEO、Arkady Karpman 列为 CTO、Omer Priel 列为以「VP Rapyd
              DNA」头衔继续任职的高管；独立报道也把三人都列为创始人。当前领导层页面还给出了一层正式管控架构：CFO、总法律顾问、首席风险官和 CISO。Rapyd
              运行的是受监管的跨境支付栈，牌照、欺诈和伙伴监督都是核心运营风险，这一层很重要。地理证据最清楚地指向伦敦总部，但运营足迹是分布式的：官方联系方式列出多个服务区域，Craft 指向伦敦总部和 13
              个办公室，Akamai 2024 年客户故事列出特拉维夫、迪拜、冰岛、香港、新加坡、迈阿密和旧金山等主要运营节点。英国足迹部分来自收购，Companies House 显示 RAPYD PAYMENTS
              LIMITED 是原 Valitor 实体。明显不透明的是治理披露：公开来源能识别高管，却没有给出完整董事会名单、控制权或当前股权结构；这对任何 IPO 前评估都是重要尽调缺口。
