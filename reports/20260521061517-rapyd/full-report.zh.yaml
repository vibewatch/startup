  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对投资建模的影响
      - 具体尽调路径
    rows:
      - - Rapyd 独立收入运行率
        - 无法把原 Rapyd 表现与 PayU 后合并规模拆开
        - 索取 FY2025-FY2026 月度管理账，并提供 PayU 交割前后桥接
      - - 内生与并购收入贡献
        - 无法判断增长来自并购、内生，还是两者都有
        - 索取整合桥接，拆出原 Rapyd 收入、PayU 并购收入和协同假设
      - - 按通道划分的产品组合和抽成率
        - 不知道收款、付款、账户、发卡组合，收入质量无法有把握地排序
        - 索取按产品划分的收入和 TPV，以及按支付方式和地区划分的净抽成率
      - - 毛利率 / 贡献利润率
        - 仅靠自动化案例，无法验证利润率路径
        - 索取按通道划分的毛利率，以及扣除风控、支持和云成本后的贡献利润率
      - - 现金余额 / 月度烧钱 / 现金跑道
        - 无法量化流动性风险和融资依赖
        - 索取当前现金余额、月度净烧钱，以及各受监管实体的最低流动性阈值
      - - 2025 年融资债务条款
        - 未知杠杆可能改变股权价值、契约约束和再融资风险
        - 索取贷款方名称、本金金额、期限、定价和契约包
      - - 客户集中度和留存
        - 缺少公开依据判断 NRR、GRR 或单一客户依赖
        - 索取前 10 大客户收入占比、队列留存和续约时间表
      - - 渠道经济负担
        - 合作伙伴拉动增长可能高效，也可能因佣金和支持负荷稀释利润率
        - 索取直销与合作伙伴渠道收入、佣金率和按渠道划分的支持成本
      - - 营运资本 / 客户保障资金经济性
        - 监管义务可能占用资本或增加合规成本，公开资料看不清
        - 索取按司法辖区划分的资金保障机制、准备金要求和结算浮存资金处理方式
      - - 获客成本（CAC）/ 回本周期 / 销售周期长度
        - 尽管合作伙伴和入驻案例很强，销售效率仍停留在印象层面
        - 索取按客群划分的 CAC、回本周期、实施成本和销售周期分布
