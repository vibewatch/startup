  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 因素
      - 方向
      - 时间
      - 重要性
      - 证据
      - 尽调追问
    rows:
      - - ISO 20022 协调
        - 驱动
        - 中期
        - 更丰富、更一致的支付数据可以提升透明度和自动化
        - BIS 称，协调使用 ISO 20022 应让跨境支付更快、更便宜、更透明
        - Rapyd 哪些走廊已经跑在协调后的 ISO 20022 流程上？
      - - G20 / FSB 跨境改革议程
        - 驱动
        - 中期
        - 政策压力让成本、速度、可及性和透明度持续进入高管议程
        - FSB 路线图瞄准跨境支付的关键摩擦
        - 哪些改革给 Rapyd 带来的实质收益高于既有玩家？
      - - 开放银行与开放金融标准
        - 驱动
        - 近期至中期
        - 标准化授权数据和支付发起能力，会扩展嵌入式金融工作流
        - Open Banking UK 和 FDX 都把银行、fintech 和技术提供商纳入协作式 API 生态
        - Rapyd 路线图中，有多少依赖数据访问标准，而不是支付轨道？
      - - 实时轨道、虚拟卡与电子发票
        - 驱动
        - 近期
        - 出于现金流和合规考虑，资金与 AP 团队在升级支付工作流
        - Mordor 将实时轨道、虚拟卡和电子发票强制要求列为增长驱动
        - 当 ROI 由资金团队主导时，哪些买方细分转化最快？
      - - 本地支付方式本地化
        - 驱动
        - 近期
        - 符合各国偏好的结账方式，会抬高转化率和扩张价值
        - Rapyd Docs 和 Stripe 都强调本地支付方式和本地化结账
        - Rapyd 按国家和支付方式展示了多少转化率提升？
      - - 合规、牌照与受保护资金信任
        - 驱动
        - 持续
        - 在受监管的支付基础设施里，信任本身就是产品的一部分
        - Airwallex、Thunes、Checkout.com 和 Stripe 都把合规与风险控制放在前台
        - 哪些信任功能能赢单，而不只是避免流失？
      - - 各市场监管碎片化
        - 约束
        - 持续
        - 提供商仍要按走廊逐一处理本地牌照、制裁、KYC 和运营规则
        - FSB 和 BIS 都称跨境摩擦仍未解决
        - Rapyd 哪些市场直接持牌，哪些依赖合作伙伴？
      - - 合作伙伴依赖与混合运营模式
        - 约束
        - 持续
        - 银行、网络成员和本地轨道会影响经济性、正常运行时间和上线速度
        - Airwallex 披露伙伴银行结构；Thunes 主打会员网络；Rapyd 提到跨多条轨道的统一基础设施
        - 交易量、利润率和故障中，有多大比例落在第三方合作伙伴身上？
      - - 切换成本与实施负担
        - 约束
        - 近期
        - 多工作流集成能提高留存，但会拖慢初始采用和替换决策
        - Stripe Connect、Stripe Global 和 Checkout.com 都把支付与资金、税务、欺诈防控和平台工具打包
        - Rapyd 的中位实施周期和替换周期有多长？
      - - 产品包趋同与定价压力
        - 约束
        - 近期
        - 许多规模化同业如今都在讲类似的一站式平台叙事
        - Adyen、Airwallex、Nuvei、Checkout.com 和 Rapyd 都在对外主打宽口径收款 / 付款 / 账户技术栈
        - Rapyd 在哪里还能守住差异化定价？
      - - 公开经济性不透明
        - 约束
        - 近期
        - 缺少抽佣率、TPV 或队列细节，很难精确判断市场增长能转化成多少收益
        - Rapyd 的公开证据给出了规模点，但撑不起可辩护的公开 SAM/SOM 模型
        - 索取 TPV、抽佣率、细分收入结构和留存数据
