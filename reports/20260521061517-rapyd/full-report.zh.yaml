  - id: TV005
    title: 打破论点与终止触发项表
    columns:
      - 触发项
      - 证据门槛
      - 它为什么打破论点
      - 行动含义
    rows:
      - - 低于当前估值的融资
        - 任何低于 2025 年 3 月估值的新一级融资，且缺少有说服力的战略理由
        - 说明 2025 年重置价并非出清价，普通股上行弱于预期。
        - 下调到接近避开，直到重新核保估值底部和资本结构。
      - - 整合滑坡
        - PayU 交割后，系统协调延误、市场上线停滞，或成本明显爬升
        - 削弱「规模正在转化为更好经济性，而不只是摊大面积」这一论点。
        - 切到下行情景假设，并下修倍数走廊。
      - - 监管或服务质量事件
        - 重大监管整改、付款中断或客服质量恶化
        - 说明复杂度正在损害信任并拖慢增长。
        - 立即降低信心；按更低收入和倍数假设重新核保。
      - - 沉重资本结构包袱
        - 债务契约或优先条款吃掉大部分基准情景上行
        - 说明名义股权价值夸大了普通股投资人实际拥有的东西。
        - 暂停投资，或要求大幅更低价格。
      - - IPO 准备延误
        - 到 2027 年仍没有可信的上市公司级内控和审计路径
        - 削弱后期投资人最自然的流动性路径。
        - 拉长期持有期假设，并压缩退出倍数。
      - - 收入质量不达标
        - 证据显示伙伴渠道、集中度或流失情况差于当前暗示水平
        - 降低对 PayU 后规模可持续性的信心。
        - 转向更低增长、更低倍数的基准和下行情景。
    notes: 终止触发项聚焦会推翻核保逻辑的事件，而不是泛泛的金融科技波动。
    claimRefs:
      - CV014
      - CV025
      - CV033
      - CV039
      - CV042
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 要求
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 优先级
    rows:
      - - 2025 年融资包
        - 债务金额、出借方、期限、契约、清偿顺位，以及完整优先股堆栈条款
        - 决定真实企业价值，以及新股权还能拿到多少上行。
        - 财务团队、法律顾问和董事会融资备忘录。
        - 关键
      - - 经审计合并财务
        - 2025 年和 2026 年 YTD Rapyd 与 PayU 合并口径收入、毛利率、EBITDA 和现金流桥接
        - 把当前名义收入门槛变成可核保的估值基础。
        - 审计师资料包和管理账。
        - 关键
      - - 协同与整合跟踪表
        - 按国家拆分的整合里程碑、成本协同和上线延误
        - 说明 PayU 是改善了估值质量，还是只是增加了复杂度。
        - 整合 PMO 和职能工作流。
        - 高
      - - 收入质量包
        - NRR、GRR、头部客户集中度、准备金画像和伙伴渠道结构
        - 验证规模是否可持续、增长质量是否够高。
        - FP&A、收入运营和客户分析。
        - 高
      - - IPO 准备材料
        - 内控整改、审计师准备度、治理升级和投行接触状态
        - 支撑或证伪上行情景内嵌的 2027-2028 年流动性路径。
        - CEO / CFO 办公室和外部顾问。
        - 高
      - - 监管 / 服务计分卡
        - 主要市场近期事件、整改通知、入驻摩擦和支持指标
        - 检验整合和增长是否正在削弱客户信任或合规姿态。
        - 合规、运营和客户支持负责人。
        - 高
    notes: 这些要求是为了改变投资建议，不是收集泛泛的尽调琐事。管理层若拿不出来，本身就是可用于决策的证据。
    claimRefs:
      - CV002
      - CV010
      - CV031
