              公开证据始终把 Rapyd 放在基础设施层：公司营销一套覆盖受理、付款、账户、发卡和嵌入式金融的栈；文档强调本地支付方式和支持的注册地；独立报道把这套栈与 100+ 个国家、1,200+ 种方式以及 PayU
              后超过 $1B 收入连接起来。这个组合更符合全球支付基础设施和跨境商业赋能，而不是任何单一市场标签。
