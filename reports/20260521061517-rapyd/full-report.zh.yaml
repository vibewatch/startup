  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Rapyd
              最好被理解为打包的资金流运营层，而不是单一收单功能。官方产品和文档界面反复把收款、付款、账户、卡和稳定币打包在一起；文档中心还显示，这些模块既可独立集成，也可组合成更宽的金融栈。映射到工作流，就是商户或平台可以从结账或付款起步，再加入钱包入金、发卡、报表或伙伴渠道分发，而不用更换供应商。最强的公开功能主张集中在地理和支付方式广度：Rapyd
              Collect 面向卡和数百种本地支付方式，Disburse 覆盖 190+ 个付款国家，Wallet 支持 70+ 种货币，Issuing 支持虚拟和实体卡，并可配置授权。


              客户证明显示，这种广度并非纯宣传册。GoTrade 将本地支付方式与更高交易量联系起来，Kadmos 用 Rapyd 做全球薪资式付款，Littlepay 用它做交通收单，Alcaston
              用它服务摩擦更高的商户类别。这些证据支撑了覆盖入金、受理、付款和结算的真实客户工作流故事。限制在于，公开定价和模块级就绪度细节仍薄。Rapyd 大力营销稳定币和 AI
              原生定位，但公开材料没有披露通道级经济性、走廊约束或各市场精确功能就绪度。
