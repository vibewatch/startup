companyProfile:
  summary: >-
    Rapyd 是一家私营的全球支付和金融科技基础设施公司，2015 年由 Arik Shtilman、Arkady Karpman 和 Omer Priel
    创立。公开证据把总部锚定在伦敦，同时显示其运营足迹分布在以色列、英国、冰岛、新加坡、香港、阿联酋和美国。平台靠自有受监管实体和合作伙伴牵头的本地通道，销售支付受理、付款、多币种账户、发卡和嵌入式金融工作流。2025 年完成 PayU
    收购后，公开描述称 Rapyd 覆盖 100+ 个国家，支持 1,200+ 种支付方式，员工约 1,600 人，收入超过 $1B，服务 250,000 名商户。
