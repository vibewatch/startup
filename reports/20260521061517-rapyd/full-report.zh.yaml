      - number: '6.2'
        title: 具名证据与采用代理指标
        blocks:
          - type: paragraph
            body: >-
              Rapyd 最强的客户证据，不是商户总数这类顶层说法，而是具名工作流证据的密度。Gotrade、Kadmos、Littlepay、Kontempo、Spreedly
              以及一长串由伙伴带来的商户专家，都描述了已上线部署和具体任务：券商入金、船员薪资发放、交通收单、BNPL 对账、酒店餐饮收款和支付编排。多篇 2025 年案例研究不止于泛泛好评，还给出硬结果片段，例如 150
              个市场、新增 75 个国家、900 多种方式、50 种货币、12 个以上国家、250 多家运营商、1.2 亿笔以上交易、32 家以上商户伙伴，以及 100,000 名以上 BNPL
              买家。即便这些证据没有披露队列经济性，也足以构成可信的使用代理指标。


              因此，采用故事真实，但衡量并不均匀。Rapyd 引述 Nilson 的博客称公司支持超过 250,000 家商户，Calcalist 称 PayU 后合并业务收入将超过 $1 billion，员工约 1,600
              人。但两个来源都没有给出达到投资级采用分析所需的分母细节：直接商户和伙伴推荐商户没有拆分，活跃账户和历史账户没有拆分，旧 Rapyd 与 PayU
              之间也没有桥接。结果是，客户增长叙事在商业上可信，也明显覆盖多个垂直行业，但仍太不透明，无法支撑细粒度的队列或集中度建模。
