      - number: '5.2'
        title: 运营架构与交付模式
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个分层但部分不透明的运营模式。顶层是公共支付 API，以及一组面向商户和伙伴的托管式或无代码入口。下面是 Collect 和 Disburse
              的交易编排模块、用于入金和对账的钱包与账户层、用于卡项目的发卡层，以及横跨欺诈、合规、报表和支持运营的控制层。发卡页面和 Protect
              文档尤其有用，因为它们展示的是机制而非营销话术：授权可以远程或直接完成，可疑资金流可以隔离，客户 webhook 是控制路径的一部分。


              更难的架构问题是 Rapyd 哪些部分直接拥有，哪些部分通过受监管实体和伙伴协调。监管框架清楚表明，答案随地区变化。Rapyd 在欧洲、英国和新加坡使用自有法律实体，在美国与 Evolve 和 MVB
              合作，在其他地方依赖选定网络伙伴。PerfectScale 增加了工程视角：Rapyd 在 CI/CD、基础设施和 SRE 团队中运行 15+ 个 EKS 集群；Akamai 则把公共 API
              描述为高可用、高信任界面。合起来看，这些来源意味着 Rapyd 有相当的内部平台成熟度，但服务模式天然是多实体、依赖伙伴的。
