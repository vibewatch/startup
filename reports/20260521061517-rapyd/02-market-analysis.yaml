slug: rapyd
runDate: '2026-05-21'
company:
  name: Rapyd
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Rapyd sits in the global payments infrastructure layer where cross-border payments, embedded finance, and fintech
    enablement overlap, but public market-sizing sources use incompatible boundaries. The broadest lenses are large: Mordor
    projects B2B payments at $1.67T in 2026, Allied projects cross-border payments at $206.5B in 2024 growing to $414.6B
    by 2034, and Grand View sizes embedded finance at $83.32B in 2023 growing to $588.49B by 2030. Those figures are not
    additive and do not isolate Rapyd's exact SAM because public evidence does not disclose take rates, payment volume,
    buyer mix, or product revenue split. The most defensible public conclusion is that Rapyd already serves a meaningful
    operating slice of the market—post-PayU reporting pointed to more than $1B of revenue, 250,000+ merchants, 100+
    countries, and 1,200+ methods—while adoption is still governed by regulation, localization, trust, switching cost,
    and partner dependence.
sections:
  - id: market-boundary-and-sizing
    title: Market boundary and evidence-constrained sizing lenses
    body: >
      Rapyd should be analyzed as global payments infrastructure rather than as a single narrow fintech category. Its own
      positioning combines pay-ins, payouts, multi-currency accounts, card issuing, and embedded financial services on one
      platform, which places it at the overlap of three public market lenses: cross-border payments, embedded finance, and
      broader B2B payment flows. That overlap matters because headline TAMs are highly sensitive to what they count.
      Mordor's B2B payments figure is an enormous underlying spend pool that includes domestic flows and therefore says
      more about payment volume opportunity than vendor revenue. Allied's cross-border payments estimate is closer to
      Rapyd's use cases, but still includes incumbent bank wires, correspondent banking, and card networks that are much
      broader than Rapyd's direct revenue pool. Grand View's embedded finance estimate is closer to software and
      infrastructure monetization, but it also includes adjacencies such as lending and insurance that Rapyd does not
      obviously own. The correct takeaway is not that these numbers can be added together; it is that Rapyd operates in a
      large, fast-digitizing infrastructure layer whose exact public SAM and SOM remain unisolated because key inputs such
      as take rate, TPV, and segment mix are undisclosed.
    claimRefs:
