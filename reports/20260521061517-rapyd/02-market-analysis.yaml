  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-som-gap
      missingEvidence: Rapyd's gross payment volume, take rate, net revenue retention, and product-level revenue mix by pay-ins, payouts, accounts, issuing, and other embedded-finance modules.
      whyItMatters: Without those inputs, public market-size lenses cannot be converted into a defensible Rapyd-specific SAM, SOM, or share model.
      diligencePath: Request management dashboards showing TPV, net revenue by product line, cohort retention, and take-rate bridges for the most recent twelve months.
      relatedQuestionRefs:
        - QM007
        - QM025
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: buyer-segment-mix
      missingEvidence: Revenue, volume, and customer concentration by enterprise merchant, platform, SMB, payout-led, and emerging-market segments.
      whyItMatters: The chapter can identify likely buyer classes, but not which segment actually drives the majority of Rapyd's economics or retention.
      diligencePath: Request segmented revenue and GPV by customer cohort, top-20 customer concentration, and gross-margin contribution by segment.
      relatedQuestionRefs:
        - QM009
        - QM010
      relatedTableRefs:
        - TM003
    - type: private-evidence-only
      severity: material
      topic: partner-dependence
      missingEvidence: Corridor-level breakdown of direct licensing versus partner-bank, scheme, or local-network dependence, including outage and margin exposure.
      whyItMatters: Partner dependence is both a moat and a risk driver, but public materials do not show where Rapyd controls infrastructure directly versus indirectly.
      diligencePath: Ask for a corridor map showing direct entities, sponsored-bank relationships, local acquirers, settlement partners, and any material service-level dependencies.
      relatedQuestionRefs:
        - QM022
        - QM026
      relatedTableRefs:
        - TM004
    - type: missing-source
      severity: minor
      topic: public-sam-benchmark
      missingEvidence: A high-quality public benchmark that isolates fintech-as-a-service or payments-infrastructure revenue for the exact Rapyd feature set without bundling broad adjacent categories.
      whyItMatters: Available analyst reports cover adjacent but mismatched categories, which makes public TAM storytelling noisier than company-specific underwriting needs.
      diligencePath: Continue monitoring analyst coverage for narrower payments-infrastructure segmentation and request management's internal market model during diligence.
      relatedQuestionRefs:
        - QM007
        - QM025
