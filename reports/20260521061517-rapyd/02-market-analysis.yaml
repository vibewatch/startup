  - id: constraints-adverse-angle-and-gaps
    title: Adoption constraints, adverse angle, and remaining diligence gaps
    body: >
      The adverse angle is not that the market is small; it is that the most impressive top-down figures are the least
      investable on their own. Payments infrastructure vendors routinely market a "one platform" story, and the peer set is
      crowded with similarly broad claims across payments, payouts, wallets, accounts, risk, tax, treasury, and embedded
      finance. That convergence means market growth does not automatically translate into differentiated pricing power.
      Regulation is also a double-edged sword: the same standards agenda that promises better interoperability still leaves
      buyers and providers dealing with fragmented local licensing, partner banks, scheme dependencies, sanctions, and
      country-specific checkout behavior. Public peer disclosures underscore that even scaled operators use hybrid models
      that depend on network members, local rails, or regulated banking partners rather than wholly owned end-to-end
      infrastructure in every market. Once integrated, buyers may face real switching costs across onboarding, payout
      orchestration, fraud, tax, and reconciliation, but those switching costs can also make initial sales cycles slower and
      trust hurdles higher. For Rapyd specifically, public evidence supports strategic relevance and existing reach, but not
      a precise public SAM/SOM or durable margin view. The missing pieces are payment volume, take rate, cohort economics,
      product mix, concentration, and corridor-level partner exposure.
    claimRefs:
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036
      - CM038
      - CM039
      - CM040
