callouts:
  - calloutType: insight
    title: Rapyd is better framed as infrastructure for global commerce than as a single fintech niche
    body: >
      Public evidence consistently places Rapyd at the infrastructure layer: the company markets one stack for acceptance,
      payouts, accounts, issuing, and embedded finance; docs stress local payment methods and supported domiciles; and
      independent reporting ties that stack to 100+ countries, 1,200+ methods, and more than $1B of revenue after PayU.
      That combination fits global payments infrastructure and cross-border commerce enablement better than any one market
      label on its own.
    claimRefs:
      - CM001
      - CM010
      - CM037
      - CM038
  - calloutType: risk
    title: Broad TAM headlines can overstate what is actually underwritable
    body: >
      Rapyd-relevant market numbers vary by an order of magnitude because they count different things: B2B payment flow,
      cross-border services, embedded-finance vendor revenue, or a narrow embedded-payments subsegment. Without public
      take-rate, payment-volume, or segment-mix disclosure, those lenses show directional opportunity but not a precise
      company-specific SAM or SOM.
    claimRefs:
      - CM007
      - CM009
      - CM034
      - CM040
      - CM049
      - CM050
  - calloutType: risk
    title: Regulation and partner dependence create both moat and drag
    body: >
      Global payments buyers want the licensing, compliance, and local-method breadth that infrastructure providers offer,
      but those same requirements lengthen deployment cycles and keep providers dependent on partner banks, schemes,
      network members, and local rails. BIS and FSB still describe speed, transparency, access, and cost as unresolved
      cross-border frictions, while peer platforms openly describe hybrid operating models rather than fully self-owned
      infrastructure everywhere.
    claimRefs:
      - CM021
      - CM029
      - CM031
      - CM035
      - CM046
  - calloutType: assumption
    title: Treat public SAM and share estimates as refresh items, not settled facts
    body: >
      The most supportable public market conclusion today is strategic fit plus existing footprint, not a fully defensible
      share model. The next refresh should watch for disclosed payment volume, take rate, product mix, customer
      concentration, and changes in direct licensing versus partner dependence before tightening valuation assumptions.
    claimRefs:
      - CM040
      - CM056
