  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Timing
      - Why it matters
      - Evidence
      - Diligence ask
    rows:
      - - ISO 20022 harmonization
        - Driver
        - Medium term
        - Richer and more consistent payment data can improve transparency and automation
        - BIS says harmonized ISO 20022 use should make cross-border payments faster, cheaper, and more transparent
        - Which Rapyd corridors already run on harmonized ISO 20022 flows?
      - - G20 / FSB cross-border reform agenda
        - Driver
        - Medium term
        - Policy pressure keeps cost, speed, access, and transparency on executive agendas
        - FSB roadmap targets the key frictions in cross-border payments
        - Which reforms materially benefit Rapyd versus incumbents?
      - - Open banking and open finance standards
        - Driver
        - Near to medium term
        - Standardized permissioned data and payment initiation expand embedded-finance workflows
        - Open Banking UK and FDX both frame collaborative API ecosystems for banks, fintechs, and technical providers
        - How much of Rapyd's roadmap depends on data-access standards versus payments rails?
      - - Real-time rails, virtual cards, and digital invoicing
        - Driver
        - Near term
        - Treasury and AP teams are modernizing payment workflows for cash-flow and compliance reasons
        - Mordor highlights real-time rails, virtual cards, and e-invoicing mandates as growth drivers
        - Which buyer segments convert fastest when ROI is treasury-led?
      - - Local payment-method localization
        - Driver
        - Near term
        - Country-specific checkout preferences raise conversion and expansion value
        - Rapyd Docs and Stripe both emphasize local methods and localized checkout
        - What conversion uplift does Rapyd show by country and payment method?
      - - Compliance, licensing, and safeguarded-funds trust
        - Driver
        - Ongoing
        - Trust is part of the product in regulated payments infrastructure
        - Airwallex, Thunes, Checkout.com, and Stripe all foreground compliance and risk controls
        - Which trust features win deals versus simply avoid churn?
      - - Regulatory fragmentation by market
        - Constraint
        - Ongoing
        - Providers still navigate local licensing, sanctions, KYC, and operational rules corridor by corridor
        - FSB and BIS both describe cross-border frictions as still unresolved
        - Where is Rapyd directly licensed versus partner-dependent?
      - - Partner dependence and hybrid operating models
        - Constraint
        - Ongoing
        - Banks, network members, and local rails can affect economics, uptime, and launch speed
        - Airwallex discloses partner-bank structures; Thunes sells a member network; Rapyd references unified infrastructure across many rails
        - What share of volume, margin, and outages sits with third-party partners?
      - - Switching-cost and implementation burden
        - Constraint
        - Near term
        - Multi-workflow integrations can improve retention but slow initial adoption and replacement decisions
        - Stripe Connect, Stripe Global, and Checkout.com all bundle payments with treasury, tax, fraud, and platform tooling
        - How long is Rapyd's median implementation and rip-and-replace cycle?
      - - Product-bundle convergence and pricing pressure
        - Constraint
        - Near term
        - Many scaled peers now market similar one-platform narratives
        - Adyen, Airwallex, Nuvei, Checkout.com, and Rapyd all market broad pay-in/payout/account stacks
        - Where does Rapyd still sustain differentiated pricing?
      - - Public-economics opacity
        - Constraint
        - Near term
        - Market growth is hard to capitalize precisely without take rate, TPV, or cohort detail
        - Public Rapyd evidence gives scale points but not a defensible public SAM/SOM model
        - Request TPV, take rate, segment revenue mix, and retention data
