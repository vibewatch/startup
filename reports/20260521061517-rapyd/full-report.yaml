      - number: '4.4'
        title: Capital adequacy, financing dependency, and disclosure quality versus peers
        blocks:
          - type: paragraph
            body: >
              The forward capital story is clearer than the liquidity story. Calcalist reported that Rapyd raised $500
              million in March 2025, mostly equity with a small debt component, at roughly a $4.5 billion valuation to
              close the $610 million PayU acquisition. That financing solved one immediate need and took disclosed total
              funding above $1 billion. It also came after a major private-market reset from the company's 2022 peak
              valuation, which is an adverse reminder that capital has not been frictionless. The PayU close itself
              required approvals from seven regulators and expanded Rapyd's reach further into Latin America and Africa,
              so the capital was tied to strategic scale-up rather than simply to padding the balance sheet.

              What remains absent is the data needed to judge ongoing adequacy. No public source gives cash on hand,
              monthly burn, runway, seller financing detail, debt amount, debt terms, or covenant structure. Companies
              House provides a local UK filing anchor through Rapyd Payments Limited, but not group-level Rapyd
              economics. Meanwhile Checkout.com, Airwallex, Payoneer, and Adyen all expose more continuous operating or
              financial updates through newsrooms or investor-relations surfaces. Rapyd therefore looks fundable and
              strategically financeable, but still not publicly transparent enough to underwrite liquidity risk with
              confidence.
