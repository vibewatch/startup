      - number: '2.4'
        title: Adoption constraints, adverse angle, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >
              The adverse angle is not that the market is small; it is that the most impressive top-down figures are the
              least investable on their own. Payments infrastructure vendors routinely market a "one platform" story,
              and the peer set is crowded with similarly broad claims across payments, payouts, wallets, accounts, risk,
              tax, treasury, and embedded finance. That convergence means market growth does not automatically translate
              into differentiated pricing power. Regulation is also a double-edged sword: the same standards agenda that
              promises better interoperability still leaves buyers and providers dealing with fragmented local
              licensing, partner banks, scheme dependencies, sanctions, and country-specific checkout behavior. Public
              peer disclosures underscore that even scaled operators use hybrid models that depend on network members,
              local rails, or regulated banking partners rather than wholly owned end-to-end infrastructure in every
              market. Once integrated, buyers may face real switching costs across onboarding, payout orchestration,
              fraud, tax, and reconciliation, but those switching costs can also make initial sales cycles slower and
              trust hurdles higher. For Rapyd specifically, public evidence supports strategic relevance and existing
              reach, but not a precise public SAM/SOM or durable margin view. The missing pieces are payment volume,
              take rate, cohort economics, product mix, concentration, and corridor-level partner exposure.
            claimRefs:
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM038
              - CM039
              - CM040
              - CM056
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapyd is better framed as infrastructure for global commerce than as a single fintech niche
            body: >
              Public evidence consistently places Rapyd at the infrastructure layer: the company markets one stack for
              acceptance, payouts, accounts, issuing, and embedded finance; docs stress local payment methods and
              supported domiciles; and independent reporting ties that stack to 100+ countries, 1,200+ methods, and more
              than $1B of revenue after PayU. That combination fits global payments infrastructure and cross-border
              commerce enablement better than any one market label on its own.
            calloutType: insight
            claimRefs:
              - CM001
              - CM010
              - CM037
              - CM038
          - type: callout
            title: Broad TAM headlines can overstate what is actually underwritable
            body: >
              Rapyd-relevant market numbers vary by an order of magnitude because they count different things: B2B
              payment flow, cross-border services, embedded-finance vendor revenue, or a narrow embedded-payments
              subsegment. Without public take-rate, payment-volume, or segment-mix disclosure, those lenses show
              directional opportunity but not a precise company-specific SAM or SOM.
            calloutType: risk
            claimRefs:
              - CM007
              - CM009
              - CM034
              - CM040
              - CM049
              - CM050
          - type: callout
            title: Regulation and partner dependence create both moat and drag
            body: >
              Global payments buyers want the licensing, compliance, and local-method breadth that infrastructure
              providers offer, but those same requirements lengthen deployment cycles and keep providers dependent on
              partner banks, schemes, network members, and local rails. BIS and FSB still describe speed, transparency,
              access, and cost as unresolved cross-border frictions, while peer platforms openly describe hybrid
              operating models rather than fully self-owned infrastructure everywhere.
            calloutType: risk
            claimRefs:
              - CM021
              - CM029
              - CM031
              - CM035
              - CM046
          - type: callout
            title: Treat public SAM and share estimates as refresh items, not settled facts
            body: >
              The most supportable public market conclusion today is strategic fit plus existing footprint, not a fully
              defensible share model. The next refresh should watch for disclosed payment volume, take rate, product
              mix, customer concentration, and changes in direct licensing versus partner dependence before tightening
              valuation assumptions.
            calloutType: assumption
            claimRefs:
              - CM040
              - CM056
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, peer classes, and substitute set
        blocks:
          - type: paragraph
            body: >-
              Rapyd should not be benchmarked against only one kind of competitor. The most direct full-stack overlap
              comes from Stripe, Adyen, Checkout.com, and Airwallex because all market multi-product stacks that combine
              merchant acceptance with broader money-movement, platform, or treasury-like workflows. A second tier of
              specialists matters because buyers often purchase by problem, not by category label: Nium and Thunes are
              strong on payout-network reach, dLocal is strong in emerging-market local payment methods, and Nuvei
              highlights unified payments plus fraud and data. A third tier consists of substitutes that solve simpler
              international money jobs without replicating the whole enterprise PSP stack. Wise, Payoneer, WorldFirst,
              and OFX compete hardest where the buyer mainly wants cross-border collections, FX, or payout simplicity.
              The status quo is also real: some enterprises can still stay with incumbent banks or build selected
              payment layers internally. That means Rapyd competes both horizontally against broad PSP platforms and
              vertically against narrow specialists and operational defaults.
