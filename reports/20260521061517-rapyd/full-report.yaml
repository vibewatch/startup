  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and channel architecture
        blocks:
          - type: paragraph
            body: >-
              Rapyd’s public customer picture is broader than a simple merchant-acquiring list. The company markets
              itself to “every business,” but the verified customer proof is much more specific: a large share of
              visible demand comes from channel intermediaries—referral partners, consultants, ISOs, PayFacs, and
              orchestration platforms—that then bring their own merchants onto Rapyd rails. That makes buyer, user, and
              payer roles more layered than they look in homepage copy. In many cases the economic buyer is a payments
              intermediary or platform, the operational user is a merchant-ops, risk, or product team, and the ultimate
              payer is the merchant or end customer moving funds across Rapyd’s acceptance, payout, or account stack.


              The vertical pattern also matters. Current referral and case-study surfaces cluster around
              high-opportunity or high-friction segments: iGaming, online trading, creator economy, travel, hospitality,
              BNPL, transit, and payroll-style payouts. That segmentation is coherent with Rapyd’s product shape and
              regulatory posture: the platform wins where merchants need faster onboarding, more payment-method
              coverage, or help operating across several jurisdictions. The adverse angle is that this same pattern
              implies higher procurement friction and higher channel dependence. Many of the strongest public proof
              points come from merchant-service partners rather than directly from end-merchants, so the public record
              demonstrates real market traction but only imperfectly reveals how much of the installed base is direct,
              active, and durable.
