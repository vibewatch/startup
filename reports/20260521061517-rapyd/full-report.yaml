      - number: '3.3'
        title: Pricing transparency, switching costs, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Public pricing is one of the clearest areas where peer positioning diverges. Stripe, Airwallex, Wise, and
              WorldFirst all publish self-serve or at least clearly interpretable pricing cues, which makes them easier
              to trial for lower-complexity use cases. Adyen and Checkout.com are still more quote led, but they expose
              transparent interchange++ style logic and say more publicly about fee structure than Rapyd's reviewed
              product pages. That matters because pricing transparency is not just a marketing choice; it shapes the
              kind of customer who can confidently buy without a heavy sales process. Once a customer embeds onboarding,
              local methods, payouts, reconciliation, and issuing, switching costs do become real. But they do not
              eliminate competition. Enterprise buyers can multi-home by corridor, method, or region, and specialists
              like Thunes, Nium, dLocal, or Wise can coexist beside a generalist PSP. The result is a market where Rapyd
              can be sticky inside a workflow, yet still face corridor-level optimization pressure.
