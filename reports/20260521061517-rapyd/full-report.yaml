      - number: '4.3'
        title: Cost structure, operating leverage signals, and limits of the margin story
        blocks:
          - type: paragraph
            body: >
              Rapyd's public cost structure is legible only indirectly, but the pattern is clear enough to frame the
              major cost buckets. Regulatory pages and the Israeli licensing coverage imply safeguarding, AML,
              consumer-protection, and jurisdiction-specific operating costs. Akamai's customer story shows API security
              is mission critical for a public payments API that handles billions of dollars around the clock, implying
              non-trivial spend on security tooling, monitoring, and incident prevention. PerfectScale and Tidio add two
              useful operating-leverage signals: Rapyd says it runs more than 15 Kubernetes clusters and targets 35-40%
              cloud-spend reduction through optimization, while support automation resolved 42% of merchant inquiries
              and saved time for specialized agents. These are credible signs of a company trying to automate cost out
              of a complex service stack.

              Profitability messaging is directionally encouraging but still weakly verified. FXC Intelligence said
              Rapyd reached its first profitable quarter in Q3 2024, and Calcalist later described the company as
              profitable while quoting a plan to triple EBITDA margins over three years and cut back-office costs by
              70%. Those are meaningful claims, but they are management-linked and unaudited. Without public gross
              margin, EBITDA bridge, stock-comp burden, integration-cost disclosure, or working-capital detail, the
              margin path is best read as plausible but unproven.
