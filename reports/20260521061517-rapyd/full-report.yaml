      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory reach plus partner-led distribution is the core moat
            body: >
              The evidence supports Rapyd’s strongest competitive asset being regulated distribution breadth rather than
              brand-led consumer attachment. The company combines its own licensed entities, partner routes in
              unlicensed jurisdictions, customer proof points across multiple verticals, and a staged expansion through
              the PayU acquisition and Israeli market access. That combination is difficult for smaller payment
              processors to replicate quickly.
