      - number: '6.3'
        title: Retention, support, and durability
        blocks:
          - type: paragraph
            body: >-
              Durability is where Rapyd’s public evidence becomes noticeably weaker. There are decent qualitative
              proxies: Segpay describes a five-year relationship, Alcaston and VP Solutions frame Rapyd as a long-term
              partner, PayAtlas emphasizes dependable long-term solutions, and Paynt reports zero service disruption
              after switching. Tidio adds a different kind of durability signal by showing that Rapyd has enough live
              merchant activity to justify AI triage, Salesforce ticket automation, and thousands of support
              interactions in a 30-day period. Together, these sources support the view that Rapyd operates a real,
              ongoing customer estate rather than a brochure business.


              But the chapter’s key underwriting caveat is that none of this is a substitute for NRR, GRR, churn,
              renewal, contract length, or top-account retention data. Rapyd does not publish those metrics in the
              reviewed set. Even support transparency is mixed: ISO and PayFac pages promise white-glove or 24/7
              support, while the public contact surface discloses narrower hours for some channels. That does not prove
              a service problem, but it does show that buyer experience may differ meaningfully by partner type, support
              queue, and escalation path. For diligence, the public record supports operational depth and anecdotal
              stickiness, but not quantified retention quality.
