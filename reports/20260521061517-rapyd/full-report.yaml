  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >
              Rapyd should be analyzed as global payments infrastructure rather than as a single narrow fintech
              category. Its own positioning combines pay-ins, payouts, multi-currency accounts, card issuing, and
              embedded financial services on one platform, which places it at the overlap of three public market lenses:
              cross-border payments, embedded finance, and broader B2B payment flows. That overlap matters because
              headline TAMs are highly sensitive to what they count. Mordor's B2B payments figure is an enormous
              underlying spend pool that includes domestic flows and therefore says more about payment volume
              opportunity than vendor revenue. Allied's cross-border payments estimate is closer to Rapyd's use cases,
              but still includes incumbent bank wires, correspondent banking, and card networks that are much broader
              than Rapyd's direct revenue pool. Grand View's embedded finance estimate is closer to software and
              infrastructure monetization, but it also includes adjacencies such as lending and insurance that Rapyd
              does not obviously own. The correct takeaway is not that these numbers can be added together; it is that
              Rapyd operates in a large, fast-digitizing infrastructure layer whose exact public SAM and SOM remain
              unisolated because key inputs such as take rate, TPV, and segment mix are undisclosed.
