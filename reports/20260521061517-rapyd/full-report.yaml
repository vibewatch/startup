  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing posture, and what is actually monetized
        blocks:
          - type: paragraph
            body: >
              Public evidence supports Rapyd as a multi-lane payments infrastructure business, not a single-fee
              acquirer. The official product and docs surfaces show Rapyd Collect, Disburse, Wallet, Issuing, virtual
              accounts, stablecoin settlement, and fraud/compliance tooling. That implies several monetization paths:
              merchant acceptance fees, payout and FX fees, account and wallet services, issuing economics, and
              partner-generated volume. The partner programme is especially relevant to revenue quality because it shows
              channel economics are part of the model rather than a pure lead-generation afterthought. Referral partners
              earn commissions, ISVs can monetize user transactions, and ISOs or PayFacs rely on Rapyd for settlement,
              chargebacks, and compliance support.

              The harder question is realized pricing. On that point the public record is thin. Reviewed Rapyd surfaces
              do not publish standard card-processing, FX, wallet, or issuing rate cards. The language stays at the
              level of competitive pricing, lower fees, or one-platform efficiency. Legal and regulatory pages also say
              the serving entity depends on service and jurisdiction, which makes it likely that realized pricing varies
              by geography, regulatory route, and customer type. The result is a commercially broad model with clearly
              visible product lanes, but with poor public visibility into which lanes are highest margin, most
              recurring, or most concentrated.
