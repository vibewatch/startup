      - number: '4.2'
        title: Sales motion, channel economics proxies, and revenue-quality read
        blocks:
          - type: paragraph
            body: >
              Rapyd's visible go-to-market motion is partner assisted and enterprise oriented. The partner page targets
              referral agents, consultants, ISOs, PayFacs, and ISVs, while case-study evidence shows partners using
              Rapyd to win high-opportunity or regulated merchants. That matters financially because channel-led growth
              can lower direct sales burden for some segments while also introducing commissions, revenue shares,
              support obligations, and settlement complexity. The best public efficiency proxies are operational rather
              than classic SaaS metrics. Rapyd claims up to 97% authorization rates, one partner reports tripled
              merchant onboarding and 65% faster installation, and channel case studies repeatedly emphasize one
              integration, one reconciliation, and simplified multi-country operations.

              These are positive signals, but they are not substitutes for CAC, payback, or cohort data. The post-PayU
              revenue anchor above $1 billion is also not a clean standalone Rapyd figure because it follows a major
              acquisition and is presented on a combined basis. Merchant count is company claimed at 250,000+, but
              public sources still do not show product mix, take rate, recurring share, concentration, or the split
              between legacy Rapyd and acquired PayU flows. Nium's resource hub, for example, openly markets transparent
              FX rates and payouts to 190+ countries, which is a reminder that some payout-focused alternatives make
              corridor economics easier to understand from public materials than Rapyd does. That pushes the
              revenue-quality verdict toward moderate rather than high: the business looks diversified and likely
              sticky, but public disclosure still cannot prove how much of that volume converts into durable,
              high-margin, repeatable revenue.
