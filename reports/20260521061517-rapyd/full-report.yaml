  - id: FV001
    type: flow
    title: Recommendation logic
    layout: wide
    summary: >-
      Decision flow from Rapyd’s scale and strategic assets through disclosure quality and capital-structure uncertainty
      to the current recommendation.
    approximationNotes: The flow is a qualitative decision framework rather than a scorecard generated from a proprietary model.
    data:
      nodes:
        - id: n1
          label: 'Entry point: March 2025 round at ~$4.5B'
          detail: PayU close achieved; scale step-up is real
        - id: n2
          label: Proof of scale
          detail: '>$1B combined revenue, 250k merchants, 100+ countries'
        - id: n3
          label: Proof of quality still incomplete
          detail: No precise EV bridge, debt quantum, or audited combined margin path
        - id: n4
          label: Private comp corridor is usable but wide
          detail: Rapyd sits between Payoneer-like lower trust and Adyen/Airwallex-like premium references
        - id: n5
          label: 'Current call: TRACK / RESEARCH MORE'
          detail: Fair to slightly stretched relative to evidence quality
        - id: n6
          label: Upgrade path
          detail: Audited combined results, clean cap stack, better revenue-quality proof
        - id: n7
          label: Downgrade path
          detail: Below-mark financing, integration slippage, or material regulatory/service event
      edges:
        - from: n1
          to: n2
          label: Test scale
        - from: n2
          to: n3
          label: Then test quality
        - from: n3
          to: n4
          label: Then bracket valuation
        - from: n4
          to: n5
          label: Current result
        - from: n5
          to: n6
          label: What improves the call
        - from: n5
          to: n7
          label: What breaks the call
