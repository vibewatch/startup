      - number: '2.3'
        title: Growth drivers, standards, and trust requirements
        blocks:
          - type: paragraph
            body: >
              Several structural drivers support continued demand for global payments infrastructure. Cross-border and
              B2B payment workflows are digitizing as companies replace paper, batch, and fragmented banking processes
              with API-based, real-time, and data-rich rails. Mordor explicitly ties growth to real-time payments,
              working-capital optimization, virtual cards, and e-invoicing mandates. Grand View links embedded finance
              growth to smartphone and internet penetration and notes that embedded payments was the largest
              embedded-finance segment in 2023. Regulatory and standards bodies reinforce the direction of travel even
              when they do not remove friction immediately. BIS argues that harmonized ISO 20022 data usage should make
              cross-border payments faster, cheaper, and more transparent, while the FSB roadmap treats speed, cost,
              access, and transparency as explicit reform targets. Open Banking UK and FDX show a complementary
              data-layer trend: permissioned access to account data and payment initiation is becoming more
              standardized, which expands the surface area for embedded financial workflows. At the same time, official
              and peer marketing makes clear that trust remains a gating factor. Airwallex, Thunes, Checkout.com, and
              Stripe all emphasize licensing, safeguarded funds, compliance, fraud, and localization because buyers
              still treat these as purchase criteria, not hygiene.
            claimRefs:
