      - number: '1.3'
        title: Funding, valuation, regulation, and milestone chronology
        blocks:
          - type: paragraph
            body: >
              The most supportable current capital anchor is the March 2025 financing used to close the PayU
              transaction: Calcalist reported a $500 million raise at roughly a $4.5 billion valuation, mostly equity
              with a smaller debt component. Independent sources also identify major backers such as General Catalyst,
              Vista Credit Partners, TAL Ventures, Coatue, Oak HC/FT, Target Global, Tiger Global, SoftBank, and Durable
              Capital, although exact stake sizes and control rights are not public. The broader valuation narrative is
              materially more mixed than a simple growth story. Rapyd was described at a far higher peak private mark
              during the 2021–2022 fintech boom, yet both TechCrunch and Globes later reported talks for a further $300
              million round at a $3.5 billion valuation, implying a sharp reset even after the PayU close. Regulation
              remains one of the company’s strongest assets. Official compliance pages point to Iceland, UK, Singapore,
              and US operating structures, while Israeli progress moved from payment-institution licensing in 2025 to
              direct connection to the country’s card-payment rails in April 2026. Taken together, the milestone record
              shows a company that has continued to deepen its licensing stack and geographic reach even while
              private-market pricing has become less forgiving.
