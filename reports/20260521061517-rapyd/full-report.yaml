          - type: callout
            title: Valuation reset and restructuring history complicate IPO readiness
            body: >
              Rapyd’s March 2025 financing solved the PayU close, but it did not eliminate capital-market risk.
              Independent reporting points to a large gap between the peak private valuation and later fundraising
              talks, while layoffs from 2022 through 2024 and conflicting employee snapshots reduce confidence in simple
              “scale equals momentum” narratives. A future listing case will need cleaner standalone disclosure than
              public sources currently provide.
            calloutType: risk
            claimRefs:
              - CO025
              - CO034
              - CO049
              - CO050
              - CO054
          - type: callout
            title: Treat 2027 as a management aspiration, not a committed public deadline
            body: >
              The chapter should not anchor underwriting to a near-term IPO. Company-linked commentary pointed to 2027,
              while a March 2025 market analysis said 2026 timing would depend on conditions and peer reception. Until
              bankers, filing preparations, governance upgrades, and standalone financial disclosure become public, IPO
              timing remains a refresh item rather than a settled fact.
            calloutType: assumption
