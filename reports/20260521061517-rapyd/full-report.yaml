      - number: '7.3'
        title: The hardest adverse angle is financial opacity after a real valuation reset
        blocks:
          - type: paragraph
            body: >-
              Rapyd’s financial and execution risks matter less because the company is tiny and more because public
              disclosure remains acquisition-shaped after a visible reset in market pricing. Independent reporting in
              February 2025 said Rapyd was discussing a $300 million raise at a $3.5 billion valuation, far below its
              earlier peak, before March reporting showed a completed $500 million round at about $4.5 billion to close
              PayU. That is not fatal; many fintechs reset. The issue is that investors still lack the bridge needed to
              know what exactly they are underwriting now. Public revenue and headcount numbers are combined post-PayU
              metrics. The debt slice in the 2025 round is acknowledged but not quantified. Management’s profitability
              and AI-efficiency story may be directionally true, yet the strongest claims still depend on management or
              partner testimony rather than on standalone audited operating disclosure. Peers like Payoneer and Adyen
              make that opacity more visible because they publish recurring investor metrics that Rapyd does not. The
              right way to frame thesis-break risk is therefore concrete. If licences or partner banks wobble, if
              integration or support quality slips, if automation degrades controls, or if another financing happens
              below the 2025 mark without better disclosure, then the current “temporary reset with integration upside”
              narrative should be treated as broken. Until those triggers appear, Rapyd remains plausible but not fully
              de-risked.
