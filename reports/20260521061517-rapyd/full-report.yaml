chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and business model
        blocks:
          - type: paragraph
            body: >
              Rapyd presents itself as an AI-native fintech infrastructure provider rather than a consumer-first bank
              brand. Its official materials consistently describe a single platform for accepting payments, sending
              payouts, issuing cards, providing multi-currency business accounts, and increasingly supporting stablecoin
              settlement. The company’s own narrative says the current infrastructure business emerged after an earlier
              mobile-payments phase and a 2016 shift toward solving fragmented local payment integrations at global
              scale. Independent reporting places the company’s founding in 2015, which means the chapter should treat
              2015 as the external founding anchor and 2016 as the start of the infrastructure build described by
              management. The commercial posture is clearly B2B/B2B2X: Rapyd targets merchants, platforms, partners,
              ISOs, PayFacs, and software vendors that need regulated payment rails rather than a direct retail banking
              relationship. Official documentation and partner materials also support a broad geographic operating
              footprint across the Americas, Europe, the Middle East, and Asia Pacific, with licensing and partner
              arrangements used to bridge local market requirements.
