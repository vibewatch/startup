      - number: '1.2'
        title: Founders, leadership, governance, and office footprint
        blocks:
          - type: paragraph
            body: >
              Rapyd’s public leadership materials identify Arik Shtilman as CEO, Arkady Karpman as CTO, and Omer Priel
              as a continuing senior executive under the “VP Rapyd DNA” title; independent reporting also identifies all
              three as founders. The current leadership page adds a formal control layer through a named CFO, general
              counsel, chief risk officer, and CISO, which matters because Rapyd operates in a regulated, cross-border
              payments stack where licensing, fraud, and partner oversight are core operational risks. Geographic
              evidence points to London as the clearest public headquarters anchor, but the operating footprint is
              distributed: official contact information lists multiple service regions, Craft points to a London HQ and
              13 offices, and Akamai’s 2024 customer story names major operating nodes in Tel Aviv, Dubai, Iceland, Hong
              Kong, Singapore, Miami, and San Francisco. The UK footprint is partly acquisition-led, with RAPYD PAYMENTS
              LIMITED shown in Companies House as the former Valitor entity. What remains notably opaque is governance
              disclosure: public sources identify executives but do not provide a full board roster, control rights, or
              a current ownership breakdown, which is a material diligence gap for any pre-IPO assessment.
