      - number: '8.2'
        title: 'Comparable framework: enough to bracket Rapyd, not enough to pretend precision'
        blocks:
          - type: paragraph
            body: >-
              The comparable set is informative only if it is used with restraint. Rapyd sits somewhere between public
              cross-border or SMB-enablement names such as Payoneer and higher-premium infrastructure names such as
              Adyen, while private growth peers such as Airwallex, Checkout.com, and Stripe show what private investors
              will pay for scale, product breadth, and platform depth. Those references matter because they show Rapyd
              is not operating in a vacuum: premium payments infrastructure can command mid- to high-single-digit
              revenue references, while lower-disclosure or lower-trust public names can trade much closer to one to two
              turns of revenue.


              But every comp has a material limitation. Adyen is cleaner, more enterprise-led, and much more
              transparent. Wise is more focused and far more profitable. Payoneer is more public and lower-multiple, but
              also more SMB and payout weighted. Airwallex is the closest private modern-business-finance analog on
              disclosed scale, yet its run-rate disclosure is still not the same as audited revenue. Checkout.com is
              useful mainly as a reset comp showing that a private payments leader can re-mark hard while still growing
              and restoring profitability. Stripe is the upper-end milestone comp, but its disclosed revenue is
              incomplete for strict multiple work.


              That leaves a disciplined conclusion: comps can bracket Rapyd’s corridor, but they cannot deliver a
              banker-grade single-point fair value. The right response is to use ranges and explicit assumptions. On
              that basis, Rapyd looks better than the down-round headlines alone suggest, but not so obviously cheap
              that missing cap-stack details should be ignored.
