  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Multi-jurisdiction licensing is the most structural risk category
        blocks:
          - type: paragraph
            body: >-
              Rapyd’s strongest public risk signal is not a single lawsuit or incident but the shape of the operating
              perimeter itself. The company says service provision changes by product and jurisdiction, with the US
              dependent on partner banks, Europe and the UK routed through EMI entities, Israel newly opened under a
              payment licence, and other markets reached through selected network partners. That architecture is
              commercially powerful, but it also means execution quality depends on many licences, terms, and local
              counterparties staying aligned. The regulatory risk is therefore cumulative: licence conditions,
              safeguarding, AML, consumer protection, and payment-infrastructure connectivity all matter at once. The
              PayU close reinforces that point because seven regulators had to approve the transaction and integration
              still implies local remediation work after closing. The adverse angle is that direct primary verification
              remains imperfect from English-accessible sources. The retained ISA English page was access-blocked and
              the retained FCA fetch captured the search portal rather than a named CashDash entity record. That does
              not mean the licences are invalid; it means the burden of proof still sits partly on company disclosures
              and investor diligence. Monitoring should therefore focus on entity maps, regulator correspondence,
              safeguarding controls, and any country-specific launch or remediation delays rather than on generic
              “global fintech” storytelling.
