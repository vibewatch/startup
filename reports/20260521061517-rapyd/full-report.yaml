  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Rapyd is best understood as a bundled money-movement operating layer rather than a single acquiring
              feature. The official product and docs surfaces repeatedly package pay-ins, payouts, accounts, cards, and
              stablecoins together, while the docs hub also shows that those pieces can be integrated independently or
              combined into a broader financial stack. In workflow terms, that means a merchant or platform can start
              with checkout or payouts, then add wallet funding, issuing, reporting, or partner-led distribution without
              changing providers. The strongest public functional claims center on geographic and method breadth: Rapyd
              Collect is marketed for cards and hundreds of local methods, Disburse for 190-plus payout countries,
              Wallet for 70-plus currencies, and Issuing for virtual and physical cards with configurable authorization.


              Customer proof suggests this breadth is not purely brochureware. GoTrade links local payment methods to
              higher transaction volume, Kadmos uses Rapyd for global payroll-style payouts, Littlepay uses it in
              transit acquiring, and Alcaston uses it in higher-friction merchant categories. That evidence supports a
              real customer workflow story across funding, acceptance, payout, and settlement. The limiting angle is
              that public pricing and detailed module-level readiness are still thin. Rapyd markets stablecoins and
              AI-native positioning aggressively, but public materials stop short of disclosing lane-level economics,
              corridor constraints, or exact feature readiness by market.
