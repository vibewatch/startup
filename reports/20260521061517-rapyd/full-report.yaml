      - number: '3.2'
        title: Capability overlap, distribution motions, and trust posture
        blocks:
          - type: paragraph
            body: >-
              On product breadth, Rapyd is clearly credible, but it is not alone. Rapyd markets pay-ins, payouts,
              accounts, and issuing; Stripe adds Connect, Issuing, and Treasury; Adyen highlights issuing and platforms;
              Checkout.com has extended from acceptance into issuing; and Airwallex combines accounts, FX, cards, and
              online payments. The harder question is not whether Rapyd has enough boxes on the feature list, but how
              buyers encounter those boxes. Stripe's platform story is explicitly software and marketplace oriented,
              while Rapyd's public channel story is more partner, ISO, PayFac, and ISV driven. Trust posture is likewise
              table stakes rather than an exclusive moat. Rapyd, Stripe, Airwallex, and Thunes all sell compliance,
              safeguarding, network reliability, or regulated access as part of the product promise. Meanwhile Adyen and
              Payoneer maintain investor-relations surfaces that make them look more continuously disclosed than Rapyd,
              which matters in enterprise procurement and in investor underwriting.
            claimRefs:
              - CP005
              - CP006
              - CP007
