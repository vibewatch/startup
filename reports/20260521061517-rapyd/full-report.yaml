              - CV035
              - CV037
              - CV039
              - CV040
              - CV041
      - number: '8.4'
        title: Thesis-break triggers, exit readiness, and the final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a future IPO ambition, but it does not yet support treating IPO readiness as
              proven. Nilson-linked company material and Calcalist reporting show the aspiration, while the Wise,
              Payoneer, and Adyen public examples show what real disclosure quality looks like once a payments company
              approaches or enters public markets. Rapyd has not met that bar in public. That does not mean the company
              cannot get there; it means investors should treat 2027 as a strategic objective, not a bankable exit date.


              The cleanest thesis-break triggers are concrete. Another financing below the 2025 mark would signal that
              the current reset was not the clearing price but only a temporary bridge. Material integration slippage or
              regulatory friction would weaken the argument that PayU improved valuation quality. Evidence of a heavy
              debt or preferred overhang would compress common-equity upside even if operating performance improves.
              Conversely, the main upgrade path is also concrete: audited combined results, clean cap-stack disclosure,
              and proof that the combined platform is converting scale into better revenue quality and margins.


              That makes the final diligence list unusually important. This is not a chapter where another customer logo
              or another product launch changes the investment view. What matters now is the financing package, the
              audited combined numbers, and the exit-readiness workstream. Until those are visible, the rational posture
              is to keep Rapyd close, not to overpay for certainty that public evidence does not yet provide.
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
