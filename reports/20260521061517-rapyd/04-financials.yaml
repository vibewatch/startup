  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Standalone Rapyd revenue run-rate
        - Cannot separate legacy Rapyd performance from combined post-PayU scale
        - Request monthly management accounts for FY2025-FY2026 with a pre/post-PayU bridge
      - - Organic versus acquired revenue contribution
        - Cannot tell whether growth is acquisition-led, organic, or both
        - Request integration bridge showing legacy Rapyd revenue, PayU acquired revenue, and synergy assumptions
      - - Product mix and take rate by lane
        - Revenue quality cannot be ranked confidently without knowing pay-ins vs payouts vs accounts vs issuing mix
        - Request revenue and TPV by product plus net take rate by method and geography
      - - Gross margin / contribution margin
        - Margin path cannot be verified from automation anecdotes alone
        - Request gross margin by lane and contribution margin after risk, support, and cloud costs
      - - Cash on hand / monthly burn / runway
        - Liquidity risk and financing dependency cannot be quantified
        - Request current cash balance, monthly net burn, and minimum-liquidity thresholds by regulated entity
      - - Debt terms on 2025 financing
        - Unknown leverage could alter equity value, covenants, and refinancing risk
        - Request lender name, principal amount, maturity, pricing, and covenant package
      - - Customer concentration and retention
        - No public basis for judging NRR, GRR, or single-customer dependency
        - Request top-10 customer revenue share, cohort retention, and renewal schedule
      - - Channel-economics burden
        - Partner-led growth may be efficient or margin dilutive depending on commissions and support load
        - Request direct versus partner channel revenue, commission rates, and support cost by channel
      - - Working-capital / safeguarded-funds economics
        - Regulatory obligations may tie up capital or add compliance cost without public visibility
        - Request safeguarding mechanics, reserve requirements, and settlement-float treatment by jurisdiction
      - - CAC / payback / sales-cycle length
        - Sales efficiency remains impressionistic despite strong partner and onboarding anecdotes
        - Request CAC, payback, implementation cost, and sales-cycle distribution by segment
