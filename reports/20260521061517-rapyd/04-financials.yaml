  - id: verdict-and-diligence-blockers
    title: Financial verdict, adverse angle, and the remaining blockers
    body: >
      The best public verdict is that Rapyd's financial profile is investable in outline but not yet underwritable in
      detail. Revenue quality looks moderate: the product suite is broad, partner distribution appears real, and the
      company likely monetizes multiple transaction and value-added lanes. However, the strongest revenue number in the
      public record is the post-PayU combined threshold above $1 billion, not a clean standalone Rapyd figure, and public
      sources do not disclose take rate, product mix, concentration, or recurring share. Margin path looks plausible:
      management-linked sources point to profitability, EBITDA expansion, cloud savings, and support automation. But the
      public record still lacks the gross-margin and cash-flow evidence that would convert a narrative into a proven model.

      The adverse angle is therefore not that Rapyd is weak, but that it is still opaque. Large B2B and cross-border
      payments markets do not resolve the missing economics. The 2025 financing shows Rapyd can raise capital, but also
      that acquisition-led scale required fresh external funding plus some debt whose terms remain private. For diligence,
      the non-negotiable blockers are standalone revenue run-rate, the bridge between legacy Rapyd and PayU contribution,
      take rate and gross margin by lane, cash and runway, debt terms, concentration, and channel-economics burden.
