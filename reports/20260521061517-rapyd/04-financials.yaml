      - - Global payouts / Rapyd Disburse
        - Payout fees and likely FX spread on domestic and cross-border disbursements
        - Per payout / corridor / FX conversion
        - Docs claim local payouts to bank accounts in 190+ countries with reduced transfer and FX fees
        - Moderate — economically important lane, but corridor margin is unknown
        - Request payout fee schedule, FX spread policy, and corridor gross margin
      - - Wallet / multi-currency business accounts
        - Account, ledger, transfer, settlement, and reconciliation value capture
        - Account / transaction / float-related fees
        - Wallet supports 70+ currencies and single-platform settlement; pricing not public
        - Low-to-moderate — product is clear, monetization structure is not
        - Request wallet/account fee schedule and safeguarded-funds economics
      - - Card issuing
        - Issuance, processing, authorization, and card-management economics
        - Per card / per transaction / program fee
        - Remote and direct authorization modes plus end-to-end card management are public; rates are not
        - Moderate — feature depth is real, but program economics are opaque
        - Request interchange economics, program fees, and delivery/production cost split
      - - Partner programme / channel revenue
        - Referral commissions, revenue share, ISO economics, and transaction-linked partner monetization
        - Commission / revenue share / transaction share
        - Referral, ISO, PayFac, and ISV models are explicit; FXC says referral revenue was already significant
        - Moderate — partner channel is clearly monetized but payout burden is not public
        - Request partner mix, average commission rate, and channel contribution to net revenue
      - - Fraud / compliance tooling
        - Bundled risk management, quarantine workflows, and compliance tooling that may reduce loss rates or support upsell
        - Bundled platform feature / attach service
        - Rapyd Protect is described as a free AI-driven fraud tool integrated into the platform
        - Low — value likely real, but standalone revenue is not indicated
        - Request attach rate, loss-prevention impact, and whether any premium pricing exists
      - - Stablecoin and treasury-adjacent flows
        - Settlement and funds-movement economics for stablecoin-enabled workflows
        - Transaction / spread / treasury fee
        - Product surface is public, but monetization detail is absent
        - Low — strategic lane, limited public proof of current revenue weight
        - Request stablecoin TPV, pricing, and gross-margin profile
