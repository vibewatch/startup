callouts:
  - calloutType: insight
    title: Monetization breadth extends beyond merchant acquiring
    body: >
      Rapyd's public evidence supports more than a simple card-processing model. The company sells or bundles pay-ins,
      payouts, wallet accounts, issuing, fraud/compliance tooling, and partner-channel economics, which creates several
      potential revenue lanes even without a public rate card.
    claimRefs:
      - CI001
      - CI006
      - CI010
      - CI015
      - CI016
  - calloutType: risk
    title: Public revenue scale is real, but revenue quality is still opaque
    body: >
      The post-PayU revenue figure above $1 billion is meaningful, but it is a combined threshold rather than a clean
      standalone Rapyd number. Public sources still do not show take rate, product mix, recurring share, concentration,
      or organic versus acquired contribution.
    claimRefs:
      - CI018
      - CI019
      - CI045
      - CI046
  - calloutType: risk
    title: The PayU raise solved one financing event, not ongoing liquidity visibility
    body: >
      Rapyd clearly had access to capital in 2025, but the same raise also shows capital intensity: a large mostly-equity
      round plus some debt was needed to close PayU, while cash on hand, burn, runway, and debt terms remain undisclosed.
    claimRefs:
      - CI030
      - CI031
      - CI037
      - CI048
  - calloutType: assumption
    title: Treat profitability claims as directional until standalone financials are shared
    body: >
      Public reporting and management-linked commentary point to profitability and better margins, but no public standalone
      gross margin, EBITDA bridge, or cash-flow statement confirms how durable those gains are after integration and
      ongoing regulatory overhead.
    claimRefs:
      - CI022
      - CI023
      - CI024
