  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: standalone-revenue-quality
      missingEvidence: Standalone Rapyd revenue by product line, take rate by lane, and a bridge separating legacy Rapyd from acquired PayU contribution.
      whyItMatters: The strongest public scale number is post-acquisition combined revenue, which is insufficient for judging organic revenue quality or durability.
      diligencePath: Request monthly revenue by lane for FY2025-FY2026 plus an integration bridge separating legacy Rapyd, PayU acquired revenue, and synergy assumptions.
      relatedQuestionRefs:
        - QI010
        - QI017
        - QI028
      relatedTableRefs:
        - TI001
        - TI005
    - type: private-evidence-only
      severity: material
      topic: burn-runway
      missingEvidence: Current cash on hand, monthly net burn, minimum regulated-entity liquidity thresholds, and runway months.
      whyItMatters: Public evidence shows Rapyd can raise capital, but not whether it can self-fund operations after the PayU integration without another financing event.
      diligencePath: Request current treasury dashboard, board liquidity pack, and regulated-entity cash segmentation with monthly burn and runway assumptions.
      relatedQuestionRefs:
        - QI021
        - QI030
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: debt-terms
      missingEvidence: Principal amount, lender identity, maturity, pricing, security package, and covenants for the debt portion of the 2025 raise.
      whyItMatters: Even a small debt slice can alter equity value, refinancing risk, covenant flexibility, and next-round dependency.
      diligencePath: Request financing documents or management summary of the 2025 debt facility and confirm whether any acquisition or revenue covenants apply.
      relatedQuestionRefs:
        - QI020
        - QI030
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin by lane, contribution margin after risk and support costs, CAC, payback, NRR, GRR, and top-customer concentration.
      whyItMatters: Public automation and scale anecdotes do not prove a durable margin stack or attractive customer economics.
      diligencePath: Request product-line P&L, cohort retention tables, top-customer revenue share, and channel-level CAC or commission economics.
      relatedQuestionRefs:
        - QI010
        - QI029
        - QI031
      relatedTableRefs:
        - TI003
        - TI005
    - type: disclosure-scope
      severity: minor
      topic: filing-and-ir-surface
      missingEvidence: Public group-level investor-relations materials or consolidated statutory accounts that match the scale of Rapyd's private-company claims.
      whyItMatters: The reviewed public surface is good for product breadth and partner proof, but weak for recurring financial verification.
      diligencePath: Ask management for consolidated FY2025 financial statements and any board-approved external reporting pack used for current investors.
      relatedQuestionRefs:
        - QI022
        - QI025
