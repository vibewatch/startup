- id: bull-base-bear-logic
  title: Bull, base, and bear cases with explicit valuation logic
  body: 'The bull case is not a moonshot scenario; it is the case where Rapyd turns its enlarged footprint into cleaner economics and better disclosure. In that version, PayU integration works, revenue compounds into the high teens or low twenties by 2028, merchants and partners use more of the platform, and investors reward Rapyd with a revenue multiple that remains below the most exalted private names but comfortably above the lower-trust public cross-border cohort. That can create venture-style upside from the 2025 mark.


    The base case is more moderate and, in many ways, more plausible. Rapyd keeps growing, but not as a breakout premium asset. Revenue expands to roughly $1.4-1.6B, margin quality improves only somewhat, and public evidence never becomes clean enough for investors to treat Rapyd like Adyen or a public-quality software-fintech hybrid. In that world the valuation still rises, but the return is respectable rather than exceptional. That is the main reason the current price looks trackable rather than immediately compelling.


    The bear case does not require business failure. It only requires that integration is harder than expected, regulatory or service-quality friction slows growth, and the next financing or exit is judged through a lower-trust multiple closer to names like Payoneer than to premium infrastructure peers. Because the 2025 financing already showed valuation sensitivity, a below-mark outcome cannot be dismissed as remote. The scenario work therefore supports upside, but not wide-margin-of-safety upside.'
