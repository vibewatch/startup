chapter:
  number: 8
  title: Valuation
  summary: 'Rapyd looks strategically credible after closing PayU, but the March 2025 $4.5B round is not obviously cheap enough to overcome disclosure, integration, and capital-structure uncertainty. Public evidence supports only a rough low-single-digit valuation-to-combined-revenue framing on revenue described as above $1B, and it does not support a precise current EV/revenue multiple because the debt slice, cash position, and clean combined LTM bridge are undisclosed. Recommendation: TRACK / RESEARCH MORE at the current disclosed price; confidence medium; risk rating high; valuation stance fair-to-slightly-stretched relative to evidence quality. A more aggressive buy view would require audited combined financials, cap-stack clarity, and proof that PayU integration improves margin quality without reopening regulatory or service-risk concerns.'
