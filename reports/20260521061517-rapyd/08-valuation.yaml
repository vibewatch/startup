- id: TV006
  title: Final diligence asks table
  columns:
  - Ask
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Priority
  rows:
  - - 2025 financing package
    - Debt amount, lender, maturity, covenants, and ranking plus full preferred-stack terms
    - Determines real enterprise value and how much upside survives for new equity.
    - Finance team, counsel, and board financing memo.
    - Critical
  - - Audited combined financials
    - 2025 and YTD 2026 Rapyd-plus-PayU revenue, gross margin, EBITDA, and cash flow bridge
    - Turns the current headline revenue threshold into an underwritable valuation base.
    - Auditor package and management accounts.
    - Critical
  - - Synergy and integration tracker
    - Country-by-country integration milestones, cost synergies, and launch delays
    - Shows whether PayU improved valuation quality or merely increased complexity.
    - Integration PMO and functional workstreams.
    - High
  - - Revenue-quality pack
    - NRR, GRR, top-customer concentration, reserve profile, and partner-channel mix
    - Validates whether scale is durable and whether growth is high quality.
    - FP&A, revenue ops, and customer analytics.
    - High
  - - IPO-readiness materials
    - Control remediation, auditor readiness, governance upgrades, and banker engagement status
    - Supports or falsifies the 2027-2028 liquidity path embedded in upside cases.
    - CEO/CFO office and external advisers.
    - High
  - - Regulatory / service scorecard
    - Recent incidents, remediation notices, onboarding friction, and support metrics by major market
    - Tests whether integration and growth are weakening customer trust or compliance posture.
    - Compliance, operations, and customer support leadership.
    - High
  notes: These asks are designed to move the recommendation, not to collect generic diligence trivia. If management cannot produce them, that itself is decision-useful evidence.
