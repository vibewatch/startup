- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What changes the view
  rows:
  - - Scale
    - Rapyd is already a real global payments asset with >$1B revenue, 250k merchants, and broad post-PayU reach.
    - Combined scale is known only in threshold form; there is still no clean public bridge for underlying quality.
    - Audited combined statements and segment-level disclosure.
  - - Product breadth
    - Payments, payouts, accounts, issuing, and partner workflows create cross-sell potential and stickier distribution.
    - Breadth also expands support, compliance, and execution burden across many entities and rails.
    - Evidence that bundled usage and margins improve together.
  - - Distribution
    - Partner channels and geographic breadth can accelerate growth without building every route directly.
    - Channel breadth can hide concentration, quality variance, or lower-control revenue.
    - Channel revenue mix, cohort retention, and partner concentration data.
  - - Economics
    - First-profitability signals suggest the model can scale more efficiently post integration.
    - Public profitability evidence remains partial and may not survive once the combined cost base is fully visible.
    - Audited combined margin bridge and synergy scorecard.
  - - Valuation context
    - Headline pricing is below several premium peer references and above lower-trust public comps, leaving room for upside.
    - The current mark may only look reasonable because the EV bridge and preference stack are missing.
    - Cap-table and debt disclosure that proves common-equity upside is real.
  - - Exit path
    - IPO ambition is credible enough to matter and a secondary or strategic exit remains plausible.
    - Public evidence proves aspiration more than readiness, so exit timing and exit multiple remain uncertain.
    - Board-level IPO readiness materials and public-quality controls evidence.
  notes: The table separates company quality from underwriting quality; both must improve before a buy call becomes robust.
