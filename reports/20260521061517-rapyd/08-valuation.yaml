- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / model
  - Disclosed scale metric
  - Valuation metric
  - Relevance to Rapyd
  - Main limitation
  enumerationScope:
    coverage: partial
    basis: The table covers the most decision-useful public and private payments references available from retained 2025-2026 sources; it is not exhaustive and intentionally excludes legacy card processors and opaque database-only private comps.
  rows:
  - - Rapyd
    - Private target / multi-product payments platform
    - '>$1B combined revenue after PayU; 250k merchants; 100+ countries'
    - Headline valuation-to-combined-revenue framing below 4.5x; precise EV/revenue unsupported
    - Direct target; captures what the current private mark buys.
    - Debt amount, cash, and clean LTM revenue bridge are undisclosed.
  - - Adyen
    - Public enterprise payments infrastructure
    - 2025 revenue $3.10B
    - ~7.3x EV/revenue
    - Shows the multiple a public, high-quality payment infrastructure asset can sustain.
    - Cleaner enterprise mix and much stronger public disclosure than Rapyd.
  - - Wise
    - Public cross-border transfer and account platform
    - FY2025 revenue £1.2119B; reported PBT £565M
    - ~8x market-cap/revenue on rough USD translation
    - Useful for cross-border monetization quality and public-market discipline.
    - Narrower product scope and much more mature disclosure.
  - - Payoneer
    - Public SMB and cross-border payments platform
    - 2026 revenue guide $1.10-1.14B
    - ~1.2-1.3x forward EV/revenue
    - Provides the lower-multiple public corridor for a cross-border platform.
    - Different mix, more SMB exposure, and public-market scrutiny already embedded.
  - - Airwallex
    - Private modern business-finance and global payments platform
    - Annualized revenue >$1B in Oct 2025
    - ~6.7-8.0x last valuation to run-rate revenue
    - Closest private modern-finance platform reference by stage and global ambition.
    - Run-rate revenue is not the same as audited revenue and private marks can move sharply.
  - - Checkout.com
    - Private enterprise payments platform
    - 2025 net revenue growth >30%; revenue undisclosed
    - Valuation reset from $40B peak to $12B internal mark; no clean revenue multiple available
    - Best cautionary example of how private payments leaders can re-mark under incomplete disclosure.
    - Lack of revenue disclosure prevents strict multiple work.
  - - Stripe
    - Private global payments and financial infrastructure leader
    - 2025 TPV $1.9T; Revenue suite run rate $1B
    - $159B tender valuation, but not a clean total-revenue multiple
    - Upper-end milestone comp for category leadership and investor appetite.
    - Total company revenue is not disclosed here, so the ratio is not apples-to-apples.
  notes: Metrics intentionally mix EV/revenue, market-cap/revenue, and last-valuation/run-rate references where that is the most honest usable framing; pretending they are identical would overstate precision.
