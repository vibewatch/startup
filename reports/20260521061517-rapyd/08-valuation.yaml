tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - Confidence
  rows:
  - - Recommendation
    - TRACK / RESEARCH MORE at the current disclosed 2025 mark
    - Company quality is real, but the current price is not underwritten tightly enough from public evidence to justify a clear buy call.
    - Medium
  - - Valuation stance
    - Fair to slightly stretched relative to evidence quality
    - A rough low-single-digit revenue framing is not extreme, but the missing EV bridge and cap-stack terms dilute conviction.
    - Medium
  - - Risk rating
    - High
    - Integration, regulatory burden, and financing opacity can all transmit into exit value.
    - Medium
  - - Bull-case outcome
    - Attractive if Rapyd becomes a cleaner, higher-margin combined platform
    - Upside needs both growth and better disclosure; growth alone is not enough.
    - Medium
  - - Base-case outcome
    - Positive but not wide-margin-of-safety
    - Base-case value is above the 2025 mark, but not by enough to excuse missing diligence.
    - Medium
  - - Entry discipline
    - Require deeper private diligence or a more forgiving price
    - The investment works better with audited combined financials, cap-stack clarity, or a lower re-entry point.
    - High
  - - Primary watch item
    - Whether PayU integration improves economics faster than it increases complexity
    - This is the variable most likely to move Rapyd from fair to clearly attractive or clearly avoidable.
    - Medium
  notes: Recommendation is explicitly price-sensitive and evidence-sensitive; it is not a generic judgment on company quality alone.
