- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Evidence threshold
  - Why it breaks the thesis
  - Action implication
  rows:
  - - Below-mark financing
    - Any new primary financing below the March 2025 valuation without a compelling strategic rationale
    - Would suggest the 2025 reset was not the clearing price and that common-equity upside is weaker than expected.
    - Downgrade toward avoid until the valuation floor and cap stack are re-underwritten.
  - - Integration slippage
    - Delayed harmonization, stalled market launches, or clear cost creep after PayU close
    - Would weaken the argument that scale is translating into better economics rather than just more surface area.
    - Move to bear-case assumptions and cut the multiple corridor.
  - - Regulatory or service-quality event
    - Meaningful regulatory remediation, payout disruption, or customer-support deterioration
    - Would confirm that complexity is impairing trust and slowing growth.
    - Reduce conviction immediately; re-underwrite on lower revenue and multiple assumptions.
  - - Heavy cap-stack overhang
    - Debt covenants or preferred terms that absorb most of the base-case upside
    - Would mean headline equity value overstates what common-equity investors actually own.
    - Pause investment or demand a much lower price.
  - - IPO-readiness delay
    - No credible public-quality control and audit path by 2027
    - Would weaken the most natural liquidity path for late-stage investors.
    - Extend hold period assumptions and compress exit multiple.
  - - Revenue-quality miss
    - Evidence that partner channels, concentration, or churn are worse than implied today
    - Would reduce confidence that post-PayU scale is durable.
    - Shift to lower-growth, lower-multiple base and bear cases.
  notes: The kill triggers focus on events that would invalidate the underwriting logic, not generic fintech volatility.
