company:
  name: Rapyd
chapter:
  number: 1
  title: Company Overview
  summary: >
    Rapyd is a private payments and fintech infrastructure company that independent reporting traces to 2015 and that the
    company itself frames as an AI-native global payments platform built through Rapyd Financial Network (2016) Ltd. and
    regional regulated entities. As of the run date, evidence supports broad post-PayU reach across 100+ countries,
    1,200+ payment methods, and staged Israeli licensing progress through direct payment-system access, but current
    standalone 2026 financial disclosure remains incomplete and valuation-reset plus layoff history temper IPO-readiness.
sections:
  - id: identity-and-model
    title: Identity, platform, and business model
    body: >
      Rapyd presents itself as an AI-native fintech infrastructure provider rather than a consumer-first bank brand. Its
      official materials consistently describe a single platform for accepting payments, sending payouts, issuing cards,
      providing multi-currency business accounts, and increasingly supporting stablecoin settlement. The company’s own
      narrative says the current infrastructure business emerged after an earlier mobile-payments phase and a 2016 shift
      toward solving fragmented local payment integrations at global scale. Independent reporting places the company’s
      founding in 2015, which means the chapter should treat 2015 as the external founding anchor and 2016 as the start of
      the infrastructure build described by management. The commercial posture is clearly B2B/B2B2X: Rapyd targets
      merchants, platforms, partners, ISOs, PayFacs, and software vendors that need regulated payment rails rather than a
      direct retail banking relationship. Official documentation and partner materials also support a broad geographic
      operating footprint across the Americas, Europe, the Middle East, and Asia Pacific, with licensing and partner
      arrangements used to bridge local market requirements.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO051
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: leadership-governance-footprint
    title: Founders, leadership, governance, and office footprint
    body: >
      Rapyd’s public leadership materials identify Arik Shtilman as CEO, Arkady Karpman as CTO, and Omer Priel as a
      continuing senior executive under the “VP Rapyd DNA” title; independent reporting also identifies all three as
      founders. The current leadership page adds a formal control layer through a named CFO, general counsel, chief risk
      officer, and CISO, which matters because Rapyd operates in a regulated, cross-border payments stack where licensing,
      fraud, and partner oversight are core operational risks. Geographic evidence points to London as the clearest public
      headquarters anchor, but the operating footprint is distributed: official contact information lists multiple service
      regions, Craft points to a London HQ and 13 offices, and Akamai’s 2024 customer story names major operating nodes in
      Tel Aviv, Dubai, Iceland, Hong Kong, Singapore, Miami, and San Francisco. The UK footprint is partly acquisition-led,
      with RAPYD PAYMENTS LIMITED shown in Companies House as the former Valitor entity. What remains notably opaque is
      governance disclosure: public sources identify executives but do not provide a full board roster, control rights, or
      a current ownership breakdown, which is a material diligence gap for any pre-IPO assessment.
    claimRefs:
      - CO005
      - CO007
      - CO008
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO055
    tableRefs:
      - TO002
  - id: capital-regulation-and-milestones
    title: Funding, valuation, regulation, and milestone chronology
    body: >
      The most supportable current capital anchor is the March 2025 financing used to close the PayU transaction: Calcalist
      reported a $500 million raise at roughly a $4.5 billion valuation, mostly equity with a smaller debt component.
      Independent sources also identify major backers such as General Catalyst, Vista Credit Partners, TAL Ventures,
      Coatue, Oak HC/FT, Target Global, Tiger Global, SoftBank, and Durable Capital, although exact stake sizes and control
      rights are not public. The broader valuation narrative is materially more mixed than a simple growth story. Rapyd was
      described at a far higher peak private mark during the 2021–2022 fintech boom, yet both TechCrunch and Globes later
      reported talks for a further $300 million round at a $3.5 billion valuation, implying a sharp reset even after the
      PayU close. Regulation remains one of the company’s strongest assets. Official compliance pages point to Iceland,
      UK, Singapore, and US operating structures, while Israeli progress moved from payment-institution licensing in 2025
      to direct connection to the country’s card-payment rails in April 2026. Taken together, the milestone record shows a
      company that has continued to deepen its licensing stack and geographic reach even while private-market pricing has
      become less forgiving.
    claimRefs:
