  - id: scale-risks-and-gaps
    title: Scale signals, adverse developments, and key diligence gaps
    body: >
      Rapyd’s strongest scale signals are directional rather than fully financial. The post-PayU close was reported to lift
      combined revenue above $1 billion and headcount to roughly 1,600 people, while company-owned materials later claimed
      more than 250,000 merchants worldwide. Technical and partner evidence is directionally consistent with a large,
      complex platform: Akamai describes a public API handling billions of dollars around the clock, PerfectScale points to
      more than 15 Kubernetes clusters and sizable cloud-efficiency work, and Tidio describes a large merchant-support
      workflow improved through AI. Customer case studies also show breadth across brokerage, maritime payroll, transit,
      and high-regulation acquiring. The adverse side is equally important. Globes reported several layoff rounds from 2022
      through 2024 and a materially lower LinkedIn-based headcount snapshot before the PayU close, while TechCrunch and
      Globes both reported a possible down round at $3.5 billion. IPO timing is also unsettled: management-linked content
      pointed to 2027, but March 2025 analysis still framed 2026 as conditional on market sentiment. For diligence, the
      missing pieces are exact standalone 2026 headcount, current run-rate or EBITDA, and a real governance/control view
      rather than only functional leadership names.
    claimRefs:
      - CO025
      - CO034
      - CO035
