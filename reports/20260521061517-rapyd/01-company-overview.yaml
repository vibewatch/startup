  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance-disclosure
      missingEvidence: Full board roster, committee structure, share classes, control rights, and major shareholder ownership percentages.
      whyItMatters: Private-company governance quality and investor protections cannot be judged reliably from executive titles alone.
      diligencePath: Request the current board deck, cap table, shareholder agreement summary, and any observer or veto-right schedule.
      relatedQuestionRefs:
        - QO006
      relatedTableRefs:
        - TO002
        - TO003
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: A management-certified standalone 2026 employee count that reconciles pre-close, post-close, and combined PayU integration scopes.
      whyItMatters: Headcount is a cover metric and a core input into productivity, integration, and cash-burn interpretation.
      diligencePath: Obtain the latest people roll-forward by legal entity and a bridge from pre-PayU staff to post-close combined headcount.
      relatedQuestionRefs:
        - QO013
        - QO026
    - type: private-evidence-only
      severity: material
      topic: current-financials
      missingEvidence: Exact 2026 standalone revenue run-rate, EBITDA, gross margin, and any updated guidance after the PayU integration.
      whyItMatters: Public sources only support threshold or narrative statements, which is inadequate for valuation and underwriting work.
      diligencePath: Request monthly management accounts, integration-adjusted revenue bridge, and board-approved FY2026 budget or forecast.
      relatedQuestionRefs:
        - QO014
        - QO027
    - type: stale
      severity: minor
      topic: ipo-timing
      missingEvidence: A current board-approved listing plan or confirmed decision to defer an IPO.
      whyItMatters: Public commentary points to both 2026 and 2027, so timing should not be treated as settled without a fresher source.
      diligencePath: Ask management for underwriter engagement status, audit readiness milestones, and the current listing decision tree.
      relatedQuestionRefs:
        - QO025
    - type: enumeration-incomplete
      severity: minor
      topic: leadership and stakeholder tables
      missingEvidence: Complete board and investor-rights disclosure to convert the leadership and stakeholder maps from partial to exhaustive.
      whyItMatters: The chapter can identify named executives and investors, but not the full governance or control perimeter.
      diligencePath: Request the most recent cap table, board minutes cover page, and investor-rights summary.
      relatedTableRefs:
        - TO002
        - TO003
    - type: enumeration-incomplete
      severity: minor
      topic: milestone table chronology
      missingEvidence: A complete internal chronology of product launches, governance actions, and integration milestones that are not visible in public reporting.
      whyItMatters: The public milestone record is directionally useful but cannot claim to cover every event relevant to execution risk.
      diligencePath: Ask management for the internal corporate timeline used for fundraising, integration planning, and regulatory tracking.
      relatedTableRefs:
        - TO004
