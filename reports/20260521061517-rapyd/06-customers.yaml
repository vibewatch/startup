- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / channel
  - User / payer
  - Core use case
  - Public scale or proof
  - Strategic value
  - Main gap
  rows:
  - - Direct global merchants and brands
    - Merchant payments or finance teams
    - Merchant ops teams and end shoppers or guests
    - Card acceptance, alternative methods, global checkout
    - Littlepay, PayFacto UK, Paybyrd airline and retail launches
    - Validates enterprise and multi-market acceptance use cases
    - No direct-merchant count or direct revenue split
  - - Referral partners and consultants
    - Payments consultants, brokerages, matchmakers
    - Their underlying merchants and merchant founders
    - Fast onboarding and higher-risk merchant placement
    - Alcaston, NextGen, Payment Partner, PayAtlas, VP Solutions
    - Important channel for difficult or underserved verticals
    - No active partner count or partner revenue share
  - - ISOs
    - Merchant-service distributors
    - Merchant sales and support teams plus sub-merchants
    - Card acquiring, terminals, settlement, reconciliation
    - ISO programme plus Littlepay and PayFacto UK proof
    - Adds merchant acquisition reach without fully direct sales
    - No disclosed ISO merchant volume or churn
  - - PayFacs and processors
    - PayFac operators and underwriters
    - Sub-merchants, ops teams, and contractor payees
    - MID activation, scheme access, payouts, reporting
    - PayFac programme plus Segpay and Paynt
    - Enables scaled embedded payments and operational leverage
    - Responsibilities are split between Rapyd and partner
  - - Platforms and orchestration layers
    - Product or payments teams at apps and PSPs
    - Platform merchants, investors, wholesalers, and finance users
    - Single-integration coverage, local funding, reconciliation
    - Gotrade, Spreedly, Kontempo
    - Expands usage into embedded-finance and orchestration flows
    - End-customer economics remain mostly undisclosed
  - - Payout and workforce platforms
    - Payroll, treasury, or operations teams
    - Employees, contractors, crews, and beneficiaries
    - Cross-border disbursement and multicurrency money movement
    - Kadmos and Segpay
    - Supports recurring payroll-style or contractor flows
    - No public payout success or renewal metrics
  notes: Segments are based on verified public proof only; the table distinguishes direct merchants from intermediated channels because Rapyd’s visible evidence is heavily partner-led.
