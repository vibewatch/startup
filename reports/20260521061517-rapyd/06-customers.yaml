chapter:
  number: 6
  title: Customers
  summary: 'Rapyd shows real customer breadth across direct merchants, payout platforms, and especially channel partners, with current public proof in trading, payroll, transit, BNPL, hospitality, and high-opportunity merchant acquiring. Adoption evidence is strongest for onboarding speed, geographic reach, and named deployments—250,000 merchants company-claimed, 120 million transit transactions, 100,000 BNPL buyers, five-year partner duration, and multiple 2025 expansion stories—but retention quality is still mostly inferred because NRR, GRR, churn, contract length, and concentration remain undisclosed. The limiting angle is opacity: most proof is company-hosted, the support model appears segmented by channel, and the installed base may be more partner-dependent than the top-line merchant count suggests.'
sections:
- id: customer-base-and-channel-architecture
  title: Customer base and channel architecture
  body: |-
    Rapyd’s public customer picture is broader than a simple merchant-acquiring list. The company markets itself to “every business,” but the verified customer proof is much more specific: a large share of visible demand comes from channel intermediaries—referral partners, consultants, ISOs, PayFacs, and orchestration platforms—that then bring their own merchants onto Rapyd rails. That makes buyer, user, and payer roles more layered than they look in homepage copy. In many cases the economic buyer is a payments intermediary or platform, the operational user is a merchant-ops, risk, or product team, and the ultimate payer is the merchant or end customer moving funds across Rapyd’s acceptance, payout, or account stack.

    The vertical pattern also matters. Current referral and case-study surfaces cluster around high-opportunity or high-friction segments: iGaming, online trading, creator economy, travel, hospitality, BNPL, transit, and payroll-style payouts. That segmentation is coherent with Rapyd’s product shape and regulatory posture: the platform wins where merchants need faster onboarding, more payment-method coverage, or help operating across several jurisdictions. The adverse angle is that this same pattern implies higher procurement friction and higher channel dependence. Many of the strongest public proof points come from merchant-service partners rather than directly from end-merchants, so the public record demonstrates real market traction but only imperfectly reveals how much of the installed base is direct, active, and durable.
