  - CU034
callouts:
- calloutType: strength
  title: Channel-led customer acquisition looks real, not theoretical
  body: Rapyd’s public proof is crowded with current partner-led deployments across brokerages, transit, BNPL, hospitality, orchestration, and underbanked payout flows. That breadth strongly suggests a real distribution engine, especially in segments where merchants need more than a vanilla acquirer.
  claimRefs:
  - CU002
  - CU006
  - CU015
  - CU017
  - CU018
  - CU022
  - CU023
  - CU024
- calloutType: risk
  title: Retention quality is still mostly inferred
  body: Rapyd shows live customers and operational depth, but the public record still omits NRR, GRR, churn, renewal schedules, contract lengths, and concentration. The best external answer today is that customer durability is plausible, not proven.
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU035
  - CU039
- calloutType: insight
  title: Support operations look substantial, but availability is segmented
  body: Tidio’s 42% AI resolution rate and thousands of monthly support contacts imply a large operating base, while partner pages promise white-glove or 24/7 help. The contact page shows narrower public hours, so support experience likely varies by channel and account type.
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
