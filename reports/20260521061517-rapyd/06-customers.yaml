- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or dependence signal
  - Impact
  - Diligence path
  rows:
  - - Partner programme breadth
    - Many current proofs are partner intermediaries rather than direct merchants
    - Loss of a few productive channels could hit bookings and support load
    - Request direct vs partner-sourced revenue, merchant counts, and gross margin
  - - PayU-driven scale-up
    - Post-acquisition scale changes the baseline for merchant-count claims
    - Hard to compare old and new customer metrics or cohorts
    - Request pre/post-PayU customer bridge and active-account mapping
  - - High-opportunity vertical focus
    - Gaming, forex, content, crypto, and BNPL segments can have volatile approval dynamics
    - Underwriting fallout may make growth less linear than case studies suggest
    - Request approval, decline, and shutdown rates by vertical
  - - Selected network partners
    - Rapyd is not directly licensed in every market
    - Merchant experience, accountability, and complaints may vary by jurisdiction
    - Request country-by-country service-entity map and complaint-routing process
  - - Sparse concentration disclosure
    - No top-customer or top-partner share is public
    - Single-account or single-partner dependence cannot be underwritten
    - Request top-10 merchant, partner, and vertical revenue share for FY2025-FY2026
  - - Support model complexity
    - Support promises vary across partner pages and general contact channels
    - After-hours or escalation gaps could reduce retention quality
    - Request SLA, queue mix, and staffing coverage by support path
  - - Marketing-controlled proof
    - Most named outcomes are company-hosted testimonials
    - Success stories may not generalize to the broader installed base
    - Obtain independent references from the largest named accounts
  notes: The table focuses on customer-quality and channel-quality risk, not generic company risk. Several risks are visible only because the public proof is so partner-centric.
  claimRefs:
  - CU009
  - CU035
  - CU036
  - CU037
  - CU038
  - CU039
- id: TU006
  title: Procurement friction and diligence blockers table
  columns:
  - Friction or blocker
  - Evidence in public proof
  - Why it matters
  - Next diligence step
  rows:
  - - Lengthy approvals in target verticals
    - NextGen and referral materials stress delays, compliance risk, and shutdown fear
    - Addressable demand may be hard to convert even when interest exists
    - Request funnel conversion and approval time by vertical and risk tier
  - - Traditional providers struggle with underbanked or hard-to-reach payout users
    - Segpay and Kadmos frame this as a key wedge
    - Good commercial wedge, but likely higher operational burden
    - Request payout-failure rate, FX cost, and refund/return metrics by corridor
  - - Reconciliation complexity across countries and entities
    - Paybyrd and Kontempo emphasize reconciliation and tracking needs
    - Implementation effort may be heavier than “one integration” messaging implies
    - Request implementation timeline and support hours by integration type
  - - Hospitality and travel buyers need better FX and fee economics
    - PayFacto UK says lower fees and broader currency acceptance win accounts
    - Pricing and FX quality are probably critical in procurement
    - Request price benchmarks and approval-rate deltas versus incumbent acquirers
  - - Merchants in difficult sectors struggle to keep accounts open
    - VP Solutions explicitly cites account-stability problems
    - Retention risk may include re-papering or risk appetite shifts
    - Request account closure, reserve, and re-underwriting rates by vertical
  - - Public retention metrics are absent
    - No reviewed source gives NRR, GRR, churn, or renewal schedules
    - Without cohort data, durability remains anecdotal
    - Request cohort deck for direct merchants and partner-led merchants
  notes: These blockers convert marketing claims into diligence asks. They are the minimum fields needed before underwriting customer quality or concentration.
