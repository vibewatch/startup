- id: expansion-concentration-and-peer-transparency
  title: Expansion, concentration, and peer transparency
  body: |-
    Rapyd’s most visible expansion loop starts with coverage and onboarding, then compounds through adjacent products and markets. A partner or platform can start with acquiring, add payouts or multicurrency accounts, then extend into treasury, cards, or new geographies. Named proofs repeatedly show this pattern: Gotrade adds local deposits and withdrawals, Kadmos expands payout countries and methods, Paybyrd improves reconciliation for multi-market merchants, PayFacto UK uses acquiring breadth to win hospitality accounts, and Spreedly extends merchant coverage without forcing customers to replace all incumbent PSPs. That is a plausible land-and-expand motion.

    The risk is that public transparency has not caught up with the story. No reviewed source quantifies top-customer share, top-partner share, vertical mix, or partner-sourced revenue share. A steep valuation reset in 2025 adds an adverse reminder that growth quality and channel economics are not fully visible from the outside. Public peers such as Wise, Thunes, and Nium disclose more customer or network usage context than Rapyd does, while Stripe, Payoneer, and Checkout frame operational tooling and commerce outcomes with clearer public benchmarks. Rapyd still has a convincing customer narrative, but from a diligence standpoint it is easier to verify breadth and channel momentum than to verify concentration, renewal quality, or how much of the installed base is truly defensible.
