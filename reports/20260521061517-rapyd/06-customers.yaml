  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: merchant-count-segmentation
    missingEvidence: Active merchant counts broken out by direct, partner-referred, and PayU-legacy accounts, plus a bridge from the 250,000-merchant claim to current 2026 activity.
    whyItMatters: Without an activity split, scale can be overstated and concentration cannot be normalized across legacy and acquired books.
    diligencePath: Request active merchant and active processing-account counts by channel, geography, and legacy vs acquired cohort for FY2025-FY2026.
    relatedQuestionRefs:
    - QU009
    - QU023
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, contract length, renewal schedule, and downgrade data by customer segment.
    whyItMatters: Retention quality is central to valuing a payments platform with substantial partner and enterprise exposure.
    diligencePath: Request cohort retention tables for direct merchants, partner-referred merchants, and top partner programmes, plus standard contract terms and renewal schedules.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: blocking
    topic: concentration
    missingEvidence: Top-customer, top-partner, and top-vertical revenue concentration plus volume concentration by channel.
    whyItMatters: A quarter-million-merchant claim is not useful for risk if a small set of merchants or partners still drives most revenue or support burden.
    diligencePath: Request top-10 merchant and partner revenue shares, vertical mix, and concentration by TPV and gross profit for FY2025-FY2026.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: independent-customer-proof
    missingEvidence: Independent customer references, customer announcements, or filings confirming the production scope of major Rapyd-hosted case studies.
    whyItMatters: Most visible proof is controlled by Rapyd’s own marketing surface, which limits confidence in generalizing outcomes to the wider installed base.
    diligencePath: Obtain customer reference calls or independently hosted deployment evidence for NextGen, Segpay, Paynt, PayFacto UK, Kontempo, and Spreedly.
    relatedQuestionRefs:
    - QU020
    - QU026
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: support-sla
    missingEvidence: Queue-level SLA, first-response, first-contact-resolution, escalation-latency, and after-hours coverage metrics by support channel.
    whyItMatters: Support quality is a real retention and implementation variable, especially when partner marketing promises differ from general support-hours disclosures.
    diligencePath: Request SLA dashboards and staffing coverage maps for direct merchants, referral partners, ISOs, and PayFacs.
    relatedQuestionRefs:
    - QU014
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: procurement-funnel
    missingEvidence: Sales-cycle length, underwriting fallout, approval-to-go-live conversion, and win-loss reasons by vertical and channel.
    whyItMatters: Public proof repeatedly emphasizes fast onboarding, but it says little about how many prospects stall, are declined, or churn during onboarding.
    diligencePath: Request prospect-to-merchant funnel metrics and average time-to-live by partner type, vertical, geography, and risk class.
    relatedQuestionRefs:
    - QU017
    - QU018
    relatedTableRefs:
    - TU005
    - TU006
