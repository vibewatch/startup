- id: named-proof-and-adoption-proxies
  title: Named proof and adoption proxies
  body: |-
    Rapyd’s strongest customer evidence is not the top-line merchant-count claim but the density of named workflow proof. Gotrade, Kadmos, Littlepay, Kontempo, Spreedly, and a long tail of partner-led merchant specialists all describe live deployments with concrete jobs-to-be-done: brokerage funding, seafarer payroll, transit acquiring, BNPL reconciliation, hospitality acceptance, and payment orchestration. Several 2025 case studies go beyond generic praise and give hard outcome fragments such as 150 markets, 75 countries added, 900-plus methods, 50 currencies, 12-plus countries, 250-plus operators, 120 million-plus transactions, 32-plus merchant partners, and 100,000-plus BNPL buyers. Those are credible usage proxies even when they stop short of exposing cohort economics.

    The adoption story is therefore real but unevenly measured. Rapyd’s Nilson-linked blog says the company supports more than 250,000 merchants, and Calcalist says the combined business after PayU would exceed $1 billion in revenue with roughly 1,600 employees. Yet neither source gives the denominator detail needed for underwriting-quality adoption analysis. There is no split between direct merchants and partner-referred merchants, no active-versus-historical account count, and no bridge between legacy Rapyd and PayU. The result is a customer-growth narrative that feels commercially credible and visibly multi-vertical, but still too opaque to support fine-grained cohort or concentration modeling.
