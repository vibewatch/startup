- id: operating-architecture-and-delivery-model
  title: Operating architecture and delivery model
  body: |-
    Public evidence supports a layered but partly opaque operating model. At the top sits a public payments API and a set of hosted or no-code entry points for merchants and partners. Below that are transaction orchestration modules for Collect and Disburse, a wallet-and-accounts layer for funding and reconciliation, an issuing layer for card programs, and a control layer spanning fraud, compliance, reporting, and support operations. The issuing page and Protect docs are especially useful because they show mechanism rather than marketing language: authorization can be remote or direct, suspicious flows can be quarantined, and client webhooks are part of the control path.

    The harder architecture question is what Rapyd owns directly versus what it coordinates through regulated entities and partners. The regulatory framework makes clear that the answer varies by geography. Rapyd uses direct legal entities in Europe, the UK, and Singapore, works with Evolve and MVB in the US, and relies on selected network partners elsewhere. PerfectScale adds an engineering view that Rapyd runs more than 15 EKS clusters across CI/CD, infrastructure, and SRE teams, while Akamai frames the public API as a high-availability, high-trust surface. Together those sources imply meaningful in-house platform maturity, but also a service model that is inherently multi-entity and partner-dependent.
