- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Legacy pain
  - Rapyd workflow
  - Public benefit signal
  - Limitation
  rows:
  - - Global merchant checkout expansion
    - Many markets require different local methods and integrations
    - Use Collect plus hosted/API checkout, payment links, or plugins to localize acceptance
    - Docs say more methods and more geographies are supported off one hub
    - Market-level pricing and conversion deltas are not public
  - - Partner-led merchant acquiring
    - ISOs and PayFacs otherwise coordinate multiple acquirers and support layers
    - One integration, one reconciliation, one settlement with direct acquiring and compliance support
    - Partner page and Alcaston case stress easier onboarding and compliance support
    - Revenue-share terms and merchant-approval timing remain qualitative
  - - Brokerage account funding
    - Users need low-friction local methods to fund trading accounts
    - Local methods plug into a cross-border investing app via Rapyd rails
    - Gotrade says local methods increase transactions and enable near-instant funds access
    - Country eligibility and unit economics are not published
  - - Global payroll or crew payouts
    - Cross-border payroll-style flows require many payout methods and currencies
    - Disburse routes to local methods and currencies while Rapyd handles broader network access
    - Kadmos cites 900+ methods and 50 currencies
    - Independent payout reliability metrics are absent
  - - Transit and in-person acquiring
    - Transit operators need scalable acquiring across many operators and countries
    - Rapyd serves as acquiring partner for contactless public-transport payments
    - Littlepay cites 12+ countries, 250+ operators, and 120M+ transactions
    - The case study is company-hosted and not independently audited
  - - Merchant support resolution
    - Technical merchants generate high-volume, high-complexity support requests
    - Secure portal plus AI triage and Salesforce handoff routes routine issues away from specialists
    - Tidio reports 42% auto-resolution and nearly 8,000 contacts in 30 days
    - CSAT, escalation latency, and human coverage SLAs are not public
  notes: Benefit signals come from company-hosted case studies or vendor proof and should be treated as directional rather than fully independent performance benchmarks.
