    - Corridor economics, settlement timing, and SLA detail are not public
  - - Wallet / accounts
    - Merchants and embedded-finance operators
    - 70+ currencies, ledger system, sub-wallets, reconciliation, and fund management
    - GA / documented at hub level
    - Accounts layer links collection, payout, and treasury workflows
