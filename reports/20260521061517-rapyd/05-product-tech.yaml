  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: developer-docs-opacity
    missingEvidence: Readable hosted-checkout, wallet-overview, card-issuing-overview, and supported-countries documentation pages.
    whyItMatters: These are the exact implementation pages a buyer would use to validate deployment complexity, coverage, and self-serve readiness before rollout.
    diligencePath: Request direct access to the affected docs pages or an exported implementation guide that covers checkout, wallet, issuing, and country support in equivalent detail.
    relatedQuestionRefs:
    - QE021
    - QE022
    relatedTableRefs:
    - TE003
    - TE005
  - type: private-evidence-only
    severity: material
    topic: sla-and-incident-transparency
    missingEvidence: API uptime history, SLA commitments, public incident reporting, and support escalation performance metrics.
    whyItMatters: Vendor stories imply reliability investment, but underwriters still need direct evidence of production performance and service accountability.
    diligencePath: Request the last 12 months of uptime, incident postmortems, error-budget reporting, and support response-time dashboards by priority tier.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: ai-and-control-boundaries
    missingEvidence: Architecture detail for AI-native features, model governance, human-override controls, and any data-retention or evaluation policies tied to AI workflows.
    whyItMatters: Rapyd uses AI-native language across product and support surfaces, but buyers and investors cannot judge model risk or operational safeguards from the public record.
    diligencePath: Request architecture diagrams, model-governance policy, human review checkpoints, and any audit artifacts for AI support or fraud workflows.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: minor
    topic: dated-product-roadmap
    missingEvidence: A dated 2026 release schedule or changelog items tying AI, stablecoins, wallet, issuing, or checkout enhancements to specific milestones.
    whyItMatters: The public surface shows strategic themes, but not enough timing precision to underwrite execution cadence or dependency sequencing.
    diligencePath: Request the current product roadmap, changelog excerpt, or customer release notes that map features to dates and rollout stages.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: country-by-country-service-matrix
    missingEvidence: A country-by-country matrix showing which Rapyd entity, bank partner, or network partner serves each product lane and customer type.
    whyItMatters: Global coverage claims are credible at a high level, but diligence still needs to know which rails and legal perimeters apply in each target market.
    diligencePath: Request an internal coverage matrix by country, product, entity, scheme, and settlement model, plus any exception handling for unsupported corridors.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE003
    - TE004
