  - - Stablecoins
    - Treasury, payouts, and cross-border operators
    - Pay, get paid, and settle in stablecoins from one provider
    - Marketed / maturity unclear
    - Stablecoins are packaged beside conventional rails rather than as a standalone crypto tool
