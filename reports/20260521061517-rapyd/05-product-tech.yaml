- calloutType: insight
  title: The operating model is both a moat and a complexity source
  body: Rapyd expands coverage through direct acquiring, regional regulated entities, US bank partners, and selected local network partners. That structure helps product breadth but also implies more onboarding, settlement, and support coordination than a single-jurisdiction stack would require.
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE025
  - CE027
  - CE054
  - CE055
- calloutType: risk
  title: Documentation opacity is a real implementation risk
  body: The docs index points to hosted checkout, wallet, issuing, and supported-countries pages, yet the retained fetches of those pages all returned an error page. That weakens independent validation of exactly the flows implementation teams would want before committing rollout timelines.
  claimRefs:
  - CE010
  - CE049
  - CE050
- calloutType: risk
  title: Public proof of reliability and roadmap discipline is still incomplete
