companyProfile:
  summary: >-
    Rapyd is a private global payments and fintech infrastructure company founded in
    2015 by Arik Shtilman, Arkady Karpman, and Omer Priel. Public evidence anchors the
    headquarters in London while showing a distributed operating footprint across Israel,
    the UK, Iceland, Singapore, Hong Kong, the UAE, and the US. The platform sells
    payment acceptance, payouts, multi-currency accounts, card issuing, and embedded
    financial workflows through a mix of direct regulated entities and partner-led local
    routes. After closing the PayU acquisition in 2025, Rapyd was publicly described as
    operating in 100+ countries, supporting 1,200+ payment methods, employing roughly
    1,600 people, generating revenue above $1 billion, and supporting 250,000 merchants.
