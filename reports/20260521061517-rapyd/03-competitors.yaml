- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Counter-force
  - Severity
  - Current read
  - Diligence ask
  rows:
  - - Local payment-method coverage
    - Stripe, Airwallex, Thunes, and dLocal continue expanding coverage
    - Medium-High
    - Important but not unique
    - Request country-by-country coverage and gross-profit concentration by method
  - - Partner / ISO / PayFac distribution
    - Partners can route merchants to alternative PSPs if economics or service slip
    - High
    - Useful channel moat, but likely non-exclusive
    - Request partner concentration, retention, and exclusivity terms
  - - Bundled pay-ins + payouts + accounts + issuing
    - Peers now market similar workflow breadth
    - Medium
    - Bundling helps retention more than uniqueness
    - Request attach rates, churn by module count, and migration evidence
  - - Regulatory and trust posture
    - Airwallex, Stripe, Adyen, and Thunes also market compliance and regulated access heavily
    - Medium
    - Necessary but not sufficient
    - Request corridor map showing direct licenses versus sponsor or partner dependence
  - - Pricing opacity
    - Transparent peers can win smaller or software-led deals faster
    - High
    - Material weakness below the enterprise tier
    - Request pricing bands and discounting policy by segment
  - - Disclosure quality
    - Adyen, Payoneer, Checkout.com, and Airwallex disclose fresher public scale anchors
    - High
    - Rapyd looks less externally legible than key peers
    - Request current standalone revenue, GPV, approval, and margin disclosures
  notes: Severity reflects competitive downside if the counter-force intensifies, not a forecast of certain share loss.
