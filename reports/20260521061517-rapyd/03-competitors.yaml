- id: moat-durability-and-adverse-read
  title: Moat durability, adverse competitor evidence, and open diligence asks
  body: 'The adverse read is that Rapyd''s broad feature set may no longer be the core differentiator. Checkout.com and Airwallex publish fresher scale and capital anchors than Rapyd''s standalone disclosures, while Adyen and Payoneer look more externally legible through public investor-relations surfaces. Specialists also narrow the moat from below: dLocal can own specific emerging-market expansions, Nium and Thunes can dominate payout-heavy corridors, and Wise or WorldFirst can win simpler cross-border account and FX workflows on price clarity alone. That does not erase Rapyd''s advantages. Local-method coverage, partner-led distribution, and regulated access still matter. But public evidence suggests those advantages are moderately durable rather than impregnable, because peers are also expanding coverage and because partners can route merchants elsewhere. The biggest remaining unknown is economics: public pages do not provide normalized take rates, approval lifts, or corridor margins,
    so the chapter can rank strategic pressure more confidently than it can prove enduring pricing power.'
