- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Public pricing posture
  - Example disclosed fee or package
  - Contract style
  - Best-fit buyer signal
  - Implication
  rows:
  - - Rapyd
    - No standard public processing rate on reviewed pages
    - Capabilities and partner terms described, but no standard card or FX rate
    - Quote-led / negotiated
    - Complex merchants and channel partners
    - Harder to use public pricing as a low-end acquisition wedge
  - - Stripe
    - Strong public self-serve pricing
    - Pay-as-you-go with no setup, monthly, or hidden fees; custom package at scale
    - Self-serve plus enterprise custom
    - Developers, platforms, and merchants that value launch speed
    - Keeps pressure on Rapyd for simpler or software-led use cases
  - - Adyen
    - Transparent but not simple flat-rate
    - Per-transaction and interchange++ style pricing with no setup fees
    - Enterprise custom economics
    - Large merchants optimizing payment costs
    - Competes on enterprise sophistication more than on SMB simplicity
  - - Checkout.com
    - Transparent custom pricing
    - Tailored pricing, no setup or account maintenance fees, transparent interchange++
    - Enterprise custom
    - Performance-sensitive digital merchants
    - Supports competitive bids against Rapyd at the high end
  - - Airwallex
    - Published plans and FX markups
    - Free local transfers; FX from 0.5% above interbank for major currencies
    - Plan-based with scale options
    - Global SMB and mid-market buyers
    - Strong substitute where buyer needs accounts, FX, and payments together
  - - Wise
    - Highly transparent
    - One-time setup fee and upfront transaction pricing
    - Mostly self-serve
    - SMBs prioritizing cost clarity
    - Can undercut more complex PSP narratives for simpler jobs
  - - WorldFirst
    - Highly transparent account economics
    - Free account opening; receive in 20+ currencies with zero fees
    - Self-serve / standard product
    - Marketplace sellers and exporters
    - Reinforces substitution pressure below the enterprise tier
  - - OFX
    - Quote-led FX specialist
    - Competitive FX with 24/7 support and 30+ currencies
    - Relationship-led
    - Businesses focused on FX support over PSP breadth
    - Status-quo substitute rather than a full direct PSP peer
