callouts:
- calloutType: strength
  title: Rapyd still looks credible where local access and channel distribution matter most
  body: Public evidence supports Rapyd as a real contender in complex global commerce because it combines local payment-method depth, partner-led acquiring distribution, and a broad module set across pay-ins, payouts, accounts, and issuing. That is enough to keep it in the direct peer set even though it is not the only broad platform anymore.
  claimRefs:
  - CP005
  - CP027
  - CP028
  - CP041
- calloutType: risk
  title: Peer pressure is now strongest from better-disclosed private challengers and public incumbents
  body: Checkout.com and Airwallex publish fresher public operating anchors, while Adyen and Payoneer offer more external disclosure touchpoints. Rapyd therefore competes from a position where buyers can see peer momentum more clearly than Rapyd's own current standalone economics.
  claimRefs:
  - CP016
  - CP018
  - CP035
  - CP037
- calloutType: risk
  title: Transparent pricing peers can displace Rapyd on simpler jobs before feature breadth matters
  body: Wise, Airwallex, WorldFirst, and Stripe all make pricing easier to understand from public pages than Rapyd does. That transparency creates real substitution risk for SMB, exporter, and software-led use cases that do not need maximum enterprise customization.
  claimRefs:
  - CP031
  - CP033
- calloutType: assumption
  title: Treat multi-homing as normal until Rapyd proves otherwise with retention data
  body: Nothing in the public evidence proves Rapyd has locked customers into single-provider behavior. The safer underwriting assumption is that large merchants and platforms optimize by corridor, method, or region and may keep multiple providers live at once.
  claimRefs:
  - CP039
  - CP040
  - CP044
