company:
  name: Rapyd
chapter:
  number: 3
  title: Competitors
  summary: Rapyd faces credible direct pressure from Stripe, Adyen, Checkout.com, and Airwallex, while Nium, Thunes, dLocal, Nuvei, Wise, Payoneer, WorldFirst, and OFX compete for narrower parts of the same job. Public evidence suggests Rapyd remains competitive on breadth, local-method coverage, partner-led distribution, and issuing, but peers now match much of that feature set and often beat Rapyd on pricing transparency, software-platform tooling, or public disclosure. The durable moat appears more regulatory and channel based than feature unique, and public sources still do not prove superior take rates, approval lifts, or multi-homing resistance.
sections:
- id: landscape-and-segmentation
  title: Landscape, peer classes, and substitute set
  body: 'Rapyd should not be benchmarked against only one kind of competitor. The most direct full-stack overlap comes from Stripe, Adyen, Checkout.com, and Airwallex because all market multi-product stacks that combine merchant acceptance with broader money-movement, platform, or treasury-like workflows. A second tier of specialists matters because buyers often purchase by problem, not by category label: Nium and Thunes are strong on payout-network reach, dLocal is strong in emerging-market local payment methods, and Nuvei highlights unified payments plus fraud and data. A third tier consists of substitutes that solve simpler international money jobs without replicating the whole enterprise PSP stack. Wise, Payoneer, WorldFirst, and OFX compete hardest where the buyer mainly wants cross-border collections, FX, or payout simplicity. The status quo is also real: some enterprises can still stay with incumbent banks or build selected payment layers internally. That means Rapyd competes both
    horizontally against broad PSP platforms and vertically against narrow specialists and operational defaults.'
