  - - Payoneer
    - Substitute / cross-border platform
    - Millions of businesses; public company; Upwork payout infrastructure
    - SMBs, exporters, marketplaces, freelancer ecosystems
    - Cross-border payouts and business financial tools
    - Not positioned as a broad enterprise acquiring stack
  - - Wise
    - Substitute / account-first
    - 700k+ businesses; $16B monthly moved and spent
    - Global SMBs and exporters
    - Transparent low-cost international account economics
    - Narrower PSP and marketplace-control surface
  - - WorldFirst / OFX
    - Status-quo substitute
    - Free accounts, FX tooling, 1M+ OFX clients, 24/7 support
    - SMBs, importers, exporters, accounting-led users
    - Simple accounts, FX, and transfers
    - Limited evidence of broad acquiring, onboarding, or issuing depth
