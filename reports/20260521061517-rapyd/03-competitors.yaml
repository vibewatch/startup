  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: Customer-level data showing how much merchant or platform volume is split across Rapyd and rival providers by corridor, method, and region.
    whyItMatters: Public product pages imply multi-homing is feasible, but they do not show how sticky Rapyd actually is after implementation.
    diligencePath: Request retention cohorts, win-loss notes, and the share of GPV routed through more than one PSP or payout network.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: Country-by-country map of direct licenses versus sponsor-bank, acquiring-partner, or network-partner dependence and any partner concentration.
    whyItMatters: Rapyd's moat appears channel and regulatory led, but public pages do not show where that control is direct, shared, or easily substitutable.
    diligencePath: Ask for corridor coverage by legal entity, partner, exclusivity status, and gross-profit contribution.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
  - type: private-evidence-only
    severity: material
    topic: comparative-unit-economics
    missingEvidence: Comparable take rates, approval-rate deltas, fraud loss rates, chargeback performance, and corridor margins across Rapyd and peers.
    whyItMatters: Without normalized economics, the chapter can compare packaging and positioning but cannot prove superior pricing power or better unit economics.
    diligencePath: Request segment-level pricing bands, approval benchmarks, fraud metrics, and margin bridges for competitive replacement opportunities.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
    - TP005
  - type: missing-source
    severity: minor
    topic: independent-win-loss-evidence
    missingEvidence: Independent customer references or procurement records comparing Rapyd directly against Stripe, Adyen, Checkout.com, or Airwallex in the same tender.
    whyItMatters: Vendor-authored pages show positioning, but they do not reveal how buyers score the same alternatives side by side.
    diligencePath: Request recent competitive bake-off summaries, churn reasons, and reference calls from customers that have replaced or multi-homed PSPs.
    relatedQuestionRefs:
    - QP012
