- id: TR005
  title: Mitigation and thesis-break trigger table
  columns:
  - Risk
  - Trigger
  - Threshold / event
  - Monitoring source
  - Action implication
  rows:
  - - Licence or partner-bank disruption
    - Coverage interruption
    - Loss, restriction, or repricing of a core bank or EMI pathway
    - Bank / regulator notices, merchant launch delays
    - Pause underwriting until continuity plan and replacement path are proven.
  - - Integration slippage after PayU
    - Synergy miss
    - Delayed remediation, duplicated systems, or elevated attrition in acquired markets
    - Integration PMO pack, headcount churn, country-launch slips
    - Reduce conviction on margin expansion and IPO readiness.
  - - Support quality degradation
    - Service bottleneck
    - Backlog growth, falling resolution quality, or rising complaint escalation
    - Ops dashboard, major-client references, support QA
    - Treat AI efficiency claims as unproven and haircut growth assumptions.
  - - Security or uptime incident
    - Trust shock
    - Material API outage, data incident, or repeated P1 events
    - Incident reports, customer notices, status trends
    - Re-rate the platform as higher-risk infrastructure.
  - - Debt or liquidity surprise
    - Capital-structure downside
    - Debt covenants, maturities, or cash needs prove worse than expected
    - Financing docs, board pack, auditor commentary
    - Assume higher dilution or financing risk.
  - - Further valuation pressure
    - Market reset persists
    - Another primary raise below the 2025 mark or IPO delay tied to weak reception
    - Fundraising reports, IPO timetable updates
    - Shift from temporary reset thesis to structural multiple ceiling.
  - - Regulatory enforcement or safeguarding issue
    - Compliance failure
    - Material breach, remediation order, or safeguarding finding
    - Regulator notices, complaints data, legal correspondence
    - Escalate legal/compliance DD and reassess investability.
  - - AI automation harms controls
    - Execution backfire
    - Automation lowers service quality or creates compliance misses
    - Audit logs, model-governance reviews, reopen rates
    - Treat claimed cost savings as lower-quality earnings.
  notes: Triggers are designed to be monitorable so an investor can tell whether risk is compressing or getting worse in real time.
