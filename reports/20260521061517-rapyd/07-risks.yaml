- calloutType: assumption
  title: AI efficiency is only a mitigation if service quality holds
  body: The margin story assumes automation reduces cost without raising compliance misses, support backlog, or merchant frustration. Public evidence proves tooling exists, not that the operating trade-off is already solved.
  claimRefs:
