- calloutType: risk
  title: Opaque standalone disclosure is the cleanest adverse angle
  body: Post-PayU public metrics are bigger, but they are also more blended. Investors still lack a clean standalone bridge for revenue mix, debt, liquidity, and synergy capture.
  claimRefs:
