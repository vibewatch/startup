  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: israel-registry-verification
    missingEvidence: A direct ISA licence-register entry or licence PDF for Rapyd with scope, conditions, and effective dates.
    whyItMatters: The Israel licence is strategically important, but the retained English regulator surface was access-blocked and does not let investors verify the exact conditions directly.
    diligencePath: Obtain a Hebrew register export, local counsel memo, or regulator screenshot that names Rapyd and its permitted activities.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: uk-authorisation-verification
    missingEvidence: A named FCA register extract or passporting record for CashDash UK Limited and any current Rapyd-branded permissions.
    whyItMatters: Rapyd cites the UK EMI pathway as a core part of its perimeter, so investors should not rely only on company disclosures and a generic register portal capture.
    diligencePath: Pull the entity-level FCA record, archive it to the data room, and reconcile it against merchant contracting entities.
    relatedQuestionRefs:
    - QR003
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: debt-and-liquidity
    missingEvidence: Debt amount, maturity, pricing, covenants, and post-close liquidity runway for the 2025 financing.
    whyItMatters: Without the debt terms and liquidity bridge, investors cannot cleanly price working-capital risk, dilution risk, or financing downside after the PayU close.
    diligencePath: Request the financing summary, covenant package, and monthly liquidity forecast used internally after the March 2025 round.
    relatedQuestionRefs:
    - QR018
    - QR027
    relatedTableRefs:
    - TR005
    - TR006
  - type: private-evidence-only
    severity: material
    topic: incident-and-support-metrics
    missingEvidence: Historical P1 or outage data, SLA attainment, support backlog ageing, human escalation rates, reserve actions, and merchant appeal outcomes.
    whyItMatters: Public case studies show complexity and some automation success, but they do not prove that service quality, fraud controls, and merchant outcomes are improving at scale.
    diligencePath: Review a rolling twelve-month operations dashboard covering incidents, support, reserves, chargebacks, and complaint escalation by product and region.
    relatedQuestionRefs:
    - QR028
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: standalone-post-payu-kpis
    missingEvidence: Standalone Rapyd versus acquired PayU revenue, margin, headcount, attrition, and synergy-delivery KPIs for 2025 and 2026.
    whyItMatters: Public evidence is heavily acquisition-shaped, so investors still cannot tell whether organic quality and integration execution are improving or merely being masked by scale.
    diligencePath: Request the integration PMO scorecard, monthly synergy tracker, and a standalone-versus-combined management reporting bridge.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR026
    relatedTableRefs:
    - TR004
    - TR006
  - type: private-evidence-only
    severity: material
    topic: partner-channel-concentration
    missingEvidence: Partner-channel revenue share by partner type, top-partner concentration, fraud mix, and churn or retention by channel cohort.
    whyItMatters: The expanded partner programme may improve growth, but it could also concentrate exposure in higher-risk channels or merchants without the public record showing the trade-off.
    diligencePath: Review partner P&L by channel, top-partner exposure, underwriting policies, and loss experience for referred merchants.
    relatedQuestionRefs:
    - QR013
    - QR015
    - QR024
    relatedTableRefs:
    - TR003
