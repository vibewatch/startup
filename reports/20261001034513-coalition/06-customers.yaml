company:
  name: "Coalition"
chapter:
  number: 6
  title: "Customers"
  summary: "Coalition claims more than 100,000 clients and a 73% lower claims experience, but the assigned public evidence does not expose the metric methodology, active-policy denominator, renewal rates, or customer concentration. The strongest current expansion signal is Allianz Commercial's announced, phased transfer of its commercial cyber business under a minimum ten-year partnership, while only one target-company customer story is named in the prefetched evidence."
sections:
  - id: "customer-segments-and-buyers"
    title: "Customer Segments and Buying Surfaces"
    body: >-
      Public evidence supports four distinct constituencies rather than one homogeneous
      customer base. Coalition Insurance Company was launched with policies intended for
      small and midsize businesses that often lack their own cyber-risk tools, establishing
      an SMB insurance segment. Coalition's homepage separately promotes Broker IQ as a
      quoting, training, and sales-material surface for brokers, so brokers are distribution
      users rather than the insured end customer. The Allianz agreement adds commercial
      customers across all segments through an announced portfolio transition, but the
      release does not quantify transferred policyholders or premiums. Wirespeed's support
      role describes technical and non-technical customer interactions around incidents and
      product issues, indicating a security-product user surface alongside insurance.
      Neither buyer titles, segment revenue mix, nor payer-versus-user splits are disclosed
      in the assigned evidence, so those fields should be obtained from account and policy
      data rather than inferred from product positioning.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU001"
  - id: "adoption-scale-and-outcomes"
    title: "Adoption Scale and Outcome Claims"
    body: >-
      Coalition's homepage states that it has more than 100,000 clients and that
      policyholders experience 73% fewer claims. These are company claims, not independently
      verified cohort measures: the fetched page does not define whether the client count is
      active policies, organizations, security-product users, or cumulative relationships,
      and the claims comparison omits the baseline population, observation period, and loss
      definition. The Allianz transaction is a stronger external signal of prospective
      distribution scale, but it remains a phased rollout subject to regulatory and customary
      approvals. Allianz says Coalition will assume primary responsibility for pricing,
      product development, risk mitigation, and claims management while Allianz supplies
      resources and distribution. That arrangement may accelerate adoption, yet the source
      provides no transferred-policy count, gross written premium, activation schedule, or
      realized retention result. Adoption should therefore be treated as commercially
      credible but quantitatively under-specified.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU007"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-proof-and-evidence-quality"
    title: "Named Customer Proof and Evidence Quality"
    body: >-
      Named proof is materially thinner than the aggregate scale claim. Coalition's knowledge
      center names centrexIT in a Wirespeed ADR customer story and describes closing security
      gaps and expanding analyst capacity, but the index text does not disclose contract
      scope, production dates, deployment size, or quantified outcomes. CaseStudies.com points
      the other direction: it presents Coalition itself as the customer of vendors such as
      Census, so it is evidence about Coalition's internal tooling and must not be counted as
      evidence that another organization buys Coalition's product. One assigned net-new result
      concerns Coalition Technologies, an unrelated digital-marketing agency; its case studies
      cannot be attributed to Coalition, Inc. This entity collision materially reduces the
      usable named-customer set and demonstrates why search-result logos and similarly named
      firms require issuer-level verification before inclusion.
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-concentration"
    title: "Durability, Expansion, and Concentration"
    body: >-
      The public record supports a channel-led expansion mechanism but not customer durability.
      Broker IQ can support broker acquisition and repeat quoting, while the Wirespeed support
      model can sustain post-sale product usage through investigation, escalation, and
      follow-up. On the capacity side, a company-issued role description says Coalition
      operates through insurers and reinsurers that delegate underwriting authority and
      require data sharing, audits, contractual compliance, and internal product support.
      Allianz's minimum ten-year agreement may stabilize one major relationship, but exclusivity,
      equity participation, board representation, and reliance on Allianz distribution also
      create a material partner concentration to test. No assigned source reports gross
      retention, net revenue retention, policy renewal, broker concentration, top-customer
      share, contract length by customer, or expansion revenue. A diversified client count
      cannot substitute for those denominators, and the absence of public figures is recorded
      as a diligence gap rather than evidence of strong retention.
    claimRefs:
      - "CU006"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
