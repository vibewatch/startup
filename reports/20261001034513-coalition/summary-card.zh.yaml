  topStrengths:
    - 独特的“主动型保险”（active insurance）模式，把核保、持续监控和事故应急响应连成一体。
    - 历史累计融资体量可观，并以 $5 billion 估值作为锚点。
    - 承保牌照与再保险布局持续扩张，扩大了运营掌控力和渠道触达面。
  topRisks:
    - 当前经审计财务数据、现金及单客经济模型均未披露。
    - Allianz 合作及再保险的经济模型目前仍只有部分细节可见。
    - 历史宣传指标不能直接等同于当前实际运营规模。
  unresolvedGaps:
    - 再保险合约结构：起赔点（attachment point）、总限额、交易对手方及恢复保额条款均完全未披露。
    - 分客群赔付率：中小企业自营业务与 Allianz 转入的企业级业务之间的表现差异，是验证投资逻辑最关键的财务未知项。
    - 年度投保人续保率与 GRR：缺少留存数据，便无法验证 GWP 规模的持久性。
    - Allianz 合作协议核心条款：排他期、退出条款、收入分成与控制权变更触发条件均未披露。
    - 当年 GWP 与未来收入走势：只要公开一年的 GWP 数据，估值情景区间就会大幅收窄。
