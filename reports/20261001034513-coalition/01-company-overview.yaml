company:
  name: "Coalition"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Coalition is a San Francisco-headquartered cyber insurance and security company founded in
    2017 by Joshua Motta and John Hering. Public evidence supports its historical $5 billion
    Series F valuation and expanding carrier, reinsurance, and Allianz partnership footprint,
    but current audited financials, a current valuation, full governance records, and independent
    adverse evidence remain unavailable in the assigned source pool.
sections:
  - id: "identity-product-and-scale"
    title: "Identity, Product Model, and Public Scale"
    body: >-
      Coalition combines commercial cyber insurance with cybersecurity monitoring, alerts,
      incident response, and risk-management tools, a model the company calls Active Insurance.
      Coalition's 2022 Series F announcement and EquityZen both identify Joshua Motta and John
      Hering as the founders, place founding in 2017, and locate the headquarters in San
      Francisco. Scale evidence needs strict dating: the July 2022 company announcement reported
      more than 160,000 customers and more than $775 million of run-rate gross written premium,
      while the undated homepage viewed on the run date displays only "100k+ clients." The latter
      does not establish a decline because the labels, measurement dates, and populations are not
      reconciled. Gross written premium is an insurance volume measure, not revenue or ARR, and
      no current audited revenue or headcount figure appears in the retained evidence.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO008"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "leadership-capital-and-control"
    title: "Leadership, Capital, and Control Surfaces"
    body: >-
      Joshua Motta remains the only executive consistently identified across the reviewed company,
      partner, and private-market pages: he is co-founder, chief executive officer, and a board
      member. Nasdaq Private Market also lists Shardul Shah and Julie Richardson as board members,
      while EquityZen identifies Doug Ireland as Head of Finance; the assigned evidence does not
      provide a complete current executive or board roster. Capital disclosures are similarly
      historical. Coalition said its June 2022 Series F raised $250 million at a $5 billion
      valuation and brought cumulative equity funding above $755 million. Nasdaq Private Market
      instead lists $221 million for a June 24, 2022 Series F entry, so the round amount is
      preserved as a conflict rather than harmonized. The current cap table, preference stack,
      debt, cash balance, and fully diluted ownership remain private.
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "operating-milestones-and-diligence-implications"
    title: "Operating Milestones and Diligence Implications"
    body: >-
      Coalition has broadened its role in the insurance value chain. A company-issued release
      syndicated by Business Wire announced Coalition Insurance Company in January 2023 and said
      the carrier had received an A- rating from A.M. Best. Coalition then announced Coalition Re
      in September 2024, offering non-proportional cyber reinsurance and a white-labelled product
      backed by an Aspen-led capacity panel. In May 2026 Allianz announced a minimum ten-year
      strategic agreement under which Coalition would assume primary responsibility for pricing,
      product development, risk mitigation, and claims management for Allianz's standalone
      commercial cyber portfolio. That agreement was still subject to regulatory and customary
      approvals, and its financial consideration was not disclosed. The milestones expand
      distribution and governance dependence on Allianz, but they do not by themselves establish
      profitability, cash availability, or the economics of transferred business.
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO016"
    figureRefs:
      - "FO001"
