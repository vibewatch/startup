callouts:
  - calloutType: "insight"
    title: "Broader insurance-stack control"
    body: >-
      The carrier launch, Coalition Re, and the announced Allianz portfolio transition indicate
      expansion from distribution and risk tooling into underwriting, reinsurance, and claims
      responsibilities. The public announcements do not disclose the resulting revenue, capital,
      reserve, or loss-ratio economics.
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
  - calloutType: "risk"
    title: "Historical headline metrics are not current financial proof"
    body: >-
      The $5 billion valuation, $755 million-plus equity total, 160,000 customers, and $775
      million-plus run-rate GWP all come from a July 2022 company announcement. They should not
      be treated as current valuation, cash available, current customer count, revenue, or ARR.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO007"
      - "CO008"
      - "CO014"
