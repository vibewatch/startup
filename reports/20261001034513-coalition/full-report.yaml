      - number: '6.3'
        title: Named Customer Proof and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              Named proof is materially thinner than the aggregate scale claim. Coalition's knowledge center names
              centrexIT in a Wirespeed ADR customer story and describes closing security gaps and expanding analyst
              capacity, but the index text does not disclose contract scope, production dates, deployment size, or
              quantified outcomes. CaseStudies.com points the other direction: it presents Coalition itself as the
              customer of vendors such as Census, so it is evidence about Coalition's internal tooling and must not be
              counted as evidence that another organization buys Coalition's product. One assigned net-new result
              concerns Coalition Technologies, an unrelated digital-marketing agency; its case studies cannot be
              attributed to Coalition, Inc. This entity collision materially reduces the usable named-customer set and
              demonstrates why search-result logos and similarly named firms require issuer-level verification before
              inclusion.
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Durability, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              The public record supports a channel-led expansion mechanism but not customer durability. Broker IQ can
              support broker acquisition and repeat quoting, while the Wirespeed support model can sustain post-sale
              product usage through investigation, escalation, and follow-up. On the capacity side, a company-issued
              role description says Coalition operates through insurers and reinsurers that delegate underwriting
              authority and require data sharing, audits, contractual compliance, and internal product support.
              Allianz's minimum ten-year agreement may stabilize one major relationship, but exclusivity, equity
              participation, board representation, and reliance on Allianz distribution also create a material partner
              concentration to test. No assigned source reports gross retention, net revenue retention, policy renewal,
              broker concentration, top-customer share, contract length by customer, or expansion revenue. A diversified
              client count cannot substitute for those denominators, and the absence of public figures is recorded as a
              diligence gap rather than evidence of strong retention.
            claimRefs:
              - CU006
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported Scale Does Not Establish Retention
            body: >-
              The 100k+ client statement is an undenominated company claim. Without active-policy definitions, cohort
              renewals, GRR, NRR, and churn, it cannot establish customer-base durability or lifetime value.
            calloutType: risk
            claimRefs:
              - CU001
              - CU015
          - type: callout
            title: Allianz Is an Expansion Engine and a Concentration Question
            body: >-
              The minimum ten-year global arrangement can widen distribution and supply capacity, but its exclusivity,
              approval dependencies, economics, and termination protections must be tested before treating it as
              de-risked growth.
            calloutType: insight
            claimRefs:
              - CU004
