              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Premium Ingestion, and Commission Economics
        blocks:
          - type: paragraph
            body: >-
              Coalition functions primarily as a managing general agent (MGA) and tech-enabled cyber risk platform,
              complementing delegated authority with its own admitted carrier, Coalition Insurance Company (CIC). Its
              monetization engine relies on three principal cash generation mechanisms: delegated underwriting
              commissions on gross written premium (GWP) sourced on behalf of capacity partners, direct underwriting
              risk margin retained via CIC, and cybersecurity software and incident response services delivered through
              Coalition Incident Response and the Wirespeed threat detection platform. Historical disclosures indicated
              a $325M gross written premium run-rate in September 2021, representing an 800% year-over-year surge from
              approximately $100M in late 2020 and $50M in 2019 [CI001, CI002]. Because Coalition historically delegated
              balance sheet capacity to reinsurance partners such as Swiss Re, Arch Insurance North America, and Lloyd's
              syndicates, top-line gross premiums do not translate dollar-for-dollar into corporate GAAP revenue [CI003,
              CI007]. Instead, MGA operational revenue consists of base ceding commissions (typically 12% to 20% of
              written premium in cyber casualty lines), contingent profit-sharing commissions contingent on favorable
              loss ratio development, and risk assessment platform fees [CI004, CI009]. In May 2026, Allianz Commercial
              entered into an exclusive 10-year global cyber agreement to transition its standalone commercial cyber
              portfolio to Coalition, designating Coalition as primary manager of pricing, risk mitigation, and claims
              while granting Allianz performance-based returns and director nomination rights [CI005, CI006]. This
              institutional alliance secures massive multi-year distribution capacity but locks economic alignment to
              long-term book profitability [CI005].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI009
      - number: '4.2'
        title: Go-to-Market Economics, Sales Efficiency, and Operational Cost Drivers
        blocks:
          - type: paragraph
            body: >-
              Coalition's distribution framework operates predominantly through independent wholesale and retail
              insurance brokerage networks across the United States, Canada, the United Kingdom, and Australia [CI003,
              CI005]. Wholesale and retail brokers distribute Coalition Active Insurance policies into small and midsize
              enterprise (SMB) cohorts as well as mid-market accounts, supported by the Broker IQ quoting portal [CI008,
              CI011]. The primary customer acquisition cost (CAC) component is broker commission expense, which consumes
              10% to 15% of gross premium, substantially reducing initial sales cycle friction compared to enterprise
              SaaS direct sales motions [CI004, CI009]. On the operational cost side, Coalition's cost structure
              diverges significantly from traditional pure-software businesses. Beyond standard cloud infrastructure
              hosting expenses for continuous internet scanning, Coalition carries technical headcount for threat
              intelligence, security engineering, and 24/7 dedicated in-house incident response [CI008, CI010].
              Corporate records indicate an expanding workforce growing from 270 employees in late 2021 to 540 employees
              in late 2024 and 704 reported personnel by late 2026 across distributed hubs [CI002, CI010]. Service
              delivery costs are heavily impacted by claims handling personnel, legal forensic retainers, and the
              capital requirements of holding underwriting authority across multiple state and international
              jurisdictions through entities like Coalition Insurance Solutions and CIC [CI007, CI010].
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI011
              - CI012
      - number: '4.3'
        title: Capital Adequacy, Loss Ratios, and Private Metric Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Coalition's true financial standing requires untangling balance sheet capitalization from
              cumulative venture equity. Across eight funding rounds and secondary placements, Coalition has raised
              between $785M and $800M in equity financing, culminating in a $5.0B post-money valuation at its July 2022
              Series F round, followed by strategic capital injections from Mitsui Sumitomo Insurance ($30M in March
              2025) and Allianz in May 2026 [CI001, CI005, CI010, CI012]. While this extensive liquidity provides
              substantial operational runway for tech development and global market expansion, it is structurally
              distinct from insurance underwriting reserves [CI001, CI007]. Full-stack carrier CIC requires regulatory
              risk-based capital (RBC) and unearned premium reserves held in trust, creating working capital lockups
              that pure software firms avoid [CI007]. Crucially, private company opacity obscures Coalition's true loss
              ratios, reinsurance treaty attachment points, and net retention rates [CI013, CI014]. Although Coalition
              claims policyholders experience 70% to 73% fewer claims than industry averages due to automated
              vulnerability alerting and automated patch scanning, independent audited proof of loss ratios across
              mature underwriting cohorts remains unavailable in public records [CI002, CI008, CI014]. For underwriting
              diligence, private metric opacity on treaty ceding commissions, catastrophic reinsurance reinstatement
              costs, and gross retention constitutes a material diligence barrier [CI013, CI014].
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI007
              - CI008
              - CI010
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI008
              - CI010
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: MGA Revenue Model Disconnect from Premium Scale
            body: >-
              Outside observers often conflate Coalition's gross written premium run-rate ($325M reported in 2021) with
              recognized corporate software revenue. As a managing general agent sharing risk with global reinsurers,
              Coalition's GAAP revenue represents commission percentages and service fees, meaning operating cash flow
              is heavily sensitive to treaty commission terms and loss ratio performance rather than pure top-line
              policy volume [CI001, CI003, CI004].
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: callout
            title: Capital Allocation Friction Between Carrier Risk and SaaS Multiple
            body: >-
              By launching Coalition Insurance Company (CIC) and maintaining admitted insurance carrier operations,
              Coalition straddles two conflicting valuation regimes. Software investors value recurring high-margin ARR
              at technology multiples, whereas insurance regulators mandate capital surplus reserves and unearned
              premium lockups that restrict capital return and increase balance sheet exposure during catastrophic cyber
              systemic events [CI001, CI007, CI013].
            calloutType: risk
            claimRefs:
              - CI001
              - CI007
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Active Insurance Model & Customer Workflow Definition
        blocks:
          - type: paragraph
            body: >-
              Coalition defines its product offering as Active Insurance, an operating model that combines comprehensive
              cyber insurance underwriting with automated perimeter monitoring, risk assessment, and incident response
              services. Traditional commercial cyber insurance operates on a passive claims-reimbursement model where
              underwriters evaluate static annual questionnaires and assess damages only after an intrusion occurs. In
              contrast, Coalition's Active Insurance platform continuously scans external corporate attack surfaces,
              flagging emerging software vulnerabilities, misconfigured cloud ports, and unpatched perimeter services
              before malicious actors exploit them. According to company disclosures, policyholders participating in
              active monitoring experience seventy-three percent fewer claims relative to industry averages. Insurance
              protection is delivered through admitted and surplus lines paper, including Coalition Insurance Company,
              an admitted carrier holding an A- rating from A.M. Best. By bundling risk engineering telemetry directly
              into the insurance contract, Coalition seeks to turn cyber loss prevention from an annual audit into an
              ongoing, real-time operational feedback loop across small and mid-sized enterprises.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE006
      - number: '5.2'
        title: Product Line Portfolio & Broker Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Coalition's product and service portfolio spans policyholder risk management, insurance carrier paper, and
              broker distribution tooling. For policyholders, the primary interaction surface is the Active Risk
              Platform and Coalition Security, which deliver continuous perimeter vulnerability scanning, actionable
              remediation advisories, and 24/7 access to in-house incident response and digital forensics teams. For
              distribution partners, Coalition provides Broker IQ, a digital underwriting portal enabling independent
              brokers to generate automated bindable quotes in minutes rather than days. Operational responsibility is
              further broadened through major carrier partnerships, notably an expanded long-term global agreement with
              Allianz Commercial announced in May 2026. Under this multi-year collaboration, Coalition takes primary
              responsibility for pricing, product development, risk mitigation, and claims management for Allianz's
              standalone commercial cyber insurance portfolio across markets including the United States, United
              Kingdom, Australia, Germany, Denmark, and Sweden. This distribution motion integrates third-party broker
              sales into Coalition's proprietary digital binding workflow.
            claimRefs:
              - CE001
              - CE002
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE007
      - number: '5.3'
        title: Enterprise Data Architecture & Technical Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Coalition's technical operating infrastructure relies on a hybrid architecture bridging cloud-native data
              engineering with complex insurance balance sheet vehicles. The data platform is built upon a modern data
              stack centered on Snowflake and dbt, deploying governed Medallion pipeline architectures (bronze, silver,
              gold) to ingest, normalize, and transform high-velocity security scan telemetry alongside historical
              insurance loss runs. Batch and streaming ingestion workflows utilize technologies such as Kafka, Kinesis,
              and orchestration frameworks to process telemetry at scale, powering actuarial modeling, underwriting
              automation, and machine learning feature stores for risk scoring and RAG-driven analytical workflows. On
              the balance sheet side, Coalition operates as an MGA and full-stack carrier, deploying capacity across
              Coalition Insurance Company (CIC), captive risk vehicles, reinsurance sidecars, and delegated underwriting
              authority agreements from global reinsurance leaders such as Allianz, Arch Insurance, Ascot Group, and
              Swiss Re Corporate Solutions. Enterprise data governance controls enforce role-based access control
              hierarchies, column-level masking, and PII tokenization across all regulated financial and policyholder
              environments.
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
