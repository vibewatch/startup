              cyber-insurance CAGR. Coalition's homepage supplies a current company scale indicator of more than 100,000
              clients, and Allianz names six initial rollout markets, but neither measure is a market denominator or
              obtainable-spend estimate. The only numerical market forecast in the allocated pool is for C2PA
              content-provenance solutions, a different category, while another net-new result concerns an AI compute
              coalition. Those values are explicitly excluded rather than repurposed. Valuation work should therefore
              treat market size as an open diligence item and use policy count, premium, retention, loss ratio, and
              geography-specific eligibility data for a bottom-up model.
