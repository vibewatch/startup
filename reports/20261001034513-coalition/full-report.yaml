              - CE003
              - CE004
              - CE005
              - CE008
      - number: '5.4'
        title: Technical Differentiation, Governance & Key Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Coalition's technological differentiation centers on its proprietary scanning telemetry and tightly
              integrated claims feedback loop, which enable faster quoting and proactive incident mitigation compared to
              legacy commercial carriers. Strategic carrier alliances, such as the expanded 2026 Allianz partnership,
              validate the scalability of Coalition's underwriting engine across multinational commercial lines. Broader
              organizational and defense research on technology alliances demonstrates that coordinating commercial
              technology platforms across institutional boundaries requires structured integration protocols and
              decision governance frameworks to prevent operational friction and sustain platform agility as product
              lines expand. Despite these operational strengths, significant technical and diligence gaps persist.
              Coalition's proprietary scanning algorithms, automated vulnerability detection rates, and scanning
              false-positive frequencies remain private and lack independent third-party audit verification.
              Furthermore, because external scans only evaluate public-facing perimeter assets, internal network threats
              such as lateral movement and credential theft cannot be directly assessed, leaving the true predictive
              power of Coalition's underwriting technology dependent on private claims data.
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Convergence of Telemetry and Balance Sheet Capacity
            body: >-
              Coalition's core technological differentiation lies in its tight coupling between real-time security
              telemetry and multi-vehicle insurance capacity, enabling automated underwriting and dynamic risk
              monitoring across admitted paper and global reinsurance treaties.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: Perimeter Scanning Blind Spots and Unverified Efficacy
            body: >-
              While Coalition claims a 73% claim reduction, external perimeter scanning cannot assess internal network
              lateral movement, and the underlying algorithms lack independent third-party audit validation, creating
              underwriting uncertainty during systemic exploit waves.
            calloutType: risk
            claimRefs:
              - CE002
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buying Surfaces
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports four distinct constituencies rather than one homogeneous customer base. Coalition
              Insurance Company was launched with policies intended for small and midsize businesses that often lack
              their own cyber-risk tools, establishing an SMB insurance segment. Coalition's homepage separately
              promotes Broker IQ as a quoting, training, and sales-material surface for brokers, so brokers are
              distribution users rather than the insured end customer. The Allianz agreement adds commercial customers
              across all segments through an announced portfolio transition, but the release does not quantify
              transferred policyholders or premiums. Wirespeed's support role describes technical and non-technical
              customer interactions around incidents and product issues, indicating a security-product user surface
              alongside insurance. Neither buyer titles, segment revenue mix, nor payer-versus-user splits are disclosed
              in the assigned evidence, so those fields should be obtained from account and policy data rather than
              inferred from product positioning.
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption Scale and Outcome Claims
        blocks:
          - type: paragraph
            body: >-
              Coalition's homepage states that it has more than 100,000 clients and that policyholders experience 73%
              fewer claims. These are company claims, not independently verified cohort measures: the fetched page does
              not define whether the client count is active policies, organizations, security-product users, or
              cumulative relationships, and the claims comparison omits the baseline population, observation period, and
              loss definition. The Allianz transaction is a stronger external signal of prospective distribution scale,
              but it remains a phased rollout subject to regulatory and customary approvals. Allianz says Coalition will
              assume primary responsibility for pricing, product development, risk mitigation, and claims management
              while Allianz supplies resources and distribution. That arrangement may accelerate adoption, yet the
              source provides no transferred-policy count, gross written premium, activation schedule, or realized
              retention result. Adoption should therefore be treated as commercially credible but quantitatively
              under-specified.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
