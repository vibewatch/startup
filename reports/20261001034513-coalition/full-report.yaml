      - number: '2.3'
        title: Buyer, user, payer, and capacity chain
        blocks:
          - type: paragraph
            body: >-
              The insured business is the economic payer and beneficiary, but adoption passes through several
              institutions. Brokers quote and place coverage; Coalition prices risk, develops products, supplies
              mitigation and incident response, and manages claims; insurers and reinsurers provide delegated authority
              and balance-sheet capacity. Coalition's capacity role spans partners, an admitted carrier, captives,
              sidecars, and reinsurance structures. For larger multinational accounts, Allianz contributes brand,
              distribution, local market access, underwriting support, and long-term capacity. This makes broker
              enablement, carrier compliance, auditability, data sharing, and reinsurance relationships adoption
              dependencies rather than back-office details.
