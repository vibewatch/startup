  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Coalition competes for commercial cyber-risk spend, not for every dollar spent on cybersecurity. Its own
              proposition combines cyber insurance coverage with monitoring, threat response, and security services,
              while its carrier materials describe admitted insurance capacity for small and midsize businesses. The
              relevant boundary therefore includes standalone commercial cyber insurance and the risk-mitigation
              services attached to underwriting and claims. It excludes unrelated content-provenance software, AI
              compute infrastructure, and financial-services benchmarking, despite those markets appearing in searches
              for the ambiguous word "Coalition." Status-quo substitutes include buying traditional insurance without
              active monitoring, assembling security tools separately, retaining risk, or relying on internal security
              and incident-response teams.
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM009
              - CM015
