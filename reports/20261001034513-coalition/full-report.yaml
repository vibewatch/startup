  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Active Insurance vs. Legacy Carriers and Pure-Play Cybersecurity'
        blocks:
          - type: paragraph
            body: >-
              The commercial cyber risk landscape divides into three distinct strategic models: incumbent
              property-and-casualty carriers, standalone cybersecurity software vendors, and technology-enabled active
              insurers. Incumbents such as Travelers, Chubb, and AXA XL control massive balance-sheet capacity and
              established broker networks, but their underwriting remains anchored in static annual questionnaires that
              fail to track vulnerabilities between policy renewal cycles. Conversely, pure-play cybersecurity vendors
              like CrowdStrike and SentinelOne provide deep endpoint telemetry and automated threat detection, yet they
              operate strictly as software licensors with zero financial risk transfer or balance-sheet indemnification.
              Coalition bridges this structural divide through its Active Insurance model, combining continuous external
              attack surface scanning with full-stack carrier licensing and delegated capacity to mitigate
              vulnerabilities before claims occur.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 'Capability and Feature Analysis: Automated Underwriting, Telemetry, and Incident Response'
        blocks:
          - type: paragraph
            body: >-
              Commercial buyers evaluate cyber insurance alternatives across four primary buying criteria: monitoring
              frequency, quoting speed, incident response integration, and balance-sheet capacity. Coalition provides
              real-time vulnerability detection through its proprietary Active Risk Platform, delivering automated
              security alerts directly to policyholders and brokers. This active approach drives a company-reported 73%
              reduction in claims frequency compared to industry averages. When security incidents occur, Coalition
              deploys in-house incident response personnel to contain breaches and recover funds, contrasting with
              legacy insurers who refer policyholders to third-party vendor panels subject to delayed deductible
              approvals. However, market evidence indicates that automation alone does not guarantee retention;
              responsive human expertise and client-facing service remain decisive factors when complex claims arise.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 'Pricing, Packaging, and Distribution: The Allianz Alliance and Carrier Capacity'
        blocks:
          - type: paragraph
            body: >-
              Distribution power and capacity access govern commercial cyber underwriting viability. In May 2026,
              Allianz Commercial and Coalition expanded their global partnership into a 10-year exclusive strategic
              agreement under which Allianz transitions its standalone commercial cyber portfolio across all commercial
              segments to Coalition. Under the transaction, Coalition assumes primary responsibility for pricing,
              product development, risk mitigation, and claims management, while Allianz provides long-term insurance
              capacity, extensive multinational distribution, and board-level governance. To diversify beyond delegated
              managing general agency (MGA) structures, Coalition established Coalition Insurance Company (CIC) as an
              admitted carrier with an A.M. Best rating of A-, enabling direct quote issuance alongside delegated
              capacity arrangements, captives, and sidecar reinsurance facilities.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Coalition's competitive moat rests on proprietary threat telemetry gathered across more than 100,000
              policyholders and multi-year capacity commitments. Unlike shared multi-brand coalition loyalty schemes
              where participants pool customer data with direct rivals at a 2% to 5% sales margin cost, Coalition
              operates a closed proprietary risk ecosystem that protects customer insights and pricing algorithms.
              Displacement threats stem primarily from two vectors: legacy carriers acquiring or partnering with
              specialized attack surface scanning vendors to mimic automated underwriting, and sophisticated enterprises
              opting for internal IT hardening paired with captive self-insurance. Furthermore, macroeconomic and
              systemic tail risks—such as correlated cloud outages or catastrophic cyber perils—test whether
              tech-enabled loss mitigation can withstand industry-wide loss events without exhausting reinsurance
              limits.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Allianz Commercial Alliance as a Strategic Distribution Moat
            body: >-
              The 10-year exclusive global cyber partnership between Allianz Commercial and Coalition fundamentally
              reshapes commercial cyber distribution. By transitioning Allianz's commercial cyber portfolio to
              Coalition, the agreement establishes Coalition as the primary underwriter across all commercial segments
              while securing long-term capacity and multinational distribution scale.
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
          - type: callout
            title: Proprietary Telemetry Protects Against Coalition Loyalty Pitfalls
            body: >-
              In contrast to shared coalition loyalty schemes where businesses share customer data with competitors at a
              2% to 5% sales margin cost, Coalition operates a closed risk ecosystem. By retaining proprietary claims
              and threat telemetry across 100,000+ policyholders, Coalition preserves pricing advantages without
              subsidizing rival insurers.
            calloutType: risk
            claimRefs:
