              - CV011
              - CV013
      - number: '8.2'
        title: 投资建议框架与融资沿革
        blocks:
          - type: paragraph
            body: >-
              我们给予 Coalition“建议深入研究（research-more）”评级，置信度为中等，风险等级为高，估值定性为合理（fair）[CV009, CV012]。公司的融资历程呈现出高速扩张态势：从 2018
              年的 $10M A 轮融资起步，到 2021 年 9 月以 $3.5B 估值完成 $205M E 轮融资，随后在 2022 年 6 月完成 $221M F 轮融资并将估值推升至 $5.0B [CV001,
              CV002, CV005]。来自 Forge Global 的二级市场定价情报显示，截至 2026 年 7 月，Coalition 在 G 轮投后基准估值达到 $5.29B，累计融资总额达 $1.05B，并在
              Nasdaq Private Market 保持活跃交易 [CV002, CV005]。在缺乏经审计的 GWP 数据及损失进展跟踪队列（loss development cohorts）的情况下，以超 $5B
              估值进行投资决策对风险敏感型资本尚显为时过早，应当保持审慎观望，直至数据室（data room）核验能确证其单体经济模型（unit economics）的健康可持续 [CV009, CV011, CV013]。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
