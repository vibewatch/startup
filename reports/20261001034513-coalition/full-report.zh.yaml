  - id: TV003
    title: 乐观、基准与悲观估值情景
    columns:
      - 情景
      - 估值区间
      - 核心经营假设
      - 回报与尽调含义
    rows:
      - - 乐观情景
        - $7.5B - $9.0B
        - 完美整合 Allianz 全球业务组合、赔付率持续保持在 60% 以下、准入承保机构 CIC 持续扩张
        - 较当前老股交易标价有 1.5x - 1.8x 上行空间；支撑以溢价开展 IPO
      - - 基准情景
        - $4.8B - $5.5B
        - SMB 市场稳步采用、GWP 年增长 15-25%、再保险承保能力成本保持稳定
        - 0.9x - 1.0x 回报；当前估值公允反映了技术与分销平台的价值
      - - 悲观情景
        - $2.5B - $3.5B
        - 系统性零日勒索软件浪潮推高赔付率、再保险承保能力收缩、增长放缓
        - 面临估值收缩 35-50% 的下调轮风险；优先权堆叠严重损害普通股价值
    notes: 情景区间以据报道的 $5.0B Series F 估值、Forge 二级市场预估 $5.29B，以及网络保险市场承保能力约束为对标基准。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV010
      - CV012
      - CV013
