  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Coalition
              争夺的是企业在商业网络风险领域的预算支出，而非全部网络安全预算。公司自身的产品定位是将网络保险保障与监控、威胁响应及安全服务相结合，同时其承保实体文件也表明公司为中小企业提供合规保单承保能力（admitted
              capacity）。因此，相关市场边界明确限定在独立商业网络保险以及嵌入核保与理赔环节的风险减损服务；必须剔除内容真实性追溯软件、AI
              算力基础设施以及金融服务基准测算等无关赛道——尽管这些领域在检索多义词“Coalition”时常会混入。现有的替代方案主要包括：购买无主动监控的传统保单、单独采购组合各类安全工具、企业自留风险，或仅依靠内部安全与事件响应团队。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM010
              - CM015
