  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Active Insurance 模式与客户业务流程定义
        blocks:
          - type: paragraph
            body: >-
              Coalition 将自身的产品体系定义为“主动型保险”（Active
              Insurance），该运营模式将全面的网络保险核保与自动化边界监控、风险评估及事件应急响应深度打通。传统商业网络保险采取的是被动式理赔报销模式：核保人员仅依据静态的年度问卷进行风险评估，且只有在企业遭受网络入侵后才介入定损理赔。与此形成鲜明对比的是，Coalition
              的 Active Insurance
              平台能够对企业外部攻击面开展不间断扫描，在不法分子实施攻击前精准标记新暴露的软件漏洞、云端配置错误端口及未修补的边缘服务。根据公司口径，纳入主动监控的投保企业出险率相比行业基准下降了
              百分之七十三。              其保单以合规保单（admitted paper）及超额保单（surplus lines paper）出具，其中包含获 A.M. Best 评定 A- 等级的自有持牌承保人
              Coalition Insurance Company。              Coalition
              把风险工程遥测指标直接绑进保险合同，试图将中小企业网络风险防范从低频的年度合规审计变成不间断的实时业务反馈闭环。
            claimRefs:
              - CE001
              - CE002
              - CE003
