    sections:
      - number: '1.1'
        title: 业务定位、产品模式与公开业务规模
        blocks:
          - type: paragraph
            body: >-
              Coalition 将商业网络安全险与网络安全监控、告警、事件响应及风险管理工具融为一体，公司将这种模式称为 Active Insurance。根据 Coalition 2022 年的 Series F
              融资公告以及 EquityZen 的记录，Joshua Motta 与 John Hering 为公司联合创始人，公司于 2017 年成立，总部设在旧金山。业务规模证据须严格锁定时间点：公司在 2022 年 7
              月的公告中披露拥有超过 160,000 家客户以及超过 $775 million 的签单保费运行率（run-rate GWP）；而尽调评估当日查阅的无日期官网页面仅标注 “100k+
              clients”。后者并不能证明客户数出现下滑，因为统计标签、统计日期与样本群体均未对齐。签单总保费属于保险业务规模指标，并非公司收入或 ARR，留存证据中也未出现当前经审计的收入或员工人数。
