      - number: '2.4'
        title: 普及驱动因素、制约瓶颈与估值关联度
        blocks:
          - type: paragraph
            body: >-
              Coalition 需求端最确凿的证据体现为渠道拓展：Allianz 将网络风险保障定义为高需求产品，并同意建立独家全球商业合作关系，分阶段推向不同区域，并锁定至少十年的利益绑定。此外，Coalition
              声称其投保客户出险率降低 73%；若该结论在可比对照组中获得独立验证，确实能显著改善买方 ROI
              与核保端经济效益。然而，现有资料并未披露该结论的分母基数、观察周期、对照组设置或独立测算方法。监管审批流程、转授权合规审查、承保能力供给、审计要求以及对经纪人和承保公司渠道的高度依赖，均可能延缓业务渗透节奏。在缺乏保费规模、客户留存、实际赔付率及续保表现等客观证据的前提下，上述驱动因素仅能支撑其战略重要性，不足以折算为精准的估值溢价。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM014
