      - number: '4.2'
        title: GTM 获客模型、销售效率与核心营运成本构成
        blocks:
          - type: paragraph
            body: >-
              Coalition 的分销网络主要依托遍布美国、加拿大、英国和澳大利亚的独立批发与零售保险经纪渠道 [CI003, CI005]。借助 Broker IQ 智能报价门户，批发与零售经纪人将 Coalition
              Active Insurance 保单推向中小型企业（SMB）以及中端市场（mid-market）客户 [CI008, CI011]。             
              其获客成本（CAC）的核心是经纪人佣金支出，通常占总保费的 10% 至 15%；相较于企业级 SaaS 的直销模式，这种机制大幅缩短了早期销售周期的转化阻力 [CI004,
              CI009]。看营运成本结构，Coalition 与传统纯软件企业截然不同。除用于全网扫描的常规云基础设施托管支出外，Coalition 还需负担威胁情报、安全工程以及 24/7
              小时常驻内部事件响应团队的技术人员薪酬 [CI008, CI010]。工商记录显示，其分布于多地的团队规模不断扩张，从 2021 年底的 270 人增长至 2024 年底的 540 人，到 2026
              年底据披露在册人员已达 704 人 [CI002, CI010]。              此外，理赔调查人员开支、外部法律取证聘约费用，以及 Coalition Insurance Solutions 和
              CIC 等实体在美各州及海外多辖区持有核保资质所产生的法定资本占用，均对服务履约成本形成显著推升 [CI007, CI010]。
