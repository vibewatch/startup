        - 覆盖超 100k 家客户的扫描基础设施，与持牌准入承保实体 CIC 协同
        - 投保人理赔频率趋近行业平均水平（反方观点），或监控平台发生重大安全事故
      - - 战略分销
        - 与 Allianz Commercial 达成独家全球网络保险合作，撬动全球化业务规模
        - 为期至少 10 年的合作，将 Allianz 商业网络保险组合全面迁移至 Coalition 平台
        - Allianz 条约提前终止，或未能在全球各司法管辖区获得监管审批
      - - 承保不透明度
        - 完全缺少公开分群赔付率，掩盖了保单组合真实的损失演进趋势
        - 公司称理赔量减少 70-73%，但未提供经审计的法定综合成本率
        - 商业账簿披露的综合成本率超过 105%，或发生严重系统性网络损失事件
      - - 融资与估值
        - 此前 $5.0B-$5.29B 私募估值在未披露 GAAP 利润率的前提下，提前计入了完美增长预期
        - Forge Global 2026 年 7 月标价为 $5.29B，累计融资达 $1.05B
        - 下调轮重组，或投资者清算优先权负担超过股权价值
    notes: 逻辑维度评估涵盖技术差异化、分销规模、承保耐久性以及一级市场估值标价。
    claimRefs:
