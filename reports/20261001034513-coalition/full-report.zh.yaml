  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Coalition
              争夺的是企业在商业网络风险上的支出，而非整个网络安全领域的每一分钱。公司核心价值主张将网络保险保障与安全监控、威胁响应及安全服务紧密打包；其承保机构资料则明确面向中小企业提供持牌承保能力。             
              因此，市场边界仅涵盖独立的商业网络安全险，以及随承保和理赔环节提供的风险缓解服务。该边界排除了内容来源验证软件、AI 算力基础设施以及金融服务对标评测——尽管搜索歧义词 “Coalition”
              时会出现这些市场。现状替代方案包括：采购缺乏主动监控的传统保单、自行拼接多门类安全工具、完全自留风险，或仅依赖内部安全与应急响应团队。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM010
              - CM015
