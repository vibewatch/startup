  - id: TV001
    title: 投资建议概要
    columns:
      - 维度
      - 立场 / 评级
      - 分析依据
      - 投资启示
    rows:
      - - 投资建议
        - 深入调研
        - 主动保险技术护城河被赔付率与财务数据披露缺失所抵消
        - 维持现有立场；在未获得经审计损失三角形前不配置新增一手资本
      - - 置信度
        - 中
        - 对企业版图及 Allianz 联盟高度确信；GAAP 单位经济能见度偏低
        - 尽职调查须聚焦客群队列留存表现与再保险条约自留条款
      - - 风险评级
        - 高
        - 灾难性系统性网络风险敞口叠加偏高的一级市场估值倍数
        - 要求明确清算优先权并落实下行情景保护条款
      - - 估值立场
        - 合理
        - 鉴于 Allianz 规模，$5.0B Series F 与 $5.29B Forge 二级市场标价反映了合理的战略价值
        - 在支持任何溢价轮次入场前，须要求确认经审计 GWP 运行率
    notes: 投资建议与风险评级综合了一级市场估值标价、战略承保能力协议，以及经审计保险损失指标固有的结构性不透明度。
    claimRefs:
      - CV002
      - CV004
      - CV009
      - CV011
      - CV012
  - id: TV002
    title: 投资论点与反向论点矩阵
    columns:
      - 维度
      - 核心论点
      - 支持性证据
      - 论点失效触发因素
    rows:
      - - 市场与产品护城河
        - 主动保险平台动态检测并缓解威胁，公司自述能降低投保人索赔率
        - 覆盖超10万客户的扫描基础设施，并结合持牌许可承保实体 CIC
        - 投保人出险频率收敛至行业平均水平（推翻低索赔说法），或监控平台出现重大安全事故
      - - 战略分销
        - 与 Allianz Commercial 的独家全球网络保险合作打开全球规模空间
        - 至少10年期合作伙伴关系，将 Allianz 商业网络保险组合迁移至 Coalition 平台
        - Allianz 条约提前终止，或未能在全球相关司法管辖区获得监管批准
      - - 承保不透明度
        - 完全缺乏公开的客群队列赔付率，掩盖了真实的资产组合损失演变
        - 公司声称索赔发生率减少 70-73%，但未提供经审计法定综合成本率
        - 商业险账面披露的综合成本率超过 105%，或发生严重系统性网络损失事件
      - - 融资与估值
        - 此前 $5.0B-$5.29B 一级市场估值计入了完美增长预期，却未披露 GAAP 利润率
        - Forge Global 2026年7月标价为 $5.29B，累计融资额为 $1.05B
        - 发生估值缩水轮重组，或投资者清算优先权积压超过股权价值
    notes: 论点维度评估了技术差异化、分销规模、承保韧性以及一级市场估值标价。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: 牛市 / 基准 / 熊市估值情景
    columns:
      - 情景
      - 估值区间
      - 核心运营假设
      - 回报与尽调启示
    rows:
      - - 乐观情景
        - $7.5B - $9.0B
        - 完美整合 Allianz 全球业务组合、维持低于 60% 赔付率、持牌承保人 CIC 顺利扩张
        - 较当前二级市场标价有 1.5x - 1.8x 上行空间；支撑溢价 IPO 上市
      - - 基准情景
        - $4.8B - $5.5B
        - SMB 市场稳步渗透、GWP 年增长 15-25%、再保险承保能力成本保持稳定
        - 0.9x - 1.0x 回报；当前估值合理反映了技术与分销平台价值
      - - 悲观情景
        - $2.5B - $3.5B
        - 系统性零日勒索软件潮推高赔付率、再保险承保能力收缩、增长放缓
        - 存在估值缩水 35-50% 的下行轮风险；清算优先权积压严重侵蚀普通股价值
    notes: 情景区间以据报道的 $5.0B Series F 估值、Forge 二级市场预估的 $5.29B 以及网络保险市场承保能力制约为基准。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV010
      - CV012
      - CV013
