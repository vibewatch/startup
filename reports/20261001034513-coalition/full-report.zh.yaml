      - number: '3.4'
        title: 护城河持久度、转换成本与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Coalition 的竞争护城河建立在覆盖逾 100,000 家投保企业积累的专有威胁遥测数据，以及锁定的多年期承保资本承诺之上。跨品牌积分忠诚度联盟往往让参与商家拿出 2% 至 5%
              的销售利润率成本来换取客户数据共享给直接竞对；Coalition
              运营着一个封闭专有的风险生态系统，严密护住自身的客户画像洞察与定价算法。其面临的被替代威胁主要来自两个方向：一是传统承保商收购或结盟专业的外部攻击面扫描厂商，照着搭建自动化核保；二是具备成熟技术能力的大型企业加固内部
              IT
              防御加固配合自保公司（captive）实施风险自留。此外，系统性长尾风险（如大范围公有云宕机或灾难性网络灾害连锁冲击）将持续考验：技术驱动的减损手段在遭遇全行业巨额出险事件时，是否会在耗尽再保险限额之前真正发挥作用。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
