      - number: '3.5'
        title: 附图与附表
        blocks:
          - type: callout
            title: Allianz Commercial 联盟构成战略级渠道护城河
            body: >-
              Allianz Commercial 与 Coalition 达成的 10 年期独家全球网络险合作，从根本上重塑了商业网络险的分销格局。Allianz 将商业网络险业务全面交接给 Coalition
              后，该协议不仅确立了 Coalition 跨所有商业细分市场的核心承保人地位，还为其锁定了长周期的承保资本和跨国分销体量。
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
          - type: callout
            title: 专有遥测数据避免落入传统联盟积分体系的陷阱
            body: >-
              联盟忠诚度计划往往让企业拿出 2% 至 5% 的销售利润率成本，与竞争对手共享客户数据；Coalition 则运营着一个完全闭环的风险生态体系。Coalition 沉淀并独占公司自述的 100,000+
              投保客户理赔与威胁遥测数据，在维持自身风险定价优势的同时，避免反向补贴竞争对手承保商。
            calloutType: risk
            claimRefs:
              - CP001
              - CP014
              - CP016
  - number: 4
    title: 财务与商业表现
    sections:
      - number: '4.1'
        title: 收入模型、保费吸纳与佣金经济学
        blocks:
          - type: paragraph
            body: >-
              Coalition 核心作为授权总代理（MGA）及技术驱动型网络风险平台运作，在第三方承保授权的基础上，辅以自建的持牌承保机构 Coalition Insurance
              Company（CIC）。其变现引擎依赖三大核心造血支柱：代表承保伙伴获取签单总保费（GWP）所抽取的承保分保佣金、CIC 自留的直接承保风险利差，以及 Coalition Incident Response 和
              Wirespeed 威胁探测平台交付的网络安全软件与应急响应服务。历史披露数据显示，公司在 2021 年 9 月实现 $325M 的年化 GWP 运行率，较 2020 年底的约 $100M 和 2019 年的
              $50M 同比激增 800% [CI001, CI002]。由于 Coalition 历史上主要将资产负债表风险让渡给 Swiss Re、Arch Insurance North America
              以及劳合社（Lloyd's）辛迪加等再保险伙伴，顶层 GWP 无法按一比一换算为公司的 GAAP 营业收入 [CI003, CI007]。相反，MGA 模式的实际业务收入由基础分保佣金（网络责任险通常为签单保费的
              12% 至 20%）、与优异赔付率挂钩的浮动利润分成，以及风险评估平台服务费构成 [CI004, CI009]。2026 年 5 月，Allianz Commercial 签署了一项为期 10
              年的全球独家网络险协议，将其独立商业网络险存量与增量资产全线交接给 Coalition，联合声明指定 Coalition 全面主导风险定价、风险缓解与理赔管理，同时赋予 Allianz
              挂钩业绩的表现回报及董事提名权 [CI005, CI006]。这一巨头结盟锁定了庞大的跨年度分销承保能力，但也将双方经济利益与整个保单资产组合的长期承保盈利水平牢牢捆绑 [CI005]。
