  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 营收模式、保费归集机制与佣金经济模型
        blocks:
          - type: paragraph
            body: >-
              Coalition 的核心业务架构主要为管理总代理（MGA）兼技术型网络风险平台，并借助自有合规承保实体 Coalition Insurance
              Company（CIC）作为转授权额度的有力补充。其盈利引擎依托三大现金流创造机制：一是代承保出资方获取保费并抽取的总签单保费（GWP）转授权核保佣金；二是依托 CIC
              留存的直接核保风险利润（underwriting margin）；三是通过 Coalition Incident Response 及 Wirespeed
              威胁检测平台提供的网络安全软件与事件应急响应服务。历史披露数据显示，其在 2021 年 9 月的年化 GWP 达到 $325M，较 2020 年底的约 $100M 及 2019 年的 $50M 实现了 800%
              的同比爆发式增长 [CI001, CI002]。由于 Coalition 在历史上主要依赖 Swiss Re、Arch Insurance North America 以及 Lloyd's
              辛迪加等再保险合作方承担资产负债表风险，因此表端总签单保费并不能等额折算为公司 GAAP 营业收入 [CI003, CI007]。相反，MGA 模式的实际营运收入主要包括基础分保佣金（ceding
              commissions，在网络责任险领域通常为签单保费的 12% 至 20%）、与赔付率优良程度挂钩的浮动超额分红佣金，以及风险评估平台服务费 [CI004, CI009]。2026 年 5 月，Allianz
              Commercial 与 Coalition 订立为期 10 年的独家全球网络保险协议，官方公告称将其独立商业网络保险资产组合整体移交给 Coalition，由后者全权主导定价、风险防范与理赔管理，同时赋予
              Allianz 业绩关联回报及董事提名权 [CI005, CI006]。该机构联盟虽然锁定了庞大的多年期分销与承保能力，但也意味着其收益表现将与承保保单池的长期综合赔付表现深度捆绑 [CI005]。
