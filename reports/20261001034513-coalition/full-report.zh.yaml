              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河韧性、转换成本与潜在替代风险
        blocks:
          - type: paragraph
            body: >-
              Coalition 的竞争壁垒建立在覆盖逾 100,000 家投保企业的独家威胁遥测数据，以及多年期承保资金协议的基础之上。相较于成员企业需按销售额 2% 至 5%
              的毛利成本与直接竞品共享客户数据的跨品牌通用积分联盟，Coalition
              运作的是完全封闭的专有风险生态，能够严密保护客户洞察与定价算法模型。潜在替代威胁主要来自两个方向：一是传统承保商收购或结盟专业攻击面扫描厂商，复制自动化核保流程；二是技术实力雄厚的大型企业选择自行加固内部
              IT，并搭配自保公司（captive）实现风险自留。此外，宏观与系统性尾部风险（例如多点关联的云基础设施宕机或灾难性网络攻击）亦对公司形成严峻考验，检验技术驱动的风险减损能否在行业大面积暴雷时扛住压力，而不至于耗尽再保险赔付上限。
            claimRefs:
