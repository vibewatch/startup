  - id: FV001
    title: 投资建议逻辑流
    type: flow
    summary: 基于商业落地进展与财务不透明度的对比，导向继续研究投资建议的决策架构。
    data:
      nodes:
        - id: platform-scale
          label: 平台与承保能力规模
          description: 专有威胁监控与 CIC 承保实体运营保护超过 100,000 家投保人
        - id: strategic-alliance
          label: Allianz 独家合作
          description: 期限至少 10 年的全球协议，将 Allianz 网络安全承保业务全面迁移至 Coalition
        - id: private-valuation
          label: 私募估值基准
          description: 在累计融资 $1.05B 基础上，锚定 $5.0B Series F 估值与 $5.29B Forge 老股标价
        - id: financial-opacity
          label: 财务与精算不透明
          description: 完全未公开披露 GAAP 收入、综合赔付率或分群留存数据
        - id: diligence-prerequisites
          label: 尽调数据室核心要求
          description: 强制核验法定损失三角形、续保留存率以及再保险条约起赔限额
        - id: recommendation-decision
          label: 继续研究投资建议
          description: 有条件推进，要求在数据室中深入审查损失三角形与再保险条约
      edges:
        - from: platform-scale
          to: strategic-alliance
        - from: strategic-alliance
          to: private-valuation
        - from: private-valuation
          to: financial-opacity
        - from: financial-opacity
          to: diligence-prerequisites
        - from: diligence-prerequisites
          to: recommendation-decision
    approximationNotes: 将可观察到的商业与公司里程碑，与未公开财务指标对照，呈现其逻辑演进过程。
