              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: 客户黏性、业务扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开材料印证了渠道驱动的扩张路径，但未能证实终端客户的长期黏性。Broker IQ 能够赋能经纪人拓展客源与持续复报，Wirespeed
              的支持架构则靠事件研判、问题升级与跟进服务维系售后的产品使用。在承保能力端，公司发布的招聘信息显示其借助保险公司与再保机构运作；这些机构出具承保授权，并要求数据互通、审计复核、合同合规以及内部产品支持。Allianz
              至少 10 年的长期协议或许能稳固这一核心合作关系，但其独家属性、股权投资、董事会席位以及对 Allianz
              分销网络的重度依赖，也带来了必须深入尽调的核心合作伙伴集中度风险。已审阅材料均未披露毛留存率（GRR）、净收入留存率（NRR）、保单续保率、经纪人集中度、头部客户占比、单客合同周期或净增扩张收入。宽泛的客户总数无法替代上述关键分母指标，公开数据的缺失应如实记录为尽调断点，而非客户黏性强劲的佐证。
            claimRefs:
              - CU006
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 附图与附表
        blocks:
          - type: callout
            title: 宣称的客群规模无法证实实际留存率
            body: “100k+ 客户”的表述属于未给出明确分母界定的公司自述。在缺乏在保保单定义、客群留存续保率、GRR、NRR 以及流失率的情况下，该数据无法确立客户群的稳定持久度或全生命周期价值（LTV）。
            calloutType: risk
            claimRefs:
              - CU001
              - CU015
          - type: callout
            title: Allianz 既是扩张引擎也是集中度隐忧
            body: 至少 10 年的全球合作协议能够拓宽分销网络并供给承保资本，但必须重点审查其独家排他条款、审批前提、经济分成以及解约保护机制，切勿将其盲目视作已完全消除风险的确定性增长。
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 监管牌照合规、持牌承保商转型与法律附带风险
        blocks:
          - type: paragraph
            body: >-
              Coalition 从纯授权总代理（MGA）向全栈风险承担实体开展战略转型，带来了显著监管阻力与持续合规复杂性。Coalition Insurance Company 取得纽约州第 23-25930
              号保险牌照成为持牌承保机构，固然赋予了公司监管自主权与专属承保能力，但推向全美仍需应对各州割裂的费率与保单条款报备体系，且持牌资质在部分司法管辖区并不能确保获批。此外，Coalition 接盘 Allianz
              Commercial
              独立商业网络险存量与增量资产这项标杆性全球协议，仍严格取决于美国、英国、德国、丹麦、瑞典及澳大利亚等关键司法管辖区的法定监管审批。与此同时，全球金融与保险监管机构正大幅提高针对系统性巨灾风险的压力测试标准与监管审查力度；围绕金融机构监管准则的官方研讨亦表明，交易对手声誉风险与监管自由裁量权可能瞬间切断金融业务运营网络。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR009
              - CR010
      - number: '7.2'
        title: 运营脆弱性、应急响应与系统性累积风险
        blocks:
          - type: paragraph
            body: >-
              Coalition 价值主张的运营核心在于其“主动型保险”（Active Insurance）范式，将攻击面监控、威胁情报与 24/7 应急响应直接嵌入投保人的风险管理之中。Coalition
              宣称这一持续减损架构将网络险赔案发生率较行业基准压降 73%，有力遏制了勒索软件、资金转账欺诈以及 AI
              驱动的钓鱼攻击等日常损失场景。然而，灾难性网络灾害极易触发严重的累积风险，常规的边界防御与算法遥测可能在大量投保企业中同时失效。分布式决策架构的理论与实证研究表明，碎片化数据源与缺乏协调的多主体系统极易遭受信息不确定性与跨域效用反转；当新型、具备强相关性的零日漏洞（0-day）绕过既定自动化检测预案并击穿应急响应极限时，将引发严重的核保盲区。
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
      - number: '7.3'
        title: 交易对手集中度、承保授权与再保险依赖
        blocks:
          - type: paragraph
            body: >-
              Coalition 的业务可扩展性与核保偿付能力依然高度依赖外部保险及再保险合作伙伴。在授权承保架构下，Coalition
              代表传统保司辛迪加签发独立网络险、公开市场网络再保险以及商业管理责任险，同时灵活调度自保公司（captive）、侧袋再保险（sidecar）和自营持牌保单等表内表外载体。与 Allianz Commercial
              的多年期联盟是一项兼具颠覆性与极高集中度的战略合作：Allianz 全面移交独立商业险资产，承诺至少 10 年的长周期承保资本，并换取了相应的股权对价与董事会席位。该利益绑定虽然夯实了 Coalition
              的全球分销渠道，但一旦监管审批遇阻或再保合约续期条件恶化，公司将承受巨大的交易对手风险。尽管 Coalition 与 Arch Insurance、Ascot Group、劳合社（Lloyd's of
              London）以及 Swiss Re Corporate Solutions 等全球知名辛迪加保持平行合作以分散单一保司依赖，但在更广泛的再保险市场费率硬化周期面前，公司依然脆弱。
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 综合风险矩阵、减损架构与投资逻辑破损触发点
        blocks:
          - type: paragraph
            body: >-
              综合评估 Coalition 面临的多维风险环境：尽管前置威胁扫描能有效化解单一投保客户的特异性损失，但在系统性累积风险与交易对手履约执行上，潜在敞口依然高企。核心投资否决条件（kill
              criteria）聚焦于三大可量化触发点：其一，在获取 Allianz
              企业网络险资产组合的跨国监管移交审批时遭遇实质性失败或漫长拖延；其二，突发灾难性系统级零日漏洞，引发击穿再保险起赔点并耗尽自保公司或侧袋再保资本储备的连锁巨额赔付；其三，遭遇监管执法或州保险专员否决，阻断
              Coalition Insurance Company 持牌保单在各州的横向展业。尽职调查必须严格审计 Coalition
              的再保险合约恢复保费条款、累积损失限额界定以及跨国监管报备的关键里程碑，从而确证技术层面的安全减损能切实转化为资产负债表的抗风险韧性。
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR011
              - CR012
      - number: '7.5'
        title: 附图与附表
        blocks:
          - type: callout
            title: 系统性累积风险与交割审批风险
            body: 尽管按照公司自述，Coalition 的主动监控在日常网络风险中展现出显著的减损降赔成效，但承接 Allianz 的商业险整体资产带来了复杂的跨跨国交割不确定性，同时也放大了在关联性网络巨灾事件面前的风险暴露。
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR011
  - number: 8
    title: 估值与投资分析
    sections:
      - number: '8.1'
        title: 投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              作为“主动型保险”（Active Insurance）的开创者，Coalition 将实时风险评估、动态威胁监控与全栈网络险承保融为一体，展现出鲜明的差异化投资逻辑 [CV001,
              CV003]。Coalition 设立 Coalition Insurance Company 晋升为持牌全牌照承保商，显示出高度的运营成熟度与资产负债表运作能力 [CV006]。与 Allianz
              Commercial 结成的战略联盟将 Coalition 确立为其全球独家商业网络险伙伴，并在至少 10 年期内全面接管核保与定价职能，构筑了前所未有的渠道分销护城河 [CV004,
              CV007]。相对而言，核心的反向利空论点集中在极度不透明的财务数据与巨灾风险敞口。Coalition 从未公开披露其 GAAP 营业收入、净利润率、客户留存率或特定承保年份的赔付率 [CV011,
              CV013]。尽管营销宣传宣称赔案发生率更低，但其真实的承保盈利水平始终缺少独立的精算审计验证 [CV003, CV010]。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: 投资评级框架与融资历程
        blocks:
          - type: paragraph
            body: >-
              我们给予 Coalition “深入研究”（research-more）的投资建议，评级置信度为中，风险等级为高，估值立场定为合理（fair）[CV009,
              CV012]。公司的融资轨迹展现出惊人的资本扩张速度：从 2018 年 $10M 的 A 轮融资，到 2021 年 9 月估值 $3.5B 的 $205M E 轮融资，再到 2022 年 6 月将估值推升至
              $5.0B 的 $221M F 轮融资 [CV001, CV002, CV005]。来自 Forge Global 的老股二级交易情报显示，截至 2026 年 7 月，Coalition 在 G
              轮投后估值基准锚定在 $5.29B，累计融资达 $1.05B，并在纳斯达克私募市场（Nasdaq Private Market）上保持活跃的老股交割 [CV002,
              CV005]。在缺乏经审计的签单总保费（GWP）与赔损发展数据的情况下，风险敏感型资本以超过 $5B 估值下注仍为时过早；审慎的做法是保持观望，静待底层虚拟数据室（data
              room）确证其具备可持续的单体经济模型（UE）[CV009, CV011, CV013]。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
