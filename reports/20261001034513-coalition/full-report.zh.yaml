  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 主动型保险模式与客户业务流界定
        blocks:
          - type: paragraph
            body: >-
              Coalition 将其产品定位为“主动型保险”（Active
              Insurance），这一运营模式将全方位的网络安全险承保与自动化边界监控、风险评估及事件响应服务深度融合。传统商业网络保险采取被动的理赔报销模式，核保员只看静态年度问卷评估风险，且往往在入侵发生后才介入核损定损。相比之下，Coalition
              的 Active Insurance 平台对企业外部攻击面开展持续扫描，在黑客攻击前及时标记新暴露软件漏洞、错误配置云端口以及未打补丁的边界服务。据公司口径披露，接入主动监控的投保客户其赔案发生率较行业平均水平低
              百分之七十三。其保险保障由持牌机构保单（admitted lines）与特种超额险保单（surplus lines）协同交付，包括持有 A.M. Best A- 评级的持牌承保机构 Coalition
              Insurance Company。Coalition 将风险工程遥测数据直接纳入保险合同，试图把中小企业网络减损防线从年度抽查转变为常态化、实时的运行反馈闭环。
            claimRefs:
              - CE001
              - CE002
              - CE003
