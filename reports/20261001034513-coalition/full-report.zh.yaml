      - number: '5.3'
        title: 企业级数据架构与底层技术基础设施
        blocks:
          - type: paragraph
            body: >-
              Coalition 的底层技术架构采用混合型设计，把云原生数据工程体系与复杂的保险资产负债表机制接在一起。其数据中台以 Snowflake 和 dbt 为核心的现代数据栈，采用受控的奖牌架构（Medallion
              Architecture：青铜、白银、黄金分层）数据流，对高频安全扫描遥测数据与历史保险赔付记录（loss runs）进行统一清洗、归一化与特征转换。              Kafka、Kinesis
              及工作流编排框架负责批流一体的数据摄取，为精算建模、自动化核保以及用于风险打分与 RAG 驱动分析流程的机器学习特征库提供底层算力支撑。保险端，Coalition 兼具 MGA 与全牌照承保人双重身份，调度
              Coalition Insurance Company（CIC）、自保机构、再保险侧袋，以及来自 Allianz、Arch Insurance、Ascot Group 和 Swiss Re Corporate
              Solutions 等全球再保险巨头的核保转授权额度。企业数据治理覆盖所有受监管的金融及投保人生产环境，严格采用基于角色的分级访问控制（RBAC）、列级数据脱敏及 PII 敏感信息令牌化机制。
