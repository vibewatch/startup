      - number: '2.3'
        title: 采购方、使用者、出资方与承保能力链条
        blocks:
          - type: paragraph
            body: >-
              投保企业既是实际出资方，也是保障受益人，但业务落地需要跨越多个机构环节。保险经纪人负责报价并撮合出单；Coalition
              负责风险定价、产品开发、提供风险减损与事件响应服务，并管理理赔流程；保险公司与再保险公司则提供承保转授权（delegated authority）以及资产负债表承保能力。Coalition
              自身的承保布局涵盖合作伙伴网络、自有持牌承保公司、自保实体（captives）、再保险侧袋（sidecars）及再保险架构。官方表述中，针对体量更大的跨国企业客户，Allianz
              提供了品牌背书、渠道分销、本地市场准入、核保支持及长期承保能力。因此，经纪人赋能、合规审查、可审计性、数据共享机制以及再保险合作并非中后台支持细节，而是决定产品能否规模化落地的核心制约条件。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
