            title: MGA 收入模型与表观保费体量的背离
            body: >-
              外部观察者常将 Coalition 的签单总保费（GWP）运行率（2021 年公开为 $325M）误当作已确认的软件营业收入。作为一家与全球再保巨头共担风险的授权总代理（MGA），Coalition 的 GAAP
              收入主要体现为佣金提成比例与服务费收入；其经营性现金流因此高度依赖分保再保协议条款与实际赔付率表现，而非单纯由顶层保单体量决定 [CI001, CI003, CI004]。
