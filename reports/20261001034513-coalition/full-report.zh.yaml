      - number: '6.3'
        title: 实名客户案例与证据质量
        blocks:
          - type: paragraph
            body: >-
              相较于宏观的整体规模口径，具有明确标识的实名客户证据显得明显不足。Coalition 知识中心在一篇关于 Wirespeed ADR 的客户案例中提及了
              centrexIT，描述其如何填补安全漏洞并提升分析师处置效率，但索引摘要并未披露合同范围、投产日期、部署规模或量化成效。CaseStudies.com 上的信息则指向相反方向：其将 Coalition 自身列为
              Census 等软件供应商的采购客户，这仅能作为证明 Coalition 内部工具选型的证据，绝不能计为外部机构采购 Coalition 产品的依据。此外，检索结果中出现的一项新记录涉及的是一家名为
              Coalition Technologies 的无关数字营销代理商，其案例成果不得挂钩至 Coalition, Inc.。这种同名实体的混淆实质上大幅削减了可供参考的实名客户样本，也充分证明了在将搜索结果中的客户
              Logo 及类似名称企业纳入考量之前，必须严格核验背后的法律实体。
            claimRefs:
              - CU008
              - CU009
              - CU010
