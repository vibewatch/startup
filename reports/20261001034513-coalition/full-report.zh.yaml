  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：主动型保险 vs. 传统承保商与纯网络安全厂商
        blocks:
          - type: paragraph
            body: >-
              商业网络风险赛道分化出三种迥异的商业模式：传统财险（P&C）承保商、独立网络安全软件厂商，以及技术驱动的主动型保险公司。Travelers、Chubb 和 AXA XL
              等老牌巨头坐拥庞大的资产负债表资本与成熟的经纪人网络，但其核保依然重度依赖静态的年度问卷，无法在两次保单续保之间追踪动态暴露的漏洞。反观 CrowdStrike 和 SentinelOne
              等纯网络安全厂商，虽然能提供深度的端点遥测与自动化威胁检测，但只作为软件许可方运作，完全不提供财务风险转移或资产负债表赔偿能力。Coalition 则凭借其被称为“主动型保险”（Active
              Insurance）的模式打破了这一结构性鸿沟，将持续的外部攻击面扫描与全栈承保牌照及承保授权相结合，力求在赔案发生前消除安全隐患。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 能力与功能分析：自动化核保、遥测与事件响应
        blocks:
          - type: paragraph
            body: >-
              商业买方主要围绕四大采购维度权衡网络保险方案：监控频率、出单报价速度、事件响应整合度，以及资产负债表承保能力。Coalition 依托自研的 Active Risk Platform
              近实时探测漏洞，并直接向投保人与经纪人推送自动化安全告警。据公司自述，这一主动防控模式让其投保客户的赔案发生率较行业平均水平降低 73%。一旦发生安全事件，Coalition
              会立即调遣自有应急响应团队遏制入侵并协助追回被盗资金；传统保险公司往往将投保人转介给第三方外包供应商名单，且面临免赔额审批层层滞后的痛点。然而市场经验表明，单靠自动化工具无法保障续保率；当遭遇复杂疑难赔案时，响应迅速的人工专业经验与面向客户的服务交付依然是决定性因素。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 定价、打包与分销：Allianz 联盟与承保能力供给
        blocks:
          - type: paragraph
            body: >-
              渠道分销掌控力与承保资本获取能力直接决定了商业网络安全核保的生死存亡。2026 年 5 月，Allianz Commercial 与 Coalition 将全球合作升级为一项为期 10 年的独家战略协议，由
              Allianz 将其跨所有商业细分市场的独立商业网络险存量与增量业务全线移交给 Coalition。根据官方声明与交易安排，Coalition 全面主导风险定价、产品研发、风险缓解与理赔管理；Allianz
              则持续注入长周期保险承保资本、开放广阔的跨国分销网络并参与董事会治理。为摆脱单一依赖授权总代理（MGA）架构的局限，Coalition 专门成立了获得 A.M. Best A- 评级的持牌承保机构
              Coalition Insurance Company（CIC），在第三方授权资本、自保公司（captive）和侧袋再保险机制之外，具备了直接签发保单的能力。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
