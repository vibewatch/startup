        blocks:
          - type: paragraph
            body: >-
              Coalition 逐步拓宽了自身在保险价值链中的角色。Business Wire 发布的官方新闻稿显示，公司于 2023 年 1 月宣布成立 Coalition Insurance
              Company，并称该承保主体已获得 A.M. Best 评予的 A- 评级。随后，Coalition 于 2024 年 9 月推出 Coalition Re，提供非比例网络再保险以及由 Aspen
              领衔承保辛迪加支持的白标产品。2026 年 5 月，Allianz 宣布签署一项至少为期 10 年的战略合作协议；根据协议，Coalition 将全面主导 Allianz
              独立商业网络保险业务的定价、产品开发、风险缓解及理赔管理。该协议当时仍需获得监管及常规审批，交易对价未予披露。上述里程碑虽然拓宽了分销渠道，却也加深了对 Allianz
