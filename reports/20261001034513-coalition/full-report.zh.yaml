            body: >-
              Allianz Commercial 与 Coalition 达成的 10 年期独家全球网络保险合作，从根本上重塑了商业网络险的分销格局。该协议把 Allianz 的商业网络险资产组合移交给
              Coalition，该协议不仅确立了 Coalition 在全商业客群中的主力核保机构地位，更为其锁定了长期承保资金支持与跨国分销规模。
            calloutType: insight
