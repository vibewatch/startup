      - number: '8.3'
        title: 情景分析与退出准备度评估
        blocks:
          - type: paragraph
            body: >-
              我们的情景分析以网络安全保险市场估值倍数与核保可持续性为锚，划分为三条演进路径。在乐观情景（bull case）下，Coalition 顺利完成 Allianz 资产包移交交割，投保客户突破 100,000
              家且自有持牌保单保费规模持续复利增长，支撑其在最终公开上市时享有 $7.5B 至 $9.0B 的企业估值 [CV002, CV004, CV007]。在基准情景（base case）下，北美 SMB
              网络险业务保持稳健增长，但部分收益被再保险资金成本及传统险企的竞争压力所抵消，估值区间落在 $4.8B 至 $5.5B，与当前估值水平基本相符 [CV002, CV008, CV012]。在悲观情景（bear
              case）下，若出现系统性网络风险蔓延、多份再保险合约重定价受挫，或赔付率急剧恶化，其私募市场估值将被压缩至 $2.5B 到 $3.5B [CV001, CV010,
              CV013]。要弥合上述估值分歧，后续必须针对再保险合约起赔点、分批次赔付率及经纪人留存率展开深度尽调 [CV008, CV011]。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
