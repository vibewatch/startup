      - number: '5.4'
        title: 技术差异化优势、协同治理与核心尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Coalition 自述的核心技术差异化优势在于其自有扫描遥测能力以及深度闭环的理赔反馈机制，相较于传统商业保险公司，大幅提升了报价出单速度并增强了主动式事前减损效果。与巨头承保商的战略结盟（如 2026
              年扩大的 Allianz
              合作）印证了其核保引擎跨国界拓展多元商业险种的扩展能力。关于技术联盟的宏观组织与国防领域研究表明，跨机构协同运作商用技术平台必须建立结构化的对接协议与决策治理框架，以避免伴随产品线扩张产生运营摩擦，并保持平台的敏捷响应能力。尽管具备上述运营亮点，技术与尽调仍有显著盲区。Coalition
              的底层专有扫描算法、自动化漏洞检出率以及扫描误报率均处于保密状态，缺乏独立的第三方审计验证。此外，由于外部扫描仅能评估暴露在公网的边界资产，无法直接测度内网横向移动与凭证窃取等深层内网威胁，导致其核保技术的真实预测有效性完全依附于非公开的理赔历史数据。
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 论证展点
        blocks:
          - type: callout
            title: 遥测技术与资产负债表承保实力的深度融合
            body: Coalition 的核心技术护城河在于将实时安全遥测能力与多元保险资本工具深度绑定，依托合规持牌保单及全球再保险协议，实现了高度自动化的核保流转与动态风险监测。
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: 边界扫描盲区与未经验证的技术实效
            body: 尽管 Coalition 声称将出险率降低了 73%，但外部边界扫描无法评估内网横向移动等深层威胁，且其底层算法缺乏独立的第三方审计验证，在遭遇系统性漏洞集中爆发时容易引发核保端的不确定性风险。
            calloutType: risk
