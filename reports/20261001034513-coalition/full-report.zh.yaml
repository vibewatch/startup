              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: 情景分析与退出预期
        blocks:
          - type: paragraph
            body: >-
              我们基于网络安全行业估值倍数与核保韧性构建了三条情景路径。乐观情景下，Coalition 完美完成 Allianz 存量资产交接，投保企业规模突破 100,000
              家并推动自营持牌保费复合增长，支撑其在未来公开上市时达成 $7.5B 至 $9.0B 的企业估值 [CV002, CV004,
              CV007]。基准情景下，北美中小企业网络险的稳健增长被再保险承保能力成本及老牌承保商的竞争挤压所抵消，支持 $4.8B 至 $5.5B 的估值区间，维持当前估值合理 [CV002, CV008,
              CV012]。悲观情景下，突发系统性网络灾难蔓延、遭遇多次再保险合约加价或赔付率持续恶化，将拖累一级市场估值回落至 $2.5B 至 $3.5B [CV001, CV010,
              CV013]。弥合上述估值分歧，需要针对再保险起赔点、客群赔付率及经纪人留存率开展严密尽调 [CV008, CV011]。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.4'
        title: 附图与附表
        blocks:
          - type: callout
            title: 投资决策指令：有条件推进，静待数据室核验
            body: >-
              依托 Allianz 构筑的强大分销网络与自研的主动扫描平台，Coalition 当之无愧地确立了技术驱动型网络险承保领域的领军地位。然而，在未穿透调取细颗粒度的法定赔付率、再保合约脱钩点以及 GAAP
              收入数据之前，无法审慎支持超过 $5.0B 的一级市场估值。建议投资机构保持密切跟踪，在参与任何老股流动性交易或新一轮主轮融资前，要求全面开放底层数据室展开尽职核查。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV011
              - CV013
