          - type: callout
            title: 承保资本风险与 SaaS 估值倍数之间的资本配置冲突
            body: >-
              Coalition 设立 Coalition Insurance Company（CIC）并维持合规持牌承保实体运作，实际上横跨了两种相互割裂的估值逻辑。软件投资人倾向于按科技股倍数对高毛利、高复购的 ARR
              进行估值；而保险监管机构则强制要求计提资本盈余公积金并锁定未到期保费准备金，这不仅限制了资本回报灵活性，更在遭遇网络巨灾系统性风险时加剧了资产负债表的暴露敞口 [CI001, CI007, CI013]。
