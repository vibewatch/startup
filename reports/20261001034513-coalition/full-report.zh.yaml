companyProfile:
  summary: >-
    Coalition 是一家总部位于旧金山的新型网络安全与保险公司，主打“主动型保险”（Active Insurance），将网络风险承保与实时监控、告警、事件响应及周边风险管理工具结合。公开证据证实该公司由 Joshua Motta
    和 John Hering 于 2017 年创立，在 2022 年以 $5 billion 估值完成 F 轮融资，随后拓展至承保实体与再保险业务；但目前公司仍未披露当期经审计财务数据、现金储备或完整治理架构名单。
