      - number: '2.3'
        title: 买方、用户、付费方与承保能力链条
        blocks:
          - type: paragraph
            body: >-
              投保企业既是经济付费方也是直接受益人，但产品的落地须穿透多个机构。业务架构表述中，经纪人负责报价与分销出单；Coalition
              负责风险定价、产品研发、风险缓解、应急响应及理赔管理；保险公司与再保机构则提供承保授权和资产负债表资本支撑。在承保能力供给上，Coalition
              组合使用了合作方保单、持牌承保机构、自保公司（captive）、侧袋再保险（sidecar）以及各类再保架构。针对大型跨国客群，Allianz
              则输出品牌背书、分销网络、本地市场准入、承保支持以及长周期承保能力。这使得经纪人赋能、保险监管合规、可审计性、数据共享机制以及再保险合作成为业务落地的关键前置依赖，而非简单的中后台细节。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
