              - CE006
      - number: '5.2'
        title: 产品线矩阵与经纪人业务流集成
        blocks:
          - type: paragraph
            body: >-
              Coalition 的产品与服务矩阵横跨投保人风险管理、承保公司保单资质以及经纪人分销工具三大领域。面向投保企业，核心交互平台包括 Active Risk Platform 与 Coalition
              Security，提供持续的边界漏洞扫描、可落地的风险修复建议，以及全天候接入常驻内部事件响应与数字取证团队的权限。面向分销合作方，Coalition 打造了 Broker IQ
              数字化核保门户，使独立经纪人能够在数分钟内自动生成可出单的有效报价，把过去数日的等待周期压缩到几分钟。Coalition 还与顶尖承保巨头深度合作，其中最引人注目的是 2026 年 5 月公布的与 Allianz
              Commercial 升级扩大的长期全球协议。根据双方声明，在这项多年期合作安排中，Coalition 在美国、英国、澳大利亚、德国、丹麦和瑞典等市场全权负责 Allianz
              独立商业网络保险资产组合的定价、产品研发、风险防范与理赔管理。这种渠道打法将第三方经纪人销售环节紧密嵌入到 Coalition 自有数字化即时出单流程中。
