      - number: '4.4'
        title: 论证展点
        blocks:
          - type: callout
            title: MGA 营收模型与保费体量之间的口径脱节
            body: >-
              外界观察者常将 Coalition 的年化总签单保费（2021 年公布为 $325M）与其实际确认的企业软件收入混为一谈。作为与全球再保险巨头分担风险的 MGA，Coalition 计入 GAAP
              报表的收入仅体现为佣金提成比例与技术服务费。因此，其经营性现金流高度取决于分保合约条款与实际赔付率走势，而非表端保单销售规模的总量 [CI001, CI003, CI004]。
