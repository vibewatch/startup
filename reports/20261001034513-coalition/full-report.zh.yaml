      - number: '4.2'
        title: GTM 经济学、销售人效与运营成本驱动因素
        blocks:
          - type: paragraph
            body: >-
              Coalition 的分销网络主要依托覆盖美国、加拿大、英国与澳大利亚的独立批发与零售保险经纪渠道 [CI003, CI005]。在 Broker IQ 出单报价门户的支撑下，批发与零售经纪人将
              Coalition Active Insurance 保单推向中小微企业（SMB）客群及中型市场客户 [CI008, CI011]。其获客成本（CAC）的大头为经纪人佣金支出，占总保费的 10% 至
              15%；相较于企业级 SaaS 的直销模式，这大幅削减了初期的销售周期摩擦 [CI004, CI009]。而在运营成本端，Coalition
              的成本结构与传统纯软件企业截然不同。除持续全网扫描所需的标准云原生基础设施托管成本外，Coalition 还背负着威胁情报、安全工程以及 24/7 自有专属应急响应团队的高额技术人力支出 [CI008,
              CI010]。公司公开记录显示团队规模快速扩张：从 2021 年底的 270 人，增至 2024 年底的 540 人，到 2026 年底据报在多地研发中心拥有 704 名员工 [CI002,
              CI010]。理赔处理人员、法律与数字取证专家聘请成本，以及 Coalition Insurance Solutions 和 CIC
              等主体在美各州及多国监管管辖区持有承保资质所要求的法定资本金，均直接推高了服务交付成本 [CI007, CI010]。
