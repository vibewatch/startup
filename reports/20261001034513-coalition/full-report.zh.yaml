      - number: '2.4'
        title: 业务落地驱动力、制约因素与估值相关性
        blocks:
          - type: paragraph
            body: >-
              Coalition 需求端最确凿的证据来自渠道扩张：Allianz 将网络安全保险定性为高需求业务，双方达成了至少 10 年经济利益绑定的独家全球商业合作，分阶段推进区域落地。Coalition
              还宣称其投保客户的赔案发生率减少 73%；若该数据在可比样本客群中得到独立验证，将显著改善买方的 ROI
              与承保经济效益。然而，分配资料未提供任何分母、观察周期、对照组或独立方法论来支撑这一结果。监管审批、授权承保合规、承保能力供给、审计要求以及对经纪人和保险渠道的依赖，都可能拖慢落地节奏。在缺乏保费、留存率、赔付率和续保证据的情况下，这些驱动力能够支撑其战略重要性，但不足以直接推导出精确的估值溢价。
