      - number: '4.3'
        title: 资本充足率、赔付率表现与非公开指标尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              评估 Coalition 的真实财务健康状况，必须厘清资产负债表资本结构与累计风投资本之间的本质差异。历经八轮融资与老股转让，Coalition 累计完成 $785M 至 $800M 的股权融资，并在 2022
              年 7 月的 F 轮融资中达成 $5.0B 的投后估值；此后又相继获得三井住友海上火灾保险（Mitsui Sumitomo Insurance，2025 年 3 月注资 $30M）以及 Allianz（2026
              年 5 月）的战略注资 [CI001, CI005, CI010, CI012]。充裕的流动性固然为技术研发与全球化扩张提供了充沛的运营跑道，但其在结构上与保险核保准备金截然不同 [CI001,
              CI007]。作为全牌照承保人，CIC 必须满足监管法定的风险资本（RBC）要求，并设立由信托监管的未到期保费准备金，从而造成了纯软件公司无须承担的营运资金沉淀
              [CI007]。尤为关键的是，非上市公司的数据黑箱掩盖了 Coalition 真实的赔付率、再保险合约起赔点（attachment points）以及净留存率（net retention
              rates）[CI013, CI014]。尽管 Coalition 声称依托自动化漏洞预警与补丁扫描，投保客户的出险率比行业基准低 70% 至
              73%，但在公开记录中，仍无法获取关于成熟承保客群实际赔付率的独立审计凭证 [CI002, CI008,
              CI014]。在核保尽调维度，分保协议佣金点位、巨灾再保险复效成本以及毛留存率等非公开指标的缺失，构成了实质性的尽调阻碍 [CI013, CI014]。
