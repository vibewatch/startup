  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局分析：主动型保险 vs 传统财险承保商与纯网络安全厂商
        blocks:
          - type: paragraph
            body: >-
              商业网络风险市场可划分为三种截然不同的战略模式：传统财产及意外险（P&C）承保商、独立网络安全软件厂商，以及技术驱动的主动型保险公司。以 Travelers、Chubb 和 AXA XL
              为代表的传统巨头掌控庞大的资产负债表承保体量及成熟的经纪人网络，但其核保体系仍局限于静态的年度问卷调查，无法追踪保单续约周期之间的实时漏洞演变。相反，以 CrowdStrike 和 SentinelOne
              为代表的纯网络安全厂商虽然具备深度终端遥测数据与自动化威胁检测能力，但其商业本质完全属于软件授权，不承担任何财务风险转移或资产负债表层面的损失赔偿。Coalition 则凭借 Active Insurance
              模式填补了这一结构性鸿沟，将持续外部攻击面扫描与全牌照承保能力及转授权承保额度相融合，自述力求在索赔发生前化解潜在安全隐患。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 核心能力与功能特性分析：自动化核保、遥测监控与事件响应
        blocks:
          - type: paragraph
            body: >-
              企业采购方在评估网络保险替代方案时，主要权衡四大考量维度：监控响应频次、出单报价速度、事件响应整合深度，以及资产负债表承保实力。Coalition 依托专有的 Active Risk Platform
              实现实时漏洞识别，能够将自动化安全告警直推给投保企业与经纪人。公司口径称，这种主动干预手段使其出险率相比行业平均水平下降了 73%。一旦发生安全事件，Coalition
              会立即调派内部事件响应团队处置遏制漏洞并追回损失；相比之下，传统保险公司通常将客户转介至第三方服务商名录，且往往受制于繁琐的免赔额审批流程。然而市场证据表明，仅靠自动化并不能保证客户留存；面对复杂的理赔案件时，高效的人工专业能力与直面客户的服务响应依然是核心决定因素。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 定价策略、产品打包与渠道分销：Allianz 联盟与承保能力建设
        blocks:
          - type: paragraph
            body: >-
              分销把控力与承保资金供给直接决定了商业网络核保业务的可行性。2026 年 5 月，Allianz Commercial 与 Coalition 将全球合作升级为一项为期 10 年的独家战略协议：Allianz
              将其覆盖所有商业客群的独立商业网络保险资产组合全面移交给 Coalition。在该笔交易中，双方声明由 Coalition 承担定价、产品研发、风险防范与理赔管理的主导职责；Allianz
              则提供长期承保资金额度、广泛的跨国分销网络及董事会层面的治理参与。为摆脱单纯依赖管理总代理（MGA）转授权模式的局限，Coalition 组建了持牌承保公司 Coalition Insurance
              Company（CIC），并获得 A.M. Best 的 A- 信用评级，使其能够在转授权额度、自保实体与侧袋再保险机制之外，直接开展保单报价与承保业务。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
