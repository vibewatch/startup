      - number: '6.2'
        title: 落地规模与成效宣称
        blocks:
          - type: paragraph
            body: >-
              Coalition 官网宣称其服务超过 100,000 家客户，且投保客户的赔案发生率减少
              73%。这两项指标均属公司自述，并非经独立审计验证的留存客群统计：抓取的页面未明确客户数究竟是指在保保单、独立机构、安全软件用户还是历史累计客户；赔案对比亦未披露基准对照人群、观察周期以及损失的界定口径。与
              Allianz 的交易在预期分销体量上提供了更有力的外部信号，但这仍属于分阶段落地推进的合作，且须以监管审批和常规惯例批准为前提。Allianz 官方表示，Coalition
              将全面主导风险定价、产品研发、风险缓解与理赔管理，Allianz
              则提供资金资本与分销网络支持。这一协同机制有望加速业务落地，但原始材料并未提供移交的保单件数、签单总保费、激活时间表或实际达成的留存数据。因此，其市场落地在商业上可信，但量化依据仍不充分。
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
