            body: >-
              Coalition 设立 Coalition Insurance Company（CIC）并持续自营持牌保险承保业务，因此同时处在两种截然冲突的估值逻辑之间。软件投资者按高科技倍数给高毛利、高确定性的订阅制
              ARR 定价；保险监管机构则强制要求计提资本公积准备金并锁定未到期保费，这不仅限制了资本回报率，还在遭遇灾难性系统网络风险事件时放大了资产负债表的风险敞口 [CI001, CI007, CI013]。
