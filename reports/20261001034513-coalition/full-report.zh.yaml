      - number: '5.3'
        title: 企业级数据架构与底层技术基础设施
        blocks:
          - type: paragraph
            body: >-
              Coalition 的技术底层依托一套将云原生数据工程与复杂保险资产负债表架构相打通的混合架构。数据平台建立在以 Snowflake 和 dbt 为核心的现代数据栈之上，采用治理严密的 Medallion
              分层管线（铜层、银层、金层）吸纳、规范化并清洗高频安全扫描遥测数据与历史保险理赔台账（loss runs）。批流一体吸纳工作流利用 Kafka、Kinesis
              及编排调度框架实现遥测数据的大规模吞吐，驱动精算建模、自动化核保以及用于风险评分与 RAG 检索增强分析工作流的机器学习特征库。在资产负债表端，Coalition 兼具 MGA 与全牌照承保商双重身份，调度
              Coalition Insurance Company（CIC）、自保公司（captive）、侧袋再保险（sidecars），以及来自 Allianz、Arch Insurance、Ascot Group 和
              Swiss Re Corporate Solutions
              等全球再保巨头的承保授权协议来供给承保能力。企业级数据治理则覆盖所有受监管的金融与投保客户生产环境，严格执行基于角色的访问控制（RBAC）、字段级数据脱敏以及个人身份信息（PII）标记化脱敏。
