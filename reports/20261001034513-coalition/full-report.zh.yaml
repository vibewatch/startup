      - number: '6.2'
        title: 业务采纳规模与公司口径成效
        blocks:
          - type: paragraph
            body: >-
              Coalition 官网宣称其拥有超过 100,000 家客户，且投保客户的出险率降低了
              73%。上述数据均属于公司单方口径，而非经过独立验证的分组统计：调取的页面并未明确该客户规模指代生效保单量、投保企业数、安全软件用户数还是历史累计签约客户数；同时出险率对比也省略了基准参照人群、观察周期以及损失认定标准。与
              Allianz 的交易为其未来的渠道分销规模提供了更为有力的外部背书，但这仍是一个分阶段推进的过程，且有待各项监管与常规审批落地。Allianz 表示 Coalition
              将主导定价、产品开发、风险防范与理赔管理，自身则提供资源与分销渠道。尽管这种安排有望加速业务落地，但原始公开资料并未提供交割保单数量、签单保费体量、上线推进时间表或已实现留存率数据。因此，其业务普及具备商业可信度，但量化依据仍不充分。
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
