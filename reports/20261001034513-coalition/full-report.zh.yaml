              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.4'
        title: 论证展点
        blocks:
          - type: callout
            title: 决策指引：维持观望，待数据室深度核验后有条件推进
            body: >-
              凭借与 Allianz 建立的强大分销同盟以及专有的主动扫描平台，Coalition 已稳居技术型网络险核保赛道的领军地位。然而，在无法获取颗粒度细化的法定赔付率、再保险合约分保离脱点（detachment
              points）及 GAAP 实际营收数据之前，以超过 $5.0B 的私募估值仓促入局是不负责任的。投资者应保持持续动态跟踪，在参与任何流动性交易或新一轮增发融资之前，要求对方在数据室全面开放核心运营数据。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV011
              - CV013
