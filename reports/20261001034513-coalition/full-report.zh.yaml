      - number: '6.3'
        title: 客户实证与证据质量
        blocks:
          - type: paragraph
            body: >-
              具名实证材料的充实度显著弱于整体大盘规模的主张。Coalition 知识中心在 Wirespeed ADR 客户案例中提及了
              centrexIT，并阐述了修补安全漏洞与扩充分析师产能的过程；但检索到的文本未披露合同金额、上线日期、部署规模或量化的落地结果。CaseStudies.com 上的信息则指向相反方向：该网站将
              Coalition 本身列为 Census 等软件供应商的采购客户，这属于 Coalition 内部采购工具链的证据，绝不可算作外部机构采购 Coalition 产品的案例。分配的新检索材料中有一条涉及
              Coalition Technologies，但这是一家毫无关联的数字营销代理商；其案例研究绝不能归入 Coalition,
              Inc.。这一同名主体混淆大幅压缩了真正可用的具名客户样本，也证明在收录搜索结果中的企业 Logo 和同名公司前，必须开展发行主体级别的严格交叉核验。
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
