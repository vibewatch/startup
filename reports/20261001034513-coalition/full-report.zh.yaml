            body: >-
              Coalition 将商业网络保险与网络安全监控、告警、事件响应及风险管理工具深度融合，并将该模式称为 Active Insurance。根据公司 2022 年 F 轮融资公告及 EquityZen 披露，公司由
              Joshua Motta 和 John Hering 于 2017 年创立，总部设在旧金山。审视业务规模数据须严格界定时间节点：公司在 2022 年 7 月的官方公告中披露客户数超过 160,000
              家，年化总签单保费（run-rate gross written premium, GWP）超过 $775 million；而在本次调研调取的未标注日期官网上，显示的客户数仅为“100k+
              clients”。后一数据并不能证明业务出现下滑，因为统计口径、统计日期以及样本群体尚未统一。此外，总签单保费属于保费规模指标，并非营业收入或 ARR，且在现有证据中未见当期经审计的营收或员工规模数据。
