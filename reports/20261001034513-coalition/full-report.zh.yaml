  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户细分与采购触点
        blocks:
          - type: paragraph
            body: >-
              公开证据表明其面向四类差异显著的目标客群，而非单一客群。Coalition Insurance Company 设立之初推出的保单专为往往缺乏自建网络风险工具的中小微企业（SMB）量身打造，由此锚定了 SMB
              保险客群。Coalition 官网则重点推广面向保险经纪人的 Broker IQ 平台，集成报价、实务培训与销售物料功能；因此经纪人属于渠道分销端的用户，而非被保险的终端企业客户。与 Allianz
              的协议通过官方宣布的存量资产交接，注入了覆盖所有商业细分市场的企业客户；但相关公告未披露移交的投保企业数量或对应保费规模。Wirespeed
              的支持职能涵盖了围绕安全事件与产品问题的技术和非技术客户交互，表明在保险业务之外还存在安全软件产品的用户交互触点。分配材料中未披露采购决策人职能、各细分客群收入结构以及付费方与最终用户的拆分比例；后续须通过真实账户及保单数据核实，不可仅凭产品宣传定位主观臆断。
            claimRefs:
