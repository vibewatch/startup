      - number: '4.3'
        title: 资本充足率、赔付率与非公开指标尽调断点
        blocks:
          - type: paragraph
            body: >-
              评估 Coalition 真实的财务基本面，必须将资产负债表资本充足率与累计风险投资股权融资严格区分开来。历经 8 轮股权融资与老股转让，Coalition 累计吸纳了 $785M 至 $800M 股权资本，在
              2022 年 7 月完成估值 $5.0B 的 F 轮融资，随后又在 2025 年 3 月获得三井住友海上火灾保险（Mitsui Sumitomo Insurance）$30M 战略投资，并在 2026 年 5
              月获得 Allianz 注资 [CI001, CI005, CI010, CI012]。充裕的流动资金固然为技术研发与全球拓城提供了充足的运营现金跑道，但它在资本结构上与保险承保准备金完全是两回事 [CI001,
              CI007]。全牌照承保公司 CIC 须遵循监管硬性要求的风险资本（RBC）指标并将未到期责任准备金置于信托托管之下，这带来了纯软件厂商无需承受的巨额营运资本沉淀与锁定
              [CI007]。更为关键的是，非上市公司的保密性遮蔽了 Coalition 真实的赔付率、再保合约起赔点（attachment points）以及净留存率（net retention rates）[CI013,
              CI014]。尽管 Coalition 宣称得益于自动化漏洞告警与补丁监测，其投保客户的赔案发生率较行业平均低 70% 至 73%，但在公开材料中依然找不到成熟承保年份客群经独立审计的真实赔付率证明
              [CI002, CI008, CI014]。就承保尽调而言，分保合约佣金、巨灾再保险恢复保费成本（reinstatement costs）以及总留存水平的非公开状态，构成了实质性的尽调障碍 [CI013,
              CI014]。
