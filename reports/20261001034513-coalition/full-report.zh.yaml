  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户细分客群与采购触点
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，Coalition 服务于四类截然不同的客群，而非单一客群。Coalition Insurance Company 成立时主要针对普遍缺乏自主网络风险防护工具的中小企业推出保单，构筑起专门的 SMB
              保险客群。此外，Coalition 官网重点推广 Broker IQ 门户，为经纪人提供报价、培训及销售物料支持；经纪人由此属于渠道分销使用者，而非最终投保客户。与 Allianz
              达成的合作协议通过整体资产包迁移，为其引入了覆盖所有客群的大中型商业客户，但官方新闻稿并未量化披露交割的保单户数或保费规模。Wirespeed
              的技术支持职能需要围绕安全事件与产品问题，同客户保持技术及业务上的多频互动，也勾勒出保险之外的独立安全产品用户群。现有指派证据未披露采购人职位画像、分客群营收占比以及付费方与使用方的结构拆分；这些关键指标应从真实的账户及保单数据中核实提取，而不应仅凭产品宣发定位主观推断。
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
