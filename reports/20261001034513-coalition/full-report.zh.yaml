      - number: '6.4'
        title: 客户黏性、增购扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开信息仅能证实其渠道驱动型扩张机制，但不足以佐证客户黏性。Broker IQ 能够助力经纪人拓客与高频复核报价，而 Wirespeed
              技术支持模式则能通过安全事件调查、工单升级与后续跟进维系售后的产品活跃度。在承保能力供给端，官方招聘职能描述指出，Coalition
              依托向其下放核保转授权的保险与再保险机构开展业务，这类合作方通常对数据交互共享、合规审计、合同依从性以及内部产品支持提出严苛要求。Allianz
              至少十年的长期协议或能巩固这一核心支柱关系，但排他条款、股权置换、董事会席位以及对 Allianz
              分销渠道的重度倚赖，也构成了必须重点审视的合作伙伴集中度隐患。现有指派资料未有一处披露毛留存率（GRR）、净收入留存率（NRR）、保单续约率、经纪人集中度、前五大客户占比、单客合同周期或增购收入等关键指标。分散的客户总数无法替代上述分母指标，公开数据的缺失应被视作尽调盲区，绝不能反推为客户留存表现强劲。
            claimRefs:
              - CU006
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 论证展点
        blocks:
          - type: callout
            title: 口径宣称规模无法证明客户留存能力
            body: “100k+ clients”这一表述属于未明确统计分母的公司单方宣称。在缺乏生效保单界定、分批次续约率、GRR、NRR 及流失率数据的情况下，该指标无法证明其客群基本盘的留存韧性与生命周期价值（LTV）。
            calloutType: risk
            claimRefs:
              - CU001
              - CU015
          - type: callout
            title: Allianz 既是业务扩张引擎，亦带来潜在集中度隐患
            body: 长达至少十年的全球合作架构有助于拓展分销渠道并提供承保资金支持，但在将其视作低风险增长驱动力之前，必须严格审视其排他机制、审批先决条件、经济对价分润及协议终止保护条款。
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
  - number: 7
    title: 核心风险
    sections:
      - number: '7.1'
        title: 监管牌照准入、持牌承保人转型与合规或有风险
        blocks:
          - type: paragraph
            body: >-
              Coalition 从纯 MGA 转型为全功能型风险承担者，带来了显著监管阻力与持续合规复杂度。虽然 Coalition Insurance Company 在纽约州获得第 #23-25930
              号合规承保人（admitted carrier）执照，为其赋予了监管自主权与自有承保体量，但向全美铺开意味着必须跨越各州差异极大的费率与条款报备（rate and form
              filing）审批门槛，并非所有辖区均能顺利获批合规出单资质。更为关键的是，Coalition 承接 Allianz Commercial
              独立商业网络保险资产组合这项里程碑全球协议，很大程度上取决于美、英、德、丹麦、瑞典及澳大利亚等核心法域的监管与法定审批。与此同时，全球金融与保险监管机构正快速升级针对系统性巨灾风险的压力测试标准与监管审查；而有关金融机构监管准则的争论亦表明，交易对手的行业声誉与监管自由裁量权随时可能对金融业务运营网络造成突发冲击。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR009
              - CR010
      - number: '7.2'
        title: 运营脆弱性、事件应急响应与系统性风险共振
        blocks:
          - type: paragraph
            body: >-
              Coalition 价值主张的核心在于其“主动型保险”范式，将攻击面监控、威胁情报感知以及 24/7 应急响应深度嵌入投保人风险管理体系中。Coalition
              声称，这种持续防御架构使网络保险出险率相比行业基准降低了 73%，能够有效防范勒索软件、资金电汇诈骗及 AI
              驱动型钓鱼攻击等常见出险路径。然而，灾难性网络灾害具备严重的风险聚集性（aggregation），传统边界防御与算法遥测可能会在大量投保企业中同时失效。关于分布式决策架构的理论与实证研究表明，碎片化数据源与缺乏协同的多智能体系统往往面临信息不确定性及跨域效用反转；当新型、高相关性的零日漏洞绕过既有的自动化检测策略、致使内部事件响应能力彻底过载时，将暴露致命的核保盲区。
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
      - number: '7.3'
        title: 交易对手集中度、承保转授权与再保险依赖
        blocks:
          - type: paragraph
            body: >-
              Coalition 的业务扩展能力与核保偿付韧性在很大程度上依然锚定于外部保险与再保险合作关系。依托核保转授权架构，Coalition
              代表传统承保辛迪加出具独立网络险保单、经办公开市场网络再保险以及商业管理责任险，同时灵活调度自保实体、侧袋以及自有持牌保单等资产负债表工具。与 Allianz Commercial
              达成的多年期联盟虽然具有里程碑意义，但也带来了高度集中的单一合作方风险：Allianz 移交其独立商业险资产组合，承诺提供长达至少 10 年的承保额度，并换取股权对价与董事会席位。这种绑定尽管巩固了
              Coalition 的全球分销渠道，但一旦监管审批遇阻或合约续签条件发生不利调整，公司将直面剧烈的交易对手风险。尽管 Coalition 与 Arch Insurance、Ascot Group、Lloyd's
              of London 及 Swiss Re Corporate Solutions 等全球知名辛迪加维持并行合作，分散了对单一承保商的依赖，但依然无法免疫再保险全行业周期收紧与费率硬化带来的系统性冲击。
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 综合风险矩阵、缓释架构与投资逻辑破坏触发项
        blocks:
          - type: paragraph
            body: >-
              综合审视 Coalition 面临的多元风险环境可见：尽管前置的主动威胁扫描有效化解了投保人个体的特异性损失，但在系统性风险共振与交易对手执行力维度，潜在风险敞口依然处于高位。其核心投资破坏性指标（kill
              criteria）聚焦于三大可量化的触发条件：第一，Allianz
              企业网络险资产组合在争取跨境监管移交审批时遭遇失败或长期阻滞；第二，灾难性的系统性零日漏洞引发全网共振损失，突破再保险起赔点并耗尽自保公司或侧袋资本公积；第三，监管执法处罚或各州保险监督官的驳回裁定扼制了
              Coalition Insurance Company 持牌保单在全美的扩张步伐。后续尽调必须深度核查 Coalition 再保险合约的复效条款（reinstatement
              terms）、累计赔偿限额定义以及跨境监管报备里程碑进展，以确认技术层面的风险减损能否真正沉淀为资产负债表的长期抗风险韧性。
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR011
              - CR012
      - number: '7.5'
        title: 论证展点
        blocks:
          - type: callout
            title: 系统性风险共振与交易交割不确定性
            body: >-
              尽管 Coalition 自述其主动监控技术在化解常规网络安全风险时展现出显著的出险率压降效果，但承接 Allianz
              商业险资产包的交易涉及极其复杂的跨法域交割先决条件，同时也加剧了面临高关联度网络巨灾事件时的风险敞口。
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR011
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资立论与反向论点
        blocks:
          - type: paragraph
            body: >-
              Coalition 呈现出极具差异化的投资立论：作为 Active Insurance 的先驱，它将实时风险评估、动态威胁监控与全流程网络险核保深度融合 [CV001, CV003]。公司依托 Coalition
              Insurance Company 升级为持牌全功能型承保人，展现出扎实的运营成熟度与资产负债表运作能力 [CV006]。而与 Allianz Commercial 的战略合作更确立了其作为 Allianz
              独家全球商业网络险合作伙伴的地位，锁定了至少 10 年的核保与定价主导权，构筑起前所未有的分销壁垒 [CV004, CV007]。相反，核心反向论点则聚焦于其极度不透明的财务数据与巨灾风险敞口。Coalition
              未公开披露其 GAAP 营业收入、净利润率、客户留存率或分批次赔付率 [CV011, CV013]。尽管营销口径坚称出险率显著降低，但目前依然缺乏关于其实际核保盈利能力的独立精算审计佐证 [CV003,
              CV010]。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
