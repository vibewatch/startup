callouts:
  - calloutType: insight
    title: MGA Revenue Model Disconnect from Premium Scale
    body: "Outside observers often conflate Coalition's gross written premium run-rate ($325M reported in 2021) with recognized corporate software revenue. As a managing general agent sharing risk with global reinsurers, Coalition's GAAP revenue represents commission percentages and service fees, meaning operating cash flow is heavily sensitive to treaty commission terms and loss ratio performance rather than pure top-line policy volume [CI001, CI003, CI004]."
    claimRefs:
      - CI001
      - CI003
      - CI004
  - calloutType: risk
    title: Capital Allocation Friction Between Carrier Risk and SaaS Multiple
    body: "By launching Coalition Insurance Company (CIC) and maintaining admitted insurance carrier operations, Coalition straddles two conflicting valuation regimes. Software investors value recurring high-margin ARR at technology multiples, whereas insurance regulators mandate capital surplus reserves and unearned premium lockups that restrict capital return and increase balance sheet exposure during catastrophic cyber systemic events [CI001, CI007, CI013]."
    claimRefs:
      - CI001
      - CI007
      - CI013
