chapter:
  number: 4
  title: Financials
  summary: "Coalition operates a hybrid MGA and full-stack cyber insurance carrier model with reported 2021 premium run-rate of $325M and an estimated 2024 headcount of 540 to 704 employees. While strategic capacity partnerships with Allianz Commercial and Swiss Re underpin expanding gross written premiums, private-company opacity leaves loss ratios, net commission margins, and capital burn unverified for underwriting."
sections:
  - id: revenue-model-and-streams
    title: Revenue Model, Premium Ingestion, and Commission Economics
    body: "Coalition functions primarily as a managing general agent (MGA) and tech-enabled cyber risk platform, complementing delegated authority with its own admitted carrier, Coalition Insurance Company (CIC). Its monetization engine relies on three principal cash generation mechanisms: delegated underwriting commissions on gross written premium (GWP) sourced on behalf of capacity partners, direct underwriting risk margin retained via CIC, and cybersecurity software and incident response services delivered through Coalition Incident Response and the Wirespeed threat detection platform. Historical disclosures indicated a $325M gross written premium run-rate in September 2021, representing an 800% year-over-year surge from approximately $100M in late 2020 and $50M in 2019 [CI001, CI002]. Because Coalition historically delegated balance sheet capacity to reinsurance partners such as Swiss Re, Arch Insurance North America, and Lloyd's syndicates, top-line gross premiums do not translate dollar-for-dollar into corporate GAAP revenue [CI003, CI007]. Instead, MGA operational revenue consists of base ceding commissions (typically 12% to 20% of written premium in cyber casualty lines), contingent profit-sharing commissions contingent on favorable loss ratio development, and risk assessment platform fees [CI004, CI009]. In May 2026, Allianz Commercial entered into an exclusive 10-year global cyber agreement to transition its standalone commercial cyber portfolio to Coalition, designating Coalition as primary manager of pricing, risk mitigation, and claims while granting Allianz performance-based returns and director nomination rights [CI005, CI006]. This institutional alliance secures massive multi-year distribution capacity but locks economic alignment to long-term book profitability [CI005]."
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI009
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: gtm-motion-and-cost-structure
    title: Go-to-Market Economics, Sales Efficiency, and Operational Cost Drivers
    body: "Coalition's distribution framework operates predominantly through independent wholesale and retail insurance brokerage networks across the United States, Canada, the United Kingdom, and Australia [CI003, CI005]. Wholesale and retail brokers distribute Coalition Active Insurance policies into small and midsize enterprise (SMB) cohorts as well as mid-market accounts, supported by the Broker IQ quoting portal [CI008, CI011]. The primary customer acquisition cost (CAC) component is broker commission expense, which consumes 10% to 15% of gross premium, substantially reducing initial sales cycle friction compared to enterprise SaaS direct sales motions [CI004, CI009]. On the operational cost side, Coalition's cost structure diverges significantly from traditional pure-software businesses. Beyond standard cloud infrastructure hosting expenses for continuous internet scanning, Coalition carries technical headcount for threat intelligence, security engineering, and 24/7 dedicated in-house incident response [CI008, CI010]. Corporate records indicate an expanding workforce growing from 270 employees in late 2021 to 540 employees in late 2024 and 704 reported personnel by late 2026 across distributed hubs [CI002, CI010]. Service delivery costs are heavily impacted by claims handling personnel, legal forensic retainers, and the capital requirements of holding underwriting authority across multiple state and international jurisdictions through entities like Coalition Insurance Solutions and CIC [CI007, CI010]."
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
    tableRefs:
      - TI002
  - id: capital-adequacy-and-diligence-verdict
    title: Capital Adequacy, Loss Ratios, and Private Metric Diligence Blockers
    body: "Evaluating Coalition's true financial standing requires untangling balance sheet capitalization from cumulative venture equity. Across eight funding rounds and secondary placements, Coalition has raised between $785M and $800M in equity financing, culminating in a $5.0B post-money valuation at its July 2022 Series F round, followed by strategic capital injections from Mitsui Sumitomo Insurance ($30M in March 2025) and Allianz in May 2026 [CI001, CI005, CI010, CI012]. While this extensive liquidity provides substantial operational runway for tech development and global market expansion, it is structurally distinct from insurance underwriting reserves [CI001, CI007]. Full-stack carrier CIC requires regulatory risk-based capital (RBC) and unearned premium reserves held in trust, creating working capital lockups that pure software firms avoid [CI007]. Crucially, private company opacity obscures Coalition's true loss ratios, reinsurance treaty attachment points, and net retention rates [CI013, CI014]. Although Coalition claims policyholders experience 70% to 73% fewer claims than industry averages due to automated vulnerability alerting and automated patch scanning, independent audited proof of loss ratios across mature underwriting cohorts remains unavailable in public records [CI002, CI008, CI014]. For underwriting diligence, private metric opacity on treaty ceding commissions, catastrophic reinsurance reinstatement costs, and gross retention constitutes a material diligence barrier [CI013, CI014]."
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI007
      - CI008
      - CI010
      - CI012
      - CI013
      - CI014
