  - id: TP002
    title: Feature and Capability Matrix
    columns:
      - Buying Criteria
      - Coalition
      - Legacy P&C Carriers
      - Pure Cybersecurity Vendors
      - Specialty Cyber MGAs
    rows:
      - - Continuous Attack Surface Monitoring
        - Native Active Risk Platform with automated alerts
        - Not available (underwriting relies on static annual questionnaire)
        - Comprehensive internal and external endpoint telemetry
        - External vulnerability scans using third-party data feeds
      - - Automated Quoting & Broker Portal Speed
        - Instant automated quotes generated via proprietary broker portal
        - Manual underwriting review requiring days or weeks
        - Not applicable (software vendor does not underwrite risk)
        - Rapid algorithmic quoting for small commercial risks
      - - Integrated 24/7 Incident Response
        - Dedicated in-house Coalition Incident Response (CIR) team
        - External panel of third-party forensic vendors with delayed approvals
        - Retained incident response and managed detection services
        - Contracted third-party incident response partnerships
      - - Balance Sheet Risk Absorption
        - Admitted paper via CIC (A- AM Best) plus Allianz long-term capacity
        - Immense direct balance sheet capital and corporate reserves
        - Zero risk absorption; software warranties capped at subscription fees
        - Fronting carrier paper and delegated authority capacity facilities
    notes: >-
      Evaluation across key commercial buying criteria. Unsupported and out-of-scope vendor features are
      designated as not available or not applicable based on public disclosures.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
  - id: TP003
    title: Pricing and Packaging Comparison
    columns:
      - Dimension / Mechanism
      - Coalition
      - Legacy Insurers
      - Pure Cybersecurity Vendors
      - Buyer Implication
    rows:
      - - Pricing Model & Unit Basis
        - Annual gross written premium with bundled Active Risk Platform
        - Flat annual premium based on revenue band and industry classification
        - Annual SaaS subscription priced per protected endpoint or user seat
        - Coalition offsets standalone security software spend by bundling tools into premium
      - - Risk-Remediation Premium Discounts
        - Premium credits and discounts provided upon resolving critical security alerts
        - Standard actuarial class rating with no real-time remediation incentives
        - Multi-year enterprise discounting and volume tier price breaks
        - Policyholders lower ongoing insurance costs by acting on automated risk notifications
      - - Executive Protection Bundling
        - Delegated authority for Cyber, D&O, EPL, Fiduciary, and Crime packages
        - Commercial package policies bundling property, casualty, and cyber coverage
        - Software-only endpoint suites; zero management liability coverage
        - Coalition provides consolidated professional liability packaging for corporate buyers
      - - Treaty Structure & Capacity Durability
        - 10-year exclusive Allianz Commercial partnership and CIC admitted balance sheet
        - Traditional global reinsurance treaties and retained carrier capital
        - Not applicable (non-insurance corporate balance sheet)
        - Long-term carrier alignment mitigates capacity volatility seen during hard market cycles
    notes: >-
      Pricing and packaging structures derived from published commercial terms, carrier partnership releases,
      and delegated authority filings as of 2026.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
