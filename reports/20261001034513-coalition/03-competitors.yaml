        - Exposed to systemic cyber catastrophe tail risk; relies on reinsurance treaties
      - - Legacy P&C Insurers (Travelers, Chubb, AXA XL)
        - Incumbent Commercial Carriers
        - Billions in balance sheet capital; entrenched national broker access
        - Mid-market to Global Enterprise
        - Comprehensive multi-line policy bundling, top-tier financial strength
        - Static annual questionnaire underwriting, zero proactive threat mitigation
      - - Pure-Play Cybersecurity Vendors (CrowdStrike, SentinelOne)
        - Endpoint Security & Threat Detection
        - Multi-billion ARR scale; millions of enterprise endpoints protected
        - Mid-market to Fortune 500
        - Deep kernel-level telemetry, automated remediation, specialized SOC
        - Software-only model with no balance-sheet risk transfer or financial indemnity
      - - Specialty Cyber MGAs (Cowbell Cyber, Corvus/Travelers)
        - Tech-Enabled Cyber MGAs
        - Hundreds of millions in managed GWP; delegated authority agreements
        - Small Business to Lower Mid-market
        - Automated digital broker quoting, proprietary continuous scoring
        - Dependent on carrier capacity renewals; vulnerable to treaty pullbacks
    notes: >-
      Competitor profiles reflect verified 2026 public corporate releases, carrier announcements, and
      industry underwriting structures. Incumbents maintain multi-line balance sheets, while pure security
