callouts:
  - calloutType: insight
    title: The Allianz Commercial Alliance as a Strategic Distribution Moat
    body: >-
      The 10-year exclusive global cyber partnership between Allianz Commercial and Coalition fundamentally
      reshapes commercial cyber distribution. By transitioning Allianz's commercial cyber portfolio to
      Coalition, the agreement establishes Coalition as the primary underwriter across all commercial
      segments while securing long-term capacity and multinational distribution scale.
    claimRefs:
      - CP002
      - CP010
  - calloutType: risk
    title: Proprietary Telemetry Protects Against Coalition Loyalty Pitfalls
    body: >-
      In contrast to shared coalition loyalty schemes where businesses share customer data with competitors
      at a 2% to 5% sales margin cost, Coalition operates a closed risk ecosystem. By retaining proprietary
      claims and threat telemetry across 100,000+ policyholders, Coalition preserves pricing advantages
      without subsidizing rival insurers.
    claimRefs:
      - CP001
      - CP014
      - CP016
