chapter:
  number: 3
  title: Competitors
  summary: >-
    Coalition competes in the commercial cyber risk market by pairing automated continuous
    attack surface monitoring and in-house incident response with delegated underwriting authority
    and admitted carrier paper. While legacy multi-line insurers rely on static annual questionnaires
    and cybersecurity vendors offer software without balance-sheet indemnification, Coalition's
    10-year exclusive alliance with Allianz Commercial positions it to absorb global commercial cyber
    portfolios, though customer retention depends heavily on human service delivery alongside automation.
sections:
  - id: competitive-landscape-overview
    title: 'Competitive Landscape: Active Insurance vs. Legacy Carriers and Pure-Play Cybersecurity'
    body: >-
      The commercial cyber risk landscape divides into three distinct strategic models: incumbent
      property-and-casualty carriers, standalone cybersecurity software vendors, and technology-enabled
      active insurers. Incumbents such as Travelers, Chubb, and AXA XL control massive balance-sheet
      capacity and established broker networks, but their underwriting remains anchored in static annual
      questionnaires that fail to track vulnerabilities between policy renewal cycles. Conversely,
      pure-play cybersecurity vendors like CrowdStrike and SentinelOne provide deep endpoint telemetry
      and automated threat detection, yet they operate strictly as software licensors with zero financial
      risk transfer or balance-sheet indemnification. Coalition bridges this structural divide through its
      Active Insurance model, combining continuous external attack surface scanning with full-stack carrier
      licensing and delegated capacity to mitigate vulnerabilities before claims occur.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
    tableRefs:
      - TP001
  - id: capability-and-feature-matrix
    title: 'Capability and Feature Analysis: Automated Underwriting, Telemetry, and Incident Response'
    body: >-
      Commercial buyers evaluate cyber insurance alternatives across four primary buying criteria:
      monitoring frequency, quoting speed, incident response integration, and balance-sheet capacity.
      Coalition provides real-time vulnerability detection through its proprietary Active Risk Platform,
      delivering automated security alerts directly to policyholders and brokers. This active approach
      drives a company-reported 73% reduction in claims frequency compared to industry averages. When security
      incidents occur, Coalition deploys in-house incident response personnel to contain breaches and recover
      funds, contrasting with legacy insurers who refer policyholders to third-party vendor panels subject to
      delayed deductible approvals. However, market evidence indicates that automation alone does not guarantee
      retention; responsive human expertise and client-facing service remain decisive factors when complex
      claims arise.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
    tableRefs:
      - TP002
  - id: pricing-packaging-and-distribution
    title: 'Pricing, Packaging, and Distribution: The Allianz Alliance and Carrier Capacity'
    body: >-
      Distribution power and capacity access govern commercial cyber underwriting viability. In May 2026,
      Allianz Commercial and Coalition expanded their global partnership into a 10-year exclusive strategic
      agreement under which Allianz transitions its standalone commercial cyber portfolio across all
      commercial segments to Coalition. Under the transaction, Coalition assumes primary responsibility for
      pricing, product development, risk mitigation, and claims management, while Allianz provides long-term
      insurance capacity, extensive multinational distribution, and board-level governance. To diversify
      beyond delegated managing general agency (MGA) structures, Coalition established Coalition Insurance
      Company (CIC) as an admitted carrier with an A.M. Best rating of A-, enabling direct quote issuance
      alongside delegated capacity arrangements, captives, and sidecar reinsurance facilities.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
    tableRefs:
      - TP003
  - id: moat-durability-and-displacement
    title: 'Moat Durability, Switching Costs, and Displacement Risks'
    body: >-
      Coalition's competitive moat rests on proprietary threat telemetry gathered across more than 100,000
      policyholders and multi-year capacity commitments. Unlike shared multi-brand coalition loyalty schemes
      where participants pool customer data with direct rivals at a 2% to 5% sales margin cost, Coalition
      operates a closed proprietary risk ecosystem that protects customer insights and pricing algorithms.
      Displacement threats stem primarily from two vectors: legacy carriers acquiring or partnering with
      specialized attack surface scanning vendors to mimic automated underwriting, and sophisticated
      enterprises opting for internal IT hardening paired with captive self-insurance. Furthermore,
      macroeconomic and systemic tail risks—such as correlated cloud outages or catastrophic cyber perils—test
      whether tech-enabled loss mitigation can withstand industry-wide loss events without exhausting
      reinsurance limits.
    claimRefs:
      - CP013
      - CP014
      - CP015
      - CP016
    figureRefs:
      - FP001
