runDate: 2026-10-01
company:
  name: Coalition
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Coalition's evidenced market is commercial cyber insurance augmented by proactive security
    services, with businesses as insured buyers, brokers as distributors, and carriers and
    reinsurers supplying capacity. The assigned evidence supports Coalition's served footprint
    and an expanding Allianz channel, but it does not support a defensible cyber-insurance
    TAM, SAM, SOM, growth rate, or obtainable-spend estimate.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Coalition competes for commercial cyber-risk spend, not for every dollar spent on
      cybersecurity. Its own proposition combines cyber insurance coverage with monitoring,
      threat response, and security services, while its carrier materials describe admitted
      insurance capacity for small and midsize businesses. The relevant boundary therefore
      includes standalone commercial cyber insurance and the risk-mitigation services attached
      to underwriting and claims. It excludes unrelated content-provenance software, AI compute
      infrastructure, and financial-services benchmarking, despite those markets appearing in
      searches for the ambiguous word "Coalition." Status-quo substitutes include buying
      traditional insurance without active monitoring, assembling security tools separately,
      retaining risk, or relying on internal security and incident-response teams.
    claimRefs: [CM001, CM007, CM008, CM010, CM015]
    tableRefs: [TM001]
  - id: sizing-evidence
    title: Evidence-constrained sizing
    body: >-
      The assigned pool does not establish a defensible market-wide premium base, TAM, SAM, SOM,
      or cyber-insurance CAGR. Coalition's homepage supplies a current company scale indicator
      of more than 100,000 clients, and Allianz names six initial rollout markets, but neither
      measure is a market denominator or obtainable-spend estimate. The only numerical market
      forecast in the allocated pool is for C2PA content-provenance solutions, a different
      category, while another net-new result concerns an AI compute coalition. Those values are
      explicitly excluded rather than repurposed. Valuation work should therefore treat market
      size as an open diligence item and use policy count, premium, retention, loss ratio, and
      geography-specific eligibility data for a bottom-up model.
    claimRefs: [CM002, CM006, CM011, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-and-value-chain
    title: Buyer, user, payer, and capacity chain
    body: >-
      The insured business is the economic payer and beneficiary, but adoption passes through
      several institutions. Brokers quote and place coverage; Coalition prices risk, develops
      products, supplies mitigation and incident response, and manages claims; insurers and
      reinsurers provide delegated authority and balance-sheet capacity. Coalition's capacity
      role spans partners, an admitted carrier, captives, sidecars, and reinsurance structures.
      For larger multinational accounts, Allianz contributes brand, distribution, local market
      access, underwriting support, and long-term capacity. This makes broker enablement,
      carrier compliance, auditability, data sharing, and reinsurance relationships adoption
      dependencies rather than back-office details.
    claimRefs: [CM004, CM005, CM007, CM009, CM016]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      Coalition's clearest demand evidence is channel expansion: Allianz describes cyber
      coverage as high-demand and agreed to an exclusive global commercial partnership with
      phased geographic rollout and at least ten years of economic alignment. Coalition also
      claims that its policyholders experience 73% fewer claims, which, if independently
      validated on comparable cohorts, could improve buyer ROI and underwriting economics.
      However, the assigned source gives no denominator, observation period, control group, or
      independent methodology for that outcome. Regulatory approvals, delegated-authority
      compliance, capacity availability, audit requirements, and dependence on broker and
      carrier channels can slow adoption. Without premium, retention, loss-ratio, and renewal
      evidence, these drivers support strategic relevance but not a precise valuation uplift.
    claimRefs: [CM003, CM004, CM005, CM009, CM014]
