  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: Independent cyber-insurance premium totals and growth by geography, segment, and business size, plus Coalition's eligible and served premium base.
      whyItMatters: A market denominator and eligibility filter are required to distinguish TAM, SAM, and a realistically obtainable share.
      diligencePath: Obtain regulator or trade-association premium data and reconcile it to Coalition policy count, GWP, geography, limits, and underwriting eligibility.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: claims-outcomes
      missingEvidence: Cohort definition, denominator, period, control group, and independent validation for the reported 73% fewer-claims outcome.
      whyItMatters: The claimed outcome is central to buyer ROI and underwriting differentiation but cannot be compared without methodology.
      diligencePath: Request the underlying actuarial study and test loss frequency and severity against matched policyholder cohorts.
      relatedQuestionRefs: [QM008]
    - type: private-evidence-only
      severity: material
      topic: buyer-economics
      missingEvidence: Premiums, renewal rates, broker commissions, retention, loss ratios, capacity costs, and segment-level budget ownership.
      whyItMatters: These inputs determine willingness to pay, adoption durability, unit economics, and the obtainable market.
      diligencePath: Review the policy, claims, renewal, broker, and reinsurance data rooms by cohort, geography, and channel.
      relatedQuestionRefs: [QM003, QM008]
    - type: missing-source
      severity: minor
      topic: regulatory-approvals
      missingEvidence: Completion status and market-by-market regulatory approvals for the Allianz transaction and phased rollout.
      whyItMatters: Approval timing can delay channel expansion and changes the date at which distribution benefits become realizable.
      diligencePath: Obtain closing notices and regulator or carrier filings for each named initial market.
      relatedQuestionRefs: [QM004, QM006]
