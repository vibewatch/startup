figures:
  - id: FM001
    title: Evidence boundary for Coalition's addressable market
    type: pyramid
    summary: >-
      The evidence narrows from broad business digital risk to Coalition's served client and
      rollout indicators, but stops before a quantified obtainable-spend layer.
    data:
      items:
        - label: Businesses exposed to digital risk
          value: Broad exposure
          detail: No total business denominator is established in the assigned evidence.
          tone: neutral
        - label: Commercial cyber insurance
          value: Included category
          detail: Standalone commercial cyber coverage is the core insured boundary.
          tone: neutral
        - label: Active insurance
          value: Coverage plus risk mitigation
          detail: Coalition combines insurance with monitoring, mitigation, and response.
          tone: positive
        - label: Allianz initial rollout
          value: 6 named markets
          detail: US, UK, Australia, Germany, Denmark, and Sweden are named as initial markets.
          tone: positive
        - label: Coalition served base
          value: 100,000+ clients
          detail: Company-reported client count; it is not an addressable-market denominator.
          tone: positive
        - label: Quantified obtainable spend
          value: Not established
          detail: Premium, eligibility, retention, and market-denominator evidence is missing.
          tone: warning
    approximationNotes: "The layers are categorical evidence boundaries, not proportional areas; only the two displayed counts are source-reported."
    claimRefs: [CM001, CM002, CM006, CM013, CM015]
callouts:
  - calloutType: risk
    title: Do not import the available 25.9% CAGR
    body: >-
      The figure belongs to the C2PA content-provenance market, not commercial cyber insurance.
      Using it for Coalition would create a category error and an unsupported growth assumption.
    claimRefs: [CM011, CM013]
