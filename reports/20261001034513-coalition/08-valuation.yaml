callouts:
  - calloutType: recommendation
    title: Decision Mandate - Conditional Proceed Pending Data Room Verification
    body: >-
      Coalition's formidable distribution through Allianz and its proprietary active scanning platform establish it as the category leader in tech-enabled cyber underwriting. However, private valuations exceeding $5.0B cannot be underwritten responsibly without accessing granular statutory loss ratios, reinsurance treaty detachment points, and GAAP revenue figures. Investors should maintain an active track and request full data room disclosures before participating in any liquidity or primary financing event.
    claimRefs:
      - CV002
      - CV004
      - CV009
      - CV011
      - CV013
