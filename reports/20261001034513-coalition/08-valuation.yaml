company:
  name: Coalition
chapter:
  number: 8
  title: Valuation
  summary: >-
    Coalition reached a $5.0B Series F valuation in 2022 and secondary market benchmarks indicate marks around $5.29B in July 2026, supported by an estimated $1.05B in cumulative funding and a landmark multi-year capacity partnership with Allianz Commercial. However, complete financial opacity across GAAP revenue, loss ratios, and retention metrics necessitates an objective research-more recommendation and a fair-to-stretched valuation stance pending data room disclosure.
sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      Coalition presents a differentiated thesis as an Active Insurance pioneer that integrates real-time risk assessment, dynamic threat monitoring, and full-stack cyber underwriting [CV001, CV003]. The company's expansion into a licensed, full-stack carrier via Coalition Insurance Company demonstrates operational maturity and balance-sheet sophistication [CV006]. The strategic partnership with Allianz Commercial, which establishes Coalition as Allianz's exclusive global commercial cyber partner and transitions underwriting and pricing responsibilities over a minimum 10-year term, creates an unprecedented distribution moat [CV004, CV007]. Conversely, the core anti-thesis centers on extreme financial opacity and catastrophe risk. Coalition does not publicly disclose GAAP revenue, net margins, customer retention, or cohort-specific loss ratios [CV011, CV013]. While marketing claims assert lower claims frequency, independent actuarial verification of underwriting profitability remains unavailable [CV003, CV010].
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
    tableRefs:
      - TV002
    figureRefs: []
  - id: recommendation-and-valuation-context
    title: Recommendation Framework and Financing History
    body: >-
      We assign Coalition a research-more recommendation with medium confidence, a high risk rating, and a fair valuation stance [CV009, CV012]. The company's capital trajectory reflects rapid expansion from a $10M Series A in 2018 to a $205M Series E at a $3.5B valuation in September 2021, followed by a $221M Series F in June 2022 that brought valuation to $5.0B [CV001, CV002, CV005]. Secondary pricing intelligence from Forge Global benchmarks Coalition at a $5.29B Series G post-money mark with $1.05B in total funding as of July 2026, alongside active secondary trading on the Nasdaq Private Market [CV002, CV005]. Without audited gross written premium (GWP) and loss development cohorts, underwriting an investment at a >$5B valuation is premature for risk-sensitive capital, warranting a disciplined hold until data room verification confirms sustainable unit economics [CV009, CV011, CV013].
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV011
      - CV012
      - CV013
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: valuation-scenarios-and-diligence
    title: Scenario Analysis and Exit Readiness
    body: >-
      Our scenario analysis spans three paths anchored against cyber market multiples and underwriting durability. Under the bull case, Coalition executes seamlessly on the Allianz portfolio transition, expanding beyond 100,000 policyholders and compounding admitted paper premiums, justifying an enterprise valuation of $7.5B to $9.0B upon an eventual public listing [CV002, CV004, CV007]. In the base case, sustained growth in North American SMB cyber offset by reinsurance capacity costs and competitive pressure from incumbent carriers supports a valuation range of $4.8B to $5.5B, keeping the current mark fair [CV002, CV008, CV012]. The bear case reflects systemic cyber contagion, multiple reinsurance treaty repricings, or adverse loss ratio development that compresses private valuations toward $2.5B to $3.5B [CV001, CV010, CV013]. Closing these valuation variances requires rigorous diligence into reinsurance attachment points, cohort loss ratios, and broker retention [CV008, CV011].
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
    tableRefs:
      - TV003
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Stance / Rating
      - Analytical Basis
      - Investment Implication
    rows:
      - - Recommendation
        - research-more
        - Active insurance technology moat is offset by absence of disclosed loss ratios and financials
        - Maintain position; do not deploy fresh primary capital without audited loss triangles
      - - Confidence
        - medium
        - High confidence in enterprise footprint and Allianz alliance; low visibility into GAAP unit economics
        - Diligence must focus on cohort performance and reinsurance treaty retention terms
      - - Risk Rating
        - high
        - Catastrophic systemic cyber risk exposure combined with high private capital valuation multiples
        - Demand liquidation preference clarity and downside protection covenants
      - - Valuation Stance
        - fair
        - $5.0B Series F and $5.29B Forge secondary marks reflect reasonable strategic value given Allianz scale
        - Require audited GWP run-rate confirmation before endorsing any premium round entry
    notes: "Recommendation and risk ratings synthesize private valuation marks, strategic capacity agreements, and structural opacity regarding audited insurance loss metrics."
    claimRefs:
      - CV002
      - CV004
      - CV009
      - CV011
      - CV012
  - id: TV002
    title: Investment Thesis and Anti-Thesis Matrix
    columns:
      - Dimension
      - Core Argument
      - Supporting Evidence
      - Thesis-Break Trigger
    rows:
      - - Market & Product Moat
        - Active Insurance platform detects and mitigates threats dynamically, reducing policyholder claims
        - Scanning infrastructure across over 100k clients paired with licensed admitted carrier entity CIC
        - Policyholder claim frequency converges to industry average or major security failure in monitoring platform
      - - Strategic Distribution
        - Exclusive global cyber insurance partnership with Allianz Commercial unlocks worldwide scale
        - Minimum 10-year partnership transitioning Allianz commercial cyber portfolio to Coalition platform
        - Early termination of Allianz treaty or failure to obtain regulatory approvals across global jurisdictions
      - - Underwriting Opacity
        - Complete absence of public cohort loss ratios obscures true portfolio loss development
        - Company claims 70-73% fewer claims but provides no audited statutory combined ratios
        - Disclosed combined ratio exceeding 105% in commercial book or severe systemic cyber loss event
      - - Financing & Valuation
        - Prior $5.0B-$5.29B private valuations price in flawless growth without disclosing GAAP margins
        - Forge Global July 2026 mark at $5.29B with $1.05B total capital raised
        - Down-round restructuring or investor liquidation preference overhang exceeding equity value
    notes: "Thesis dimensions evaluate technology differentiation, distribution scale, underwriting durability, and private market valuation marks."
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: Bull Base Bear Valuation Scenarios
    columns:
      - Scenario
      - Valuation Range
      - Core Operating Assumptions
      - Return & Diligence Implication
    rows:
      - - Bull Case
        - $7.5B - $9.0B
        - Flawless integration of Allianz global portfolio, sustained sub-60% loss ratio, admitted carrier CIC expansion
        - 1.5x - 1.8x upside from current secondary mark; supports premium IPO listing
      - - Base Case
        - $4.8B - $5.5B
        - Steady SMB market adoption, GWP expansion at 15-25% annually, reinsurance capacity costs remain stable
        - 0.9x - 1.0x return; current valuation reflects fair pricing of technology and distribution platform
      - - Bear Case
        - $2.5B - $3.5B
        - Systemic zero-day ransomware wave spikes loss ratios, reinsurance capacity contracts, growth decelerates
        - Down-round risk of 35-50% contraction; preference overhang severely impairs common equity
    notes: "Scenario ranges benchmarked against reported Series F valuation of $5.0B, Forge secondary estimates of $5.29B, and cyber market capacity constraints."
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV010
      - CV012
      - CV013
