evidenceGaps:
  - type: missing-source
    severity: material
    topic: adverse-evidence
    missingEvidence: >-
      Independent reporting or records on lawsuits, regulatory actions, outages, coverage disputes, or material
      leadership departures.
    whyItMatters: >-
      The assigned adverse query returned no usable source, so the chapter cannot test company and partner narratives
      against independently documented negative events.
    diligencePath: >-
      Run targeted court, insurance-regulator, corporate-registry, incident, and executive-change searches in a later
      evidence-authorized review.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, cash, loss ratios, reserves, headcount, debt, current GWP, and current customer definitions.
    whyItMatters: >-
      Historical funding, GWP, and customer figures do not establish current scale, profitability, solvency, or cash
      runway.
    diligencePath: >-
      Request audited statements, statutory filings, loss-development triangles, a current employee roster, and
      metric-definition reconciliations in the data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Complete current executive and board rosters, committee assignments, voting rights, biographies, succession plans,
      and material leadership changes.
    whyItMatters: >-
      The public pages identify only a subset of leaders and do not permit a complete key-person or governance
      assessment.
    diligencePath: >-
      Obtain the organization chart, board minutes, committee charters, director rights schedule, and executive
      departure history.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-partner-economics
    missingEvidence: >-
      Current cap table, preference stack, secondary trade evidence, debt, Allianz transaction economics, and Coalition
      Re treaty terms.
    whyItMatters: >-
      Control, dilution, liquidity, capacity concentration, and transferred-book economics cannot be quantified from
      announcement-level evidence.
    diligencePath: >-
      Request the fully diluted cap table, financing documents, debt schedule, Allianz definitive agreements, and
      reinsurance treaty summaries.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent cyber-insurance premium totals and growth by geography, segment, and business size, plus Coalition's
      eligible and served premium base.
    whyItMatters: >-
      A market denominator and eligibility filter are required to distinguish TAM, SAM, and a realistically obtainable
      share.
    diligencePath: >-
      Obtain regulator or trade-association premium data and reconcile it to Coalition policy count, GWP, geography,
      limits, and underwriting eligibility.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: claims-outcomes
    missingEvidence: >-
      Cohort definition, denominator, period, control group, and independent validation for the reported 73%
      fewer-claims outcome.
    whyItMatters: >-
      The claimed outcome is central to buyer ROI and underwriting differentiation but cannot be compared without
      methodology.
    diligencePath: Request the underlying actuarial study and test loss frequency and severity against matched policyholder cohorts.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Premiums, renewal rates, broker commissions, retention, loss ratios, capacity costs, and segment-level budget
      ownership.
    whyItMatters: These inputs determine willingness to pay, adoption durability, unit economics, and the obtainable market.
    diligencePath: Review the policy, claims, renewal, broker, and reinsurance data rooms by cohort, geography, and channel.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: missing-source
    severity: minor
    topic: regulatory-approvals
    missingEvidence: Completion status and market-by-market regulatory approvals for the Allianz transaction and phased rollout.
    whyItMatters: Approval timing can delay channel expansion and changes the date at which distribution benefits become realizable.
    diligencePath: Obtain closing notices and regulator or carrier filings for each named initial market.
    relatedQuestionRefs:
      - QM004
      - QM006
  - type: private-evidence-only
    severity: material
    topic: competitor-loss-ratios
    missingEvidence: >-
      Granular statutory cyber loss ratio benchmarks comparing Coalition's admitted and delegated portfolios directly
      against standalone cyber competitors (e.g. Travelers, Beazley, AXA XL) across 2024-2026.
    whyItMatters: >-
      Validating whether Coalition's 73% fewer claims claim translates into an enduring loss-ratio underwriting
      advantage requires audited statutory loss ratios by policy cohort.
    diligencePath: >-
      Request NAIC statutory Exhibit of Premiums and Losses (Cyber Insurance line) and reinsurance treaty performance
      packs from Coalition's data room.
    relatedQuestionRefs:
      - QP001
      - QP002
  - type: missing-source
    severity: minor
    topic: allianz-retention-terms
    missingEvidence: >-
      Contractual renewal retention rates and loss-share covenants within the 10-year exclusive Allianz Commercial
      partnership agreement.
    whyItMatters: >-
      Determines whether enterprise cyber policyholders transferred from Allianz renew with Coalition or churn back to
      conventional broker placements.
    diligencePath: >-
      Review the full Allianz Commercial strategic collaboration agreement and transition governance schedule during due
      diligence.
    relatedQuestionRefs:
      - QP002
      - QP004
  - type: private-evidence-only
    severity: material
    topic: loss-ratio-and-retention
    missingEvidence: Audited statutory loss ratios by annual policy cohort and annual policyholder gross retention rates.
    whyItMatters: >-
      Determines whether proactive vulnerability mitigation yields structural underwriting profit or whether
      catastrophic cyber tail events erode MGA margins.
    diligencePath: >-
      Obtain confidential data room access to Coalition's treaty bordereaux, reinsurance loss triangles, and historical
      renewal rates.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reinsurance-treaty-terms
    missingEvidence: Reinsurance treaty attachment points, ceding commission schedules, and quota-share participation splits.
    whyItMatters: MGA profitability directly depends on net ceding allowances versus direct broker distribution commissions.
    diligencePath: Review executed reinsurance treaty slips and delegated underwriting agreements with Swiss Re and Arch Insurance.
    relatedQuestionRefs:
      - QI001
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: proprietary-tooling-verification
    missingEvidence: >-
      Independent third-party penetration testing reports, external attack surface scanning benchmarks, and algorithmic
      false-positive audits for Coalition's proprietary threat detection engines.
    whyItMatters: >-
      Without independent technical validation, policyholders and capacity partners cannot independently verify whether
      Coalition's claimed 73% claim reduction stems from superior scanning technology or underwriting selection bias.
    diligencePath: >-
      Request SOC 2 Type II reports, independent security testing evaluations, and false-positive/negative rate
      telemetry directly from Coalition's security engineering team.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention and concentration
    missingEvidence: >-
      Cohort-level policy renewal, gross retention, net revenue retention, churn, expansion revenue, broker
      concentration, and top-customer share.
    whyItMatters: >-
      These metrics determine whether the reported client footprint is durable and whether growth depends on a small
      number of intermediaries or capacity partners.
    diligencePath: >-
      Request policy and product cohorts by bind date, segment, broker, carrier, premium, renewal status, and
      security-product attach rate from the data room.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU001
      - TU002
  - type: missing-source
    severity: material
    topic: customer scale
    missingEvidence: >-
      A dated client-count reconciliation defining active organizations, policies, security-product users,
      cancellations, and duplicate multi-policy customers.
    whyItMatters: >-
      The 100k+ client statement cannot be converted into active adoption, growth, or average revenue per customer
      without a population definition.
    diligencePath: >-
      Obtain the client-count data dictionary and quarterly active-policy bridge, then reconcile it to premium and
      product-user records.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: >-
      Multiple named target-company customers with deployment dates, production status, customer-authored confirmation,
      scope, and measurable outcomes.
    whyItMatters: >-
      One indexed customer story cannot validate adoption breadth, outcome repeatability, or reference quality across
      segments.
    diligencePath: >-
      Request a referenceable customer roster and interview at least three customers across SMB insurance, enterprise
      cyber, and Wirespeed security products.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive nationwide state DOI filing records detailing admitted rate and form approval statuses across all 50
      US states for Coalition Insurance Company.
    whyItMatters: >-
      Without state-by-state filing records, the pace and geographical completeness of Coalition's transition from
      surplus lines to admitted paper cannot be independently confirmed.
    diligencePath: >-
      Request Coalition's regulatory filing schedule and state-by-state approval status matrix directly from the data
      room.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: reinsurance-treaty-terms
    missingEvidence: >-
      Specific attachment points, aggregate loss limits, and reinstatement fee structures across Coalition's
      multi-carrier reinsurance panels.
    whyItMatters: >-
      Reinsurance attachment and exhaustion thresholds dictate residual solvency exposure during widespread correlated
      cyber loss events.
    diligencePath: Review treaty slips and reinsurance program summaries under non-disclosure agreement in phase two diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
