chapter:
  number: 5
  title: "Product & Technology"
  summary: "Coalition combines active external attack surface monitoring and automated security alerting with admitted and surplus cyber insurance underwriting, supporting over 100,000 policyholders globally. The company leverages a modern Snowflake and dbt medallion data platform for exposure modeling, while scaling global commercial distribution and underwriting responsibility through a strategic long-term partnership with Allianz Commercial. Key diligence blockers include unverified proprietary scanning algorithms and financial opacity around direct carrier loss ratios."
sections:
  - id: "active-insurance-product-definition"
    title: "Active Insurance Model & Customer Workflow Definition"
    body: "Coalition defines its product offering as Active Insurance, an operating model that combines comprehensive cyber insurance underwriting with automated perimeter monitoring, risk assessment, and incident response services. Traditional commercial cyber insurance operates on a passive claims-reimbursement model where underwriters evaluate static annual questionnaires and assess damages only after an intrusion occurs. In contrast, Coalition's Active Insurance platform continuously scans external corporate attack surfaces, flagging emerging software vulnerabilities, misconfigured cloud ports, and unpatched perimeter services before malicious actors exploit them. According to company disclosures, policyholders participating in active monitoring experience seventy-three percent fewer claims relative to industry averages. Insurance protection is delivered through admitted and surplus lines paper, including Coalition Insurance Company, an admitted carrier holding an A- rating from A.M. Best. By bundling risk engineering telemetry directly into the insurance contract, Coalition seeks to turn cyber loss prevention from an annual audit into an ongoing, real-time operational feedback loop across small and mid-sized enterprises."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
    figureRefs: []
  - id: "product-lines-and-workflow-integration"
    title: "Product Line Portfolio & Broker Workflow Integration"
    body: "Coalition's product and service portfolio spans policyholder risk management, insurance carrier paper, and broker distribution tooling. For policyholders, the primary interaction surface is the Active Risk Platform and Coalition Security, which deliver continuous perimeter vulnerability scanning, actionable remediation advisories, and 24/7 access to in-house incident response and digital forensics teams. For distribution partners, Coalition provides Broker IQ, a digital underwriting portal enabling independent brokers to generate automated bindable quotes in minutes rather than days. Operational responsibility is further broadened through major carrier partnerships, notably an expanded long-term global agreement with Allianz Commercial announced in May 2026. Under this multi-year collaboration, Coalition takes primary responsibility for pricing, product development, risk mitigation, and claims management for Allianz's standalone commercial cyber insurance portfolio across markets including the United States, United Kingdom, Australia, Germany, Denmark, and Sweden. This distribution motion integrates third-party broker sales into Coalition's proprietary digital binding workflow."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE007"
    tableRefs:
      - "TE002"
    figureRefs: []
  - id: "technology-stack-and-operating-architecture"
    title: "Enterprise Data Architecture & Technical Infrastructure"
    body: "Coalition's technical operating infrastructure relies on a hybrid architecture bridging cloud-native data engineering with complex insurance balance sheet vehicles. The data platform is built upon a modern data stack centered on Snowflake and dbt, deploying governed Medallion pipeline architectures (bronze, silver, gold) to ingest, normalize, and transform high-velocity security scan telemetry alongside historical insurance loss runs. Batch and streaming ingestion workflows utilize technologies such as Kafka, Kinesis, and orchestration frameworks to process telemetry at scale, powering actuarial modeling, underwriting automation, and machine learning feature stores for risk scoring and RAG-driven analytical workflows. On the balance sheet side, Coalition operates as an MGA and full-stack carrier, deploying capacity across Coalition Insurance Company (CIC), captive risk vehicles, reinsurance sidecars, and delegated underwriting authority agreements from global reinsurance leaders such as Allianz, Arch Insurance, Ascot Group, and Swiss Re Corporate Solutions. Enterprise data governance controls enforce role-based access control hierarchies, column-level masking, and PII tokenization across all regulated financial and policyholder environments."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "technical-differentiation-and-diligence-risks"
    title: "Technical Differentiation, Governance & Key Diligence Blockers"
    body: "Coalition's technological differentiation centers on its proprietary scanning telemetry and tightly integrated claims feedback loop, which enable faster quoting and proactive incident mitigation compared to legacy commercial carriers. Strategic carrier alliances, such as the expanded 2026 Allianz partnership, validate the scalability of Coalition's underwriting engine across multinational commercial lines. Broader organizational and defense research on technology alliances demonstrates that coordinating commercial technology platforms across institutional boundaries requires structured integration protocols and decision governance frameworks to prevent operational friction and sustain platform agility as product lines expand. Despite these operational strengths, significant technical and diligence gaps persist. Coalition's proprietary scanning algorithms, automated vulnerability detection rates, and scanning false-positive frequencies remain private and lack independent third-party audit verification. Furthermore, because external scans only evaluate public-facing perimeter assets, internal network threats such as lateral movement and credential theft cannot be directly assessed, leaving the true predictive power of Coalition's underwriting technology dependent on private claims data."
    claimRefs:
      - "CE006"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs: []
    figureRefs: []
