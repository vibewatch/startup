    title: Revenue Model Bridge
    type: flow
    layout: standard
    summary: >
      Flow showing how customer activity would convert into revenue and gross profit for Harmonic, with most downstream
      nodes still prospective because no revenue, pricing, or cost-to-serve is disclosed.
    data:
      nodes:
        - id: n1
          label: Free users (API, iOS app, research community)
        - id: n2
          label: Conversion to paid usage (prospective, unproven)
        - id: n3
          label: Usage-based API fees + enterprise verification contracts (no disclosed pricing)
        - id: n4
          label: Recognized revenue (none disclosed to date)
        - id: n5
          label: Less compute cost-to-serve (100K+ CPUs; undisclosed per-run cost)
        - id: n6
          label: Gross profit / margin (undefined; depends on pricing vs compute cost)
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
