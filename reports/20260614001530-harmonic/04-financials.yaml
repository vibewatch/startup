sections:
  - id: revenue-and-monetization
    title: Revenue, Pricing, and Monetization
    body: >
      Harmonic's financial profile begins from an unusual starting point: there is no disclosed revenue, ARR, or
      recognized sales as of mid-2026, and independent profiles characterize the company as pre-commercial. Its only
      public monetization surfaces are the Aristotle formal-reasoning API and an iOS application, neither of which
      carries publicly disclosed list pricing. The revenue streams that could eventually matter — usage-based API fees
      and enterprise verification contracts — are prospective rather than demonstrated, with no disclosed bookings,
      pipeline, or recognition policy. The fastest credible path to revenue quality is likely enterprise code
      verification, the domain where Harmonic reports a state-of-the-art VERINA result, but no enterprise contracts or
      pricing are yet public.

      Because pricing is undisclosed, realized-versus-list pricing, discounting, and revenue recognition cannot be
      assessed from outside the company. What is visible on the monetization side is, paradoxically, outflow rather
      than inflow: a $1M mathematician sponsorship program announced in January 2026 and a $300K donation to the Lean
      FRO in February 2026. These are community-investment spend that builds ecosystem goodwill and seeds adoption,
      not revenue, and they signal a strategy that deliberately defers commercialization in favor of capability and
      community building.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI010
      - CI022
      - CI024
      - CI030
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit Economics
    body: >
      On the cost side, the defining characteristic is capital intensity. The dominant driver is compute:
      large-scale reinforcement learning on preemptible CPU fleets reported to scale beyond one hundred thousand CPUs,
      alongside specialized research and engineering talent across Palo Alto and London. Gross margin is undefined
      publicly because there is no recognized revenue and no disclosed cost-to-serve per proof or verification run,
      and the service-delivery cost per Aristotle run — undisclosed today — will be the key determinant of any future
      gross margin given the compute-bound architecture. Working capital and capex specifics are also undisclosed; the
      asset base is effectively intangible — models, data, and talent — plus rented preemptible compute rather than
      owned infrastructure.

      Sales-efficiency proxies are equally unavailable. Harmonic has no disclosed paid customers and runs a bottom-up,
      research-led motion, so customer acquisition cost, payback, and sales cycle cannot be computed. Its
      go-to-market spend is presently oriented to community investment — a free API and $1M in sponsorships — rather
      than a measurable paid-acquisition channel. The honest conclusion is that the unit-economics picture is a series
      of null cells whose resolution requires management disclosure, and these gaps are catalogued explicitly rather
      than estimated with false precision.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
      - CI023
      - CI025
      - CI031
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: capital-adequacy-and-verdict
    title: Capital Adequacy, Traction Gaps, and Verdict
    body: >
      Harmonic is, however, well financed. It has raised approximately $295M in disclosed primary capital across a
      $75M Series A (September 2024), a $100M Series B (July 2025), and a $120M Series C (November 2025), the last led
      by Ribbit Capital at a $1.45B post-money valuation. Reporting indicates the Series B valued the company at
      roughly $900M, implying an approximately 1.6x step-up to the Series C in about four months — momentum pricing
      tied to benchmark milestones rather than financial performance. With $120M raised most recently on an
      equity-only structure and no disclosed debt or project-finance obligations, the company likely holds a
      multi-year cash cushion, although exact cash on hand, monthly burn, and runway are all undisclosed and therefore
      cannot be computed. The implied use of funds, per company framing, is continued research, compute scaling, and
      hiring, and the next-round trigger is likely capability- and compute-driven rather than revenue-driven.

      The traction gaps are stark: no ARR, paid users, contract counts, or utilization are public, only product
      milestones and benchmark results. The principal evidence of capital adequacy is therefore the recurring
      participation of top-tier investors — Sequoia, Kleiner Perkins, Index, and Ribbit — across rounds. Independent
      reporting is explicit that the valuation rests on technical milestones and investor conviction rather than on
      traction, and mainstream coverage cautions that AI mathematical reasoning is not yet proven at commercial
      scale — an adverse signal for near-term revenue quality. The financial verdict is a well-capitalized,
      pre-commercial research company whose valuation is underwritten by capability and conviction; near-term
      insolvency risk appears low given the recent raise, but long-term viability depends on converting capability
      into priced revenue before capital markets cool. The binding diligence blockers are the absence of any disclosed
      revenue, burn, runway, pricing, and customer data.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI015
      - CI016
      - CI017
      - CI018
