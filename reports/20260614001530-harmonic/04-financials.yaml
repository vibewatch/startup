      - CI003
      - CI011
      - CI024
  - id: FI002
    title: Unit Economics Bridge
    type: flow
    layout: standard
    summary: >
      Qualitative unit-economics bridge with approximation notes, since no numeric inputs are disclosed; nodes trace the
      drivers from price per run through compute cost to contribution, all currently undisclosed.
    data:
      nodes:
        - id: u1
          label: Price per Aristotle run (undisclosed)
          approximationNotes: No published list or realized price
        - id: u2
          label: Compute cost per run (undisclosed; preemptible CPU fleet)
          approximationNotes: Driven by RL across 100K+ CPUs
        - id: u3
          label: Contribution per run (undisclosed)
          approximationNotes: Price minus compute and support cost
        - id: u4
          label: Customer acquisition cost (no paid-acquisition channel)
          approximationNotes: Bottom-up, research-led motion
        - id: u5
          label: Payback / LTV (not computable today)
          approximationNotes: Requires pricing and retention data
      edges:
        - from: u1
          to: u3
        - from: u2
