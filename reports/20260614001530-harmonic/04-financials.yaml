  title: Financials
  summary: >-
    Harmonic discloses no revenue, ARR, pricing, gross margin, burn, or runway, so its financial profile must be read as
    a well-capitalized, pre-commercial research company. It has raised roughly $295M across Series A-C, most recently a
    $120M Series C in November 2025 at a $1.45B valuation, giving a multi-year cash cushion against a compute- and
    talent-heavy cost base. Monetization (an Aristotle API and iOS app) is early and unpriced publicly, while cash
    outflows include a $1M mathematician sponsorship program and a $300K Lean FRO donation. The central financial
    verdict is that valuation rests on capability and investor conviction, not demonstrated revenue quality.
