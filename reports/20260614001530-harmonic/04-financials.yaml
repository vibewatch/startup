      - CI021
      - CI026
      - CI027
      - CI028
      - CI029
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
    tableRefs:
      - TI004
      - TI005
    figureRefs:
      - FI003
      - FI004
