callouts:
  - title: Well-capitalized but entirely pre-revenue
    body: >
      Harmonic has raised roughly $295M across three rounds, most recently a $120M Series C at a $1.45B valuation, and
      carries no disclosed debt — a strong capital position that likely funds multiple years of operation. Yet it
      discloses no revenue, ARR, burn, or runway. The financial story is therefore one of ample equity runway against an
      unproven income statement: solvency risk is low in the near term, but the company is wholly dependent on continued
      venture funding until capability converts into priced revenue.
    claimRefs:
      - CI004
      - CI005
      - CI019
      - CI035
    calloutType: strength
  - title: Revenue quality and margin path are unproven and unmeasurable today
    body: >
      Every core financial metric — revenue, gross margin, cost per run, CAC, burn, and runway — is a null cell in the
      public record, and mainstream reporting cautions that AI mathematical reasoning is not yet proven at commercial
      scale. With a compute-bound cost base and undisclosed pricing, the margin path cannot be assessed from outside the
      company. This is the central financial risk: the $1.45B valuation is underwritten by milestones and conviction,
      not by demonstrated revenue quality.
    claimRefs:
      - CI001
      - CI011
      - CI020
      - CI021
    calloutType: risk
  - title: Prioritize a data-room request for revenue, burn, and pricing
    body: >
      Because the financial profile is unverifiable from public sources, diligence should secure, under NDA, a
      management P&L with recognized revenue and ARR, a cash and burn schedule with runway, the Aristotle pricing sheet
      with realized-versus-list pricing, and customer and contract counts. Confirming the reported ~$900M Series B
      post-money and the absence of debt would also firm up the valuation chronology and capital structure.
    claimRefs:
      - CI006
      - CI022
      - CI034
    calloutType: recommendation
