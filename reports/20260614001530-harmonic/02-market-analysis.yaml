callouts:
  - title: Capability proofs are expanding the served market from math to code verification
    body: >
      Harmonic's IMO 2025 gold-level result and its state-of-the-art VERINA code-verification score do more than
      establish technical credibility: they widen the credibly addressable market from a tiny olympiad-mathematics niche
      toward software verification, a larger and more commercially mature pool where demand for catching AI-generated
      bugs is already attracting new entrants. This expansion is the most important positive market dynamic, because it
      moves Harmonic toward a buyer with a real budget and a concrete pain point rather than relying solely on the
      research community.
    claimRefs:
      - CM020
      - CM027
      - CM033
      - CM034
    calloutType: strength
  - title: The market is a thesis, not yet realized demand
    body: >
      No publisher isolates a TAM for proof-generating AI, Harmonic discloses no revenue or pricing, and published
      estimates contradict each other by orders of magnitude. The serviceable obtainable market today is effectively
      pre-commercial, and the adoption funnel is dominated by free usage. The market opportunity is therefore underwritten
      by top-tier investor conviction and capability leadership rather than measurable served demand, and the central
      diligence task is to test whether free interest can convert into durable, priced contracts.
    claimRefs:
      - CM007
      - CM021
      - CM022
      - CM023
    calloutType: risk
  - title: Willingness-to-pay sits between a low LLM anchor and a high compute floor
    body: >
      Harmonic's pricing power is squeezed from two sides: free or low-cost frontier LLMs anchor what many users expect
      to pay near zero, while reinforcement learning across more than one hundred thousand CPUs sets a high cost-to-serve
      floor. The viability of each target segment depends on whether the value of formally verified, hallucination-free
      outputs in high-stakes domains is enough to clear that floor. Quantifying per-proof unit economics and segment
      willingness-to-pay should be a priority diligence ask.
    claimRefs:
      - CM016
      - CM018
      - CM035
    calloutType: assumption
