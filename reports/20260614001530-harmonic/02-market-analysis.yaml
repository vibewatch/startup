sections:
  - id: market-definition-and-boundaries
    title: Market Definition and Boundaries
    body: >
      Harmonic operates in the emerging market for AI-driven formal mathematical reasoning and machine-checkable
      verification. The company frames its category as "mathematical superintelligence" — software that reasons
      through rigorous, formally verified mathematics rather than the probabilistic pattern-matching of
      general-purpose chat models. This positioning places Harmonic at the intersection of three adjacent spend
      pools: the broad AI software market, the narrower formal-verification and automated-reasoning tooling market,
      and academic or research mathematics software. Each adjacency contributes different buyers, budgets, and
      substitutes, and none maps cleanly onto a single published market figure.

      Drawing the boundary precisely matters for diligence. Included spend comprises enterprise software-verification
      budgets, EDA and hardware-verification budgets, AI API and compute spend, and academic research grants. Excluded
      spend covers general-purpose LLM chat subscriptions and — importantly for name disambiguation — the unrelated
      data-enrichment company that operates at harmonic.ai, which shares no business with the Palo Alto formal-math
      startup at harmonic.fun. Status-quo substitutes that Harmonic must displace are manual proof and peer review,
      hand-driven interactive theorem provers such as Lean, Coq, and Isabelle, and general-purpose LLMs that reason
      informally and can hallucinate. Understanding these substitutes is essential because they anchor both customer
      expectations and willingness-to-pay.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM024
      - CM025
    tableRefs:
      - TM001
    figureRefs: []
  - id: market-sizing-multiple-lenses
    title: Market Sizing Through Multiple Lenses
    body: >
      Because no publisher isolates a clean total addressable market for proof-generating AI, sizing must be done
      through multiple lenses and the contradictions preserved rather than averaged away. The broadest lens — the
      global AI software market — is measured by Statista and other publishers in the hundreds of billions of dollars
      in 2026, with forecasts reaching the low trillions by the early 2030s at double-digit to roughly twenty-percent
      compound annual growth. This lens captures the tailwind but vastly overstates what Harmonic can serve. A
      narrower and more relevant lens is the formal-verification and verification-copilot tooling market, which
      analysts size in the low single-digit billions of dollars in the mid-2020s and growing at a low-teens percent
      CAGR. The narrowest lens is the bottom-up serviceable niche of mathematicians and dedicated verification teams,
      which is effectively pre-commercial today given Harmonic's lack of disclosed revenue.

      The honest conclusion is that estimates differ by orders of magnitude, and any single number would mislead. We
      therefore present a layered sizing pyramid and an explicit low/base/high estimate range for one consistent
      quantity — the serviceable formal-reasoning and verification AI market around 2030, expressed in billions of
      dollars — rather than a false-precision point estimate. Harmonic's capability proofs, the IMO 2025 gold-level
      result and the VERINA state-of-the-art code-verification score, matter here because they expand the credibly
      addressable use cases from pure olympiad mathematics toward software verification, which is a larger and more
      commercially mature adjacency and the most plausible first large revenue pool.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM020
      - CM021
      - CM023
      - CM027
      - CM032
      - CM036
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyers-segments-adoption-path
    title: Buyers, Segments, and the Adoption Path
    body: >
      Harmonic's demand is split across distinct segments with different budget owners and adoption triggers.
      Professional mathematicians and academic researchers form the high-credibility beachhead: their use is funded by
      research grants and university departments, and the adoption trigger is the ability to formally verify proofs
      and explore open conjectures. Enterprise software-verification teams represent a larger commercial pool, with
      budgets sitting in EDA, security, and safety-engineering functions and an adoption trigger tied to the
      reliability of AI-generated code. Safety-critical engineering in aerospace, chip design, and automotive carries
      structural verification demand shaped by certification regimes, while AI developers needing verified outputs
      form a fourth, fast-emerging segment.

      Today the adoption path is bottom-up and developer-led. A free public Aristotle API and an iOS application seed
      usage among mathematicians and researchers, and only later does the company face the task of converting that
      interest into paid and production deployment. The resulting funnel is extremely top-heavy: free usage vastly
      exceeds any paid or production-deployed usage, implying a long path from awareness to durable contracts.
      Willingness-to-pay is the critical unknown, because free or low-cost frontier LLMs — although error-prone on
      formal mathematics — set a low anchor for what many users expect to pay, and Harmonic's compute capital
      intensity sets a floor under what it must charge.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM025
      - CM028
      - CM030
      - CM034
      - CM035
    tableRefs:
      - TM003
    figureRefs:
      - FM003
  - id: drivers-constraints-and-sizing-gaps
    title: Growth Drivers, Constraints, and Sizing Gaps
    body: >
      Several drivers support market expansion. The reliability crisis around AI-generated code is increasing demand
      for machine-checkable verification that catches bugs before deployment, a thesis around which new entrants such
      as Theorem are also forming. Safety-critical regulation — DO-178C in aerospace and analogous automotive
      standards — creates structural demand for formal verification, and the convergence of large language models with
      formal methods is an active research frontier that is expanding the practical reach and credibility of automated
      mathematical reasoning. The presence of well-funded competitors such as Google DeepMind validates the market's
      strategic importance even as it signals competitive pressure.

      The constraints are equally real. Scarcity of Lean and formal-methods expertise raises switching costs and
      limits the pool of users able to operationalize proof-AI today. Free or low-cost frontier LLMs anchor
      willingness-to-pay low, and Harmonic's reliance on reinforcement learning across more than one hundred thousand
      CPUs implies high compute costs that any pricing must eventually cover. Most important for diligence are the
      sizing gaps: no publisher provides a bottom-up TAM specifically for proof-generating AI, Harmonic discloses no
      revenue or pricing, and published estimates contradict each other by orders of magnitude. These gaps are
      preserved explicitly in the evidence-gap register rather than resolved with false precision, and they make the
      market opportunity a thesis underwritten by top-tier investors rather than realized, measurable demand.
    claimRefs:
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM021
      - CM022
      - CM023
      - CM026
      - CM029
      - CM031
      - CM033
    tableRefs:
      - TM004
    figureRefs:
      - FM004
