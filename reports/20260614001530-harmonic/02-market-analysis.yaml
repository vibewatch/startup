  title: Market Analysis
  summary: >-
    Harmonic competes in the nascent market for AI-driven formal mathematical reasoning and machine-checkable
    verification, an intersection of the broad AI software market (hundreds of billions of dollars), the narrower
    formal-verification and automated-reasoning tooling market (low single-digit billions, growing low-teens CAGR), and
    a today-tiny serviceable niche of professional mathematicians and software-verification teams. Sizing is
    evidence-constrained: publishers disagree by orders of magnitude, Harmonic discloses no revenue, and the paying
    market for formal-reasoning AI is effectively pre-commercial as of mid-2026.
