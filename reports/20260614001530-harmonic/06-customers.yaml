chapter:
  number: 6
  title: Customers
  summary: >-
    Harmonic's "customers" today are best understood as early adopters and high-credibility users in the professional
    mathematics and theorem-proving community rather than disclosed paying accounts. Named users and endorsers — most
    prominently Terence Tao, alongside researchers such as Ilya Sergey, Bartosz Naskręcki, David Renshaw, and Lorenzo
    Luccioli — engage Aristotle through a free API, an iOS app, and open-sourced IMO 2025 proofs. The evidence is
    overwhelmingly research-use and advocacy, not production enterprise deployment, and Harmonic discloses no paying
    customer counts, retention, or concentration data. The central diligence gap is the absence of commercial customer
    metrics behind a strong but reference-led adoption story.
