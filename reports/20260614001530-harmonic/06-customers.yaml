sections:
  - id: customer-base-and-adoption
    title: Customer Base, Segmentation, and Adoption
    body: >
      Harmonic's customers, as of mid-2026, are best understood as early adopters and high-credibility users within
      the professional mathematics and theorem-proving community rather than a roster of disclosed paying accounts.
      The user base is developer- and research-led: Aristotle is accessed through a free public API and an iOS
      application, not through enterprise procurement, and its reachable beachhead overlaps heavily with the Lean and
      competitive-mathematics ecosystems. Harmonic actively seeds this base through a $1M mathematician sponsorship
      program that funds researchers to use Aristotle — a community-investment go-to-market in which sponsorship
      recipients function as both users and advocates, building credibility and word-of-mouth in a tight-knit field.

      Adoption is fresh and milestone-driven. The IMO gold result in mid-2025, the public API launch in late 2025, the
      VERINA state-of-the-art result at the end of 2025, and the sponsorship program in early 2026 mark a rising
      trajectory — but the momentum is measured in milestones, not customer metrics. Code verification extends the
      potential user base from pure mathematicians toward software-engineering teams, yet no named enterprise customers
      are disclosed. Crucially, Harmonic discloses no active-user counts, paying-customer numbers, account totals, or
      revenue bands, so adoption scale and penetration cannot be quantified from public sources, and even strong
      individual proofs cannot be translated into adoption rates without denominators.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU022
      - CU026
      - CU032
      - CU034
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
      - FU002
  - id: named-proof-and-reference-quality
    title: Named Customer Proof and Reference Quality
    body: >
      The headline of Harmonic's customer story is the calibre of its named users. The most prominent is Terence Tao,
      widely regarded as one of the world's foremost mathematicians, who has spoken publicly about AI's readiness for
      mathematics, and whose testimonial Harmonic surfaces on the Aristotle product page as reference proof. Beyond
      Tao, named research users and collaborators associated with Aristotle and Harmonic's formal-proof work include
      Ilya Sergey, Bartosz Naskręcki, David Renshaw, and Lorenzo Luccioli, and the Aristotle preprint's large
      co-author team signals engagement with the academic community as both users and contributors. This is a
      genuinely high reference quality for a young company.

      The important caveat is what that proof is and is not. The available evidence is overwhelmingly research-use and
      advocacy — testimonials, co-authorship, and sponsorships — rather than production enterprise deployment with
      measured business outcomes. The strongest production-grade evidence is in fact the community-reproducible IMO
      2025 proof set on GitHub, which is closer to a verifiable deployment artifact than a marketing testimonial.
      Reference quality is therefore high for credibility but does not by itself evidence commercial traction or
      recurring paid usage, and the adoption narrative leans heavily on a small number of elite endorsers, most
      notably Tao. Compared with a typical enterprise-software customer base, Harmonic's looks reference-led and
      pre-commercial.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU011
      - CU018
      - CU021
      - CU024
      - CU025
      - CU027
    tableRefs:
      - TU003
      - TU006
    figureRefs:
      - FU003
  - id: retention-expansion-and-risks
    title: Retention, Expansion, and Concentration Risks
    body: >
      On durability, the record is thin. Harmonic discloses no retention, net revenue retention, churn, renewal, or
      cohort data, and satisfaction signals are limited to qualitative endorsements with no structured survey or NPS
      evidence, leaving the durability of usage unverifiable. The land-and-expand path — from free research use toward
      paid enterprise verification — is plausible and supported by the VERINA capability, but no expansion cohorts or
      upsell metrics are disclosed to evidence it, and because the user motion is bottom-up and free, conversion to
      paying customers remains the single most important unproven step in the customer story. User trust is the
      central adoption barrier for AI mathematics; independent reporting cautions that reliability concerns temper how
      quickly users will depend on AI-generated math, although formal verification directly addresses that barrier by
      giving expert users machine-checkable reasons to trust outputs.

      Concentration and channel risks are presently conceptual rather than financial. There are no disclosed
      revenue-bearing customers to concentrate, so top-customer risk is reputational — a dependence on a few elite
      endorsers — rather than a revenue exposure. Channel and partner dependence runs through the open-source Lean
      community and the academic network rather than commercial resellers, and procurement friction for enterprise
      adoption is likely high given undocumented security and compliance posture and the Lean familiarity users
      require. Emerson Collective's entry as a Series C investor adds a strategic stakeholder, though as a backer
      rather than a product customer. The overall verdict is a credible, high-quality reference base and growing
      research adoption, undercut by a complete absence of disclosed commercial customer metrics; diligence should
      prioritize active-user counts, free-to-paid conversion, retention cohorts, and any enterprise pilots.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU019
      - CU020
      - CU023
      - CU028
      - CU029
      - CU030
      - CU031
      - CU033
      - CU035
    tableRefs:
      - TU004
      - TU005
    figureRefs: []
