callouts:
  - title: An exceptionally high-quality reference base for a young company
    body: >
      Few early-stage companies can point to Terence Tao — one of the world's foremost mathematicians — engaging with
      and endorsing their product, alongside other named researchers and a community-reproducible set of formally
      verified IMO 2025 proofs. This reference quality is a genuine asset: in a tight-knit field, elite credibility and
      verifiable artifacts build trust faster than marketing, and the $1M sponsorship program turns users into advocates.
    claimRefs:
      - CU002
      - CU003
      - CU027
      - CU034
    calloutType: strength
  - title: Reference-led adoption is not the same as commercial traction
    body: >
      Every piece of customer evidence is research-use or advocacy rather than production enterprise deployment with
      measured outcomes, and Harmonic discloses no active-user counts, paying customers, retention, or revenue bands.
      The adoption narrative leans heavily on a few elite endorsers, and conversion from free research use to paying
      customers — the single most important step — is entirely unproven. The apparent traction risks being overstated by
      the calibre of endorsers.
    claimRefs:
      - CU010
      - CU011
      - CU013
      - CU021
    calloutType: risk
  - title: Make active-user, conversion, and retention metrics a diligence precondition
    body: >
      Because the customer story is reference-led, diligence should require active and paying user counts, free-to-paid
      conversion, retention cohorts, satisfaction data, and any enterprise pilot references with production-versus-pilot
      status and measured outcomes. Converting the high-credibility reference base into denominators and durability
      metrics is the key to underwriting Harmonic's customer value.
    claimRefs:
      - CU026
      - CU028
      - CU033
    calloutType: recommendation
