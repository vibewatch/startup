companyProfile:
  summary: >
    Harmonic is a Palo Alto-based AI research company founded in 2023 by Robinhood co-founder
    Vlad Tenev and serial AI entrepreneur Tudor Achim. Its flagship product, Aristotle, is a
    fully agentic formal reasoning engine built on the Lean 4 proof assistant that combines
    reinforcement-learning-driven proof search, an informal LLM reasoning layer, and a dedicated
    geometry solver. Aristotle produces machine-checkable proofs with no hallucinations — a
    structural advantage over informal large-language-model reasoning systems. The company achieved
    gold-medal-level performance at the 2025 International Mathematical Olympiad, set state-of-the-art
    results on the VERINA code verification benchmark (96.8%), and ranks #1 on the ProofBench formal
    mathematics leaderboard. Harmonic has raised $295M across three rounds and is valued at $1.45B,
    backed by Sequoia Capital, Kleiner Perkins, Index Ventures, Ribbit Capital, and Paradigm, among
    others. The company is pre-revenue but has launched a public Aristotle API and a $1M mathematician
    sponsorship program to accelerate community adoption.
  foundedDate: "2023-01-01"
  founders:
    - name: Tudor Achim
      role: Co-Founder & CEO
      background: "Co-founder & former CTO of Helm.ai; B.S. Computer Science from Carnegie Mellon University; Ph.D. Candidate Computer Science at Stanford University."
      claimRefs: [CO004]
    - name: Vlad Tenev
      role: Co-Founder & Executive Chairman
      background: "Co-founder & CEO of Robinhood Markets; B.S. Mathematics Stanford; M.S. Mathematics UCLA (studied under Terence Tao)."
      claimRefs: [CO005]
  foundingLocation: "Palo Alto, CA"
  headquarters: "Palo Alto, CA"
  productSummary: >
    Aristotle is an agentic formal reasoning model that takes natural-language math or code problems,
    auto-formalizes them into Lean 4, searches for proofs via reinforcement learning and tree
    exploration, and returns both a human-readable answer and a machine-checkable Lean proof.
    It is available as a public API, an iOS app, and a research grant program.
  customerFocus: >
    Professional mathematicians, academic researchers, cryptographers, and software engineers working
    in safety-critical domains requiring formally verified correctness (aerospace, chip design,
    scientific computing).
  businessModel: >
    API access to Aristotle (currently research/freemium); eventual enterprise licensing for
    verified software and high-assurance industries. No publicly disclosed pricing or revenue.
  stage: "Series C"
  fundingStatus: "$120M Series C (Nov 2025, Ribbit Capital led); $295M total raised; $1.45B post-money valuation"
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO008, CO009, CO010, CO014, CO016, CO017]

