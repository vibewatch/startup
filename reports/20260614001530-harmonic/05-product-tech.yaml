callouts:
  - title: Formal verification is a genuine, defensible technical differentiator
    body: >
      Aristotle's outputs are checked by the independently developed Lean kernel, so any proof it returns is correct by
      construction — it cannot hallucinate a valid-looking but wrong proof the way informal LLMs can. This makes quality
      control intrinsic to the output format and suits high-assurance domains such as safety-critical software,
      cryptography, and chip design. Combined with IMO 2025 gold-level results that are open and reproducible on GitHub,
      this is the strongest, most verifiable part of Harmonic's technical story.
    claimRefs:
      - CE006
      - CE010
      - CE016
      - CE026
    calloutType: strength
  - title: Ecosystem dependency and compute intensity are the core technical risks
    body: >
      Aristotle rests entirely on the Lean 4 kernel and Mathlib, maintained by the Lean FRO and community, and on
      preemptible cloud compute scaling beyond 100,000 CPUs. Harmonic supports the Lean ecosystem financially but does
      not control its roadmap, and the preemptible design introduces fault-tolerance, determinism, and cost complexity
      that is only partially disclosed. These dependencies are structural and should be weighed against the otherwise
      strong capability story.
    claimRefs:
      - CE012
      - CE015
      - CE027
      - CE013
    calloutType: risk
  - title: Independently verify benchmarks and request enterprise-readiness documentation
    body: >
      The IMO 2025 proofs are open and reproducible, but ProofBench and VERINA leadership rely partly on company-reported
      figures, and enterprise security, privacy, and API/SLA documentation is not public. Diligence should seek
      independent benchmark reproduction and request SOC 2 status, data-handling policies, and integration/SLA terms
      before underwriting enterprise adoption.
    claimRefs:
      - CE017
      - CE023
      - CE024
      - CE032
    calloutType: recommendation
