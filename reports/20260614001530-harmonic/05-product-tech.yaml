chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Harmonic's product is Aristotle, a formal reasoning agent built on the Lean 4 proof assistant that returns
    machine-checkable proofs rather than probabilistic answers. Its architecture combines a Lean proof-search system, an
    informal LLM reasoner, and a dedicated geometry solver (Yuclid/Newclid), trained via reinforcement learning on
    synthetic data and served by a custom REPL infrastructure that scales beyond 100,000 preemptible CPUs. Aristotle
    reached IMO 2025 gold-medal level (five of six problems, formally verified), state-of-the-art VERINA code
    verification (96.8%), and is delivered through a public API and an iOS app. Its core technical differentiator —
    formal verification that eliminates hallucination — is paired with a heavy dependency on the Lean ecosystem and
    undisclosed enterprise security controls.
