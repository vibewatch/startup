sections:
  - id: product-and-use-cases
    title: Product Definition and Use Cases
    body: >
      Harmonic's product is Aristotle, a formal reasoning agent built on the Lean 4 proof assistant. Unlike a
      general-purpose chatbot, Aristotle returns machine-checkable proofs: its outputs are verified by the Lean kernel,
      so a returned proof is correct by construction rather than merely plausible. In customer-workflow terms,
      Aristotle addresses concrete jobs that previously demanded extensive manual formalization — proving open
      conjectures, verifying that code meets a specification, formalizing the arguments in a paper, and solving
      olympiad-level problems including geometry. Its agentic design lets it autonomously decompose a problem, invoke a
      dedicated geometry solver when needed, and iterate proof search, sharply reducing the human effort required
      relative to writing Lean proofs by hand.

      The product is delivered through two surfaces: a public Aristotle API launched in October 2025 and an iOS
      application whose beta launched in July 2025, extending formal reasoning beyond API-integrating developers toward
      a broader research and consumer audience. Capability is demonstrated by headline results: Aristotle reached IMO
      2025 gold-medal level by formally solving five of six problems with no human checking, achieved a
      state-of-the-art 96.8% on the VERINA code-verification benchmark against a prior best near 4.9%, and progressed
      on the MiniF2F benchmark from roughly 63% to 83% to 90% as the system matured. The reliability advantage is
      conditional and worth stating precisely: Aristotle guarantees that any proof it returns is valid, but not that it
      will find a proof for every problem, so coverage rather than correctness is the open limitation.
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE008
      - CE009
      - CE019
      - CE030
      - CE031
      - CE034
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002
  - id: architecture-and-infrastructure
    title: Architecture, Training, and Infrastructure
    body: >
      Architecturally, Aristotle combines three components into one agentic system: a Lean proof-search system that
      constructs formal proofs, an informal LLM reasoner that proposes strategies in natural-language mathematics, and
      a dedicated geometry solver (Yuclid/Newclid) for olympiad geometry — a domain competitors such as DeepMind's
      AlphaGeometry also target with specialized solvers. This pairing of formal proof search with an informal reasoner
      mirrors a broader research direction documented in the literature on combining large language models with formal
      methods. Crucially, the informal component is probabilistic and fallible; its errors are caught only because the
      Lean kernel rejects invalid proofs, which makes formal verification the safety backstop for an otherwise
      error-prone model.

      Training relies on reinforcement learning over large-scale synthetic data in an automated self-improvement loop,
      reducing dependence on scarce human-written formal proofs and compounding capability over time. Serving this
      system is a custom REPL service engineered to be semantically stateless and to scale beyond one hundred thousand
      preemptible CPUs, so proof search can be massively parallelized at low cost. That preemptible design optimizes
      cost but introduces operational complexity around fault tolerance, determinism, and reproducibility at scale,
      details of which are only partially disclosed. The entire stack rests on the Lean 4 language and the Mathlib
      library maintained by the Lean community and Lean FRO — a dependency Harmonic supports financially, including a
      $300K donation, but does not control.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE011
      - CE012
      - CE013
      - CE015
      - CE021
      - CE028
      - CE029
      - CE035
    tableRefs:
      - TE003
    figureRefs:
      - FE001
      - FE003
  - id: differentiation-trust-and-roadmap
    title: Differentiation, Trust, and Roadmap
    body: >
      Aristotle's core differentiator is formal verification: because outputs are checked by the independently
      developed, widely scrutinized Lean kernel, the system does not hallucinate proofs the way informal LLMs can, and
      quality control is intrinsic to the output format rather than reliant on post-hoc human review. This makes the
      product especially suited to high-assurance domains — safety-critical software, cryptography, and chip design —
      where machine-checkable correctness matters more than fluent prose. Trust is further reinforced by
      reproducibility: Harmonic open-sourced its formally verified IMO 2025 proofs in a public GitHub repository, and
      has released supporting tooling such as the geometry solver and the MiniF2F dataset. Benchmark transparency is,
      however, mixed: the IMO 2025 proofs are open and reproducible, but ProofBench and VERINA leadership rely partly
      on company-reported figures, and independent validation beyond the open proofs is limited.

      On readiness, the product's maturity is uneven. Theorem-proving and benchmark capability are highly mature, while
      enterprise deployment, security, and integration tooling are comparatively early: enterprise security, privacy,
      and compliance controls (SOC 2, data handling, API SLAs and rate limits) are not publicly documented, a gap
      relative to enterprise-grade software expectations and a key diligence item. The roadmap has advanced quickly —
      iOS beta in July 2025, public API in October 2025, VERINA state of the art in December 2025, and community
      programs in early 2026 — and continued capital from the $120M Series C is explicitly oriented toward scaling the
      compute and research the architecture requires. The overall technology verdict is a genuinely differentiated,
      capability-leading formal-reasoning stack whose principal risks are ecosystem dependency, compute intensity, and
      undocumented enterprise controls.
    claimRefs:
      - CE006
      - CE010
      - CE014
      - CE016
      - CE017
      - CE018
      - CE020
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
      - CE032
      - CE033
      - CE036
    tableRefs:
      - TE004
      - TE005
    figureRefs:
      - FE004
