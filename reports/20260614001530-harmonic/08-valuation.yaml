callouts:
  - title: A category-defining capability priced as an option, not a business
    body: >
      Harmonic pairs genuinely world-leading formal-reasoning capability — IMO gold, VERINA state-of-the-art, ProofBench
      number one — with an elite founder pair and a blue-chip syndicate. For mandates that underwrite asymmetric
      optionality on a category-defining technology, the ~$1.45B mark can be justified as an option premium on a very
      large future outcome, supported by repeat insider conviction.
    claimRefs:
      - CV005
      - CV007
      - CV023
      - CV030
    calloutType: strength
  - title: The price assumes a commercialization that public evidence does not yet show
    body: >
      The valuation is set on no disclosed revenue, the near-term formal-mathematics market is niche, burn is high, and
      the step-up from ~$900M to ~$1.45B in four months is momentum pricing on milestones. The margin of safety at the
      current mark is thin, preference stacks could impair common-equity returns in modest exits, and the monetization
      outcome is effectively binary.
    claimRefs:
      - CV004
      - CV006
      - CV020
      - CV038
    calloutType: risk
  - title: Underwrite conditionally — gate entry on monetization and generalization evidence
    body: >
      We recommend a conditional, milestone-disciplined position: a small, asymmetric-return allocation for mandates
      that can hold optionality, and a pass for fundamentals-driven mandates. Make burn/runway, monetization pipeline,
      SPV and cap-table terms, and independent capability-generalization testing hard preconditions, and pre-agree the
      thesis-break triggers before any entry.
    claimRefs:
      - CV021
      - CV029
      - CV037
      - CV040
    calloutType: recommendation
