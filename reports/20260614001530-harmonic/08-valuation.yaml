chapter:
  number: 8
  title: Valuation
  summary: >-
    Harmonic carries a roughly $1.45B post-money valuation from its November 2025 Series C, an implied step-up from an
    estimated ~$900M at the July 2025 Series B, all on no disclosed revenue. The thesis is a high-conviction technical
    and team bet — world-leading formal-reasoning capability (IMO gold, VERINA SOTA), an elite founder pair, and a
    blue-chip investor syndicate — against a narrative-driven, pre-revenue price in a niche near-term market. The
    anti-thesis is that the valuation is supported by milestones rather than fundamentals, monetization is unproven, and
    burn is high. Our stance is a conditional, milestone-disciplined position rather than an unconditional buy at the
    current mark: the technology conviction is strong, but the entry price requires belief in a large future
    commercialization that public evidence does not yet support.
