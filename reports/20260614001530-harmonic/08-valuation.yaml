sections:
  - id: valuation-context-and-thesis
    title: Valuation Context, Thesis, and Anti-Thesis
    body: >
      Harmonic's November 2025 Series C set a post-money valuation of approximately $1.45 billion on a $120M raise led
      by Ribbit Capital, crossing the unicorn threshold and following a Series B in July 2025 that raised $100M at a
      reported ~$900M valuation. Across Series A ($75M), B ($100M), and C ($120M), the company has raised roughly $295M
      within about fourteen months of its first public round — a rapid cadence that reflects momentum pricing on
      milestones (IMO gold, VERINA state-of-the-art) far more than financial performance, since the valuation is set
      on no disclosed revenue. The step-up from ~$900M to ~$1.45B in roughly four months is therefore best read as
      narrative- and capability-driven rather than fundamentals-based.

      The bull thesis is a high-conviction technical and team bet: world-leading formal-reasoning capability built by
      an elite founder pair and validated by a blue-chip syndicate — Sequoia, Kleiner Perkins, Ribbit, Index, and
      Emerson Collective — whose repeat participation signals insider conviction. The anti-thesis is that monetization
      is unproven, the near-term market for formal mathematics is niche, and burn is high, so the price embeds a large,
      unevidenced future commercialization. Syndicate quality is a signal, not a guarantee: top-tier backers do not
      substitute for evidence of revenue. The valuation is best understood as a venture-style option on a
      category-defining capability — defensible as optionality, but not on any near-term fundamentals.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV024
      - CV030
      - CV032
      - CV033
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
      - FV004
  - id: comparables-scenarios-and-sensitivity
    title: Comparables, Scenarios, and Sensitivity
    body: >
      Comparables are inherently difficult: there is no close public peer for a pre-revenue formal-mathematics
      company, so the valuation leans on frontier-AI private rounds and milestone analogies. Relative to informal
      reasoning labs such as OpenAI and Anthropic — valued in the tens to hundreds of billions — Harmonic's ~$1.45B is
      small, but those peers carry substantial revenue Harmonic lacks; meanwhile DeepMind's AlphaProof reached IMO
      silver level inside a corporate parent, a capability comparable with no standalone valuation. The broad AI market
      is large and fast-growing per multiple analysts, supporting a sizeable theoretical TAM if formal verification
      becomes a mainstream software-assurance layer, but that backdrop is generic and the gap between a large
      theoretical TAM and Harmonic's serviceable near-term market is the central valuation tension.

      Across scenarios, the bull case sees Harmonic become the verification layer for high-assurance software
      (aerospace, chips, cryptography) plus a research platform, supporting a multi-billion to decacorn outcome; the
      base case is gradual API and enterprise-verification monetization that grows into rather than vastly exceeds the
      current mark; and the bear case is stalled monetization, a persistently niche market, and a down round that
      compresses value well below the Series C mark. Valuation is most sensitive to monetization timing and the
      achievable revenue multiple, then to milestone probability and dilution from future rounds. The optionality on
      "mathematical superintelligence" is a large but uncertain payoff that should be probability-weighted rather than
      taken at face value.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV034
      - CV036
    tableRefs:
      - TV003
      - TV004
    figureRefs:
      - FV002
      - FV003
  - id: recommendation-exit-and-diligence
    title: Recommendation, Exit Readiness, and Diligence
    body: >
      Our recommendation is a conditional, milestone-disciplined position rather than an unconditional buy at the
      current mark: confidence is medium and the risk rating is high, driven by monetization and burn uncertainty
      rather than technical risk. The strongest value driver is Harmonic's verifiable capability leadership — IMO gold,
      VERINA state-of-the-art, ProofBench number one — which is durable if the benchmark lead is maintained, and the
      most likely value-accretive path on a 3–5 year horizon is enterprise verification revenue plus continued
      capability leadership rather than consumer or grant activity. Because the monetization outcome is effectively
      binary, the appropriate position size is small relative to conviction, and we rate Harmonic a conditional buy
      for asymmetric-return mandates and a pass for fundamentals-driven mandates, with the deciding variable being
      evidence of monetization.

      Entry discipline is essential: at ~$1.45B with no revenue, the margin of safety is thin and depends on belief in
      a large future outcome, and accumulated preference stacks across three rounds could materially affect
      common-equity returns in modest exits, warranting a waterfall analysis. Exit readiness is early — IPO is years
      away and M&A by a cloud or AI major is the more plausible near-to-medium-term exit, where a strategic acquirer
      could value the formal-reasoning IP and team well above financial comps. Thesis-break triggers include failure to
      show paying revenue or enterprise pilots within the runway, loss of the benchmark lead, a down round, or reduced
      founder commitment. Final diligence asks center on burn and runway, the monetization pipeline, SPV and cap-table
      terms, and — highest value of all — independent verification of capability generalization beyond
      competition-style problems.
    claimRefs:
