sections:
  - id: regulatory-legal-and-model-risk
    title: Regulatory, Legal, and Model Risk
    body: >
      Harmonic's regulatory exposure is presently light-touch — it ships a research-and-developer tool rather than a
      regulated product — but the environment is tightening. The EU AI Act introduces obligations for general-purpose
      and high-risk AI, and an escalation that classified advanced reasoning models as high-risk would raise
      compliance cost; this is a watch-item rather than a present blocker. In the United States, federal executive
      action and the NIST AI Risk Management Framework signal a governance trajectory that could eventually reach
      capable reasoning systems, and dual-use or export considerations may follow. Privacy and security obligations
      already attach to the consumer iOS app and public API, yet Harmonic's compliance posture is not publicly
      documented — an unresolved gap given its enterprise-verification ambitions.

      The most concrete legal risk is brand and trademark collision with the unrelated "harmonic.ai", which can cause
      market confusion and potential IP friction; diligence should confirm trademark coverage and any coexistence
      arrangements. No active litigation, enforcement action, or penalty against harmonic.fun is disclosed in public
      sources, though absence of disclosure is not proof of absence. On model risk, hallucination is a known failure
      mode of the informal-reasoning component, but formal Lean verification is the core mitigation: machine-checked
      proofs catch incorrect reasoning before any answer is certified, materially reducing reliability risk relative
      to purely informal AI. The residual concern is generalization — benchmark overfitting or synthetic-data limits
      could overstate real-world capability beyond competition-style problems.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR011
      - CR012
      - CR013
      - CR022
      - CR023
      - CR029
    tableRefs:
      - TR001
      - TR002
    figureRefs:
      - FR001
  - id: financial-model-and-dependency-risk
    title: Financial-Model and Dependency Risk
    body: >
      The dominant risk in the file is commercial: Harmonic has raised roughly $295M across Series A–C but discloses
      no revenue, so its monetization path is unproven. The program is extremely compute-intensive — a REPL service
      scaling to 100K+ CPUs on preemptible cloud — which implies high and variable burn, making runway and burn rate
      the central financial-model risks even though the $120M Series C provides near-term cushion. As a pre-revenue
      company, Harmonic depends on continued access to venture financing on acceptable terms; financing has been
      routed through pooled SPV vehicles per SEC Form D filings, a structure diligence should map to ownership and
      control. Customer-concentration risk is moot today because no revenue-bearing customers are disclosed, but the
      flip side is the absence of any diversified revenue base to absorb shocks, and the niche near-term market for
      formal mathematics lengthens the road to scale.

      Dependency risk concentrates several critical external relationships. Harmonic relies materially on the
      open-source Lean 4 proof assistant and the Lean FRO ecosystem — a dependency it does not control, only partly
      offset by its $300K donation — and on a single cloud provider for preemptible capacity, exposing it to
      availability and pricing shifts. The Lean ecosystem, single-cloud infrastructure, and VC capital are each
      individually manageable but collectively material, and the operational security posture for the API and app
      remains undisclosed. The risk transmission path runs from high burn and zero revenue into financing dependence
      and valuation sensitivity, with competition and trust risks feeding adoption.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR008
      - CR009
      - CR010
      - CR018
      - CR019
      - CR020
      - CR021
      - CR030
      - CR034
      - CR035
    tableRefs:
      - TR003
    figureRefs:
      - FR002
      - FR003
  - id: people-execution-and-mitigations
    title: People, Execution, and Mitigations
    body: >
      Execution risk centres on a small founding team. Key-person risk is elevated because co-founder and Executive
      Chairman Vlad Tenev concurrently serves as CEO of Robinhood, splitting his attention, while day-to-day execution
      rests heavily on CEO Tudor Achim — concentrating operational dependence. Talent risk is significant: Harmonic
      competes for a scarce pool of formal-methods and reinforcement-learning researchers against far better-resourced
      labs such as Google DeepMind and OpenAI, the same incumbents that pose direct competitive pressure (DeepMind's
      AlphaProof reached IMO silver-medal level). Reputational and trust risk persists because independent commentary
      remains skeptical of AI reliability in mathematics, which can slow adoption regardless of formal guarantees.

      Mitigation maturity is uneven. Technical reliability — formal verification — is genuinely strong, but
      commercial, compliance, and governance mitigations are early-stage or undisclosed. For monitoring, sensible
      thesis-break triggers include failure to demonstrate paying-customer revenue or enterprise pilots within the
      Series C runway window; a sustained spike in compute cost without a commensurate capability or commercial
      return; and the loss of, or a public dispute over, a marquee endorser or key founder. Diligence should obtain
      the burn rate, runway, compute-cost trajectory, and enterprise pipeline to size financial-model risk, and should
      confirm trademark coverage versus harmonic.ai and review the SPV ownership structure. On balance, near-term
      legal and regulatory risk is manageable while financial-model and execution risks carry the highest residual
      exposure — severity-ranked: monetization/burn, key-person/execution, competition, dependency concentration, and
      rising regulation.
    claimRefs:
      - CR014
      - CR015
      - CR016
      - CR017
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
      - CR031
      - CR032
      - CR033
      - CR036
    tableRefs:
      - TR004
      - TR005
    figureRefs: []
