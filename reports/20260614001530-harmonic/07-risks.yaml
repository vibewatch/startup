callouts:
  - title: Formal verification genuinely de-risks the core reliability concern
    body: >
      The single most important technical mitigation is that Aristotle's outputs are machine-checked in Lean: incorrect
      informal reasoning is caught before any answer is certified, so hallucination — the dominant reliability risk for
      AI mathematics — is largely neutralized at the point of certification. This is a real, structural advantage over
      purely informal LLM reasoning and is the strongest mitigation in the risk file.
    claimRefs:
      - CR011
      - CR012
    calloutType: strength
  - title: Burn against zero disclosed revenue is the dominant residual risk
    body: >
      Harmonic has raised ~$295M, runs a 100K+ CPU compute program, and discloses no revenue. The financial-model risk —
      unsized burn, runway dependence on future financing, and an unproven monetization path in a niche near-term market —
      is the highest residual exposure for an investor, compounded by single-cloud and Lean-ecosystem dependency and
      key-person concentration around a part-time Executive Chairman.
    claimRefs:
      - CR001
      - CR002
      - CR018
      - CR014
    calloutType: risk
  - title: Make burn, pipeline, and IP/SPV diligence preconditions
    body: >
      Diligence should require the burn rate, runway, compute-cost trajectory, and any enterprise-revenue pipeline to
      size financial-model risk; a litigation/IP search and trademark coexistence position versus harmonic.ai; the SPV
      ownership and control structure; and a security/compliance package. Investors should also pre-agree the
      thesis-break triggers in the kill-criteria table.
    claimRefs:
      - CR031
      - CR032
      - CR026
    calloutType: recommendation
