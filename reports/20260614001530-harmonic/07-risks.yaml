chapter:
  number: 7
  title: Risks
  summary: >-
    Harmonic's risk profile is dominated by commercialization-model and capital-intensity risk rather than near-term
    legal jeopardy. The company has raised $295M against no disclosed revenue, funds an extremely compute-heavy
    research program (100K+ CPU formal-proof infrastructure on preemptible cloud), and depends on the open-source Lean
    ecosystem and a single cloud provider. Regulatory exposure (EU AI Act, US executive action) is currently
    light-touch for a research tool but rising, and the most concrete legal risk is brand/IP collision with the
    unrelated "harmonic.ai". Execution risk centres on key-person dependence — Executive Chairman Vlad Tenev remains
    Robinhood's CEO — and on talent competition with far larger labs. None of these are disclosed as active litigation,
    but the residual exposure on burn, monetization, and dependency concentration is high.
