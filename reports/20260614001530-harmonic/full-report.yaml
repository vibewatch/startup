      - number: '5.2'
        title: Architecture, Training, and Infrastructure
        blocks:
          - type: paragraph
            body: >
              Architecturally, Aristotle combines three components into one agentic system: a Lean proof-search system
              that constructs formal proofs, an informal LLM reasoner that proposes strategies in natural-language
              mathematics, and a dedicated geometry solver (Yuclid/Newclid) for olympiad geometry — a domain competitors
              such as DeepMind's AlphaGeometry also target with specialized solvers. This pairing of formal proof search
              with an informal reasoner mirrors a broader research direction documented in the literature on combining
              large language models with formal methods. Crucially, the informal component is probabilistic and
              fallible; its errors are caught only because the Lean kernel rejects invalid proofs, which makes formal
              verification the safety backstop for an otherwise error-prone model.

              Training relies on reinforcement learning over large-scale synthetic data in an automated self-improvement
              loop, reducing dependence on scarce human-written formal proofs and compounding capability over time.
              Serving this system is a custom REPL service engineered to be semantically stateless and to scale beyond
              one hundred thousand preemptible CPUs, so proof search can be massively parallelized at low cost. That
              preemptible design optimizes cost but introduces operational complexity around fault tolerance,
              determinism, and reproducibility at scale, details of which are only partially disclosed. The entire stack
              rests on the Lean 4 language and the Mathlib library maintained by the Lean community and Lean FRO — a
              dependency Harmonic supports financially, including a $300K donation, but does not control.
