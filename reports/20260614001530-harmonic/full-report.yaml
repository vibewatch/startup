  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >
              Harmonic operates in the emerging market for AI-driven formal mathematical reasoning and machine-checkable
              verification. The company frames its category as "mathematical superintelligence" — software that reasons
              through rigorous, formally verified mathematics rather than the probabilistic pattern-matching of
              general-purpose chat models. This positioning places Harmonic at the intersection of three adjacent spend
              pools: the broad AI software market, the narrower formal-verification and automated-reasoning tooling
              market, and academic or research mathematics software. Each adjacency contributes different buyers,
              budgets, and substitutes, and none maps cleanly onto a single published market figure.

              Drawing the boundary precisely matters for diligence. Included spend comprises enterprise
              software-verification budgets, EDA and hardware-verification budgets, AI API and compute spend, and
              academic research grants. Excluded spend covers general-purpose LLM chat subscriptions and — importantly
              for name disambiguation — the unrelated data-enrichment company that operates at harmonic.ai, which shares
              no business with the Palo Alto formal-math startup at harmonic.fun. Status-quo substitutes that Harmonic
              must displace are manual proof and peer review, hand-driven interactive theorem provers such as Lean, Coq,
              and Isabelle, and general-purpose LLMs that reason informally and can hallucinate. Understanding these
              substitutes is essential because they anchor both customer expectations and willingness-to-pay.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM024
              - CM025
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Through Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              Because no publisher isolates a clean total addressable market for proof-generating AI, sizing must be
              done through multiple lenses and the contradictions preserved rather than averaged away. The broadest lens
              — the global AI software market — is measured by Statista and other publishers in the hundreds of billions
              of dollars in 2026, with forecasts reaching the low trillions by the early 2030s at double-digit to
              roughly twenty-percent compound annual growth. This lens captures the tailwind but vastly overstates what
              Harmonic can serve. A narrower and more relevant lens is the formal-verification and verification-copilot
              tooling market, which analysts size in the low single-digit billions of dollars in the mid-2020s and
              growing at a low-teens percent CAGR. The narrowest lens is the bottom-up serviceable niche of
              mathematicians and dedicated verification teams, which is effectively pre-commercial today given
              Harmonic's lack of disclosed revenue.

              The honest conclusion is that estimates differ by orders of magnitude, and any single number would
              mislead. We therefore present a layered sizing pyramid and an explicit low/base/high estimate range for
              one consistent quantity — the serviceable formal-reasoning and verification AI market around 2030,
              expressed in billions of dollars — rather than a false-precision point estimate. Harmonic's capability
              proofs, the IMO 2025 gold-level result and the VERINA state-of-the-art code-verification score, matter
              here because they expand the credibly addressable use cases from pure olympiad mathematics toward software
              verification, which is a larger and more commercially mature adjacency and the most plausible first large
              revenue pool.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM020
              - CM021
              - CM023
              - CM027
              - CM032
              - CM036
