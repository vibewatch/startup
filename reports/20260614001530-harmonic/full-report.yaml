      - number: '1.2'
        title: Funding History and Investor Backing
        blocks:
          - type: paragraph
            body: >
              Harmonic has raised approximately $295 million in disclosed primary capital across three rounds in roughly
              fourteen months. The $75 million Series A (September 2024) was led by Sequoia Capital with significant
              participation from Index Ventures; the $100 million Series B (announced July 2025) was led by Kleiner
              Perkins with significant backing from Paradigm; and the $120 million Series C (November 25, 2025) was led
              by Ribbit Capital and added Emerson Collective, the organization founded by Laurene Powell Jobs, as a new
              investor. The Series C valued Harmonic at $1.45 billion, crossing the unicorn threshold. Independent
              analyst coverage places the post-money progression near $325M, about $900M, and $1.45B respectively,
              though the earlier post-money figures are estimates.

              The investor roster is deep and recurring: Sequoia and Index Ventures have backed every round to date,
              Kleiner Perkins and Ribbit have escalated their commitments, and the broader base includes Paradigm, ERA
              Funds, GreatPoint Ventures, Blossom Capital, and DST Global partners. Governance signals follow the money
              — Sequoia's Andrew Reed took a board director seat at the Series A, with Index's Jan Hammer and later
              Kleiner Perkins' Ilya Fushman joining as observers. Repeat participation across consecutive rounds is the
              clearest external evidence of conviction in a company that has yet to disclose any revenue, making the
              funding history both the strongest validation signal and the locus of the central valuation question.
