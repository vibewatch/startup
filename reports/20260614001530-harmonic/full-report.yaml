  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Founders
        blocks:
          - type: paragraph
            body: >
              Harmonic is a Palo Alto-headquartered artificial intelligence company founded in 2023 by Tudor Achim and
              Vlad Tenev with the explicit mission of building "mathematical superintelligence" (MSI): AI that reasons
              through rigorous, formally verified mathematics rather than probabilistic pattern-matching. The company
              operated in relative stealth for roughly a year before its June 2024 public introduction, which it paired
              with a state-of-the-art result on the MiniF2F theorem-proving benchmark. Its one-line identity is best
              summarized as the builder of Aristotle, a formal reasoning agent on the Lean 4 proof assistant whose
              outputs are machine-checkable.

              The founding team is unusually credentialed for this niche. Tudor Achim, Co-Founder and CEO, previously
              co-founded and served as CTO of the autonomous-driving company Helm.ai and holds a B.S. in Computer
              Science from Carnegie Mellon and was a Ph.D. candidate at Stanford. Vlad Tenev, Co-Founder and Executive
              Chairman, is simultaneously Co-Founder and CEO of the publicly traded Robinhood Markets and holds a B.S.
              in Mathematics from Stanford and an M.S. in Mathematics from UCLA, anchoring Harmonic in the
              formal-mathematics community it now serves. That dual role is also the company's most visible key-person
              consideration, concentrating attention on a founder who runs a separate public company.
