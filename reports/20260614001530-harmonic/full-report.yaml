      - number: '3.2'
        title: Capability, Differentiation, and Pricing
        blocks:
          - type: paragraph
            body: >
              On capability, Harmonic positions itself as the formal-reasoning leader. It claims Aristotle ranks first
              on ProofBench by roughly fifteen percent over the nearest competitor and reports an IMO 2025
              gold-medal-level result, formally solving five of six problems — exceeding the silver-medal level DeepMind
              reported a year earlier. Its core differentiation is fully formal, Lean 4-based, agentic reasoning that
              returns machine-checkable proofs, in contrast to the informal, probabilistic outputs of general LLMs.
              Because DeepMind's AlphaProof also relies on Lean, the leading formal approaches in fact share a common
              substrate and compete on data, search, and scale rather than on the choice of formalism. Public MiniF2F
              leaderboards, rooted in 2020 generative-proving research, are the shared yardstick — and they show rapid
              convergence, a sign that capability leads here can be transient.

              Productization is where Harmonic separates from research-only rivals: it has shipped a public Aristotle
              API and an iOS app, while DeepMind has no generally available product. Pricing transparency across the
              field is uneven — DeepSeek-Prover and Lean tools are free and open, OpenAI charges usage-based API fees,
              DeepMind sells nothing, and Harmonic's Aristotle pricing is largely undisclosed — which makes a clean
              pricing comparison impossible today and is recorded as an evidence gap. Harmonic's code-verification
              leadership (a state-of-the-art VERINA result) further differentiates it from olympiad-only efforts and
              aligns it with the more commercial verification market.
