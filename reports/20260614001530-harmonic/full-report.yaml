      - number: '1.3'
        title: Product, Milestones, and Stage
        blocks:
          - type: paragraph
            body: >
              Harmonic's product is Aristotle, a formal reasoning agent built on Lean 4 whose architecture combines a
              Lean proof-search system, an informal LLM reasoning component, and a dedicated geometry solver
              (Yuclid+Newclid). The company's milestone chronology is dense for its age: a June 2024 launch with MiniF2F
              state-of-the-art results, a July 2025 gold-medal-level performance at the 2025 International Mathematical
              Olympiad (five of six problems with formally verified proofs), an October 2025 public Aristotle API, a
              December 2025 96.8% state of the art on the VERINA code-verification benchmark, and 2026 community
              commitments including $1 million in mathematician sponsorships and a $300,000 donation to the Lean FRO.
              Underpinning these results is a custom Lean REPL service and automated reinforcement-learning system that
              scales to more than 100,000 CPUs on preemptible cloud instances.

              As of June 2026 Harmonic is a private, Series C-stage company in the AI / formal mathematics / automated
              theorem-proving sector. Its formal-verification approach directly targets the well-documented failure mode
              in which probabilistic language models produce confident but incorrect mathematics — a differentiation
              that doubles as the market-skepticism frame the company must overcome to commercialize. The chronology is
              anchored by public announcements only; internal releases, contract signings, and hiring events are not
              represented and remain a diligence gap.
