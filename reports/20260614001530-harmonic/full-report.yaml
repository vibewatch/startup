      - number: '3.3'
        title: Moat Durability and Competitive Risks
        blocks:
          - type: paragraph
            body: >
              Harmonic's moat rests primarily on capability lead and formal rigor rather than on structural lock-in.
              Switching costs are low and multi-homing is the norm: mathematicians freely combine Lean, general LLMs,
              and specialized provers, so users are not captured. The most durable element is the formal-verification
              approach itself, which eliminates hallucination and yields machine-checkable proofs that informal
              competitors cannot guarantee — reinforced by a synthetic-data and reinforcement-learning flywheel across
              more than one hundred thousand CPUs that is costly for smaller rivals to match, and by brand credibility
              from leading-mathematician endorsements. The Lean relationship, including a $300K donation to the Lean
              FRO, provides partner access but also a dependency Harmonic does not fully control.

              The risks are material. Open-weight competitors such as DeepSeek-Prover commoditize baseline proving,
              while incumbent distribution power lets Google and OpenAI bundle reasoning into platforms that reach users
              Harmonic must acquire individually. Independent reporting cautions that AI mathematical reasoning remains
              error-prone and unproven at scale, adverse evidence that tempers the claimed lead, and converging
              leaderboards show that benchmark advantages are transient. Without disclosed pricing or customer counts,
              competitive durability cannot be fully assessed. The strategic imperative is clear: Harmonic must convert
              a transient benchmark lead into durable advantages — proprietary data, enterprise relationships, or
              verified-output trust — before commoditization erodes pricing power.
