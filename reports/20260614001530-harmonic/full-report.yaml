      - number: '2.3'
        title: Buyers, Segments, and the Adoption Path
        blocks:
          - type: paragraph
            body: >
              Harmonic's demand is split across distinct segments with different budget owners and adoption triggers.
              Professional mathematicians and academic researchers form the high-credibility beachhead: their use is
              funded by research grants and university departments, and the adoption trigger is the ability to formally
              verify proofs and explore open conjectures. Enterprise software-verification teams represent a larger
              commercial pool, with budgets sitting in EDA, security, and safety-engineering functions and an adoption
              trigger tied to the reliability of AI-generated code. Safety-critical engineering in aerospace, chip
              design, and automotive carries structural verification demand shaped by certification regimes, while AI
              developers needing verified outputs form a fourth, fast-emerging segment.

              Today the adoption path is bottom-up and developer-led. A free public Aristotle API and an iOS application
              seed usage among mathematicians and researchers, and only later does the company face the task of
              converting that interest into paid and production deployment. The resulting funnel is extremely top-heavy:
              free usage vastly exceeds any paid or production-deployed usage, implying a long path from awareness to
              durable contracts. Willingness-to-pay is the critical unknown, because free or low-cost frontier LLMs —
              although error-prone on formal mathematics — set a low anchor for what many users expect to pay, and
              Harmonic's compute capital intensity sets a floor under what it must charge.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM025
              - CM028
              - CM030
              - CM034
              - CM035
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
