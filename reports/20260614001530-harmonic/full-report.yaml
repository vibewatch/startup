              gross margin, burn, headcount, and the precise post-money valuations of the Series A and B are not
              disclosed and are recorded here as explicit gaps with concrete diligence paths rather than guessed
              numbers.

              This evidentiary split is the defining feature of Harmonic's profile. The company presents an exceptional
              technical track record and a blue-chip, recurring investor base, but it has demonstrated no revenue model
              and operates with a high-profile chairman whose primary role is running a separate public company. For an
              investment committee, the snapshot therefore reads as a research-stage frontier-AI asset priced on
              milestones and conviction, where the most material unknowns are financial scale and the path from formally
              verified mathematics to durable commercial revenue. These unknowns are catalogued in the snapshot table's
