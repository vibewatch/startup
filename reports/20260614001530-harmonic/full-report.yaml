companyProfile:
  summary: >
    Harmonic is a Palo Alto-based AI research company founded in 2023 by Robinhood co-founder Vlad Tenev and serial AI
    entrepreneur Tudor Achim. Its flagship product, Aristotle, is a fully agentic formal reasoning engine built on the
    Lean 4 proof assistant that combines reinforcement-learning-driven proof search, an informal LLM reasoning layer,
    and a dedicated geometry solver. Aristotle produces machine-checkable proofs with no hallucinations — a structural
    advantage over informal large-language-model reasoning systems. The company achieved gold-medal-level performance at
    the 2025 International Mathematical Olympiad, set state-of-the-art results on the VERINA code verification benchmark
    (96.8%), and ranks #1 on the ProofBench formal mathematics leaderboard. Harmonic has raised $295M across three
    rounds and is valued at $1.45B, backed by Sequoia Capital, Kleiner Perkins, Index Ventures, Ribbit Capital, and
    Paradigm, among others. The company is pre-revenue but has launched a public Aristotle API and a $1M mathematician
    sponsorship program to accelerate community adoption.
