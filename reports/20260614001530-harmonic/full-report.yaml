      - number: '8.3'
        title: Recommendation, Exit Readiness, and Diligence
        blocks:
          - type: paragraph
            body: >
              Our recommendation is a conditional, milestone-disciplined position rather than an unconditional buy at
              the current mark: confidence is medium and the risk rating is high, driven by monetization and burn
              uncertainty rather than technical risk. The strongest value driver is Harmonic's verifiable capability
              leadership — IMO gold, VERINA state-of-the-art, ProofBench number one — which is durable if the benchmark
              lead is maintained, and the most likely value-accretive path on a 3–5 year horizon is enterprise
              verification revenue plus continued capability leadership rather than consumer or grant activity. Because
              the monetization outcome is effectively binary, the appropriate position size is small relative to
              conviction, and we rate Harmonic a conditional buy for asymmetric-return mandates and a pass for
              fundamentals-driven mandates, with the deciding variable being evidence of monetization.

              Entry discipline is essential: at ~$1.45B with no revenue, the margin of safety is thin and depends on
              belief in a large future outcome, and accumulated preference stacks across three rounds could materially
              affect common-equity returns in modest exits, warranting a waterfall analysis. Exit readiness is early —
              IPO is years away and M&A by a cloud or AI major is the more plausible near-to-medium-term exit, where a
              strategic acquirer could value the formal-reasoning IP and team well above financial comps. Thesis-break
              triggers include failure to show paying revenue or enterprise pilots within the runway, loss of the
              benchmark lead, a down round, or reduced founder commitment. Final diligence asks center on burn and
              runway, the monetization pipeline, SPV and cap-table terms, and — highest value of all — independent
              verification of capability generalization beyond competition-style problems.
            claimRefs:
