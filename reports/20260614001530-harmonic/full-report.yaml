      - number: '2.4'
        title: Growth Drivers, Constraints, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >
              Several drivers support market expansion. The reliability crisis around AI-generated code is increasing
              demand for machine-checkable verification that catches bugs before deployment, a thesis around which new
              entrants such as Theorem are also forming. Safety-critical regulation — DO-178C in aerospace and analogous
              automotive standards — creates structural demand for formal verification, and the convergence of large
              language models with formal methods is an active research frontier that is expanding the practical reach
              and credibility of automated mathematical reasoning. The presence of well-funded competitors such as
              Google DeepMind validates the market's strategic importance even as it signals competitive pressure.

              The constraints are equally real. Scarcity of Lean and formal-methods expertise raises switching costs and
              limits the pool of users able to operationalize proof-AI today. Free or low-cost frontier LLMs anchor
              willingness-to-pay low, and Harmonic's reliance on reinforcement learning across more than one hundred
              thousand CPUs implies high compute costs that any pricing must eventually cover. Most important for
              diligence are the sizing gaps: no publisher provides a bottom-up TAM specifically for proof-generating AI,
              Harmonic discloses no revenue or pricing, and published estimates contradict each other by orders of
              magnitude. These gaps are preserved explicitly in the evidence-gap register rather than resolved with
              false precision, and they make the market opportunity a thesis underwritten by top-tier investors rather
              than realized, measurable demand.
            claimRefs:
