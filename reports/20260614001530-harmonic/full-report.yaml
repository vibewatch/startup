      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Formal verification genuinely de-risks the core reliability concern
            body: >
              The single most important technical mitigation is that Aristotle's outputs are machine-checked in Lean:
              incorrect informal reasoning is caught before any answer is certified, so hallucination — the dominant
              reliability risk for AI mathematics — is largely neutralized at the point of certification. This is a
              real, structural advantage over purely informal LLM reasoning and is the strongest mitigation in the risk
              file.
            calloutType: strength
            claimRefs:
              - CR011
              - CR012
          - type: callout
            title: Burn against zero disclosed revenue is the dominant residual risk
            body: >
              Harmonic has raised ~$295M, runs a 100K+ CPU compute program, and discloses no revenue. The
              financial-model risk — unsized burn, runway dependence on future financing, and an unproven monetization
              path in a niche near-term market — is the highest residual exposure for an investor, compounded by
              single-cloud and Lean-ecosystem dependency and key-person concentration around a part-time Executive
              Chairman.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR018
              - CR014
          - type: callout
            title: Make burn, pipeline, and IP/SPV diligence preconditions
            body: >
              Diligence should require the burn rate, runway, compute-cost trajectory, and any enterprise-revenue
              pipeline to size financial-model risk; a litigation/IP search and trademark coexistence position versus
              harmonic.ai; the SPV ownership and control structure; and a security/compliance package. Investors should
              also pre-agree the thesis-break triggers in the kill-criteria table.
            calloutType: recommendation
            claimRefs:
              - CR031
              - CR032
              - CR026
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              Harmonic's November 2025 Series C set a post-money valuation of approximately $1.45 billion on a $120M
              raise led by Ribbit Capital, crossing the unicorn threshold and following a Series B in July 2025 that
              raised $100M at a reported ~$900M valuation. Across Series A ($75M), B ($100M), and C ($120M), the company
              has raised roughly $295M within about fourteen months of its first public round — a rapid cadence that
              reflects momentum pricing on milestones (IMO gold, VERINA state-of-the-art) far more than financial
              performance, since the valuation is set on no disclosed revenue. The step-up from ~$900M to ~$1.45B in
              roughly four months is therefore best read as narrative- and capability-driven rather than
              fundamentals-based.

              The bull thesis is a high-conviction technical and team bet: world-leading formal-reasoning capability
              built by an elite founder pair and validated by a blue-chip syndicate — Sequoia, Kleiner Perkins, Ribbit,
              Index, and Emerson Collective — whose repeat participation signals insider conviction. The anti-thesis is
              that monetization is unproven, the near-term market for formal mathematics is niche, and burn is high, so
              the price embeds a large, unevidenced future commercialization. Syndicate quality is a signal, not a
              guarantee: top-tier backers do not substitute for evidence of revenue. The valuation is best understood as
              a venture-style option on a category-defining capability — defensible as optionality, but not on any
              near-term fundamentals.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
