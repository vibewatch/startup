      - number: '8.2'
        title: Comparables, Scenarios, and Sensitivity
        blocks:
          - type: paragraph
            body: >
              Comparables are inherently difficult: there is no close public peer for a pre-revenue formal-mathematics
              company, so the valuation leans on frontier-AI private rounds and milestone analogies. Relative to
              informal reasoning labs such as OpenAI and Anthropic — valued in the tens to hundreds of billions —
              Harmonic's ~$1.45B is small, but those peers carry substantial revenue Harmonic lacks; meanwhile
              DeepMind's AlphaProof reached IMO silver level inside a corporate parent, a capability comparable with no
              standalone valuation. The broad AI market is large and fast-growing per multiple analysts, supporting a
              sizeable theoretical TAM if formal verification becomes a mainstream software-assurance layer, but that
              backdrop is generic and the gap between a large theoretical TAM and Harmonic's serviceable near-term
              market is the central valuation tension.

              Across scenarios, the bull case sees Harmonic become the verification layer for high-assurance software
              (aerospace, chips, cryptography) plus a research platform, supporting a multi-billion to decacorn outcome;
              the base case is gradual API and enterprise-verification monetization that grows into rather than vastly
              exceeds the current mark; and the bear case is stalled monetization, a persistently niche market, and a
              down round that compresses value well below the Series C mark. Valuation is most sensitive to monetization
              timing and the achievable revenue multiple, then to milestone probability and dilution from future rounds.
              The optionality on "mathematical superintelligence" is a large but uncertain payoff that should be
              probability-weighted rather than taken at face value.
