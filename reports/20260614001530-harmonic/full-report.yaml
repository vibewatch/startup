  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Use Cases
        blocks:
          - type: paragraph
            body: >
              Harmonic's product is Aristotle, a formal reasoning agent built on the Lean 4 proof assistant. Unlike a
              general-purpose chatbot, Aristotle returns machine-checkable proofs: its outputs are verified by the Lean
              kernel, so a returned proof is correct by construction rather than merely plausible. In customer-workflow
              terms, Aristotle addresses concrete jobs that previously demanded extensive manual formalization — proving
              open conjectures, verifying that code meets a specification, formalizing the arguments in a paper, and
              solving olympiad-level problems including geometry. Its agentic design lets it autonomously decompose a
              problem, invoke a dedicated geometry solver when needed, and iterate proof search, sharply reducing the
              human effort required relative to writing Lean proofs by hand.

              The product is delivered through two surfaces: a public Aristotle API launched in October 2025 and an iOS
              application whose beta launched in July 2025, extending formal reasoning beyond API-integrating developers
              toward a broader research and consumer audience. Capability is demonstrated by headline results: Aristotle
              reached IMO 2025 gold-medal level by formally solving five of six problems with no human checking,
              achieved a state-of-the-art 96.8% on the VERINA code-verification benchmark against a prior best near
              4.9%, and progressed on the MiniF2F benchmark from roughly 63% to 83% to 90% as the system matured. The
              reliability advantage is conditional and worth stating precisely: Aristotle guarantees that any proof it
              returns is valid, but not that it will find a proof for every problem, so coverage rather than correctness
              is the open limitation.
            claimRefs:
              - CE001
              - CE005
