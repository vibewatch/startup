      - number: '7.3'
        title: People, Execution, and Mitigations
        blocks:
          - type: paragraph
            body: >
              Execution risk centres on a small founding team. Key-person risk is elevated because co-founder and
              Executive Chairman Vlad Tenev concurrently serves as CEO of Robinhood, splitting his attention, while
              day-to-day execution rests heavily on CEO Tudor Achim — concentrating operational dependence. Talent risk
              is significant: Harmonic competes for a scarce pool of formal-methods and reinforcement-learning
              researchers against far better-resourced labs such as Google DeepMind and OpenAI, the same incumbents that
              pose direct competitive pressure (DeepMind's AlphaProof reached IMO silver-medal level). Reputational and
              trust risk persists because independent commentary remains skeptical of AI reliability in mathematics,
              which can slow adoption regardless of formal guarantees.

              Mitigation maturity is uneven. Technical reliability — formal verification — is genuinely strong, but
              commercial, compliance, and governance mitigations are early-stage or undisclosed. For monitoring,
              sensible thesis-break triggers include failure to demonstrate paying-customer revenue or enterprise pilots
              within the Series C runway window; a sustained spike in compute cost without a commensurate capability or
              commercial return; and the loss of, or a public dispute over, a marquee endorser or key founder. Diligence
              should obtain the burn rate, runway, compute-cost trajectory, and enterprise pipeline to size
              financial-model risk, and should confirm trademark coverage versus harmonic.ai and review the SPV
              ownership structure. On balance, near-term legal and regulatory risk is manageable while financial-model
              and execution risks carry the highest residual exposure — severity-ranked: monetization/burn,
              key-person/execution, competition, dependency concentration, and rising regulation.
            claimRefs:
              - CR014
