      - number: '5.3'
        title: Differentiation, Trust, and Roadmap
        blocks:
          - type: paragraph
            body: >
              Aristotle's core differentiator is formal verification: because outputs are checked by the independently
              developed, widely scrutinized Lean kernel, the system does not hallucinate proofs the way informal LLMs
              can, and quality control is intrinsic to the output format rather than reliant on post-hoc human review.
              This makes the product especially suited to high-assurance domains — safety-critical software,
              cryptography, and chip design — where machine-checkable correctness matters more than fluent prose. Trust
              is further reinforced by reproducibility: Harmonic open-sourced its formally verified IMO 2025 proofs in a
              public GitHub repository, and has released supporting tooling such as the geometry solver and the MiniF2F
              dataset. Benchmark transparency is, however, mixed: the IMO 2025 proofs are open and reproducible, but
              ProofBench and VERINA leadership rely partly on company-reported figures, and independent validation
              beyond the open proofs is limited.

              On readiness, the product's maturity is uneven. Theorem-proving and benchmark capability are highly
              mature, while enterprise deployment, security, and integration tooling are comparatively early: enterprise
              security, privacy, and compliance controls (SOC 2, data handling, API SLAs and rate limits) are not
              publicly documented, a gap relative to enterprise-grade software expectations and a key diligence item.
              The roadmap has advanced quickly — iOS beta in July 2025, public API in October 2025, VERINA state of the
              art in December 2025, and community programs in early 2026 — and continued capital from the $120M Series C
              is explicitly oriented toward scaling the compute and research the architecture requires. The overall
              technology verdict is a genuinely differentiated, capability-leading formal-reasoning stack whose
              principal risks are ecosystem dependency, compute intensity, and undocumented enterprise controls.
