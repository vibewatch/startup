      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capability proofs are expanding the served market from math to code verification
            body: >
              Harmonic's IMO 2025 gold-level result and its state-of-the-art VERINA code-verification score do more than
              establish technical credibility: they widen the credibly addressable market from a tiny
              olympiad-mathematics niche toward software verification, a larger and more commercially mature pool where
              demand for catching AI-generated bugs is already attracting new entrants. This expansion is the most
              important positive market dynamic, because it moves Harmonic toward a buyer with a real budget and a
              concrete pain point rather than relying solely on the research community.
            calloutType: strength
            claimRefs:
              - CM020
              - CM027
              - CM033
              - CM034
          - type: callout
            title: The market is a thesis, not yet realized demand
            body: >
              No publisher isolates a TAM for proof-generating AI, Harmonic discloses no revenue or pricing, and
              published estimates contradict each other by orders of magnitude. The serviceable obtainable market today
              is effectively pre-commercial, and the adoption funnel is dominated by free usage. The market opportunity
              is therefore underwritten by top-tier investor conviction and capability leadership rather than measurable
              served demand, and the central diligence task is to test whether free interest can convert into durable,
              priced contracts.
            calloutType: risk
            claimRefs:
              - CM007
              - CM021
              - CM022
              - CM023
          - type: callout
            title: Willingness-to-pay sits between a low LLM anchor and a high compute floor
            body: >
              Harmonic's pricing power is squeezed from two sides: free or low-cost frontier LLMs anchor what many users
              expect to pay near zero, while reinforcement learning across more than one hundred thousand CPUs sets a
              high cost-to-serve floor. The viability of each target segment depends on whether the value of formally
              verified, hallucination-free outputs in high-stakes domains is enough to clear that floor. Quantifying
              per-proof unit economics and segment willingness-to-pay should be a priority diligence ask.
            calloutType: assumption
            claimRefs:
              - CM016
              - CM018
              - CM035
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Substitutes
        blocks:
          - type: paragraph
            body: >
              Harmonic competes across a layered landscape. Its closest direct competitor is Google DeepMind, whose
              AlphaProof and AlphaGeometry systems reached silver-medal standard at the 2024 International Mathematical
              Olympiad using Lean-based formal reasoning — though as a peer-reviewed research program rather than a
              commercial product. The most direct open-weight challenger is DeepSeek-Prover, which advances Lean-based
              proving through large-scale synthetic data and reinforcement learning with proof-assistant feedback, and
              whose free availability is the field's principal commoditization force. A second layer comprises
              informal-reasoning incumbents: OpenAI's o-series and Meta's LLaMA-based models solve math problems
              probabilistically but do not return machine-checkable proofs.

              Beneath the model competitors sits the open-source Lean ecosystem itself — Lean 4, Mathlib, and community
              tooling — which is simultaneously the platform Harmonic builds on and a free substitute users can adopt
              directly, alongside the established interactive theorem provers Coq and Isabelle that represent the manual
              status quo. Adjacent entrants such as Theorem, a $6M-seed startup targeting AI-written bugs, compete for
              the same code-verification use case, while well-resourced labs with Lean expertise and compute pose a
              latent internal-build threat. The landscape therefore spans direct peers, informal incumbents, open-source
              substitutes, adjacent entrants, and likely future entrants.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP021
              - CP027
              - CP034
          - type: table
