        blocks:
          - type: paragraph
            body: >
              The cover metrics for Harmonic split cleanly into well-evidenced and unavailable. Valuation ($1.45B),
              total raised (~$295M), latest round ($120M Series C), founding (2023), public launch (June 2024),
              headquarters (Palo Alto plus a London office), and benchmark performance (IMO gold-medal level, VERINA
