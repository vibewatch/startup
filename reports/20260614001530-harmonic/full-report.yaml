      - number: '7.2'
        title: Financial-Model and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              The dominant risk in the file is commercial: Harmonic has raised roughly $295M across Series A–C but
              discloses no revenue, so its monetization path is unproven. The program is extremely compute-intensive — a
              REPL service scaling to 100K+ CPUs on preemptible cloud — which implies high and variable burn, making
              runway and burn rate the central financial-model risks even though the $120M Series C provides near-term
              cushion. As a pre-revenue company, Harmonic depends on continued access to venture financing on acceptable
              terms; financing has been routed through pooled SPV vehicles per SEC Form D filings, a structure diligence
              should map to ownership and control. Customer-concentration risk is moot today because no revenue-bearing
              customers are disclosed, but the flip side is the absence of any diversified revenue base to absorb
              shocks, and the niche near-term market for formal mathematics lengthens the road to scale.

              Dependency risk concentrates several critical external relationships. Harmonic relies materially on the
              open-source Lean 4 proof assistant and the Lean FRO ecosystem — a dependency it does not control, only
              partly offset by its $300K donation — and on a single cloud provider for preemptible capacity, exposing it
              to availability and pricing shifts. The Lean ecosystem, single-cloud infrastructure, and VC capital are
              each individually manageable but collectively material, and the operational security posture for the API
              and app remains undisclosed. The risk transmission path runs from high burn and zero revenue into
              financing dependence and valuation sensitivity, with competition and trust risks feeding adoption.
            claimRefs:
              - CR001
              - CR002
              - CR003
