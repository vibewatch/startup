            title: An exceptionally high-quality reference base for a young company
            body: >
              Few early-stage companies can point to Terence Tao — one of the world's foremost mathematicians — engaging
              with and endorsing their product, alongside other named researchers and a community-reproducible set of
              formally verified IMO 2025 proofs. This reference quality is a genuine asset: in a tight-knit field, elite
              credibility and verifiable artifacts build trust faster than marketing, and the $1M sponsorship program
              turns users into advocates.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU027
              - CU034
          - type: callout
            title: Reference-led adoption is not the same as commercial traction
            body: >
              Every piece of customer evidence is research-use or advocacy rather than production enterprise deployment
              with measured outcomes, and Harmonic discloses no active-user counts, paying customers, retention, or
              revenue bands. The adoption narrative leans heavily on a few elite endorsers, and conversion from free
              research use to paying customers — the single most important step — is entirely unproven. The apparent
              traction risks being overstated by the calibre of endorsers.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU013
              - CU021
          - type: callout
            title: Make active-user, conversion, and retention metrics a diligence precondition
            body: >
              Because the customer story is reference-led, diligence should require active and paying user counts,
              free-to-paid conversion, retention cohorts, satisfaction data, and any enterprise pilot references with
              production-versus-pilot status and measured outcomes. Converting the high-credibility reference base into
              denominators and durability metrics is the key to underwriting Harmonic's customer value.
            calloutType: recommendation
            claimRefs:
              - CU026
              - CU028
              - CU033
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Model Risk
        blocks:
          - type: paragraph
            body: >
              Harmonic's regulatory exposure is presently light-touch — it ships a research-and-developer tool rather
              than a regulated product — but the environment is tightening. The EU AI Act introduces obligations for
              general-purpose and high-risk AI, and an escalation that classified advanced reasoning models as high-risk
              would raise compliance cost; this is a watch-item rather than a present blocker. In the United States,
              federal executive action and the NIST AI Risk Management Framework signal a governance trajectory that
              could eventually reach capable reasoning systems, and dual-use or export considerations may follow.
              Privacy and security obligations already attach to the consumer iOS app and public API, yet Harmonic's
              compliance posture is not publicly documented — an unresolved gap given its enterprise-verification
              ambitions.

              The most concrete legal risk is brand and trademark collision with the unrelated "harmonic.ai", which can
              cause market confusion and potential IP friction; diligence should confirm trademark coverage and any
              coexistence arrangements. No active litigation, enforcement action, or penalty against harmonic.fun is
              disclosed in public sources, though absence of disclosure is not proof of absence. On model risk,
              hallucination is a known failure mode of the informal-reasoning component, but formal Lean verification is
              the core mitigation: machine-checked proofs catch incorrect reasoning before any answer is certified,
              materially reducing reliability risk relative to purely informal AI. The residual concern is
              generalization — benchmark overfitting or synthetic-data limits could overstate real-world capability
              beyond competition-style problems.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
