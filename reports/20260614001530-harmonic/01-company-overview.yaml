sections:
  - id: identity-and-founders
    title: Identity, Mission, and Founders
    body: >
      Harmonic is a Palo Alto-headquartered artificial intelligence company founded in 2023 by Tudor Achim and Vlad
      Tenev with the explicit mission of building "mathematical superintelligence" (MSI): AI that reasons through
      rigorous, formally verified mathematics rather than probabilistic pattern-matching. The company operated in
      relative stealth for roughly a year before its June 2024 public introduction, which it paired with a
      state-of-the-art result on the MiniF2F theorem-proving benchmark. Its one-line identity is best summarized as the
      builder of Aristotle, a formal reasoning agent on the Lean 4 proof assistant whose outputs are machine-checkable.

      The founding team is unusually credentialed for this niche. Tudor Achim, Co-Founder and CEO, previously co-founded
      and served as CTO of the autonomous-driving company Helm.ai and holds a B.S. in Computer Science from Carnegie
      Mellon and was a Ph.D. candidate at Stanford. Vlad Tenev, Co-Founder and Executive Chairman, is simultaneously
      Co-Founder and CEO of the publicly traded Robinhood Markets and holds a B.S. in Mathematics from Stanford and an
      M.S. in Mathematics from UCLA, anchoring Harmonic in the formal-mathematics community it now serves. That dual
      role is also the company's most visible key-person consideration, concentrating attention on a founder who runs a
      separate public company.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO019
      - CO020
      - CO025
      - CO031
    tableRefs:
      - TO002
    figureRefs:
      - FO002
  - id: funding-and-investors
    title: Funding History and Investor Backing
    body: >
      Harmonic has raised approximately $295 million in disclosed primary capital across three rounds in roughly
      fourteen months. The $75 million Series A (September 2024) was led by Sequoia Capital with significant
      participation from Index Ventures; the $100 million Series B (announced July 2025) was led by Kleiner Perkins with
      significant backing from Paradigm; and the $120 million Series C (November 25, 2025) was led by Ribbit Capital and
      added Emerson Collective, the organization founded by Laurene Powell Jobs, as a new investor. The Series C valued
      Harmonic at $1.45 billion, crossing the unicorn threshold. Independent analyst coverage places the post-money
      progression near $325M, about $900M, and $1.45B respectively, though the earlier post-money figures are estimates.

      The investor roster is deep and recurring: Sequoia and Index Ventures have backed every round to date, Kleiner
      Perkins and Ribbit have escalated their commitments, and the broader base includes Paradigm, ERA Funds, GreatPoint
      Ventures, Blossom Capital, and DST Global partners. Governance signals follow the money — Sequoia's Andrew Reed
      took a board director seat at the Series A, with Index's Jan Hammer and later Kleiner Perkins' Ilya Fushman joining
      as observers. Repeat participation across consecutive rounds is the clearest external evidence of conviction in a
      company that has yet to disclose any revenue, making the funding history both the strongest validation signal and
      the locus of the central valuation question.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO027
      - CO032
      - CO034
      - CO036
    tableRefs:
      - TO003
    figureRefs: []
  - id: product-milestones-stage
    title: Product, Milestones, and Stage
    body: >
      Harmonic's product is Aristotle, a formal reasoning agent built on Lean 4 whose architecture combines a Lean
      proof-search system, an informal LLM reasoning component, and a dedicated geometry solver (Yuclid+Newclid). The
      company's milestone chronology is dense for its age: a June 2024 launch with MiniF2F state-of-the-art results, a
      July 2025 gold-medal-level performance at the 2025 International Mathematical Olympiad (five of six problems with
      formally verified proofs), an October 2025 public Aristotle API, a December 2025 96.8% state of the art on the
      VERINA code-verification benchmark, and 2026 community commitments including $1 million in mathematician
      sponsorships and a $300,000 donation to the Lean FRO. Underpinning these results is a custom Lean REPL service and
      automated reinforcement-learning system that scales to more than 100,000 CPUs on preemptible cloud instances.

      As of June 2026 Harmonic is a private, Series C-stage company in the AI / formal mathematics / automated
      theorem-proving sector. Its formal-verification approach directly targets the well-documented failure mode in
      which probabilistic language models produce confident but incorrect mathematics — a differentiation that doubles
      as the market-skepticism frame the company must overcome to commercialize. The chronology is anchored by public
      announcements only; internal releases, contract signings, and hiring events are not represented and remain a
      diligence gap.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO022
      - CO023
      - CO024
      - CO026
      - CO028
      - CO030
      - CO035
      - CO037
    tableRefs:
      - TO004
    figureRefs:
      - FO001
  - id: snapshot-metrics-gaps
    title: Snapshot Metrics and Evidence Gaps
    body: >
      The cover metrics for Harmonic split cleanly into well-evidenced and unavailable. Valuation ($1.45B), total raised
      (~$295M), latest round ($120M Series C), founding (2023), public launch (June 2024), headquarters (Palo Alto plus
      a London office), and benchmark performance (IMO gold-medal level, VERINA 96.8% SOTA) are all supportable from
      primary or high-reputation sources. By contrast, revenue, run-rate, gross margin, burn, headcount, and the
      precise post-money valuations of the Series A and B are not disclosed and are recorded here as explicit gaps with
      concrete diligence paths rather than guessed numbers.

      This evidentiary split is the defining feature of Harmonic's profile. The company presents an exceptional
      technical track record and a blue-chip, recurring investor base, but it has demonstrated no revenue model and
      operates with a high-profile chairman whose primary role is running a separate public company. For an investment
      committee, the snapshot therefore reads as a research-stage frontier-AI asset priced on milestones and conviction,
      where the most material unknowns are financial scale and the path from formally verified mathematics to durable
      commercial revenue. These unknowns are catalogued in the snapshot table's confidence column and in the chapter's
      evidence-gap register.
    claimRefs:
      - CO009
      - CO010
      - CO018
      - CO020
      - CO021
      - CO029
      - CO033
      - CO038
    tableRefs:
      - TO001
    figureRefs:
      - FO003
