chapter:
  number: 1
  title: Company Overview
  summary: >-
    Harmonic is a Palo Alto- and London-based AI company founded in 2023 by Tudor Achim (CEO) and Vlad Tenev
    (Executive Chairman, Robinhood CEO) to build "mathematical superintelligence" via Aristotle, a formally verified
    theorem-proving agent on Lean 4. By June 2026 it has raised $295M across three rounds (Series C $120M at a $1.45B
    valuation), reached IMO gold-medal-level performance, and shipped a public Aristotle API — while disclosing no
    revenue.
