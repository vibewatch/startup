      severity: material
      topic: Harmonic discloses no revenue, ARR, gross margin, or burn-rate figures; financial scale is unknown.
      missingEvidence: Audited or management revenue, run-rate, burn, and gross-margin figures.
      whyItMatters: Without any revenue signal, the $1.45B valuation rests entirely on technical milestones and investor conviction.
      diligencePath: Request management financials and a data-room P&L; cross-check with Sacra estimates.
