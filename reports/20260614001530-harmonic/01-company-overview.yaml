callouts:
  - title: Blue-chip, recurring investor base validates a pre-revenue thesis
    body: >
      Harmonic's clearest external signal is the repeat participation of top-tier investors: Sequoia Capital and Index
      Ventures have backed every round from Series A through Series C, with Kleiner Perkins and Ribbit Capital escalating
      their commitments and Emerson Collective joining at the Series C. For a company with no disclosed revenue, this
      recurring conviction across a $75M, $100M, and $120M sequence — culminating in a $1.45B valuation — is the primary
      underwriting evidence and the reason the technical milestones are being priced as a frontier-AI asset.
    claimRefs:
      - CO009
      - CO011
      - CO027
      - CO032
    calloutType: strength
  - title: No disclosed revenue is the central diligence gap
    body: >
      Harmonic has demonstrated extraordinary technical results but no public revenue, run-rate, or monetization model
      as of 2026. Independent coverage characterizes it as research-stage, and mainstream reporting continues to flag
      that AI's mathematical reliability is unproven at commercial scale. The valuation therefore rests on milestones
      and conviction rather than financial traction, making revenue scale and a credible path from formal verification
      to durable contracts the most important unknowns for an investment committee.
    claimRefs:
      - CO021
      - CO022
      - CO033
      - CO038
    calloutType: risk
  - title: Key-person concentration in a part-time chairman
    body: >
      Vlad Tenev is Harmonic's public face and Executive Chairman while simultaneously serving as CEO of the publicly
      traded Robinhood Markets. That dual role lends Harmonic visibility and capital-markets credibility but
      concentrates reputational and strategic dependency on a founder whose primary operating responsibility lies
      elsewhere, a governance consideration diligence should weigh against CEO Tudor Achim's full-time operating role.
    claimRefs:
      - CO005
      - CO020
      - CO031
    calloutType: assumption
