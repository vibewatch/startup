      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >
              成本侧的定义性特征是资本强度。主导驱动因素是算力：公司披露大规模强化学习可在抢占式 CPU 集群上扩展到超过十万个 CPU，同时还需要 Palo Alto 和 London
              的专业研究与工程人才。由于没有已确认收入，也未披露每次证明或验证运行的服务成本，毛利率对外未定义；在算力受限架构下，单次 Aristotle
              运行的交付成本——今天未披露——将决定任何未来毛利率。营运资金和资本开支细节也未披露；资产基础实质上是无形的——模型、数据和人才——加上租用的抢占式算力，而非自有基础设施。

              销售效率代理指标同样不可得。Harmonic 没有披露付费客户，采用自下而上、研究导向的动作，因此无法计算获客成本、回本期和销售周期。当前市场拓展 支出偏向社区投资——免费 API 和 $1M
              赞助——而不是可度量的付费获客渠道。诚实结论是，单位经济画像由一系列空白格构成，只有管理层披露才能填上；本报告明确列出这些缺口，而不是用虚假精度估算。
