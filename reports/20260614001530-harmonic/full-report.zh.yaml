      - number: '2.4'
        title: 增长驱动、约束与规模缺口
        blocks:
          - type: paragraph
            body: >
              多个驱动因素支撑市场扩张。AI 生成代码的可靠性危机正在提高对机器可检验证明的需求，以便在部署前抓住 bug；Theorem 等新进入者也围绕这一论点成形。安全关键监管——航空航天的 DO-178C
              及类似汽车标准——创造了对形式验证的结构性需求，而大语言模型与形式方法的融合是活跃研究前沿，正在扩大自动数学推理的实际覆盖和可信度。Google DeepMind
              等资金充足的竞争者入场，既验证了市场的战略重要性，也提示竞争压力。

              约束同样真实。Lean 和形式方法人才稀缺，提高切换成本，也限制了今天能把证明 AI 落地的用户池。免费或低成本前沿 LLM 把付费意愿压低，而 Harmonic 依赖超过十万个 CPU
              的强化学习，意味着高算力成本最终必须由定价覆盖。尽调最重要的是规模缺口：没有发布方提供专门针对证明生成 AI 的自下而上 TAM，Harmonic
              不披露收入或定价，公开估算彼此相差数个数量级。本报告将这些缺口明确保留在证据缺口登记表中，而不是用虚假精度抹平；这也说明市场机会仍是由顶级投资人承销的论点，而不是已经实现、可度量的需求。
