      - number: '3.2'
        title: 能力、差异化与定价
        blocks:
          - type: paragraph
            body: >
              能力上，Harmonic 将自己定位为形式推理领导者。公司称 Aristotle 在 ProofBench 上排名第一，领先最接近竞争者约 15%，并报告 IMO 2025
              金牌水平结果，形式化解出六题中的五题——超过 DeepMind 一年前报告的银牌水平。核心差异化是完全形式化、基于 Lean 4 的自主推理，可返回机器可检验证明，而不是通用 LLM 的非形式化、概率式输出。由于
              DeepMind 的 AlphaProof 也依赖 Lean，领先的形式化路线事实上共享底层基座，竞争点在数据、搜索和规模，而不是形式系统选择。公开 MiniF2F 排行榜源于 2020
              年生成式证明研究，是共同标尺；这些榜单显示能力快速收敛，说明此处领先可能很短暂。

              产品化是 Harmonic 与纯研究对手拉开差距的地方：公司已发布公开 Aristotle API 和 iOS 应用，而 DeepMind 没有普遍可用产品。全领域定价透明度不均——DeepSeek-Prover
              和 Lean 工具免费且开源，OpenAI 按 API 用量收费，DeepMind 不销售产品，Harmonic 的 Aristotle
              定价基本未披露——因此今天无法做干净的定价比较，本报告将其记为证据缺口。Harmonic 的代码验证领先（VERINA SOTA 结果）进一步把它与只做奥赛的努力区分开，并使其贴近更商业化的验证市场。
