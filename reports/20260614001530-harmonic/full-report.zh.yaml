chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与创始人
        blocks:
          - type: paragraph
            body: >
              Harmonic 是一家总部位于 Palo Alto 的人工智能公司，2023 年由 Tudor Achim 和 Vlad Tenev
              创立，明确使命是打造「数学超级智能」（MSI）：一种靠严谨、形式化验证的数学推理，而不是概率式模式匹配来工作的 AI。公司低调运转约一年后，于 2024 年 6 月公开亮相，并同步发布 MiniF2F
              定理证明基准的 SOTA 成绩。一句话概括，它是 Aristotle 的开发者；Aristotle 是运行在 Lean 4 证明助手上的形式化推理智能体，输出可由机器检验。

              创始团队在这一细分领域资历很强。联合创始人兼 CEO Tudor Achim 此前联合创办自动驾驶公司 Helm.ai 并担任 CTO，拥有 Carnegie Mellon 计算机科学学士学位，也曾是
              Stanford 博士候选人。联合创始人兼执行董事长 Vlad Tenev 同时也是上市公司 Robinhood Markets 的联合创始人兼 CEO，拥有 Stanford 数学学士和 UCLA
              数学硕士学位，为 Harmonic 连接其服务的形式数学社区。这一双重身份也是公司最显眼的关键人物问题：市场注意力集中在一位还要经营另一家上市公司的创始人身上。
