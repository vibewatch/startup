      - number: '6.3'
        title: 留存、扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              从持久性看，记录很薄。Harmonic 没有披露留存、净收入留存、流失、续约或 cohort 数据；满意度信号也只停留在定性背书，没有结构化调研或 NPS
              证据，使用能否持续无法验证。从免费研究使用走向付费企业验证，这条「先落地、再扩张」路径说得通，VERINA 能力也能支撑这一方向；但公司没有披露扩张 cohort
              或追加销售指标来证明路径成立。用户获取又是自下而上、免费的，能否转化为付费客户，仍是客户故事里最重要、也最未被证明的一步。用户信任是 AI 数学采用的核心门槛；独立报道提醒，可靠性担忧会压低用户依赖 AI
              生成数学的速度。不过，形式化验证正面切入这个门槛：它给专家用户提供机器可检查的理由，让他们信任输出。

              集中和渠道风险眼下更偏概念，不是财务风险。公司没有披露有收入的客户，也就没有可集中的收入；大客户风险体现为声誉——依赖少数精英背书者——而不是收入暴露。渠道和伙伴依赖更多落在开源 Lean
              社区和学术网络，而不是商业经销商；企业采用可能面临较高采购摩擦，因为安全和合规姿态未成文档，用户也需要熟悉 Lean。Emerson Collective 作为 Series C
              投资者进入，带来一个战略利益相关方，但它是出资方，不是产品客户。总体判断是：参考基础可信且质量高，研究采用在增长；但公司完全没有披露商业客户指标，削弱了这一故事。尽调应优先看活跃用户数、免费转付费、留存
              cohort，以及任何企业试点。
