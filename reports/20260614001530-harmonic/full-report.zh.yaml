      - number: '1.3'
        title: 产品、里程碑与阶段
        blocks:
          - type: paragraph
            body: >
              Harmonic 的产品是 Aristotle，一个基于 Lean 4 构建的形式化推理智能体，架构结合 Lean 证明搜索系统、非形式化 LLM
              推理组件和专用几何求解器（Yuclid+Newclid）。公司成立时间不长，但里程碑密集：2024 年 6 月发布并拿下 MiniF2F SOTA；2025 年 7 月在 2025
              年国际数学奥林匹克达到金牌水平（六题中五题给出形式化验证证明）；2025 年 10 月推出公开 Aristotle API；2025 年 12 月在 VERINA 代码验证基准上达到 96.8%
              SOTA；2026 年社区承诺包括 $1M 数学家赞助和向 Lean FRO 捐赠 $300,000。支撑这些结果的是定制 Lean REPL 服务和自动强化学习系统，可在抢占式云实例上扩展到超过 100,000
              个 CPU。

              截至 2026 年 6 月，Harmonic 是 AI / 形式数学 / 自动定理证明领域的一家私有 Series C
              阶段公司。它的形式验证路线直指概率语言模型的已知失效模式：模型会自信地产生错误数学。差异化本身也构成公司商业化必须跨过的市场怀疑框架。时间线只锚定公开公告；内部版本、合同签署和招聘事件未被纳入，仍是尽调缺口。
