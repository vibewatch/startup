      - number: '3.3'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Harmonic 的护城河主要建立在能力领先和形式严谨性上，而不是结构性锁定。切换成本低，多栖使用是常态：数学家会自由组合 Lean、通用 LLM
              和专用证明器，用户没有被锁住。最持久的要素是形式验证路线本身：它消除幻觉，并给出非形式化竞争者无法保证的机器可检验证明；超过十万个 CPU
              的合成数据与强化学习飞轮也强化了这一点，小型对手难以匹配成本，顶尖数学家背书又带来品牌可信度。与 Lean 的关系，包括向 Lean FRO 捐赠 $300K，带来合作伙伴入口，也带来 Harmonic
              无法完全控制的依赖。

              风险很实质。DeepSeek-Prover 等开放权重竞争者会把基础证明能力商品化，而 Google 和 OpenAI 的分发能力可以把推理打包进平台，触达 Harmonic
              必须逐个获取的用户。独立报道提醒，AI
              数学推理仍易错且未在规模上验证，这是削弱领先叙事的反向证据；收敛中的排行榜也显示基准优势会短暂。没有披露定价或客户数，就无法完整评估竞争持久性。战略要务很清楚：Harmonic
              必须在商品化侵蚀定价权之前，把短暂的基准领先转化为持久优势——专有数据、企业关系或可验证输出信任。
