  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与用例
        blocks:
          - type: paragraph
            body: >
              Harmonic 的产品是 Aristotle，一个基于 Lean 4 证明助手构建的形式推理智能体。不同于通用聊天机器人，Aristotle 返回机器可检验证明：输出由 Lean
              内核验证，因此返回的证明按构造即为正确，而不只是看起来合理。放在客户工作流里，Aristotle
              处理的是过去需要大量人工形式化的具体任务——证明开放猜想、验证代码满足规格、形式化论文中的论证、解决包括几何在内的奥赛级问题。自主智能体设计让它能自动拆解问题，必要时调用专用几何求解器，并迭代证明搜索，相比手写
              Lean 证明大幅降低人力投入。

              产品通过两个界面交付：2025 年 10 月推出的公开 Aristotle API，以及 2025 年 7 月启动测试版的 iOS 应用，将形式推理从 API
              集成开发者扩展到更广泛的研究和消费者受众。能力由头部结果证明：Aristotle 在 IMO 2025 达到金牌水平，在无人检查下形式化解出六题中的五题；在 VERINA 代码验证基准上达到 SOTA
              96.8%，此前最佳约 4.9%；随着系统成熟，MiniF2F 基准从约 63% 提升到 83% 再到 90%。可靠性优势有条件，必须说清：Aristotle
              保证它返回的任何证明都是有效的，但不保证每个问题都能找到证明，因此开放限制是覆盖率而非正确性。
