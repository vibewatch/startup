      - number: '7.3'
        title: 团队、执行与缓释
        blocks:
          - type: paragraph
            body: >
              执行风险集中在小型创始团队。关键人物风险偏高：联合创始人兼 Executive Chairman Vlad Tenev 同时担任 Robinhood CEO，注意力被分割；日常执行又高度压在 CEO Tudor
              Achim 身上，运营依赖集中。人才风险也很重：Harmonic 要和 Google DeepMind、OpenAI
              等资源更厚的实验室争夺稀缺的形式化方法和强化学习研究者；这些在位者也带来直接竞争压力（DeepMind 的 AlphaProof 达到 IMO 银牌水平）。声誉和信任风险持续存在，因为独立评论仍怀疑 AI
              在数学中的可靠性；即便有形式化保证，采用速度也可能放慢。

              缓释成熟度不均衡。技术可靠性——形式化验证——确实强；但商业、合规和治理缓释还处早期，或尚未披露。监控上，合理的 thesis-break 触发器包括：在 Series C runway
              窗口内无法展示付费客户收入或企业试点；算力成本持续飙升，却没有相称的能力或商业回报；失去标志性背书者或关键创始人，或围绕他们出现公开争议。尽调应拿到 burn
              rate、runway、算力成本轨迹和企业管线，以衡量财务模型风险；还应确认相对 harmonic.ai 的商标覆盖，并审查 SPV
              所有权结构。总体看，近期法律和监管风险可管理，财务模型和执行风险的剩余暴露最高——按严重程度排序：变现 / burn、关键人物 / 执行、竞争、依赖集中、监管上升。
