        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >
              Harmonic 客户故事最亮眼的地方，是具名用户的分量。最突出的名字是 Terence Tao；他被广泛视为全球最顶尖的数学家之一，曾公开谈到 AI 是否已准备好处理数学问题，Harmonic 也把他的证言放在
              Aristotle 产品页上，作为参考背书。除 Tao 外，与 Aristotle 及 Harmonic 形式化证明工作相关的具名研究用户和合作者还包括 Ilya Sergey、Bartosz
              Naskręcki、David Renshaw 和 Lorenzo Luccioli；Aristotle
              预印本庞大的共同作者阵容，也说明学术界既在使用，也在共同贡献。对一家年轻公司而言，这是真正高质量的参考基础。

              关键提醒是，这类证据能证明什么、不能证明什么。现有证据压倒性地指向研究使用和倡导——证言、共同署名、赞助——而不是带有可衡量业务结果的企业生产部署。最接近生产级的证据，其实是 GitHub 上社区可复现的 IMO
              2025 证明集；它比营销证言更像一个可验证的部署产物。因此，参考质量能支撑可信度，却不能单独证明商业牵引或经常性付费使用；采用叙事也高度依赖少数精英背书者，尤其是
              Tao。相比典型企业软件客户群，Harmonic 更像参考背书驱动、仍处商业化前期。
