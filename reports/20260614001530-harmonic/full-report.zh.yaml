  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: |
      按发生概率、影响、缓释成熟度和残余严重性评价 Harmonic 的主要风险；货币化 / 烧钱和执行是最高的残余暴露。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: 货币化 / 烧钱
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 关键人物 / 执行
          values:
            - 中高
            - 高
            - 低中
            - 高
        - label: 竞争
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 依赖集中
          values:
            - 中
            - 高
            - 中
            - 中
        - label: 监管
          values:
            - 中
            - 中
            - 低中
            - 中
        - label: 模型可靠性
          values:
            - 中
            - 低
            - 高
            - 低
    claimRefs:
      - CR025
      - CR033
      - CR036
      - CR012
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: |
      Harmonic 的根本风险——无收入、高烧钱、竞争、信任——如何传导到融资依赖、估值敏感性和执行结果。
    data:
      nodes:
        - id: n1
          label: 未披露收入
        - id: n2
          label: 高且波动的算力消耗
        - id: n3
          label: 融资依赖
        - id: n4
          label: 竞争（DeepMind / OpenAI）
        - id: n5
          label: 信任 / 采用风险
        - id: n6
          label: 估值敏感性
        - id: n7
          label: 执行 / 关键人物风险
      edges:
        - from: n1
          to: n3
        - from: n2
          to: n3
        - from: n3
          to: n6
        - from: n4
          to: n5
        - from: n5
          to: n1
        - from: n7
          to: n6
        - from: n4
          to: n6
    claimRefs:
      - CR001
      - CR030
      - CR017
      - CR024
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: |
      Harmonic 的关键外部依赖包括资本、云、Lean 生态、工具和人才；这些依赖共同支撑 Aristotle 产品和公司。
    data:
      nodes:
        - id: d1
          label: VC 资本辛迪加
        - id: d2
          label: 单一云服务商
        - id: d3
          label: Lean FRO / Lean 4
        - id: d4
          label: 开源工具栈
        - id: d5
          label: 专才市场
        - id: d6
          label: Aristotle 产品 / 公司
      edges:
        - from: d1
          to: d6
        - from: d2
          to: d6
        - from: d3
          to: d6
        - from: d4
          to: d6
        - from: d5
          to: d6
    claimRefs:
      - CR008
      - CR010
      - CR034
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: |
      从市场规模和能力证明出发，经由风险与估值基础，推导出有条件、受里程碑约束的投资建议。
    data:
      nodes:
        - id: r1
          label: 理论 AI / 验证 TAM 庞大
        - id: r2
          label: 世界领先能力证明（IMO / VERINA）
        - id: r3
          label: 无收入、高烧钱、近期市场小众
        - id: r4
          label: 约 $1.45B，叙事驱动估值
        - id: r5
          label: 有条件买入（非对称）/ 放弃（基本面）
      edges:
        - from: r1
          to: r4
        - from: r2
          to: r4
        - from: r3
          to: r4
        - from: r4
          to: r5
        - from: r2
          to: r5
        - from: r3
          to: r5
    claimRefs:
      - CV021
      - CV030
      - CV040
      - CV023
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: |
      用定性影响指数衡量 Harmonic 估值对关键驱动因素的相对敏感性；货币化时点和收入倍数最关键。
    data:
      items:
        - label: 货币化时点
          value: 95
          detail: 付费收入何时到来
          tone: high
        - label: 可实现收入倍数
          value: 85
          detail: 品类重估潜力
          tone: high
        - label: 里程碑 / 能力概率
          value: 70
          detail: 持续守住基准领先
          tone: medium
        - label: 未来轮次稀释
          value: 55
          detail: 资本强度、优先权
          tone: warning
        - label: 算力成本 / 毛利
          value: 50
          detail: 烧钱 vs 单位经济
          tone: warning
    claimRefs:
      - CV017
      - CV018
      - CV013
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: |
      在明确、假设驱动的逻辑下，给出入场以及牛 / 基准 / 熊退出情景的示意估值区间（$B）；货币化不确定性越高，区间越大幅拉宽。
    data:
      items:
        - label: 入场（Series C 轮后估值）
          low: 1.45
          high: 1.45
          detail: 当前估值标记，无收入
        - label: 熊市退出
          low: 0.3
          high: 0.8
          detail: 货币化停滞 / 下轮降估值
        - label: 基准退出
          low: 2.5
          high: 4
          detail: 企业端逐步货币化
        - label: 牛市退出
          low: 10
          high: 20
          detail: 验证层 / 十角兽结果
    claimRefs:
      - CV014
      - CV015
      - CV016
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: |
      面向投委会的 1-5 分评分覆盖市场、能力证明、护城河、经济性、风险、估值和证据质量；总体是高能力、高风险、安全边际薄的资产画像。
    data:
      items:
        - label: 市场机会
          value: 4
          detail: TAM 大，近期 SAM 小众
          tone: positive
        - label: 能力证明
          value: 5
          detail: IMO 金牌、VERINA SOTA、ProofBench
          tone: positive
        - label: 护城河 / 防御性
          value: 4
          detail: 形式化验证领先、RL 基础设施
          tone: positive
        - label: 经济性 / 货币化
          value: 1
          detail: 未披露收入
          tone: negative
        - label: 风险
          value: 2
          detail: 烧钱、关键人物、依赖
          tone: negative
        - label: 估值吸引力
          value: 2
          detail: 约 $1.45B，叙事驱动
          tone: warning
        - label: 证据质量
          value: 3
          detail: 技术强，商业弱
          tone: neutral
    claimRefs:
      - CV023
      - CV004
      - CV022
      - CV035
