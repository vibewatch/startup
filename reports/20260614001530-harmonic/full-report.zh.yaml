        title: 快照指标与证据缺口
        blocks:
          - type: paragraph
            body: >
              Harmonic 的封面指标可以清楚分成证据充分与不可得两类。估值（$1.45B）、累计融资（约 $295M）、最新一轮（$120M Series C）、成立时间（2023）、公开发布（2024 年 6
              月）、总部（Palo Alto 及 London 办公室）和基准表现（IMO 金牌水平、VERINA 96.8% SOTA）都能由一手或高声誉来源支撑。相比之下，收入、运行率、毛利率、烧钱、员工数，以及
              Series A 和 B 的精确投后估值均未披露，本报告将其列为明确缺口，并给出具体尽调路径，而不是猜数字。

              这种证据分裂定义了 Harmonic
              的画像。公司展示出异常突出的技术记录和蓝筹、重复投资的股东基础，但尚未证明收入模型，同时拥有一位高知名度董事长，其主要职责是经营另一家上市公司。对投资委员会而言，快照结论是：这是一个按里程碑和信念定价的研究阶段前沿
              AI 资产，最重大的未知数是财务规模，以及从形式化验证数学走向持久商业收入的路径。这些未知数已列入快照表的信心栏和本章证据缺口登记表。
