            title: 形式化验证确实降低了核心可靠性风险
            body: >
              最重要的技术缓释只有一条：Aristotle 的输出会在 Lean 中接受机器检查。错误的非形式化推理会在答案获得认证前被抓住，因此幻觉——AI 数学最主要的可靠性风险——在认证点基本被中和。相比纯非形式化
              LLM 推理，这是实打实的结构性优势，也是风险档案中最强的缓释。
