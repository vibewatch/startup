  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景、正向论点与反向论点
        blocks:
          - type: paragraph
            body: >
              Harmonic 2025 年 11 月的 Series C 由 Ribbit Capital 领投，融资 $120M，投后估值约 $1.45B，跨过独角兽门槛；此前 2025 年 7 月 Series B 融资
              $100M，据报估值约 $900M。Series A（$75M）、B（$100M）和 C（$120M）合计下来，公司在首个公开轮次后约 14 个月内融资约 $295M，节奏很快。这更像市场在为里程碑（IMO
              金牌、VERINA SOTA）给动量定价，而不是为财务表现定价，因为估值建立在没有披露收入的基础上。因此，约 4 个月内从 ~$900M 升到 ~$1.45B，最好理解为叙事和能力驱动，而非基本面驱动。

              多头论点是一个高信念的技术与团队下注：精英创始人组合搭出全球领先的形式化推理能力，并由 Sequoia、Kleiner Perkins、Ribbit、Index 和 Emerson Collective
              等蓝筹财团验证；这些投资者重复参与，释放了内部人信念。反向论点是，变现未被证明，形式化数学近期市场小众，burn
              高，因此价格内嵌了一个规模很大、却缺乏证据的未来商业化。财团质量是信号，不是保证：顶级支持者不能替代收入证据。这个估值最适合被理解为一张押注品类定义能力的风险投资期权——作为 optionality
              可以辩护，但不能靠任何近期基本面辩护。
