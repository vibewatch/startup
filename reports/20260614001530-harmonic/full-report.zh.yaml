  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Harmonic 处在 AI 驱动的形式数学推理和机器可检验证明的新兴市场。公司把品类定义为「数学超级智能」——软件依靠严谨、形式化验证的数学推理，而不是通用聊天模型的概率式模式匹配。这一定位把 Harmonic
              放在三个相邻支出池交汇处：广义 AI 软件市场、更窄的形式验证和自动推理工具市场，以及学术或研究数学软件。每个相邻市场带来不同买家、预算和替代品，但没有一个能干净映射到单一已发布市场规模。

              尽调必须把边界画清楚。纳入的支出包括企业软件验证预算、EDA 和硬件验证预算、AI API 与算力支出，以及学术研究经费。排除项包括通用 LLM 聊天订阅，以及——对名称消歧尤其重要——运营
              harmonic.ai 的无关数据增强公司；它与 harmonic.fun 这家 Palo Alto 形式数学创业公司没有业务关系。Harmonic
              必须替代的现状方案包括人工证明和同行评审、Lean、Coq、Isabelle 等手动交互式定理证明器，以及会进行非形式化推理并可能幻觉的通用 LLM。理解这些替代方案很关键，因为它们锚定客户预期和付费意愿。
