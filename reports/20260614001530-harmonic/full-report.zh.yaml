  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与模型风险
        blocks:
          - type: paragraph
            body: >
              Harmonic 目前的监管暴露较轻——它交付的是研究和开发者工具，不是受监管产品——但环境正在收紧。EU AI Act 对通用和高风险 AI
              提出义务；如果监管升级，把先进推理模型归入高风险类别，合规成本会升高。眼下这更像观察项，不是当前阻断点。在美国，联邦行政行动和 NIST AI Risk Management Framework
              显示治理方向最终可能触及高能力推理系统，双用途或出口因素也可能跟进。消费者 iOS app 和公开 API 已经触发隐私与安全义务，但 Harmonic
              没有公开记录其合规姿态；结合其企业验证野心，这是一个未解决缺口。

              最具体的法律风险，是品牌和商标与无关的「harmonic.ai」发生碰撞，可能造成市场混淆和潜在 IP 摩擦；尽调应确认商标覆盖范围以及任何共存安排。公开来源没有披露针对 harmonic.fun
              的活跃诉讼、执法行动或罚款，但没有披露不等于没有。模型风险方面，幻觉是非形式化推理组件的已知失效模式；但 Lean 形式化验证是核心缓释手段：机器检查证明会在任何答案获得认证前抓住错误推理，相比纯非形式化 AI
              大幅降低可靠性风险。剩余担忧在泛化——基准过拟合或合成数据限制，可能夸大其超出竞赛式问题的真实能力。
