      - number: '8.2'
        title: 可比公司、情景与敏感性
        blocks:
          - type: paragraph
            body: >
              可比对象天然难找：收入前的形式化数学公司没有接近的公开同业，因此估值只能借用前沿 AI 私募轮和里程碑类比。相对 OpenAI、Anthropic
              等非形式化推理实验室——估值从数百亿到数千亿美元——Harmonic 的 ~$1.45B 很小；但这些同业有大量收入，Harmonic 没有。与此同时，DeepMind 的 AlphaProof
              在企业母体内部达到 IMO 银牌水平，能力可比，却没有独立估值。多位分析师认为广义 AI 市场规模大、增长快；如果形式化验证成为主流软件保障层，理论 TAM 可以很大。但这个背景太泛化，巨大理论 TAM 与
              Harmonic 近期可服务市场之间的落差，正是估值的核心张力。

              情景上，牛市情形是 Harmonic 成为高保障软件（航空航天、芯片、密码学）的验证层，同时也是研究平台，支撑数十亿美元到 decacorn 结果；基准情形是 API
              和企业验证逐步变现，增长到匹配、而不是大幅超过当前估值；熊市情形是变现停滞、市场长期小众，并出现 down round，把价值压到远低于 Series C
              估值。估值最敏感的是变现时点和可实现收入倍数，其次是里程碑概率和未来轮次稀释。「数学超级智能」的 optionality 可能带来巨大回报，但不确定性很高，应按概率加权，而不是照单全收。
