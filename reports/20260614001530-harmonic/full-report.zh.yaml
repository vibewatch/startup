      - number: '5.3'
        title: 差异化、信任与路线图
        blocks:
          - type: paragraph
            body: >
              Aristotle 的核心差异化是形式验证：输出由独立开发、广泛审视的 Lean 内核检查，因此系统不会像非形式化 LLM
              那样幻觉出看似有效但错误的证明；质量控制内置在输出格式中，而不是依赖事后人工审阅。这让产品尤其适合高保障领域——安全关键软件、密码学和芯片设计——这些场景中机器可检验的正确性比流畅文字更重要。可复现性进一步强化信任：Harmonic
              在公开 GitHub 仓库开源了其形式化验证的 IMO 2025 证明，也发布了几何求解器和 MiniF2F 数据集等支持工具。不过，基准透明度参差不齐：IMO 2025 证明开放且可复现，但
              ProofBench 和 VERINA 领先部分依赖公司报告数字，开放证明之外的独立验证有限。

              就绪度上，产品成熟度不均。定理证明和基准能力高度成熟，但企业部署、安全和集成工具相对早期：企业安全、隐私和合规控制（SOC 2、数据处理、API SLA
              和速率限制）未公开记录；这与企业级软件预期存在缺口，也是关键尽调项。路线图推进很快——2025 年 7 月 iOS 测试版，2025 年 10 月公开 API，2025 年 12 月 VERINA
              SOTA，2026 年初社区计划——$120M Series C 的持续资金明确用于扩展架构所需的算力和研究。整体技术结论是：Harmonic
              拥有真正差异化、能力领先的形式推理栈，主要风险在于生态依赖、算力强度和未记录的企业控制。
