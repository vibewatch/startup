      - number: '1.2'
        title: 融资历史与投资方背书
        blocks:
          - type: paragraph
            body: >
              Harmonic 在约十四个月内完成三轮已披露的一级市场融资，合计约 $295M。$75M Series A（2024 年 9 月）由 Sequoia Capital 领投，Index Ventures
              深度参与；$100M Series B（2025 年 7 月宣布）由 Kleiner Perkins 领投，Paradigm 大力支持；$120M Series C（2025 年 11 月 25 日）由
              Ribbit Capital 领投，并新增 Laurene Powell Jobs 创办的 Emerson Collective。Series C 将 Harmonic 估值推至
              $1.45B，跨过独角兽门槛。独立分析师覆盖显示，投后估值路径分别接近 $325M、约 $900M 和 $1.45B，但较早两轮的投后估值为估算值。

              投资方阵容深且反复加码：Sequoia 和 Index Ventures 至今参与每一轮，Kleiner Perkins 和 Ribbit 加大承诺，其他股东包括 Paradigm、ERA
              Funds、GreatPoint Ventures、Blossom Capital 和 DST Global partners。治理信号也随资金而来——Sequoia 的 Andrew Reed 在 Series
              A 获得董事席位，Index 的 Jan Hammer 和后来的 Kleiner Perkins 的 Ilya Fushman
              以观察员身份加入。在公司尚未披露任何收入的情况下，连续多轮跟投是外部信念最清晰的证据；因此，融资历史既是最强验证信号，也是核心估值问题的焦点。
