  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础、细分与采用
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Harmonic 的客户最好理解为职业数学和定理证明社区中的早期采用者与高可信用户，而不是一份已披露的付费账户名单。用户基础由开发者和研究者驱动：Aristotle 通过免费公开 API 和
              iOS 应用访问，而不是通过企业采购；可触达的滩头阵地与 Lean 和竞赛数学生态高度重叠。Harmonic 通过 $1M 数学家赞助计划主动播种这一基础，资助研究者使用
              Aristotle——这是一种社区投资型市场拓展，赞助对象既是用户也是倡导者，在紧密领域中建立可信度和口碑。

              采用仍很新，且由里程碑驱动。2025 年中的 IMO 金牌结果、2025 年末公开 API 发布、2025 年底 VERINA SOTA 结果，以及 2026
              年初赞助计划，标志着上升轨迹——但动量以里程碑衡量，而不是客户指标。代码验证把潜在用户基础从纯数学家扩展到软件工程团队，但没有披露具名企业客户。关键的是，Harmonic
              不披露活跃用户数、付费客户数、账户总数或收入区间，因此无法用公开来源量化采用规模和渗透率；即使单个证明很强，没有分母也无法转换为采用率。
