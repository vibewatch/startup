  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >
              Harmonic 的竞争格局是分层的。最接近的直接竞争者是 Google DeepMind，其 AlphaProof 和 AlphaGeometry 系统在 2024 年国际数学奥林匹克达到银牌水平，使用基于
              Lean 的形式推理——但它是同行评审研究项目，而不是商业产品。最直接的开放权重挑战者是 DeepSeek-Prover，后者通过大规模合成数据和带证明助手反馈的强化学习推进基于 Lean
              的证明；免费可用使其成为该领域最主要的商品化力量。第二层是非形式化推理既有厂商：OpenAI 的 o-series 和 Meta 的 LLaMA 系模型以概率方式解数学题，但不返回机器可检验证明。

              模型竞争者之下，是开源 Lean 生态本身——Lean 4、Mathlib 和社区工具。它既是 Harmonic 的构建平台，也是用户可以直接采用的免费替代方案，并与 Coq、Isabelle
              等成熟交互式定理证明器一起代表手动现状。相邻进入者包括 Theorem，这家 $6M 种子轮创业公司瞄准 AI 编写 bug 的验证场景；同时，拥有 Lean
              专长和算力的资源充足实验室也构成潜在自研威胁。因此，这个格局横跨直接同行、非形式化既有厂商、开源替代品、相邻进入者和很可能出现的未来进入者。
