  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入、定价与变现
        blocks:
          - type: paragraph
            body: >
              Harmonic 的财务画像从一个不寻常的起点开始：截至 2026 年中，公司没有披露收入、ARR 或已确认销售，独立资料也将其描述为商业化前。公开可见的变现入口只有 Aristotle 形式推理 API 和
              iOS 应用，两者都未披露公开标价。未来可能重要的收入流——按量 API
              费用和企业验证合同——仍是预期而非已证明，公司没有披露订单、管线或收入确认政策。最可信、最快通向高质量收入的路径，可能是企业代码验证；Harmonic 在该领域报告了 VERINA SOTA
              结果，但企业合同或定价尚未公开。

              定价未披露，外部无法评估实际价格与标价的差距、折扣和收入确认。变现侧可见的反而是流出而非流入：2026 年 1 月宣布的 $1M 数学家赞助计划，以及 2026 年 2 月向 Lean FRO 捐赠
              $300K。这些是社区投资支出，用于建立生态善意并播种采用，不是收入；它们也显示公司有意推迟商业化，把重心放在能力和社区建设上。
