      - number: '2.3'
        title: 买家、细分市场与采用路径
        blocks:
          - type: paragraph
            body: >
              Harmonic
              的需求分布在多个不同细分市场，各自拥有不同预算负责人和采用触发点。职业数学家和学术研究者构成高可信度滩头阵地：使用由研究经费和大学院系资助，采用触发点是能够形式化验证证明并探索开放猜想。企业软件验证团队代表更大的商业池，预算位于
              EDA、安全和安全工程职能，采用触发点与 AI 生成代码的可靠性相关。航空航天、芯片设计、汽车等安全关键工程领域存在由认证制度塑造的结构性验证需求；需要可验证输出的 AI 开发者则构成第四个快速出现的细分市场。

              当前采用路径是自下而上、由开发者驱动。免费的公开 Aristotle API 和 iOS
              应用在数学家和研究者中播种使用，公司之后才要把兴趣转化为付费和生产部署。由此形成的漏斗极度头重脚轻：免费使用远高于任何付费或生产部署使用，意味着从认知到持久合同还有很长路径。付费意愿是关键未知数，因为免费或低成本前沿
              LLM 虽然在形式数学上容易出错，却把许多用户的预期价格锚定得很低，而 Harmonic 的算力资本强度又为其必须收费的水平设下底线。
