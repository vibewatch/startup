companyProfile:
  summary: >
    Harmonic 是一家位于 Palo Alto 的 AI 研究公司，2023 年由 Robinhood 联合创始人 Vlad Tenev 和连续 AI 创业者 Tudor Achim 创立。旗舰产品 Aristotle
    是一个完全自主的形式化推理引擎，基于 Lean 4 证明助手构建，结合强化学习驱动的证明搜索、非形式化 LLM 推理层和专用几何求解器。Aristotle
    能生成机器可检验、无幻觉的证明，相比非形式化大语言模型推理系统具备结构性优势。公司在 2025 年国际数学奥林匹克达到金牌水平，在 VERINA 代码验证基准上刷新 SOTA（96.8%），并在 ProofBench
    形式数学排行榜位列第一。Harmonic 三轮累计融资 $295M，估值 $1.45B，投资方包括 Sequoia Capital、Kleiner Perkins、Index Ventures、Ribbit
    Capital、Paradigm 等。公司仍处于收入前阶段，但已推出公开 Aristotle API，并设立 $1M 数学家赞助计划，加速社区采用。
