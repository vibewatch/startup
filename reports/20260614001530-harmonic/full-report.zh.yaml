      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >
              由于没有发布方单独划出证明生成 AI 的清晰 TAM，市场规模只能从多个视角推算，并保留矛盾，而不是把它们平均掉。最宽的视角是全球 AI 软件市场；Statista 和其他发布方估计其 2026
              年规模达数千亿美元，并预测到 2030 年代初达到低位万亿美元，复合年增长率为两位数到约 20%。这一视角捕捉了顺风，但大幅高估 Harmonic
              可服务范围。更窄也更相关的是形式验证和验证副驾驶工具市场，分析师估计其 2020 年代中期规模为低个位数十亿美元，并以低十几个百分点 CAGR
              增长。最窄的视角是数学家和专门验证团队自下而上的可服务细分市场；考虑到 Harmonic 未披露收入，这一市场今天实质上仍处于商业化前。

              诚实结论是：估算相差数个数量级，任何单一数字都会误导。因此我们呈现分层市场规模金字塔，并对一个一致口径给出明确的低 / 基准 / 高区间——2030 年前后可服务的形式推理和验证 AI
              市场，以十亿美元计——而不是给出虚假精确的点估计。Harmonic 的能力证明，即 IMO 2025 金牌水平结果和 VERINA SOTA
              代码验证分数，在这里很重要，因为它们把可信可触达用例从纯奥赛数学扩展到软件验证；后者是更大、更成熟的商业相邻市场，也是最可能首先形成大额收入池的方向。
