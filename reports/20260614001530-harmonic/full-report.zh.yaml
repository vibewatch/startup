            body: >
              不过，Harmonic 资金充足。公司已披露一级市场融资约 $295M，包括 $75M Series A（2024 年 9 月）、$100M Series B（2025 年 7 月）和 $120M Series
              C（2025 年 11 月）；最后一轮由 Ribbit Capital 领投，投后估值 $1.45B。报道显示 Series B 对公司估值约 $900M，意味着约四个月内到 Series C 约 1.6x
              抬升——这是由基准里程碑而非财务表现推动的动量定价。最近一轮以纯股权结构融资
              $120M，且未披露债务或项目融资义务，因此公司可能拥有多年现金缓冲；但确切账上现金、月度烧钱和跑道均未披露，无法计算。按照公司表述，资金用途隐含为继续研究、扩展算力和招聘；下一轮触发因素很可能由能力和算力驱动，而不是收入驱动。

              牵引力缺口很突出：没有公开 ARR、付费用户、合同数量或使用率，只有产品里程碑和基准结果。因此，资本充足性的主要证据是顶级投资方——Sequoia、Kleiner Perkins、Index 和
              Ribbit——跨轮次重复参与。独立报道明确指出估值依赖技术里程碑和投资人信念，而不是牵引力；主流报道也警示 AI 数学推理尚未在商业规模上验证，这是近期收入质量的反向信号。财务结论是：Harmonic
              是一家资金充足、商业化前的研究公司，估值由能力和信念承销；近期破产风险因最新融资而较低，但长期可行性取决于在资本市场降温前把能力转化为定价收入。卡住尽调的核心问题，是没有任何披露的收入、烧钱、跑道、定价和客户数据。
