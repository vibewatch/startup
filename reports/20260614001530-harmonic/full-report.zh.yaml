      - number: '7.2'
        title: 财务模型与依赖风险
        blocks:
          - type: paragraph
            body: >
              档案里的主导风险是商业化：Harmonic 在 Series A–C 合计融资约 $295M，但没有披露收入，变现路径未被证明。项目极度吃算力——一个 REPL 服务在可抢占云资源上扩到 100K+
              CPUs——意味着 burn 高且波动大。即便 $120M Series C 提供了近期缓冲，runway 和 burn rate 仍是财务模型的核心风险。作为收入前公司，Harmonic
              依赖以可接受条件持续获得风险融资；根据 SEC Form D 文件，融资经由 pooled SPV vehicles
              进入，尽调应把这一结构映射到所有权和控制权。今天没有披露有收入客户，客户集中风险暂时不适用；但反面是，公司没有多元收入基础来吸收冲击，形式化数学近期市场又偏小众，拉长了规模化路径。

              依赖风险集中在几组关键外部关系。Harmonic 实质依赖开源 Lean 4 证明助手和 Lean FRO 生态——它不控制这个依赖，$300K
              捐赠只能部分抵消——同时依赖单一云供应商提供可抢占容量，暴露在可用性和价格变化下。Lean 生态、单云基础设施和 VC 资本单独看都可管理，合在一起就很重要；API 和 app
              的运营安全姿态仍未披露。风险传导路径从高 burn、零收入走向融资依赖和估值敏感性，竞争和信任风险又会反向影响采用。
