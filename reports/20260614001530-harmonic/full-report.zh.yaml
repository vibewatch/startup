      - number: '5.2'
        title: 架构、训练与基础设施
        blocks:
          - type: paragraph
            body: >
              架构上，Aristotle 把三个组件合成一个自主系统：构造形式化证明的 Lean 证明搜索系统、用自然语言数学提出策略的非形式化 LLM
              推理器，以及面向奥赛几何的专用几何求解器（Yuclid/Newclid）——DeepMind 的 AlphaGeometry
              等竞争者也用专用求解器瞄准这一领域。形式化证明搜索与非形式化推理器的配对，呼应了文献中把大语言模型与形式方法结合的更广泛研究方向。关键在于，非形式化组件是概率式且会犯错；只有 Lean
              内核拒绝无效证明，错误才会被捕获，因此形式验证成为一个原本易错模型的安全兜底。

              训练依赖大规模合成数据上的强化学习，形成自动自我改进循环，降低对稀缺人工形式化证明的依赖，并随时间复合提升能力。服务该系统的是定制 REPL 服务，工程上设计为语义无状态，并可扩展到超过十万个抢占式
              CPU，使证明搜索能以低成本大规模并行。抢占式设计优化成本，但在容错、确定性和大规模可复现性上引入运营复杂度；这些细节只部分披露。整个技术栈建立在 Lean 4 语言和 Lean 社区及 Lean FRO 维护的
              Mathlib 库之上——Harmonic 通过 $300K 捐赠等方式提供资金支持，但不控制这一依赖。
