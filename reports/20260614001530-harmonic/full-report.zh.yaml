      - number: '8.3'
        title: 建议、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >
              我们的建议不是按当前估值无条件买入，而是建立有条件、受里程碑约束的仓位：信心为中，风险评级为高；驱动因素是变现和 burn 不确定性，而不是技术风险。最强价值驱动来自 Harmonic 可验证的能力领先——IMO
              金牌、VERINA SOTA、ProofBench 第一；只要基准领先能守住，这一优势就有持久性。3–5
              年维度上，最可能增值的路径是企业验证收入加持续能力领先，而不是消费者或资助活动。由于变现结果近乎二元，合适仓位应小于信念强度。我们把 Harmonic 评为适合非对称回报 mandate
              的有条件买入；对基本面驱动 mandate 则建议 pass，决策变量是变现证据。

              进入纪律至关重要：在 ~$1.45B 且没有收入的情况下，安全边际很薄，取决于对巨大未来结果的相信；三轮融资累积的 preference stacks 也可能在中等退出中实质影响普通股回报，因此需要做
              waterfall analysis。退出准备度还早——IPO 仍要多年，云厂商或 AI 巨头的 M&A 是中近期更可能的退出；战略收购方可能把形式化推理 IP
              和团队估得远高于财务可比项。Thesis-break 触发器包括：在 runway 内无法展示付费收入或企业试点、失去基准领先、down round，或创始人投入下降。最终尽调问题应集中在 burn 和
              runway、变现管线、SPV 与 cap table 条款，以及最有价值的一项——独立验证其能力能否泛化到竞赛式问题之外。
