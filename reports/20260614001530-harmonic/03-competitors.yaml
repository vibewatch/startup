sections:
  - id: competitive-landscape
    title: Competitive Landscape and Substitutes
    body: >
      Harmonic competes across a layered landscape. Its closest direct competitor is Google DeepMind, whose AlphaProof
      and AlphaGeometry systems reached silver-medal standard at the 2024 International Mathematical Olympiad using
      Lean-based formal reasoning — though as a peer-reviewed research program rather than a commercial product. The
      most direct open-weight challenger is DeepSeek-Prover, which advances Lean-based proving through large-scale
      synthetic data and reinforcement learning with proof-assistant feedback, and whose free availability is the
      field's principal commoditization force. A second layer comprises informal-reasoning incumbents: OpenAI's
      o-series and Meta's LLaMA-based models solve math problems probabilistically but do not return machine-checkable
      proofs.

      Beneath the model competitors sits the open-source Lean ecosystem itself — Lean 4, Mathlib, and community
      tooling — which is simultaneously the platform Harmonic builds on and a free substitute users can adopt
      directly, alongside the established interactive theorem provers Coq and Isabelle that represent the manual
      status quo. Adjacent entrants such as Theorem, a $6M-seed startup targeting AI-written bugs, compete for the
      same code-verification use case, while well-resourced labs with Lean expertise and compute pose a latent
      internal-build threat. The landscape therefore spans direct peers, informal incumbents, open-source substitutes,
      adjacent entrants, and likely future entrants.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP007
      - CP008
      - CP021
      - CP027
      - CP034
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-and-differentiation
    title: Capability, Differentiation, and Pricing
    body: >
      On capability, Harmonic positions itself as the formal-reasoning leader. It claims Aristotle ranks first on
      ProofBench by roughly fifteen percent over the nearest competitor and reports an IMO 2025 gold-medal-level
      result, formally solving five of six problems — exceeding the silver-medal level DeepMind reported a year
      earlier. Its core differentiation is fully formal, Lean 4-based, agentic reasoning that returns
      machine-checkable proofs, in contrast to the informal, probabilistic outputs of general LLMs. Because DeepMind's
      AlphaProof also relies on Lean, the leading formal approaches in fact share a common substrate and compete on
      data, search, and scale rather than on the choice of formalism. Public MiniF2F leaderboards, rooted in 2020
      generative-proving research, are the shared yardstick — and they show rapid convergence, a sign that capability
      leads here can be transient.

      Productization is where Harmonic separates from research-only rivals: it has shipped a public Aristotle API and
      an iOS app, while DeepMind has no generally available product. Pricing transparency across the field is uneven —
      DeepSeek-Prover and Lean tools are free and open, OpenAI charges usage-based API fees, DeepMind sells nothing,
      and Harmonic's Aristotle pricing is largely undisclosed — which makes a clean pricing comparison impossible
      today and is recorded as an evidence gap. Harmonic's code-verification leadership (a state-of-the-art VERINA
      result) further differentiates it from olympiad-only efforts and aligns it with the more commercial verification
      market.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP024
      - CP028
      - CP030
      - CP031
      - CP029
    tableRefs:
      - TP002
      - TP003
    figureRefs:
      - FP002
  - id: moat-durability-and-risks
    title: Moat Durability and Competitive Risks
    body: >
      Harmonic's moat rests primarily on capability lead and formal rigor rather than on structural lock-in. Switching
      costs are low and multi-homing is the norm: mathematicians freely combine Lean, general LLMs, and specialized
      provers, so users are not captured. The most durable element is the formal-verification approach itself, which
      eliminates hallucination and yields machine-checkable proofs that informal competitors cannot guarantee —
      reinforced by a synthetic-data and reinforcement-learning flywheel across more than one hundred thousand CPUs
      that is costly for smaller rivals to match, and by brand credibility from leading-mathematician endorsements.
      The Lean relationship, including a $300K donation to the Lean FRO, provides partner access but also a dependency
      Harmonic does not fully control.

      The risks are material. Open-weight competitors such as DeepSeek-Prover commoditize baseline proving, while
      incumbent distribution power lets Google and OpenAI bundle reasoning into platforms that reach users Harmonic
      must acquire individually. Independent reporting cautions that AI mathematical reasoning remains error-prone and
      unproven at scale, adverse evidence that tempers the claimed lead, and converging leaderboards show that
      benchmark advantages are transient. Without disclosed pricing or customer counts, competitive durability cannot
      be fully assessed. The strategic imperative is clear: Harmonic must convert a transient benchmark lead into
      durable advantages — proprietary data, enterprise relationships, or verified-output trust — before
      commoditization erodes pricing power.
    claimRefs:
      - CP014
      - CP015
      - CP016
      - CP017
      - CP018
      - CP019
      - CP020
      - CP022
      - CP023
      - CP025
      - CP026
      - CP032
      - CP033
      - CP035
      - CP036
    tableRefs:
      - TP004
    figureRefs:
      - FP003
