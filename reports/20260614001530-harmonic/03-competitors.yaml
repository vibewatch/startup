callouts:
  - title: Harmonic leads on capability but the lead is structurally fragile
    body: >
      Harmonic's IMO 2025 gold-level result, claimed #1 ProofBench ranking, and state-of-the-art VERINA score place it
      ahead of direct competitors on formal-reasoning capability today. Yet the leading formal approaches — including
      DeepMind's AlphaProof — share the Lean substrate and compete on data, search, and scale, and public leaderboards
      show rapid convergence. The lead is real but transient, which is why converting it into proprietary data,
      enterprise relationships, or verified-output trust is the central competitive task.
    claimRefs:
      - CP010
      - CP011
      - CP029
      - CP031
    calloutType: strength
  - title: Open-weight commoditization and incumbent distribution are the top threats
    body: >
      DeepSeek-Prover's free, open-weight models push the price of baseline proving toward zero, while Google and OpenAI
      can bundle reasoning into platforms that reach users Harmonic must acquire one at a time. Combined with low
      switching costs and multi-homing among mathematicians, these dynamics mean Harmonic cannot rely on lock-in. The
      most likely path to durable advantage is verified-output trust for high-assurance buyers, not a defensible
      installed base.
    claimRefs:
      - CP004
      - CP015
      - CP016
      - CP019
    calloutType: risk
  - title: Recommend independent verification of benchmark and pricing claims
    body: >
