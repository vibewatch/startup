chapter:
  number: 3
  title: Competitors
  summary: >-
    Harmonic competes in automated mathematical reasoning against well-funded frontier labs (Google DeepMind's
    AlphaProof/AlphaGeometry, OpenAI's reasoning models), open-weight challengers (DeepSeek-Prover), and the
    open-source Lean theorem-proving ecosystem it also depends on. Its differentiation is a fully formal, Lean 4-based,
    agentic approach that yields machine-checkable proofs — claimed #1 on ProofBench and IMO 2025 gold-level — versus
    incumbents that are mostly research projects or informal, probabilistic reasoners. The moat rests on capability lead
    and formal rigor rather than distribution or switching costs, leaving commoditization and incumbent-distribution
    risk as the central competitive concerns.
