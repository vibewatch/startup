schemaVersion: report-v2
artifact: product-tech
slug: spirit-ai
runDate: 2026-10-16
company:
  name: Spirit AI
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Spirit AI's public product is a vertically linked embodied-AI system: real-world
    data collection, Spirit vision-language-action models, and Moz1 robots deployed
    in bounded industrial and retail workflows. The evidence shows genuine technical
    and deployment progress, but it does not yet establish fleet reliability,
    independently certified safety, integration economics, or broad autonomy.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Spirit AI is not presenting a standalone robot or a standalone model. The
      retained evidence describes a product system in which Spirit
      vision-language-action models control the Moz1 wheeled humanoid, while a
      real-world data operation supplies demonstrations for training and iteration.
      The clearest customer-facing use is factory manipulation: at CATL, robots
      insert and remove test connectors while adapting motion and force around
      flexible wiring. JD provides a second deployment surface in retail or service
      settings. These are meaningful production signals, but they remain bounded
      workflows rather than proof that Moz1 can perform arbitrary industrial or
      household tasks.
    claimRefs: [CE001, CE003, CE009, CE010, CE011, CE012]
    tableRefs: [TE001, TE002]
  - id: architecture-and-data-loop
    title: Architecture and real-world learning loop
    body: >-
      The technical thesis is an end-to-end loop rather than a conventional modular
      automation stack. Human video and wearable sensors capture varied physical
      activity; the resulting corpus trains a VLA model that connects perception,
      language instructions, and action; Moz1 then executes in structured settings,
      where deployment exceptions can create harder future examples. Management
      argues that imperfect or "dirty" demonstrations improve learning faster than
      narrowly curated motions. Reuters-derived reporting gives this choice a
      concrete rationale: simulation handles rigid bodies better than deformable
      objects such as electrical cables. The dependency is equally clear - the
      approach requires sustained collection operations, partner access, compute,
      labeling discipline, and governance over human-captured data.
    claimRefs: [CE005, CE006, CE007, CE008, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-roadmap
    title: Maturity, deployment evidence, and roadmap
    body: >-
      The strongest technical proof is specific rather than universal. Spirit v1.5
      was reported at 66.09 on RoboChallenge with a 50.33% task success rate, and
      public reporting says code and checkpoints were released. At CATL, the company
      reported more than 99% success for one connector operation with cycle times
      comparable to skilled workers. Reuters-derived coverage also reports tens of
      Moz1 units at CATL and JD. Against those positives, the same source set reports
      only 90% success on simple tasks in structured living-room settings and
      continuing difficulty with fine-motor and unseen tasks. Management's mid-2027
      breakthrough forecast is therefore a roadmap claim, not a standardized
      readiness milestone.
    claimRefs: [CE004, CE005, CE009, CE010, CE011, CE012, CE013, CE014]
  - id: differentiation-and-controls
    title: Differentiation, safety, and technical diligence
    body: >-
      Spirit AI's best-supported differentiation is the combination of a large
      real-world collection operation, public model artifacts, and access to named
      industrial deployments. Each element reinforces the others: deployment creates
      difficult examples, data supports model iteration, and benchmark or production
      results help win further access. The same loop creates concentration and
      control risks because public proof is dominated by CATL, JD, and
      company-reported metrics. One secondary source describes collision detection
      and automatic braking, but explicitly notes that this is the company's account
      rather than an independent test. The retained pool supplies no third-party
      certification, security or privacy controls, fleet uptime, intervention rate,
      incident history, or customer support commitments.
    claimRefs: [CE005, CE006, CE008, CE009, CE010, CE015, CE016]
callouts:
  - calloutType: strength
    title: A concrete data-to-deployment loop
    body: >-
      Public evidence connects real-world collection, a released VLA model, a
      benchmark result, and named industrial deployments; that is stronger than a
      product story built only on laboratory demonstrations.
    claimRefs: [CE004, CE005, CE006, CE008, CE009, CE010]
  - calloutType: risk
    title: Narrow success metrics are not fleet reliability
    body: >-
      The disclosed percentages cover a benchmark, one CATL connector task, and
      simple structured-room tasks; none discloses uptime, intervention rules,
      trial denominators, maintenance burden, or customer return on investment.
    claimRefs: [CE004, CE009, CE011, CE012, CE016]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - User or buyer
      - Status / maturity
      - Public differentiation
      - Diligence gap
    rows:
      - - Spirit VLA model family
        - Robotics engineers and enterprise deployment teams
        - Spirit v1.5 was benchmarked and reported as publicly released
        - End-to-end perception, reasoning, and action linked to real-world data
        - Canonical repository, license, release cadence, and external adoption metrics
      - - Moz1 wheeled humanoid
        - Manufacturing and retail operators
        - Tens of units reported at CATL and JD in September 2026
        - Force-sensitive industrial manipulation linked to Spirit's model stack
        - Uptime, payload certification, intervention rate, unit cost, and maintenance
      - - Wearable data-collection system
        - Internal data operations and contracted demonstrators
        - More than 200,000 hours claimed, with more than 1 million targeted by end-2026
        - Collects diverse human activity rather than only robot teleoperation
        - Consent, privacy, labeling quality, geographic mix, and usable-yield controls
      - - Spirit v1.5 code and checkpoints
        - Researchers and technical evaluators
        - Publication is reported by two secondary sources
        - Creates a inspectable artifact beyond closed company demonstrations
        - Direct artifact link and independent reproduction are absent from the pool
    notes: >-
      Statuses mix third-party reporting and attributed company claims; missing
      specifications are diligence gaps, not zero values.
    claimRefs: [CE001, CE003, CE005, CE007, CE008, CE010]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Spirit AI solution
      - Reported benefit
      - Limitation
    rows:
      - - Insert and remove battery test connectors
        - CATL production testing with flexible wiring
        - Moz1 adapts movement and applied force
        - More than 99% insertion success and skilled-worker-comparable cycle time
        - One task-specific company metric without uptime or intervention disclosure
      - - Operate robots on production or retail sites
        - Bounded CATL and JD environments
        - Tens of Moz1 units reported across the two named organizations
        - Evidence of deployment beyond a single laboratory prototype
        - Unit allocation, utilization, autonomy level, and customer ROI are undisclosed
      - - Execute simple household-like actions
        - Structured living-room evaluation
        - Model interprets instructions and performs physical actions
        - 90% success reported for simple tasks
        - Trial count, task mix, intervention rules, and unstructured performance are absent
      - - Generalize across physical benchmark tasks
        - RoboChallenge evaluation across 30 reported tasks
        - Spirit v1.5 end-to-end VLA model
        - 66.09 total score and 50.33% task success rate
        - Benchmark leadership does not establish sustained field reliability
    notes: >-
      Values use different tasks, populations, and evaluation settings and therefore
      are not a conversion funnel or a like-for-like performance series.
    claimRefs: [CE004, CE009, CE010, CE011, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - - Human video and wearable capture
        - Records physical demonstrations in homes and factories
        - Contractor network, devices, consent, labeling, and data quality
        - Collection scale does not reveal usable yield or privacy controls
      - - Real-world interaction corpus
        - Supplies diverse motions and flexible-object examples
        - More than 200,000 claimed hours and continued collection access
        - Quantity is company-reported and corpus composition is undisclosed
      - - Spirit VLA training
        - Connects visual input and language instructions to actions
        - Compute, model architecture, data governance, and evaluation design
        - Public benchmark evidence does not disclose field failure taxonomy
      - - Moz1 embodiment and force control
        - Converts model output into physical manipulation
        - Joint hardware, sensing, end effectors, collision controls, and maintenance
        - Safety features and durability lack independent test evidence
      - - CATL and JD deployment
        - Tests bounded workflows and supplies operating examples
        - Continued partner access, integration support, and operator acceptance
        - Public proof is concentrated in two investor-linked organizations
    notes: >-
      This is an analytical operating-model synthesis, not a company-issued system
      diagram; dependencies and risks identify where the retained evidence stops.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE015, CE016]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public architecture forms a six-layer loop from real-world capture through
      model training and embodiment to deployment feedback.
    data:
      layers:
        - label: Real-world activity
          summary: Human tasks in household and factory settings define the physical problem set.
          items:
            - label: Inputs
              displayValue: Human video and physical demonstrations
          outputs:
            - label: Varied task examples
        - label: Wearable data capture
          summary: Contractors collect movements with wearable equipment rather than only teleoperating robots.
          items:
            - label: Reported collection network
              displayValue: Around 1,000 contractors
          outputs:
            - label: Sensor-aligned demonstrations
        - label: Interaction corpus
          summary: Spirit AI emphasizes diverse imperfect data, including flexible-object handling.
          items:
            - label: Reported scale
              displayValue: More than 200,000 hours
          outputs:
            - label: Training data for VLA models
        - label: Spirit VLA model
          summary: An end-to-end model links perception and language to physical actions.
          items:
            - label: Public artifact
              displayValue: Spirit v1.5 code and checkpoints reported
          outputs:
            - label: Robot action policies
        - label: Moz1 embodiment
          summary: Force-sensitive hardware executes learned policies in bounded environments.
          items:
            - label: Primary product
              displayValue: 26-degree-of-freedom Moz1 reported
          outputs:
            - label: Physical task execution
        - label: Deployment feedback
          summary: CATL and JD deployments provide validation and potentially harder future examples.
          items:
            - label: Current scale signal
              displayValue: Tens of units reported
          outputs:
            - label: New exceptions and iteration evidence
    approximationNotes: >-
      The sequence synthesizes the operating loop described across retained sources;
      it is not a literal vendor architecture or proof of automated feedback ingestion.
    claimRefs: [CE005, CE006, CE007, CE008, CE010, CE012]
