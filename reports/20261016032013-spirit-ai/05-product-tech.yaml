  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: production-assurance
      missingEvidence: >-
        Independent safety certifications, fleet uptime, intervention rates,
        incidents, payload testing, and mean-time-between-failure records for Moz1.
      whyItMatters: >-
        Task success in bounded tests cannot establish whether the robot is safe,
        durable, and economical enough for production-scale operation.
      diligencePath: >-
        Request certification files, independent test reports, fleet dashboards,
        incident logs, and customer acceptance records from CATL and JD deployments.
      relatedQuestionRefs: [QE006, QE010]
    - type: missing-source
      severity: material
      topic: security-privacy
      missingEvidence: >-
        Security architecture, access controls, vulnerability management, data
        retention, consent, and privacy governance for robot and wearable data.
