company:
  name: "Spirit AI"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Spirit AI competes in a crowded embodied-AI field through a vertically integrated
    model, data-collection, and robot-deployment strategy, with independent reporting
    confirming dozens of Moz1 units at CATL and JD.com. Its strongest differentiator is
    access to physical-world data and industrial environments, but pricing, customer
    economics, benchmark comparability, and switching-cost evidence remain unavailable.
sections:
  - id: "competitive-landscape"
    title: "Competitive landscape and buyer alternatives"
    body: >-
      The relevant field is wider than humanoid manufacturers. Spirit AI presents itself
      as a full-stack embodied-intelligence vendor, while its own release places Google
      DeepMind and Physical Intelligence in the same data-intensive physical-reasoning
      race. Independent analysis also compares Spirit AI's scaling bottleneck with
      Figure's Helix program, while explicitly warning that the comparison does not prove
      equal technical maturity or a shared timetable. For an industrial buyer, internal
      automation teams, conventional fixed automation, and continued manual work remain
      practical substitutes because factories reward bounded workflows and predictable
      safety conditions. Spirit AI therefore competes simultaneously for model quality,
      deployment access, integration ownership, and proof that a general system is more
      economical than a narrower incumbent solution.
    claimRefs: [CP003, CP004, CP008, CP009, CP013]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: "capability-and-proof"
    title: "Capability differentiation is ahead of proof quality"
    body: >-
      Spirit AI's public differentiation rests on real-world training data, an integrated
      vision-language-action stack, and industrial deployment. Reporting says roughly
      1,000 contractors collect demonstrations in homes and factories, while Spirit v1.5
      code and checkpoints provide a tangible artifact for external inspection. However,
      the most impressive performance figures remain company-issued: more than 200,000
      hours of interaction data, a target above one million hours by year-end 2026, a
      January leaderboard lead, and greater than 99% success at CATL. Independent
      reporting adds a useful counterweight: the reported 90% success rate applies to
      simple tasks in a structured living room and lacks trial count, task mix, and
      intervention rules. The matrix therefore separates disclosed capability from
      independently comparable performance rather than treating every claim as a
      benchmark win.
    claimRefs: [CP005, CP006, CP007, CP010, CP011, CP012, CP013]
    tableRefs: [TP002]
  - id: "distribution-switching-and-pricing"
    title: "Distribution access may matter more than list pricing"
    body: >-
      Spirit AI's strategic network spans manufacturing, logistics, and consumer
      electronics, and reporting links CATL, JD.com, Huawei, Xiaomi, and TCL to its
      investor or partner ecosystem. That network can create access to deployment sites
      and operating data, a potentially stronger advantage than a model-only benchmark.
      Dozens of Moz1 units at CATL and JD.com are evidence of field access, but not proof
      of paid production contracts, repeat orders, utilization, or customer return on
      investment. No retained source provides list pricing, realized contract value,
      hardware-versus-software packaging, service obligations, or discounting. Without
      those terms, switching cost and lock-in cannot be quantified: integration and
      accumulated site data may create friction, while open model artifacts and
      multi-vendor experimentation may preserve buyer leverage.
    claimRefs: [CP003, CP007, CP014]
    tableRefs: [TP003]
  - id: "moat-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      The emerging moat is a learning loop rather than a proven installed-base franchise:
      more industrial access can generate more varied physical data, which can improve
      models and make future deployments easier. Capital scale also increased sharply
      between February and September reporting, yet funding raised is not cash available
      and does not establish revenue quality. The loop remains vulnerable to
      commoditization if model code, hardware components, or data-collection methods
      become widely available, and to incumbent response if integrated robotics vendors
      pair comparable intelligence with manufacturing scale. Public evidence is also
      internally uneven: Dealroom displays both a seed-and-angel funding statement and
      “No known external funding,” while company benchmark claims lack disclosed test
      denominators. The investment case therefore depends on independently verified
      production reliability, contract economics, and repeat deployment—not headline
      funding or ordinal positioning.
    claimRefs: [CP001, CP002, CP005, CP010, CP011, CP012, CP015, CP016]
