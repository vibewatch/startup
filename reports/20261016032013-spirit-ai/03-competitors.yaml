callouts:
  - calloutType: "strength"
    title: "Field access is the clearest competitive asset"
    body: >-
      Reported deployments at CATL and JD.com, a broad industrial network, and a large
      physical-data collection operation can reinforce one another even before generalized
      household robotics is practical.
    claimRefs: [CP003, CP006, CP014]
  - calloutType: "risk"
    title: "Benchmark leadership is not yet a durable moat"
    body: >-
      The strongest success-rate and leaderboard claims are company-issued, while retained
      independent reporting highlights missing test denominators and unresolved unfamiliar
      tasks.
    claimRefs: [CP005, CP011, CP012]
