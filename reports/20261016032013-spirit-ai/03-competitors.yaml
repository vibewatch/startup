      - ["Physical-world data program", "Around 1,000 contractors reported collecting home and factory demonstrations", "Large-dataset peer label from Spirit AI only", "Large-dataset peer label from Spirit AI only", "Scaling-data thesis discussed independently", "Limited to buyer-controlled operations"]
      - ["Industrial deployment evidence", "Dozens of Moz1 units reported at CATL and JD.com", "Unknown in assigned evidence", "Unknown in assigned evidence", "No comparable deployment count retained", "Existing workflow by definition"]
      - ["Generalization evidence", "Company leaderboard claim plus open model artifact", "No like-for-like result retained", "No like-for-like result retained", "No like-for-like result retained", "Narrow workflow may reduce need for generalization"]
      - ["Reliability evidence", "90% on simple structured-room tasks reported without denominator; company claims 99%+ at CATL", "Unknown in assigned evidence", "Unknown in assigned evidence", "Long-duration home autonomy not yet achieved in cited comparison", "Known process, but no comparative metric retained"]
      - ["Near-term market sequence", "Factories in one to two years; homes at least eight years away", "Unknown in assigned evidence", "Unknown in assigned evidence", "Home ambition discussed without a common timetable", "Already used in bounded industrial settings"]
    notes: >-
      Unknown means the assigned prefetched evidence does not support a comparison; company
      claims and independent observations are kept distinct, and unlike task definitions
      or denominators are not normalized.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP011, CP012]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns:
      - "Offer or alternative"
      - "Price or contract model"
      - "Included capabilities supported by evidence"
      - "Discounts or unknowns"
      - "Diligence implication"
    rows:
      - ["Spirit AI Moz1 deployment", "Not publicly supported in retained evidence", "Robot, force-control claims, VLA stack, and industrial deployment", "Hardware, software, integration, support, and volume terms unknown", "Request signed contracts, bill of materials, service burden, and realized gross margin"]
      - ["Spirit AI model or data access", "Not publicly supported in retained evidence", "Spirit v1.5 code/checkpoints reported public; proprietary data program described", "License, hosted inference, data rights, and enterprise support unknown", "Separate open artifact value from monetized proprietary services"]
      - ["Integrated humanoid competitors", "Unknown for named peers in assigned evidence", "Model-plus-hardware direction is visible, but packages are not comparable", "No like-for-like price, payload, uptime, or service-level terms", "Run a common task-level request for proposal rather than compare headline capability"]
      - ["Internal build / conventional automation / manual work", "Buyer-specific total cost", "Narrow workflow ownership and existing operating process", "Labor, integration, downtime, maintenance, and safety costs unavailable", "Benchmark Spirit AI against the incumbent process, not only other humanoid vendors"]
    notes: >-
      This is a gap-preserving comparison: no price is estimated, no funding figure is used
      as a pricing proxy, and every unknown requires contract-level diligence.
    claimRefs: [CP003, CP007, CP013]
