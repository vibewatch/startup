evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, control-rights summary, and formal governance disclosures for the legal entity and major
      subsidiaries.
    whyItMatters: >-
      Public leadership visibility is strong, but control dynamics and succession readiness cannot be assessed from
      founder profiles alone.
    diligencePath: Request the latest cap table, board observer list, and shareholder agreement summary from the company.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      A clean legal-entity and registered-office record that reconciles Hangzhou headquarters language with Reuters'
      Beijing-headquarters caption.
    whyItMatters: >-
      Jurisdiction, subsidy exposure, and customer concentration checks all depend on the correct legal-HQ and
      operating-site structure.
    diligencePath: Pull the latest corporate registry filing and confirm office and incorporation structure with management.
    relatedQuestionRefs:
      - QO001
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited revenue or run-rate, customer count, gross margin, burn, runway, and working-capital needs for scaled
      robot deployment.
    whyItMatters: >-
      Public deployment anecdotes and funding totals do not show whether Spirit AI has a durable economic model at its
      latest valuation.
    diligencePath: >-
      Request audited financial statements, cohort revenue by customer, and a current operating plan with unit-economics
      assumptions.
    relatedQuestionRefs:
      - QO003
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Round-by-round reconciliation for the reported April and June 2026 financings, including instruments, dilution,
      secondaries, and any debt or credit facilities.
    whyItMatters: >-
      The public record supports a sharp valuation step-up, but not the exact security terms or whether any capital was
      non-primary financing.
    diligencePath: Obtain the financing timeline deck, executed term sheets, and a post-round capitalization table.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: >-
      Independent market reports or bottoms-up budget data isolating embodied-AI spend for factory, logistics, service,
      and home use cases.
    whyItMatters: Without it, valuation work relies on proxies rather than a verified spend pool or adoption curve.
    diligencePath: Collect sell-side or industry datasets and build a bottoms-up budget model from target customer verticals.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-proof
    missingEvidence: >-
      Contract values, utilization rates, labor-savings data, and payback periods from CATL, JD.com, and any later
      enterprise deployments.
    whyItMatters: >-
      The investable question is whether factory and logistics pilots convert into repeatable enterprise ROI, not just
      technical demonstrations.
    diligencePath: >-
      Request customer contracts, pilot scorecards, and references from operations leaders responsible for the
      deployments.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: household-demand
    missingEvidence: >-
      Independent demand studies, safety/certification evidence, and service-cost models for home humanoid adoption in
      China.
    whyItMatters: >-
      The consumer narrative materially widens TAM, but the public evidence here does not show that households will
      adopt on Spirit's implied timeline.
    diligencePath: >-
      Interview distributors, insurers, and regulators and review service-network economics before underwriting
      household demand.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing and contract economics
    missingEvidence: >-
      Current price lists or signed contracts separating hardware, software, integration, support, discounts, and
      renewal terms.
    whyItMatters: >-
      Without realized contract terms, Spirit AI cannot be compared with integrated rivals, internal build, or incumbent
      automation on total cost.
    diligencePath: >-
      Request anonymized contracts, invoices, renewal cohorts, bill of materials, implementation hours, and support
      obligations for CATL, JD.com, and representative pilots.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent benchmark comparability
    missingEvidence: >-
      A common independent benchmark covering task definitions, trial counts, interventions, uptime, safety events,
      payload, and cycle time for Spirit AI and named peers.
    whyItMatters: Vendor-defined success rates and leaderboard positions do not establish relative reliability or moat durability.
    diligencePath: >-
      Commission a side-by-side factory task evaluation and obtain raw trial logs from Spirit AI, CATL, and shortlisted
      competitors.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: enumeration-incomplete
    severity: material
    topic: competitor scale and direction
    missingEvidence: >-
      Current funding, installed base, target segment, pricing, and roadmap evidence for each named direct and adjacent
      competitor.
    whyItMatters: The retained corpus is Spirit-AI-heavy and cannot support a complete peer ranking or market-share view.
    diligencePath: >-
      Collect original filings, official product documentation, customer references, and current pricing from Google
      DeepMind, Physical Intelligence, Figure, and China-based humanoid peers.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching cost and customer retention
    missingEvidence: Renewal, repeat-order, utilization, integration-time, data-rights, and multi-vendor deployment records.
    whyItMatters: >-
      Deployment access may create a moat, but the public record does not show whether customers are locked in or merely
      piloting multiple vendors.
    diligencePath: >-
      Interview CATL and JD.com procurement and operations teams, review renewal history, and inspect data ownership and
      model portability clauses.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: blocking
    topic: revenue-disclosure-gap
    missingEvidence: >-
      Audited or management-certified revenue by stream, including hardware, services, and any recurring software or
      model line.
    whyItMatters: >-
      Without revenue by stream, the chapter cannot determine whether public deployments are producing meaningful,
      repeatable monetization.
    diligencePath: Request monthly and quarterly revenue bridge by customer and stream, with pilot versus recurring classification.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, contribution margin, implementation labor burden, and service attach rate by offering.
    whyItMatters: >-
      Public deployment evidence cannot show whether Spirit AI's robots and services get cheaper or more profitable as
      volume scales.
    diligencePath: Request product-line gross margin, support labor hours per deployment, and warranty or returns history.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash on hand, monthly burn, runway, debt obligations, supplier-finance exposure, and planned capex.
    whyItMatters: >-
      Large fundraising totals do not prove that Spirit AI can finance inventory, components, and model-training spend
      through the next scale milestone.
    diligencePath: Request the latest balance sheet, cash-flow statement, debt schedule, and 12-month operating plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-conversion
    missingEvidence: >-
      Signed contract duration, pilot-to-production conversion, repeat order behavior, and customer ROI for CATL,
      JD.com, and industrial partners.
    whyItMatters: >-
      Recurring purchase behavior is the clearest test of revenue quality, and the public record currently stops at
      deployments and strategic announcements.
    diligencePath: Request customer cohort data showing pilots, conversions, renewals, and revenue concentration by account.
    relatedQuestionRefs:
      - QI001
      - QI005
      - QI007
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: blocking
    topic: production-assurance
    missingEvidence: >-
      Independent safety certifications, fleet uptime, intervention rates, incidents, payload testing, and
      mean-time-between-failure records for Moz1.
    whyItMatters: >-
      Task success in bounded tests cannot establish whether the robot is safe, durable, and economical enough for
      production-scale operation.
    diligencePath: >-
      Request certification files, independent test reports, fleet dashboards, incident logs, and customer acceptance
      records from CATL and JD deployments.
    relatedQuestionRefs:
      - QE006
      - QE010
  - type: missing-source
    severity: material
    topic: security-privacy
    missingEvidence: >-
      Security architecture, access controls, vulnerability management, data retention, consent, and privacy governance
      for robot and wearable data.
    whyItMatters: >-
      The data strategy captures human activity in homes and factories, making governance and customer security controls
      central deployment requirements.
    diligencePath: >-
      Obtain security and privacy policies, data-flow diagrams, penetration-test results, retention schedules, consent
      procedures, and enterprise controls.
    relatedQuestionRefs:
      - QE006
      - QE010
  - type: private-evidence-only
    severity: material
    topic: integration-economics
    missingEvidence: >-
      Integration timelines, autonomy levels, support staffing, maintenance cost, utilization, labor savings, and
      customer payback for CATL and JD.
    whyItMatters: >-
      Named deployments demonstrate access but do not show repeatable customer value or the operating burden required to
      maintain the robots.
    diligencePath: >-
      Request deployment runbooks and customer-verified before-and-after economics for each named workflow, including
      human intervention and support hours.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: developer-adoption
    missingEvidence: >-
      Canonical repository links, license terms, release cadence, contributors, downloads, forks, and independent
      reproductions for Spirit v1.5.
    whyItMatters: >-
      Reports of published code and checkpoints show inspectability but do not establish external adoption,
      maintainability, or reproducible performance.
    diligencePath: >-
      Obtain the official repository and checkpoint registry, then review commit history, issues, releases, licenses,
      downloads, and third-party evaluations.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Customer count by segment, contract length, renewal or churn data, NRR or GRR, and pilot-to-production conversion
      data.
    whyItMatters: >-
      Without durability metrics, a named deployment can still be a one-off pilot rather than a repeatable customer
      franchise.
    diligencePath: >-
      Request a customer cohort table, renewal log, and deployment-by-stage funnel from management, then validate with
      customer references.
    relatedQuestionRefs:
      - QU003
      - QU007
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Revenue or order concentration by CATL, JD, and other top customers or channels.
    whyItMatters: >-
      Concentration can distort growth quality and leave Spirit AI exposed to a small number of accounts or
      partner-controlled surfaces.
    diligencePath: >-
      Request top-customer concentration, pipeline mix, and partner-led revenue contribution, then reconcile with signed
      contracts.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: material
    topic: deployment-economics
    missingEvidence: >-
      Site-level uptime, active robot hours, intervention rates, payback period, and scope of work for CATL and JD
      deployments.
    whyItMatters: Outcome anecdotes do not prove repeatability or ROI without operating denominators and economic context.
    diligencePath: >-
      Obtain KPI dashboards or customer scorecards for named deployments and confirm them directly with CATL and JD
      operating teams.
