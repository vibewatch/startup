              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The key underwriting risk is proof mismatch
            body: >-
              Public evidence supports real technical and partner momentum, but not yet a diversified, independently
              verified operating record commensurate with the financing scale.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR015
              - CR017
          - type: callout
            title: Treat 2027 intelligence milestones as monitorables, not current proof
            body: >-
              The thesis should break if safety certification, diversified deployments, and cash-performance disclosure
              do not catch up before Spirit tries to expand beyond tightly bounded industrial use cases.
            calloutType: recommendation
            claimRefs:
              - CR008
