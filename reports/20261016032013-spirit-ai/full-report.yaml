  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint and buyer segments
        blocks:
          - type: paragraph
            body: >-
              The retained sources point to an enterprise-first customer map rather than a broad consumer rollout.
              Independent coverage repeatedly says Spirit AI expects industrial applications to come first, with simpler
              commercial-service work following and household deployment much later, while the company still frames
              household ownership as a long-run mission rather than a current revenue base. Publicly named use cases
              split into three buckets: structured manufacturing tasks on customer production lines, JD-linked
              retail/service workflows, and a forward pipeline for commercial venues such as supermarkets, hospitality
              sites, hotels, and office buildings. That makes the current buyer/user/payer profile primarily enterprise
              operations teams and channel partners, not households, and it means consumer demand remains thesis
