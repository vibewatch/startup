      - number: '2.4'
        title: Adoption drivers are real, but the missing proof is ROI and spend depth
        blocks:
          - type: paragraph
            body: >
              Several adoption drivers are visible even in a limited public pool: benchmark wins raise profile,
              real-world data collection appears differentiated, and industrial partnerships provide live environments
              for training and deployment. The same sources also show why underwriting is still difficult.
              Flexible-object handling, unfamiliar tasks, and safe autonomous behavior in cluttered homes remain
              unsolved enough that management still talks about household deployment in decade-scale terms. Public
              reporting does not disclose contract values, pilot-to-production conversion, or customer payback periods,
              so the strongest open question is not whether embodied AI matters in principle but whether Spirit can
              convert technically impressive deployments into repeatable enterprise budgets fast enough to justify the
              scale implied by category excitement.
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
              - CM014
