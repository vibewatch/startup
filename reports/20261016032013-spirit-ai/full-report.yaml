  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Spirit AI presents itself as an embodied-AI and robotics company building a "universal robotic brain" and
              an "intelligent workforce" rather than a single-purpose robot vendor, and the assigned sources
              consistently frame the business around general-purpose foundation models plus Moz robot deployments. The
              official About page lists operating locations in Hangzhou, Beijing, and Shenzhen, while Baidu Baike
              describes Spirit AI (Hangzhou) Technology Co., Ltd. as established in February 2024 and headquartered in
              Hangzhou. That identity record is directionally coherent, but not perfectly clean: a Reuters Connect item
              about a September 2026 visit labels Beijing as the company's headquarters. For diligence, the practical
              takeaway is that Spirit AI clearly operates across multiple Chinese cities, but the exact legal-HQ versus
              operating-HQ distinction still needs confirmation from a corporate registry extract or management
              materials before it is reused as a hard fact in downstream underwriting.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
