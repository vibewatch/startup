  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is broad, but the entry wedge is industrial automation
        blocks:
          - type: paragraph
            body: >
              Spirit AI frames itself as an embodied-AI company building general-purpose humanoid robots for an
              "intelligent workforce" that eventually reaches households and workplaces, so the theoretical market
              boundary spans robot brains, deployment systems, and embodied automation rather than a single narrow
              software category. The practical entry wedge in the public record is much tighter. Reuters-syndicated
              interviews say the next one to two years are the initial window for industrial applications, with simpler
              commercial-service work later and home deployment materially harder. That pushes the investment case away
              from a generic consumer-robot narrative and toward concrete factory, logistics, and service workflows
              where physical reliability and operating economics can be tested first.
            claimRefs:
