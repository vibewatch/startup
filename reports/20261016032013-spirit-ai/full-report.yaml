    Spirit AI is a Chinese embodied-intelligence startup building general-purpose robot foundation models and Moz robot
    deployment systems. The public record shows fast fundraising, visible industrial deployments at sites such as CATL
    and JD.com, and an expanding partner ecosystem, but it still leaves major diligence gaps around audited financials,
    cap-table terms, customer breadth, and operating economics.
