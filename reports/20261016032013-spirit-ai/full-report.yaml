      - number: '2.3'
        title: Buyers are enterprises first; consumer demand is still optional upside
        blocks:
          - type: paragraph
            body: >
              The observed buyer path is enterprise-first. CATL and JD.com point to production-line, logistics, and
              retail-adjacent workflows where a robot can be inserted into bounded environments and measured against
              throughput, labor, or quality targets. Follow-on opportunity appears to sit in simpler commercial-service
              venues such as retail and hospitality, where Spirit's Moz2 positioning suggests a later expansion path
              once industrial reliability improves. Household adoption remains the longest-dated segment in the evidence
              set: management commentary says homes are at least eight years away, and the official mission statement
              should be read as an aspiration rather than proof that consumers will fund adoption on that timeline. That
              means the relevant budget owner today is likely an operations or automation function, not a consumer
              wallet.
            claimRefs:
              - CM002
