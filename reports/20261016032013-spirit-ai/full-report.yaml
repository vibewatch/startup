            body: >-
              Spirit AI's best public customer proof is concentrated but concrete. Baidu Baike says Spirit AI's Xiao Mo
              robot is on a CATL battery PACK production line and reports industrial performance outcomes, while
              Reuters-syndicated coverage says tens of Moz1 robots are already deployed on production lines at CATL and
              JD.com. Baike also says Spirit AI and JD Group signed a 2026-2029 strategic cooperation agreement and that
              JD MALL scenarios include remotely supported coffee preparation and future retail extensions. This is
              better evidence than a logo wall because the public record names customers, workflows, and some outcome
              metrics, but it still leaves open whether the JD retail activity is a pilot or scaled production
              deployment and how much of the reported fleet or order volume sits with each named account.
