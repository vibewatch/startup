      - number: '5.2'
        title: Architecture and real-world learning loop
        blocks:
          - type: paragraph
            body: >-
              The technical thesis is an end-to-end loop rather than a conventional modular automation stack. Human
              video and wearable sensors capture varied physical activity; the resulting corpus trains a VLA model that
              connects perception, language instructions, and action; Moz1 then executes in structured settings, where
              deployment exceptions can create harder future examples. Management argues that imperfect or "dirty"
              demonstrations improve learning faster than narrowly curated motions. Reuters-derived reporting gives this
              choice a concrete rationale: simulation handles rigid bodies better than deformable objects such as
              electrical cables. The dependency is equally clear - the approach requires sustained collection
              operations, partner access, compute, labeling discipline, and governance over human-captured data.
            claimRefs:
