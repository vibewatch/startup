        title: Cost structure and capital needs
        blocks:
          - type: paragraph
            body: >-
              The public record implies a costly scale-up path. Reuters and Momenta describe roughly 300 employees plus
              around 1,000 contractors gathering real-world training data, while the Bosch agreement explicitly covers
              sensors, actuators, engineering validation, and mass-production support. WIPO and Reuters both explain why
              Spirit leans on physical-world data instead of simulation: real environments and flexible objects still
              break synthetic approaches. Together, those signals point to a business that likely carries both software
              R&D burn and hardware or deployment working-capital needs. The 2026 fundraising surge buys time, but
