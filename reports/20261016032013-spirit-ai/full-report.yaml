  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The price-sensitive recommendation is research-more rather than invest or pass. Reuters reporting carried
              by Yahoo says Spirit AI had raised more than $670 million since its 2024 founding and was valued at 20
              billion yuan ($2.9 billion) by September 2026. That capital base and reported deployment of tens of Moz1
              robots at CATL and JD.com make the company more than a laboratory concept. They do not establish that the
              current price offers an attractive return. None of the retained sources supplies audited revenue, gross
              margin, cash burn, runway, cash available, or security-level terms. Entry should therefore depend on a
              reconciled cap table, board-grade operating data, and customer-level evidence of repeatable fleet
              economics. Until those tests are met, the financing mark is a reference point rather than an independently
              supported fair value.
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV014
