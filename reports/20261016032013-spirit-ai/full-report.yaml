      - number: '1.2'
        title: Leadership and governance surface
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is concentrated around founder and CEO Han Fengtao and co-founder and chief
              scientist Gao Yang. Han is the visible commercial and strategic voice in the official June 2026 conference
              coverage, where he argues the industry's near-term priority is large-scale pre-training and data
              accumulation instead of immediate mass-market commercialization. Gao anchors the technical narrative: the
              company describes him as a UC Berkeley PhD, a Tsinghua assistant professor, and a contributor to
              EfficientZero, ViLa, and CoPa, which helps explain why the company's external story leans so heavily on
              model architecture and data scale. That concentration creates obvious key-person dependence across both
              commercialization and research leadership. What is missing is equally important: the assigned sources do
              not publish a current board roster, voting/control rights, or formal governance structure, so any
              investment view that depends on control dynamics or succession readiness still requires direct diligence.
            claimRefs:
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO014
              - CO015
      - number: '1.3'
        title: Capital formation, deployment proof, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              The strongest verified financing fact in the chapter is the company's own February 2026 announcement that
              it raised $280 million to scale embodied-model deployment. Baidu Baike extends that record backward with a
              2024-2025 sequence from angel through JD-led Pre-A+, while independent September 2026 coverage attributes
              more than $670 million of cumulative funding and roughly 20 billion yuan of valuation to Spirit AI. Those
              later totals are important but still medium-confidence because the assigned public record does not fully
              reconcile the April and June 2026 financings or disclose terms, dilution, secondaries, or debt.
              Operationally, Spirit AI pairs an aggressive data-collection thesis with concrete industrial proof points:
              official materials cite more than 300,000 data collection points, over 1,000 full-time collection
              specialists, and 200,000-plus hours of interaction data, while both official and third-party sources point
              to CATL-line success rates above 99%. Independent coverage strengthens that story by reporting dozens of
              Moz1 robots already on CATL and JD.com production lines, but it also sharpens the risk frame by stressing
              that household deployment remains years away and that the reported 90% success metric comes from simple
              tasks in structured settings rather than open-world home reliability.
