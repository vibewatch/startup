  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Ambition, capital, and deployment evidence are progressively discounted by reliability, financial-transparency,
      and price-support gaps.
    data:
      nodes:
        - id: ambition
          label: Large stated ambition
          detail: Spirit AI says its mission is for 10% of the world to own a robot within ten years.
          tone: neutral
        - id: capital
          label: Strong capital access
          detail: Reuters reported more than $670 million raised and a 20 billion yuan valuation.
          tone: positive
        - id: deployment
          label: Industrial proof
          detail: Tens of Moz1 robots were reported on CATL and JD.com production lines.
          tone: positive
        - id: limitations
          label: Reliability limits
          detail: Structured-task results lack full evaluation detail, and unfamiliar tasks remain difficult.
          tone: warning
        - id: opacity
          label: Underwriting opacity
          detail: Audited operating metrics, cash availability, and security terms are not public.
          tone: risk
        - id: decision
          label: Research-more
          detail: Treat the current valuation as stretched until private diligence supports price and downside terms.
          tone: risk
      edges:
        - from: ambition
          to: capital
          label: attracts
        - from: capital
          to: deployment
          label: funds
        - from: deployment
          to: limitations
          label: must overcome
        - from: limitations
          to: opacity
          label: compounds
        - from: opacity
          to: decision
          label: drives
    approximationNotes: The flow is qualitative and ordered; it does not encode probability, magnitude, or a valuation calculation.
    claimRefs:
      - CV004
      - CV001
      - CV005
      - CV007
      - CV012
      - CV015
