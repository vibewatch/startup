  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked underwriting risks
        blocks:
          - type: paragraph
            body: >-
              The public record supports a real but still narrow commercialization story. Gasgoo says Spirit AI raised
              nearly CNY2 billion across two February 2026 financings and assembled a shareholder base that includes
              CATL, JD.com, TCL, Huawei, Xiaomi, and state-backed funds, while Reuters-based follow-on coverage says
              tens of Moz1 robots are deployed at CATL and JD.com. That combination is a strength for access and
              scenario data, but it also means the underwriting case depends heavily on a small set of ecosystem
              relationships rather than a broad customer base. The central risk is that valuation and operating scale
              are moving faster than independently verified proof on safety, diversification, and durable unit
              economics.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR015
      - number: '7.2'
        title: Regulatory, safety, and data-governance risk
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool does not document third-party safety certification, formal regulatory approvals,
              privacy controls, or litigation outcomes for Moz deployments. Reuters-based coverage describes collision
              detection and braking, but Momenta explicitly frames that as Spirit AI's own account rather than an
              independently tested result. The same coverage says Spirit uses about 1,000 contractors to collect
              physical-world training data in homes and factories, while PRNewswire says the company is scaling that
              pipeline far further. Those facts make data governance, worker-consent, and deployment-safety diligence
              mandatory. The absence of a recorded incident in this pool is not evidence that certification, privacy, or
              product-liability risk is low; it is evidence that public verification is incomplete.
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR006
              - CR011
              - CR012
              - CR014
      - number: '7.3'
        title: Operational, quality, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's public operating proof is strongest in constrained settings and weakest in generalization.
              Momenta says the reported 90% success rate applies to simple tasks in structured living-room settings, and
              the same article says fine-motor work and unseen tasks remain unsolved. Reuters-based coverage also places
              factories in the next one to two years and homes at least eight years away, which is a clear warning
              against underwriting a near-term household-robot thesis. PRNewswire adds company-reported evidence of 99%+
              success on CATL wire-harness handling and more than 200,000 hours of training data, but both metrics are
              management-supplied rather than independently benchmarked. Residual execution risk stays high until
              repeatability, uptime, and safety are shown outside tightly scoped environments.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
