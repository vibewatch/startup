      - number: '7.4'
        title: Dependency, financing, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's financing and partnership model creates both momentum and concentration risk. Gasgoo says
              strategic investors also provide deployment scenarios and data streams, while Reuters-based articles say
              the visible commercial proof is concentrated in CATL and JD.com. PRNewswire's scaling plan depends on
              expanding the data-collection apparatus to more than 1 million hours, which implies ongoing capital needs
              and execution complexity even before public revenue, margin, or renewal disclosures are available.
              Independent disclosure is still patchy: Expolume shows no article or event history on its profile, and
              Dealroom's visible entry even says "No known external funding," contradicting better-sourced reporting.
              Kill criteria should therefore focus on safety certification, diversified customer evidence beyond CATL
              and JD.com, and audited financial disclosure that ties deployment to cash performance rather than headline
              valuation.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR013
              - CR015
              - CR016
              - CR017
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
