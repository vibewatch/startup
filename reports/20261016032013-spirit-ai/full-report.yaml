              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV001
              - CV005
              - CV007
              - CV012
              - CV015
      - number: '8.2'
        title: Financing context and overhang
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is directionally strong but difficult to reconcile. EqualOcean reported two
              consecutive rounds totaling nearly CNY 2 billion in February 2026 and described broad follow-on
              participation. A Spirit AI release distributed through PR Newswire separately stated that the company had
              raised $280 million. Baidu Baike then described additional April and June events, while September Reuters
              reporting put cumulative funding above $670 million and the valuation at 20 billion yuan. These figures
              should not be added together: the sources do not consistently define whether amounts are round proceeds,
              cumulative funding, or separate closings. They also omit liquidation preferences, seniority, governance,
              dilution, and cash on hand. The financing history demonstrates access to capital, not the economics
              available to a new investor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
      - number: '8.3'
        title: Scenarios and comparable framework
        blocks:
          - type: paragraph
            body: >-
              A milestone framework is more defensible than a revenue-multiple framework because no retained source
              discloses auditable revenue or margin. In the bull case, live industrial deployments expand into repeat
              fleet orders, reliability holds in less structured settings, and disclosed economics begin to support the
              current mark. In the base case, technical progress and investor interest continue but outsiders still
              cannot connect the valuation to cash-generating performance. In the bear case, fine-motor and
              unfamiliar-task limitations persist, industrial adoption remains narrow, and future capital carries
              unfavorable terms. Public-company or transaction multiples would create false precision without comparable
              revenue, business-mix, and margin denominators. The relevant comparison today is milestone attainment
              against the price already paid, not an invented point estimate.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is unproven. Reuters reported that co-founder Gao Yang declined to comment on IPO plans,
              and the retained sources provide no independently documented acquisition process, secondary-market
              liquidity, or target exit window. The investment thesis should strengthen only if Spirit AI supplies clean
              round documentation, converts named deployments into repeat orders with measurable uptime and customer
              ROI, and reports financial results that can support the current valuation. It should break if fleet
              expansion stalls, intervention burden prevents attractive unit economics, technical limitations remain
              unresolved beyond the company's stated industrial window, or new securities subordinate an investor
              without compensating price relief. These are diligence gates, not forecasts: the public record does not
              support a numerical return target, hold period, or exit valuation.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Separate company quality from entry price
            body: >-
              Reported deployments justify continued diligence, but the latest financing mark is not a substitute for
              audited economics or security-level terms.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV015
          - type: callout
            title: Do not add financing announcements together
            body: >-
              February, April, June, and cumulative-funding disclosures use inconsistent labels and bases; summing them
              would risk double counting and would still not reveal cash available.
            calloutType: risk
            claimRefs:
              - CV002
              - CV010
              - CV012
