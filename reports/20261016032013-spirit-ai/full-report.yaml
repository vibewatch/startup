      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The largest gap in the customer chapter is durability. Baidu Baike says commercialization began in the
              fourth quarter of 2025 with order sizes at the tens of millions of yuan level, but none of the retained
              sources disclose customer count, contract duration, renewal behavior, cohort retention, or
              pilot-to-production conversion rates. Independent commentary also limits how far the current customer
              proof can be stretched: Humanoids Daily notes that Spirit AI's reported 90% success rate is for simple
              tasks in structured living-room environments without disclosed trial counts or intervention rules, and
              Reuters-syndicated coverage says homes are still at least eight years away. Because disclosed customer
              proof clusters around CATL and JD-related surfaces, expansion looks plausible but concentration and
              channel dependence remain live underwriting risks until management provides account mix, utilization, and
              renewal evidence.
