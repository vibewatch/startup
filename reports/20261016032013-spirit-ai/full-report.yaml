      - number: '2.2'
        title: Public sizing is proxy-based rather than a disclosed TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >
              None of the successful prefetched sources in this worker pool isolate Spirit AI's served market with a
              standalone TAM, SAM, SOM, or CAGR, so a defensible sizing view has to use constrained public proxies
              instead of one headline estimate. The most useful lenses are category crowding, observable deployments,
              data-collection scale, and the set of enterprise use cases external reporting names explicitly. Tracxn's
              competitor census says the category already contains hundreds of active companies, while Reuters-style
              reporting shows only tens of Moz1 units in named production settings and external commentary still
              describes data collection and task generalization as binding constraints. The result is a market that is
              strategically large, but not yet quantified well enough in public to underwrite with a clean top-down
              spend number.
