      - number: '3.3'
        title: Distribution access may matter more than list pricing
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's strategic network spans manufacturing, logistics, and consumer electronics, and reporting
              links CATL, JD.com, Huawei, Xiaomi, and TCL to its investor or partner ecosystem. That network can create
              access to deployment sites and operating data, a potentially stronger advantage than a model-only
              benchmark. Dozens of Moz1 units at CATL and JD.com are evidence of field access, but not proof of paid
              production contracts, repeat orders, utilization, or customer return on investment. No retained source
              provides list pricing, realized contract value, hardware-versus-software packaging, service obligations,
              or discounting. Without those terms, switching cost and lock-in cannot be quantified: integration and
              accumulated site data may create friction, while open model artifacts and multi-vendor experimentation may
              preserve buyer leverage.
