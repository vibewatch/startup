  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant field is wider than humanoid manufacturers. Spirit AI presents itself as a full-stack
              embodied-intelligence vendor, while its own release places Google DeepMind and Physical Intelligence in
              the same data-intensive physical-reasoning race. Independent analysis also compares Spirit AI's scaling
              bottleneck with Figure's Helix program, while explicitly warning that the comparison does not prove equal
              technical maturity or a shared timetable. For an industrial buyer, internal automation teams, conventional
              fixed automation, and continued manual work remain practical substitutes because factories reward bounded
              workflows and predictable safety conditions. Spirit AI therefore competes simultaneously for model
              quality, deployment access, integration ownership, and proof that a general system is more economical than
              a narrower incumbent solution.
