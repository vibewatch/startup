      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The emerging moat is a learning loop rather than a proven installed-base franchise: more industrial access
              can generate more varied physical data, which can improve models and make future deployments easier.
              Capital scale also increased sharply between February and September reporting, yet funding raised is not
              cash available and does not establish revenue quality. The loop remains vulnerable to commoditization if
              model code, hardware components, or data-collection methods become widely available, and to incumbent
              response if integrated robotics vendors pair comparable intelligence with manufacturing scale. Public
              evidence is also internally uneven: Dealroom displays both a seed-and-angel funding statement and “No
              known external funding,” while company benchmark claims lack disclosed test denominators. The investment
              case therefore depends on independently verified production reliability, contract economics, and repeat
              deployment—not headline funding or ordinal positioning.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP010
              - CP011
              - CP012
