        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Spirit AI's financial setup looks strong on one axis: access to capital. By September 2026 the company had
              raised more than $670 million and commanded a reported RMB 20 billion valuation, which makes it unusually
              well financed for a 2024-founded embodied-AI startup. But that same public record still fails the core
              underwriting tests: no revenue by stream, no realized pricing, no gross margin, no burn, no runway, and no
              proof that pilots are converting into large recurring orders. The verdict is therefore mixed: financing
