company:
  name: "Spirit AI"
chapter:
  number: 7
  title: "Risks"
  summary: "Spirit AI's highest residual risks come from underwriting a capital-intensive robot-software thesis on narrow public commercialization proof, concentrated ecosystem dependencies, and incomplete independent evidence on safety, privacy, and unit economics. The available 2026 sources show real industrial momentum, but they do not yet clear the diligence bar for certification, diversified customer validation, or cash-performance verification."
sections:
  - id: "ranked-underwriting-risks"
    title: "Ranked underwriting risks"
    body: |-
      The public record supports a real but still narrow commercialization story. Gasgoo says Spirit AI raised nearly CNY2 billion across two February 2026 financings and assembled a shareholder base that includes CATL, JD.com, TCL, Huawei, Xiaomi, and state-backed funds, while Reuters-based follow-on coverage says tens of Moz1 robots are deployed at CATL and JD.com. That combination is a strength for access and scenario data, but it also means the underwriting case depends heavily on a small set of ecosystem relationships rather than a broad customer base. The central risk is that valuation and operating scale are moving faster than independently verified proof on safety, diversification, and durable unit economics.
    claimRefs: ["CR001", "CR002", "CR005", "CR015"]
  - id: "regulatory-safety-and-data-governance"
    title: "Regulatory, safety, and data-governance risk"
    body: |-
      The assigned source pool does not document third-party safety certification, formal regulatory approvals, privacy controls, or litigation outcomes for Moz deployments. Reuters-based coverage describes collision detection and braking, but Momenta explicitly frames that as Spirit AI's own account rather than an independently tested result. The same coverage says Spirit uses about 1,000 contractors to collect physical-world training data in homes and factories, while PRNewswire says the company is scaling that pipeline far further. Those facts make data governance, worker-consent, and deployment-safety diligence mandatory. The absence of a recorded incident in this pool is not evidence that certification, privacy, or product-liability risk is low; it is evidence that public verification is incomplete.
    claimRefs: ["CR006", "CR011", "CR012", "CR014"]
    tableRefs: ["TR001"]
  - id: "operational-and-quality-risk"
    title: "Operational, quality, and execution risk"
    body: |-
      Spirit AI's public operating proof is strongest in constrained settings and weakest in generalization. Momenta says the reported 90% success rate applies to simple tasks in structured living-room settings, and the same article says fine-motor work and unseen tasks remain unsolved. Reuters-based coverage also places factories in the next one to two years and homes at least eight years away, which is a clear warning against underwriting a near-term household-robot thesis. PRNewswire adds company-reported evidence of 99%+ success on CATL wire-harness handling and more than 200,000 hours of training data, but both metrics are management-supplied rather than independently benchmarked. Residual execution risk stays high until repeatability, uptime, and safety are shown outside tightly scoped environments.
    claimRefs: ["CR008", "CR009", "CR010", "CR012", "CR013"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "dependency-financing-and-kill-criteria"
    title: "Dependency, financing, and thesis-break criteria"
    body: |-
      Spirit AI's financing and partnership model creates both momentum and concentration risk. Gasgoo says strategic investors also provide deployment scenarios and data streams, while Reuters-based articles say the visible commercial proof is concentrated in CATL and JD.com. PRNewswire's scaling plan depends on expanding the data-collection apparatus to more than 1 million hours, which implies ongoing capital needs and execution complexity even before public revenue, margin, or renewal disclosures are available. Independent disclosure is still patchy: Expolume shows no article or event history on its profile, and Dealroom's visible entry even says "No known external funding," contradicting better-sourced reporting. Kill criteria should therefore focus on safety certification, diversified customer evidence beyond CATL and JD.com, and audited financial disclosure that ties deployment to cash performance rather than headline valuation.
    claimRefs: ["CR001", "CR002", "CR005", "CR013", "CR015", "CR016", "CR017"]
    tableRefs: ["TR003"]
