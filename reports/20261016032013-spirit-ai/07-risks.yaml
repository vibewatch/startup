      - ["Scale-up outruns verified customer ROI", "Tens of robots and a 99%+ CATL benchmark are public, but diversified customer returns and utilization remain undisclosed.", "Medium", "High", "Developing", "High", "Named customer ROI, renewal, uptime, and pilot-to-production conversion metrics."]
    notes: "Public evidence mixes company statements and Reuters-derived reporting; numbers are preserved as reported and do not imply an independently audited reliability baseline."
