      - ["Data governance / privacy controls", "Reuters-based coverage says ~1,000 contractors collect home and factory data; assigned sources do not disclose consent, retention, anonymization, or security controls.", "Unverified", "Medium", "High", "Wearable collection devices and cost reduction are described publicly, but governance controls are not.", "High", "Review contractor agreements, consent language, data flow maps, storage controls, and any customer DPA."]
      - ["Corporate / licensing / cap-table opacity", "Public sources show rapid fundraising and strategic/state investors, but not filing-level entity, rights, or licensing detail.", "Partially disclosed", "Medium", "Medium", "Well-capitalized investor base may ease access, but does not replace legal diligence.", "Medium", "Obtain legal-entity chart, financing documents, board rights, and material operating licenses."]
    notes: "Rows are severity-ranked and limited to risks that the assigned public source pool can actually support; missing certification or litigation evidence is a diligence gap, not proof of absence."
