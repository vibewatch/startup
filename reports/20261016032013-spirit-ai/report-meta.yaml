  topStrengths:
    - Reported industrial deployments at CATL and JD.com give the company real-world proof beyond a lab demo.
    - Fundraising has been rapid and large enough to support continued model and deployment investment.
    - The public technical narrative is coherent across model development, data collection, and robot deployment.
  topRisks:
    - Public sources do not provide audited revenue, gross margin, cash burn, runway, or security-level terms.
    - The valuation relies on reported pricing marks rather than independently disclosed operating performance.
    - Industrial success has not yet translated into clear repeatable customer economics or broad commercial proof.
  unresolvedGaps:
    - Audited revenue by stream, gross margin, cash burn, runway, and working-capital needs for scaled robot production.
