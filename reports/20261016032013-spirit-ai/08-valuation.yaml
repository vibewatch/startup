schemaVersion: report-v2
artifact: valuation
slug: spirit-ai
runDate: 2026-10-16
company:
  name: Spirit AI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Spirit AI has credible industrial deployment and financing signals, but the
    September 2026 reported valuation of 20 billion yuan ($2.9 billion) is not
    supported by public audited operating metrics or disclosed security terms.
    The evidence supports a research-more recommendation, medium confidence,
    high risk, and a stretched valuation stance pending financial, cap-table,
    and customer-economics diligence.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The price-sensitive recommendation is research-more rather than invest or
      pass. Reuters reporting carried by Yahoo says Spirit AI had raised more
      than $670 million since its 2024 founding and was valued at 20 billion yuan
      ($2.9 billion) by September 2026. That capital base and reported deployment
      of tens of Moz1 robots at CATL and JD.com make the company more than a
      laboratory concept. They do not establish that the current price offers an
      attractive return. None of the retained sources supplies audited revenue,
      gross margin, cash burn, runway, cash available, or security-level terms.
      Entry should therefore depend on a reconciled cap table, board-grade
      operating data, and customer-level evidence of repeatable fleet economics.
      Until those tests are met, the financing mark is a reference point rather
      than an independently supported fair value.
    claimRefs: [CV001, CV005, CV012, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-overhang
    title: Financing context and overhang
    body: >-
      Public financing evidence is directionally strong but difficult to
      reconcile. EqualOcean reported two consecutive rounds totaling nearly CNY
      2 billion in February 2026 and described broad follow-on participation.
      A Spirit AI release distributed through PR Newswire separately stated that
      the company had raised $280 million. Baidu Baike then described additional
      April and June events, while September Reuters reporting put cumulative
      funding above $670 million and the valuation at 20 billion yuan. These
      figures should not be added together: the sources do not consistently
      define whether amounts are round proceeds, cumulative funding, or separate
      closings. They also omit liquidation preferences, seniority, governance,
      dilution, and cash on hand. The financing history demonstrates access to
      capital, not the economics available to a new investor.
    claimRefs: [CV001, CV002, CV003, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-framework
    title: Scenarios and comparable framework
    body: >-
      A milestone framework is more defensible than a revenue-multiple framework
      because no retained source discloses auditable revenue or margin. In the
      bull case, live industrial deployments expand into repeat fleet orders,
      reliability holds in less structured settings, and disclosed economics
      begin to support the current mark. In the base case, technical progress
      and investor interest continue but outsiders still cannot connect the
      valuation to cash-generating performance. In the bear case, fine-motor and
      unfamiliar-task limitations persist, industrial adoption remains narrow,
      and future capital carries unfavorable terms. Public-company or transaction
      multiples would create false precision without comparable revenue,
      business-mix, and margin denominators. The relevant comparison today is
      milestone attainment against the price already paid, not an invented
      point estimate.
    claimRefs: [CV006, CV007, CV008, CV012, CV014, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-thesis-breaks
    title: Exit readiness and thesis breaks
    body: >-
      Exit readiness is unproven. Reuters reported that co-founder Gao Yang
      declined to comment on IPO plans, and the retained sources provide no
      independently documented acquisition process, secondary-market liquidity,
      or target exit window. The investment thesis should strengthen only if
      Spirit AI supplies clean round documentation, converts named deployments
      into repeat orders with measurable uptime and customer ROI, and reports
      financial results that can support the current valuation. It should break
      if fleet expansion stalls, intervention burden prevents attractive unit
      economics, technical limitations remain unresolved beyond the company's
      stated industrial window, or new securities subordinate an investor
      without compensating price relief. These are diligence gates, not forecasts:
      the public record does not support a numerical return target, hold period,
      or exit valuation.
    claimRefs: [CV005, CV007, CV008, CV013, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, research-more, "Industrial deployment is reported, but operating and security-level evidence is incomplete.", "Continue diligence; do not underwrite from headlines alone."]
      - [Confidence, medium, "Funding and deployment are well reported, while valuation support depends on private data.", "Treat the conclusion as conditional on data-room verification."]
      - [Risk rating, high, "Commercialization, reliability, dilution, and exit paths remain unresolved.", "Require explicit downside protections or price relief."]
      - [Valuation stance, stretched, "The reported 20 billion yuan mark lacks public audited revenue or margin anchors.", "Do not treat the latest financing mark as independently verified fair value."]
      - [Return framework, milestone-based, "Comparable revenue and margin denominators are unavailable.", "Set entry and follow-on decisions against verified deployment and financial milestones."]
    notes: >-
      Assessments use retained public evidence available on 2026-10-16; no
      numerical return target is presented because audited operating metrics and
      security terms are unavailable.
    claimRefs: [CV001, CV005, CV012, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - ["Capital access", "More than $670 million of reported cumulative funding gives Spirit AI substantial development capacity.", "Funding raised is not cash available, and rapid financing can magnify dilution or preference overhang.", "Reconciled closing schedule, current cash balance, and security-level cap table."]
      - ["Industrial proof", "Tens of Moz1 robots are reported at CATL and JD.com production sites.", "Unit count does not disclose utilization, paid contract value, renewal, uptime, or customer return.", "Customer-confirmed cohort economics and expansion orders."]
      - ["Technical readiness", "A 90% success rate was reported for simple tasks in structured living-room settings.", "The cited evaluation lacks trial count, task mix, and intervention rules, while fine-motor and unseen tasks remain difficult.", "Independent testing across unfamiliar tasks and less structured settings."]
      - ["Market timing", "Management sees an initial industrial application window over the next one to two years.", "The same reporting places household deployment at least eight years away.", "Evidence that industrial deployments scale before the next major financing need."]
      - ["Price support", "The latest mark reflects substantial investor demand and follow-on participation.", "Public audited revenue, margins, burn, runway, and financing terms are not disclosed.", "Board-grade financials that connect deployment growth to sustainable economics."]
    notes: >-
      Financing amounts, deployment counts, and performance claims retain their
      original denominators; missing customer and financial metrics are not
      estimated.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV008, CV012, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Evidence-linked assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Industrial fleets expand into repeat orders; reliability transfers beyond structured tasks; audited economics become investable.", "The current mark becomes supportable only if commercial conversion and margins scale fast enough to create venture returns from today's entry.", "Execution delays, data costs, hardware intensity, and competition.", "Positive only after customer and financial milestones are independently verified."]
      - ["Base", "Spirit AI keeps technical momentum and capital access, but deployment economics and round terms remain private.", "The valuation remains stretched because a new investor cannot yet connect the mark to a comparable operating denominator.", "Further dilution, slow fleet expansion, and continuing metric opacity.", "Closest to the retained public evidence as of the run date."]
      - ["Bear", "Fine-motor and unfamiliar-task limitations persist; deployments do not broaden; later financing carries adverse terms.", "Downside or a down round becomes plausible because the entry mark already assumes stronger commercialization than public evidence proves.", "Multiple compression, preference overhang, weak customer ROI, and delayed exit.", "Triggered by stalled deployments, missed reliability milestones, or investor-unfriendly securities."]
    notes: >-
      Scenarios are qualitative and conditional; the retained evidence does not
      support numeric probabilities, valuation ranges, return multiples, or a
      target exit date.
    claimRefs: [CV005, CV007, CV008, CV010, CV012, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Ambition, capital, and deployment evidence are progressively discounted by
      reliability, financial-transparency, and price-support gaps.
    data:
      nodes:
        - id: ambition
          label: Large stated ambition
          detail: "Spirit AI says its mission is for 10% of the world to own a robot within ten years."
          tone: neutral
        - id: capital
          label: Strong capital access
          detail: "Reuters reported more than $670 million raised and a 20 billion yuan valuation."
          tone: positive
        - id: deployment
          label: Industrial proof
          detail: "Tens of Moz1 robots were reported on CATL and JD.com production lines."
          tone: positive
        - id: limitations
          label: Reliability limits
          detail: "Structured-task results lack full evaluation detail, and unfamiliar tasks remain difficult."
          tone: warning
        - id: opacity
          label: Underwriting opacity
          detail: "Audited operating metrics, cash availability, and security terms are not public."
          tone: risk
        - id: decision
          label: Research-more
          detail: "Treat the current valuation as stretched until private diligence supports price and downside terms."
          tone: risk
      edges:
        - from: ambition
          to: capital
          label: attracts
        - from: capital
          to: deployment
          label: funds
        - from: deployment
          to: limitations
          label: must overcome
        - from: limitations
          to: opacity
          label: compounds
        - from: opacity
          to: decision
          label: drives
    approximationNotes: >-
      The flow is qualitative and ordered; it does not encode probability,
      magnitude, or a valuation calculation.
    claimRefs: [CV004, CV001, CV005, CV007, CV012, CV015]
callouts:
  - calloutType: recommendation
    title: Separate company quality from entry price
    body: >-
      Reported deployments justify continued diligence, but the latest financing
      mark is not a substitute for audited economics or security-level terms.
    claimRefs: [CV001, CV005, CV012, CV015]
  - calloutType: risk
    title: Do not add financing announcements together
    body: >-
      February, April, June, and cumulative-funding disclosures use inconsistent
      labels and bases; summing them would risk double counting and would still
      not reveal cash available.
    claimRefs: [CV002, CV010, CV012]
