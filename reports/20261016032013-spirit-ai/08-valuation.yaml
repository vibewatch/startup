  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-performance
      missingEvidence: Audited or board-grade revenue by stream, gross margin, cash burn, runway, working-capital needs, and current cash balance.
      whyItMatters: These metrics are required to connect the reported valuation to operating performance and financing needs.
      diligencePath: Review the latest board package, monthly KPI bridge, bank statements, and product-line gross-margin schedule.
      relatedQuestionRefs: [QV002, QV008]
      relatedTableRefs: [TV001, TV003]
    - type: conflicting-data
      severity: material
      topic: financing-terms
      missingEvidence: Reconciled 2026 closing dates, gross and net proceeds, post-money valuations, security types, preferences, governance rights, and fully diluted ownership.
      whyItMatters: Funding raised is not cash available, and entry economics depend on dilution and the investor's position in the preference stack.
      diligencePath: Reconcile signed term sheets, closing binders, the current cap table, and counsel's preference waterfall.
      relatedQuestionRefs: [QV002, QV008, QV010]
      relatedTableRefs: [TV001, TV002]
    - type: private-evidence-only
      severity: material
      topic: deployment-economics
      missingEvidence: Paid contract values, fleet utilization, uptime, intervention burden, renewal or expansion behavior, gross margin, and customer ROI for CATL and JD.com deployments.
      whyItMatters: Deployment counts alone cannot establish repeatable commercial economics or support the current valuation.
      diligencePath: Obtain customer-level cohorts and interview operating sponsors at CATL, JD.com, and at least one additional deployment.
      relatedQuestionRefs: [QV002, QV003, QV004, QV008]
      relatedTableRefs: [TV002, TV003]
    - type: missing-source
      severity: material
      topic: exit-path
      missingEvidence: A documented IPO process, acquisition path, secondary-market evidence, or other credible liquidity plan with timing.
      whyItMatters: A venture return cannot be underwritten without a plausible route and time horizon for liquidity.
