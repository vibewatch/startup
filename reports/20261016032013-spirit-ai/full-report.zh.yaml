      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开架构构成了一个 6 层闭环，从真实世界采集经过模型训练和具身化，最终回到部署反馈。
    data:
      layers:
        - label: 真实世界活动
          summary: Human tasks in household and factory settings define the physical problem set.
          items:
            - label: 输入
              displayValue: Human video and physical demonstrations
          outputs:
            - label: Varied task examples
        - label: 可穿戴设备数据采集
          summary: Contractors collect movements with wearable equipment rather than only teleoperating robots.
          items:
            - label: 据报道的采集网络
              displayValue: Around 1,000 contractors
          outputs:
            - label: Sensor-aligned demonstrations
        - label: 交互语料库
          summary: Spirit AI emphasizes diverse imperfect data, including flexible-object handling.
          items:
            - label: 据报道的规模
              displayValue: More than 200,000 hours
          outputs:
            - label: Training data for VLA models
        - label: Spirit VLA 模型
          summary: An end-to-end model links perception and language to physical actions.
          items:
            - label: 公开产物
              displayValue: Spirit v1.5 code and checkpoints reported
          outputs:
            - label: Robot action policies
        - label: Moz1 具身化
          summary: Force-sensitive hardware executes learned policies in bounded environments.
          items:
            - label: 主力产品
              displayValue: 26-degree-of-freedom Moz1 reported
          outputs:
            - label: Physical task execution
        - label: 部署反馈
          summary: CATL and JD deployments provide validation and potentially harder future examples.
          items:
            - label: 当前规模信号
              displayValue: Tens of units reported
          outputs:
            - label: New exceptions and iteration evidence
    approximationNotes: 该顺序综合了保留来源中描述的运营闭环；它不是厂商的字面架构，也不能证明反馈已自动导入。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: 从工业验证到更广扩张的客户旅程
    type: journey-map
    summary: 公开证据显示，Spirit AI 正从已点名的工业验证点走向与 JD 相关的零售扩张及更长期的商业服务路线图，但家庭需求仍只是愿景。
    data:
      items:
        - label: 工业产线验证
          actor: CATL 和 JD.com 运营团队
          stage: 结构化企业部署
          touchpoints:
            - 电池产线和生产线任务是目前最明确的使用场景。
            - 工作流受限且可重复的场景，公开验证最充分。
        - label: 可量化的制造业结果
          actor: 工厂买方
          stage: 结果基准
          touchpoints:
            - Baike 和 PRNewswire 报道称，CATL 产线在插接或理线任务上的成功率超过 99%。
            - 运行时间、样本量和干预率仍未披露。
        - label: 战略合作伙伴扩张
          actor: JD Group / JD MALL
          stage: 多年期渠道建设
          touchpoints:
            - 2026-2029 年的 JD 合作将零售服务场景带到生产线之外。
            - 公开来源首先提到咖啡制备，但没有说明已规模化付费推广。
        - label: 商业服务路线图
          actor: 超市、餐饮、酒店、办公楼
          stage: Moz2 目标场所
          touchpoints:
            - Spirit AI 将这些场所列为下一步服务市场。
            - 目前保留的来源中，没有一个点名该群组里的实际客户。
        - label: 持久性验证缺口
          actor: 未来企业买方
          stage: 留存和扩张测试
          touchpoints:
            - 公开来源没有披露客户数量、合同期限、续约或 NRR。
            - 仍需直接开展客户尽调，验证可重复性。
        - label: 家庭愿景
          actor: 消费者
          stage: 长期愿景
          touchpoints:
            - 家庭拥有机器人仍属于使命叙事的一部分。
            - 独立报道称，家庭部署至少还要 8 年。
    approximationNotes: 各阶段代表公开证据中的顺序，不代表实测转化率或客户量份额。
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险的严重度集中在认证 / 数据治理缺口，以及依赖集中客户的商业化验证上。
    data:
      columns:
        - 可能性极低
        - 可能性低
        - 可能性中等
        - 可能性较高
        - 可能性高
        - 可能性极高
      rows:
        - label: 关键影响
          values:
            - ''
            - ''
            - label: 安全认证缺口
              detail: 在拿出第三方测试和事故证据前，剩余风险仍然很高。
            - ''
            - label: 资本投入强度与验证
              detail: 估值和规模化计划领先于客户 / 收入透明度。
            - ''
        - label: 高影响
          values:
            - ''
            - label: 披露不透明
              detail: 独立数据库并不完整，彼此也存在矛盾。
            - label: 数据治理 / 隐私
              detail: 庞大的承包商链条缺少公开控制措施披露。
            - label: 对战略合作伙伴的依赖
              detail: 投资者同时充当渠道和场景提供方。
            - label: 客户集中度
              detail: 已点名的验证主要集中在 CATL 和 JD.com。
            - ''
        - label: 中等影响
          values:
            - ''
            - ''
            - label: 模型泛化
              detail: 结构化客厅和工厂证据可能无法顺利迁移。
            - label: 家庭时间表延后
              detail: 公开路线图已经将家庭部署置于工厂部署数年之后。
            - label: 基准迁移风险
              detail: CATL 基准不能证明广泛的运行时间或 ROI。
            - ''
    claimRefs:
      - CR002
      - CR005
      - CR008
      - CR009
      - CR011
      - CR014
      - CR015
      - CR016
      - CR017
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 可靠性、财务透明度和价格支撑缺口，逐步削弱了愿景、资本和部署证据的权重。
    data:
      nodes:
        - id: ambition
          label: 雄心宏大的公开愿景
          detail: Spirit AI 称，其使命是在 10 年内让全球 10% 的人口拥有机器人。
          tone: neutral
        - id: capital
          label: 强大的资本获取
          detail: Reuters 报道称，已融资超过 $670 million，估值为 20 billion yuan。
          tone: positive
        - id: deployment
          label: 工业验证
          detail: 据报道，CATL 和 JD.com 生产线上有数十台 Moz1 机器人。
          tone: positive
        - id: limitations
          label: 可靠性限制
          detail: 结构化任务结果缺少完整评估细节，陌生任务仍然困难。
          tone: warning
        - id: opacity
          label: 投资判断不透明
          detail: 经审计的经营指标、可用现金和证券条款均未公开。
          tone: risk
        - id: decision
          label: 继续研究
          detail: 在私下尽调支持价格和下行条款之前，应将当前估值视为偏高。
          tone: risk
      edges:
        - from: ambition
          to: capital
          label: 吸引
        - from: capital
          to: deployment
          label: 提供资金
        - from: deployment
          to: limitations
          label: 必须克服
        - from: limitations
          to: opacity
          label: 叠加
        - from: opacity
          to: decision
          label: 推动
    approximationNotes: 该流程为定性且有顺序的判断；不代表概率、规模或估值计算。
    claimRefs:
      - CV004
      - CV001
      - CV005
      - CV007
      - CV012
      - CV015
