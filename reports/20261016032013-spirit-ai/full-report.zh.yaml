      - number: '2.2'
        title: 公开市场规模依赖代理指标，而非已披露的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              本工作池中成功预取的来源，没有一个用独立的 TAM、SAM、SOM 或 CAGR 划定 Spirit AI
              的可服务市场，因此合理的规模判断必须采用受约束的公开代理指标，而不是一个醒目的单点估算。最有用的观察角度包括品类拥挤度、可观察部署、数据采集规模，以及外部报道明确点名的企业用例。Tracxn
              的竞争者统计称该品类已经有数百家活跃公司；Reuters 风格的报道则显示，具名生产场景中只有几十台
              Moz1，外部评论仍把数据采集和任务泛化视为硬约束。结论是：市场战略上很大，但公开信息还没有量化到足以用一个干净的自上而下支出数字进行投资判断。
            claimRefs:
