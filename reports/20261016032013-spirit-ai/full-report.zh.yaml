  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争领域比人形机器人制造商更广。Spirit AI 把自己定位为全栈具身智能供应商，公司自身发布的材料也把 Google DeepMind 和 Physical Intelligence
              放在同一场数据密集型物理推理竞赛中。独立分析还把 Spirit AI 的规模化瓶颈与 Figure 的 Helix
              项目进行比较，同时明确警告，这并不能证明双方技术成熟度相同或时间表一致。对工业买方而言，内部自动化团队、传统固定自动化以及继续使用人工，仍是现实替代方案，因为工厂重视边界明确的工作流和可预测的安全条件。因此，Spirit
              AI 同时争夺模型质量、部署入口、集成主导权，以及证明通用系统比更窄的现有方案更经济的能力。
            claimRefs:
              - CP003
