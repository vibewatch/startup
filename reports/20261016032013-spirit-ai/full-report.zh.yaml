              发布消息称，公司已融资 $280 million。Baidu Baike 又记载了 4 月和 6 月的融资事件；Reuters 9 月报道则称，累计融资超过 $670 million，估值达 20 billion
              yuan。上述数字不能相加：各来源并未统一说明金额指单轮募集额、累计融资，还是不同交割。它们也没有披露清算优先权、顺位、治理、稀释和手头现金。融资历史只能证明公司有渠道获得资本，不能说明新投资人能拿到怎样的经济条件。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
      - number: '8.3'
        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              由于没有保留来源披露可审计收入或利润率，里程碑框架比收入倍数框架更可靠。在乐观情景中，真实工业部署扩展为重复车队订单，可靠性在更少结构化的环境中保持，已披露经济性开始支撑当前估值。在基准情景中，技术进展和投资人兴趣延续，但外部人士仍无法把估值与产生现金的表现连接起来。在悲观情景中，精细运动和陌生任务限制持续，工业采用仍然狭窄，未来资本条款不利。缺少可比收入、业务结构和利润率分母，上市公司或交易倍数只会制造虚假的精确度。今天真正相关的比较，是里程碑完成度与已经支付的价格，而不是编造一个点估值。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度与论点失效
        blocks:
          - type: paragraph
            body: >-
              退出准备度尚未得到证明。Reuters 报道联合创始人 Gao Yang 拒绝评论 IPO 计划，保留来源也没有提供独立记录的收购流程、二级市场流动性或目标退出窗口。只有在 Spirit AI
              提供干净的融资轮文件，把具名部署转化为具有可衡量在线率和客户 ROI
              的重复订单，并公布足以支撑当前估值的财务结果后，投资论点才应增强。如果车队扩张停滞、介入负担阻止公司实现有吸引力的单位经济性、技术限制在公司所称工业窗口之后仍未解决，或新证券让投资人处于次级且没有相应价格补偿，论点就应失效。这些是尽调门槛，不是预测：公开记录不支持数值化回报目标、持有期或退出估值。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 把公司质量与入场价格分开
            body: 已报道的部署足以支持继续尽调，但最新融资估值不能替代经审计的经济性或证券层面条款。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV015
          - type: callout
            title: 不要把融资公告相加
            body: 2 月、4 月、6 月和累计融资披露使用了不一致的标签和口径；相加会有重复计算风险，而且仍无法揭示可用现金。
            calloutType: risk
            claimRefs:
              - CV002
              - CV010
