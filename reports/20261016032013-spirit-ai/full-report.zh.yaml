      - number: '3.2'
        title: 能力差异化跑在验证质量前面
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 的公开差异化依托真实世界训练数据、一体化视觉—语言—动作技术栈和工业部署。报道说约 1,000 名承包商在家庭和工厂采集演示数据；Spirit v1.5
              的代码和检查点则为外部检查提供了具体材料。但最亮眼的性能数字仍来自公司：超过 200,000 小时交互数据、截至 2026 年底目标超过百万小时、1 月排行榜领先，以及 CATL 超过 99%
              的成功率。独立报道提供了有用的制衡：已报道的 90%
              成功率只适用于结构化客厅中的简单任务，而且没有试验次数、任务构成和人工介入规则。因此，矩阵把已披露能力与可独立比较的性能分开，而不是把每项主张都当作基准测试胜出。
