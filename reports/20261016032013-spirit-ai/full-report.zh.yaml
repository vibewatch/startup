      - number: '1.2'
        title: 领导层与治理概况
        blocks:
          - type: paragraph
            body: >-
              公开领导层主要集中在创始人兼 CEO Han Fengtao，以及联合创始人兼首席科学家 Gao Yang。Han 是官方 2026 年 6
              月会议报道中最主要的商业和战略发声者；他认为，行业近期应优先进行大规模预训练和数据积累，而不是立即面向大众市场商业化。Gao 支撑技术叙事：公司称他拥有 UC Berkeley
              博士学位、是清华大学助理教授，并参与过 EfficientZero、ViLa 和
              CoPa，这也解释了公司对外叙事为何高度依赖模型架构和数据规模。商业化与研究领导都如此集中，明显带来关键人物依赖。缺失的信息同样重要：指定来源没有披露当前董事会名单、表决权或控制权，也没有正式治理结构，因此任何依赖控制动态或接班准备度的投资判断，都需要直接尽调。
            claimRefs:
              - CO014
              - CO015
