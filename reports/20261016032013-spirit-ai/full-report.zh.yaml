        blocks:
          - type: paragraph
            body: >-
              其技术论点是一条端到端闭环，而非传统的模块化自动化栈。人类视频和可穿戴传感器捕捉多样的物理活动；所得语料训练 VLA 模型，把感知、语言指令和动作连接起来；Moz1
              随后在结构化环境中执行，部署例外又能产生更难的后续样本。管理层认为，不完美或“脏”的演示比精心筛选的动作更能加快学习。Reuters
              衍生报道给出具体原因：仿真更擅长处理刚体，却难以处理电缆等可变形物体。依赖关系同样清楚——这种方法需要持续的采集运营、合作伙伴入口、算力、标注纪律，以及对人类采集数据的治理。
