      - number: '2.4'
        title: 采用驱动因素真实存在，但缺少的验证是 ROI 和支出深度
        blocks:
          - type: paragraph
            body: >-
              即使公开资料有限，也能看到几个采用驱动因素：基准测试胜出提升了知名度，真实世界数据采集似乎形成差异化，工业合作伙伴则提供了训练和部署的真实环境。同一批来源也说明了为何投资判断仍然困难。柔性物体处理、陌生任务以及杂乱家庭中的安全自主行为仍未解决到足以让管理层继续用十年尺度讨论家庭部署。公开报道没有披露合同金额、从试点到量产的转化率或客户回本周期，因此最关键的问题不是具身
              AI 在原则上是否重要，而是 Spirit 能否足够快地把技术上令人印象深刻的部署转化为可重复的企业预算，支撑品类热度所暗示的规模。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
              - CM014
