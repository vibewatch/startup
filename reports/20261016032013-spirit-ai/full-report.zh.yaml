      - number: '1.3'
        title: 融资、部署验证与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              本章最有力的已验证融资事实，是公司自己在 2026 年 2 月宣布融资 $280 million，用于扩大具身模型部署。Baidu Baike 把记录向前延伸至               2024-2025
              年，从天使轮一路到 JD 主导的 Pre-A+；独立的 2026 年 9 月报道则称 Spirit AI 累计融资超过 $670 million，估值约为 20b
              yuan。这些后续总额很重要，但可信度仍属中等，因为指定公开记录尚未完全核对 2026 年 4 月和 6 月融资，也未披露条款、稀释、老股转让或债务。运营上，Spirit AI
              把激进的数据采集论点与具体工业验证点结合起来：官方材料称已有超过 300,000 个数据采集点、1,000 多名全职采集专家和 200,000-plus 小时交互数据；官方及第三方来源都指向 CATL 产线超过
              99% 的成功率。独立报道称 CATL 和 JD.com 生产线上已经有几十台 Moz1 机器人，进一步强化了这一叙事；但报道也明确提示，家庭部署仍需多年，已报道的 90%
              成功率来自结构化环境中的简单任务，并不能代表开放世界家庭可靠性。
