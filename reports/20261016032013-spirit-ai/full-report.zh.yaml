  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界很广，但切入点是工业自动化
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 将自己描述为具身 AI
              公司，打造最终进入家庭和工作场所、服务“智能劳动力”的通用人形机器人，因此理论市场边界覆盖机器人脑、部署系统和具身自动化，而非某个狭窄的软件品类。公开记录中的实际切入点要窄得多。Reuters
              转载采访称，未来一至两年首先是工业应用窗口，之后才是更简单的商业服务，家庭部署则明显更难。这让投资逻辑离开泛化的消费机器人叙事，转向工厂、物流和服务工作流：先在那里检验实体可靠性和运营经济性。
