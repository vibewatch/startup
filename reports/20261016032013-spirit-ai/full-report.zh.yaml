          label: 模型迭代
          note: 公开材料将数据采集直接与 Spirit 模型改进和工业就绪度联系起来。
        - id: deployments
          label: 试点部署
          note: 数十台 Moz1 设备和超过 1,000 个已处理电池单元显示了运营验证，但未披露合同金额。
        - id: monetization
          label: 硬件 / 服务变现
          note: 可能的收入层，但机器人定价、服务费和模型许可条款均未公开。
        - id: gross-profit
          label: 毛利转化
          note: 经常性采购订单、毛利率和支持成本披露仍然缺失。
      edges:
        - from: access
          to: data
          label: 场景进入
        - from: data
          to: models
          label: 训练闭环
        - from: models
          to: deployments
          label: 工业推广
        - from: deployments
          to: monetization
          label: 商业化
        - from: monetization
          to: gross-profit
          label: 单位经济性
    approximationNotes: 桥接图只反映公开披露的商业化步骤；未披露的定价、利润率和重复订单数据以缺口表示，而非估算值。
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
