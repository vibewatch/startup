      - number: '2.3'
        title: 买方首先是企业；消费需求仍只是可选上行空间
        blocks:
          - type: paragraph
            body: >-
              目前观察到的买方路径以企业为先。CATL 和 JD.com
              指向生产线、物流及零售邻近工作流：机器人可以插入边界明确的环境，并以吞吐量、人工或质量目标衡量。后续机会可能在零售、酒店等更简单的商业服务场所，Spirit 对 Moz2
              的定位暗示，工业可靠性提升后可以沿这条路径扩张。现有证据中，家庭采用是时间最远的细分市场：管理层称家庭应用至少还需八年，官方使命宣言应被理解为愿景，而不是消费者会在该时间表上买单的证明。因此，今天最可能的预算所有者是运营或自动化部门，而不是消费者钱包。
