  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 与证据关联的假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 工业车队扩展并带来重复订单；可靠性从结构化任务迁移出去；经审计的经济性达到可投资水平。
        - 只有当商业转化和利润率增长足够快、能从今日入场价格创造风险投资回报时，当前估值才站得住。
        - 执行延迟、数据成本、硬件投入强度和竞争。
        - 只有在客户及财务里程碑经独立验证后才转为正面。
      - - 基准
        - Spirit AI 保持技术势头和资本获取能力，但部署经济性和本轮条款仍属私下信息。
        - 新投资者尚无法将估值与可比的经营分母对应起来，因此估值仍然偏高。
        - 进一步稀释、车队扩张缓慢以及指标持续不透明。
        - 最接近截至运行日期所保留的公开证据。
      - - 熊市
        - 精细操作和陌生任务的局限持续存在；部署没有拓宽；后续融资附带不利条款。
        - 由于入场估值已经假定了公开证据尚未证明的更强商业化，下行或下轮融资变得可信。
        - 倍数压缩、优先权 overhang、客户 ROI 疲弱和退出延迟。
        - 部署停滞、可靠性里程碑未达成或证券条款不利于投资者时触发。
    notes: 情景为定性且有条件的判断；保留的证据不支持数值概率、估值区间、回报倍数或目标退出日期。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
