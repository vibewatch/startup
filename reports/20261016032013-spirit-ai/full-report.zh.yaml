companyProfile:
  summary: >-
    Spirit AI 是一家中国具身智能初创公司，开发通用机器人基础模型和 Moz 机器人部署系统。公开记录显示，公司融资迅速，在 CATL、JD.com
    等场地已有可见的工业部署，合作伙伴生态也在扩大；但经审计财务、股权结构表条款、客户覆盖面和运营经济性仍存在重大尽调缺口。
  productSummary: 公司销售用于工业和零售部署的具身 AI 基础模型及 Moz 机器人系统。
  customerFocus: 工业及早期商业机器人部署
  businessModel: 通过商业机器人部署和具身 AI 平台变现；公开来源尚未披露清晰的收入模式。
  stage: A+
  fundingStatus: 据报道，截至 2026 年 9 月累计融资已超过 $670 million，但 2026 年 4 月和 6 月的融资顺序尚未完全核对。
  disclosureProfile: private-undisclosed
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 将自己定位为具身 AI 与机器人公司，打造“通用机器人脑”和“智能劳动力”，而不是单一用途的机器人供应商；指定来源也始终把公司描述为通用基础模型加 Moz 机器人部署。官方 About
              页面列出杭州、北京和深圳的运营地点；Baidu Baike 则称 Spirit AI (Hangzhou) Technology Co., Ltd. 于 2024 年 2
              月成立、总部位于杭州。这份身份记录大体一致，但并不完全干净：一则关于 2026 年 9 月访问的 Reuters Connect 内容把北京标为公司总部。对尽调而言，实际结论是 Spirit AI
              明确在中国多个城市运营，但在把它作为后续投资判断中的硬事实之前，法定总部与运营总部的区别仍需通过企业登记摘录或管理层材料确认。
