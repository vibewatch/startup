      - number: '3.3'
        title: 分销入口可能比目录价格更重要
        blocks:
          - type: paragraph
            body: >-
              Spirit AI 的战略网络覆盖制造、物流和消费电子，报道将 CATL、JD.com、Huawei、Xiaomi 和 TCL
              与其投资人或合作伙伴生态联系起来。这张网络可以带来部署场地和运营数据，潜在价值可能高于只依赖模型的基准测试。CATL 和 JD.com 的几十台 Moz1
              证明了现场入口，但不能证明付费量产合同、重复订单、利用率或客户投资回报。现有来源没有提供目录价格、实际合同金额、硬件与软件的打包方式、服务义务或折扣。缺少这些条款，就无法量化切换成本和锁定效应：集成与积累的场地数据可能制造摩擦，而开放模型材料和多供应商试验又可能保留买方议价权。
            claimRefs:
              - CP003
              - CP007
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP013
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              正在形成的护城河更像学习闭环，而不是已被证明的装机基础业务：更多工业入口可以产生更多样的物理数据，改善模型并降低后续部署难度。2 月至 9
              月的报道显示资本规模也大幅上升，但已募集资金不等于可用现金，也不能证明收入质量。如果模型代码、硬件部件或数据采集方法变得普遍可得，该闭环可能被商品化；若一体化机器人供应商以制造规模配上相当的智能，也可能遭遇现有厂商反击。公开证据内部还不一致：Dealroom
              同时显示种子及天使融资说法和“No known external funding”，而公司基准测试主张没有披露试验分母。因此，投资逻辑依赖独立验证的量产可靠性、合同经济性和重复部署，而不是融资 headline
              或序位排名。
            claimRefs:
