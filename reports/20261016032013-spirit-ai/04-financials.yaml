      - ["Strategic industrial programs", "Bosch and Schaeffler partnerships combine data collection, model training, and industrial rollout", "Strategic agreements disclosed; whether they include paid milestones is undisclosed", "Could be paid co-development or scenario access rather than durable recurring revenue", "Commercial terms, milestone payments, and renewal mechanics by partner"]
      - ["Hardware / robot sales", "Moz robots are publicly named products used in deployments", "No list price, order volume, or shipped-unit revenue disclosed", "Hardware revenue may exist, but BOM, warranty, and service burden are opaque", "ASP by robot type, hardware gross margin, and support reserve assumptions"]
      - ["Implementation / support services", "Deployments imply installation, training, and ongoing support work", "Service layer is likely required, but fee structure is undisclosed", "Services can bridge commercialization but may scale with headcount rather than software leverage", "Implementation fee schedules, attach rates, and service gross margin"]
