company:
  name: "Spirit AI"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports exceptional financing momentum and early industrial deployment, but not Spirit AI's underlying unit economics. The company appears better capitalized than most embodied-AI peers, yet revenue quality, margin path, burn, and runway remain unproven because the public record does not disclose them."
sections:
  - id: "public-revenue-model-evidence"
    title: "Public revenue model evidence"
    body: |-
      Spirit AI's public financial narrative is heavy on fundraising and deployment proof, but light on monetization detail. The retained sources consistently point to industrial pilots and strategic partnerships—CATL, JD.com, Bosch, and Schaeffler—rather than disclosed software subscriptions, robot ASPs, or booked recurring contracts. That matters because the company appears to be commercializing through custom deployment work, joint industrial programs, and hardware-enabled scenario access before the market can observe stable repeat orders. Embodied Intelligence Observer's note that large recurring purchase orders have not yet landed is the key qualifier: public traction supports relevance and customer interest, but not yet revenue quality.
    claimRefs: ["CI003", "CI004", "CI005", "CI006", "CI009", "CI014"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "cost-structure-and-capital-needs"
    title: "Cost structure and capital needs"
    body: |-
      The public record implies a costly scale-up path. Reuters and Momenta describe roughly 300 employees plus around 1,000 contractors gathering real-world training data, while the Bosch agreement explicitly covers sensors, actuators, engineering validation, and mass-production support. WIPO and Reuters both explain why Spirit leans on physical-world data instead of simulation: real environments and flexible objects still break synthetic approaches. Together, those signals point to a business that likely carries both software R&D burn and hardware or deployment working-capital needs. The 2026 fundraising surge buys time, but public sources still omit cash on hand, gross margin, burn, inventory turns, debt, and runway.
    claimRefs: ["CI001", "CI002", "CI005", "CI007", "CI008", "CI010", "CI012", "CI015", "CI016"]
    tableRefs: ["TI003"]
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial verdict and diligence blockers"
    body: |-
      Spirit AI's financial setup looks strong on one axis: access to capital. By September 2026 the company had raised more than $670 million and commanded a reported RMB 20 billion valuation, which makes it unusually well financed for a 2024-founded embodied-AI startup. But that same public record still fails the core underwriting tests: no revenue by stream, no realized pricing, no gross margin, no burn, no runway, and no proof that pilots are converting into large recurring orders. The verdict is therefore mixed: financing strength reduces near-term survival risk, yet the absence of operating disclosure keeps revenue quality, margin path, and capital efficiency unproven.
    claimRefs: ["CI001", "CI002", "CI004", "CI005", "CI006", "CI011", "CI012", "CI013", "CI016"]
