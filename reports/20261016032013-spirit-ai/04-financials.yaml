    rows:
      - ["Capital raised / valuation", ">$670M raised by Sep 2026; ~RMB 20B valuation", "Medium", "Shows financing capacity, but not operating efficiency or runway", "Cash on hand by month, preferred terms, and post-round cap table"]
      - ["Operational traction proxy", "Tens of Moz1 units at CATL and JD.com; >1,000 battery units processed at CATL", "Medium", "Demonstrates real deployments, but not customer ROI or revenue yield", "Utilization, customer savings, and billed revenue per deployment"]
      - ["Data-collection labor base", "~300 employees plus ~1,000 contractors/data collectors", "Medium", "Suggests data acquisition and model iteration may carry substantial variable cost", "Contractor spend, internal payroll mix, and automation share of data labeling"]
      - ["Gross margin", null, "Low", "Margin quality determines whether scaling deployments creates value or burns cash faster", "Gross margin by hardware, services, and software line"]
      - ["Cash burn / runway", null, "Low", "Large funding rounds do not reveal how long the company can finance model, hardware, and deployment spend", "Monthly burn, quarter-end cash, runway assumptions, and fundraising trigger"]
      - ["Working capital / capex burden", null, "Low", "Mass-production ambition and component sourcing can absorb cash before revenue is recognized", "Inventory turns, component lead times, capex plan, and any debt or supplier-finance facilities"]
    notes: "The retained sources provide capital and deployment proxies, but not the private operating metrics needed for CAC, payback, contribution margin, or runway underwriting."
    claimRefs: ["CI001", "CI005", "CI007", "CI009", "CI010", "CI012", "CI013", "CI015"]
