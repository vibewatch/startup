callouts:
  - calloutType: insight
    title: Enterprise automation is the underwriteable market today
    body: The public record is strongest where Spirit can sell into bounded industrial or logistics workflows with measurable operating outcomes; households widen the story, but they do not yet anchor a near-term revenue case.
    claimRefs: [CM002, CM003, CM004, CM008, CM014]
  - calloutType: risk
    title: The missing market proof is spend depth and ROI
    body: Without customer budgets, contract values, and payback data, public evidence can show technical relevance and category heat but not a verified spend pool or repeatable enterprise adoption curve.
    claimRefs: [CM011, CM012, CM014]
