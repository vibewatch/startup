    notes: The assigned pool does not disclose a verified TAM/SAM/SOM or CAGR, so the table uses public proxy lenses rather than inventing a headline market estimate.
    claimRefs: [CM006, CM007, CM008, CM011, CM012]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Battery manufacturing
        - Battery or auto plant automation leader
        - Line-side robots and production supervisors
        - Enterprise capex / automation program
        - Production-line manipulation such as flexible wire-harness handling
        - Plant operations or advanced-manufacturing budget (inferred)
        - Precision, throughput, labor substitution, and safety in repetitive industrial tasks
      - - Logistics and retail operations
        - Logistics or retail-operations leader
        - Warehouse, fulfillment, or store teams alongside robots
        - Enterprise operations budget
        - Physical workflow execution in logistics or retail-adjacent settings
        - Logistics automation / operations budget (inferred)
        - Repetitive physical workflows in bounded environments
      - - Commercial services
        - Service-operations or facilities leader
        - Staff and customers in retail, hospitality, or office settings
        - Enterprise service-operations budget
        - Simpler front-of-house or routine service tasks
        - Facilities or service-operations budget (inferred)
        - Expansion after industrial reliability improves
      - - Households
        - Consumer household
        - Resident
        - Household wallet
        - Domestic assistance and general home tasks
        - Household discretionary spending
        - Reliable autonomy, safety, and service economics that are not yet proven publicly
    notes: Buyer, payer, and budget-owner fields are inferred from disclosed deployment contexts because the source pool does not reveal procurement org charts or contract terms.
    claimRefs: [CM002, CM003, CM004, CM008, CM009, CM010, CM014]
