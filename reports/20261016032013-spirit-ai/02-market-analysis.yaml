  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-gap
      missingEvidence: Independent market reports or bottoms-up budget data isolating embodied-AI spend for factory, logistics, service, and home use cases.
      whyItMatters: Without it, valuation work relies on proxies rather than a verified spend pool or adoption curve.
      diligencePath: Collect sell-side or industry datasets and build a bottoms-up budget model from target customer verticals.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: roi-proof
      missingEvidence: Contract values, utilization rates, labor-savings data, and payback periods from CATL, JD.com, and any later enterprise deployments.
      whyItMatters: The investable question is whether factory and logistics pilots convert into repeatable enterprise ROI, not just technical demonstrations.
      diligencePath: Request customer contracts, pilot scorecards, and references from operations leaders responsible for the deployments.
      relatedQuestionRefs: [QM003, QM004, QM005]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: household-demand
      missingEvidence: Independent demand studies, safety/certification evidence, and service-cost models for home humanoid adoption in China.
      whyItMatters: The consumer narrative materially widens TAM, but the public evidence here does not show that households will adopt on Spirit's implied timeline.
      diligencePath: Interview distributors, insurers, and regulators and review service-network economics before underwriting household demand.
      relatedQuestionRefs: [QM006, QM008]
