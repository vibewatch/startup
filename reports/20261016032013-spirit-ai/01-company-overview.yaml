          tone: neutral
        - date: "2024-08"
          label: Angel financing disclosed
          detail: Baidu Baike reports an angel round of nearly 200 million yuan led by Honghui Fund.
          tone: positive
        - date: "2024-11"
          label: Angel+ round added
          detail: Baidu Baike says Bairui Capital made an exclusive Angel+ investment.
          tone: positive
        - date: "2025-03"
          label: Pre-A financing recorded
          detail: Baidu Baike reports a Pre-A round involving Prosperity7 Ventures and other investors.
          tone: positive
        - date: "2025-07"
          label: JD-led Pre-A+ and Moz1 commercialization push
          detail: Baidu Baike records a JD-led nearly 600 million yuan Pre-A+ round and links it to commercialization momentum.
          tone: positive
        - date: "2026-01"
          label: Spirit v1.5 topped RoboChallenge
          detail: Official and Baike materials say Spirit v1.5 led the January 2026 RoboChallenge real-machine leaderboard.
          tone: positive
        - date: "2026-02-25"
          label: Official $280M raise announcement
          detail: Spirit AI announced a $280 million raise to scale general-purpose embodied-model deployment.
          tone: positive
        - date: "2026-06"
          label: BAAI conference operating-scale disclosure
          detail: Official conference coverage says Spirit AI had more than 300000 data collection points and 1000+ full-time collection specialists across China.
          tone: positive
        - date: "2026-09"
          label: Independent deployment and maturity check
          detail: Independent coverage says dozens of Moz1 robots are already at CATL and JD.com, but home deployment remains years away and current task success is still structured-environment specific.
          tone: risk
    approximationNotes: Dates follow the strongest publication or event date visible in the assigned source text; some 2026 coverage gives month-level rather than day-level precision.
    claimRefs: [CO002, CO005, CO007, CO009, CO012, CO013]
callouts:
  - calloutType: strength
    title: Industrial proof is stronger than the typical 2024-founded robot startup
    body: >-
      Spirit AI already has a clearer factory-deployment story than most young embodied-AI peers
      in public markets, because official CATL benchmark claims are reinforced by independent
      reports of dozens of Moz1 robots on CATL and JD.com production lines.
    claimRefs: [CO011, CO012]
  - calloutType: risk
    title: Valuation and scale signals outpace financial transparency
    body: >-
      The public narrative supports rapid funding growth and meaningful deployment experiments,
      but it still does not disclose revenue, customer breadth, cap-table mechanics, debt, or
      formal governance structure tightly enough to underwrite the latest valuation on public
      evidence alone.
    claimRefs: [CO008]
