company:
  name: Spirit AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Spirit AI's public record shows unusually fast fundraising and unusually early industrial
    deployment signals for a 2024-founded embodied-AI startup, anchored by a company-announced
    $280 million February 2026 raise and independent September 2026 reports that dozens of Moz1
    robots were already operating at CATL and JD.com. The same record is still thin on audited
    financials, customer economics, board/governance disclosure, and even the clean legal-HQ
    story, so later chapters should treat scale and valuation claims as directionally strong but
    still diligence-sensitive.
sections:
  - id: identity-and-operating-footprint
    title: Identity and operating footprint
    body: >-
      Spirit AI presents itself as an embodied-AI and robotics company building a "universal
      robotic brain" and an "intelligent workforce" rather than a single-purpose robot vendor,
      and the assigned sources consistently frame the business around general-purpose foundation
      models plus Moz robot deployments. The official About page lists operating locations in
      Hangzhou, Beijing, and Shenzhen, while Baidu Baike describes Spirit AI (Hangzhou)
      Technology Co., Ltd. as established in February 2024 and headquartered in Hangzhou. That
      identity record is directionally coherent, but not perfectly clean: a Reuters Connect item
      about a September 2026 visit labels Beijing as the company's headquarters. For diligence,
      the practical takeaway is that Spirit AI clearly operates across multiple Chinese cities,
      but the exact legal-HQ versus operating-HQ distinction still needs confirmation from a
      corporate registry extract or management materials before it is reused as a hard fact in
      downstream underwriting.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance-surface
    title: Leadership and governance surface
    body: >-
      The public leadership picture is concentrated around founder and CEO Han Fengtao and
      co-founder and chief scientist Gao Yang. Han is the visible commercial and strategic voice
      in the official June 2026 conference coverage, where he argues the industry's near-term
      priority is large-scale pre-training and data accumulation instead of immediate mass-market
      commercialization. Gao anchors the technical narrative: the company describes him as a
      UC Berkeley PhD, a Tsinghua assistant professor, and a contributor to EfficientZero, ViLa,
      and CoPa, which helps explain why the company's external story leans so heavily on model
      architecture and data scale. That concentration creates obvious key-person dependence across
      both commercialization and research leadership. What is missing is equally important: the
      assigned sources do not publish a current board roster, voting/control rights, or formal
      governance structure, so any investment view that depends on control dynamics or succession
      readiness still requires direct diligence.
    claimRefs: [CO014, CO015]
    tableRefs: [TO002]
  - id: capital-deployment-and-milestones
    title: Capital formation, deployment proof, and milestone cadence
    body: >-
      The strongest verified financing fact in the chapter is the company's own February 2026
      announcement that it raised $280 million to scale embodied-model deployment. Baidu Baike
      extends that record backward with a 2024-2025 sequence from angel through JD-led Pre-A+,
      while independent September 2026 coverage attributes more than $670 million of cumulative
      funding and roughly 20 billion yuan of valuation to Spirit AI. Those later totals are
      important but still medium-confidence because the assigned public record does not fully
      reconcile the April and June 2026 financings or disclose terms, dilution, secondaries, or
      debt. Operationally, Spirit AI pairs an aggressive data-collection thesis with concrete
      industrial proof points: official materials cite more than 300,000 data collection points,
      over 1,000 full-time collection specialists, and 200,000-plus hours of interaction data,
      while both official and third-party sources point to CATL-line success rates above 99%.
      Independent coverage strengthens that story by reporting dozens of Moz1 robots already on
      CATL and JD.com production lines, but it also sharpens the risk frame by stressing that
      household deployment remains years away and that the reported 90% success metric comes from
      simple tasks in structured settings rather than open-world home reliability.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
