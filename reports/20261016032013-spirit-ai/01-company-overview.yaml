  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: A current board roster, control-rights summary, and formal governance disclosures for the legal entity and major subsidiaries.
      whyItMatters: Public leadership visibility is strong, but control dynamics and succession readiness cannot be assessed from founder profiles alone.
      diligencePath: Request the latest cap table, board observer list, and shareholder agreement summary from the company.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: headquarters
      missingEvidence: A clean legal-entity and registered-office record that reconciles Hangzhou headquarters language with Reuters' Beijing-headquarters caption.
      whyItMatters: Jurisdiction, subsidy exposure, and customer concentration checks all depend on the correct legal-HQ and operating-site structure.
      diligencePath: Pull the latest corporate registry filing and confirm office and incorporation structure with management.
      relatedQuestionRefs: [QO001, QO008]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: financial-performance
      missingEvidence: Audited revenue or run-rate, customer count, gross margin, burn, runway, and working-capital needs for scaled robot deployment.
      whyItMatters: Public deployment anecdotes and funding totals do not show whether Spirit AI has a durable economic model at its latest valuation.
      diligencePath: Request audited financial statements, cohort revenue by customer, and a current operating plan with unit-economics assumptions.
      relatedQuestionRefs: [QO003, QO005, QO008]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: financing-terms
      missingEvidence: Round-by-round reconciliation for the reported April and June 2026 financings, including instruments, dilution, secondaries, and any debt or credit facilities.
      whyItMatters: The public record supports a sharp valuation step-up, but not the exact security terms or whether any capital was non-primary financing.
      diligencePath: Obtain the financing timeline deck, executed term sheets, and a post-round capitalization table.
      relatedQuestionRefs: [QO003, QO008]
      relatedTableRefs: [TO003]
