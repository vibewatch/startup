      - [Latest disclosed financing event, "$280M raise announced by the company", "2026-02-25", High, Official English release is clear on amount but not named investors.]
      - [Current valuation, Approximately 20 billion yuan or about $2.9B, "2026-09", Medium, Derived from independent September 2026 reporting rather than company disclosure.]
      - [Total raised, More than $670M reported, "2026-09", Medium, Needs round-by-round reconciliation across April and June 2026 financings.]
      - [Commercial deployment, Dozens of Moz1 robots reported at CATL and JD.com production lines, "2026-09", Medium, Utilization contract value and renewal behavior are not disclosed.]
      - [Headcount / labor model, Roughly 300 employees plus 1000+ collection specialists or contractors, "2026-09 / 2026-06", Medium, Public record mixes employee and contractor bases.]
      - [Revenue / run-rate, Not publicly supported in assigned evidence, null, Low, Requires management data room or audited statements.]
      - [Customer count, Not publicly supported in assigned evidence, null, Low, Named deployments exist but customer breadth is not quantified.]
    notes: Public sources mix company claims and independent reporting; unsupported private KPIs are left as explicit gaps rather than estimated.
    claimRefs: [CO001, CO002, CO003, CO005, CO008, CO012, CO013]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Evidence-backed background
      - Founder-market fit / functional coverage
      - Key-person dependency
    rows:
      - [Han Fengtao, Founder and CEO, Public face of 2026 strategy; Baike credits him with years in robotics and prior delivery/commercialization experience, Bridges capital allocation industrial go-to-market and external narrative, High because the public strategy record is highly concentrated on him.]
      - [Gao Yang, Co-founder and Chief Scientist, UC Berkeley PhD and Tsinghua assistant professor linked to EfficientZero ViLa and CoPa, Anchors embodied-model roadmap data thesis and technical credibility, High because technical differentiation is strongly tied to his research profile.]
    notes: Publicly visible leadership is concentrated in the founder-CEO and chief scientist; no current board roster is disclosed in the assigned pool.
    enumerationScope:
      coverage: partial
      basis: Publicly named top leadership in the assigned 2026 official and independent source set, not an exhaustive org chart or board register.
    claimRefs: [CO014, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Evidence-backed relevance
      - Diligence ask
    rows:
      - [CATL, Industrial deployment partner or customer, Core proof point for factory ROI narrative, Official and third-party sources cite CATL-line deployment and >99% success claims, Verify contract scope uptime and economics by line and site.]
      - [JD.com, Investor and deployment counterparty, Links capital support to named downstream scenarios, Baike cites a JD-led 2025 Pre-A+ round and independent 2026 coverage says Moz1 is on JD.com lines, Confirm whether JD is procurement customer strategic investor or both.]
      - [2026 financial-capital cohort, Follow-on capital providers, Supports valuation step-up and balance-sheet runway, Official release mentions diverse global financial and strategic investors while Baike names YF Capital Sequoia China and others, Reconcile named investors by round and security terms.]
      - [State-backed and industrial funds, Ecosystem and policy alignment, May matter for scaling factory pilots and local support, Baike names Chongqing and Hangzhou state-related capital in the February 2026 financing description, Determine whether any capital came with policy or deployment obligations.]
      - [Data-collection workforce, Operating stakeholder network, Critical input into Spirit's data moat and cost thesis, Official June 2026 coverage cites 300000+ collection points and 1000+ full-time collection specialists, Clarify contractor economics retention and data quality controls.]
    notes: This map blends customers investors and operating stakeholders because the public record ties commercialization, data acquisition, and financing together.
    enumerationScope:
      coverage: partial
      basis: Publicly visible named stakeholders and investor cohorts in the assigned source pool, not a complete stakeholder register or cap table.
    claimRefs: [CO006, CO007, CO009, CO011, CO012]
