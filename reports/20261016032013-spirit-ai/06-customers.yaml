        - Baidu Baike; PRNewswire
        - High
        - Suggests at least one industrial workflow reached useful production quality
        - No sample size, uptime, or error-recovery rate
      - - JD strategic term
        - 2026-2029 cooperation agreement
        - "2026-03-19"
        - Baidu Baike
        - Medium
        - Indicates a multi-year expansion path with a strategic partner
        - No committed spend or deployment milestones
      - - JD retail scenario
        - Moz robots planned for JD MALL coffee preparation and other retail workflows
        - "2026-03"
        - Baidu Baike
        - Medium
        - Shows a path from industrial proof into customer-facing service work
        - No site count or proof of scaled paid rollout
      - - Public deployment count
        - Tens of Moz1 robots deployed on CATL and JD.com production lines
        - "2026-09-18"
        - Reuters via Firstpost and bdnews24
        - High
        - Strongest independent signal that deployments extend beyond a single demo cell
        - No split by customer, active hours, or revenue contribution
      - - Structured-home benchmark
        - 90% success rate on simple tasks in structured living-room settings
        - "2026-09-18"
        - Reuters; Humanoids Daily
        - Medium
        - Useful capability milestone, but not retention or broad customer proof
        - No trial count, task mix, or intervention rules
    notes: >-
      Dates and values are kept as disclosed; missing denominators mark where the retained
      public record does not support a durability or scale conclusion.
