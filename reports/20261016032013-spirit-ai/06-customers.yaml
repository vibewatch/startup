figures:
  - id: FU001
    title: Customer journey from industrial proof to broader expansion
    type: journey-map
    summary: >-
      Public evidence shows Spirit AI moving from named industrial proof points toward
      JD-linked retail expansion and a longer-dated commercial-service roadmap, while
      household demand remains aspirational.
    data:
      items:
        - label: Industrial line proof
          actor: CATL and JD.com operations teams
          stage: Structured enterprise deployment
          touchpoints:
            - Battery-line and production-line tasks are the clearest named current use cases.
            - Public proof is strongest where workflows are bounded and repeatable.
        - label: Measured manufacturing outcome
          actor: Factory buyers
          stage: Outcome benchmark
          touchpoints:
            - Baike and PRNewswire report CATL-line success above 99% for plug-in or wire-handling tasks.
            - Uptime, sample size, and intervention rates are still undisclosed.
        - label: Strategic partner expansion
          actor: JD Group / JD MALL
          stage: Multi-year channel buildout
          touchpoints:
            - The 2026-2029 JD cooperation adds retail-service scenarios beyond production lines.
            - Public sources name coffee preparation first, but not scaled paid rollout.
        - label: Commercial-service roadmap
          actor: Supermarkets, hospitality, hotels, office buildings
          stage: Moz2 target venues
          touchpoints:
            - Spirit AI names these venues as next-step service markets.
            - No retained source names a live customer in this group yet.
        - label: Durability proof gap
          actor: Future enterprise buyers
          stage: Retention and expansion test
          touchpoints:
            - Public sources do not disclose customer count, contract length, renewals, or NRR.
            - Underwriting repeatability still requires direct customer diligence.
        - label: Household ambition
          actor: Consumers
          stage: Long-dated aspiration
          touchpoints:
            - Household ownership remains part of the mission narrative.
            - Independent coverage says home deployment is still at least eight years away.
    approximationNotes: >-
      Stages represent sequence in the public evidence, not measured conversion rates or
      customer-volume shares.
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU010
      - CU012
      - CU014
callouts:
  - calloutType: strength
    title: Named deployments exist, not just logos
    body: >-
      CATL and JD-related workflows give Spirit AI more customer proof than many early
      embodied-AI peers, because the public record names tasks, settings, and at least one
      measurable production outcome.
    claimRefs:
      - CU002
      - CU003
      - CU007
      - CU008
  - calloutType: risk
    title: Durability and concentration remain unproven
    body: >-
      Public evidence still does not show customer count, contract renewals, or revenue mix,
      and the named proof set remains concentrated around CATL and JD-linked surfaces.
    claimRefs:
      - CU011
      - CU012
      - CU013
