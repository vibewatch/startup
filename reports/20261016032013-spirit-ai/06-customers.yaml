company:
  name: Spirit AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Spirit AI's public customer proof is strongest in structured enterprise settings, with
    named deployment evidence centered on CATL battery-line work and JD-linked production
    and retail scenarios. The evidence base is stronger than a logo slide, but durability,
    concentration, and repeat-order economics remain under-disclosed.
sections:
  - id: customer-footprint-and-buyer-segments
    title: Customer footprint and buyer segments
    body: >-
      The retained sources point to an enterprise-first customer map rather than a broad
      consumer rollout. Independent coverage repeatedly says Spirit AI expects industrial
      applications to come first, with simpler commercial-service work following and
      household deployment much later, while the company still frames household ownership as
      a long-run mission rather than a current revenue base. Publicly named use cases split
      into three buckets: structured manufacturing tasks on customer production lines,
      JD-linked retail/service workflows, and a forward pipeline for commercial venues such
      as supermarkets, hospitality sites, hotels, and office buildings. That makes the
      current buyer/user/payer profile primarily enterprise operations teams and channel
      partners, not households, and it means consumer demand remains thesis narrative rather
      than evidenced adoption.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU010
      - CU014
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: named-adoption-proof
    title: Named adoption proof
    body: >-
      Spirit AI's best public customer proof is concentrated but concrete. Baidu Baike says
      Spirit AI's Xiao Mo robot is on a CATL battery PACK production line and reports
      industrial performance outcomes, while Reuters-syndicated coverage says tens of Moz1
      robots are already deployed on production lines at CATL and JD.com. Baike also says
      Spirit AI and JD Group signed a 2026-2029 strategic cooperation agreement and that JD
      MALL scenarios include remotely supported coffee preparation and future retail
      extensions. This is better evidence than a logo wall because the public record names
      customers, workflows, and some outcome metrics, but it still leaves open whether the
      JD retail activity is a pilot or scaled production deployment and how much of the
      reported fleet or order volume sits with each named account.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU007
      - CU008
      - CU013
    tableRefs:
      - TU002
      - TU003
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The largest gap in the customer chapter is durability. Baidu Baike says
      commercialization began in the fourth quarter of 2025 with order sizes at the tens of
      millions of yuan level, but none of the retained sources disclose customer count,
      contract duration, renewal behavior, cohort retention, or pilot-to-production
      conversion rates. Independent commentary also limits how far the current customer proof
      can be stretched: Humanoids Daily notes that Spirit AI's reported 90% success rate is
      for simple tasks in structured living-room environments without disclosed trial counts
      or intervention rules, and Reuters-syndicated coverage says homes are still at least
      eight years away. Because disclosed customer proof clusters around CATL and JD-related
      surfaces, expansion looks plausible but concentration and channel dependence remain live
      underwriting risks until management provides account mix, utilization, and renewal
      evidence.
    claimRefs:
      - CU006
      - CU009
      - CU010
      - CU011
      - CU012
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Industrial battery manufacturing
        - "Buyer/payer: CATL operations; user: line operators"
        - Battery connector plugging and flexible handling on battery PACK lines
        - Named production-line deployment; CATL is the clearest public customer proof
        - Strongest public path to recurring enterprise spend and data feedback
        - No disclosed contract value, fleet size at CATL, uptime, or renewal data
      - - JD.com production operations
        - "Buyer/payer: JD.com operations; user: production-line teams"
        - Production-line tasks in structured operating environments
        - Reuters-syndicated coverage says tens of Moz1 robots are deployed across CATL and JD.com lines
        - Investor-customer overlap could speed rollout inside JD surfaces
        - No split by customer, task mix, utilization, or commercial terms
      - - JD retail / JD MALL
        - "Buyer/payer: JD Group or site operator; user: store staff and remote operators"
        - Coffee preparation and other retail-service workflows
        - 2026-2029 cooperation agreement names JD MALL integration
        - Provides a channel from industrial proof into consumer-facing venues
        - Public sources do not show site count, production status, or repeat orders
      - - Commercial-service venues
        - "Buyer/payer: supermarkets, hospitality groups, hotels, office operators"
        - Moz2-led service automation
        - Named venue types are public, but no retained source names a live customer
        - Could widen Spirit AI beyond factory cells if deployments convert
        - No named customer, deployment volume, or outcome data
      - - Household consumers
        - "Buyer/user/payer: households"
        - Long-term domestic assistance
        - Mission-level aspiration rather than live customer proof
        - Expands theoretical TAM and brand narrative
        - No consumer adoption, pricing, or retention evidence
    notes: >-
      Combines public deployment proof, channel disclosures, and roadmap statements; null
      customer metrics remain undisclosed in the retained sources.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU007
      - CU010
      - CU014
