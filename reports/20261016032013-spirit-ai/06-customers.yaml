      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - CATL battery PACK line
        - Industrial manufacturing
        - Xiao Mo battery-connector plugging and related production-line work
        - Production
        - Baike says the line entered large-scale application and PRNewswire reports 99%+ success on flexible wire-harness handling
        - Customer-specific fleet size, contract value, uptime, and renewal are undisclosed
      - - JD.com production lines
        - Industrial / logistics operations
        - Moz1 wheeled humanoids on JD.com production lines
        - Production deployment claimed
        - Reuters-syndicated coverage says tens of Moz1 robots are deployed across CATL and JD.com production lines
        - No split by customer, task count, or economics
      - - JD MALL retail scenario
        - Commercial service / channel partner
        - Remote coffee preparation and future retail-service workflows
        - Pilot or staged rollout
        - Baike says Moz robots will be integrated into JD MALL retail scenarios under the strategic cooperation
        - No public proof of paid rollout, repeat orders, or number of sites
    notes: >-
      Partial enumeration of publicly named deployment surfaces; it is not an exhaustive list
      of Spirit AI's paying customers or active pilots.
    enumerationScope:
      coverage: partial
      basis: Publicly named deployment surfaces in retained 2025-2026 sources, grouped by customer and workflow rather than exhaustive customer count.
