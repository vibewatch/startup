callouts:
  - calloutType: strength
    title: Multi-product owner-finance thesis
    body: "Flex has a differentiated positioning around the combined business and personal financial life of middle-market owners, with reported average usage of four or more products."
    claimRefs: [CO003, CO011]
  - calloutType: risk
    title: Scale is not yet independently reconciled
    body: "The strongest scale figures are company-reported or media-attributed, while audited revenue, customer concentration, credit performance, debt terms, and board governance remain unavailable."
    claimRefs: [CO010, CO013]
  - calloutType: recommendation
    title: Verify financing and operating disclosures
    body: "Before relying on the reported unicorn valuation or payment-volume growth, obtain primary financing documents, audited financials, debt availability, and customer-level cohort evidence."
    claimRefs: [CO009, CO010]
