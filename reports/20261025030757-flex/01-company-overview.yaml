company:
  name: Flex
chapter:
  number: 1
  title: Company Overview
  summary: Flex is reported as a San Francisco-based fintech positioning an AI-native private bank around high-net-worth middle-market business owners. The current evidence supports a rapidly expanding multi-product platform and a July 2026 $70 million Series B1, while legal headquarters, customer concentration, board structure, audited profitability, and the precise boundary between company claims and independently verified scale remain open.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: Flex is described across the assigned evidence as an AI-native private-banking platform for high-net-worth middle-market business owners, combining business finance, personal finance, payments, private credit, treasury, and ERP or back-office functions. FinTech Global reports that the company was founded in 2023 and targets owners of businesses generating $3 million to $100 million in revenue, while other coverage describes its debut as 2022 as Flexbase. That discrepancy should remain visible rather than being silently normalized. The product thesis is to treat the owner and the operating company as one financial relationship; the platform's stated product depth includes a business card, banking, expense management, bill pay, working capital, personal finance, and AI-supported finance operations. The evidence supports a clear positioning statement, but not a complete legal-entity history, licensing map, or independently audited description of the operating model.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: "The assigned sources consistently identify Zaid Rahman as Flex founder and CEO and quote him describing the target customer as a middle-market business owner whose personal and business finances are intertwined. Investor and media coverage identifies Halo Fund co-founders Ryan Smith and Ryan Sweeney as leading the latest round, with Portage, Wellington, Crosslink Capital, 53 Stations, Titanium Ventures, Spice, and Florida Funders participating. This establishes visible operating leadership and a recognizable investor group, but it does not establish a complete executive roster, independent directors, voting control, preference stack, or succession plan. Key-person dependence is therefore material: the public record centers the company narrative and product thesis on Rahman, while the current pool does not provide a board filing or formal governance source."
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-and-scale
    title: Funding, valuation, and operating scale
    body: "The strongest current evidence supports a July 2026 $70 million Series B1 led by Halo Fund, following a $60 million Series B in December 2025. Multiple sources report $180 million of cumulative equity and $300 million of debt, and coverage places the company at roughly a $1.2 billion valuation, with the valuation attribution in some accounts explicitly coming from a person familiar with the deal rather than a company disclosure. Scale indicators are directionally strong but largely company-reported: annualized payment volume exceeded $10 billion, annualized revenue was described as nine figures, average product usage was four or more products, and headcount was 110 with a plan to exceed 200 by year-end 2026. A few-thousand customer count appears in one report, while exact active customers, retention, gross margin, credit losses, and cash available after debt are not disclosed in this pool."
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-open-diligence
    title: Milestones and unresolved diligence
    body: The milestone record shows a transition from an early construction-focused or Flexbase identity into a broader private-bank thesis, followed by the December 2025 Series B and Flex Elite launch, then the July 2026 Series B1, Flex Global launch, UK expansion, and planned workforce growth. Flex Global is described as supporting stablecoin-enabled cross-border payments in minutes, multi-currency accounts across 32 currencies and 76 countries, and wallets or rails in more than 100 countries. These are meaningful strategic milestones, but the current sources are predominantly media or syndicated announcement coverage and do not provide independent operational reconciliation, regulatory permissions, or customer-level proof. The adverse search in the assigned pool returned no URLs, so no adverse incident is established; that is not evidence that no lawsuit, outage, enforcement action, or compliance issue exists. Priority diligence is to obtain audited financials, debt terms and liquidity, customer concentration and retention, board and ownership records, regulatory status by jurisdiction, and independent verification of payment volume and revenue.
    claimRefs: [CO015, CO016]
    figureRefs: [FO001]
