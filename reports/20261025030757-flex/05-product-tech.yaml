      - ["Pay international suppliers", "Multiple vendors and multi-day correspondent settlement", "Stablecoin rails and multi-currency accounts beneath a private-bank interface", "Settlement described as minutes across a 100+ country rail footprint", "Country-level availability and compliance controls not documented"]
      - ["Process invoices and expenses", "Manual reconciliation and bill scheduling", "AI invoice processing and expense agents with human validation described in prior reporting", "Automation intended to reduce back-office work", "Model error rates and exception handling not disclosed"]
    notes: Benefits are a mix of reported product behavior and company/media claims; no independent benchmark was available in the assigned pool.
    claimRefs: [CE002, CE006, CE007, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Card ledger and processing", "Record and authorize card activity", "Issuer processor, BIN sponsor, and network relationships", "Who owns reconciliation, processor migration, and network compliance?"]
      - ["Servicing and fulfillment", "Operate cards and resolve customer issues", "Vendors and operational teams", "What are service levels, dispute controls, and fulfillment failure rates?"]
      - ["Payments and settlement", "Move domestic and cross-border funds", "Banking partners and stablecoin rails", "What controls govern sanctions, reserves, custody, and settlement exceptions?"]
      - ["AI underwriting and finance agents", "Support credit and back-office workflows", "Business, payment, expense, and ERP data", "What human approvals, model monitoring, and override logs are required?"]
    notes: The layer map is reconstructed only from explicit public descriptions; unnamed vendors, interfaces, controls, and performance measures remain diligence items.
    claimRefs: [CE005, CE006, CE008, CE014]
figures:
