  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Independent security attestations, penetration-test summary, incident history, uptime or service-level reporting, and documented privacy and access controls.
      whyItMatters: A unified financial platform concentrates sensitive data and transaction authority, so product breadth without control evidence leaves security and reliability maturity unverified.
      diligencePath: Request current SOC or equivalent assurance reports, security questionnaire responses, incident register, uptime history, and data-flow and access-control diagrams.
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: material
      topic: dependencies-controls
      missingEvidence: Complete processor, sponsor-bank, custody, stablecoin, licensing, and jurisdiction responsibility map.
      whyItMatters: Product availability and failure responsibility may vary by country and partner, affecting compliance, continuity, and customer recourse.
      diligencePath: Obtain the current market-by-market product matrix, legal-entity and license map, partner contracts, escalation paths, and business-continuity plan.
      relatedQuestionRefs: [QE005, QE009]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: AI-agents
      missingEvidence: Production model evaluation, human-approval thresholds, exception rates, audit logs, and outcome metrics for underwriting and finance agents.
      whyItMatters: AI claims describe intended workflow coverage but do not establish safe or reliable operation in credit and payment contexts.
      diligencePath: Request model cards, validation results, drift monitoring, override samples, error taxonomy, and human-in-the-loop operating procedures.
      relatedQuestionRefs: [QE003, QE007]
    - type: stale
      severity: minor
      topic: roadmap
      missingEvidence: Current product-by-country availability and release status for roadmap items such as rewards, travel, mortgage, and personal credit.
      whyItMatters: Announced roadmap breadth can overstate what customers can actually buy and use today.
      diligencePath: Request a dated release register with GA, pilot, waitlist, and planned status by jurisdiction and customer segment.
      relatedQuestionRefs: [QE002, QE009]
