    title: Flex product architecture map
    type: stack
    summary: Flex's public product model layers financial rails, operating workflows, and AI-assisted owner services into one relationship.
    data:
      layers:
        - label: Owner experience
          detail: Single relationship intended to connect business, household, and owner workflows.
          modules: [Unified business and personal finance, Owner insights]
        - label: Financial products
          detail: Banking, cards, credit, treasury, and premium financial products.
          modules: [Cards and rewards, Banking and treasury]
        - label: Money movement and credit
          detail: Payment processing and credit products supported by platform data.
          modules: [Payments and settlement, Private credit]
        - label: Finance operations
          detail: AI-assisted expense, invoice, bill-pay, and ERP-oriented workflows.
          modules: [Expense and bill pay, ERP and back office]
        - label: External dependencies
          detail: Financial-rail, partner, and control layers required to operate the platform.
          modules: [Issuer and processor ecosystem, Compliance and risk operations]
        - label: Data and decisioning
          detail: Shared transaction and operating data used for owner insights and risk decisions.
          modules: [Unified data model, Human review and exception handling]
    approximationNotes: Layer order is an analytical presentation of public product descriptions, not a disclosed technical topology or proof of dependency ownership.
    claimRefs: [CE001, CE005, CE008, CE009, CE014]
callouts:
  - calloutType: strength
    title: Integrated owner-level proposition
    body: Flex has a differentiated product thesis in combining business, personal, credit, payments, and finance operations around one owner relationship rather than one isolated spend workflow.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Breadth increases control burden
    body: The product spans card rails, credit, banking, cross-border settlement, AI workflows, and regulated operations, while public evidence does not yet disclose the complete dependency, reliability, security, or model-control stack.
    claimRefs: [CE005, CE008, CE009, CE015]
  - calloutType: recommendation
    title: Diligence production boundaries
    body: Request a current product-by-market matrix, partner and license responsibility map, architecture and data-flow diagrams, security attestations, incident history, service levels, model controls, and credit-loss or exception metrics before underwriting technical maturity.
    claimRefs: [CE008, CE010, CE015, CE016]
