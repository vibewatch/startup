  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: customer-proof
      missingEvidence: Named customer references with segment, deployment date, production or pilot status, quantified outcome, and renewal or continued-use evidence.
      whyItMatters: Category-level logo counts do not establish active use, implementation success, or durable customer value.
      diligencePath: Request at least three referenceable customers across construction, wholesale, and multinational segments and verify contracts, usage, outcomes, and renewal status directly.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Monthly cohorts showing active accounts, GRR, NRR, churn, renewal, contract duration, and product-level usage.
      whyItMatters: Aggregate payment and revenue growth can rise through new-logo acquisition or concentration without durable retention.
      diligencePath: Obtain the last eight quarterly cohorts reconciled to revenue and payment volume, with formal definitions for active customer, churn, GRR, and NRR.
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Top-customer and channel concentration by revenue, payment volume, segment, geography, and acquisition partner.
      whyItMatters: A focused owner segment and partner-assisted distribution may expose growth to a small set of accounts or channels.
      diligencePath: Request top-10 and top-25 customer shares, partner-sourced share, geography mix, and counterparty limits for the latest twelve months.
      relatedQuestionRefs: [QU007, QU008]
      relatedTableRefs: [TU003]
