              - CO013
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The assigned sources consistently identify Zaid Rahman as Flex founder and CEO and quote him describing
              the target customer as a middle-market business owner whose personal and business finances are
              intertwined. Investor and media coverage identifies Halo Fund co-founders Ryan Smith and Ryan Sweeney as
              leading the latest round, with Portage, Wellington, Crosslink Capital, 53 Stations, Titanium Ventures,
              Spice, and Florida Funders participating. This establishes visible operating leadership and a recognizable
              investor group, but it does not establish a complete executive roster, independent directors, voting
              control, preference stack, or succession plan. Key-person dependence is therefore material: the public
              record centers the company narrative and product thesis on Rahman, while the current pool does not provide
              a board filing or formal governance source.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
