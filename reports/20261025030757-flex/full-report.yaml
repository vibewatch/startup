chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Flex is described across the assigned evidence as an AI-native private-banking platform for high-net-worth
              middle-market business owners, combining business finance, personal finance, payments, private credit,
              treasury, and ERP or back-office functions. FinTech Global reports that the company was founded in 2023
              and targets owners of businesses generating $3 million to $100 million in revenue, while other coverage
              describes its debut as 2022 as Flexbase. That discrepancy should remain visible rather than being silently
              normalized. The product thesis is to treat the owner and the operating company as one financial
              relationship; the platform's stated product depth includes a business card, banking, expense management,
              bill pay, working capital, personal finance, and AI-supported finance operations. The evidence supports a
              clear positioning statement, but not a complete legal-entity history, licensing map, or independently
              audited description of the operating model.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO009
