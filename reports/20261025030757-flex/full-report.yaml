        title: Monetization and unit economics
        blocks:
          - type: paragraph
            body: >-
              The public record identifies product mechanisms but not realized monetization. No retained source
              discloses Flex's interchange share, card or membership fees, FX spreads, transfer pricing, credit yields,
              software pricing, product-level revenue mix, gross margin, CAC, payback, loss rates, fraud rates, or
              customer concentration. Stablecoin rails may reduce parts of a cross-border payment chain, but Federal
              Reserve analysis cautions that they do not eliminate all costs, and Deloitte identifies technical
              integration as a material hurdle. Consequently, neither the more-than-$10-billion payment-volume figure
              nor the nine-figure revenue run rate establishes a defensible take rate, contribution margin, or capital
              efficiency.
