      - number: '1.3'
        title: Funding, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The strongest current evidence supports a July 2026 $70 million Series B1 led by Halo Fund, following a
              $60 million Series B in December 2025. Multiple sources report $180 million of cumulative equity and $300
              million of debt, and coverage places the company at roughly a $1.2 billion valuation, with the valuation
              attribution in some accounts explicitly coming from a person familiar with the deal rather than a company
              disclosure. Scale indicators are directionally strong but largely company-reported: annualized payment
              volume exceeded $10 billion, annualized revenue was described as nine figures, average product usage was
              four or more products, and headcount was 110 with a plan to exceed 200 by year-end 2026. A few-thousand
              customer count appears in one report, while exact active customers, retention, gross margin, credit
              losses, and cash available after debt are not disclosed in this pool.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a transition from an early construction-focused or Flexbase identity into a
              broader private-bank thesis, followed by the December 2025 Series B and Flex Elite launch, then the July
              2026 Series B1, Flex Global launch, UK expansion, and planned workforce growth. Flex Global is described
              as supporting stablecoin-enabled cross-border payments in minutes, multi-currency accounts across 32
              currencies and 76 countries, and wallets or rails in more than 100 countries. These are meaningful
              strategic milestones, but the current sources are predominantly media or syndicated announcement coverage
              and do not provide independent operational reconciliation, regulatory permissions, or customer-level
              proof. The adverse search in the assigned pool returned no URLs, so no adverse incident is established;
              that is not evidence that no lawsuit, outage, enforcement action, or compliance issue exists. Priority
              diligence is to obtain audited financials, debt terms and liquidity, customer concentration and retention,
              board and ownership records, regulatory status by jurisdiction, and independent verification of payment
              volume and revenue.
