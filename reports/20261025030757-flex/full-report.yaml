      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Flex's July 2026 Series B1 added $70 million of equity, taking company-reported cumulative equity to $180
              million alongside $300 million of debt. The same evidence says headcount was expected to rise from 110 to
              more than 200 by year-end as Flex expanded globally. Funding raised is not cash available: public sources
              do not provide cash on hand, burn, runway, debt maturities, borrowing-base availability, covenants,
              reserve requirements, or the share of debt supporting credit originations. The disclosed financing
              therefore signals access to capital, but it cannot establish liquidity adequacy or the timing and
              conditions of a next financing.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Flex has a credible public growth signal but not a publicly underwritable financial model. Revenue growth,
              payment volume, and multi-product adoption support demand and cross-sell hypotheses; none resolves whether
              the mix is high-margin, recurring, credit-intensive, or subsidized by debt and expansion spending. The
              highest-priority diligence package is a monthly revenue and gross-profit bridge by product, customer
              cohorts and concentration, card and credit loss vintages, fully loaded acquisition economics, and a
              24-month liquidity bridge tied to debt terms. Until those inputs are available, the appropriate stance is
              to separate traction from revenue quality and gross financing from runway.
            claimRefs:
