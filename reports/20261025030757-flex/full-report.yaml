  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Flex's public milestone sequence runs from an early Flexbase identity through successive financing, product, and
      international-expansion steps.
    data:
      items:
        - date: '2022'
          label: Debut reported
          details: >-
            Finovate describes Flex as making its debut in 2022 to bring private banking to high-net-worth business
            owners.
          tone: neutral
          claimRefs:
            - CO002
        - date: '2023'
          label: Founding date reported
          details: FinTech Global reports that Flex was founded in 2023 and targets businesses generating $3M-$100M.
          tone: neutral
          claimRefs:
            - CO001
