  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Flex's product is organized around the financial workflow of an owner whose business and personal finances
              are intertwined. Company materials describe a single platform spanning private credit, business finance,
              personal finance, payments, and an ERP or back-office layer, while independent coverage describes the same
              proposition as a private-bank interface rather than a single spend tool. The customer-facing wedge is the
              business credit card and associated expense or bill-pay workflow; the intended expansion is from a
              transaction relationship into banking, treasury, credit, and personal products. This breadth is a
              strategic strength because it can consolidate fragmented systems, but it also creates a demanding
              implementation surface across regulated financial products. The evidence does not establish how much of
              the experience is Flex-owned software versus partner-provided banking, processing, custody, or credit
              infrastructure. Product maturity should therefore be assessed by production scope and control ownership,
              not by the number of announced pillars.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
