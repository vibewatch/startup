      - CI002
      - CI004
      - CI005
      - CI014
      - CI015
      - CI016
  - id: FE001
    title: Flex product architecture map
    type: stack
    summary: >-
      Flex's public product model layers financial rails, operating workflows, and AI-assisted owner services into one
      relationship.
    data:
      layers:
        - label: Owner experience
          detail: Single relationship intended to connect business, household, and owner workflows.
          modules:
            - Unified business and personal finance
            - Owner insights
        - label: Financial products
          detail: Banking, cards, credit, treasury, and premium financial products.
          modules:
            - Cards and rewards
            - Banking and treasury
        - label: Money movement and credit
          detail: Payment processing and credit products supported by platform data.
          modules:
            - Payments and settlement
            - Private credit
        - label: Finance operations
          detail: AI-assisted expense, invoice, bill-pay, and ERP-oriented workflows.
          modules:
            - Expense and bill pay
            - ERP and back office
        - label: External dependencies
          detail: Financial-rail, partner, and control layers required to operate the platform.
          modules:
            - Issuer and processor ecosystem
            - Compliance and risk operations
        - label: Data and decisioning
          detail: Shared transaction and operating data used for owner insights and risk decisions.
          modules:
            - Unified data model
