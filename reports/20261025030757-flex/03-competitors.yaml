      - ["Flex business banking", "Zero monthly fees; up to 2.47% APY reported", "Account", "ACH, wires, and insured deposit access reported", "Rate vintage and realized yield Unknown", "Transparent headline terms support bundling, but current terms need primary verification"]
      - ["Flex international payments", "1% FX fee reported", "Cross-border transaction", "Multi-currency payment workflow", "Volume discounts and spread treatment Unknown", "Simple pricing can compete with opaque correspondent chains"]
      - ["Named competitors and internal build", Unknown, Unknown, "No comparable current package in assigned pool", "All pricing, discounts, and contract minima Unknown", "No supportable price ranking can be made"]
    notes: >-
      Partial comparison from a dated-but-undated-access YesPress profile; competitor prices, realized
      discounts, contract minimums, and current Flex terms require direct primary-source verification.
    claimRefs: [CP010, CP011, CP012]
figures:
