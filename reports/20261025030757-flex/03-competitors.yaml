    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal placement reflects only reviewed evidence on product breadth and owner-centric integration,
      not market share, product quality, or independently measured performance.
    data:
      xAxis:
        label: "Product breadth (1=narrow, 5=broad)"
        min: 1
        max: 5
      yAxis:
        label: "Owner-centric integration (1=low evidence, 5=high evidence)"
        min: 1
        max: 5
      points:
        - label: Flex
          x: 5
          y: 5
          note: "Broadest reviewed bundle; integration is company-positioned."
        - label: Mercury
          x: 2
          y: 2
          note: "Banking-led wedge in assigned secondary evidence."
        - label: RockFi
          x: 2
          y: 3
          note: "Stablecoin-native private-bank positioning; other scope unknown."
        - label: Brex / Ramp
          x: 2
          y: 2
          note: "Focused card, spend, or enterprise-efficiency wedges."
        - label: Legacy banks
          x: 3
          y: 1
          note: "Broad institutions, but reviewed evidence says business and personal finance stay separate."
        - label: Internal multi-vendor stack
          x: 4
          y: 1
          note: "Many capabilities can be assembled, with low native integration."
    approximationNotes: >-
      Analyst-authored ordinal scores from 1 to 5 summarize source-backed scope descriptions; they are
      not measured market data, and no distance or quadrant threshold implies a performance gap.
    claimRefs: [CP001, CP002, CP003, CP004, CP016]
