      - Flex
      - Named fintech alternatives
      - Legacy bank / status quo
      - Internal multi-vendor build
    rows:
      - ["Unified business and personal view", "Company claims yes", "Mercury, Brex, Bill, Ramp: Unknown; RockFi: private-bank positioning reported", "Typically separate in reviewed evidence", "Possible through integration; not independently benchmarked"]
      - ["Cards and working capital", "Card and private-credit products reported", "Brex: card wedge reported; others: Unknown", Unknown, "Possible through multiple providers"]
      - ["AP, expense, treasury, and ERP workflow", "Broad bundle reported", "Bill: AP wedge reported; others: Unknown", Unknown, "Possible, with integration and operating burden"]
      - ["Cross-border and stablecoin rails", "100+ countries and 32 currencies company-reported", "RockFi: stablecoin-native positioning reported; others: Unknown", "Correspondent-bank chains remain common", "Possible through bank and specialist providers"]
      - ["AI finance layer", "Beacon / agentic finance tools reported", Unknown, Unknown, "Possible to build or procure; no comparative evidence"]
    notes: >-
      This is a capability-presence matrix, not a performance benchmark. Company-reported availability
      is labeled, and every unsupported competitor cell remains Unknown.
    claimRefs: [CP002, CP003, CP004, CP006, CP007]
  - id: TP003
