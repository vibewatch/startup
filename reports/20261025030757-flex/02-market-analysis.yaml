      - ["Globally active multi-entity business", "CFO, controller or treasury lead", "Treasury, AP/AR and operations", "Business entity", "Slow, costly or opaque cross-border payment chains", "Which corridors and compliance responsibilities are in scope?"]
      - ["Card-led expanding account", "Owner or finance lead", "Employees and operations", "Business entity", "Card or float product opens a path to banking, payments and expense", "Does cross-sell improve retention and contribution margin?"]
      - ["Credit and working-capital user", "Owner, CFO or credit committee", "Finance and operations", "Business entity", "Need for private credit, float or working capital within the operating stack", "What are loss, fraud, collateral and concentration outcomes?"]
    notes: "Buyer roles and triggers are an evidence-backed operating hypothesis; the pool does not disclose pricing, budget approval rates, customer counts, or segment-level conversion."
    claimRefs: [CM011, CM012, CM013, CM019]
figures:
