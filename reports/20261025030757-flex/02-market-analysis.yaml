    title: Evidence-constrained market sizing lenses
    type: pyramid
    summary: "The layers show distinct market lenses and are not additive, nested, or a forecast of Flex revenue."
    approximationNotes: "No transformation or proportional sizing is applied; unlike owner counts, firm counts, macro shares, and payment volumes are displayed as separate evidence lenses rather than a comparable funnel."
    data:
      nodes:
        - {label: "Global high-net-worth business owners (company estimate)", value: 3000000, unit: "owners", note: "Flex estimate; not independently verified"}
        - {label: "U.S. high-net-worth business owners (company estimate)", value: 350000, unit: "owners", note: "Flex estimate; stated to drive 40% of private-sector payroll"}
        - {label: "U.S. middle-market firms (RSM definition)", value: 125000, unit: "firms", note: "RSM 2026 definition; $30m-$10bn revenue"}
        - {label: "Genuine stablecoin payments (2025)", value: 390000000000, unit: "USD annual", note: "Axis estimate; not Flex revenue"}
        - {label: "B2B genuine stablecoin payments (2025)", value: 226000000000, unit: "USD annual", note: "Axis estimate; 57.9% of genuine payments"}
        - {label: "Global payment penetration of stablecoins", value: 0.02, unit: "%", note: "Axis estimate; context for adoption runway"}
      xAxis: "Distinct source-defined lenses"
      yAxis: "Values shown in original units"
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
callouts:
  - calloutType: insight
    title: Large need, bounded proof
    body: "Flex has a credible problem thesis around fragmented owner finance and cross-border friction, but the retained evidence supports a strategic market narrative rather than a reconciled SAM/SOM or market-share claim."
    claimRefs: [CM001, CM005, CM008, CM019]
  - calloutType: risk
    title: Stablecoin adoption is not yet market penetration
    body: "The Federal Reserve documents structural cross-border frictions, while Axis reports genuine stablecoin payments at only 0.02% of global payment volumes; regulatory implementation and customer conversion remain valuation-critical uncertainties."
    claimRefs: [CM014, CM015, CM016, CM017]
