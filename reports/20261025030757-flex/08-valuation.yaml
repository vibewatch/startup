      - [Valuation stance, "Reported private mark is supported by momentum but lacks a reliable public multiple", "Stretched", "Set an entry discount or wait for evidence"]
      - [Decision implication, "Growth can justify monitoring, not price-insensitive entry", "Conditional participation", "Revisit after cap-table and unit-economics review"]
    notes: "Public-source synthesis; the $1.2B valuation is a reported private financing mark and no audited multiple is calculated."
    claimRefs: [CV001, CV004, CV005, CV011]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Unified owner-finance platform can compound products", "Flex reports average usage of four or more products", "Cohort retention and gross profit by product fail to improve"]
      - ["Financing momentum validates investor demand", "$60M Series B followed by $70M Series B1", "A down round, punitive preferences, or weak investor participation emerges"]
      - ["Global rails can widen the moat", "Flex Global reports 100+ countries and 32 currencies", "Licensing, settlement, fraud, or partner-bank constraints limit activation"]
      - ["Credit can differentiate the platform", "Company describes AI-assisted underwriting and private credit", "Net charge-offs, fraud losses, or funding costs exceed contribution profit"]
      - ["The market may reward category creation", "Independent coverage reports a $1.2B mark and nine-figure annualized revenue", "Revenue quality, recurring share, or margin cannot be verified"]
    notes: "Arguments combine company claims with independent reporting; none establishes audited profitability or a directly comparable valuation multiple."
    claimRefs: [CV002, CV006, CV007, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Key risk or trigger]
    rows:
      - [Bull, "Payment volume and annualized revenue continue strong growth; four-plus-product usage compounds; global launch scales", "Potential support for or above the $1.2B mark; no precise target is supportable from public data", "Low-to-medium", "International losses or compliance costs stay contained"]
      - [Base, "Growth moderates; Flex proves revenue quality, credit performance and partner controls", "The $1.2B mark is fair only if verified revenue and margin support it", "Medium", "Diligence confirms durable contribution economics"]
      - [Bear, "Volume grows without margin; credit losses, regulatory friction or dilution rise", "Multiple compression and down-round risk; downside range cannot be quantified publicly", "Medium", "Material down round, rising charge-offs or stalled launch"]
      - [Entry discipline, "Wait for cap table, preferences, cash, debt and cohort economics", "Require a negotiated discount to the last mark or stronger protections", "High importance", "Missing primary evidence remains a blocker"]
    notes: "Scenario logic is qualitative because public sources do not disclose an auditable revenue denominator, margin, cash balance, or preference stack."
    claimRefs: [CV001, CV005, CV011, CV014]
