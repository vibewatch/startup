  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: A primary corporate chronology reconciling the 2022 Flexbase debut with the 2023 founding date.
    whyItMatters: Founding chronology affects age, growth-period comparisons, and interpretation of financing velocity.
    diligencePath: Request incorporation, rebrand, and financing chronology from management and counsel.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting control, shareholder preferences, and debt-holder rights.
    whyItMatters: Governance and capital-stack terms determine control, downside protection, and key-person risk.
    diligencePath: Obtain the current cap table, charter, investor-rights agreements, board roster, and debt documents under NDA.
    relatedQuestionRefs:
      - QO002
      - QO003
