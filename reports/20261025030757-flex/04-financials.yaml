      - [Payments and Flex Global, "Domestic and cross-border payment activity, including stablecoin rails", "More than $10B annualized total payment volume", "TPV is not revenue; take rate and corridor mix unavailable", "Reconcile TPV to net revenue by product, geography, and corridor"]
      - [Private credit, "Credit products embedded in the broader platform", "No separate origination or balance metric disclosed", "Yield, funding, reserve, default, and recovery economics unavailable", "Provide originations, balances, APR or yield, funding cost, reserves, and loss vintages"]
      - [Business finance, "Banking, treasury, expense, bill-pay, and finance workflows", "Included in the five-pillar platform", "Revenue mix and realized pricing unavailable", "Provide contracts, price books, revenue recognition, retention, and gross profit by product"]
      - [Personal finance, "Consumer card, membership, and planned personal-finance products", "Product availability described; subscriber economics unavailable", "Recurring versus transaction revenue is not established", "Provide active users, price, conversion, churn, interchange, and servicing cost"]
      - [ERP and finance agents, "Back-office software and AI-supported finance workflows", "Embedded in the platform; separate monetization not disclosed", "Software attach rate, compute cost, and labor leverage unavailable", "Provide attach rate, pricing, usage, compute cost, and incremental margin"]
    notes: "Company announcements and third-party coverage accessed 2026-10-25 describe mechanisms and aggregate scale; they do not disclose a revenue mix, and TPV must not be treated as revenue."
    claimRefs: [CI002, CI004, CI005, CI006, CI007, CI008, CI009, CI016]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Product or rail, Published term, Realized pricing, Financial implication, Diligence ask]
    rows:
      - [Business credit card, "60-day float", "Fees, interchange share, APR, rewards cost, and realized yield undisclosed", "Adoption does not establish positive risk-adjusted margin", "Obtain card agreements, funding economics, interchange, rewards, fraud, and loss data"]
      - [Flex Global payments, "Settlement in minutes and rails in 100+ countries", "Transfer fee, FX spread, partner fees, and take rate undisclosed", "Coverage and speed do not establish monetization", "Obtain corridor-level pricing, partner costs, settlement costs, and net revenue"]
      - [Multi-currency accounts, "Accounts across 76 countries supporting 32 currencies", "Account, conversion, and balance economics undisclosed", "Account breadth may raise compliance and service costs", "Obtain fee schedules, balances, FX economics, compliance cost, and country profitability"]
      - [Private credit, "Part of the platform's five-pillar model", "Rates, utilization, funding cost, reserve policy, and realized yield undisclosed", "Credit revenue cannot be separated from credit risk", "Obtain term sheets, vintage losses, recoveries, reserves, and contribution margin"]
      - [Personal finance and AI tools, "Membership, card, and finance-agent products", "Membership and software pricing undisclosed", "Potential recurring revenue and operating leverage remain hypotheses", "Provide price, activation, retention, attach rate, compute cost, and product gross margin"]
    notes: "The retained sources do not publish a complete price list or realized pricing. Undisclosed cells are evidence gaps, not zero values."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI014, CI015, CI016]
  - id: TI003
    title: Unit economics and capital-adequacy inputs
    columns: [Metric, Public value, Confidence, Underwriting meaning, Diligence ask]
    rows:
      - [Annualized revenue growth, "3x since December 2025", "Medium; company-claimed", "Signals acceleration but not retention, mix, or profitability", "Reconcile monthly GAAP revenue by product and cohort"]
      - [Annualized revenue run rate, "Nine figures", "Medium; company-claimed and independently repeated", "Scale indicator without an exact amount or accounting bridge", "Provide exact run rate, period revenue, recognition policy, and audit support"]
      - [Annualized payment volume, "More than $10B; roughly 4x year over year", "Medium; company-claimed and independently repeated", "Activity measure, not revenue or cash generation", "Provide product-level volume, take rate, net revenue, and concentration"]
      - [Products per customer, "Four or more on average", "Medium; company-claimed", "Supports cross-sell but not cohort profitability", "Provide distribution, attach sequence, retention, and contribution by cohort"]
      - [Gross margin and contribution margin, null, "Unavailable", "Required to test scalability across payments, credit, and services", "Provide GAAP gross profit and product-level contribution bridges"]
      - [CAC and payback, null, "Unavailable", "Required to test sales efficiency after fully loaded acquisition cost", "Provide CAC by channel, sales cycle, activation, payback, and retention"]
      - [Credit and fraud losses, null, "Unavailable", "Core risk-adjusted economics for cards and private credit", "Provide loss vintages, fraud rates, reserves, recoveries, and stress cases"]
      - ["Cash, burn, runway, and debt terms", null, "Unavailable", "Determines financing dependency and next-round timing", "Provide a 24-month liquidity bridge, debt schedule, covenants, maturities, and borrowing base"]
    notes: "Public values are reported by Flex or repeated from company statements; null means not disclosed in the assigned evidence and must not be read as zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI010, CI011, CI012, CI013, CI016]
