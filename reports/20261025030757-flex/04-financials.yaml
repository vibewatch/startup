    title: Disclosure boundary in the revenue-to-gross-profit bridge
    type: flow
    summary: Public evidence connects product use to aggregate payment volume and revenue run-rate claims, but not to realized pricing, gross profit, or cash conversion.
    data:
      nodes:
        - id: owner-workflows
          label: "Owner financial workflows"
          detail: "Business and personal finance needs; customer count and concentration are undisclosed"
        - id: product-adoption
          label: "Multi-product adoption"
          detail: "Customers use four or more products on average, according to Flex"
        - id: payment-and-credit-activity
          label: "Payment and credit activity"
          detail: "More than $10B annualized TPV; private-credit activity is not separately quantified"
        - id: realized-pricing
          label: "Realized pricing"
          detail: "Take rates, fees, spreads, yields, and discounts are not publicly disclosed"
        - id: annualized-revenue
          label: "Annualized revenue"
          detail: "Nine-figure run rate and 3x growth since December 2025, according to Flex"
        - id: direct-costs
          label: "Direct costs and losses"
          detail: "Funding, processing, compliance, integration, credit-loss, and fraud costs are not quantified"
        - id: gross-profit-and-cash
          label: "Gross profit and cash conversion"
          detail: "Gross margin, operating cash flow, burn, and runway are not publicly disclosed"
    approximationNotes: "The ordered flow shows disclosure boundaries only; it does not infer conversion rates, take rates, or a reconciled financial waterfall."
    claimRefs: [CI001, CI002, CI004, CI005, CI014, CI015, CI016]
callouts:
  - calloutType: insight
    title: Scale evidence is not revenue-quality evidence
    body: Flex's revenue run rate, payment volume, and product-adoption disclosures support a growth thesis, but they do not establish recurring revenue, realized pricing, gross margin, or cash conversion.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI016]
  - calloutType: risk
    title: Debt and credit performance require a joined-up review
    body: Reported debt of $300 million sits beside private-credit and card products, yet public evidence does not show debt terms, reserve mechanics, credit losses, fraud losses, or the share of financing available for operations.
    claimRefs: [CI006, CI007, CI012, CI016]
