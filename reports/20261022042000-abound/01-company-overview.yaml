callouts:
  - calloutType: strength
    title: Evidence-backed operating traction
    body: "The assigned evidence supports a scaled lending platform with reported 2024 revenue, profit before tax, substantial originations and multiple financing relationships."
    claimRefs: [CO009, CO012, CO016]
  - calloutType: risk
    title: Capital structure remains opaque
    body: "Debt, equity and lending-capacity figures are repeatedly reported together, but the assigned evidence does not disclose valuation, dilution, facility pricing, covenants or cohort credit performance."
    claimRefs: [CO009, CO010, CO011, CO015]
  - calloutType: recommendation
    title: Request private operating and governance evidence
    body: "Before underwriting valuation, request the cap table, debt schedules, board materials, cohort loss curves, provisions, current headcount and Render partner economics."
    claimRefs: [CO015, CO016]

