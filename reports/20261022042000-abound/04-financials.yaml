    title: Abound revenue model bridge
    type: flow
    summary: Customer affordability data supports direct lending and a separate lender-platform motion, while financing capacity funds loan originations.
    data:
      nodes:
        - {id: customer-data, label: "Bank transaction and affordability data"}
        - {id: underwriting, label: "Render underwriting and risk decision"}
        - {id: direct-loans, label: "Direct consumer loan originations"}
        - {id: partner-platform, label: "Render platform for partner lenders"}
