        - {source: underwriting, target: partner-platform}
        - {source: financing, target: direct-loans}
        - {source: direct-loans, target: revenue}
        - {source: partner-platform, target: revenue}
    claimRefs: [CI002, CI010, CI013, CI014, CI016]
callouts:
  - calloutType: strength
    title: Reported profitability at meaningful lending scale
    body: "Independent coverage reports £66.8m of revenue and £7.5m of net profit for the twelve months to February, alongside more than £900m of cumulative loans in one account."
    claimRefs: [CI003, CI006]
  - calloutType: risk
    title: Financing capacity is not cash available
    body: "The reported £2.2bn lending capacity and more than £1.6bn of debt funding do not reveal drawn balances, facility terms, covenants, reserves, or the equity buffer supporting credit risk."
    claimRefs: [CI007, CI013, CI014]
  - calloutType: recommendation
    title: Underwrite the loan book before extrapolating margins
    body: "The next diligence step is a vintage-level loan-book and funding schedule that separates direct lending economics from Render platform economics."
    claimRefs: [CI014, CI016]
