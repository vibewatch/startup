          note: Named clients reported; client count and revenue undisclosed
        - id: software-gap
          label: Render market denominator
          value: undisclosed
          note: No public lender count, revenue, or retention denominator
    approximationNotes: >-
      This is an ordered evidence display, not a proportional market-share chart:
      the layers mix a people estimate, cumulative loan volume, and named software
      clients, so no conversion rate or comparable denominator is implied.
    claimRefs: [CM002, CM005, CM008, CM017]
