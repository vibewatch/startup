        - id: potential-demand
          label: UK people struggling to borrow
          value: "over 15 million people"
          note: Company-cited estimate; no spend conversion
        - id: observed-volume-2024
          label: Cumulative lending reported in 2024
          value: "over £300m"
          note: Company announcement; cumulative volume at announcement date
        - id: observed-volume-2025a
          label: Cumulative lending reported in July 2025
          value: "£900m"
          note: Investor report; cumulative volume since founding
        - id: observed-volume-2025b
