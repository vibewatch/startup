      - [Credit-decisioning software, Lender-paid use of Render for affordability and credit decisions, General banking software and unrelated analytics, Lender / lender risk or technology budget, Adjacent software market]
      - [Underserved borrower demand, Borrowers needing unexpected-cost or debt-consolidation credit, All UK adults and all consumer finance, Borrower / lender underwriting function, Demand pool rather than spend]
      - [Status quo substitute, Traditional credit-score-led underwriting and incumbent lender processes, Open-banking decisioning itself, High-street lender / credit budget, Main adoption alternative]
    notes: >-
      Boundary synthesized from the cited company and independent descriptions;
      borrower population, lending volume, and software fees are not interchangeable
      units and are not summed.
    claimRefs: [CM001, CM002, CM003, CM004]
  - id: TM002
    title: Sizing lenses supported by the assigned evidence
    columns: [Lens, Publisher / year, Geography, Value, Methodology, Confidence, Limitation]
    rows:
      - [Potential borrower population, Abound / 2024, UK, "over 15 million people", Company estimate cited in funding announcement, medium, No annual spend or eligibility conversion]
      - [Cumulative lending milestone, Abound / 2024, UK, "over £300m issued", Company announcement, medium, Cumulative at announcement date; not market size]
      - [Cumulative lending milestone, Salica Investments / 2025, UK, "£900 million in loans", Investor report of company results, medium, Cumulative since founding; issuer relationship]
      - [Cumulative lending milestone, Financial IT / 2025, UK, "£1 billion in total lending volume", Syndicated company milestone, medium, Cumulative volume; denominator and period differ from revenue]
      - [Credit-decisioning software opportunity, Financial IT / 2025, Europe / international expansion, "Render clients include GAIA Family and LemFi", Industry report, low, "Client count, revenue, retention, and market denominator undisclosed"]
    notes: >-
      Values retain each source's original unit and period. The rows are separate
      lenses, not a single funnel; no SAM or SOM is inferred from them.
    claimRefs: [CM005, CM006, CM007, CM008, CM016, CM017]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [UK borrower with thin or misleading credit file, Abound underwriting, Borrower, Borrower, Affordability assessment and loan application, Consumer lending budget, Need for fairly priced credit]
      - [Borrower consolidating higher-cost debt, Abound underwriting, Borrower, Borrower, Debt-consolidation loan decision, Consumer lending budget, Potential interest-cost reduction]
      - [Direct-lending business, "Abound lending and operations", "Credit and operations teams", "Borrowers provide interest income", "Origination, servicing and funding", "Lending and treasury leadership", "Scalable loan demand plus funding"]
      - [Bank or lender adding decisioning capability, "Lender credit/product team", "Underwriters and product managers", Lender, "Render integration and model use", "Risk, technology, or product leadership", "Need to augment legacy credit decisions"]
      - [European or international lender entering open-banking decisioning, Lender credit/product team, Underwriters and borrowers, Lender, New-market lending-product launch, Executive growth and risk budget, Local open-banking adoption and partner integration]
    notes: >-
      Buyer roles are an evidence-based operating map, not a disclosed customer
      segmentation dataset; Render budget ownership and procurement terms remain
      unreported.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
