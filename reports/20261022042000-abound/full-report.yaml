        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The public record supports a directional comparison, not a controlled benchmark. Abound's cited capability
              is transaction-level affordability assessment, while Render extends that approach to lenders seeking to
              improve decisioning or launch lending products. Reported consumer packaging changed between 2023 and 2025:
              older coverage described a smaller maximum principal and shorter maximum term, while later sources
              described a broader range. Those list terms are not realized yield, funding cost, or proof of a lower
              price than competitors. Reported Render clients and institutional financing broaden distribution and
              funding access, but the pool contains no contract pricing, deployment time, renewal, concentration, or
              multi-homing data. Accordingly, unknown comparison cells remain explicit rather than being converted into
              rankings.
