              - CI008
              - CI011
              - CI014
              - CI016
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Abound's capital story is substantial but structurally opaque. Public company material cites £2.2 billion
              of lending capacity secured from Citi, Deutsche Bank, Waterfall and others, while public reporting
              describes more than £1.6 billion of debt funding and a 2025 Deutsche Bank facility of up to £250 million.
              Earlier coverage described a £500 million debt-and-equity financing package and noted that Abound declined
              to disclose the equity/debt breakdown. These are financing-capacity and financing-commitment figures, not
              cash available to the company, and they do not establish facility pricing, covenants, borrowing-base
              tests, advance rates, maturity walls, reserve requirements, or the amount of equity supporting operating
              losses and credit risk. The decisive underwriting requests are therefore loan-level performance by
              vintage, arrears and default curves, loss given default, provisioning policy, funding cost, liquidity
              buffers, and the precise economics of Render partners.
            claimRefs:
              - CI004
              - CI007
              - CI009
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI010
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported profitability at meaningful lending scale
            body: >-
              Independent coverage reports £66.8m of revenue and £7.5m of net profit for the twelve months to February,
              alongside more than £900m of cumulative loans in one account.
            calloutType: strength
            claimRefs:
              - CI003
              - CI006
          - type: callout
            title: Financing capacity is not cash available
            body: >-
              The reported £2.2bn lending capacity and more than £1.6bn of debt funding do not reveal drawn balances,
              facility terms, covenants, reserves, or the equity buffer supporting credit risk.
            calloutType: risk
            claimRefs:
