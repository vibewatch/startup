  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “AI” in the abstract. It is UK consumer credit where a lender must decide
              affordability, price an unsecured personal loan, and fund the resulting receivable; a second, adjacent
              market is credit-decisioning software sold to lenders. Abound's own description separates these motions:
              it lends directly to consumers and offers Render to B2B clients. The included spend is interest-bearing
              unsecured personal lending and, separately, lender-paid decisioning software fees. Excluded from this
              chapter's core market are mortgages, deposit-taking, broad banking software, and all consumer borrowing
              that does not use an affordability or credit-decisioning workflow. The status quo is high-street lending
              built around traditional credit scores; the evidence describes Abound's alternative as analysing
              bank-transaction data to estimate what a borrower can afford. This boundary matters because loan-book
              growth and software adoption have different buyers, funding needs, and valuation comparables.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available sources support several sizing lenses, but they should not be collapsed into one headline
              TAM. The strongest population lens is the company statement that more than 15 million people in the UK
              struggle to borrow for unexpected costs; this is a potential borrower population, not annual loan spend.
              The operating lens is actual lending volume: sources report more than £300m issued by May 2024, £900m
              since founding by July 2025, and more than £1bn by October 2025. Those figures indicate adoption and
              throughput, but they are cumulative or point-in-time measures rather than a market total. The software
              lens is qualitatively established by Render clients including GAIA Family and LemFi, while revenue,
              retention, and addressable lender count remain undisclosed. A defensible underwriting view therefore uses
              the population and operating lenses as bounds on demand evidence, while treating external market size,
              SAM, and SOM as unresolved.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
              - CM017
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
              - CM017
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM017
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              On the direct-lending side, the user and payer are the same UK borrower, while the budget owner is the
              lender's underwriting and funding organization. The trigger is a need for an affordable personal loan,
              especially for a borrower with a thin or misleading credit file or a debt-consolidation need. On the
              Render side, the user is a lender's credit or product team, the payer is the lender, and the budget owner
              is a risk, lending, or technology executive deciding whether to replace or augment existing decisioning.
              The adoption case is strongest when transaction data can improve affordability assessment and reduce
              manual or legacy-process friction. Constraints are equally material: lender funding capacity,
              responsible-lending and data-consent obligations, integration and model-validation work, incumbent process
              inertia, and limited public evidence on default cohorts, Render economics, and partner retention.
              Financing announcements also show that debt and equity are both part of scaling the loan book, so demand
              alone does not determine growth.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Sizing and adoption gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence is sufficient to establish a real UK lending problem and visible commercial traction, but
              insufficient to calculate investable market share. The largest unresolved issue is denominator quality:
              “people who struggle to borrow,” customers served, cumulative lending, annual revenue, and Render clients
              are different populations and periods. A future diligence pass should obtain UK unsecured personal-loan
              origination and outstanding-balance data by borrower segment, Abound's annual originations and active
              borrower counts, and Render revenue, pipeline, retention, and lender-level deployment metrics. It should
              also test whether the reported lower-default or savings outcomes persist by cohort and whether regulatory
              or consent requirements slow deployment.
            claimRefs:
              - CM017
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real, but the denominator is not yet investable
            body: >-
              Abound has credible evidence of borrower demand and growing lending volume, but the public record does not
              reconcile potential borrowers, cumulative originations, and software opportunity into a comparable
              TAM/SAM/SOM. Treat market size as an evidence gap rather than a valuation input.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM017
          - type: callout
            title: Funding and model proof constrain adoption speed
            body: >-
              Direct lending scales with debt and equity capacity, while Render scales with lender integrations and
              proof of risk performance. Both paths face public-data gaps on cohorts, economics, and retention.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and customer job
        blocks:
          - type: paragraph
            body: >-
              Abound addresses two related jobs: making unsecured personal-loan decisions for consumers whose
              conventional credit files may not reflect current affordability, and supplying decisioning technology to
              lenders. Independent reporting describes its direct offer as using bank transactions and machine learning
              rather than relying on credit scores alone. The direct competitive set includes high-street banks and
              digital lenders such as Lendable and Zopa. Open-banking providers including Tink and Finicity are adjacent
              because they supply data connectivity rather than the cited direct loan product. A lender's internal
              underwriting build is also a substitute. This is not a single product market: consumer distribution,
              balance-sheet funding, credit performance, data connectivity, and lender implementation capability
              determine which alternative is relevant to each buyer.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
