chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Abound was founded in 2020 by Gerald Chappell and Dr Michelle He and is headquartered in London. Tracxn
              describes it as a Series B provider of personal loans with flexible repayment options and holistic
              assessment, while independent coverage describes two linked businesses: direct consumer lending and
              Render, an AI credit-technology platform supplied to other lenders in Europe. The operating model uses
              open-banking transaction data to assess income, spending and existing commitments rather than relying only
              on conventional credit scores. Abound's own investor page positions the platform as FCA regulated and says
              it has processed more than 3bn transaction datapoints, but those are company claims rather than
              independently audited operating metrics.
