      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The defensibility thesis combines accumulated transaction and repayment data, underwriting models, funding
              relationships, and the operational effort required to change incumbent lending processes. A 2023 interview
              relayed management's estimate that banks could need five years or more to change those processes, but that
              is a company claim rather than an independent implementation benchmark. More importantly, the reported
              default advantage shifts from 70% below a UK industry average in 2023 to 75% below an undefined industry
              standard in later coverage. Different vintages or denominators may explain the change, yet none is
              disclosed. Other lenders can access open-banking rails, acquire specialist infrastructure, or build
              internally. Durability therefore depends on cohort-level risk results, partner retention, integration
              burden, and funding economics that remain private.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broader proposition than direct lending alone
            body: >-
              Render extends Abound's transaction-data underwriting into a lender-facing product, creating a second
              route to market beyond its own loan book.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP010
          - type: callout
            title: Benchmark remains unproven
            body: >-
              The changing default-advantage claims lack common cohorts, periods, and denominators, so they do not prove
              durable outperformance against named peers.
            calloutType: risk
            claimRefs:
