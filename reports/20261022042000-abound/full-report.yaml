              note: Coverage and uptime are not independently disclosed.
        - label: Decision intelligence
          detail: Transaction data is converted into an affordability-oriented credit assessment.
          modules:
            - label: Transaction analysis
              detail: Income, expenses and account activity are used to build a fuller financial picture.
              note: Feature engineering and categorisation controls are not public.
            - label: Machine-learning affordability model
              detail: Render informs how much a borrower can afford to repay and supports credit decisioning.
              note: Model family, validation, fairness and drift controls are not public.
        - label: Delivery
          detail: The decisioning capability is used in direct lending and offered to third-party lenders.
          modules:
            - label: Direct consumer lending
              detail: Abound uses the workflow to originate UK personal loans.
              note: Current approval, servicing and loss metrics are not public.
            - label: B2B Render platform
              detail: Render is offered to other lenders; GAIA Family and LemFi are named in 2025 coverage.
              note: Deployment mode, tenant isolation and SLAs are not public.
        - label: Outcomes and controls
          detail: Public claims focus on affordability, access and lower defaults, while control evidence remains limited.
          modules:
            - label: Affordability-led lending
              detail: Public claims describe fewer defaults and access to fairly priced credit.
              note: Cohorts, denominators, independent validation and adverse-action controls are not public.
        - label: Trust and safety
          detail: Sensitive financial data and automated decisions require controls that are not publicly documented.
          modules:
            - label: Model and data governance
              detail: Public sources do not disclose fairness, explainability, retention or security-certification evidence.
              note: Request model cards, privacy assessments and security artifacts.
        - label: Support and monitoring
          detail: A B2B decisioning product requires operational monitoring and client support.
          modules:
            - label: Reliability and incident response
              detail: Uptime, latency, SLA and incident history are not disclosed in the assigned sources.
              note: Request service metrics, postmortems and support commitments.
