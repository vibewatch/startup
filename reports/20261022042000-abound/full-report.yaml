      - number: '4.2'
        title: Profitability and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Investor-hosted and trade-publication reporting gives a useful but narrow view of operating performance.
              For the twelve months to February reported in 2025 coverage, Abound was described as generating £66.8
              million of revenue and £7.5 million of net profit, versus £300,000 of profit in the prior year; another
              account rounds the latest net profit to £8 million. The reported 151% revenue increase was attributed to
              growth in both direct lending and the B2B technology offering. These figures support a profitability
              signal, not a complete earnings quality assessment: the sources do not provide interest income versus fee
              income, funding costs, provisions, charge-offs, servicing costs, partner contribution margins, or
              cash-flow conversion. A lender can report accounting profit while still requiring substantial capital to
              originate and warehouse loans, so net profit should not be read as free cash flow or as proof that the
              loan book is self-funding.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
