  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Abound has two disclosed commercial motions. It originates personal loans directly, with public product
              material describing loans of £1,000 to £20,000, terms of up to five years, and a representative APR of
              25.8%. Separately, it sells or provides Render to other lenders, positioning the platform across
              underwriting and collections and stating that it has powered more than 15 partners. This mix matters
              because direct lending earns revenue from a balance-sheet or funded-loan exposure, while the B2B motion
              can create technology revenue without requiring Abound to retain every loan. The available sources do not
              disclose the revenue split, realized borrower pricing, fee schedules, partner contract terms, or whether
              reported revenue includes interest, fees, platform income, or other items. Official list pricing therefore
              cannot be treated as realized revenue, gross margin, or customer acquisition economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI012
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
