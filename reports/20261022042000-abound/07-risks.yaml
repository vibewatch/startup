company:
  name: "Abound"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Abound's strongest disclosed mitigants are reported profitability, multiple institutional funding
    providers, and a cashflow-underwriting model, but the public record does not independently establish
    current regulatory permissions, cohort loss performance, debt covenants, security controls, or
    counterparty concentration. The highest residual risks are therefore model and credit quality,
    wholesale-funding dependence, regulatory/privacy verification, and execution across direct lending,
    Render, and international expansion.
sections:
  - id: "risk-posture"
    title: "Risk posture and evidence limits"
    body: >-
      Abound has credible scale signals, but public scale is not the same as low residual risk. Independent
      reporting put revenue at £66.8 million and net profit at £7.5 million for the year to February 2025,
      while another article relayed an £8 million company-reported profit; the difference appears consistent
      with rounding, but the assigned evidence contains no audited filing that reconciles it. Reported lending
      volume also moved from £900 million to more than £1 billion across 2025 coverage. These milestones reduce
      near-term viability concerns, yet they increase the importance of cohort loss, provisioning, liquidity,
      and operational-control evidence that was not available in the pool. Risk rankings below are consequently
      residual assessments tied to disclosed facts and explicit verification gaps, not probabilities derived
      from a complete loan-book dataset.
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
    figureRefs:
      - "FR001"
  - id: "regulatory-model-risk"
    title: "Regulatory, privacy, and model risk"
    body: >-
      A secondary consumer-finance review reports that Fintern Ltd is FCA-authorised under reference 929244,
      but no FCA register page, permission schedule, Ombudsman record, enforcement search, or official privacy
      record was present in the assigned evidence. That makes current authorisation scope and conduct history
      a diligence item rather than a settled conclusion. The underwriting proposition itself depends on bank
      transaction data and AI-based affordability analysis, so consent, data minimisation, model governance,
      bias testing, vulnerability treatment, and explainability are material control questions. Abound-related
      articles repeat claims of 70% or 75% fewer defaults than an industry benchmark, but the benchmark,
      observation window, borrower mix, default definition, and independent validation are undisclosed. Those
      claims should not be treated as comparable loss-rate evidence until a cohort bridge is produced.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR007"
      - "CR008"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "funding-operations-dependencies"
    title: "Funding, operating, and counterparty dependencies"
    body: >-
      Abound's lending model is structurally dependent on continued warehouse or asset-backed funding.
      Coverage names Citi, Waterfall Asset Management, Deutsche Bank, and LuminArx, and reports £1.6 billion
      of debt funding or lending capacity at different dates. The breadth of providers is a mitigant, but
      public totals do not disclose drawn balances, advance rates, eligibility rules, pricing, covenants,
      concentration, or renewal dates. In the 2023 financing, TechCrunch reported that the vast majority of
      the £500 million package was debt, while UKTN reported that Abound declined to disclose the debt-equity
      split. Funding raised therefore must not be read as unrestricted cash available. At the same time,
      operating direct lending, selling Render to third parties, and preparing international launches creates
      product, compliance, integration, and management-bandwidth risk across multiple execution fronts.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR012"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR002"
      - "TR003"
  - id: "monitoring-kill-criteria"
    title: "Monitoring indicators and thesis-break triggers"
    body: >-
      The investable case should be monitored against evidence that can falsify the underwriting and funding
      thesis. A material deterioration in vintage loss rates, a failure to reconcile the 70%-versus-75%
      default-reduction claims, or evidence that affordability outcomes underperform relevant peer cohorts
      would weaken the core product claim. Loss of a major funding line, covenant tightening that constrains
      originations, or an inability to replace maturing capacity would break the growth model even if headline
      facilities remain large. Regulatory restrictions, substantiated consumer-harm findings, a material
      privacy or security incident, or an inability to demonstrate current permissions and model controls
      would be thesis-breaking. Management should also show that Render has durable contracted economics and
      that international expansion does not dilute controls or direct-lending performance.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR007"
      - "CR008"
      - "CR014"
      - "CR015"
