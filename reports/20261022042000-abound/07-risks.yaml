  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "regulation"
      missingEvidence: "Current FCA register permissions, requirements or variations, ICO registration, FOS complaint outcomes, and enforcement or litigation records."
      whyItMatters: "Secondary reporting cannot establish the present scope of permissions, conduct history, or unresolved regulatory exposure."
      diligencePath: "Retrieve regulator records and obtain management's compliance register, legal matters schedule, complaints MI, and regulatory correspondence."
      relatedQuestionRefs: ["QR002"]
      relatedTableRefs: ["TR001"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "credit-performance"
      missingEvidence: "Vintage-level applications, approvals, arrears, defaults, cures, write-offs, provisioning, benchmark definitions, and fairness outcomes."
      whyItMatters: "The core underwriting advantage and residual credit risk cannot be validated from company percentage claims without comparable cohorts."
      diligencePath: "Obtain monthly cohort tapes and model-validation reports, then independently reconcile the 70% and 75% claims to a defined peer benchmark."
      relatedQuestionRefs: ["QR003"]
      relatedTableRefs: ["TR001", "TR002"]
    - type: "missing-source"
      severity: "material"
      topic: "security-operations"
      missingEvidence: "Security certifications, independent control reports, penetration tests, outage history, incident records, vendor inventory, and recovery tests."
      whyItMatters: "Use of bank-transaction data and reliance on digital underwriting make control failure potentially high impact, while the pool cannot show incident absence."
      diligencePath: "Review SOC or ISO evidence, DPIA, penetration-test remediation, RTO/RPO testing, subprocessors, status logs, and the complete incident register."
      relatedQuestionRefs: ["QR005"]
      relatedTableRefs: ["TR002"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "funding-dependencies"
      missingEvidence: "Facility-level commitments, utilisation, pricing, advance rates, eligibility tests, covenants, concentration, maturities, cash, and equity proceeds."
      whyItMatters: "Headline financing capacity does not establish unrestricted liquidity or resilience to a lender withdrawal or covenant tightening."
      diligencePath: "Build a lender-by-lender facility schedule, reconcile it to cash and originations, and stress renewals, haircuts, loss triggers, and funding costs."
      relatedQuestionRefs: ["QR004", "QR008"]
      relatedTableRefs: ["TR003"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "render-execution"
      missingEvidence: "Render contract values, implementation costs, gross margin, client retention, concentration, service levels, and country-specific launch readiness."
      whyItMatters: "Named clients and launch plans do not show whether the platform diversifies risk or adds execution burden."
      diligencePath: "Review contracts, cohort revenue and margin, renewals, implementation backlog, SLAs, regulatory mappings, and segment-level management accounts."
      relatedQuestionRefs: ["QR007", "QR010"]
      relatedTableRefs: ["TR003"]
