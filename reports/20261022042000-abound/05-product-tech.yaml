      diligencePath: Request a technical architecture review, model inventory and representative lender integration package under NDA.
      relatedQuestionRefs: [QE003, QE004, QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: trust-and-safety
      missingEvidence: Model validation, bias testing, explainability, adverse-action, privacy, retention, security-certification and incident-response evidence.
      whyItMatters: Credit decisions use sensitive financial data and can create borrower harm or regulatory exposure if controls are incomplete.
      diligencePath: Request model cards, fairness test results, DPIA, retention schedule, SOC 2 or ISO evidence, penetration-test summary and incident register.
      relatedQuestionRefs: [QE007, QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Current API uptime, connection success, decision latency, manual-review rate, client SLA and production incident history.
      whyItMatters: Reliability and support determine whether lender customers can safely embed Render in a live origination workflow.
      diligencePath: Obtain the last twelve months of service metrics, incident postmortems, SLA templates and customer implementation references.
      relatedQuestionRefs: [QE004, QE006]
      relatedTableRefs: [TE002, TE003]
