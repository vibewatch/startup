  topStrengths:
    - Public evidence indicates meaningful lending scale and profitability.
    - Open-banking underwriting and Render create a differentiated product and potential B2B platform extension.
    - The company reports continued expansion across products, partners, and markets.
  topRisks:
    - Current valuation, dilution, and the equity/debt funding split are undisclosed.
