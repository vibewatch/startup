        - [risks, valuation]
        - [valuation, diligence]
        - [diligence, decision]
    claimRefs: [CV010, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Price discipline
    body: "Research-more is warranted because public evidence supports business momentum but does not establish a current equity valuation, debt burden, or risk-adjusted return."
    claimRefs: [CV003, CV009]
  - calloutType: risk
    title: Downside trigger
    body: "A deterioration in loan-book vintages or asset-backed funding terms could impair equity value even if reported originations continue to grow."
    claimRefs: [CV010, CV011]
