    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not issue a price-insensitive buy call"]
      - [Confidence, medium, "Operating evidence is meaningful; valuation evidence is incomplete"]
      - [Risk rating, high, "Funding structure and credit performance remain material unknowns"]
      - [Valuation stance, unknown, "No public post-money valuation or current equity price"]
    notes: "Assessment synthesizes public reporting; unknown valuation is intentional because no priced equity valuation was disclosed in the retained sources."
    claimRefs: [CV001, CV003, CV005, CV009]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Scale and profitability, "Reported £1bn+ lending and 2025 profitability", "Audited reconciliation by cohort and period"]
      - [Funding access, "Debt-and-equity facilities involving Citi, Deutsche Bank, and investors", "Facility pricing, covenants, advance rates, and maturity schedule"]
      - [Underwriting differentiation, "Render uses Open Banking transaction data and AI cashflow underwriting", "Independent loss-rate comparison and model monitoring evidence"]
      - [B2B option value, "Render is supplied to other lenders and named clients include GAIA Family and LemFi", "Recurring revenue, gross margin, retention, and concentration disclosure"]
    notes: "Rows combine reported facts and analytical implications; financing amounts are facility or funding headlines, not equity valuation."
    claimRefs: [CV005, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Profitable growth persists; defaults remain controlled; Render scales internationally", "Potential premium to specialist-lender benchmarks, subject to verified equity terms", "Credit-cycle deterioration; execution and regulatory friction", "Low-to-medium; requires private evidence"]
      - [Base, "Direct lending remains profitable but funding and disclosure constrain scale", "Specialist-lender valuation with a material private-company discount", "Warehouse dependence; opaque cohorts; limited liquidity", "Medium; most consistent with public evidence"]
      - [Bear, "Defaults rise or funding tightens; Render does not become material recurring revenue", "Down-round, dilution, or impaired equity value", "Losses, covenants, regulatory intervention, commercialization failure", "Material downside; triggers are not yet measurable"]
      - [Re-rating trigger, "Verified priced round, strong vintages, and disclosed Render economics", "Move from research-more toward a price-specific call", "Evidence may remain private or stale", "Conditional on diligence"]
    notes: "Scenario values are intentionally qualitative; no public valuation range or sufficiently complete comparable set supports invented numeric multiples."
    claimRefs: [CV009, CV010, CV011, CV012]
