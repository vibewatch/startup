          note: "Cohort losses, covenants, dilution, and Render economics remain incomplete."
        - id: decision
          label: "Research-more"
          note: "Require private financing, credit, and platform economics before a price-specific call."
        - id: valuation
          label: "Valuation evidence"
          note: "No current priced equity valuation or post-money valuation is publicly disclosed."
        - id: diligence
          label: "Diligence gate"
          note: "Verify cap table, facility economics, credit vintages, and Render segment economics."
      edges:
