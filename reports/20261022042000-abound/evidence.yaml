evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current cap table, last priced equity round, post-money valuation and dilution schedule.
    whyItMatters: Without these documents, financing scale cannot be translated into an equity valuation or ownership outcome.
    diligencePath: Obtain the latest board-approved cap table, subscription documents and investor rights schedule.
    relatedQuestionRefs:
      - QO003
      - QO006
  - type: private-evidence-only
    severity: material
    topic: debt
    missingEvidence: Debt facility balances, pricing, covenants, eligibility criteria and lender concentration.
    whyItMatters: Asset-backed debt may expand lending capacity while also creating refinancing, collateral and covenant risk.
    diligencePath: Review executed facility agreements, borrowing-base reports and current lender statements.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: credit-performance
    missingEvidence: Loan-book cohort loss curves, defaults, recoveries, provisioning and capital efficiency.
    whyItMatters: Reported profitability and lower defaults do not establish risk-adjusted returns through a full credit cycle.
    diligencePath: Request vintage-level performance packs reconciled to management accounts and regulatory returns.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete board, executive and current headcount roster.
    whyItMatters: Key-person dependence and regulatory operating capacity cannot be assessed from three named leaders alone.
    diligencePath: Obtain the current organization chart, board minutes and regulated-function responsibility map.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: adverse-customer-experience
    missingEvidence: Independent complaints, ombudsman outcomes or regulator data that quantify adverse customer outcomes.
    whyItMatters: A low-reputation review source is a signal, not a reliable prevalence estimate or finding of misconduct.
    diligencePath: Review FCA and Financial Ombudsman disclosures plus complaint-rate and outcome data from management.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: UK unsecured personal-loan originations and outstanding balances segmented by borrower type and year.
    whyItMatters: Without a market denominator, cumulative Abound lending cannot be translated into share, SAM, or SOM.
    diligencePath: >-
      Obtain FCA, Bank of England, industry-association, or lender-filings data and reconcile definitions with Abound's
      book.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Render
    missingEvidence: Render revenue, gross margin, active lender count, pipeline, deployment, and partner-retention metrics.
    whyItMatters: The software adjacency may have different economics from direct lending, but public sources only name clients.
    diligencePath: Request product P&L, cohort retention, contract pipeline, and lender deployment evidence under confidentiality.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Evidence on consent drop-off, model-validation timelines, regulatory implementation friction, and default
      performance by cohort.
    whyItMatters: These factors determine whether the observed demand converts into repeatable, capital-efficient growth.
    diligencePath: >-
      Request anonymised cohort metrics, implementation case studies, model-governance materials, and regulatory
      correspondence.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-performance
    missingEvidence: >-
      Comparable approval, realized APR, default, recovery, and retention data for Abound, Lendable, Zopa, and incumbent
      lenders.
    whyItMatters: >-
      Without common cohorts, periods, and denominators, the matrix cannot establish durable underwriting or pricing
      superiority.
    diligencePath: >-
      Request a benchmark pack covering approval rates, realized APR, defaults, recoveries, and retention by product,
      borrower band, and vintage.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: platform
    missingEvidence: >-
      Render contract pricing, implementation timelines, customer concentration, revenue contribution, and renewal
      history.
    whyItMatters: B2B switching costs and distribution durability cannot be inferred from client names alone.
    diligencePath: >-
      Review anonymized contracts, deployment plans, customer-concentration schedules, revenue cohorts, and renewal
      records.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: default-performance
    missingEvidence: >-
      A reconciled definition for the reported 70% and 75% default reductions, including cohorts, vintages, geography,
      denominator, and observation period.
    whyItMatters: >-
      The claimed underwriting edge is central to differentiation, but the changing figures are not comparable as
      published.
    diligencePath: >-
      Obtain model-validation reports and cohort-level loss tables, then reproduce the comparison against named peer and
      industry baselines.
    relatedQuestionRefs:
      - QP002
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized borrower pricing, B2B fees, revenue mix, and partner retention by cohort.
    whyItMatters: List APR and partner count do not show recurring revenue quality or contribution margin.
    diligencePath: >-
      Request segment revenue bridge, partner contracts, realized APR distributions, retention, and channel-level
      CAC/payback.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Loan-book vintage performance, facility schedules, covenants, borrowing-base tests, reserves, and equity support.
    whyItMatters: Debt capacity and accounting profit do not establish liquidity, loss absorption, or runway.
    diligencePath: >-
      Obtain lender and board reporting covering drawn debt, advance rates, defaults, provisions, maturities, liquidity
      buffers, and capital allocation.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: credit-performance
    missingEvidence: A consistent definition and denominator for the 50–70% risk-reduction and 75% fewer-defaults claims.
    whyItMatters: Different benchmark language and periods can materially change expected losses and pricing.
    diligencePath: >-
      Request independent validation by vintage, benchmark population, default definition, charge-off policy, and
