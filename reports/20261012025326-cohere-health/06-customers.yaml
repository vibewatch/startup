company:
  name: Cohere Health
chapter:
  number: 6
  title: Customers
  summary: Cohere Health has established production traction across 17 health plan clients covering 25 million lives, anchored by long-standing national deployments at Humana and Geisinger alongside federal participation in the CMS WISeR demonstration. However, roughly 15 of its 17 payer clients remain undisclosed, and public verification of net revenue retention and renewal durability is obscured by private contract terms.
sections:
  - id: customer-segmentation-and-buyer-personas
    title: Customer Segmentation & Buyer Personas
    body: >-
      Cohere Health targets two distinct customer segments within the healthcare ecosystem: commercial health plans and government-backed Medicare demonstration programs, alongside a dependent user network of over 420,000 healthcare providers. Within health plans, enterprise procurement is driven by Chief Medical Officers, Vice Presidents of Population Health, and utilization management executives seeking to automate medical necessity reviews and reduce administrative operating expenses. Commercial payer clients deploy Cohere's platform across high-volume specialty pathways, including musculoskeletal procedures, cardiology, and diagnostic imaging. In addition, the Centers for Medicare & Medicaid Services (CMS) selected Cohere Health in 2025 as one of six technology vendors administering its WISeR Model in Original Medicare, deploying the platform through Medicare administrative contractor Novitas in Texas. While Cohere structures flexible commercial contracts that accommodate both
      tech-enabled in-house teams and fully delegated utilization management models, the company does not publicly disclose individual contract fee schedules, per-member-per-month economics, or the names of roughly 15 of its 17 payer clients.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU009
      - CU011
      - CU012
      - CU013
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-scale
    title: Adoption Trajectory & Operational Scale
    body: >-
      Cohere Health has expanded its operational footprint from five health plans covering 15 million members in early 2024 to 17 health plan clients covering approximately 25 million member lives and handling 47 million plan-provider interactions by 2026. This commercial acceleration was driven by closing ten new health plan deals during 2025 and expanding product capabilities from outpatient prior authorization into acute inpatient reviews, payment integrity, and policy management. At the workflow level, Cohere reports that up to 85% of routine prior authorization submissions receive instant, real-time approval decisions, reducing typical multi-day turnaround backlogs. The platform has processed more than 15 million prior authorization submissions through its FHIR APIs, demonstrating technical scalability ahead of federal CMS-0057-F compliance deadlines. Furthermore, Cohere reports achieving a 94% provider satisfaction rate and a Net Promoter Score of 67, indicating that automating
      routine approvals mitigates the friction typically experienced with legacy authorization portals.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-evidence-and-production-outcomes
    title: Named Customer Proof & Production Deployments
    body: >-
      Production-scale verification of Cohere Health's clinical platform centers on two primary commercial health plan relationships and one federal demonstration project. Anchor customer Humana expanded its deployment nationally in 2021 following a nine-state pilot, documenting a median authorization approval time of zero minutes for 89% of requests and a 95% provider portal adoption rate for musculoskeletal services across 12 states. Geisinger Health Plan partnered with Cohere in 2022 across multiple clinical service lines, with its Chief Medical Officer publicly confirming accelerated clinical decision-making and reduced provider friction. In 2025, CMS awarded Cohere a vendor role in the Original Medicare WISeR demonstration model in Texas. On the provider side, institutions including the University of Tennessee Medical Center have publicly validated the platform's intuitive workflow and prompt decisioning. However, outside these anchor accounts, detailed outcome data across the
      broader customer base remains self-reported by the company rather than independently audited.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU007
      - CU013
      - CU014
    tableRefs:
      - TU003
  - id: retention-concentration-and-structural-friction
    title: Account Durability, Concentration & Workflow Friction
    body: >-
      Despite reporting 17 health plan customers, Cohere Health exhibits significant customer concentration and transparency opacity. Approximately 15 of its 17 client health plans remain unnamed in public documentation, preventing third-party verification of customer cohort retention, gross revenue retention, or contract renewal durability. Furthermore, the company does not disclose net revenue retention (NRR) or logo churn metrics. Operational risks also emerge from the CMS WISeR demonstration, where vendors are compensated in part based on identified savings from curtailed services, introducing structural scrutiny regarding whether automation incentives favor denial volume over clinical necessity. While Cohere maintains that human clinicians review all non-approved requests and automated denials are prohibited, the lack of external audit reports leaves payer client retention, multi-year contract renewals, and potential regulatory scrutiny as key diligence issues for prospective
      investors.
    claimRefs:
      - CU001
      - CU007
      - CU013
      - CU014
