figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Structured map of health plan customer onboarding, provider digital intake, and enterprise platform expansion loops.
    data:
      items:
        - label: 1. Payer Contracting & Policy Ingestion
          detail: Health plan procures Cohere Unify under in-house, delegated, or hybrid model, ingesting clinical guidelines into Policy Studio.
          touchpoints:
            - Health plan CIO/CMO procurement
            - CMS-0057-F interoperability assessment
            - Custom clinical policy mapping
          tone: neutral
        - label: 2. EHR & Practice Management Integration
          detail: Cohere Connect integrates via FHIR APIs and Epic Payer Platform, enabling direct EHR submission without standalone portal fatigue.
          touchpoints:
            - Epic Payer Platform connector
            - FHIR PAS/CRD/DTR API activation
            - Clearinghouse and intake configuration
          tone: neutral
        - label: 3. Clinical Data Extraction & Auto-Approval
          detail: AI models extract unstructured clinical records to deliver instant determinations for up to 85% of routine authorization submissions.
          touchpoints:
            - Real-time policy evaluation
            - Attachment clinical parsing
            - Instant approval issuance
          tone: positive
        - label: 4. Human Clinical Review Escalation
          detail: Non-routine, complex, or edge cases route directly to specialized medical reviewers using Review Assist, cutting turnaround time by 50%.
          touchpoints:
            - Nurse and physician reviewer queue
            - Review Assist inpatient acceleration
            - Peer-to-peer consultation routing
          tone: warning
        - label: 5. Upstream Payment Accuracy Validation
          detail: Pre-service clinical authorization data feeds directly into Payment Integrity Suite, preventing post-claim billing disputes and achieving 8x ROI.
          touchpoints:
            - Cohere Validate pre-pay audit
            - Clinical coding consistency check
            - Fraud/waste anomaly detection
          tone: positive
        - label: 6. Enterprise Expansion & Cross-Selling
          detail: Health plans expand from outpatient utilization management into acute inpatient review, payment integrity, appeals, and HEDIS quality.
          touchpoints:
            - Annual contract expansion
            - Module cross-sell to UM/claims teams
            - HEDIS Stars gap closure reviews
          tone: positive
    approximationNotes: Workflow stages, touchpoints, and loop dynamics synthesized from Cohere Unify architectural documentation and partner case studies.
    claimRefs:
      - CU006
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
