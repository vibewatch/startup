companyProfile:
  summary: >-
    Cohere Health is a Boston-based clinical intelligence company founded in 2019 that sells workflow software for
    health plans and provider-facing utilization management teams. Its Cohere Unify platform automates routine prior
    authorization and extends into payment integrity, appeals, policy management, and adjacent payer workflows, while
    the company continues to scale commercially through new contracts, product launches, and board-level governance
    changes. Public sources point to meaningful deployment and capital backing, but the company still withholds audited
    financial metrics and detailed cap-table terms.
