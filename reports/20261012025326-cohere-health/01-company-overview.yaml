    title: "Proven Scale in Utilization Management Workflow"
    body: "Cohere Health has established deep enterprise penetration in healthcare utilization management, processing over 12 million prior authorizations annually across more than 600,000 healthcare providers and achieving high adoption in major regional plans like Geisinger and Humana."
    claimRefs:
