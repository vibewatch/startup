    title: "Workflow Dilution and Rising Algorithmic Scrutiny"
    body: "Cohere's aggressive multi-product expansion from outpatient prior authorization into inpatient reviews, payment integrity, and policy management introduces material execution risk, compounded by mounting regulatory scrutiny of automated healthcare decision tools and internal employee friction noted in third-party review surveys."
    claimRefs:
      - "CO013"
      - "CO014"
