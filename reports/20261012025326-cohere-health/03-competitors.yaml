company:
  name: "Cohere Health"
chapter:
  number: 3
  title: "Competitors"
  summary: "Cohere's competitive case rests on combining prior authorization, utilization management, payment integrity, and adjacent payer workflows on one clinical-intelligence platform, reinforced by an MCG guideline integration. The evidence also shows material uncertainty: direct peer pricing and head-to-head outcomes are not public in the allocated sources, buyer-review coverage is thin, and an independent signal service flags both execution risk from rapid scope expansion and faster funding at Anterior and Waystar."
sections:
  - id: "landscape-and-buying-alternatives"
    title: "Landscape and Buying Alternatives"
    body: "Cohere competes against more than named software peers. The buyer can select a clinically oriented platform, retain a transactional authorization tool, combine an incumbent guideline layer such as MCG with other workflow software, keep utilization management in-house, delegate operations, or preserve a fragmented vendor stack. Cohere's own materials position that fragmentation as the problem it solves, while a third-party directory distinguishes Cohere from purely transactional authorization products. The allocated evidence names Anterior and Waystar only as competitors attracting faster funding; it does not establish their exact product scope, customer count, pricing, or performance. The landscape table therefore treats those names as entrant signals rather than fully benchmarked peers and marks unsupported fields as unknown."
    claimRefs:
      - "CP001"
      - "CP006"
      - "CP007"
      - "CP009"
      - "CP014"
    tableRefs:
      - "TP001"
  - id: "capability-and-trust-positioning"
    title: "Capability and Trust Positioning"
    body: "The strongest documented differentiation is workflow breadth joined to clinical decision support. Cohere markets a common platform across utilization management, payment integrity, appeals, care management, quality, and claims, and says 85% of authorization requests receive real-time approval while the remainder receive clinician review. Its provider materials also state that AI does not deny care and that human clinical experts retain that decision. MCG adds an established evidence-guidance layer through an integration with Unify Decisioning rather than acting as a simple head-to-head substitute. These are credible capability signals, but most outcome measures remain company-issued. The matrix therefore separates documented functions from unknown competitor cells, and the positioning map uses ordinal analytical scores rather than market share or measured superiority."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP016"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "commercial-model-and-switching-costs"
    title: "Commercial Model, Distribution, and Switching Costs"
    body: "Public pricing is a diligence gap, not a basis for a precise comparison. The independent tool directory directs buyers to Cohere for current plans, while Cohere describes flexible in-house, delegated, and hybrid deployments without publishing unit prices. Cohere also contrasts its payment-integrity offer with legacy vendors that it says charge contingency fees above 30%; that is a vendor claim and does not identify a market-wide realized rate. The strategic advantage is packaging: one integration can support an initial use case and later modules, which can increase organizational switching costs as data, policies, and workflows become shared. The MCG relationship adds partner access, but its commercial terms and exclusivity are undisclosed, so it should not be treated as an exclusive distribution moat."
    claimRefs:
      - "CP002"
      - "CP007"
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "durability-and-displacement-risk"
    title: "Durability and Displacement Risk"
    body: "Cohere's moat is potentially cumulative rather than absolute: broader deployment can embed one decision layer across multiple payer functions, and the MCG integration can reduce implementation friction where those criteria are already accepted. Durability still depends on execution and proof. Toarn flags rapid scope expansion as an execution risk and reports faster funding at Anterior and Waystar, while also noting that public buyer-review volume is too thin to grade customer sentiment confidently. This evidence does not prove displacement, but it weakens any claim that breadth alone guarantees defensibility. The key underwriting tests are renewal and module-attach behavior, independently measured clinical accuracy, realized pricing, and whether plans prefer a unified platform over specialized tools or internal control."
    claimRefs:
      - "CP007"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
