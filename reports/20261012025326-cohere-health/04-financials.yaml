runDate: '2026-10-12'
company:
  name: Cohere Health
chapter:
  number: 4
  title: Financials
  summary: >-
    Cohere Health monetizes its clinical intelligence platform through per-member-per-month B2B SaaS contracts with
    health insurance plans, covering 25 million lives across 17 payer clients. Supported by a $90 million Series C in
    May 2025 at a $724.92 million post-money valuation, the company is cross-selling payment integrity and inpatient
    review to protect margins against 12-to-24-month sales cycles while core ARR, cash burn, and gross margin remain
    undisclosed private metrics.
sections:
  - id: revenue-streams-and-commercial-model
    title: Revenue Streams and Commercial Monetization
    body: >-
      Cohere Health operates as a specialized B2B healthcare SaaS vendor providing an enterprise clinical intelligence
      platform to health insurance plans. The core commercial monetization model relies on per-member-per-month (PMPM)
      subscription contracts where health plans pay recurring software fees scaled to their enrolled covered lives. As
      of 2026, Cohere reports serving 17 health plan enterprise clients covering approximately 25 million members and
      processing 47 million plan-provider interactions. Commercial growth accelerated through 2025 with the signing of
      ten new health plan contracts. Beyond core outpatient prior authorization, Cohere has expanded into acute
      inpatient review and post-pay payment integrity, creating multi-product bundling opportunities that drive
      incremental annual contract value across existing accounts.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI009
      - CI011
    tableRefs:
      - TI001
  - id: pricing-architecture-and-gtm
    title: Pricing Architecture and Go-to-Market Economics
    body: >-
      Cohere Health packages its capabilities into modular software applications centered on Cohere Unify, Review
      Assist, Cohere Validate, and Policy Studio. Realized PMPM fee schedules vary according to contracted membership
      volume, line of business (Commercial vs. Medicare Advantage), and module attach rates, though exact rate cards
      remain confidential. In payment integrity, Cohere positions Cohere Validate against legacy vendors that operate on
      30% or higher contingency fee structures, offering lower contingency or hybrid software fees to align payer
      incentives. The company sales motion targets payer enterprise C-suites through direct enterprise sales. However,
      sales velocity is constrained by extended procurement cycles lasting 12 to 24 months, extensive pilot data
      validation, and complex technical integrations with legacy 1990s payer IT infrastructure.
    claimRefs:
      - CI001
      - CI006
      - CI009
    tableRefs:
      - TI002
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Delivery Economics, and Margin Drivers
    body: >-
      The cost structure of Cohere Health blends cloud software hosting expenses with human clinical review operations.
      To ensure clinical safety and regulatory compliance, Cohere automates routine authorization determinations for up
      to 85% of documented submissions while routing the remaining 15% of complex cases to licensed physicians and
      nurses. To manage service-delivery expenses and protect unit economics as headcount reached 999 personnel, Cohere
      established an offshore Global Capability Center in Hyderabad in February 2026. This offshore hub provides
      engineering, data science, and clinical operations support outside domestic U.S. wage structures. Cohere reports
      that its payment integrity platform yields up to an 8x return on investment for health plans, yet true GAAP
      software gross margins remain unverified without audited COGS disclosure.
    claimRefs:
      - CI007
      - CI008
      - CI010
      - CI012
      - CI013
    tableRefs:
      - TI003
    figureRefs:
      - FI001
  - id: capital-adequacy-and-verdict
    title: Capital Adequacy and Financial Diligence Verdict
    body: >-
      Cohere Health has raised between $196.1 million and $200 million in cumulative equity financing since its 2019
      inception. Its latest financing event, a $90 million Series C closed in May 2025 at $13.71 per share, established
      a post-money valuation of $724.92 million with backing from Temasek, Deerfield Management, and Flare Capital
      Partners. The round carried a standard 1.0x liquidation preference on Series C preferred stock. This capital
      provides substantial runway to support enterprise onboarding and global operations. Nonetheless, Cohere Health
      remains in research-more territory for institutional investors because crucial underwriting metrics—including
      standalone ARR, GAAP gross margins, net revenue retention, and monthly cash burn—are closely held private
      information. Confirmatory financial diligence must inspect audited financial statements and customer concentration
      before underwriting valuation.
    claimRefs:
      - CI004
      - CI005
      - CI010
      - CI014
