callouts:
  - calloutType: insight
    title: Platform Bundling Compresses Standalone Point-Tool Economics
    body: >-
      Cohere Health expansion from prior authorization into inpatient review and payment integrity allows it to
      cross-sell multiple modules under a single master enterprise agreement. By replacing disparate point tools and
      offering an alternative to legacy 30% contingency fee payment integrity vendors, Cohere increases customer
      switching costs and expands annual contract value per health plan.
    claimRefs:
      - CI001
      - CI009
      - CI011
  - calloutType: risk
    title: Extended Payer Sales Cycles and Opaque Margins Require Deep Diligence
    body: >-
      Health plan sales cycles ranging from 12 to 24 months create substantial customer acquisition costs and extended
      working capital lead times. While the Hyderabad Global Capability Center aims to protect unit economics, the true
      software gross margin remains unverified without visibility into clinician reviewer staffing expenses versus
      automated AI decision throughput.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI010
