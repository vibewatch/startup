  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-performance
      missingEvidence: >-
        Audited financial statements detailing Cohere Health annual recurring revenue (ARR), revenue growth rate, GAAP
        gross margin, and net cash burn.
      whyItMatters: >-
        Without audited top-line revenue and margin splits, investors cannot verify whether Cohere Health operates with
        high software gross margins or lower-margin tech-enabled service economics.
      diligencePath: Request confidential management financials, revenue bridge, and auditor-reviewed income statements under NDA.
      relatedQuestionRefs:
        - QI008
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: material
      topic: contract-economics
      missingEvidence: >-
        Realized PMPM fee schedules, tiered volume discounts, and contingency fee percentages across commercial and
        Medicare Advantage contracts.
      whyItMatters: >-
        PMPM pricing tiers determine unit revenue stability, customer lifetime value, and vulnerability to payer
        procurement renegotiations.
      diligencePath: >-
        Review redacted customer contracts, master services agreements (MSAs), and fee schedules during confirmatory
        legal diligence.
      relatedTableRefs:
        - TI001
        - TI002
    - type: missing-source
      severity: minor
      topic: customer-concentration
      missingEvidence: >-
        Revenue contribution breakdown by customer, specifically evaluating Humana and other anchor health plans as a
        percentage of total ARR.
      whyItMatters: >-
        High customer concentration in health insurance tech creates severe revenue volatility if an anchor payer
        renegotiates or insources capabilities.
      diligencePath: Request customer-level revenue stack rank and retention cohorts from the management presentation.
      relatedTableRefs:
