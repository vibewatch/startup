    title: 'Recommendation Stance: Research-More on Stretched Valuation'
    claimRefs:
      - CV011
      - CV012
    body: While Cohere Health displays undeniable commercial momentum across tier-one health plans, the complete lack of verified financial metrics warrants a disciplined research-more posture rather than a premature buy recommendation.
