      - CV002
      - CV011
      - CV012
    rows:
      - - Recommendation
        - research-more
        - stretched
        - Maintain watching brief; do not commit new capital without audited financial disclosures.
      - - Confidence Level
        - medium
        - stretched
        - High confidence in operational adoption and scale, tempered by complete private financial opacity.
      - - Risk Rating
        - high
        - stretched
        - Substantial regulatory pushback against automated denials, customer concentration, and rapid competitor funding.
      - - Valuation Stance
        - stretched
        - stretched
        - Post-money Series C mark of $724.92M implies 9x-11x forward ARR multiple, requiring exceptional growth execution.
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Sensitivity / Pivot Trigger
    notes: Evaluation of core operational drivers versus commercial, regulatory, and multiple-compression vulnerabilities.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
    rows:
      - - Clinical Workflow Integration
        - Processes 12M+ authorizations across 600K+ providers with up to 90% auto-approval, creating high switching costs.
        - Provider friction and pushback against algorithmic care rationing could prompt regulatory restrictions or legislative limits.
        - Shift toward mandatory manual physician review on all denials or class-action litigation.
      - - Multi-Product Platform Expansion
        - Broadening into inpatient UM, payment integrity via ZignaAI, and HEDIS gap closure (5:1 ROI) drives account expansion.
        - Execution risk compounds across disparate product lines, risking focus dilution and delayed enterprise deployments.
        - Stalled cross-sell adoption or rising customer churn among regional health plan clients.
      - - Regulatory & Interoperability Moat
        - Cohere Connect has processed 15M+ FHIR transactions, positioning the firm ahead of 2027 CMS-0057-F compliance mandates.
        - Standardized federal APIs reduce proprietary platform stickiness and lower barriers for competing point solutions.
        - Rival solutions demonstrating faster CMS interoperability rollout at lower price points.
      - - Competitive & Organizational Scale
        - Achieved 60%+ ARR growth and scaled offshore delivery via Hyderabad GCC to protect operating margins.
        - Well-capitalized competitors (Anterior, Waystar) and Glassdoor 3.3 employee sentiment indicate internal execution friction.
        - Key executive turnover or accelerated customer wins by rival agentic AI startups.
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Growth & Operating Assumptions
      - Valuation / Multiple Logic
      - Key Downside Risks
      - Probability Signal
    notes: Illustrative 3-year valuation scenarios benchmarked against $724.92M Series C post-money valuation and estimated revenue base.
    claimRefs:
      - CV002
      - CV006
      - CV013
      - CV014
    rows:
      - - Bull Case
        - ARR grows from $75M to $180M+ (40%+ CAGR) as payment integrity and inpatient modules cross-sell into 80%+ of existing base.
        - $1.8B - $2.2B valuation based on 10x - 12x forward revenue multiple; paves way for 2027-2028 IPO.
        - Multiple compression in broader SaaS; aggressive entry by legacy payers developing in-house agentic tools.
        - 25% (requires flawless execution across newly acquired modules and benign regulatory outcomes)
      - - Base Case
        - ARR expands to $120M - $140M (25%-30% CAGR); primary growth driven by core prior auth and selective HEDIS add-ons.
        - $850M - $1.1B valuation based on 7x - 8x forward revenue multiple; moderate return profile for Series C investors.
        - Payer procurement cycles lengthen; modest customer churn among regional health plans.
        - 50% (most plausible trajectory given current health plan RFP pipelines and CMS mandate momentum)
      - - Bear Case
        - ARR growth decelerates below 15% ($90M ARR); regulatory scrutiny forces high manual clinician touch, compressing gross margin.
        - $450M - $550M valuation based on 5x forward multiple; potential flat or down-round recapitalization.
        - Severe regulatory caps on automated denials; major anchor customer defection; employee turnover.
        - 25% (significant downside if federal scrutiny intensifies or payer IT budgets freeze)
