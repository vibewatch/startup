company:
  name: Cohere Health
chapter:
  number: 8
  title: Valuation
  summary: Cohere Health demonstrates impressive operational momentum across health plans, processing more than 12 million prior authorizations annually across nearly 600,000 providers. However, an uncorroborated $724.92 million Series C post-money valuation benchmark and the complete absence of audited revenue, ARR, or margin disclosures keep the recommendation at research-more with a valuation stance of stretched.
sections:
  - id: investment-thesis-and-recommendation
    title: Investment Thesis, Stance, and Recommendation Framework
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
    tableRefs:
      - TV001
      - TV002
    body: Cohere Health represents a compelling clinical-intelligence modernization story within healthcare utilization management, yet public investment diligence must balance enterprise platform traction against substantial valuation opacity. The positive investment thesis rests on Cohere Unify establishing mission-critical integration across payer-provider workflows, handling more than 12 million authorization requests annually for 600,000 providers with high reported satisfaction. Furthermore, platform expansion into acute inpatient review, payment integrity via the ZignaAI acquisition, and HEDIS quality gap closure substantially broadens contractual revenue opportunities per health plan client. Conversely, the anti-thesis emphasizes mounting regulatory scrutiny over AI-assisted care denials, rapid funding acceleration among well-capitalized rivals such as Anterior and Waystar, and potential customer concentration risk. Given that Cohere's Series C post-money valuation mark sits at $724.92 million without verifiable public disclosures of recurring revenue, net retention, or unit gross margins, we assign a recommendation of research-more with medium confidence and a valuation stance of stretched.
  - id: capital-structure-and-valuation-scenarios
    title: Capital Structure, Financing History, and Valuation Scenarios
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV010
      - CV013
    tableRefs:
      - TV003
    body: Cohere Health has raised approximately $200 million in cumulative equity financing, anchored by a $90 million Series C round closed in May 2025 led by Temasek alongside Deerfield Management, Flare Capital Partners, Define Ventures, Longitude Capital, and Polaris Partners. Secondary market indicators from Forge Global establish a private post-money valuation benchmark of $724.92 million at $13.71 per share with standard 1.0x non-participating liquidation preference terms. Industry intelligence suggests the business achieved over 60 percent ARR expansion while establishing a Global Capability Center in Hyderabad to safeguard unit economics. In our scenario modeling, an illustrative base case projecting $65 million to $80 million in ARR yields a forward revenue multiple of 9.0x to 11.2x, which prices in flawless operational execution and sustained contract retention. A bull case requires aggressive multi-product cross-selling across inpatient and payment integrity modules to justify a valuation exceeding $1.8 billion, whereas a bear case involving regulatory denial caps or customer concentration losses could force valuation multiples downward toward 5.0x.
  - id: exit-readiness-and-diligence-priorities
    title: Exit Readiness, Diligence Priorities, and Thesis-Break Triggers
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV010
      - CV011
      - CV014
    figureRefs:
      - FV001
    body: Cohere's liquidity trajectory points toward a prospective initial public offering or large-scale strategic acquisition by a diversified healthcare technology or payer services enterprise within the next 24 to 36 months. Secondary platform listings on Forge Global and EquityZen demonstrate ongoing investor interest, while pre-IPO governance enhancements—including the appointment of experienced physician-executives to the board—signal institutional maturity. Nevertheless, prospective investors must resolve critical diligence questions before underwriting new capital at current valuation marks. Key priorities include obtaining audited revenue retention waterfalls, verifying unit economics across payment integrity contingency fees, and confirming low legal overturn rates on AI-assisted utilization decisions. Primary thesis-break triggers include federal regulatory mandates requiring mandatory manual physician review for all authorization denials, material contract renegotiations from key health plan partners, or executive leadership turnover amidst rapid organizational scaling.
