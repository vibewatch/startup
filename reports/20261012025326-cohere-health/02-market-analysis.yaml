callouts:
  - calloutType: "insight"
    title: "Expansion from Outpatient Prior Auth to Total Cost of Care Contract"
    body: "Cohere Health's strategic acquisition of ZignaAI and expansion into payment integrity and acute inpatient review fundamentally alters its market positioning. Rather than competing as a point solution for outpatient prior authorization, Cohere packages utilization review and payment integrity under a unified health plan contract, displacing legacy post-pay contingency vendors while preventing provider friction upstream."
    claimRefs:
      - "CM003"
      - "CM007"
  - calloutType: "risk"
    title: "Regulatory and Public Scrutiny Surrounding AI-Driven Payer Determinations"
    body: "While federal interoperability rules (CMS-0057-F) serve as an adoption catalyst, escalating regulatory and provider scrutiny of automated medical necessity denials presents a material constraint. Cohere mitigates this by maintaining clinician review for any adverse determination (auto-approving up to 85–90% of requests with human sign-off on denials), but broader industry backlash against algorithmic gatekeeping remains an ongoing market headwind."
    claimRefs:
      - "CM013"
      - "CM014"
