callouts:
  - calloutType: strength
    title: Hard Algorithmic Safeguard Against Automated Denials
    body: Cohere Health enforces a strict architectural policy where machine learning models are authorized only to issue instant approvals or pend submissions for human clinical evaluation. Under no circumstances does the platform permit AI algorithms to generate authorization denials, mitigating a major regulatory and liability hazard in payer AI operations.
    claimRefs:
      - CE001
      - CE002
  - calloutType: risk
    title: Provider-Side Assembly Burden and Deployment Lead Times
    body: While Cohere dramatically compresses payer turnaround times, it operates primarily on the payer side of the transaction and does not eliminate the upstream documentation preparation and EHR chart assembly performed by provider practice staff. Combined with implementation timelines extending up to six months, health plans face notable onboarding inertia.
    claimRefs:
      - CE008
      - CE014
  - calloutType: insight
    title: Cross-Pollinating Utilization Management and Payment Integrity
    body: By connecting upstream prior authorization clinical data with downstream claims adjudication via Cohere Validate, health plans can shift payment integrity from costly retrospective audits to pre-payment validation, achieving claimed 8x ROI and higher accuracy without duplicative medical record requests.
    claimRefs:
      - CE005
      - CE012
