chapter:
  number: 5
  title: Product & Technology
  summary: Cohere Health delivers an enterprise clinical intelligence and prior authorization SaaS suite that automates intake and decisioning for health plans while enforcing that AI is never used to issue denials. Its core platform spans Unify Intake, Decisioning, Transformation, Review Assist, and Policy Studio, integrating with provider EHRs and health plan systems via HL7 Da Vinci FHIR APIs to support CMS-0057-F compliance. While achieving up to 85% to 90% real-time approval rates on routine authorizations, primary technical risks center on opaque third-party EHR integration overhead and the operational complexity of managing 350+ fine-tuned clinical AI models across diverse payer policy rules.
sections:
  - id: platform-overview-workflow
    title: Platform Definition and Core Utilization Management Workflows
    body: 'Cohere Health builds and operates a specialized clinical intelligence and utilization management platform designed specifically for health plans. Rather than selling directly to provider medical practices as an electronic health record plug-in, Cohere operates on the payer side of the transaction, evaluating prior authorization submissions against health plan policies and clinical criteria. For health plans utilizing Cohere, the platform automates routine intake, evaluates documentation against medical necessity guidelines, and issues real-time approvals for up to 85% to 90% of requests that contain complete clinical documentation. Crucially, Cohere enforces a binding clinical governance rule: the platform never utilizes artificial intelligence or automated machine learning algorithms to issue an authorization denial. When incoming requests fail to satisfy automated approval criteria or present ambiguous clinical documentation, the platform automatically pends the request for human review by credentialed nurses or physician medical directors. However, independent assessments emphasize that while payer-side decision turnaround is drastically accelerated, medical practice staff still bear the operational burden of verifying requirements, gathering records, and preparing the initial submission.'
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE014
    tableRefs:
      - TE002
  - id: product-modules-portfolio
    title: Enterprise Solutions Portfolio and Solution Line Architecture
    body: The core commercial offering is packaged under the Cohere Unify software-as-a-service suite, which can be deployed modularly or as an integrated end-to-end platform across commercial, Medicare Advantage, and Medicaid books of business. Unify Intake digitizes and consolidates authorization requests across disparate intake channels—including web portals, electronic faxes, and direct EHR integrations—converting unstructured notes into standardized digital formats. Unify Decisioning applies automated rules logic to drive instant approvals while accelerating manual case preparation when clinical review is required. Unify Transformation delivers evidence-based clinical guidance at the point of authorization, offering proactive care paths and episodic authorizations. In recent releases, Cohere expanded beyond outpatient utilization management into acute inpatient care with Cohere Review Assist—which enables clinical reviewers to process inpatient requests nearly 50% faster—and pre-pay payment integrity via Cohere Validate, which unifies authorization clinical insights with post-care claims data. Furthermore, Cohere Policy Studio provides plans with a centralized hub to create, manage, and deploy custom medical policies alongside national guidelines, while Cohere Align introduces green lighting analytics to exempt high-performing surgical specialists from burdensome prior authorizations.
    claimRefs:
      - CE003
      - CE005
      - CE011
      - CE012
      - CE013
    tableRefs:
      - TE001
  - id: technical-architecture-interoperability
    title: Technical Architecture, Machine Learning Models, and Interoperability
    body: 'Cohere Health''s technical architecture is organized as a six-tier clinical intelligence stack that processes over 47 million payer-provider interactions annually. The foundation rests on Cohere Connect, an enterprise API integration suite engineered to satisfy the CMS Interoperability and Prior Authorization Final Rule (CMS-0057-F). Connect implements HL7 Da Vinci implementation guides—specifically Coverage Requirements Discovery (CRD), Documentation Templates and Rules (DTR), and Prior Authorization Support (PAS)—enabling standards-based electronic exchange between health plan core administrative systems and provider EHRs. Above the ingestion layer, Cohere''s clinical natural language processing engine extracts structured medical entities and diagnostic codes from unstructured clinical attachments and fax PDFs. Decision logic is evaluated across more than 350 fine-tuned, clinician-developed machine learning models that balance national coverage determinations (CMS NCD/LCD) against custom health plan policies. Despite these modern API standards, prospective enterprise customers face real-world deployment challenges: enterprise implementations frequently span up to six months due to legacy payer core system variations, custom policy digitization requirements, and specialized clearinghouse connections.'
    claimRefs:
      - CE006
      - CE008
      - CE009
      - CE010
      - CE011
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: trust-safety-and-technical-risks
    title: Trust, Clinical Safety Controls, and Technical Operating Risks
    body: 'In high-stakes utilization management, algorithmic safety, regulatory compliance, and provider trust represent paramount operational hurdles. Cohere addresses public and regulatory scrutiny surrounding AI in healthcare by embedding hard architectural constraints into its decisioning pipeline: machine learning is strictly restricted to positive auto-approvals, administrative pre-population, and clinical summarization. Any decision leading to an adverse determination or care denial mandates human clinician evaluation, preserving full auditability, medical director oversight, and compliance with state and federal review mandates. Data privacy controls enforce a minimum-necessary clinical data extraction standard, limiting ingested PHI to information strictly required for medical necessity determinations. Nonetheless, key technical and operational risks persist. The platform remains dependent on the completeness and fidelity of provider-submitted documentation, meaning incomplete chart attachments inevitably trigger manual escalation delays. Additionally, maintaining and continually calibrating over 350 proprietary machine learning models across shifting clinical guidelines and divergent state gold-carding laws introduces ongoing maintenance overhead and model governance risk.'
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE008
      - CE014
