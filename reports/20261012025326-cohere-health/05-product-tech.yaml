  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job
      - Current Baseline Workflow
      - Cohere Solution
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Outpatient Specialty Auth
        - Manual faxing of clinical notes; 3 to 14 day payer review cycles
        - Cohere portal / EHR API intake with real-time automated rules decisioning
        - Immediate approval for up to 85%-90% of documented requests
        - Provider staff must still assemble clinical documentation packets manually
      - - Inpatient Care Auth
        - Extensive clinical chart review by health plan nurses over multiple days
        - Cohere Review Assist synthesizing inpatient charts into prioritized clinical evidence
        - Nearly 50% reduction in nurse reviewer completion times
        - Complex comorbidities still require substantial manual chart audit
      - - High-Volume Provider Exemption
        - Cumbersome annual gold-carding reviews that plans report cause administrative friction
        - Cohere Align and green lighting analytics based on provider specialty track records
        - 55% reduction in submission time for qualified high-performing surgeons
        - Low-volume providers remain ineligible, limiting broad network coverage
      - - Pre-Pay Claims Review
        - Disconnected post-payment recovery audits with 30%+ contingency fee vendors
        - Cohere Validate connecting pre-care authorization data directly to claims coding
        - Upwards of 8x ROI and 58% findings rate on high-cost conditions like sepsis
        - Requires deep technical integration between UM and claims processing systems
    notes: Baseline workflows and performance gains sourced from Cohere Health official disclosures, customer case studies, and independent industry assessments. Performance benefits depend on complete provider submissions.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
      - CE013
      - CE014
  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Functional Role
      - Key Dependency
      - Technical & Operating Risk
    rows:
      - - Ingestion & Interoperability Core
        - Manages EHR API connectivity, HL7 Da Vinci CRD/DTR/PAS protocols, and portal SSO
        - Provider EHR endpoints (Epic, Cerner) and clearinghouse gateway uptime
        - API endpoint deprecation or non-standard FHIR implementations across smaller payers
      - - Clinical NLP & Extraction Engine
        - Extracts structured clinical concepts, CPT/ICD codes, and notes from attachments
        - Document layout parsers and optical character recognition services
        - Extraction hallucination or missing key clinical comorbidities in scanned PDFs
      - - Rules & Policy Digitization Engine
        - Encodes national CMS guidelines (NCD/LCD) and plan-specific coverage policies into executable logic
        - Timely health plan policy updates and clinical committee validations
        - Policy drift or conflicting coverage logic between commercial and Medicare lines
      - - Clinician Decisioning & Escalation Gate
        - Routes borderline or non-qualifying requests to human nurses and physician reviewers
        - Credentialed clinical reviewer availability and medical director oversight
        - Reviewer staffing bottlenecks during peak seasonal authorization spikes
      - - Payment Integrity & Pre-Pay Bridge
        - Correlates upstream prior auth clinical evidence with downstream claim coding
        - Real-time bi-directional integration with payer core claims adjudication engines
        - Claims adjudication lag causing pre-pay interventions to fail before payment release
    notes: Architecture components compiled from Cohere technical whitepapers, product solution sheets, and CMS interoperability filings. Dependencies highlight structural interfaces where failures can cascade.
    claimRefs:
      - CE002
      - CE006
      - CE009
      - CE011
      - CE012
