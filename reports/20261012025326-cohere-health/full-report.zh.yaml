      - number: '5.4'
        title: 信任、临床安全控制与技术运营风险
        blocks:
          - type: paragraph
            body: >-
              在高风险利用管理中，算法安全、监管合规和提供者信任是首要运营难题。Cohere 将硬性架构约束嵌入决策流程，以应对公众和监管机构对医疗 AI
              的审查：机器学习仅限于正向自动批准、行政预填和临床摘要。任何导致不利判断或拒绝护理的决定，都必须由临床人员评估，以保留完整可审计性、医疗主管监督和对州及联邦审核要求的合规。数据隐私控制执行最低必要临床数据提取标准，只摄取作出医疗必要性判断所需的
              PHI。不过，技术和运营风险仍在。平台依赖提供者提交文档的完整性和准确性；病历附件不完整，必然会造成转人工升级延误。此外，在不断变化的临床指南和各州不同的金卡法规下维护并持续校准 350
              多个专有机器学习模型，也带来持续维护成本和模型治理风险。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE014
      - number: '5.5'
        title: 展示
        blocks:
          - type: callout
            title: 防止自动拒绝的硬性算法保障
            body: Cohere Health 执行严格架构政策：机器学习模型只能即时批准，或挂起申请交由临床人员审核。平台绝不允许 AI 算法生成授权拒绝，从而降低付款方 AI 运营中的重大监管和责任风险。
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: 提供者端组装负担与部署周期
            body: Cohere 虽大幅缩短付款方周转时间，却主要在交易付款方一侧运行，并未消除提供者人员上游准备文档和整理 EHR 病历的负担。加上最长 6 个月的实施周期，健康计划面临明显的接入惰性。
            calloutType: risk
            claimRefs:
              - CE008
              - CE014
          - type: callout
            title: 打通利用管理与支付完整性
            body: 通过 Cohere Validate 将上游事前授权临床数据与下游理赔裁决连接，健康计划可把支付完整性从昂贵的事后审计转为付款前验证；在不重复索取病历的情况下，据称实现 8x ROI 和更高准确率。
            calloutType: insight
            claimRefs:
              - CE005
              - CE012
