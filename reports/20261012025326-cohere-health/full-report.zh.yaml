            - IPO 前二级市场股份流动性不足
        - label: 低严重性
          values:
            - 常规维护中断
            - 轻微供应商差异
            - 门户 UI 样式问题
        - label: 可忽略严重性
          values:
            - 极小日志延迟
            - 短暂测试失败
            - 文档笔误
        - label: 信息性
          values:
            - 公共领域变化
            - 季度分析师报告
            - 会议演示
    approximationNotes: 可能性和严重性分类属于定性尽调判断，综合参考公开监管时间线、产品披露及行业分析。
