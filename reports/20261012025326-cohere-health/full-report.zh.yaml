          label: 企业规模：每年 12M+ 次事前授权请求，全国 600K+ 家医疗服务提供方
        - id: multi-product-reach
          label: 平台扩张：住院审核、支付完整性（Validate）和 HEDIS 数据采集
        - id: regulatory-tailwind
