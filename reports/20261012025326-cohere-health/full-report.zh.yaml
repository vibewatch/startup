      - number: '6.4'
        title: 客户持久性、集中度与工作流摩擦
        blocks:
          - type: paragraph
            body: >-
              尽管 Cohere Health 报告有 17 家健康计划客户，公司仍存在明显客户集中和透明度不足。17 家客户健康计划中约 15
              家未在公开文件中具名，第三方无法核验客户群留存、毛收入留存或合同续约持久性。公司也未披露净收入留存率（NRR）或客户标志流失指标。CMS WISeR
              示范还带来运营风险：供应商部分报酬取决于削减服务后识别出的节省额，因此有人会审视自动化激励是否偏向拒绝数量而非医疗必要性。Cohere
              坚称所有未批准请求均由人工临床人员审核，且禁止自动拒绝，但缺少外部审计报告，使付款方客户留存、多年合同续约和潜在监管审查成为潜在投资者的关键尽调问题。
            claimRefs:
              - CU001
              - CU007
              - CU013
              - CU014
      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: 不透明商业付款方名单中的客户集中
            body: >-
              尽管 Cohere Health 声称有 17 家健康计划客户、覆盖 2,500 万人，但公开具名的商业账户只有 Humana 和 Geisinger Health
              Plan，多数收入和业务量仍未经过独立尽调验证。
            calloutType: risk
            claimRefs:
              - CU001
              - CU013
          - type: callout
            title: 健康计划与提供者网络的双重对齐
            body: 通过对最高 85% 的常规事前授权申请即时自动批准，Cohere 实现 94% 的提供者满意度和 67 的净推荐值，解决了长期困扰利用管理软件的提供者摩擦。
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管要求、AI 临床治理与法律审查
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 处于高度审查的监管和法律环境，人工智能与医疗覆盖判断、临床利用管理（UM）和患者可及性相交。Medicare 和 Medicaid
              服务中心互操作性与事前授权最终规则（CMS-0057-F）设定严格合规期限：初始报告要求于 2026 年 1 月 1 日生效，完整 FHIR API 要求须在 2027 年 1 月 1 日前满足。虽然
              Cohere Connect 已支持超过 15M 次事前授权申请，但 API 互操作或自动合规报告失败，可能使客户健康计划遭受 CMS
              监管制裁和运营处罚。此外，监管机构和州立法机构正加强对利用管理中的算法偏见和自动拒绝的审查。Cohere 明确通过运营政策降低风险，规定绝不使用 AI
              拒绝护理，并要求持证人工医疗主管作出所有不利覆盖判断。平台还依据商业伙伴协议（BAA）处理受保护健康信息（PHI），因此必须严格加密传输中和静态数据，并实施严格供应商审计控制，以避免 HIPAA 执法行动。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营复杂性、快速多产品扩张与质量保证
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 已从专注于事前授权的软件供应商快速扩展为企业级临床智能套件，覆盖急性住院审核（Review Assist）、医疗政策管理（Policy
              Studio）、提供者绩效（Align）和支付完整性（通过 2025 年 9 月收购 ZignaAI 获得的
              Validate）。多产品多元化带来重大运营执行风险，因为住院利用管理和复杂支付审计的临床工作流需要不同指南和专业审核员。Cohere 称其 AI 模型对常规门诊授权的自动批准率最高达 85% 至
              90%，但要在肌肉骨骼、心脏病学和急性住院护理等不同专科保持临床准确性，就需要持续对照持证临床人员基准评估。公司还于 2026 年 2
              月在海得拉巴设立全球能力中心（GCC），将工程、数据科学和临床运营扩展到离岸团队；管理临床质量控制、数据安全和跨境运营协同，仍是持续的运营挑战。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
