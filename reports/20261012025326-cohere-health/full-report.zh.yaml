      - number: '3.4'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Cohere 的护城河可能是累积性的，而非绝对的：更广泛部署能让一个决策层嵌入多个付款方职能，MCG 集成则可在相关标准已被接受的地方降低实施摩擦。持久性仍取决于执行和证据。Toarn
              将快速扩张范围列为执行风险，并报告 Anterior 和 Waystar
              融资更快，同时指出公开买方评价数量太少，无法有把握地判断客户情绪。这些证据不能证明替代已经发生，却削弱了“仅凭广度就能确保防御性”的说法。关键投资判断测试包括续约和模块附加行为、独立测量的临床准确性、实际定价，以及计划是否偏好统一平台而非专业工具或内部控制。
            claimRefs:
              - CP007
              - CP012
              - CP013
              - CP014
              - CP015
