      - number: '4.2'
        title: 定价架构与市场进入经济性
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 将能力打包为模块化软件应用，核心包括 Cohere Unify、Review Assist、Cohere Validate 和 Policy Studio。实际 PMPM
              费率取决于合同会员规模、业务线（商业计划或 Medicare Advantage）和模块附加率，但具体价目表仍属机密。在支付完整性领域，Cohere 让 Cohere Validate 对标收取 30%
              或更高或有费的传统供应商，以更低的或有费或混合软件费协调付款方激励。公司通过直销面向付款方企业 C-suite，但 12 至 24 个月的采购周期、大量试点数据验证和与 1990 年代付款方 IT
              基础设施的复杂技术集成，限制了销售速度。
            claimRefs:
