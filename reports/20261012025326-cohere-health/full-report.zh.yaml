    rows:
      - - 建议
        - research-more
        - stretched
        - 继续观察；在获得经审计财务披露前，不投入新增资本。
      - - 置信度
        - medium
        - stretched
        - 对运营采用和规模有较高信心，但私人财务信息完全不透明，需下调判断。
      - - 风险评级
        - high
        - stretched
        - 自动拒绝遭遇强监管反弹、客户集中度高，以及竞争对手快速融资。
      - - 估值立场
        - stretched
        - stretched
        - C 轮投后估值 $724.92M 对应远期 ARR 的 9x-11x，要求公司实现非凡的增长执行。
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱
      - 论点
      - 反论点
      - 敏感性 / 转向触发因素
    notes: 评估核心运营驱动因素，以及商业、监管和估值倍数压缩风险。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
    rows:
      - - 临床工作流集成
        - 覆盖超过 600K+ 家提供方，处理 12M+ 次授权，自动批准率最高达 90%，由此形成较高切换成本。
        - 提供方摩擦以及对算法化医疗配给的反弹，可能促使监管收紧或立法设限。
        - 所有拒绝都转为强制医生人工复核，或出现集体诉讼。
      - - 多产品平台扩张
        - 拓展住院 UM、通过 ZignaAI 提供支付完整性，以及闭合 HEDIS 缺口（ROI 为 5:1），推动客户账户扩张。
        - 不同产品线叠加执行风险，可能稀释焦点并推迟企业部署。
        - 交叉销售采用停滞，或区域健康计划客户流失率上升。
      - - 监管与互操作性护城河
        - Cohere Connect 已处理 15M+ 次 FHIR 交易，使公司在 2027 年 CMS-0057-F 合规要求上占据先发位置。
        - 标准化联邦 API 会削弱专有平台黏性，也会降低竞争性点解决方案的进入门槛。
        - 竞争方案以更低价格更快完成 CMS 互操作性部署。
      - - 竞争与组织规模
        - ARR 增长超过 60%，并通过海得拉巴 GCC 扩大离岸交付，以守住运营利润率。
        - 资金充足的竞争对手（Anterior、Waystar）以及 Glassdoor 3.3 的员工评价，显示内部执行存在摩擦。
        - 核心高管离职，或竞争型智能体 AI 初创公司加速赢得客户。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 增长与运营假设
      - 估值 / 倍数逻辑
      - 主要下行风险
      - 概率信号
    notes: 三年估值情景示例，以 C 轮投后估值 $724.92M 和估算收入基数为基准。
    claimRefs:
      - CV002
      - CV006
      - CV013
      - CV014
    rows:
      - - 乐观情景
        - 随着支付完整性和住院模块交叉销售至 80%+ 的现有客户，ARR 从 $75M 增至 $180M+（CAGR 40%+）。
        - $1.8B - $2.2B 估值，对应远期收入 10x - 12x；为 2027-2028 IPO 铺路。
        - 更广泛 SaaS 市场倍数压缩；传统支付方积极开发内部智能体工具并进入市场。
        - 25%（要求新收购模块执行无瑕，且监管结果温和）
      - - 基准情景
        - ARR 增至 $120M - $140M（CAGR 25%-30%）；主要增长来自核心事前授权和选择性 HEDIS 增值模块。
        - $850M - $1.1B 估值，对应远期收入 7x - 8x；C 轮投资者获得中等回报。
        - 支付方采购周期拉长；区域健康计划客户小幅流失。
        - 50%（结合当前健康计划 RFP 管线和 CMS 要求势头，这是最可能的路径）
      - - 悲观情景
        - ARR 增长放缓至 15% 以下（$90M ARR）；监管审查迫使人工临床介入增加，压缩毛利率。
        - $450M - $550M 估值，对应远期倍数 5x；可能平价或折价重组融资。
        - 监管严厉限制自动拒绝；主要锚定客户流失；员工离职。
        - 25%（若联邦审查加剧或支付方冻结 IT 预算，下行幅度将显著）
