      - number: '3.3'
        title: 商业模式、分销与转换成本
        blocks:
          - type: paragraph
            body: >-
              公开定价是尽调缺口，不能作为精确比较的依据。独立工具目录让买方联系 Cohere 获取当前方案，而 Cohere 只描述灵活的内部、委托和混合部署，并未公布单位价格。Cohere
              还将其支付完整性产品与据称收取超过 30%
              或有费的传统供应商对比；这是供应商说法，并不代表全市场实际费率。其战略优势在于打包：一次集成可支持初始用例及后续模块，随着数据、政策和工作流共享，组织转换成本可能上升。MCG
              关系带来合作伙伴渠道，但商业条款和排他性未披露，因此不应视为独家分销护城河。
