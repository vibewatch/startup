companyProfile:
  summary: >-
    Cohere Health 是一家总部位于波士顿的临床智能公司，2019 年成立，向健康计划及面向医疗服务提供者的利用管理团队销售工作流软件。其 Cohere Unify
    平台将常规事前授权自动化，并延伸至支付完整性、申诉、政策管理及相邻的付款方工作流。公司通过签订新合同、推出产品和调整董事会治理持续扩大商业规模。公开来源显示其已有实质部署和资本支持，但经审计财务指标及详细资本结构条款仍未公开。
