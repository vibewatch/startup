      - number: '5.3'
        title: 技术架构、机器学习模型与互操作性
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 的技术架构是六层临床智能栈，每年处理超过 4700 万笔付款方与提供者交互。底层是 Cohere Connect 企业 API 集成套件，用于满足 CMS
              互操作性与事前授权最终规则（CMS-0057-F）。Connect 实施 HL7 Da Vinci
              指南，具体包括覆盖要求发现（CRD）、文档模板与规则（DTR）和事前授权支持（PAS），让健康计划核心行政系统与提供者 EHR 按标准交换数据。在摄取层之上，Cohere
              临床自然语言处理引擎从非结构化临床附件和传真 PDF 提取结构化医疗实体和诊断代码。决策逻辑由超过 350 个经微调、由临床人员开发的机器学习模型评估，在国家覆盖认定（CMS
              NCD/LCD）与健康计划自定义政策之间取平衡。尽管 API 标准现代化，潜在企业客户仍面临现实部署挑战：付款方旧核心系统差异、自定义政策数字化要求和专用清算所连接，常使企业实施周期长达六个月。
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
