      - number: '5.2'
        title: 企业解决方案组合与产品线架构
        blocks:
          - type: paragraph
            body: >-
              核心商业产品归入 Cohere Unify 软件即服务套件，可在商业、Medicare Advantage 和 Medicaid 业务中模块化部署，也可作为一体化端到端平台部署。Unify Intake
              将网页门户、电子传真和直接 EHR 集成等分散渠道的授权请求数字化并汇总，将非结构化记录转换为标准数字格式。Unify Decisioning
              用自动规则推动即时批准，并在需要临床审核时加快人工案件准备。Unify Transformation 在授权环节提供循证临床指引，包括主动护理路径和阶段性授权。近期 Cohere 通过 Cohere Review
              Assist 从门诊利用管理扩展到急性住院护理，使临床审核员处理住院请求的速度提高近 50%；通过 Cohere Validate 进入服务前支付完整性，将授权临床洞察与护理后的理赔数据统一。Cohere
              Policy Studio 为计划提供集中中心，可在国家指南旁创建、管理和部署自定义医疗政策；Cohere Align 则用放行分析让高绩效外科专科医生免受繁重事前授权。
            claimRefs:
              - CE003
              - CE005
              - CE011
              - CE012
              - CE013
