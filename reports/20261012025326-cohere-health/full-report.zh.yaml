    title: 建议逻辑
    type: flow
    summary: 决策框架从运营进展出发，穿过下行风险因素，最终落到“继续研究”的尽调判断。
    approximationNotes: 逻辑链依次经过运营规模、监管定位和资本结构表缺口，最终形成投资立场。
