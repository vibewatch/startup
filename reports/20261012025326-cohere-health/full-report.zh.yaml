      - number: '6.3'
        title: 已知客户证明与生产部署
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 临床平台的生产规模验证，集中在两段主要商业健康计划关系和一个联邦示范项目。锚定客户 Humana 在九州试点后于 2021 年扩大全国部署，记录显示 89% 请求的授权批准中位时间为
              0 分钟，12 个州肌肉骨骼服务的提供者门户采用率为 95%。Geisinger Health Plan 于 2022 年在多个临床服务线与 Cohere
              合作，其首席医疗官公开确认临床决策加快、提供者摩擦减少。2025 年，CMS 授予 Cohere 在德州原始 Medicare WISeR 示范模式中的供应商角色。提供者一侧，包括 University of
              Tennessee Medical Center 在内的机构也公开验证了平台直观的工作流和快速决策。不过，除这些锚定客户外，更广泛客户群的详细结果数据仍由公司自报，未经过独立审计。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU013
              - CU014
