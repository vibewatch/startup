  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与核心利用管理工作流
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 构建并运营专为健康计划设计的临床智能与利用管理平台。Cohere 不像电子健康记录插件那样直接卖给提供者诊所，而是在交易付款方一侧，根据健康计划政策和临床标准评估事前授权申请。使用
              Cohere 的健康计划可以让平台自动接收常规申请、按医疗必要性指南评估文档，并对包含完整临床文档的请求实时批准 85% 至 90%。关键是，Cohere
              执行一项具有约束力的临床治理规则：平台绝不使用人工智能或自动机器学习算法作出授权拒绝。申请若不满足自动批准标准或临床文档含糊，平台会自动挂起，交由具备资质的护士或医生医疗主管审核。不过，独立评估强调，尽管付款方决策周转大幅加快，医疗机构人员仍要核验要求、收集记录并准备初始申请。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE014
