            body: >-
              Cohere Health 的成本结构由云软件托管费用和人工临床审核运营组成。为确保临床安全与监管合规，Cohere 对最多 85% 的有完整文档提交自动作出授权判断，其余 15%
              复杂案件转交持证医生和护士。为控制交付费用并保护单位经济性，公司在员工达到 999 人后，于 2026 年 2
              月在海得拉巴设立离岸全球能力中心。该中心在美国本土工资结构之外提供工程、数据科学和临床运营支持。Cohere 称其支付完整性平台为健康计划带来最高 8x 投资回报，但没有经审计的销货成本披露，真实 GAAP
