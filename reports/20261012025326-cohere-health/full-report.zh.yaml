            body: >-
              自 2019 年成立以来，Cohere Health 累计股权融资在 $196.1M 至 $200M 之间。最近一轮融资是 2025 年 5 月完成的 $90M C 轮，发行价每股
              $13.71，Temasek、Deerfield Management 和 Flare Capital Partners 参与，投后估值为 $724.92M。该轮 C 轮优先股带有标准 1.0x
              清算优先权。这笔资本为企业接入和全球运营提供了较长资金续航。不过，对机构投资者而言，Cohere Health 仍需继续研究，因为独立 ARR、GAAP
              毛利率、净收入留存率和月度现金消耗等关键投资判断指标都是严格保密的私人信息。作出估值投资判断前，确认性财务尽调必须查阅经审计财务报表和客户集中度。
