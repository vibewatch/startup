  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业变现
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 是一家专业化 B2B 医疗 SaaS 供应商，为健康保险计划提供企业临床智能平台。核心商业变现依靠按会员每月收费（PMPM）的订阅合同，健康计划按覆盖会员数支付经常性软件费。截至
              2026 年，Cohere 称服务 17 家企业健康计划客户，覆盖约 2500 万名会员，处理 4700 万笔计划与提供者交互。公司在 2025
              年签下十份新的健康计划合同，商业增长加速。除核心门诊事前授权外，Cohere 还扩展到急性住院审核和事后支付完整性，为现有客户提供多产品打包并带来增量年度合同价值。
            claimRefs:
              - CI001
