      - number: '7.3'
        title: 交易对手依赖、客户集中与财务可持续性
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 的商业模式高度依赖企业健康计划采用，带来明显交易对手集中风险。公司历史上由 Humana 的锚定部署支撑，截至 2026 年已扩大到 17 家客户健康计划、覆盖 2,500
              万人。然而，提供者采用仍与付款方推广紧密绑定；只有主导其所在区域的健康计划要求或支持 Cohere 接入平台时，提供者网络才能获得主要行政价值。依赖方面，Cohere 依赖电子健康记录（EHR）供应商
              API、云基础设施供应商，以及与健康计划旧核心管理和 UM 平台的集成。财务上，Cohere 累计融资约 2 亿美元，最近于 2025 年 5 月完成 9,000 万美元 C 轮，估计投后估值 7.2492
              亿美元。要维持这一估值，公司必须继续快速拓展企业客户、保持高净收入留存率，同时消化离岸扩张和企业客户集成周期带来的企业管理费用增加。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
