  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Mandates, AI Clinical Governance, and Legal Scrutiny
        blocks:
          - type: paragraph
            body: >-
              Cohere Health operates in a highly scrutinized regulatory and legal environment where artificial
              intelligence intersects with healthcare coverage determinations, clinical utilization management (UM), and
              patient access. The Centers for Medicare & Medicaid Services Interoperability and Prior Authorization
              final rule (CMS-0057-F) establishes stringent compliance timelines, with initial reporting requirements
              taking effect on January 1, 2026, and full FHIR API mandates required by January 1, 2027. While Cohere
              Connect has supported over 15 million prior authorization submissions, any failure in API interoperability
              or automated compliance reporting could subject client health plans to CMS regulatory sanctions and
              operational penalties. Furthermore, regulatory agencies and state legislatures are escalating scrutiny
              over algorithmic bias and automated denials in utilization management. Cohere explicitly mitigates this
              exposure through an operating policy stating that it never uses AI to deny care, requiring licensed human
              medical directors to execute all adverse coverage determinations. In addition, the platform handles
              protected health information (PHI) under Business Associate Agreements (BAAs), necessitating rigorous data
              encryption in transit and at rest, as well as strict vendor audit controls to prevent HIPAA enforcement
              actions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
