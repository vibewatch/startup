      - number: '6.2'
        title: Adoption Trajectory & Operational Scale
        blocks:
          - type: paragraph
            body: >-
              Cohere Health has expanded its operational footprint from five health plans covering 15 million members in
              early 2024 to 17 health plan clients covering approximately 25 million member lives and handling 47
              million plan-provider interactions by 2026. This commercial acceleration was driven by closing ten new
              health plan deals during 2025 and expanding product capabilities from outpatient prior authorization into
              acute inpatient reviews, payment integrity, and policy management. At the workflow level, Cohere reports
              that up to 85% of routine prior authorization submissions receive instant, real-time approval decisions,
              reducing typical multi-day turnaround backlogs. The platform has processed more than 15 million prior
              authorization submissions through its FHIR APIs, demonstrating technical scalability ahead of federal
              CMS-0057-F compliance deadlines. Furthermore, Cohere reports achieving a 94% provider satisfaction rate
              and a Net Promoter Score of 67, indicating that automating routine approvals mitigates the friction
              typically experienced with legacy authorization portals.
