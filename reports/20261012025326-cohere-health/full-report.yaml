          ARR grows from $75M to $180M+ (40%+ CAGR) as payment integrity and inpatient modules cross-sell into 80%+ of
          existing base.
        - $1.8B - $2.2B valuation based on 10x - 12x forward revenue multiple; paves way for 2027-2028 IPO.
        - Multiple compression in broader SaaS; aggressive entry by legacy payers developing in-house agentic tools.
        - 25% (requires flawless execution across newly acquired modules and benign regulatory outcomes)
      - - Base Case
        - >-
          ARR expands to $120M - $140M (25%-30% CAGR); primary growth driven by core prior auth and selective HEDIS
          add-ons.
        - >-
          $850M - $1.1B valuation based on 7x - 8x forward revenue multiple; moderate return profile for Series C
          investors.
        - Payer procurement cycles lengthen; modest customer churn among regional health plans.
        - 50% (most plausible trajectory given current health plan RFP pipelines and CMS mandate momentum)
      - - Bear Case
        - >-
          ARR growth decelerates below 15% ($90M ARR); regulatory scrutiny forces high manual clinician touch,
          compressing gross margin.
        - $450M - $550M valuation based on 5x forward multiple; potential flat or down-round recapitalization.
        - Severe regulatory caps on automated denials; major anchor customer defection; employee turnover.
        - 25% (significant downside if federal scrutiny intensifies or payer IT budgets freeze)
