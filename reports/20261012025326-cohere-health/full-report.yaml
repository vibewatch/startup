              - CE010
      - number: '5.4'
        title: Trust, Clinical Safety Controls, and Technical Operating Risks
        blocks:
          - type: paragraph
            body: >-
              In high-stakes utilization management, algorithmic safety, regulatory compliance, and provider trust
              represent paramount operational hurdles. Cohere addresses public and regulatory scrutiny surrounding AI in
              healthcare by embedding hard architectural constraints into its decisioning pipeline: machine learning is
              strictly restricted to positive auto-approvals, administrative pre-population, and clinical summarization.
              Any decision leading to an adverse determination or care denial mandates human clinician evaluation,
              preserving full auditability, medical director oversight, and compliance with state and federal review
              mandates. Data privacy controls enforce a minimum-necessary clinical data extraction standard, limiting
              ingested PHI to information strictly required for medical necessity determinations. Nonetheless, key
              technical and operational risks persist. The platform remains dependent on the completeness and fidelity
              of provider-submitted documentation, meaning incomplete chart attachments inevitably trigger manual
              escalation delays. Additionally, maintaining and continually calibrating over 350 proprietary machine
              learning models across shifting clinical guidelines and divergent state gold-carding laws introduces
              ongoing maintenance overhead and model governance risk.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hard Algorithmic Safeguard Against Automated Denials
            body: >-
              Cohere Health enforces a strict architectural policy where machine learning models are authorized only to
              issue instant approvals or pend submissions for human clinical evaluation. Under no circumstances does the
              platform permit AI algorithms to generate authorization denials, mitigating a major regulatory and
              liability hazard in payer AI operations.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Provider-Side Assembly Burden and Deployment Lead Times
            body: >-
              While Cohere dramatically compresses payer turnaround times, it operates primarily on the payer side of
              the transaction and does not eliminate the upstream documentation preparation and EHR chart assembly
              performed by provider practice staff. Combined with implementation timelines extending up to six months,
              health plans face notable onboarding inertia.
            calloutType: risk
            claimRefs:
              - CE008
              - CE014
          - type: callout
            title: Cross-Pollinating Utilization Management and Payment Integrity
            body: >-
              By connecting upstream prior authorization clinical data with downstream claims adjudication via Cohere
              Validate, health plans can shift payment integrity from costly retrospective audits to pre-payment
              validation, achieving claimed 8x ROI and higher accuracy without duplicative medical record requests.
            calloutType: insight
            claimRefs:
              - CE005
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Cohere Health targets two distinct customer segments within the healthcare ecosystem: commercial health
              plans and government-backed Medicare demonstration programs, alongside a dependent user network of over
              420,000 healthcare providers. Within health plans, enterprise procurement is driven by Chief Medical
              Officers, Vice Presidents of Population Health, and utilization management executives seeking to automate
              medical necessity reviews and reduce administrative operating expenses. Commercial payer clients deploy
              Cohere's platform across high-volume specialty pathways, including musculoskeletal procedures, cardiology,
              and diagnostic imaging. In addition, the Centers for Medicare & Medicaid Services (CMS) selected Cohere
              Health in 2025 as one of six technology vendors administering its WISeR Model in Original Medicare,
              deploying the platform through Medicare administrative contractor Novitas in Texas. While Cohere
              structures flexible commercial contracts that accommodate both tech-enabled in-house teams and fully
              delegated utilization management models, the company does not publicly disclose individual contract fee
              schedules, per-member-per-month economics, or the names of roughly 15 of its 17 payer clients.
