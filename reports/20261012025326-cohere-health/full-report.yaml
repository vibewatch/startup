chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Core Operating Model
        blocks:
          - type: paragraph
            body: >-
              Cohere Health was founded in 2019 in Boston, Massachusetts, by Siva Namasivayam, Duncan Reece, and Clay
              Williams to tackle chronic administrative overhead and clinical delay in the commercial health plan
              utilization management ecosystem. Operating as a specialized clinical intelligence and operations
              platform, the company sits directly at the intersection of health plans, risk-bearing provider networks,
              and clinical review teams. Rather than functioning as a pure software vendor or an outsourced review
              vendor, Cohere deploys an enterprise clinical intelligence platform known as Cohere Unify. The system
              ingests structured electronic health records, claims, and unstructured clinical documentation to automate
              routine medical necessity approvals while routing ambiguous determinations to licensed clinicians. The
              platform is designed to align with federal interoperability standards such as CMS-0057-F, delivering
              real-time authorization capabilities while seeking to preserve payer compliance and provider satisfaction
              across complex specialty medical services.
            claimRefs:
              - CO001
              - CO007
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO011
              - CO012
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Founder Transition
        blocks:
          - type: paragraph
            body: >-
              Cohere Health's leadership structure has evolved from its early entrepreneurial founding team toward an
              experienced healthcare payer operations bench. Chief Executive Officer Siva Namasivayam continues to lead
              corporate strategy and commercial execution as the primary executive figure, while original co-founders
              Duncan Reece and Clay Williams transitioned out of day-to-day operational leadership after establishing
              the foundational product architecture. Corporate governance is anchored by venture sponsors including
              Flare Capital Partners, whose co-founder Michael Greeley serves on the board of directors. To bolster
              enterprise clinical oversight as health plans face intense public and regulatory scrutiny over automated
              prior authorization tools, Cohere appointed Dr. Mark Leenay to its board of directors in February 2026.
              Dr. Leenay brings substantial executive and clinical governance experience from former leadership
              positions at WellCare, Optum, and UnitedHealth Group, providing critical institutional credibility as
              Cohere scales delegated utilization management contracts with commercial and Medicare Advantage payers.
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization History, Financing Rounds, and Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              Cohere Health has accumulated $200 million in total equity financing across multiple institutional
              investment rounds since its 2019 inception. The company established its early capitalization with a Series
              A syndicate led by Flare Capital Partners and Define Ventures in 2020, followed by a $50 million Series B
              funding round in February 2024 led by Deerfield Management that brought cumulative funding to $106
              million. In May 2025, Cohere closed an expansive $90 million Series C financing round led by sovereign
              investment firm Temasek Holdings, with participation from existing healthcare backers Deerfield
              Management, Define Ventures, Flare Capital Partners, Longitude Capital, and Polaris Partners. Secondary
              market data and Certificate of Incorporation filings documented by Forge Global indicate a Series C
              post-money valuation of $724.92 million based on a preferred share price of $13.71 across 6,565,117 Series
              C preferred shares with a standard 1.0x non-participating liquidation preference. Strategic capital from
              health plans, including Humana Ventures, underscores deep commercial integration with payer balance
              sheets, though fundamental financial operating metrics including annual recurring revenue, gross margin,
              and cash burn remain confidential.
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.4'
        title: Operational Scale, Platform Milestones, and Enterprise Expansion
        blocks:
          - type: paragraph
            body: >-
              Since launching its initial utilization management platform, Cohere Health has achieved substantial
              commercial deployment across commercial and government health plans. The company's processing scale
              expanded from 5.5 million prior authorizations serving 420,000 providers in early 2024 to more than 12
              million prior authorization requests annually across 600,000 providers by late 2025. In September 2025,
              Cohere completed the strategic acquisition of ZignaAI (Zigna Technologies), integrating pre-payment claims
              integrity and complex clinical audit capabilities into its core offering through Cohere Validate. Building
              on this expansion, Cohere announced ten new enterprise health plan contracts in January 2026 alongside the
              introduction of specialized workflow solutions: Cohere Review Assist for acute inpatient reviews, Cohere
              Policy Studio for clinical policy management, and Cohere Align for provider performance calibration.
              Headcount tracked by industry databases reached 999 employees as of August 2026, supported by the
              establishment of a Global Capability Center in Hyderabad to sustain engineering and operational delivery.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: Organizational Headwinds, Industry Scrutiny, and Governance Diligence
        blocks:
          - type: paragraph
            body: >-
              Despite rapid commercial adoption and platform scaling, Cohere Health operates in an increasingly
              scrutinized regulatory and legal environment. The broader utilization management sector faces intensifying
              regulatory oversight from the Centers for Medicare & Medicaid Services, state insurance commissioners, and
              healthcare provider associations regarding algorithmic bias and improper medical necessity denials. While
              Cohere emphasizes that its platform automates routine approvals and reserves adverse care determinations
              exclusively for licensed human reviewers, broad enterprise expansion across inpatient care, payment
              integrity, and policy management introduces material execution risk. Independent competitor assessments
              highlight employee review patterns on Glassdoor and Indeed (reflecting a 3.3-star composite rating across
              251 reviews) that point to management consistency challenges amidst rapid corporate growth. Furthermore,
              as competitors such as Anterior and Waystar attract venture capital into AI healthcare operations, Cohere
              must balance platform breadth with strict clinical auditability to preserve customer retention and
              enterprise pricing power.
            claimRefs:
              - CO013
              - CO014
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Proven Scale in Utilization Management Workflow
            body: >-
              Cohere Health has established deep enterprise penetration in healthcare utilization management, processing
              over 12 million prior authorizations annually across more than 600,000 healthcare providers and achieving
              high adoption in major regional plans like Geisinger and Humana.
            calloutType: strength
            claimRefs:
              - CO008
              - CO011
          - type: callout
            title: Workflow Dilution and Rising Algorithmic Scrutiny
            body: >-
              Cohere's aggressive multi-product expansion from outpatient prior authorization into inpatient reviews,
              payment integrity, and policy management introduces material execution risk, compounded by mounting
              regulatory scrutiny of automated healthcare decision tools and internal employee friction noted in
              third-party review surveys.
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market boundary for clinical intelligence platforms like Cohere Health centers on automating,
              orchestrating, and optimizing utilization management (UM), prior authorization (PA), and adjacent payment
              integrity (PI) workflows for health plans and risk-bearing entities. Historically, healthcare payers
              treated prior authorization as an administrative friction barrier, relying on fragmented phone calls,
              faxes, and rules-based web portals that resulted in severe provider abrasion, delayed patient care, and
              manual overhead. While first-generation PA tools focused on point-solution form completion on the provider
              side, Cohere deployed directly into the health plan enterprise, embedding clinical intelligence and
              evidence-based care guidelines into the payer's core decisioning engine. With its 2025 expansion, Cohere
              expanded its scope beyond outpatient authorizations into acute inpatient medical necessity review,
              pre-service payment integrity, and clinical policy management. This broader operational boundary directly
              addresses core health plan administrative expenses and medical loss ratios, positioning Cohere not merely
              as a prior authorization software utility, but as an enterprise operating layer connecting pre-service
              clinical intent with post-service claims adjudication.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing, Sizing Lenses, and Regulatory Catalysts
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for Cohere Health requires a multi-lens framework that separates macro
              administrative waste from serviceable software and technology-enabled services spend. At the broadest
              level, the macro TAM encompasses billions of dollars in annual administrative friction, care delays, and
              clinical review overhead absorbed across U.S. health plans and healthcare providers. Within this pool, the
              serviceable addressable market (SAM) for health plan clinical intelligence and intelligent utilization
              management software spans an estimated $1.5 billion to $3.0 billion annually, expanding as payers
              transition from outsourced business process outsourcing (BPO) arrangements toward automated in-house
              platforms. Furthermore, the adjacent payment integrity market represents an additional $2.0 billion to
              $4.0 billion in addressable spend historically dominated by legacy post-payment recovery vendors charging
              contingency fees exceeding 30 percent. Cohere's contracted serviceable obtainable market (SOM) currently
              spans 17 enterprise health plan clients covering 25 million member lives, generating over 12 million
              annual authorization requests and 15 million digital transactions through its Connect APIs. The primary
              catalyst driving near-term market expansion is federal regulation CMS-0057-F, which mandates standardized
              electronic prior authorization APIs across Medicare Advantage, Medicaid, and qualified health plans by
              2027.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Enterprise Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              Health plan enterprise purchasing for clinical intelligence platforms is segmented across distinct buying
              centers and plan types, each governed by specific financial drivers and operational pain points. In
              commercial health plans, the Chief Medical Officer and VP of Utilization Management control procurement,
              prioritizing provider satisfaction, reduction of turnaround times, and immediate outpatient medical
              expense savings. In Medicare Advantage and Medicaid plans, procurement is heavily influenced by Chief
              Operating Officers and Chief Financial Officers seeking compliance with federal interoperability deadlines
              alongside measurable medical expense management. Additionally, Medicare Advantage quality leaders
              represent an increasingly vital procurement stakeholder: closing clinical documentation gaps to improve
              Medicare Advantage Star Ratings from 3 to 4 Stars yields an estimated $57 million in additional CMS
              payments per 100,000 members. Cohere packages its capabilities across modular enterprise
              applications—including Cohere Unify for core utilization management, Cohere Validate for payment
              integrity, and Cohere Capture for HEDIS quality measurement—allowing health plans to adopt specific
              modules or delegate full clinical workflows while providing providers with an intuitive, real-time intake
              portal.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Drivers, Implementation Bottlenecks, and Structural Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of clinical intelligence platforms is propelled by strong regulatory tailwinds and operational
              imperatives, but faces distinct structural constraints and execution challenges. On the demand side, the
              federal CMS-0057-F Interoperability and Prior Authorization rule establishes mandatory compliance
              timelines that force health plans to replace legacy, fax-heavy intake with automated FHIR-based APIs.
              Furthermore, rising medical loss ratios (MLRs) and acute staffing shortages among clinical review nurses
              compel payers to automate routine medical necessity approvals. However, significant adoption constraints
              persist across the payer landscape. Scrutiny from healthcare regulators, physician associations, and the
              public regarding algorithmic care denials has intensified, creating legal and reputational risks for
              health plans deploying automated decisioning. Cohere mitigates this constraint by using AI strictly to
              automate approvals (achieving up to 85% to 90% real-time approval rates) while requiring licensed human
              clinicians to review all adverse determinations. Additional market constraints include lengthy enterprise
              sales cycles (12 to 18 months), complex integration requirements with legacy payer systems of record, and
              proprietary contract economics that obscure long-term client expansion and net retention rates.
            claimRefs:
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Expansion from Outpatient Prior Auth to Total Cost of Care Contract
            body: >-
              Cohere Health's strategic acquisition of ZignaAI and expansion into payment integrity and acute inpatient
              review fundamentally alters its market positioning. Rather than competing as a point solution for
              outpatient prior authorization, Cohere packages utilization review and payment integrity under a unified
              health plan contract, displacing legacy post-pay contingency vendors while preventing provider friction
              upstream.
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
          - type: callout
            title: Regulatory and Public Scrutiny Surrounding AI-Driven Payer Determinations
            body: >-
              While federal interoperability rules (CMS-0057-F) serve as an adoption catalyst, escalating regulatory and
              provider scrutiny of automated medical necessity denials presents a material constraint. Cohere mitigates
              this by maintaining clinician review for any adverse determination (auto-approving up to 85–90% of
              requests with human sign-off on denials), but broader industry backlash against algorithmic gatekeeping
              remains an ongoing market headwind.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buying Alternatives
        blocks:
          - type: paragraph
            body: >-
              Cohere competes against more than named software peers. The buyer can select a clinically oriented
              platform, retain a transactional authorization tool, combine an incumbent guideline layer such as MCG with
              other workflow software, keep utilization management in-house, delegate operations, or preserve a
              fragmented vendor stack. Cohere's own materials position that fragmentation as the problem it solves,
              while a third-party directory distinguishes Cohere from purely transactional authorization products. The
              allocated evidence names Anterior and Waystar only as competitors attracting faster funding; it does not
              establish their exact product scope, customer count, pricing, or performance. The landscape table
              therefore treats those names as entrant signals rather than fully benchmarked peers and marks unsupported
              fields as unknown.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
              - CP014
      - number: '3.2'
        title: Capability and Trust Positioning
        blocks:
          - type: paragraph
            body: >-
              The strongest documented differentiation is workflow breadth joined to clinical decision support. Cohere
              markets a common platform across utilization management, payment integrity, appeals, care management,
              quality, and claims, and says 85% of authorization requests receive real-time approval while the remainder
              receive clinician review. Its provider materials also state that AI does not deny care and that human
              clinical experts retain that decision. MCG adds an established evidence-guidance layer through an
              integration with Unify Decisioning rather than acting as a simple head-to-head substitute. These are
              credible capability signals, but most outcome measures remain company-issued. The matrix therefore
              separates documented functions from unknown competitor cells, and the positioning map uses ordinal
              analytical scores rather than market share or measured superiority.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: Commercial Model, Distribution, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Public pricing is a diligence gap, not a basis for a precise comparison. The independent tool directory
              directs buyers to Cohere for current plans, while Cohere describes flexible in-house, delegated, and
              hybrid deployments without publishing unit prices. Cohere also contrasts its payment-integrity offer with
              legacy vendors that it says charge contingency fees above 30%; that is a vendor claim and does not
              identify a market-wide realized rate. The strategic advantage is packaging: one integration can support an
              initial use case and later modules, which can increase organizational switching costs as data, policies,
              and workflows become shared. The MCG relationship adds partner access, but its commercial terms and
              exclusivity are undisclosed, so it should not be treated as an exclusive distribution moat.
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
              - CP010
              - CP011
              - CP015
      - number: '3.4'
        title: Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Cohere's moat is potentially cumulative rather than absolute: broader deployment can embed one decision
              layer across multiple payer functions, and the MCG integration can reduce implementation friction where
              those criteria are already accepted. Durability still depends on execution and proof. Toarn flags rapid
              scope expansion as an execution risk and reports faster funding at Anterior and Waystar, while also noting
              that public buyer-review volume is too thin to grade customer sentiment confidently. This evidence does
              not prove displacement, but it weakens any claim that breadth alone guarantees defensibility. The key
              underwriting tests are renewal and module-attach behavior, independently measured clinical accuracy,
              realized pricing, and whether plans prefer a unified platform over specialized tools or internal control.
            claimRefs:
              - CP007
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth Creates an Expansion Path, Not Proof of Superiority
            body: >-
              A shared platform can make additional modules easier to deploy and harder to remove, but the allocated
              sources do not provide independent renewal, attach-rate, or head-to-head outcome evidence.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP015
          - type: callout
            title: Evidence Asymmetry Favors the Vendor Narrative
            body: >-
              Cohere publishes substantial scale and outcome claims, while direct competitor detail and independent
              buyer reviews are sparse; competitive durability therefore remains less certain than product breadth.
            calloutType: risk
            claimRefs:
              - CP003
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization
        blocks:
          - type: paragraph
            body: >-
              Cohere Health operates as a specialized B2B healthcare SaaS vendor providing an enterprise clinical
              intelligence platform to health insurance plans. The core commercial monetization model relies on
              per-member-per-month (PMPM) subscription contracts where health plans pay recurring software fees scaled
              to their enrolled covered lives. As of 2026, Cohere reports serving 17 health plan enterprise clients
              covering approximately 25 million members and processing 47 million plan-provider interactions. Commercial
              growth accelerated through 2025 with the signing of ten new health plan contracts. Beyond core outpatient
              prior authorization, Cohere has expanded into acute inpatient review and post-pay payment integrity,
              creating multi-product bundling opportunities that drive incremental annual contract value across existing
              accounts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI011
      - number: '4.2'
        title: Pricing Architecture and Go-to-Market Economics
        blocks:
          - type: paragraph
            body: >-
              Cohere Health packages its capabilities into modular software applications centered on Cohere Unify,
              Review Assist, Cohere Validate, and Policy Studio. Realized PMPM fee schedules vary according to
              contracted membership volume, line of business (Commercial vs. Medicare Advantage), and module attach
              rates, though exact rate cards remain confidential. In payment integrity, Cohere positions Cohere Validate
              against legacy vendors that operate on 30% or higher contingency fee structures, offering lower
              contingency or hybrid software fees to align payer incentives. The company sales motion targets payer
              enterprise C-suites through direct enterprise sales. However, sales velocity is constrained by extended
              procurement cycles lasting 12 to 24 months, extensive pilot data validation, and complex technical
              integrations with legacy 1990s payer IT infrastructure.
            claimRefs:
              - CI001
              - CI006
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI006
              - CI009
      - number: '4.3'
        title: Cost Structure, Delivery Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The cost structure of Cohere Health blends cloud software hosting expenses with human clinical review
              operations. To ensure clinical safety and regulatory compliance, Cohere automates routine authorization
              determinations for up to 85% of documented submissions while routing the remaining 15% of complex cases to
              licensed physicians and nurses. To manage service-delivery expenses and protect unit economics as
              headcount reached 999 personnel, Cohere established an offshore Global Capability Center in Hyderabad in
              February 2026. This offshore hub provides engineering, data science, and clinical operations support
              outside domestic U.S. wage structures. Cohere reports that its payment integrity platform yields up to an
              8x return on investment for health plans, yet true GAAP software gross margins remain unverified without
              audited COGS disclosure.
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI011
      - number: '4.4'
        title: Capital Adequacy and Financial Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Cohere Health has raised between $196.1 million and $200 million in cumulative equity financing since its
              2019 inception. Its latest financing event, a $90 million Series C closed in May 2025 at $13.71 per share,
              established a post-money valuation of $724.92 million with backing from Temasek, Deerfield Management, and
              Flare Capital Partners. The round carried a standard 1.0x liquidation preference on Series C preferred
              stock. This capital provides substantial runway to support enterprise onboarding and global operations.
              Nonetheless, Cohere Health remains in research-more territory for institutional investors because crucial
              underwriting metrics—including standalone ARR, GAAP gross margins, net revenue retention, and monthly cash
              burn—are closely held private information. Confirmatory financial diligence must inspect audited financial
              statements and customer concentration before underwriting valuation.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Bundling Compresses Standalone Point-Tool Economics
            body: >-
              Cohere Health expansion from prior authorization into inpatient review and payment integrity allows it to
              cross-sell multiple modules under a single master enterprise agreement. By replacing disparate point tools
              and offering an alternative to legacy 30% contingency fee payment integrity vendors, Cohere increases
              customer switching costs and expands annual contract value per health plan.
            calloutType: insight
            claimRefs:
              - CI001
              - CI009
              - CI011
          - type: callout
            title: Extended Payer Sales Cycles and Opaque Margins Require Deep Diligence
            body: >-
              Health plan sales cycles ranging from 12 to 24 months create substantial customer acquisition costs and
              extended working capital lead times. While the Hyderabad Global Capability Center aims to protect unit
              economics, the true software gross margin remains unverified without visibility into clinician reviewer
              staffing expenses versus automated AI decision throughput.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Definition and Core Utilization Management Workflows
        blocks:
          - type: paragraph
            body: >-
              Cohere Health builds and operates a specialized clinical intelligence and utilization management platform
              designed specifically for health plans. Rather than selling directly to provider medical practices as an
              electronic health record plug-in, Cohere operates on the payer side of the transaction, evaluating prior
              authorization submissions against health plan policies and clinical criteria. For health plans utilizing
              Cohere, the platform automates routine intake, evaluates documentation against medical necessity
              guidelines, and issues real-time approvals for up to 85% to 90% of requests that contain complete clinical
              documentation. Crucially, Cohere enforces a binding clinical governance rule: the platform never utilizes
              artificial intelligence or automated machine learning algorithms to issue an authorization denial. When
              incoming requests fail to satisfy automated approval criteria or present ambiguous clinical documentation,
              the platform automatically pends the request for human review by credentialed nurses or physician medical
              directors. However, independent assessments emphasize that while payer-side decision turnaround is
              drastically accelerated, medical practice staff still bear the operational burden of verifying
              requirements, gathering records, and preparing the initial submission.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
