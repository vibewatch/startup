            body: >-
              Despite reporting 17 health plan customers, Cohere Health exhibits significant customer concentration and
              transparency opacity. Approximately 15 of its 17 client health plans remain unnamed in public
              documentation, preventing third-party verification of customer cohort retention, gross revenue retention,
              or contract renewal durability. Furthermore, the company does not disclose net revenue retention (NRR) or
              logo churn metrics. Operational risks also emerge from the CMS WISeR demonstration, where vendors are
              compensated in part based on identified savings from curtailed services, introducing structural scrutiny
              regarding whether automation incentives favor denial volume over clinical necessity. While Cohere
              maintains that human clinicians review all non-approved requests and automated denials are prohibited, the
              lack of external audit reports leaves payer client retention, multi-year contract renewals, and potential
