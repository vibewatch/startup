              - CE013
              - CE014
      - number: '5.2'
        title: Enterprise Solutions Portfolio and Solution Line Architecture
        blocks:
          - type: paragraph
            body: >-
              The core commercial offering is packaged under the Cohere Unify software-as-a-service suite, which can be
              deployed modularly or as an integrated end-to-end platform across commercial, Medicare Advantage, and
              Medicaid books of business. Unify Intake digitizes and consolidates authorization requests across
              disparate intake channels—including web portals, electronic faxes, and direct EHR integrations—converting
              unstructured notes into standardized digital formats. Unify Decisioning applies automated rules logic to
              drive instant approvals while accelerating manual case preparation when clinical review is required. Unify
              Transformation delivers evidence-based clinical guidance at the point of authorization, offering proactive
              care paths and episodic authorizations. In recent releases, Cohere expanded beyond outpatient utilization
              management into acute inpatient care with Cohere Review Assist—which enables clinical reviewers to process
              inpatient requests nearly 50% faster—and pre-pay payment integrity via Cohere Validate, which unifies
              authorization clinical insights with post-care claims data. Furthermore, Cohere Policy Studio provides
              plans with a centralized hub to create, manage, and deploy custom medical policies alongside national
              guidelines, while Cohere Align introduces green lighting analytics to exempt high-performing surgical
              specialists from burdensome prior authorizations.
            claimRefs:
              - CE003
              - CE005
              - CE011
              - CE012
              - CE013
