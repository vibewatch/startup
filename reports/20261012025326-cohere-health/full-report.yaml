      - number: '7.3'
        title: Counterparty Dependencies, Customer Concentration, and Financial Sustainability
        blocks:
          - type: paragraph
            body: >-
              Cohere Health's commercial model depends heavily on enterprise health plan adoption, creating notable
              counterparty concentration risk. Historically anchored by an anchor deployment with Humana, the company
              has scaled to 17 client health plans covering 25 million lives as of 2026. However, provider adoption
              remains tightly coupled to payer rollouts; provider networks realize primary administrative value only
              when their dominant regional health plans mandate or support the Cohere intake platform. On the dependency
              side, Cohere relies on electronic health record (EHR) vendor APIs, cloud infrastructure providers, and
              integration with health plans' legacy core administration and UM platforms. Financially, Cohere has
              secured approximately $200 million in total funding, most recently closing a $90 million Series C round in
              May 2025 at an estimated $724.92 million post-money valuation. Sustaining this valuation requires
              maintaining rapid enterprise expansion and high net revenue retention while absorbing increased corporate
              overhead from offshore expansion and enterprise client integration cycles.
            claimRefs:
              - CR011
              - CR012
