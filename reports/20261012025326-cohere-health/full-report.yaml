      - number: '8.2'
        title: Capital Structure, Financing History, and Valuation Scenarios
        blocks:
          - type: paragraph
            body: >-
              Cohere Health has raised approximately $200 million in cumulative equity financing, anchored by a $90
              million Series C round closed in May 2025 led by Temasek alongside Deerfield Management, Flare Capital
              Partners, Define Ventures, Longitude Capital, and Polaris Partners. Secondary market indicators from Forge
              Global establish a private post-money valuation benchmark of $724.92 million at $13.71 per share with
              standard 1.0x non-participating liquidation preference terms. Industry intelligence suggests the business
              achieved over 60 percent ARR expansion while establishing a Global Capability Center in Hyderabad to
              safeguard unit economics. In our scenario modeling, an illustrative base case projecting $65 million to
              $80 million in ARR yields a forward revenue multiple of 9.0x to 11.2x, which prices in flawless
              operational execution and sustained contract retention. A bull case requires aggressive multi-product
              cross-selling across inpatient and payment integrity modules to justify a valuation exceeding $1.8
              billion, whereas a bear case involving regulatory denial caps or customer concentration losses could force
              valuation multiples downward toward 5.0x.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV013
              - CV014
      - number: '8.3'
        title: Exit Readiness, Diligence Priorities, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Cohere's liquidity trajectory points toward a prospective initial public offering or large-scale strategic
              acquisition by a diversified healthcare technology or payer services enterprise within the next 24 to 36
              months. Secondary platform listings on Forge Global and EquityZen demonstrate ongoing investor interest,
              while pre-IPO governance enhancements—including the appointment of experienced physician-executives to the
              board—signal institutional maturity. Nevertheless, prospective investors must resolve critical diligence
              questions before underwriting new capital at current valuation marks. Key priorities include obtaining
              audited revenue retention waterfalls, verifying unit economics across payment integrity contingency fees,
              and confirming low legal overturn rates on AI-assisted utilization decisions. Primary thesis-break
              triggers include federal regulatory mandates requiring mandatory manual physician review for all
              authorization denials, material contract renegotiations from key health plan partners, or executive
              leadership turnover amidst rapid organizational scaling.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV010
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Research-More on Stretched Valuation'
            body: >-
              While Cohere Health displays undeniable commercial momentum across tier-one health plans, the complete
              lack of verified financial metrics warrants a disciplined research-more posture rather than a premature
              buy recommendation.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
          - type: callout
            title: Core Diligence Requirements
            body: >-
              Before committing growth equity or secondary capital, investors must obtain audited revenue retention
              cohorts, unit gross margins, and regulatory compliance logs regarding denial overturn rates.
            calloutType: risk
            claimRefs:
              - CV007
              - CV013
