      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Algorithmic Scrutiny and the Human-in-the-Loop Safeguard
            body: >-
              As federal regulators and state insurance commissioners intensify oversight of automated healthcare claims
              and prior authorization workflows, Cohere Health's explicit policy of never utilizing AI to issue denials
              serves as its primary regulatory and ethical safeguard. However, preserving clinician oversight as
              authorization volume surges past tens of millions of submissions creates operational staffing requirements
              that could pressure unit economics if automation ratios fail to scale.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR006
          - type: callout
            title: Product Surface Expansion vs. Point-Tool Competitor Squeeze
            body: >-
              Cohere's strategic shift from a standalone prior authorization point tool to a broad clinical intelligence
              suite—encompassing acute inpatient review, policy management, and payment integrity—increases customer
              switching costs and drives upsell ARR. However, it simultaneously exposes the company to execution risks
              across specialized clinical domains where legacy vendors and nimble AI startups compete vigorously.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Cohere Health represents a compelling clinical-intelligence modernization story within healthcare
              utilization management, yet public investment diligence must balance enterprise platform traction against
              substantial valuation opacity. The positive investment thesis rests on Cohere Unify establishing
              mission-critical integration across payer-provider workflows, handling more than 12 million authorization
              requests annually for 600,000 providers with high reported satisfaction. Furthermore, platform expansion
              into acute inpatient review, payment integrity via the ZignaAI acquisition, and HEDIS quality gap closure
              substantially broadens contractual revenue opportunities per health plan client. Conversely, the
              anti-thesis emphasizes mounting regulatory scrutiny over AI-assisted care denials, rapid funding
              acceleration among well-capitalized rivals such as Anterior and Waystar, and potential customer
              concentration risk. Given that Cohere's Series C post-money valuation mark sits at $724.92 million without
              verifiable public disclosures of recurring revenue, net retention, or unit gross margins, we assign a
              recommendation of research-more with medium confidence and a valuation stance of stretched.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
