callouts:
  - calloutType: "risk"
    title: "Algorithmic Scrutiny and the Human-in-the-Loop Safeguard"
    body: "As federal regulators and state insurance commissioners intensify oversight of automated healthcare claims and prior authorization workflows, Cohere Health's explicit policy of never utilizing AI to issue denials serves as its primary regulatory and ethical safeguard. However, preserving clinician oversight as authorization volume surges past tens of millions of submissions creates operational staffing requirements that could pressure unit economics if automation ratios fail to scale."
    claimRefs:
      - "CR002"
      - "CR004"
      - "CR006"
  - calloutType: "insight"
    title: "Product Surface Expansion vs. Point-Tool Competitor Squeeze"
    body: "Cohere's strategic shift from a standalone prior authorization point tool to a broad clinical intelligence suite—encompassing acute inpatient review, policy management, and payment integrity—increases customer switching costs and drives upsell ARR. However, it simultaneously exposes the company to execution risks across specialized clinical domains where legacy vendors and nimble AI startups compete vigorously."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR013"
