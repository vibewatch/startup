evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-undisclosed
    missingEvidence: >-
      Audited financial statements, cap table allocations, and secondary transaction trade logs confirming Cohere's
      post-money valuation.
    whyItMatters: >-
      Reported valuations from secondary platforms like Forge Global ($724.9M) represent modelled share prices rather
      than definitive company-disclosed valuations.
    diligencePath: >-
      Obtain the Series C stock purchase agreement and audited 2025-2026 financial statements during direct management
      diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Complete listing of board committees, voting agreements, and senior executive compensation packages.
    whyItMatters: >-
      Governance disclosures are currently limited to public announcements, obscuring voting control between founders
      and institutional sponsors.
    diligencePath: Review company bylaws, board minutes, and voting agreements in the corporate virtual data room.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Disclosed percentage equity ownership, liquidation waterfall priorities, and board seat allocations across
      institutional investors.
    whyItMatters: >-
      Economic ownership distribution determines voting influence and alignment of incentives across venture and growth
      sponsors.
    diligencePath: Request the latest certified cap table and investor rights agreement directly from company counsel.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-arr-transparency
    missingEvidence: >-
      Detailed contract pricing structures, per-member-per-month (PMPM) rates, software ARR, and net revenue retention
      across Cohere Health's 17 health plan customers.
    whyItMatters: >-
      Without disclosed contract ARR and unit economics, market sizing models cannot definitively establish Cohere's
      software revenue market share versus total managed volume.
    diligencePath: >-
      Request customer contract schedule, pricing tiers (PMPM vs per-transaction vs gainshare), and historical cohort
      expansion rates during management diligence.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: inpatient-um-market-size
    missingEvidence: >-
      Independent third-party market research isolating pure-play software spend on acute inpatient utilization review
      from broader hospital RCM and clinical documentation spend.
    whyItMatters: >-
      Broad market estimates combine provider-side RCM with payer-side UM, making it difficult to isolate the exact
      software addressable market for inpatient review modules.
    diligencePath: >-
      Benchmark health plan IT budget allocations for clinical operations and consult healthcare IT analyst datasets
      focusing specifically on payer-side UM solutions.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Comparable Cohere and peer rate cards, billing units, minimum commitments, realized discounts, service fees, and
      partner revenue-sharing terms.
    whyItMatters: >-
      Without normalized contract economics, the analysis cannot establish a price premium, savings advantage, or
      exposure to pricing commoditization.
    diligencePath: >-
      Review executed customer contracts and a normalized RFP bid set under NDA, separating software, clinical services,
      implementation, and performance fees.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: direct-peer-benchmarking
    missingEvidence: >-
      Direct first-party product, funding, customer, security, and pricing evidence for Anterior, Waystar, named legacy
      payment-integrity vendors, and other shortlisted peers.
    whyItMatters: >-
