        "FE003"
      ]
    },
    {
      "id": "differentiation-and-open-questions",
      "title": "Differentiation, dependencies, and open product questions",
      "body": "Jetti's differentiation is strongest where product design and commercial context intersect. The company appears more standardized than a bespoke metallurgy consultancy because it has modular dosing hardware, repeatable brownfield integration logic, and public scientific support. At the same time, independent literature makes clear that sulphide leaching remains technically difficult and highly sensitive to site conditions. That means Jetti's product is not simply 'plug in and recover copper'; it is better understood as a partially standardized operating system whose performance still depends on ore-specific reality. The moat is therefore hybrid. Patents and publications help. Field know-how, Jetti in a Box lessons, and screening tools like Rosetta may help more. The key open diligence questions are how much performance dispersion exists across sites, how accurate Rosetta predictions really are, and how much field labor or customer hand-holding remains required after the initial sale. Those questions matter directly for both competition and valuation, because repeatability is what turns strong science into durable enterprise value.",
