    {
      "id": "deployment-and-trust",
      "title": "Deployment, maturity, reliability, and trust controls",
      "body": "Jetti's strongest product evidence is practical. The company says it has proven the technology commercially for six years, has applied it to hundreds of millions of tonnes of ore, and can deploy within months of agreement because it integrates into existing mine infrastructure. Capstone's public Pinto Valley results help anchor that maturity claim externally. So does Freeport's treatment of leaching innovation as a strategic production tool. Trust controls are also unusually visible for a private industrial technology firm. Jetti publishes sustainability materials, a code of ethics, and clear claims about reversibility, rehabilitation neutrality, and no additional permitting. Rosetta's informational-only disclaimer is also important because it signals an attempt to avoid overselling predictive outputs as feasibility-study substitutes. The overall picture is of a product that looks commercially real and operationally thoughtful, but one that still relies on disciplined field execution and customer trust at each deployment.",
      "claimRefs": [
        "CE016",
        "CE017",
        "CE018",
        "CE019",
        "CE020",
        "CE021",
        "CE022",
        "CE032"
      ],
