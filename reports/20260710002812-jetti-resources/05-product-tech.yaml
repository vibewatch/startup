  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Jetti\u2019s product is a hybrid system of catalyst chemistry, modular dosing hardware, mine-integration know-how, and predictive support. Public sources show real scientific depth and unusually tangible brownfield deployment design through Jetti in a Box, but independent literature also makes clear that chalcopyrite leaching remains technically sensitive and site-specific. The technology therefore looks differentiated and commercially real, yet its ultimate value still depends on how repeatably it performs across varied mine conditions."
  },
  "sections": [
    {
      "id": "product-definition",
      "title": "Product definition and what the customer actually buys",
      "body": "Jetti's product is more than a reagent and less than a full new mine flowsheet. In customer terms, the offering is a brownfield copper-recovery system that plugs into existing leach and SX-EW infrastructure to unlock copper from primary sulfide material that conventional heap leaching cannot recover economically. The product bundle appears to include proprietary catalyst chemistry, containerized dosing hardware, site-specific operating know-how, and at least one digital decision-support layer in Rosetta. That framing matters because it explains why Jetti is sold to mine operators as a productivity and asset-life extension solution rather than as a generic chemistry license. The company also repeatedly emphasizes that the system works on existing heap and dump leaches, on run-of-mine material, and without a new concentrator or new permits. For diligence, the key implication is that Jetti's 'product' lives inside an operating mine workflow and must therefore be judged on integration, repeatability, and recovery uplift rather than on lab novelty alone.",
      "claimRefs": [
        "CE001",
        "CE002",
        "CE003",
        "CE004",
        "CE005",
        "CE033"
      ],
      "tableRefs": [
