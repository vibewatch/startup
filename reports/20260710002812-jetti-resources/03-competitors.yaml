    {
      "id": "competitor-profiles",
      "title": "Profiles: Jetti versus Nuton versus Ceibo",
      "body": "Nuton's public profile is formidable. It says it can process primary sulphides, greenfield or brownfield, and produce cathode on site, with recoveries of up to 85% under favorable conditions. More importantly, public partner releases show the platform already embedded in industrial-scale programs at Johnson Camp and Yerington, supported by staged funding rather than simple pilot agreements. Ceibo is smaller but still relevant because its public materials and the CoTec profile point to a focused sulphide-leach chemistry, a Chilean operating base, infrastructure-friendly deployment, and a $30 million Series B meant to scale the technology toward a demonstration plant. Jetti, by contrast, has the strongest publicly documented brownfield commercial proof via Capstone's Pinto Valley and a second Freeport-linked deployment path at El Abra, but it does not publicly show a Rio-scale portfolio or project-funding machine. The competitive takeaway is that Jetti is credible, Nuton is resource-rich, and Ceibo is a focused specialist rather than a fringe startup.",
