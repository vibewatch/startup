  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Jetti competes in a narrow but increasingly serious sulphide-leach field. Jetti currently has some of the clearest public brownfield proof through Pinto Valley and Freeport-linked deployments, but Rio Tinto\u2019s Nuton is the strongest direct threat because it pairs competing sulphide technology with corporate scale, staged project funding, and multiple mine-development pathways. Ceibo is smaller but credible, while the conventional concentrator route and internal-build strategies remain the most important substitutes when mine economics or balance-sheet preferences favor larger capex solutions."
  },
  "sections": [
    {
      "id": "competitive-landscape",
      "title": "Landscape: who actually competes with Jetti",
      "body": "Jetti's true competitors are not generic mining analytics vendors; they are technologies and project pathways that attempt to unlock copper from primary sulphide resources more economically than the status quo. The direct set is still small but serious. Rio Tinto's Nuton is the clearest heavyweight threat because it is pursuing the same primary-sulphide problem with a bioleach portfolio, corporate backing, and multiple mine-development partnerships. Ceibo is the clearest startup analogue because it also promises recovery from low-grade primary sulphides and waste material while emphasizing integration into existing mine infrastructure. Around that direct set sits the broader substitute landscape: the conventional concentrator-and-smelter route for primary sulphides, internal development by major miners, and project-level decisions to defer recovery until economics improve. This framing matters because a miner rarely chooses between Jetti and software; it chooses between Jetti, another sulphide-leach route, a bigger capex processing route, or doing nothing. The category therefore looks more like contested industrial process innovation than standard SaaS competition.",
