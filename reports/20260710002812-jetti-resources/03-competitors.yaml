    {
      "id": "moat-durability",
      "title": "Moat durability and where Jetti could still lose",
      "body": "Jetti does have a real moat case, but it is conditional rather than absolute. Its moat comes from patents, published scientific work, brownfield retrofit credibility, and commercial history at actual mine sites. Those are meaningful advantages in a technically difficult category. Yet the same category difficulty cuts both ways. Independent literature continues to describe chalcopyrite leaching as complex, variable, and prone to passivation or kinetic problems. That means even a company with proof at one site must still win confidence ore body by ore body. Nuton's threat is not just performance marketing; it is the combination of Rio's balance sheet, multiple project options, and structured funding agreements that can outcompete a pure vendor model. Ceibo's threat is smaller but still relevant if a buyer wants a tailored Chile-based partner. The absence of public win/loss data and commercial pricing remains the main diligence blocker. Jetti's competitive edge is real today, but it could narrow if rival technologies secure more repeated brownfield wins or if miners decide integrated project capital matters more than retrofit-specific experience.",
