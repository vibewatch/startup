  topStrengths:
    - Jetti 切入战略上重要的铜供应瓶颈，价值主张清楚：围绕现有浸出和 SX-EW 基础设施提升棕地资产价值。
    - Pinto Valley 的公开客户证据，加上更多与 Freeport 相关的引用，让公司的商业可信度高于许多工业科技初创公司。
    - 投资方同时包括矿业与供应链战略资本和机构资金，股权结构质量和未来融资选择都更好。
    - 科学论文、专利和模块化部署设计共同支撑了真实产品护城河，不只是营销叙事。
  topRisks:
    - 技术能否跨矿体重复跑通仍是主风险，也是估值不确定性最大的来源。
    - 公开客户证据仍集中在少数大型矿业集团，带来实质性的集中度和扩张风险。
    - 按当前估值做干净的私募市场承接，公开收入、利润率、现金跑道、合同结构和股权权利披露都远远不够。
    - Rio 支持的 Nuton 和其他硫化矿浸出路线如果更快扩大验证，或绑定更多项目资本，可能压缩 Jetti 的未来护城河。
  unresolvedGaps:
    - 经审计财务、月度收入桥、毛利率数据和现金跑道能见度。
    - 客户合同类型、定价机制、性能保证和追索条款。
    - 所有站点的部署评分卡和回收率分布，而不只是旗舰案例。
    - 按收入计的客户集中度、更广泛管线转化数据，以及已具名的未来参考客户。
    - 判断真实进入经济性所需的股权结构、稀释、优先股堆叠和治理权细节。
