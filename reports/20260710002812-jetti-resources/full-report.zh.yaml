              依赖专利支撑的诀窍；如果硫化矿浸出领域变得更拥挤，公司很可能需要捍卫运营自由。场站层面的运营风险栈很重：钝化、酸耗、渗透性、公用工程依赖，以及严格 SX-EW 集成都可能影响结果。Jetti
              关于无需额外许可、可逆性和存量矿山适配的主张是有帮助的缓释因素，Rosetta
              免责声明也显示了对预测确定性的克制。不过，公开资料没有提供矿山特定审批矩阵、保险细节，或表现不达预期时的客户追索条款。因此，法律和监管故事与其说是“已知公开危机”，不如说是“不透明但很可能重要的实施细节”。这个区别很重要，因为尽调应聚焦隐藏的合同、许可和场站接口风险，而不是耸动的公开标题。
