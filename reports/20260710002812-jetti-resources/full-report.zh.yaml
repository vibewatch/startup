  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险与真正最重要的问题
        blocks:
          - type: paragraph
            body: >-
              Jetti
              最重要的风险不是泛泛的初创公司风险，而是要把技术敏感的采矿流程扩展到少数超大型客户场站时形成的特定执行和集中度风险。独立文献明确指出，原生硫化矿堆浸仍然困难且高度依赖场站。这一个事实驱动了其余风险图谱。如果表现没有最佳公开案例暗示的那么可重复，客户扩张会放慢，收入质量会变弱，融资预期也更难支撑。因此，技术可重复性应排在更抽象担忧之上。下一层包括客户集中度和竞争替代，因为公开验证狭窄，而且
              Rio 背书的 Nuton
              推进很快。治理和法律风险也重要，但当前公开证据显示的更多是不确定性，而不是危机。正确框架是一个集中的工业技术风险栈：如果部署可以重复，上行很高；如果技术差异或披露缺口削弱市场信心，惩罚也很陡。
