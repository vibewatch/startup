      - number: '8.4'
        title: 最终建议、放弃触发点与尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终建议不是避开 Jetti，而是拒绝偷懒式投资论证。相较许多工业技术初创公司，Jetti
              看起来战略重要性高、技术可信度强，也已经消化了不少风险。这足以支持认真接触，但不足以让投资人暂停估值纪律。打破核心论点的信号很直接：反复出现客户经济性无法泛化的证据；客户集中持续、没有分散；在硫化矿浸出平台竞争中输给对手；或者一次融资事件披露出比当前公开估值标记更弱的商业图景。下一步尽调要求也同样清楚：经审计财务、合同结构、部署记分卡、客户集中度和股权结构权利。投资人还应追问管理层：当前私募估值如何对应预期退出路径；这些路径是依赖战略收购、继续私募扩张，还是最终具备公开市场准备度。在这些问题得到回答之前，最佳投资立场是继续研究：战略兴趣高、置信度中等、风险高，并且估值偏紧。
