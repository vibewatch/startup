              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.3'
        title: 牛市、基准、熊市情形与不完美可比对象
        blocks:
          - type: paragraph
            body: >-
              情景分析比单点估值更有用。牛市情形里，Jetti 把当前验证转化为多个新增矿山运营商合作，证明存量矿山经济性可以跨矿体重复，并靠股东结构和 IP 守住定价权；这可能支撑明显更高的战略估值。基准情形里，Jetti
              仍然有价值、也是真实业务，但增长更慢，信息不透明和客户集中继续存在，当前估值附近只能算合理，而不是便宜。熊市情形里，技术差异、竞争对手取得进展，或客户依赖过度集中，都会挡住更大规模化，也会暴露当前估值过于乐观。直接可比公司很弱，因为
              Ceibo 的融资规模、Nuton 的项目融资，都不能完整说明 Jetti 的平台价值。即便如此，这些参照仍能帮助界定阶段、牵引力和竞争强度。这个问题更像里程碑价值判断，而不是整齐套用公开市场倍数。
