      - number: '2.3'
        title: 买方分层、预算归属与采用驱动
        blocks:
          - type: paragraph
            body: >-
              最合逻辑的第一类买方是既有铜矿运营商，而不是下游 OEM 或投机性开发商。Capstone 的 Pinto Valley 和 Freeport 的 El Abra
              是最清晰模板：两者都有运营中的场站、现有基础设施，以及未使用或使用不足、可比新建矿山更快变现的 SX-EW
              价值。在这些运营中，矿山管理层和集团领导层实质承担付款方角色，因为他们决定改造能否跨过内部资本门槛；冶金和运营团队是用户，因为他们必须实施、监控并放大这套化学方案。因此，最强采用驱动来自矿山侧经济性和战略性铜稀缺，而不是单靠可持续叙事。话虽如此，下游需求仍然重要，因为
              BMW 等投资人和大型矿商都把电气化、EV
              和低碳供应链列为关注原因。当铜需求在结构上更难满足，且存量项目面对的利益相关方路径比新建矿山更简单时，可触达买方池就会扩大。只要增量铜量能来自已经拥有许可证、员工队伍和处理厂的场站，Jetti
              的市场就更有说服力。
