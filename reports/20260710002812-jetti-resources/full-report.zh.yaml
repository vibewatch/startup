        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Jetti 的正面叙事少见地容易讲清：铜具备结构性重要性，原生硫化矿是一大批被搁置的资源，Jetti 又拿出了这一类里最清晰的公开存量矿山验证样本之一。这不是小事。BMW
              等战略投资者，以及与大型矿企的关系，都说明，如果电气化继续推紧铜供应，Jetti
              站在价值链里一个关键位置。但反面论点同样清楚：公开收入披露稀薄，客户验证仍然集中；技术敏感的采矿工艺公司不能只因为宏观故事好，就获得无限宽容。公开估值信号约 US$2.5 billion 后，争论已经不再是
              Jetti 有没有潜力，而是相对于公开证据能支撑的程度，市场是否已经把太多潜力计入价格。本章后文因此把估值看成两股力量的平衡：真实的战略期权价值，以及仍然不小的执行风险。
