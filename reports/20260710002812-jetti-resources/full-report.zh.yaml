        title: 资本基础、投资人地图与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Jetti 的融资历史显示，公司吸引的是越来越战略的资本，而不是普通创投资金。2021 年 6 月 Series C 引入 Mitsubishi、Freeport-McMoRan、BHP
              Ventures、Orion Resource Partners 和 T. Rowe Price 关联基金；管理层称，该轮之后公司累计融资已超过 $100 million。2022 年 10 月 Series D
              又增加 $100 million，由 T. Rowe Price 基金领投，Rothschild & Co 和现有投资人参与。BMW i Ventures 随后在 2022 年 12 月披露自身持股，明确把
              Jetti 技术与未来 EV 铜需求和更低环境足迹供应链联系起来。尽管第三方数据集对精确总额看法不一，这些官方轮次已经意味着累计融资超过 $200 million。公开规模指标同样混合。Growjo 估算约 53
              名员工和 $11.3 million 年收入，Forge 和 CoTec 则都支持 2026 年约 $2.5 billion
