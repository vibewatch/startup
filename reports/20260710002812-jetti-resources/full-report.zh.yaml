  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户实际购买的东西
        blocks:
          - type: paragraph
            body: >-
              Jetti 的产品不只是试剂，也不是完整的新矿山工艺流程。站在客户视角，购买的是一套存量铜回收系统：它接入现有堆浸和 SX-EW
              基础设施，从常规堆浸无法经济回收的原生硫化矿物料中释放铜。产品包似乎包括专有催化剂化学、集装箱化加药硬件、场站特定运营诀窍，以及 Rosetta 这一至少一层数字决策支持。这个框架重要，因为它解释了为什么
              Jetti 被卖给矿山运营商时，是生产率和资产寿命延长方案，而不是通用化学许可。公司也反复强调，系统可用于现有堆浸和废石堆浸、原矿物料，并且不需要新选矿厂或新许可。对尽调来说，关键含义是：Jetti
              的“产品”嵌在运营矿山工作流里，因此必须按集成、可重复性和回收率提升来判断，而不能只看实验室新颖性。
