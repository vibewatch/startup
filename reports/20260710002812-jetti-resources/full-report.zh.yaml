            body: >-
              Nuton 的公开画像很强。它称自己可以处理原生硫化矿，无论新建还是存量项目，并能在现场生产阴极铜；在有利条件下，回收率最高可达 85%。更重要的是，公开伙伴公告显示，该平台已经嵌入 Johnson Camp 和
              Yerington 的工业规模项目，并由分阶段资金支持，而不是简单试点协议。Ceibo 规模更小，但仍然相关，因为其公开材料和 CoTec 画像指向聚焦的硫化矿浸出化学、Chile
              运营基地、友好接入基础设施的部署方式，以及一轮用于把技术推向示范工厂的 $30 million Series B。相比之下，Jetti 通过 Capstone 的 Pinto Valley 和 El Abra
              第二条 Freeport 相关部署路径，拥有公开记录最强的存量矿山商业验证；但它没有公开展示 Rio 级别的项目组合或项目融资机器。竞争结论是：Jetti 可信，Nuton 资源充足，Ceibo
              是聚焦型专家，而不是边缘初创公司。
