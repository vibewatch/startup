  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：谁真正与 Jetti 竞争
        blocks:
          - type: paragraph
            body: >-
              Jetti 真正的竞争对手不是通用矿业分析厂商，而是那些试图比现状更经济地释放原生硫化矿铜资源的技术和项目路径。直接竞争集合仍小，但很严肃。Rio Tinto 的 Nuton
              是最清晰的重量级威胁，因为它正用生物浸出组合、集团背书和多个矿山开发伙伴关系解决同一个原生硫化矿问题。Ceibo
              是最清晰的初创公司对应样本，因为它同样承诺从低品位原生硫化矿和废石物料中提高回收，并强调接入现有矿山基础设施。围绕这个直接集合的，是更宽的替代方案格局：原生硫化矿的传统选矿厂加冶炼路线、大型矿商内部开发，以及项目层面决定延后回收、等待经济性改善。这个框架重要，因为矿商很少在
              Jetti 和软件之间做选择；它在 Jetti、另一条硫化矿浸出路线、资本开支更大的处理路线，以及什么都不做之间选择。因此，这个品类更像是竞争中的工业流程创新，而不是标准 SaaS 竞争。
