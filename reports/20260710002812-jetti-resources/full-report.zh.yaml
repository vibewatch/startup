      - number: '3.4'
        title: 护城河耐久性与 Jetti 仍可能输在哪里
        blocks:
          - type: paragraph
            body: >-
              Jetti
              确实有真实护城河逻辑，但它是有条件的，不是绝对的。护城河来自专利、发表的科学成果、存量矿山改造可信度，以及实际矿山场站的商业历史。这些都是技术难度高的品类里的重要优势。但同一个品类难度也会反噬。独立文献继续把黄铜矿浸出描述为复杂、可变，且容易出现钝化或动力学问题。也就是说，即便一家公司在一个场站已有验证，仍必须按矿体逐个赢得信任。Nuton
              的威胁不只是性能营销；它是 Rio 的资产负债表、多个项目选项和结构化融资协议的组合，可能压过纯供应商模式。Ceibo 的威胁更小，但如果买方想要一个以 Chile
              为基地的定制化伙伴，它仍然相关。缺少公开胜负数据和商业定价，仍是主要尽调阻碍。Jetti
