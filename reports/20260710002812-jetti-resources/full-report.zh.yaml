              把加药设备封装成模块化工厂，只需要接入萃余液、水、电和排污接口。第三是运营工作流层：评估矿石、签署协议、安装模块化工厂，并把催化剂加药接入现有浸出循环和 SX-EW 回收。第四是数字层：Rosetta
              似乎帮助筛选技术可能表现良好的位置。公开科学论文、UBC 合作和专利记录，让这套架构在私有矿业技术公司中显得厚度不同寻常。它们不能证明每个场站都会表现相同，但确实显示 Jetti
