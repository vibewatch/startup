companyProfile:
  summary: >-
    Jetti Resources 是一家总部位于 Boulder 的私有矿业技术公司，2014 年成立，目标是帮助铜矿商借助专有催化剂化学、模块化加药硬件和因地制宜的运营诀窍，从低品位原生硫化矿中回收阴极铜。公开证据支持其在
    Capstone Copper 的 Pinto Valley 已具备真实存量矿山商业相关性，并有更多 Freeport 相关部署和强战略投资人基础；但相对于当前市场画像所隐含的估值，披露深度仍然是私有公司水平，偏轻。
