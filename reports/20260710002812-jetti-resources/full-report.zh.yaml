  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与客户真正购买的问题
        blocks:
          - type: paragraph
            body: >-
              如果把 Jetti 的市场讲得过宽，就最容易误判。公司不是在销售通用矿业软件产品，不是在开发一座新建铜矿，甚至也不是为所有铜矿体提供通用冶金方案。它真正的市场更窄，也更可防守：已经运行堆浸和 SX-EW
              回路的存量铜矿运营方，拥有滞留在堆存物料或废石中的原生硫化矿，并且可以在不新建选矿厂的情况下证明增量阴极铜产量的经济性。这个边界排除了铜价值链的大部分环节，包括冶炼、精炼、精矿物流和新建项目开发。没有浸出基础设施的矿山也被排除在外，因为
              Jetti 的商业说法依赖“用已有资产”。这个市场重要，是因为全球约 70%
              的铜资源仍处在低品位原生硫化矿中。资源基数巨大，但近期可服务市场小得多：只有矿物学、基础设施和经济性都让改造具备吸引力的那部分矿山场站。
