chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局，以及公司实际做什么
        blocks:
          - type: paragraph
            body: >-
              Jetti Resources
              更应被理解为矿山现场铜回收技术公司，而不是新建矿山开发商。它的公开材料始终围绕一个窄但有价值的用例展开：帮助成熟铜生产商从低品位原生硫化矿中回收更多阴极铜，而常规堆浸无法经济地处理这些矿石。这个定位重要，因为它把公司绑定到现有矿山基础设施、现有堆存物料和现有溶剂萃取-电积回路，而不是高风险的新建矿山。运营布局也支撑这一叙事。Jetti
              联系页列出 Boulder 为公司总部、Vancouver 为技术和研发中心、Santiago 为位于铜产业腹地的区域总部。公司技术页面称，Jetti 已测试来自 30
              多座矿山的矿石，并搭建出一种方案，无需新许可或工艺流程重设计即可用于堆浸和废石堆浸。因此，公司的商业身份更接近工业流程增强器，而不是传统矿山运营商；价值主张集中在增量铜量、更快部署和低资本强度。
