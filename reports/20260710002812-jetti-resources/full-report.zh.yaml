  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开资料真正能说明什么
        blocks:
          - type: paragraph
            body: >-
              Jetti 的公开财务披露很薄，但商业模式并非不可见。公司反复把自己描述为已商业验证、协议后数月内可部署，并且以带有可衡量 KPI 的标准化商业安排销售。这个框架强烈暗示，Jetti
              在变现矿山现场部署，而不是出售纯咨询工时或直接承担大宗商品价格敞口。Jetti in a Box 系统进一步意味着一套打包方案：物理加药设备、化学部署和运营支持。资料没有说明的内容同样重要：没有公开细节说明
              Jetti 收取预付设备费、经常性催化剂或服务费、收益分成、类特许权费结构，还是四者的某种组合。换句话说，公开记录足以证明 Jetti
              有真实商业化模式，但不足以支撑收入质量或收入确认机制判断。私有工业技术公司尤其需要区分这一点，因为可复制性和合同结构将决定客户价值最终有多少真正变成 Jetti 收入。
