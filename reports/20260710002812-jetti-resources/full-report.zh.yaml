      - number: '2.2'
        title: 多个测算镜头：资源基数、供给缺口与矿山层面经济性
        blocks:
          - type: paragraph
            body: >-
              公开可得的最佳市场规模镜头，是 Jetti 引用的 CRU 研究，而不是宽泛的 AI 矿业 TAM 演示稿。该研究估算，到 2050 年累计可触达铜资源为 234 million 吨，2021 年按年折算为
              4.9 million 吨，2034 年在约 7.2 million 吨见顶，2050 年仍高于 5 million 吨。与今天全球矿山产量约 22 million 吨相比，这些数字很大。它们不意味着 Jetti
              可以拿下全部机会；它们说明，只要存在可行流程，这类资源就具备经济相关性。更广泛的需求研究强化了宏观需求。BHP 预计，到 2050 年铜需求将增长约 70%，达到每年超过 50 million
              吨，并称未来十年全球每年需要约 10 million 吨新增矿产供应。Jetti
              的相关性来自为这个缺口提供存量矿山供给楔子。因此，市场既要自上而下测算，依托铜需求增长和硫化矿资源基数；也要自下而上测算，依托现有浸出运营的场站级改造经济性。
