      - number: '2.4'
        title: 采用约束与仍待回答的市场问题
        blocks:
          - type: paragraph
            body: >-
              难点不在证明铜市场很大，而在证明场站级采用可以可靠放大。独立技术资料已经说明原因。堆浸表现取决于矿石差异、渗透性、试剂分布、氧化还原控制、温度和环境管理。黄铜矿仍容易钝化，提高回收率往往也会推高酸耗。BHP
              的行业观点又增加了一层摩擦：即便是棕地项目，资本强度、利益相关方复杂性和工期延误也在上升。因此，不能把市场核保成每一个硫化矿堆都能用标准模板变成商业铜。Jetti
              自身强调试点、矿石测试和逐项目部署，等于也承认了这一点。最重要的剩余尽调缺口，是今天到底有多少现有堆浸 / SX-EW 场站能通过矿山特定经济性测试。没有这个分母，TAM 看起来很大，但 SAM 和 SOM
              仍然依赖判断。结论有吸引力，但有条件：市场真实、结构上重要且在增长，但采用会是选择性的、技术要求高的，而不是自动发生。
