        title: 当前估值背景与建议立场
        blocks:
          - type: paragraph
            body: >-
              当前估值已经处在高位。Forge 2026 年 6 月给出的 US$2.5 billion 信号，再加上其他私募市场资料的方向性支撑，已经把 Jetti
              稳稳推入独角兽区间。从战略角度看，这个溢价并不荒唐：公开可佐证的融资超过 US$200 million，来自严肃投资者；铜的市场顺风真实存在；公司也点名披露了商业验证。但价格纪律仍然重要。Growjo
              低置信度的收入估计，即便只在方向上成立，也意味着收入倍数只有在一种情况下才说得通：Jetti
              能把标杆场址的成功复制到更广的组合，并守住强定价权和可持续利润率。这有可能，但公开证据还没有证明。最可支撑的立场因此是带估值警惕的积极关注：把 Jetti
              放在尽调清单的高优先级，但在把当前价格视为有吸引力之前，要求更好的数据或更好的入场条款。公开披露广度和行业认可都是加分项，但不能替代经审计财务和合同证据。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV033
              - CV034
              - CV035
              - CV036
