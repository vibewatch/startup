        title: 领导团队、创始人与治理不确定性
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据既显示深度，也留下不确定性。Forge 将 Mike Outwin 和 Andrew Perlman 标为联合创始人，团队页则显示管理层覆盖冶金、工程、运营、项目、法务和财务。Nelson Mora
              的履历尤其重要，因为它证明公司拥有高级技术负责人，且直接具备 Vale、Xstrata Copper 和 BHP Billiton 的堆浸与基本金属流程经验。治理也随时间增强：Danny Malchuk 2023
              年由董事转任董事长，董事会信息把他的任命直接与扩大铜生产商关系挂钩。关键复杂点在 CEO 记录。Jetti 正式宣布 John Slaven 自 2024 年 10 月起担任 CEO，但本报告访问的当前团队页列
              Nelson Mora 为代理 CEO 兼
              CTO。这个不一致不会推翻运营论点，却形成了围绕继任、董事会决策以及当前谁承担商业责任的尽调事项。工业技术公司的采用周期依赖大型矿山运营商的信任，任何未解释的领导层变化都很重要。
