              信号本身并非灾难，但在依赖信任的企业销售流程中，它会提高不确定性的成本。财务模型风险更直接。公开融资额足够清楚，但公开收入、利润率、现金和债务数据并不清楚。这让一家私有公司拥有独角兽级定价，却没有公开途径判断增长、利润率和融资需求是在收敛还是背离。结果是，披露缺口放大了运营不确定性：投资人不只需要
