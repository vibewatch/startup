        title: 财务结论与仍阻碍核保的事项
        blocks:
          - type: paragraph
            body: >-
              财务结论有吸引力，但不完整。Jetti 看起来像一家资本充足的工业技术公司，拥有战略背书、诱人的客户经济性，以及围绕可重复存量矿山部署设计的商业模式，而不是一次性发明。如果公司真能把 Jetti in a Box
              部署标准化，并从矿山侧价值中拿到有意义份额，经济上行空间可能相当可观。但核保阻碍很实质。公开资料不披露现金余额、烧钱速度、现金可支撑期、债务、营运资本、合同结构或毛利率。即便可得收入数字也是外部估计，不是管理层披露。这意味着，投资人可以支持“存在一门有真实商业牵引的真实业务”这一判断，却仍缺少判断收入质量和利润率耐久性所需的信息。因此，本章支持建设性但谨慎的结论：Jetti
              看起来具备足够财务可信度，值得认真关注；但只有私有尽调确认客户侧经济性可以转化为可重复、高质量的公司收入，估值才站得住。
