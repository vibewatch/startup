            body: >-
              Jetti 公开记录里最强的财务证据不是公司 P&L，而是客户侧经济性。Jetti 称，其部署的资本强度远低于每年新增产量每吨 US$1,500，运营成本低于每磅
              US$1.50。公司还称，技术能接入现有基础设施、不需要额外许可，并能在商业协议后约三个月内完成物理部署。Capstone 的 Pinto Valley
              案例提供了关键外部验证，因为它声称第一年单位灌溉面积阴极铜产量翻倍，并打开未来二十年增加 300-350 million 磅阴极铜的路径。这让收入模式在原则上可以理解：如果 Jetti
              能在现有矿山反复创造这类价值，客户就应该愿意支付有意义的经济回报。GTM
              压力在于，达成商业协议很可能需要漫长技术尽调、矿石测试和场站特定设计。因此，财务故事是一种混合：前端是长周期工业销售，交易真正签下后则可能较快兑现价值。
