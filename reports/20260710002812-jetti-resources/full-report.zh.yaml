      - number: '3.3'
        title: 转换成本、渠道与中标因素
        blocks:
          - type: paragraph
            body: >-
              矿山现场采用靠信任、场站适配和运营可信度赢下，而不是靠营销。Jetti 的伙伴关系露出很重要，因为它显示了与 Freeport、BHP、Teck 和 Mitsubishi 的关系，而 Capstone
              提供了具体的公开验证案例。这些信号降低了买方担心 Jetti 尚未被验证的心理成本。不过，Nuton 可能拥有更强的渠道引擎，因为 Rio
              可以用内部技术能力、项目资本和不断扩大的伙伴矿山集合来支撑该技术。Lion 和 Gunnison 的公开公告显示，Nuton
              通过分阶段资金、合资权利和开发协议锁定部署选项。这可能具备强战略价值，因为它让商业包不只是一套化学方案。一旦矿山承诺采用，转换成本会迅速升高：矿石测试、流程控制、灌溉设计、环境规划和运营例行流程都会变成路径依赖。矿商在研究阶段可能比较几家供应商，但不太可能在同一资产上以完整商业规模运行多个相互竞争的浸出平台。因此，渠道从可信度开始，以黏性的技术集成结束。
