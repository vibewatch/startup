  topStrengths:
    - >-
      Jetti addresses a strategically important copper-supply bottleneck with a clear brownfield value proposition tied
      to existing leach and SX-EW infrastructure.
    - >-
      Public customer proof at Pinto Valley and additional Freeport-linked references make the company more commercially
      credible than many industrial-technology startups.
    - >-
      The investor roster combines strategic mining and supply-chain capital with institutional backing, improving
      cap-table quality and future-financing optionality.
    - >-
      Scientific publications, patents, and modular deployment design support a real product moat beyond pure marketing
      narrative.
  topRisks:
    - Technical repeatability across ore bodies remains the master risk and the biggest driver of valuation uncertainty.
    - >-
      Public customer proof is still concentrated in a small number of major mining groups, creating meaningful
      concentration and expansion risk.
    - >-
      Public revenue, margin, runway, contract structure, and cap-table-rights disclosure remain far too thin for clean
      private-market underwriting at the current mark.
    - >-
      Rio-backed Nuton and other sulphide-leach routes can compress Jetti's future moat if they broaden proof faster or
      bundle more project capital.
  unresolvedGaps:
    - Audited financials, monthly revenue bridges, gross-margin data, and cash-runway visibility.
    - Customer contract archetypes, pricing mechanics, performance guarantees, and recourse terms.
    - Deployment scorecards and recovery distributions across all sites, not just flagship references.
    - Customer concentration by revenue, conversion data across the broader pipeline, and named future references.
    - Cap-table, dilution, preference-stack, and governance-rights detail needed to judge true entry economics.
