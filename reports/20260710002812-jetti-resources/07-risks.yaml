    {
      "id": "partner-people-financial",
      "title": "Partner dependency, people risk, and financial-model risk",
      "body": "Jetti's commercial progress is tied closely to a few partners, a few sites, and a still-private financial model. That is not unusual for a mining technology company, but it does create fragility. Capstone and Freeport-linked sites dominate the public proof set, while Nuton's rise shows that strategic partners can also become strategic threats through alternative technology pathways. On the people side, the unresolved CEO signal is not catastrophic on its own, but it does raise the cost of ambiguity in a trust-driven enterprise sales process. Financial-model risk is even more direct. Public capital raised is clear enough, yet public revenue, margin, cash, and debt data are not. That leaves a private company with unicorn-scale pricing but no public way to judge whether growth, margin, and financing needs are converging or diverging. The result is a risk profile where disclosure gaps amplify operating uncertainty: investors do not just need Jetti to work technically, they need it to scale commercially in ways public sources cannot yet verify.",
