  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Jetti\u2019s risk profile is dominated by technical repeatability, customer concentration, competitive displacement by better-capitalized rivals, and sparse public financial disclosure. Regulatory and legal risks are less visible in current public evidence than execution risks, but that likely reflects opacity rather than irrelevance. The thesis remains investable only if private diligence confirms that site-level performance, contract structure, and revenue quality are more robust than public sources can currently prove."
  },
  "sections": [
    {
      "id": "risk-ranking",
      "title": "Severity-ranked risks and what actually matters most",
      "body": "The most important risks around Jetti are not generic startup risks; they are the specific execution and concentration risks created by trying to scale a technically sensitive mining process across a small number of very large customer sites. Independent literature makes clear that primary-sulphide heap leaching remains difficult and site specific. That single fact drives the rest of the risk map. If performance is less repeatable than the best public cases suggest, customer expansion slows, revenue quality weakens, and financing expectations become harder to support. This is why technical repeatability should be ranked above more abstract concerns. The next tier includes customer concentration and competitive displacement, because public proof is narrow and because Rio-backed Nuton is moving quickly. Governance and legal risks matter too, but current public evidence shows more ambiguity than crisis. The right framing is a concentrated industrial-technology risk stack: high upside if deployments repeat, but a steep penalty if technical variance or disclosure gaps undermine market confidence.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR006",
        "CR009",
        "CR019",
        "CR020",
        "CR030",
        "CR040"
      ],
