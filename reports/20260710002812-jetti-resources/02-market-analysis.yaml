  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Jetti competes in a narrow but important brownfield copper-recovery market: existing leach and SX-EW operations that hold stranded primary sulfide material. Jetti-cited CRU work sizes that resource opportunity at 234 million tonnes of contained copper through 2050, while BHP expects global copper demand to grow roughly 70% to more than 50 million tonnes per year by 2050 and warns that about 10 million tonnes per year of new mined supply will be needed in the next decade. The market opportunity is real, but adoption remains selective because ore variability, passivation, acid consumption, brownfield capex, and permitting complexity still determine whether a given site clears mine-level economics."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and the real problem being bought",
      "body": "Jetti's market is easiest to misunderstand when it is described too broadly. The company is not trying to sell a general-purpose mining software product, a new greenfield copper mine, or even a universal metallurgy solution for every copper ore body. Its real market is narrower and more defensible: brownfield copper operations that already run heap leaching and SX-EW circuits, have stranded primary sulfide material in stockpiles or waste, and can justify incremental cathode production without building a new concentrator. That boundary excludes most of the copper value chain, including smelting, refining, concentrate logistics, and greenfield project development. It also excludes mines without leach infrastructure, because Jetti's commercial pitch relies on using what is already there. The market matters because around 70% of the world's copper resources remain in low-grade primary sulfides. That makes the resource base enormous, but the near-term serviceable market is much smaller: only the subset of mine sites whose mineralogy, infrastructure, and economics make a retrofit attractive.",
      "claimRefs": [
        "CM001",
        "CM002",
