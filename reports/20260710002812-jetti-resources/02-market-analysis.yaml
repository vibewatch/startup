    {
      "id": "market-sizing",
      "title": "Multiple sizing lenses: resource base, supply gap, and mine-level economics",
      "body": "The best publicly available market-size lens is the CRU study cited by Jetti rather than a broad AI-in-mining TAM deck. That study estimates 234 million tonnes of cumulative addressable copper through 2050, annualized at 4.9 million tonnes in 2021, peaking around 7.2 million tonnes in 2034, and still above 5 million tonnes in 2050. Those are large numbers when set against today's roughly 22 million tonnes of world mine production. They do not mean Jetti can capture all of that opportunity; they do show that the resource class is economically relevant if a workable process exists. Broader demand studies reinforce the macro need. BHP expects copper demand to grow roughly 70% to more than 50 million tonnes a year by 2050 and says the world needs about 10 million tonnes per year of new mined supply over the next decade. Jetti's relevance comes from offering a brownfield supply wedge into that gap. The market therefore has to be sized both top-down, through copper-demand growth and the sulphide resource base, and bottom-up, through site-specific retrofit economics at existing leach operations.",
