            claimRefs:
              - CV020
              - CV021
              - CV031
              - CV038
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.4'
        title: Final recommendation, kill triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The final recommendation is not to avoid Jetti, but to refuse lazy underwriting. The company looks
              strategically important, technically credible, and meaningfully de-risked relative to many
              industrial-technology startups. That justifies serious engagement. It does not justify suspending
              valuation discipline. The key thesis-break signals are straightforward: repeated evidence that customer
              economics do not generalize, continued concentration without diversification, competitive losses to rival
              sulphide-leach platforms, or a financing event that reveals a weaker commercial picture than the current
              public mark suggests. The key next-step diligence asks are equally clear: audited financials, contract
              structure, deployment scorecards, customer concentration, and cap-table rights. Investors should also
              press management on how current private marks map to expected exit pathways and whether those pathways
              depend on strategic acquisition, continued private scaling, or eventual public-market readiness. Until
              those are answered, the best investment stance is research-more with high strategic interest, medium
              confidence, high risk, and a stretched valuation view.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV040
              - CV041
              - CV042
