      - number: '7.2'
        title: Regulatory, legal, and operational risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not point to a visible litigation or enforcement event, but it does show several
              meaningful legal and operational exposures. Jetti depends on patent-backed know-how and would likely need
              to defend freedom to operate if the sulphide-leach field gets more crowded. At the site level, the
              operational risk stack is substantial: passivation, acid consumption, permeability, utility dependence,
              and the need for disciplined SX-EW integration can all affect outcomes. Jetti's claims around no
              additional permitting, reversibility, and brownfield fit are helpful mitigants, and the Rosetta disclaimer
              shows some restraint about predictive certainty. Still, public sources do not provide mine-specific
              approval matrices, insurance detail, or customer recourse terms if performance disappoints. So the legal
              and regulatory story is less 'known public crisis' and more 'opaque but likely important implementation
              detail.' That distinction matters because it means diligence should focus on hidden contract, permitting,
              and site-interface risks rather than on sensational public headlines.
