  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risks and what actually matters most
        blocks:
          - type: paragraph
            body: >-
              The most important risks around Jetti are not generic startup risks; they are the specific execution and
              concentration risks created by trying to scale a technically sensitive mining process across a small
              number of very large customer sites. Independent literature makes clear that primary-sulphide heap
              leaching remains difficult and site specific. That single fact drives the rest of the risk map. If
              performance is less repeatable than the best public cases suggest, customer expansion slows, revenue
              quality weakens, and financing expectations become harder to support. This is why technical repeatability
              should be ranked above more abstract concerns. The next tier includes customer concentration and
              competitive displacement, because public proof is narrow and because Rio-backed Nuton is moving quickly.
              Governance and legal risks matter too, but current public evidence shows more ambiguity than crisis. The
              right framing is a concentrated industrial-technology risk stack: high upside if deployments repeat, but a
              steep penalty if technical variance or disclosure gaps undermine market confidence.
            claimRefs:
