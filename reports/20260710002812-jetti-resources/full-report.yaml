  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for Jetti is unusually easy to state. Copper is structurally important, primary
              sulphides are a huge stranded resource base, and Jetti has one of the clearest public brownfield proof
              sets in the category. That is not trivial. Strategic investors such as BMW and major-miner relationships
              suggest the company sits in a part of the value chain that matters if electrification keeps tightening
              copper supply. But the anti-thesis is just as clear: public revenue disclosure is sparse, customer proof
              is still concentrated, and technically sensitive mining-process companies do not deserve infinite benefit
              of the doubt simply because the macro story is compelling. At a public valuation signal around US$2.5
              billion, the debate is no longer whether Jetti has potential; it is whether too much of that potential is
              already priced in relative to what public evidence can support. The rest of this chapter therefore treats
              valuation as a balance between real strategic option value and still-material execution risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV017
              - CV032
              - CV037
              - CV039
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV039
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV015
              - CV032
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV039
      - number: '8.2'
        title: Current valuation context and recommendation posture
        blocks:
          - type: paragraph
            body: >-
              Current valuation context is premium. Forge's June 2026 US$2.5 billion signal, reinforced directionally by
              other private-market profiles, places Jetti firmly in unicorn territory. That premium is not absurd in
              strategic terms: more than US$200 million of publicly supportable capital has come from serious investors,
              the market tailwind for copper is real, and the company has named commercial proof. But price discipline
              still matters. Growjo's low-confidence revenue estimate, if even directionally right, implies a revenue
              multiple that only makes sense if Jetti can translate reference-site success into a much broader portfolio
              with strong pricing power and durable margins. That is possible, but public evidence does not yet prove
              it. The most supportable posture is therefore positive interest with valuation caution: keep Jetti high on
              the diligence list, but demand either better data or better entry terms before treating the mark as
              attractive. Public disclosure breadth and industry recognition are positives, but they are not substitutes
              for audited financial and contractual evidence.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV003
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.3'
        title: Bull, base, bear cases and imperfect comparables
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is more useful here than point-estimate valuation. In the bull case, Jetti converts
              current proof into multiple additional operator wins, shows that brownfield economics repeat across ore
              bodies, and uses its cap table plus IP to preserve pricing power; that could justify a substantially
              higher strategic valuation. In the base case, Jetti remains valuable and real but grows more slowly, with
              continued opacity and concentration, making a valuation around current levels fair rather than cheap. In
              the bear case, technical variance, rival traction, or concentrated customer dependence prevent broader
              scale and expose the current mark as too optimistic. Direct comparables are weak because neither Ceibo's
              financing scale nor Nuton's project funding tells the full story of Jetti's platform value. Still, those
              references help frame stage, traction, and competitive intensity. This is a milestone-value problem more
              than a neat public-market multiple problem.
            claimRefs:
              - CV016
              - CV018
              - CV019
              - CV020
              - CV021
