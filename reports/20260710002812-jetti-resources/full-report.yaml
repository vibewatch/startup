      - number: '5.2'
        title: Architecture, mechanism, and workflow
        blocks:
          - type: paragraph
            body: >-
              The product architecture has four visible layers. First is the chemistry layer: Jetti says its catalyst
              prevents the passivation barrier that normally blocks chalcopyrite leaching. Second is the deployment
              layer: Jetti in a Box packages dosing equipment into a modular plant that needs only raffinate, water,
              power, and sewage connections. Third is the operating-workflow layer: ore is assessed, agreements are
              signed, the modular plant is installed, and catalyst dosing is integrated into existing leach circulation
              and SX-EW recovery. Fourth is the digital layer: Rosetta appears to help screen where the technology may
              perform well. Public scientific papers, UBC collaboration, and the patent record give this architecture
              unusual depth for a private mining-tech company. They do not prove every site will perform the same way,
              but they do show Jetti is building an industrial system supported by research, field integration, and
              predictive tooling rather than by a single oversimplified chemistry claim.
