  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and what the customer actually buys
        blocks:
          - type: paragraph
            body: >-
              Jetti's product is more than a reagent and less than a full new mine flowsheet. In customer terms, the
              offering is a brownfield copper-recovery system that plugs into existing leach and SX-EW infrastructure to
              unlock copper from primary sulfide material that conventional heap leaching cannot recover economically.
              The product bundle appears to include proprietary catalyst chemistry, containerized dosing hardware,
              site-specific operating know-how, and at least one digital decision-support layer in Rosetta. That framing
              matters because it explains why Jetti is sold to mine operators as a productivity and asset-life extension
              solution rather than as a generic chemistry license. The company also repeatedly emphasizes that the
              system works on existing heap and dump leaches, on run-of-mine material, and without a new concentrator or
              new permits. For diligence, the key implication is that Jetti's 'product' lives inside an operating mine
              workflow and must therefore be judged on integration, repeatability, and recovery uplift rather than on
              lab novelty alone.
