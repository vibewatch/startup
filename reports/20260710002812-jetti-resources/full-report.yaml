      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation is visible, but incomplete. Jetti has standardized some of its deployment logic, publishes
              governance materials, and appears to be building decision-support tooling to reduce false starts. Those
              are positive signals. The problem is that the most important mitigants are still private: deployment
              scorecards, contract protections, renewal behavior, and actual revenue quality. That means the public
              record is good at identifying what to watch, but not good enough to prove those risks are under control.
              The clearest thesis-break triggers would be repeated underperformance outside a narrow set of ore bodies,
              visible losses to rival sulphide-leach platforms at comparable sites, or a financing event that reveals
              weak commercial conversion relative to the valuation. By contrast, the clearest positive monitoring
              indicators would be new named customer wins, stable multi-year operation at reference sites, resolved
              leadership clarity, and better disclosure around contract structure and margin. Until then, the risk
              posture should remain constructive but cautious.
