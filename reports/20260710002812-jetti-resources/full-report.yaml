        title: Exhibits
        blocks:
          - type: callout
            title: The market is narrow enough to be actionable and large enough to matter
            body: >-
              Jetti does not need to solve all copper supply to be relevant. Even a small share of the brownfield
              stockpile and existing-pad opportunity would represent meaningful incremental cathode volumes because the
              underlying resource class is so large.
