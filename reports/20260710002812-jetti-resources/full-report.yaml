      - number: '2.4'
        title: Adoption constraints and the market questions that remain open
        blocks:
          - type: paragraph
            body: >-
              The hard part is not proving that the copper market is large; it is proving that site-level adoption can
              scale reliably. Independent technical sources describe exactly why. Heap-leach performance depends on ore
              variability, permeability, reagent distribution, redox control, temperature, and environmental management.
              Chalcopyrite remains prone to passivation, and raising recovery often raises acid consumption. BHP's
              industry view adds a second layer of friction: even brownfield projects are seeing higher capital
              intensities, stakeholder complexity, and schedule delay. That is why the market should not be underwritten
              as if every sulphide stockpile can be turned into commercial copper with a standard template. Jetti itself
              implicitly recognizes this by emphasizing pilot work, ore testing, and project-by-project deployment. The
              most important remaining diligence gap is how many existing leach/SX-EW sites can actually clear
              mine-specific economics today. Without that denominator, TAM looks large but SAM and SOM remain
              judgment-based. The conclusion is attractive but conditional: the market is real, structurally important,
              and growing, but adoption will be selective and technically demanding rather than automatic.
            claimRefs:
