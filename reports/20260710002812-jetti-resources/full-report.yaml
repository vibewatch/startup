  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what public sources really show
        blocks:
          - type: paragraph
            body: >-
              Public financial disclosure on Jetti is thin, but the commercial model is not invisible. The company
              repeatedly describes itself as commercially proven, deployable within months of agreement, and sold under
              standardized commercial arrangements with measurable KPIs. That framing strongly suggests Jetti is
              monetizing mine-site deployments rather than selling pure consulting hours or taking direct
              commodity-price exposure. The Jetti in a Box system further implies a package that includes physical
              dosing equipment, chemistry deployment, and operational support. What the sources do not say is equally
              important: there is no public detail on whether Jetti charges an upfront equipment fee, a recurring
              catalyst or services fee, a gain-share, a royalty-like structure, or some combination of all four. In
              other words, the public record is good enough to establish that Jetti has a real commercialization model,
              but not good enough to underwrite revenue quality or revenue-recognition mechanics. For a private
              industrial-technology company, that distinction matters because repeatability and contract structure will
              determine how much customer value actually becomes Jetti revenue.
