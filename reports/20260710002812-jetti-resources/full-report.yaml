            body: >-
              Jetti's customer footprint is unusually concrete for a private mining-technology company, but it is also
              narrow. The public record centers on large copper miners and specific mine sites rather than on a broad
              account roster. Pinto Valley is the clearest anchor because Jetti says it first deployed there
              commercially in 2019 and still operates there today, while Capstone provided an external operating
              outcome. Bagdad provides a second Freeport-linked reference, although the company's own wording makes
              clear that it was commercial only for a limited period. El Abra adds a Chilean expansion point with a
              named production target after ramp-up. Taken together, these sources show that Jetti's customers are best
              understood as large incumbent mine operators with existing leach and SX-EW infrastructure, where corporate
              asset teams, metallurgy leaders, and site operations all matter. This is a concentrated, enterprise-style
              customer base with very high account value and technical intensity, not a broad diversified portfolio.
