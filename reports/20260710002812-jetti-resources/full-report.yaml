  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: who actually competes with Jetti'
        blocks:
          - type: paragraph
            body: >-
              Jetti's true competitors are not generic mining analytics vendors; they are technologies and project
              pathways that attempt to unlock copper from primary sulphide resources more economically than the status
              quo. The direct set is still small but serious. Rio Tinto's Nuton is the clearest heavyweight threat
              because it is pursuing the same primary-sulphide problem with a bioleach portfolio, corporate backing, and
              multiple mine-development partnerships. Ceibo is the clearest startup analogue because it also promises
              recovery from low-grade primary sulphides and waste material while emphasizing integration into existing
              mine infrastructure. Around that direct set sits the broader substitute landscape: the conventional
              concentrator-and-smelter route for primary sulphides, internal development by major miners, and
              project-level decisions to defer recovery until economics improve. This framing matters because a miner
              rarely chooses between Jetti and software; it chooses between Jetti, another sulphide-leach route, a
              bigger capex processing route, or doing nothing. The category therefore looks more like contested
              industrial process innovation than standard SaaS competition.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP012
              - CP026
              - CP031
              - CP032
