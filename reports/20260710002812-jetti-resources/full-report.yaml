      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The logical first buyer is an incumbent copper operator rather than a downstream OEM or a speculative
              developer. Capstone's Pinto Valley and Freeport's El Abra are the clearest templates: both already had
              operating sites, existing infrastructure, and unused or underused SX-EW value that could be monetized
              faster than a new mine build. Within those operations, mine management and corporate leadership
              effectively play the payer role because they decide whether the retrofit clears internal capital
              thresholds; metallurgy and operations teams are the users because they have to implement, monitor, and
              scale the chemistry. The strongest adoption drivers are therefore mine-side economics and strategic copper
              scarcity, not sustainability branding alone. That said, downstream demand still matters because investors
              like BMW and major miners both cite electrification, EVs, and low-carbon supply chains as reasons to care.
              The addressable buyer pool grows when copper demand becomes structurally harder to satisfy and when
              brownfield projects face a simpler stakeholder path than greenfield mines. Jetti's market becomes more
              compelling when incremental pounds can be delivered from sites that already hold permits, workforce, and
              process plants.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
              - CM019
              - CM031
              - CM032
