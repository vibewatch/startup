      - number: '3.3'
        title: Switching cost, distribution, and what wins selection
        blocks:
          - type: paragraph
            body: >-
              Mine-site adoption is won through trust, site fit, and operational credibility more than through
              marketing. Jetti's partner surfaces matter because they show relationships with Freeport, BHP, Teck, and
              Mitsubishi, while Capstone provides a concrete public proof case. Those signals reduce buyer fear that
              Jetti is unproven. Nuton, however, may have the stronger distribution engine because Rio can support the
              technology through internal technical capacity, project capital, and an expanding set of partner mines.
              Public Lion and Gunnison releases show Nuton using staged funding, joint-venture rights, and development
              agreements to secure deployment options. That can be strategically powerful because it makes the
              commercial package broader than chemistry alone. Once a mine commits, switching cost rises quickly: ore
              testing, process control, irrigation design, environmental planning, and operating routines all become
              path-dependent. Miners may compare several providers while still in study mode, but they are unlikely to
              run multiple competing leach platforms at full commercial scale on the same asset. Distribution,
              therefore, starts with credibility and ends with sticky technical integration.
            claimRefs:
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP033
              - CP034
          - type: table
            tableRef: TP003
            claimRefs:
              - CP019
              - CP020
              - CP021
              - CP022
              - CP024
          - type: figure
