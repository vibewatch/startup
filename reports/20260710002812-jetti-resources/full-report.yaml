  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the real problem being bought
        blocks:
          - type: paragraph
            body: >-
              Jetti's market is easiest to misunderstand when it is described too broadly. The company is not trying to
              sell a general-purpose mining software product, a new greenfield copper mine, or even a universal
              metallurgy solution for every copper ore body. Its real market is narrower and more defensible: brownfield
              copper operations that already run heap leaching and SX-EW circuits, have stranded primary sulfide
              material in stockpiles or waste, and can justify incremental cathode production without building a new
              concentrator. That boundary excludes most of the copper value chain, including smelting, refining,
              concentrate logistics, and greenfield project development. It also excludes mines without leach
              infrastructure, because Jetti's commercial pitch relies on using what is already there. The market matters
              because around 70% of the world's copper resources remain in low-grade primary sulfides. That makes the
              resource base enormous, but the near-term serviceable market is much smaller: only the subset of mine
              sites whose mineralogy, infrastructure, and economics make a retrofit attractive.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM029
              - CM030
              - CM034
