      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Compelling company, disciplined entry only
            body: >-
              Jetti looks too strategically important to ignore, but current public pricing appears full enough that
              investors should insist on better private data or better entry terms.
            calloutType: recommendation
            claimRefs:
