  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Jetti Resources is a Boulder-headquartered mining technology company founded in 2014 to unlock copper from low-grade primary sulfide ores using catalytic chemistry integrated into existing heap-leach and SX-EW circuits. Public evidence supports real commercial traction at Capstone Copper\u2019s Pinto Valley and a Freeport-backed El Abra deployment, along with more than $200 million of officially disclosed financing and a roughly $2.5 billion 2026 valuation signal. The main diligence tensions are leadership ambiguity after the 2024 CEO appointment, inconsistent third-party funding datasets, and the absence of audited revenue or margin disclosure."
  },
  "sections": [
    {
      "id": "identity-and-footprint",
      "title": "Identity, footprint, and what the company actually does",
      "body": "Jetti Resources is best understood as a mine-site copper recovery technology company, not as a greenfield mine developer. Its public materials consistently position the business around a narrow but valuable use case: enabling established copper producers to recover additional cathode from low-grade primary sulfide ores that conventional heap leaching could not process economically. That positioning matters because it ties the company to existing mine infrastructure, existing stockpiles, and existing solvent extraction-electrowinning circuits rather than to risky greenfield mine builds. The operating footprint supports that framing. Jetti's contact page lists Boulder as corporate headquarters, Vancouver as the technology and R&D hub, and Santiago as the regional headquarters in the heart of the copper industry. The company's technology pages say Jetti has tested ore from more than 30 mines and built a solution that can work on heap and dump leaches without new permits or flow-sheet redesign. That makes the company's commercial identity much closer to an industrial process enhancer than a conventional mining operator, with the value proposition centered on incremental pounds, faster deployment, and low capital intensity.",
