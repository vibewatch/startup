    {
      "id": "leadership-and-governance",
      "title": "Leadership bench, founders, and governance ambiguity",
      "body": "Public leadership evidence shows both depth and ambiguity. Forge identifies co-founders Mike Outwin and Andrew Perlman, while the team page shows a management bench with metallurgy, engineering, operations, projects, legal, and finance coverage. Nelson Mora's profile is especially important because it demonstrates that the company has senior technical leadership with direct heap-leach and base-metals process experience across Vale, Xstrata Copper, and BHP Billiton. Governance also strengthened over time: Danny Malchuk became chairman in 2023 after serving on the board, and the board message tied his appointment directly to scaling relationships across copper producers. The key complication is the CEO record. Jetti formally announced John Slaven as CEO effective October 2024, yet the current team page accessed for this report lists Nelson Mora as acting CEO and CTO. That inconsistency does not invalidate the operating thesis, but it does create a diligence item around succession, board decision-making, and who currently owns commercial accountability. For an industrial technology company whose adoption cycle depends on trust with major mine operators, any unexplained leadership change is material.",
