    {
      "id": "capital-base-and-scale",
      "title": "Capital base, investor map, and public scale signals",
      "body": "Jetti's financing history shows a company that has attracted increasingly strategic capital rather than generic venture money. The June 2021 Series C brought in Mitsubishi, Freeport-McMoRan, BHP Ventures, Orion Resource Partners, and T. Rowe Price-linked funds, and management said the company had raised more than $100 million in aggregate after that round. The October 2022 Series D added another $100 million led by T. Rowe Price funds, with Rothschild & Co and existing investors participating. BMW i Ventures then disclosed its own stake in December 2022, explicitly linking Jetti's technology to future EV copper demand and lower-footprint supply chains. Those official rounds imply total capital raised above $200 million even though third-party datasets disagree on the exact total. Public scale indicators are similarly mixed. Growjo estimates about 53 employees and $11.3 million of annual revenue, while Forge and CoTec both support a roughly $2.5 billion valuation frame in 2026. The right conclusion is not that every database is accurate; it is that Jetti has clear unicorn-scale pricing despite still-private financial disclosure and still-limited public operating metrics.",
