    {
      "id": "milestones-and-open-questions",
      "title": "Commercial milestones, proof points, and open diligence questions",
      "body": "The milestone record is stronger than the private-company disclosure profile. Jetti's own history page traces discovery in 2012, founding in 2014, first testing in 2016, Mitsubishi investment in 2018, first commercial deployment at Pinto Valley in 2019, key patents in 2020, major financing in 2021 and 2022, a seminal scientific paper in 2022, and modular plant development by 2024. Customer proof is not purely self-referential: Capstone publicly said the first year at Pinto Valley doubled cathode production per area irrigated and opened a path to 300-350 million pounds of additional cathode over two decades, while Jetti's 2023 El Abra release targeted more than 20 million incremental pounds per year after ramp-up. Those are meaningful industrial validation signals. The open questions are mostly financial and governance related. Public sources still do not provide audited revenue, contract terms, board rights, or an explanation for the current acting-CEO status after the 2024 CEO appointment. That means the company-overview chapter supports the core commercialization story, but not yet a full underwriting of revenue quality or management stability.",
