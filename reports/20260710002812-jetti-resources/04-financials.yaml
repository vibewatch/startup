  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Jetti looks financially credible but under-disclosed. Public evidence strongly supports attractive customer-side deployment economics, fast post-contract deployment, and more than US$200 million of strategically backed capital raised, but it does not provide audited revenue, gross margin, burn, or runway. The best public revenue signal is a low-confidence third-party estimate of roughly US$11.3 million, which would imply very rich pricing relative to a roughly US$2.5 billion valuation unless private diligence confirms much stronger revenue quality and scaling potential than public sources reveal."
  },
  "sections": [
    {
      "id": "revenue-model",
      "title": "Revenue model and what public sources really show",
      "body": "Public financial disclosure on Jetti is thin, but the commercial model is not invisible. The company repeatedly describes itself as commercially proven, deployable within months of agreement, and sold under standardized commercial arrangements with measurable KPIs. That framing strongly suggests Jetti is monetizing mine-site deployments rather than selling pure consulting hours or taking direct commodity-price exposure. The Jetti in a Box system further implies a package that includes physical dosing equipment, chemistry deployment, and operational support. What the sources do not say is equally important: there is no public detail on whether Jetti charges an upfront equipment fee, a recurring catalyst or services fee, a gain-share, a royalty-like structure, or some combination of all four. In other words, the public record is good enough to establish that Jetti has a real commercialization model, but not good enough to underwrite revenue quality or revenue-recognition mechanics. For a private industrial-technology company, that distinction matters because repeatability and contract structure will determine how much customer value actually becomes Jetti revenue.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI003",
        "CI004",
        "CI005"
      ],
      "tableRefs": [
        "TI001"
