    {
      "id": "unit-economics-and-gtm",
      "title": "Customer economics, deployment speed, and GTM proxies",
      "body": "The strongest financial evidence in Jetti's public record is customer-side economics rather than corporate P&L. Jetti says its deployments have capital intensity well below US$1,500 per annual tonne of additional production and operating costs below US$1.50 per pound. It also says the technology integrates with existing infrastructure, needs no additional permits, and can be physically deployed within about three months of commercial agreement. Capstone's Pinto Valley case provides a critical external proof point because it claims doubled cathode production per area irrigated in year one and a path to 300-350 million pounds of additional cathode over two decades. That makes the revenue model understandable in principle: if Jetti repeatedly creates that kind of value at existing mines, customers should be willing to pay meaningful economics. The GTM burden is that reaching commercial agreement probably requires long technical diligence, ore testing, and site-specific design. So the financial story is a hybrid of long-cycle industrial selling upfront and potentially fast value realization once a deal is actually signed.",
