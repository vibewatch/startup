    {
      "id": "financial-verdict",
      "title": "Financial verdict and what still blocks underwriting",
      "body": "The financial verdict is promising but incomplete. Jetti looks like a well-capitalized industrial technology company with strategic backers, attractive customer economics, and a business model designed around repeatable brownfield deployment rather than one-off invention. If the company can truly standardize Jetti in a Box deployments and capture a meaningful share of mine-side value, the economic upside could be substantial. But the underwriting blockers are material. Public sources do not disclose cash balance, burn, runway, debt, working capital, contract structure, or gross margin. Even the available revenue figure is an external estimate, not management disclosure. That means investors can support the existence of a real business with real commercial traction, yet still lack the information needed to judge revenue quality or margin durability. The chapter therefore supports a constructive but cautious conclusion: Jetti appears financially credible enough to merit serious attention, but its valuation can only be defended if private diligence confirms that customer-side economics translate into repeatable, high-quality company revenue.",
