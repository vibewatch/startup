    {
      "id": "public-traction-and-capital",
      "title": "Public traction markers and capital adequacy",
      "body": "Jetti has far better public evidence on financing than on revenue. The 2021 Series C brought in US$50 million and pushed total capital raised past US$100 million at that time. The 2022 Series D added another US$100 million. Reuters, Mining.com, and International Mining all framed the 2021 round as scale capital for a commercially proven copper-extraction platform, while BMW's later strategic investment linked Jetti to low-carbon critical-minerals supply chains. The investor mix matters: Mitsubishi, Freeport, BHP, Teck-linked surfaces, T. Rowe Price, DNS, Orion, and BMW together indicate that Jetti has attracted both strategic and institutional capital. Public traction markers reinforce that picture. Jetti says it has treated hundreds of millions of tonnes of ore and in 2021 cited a 23-project pipeline with active pilots and commercial transitions. What remains weak is revenue disclosure. Growjo's US$11.3 million estimate and 53-employee estimate are directionally useful, but they are still third-party estimates rather than company-confirmed financial statements.",
