    {
      "id": "retention-and-concentration",
      "title": "Retention, concentration, and expansion friction",
      "body": "Retention evidence exists, but it is incomplete and uneven. Pinto Valley appears to be the strongest multi-year retention signal because Jetti continues to cite it as an active operating site years after first deployment. Bagdad is the opposite signal: the company's limited-period wording implies that not every technically valid site turns into a long-duration public reference. El Abra is promising but too early in the public record to judge durability. The deeper issue is that public customer proof is concentrated among only a few large mining groups, with Freeport appearing twice in the named set. That concentration can be bullish because winning a major miner is hard; it can also be risky because losing one program can disproportionately affect perception and revenue. Expansion is likely constrained by mine-level diligence, technical variability, and procurement complexity rather than by general market awareness. In this category, new customers are won slowly and reference quality matters more than logo count.",
      "claimRefs": [
