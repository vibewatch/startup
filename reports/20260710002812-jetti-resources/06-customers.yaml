    {
      "id": "adoption-proof",
      "title": "Adoption trajectory and named customer proof",
      "body": "The adoption story is strongest where Jetti can point to dated milestones and outcome specificity. The sequence runs from first commercial deployment at Pinto Valley in 2019 to a limited commercial period at Bagdad and then to the 2023 El Abra announcement. Capstone's release is especially important because it does more than confirm a customer name: it quantifies a first-year operating result and sketches multi-decade production upside from underutilized SX-EW capacity. Jetti's 2021 financing release also broadens the frame by citing a 23-project pipeline with active pilots and near-commercial opportunities, which implies that named mine references understate the total opportunity funnel. But later public sources do not enumerate that pipeline in detail, so portfolio breadth remains partly opaque. The right read is that Jetti has real customer proof and a visible adoption arc, but not yet a public customer roster broad enough to remove concentration concerns.",
      "claimRefs": [
        "CU009",
        "CU010",
        "CU011",
        "CU012",
        "CU021",
