    {
      "id": "customer-verdict",
      "title": "Customer verdict and what matters for valuation",
      "body": "Jetti's customer chapter supports a constructive but still concentrated conclusion. It is rare for a private mining-technology company to have a public operating proof case as explicit as Pinto Valley, plus additional large-miner references and a disclosed project pipeline. That gives Jetti more credibility than many industrial startups can show. But the proof base remains narrow, and critical customer metrics are still missing: no public contract lengths, no renewal statistics, no revenue-concentration disclosure, and no portfolio-wide retention data. Technical literature helps explain why: every mine is different, and primary-sulphide leaching remains site sensitive. For valuation, the core customer question is whether Jetti can turn a handful of marquee, technically intensive accounts into a durable portfolio of long-lived deployments. If it can, the customer base becomes a strategic asset. If not, the business may remain hostage to a few reference sites and a long, selective procurement funnel.",
