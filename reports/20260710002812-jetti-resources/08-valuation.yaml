    {
      "id": "valuation-context",
      "title": "Current valuation context and recommendation posture",
      "body": "Current valuation context is premium. Forge's June 2026 US$2.5 billion signal, reinforced directionally by other private-market profiles, places Jetti firmly in unicorn territory. That premium is not absurd in strategic terms: more than US$200 million of publicly supportable capital has come from serious investors, the market tailwind for copper is real, and the company has named commercial proof. But price discipline still matters. Growjo's low-confidence revenue estimate, if even directionally right, implies a revenue multiple that only makes sense if Jetti can translate reference-site success into a much broader portfolio with strong pricing power and durable margins. That is possible, but public evidence does not yet prove it. The most supportable posture is therefore positive interest with valuation caution: keep Jetti high on the diligence list, but demand either better data or better entry terms before treating the mark as attractive. Public disclosure breadth and industry recognition are positives, but they are not substitutes for audited financial and contractual evidence.",
