  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Jetti merits serious diligence because it combines a strategically important copper thesis with real named customer proof and a strong strategic cap table. But a roughly US$2.5 billion public valuation signal already prices in substantial future execution despite sparse audited revenue, margin, and contract visibility. The most supportable current posture is research-more with high strategic interest, medium confidence, high risk, and a stretched valuation stance."
  },
  "sections": [
    {
      "id": "thesis-and-anti-thesis",
      "title": "Investment thesis and anti-thesis",
      "body": "The positive case for Jetti is unusually easy to state. Copper is structurally important, primary sulphides are a huge stranded resource base, and Jetti has one of the clearest public brownfield proof sets in the category. That is not trivial. Strategic investors such as BMW and major-miner relationships suggest the company sits in a part of the value chain that matters if electrification keeps tightening copper supply. But the anti-thesis is just as clear: public revenue disclosure is sparse, customer proof is still concentrated, and technically sensitive mining-process companies do not deserve infinite benefit of the doubt simply because the macro story is compelling. At a public valuation signal around US$2.5 billion, the debate is no longer whether Jetti has potential; it is whether too much of that potential is already priced in relative to what public evidence can support. The rest of this chapter therefore treats valuation as a balance between real strategic option value and still-material execution risk.",
      "claimRefs": [
        "CV001",
