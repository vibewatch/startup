    {
      "id": "scenarios-and-comparables",
      "title": "Bull, base, bear cases and imperfect comparables",
      "body": "Scenario analysis is more useful here than point-estimate valuation. In the bull case, Jetti converts current proof into multiple additional operator wins, shows that brownfield economics repeat across ore bodies, and uses its cap table plus IP to preserve pricing power; that could justify a substantially higher strategic valuation. In the base case, Jetti remains valuable and real but grows more slowly, with continued opacity and concentration, making a valuation around current levels fair rather than cheap. In the bear case, technical variance, rival traction, or concentrated customer dependence prevent broader scale and expose the current mark as too optimistic. Direct comparables are weak because neither Ceibo's financing scale nor Nuton's project funding tells the full story of Jetti's platform value. Still, those references help frame stage, traction, and competitive intensity. This is a milestone-value problem more than a neat public-market multiple problem.",
      "claimRefs": [
