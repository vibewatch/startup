companyProfile:
  summary: >
    Enter is a Brazilian legal AI company that automates the full lifecycle of mass litigation
    for large enterprises. Founded in September 2023 by Mateus Costa-Ribeiro (CEO), Michael
    Mac-Vicar (CTO), and Henrique Vaz (CPO), Enter addresses Brazil's uniquely litigious
    market — 80 million active lawsuits, eight times the US volume — by deploying AI agents
    that handle case intake, fraud detection (30+ checks), evidence enrichment, defense
    drafting, settlement modelling, and ruling interpretation, all subject to mandatory
    human-lawyer review. The platform, EnterOS, serves 40+ large enterprises including Nubank,
    LATAM Airlines, Santander, Bradesco, and Mercado Livre. In May 2026, Enter raised over
    US$100M in a Series B at a US$1.2 billion valuation led by Founders Fund, becoming Latin
    America's first AI unicorn. The company has been cash-flow positive since 2024 and reports
    ARR growing 13× since April 2025.
  foundedDate: "2023-09-01"
  founders:
    - name: Mateus Costa-Ribeiro
      role: CEO & Co-Founder
      background: >
        Became Brazil's youngest practicing lawyer at 18; Harvard Law School LL.M.; passed New
        York Bar at 20; left a full-ride Stanford MBA to found Enter at age 23.
      claimRefs: [CO002]
    - name: Michael Mac-Vicar
      role: CTO & Co-Founder
      background: >
        Chilean entrepreneur; former CTO of Wildlife Studios (Brazilian gaming unicorn) for
        12 years; first met CEO Costa-Ribeiro as an angel investor before co-founding Enter.
      claimRefs: [CO003]
    - name: Henrique Vaz
      role: CPO & Co-Founder
      background: >
        Harvard graduate; former intern-to-CMO at Wildlife Studios; also worked at Tesla before
        joining Enter as head of product.
      claimRefs: [CO004]
  foundingLocation: São Paulo, Brazil
  headquarters: São Paulo, Brazil
  productSummary: >
    EnterOS — an AI operating system for corporate legal departments — deploys multi-model AI
    agents (OpenAI, Anthropic, Google) to automate end-to-end litigation management: case
    registration via API, fraud and irregularity detection (30+ checks), evidence enrichment,
    settlement modeling, AI-drafted defense submissions reviewed by licensed attorneys, hearing
    support, ruling interpretation, and appeal assistance. Covers both civil (consumer) and
    labor litigation verticals.
  customerFocus: >
    Large Brazilian enterprises with high-volume litigation portfolios — primarily banks,
    retailers, airlines, telecoms, and technology platforms facing thousands of consumer and
    labor lawsuits annually.
  businessModel: >
    Hybrid: upfront technology subscription fee plus a variable component (~30% of contract
    value) tied to litigation performance outcomes. Positioned as legal-budget spend ("work,
    not software") rather than IT SaaS, integrating via API with court systems and client ERPs.
  stage: Series B
  fundingStatus: >
    Series B closed May 2026: US$100M+ at US$1.2B valuation, led by Founders Fund; also
    Kaszek, Ribbit Capital, Sequoia Capital, OneVC, Atlantico. Total raised approximately
    US$140M+ across pre-seed, seed (US$5.5M), Series A (US$35M at US$350M), and Series B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO007, CO008, CO009, CO010]

summary:
  headline: >
    Enter is the dominant AI-powered mass-litigation platform for Brazil's uniquely vast
    legal market, growing at exceptional speed with blue-chip customers and Tier-1 investors,
    but carrying key-person and market-concentration risk as it attempts global expansion.
  overallScore: 8.1
  recommendation: buy
  confidence: medium
  riskRating: medium
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 1200
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 140
    customerCount: 40
    headcount: 120
  topStrengths:
    - >
      Dominant market position in Brazil's uniquely litigious environment (80M lawsuits, 8x US)
      with a defensible proprietary dataset built from 300K+ cases/year processed.
    - >
      Exceptional growth velocity: revenue up 10x+ in ~8 months (Series A to Series B); ARR up
      13x since April 2025; cash-flow positive since 2024.
    - >
      Tier-1 investor syndicate (Founders Fund, Sequoia, Kaszek, Ribbit) and blue-chip customer
      roster (Nubank, LATAM Airlines, Santander, Bradesco, Mercado Livre) validate the product.
    - >
      Founder-market fit is exceptional: CEO is a Harvard-trained Brazilian lawyer who
      personally experienced the pain point, with deep domain credibility.
    - >
      Hybrid performance-based revenue model aligns incentives with clients and creates
      measurable ROI (LATAM: +30% win rate, R$15M saved; Nubank: +6pp success rate).
  topRisks:
    - >
      Key-person risk: 3-founder team with extraordinary credentials; loss of CEO would be
      materially disruptive. No publicly disclosed succession depth.
    - >
      Brazil market concentration: all disclosed revenues are from Brazil. US and LatAm
      expansion is aspirational; legal AI is inherently jurisdiction-specific.
    - >
      Regulatory risk: Brazil's pending AI legislation (Articles 17 and 50) and ANPD
      automated-decision guidance could impose compliance costs or restrict AI autonomy.
    - >
      Dependency on foundation model providers (OpenAI, Anthropic, Google): cost pass-through
      risk and potential competitive entry from model providers into the legaltech layer.
    - >
      Adverse litigation context: Enter's platform helps enterprises defend against consumer
      lawsuits, generating reputational and regulatory scrutiny from consumer rights advocates.
  unresolvedGaps:
    - Actual ARR and revenue run rate in USD (not disclosed; only growth multiples confirmed).
    - Gross margin and unit economics (not disclosed for private company).
    - Net revenue retention rate (not disclosed).
    - Headcount as of June 2026 (company disclosed target of 200; actual ~120 estimated).
    - "Regulatory exposure detail: specific LGPD enforcement actions or ANPD investigations (none confirmed)."
    - US expansion timeline, go-to-market plan, and capital requirements.

