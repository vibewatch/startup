company:
  name: Enter
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Enter sells into Brazil's uniquely large litigation market: roughly 80 million active lawsuits, about
    eight times the United States, with 39.4 million new cases filed in 2024 according to the National
    Council of Justice. The serviceable opportunity is enterprise mass-litigation defense for banks, insurers,
    airlines, and marketplaces whose litigation provisions run into tens of billions of reais. Demand
    is propelled by surging case volumes, judicial digitalization, and abusive-litigation pressure, but
    constrained by AI regulation, data-privacy rules, trust requirements, and the human-review obligation.
    Sizing is evidence-constrained and partly company-sourced, so ranges are presented rather than a single
    point estimate.
sections:
- id: section-1
  title: Market boundary and substitutes
  body: >-
    Enter operates in a market defined less by software category than by the structural reality of Brazilian
    litigation. The boundary is enterprise mass-litigation defense — high-volume civil and labor cases
    brought against large companies — rather than the law-firm research, contract review, and e-discovery
    niches where most global legal-AI tools compete. The buyers are banks, insurers, airlines, and marketplaces
    whose litigation is measured in tens of thousands of cases, and the spend Enter targets sits in the
    legal and operations budget, framed as 'work, not software' so it is underwritten against litigation
    outcomes rather than IT line items. The status quo Enter displaces is a mix of in-house legal teams,
    outside law firms billing by the hour or case, and manual document workflows. That framing matters
    for sizing: it excludes generic legal-software spend and instead anchors on the cost and volume of
    defending mass litigation, a category that is unusually large in Brazil and only partially addressable
    by foreign tools built for common-law research. The market boundary therefore couples a clear use
    case with a specific, litigation-heavy set of Brazilian enterprise buyers.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM020
  - CM021
  tableRefs:
  - TM001
  figureRefs:
  - FM002
- id: section-2
  title: Scale of Brazil's litigation market
  body: >-
    Brazil's litigation system is one of the largest in the world by volume, and that scale is the foundation
    of Enter's opportunity. Public reporting and the National Council of Justice point to a stock of roughly
    80 million active lawsuits — a figure company and media sources describe as about eight times the
    United States — with 39.4 million new cases filed in 2024 according to the CNJ's Justica em Numeros
    report. The CNJ's annual statistics and the broader digitalization of Brazilian courts make this caseload
    unusually machine-readable, which is precisely what an automation platform needs. On the demand side,
    the seven largest banks alone are reported to carry about R$80.2 billion in litigation provisions,
    a proxy for how much money large enterprises set aside against legal exposure and therefore how much
    budget could shift toward tools that reduce losses. Labor litigation forms a large and distinct slice
    of the caseload on top of consumer and mass civil disputes, widening the addressable base. These figures
    are not all equally solid: the absolute case counts come from the CNJ and are high-confidence, while
    the eight-times comparison and the bank-provision total are rounded, company-sourced framings that
    diligence should treat as directional rather than audited.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM010
  - CM020
  - CM021
  - CM025
  - CM026
