  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Enter 最重要的风险簇是监管，因为公司自动化的正是巴西监管方准备审视的活动。LGPD 是巴西数据保护法，由 ANPD 执行，管辖 Enter 如何处理诉讼记录中的个人数据；ANPD
              正积极就人工智能和自动化决策征求意见，而 AI 生成法律输出显然落在该类别内。巴西律所分析的自动化决策技术说明和公众咨询显示，监管方在 2026 年正主动研究 Enter 这类决策。其上还有待审 AI 法案 PL
              2338/2023，可能对高风险自动化系统施加义务；值得注意的是，Enter CEO
              曾在参议院作证，反对其中部分内容，这既说明公司在积极参与，也确认公司看到了真实监管暴露。具体风险包括合规成本上升、自动化深度受限、法院数据使用受限并侵蚀数据护城河，以及如果 AI
              错误进入法院，可能产生专业责任。巴西 legaltech 监管仍在演化，Enter 12
              个月后必须满足的规则可能不同于今天。这是高概率、高影响的风险簇；人工复核和主动参与是真实缓释，但面对尚未落地的最终制度，成熟度仍未证明。
