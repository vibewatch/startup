        title: 投资论点、价格背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              Enter 的 US$1.2 billion Series B 是一个标志性价格：公司因此成为拉丁美洲第一家 AI 独角兽；按报道口径，它也是全球第三家估值超过 US$1 billion 的
              legaltech。投资论点清晰，由四条腿支撑——巴西诉讼市场结构性巨大；产品纵向一体化、防御性较强，并拥有本土案件数据护城河；头部企业客户名单亮眼且仍在扩张；公司披露的增长极快，看起来资本效率也很高。放到同类可比公司中，Enter
              的表观估值最低：Harvey 估值接近 US$11 billion；Legora 在 Series D 后约 US$5.6 billion；Relativity 在可能上市前约 US$3.6
              billion；Clio 约 US$3 billion；Luminance 更小，最近一轮是 US$75 million Series
              C。这些同行大多服务普通法市场的律所，因此比较只能给方向，不能逐项对标；但它仍把 Enter
              放在一个清晰位置：价格只是头部公司的零头，却占住了它们没有覆盖的细分市场。头部价格有充分交叉印证——Valor、Bloomberg 和 Forbes 均独立报道了 US$1.2
              billion——这降低了数字本身的信息风险；不过支撑估值的指标仍部分来自公司。稀缺性也重要：作为拉美第一家 AI 独角兽，Enter 获得了品牌能见度和资源入口，这些也在基本面之外托住价格。
