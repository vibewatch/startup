      - number: '2.4'
        title: 增长驱动、约束和缺口
        blocks:
          - type: paragraph
            body: >-
              市场走势是一场结构性驱动与现实约束之间的拉扯。驱动端，巴西案件量持续上升，司法数字化提供自动化所需的数据底座，滥用和掠夺性诉讼浪潮让反欺诈与抗辩工具成为预算优先项——独立报道明确把巴西法院采用 AI
              与效率提升及诉讼增加同时联系起来。全球法律 AI 融资热潮也为赛道提供资本和可信度：Harvey 与 Legora 以数十亿美元估值融资，Enter 则被包装为拉美首家 AI
              独角兽。逆风同样需要尽调权衡：巴西待审 AI 法案（PL 2338/2023）可能对自动化法律决策施加义务；LGPD 会抬高大规模处理诉讼数据的隐私合规成本；让法律 AI
              更容易被接受的信任、可解释性和人工复核要求，也会限制自动化深度和企业采用速度。市场测算本身也有缺口：诉讼量估计在媒体四舍五入口径和 CNJ 精确统计之间摇摆，Enter
