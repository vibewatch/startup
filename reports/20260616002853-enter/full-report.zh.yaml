              Enter 把融资纪录与大胆运营口径放在一起，尽调应先把这些口径视为公司来源，直到完成验证。公司称服务 40 多家大型企业、每年处理超过 300,000 起诉讼，并自 2024
              年以来现金流为正——距离上线不到一年；锚定客户 Nubank 据称把约 80% 的案件准备工作交给平台。员工约 120 人，目标是 2026 年底达到 200 人，技术岗位占比超过
              85%。关键是，公司没有披露具体 ARR 和收入，因此封面指标把独立报道事实（估值、轮次）与未经审计的规模主张混在一起；这一区分会延伸到财务和客户章节。里程碑记录还包括值得投资判断关注的非融资事件：CEO
              曾出席巴西参议院讨论 AI 法案（PL 2338/2023），公司称与国家司法委员会合作建设历史案件数据库；外部背景则是，观察者警告巴西法院采用 AI
              一方面提升效率，另一方面也推高诉讼和滥诉。监管和市场滥用这两条线还处早期，但已经真实存在，并会在报告后续章节成为核心风险。
