        title: 竞争版图和玩家类型
        blocks:
          - type: paragraph
            body: >-
              Enter 所处的法律 AI 版图，头部拥挤，但与它的细分市场结构不同。融资最充足的是面向律所和企业法务的横向 copilot 与研究套件：Harvey 2026 年估值约
              US$11B，面向律所和企业构建智能体；Legora 在 US$550M Series D 轮后估值约 US$5.6B，提供协作式法律 AI 工作空间；Luminance 专注 AI 合同分析，完成 US$75M
              Series C；研究领域老牌公司 LexisNexis（Lexis+ AI）和 Thomson Reuters Westlaw（Precision
              AI）则把生成式工具与数十年法律内容打包。第二类玩家处理相邻执行环节：估值 US$3B 的执业管理平台 Clio 正切入 AI 和 fintech，Relativity 是估值接近 US$3.6B
              的电子取证和数据智能公司，Ironclad 等合同生命周期工具也在场。几乎所有这些工具都为普通法研究、起草和审查而建，而不是 Enter
              所定义的大规模诉讼运营。现状替代方案——继续使用外部律所，或企业自建工具——构成其余竞争集合。结果是，Enter
              几乎没有直接类比对象，但周围有许多资本雄厚的邻居，理论上可以向它的地盘移动。关键在于，竞争者不仅按功能分层，也按司法辖区分层：最大玩家锚定普通法市场，那里研究和起草主导计费工作；巴西的大陆法和劳动法院则产生海量、重复的抗辩工作，这些工具从未为工业化处理这类工作而设计。截至
