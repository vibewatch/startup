      - number: '2.3'
        title: 测算视角、分层和可获取市场
        blocks:
          - type: paragraph
            body: >-
              由于没有经审计研究为巴西企业诉讼自动化市场定价，负责任的做法不是给出单一 TAM，而是用多种视角交叉校准。准备金视角把银行、保险公司和航空公司为诉讼预留的数百亿雷亚尔视为自动化可切入的支出池；案件量视角用每年约
              3900 万新增案件乘以尚未定价的单案服务价值；法律支出视角则建模预算从外部律所迁移到 Enter
              这类平台。每个视角单独看都弱，但合在一起，把可服务支出圈定在数十亿雷亚尔量级，并进一步收窄到几百家大型企业的大规模民事和劳动抗辩服务段。Enter 目前的可获取市场，由其 40 多家企业客户和每年处理
              300,000 多件诉讼的口径支撑，且高度集中在金融服务，与巴西银行诉讼负担相匹配。该吞吐口径来自公司且未经审计，因此 SOM
              估计带有实质不确定性；企业采购周期也限制扩张速度。尽管如此，分层逻辑清楚：诉讼密集、资本充足，且预算负责人坐在法务和运营里的买方，才是近期现实市场。
