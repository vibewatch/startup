            body: >-
              把客户证据作为组合来看，Enter 的耐久性信号积极，但正式指标不完整。LATAM 和 Nubank 的扩张——从试点切片走到多数诉讼工作负载——强烈指向净收入留存和客户满意度；已命名一线 logo
              的参考质量，本身也是向下一个受监管买方销售的资产。但 Enter
              没有披露正式净收入留存、总留存或流失率，因此耐久性只能推断，无法直接衡量；这对承销增长故事很重要。风险侧主要有两条。第一是集中度：银行在名单中过度代表，少数锚定银行可能驱动大部分收入；若失去或重谈一个大客户，财务影响可能很实质。大型受监管企业的采购和安全审查周期又很长，会放慢任何流失账户的替换。第二是外部复杂性：独立报道警告，巴西法院内部采用
