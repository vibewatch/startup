      - number: '5.3'
        title: 信任、安全、合规和质量
        blocks:
          - type: paragraph
            body: >-
              Enter 为受监管企业处理敏感诉讼数据，并产出会提交给法院的文件，因此信任和质量控制是产品核心，而非事后补丁。公司声称静态和传输中采用 AES-256 加密与 TLS 1.2，访问控制支持单点登录，拥有 SOC
              2 和 ISO 27001/27701 认证，并使用 OpenAI 的零数据留存政策来限制客户数据暴露给模型供应商。底层 AWS 平台的 ISO 27001 和 SOC 合规、Anthropic
              的企业数据处理承诺，都有独立发布资料，可增强云安全姿态的可信度。但 Enter 自身认证仍是公司口径，公开资料没有独立确认；考虑到企业买方极重视这些认证，这是具体验证缺口。质量上，提交前强制人工复核是防止 AI
              幻觉或错误的主要安全阀；它显著降低但不能消除有缺陷的 AI 生成文件进入法院的风险，独立报道中的法律 AI 可靠性问题让这一风险更具体。监管暴露叠加其上：巴西待审 AI 法案可能对 Enter
              正在执行的自动化法律决策施加可解释性或监督义务。信任故事完整、设计合理，但安全认证和零留存口径应在尽调中验证，而不能直接采信。
