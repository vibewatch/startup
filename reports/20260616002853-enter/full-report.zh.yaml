  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础、分层和质量
        blocks:
          - type: paragraph
            body: >-
              Enter 客户数量不多，但质量很重：40 多家巴西大型企业，偏向诉讼最密集的垂直行业。银行和 fintech 主导已命名名单——Nubank、Itau、Santander、Bradesco、C6
              Bank、Banco Mercantil 和 BMG；此外还有保险公司 SulAmerica，航空公司 LATAM 和 Azul，Mercado Livre、iFood、Airbnb 等 marketplace
              和配送玩家，以及电信公司 Vivo。这些不是试验性买方：许多都是大型上市公司，其投资者披露确认了它们管理的诉讼风险规模，也解释了为什么需要 Enter，并支撑关系耐久性。买方坐在拥有诉讼预算的法务和运营职能里，与
              Enter 的「work, not
              software」表述一致。分层逻辑清楚：诉讼负担重、资本充足的机构，只要抗辩结果改善几个百分点，就能转化为很大的绝对节省。反面是集中度——银行在客户名单中占比很高，少数锚定机构很可能贡献了过高收入份额。40
              多家的口径来自公司，且没有公开、可验证的完整客户名单；虽然头部 logo 得到巴西一线媒体佐证，精确客户基数仍应在尽调中确认。
