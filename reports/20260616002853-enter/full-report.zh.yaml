      - number: '8.2'
        title: 倍数、增长与情景分析
        blocks:
          - type: paragraph
            body: >-
              要把头部价格换算成倍数，只能先估算，因为 Enter 没有披露绝对收入。公司披露的 10x 至 13x 增长，套用外部对 2025 年基数的估计，到 2026
              年中期可能意味着低数亿美元区间的年化收入；据此，US$1.2 billion 估值大约对应 8x 至 12x 收入倍数。绝对水平偏高，但在 2026 年融资热潮中的高增长 AI
              同行里大体说得通。这轮热潮有两面：它推高了整个赛道的估值，支撑 Enter 的定价；同时也提高了价格中包含情绪溢价的风险。增长若能核实，就是估值最强的支撑；若现金流为正的说法也成立，Enter
              相比仍在烧钱的可比公司会显得异常省钱，估值理由进一步增强。情景分析给出区间：牛市情景下，公司持续多倍增长并拿下品类领导地位，估值重估到数十亿美元级别；基准情景下，增长仍强但放缓，价值维持在 Series B
              附近；熊市情景下，监管不利或锚定客户流失，估值明显压缩。因此回报画像是不对称的——上行空间很大，但下行风险真实存在。核心分析限制在于，倍数和情景都建立在尽调尚未核验的公司口径指标上。
            claimRefs:
