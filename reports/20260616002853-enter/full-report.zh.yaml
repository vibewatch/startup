  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和模块图谱
        blocks:
          - type: paragraph
            body: >-
              EnterOS 更像是大规模诉讼抗辩的操作系统，而不是法律 copilot。放到客户工作流里，它先接收大型企业涌入的诉讼，再推动每个案件穿过一串自动化阶段：案件录入和分流、反欺诈筛查——Enter 称每案运行
              30 多项验证——证据补强、和解建模、抗辩起草、庭审支持、裁判解读和上诉辅助。关键是，任何内容提交前都由人类律师复核 AI
              输出，因此系统不是完全自治，而是带强制控制点的增强工具。产品线划分清楚：面向消费者和大规模民事案件的民事诉讼产品、面向雇佣纠纷的劳动诉讼产品，以及针对巴西法院里常见的掠夺性和欺诈性索赔的滥诉检测模块。和解建模、庭审与上诉支持则作为跨领域阶段，被两条产品线共用。该模块图谱重建自
              Enter 自己的民事、劳动和滥诉页面，因此产品线存在有较充分证据；但每个阶段的内部成熟度仍属公司描述，缺少独立 benchmark。定义产品的核心选择是广度：Enter
              想拿下整个生命周期，这也是它能销售结果而非工具的原因。
