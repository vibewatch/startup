companyProfile:
  summary: >
    Enter 是一家巴西法律 AI 公司，为大型企业自动化处理大规模诉讼的全生命周期。公司由 Mateus Costa-Ribeiro（CEO）、Michael Mac-Vicar（CTO）和 Henrique Vaz（CPO）于
    2023 年 9 月创立，切入巴西这个诉讼密度极高的市场—— 8000 万件活跃诉讼，约为美国的 8 倍。Enter 部署 AI 智能体处理案件录入、欺诈检测（30
    多项检查）、证据补强、抗辩文书起草、和解建模和裁判解读，所有输出都必须由人类律师复核。平台 EnterOS 服务 40 多家大型企业，包括 Nubank、LATAM Airlines、Santander、Bradesco 和
    Mercado Livre。2026 年 5 月，Enter 完成 Founders Fund 领投、超过 US$100M 的 Series B 轮，估值 US$1.2B，成为拉美首家 AI 独角兽。公司自 2024
    年以来现金流为正，并披露 ARR 自 2025 年 4 月以来增长 13×。
