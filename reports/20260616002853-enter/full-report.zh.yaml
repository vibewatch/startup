      - number: '7.2'
        title: 运营、依赖和集中度风险
        blocks:
          - type: paragraph
            body: >-
              运营上，核心风险很简单：一个起草法律文件的 AI 系统可能出错，而法庭上的错误有后果。生成抗辩中的幻觉或事实错误是核心危险；Enter
              的强制人工复核能显著降低风险，但不能完全排除有缺陷文件漏过复核，尤其是在公司处理的案件量下。可靠性是第二条运营风险：诉讼有硬截止日期，宕机或处理失败会带来直接法律成本；诉讼数据敏感，数据泄露同时是安全事件和合规事件——如果
              Enter 声称但未验证的 SOC 2 和 ISO 认证经不起核查，风险会被放大。其他法律 AI 失败带来的声誉外溢，包括面向消费者工具的过度承诺，也可能污染整个品类，即使 Enter
              自身没有出事。依赖风险进一步叠加：Enter 依赖 OpenAI、Anthropic 和 Google 的第三方基础模型，依赖 AWS 基础设施，也依赖 CNJ 合作来支撑部分数据护城河；价格变化、宕机或 CNJ
              范围未确认，都可能造成伤害。最后，收入很可能集中在少数锚定银行，若失去或重谈一个头部账户，财务影响会很实质；大型企业采购周期长，也会拖慢替换。这些是中高风险，缓释措施部分存在，但多为公司口径。
