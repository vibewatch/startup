      - number: '2.2'
        title: 巴西诉讼市场规模
        blocks:
          - type: paragraph
            body: >-
              按案件量看，巴西诉讼体系是全球最大之一，这一规模构成 Enter 的机会底座。公开报道和国家司法委员会指向约 8000 万件活跃诉讼；公司和媒体都称这一数字约为美国的 8 倍。CNJ 的 Justica em
              Numeros 报告显示，2024 年新增案件 3940 万件。CNJ 年度统计和巴西法院更广泛的数字化，让这些案件负载异常适合机器读取，而自动化平台正需要这样的数据土壤。需求侧，七大银行据报合计持有约
              R$80.2B
              诉讼准备金，这可以代理大型企业为法律风险预留的资金规模，也意味着部分预算可能转向能降低损失的工具。除消费者和大规模民事纠纷外，劳动诉讼还构成一个规模大且独立的案件切片，进一步拓宽可服务市场。这些数字可靠度不一：绝对案件数来自
              CNJ，置信度高；8 倍美国的比较和银行准备金总额则是四舍五入、公司来源的叙事，尽调应把它们当作方向性信息，而非审计口径。
