      - number: '8.3'
        title: 折价、护城河、退出与最终判断
        blocks:
          - type: paragraph
            body: >-
              估值有真实护城河支撑，但也必须为真实风险打折。折价端，巴西监管敞口——LGPD、ANPD 对自动化决策的监管，以及待审 AI
              法案——相较低风险司法辖区需要折价；在增长和现金流说法被验证前，缺少经审计财务报表还应再打折。客户质量高，由大型上市银行和保险公司锚定，但可能的集中度削弱了收入耐久性。支撑端，纵向一体化叠加巴西本土案件数据优势，撑起了横向
              copilots 缺少的定价权；Nubank、Santander、iFood、Mercado Livre、C6 等高诉讼量巴西企业，则把数字背后的收入机会锚住。退出路径可信，但并不临近：Relativity
              的秘密 IPO 申报显示 legaltech 退出窗口正在打开；被全球法律 AI 或数据公司战略收购，也是可信替代路径。由此得到的建议，是有条件、带风险意识地参与：入场价格应在 Series B
              或更好，仓位按内含期权控制，并明确以完成一份尽调清单为前提——经审计财务报表和收入桥、独立安全认证、股权结构和优先权条款、客户集中度数据、CNJ 合作文件，以及关于 AI
              监管的法律意见。预先承诺的推翻论点触发器包括：AI 监管不利、前三大客户流失，以及任何增长说法无法核验。净判断是中等信心的正面结论，但以披露为条件，并需持续监控监管。
