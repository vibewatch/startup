        title: 融资、估值和股东版图
        blocks:
          - type: paragraph
            body: >-
              Enter 的资本故事支撑了它的独角兽叙事。2023 年，公司获得 ONEVC 的 pre-seed；2025 年 3 月，完成 Sequoia Capital 领投的 US$5.5M 种子轮——外界称这是
              Sequoia 自 Nubank 以来 12 年里首次投资巴西；2025 年 9 月，公司又完成 Founders Fund 与 Sequoia 共同领投、估值 US$350M 的 US$35M Series A
              轮，这也标志着 Founders Fund 自 2016 年 Nubank Series C 以来重返巴西。2026 年 5 月，Enter 完成 Founders Fund 领投、超过 US$100M（约
              R$500M）的 Series B 轮，Kaszek、Ribbit Capital、Sequoia、OneVC 和 Atlantico 参投，估值 US$1.2B（R$6.4B）。Valor
              International、Bloomberg、Forbes Brasil 等均佐证了这一估值，使 Enter 成为拉美首家 AI 独角兽，也是 2024 年以来巴西首家独角兽。累计融资估计约 US$140M，但
              Enter 没有发布经调和的生命周期融资总额。公司从种子轮到十亿美元估值大约只用了 14 个月，速度异常快，既反映投资人强 conviction，也反映 2026 年 AI
              融资的泡沫热度。股东版图完全来自公开融资公告；准确持股、优先权和董事会构成仍未披露，应放进数据室核查。
