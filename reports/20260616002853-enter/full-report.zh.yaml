appendices:
  - id: A
    title: 来源与方法
    blocks:
      - type: paragraph
        body: >
          本报告基于 2026-06-16 研究运行期间抓取并审阅的公开来源。来源包括公司官方页面、巴西财经媒体（Valor Econômico、Forbes Brasil、Pipeline Valor）、英文报道（Latam
          Republic、Yahoo Finance、The Briefs、AI Market Watch）、竞争对手披露（Harvey、Legora、Luminance、Relativity）、客户 IR 页面（Banco
          Mercantil、Santander）、巴西监管来源（CNJ、ANPD），以及第三方法律市场分析（Business & Human Rights Resource Centre、Migalhas）。收入和 ARR
          数字来自管理层披露的增长倍数，并套用于根据 Series A 披露推断的基线；公开渠道没有审计财务数据。
        claimRefs: []
