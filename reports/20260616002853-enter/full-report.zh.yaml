        title: 已命名证据和采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Enter 最强的客户证据，是一组带具体指标的生产环境案例。Nubank 报告其前三大诉讼类别的胜诉率提升 6 个百分点，实施速度快 2.5x，并识别出一个由 10 名滥诉者组成、贡献某些案件 38%
              的网络；如今 Nubank 约 80% 的案件准备工作通过 Enter 完成。LATAM 在 12 个月内将 Enter 覆盖的消费者诉讼比例从 12% 提升到 70%，并报告驳回案件增加 30%、2025
              年节省 R$15M、平均判赔降低 13%、生成约 18,600 份抗辩草稿。Banco Mercantil 报告胜诉率提高 12 个百分点、平均判赔降低 25%，还发现一名连续诉讼者提交 97%
              相同的文件；SulAmerica 处理超过 30,000 件案件，并发现一名律师提交了 1,000 多起带有近乎相同医疗报告的案件。两点最突出。第一，采用轨迹是真正的
              land-and-expand：客户从一个组合切片起步，再把 Enter 扩展到多数工作负载，这是档案里最清晰的隐含净扩张信号。第二，反欺诈检测不只是效率提升，而是直接节省成本，足以解释预算投入。关键
              caveat 是，所有数字都由公司发布，未经独立审计，因此结果具体且可信，但仍需做客户访谈核验。
