chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品和运营模式
        blocks:
          - type: paragraph
            body: >-
              Enter 最初名为 Talisman AI，2023 年 9 月成立，总部位于 São Paulo。它是一家法律 AI 公司，EnterOS
              平台为巴西大型企业自动化处理大规模民事和劳动诉讼的全生命周期。产品围绕智能体工作流搭建，覆盖案件录入、反欺诈检查、证据补强、和解建模、抗辩文书起草、庭审支持、裁判解读和上诉；任何材料提交前，都由人类律师复核 AI
              输出。人机协同设计支撑了 Enter 独特的商业叙事：公司卖的是带律师复核的法律结果——「work, not software」——让客户把支出记入法律预算，而不是 IT
              预算。收入结构是混合型：前置技术订阅费，加上约 30% 与诉讼成功挂钩的可变部分，把 Enter 的经济利益与企业客户关心的抗辩结果绑定。São Paulo 是巴西最大城市和金融中心，Enter
              就坐在该国银行、保险和消费者诉讼市场的中心，也贴近它已经服务的买方。enter.legal 企业域名与 getenter.ai 并行使用，进一步强化了法律服务定位，后续章节也把这一点作为基本事实。
