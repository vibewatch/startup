      - number: '1.2'
        title: 创始人、领导层和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Enter 由三位联合创始人领导，公开资料也把公司身份高度集中在他们身上。25 岁的 CEO Mateus Costa-Ribeiro 拥有哈佛法学 LL.M.，18 岁成为巴西最年轻律师，20
              岁通过纽约州律考，并放弃 Stanford MBA 全额奖学金创业；他负责战略、融资和对外定位。CTO Michael Mac-Vicar 曾在巴西最知名的科技公司之一 Wildlife Studios 担任约
              12 年 CTO，压住 Enter 的工程和高吞吐 AI 基础设施。CPO Henrique Vaz 是哈佛毕业生，曾任 Wildlife CMO，也在 Tesla 工作过，负责产品和
              go-to-market。法律、游戏级工程和产品背景拼在一起，构成公司对 founder-market fit
              的公开论证：既有深领域信用，也有规模化运营经验。反面是战略、技术和产品都压在三个人身上，关键人依赖很高；治理也有缺口：截至 2026 年中，Enter 没有披露独立董事名单或其他 C-level
              高管，这是明确的尽调项。Talisman AI 到 Enter 的更名属于同一条成熟化叙事，但公开资料记录不多。
