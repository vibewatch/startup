  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和替代方案
        blocks:
          - type: paragraph
            body: >-
              Enter 所在市场与其说由软件类别定义，不如说由巴西诉讼结构决定。它的边界是企业大规模诉讼抗辩——大型公司面对的高频民事和劳动案件——而不是全球大多数法律 AI
              工具竞争的律所研究、合同审查和电子取证细分市场。买方是银行、保险公司、航空公司和 marketplace，诉讼量常以数万件计。Enter 盯住的预算坐在法务和运营里，并以「work, not
              software」包装，让采购按诉讼结果核算，而非 IT 科目。Enter
              替代的现状，是企业内部法务团队、按小时或按案收费的外部律所，以及手工文档流程的混合体。这一界定直接影响市场测算：它排除了泛法律软件支出，而是锚定大规模诉讼抗辩的成本与体量；巴西这一类别异常庞大，且外国工具多为普通法研究而生，只能部分覆盖。市场边界因此把一个清晰用例，与一组诉讼负担极重的巴西企业买方绑定。
