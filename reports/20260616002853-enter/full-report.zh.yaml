        title: 架构、基础设施和差异化
        blocks:
          - type: paragraph
            body: >-
              技术上，Enter 是多模型 AI 系统，而不是单模型应用。它把 OpenAI、Anthropic 和 Google 的模型编排进对应诉讼阶段的智能体工作流，运行在 Amazon Web Services
              上，并声称每天处理约 200 亿 token；若属实，这让它跻身巴西本土最大的 AI 推理消费方之一，也意味着严肃的吞吐工程能力，可能受益于 CTO
              的游戏级基础设施背景。模型广度也是依赖项：高度依赖第三方基础模型，使 Enter 的能力和可变成本暴露在供应商决策下，这是尽调需要计入权重的结构性风险。差异化来自原始模型之外的两点。第一是垂直整合：Enter
              执行完整生命周期，而不是辅助离散任务，因此积累了横向 copilot 没有的工作流工具和数据。第二是巴西特定数据护城河：每年处理 300,000 多件案件，加上公司称与国家司法委员会合作建设历史案件数据库，让
              Enter 拥有外国工具缺乏的本土语料和程序知识。反欺诈系统声称可检测 prompt injection、网络欺诈和文件伪造，是本地专业化的具体体现。架构可信，也与问题匹配，但多数细节来自公司陈述，外部文档不足。
