company:
  name: Enter
chapter:
  number: 7
  title: Risks
  summary: >-
    Enter's risk profile is dominated by regulatory and concentration exposure. Brazil's data-protection
    law (LGPD), the ANPD's work on automated decisions, and the pending AI bill (PL 2338/2023) bear directly
    on a platform that automates legal decision-making at scale — a tension underscored by the CEO's own
    Senate testimony. Operationally, AI error and hallucination in court filings are mitigated but not
    eliminated by mandatory human review. Dependency risk runs through third-party foundation models (OpenAI,
    Anthropic, Google), AWS, the CNJ partnership, and heavy revenue concentration in a few anchor banks.
    Financial risk centers on undisclosed economics and outcome-linked revenue variability, while execution
    risk sits with a three-founder team scaling extremely fast. Human review and local specialization
    are the key mitigants.
sections:
- id: section-1
  title: Regulatory and legal risk
  body: >-
    The single most important risk cluster for Enter is regulatory, because the company automates precisely
    the activity that Brazilian regulators are moving to scrutinize. The LGPD, Brazil's data-protection
    statute enforced by the ANPD, governs how Enter processes the personal data embedded in litigation
    records, and the ANPD has been actively consulting on artificial intelligence and automated decisions
    — a category that plainly includes AI-generated legal outputs. A technical note and public consultation
    on automated decisions, analyzed by Brazilian law firms, signal that oversight of exactly Enter's
    kind of decision-making is an active 2026 agenda. On top of that sits the pending AI bill, PL 2338/2023,
    which could impose obligations on high-risk automated systems; tellingly, Enter's own CEO testified
    before the Senate to oppose aspects of it, which both demonstrates engagement and confirms that the
    company sees real regulatory exposure. The concrete risks are higher compliance cost, constraints
    on how much can be automated, limits on court-data use that could erode the data moat, and professional-liability
    exposure if AI errors reach courts. Brazil's legaltech regulation is still evolving, so the rules
    Enter must satisfy in twelve months may differ from today's. This is a high-likelihood, high-impact
    cluster whose mitigation maturity — human review plus active engagement — is real but unproven against
    a final regime that does not yet exist.
  claimRefs:
