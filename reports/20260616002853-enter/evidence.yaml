evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue and ARR disclosure
    missingEvidence: Audited ARR, revenue, and cash-flow statements
    whyItMatters: Cash-flow-positive and revenue-multiple claims cannot be verified without financials.
    diligencePath: Request audited financials and a revenue bridge in the data room.
    relatedQuestionRefs:
      - QO014
      - QO019
  - type: missing-source
    severity: material
    topic: governance and board composition
    missingEvidence: Board roster, voting rights, and preference stack
    whyItMatters: Key-person and control risk cannot be sized without governance disclosure.
    diligencePath: Obtain the cap table, shareholders' agreement, and board charter.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: total capital raised
    missingEvidence: Reconciled lifetime funding total
    whyItMatters: Cumulative raised is estimated from round announcements, not disclosed.
    diligencePath: Confirm the consolidated funding total and any secondaries or debt.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: independent market sizing
    missingEvidence: A third-party study pricing Brazil's enterprise litigation-automation TAM
    whyItMatters: Sizing relies on lenses and company figures rather than an audited market estimate.
    diligencePath: Commission or source an independent market study and reconcile against CNJ data.
    relatedQuestionRefs:
      - QM006
      - QM015
  - type: conflicting-evidence
    severity: minor
    topic: litigation-volume estimates
    missingEvidence: Reconciliation between rounded media figures and precise CNJ counts
    whyItMatters: Headline volume figures vary, weakening point estimates.
    diligencePath: Anchor all sizing to the latest CNJ Justica em Numeros dataset.
    relatedQuestionRefs:
      - QM017
  - type: private-evidence-only
    severity: material
    topic: serviceable obtainable market
    missingEvidence: Audited customer and case-throughput counts
    whyItMatters: SOM rests on company-claimed 40+ customers and 300k+ cases.
    diligencePath: Verify customer logos and case volumes in the data room.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
