      - number: '2.4'
        title: Growth drivers, constraints, and gaps
        blocks:
          - type: paragraph
            body: >-
              The market's trajectory is shaped by a tug-of-war between strong structural drivers and real constraints.
              On the driver side, Brazil's caseload keeps rising, the judiciary's digitalization creates the data
              substrate automation depends on, and a wave of abusive and predatory litigation makes anti-fraud and
              defense tooling a budget priority — independent reporting explicitly links AI adoption in Brazilian courts
              to both greater efficiency and more lawsuits. The global legal-AI funding boom, with Harvey and Legora
              raising at multibillion-dollar valuations, lends the category capital and credibility and frames Enter as
              Latin America's first AI unicorn. Against those tailwinds sit constraints that diligence must weigh:
              Brazil's pending AI bill (PL 2338/2023) could impose obligations on automated legal decision-making, LGPD
              adds privacy-compliance cost to processing litigation data at scale, and the trust, explainability, and
              human-review requirements that make legal AI palatable also cap how much can be automated and how quickly
              enterprises adopt. Finally, the sizing itself carries gaps: litigation-volume estimates vary between
              rounded media figures and precise CNJ counts, and Enter's throughput and provision figures are
              company-sourced. The market is large and growing, but its addressable value and Enter's share within it
              remain evidence-constrained.
