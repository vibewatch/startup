  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              EnterOS is best understood not as a legal copilot but as an operating system for defending mass
              litigation. In customer-workflow terms, it ingests a large enterprise's incoming lawsuits and drives each
              one through a sequence of automated stages: case intake and triage, anti-fraud screening that Enter says
              runs more than 30 verifications per case, evidence enrichment, settlement modelling, defense drafting,
              hearing support, ruling interpretation, and appeal assistance. Crucially, human lawyers review every AI
              output before anything is filed, so the system is designed as augmentation with a mandatory control point
              rather than full autonomy. The product is organized into clear lines: a civil-litigation product for
              consumer and mass civil cases, a labor-litigation product for employment disputes, and an
              abusive-litigation detection module aimed at predatory and fraudulent claims that are endemic in Brazil's
              courts. Settlement modelling and hearing-and-appeal support sit as cross-domain stages used by both lines.
              This module map is reconstructed from Enter's own civil, labor, and abusive-litigation pages, so the
              existence of the lines is well evidenced while the internal maturity of each stage is company-described
              and not independently benchmarked. The defining product choice is breadth: Enter aims to own the whole
              lifecycle, which is what lets it sell outcomes rather than a tool.
