  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and quality
        blocks:
          - type: paragraph
            body: >-
              Enter's revenue model is the most distinctive thing about its financial profile. Rather than selling
              software seats, it charges a hybrid fee: an upfront technology subscription plus a variable component
              reported at roughly 30 percent that is tied to litigation success. The company frames this as buying legal
              outcomes — 'work, not software' — so the spend lands in a client's legal and operations budget rather than
              IT procurement. That alignment is commercially attractive because it ties Enter's economics directly to
              the defense results its enterprise customers care about, and it supports expansion as clients route a
              growing share of their case preparation through the platform. It also introduces revenue quality nuance: a
              meaningful slice of revenue is contingent on outcomes, which makes it inherently more variable than pure
              subscription ARR and harder to forecast. Revenue durability is underpinned by the caliber of the customer
              base — large, well-capitalized banks and insurers such as Bradesco, Santander, Itau, SulAmerica, and Banco
              Mercantil, whose investor disclosures confirm the scale of litigation exposure they manage. The model is
              therefore high-alignment and arguably high-quality, but the contingent portion and the absence of a
              disclosed subscription-versus-success split mean revenue quality cannot be fully assessed from public
              information.
