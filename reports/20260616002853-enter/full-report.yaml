  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, price context, and comparables
        blocks:
          - type: paragraph
            body: >-
              Enter's US$1.2 billion Series B is a landmark price: it makes the company Latin America's first AI unicorn
              and, by reporting, the third legaltech globally valued above US$1 billion. The investment thesis is
              coherent and four-legged — a structurally enormous Brazilian litigation market, a defensible vertically
              integrated product with a domestic case-data moat, a roster of marquee, expanding enterprise customers,
              and exceptional reported growth at apparent capital efficiency. Set against the category's comparables,
              Enter is the smallest by headline valuation: Harvey is valued near US$11 billion, Legora around US$5.6
              billion after its Series D, Relativity about US$3.6 billion ahead of a possible listing, Clio at roughly
              US$3 billion, and Luminance smaller still on a US$75 million Series C. Those peers mostly serve law firms
              in common-law markets, so the comparison is directional rather than like-for-like, but it frames Enter as
              priced at a fraction of the leaders while occupying a niche none of them targets. The headline price is
              well corroborated — Valor, Bloomberg, and Forbes independently report the US$1.2 billion mark — which
              reduces information risk on the number itself, even as the metrics that justify it remain partly
              company-sourced. Scarcity matters too: being the first LatAm AI unicorn confers franchise visibility and
              access that support the price beyond pure fundamentals.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV018
              - CV019
              - CV039
              - CV041
          - type: table
            tableRef: TV004
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV016
              - CV011
              - CV004
      - number: '8.2'
        title: Multiple, growth, and scenario analysis
        blocks:
          - type: paragraph
            body: >-
              Translating the headline price into a multiple requires an estimate, because Enter discloses no absolute
              revenue. Reported growth of 10x to 13x applied to an external estimate of a 2025 base implies a run-rate
              somewhere in the low hundreds of millions of US dollars by mid-2026, which puts the US$1.2 billion
              valuation at roughly an 8x-to-12x revenue multiple — rich in absolute terms but broadly in line with
              high-growth AI peers during the 2026 funding boom. That boom is double-edged: it lifts the whole
              category's valuations, supporting Enter's mark while also raising the risk that part of the price is
              sentiment. The growth itself, if verified, is the strongest justification for the valuation, and the
              claimed cash-flow positivity would make Enter unusually capital-efficient versus cash-burning comparables,
              strengthening the case further. Scenario analysis frames the range: a bull case of sustained multi-fold
              growth and category leadership re-rates Enter into the multibillion-dollar tier; a base case of strong but
              decelerating growth holds the value near the Series B mark; and a bear case of adverse regulation or
              anchor-customer loss compresses it materially. The resulting return profile is asymmetric — large upside
              against a live downside — and the central analytical caveat is that both the multiple and the scenarios
              rest on company-sourced metrics that diligence has not yet verified.
            claimRefs:
              - CV011
              - CV012
