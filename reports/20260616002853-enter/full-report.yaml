      - number: '3.3'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Enter's defensibility rests on two pillars: vertical integration into clients' litigation operations and a
              Brazilian case-data moat built from processing more than 300,000 cases a year, a domestic corpus that
              foreign tools do not possess. Embedding into case preparation — to the point where an anchor customer
              routes a majority of its prep through the platform — creates real switching costs, and outcome-based
              pricing is operationally hard to replicate without comparable execution depth. But the risks are equally
              concrete. Enter is far less capitalized than Harvey or Legora, leaving it exposed in a capital-intensive
              AI race; a well-funded global leader could enter Brazil; improving foundation models could commoditize
              parts of the workflow; and incumbents like LexisNexis and Westlaw hold distribution and content
              relationships that dwarf Enter's. Enterprises can also multi-home across tools, and rivals could imitate
              success-based pricing over time. Finally, the category carries reputational risk: adverse evidence on
              legal-AI reliability, illustrated by consumer-facing tools that overpromised, is a reminder that trust
              failures hurt everyone, which is precisely why Enter's mandatory human review is both a constraint and a
              safeguard. The moat is plausible but unproven against a better-funded field.
