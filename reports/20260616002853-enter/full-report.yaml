        title: Funding, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Enter's capital story is the spine of the unicorn narrative. After a 2023 pre-seed from ONEVC, the company
              raised a US$5.5 million seed led by Sequoia Capital in March 2025 — described as Sequoia's first Brazil
              investment in twelve years, since Nubank — then a US$35 million Series A at a US$350 million valuation
              co-led by Founders Fund and Sequoia in September 2025, which also marked Founders Fund's return to Brazil
              since its 2016 Nubank Series C. In May 2026 Enter closed a Series B of more than US$100 million (about
              R$500 million) led by Founders Fund, with Kaszek, Ribbit Capital, Sequoia, OneVC, and Atlantico
              participating, at a US$1.2 billion (R$6.4 billion) valuation. That mark is corroborated by Valor
              International, Bloomberg, Forbes Brasil, and others, and makes Enter Latin America's first AI unicorn and
              the first Brazilian unicorn since 2024. Cumulative capital is estimated at roughly US$140 million, though
              Enter does not publish a reconciled lifetime total. The progression from seed to a billion-dollar
              valuation in roughly fourteen months is unusually fast and reflects both strong investor conviction and
              the froth in 2026 AI financing. The stakeholder map is assembled entirely from public round announcements;
              exact ownership, preferences, and board composition remain undisclosed and belong in a data room.
