        title: Financial, people, and execution risk with mitigations
        blocks:
          - type: paragraph
            body: >-
              The remaining risks concentrate in financials, people, and the pace of growth, and they are best read
              alongside the mitigations and kill criteria that would govern an investment. Financially, Enter discloses
              no audited economics, so its growth and cash-flow-positive claims cannot be independently verified, and
              its outcome-linked revenue introduces variability that pure-subscription businesses avoid; heavy
              AI-inference spend is a capital-intensity risk if growth stalls. On people, strategy, technology, and
              product all sit with three founders, and the CEO is notably young, which raises the importance of
              governance depth and a senior bench — concerns sharpened by how fast the company is scaling, where
              controls and quality can lag headcount. Competitive displacement by far better-funded rivals such as
              Harvey and Legora is a slower-moving but real threat. Against these, Enter's mitigations are mandatory
              human review, local specialization, and the CNJ data relationship, supported by active regulatory
              engagement. The thesis-break triggers a diligence team should pre-commit to are clear: an adverse
              AI-regulation outcome that bans or heavily restricts automated filings, the loss of a top-three customer,
              or a disruption to model-vendor access. The corresponding diligence asks — audited financials, independent
              certification proof, and customer-concentration data — would close the largest information gaps, while
              regulatory milestones on PL 2338 and ANPD guidance are the indicators to monitor continuously.
