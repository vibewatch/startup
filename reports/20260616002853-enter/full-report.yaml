      - number: '2.2'
        title: Scale of Brazil's litigation market
        blocks:
          - type: paragraph
            body: >-
              Brazil's litigation system is one of the largest in the world by volume, and that scale is the foundation
              of Enter's opportunity. Public reporting and the National Council of Justice point to a stock of roughly
              80 million active lawsuits — a figure company and media sources describe as about eight times the United
              States — with 39.4 million new cases filed in 2024 according to the CNJ's Justica em Numeros report. The
              CNJ's annual statistics and the broader digitalization of Brazilian courts make this caseload unusually
              machine-readable, which is precisely what an automation platform needs. On the demand side, the seven
              largest banks alone are reported to carry about R$80.2 billion in litigation provisions, a proxy for how
              much money large enterprises set aside against legal exposure and therefore how much budget could shift
              toward tools that reduce losses. Labor litigation forms a large and distinct slice of the caseload on top
              of consumer and mass civil disputes, widening the addressable base. These figures are not all equally
              solid: the absolute case counts come from the CNJ and are high-confidence, while the eight-times
              comparison and the bank-provision total are rounded, company-sourced framings that diligence should treat
              as directional rather than audited.
            claimRefs:
