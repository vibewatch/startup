      - number: '3.2'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, Enter differs from its neighbors less in raw model quality than in scope. Where copilots
              help lawyers draft and research, Enter claims to execute the full litigation lifecycle — intake, 30-plus
              anti-fraud checks, evidence enrichment, settlement modelling, defense drafting, hearing support, ruling
              interpretation, and appeals — as a vertically integrated platform with mandatory human review before
              filing. That breadth is paired with a commercial model that is unusual in the category: instead of
              per-seat or flat subscriptions, Enter combines a technology subscription with a roughly 30 percent
              success-linked component, aligning its economics to litigation outcomes and locating the spend in legal
              and operations budgets rather than IT. Its go-to-market is enterprise-direct to large Brazilian companies,
              contrasting with the law-firm channel motion that Harvey, Legora, and the research incumbents rely on. The
              trade-off is reach: Enter is Brazil-only and civil-law specialized, with no English-language product,
              while competitors span common-law jurisdictions and multiple languages. On trust and regulatory posture,
              Enter's human-in-the-loop design and Brazilian compliance exposure differentiate it from US and UK rivals
              operating under different legal-AI norms. The comparison favors Enter on depth and alignment but favors
              incumbents on capital, distribution, and geographic breadth.
