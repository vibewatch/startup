  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Enter operates in a market defined less by software category than by the structural reality of Brazilian
              litigation. The boundary is enterprise mass-litigation defense — high-volume civil and labor cases brought
              against large companies — rather than the law-firm research, contract review, and e-discovery niches where
              most global legal-AI tools compete. The buyers are banks, insurers, airlines, and marketplaces whose
              litigation is measured in tens of thousands of cases, and the spend Enter targets sits in the legal and
              operations budget, framed as 'work, not software' so it is underwritten against litigation outcomes rather
              than IT line items. The status quo Enter displaces is a mix of in-house legal teams, outside law firms
              billing by the hour or case, and manual document workflows. That framing matters for sizing: it excludes
              generic legal-software spend and instead anchors on the cost and volume of defending mass litigation, a
              category that is unusually large in Brazil and only partially addressable by foreign tools built for
              common-law research. The market boundary therefore couples a clear use case with a specific,
              litigation-heavy set of Brazilian enterprise buyers.
