          - type: paragraph
            body: >-
              Enter's customer base is small in count but heavy in caliber: more than 40 large Brazilian enterprises,
              weighted toward the most litigation-intensive verticals. Banking and fintech dominate the named roster —
              Nubank, Itau, Santander, Bradesco, C6 Bank, Banco Mercantil, and BMG — alongside the insurer SulAmerica,
              the airlines LATAM and Azul, marketplaces and delivery players such as Mercado Livre, iFood, and Airbnb,
              and the telecom Vivo. These are not experimental buyers: many are large, publicly listed companies whose
              investor disclosures confirm the scale of litigation exposure they manage, which both explains why they
              need Enter and supports the durability of the relationships. The buyers sit in legal and operations
              functions that own litigation budgets, consistent with Enter's 'work, not software' framing. The
              segmentation has a clear logic: litigation-heavy, well-capitalized institutions where even small
              percentage-point improvements in defense outcomes translate into large absolute savings. The flip side is
              concentration — banking is heavily represented, so a few anchor institutions likely account for a
              disproportionate share of revenue. The 40-plus figure is itself company-claimed and not accompanied by a
              public, verifiable customer list, so while the marquee logos are corroborated by tier-one Brazilian media,
