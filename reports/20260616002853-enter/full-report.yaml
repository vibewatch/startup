chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Enter, founded as Talisman AI in September 2023 and headquartered in São Paulo, is a legal-AI company
              whose EnterOS platform automates the full lifecycle of mass civil and labor litigation for large Brazilian
              enterprises. The product is built around agentic workflows that handle intake, anti-fraud checks, evidence
              enrichment, settlement modelling, defense drafting, hearing support, ruling interpretation, and appeals,
              while human lawyers review every AI output before it is filed. That human-in-the-loop design underpins
              Enter's distinctive commercial framing: it positions itself as selling legal outcomes bundled with review
              — 'work, not software' — so that the spend is booked against a customer's legal budget rather than its IT
              budget. The revenue structure is hybrid, combining an upfront technology subscription with a roughly 30%
              variable component tied to litigation success, which aligns Enter's economics with the defense outcomes
              its enterprise clients care about. São Paulo, Brazil's largest city and financial center, situates Enter
              at the heart of the country's banking, insurance, and consumer-litigation markets, the same buyers it
              counts as customers. The enter.legal corporate domain operating alongside getenter.ai reinforces the
              legal-services positioning that later chapters reuse as ground truth.
