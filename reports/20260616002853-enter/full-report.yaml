      - number: '8.3'
        title: Discounts, moat, exit, and final verdict
        blocks:
          - type: paragraph
            body: >-
              The valuation must be discounted for real risks even as it is supported by a genuine moat. On the discount
              side, Brazilian regulatory exposure — LGPD, ANPD oversight of automated decisions, and the pending AI bill
              — warrants a haircut relative to lower-risk jurisdictions, and the absence of audited financials warrants
              a further discount until growth and cash-flow claims are verified; customer quality is high, anchored by
              large listed banks and insurers, but likely concentration tempers durability. On the support side,
              vertical integration plus a Brazil-specific case-data advantage underpins pricing power that horizontal
              copilots lack, and the breadth of high-litigation Brazilian enterprises — Nubank, Santander, iFood,
              Mercado Livre, C6, and others — anchors the revenue opportunity behind the number. Exit paths are
              plausible without being imminent: Relativity's confidential IPO filing shows legaltech exit windows
              opening, and a strategic acquisition by a global legal-AI or data player is a credible alternative. The
              recommendation that falls out of this is a conditional, risk-aware participation: entry discipline at the
              Series B price or better, sized for the embedded optionality, and explicitly contingent on clearing a
              defined diligence list — audited financials and a revenue bridge, independent security certifications, the
              cap table and preference terms, customer-concentration data, CNJ-partnership documentation, and a legal
              opinion on AI regulation. Pre-committed thesis-break triggers are adverse AI regulation, the loss of a
              top-three customer, and any failure to verify the growth claims. Net, the verdict is a moderate-confidence
              positive, conditioned on disclosure and monitored against regulation.
