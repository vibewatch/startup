  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and archetypes
        blocks:
          - type: paragraph
            body: >-
              The legal-AI landscape Enter sits inside is crowded at the top and structurally different from Enter's
              niche. The best-funded players are horizontal copilots and research suites aimed at law firms and
              corporate legal teams: Harvey, valued at roughly US$11 billion in 2026, builds agents for firms and
              enterprises; Legora, at about US$5.6 billion after a US$550 million Series D, offers a collaborative
              legal-AI workspace; Luminance specializes in AI contract analysis on a US$75 million Series C; and the
              research incumbents LexisNexis (Lexis+ AI) and Thomson Reuters Westlaw (Precision AI) bundle generative
              tools with decades of legal content. A second cluster handles adjacent execution: Clio, a US$3 billion
              practice-management platform pushing into AI and fintech, Relativity, an e-discovery and data-intelligence
              company valued near US$3.6 billion, and contract-lifecycle tools like Ironclad. Almost all of these are
              built for common-law research, drafting, and review rather than the mass-volume litigation operations that
              define Enter's market. Status-quo alternatives — retaining outside firms or building tooling in-house —
              round out the competitive set. The result is a field where Enter has few direct analogues but many
              well-capitalized neighbors who could, in principle, move toward its territory. Crucially, the competitors
              cluster by jurisdiction as well as by function: the largest names are anchored in common-law markets where
              research and drafting dominate billable work, whereas Brazil's civil-law and labor courts generate mass,
              repetitive defense work that those tools were never designed to industrialize, leaving Enter's specific
              lane comparatively open as of 2026.
