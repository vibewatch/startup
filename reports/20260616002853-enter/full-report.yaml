      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Enter is led by three co-founders, and the public record concentrates the company's identity in them.
              Mateus Costa-Ribeiro, the 25-year-old CEO, holds a Harvard Law LL.M., became Brazil's youngest lawyer at
              18, passed the New York Bar at 20, and left a full-ride Stanford MBA to found the company; he owns
              strategy, fundraising, and external positioning. Michael Mac-Vicar, the CTO, spent about twelve years as
              CTO of Wildlife Studios, one of Brazil's most prominent technology companies, and anchors Enter's
              engineering and high-volume AI infrastructure. Henrique Vaz, the CPO, is a Harvard graduate and former
              Wildlife CMO who also worked at Tesla, and he leads product and go-to-market. Their combined legal,
              gaming-scale engineering, and product backgrounds are the company's stated founder-market-fit case,
              pairing deep domain credibility with experience operating at scale. The flip side is that strategy,
              technology, and product all sit with three people, so key-person dependence is high and a governance gap
              remains: Enter discloses no independent board roster or additional C-level officers as of mid-2026, which
              is a concrete diligence item. The Talisman-AI-to-Enter rebrand is part of the same maturation story but is
              only lightly documented in public sources.
