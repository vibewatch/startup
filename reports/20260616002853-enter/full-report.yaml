companyProfile:
  summary: >
    Enter is a Brazilian legal AI company that automates the full lifecycle of mass litigation for large enterprises.
    Founded in September 2023 by Mateus Costa-Ribeiro (CEO), Michael Mac-Vicar (CTO), and Henrique Vaz (CPO), Enter
    addresses Brazil's uniquely litigious market — 80 million active lawsuits, eight times the US volume — by deploying
    AI agents that handle case intake, fraud detection (30+ checks), evidence enrichment, defense drafting, settlement
    modelling, and ruling interpretation, all subject to mandatory human-lawyer review. The platform, EnterOS, serves
    40+ large enterprises including Nubank, LATAM Airlines, Santander, Bradesco, and Mercado Livre. In May 2026, Enter
    raised over US$100M in a Series B at a US$1.2 billion valuation led by Founders Fund, becoming Latin America's first
    AI unicorn. The company has been cash-flow positive since 2024 and reports ARR growing 13× since April 2025.
