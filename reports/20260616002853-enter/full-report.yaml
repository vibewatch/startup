      - number: '2.3'
        title: Sizing lenses, segmentation, and obtainable market
        blocks:
          - type: paragraph
            body: >-
              Because no audited study prices Brazil's enterprise litigation-automation market, the responsible approach
              is to triangulate across several lenses rather than assert a single TAM. A provisions lens treats the tens
              of billions of reais that banks, insurers, and airlines reserve against litigation as the spend pool
              automation can attack; a volume lens multiplies the roughly 39 million annual new cases by an unpriced
              per-case service value; and a legal-spend lens models budget migrating from outside firms to platforms
              like Enter. Each lens is individually weak but together they bound a market measured in billions of reais
              of addressable spend, narrowing to a serviceable segment of mass civil and labor defense for a few hundred
              large enterprises. Enter's serviceable obtainable market today is evidenced by its 40-plus enterprise
              customers and a claimed 300,000-plus lawsuits processed per year, concentrated heavily in financial
              services that mirror Brazil's banking litigation load. That throughput figure is company-sourced and
              unaudited, so the SOM estimate inherits real uncertainty, and enterprise procurement cycles cap how fast
              it can grow. The segmentation is nonetheless coherent: litigation-intensive, well-capitalized buyers whose
              budget owners sit in legal and operations are the realistic near-term market.
