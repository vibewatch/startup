      - number: '7.2'
        title: Operational, dependency, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the defining risk is that an AI system drafting legal filings can be wrong, and in a
              courtroom being wrong has consequences. Hallucination or factual error in a generated defense is the core
              hazard, and while Enter's mandatory human review materially reduces it, review cannot fully eliminate the
              risk that a flawed filing slips through, especially at the volumes Enter processes. Reliability is a
              second operational thread: litigation runs on hard deadlines, so downtime or processing failures carry
              direct legal cost, and the sensitivity of litigation data makes a breach both a security and a compliance
              event — a risk amplified if Enter's claimed but unverified SOC 2 and ISO certifications do not hold up.
              Reputational spillover from legal-AI failures elsewhere, including consumer-facing tools that
              overpromised, can taint the category regardless of Enter's own record. Dependency risk compounds these:
              Enter relies on third-party foundation models from OpenAI, Anthropic, and Google, on AWS for
              infrastructure, and on the CNJ partnership for part of its data moat, so a pricing change, an outage, or
              an unconfirmed CNJ scope could each hurt. Finally, revenue is likely concentrated in a few anchor banks,
              so the loss or renegotiation of a top account would be financially material and slow to replace given long
              enterprise procurement cycles. These are medium-to-high risks with partial, mostly company-stated
              mitigations.
