- id: section-2
  title: Capability, pricing, and go-to-market comparison
  body: >-
    On capability, Enter differs from its neighbors less in raw model quality than in scope. Where copilots
    help lawyers draft and research, Enter claims to execute the full litigation lifecycle — intake, 30-plus
    anti-fraud checks, evidence enrichment, settlement modelling, defense drafting, hearing support, ruling
    interpretation, and appeals — as a vertically integrated platform with mandatory human review before
    filing. That breadth is paired with a commercial model that is unusual in the category: instead of
    per-seat or flat subscriptions, Enter combines a technology subscription with a roughly 30 percent
    success-linked component, aligning its economics to litigation outcomes and locating the spend in
    legal and operations budgets rather than IT. Its go-to-market is enterprise-direct to large Brazilian
    companies, contrasting with the law-firm channel motion that Harvey, Legora, and the research incumbents
    rely on. The trade-off is reach: Enter is Brazil-only and civil-law specialized, with no English-language
    product, while competitors span common-law jurisdictions and multiple languages. On trust and regulatory
    posture, Enter's human-in-the-loop design and Brazilian compliance exposure differentiate it from
    US and UK rivals operating under different legal-AI norms. The comparison favors Enter on depth and
    alignment but favors incumbents on capital, distribution, and geographic breadth.
  claimRefs:
  - CP014
  - CP015
  - CP016
  - CP017
  - CP018
  - CP020
  - CP022
  - CP029
  - CP032
  tableRefs:
  - TP002
  - TP003
  figureRefs:
  - FP002
- id: section-3
  title: Moat durability and competitive risk
  body: >-
    Enter's defensibility rests on two pillars: vertical integration into clients' litigation operations
    and a Brazilian case-data moat built from processing more than 300,000 cases a year, a domestic corpus
    that foreign tools do not possess. Embedding into case preparation — to the point where an anchor
    customer routes a majority of its prep through the platform — creates real switching costs, and outcome-based
    pricing is operationally hard to replicate without comparable execution depth. But the risks are equally
    concrete. Enter is far less capitalized than Harvey or Legora, leaving it exposed in a capital-intensive
    AI race; a well-funded global leader could enter Brazil; improving foundation models could commoditize
    parts of the workflow; and incumbents like LexisNexis and Westlaw hold distribution and content relationships
    that dwarf Enter's. Enterprises can also multi-home across tools, and rivals could imitate success-based
    pricing over time. Finally, the category carries reputational risk: adverse evidence on legal-AI reliability,
    illustrated by consumer-facing tools that overpromised, is a reminder that trust failures hurt everyone,
    which is precisely why Enter's mandatory human review is both a constraint and a safeguard. The moat
    is plausible but unproven against a better-funded field.
  claimRefs:
