summary:
  headline: >
    Enter is the dominant AI-powered mass-litigation platform for Brazil's uniquely vast legal market, growing at
    exceptional speed with blue-chip customers and Tier-1 investors, but carrying key-person and market-concentration
    risk as it attempts global expansion.
