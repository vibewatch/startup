- id: section-2
  title: Named proof and adoption trajectory
  body: >-
    Enter's strongest customer evidence is a set of detailed, production case studies with concrete metrics.
    Nubank reports a six-percentage-point improvement in success rate across its top three litigation
    categories, 2.5x faster implementation, and the identification of a network of ten abusive litigants
    behind 38 percent of certain cases, and it now routes roughly 80 percent of its case preparation through
    Enter. LATAM expanded Enter from 12 percent to 70 percent of its consumer litigation in twelve months,
    reporting a 30 percent rise in cases dismissed, R$15 million saved in 2025, a 13 percent reduction
    in average condemnation, and about 18,600 draft defenses generated. Banco Mercantil reports a twelve-percentage-point
    success-rate gain and a 25 percent reduction in average condemnation, plus the exposure of a serial
    litigant filing 97 percent identical documents, while SulAmerica processed more than 30,000 cases
    and surfaced a single lawyer behind 1,000-plus filings with near-identical medical reports. Two things
    stand out. First, the adoption trajectory is genuine land-and-expand: customers start on a portfolio
    slice and grow Enter to a majority of their workload, the clearest implied net-expansion signal in
    the file. Second, the anti-fraud detections are not just efficiency wins but direct savings that justify
    the spend. The important caveat is that every figure is company-published and not independently audited,
    so the outcomes are credible and specific but should be reference-checked.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
