- id: section-3
  title: Retention, expansion, and concentration risk
  body: >-
    Read as a portfolio, Enter's customer evidence is encouraging on durability but incomplete on formal
    metrics. The expansion seen at LATAM and Nubank — moving from a pilot slice to the majority of litigation
    workload — is a strong directional signal of net revenue retention and customer satisfaction, and
    the reference quality of named tier-one logos is itself an asset when selling to the next regulated
    buyer. But Enter discloses no formal net revenue retention, gross retention, or churn figures, so
    durability is inferred rather than measured, and that gap matters for underwriting a growth story.
    On the risk side, two themes dominate. The first is concentration: banking is heavily over-represented
    in the roster, so a small number of anchor banks probably drive a large share of revenue, and the
    loss or renegotiation of one could be material — a risk compounded by the long procurement and security-review
    cycles that large regulated enterprises impose, which slow replacement of any lost account. The second
    is an external complication: independent reporting warns that AI adoption inside Brazil's courts can
    itself fuel more litigation, which could raise customers' caseloads in ways that cut both for and
    against Enter. Net, the customer chapter shows real, expanding, high-quality relationships, with verification
    and concentration as the two diligence priorities.
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
