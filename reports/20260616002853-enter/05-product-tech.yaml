  - type: private-evidence-only
    severity: material
    topic: model and accuracy benchmarks
    missingEvidence: Independent accuracy and error-rate metrics for AI-drafted filings
    whyItMatters: Quality and AI-error risk cannot be sized from company claims alone.
    diligencePath: Obtain internal QA metrics and run reference checks.
