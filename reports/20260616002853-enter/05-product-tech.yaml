  - FE004
- id: section-3
  title: Trust, security, compliance, and quality
  body: >-
    Because Enter processes sensitive litigation data for regulated enterprises and produces documents
    that go to court, trust and quality controls are central to the product, not an afterthought. The
    company claims AES-256 encryption and TLS 1.2 in transit and at rest, single sign-on for access control,
    SOC 2 and ISO 27001/27701 certifications, and use of OpenAI's zero-data-retention policy to limit
    exposure of client data to model vendors. The underlying AWS platform's ISO 27001 and SOC compliance,
    and Anthropic's enterprise data-handling commitments, are independently published and lend plausibility
    to the cloud-security posture. However, Enter's own certifications are company-claimed and not independently
    confirmed in public sources, which is a concrete verification gap given how much weight enterprise
    buyers place on them. On quality, mandatory human review before filing is the primary safeguard against
    AI hallucination or error, and it materially reduces but does not eliminate the risk that a flawed
    AI-generated filing reaches a court — a risk independent reporting on legal-AI reliability makes tangible.
    Layered on top is regulatory exposure: Brazil's pending AI bill could impose explainability or oversight
    obligations on exactly the kind of automated legal decision-making Enter performs. The trust story
    is coherent and well-designed, but its security certifications and zero-retention claims should be
    validated in diligence rather than taken at face value.
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE029
  - CE030
