chapter:
  number: 5
  title: Product & Technology
  summary: >-
    EnterOS is an agentic platform that industrializes the full lifecycle of mass civil and labor litigation
    defense: case intake, 30-plus anti-fraud checks, evidence enrichment, settlement modelling, defense
    drafting, hearing support, ruling interpretation, and appeal assistance, with human lawyers reviewing
    every output before filing. It runs on a multi-model stack (OpenAI, Anthropic, Google) over AWS, with
    company-claimed SOC 2 and ISO 27001/27701 controls, AES-256 encryption, SSO, and OpenAI zero-data-retention.
    Its differentiation is vertical integration plus a Brazilian case-data moat — including a stated CNJ
    historical-case-database partnership — and abusive-litigation detection. Most product, security, and
    certification claims are company-sourced and warrant independent verification.
sections:
- id: section-1
  title: Product definition and module map
  body: >-
    EnterOS is best understood not as a legal copilot but as an operating system for defending mass litigation.
    In customer-workflow terms, it ingests a large enterprise's incoming lawsuits and drives each one
    through a sequence of automated stages: case intake and triage, anti-fraud screening that Enter says
    runs more than 30 verifications per case, evidence enrichment, settlement modelling, defense drafting,
    hearing support, ruling interpretation, and appeal assistance. Crucially, human lawyers review every
    AI output before anything is filed, so the system is designed as augmentation with a mandatory control
    point rather than full autonomy. The product is organized into clear lines: a civil-litigation product
    for consumer and mass civil cases, a labor-litigation product for employment disputes, and an abusive-litigation
    detection module aimed at predatory and fraudulent claims that are endemic in Brazil's courts. Settlement
    modelling and hearing-and-appeal support sit as cross-domain stages used by both lines. This module
    map is reconstructed from Enter's own civil, labor, and abusive-litigation pages, so the existence
    of the lines is well evidenced while the internal maturity of each stage is company-described and
    not independently benchmarked. The defining product choice is breadth: Enter aims to own the whole
    lifecycle, which is what lets it sell outcomes rather than a tool.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
