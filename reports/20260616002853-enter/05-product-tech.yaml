- id: section-2
  title: Architecture, infrastructure, and differentiation
  body: >-
    Technically, Enter is a multi-model AI system rather than a single-model application. It orchestrates
    models from OpenAI, Anthropic, and Google into agentic workflows mapped to each litigation stage,
    running on Amazon Web Services, and it claims to process around 20 billion tokens a day — a figure
    that, if accurate, places it among the largest domestic AI-inference consumers in Brazil and implies
    serious throughput engineering, plausibly informed by the CTO's gaming-scale infrastructure background.
    That model breadth is also a dependency: heavy reliance on third-party foundation models exposes Enter's
    capability and variable cost to vendor decisions, a structural risk the diligence should weight. Differentiation
    comes from two sources beyond raw models. First, vertical integration: by executing the entire lifecycle
    rather than assisting discrete tasks, Enter accumulates workflow-specific tooling and data that horizontal
    copilots do not. Second, a Brazil-specific data moat: processing more than 300,000 cases a year and
    a stated partnership with the National Council of Justice to build a historical case database give
    Enter a domestic corpus and procedural grounding that foreign tools lack. The anti-fraud system —
    claiming to detect prompt injection, network fraud, and document forgery — is a concrete expression
    of that local specialization. The architecture is credible and well-matched to the problem, but most
    specifics are company-stated rather than externally documented.
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
