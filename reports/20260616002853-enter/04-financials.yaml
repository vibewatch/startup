  - FI003
- id: section-3
  title: Capital adequacy, cash flow, and diligence blockers
  body: >-
    Enter's capital position is a clear strength. The May 2026 Series B of more than US$100 million (about
    R$500 million) led by Founders Fund at a US$1.2 billion valuation, on top of an estimated US$140 million-plus
    raised since 2023, leaves the company well funded with no publicly disclosed debt or project-finance
    obligations. Management frames the use of funds around hiring, product development, and scaling toward
    200 employees by the end of 2026, and the fresh round materially reduces near-term financing risk;
    the next-round trigger is undisclosed and would likely be driven by growth and geographic expansion
    rather than survival. The company also claims to have been cash-flow positive since 2024, less than
    a year after launch — an unusual assertion for a startup scaling this fast, and one that is plausible
    but unverified, particularly against a backdrop where rapid AI-inference spend and aggressive hiring
    typically consume cash. That tension defines the chapter's verdict: the financing story and growth
    direction are strong and externally corroborated, but the absence of audited revenue, ARR, margin,
    burn, and customer-concentration disclosures is the central diligence blocker. Closing it requires
    a data room with financial statements, a revenue bridge, and a customer-level revenue breakdown before
    the headline growth and cash-flow claims can be underwritten with confidence.
  claimRefs:
  - CI004
  - CI007
  - CI010
  - CI011
  - CI012
  - CI013
  - CI030
  - CI031
  - CI032
  - CI033
  - CI035
