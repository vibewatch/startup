company:
  name: Enter
chapter:
  number: 4
  title: Financials
  summary: >-
    Enter's financial profile is unusually strong on signals but thin on disclosure. The company says
    it has been cash-flow positive since 2024, that ARR grew roughly 13x since April 2025, and that revenue
    grew more than 10x between its Series A (September 2025) and Series B (May 2026), on a hybrid model
    that pairs a technology subscription with a roughly 30 percent success-linked component. No audited
    revenue, ARR, burn, or margin figures are public, so absolute scale is an estimate: a 2025 base ARR
    plausibly in the US$10-12 million range implies a low-hundreds-of-millions run rate by mid-2026, but
    this is company-framed and unverified. With over US$140 million raised and a fresh Series B, capital
    adequacy is high; the central diligence blocker is the absence of independently verified financials.
sections:
- id: section-1
  title: Revenue model, pricing, and quality
  body: >-
    Enter's revenue model is the most distinctive thing about its financial profile. Rather than selling
    software seats, it charges a hybrid fee: an upfront technology subscription plus a variable component
    reported at roughly 30 percent that is tied to litigation success. The company frames this as buying
    legal outcomes — 'work, not software' — so the spend lands in a client's legal and operations budget
    rather than IT procurement. That alignment is commercially attractive because it ties Enter's economics
    directly to the defense results its enterprise customers care about, and it supports expansion as
    clients route a growing share of their case preparation through the platform. It also introduces revenue
    quality nuance: a meaningful slice of revenue is contingent on outcomes, which makes it inherently
    more variable than pure subscription ARR and harder to forecast. Revenue durability is underpinned
    by the caliber of the customer base — large, well-capitalized banks and insurers such as Bradesco,
    Santander, Itau, SulAmerica, and Banco Mercantil, whose investor disclosures confirm the scale of
    litigation exposure they manage. The model is therefore high-alignment and arguably high-quality,
    but the contingent portion and the absence of a disclosed subscription-versus-success split mean revenue
    quality cannot be fully assessed from public information.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI037
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: section-2
  title: Traction, cost structure, and unit economics
  body: >-
    On traction, Enter's disclosures are directional rather than absolute. The company says ARR grew roughly
    13x since April 2025 and that revenue grew more than 10x between its September 2025 Series A and its
    May 2026 Series B — striking growth that tier-one Brazilian media corroborate in direction even though
    no audited figures are released. Because the base is undisclosed, any absolute scale is an estimate:
    an external read places 2025 base ARR plausibly around US$10-12 million, which, applied to the reported
    multiples, implies a run-rate somewhere in the low hundreds of millions of US dollars by mid-2026
    — a useful order-of-magnitude, but explicitly a low-confidence estimate, not a company figure. The
    cost structure is dominated by two items: AI-model inference, where Enter claims to consume about
    20 billion tokens a day and to be among the largest domestic customers of OpenAI and Anthropic in
    Brazil, and a heavily technical headcount of roughly 120 people with more than 85 percent in engineering
    and product. Unit economics hinge on the spread between contract value and the combined cost of AI
    inference and mandatory human review per case, and on whether net expansion within anchor accounts
    — Nubank is said to route about 80 percent of its case prep through Enter — outpaces delivery costs.
    None of the per-case revenue or cost figures are public, so margins are inferred and remain a key
    gap.
  claimRefs:
  - CI005
  - CI006
  - CI008
  - CI009
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
