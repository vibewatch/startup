  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited financial statements
    missingEvidence: P&L, ARR schedule, gross margin, burn, and runway
    whyItMatters: Headline growth and cash-flow claims cannot be verified without statements.
    diligencePath: Obtain audited financials and a revenue bridge in the data room.
    relatedQuestionRefs:
    - QI012
    - QI021
  - type: missing-source
    severity: material
    topic: customer revenue concentration
    missingEvidence: Revenue by customer and top-account share
    whyItMatters: Concentration risk cannot be sized without per-customer revenue.
    diligencePath: Request a customer-level revenue breakdown.
    relatedQuestionRefs:
    - QI022
  - type: conflicting-evidence
    severity: minor
    topic: cash-flow-positive claim
    missingEvidence: Verification of cash-flow timing against scaling costs
    whyItMatters: Cash-flow positivity is hard to reconcile with rapid AI and hiring spend.
    diligencePath: Reconcile cash-flow statements against the scaling timeline.
    relatedQuestionRefs:
    - QI026
