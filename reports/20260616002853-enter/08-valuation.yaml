company:
  name: Enter
chapter:
  number: 8
  title: Valuation
  summary: >-
    Enter's US$1.2 billion Series B makes it Latin America's first AI unicorn and one of only a handful
    of legaltech companies valued above US$1 billion. Against legal-AI comparables — Harvey (~US$11bn),
    Legora (~US$5.6bn), Clio (US$3bn), and Relativity (~US$3.6bn) — Enter is the smallest by valuation
    but is priced on exceptional momentum: reported 10x-13x growth, cash-flow positivity, tier-one investors,
    and a defensible Brazilian niche. Because absolute revenue is undisclosed, the implied revenue multiple
    is an estimate (roughly 8x-12x a low-hundreds-of-millions run rate), so the price embeds significant
    execution and regulatory optionality. The recommendation is a conviction-weighted, risk-aware participation
    with entry discipline, contingent on closing the financial-disclosure gap.
sections:
- id: section-1
  title: Thesis, price context, and comparables
  body: >-
    Enter's US$1.2 billion Series B is a landmark price: it makes the company Latin America's first AI
    unicorn and, by reporting, the third legaltech globally valued above US$1 billion. The investment
    thesis is coherent and four-legged — a structurally enormous Brazilian litigation market, a defensible
    vertically integrated product with a domestic case-data moat, a roster of marquee, expanding enterprise
    customers, and exceptional reported growth at apparent capital efficiency. Set against the category's
    comparables, Enter is the smallest by headline valuation: Harvey is valued near US$11 billion, Legora
    around US$5.6 billion after its Series D, Relativity about US$3.6 billion ahead of a possible listing,
    Clio at roughly US$3 billion, and Luminance smaller still on a US$75 million Series C. Those peers
    mostly serve law firms in common-law markets, so the comparison is directional rather than like-for-like,
    but it frames Enter as priced at a fraction of the leaders while occupying a niche none of them targets.
    The headline price is well corroborated — Valor, Bloomberg, and Forbes independently report the US$1.2
    billion mark — which reduces information risk on the number itself, even as the metrics that justify
    it remain partly company-sourced. Scarcity matters too: being the first LatAm AI unicorn confers franchise
    visibility and access that support the price beyond pure fundamentals.
