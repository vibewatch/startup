- id: section-2
  title: Multiple, growth, and scenario analysis
  body: >-
    Translating the headline price into a multiple requires an estimate, because Enter discloses no absolute
    revenue. Reported growth of 10x to 13x applied to an external estimate of a 2025 base implies a run-rate
    somewhere in the low hundreds of millions of US dollars by mid-2026, which puts the US$1.2 billion
    valuation at roughly an 8x-to-12x revenue multiple — rich in absolute terms but broadly in line with
    high-growth AI peers during the 2026 funding boom. That boom is double-edged: it lifts the whole category's
    valuations, supporting Enter's mark while also raising the risk that part of the price is sentiment.
    The growth itself, if verified, is the strongest justification for the valuation, and the claimed
    cash-flow positivity would make Enter unusually capital-efficient versus cash-burning comparables,
    strengthening the case further. Scenario analysis frames the range: a bull case of sustained multi-fold
    growth and category leadership re-rates Enter into the multibillion-dollar tier; a base case of strong
    but decelerating growth holds the value near the Series B mark; and a bear case of adverse regulation
    or anchor-customer loss compresses it materially. The resulting return profile is asymmetric — large
    upside against a live downside — and the central analytical caveat is that both the multiple and the
    scenarios rest on company-sourced metrics that diligence has not yet verified.
  claimRefs:
