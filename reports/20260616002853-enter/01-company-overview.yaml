- id: section-4
  title: Scale claims, milestones, and adverse context
  body: >-
    Enter pairs its financing record with bold operating claims that diligence should treat as company-sourced
    until verified. The company says it serves more than 40 large enterprises, processes over 300,000
    lawsuits per year, and has been cash-flow positive since 2024 — less than a year after launch — while
    anchor customer Nubank is said to route roughly 80% of its case preparation through the platform.
    Headcount is about 120 with a target of 200 by the end of 2026 and more than 85% in technical roles.
    Crucially, specific ARR and revenue figures are not disclosed, so the cover metrics mix independently
    reported facts (valuation, rounds) with unaudited scale assertions, and that distinction carries into
    the financials and customers chapters. The milestone record also includes non-financing events that
    matter to underwriting: the CEO's appearance before Brazil's Senate to discuss the AI bill (PL 2338/2023),
    a stated partnership with the National Council of Justice to build a historical case database, and
    an external backdrop in which observers warn that AI adoption in Brazilian courts is fueling both
    efficiency and a surge in lawsuits and abusive litigation. Those regulatory and market-abuse threads
    are early but real, and they recur as central risks later in the report.
  claimRefs:
