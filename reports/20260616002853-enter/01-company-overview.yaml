  - FO003
- id: section-2
  title: Founders, leadership, and key-person dependence
  body: >-
    Enter is led by three co-founders, and the public record concentrates the company's identity in them.
    Mateus Costa-Ribeiro, the 25-year-old CEO, holds a Harvard Law LL.M., became Brazil's youngest lawyer
    at 18, passed the New York Bar at 20, and left a full-ride Stanford MBA to found the company; he owns
    strategy, fundraising, and external positioning. Michael Mac-Vicar, the CTO, spent about twelve years
    as CTO of Wildlife Studios, one of Brazil's most prominent technology companies, and anchors Enter's
    engineering and high-volume AI infrastructure. Henrique Vaz, the CPO, is a Harvard graduate and former
    Wildlife CMO who also worked at Tesla, and he leads product and go-to-market. Their combined legal,
    gaming-scale engineering, and product backgrounds are the company's stated founder-market-fit case,
    pairing deep domain credibility with experience operating at scale. The flip side is that strategy,
    technology, and product all sit with three people, so key-person dependence is high and a governance
    gap remains: Enter discloses no independent board roster or additional C-level officers as of mid-2026,
    which is a concrete diligence item. The Talisman-AI-to-Enter rebrand is part of the same maturation
    story but is only lightly documented in public sources.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO002
- id: section-3
  title: Funding, valuation, and stakeholder map
  body: >-
    Enter's capital story is the spine of the unicorn narrative. After a 2023 pre-seed from ONEVC, the
    company raised a US$5.5 million seed led by Sequoia Capital in March 2025 — described as Sequoia's
    first Brazil investment in twelve years, since Nubank — then a US$35 million Series A at a US$350
    million valuation co-led by Founders Fund and Sequoia in September 2025, which also marked Founders
    Fund's return to Brazil since its 2016 Nubank Series C. In May 2026 Enter closed a Series B of more
    than US$100 million (about R$500 million) led by Founders Fund, with Kaszek, Ribbit Capital, Sequoia,
    OneVC, and Atlantico participating, at a US$1.2 billion (R$6.4 billion) valuation. That mark is corroborated
    by Valor International, Bloomberg, Forbes Brasil, and others, and makes Enter Latin America's first
    AI unicorn and the first Brazilian unicorn since 2024. Cumulative capital is estimated at roughly
    US$140 million, though Enter does not publish a reconciled lifetime total. The progression from seed
    to a billion-dollar valuation in roughly fourteen months is unusually fast and reflects both strong
    investor conviction and the froth in 2026 AI financing. The stakeholder map is assembled entirely
    from public round announcements; exact ownership, preferences, and board composition remain undisclosed
    and belong in a data room.
  claimRefs:
