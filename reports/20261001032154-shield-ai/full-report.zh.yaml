      - number: '3.2'
        title: 技术能力与产业地位
        blocks:
          - type: paragraph
            body: >-
              Shield AI 经证据支持的最强优势，在于公司声称 Hivemind 已搭载过的机型广泛度：X-62 VISTA、MQ-20 Avenger 以及双机编队 MQM-178
              Firejet。这支撑了软件可移植性的逻辑，但这并非独立对比基准，也无法证明其在所有平台上都具备同等战备状态。与此同时，公司正在构筑自研机体能力。GeekWire 报道其规划了一处 420,000 平方英尺的
              X-BAT 厂房，未来可能再扩建 100 万平方英尺，目标是在 2030 年代初达到年产约 150 架的水平。行业媒体报道亦指出，复合材料设计、分析与制造是 X-BAT
              的关键投入要素。上述规划有望缩小传统巨头的制造优势，但在产能、质量、成本和交付证据充分显现之前，仍属前瞻预期。
