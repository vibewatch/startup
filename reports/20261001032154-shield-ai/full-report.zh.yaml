      - number: '7.4'
        title: 财务模型敞口与逻辑被证伪触发点
        blocks:
          - type: paragraph
            body: >-
              据报道，2026 年 3 月的融资方案包含 $1.5B 的 Series G 融资及 $500M 的固定回报优先股，同时管理层预计 2026 年收入将超 $540M、增速超
              80%。募集到的资金并不等同于无限制的可用现金：该方案旨在支持并购与产品扩产，内含优先受偿工具，并设有交割前提条件。EquityZen
              亦将该业务定性为具备长研发周期的资本密集型资产，并提示持续的盈利风险。分配资料中的公开来源并未披露烧钱速度、毛利率、EBITDA、营运资金需求、优先股具体条款、厂房资本承诺或单项目经济模型。逻辑被证伪的触发因素包括：再度遭遇安全停飞禁令、未如期完成
              X-BAT 试飞或厂房建设里程碑、并购审批失败导致融资生变，或有证据表明在手订单与利润率无法在不依赖反复稀释性股权或优先股注资的前提下支撑硬件扩产。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR015
              - CR016
      - number: '7.5'
        title: 附注与论证
        blocks:
          - type: callout
            title: 安全缓解措施来自官方口径，未经独立验证
            body: 自主起落架与安全审计是实质性的缓解举措，但分配证据并未提供经审计的机队飞行小时数、事故率、平均故障间隔时间（MTBF）或五角大楼底层审查结论。复发风险应被界定为“未予量化”，而非“风险偏低”。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: 下一轮尽调决策准入门槛
            body: 在将公开增长预测纳入投资模型前，必须获取收购审批与融资交割条件文件、独立的 V-BAT 安全与可靠性数据、X-BAT 厂房与试飞里程碑、客户与项目集中度数据、供应商图谱，以及现金支撑关键里程碑的测算规划。
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Shield AI 的核心投资逻辑立足于其在现代军事冲突中的战略站位——在电子战和 GPS 遭拒止的严苛战场中担当一流的自主系统供应商。公司自研的自主软件平台 Hivemind 扮演 AI
              飞行员的角色，支持无人机和有人机在无卫星导航信号或易受干扰的射频链路下机动、导航并执行战术动作。美空军部在 Collaborative Combat Aircraft（CCA）项目中对 Hivemind
              的入选，证实了其在防务项目中的架构领先地位。对 Aechelon Technology
              的收购提供了合成仿真环境与传感器建模，可为持续的飞行算法训练提供数据喂养，构筑抵御传统航空航天防务巨头的护城河。此外，向盟国防务采购的渗透（如波兰海军选定其海上无人机，以及北约伙伴国的采购意向）拓宽了长期的合同储备。

              反向逻辑则揭示了值得警惕的重大结构性、财务性与运营性风险。首先，Shield AI 身处重资产、高资本密集的军工领域，需要长期的制造扩张投入，在华盛顿州投建 420,000 平方英尺的 X-Forge 3
              厂房以量产 X-BAT
              自主战机即是明证。其次，公司仍处非上市且未盈利状态，毛利率数据尚未明晰，并在发生安全事故后推迟了盈利目标的兑现节点。第三，联邦防务采购集中度极高；与美国国防部及空军订立的合同工具造成收入确认的不均衡，且全额软件授权款项与持续实战表现考核挂钩，带来奖励费扣减风险。第四，虽然私募二级市场估价与媒体报道流传着冲击
              $20B 估值融资的愿景讨论，但在当前 $12.7B 估值下入局，一旦遭遇政府防务拨款调整或战机研制进度滞后，将面临巨大的下行风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
