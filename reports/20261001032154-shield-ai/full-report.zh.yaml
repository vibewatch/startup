    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Shield AI 是一家成立于 2015 年、总部位于圣地亚哥的防务科技私有企业。独立留存资料均将 Brandon Tseng、Ryan Tseng 与 Andrew Reiter 列为联合创始人。公司业务横跨
              Hivemind 自主软件与自研飞行器：V-BAT 是现役无人机产品线，X-BAT 则处于在研阶段。由此形成两条潜在变现路径：整机或执飞系统销售，以及将 Hivemind
              授权给第三方平台；但留存证据并未披露合同层面的经济指标或经常性软件收入。此外，官方网站 shield.ai 需与 shieldai.ai 区分开来，后者是 2024 年成立的一家无关的数据保护与合规平台。
