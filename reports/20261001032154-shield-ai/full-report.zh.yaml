      - number: '1.2'
        title: 领导团队与公司治理
        blocks:
          - type: paragraph
            body: >-
              创始团队与防务作业、工程研发的匹配度极高：Brandon Tseng 曾服役于海豹突击队，Ryan Tseng 是 WiPower 创始人，Andrew Reiter 则曾任 Draper Labs
              工程师。管理层在 2025 年 3 月发生重大调整，Gary Steele 出任首席执行官，Ryan Tseng 转任战略职务。2026 年 3 月的融资公告还把治理权同新注入资金绑定：Advent 董事长
              David Mussafer 预计进入董事会，JPMorganChase 高管 Todd Combs
              预计出任董事会观察员。创始人现任头衔、完整董事会名单、投票权控制结构、清算优先权以及接班梯队深度，仍属于私有尽调范畴，尚非经核实的公开事实。
            claimRefs:
