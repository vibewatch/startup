      - number: '3.3'
        title: 定价、GTM 与分销路径
        blocks:
          - type: paragraph
            body: >-
              留存公开资料未提供 Shield AI 或上述替代方案的可比公开牌价、单机软件费用、折扣标准或实际履约合同经济数据。因此合理的比对维度是产品打包与入市路径，而非凭空臆测价格。Shield AI
              自身在波罗的海的一则招聘启事提到了区域战略规划、销售管线全流程管理、与防务部门及采购机关直接接洽、区域伙伴关系维护、合同谈判以及背负销售指标。整套配置对应的是直销主导、围绕项目捕获的大客户与政府销售打法，而非自助式定价。招聘数据显示有
              391 个在招岗位（含 173 个工程岗位和 62 个运营岗位），外部产品管理指南也强调对从概念到部署的全程掌控，均印证了组织在技术交付与客户集成上的大力投入。然而，两类资料均无法印证其销售效率或竞标胜率。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
