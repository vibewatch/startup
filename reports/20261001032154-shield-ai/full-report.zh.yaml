      - number: '3.4'
        title: 护城河持久度与被替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河的持久度取决于 Hivemind 能否成为可跨机型复用的通用自主层，抑或始终局限于少数演示与试验项目。官方飞行范例以及据报道的 Fury
              集成均为软件可移植性的积极信号，但分配证据未披露实际集成周期、经常性软件收入、客户切换行为或相较于竞品技术栈的表现。老牌总包商亦可将自研自主系统同现有战机、采购人脉及维保基础设施打包捆绑。技术风险在整个赛道依然突出：ePlane
              AI 报道称 General Atomics 在发生坠机后暂停了飞行测试。这虽不代表 Shield AI
              自身失败，但印证了自主战机研发可能因测试挫折而拖延进度。因此，真正稳固的护城河必须建立在经检验的跨平台性能、量产执行力与商业转化上，而非仅凭产品宣传口径。
            claimRefs:
              - CP006
              - CP014
              - CP015
              - CP016
