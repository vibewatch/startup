            body: >-
              虽然 Hivemind 属于跨平台的通用自主软件，Shield AI 仍将其自主引擎与专用实体无人机机体结合，以满足军方客户在战术侦察与打击任务中的实战需求。公司的量产机型以 V-BAT
              为代表，这是一款专为电子战战场设计、已在全球部署执行情报、监视与侦察（ISR）任务的长航时 Group 3 垂直起降无人机。为应对高速空战任务，Shield AI 推出了 X-BAT，这是一款翼展 26
              英尺、设计航程达 2,000 海里的无人垂直起降自主战机，摆脱了对传统硬化跑道或易受攻击的前沿空军基地的依赖。为支撑产能爬坡，公司正在华盛顿州德梅因建设 420,000 平方英尺的 X-Forge 3
              先进制造厂房，并设定了未来再扩建 100 万平方英尺的长期区域目标，以在 2030 年代初支持多机型量产。
