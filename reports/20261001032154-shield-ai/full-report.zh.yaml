  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现机制
        blocks:
          - type: paragraph
            body: >-
              Shield AI 通过兼具硬件系统、自研软件授权以及综合战术仿真的双轨模型实现防务自主变现。其主要交付的硬件产品是 V-BAT
              垂直起降无人机系统，采购方涵盖美国海军陆战队与海岸警卫队等军种，以及日本、印度和亚美尼亚等外国军方。除整机销售外，Shield AI 还将核心自主技术栈 Hivemind
              作为模块化独立软件授权推向主承包商与政府重大项目（包括 Collaborative Combat Aircraft 协同作战飞机计划）。公司在 2026 年 3 月收购老牌防务仿真供应商 Aechelon
              Technology，进一步强化了仿真与自主管线，后者的合成环境工具支持着 1,000 余套军方实训飞行系统。然而，实际价格机制依然不透明：除最新发布的 X-BAT 第六代自主攻击机预估单机造价约 $27M
