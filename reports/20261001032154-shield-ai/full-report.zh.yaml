              Collaborative Combat Aircraft 项目与美海军 $50M 的首期 X-BAT
              研制合同。盟国防务力量是增速最快的客户群体，主要体现为政府对外军售（FMS）以及与新加坡、印度、波兰和日本等国签署的双边联合开发协议。商业技术合作（如与 Amazon Web Services
              联合搭建的云边部署框架）则充当技术分发渠道以简化软件容器交付，并非终端采购渠道。
