      - number: '4.2'
        title: 公开业务进展、预测准确度与估值倍数现实
        blocks:
          - type: paragraph
            body: >-
              公开报道展现了显著的营收扩张，同时也暴露出收入轨迹与市场定价维度的重大投资评估风险。历史营收从 2022 年大致翻倍，于 2023 年达到约 $163M，根据公司口径，截至 2025 年 3
              月的财年进一步扩张至约 $300M。尽管规模持续攀升，Shield AI 在截至 2025 年 3 月的周期内较其最初设立的 $400M 目标低了 $100M，交付缺口达
              25%，充分说明了防务采购周期固有的波动性与执行风险。管理层前瞻指引预计 2026 日历年收入增速将超 80%，在不含 Aechelon Technology 并购带来的外延收入贡献下争取达到至少
              $540M，并设想在截至 2028 年 3 月的财年冲击 $1B 收入。独立二级市场评估强调了依赖未经核实数据平台的危险：虽然自动数据抓取工具给出了 2025 年收入 $1.6B 的线性预测模型，暗示仅 3.8x
              的偏低市销率，但结合其 $12.7B 的一级市场估值基准与 $13.9B 的隐含二级市值，Shield AI 真实的静态市销率已接近 2025 财年实际营收的 46x。
