      - number: '1.3'
        title: 资本结构与业务规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月 26 日，Shield AI 宣布按 $12.7B 投后估值募集 $1.5B 的 Series G 股权融资，以及 $500M 固定回报优先股。同一公告还称，Blackstone
              旗下基金承诺提供额外 $250M 的延迟提款信贷额度。上述数字均为宣布的交易金额，并不等于已到账现金；消息源也未提供优先股回报率、清算受偿顺位、提款条件或完全稀释后持股比例。独立资料显示，公司曾在 2022 年和
              2023 年分别完成 $165M 和 $200M 融资。第三方预计其 2026 财年收入超 $540M，但留存资料中没有任何经审计的财务报表能证实该预测、ARR、毛利率或客户数。
