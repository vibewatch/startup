        title: 发展里程碑与尽调重点
        blocks:
          - type: paragraph
            body: >-
              公开编年史显示，公司从 2016 年获得国防创新部门（DIU）合同起步，历经 2021 年对 Heron Systems 和 Martin UAV 的收购、两轮估值上调的私募融资、2025 年首席执行官更迭，再到
              2026 年最新融资与拟收购 Aechelon 的交易。公开记录中也包含一起反向运营事件：Wikipedia 援引报道指出，2024 年 4 月一架 V-BAT
              着陆时导致一名美海军官兵三根手指部分截肢，并引发了阶段性禁飞限制。该事件证实了安全与部署风险的存在，但不能直接推算全局事故率。当前最高优先级的尽调事项依然是：交易交割进展、融资具体条款、经审计的收入质量、客户集中度、完整管理团队履历以及人员受伤后采纳的运营控制措施。
