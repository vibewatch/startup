  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资的市场边界锁定在军事任务自主系统与自主飞行器，而非宽泛的国防开支或通用人工智能。纳入的收入池包括自主软件授权与集成、自主无人机销售以及外包执飞服务；仿真属于相邻领域，可用于加速自主训练与验证。行业现状主要依靠遥控或人工操纵飞行器，传统机载软件与总包集成商则是独立自主技术栈的直接替代品。Shield
              AI 的自身演示覆盖了 VISTA、MQ-20 Avenger 以及双机编队 Firejet 飞行器，证明了跨平台通用性，但这并不意味着每笔防务飞行器预算都能被其撬动。此外，位于 shieldai.ai
              的同名合规平台属于无关实体，已从本市场定义中剔除。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM013
      - number: '2.2'
        title: 受限证据下的市场测算
        blocks:
          - type: paragraph
            body: >-
              公开数据引用的统计分母各异，不能混为单个 TAM。二手消息源称 2023 年全球军用无人机市场规模约 $14.4B，预计 2032 年达 $47.16B，但未给出可核验的方法论或 Shield AI
              可触达部分的拆分口径。另一项分析指出，2025 年防务科技风险投资交易规模达 $49.1B，其中约 $12B 流向自主系统，同时还引用了五角大楼 FY2026 基础预算申请 $961.6B 加上 $150B
              的补充拨款。这些都属于资本供给与政府预算背景，并非客户实际支出的 TAM。Fortune 报道的公司 2026 年收入预测至少为 $540M，只是一项当期捕获信号，无法视为
              SOM，因为消息源并未界定目标市场或一致的分母口径。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
