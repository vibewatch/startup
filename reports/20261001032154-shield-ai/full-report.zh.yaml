      - number: '2.4'
        title: 采纳制约因素与估值关联
        blocks:
          - type: paragraph
            body: >-
              需求信号十分充沛，但落地节奏与转化率仍存不确定性。防务采购容易因项目变更、预算重新划拨以及国会程序而延期，且多供应商架构削弱了软件独占的假设。国际市场扩张加大了出口管制风险敞口。此外，悬而未决的 Aechelon
              收购形成了近期的监管依赖：Fortune 报道最终融资交割取决于该收购审批，若交易未获批准公司将重新评估融资。X-BAT 则拉高了资本密集度与排期风险；GeekWire 报道的公司规划要求 2028
              年在德梅因产出首架原型机，并在 2030 年代初达到年产约 150 架的规模。因此，估值工作应针对合同转化、国际审批与工厂爬坡进行情景测试，而非直接把宽泛的防务预算算作自身营收机会。
            claimRefs:
              - CM010
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 附注与论证
        blocks:
          - type: callout
            title: 尚无可立论的 TAM
            body: >-
              留存资料将宽泛的国防预算、风投资金、军用无人机预测、合同金额与公司收入混杂在一起。没有任何一份资料给出了统一定义，能够单独把 Shield AI
              的自主软件与飞行器商业机会剥离出来，因此估值测算应采用情景区间，而非单一自上而下的 TAM。
            calloutType: assumption
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方可将 Shield AI 与几类不同的解决方案进行横向比对。在所分配证据中，Anduril 是最接近的风投背景全栈同行；Palantir 属于相邻的战场数据平台，而非飞行自主供应商。Skydio
              专注较小型的商用及战术无人机；General Atomics、Northrop Grumman 与 Lockheed Martin 则代表传统主机厂或主承包商替代方案。Shield AI 自身业务横跨
              Hivemind 自主系统、V-BAT 与 X-BAT 飞行器以及 Aechelon 仿真技术。这一格局亦具备竞合属性：Hivemind 入选 Anduril 的 Fury 战机，使得 Anduril
              既是竞争对手，又是接入第三方机体的渠道。买方亦可选择自研或继续使用遥控及旧有系统，但分配证据并未量化其成本、实施周期或实战效能。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
