      - number: '8.2'
        title: 投资建议与融资背景
        blocks:
          - type: paragraph
            body: >
              我们的正式尽调建议为“观察”（TRACK），估值立场为“偏高”（STRETCHED）。公司最新经确认的融资轮次是 2026 年 3 月公布的总规模 $2.0B 的组合方案，包含按 $12.7B 投后估值完成的
              $1.5B Series G 定价股权融资，以及由 Blackstone 旗下基金提供的 $500M 固定回报优先股。该估值较 2025 年 3 月录得的 $5.3B Series F-1 估值增长了
              140%。自 2015 年成立以来，历经 17 笔融资事件，累计实缴股本与债务融资总额已达约 $2.9B 至 $3.16B。

              严苛的建仓纪律要求对二级市场撮合交易与传闻保持警惕。虽然 Forge Data 追踪的二级交易迹象显示出较高的活跃度，每股成交价达到 $172.04，且媒体推测性报道提及潜在的 $20B
              目标估值，但未经证实的价格标记无法构成具有实操意义的一级市场入场定价。              此外，Blackstone 持有的 $500M
              固定回报优先股在资本结构中享有优先受偿主张，对普通股及初级股权持有方构成了高位受偿压制。叠加未经验证的软件毛利率以及缺少独立审计的现金流数据，以超过 2026 年预期收入（$540M）23x
              的倍数入场，需要计入深度的风险折价。
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV009
              - CV011
              - CV014
      - number: '8.3'
        title: 情景分析、可比标的与尽调问询
        blocks:
          - type: paragraph
            body: >
              未来 24 至 36 个月的估值情景因不同的运营落地路径呈现出巨大差异。在乐观情景下，Shield AI 达成其预计的 2026 年 $540M 营收目标，顺利完成 X-BAT 机体试飞，全面交付 CCA
              自主软件增量，并以 $20B 至 $24B 估值（对应预期收入的 37x 至 44x）完成 IPO 或高估值倍数的战略退出。在基准情景下，营收达到 $450M 至
              $540M，国际部署平稳推进，但硬件资本支出与仿真集成成本压制了营业利润率，使得合理的私募估值区间维持在 $12B 至 $15B（对应收入的 22x 至 28x）。在悲观情景下，德梅因制造厂的瓶颈拖累了
              X-BAT 交付进度，防务采购预算缩减，技术评审引发 CCA 奖励费扣减，导致估值倍数回落并以 $6B 至 $8B（对应收入的 11x 至 15x）的折价轮重新定价。

              同行可比对标突显了这种分化。Lockheed Martin、RTX 及 L3Harris Technologies 等上市军工主承包商市销率在 1.0x 至 2.5x
              之间，反映出成熟的资产负债表与较低的增速。纯防务软件与数据平台 Palantir Technologies 则凭借经检验的 GAAP 盈利能力与高软件毛利率，享受 35x 至 50x
              收入的高溢价倍数。以硬件为主的无人机制造商 Kratos Defense 市销率则在 3x 至 4x 之间。Shield AI 当前 $12.7B 估值对应预测的 $540M 收入隐含约 23.5x
              的远期倍数，已计入了软件平台转型的显著溢价。在出资前最终的尽调诉求包括：获取经 GAAP 审计的财务报表、核实 Blackstone 优先股的清算受偿顺位与股息条款、审查 CCA
              项目的奖励费考核标准，以及核查国际出口管制的合规状况。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: 附注与论证
        blocks:
          - type: callout
            title: 投资立场：审慎观察
            body: >
              尽管 Shield AI 依靠美空军 CCA 项目和波兰海军 V-BAT 合同所展现的技术验证无可争议，但成长期投资者若要求下行保护，以 $12.7B 的 Series G 估值出资仍显激进。存在 $500M
              优先受偿的固定回报优先股，加之华盛顿州 X-BAT 制造枢纽高昂的持续资本支出以及未经审计的毛利率，共同决定了在其实际盈利能力得到验证前，应保持“观察”（TRACK）立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV014
