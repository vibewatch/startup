      - number: '7.3'
        title: 客户、伙伴与竞争依赖
        blocks:
          - type: paragraph
            body: >-
              Shield AI
              面向政府采购体系销售，后者的多年期预算、政治意图更迭、持续决议案与冗长审批流程，并不一定契合风险投资的成长节奏。现有证据表明其拥有广泛的美军及盟国客户群，但未量化客户集中度或在手订单转化率。与此同时，老牌主机厂可将自主系统同飞行器、弹药及维保捆绑销售，资金充裕的防务科技新贵亦在争夺订单与紧缺的
              AI 人才。Shield AI 在 VISTA、Avenger 与 Firejet
              上的跨平台官方演示是集成广度的证据，但并非经常性量产收入或全机型高可靠性能的明证。后续需严密监测期权行权率、已获拨款订单、续约与量产合同落地、国际审批进展，以及第一大客户和单一项目占营收的比重。
            claimRefs:
              - CR010
              - CR011
              - CR014
