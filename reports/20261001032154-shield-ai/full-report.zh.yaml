          - type: paragraph
            body: >-
              监管风险既有针对特定交易的，也有结构性的。Fortune 报道 2026 年融资的最终交割以 Aechelon 收购案获批为先决条件，若审批受阻 Shield AI
              将重新评估融资。另外，分析师指出潜在的“人在回路”规则、针对致命自主武器的任务限制以及各国互异的标准均构成了实战部署与海外销售的掣肘。中国于 2025 年将 Shield AI
              列入不可靠实体清单，禁止其从中国采购、在华运营、投资或入境；管理层声称公司刻意规避了对中国的依赖，但分配资料中没有公开的物料清单证据可证实该表述。一票否决指标包括：Aechelon
              审批遭拒或严重延误、无法取得必需的出口或作战许可，或发现受禁的底层供应链依赖。
            claimRefs:
              - CR005
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
