        - id: capital-structure
          label: 2. Series G 资本结构现实
          detail: 经确认估值达 $12.7B，且附带 $500M 固定回报优先股的高位受偿压制。
        - id: manufacturing-burn
          label: 3. 重工业资本支出与现金消耗
          detail: 为 X-BAT 建造 420,000 平方英尺的 X-Forge 3 厂房，需要投入巨额资本。
        - id: margin-opacity
          label: 4. 未经审计的毛利率与奖励费风险
          detail: 私有财务不透明、软硬件毛利率拆分未经验证，且面临合同奖励费考核风险。
        - id: scenarios-evaluation
          label: 5. 情景差异评估
          detail: $24B 乐观情景与 $6B 悲观情景差异巨大，要求采取严格的回报门槛。
        - id: track-decision
          label: 6. 投资建议：观察 / 估值偏高
          detail: 在经审计财务披露与 X-BAT 首批生产里程碑达成之前，维持观察立场。
      edges:
        - from: autonomy-validation
          to: capital-structure
          relationship: 导向
        - from: capital-structure
          to: manufacturing-burn
          relationship: 叠加
        - from: manufacturing-burn
          to: margin-opacity
          relationship: 推高
        - from: margin-opacity
          to: scenarios-evaluation
          relationship: 支撑
        - from: scenarios-evaluation
          to: track-decision
          relationship: 得出
