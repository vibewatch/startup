      - number: '4.3'
        title: 资本结构、资产负债表依赖与投资判断
        blocks:
          - type: paragraph
            body: >-
              自 2015 年成立以来，Shield AI 历经 17 轮机构融资累计募集超 $3.5B 资金，并在 2026 年 3 月敲定了巨额融资方案：包括由 Advent International 和
              JPMorgan Chase 领投、投后估值 $12.7B 的 $1.5B Series G 股权融资，以及由 Blackstone 提供的 $500M 非稀释性固定回报优先股。这笔注资的大部分已指定用于现金收购
              Aechelon Technology，并扩建华盛顿州德梅因 420,000 平方英尺的 X-Forge 3 先进制造厂房，该设施需在 2028
              年目标交付日前配置数千名航空技工并投入巨额资本支出。从投资评估角度看，Shield AI 存在严重的财务披露缺口：公司未公开披露毛利率、EBITDA、经营性现金烧钱速度、净留存率（NRR）或 Hivemind
              的合同续约率。在二级市场上，投资者需求趋于谨慎，买单相较股票供给处于 0.9:1 的偏淡比率，股票交易价格在 $168.17 附近徘徊。鉴于 ~46x
              的高静态估值倍数、历史预算目标的未达标以及整机量产的高额资本支出需求，投资人对未来增长与利润率扩张必须持审慎态度。
