      - number: '2.3'
        title: 买方、用户、付费方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              核心付费方为政府军工项目办公室或盟国防务部门，实际使用者则是作战官兵、任务规划人员与装备操作员。采购可通过直接整机购买、服务合同（如海岸警卫队 $198M 的 V-BAT IDIQ
              合同），或将自主系统集成进总包商与政府已有平台来推进。独立报道称，预计 2026 年收入中有超过一半来自国际客户，使得出口许可与盟国预算成为采纳的关键变量。采购触发点主要在于通信受阻、GPS
              遭拒止或无可用跑道等极端环境下的实战表现；公司将高韧性机载自主作为应对方案。不过，美空军在 Hivemind 与 Anduril 的 Lattice
              之间切换的测试表明，买方可能倾向于要求互操作性，而非接受单一供应商锁定。
            claimRefs:
