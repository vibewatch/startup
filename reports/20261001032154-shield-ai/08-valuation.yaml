callouts:
  - calloutType: recommendation
    title: "Investment Stance: Disciplined Observation"
    body: >
      While Shield AI's technological validation via the U.S. Air Force CCA program and Polish Navy V-BAT contracts is indisputable, committing capital at the $12.7 billion Series G valuation is premature for late-stage investors requiring downside protection. The presence of $500 million in senior fixed-return preferred equity, combined with high ongoing capital expenditures for the X-BAT manufacturing hub in Washington and unaudited gross margins, dictates a TRACK posture until verified operational profitability is achieved.
    claimRefs:
      - CV001
      - CV007
      - CV011
      - CV014

