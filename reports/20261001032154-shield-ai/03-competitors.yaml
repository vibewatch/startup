callouts:
  - calloutType: "insight"
    title: "Coopetition Is a Distribution Test"
    body: >-
      Hivemind's reported integration onto Anduril's Fury is strategically important because it
      tests whether Shield AI can earn a role on a competitor's aircraft. The public evidence
      does not disclose the commercial terms or integration burden.
    claimRefs:
      - "CP006"
      - "CP014"
  - calloutType: "risk"
    title: "Public Pricing and Switching Evidence Is Missing"
    body: >-
      The allocated sources do not reveal comparable prices, renewal economics, integration
      costs, or observed customer switching. Claims of superior economics or durable lock-in
      would therefore be premature.
