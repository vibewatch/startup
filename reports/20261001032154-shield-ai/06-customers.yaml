callouts:
  - calloutType: "insight"
    title: "Allied Sovereign Autonomy as an Expansion Flywheel"
    body: "Shield AI's Hivemind SDK deployment with Singapore's DSTA and RSAF represents a structural evolution from conventional hardware export sales to software-enabled sovereign defense capability. By enabling allied nations to author their own autonomous mission behaviors, Shield AI creates high-switching-cost software entrenchment while decoupling military operational capacity from domestic demographic constraints."
    claimRefs:
      - "CU001"
      - "CU002"
  - calloutType: "risk"
    title: "Substantial Scale Deficit and High Customer Concentration Relative to Incumbents"
    body: "While Shield AI projects rapid growth to over $540 million in 2026, its 2025 revenue base of approximately $300 million is dwarfed by Anduril's $2.2 billion scale. Furthermore, the company's dependency on U.S. DoD appropriations and protracted allied defense procurement cycles exposes it to severe budgetary volatility and program cancellation risks."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU009"
