  - id: TE002
    title: Operational Workflow and Autonomy Deployment Matrix
    columns:
      - Operational Mission Job
      - Conventional Workflow
      - Shield AI Solution
      - Demonstrated Operational Benefit
      - Technical & Deployment Limitation
    rows:
      - - Contested Tactical Reconnaissance
        - Manual remote piloting via active satellite data link
