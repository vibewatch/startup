    title: Catastrophic Failure Modes in Kinetic Edge AI
    body: Unlike consumer or enterprise AI models where errors yield minor degradation, edge autonomy errors in physical defense aviation risk loss of aircraft or severe operational compromise, demanding rigorous high-assurance verification.
