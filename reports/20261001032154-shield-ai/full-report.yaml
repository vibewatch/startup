      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Durability depends on whether Hivemind becomes a repeatable autonomy layer across many aircraft or remains
              tied to a limited set of demonstrations and programs. Official flight examples and the reported Fury
              integration are positive portability signals, but the allocated evidence does not disclose integration
              time, recurring software revenue, customer switching behavior, or performance against competing autonomy
              stacks. Incumbent primes can also bundle internal autonomy with existing aircraft, procurement
              relationships, and sustainment infrastructure. Technical risk remains material across the category: ePlane
              AI reported that General Atomics suspended flight tests after a crash. This does not establish a Shield AI
              failure, but it demonstrates that autonomous-fighter development can lose time through test setbacks. The
              defensible moat is therefore conditional on validated cross-platform performance, production execution,
              and distribution conversion rather than on product claims alone.
            claimRefs:
              - CP006
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coopetition Is a Distribution Test
            body: >-
              Hivemind's reported integration onto Anduril's Fury is strategically important because it tests whether
              Shield AI can earn a role on a competitor's aircraft. The public evidence does not disclose the commercial
              terms or integration burden.
            calloutType: insight
            claimRefs:
              - CP006
              - CP014
          - type: callout
            title: Public Pricing and Switching Evidence Is Missing
            body: >-
              The allocated sources do not reveal comparable prices, renewal economics, integration costs, or observed
              customer switching. Claims of superior economics or durable lock-in would therefore be premature.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
