      - number: '7.2'
        title: Regulatory, Legal, and Geopolitical Exposure
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is both transaction-specific and structural. Fortune reported that final closing of
              the 2026 financing is contingent on approval of the Aechelon acquisition and that Shield AI would
              re-evaluate the financing if clearance failed. Separately, analysts identify potential human-in-the-loop
              rules, restrictions on lethal-autonomy mission profiles, and divergent national standards as constraints
              on deployment and international sales. China placed Shield AI on its Unreliable Entities list in 2025,
              barring sourcing, operations, investment, or visits; management says the company is intentionally not
              reliant on China, but no public bill-of-materials evidence in the assigned pool verifies that assertion.
              Kill criteria are denial or material delay of Aechelon clearance, inability to obtain required export or
              mission approvals, or discovery of prohibited sub-tier dependencies.
            claimRefs:
