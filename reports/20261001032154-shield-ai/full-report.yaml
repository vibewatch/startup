      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Allied Sovereign Autonomy as an Expansion Flywheel
            body: >-
              Shield AI's Hivemind SDK deployment with Singapore's DSTA and RSAF represents a structural evolution from
              conventional hardware export sales to software-enabled sovereign defense capability. By enabling allied
              nations to author their own autonomous mission behaviors, Shield AI creates high-switching-cost software
              entrenchment while decoupling military operational capacity from domestic demographic constraints.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: Substantial Scale Deficit and High Customer Concentration Relative to Incumbents
            body: >-
              While Shield AI projects rapid growth to over $540 million in 2026, its 2025 revenue base of approximately
              $300 million is dwarfed by Anduril's $2.2 billion scale. Furthermore, the company's dependency on U.S. DoD
              appropriations and protracted allied defense procurement cycles exposes it to severe budgetary volatility
              and program cancellation risks.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Safety, Quality, and Industrial Execution
        blocks:
          - type: paragraph
            body: >-
              The clearest realized risk is V-BAT safety and product maturity. A 2024 demonstration injured a U.S.
              service member, and military customers imposed flight restrictions for several months; Forbes also
              reported earlier propeller warnings, cracked fuselages, faulty fuel systems, and aircraft losses during
              demonstrations. Shield AI says landing gear now removes the need for human assistance and that Pentagon
              safety audits were passed, but the reporting did not independently confirm those audits. X-BAT adds a
              second execution layer: management is targeting first output in 2028 and approximately 150 aircraft
              annually by the early 2030s from a new 420,000-square-foot facility. The investment case should therefore
              treat audited safety performance, test completion, and factory milestones as gates, not assume that design
              changes have eliminated the failure mode.
            claimRefs:
              - CR001
