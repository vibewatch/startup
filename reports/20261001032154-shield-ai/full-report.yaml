        blocks:
          - type: callout
            title: No defensible TAM yet
            body: >-
              The retained sources mix broad defense budgets, venture funding, military-drone forecasts, contract values
              and company revenue. None discloses a common spend definition that isolates Shield AI's autonomy-software
              and aircraft opportunity, so valuation should use scenario ranges rather than a single top-down TAM.
            calloutType: assumption
