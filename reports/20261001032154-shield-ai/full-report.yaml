  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is military mission autonomy and autonomous aircraft rather than all defense
              spending or all artificial intelligence. Included revenue pools are autonomy software licensing and
              integration, autonomous unmanned-aircraft sales, and contracted aircraft-operated services; simulation is
              an adjacency because it can accelerate autonomy training and validation. The status quo is remotely
              piloted or manually controlled aircraft, while incumbent aircraft software and prime-contractor
              integration are substitutes for a standalone autonomy stack. Shield AI's own demonstrations span VISTA,
              MQ-20 Avenger and dual-ship Firejet aircraft, supporting a cross-platform scope, but they do not prove
              that every defense-aircraft budget is addressable. A separate Shield AI-branded compliance platform at
              shieldai.ai is an unrelated namesake and is excluded from this market.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public figures describe different denominators and therefore should not be collapsed into one TAM. A
              secondary source reports a global military-drone market of approximately $14.4 billion in 2023 and
              forecasts $47.16 billion in 2032, but provides no visible methodology or Shield AI-addressable split. A
              separate analysis reports $49.1 billion of defense-tech VC deals in 2025, including approximately $12
              billion for autonomous systems, while also citing a $961.6 billion FY2026 Pentagon base-budget request
              plus $150 billion of supplemental funding. Those are capital-supply and government-budget contexts, not
              customer-spend TAM. Fortune's at-least-$540-million 2026 company revenue projection is a current-capture
              signal, not SOM, because the source does not define the addressable market or a consistent denominator.
            claimRefs:
