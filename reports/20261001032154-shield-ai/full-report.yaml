      - number: '7.3'
        title: Customer, Partner, and Competitive Dependencies
        blocks:
          - type: paragraph
            body: >-
              Shield AI sells into government procurement systems whose multiyear budgets, political priorities,
              continuing resolutions, and approval processes do not necessarily match venture growth timelines. The
              available evidence supports a broad U.S. military and allied customer set, but it does not quantify
              customer concentration or backlog conversion. At the same time, established primes can bundle autonomy
              with aircraft, munitions, and sustainment, while well-capitalized defense-technology peers compete for
              programs and scarce AI talent. Shield AI's official cross-platform demonstrations on VISTA, Avenger, and
              Firejet are evidence of integration breadth, not proof of recurring production revenue or reliable
              performance across every platform. Monitor option exercise rates, funded backlog, renewal and production
              awards, international approval timing, and the share of revenue attributable to the largest customer and
              program.
            claimRefs:
