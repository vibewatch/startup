      - number: '2.4'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand signals are substantial, but timing and conversion remain uncertain. Defense procurement can be
              delayed by program changes, budget reallocations and congressional action, and a multi-vendor architecture
              weakens assumptions of exclusive software capture. International growth raises export-control exposure.
              The pending Aechelon transaction also creates a near-term regulatory dependency: Fortune reports that
              final financing close is contingent on acquisition approval and that the company would re-evaluate
              financing if the deal failed. X-BAT adds capital intensity and schedule risk; company projections reported
              by GeekWire call for the first Des Moines aircraft in 2028 and production near 150 per year by the early
              2030s. Valuation work should therefore scenario-test contract conversion, international approvals and
              factory ramp rather than capitalize broad defense budgets as revenue opportunity.
            claimRefs:
              - CM010
              - CM012
              - CM014
              - CM015
              - CM016
