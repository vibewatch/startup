  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Buyers can compare Shield AI with several distinct solution classes. Anduril is the closest venture-backed
              full-stack peer in the allocated evidence, while Palantir is an adjacent battlefield-data platform rather
              than a flight-autonomy vendor. Skydio addresses smaller commercial and tactical drones, and General
              Atomics, Northrop Grumman, and Lockheed Martin represent incumbent aircraft or prime-contractor
              alternatives. Shield AI itself spans Hivemind autonomy, V-BAT and X-BAT aircraft, and Aechelon simulation
              technology. The landscape is also cooperative: Hivemind's selection for Anduril's Fury makes Anduril both
              a competitor and a route onto a third-party airframe. Internal development and continued use of remotely
              piloted or legacy systems remain buyer alternatives, but the assigned evidence does not quantify their
              cost, implementation time, or mission performance.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
