      - number: '2.3'
        title: Buyers, users, payers and adoption path
        blocks:
          - type: paragraph
            body: >-
              The core payer is a government program or allied ministry, while operational users are service personnel,
              mission planners and platform operators. Procurement can occur through direct aircraft purchases, service
              contracts such as the Coast Guard's $198 million V-BAT IDIQ, or autonomy integration into aircraft owned
              by primes and government programs. Independent reporting says more than half of projected 2026 revenue is
              expected from international customers, making export approvals and allied budgets material to adoption.
              The purchase trigger is mission performance where communications, GPS or runways are degraded; the company
              frames resilient onboard autonomy as the response. However, Air Force testing that switched between
              Hivemind and Anduril's Lattice also indicates that buyers may require interoperability rather than accept
              single-vendor lock-in.
            claimRefs:
