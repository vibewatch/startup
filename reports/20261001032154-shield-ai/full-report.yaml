    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Shield AI is a private defense technology company founded in 2015 and headquartered in San Diego. Brandon
              Tseng, Ryan Tseng, and Andrew Reiter are consistently identified as the founders across the retained
              independent profiles. The operating proposition spans Hivemind autonomy software and company-built
              aircraft: V-BAT is the current unmanned aircraft line, while X-BAT is developmental. This creates two
              potential revenue paths, aircraft or operated-system sales and licensing Hivemind into third-party
              platforms, but the retained evidence does not disclose contract-level economics or recurring software
              revenue. The official site at shield.ai should also be distinguished from shieldai.ai, an unrelated
              data-protection and compliance platform founded in 2024.
