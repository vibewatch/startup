      - number: '6.3'
        title: Named Customer Proof, Retention Realities, and Concentration Hazards
        blocks:
          - type: paragraph
            body: >-
              Institutional evidence confirms expanding international adoption of Shield AI's hardware and autonomy
              platforms across key sovereign defense organizations. In February 2026, the Republic of Singapore Air
              Force and the Defence Science and Technology Agency expanded their strategic partnership to deploy the
              Hivemind software development kit across diverse uncrewed aircraft, enabling Singaporean defense engineers
              to independently program and deploy sovereign AI pilot behaviors. Concurrently, the Indian Army selected
              V-BAT and Hivemind in January 2026 with designated local industrial development pathways, while the Polish
              Armament Agency contracted for V-BAT systems for Polish Navy maritime security in June 2026 following
              Japan's Maritime Self-Defense Force selection in 2025. Despite these high-profile wins, customer
              concentration remains a critical vulnerability. Shield AI's revenue is overwhelmingly dependent on
              sovereign defense budgets and single-program appropriation milestones. Crucially, public filings omit
              cohort-based net revenue retention rates, software churn data, and unit-level gross margins, obscuring
              whether international selections represent durable recurring software cash flows or finite hardware
              procurement contracts.
            claimRefs:
              - CU001
              - CU002
