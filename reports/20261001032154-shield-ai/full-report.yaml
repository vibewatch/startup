              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Safety mitigation is reported, not independently proven
            body: >-
              Unassisted landing gear and safety audits are meaningful mitigations, but the assigned evidence does not
              provide audited fleet hours, incident rates, MTBF, or the underlying Pentagon findings. Treat recurrence
              risk as unquantified rather than low.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Decision gates for the next diligence cycle
            body: >-
              Require acquisition clearance and financing-condition documents, independent V-BAT safety and reliability
              data, X-BAT factory and flight-test milestones, customer and program concentration, supplier maps, and a
              cash-to-milestone plan before underwriting the public growth projection.
            calloutType: recommendation
            claimRefs:
