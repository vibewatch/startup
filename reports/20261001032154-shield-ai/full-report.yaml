      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software-First Defensibility with Edge Hardware Specialization
            body: >-
              Shield AI differentiates from traditional defense prime contractors by treating autonomy software as the
              primary asset, using Hivemind as an interchangeable pilot across both proprietary airframes (V-BAT, X-BAT)
              and government-owned platforms.
