      - Anti-Thesis Risk
      - Verification Trigger
    rows:
      - - Autonomy Moat
        - Hivemind platform delivers mission autonomy without GPS or communications across diverse aircraft.
        - Autonomy algorithms face continuous electronic warfare adaptation and verification challenges.
        - Demonstrated combat survivability in contested theater deployments.
      - - Program Anchors
        - Primary selection for USAF Collaborative Combat Aircraft (CCA) and low-cost LUCAS attack drone programs.
        - Award fee exposure structure ties contract revenues directly to user combat ratings and subjective milestones.
