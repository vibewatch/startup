      - number: '7.4'
        title: Financial Model Exposure and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The March 2026 package was reported as $1.5 billion of Series G funding plus $500 million of fixed-return
              preferred equity, while management projected more than $540 million of 2026 revenue and more than 80%
              growth. Funding raised is not the same as unrestricted cash available: the package supports an acquisition
              and product scaling, includes a preferred instrument, and has a closing contingency. EquityZen also
              characterizes the business as capital-intensive with long development cycles and cites continuing
              profitability risk. Public sources in the assigned pool do not disclose cash burn, gross margin, EBITDA,
              working-capital needs, preferred terms, factory commitments, or program-level economics. Thesis-break
              triggers are repeated safety restrictions, missed X-BAT flight or factory milestones, acquisition
              clearance failure that changes financing, or evidence that funded backlog and margins cannot support the
              hardware ramp without repeated dilutive or senior capital.
            claimRefs:
              - CR005
              - CR006
