      - number: '3.3'
        title: Pricing, GTM, and Distribution
        blocks:
          - type: paragraph
            body: >-
              The retained public sources do not provide comparable list prices, per-aircraft software fees, discount
              schedules, or realized contract economics for Shield AI or the named alternatives. The appropriate
              comparison is therefore packaging and route to market, not invented price points. Shield AI's own Baltics
              job posting describes territory strategy, pipeline ownership, direct engagement with defense ministries
              and procurement authorities, regional partnerships, contract negotiation, and a carried sales quota. That
              indicates a direct, capture-led enterprise and government motion rather than self-service pricing.
              Recruiting data showing 391 open roles, including 173 in engineering and 62 in operations, and an external
              product-management guide emphasizing concept-to-deployment ownership both point to organizational
              investment in technical delivery and customer integration. However, neither source establishes sales
              efficiency or win rates.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
