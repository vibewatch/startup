  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Defense Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Shield AI segments its customer base across three primary institutional tiers: tier-one domestic defense
              branches, international allied sovereign ministries, and commercial technology ecosystem partners. The
              domestic defense segment represents the historical anchor of the company's revenue and operational
              validation, encompassing the U.S. Air Force, U.S. Navy, U.S. Marine Corps, and U.S. Special Operations
              Command. Purchasing in this tier is conducted through multi-year defense appropriation lines, Small
              Business Innovation Research transitions, and advanced program awards, including the Pentagon's
              Collaborative Combat Aircraft program and the U.S. Navy's $50 million initial X-BAT development award.
              Allied sovereign defense forces constitute the fastest-growing customer vector, characterized by direct
              government foreign military sales and bilateral co-development agreements with nations such as Singapore,
              India, Poland, and Japan. Finally, commercial technology partnerships, exemplified by collaborative
              cloud-to-edge deployment frameworks with Amazon Web Services, serve as technical distribution channels to
              streamline software container delivery rather than direct end-user procurement channels.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU008
              - CU011
              - CU013
          - type: table
            tableRef: TU001
