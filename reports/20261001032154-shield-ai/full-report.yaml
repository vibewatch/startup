  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Shield AI monetizes defense autonomy through a dual model spanning hardware systems, proprietary software
              licensing, and integrated tactical simulation. Its primary deployed hardware product is the V-BAT vertical
              takeoff and landing uncrewed aerial system, which is procured across United States military
              branches—including the Marine Corps and Coast Guard—and foreign militaries such as Japan, India, and
              Armenia. In addition to complete aircraft sales, Shield AI markets its core autonomy stack, Hivemind, as a
              modular standalone software license to prime contractors and government programs, including Collaborative
              Combat Aircraft efforts. The company expanded this simulation and autonomy pipeline through its March 2026
              acquisition of Aechelon Technology, a legacy defense simulation vendor whose synthetic environment tools
              support over 1,000 operational military flight training systems. However, realize-price dynamics remain
              opaque: official list pricing is generally undisclosed, except for the newly announced X-BAT
              sixth-generation autonomous strike aircraft, which carries an estimated unit price tag of approximately
              $27 million. Standard defense contracting practices, including cost-plus developmental awards and
              firm-fixed-price production lots, govern cash conversion and create lumpy revenue recognition.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
