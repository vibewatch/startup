evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: undisclosed-cover-metrics
    missingEvidence: >-
      Audited ARR, active-customer count, lifetime capital raised by instrument, cash balance, and amounts actually
      funded or drawn.
    whyItMatters: >-
      These denominators are necessary to assess recurring revenue quality, customer concentration, dilution, liquidity,
      and runway without confusing announced financing with available cash.
    diligencePath: >-
      Request audited financial statements, the capitalization schedule, bank statements, debt and preferred-equity
      documents, and a dated active-customer roster.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Complete current executive roster, board and committee membership, founder titles, voting control, key-person
      retention terms, and succession plans.
    whyItMatters: >-
      Public evidence identifies founders and selected appointees but cannot establish decision rights, bench depth, or
      dependence on individual leaders.
    diligencePath: >-
      Obtain the current organization chart, board minutes, committee charters, voting agreements, employment
      agreements, and key-person succession plan.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization-and-transaction-terms
    missingEvidence: >-
      Complete capitalization table, individual investor ownership, secondary transactions, preferred return and
      liquidation terms, facility covenants, acquisition consideration, and closing confirmations.
    whyItMatters: >-
      Named participants and headline amounts do not establish dilution, seniority, control, cash availability, or
      whether the announced financing and acquisition fully closed.
    diligencePath: >-
      Review signed financing and acquisition agreements, closing binders, wire confirmations, the pro forma
      capitalization table, and all investor rights agreements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited fiscal 2026 revenue, gross margin, backlog conversion, software-versus-hardware mix, and revenue
      concentration.
    whyItMatters: >-
      The retained $540 million figure is a projection and cannot be treated as recognized revenue, ARR, or proof of
      software-like margins.
    diligencePath: >-
      Request audited financials, revenue-recognition policies, backlog schedules, product-line gross margins, and
      customer concentration tables.
  - type: missing-source
    severity: material
    topic: sizing-limitation
    missingEvidence: >-
      A buyer-spend dataset that isolates mission-autonomy software, autonomous-aircraft procurement and service spend
      by geography and program.
    whyItMatters: >-
      Without a consistent denominator, public figures cannot distinguish broad TAM from Shield AI-addressable SAM or
      realistic SOM.
    diligencePath: >-
      Request management's bottom-up program pipeline and reconcile it to service and allied procurement budgets using
      consistent category definitions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Program-level win rates, procurement-cycle duration, deployment utilization, renewal data and buyer ROI.
    whyItMatters: >-
      These data determine how quickly demand signals convert into recurring revenue and whether adoption survives
      budget or program delays.
    diligencePath: Obtain contract cohort data and conduct reference calls with program offices, operators and integration partners.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: independent-market-profile
    missingEvidence: Substantive text from the assigned Contrary Research profile; the prefetched page exposed only a privacy notice.
    whyItMatters: The profile could provide an additional independent check on category boundaries and the business model.
    diligencePath: >-
      Review an authorized accessible copy in a later research run without treating the current fetch as evidentiary
      support.
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable software fees, aircraft prices, discounts, renewal terms, support charges, and contract denominators
      for Shield AI and named alternatives.
    whyItMatters: Without common units and realized terms, relative pricing power and customer total cost cannot be underwritten.
    diligencePath: >-
      Request redacted contracts, pricing schedules, renewal cohorts, support invoices, and bid-level competitor
      comparisons from management and customers.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: internal-build-comparison
    missingEvidence: >-
      Measured cost, schedule, readiness, mission-performance, and switching data comparing internal development or
      legacy operation with third-party autonomy.
    whyItMatters: The status quo may win on control or installed workflows even when a vendor claims superior technical capability.
    diligencePath: >-
      Obtain buyer program baselines, integration schedules, test results, operator interviews, and total-cost analyses
      using a common mission profile.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited gross margin percentage split across software licensing and hardware manufacturing lines.
    whyItMatters: >-
      Without segmented gross margins, underwriters cannot verify whether Hivemind software profits subsidize
      capital-intensive UAS production.
    diligencePath: >-
      Request audited GAAP segment financials and cost-of-goods-sold accounting schedules during confidential data room
      review.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn
    missingEvidence: Quarterly operating cash burn, runway duration, and EBITDA bridge.
    whyItMatters: >-
      Determines how rapidly Shield AI consumes its $2 billion capital package while funding X-Forge 3 construction and
      Aechelon integration.
    diligencePath: Obtain rolling 24-month cash flow projections, working capital statements, and monthly treasury reports.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: retention
    missingEvidence: Net Revenue Retention (NRR) and logo churn rates for Hivemind software customers.
    whyItMatters: >-
      Measures whether defense contractors and military programs expand software seat licensing over multi-year
      deployments.
    diligencePath: Review software contract cohorts, renewal histories, and annual contract value expansion tables.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: airframe-platforms
    missingEvidence: Third-party flight test telemetry and verified unit production cost metrics for the X-BAT prototype airframe.
    whyItMatters: >-
      Validating whether the 2,000 nautical mile range and vertical takeoff capabilities operate reliably at projected
      unit manufacturing costs is essential for underwriting defense program adoption.
    diligencePath: >-
      Request military test flight evaluations and supplier airframe bill-of-materials breakdowns during management
      diligence sessions.
  - type: access-blocked
    severity: minor
    topic: safety-assurance
    missingEvidence: >-
      Formal Department of Defense airworthiness certification logs and hazard assessments for Hivemind dogfighting
      software across tactical platforms.
    whyItMatters: >-
      Government airworthiness certifications dictate deployment authorization across crewed and uncrewed military
      aircraft fleets.
    diligencePath: >-
      Inspect military flight release documentation and operational test director safety reports via defense customer
      liaisons.
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive classified contract values, delivery milestones, and sovereign procurement details across allied
      defense ministries.
