company:
  name: "Shield AI"
chapter:
  number: 4
  title: "Financials"
  summary: "Shield AI raised a $1.5 billion Series G alongside $500 million in fixed-return preferred equity in March 2026 at a $12.7 billion post-money valuation, scaling trailing revenue from approximately $163 million in 2023 to $300 million for the fiscal year ending March 2025. While management projects over 80% growth toward $540 million in 2026, the company missed its prior fiscal year target by 25%, trades at a rich ~46x trailing multiple on secondary markets, and maintains undisclosed gross margins and cash burn."
sections:
  - id: "revenue-streams-and-pricing"
    title: "Revenue Streams and Monetization Mechanics"
    body: "Shield AI monetizes defense autonomy through a dual model spanning hardware systems, proprietary software licensing, and integrated tactical simulation. Its primary deployed hardware product is the V-BAT vertical takeoff and landing uncrewed aerial system, which is procured across United States military branches—including the Marine Corps and Coast Guard—and foreign militaries such as Japan, India, and Armenia. In addition to complete aircraft sales, Shield AI markets its core autonomy stack, Hivemind, as a modular standalone software license to prime contractors and government programs, including Collaborative Combat Aircraft efforts. The company expanded this simulation and autonomy pipeline through its March 2026 acquisition of Aechelon Technology, a legacy defense simulation vendor whose synthetic environment tools support over 1,000 operational military flight training systems. However, realize-price dynamics remain opaque: official list pricing is generally undisclosed, except for the newly announced X-BAT sixth-generation autonomous strike aircraft, which carries an estimated unit price tag of approximately $27 million. Standard defense contracting practices, including cost-plus developmental awards and firm-fixed-price production lots, govern cash conversion and create lumpy revenue recognition."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-multiples"
    title: "Public Traction, Forecast Accuracy, and Multiple Realities"
    body: "Public reporting reveals substantial top-line expansion alongside notable underwriting risks regarding revenue trajectory and market pricing. Historical revenue roughly doubled from 2022 to reach approximately $163 million in 2023, expanding further to about $300 million for the fiscal year ending March 2025 per company disclosures. Despite this top-line trajectory, Shield AI fell $100 million short of its original $400 million target for the period ending March 2025, representing a 25% delivery shortfall that illustrates the lumpiness and execution risks inherent in defense procurement cycles. Management forward guidance projects over 80% revenue growth for calendar year 2026, aiming for at least $540 million in revenue excluding any inorganic revenue contribution from the Aechelon Technology acquisition, on an envisioned path toward $1 billion in revenue for the fiscal year ending March 2028. Independent secondary market evaluations emphasize the danger of relying on unverified data aggregators: while automated screeners published a modeled linear projection of $1.6 billion in 2025 revenue implying a cheap 3.8x sales multiple, Shield AI's real trailing valuation trades closer to 46x actual fiscal 2025 revenue against its $12.7 billion primary benchmark and $13.9 billion implied secondary capitalization."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-unit-economics"
    title: "Capital Structure, Balance Sheet Dependency, and Underwriting Verdict"
    body: "Shield AI has accumulated more than $3.5 billion in total capital across 17 institutional rounds since its 2015 inception, concluding its massive March 2026 financing package comprising a $1.5 billion equity Series G co-led by Advent International and JPMorgan Chase at a $12.7 billion post-money valuation, complemented by $500 million in non-dilutive fixed-return preferred equity financing from Blackstone. A substantial portion of this capital injection is earmarked to finance the cash acquisition of Aechelon Technology and scale advanced manufacturing facilities, such as the 420,000-square-foot X-Forge 3 facility in Des Moines, Washington, which requires thousands of aerospace technicians and significant capital expenditure ahead of targeted 2028 aircraft deliveries. From an underwriting standpoint, Shield AI exhibits severe financial disclosure gaps: the company does not publicly disclose gross margins, EBITDA, operating cash burn, net revenue retention, or contract renewal rates for Hivemind. In secondary markets, investor demand exhibits caution, sitting at a quiet 0.9-to-1 ratio relative to share supply with shares trading near $168.17. Given the high trailing multiple of ~46x, missed historical budget targets, and heavy capex requirements for full-scale aircraft production, underwriters must treat future growth and margin expansion with conservative scrutiny."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
