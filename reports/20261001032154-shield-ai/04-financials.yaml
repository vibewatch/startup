callouts:
  - calloutType: "risk"
    title: "Secondary Market Multiple Disconnect and Execution Vulnerability"
    body: "Shield AI's valuation in private and secondary markets carries high execution sensitivity. While modeled third-party screening reports projected $1.6 billion in sales implying a modest 3.8x revenue multiple, actual revenue for the fiscal year ending March 2025 was $300 million, resulting in an aggressive ~46x trailing multiple. Given that Shield AI missed its $400 million target by 25% in FY2025 and investor demand in secondary markets sits below supply at 0.9 to 1, any execution delays in scaling X-BAT manufacturing or closing international Hivemind contracts could trigger severe valuation compression."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI011"
