    - type: "enumeration-incomplete"
      severity: "material"
      topic: "leadership-and-governance"
      missingEvidence: "Complete current executive roster, board and committee membership, founder titles, voting control, key-person retention terms, and succession plans."
      whyItMatters: "Public evidence identifies founders and selected appointees but cannot establish decision rights, bench depth, or dependence on individual leaders."
      diligencePath: "Obtain the current organization chart, board minutes, committee charters, voting agreements, employment agreements, and key-person succession plan."
      relatedTableRefs:
        - "TO002"
