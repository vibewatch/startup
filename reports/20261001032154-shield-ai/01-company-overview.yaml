      severity: "material"
      topic: "capitalization-and-transaction-terms"
      missingEvidence: "Complete capitalization table, individual investor ownership, secondary transactions, preferred return and liquidation terms, facility covenants, acquisition consideration, and closing confirmations."
      whyItMatters: "Named participants and headline amounts do not establish dilution, seniority, control, cash availability, or whether the announced financing and acquisition fully closed."
      diligencePath: "Review signed financing and acquisition agreements, closing binders, wire confirmations, the pro forma capitalization table, and all investor rights agreements."
