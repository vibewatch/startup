company:
  name: "Shield AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Shield AI is a San Diego-headquartered defense technology company founded in 2015 that combines Hivemind autonomy software with V-BAT and X-BAT aircraft programs. Its March 2026 announcement described a $1.5 billion Series G at a $12.7 billion post-money valuation plus $500 million of fixed-return preferred equity, but retained evidence does not establish lifetime capital raised, cash available, audited revenue, ARR, or customer count."
sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >-
      Shield AI is a private defense technology company founded in 2015 and headquartered in
      San Diego. Brandon Tseng, Ryan Tseng, and Andrew Reiter are consistently identified as
      the founders across the retained independent profiles. The operating proposition spans
      Hivemind autonomy software and company-built aircraft: V-BAT is the current unmanned
      aircraft line, while X-BAT is developmental. This creates two potential revenue paths,
      aircraft or operated-system sales and licensing Hivemind into third-party platforms, but
      the retained evidence does not disclose contract-level economics or recurring software
      revenue. The official site at shield.ai should also be distinguished from shieldai.ai,
      an unrelated data-protection and compliance platform founded in 2024.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO016"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      Founder-market fit is strongest in defense operations and engineering: Brandon Tseng is
      described as a former Navy SEAL, Ryan Tseng as the founder of WiPower, and Andrew Reiter
      as a former Draper Labs engineer. Leadership changed materially in March 2025 when Gary
      Steele became chief executive and Ryan Tseng moved to a strategy role. The March 2026
      financing announcement also tied governance rights to the new capital: Advent chairman
      David Mussafer was expected to join the board and JPMorganChase executive Todd Combs was
      expected to become a board observer. Current founder titles, the complete board roster,
      voting control, liquidation preferences, and succession depth remain private-evidence
      diligence items rather than verified public facts.
    claimRefs:
      - "CO002"
      - "CO009"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization and Scale"
    body: >-
      On March 26, 2026, Shield AI announced that it was raising $1.5 billion in Series G
      funding at a $12.7 billion post-money valuation and $500 million in fixed-return
      preferred equity. The same announcement said Blackstone-managed funds committed a
      separate $250 million delayed-draw facility. These are announced transaction amounts,
      not evidence of cash on hand, and the source did not provide the preferred return,
      liquidation seniority, draw conditions, or fully diluted ownership. Independent
      profiles report earlier $165 million and $200 million rounds in 2022 and 2023,
      respectively. Third parties project more than $540 million of fiscal 2026 revenue, but
      no retained audited financial statement confirms that projection, ARR, margins, or
      customer count.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "milestones-and-diligence"
    title: "Milestones and Diligence Priorities"
    body: >-
      The public chronology shows a company moving from a 2016 Defense Innovation Unit
      contract through the 2021 acquisitions of Heron Systems and Martin UAV, two marked-up
      private rounds, a 2025 chief-executive transition, and the 2026 financing and planned
      Aechelon acquisition. The record also includes an adverse operating event: Wikipedia's
      cited account says a V-BAT landing partially amputated three fingers of a U.S. Navy
      service member in April 2024 and led to temporary flight restrictions. That event is
      evidence of safety and deployment risk, not proof of a broader incident rate. The
      highest-priority diligence remains transaction closing status, financing terms,
      audited revenue quality, customer concentration, full leadership coverage, and the
      operational controls adopted after the injury.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO013"
    figureRefs:
      - "FO001"
