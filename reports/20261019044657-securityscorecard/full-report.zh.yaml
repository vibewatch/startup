        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议应对价格敏感，而不是只对公司质量敏感。SecurityScorecard 仍像一个真实的品类平台：官方公告显示客户扩张、多季度增长和快速扩大的 MAX
              产品层，但这些证明点并未填补当前经济性或进入价格方面的投资判断缺口。独立市场参考也没有收敛：一个来源仍将公司置于私有、未 IPO 的悬置状态；另一个来源指向 2021 年独角兽轮；第三个来源则锚定到明显更低的
              2026 年私募市场估值。这种组合支持“跟踪”立场，信心中等、风险评级高，直到公司提供新的财务数据和交易层面的估值证据。
