              - CP007
              - CP009
              - CP015
          - type: callout
            title: 核心尽调问题是附加率，而不是知名度
            body: >-
              SecurityScorecard 可能拥有足够的品牌和合作伙伴触达来持续获取新 pipeline，但公开证据对这些 pipeline 有多大比例转化为多模块 TPRM
              采用，明显更弱。与投资最相关的验证点，是评级客户是否以有吸引力的留存和利润率扩展到 Atlas、MAX、TITAN AI 及渠道主导的部署。
