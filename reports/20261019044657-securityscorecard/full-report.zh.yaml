  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 外部视角数据收集与归因
        - 发现资产、接收外部信号，并将发现结果关联到实体
        - 面向互联网的遥测、归因逻辑和刷新频率
        - 动态 IP 所有权和不完整的可见性会造成误报 / 漏报，使模型具有概率性而非确定性
      - - 评级与因子评分引擎
        - 将发现结果转化为 10 个因子分数和总体字母等级态势信号
        - 问题加权、验证流程和反驳工作流
        - 模型透明度仅限于白皮书；买方仍依赖 SecurityScorecard 自身的评分定义
      - - 供应商工作流层（Watch / Assess）
        - 将分数映射到问卷、模板、审核代理和风险评分工作流
        - 当前套餐、集成、角色控制和收购而来的 HyperComply 评估逻辑
        - 公开文档没有说明自动化在人工审核前能推进到多深，也没有说明多少比例的评估可以端到端处理
      - - 响应与托管服务层（Secure / MAX / SCDR）
        - 增加威胁驱动的发现、修复跟踪和供应商触达
        - 托管服务人员、合作伙伴交付，以及客户将供应商响应落到运营中的意愿
        - 结果性主张由公司提出，对于人员更少的团队或更窄的供应商生态，可能更难复现
      - - 信任 / 公共部门入口
        - 利用合规资质和政府分销渠道降低买方摩擦
        - FedRAMP Ready、DHS CDM APL、AWS MSP 状态和公共部门合作关系
        - 这些是有帮助的采购信号，但不能直接证明日常数据准确性、隐私实践或实施质量
    notes: 这是根据公开产品页面、方法论文字、评价和新闻稿做出的外部重构，不是内部系统图。
