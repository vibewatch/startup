        blocks:
          - type: paragraph
            body: >-
              可观察到的融资记录方向积极，但还不够干净，无法设定明确价格。Forge 报告称 2021 年 3 月公司完成 $180 million 的 E 轮融资，投后估值为 $1.04
              billion；PrivateMarketView 则显示 2026 年 10 月约 $359.5 million 的估值，并明确称自 2019 年 6
              月那轮融资以来，没有二级交易或机构基金估值变动过该数字。两组参考差距过大，不能单独将任一项视为公允价值。与此同时，公开网络安全可比公司的远期收入倍数仍处于极宽区间，因此在没有当前
              ARR、利润率和留存数据时，仅凭品类归属无法为溢价进入价格辩护。
