        title: 产品覆盖与客户工作流
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard
              的公开产品如今已不只是一个时点安全分数。公司仍以网络安全评级为企业风险管理、第三方风险管理、董事会报告和网络保险的基础，但又将评级嵌入问卷工作流、持续供应商监测和托管式响应服务。当前产品包装围绕 TITAN
              Watch、Assess 和 Secure 展开；收购 HyperComply
              后，又增加了专注评估的知识库和自动化叙事。因此，实际买方工作流是：发现外部暴露，将态势映射到供应商问卷，自动收集和审阅证据，然后在客户缺少人员时升级到整改或托管外联。这比传统记分卡产品更广，但公开材料仍主要用公司自身语言描述结果，而不是独立实施指标。
