              SecurityScorecard 的公开证据显示其在政府级控制上确有进展：公司称 2023 年达到 FedRAMP Ready，并在 2025 年 8 月称已达到 StateRAMP Ready 且重新获得
              FedRAMP Ready
              认证。这些资质有助于解释受监管客户的牵引力，也支持公共部门和重合规用例具有战略重要性的判断。但同一证据也构成风险面，因为公司定位的很大一部分如今依赖维持这些资质、保留获批产品名单访问权，并将合规可信度转化为持久收入，而非时点式公告。披露质量同样不均衡：公开材料对平台规模、客户、使用平台的组织和已评级实体使用不同分母，因此投资人不能将这些数字视为可互换的变现采用证据。指定来源池没有提供公司特定的诉讼、隐私执法或事故记录证据，因此法律和隐私下行仍是重要尽调缺口，而不是已排除的风险。
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR015
              - CR016
          - type: table
