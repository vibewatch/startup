      - number: '7.4'
        title: 增长越来越经由合作伙伴和相邻产品展开，而公开估值叙事尚未更新
        blocks:
          - type: paragraph
            body: >-
              公司 2025 年公告将渠道扩张、服务商赋能和 MAX 采用列为核心增长引擎，其中渠道来源 pipeline 同比增长 124%，MAX 自 2024 年第一季度推出以来增长超过
              370%。更早的公司证据还强调，合作伙伴市场扩大 80%，集成合作伙伴超过 90 家。这些披露支持规模，但也暴露出依赖性：如果合作伙伴生产率放缓、MAX
              经济性令人失望，或增长很大一部分来自稀释软件利润率的重服务模式，headline 客户增长故事可能迅速变弱。资本侧同样缺乏记录。Forge 仍指向 2021 年 3 月 E 轮和 $1.04B
              投后估值，并称近期市场活动有限；指定公开来源没有披露当前 ARR、毛利率、烧钱、现金或 NRR。这样一来，投资人面临估值压缩和效率风险，却没有足够公开证据精确判断下行。
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
