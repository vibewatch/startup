            title: 以评级为先的厂商仍容易受到工作流捆绑攻击
            body: >-
              公开竞争和客户证据指向同一个压力点：模块分离、定价不透明和验证成本，使更广泛的套件更容易以低摩擦持有权来争取买方。如果买方认为评级是必要但不充分的能力，SecurityScorecard
              就必须靠附加率和运营杠杆取胜，而不只是靠品类认知。
            calloutType: risk
            claimRefs:
