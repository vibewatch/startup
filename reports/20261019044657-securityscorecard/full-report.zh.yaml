  - id: TV002
    title: 正论 / 反论表
    columns:
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 正论：品类领导地位真实存在
        - 官方公告显示，2023 年末客户数为 2,600 家；截至 2025 年 8 月，客户数超过 3,000 家，且收入已连续增长 10 个以上季度。
        - 新鲜的 ARR、毛利率和 NRR 披露，证明增长质量与表面牵引力相匹配。
      - - 正论：产品扩张可以拓宽价值叙事
        - 公司称 MAX 在 2023 年推动了创纪录收入；自 2024 年第一季度发布以来，增长超过 370%。
        - 证据表明 MAX 的增长来自可重复、以软件为主的收入，而不是低倍数服务组合。
      - - 反论：当前估值证据不一致
        - Forge 指向一轮 2021 年 $1.04B 融资，而 PrivateMarketView 在 2026 年 10 月将公司估值标在约 $359.5M。
        - 交易层面的二级市场成交价，或一轮能够解释价差的新一级融资。
      - - 反论：流动性和竞争可能压缩回报
        - EquityZen 强调定价压力、合作伙伴依赖和运营集成风险，而公开市场股份不可用。
        - 持久定价权、高效的市场进入和更清晰的退出路径证据。
    notes: 该表将投资正论与反论分开；“当前证据”仅使用公开观察，明确排除未公开的管理层口径。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 客户增长和 MAX 势头转化为高溢价 SaaS 经济性，同时保持强劲留存和健康利润率。
        - 只有当新鲜 ARR、利润率和 NRR 数据显示业务应享有高溢价网络安全软件倍数时，超过 $1.0B 的估值才有依据。
        - 公司仍可能面临竞争、服务组合拖累或退出时点风险。
        - 仅凭当前公开材料无法支持。
      - - 基准
        - 增长延续，但经济性仍部分不透明，私募流动性继续受限。
        - 谨慎的 $500M-$1.0B 估值框架，更符合 2021 年融资轮与 2026 年私募市场标记之间的巨大价差。
        - 即使表面增长保持不变，缺失的股权结构条款和当前财务数据仍可能降低实际回报。
        - 目前多数证据指向这一情景。
      - - 悲观
        - 增长质量令人失望，或下一次定价事件更接近缺乏流动性的二级市场预期，而不是 2021 年独角兽轮。
        - $350M-$500M 更接近较低的外部市场标记，也符合倍数压缩结果。
        - 下轮融资风险、优先权悬置和较长持有期，可能损害普通股回报。
        - 如果尽调没有改善事实基础，这一情景完全可能发生。
    notes: 情景区间是粗略的分析范围，以观察到的 2021 年和 2026 年外部参考及公开可比公司倍数分散为锚；它们不是报价、审计估值或管理层指引。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
