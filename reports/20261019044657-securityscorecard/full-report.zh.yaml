      - number: '2.2'
        title: 市场规模视角与增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              公开的市场规模证据更适合视为一组相邻预算视角，而不是字面意义上的 SecurityScorecard TAM/SAM/SOM 体系。2026 年 Gartner 预测摘要称，全球信息安全支出将在 2026 年达到
              $244.2 billion；云安全支出到 2029 年将增长至约 $32.4 billion；身份与访问管理支出将从 2024 年的 $18.7 billion 增至 2029 年的 $29.0
              billion。同一来源还指出，安全咨询和专业服务也在增长，这很重要，因为 SecurityScorecard
              的市场叙事正日益混合软件、托管响应和工作流自动化。这些数字说明宏观安全预算仍在扩张，尤其是触及第三方风险的云安全和治理型品类。

              但这些大数字应被视为外部预算背景，而不是 SecurityScorecard 直接拥有同等规模 TAM 的证明。更相关的品类代理指标要窄得多：PeerSpot 将 SecurityScorecard 和
              BitSight 放在 IT 供应商风险管理品类中，并显示两者 2026 年的心智份额几乎相等；Tracxn
              则统计了数百家活跃竞争者。这两项信息共同支持这样一种判断：这是一个真实但竞争激烈的品类，既有买方认知和成熟替代者，也存在相邻扩张空间。当监管压力、供应商集中度和 AI
              驱动的工作流扩张促使买方从定期评估转向全天候外部监测与托管式第三方响应时，SecurityScorecard 的机会可能进一步扩大。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM016
      - number: '2.3'
        title: 采用约束、可比性边界与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求信号清晰，但摩擦同样明显。客户和评论来源一致认可持续监测、简单评分，以及对供应商或域名风险更好的优先级排序，这支持基本用例。同时，PeerSpot 和 AWS Marketplace
              评论内容也反复指出误报、评分变化背后的上下文有限、整改指导不足及 GRC 集成不够深入。买方流程往往涉及受监管或采购流程繁重的工作流，因此可解释性和可辩护的整改路径可能与原始信号生成同样重要。

              公开采用指标也难以简单化。SecurityScorecard 的材料分别提到超过 1,000 个组织使用评级技术、2023 年有 2,600 家客户和 70,000 个组织使用平台，以及 2025 年超过
              3,300 个组织。这些都是方向积极的信号，但并非可互换的分母，也没有披露细分构成、付费席位经济性、平均合同价值或托管服务附加率。对估值工作而言，市场章节可以证明需求、买方紧迫性和品类广度，却无法建立可辩护的独立
              SAM/SOM。因此，在使用自上而下的市场叙事进行投资判断前，应要求管理层提供可对账的 KPI 定义、产品线收入构成、定价架构和赢单率数据。
            claimRefs:
              - CM009
              - CM013
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 广泛的网络安全支出并不等于 SecurityScorecard 的直接 TAM
            body: >-
              宏观预算背景有利，但可投资问题在于，其中有多少支出会转化为 SecurityScorecard
              能够以经济方式赢得的经常性评级、TPRM、问卷和托管响应预算。因此，在估值工作中依赖自上而下的网络安全支出数据前，应要求按细分市场拆分收入、按产品和客户层级列示 ACV，以及赢单/失单数据。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合已覆盖直接评级同业、更广泛的 TPRM 套件和现状方案
        blocks:
          - type: paragraph
            body: >-
              买方的实际选择已不再只是 SecurityScorecard 与另一家评级供应商二选一。保留的证据显示至少有五条可信路径：以评级为核心的成熟厂商，如 Bitsight；更广泛的网络风险套件，如
              UpGuard；偏量化的替代方案，如 Black Kite；专注扫描准确性的厂商，如 RiskRecon；以及内部搭建/维持现状的方案，即电子表格加人工问卷。SecurityScorecard 正借助 MAX
              托管服务和 TITAN AI，将自身框架从评级拓宽到更广泛的供应链风险平台；但公开竞争定位仍将其最强项视为外部评级、面向高管的报告，以及与网络保险或承保相邻的工作流，而不是无可争议的端到端工作流赢家。
