            title: 下一轮尽调的终止标准
            body: 将当前估值支撑、争议解决质量和渠道/产品经济性视为可能打破投资论点的问题：如果客户留存质量、误报修正速度或 2021 年之后的估值支撑无法直接得到证据，强行提高判断的下行风险仍然过于开放。
