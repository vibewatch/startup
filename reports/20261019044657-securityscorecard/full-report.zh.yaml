              则被定位为替代人工供应商风险工作、在不增加人员或预算的情况下扩大产出。这可以改善买方
              ROI，但也带来一个投资判断问题：更快的增长究竟来自低毛利服务交付、高毛利软件，还是两者构成正在变化。资本结构证据同样陈旧。独立市场数据页面一致认为，最近一次披露融资约为 2021 年 3 月的 $180
