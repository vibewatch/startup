  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方栈
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的市场边界，核心是网络安全评级和第三方网络风险管理，而不是整个网络安全软件市场。SecurityScorecard
              自身帮助中心称，其评级技术用于企业网络风险管理、第三方风险管理、董事会报告和网络保险承保，因而产品重点是外部态势测量与供应商风险工作流，而不只是第一方检测与响应工具。独立的 Tracxn
              文案又将供应链检测与响应及风险管理纳入这一边界；SecurityScorecard 2024 年动能公告则显示，公司正明确扩展到威胁情报、外部攻击面管理和 MAX
              托管服务等相邻市场。综合来看，核心待完成任务是帮助安全和风险团队监测供应商及外部网络态势，向董事会和交易对手证明这一态势，并在供应商、保险机构或监管机构施压时更快整改问题。

              买方证据显示这是一笔多利益相关方销售。面向客户的资料和评论来源反复将工作流锚定在第三方风险、合规、管理层报告和更快整改，而非单一 SOC 用例。买方通常是 CISO 或供应商风险负责人，日常用户是
              TPRM、GRC 或安全分析师；付款预算则可能根据工作流在安全、风险/合规、采购或网络保险之间切换。因此，细分市场图谱比单一“网络安全”分母更重要：SecurityScorecard
              似乎在变现多条相邻决策路径，它们都从外部网络证据出发，却落到不同的预算负责人和购买动作上。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
