  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 可观察到的牵引力使 SecurityScorecard 仍值得投资者关注，但估值信号冲突且经济性缺失，因此本章建议关注而非买入。
    data:
      nodes:
        - label: 商业证明存在
          detail: 官方公告显示客户规模、持续增长和产品扩张。
        - label: 增长信号真实但不完整
          detail: 收入增长和客户增长的 headline 存在，但当前 ARR、利润率和 NRR 未披露。
        - label: 估值参考相互冲突
          detail: 外部私募市场参考从 2021 年独角兽轮融资延伸到低得多的 2026 年标记。
        - label: 流动性仍在私募市场
          detail: 没有宣布 IPO 时间表，参与渠道仅限于流动性不足的私募市场场所。
        - label: 下行空间仍可能扩大
          detail: 竞争、合作伙伴依赖和集成风险可能压低定价并推迟退出。
        - label: 建议 = 严格关注
          detail: 只有在尽调或价格重置能够让增长与经济性、安全选择条款相互吻合时，才推进。
      edges:
        - from: Commercial proof exists
          to: Growth signal is real but incomplete
        - from: Growth signal is real but incomplete
          to: Valuation references conflict
        - from: Valuation references conflict
          to: Liquidity remains private
        - from: Liquidity remains private
          to: Downside can still widen
        - from: Downside can still widen
          to: Recommendation = track with discipline
    approximationNotes: 该流程是一条逻辑链，而不是加权评分模型；节点顺序表示决策顺序，不代表数值贡献。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV013
