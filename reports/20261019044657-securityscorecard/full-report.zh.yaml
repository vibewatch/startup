          - type: callout
            title: 不要把评级当作经过审计的控制结论
            body: 多个指定来源汇聚到同一个谨慎结论：SecurityScorecard 作为监测和优先级排序层具有价值，但误报和归因争议意味着，在评级驱动重大投资或供应商决策之前，仍需按客户具体情况验证。
            calloutType: risk
