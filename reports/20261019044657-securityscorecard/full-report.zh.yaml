              的核心产品仍是外部评级模型，适合分诊，但在评分变化被视为真实控制失效之前，仍需验证资产归因、服务相关性和底层证据。这一点很重要，因为指定来源池中的面向客户评论明确描述了误报、企业变更后的错误域名归因，以及评分变化背后的上下文有限。第二，公司的增长叙事越来越依赖公共部门资质、渠道合作伙伴和
              MAX / TITAN AI 产品线，这在扩大市场触达的同时，也提高了执行和认证维护风险。第三，来源池中最好的披露估值锚点仍是 2021 年 3 月 E 轮的 $1.04B
              投后估值，而当前公开材料强调增长和客户数量，却没有提供当前利润率、留存、现金烧钱或新的融资基准。
