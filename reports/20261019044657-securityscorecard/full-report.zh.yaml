      - number: '8.3'
        title: 下行情景与尽调触发条件
        blocks:
          - type: paragraph
            body: >-
              下行情景并不是产品失去相关性，而是在缺乏变现质量、流动性或下行保护证据时支付溢价。EquityZen 的风险摘要强调评级市场拥挤、定价压力、合作伙伴依赖和整合风险；公司仍没有公布 IPO
              时间表，二级市场准入也局限于私募市场流动性平台。因此，正确的尽调问题应具体到：当前 ARR、毛利率、NRR、CAC
              回本期、现金与烧钱速度、完全摊薄后的股权结构表、清算优先权、近期二级交易价格，以及按职能划分的销售生产率。如果这些数据支持溢价 SaaS
              经济性，判断可以改善；如果不支持，旧的独角兽估值就应被视为上限，而不是基准。
