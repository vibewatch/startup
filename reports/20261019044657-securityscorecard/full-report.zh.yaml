  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据显示，这是一个从评分扩展到托管服务和 AI 辅助工作流的订阅平台，但未披露每一层贡献了多少毛利。
    data:
      nodes:
        - id: signal-layer
          label: 外部风险信号
          value: 12M+ companies rated
          detail: LeadIQ 称 SecurityScorecard 的评分引擎持续评估超过 1,200 万家公司。
        - id: rating-platform
          label: 评分 + 监控平台
          value: 70,000 organizations using platform
          detail: 官方 2024 年公告称，截至 2023 年末有 70,000 家组织在使用该平台。
        - id: subscription-contract
          label: 年度订阅合同
          value: ~$2k per monitored company; ~$80k-$100k ACV
          detail: 历史上的创始人口径描述了年度订阅、预付款和企业级合同。
        - id: installed-base-expansion
          label: 存量客户扩张
          value: Larger deals; >10 quarters of growth
          detail: 近期公告将增长归因于更大交易规模、客户扩张和持续的季度增长。
        - id: service-and-ai-layers
          label: MAX + TITAN 层
          value: MAX +370%; TITAN claims 95% less manual effort
          detail: MAX 被描述为增长最快的产品，而 TITAN 被定位为工作流自动化，可在不增加人员或预算的情况下扩大产出。
        - id: underwriting-output
          label: 收入质量展望
          value: Directionally positive, mix opaque
          detail: 公开证据支持势头和扩张，但不支持当前毛利率、服务组合或经审计现金创造能力的判断。
      edges:
        - from: signal-layer
          to: rating-platform
          relationship: 互联网规模的数据流为评分和监控工作流提供输入
        - from: rating-platform
          to: subscription-contract
          relationship: 客户支付年度订阅费，监控自身和第三方安全态势
        - from: subscription-contract
          to: installed-base-expansion
          relationship: 预付合同通过增加用例、覆盖范围和更大交易规模而扩张
        - from: installed-base-expansion
          to: service-and-ai-layers
          relationship: 扩张越来越包括托管服务和 AI 工作流层
        - from: service-and-ai-layers
          to: underwriting-output
          relationship: 增长叙事改善，但当前收入组合和利润率披露仍不完整
    approximationNotes: 这是商业逻辑桥接图，不是经过测量的转化或利润率瀑布图。公开来源未披露按产品线划分的收入组合、毛利拆分或各产品的现金贡献。
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI007
      - CI008
      - CI009
      - CI012
  - id: FE001
    title: 公开可见的产品架构图
    type: stack
    summary: 公开证据描绘出一种分层运营模式：从外部数据采集开始，最终落到打包工作流和托管修复。
    data:
      layers:
        - label: 外部遥测与归因
          items:
            - 面向互联网资产发现
            - 从外部可观测安全问题中摄取信号
          modules:
            - 由外向内的方法论
            - 归因与反驳工作流
          outputs:
            - 实体关联发现
            - 更新后的评分卡
        - label: 评分与情报核心
          items:
            - 10 项因素评分
            - 总体字母等级态势信号
          modules:
            - 问题加权
            - 验证分析
          outputs:
            - 风险优先级
            - 便于董事会 / 供应商理解的态势表述
        - label: 工作流自动化层
          items:
            - TITAN Watch 可见性
            - API、RBAC、工作流集成
          modules:
            - 供应商准入与规则
          outputs:
            - 供应商监控队列
        - label: 问卷与评估层
          items:
            - TITAN Assess 问卷代理
            - 问卷回答映射
          modules:
            - 风险评分
            - 评估审核工作流
          outputs:
            - 评估工作流
            - 供应商证据包
        - label: 响应与服务层
          items:
            - TITAN Secure 响应自动化
            - MAX 托管服务
          modules:
            - 以威胁情报为依据的发现
            - 修复跟踪
          outputs:
            - 协同供应商修复
        - label: 分销与信任层
          items:
            - 公共部门 / 合作伙伴分销
            - 合规资质
          modules:
            - 供应商触达
            - 采购赋能信号
          outputs:
            - 托管式 TPRM 结果
    approximationNotes: 层级边界反映公开的产品包装与方法论，而不是 SecurityScorecard 内部的产品架构图。
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE008
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，客户旅程可能从评分驱动的发现进入更广泛的 TPRM 运营，但续约证明仍属于非公开信息。
    data:
      items:
        - label: 企业发现
          touchpoints:
            - 安全与风险团队使用评分和外部态势监控。
            - 对外定位聚焦企业网络风险、董事会报告和 TPRM。
        - label: 第三方监控
          touchpoints:
            - 客户持续监控供应商和域名。
            - 评测者称其能更早识别风险并更快跟进。
        - label: 运营采用
          touchpoints:
            - 被点名的用户提到仪表盘可见性、评分跟踪和证据上传工作流。
            - Aflac 案例强调其对供应商的可信度。
        - label: 扩展到托管工作流
          touchpoints:
            - MAX 托管服务和 HyperComply 将问卷与修复自动化。
            - 公司披露将扩张与更大交易规模和客户扩张联系起来。
        - label: 渠道与保险嵌入
          touchpoints:
            - 与 Aon 的合作将 SecurityScorecard 纳入承保和咨询推进流程。
            - 保险关系仍是最清晰的具名客户群之一。
        - label: 续约与集中度未知
          touchpoints:
            - 公开材料未披露 NRR、流失、续约或头部客户占比。
            - 扩张逻辑可见，但耐久性经济性仍只存在于尽调材料中。
    approximationNotes: 该序列是依据公开证据综合出的运营路径，不是量化漏斗。
