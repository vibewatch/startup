            body: FedRAMP / StateRAMP 进展是真实优势，但公司公开材料也依赖不断变化的采用分母和重合规定位，这会提高认证状态或披露纪律出现任何滑坡时的代价。
            calloutType: risk
            claimRefs:
              - CR004
