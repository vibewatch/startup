      - number: '3.2'
        title: 能力广度收敛速度快于定价透明度
        blocks:
          - type: paragraph
            body: >-
              公开产品证据表明，当前竞争焦点是工作流广度，而不是买方是否知道供应商网络态势。UpGuard 的对比页面主要从工作流割裂和评估单独许可两点直接攻击
              SecurityScorecard；SecurityScorecard 自己的 2025 和 2026 年材料则强调 MAX 和 TITAN
              AI，以自动化问卷、证据收集、整改协调和服务商交付来回应。定价比产品包装更难观察。SecurityScorecard 似乎提供免费层级和试用路径，但付费定价仍由销售主导；公开证据没有显示当前标价、实际企业定价，或
              Atlas、MAX 与 TITAN AI 如何捆绑。相比之下，UpGuard 公布了供应商风险产品的起始价格，因此即便企业经济性仍未披露，它在漏斗顶端的对比叙事也更清晰。
