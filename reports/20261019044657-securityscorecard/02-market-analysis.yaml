callouts:
  - calloutType: risk
    title: Broad cyber spend is not a direct SecurityScorecard TAM
    body: >-
      The macro budget backdrop is supportive, but the investable question is how much of that spend converts into recurring ratings, TPRM, questionnaire, and managed-response budgets that SecurityScorecard can win economically. Underwriting should therefore request segment revenue mix, ACV by product and customer tier, and win/loss data before relying on top-down cybersecurity spending figures in valuation work.
    claimRefs: [CM004, CM005, CM006, CM013, CM014]
