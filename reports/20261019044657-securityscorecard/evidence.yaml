evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-snapshot
    missingEvidence: Current 2026 ARR, NRR, gross margin, burn, cash balance, and exact current headcount.
    whyItMatters: >-
      The last public revenue datapoint is a 2024 keynote report, which is insufficient to underwrite current growth
      quality, operating leverage, or hiring intensity.
    diligencePath: >-
      Request board materials or audited financials covering 2025-2026 performance plus an org chart and functional
      headcount bridge.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, voting agreements, liquidation preferences, protective provisions, and any recent
      secondary transaction terms.
    whyItMatters: >-
      Founder-centric governance may be a strength or a control risk depending on formal rights, investor protections,
      and liquidity overhang.
    diligencePath: >-
      Request the current cap table, charter, investor rights agreement, board observer list, and a schedule of primary
      and secondary financings since the 2021 Series E.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: metric-denominators
    missingEvidence: >-
      A single management-defined scale bridge that reconciles customers, organizations using the platform, monitored
      entities, and rated entities.
    whyItMatters: >-
      Without denominator discipline, later chapters could overstate penetration, productivity, or valuation support by
      mixing incomparable public metrics.
    diligencePath: >-
      Ask management for a metric dictionary and a dated trend table that separately tracks paying customers, platform
      users, monitored organizations, and rated organizations.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: standalone-tam-sam-som
    missingEvidence: >-
      Management or analyst segmentation of cybersecurity ratings, TPRM software, managed TPRM/SCDR, and
      questionnaire-automation revenues by geography and customer segment.
    whyItMatters: >-
      Broad cybersecurity budget figures materially overstate attainable market if they are used as a direct valuation
      proxy for SecurityScorecard.
    diligencePath: >-
      Request management's market-sizing deck, product-line pipeline by segment, and external benchmark studies that
      isolate ratings/TPRM spend from adjacent cybersecurity categories.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner-and-pricing
    missingEvidence: >-
      Segment-level pricing, ACV, package architecture, buyer title, and attachment rates for ratings, MAX,
      questionnaire automation, and adjacent modules.
    whyItMatters: >-
      Buyer urgency is visible publicly, but valuation depends on which use cases actually monetize and who owns the
      budget.
    diligencePath: Obtain pricing sheets, recent customer proposals, and cohort-level bookings by product and customer tier.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: penetration-denominator
    missingEvidence: >-
      Reconciled KPI definitions for customers, organizations using the platform, organizations continuously rated, and
      any free-versus-paid user counts.
    whyItMatters: >-
      Adoption breadth is central to market maturity and revenue-quality analysis, but public counters are not directly
      comparable.
    diligencePath: >-
      Request a historical KPI bridge that defines each denominator and ties it to paid customer counts, retention, and
      expansion metrics.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current enterprise quotes, discount schedules, and real bundle definitions for SecurityScorecard core ratings,
      Atlas, MAX, and TITAN AI versus major alternatives.
    whyItMatters: >-
      Without realized commercial terms, the chapter can compare packaging transparency but cannot underwrite total cost
      of ownership or prove whether workflow breadth comes with better economics.
    diligencePath: >-
      Request three recent customer proposals or executed order forms covering ratings-only, ratings plus Atlas, and MAX
      or TITAN AI expansions, then normalize by vendor count and contract term.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: workflow-breadth
    missingEvidence: Win-loss analysis, attach rates, and retention by module for Atlas, MAX, TITAN AI, and channel-led deployments.
    whyItMatters: >-
      Competitive durability depends on whether SecurityScorecard converts ratings-led awareness into multi-module
      workflow adoption rather than remaining a discoverability layer beside broader suites.
    diligencePath: >-
      Ask management for cohort data on multi-product attach, module-level gross retention or expansion, and named
      replacement wins or losses against UpGuard, Bitsight, Black Kite, and RiskRecon.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP007
      - QP009
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Exact revenue and gross-margin mix across core ratings, MAX managed services, and TITAN AI.
    whyItMatters: >-
      Mix determines whether recent growth is expanding high-margin software, lower-margin services, or a blended model
      that deserves a lower multiple.
    diligencePath: >-
      Request a product-line revenue bridge with ARR, revenue, gross margin, and renewal rates for core platform, MAX,
      and TITAN.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Current list pricing, typical contract duration, realized discounting, and large-versus-small customer ASPs.
    whyItMatters: >-
      Historical founder quotes are not enough to underwrite current monetization quality or sales-efficiency
      durability.
    diligencePath: >-
      Review the current price book plus ten recent signed deals across enterprise, mid-market, and partner-led
      channels.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, burn rate, runway, debt schedule, and any project-finance or credit-facility obligations.
    whyItMatters: >-
      Without current liquidity and obligation data, the chapter cannot judge financing dependency or downside
      resilience.
    diligencePath: >-
      Obtain audited FY2025 and FY2026 financial statements, monthly cash bridge, debt agreements, and board runway
      materials.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-structure
    missingEvidence: >-
      Gross margin by product line and the service-delivery headcount or cost burden attached to MAX and TITAN
      workflows.
    whyItMatters: >-
