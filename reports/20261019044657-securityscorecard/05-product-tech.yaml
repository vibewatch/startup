callouts:
  - calloutType: insight
    title: Ratings are now the entry point, not the full product
    body: >-
      The visible platform strategy is to start with a familiar ratings core and then
      monetize progressively deeper workflow, questionnaire, and remediation layers.
    claimRefs: [CE001, CE007, CE008, CE014]
  - calloutType: risk
    title: Public ROI claims outpace independent proof
    body: >-
      SecurityScorecard publishes strong automation and breach-reduction claims, but the
      external evidence base still relies heavily on company-issued press and customer
      anecdotes rather than benchmark-quality technical audits.
    claimRefs: [CE009, CE010, CE016]
