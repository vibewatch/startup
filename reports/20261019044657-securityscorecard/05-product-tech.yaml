  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Outside-in data collection and attribution", "Discovers assets, ingests external signals, and ties findings to entities", "Internet-facing telemetry, attribution logic, and refresh cadence", "Dynamic IP ownership and partial visibility create false positives / negatives and make the model probabilistic, not deterministic"]
      - ["Ratings and factor-scoring engine", "Converts findings into 10 factor scores and an overall letter-grade posture signal", "Issue weighting, validation process, and refute workflow", "Model transparency is limited to the white paper; buyers still depend on SecurityScorecard's own scoring definitions"]
      - ["Vendor workflow layer (Watch / Assess)", "Maps scores to questionnaires, templates, review agents, and risk-scoring workflows", "Current packaging, integrations, role controls, and acquired HyperComply assessment logic", "Public docs do not specify how far automation extends before human review or what percentage of assessments can be handled end-to-end"]
      - ["Response and managed-service layer (Secure / MAX / SCDR)", "Adds threat-informed findings, remediation tracking, and vendor outreach", "Managed-service staff, partner delivery, and customer willingness to operationalize vendor response", "Outcome claims are company-issued and may prove harder to reproduce for thinner teams or narrower vendor ecosystems"]
      - ["Trust / public-sector surface", "Uses compliance credentials and government distribution channels to reduce buyer friction", "FedRAMP Ready, DHS CDM APL, AWS MSP status, and public-sector partnerships", "These are helpful procurement signals, but they are not direct proof of day-to-day data accuracy, privacy practices, or implementation quality"]
