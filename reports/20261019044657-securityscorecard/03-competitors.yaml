      - [UpGuard, "Vendor Risk plans start at USD 1,750 per month billed annually", "One license reportedly covers monitoring and assessments, with add-on expansion by product", "Enterprise discounting and realized contract values are not public", "Gives buyers a cleaner entry-point comparison and bundle story"]
      - [Bitsight, "Public pricing is not available", "Monitoring and assessment capabilities are described as separately licensed", "No public trial or realized-price evidence retained", "Procurement friction can rise as vendor coverage expands"]
      - [Black Kite, "Public pricing details are limited", "Quantification-led positioning with no retained proof of native questionnaire workflow", "May require a second TPRM product, and retained evidence does not show bundle terms", "Total cost of ownership may depend on a second workflow layer"]
      - [RiskRecon, "Public pricing is not available", "Assessment workflow appears to depend on partners rather than a single native bundle", "Retained evidence does not show trial terms or packaged workflow pricing", "Accurate scanning may still require a second vendor for end-to-end TPRM"]
    notes: Pricing evidence is mostly list-level or qualitative; this table highlights transparency and packaging structure, not realized enterprise spend.
    claimRefs: [CP006, CP007, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of workflow breadth versus distribution and trust reach, using only retained public evidence and explicit estimation notes rather than pretending to show source-reported scores.
    data:
      xAxis:
        label: Workflow breadth (ordinal 1-5)
        min: 1
        max: 5
        low: Ratings or point workflow
        high: Integrated end-to-end TPRM
        description: Estimated from retained public evidence on native assessments, automation, and workflow ownership.
        scale: ordinal
      yAxis:
        label: Distribution and trust reach (ordinal 1-5)
        min: 1
        max: 5
        low: Narrow reach
        high: Broad partner, enterprise, or underwriting reach
        description: Estimated from retained public evidence on customers, partners, channel momentum, and trust signals.
        scale: ordinal
      points:
        - label: SecurityScorecard
          x: 4.0
          y: 4.4
          detail: Ratings leader adding MAX and TITAN AI with strong partner and underwriting-adjacent proof.
        - label: Bitsight
          x: 3.6
          y: 4.1
          detail: Strong incumbent reach, but retained public evidence still describes separately licensed assessments.
        - label: UpGuard
          x: 4.6
          y: 3.4
          detail: Broadest one-console workflow story in retained evidence plus transparent starting price.
        - label: Black Kite
          x: 2.8
          y: 2.8
          detail: Quantification and external visibility are stronger than native workflow ownership in retained evidence.
        - label: RiskRecon
          x: 2.4
          y: 3.1
          detail: High scan accuracy and Mastercard backing, but partner-dependent workflow posture.
        - label: Internal build + spreadsheets
          x: 1.2
          y: 1.0
          detail: Cheapest status quo, but weak on continuous visibility and automation.
    approximationNotes: >-
      Coordinates are analyst-estimated ordinal scores synthesized from retained public evidence on workflow integration, partner reach, customer proof, and product breadth; they are not source-reported metrics and should be read as relative positioning only.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP010, CP011, CP012]
