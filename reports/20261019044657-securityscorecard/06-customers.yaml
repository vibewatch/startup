company:
  name: "SecurityScorecard"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence supports real enterprise adoption: SecurityScorecard disclosed
    2,600 customers by early 2024, an Aon collaboration referenced over 3,300
    organizations by 2026, and named proof spans insurers, Fortune accounts, and
    multi-year competitive displacements. But the public record still stops short
    of underwriting durability, because retention, churn, contract length, and
    concentration data remain undisclosed and most named proof is logos or partner
    testimony rather than quantified production case studies.
sections:
  - id: "installed-base-and-segments"
    title: "Installed base skews enterprise, TPRM, and insurance-adjacent"
    body: >-
      SecurityScorecard's public materials consistently describe a customer base
      centered on enterprise security, third-party risk management, board
      reporting, and cyber-insurance workflows rather than SMB self-serve usage.
      The clearest disclosed scale point remains the February 2024 statement that
      the company closed 2023 with 2,600 customers, representing 70% of the
      Fortune 1000, while a 2026 Aon collaboration cited trust from more than
      3,300 organizations including 70% of the Fortune 100. Those metrics are
      directionally strong but not directly comparable, because SecurityScorecard
      alternates between "customers," "organizations using the platform," and
      "organizations continuously rated," which muddies true payer count and
      makes cohort trend analysis weaker than the headline reach suggests.
    claimRefs: [CU001, CU002, CU003, CU005, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: "adoption-and-expansion-vectors"
    title: "Expansion appears to come from adjacent workflows, not just more logos"
    body: >-
      The strongest adoption signals point to a land-and-expand motion from core
      ratings into broader supply-chain risk operations. SecurityScorecard's own
      disclosures tie momentum to larger deal sizes, strong customer expansion,
      MAX managed services, and the HyperComply acquisition's questionnaire
      automation layer. The 2025 press release also describes six-figure
      competitive displacements in restaurant, logistics, and healthcare accounts,
      implying the product can win full-platform evaluations instead of only
      occupying a niche ratings seat. That said, the company discloses neither
      attach rates nor expansion ARR by module, so the public evidence shows
      product breadth and procurement wins more clearly than recurring economic
      depth.
    claimRefs: [CU004, CU006, CU008, CU009, CU014]
    tableRefs: [TU002]
  - id: "named-proof-remains-mixed"
    title: "Named proof is real, but often logo-level or partner-mediated"
    body: >-
      Named customer proof exists, especially in insurance and large-enterprise
      workflows, but much of it is still mediated through company press releases,
      partner announcements, or reviewer testimony. Aflac's third-party-risk
      manager publicly endorsed the product's data quality and support response,
      and 2022 disclosures named Chubb and NTT as customers. Aon separately
      embedded SecurityScorecard into its cyber-risk offerings, broadening the
      platform's route into underwriting and advisory workflows. Those proofs show
      genuine production relevance, yet they rarely include deployment scope,
      contract value, renewal history, or quantified customer outcomes, so they
      are stronger as adoption confirmation than as proof of customer durability.
    claimRefs: [CU004, CU005, CU006, CU007, CU013, CU016]
    tableRefs: [TU003]
  - id: "durability-and-concentration-are-the-real-gaps"
    title: "Retention, concentration, and denominator quality remain the key diligence holes"
    body: >-
      External user signal is constructive but not decisive. PeerSpot reports an
      8.2 out of 10 average rating and an enterprise-heavy audience, while named
      reviewers describe faster assessments, improved visibility, and responsive
      support. The same review corpus also highlights false positives, limited
      context behind rating changes, pricing sensitivity, and demand for better
      remediation guidance and integrations. More importantly, none of the reviewed
      public materials disclose NRR, GRR, churn, renewal rates, contract length,
      or top-customer concentration. That leaves the hardest customer questions
      unresolved: whether SecurityScorecard's expansion is efficient, whether
      managed services increase stickiness, and whether a handful of large logos
      drive a disproportionate share of revenue.
    claimRefs: [CU010, CU011, CU012, CU013, CU015]
