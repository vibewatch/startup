        - label: "Expansion into managed workflows"
          touchpoints:
            - "MAX managed services and HyperComply automate questionnaires and remediation."
            - "Company disclosures tie expansion to larger deal sizes and customer expansion."
        - label: "Channel and insurance embedding"
          touchpoints:
            - "Aon collaboration inserts SecurityScorecard into underwriting and advisory motion."
            - "Insurance relationships remain one of the clearest named customer clusters."
        - label: "Renewal and concentration unknowns"
          touchpoints:
            - "Public materials do not disclose NRR, churn, renewal, or top-customer share."
            - "Expansion logic is visible, but durability economics remain diligence-only."
    approximationNotes: "The sequence is a synthesized operating path from public evidence, not a quantified funnel."
    claimRefs: [CU002, CU006, CU009, CU011, CU015]
callouts:
  - calloutType: "strength"
    title: "Large-enterprise proof is stronger than logo wallpaper"
    body: >-
      SecurityScorecard's customer evidence clears the bar for real adoption:
      disclosed scale points, Fortune-account penetration, named insurer and
      enterprise references, and 2025 competitive displacements together show a
      product used in live procurement and vendor-risk workflows rather than a
      purely aspirational logo slide.
    claimRefs: [CU001, CU003, CU005, CU006]
  - calloutType: "risk"
    title: "Durability evidence lags adoption evidence"
    body: >-
      Public customer proof still does not show whether the installed base is
      sticky, concentrated, or economically efficient to expand. Review friction,
      mixed denominators, and missing retention metrics are the main blockers to
      underwriting customer quality with conviction.
    claimRefs: [CU010, CU012, CU015, CU016]
