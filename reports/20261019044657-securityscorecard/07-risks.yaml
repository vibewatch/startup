callouts:
  - calloutType: "risk"
    title: "Do not underwrite the score as an audited control conclusion"
    body: >-
      Multiple assigned sources converge on the same caution: SecurityScorecard is
      valuable as a monitoring and prioritization layer, but false positives and
      attribution disputes mean the letter grade still needs customer-specific
      validation before it can drive a material investment or vendor decision.
    claimRefs: ["CR008", "CR009", "CR010", "CR011"]
  - calloutType: "risk"
    title: "Regulated-growth credibility can reverse if certifications or definitions drift"
    body: >-
      FedRAMP / StateRAMP progress is a real strength, but the company's public
      materials also rely on shifting adoption denominators and compliance-heavy
      positioning, which raises the cost of any lapse in certification status or
      disclosure discipline.
    claimRefs: ["CR004", "CR007", "CR015"]
  - calloutType: "recommendation"
    title: "Kill criteria for the next diligence pass"
    body: >-
      Treat current valuation support, dispute-resolution quality, and channel /
      product economics as thesis-break issues: if customer-retention quality,
      false-positive correction speed, or post-2021 valuation support cannot be
      evidenced directly, downside risk remains too open-ended for a stronger view.
    claimRefs: ["CR006", "CR010", "CR011", "CR013"]
