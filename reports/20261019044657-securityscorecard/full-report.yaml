  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Customer growth and MAX momentum convert into premium SaaS economics with strong retention and healthy
          margins.
        - >-
          Above $1.0B is only defendable if fresh ARR, margin, and NRR data show the business deserves a premium
          cyber-software multiple.
        - The company could still face competition, services-mix drag, or exit timing risk.
        - Not supported by the current public package alone.
      - - Base
        - Growth continues but economics remain partly opaque and private liquidity stays limited.
        - >-
          A cautious $500M-$1.0B framing is more consistent with the wide gap between the 2021 round and 2026
          private-market marks.
        - >-
          Missing cap-table terms and current financials can still reduce realized returns even if headline growth
          holds.
        - Most evidence points here today.
      - - Bear
        - >-
          Growth quality disappoints or the next priced event lands closer to illiquid secondary expectations than the
          2021 unicorn round.
        - $350M-$500M aligns more closely with the lower external mark and a multiple-compression outcome.
        - Down-round risk, preference overhang, and a long hold period can impair common-equity outcomes.
        - Materially possible if diligence does not improve the fact base.
    notes: >-
      Scenario bands are coarse analytical ranges anchored on observed 2021 and 2026 external references plus
      public-comp dispersion; they are not quoted bids, audited marks, or management guidance.
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV010
      - CV012
