      - number: '1.1'
        title: Identity and current positioning
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's public materials now frame the company as an AI-native, end-to-end operating system
              for third-party risk management rather than only a security-ratings vendor. The official company page and
              homepage emphasize supply-chain detection, response, and continuous monitoring, while the March 2026 TITAN
              AI launch reinforces a platform narrative built around automation and threat-informed workflows. Identity
              facts are relatively stable: the company was founded in 2013 by Aleksandr Yampolskiy and Sam Kassoumeh,
              remains privately owned, and is publicly described by Forge as headquartered in New York. What is less
              stable is the scale language: company-controlled sources cite organizations, customers, and monitored
              entities using different denominators and time windows, so later chapters should treat them as related but
              non-interchangeable metrics.
