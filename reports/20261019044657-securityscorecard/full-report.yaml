        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally positive on demand and expansion but incomplete on quality.
              SecurityScorecard appears to have moved from a pure ratings point solution toward a broader platform with
              managed-service and AI-assisted workflows that can support larger contracts and stronger retention.
              However, the chapter cannot underwrite current revenue quality, margin trajectory, or capital adequacy
              with confidence because the available evidence is either historical, company-issued, or founder-linked and
              lacks audited statements. Customer-review evidence adds a real caution flag: package limits and
              false-positive remediation requirements suggest buyer value exists, but service and support intensity may
              matter more than a simple SaaS multiple would imply.
