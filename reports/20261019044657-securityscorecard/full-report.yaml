  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - 'Thesis: category leadership is real'
        - >-
          Official releases show 2,600 customers at 2023 year-end and more than 3,000 customers with 10-plus quarters of
          revenue growth by August 2025.
        - Fresh ARR, gross-margin, and NRR disclosure confirming that growth quality matches the headline traction.
      - - 'Thesis: product expansion can widen the value story'
        - >-
          MAX was described as driving record revenue in 2023 and growing more than 370 percent since its Q1 2024
          launch.
        - Evidence that MAX growth is recurring software-heavy revenue rather than lower-multiple services mix.
      - - 'Anti-thesis: current valuation evidence is inconsistent'
        - Forge points to a 2021 $1.04B round while PrivateMarketView marks the company near $359.5M in October 2026.
        - Transaction-level secondary prints or a fresh primary financing that reconciles the spread.
      - - 'Anti-thesis: liquidity and competition can compress returns'
        - >-
          EquityZen highlights pricing pressure, partner dependency, and operational integration risk while public
          shares are unavailable.
        - Evidence of durable pricing power, efficient go-to-market, and a clearer exit path.
    notes: >-
      The table separates the investment thesis from the anti-thesis; "current evidence" uses public observations only
      and deliberately excludes unpublished management assertions.
