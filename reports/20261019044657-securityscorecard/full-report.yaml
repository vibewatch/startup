              - CU006
              - CU009
              - CU011
              - CU015
      - number: '6.2'
        title: Expansion appears to come from adjacent workflows, not just more logos
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals point to a land-and-expand motion from core ratings into broader
              supply-chain risk operations. SecurityScorecard's own disclosures tie momentum to larger deal sizes,
              strong customer expansion, MAX managed services, and the HyperComply acquisition's questionnaire
              automation layer. The 2025 press release also describes six-figure competitive displacements in
              restaurant, logistics, and healthcare accounts, implying the product can win full-platform evaluations
              instead of only occupying a niche ratings seat. That said, the company discloses neither attach rates nor
              expansion ARR by module, so the public evidence shows product breadth and procurement wins more clearly
              than recurring economic depth.
            claimRefs:
              - CU004
              - CU006
              - CU008
              - CU009
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
