  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer stack
        blocks:
          - type: paragraph
            body: >-
              The public record supports a market boundary centered on cybersecurity ratings and third-party cyber risk
              management, not on the full cybersecurity software market. SecurityScorecard's own help-center description
              says its rating technology is used for enterprise cyber risk management, third-party risk management,
              board reporting, and cyber insurance underwriting, which frames the product around external posture
              measurement and vendor-risk workflows rather than first-party detection-and-response tooling alone.
              Independent Tracxn copy adds supply chain detection and response and risk management to that boundary,
              while SecurityScorecard's 2024 momentum release shows the company explicitly expanding into adjacent
              markets such as threat intelligence, external attack surface management, and MAX managed services. Taken
              together, the core job-to-be-done is helping security and risk teams monitor vendor and external cyber
              posture, prove that posture to boards and counterparties, and remediate issues faster when vendor,
              insurer, or regulator pressure forces action.

              Buyer evidence suggests a multi-stakeholder sale. Customer-facing and reviewer sources repeatedly anchor
              the workflow in third-party risk, compliance, leadership reporting, and faster remediation rather than a
              single SOC use case. The buyer is often a CISO or vendor-risk owner, the everyday user is a TPRM, GRC, or
              security analyst, and the payer can shift between security, risk/compliance, procurement, or
              cyber-insurance budgets depending on the workflow. The segment map therefore matters more than a single
              "cybersecurity" denominator: SecurityScorecard appears to monetize several adjacent decision paths that
              all begin with external cyber evidence but end in different budget owners and buying motions.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.2'
        title: Sizing lenses and growth drivers
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is strongest as a set of adjacent budget lenses rather than a literal
              SecurityScorecard TAM/SAM/SOM stack. A 2026 Gartner-forecast summary says global information security
              spending reaches $244.2 billion in 2026, with cloud security growing toward $32.4 billion by 2029 and
              identity access management expanding from $18.7 billion in 2024 to $29.0 billion in 2029. The same source
              also points to growth in security consulting and professional services, which matters because
              SecurityScorecard's market message increasingly blends software, managed response, and workflow
              automation. These numbers demonstrate that macro security budgets are still expanding, especially in cloud
              and governance-heavy categories that touch third-party risk.

              But those large numbers should be treated as external budget context, not as proof that SecurityScorecard
              owns a correspondingly large direct TAM. More relevant category proxies are narrower: PeerSpot places
              SecurityScorecard and BitSight in the IT Vendor Risk Management category and shows nearly equal 2026
              mindshare, while Tracxn counts hundreds of active competitors. That pairing supports a view of a real but
              contested category with buyer awareness, incumbent alternatives, and adjacent expansion room.
              SecurityScorecard's opportunity likely grows when regulatory pressure, vendor concentration, and
              AI-enabled workflow sprawl push buyers from periodic assessments toward always-on external monitoring and
              managed third-party response.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM016
      - number: '2.3'
        title: Adoption constraints, comparability limits, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Demand signals are clear, but so are the frictions. Customer and reviewer sources consistently value
              continuous monitoring, simple scoring, and better prioritization for vendor or domain risk, which supports
              the basic use case. At the same time, PeerSpot and AWS Marketplace reviewer content flag false positives,
              limited context behind score changes, better remediation guidance, and deeper GRC integration as recurring
              issues. Those shortcomings matter because the buying motion often touches regulated or procurement-heavy
              workflows where explainability and defensible remediation paths can be as important as raw signal
              generation.

              Public adoption metrics also resist simplification. SecurityScorecard materials cite over 1,000
              organizations using the ratings technology, 2,600 customers and 70,000 organizations using the platform in
              2023, and over 3,300 organizations in 2025. Those are directionally positive signals, but they are not
              interchangeable denominators, and they do not reveal segment mix, paid-seat economics, average contract
              value, or managed-services attachment. For valuation work, that means the market chapter can establish
              demand, buyer urgency, and category breadth, but not a defendable standalone SAM/SOM. Management should
              therefore be pushed for reconciled KPI definitions, product-line revenue mix, pricing architecture, and
              win-rate data before a top-down market narrative is used in underwriting.
            claimRefs:
              - CM009
              - CM013
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad cyber spend is not a direct SecurityScorecard TAM
            body: >-
              The macro budget backdrop is supportive, but the investable question is how much of that spend converts
              into recurring ratings, TPRM, questionnaire, and managed-response budgets that SecurityScorecard can win
              economically. Underwriting should therefore request segment revenue mix, ACV by product and customer tier,
              and win/loss data before relying on top-down cybersecurity spending figures in valuation work.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set now spans direct ratings peers, broader TPRM suites, and the status quo
        blocks:
          - type: paragraph
            body: >-
              The practical buyer choice is no longer just SecurityScorecard versus another ratings vendor. Retained
              evidence shows at least five credible paths: ratings-led incumbents such as Bitsight, broader cyber-risk
              suites such as UpGuard, quantification-oriented alternatives such as Black Kite, scan-accuracy specialists
              such as RiskRecon, and the internal-build/status-quo path of spreadsheets plus manual questionnaires.
              SecurityScorecard is trying to widen its frame beyond ratings into a broader supply-chain risk platform
              through MAX managed services and TITAN AI, but public competitor framing still treats it as strongest in
              outside-in ratings, executive-friendly reporting, and cyber-insurance or underwriting-adjacent workflows
              rather than as the unambiguous end-to-end workflow winner.
