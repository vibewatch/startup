  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's public product surface now spans more than a point-in-time security grade. The company
              still anchors on cybersecurity ratings for enterprise risk management, third-party risk management, board
              reporting, and cyber insurance, but it layers those ratings into questionnaire workflows, continuous
              vendor monitoring, and managed-response services. Current packaging centers on TITAN Watch, Assess, and
              Secure, while the HyperComply acquisition adds an assessments-specific knowledge base and automation
              narrative. The practical buyer workflow is therefore: discover external exposure, map the posture to
              vendor questionnaires, automate evidence collection and review, then escalate into remediation or managed
              outreach when the customer lacks staff. That is broader than a legacy scorecard product, but the public
              materials still describe the outcome mostly in company language rather than independent implementation
              metrics.
            claimRefs:
