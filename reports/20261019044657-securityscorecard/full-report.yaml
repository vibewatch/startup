      - number: '5.3'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard shows real platform maturity on commercial breadth and trust surfaces. Its own 2024
              disclosures tied the platform to 2,600 customers, 70,000 organizations using the service, FedRAMP Ready
              status, DHS CDM approved-product listing, and AWS managed-service credentials, while the 2026 press index
              shows a still-active release cadence that includes TITAN AI, the Driftnet acquisition, and public-sector
              partnerships. Customer reviews also support the value proposition: users consistently describe the
              interface and scorecards as easy to understand for vendor monitoring and leadership reporting. The main
              product risk is that the same review corpus and SecurityScorecard's own methodology document still admit
              false positives, limited explanatory context, and blind spots around internal compensating controls. That
              makes the platform easier to trust as an external risk-prioritization layer than as a complete,
              independently verified system of record.
            claimRefs:
              - CE006
              - CE010
              - CE012
              - CE013
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Ratings are now the entry point, not the full product
            body: >-
              The visible platform strategy is to start with a familiar ratings core and then monetize progressively
              deeper workflow, questionnaire, and remediation layers.
            calloutType: insight
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE014
          - type: callout
            title: Public ROI claims outpace independent proof
            body: >-
              SecurityScorecard publishes strong automation and breach-reduction claims, but the external evidence base
              still relies heavily on company-issued press and customer anecdotes rather than benchmark-quality
              technical audits.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Installed base skews enterprise, TPRM, and insurance-adjacent
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's public materials consistently describe a customer base centered on enterprise
              security, third-party risk management, board reporting, and cyber-insurance workflows rather than SMB
              self-serve usage. The clearest disclosed scale point remains the February 2024 statement that the company
              closed 2023 with 2,600 customers, representing 70% of the Fortune 1000, while a 2026 Aon collaboration
              cited trust from more than 3,300 organizations including 70% of the Fortune 100. Those metrics are
              directionally strong but not directly comparable, because SecurityScorecard alternates between
              "customers," "organizations using the platform," and "organizations continuously rated," which muddies
              true payer count and makes cohort trend analysis weaker than the headline reach suggests.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
