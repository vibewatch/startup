      - number: '3.3'
        title: Distribution and trust posture are durable strengths, but only if workflow attach keeps rising
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's moat is strongest where buyers care about a recognizable ratings brand, partner
              validation, and distribution into adjacent decision points such as cyber underwriting, MSSP service
              delivery, and board reporting. The Aon collaboration puts SecurityScorecard's outside-in findings inside a
              risk-transfer and underwriting context, while the 2025 company release points to 124% year-over-year
              channel-sourced pipeline growth and MAX as the fastest-growing product. That matters because broader TPRM
              suites and incumbent peers can compete on similar monitoring and ratings narratives. If SecurityScorecard
              cannot convert channel reach and ratings credibility into higher attach rates for workflow products, then
              ratings may become the discovery wedge while broader platforms win the operating system layer.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: The clearest displacement risk is “good-enough ratings plus tighter workflow economics”
        blocks:
          - type: paragraph
            body: >-
              The most credible adverse pattern in public evidence is not that SecurityScorecard lacks product
              relevance; it is that buyers can plausibly choose a platform that feels more operationally unified or more
              procurement-friendly. UpGuard's competitor framing repeatedly highlights separate modules and purchasing
              complexity for SecurityScorecard and Bitsight, while AWS/G2/PeerSpot reviews praise SecurityScorecard's
              clarity but still describe false positives, wrong-domain attribution, and limited context behind rating
              changes. That combination matters because it narrows the perceived switching cost from ratings incumbents
              to suites that combine monitoring, questionnaires, and automation in one console. Competitive diligence
              should therefore test actual bundle economics, workflow attach, and win-loss reasons rather than assuming
              brand leadership alone is a durable moat.
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP008
              - CP009
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: SecurityScorecard's best public edge is trust-layer distribution, not transparent pricing
            body: >-
              The public record shows a recognizable ratings brand, underwriting relevance, and growing
              channel/service-provider distribution, which can keep SecurityScorecard in more evaluations than a pure
              point product. That edge looks most durable when MAX and TITAN AI are sold as higher-attach workflows
              rather than as adjacent add-ons.
            calloutType: strength
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: callout
            title: Ratings-first vendors remain exposed to workflow-bundle attacks
            body: >-
              Public competitor and customer evidence points to the same pressure point: separate modules, opaque
              pricing, and validation overhead make it easier for a broader suite to argue for lower-friction ownership.
              If buyers view ratings as necessary but not sufficient, SecurityScorecard must win on attach and operating
              leverage, not just category recognition.
            calloutType: risk
            claimRefs:
              - CP002
              - CP007
              - CP009
