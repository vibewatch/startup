          - type: callout
            title: The core diligence question is attach, not awareness
            body: >-
              SecurityScorecard likely has enough brand and partner reach to keep sourcing new pipeline, but public
              evidence is much weaker on how often that pipeline converts into multi-module TPRM adoption. The
              investment-relevant proof point is whether ratings customers expand into Atlas, MAX, TITAN AI, and
              channel-led deployments at attractive retention and margin.
