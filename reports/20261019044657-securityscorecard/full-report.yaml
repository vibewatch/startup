              - CU005
              - CU008
              - CU010
      - number: '6.3'
        title: Named proof is real, but often logo-level or partner-mediated
        blocks:
          - type: paragraph
            body: >-
              Named customer proof exists, especially in insurance and large-enterprise workflows, but much of it is
              still mediated through company press releases, partner announcements, or reviewer testimony. Aflac's
              third-party-risk manager publicly endorsed the product's data quality and support response, and 2022
              disclosures named Chubb and NTT as customers. Aon separately embedded SecurityScorecard into its
              cyber-risk offerings, broadening the platform's route into underwriting and advisory workflows. Those
              proofs show genuine production relevance, yet they rarely include deployment scope, contract value,
              renewal history, or quantified customer outcomes, so they are stronger as adoption confirmation than as
              proof of customer durability.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
              - CU016
      - number: '6.4'
        title: Retention, concentration, and denominator quality remain the key diligence holes
        blocks:
          - type: paragraph
            body: >-
              External user signal is constructive but not decisive. PeerSpot reports an 8.2 out of 10 average rating
              and an enterprise-heavy audience, while named reviewers describe faster assessments, improved visibility,
              and responsive support. The same review corpus also highlights false positives, limited context behind
              rating changes, pricing sensitivity, and demand for better remediation guidance and integrations. More
              importantly, none of the reviewed public materials disclose NRR, GRR, churn, renewal rates, contract
              length, or top-customer concentration. That leaves the hardest customer questions unresolved: whether
              SecurityScorecard's expansion is efficient, whether managed services increase stickiness, and whether a
              handful of large logos drive a disproportionate share of revenue.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large-enterprise proof is stronger than logo wallpaper
            body: >-
              SecurityScorecard's customer evidence clears the bar for real adoption: disclosed scale points,
              Fortune-account penetration, named insurer and enterprise references, and 2025 competitive displacements
              together show a product used in live procurement and vendor-risk workflows rather than a purely
              aspirational logo slide.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
          - type: callout
            title: Durability evidence lags adoption evidence
            body: >-
              Public customer proof still does not show whether the installed base is sticky, concentrated, or
              economically efficient to expand. Review friction, mixed denominators, and missing retention metrics are
              the main blockers to underwriting customer quality with conviction.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Highest-severity risks cluster around model trust, regulated growth, and stale capital signals
        blocks:
          - type: paragraph
            body: >-
              The evidence points to three risks that matter more than routine execution noise. First,
              SecurityScorecard's core product remains an outside-in rating model, which is useful for triage but still
              requires validation of asset attribution, service relevance, and underlying evidence before a score change
              can be treated as a true control failure. That matters because customer-facing reviews in the assigned
              pool explicitly describe false positives, wrong-domain attribution after corporate changes, and limited
              context behind rating changes. Second, the company's growth narrative increasingly depends on
              public-sector credentials, channel partners, and the MAX / TITAN AI product line, which raises execution
              and certification-maintenance risk even as it expands market reach. Third, the best disclosed valuation
              anchor in the pool is still the March 2021 Series E at a $1.04B post-money mark, while current public
              materials emphasize growth and customer counts rather than current margins, retention, cash burn, or a new
              financing benchmark.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory posture is a strength, but it also creates concentration and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's public evidence shows real progress in government-grade controls: the company said it
              achieved FedRAMP Ready in 2023 and by August 2025 said it was StateRAMP Ready and re-certified as FedRAMP
              Ready. Those credentials help explain traction with regulated customers and support the thesis that
              public-sector and compliance-heavy use cases are strategically important. The same evidence creates a risk
              surface, however, because a meaningful part of the company's positioning now depends on maintaining those
              designations, preserving approved-product-list access, and converting compliance credibility into durable
              revenue rather than point-in-time announcements. Disclosure quality is also uneven: public materials use
              different denominators for platform scale, customers, organizations using the platform, and entities
              rated, so investor diligence cannot treat those figures as interchangeable evidence of monetized adoption.
              The assigned pool does not provide company-specific litigation, privacy-enforcement, or incident-record
              evidence, so legal and privacy downside remains a material diligence gap rather than a cleared risk.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR013
              - CR015
              - CR016
      - number: '7.3'
        title: The product's value proposition also defines its operational trust risk
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's operating model is strongest when customers use it as a continuous monitoring and
              prioritization layer rather than as an automated approval decision. FortifyData's independent explanation
              says the platform is an outside-in model and specifically warns that a rating cannot, by itself, confirm
              internal-control design, service impact, or incident scope. That caution is reinforced by customer proof
              in the assigned pool: one G2 reviewer said external-only assessments can generate false positives and
              require more validation, while a verified AWS customer said an acquisition caused vulnerabilities from
              unrelated portfolio companies to be attributed to its score until disputed. PeerSpot's 2026 comparison
              adds softer but still relevant friction, citing demand for stronger remediation guidance, better
              customization, and better GRC integration. Together, these signals imply the key operating risk is not
              platform instability; it is erosion of customer trust if attribution disputes, weak explanations, or
              shallow workflows make the score harder to operationalize inside mature TPRM programs.
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: >-
          Growth increasingly runs through partners, adjacent products, and a valuation story that has not been
          refreshed publicly
        blocks:
          - type: paragraph
            body: >-
              The 2025 company release frames channel expansion, service-provider enablement, and MAX adoption as core
              growth engines, including a 124% year-over-year increase in channel-sourced pipeline and more than 370%
              growth for MAX since its Q1 2024 launch. Earlier company evidence also highlighted an 80% expansion in the
              partner marketplace to more than 90 integration partners. Those disclosures support scale, but they also
              signal dependency: if partner productivity slows, if MAX economics disappoint, or if a large share of
              growth comes from services-heavy motions that dilute software margins, the headline customer-growth story
              could weaken quickly. The capital side is comparably under-documented. Forge still points to the March
              2021 Series E at a $1.04B post-money valuation and labels recent market activity as limited, while the
              assigned public sources do not disclose current ARR, gross margin, burn, cash, or NRR. That leaves
              investors exposed to valuation-compression and efficiency risk without enough public evidence to
              underwrite downside precisely.
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite the score as an audited control conclusion
            body: >-
              Multiple assigned sources converge on the same caution: SecurityScorecard is valuable as a monitoring and
              prioritization layer, but false positives and attribution disputes mean the letter grade still needs
              customer-specific validation before it can drive a material investment or vendor decision.
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: callout
            title: Regulated-growth credibility can reverse if certifications or definitions drift
            body: >-
              FedRAMP / StateRAMP progress is a real strength, but the company's public materials also rely on shifting
              adoption denominators and compliance-heavy positioning, which raises the cost of any lapse in
              certification status or disclosure discipline.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR015
          - type: callout
            title: Kill criteria for the next diligence pass
            body: >-
              Treat current valuation support, dispute-resolution quality, and channel / product economics as
              thesis-break issues: if customer-retention quality, false-positive correction speed, or post-2021
              valuation support cannot be evidenced directly, downside risk remains too open-ended for a stronger view.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation should stay price-sensitive rather than company-quality-sensitive. SecurityScorecard
              still looks like a real category platform, with official releases showing customer expansion,
              multi-quarter growth, and a fast-scaling MAX product layer, but those proof points do not close the
              underwriting gap around present-day economics or entry price. Independent market references also do not
              converge: one source keeps the company in private, no-IPO limbo while another points to the 2021 unicorn
              round and a third anchors to a much lower 2026 private-market mark. That mix supports a track stance with
              medium confidence and a high risk rating until the company provides fresh financials and transaction-level
              valuation evidence.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
      - number: '8.2'
        title: Financing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The observable financing record is directionally encouraging but not clean enough to set a firm price.
              Forge reports a March 2021 $180 million Series E at a $1.04 billion post-money valuation, while
              PrivateMarketView shows an approximately $359.5 million October 2026 mark and explicitly says no secondary
              trade or institutional fund mark has moved that figure since the June 2019 round. Those references are too
              far apart to treat either as fair value on their own. Meanwhile, public cybersecurity comparables still
              trade across a very wide range of forward revenue multiples, which means category membership alone cannot
              defend a premium entry price without current ARR, margin, and retention data.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.3'
        title: Downside case and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              The downside case is not about product irrelevance; it is about paying a premium without enough evidence
              on monetization quality, liquidity, or downside protection. EquityZen's risk summary highlights a crowded
              ratings market, pricing pressure, partner dependency, and integration risk, while the company still has no
              announced IPO timeline and secondary access is limited to private-market liquidity venues. The right
              diligence asks are therefore concrete: current ARR, gross margin, NRR, CAC payback, cash and burn, the
              fully diluted cap table, liquidation preferences, recent secondary trade prints, and sales-productivity
              data by function. If those data points support premium SaaS economics, the view can improve; if they do
              not, the old unicorn mark becomes an upper bound rather than a baseline.
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline matters more than category appeal
            body: >-
              SecurityScorecard can still earn an invest recommendation, but only after current economics and valuation
              mechanics are visible enough to underwrite a return at a specific entry price.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV013
              - CV014
          - type: callout
            title: The old unicorn round is not a safe default anchor
            body: >-
              Public evidence now includes both a 2021 billion-dollar round reference and a much lower 2026
              private-market mark, so entering at the old headline valuation would import avoidable markdown risk.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
