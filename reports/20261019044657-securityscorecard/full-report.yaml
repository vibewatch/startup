      - number: '5.2'
        title: Operating model and architecture
        blocks:
          - type: paragraph
            body: >-
              The technical operating model remains rooted in an outside-in data collection and attribution engine
              rather than intrusive internal telemetry. SecurityScorecard's methodology describes non-intrusive
              assessment, daily scanning for paid customers and followed vendors, weekly scanning for remaining
              scorecards, and a scoring model organized into 10 factor scores. That public architecture is then wrapped
              in higher-level workflow layers: Ratings and TPRM remain the base, TITAN AI packages visibility,
              assessment automation, and remediation into Watch, Assess, and Secure, and the 2024 SCDR / MAX positioning
              adds service-delivery and vendor-response processes on top. The architecture is coherent for the TPRM use
              case, but the company still asks buyers to trust company-claimed performance improvements rather than
              fully disclosed benchmark methodology or external technical audits.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
