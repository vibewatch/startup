      - number: '4.3'
        title: Cost structure and capital needs
        blocks:
          - type: paragraph
            body: >-
              The clearest public clue on cost structure is that SecurityScorecard is no longer just packaging passive
              ratings: MAX is described as managed services, and TITAN AI is pitched as replacing manual vendor-risk
              work while scaling output without more staff or budget. That can improve buyer ROI, but it also raises an
              underwriting question about whether faster growth is coming from lower-margin service delivery,
              higher-margin software, or a changing mix of both. Capital-structure evidence is also dated. Independent
              market-data pages agree that the last disclosed financing was about $180 million in March 2021 and that
              cumulative funding is roughly $293 million, but the assigned public evidence still does not disclose
              current cash, debt, burn, or runway.
            claimRefs:
