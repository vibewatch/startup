    title: "Founder continuity plus deep investor backing"
    body: >-
      The company still presents as founder-led, with continuity from both
      co-founders and a durable venture/backer list that spans specialist cyber,
      growth, and strategic investors.
    claimRefs: ["CO001", "CO006", "CO011", "CO012"]
