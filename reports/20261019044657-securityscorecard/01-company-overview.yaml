company:
  name: "SecurityScorecard"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    SecurityScorecard remains a founder-led private cyber-risk platform that has
    expanded from security ratings into AI-driven third-party risk management,
    with official 2026 materials claiming 3,300+ organizations, 70% of the
    Fortune 100, and 12M+ monitored or rated organizations. The latest visible
    priced round in the assigned pool is still the March 2021 Series E at a
    $1.04B post-money valuation, while current ARR, precise headcount, exact
    board rights, and a single current customer denominator remain unresolved.
sections:
  - id: "identity-and-positioning"
    title: "Identity and current positioning"
    body: >-
      SecurityScorecard's public materials now frame the company as an
      AI-native, end-to-end operating system for third-party risk management
      rather than only a security-ratings vendor. The official company page and
      homepage emphasize supply-chain detection, response, and continuous
      monitoring, while the March 2026 TITAN AI launch reinforces a platform
      narrative built around automation and threat-informed workflows. Identity
      facts are relatively stable: the company was founded in 2013 by
      Aleksandr Yampolskiy and Sam Kassoumeh, remains privately owned, and is
      publicly described by Forge as headquartered in New York. What is less
      stable is the scale language: company-controlled sources cite
      organizations, customers, and monitored entities using different
      denominators and time windows, so later chapters should treat them as
      related but non-interchangeable metrics.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO007", "CO008", "CO013", "CO016"]
    tableRefs: ["TO001"]
  - id: "leadership-governance-and-stakeholders"
    title: "Leadership, governance, and stakeholder map"
    body: >-
      Leadership continuity is a relative strength: the founders are still the
      central public faces of the business, and third-party executive data shows
      a broader functional bench spanning finance, product, technology, legal,
      people, and sales. Governance, however, still appears founder-centered.
      Founderpath's account of Aleksandr Yampolskiy's 2024 keynote says he kept
      board control through financing rounds and negotiated hard on liquidation
      preferences and board composition, which raises the importance of
      diligence on formal control rights, succession planning, and the practical
      influence of non-founder investors. The stakeholder picture is credible
      but incomplete in the assigned pool: public sources clearly show a deep
      venture syndicate and strategic names such as Moody's, but not the current
      full board roster, voting agreements, or any recent secondary buyers.
    claimRefs: ["CO001", "CO002", "CO006", "CO011", "CO012"]
    tableRefs: ["TO002", "TO003"]
  - id: "capitalization-scale-and-milestones"
    title: "Capitalization, scale disclosures, and milestones"
    body: >-
      The strongest public financing evidence in the assigned pool still points
      to a mature private company whose last visible priced round was the March
      2021 Series E. Forge and Founderpath together support a total funding base
      around $293M and a last visible post-money valuation around $1B, but that
      financing marker is stale for a refresh run in late 2026. Operationally,
      the company shows continued product and commercial momentum: the February
      2024 press release claimed 2,600 customers and 70,000 organizations using
      the platform, the 2024 founder keynote reported $130-140M ARR and $200M
      in the bank, and the March 2026 TITAN AI launch shows the company
      repositioning around automation. The main caveat is execution quality:
      customer reviews still mention false positives and wrong-domain
      attribution, so buyers likely need workflow validation, not just a strong
      category narrative.
    claimRefs: ["CO005", "CO007", "CO009", "CO010", "CO013", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
