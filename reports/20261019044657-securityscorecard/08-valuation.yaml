schemaVersion: "report-v2"
artifact: valuation
slug: securityscorecard
runDate: 2026-10-19
company:
  name: SecurityScorecard
chapter:
  number: 8
  title: Valuation
  summary: >-
    SecurityScorecard has enough observable commercial traction to remain investable, but the public package does not justify underwriting the old unicorn price today. Independent market references conflict materially on current value, liquidity remains private and illiquid, and key underwriting inputs such as ARR, margin, NRR, burn, and cap-table terms are still missing, so the evidence-supported stance is track with strict price discipline.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation should stay price-sensitive rather than company-quality-sensitive. SecurityScorecard still looks like a real category platform, with official releases showing customer expansion, multi-quarter growth, and a fast-scaling MAX product layer, but those proof points do not close the underwriting gap around present-day economics or entry price. Independent market references also do not converge: one source keeps the company in private, no-IPO limbo while another points to the 2021 unicorn round and a third anchors to a much lower 2026 private-market mark. That mix supports a track stance with medium confidence and a high risk rating until the company provides fresh financials and transaction-level valuation evidence.
    claimRefs: [CV001, CV004, CV006, CV007, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-comparable-context
    title: Financing and comparable context
    body: >-
      The observable financing record is directionally encouraging but not clean enough to set a firm price. Forge reports a March 2021 $180 million Series E at a $1.04 billion post-money valuation, while PrivateMarketView shows an approximately $359.5 million October 2026 mark and explicitly says no secondary trade or institutional fund mark has moved that figure since the June 2019 round. Those references are too far apart to treat either as fair value on their own. Meanwhile, public cybersecurity comparables still trade across a very wide range of forward revenue multiples, which means category membership alone cannot defend a premium entry price without current ARR, margin, and retention data.
    claimRefs: [CV002, CV003, CV004, CV008, CV012]
    tableRefs: [TV002]
  - id: downside-case-and-diligence-triggers
    title: Downside case and diligence triggers
    body: >-
      The downside case is not about product irrelevance; it is about paying a premium without enough evidence on monetization quality, liquidity, or downside protection. EquityZen's risk summary highlights a crowded ratings market, pricing pressure, partner dependency, and integration risk, while the company still has no announced IPO timeline and secondary access is limited to private-market liquidity venues. The right diligence asks are therefore concrete: current ARR, gross margin, NRR, CAC payback, cash and burn, the fully diluted cap table, liquidation preferences, recent secondary trade prints, and sales-productivity data by function. If those data points support premium SaaS economics, the view can improve; if they do not, the old unicorn mark becomes an upper bound rather than a baseline.
    claimRefs: [CV001, CV009, CV010, CV011, CV013, CV014]
    tableRefs: [TV003]
