  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Current ARR, gross margin, NRR, CAC payback, burn, cash balance, and audited or board-quality operating statements.
      whyItMatters: Those metrics determine whether customer growth and product expansion deserve a premium software multiple or a discounted private-market entry.
      diligencePath: Request the latest board deck or audited financial package with cohort retention, margin bridge, and cash-flow detail.
      relatedQuestionRefs: [QV001, QV008]
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-liquidity
      missingEvidence: Fully diluted cap table, liquidation preferences, protective provisions, recent secondary trade prints, and common-versus-preferred pricing.
      whyItMatters: Entry price and liquidation stack mechanics can change return outcomes far more than headline enterprise value on an illiquid private asset.
      diligencePath: Obtain the current cap table, financing documents, and any recent secondary transaction data before setting price or position size.
      relatedQuestionRefs: [QV002, QV008]
    - type: missing-source
      severity: material
      topic: sales-efficiency
      missingEvidence: Headcount by function, quota-carrying rep count, new ARR per sales-and-marketing dollar, and channel-versus-direct productivity.
      whyItMatters: Without sales-efficiency evidence, it is difficult to tell whether recent growth is scalable or margin-dilutive at the next stage.
      diligencePath: Ask management for org-level headcount, productivity dashboards, and channel attribution for new pipeline and closed ARR.
      relatedQuestionRefs: [QV007, QV008]
