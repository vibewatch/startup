      - ["Anti-thesis: current valuation evidence is inconsistent", "Forge points to a 2021 $1.04B round while PrivateMarketView marks the company near $359.5M in October 2026.", "Transaction-level secondary prints or a fresh primary financing that reconciles the spread."]
      - ["Anti-thesis: liquidity and competition can compress returns", "EquityZen highlights pricing pressure, partner dependency, and operational integration risk while public shares are unavailable.", "Evidence of durable pricing power, efficient go-to-market, and a clearer exit path."]
    notes: >-
      The table separates the investment thesis from the anti-thesis; "current evidence" uses public observations only and deliberately excludes unpublished management assertions.
    claimRefs: [CV002, CV003, CV004, CV006, CV007, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Customer growth and MAX momentum convert into premium SaaS economics with strong retention and healthy margins.", "Above $1.0B is only defendable if fresh ARR, margin, and NRR data show the business deserves a premium cyber-software multiple.", "The company could still face competition, services-mix drag, or exit timing risk.", "Not supported by the current public package alone."]
      - ["Base", "Growth continues but economics remain partly opaque and private liquidity stays limited.", "A cautious $500M-$1.0B framing is more consistent with the wide gap between the 2021 round and 2026 private-market marks.", "Missing cap-table terms and current financials can still reduce realized returns even if headline growth holds.", "Most evidence points here today."]
      - ["Bear", "Growth quality disappoints or the next priced event lands closer to illiquid secondary expectations than the 2021 unicorn round.", "$350M-$500M aligns more closely with the lower external mark and a multiple-compression outcome.", "Down-round risk, preference overhang, and a long hold period can impair common-equity outcomes.", "Materially possible if diligence does not improve the fact base."]
    notes: >-
      Scenario bands are coarse analytical ranges anchored on observed 2021 and 2026 external references plus public-comp dispersion; they are not quoted bids, audited marks, or management guidance.
    claimRefs: [CV003, CV004, CV009, CV010, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Observable traction keeps SecurityScorecard investable, but conflicting valuation signals and missing economics push the chapter to track rather than buy.
    data:
      nodes:
        - label: Commercial proof exists
          detail: Official releases show customer scale, continued growth, and product expansion.
        - label: Growth signal is real but incomplete
          detail: Revenue-growth and customer-growth headlines exist, but current ARR, margin, and NRR are undisclosed.
        - label: Valuation references conflict
          detail: External private-market references span from a 2021 unicorn round to a much lower 2026 mark.
        - label: Liquidity remains private
          detail: No announced IPO timeline exists and access is limited to illiquid private-market venues.
        - label: Downside can still widen
          detail: Competition, partner dependency, and integration risk can pressure pricing and exit timing.
        - label: Recommendation = track with discipline
          detail: Advance only if diligence or price resets reconcile growth with economics and security selection terms.
      edges:
        - from: Commercial proof exists
          to: Growth signal is real but incomplete
        - from: Growth signal is real but incomplete
          to: Valuation references conflict
        - from: Valuation references conflict
          to: Liquidity remains private
        - from: Liquidity remains private
          to: Downside can still widen
        - from: Downside can still widen
          to: Recommendation = track with discipline
    approximationNotes: >-
      The flow is a logic chain rather than a weighted scoring model; node order shows decision sequence, not numeric contribution.
    claimRefs: [CV001, CV004, CV006, CV007, CV009, CV010, CV013]
callouts:
  - calloutType: recommendation
    title: Price discipline matters more than category appeal
    body: >-
      SecurityScorecard can still earn an invest recommendation, but only after current economics and valuation mechanics are visible enough to underwrite a return at a specific entry price.
    claimRefs: [CV004, CV013, CV014]
  - calloutType: risk
    title: The old unicorn round is not a safe default anchor
    body: >-
      Public evidence now includes both a 2021 billion-dollar round reference and a much lower 2026 private-market mark, so entering at the old headline valuation would import avoidable markdown risk.
    claimRefs: [CV002, CV003, CV004]
