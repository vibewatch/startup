company:
  name: SecurityScorecard
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a subscription-led cyber-risk platform with credible
    expansion vectors in MAX managed services and TITAN AI, but the underwriting
    record is still anchored to stale or founder-linked revenue disclosures. The
    financial picture looks more like expanding enterprise SaaS with a growing
    services layer than a clean pure-software model, and the biggest blockers are
    missing current gross margin, cash, burn, and product-line mix disclosures.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      The public record still points to a subscription business built around
      continuous external security monitoring and vendor-risk workflows, with
      monetization tied both to annual platform contracts and to the breadth of
      organizations or vendors a customer monitors. Historical founder comments
      remain the clearest public pricing evidence: they frame SecurityScorecard as
      enterprise SaaS with upfront annual billing, per-company pricing logic, and
      enterprise contracts that scale well above a simple seat model. More recent
      company disclosures show customer-count growth and larger deal sizes, but
      they stop short of breaking out how much of current revenue comes from the
      core ratings platform versus newer service and AI layers. That means the
      top-line direction is visible, while the revenue-mix quality needed for
      underwriting is not.
    claimRefs: [CI001, CI002, CI003, CI006, CI008, CI010, CI011, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: sales-efficiency-and-expansion
    title: Sales efficiency and expansion proxies
    body: >-
      SecurityScorecard's public efficiency signals are encouraging but old.
      Historical founder commentary describes sub-one-year payback, better-than-3x
      LTV/CAC, gross logo churn below 10%, and roughly 115% net revenue retention,
      which is the profile of a sticky enterprise product with room for expansion.
      More recent company releases suggest the expansion engine has shifted toward
      product bundling and service layers: larger deal sizes, more than ten
      consecutive quarters of revenue growth, and very rapid MAX growth all imply
      that growth is not relying solely on new-logo acquisition. What is missing
      is the current conversion math by motion or channel, especially because
      public evidence does not disclose current sales productivity, CAC by segment,
      or realized pricing by module.
    claimRefs: [CI003, CI004, CI005, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: cost-structure-and-capital-needs
    title: Cost structure and capital needs
    body: >-
      The clearest public clue on cost structure is that SecurityScorecard is no
      longer just packaging passive ratings: MAX is described as managed services,
      and TITAN AI is pitched as replacing manual vendor-risk work while scaling
      output without more staff or budget. That can improve buyer ROI, but it also
      raises an underwriting question about whether faster growth is coming from
      lower-margin service delivery, higher-margin software, or a changing mix of
      both. Capital-structure evidence is also dated. Independent market-data
      pages agree that the last disclosed financing was about $180 million in
      March 2021 and that cumulative funding is roughly $293 million, but the
      assigned public evidence still does not disclose current cash, debt, burn,
      or runway.
    claimRefs: [CI007, CI012, CI013, CI014, CI016]
  - id: verdict-and-diligence-blockers
    title: Verdict and diligence blockers
    body: >-
      The financial verdict is directionally positive on demand and expansion but
      incomplete on quality. SecurityScorecard appears to have moved from a pure
      ratings point solution toward a broader platform with managed-service and
      AI-assisted workflows that can support larger contracts and stronger
      retention. However, the chapter cannot underwrite current revenue quality,
      margin trajectory, or capital adequacy with confidence because the available
      evidence is either historical, company-issued, or founder-linked and lacks
      audited statements. Customer-review evidence adds a real caution flag:
      package limits and false-positive remediation requirements suggest buyer
      value exists, but service and support intensity may matter more than a
      simple SaaS multiple would imply.
    claimRefs: [CI008, CI010, CI011, CI013, CI014, CI015, CI016]
