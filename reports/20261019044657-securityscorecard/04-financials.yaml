    claimRefs: [CI004, CI005, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      The public evidence shows a subscription platform that expands from ratings
      into managed services and AI-assisted workflows, but it does not disclose
      how much gross profit each layer contributes.
    data:
      nodes:
        - id: signal-layer
          label: External risk signals
          value: "12M+ companies rated"
          detail: "LeadIQ says SecurityScorecard's ratings engine continuously evaluates more than 12 million companies."
        - id: rating-platform
          label: Ratings + monitoring platform
          value: "70,000 organizations using platform"
          detail: "Official 2024 release says 70,000 organizations were using the platform at year-end 2023."
        - id: subscription-contract
          label: Annual subscription contract
          value: "~$2k per monitored company; ~$80k-$100k ACV"
          detail: "Historical founder commentary describes annual subscriptions, upfront payment, and enterprise-sized contracts."
        - id: installed-base-expansion
          label: Installed-base expansion
          value: "Larger deals; >10 quarters of growth"
          detail: "Recent releases tie growth to larger deal sizes, customer expansion, and continued quarterly growth."
        - id: service-and-ai-layers
          label: MAX + TITAN layers
          value: "MAX +370%; TITAN claims 95% less manual effort"
          detail: "MAX is described as the fastest-growing offering, while TITAN is positioned as workflow automation that can scale output without more staff or budget."
        - id: underwriting-output
          label: Revenue quality outlook
          value: "Directionally positive, mix opaque"
          detail: "Public evidence supports momentum and expansion, but not current gross margin, services mix, or audited cash generation."
      edges:
        - from: signal-layer
          to: rating-platform
          relationship: "Internet-scale data feeds the score and monitoring workflow"
        - from: rating-platform
          to: subscription-contract
          relationship: "Customers pay annual subscriptions to monitor their own and third-party posture"
        - from: subscription-contract
          to: installed-base-expansion
          relationship: "Upfront contracts expand through added use cases, coverage, and larger deals"
        - from: installed-base-expansion
          to: service-and-ai-layers
          relationship: "Expansion increasingly includes managed-service and AI workflow layers"
        - from: service-and-ai-layers
          to: underwriting-output
          relationship: "Growth narrative improves, but current revenue-mix and margin disclosure remains incomplete"
    approximationNotes: >-
      This is a commercial logic bridge, not a measured conversion or margin
      waterfall. Public sources do not disclose product-line revenue mix, gross
      profit split, or cash contribution by offering.
    claimRefs: [CI001, CI003, CI006, CI007, CI008, CI009, CI012]
callouts:
  - calloutType: insight
    title: Expansion is visible before mix is visible
    body: >-
      The public record consistently points to SecurityScorecard expanding beyond
      core ratings into bigger contracts, managed services, and AI-driven
      workflows. That supports a platform-upgrade thesis, but it does not yet
      prove how much of present revenue or gross profit comes from each layer.
    claimRefs: [CI003, CI006, CI007, CI008, CI009, CI012]
  - calloutType: risk
    title: Support intensity may matter more than headline ARR
    body: >-
      Customer-review evidence says packaging can be constrained by monitored
      domains or vendors and that false positives still require validation work.
      That is compatible with a valuable product, but it also suggests delivery
      and support effort could weigh on margin quality if managed-service and AI
      layers grow faster than pure software usage.
    claimRefs: [CI012, CI015, CI016]
  - calloutType: recommendation
    title: Do not underwrite current cash generation from public evidence alone
    body: >-
      The assigned evidence supports demand momentum and confirms that the last
      disclosed financing was in 2021, but it does not provide current audited
      cash, burn, debt, or gross-margin data. Those items should be treated as a
      precondition for any valuation or downside-case work.
    claimRefs: [CI010, CI011, CI013, CI014]
