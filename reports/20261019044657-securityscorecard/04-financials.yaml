      - ["Net revenue retention", "~115% (2018 founder interview)", "Medium / historical", "Supports expansion-driven growth rather than pure logo dependence", "Provide current NRR by cohort, product, and segment"]
      - ["CAC payback", "<12 months (2018 founder interview)", "Medium / historical", "Indicates efficient annual-billing economics if still true", "Provide current blended and new-logo payback by sales motion"]
      - ["LTV / CAC", ">3x (2018 founder interview)", "Medium / historical", "Would justify efficient growth if based on current retention and margin", "Provide calculation inputs, contribution margin basis, and cohort assumptions"]
