  topStrengths:
  - Advanced public FAA and flight-test evidence compared with most autonomy peers.
  - Certification-first retrofit strategy on an existing cargo aircraft lowers execution complexity versus greenfield airframes.
  - Named commercial route plan and named Air Force customer provide real operating proof instead of slide-only partnerships.
  - Large 2026 financing gives the company time to pursue certification and deployment milestones.
  topRisks:
  - Certification and route timing remain the single biggest determinants of value.
  - Public financial disclosure is thin, leaving revenue quality, margin path, and burn unknown.
  - Customer proof remains concentrated in a small number of counterparties and pilots.
  - Current valuation already assumes a meaningful portion of category-leader success.
  unresolvedGaps:
  - Current revenue, gross margin, burn, and runway are not publicly disclosed.
  - Order conversion into installed systems and recurring route revenue remains opaque.
  - Fleet-level reliability, uptime, and cybersecurity metrics are not public.
  - Exact post-money valuation terms and preference stack are undisclosed.
