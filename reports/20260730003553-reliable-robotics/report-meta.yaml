companyProfile:
  summary: Reliable Robotics is a Mountain View, California autonomous aviation startup founded in 2017. Its core product is the Reliable Autonomy System, a certifiable automation stack designed to retrofit existing aircraft such as the Cessna 208 Caravan and enable remote-supervised gate-to-gate cargo and dual-use operations. Public milestones include FAA certification-plan acceptance, a 2023 uncrewed Caravan flight, a 2025 U.S. Air Force purchase agreement, and a 2026 Albuquerque-led eIPP cargo route plan. The company raised $160 million in April 2026 at a reported near-$1 billion valuation, taking total disclosed capital to about $300 million.
  foundedDate: '2017-01-01'
  founders:
  - name: Robert Rose
    role: Co-founder and CEO
    background: Former SpaceX and Tesla executive leading the company's certification-first autonomy strategy.
    claimRefs:
    - CO003
  foundingLocation: Mountain View, California, USA
  headquarters: Mountain View, California, USA
  productSummary: Reliable sells a certifiable autonomy system for existing aircraft, paired with remote-supervised operations, detect-and-avoid capability, and route-level deployment via cargo and defense partners.
  customerFocus: Regional cargo operators, airport and community partners, and U.S. defense or government logistics users.
  businessModel: Late-stage deep-tech model combining autonomy-system commercialization, route operations through Reliable Airlines, and defense-backed integration work.
  stage: Series D / private
