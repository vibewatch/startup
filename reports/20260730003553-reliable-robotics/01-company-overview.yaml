company:
  name: Reliable Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Reliable Robotics is a Mountain View autonomous aviation startup retrofitting existing aircraft with a certifiable autonomy stack. Public evidence supports a 2017 founding, a 2026 $160M round at nearly a $1B valuation, a named USAF customer path, and a concrete Albuquerque commercial-route plan, while leaving revenue and detailed economics undisclosed.
sections:
- id: identity-positioning
  title: Identity, positioning, and model
  body: 'Reliable Robotics is best understood as an autonomy retrofit company, not as a new-airframe startup. Its public materials repeatedly describe the Reliable Autonomy System as a certifiable stack for existing aircraft and existing airspace, which narrows the engineering challenge to automation, detect-and-avoid, communications, and procedures rather than a clean-sheet aircraft build.


    That framing matters because it makes the company easier to compare with real cargo and defense operating needs. It also helps explain why the Cessna 208 Caravan sits at the center of the story: it is already a known aircraft, already familiar to operators and inspectors, and already useful for cargo missions.


    Public disclosures remain incomplete, so the right reading is milestone-based rather than metric-perfect. Investors should interpret each point as evidence about timing, execution, and proof quality rather than as proof that every economic question is already answered. That also means each section should be read as part of a connected diligence chain: route proof informs customer quality, certification informs valuation, and capital intensity informs timing. For a private aerospace company, depth comes from connecting those pieces rather than pretending the public record is complete. In practice, that means investors should compare what is clearly supported, what is only directionally supported, and what still depends on management-only disclosure. That extra caution is part of the thesis, not a reason to discard the thesis.


    A disciplined investor should also separate three questions that public startup coverage often blurs together: whether the core autonomy stack appears technically credible, whether the certification and route timetable is still plausible, and whether the present valuation already assumes those milestones succeed on something close to schedule. Reliable can score well on the first question and reasonably on the second while still leaving the third unresolved. That distinction is why this report treats proof quality, market readiness, and economic transparency as separate diligence layers instead of collapsing them into one headline.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO008
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-capital
  title: Leadership, capital, and governance
  body: 'The company-overview chapter is strongest when it treats financing as operating evidence. The 2026 $160 million round mattered because management and coverage tied the money to production scale-up, hiring, and certification evidence generation. That means Reliable is still in a capital-intensive execution phase rather than a mature cash-flow phase.


    Governance visibility is mixed. Robert Rose is clearly the founder-operator, and John Burbank''s board entry gives the lead investor direct influence. Hiring pages and company boilerplate suggest growth across certification, manufacturing, and flight-test functions, but exact headcount and broader board composition are still under-disclosed.


    Public disclosures remain incomplete, so the right reading is milestone-based rather than metric-perfect. Investors should interpret each point as evidence about timing, execution, and proof quality rather than as proof that every economic question is already answered. That also means each section should be read as part of a connected diligence chain: route proof informs customer quality, certification informs valuation, and capital intensity informs timing. For a private aerospace company, depth comes from connecting those pieces rather than pretending the public record is complete. In practice, that means investors should compare what is clearly supported, what is only directionally supported, and what still depends on management-only disclosure. That extra caution is part of the thesis, not a reason to discard the thesis.


    A disciplined investor should also separate three questions that public startup coverage often blurs together: whether the core autonomy stack appears technically credible, whether the certification and route timetable is still plausible, and whether the present valuation already assumes those milestones succeed on something close to schedule. Reliable can score well on the first question and reasonably on the second while still leaving the third unresolved. That distinction is why this report treats proof quality, market readiness, and economic transparency as separate diligence layers instead of collapsing them into one headline.'
