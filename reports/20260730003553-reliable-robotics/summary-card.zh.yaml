  topStrengths:
    - 相比多数自主系统同业，公司已有更靠前的公开 FAA 和飞行测试证据。
    - 先拿认证、再改装既有货运飞机的路线，比从零开发机体降低了执行复杂度。
    - 具名商业航线计划和具名 Air Force 客户提供了真实运营证据，而不是停留在 PPT 伙伴关系。
    - 2026 年的大额融资给了公司时间去冲认证和部署里程碑。
  topRisks:
    - 认证和航线落地时间仍是决定价值的最大变量。
    - 公开财务披露很薄，收入质量、利润率路径和烧钱速度仍未知。
    - 客户证据仍集中在少数交易对手和试点上。
    - 当前估值已经假设公司能拿下相当一部分品类领军者成果。
  unresolvedGaps:
    - 当前收入、毛利率、烧钱速度和 runway 未公开披露。
    - 订单如何转化为已安装系统和经常性航线收入仍不透明。
    - 机队级可靠性、uptime 和网络安全指标未公开。
    - 准确投后估值条款和优先权结构尚未披露。
