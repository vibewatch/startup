      - number: '2.2'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Reliable 的买方结构比普通企业软件销售更复杂。用户是运营商或任务所有者，付款方可能是承运商、 机场伙伴或军事项目办公室，而监管机构决定市场本身打开的速度。


              这种复杂度仍可能成为优势，因为它让浅层进入者更难抢下市场。但它也意味着，试点而不是立刻大规模改装机队才是常态， 预算也往往牵涉多方，不是干净的一条预算项。


