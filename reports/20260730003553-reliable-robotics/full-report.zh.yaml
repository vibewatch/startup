  customerFocus: 区域货运运营商、机场与社区伙伴，以及美国国防或政府物流用户。
  businessModel: 后期深科技模式，把自主系统商业化、通过 Reliable Airlines 开展航线运营，以及国防支持的集成工作结合起来。
