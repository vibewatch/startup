  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Reliable 不需要整个自主航空市场都成真，才能创造价值。它需要的是更窄的市场：在区域货运和特殊任务飞行中， 改装固定翼飞机能够降低成本或提高可靠性。因此，宽口径的自主飞机 TAM
              只能提供方向感，不能直接拿来承保。


              今天最相关的替代方案，是有人驾驶的区域货运、小机场支线服务和军事物流任务。Reliable 的改装路线让它在这个市场里有一个合理位置， 因为它从一款已认证的主力飞机出发，而不是从白纸设计开始。


              公开披露仍不完整，因此更合适的读法是看里程碑，而不是追求指标完美。投资人应把每个点理解为关于时点、 执行和证据质量的证据，而不是把它当成所有经济问题都已经答完。也就是说，每一节都要放进一条连贯的尽调链：
