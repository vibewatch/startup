        - 支撑溢价倍数
        - 可能已计入价格
        - 正式里程碑节奏
      - - 客户证据
        - 已披露航线和国防关系
        - 证据仍集中
        - 付费部署扩张
      - - 资本厚度
        - 本轮延长现金跑道
        - 没有解决收入不透明
        - 烧钱速度和里程碑消化
      - - 可比稀缺
        - 直接同业少，支撑叙事溢价
        - 可比样本稀疏，加大定价误差
        - 同业融资和公开估值
