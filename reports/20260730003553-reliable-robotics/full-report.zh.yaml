      - 含义
      - 为何仍需谨慎
    rows:
      - - 最新私募估值
        - 2026 年 4 月报道接近 $1B
        - 投资者已把品类领导地位计入价格
        - 私募估值可能跑在商业化节奏前面
      - - 累计融资
        - 累计约 $300M
        - 资本厚度支撑严肃执行
        - 也抬高了交付预期
      - - 披露质量
        - 未公开收入或利润率指标
        - 定价更多靠里程碑，而非基本面
        - 很难检验具体倍数支撑
      - - 阶段
        - Series D / 规模化商业化前
        - 后期创投阶段，但财务不透明
        - 高估值比公开现金流故事更脆弱
    notes: 估值背景基于已报道的私募市场估值和里程碑。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV002
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 关键成败
      - 估值传导
      - 概率信号
    rows:
      - - 乐观
        - 航线启动，认证持续推进，运营商背书扩大
        - 当前估值及以上存在上行空间
        - 需要监管和客户两端都执行到位
      - - 基准
        - 公司有进展，但变现偏慢
        - 当前估值大体守住，但谈不上便宜
        - 按当前公开证据看最可能
      - - 悲观
        - 时间表滑期，或航线无法形成持久证据
        - 当前估值明显压缩
        - 若执行和披露不及预期，这种情景最可能
      - - 观察项
        - 披露显著改善
        - 即便尚未全面规模化，也会降低模型风险
        - 软性但重要的降风险因素
    notes: 情景框架是定性的，因为没有公开收入基数支撑 DCF。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
  - id: TV003
    title: 可比估值表
    columns:
      - 同业 / 信号
      - 已公开内容
      - 为何重要
      - 关键差异
    rows:
      - - Merlin
        - 2026 年公开市场 / IPO 融资信号
        - 显示投资者愿意为可信自主飞行证据买单
        - Merlin 覆盖的机型更广
      - - Elroy Air
        - 公开市场准备和自主货运叙事
        - 显示该品类可以拿到激进定价
        - Elroy 是专用 VTOL 路线
      - - 更广泛的市场报告
        - 该品类仍横跨多种用例和估值框架
        - 解释了为什么可比公司天然噪声大
        - Reliable 需要基于里程碑，而不是套公式做可比分析
      - - 监管开放速度
        - 联邦政策仍在搭建市场结构
        - 估值应同时跟踪规则制定和客户
        - Reliable 对监管节奏的杠杆异常高
    notes: 可比分析偏战略，不是纯量化。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
    enumerationScope:
      coverage: partial
      basis: Covers the most visible comparable-set references and valuation signals retained for this chapter.
  - id: TV004
    title: 入场纪律清单
    columns:
      - 问题
      - 好答案
      - 坏答案
      - 为何重要
    rows:
      - - ABQ 运营是否启动并重复飞行？
        - 是，有常规飞行和数据共享
        - 否，或只有象征性发布
        - 最好的近端估值锚
      - - FAA 进展是否保持正轨？
        - 更多计划和测试获认可
        - 公开滑期或未解决摩擦
        - 估值对认证节奏高度敏感
      - - 客户广度是否改善？
        - 更多已披露运营商或合同
        - 仍是同一套狭窄证据
        - 有助于降低集中度和模型风险
      - - 披露是否改善？
        - 更多运营指标和部署数量
        - 继续不透明
        - 决定私募估值更容易还是更难辩护
    notes: 披露很薄，因此入场纪律必须看里程碑。
    enumerationScope:
      coverage: partial
      basis: Covers the core questions an investor should ask before underwriting the current private-market mark.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
