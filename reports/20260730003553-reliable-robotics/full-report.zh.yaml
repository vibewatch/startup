chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与模式
        blocks:
          - type: paragraph
            body: >-
              更准确地说，Reliable Robotics 是一家自主系统改装公司，而不是新机型初创公司。公开材料反复把 Reliable Autonomy System
              描述为面向既有飞机和既有空域的可认证技术栈，这把工程难题收窄到自动化、 探测与避让、通信和流程，而不是从零造一架飞机。


              这个定位很关键，因为公司因此更容易拿来和真实货运、国防运营需求比较。也正因如此，Cessna 208 Caravan 成为故事中心：这是一款已知飞机，运营商和检查人员已经熟悉，也已经适合货运任务。


              公开披露仍不完整，因此更合适的读法是看里程碑，而不是追求指标完美。投资人应把每个点理解为关于时点、 执行和证据质量的证据，而不是把它当成所有经济问题都已经答完。也就是说，每一节都要放进一条连贯的尽调链：
              航线证据影响客户质量，认证进展影响估值，资本强度影响时间表。对一家私营航空航天公司，深度来自把这些片段串起来， 而不是假装公开记录已经完整。实际判断时，投资人应区分哪些已经得到清楚支撑，哪些只有方向性支撑，
              哪些仍要靠管理层披露。这份额外谨慎是论点的一部分，不是放弃论点的理由。


              严谨的投资人还应拆开三个常被公开创业报道混在一起的问题：核心自主技术栈是否显得技术可信， 认证和航线时间表是否仍然可行，以及当前估值是否已经假设这些里程碑大致按期成功。Reliable
              在第一个问题上可以得分较高，在第二个问题上也算合理，但第三个问题仍未解决。正因如此， 本报告把证据质量、市场就绪度、经济透明度拆成不同尽调层，而不是压成一个标题式结论。
