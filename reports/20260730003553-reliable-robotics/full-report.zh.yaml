            body: >-
              Reliable 也处在一张密集依赖网络里。FAA 节奏重要，机场和航线伙伴重要，军方资金与验证重要，关键技术人才也重要。


              安全性和 DAA 表现需要单独强调，因为一次可见失败带来的下行风险，可能远高于普通软件宕机。


              公开披露仍不完整，因此更适合按里程碑读，而不是追求指标完美。投资者应把每一点看成关于时间、执行和证据质量的信号，而不是证明所有经济问题都已经有答案。各节也要放进一条连贯的尽调链里读：航线验证影响客户质量，认证进展影响估值，资本强度影响时点。私营航空航天公司的尽调深度，来自把这些线索接起来，而不是假装公开记录已经完整。实际判断时，投资者应区分哪些已有清晰支撑、哪些只得到方向性支撑、哪些仍依赖管理层披露。这层额外谨慎是论点的一部分，不是放弃论点的理由。


              自律的投资者还要拆开三个问题。公开报道初创公司时，常把它们混在一起：核心自主系统在技术上是否可信，认证和航线时间表是否仍然可行，当前估值是否已经假设这些里程碑大体按期兑现。Reliable
