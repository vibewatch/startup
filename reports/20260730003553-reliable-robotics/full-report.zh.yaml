  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争范围界定
        blocks:
          - type: paragraph
            body: >-
              Reliable 的竞争集合并不整齐，因为自主货运航空仍处在整合前阶段。最接近的类比对象，是 Xwing 和 Merlin 这类改装型或不绑定具体机型的自主技术公司。第二类公司也瞄准货运自主化终局市场，
              但技术路径不同，包括 Natilus、Dronamics、Pyka 和 Elroy Air。


              这些公司不能互相替换。Reliable 会和它们争夺资本、战略注意力和部分客户预算，但并不总是争夺完全相同的认证窗口或航线任务。


