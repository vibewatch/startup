              自律的投资者还要拆开三个问题。公开报道初创公司时，常把它们混在一起：核心自主系统在技术上是否可信，认证和航线时间表是否仍然可行，当前估值是否已经假设这些里程碑大体按期兑现。Reliable
              在第一个问题上可以得高分，在第二个问题上也有合理支撑，但第三个问题仍未解决。因此，本报告把证据质量、市场就绪度和经济透明度分成三层尽调，而不是压成一个标题。
