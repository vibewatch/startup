companyProfile:
  summary: >-
    Reliable Robotics 是一家位于加州 Mountain View 的自主航空初创公司，成立于 2017 年。核心产品是 Reliable Autonomy System，这是一套可认证的自动化技术栈，用来改装
    Cessna 208 Caravan 等既有飞机， 支持远程监督的端到端货运和军民两用任务。公开里程碑包括 FAA 接受认证计划、2023 年无人驾驶 Caravan 飞行、2025 年美国空军采购协议，以及 2026 年由
    Albuquerque 牵头的 eIPP 货运航线计划。公司在 2026 年 4 月以报道中接近 $1 billion 的估值融资 $160 million，使披露融资总额达到约 $300 million。
  foundedDate: '2017-01-01'
  founders:
    - name: Robert Rose
      role: 联合创始人兼 CEO
      background: 曾任 SpaceX 和 Tesla 高管，主导公司以认证为先的自主战略。
      claimRefs:
        - CO003
  foundingLocation: Mountain View, California, USA
