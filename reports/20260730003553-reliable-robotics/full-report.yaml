chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and model
        blocks:
          - type: paragraph
            body: >-
              Reliable Robotics is best understood as an autonomy retrofit company, not as a new-airframe startup. Its
              public materials repeatedly describe the Reliable Autonomy System as a certifiable stack for existing
              aircraft and existing airspace, which narrows the engineering challenge to automation, detect-and-avoid,
              communications, and procedures rather than a clean-sheet aircraft build.


              That framing matters because it makes the company easier to compare with real cargo and defense operating
              needs. It also helps explain why the Cessna 208 Caravan sits at the center of the story: it is already a
              known aircraft, already familiar to operators and inspectors, and already useful for cargo missions.


              Public disclosures remain incomplete, so the right reading is milestone-based rather than metric-perfect.
              Investors should interpret each point as evidence about timing, execution, and proof quality rather than
              as proof that every economic question is already answered. That also means each section should be read as
              part of a connected diligence chain: route proof informs customer quality, certification informs
              valuation, and capital intensity informs timing. For a private aerospace company, depth comes from
              connecting those pieces rather than pretending the public record is complete. In practice, that means
              investors should compare what is clearly supported, what is only directionally supported, and what still
              depends on management-only disclosure. That extra caution is part of the thesis, not a reason to discard
              the thesis.


              A disciplined investor should also separate three questions that public startup coverage often blurs
              together: whether the core autonomy stack appears technically credible, whether the certification and
              route timetable is still plausible, and whether the present valuation already assumes those milestones
              succeed on something close to schedule. Reliable can score well on the first question and reasonably on
              the second while still leaving the third unresolved. That distinction is why this report treats proof
              quality, market readiness, and economic transparency as separate diligence layers instead of collapsing
              them into one headline.
