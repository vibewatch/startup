        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Reliable does not need all autonomous aviation to materialize to create value. It needs a narrower market
              where retrofitted fixed-wing aircraft can lower cost or raise reliability on regional cargo and
              special-mission flying. That makes broad autonomous-aircraft TAMs directionally useful but too wide for
              direct underwriting.


              The most relevant substitute set today is piloted regional cargo, small-airport feeder service, and
              military logistics missions. Reliable's retrofit approach gives it a plausible seat in that market because
              it starts with a certified workhorse aircraft instead of a blank-sheet design.


