  - id: TV002
    title: Bull / base / bear scenarios
    columns:
      - Case
      - What goes right or wrong
      - Valuation read-through
      - Probability signal
    rows:
      - - Bull
        - Routes launch, certification keeps progressing, operator references broaden
        - Upside to the current mark and beyond
        - Requires execution across regulation and customers
      - - Base
        - The company progresses but monetizes slowly
        - Current valuation mostly holds but does not look cheap
        - Most likely on present public evidence
      - - Bear
        - Timelines slip or routes fail to become durable proof
        - Current mark compresses meaningfully
        - Most likely if execution and disclosure disappoint
      - - Watch item
        - Disclosure improves materially
        - Would reduce model risk even before full scale
