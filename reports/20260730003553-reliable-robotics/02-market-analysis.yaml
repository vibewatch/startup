- id: TM004
  title: Adoption constraints
  columns:
  - Constraint
  - Evidence
  - Near-term effect
  - Why it matters
  rows:
  - - Certification complexity
    - GAO and FAA case-by-case approach
    - Long evidence burden
    - Category leaders still need years of work
  - - Airport readiness
    - GAO and DOT cite freight and infrastructure bottlenecks
    - Selective route deployment
    - Existing airports reduce but do not remove friction
  - - Rule normalization
    - BVLOS and eIPP rules still evolving
    - Pilots come before routine operations
    - The regulatory market is still being built
  - - Capital intensity
    - Hardware, certification, and ops all cost money
    - Rewards better-funded programs
    - The category is deep-tech, not asset-light SaaS
  notes: Constraint framing is intentionally conservative.
