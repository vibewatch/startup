- id: TP004
  title: Moat durability questions
  columns:
  - Question
  - Current public answer
  - Why it matters
  - Diligence angle
  rows:
  - - Can others copy retrofit autonomy?
    - Yes in theory, slowly in practice
    - Evidence generation creates a temporary moat
    - Track who accumulates certifiable data fastest
  - - Is the Caravan choice enough?
    - Helpful but not permanent
    - Others can use certified aircraft too
    - Watch whether timing advantage becomes lock-in
  - - Can primes compress the gap?
    - Yes if standards mature and budgets justify it
    - Incumbents have certification resources
    - Timing advantage matters more than pure IP
  - - Will the market multi-home?
    - Likely yes by route and mission type
    - Different aircraft classes serve different jobs
    - Reduces the chance of one universal winner
  notes: Moat analysis is qualitative because peer economics remain opaque.
