company:
  name: Reliable Robotics
chapter:
  number: 3
  title: Competitors
  summary: Reliable competes across several adjacent sets rather than one clean peer group. The closest analogs are retrofit-autonomy companies such as Xwing and Merlin. A second set includes purpose-built cargo aircraft companies such as Natilus, Dronamics, Pyka, and Elroy Air. Reliable's main edge is its certification-first retrofit path on a known cargo aircraft, but that edge is timing-sensitive rather than absolute.
sections:
- id: peer-set
  title: Defining the competitive set
  body: 'Reliable''s competitive set is messy because autonomous cargo aviation is still pre-consolidation. The closest analogs are other retrofit or aircraft-agnostic autonomy players such as Xwing and Merlin. A second set pursues the same cargo-autonomy end market through different technical means, including Natilus, Dronamics, Pyka, and Elroy Air.


    Those companies are not interchangeable. Reliable competes with them for capital, strategic attention, and some customer budgets, but not always for the exact same certification slot or route mission.


    Public disclosures remain incomplete, so the right reading is milestone-based rather than metric-perfect. Investors should interpret each point as evidence about timing, execution, and proof quality rather than as proof that every economic question is already answered. That also means each section should be read as part of a connected diligence chain: route proof informs customer quality, certification informs valuation, and capital intensity informs timing. For a private aerospace company, depth comes from connecting those pieces rather than pretending the public record is complete. In practice, that means investors should compare what is clearly supported, what is only directionally supported, and what still depends on management-only disclosure. That extra caution is part of the thesis, not a reason to discard the thesis.


    A disciplined investor should also separate three questions that public startup coverage often blurs together: whether the core autonomy stack appears technically credible, whether the certification and route timetable is still plausible, and whether the present valuation already assumes those milestones succeed on something close to schedule. Reliable can score well on the first question and reasonably on the second while still leaving the third unresolved. That distinction is why this report treats proof quality, market readiness, and economic transparency as separate diligence layers instead of collapsing them into one headline.'
