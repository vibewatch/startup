      - number: '3.3'
        title: Switching costs, distribution power, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              LangChain does create some real switching cost, but most of it sits below the surface. A team that only
              uses LangChain as a thin harness over model APIs can still swap models or even replace the framework with
              modest pain. The cost increases once the team relies on LangGraph persistence, checkpoints, and LangSmith
              deployment because state, debugging workflows, and operator habits begin to depend on LangChain Inc.
              surfaces. Even then, the company's own docs say LangGraph can run without LangChain, and review sources
              argue that open protocols plus direct SDKs keep the ecosystem relatively portable. In practice, this is
              medium lock-in, not Azure-scale lock-in.


              Distribution power is uneven across the field. Microsoft has the strongest enterprise partner position
              because Semantic Kernel naturally rides Azure OpenAI spend and Microsoft tooling. CrewAI markets itself as
              already used by 63% of the Fortune 500. Langfuse claims 19 of the Fortune 50 and over 100,000 engineers,
              showing that open-source observability can reach large accounts without owning the runtime. Temporal and
              Prefect benefit from existing workflow and platform budgets rather than asking buyers to approve an
              entirely new agent stack. LangChain's counterweight is developer distribution: TechCrunch reported a $1.25
              billion valuation and 118,000 GitHub stars, and the official stack remains unusually broad. But the
              competitive picture still points to multi-homing. Buyers can run LangChain with Langfuse, pair LangGraph
              with Temporal-like durability patterns, or skip the framework entirely for simpler workloads.
            claimRefs:
              - CP005
              - CP006
              - CP015
              - CP021
              - CP022
