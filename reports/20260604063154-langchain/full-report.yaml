      - number: '7.2'
        title: Legal, privacy, compliance, and security risk
        blocks:
          - type: paragraph
            body: >-
              The second risk cluster is legal and trust-related: LangChain is telling enterprises that it can host,
              trace, evaluate, and sometimes deploy agentic workloads, which means the company sits near personal data,
              proprietary prompts, user interactions, and customer-controlled integrations. The public legal stack is
              directionally reassuring but incomplete. LangChain has a privacy policy, a formal terms document, a DPA
              execution path, and a trust workflow that references SOC 2 Type II reports, HIPAA and GDPR policies,
              penetration-test summaries, and a current subprocessor list. But the same documents also make clear that
              third-party product integrations can move customer data, that LangChain disclaims liability for those
              third-party products, and that the platform is not warranted to be uninterrupted or fully prevent
              unauthorized third-party access. That matters because the recent vulnerability record is real, not
              hypothetical: NVD and GitHub advisories describe SSRF, path traversal, SQL injection, and unsafe
              checkpoint deserialization exposures in LangChain and LangGraph components, while independent reporting
              frames these flaws as capable of exposing files, secrets, or downstream cloud surfaces. Separately, the EU
              AI Act, ICO guidance, and FTC AI enforcement activity all point in the same direction: if LangChain-backed
              deployments move into regulated, rights-sensitive, or marketing-sensitive workflows, logging,
              documentation, security, data-processing, and claim substantiation expectations intensify materially.
