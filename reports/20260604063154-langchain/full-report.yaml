  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Severity-ranked matrix of LangChain's core risks by likelihood, impact, and residual exposure after visible
      mitigations.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual exposure
      rows:
        - label: Provider-native commoditization
          values:
            - label: High
              detail: OpenAI, Microsoft, AWS, and Google now bundle agent plumbing directly.
            - label: High
              detail: Compression lands on LangSmith monetization and procurement leverage.
            - label: High
              detail: Model neutrality helps, but core orchestration keeps commoditizing.
        - label: Security and privacy failure
          values:
            - label: Medium-high
              detail: Recent CVEs show non-trivial attack surface in framework and checkpoint paths.
            - label: High
              detail: Could block enterprise trust or expose customer data and secrets.
            - label: High
              detail: Controls exist, but recurring disclosures would materially damage underwriting.
        - label: Cloud and provider dependency
          values:
            - label: Medium
              detail: Marketplace, cloud, and model-provider dependencies are diversified but critical.
            - label: High
              detail: Outages, pricing shifts, or partner bundling can hit revenue and reliability.
            - label: Medium-high
              detail: Three-cloud distribution helps, yet channel concentration can still form quickly.
        - label: Operational uptime risk
          values:
            - label: Medium
              detail: Public status pages show less-than-perfect uptime for LangSmith and upstream providers.
            - label: Medium-high
              detail: Enterprise workloads fail hardest when control planes or premium models wobble.
            - label: Medium
              detail: Failover and self-hosting reduce risk but do not remove it.
        - label: People and roadmap sprawl
          values:
            - label: Medium
              detail: Founder-centric narrative and multi-product scope create coordination pressure.
            - label: Medium-high
              detail: Execution misses could slow hardening, sales support, or product focus.
            - label: Medium-high
              detail: Capital helps, but leadership bandwidth still matters.
        - label: Valuation and model risk
          values:
            - label: Medium
              detail: Demand and financing are real, but economics remain under-disclosed publicly.
            - label: High
              detail: If premium monetization lags commoditization, downside at current valuation is meaningful.
            - label: High
              detail: Public evidence still does not close ARR mix or concentration gaps.
    approximationNotes: >-
      Severity buckets are evidence-led qualitative ratings synthesized from public contracts, status pages, security
