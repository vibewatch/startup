        - Cloud-native agent runtimes, governance layers, and deployment services
        - General cloud spend not tied to agent applications
        - Central cloud and transformation budgets
        - Important adjacency that can expand or commoditize SAM
      - - Status-quo internal build
        - Direct model APIs plus internal code, retrieval, prompts, and hand-built monitoring
        - Unrelated SaaS or infrastructure projects
        - Individual builders, engineering managers, or internal platform teams
        - Key substitute that limits how much adjacent AI activity converts into third-party platform spend
