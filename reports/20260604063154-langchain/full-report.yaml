    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product stack, and scale markers
        blocks:
          - type: paragraph
            body: >-
              LangChain is best understood as an agent-engineering company that grew out of Harrison Chase's late-2022
              open-source project rather than as a fully formed startup launched on day one. The chronology matters. The
              first LangChain Python package shipped on October 24, 2022, while the retained public record places
              company formation in early 2023 and legal incorporation on January 31, 2023. That split helps reconcile
              the common shorthand that LangChain was “founded” in 2022: the project origin is 2022, while the company
              is an early-2023 formation with co-founder Ankush Gola. Current identity markers are stronger. LangChain's
              about page and third-party trackers consistently anchor headquarters in San Francisco, with the company
              also publicly naming New York, Boston, and Amsterdam offices. The product stack is now clear: LangChain
              OSS for fast agent creation, LangGraph for low-level orchestration and durable runtime control, and
              LangSmith for observability, evaluation, and deployment. The best-supported scale markers are mostly
              company claims rather than audited operating metrics, but they are specific: 100M+ monthly open-source
              downloads, 6K+ active LangSmith customers, 5 of the Fortune 10 as LangSmith customers, 35% of the Fortune
              500 served, and more than 1B cumulative downloads.
