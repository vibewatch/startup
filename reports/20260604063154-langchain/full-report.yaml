          - type: paragraph
            body: >-
              Leadership visibility is founder-heavy. Harrison Chase is the CEO, the author of the three-year
              retrospective, and the central narrator across the funding announcement, company history, and product
              direction materials. Ankush Gola is consistently named as co-founder, but retained public sources are much
              thinner on his current operating remit than they are on Chase's. That imbalance is enough to treat
              key-person dependence as a real diligence item: LangChain's external story is still closely tied to the
              founder-CEO. Public governance visibility is weaker than product visibility. The about page, Craft
              executive page, and Tracxn profile identify the founders but do not provide a clean current board roster,
              independent-director list, or investor-board-right summary. That does not imply weak governance; it simply
              means governance is not publicly legible from the retained source pack. The practical conclusion for later
              chapters is that founder-market fit looks strong, but governance quality, succession depth, and broader
              executive bench coverage remain questions rather than verified strengths.
