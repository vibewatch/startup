      - number: '1.4'
        title: Milestones of record, enterprise expansion, and current adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows LangChain evolving from a single open-source package into a broader enterprise
              agent stack. LangGraph launched in January 2024 to give builders more control than classic chains allowed.
              LangChain's own 2024 usage report then showed commercialization and product convergence accelerating, with
              LangSmith sign-ups nearing 30k per month and LangGraph traces already reaching 43% of LangSmith
              organizations. The hosted runtime crossed an important threshold on May 14, 2025 when LangGraph Platform
              reached GA after nearly 400 companies had used the beta; by October 2025 that deployment layer had been
              renamed LangSmith Deployment as LangSmith absorbed more of the commercial platform surface. The October
              2025 1.0 releases marked a maturity milestone and explicitly addressed earlier criticism that LangChain
              abstractions had become too heavy. The strongest 2026 enterprise-scale signal is the March 16 NVIDIA
              integration and coalition membership, which paired LangChain's stack with NVIDIA infrastructure and quoted
              more than 300 enterprise LangSmith customers. The main adverse signal is March 2026 security disclosure
              risk: independent reporting and a GitHub advisory documented multiple vulnerabilities across LangChain and
              LangGraph. The good news is that the advisory also stated there was no evidence of exploitation in the
              wild for CVE-2026-28277 and no known risk to LangSmith-hosted deployments from that specific issue.
