companyProfile:
  summary: >-
    LangChain began as Harrison Chase's late-2022 open-source side project and became a company in early 2023 with
    co-founder Ankush Gola. The company now spans LangChain OSS for agent creation, LangGraph for durable orchestration,
    and LangSmith for observability, evaluation, and deployment, with commercial monetization concentrated in LangSmith
    seats, usage meters, and enterprise deployment features. Public traction is unusually strong for a private AI
    infrastructure startup—100M+ monthly open-source downloads, 6K+ active LangSmith customers, 35% of the Fortune 500
    served on company claims, and 138k+ GitHub stars—but public financial and governance disclosure still lags the
    company's category profile.
