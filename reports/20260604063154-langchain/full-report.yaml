  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and the OSS-to-paid funnel
        blocks:
          - type: paragraph
            body: >-
              LangChain’s customer surface is best understood as a two-layer system. The outer layer is enormous OSS
              adoption: the LangChain and LangGraph repositories remain heavily starred, Python download volumes are
              very large, and the JavaScript package has broad dependent usage. That reach matters because it creates a
              wide discovery and prototyping funnel for builders, startups, and enterprise teams that want to test agent
              frameworks before they buy anything. But the monetized layer is narrower and more specific. Public
              LangSmith and Deployment materials show a shift from framework usage into account-based observability,
              deployment, security, and governance. In other words, a lot of people use LangChain; far fewer are
              publicly proven as paying LangSmith or LangGraph Deployment customers.


              The buyer, user, and payer also diverge by segment. In public customer stories, platform engineers and AI
              teams are usually the buyers, while customer-support operators, property managers, logistics teams, or
              product managers are the day-to-day users. Payers appear to be central engineering, IT, security, or
              procurement functions once self-hosting, RBAC, data retention, and regional deployment matter. The named
              vertical mix is global and broad—fintech, logistics, enterprise workflow, real estate, cybersecurity,
              coding agents, and commerce—but the public proof is still skewed toward large enterprises and
              sophisticated product teams rather than a broad disclosed SMB paid base. That distinction is critical: OSS
              demand is already huge, but paid-customer depth is still visible through selected reference stories rather
              than a disclosed commercial ledger.
