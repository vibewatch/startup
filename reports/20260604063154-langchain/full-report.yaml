        - Engineering, AI platform, or developer-tools budget
        - Core entry point for LangChain framework adoption
      - - Agent orchestration runtime
        - State management, persistence, memory, human-in-the-loop, and long-running workflow runtime software
        - Generic workflow automation without LLM or agent-state orchestration
        - Platform engineering, architecture, or automation owners
        - Core LangGraph wedge for complex production agents
      - - Observability, evaluation, and deployment
        - Tracing, online evals, debugging, managed deployment, and security-oriented runtime controls
        - Generic APM, BI, or log tools that do not understand agent traces
        - Engineering tooling first, then broader IT or platform governance
        - Core LangSmith monetization layer and adjacent spend pool
