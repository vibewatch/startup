  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - scale / funding
      - target segment
      - differentiation
      - key limitation
    rows:
      - - LangChain / LangGraph / LangSmith
        - Integrated direct stack
        - $125M raised at $1.25B valuation in Oct 2025; 118k GitHub stars reported
        - Developers and product teams building agent apps from prototype to production
        - Single vendor across harness, stateful runtime, tracing, evaluation, and deployment
        - Moat is mostly workflow bundling; pricing is not cheapest and lock-in is moderate rather than hard
      - - LlamaIndex / LlamaParse
        - Direct peer
        - 10,000+ teams on commercial parsing plans
        - Data-heavy agent builders, document workflows, enterprise knowledge tools
        - Strongest around parsing, indexing, context augmentation, and event-driven workflows over proprietary data
        - Narrower general-purpose harness than LangChain; paid surface centers on ingestion workflows
      - - Haystack / deepset
        - Direct peer
        - Official materials claim thousands of teams; enterprise pricing opaque in fetched materials
        - Teams wanting modular RAG, search, and explicit pipeline control
        - Component-and-pipeline design with flexible provider mixing and open-source core
        - Commercial packaging less transparent; weaker bundled deployment/eval story than LangChain
      - - Microsoft Semantic Kernel
        - Direct/incumbent-adjacent peer
        - Microsoft distribution and Azure budget access; Fortune 500 usage claim
        - Enterprise developers already standardized on Microsoft tooling
        - Plugin/OpenAPI middleware, model-swapping, telemetry, strong enterprise fit
        - Not a full bundled observability-and-deployment platform like the LangChain family
      - - Microsoft AutoGen
        - Legacy direct peer
        - Historic enterprise adoption, but now maintenance mode
        - Existing multi-agent projects and Microsoft ecosystem holdouts
        - Recognizable multi-agent pattern library and event-driven architecture
        - Lifecycle risk is high because Microsoft redirects new users to newer frameworks
      - - CrewAI
        - Direct peer
        - Company claims 63% of Fortune 500 use; free plus enterprise custom
        - Ops-heavy teams and business workflows needing role-based multi-agent control
        - Visual editor, control plane, governance, connectors, support, private infra
        - Opinionated model can become expensive to outgrow for complex custom logic
      - - Langfuse
        - Adjacent observability/eval
        - 19 of Fortune 50, 100k+ engineers, 10B+ observations/month claimed
        - Teams buying tracing, evals, prompts, and experiments without changing runtimes
        - Open-source, self-hostable, OTel native, strong no-lock-in posture
        - Does not replace a core agent harness or durable runtime
      - - W&B Weave
        - Adjacent observability/eval
        - Weights & Biases installed-base leverage; pricing folded into broader W&B platform
        - Existing W&B users adding LLM tracing and evaluation
        - Observability and LLM judging inside a familiar ML tooling stack
        - Less evidence of a standalone agent-platform GTM than LangSmith or Langfuse
      - - Braintrust
        - Adjacent observability/eval
        - Free core, $249/mo paid tier, enterprise custom, unlimited users
        - Cross-functional AI product teams optimizing prompts, models, and releases
        - Team-wide traces, evals, datasets, automation, and quality gates
        - Does not own orchestration runtime; budget capture is narrower than a full stack
      - - Arize Phoenix
        - Adjacent observability/eval
        - 2.5M+ monthly downloads and 9k+ GitHub stars claimed
        - Builders that prioritize open-source agent debugging and evaluation
        - OpenTelemetry-native, self-hostable, explicit no-proprietary-lock-in messaging
        - Commercial monetization is less visible than LangSmith or Braintrust
      - - Temporal
        - Substitute / orchestration incumbent
        - Cloud plans from $100/mo; startup credits up to $6k
        - Reliability-sensitive workflows, approvals, and long-running stateful processes
        - Crash-proof durable execution and workflow economics buyers already understand
        - Not an agent harness; users still need model, tooling, and eval layers
      - - Prefect
        - Substitute / orchestration incumbent
        - 200M data tasks monthly claimed; broad OSS community
        - Python teams wanting portable flows, retries, approvals, and events
        - Native Python, vendor portability, resumable state, dynamic runtime
        - Weaker agent-native abstractions than LangChain, CrewAI, or LlamaIndex
      - - Internal build / direct SDK
        - Substitute / status quo evolution
        - Uses existing engineering budget rather than new platform spend
        - Teams with simple flows, strict latency, or unusual memory/state needs
        - Maximum portability and minimal abstraction debt; easiest way to avoid framework lock-in
        - Highest internal engineering burden and weakest out-of-the-box eval/deployment ergonomics
    notes: >-
      Profile rows cover the named direct peers, adjacents, workflow substitutes, and internal-build alternative
