        title: Product definition in workflow terms and module map
        blocks:
          - type: paragraph
            body: >-
              LangChain is no longer best described as a single open-source framework. The retained 2025-2026 product
              evidence shows a layered stack with a clear workflow split. At the open-source edge, LangChain is the
              fast-start harness: a developer chooses a model, adds tools and middleware, and runs a tool-calling loop
              with create_agent. LangGraph is the lower-level runtime underneath that loop, built for durable state,
              interrupts, persistence, and long-running execution. Commercialization happens one layer up in LangSmith,
              where tracing, evaluation, deployment, and adjacent surfaces such as Fleet or Studio package the
              operational work that teams eventually need once agents move from prototype to production. The distinction
              matters because LangChain's own 1.0 materials say the package was redesigned to narrow scope and respond
              to feedback that earlier abstractions were too heavy. The JS package evidence is also useful: it
              explicitly separates @langchain/core and LCEL from the higher-level langchain package and LangGraph.js
              runtime. Combined with the integrations documentation, the product map supports a workflow where teams
              start with provider-agnostic build primitives, graduate to stateful orchestration, and then buy commercial
              observability, evaluation, and deployment.
