        - label: Current disclosed ARR midpoint
          value: 14
        - label: ARR needed at ~24x
          value: 52
        - label: ARR needed at ~12x
          value: 104
        - label: ARR needed at ~7x
          value: 179
        - label: ARR needed at ~6x
          value: 208
        - label: ARR needed at ~5x
          value: 250
    approximationNotes: Values are ARR in USD millions and use simple value / multiple math from the comparable set.
    claimRefs: [CV003, CV021, CV022, CV024, CV025, CV028, CV029, CV030]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Exit-value range across bull, base, and bear cases relative to the current $1.25B reference price.
    data:
      items:
        - label: Bull case exit value (USD m)
          low: 1400
          mid: 1900
          high: 2400
        - label: Base case exit value (USD m)
          low: 500
          mid: 750
          high: 1000
        - label: Bear case exit value (USD m)
          low: 100
          mid: 200
          high: 300
        - label: Gross return multiple at $1.25B entry (x)
          low: 0.1
          mid: 0.6
          high: 1.9
    approximationNotes: Scenario outputs are simple revenue-multiple ranges and should be treated as directional rather than precise price targets.
    claimRefs: [CV001, CV033, CV034, CV035, CV037]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Investment-committee scoring across the dimensions that matter most for a private valuation decision.
    data:
      items:
        - label: Market demand
          value: 8
          detail: Independent market reports and adoption surveys support strong category tailwinds.
        - label: Product breadth
          value: 8
          detail: LangChain spans harness, orchestration, observability, deployment, and newer agent surfaces.
        - label: Customer proof
          value: 7
          detail: Named production references and enterprise claims are meaningful, though still company mediated.
        - label: Competitive durability
          value: 5
          detail: Breadth helps, but multi-homing and SDK bypass risk keep lock-in moderate.
        - label: Economics visibility
          value: 3
          detail: Public ARR exists, but current ARR, NRR, gross margin, and cash remain undisclosed.
        - label: Security / trust posture
          value: 3
          detail: 2026 vulnerability disclosures are manageable but still non-trivial for enterprise underwriting.
        - label: Valuation discipline
          value: 2
          detail: The latest price is ahead of the public proof set.
        - label: Evidence quality
          value: 4
          detail: Strong on product and customers, weak on financial transparency and cap-table detail.
    approximationNotes: KPI scores are 1-10 judgment calls anchored to sourced evidence, not a mechanical model.
    claimRefs: [CV011, CV012, CV016, CV018, CV031, CV032, CV041, CV043]
