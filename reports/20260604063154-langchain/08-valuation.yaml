  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-arr-and-retention
      missingEvidence: Current ARR, NRR, and enterprise attach by product line are not publicly disclosed.
      whyItMatters: The valuation call depends more on present revenue scale and retention quality than on brand or download scale.
      diligencePath: Request a monthly ARR bridge, cohort NRR table, and enterprise versus self-serve mix from finance.
      relatedQuestionRefs: [QV002, QV003, QV020, QV021]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: gross-margin-and-cogs
      missingEvidence: Module-level gross margin and cloud-cost exposure for deployment, traces, Engine, and sandboxes are not public.
      whyItMatters: Without margin mix, investors cannot tell whether LangChain deserves premium software multiples or infra-discounted multiples.
      diligencePath: Request contribution margin by module plus a cloud-cost bridge for hosted products.
      relatedQuestionRefs: [QV004, QV026, QV028]
      relatedTableRefs: [TV002, TV006]
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: Preference stack, secondaries, debt, and option overhang are not publicly disclosed.
      whyItMatters: Return modeling is unreliable without understanding the liquidation waterfall and dilution overhang.
      diligencePath: Review the cap table, financing documents, debt schedule, and option refresh history with counsel.
      relatedQuestionRefs: [QV023, QV024, QV028]
      relatedTableRefs: [TV001, TV006]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Public evidence names customers but does not disclose concentration, churn, or expansion distribution.
      whyItMatters: Enterprise concentration and shallow conversion could make the current valuation much riskier than the logo list suggests.
      diligencePath: Ask for top-customer concentration, cohort churn, expansion waterfall, and paid conversion by logo tier.
      relatedQuestionRefs: [QV006, QV007, QV028]
      relatedTableRefs: [TV002, TV006]
    - type: private-evidence-only
      severity: material
      topic: security-remediation
      missingEvidence: Public sources disclose vulnerabilities and one advisory note, but not the full remediation program or enterprise customer impact.
      whyItMatters: Security trust is a direct valuation transmission channel for a platform selling into enterprise agent workflows.
      diligencePath: Review remediation timelines, third-party testing, incident communications, and any pipeline impact on enterprise deals.
      relatedQuestionRefs: [QV010, QV022, QV027, QV028]
      relatedTableRefs: [TV005, TV006]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-set-coverage
      missingEvidence: No public private-market comp with disclosed revenue and clean valuation math matches LangChain closely enough to complete the comp set.
      whyItMatters: The comparable valuation table is intentionally partial because the best public references are public software and historical observability M&A, not true one-for-one private peers.
      diligencePath: Add private-market comp data from management, investors, or paid databases during primary diligence and refresh TV004.
      relatedQuestionRefs: [QV011, QV016, QV025]
      relatedTableRefs: [TV004]
