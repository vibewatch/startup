  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paid-customer-count
    missingEvidence: Current paying LangSmith and LangGraph Deployment customer count, active paid seats, and revenue split by product, geography, and segment as of 2026-06-04.
    whyItMatters: Without a paying-account denominator, the gap between enormous OSS adoption and monetized customer depth cannot be underwritten with confidence.
    diligencePath: Request current paying-account counts, seat counts, and revenue split across LangSmith, Deployment, and services, plus a split between self-serve and enterprise contracts.
    relatedQuestionRefs:
    - QU004
    - QU019
    - QU025
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal cohorts, contract length, and usage-depth cohorts by customer segment and product line.
    whyItMatters: Durability is currently inferred from workflow criticality and monitoring discipline rather than from true recurring-revenue evidence.
    diligencePath: Request retention cohorts, renewal history for top accounts, contract-term distribution, and at least two renewal-stage customer references.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU025
  - type: enumeration-incomplete
    severity: material
    topic: public-reference-list
    missingEvidence: A fuller named customer ledger that clearly separates framework users, internal-only deployments, pilots, live production accounts, and renewal-stage accounts.
    whyItMatters: The named proof table is necessarily partial because the public record blends launch stories, framework-user mentions, and current deployments of uneven quality.
    diligencePath: Request a customer ledger or NDA-protected reference pack with stage labels, outcomes, reference-call availability, and product mix by account.
    relatedQuestionRefs:
    - QU006
    - QU023
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: revenue-concentration
    missingEvidence: Top-customer ARR share, top-10 account mix, partner-sourced revenue, and product attach rates across LangSmith and Deployment.
    whyItMatters: The public narrative suggests flagship enterprise customers matter, but the downside from losing or delaying one of them cannot be quantified.
    diligencePath: Request top-account concentration data, largest contract values, and weighted pipeline by product and vertical.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU025
  - type: private-evidence-only
    severity: minor
    topic: procurement-cycle-length
    missingEvidence: Median enterprise sales cycle, security-review duration, regional deployment win rates, and close-loss reasons tied to hosting or compliance constraints.
    whyItMatters: The EU deployment thread shows real field friction, but one forum complaint is not enough to quantify how often procurement or deployment issues delay revenue.
    diligencePath: Request funnel metrics from first POC to signed production deployment, with reasons for slippage and a breakdown by cloud, hybrid, and self-hosted deals.
    relatedQuestionRefs:
    - QU020
    - QU021
