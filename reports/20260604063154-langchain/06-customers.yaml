- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Evidence
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - OSS to paid observability upsell
    - Framework usage can move into LangSmith tracing, evals, and deployment
    - Conversion rate is undisclosed
    - Wide funnel may still yield uneven monetization
    - Request OSS-to-paid conversion by team size and product
  - - Intra-account workflow expansion
    - ServiceNow, Rakuten, AppFolio, and C.H. Robinson broaden from one workflow to many
    - A few large logos may dominate strategic narrative or revenue
    - Strong ACV upside, but concentration is opaque
    - Request top-10 ARR share and cross-sell attach rates
  - - Enterprise security / hosting path
    - Custom SSO, hybrid, and self-hosted options support regulated customers
    - Moves customers into longer security and procurement cycles
    - Can slow close velocity and expand implementation cost
    - Request median sales cycle and security-review duration
  - - Regional deployment complexity
    - EU deployment complaint shows endpoint and licensing friction
    - Implementation friction can delay go-live or require support escalation
    - Hurts deployment velocity and reference quality
    - Request EU-vs-US deployment win rates and support burden
  - - Reference concentration
    - Most public proof is a curated set of flagship stories
    - Narrative can overstate breadth if many accounts are not named or renewing
    - Weakens underwriteability of customer durability
    - Request full customer ledger separating pilots, live, and renewal-stage accounts
  - - Partner and consulting leverage
    - Focused positions itself as a LangChain boutique partner for enterprise deployment
    - Partner-led wins may not scale like product-led adoption
    - Could aid enterprise execution but obscure direct channel economics
    - Request channel mix, partner-sourced pipeline, and services dependence
  notes: Expansion potential is credible, but concentration and close-friction remain under-disclosed. The core diligence need is account-level revenue and renewal visibility.
