companyProfile:
  summary: >-
    LangChain 起初是 Harrison Chase 在 late-2022 做的开源副项目，early 2023 与联合创始人 Ankush Gola 一起公司化。公司现在覆盖三层：用于创建智能体的 LangChain
    OSS、用于持久化编排的 LangGraph，以及负责可观测性、评测和部署的 LangSmith。商业化主要落在 LangSmith 席位、用量计费和企业部署功能上。作为一家私有 AI 基础设施创业公司，LangChain
    的公开牵引力异常强——每月 100M+ 开源下载、6K+ 活跃 LangSmith 客户、公司声称服务 35% 的 Fortune 500、GitHub stars 超过 138k+——但财务和治理披露仍跟不上它的品类声量。
