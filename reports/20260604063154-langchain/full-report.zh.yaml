  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现与收入模型
        blocks:
          - type: paragraph
            body: >-
              LangChain 的财务模型已经不再是经典的“只做开源”故事。核心 LangChain 和 LangGraph 框架仍采用 MIT 许可并免费，这保住了大规模采用漏斗；商业层则已经放在 LangSmith
              里。公开定价显示，公司通过席位订阅、追踪留存和追踪量收费、部署运行费、正常运行时间计量、Fleet 运行费、Engine compute units，以及 sandbox
              资源收费来变现。这个组合很关键，因为它制造了不止一种收入流，也让外部更难判断收入质量：有些收入来自经常性席位，有些按用量计费，企业计划则定制并按年度预付开票，而不是透明列价。收入桥梁因此是：开发者采用转向付费可观测性和部署，再进入企业合规、安全和控制平面采购。公开牵引力支撑这一动作。LangSmith
              2024 GA 发布披露超过 80,000 次注册、超过 5,000 个 MAU 团队，以及仅 January 就记录超过 40 million 条 traces；LangGraph Platform 2025
              GA 文章称，近 400 家公司已用它把智能体部署到生产。TechCrunch 后来报道，到 mid-2025，LangSmith 带来约 $12 million 到 $16 million 的
              ARR，这是最清楚的公开收入数据点，但它仍是二手报道，不是管理层指引披露。
