          - type: callout
            title: 毛利路径不如纯席位 SaaS 故事清楚
            body: >-
              LangSmith 定价把存储、部署、正常运行时间、compute 和 sandbox
              计量直接暴露给客户。这让变现更灵活，也提示成本基底对基础设施很敏感。没有私有的模块级毛利率数据，投资人还无法判断用量增长是在扩大贡献利润，还是只是放大托管和支持义务。
