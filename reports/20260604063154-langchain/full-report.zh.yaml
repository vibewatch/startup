    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前 ARR 和 NRR
        - 没有公开的 2026 年 ARR 更新，也没有公开留存队列
        - 需要验证 2025 年 10 月价格是否已经追上商业现实
        - CFO 或财务数据室：月度 ARR 桥表、队列 NRR，以及企业客户与自助客户组合。
      - - 按模块拆分毛利率
        - 可观测性、部署、Fleet、Engine 或沙箱托管经济性没有公开拆分
        - 需要判断 LangChain 应拿软件倍数，还是按基础设施折价
        - 财务和产品运营：按模块拆分贡献毛利率，以及云成本桥表。
      - - 股权结构表和优先股堆叠
        - 清算优先权、老股交易、期权刷新或债务没有公开数据
        - 不知道分配瀑布，回报测算就不可信
        - 法律和董事会材料：股权结构表、轮次文件、债务明细，以及员工期权负担。
      - - 客户集中度和付费转化
        - 公开客户案例展示了优质标杆客户，但没有披露集中度或付费绑定
        - 需要判断客户基础是否足够分散，且收入是否走出灯塔客户
        - 收入运营和客户成功：头部客户集中度、客户队列、扩张和流失。
      - - 安全修复和信任姿态
        - 公开漏洞报告显示风险真实存在，但企业影响披露不完整
        - 安全可信度直接影响企业销售速度和估值
        - 安全团队：修复时间线、事件响应证明、渗透测试摘要和客户沟通。
      - - 商业化效率
        - 没有公开的 CAC 回本周期、销售周期或伙伴渠道转化数据
        - 需要判断企业增长能否放大，同时不压垮利润率
        - 商业化尽调：漏斗转化、市场平台或渠道贡献、销售效率和续约时间。
    notes: 这些是价格决策前必须完成的最低限度工作流，不是完整尽调清单。
    claimRefs:
      - CV003
      - CV018
      - CV019
      - CV041
      - CV042
      - CV043
