      - number: '3.2'
        title: 能力与包装：LangChain 最宽的地方，以及并不宽的地方
        blocks:
          - type: paragraph
            body: >-
              LangChain 的主要优势在于，它覆盖了从智能体创建到有状态运行时，再到生产追踪和部署的完整路径。这比 LlamaIndex 更宽，后者差异化更集中在文档解析和上下文增强；比 Haystack
              更宽，后者吸引力在模块化和显式选择供应商；也比 Semantic Kernel 更宽，后者更像既有代码库的企业中间件，而不是打包好的 AI 平台。AutoGen 作为多智能体模式的历史参照仍有意义，但
              Microsoft 自己的仓库现在把它定位为只维护，并把新买方指向别处。CrewAI 则以更快的角色型多智能体工作流见效时间、可视化编辑器和业务团队更容易理解的治理功能来竞争，速度快过代码优先的
              LangChain 栈。


              包装方式让这些差异更尖锐。LangSmith 按席位定价，变现 OSS 实验到生产的跳跃。LlamaParse 通过 credits 变现文档摄取。Langfuse、Braintrust 和 Temporal
              发布生产与企业使用的明确标价。CrewAI 发布免费起步层，但多数企业经济性仍定制。Haystack、Prefect 和 Weave 有公开商业表面，但已抓取材料披露的清晰标价少于
              LangSmith、Langfuse、Braintrust 或 Temporal。竞争含义是：LangChain
              既不是最便宜的选择，也不是最开放的选择。它的定价容易理解，但相邻对手越来越让买方只购买自己需要的那一层。
