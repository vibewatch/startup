  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与 OSS 到付费漏斗
        blocks:
          - type: paragraph
            body: >-
              LangChain 的客户表面最好理解为两层系统。外层是巨大的 OSS 采用：LangChain 和 LangGraph 仓库仍有大量 stars，Python 下载量很大，JavaScript
              包也有广泛依赖使用。这种触达很重要，因为它为构建者、创业公司和企业团队制造了宽阔的发现和原型漏斗，让他们在购买前先测试智能体框架。但变现层更窄，也更具体。公开的 LangSmith 和 Deployment
              材料显示，框架使用正在转向基于账户的可观测性、部署、安全和治理。换句话说，很多人在用 LangChain；公开证明为付费 LangSmith 或 LangGraph Deployment 客户的人要少得多。


              买方、用户和付款方也按分层分化。在公开客户故事里，平台工程师和 AI
              团队通常是买方；客户支持运营者、物业经理、物流团队或产品经理则是日常用户。一旦自托管、RBAC、数据留存和区域部署变得重要，付款方看起来会转向中央工程、IT、安全或采购职能。已命名的垂直组合全球且很宽——金融科技、物流、企业工作流、房地产、网络安全、编程智能体和电商——但公开证据仍偏向大企业和成熟产品团队，而不是一个广泛披露的
              SMB 付费基础。这一区分很关键：OSS 需求已经很大，但付费客户深度仍主要通过筛选过的客户案例可见，而不是披露的商业账本。
