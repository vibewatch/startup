      - number: '7.2'
        title: 法律、隐私、合规和安全风险
        blocks:
          - type: paragraph
            body: >-
              第二组风险与法律和信任有关：LangChain
              告诉企业它可以托管、追踪、评估，有时还部署智能体工作负载，这意味着公司贴近个人数据、专有提示词、用户互动以及由客户控制的集成。公开法律与合规材料方向上让人安心，但并不完整。LangChain
              有隐私政策、正式条款文件、DPA 签署路径，以及提到 SOC 2 Type II 报告、HIPAA 和 GDPR
              政策、渗透测试摘要、当前分包处理方列表的信任流程。但这些文件也写得很清楚，第三方产品集成可能转移客户数据，LangChain
              对这些第三方产品排除责任，且平台不保证不中断，也不保证完全阻止未经授权的第三方访问。这一点重要，因为近期漏洞记录是真实的，不是假设：NVD 和 GitHub 公告描述了 LangChain 与 LangGraph
              组件中的 SSRF、路径遍历、SQL 注入和不安全 checkpoint 反序列化暴露，独立报道则认为这些缺陷可能暴露文件、密钥或下游云面。另一个方向上，EU AI Act、ICO 指引和 FTC AI
              执法活动都指向同一个结论：如果由 LangChain 支撑的部署进入受监管、权利敏感或营销敏感的工作流，日志、文档、安全、数据处理和声明佐证的预期都会大幅提高。
