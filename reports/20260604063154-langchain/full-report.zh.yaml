      - number: '5.2'
        title: 架构、运营模型、部署与依赖
        blocks:
          - type: paragraph
            body: >-
              公开运营模型比“营销层 SDK”故事扎实得多。Memory 文档显示，生产使用默认假设 checkpointing 和持久状态，并把 PostgreSQL 作为严肃持久化路径。部署文档则围绕
              assistants、threads 和 runs 定义运行时模型；components 页面把商业架构讲得更清楚：Agent Server、LangGraph CLI、Studio、Python / JS
              SDK、RemoteGraph、控制平面和数据平面。云文档进一步说明，LangSmith 不只是包在 traces 上的一层 UI。它运行在托管 GCP 和 AWS 基础设施上，使用
              Kubernetes、object storage、Postgres、Redis、ClickHouse、edge networking 和 rate-limiting 层；扩展指南则点名 API
              servers、queue workers、Redis 和 Postgres 是主要吞吐依赖。这样的架构让 LangChain 从本地实验走向托管生产有可信路径，也把依赖地图讲清楚：模型供应商在
              LangChain 之外，编排耐久性依赖 checkpoint stores，运行时性能依赖 queue tuning、storage performance 和 cloud
              primitives。langchain-aws 仓库和 Azure marketplace 定位也强化了这一点：这个栈是为了接入外部云，而不是取代外部云。尽调判断是：架构可信，但运营上并不简单。
