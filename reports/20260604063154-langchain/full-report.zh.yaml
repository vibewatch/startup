      - number: '2.2'
        title: 多重 TAM 视角、相互矛盾的估算，以及 SAM 为什么仍模糊
        blocks:
          - type: paragraph
            body: >-
              公开市场记录支撑一个大品类，但无法给出干净的 LangChain 专属 TAM、SAM 和 SOM 递进。ABI 最宽的口径把 AI 软件估为 2025 年 USD 174.1 billion、2030 年
              USD 467 billion；仅生成式 AI 就从 2024 年 USD 37.1 billion 走到 2030 年 USD 220 billion。这些数字有方向价值，因为它们证明企业 AI
              软件已经是很大的预算池，也明确点出部署工具、可观测性和 MLOps 是可变现层。但这些口径太宽，不能直接承销 LangChain。更窄的代理是 AI-agents
              品类。这里，当年估算聚得较紧：MarketsandMarkets 对 2025 年给出 USD 7.84 billion，Grand View 给出 USD 7.63 billion，Fortune
              Business Insights 给出 USD 8.03 billion。问题在终点差异：同一批发布方给出的终值从 2030 年 USD 52.62 billion 一路分散到 2034 年 USD
              251.38 billion。这个缺口反映的是时间跨度、边界和方法论不同，不是可投资级共识。实际结论是：广义 TAM 明确存在，智能体运行时 SAM 很可能有意义，但任何精确的 LangChain SOM
              都需要公司私有数据，而不是公开报告。
