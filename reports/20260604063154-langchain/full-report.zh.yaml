  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的战略风险
        blocks:
          - type: paragraph
            body: >-
              LangChain 最高严重度的风险不是单次宕机或诉讼，而是开源商品化与提供商原生打包同时打到公司试图变现的层。OpenAI 现在提供 Responses API、内置工具、Agents SDK
              和集成可观测性；Microsoft、AWS 和 Google 也各自销售托管运行时，把托管、监控、记忆、安全和身份内置进去。Anthropic 和更广的 MCP
              生态也在把工具连接标准化，降低切换摩擦。独立市场分析已经把编排视作快速商品化的一层，基础链式调用、重试和工具使用越来越像标配，而不是稀缺 IP。LangChain
              在开发者心智、工作流深度和中立定位上仍有真实优势，但它的变现面正落在这轮融合的冲击范围内。如果企业买方认为云原生栈已经够用，LangChain 可能被卡在上端免费的 OSS
              漏斗和下端云厂商打包采购之间。公司自己的合同条款限制竞争性基准测试和与 LangSmith 竞争，防御上可以理解，但也说明保护定价权已经是一个正在发生的问题，而不是已经解决的问题。
