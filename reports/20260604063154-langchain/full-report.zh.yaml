      - number: '3.3'
        title: 切换成本、分发力与多栖使用
        blocks:
          - type: paragraph
            body: >-
              LangChain 确实制造了一些切换成本，但大部分藏在表面之下。如果团队只是把 LangChain 当作模型 API 上的一层薄脚手架，仍可以以有限痛感更换模型，甚至替换整个框架。团队一旦依赖
              LangGraph 持久化、checkpoint 和 LangSmith 部署，成本就会上升，因为状态、调试工作流和运营者习惯开始依赖 LangChain Inc. 的表面。即便如此，公司自己的文档也说
              LangGraph 可以不依赖 LangChain 运行，评论来源也认为开放协议和直接 SDK 让生态保持相对可迁移。实际判断是中等锁定，不是 Azure 级锁定。


              各玩家的分发力并不均衡。Microsoft 拥有最强企业伙伴位置，因为 Semantic Kernel 天然搭乘 Azure OpenAI 支出和 Microsoft 工具体系。CrewAI 宣称已被 63% 的
              Fortune 500 使用。Langfuse 宣称覆盖 Fortune 50 中 19 家和超过 100,000 名工程师，说明开源可观测性即使不拥有运行时，也能进入大客户。Temporal 和 Prefect
              受益于既有工作流和平台预算，不必让买方批准一套全新的智能体栈。LangChain 的反制力量是开发者分发：TechCrunch 报道其估值 $1.25 billion、GitHub stars
              118,000，官方栈也仍异常宽。但竞争图景仍指向多栖使用。买方可以把 LangChain 与 Langfuse 搭配，把 LangGraph 与 Temporal
              式持久性模式配对，或在更简单工作负载中完全跳过框架。
