        - 相邻厂商越来越多地让买家保留 LangChain、替换 LangSmith
        - 按账户分层衡量 LangSmith 实际挂载率和多产品使用情况
      - - LangGraph 持久化带来粘性
        - Temporal 和 Prefect 不要求采用 LLM 优先框架，也能解决耐久性问题
        - 高
        - 工作流引擎直接售卖抗崩溃执行、重试、审批和可移植性
        - 测试 LangGraph 在生产运维中是否显著优于通用工作流引擎
      - - 广泛 OSS 分发具有耐久性
        - 历史流失和迁移成本可能把分发优势变成技术债负担
        - 高
        - 独立评测提到抽象层过深、破坏性变更和重写风险
        - 按 LangChain 主要版本索取队列留存和升级转化数据
      - - 跨模型中立厂商定位
        - 开放标准和直接 SDK 会整体降低框架依赖
        - 中
        - 评测来源明确建议许多场景直接用 SDK 或薄自定义层
        - 量化有多少客户仅把 LangChain 当作提供商 SDK 外的一层薄封装
      - - 企业扩张速度可超过竞争者
        - Microsoft 渠道杠杆和 CrewAI 面向业务用户的打法，在大客户中可能分发强于 LangChain
        - 中
        - Semantic Kernel 搭上 Azure 预算；CrewAI 主打企业治理和 Fortune 500 渗透
        - 收集企业试点和续约中对 Microsoft、CrewAI 的赢单 / 输单数据
      - - 定价梯度可控
        - 不限用户数和创业公司额度替代方案会压缩 LangSmith 及相邻界面的付费意愿
        - 中
        - Braintrust 避开按席位约束；Langfuse 和 Temporal 都补贴创业公司试用
        - 对前 20 个生产账户的混合每用户、每工作流经济性做基准比较
    notes: 严重性是分析师对未来 12-24 个月内留存、扩张或毛利率耐久性可能受影响程度的排序判断。缓释项写成尽调要求，不预设管理层会采取这些动作。
