      - number: '6.3'
        title: 留存、耐久度与参考质量缺口
        blocks:
          - type: paragraph
            body: >-
              耐久度仍是 LangChain 客户故事中公开信息最弱的一环。在已审阅材料中，没有披露 NRR、GRR、churn、cohort
              留存、付费客户数或产品级收入组合。这不意味着留存故事不好；它只意味着留存仍主要从工作流关键性、分阶段上线 纪律，以及部分买方把 LangGraph 或 LangSmith
              嵌入经常性运营系统这一事实中推断。Lyft 的分阶段上线模型、monday 的实时监控、Podium 的支持团队使用，以及 ServiceNow
              的售后工作流野心，都指向重复使用潜力。但这些参考都不能替代合同层数据或 cohort 曲线。客户满意度同样如此：有些故事引用 CSAT 提升、AI 解决率提升或幻觉控制措施，但公开记录仍缺少续约率或合同期限证据。


              参考质量在改善，但仍不均衡。许多最强故事来自 LangChain 自有客户故事页面，这些页面有用且新，但天然带有筛选性。独立佐证确实存在——Elastic 公开描述在面向用户的安全产品中使用 LangSmith
              和 LangGraph，GitLab 的设计文档也显示 LangGraph
              被放进一个受严格控制的企业架构——但这类证据仍是例外，不是常态。净结果是：客户章节能扎实证明相关性和部署严肃性，但只能部分证明耐久度。LangChain
              现在可以指向有可衡量结果的严肃具名用户；它仍无法公开证明其中有多少会续约、扩张，或集中贡献公司的收入基底。
