  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以工作流定义产品，并映射模块
        blocks:
          - type: paragraph
            body: >-
              LangChain 已经不适合再被描述成单一开源框架。已留存的 2025-2026 产品证据显示，它是一个分层栈，工作流分工清楚。在开源边缘，LangChain 是快速启动的
              脚手架：开发者选择一个模型，加入工具和 middleware，再用 create_agent 跑起工具调用循环。LangGraph
              是该循环下方更底层的运行时，为持久状态、interrupt、persistence 和长时间执行而建。商业化上移一层到 LangSmith：追踪、评测、部署，以及 Fleet 或 Studio
              等相邻表面，把团队从原型走向生产后最终需要的运营工作打包起来。这一区分很重要，因为 LangChain 自己的 1.0 材料称，软件包已经重设计以收窄范围，并回应早期抽象过重的反馈。JS 包证据也有用：它明确把
              @langchain/core 和 LCEL 与更高层的 langchain 包、LangGraph.js 运行时分开。结合集成文档，产品地图支撑了这样一条工作流：团队从供应商无关的构建 primitives
              起步，升级到有状态编排，然后购买商业可观测性、评测和部署。
