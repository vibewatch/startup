  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图与买方要完成的任务
        blocks:
          - type: paragraph
            body: >-
              LangChain 竞争的场域比“框架”这个词暗示的更宽。直接的代码优先对手包括 LlamaIndex、Haystack、Microsoft Semantic Kernel、AutoGen 和
              CrewAI：它们都帮助开发者拼装智能体、工具调用、记忆和工作流逻辑，但强调的买方任务不同。LangChain 卖的是广度：自己的文档把栈拆成三层，LangChain 做脚手架，LangGraph
              做有状态运行时，LangSmith 做追踪、评测和部署。LlamaIndex 更窄、更以数据为中心，围绕企业数据的解析、索引和上下文增强。Haystack 偏模块化流水线和显式控制。Microsoft 通过
              Semantic Kernel 和历史 AutoGen 路线竞争，把智能体开发绑到 Azure 时代的企业关系上。CrewAI 则从相反方向切入，控制平面对运营和业务用户更友好。


              相邻竞争集合也很重要，因为 LangSmith 预算不等于 LangGraph 预算。Langfuse、Phoenix、Braintrust 和 Weave 卖的是可观测性和评测，不是顶层智能体
              脚手架；因此买方可以保留 LangChain 做编排，同时替换 LangSmith。Temporal 和 Prefect
              是低一层的替代品：它们是工作流引擎，可以承载重试、审批和长时间执行，而不必采用专用智能体框架。对工作流简单、延迟敏感或高度定制的团队，内部自建和直接 SDK 组合仍然可行。因此，LangChain
              是真实的平台竞争者，但不是通向生产智能体的唯一可信路径。
