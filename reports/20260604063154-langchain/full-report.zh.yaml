              里程碑记录显示，LangChain 已从一个开源包演进成更宽的企业智能体栈。LangGraph 在 January 2024 推出，让构建者获得比传统 chain 更高的控制力。随后，LangChain 自己的
              2024 使用报告显示商业化和产品收敛在加速：LangSmith 注册接近每月 30k，LangGraph 追踪已覆盖 43% 的 LangSmith 组织。托管运行时在 May 14, 2025
              跨过重要门槛：近 400 家公司使用 beta 后，LangGraph Platform 达到 GA；到 October 2025，这一部署层已改名为 LangSmith Deployment，因为
