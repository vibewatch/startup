      - number: '6.4'
        title: 扩张路径、集中度风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              LangChain 的扩张逻辑有说服力。商业栈自然从 OSS 试用爬升到 LangSmith 追踪和评估，再进入部署、治理以及更广的多智能体编排。公开案例以不同方式显示了这条路径：C.H. Robinson
              从订单接收扩展到更广的物流自动化，AppFolio 将 Realm-X 扩到更多动作和数据模型，Rakuten 同时服务企业客户和员工，ServiceNow
              则试图覆盖从线索资格认定到续约、倡导的完整客户生命周期。这是典型的先落地、再扩张形态，也是为什么即使缺少队列数据，客户故事仍然重要。


              但同一模式也带来集中度和采购风险。公开账本仍是一组经过筛选的旗舰引用，而不是已披露的客户基数，因此无法量化头部客户敞口，也无法判断少数企业合同是否主导 ARR。一旦客户需要自托管、混合部署、区域控制、自定义
              SSO 或细粒度成本控制，采购也明显转向销售主导。LangChain
              自家论坛上的欧盟部署投诉尤其有价值，因为它显示，从热情开发者走到完全部署的企业客户，许可模式、区域端点处理和支持升级都会拖慢进程。因此，LangChain
              在产品市场契合度上很强，在扩张潜力上也可信，但可量化集中度和扣除摩擦后的成交速度仍略显脆弱。正确的尽调问题不只是「有哪些 logo？」，而是「这些 logo 里谁在付费、续约、扩张，并且能在企业规模下轻松上线？」
