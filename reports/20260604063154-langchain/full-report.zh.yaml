  - id: TP003
    title: 定价 / 套餐比较
    columns:
      - 产品
      - 公开套餐 / 计费单位
      - 标价
      - 包含能力
      - 未知项 / 合约模式
      - 影响
    rows:
      - - LangSmith
        - 席位 + 追踪 + 部署用量
        - $39/seat/mo Plus；企业定制
        - Developer 含 1 个免费席位，Plus 含 10k 基础追踪，可走向生产部署
        - 企业定价定制；开源 LangChain 本身仍免费
        - 从开源使用到团队可观测性 / 部署，变现阶梯清晰
      - - LlamaParse
        - 积分 / 月
        - 1,000 积分 = $1.25；Starter 最高 $500/mo；Pro 最高 $5,000/mo
        - 10k 免费积分，解析 / 索引 / 抽取工作流，企业混合部署
        - 商业价格对应摄取服务，不是整个框架运行时
        - 文档密集型工作负载很强，但对通用智能体编排不够直接
      - - Haystack / deepset
        - 开源核心 + 企业联系销售
        - 抓取材料未披露公开标价
        - 开源框架，加商业定制应用 / 智能体销售主张
        - 商业报价需要销售推进
        - 定价不透明会增加销售摩擦，但适合更大的企业交易
      - - CrewAI
        - 工作流执行量 + 企业定制
        - 免费含 50 次执行 / 月；企业定制
        - 可视化构建器、连接器、追踪、治理、私有基础设施选项
        - 企业经济性和超额费用均为定制
        - 起步便宜；仅凭公开材料较难对比它与 LangChain 或 Temporal 的 TCO
      - - Langfuse
        - 单位 / 月 + 附加项
        - 免费；$29/mo Core；$199/mo Pro；$2,499/mo Enterprise
        - 追踪、评估、提示词管理、更长留存、安全、审计日志、SCIM
        - 仍收取用量超额和团队附加项费用
        - 激进标价让它在可观测性上容易挑战 LangSmith
      - - Braintrust
        - 平台费 + 用量
        - $0/mo 核心版；$249/mo 付费层；企业定制
        - 不限用户数、评测、数据集、Topics、安全 / 合规升级
        - 主题、数据和评分超额按用量计费
        - 不限用户数打包在席位经济性上挤压 LangSmith
      - - Phoenix
        - OSS 自托管 + 免费云入口
        - 开源自托管；2 个 Phoenix Cloud 实例免费
        - 追踪、评测、实验、提示词 IDE、OTel 埋点
        - 抓取材料中未公开企业云 / 商业条款
        - 团队若把可移植性放在捆绑厂商栈之前，这是很好的低成本入口
      - - W&B Weave
        - 用量纳入 W&B 平台定价
        - 抓取材料中未单独发布独立 Weave 标价
        - 用 Python / TypeScript 库观察、调试和评测 LLM 应用
        - 价格发现取决于更广泛的 W&B 商业关系
        - 在 ML 团队中有装机基础优势，但面向纯智能体买家的打包透明度较低
      - - Temporal Cloud
        - 月度计划 + 用量
        - $100/mo Essentials；$500/mo Business；Enterprise 定制
        - 耐久工作流云、动作、存储，高阶档位含 SSO/SCIM，创业公司额度
        - 不是智能体编排框架；总构建成本仍包括模型 / 评测层
        - 可靠性比框架原生抽象更重要时，是强替代方案
      - - Prefect Cloud
        - 已发布云定价页；OSS 核心仍免费
        - 无法从抓取文本中可靠提取详细公开档位条款
        - 可移植 Python 工作流、状态恢复、审批、可观测性、事件自动化
        - 商业打包需要在抓取文本之外继续跟进
        - 团队想要工作流耐久性、但不想购买专用智能体框架时，是有用替代方案
    notes: 本表比较公开标价，或明确标出缺失标价。除非厂商明确打包模型成本，所有价格均不含模型提供商支出。未知项保持显式留白，而不是凭记忆回填。
