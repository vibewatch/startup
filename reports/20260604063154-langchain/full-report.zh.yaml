  - id: TM005
    title: 规模测算和采用尽调缺口表
    columns:
      - 缺口
      - 当前公开状态
      - 重要性
      - 精确尽调路径
    rows:
      - - LangChain 特定 SOM
        - 留存的公开来源没有按细分市场拆出付费市场份额、已部署智能体数量或产品线收入。
        - 缺少这些，近端份额假设只能靠猜。
        - 要求提供产品线收入、已部署智能体数量和细分层面的付费组织数据。
      - - DIY 与付费平台拆分
        - 公开来源描述了替代方案，但没有量化相邻支出中有多少留在直接 API 加内部代码工作流。
        - 可争夺 SAM 取决于到底有多少需求会离开现状。
        - 要求提供相对 DIY 和云原生替代方案的赢单 / 输单数据以及管线结构。
      - - 按套餐层级划分的买方经济性
        - 定价披露席位、追踪和部署计费，但不披露 ACV、追踪量队列或预算负责人组合。
        - 需要这些，才能把自下而上的采用转成企业收入质量判断。
        - 要求提供 ACV 分布、套餐组合，以及按合约队列拆分的预算负责人。
      - - 统一口径的市场估算映射
        - AI 软件、生成式 AI 和 AI 智能体发布方采用的边界和预测周期不同。
        - 未统一口径的数据会高估对 TAM 和增长预测的信心。
        - 估值建模前，将每个留存估算统一到年份、地域和纳入支出口径。
    notes: 这些缺口保留公开证据的边界，不从宽泛市场报告里制造虚假的精确度。
