    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品栈与规模标记
        blocks:
          - type: paragraph
            body: >-
              LangChain 更适合被理解为一家智能体工程公司：它从 Harrison Chase 在 late-2022 的开源项目长出来，而不是第一天就按完整创业公司启动。时间线很重要。第一个 LangChain
              Python 包在 October 24, 2022 发布；已留存公开记录则把公司成立放在 early 2023，法律注册日为 January 31, 2023。这一分拆解释了常见说法中 LangChain
              “创立于” 2022 的由来：项目起点是 2022，公司则是 early-2023 成立，并有联合创始人 Ankush Gola。当前身份标记更扎实。LangChain 的关于页面和第三方追踪器都把总部锚在
              San Francisco，公司也公开列出 New York、Boston 和 Amsterdam 办公室。产品栈已经清楚：LangChain OSS 负责快速创建智能体，LangGraph
              负责低层编排和持久化运行时控制，LangSmith 负责可观测性、评测和部署。最有证据支撑的规模标记多数仍来自公司说法，而非经审计运营指标，但数字很具体：每月 100M+ 开源下载、6K+ 活跃
              LangSmith 客户、Fortune 10 中 5 家是 LangSmith 客户、服务 35% 的 Fortune 500，以及累计下载超过 1B。
