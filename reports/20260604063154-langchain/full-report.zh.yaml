      - number: '5.3'
        title: 可靠性、支持、信任、隐私与安全控制
        blocks:
          - type: paragraph
            body: >-
              LangChain 的公开信任表面真实存在，但不完整。正面看，公司开放了实时 LangSmith status page，不只提供核心应用和 API 的 uptime 指标，也覆盖 control
              plane、Fleet、Sandboxes 等部署专用服务。知识库事故文章给出具体支持流程：先看状态页，再把持续问题升级给支持团队。技术文档比泛泛的企业文案走得更深。Auth 文档区分了 SaaS API-key
              默认模式和自托管 bring-your-own-auth 模式，并展示 authorization handlers 如何限定资源范围。隐私文档解释 CLI 记录什么 telemetry、如何关闭
              tracing，以及本地开发数据何时留在本地。加密文档给出了 AES-at-rest 或 per-tenant / KMS-backed encryption
              的具体环境变量和路径。告警和扩展文档说明，平台对运营质量有明确主张，而不只是 prompt engineering。缺口在具体性。企业文档会把买方引向隐私、留存和安全 /
              合规资源，但已留存公开页面没有给出足够细的认证范围、trust-center artifacts 或合同 SLA 条款，无法不经追问就承销这些说法。因此，信任仍是尽调跟进事项，不是已关闭问题。
