  - id: TP001
    title: 竞品画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 关键限制
    rows:
      - - LangChain / LangGraph / LangSmith
        - 集成式直接竞争栈
        - 2025 年 10 月以 $1.25B 估值融资 $125M；据报 GitHub 星标 118k
        - 从原型到生产构建智能体应用的开发者和产品团队
        - 同一供应商覆盖框架、状态化运行时、追踪、评估和部署
        - 护城河主要是工作流捆绑；定价不是最低，锁定效应中等而非强硬
      - - LlamaIndex / LlamaParse
        - 直接同类
        - 10,000+ 个团队使用商业解析套餐
        - 数据密集型智能体构建方、文档工作流、企业知识工具
        - 在专有数据的解析、索引、上下文增强和事件驱动工作流上最强
        - 通用框架比 LangChain 更窄；付费面集中在摄取工作流
      - - Haystack / deepset
        - 直接同类
        - 官方材料称有数千个团队；抓取材料中企业定价不透明
        - 需要模块化 RAG、搜索和明确管线控制的团队
        - 组件 + 管线设计，可灵活混用供应商，核心开源
        - 商业打包不够透明；部署 / 评估捆绑叙事弱于 LangChain
      - - Microsoft Semantic Kernel
        - 直接 / 邻近既有厂商同类
        - Microsoft 分发能力和 Azure 预算入口；声称 Fortune 500 使用
        - 已在 Microsoft 工具上标准化的企业开发者
        - 插件 / OpenAPI 中间件、模型切换、遥测，企业适配强
        - 不是 LangChain 系列那样的完整可观测性 + 部署捆绑平台
      - - Microsoft AutoGen
        - 传统直接同类
        - 曾有企业采用，但现在进入维护模式
        - 既有多智能体项目，以及留在 Microsoft 生态的团队
        - 有辨识度的多智能体模式库和事件驱动架构
        - 生命周期风险高，因为 Microsoft 将新用户导向更新框架
      - - CrewAI
        - 直接同类
        - 公司称 63% 的 Fortune 500 在使用；免费版 + 企业定制
        - 运维 / 运营较重、需要基于角色的多智能体控制的业务工作流团队
        - 可视化编辑器、控制平面、治理、连接器、支持、私有基础设施
        - 对复杂定制逻辑来说，若要摆脱其强主张模型，成本可能很高
      - - Langfuse
        - 邻近可观测性 / 评估
        - 声称覆盖 Fortune 50 中 19 家、100k+ 工程师、每月 10B+ 条观测
        - 不更换运行时，只购买追踪、评估、提示词和实验的团队
        - 开源、可自托管、OTel 原生，明确主打无锁定
        - 无法替代核心智能体框架或持久运行时
      - - W&B Weave
        - 邻近可观测性 / 评估
        - 借力 Weights & Biases 存量客户；定价并入更大的 W&B 平台
        - 增加 LLM 追踪和评估的既有 W&B 用户
        - 在熟悉的 ML 工具栈内提供可观测性和 LLM 评判
        - 独立智能体平台商业化路径的证据少于 LangSmith 或 Langfuse
      - - Braintrust
        - 邻近可观测性 / 评估
        - 免费核心版、$249/mo 付费层、企业定制，不限用户
        - 优化提示词、模型和发布的跨职能 AI 产品团队
        - 团队级追踪、评估、数据集、自动化和质量门
        - 不拥有编排运行时；预算捕获比完整栈更窄
      - - Arize Phoenix
        - 邻近可观测性 / 评估
        - 声称每月 2.5M+ 下载、GitHub 星标 9k+
        - 优先考虑开源智能体调试和评估的构建者
        - OpenTelemetry 原生、可自托管，明确传达无专有锁定
        - 商业变现能见度低于 LangSmith 或 Braintrust
      - - Temporal
        - 替代方案 / 编排既有厂商
        - 云套餐 $100/mo 起；初创公司抵扣最高 $6k
        - 对可靠性敏感的工作流、审批和长期运行的有状态流程
        - 防崩溃的持久执行，以及买方已理解的工作流经济性
        - 不是智能体框架；用户仍需要模型、工具和评估层
      - - Prefect
        - 替代方案 / 编排既有厂商
        - 声称每月 200M 个数据任务；广泛开源社区
        - 需要可移植流程、重试、审批和事件的 Python 团队
        - 原生 Python、供应商可移植性、可恢复状态、动态运行时
        - 智能体原生抽象弱于 LangChain、CrewAI 或 LlamaIndex
      - - 内部自建 / 直接 SDK
        - 替代方案 / 现状演进
        - 使用既有工程预算，而不是新增平台支出
        - 工作流简单、延迟要求严格或记忆 / 状态需求特殊的团队
        - 可移植性最高、抽象债最少；最容易避开框架锁定
        - 内部工程负担最高，开箱即用的评估 / 部署体验最弱
    notes: 画像行覆盖章节简报强调的具名直接同类、邻近玩家、工作流替代方案和内部自建选项。规模采用已披露融资或采用代理指标；列表价格缺失时，限制列会明确说明。
