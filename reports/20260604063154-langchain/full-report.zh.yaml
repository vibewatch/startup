  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 安全退化
        - 新的 LangChain 或 LangGraph 严重漏洞，或野外利用
        - 任何严重 CVE 若 14 天内没有客户补丁或缓释计划，或连续季度反复披露高严重度问题
        - 暂停承销判断；继续推进前要求 SBOM、补丁 SLO 和事故沟通证据
      - - 供应商原生能力商品化
        - 企业订单输给 OpenAI、Foundry、Bedrock 或 Google 原生栈
        - 连续两次企业赢单 / 输单复盘将云原生栈已足够作为原因，或可观测性和部署 SKU 出现明确价格压缩
        - 下调增长和利润率假设；重新评估 LangSmith 是否仍占据高溢价控制平面细分市场
      - - 可用性与韧性
        - LangSmith 或上游供应商正常运行时间恶化
        - LangSmith API 季度正常运行时间低于 99.5%，或上游模型事故反复出现且没有优雅故障切换证据
        - 在给予企业级可靠性信用前，要求 SLA 和故障切换架构
      - - 合规证据缺口
        - DPA、子处理方、SOC 2 或 AI 治理材料产出缓慢或不完整
        - 无法在尽调窗口内提供所需材料
        - 限制对受监管客户上行空间的敞口，并推迟敏感垂直领域承销判断
      - - 渠道集中
        - 单一云或供应商渠道主导预订额或收入
        - 超过 40% 的 ARR 或预订额绑定单一云市场、模型供应商或采购计划
        - 施加集中度折价，并要求多元化计划
      - - 人员与路线图蔓延
        - 没有授权归属或产品修剪证据
        - 下一次董事会周期前仍没有具名继任者、安全负责人或路线图关停清单
        - 限制持仓规模，或在运营治理清晰前暂缓
    notes: 阈值刻意设得具体，便于投资决策从叙事风险评估转向可观察的运营触发因素。
