      - number: '4.5'
        title: 图表
        blocks:
          - type: callout
            title: OSS 人气之外，真实商业动作已经存在
            body: >-
              LangChain 不是只在变现名声。公开定价、云市场采购和客户案例都显示，围绕可观测性、部署和无代码智能体，已经有真实商业栈。关键问题不是 LangChain
              能不能收费，而是这些收费中有多少是耐久、高质量的经常性收入，多少只是可变用量。
            calloutType: strength
            claimRefs:
