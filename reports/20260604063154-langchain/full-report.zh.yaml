      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比泛泛的企业 AI 头条更技术化。LangChain 的核心楔子是开发者主导的 LLM 应用团队、AI 平台团队，以及需要可复用方式来搭建和运营智能体工作流的工程组织。日常用户是开发者、ML
              或平台工程师，以及需要追踪行为、调提示词、监控成本和管理长时间状态的相邻技术运营者。付款方通常从工程或 AI 工具预算起步，因为 LangSmith
              早期用户按席位打包，追踪和部署按用量计费。部署风险上升后，预算归属可以上移到
              CIO、架构或转型项目，这些角色更关心治理、规模和结果经济性。已留存来源中的采用路径也符合熟悉模式。团队通常从一个具体试点或工作流问题开始，遇到生产故障模式后加入可观测性和评测，然后才扩展到托管部署和更广的平台治理。LangGraph
              的公开公司客户说法和云厂商采用指引说明，大企业里已经有生产使用，但购买动作看起来仍更偏自下而上、用例驱动，而不是一个集中式自上而下的平台命令。
