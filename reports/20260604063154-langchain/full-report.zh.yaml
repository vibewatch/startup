      - number: '1.3'
        title: 融资历史、投资人组合与披露缺口
        blocks:
          - type: paragraph
            body: >-
              LangChain 的融资历史已经足够支撑阶段和所有权问题，尽管股权结构本身仍未公开。最清晰的顺序是 April 2023 由 Benchmark 领投的 $10M 种子轮、February 2024 由
              Sequoia 领投的 $25M Series A，以及 October 20-21, 2025 宣布的 $125M 融资，估值 $1.25B。TechCrunch 和 Tracxn
              都佐证了最新融资；Tracxn 还报告四轮总融资 $260M，并显示 July 2025 有一笔中间 Series B。最新投资人组合很重要，因为它混合了纯 VC 和战略、企业名字，包括
              CapitalG、ServiceNow、Workday、Cisco、Datadog 和 Databricks。这支撑了这样一种商业模式：开源采用导入商业 LangSmith
              变现和企业分发。仍缺失的，是后期私有公司投资人真正关心的细节：二级流动性历史、债务或信贷额度、所有权集中度、董事会权利，以及战略投资人绑定的具体商业承诺。公开运营披露也不完整。下载量和客户数可见，但收入 /
              ARR 不可见，员工数也只能来自第三方追踪器估算。
