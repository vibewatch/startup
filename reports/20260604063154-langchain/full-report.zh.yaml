  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              LangChain 的有效市场比“AI 软件”窄，也比“一个开源 Python 库”宽。已留存公司来源描述了三层相互连接的产品：作为应用框架的 LangChain、作为低层编排运行时的
              LangGraph，以及作为框架无关可观测性、评测和部署层的
              LangSmith。对承销来说，最干净的公开边界是：位于基础模型和业务工作流之间的智能体工程平台。因此，纳入支出包括用于设计智能体循环、连接模型和工具、管理长时间状态、追踪和打分输出，以及用治理控制部署生产智能体的工具。排除支出同样重要。原始模型训练支出、GPU
              和云基础设施消耗、横向 SaaS 预算，只有在直接映射到智能体构建或智能体运营工作流时才计入。替代集合也不止一个竞争对手。LangChain 既与 LlamaIndex、Haystack、Semantic
              Kernel 等开源框架竞争，也与 Microsoft、AWS、Google 的云托管智能体平台竞争，还与一种现状竞争：开发者直接调用模型 API，再加刚够上线工作流的定制代码或检索。Anthropic
              的指引是主要反向提醒：并非每个工作流都需要完整平台，有些团队用简单、可组合的模式就能停住，这限制了相邻 AI 活动中有多少会变成 LangChain 可触达支出。
