  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: regulatory-register
    missingEvidence: Full DPA exhibits, current subprocessor list by deployment mode, and the underlying SOC 2 / pen-test
      materials referenced by the Trust Center workflow.
    whyItMatters: These artifacts determine whether LangChain can truly satisfy privacy, residency, and regulated-customer
      diligence beyond marketing-level assurances.
    diligencePath: Request Trust Center access, executed DPA exhibits, regional subprocessor matrix, and latest external audit
      summaries.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: ARR, bookings, and gross-margin mix by AWS, Azure, Google marketplace channel and by major model-provider
      attachment.
    whyItMatters: Public channel announcements show procurement breadth but not whether commercialization is dangerously concentrated
      in a single partner or low-margin deployment path.
    diligencePath: Request channel P&L, committed-spend exposure, renewal rates, and partner-driven pipeline contribution.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: governance-depth
    missingEvidence: Current board roster, committee ownership, named security leader, and founder succession plan.
    whyItMatters: Founder concentration and multi-product scope are manageable only if governance and delegated operating
      ownership are already institutionalized.
    diligencePath: Request board materials, org chart, committee charters, and succession discussion notes.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: sla-credits
    missingEvidence: Public or contractual SLA and service-credit commitments for LangSmith API, deployment control plane,
      and sandbox surfaces.
    whyItMatters: Status pages show real uptime history, but investors still cannot judge contractual downside protection
      or customer tolerance for operational misses.
    diligencePath: Request master service agreement exhibits, SLA documents, and incident postmortem samples.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TR002
    - TR005
