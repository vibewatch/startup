- calloutType: risk
  title: Security posture is improving, yet public evidence still shows live enterprise trust risk
  body: The company has a public security policy, a trust workflow, and visible hardening work, but the 2025-2026 disclosure
    set is broad enough that buyers should treat patch discipline and deployment isolation as core diligence items rather
    than hygiene boxes.
  claimRefs:
