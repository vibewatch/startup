tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / issue
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - AI Act and rights-sensitive deployment obligations
    - EU
    - Act in force; high-risk obligations apply when customer workflows enter regulated use cases
    - medium
    - high
    - Keep neutral platform posture, provide logging and human-oversight features, and segment restricted customer use cases
    - Exposure depends on what customers actually build with LangChain and whether LangChain is contractually in the provider/deployer
      chain
    - Request customer mix by regulated use case plus AI Act mapping for logging, oversight, and documentation
  - - Privacy, DPA, subprocessors, and trace-data handling
    - US / EU / global
    - Privacy policy, DPA path, trust workflow, retention controls, and subprocessor references exist
    - medium
    - high
    - Use DPA, retention settings, customer VPC or self-hosted options, and privacy review gates
    - Exact subprocessor scope and deployment-mode differences are not visible from public sources alone
    - Request DPA exhibits, subprocessor matrix by region and deployment mode, and deletion workflow evidence
  - - Third-party products and customer-data transfer risk
    - Contractual / cross-border
    - Terms explicitly allow data exchange with enabled Third Party Products and disclaim third-party security and interoperability
      liability
    - medium-high
    - high
    - Require explicit customer approval, least-privilege integrations, and allowlists for external tools
    - Integration breadth can expand blast radius faster than LangChain can centrally govern every partner path
    - Request top integrations by usage plus security review cadence and disablement controls
  - - IP, benchmarking, and competing-product restrictions
    - Contractual / IP
    - Terms bar reverse engineering, developing competing products, and publishing comparative benchmarks
    - medium
    - medium
    - Negotiate carve-outs and rely on LangChain's stated indemnity for authorized use
    - Benchmark limits and carve-outs for older self-hosted releases or third-party combinations can still constrain enterprise
      posture
    - Request enterprise paper on benchmark rights, indemnity caps, and exceptions for regulated testing
  - - Regulator scrutiny of misleading AI claims
    - US / UK / EU
    - FTC enforcement and ICO/AI Act guidance show active scrutiny on deceptive AI claims, rights impacts, and governance
    - low-medium
    - medium-high
    - Tie sales claims to evals, documentation, and approved reference use cases
    - Risk rises if marketing promises reliable agents faster than controls can support them
    - Request approved claims library, evaluation methodology, and customer-reference governance process
  notes: Rows rank the most material legal and regulatory exposures evidenced by public contracts, regulator guidance, and
    security-compliance materials; public records do not expose every contract schedule or customer-specific obligation.
  enumerationScope:
    coverage: partial
    basis: Rows enumerate the highest-severity public legal and regulatory exposures visible from fetched contracts and regulator
      materials, but public sources do not expose every subprocessor, customer deployment class, or negotiated enterprise
      carve-out.
