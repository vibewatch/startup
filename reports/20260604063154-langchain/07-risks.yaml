- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security regression
    - New critical LangChain or LangGraph flaw or exploit-in-the-wild
    - Any critical CVE with no customer patch or mitigation plan inside 14 days, or repeated high-severity disclosures in
      consecutive quarters
    - Pause underwriting and require SBOM, patch-SLO, and incident-communication evidence before advancing
  - - Provider-native commoditization
    - Enterprise losses to OpenAI, Foundry, Bedrock, or Google-native stacks
    - Two consecutive enterprise win-loss reviews citing cloud-native stack sufficiency, or clear price compression on observability
      and deployment SKUs
    - Haircut growth and margin assumptions; reassess whether LangSmith still owns a premium control-plane niche
  - - Availability and resiliency
    - LangSmith or upstream-provider uptime deterioration
    - LangSmith API uptime below 99.5% for a quarter, or repeated upstream model incidents without graceful failover evidence
    - Require SLA and failover architecture before assigning enterprise-grade reliability credit
  - - Compliance evidence gap
    - Slow or incomplete production of DPA, subprocessor, SOC 2, or AI-governance artifacts
    - Inability to furnish requested artifacts inside diligence window
    - Restrict exposure to regulated-customer upside and defer underwriting on sensitive verticals
  - - Channel concentration
    - One cloud or provider channel dominates bookings or revenue
    - More than 40% of ARR or bookings tied to a single cloud marketplace, model vendor, or procurement program
    - Apply concentration discount and require diversification plan
  - - People and roadmap sprawl
    - No evidence of delegated ownership or product pruning
    - No named successor, no security owner, or no roadmap kill list by next board cycle
    - Cap position size or hold pending operating-governance clarity
  notes: Thresholds are intentionally concrete so investment decisions can move from narrative risk assessment to observable
    operating triggers.
