- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Prototype a tool-using agent quickly
    - Wire a model, prompt, and tool loop by hand in each provider SDK
    - Use LangChain create_agent with tools and middleware
    - Cuts boilerplate and standardizes the core loop across providers
    - Abstraction can feel heavy when developers want direct low-level control.
  - - Switch model providers without rewrites
    - Refactor app code for each provider-specific API shape
    - Use standardized model interfaces and provider packages
    - Reduces lock-in and speeds model experimentation
    - Provider-specific extras still require package- or model-level tuning.
  - - Run long-lived stateful agent workflows
    - Build custom state machines, queues, and resume logic
    - Use LangGraph checkpoints, interrupts, and durable execution
    - Enables pause/resume, memory, and human approval flows
    - Requires explicit workflow design and storage tuning.
  - - Debug and monitor production agent behavior
    - Read scattered logs and infer failure points manually
    - Trace runs with LangSmith observability, dashboards, and alerts
    - Improves root-cause analysis for latency, errors, and quality regressions
    - Requires tracing instrumentation and sustained ops discipline.
  - - Evaluate quality before and after launch
    - Run ad hoc prompt tests with little historical linkage
    - Use LangSmith offline datasets plus online evaluators on live traffic
    - Creates a repeatable pre/post-deployment quality loop
    - Public docs do not expose standardized enterprise evaluation economics.
  - - Deploy and scale agent runtimes
    - Own custom containers, APIs, queues, and state plumbing
    - Use LangSmith Deployment / Agent Server with cloud or self-hosted modes
    - Provides one-click or managed paths plus assistants, threads, and runs
    - Still depends on queue, database, and concurrency configuration choices.
  - - Operate under enterprise controls
    - Assemble auth, encryption, retention, and support ad hoc
    - Use LangSmith auth, encryption, tracing controls, status, and support runbooks
    - Raises baseline operational rigor for regulated or sensitive workloads
    - Public certification scope and SLA specifics remain incomplete.
  notes: Benefits are limited to public product claims and documentation, not to audited customer ROI or benchmarked deployment outcomes.
