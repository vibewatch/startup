  evidenceGaps:
  - type: missing-source
    severity: material
    topic: compliance-specificity
    missingEvidence: A retained public artifact that explicitly lists certification scope, audit cadence, trust-center controls, and region-by-region compliance coverage for LangSmith.
    whyItMatters: Enterprise underwriting cannot treat generic references to security and compliance as equivalent to verified certifications or scoped attestations.
    diligencePath: Request the current trust-center export, SOC 2 report bridge letter, DPA, and any HIPAA/GDPR implementation notes used in sales or procurement.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: support-sla
    missingEvidence: Contractual support terms, escalation paths, response-time targets, and uptime SLA language by commercial tier.
    whyItMatters: Status pages and KB guidance do not substitute for enterprise support commitments when the product becomes a production dependency.
    diligencePath: Obtain sample order forms, MSA/SLA exhibits, and premium support documentation tied to LangSmith deployment tiers.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: module-adoption
    missingEvidence: Module-level adoption and usage metrics for Deployment, Fleet, Studio, and other commercial surfaces.
    whyItMatters: The product map is clear, but underwriting moat and execution quality improve if adoption is visible below the top-line LangChain download story.
    diligencePath: Ask management for SKU-level customer counts, active deployments, and enterprise attach rates across LangSmith modules.
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: minor
    topic: independent-performance-benchmarks
    missingEvidence: Independent benchmarks validating claimed acceleration, scaling behavior, or cost improvements from Deployment and NVIDIA-related optimizations.
    whyItMatters: Partner announcements and docs show feature direction, but not neutral evidence on realized throughput, latency, or cost gains in production.
    diligencePath: Request customer benchmark decks, reference architectures, and redacted production telemetry for comparable workloads.
    relatedTableRefs:
    - TE005
