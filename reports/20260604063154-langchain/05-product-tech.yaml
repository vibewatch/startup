chapter:
  number: 5
  title: Product & Technology
  summary: 'LangChain now exposes a layered agent-engineering stack rather than a single library: LangChain OSS handles the high-level agent harness, LangGraph provides durable orchestration, and LangSmith commercializes observability, evaluation, and deployment. Public technical evidence is strongest around provider abstraction, stateful runtime design, and a real deployment/control plane; it is weaker on certification specificity, contractual support terms, and module-level adoption disclosure. The technical verdict is positive on workflow coverage and pace of execution, with real diligence attention required on secure configuration, abstraction overhead, and enterprise assurance detail.'
sections:
- id: product-stack-and-workflow
  title: Product definition in workflow terms and module map
  body: 'LangChain is no longer best described as a single open-source framework. The retained 2025-2026 product evidence shows a layered stack with a clear workflow split. At the open-source edge, LangChain is the fast-start harness: a developer chooses a model, adds tools and middleware, and runs a tool-calling loop with create_agent. LangGraph is the lower-level runtime underneath that loop, built for durable state, interrupts, persistence, and long-running execution. Commercialization happens one layer up in LangSmith, where tracing, evaluation, deployment, and adjacent surfaces such as Fleet or Studio package the operational work that teams eventually need once agents move from prototype to production. The distinction matters because LangChain''s own 1.0 materials say the package was redesigned to narrow scope and respond to feedback that earlier abstractions were too heavy. The JS package evidence is also useful: it explicitly separates @langchain/core and LCEL from the higher-level
    langchain package and LangGraph.js runtime. Combined with the integrations documentation, the product map supports a workflow where teams start with provider-agnostic build primitives, graduate to stateful orchestration, and then buy commercial observability, evaluation, and deployment.'
