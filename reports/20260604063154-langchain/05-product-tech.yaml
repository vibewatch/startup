- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / metric
  - Status
  - Scope
  - Gap
  rows:
  - - API-key auth and custom auth handlers
    - Documented
    - LangSmith SaaS defaults to x-api-key; self-hosted leaves auth design to the operator
    - Need fuller public examples of enterprise IdP patterns and default hardening for self-hosted installs.
  - - Authorization filters and ownership metadata
    - Documented
    - Threads, runs, assistants, and related resources can be scoped through auth handlers
    - Need independent proof of how these controls are commonly deployed in production.
  - - PII middleware and human approval gates
    - Documented
    - LangChain guardrails cover PII detection/redaction and human approval for sensitive tools
    - Need clearer public mapping from middleware examples to enterprise audit/compliance requirements.
  - - Tracing and telemetry controls
    - Documented
    - CLI analytics can be disabled and tracing can be turned off; local dev can stay local
    - Need simpler public explanation of default telemetry posture across every product surface.
  - - Encryption at rest
    - Documented
    - AES key support plus custom per-tenant or KMS-backed encryption for Agent Server data
    - Need public reference architectures for key rotation and managed KMS deployments.
  - - Regional hosting and data residency
    - Documented
    - Cloud regions span GCP US/EU/APAC and AWS US with named storage backends
    - Need clearer public statement of exactly which enterprise features vary by region.
  - - Reliability and alerting surface
    - Documented
    - Public status page and configurable alerts cover uptime, cost, latency, and errors
    - Need contractual SLA language and incident-history exports for diligence.
  - - Security advisory posture
    - Mixed / improving
    - Public advisories cover checkpoint deserialization and LangSmith prompt-pull trust boundaries, with mitigation guidance and fixes published
    - Need clearer public summary tying CVEs to safe default configurations by deployment mode.
  - - Compliance and certifications
    - Partially visible
    - Enterprise docs point buyers to security/compliance resources
    - Retained public pages do not expose sufficiently specific certification scope, trust-center detail, or audit artifacts.
  notes: Status reflects what the retained public pages make explicit. It does not imply the absence of additional private enterprise controls.
