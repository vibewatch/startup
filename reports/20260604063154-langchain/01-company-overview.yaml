  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and broader executive-team disclosure for LangChain.
    whyItMatters: Without public board and bench detail, investors cannot assess governance independence, succession planning, or operating depth beyond the founders.
    diligencePath: Request the current board deck or cap-table/governance summary and an org chart showing all current executive roles.
    relatedQuestionRefs:
    - QO008
    - QO009
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cap-table detail, secondary history, debt facilities, and any investor board-right or observer-right terms.
    whyItMatters: Late-stage valuation alone does not reveal dilution, liquidation preferences, strategic-investor constraints, or founder control.
    diligencePath: Request the latest cap table, round documents, debt schedule, and any side letters or commercial-right summaries tied to strategic investors.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Canonical revenue, ARR, gross margin, and net retention data for LangChain and LangSmith.
    whyItMatters: Without revenue and efficiency metrics, the company's valuation and go-to-market efficiency cannot be benchmarked properly against infrastructure peers.
    diligencePath: Request management KPI dashboards or board materials that show ARR, customer mix, margin profile, and retention by cohort.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A company-issued current headcount and location mix that reconciles tracker-level employee estimates with legal-entity disclosures.
    whyItMatters: Headcount informs burn, hiring pace, and operating leverage, but the only retained numbers are third-party approximations rather than management disclosure.
    diligencePath: Request the latest HR headcount report split by function and geography.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table chronology
    missingEvidence: Confirmation that no material financing, leadership, regulatory, or major partnership events are omitted from TO004's public chronology.
    whyItMatters: The milestone table is the chapter's chronology of record, so a partial public event list can hide timing or sequencing issues that matter for diligence.
    diligencePath: Request an internal milestone ledger or board update timeline and reconcile it against the public chronology.
