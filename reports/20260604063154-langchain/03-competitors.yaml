company:
  name: LangChain
chapter:
  number: 3
  title: Competitors
  summary: 'LangChain has one of the broadest agent stacks in the market because it spans harness, runtime, tracing, evaluation, and deployment. That breadth is commercially valuable, but the market is fragmenting by budget layer: LlamaIndex and Haystack attack data-centric orchestration, CrewAI and Microsoft attack distribution and enterprise fit, while Langfuse, Braintrust, Phoenix, Weave, Temporal, Prefect, and internal build all lower lock-in by letting buyers replace only one layer at a time. The result is a real but only moderately durable moat.'
sections:
- id: landscape-and-buyer-jobs
  title: Landscape and buyer jobs to be done
  body: "LangChain competes in a wider arena than the word \"framework\" implies. The direct code-first rivals are LlamaIndex, Haystack, Microsoft Semantic Kernel, AutoGen, and CrewAI: each helps developers assemble agents, tool calls, memory, and workflow logic, but they emphasize different buyer jobs. LangChain sells breadth: its own docs split the stack into LangChain for the harness, LangGraph for stateful runtime, and LangSmith for tracing, evaluation, and deployment. LlamaIndex is narrower and more data-centric, centered on parsing, indexing, and context augmentation over enterprise data. Haystack leans toward modular pipelines and explicit control. Microsoft competes through Semantic Kernel and the legacy AutoGen path, tying agent development to Azure-era enterprise relationships. CrewAI competes from the opposite direction, with a more operations- and business-user-friendly control plane.\n\nThe adjacent competitive set matters because LangSmith budget is not the same as LangGraph\
    \ budget. Langfuse, Phoenix, Braintrust, and Weave all sell observability and evaluation rather than the top-level agent harness, which means a buyer can keep LangChain for orchestration while replacing LangSmith. Temporal and Prefect are substitutes one layer lower: they are workflow engines that can host retries, approvals, and long-running execution without adopting a dedicated agent framework at all. Internal build and direct SDK composition remain viable for teams whose workflows are simple, latency-sensitive, or unusually custom. That makes LangChain a real platform contender, but not the only credible path to production agents."
