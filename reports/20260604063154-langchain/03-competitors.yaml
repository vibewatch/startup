- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - current evidence
  - mitigation / diligence ask
  rows:
  - - Integrated stack from build to deploy
    - Observability/eval budgets split to Langfuse, Braintrust, Phoenix, and Weave
    - High
    - Adjacent vendors increasingly let buyers keep LangChain while replacing LangSmith
    - Measure actual LangSmith attach rate and multi-product usage by account segment
  - - LangGraph persistence creates stickiness
    - Temporal and Prefect win the durability problem without requiring an LLM-first framework
    - High
    - Workflow engines market crash-proof execution, retries, approvals, and portability directly
    - Test whether LangGraph meaningfully outperforms generalized workflow engines in production ops
  - - Broad OSS distribution is durable
    - Historical churn and migration cost can turn distribution into technical-debt liability
    - High
    - Independent reviews cite abstraction depth, breaking changes, and rewrite risk
    - Request cohort retention and upgrade-conversion data by major LangChain release
  - - Neutral vendor position across models
    - Open standards and direct SDKs reduce framework dependence altogether
    - Medium
    - Review sources explicitly recommend direct SDKs or thin custom layers for many cases
    - Quantify what share of customers use LangChain only as a thin wrapper over provider SDKs
  - - Enterprise expansion can outrun rivals
    - Microsoft channel leverage and CrewAI's business-user motion can out-distribute LangChain in large accounts
    - Medium
    - Semantic Kernel rides Azure budgets; CrewAI markets enterprise governance and Fortune 500 penetration
    - Gather win/loss data against Microsoft and CrewAI in enterprise pilots and renewals
  - - Pricing ladder is manageable
    - Unlimited-user and startup-credit alternatives compress willingness to pay for LangSmith and adjacent surfaces
    - Medium
    - Braintrust avoids per-seat constraints; Langfuse and Temporal both subsidize startup trials
    - Benchmark blended per-user and per-workflow economics for top 20 production accounts
  notes: Severity is an analyst ordinal judgment on likely impact to retention, expansion, or gross-margin durability over the next 12-24 months. Mitigation asks are written as diligence requests, not as assumed management actions.
