  summary: Compact readout of the economics and durability signals that matter most for LangChain's competitive position. The story is positive on breadth and developer distribution, but adverse on price compression and lifecycle risk.
  data:
    items:
    - label: LangSmith Plus list price
      value: $39/seat/mo
      detail: Simple list pricing helps monetization but is easy to benchmark against rival observability vendors
    - label: LangChain reported valuation
      value: $1.25B
      detail: TechCrunch reported a $125M round at this valuation in Oct 2025
    - label: AutoGen lifecycle
      value: Maintenance mode
      detail: Microsoft now points new users to its newer agent framework path
    - label: Temporal cloud entry price
      value: $100/mo
      detail: Durable workflow substitutes are affordable enough to trial early
    - label: Langfuse enterprise list price
      value: $2,499/mo
      detail: Observability challengers have explicit public enterprise packaging
    - label: Explicit no-lock-in sellers
      value: 3 named rivals
      detail: Langfuse, Phoenix, and Prefect all explicitly market portability or no lock-in
