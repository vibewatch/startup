- id: TP003
  title: Pricing / packaging comparison
  columns:
  - product
  - public package / unit
  - headline price
  - included capability
  - unknowns / contract model
  - implication
  rows:
  - - LangSmith
    - Seat + traces + deployment usage
    - $39/seat/mo Plus; Enterprise custom
    - 1 free seat on Developer, 10k base traces on Plus, deployment path into production
    - Enterprise pricing custom; OSS LangChain itself remains free
    - Clear monetization ladder from OSS use to team observability/deployment
  - - LlamaParse
    - Credits / month
    - 1,000 credits = $1.25; Starter up to $500/mo; Pro up to $5,000/mo
    - 10k free credits, parsing/indexing/extraction workflows, enterprise hybrid deployment
    - Commercial price is for ingestion services, not whole-framework runtime
    - Strong for document-heavy workloads, less direct for generic agent orchestration
  - - Haystack / deepset
    - Open-source core + contact sales for enterprise
    - Public list price not disclosed in fetched materials
    - Open-source framework plus commercial custom apps/agents pitch
    - Commercial quotes require sales motion
    - Opaque pricing raises sales friction but can fit larger enterprise deals
  - - CrewAI
    - Workflow executions + enterprise custom
    - Free with 50 executions/mo; Enterprise custom
    - Visual builder, connectors, tracing, governance, private infra options
    - Enterprise economics and overages are custom
    - Cheap to start; harder to benchmark TCO versus LangChain or Temporal from public materials
  - - Langfuse
    - Units / month + add-ons
    - Free; $29/mo Core; $199/mo Pro; $2,499/mo Enterprise
    - Tracing, evals, prompt management, higher retention, security, audit logs, SCIM
    - Usage overages and team add-on still apply
    - Aggressive list pricing makes it an easy LangSmith challenger for observability
  - - Braintrust
    - Platform fee + usage
    - $0/mo core; $249/mo paid; Enterprise custom
    - Unlimited users, evals, datasets, Topics, security/compliance upgrades
    - Usage-based topic, data, and scoring overages apply
    - Unlimited-user packaging pressures LangSmith on seat economics
  - - Phoenix
    - OSS self-host + free cloud entry
    - Self-host open source; 2 Phoenix Cloud instances free
    - Tracing, evals, experiments, prompt IDE, OTel instrumentation
    - Enterprise cloud/commercial terms not public in fetched materials
    - Excellent low-cost entry for teams prioritizing portability over a bundled vendor stack
  - - W&B Weave
    - Usage under W&B platform pricing
    - Standalone Weave list price not separately published in fetched materials
    - Observe, debug, and evaluate LLM apps with Python/TypeScript libraries
    - Price discovery depends on broader W&B commercial relationship
    - Installed-base advantage with ML teams, but packaging is less transparent for pure agent buyers
  - - Temporal Cloud
    - Monthly plan + usage
    - $100/mo Essentials; $500/mo Business; Enterprise custom
    - Durable workflow cloud, actions, storage, SSO/SCIM at higher tiers, startup credits
    - Not an agent harness; total build cost still includes model/eval layers
    - Strong substitute when reliability matters more than framework-native abstractions
  - - Prefect Cloud
    - Cloud pricing page published; OSS core remains free
    - Detailed public tier terms not reliably extractable from fetched text
    - Portable Python workflows, state recovery, approvals, observability, event automations
    - Commercial packaging requires follow-up beyond fetched text
    - Useful substitute where a team wants workflow durability without buying a dedicated agent framework
  notes: This table compares public list pricing or the absence of it. All prices exclude model-provider spend unless the vendor explicitly packages those costs. Unknowns are left explicit rather than backfilled from memory.
