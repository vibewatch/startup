  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Public list pricing for deepset's commercial Haystack layer, Weave as a standalone AI-agent product, and detailed Prefect Cloud tiers was not fully extractable from fetched public materials.
    whyItMatters: Pricing opacity affects the real comparison against LangSmith and Temporal because buyers may face materially different expansion economics than public list pages imply.
    diligencePath: Request current quotes or marketplace screenshots from deepset, Weights & Biases, and Prefect sales teams; compare landed annual cost for a representative 10-seat production deployment.
    relatedQuestionRefs:
    - QP018
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: distribution-proof
    missingEvidence: LangChain does not publicly disclose attach rates from LangChain OSS usage into LangGraph or LangSmith production deployments, nor a win/loss matrix against Microsoft, CrewAI, and workflow-engine substitutes.
    whyItMatters: Without attach-rate and competitive win-rate data, the durability of LangChain's apparent developer distribution advantage remains an inference rather than a demonstrated commercial moat.
    diligencePath: Request pipeline conversion, paid account penetration, net expansion, and top-20 competitive displacement data segmented by direct peer, observability peer, and workflow substitute.
    relatedQuestionRefs:
    - QP022
    - QP027
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: migration-incidence
    missingEvidence: The adverse migration-cost evidence comes mainly from review sources and anecdotes rather than a broad independent dataset of actual LangChain customer rewrites or churn after breaking releases.
    whyItMatters: If real migration pain is lower than the review literature implies, LangChain's churn risk may be overstated; if it is higher, the moat could weaken faster than this chapter assumes.
    diligencePath: Look for release-by-release retention data, public postmortems from engineering teams, and customer reference checks focused on upgrade burden and total cost of ownership.
    relatedQuestionRefs:
    - QP024
    - QP027
  - type: private-evidence-only
    severity: minor
    topic: partner-access
    missingEvidence: Public sources describe Microsoft's channel strength and CrewAI's enterprise reach, but do not quantify reseller economics, partner-led wins, or direct versus partner-sourced revenue against LangChain.
    whyItMatters: Partner access can dominate enterprise adoption even when product capability looks similar, especially in regulated or procurement-heavy accounts.
    diligencePath: Ask management for partner-generated pipeline, Azure marketplace contribution, SI relationships, and the share of large-account wins driven by channel partners versus inbound developer adoption.
    relatedQuestionRefs:
    - QP022
