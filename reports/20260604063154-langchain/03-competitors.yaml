  - CP027
callouts:
- calloutType: strength
  title: The integrated stack is LangChain's real differentiator
  body: LangChain is one of the few vendors that can sell the full arc from agent harness to stateful runtime to tracing, evaluation, and deployment under one brand. That reduces procurement sprawl and makes the platform easier to adopt inside a fast-moving engineering organization.
  claimRefs:
  - CP004
  - CP022
- calloutType: risk
  title: Lock-in exists, but rivals are actively teaching buyers how to avoid it
  body: OpenTelemetry-native observability vendors, direct-SDK guidance, and generalized workflow engines all reduce the odds that LangChain can trap buyers in a single proprietary stack. The company has to keep winning on product quality, not just on ecosystem inertia.
  claimRefs:
  - CP024
  - CP026
  - CP028
  - CP040
- calloutType: insight
  title: Budget separation matters more than feature parity
  body: The most important competitive fact is that buyers can split spend across layers. LangChain may win the harness, but lose observability to Langfuse or Braintrust and lose durable execution to Temporal or Prefect. That makes attach rate, not just top-line adoption, the key moat metric.
  claimRefs:
  - CP037
  - CP040
  - CP043
