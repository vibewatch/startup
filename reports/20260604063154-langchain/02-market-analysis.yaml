  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Public product-line revenue, paid-organization counts, or deployed-agent volumes that isolate LangChain’s paid footprint by segment.
    whyItMatters: Without company-specific segment data, any SOM or penetration model becomes arbitrary.
    diligencePath: Request product-line revenue mix, paid org counts, and deployed-agent volume by customer segment and geography.
    relatedQuestionRefs:
    - QM008
    - QM024
    relatedTableRefs:
    - TM005
  - type: missing-source
    severity: material
    topic: diy-share
    missingEvidence: A credible public estimate for how much adjacent agent-engineering work is still done with direct APIs, internal code, or cloud-native stacks instead of third-party platforms.
    whyItMatters: This determines how much of the adjacent AI-agent spend is contestable for LangChain rather than remaining status-quo internal build.
    diligencePath: Request win-loss notes, pipeline composition, and deployment telemetry that separates framework-led deals from internal-build or native-cloud alternatives.
    relatedQuestionRefs:
    - QM016
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Public ACV, trace volume, deployment-run mix, and budget-owner splits across LangSmith Developer, Plus, and Enterprise customers.
    whyItMatters: Pricing tiers show packaging, but they do not reveal which buyer cohorts actually monetize at scale.
