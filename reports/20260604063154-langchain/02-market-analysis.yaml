    - Developer tooling to build agent loops, connect models and tools, and reuse integrations
    - Raw foundation-model revenue or generic coding tools with no agent workflow layer
    - Engineering, AI platform, or developer-tools budget
    - Core entry point for LangChain framework adoption
  - - Agent orchestration runtime
    - State management, persistence, memory, human-in-the-loop, and long-running workflow runtime software
    - Generic workflow automation without LLM or agent-state orchestration
    - Platform engineering, architecture, or automation owners
    - Core LangGraph wedge for complex production agents
  - - Observability, evaluation, and deployment
    - Tracing, online evals, debugging, managed deployment, and security-oriented runtime controls
    - Generic APM, BI, or log tools that do not understand agent traces
    - Engineering tooling first, then broader IT or platform governance
    - Core LangSmith monetization layer and adjacent spend pool
  - - Managed cloud agent platforms
    - Cloud-native agent runtimes, governance layers, and deployment services
    - General cloud spend not tied to agent applications
    - Central cloud and transformation budgets
    - Important adjacency that can expand or commoditize SAM
  - - Status-quo internal build
    - Direct model APIs plus internal code, retrieval, prompts, and hand-built monitoring
    - Unrelated SaaS or infrastructure projects
    - Individual builders, engineering managers, or internal platform teams
    - Key substitute that limits how much adjacent AI activity converts into third-party platform spend
