- id: sizing-lenses
  title: Multiple TAM lenses, contradictory estimates, and why SAM stays fuzzy
  body: 'The public market record supports a large category, but not a clean LangChain-specific TAM, SAM, and SOM cascade. ABI’s broadest lens values AI software at USD 174.1 billion in 2025 and USD 467 billion in 2030, with generative AI alone moving from USD 37.1 billion in 2024 to USD 220 billion in 2030. Those numbers are directionally useful because they prove that enterprise AI software is already a very large budget pool, and they explicitly call out deployment tools, observability, and MLOps as monetizable layers. But they are too broad to underwrite LangChain directly. The narrower proxy is the AI-agents category. Here the current-year estimates cluster tightly, with MarketsandMarkets at USD 7.84 billion for 2025, Grand View at USD 7.63 billion for 2025, and Fortune Business Insights at USD 8.03 billion for 2025. The problem is the endpoint variance: the same publishers fan out from USD 52.62 billion by 2030 to USD 251.38 billion by 2034. That gap reflects different time horizons,
    boundaries, and methodologies, not a clean investment-grade consensus. The practical conclusion is that broad TAM is clearly real, agent-runtime SAM is plausibly meaningful, but any precise LangChain SOM would require private company data rather than public reports.'
