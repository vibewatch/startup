- id: TM005
  title: Sizing and adoption diligence gaps table
  columns:
  - gap
  - current public state
  - why it matters
  - exact diligence path
  rows:
  - - LangChain-specific SOM
    - No retained public source isolates paid market share, deployed-agent counts, or product-line revenue by segment.
    - Without this, near-term share assumptions are speculative.
    - Request product-line revenue, deployed-agent counts, and segment-level paid-org data.
  - - DIY versus paid-platform split
    - Public sources describe substitutes but do not size how much adjacent spend stays in direct API plus internal-code workflows.
    - Contestable SAM depends on how much demand ever leaves the status quo.
    - Request win-loss data and pipeline mix versus DIY and native-cloud alternatives.
  - - Buyer economics by plan tier
    - Pricing reveals seats, traces, and deployment billing but not ACV, trace-volume cohorts, or budget-owner mix.
    - Needed to translate bottom-up adoption into enterprise revenue quality.
    - Request ACV distribution, plan mix, and budget-owner by contract cohort.
  - - Normalized market-estimate mapping
    - AI software, generative AI, and AI-agent publishers use different boundaries and forecast horizons.
    - Unnormalized data can overstate confidence in TAM and growth forecasts.
    - Normalize every retained estimate to year, geography, and included spend before valuation modeling.
  notes: These gaps preserve where public evidence stops instead of manufacturing false precision from broad market reports.
