company:
  name: LangChain
chapter:
  number: 2
  title: Market Analysis
  summary: 'LangChain sits inside a narrow but rapidly formalizing layer of the AI software stack: agent engineering platforms that help teams build, orchestrate, evaluate, and deploy LLM applications. The cleanest public TAM lens is broad AI software or generative AI software, but the most decision-relevant SAM proxy is the AI agents and agent-runtime layer, where public estimates are materially smaller and methodologically inconsistent. Buyers are usually engineering and AI-platform teams that start with developer-led pilots, then expand spending when observability, governance, and managed deployment become mandatory. Growth drivers are strong, but cloud-native competition, governance friction, and the lack of a public LangChain-specific SOM should keep underwriting conservative.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: 'LangChain’s relevant market is narrower than “AI software” and broader than “an open-source Python library.” The retained company sources describe three connected layers: LangChain as the application framework, LangGraph as the low-level orchestration runtime, and LangSmith as the framework-agnostic observability, evaluation, and deployment layer. That is the cleanest public boundary for underwriting: agent engineering platforms that sit between foundation models and business workflows. Included spend therefore covers tools used to design agent loops, connect models and tools, manage long-running state, trace and score outputs, and deploy production agents with governance controls. Excluded spend is just as important. Raw model-training spend, GPU and cloud infrastructure consumption, and horizontal SaaS budgets only count when they directly map to agent-building or agent-operations workflows. The substitute set is also wider than one competitor. LangChain competes with other open-source
    frameworks such as LlamaIndex, Haystack, and Semantic Kernel; with cloud-managed agent platforms from Microsoft, AWS, and Google; and with a status quo where developers call model APIs directly and add just enough custom code or retrieval to ship a workflow. Anthropic’s guidance is the main adverse reminder that not every workflow needs a full platform: some teams can stop at simple composable patterns, which limits how much adjacent AI activity becomes LangChain-addressable spend.'
