            body: >-
              Kredivo 的公开留存证据有指向性，但不能盖棺定论。最强正面信号是 Kompas 所称用户平均每月交易超过 4 次，因为这说明 使用更像习惯，而不是一次性行为。Tempo 对 TransJakarta
              的报道提供了另一个有用视角：据称 42% 用户已把 PayLater 用在交通、健康和日常购物等生产性需求上，意味着产品正在嵌入反复发生的生活事件，而不只是可选消费。Medcom 的 Ramadan
              专题也强化了这个模式：2024 年 Ramadan 期间，线下交易同比增长 3x，Jabodetabek 以外和爪哇以外增长强劲， 用户偏年轻，集中在 20-35 岁。Krom 的 100
              万账户里程碑同样重要，因为管理层称，该里程碑是在尚未充分利用 Kredivo 已安装用户基础前自然达成；如果交叉销售奏效，未来有 land-and-expand 潜力。未解的下行点是集中度。公开来源没有展示
              商户集中度、头部伙伴收入占比、客户回款 cohort，或按客群划分的续约 / 流失。Samsung、TransJakarta、DBS、 BCA Digital
