      - number: '2.2'
        title: 市场规模口径与互相冲突的估算
        blocks:
          - type: paragraph
            body: >-
              每一种严肃的测算口径都说明，印尼足以支撑成规模的 BNPL 和数字信贷运营商；但数字会随方法论变化， 也取决于来源测的是 BNPL 支付额、替代贷款发放额、数字贷款余额，还是更宽的数字经济支出。
              Bain/Google/Temasek 2025 年印尼报告把整体数字经济 GMV 放在 US$99 billion，其中电商 US$71 billion， 数字贷款余额 US$13
              billion。BusinessWire 转引的 Research-and-Markets 摘要则把印尼 BNPL 市场估为 2025 年 US$9.12 billion、2026 年 US$11.15
              billion；PaymentBrief 采用更低的 2025 年 BNPL 估计， 为 US$8.59 billion。这些估计方向一致，但并不相同。正确结论不是押一个激进 TAM，而是保留区间，并把区间
              与渠道行为挂钩：BNPL 是更大电商和数字支付栈中有意义的一块，背后的数字贷款池还要更大。Kredivo 的可用 SAM
              最可能落在信用档案薄的消费者、合作商户结账场景和受监管资金能力的交集，而不是整个消费金融市场。
