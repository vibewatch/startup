      - number: '8.4'
        title: 最终结论是观察 / 继续研究，并设置可上调或下调观点的明确关口
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确的投资结论是观察 / 继续研究，置信度中等、风险评级高。这不是温和拒绝，而是对价格敏感的姿态。 Kredivo 比普通 BNPL
              故事更强，因为它有真实规模、战略投资者、银行基础设施和可见的运营验证。但缺失证据异常集中在最影响定价的地方：
              合并经济性、各放款批次损失明细、合作伙伴集中度、优先权悬置，以及银行表面强度有多少能自由转化为母公司的增长故事。
              几份新出现但质量不高的第三方目录和标签页，反向强化了这一点：公司有广泛能见度，也有许多具名合作伙伴， 但高质量、结构化的第三方估值数据很少。如果 Kredivo 能展示纪律性的资产质量、更清晰的母公司层面经济性，
              并以稳落在基准区间内的估值入场，观点可上调。若监管压力、资本消耗或损失强度恶化，而投资者仍被要求按接近历史峰值的标记买入，观点应下调。
