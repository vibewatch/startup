  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从 paylater app 到多产品消费金融栈
        blocks:
          - type: paragraph
            body: >-
              Kredivo 已交付的产品比 BNPL 标签更宽。当前 Android 列表仍展示经典核心：下月还、最长 24 个月分期、额度最高 IDR 50 million、快速审批，以及覆盖超过 10,000 家商户的
              2-click checkout。但同一个列表也显示，app 内可直接 缴公用事业费、充值、买券和申请个人贷款。历史和当前公司公告又叠加了更多层。2023 年 Series D 公告把平台描述为 覆盖线上线下
              BNPL、个人贷款，以及实体和虚拟信用卡。Infinite Card 公告让信用额度对接受 Mastercard 的线上商户 开放循环；Samsung Financing 合作则显示 Kredivo 能为大型
              OEM 运作品牌化融资流程，提供差异化定价且无需首付。 Krom 随后把用户流程从信贷推向主银行账户、存款、支付、QRIS 和银行发放贷款。GajiGesa 增加薪资关联流动性，
              越南则加入这套栈的跨境版本。做产品尽调时，关键点是 Kredivo 更像一套相互连接的信贷与银行工作流系统， 而不只是结账按钮。
