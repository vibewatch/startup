      - number: '4.4'
        title: 财务判断：收入管线可信，承销材料不完整
        blocks:
          - type: paragraph
            body: >-
              财务判断喜忧参半，但方向偏正面。Kredivo 有可信的收入管线：已披露的消费者定价、商户分发规模、反复获得的银行资金， 以及一家已经有体量、靠存款融资并在法定口径盈利的银行子公司。这强于许多私营 BNPL
              故事，后者往往先披露增长， 再补资金稳定性或存款深度。同时，公开证据仍没达到投资人真正承销所需的程度。Krom 报表显示，减值费用相对净利息收入
              很大，最终利润率高度取决于风控质量、回收和资金组合。公开来源也没有披露集团合并收入、毛利、现金消耗或实际商户 take rate，因此市场无法判断客户价值主张有多少靠补贴、有多少可以可持续变现。相较 Sea 的
              Monee 或 GoTo Fintech 等公开同行，Kredivo 对损失率和贡献利润披露少得多。因此，可投资解读不是模型弱，而是当前只部分透明：足以支持 建设性尽调姿态，但不足以跳过对 cohort、资金
              covenant 和 runway 的 data-room 追问。
