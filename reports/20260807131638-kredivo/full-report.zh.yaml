            body: >-
              公开架构叙事更偏运营，而不是深度技术文档，但已经具体到可以画图。公司和媒体来源反复把实时决策、替代数据风控和 开放循环商户网络描述为关键技术基础。Android
              列表称，开户通过连接数字账户完成；TechCrunch 称，Kredivo 评估信用时 使用来自电信运营商、电商账户和银行账户的数据，而不只依赖传统征信机构。Samsung 合作增加了白标部署模型：Kredivo
              在另一个品牌的用户体验背后管理融资产品。越南增加了本地伙伴模型：Kredivo 通过与 Phoenix Holding 的合资进入， 并使用 VietCredit 运营 paylater
              业务，铺开路径从账单支付和个人贷款推进到电商 BNPL。Krom 增加受监管银行层， 现已提供存款、QRIS 支付、交易历史和银行侧信贷产品。GajiGesa 增加雇主集成层，官方材料称企业可通过简单集成接入
              既有系统。共同模式很清楚：Kredivo 看起来不是靠开放公共开发者平台取胜，而是把自己的评分和资金逻辑嵌入伙伴、 商户、雇主和银行工作流。
