  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、嵌入式对手和钱包替代品
        blocks:
          - type: paragraph
            body: >-
              Kredivo 面对的不是单一竞争者类型。第一层是 Akulaku、Indodana、Atome 等直接 BNPL 专业玩家， 它们把分期信贷作为核心消费者主张。第二层在战略上更危险：Shopee
              PayLater、GoPay Later 这类隶属 超级 app 或市场平台的 paylater 产品。它们不只是替代贷款机构，而是嵌在高频商业或支付界面里，已经控制
              用户意图、结账位置和大量一方行为数据。第三层是 OVO、DANA 等钱包替代品；它们在公开网页上并不以专门 paylater
              品牌出现，但仍争夺交易频次、商户受理和消费者注意力。最后，Klarna、Affirm、Afterpay、PayPal
              等全球标杆显示了这个品类可能收敛的功能方向：卡、会员、购物发现和更广的消费金融生态。因此，竞争地图 不能只按品牌数量读，而要按渠道权力和产品边界读。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP029
      - number: '3.2'
        title: 本地竞争者画像及其公开披露
        blocks:
          - type: paragraph
            body: >-
              在本地专业玩家中，Akulaku 是披露最宽的对手。其官网声称拥有超过 90,000 个卖家、超过 1,000 个平台伙伴， 并明确宣传 Akulaku PayLater 给卖家带来的转化收益；它的金融业务也强调
              OJK 牌照，以及覆盖线上线下场景的 买卖双方融资模式。Indodana 的打法略有不同：它营销自己的 paylater 产品，但更值得关注的信号，是通过 Blibli、Tiket PayLater
              等联名项目分发，以及通过 QR 和条码流程接入线上线下商户。Shopee PayLater 和 GoPay Later 对独立规模披露较少，但更清楚地展示产品位于消费者旅程的哪里。Shopee 写明额度最高
              Rp50 million、多种分期期限和 app 内原生账单；GoPay 把 Later 放在更广的转账、支付和贷款 app 中，并披露 明确的利率下限和特定商户场景。Atome
              披露监管存在感，但其公开竞争叙事很大一部分留给第三方摘要。整体图景是， 本地对手的差异更多来自分发架构，而不是是否提供分期信贷这个基本事实。
