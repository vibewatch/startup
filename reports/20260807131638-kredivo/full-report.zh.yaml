      - number: '4.2'
        title: Krom 报表和公开动能代理指标如何说明经济性
        blocks:
          - type: paragraph
            body: >-
              Kredivo 不披露合并收入或 GMV，因此 Krom Bank 是集团内部最干净的公开运营代理指标。经审计 2025 年账目显示， 利息收入 Rp1.084 trillion、净利息收入 Rp965.1
              billion、减值费用 Rp632.6 billion、税前利润 Rp184.3 billion； 在 Rp12.214 trillion 资产和 Rp8.398 trillion 存款基础上，净利润
              Rp143.3 billion。2026 年 6 月中期报表显示， 银行进一步扩张至资产 Rp15.943 trillion、存款 Rp11.999 trillion、总贷款 Rp11.041
              trillion、1H26 净利息收入 Rp730.5 billion、税前利润 Rp93.8 billion，但仅 6 个月减值费用就达 Rp508.3 billion。换句话说，银行有利润、
              资金也充足，但信用成本仍是吞掉总息差的主要项。2026 年 6 月里程碑公告很重要，因为它增加了两个定性抵消： 管理层称，Krom 在尚未充分开发 Kredivo 用户基础前，已自然突破 100 万账户和
              Rp10 trillion 存款；并称自上线以来 一直保持盈利。独立代理指标让图景更强，但仍不足以补上尽调缺口。Bisnis 报道 2025 年 Ramadan 交易额增长 10%， TechCrunch
              引述管理层称 Kredivo 为其头部电商商户贡献 3% 到 4% 的 GMV。这些对需求和商户相关性有帮助，但不能 替代按产品 cohort 披露的贡献利润、CAC 或违约曲线。
