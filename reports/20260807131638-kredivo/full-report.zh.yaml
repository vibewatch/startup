        - 嵌入式电商平台对手
        - 集成在 Shopee 内；明确额度最高 Rp50 million、期限最长 24 个月
        - Shopee 结账购物者
        - 电商平台原生露出，叠加集团渠道银行合作
        - 主要留在 Shopee 生态和特定用户 / 等级内
      - - GoPay Later
        - 嵌入式超级应用对手
        - 由 GoTo 支撑，在日常支付 App 内提供借贷入口
        - GoFood、Tokopedia 和指定商户用户
        - 日常高频 App、广泛伙伴网络、可见利率下限
        - 作为专门 BNPL 平台的定位不够清晰
      - - Atome
