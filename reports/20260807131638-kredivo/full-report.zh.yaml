      - number: '2.3'
        title: 采纳闭环里的买方、用户和付费方
        blocks:
          - type: paragraph
            body: >-
              终端用户是想在没有传统信用卡的情况下获得结账弹性或短期限流动性的印尼个人消费者，但用户不是唯一的经济决策者。 商户和市场平台才是真正的商业买方，因为它们决定结账页是否展示
              BNPL，并通过商户折扣或合作分成实际为转化买单。 银行和机构资金方是风险流量的资产负债表买方，它们决定这套信贷模型是否值得给 channeling 额度和仓储融资。 钱包运营商和超级 app
              是相邻分销方，既可以把用户导入 BNPL，也可以把用户留在竞品支付闭环内。公开产品页显示， 这已经很主流：Kredivo 和 Indodana 都宣传 30 天或多月分期，额度最高 IDR 50
              million；OVO 和 DANA 仍主要把自己定位成钱包生态，而不是纯分期平台。也就是说，市场不只看借款人胃口，还看商户 AOV 提升、
              资金方信心，以及分发究竟落在电商、钱包、数字银行，还是公共交通和公用事业场景里。
