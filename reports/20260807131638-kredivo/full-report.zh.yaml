  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和支付栈背景
        blocks:
          - type: paragraph
            body: >-
              Kredivo 竞争的不是泛泛的「fintech TAM」；它卡在印尼电商结账、数字消费贷款和互操作支付基础设施的交叉口。
              应纳入的支出，是线上线下购买中的短周期消费融资，以及跑在同一套授信和还款轨道上的邻近个人信贷场景。 应排除房贷、大额抵押贷款、纯存款产品和企业资金支付。关键结构性抓手，是印尼支付系统快速标准化。 Bank
              Indonesia 的 QRIS 制度要求各服务商采用统一 QR 标准，且 QRIS 明确支持来自银行账户、银行卡、 信贷额度和服务器型电子货币的资金来源。落到实际，BNPL
              可以嵌入更大的钱包和银行生态，而不是孤零零地 做一座融资孤岛。因此 PaymentBrief 的市场地图很重要：印尼不只是规模大，也高度复杂；钱包、银行转账、 BI-FAST、银行卡和 COD
              都会因品类、客单价和地区不同而继续有效。
