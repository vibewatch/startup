              官方报道称，53.6% 的 Kredivo 用户如今来自二、三线城市，并描述了近 6 年 channeling 合作，支持客户采纳在地理上 继续扩宽，而不是在一线城市见顶。案例研究证据也重要。AVOW 2025
              年 Kredivo 案例研究称，install-to-loan 申请率为 46%，用户获取量增长 2.2x，通过 OEM 渠道的用户消费增长 4.7x；另一篇对 Kredivo
              绩效营销负责人的访谈强调，获批用户质量 比原始安装量更重要。以私营金融科技公司标准看，具名部署证据也异常具体：Samsung Financing、TransJakarta 支付， 以及在
