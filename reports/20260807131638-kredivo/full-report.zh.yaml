        - 持 OJK 牌照的金融主体；第三方市场指南显示分期期限最长 12 个月
        - 参与商户中的购物导向消费者
        - 商户主导的全渠道金融，贴近卡产品
        - 官网披露的定价细节少于 Shopee 或 GoPay
      - - OVO
        - 钱包替代品
        - 商户奖励和支付入口
        - 优先使用钱包支付和优惠的消费者
        - 高频钱包使用和商户关系
        - 公开网页没有把 OVO 定位成专门先买后付领导者
      - - DANA
        - 钱包替代品
