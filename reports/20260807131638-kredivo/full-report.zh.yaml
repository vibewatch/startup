        title: 关键佐证
        blocks:
          - type: callout
            title: 市场之所以大，是因为信贷需求嵌在更大的支付和电商流里
            body: Kredivo 不需要赢下整个印尼消费金融市场就能长很大；它只需要在快速增长的结账、数字贷款和二、三线采用通道中 守住一块稳定份额。
            calloutType: strength
            claimRefs:
