      - number: '8.3'
        title: 在尽调补齐最大缺口之前，基准情景应低于旧 SPAC 标记
        blocks:
          - type: paragraph
            body: >-
              基于情景的区间比单点估值更站得住。悲观情景下，公司仍重要，但主要按一家受严格监管的消费贷款机构来估值，并带有较高亏损和披露风险； 对应约 US$0.9-1.2 billion。基准情景下，Kredivo
              因市场领导地位、有意义的银行可选性和韧性的投资者支持获得认可， 但仍背负显著不透明折价；对应约 US$1.3-1.7 billion。乐观情景下，Krom 成为真正的资金和交叉销售引擎，
              印尼信贷质量保持可控，集团最终重新赢回接近 2021 年 SPAC 锚点所隐含的信心；估值回到 US$2.0-2.5 billion 附近。
              实际建议因此不是「不投」，而是「还不到什么价格都能投」。如果投资者只能在接近或高于历史 US$2.5 billion 标记的估值入场，
              且没有优先保护，今天的公开证据不支持这个风险回报。若入场价显著低于基准区间，或搭配更强尽调和下行保护，这个标的就有意思得多。
