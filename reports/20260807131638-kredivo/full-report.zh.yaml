            body: >-
              Krom 公开报表说明，核心尽调负担应继续放在信贷质量，而不是营收增长叙事上。Krom 已盈利且资本非常充足，但减值仍吞掉
              很大一部分息差。这意味着风控或催收只要中度走弱，就会很快传导到盈利质量。运营访谈证据也指向同一方向。Kredivo
              自己的营销负责人把欺诈描述为最大敌人，并拆分为用户层面的违约和安装层面的流量操纵。公司似乎用机器人、伙伴过滤、 MMP 工具和外勤催收作为缓释手段，但这些缓释手段也证明问题很重要，而不是已经解决。正面抵消是
              Krom 的法定偿付能力 和流动性足够强，可以吸收一部分波动。因此，投资人的风险不是马上资不抵债，而是快速增长、更广的二、三线渗透， 或必要消费场景可能让损失率上升速度快过定价、催收和资本再部署的反应。
