      - number: '2.4'
        title: 增长驱动、约束和时间点
        blocks:
          - type: paragraph
            body: >-
              Kredivo 市场的多头逻辑建立在四个可观察驱动上：印尼数字经济仍在增长，QRIS 和 BI-FAST 基础设施降低支付摩擦， 商户需要转化工具，核心都市圈外需求扩大。Bain 2025
              年印尼报告和多家印尼媒体都显示，数字金融、数字商业和 视频带货行为增长强劲。但摩擦清单现在同样重要。OJK 2025 年 BNPL 监管和 2026 年借款人筛查通函说得很清楚， 监管者不再把 pay-later
              当作轻监管的增长楔子。最低年龄和收入规则、还款能力上限、行业 NPF 上升，都把风控质量 变成闸门约束。PaymentBrief 还给出另一条运营警告：要覆盖全国，仍需要多种钱包方式、银行转账，且常常还要
              COD，这会让结账、欺诈和催收经济性更复杂。换句话说，采用率可以继续上升，同时市场也会对无差异贷款机构更难。 规模机会存在，但只有能给风险定价、为应收款融资、管住欺诈并让监管放心的运营商才能拿到。
