  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群横跨消费者、商户、银行、存款人和雇主
        blocks:
          - type: paragraph
            body: >-
              Kredivo 不再只服务一种买方或一种用户原型。Android app 仍显示熟悉的消费信贷客户：购物者在一长串线上线下商户中 使用下月还或更长期分期。但其他来源显示，邻近客群正在变得重要。Krom
              带来零售银行用户和存款人。GajiGesa 通过 B2B2C 已挣工资预支模式带来雇主和受薪员工。DBS、BCA Digital 等银行伙伴是经济上重要的交易对手，因为它们为信贷增长 提供资金或
              channeling。TransJakarta 表明使用场景已经扩散到日常交通支付，Samsung Financing 则显示具名 OEM
              关联设备买方。人口和地理组合也比「只面向雅加达高收入人群」的叙事更宽。DBS 2026 年披露和独立媒体都指向强劲的 二、三线渗透；Medcom 称，2024 年 Ramadan 交易中 71% 来自 20-35
              岁用户，雅加达以外甚至爪哇以外的使用都在快速增长。 实际结论是，Kredivo 的客户基础最好被读作借款人、消费人群、储蓄者、商户和分发伙伴组成的分层生态，而不是单一用户的 金融科技小众市场。
