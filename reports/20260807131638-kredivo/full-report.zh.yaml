  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 2026 年监管边界更清楚，也更不宽容
        blocks:
          - type: paragraph
            body: >-
              Kredivo 所在的印尼金融领域正在变得更有规则，且这一变化恰好发生在规模上升时。OJK 2025 年 12 月 BNPL 监管及其 2026
              年实施框架，把市场从解释空间较大的行业规则，推入面向银行和融资公司的专门制度。这有利于合法性，但也压缩了
              产品设计、营销、风控和资金披露走捷径的空间。最重要的新约束不是理论。公开法律和新闻来源提到借款人年龄和收入下限、 还款能力测试、融资来源和转让安排披露、融资公司 BNPL 产品需事先批准，以及 OJK
              终止运营或实施制裁的权力。 Kredivo 的关键在于，运营模式现在一次触及多个受监管层：数字信贷、银行子公司、第三方资金结构和海外扩张。
              顺风环境里，这种结构像选择权；承压环境里，它会变成多线合规和报告负担，监管者也有更多方式放慢增长。
