companyProfile:
  summary: >-
    Kredivo Group，前身 FinAccel，是一家由新加坡母公司控股的东南亚消费金融平台；其印尼核心业务把 BNPL、 个人贷款、商户金融和通过 Krom Bank 提供的数字银行串在一起。公司 2015 年成立，2016
    年在印尼运营起步， 随后从结账信贷扩展为覆盖 Kredivo、KrediFazz、Krom、GajiGesa，以及如今越南 Timo 的多品牌栈。
    公开披露显示，公司已经跑出真实规模、拿到有意义的银行资金和存款动能，并持续获得投资人支持；但合并母公司 经济性和当前公允价值仍有关键缺口。
