        - 同一资产最直接的公开估值标记
        - 形成于很不同的市场窗口，且从未完成
      - - Affirm
        - 公开 BNPL 披露深度
        - 公开年报和季报披露 APR、放贷方和产品信息
        - 披露风格上最接近的大型上市纯 BNPL 参考
        - 美国市场、资本成本和消费者结构差异很大
      - - Klarna
        - 全球 BNPL 私有市场 / 公开披露参考
        - 可查投资者关系财务报告页
        - 有助于搭建国际 BNPL 参照框架
        - 欧洲 / 全球业务组合和私募市场语境并非印尼特定
      - - PayPal
        - 大型支付龙头内的结账金融
        - 公开年报和委托书；先买后付是更广支付栈的一部分
        - 有助于理解商户规模和结账场景
        - 业务过于多元，不能直接映射到 Kredivo
      - - Block / Afterpay
        - 商户 / 支付生态内的 BNPL
        - 公开年报和申报基础设施
        - 与商户金融邻近性和生态价值相关
        - BNPL 只是体量更大上市公司里的一个模块
      - - Sea / SeaMoney
        - 区域数字金融邻近参照
        - 公开季度业绩和 SEC 报告
        - 与东南亚规模参照相关，且暴露于信贷和钱包
        - 集团组合远比 Kredivo 宽，并非纯消费者信贷可比对象
      - - GoPay / GoTo 金融科技触点
        - 本地战略竞争
        - 官方本地产品触点，加上其他口径的公开业绩
        - 提醒投资者，超级应用竞争者可能压缩经济性
        - 不是 BNPL 信贷的干净独立估值可比对象
    notes: 此表用于选择锚点，不是机械套用倍数。
    enumerationScope:
      coverage: partial
      basis: Captures the most decision-relevant public comparables and anchors visible from retained sources.
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV022
      - CV023
      - CV024
      - CV025
  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 监管升级
        - 重大 OJK 整改、处罚或铺开限制
        - 把增长可选性变成合规拖累和估值折价
        - 暂停部署资金，或要求大幅降低入场价格
      - - 损失强度恶化
        - 减值负担进一步上升，且没有定价或资本抵消
        - 削弱 Krom 能支撑溢价金融科技估值的论点
        - 转向熊市情境，并要求完整信贷明细数据
      - - 资金压力
        - 合作额度不续约，或存款增长反转
        - 降低扩张能力并暴露集中度
        - 下调情境区间，并要求结构性保护
      - - 签约时母公司经济性仍不透明
        - 投资前没有可信的母公司收入、烧钱或优先权披露
        - 估值很难被有纪律地辩护
        - 不要按类似普通股的条款投资
      - - 运营信任事件
        - 重大网络安全、宕机或争议激增，且没有强修复
        - 损害品牌并招来监管关注
        - 立即重新评估，并拉宽下行区间
      - - 越南或邻近扩张过度消耗资本
        - 区域可选性无法转化为证据支撑的价值
        - 把战略上行变成分心项
        - 在证明之前，将扩张视为中性至负面
    notes: 这些不涵盖所有下行事件；它们是应该改变投资决策的具体事件。
    claimRefs:
      - CV005
      - CV010
      - CV031
      - CV034
      - CV037
      - CV038
      - CV040
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 合并母公司财务
        - 控股公司 / 集团层面的收入、毛利率、烧钱、现金续航和债务
        - 没有这些，估值精度就是假精度
        - 索取经审计母公司资料包和月度管理账
      - - 股权结构和优先权堆栈
        - 当前投后估值、清算优先权、反稀释和投资者权利
        - 决定名义估值对新资金是否具备经济吸引力
        - 索取当前股权结构、条款清单和瀑布分析
      - - 信贷客群质量
        - 分批次损失、回收、首期违约和渠道级客群
        - 损失质量是价值最重要的摆动因子
        - 索取完整信贷明细数据和承保回测
      - - 银行向母公司的价值转移
        - 转移定价、资金成本，以及 Krom 与 Kredivo 用户重叠
        - 显示银行可选性是增厚价值，还是大多被圈在银行内
        - 索取资金管理和转移定价政策，加交叉销售漏斗
      - - 合作伙伴集中度
        - 按份额和利润率列出的头部商户、头部渠道和头部资金伙伴
        - 合作方名单很广仍可能掩盖狭窄经济性
        - 索取前 10 大敞口表和压力测试
      - - 公开市场准备度
        - IPO 路径、治理深度和报告节奏
        - 如果长期退出依赖上市回报，该项很重要
        - 索取董事会委员会材料、报告日历和上市准备计划
    notes: 如果这些问题回答得好，建议可以很快改善。如果回答不好，价格纪律应进一步收紧。
    claimRefs:
      - CV020
      - CV021
      - CV033
      - CV036
      - CV039
      - CV041
      - CV042
