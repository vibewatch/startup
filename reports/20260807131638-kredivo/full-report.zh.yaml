      - number: '8.2'
        title: 融资历史提供支撑，但可见估值锚点仍要求纪律
        blocks:
          - type: paragraph
            body: >-
              公开材料里最强的历史价格锚点，是 2021 年 VPCII 交易：它赋予 FinAccel 约 US$2.5 billion 的备考股权价值； 若交易完成且赎回不重，本可带来超过 US$430 million
              的总现金。这个锚点重要，因为它证明成熟投资者曾经看见通往更大公开市场估值的路径。 它更重要的原因在于交易没有完成，管理层后来也说，不利市场环境让重启 SPAC 吸引力不足。后续融资证据支持基本面，但价格信息较弱。
              2023 年 Series D 由 Mizuho 领投，募集 US$270 million；2026 年官方披露累计融资约 US$500 million，另有新战略资本，
              说明投资者仍支持这家公司。公开来源没有披露的，恰恰是估值备忘录最想知道的：当前投后估值、清算优先权、优先股堆叠、母公司现金，
              或者新资本是高于、低于还是大致贴近此前账面标记进入。因此，公开可比公司必须承担更多估值工作；但这些可比公司也要求谨慎， 因为 Affirm、Klarna、PayPal、Block、GoTo 和 Sea
              要么披露更多，要么处在很不同的资本和监管环境。
