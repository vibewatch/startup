      - number: '3.4'
        title: 护城河耐久度和反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              最重要的反向证据是，在这个品类里，分发和合规可能比品牌更重要。Akulaku 2024 年的制裁事件说明，即便是成规模
              贷款机构，风控一旦滑坡也会失去运营自由；监管干净度因此是护城河的一部分，不是后台细节。平台系玩家也展示了 独立 BNPL 经济性会如何被两头挤压。一端，银行可能更愿意把资金 channeling
              到嵌入式生态里——结账需求、评分数据 和资金吞吐已经拼好——而不是自建 BNPL UX。另一端，全球龙头显示品类会不断外扩：Klarna 打包卡、储蓄、会员、 返现和购物；Affirm 把 pay-in-4
              与借记卡、虚拟卡轨道结合；Afterpay 和 PayPal 则利用庞大已安装消费者基数， 把分期信贷变成一个功能，而不是目的地 app。因此，Kredivo 的护城河不太可能来自简单提供分期信贷。它必须来自
              更好的风险筛选、商户转化提升、资金韧性，以及足够难复制的产品栈，让嵌入式对手无法把这个品类压成商品化的结账开关。
