      - number: '4.3'
        title: 资本充足度在改善，但集团仍依赖不透明的多层资金
        blocks:
          - type: paragraph
            body: >-
              前瞻资本故事强于私营公司披露故事。官方口径下，Kredivo 2023 年完成超额认购的约 US$270 million Series D 轮， 用于支持 BNPL、个人贷款、卡和 Krom 上线。2026 年
              5 月 Timo 收购公告又补充称，公司再次从 Mizuho、Amazon、 Asia Partners、Square Peg Capital、Cathay Innovation 获得新资金，并称集团累计融资约
              US$500 million。 负债端，银行合作继续扩张：DBS 2022 年把联合融资额度提高到 IDR 2 trillion，媒体报道到 2026 年初又进一步提高到 IDR 3
              trillion；ANTARA 报道 BCA Digital 新增 channeling 额度，目标指向二、三线扩张。按初创公司标准，Krom 自身审慎披露尤其强。2026 年一季度公开指标显示，CET1 率
              38.72%、总资本充足率 39.78%、LCR 1015%、NSFR 181%， 说明银行子公司拥有很厚的监管缓冲。挑战不在于有没有资本，而在于投资人能否把资本在私营母公司、融资实体和受监管银行
              之间清楚映射。公开来源没有披露合并现金、月度烧钱、仓储融资 covenant，或 2025-2026 年新资金的具体条款。 因此，Kredivo 看起来有融资能力，但仅靠公开数据仍无法完整承销。
