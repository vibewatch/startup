      - 什么会改变判断
    rows:
      - - 印尼 BNPL 和数字信贷市场仍足够大，品类龙头有复利空间
        - 如果 OJK 规则收紧并长期压缩审批通过率或客户质量经济性，该判断会削弱
      - - Kredivo 已有硬采纳证据：用户、交易、合作伙伴深度和 Krom 账户
        - 如果复购被证明主要靠补贴或集中在少数渠道，而不是耐久需求，该判断会削弱
      - - Krom 给了 Kredivo 比多数 BNPL 同行更强的资金和监管资产
        - 如果能清晰披露合并口径交叉销售、资金成本和转移定价，该判断会进一步增强
      - - Mizuho 等投资方支持降低了生存风险
        - 如果新资金条款意味着优先权包袱沉重，或价值从普通股转移出去，该因素的重要性会下降
      - - 旧的 US$2.5B SPAC 标记证明此前有战略雄心
        - 只有公司能证明母公司经济性更干净、已具备公开市场准备度，该锚点才会重新相关
      - - 收入、烧钱、股权结构和损失批次不透明，今天仍挡住完整买入结论
        - 如果拿到经审计母公司财务、股权结构细节和产品级分群数据，判断会明显改善
    notes: 反向论点主要围绕价格和证据质量，而不是 Kredivo 是否是真实业务。
