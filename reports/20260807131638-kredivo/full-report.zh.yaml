        - 2024 年有监管瑕疵；公开费用披露仍不完整
      - - Indodana
        - 直接同业
        - 自有 PayLater，加联名 Blibli 和 Tiket PayLater 项目
        - 需要电商、旅行和线下分期选项的消费者
