    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、架构与产品边界
        blocks:
          - type: paragraph
            body: >-
              Kredivo 最早叫 FinAccel，总部在新加坡，2015 年成立，目标是用快速、负担得起的信贷服务东南亚 金融服务不足的人群。2016 年印尼业务启动，之后从结账分期扩展到个人贷款、卡和数字银行。2023
              年 3 月 Series D 公告正式把母公司更名为 Kredivo Group，并描述了覆盖 Kredivo、KrediFazz 和 Krom 的多品牌平台；2026 年 5 月收购
              Timo，又把这套栈带入越南，增加第二个数字银行资产。因此，当前版图 更应看作一个区域消费金融集团：印尼仍是核心利润和分发市场，越南是信贷与银行扩张的关键第二市场，
              泰国出现在官方当前版图表述里，但公开运营细节仍很少。尽调上最重要的结构点是，消费信贷 app、 多元金融活动和银行实体彼此互补，却不是同一个法律或监管界面。
