  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现栈，以及公开定价真正能证明什么
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是三层变现栈，而不是单一 BNPL 费用模型。第一，核心信贷 app 直接向消费者变现：Google Play 列表仍宣传额度最高 IDR 50 million，并给出 12 个月案例，定价为每月
              1.99%；历史官方卡材料显示，Infinite Card 对 30 天和 3 个月计划收 0%，对 6 个月和 12 个月计划收每月 2.6%。第二，商户侧经济性仍然重要，尽管 Kredivo
              没披露实际商户折扣率。官方材料强调 2-click checkout、覆盖超过 10,000 家商户的开放循环分发，以及给商户带来的 转化收益；Federal Reserve 2026 年 BNPL
              说明清楚解释了通用机制：商户收到扣除商户费用后的净额，典型 BNPL 商户收费高于卡费。第三，Krom 引入资产负债表收入：吸收存款、交易银行和贷款产品可以产生息差收入，并降低集团对
              外部批发资金的依赖。分析边界在于，这些都是标价和产品披露，不是集团实际 take rate。投资人能看到 Kredivo 在哪里赚钱，但还看不到精确组合、补贴负担，或按产品 cohort 划分的利润率。
