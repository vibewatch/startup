      - number: '1.4'
        title: 规模信号、银行动能和反向背景
        blocks:
          - type: paragraph
            body: >-
              当前最好的规模证据来自用户、银行和资金代理指标，而不是完整合并 P&L。2021 年 SPAC 公告称获批客户 接近 400 万；到 2025 年 6 月，Kompas 报道印尼用户超过 1100
              万、每日交易数达数十万、每名用户每月 交易超过 4 次。2026 年 1 月，Kontan 又补充称 53.6% 的用户来自二、三线城市，强化了公司的金融普惠叙事。 Krom
              提供最干净的硬数字：官方和媒体披露显示，截至 2026 年 4 月，账户超过 100 万、存款达 Rp10 trillion；投资者关系页面显示 2025 年净利润 Rp143 billion、存款
              Rp8.398 trillion、贷款 Rp8.632 trillion。需要平衡的是监管和信贷质量。OJK 2025 年 12 月 BNPL 规则手册，以及 2026 年 7 月
              对年龄、收入和还款能力上限标准的收紧，说明 BNPL 已经明确进入审慎监管边界；行业 NPF 也在 2026 年 5 月升至 3.44%。Kredivo
              的模式有机构银行支持，但现在要在更严格的授信预期下接受检验。
