      - number: '3.3'
        title: 定价可见度、分发权力和替代品压力
        blocks:
          - type: paragraph
            body: >-
              公开定价披露并不一致，但已经足以看出竞争正在如何成形。Shopee PayLater 在本地网页上披露最清楚，次月还款为 0%，更长期限费用随用户等级上调。GoPay 也披露现金贷和 paylater
              的起始费率。Akulaku 和 Atome 给出一些 经济性表述——快速审批、灵活分期或低 / 0% 起步费用——但把完整费率细节放到 app 更深处。这很关键，因为最强的 对手越来越不需要只靠独立 app
              获客取胜。Detik 对 BNI 计划与 Shopee PayLater 开展 channeling 合作的报道 很有启发：一家大型银行判断，接入 Shopee 的分发和评分闭环，比从零搭建独立 BNPL
              轨道更高效。Sea 2026 年业绩 进一步说明原因：Shopee 交易量巨大，Monee 贷款账簿可观；GoTo 2026 年一季度发布也显示，集团年度交易用户达 6900 万，金融科技贷款账簿接近 Rp10
              trillion。这些平台资产不会自动让它们的 paylater 产品成为更好的风控方， 但确实让它们在结账页很难被挤出去。
