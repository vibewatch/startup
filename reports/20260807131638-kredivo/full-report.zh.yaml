  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Kredivo 的战略分量足够大，但透明度不足以支撑激进定价
        blocks:
          - type: paragraph
            body: >-
              支持投资的逻辑很直观。Kredivo 在结构性有吸引力的市场里做出了有意义的消费信贷规模，又借 Krom 延伸到银行，
              投资者支持仍强，用户和商户验证也足够多，说明业务是真实存在，而不是宣传包装。最好的证据不是某一个指标，而是组合： 到 2025 年中超过 11M 用户、每位用户每月超过 4 笔交易、53.6%
              用户来自二三线城市，到 2026 年 6 月 Krom 账户超过 1M、 存款 Rp10T，再加上银行子公司公开显示盈利且审慎比率较强。反向逻辑同样清楚：信贷成本强度仍高，BNPL 规则正在收紧，
              合作伙伴和渠道集中度仍不透明，投资者仍看不到干净的合并收入、现金或优先股堆叠图。因此，Kredivo 也许值得相对弱本土金融科技公司享有溢价， 但不值得盲目接受一个未披露的溢价估值。
