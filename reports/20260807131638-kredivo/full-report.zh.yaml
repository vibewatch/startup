              损失、合并母公司烧钱，或公开认证、事故时间线、 漏洞赏金细节等精确网络安全保障材料。甚至第三方商户文档也把更高费用、拒付复杂度和多层网关依赖列为实际运营风险。 于是，投资人看到的是一家 logo
              和产品界面上看似多元的公司，但其经济性可能比公开证据能证明的更集中在少数资金、 分发和系统关系上。
