      - number: '7.4'
        title: 只有团队梯队、报告机制和叫停标准明确，执行风险才可控
        blocks:
          - type: paragraph
            body: >-
              最后一类风险是执行复杂度。Kredivo 已经不只是一个 BNPL 应用。它现在横跨受监管银行、存款、薪资挂钩入口、大型商户集成， 还通过越南 Timo
              推进第二个国家的银行扩张。机会因此被拉宽，但管理层也更容易在合规、技术、资金和集成等工作流之间分神。 公开的领导层扩充说明团队厚度已超过单一创始人公司，但外部证据对治理深度的揭示，仍远薄于对产品野心的展示。
              因此，投资者需要明确的终止标准，而不是泛泛而谈的安心感。若监管整改拖延、坏账指标持续恶化、合作伙伴资金撤出、
              网络安全或支付网关事故出现且回应乏力，或越南消耗资本却没有拿出可验证的战略或财务回报，投资逻辑就应明显收紧。 换句话说：乐观情景可以承受增长放缓，但承受不了市场失去对合规、催收或运营控制的信任。
