      - number: '5.3'
        title: 信任界面监管证据强，公开技术保障证据弱
        blocks:
          - type: paragraph
            body: >-
              Kredivo 的公开信任叙事更多靠牌照和受监管实体控制支撑，而不是公开安全工程文档。Android 列表称用户数据已加密， 产品受 OJK 许可和监管。Krom 产品页称 Flexi Loan 受 OJK
              监督，存款在印尼保险限额内受 LPS 保护；Bank Bisnis 收购公告称，银行控制权交易已取得所有必要 OJK 批准。OJK 2025 年 BNPL 监管又加入围绕审慎、消费者保护、
              客户数据保护和披露的明确公开要求。Krom 经审计 2025 年报表、2026 年中期报表，加上季度审慎指标，给了 Kredivo
              许多私营金融科技公司没有的东西：一个持续报告、资本、流动性和法定披露都可见的银行层。缺口在于，公开来源没有展示 企业买方或安全审查者可能想看到的技术保障包——没有有效 SOC 2、ISO
              27001、漏洞赏金计划、公开 uptime 历史或公开 商户集成文档。这不能证明控制弱，但意味着监管边界比安全项目成熟度更容易验证。
