      - number: '1.3'
        title: 融资历史和区域扩张里程碑
        blocks:
          - type: paragraph
            body: >-
              Kredivo 的融资故事体量不小，但披露不完整。官方证据显示，2019 年 12 月 Series C 融资 US$90 million； 若纳入同期债务资金，2019 年累计资本超过 US$200
              million。2021 年 8 月，FinAccel 宣布计划通过 SPAC 合并上市，隐含 pro forma 股权价值为 US$2.5 billion，并配套 US$120 million 新 PIPE
              资本和 现有投资人的 US$55 million 同步承诺，但上市没有完成。2023 年 3 月，集团转而完成超额认购的约 US$270 million Series D 轮，由 Mizuho 领投，其中
              Mizuho 投入 US$125 million，并把融资与 Krom 上线计划绑定。2026 年 5 月 Timo 收购公告随后披露，集团从 Mizuho、Amazon、Asia Partners、
              Square Peg、Cathay Innovation 等新老投资人处获得新资金，并称累计融资约 US$500 million。这个最新 官方总额低于部分第三方数据库估计，因此公司完整资本投入和 2023
              年后估值仍是待尽调事项，而不是已落定事实。
