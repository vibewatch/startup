        title: 领导层、治理和控制点
        blocks:
          - type: paragraph
            body: >-
              Kredivo 仍有创始人依赖。Akshay Garg 继续在母公司层面担任 Group CEO 与联合创始人，Umang Rustagi
              则以联合创始人兼总裁董事身份，仍是印尼业务的关键运营面孔。公开管理层名单还突出 Dennis Lerchl 负责财务，Valery Crottaz 负责融资和区域扩张，Anton Hermawan 掌管 Krom
              Bank。治理已经走出 创始圈，但仍紧贴资本市场和监管关系。2025 年 6 月，Andre Rasjid 加入印尼监事会，带来风投和战略 咨询经验；Kompas 还报道 Darmin Nasution 以及
              Bank Indonesia 前副行长 Maulana Ibrahim 位于更广义的 Kredivo Group Indonesia 监督结构中。这有利于监管沟通，但也说明公司继续放量仍依赖信用、资金、
              催收和银行执行上的一小批高管。没有公开证据显示创始人退出，但公司看起来仍明显依赖关键个人。
