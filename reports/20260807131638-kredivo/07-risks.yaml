    missingEvidence: A public security-assurance package covering certifications, material incidents, outage history, post-mortems, and dispute / chargeback rates.
    whyItMatters: As Kredivo adds banking and broader payment surfaces, trust can break through systems-control failures as easily as through underwriting failures.
    diligencePath: Request security certifications, pen-test summary, incident log, uptime SLA history, dispute-rate dashboards, and third-party risk review results.
