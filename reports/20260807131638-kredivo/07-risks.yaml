  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-compliance-pack
    missingEvidence: A line-by-line compliance pack mapping each Kredivo and Krom entity to POJK 32/2025, PADK 2/2026, disclosure obligations, and any live regulator remediation items.
    whyItMatters: The legal perimeter is clearer in 2026, but public evidence still does not show how each group entity operationalizes the new BNPL rules.
    diligencePath: Request entity-level licenses, responsible executives, control owners, board reporting cadence, and any open findings or remediation deadlines.
    relatedQuestionRefs:
    - QR001
    - QR003
    - QR004
    - QR005
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: consolidated-credit-vintages-and-loss-waterfall
    missingEvidence: Public 30/60/90+ delinquency, vintage curves, write-offs, recoveries, and first-payment-default data for Kredivo-originated credit and Krom-linked receivables.
    whyItMatters: Impairment is clearly material, but investors still cannot map where losses originate or how quickly they cure.
    diligencePath: Request monthly delinquency vintages, roll rates, recoveries, channel-level loss tables, and scorecard backtests by product.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR024
    relatedTableRefs:
    - TR002
    - TR005
