  claims:
  - id: CR001
    statement: Indonesia now has a dedicated BNPL regime centered on POJK 32/2025 and 2026 implementing rules, replacing the earlier reliance on broader financing-company rules.
    type: third-party-reported
    topic: regulatory-perimeter
    sourceRefs:
    - SR001
    - SR002
    - SR003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR005
  - id: CR002
    statement: Banks can offer BNPL under existing banking rules, while financing companies need prior OJK approval for BNPL operations.
    type: third-party-reported
    topic: approval-perimeter
    sourceRefs:
    - SR001
    - SR002
    - SR003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR002
  - id: CR003
    statement: The new framework increases disclosure expectations around funding sources, instalments, and transfer or assignment structures, which matters for channeling and securitization-style arrangements.
    type: third-party-reported
    topic: disclosure-risk
    sourceRefs:
    - SR001
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR004
    statement: OJK has explicit termination and sanction authority under the BNPL framework, making compliance failure a genuine thesis-break risk rather than a procedural footnote.
    type: third-party-reported
    topic: enforcement-risk
    sourceRefs:
    - SR001
    - SR002
    - SR027
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR004
    - QR028
    - QR031
  - id: CR005
    statement: The regime tightened in stages through 2026, with transitional adjustments in the first half of the year and borrower-eligibility requirements becoming operational from July 2026.
    type: third-party-reported
    topic: regulatory-timing
    sourceRefs:
    - SR002
    - SR003
    - SR004
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR006
    statement: Public 2026 guidance says BNPL borrowers must be at least 18 or married and show minimum average gross income of Rp3 million per month.
    type: third-party-reported
    topic: borrower-eligibility
    sourceRefs:
    - SR003
    - SR004
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR006
  - id: CR007
    statement: The 2026 rule package also pushes lenders to limit multi-provider exposure and assess repayment capacity rather than relying on top-line acquisition momentum.
    type: third-party-reported
    topic: borrower-eligibility
    sourceRefs:
    - SR003
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR008
    statement: Repayment-capacity thresholds of 40% of monthly income in 2027-2028, falling to 30% from 2029, imply a policy direction toward tighter leverage tolerance even if near-term growth remains healthy.
    type: third-party-reported
    topic: borrower-eligibility
    sourceRefs:
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR009
    statement: 'Sector credit quality is already under pressure: Fintech News Indonesia reported paylater NPF rising to 3.44% in May 2026 from 2.99% in April.'
