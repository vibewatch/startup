- id: partner-platform-and-disclosure-dependence
  title: Partner concentration and thin public control disclosure are the most underappreciated risks
  body: Kredivo’s ecosystem strategy creates scale, but it also creates interdependence. Funding and origination appear meaningfully connected to DBS, BCA Digital, Krom deposits, and large merchant or OEM channels. Distribution quality also appears linked to a relatively compact set of acquisition partners and device channels, with AVOW describing itself as a top partner and Kredivo describing OEM traffic as a meaningful source of qualified users. None of that is inherently bad; ecosystem leverage is one reason the company grew. The issue is visibility. Public materials do not disclose top-merchant GMV share, top-funder exposure, cohort-loss by acquisition channel, consolidated parent burn, or precise cyber-assurance artifacts such as public certifications, incident timelines, or bug-bounty detail. Even third-party merchant documentation highlights higher fees, chargeback complexity, and multi-layer gateway dependence as practical operating risks. That leaves investors with a company that
    looks diversified in logos and product surfaces, but still may be economically concentrated in a smaller set of funding, distribution, and systems relationships than public evidence can prove.
