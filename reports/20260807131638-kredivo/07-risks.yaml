- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Regulatory compliance slippage
    - Formal OJK remediation, approval delay, or public sanction
    - Any material restriction on product rollout or lender activity
    - Pause or reprice the thesis until remediation evidence is complete
  - - Asset-quality deterioration
    - Sector NPF/NPL or Krom impairment burden keeps rising
    - Two or more consecutive periods of worsening loss intensity without offsetting pricing/capital response
    - Cut valuation confidence and demand deeper credit-tape access
  - - Partner-funding concentration
    - DBS/BCA/Krom funding growth stalls or a key line is withdrawn
    - Material line non-renewal, tighter covenants, or deposit growth reversal
    - Reassess scaling capacity and downside liquidity buffer
  - - Acquisition and fraud drift
    - Channel quality, first-payment-default, or fraud events worsen
    - Meaningful deterioration in approval quality or forced partner rotation
    - Reduce growth assumptions and raise CAC / loss overlays
  - - Cyber / outage event
    - Prolonged incident or weak post-mortem response
    - Material outage, breach, or dispute surge without strong disclosure
    - Escalate diligence immediately and widen downside case
  - - Vietnam execution drag
    - Capital use rises without strategic traction
    - No clear customer, deposit, or profitability milestones after integration window
    - Treat overseas expansion as value-neutral or value-destructive
  notes: These are thesis-management triggers, not forecasts.
