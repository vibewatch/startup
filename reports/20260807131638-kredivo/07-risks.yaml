    - QR031
  - id: CR010
    statement: ABNR’s April 2026 summary framed BNPL as a now-material category, citing January 2026 bank BNPL loans of Rp27.1 trillion and financing-company BNPL of Rp12.18 trillion.
    type: third-party-reported
    topic: market-scale
    sourceRefs:
