company:
  name: Kredivo
chapter:
  number: 7
  title: Risks
  summary: 'Kredivo’s risk profile is investable but not lightweight. The biggest external pressure point is Indonesia’s new 2025-2026 BNPL rulebook, which now hardens eligibility, repayment-capacity, disclosure, and enforcement expectations just as the market is still growing quickly and industry bad debt is rising. The biggest internal pressure point is classic consumer-credit execution: high impairment intensity, user-level defaults, and fraud control all remain material even though Krom’s statutory capital and liquidity buffers are strong. The third bucket is dependency risk. Kredivo now relies on a dense stack of funding banks, app-distribution partners, major merchants, and a regulated bank subsidiary, while public disclosure on concentration, cyber controls, and consolidated parent liquidity remains thin. The practical implication is that the thesis should break on compliance, asset-quality, partner-funding, or systems-control slippage long before it breaks on raw demand.'
sections:
- id: regulatory-and-legal-overhang
  title: The regulatory perimeter is clearer in 2026, but it is also less forgiving
  body: 'Kredivo operates in a part of Indonesian finance that is becoming more rule-bound exactly as scale is increasing. OJK’s December 2025 BNPL regulation and its 2026 implementing framework moved the market from loosely interpreted sector rules into a dedicated regime for banks and financing companies. That is helpful for legitimacy, but it also narrows room for product design, marketing, underwriting, and funding disclosure shortcuts. The most important new constraints are not theoretical. Public legal and news sources describe borrower-age and income minimums, repayment-capacity tests, disclosure of financing sources and transfer arrangements, prior approval for financing-company BNPL products, and OJK authority to terminate operations or impose sanctions. The significance for Kredivo is that its operating model now touches multiple regulated layers at once: digital credit, a bank subsidiary, third-party funding structures, and overseas expansion. In a benign environment, that structure
    looks like optionality. In a stressed environment, it can turn into a multi-front compliance and reporting burden with more ways for supervisors to slow growth.'
