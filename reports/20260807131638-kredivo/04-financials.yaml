- id: TI004
  title: Capital adequacy table
  columns:
  - capital or funding line
  - public amount / status
  - date
  - quality
  - why it matters
  - diligence ask
  rows:
  - - Series D equity round
    - ~US$270M raised; US$125M from Mizuho
    - '2023-03-23'
    - high
    - Large disclosed equity round funded the bank launch and multi-product expansion
    - How much of the round remains unconsumed at the parent and operating entities?
  - - Latest official raised-to-date total
    - ~US$500M and new capital from Mizuho, Amazon, Asia Partners, Square Peg, and Cathay Innovation
    - '2026-05-06'
    - medium
    - Confirms continued investor support after Series D
    - What exact amount, instrument, valuation, and liquidation preference applied to the fresh capital?
  - - DBS joint financing line
    - Raised to IDR 2T in 2022 and reported at IDR 3T by early 2026
    - 2022-07-20 / 2026-01-29
    - medium
    - Shows ongoing external funding appetite for Kredivo-originated credit
    - What is the cost of funds, risk sharing, and covenant package?
  - - BCA Digital channeling line
    - Facility announced; size undisclosed publicly in retained source
    - '2025-12-08'
    - medium
    - Adds another bank funding partner and supports tier-2/3 expansion
    - What is the committed size and allocation between Kredivo and KrediFazz?
  - - Krom regulatory capital buffer
    - CET1 38.72%; total capital ratio 39.78%
    - '2026-03-31'
    - high
    - Indicates strong statutory solvency at the bank subsidiary
    - How much of this capital is freely deployable to group strategies versus ring-fenced bank growth?
  - - Krom liquidity buffer
    - LCR 1015%; NSFR 181%
    - '2026-03-31'
    - high
    - Suggests ample short- and structural-liquidity headroom
    - What portion of liquidity is operational versus excess, and what yield sacrifice does it imply?
  - - Krom balance-sheet scale
    - Assets Rp15.943T; deposits Rp11.999T; liabilities Rp12.378T; loans Rp11.041T
    - '2026-06-30'
    - high
    - Shows the group now controls a meaningful regulated funding and lending vehicle
    - How much of the loan book is directly linked to Kredivo channels and what are transfer-pricing terms?
  - - Burn / runway disclosure
    - Not publicly disclosed for the consolidated group
    - '2026-08-07'
    - low
    - This is the main unresolved financing blind spot for investors
    - Request parent cash, monthly burn, minimum cash covenant, and next-round trigger
  notes: Uses public equity rounds, channeling facilities, and Krom statutory buffers as the visible capital stack. Consolidated parent cash and runway remain undisclosed.
