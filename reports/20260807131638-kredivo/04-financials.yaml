- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - why it matters
  - public proxy used here
  - impact on underwriting confidence
  - exact diligence path
  rows:
  - - Consolidated group revenue and gross profit
    - Core test of revenue quality and valuation support
    - Krom statutory income plus transaction-growth anecdotes
    - high
    - Request audited or management P&L by product and geography for 2024-1H26
  - - GMV by product and realized merchant take rate
    - Needed to evaluate merchant economics and subsidy burden
    - TechCrunch GMV-share proxy and FRB merchant-fee benchmark
    - high
    - Request merchant cohort file with GMV, MDR, approval, and conversion uplift
  - - Credit losses by vintage and product
    - Determines whether growth is profit accretive or just risk-accelerative
    - Krom impairment expense and OJK/Fintech News sector NPF signals
    - high
    - Request 30/60/90+ delinquency, write-off, recovery, and fraud by cohort
  - - CAC, payback, and repeat-usage metrics
    - Separates efficient distribution from paid growth
    - 10% Ramadan transaction growth and 10,000+ merchant scale
    - high
    - Request acquisition channel mix, CAC, activation, repeat-borrow, and payback by cohort
  - - Funding covenants and transfer pricing
    - Bank lines can look large but still be operationally constrained
    - DBS/BCA channeling headlines and Krom capital ratios
    - medium
    - Request every warehouse and channeling agreement with pricing, triggers, and reserve requirements
  - - Parent cash, burn, and next-round trigger
    - Essential for downside underwriting and timing risk
    - Official fresh-capital statement without amount disclosure
    - high
    - Request parent cash waterfall, burn bridge, regulatory capital plan, and fundraising timetable
  notes: These are the main blockers that prevent a clean public-only underwriting view. The list is prioritized, not exhaustive.
