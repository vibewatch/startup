company:
  name: Kredivo
chapter:
  number: 4
  title: Financials
  summary: 'Kredivo still does not publish a clean consolidated group P&L, so the best financial read comes from three public lenses used together: official list pricing on the consumer-credit products, Krom Bank’s audited 2025 and interim 2026 filings, and benchmark economics from listed embedded-credit peers. Those sources show a multi-stream model—merchant conversion economics, consumer installment charges, and bank spread income—with genuine balance-sheet depth via Krom and bank channeling lines from DBS and BCA Digital. They also show that credit cost is substantial: Krom’s impairment charges consumed most of its net interest income in both 2025 and 1H26, and Kredivo still withholds the private metrics that would let an investor underwrite group revenue quality, burn, and runway directly.'
sections:
- id: monetization-and-revenue-quality
  title: Monetization stack and what public pricing really proves
  body: 'Public evidence supports a three-layer monetization stack rather than a single BNPL-fee model. First, the core credit app monetizes the consumer directly: the Google Play listing still advertises limits up to IDR 50 million and shows a 12-month example priced at 1.99% per month, while historical official card materials show the Infinite Card charging 0% for 30-day and 3-month plans and 2.6% per month for 6- and 12-month plans. Second, merchant-side economics remain important even though Kredivo does not disclose its realized merchant discount rate. Official materials emphasize 2-click checkout, open-loop distribution across more than 10,000 merchants, and conversion benefits for merchants; the Federal Reserve’s 2026 BNPL note explains the generic mechanism clearly, with merchants paid net of merchant fees and typical BNPL merchant charges higher than card fees. Third, Krom introduces balance-sheet revenue: deposit gathering, transaction banking, and lending products that can generate
    spread income and lower the group’s dependence on external wholesale funding. The analytical limit is that all of this is list pricing and product disclosure, not realized group take rate. Investors can see where Kredivo makes money, but not yet the exact mix, subsidy burden, or cohort-level margin by product.'
