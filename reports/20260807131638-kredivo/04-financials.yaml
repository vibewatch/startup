- id: capital-adequacy-and-funding-dependency
  title: Capital adequacy is improving, but the group still depends on opaque funding layers
  body: 'The forward capital story is better than the private-company disclosure story. Officially, Kredivo closed an oversubscribed ~US$270 million Series D in 2023 to support BNPL, personal loans, cards, and the Krom launch. The May 2026 Timo acquisition announcement then added that new capital had again been raised from Mizuho, Amazon, Asia Partners, Square Peg Capital, and Cathay Innovation, and it described the group as having raised roughly US$500 million to date. On the liability side, bank partnerships continue to expand: DBS lifted its joint financing limit to IDR 2 trillion in 2022 and media reported a further increase to IDR 3 trillion by early 2026, while ANTARA reported a new BCA Digital channeling facility aimed at tier-2 and tier-3 expansion. Krom’s own prudential disclosures are especially strong by startup standards. The Q1 2026 public metrics show a CET1 ratio of 38.72%, a total capital ratio of 39.78%, an LCR of 1015%, and an NSFR of 181%, which indicates very substantial
    regulatory buffers at the bank subsidiary. The challenge is not whether capital exists; it is whether investors can map that capital cleanly across the private parent, financing entities, and the regulated bank. Public sources do not disclose consolidated cash on hand, monthly burn, warehouse covenants, or the precise terms of the 2025-2026 fresh capital. Kredivo therefore looks fundable, but still not fully underwritable from public data alone.'
