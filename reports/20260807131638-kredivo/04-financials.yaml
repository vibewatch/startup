- id: public-traction-and-unit-economics
  title: What Krom filings and public traction proxies say about economics
  body: 'Because Kredivo does not disclose consolidated revenue or GMV, Krom Bank is the cleanest public operating proxy inside the group. The audited 2025 accounts show Rp1.084 trillion of interest income, Rp965.1 billion of net interest income, Rp632.6 billion of impairment expense, Rp184.3 billion of profit before tax, and Rp143.3 billion of net income on Rp12.214 trillion of assets and Rp8.398 trillion of deposits. The June 2026 interim statements show the bank scaling further to Rp15.943 trillion of assets, Rp11.999 trillion of deposits, Rp11.041 trillion of gross loans, Rp730.5 billion of 1H26 net interest income, and Rp93.8 billion of pre-tax profit, but also Rp508.3 billion of impairment expense in only six months. In other words, the bank is profitable and funding-rich, yet credit cost remains the main absorber of gross spread. The June 2026 milestone announcement matters because it adds two qualitative offsets: management says Krom crossed one million accounts and Rp10 trillion
    of deposits organically before fully exploiting the Kredivo user base, and it claims profitability has been maintained since launch. Independent proxies strengthen the picture but not enough to close the diligence gap. Bisnis reported 10% Ramadan transaction-value growth in 2025, while TechCrunch cited management saying Kredivo drives 3% to 4% of GMV for its top e-commerce merchants. Those are helpful signals on demand and merchant relevance, but they do not substitute for disclosed contribution margin, CAC, or default curves by product cohort.'
