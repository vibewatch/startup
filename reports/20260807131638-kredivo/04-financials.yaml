  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fresh-capital-terms
    missingEvidence: Exact amount, instrument, valuation, and investor-rights package for the 2025-2026 fresh capital referenced in official Kredivo statements.
    whyItMatters: Without the latest round size and terms, investors cannot model dilution, runway extension, or downside preference stack accurately.
    diligencePath: Request signed term sheets, cap-table updates, and board materials covering the post-Series-D capital raise.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: consolidated-burn-and-runway
    missingEvidence: Parent-level cash balance, monthly burn, minimum liquidity thresholds, and next-round trigger for Kredivo Group.
    whyItMatters: Public funding history and bank buffers do not reveal how much parent cash remains or when fundraising pressure returns.
    diligencePath: Request monthly cash bridge, management budget, and covenant package across parent, lending entities, and Krom.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: cohort-unit-economics
    missingEvidence: Realized merchant take rate, CAC, repeat-borrow behavior, vintage loss curves, and recoveries by product segment.
    whyItMatters: The public model shows where revenue can come from, but not whether growth is profit-accretive after acquisition and credit costs.
    diligencePath: Obtain cohort dashboards, merchant economics files, and product-level margin bridges for BNPL, cash loans, cards, and Krom-sourced users.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TI003
    - TI005
