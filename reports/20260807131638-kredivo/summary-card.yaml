  topStrengths:
    - Real home-market scale with more than 11 million users and repeat usage evidence.
    - Krom Bank adds a visible funding, deposit, and prudential-capital layer unusual for a BNPL platform.
    - Investor support remains strong, with Mizuho and other strategic backers still funding expansion.
  topRisks:
    - Consolidated parent revenue, burn, and cap-table economics are still not publicly transparent.
    - Credit-loss intensity and tighter OJK BNPL rules justify a structural valuation discount.
    - Partner, channel, and bank-to-parent value-transfer concentrations remain only partially visible.
  unresolvedGaps:
    - Current post-money valuation, liquidation preferences, and waterfall economics for new money are not public.
    - Parent-level financial statements and channel-level credit cohorts are still missing.
    - The extent to which Krom's capital and profitability translate into parent-level equity value remains unclear.
