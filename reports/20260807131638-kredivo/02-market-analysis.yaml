callouts:
- calloutType: strength
  title: The market is large because credit demand sits inside much larger payment and ecommerce flows
  body: Kredivo does not need to win all Indonesian consumer finance to become very large; it only needs a durable share of
    a fast-growing checkout, digital-lending, and tier-2/3 adoption corridor.
  claimRefs:
