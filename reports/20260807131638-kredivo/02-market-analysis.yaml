- id: drivers-and-constraints
  title: Growth drivers, constraints, and timing
  body: 'The bullish case for Kredivo’s market rests on four observable drivers: Indonesia’s still-growing digital economy,
    QRIS and BI-FAST infrastructure that lowers payment friction, merchant appetite for conversion tools, and expanding demand
    outside core metro areas. Bain’s 2025 Indonesia report and multiple Indonesian media sources show strong growth in digital
    finance, digital commerce, and video-led shopping behavior. But the friction list is now just as important. OJK’s 2025
    BNPL regulation and 2026 borrower-screening circular make clear that the regulator no longer treats pay-later as a lightly
    supervised growth wedge. Minimum age and income rules, repayment-cap limits, and rising sector NPF turn underwriting quality
    into a gating constraint. PaymentBrief adds another operational warning: national coverage still requires multiple wallet
    methods, bank transfers, and often COD, which complicates checkout, fraud, and collections economics. In other words,
    adoption can keep rising while the market simultaneously becomes harder for undifferentiated lenders. Scale is available,
    but only to operators that can price risk, fund receivables, manage fraud, and keep regulators comfortable.'
