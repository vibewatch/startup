  - CM008
  - CM010
  - CM012
- calloutType: risk
  title: Tighter regulation may improve industry quality while still lowering approval rates and growth velocity
  body: The same OJK rules that make the market more legitimate also reduce room for weak underwriting, aggressive user acquisition,
    or opaque pricing, which can compress growth for all operators.
