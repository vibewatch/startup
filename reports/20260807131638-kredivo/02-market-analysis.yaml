  - CM029
  - CM030
  - CM031
  - CM035
  - CM036
  - CM040
- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - QRIS interoperability
    - positive
    - current
    - Lowers payment fragmentation and expands addressable merchants and users
    - How much of Kredivo repayment and acceptance can ride QR-linked infrastructure?
  - - BI-FAST and cheaper real-time transfers
    - positive
    - current
    - Reduces repayment and disbursement friction for digital-credit products
    - What share of collections is already A2A versus wallet-based?
  - - Low card penetration and cash persistence
    - positive for BNPL / mixed operationally
    - current
    - Creates demand for alternatives but preserves COD and cash friction
    - How much conversion still depends on COD or retail cash networks?
  - - Tier-2 and tier-3 digital-credit demand
    - positive
    - current
    - Expands SAM beyond Jakarta core
    - What CAC and loss rates differ outside major metros?
  - - Video commerce and ecommerce growth
    - positive
    - current
    - Adds more checkout moments where BNPL can be surfaced
    - Which high-frequency categories convert best under instalment offers?
  - - OJK prudential tightening
    - negative
    - current-to-near term
    - Raises compliance cost and may reduce approval rates
    - How will age, income, and repayment-cap rules change funnel conversion?
  - - Rising sector NPF / over-indebtedness concerns
    - negative
    - current
    - Can force tighter underwriting and slower growth
    - What are Kredivo’s own delinquency and loss rates versus sector averages?
  - - Fraud, multi-wallet complexity, and data-localization costs
    - negative
    - ongoing
    - Raises execution cost for national coverage
    - How much operating leverage remains after compliance, fraud, and integration overhead?
  notes: The same infrastructure that broadens demand also increases the operating complexity required to serve the market
    responsibly at scale.
