- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer
  - workflow / budget owner
  - adoption trigger
  rows:
  - - Prime urban shopper
    - Marketplace or merchant decides to surface BNPL
    - Consumer with smartphone and thin-file credit profile
    - Consumer repays; merchant covers MDR economics
    - Ecommerce checkout, electronics, fashion, travel
    - Need for flexibility without a credit card.
  - - Tier-2/3 household
    - Merchant plus lender distribution team
    - Consumer outside core metros
    - Consumer repays; bank partners fund receivables
    - Daily-needs, health, education, productive household spend
    - Formal-credit access gap and growing digital comfort.
  - - Wallet / super-app user
    - Wallet operator or ecosystem merchant
    - Consumer already active in GoPay/OVO/DANA/ShopeePay loops
    - Consumer repays or wallet balance funds purchase
    - In-app checkout or QR payment flow
    - Convenience and app stickiness.
  - - Merchant / marketplace
    - Merchant acquisition or payments team
    - Storefront and checkout manager
    - Merchant budget through conversion economics
    - Checkout integration and campaign placement
    - AOV uplift, conversion, and repeat purchase.
  - - Bank / institutional funder
    - Treasury, partnership, or retail-lending team
    - BNPL platform as origination channel
    - Bank balance sheet funds the portfolio
    - Channeling, warehouse, or co-lending programs
    - Yield plus customer acquisition without building UX from scratch.
  notes: Separates economic buyer from end user because merchant integration and bank funding decisions shape adoption as
    much as borrower demand does.
