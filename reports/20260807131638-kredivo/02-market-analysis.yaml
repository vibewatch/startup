- id: sizing-lenses
  title: Market sizing lenses and contradictory estimates
  body: 'Every serious sizing lens suggests Indonesia is large enough to support scaled BNPL and digital-credit operators,
    but the numbers vary by methodology and by whether the source is measuring BNPL payment value, alternative-lending disbursements,
    digital-lending balances, or broader digital-economy spend. Bain/Google/Temasek’s 2025 Indonesia cut places the overall
    digital economy at US$99 billion GMV, with ecommerce alone at US$71 billion and digital lending balances at US$13 billion.
    Research-and-markets summaries via BusinessWire place Indonesia’s BNPL market at US$9.12 billion in 2025 and US$11.15
    billion in 2026, while PaymentBrief uses a lower US$8.59 billion 2025 BNPL estimate. Those are directionally consistent
    but not identical. The correct conclusion is not to pick one heroic TAM, but to preserve the range and tie it to channel
    behavior: BNPL is a meaningful slice of a far larger ecommerce and digital-payments stack, and the broader digital-lending
    pool remains larger still. For Kredivo, the usable SAM is most plausibly the intersection of thin-file consumers, partner-merchant
    checkout, and regulated funding capacity rather than the full consumer-finance market.'
  claimRefs:
