company:
  name: Kredivo
chapter:
  number: 2
  title: Market Analysis
  summary: 'Kredivo sells into one of Southeast Asia’s deepest digital-credit opportunity sets: a very large, mobile-first
    Indonesian consumer market where ecommerce, wallets, QR infrastructure, and digital lending are all still compounding.
    Multiple sizing lenses support a big addressable market, but they do not resolve neatly into one clean TAM number: 2025-2026
    BNPL estimates cluster from roughly US$8.6 billion to US$11.2 billion, while broader digital-lending and digital-payments
    pools are substantially larger. The practical takeaway is that market demand is real and expanding, but success depends
    on navigating wallet fragmentation, tighter OJK prudential rules, fraud and collections risk, and the economics of reaching
    tier-2 and tier-3 users at scale.'
sections:
- id: boundary-and-stack
  title: Market boundary and payment-stack context
  body: 'Kredivo does not compete in a generic “fintech TAM”; it sits at the intersection of Indonesian ecommerce checkout,
    digital consumer lending, and interoperable payment infrastructure. The relevant included spend is short-duration consumer
    financing for online and offline purchases, plus adjacent personal-credit use cases that ride the same underwriting and
    repayment rails. Excluded spend includes mortgages, large-ticket secured lending, pure deposit products, and enterprise
    treasury payments. The key structural enabler is that Indonesia’s payments system has been standardized quickly. Bank
    Indonesia’s QRIS regime mandates a common QR standard across providers, and QRIS explicitly supports funding sources that
    include bank accounts, cards, credit facilities, and server-based e-money. In practice that means BNPL can sit inside
    a wider wallet-and-bank ecosystem rather than living as a standalone financing island. PaymentBrief’s market map therefore
    matters: Indonesia is not just large, it is operationally complex, with wallets, bank transfers, BI-FAST, cards, and COD
    all remaining relevant depending on category, ticket size, and geography.'
  claimRefs:
