  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: From paylater app to multi-product consumer-finance stack
        blocks:
          - type: paragraph
            body: >-
              Kredivo’s delivered product is broader than the BNPL label suggests. The current Android listing still
              shows the classic core: pay-in-one-month, longer-tenor installments up to 24 months, limits up to IDR 50
              million, quick approval, and 2-click checkout across more than 10,000 merchants. But the same listing also
              shows direct in-app utility payments, top-ups, vouchers, and personal loans. Historical and current
              company releases add more layers. The 2023 Series D announcement described the platform as spanning online
              and offline BNPL, personal loans, and physical and virtual credit cards. The Infinite Card release made
              the credit line open-loop for Mastercard-accepting online merchants, while the Samsung Financing
              partnership showed Kredivo operating a branded financing workflow for a major OEM with differentiated
              pricing and no down payment. Krom then pushes the user workflow from credit into primary banking,
              deposits, payments, QRIS, and bank-originated lending. GajiGesa adds payroll-linked liquidity, and Vietnam
              adds cross-border versions of the stack. For product diligence, the important point is that Kredivo is
              best understood as a connected credit-and-banking workflow system, not just a checkout button.
