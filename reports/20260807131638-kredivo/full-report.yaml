              Kredivo’s public retention evidence is suggestive, not conclusive. The strongest positive signal is
              Kompas’s claim that users transact more than four times per month on average, because that suggests
              habitual rather than one-off usage. Tempo’s TransJakarta coverage adds another useful lens: 42% of users
