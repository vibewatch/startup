      - number: '4.4'
        title: 'Financial verdict: credible revenue plumbing, incomplete underwriting package'
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is mixed but directionally positive. Kredivo has credible revenue plumbing:
              disclosed consumer pricing, merchant-distribution scale, repeat bank funding, and a now-material
              deposit-funded bank subsidiary that is already profitable on a statutory basis. That is stronger than many
              private BNPL stories, which often disclose growth before funding stability or deposit depth. At the same
              time, public evidence still stops short of what an investor needs for a real underwriting view. Krom’s
              filings show that impairment expense is large relative to net interest income, which means the final
              margin outcome depends heavily on underwriting quality, recoveries, and funding mix. Public sources also
              do not disclose consolidated group revenue, gross profit, cash burn, or realized merchant take rate, so
              the market cannot tell how much of the customer value proposition is subsidized versus sustainably
              monetized. Relative to public peers such as Sea’s Monee or GoTo Fintech, Kredivo discloses far less about
              loss rates and contribution margins. The investable interpretation is therefore not that the model is
              weak, but that it is presently only partially transparent: good enough to support a constructive diligence
              posture, not good enough to skip direct data-room asks on cohorts, funding covenants, and runway.
