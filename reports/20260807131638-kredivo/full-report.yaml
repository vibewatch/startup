      - - Base
        - Market leadership persists, Krom scales, but economics and cap table remain only partially visible
        - US$1.3-1.7B; meaningful discount to historical US$2.5B anchor for opacity and risk
        - Loss-rate drift, cap-table overhang, bank-to-parent value transfer questions
