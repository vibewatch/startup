      - number: '3.3'
        title: Pricing visibility, distribution power, and substitute pressure
        blocks:
          - type: paragraph
            body: >-
              Public pricing disclosure is inconsistent, but it is enough to show how competition is shaping. Shopee
              PayLater publishes the clearest web disclosure locally, with pay-next-month at 0% and longer-tenor charges
              stepping up by user level. GoPay similarly discloses starting rates for both cash loans and paylater.
              Akulaku and Atome show some economic framing—fast approvals, flexible installments, or low/0%-starting
              charges—but push full fee detail deeper into the app. That matters because the strongest rivals are
              increasingly the ones that do not need to win on standalone app acquisition alone. Detik’s reporting on
              BNI’s planned channeling partnership with Shopee PayLater is revealing: a major bank judged it more
              efficient to plug into Shopee’s distribution and scoring loop than to build a separate BNPL rail from
              scratch. Sea’s 2026 results reinforce why this matters, showing enormous Shopee transaction volume and a
              substantial Monee loan book, while GoTo’s 2026 first-quarter release shows 69 million annual transacting
              users across the group and a fintech loan book nearing Rp10 trillion. Those platform assets do not
              automatically make their paylater products better underwriters, but they do make them hard to dislodge at
              checkout.
