      - number: '7.4'
        title: Execution risk is manageable only if the bench, reporting, and kill criteria are explicit
        blocks:
          - type: paragraph
            body: >-
              The final risk bucket is execution complexity. Kredivo is no longer just a BNPL app. It now spans
              regulated banking, deposits, payroll-linked access, large merchant integrations, and a second-country
              banking expansion through Timo in Vietnam. That broadens the opportunity set, but it also raises the odds
              that management attention gets fragmented across compliance, technology, funding, and integration
              workstreams. Public leadership buildout suggests the bench is deeper than a single-founder startup, yet
              the external evidence is still much thinner on governance depth than on product ambition. Investors
              therefore need clear kill criteria rather than generic comfort. The thesis should tighten materially if
              regulatory remediation slips, if bad-debt metrics keep deteriorating, if partner funding is withdrawn, if
              cyber or gateway incidents surface without a strong response, or if Vietnam consumes capital without
              producing demonstrable strategic or financial payoff. Put differently: the bull case can survive
              moderation in growth, but it should not survive a loss of trust in compliance, collections, or operating
              controls.
