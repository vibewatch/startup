              the bank. Official DBS reporting says 53.6% of Kredivo users now come from tier-2 and tier-3 cities and
              describes nearly six years of channeling collaboration, which supports the idea that customer adoption is
              broadening geographically rather than peaking in first-tier urban centers. Case-study evidence also
              matters. AVOW’s 2025 Kredivo case study claimed a 46% install-to-loan application rate, 2.2x growth in
              user-acquisition volume, and 4.7x growth in user spending through OEM channels, while a separate interview
              with Kredivo’s performance-marketing leader emphasized that quality of approved users matters more than
              raw install volume. Named deployment proof is also unusually concrete for a private fintech: Samsung
              Financing, TransJakarta payments, and broad merchant acceptance across Tokopedia, Shopee, Lazada,
              Alfamart, Indomaret, Tiket, Erafone, IKEA, and McDonald’s. What is still missing is a clean breakdown of
              active users, repeat borrowers, or unit economics by named channel.
