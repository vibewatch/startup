      - number: '1.3'
        title: Capital history and regional expansion milestones
        blocks:
          - type: paragraph
            body: >-
              Kredivo’s capital story is substantial but imperfectly disclosed. Official evidence shows a US$90 million
              Series C in December 2019 that pushed total 2019 capital above US$200 million when contemporaneous debt
              funding is included. In August 2021 FinAccel announced a planned SPAC merger at an implied US$2.5 billion
              pro forma equity value, with US$120 million of new PIPE capital plus a US$55 million concurrent commitment
              from existing investors, although the listing did not close. In March 2023 the group instead raised an
              oversubscribed ~US$270 million Series D led by Mizuho, including a US$125 million Mizuho investment, and
              tied that financing to the Krom launch agenda. The May 2026 Timo acquisition announcement then disclosed
              new capital from new and existing investors including Mizuho, Amazon, Asia Partners, Square Peg, and
              Cathay Innovation, and said the group had raised roughly US$500 million to date. That latest official
              total is below some third-party database estimates, so the company’s exact all-in capital base and
              post-2023 valuation remain open diligence items rather than settled facts.
