  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The regulatory perimeter is clearer in 2026, but it is also less forgiving
        blocks:
          - type: paragraph
            body: >-
              Kredivo operates in a part of Indonesian finance that is becoming more rule-bound exactly as scale is
              increasing. OJK’s December 2025 BNPL regulation and its 2026 implementing framework moved the market from
              loosely interpreted sector rules into a dedicated regime for banks and financing companies. That is
              helpful for legitimacy, but it also narrows room for product design, marketing, underwriting, and funding
              disclosure shortcuts. The most important new constraints are not theoretical. Public legal and news
              sources describe borrower-age and income minimums, repayment-capacity tests, disclosure of financing
              sources and transfer arrangements, prior approval for financing-company BNPL products, and OJK authority
              to terminate operations or impose sanctions. The significance for Kredivo is that its operating model now
              touches multiple regulated layers at once: digital credit, a bank subsidiary, third-party funding
              structures, and overseas expansion. In a benign environment, that structure looks like optionality. In a
              stressed environment, it can turn into a multi-front compliance and reporting burden with more ways for
              supervisors to slow growth.
