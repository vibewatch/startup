  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Third-party BNPL at checkout
        - Installment financing for online and offline merchant purchases
        - Mortgages, auto loans, long-tenor unsecured personal loans
        - Merchant integrates; consumer repays over time
        - Core Kredivo market.
      - - Wallet-linked paylater
        - Pay-later features embedded inside wallets and super-apps
        - Pure stored-value wallet balances without credit extension
        - Wallet operator distributes; consumer repays; merchant accepts
        - Important adjacent competition and distribution layer.
      - - Digital consumer lending
        - Short-tenor personal loans and related app-based credit
        - Corporate lending and secured lending
        - Consumer borrows directly; lender funds balance sheet
        - Expands TAM beyond checkout BNPL.
      - - Digital payments infrastructure
        - QRIS, BI-FAST, virtual accounts, e-money rails used to originate, collect, or settle repayments
        - Wholesale clearing and treasury infrastructure
        - PSPs, banks, and merchants pay integration and settlement costs
