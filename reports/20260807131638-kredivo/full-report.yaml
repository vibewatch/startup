chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, structure, and product scope
        blocks:
          - type: paragraph
            body: >-
              Kredivo began as FinAccel, a Singapore-headquartered fintech formed in 2015 to serve underbanked Southeast
              Asian consumers with fast, affordable credit. The operating franchise launched in Indonesia in 2016, then
              broadened from checkout financing into personal loans, cards, and digital banking. The March 2023 Series D
              announcement formalized the parent rebrand to Kredivo Group and described a multi-brand platform spanning
              Kredivo, KrediFazz, and Krom, while the May 2026 Timo acquisition extended that stack into Vietnam with a
              second digital-banking asset. The current footprint is therefore best understood as a regional
              consumer-finance group: Indonesia remains the core profit and distribution market, Vietnam is the key
              second geography for credit and banking expansion, and Thailand appears in official current-footprint
              language even though public operating detail there is still thin. For diligence purposes, the important
              structural point is that the consumer-credit app, the multi-finance activities, and the bank entity are
              complementary but not identical legal or regulatory surfaces.
