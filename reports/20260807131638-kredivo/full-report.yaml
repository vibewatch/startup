      - number: '7.2'
        title: The core model risk is still credit loss, fraud, and collections discipline
        blocks:
          - type: paragraph
            body: >-
              The public filings around Krom show why the core diligence burden should stay on credit quality rather
              than on top-line narrative. Krom is profitable and very well capitalized, but impairment still absorbs a
              very large share of spread. That means even moderate weakening in underwriting or collections can travel
              quickly into earnings quality. The operating interview evidence points in the same direction. Kredivo’s
              own marketing leader described fraud as the biggest enemy, split between user-level default and
              install-level traffic manipulation. The company appears to use bots, partner filtering, MMP tooling, and
              field collections as mitigants, but those mitigants confirm the problem is material rather than solved.
              The positive counterweight is that statutory solvency and liquidity at Krom are strong enough to absorb
              some volatility. The risk for investors is therefore not immediate insolvency. It is that rapid growth,
              broader tier-2 and tier-3 penetration, or essential-spend use cases could push loss rates up faster than
              pricing, collections, and capital redeployment can respond.
