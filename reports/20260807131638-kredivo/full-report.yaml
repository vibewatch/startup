            body: >-
              The most credible public adoption proof combines official statements, media reporting, and third-party
              operating case studies. Kompas reported more than 11 million Indonesian users and more than four
              transactions per user per month by June 2025, which is a much stronger loyalty marker than total app
              installs alone. Krom’s June 2026 milestone release then added over one million accounts and Rp10 trillion
