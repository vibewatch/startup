      - number: '5.3'
        title: Trust surfaces are strong on regulation, weaker on public technical assurance
        blocks:
          - type: paragraph
            body: >-
              Kredivo’s public trust story is driven more by licensing and regulated-entity controls than by public
              security-engineering documentation. The Android listing says user data is encrypted and that the product
              is licensed and regulated by OJK. The Krom product page says Flexi Loan is supervised by OJK and that
              deposits are protected by LPS within Indonesian insurance limits, while the Bank Bisnis acquisition
              release says all required OJK approvals were obtained for the bank-control transaction. OJK’s 2025 BNPL
              regulation then adds explicit public requirements around prudence, consumer protection, customer data
              protection, and disclosure. Krom’s audited 2025 and interim 2026 filings, plus its quarterly prudential
              metrics, give Kredivo something many private fintechs lack: a continuously reported bank layer with
              visible capital, liquidity, and statutory disclosures. The gap is that public sources do not show the kind
              of technical-assurance package enterprise buyers or security reviewers might want to see—no retained SOC
              2, ISO 27001, bug-bounty program, published uptime history, or public merchant integration documentation.
              That does not prove the controls are weak, but it does mean regulatory perimeter is easier to verify than
              security-program maturity.
