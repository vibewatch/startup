      - number: '2.3'
        title: Buyers, users, and payers in the adoption loop
        blocks:
          - type: paragraph
            body: >-
              The end user is an individual Indonesian consumer who wants checkout flexibility or short-tenor liquidity
              without a conventional credit card, but that user is not the only economic decision-maker. Merchants and
              marketplaces are the true commercial buyers because they choose whether to surface BNPL at checkout and
              effectively pay for conversion through merchant discount or partnership economics. Banks and institutional
              funders act as balance-sheet buyers of risk throughput, deciding whether the credit model deserves
              channeling facilities and warehouse lines. Wallet operators and super-apps are adjacent distributors that
              can either route users into BNPL or keep them inside competing payment loops. Public product pages
              reinforce how mainstream this has become: Kredivo and Indodana both advertise 30-day or multi-month
              installment options up to IDR 50 million, while OVO and DANA still frame themselves primarily as wallet
              ecosystems rather than pure-play installment platforms. That means the market is not only about borrower
              appetite; it is also about merchant AOV uplift, funder confidence, and whether distribution lives in
              ecommerce, wallets, digital banks, or public-transport and utility use cases.
            claimRefs:
