      - number: '8.4'
        title: The final call is track / research more, with explicit gates that could upgrade or downgrade the view
        blocks:
          - type: paragraph
            body: >-
              The right investment call on public evidence is track / research more with medium confidence and a high
              risk rating. That is not a soft refusal; it is a price-sensitive posture. Kredivo is better than a generic
              BNPL story because it has real scale, strategic investors, bank infrastructure, and visible operating
              proof. But the missing evidence is unusually concentrated in exactly the places that drive price:
              consolidated economics, loss-vintage detail, partner concentration, preference overhang, and how much of
              the bank’s apparent strength is freely transferable to the parent growth story. Several new but
              low-quality third-party directories and tag pages reinforce the point in a backhanded way: the company has
              broad visibility and many named partners, but very little high-quality structured third-party valuation
              data. The view upgrades if Kredivo can show disciplined asset quality, cleaner parent-level economics, and
              a valuation entry comfortably inside the base range. It downgrades if regulatory pressure, capital
              consumption, or loss intensity worsen while investors are still asked to pay near historical peak-like
              marks.
            claimRefs:
              - CV036
              - CV037
