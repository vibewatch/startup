  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Kredivo is strategically strong enough to matter, but not transparent enough to price aggressively
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case is easy to understand. Kredivo has built meaningful consumer-credit scale in a
              structurally attractive market, broadened into banking through Krom, maintained strong investor support,
              and shown enough user and merchant proof that the business is clearly real rather than promotional. The
              best evidence is not one metric but the combination: more than 11 million users by mid-2025, more than
              four transactions per user per month, 53.6% of users from tier-2 and tier-3 cities, more than one million
              Krom accounts and Rp10 trillion of deposits by June 2026, plus public evidence of profitability and strong
              prudential ratios at the bank subsidiary. The anti-thesis is equally clear. Credit-cost intensity remains
              high, the BNPL rulebook is tightening, partner and channel concentration are still opaque, and investors
              still cannot see a clean consolidated revenue, cash, or preference-stack picture. That means Kredivo may
              deserve a premium to weak local fintechs, but not blind acceptance of an undisclosed premium valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
