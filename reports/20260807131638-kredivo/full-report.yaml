  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, embedded rivals, and wallet substitutes'
        blocks:
          - type: paragraph
            body: >-
              Kredivo does not face a single competitor archetype. One layer consists of direct BNPL specialists such as
              Akulaku, Indodana, and Atome, each of which markets installment credit as the primary consumer
              proposition. A second layer is more dangerous strategically: super-app or marketplace-affiliated paylater
              products like Shopee PayLater and GoPay Later. Those products are not just alternative lenders; they are
              embedded inside high-frequency commerce or payments surfaces that already control user intent, checkout
              placement, and large first-party behavioral datasets. A third layer is made up of wallet substitutes such
              as OVO and DANA, which are not presented on the public web as dedicated paylater brands but still compete
              for transaction frequency, merchant acceptance, and consumer attention. Finally, global benchmarks like
              Klarna, Affirm, Afterpay, and PayPal show the feature direction the category can converge toward: cards,
              memberships, shopping discovery, and broad consumer-finance ecosystems. The competitive map therefore has
              to be read by channel power and product scope, not just by brand count.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP029
      - number: '3.2'
        title: Local competitor profiles and what they publicly disclose
        blocks:
          - type: paragraph
            body: >-
              Among local specialists, Akulaku is the broadest disclosed rival. Its official sites claim more than
              90,000 sellers, more than 1,000 platform partners, and explicit seller-conversion benefits from Akulaku
              PayLater; its finance arm also highlights OJK licensing and a buyer-seller financing model that spans
              online and offline use cases. Indodana presents a slightly different playbook: it markets its own paylater
              product, but the more interesting signal is distribution through co-branded programs such as Blibli and
              Tiket PayLater plus online/offline merchant acceptance through QR and barcode flows. Shopee PayLater and
              GoPay Later disclose less about standalone scale but more about where the product lives in the consumer
              journey. Shopee spells out limits to Rp50 million, multiple installment tenors, and app-native billing;
              GoPay positions Later inside a broader transfer, payment, and lending app, with explicit rate floors and
              selected-merchant use cases. Atome discloses regulatory presence but leaves much of its public competitive
              case to third-party summaries. The overall picture is that local rivals differ more by distribution
              architecture than by the basic existence of installment credit.
