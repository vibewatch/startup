      - number: '8.2'
        title: The financing history is supportive, but the visible valuation anchors still argue for discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest historical price anchor in public materials is the 2021 VPCII transaction, which assigned
              FinAccel a pro forma equity value of about US$2.5 billion and would have delivered over US$430 million of
              gross cash if it closed without heavy redemptions. That anchor matters because it proves sophisticated
              investors once saw a path to a much larger public valuation. It matters even more because the deal did not
              close, and management later said adverse market conditions made reviving the SPAC unattractive. Later
              financing evidence is supportive but less price-informative. The 2023 Series D brought in US$270 million,
              led by Mizuho, and the 2026 official raised-to-date figure of about US$500 million plus fresh strategic
              capital says investors still back the business. What public sources do not disclose is exactly what a
              valuation memo most wants to know: current post-money valuation, liquidation preferences, preference
              stack, parent cash, or whether new capital came in above, below, or roughly in line with prior marks.
              Public comps therefore have to do more work, but they also justify caution because firms like Affirm,
              Klarna, PayPal, Block, GoTo, and Sea either disclose more or operate in very different capital and
              regulatory environments.
