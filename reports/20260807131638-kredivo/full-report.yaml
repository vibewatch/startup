  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments span consumers, merchants, banks, depositors, and employers
        blocks:
          - type: paragraph
            body: >-
              Kredivo no longer serves only one buyer or one user archetype. The Android app still shows the familiar
              consumer-credit customer: shoppers using pay-next-month or longer installments across a long list of
              online and offline merchants. But other sources show adjacent segments becoming material. Krom adds retail
              banking users and depositors. GajiGesa adds employers and salaried employees via a B2B2C
              earned-wage-access model. Bank partners such as DBS and BCA Digital are economically important
              counterparties because they fund or channel credit growth. TransJakarta demonstrates that usage has spread
              into routine transport payments, while Samsung Financing shows named OEM-linked device buyers. The
              demographic and geographic mix is also broader than an upper-income Jakarta-only narrative. DBS’s 2026
              disclosure and independent media both point to strong tier-2 and tier-3 penetration, while Medcom says 71%
              of Ramadan 2024 transactions came from users aged 20-35 and that usage outside Jakarta and even outside
              Java was growing sharply. The practical takeaway is that Kredivo’s customer base is best read as a layered
              ecosystem of borrowers, spenders, savers, merchants, and distribution partners rather than a single-user
              fintech niche.
