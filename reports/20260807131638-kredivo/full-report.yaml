            GoTo reported 69M annual transacting users and a Rp9.9T fintech loan book in Q1 2026, giving GoPay Later
            strong ecosystem adjacency.
        - label: Akulaku disclosed merchant scale
          detail: 90,000+ sellers and 1,000+ platform partners are among the strongest public local specialist scale signals.
        - label: Regulatory cleanliness risk
          detail: Akulaku’s BNPL restriction history shows the category can lose growth latitude when controls fail.
        - label: Pricing-transparency gap
          detail: Shopee and GoPay publish clearer public rate floors than several standalone peers.
        - label: Global feature-compression risk
          detail: >-
            Klarna, Affirm, Afterpay, and PayPal already bundle installments with cards, shopping, or wallet features;
            local BNPLs may need to follow.
    claimRefs:
      - CP008
      - CP017
      - CP023
      - CP024
      - CP026
      - CP036
      - CP039
      - CP040
    approximationNotes: These are evidence-backed competitive readiness indicators, not financial KPIs from one common reporting standard.
