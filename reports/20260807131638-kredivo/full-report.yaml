    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Regulatory escalation
        - Material OJK remediation, sanction, or rollout restriction
        - Turns growth optionality into compliance drag and valuation discount
        - Pause deployment or demand much lower entry pricing
      - - Loss intensity worsening
        - Impairment burden rises further without pricing or capital offset
        - Weakens the case that Krom can support premium fintech valuation
        - Shift toward bear case and demand full credit tape
      - - Funding stress
        - Partner line non-renewal or deposit growth reversal
        - Reduces scaling capacity and exposes concentration
        - Cut scenario range and require structural protections
      - - Parent-economics opacity persists at signing
        - No credible parent revenue, burn, or preference disclosure before investment
        - Makes the valuation too hard to defend with discipline
        - Do not invest on common-like terms
      - - Operational trust event
        - Material cyber, outage, or dispute spike without strong remediation
        - Damages brand and invites supervisory attention
        - Reassess immediately and widen downside range
      - - Vietnam or adjacent expansion overconsumes capital
        - Regional optionality fails to convert into evidence-backed value
        - Turns strategic upside into distraction
        - Treat expansion as neutral-to-negative until proven otherwise
    notes: These are not all downside events; they are the specific events that should change the investment decision.
