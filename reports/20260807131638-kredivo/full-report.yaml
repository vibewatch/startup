      - number: '5.2'
        title: Architecture is data-led, partnership-heavy, and increasingly bank-linked
        blocks:
          - type: paragraph
            body: >-
              The public architecture story is operational rather than deeply documented, but it is still specific
              enough to map. Company and media sources repeatedly describe real-time decisioning, alternative-data
              underwriting, and an open-loop merchant network as the key technical foundation. The Android listing says
              onboarding works by connecting digital accounts, while TechCrunch says Kredivo assesses creditworthiness
              using data from telcos, e-commerce accounts, and bank accounts rather than relying only on traditional
              credit bureaus. The Samsung partnership adds a white-label deployment model in which Kredivo manages the
              financing product behind another brand’s user experience. Vietnam adds a local-partner model: Kredivo
              entered through a joint venture with Phoenix Holding and used VietCredit to operate the paylater business,
              staging rollout from bill pay and personal loans into e-commerce BNPL. Krom adds a regulated-bank layer
              that now exposes deposits, QRIS payments, transaction history, and bank-side credit products. GajiGesa
              adds an employer-integration layer, with official materials saying companies onboard through simple
              integrations to their existing systems. The common pattern is clear: Kredivo does not appear to win by
              exposing a public developer platform. It wins by embedding its scoring and funding logic into partner,
              merchant, employer, and bank workflows.
