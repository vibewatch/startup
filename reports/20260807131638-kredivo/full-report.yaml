              which implies the product is embedding into recurring life events instead of purely discretionary
              purchases. Medcom’s Ramadan feature reinforces that pattern by showing 3x year-on-year growth in offline
              transactions during Ramadan 2024, strong growth outside Jabodetabek and outside Java, and a young 20-35
              user skew. Krom’s one-million-account milestone also matters because management says it was achieved
              organically before fully exploiting the Kredivo installed base, which creates future land-and-expand
              potential if cross-sell works. The unresolved downside is concentration. Public sources do not show
              merchant concentration, top-partner revenue share, customer-payback cohorts, or renewal/churn by segment.
