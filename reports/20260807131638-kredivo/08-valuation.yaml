- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - FinAccel / Kredivo 2021 VPCII transaction
    - Historical equity value anchor
    - ~US$2.5B pro forma equity value; deal later abandoned
    - Most direct public valuation marker for the same asset
    - Set in a very different market window and never completed
  - - Affirm
    - Public BNPL disclosure depth
    - Public annual and quarterly reporting with APR, lender, and product disclosures
    - Closest major public pure-play BNPL reference for disclosure style
    - US market, cost of capital, and consumer mix differ materially
  - - Klarna
    - Global BNPL private/public-reporting reference
    - Financial-report investor page available
    - Useful for international BNPL framing
    - European/global mix and private-market context are not Indonesia-specific
  - - PayPal
    - Checkout finance inside a large payments incumbent
    - Public annual reports and proxies; pay-later is part of a broader payments stack
    - Helpful for merchant-scale and checkout context
    - Too diversified to read through directly to Kredivo
  - - Block / Afterpay
    - BNPL inside a merchant/payments ecosystem
    - Public annual-report and filing infrastructure
    - Relevant for merchant-finance adjacency and ecosystem value
    - BNPL is only one module inside a much larger public company
  - - Sea / SeaMoney
    - Regional digital-finance adjacency
    - Public quarterly results and SEC reporting
    - Relevant Southeast Asia scale comparator with lending and wallet exposure
    - Group mix is much broader than Kredivo and not a pure consumer-credit comp
  - - GoPay / GoTo fintech surfaces
    - Local strategic competition
    - Official local product surface plus public results elsewhere
    - Reminds investors that super-app competitors can compress economics
    - Not a clean standalone valuation comp for BNPL credit
  notes: This table is for anchor selection, not mechanical multiple transfer.
  enumerationScope:
    coverage: partial
    basis: Captures the most decision-relevant public comparables and anchors visible from retained sources.
