  claims:
  - id: CV001
    statement: Kredivo has enough product-market proof to justify real investment attention rather than lightweight monitoring.
    type: inferred
    topic: investment-thesis
    sourceRefs:
    - SV028
    - SV029
    - SV031
    - SV032
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV001
    - QV002
  - id: CV002
    statement: The strongest pro-thesis is the combination of market leadership in Indonesian digital credit, repeat consumer usage, and a growing bank subsidiary rather than any single headline metric.
    type: inferred
    topic: investment-thesis
    sourceRefs:
    - SV008
    - SV009
    - SV028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: Krom meaningfully upgrades business quality because it gives Kredivo a visible regulated balance-sheet and disclosure layer that pure BNPL platforms often lack.
    type: inferred
    topic: quality-uplift
    sourceRefs:
    - SV005
    - SV006
    - SV007
    - SV008
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV004
    statement: That quality uplift is moderated by still-heavy impairment, which keeps Kredivo closer to a credit-risk story than to a software-style valuation story.
    type: inferred
    topic: quality-uplift
    sourceRefs:
    - SV005
    - SV006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
    - QV007
  - id: CV005
    statement: The biggest anti-thesis is that regulation, loss intensity, and concentration can all force a valuation discount before they threaten the company’s survival.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV010
    - SV011
    - SV012
    - SV013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
    - QV018
  - id: CV006
    statement: Public evidence does not support paying for Kredivo as if it were a low-friction consumer internet marketplace; it still has meaningful credit and regulatory drag.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV005
    - SV010
    - SV011
    - SV027
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
  - id: CV007
    statement: The Indonesian BNPL and alternative-lending category is still large and growing fast enough to support a premium strategic narrative for a market leader.
