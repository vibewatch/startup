- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bear
    - Krom remains useful but loss rates stay elevated; rules tighten; concentration and parent opacity persist
    - US$0.9-1.2B; valued more like a risky emerging-market lender than a premium fintech platform
    - Credit losses, regulatory friction, funding concentration
    - Possible if asset quality worsens or funding appetite weakens
  - - Base
    - Market leadership persists, Krom scales, but economics and cap table remain only partially visible
    - US$1.3-1.7B; meaningful discount to historical US$2.5B anchor for opacity and risk
    - Loss-rate drift, cap-table overhang, bank-to-parent value transfer questions
    - Most consistent with current public evidence
  - - Bull
    - Krom cross-sell works, loss discipline holds, and regional expansion increases strategic value without blowing up complexity
    - US$2.0-2.5B; approaches the old SPAC anchor only with materially stronger disclosure and execution confidence
    - Overpaying before proof, execution strain, public-market multiple compression
    - Requires several diligence upgrades, not just narrative optimism
  notes: Ranges are synthesis, not a discounted cash-flow output.
