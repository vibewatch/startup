- id: scenario-range-and-entry-discipline
  title: The base case should sit below the old SPAC mark until diligence closes the biggest gaps
  body: A scenario-based range is more defensible than a point estimate. In the bear case, the company is still important but valued mostly as a tightly regulated consumer lender with elevated loss and disclosure risk; that case lands around US$0.9-1.2 billion. In the base case, Kredivo gets credit for market leadership, meaningful banking optionality, and resilient investor backing, but still carries a substantial opacity discount; that supports roughly US$1.3-1.7 billion. In the bull case, Krom becomes a true funding and cross-sell engine, Indonesia credit quality stays controlled, and the group eventually re-earns something closer to the confidence embedded in the 2021 SPAC anchor; that gets back toward US$2.0-2.5 billion. The practical recommendation is therefore not “no.” It is “not yet at any price.” If an investor can only enter at a valuation close to, or above, the historical US$2.5 billion mark without preferred protections, public evidence does not support that risk/reward today.
    If entry is materially below the base range or paired with stronger diligence and downside protection, the name becomes far more interesting.
