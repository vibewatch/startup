artifact: valuation
slug: kredivo
runDate: '2026-08-07'
company:
  name: Kredivo
chapter:
  number: 8
  title: Valuation
  summary: 'Kredivo clears the quality bar for a serious watchlist position, but not yet the evidence bar for an unconditional buy at an opaque premium valuation. The company has real scale, visible investor support, a profitable and well-capitalized bank subsidiary, and unusually strong market relevance for Indonesian consumer credit. But the public record still lacks the items that matter most for pricing: consolidated revenue, burn, cap-table overhang, channel-level loss economics, and a current disclosed round valuation. The strongest direct price anchor remains the abandoned 2021 SPAC transaction at roughly US$2.5 billion, which now looks more like a ceiling for a bull case than a neutral base case. On current evidence, the right stance is track / research more, with willingness to engage only at a material discount to the old peak-like anchor or with strong downside protections and fuller diligence.'
sections:
- id: thesis-and-anti-thesis
  title: Kredivo is strategically strong enough to matter, but not transparent enough to price aggressively
  body: 'The pro-investment case is easy to understand. Kredivo has built meaningful consumer-credit scale in a structurally attractive market, broadened into banking through Krom, maintained strong investor support, and shown enough user and merchant proof that the business is clearly real rather than promotional. The best evidence is not one metric but the combination: more than 11 million users by mid-2025, more than four transactions per user per month, 53.6% of users from tier-2 and tier-3 cities, more than one million Krom accounts and Rp10 trillion of deposits by June 2026, plus public evidence of profitability and strong prudential ratios at the bank subsidiary. The anti-thesis is equally clear. Credit-cost intensity remains high, the BNPL rulebook is tightening, partner and channel concentration are still opaque, and investors still cannot see a clean consolidated revenue, cash, or preference-stack picture. That means Kredivo may deserve a premium to weak local fintechs, but not
    blind acceptance of an undisclosed premium valuation.'
  claimRefs:
