    topic: adoption-proof
    sourceRefs:
    - SV008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
    - QV006
  - id: CV010
    statement: DBS’s 2026 Rp3 trillion channeling line confirms strategic bank support, but it also reminds investors that external funding relationships still matter for scale.
