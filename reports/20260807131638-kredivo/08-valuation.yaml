    topic: market-attractiveness
    sourceRefs:
    - SV014
    - SV015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
  - id: CV008
    statement: More than 11 million users, more than four transactions per user per month, and large named merchant acceptance give Kredivo better adoption proof than many private fintechs disclose publicly.
    type: third-party-reported
    topic: adoption-proof
    sourceRefs:
    - SV028
