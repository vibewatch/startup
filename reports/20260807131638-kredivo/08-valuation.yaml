- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Consolidated parent financials
    - Revenue, gross margin, burn, cash runway, and debt at the holdco / group level
    - Without them, valuation precision is false
    - Request audited parent pack and monthly management accounts
  - - Cap table and preference stack
    - Current post-money, liquidation preferences, anti-dilution, and investor rights
    - Determines whether a headline valuation is economically attractive to new money
    - Request current cap table, term sheets, and waterfall analysis
  - - Credit cohort quality
    - Vintage losses, recoveries, first-payment default, and channel-level cohorts
    - Loss quality is the most important swing factor for value
    - Request full credit tape and underwriting backtests
  - - Bank-to-parent value transfer
    - Transfer pricing, funding cost, and overlap between Krom and Kredivo users
    - Shows whether bank optionality is accretive or mostly ring-fenced
    - Request treasury and transfer-pricing policy plus cross-sell funnel
  - - Partner concentration
    - Top merchants, top channels, and top funding partners by share and margin
    - Broad logos can still hide narrow economics
    - Request top-10 exposure tables with stress tests
  - - Public-market readiness
    - IPO path, governance depth, and reporting cadence
    - Important if the long-term exit case relies on a public listing return
    - Request board committee materials, reporting calendar, and listing-readiness plan
  notes: If these asks are answered well, the recommendation can improve quickly. If they are not, price discipline should tighten further.
