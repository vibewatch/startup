- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - what would change the view
  rows:
  - - Indonesia BNPL and digital credit remain large enough for a category leader to compound
    - Would weaken if tighter OJK rules permanently compress approvals or customer-quality economics
  - - 'Kredivo has hard adoption proof: users, transactions, partner depth, and Krom accounts'
    - Would weaken if repeat usage proves promotional or channel-concentrated rather than durable
  - - Krom gives Kredivo a stronger funding and regulatory asset than most BNPL peers
    - Would strengthen further with clean consolidated cross-sell, funding-cost, and transfer-pricing disclosure
  - - Investor support from Mizuho and others reduces survivorship risk
    - Would matter less if new capital terms imply heavy preference overhang or value transfer away from common equity
  - - The old US$2.5B SPAC mark proves prior strategic ambition
    - Would become relevant again only if the business can show cleaner parent economics and public-market readiness
  - - Opacity on revenue, burn, cap table, and loss vintages blocks a full buy call today
    - Would improve materially with audited parent financials, cap-table details, and product-level cohort data
  notes: The anti-thesis is mostly about price and evidence quality, not whether Kredivo is a real business.
