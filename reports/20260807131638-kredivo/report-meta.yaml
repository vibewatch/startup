companyProfile:
  summary: Kredivo Group, formerly FinAccel, is a Singapore-parented Southeast Asian consumer-finance platform whose core Indonesian franchise combines BNPL, personal loans, merchant finance, and digital banking via Krom Bank. Founded in 2015 and launched operationally in Indonesia in 2016, the company expanded from checkout credit into a broader multi-brand stack spanning Kredivo, KrediFazz, Krom, GajiGesa, and now Timo in Vietnam. Public disclosures suggest real scale, meaningful bank funding and deposit traction, and continuing investor support, but still leave material gaps on consolidated parent economics and current fair value.
  foundedDate: '2015-12-01'
