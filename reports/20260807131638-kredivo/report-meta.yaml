  headquarters: Jakarta, Indonesia
  productSummary: Consumer BNPL, personal loans, merchant finance, card-like credit access, digital banking through Krom Bank, employer-linked earned-wage access through GajiGesa, and regional banking expansion through Timo in Vietnam.
  customerFocus: Underbanked and mass-market Southeast Asian consumers, merchant partners, bank-funding partners, and retail depositors.
  businessModel: Consumer-credit origination and servicing combined with merchant finance, bank funding/deposits, and broader digital-finance cross-sell.
  stage: late-stage private
  fundingStatus: Raised roughly US$500 million officially to date, including a ~US$270 million Series D in 2023 and fresh 2026 capital from new and existing strategic investors.
