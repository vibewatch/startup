- id: local-profiles
  title: Local competitor profiles and what they publicly disclose
  body: 'Among local specialists, Akulaku is the broadest disclosed rival. Its official sites claim more than 90,000 sellers,
    more than 1,000 platform partners, and explicit seller-conversion benefits from Akulaku PayLater; its finance arm also
    highlights OJK licensing and a buyer-seller financing model that spans online and offline use cases. Indodana presents
    a slightly different playbook: it markets its own paylater product, but the more interesting signal is distribution through
    co-branded programs such as Blibli and Tiket PayLater plus online/offline merchant acceptance through QR and barcode flows.
    Shopee PayLater and GoPay Later disclose less about standalone scale but more about where the product lives in the consumer
    journey. Shopee spells out limits to Rp50 million, multiple installment tenors, and app-native billing; GoPay positions
    Later inside a broader transfer, payment, and lending app, with explicit rate floors and selected-merchant use cases.
    Atome discloses regulatory presence but leaves much of its public competitive case to third-party summaries. The overall
    picture is that local rivals differ more by distribution architecture than by the basic existence of installment credit.'
