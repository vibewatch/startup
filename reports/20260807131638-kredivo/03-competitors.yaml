- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Merchant integration network is durable
    - Embedded rivals own native checkout placement inside Shopee or GoTo
    - high
    - Quantify merchant conversion uplift and exclusivity versus embedded paylater products
  - - Risk underwriting quality is the moat
    - Regulatory mistakes can still halt growth, as Akulaku’s 2024 sanction history shows
    - high
    - Request delinquency, fraud, and remediation metrics versus peers and OJK findings
  - - Funding partnerships create advantage
    - Banks may prefer channeling through scaled ecosystems rather than standalone BNPL apps
    - high
    - Map current and target channeling / warehouse lines by partner and covenant
  - - Broader product stack will defend share
    - Global peers already show cards, memberships, cashback, and wallet features becoming table stakes
    - medium
    - Assess Kredivo/Krom cross-sell, card strategy, and non-checkout engagement depth
  - - Public pricing opacity protects economics
    - Opaque fees can slow consumer trust or regulatory goodwill if peers publish clearer terms
    - medium
    - Benchmark fee transparency, dispute rates, and support SLAs against Shopee and GoPay
  - - Private-company disclosure can stay limited
    - Public-company-backed rivals and global listed peers provide more operating transparency to partners and investors
    - medium
    - Request internal share, GMV, active-user, and loss-rate dashboards to compensate for market opacity
  notes: The most credible threats are distribution compression, funding concentration, and regulatory execution—not just
    headline brand rivalry.
