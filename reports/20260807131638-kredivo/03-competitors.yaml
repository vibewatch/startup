- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider
  - public limit / volume signal
  - public tenor / package
  - public pricing signal
  - unknowns
  - implication
  rows:
  - - Akulaku
    - 90,000+ sellers; 1,000+ partners
    - Installments across app, ecommerce, and offline partners
    - Blog promises transparent fees but pushes details into app
    - Realized APR, late fees, and MDR not disclosed on retained web pages
    - Strong distribution pitch, weaker public pricing transparency
  - - Indodana
    - Broad online/offline merchant list
    - Paylater plus QR/barcode offline flows; co-branded programs
    - No robust rate card surfaced on retained public pages
    - Interest, fees, and merchant economics remain under-disclosed
    - Competes via distribution breadth more than fee transparency
  - - SPayLater
    - Rp750k to Rp50m limits
    - Next-month plus 3/6/12/18/24-month plans for selected users
    - 0% for pay-next-month; roughly 1.95%-3.95% monthly charges depending on level/product
    - Realized approval rates and merchant economics not public
    - Most transparent mainstream local web fee disclosure
  - - GoPay Later
    - User-selected limit; daily-use app distribution
    - Later sits beside GoPay Pinjam and other wallet/lending products
    - GoPay Later starts from 2%; GoPay Pinjam starts from 1.13%
    - Exact Later fee grid by user type not public on retained pages
    - Shows super-app lenders can advertise simple entry pricing
  - - Atome
    - Third-party guides cite up to 12 months
    - Installments plus Atome Card
    - Interest starting from 0% per third-party guide
    - Late fees and detailed pricing absent from retained official pages
    - Competes as shopping finance but leaves diligence gaps
  - - Affirm / Klarna / Afterpay / PayPal
    - Millions of stores / 90m users / 1m+ merchants depending on brand
    - Pay-in-4 plus longer plans, cards, memberships, or wallet integrations
    - Affirm discloses 0%-36% APR; PayPal and Afterpay disclose plan structure; Klarna emphasizes flexible options
    - Merchant pricing and realized take rates remain opaque from retained sources
    - Global peers illustrate how product stacks expand beyond simple installments
  notes: This is a public-web comparison, not a realized unit-economics table. Unknowns remain material because most providers
    do not publish full fee grids or merchant pricing.
