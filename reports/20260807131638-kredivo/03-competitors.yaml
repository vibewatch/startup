- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse competitor evidence
  body: 'The most important adverse evidence is that distribution and compliance can outrank brand in this category. Akulaku’s
    2024 sanction episode demonstrates that even scaled lenders can lose operating freedom if risk controls slip; regulatory
    cleanliness is therefore part of the moat, not a back-office detail. The platform-affiliated players also show how standalone
    BNPL economics can be squeezed from both sides. On one side, banks may prefer channeling into embedded ecosystems—where
    checkout demand, scoring data, and funding throughput are already assembled—rather than building their own BNPL UX. On
    the other, global leaders show how the category keeps expanding outward: Klarna bundles cards, savings, memberships, cashback,
    and shopping; Affirm combines pay-in-4 with debit and virtual-card rails; Afterpay and PayPal use large installed consumer
    bases to turn installment credit into a feature rather than a destination app. Kredivo’s moat is therefore unlikely to
    come from simply offering installment credit. It has to come from better risk selection, merchant conversion uplift, funding
    resilience, and a product stack that is hard enough to replicate that embedded competitors cannot reduce the category
    to a commodity checkout toggle.'
