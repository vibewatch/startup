tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - public scale / funding signal
  - target segment
  - differentiation
  - limitation vs Kredivo
  rows:
  - - Akulaku
    - Direct peer
    - 90,000+ sellers; 1,000+ platform partners; OJK-licensed finance arm
    - Mass-market consumers and merchants online/offline
    - Large merchant base, seller-conversion pitch, regional footprint
    - Regulatory blemish in 2024; public fee disclosure still partial
  - - Indodana
    - Direct peer
    - Own paylater plus co-branded Blibli and Tiket PayLater programs
    - Consumers needing ecommerce, travel, and offline installment options
    - White-label distribution plus online/offline merchant acceptance
    - Less public scale disclosure than Akulaku or Kredivo
  - - SPayLater
    - Embedded marketplace rival
    - Integrated inside Shopee; explicit limits up to Rp50 million and up to 24-month tenor
    - Shopee shoppers at checkout
    - Native marketplace placement and group-channel bank partnerships
    - Lives mainly inside Shopee ecosystem and selected users / levels
  - - GoPay Later
    - Embedded super-app rival
    - GoTo-backed lending surface inside daily-use payments app
    - GoFood, Tokopedia, and selected-merchant users
    - Daily-use app, broad partner network, visible rate floors
    - Less clearly positioned as dedicated BNPL specialist
  - - Atome
    - Direct / adjacent peer
    - OJK-licensed finance entity; third-party market guides show up to 12-month installments
    - Shopping-oriented consumers at participating merchants
    - Merchant-led omnichannel finance, card adjacency
    - Public site discloses less pricing detail than Shopee or GoPay
  - - OVO
    - Wallet substitute
    - Merchant rewards-and-payments surface
    - Consumers prioritizing wallet payments and deals
    - High-frequency wallet use and merchant relationships
    - Public web does not frame OVO as dedicated paylater leader
  - - DANA
    - Wallet substitute
    - General-purpose digital wallet brand
    - Consumers prioritizing wallet payments and bill pay
    - Broad payment utility and daily transaction relevance
    - Public web is wallet-first, not installment-first
  - - Klarna / Affirm / Afterpay / PayPal
    - Global benchmark set
    - Klarna 90m users and 1m+ merchants; PayPal says BNPL at millions of stores
    - Developed-market installment and checkout-credit users
    - Shows end-state feature expansion into cards, shopping, memberships, and wallet-adjacent finance
    - Not local Indonesian direct operators today; competitive value is directional benchmark
  notes: Profiles emphasize public evidence about distribution model, scale signals, and disclosed product surface rather
    than unsupported market-share assertions.
