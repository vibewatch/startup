company:
  name: Kredivo
chapter:
  number: 3
  title: Competitors
  summary: Kredivo competes in a layered Indonesian checkout-credit field rather than against one neat peer set. The direct
    private rivals are Akulaku, Indodana, and Atome; the hardest local substitutes are Shopee PayLater and GoPay Later because
    they arrive with native checkout placement, first-party transaction data, and public-company balance-sheet support; and
    the broadest global benchmark set is Klarna, Affirm, Afterpay, and PayPal. The practical moat question is therefore not
    whether Kredivo has competitors—it clearly does—but whether standalone BNPL specialists can keep differentiated approval
    quality, funding access, and merchant conversion economics once platform-affiliated paylater products and broader wallet
    ecosystems mature.
sections:
- id: landscape-and-classes
  title: 'Landscape: direct peers, embedded rivals, and wallet substitutes'
  body: 'Kredivo does not face a single competitor archetype. One layer consists of direct BNPL specialists such as Akulaku,
    Indodana, and Atome, each of which markets installment credit as the primary consumer proposition. A second layer is more
    dangerous strategically: super-app or marketplace-affiliated paylater products like Shopee PayLater and GoPay Later. Those
    products are not just alternative lenders; they are embedded inside high-frequency commerce or payments surfaces that
    already control user intent, checkout placement, and large first-party behavioral datasets. A third layer is made up of
    wallet substitutes such as OVO and DANA, which are not presented on the public web as dedicated paylater brands but still
    compete for transaction frequency, merchant acceptance, and consumer attention. Finally, global benchmarks like Klarna,
    Affirm, Afterpay, and PayPal show the feature direction the category can converge toward: cards, memberships, shopping
    discovery, and broad consumer-finance ecosystems. The competitive map therefore has to be read by channel power and product
    scope, not just by brand count.'
