tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / proof
  - revenue or strategic value
  - gap
  rows:
  - - Mass-market consumer borrowers
    - Buyer=user=payer
    - Installments, pay-next-month, personal loans, bills, vouchers
    - 11M+ Indonesia users; 4+ transactions per user per month
    - Core credit demand and repeat usage engine
    - No public active-user, cohort-loss, or ARPU split by product
  - - Tier-2/3 households
    - Buyer=user=payer
    - Daily needs, health, education, productive needs
    - 53.6% of users from tier-2/3 cities
    - Expands TAM beyond first-tier urban centers and supports inclusion narrative
    - No public city-level default or repeat-usage economics
  - - Productive-needs users
    - Buyer=user=payer
    - Transport, health, groceries, routine shopping
    - 42% of users use PayLater for productive needs
    - Supports habit-forming, recurring spend use cases
    - No public breakdown by spend vertical or repayment quality
  - - Named merchant / marketplace shoppers
    - Buyer=user; merchants enable acceptance
    - Checkout finance at Tokopedia, Shopee, Lazada, Alfamart, Indomaret, Tiket, Erafone, IKEA, McDonald’s and others
    - Official app listing plus merchant-integration references
    - Distribution and conversion leverage
    - No public merchant-by-merchant GMV, repeat rate, or concentration
  - - Krom banking users and depositors
    - Buyer=user=payer / depositor
    - Savings, QRIS, payments, lending
    - 1M+ accounts and Rp10T deposits by June 2026
    - Daily-use finance loop and deposit funding base
    - No public overlap rate with Kredivo app users
  - - Employer-linked EWA users
    - Employer buyer; employee user
    - Earned wage access through GajiGesa
    - 400 employers and 350k employees
    - B2B2C distribution wedge into payroll-linked finance
    - No public employer concentration or employee retention
  - - Bank and channel partners
    - Partner payer / funder
    - DBS and BCA channel credit funding; Samsung device finance
    - DBS line up to Rp3T; named BCA and Samsung programs
    - Expands reach and capital capacity without building every channel alone
    - Economic dependence on a small set of strategic partners is not disclosed
  notes: Segmentation mixes end users, economic partners, and channel-enabling counterparties because all three shape adoption durability in consumer finance.
