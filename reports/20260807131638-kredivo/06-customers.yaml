- id: retention-expansion-and-concentration-risk
  title: Retention looks promising from usage proxies, but concentration is still opaque
  body: 'Kredivo’s public retention evidence is suggestive, not conclusive. The strongest positive signal is Kompas’s claim that users transact more than four times per month on average, because that suggests habitual rather than one-off usage. Tempo’s TransJakarta coverage adds another useful lens: 42% of users reportedly already use PayLater for productive needs such as transport, health, and routine shopping, which implies the product is embedding into recurring life events instead of purely discretionary purchases. Medcom’s Ramadan feature reinforces that pattern by showing 3x year-on-year growth in offline transactions during Ramadan 2024, strong growth outside Jabodetabek and outside Java, and a young 20-35 user skew. Krom’s one-million-account milestone also matters because management says it was achieved organically before fully exploiting the Kredivo installed base, which creates future land-and-expand potential if cross-sell works. The unresolved downside is concentration. Public
    sources do not show merchant concentration, top-partner revenue share, customer-payback cohorts, or renewal/churn by segment. The existence of major channels such as Samsung, TransJakarta, DBS, BCA Digital, and large marketplaces proves reach, but it also means important demand loops may depend on a relatively compact set of channels and partners. The customer story is therefore attractive, but still only partially underwritten in public and only partially stress-tested.'
