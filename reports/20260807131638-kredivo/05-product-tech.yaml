    - 2.35% monthly, 30-day or installment options, no down payment
    - Public evidence is partner-specific rather than broad merchant-doc template
  - - Primary banking and savings allocation
    - Open Krom, save into pockets/deposits, transfer, top up, pay bills, scan QRIS
    - Krom daily-banking workflow
    - High deposit rates, 100 free transfers/top-ups monthly, QRIS merchant payments
    - No public reliability or MAU data
  - - Salary-linked shortfall management
    - Employee accesses earned wages via employer-linked integration
    - GajiGesa EWA workflow
    - 400 employers and 350,000 employees per official source
    - No public product-level retention or take-rate detail
  - - New-country rollout
    - Enter market with local partner and staged product launch
    - Vietnam JV + VietCredit + later Timo banking asset
    - Shows portability of Kredivo scoring and workflow beyond Indonesia
