- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process / component
  - role
  - dependency
  - risk
  rows:
  - - Digital-account onboarding
    - Collects user context during application and supports faster approval
    - User willingness to connect accounts; data availability
    - Opaque data-rights and model-performance disclosure
  - - Alternative-data credit scoring
    - Replaces sole reliance on bureau data with telco, ecommerce, and bank-account signals
    - Partner data access and model governance
    - No public precision / recall, fraud, or vintage metrics
  - - Real-time decisioning engine
    - Turns data into instant approval and merchant-ready credit
    - Data freshness and low-latency systems
    - Limited public documentation on uptime, fallback rules, or manual overrides
  - - Open-loop merchant network
    - Distributes credit across online and offline merchants and branded partner flows
    - Merchant integrations and partner contracts
    - No public merchant API / onboarding docs retained
  - - Card rails and payment acceptance
    - Extends credit line beyond native checkout through Mastercard and merchant partnerships
    - Card-network and issuer relationships
    - Adoption outside launch announcements is not public
  - - Krom bank layer
    - Provides deposits, payments, QRIS, reporting, and bank-originated lending
    - Regulatory capital, core-banking operations, public-company discipline
    - Transfer-pricing and app-to-bank user linkage are not public
  - - Employer integration layer
    - Lets GajiGesa connect into employer systems for EWA
    - Employer-system compatibility and payroll data integrity
    - No public implementation-time or failure-rate data
  - - Local-country partner layer
    - Uses Phoenix/VietCredit and now Timo to localize distribution and banking in Vietnam
    - Local regulatory and partner execution quality
    - Current post-acquisition integration detail remains sparse
  notes: This is the best public reconstruction of Kredivo’s operating architecture from retained sources; it highlights process dependencies rather than claiming undocumented software internals.
