- id: roadmap-and-differentiation
  title: 'Roadmap logic: deepen everyday finance and use banking to widen moat'
  body: 'The roadmap pattern across 2021-2026 is consistent. Kredivo first broadened distribution and payment form factors—Samsung Financing, Infinite Card, and Vietnam launch—then moved into regulated banking via Bank Bisnis/Krom, then expanded adjacencies such as earned wage access and a second digital-banking asset in Vietnam. Krom’s June 2026 milestone release is particularly useful because it reveals the next product priorities explicitly: payments, lending, and fuller synergy with Kredivo’s tens of millions of potential users. Together with the current Krom product page, that suggests the company wants a daily-use finance loop rather than a periodic checkout-credit tool. The strongest differentiation claims in public sources are therefore not cosmetic UI claims. They are the combination of alternative-data underwriting, open-loop distribution across online and offline merchants, banking rails that can absorb deposits and payments, and a product stack broad enough to cross-sell from
    salary access to banking to consumer credit. The weak point is still documentation depth: public evidence supports the roadmap direction, but not yet detailed API, reliability, or model-performance proof for every module.'
