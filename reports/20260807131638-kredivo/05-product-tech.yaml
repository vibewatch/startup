tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - module / asset
  - primary user
  - status / maturity
  - differentiation
  - diligence gap
  rows:
  - - Kredivo pay-in-one-month and installment plans
    - Consumer shopper / borrower
    - Live, mass-market
    - No-card checkout credit across online and offline channels with 2-click checkout
    - Need approval-rate, loss-rate, and repeat-usage data by product lane
  - - Kredivo personal loans and in-app cash products
    - Consumer borrower
    - Live
    - Extends the app beyond merchant checkout into general-purpose liquidity
    - Need realized yield, default, and acquisition economics by cash-loan cohort
  - - Infinite Card / open-loop card-like product
    - Consumer online spender
    - Live but public detail is narrower than the core app
    - Turns Kredivo credit line into a broader payment instrument through Mastercard acceptance
    - Need current adoption, active-card, and interchange / merchant-economics data
  - - Samsung Financing
    - Device buyer at Samsung channels
    - Live partner workflow
    - White-label / partner-specific financing surface with differentiated 2.35% monthly pricing
    - Need evidence on performance beyond Samsung and whether more OEM programs exist
  - - Krom savings and deposit products
    - Retail banking customer
    - Live and scaled
    - Adds primary banking, deposit gathering, and LPS-protected balances
    - Need user overlap and transfer-pricing relationship to the Kredivo app
  - - Krom payments and daily banking
    - Retail banking customer
    - Live
    - Transfers, QRIS, top-ups, bill pay, and statements create daily-use frequency
    - Need MAU/DAU, payment volume, and QRIS merchant-acceptance metrics
  - - Krom Flexi Loan / PayLater
    - Retail banking borrower
    - Live
    - Brings lending inside the bank app under OJK-supervised product language
    - Need current underwriting split versus Kredivo-originated credit
  - - GajiGesa earned wage access
    - Employer and salaried employee
    - Live and acquired
    - Adds payroll-linked liquidity and employer distribution
    - Need attach rate, employer retention, and monetization model
  - - 'Vietnam stack: Kredivo + Timo'
    - Vietnam consumer / banking user
    - Live / expanding
    - Combines BNPL rollout with local digital-banking infrastructure
    - Need current product breadth and regulatory posture in Vietnam post-acquisition
  notes: This matrix covers the most decision-relevant product modules visible from retained public sources rather than every UI feature or legal entity.
