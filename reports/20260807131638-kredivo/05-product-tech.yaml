  rows:
  - - Checkout without a credit card
    - Apply, connect digital accounts, get fast approval, then use 2-click checkout
    - Kredivo BNPL at 10,000+ merchants
    - 5-minute registration, approval in minutes, online and offline acceptance
    - No public conversion or approval-rate disclosure
  - - Emergency or planned liquidity
    - Borrow directly inside the app or via Krom Flexi Loan
    - Kredivo personal loans and Krom credit products
    - Multiple tenors and fast disbursement language across official sources
    - Public underwriting and loss detail is absent
  - - Device financing at OEM point of sale
    - Use Samsung Financing app or login with Kredivo credentials
