company:
  name: Kredivo
chapter:
  number: 5
  title: Product & Technology
  summary: Kredivo is no longer a single checkout-BNPL app. Public sources show a multi-module consumer-finance stack spanning installment credit, personal loans, open-loop card-like products, Samsung device financing, digital banking through Krom, employer-linked earned-wage access through GajiGesa, and banking/credit expansion in Vietnam through both the earlier Phoenix/VietCredit structure and the later Timo acquisition. The deepest technical signal is not open-source code or public APIs; it is the combination of alternative-data underwriting claims, real-time decisioning, open-loop merchant distribution, and explicit hiring for data science, event-driven microservices, mobile security, QA, and infrastructure roles. Trust disclosure is strongest on regulatory perimeter and bank reporting, but public documentation remains thin on formal security certifications, merchant integration docs, and model-performance metrics.
sections:
- id: product-stack-and-user-workflows
  title: From paylater app to multi-product consumer-finance stack
  body: 'Kredivo’s delivered product is broader than the BNPL label suggests. The current Android listing still shows the classic core: pay-in-one-month, longer-tenor installments up to 24 months, limits up to IDR 50 million, quick approval, and 2-click checkout across more than 10,000 merchants. But the same listing also shows direct in-app utility payments, top-ups, vouchers, and personal loans. Historical and current company releases add more layers. The 2023 Series D announcement described the platform as spanning online and offline BNPL, personal loans, and physical and virtual credit cards. The Infinite Card release made the credit line open-loop for Mastercard-accepting online merchants, while the Samsung Financing partnership showed Kredivo operating a branded financing workflow for a major OEM with differentiated pricing and no down payment. Krom then pushes the user workflow from credit into primary banking, deposits, payments, QRIS, and bank-originated lending. GajiGesa adds payroll-linked
    liquidity, and Vietnam adds cross-border versions of the stack. For product diligence, the important point is that Kredivo is best understood as a connected credit-and-banking workflow system, not just a checkout button.'
