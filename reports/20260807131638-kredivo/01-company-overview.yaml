company:
  name: Kredivo
chapter:
  number: 1
  title: Company Overview
  summary: Kredivo Group, formerly FinAccel, is a Singapore-parented Southeast Asian digital financial services platform whose
    core Indonesian franchise combines BNPL, cash loans, and digital banking via Krom Bank. Public evidence supports a long
    operating history from 2015-2016, major capital raises in 2019, 2021, and 2023, and material 2025-2026 expansion through
    new bank channeling facilities and the Timo acquisition in Vietnam. The strongest current disclosure still leaves notable
    gaps on consolidated revenue, GMV, headcount, and the exact size of the latest undisclosed capital injection, so scale
    judgments should lean on user, bank, and funding proxies rather than on fully audited group financials.
sections:
- id: identity-structure
  title: Identity, structure, and product scope
  body: 'Kredivo began as FinAccel, a Singapore-headquartered fintech formed in 2015 to serve underbanked Southeast Asian
    consumers with fast, affordable credit. The operating franchise launched in Indonesia in 2016, then broadened from checkout
    financing into personal loans, cards, and digital banking. The March 2023 Series D announcement formalized the parent
    rebrand to Kredivo Group and described a multi-brand platform spanning Kredivo, KrediFazz, and Krom, while the May 2026
    Timo acquisition extended that stack into Vietnam with a second digital-banking asset. The current footprint is therefore
    best understood as a regional consumer-finance group: Indonesia remains the core profit and distribution market, Vietnam
    is the key second geography for credit and banking expansion, and Thailand appears in official current-footprint language
    even though public operating detail there is still thin. For diligence purposes, the important structural point is that
    the consumer-credit app, the multi-finance activities, and the bank entity are complementary but not identical legal or
    regulatory surfaces.'
