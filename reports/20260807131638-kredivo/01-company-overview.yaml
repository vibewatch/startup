  evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current official headcount by country or by group business line.
    whyItMatters: Headcount is a core maturity metric and the public estimate from Dealroom is not equivalent to a company
      disclosure.
    diligencePath: Request a current employee census or management dashboard from Kredivo Group HR/finance.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: material
    topic: capital-2026
    missingEvidence: Exact amount, instrument, valuation, and close date for the fresh capital referenced in the Timo acquisition
      announcement.
    whyItMatters: Without the round mechanics, it is impossible to reconcile official ~US$500M raised-to-date language with
      higher third-party funding estimates or to assess dilution.
    diligencePath: Request the signed term sheet, cap-table update, or investor press release covering the 2025-2026 new-capital
      event.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: group-financials
    missingEvidence: Current consolidated group revenue, GMV, charge-off, and cash-flow data across Kredivo, KrediFazz, Krom,
      GajiGesa, and Timo.
    whyItMatters: The chapter can infer scale from users, bank assets, and funding, but it cannot judge group profitability
      quality without consolidated financials.
    diligencePath: Request audited group financial statements or a board pack with segment revenue, funding cost, and credit-loss
      metrics.
    relatedQuestionRefs: []
  - type: missing-source
    severity: minor
    topic: license-matrix
    missingEvidence: A clean public legal-entity and license map linking Kredivo, KrediFazz, PT Kredivo Finance Indonesia,
      PT FinAccel Teknologi Indonesia, and Krom Bank.
    whyItMatters: The operating narrative is clear, but diligence on regulatory perimeter and cash movement needs legal-entity
      precision.
    diligencePath: Request an entity chart with license numbers, supervising authority, and ownership percentages for each
      regulated vehicle.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TO002
