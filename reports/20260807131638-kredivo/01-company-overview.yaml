- id: scale-regulation-adverse-context
  title: Scale signals, banking traction, and adverse context
  body: 'The best current scale evidence comes from user, bank, and funding proxies rather than from a full consolidated P&L.
    The 2021 SPAC announcement cited nearly four million approved customers; by June 2025 Kompas reported more than 11 million
    users in Indonesia, hundreds of thousands of daily transactions, and more than four transactions per user per month. In
    January 2026 Kontan added that 53.6% of users came from tier-2 and tier-3 cities, reinforcing the company’s financial-inclusion
    narrative. Krom provides the cleanest hard numbers: official and media disclosures show more than one million accounts
    and Rp10 trillion of deposits by April 2026, while the investor-relations page shows 2025 net income of Rp143 billion,
    deposits of Rp8.398 trillion, and loans of Rp8.632 trillion. The balancing concern is regulation and credit quality. OJK’s
    December 2025 BNPL rulebook and July 2026 tightening on age, income, and repayment-cap standards show that BNPL is now
    firmly inside a prudential perimeter, while industry NPF rose to 3.44% in May 2026. Kredivo’s model has institutional
    bank support, but it is now being tested under stricter underwriting expectations.'
