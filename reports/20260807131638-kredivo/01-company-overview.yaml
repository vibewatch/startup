- id: leadership-governance
  title: Leadership, governance, and control points
  body: Kredivo still shows founder dependence. Akshay Garg remains Group CEO and co-founder at the parent level, while Umang
    Rustagi remains the key operating face in Indonesia as co-founder and president director. The public management roster
    also highlights Dennis Lerchl in finance, Valery Crottaz in capital formation and regional expansion, and Anton Hermawan
    running Krom Bank. Governance has expanded beyond the founding circle, but it remains closely tied to capital-markets
    and regulatory relationships. The June 2025 appointment of Andre Rasjid to the Indonesian commissioner board added venture
    and strategic-advisory experience, while Kompas reported that Darmin Nasution and former Bank Indonesia deputy governor
    Maulana Ibrahim sit on the broader Kredivo Group Indonesia supervisory structure. That is useful from a regulatory-navigation
    standpoint, but it also signals that continued scaling depends on a relatively compact set of senior leaders across credit,
    capital, collections, and bank execution. There is no public evidence of founder exit, yet the company still looks materially
    key-person dependent.
