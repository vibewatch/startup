company:
  name: General Intuition
chapter:
  number: 8
  title: Valuation
  summary: General Intuition has moved from a reported $2.3B Series A valuation in June 2026 to a reported $6.2B Series B valuation in September 2026, while public evidence still lacks verified revenue, customer concentration, cap-table, preference, and unit-economics detail. The evidence supports a research-more recommendation with strict entry discipline rather than a buy call.
sections:
  - id: recommendation
    title: Recommendation and valuation stance
    body: >-
      General Intuition's public financing record shows unusually rapid mark expansion: Axios reported a $320M Series A at a $2.3B post-money valuation on June 26, 2026, while a September 29 financing was reported by Pomegra at $220M and $6.2B. The latter is a reported financing datapoint, not a public audited valuation mark, and the source does not disclose revenue. The valuation case therefore rests on the scarcity and strategic value of Medal's action-labeled gameplay data, the founding team's spatial-temporal research credentials, and the possibility that game-trained models transfer into robotics, simulation, or autonomous systems. Against that, the available evidence does not establish paid customer scale, recurring revenue, margins, cash burn, liquidation preferences, or a comparable operating multiple. I recommend research-more, with a high risk rating and an expensive stance at the reported September price. A lower entry price, verified contracted revenue, or demonstrated transfer economics could move the call toward track or buy; a failed transfer milestone, down round, or weak customer conversion would reinforce avoid.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that General Intuition combines a hard-to-replicate data position with a research team that has already demonstrated world-model work, and that its financing syndicate has repeatedly backed the company. TechCrunch described Medal's platform as holding roughly 2 billion videos per year from 10 million monthly active users, with player inputs attached to clips, while the company is pursuing agents that reason over space and time. That is a credible strategic asset, but not yet a proven commercial moat. The anti-thesis is that action labels and gameplay diversity may not transfer cleanly to physical environments, and the latest step-up in valuation occurred without public revenue or named customer evidence. Pomegra explicitly frames the mark as a bet on scarce embodied-AI training data and says the company has disclosed no revenue. The key diligence question is whether customer pilots convert into repeatable, margin-positive contracts before the next financing.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable evidence
    body: >-
      A conventional revenue-multiple valuation cannot be applied responsibly because no retained source verifies current revenue, ARR, gross margin, or a customer count. The scenario table therefore uses valuation bands as decision thresholds, not forecasts or fair-value estimates. The bull case requires evidence that the $6.2B round reflects a durable financing market and that gameplay-trained models reduce customer data or deployment costs in robotics, simulation, or entertainment. The base case assumes the financing is genuine but the commercial model remains early and disclosure remains sparse; in that case, the reported price is stretched or expensive for an investor without private terms. The bear case assumes a domain-transfer shortfall, delayed API monetization, or multiple compression; the public record does not permit a probability estimate, so the signals are qualitative. Public-company yardsticks in the Silicon Valley Investor Club tear sheet are historical IPO reference points, not a peer set with comparable revenue, stage, or business model.
    claimRefs: [CV004, CV011, CV012, CV014]
    tableRefs: [TV003]
  - id: diligence-and-triggers
    title: Entry discipline and thesis-break triggers
    body: >-
      Before underwriting a new entry, obtain the signed financing documents, post-money capitalization, option-pool treatment, liquidation preferences, pro-rata rights, debt or compute commitments, and the exact closing date for the reported Series B. Verify revenue by customer and contract type, renewal and gross-margin data, compute cost per inference or training milestone, cash balance, burn, runway, and any concentration in Medal or a small number of partners. The public evidence also leaves open whether the broader API release occurred and whether early-access partners are paying customers rather than pilots. A thesis break would be a failed independent transfer test from gameplay to a physical or simulated task, a material down round, customer pilots that do not renew, or economics that require continued financing faster than commercial conversion. Conversely, independently verified paid deployments, repeatable gross-margin improvement, and disclosed terms that protect new investors would support a less defensive stance.
    claimRefs: [CV015, CV016]
    figureRefs: [FV001]
