    notes: "Arguments distinguish strategic potential from evidence of monetization; the latter remains incomplete in public sources."
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario thresholds
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Gameplay-trained models transfer to robotics or simulation and paid deployments scale.", "A reported $6.2B price could be defended only by substantial future growth; no target return is supportable now.", "Positive but unquantified; requires independent deployment evidence.", "Transfer tests fail or paid pilots do not renew."]
      - [Base, "The $6.2B financing is genuine, but revenue, margins, and terms remain private.", "Treat the price as expensive and require a material evidence or price reset before entry.", "Most consistent with the retained disclosure set.", "No verified revenue or contract conversion before the next financing."]
      - [Bear, "Domain transfer is weak, API monetization is delayed, or financing multiples compress.", "Downside is not numerically bounded by public evidence; avoid false precision.", "Material adverse possibility; probability unavailable.", "Down round, runway pressure, or customer concentration."]
      - [Entry gate, "Signed terms, verified revenue, customer renewals, and compute economics are obtained.", "Re-underwrite using a model-appropriate revenue or milestone method.", "Unresolved until private diligence closes gaps.", "Any material mismatch between financing narrative and records."]
    notes: "These are qualitative underwriting scenarios and entry thresholds, not forecasts or probability-weighted valuations; public evidence does not support numeric return targets."
    claimRefs: [CV004, CV011, CV012, CV014, CV015, CV016]
