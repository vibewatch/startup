  topStrengths:
    - Gameplay data and action-label access from the Medal ecosystem creates a differentiated training-data thesis.
    - Founding-team research credibility is supported by the DIAMOND world-model lineage.
    - Financing scale provides capacity to pursue compute-intensive frontier-model research.
  topRisks:
    - Simulation-to-real transfer and physical-world generalization remain unproven at commercial scale.
    - Public evidence does not verify revenue, recurring customer retention, or customer concentration.
    - >-
      The reported valuation step-up may be difficult to underwrite without disclosed unit economics or financing
      protections.
    - Compute intensity and dependence on large infrastructure commitments may pressure burn and margins.
  unresolvedGaps:
    - >-
      Signed Series B documents, cap table, liquidation preferences, option-pool treatment, and investor downside
      protections remain undisclosed.
    - Revenue, ARR, gross margin, burn, runway, and compute-cost trajectory remain unverified.
    - Named customers, contract structures, renewal rates, and production deployment outcomes remain unverified.
    - >-
      Training-data rights, privacy and copyright controls, and regulatory mapping by use case require private
      diligence.
    - Independent benchmarks for gameplay-to-robotics transfer and production reliability are not yet public.
