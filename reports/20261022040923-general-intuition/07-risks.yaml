schemaVersion: "report-v2"
artifact: risks
slug: general-intuition
runDate: 2026-10-22
company:
  name: General Intuition
chapter:
  number: 7
  title: Risks
  summary: >-
    General Intuition's highest residual risks are the unproven transfer from gameplay-trained
    models to physical deployments, a capital- and compute-intensive operating model, and
    commercial/API maturity that remains difficult to verify publicly. Legal, security,
    customer-concentration, and unit-economics evidence is too sparse for a clean underwriting
    conclusion, so the investment case requires explicit technical, contractual, and financial
    diligence gates.
sections:
  - id: ranked-risk-assessment
    title: Ranked residual-risk assessment
    body: >-
      The most consequential risk is technical transfer: independent coverage still describes
      the move from simulated gameplay to unpredictable physical settings as the central
      challenge, while public comparable benchmarks for the commercial models remain limited.
      The next tier combines commercialization and capital intensity. Public sources describe a
      gradual or selective API rollout, a large compute commitment, and heavy pre-training
      expenditure, but do not provide verified revenue, ARR, profitability, burn, or runway.
      The $320 million Series A provides financing capacity, not proof that model economics,
      product reliability, or customer demand are durable. The heatmap therefore scores
      residual exposure, not incident history, and treats absent public proof as a diligence
      gap rather than evidence that a risk has not occurred.
    claimRefs: [CR004, CR005, CR007, CR008, CR009, CR013, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-and-safety
    title: Regulatory, legal, and safety exposure
    body: >-
      The assigned evidence pool contains no regulator filing, court record, certification,
      trust center, data-processing agreement, incident report, or formal training-data rights
      analysis for General Intuition. TechCrunch reported that management was avoiding content
      generation use cases in part to reduce copyright issues, which is a useful design signal
      but not a legal clearance for using action-labeled gameplay clips or deploying models in
      robotics. APIs.io applies an AI-and-biometrics regulatory posture to the provider and
      reports no machine-readable API contract, but that third-party classification is not an
      official compliance assessment. Before investment, counsel should trace gameplay-data
      consent and license rights, model-output ownership, privacy obligations, and allocation of
      product and bodily-injury liability across each planned deployment.
    claimRefs: [CR001, CR002, CR014]
    tableRefs: [TR001]
  - id: operational-quality-and-security
    title: Operational, quality, and security risk
    body: >-
      Operational readiness is difficult to separate from research progress. A gameplay-derived
      model can demonstrate coherent behavior without establishing robustness under sensor
      noise, distribution shift, adversarial inputs, latency constraints, or safety-critical
      failure modes. Public material also leaves the commercial API's service levels,
      authentication controls, vulnerability process, data retention, evaluation suite, and
      incident response unverified. The concentration of spending on CoreWeave capacity and
      pre-training increases exposure to infrastructure availability, model-training setbacks,
      and unfavorable inference economics. Required diligence should include out-of-distribution
      tests, failure logs, red-team results, uptime history, disaster-recovery evidence, and
      cost-per-task curves from representative customer workloads.
    claimRefs: [CR005, CR007, CR008, CR011, CR013, CR014, CR016]
    tableRefs: [TR002]
  - id: dependencies-financial-and-kill-criteria
    title: Dependencies, financial-model risk, and thesis breaks
    body: >-
      The strategy depends on Medal for differentiated action-labeled data, external compute for
      frontier-scale training, and a modular market in which robotics and game developers buy an
      upstream model rather than build an integrated data-model-hardware loop. Sacra explicitly
      argues that vertical integration weakens the standalone model-layer position. Public
      funding data shows substantial capital raised, yet the available sources do not verify
      gross margin, burn, runway, contracted backlog, renewals, customer concentration, or
      financing terms; an estimated round dilution is not a cap-table fact. Thesis-break triggers
      should include failure to reproduce transfer gains on customer-owned hardware, continued
      absence of production API evidence, loss or material restriction of Medal data rights,
      sustained compute cost above customer willingness to pay, or financing terms that imply
      the operating plan cannot be funded on acceptable dilution.
    claimRefs: [CR001, CR003, CR004, CR008, CR009, CR010, CR011, CR012, CR015, CR016]
    tableRefs: [TR003]
tables:
