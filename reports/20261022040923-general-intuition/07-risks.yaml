    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Jurisdiction / surface
      - Public status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Gameplay-data copyright, license, and consent chain
        - US and every source-game territory
        - No primary rights analysis in assigned evidence
        - Medium
        - High
        - Partial; management avoids some content-generation uses
        - High
        - Review Medal terms, game-publisher licenses, creator consent, deletion rights, and counsel opinions.
      - - AI, privacy, and biometrics compliance for commercial API
        - Product-specific; potentially multi-jurisdictional
        - Third-party regime tag only; no regulator or trust-center evidence
        - Medium
        - High
        - Early / not publicly verified
        - High
        - Obtain jurisdiction map, DPIAs, DPA, subprocessors, retention policy, and regulator correspondence.
      - - Safety and product liability in robotics or autonomous systems
        - Deployment-specific
        - No certification, incident, or liability-allocation evidence in pool
        - Medium
        - Critical
        - Not publicly verified
        - High
        - Review validation protocol, insurance, indemnities, human override, safety case, and field incident log.
    notes: >-
      Partial public-evidence register as of 2026-10-22; likelihood and severity are analyst
      assessments, and "no evidence in pool" does not establish absence of an incident or control.
    enumerationScope:
      coverage: partial
      basis: >-
        Material legal and regulatory surfaces identifiable from the assigned prefetched evidence;
        no primary regulator, court, certification, or contractual materials were available.
    claimRefs: [CR001, CR002, CR005, CR007, CR014, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Evidence and unresolved gap
    rows:
      - - Gameplay-to-physical transfer fails under real-world variability
        - High
        - Critical
        - Early; public demonstrations do not establish production robustness
        - Critical
        - Independent sources identify transfer as open; require customer-hardware evaluation and failure distributions.
      - - Commercial model quality cannot be benchmarked against alternatives
        - High
        - High
        - Early; comparable scaled benchmarks are not public in the retained evidence
        - High
        - Require reproducible evaluation suite, baselines, ablations, and third-party test results.
      - - Compute availability or economics delay training and deployment
        - High
        - High
        - Partial; large financing and CoreWeave capacity support scale but not efficiency
        - High
        - Obtain committed capacity, failover, utilization, training budget, inference cost, and gross-margin bridge.
      - - API security, reliability, and support controls are immature
        - Medium
        - High
        - Early; rollout is described as gradual and no machine-readable contract was found
        - High
        - Obtain architecture review, pen test, SOC reports, SLA history, auth design, incident log, and support metrics.
    notes: >-
      Risk ratings synthesize public evidence and identified gaps; they are not reported incident
      frequencies and should be replaced with company telemetry during diligence.
    claimRefs: [CR005, CR007, CR008, CR011, CR013, CR014, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Proprietary action-labeled gameplay corpus
        - Medal / training-data supply
        - Structurally central; alternatives not evidenced
        - Rights narrow, data flow is interrupted, or corpus fails to transfer beyond games
        - Critical
        - Contractual rights, provenance controls, diversified licensed datasets, and transfer tests
        - High
      - - Frontier training and inference capacity
        - CoreWeave and other undisclosed infrastructure providers
        - Material allocation of Series A proceeds reported
        - Capacity, pricing, reliability, or model-training failure consumes runway without product proof
        - High
        - Multi-cloud plan, capacity commitments, checkpoints, cost gates, and contingency budget
        - High
      - - Modular buyer demand and follow-on capital
        - Early partners, robotics/game buyers, and investors
        - Customer and investor concentration not disclosed
        - Vertically integrated buyers internalize the model layer or pilots do not convert before more capital is needed
        - High
        - Contracted milestones, referenceable production wins, renewal proof, customer caps, and financing runway triggers
        - High
    notes: >-
      Concentration is qualitative because customer mix, supplier contracts, cap table, burn, and
      runway were not disclosed in the assigned evidence; funding raised is not cash available.
    claimRefs: [CR001, CR003, CR004, CR008, CR009, CR011, CR012, CR015]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative underwriting view of likelihood, impact, mitigation maturity, and residual
      severity based on the retained public evidence and explicit gaps.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Gameplay-to-physical transfer
          values: [High, Critical, Early, Critical]
        - label: Commercial API and customer proof
          values: [High, High, Early, High]
        - label: Compute and capital intensity
          values: [High, High, Partial, High]
        - label: Training-data rights and privacy
          values: [Medium, High, Partial, High]
        - label: Security and reliability controls
          values: [Medium, High, Early, High]
        - label: Vertical integration by buyers
          values: [Medium, High, Early, High]
    approximationNotes: >-
      Ordinal labels are analyst judgments, not measured probabilities; residual severity reflects
      missing public controls and should be recalibrated with private diligence evidence.
    claimRefs: [CR005, CR007, CR009, CR011, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Financing capacity does not resolve economic uncertainty
    body: >-
      The reported funding supports research scale, but public sources still do not verify revenue,
      ARR, profitability, gross margin, burn, or runway; underwriting should gate additional capital
      on production transfer, contracted demand, and cost-per-task evidence.
    claimRefs: [CR003, CR004, CR008, CR009, CR011]
