company:
  name: General Intuition
chapter:
  number: 3
  title: Competitors
  summary: General Intuition is positioned between frontier world-model research and embodied-AI application infrastructure, with a distinctive gameplay-data thesis but limited public proof of commercial scale. Its strongest differentiation is access to Medal-derived action-labeled video and a research team with DIAMOND credentials; its durability depends on transfer beyond games, customer traction, and whether larger labs can reproduce the data and talent advantages.
sections:
  - id: landscape
    title: Competitive landscape and categories
    body: General Intuition competes across several layers rather than against one uniform product. TechCrunch describes DeepMind and World Labs as world-model makers selling models for agent training and content creation, while General Intuition says world models are an enabling layer and emphasizes agents and applications. The same source places the company against deterministic game bots in gaming and against robotics or drone systems in physical settings. Latent Space describes World Labs, Yann LeCun's work, and other world-model efforts as part of a broader spatial-intelligence race. The practical landscape therefore includes direct world-model peers, embodied-AI model builders, multimodal video systems, game-engine and bot infrastructure, and status-quo internal behavior trees. Publicly fetched evidence does not establish that every named peer sells a directly comparable API, so the profiles below distinguish direct overlap from adjacency and mark unverified fields rather than filling them with estimates.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-distribution
    title: Capability, distribution, and trust comparison
    body: >-
      The most defensible capability distinction is the input-to-action loop. TechCrunch reports that General Intuition's agents use visual input and controller actions, can understand environments not seen in training, and are intended to transfer to robotic arms, drones, and autonomous vehicles. Latent Space describes a fully vision-based approach, action prediction, partial observability, and a frames-in/actions-out API for games, engines, and controller-based robots. This creates a potential advantage over content-oriented world-model products when the buyer needs control rather than video generation, but it also creates a harder proof burden: public commercial models have not yet been shown on a common benchmark, and the fetched sources do not provide comparable latency, accuracy, price, uptime, or customer-retention data. Distribution is similarly unresolved; General Intuition has early-access positioning and planned broader API availability, while incumbents and larger labs may have stronger channels, compute, and developer ecosystems.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability-and-switching
    title: Moat durability and switching costs
    body: General Intuition's moat case combines proprietary or preferential access to Medal's gameplay corpus, action labels attached to video, and the founders' world-model research credentials. TechCrunch reports that Medal had 2 billion videos per year from 10 million monthly active users across tens of thousands of games and says the company views the selection of positive and negative gameplay examples as useful training data. Latent Space characterizes the clips as episodic memory for simulation and describes a transfer path from games to realistic games, real-world video, and robotics. Those assets can raise switching costs for a model buyer that values a distinctive data pipeline, but they do not by themselves prove exclusive rights, sustained data quality, physical-world transfer, or customer lock-in. A buyer can also multi-home across model providers, use internal behavior trees, or commission task-specific robotics models. Pricing, contract length, integration cost, and partner exclusivity remain unreported in the assigned evidence.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: adverse-evidence-and-gaps
    title: Displacement risk and diligence gaps
    body: >-
      The adverse case is not that General Intuition lacks a technical thesis; it is that the thesis may remain difficult to monetize before competitors, incumbents, or internal teams close the same capability gap. TechCrunch says the startup is deliberately not trying to produce models that compete with game developers and frames gaming applications around replacing deterministic bots with agents whose difficulty can scale. That focus narrows the product claim but leaves questions about procurement, safety, deployment economics, and willingness to replace established tooling. The assigned sources also report rapidly changing valuation and financing narratives, but none supplies a neutral head-to-head benchmark, public customer contracts, realized pricing, renewal data, or a quantified transfer result from gameplay to physical robots. These gaps make the competitive conclusion conditional: data and research are credible differentiators, while durability and commercial displacement remain unresolved.
    claimRefs: [CP013, CP014, CP015, CP016]
    tableRefs: []
