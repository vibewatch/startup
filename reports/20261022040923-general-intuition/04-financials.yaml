      severity: material
      topic: pricing
      missingEvidence: Current rate cards, negotiated discounts, minimum commitments, contract duration, and support or implementation charges.
      whyItMatters: Without realized pricing and contractual units, revenue scalability and gross-margin sensitivity cannot be modeled.
      diligencePath: Review executed contracts and billing exports for every commercial partner and reconcile them to recognized revenue.
