schemaVersion: "report-v2"
artifact: financials
slug: general-intuition
runDate: 2026-10-22
company:
  name: General Intuition
chapter:
  number: 4
  title: Financials
  summary: >-
    General Intuition has early commercial evidence but not a financeable public
    operating history: two secondary sources report about $40 million of 2025
    early-access revenue, while another source says it could not verify public
    revenue, ARR, or profitability. The company has substantial disclosed funding,
    yet GPU-heavy model training, follow-on financing discussions, and absent cash,
    burn, margin, pricing, and retention data make capital adequacy and revenue
    quality the central underwriting blockers.
sections:
  - id: revenue-model-and-commercial-proof
    title: Revenue model and commercial proof
    body: >-
      The disclosed commercial model is B2B access to agents through selective
      early-access arrangements and a commercial API, rather than sale of the
      underlying world model itself. GamesBeat reported that initial partners in
      gaming, simulation, and robotics had been onboarded, while MLQ and Toflow
      attribute approximately $40 million of 2025 revenue to early-access
      arrangements. That figure is useful evidence of willingness to pay, but it
      is neither audited nor identified as ARR, and the retained sources do not
      disclose customer concentration, contract duration, recognition policy, or
      renewal performance. The investable interpretation is therefore early
      contracted demand, not proven repeatable software economics.
    claimRefs: [CI001, CI002, CI003, CI013, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-go-to-market
    title: Pricing and go-to-market
    body: >-
      Commercialization appears deliberately narrow. June 2026 reporting described
      a handful of early partners and a planned broader API release, but the
      allocated evidence contains no list price, usage rate, minimum commitment,
      discount schedule, revenue-share term, or realized price. The team was also
      described as roughly 25 people, indicating a founder- and research-led motion
      rather than a scaled sales organization. Until management provides pipeline
      conversion, sales-cycle, churn, expansion, and channel economics, CAC and
      payback cannot be estimated responsibly. The broader API plan is a
      distribution milestone, not evidence that self-serve or repeatable demand
      has materialized.
    claimRefs: [CI002, CI003, CI009, CI012]
    tableRefs: [TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Public evidence points to compute as the dominant near-term cost driver.
      CEO Pim de Witte said GPUs are expensive, and GamesBeat reported that the
      company expected to rent capacity under long commitments; Toflow separately
      described the financing as supporting compute scaling and model pre-training.
      This suggests a cost base with substantial committed infrastructure before
      broad product availability. It does not establish gross margin, because the
      sources do not separate training from inference, disclose utilization, or
      show whether customer pricing passes through compute. Revenue per customer,
      inference cost, support burden, gross margin, CAC, payback, and net retention
      all remain unavailable.
    claimRefs: [CI008, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The latest completed financing in the retained evidence is the $320 million
      round that closed in January 2026 and was announced in June at a $2.3 billion
      valuation, bringing disclosed funding to about $454 million. This is financing
      capacity, not cash available: none of the reviewed materials discloses cash
      on hand, burn, runway, debt, project-finance obligations, or remaining GPU
      commitments. GamesBeat also reported conversations about an additional
      Series B, reinforcing financing dependence as model progress accelerates.
      The adverse case is material: Santage argued that investors were pricing the
      technical thesis rather than revenue and highlighted the still-open
      sim-to-real gap. The financial verdict is promising revenue optionality,
      unproven revenue quality, unknown margins, and high capital intensity.
    claimRefs: [CI004, CI005, CI006, CI007, CI010, CI011, CI016]
