    approximationNotes: "Sequence reflects reported commercial mechanics; it does not estimate conversion rates, revenue mix, or margins."
    claimRefs: [CI001, CI002, CI008, CI015]
callouts:
  - calloutType: risk
    title: Capital raised is not runway
    body: >-
      The $454 million disclosed funding total does not reveal remaining cash,
      monthly burn, debt, GPU commitments, or the trigger and terms for another
      financing. Those items require direct financial diligence.
    claimRefs: [CI006, CI007, CI016]
  - calloutType: recommendation
    title: Underwrite only after a revenue and compute bridge
    body: >-
      Require customer-level revenue evidence and a training-versus-inference cost
      bridge before assigning recurring revenue quality or a scalable gross-margin
      profile.
    claimRefs: [CI001, CI012, CI013, CI014]
