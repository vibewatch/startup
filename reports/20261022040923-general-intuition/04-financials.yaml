      - Underwriting implication
    rows:
      - ["Early-access partnership", "Undisclosed", "Neither list nor realized price disclosed", "Revenue attributed to a handful of early arrangements", "Cannot separate recurring license, services, prepaid compute, or milestone revenue"]
      - ["Commercial API", "Undisclosed", "No public rate card or discount schedule in retained evidence", "Selective partner access reported", "Gross margin and usage elasticity cannot be modeled"]
      - ["Agent deployment", "Undisclosed", "Contract minimums and support charges unknown", "Positioned as the revenue driver", "Renewal, concentration, and implementation economics require customer-level diligence"]
    notes: "The allocated sources disclose commercialization channels but no public price points; absence is bounded to the retained source set."
    claimRefs: [CI002, CI003, CI012, CI015]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2025 revenue", "Approximately $40M from early-access arrangements", "Medium; two secondary reports, not audited", "Only public traction proxy and not equivalent to ARR", "Audited revenue bridge, cash collections, and recognition policy"]
      - ["ARR and retention", null, "Unavailable", "Determines recurring quality and expansion", "ARR by quarter, GRR, NRR, logo churn, and cohort expansion"]
      - ["Gross margin", null, "Unavailable", "Tests whether API pricing absorbs inference and support cost", "Training versus inference cost, utilization, support cost, and gross margin by product"]
      - ["CAC and payback", null, "Unavailable", "Tests whether the commercial motion can scale", "Fully loaded CAC, sales cycle, win rate, implementation cost, and payback"]
      - ["Compute commitments", "GPU rental and long-duration capacity described; amount undisclosed", "Medium; CEO statement and secondary reporting", "Creates fixed or committed cost before demand is proven", "Provider contracts, minimum spend, duration, utilization, and termination rights"]
      - ["Cash, burn, runway, and debt", null, "Unavailable", "Funding raised does not show present liquidity or financing headroom", "Bank statements, monthly burn, runway plan, debt schedule, GPU obligations, and next-round trigger"]
    notes: "Null means no supported public value in the eight retained sources; funding raised is shown separately and is not treated as cash available."
    claimRefs: [CI001, CI008, CI013, CI014, CI016]
