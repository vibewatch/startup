evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, ARR, gross margin, burn, runway, and customer-contract data.
    whyItMatters: The financing valuation cannot be assessed against operating economics without these denominators.
    diligencePath: Request management financials, cohort or contract schedules, current budget, and a cash-runway bridge.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board, cap table, voting rights, liquidation preferences, and investor-protection terms.
    whyItMatters: Headline funding and valuation do not reveal ownership concentration or downside economics.
    diligencePath: Obtain the latest capitalization table, charter, preferred-stock purchase agreement, and investor-rights summary.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: Primary incorporation and spinout records establishing the legal founding date.
    whyItMatters: >-
      The assigned profiles variously state 2014, 2015, and 2024, so the legal company age is not settled by public
      summaries.
    diligencePath: >-
      Review incorporation records and the Medal spinout documentation, while treating October 2025 only as the verified
      public-launch date.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: A primary leadership or corporate filing that verifies the full current executive and board roster.
    whyItMatters: >-
      Public coverage identifies founders and selected operators but cannot establish governance completeness or
      key-person depth.
    diligencePath: Request an organization chart, board roster, succession plan, and executive employment disclosures.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: investors
    missingEvidence: Primary financing announcement or closing documents resolving the Series A lead-investor attribution.
    whyItMatters: Conflicting lead attribution affects interpretation of governance influence and syndicate quality.
    diligencePath: Reconcile the investor list against the signed financing announcement, cap table, and lead-investor confirmation.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: milestones
    missingEvidence: >-
      Independent evidence of commercial deployment, customer renewal, and physical-world transfer beyond
      demonstrations.
    whyItMatters: The core investment thesis depends on scalable transfer and monetization, not only impressive demos.
    diligencePath: >-
      Request anonymized deployment metrics, customer references, API usage, renewal data, and sim-to-real evaluation
      results.
    relatedQuestionRefs:
      - QO006
      - QO007
      - QO008
  - type: missing-source
    severity: blocking
    topic: market-sizing
    missingEvidence: A source-backed bottom-up or top-down TAM/SAM/SOM with explicit geography, customer count, price, and time basis.
    whyItMatters: >-
      The public record supports category relevance and data supply but cannot translate those signals into addressable
      spend or market share.
    diligencePath: >-
      Obtain management's market model, customer segmentation, pricing assumptions, and an independent benchmark of
      comparable software budgets.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: Named customer contracts, payer identity, API pricing, usage, renewals, and pilot-to-production conversion.
    whyItMatters: Without buyer and payment evidence, the size and timing of the commercial market remain hypotheses.
    diligencePath: >-
      Request a customer cohort schedule, contract economics, pricing sheet, pipeline conversion, and reference calls
      under confidentiality.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: simulation-to-real
    missingEvidence: Independent, repeatable transfer benchmarks across multiple embodiments and messy operating conditions.
    whyItMatters: A single demonstration cannot show that the proposed software reduces deployment cost or risk at production scale.
    diligencePath: >-
      Request held-out benchmark results, failure rates, real-world data-hour savings, safety evaluation logs, and
      customer deployment outcomes.
    relatedQuestionRefs:
      - QM006
  - type: conflicting-data
    severity: minor
    topic: data-supply
    missingEvidence: A dated, primary or independently audited definition of Medal monthly active users and annual clip volume.
    whyItMatters: >-
      The 10 million and over-17-million user figures use different sources and may use different periods or
      definitions.
    diligencePath: >-
      Reconcile the denominator, measurement date, active-user definition, and whether video counts represent uploads,
      views, or retained training records.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable public or diligence-accessible prices, contract duration, implementation cost, and renewal data for
      General Intuition and the main alternatives.
    whyItMatters: >-
      Without realized pricing and retention, capability differentiation cannot be translated into buyer ROI, switching
      cost, or a defensible competitive position.
    diligencePath: >-
      Request redacted order forms, pricing tiers, API limits, gross retention, renewal cohorts, and implementation
      timelines from management and reference customers.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      Independent head-to-head evaluation of visual-to-action performance, novel-environment transfer, latency, safety,
      and physical-robot or drone outcomes.
    whyItMatters: >-
      The current evidence establishes a differentiated thesis but not superiority over world-model, embodied-AI, or
      internal-build alternatives.
    diligencePath: >-
      Commission or review a blinded evaluation using matched tasks, held-out environments, identical hardware budgets,
      and disclosed failure rates.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: >-
      Evidence of Medal data rights, action-label coverage, exclusivity, data refresh rate, and transfer performance
