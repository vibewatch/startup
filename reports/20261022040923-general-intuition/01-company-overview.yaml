  name: General Intuition
chapter:
  number: 1
  title: Company Overview
  summary: General Intuition is a New York-based private AI lab spun out of Medal and focused on action and world models trained with gameplay data. Public reporting supports a $320 million June 2026 Series A at a $2.3 billion valuation and $454 million of disclosed funding, while revenue, ownership, and customer economics remain largely undisclosed.
sections:
  - id: identity-and-model
    title: Identity, origin, and operating thesis
    body: General Intuition is described by multiple independent publications as a New York-based AI research lab spun out of Medal, the gameplay-clip platform co-founded by Pim de Witte. Its stated product direction is a commercial API in which frames are inputs and predicted next actions are outputs, rather than a consumer application catalog. Reporting says the company uses gameplay clips with embedded button-and-time action labels to train models for perception, prediction, and action across virtual and physical environments. The company says its world model is a training environment, while the intended product is the agentic model. Public profiles disagree on whether the company was founded in 2014, 2015, or 2024; October 2025 is supportable only as the public launch date. This creates a coherent identity and product thesis, but public evidence does not yet establish scaled customer revenue or repeatable simulation-to-real-world transfer.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder map
    body: The public leadership record centers on co-founder and CEO Pim de Witte and co-founders Eloi Alonso, Adam Jelley, and Vincent Micheli. Coverage links de Witte's Medal operating history to the company's proprietary-data strategy and identifies a chief product officer, Kent Rollins, in the operating team. The latest round was led by Khosla Ventures, with participation reported from General Catalyst, Jeff Bezos, Eric Schmidt, Nico Rosberg, and researchers at Google DeepMind and MIT; another account names General Catalyst as lead, so the lead attribution should be treated as conflicting until primary financing documents are available. The available evidence supports technical-founder fit and a concentrated stakeholder base, but not board composition, liquidation preferences, voting control, or key-person mitigation.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: financing-and-milestones
    title: Financing, scale, and milestone implications
    body: General Intuition publicly announced a $133.7 million or approximately $134 million seed round in October 2025 and a $320 million Series A in June 2026 at a reported $2.3 billion valuation. Those rounds imply $453.7 million to $454 million of disclosed funding, but neither revenue, ARR, profitability, burn, runway, nor customer contract value is verified in the assigned evidence. The latest financing is reported as funding compute capacity, pre-training the next model, and a broader API release, while the company has demonstrated a gameplay agent and a quadruped robot in press coverage. The central diligence question is whether gameplay-derived data produces reliable physical-world transfer at scale; the evidence explicitly leaves that question open.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
