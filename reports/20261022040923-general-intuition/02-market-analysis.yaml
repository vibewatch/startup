    title: Segment, buyer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Adoption trigger]
    rows:
      - [Robotics foundation-model teams, VP or head of autonomy, Research and controls engineers, Unknown, Pre-train and adapt action policies, Measured reduction in robot-data hours]
      - [Warehouse or industrial automation, Digital-twin or automation lead, Simulation and deployment engineers, Unknown, Test policy variants before site deployment, Lower commissioning or redeployment cost]
      - [Drone and vehicle autonomy, Autonomy program lead, Perception and planning teams, Unknown, Train and evaluate behavior in unfamiliar environments, Transfer benchmark under operational conditions]
