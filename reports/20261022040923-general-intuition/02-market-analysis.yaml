        - label: Observable gameplay data supply
          value: "Billions of clips/videos described"
          note: "Supply signal, not spend"
        - label: Action-labeled training signal
          value: "Inputs and timing embedded in clips"
          note: "Company/press-described capability"
        - label: Model and simulation workflow
          value: "World models, action models, API"
          note: "Product category"
        - label: Initial buyer segments
          value: "Gaming, simulation, robotics"
          note: "Publicly described early customer areas"
        - label: Paid adoption proof
          value: "Not publicly quantified"
          note: "Customer names, prices, and renewals unavailable"
        - label: TAM/SAM/SOM
          value: "Not publicly isolable"
          note: "Requires paid-deployment and budget evidence"
    approximationNotes: >-
      This is an evidence-constrained market-layer presentation, not a numeric
      TAM/SAM/SOM calculation. The layers are ordered from observable input supply
      to increasingly unverified commercial scope; no conversion rate or market
      share is inferred.
    claimRefs: [CM006, CM008, CM009, CM010, CM016]
