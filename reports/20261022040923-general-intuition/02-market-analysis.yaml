company:
  name: General Intuition
chapter:
  number: 2
  title: Market Analysis
  summary: General Intuition is positioned in an emerging market for foundation models and learned simulation that help agents act in dynamic virtual and physical environments. Public evidence supports a large data-and-compute opportunity and several plausible buyer segments, but does not yet support a defensible TAM, SAM, SOM, pricing, or repeatable customer-economics estimate.
sections:
  - id: market-boundary-and-buyer
    title: Market boundary and buyer logic
    body: >-
      The relevant market is not the entire robotics hardware market and not generic
      video generation. It is the software layer for action models, learned world
      models, simulation, and agent evaluation: systems that ingest visual state and
      control signals, predict consequences, or select actions before and during
      deployment. The adjacent spend includes robot foundation models, digital twins,
      simulation platforms, adaptive game agents, and autonomy testing. Excluded from
      this boundary are robot bodies, actuators, general cloud infrastructure, and
      passive video analytics unless they are purchased as part of an action-model
      workflow. Public sources describe a B2B API model and early customers across
      gaming, simulation, and robotics, which makes the immediate budget owner more
      likely to be a product, simulation, autonomy, or machine-learning engineering
      team than a consumer-gaming buyer. The buyer may be a robotics platform lead,
      game-studio AI lead, or simulation/evaluation owner; the user is the research
      or engineering team operating the model, and the payer remains unverified.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001, TM003]
  - id: sizing-lenses
    title: Sizing lenses and what remains unproven
    body: >-
      The public record supports multiple market lenses, but not a single additive
      market number. The data-supply lens is unusually concrete: reporting describes
      Medal as producing billions of gameplay videos or clips and as carrying
      action-labeled inputs, while other coverage cites 10 million or more than 17
      million monthly users. Those figures describe data supply, not revenue or
      addressable spend. The workflow lens is narrower and more commercially useful:
      model access, learned simulation, policy testing, adaptive agents, and
      pre-deployment evaluation. The company has described a broader API rollout and
      a small number of customers, but public sources do not disclose API prices,
      contract values, renewal rates, customer concentration, or downstream
      performance uplift. The robotics transfer lens is therefore an adoption
      hypothesis rather than a market-size proof: a quadruped demonstration and an
      eight-minute fine-tuning claim show technical direction, not repeatable
      production demand. A valuation and funding round indicate investor appetite,
      not TAM or revenue. The market should remain evidence-constrained until
      comparable paid deployments and benchmarked savings are public.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-drivers-and-constraints
    title: Adoption drivers, constraints, and diligence implications
    body: >-
      Adoption is pulled by the cost and scarcity of real-world robot data, the
      desire to test policies in safer digital environments, and the prospect of
      reusing one action-oriented model across embodiments. Action labels can give
      buyers information that passive video lacks, and a model provider can sit
      upstream of many robot, drone, simulation, and game workflows. The constraints
      are equally material. Games simplify physics and operating conditions; public
      coverage explicitly identifies transfer to real-world conditions as unresolved.
      Customers will need measurable transfer benchmarks, integration into existing
      simulators and deployment stacks, safety controls, audit logs, and clear data
      rights. Compute intensity can make gross margin and price-performance difficult
      to prove, while vertically integrated robotics companies may keep training data
      and model economics inside the hardware stack. The near-term adoption trigger
      is therefore a credible API or pilot that reduces data collection or evaluation
      cost for a named workflow. The key diligence asks are paid-customer count,
      buyer and payer identity, conversion from pilot to production, benchmarked
      reduction in real-world data, usage-based pricing, and the failure rate under
      messy physical conditions.
    claimRefs: [CM012, CM013, CM014, CM015, CM016]
    tableRefs: []
callouts:
  - calloutType: insight
    title: Market conclusion
    body: The opportunity is credible as a specialized action-model and learned-simulation infrastructure market, but public evidence supports a category thesis rather than a quantified TAM/SAM/SOM. The decisive commercial proof is repeatable paid adoption with measurable transfer or evaluation savings.
    claimRefs: [CM008, CM009, CM013, CM016]
