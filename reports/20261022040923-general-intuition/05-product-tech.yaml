    title: Product module / asset matrix
    columns: [Module or asset, User, Public status, Differentiation, Diligence gap]
    rows:
      - [Medal gameplay corpus, "Model researchers and engineers", "Existing data asset; scale described publicly", "Action-labeled first-person gameplay provides an action-to-outcome training signal", "Verify consent, licensing, retention, and rights chain by use case"]
      - [World model, "Game studios and robotics developers", "Public product concept; MIRA is the clearest demonstration", "Predicts environment evolution conditioned on actions", "Independent transfer benchmarks, long-horizon metrics, and failure taxonomy"]
      - [Action model, "Game and robotics developers", "Public product concept; early model feedback described", "Selects actions toward a goal in a simulated or real environment", "Latency, control stability, safety envelope, and production evaluation"]
      - [MIRA playable world model, "Game and AI researchers", "Demonstration with Kyutai and Epic Games", "Reported real-time multiplayer interaction without a conventional physics engine or 3D renderer", "Reproducible code, benchmark protocol, and persistence outside the demonstrated setting"]
    notes: "Rows summarize public descriptions from company-related recruiting material and independent coverage; status is not equivalent to production availability, and each diligence gap requires primary technical or contractual evidence."
    claimRefs: [CE001, CE006, CE007, CE008, CE009]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Game studio: adaptive NPC behavior", "Scripted or deterministic bots produce repeatable behavior", "Integrate models to create tunable bots and NPCs", "Potentially variable difficulty and more human-like responses", "Bots were described as not yet deployed in the interview"]
      - ["Game studio: QA and simulation", "Manual or scripted testing across game states", "Use action/world models in interactive simulation", "Potential broader scenario coverage", "No public coverage, defect-rate, or cost benchmark"]
      - ["Robotics developer: pretraining", "Collect substantial real-world demonstrations", "Pretrain in a learned simulator from environment data or task specification", "Potentially reduce real-world data collection", "Transfer depends on embodiment, forces, and environment coverage"]
      - ["Robotics developer: fine-tuning", "Fine-tune control policy on physical hardware", "Fine-tune an action model after simulation pretraining", "Sacra reports an eight-minute quadruped example", "Public source does not provide a repeatable protocol or baseline"]
    notes: "The workflow and benefit columns distinguish proposed or reported mechanisms from independently measured outcomes; the eight-minute example is a third-party report of a company demonstration, not a generalized performance guarantee."
    claimRefs: [CE002, CE003, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Data capture and transformation, "Convert gameplay frames and controls into action-conditioned training examples", "Medal recorder, user-generated clips, action-label pipeline", "Rights, privacy, label quality, and coverage of non-game environments"]
      - [World-model training, "Learn environment dynamics and possible outcomes after actions", "Large-scale compute and diverse action-conditioned video", "Long-horizon drift, multiplayer consistency, and inference cost"]
      - [Action-model training, "Select actions toward an objective", "World-model rollouts, task specifications, and control interface", "Control stability and transfer from games to physical systems"]
      - [Simulation and evaluation, "Test policies before physical deployment", "Learned simulator plus game or robotics environment data", "Simulator mismatch and incomplete safety cases"]
      - [API and deployment, "Expose models to game and robotics developers", "Serving infrastructure, access controls, observability, and customer integrations", "No public uptime, latency, security, or incident commitments"]
      - [Feedback flywheel, "Use deployments and Medal activity to improve coverage and models", "Ongoing user data and commercial partner feedback", "Data-rights boundaries and inability to verify customer production usage"]
    notes: "This is a disclosed operating model synthesized from source descriptions, not an audited architecture diagram. Dependencies and risks are diligence hypotheses where public technical documentation is absent."
    claimRefs: [CE005, CE006, CE010, CE012, CE013, CE014]
