company:
  name: General Intuition
chapter:
  number: 5
  title: Product & Technology
  summary: General Intuition combines a Medal-derived action-labeled gameplay corpus with world and action models intended to transfer from games into robotics and other embodied settings. Public evidence is strongest for the data representation, the MIRA demonstration, and early game-developer testing; production deployment, public API reliability, security controls, and commercial performance remain incompletely disclosed.
sections:
  - id: product-surface
    title: Product surface and user workflow
    body: >-
      General Intuition's public product concept has two linked components: a world model that predicts how an environment evolves after actions, and an action model that chooses the next action toward a goal. The immediate user workflow is not a consumer robot sale. For game developers, the proposed surface is adaptive non-player characters, QA bots, and interactive simulation; for robotics developers, the proposed workflow is to supply environment data or a task specification, pretrain or fine-tune inside a learned simulator, and then deploy to a physical system. This is a credible workflow description, but the public evidence still describes early-access or design-partner activity rather than a generally available, independently benchmarked production product. The company has also positioned world models as training infrastructure rather than as a game-content product, partly to avoid competing with game developers.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Data and model architecture
    body: >-
      The technical differentiator is the representation of gameplay as visual frames paired with action labels rather than raw keystrokes. In the Naavik interview, Pim de Witte says Medal converts controls to action labels in memory, preserving the action-to-outcome loop while avoiding capture of the literal key or controller input. TechCrunch separately reports that the corpus contains large volumes of gameplay clips and that the company views their first-person perspective and edge-case selection as useful for training. MIRA provides the clearest public system demonstration: a playable multiplayer world model trained on Rocket League gameplay that reportedly runs at 20 frames per second and reproduces several game dynamics without a conventional physics engine or 3D renderer. These facts support a specific architecture thesis, not a claim that the same performance transfers to physical environments.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    figureRefs: [FE001]
  - id: deployment-trust-and-gaps
    title: Deployment, differentiation, and diligence gaps
    body: >-
      General Intuition's moat case rests on the combination of Medal's distribution and data flywheel, the action-conditioned representation, and research progress from game environments toward physical systems. The company has publicly discussed game-developer feedback on models and an internal goal of a broadly available API, while the recruiting surface shows a small product team building desktop and mobile experiences with design-system and accessibility responsibilities. The principal implementation risks are practical: the Naavik discussion identifies multiplayer consistency, long-horizon coherence, and inference cost as unsolved limitations; it also says game bots were not yet deployed at the time of the interview. Public material does not establish API uptime, latency targets, access controls, incident history, model-evaluation protocols, data-rights documentation, or customer production outcomes. Those omissions should be treated as diligence blockers rather than filled with marketing claims.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: evidence-exhibits
    title: Evidence exhibits
    body: >-
      The exhibits separate what is publicly demonstrated from what remains a roadmap or diligence request. The module matrix emphasizes maturity and user context; the workflow table distinguishes a proposed operating path from measured customer benefit; and the architecture table records dependencies and technical risks. The stack figure is a compact map of the disclosed data-to-deployment path, not a claim that every layer is production-ready. Readers should treat the unverified controls and deployment fields as explicit diligence asks, not as implied capabilities.
    claimRefs: [CE003, CE006, CE010, CE012]
tables:
