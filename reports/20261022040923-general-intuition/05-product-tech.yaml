callouts:
  - calloutType: strength
    title: Data representation is more specific than generic video pretraining
    body: "The action-label pipeline links observed frames to the player's intended action, giving General Intuition a concrete causal-data thesis rather than relying on unconditioned video alone."
    claimRefs: [CE005, CE006]
  - calloutType: risk
    title: Transfer and production controls are not publicly proven
    body: "MIRA and early model feedback support technical progress, but public evidence does not establish production deployment, API reliability, safety controls, security posture, or physical-world generalization."
    claimRefs: [CE009, CE010, CE012, CE013, CE014]
