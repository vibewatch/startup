  - calloutType: insight
    title: Data scale is not customer traction
    body: "Medal usage and clip volume are meaningful inputs to the training-data thesis, but they are not substitutes for General Intuition account counts, paid conversion, retention, or expansion."
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Commercial proof remains thin
    body: "The public record describes a small number of partners and planned API expansion without naming customers or disclosing renewal and concentration metrics."
    claimRefs: [CU003, CU008, CU011, CU012]
