  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: "Customer-level renewal, churn, GRR, NRR, contract length, and cohort data for the commercial API."
      whyItMatters: "Without durability metrics, early-access relationships cannot be distinguished from repeatable recurring demand."
      diligencePath: "Request anonymized cohort tables, renewal schedules, gross and net retention definitions, and signed contract summaries under NDA."
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named-relationships
      missingEvidence: "A complete list of paying customers with production-versus-pilot status, use case, contract value band, and deployment date."
      whyItMatters: "Named collaborators and logos can overstate commercial adoption and obscure customer concentration."
      diligencePath: "Obtain a customer reference list, permissioned reference calls, and a deployment ledger separating research collaborations from paid accounts."
      relatedQuestionRefs: [QU005, QU006]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Revenue and usage concentration by customer, vertical, geography, and relationship to Medal."
      whyItMatters: "A small number of partners or an affiliated data relationship could make the growth thesis fragile."
      diligencePath: "Request the top-ten customer concentration schedule, vertical mix, Medal intercompany agreements, and committed-versus-consumption revenue split."
      relatedQuestionRefs: [QU008]
