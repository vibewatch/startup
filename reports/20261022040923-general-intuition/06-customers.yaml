company:
  name: General Intuition
chapter:
  number: 6
  title: Customers
  summary: General Intuition is positioning a commercial API for gaming, simulation, and robotics, but public evidence still describes early-access relationships rather than a disclosed customer base. The strongest adoption proof is usage and data scale associated with Medal, while named deployments, contract durability, retention, and revenue concentration remain unverified.
sections:
  - id: buyer-and-use-case-segments
    title: Buyer and use-case segments
    body: >-
      Public materials describe a B2B foundation-model platform whose prospective buyers are
      game studios, simulation providers, and robotics developers. Sacra describes a workflow
      in which a customer supplies an environment or robot task and uses the API to pretrain
      or fine-tune an action model, while gaming use cases include adaptive NPCs, QA bots,
      and interactive simulations. I-Scoop says the first API customers span gaming,
      simulation, and robotics, but does not name them or disclose contract values. This is
      materially different from proof of broad production adoption: the available evidence
      supports a multi-vertical target market and early partner activity, not a verified
      customer count or repeatable sales funnel. The buyer may be a model or simulation team,
      the end user may be a game player or robot operator, and the economic payer is not
      publicly identified.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-usage-evidence
    title: Adoption and usage evidence
    body: >-
      The clearest measurable usage signal is upstream: TechCrunch reported that Medal had
      10 million monthly active users and two billion videos per year in its 2025 coverage,
      while Sacra later described more than 17 million monthly active users and billions of
      clips per year. These figures describe the data-source platform, not General Intuition
      paying accounts, and the differing periods and denominators should not be merged into
      a customer-growth series. General Intuition's own model demonstrations, including a
      quadruped transfer using eight minutes of real-world fine-tuning data, demonstrate
      technical use rather than customer retention. The company has stated that a broader
      API release was planned for summer or early autumn 2026, so the transition from
      selected partners to a wider developer base was a key adoption milestone rather than
      an observed outcome in that coverage. By October, InvestGame reported a commercial API
      serving a small number of partners and a partner waitlist opened on September 29, which
      is evidence of a controlled commercial rollout but still not proof of broad adoption.
    claimRefs: [CU005, CU006, CU007, CU008, CU015]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, durability, and concentration
    body: >-
      Public reporting names technical collaborators and describes early API customers, but
      it does not provide a customer roster with production status, contract length, renewal
      dates, annual recurring revenue, gross retention, or net revenue retention. Sacra names
      Kyutai and Epic Games in connection with the MIRA research demonstration, and describes
      a commercial API for game studios and robotics developers; those are useful relationship
      signals but do not establish paid production deployments. The available sources also
      do not identify the largest customer, the share of revenue represented by any partner,
      or whether Medal-related data access is economically separate from customer revenue.
      Accordingly, the customer thesis rests on plausible use cases and a potentially deep
      data flywheel, while durability and concentration remain diligence questions.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
