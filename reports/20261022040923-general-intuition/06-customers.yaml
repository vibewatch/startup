          note: "Upstream platform scale is not customer revenue."
        - label: Model development
          touchpoints: ["World-model simulation", "Action-model pretraining and fine-tuning"]
          note: "Technical capability is publicly demonstrated; commercial conversion is not."
        - label: Evaluation
          touchpoints: ["Game, simulation, or robot task", "Success and safety metrics"]
          note: "Public sources do not disclose a standardized customer scorecard."
        - label: Early access
          touchpoints: ["Selected partners in gaming, simulation, and robotics", "Commercial API access"]
          note: "Partner names, pricing, and contract terms are largely undisclosed."
        - label: Production deployment
          touchpoints: ["Customer workflow integration", "Repeat usage and operational support"]
          note: "No public evidence verifies a broad production customer base."
        - label: Expansion
          touchpoints: ["Renewal or additional tasks", "More embodiments and real-world feedback"]
          note: "Retention, expansion, and concentration metrics remain diligence gaps."
    claimRefs: [CU001, CU002, CU014, CU015]
