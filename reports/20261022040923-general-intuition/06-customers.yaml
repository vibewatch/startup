    columns: [Metric, Value, Date or period, Source and confidence, Implication and missing denominator]
    rows:
      - [Medal monthly active users, "10 million", "2025 TechCrunch coverage", "TechCrunch; medium confidence for the reported period", "Upstream data reach, not General Intuition customer count"]
      - [Medal monthly active users, "over 17 million", "June 2026 Sacra coverage", "Sacra; medium confidence and later period", "Potentially broader data supply; definitions and measurement method are not disclosed"]
      - [Medal gameplay clips, "2 billion videos per year", "2025 TechCrunch coverage", "TechCrunch; medium confidence", "Scale of training-data source, not API adoption"]
      - [API availability, "Broader release planned for summer or early autumn 2026", "June-August 2026 reporting", "Awesome Agents and The Robot Report; company plan, not completed outcome", "A launch milestone is not evidence of conversion, retention, or revenue"]
      - [Commercial access, "Small number of partners; waitlist opened September 29", "October 4, 2026 reporting", "InvestGame; medium confidence", "Shows controlled rollout, but no account count, conversion rate, or broad-availability denominator"]
    notes: "The rows mix upstream platform usage with a planned product milestone; they are retained separately because units, populations, periods, and denominators are not comparable."
    claimRefs: [CU005, CU006, CU007, CU008, CU015]
  - id: TU003
    title: Named customer proof table
    columns: [Entity, Segment or role, Production versus pilot, Publicly described outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named collaborators and relationship signals in assigned 2025-2026 coverage; no complete customer registry or contract database is public."
    rows:
      - [Kyutai, Research collaborator, "Demonstration / research collaboration", "MIRA was built with Kyutai and described as a playable world-model system", "No paid deployment, renewal, or commercial contract is disclosed"]
      - [Epic Games, Research collaborator, "Demonstration / research collaboration", "MIRA was built with Kyutai and Epic Games using Rocket League gameplay", "The collaboration does not establish Epic as an API customer"]
      - [Medal, Data-source platform and affiliated relationship, "Ongoing data relationship described", "Gameplay clips and action labels are described as the training-data source", "Shared-founder and corporate relationship make independent customer validation unavailable"]
    notes: "These are named relationship signals, not a complete paid-customer enumeration; production status, contract structure, and retention are not public."
    claimRefs: [CU009, CU010, CU011, CU012]
