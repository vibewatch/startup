      - number: '4.2'
        title: Pricing and go-to-market
        blocks:
          - type: paragraph
            body: >-
              Commercialization appears deliberately narrow. June 2026 reporting described a handful of early partners
              and a planned broader API release, but the allocated evidence contains no list price, usage rate, minimum
              commitment, discount schedule, revenue-share term, or realized price. The team was also described as
              roughly 25 people, indicating a founder- and research-led motion rather than a scaled sales organization.
              Until management provides pipeline conversion, sales-cycle, churn, expansion, and channel economics, CAC
              and payback cannot be estimated responsibly. The broader API plan is a distribution milestone, not
              evidence that self-serve or repeatable demand has materialized.
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI012
              - CI015
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to compute as the dominant near-term cost driver. CEO Pim de Witte said GPUs are
              expensive, and GamesBeat reported that the company expected to rent capacity under long commitments;
              Toflow separately described the financing as supporting compute scaling and model pre-training. This
              suggests a cost base with substantial committed infrastructure before broad product availability. It does
              not establish gross margin, because the sources do not separate training from inference, disclose
              utilization, or show whether customer pricing passes through compute. Revenue per customer, inference
              cost, support burden, gross margin, CAC, payback, and net retention all remain unavailable.
            claimRefs:
              - CI008
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI008
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The latest completed financing in the retained evidence is the $320 million round that closed in January
              2026 and was announced in June at a $2.3 billion valuation, bringing disclosed funding to about $454
              million. This is financing capacity, not cash available: none of the reviewed materials discloses cash on
              hand, burn, runway, debt, project-finance obligations, or remaining GPU commitments. GamesBeat also
              reported conversations about an additional Series B, reinforcing financing dependence as model progress
              accelerates. The adverse case is material: Santage argued that investors were pricing the technical thesis
              rather than revenue and highlighted the still-open sim-to-real gap. The financial verdict is promising
              revenue optionality, unproven revenue quality, unknown margins, and high capital intensity.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI010
              - CI011
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not runway
            body: >-
              The $454 million disclosed funding total does not reveal remaining cash, monthly burn, debt, GPU
              commitments, or the trigger and terms for another financing. Those items require direct financial
              diligence.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI016
          - type: callout
            title: Underwrite only after a revenue and compute bridge
            body: >-
              Require customer-level revenue evidence and a training-versus-inference cost bridge before assigning
              recurring revenue quality or a scalable gross-margin profile.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              General Intuition's public product concept has two linked components: a world model that predicts how an
              environment evolves after actions, and an action model that chooses the next action toward a goal. The
              immediate user workflow is not a consumer robot sale. For game developers, the proposed surface is
              adaptive non-player characters, QA bots, and interactive simulation; for robotics developers, the proposed
              workflow is to supply environment data or a task specification, pretrain or fine-tune inside a learned
              simulator, and then deploy to a physical system. This is a credible workflow description, but the public
              evidence still describes early-access or design-partner activity rather than a generally available,
              independently benchmarked production product. The company has also positioned world models as training
              infrastructure rather than as a game-content product, partly to avoid competing with game developers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE010
              - CE011
      - number: '5.2'
        title: Data and model architecture
        blocks:
          - type: paragraph
            body: >-
              The technical differentiator is the representation of gameplay as visual frames paired with action labels
              rather than raw keystrokes. In the Naavik interview, Pim de Witte says Medal converts controls to action
              labels in memory, preserving the action-to-outcome loop while avoiding capture of the literal key or
              controller input. TechCrunch separately reports that the corpus contains large volumes of gameplay clips
              and that the company views their first-person perspective and edge-case selection as useful for training.
              MIRA provides the clearest public system demonstration: a playable multiplayer world model trained on
              Rocket League gameplay that reportedly runs at 20 frames per second and reproduces several game dynamics
              without a conventional physics engine or 3D renderer. These facts support a specific architecture thesis,
              not a claim that the same performance transfers to physical environments.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE012
      - number: '5.3'
        title: Deployment, differentiation, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              General Intuition's moat case rests on the combination of Medal's distribution and data flywheel, the
              action-conditioned representation, and research progress from game environments toward physical systems.
              The company has publicly discussed game-developer feedback on models and an internal goal of a broadly
              available API, while the recruiting surface shows a small product team building desktop and mobile
              experiences with design-system and accessibility responsibilities. The principal implementation risks are
              practical: the Naavik discussion identifies multiplayer consistency, long-horizon coherence, and inference
              cost as unsolved limitations; it also says game bots were not yet deployed at the time of the interview.
              Public material does not establish API uptime, latency targets, access controls, incident history,
              model-evaluation protocols, data-rights documentation, or customer production outcomes. Those omissions
              should be treated as diligence blockers rather than filled with marketing claims.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE010
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate what is publicly demonstrated from what remains a roadmap or diligence request. The
              module matrix emphasizes maturity and user context; the workflow table distinguishes a proposed operating
              path from measured customer benefit; and the architecture table records dependencies and technical risks.
              The stack figure is a compact map of the disclosed data-to-deployment path, not a claim that every layer
              is production-ready. Readers should treat the unverified controls and deployment fields as explicit
              diligence asks, not as implied capabilities.
            claimRefs:
              - CE003
              - CE006
              - CE010
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Data representation is more specific than generic video pretraining
            body: >-
              The action-label pipeline links observed frames to the player's intended action, giving General Intuition
              a concrete causal-data thesis rather than relying on unconditioned video alone.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: Transfer and production controls are not publicly proven
            body: >-
              MIRA and early model feedback support technical progress, but public evidence does not establish
              production deployment, API reliability, safety controls, security posture, or physical-world
              generalization.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and use-case segments
        blocks:
          - type: paragraph
            body: >-
              Public materials describe a B2B foundation-model platform whose prospective buyers are game studios,
              simulation providers, and robotics developers. Sacra describes a workflow in which a customer supplies an
              environment or robot task and uses the API to pretrain or fine-tune an action model, while gaming use
              cases include adaptive NPCs, QA bots, and interactive simulations. I-Scoop says the first API customers
              span gaming, simulation, and robotics, but does not name them or disclose contract values. This is
              materially different from proof of broad production adoption: the available evidence supports a
              multi-vertical target market and early partner activity, not a verified customer count or repeatable sales
              funnel. The buyer may be a model or simulation team, the end user may be a game player or robot operator,
              and the economic payer is not publicly identified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption and usage evidence
        blocks:
          - type: paragraph
            body: >-
              The clearest measurable usage signal is upstream: TechCrunch reported that Medal had 10 million monthly
              active users and two billion videos per year in its 2025 coverage, while Sacra later described more than
              17 million monthly active users and billions of clips per year. These figures describe the data-source
              platform, not General Intuition paying accounts, and the differing periods and denominators should not be
              merged into a customer-growth series. General Intuition's own model demonstrations, including a quadruped
              transfer using eight minutes of real-world fine-tuning data, demonstrate technical use rather than
              customer retention. The company has stated that a broader API release was planned for summer or early
              autumn 2026, so the transition from selected partners to a wider developer base was a key adoption
              milestone rather than an observed outcome in that coverage. By October, InvestGame reported a commercial
              API serving a small number of partners and a partner waitlist opened on September 29, which is evidence of
              a controlled commercial rollout but still not proof of broad adoption.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU015
      - number: '6.3'
        title: Named proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public reporting names technical collaborators and describes early API customers, but it does not provide
              a customer roster with production status, contract length, renewal dates, annual recurring revenue, gross
              retention, or net revenue retention. Sacra names Kyutai and Epic Games in connection with the MIRA
              research demonstration, and describes a commercial API for game studios and robotics developers; those are
              useful relationship signals but do not establish paid production deployments. The available sources also
              do not identify the largest customer, the share of revenue represented by any partner, or whether
              Medal-related data access is economically separate from customer revenue. Accordingly, the customer thesis
              rests on plausible use cases and a potentially deep data flywheel, while durability and concentration
              remain diligence questions.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Data scale is not customer traction
            body: >-
              Medal usage and clip volume are meaningful inputs to the training-data thesis, but they are not
              substitutes for General Intuition account counts, paid conversion, retention, or expansion.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Commercial proof remains thin
            body: >-
              The public record describes a small number of partners and planned API expansion without naming customers
              or disclosing renewal and concentration metrics.
            calloutType: risk
            claimRefs:
              - CU003
              - CU008
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk assessment
        blocks:
          - type: paragraph
            body: >-
              The most consequential risk is technical transfer: independent coverage still describes the move from
              simulated gameplay to unpredictable physical settings as the central challenge, while public comparable
              benchmarks for the commercial models remain limited. The next tier combines commercialization and capital
              intensity. Public sources describe a gradual or selective API rollout, a large compute commitment, and
              heavy pre-training expenditure, but do not provide verified revenue, ARR, profitability, burn, or runway.
              The $320 million Series A provides financing capacity, not proof that model economics, product
              reliability, or customer demand are durable. The heatmap therefore scores residual exposure, not incident
              history, and treats absent public proof as a diligence gap rather than evidence that a risk has not
              occurred.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence pool contains no regulator filing, court record, certification, trust center,
              data-processing agreement, incident report, or formal training-data rights analysis for General Intuition.
              TechCrunch reported that management was avoiding content generation use cases in part to reduce copyright
              issues, which is a useful design signal but not a legal clearance for using action-labeled gameplay clips
              or deploying models in robotics. APIs.io applies an AI-and-biometrics regulatory posture to the provider
              and reports no machine-readable API contract, but that third-party classification is not an official
              compliance assessment. Before investment, counsel should trace gameplay-data consent and license rights,
              model-output ownership, privacy obligations, and allocation of product and bodily-injury liability across
              each planned deployment.
            claimRefs:
              - CR001
              - CR002
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR014
              - CR016
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operational readiness is difficult to separate from research progress. A gameplay-derived model can
              demonstrate coherent behavior without establishing robustness under sensor noise, distribution shift,
              adversarial inputs, latency constraints, or safety-critical failure modes. Public material also leaves the
              commercial API's service levels, authentication controls, vulnerability process, data retention,
              evaluation suite, and incident response unverified. The concentration of spending on CoreWeave capacity
              and pre-training increases exposure to infrastructure availability, model-training setbacks, and
              unfavorable inference economics. Required diligence should include out-of-distribution tests, failure
              logs, red-team results, uptime history, disaster-recovery evidence, and cost-per-task curves from
              representative customer workloads.
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Dependencies, financial-model risk, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The strategy depends on Medal for differentiated action-labeled data, external compute for frontier-scale
              training, and a modular market in which robotics and game developers buy an upstream model rather than
              build an integrated data-model-hardware loop. Sacra explicitly argues that vertical integration weakens
              the standalone model-layer position. Public funding data shows substantial capital raised, yet the
              available sources do not verify gross margin, burn, runway, contracted backlog, renewals, customer
              concentration, or financing terms; an estimated round dilution is not a cap-table fact. Thesis-break
              triggers should include failure to reproduce transfer gains on customer-owned hardware, continued absence
              of production API evidence, loss or material restriction of Medal data rights, sustained compute cost
              above customer willingness to pay, or financing terms that imply the operating plan cannot be funded on
              acceptable dilution.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR009
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing capacity does not resolve economic uncertainty
            body: >-
              The reported funding supports research scale, but public sources still do not verify revenue, ARR,
              profitability, gross margin, burn, or runway; underwriting should gate additional capital on production
              transfer, contracted demand, and cost-per-task evidence.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              General Intuition's public financing record shows unusually rapid mark expansion: Axios reported a $320M
              Series A at a $2.3B post-money valuation on June 26, 2026, while a September 29 financing was reported by
              Pomegra at $220M and $6.2B. The latter is a reported financing datapoint, not a public audited valuation
              mark, and the source does not disclose revenue. The valuation case therefore rests on the scarcity and
              strategic value of Medal's action-labeled gameplay data, the founding team's spatial-temporal research
              credentials, and the possibility that game-trained models transfer into robotics, simulation, or
              autonomous systems. Against that, the available evidence does not establish paid customer scale, recurring
              revenue, margins, cash burn, liquidation preferences, or a comparable operating multiple. I recommend
              research-more, with a high risk rating and an expensive stance at the reported September price. A lower
              entry price, verified contracted revenue, or demonstrated transfer economics could move the call toward
              track or buy; a failed transfer milestone, down round, or weak customer conversion would reinforce avoid.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that General Intuition combines a hard-to-replicate data position with a research
              team that has already demonstrated world-model work, and that its financing syndicate has repeatedly
              backed the company. TechCrunch described Medal's platform as holding roughly 2 billion videos per year
              from 10 million monthly active users, with player inputs attached to clips, while the company is pursuing
              agents that reason over space and time. That is a credible strategic asset, but not yet a proven
              commercial moat. The anti-thesis is that action labels and gameplay diversity may not transfer cleanly to
              physical environments, and the latest step-up in valuation occurred without public revenue or named
              customer evidence. Pomegra explicitly frames the mark as a bet on scarce embodied-AI training data and
              says the company has disclosed no revenue. The key diligence question is whether customer pilots convert
              into repeatable, margin-positive contracts before the next financing.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple valuation cannot be applied responsibly because no retained source
              verifies current revenue, ARR, gross margin, or a customer count. The scenario table therefore uses
              valuation bands as decision thresholds, not forecasts or fair-value estimates. The bull case requires
              evidence that the $6.2B round reflects a durable financing market and that gameplay-trained models reduce
              customer data or deployment costs in robotics, simulation, or entertainment. The base case assumes the
              financing is genuine but the commercial model remains early and disclosure remains sparse; in that case,
              the reported price is stretched or expensive for an investor without private terms. The bear case assumes
              a domain-transfer shortfall, delayed API monetization, or multiple compression; the public record does not
              permit a probability estimate, so the signals are qualitative. Public-company yardsticks in the Silicon
              Valley Investor Club tear sheet are historical IPO reference points, not a peer set with comparable
              revenue, stage, or business model.
            claimRefs:
              - CV004
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Entry discipline and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Before underwriting a new entry, obtain the signed financing documents, post-money capitalization,
              option-pool treatment, liquidation preferences, pro-rata rights, debt or compute commitments, and the
              exact closing date for the reported Series B. Verify revenue by customer and contract type, renewal and
              gross-margin data, compute cost per inference or training milestone, cash balance, burn, runway, and any
              concentration in Medal or a small number of partners. The public evidence also leaves open whether the
              broader API release occurred and whether early-access partners are paying customers rather than pilots. A
              thesis break would be a failed independent transfer test from gameplay to a physical or simulated task, a
              material down round, customer pilots that do not renew, or economics that require continued financing
              faster than commercial conversion. Conversely, independently verified paid deployments, repeatable
              gross-margin improvement, and disclosed terms that protect new investors would support a less defensive
              stance.
            claimRefs:
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV015
              - CV016
