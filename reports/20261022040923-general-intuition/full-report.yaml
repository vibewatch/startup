  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer logic
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not the entire robotics hardware market and not generic video generation. It is the
              software layer for action models, learned world models, simulation, and agent evaluation: systems that
              ingest visual state and control signals, predict consequences, or select actions before and during
              deployment. The adjacent spend includes robot foundation models, digital twins, simulation platforms,
              adaptive game agents, and autonomy testing. Excluded from this boundary are robot bodies, actuators,
              general cloud infrastructure, and passive video analytics unless they are purchased as part of an
              action-model workflow. Public sources describe a B2B API model and early customers across gaming,
              simulation, and robotics, which makes the immediate budget owner more likely to be a product, simulation,
              autonomy, or machine-learning engineering team than a consumer-gaming buyer. The buyer may be a robotics
              platform lead, game-studio AI lead, or simulation/evaluation owner; the user is the research or
              engineering team operating the model, and the payer remains unverified.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.2'
        title: Sizing lenses and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The public record supports multiple market lenses, but not a single additive market number. The
              data-supply lens is unusually concrete: reporting describes Medal as producing billions of gameplay videos
              or clips and as carrying action-labeled inputs, while other coverage cites 10 million or more than 17
              million monthly users. Those figures describe data supply, not revenue or addressable spend. The workflow
              lens is narrower and more commercially useful: model access, learned simulation, policy testing, adaptive
              agents, and pre-deployment evaluation. The company has described a broader API rollout and a small number
              of customers, but public sources do not disclose API prices, contract values, renewal rates, customer
              concentration, or downstream performance uplift. The robotics transfer lens is therefore an adoption
              hypothesis rather than a market-size proof: a quadruped demonstration and an eight-minute fine-tuning
              claim show technical direction, not repeatable production demand. A valuation and funding round indicate
              investor appetite, not TAM or revenue. The market should remain evidence-constrained until comparable paid
              deployments and benchmarked savings are public.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.3'
        title: Adoption drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled by the cost and scarcity of real-world robot data, the desire to test policies in safer
              digital environments, and the prospect of reusing one action-oriented model across embodiments. Action
              labels can give buyers information that passive video lacks, and a model provider can sit upstream of many
              robot, drone, simulation, and game workflows. The constraints are equally material. Games simplify physics
              and operating conditions; public coverage explicitly identifies transfer to real-world conditions as
              unresolved. Customers will need measurable transfer benchmarks, integration into existing simulators and
              deployment stacks, safety controls, audit logs, and clear data rights. Compute intensity can make gross
              margin and price-performance difficult to prove, while vertically integrated robotics companies may keep
              training data and model economics inside the hardware stack. The near-term adoption trigger is therefore a
              credible API or pilot that reduces data collection or evaluation cost for a named workflow. The key
              diligence asks are paid-customer count, buyer and payer identity, conversion from pilot to production,
              benchmarked reduction in real-world data, usage-based pricing, and the failure rate under messy physical
              conditions.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market conclusion
            body: >-
              The opportunity is credible as a specialized action-model and learned-simulation infrastructure market,
              but public evidence supports a category thesis rather than a quantified TAM/SAM/SOM. The decisive
              commercial proof is repeatable paid adoption with measurable transfer or evaluation savings.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and categories
        blocks:
          - type: paragraph
            body: >-
              General Intuition competes across several layers rather than against one uniform product. TechCrunch
              describes DeepMind and World Labs as world-model makers selling models for agent training and content
              creation, while General Intuition says world models are an enabling layer and emphasizes agents and
              applications. The same source places the company against deterministic game bots in gaming and against
              robotics or drone systems in physical settings. Latent Space describes World Labs, Yann LeCun's work, and
              other world-model efforts as part of a broader spatial-intelligence race. The practical landscape
              therefore includes direct world-model peers, embodied-AI model builders, multimodal video systems,
              game-engine and bot infrastructure, and status-quo internal behavior trees. Publicly fetched evidence does
              not establish that every named peer sells a directly comparable API, so the profiles below distinguish
              direct overlap from adjacency and mark unverified fields rather than filling them with estimates.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP013
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The most defensible capability distinction is the input-to-action loop. TechCrunch reports that General
              Intuition's agents use visual input and controller actions, can understand environments not seen in
              training, and are intended to transfer to robotic arms, drones, and autonomous vehicles. Latent Space
              describes a fully vision-based approach, action prediction, partial observability, and a
              frames-in/actions-out API for games, engines, and controller-based robots. This creates a potential
              advantage over content-oriented world-model products when the buyer needs control rather than video
              generation, but it also creates a harder proof burden: public commercial models have not yet been shown on
              a common benchmark, and the fetched sources do not provide comparable latency, accuracy, price, uptime, or
              customer-retention data. Distribution is similarly unresolved; General Intuition has early-access
              positioning and planned broader API availability, while incumbents and larger labs may have stronger
              channels, compute, and developer ecosystems.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
      - number: '3.3'
        title: Moat durability and switching costs
        blocks:
          - type: paragraph
            body: >-
              General Intuition's moat case combines proprietary or preferential access to Medal's gameplay corpus,
              action labels attached to video, and the founders' world-model research credentials. TechCrunch reports
              that Medal had 2 billion videos per year from 10 million monthly active users across tens of thousands of
              games and says the company views the selection of positive and negative gameplay examples as useful
              training data. Latent Space characterizes the clips as episodic memory for simulation and describes a
              transfer path from games to realistic games, real-world video, and robotics. Those assets can raise
              switching costs for a model buyer that values a distinctive data pipeline, but they do not by themselves
              prove exclusive rights, sustained data quality, physical-world transfer, or customer lock-in. A buyer can
              also multi-home across model providers, use internal behavior trees, or commission task-specific robotics
              models. Pricing, contract length, integration cost, and partner exclusivity remain unreported in the
              assigned evidence.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Displacement risk and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that General Intuition lacks a technical thesis; it is that the thesis may remain
              difficult to monetize before competitors, incumbents, or internal teams close the same capability gap.
              TechCrunch says the startup is deliberately not trying to produce models that compete with game developers
              and frames gaming applications around replacing deterministic bots with agents whose difficulty can scale.
              That focus narrows the product claim but leaves questions about procurement, safety, deployment economics,
              and willingness to replace established tooling. The assigned sources also report rapidly changing
              valuation and financing narratives, but none supplies a neutral head-to-head benchmark, public customer
              contracts, realized pricing, renewal data, or a quantified transfer result from gameplay to physical
              robots. These gaps make the competitive conclusion conditional: data and research are credible
              differentiators, while durability and commercial displacement remain unresolved.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Data-plus-action thesis
            body: >-
              General Intuition combines a Medal-derived gameplay corpus with controller-action data and a stated
              frames-in/actions-out product direction; this is a more specific differentiation than generic video
              generation.
            calloutType: strength
            claimRefs:
              - CP005
              - CP009
              - CP010
          - type: callout
            title: Transfer and monetization remain unproven
            body: >-
              The assigned evidence does not provide a common benchmark, realized pricing, public customer contracts,
              renewal data, or quantified transfer from gameplay to physical systems.
            calloutType: risk
            claimRefs:
              - CP008
              - CP012
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial proof
        blocks:
          - type: paragraph
            body: >-
              The disclosed commercial model is B2B access to agents through selective early-access arrangements and a
              commercial API, rather than sale of the underlying world model itself. GamesBeat reported that initial
              partners in gaming, simulation, and robotics had been onboarded, while MLQ and Toflow attribute
              approximately $40 million of 2025 revenue to early-access arrangements. That figure is useful evidence of
              willingness to pay, but it is neither audited nor identified as ARR, and the retained sources do not
              disclose customer concentration, contract duration, recognition policy, or renewal performance. The
              investable interpretation is therefore early contracted demand, not proven repeatable software economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
