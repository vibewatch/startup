  - id: FE001
    title: Disclosed product architecture map
    type: stack
    summary: >-
      Action-labeled gameplay data is transformed into world and action models, tested in learned environments, and
      proposed for game or robotics deployment.
    data:
      layers:
        - label: Data foundation
          modules:
            - label: Medal gameplay clips
              detail: >-
                First-person game video paired with action labels; the company says labels are converted in memory
                rather than storing literal keys.
              unit: clips / action labels
        - label: Model layer
          modules:
            - label: World model
              detail: Predicts environment outcomes conditioned on actions.
            - label: Action model
              detail: Chooses actions toward a goal in simulated or real environments.
        - label: Evaluation layer
          modules:
            - label: Learned simulation
              detail: Supports interactive rollouts, policy testing, and fine-tuning.
            - label: MIRA demonstration
              detail: Reported 20 FPS multiplayer Rocket League world-model example.
        - label: Game deployment
          modules:
            - label: Game applications
              detail: Adaptive NPCs, QA bots, and interactive simulations are described use cases.
        - label: Robotics deployment
          modules:
            - label: Robotics applications
              detail: Task-specific pretraining and fine-tuning for physical systems are described use cases.
        - label: Serving and feedback
          modules:
            - label: Commercial API
              detail: Proposed access surface for game and robotics developers; general availability was an internal goal.
    approximationNotes: >-
      Layer order represents the disclosed operating path, not a measured dependency graph or evidence that every layer
      is production-ready.
