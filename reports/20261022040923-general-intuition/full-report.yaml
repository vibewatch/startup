              Jelley, and Vincent Micheli. Coverage links de Witte's Medal operating history to the company's
              proprietary-data strategy and identifies a chief product officer, Kent Rollins, in the operating team. The
              latest round was led by Khosla Ventures, with participation reported from General Catalyst, Jeff Bezos,
