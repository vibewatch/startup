chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and operating thesis
        blocks:
          - type: paragraph
            body: >-
              General Intuition is described by multiple independent publications as a New York-based AI research lab
              spun out of Medal, the gameplay-clip platform co-founded by Pim de Witte. Its stated product direction is
              a commercial API in which frames are inputs and predicted next actions are outputs, rather than a consumer
              application catalog. Reporting says the company uses gameplay clips with embedded button-and-time action
              labels to train models for perception, prediction, and action across virtual and physical environments.
              The company says its world model is a training environment, while the intended product is the agentic
              model. Public profiles disagree on whether the company was founded in 2014, 2015, or 2024; October 2025 is
              supportable only as the public launch date. This creates a coherent identity and product thesis, but
              public evidence does not yet establish scaled customer revenue or repeatable simulation-to-real-world
              transfer.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
