evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-and-operating-scale
    missingEvidence: >-
      Current recognized revenue, ARR, gross margin, working capital, cash balance, monthly burn, runway, customer
      count, and dated headcount.
    whyItMatters: >-
      The reported revenue-growth multiple and purchase orders do not reveal realized revenue, margins, liquidity, or
      the scale of the current operating base.
    diligencePath: >-
      Request audited financial statements, a monthly KPI bridge with metric definitions, dated payroll and customer
      schedules, bank statements, and a 12-18 month cash plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: funding-and-valuation-terms
    missingEvidence: >-
      The amount and terms of the 2025 financing, current cap table, latest price per share, liquidation preferences,
      anti-dilution provisions, and debt or project-finance obligations.
    whyItMatters: >-
      A historical Series B valuation cannot establish current enterprise value, dilution, security seniority, or
      capital available to the operating company.
    diligencePath: >-
      Review signed financing documents, a fully diluted cap table, current debt schedule, and the latest investor
      valuation materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Current executive roster, full board composition, director independence, committee assignments, related-party
      controls, and documented succession coverage.
    whyItMatters: >-
      Founder return and a reported family relationship on the board make decision rights and continuity important to
      assess without establishing misconduct.
    diligencePath: >-
      Request the current organization chart, board roster and minutes, committee charters, related-party policy, and
      CEO succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: order-conversion-and-customer-concentration
    missingEvidence: >-
      Named rail and defense customers, executed order terms, delivery schedules, acceptance records, repeat orders,
      cancellations, and customer concentration.
    whyItMatters: >-
      A company-reported purchase-order value and a prior supplier selection do not establish delivered systems,
      collected cash, or durable demand.
    diligencePath: >-
      Review redacted contracts, purchase orders, invoices, delivery and acceptance records, backlog aging, and customer
      references.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: factory-status-and-public-support
    missingEvidence: >-
      Current status of the Michigan factory and site, actual capex and production, grant disbursements, milestone
      compliance, clawback exposure, and any factory-exit obligations.
    whyItMatters: >-
      The 2022 plan and state support are historical commitments, while later material refers to a factory exit; the
      assigned evidence does not reconcile planned capacity with current operations.
    diligencePath: >-
      Obtain current site and equipment status, production records, state grant agreements and compliance reports, and
      any termination, sale, or repayment documents.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: legal-regulatory-status
    missingEvidence: >-
      Current primary-source records for material litigation, regulatory actions, sanctions, recalls, or other legal and
      regulatory matters.
    whyItMatters: >-
      The assigned evidence does not establish current legal or regulatory status; lack of a retained source is not
      evidence that no matter exists.
    diligencePath: >-
      Check applicable court and regulator records and obtain a current counsel letter and management disclosure
      schedule.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: one-addressable-market-and-buyers
    missingEvidence: >-
      A product-by-product serviceable market bridge for ONE, including qualified capacity, customer programs, awarded
      and repeat orders, realized price, and the buyer or payer budget owner.
    whyItMatters: >-
      Broad installation and EV deployment totals do not establish ONE's eligible product scope, obtainable share,
      revenue, or adoption timing.
    diligencePath: >-
      Obtain management's product-level TAM/SAM/SOM model, customer pipeline and contract schedule, qualification
      status, pricing, and buyer-funded budget documentation; reconcile it to independent deployment data.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: sizing-lens-comparability
    missingEvidence: >-
      Publicly auditable methodology linking deployment units and forecast vintages to battery-system spend, addressable
      chemistry/form factors, and ONE's attainable share.
    whyItMatters: >-
      U.S. storage installations, global EV battery deployment, and a commercial delivery-vehicle forecast have
      different geographies, units, periods, and market definitions.
    diligencePath: >-
      Request the underlying SEIA/BMI and SNE datasets and ONE's independently testable conversion assumptions; keep
      each market lens separate until units and scope reconcile.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-and-contract-economics
    missingEvidence: >-
      Comparable list prices, realized prices, discounts, warranty terms, and contract economics for ONE and named
      suppliers.
    whyItMatters: >-
      Without like-for-like prices and service obligations, public product descriptions and supplier installation shares
      cannot establish price competitiveness or buyer value.
    diligencePath: >-
      Request current supplier quotes and anonymized executed contracts for comparable cell, pack, and storage-system
      specifications, including volume, warranty, service, and delivery terms.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-in-house-alternatives
    missingEvidence: >-
      Customer procurement records, qualification timelines, switching costs, multi-homing behavior, and evidence of
      in-house build or status-quo alternatives.
