callouts:
  - calloutType: risk
    title: Historical valuation is not a current mark
    body: >-
      The reported $1.2 billion post-money valuation belongs to a historical
      Series B; the assigned sources do not disclose the later round's size or
      establish current valuation, cash, or runway.
    claimRefs: [CO006, CO007]
  - calloutType: insight
    title: Order announcements need conversion evidence
    body: >-
      A reported $35 million in purchase orders is a useful demand signal, but
      named customers, delivered systems, repeat orders, and cash collection
      remain unverified.
    claimRefs: [CO011]
