figures:
  - id: FM001
    title: Selected U.S. storage sizing lenses
    type: pyramid
    summary: U.S. storage installations and forecasts vary by segment, period, and stock-versus-flow basis; these layers do not represent a value-proportional market funnel or ONE capture.
    data:
      items:
        - label: "U.S. BESS installations, Q2 2026"
          value: 20.2
          unit: GWh
          detail: "Quarterly installations reported by SEIA/BMI."
          valueNote: "Quarterly flow; not installed capacity or supplier revenue."
          claimRefs: [CM005]
        - label: "Utility-scale installations, Q2 2026"
          value: 18
          unit: GWh
          detail: "Utility-scale segment of the Q2 2026 U.S. deployment."
          valueNote: "Quarterly flow; subset of the 20.2 GWh total."
          claimRefs: [CM007]
        - label: "Residential installations, Q2 2026"
          value: 657
          unit: MWh
          detail: "Residential behind-the-meter additions."
          valueNote: "Quarterly flow; segment unit is MWh."
          claimRefs: [CM007]
        - label: "C&I installations, Q2 2026"
          value: 1.8
          unit: GWh
          detail: "Commercial and industrial behind-the-meter additions."
          valueNote: "Quarterly flow; segment figure is reported separately."
          claimRefs: [CM007]
        - label: "Annual installations forecast by 2030"
          value: ">110"
          unit: GWh
          detail: "SEIA/BMI forecast for annual U.S. installations."
          valueNote: "Forecast; annual flow, not cumulative capacity."
          claimRefs: [CM008]
        - label: "Cumulative installations by 2030"
          value: 683
          unit: GWh
          detail: "SEIA/BMI cumulative U.S. installation forecast."
          valueNote: "Forecast stock; not comparable to annual installation flow."
          claimRefs: [CM008]
    approximationNotes: The authored order groups reported U.S. storage lenses and does not encode proportional magnitude, conversion, or market capture. The Q2 total includes its utility-scale and behind-the-meter segments; the two 2030 forecasts have different flow-versus-cumulative bases. Do not sum or compare these layers as a funnel.
    claimRefs: [CM005, CM007, CM008]
callouts:
  - calloutType: insight
    title: Deployment scale is not ONE's serviceable revenue
    body: U.S. storage forecasts and global EV deployment show sizeable demand pools, but the assigned evidence does not establish ONE's qualified share, buyer budgets, realized pricing, or recurring order conversion.
    claimRefs: [CM001, CM005, CM006, CM008, CM013]
