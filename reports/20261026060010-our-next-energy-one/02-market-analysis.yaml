    notes: Product scope is based on ONE product descriptions and a reported partner supply agreement. Buyer and payer roles not named in the sources are explicitly left unverified; exclusions define analytical scope, not a claim about market size.
    claimRefs: [CM009, CM010, CM011, CM012, CM015, CM016]
