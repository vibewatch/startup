company:
  name: Our Next Energy (ONE)
chapter:
  number: 2
  title: Market Analysis
  summary: Public evidence points to large but distinct battery demand pools in U.S. stationary storage and global electric vehicles, while ONE's products span cells, modules, battery management, and selected vehicle applications. The evidence does not isolate a company-specific SAM, paid demand, or budget owner; deployment forecasts should not be treated as ONE revenue opportunity.
sections:
  - id: market-boundary
    title: Market boundary follows the shipped product, not the broad battery headline
    body: >-
      The defensible starting point is the spend on battery cells, modules or packs,
      and related battery-management equipment that ONE can supply into stationary
      storage and selected mobility applications. ONE's reported 2025 product suite
      included LFP cells, Aries modules, and a grid battery-management system; its
      own industry page also describes LFP products for rail and defense. Those
      sources establish product categories, not current sales volumes or a customer
      count. The adjacent markets therefore need separate treatment: utility-scale
      and behind-the-meter storage, commercial vehicles, and rail/defense are not one
      interchangeable buyer pool. Passenger-EV battery deployment is a broader
      adjacency, but a reported prototype demonstration is not proof of current
      production adoption. Project EPC, electricity sales, and upstream mineral
      production are outside the evidenced product boundary.
    claimRefs: [CM009, CM010, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing evidence is substantial but not a ONE-specific TAM
    body: >-
      The strongest quantitative lenses are deployment flows rather than battery
      supplier revenue. SEIA and Benchmark Mineral Intelligence report U.S. BESS
      installations of 20.2 GWh in Q2 2026, with 18 GWh in utility-scale projects
      and separate residential and commercial-and-industrial additions. Their
      longer-term figures are forecasts: annual U.S. installations are projected
      to exceed 110 GWh by 2030, with cumulative installations of 683 GWh. For the
      global EV adjacency, IEA reports 1.2 TWh of battery deployment in 2025;
      CNEVPost, citing SNE Research, reports 1,187 GWh of EV battery usage for the
      same year. The labels and rounding differ, but both indicate a roughly 1.2 TWh
      market. These geography-, end-market-, and period-specific measures cannot be
      added together or converted into ONE's obtainable revenue without product
      eligibility, pricing, and share evidence.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyers and budget owners differ by deployment path
    body: >-
      Stationary storage divides further between utility-scale projects and
      behind-the-meter residential and C&I installations. SEIA/BMI's Q2 2026
      summary attributes much of C&I demand to data centers, but it does not name
      procurement owners, contract values, or ONE's role in those installations.
      In mobility, the Shyft/Blue Arc battery supply announcement gives a concrete
      commercial-vehicle route, while its delivery-segment growth figure is a
      partner-issued forecast rather than an independent battery-market estimate.
      Rail and defense are named product sectors on ONE's site, but the assigned
      evidence does not identify procurement programs or award budgets. Accordingly,
      buyer roles in the map are diligence hypotheses where stated, not verified
      ONE customers or confirmed spending authority.
    claimRefs: [CM007, CM009, CM010, CM015]
    tableRefs: [TM003]
  - id: adoption-drivers-and-constraints
    title: Domestic supply and deployment growth are balanced by ramp and proof risk
    body: >-
      Storage deployment and domestic-manufacturing policy create plausible demand
      tailwinds, but they do not remove execution risk. In 2025, ONE was reported
      as preparing for full-scale U.S. manufacturing by early 2027; an earlier 2023
      report described pilot production and a planned 20-GWh line, which is a dated
      plan rather than evidence of current output. IEA notes that reaching near
      nominal production can take more than five years for most facilities, making
      yield, utilization, equipment, and working-capital execution material to
      market capture. DOE's selected manufacturing projects and the cited partner
      vehicle forecast are not awards or demand commitments to ONE. Similarly,
      the 2023 Gemini range demonstration was followed by further refinement and
      validation work before commercialization. The available sources support
      demand hypotheses, not backlog conversion, repeat orders, or price realization.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
