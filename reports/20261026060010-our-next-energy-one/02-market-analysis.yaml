    rows:
      - [Utility-scale stationary storage, "LFP cells, modules/packs, and battery-management equipment where qualified", "Electricity sales, generation assets, EPC, and equipment not evidenced as ONE products", "Project developer, integrator, and payer are not identified in assigned evidence", "Largest quantified U.S. storage deployment lens; ONE-specific capture remains unknown"]
      - [Residential and C&I behind-the-meter storage, "Battery cells/modules and related management equipment in storage systems", "Solar generation, installation, financing, and electricity-bill savings", "SEIA/BMI reports installations and data-center demand, but not ONE buyers or budget owners", "Separate residential from C&I demand and contract pathways"]
      - [Rail and defense mobility, "Battery products for rail and defense applications named on ONE's industry page", "Vehicle manufacture and procurement spend beyond the battery supply scope", "Procurement authority, qualification cycles, and budgets are not disclosed", "Potential specialized segments; no public segment sizing or awards in this pool"]
      - [Commercial vehicles and fleets, "Battery packs supplied to commercial vehicle platforms", "Vehicle sale price, charging infrastructure, and fleet operating revenue", "A Shyft/Blue Arc supply announcement evidences one partner route; end-payer economics are not disclosed", "A concrete adjacent route, not proof of repeat orders or segment share"]
