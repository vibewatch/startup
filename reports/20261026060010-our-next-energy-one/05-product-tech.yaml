company:
  name: Our Next Energy (ONE)
chapter:
  number: 5
  title: Product & Technology
  summary: ONE's January 2026 company materials describe a pivot from passenger EVs toward rail, defense, and utility-scale storage, supported by retooled cell and pack facilities. Public evidence documents company-reported product specifications and demonstrations, but does not establish current throughput, named post-pivot deployments, or independently validated reliability.
sections:
  - id: portfolio-reset
    title: Portfolio reset and product maturity
    body: >-
      ONE's January 2026 announcement says it suspended passenger-EV investment and redirected its product and manufacturing footprint toward rail, defense, and utility-scale energy storage. The company announced $35 million in new purchase orders from rail and defense customers, but the release does not identify those customers, distinguish orders from deliveries, or disclose product-level volumes (CE016). Its current public product positioning emphasizes LFP cells and packs for grid storage, rail, and defense; this establishes the stated portfolio, not current revenue or installed base. Historical Gemini work remains useful evidence of battery engineering activity, but is not evidence that the old passenger-EV program is still a commercial priority.
      tables and the company's descriptions should therefore be read as a product map, not a comprehensive SKU list: the assigned material names no rail models, defense-specific SKUs, or current ESS system specifications. TechCrunch reported in March 2025 that Gemini had not been adopted by a major automaker. That historical limit is consistent with the subsequent announced EV pause, but does not establish the commercial maturity of the new rail and storage products.
    claimRefs: [CE001, CE002, CE012, CE016]
    tableRefs: [TE001]
  - id: manufacturing-architecture
    title: Manufacturing footprint and product architecture
    body: >-
      ONE says its Van Buren Township facility has completed retooling to produce an LFP cell, while its Novi facility has been retooled for three rail products and retains the ability to make grid-scale ESS modules. The January release reports that the rail products completed a 12-month demonstration across U.S. and Canadian locomotives; its homepage separately describes field deployments across North America. Neither source names the operators, test protocols, fleet sizes, or measured outcomes, so the demonstration is company-reported validation rather than independently reproducible performance evidence.
      The public architecture is best understood as two manufacturing layers—cell production in Van Buren and pack/system production in Novi—feeding rail, defense, and utility-storage use cases. ONE describes the OTP LFP cell as supporting 12-minute fast charging and prolonged exposure to deep-sea pressures, but no underlying qualification report is in the assigned evidence. Older sources describe the dual-chemistry Gemini design and the earlier Aries product family; those historical designs should not be conflated with the current post-pivot lineup.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: validation-and-trust
    title: Validation, trust, and diligence limits
    body: >-
      The company states that its Van Buren cell facility is ISO 9001 Quality certified and that the OTP cell is UN 38.3 Safety certified. These are meaningful quality and transport-safety signals if their scope is confirmed, but the assigned pages do not include the certificates, covered product models, issuing bodies, expiry dates, or independent test reports. ONE's claims about fast charging, pressure tolerance, rail durability, and the 12-month locomotive demonstration therefore remain company-reported rather than independently measured in this evidence set.
      Historical EV evidence is more specific but still bounded: InsideEVs reported that ONE attributed 608.1 miles under WLTP to a BMW iX test using Gemini, while TechCrunch later reported no major-automaker adoption of Gemini. A state release described a 2022 manufacturing-campus plan, including a five-year 20 GWh capacity target; that forecast is not evidence of current capacity or output. A separate release-sharing page described a planned Aries Grid factory at a West Virginia microgrid site. Current line-level throughput, delivered system counts, warranty performance, field failure rates, and named customer outcomes remain open diligence items. Battery Technology also reported an approximately 25% workforce reduction, or 128 people, in November 2023; that historical event signals prior execution pressure but cannot quantify current staffing or post-pivot engineering capacity (CE015).
    claimRefs: [CE008, CE009, CE010, CE011, CE013, CE014, CE015]
    tableRefs: [TE002]
