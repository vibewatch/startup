      - [Rail battery products, "Rail operators seeking fuel efficiency and durability", "Three Novi products announced; 12-month demonstration reported by ONE", "Company says demonstrations covered U.S. and Canadian locomotives", "Product names, operators, duty cycles, and measured results are not disclosed"]
      - [Grid-scale ESS modules, "Utility and defense infrastructure customers", "ONE says Novi retains manufacturing capability", "Current positioning includes grid storage and defense applications", "System ratings, delivery volume, project references, and operational data are absent"]
      - [Gemini dual-chemistry pack, "Historical passenger-EV demonstration", "BMW iX test reported in 2023; no longer the announced strategic focus", "InsideEVs reported 608.1 WLTP miles attributed to ONE; TechCrunch reported no major-automaker adoption", "No current production or post-pivot commercialization evidence"]
    notes: >-
      Product descriptions and status are based on the cited company announcements and historical reporting, not a complete catalog. Metrics and demonstrations are attributed to their sources; absent specifications or customer names are not inferred.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE012]
  - id: TE002
    title: Workflow and use-case evidence
    columns: [User job, Current workflow or need, ONE solution described in public sources, Measurable benefit disclosed, Limitation]
    rows:
      - [Rail operators, "Power locomotives while improving fuel efficiency and durability", "Three retooled Novi rail products", "ONE reports a successful 12-month locomotive demonstration", "No operator identities, baseline, test protocol, or quantified savings"]
      - [Defense and subsea users, "Provide energy storage for demanding operating environments", "OTP LFP cell and defense-sector battery products", "ONE claims 12-minute charging and prolonged deep-sea-pressure exposure", "No test report, qualification conditions, or customer deployment details"]
      - [Utilities and infrastructure buyers, "Store energy for utility or defense infrastructure", "Grid-scale ESS modules and a historical Aries Grid factory plan", "The assigned sources provide no current system-level performance metric", "No product ratings, delivery counts, field outcomes, or economics"]
    notes: >-
      The table summarizes use cases and claims in the assigned public evidence, not verified customer workflows or measured outcomes. Missing customer, operating, and performance data are diligence gaps rather than zero values.
    claimRefs: [CE005, CE006, CE007, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role described in sources, Dependency or evidence, Risk or unresolved question]
    rows:
      - [LFP cell, "Cell chemistry for current rail, defense, and storage products", "ONE identifies LFP cell production at Van Buren", "Cell design, chemistry formulation, yield, and independent performance data are not disclosed"]
      - [Pack manufacturing, "Assemble battery packs for rail and ESS applications", "ONE says Novi is retooled for rail products and retains ESS module capability", "Pack specifications, production throughput, and quality metrics are unavailable"]
      - [Historical Gemini controls, "Manage LFP and anode-free cells within one EV pack", "InsideEVs describes a proprietary DC-to-DC converter", "Historical passenger-EV architecture is not proof of current product roadmap or deployment"]
      - [Quality and transport safety, "Support manufacturing quality and cell transport safety", "ONE reports ISO 9001 facility certification and UN 38.3 cell certification", "Certificates, product scope, test results, and ongoing audit status are not included"]
      - [Historical workforce context, "Engineering and manufacturing capacity are required to industrialize cell and pack products", "Battery Technology reported a 25% workforce reduction totaling 128 people in November 2023", "Current staffing, retained expertise, and effects on post-pivot product programs are not established"]
    notes: >-
      Architecture details combine current company statements with explicitly historical third-party descriptions. The 2022 campus plan and earlier EV designs must not be read as current capacity, current SKU specifications, or validated post-pivot performance.
    claimRefs: [CE003, CE004, CE008, CE009, CE010, CE011, CE013, CE015]
