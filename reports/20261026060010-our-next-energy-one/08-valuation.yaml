company:
  name: Our Next Energy (ONE)
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a technically credible battery platform and a historical financing benchmark, but it does not establish ONE's current equity value, financing terms, operating economics, or conversion of post-pivot activity into revenue. The appropriate stance is research-more, with high risk and low confidence in any price-based conclusion.
sections:
  - id: decision
    title: Recommendation and evidence boundary
    body: >-
      Recommend research-more rather than buy or assign a target price. ONE's own
      materials describe battery products for rail and defense and a Gemini
      demonstration; InsideEVs separately reported 608.1 miles under WLTP for a
      BMW iX test vehicle. These are evidence of technical work, not evidence of
      repeatable sales, recognized revenue, margin, or customer economics
      (CV002, CV003). The company website also describes a current product and
      manufacturing direction, but does not provide transaction terms or
      company-level operating metrics in the retained material (CV001, CV002).
      The strongest public financing reference is a historical Series B mark;
      a later funding round's amount and terms were not disclosed in the
      contemporaneous coverage (CV005, CV006). The evidence therefore supports
      a thesis worth diligencing, not a price-supported investment decision.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: entry-price
    title: Entry price and public comparables
    body: >-
      Do not treat the reported $1.2 billion post-money Series B valuation as a
      current mark: it is historical, predates the later undisclosed funding
      round, and is not accompanied here by a current share price, capitalization
      table, preference stack, or dilution terms (CV005, CV006). The reported
      Michigan factory investment and historical funding stress make capital
      needs and financing structure material diligence items, but neither is a
      present cash balance or burn-rate measure (CV007, CV008, CV009). Public
      battery and storage companies provide context only. The available
      snapshots cover unlike business mixes, periods, and profitability
      conditions; they are not independent private-company valuation
      benchmarks and should not be used to derive a ONE multiple (CV010-CV012).
      Without ONE's own revenue, gross margin, backlog conversion, capital
      requirements, and current terms, a numerical enterprise or equity value
      would create false precision.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
    tableRefs:
      - TV002
  - id: scenarios
    title: Scenario logic and diligence gates
    body: >-
      The cases below are conditional operating narratives, not probability-
      weighted valuations. A bull case requires validation that technical
      performance can become qualified, repeat orders at attractive economics;
      the public record reviewed here does not establish those outcomes
      (CV003, CV004). The base case is continued diligence without a price
      conclusion until current financing terms and audited or otherwise
      verifiable unit economics are available. The bear case is that
      commercialization or funding needs outrun available capital, a concern
      consistent with historical reports of a failed prospective investment,
      layoffs, and a capital-intensive factory plan, but not proof of current
      distress (CV007-CV009). Move toward an investable price only after
      validating signed orders and delivery conversion, customer concentration,
      product-line gross margins, cash and debt obligations, and the full
      preference and dilution stack. Revisit the thesis if orders fail to
      convert, production milestones slip, or new capital is raised on materially
      dilutive terms.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
    tableRefs:
      - TV003
  - id: open-diligence
    title: Unresolved return and exit inputs
    body: >-
      The retained sources do not supply enough company-specific inputs to
      calculate a defensible bull, base, or bear equity value or investor return.
      In particular, there is no current disclosed transaction price, security
      class, fully diluted share count, preference waterfall, revenue by product,
      gross margin, working-capital profile, or cash runway in this evidence set.
      These are evidence gaps, not proof that the company has no such data. The
      historical Gemini demonstration and Series B mark should not be converted
      into current exit readiness or a return multiple. Obtain the data room,
      customer-level order and delivery schedules, audited financials, and
      financing documents before revisiting valuation; require milestone and
      downside protections if those inputs remain unavailable.
    claimRefs:
      - CV003
      - CV006
      - CV013
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision item
      - Assessment
      - Evidence and implication
    rows:
      - - Recommendation
        - Research-more
        - Technical proof exists, but current price and operating economics are not established.
      - - Confidence
        - Low
        - The evidence does not resolve current terms, margins, conversion, or capitalization.
      - - Risk rating
        - High
        - Commercialization, financing, and dilution risks remain material.
      - - Valuation stance
        - Not presently priceable
        - The historical Series B mark is not a current transaction benchmark.
      - - Decision implication
        - Defer entry decision
        - Reassess after verified financial, customer, and security-level diligence.
    notes: >-
      Qualitative assessment based on the cited public evidence; no target return
      or valuation range is supportable from the available company-specific inputs.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - Counter-evidence or unresolved issue
      - What would change the view
    rows:
      - - Technical differentiation
        - ONE and InsideEVs report a 608.1-mile Gemini demonstration.
        - A demonstration does not establish cost, durability, qualification, or volume economics.
        - Independent validation, production yield, warranty data, and customer acceptance.
      - - Commercialization
        - ONE describes LFP applications for rail and defense.
        - The retained sources do not establish current recurring deliveries or margin.
        - Signed orders reconciled to shipments, collections, and repeat orders.
      - - Financing and price
        - Historical Series B was reported at $1.2 billion post-money; a later round was announced.
        - The later round's size and terms were undisclosed, and the old mark may not reflect current value.
        - Current financing documents, cap table, liquidation preferences, and fully diluted share count.
      - - Capital intensity
        - Coverage described a $1.6 billion factory plan and historical financing pressure.
        - Past plans and funding reports do not establish current cash, burn, debt, or obligations.
        - Audited statements, project-finance terms, cash forecast, and capital plan.
    notes: >-
      Historical reports are dated context, not evidence of current financial
      condition. Company descriptions remain company claims unless independently verified.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: Conditional bull, base, and bear cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger or diligence gate
    rows:
      - - Bull
        - Qualified products convert into repeat orders with validated manufacturing yield and attractive product-level margins.
        - No defensible range; missing current revenue, margins, cap table, and entry price prevent calculation.
        - Unquantified; conditional upside only.
        - Failure to validate deliveries, warranty performance, or customer economics.
      - - Base
        - Technical progress continues, but conversion and financing economics remain unverified.
        - No defensible range or target return until current terms and operating metrics are obtained.
        - Research-more is the evidence-supported decision, not a probability estimate.
        - No documented order-to-delivery conversion, margin, cash runway, or security terms.
      - - Bear
        - Commercialization is delayed or capital needs require materially dilutive financing.
        - Downside cannot be quantified without the current capital structure and obligations.
        - Material risk signal; probability not estimable from this source set.
        - Missed production or customer milestones, short runway, or adverse preference terms.
    notes: >-
      No numeric valuation ranges or scenario probabilities are invented. Cases
      state conditional assumptions; missing private financial and transaction
      inputs prevent a defensible return calculation.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
