  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financing-terms
      missingEvidence: Current price per share, security class, fully diluted capitalization, liquidation preferences, anti-dilution rights, and the amount and terms of the latest financing.
      whyItMatters: Without the actual entry price and seniority waterfall, equity value and investor returns cannot be estimated from the historical Series B mark.
      diligencePath: Obtain the latest financing documents, cap table, charter, investor rights agreements, and a fully diluted ownership schedule from the company.
      relatedQuestionRefs:
        - QV001
        - QV002
        - QV010
    - type: private-evidence-only
      severity: blocking
      topic: operating-economics
      missingEvidence: Revenue, backlog conversion, product-line ASP and gross margin, warranty exposure, working-capital needs, current cash, burn, debt, and the next 12-18 month capital plan.
      whyItMatters: These are required to select a valuation method, model dilution and downside, and distinguish technical promise from an investable business.
      diligencePath: Review audited statements, monthly financials, customer-level orders and deliveries, warranty data, debt and project-finance schedules, and management's cash forecast.
      relatedQuestionRefs:
        - QV006
        - QV008
        - QV010
      relatedTableRefs:
        - TV003
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: Current, customer-verified orders, deliveries, repeat purchases, and customer concentration after the strategic pivot.
      whyItMatters: Historical demonstrations and product descriptions do not show current conversion, revenue quality, or repeat demand.
      diligencePath: Reconcile signed contracts to shipments, acceptance, collections, cancellations, and repeat orders with customer references.
      relatedQuestionRefs:
        - QV004
        - QV009
      relatedTableRefs:
        - TV002
