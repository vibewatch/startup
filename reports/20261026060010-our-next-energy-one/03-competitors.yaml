company:
  name: Our Next Energy (ONE)
chapter:
  number: 3
  title: Competitors
  summary: >-
    Public evidence positions ONE around LFP cells and battery systems for vehicles, grid, rail, and defense, but does not establish comparable current output, pricing, or adoption. Scale is the clearest visible competitive gap: CNEVPost's 2025 EV-battery table reports CATL and BYD at 55.6% combined share, while the available sources do not identify ONE in that supplier table or quantify its post-pivot deployments.
sections:
  - id: landscape-and-scale
    title: Competitive landscape and observable scale
    body: >-
      The available record spans two different competitive arenas that should not be collapsed into one market. CNEVPost's table, citing SNE Research, measures global EV-battery installations in 2025; it shows CATL and BYD at 55.6% combined share and lists other large suppliers, but it does not report a comparable figure for ONE (CP005, CP006). That is evidence of formidable EV-cell incumbents, not a measurement of ONE's share in grid, rail, or defense systems. The IEA describes a separate stationary-storage context in which LFP accounts for around 90% of 2025 deployments and utility-scale projects represented around 80% of new capacity (CP008, CP009). Those category trends make LFP relevant to ONE's stated pivot, but they do not establish customer wins or supplier rankings for ONE.

      ONE's public materials describe a domestic LFP pilot-cell program and LFP products for rail and defense, while Battery-Tech Network's profile also places its activity across EV and grid applications (CP001, CP003, CP004). The 20 GWh ONE Circle figure is a 2023 company-announced plan, not evidence of current utilization or delivered volume (CP002). The profile table therefore separates named EV leaders from market-level manufacturing and storage alternatives; the scale figure reproduces the cited EV table rather than implying a complete census of ONE's new segments.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP006
      - CP008
      - CP009
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-and-buyer-fit
    title: Product differentiation and buyer fit
    body: >-
      ONE's defensible product story in the assigned evidence is its claimed LFP focus and system design, not a proven cost or performance advantage against named suppliers. The company says its rail- and defense-sector products use LFP; the IEA describes LFP as typically cheaper and better suited to frequent cycling than higher-energy-density EV chemistries (CP003, CP008). That supports a potential fit with stationary or duty-cycle-heavy applications, but it is not a third-party test of ONE's safety, cycle life, total system cost, or qualification status. A BMW iX demonstration gives a concrete technical proof point: InsideEVs reported 608.1 miles under WLTP, explicitly attributing the result to ONE, while TechCrunch later reported that Gemini had not been adopted by a major automaker (CP013, CP015). A demonstration and an attributable performance claim are not equivalent to serial production, validated fleet economics, or repeat orders.

      Against CATL, BYD, and other EV suppliers, the source set provides installation scale but no like-for-like chemistry, warranty, system-integration, or safety comparison. For grid, rail, and defense buyers, it likewise does not establish procurement specifications, distribution reach, service coverage, or competitor qualification. The matrix marks such cells unknown rather than assuming that a product description proves superiority. These gaps leave switching costs, multi-homing, and the buyer's build-versus-buy choice unresolved.
    claimRefs:
      - CP003
      - CP008
      - CP013
      - CP015
    tableRefs:
      - TP002
  - id: pricing-and-commercialization
    title: Pricing, commercialization, and routes to market
    body: >-
      No source in the assigned pool supplies a comparable list price, realized cell or pack price, contract duration, discount, warranty cost, or gross-margin figure for ONE and the named suppliers. The pricing exhibit records that boundary explicitly: "unknown" means the reviewed sources do not state the term, not that the term is zero or necessarily unavailable in private diligence. The 2025 funding coverage also says the round's size was not disclosed at publication, so capital raised cannot be used as a proxy for cash available to fund commercialization (CP014). The 2023 pilot-production announcement and the 2023 BMW test are milestones, not evidence that ONE converted the products into sustained customer deliveries (CP001, CP013).

      Commercialization is especially important because the company's product mix has shifted toward rail, defense, and grid applications while the most detailed third-party technical example in this pool is an EV test. TechCrunch's March 2025 account says Gemini had yet to be adopted by a major automaker (CP015). This is a material adoption signal, but it does not establish failure in ONE's newer segments. The available sources do not identify current shipped volumes, repeat orders, project economics, channel partners, or the share of revenue from any product line. Those are the key diligence items for testing whether product differentiation can support a durable commercial position.
    claimRefs:
      - CP001
      - CP013
      - CP014
      - CP015
    tableRefs:
      - TP003
  - id: durability-and-industry-risks
    title: Moat durability and competitive pressure
    body: >-
      Domestic manufacturing incentives and capacity expansion cut both ways for ONE. Clean Investment Monitor reported that US battery-cell and module manufacturing capacity exceeded current deployment in its Q1 2025 snapshot, while its 2035 outlook depends on announced and under-construction projects proceeding under stated policy assumptions (CP010). Energy Storage News reported 45X credits of US$35 per kWh for battery manufacturing and US$10 per kWh for modules, a potential support to domestic production economics rather than a company-specific margin estimate (CP012). The same monitor reported six projects tied to US$6.9 billion of investment cancelled in Q1 2025, including Freyr Battery and Kore Power plans, illustrating execution and policy sensitivity alongside expansion (CP011).

      These sources suggest a crowded, policy-sensitive manufacturing landscape, but do not establish ONE's actual cost position, access to subsidies, or supply contracts. TechCrunch and Battery Technology separately report a 128-person workforce reduction in 2023; this is historical evidence of execution and financing pressure, not a current headcount or cash-burn measure (CP016). A durable moat would require evidence of repeat orders, cost-down at realized volumes, qualified supply, warranty performance, and customer switching friction. None is established by the assigned sources, so these remain material diligence questions rather than assumed weaknesses or strengths.
    claimRefs:
      - CP010
      - CP011
      - CP012
      - CP016
