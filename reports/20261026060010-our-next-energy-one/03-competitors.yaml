      - - "Manufacturing scale"
        - "ONE's 20 GWh factory figure was a 2023 announced plan; current operating utilization is unknown."
        - "CNEVPost reports EV installation scale for leading suppliers; Clean Investment Monitor gives aggregate US capacity."
        - "Planned capacity, aggregate capacity, and installed EV batteries are different measures."
      - - "Domestic production economics"
        - "ONE's actual 45X eligibility, subsidy monetization, and realized cell costs are not stated."
