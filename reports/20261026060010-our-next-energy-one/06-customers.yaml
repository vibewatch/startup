company:
  name: Our Next Energy (ONE)
chapter:
  number: 6
  title: Customers
  summary: Public evidence shows a mix of announced grid-product offerings, a selected storage-project partnership, an automotive demonstration, and a historical company-reported contract book. It does not establish current delivery conversion, repeat orders, retention, revenue contribution, or concentration after ONE's strategic pivot.
sections:
  - id: customer-segments
    title: Customer segments and buying roles
    body: >-
      ONE's current official materials position battery cells, modules, and a battery
      management system for grid-storage projects, while its industry page also
      identifies rail and defense products. These are target markets and product
      offers, not a disclosed customer roster. The clearest named grid relationship
      in the retained evidence is BHE Renewables' selection of ONE as its large-scale
      storage partner for a Ravenswood, West Virginia industrial site; the source
      describes BHE as the partner and PCC/TIMET as the facility occupant, but does
      not disclose the contracting payer, commercial terms, or an operating battery
      deployment. An earlier announcement hosted by DBusiness claimed contracts
      with four unnamed customers, but its fetched text supplies no customer names
      or delivery reconciliation. As a result, segment-level revenue, the number
      of active accounts, and the split among buyer, user, and payer remain
      unquantified.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
      - CU012
    tableRefs:
      - TU001
  - id: adoption-evidence
    title: Adoption evidence stops short of repeatable production proof
    body: >-
      The adoption record spans different proof levels and should not be combined
      into a single customer-growth curve. ONE's November 2023 release said pilot
      cell production had started and that samples were being shared for customer
      testing; it described first-half 2024 deliveries as a future validation
      milestone, not as completed shipments. A May 2025 company announcement
      expanded the grid offer to cells, modules, and a battery management system,
      but it provided no booked-order, shipment, or installed-base count. Separately,
      InsideEVs reported a 608.1-mile BMW iX demonstration under WLTP, while
      TechCrunch reported in March 2025 that Gemini had not been adopted by a major
      automaker as of its publication. BHE's partner selection is meaningful
      project evidence, yet the available announcement does not show commissioning
      or acceptance. These milestones support product and customer engagement;
      they do not prove current commercial conversion.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU001
  - id: durability-and-concentration
    title: Retention, concentration, and fulfillment remain open
    body: >-
      The retained public material does not report current active customers,
      shipments by product, contract conversion, repeat orders, renewal rates,
      churn, satisfaction, or customer-level revenue. The historical four-customer
      contract statement lacks names, contract dates, delivery milestones, and
      subsequent status, so neither backlog conversion nor current customer
      concentration can be calculated from it.       A Battery Technology report described a November 2023 workforce reduction,
      but the retained evidence does not establish whether it affected
      customer-facing capacity or specific commitments. The 2025 factory-opening
      schedule in the Ravenswood announcement also needs a current commissioning
      check. Diligence should reconcile each contract to customer identity,
      product, shipment and acceptance records, cash collection, and repeat
      purchasing, then obtain independent customer references and current
      concentration and retention metrics.
    claimRefs:
      - CU001
      - CU008
      - CU011
      - CU012
      - CU013
callouts:
  - calloutType: risk
    title: Announced demand is not verified delivery
    body: The historical contract total and later product or partnership announcements do not establish what has shipped, been accepted, or reordered; request contract-level reconciliation before treating them as current backlog.
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU008
  - calloutType: insight
    title: Proof differs sharply by segment
    body: BMW evidence is a prototype demonstration, while BHE evidence is a project-partner selection; neither should be presented as a production deployment or repeat customer.
    claimRefs:
      - CU007
      - CU009
      - CU010
