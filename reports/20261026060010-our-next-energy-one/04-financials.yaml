company:
  name: Our Next Energy (ONE)
chapter:
  number: 4
  title: Financials
  summary: Public evidence describes battery products, supplier and project announcements, and a historically capital-intensive manufacturing plan, but does not establish current revenue, margin, cash, or runway. Industry cost and supply-chain data heighten the execution risk without serving as a proxy for ONE's own unit economics.
sections:
  - id: revenue-pathways
    title: Publicly evidenced revenue pathways
    body: >-
      ONE's public product materials and announcements point to commercial-vehicle battery packs and stationary-storage systems, with rail and defense products also described as LFP-based. A Shyft announcement identifies 62 kWh and 79 kWh Aries packs for its Blue Arc platform and quotes ONE describing the agreement as its tenth supply agreement since 2021. A West Virginia project announcement described an Aries Grid factory and an additional project investment, but it does not establish factory completion, customer payments, shipment volumes, or recognized revenue. These are evidence of product and commercial activity, not of recurring or realized sales. The available material does not disclose contract prices, order volumes, delivery schedules, warranty obligations, or revenue recognition by product.
    claimRefs: [CI001, CI002, CI003]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: plant-and-capital
    title: Manufacturing footprint and capital exposure
    body: >-
      ONE Circle illustrates the capital intensity of the manufacturing model: HDR describes a 659,589-square-foot former distribution center retrofitted for heavy manufacturing, while two news reports cite a $1.6 billion project investment estimate. InsideEVs reported that pilot production had started and that 20 GWh of annual output was a future expectation; it also described customer deliveries as expected in the first half of 2024. Those historical milestones do not establish current utilization, completed spend, remaining capex, or commercial shipments. A separate West Virginia announcement said a planned Aries Grid factory would add $22 million of investment and 105 jobs, with opening scheduled for 2025; the assigned sources do not verify that schedule was met.
    claimRefs: [CI004, CI005, CI006]
  - id: industry-economics
    title: Cost and margin context
    body: >-
      Industry data are a directional stress test, not a substitute for ONE's cost accounts. The IEA reports that average battery prices declined 8% in 2025 and that LFP packs were more than 40% cheaper per kWh than NMC alternatives on average, while cautioning that stationary-storage applications contribute to that comparison. It also reports losses among many cathode-active-material producers since 2023. A separate US supply-chain report records substantial domestic cell and module capacity as of Q1 2025, while a Colorado-focused policy report discusses material-input availability and import dependence in general terms. These sources support a competitive and input-cost risk case, but none measures ONE's procurement costs, yields, pricing power, or gross margin.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI002]
  - id: underwriting-gaps
    title: Underwriting verdict and diligence blockers
    body: >-
      The capital record is mixed and dated. TechCrunch reported that a 2025 funding round had closed but that ONE had not disclosed its size; the same article recounted an earlier cash crunch while a $1.6 billion factory was being built, and prior coverage reported 128 layoffs, about 25% of the workforce, in 2023. Funding raised or a project investment estimate is not evidence of current cash available. The sources supplied here do not quantify recognized revenue, ARR, gross margin, cash balance, monthly burn, runway, debt or project-finance obligations, realized pricing, CAC, payback, customer concentration, or delivered volumes. Until management supplies line-level financials and order-to-cash evidence, revenue quality and margin trajectory remain unproven and capital adequacy cannot be underwritten.
    claimRefs: [CI005, CI007, CI008, CI009]
    tableRefs: [TI003]
tables:
