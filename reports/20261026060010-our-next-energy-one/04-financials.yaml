    title: Revenue streams and commercial evidence
    columns: [Stream, Public evidence and status, Financial interpretation, Diligence ask]
    rows:
      - [Commercial-vehicle battery packs, "A Shyft announcement identifies 62 kWh and 79 kWh Aries LFP packs for Blue Arc; the announcement gives no shipment volume or delivery record.", "Supplier activity is described, but order value and recognized revenue are not disclosed.", "Obtain executed supply terms, delivered units by period, realized price, warranty reserve, and customer concentration."]
      - [Utility-scale storage, "A West Virginia project announcement described an Aries Grid factory and a planned 2025 opening; current operating status is not verified in this pool.", "The stated $22 million was additional project investment, not reported ONE revenue or cash.", "Verify commissioning, contracts, ownership and financing structure, capacity utilization, and customer payments."]
      - [Rail and defense battery products, "ONE's sector page describes LFP products for rail and defense; no customer, order, shipment, or price data are provided.", "A stated market/product focus does not establish a realized revenue stream.", "Request product-level backlog, customer list, delivery history, and contract economics."]
    notes: Public announcements and product descriptions only; project investment, pack capacity, and planned factory output are not realized sales or revenue.
    claimRefs: [CI001, CI002, CI003]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Monetization question, Disclosed evidence, List versus realized pricing, Diligence ask]
    rows:
      - [Vehicle pack pricing, "Pack capacities of 62 kWh and 79 kWh are reported, but no price, discount, or contract value is disclosed.", Unknown; pack capacity is not a price or revenue figure., "Obtain list and realized $/kWh, volume tiers, pass-through clauses, and warranty/service inclusions."]
      - [Grid-storage contract economics, "A planned Aries Grid factory and project investment are reported, but system price, contracted volume, or service fee is not.", Unknown; the announced project investment is not product pricing., "Obtain customer contracts, system-level $/kWh, commissioning milestones, service obligations, and payment terms."]
      - [Sales and channel economics, "The assigned sources do not report sales cycles, distributor fees, acquisition spending, or customer payback.", Unknown; no CAC or payback proxy can be calculated., "Request sales funnel cohorts, sales and application-engineering costs, channel terms, and time from order to cash."]
    notes: No public list or realized prices were found in the assigned evidence; unknown values are not zero and no estimate is inferred.
    claimRefs: [CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns: [Metric, Value or status in assigned evidence, Confidence and underwriting relevance, Specific diligence request]
    rows:
      - [Recognized revenue / ARR, "Not quantified by the assigned sources; current revenue mix and recognition policy are unavailable.", "Low confidence in scale or quality; product announcements cannot substitute for revenue.", "Provide audited or reviewed statements and monthly recognized revenue by product, customer, and contract type."]
      - [Gross margin / unit cost, "No ONE-specific COGS, yield, scrap, labor, freight, warranty, or gross-margin figure is disclosed; IEA market data are industry context only.", "Material gap: market pricing pressure may compress margins, but ONE's position cannot be calculated.", "Provide BOM and conversion cost by SKU, yield and utilization history, warranty returns, and margin bridge."]
      - [CAC / payback / sales cycle, "Not reported in the assigned evidence; no defensible proxy is available.", "Low confidence in commercial efficiency or repeat-order economics.", "Provide channel-level selling costs, qualified pipeline conversion, sales-cycle cohorts, and customer payback assumptions."]
      - ["Cash, burn, runway, and obligations", "Current cash, monthly cash burn, runway, debt, and project-finance obligations are not quantified; historical financing and workforce actions are not current liquidity measures.", "Blocking for capital-adequacy underwriting; announced funding is not cash available.", "Obtain current cash reconciliation, monthly burn, debt/project-finance schedule, restricted cash, and a 12-18 month funding plan."]
    notes: Company-specific private financial inputs are unavailable in this assigned source set; industry metrics are not used as ONE estimates.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012]
