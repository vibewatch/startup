  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary follows the shipped product, not the broad battery headline
        blocks:
          - type: paragraph
            body: >-
              The defensible starting point is the spend on battery cells, modules or packs, and related
              battery-management equipment that ONE can supply into stationary storage and selected mobility
              applications. ONE's reported 2025 product suite included LFP cells, Aries modules, and a grid
              battery-management system; its own industry page also describes LFP products for rail and defense. Those
              sources establish product categories, not current sales volumes or a customer count. The adjacent markets
              therefore need separate treatment: utility-scale and behind-the-meter storage, commercial vehicles, and
              rail/defense are not one interchangeable buyer pool. Passenger-EV battery deployment is a broader
              adjacency, but a reported prototype demonstration is not proof of current production adoption. Project
              EPC, electricity sales, and upstream mineral production are outside the evidenced product boundary.
            claimRefs:
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
              - CM016
      - number: '2.2'
        title: Sizing evidence is substantial but not a ONE-specific TAM
        blocks:
          - type: paragraph
            body: >-
              The strongest quantitative lenses are deployment flows rather than battery supplier revenue. SEIA and
              Benchmark Mineral Intelligence report U.S. BESS installations of 20.2 GWh in Q2 2026, with 18 GWh in
              utility-scale projects and separate residential and commercial-and-industrial additions. Their longer-term
              figures are forecasts: annual U.S. installations are projected to exceed 110 GWh by 2030, with cumulative
              installations of 683 GWh. For the global EV adjacency, IEA reports 1.2 TWh of battery deployment in 2025;
              CNEVPost, citing SNE Research, reports 1,187 GWh of EV battery usage for the same year. The labels and
              rounding differ, but both indicate a roughly 1.2 TWh market. These geography-, end-market-, and
              period-specific measures cannot be added together or converted into ONE's obtainable revenue without
              product eligibility, pricing, and share evidence.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers and budget owners differ by deployment path
        blocks:
          - type: paragraph
            body: >-
              Stationary storage divides further between utility-scale projects and behind-the-meter residential and C&I
              installations. SEIA/BMI's Q2 2026 summary attributes much of C&I demand to data centers, but it does not
              name procurement owners, contract values, or ONE's role in those installations. In mobility, the
              Shyft/Blue Arc battery supply announcement gives a concrete commercial-vehicle route, while its
              delivery-segment growth figure is a partner-issued forecast rather than an independent battery-market
              estimate. Rail and defense are named product sectors on ONE's site, but the assigned evidence does not
              identify procurement programs or award budgets. Accordingly, buyer roles in the map are diligence
              hypotheses where stated, not verified ONE customers or confirmed spending authority.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM015
      - number: '2.4'
        title: Domestic supply and deployment growth are balanced by ramp and proof risk
        blocks:
          - type: paragraph
            body: >-
              Storage deployment and domestic-manufacturing policy create plausible demand tailwinds, but they do not
              remove execution risk. In 2025, ONE was reported as preparing for full-scale U.S. manufacturing by early
              2027; an earlier 2023 report described pilot production and a planned 20-GWh line, which is a dated plan
              rather than evidence of current output. IEA notes that reaching near nominal production can take more than
              five years for most facilities, making yield, utilization, equipment, and working-capital execution
              material to market capture. DOE's selected manufacturing projects and the cited partner vehicle forecast
              are not awards or demand commitments to ONE. Similarly, the 2023 Gemini range demonstration was followed
              by further refinement and validation work before commercialization. The available sources support demand
              hypotheses, not backlog conversion, repeat orders, or price realization.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment scale is not ONE's serviceable revenue
            body: >-
              U.S. storage forecasts and global EV deployment show sizeable demand pools, but the assigned evidence does
              not establish ONE's qualified share, buyer budgets, realized pricing, or recurring order conversion.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and observable scale
        blocks:
          - type: paragraph
            body: >-
              The available record spans two different competitive arenas that should not be collapsed into one market.
              CNEVPost's table, citing SNE Research, measures global EV-battery installations in 2025; it shows CATL and
              BYD at 55.6% combined share and lists other large suppliers, but it does not report a comparable figure
              for ONE (CP005, CP006). That is evidence of formidable EV-cell incumbents, not a measurement of ONE's
              share in grid, rail, or defense systems. The IEA describes a separate stationary-storage context in which
              LFP accounts for around 90% of 2025 deployments and utility-scale projects represented around 80% of new
              capacity (CP008, CP009). Those category trends make LFP relevant to ONE's stated pivot, but they do not
              establish customer wins or supplier rankings for ONE.

              ONE's public materials describe a domestic LFP pilot-cell program and LFP products for rail and defense,
              while Battery-Tech Network's profile also places its activity across EV and grid applications (CP001,
              CP003, CP004). The 20 GWh ONE Circle figure is a 2023 company-announced plan, not evidence of current
              utilization or delivered volume (CP002). The profile table therefore separates named EV leaders from
              market-level manufacturing and storage alternatives; the scale figure reproduces the cited EV table rather
              than implying a complete census of ONE's new segments.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
      - number: '3.2'
        title: Product differentiation and buyer fit
        blocks:
          - type: paragraph
            body: >-
              ONE's defensible product story in the assigned evidence is its claimed LFP focus and system design, not a
              proven cost or performance advantage against named suppliers. The company says its rail- and
              defense-sector products use LFP; the IEA describes LFP as typically cheaper and better suited to frequent
              cycling than higher-energy-density EV chemistries (CP003, CP008). That supports a potential fit with
              stationary or duty-cycle-heavy applications, but it is not a third-party test of ONE's safety, cycle life,
              total system cost, or qualification status. A BMW iX demonstration gives a concrete technical proof point:
              InsideEVs reported 608.1 miles under WLTP, explicitly attributing the result to ONE, while TechCrunch
              later reported that Gemini had not been adopted by a major automaker (CP013, CP015). A demonstration and
              an attributable performance claim are not equivalent to serial production, validated fleet economics, or
              repeat orders.

              Against CATL, BYD, and other EV suppliers, the source set provides installation scale but no like-for-like
              chemistry, warranty, system-integration, or safety comparison. For grid, rail, and defense buyers, it
              likewise does not establish procurement specifications, distribution reach, service coverage, or
              competitor qualification. The matrix marks such cells unknown rather than assuming that a product
              description proves superiority. These gaps leave switching costs, multi-homing, and the buyer's
              build-versus-buy choice unresolved.
            claimRefs:
              - CP003
              - CP008
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP010
              - CP012
              - CP013
              - CP015
      - number: '3.3'
        title: Pricing, commercialization, and routes to market
        blocks:
          - type: paragraph
            body: >-
              No source in the assigned pool supplies a comparable list price, realized cell or pack price, contract
              duration, discount, warranty cost, or gross-margin figure for ONE and the named suppliers. The pricing
              exhibit records that boundary explicitly: "unknown" means the reviewed sources do not state the term, not
              that the term is zero or necessarily unavailable in private diligence. The 2025 funding coverage also says
              the round's size was not disclosed at publication, so capital raised cannot be used as a proxy for cash
              available to fund commercialization (CP014). The 2023 pilot-production announcement and the 2023 BMW test
              are milestones, not evidence that ONE converted the products into sustained customer deliveries (CP001,
              CP013).

              Commercialization is especially important because the company's product mix has shifted toward rail,
              defense, and grid applications while the most detailed third-party technical example in this pool is an EV
              test. TechCrunch's March 2025 account says Gemini had yet to be adopted by a major automaker (CP015). This
              is a material adoption signal, but it does not establish failure in ONE's newer segments. The available
              sources do not identify current shipped volumes, repeat orders, project economics, channel partners, or
              the share of revenue from any product line. Those are the key diligence items for testing whether product
              differentiation can support a durable commercial position.
            claimRefs:
              - CP001
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and competitive pressure
        blocks:
          - type: paragraph
            body: >-
              Domestic manufacturing incentives and capacity expansion cut both ways for ONE. Clean Investment Monitor
              reported that US battery-cell and module manufacturing capacity exceeded current deployment in its Q1 2025
              snapshot, while its 2035 outlook depends on announced and under-construction projects proceeding under
              stated policy assumptions (CP010). Energy Storage News reported 45X credits of US$35 per kWh for battery
              manufacturing and US$10 per kWh for modules, a potential support to domestic production economics rather
              than a company-specific margin estimate (CP012). The same monitor reported six projects tied to US$6.9
              billion of investment cancelled in Q1 2025, including Freyr Battery and Kore Power plans, illustrating
              execution and policy sensitivity alongside expansion (CP011).

              These sources suggest a crowded, policy-sensitive manufacturing landscape, but do not establish ONE's
              actual cost position, access to subsidies, or supply contracts. TechCrunch and Battery Technology
              separately report a 128-person workforce reduction in 2023; this is historical evidence of execution and
              financing pressure, not a current headcount or cash-burn measure (CP016). A durable moat would require
              evidence of repeat orders, cost-down at realized volumes, qualified supply, warranty performance, and
              customer switching friction. None is established by the assigned sources, so these remain material
              diligence questions rather than assumed weaknesses or strengths.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Publicly evidenced revenue pathways
        blocks:
          - type: paragraph
            body: >-
              ONE's public product materials and announcements point to commercial-vehicle battery packs and
              stationary-storage systems, with rail and defense products also described as LFP-based. A Shyft
              announcement identifies 62 kWh and 79 kWh Aries packs for its Blue Arc platform and quotes ONE describing
              the agreement as its tenth supply agreement since 2021. A West Virginia project announcement described an
              Aries Grid factory and an additional project investment, but it does not establish factory completion,
              customer payments, shipment volumes, or recognized revenue. These are evidence of product and commercial
              activity, not of recurring or realized sales. The available material does not disclose contract prices,
              order volumes, delivery schedules, warranty obligations, or revenue recognition by product.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI012
      - number: '4.2'
        title: Manufacturing footprint and capital exposure
        blocks:
          - type: paragraph
            body: >-
              ONE Circle illustrates the capital intensity of the manufacturing model: HDR describes a
              659,589-square-foot former distribution center retrofitted for heavy manufacturing, while two news reports
              cite a $1.6 billion project investment estimate. InsideEVs reported that pilot production had started and
              that 20 GWh of annual output was a future expectation; it also described customer deliveries as expected
              in the first half of 2024. Those historical milestones do not establish current utilization, completed
              spend, remaining capex, or commercial shipments. A separate West Virginia announcement said a planned
              Aries Grid factory would add $22 million of investment and 105 jobs, with opening scheduled for 2025; the
              assigned sources do not verify that schedule was met.
            claimRefs:
              - CI004
              - CI005
              - CI006
      - number: '4.3'
        title: Cost and margin context
        blocks:
          - type: paragraph
            body: >-
              Industry data are a directional stress test, not a substitute for ONE's cost accounts. The IEA reports
              that average battery prices declined 8% in 2025 and that LFP packs were more than 40% cheaper per kWh than
              NMC alternatives on average, while cautioning that stationary-storage applications contribute to that
              comparison. It also reports losses among many cathode-active-material producers since 2023. A separate US
              supply-chain report records substantial domestic cell and module capacity as of Q1 2025, while a
              Colorado-focused policy report discusses material-input availability and import dependence in general
              terms. These sources support a competitive and input-cost risk case, but none measures ONE's procurement
              costs, yields, pricing power, or gross margin.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The capital record is mixed and dated. TechCrunch reported that a 2025 funding round had closed but that
              ONE had not disclosed its size; the same article recounted an earlier cash crunch while a $1.6 billion
              factory was being built, and prior coverage reported 128 layoffs, about 25% of the workforce, in 2023.
              Funding raised or a project investment estimate is not evidence of current cash available. The sources
              supplied here do not quantify recognized revenue, ARR, gross margin, cash balance, monthly burn, runway,
              debt or project-finance obligations, realized pricing, CAC, payback, customer concentration, or delivered
              volumes. Until management supplies line-level financials and order-to-cash evidence, revenue quality and
              margin trajectory remain unproven and capital adequacy cannot be underwritten.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio reset and product maturity
        blocks:
          - type: paragraph
            body: >-
              ONE's January 2026 announcement says it suspended passenger-EV investment and redirected its product and
              manufacturing footprint toward rail, defense, and utility-scale energy storage. The company announced $35
              million in new purchase orders from rail and defense customers, but the release does not identify those
              customers, distinguish orders from deliveries, or disclose product-level volumes (CE016). Its current
              public product positioning emphasizes LFP cells and packs for grid storage, rail, and defense; this
              establishes the stated portfolio, not current revenue or installed base. Historical Gemini work remains
              useful evidence of battery engineering activity, but is not evidence that the old passenger-EV program is
              still a commercial priority. tables and the company's descriptions should therefore be read as a product
              map, not a comprehensive SKU list: the assigned material names no rail models, defense-specific SKUs, or
              current ESS system specifications. TechCrunch reported in March 2025 that Gemini had not been adopted by a
              major automaker. That historical limit is consistent with the subsequent announced EV pause, but does not
              establish the commercial maturity of the new rail and storage products.
            claimRefs:
              - CE001
              - CE002
              - CE012
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE012
      - number: '5.2'
        title: Manufacturing footprint and product architecture
        blocks:
          - type: paragraph
            body: >-
              ONE says its Van Buren Township facility has completed retooling to produce an LFP cell, while its Novi
              facility has been retooled for three rail products and retains the ability to make grid-scale ESS modules.
              The January release reports that the rail products completed a 12-month demonstration across U.S. and
              Canadian locomotives; its homepage separately describes field deployments across North America. Neither
              source names the operators, test protocols, fleet sizes, or measured outcomes, so the demonstration is
              company-reported validation rather than independently reproducible performance evidence. The public
              architecture is best understood as two manufacturing layers—cell production in Van Buren and pack/system
              production in Novi—feeding rail, defense, and utility-storage use cases. ONE describes the OTP LFP cell as
              supporting 12-minute fast charging and prolonged exposure to deep-sea pressures, but no underlying
              qualification report is in the assigned evidence. Older sources describe the dual-chemistry Gemini design
              and the earlier Aries product family; those historical designs should not be conflated with the current
              post-pivot lineup.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE014
              - CE015
      - number: '5.3'
        title: Validation, trust, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              The company states that its Van Buren cell facility is ISO 9001 Quality certified and that the OTP cell is
              UN 38.3 Safety certified. These are meaningful quality and transport-safety signals if their scope is
              confirmed, but the assigned pages do not include the certificates, covered product models, issuing bodies,
              expiry dates, or independent test reports. ONE's claims about fast charging, pressure tolerance, rail
              durability, and the 12-month locomotive demonstration therefore remain company-reported rather than
              independently measured in this evidence set. Historical EV evidence is more specific but still bounded:
              InsideEVs reported that ONE attributed 608.1 miles under WLTP to a BMW iX test using Gemini, while
              TechCrunch later reported no major-automaker adoption of Gemini. A state release described a 2022
              manufacturing-campus plan, including a five-year 20 GWh capacity target; that forecast is not evidence of
              current capacity or output. A separate release-sharing page described a planned Aries Grid factory at a
              West Virginia microgrid site. Current line-level throughput, delivered system counts, warranty
              performance, field failure rates, and named customer outcomes remain open diligence items. Battery
              Technology also reported an approximately 25% workforce reduction, or 128 people, in November 2023; that
              historical event signals prior execution pressure but cannot quantify current staffing or post-pivot
              engineering capacity (CE015).
            claimRefs:
              - CE008
