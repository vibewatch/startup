chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Michigan's 2022 project announcement identifies ONE as a Novi-headquartered energy-storage company founded
              in 2020, and TechCrunch likewise describes founder Mujeeb Ijaz as having started the company that year
              (CO001, CO002). A 2026 Battery Technology interview characterizes the company as having exited the EV
              market and shifted toward energy storage, defense, and rail; ONE's own industry page describes LFP
              products for rail and defense (CO003). This establishes a strategic repositioning, not proof that the
              earlier EV platform has generated recurring revenue or that the newer segments have reached repeatable
              production. The assigned evidence does not establish present headcount, customer count, or a dated
              operating scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
