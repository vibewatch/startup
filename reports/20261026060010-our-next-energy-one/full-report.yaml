              so neither backlog conversion nor current customer concentration can be calculated from it.       A
              Battery Technology report described a November 2023 workforce reduction, but the retained evidence does
              not establish whether it affected customer-facing capacity or specific commitments. The 2025
              factory-opening schedule in the Ravenswood announcement also needs a current commissioning check.
              Diligence should reconcile each contract to customer identity, product, shipment and acceptance records,
