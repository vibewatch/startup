  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying roles
        blocks:
          - type: paragraph
            body: >-
              ONE's current official materials position battery cells, modules, and a battery management system for
              grid-storage projects, while its industry page also identifies rail and defense products. These are target
              markets and product offers, not a disclosed customer roster. The clearest named grid relationship in the
              retained evidence is BHE Renewables' selection of ONE as its large-scale storage partner for a Ravenswood,
              West Virginia industrial site; the source describes BHE as the partner and PCC/TIMET as the facility
              occupant, but does not disclose the contracting payer, commercial terms, or an operating battery
              deployment. An earlier announcement hosted by DBusiness claimed contracts with four unnamed customers, but
              its fetched text supplies no customer names or delivery reconciliation. As a result, segment-level
              revenue, the number of active accounts, and the split among buyer, user, and payer remain unquantified.
            claimRefs:
