      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              TechCrunch reported on March 6, 2025 that founder Mujeeb Ijaz returned as CEO after previously moving to
              the CTO role and after Paul Humphries had served as CEO; Distill's announcement index separately lists
              Ijaz's CEO appointment (CO004). TechCrunch also reported that Ijaz's brother Mansoor, chairman of Crescent
              Ventures, would join the board (CO005). The sequence makes founder continuity and succession planning
              material diligence topics, while the available evidence does not establish the current board roster,
              director independence, committee structure, or the related-party review process. A dated organization
              chart, board minutes, and succession plan would clarify key-person exposure and decision rights.
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO007
      - number: '1.3'
        title: Financing, scale, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              TechCrunch recounted a historical $300 million Series B at a $1.2 billion post-money valuation and
              described a later 2025 funding round led by Crescent Ventures and Trousdale Ventures; it said the later
              round's size was not disclosed (CO006, CO007). Those figures describe different financings and do not
              establish current valuation or cash available. The same evidence base records a Michigan factory plan
              announced at $1.6 billion and a separate state-support package of $236.6 million, including a $200 million
              performance-based grant (CO008, CO009). Distill lists a $35 million rail-and-defense purchase-order
              announcement, a 45% workforce reduction, and a 2026 cash-flow breakeven target; each is a company
              announcement as summarized by that page, not verified deliveries, financial statements, or achieved
              breakeven (CO011-CO013). It also lists revenue as tripling over 12 months without a baseline or absolute
              amount (CO014).
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: Milestones and commercial validation
        blocks:
          - type: paragraph
            body: >-
              The timeline separates announced plans from demonstrated or reported outcomes. Michigan's October 2022
              release described a planned factory and state support; the 2023 workforce reduction is a later execution
              signal, not evidence that the project reached its planned scale (CO008-CO010). InsideEVs reported ONE's
              608.1-mile BMW iX test result as a company claim, while TechCrunch later said Gemini had not been adopted
              by a major automaker at its reporting date (CO015). ONE's current industry page supports the direction of
              the LFP portfolio, and the 2026 trade interview supports the pivot narrative, but neither proves
              commercial repeat orders or cash conversion (CO003). RV News reported that Shyft selected ONE as a battery
              supplier, while Distill lists later rail and defense orders without customer names or delivery evidence
              (CO016, CO011). Contract performance, customer concentration, warranty obligations, and factory status
              therefore remain central diligence items.
