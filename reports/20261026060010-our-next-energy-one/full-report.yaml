              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not treat stated capacity as proven scale
            body: >-
              ONE's page reports a 10 MWh validation line in 2023 and describes 20 GWh of site capacity, but the
              assigned evidence does not show current utilization, yield, or delivered volume. Underwrite the ramp only
              against current operating data and customer acceptance.
            calloutType: risk
