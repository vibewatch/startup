  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution and operating exposure
        blocks:
          - type: paragraph
            body: >-
              The central execution risk is whether ONE can convert its stated move away from passenger-EV investment
              into repeatable infrastructure and defense production. ONE announced that pivot in January 2026, while its
              manufacturing page's concrete operating milestone is a 10 MWh customer-validation line reported in October
              2023; the same page describes 20 GWh of site capacity, not demonstrated output. Its 2023 plan to scale
              after validation is a historical target, not evidence that the ramp occurred.       Its October 2026
              newsroom headline about an Army technology competition is a positive signal but does not disclose order
              value, delivery, or repeat use. Workforce reports add execution uncertainty: one data page records 29
              workers across one January 2026 WARN notice, while a separate undated-in-text article reports a 37-job
              reduction including 24 Michigan positions. These counts are not additive or safely comparable without
              event dates and employer records.
            claimRefs:
              - CR001
