    2020. Public reporting describes a pivot away from passenger EVs toward energy storage, defense, and rail, where the
    company describes LFP products. Historical financing and product demonstrations establish a development record, but
    the current public record does not establish revenue scale, repeatable deliveries, or liquidity.
