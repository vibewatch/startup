  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              Recommend research-more rather than buy or assign a target price. ONE's own materials describe battery
              products for rail and defense and a Gemini demonstration; InsideEVs separately reported 608.1 miles under
              WLTP for a BMW iX test vehicle. These are evidence of technical work, not evidence of repeatable sales,
              recognized revenue, margin, or customer economics (CV002, CV003). The company website also describes a
              current product and manufacturing direction, but does not provide transaction terms or company-level
              operating metrics in the retained material (CV001, CV002). The strongest public financing reference is a
              historical Series B mark; a later funding round's amount and terms were not disclosed in the
              contemporaneous coverage (CV005, CV006). The evidence therefore supports a thesis worth diligencing, not a
              price-supported investment decision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: Entry price and public comparables
        blocks:
          - type: paragraph
            body: >-
              Do not treat the reported $1.2 billion post-money Series B valuation as a current mark: it is historical,
              predates the later undisclosed funding round, and is not accompanied here by a current share price,
              capitalization table, preference stack, or dilution terms (CV005, CV006). The reported Michigan factory
              investment and historical funding stress make capital needs and financing structure material diligence
              items, but neither is a present cash balance or burn-rate measure (CV007, CV008, CV009). Public battery
              and storage companies provide context only. The available snapshots cover unlike business mixes, periods,
              and profitability conditions; they are not independent private-company valuation benchmarks and should not
              be used to derive a ONE multiple (CV010-CV012). Without ONE's own revenue, gross margin, backlog
              conversion, capital requirements, and current terms, a numerical enterprise or equity value would create
              false precision.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenario logic and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The cases below are conditional operating narratives, not probability- weighted valuations. A bull case
              requires validation that technical performance can become qualified, repeat orders at attractive
              economics; the public record reviewed here does not establish those outcomes (CV003, CV004). The base case
              is continued diligence without a price conclusion until current financing terms and audited or otherwise
              verifiable unit economics are available. The bear case is that commercialization or funding needs outrun
              available capital, a concern consistent with historical reports of a failed prospective investment,
              layoffs, and a capital-intensive factory plan, but not proof of current distress (CV007-CV009). Move
              toward an investable price only after validating signed orders and delivery conversion, customer
              concentration, product-line gross margins, cash and debt obligations, and the full preference and dilution
              stack. Revisit the thesis if orders fail to convert, production milestones slip, or new capital is raised
              on materially dilutive terms.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.4'
        title: Unresolved return and exit inputs
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not supply enough company-specific inputs to calculate a defensible bull, base, or
              bear equity value or investor return. In particular, there is no current disclosed transaction price,
              security class, fully diluted share count, preference waterfall, revenue by product, gross margin,
              working-capital profile, or cash runway in this evidence set. These are evidence gaps, not proof that the
              company has no such data. The historical Gemini demonstration and Series B mark should not be converted
              into current exit readiness or a return multiple. Obtain the data room, customer-level order and delivery
              schedules, audited financials, and financing documents before revisiting valuation; require milestone and
              downside protections if those inputs remain unavailable.
            claimRefs:
              - CV003
              - CV006
              - CV013
