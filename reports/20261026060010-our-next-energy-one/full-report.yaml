      - number: '6.2'
        title: Adoption evidence stops short of repeatable production proof
        blocks:
          - type: paragraph
            body: >-
              The adoption record spans different proof levels and should not be combined into a single customer-growth
              curve. ONE's November 2023 release said pilot cell production had started and that samples were being
              shared for customer testing; it described first-half 2024 deliveries as a future validation milestone, not
              as completed shipments. A May 2025 company announcement expanded the grid offer to cells, modules, and a
              battery management system, but it provided no booked-order, shipment, or installed-base count. Separately,
              InsideEVs reported a 608.1-mile BMW iX demonstration under WLTP, while TechCrunch reported in March 2025
              that Gemini had not been adopted by a major automaker as of its publication. BHE's partner selection is
              meaningful project evidence, yet the available announcement does not show commissioning or acceptance.
              These milestones support product and customer engagement; they do not prove current commercial conversion.
