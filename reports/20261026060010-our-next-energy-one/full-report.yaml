      - number: '7.2'
        title: Legal, regulatory, and compliance exposure
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a legal-process check, not a finding of noncompliance. The Department of
              Labor describes federal WARN coverage for generally covered employers with 100 or more employees and
              qualifying events affecting 50 or more employees at one site, with at least 60 calendar days' notice and
              specified exceptions. The 29-person notice reported by WarnTracker alone does not establish whether the
              statute applied, whether other events or sites matter, or whether notice was adequate; state requirements
              may also differ. The supplied sources do not establish ONE's current operating permits, product
              certifications, environmental or safety compliance, litigation, enforcement, privacy controls, or security
              incidents. The FTC material describes general business security obligations, not an allegation about ONE.
              Those statuses should remain open diligence items rather than be inferred from silence in this pool.
            claimRefs:
              - CR008
              - CR010
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR010
              - CR014
              - CR016
      - number: '7.3'
        title: Dependencies, financial resilience, and monitoring
        blocks:
          - type: paragraph
            body: >-
              Supply-chain and capital risks remain conditional because the company-level exposure is not quantified.
              ONE says it intends to process materials in-house and prioritize North American inputs, and says it works
              with partners, but the cited manufacturing page names no supplier, allocation, or concentration.
              Energy-Storage.news reported a May 2024 tariff schedule that anticipated a 25% rate on non-EV lithium-ion
              batteries in 2026; this is dated policy context, not verification of the rule in force on this report date
              or of ONE's import mix. TechCrunch reported on March 6, 2025 that the size of a newly closed round had not
              been disclosed at publication. Neither that historical account nor the prior $300 million Series B
              establishes current cash, burn, debt, or financing runway. Track delivered systems, factory utilization,
              customer and supplier concentration, current financing terms, and documented compliance milestones; set
              quantitative tripwires only after management supplies current baselines and contractual thresholds.
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
