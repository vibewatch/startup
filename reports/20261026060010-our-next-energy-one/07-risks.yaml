company:
  name: Our Next Energy (ONE)
chapter:
  number: 7
  title: Risks
  summary: ONE's public materials describe a shift toward infrastructure and defense batteries, while its manufacturing disclosures distinguish historical validation output from stated site capacity. Independent reporting documents workforce reductions and a 2025 financing round whose size was undisclosed at publication; the assigned evidence does not establish current factory utilization, liquidity, legal posture, or counterparty concentration.
sections:
  - id: execution-and-operations
    title: Execution and operating exposure
    body: >-
      The central execution risk is whether ONE can convert its stated move away from
      passenger-EV investment into repeatable infrastructure and defense production.
      ONE announced that pivot in January 2026, while its manufacturing page's concrete
      operating milestone is a 10 MWh customer-validation line reported in October
      2023; the same page describes 20 GWh of site capacity, not demonstrated output.
      Its 2023 plan to scale after validation is a historical target, not evidence that
      the ramp occurred.       Its October 2026 newsroom headline about an Army technology competition
      is a positive signal but does not disclose order value, delivery, or repeat use.
      Workforce reports add execution uncertainty: one data page records 29 workers
      across one January 2026 WARN notice, while a separate undated-in-text article
      reports a 37-job reduction including 24 Michigan positions. These counts are
      not additive or safely comparable without event dates and employer records.
    claimRefs: [CR001, CR002, CR003, CR005, CR007, CR008, CR009, CR012]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: legal-and-regulatory
    title: Legal, regulatory, and compliance exposure
    body: >-
      The available evidence supports a legal-process check, not a finding of
      noncompliance. The Department of Labor describes federal WARN coverage for
      generally covered employers with 100 or more employees and qualifying events
      affecting 50 or more employees at one site, with at least 60 calendar days'
      notice and specified exceptions. The 29-person notice reported by WarnTracker
      alone does not establish whether the statute applied, whether other events or
      sites matter, or whether notice was adequate; state requirements may also
      differ. The supplied sources do not establish ONE's current operating permits,
      product certifications, environmental or safety compliance, litigation,
      enforcement, privacy controls, or security incidents. The FTC material
      describes general business security obligations, not an allegation about ONE.
      Those statuses should remain open diligence items rather than be inferred from
      silence in this pool.
    claimRefs: [CR008, CR010, CR014, CR016]
    tableRefs: [TR001]
  - id: dependencies-and-monitoring
    title: Dependencies, financial resilience, and monitoring
    body: >-
      Supply-chain and capital risks remain conditional because the company-level
      exposure is not quantified. ONE says it intends to process materials in-house
      and prioritize North American inputs, and says it works with partners, but the
      cited manufacturing page names no supplier, allocation, or concentration.
      Energy-Storage.news reported a May 2024 tariff schedule that anticipated a
      25% rate on non-EV lithium-ion batteries in 2026; this is dated policy context,
      not verification of the rule in force on this report date or of ONE's import
      mix. TechCrunch reported on March 6, 2025 that the size of a newly closed round
      had not been disclosed at publication. Neither that historical account nor
      the prior $300 million Series B establishes current cash, burn, debt, or
      financing runway. Track delivered systems, factory utilization, customer and
      supplier concentration, current financing terms, and documented compliance
      milestones; set quantitative tripwires only after management supplies current
      baselines and contractual thresholds.
    claimRefs: [CR004, CR011, CR012, CR013, CR015, CR016]
    tableRefs: [TR003]
tables:
