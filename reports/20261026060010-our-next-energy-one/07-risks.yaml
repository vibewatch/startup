    title: Regulatory / legal risk register
    columns: ["Risk / requirement", "Evidence and status", "Likelihood / severity", "Mitigation maturity / residual exposure", "Diligence path"]
    rows:
      - ["WARN notice applicability", "DOL describes generally covered employers with 100+ employees and qualifying layoffs of 50+ at one site, with 60 calendar days' notice; WarnTracker reports one January 2026 notice covering 29 workers at ONE. Applicability and compliance are undetermined.", "Likelihood unknown; high severity if a covered event lacked required notice.", "No company-specific notice review in the pool; residual exposure unknown.", "Obtain the underlying notice, establishment headcount, event chronology, notice recipients, and Michigan-specific counsel review."]
      - ["Operating permits, product certifications, environmental and safety approvals", "No current company-specific approval, inspection, or certification record is established by the assigned sources.", "Likelihood unknown; high impact if a required approval blocks production or delivery.", "Mitigation and residual exposure not evidenced.", "Review site permits, product certifications, environmental obligations, safety testing, inspections, and any open corrective actions."]
      - ["Litigation, enforcement, and intellectual-property disputes", "The assigned pool contains no company-specific docket or enforcement record; this is an evidence gap, not evidence that no matter exists.", "Likelihood unknown; impact depends on matter and remedy.", "No case-specific mitigation evidence; residual exposure unknown.", "Search court and regulator dockets and obtain counsel's litigation, IP, and claims schedule."]
      - ["Privacy and cybersecurity compliance", "FTC guidance describes security duties tied to the nature of data held and privacy promises; it does not report a ONE incident or assess ONE's controls.", "Likelihood unknown; potentially material impact if sensitive data or connected products are exposed.", "ONE-specific controls and incident history are not established.", "Request data inventory, security assessments, incident history, response plan, and applicable customer or defense requirements."]
    notes: "Partial public-source register, not a complete docket or permit review; likelihoods are unscored where evidence is absent, and severity is conditional analyst judgment."
    enumerationScope:
      coverage: partial
      basis: "Assigned public-source pool and general federal guidance; no complete permit, court, or regulator-docket search was supplied."
    claimRefs: [CR008, CR010, CR014, CR016]
  - id: TR002
    title: Operational, quality, and workforce risk register
    columns: ["Failure mode", "Likelihood evidence", "Severity / residual exposure", "Mitigation maturity", "Unresolved gap / trigger"]
    rows:
      - ["Factory scale-up falls short of the post-pivot plan", "Unknown; ONE reported a 10 MWh validation line in October 2023 and describes 20 GWh site capacity, but no current utilization or output is supplied.", "High strategic impact; current residual exposure cannot be quantified.", "Phased validation was described; completion and current milestones are unverified.", "Obtain monthly output, yield, utilization, qualification, and delivery data; investigate missed management-approved milestones."]
      - ["Pivot does not convert into delivered infrastructure or defense systems", "The January 2026 pivot is company-announced; the October 2026 Army competition headline does not quantify orders or deliveries.", "High; weak conversion could leave the new focus without validated demand.", "Portfolio focus is visible, but customer acceptance and repeat-order controls are not shown.", "Verify contract status, production qualification, delivery acceptance, revenue recognition, and repeat orders."]
      - ["Workforce reductions impair execution or signal resource stress", "WarnTracker reports 29 workers across one January 2026 notice; EVmagz reports 37 jobs, including 24 in Michigan, without a publication date in fetched text.", "Material; events and periods may differ, so totals and present staffing are unknown.", "EVmagz quotes a company explanation about refocusing functions; current staffing and retention evidence are absent.", "Reconcile dated notices and functions affected; monitor critical-role vacancies, retention, and production staffing."]
      - ["LFP performance trade-off limits application fit", "ONE describes LFP as less energy-dense and says system design aims to use pack space differently; independent performance data is not in the pool.", "Application-dependent; range, mass, safety, and cost trade-offs could constrain qualification.", "Company describes design intent, not independently validated performance or reliability.", "Request customer qualification results, cycle-life and safety test protocols, warranty data, and use-case-specific performance."]
    notes: "Evidence dates and denominators are retained as reported; qualitative severity and triggers are analyst framing, not measured probabilities or verified operating results."
    claimRefs: [CR001, CR002, CR003, CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner, supply-chain, and financial dependency register
    columns: ["Dependency", "Counterparty / concentration evidence", "Failure scenario and severity", "Mitigation evidence", "Residual exposure / diligence path"]
    rows:
      - ["Battery materials and cell inputs", "ONE says it plans in-house material processing and North American sourcing; named suppliers, sourcing shares, and qualified alternates are not disclosed in this pool.", "Input shortage, quality failure, or cost shock could delay ramp; severity high if single-source exposure exists.", "Vertical integration and local sourcing are company-stated intentions, not verified supplier coverage.", "Obtain bill of materials, supplier list, geographic and volume shares, qualification status, and second-source plans."]
      - ["Manufacturing and commercial partners", "ONE says it works with key partners for commercial and consumer applications but the cited page names no counterparties or allocation.", "A partner delay or loss could constrain pack production or customer delivery; concentration is unknown.", "No contract protections, alternatives, or dependency limits are evidenced.", "Map partner roles, capacity reservations, termination rights, quality remedies, and replacement lead times."]
      - ["Customer orders and demand conversion", "The assigned sources do not quantify current named customers, backlog, delivered systems, or repeat orders.", "Weak conversion or concentration could undermine the pivot and factory economics.", "The Army competition headline is not evidence of a contract or delivery; mitigations remain unverified.", "Reconcile signed orders, cancellation terms, concentration, delivery acceptance, and repeat purchasing."]
      - ["Trade policy and imported battery exposure", "Energy-Storage.news (2024-05-14) described a then-announced increase for non-EV lithium-ion batteries from 7.5% to 25% in 2026; current applicability and ONE's import mix are unknown.", "Tariff or sourcing changes could raise costs or delay inputs if exposed; company-specific impact is unquantified.", "ONE states a North American sourcing priority; actual origin shares and qualifying status are not established.", "Confirm current tariff treatment by product code, origin, and contract; quantify exposed spend and substitution lead time."]
    notes: "Counterparty concentration, costs, and current policy application are not quantified in the assigned evidence; failure impacts are conditional."
    claimRefs: [CR004, CR011, CR013, CR015, CR016]
