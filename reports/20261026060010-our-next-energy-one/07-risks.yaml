    claimRefs: [CR001, CR003, CR004, CR008, CR010, CR011, CR013, CR016]
callouts:
  - calloutType: risk
    title: Do not treat stated capacity as proven scale
    body: ONE's page reports a 10 MWh validation line in 2023 and describes 20 GWh of site capacity, but the assigned evidence does not show current utilization, yield, or delivered volume. Underwrite the ramp only against current operating data and customer acceptance.
    claimRefs: [CR002, CR003, CR005]
