schemaVersion: "report-v2"
artifact: product-tech
slug: cedar
runDate: 2026-10-25
company:
  name: Cedar
chapter:
  number: 5
  title: Product & Technology
  summary: Cedar has evolved from patient billing software into an AI-driven financial-engagement platform spanning billing, payments, coverage, support, and voice automation. Public evidence supports a broad integration and data foundation, but the technical maturity of the underlying architecture, production reliability, and security controls remains only partly disclosed.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: Cedar's product is positioned as a provider-facing financial-engagement layer that connects patient billing, payment, coverage, affordability, and support workflows. Its public surface describes pre-visit payments, post-visit billing and communications, payment and financing options, Medicaid and ACA enrollment, denials resolution, call-center servicing, and early-out services. The workflow starts with provider and patient data, then uses personalized communications and payment options to move a patient toward a resolution. This is more specific than a generic patient portal because the system is designed around financial actions and revenue-cycle operations. The public evidence supports the product category and major workflow surfaces, but it does not expose implementation specifications, service-level objectives, or a complete product SKU boundary.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-and-data
    title: Architecture, intelligence, and operating model
    body: The disclosed architecture is a layered operating model rather than a complete technical diagram. Cedar Intelligence is described as combining healthcare financial data with learning models that adapt interactions and optimize channels; Kora adds voice and two-way text agents that integrate with an existing EHR, telephony, and call-center environment. An external technology profile identifies React, TypeScript, Python, Django, Go, Kotlin, PostgreSQL, Snowflake, dbt, Airflow, Fivetran, and Kafka, while also reporting an active data-foundation rebuild and observability work. A refresh-recovered Built In profile adds only a limited workforce-development signal through training, conference, and certification benefits. Those signals are useful for diligence, but they do not verify a system-of-record design or production architecture.
    claimRefs: [CE005, CE006, CE007, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-proof
    title: Maturity, deployment, and measurable proof
    body: "Cedar's strongest product-maturity evidence is operational: Kora reported nearly 400,000 patient calls after one year, adoption by ten provider organizations, and use cases spanning authentication, balance inquiries, insurance capture, explanations, outbound collections, and Spanish-language support. A later 2026 launch reported more than 600,000 automated inbound conversations, 40% inbound containment, a 7.4% increase in patients attempting payment versus live agents, and a 20% outbound pickup rate. A provider case cited 60,000 calls at Gastro Health, a 24% reduction in live-agent handle time, and a 22% reduction in call-center staffing. These are company-reported or company-issued release metrics, not independently audited benchmarks, but they show movement beyond roadmap language toward production workflows with measurable operating outcomes."
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
  - id: differentiation-and-controls
    title: Differentiation, dependencies, and control gaps
    body: Cedar's differentiation rests on healthcare-specific interaction data, workflow context, and integration into provider environments rather than on a disclosed proprietary model architecture. The company says Cedar Intelligence analyzes more than 80 patient attributes and that Kora is grounded in human-in-the-loop servicing, regression-tested guardrails, and closed-loop optimization. The Kora launch also says the platform is scoped to patient billing, supports opt-out, routes clinical or out-of-scope matters to humans, and runs within a privacy and security program audited against HITRUST and PCI DSS. These assertions reduce obvious trust concerns, but the public record does not provide audit reports, control scopes, incident history, model-evaluation results, uptime commitments, or detailed data-retention and subprocessor terms. EHR, telephony, and call-center integrations are material dependencies, and the external hiring signal points to tightly coupled payments and weak observability as execution risks.
    claimRefs: [CE015, CE016, CE017, CE019]
    callouts:
      - calloutType: strength
        title: Workflow-specific AI is the product wedge
        body: Cedar's defensibility is more plausibly in healthcare financial data, workflow integration, and operational feedback loops than in a uniquely disclosed foundation model.
        claimRefs: [CE005, CE015, CE016]
      - calloutType: risk
        title: Technical diligence remains incomplete
        body: Public sources do not establish production reliability, control scope, incident history, or the degree to which the reported data and model layer is portable across provider environments.
        claimRefs: [CE007, CE017, CE019]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, Primary user, Status or maturity, Differentiation, Diligence gap]
    rows:
      - [Pre-visit payments and registration, Provider revenue-cycle team and patient, "Live product surface", "Moves financial engagement before care and can use insurance information", "Deployment coverage and realized payment lift by customer"]
      - [Post-visit billing and communications, Patient and provider billing team, "Live product surface", "Unifies bill communication with payment and support actions", "Workflow configuration and service-level performance"]
      - [Cedar Intelligence, Provider operating team, "Launched capability", "Uses healthcare-specific interaction and financial signals to personalize journeys", "Model evaluation, drift monitoring, and audit evidence"]
      - [Kora Platform, Patient and call-center team, "Production deployment and expansion", "Voice, outbound voice, and two-way text for billing resolution", "Tenant isolation, escalation quality, and uptime by workflow"]
      - [Cedar Cover and affordability workflows, Patient and financial-assistance team, "Named solution surface", "Connects coverage, assistance, and payment pathways", "Eligibility accuracy and partner dependency"]
    notes: Product status reflects public company pages and releases; "live product surface" does not establish that every module is deployed for every customer.
    claimRefs: [CE001, CE003, CE006, CE010, CE015]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Cedar solution, Measurable benefit or signal, Limitation]
    rows:
      - [Understand a balance, Patient receives a static or confusing bill, Bill Navigator and explain-my-bill interactions, "Clear explanations are a stated product function", "No independent comprehension benchmark"]
      - [Make a payment, Patient chooses a payment or financing path, Digital payments and payment-plan options, "Cedar reports processed payment volume and payment-attempt lift", "Public metrics are company reported"]
      - [Update coverage, Patient supplies insurance information, Insurance capture and eligibility checks, "Included in Kora use cases", "Accuracy and exception handling are undisclosed"]
      - [Resolve a denial, Patient or staff works through coordination-of-benefits steps, Kora can guide COB denial resolution and escalation, "Workflow is explicitly described", "No public end-to-end resolution rate"]
      - [Handle inbound billing calls, Call-center team answers repetitive questions, Autonomous inbound voice with human escalation, "40% inbound containment reported for Kora", "Containment definition and sample are not independently verified"]
      - [Reach hard-to-contact patients, Provider initiates collections or insurance outreach, Autonomous outbound voice and two-way text, "20% pickup rate and 21% relative payment-rate increase reported", "No cohort design or control group disclosed"]
    notes: Rows separate product workflow from outcome claims; reported benefits are not independent validation and may differ by customer configuration.
    claimRefs: [CE003, CE010, CE011, CE012, CE013, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Provider data and EHR integrations", "Supplies encounter, coverage, and billing context", "Epic, Cerner, Athena, and eClinicalWorks are publicly named", "Interface-version coverage and reconciliation controls"]
      - ["Financial data foundation", "Supports patient and payment analytics", "Snowflake, dbt, Airflow, Fivetran, and Kafka are externally reported", "Data lineage, freshness, and migration completion"]
      - ["Personalization and decisioning", "Selects channel, timing, tone, and resolution path", "Cedar Intelligence and healthcare interaction data", "Bias, explainability, drift, and human override"]
      - ["Digital engagement", "Delivers bills, payment options, coverage, and assistance", "Provider and patient channels", "Identity, consent, localization, and accessibility"]
      - ["Voice and text agents", "Resolves routine financial questions and payment actions", "Existing telephony and call-center systems", "Latency, transcript controls, escalation, and failure modes"]
      - ["Human-in-the-loop controls", "Handles clinical or out-of-scope matters", "Provider staff and Cedar servicing expertise", "Escalation completeness and auditability"]
    notes: Architecture rows combine directly disclosed interfaces and externally inferred technology signals; the public record does not establish a complete reference architecture.
    claimRefs: [CE005, CE006, CE007, CE015, CE016, CE019]
