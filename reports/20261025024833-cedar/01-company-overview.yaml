callouts:
  - calloutType: strength
    title: Product breadth is expanding around a coherent financial workflow
    body: Cedar has extended from bill presentation and payment into coverage access, denials resolution and agentic servicing, creating a broader patient-financial workflow while integrating with existing provider systems.
    claimRefs: [CO002, CO003, CO004]
  - calloutType: risk
    title: Current financial quality is not publicly established
    body: The assigned evidence does not disclose current revenue, ARR, margins, cash flow, debt or a verified cap table, and reported financing totals differ across sources.
    claimRefs: [CO010, CO011, CO015]
  - calloutType: recommendation
    title: Treat scale metrics as directional until reconciled
    body: Company-reported interaction, patient and payment figures are useful signals of scale, but their changing denominators and limited independent corroboration require a current management data room before underwriting.
    claimRefs: [CO002, CO004, CO012, CO013]
