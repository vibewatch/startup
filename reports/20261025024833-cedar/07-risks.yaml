  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: security-disclosure
      missingEvidence: >-
        Independent audit scope, exceptions, control-test results, breach history, and incident-response performance for
        Cedar’s patient-financial platform.
      whyItMatters: >-
        Certification labels alone do not show whether integrated AI, payment, telephony, and provider workflows are
        continuously controlled.
      diligencePath: >-
        Request current HITRUST and PCI DSS attestations, audit periods, scope diagrams, exceptions, penetration-test
        summaries, incident register, and tabletop results.
      relatedQuestionRefs:
        - QR004
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: Current burn, runway, gross margin, debt, customer concentration, renewal, and unit-economics data.
      whyItMatters: >-
        Risk capacity and downside resilience cannot be assessed from funding raised or company-reported operating
        scale.
      diligencePath: >-
        Obtain twelve-month management accounts, cash forecast, debt schedule, cohort retention, concentration report,
        and audited or reviewed financial statements.
      relatedQuestionRefs:
        - QR009
    - type: missing-source
      severity: material
      topic: partner-dependency
      missingEvidence: >-
        Contractual rights, service levels, fallback paths, and concentration by EHR, telephony, payment, and provider
        counterparty.
      whyItMatters: A failure at a key integration or customer can interrupt collection workflows and weaken the value proposition.
      diligencePath: >-
        Review top-counterparty revenue and volume shares, termination rights, API SLAs, disaster-recovery tests, and
        migration playbooks.
      relatedQuestionRefs:
        - QR002
        - QR007
      relatedTableRefs:
        - TR003
    - type: enumeration-incomplete
      severity: minor
      topic: regulatory-legal-risk-register
