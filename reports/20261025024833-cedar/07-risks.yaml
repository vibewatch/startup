        - No public drift thresholds, validation cadence, or subgroup performance.
    notes: >-
      Sources: Cedar product disclosures and independent HIPAA/vendor-risk context; risk ratings are judgments and do
      not imply that an incident occurred.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR008
      - CR011
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Failure scenario
      - Severity
      - Mitigation / residual exposure
    rows:
      - - EHR and provider systems
        - Healthcare providers and EHR vendors
        - Data and workflow integration
        - API, feed, authorization, or implementation failure blocks patient-finance workflows.
        - High
        - Existing-environment integration is claimed; contract and fallback evidence is missing.
      - - Telephony and call-center stack
        - Provider technology environment
        - Voice and escalation channel
        - Routing, identity, or availability failure prevents automated resolution.
        - High
        - Kora is designed to work alongside existing telephony; resilience metrics are not disclosed.
      - - Payment, coverage, and assistance data
        - Financial and healthcare data partners
        - Affordability and payment decisions
        - Stale or incomplete data produces wrong action or compliance exposure.
        - High
        - Review data provenance, update SLAs, consent, and correction workflows.
      - - Capital and commercial execution
        - Investors and provider customers
        - Scale, partnerships, and cash runway
        - Funding or sales-cycle pressure compresses service quality or delays deployment.
        - Medium-high
        - Current burn, runway, margin, concentration, and renewal data are not public.
    notes: >-
      Sources: Cedar, MobiHealthNews, Fierce Healthcare, and retained healthcare data-risk reporting; counterparty
      concentration and financial resilience require private diligence.
    claimRefs:
      - CR001
      - CR002
      - CR010
      - CR012
      - CR013
