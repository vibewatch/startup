callouts:
  - calloutType: risk
    title: Primary diligence blocker
    body: >-
      Cedar’s public controls narrative is meaningful, but audit scope, incident history, operating error rates, and
      financial resilience remain insufficiently disclosed for a low residual-risk conclusion.
    claimRefs:
      - CR004
      - CR005
      - CR011
      - CR013
  - calloutType: recommendation
    title: Thesis-break trigger
    body: >-
      Treat a material patient-data incident, regulator finding, qualified security audit, or inability to evidence
      sustainable unit economics as a thesis-break event until independently remediated.
    claimRefs:
      - CR008
      - CR013
      - CR014
