schemaVersion: report-v2
artifact: risks
slug: cedar
runDate: '2026-10-25'
company:
  name: Cedar
chapter:
  number: 7
  title: Risks
  summary: >-
    The public record reviewed does not establish Cedar-specific incident history; the principal identifiable exposure
    is the combination of sensitive patient-financial data, broad provider-system integrations, and expanding AI
    automation. Public evidence supports meaningful controls and operating scale, while leaving material gaps around
    audit scope, financial resilience, partner concentration, and regulator-tested outcomes.
sections:
  - id: risk-ranking
    title: Risk ranking and residual exposure
    body: >-
      The highest-consequence exposure is data and integration governance: Cedar says Kora connects to EHR, telephony,
      and call-center systems, while healthcare reporting shows that identity, permitted use, and interoperability
      disputes can become litigation or policy issues. Security maturity is a partial mitigant, not proof of low
      residual risk, because Cedar’s release names HITRUST and PCI DSS audits but the retained public text does not show
      audit scope, exceptions, control-test results, or incident history. The operating risk is amplified by automation:
      Kora’s disclosed scale and containment metrics make model behavior, escalation, logging, and human override
      important diligence items. Legal exposure is also multi-front because healthcare incidents can trigger federal,
      state, and civil responses.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR014
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: operational-security
    title: Operational, quality, and security controls
    body: >-
      Cedar’s public evidence presents a credible control narrative: the company says its AI billing platform is
      designed for healthcare financial engagement, Kora has regression-tested guardrails, and the Kora release says the
      platform is independently audited against HITRUST and PCI DSS. Those disclosures reduce—but do not
      eliminate—execution and security uncertainty. The retained sources do not establish uptime, false-positive or
      false-negative rates, complaint rates, model drift controls, penetration-test findings, breach history, or whether
      audits cover every integrated workflow. A prudent diligence posture should therefore require evidence that
      controls operate continuously across data ingestion, outbound communications, payment processing, vendor access,
      and human escalation, rather than relying on certification labels alone.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR008
      - CR011
    tableRefs:
      - TR002
  - id: dependencies-and-breaks
    title: Dependencies, financial model, and thesis-break triggers
    body: >-
      Cedar’s go-to-market and product value depend on provider integrations and partner execution. Earlier reporting
      described EHR integration and a strategy to expand provider partnerships; current releases describe a broader
      agentic platform operating inside existing technology environments. That creates implementation,
      change-management, data-quality, and counterparty risks even if the product works as described. Public material
      also leaves the financial downside case unresolved: the retained pool does not disclose burn, runway, gross
      margin, debt, or loss exposure. The practical investment implication is to treat security failure, regulator
      action, integration failure, or inability to evidence sustainable unit economics as thesis-break conditions rather
      than assuming that scale claims imply resilience.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR003
