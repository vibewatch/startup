schemaVersion: "report-v2"
artifact: customers
slug: cedar
runDate: 2026-10-25
company:
  name: Cedar
chapter:
  number: 6
  title: Customers
  summary: Cedar has disclosed broad provider adoption and several named deployments, but the strongest outcome metrics remain company-reported and cohort-level retention, concentration, and contract evidence are not public. The evidence supports real enterprise usage and expansion potential while leaving durability and customer economics as material diligence gaps.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      Cedar sells to hospitals, health systems, medical groups, and physician practices, while the end users are patients and revenue-cycle teams. The company describes a platform spanning billing, payments, coverage, financial assistance, and support; this creates a two-sided value proposition in which providers seek collections and operating efficiency while patients seek clarity, affordability, and lower friction. Public evidence identifies both large integrated systems and physician-led groups, including Sanford Health, Novant Health, ApolloMD, Unio Health Partners, U.S. Anesthesia Partners, and Consensus Health. The segmentation is credible at the organizational level, but the public record does not disclose customer-level contract values, pricing, payer mix, or revenue contribution by segment.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and customer outcomes
    body: >-
      Cedar's disclosed adoption indicators show meaningful scale, although they are not interchangeable measures. A 2026 Cedar release says the platform has supported more than 63 million patients and processed more than 13.6 billion dollars in payments, while an earlier customer release described more than 50 million patients and more than 10 billion dollars processed. The changing figures suggest continued expansion, but the company does not provide a reconciled time series, active-account denominator, or independently audited cohort definition. Named customer material supplies stronger deployment evidence: Sanford announced an implementation across its network, the American Hospital Association described a Novant case study, and Cedar reported athenaOne practices seeing results in as little as eight weeks. Reported ROI, satisfaction, self-service, containment, and payment-rate metrics are useful signals but remain mostly company-reported and may reflect selected customers or specific workflows.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: retention-expansion-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The public evidence supports a land-and-expand motion from payment and billing workflows into pre-visit registration, coverage, financial assistance, call-center servicing, and AI voice or text interactions. Cedar says it connects more than 200 healthcare and financial partners and integrates with existing provider systems, while Kora is described as already in use with ApolloMD. Those statements establish product breadth and deployment intent, not renewal or net expansion. No assigned source discloses NRR, GRR, logo churn, renewal rates, contract lengths, customer concentration, or the share of revenue from the largest health systems. The customer set is also exposed to procurement and implementation friction: enterprise healthcare deployments involve EHR, telephony, compliance, and revenue-cycle dependencies. The appropriate underwriting stance is therefore real adoption with unproven durability; diligence should request cohort retention, top-10 concentration, implementation timelines, expansion attach rates, and customer references that can verify production use.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Evidence of enterprise deployment
    body: Named health-system and physician-group deployments, including Sanford, Novant, ApolloMD, and athenaOne practices, are stronger than logo-only marketing and indicate that Cedar is used in live patient-financial workflows.
    claimRefs: [CU003, CU007, CU008]
  - calloutType: risk
    title: Retention is not publicly demonstrated
    body: The assigned evidence does not disclose NRR, GRR, churn, renewal rates, contract duration, or customer concentration, so adoption scale cannot yet be converted into a durable recurring-revenue conclusion.
    claimRefs: [CU011, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation
    columns: [Segment, Buyer or payer, User and use case, Public scale or value signal, Diligence gap]
    rows:
      - [Large health systems, Provider enterprise, Patients and revenue-cycle teams using billing/payment workflows, Sanford serves over 2.4 million patients and selected Cedar for its network, "Contract value, production scope, and renewal status are undisclosed"]
      - [Rural integrated systems, Provider enterprise, Patients needing transparent bills and payment plans, Sanford described a network-wide Cedar Pay implementation, "Measure adoption by facility and rural-market cohort"]
      - [Physician groups, Provider enterprise, Patients and support staff using patient-financial engagement, athenaOne partners reported 3x ROI and 87% satisfaction, "Verify denominator, customer selection, and recurring expansion"]
      - [Patients, "End user and source of payment", "Billing, coverage, assistance, and payment resolution", "Cedar says patients are a growing payment source and has processed billions in payments", "Active-user rate, payment conversion, and affordability outcomes are not independently disclosed"]
    notes: Customer segments and signals are drawn from Cedar, customer announcements, and reported case material; public sources do not disclose segment revenue or contract economics.
    claimRefs: [CU001, CU003, CU007, CU014]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source posture, Implication, Missing denominator or qualification]
    rows:
      - [Patients supported, "more than 63 million", 2026, company-claimed, Indicates large cumulative reach, "Cumulative is not active customers or current utilization"]
      - [Payments processed, "more than $13.6 billion", 2026, company-claimed, Indicates material transaction scale, "Cumulative value is not Cedar revenue or current run rate"]
      - [Earlier patient journeys disclosed, "more than 50 million", 2025 or earlier, company-claimed, Provides an earlier cumulative scale reference, "Not reconciled to the later 63 million patient figure"]
      - [Kora inbound conversations, "more than 600,000", 2026, company-claimed, Shows early AI workflow volume, "No customer-by-customer or retention cohort disclosed"]
      - [Kora inbound containment, "40%", 2026, company-claimed, Suggests automation potential for call centers, "Workflow and customer mix are not disclosed"]
      - [Athena partner ROI, "3x average", 2026, company-claimed, Suggests economic value for selected physician groups, "No methodology, baseline, or independent verification"]
    notes: Values are reported in assigned sources and use the source's own periods and qualifiers; they are not a comparable funnel and are not converted into rates beyond explicitly reported rates.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production versus pilot signal, Outcome signal, Limitation]
    enumerationScope:
      coverage: partial
      basis: Publicly named Cedar customer and partner examples found in assigned 2025-2026 source pool
    rows:
      - [Sanford Health, "Rural integrated health system", "Cedar Pay across an extensive network", "announced implementation", "Payment-plan, HSA, and plain-language workflow goals", "Announcement does not report post-launch retention or measured outcomes"]
      - [Novant Health, Health system, Patient financial experience case study, case study reports a 12-month improvement period, Patient satisfaction and payment experience improvement are described, "Public excerpt does not provide full baseline or cohort denominator"]
      - [ApolloMD, Physician-led provider group, Kora AI voice support and billing workflows, already in use according to independent trade coverage, Meaningful measurable impact claimed; Cedar release reports 4/5 post-call satisfaction for Kora overall, "Customer-specific performance and contract status are not disclosed"]
      - [Unio Health Partners, Physician group, Cedar integrated with athenaOne, customer release describes deployment, 3x average ROI and 87% satisfaction across athena partners, "Selected-partner average; no independent audit or retention data"]
    notes: This is a partial public enumeration, not a complete customer list; each row combines named deployment evidence with a second source where available, but outcome attribution remains qualified.
    claimRefs: [CU003, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey from deployment to expansion
    type: journey-map
    summary: Cedar's public customer evidence traces a path from enterprise implementation to patient-facing payment workflows and potential AI-led expansion, while retention proof remains unresolved.
    data:
      nodes:
        - id: enterprise-selection
          label: Enterprise selection
          details: Provider evaluates patient-financial engagement, integration burden, and expected collection or experience gains.
          touchpoints: [Health-system or physician-group procurement, EHR and revenue-cycle integration]
        - id: workflow-deployment
          label: Workflow deployment
          details: Cedar Pay and related billing, coverage, assistance, or pre-visit workflows are configured for the provider.
          touchpoints: [Sanford implementation, Novant case evidence, athenaOne integration]
        - id: patient-engagement
          label: Patient engagement
          details: Patients receive bills, payment options, assistance pathways, and support across digital and voice channels.
          touchpoints: [Payments, payment plans, coverage, financial assistance, Kora support]
        - id: operating-outcomes
          label: Operating outcomes
          details: Public customer material reports satisfaction, ROI, self-service, containment, or payment-rate signals.
          touchpoints: [3x ROI, 87% satisfaction, 83% self-service, 40% Kora containment]
        - id: expansion-and-renewal
          label: Expansion and renewal
          details: Additional modules and channels could expand account value, but renewal and cohort evidence are not public.
          touchpoints: [Pre-visit, denials, outbound voice, two-way text, retention diligence]
        - id: diligence-proof
          label: Diligence proof
          details: Investor underwriting requires cohort, concentration, and customer-reference evidence beyond public announcements.
          touchpoints: [NRR and GRR, top-10 concentration, renewal dates, production references]
    claimRefs: [CU003, CU007, CU008, CU009, CU010, CU011]
