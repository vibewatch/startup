  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer financial workflows create provider outcomes, but public evidence does not disclose Cedar’s revenue take
      or margin conversion.
    data:
      nodes:
        - id: n1
          label: Provider contract
          detail: Enterprise platform relationship; price and term undisclosed
        - id: n2
          label: Patient financial workflows
          detail: Billing, payments, coverage, affordability and support
        - id: n3
          label: Payment and resolution activity
          detail: Cedar reports interaction, patient and payment-volume metrics
        - id: n4
          label: Provider outcomes
          detail: Collections, reimbursement, administrative burden and satisfaction claims
        - id: n5
          label: Cedar revenue
          detail: Subscription is reported by a third-party profile; amount and take rate undisclosed
        - id: n6
          label: Gross profit / cash generation
          detail: Margin, burn and runway not publicly disclosed
      edges:
