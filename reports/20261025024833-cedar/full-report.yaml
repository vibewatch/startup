chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product and operating model
        blocks:
          - type: paragraph
            body: >-
              Cedar was launched in 2016 to improve the patient financial experience, initially focusing on clearer
              medical bills and digital payment workflows. Its current platform spans pre-visit and post-visit
              engagement, bill explanation, payment and financing options, Medicaid and ACA enrollment, denials
              resolution, and AI-assisted servicing. Cedar's own site describes 1.3 billion patient payment
              interactions, 58 million patients served and $13.6 billion in payments processed, while its August 2026
              Kora announcement uses a different, later set of figures: more than 1.5 billion interactions, 63 million
              patients and $13.6 billion in payments. These are company-reported metrics with differing denominators and
              should not be silently reconciled. The platform integrates with existing EHR, telephony and call-center
              systems rather than replacing the provider's system of record. A third-party review describes the
              trade-off clearly: Cedar's ROI depends on provider implementation and patient adoption, and the product
              remains specific to healthcare administration.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Founders, leadership and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies Florian Otto, M.D., Ph.D. as Cedar's co-founder and CEO and links the company's
              founding thesis to his experience with confusing healthcare billing and prior operating experience at
              Zocdoc. A ToolDirectory profile also identifies Arel Lidow as a co-founder and describes prior experience
              at Bridgewater and AppNexus, but the assigned pool contains no second independent source that confirms
              Lidow's current role or background. Cedar's public materials emphasize provider-facing leadership voices,
              including Chief Strategy Officer Dugan Winkie in the Kora announcement, while Healthcare Innovation
              reports that health-system AI committees, security teams and CIOs typically vet agentic deployments. This
              suggests implementation governance is material to Cedar's execution, but the pool does not establish a
              complete board, executive roster, succession plan or current key-person mitigation. Founder dependence and
              governance should therefore remain an explicit diligence item rather than an inferred strength.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Financing, scale and milestone record
        blocks:
          - type: paragraph
            body: >-
              Cedar's financing history is not fully consistent across the assigned sources. Fierce Healthcare reports a
              $200 million Series D led by Tiger Global at a $3.2 billion valuation, following a $102 million Series C,
              and says total funding had reached $350 million at that time. Multiples.vc reports a later $68 million
              December 2022 Series D extension led by Memorial Hermann Foundation and a $3.2 billion valuation, while
              its page also presents a different total-funding figure and describes the underlying rounds. Because the
              sources use different round conventions and are not filings, the chapter preserves the discrepancy instead
              of selecting a single lifetime-raised number. Cedar's operating footprint is better evidenced
              directionally: Fierce reported more than 35 provider partners and more than 300,000 patients engaged daily
              in the 2021 financing context; later company materials claim more than 50 million or 63 million patients
              served cumulatively. Cedar's 2026 Kora launch and its Cedar Cover expansion show product broadening, but
              current revenue, margin, cash balance, debt and cap-table details are not disclosed in the pool.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
