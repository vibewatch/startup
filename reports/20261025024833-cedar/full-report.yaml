      - CE006
      - CE015
      - CE016
      - CE017
  - id: FU001
    title: Customer journey from deployment to expansion
    type: journey-map
    summary: >-
      Cedar's public customer evidence traces a path from enterprise implementation to patient-facing payment workflows
      and potential AI-led expansion, while retention proof remains unresolved.
    data:
      nodes:
        - id: enterprise-selection
          label: Enterprise selection
          details: >-
            Provider evaluates patient-financial engagement, integration burden, and expected collection or experience
            gains.
          touchpoints:
            - Health-system or physician-group procurement
            - EHR and revenue-cycle integration
        - id: workflow-deployment
          label: Workflow deployment
          details: Cedar Pay and related billing, coverage, assistance, or pre-visit workflows are configured for the provider.
          touchpoints:
            - Sanford implementation
            - Novant case evidence
            - athenaOne integration
        - id: patient-engagement
          label: Patient engagement
          details: Patients receive bills, payment options, assistance pathways, and support across digital and voice channels.
          touchpoints:
            - Payments
            - payment plans
            - coverage
            - financial assistance
            - Kora support
        - id: operating-outcomes
          label: Operating outcomes
          details: Public customer material reports satisfaction, ROI, self-service, containment, or payment-rate signals.
          touchpoints:
            - 3x ROI
            - 87% satisfaction
            - 83% self-service
            - 40% Kora containment
        - id: expansion-and-renewal
          label: Expansion and renewal
          details: Additional modules and channels could expand account value, but renewal and cohort evidence are not public.
          touchpoints:
            - Pre-visit
            - denials
            - outbound voice
            - two-way text
            - retention diligence
        - id: diligence-proof
          label: Diligence proof
          details: >-
            Investor underwriting requires cohort, concentration, and customer-reference evidence beyond public
            announcements.
          touchpoints:
            - NRR and GRR
            - top-10 concentration
            - renewal dates
            - production references
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
