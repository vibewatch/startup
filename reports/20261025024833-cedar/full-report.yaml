  - id: FE001
    title: Cedar product architecture map
    type: stack
    summary: >-
      Cedar combines provider data interfaces, a financial intelligence layer, engagement channels, and human or
      provider operations.
    data:
      layers:
        - label: Data interfaces
          detail: Provider and practice-management connections supply the operating context.
          items:
            - label: EHR and practice-management feeds
              detail: Epic, Cerner, Athena, and eClinicalWorks are named integration surfaces.
        - label: Financial context
          detail: Coverage, claims, patient-account, and payment information support financial workflows.
          items:
            - label: Coverage and payment context
              detail: Insurance, claims, patient-account, and payment information support financial workflows.
        - label: Intelligence layer
          detail: Healthcare-specific financial data and learning models support personalization.
          items:
            - label: Cedar Intelligence
              detail: Personalization and decisioning across financial-engagement journeys.
        - label: Agent orchestration
          detail: Kora coordinates automated financial conversations across supported channels.
          items:
            - label: Kora orchestration
              detail: Coordinates inbound voice, outbound voice, and two-way text agents.
        - label: Digital resolution
          detail: Patient-facing billing, payment, coverage, and affordability pathways.
          items:
            - label: Digital billing and payments
              detail: Bill explanation, payment, financing, coverage, and affordability paths.
        - label: Conversational resolution
          detail: Voice and text agents support routine questions, capture, collections, and payment actions.
          items:
            - label: Voice and text conversations
              detail: Billing questions, insurance capture, collections guidance, and payment actions.
        - label: Operations and controls
          detail: Provider reporting, human escalation, and stated safety and audit controls.
          items:
            - label: Provider revenue-cycle operations
              detail: Reporting, workflow tracking, and human escalation.
        - label: Guardrails and auditability
          detail: Human-in-the-loop handling, opt-out, and scoped escalation are publicly described.
          items:
            - label: Guardrails and auditability
              detail: Company describes human-in-the-loop controls, opt-out, and scoped escalation.
