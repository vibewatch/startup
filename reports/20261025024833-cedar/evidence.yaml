evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR or revenue, gross margin, EBITDA, cash flow, cash balance, debt and runway.
    whyItMatters: >-
      The company is privately held and reported valuation figures cannot be assessed against current financial quality
      without operating data.
    diligencePath: >-
      Request current management accounts, KPI bridge, cash and debt schedule, budget versus actuals, and a
      capitalization table under NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A dated definition and reconciliation for patients served, patient interactions, payments processed and provider
      counts.
    whyItMatters: Changing denominators can materially change the interpretation of growth, penetration and customer traction.
    diligencePath: Obtain a metric dictionary and monthly cohort bridge separating cumulative, annual and current-period measures.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current executive, board and founder-involvement roster.
    whyItMatters: Leadership depth and key-person dependence affect execution risk and governance assessment.
    diligencePath: >-
      Request the current organization chart, board composition, committee responsibilities and succession planning
      materials.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: Independent current evidence on litigation, regulatory issues, outages and security incidents.
    whyItMatters: >-
      The assigned pool contains an adverse product review but does not provide a comprehensive current adverse-event
      search result.
    diligencePath: >-
      Run a dedicated current legal, regulatory, outage and security review using primary registries and reputable
      reporting.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Cedar-specific annual contract values, eligible-provider counts, pricing, retention, expansion, win rates, and
      customer segmentation needed to calculate SAM and SOM.
    whyItMatters: >-
      Without these inputs, broad RCM estimates cannot be converted into an attainable revenue opportunity or a
      defensible valuation growth ceiling.
    diligencePath: >-
      Request anonymized contract cohorts, pricing schedules, customer counts by segment, renewal and expansion data,
      pipeline conversion, and management's bottom-up market model.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-uncertainty
    missingEvidence: >-
      A reconciled crosswalk between publisher definitions, included services, regional scope, and revenue-recognition
      methods.
    whyItMatters: >-
      The retained 2026 estimates differ by roughly 4.6x, so an unqualified headline TAM would materially overstate
      precision.
    diligencePath: >-
      Obtain full methodologies from both publishers and rebuild a common-scope U.S. provider
      patient-financial-engagement denominator.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Independent customer evidence for budget ownership, implementation cost, realized collection lift,
      cost-to-collect, and payback by provider segment.
    whyItMatters: >-
      Company-issued portfolio averages do not establish the distribution, durability, or causality of customer
      outcomes.
    diligencePath: >-
      Interview reference customers across health systems and physician groups and reconcile outcomes to contracts,
      baseline cohorts, and implementation invoices.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable Cedar contract prices, implementation fees, discounts, and net collections after vendor fees by
      customer segment.
    whyItMatters: >-
      The adverse KLAS cost-to-collect result could reflect pricing rather than product weakness, and buyers cannot
      compare Cedar with transparent-priced alternatives from public evidence.
    diligencePath: >-
      Request anonymized contract bands, implementation statements of work, realized payment rates, cost-to-collect, and
      customer-level ROI cohorts.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: >-
      Independent retention, win-loss, integration-depth, and competitive displacement data for Cedar versus EHR-native
      and broad RCM alternatives.
    whyItMatters: >-
      Company-reported scale and product breadth do not establish switching costs or durable share against native
      distribution.
    diligencePath: >-
      Obtain customer reference calls, renewal and churn cohorts, competitive win-loss reports, and implementation
      timelines by EHR.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: minor
    topic: internal-build
    missingEvidence: >-
      Customer-level comparison of Cedar with internal build and status-quo workflows using the same population, period,
      and cost definitions.
    whyItMatters: >-
      The status quo may be slower and labor-intensive, but the assigned pool does not quantify the counterfactual
      economics.
    diligencePath: >-
      Request a controlled before-and-after or matched-customer analysis separating labor, vendor fees, collections, and
      patient-experience outcomes.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: blocking
    topic: private financial gaps
    missingEvidence: Current ARR or revenue run rate, gross margin, EBITDA, operating cash flow, cash on hand, burn, and runway.
