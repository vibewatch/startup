schemaVersion: "report-v2"
artifact: competitors
slug: cedar
runDate: 2026-10-25
company:
  name: Cedar
chapter:
  number: 3
  title: Competitors
  summary: Cedar competes in patient financial engagement against EHR-native suites, broad RCM platforms, specialist payment and assistance vendors, and internal or manual workflows. Current evidence supports strong product breadth and rapid AI expansion, but independent evidence also flags Cedar's pricing impact on cost-to-collect and limited reporting, leaving differentiation durable only where its data, integrations, and execution compound.
sections:
  - id: landscape
    title: Landscape and buyer alternatives
    body: >-
      Cedar's competitive set is broader than a list of patient-payment startups. The buyer can use an EHR-native suite such as Epic, a broad RCM platform such as Waystar, a patient-payment or financial-navigation specialist, an outsourced revenue-cycle service, or an internal build layered onto existing billing and call-center systems. Black Book's 2026 category map places Epic in enterprise patient accounting, Waystar in agentic RCM, Flywire in patient-payment orchestration, FinThrive in financial navigation, and Elevate in Medicaid screening and enrollment. A separate KLAS summary evaluates Epic, RevSpring, Cedar, Flywire, and Waystar as the principal patient-financial-engagement set. This implies a fragmented buying decision: health systems may prioritize native integration and consolidation, while physician groups may prioritize speed, low IT lift, and patient-facing conversion.
    claimRefs: [CP001, CP005, CP009, CP010, CP011, CP012]
    tableRefs: [TP001]
  - id: capability-and-distribution
    title: Capability, distribution, and switching costs
    body: >-
      Cedar's claimed differentiation is a connected platform spanning pre-visit payments, post-visit billing, payment plans, coverage and Medicaid enrollment, denials resolution, call-center servicing, and AI voice. Its current site reports 1.3 billion patient payment interactions, 58 million patients served, and $13.6 billion in payments processed; its Kora launch describes integration with existing EHR, telephony, and call-center systems rather than a rip-and-replace deployment. Cedar also claims more than 200 healthcare and financial partners, while its athenaOne announcement emphasizes integration and implementation in as little as eight weeks. These integrations and accumulated interaction data can raise switching costs through workflow configuration, historical data, and learned outreach logic. However, native EHR platforms retain distribution power, and broad RCM suites can bundle patient payments with claims, denials, and clearinghouse functions. Customer proof is largely company-issued, so the magnitude of any moat remains unverified.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP007, CP010, CP011]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability-and-risks
    title: Durability, pricing pressure, and displacement risk
    body: >-
      The strongest adverse evidence is not that Cedar lacks demand, but that value capture may be weaker than product adoption suggests. KLAS reports Cedar's overall performance score at 87.7, while respondents gave it the lowest satisfaction among measured vendors for cost-to-collect impact: 6.2 on a nine-point scale versus a 7.6 market average. The same source says some customers found pricing offset efficiency gains, and cited occasional bugs and limited reporting. This creates a direct displacement risk from transparent-priced or bundled alternatives such as Flywire, Waystar, Epic, and RevSpring, especially when procurement evaluates total cost of ownership rather than patient experience alone. Cedar's agentic product expansion may improve automation, but it also increases the need for auditable controls and measurable net collections. Public sources do not disclose Cedar's realized pricing, retention, or win/loss data, so durability remains an open underwriting question.
    claimRefs: [CP009, CP010, CP011, CP013, CP014]
    tableRefs: [TP003]
callouts:
  - calloutType: insight
    title: Competitive judgment
    body: Cedar has a credible differentiation thesis in integrated patient-financial workflows and healthcare-specific data, but current evidence supports a product lead more clearly than a durable economic moat. Buyers should test net collections after vendor fees, reporting depth, implementation effort, and native-EHR substitution before assigning premium value.
    claimRefs: [CP002, CP004, CP009, CP011, CP014]
tables:
  - id: TP001
    title: Competitor profile table
    columns: [Competitor or alternative, Category, Target customer, Differentiation, Limitation or unknown]
    rows:
      - [Cedar, Patient-financial-engagement platform, Hospitals health systems and physician groups, Connected billing payments coverage support and AI, Realized pricing retention and margin are undisclosed]
      - [Epic, EHR-native patient accounting and billing, Large integrated health systems already on Epic, Native clinical and financial workflow integration, Requires Epic commitment and can be complex]
      - [Waystar, Broad cloud RCM and patient payments, Mid-to-large hospitals and physician groups, Claims denial prevention clearinghouse and payments breadth, Contract modeling depth is described as weaker than specialists]
      - [RevSpring, Patient-financial-engagement specialist, Health systems seeking best-of-breed engagement, Previsit functions text alerts and configurable reporting, Independent comparative pricing evidence is limited]
      - [Flywire, Patient-payment orchestration, Organizations prioritizing payment usability and integration, Digital wallet POS portal IVR and text-to-pay, Customer relationship concerns are reported]
      - [FinThrive, Financial navigation and modular RCM, Mid-to-large hospital networks, Modular access through back-end RCM and assistance workflows, Breadth can require multiple modules]
      - [Elevate Patient Financial Solutions, Medicaid screening and enrollment, Providers needing self-pay and charity-care assistance, Specialized eligibility and enrollment coverage, Scope is narrower than a full platform]
      - [Internal build or status quo, Manual statements portals and call-center workflows, Organizations deferring platform procurement, Existing control and no vendor fee, Labor friction slow collections and poor scalability]
    notes: >-
      Categories and limitations synthesize the assigned Black Book, KLAS, MD Clarity, and company/competitor materials. A limitation marked unknown is not evidence of absence; Cedar's realized pricing, retention, and margin data are not publicly disclosed.
    claimRefs: [CP009, CP010, CP011, CP012, CP013, CP014]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Cedar, EHR-native suite, Broad RCM suite, Specialist or internal alternative]
    rows:
      - [Patient billing and payment, "Supported: billing, payments, plans, digital channels", "Supported in Epic according to KLAS summary", "Supported in Waystar according to KLAS and MD Clarity summaries", "Supported by RevSpring, Flywire, PatientPay, or internal workflows"]
      - [Coverage and affordability, "Supported: Medicaid and ACA enrollment plus assistance tools", "Unknown in assigned evidence", "FinThrive and Elevate are named in Black Book categories", "Advocatia partnership adds enrollment workflow"]
      - [AI and automation, "Kora and Cedar Intelligence; healthcare-specific interaction data claimed", "Unknown in assigned evidence", "Waystar is named in agentic RCM; MD Clarity describes AI contract tools", "Internal build capability is unknown"]
      - [EHR and workflow integration, "Existing EHR, telephony, and call-center integration claimed", "Native for the relevant EHR", "Broad integration and clearinghouse network described", "Internal integration burden depends on stack"]
      - [Cost-to-collect visibility, "Adverse KLAS result: 6.2 versus 7.6 market average", "Epic relationship and performance scores reported", "Pricing transparency and value vary by vendor", "No comparable public benchmark"]
      - [Pricing transparency, "Custom pricing; realized pricing unknown", "Unknown in assigned evidence", "Flywire and Waystar recognized for transparent pricing by KLAS", "Internal build has no license fee but carries labor and maintenance cost"]
    notes: >-
      "Supported" means the assigned evidence describes the capability, not that outcomes are independently verified. Unknown cells remain unknown because no eligible source in this pool establishes the comparison.
    claimRefs: [CP003, CP004, CP006, CP007, CP009, CP010, CP011, CP012, CP014]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Alternative, Price or contract model, Switching or distribution factor, Evidence-backed implication]
    rows:
      - [Cedar, Custom pricing; no public realized price, Enterprise implementation and integrated workflows, Net value must be tested after fees]
      - [Epic, Not disclosed in assigned sources, Native distribution for Epic customers, Integration can outweigh standalone feature comparison]
      - [Waystar, Transparent pricing recognized by KLAS; exact price unknown, Clearinghouse and broad RCM distribution, Bundling may pressure point-solution economics]
      - [Flywire, Transparent pricing recognized by KLAS; exact price unknown, EHR integration and payment usability, Procurement can compare total cost more directly]
      - [RevSpring, Not disclosed in assigned sources, Best-of-breed relationship and training cited by KLAS, Service quality and integration need diligence]
      - [Internal build, "No vendor license; labor, integration, and maintenance costs unknown", "Existing control but slower scaling", "Status quo is not costless"]
    notes: >-
      Public sources in this pool do not provide comparable contract prices or realized discounts. "Transparent" is a KLAS characterization, not a disclosed price, and internal-build economics are an evidence gap.
    claimRefs: [CP009, CP010, CP011, CP014]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal positioning based on integration breadth and patient-financial specialization; coordinates are analytical scores, not market-share measurements.
    data:
      xAxis: Integration and distribution breadth
      yAxis: Patient-financial specialization
      points:
        - {label: Cedar, x: 4, y: 5, detail: "Platform breadth and healthcare-specific patient-financial focus are described by Cedar's current site and Kora release.", claimRefs: [CP002, CP003, CP004]}
        - {label: Epic, x: 5, y: 3, detail: "KLAS describes system-wide alignment and MyChart integration, with complexity and training concerns.", claimRefs: [CP010]}
        - {label: Waystar, x: 5, y: 3, detail: "Black Book and MD Clarity materials describe broad RCM and clearinghouse distribution.", claimRefs: [CP011, CP012]}
        - {label: RevSpring, x: 3, y: 4, detail: "KLAS describes a best-of-breed product with previsit and text-payment capabilities.", claimRefs: [CP009]}
        - {label: Flywire, x: 4, y: 4, detail: "KLAS describes EHR integration expertise and payment usability.", claimRefs: [CP009]}
        - {label: Internal build, x: 1, y: 2, detail: "No assigned source quantifies internal-build capability; low coordinates represent the analytical uncertainty and likely integration burden, not measured performance.", claimRefs: []}
    approximationNotes: >-
      Scores are ordinal analyst judgments constrained by the cited descriptions: they do not imply market share, conversion rates, or independently measured superiority. The internal-build point is a scenario placeholder and is not evidence.
    claimRefs: [CP002, CP003, CP009, CP010, CP011, CP012]
