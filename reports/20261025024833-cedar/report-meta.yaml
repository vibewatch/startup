companyProfile:
  summary: >-
    Cedar is a privately held healthcare financial-engagement company founded in 2016. Its platform combines patient
    billing, payments, coverage, affordability, denials support, and automated communications for providers and
    patients. Current public evidence indicates broad enterprise deployment and product expansion, while private-company
    disclosure limits confidence in operating quality and valuation.
  foundedDate: '2016-01-01'
  founders:
    - name: Florian Otto
      role: Co-founder and CEO
      background: Physician and former Zocdoc executive who founded Cedar around the patient billing problem.
      claimRefs:
        - CO006
    - name: Arel Lidow
      role: Co-founder
      background: >-
        Public profile evidence associates him with Bridgewater and AppNexus, but current role and involvement are not
        independently confirmed.
      claimRefs:
        - CO007
  foundingLocation: New York City, New York, United States
  headquarters: New York City, New York, United States
  productSummary: >-
    Cedar sells an integrated patient financial engagement platform covering pre-visit and post-visit payments, billing
    communication, payment plans, coverage and assistance workflows, denials resolution, and AI-assisted voice and text
    servicing.
  customerFocus: Hospitals, health systems, physician groups, and their patients and revenue-cycle teams
  businessModel: >-
