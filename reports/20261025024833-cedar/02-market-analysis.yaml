      - ["The Business Research Company", "2030", "Global", "$152.96B", "13.3% from 2026 to 2030", "Forecast from the same broad healthcare RCM definition", "Medium", "No isolated U.S. patient-engagement segment"]
      - ["Grand View Research", "2026", "Global", "$431.7B", "12.0% from 2026 to 2033", "RCM software and services; services were 67.7% of 2025 revenue", "Medium", "Materially broader denominator than Cedar's product scope"]
      - ["Grand View Research", "2033", "Global", "$955.5B", "12.0% from 2026 to 2033", "Forecast using product, type, delivery, end-use and regional segments", "Medium", "Cannot be converted into Cedar SAM or SOM without private inputs"]
    notes: "Values and periods are reproduced from publisher pages; estimates are not averaged because category scope and methodology differ."
    claimRefs: [CM003, CM004, CM005, CM006, CM007]
  - id: "TM003"
    title: "Buyer, user, payer, and adoption map"
    columns: ["Segment", "Economic buyer", "Primary user", "Payer or cash-flow source", "Workflow", "Budget owner", "Adoption trigger"]
    rows:
      - ["Large health systems", "CFO, chief revenue-cycle officer, patient-experience leadership", "Revenue-cycle staff, call-center agents and patients", "Provider operating budget; patient balances are collected", "Pre-visit through post-visit financial engagement", "Finance and revenue cycle", "Collection pressure, fragmented tools and call volume"]
      - ["Physician groups", "Finance and operations executives", "Practice billing teams and patients", "Practice operating budget; patient balances are collected", "Billing, communications, self-service payment and support", "Finance or practice operations", "Faster deployment and reduced internal build burden"]
      - ["Billing and support operations", "Revenue-cycle and contact-center leadership", "Agents and supervisors", "Provider operating budget", "Inbound and outbound billing resolution", "Revenue cycle or shared services", "Labor cost, containment and consistency"]
      - ["Patients", "Not the software buyer", "Patients and household payors", "Out-of-pocket funds, payment plans and assistance", "Understand, dispute, finance or pay a balance", "No enterprise budget ownership", "Clarity, affordability and channel preference"]
    notes: "Buyer roles are inferred from Cedar's provider positioning and customer claims; exact procurement authority and budget line vary by organization."
    claimRefs: [CM009, CM010, CM011, CM012, CM015]
figures:
