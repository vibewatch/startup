    title: "Market sizing lens: from broad RCM estimates to Cedar-specific unknowns"
    type: "pyramid"
    summary: "The layers narrow the analytical scope without treating unlike publisher estimates as a mathematical funnel."
    data:
      items:
        - label: "GVR global RCM estimate, 2026"
          value: 431.7
          unit: "USD billions"
          note: "Broad software-and-services category"
        - label: "TBRC global healthcare RCM estimate, 2026"
          value: 92.91
          unit: "USD billions"
          note: "Different publisher definition and methodology"
        - label: "North America share in GVR, 2025"
          value: 55.4
          unit: "percent"
          note: "Regional share of GVR's broad category, not a Cedar SAM"
        - label: "Hospitals share in GVR, 2025"
          value: 37.3
          unit: "percent"
          note: "End-use share within GVR's broad category"
        - label: "U.S. patient financial engagement spend"
          value: "Not publicly isolated"
          note: "Requires a narrower category denominator"
        - label: "Cedar-specific attainable market"
          value: "Not publicly supportable"
          note: "Requires private pricing, customer counts, eligibility and win-rate data"
    approximationNotes: "No values are multiplied or combined; percentage layers use different denominators and the final two layers are explicit evidence gaps."
    claimRefs: [CM003, CM004, CM006, CM007, CM008, CM016]
callouts:
  - calloutType: "risk"
    title: "Do not capitalize the broad RCM headline"
    body: >-
      The 2026 analyst estimates differ by roughly 4.6x and both include spend beyond Cedar's
      patient-financial-engagement scope. A valuation case needs Cedar-specific contract values,
      eligible accounts, retention, expansion, and independently validated outcomes.
    claimRefs: [CM003, CM004, CM005, CM008, CM016]
