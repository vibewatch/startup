slug: "cedar"
runDate: "2026-10-25"
company:
  name: "Cedar"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Cedar addresses the patient-facing financial-engagement layer of U.S. healthcare revenue
    cycle management, not the full global RCM category. Published 2026 global RCM estimates
    range from $92.91 billion to $431.7 billion because their scopes differ materially, so this
    chapter treats them as boundary markers rather than a Cedar-specific TAM.
sections:
  - id: "market-boundary"
    title: "A narrow patient-financial-engagement wedge inside broad RCM"
    body: >-
      Cedar's relevant market is the provider-side workflow that begins before a visit with
      estimates and registration and continues through bills, communications, payment options,
      financial assistance, denials support, and call-center servicing. That boundary is narrower
      than revenue cycle management as analyst reports define it, which also includes coding,
      claims submission, eligibility, remittance, accounts receivable, consulting, outsourcing,
      and managed services. Cedar's own product surface reaches health systems, physician groups,
      and clinician service organizations, while patients are the users and increasingly material
      payors. Full RCM platforms, point payment tools, provider portals, outsourced call centers,
      and manual staff workflows are therefore adjacencies or substitutes rather than automatically
      part of Cedar's addressable spend. The investable question is the portion of provider
      operating and technology budgets allocated to patient financial engagement, not aggregate
      global RCM revenue.
    claimRefs: [CM001, CM002, CM008, CM009]
    tableRefs: [TM001]
  - id: "sizing-lenses"
    title: "Published market sizes are boundary markers, not a Cedar TAM"
    body: >-
      Two current analyst pages demonstrate why a single headline TAM would be misleading. The
      Business Research Company estimates the global healthcare RCM market at $92.91 billion in
      2026 and $152.96 billion in 2030, implying a 13.3% CAGR from 2026 through 2030. Grand View
      Research estimates a much broader $431.7 billion in 2026 and $955.5 billion by 2033, with a
      12.0% CAGR from 2026 through 2033; its definition includes a services segment representing
      67.7% of 2025 revenue. The roughly 4.6-fold difference in 2026 estimates is evidence of
      denominator and methodology divergence, not a contradiction that can be averaged away.
      Neither public page isolates U.S. patient financial engagement, Cedar-compatible provider
      spend, or attainable share. A credible SAM/SOM therefore requires customer-level annual
      contract values, eligible-provider counts, segmentation by health system and physician group,
      and documented win and expansion rates.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-adoption"
    title: "The economic buyer is the provider; the patient is the user and payor"
    body: >-
      Cedar's primary buyers are provider finance, revenue-cycle, operations, and patient-experience
      leaders. Health systems and physician groups fund the platform, frontline billing and support
      teams operate it, and patients use it to understand balances, supply insurance information,
      choose payment or assistance paths, and make payments. Adoption is triggered by higher
      patient responsibility, coverage volatility, fragmented workflows, labor-intensive support,
      and pressure to improve collections without worsening patient experience. Cedar reports that
      its athenaOne partners average a 3x return on investment, 87% patient satisfaction, and an
      83% self-service payment rate, with results in as little as eight weeks. Those are company-issued
      portfolio claims rather than independent benchmarks, but they identify the metrics a buyer
      would use to approve deployment: collection lift, cost-to-collect, self-service, satisfaction,
      implementation burden, and speed to value.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-diligence"
    title: "AI and regulation expand the workflow while raising proof requirements"
    body: >-
      Personalization and agentic support can expand the addressable workflow beyond a static bill
      or payment portal. Cedar reports that Kora has handled more than 600,000 inbound patient
      conversations, achieved 40% call containment, and increased payment attempts by 7.4% versus
      live agents. The same workflow is constrained by interoperability, privacy, security,
      auditability, clinical-scope boundaries, and changing payment rules. CMS requires good-faith
      estimates for uninsured or self-pay patients and provides a patient-provider dispute process;
      HHS also reported more than 5 million federal IDR disputes since April 2022 before finalizing
      2026 process reforms. Regulation can create demand for clearer estimates and resolution
      workflows, but it also increases integration and compliance costs. Market diligence should
      therefore test Cedar's claims against customer contracts, implementation cohorts, independent
      outcomes, budget ownership, pricing, and retention before translating category growth into
      valuation support.
    claimRefs: [CM013, CM014, CM015, CM016]
