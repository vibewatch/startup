        - id: scale
          label: Reported scale
          detail: "1.5B+ interactions, $13.6B payments, and 63M+ patients are reported by Cedar."
        - id: outcomes
          label: Reported outcomes
          detail: "Cedar reports collection-rate lift, satisfaction, and digital self-service metrics."
        - id: opacity
          label: Financial opacity
          detail: "Current ARR, margins, cash flow, cap table, and preferences are not disclosed in the assigned public evidence."
        - id: decision
          label: Research-more
          detail: "Require current financing and operating diligence before underwriting a premium valuation."
        - id: diligence
          label: Diligence package
          detail: "Obtain current ARR, margins, cap table, preferences, retention, concentration, and QoE evidence."
        - id: price
          label: Price discipline
          detail: "Re-underwrite entry price only after the evidence establishes a current denominator."
      edges:
        - [scale, outcomes]
        - [outcomes, opacity]
        - [opacity, decision]
        - [decision, diligence]
        - [diligence, price]
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: "Research-more: Cedar has credible scale signals, but a historical $3.2 billion financing mark cannot be translated into a current price-sensitive recommendation without current revenue, margin, dilution, and preference evidence."
    claimRefs: [CV001, CV003, CV004, CV005]
  - calloutType: risk
    title: Thesis-break trigger
    body: A down round, material customer concentration, weak net retention, or inability to reconcile reported activity with recurring revenue and margin would break the premium-platform thesis.
    claimRefs: [CV012, CV013, CV014, CV015]
