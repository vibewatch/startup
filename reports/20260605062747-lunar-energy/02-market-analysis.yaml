  title: Market Analysis
  summary: Lunar Energy sells into a converging market made up of residential batteries, energy-management software, and virtual power plant orchestration rather than into a single hardware category. Public policy and market data show strong structural demand drivers—rising retail electricity prices, California net billing, SGIP incentives, FERC Order 2222, and the need for 80-160 GW of VPP capacity by 2030—but the same evidence also highlights execution constraints around fragmented local rules, customer-acquisition costs, and a likely shakeout among installer and third-party ownership financing models.
