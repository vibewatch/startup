- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and what could go wrong
  body: 'The strongest demand drivers are visible and measurable. EIA expects residential electricity prices to average 18.2 cents per kilowatt-hour in 2026, up nearly 5% year over year. CPUC’s net billing design makes daytime exports worth less than under old NEM while preserving occasional high-value evening exports, which directly improves the case for batteries that can shift energy into those windows. SGIP further compresses payback for qualified households, with storage incentives up to $1,100 per kilowatt-hour and paired solar support up to $3,100 per kilowatt. DOE and FERC supply the system-level tailwinds: VPPs can compete in wholesale markets, avoid peaker plants, and in some cases launch quickly with limited upfront public investment.


    But public evidence also shows why this will not be a straight-line adoption story. Energy-Storage.news highlights customer acquisition, retention, and partner economics as the Achilles heel of many VPP strategies. Its 2026 market commentary also warns that the flood of third-party ownership models may leave a graveyard of failed finance providers, which matters because installers will follow the financing platforms that actually close jobs. Wood Mackenzie’s commentary adds another constraint: regulatory pushback and utility program caps can broaden activity faster than they deepen operational capacity. The result is a market with excellent structural demand and real policy support, but with enough local friction that execution quality and channel economics will decide who actually captures the value.'
