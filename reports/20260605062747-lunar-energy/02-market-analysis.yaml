  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-for-lunar
    missingEvidence: No public source isolates Lunar’s true serviceable available market by state, installer penetration, or utility-program readiness.
    whyItMatters: High-level market growth does not automatically translate into reachable demand for Lunar; channel depth and utility-program eligibility determine what portion of the broad market is actually monetizable.
    diligencePath: Request management’s state-by-state pipeline, installer activation funnel, and utility-program map.
    relatedQuestionRefs:
    - QM003
    - QM015
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: current-vpp-scale
    missingEvidence: Public VPP-capacity figures differ between DOE’s 30-60 GW and 33 GW snapshots and Wood Mackenzie’s 37.5 GW operational estimate.
    whyItMatters: The broad opportunity is clear, but different methodologies can materially change how quickly the market appears to be scaling and how much residential share is already penetrated.
    diligencePath: Reconcile methodology definitions across DOE, Wood Mackenzie, and ISO-level program data before using a single number in valuation models.
    relatedQuestionRefs:
    - QM004
    relatedTableRefs:
    - TM002
  - type: stale
    severity: minor
    topic: california-export-rates
    missingEvidence: The chapter cites CPUC net-billing mechanics but not a clean monthly table of actual 2026 export values by IOU and hour.
    whyItMatters: Battery economics hinge on the spread between import and export values, so underwriting without current hourly tariff data risks overstating or understating homeowner payback.
    diligencePath: Pull current 2026 IOU export-rate tables and run a modeled dispatch against representative customer load shapes.
    relatedQuestionRefs:
    - QM008
    - QM011
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: minor
    topic: customer-acquisition-cost
    missingEvidence: No public source discloses customer acquisition cost, installer gross margin, or VPP enrollment conversion for Lunar or peers.
    whyItMatters: Customer-acquisition friction is one of the main risks in VPP scale-up, but public market and policy data do not reveal whether Lunar’s partner-led model is economically durable.
    diligencePath: Request CAC, installer incentive structure, attachment rates, and VPP opt-in versus opt-out conversion data.
    relatedQuestionRefs:
    - QM016
    - QM017
    relatedTableRefs:
    - TM003
    - TM004
