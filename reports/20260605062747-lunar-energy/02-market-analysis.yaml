- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / Budget owner
  - Adoption trigger
  - Workflow implication
  rows:
  - - High-TOU homeowner
    - Homeowner with installer guidance
    - Homeowner
    - Household capex or financed payment
    - Rising electric bills and backup needs
    - Battery sale needs simple savings story
  - - Solar attachment sale
    - Installer / TPO recommends storage
    - Homeowner
    - Lease, loan, or financed solar-plus-storage package
    - NEM/NBT or outage-prone market
    - Installer attachment economics become critical
  - - CCA demand-flexibility program
    - CCA / public agency
    - Participating households and businesses
    - Public agency program budget
    - Need for dispatchable local capacity
    - DERMS, enrollment, and settlement matter
  - - Utility / retailer VPP
    - Utility or retailer
    - DER owner participates through app or partner
    - Utility program payments or market revenues
    - Peak shaving or resource adequacy need
    - Customer trust and incentive design are decisive
  - - Strategic installer channel
    - Sunrun or other partner
    - Homeowner fleet and utility-facing asset owner
    - Channel partner and downstream program economics
    - Need to scale customer acquisition quickly
    - Lunar depends on partner-led demand creation
  - - Public-policy / low-income program
    - State program administrator and approved developer
    - Low-income household
    - SGIP + IRA + developer financing
    - Resilience and bill affordability
    - Requires eligibility verification and demand-response enrollment
  notes: Buyer, user, and payer are often different actors in this market. That separation is why channel structure and program design matter as much as raw consumer battery interest.
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
  - CM037
