  - CM040
  - CM048
- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Evidence / Diligence ask
  rows:
  - - Rising retail electricity prices
    - Driver
    - Current
    - Improves value of arbitrage and backup savings
    - EIA price outlook and historical price table
  - - California net billing tariff
    - Driver
    - Current
    - Makes storage materially more useful than solar-only exports
    - Need current IOU export-rate modeling
  - - SGIP + IRA stacking
    - Driver
    - Current
    - Can compress payback dramatically for qualified households
    - Verify budget availability and waitlists by utility
  - - Order 2222 and wholesale access
    - Driver
    - Medium term
    - Improves monetization path for aggregated DER fleets
    - Track ISO implementation quality by region
  - - Customer acquisition cost
    - Constraint
    - Current
    - Can make VPP economics unattractive without strong partners
    - Need CAC and enrollment-conversion data
  - - Regulatory pushback / utility caps
    - Constraint
    - Current
    - Can broaden pilots faster than deep capacity growth
    - Watch CPUC/ISO and utility program design changes
  - - TPO finance shakeout
    - Constraint
    - Current
    - Installer and customer trust can be damaged by failed finance partners
    - Review partner balance-sheet strength
  - - Localized market rules
    - Constraint
    - Current
    - National TAM is not equal to nationally reachable demand
    - Map state-by-state rate design and interconnection friction
  notes: The strongest public evidence supports a market with powerful structural tailwinds but equally real execution friction at the state, utility, and channel-partner level.
  claimRefs:
