- id: sizing-lenses
  title: 'Sizing lenses: peak-load need, current VPP scale, and California adoption'
  body: 'A credible market-sizing approach for Lunar cannot rely on one headline TAM. The first lens is the grid problem itself: DOE says the U.S. needs more than 200 GW of new peak-demand resources by 2030, and that 80-160 GW of VPPs could economically cover 10-20% of that need while saving about $10 billion per year. The second lens is current VPP scale. DOE and DOE-linked materials describe roughly 30-60 GW of existing VPP capacity and 33 GW in North America in the 2025 update; Wood Mackenzie later reported 37.5 GW operational capacity. The exact number differs by methodology, but the directional point is strong: the category is already real and not just theoretical pilotware.


    The third lens is California, the most important early market for Lunar’s category. CPUC says California accounts for more than one-third of U.S. customer-sited solar capacity, and nearly 70% of net-billing-tariff customers had paired batteries with solar by the end of 2024. That pairing rate is a more meaningful signal for Lunar than generic national solar counts because it shows customers are already responding to policies that reward storage-enabled dispatch. SEIA adds a national growth lens: residential storage capacity grew 51% in 2025, cumulative residential battery capacity reached 9.5 GWh, and the market is still expected to grow strongly through 2030 even though Q1 2026 residential deployments dipped quarter over quarter.'
  claimRefs:
  - CM005
