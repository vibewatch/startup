- id: public-comparables-and-financial-verdict
  title: Public comparables and financial verdict
  body: 'Public comps show how wide Lunar’s plausible economic band still is. Sunrun demonstrates the financing intensity of distributed residential storage: it generated $722.2 million of Q1 revenue and carried a record 73% storage attachment rate, yet still reported negative cash generation and relied on a $2.7 billion non-recourse warehouse plus joint-venture funding structures. Enphase shows the upside of a stronger hardware-software mix, with 43.9% non-GAAP gross margin and nearly $931 million of cash. Tesla shows the scale endpoint, with $2.4 billion of energy generation and storage revenue in a single quarter and more than 6 GWh of annual Powerwall capacity in Nevada. Generac and SolarEdge show that not every residential-storage-adjacent model clears that bar: Generac said storage sales were a drag inside residential results, and SolarEdge remained at only 23.5% non-GAAP gross margin.


    That comp band implies a cautious verdict. Reported facts support genuine demand, premium positioning, and real software/VPP value. Estimated proxies suggest Lunar could convert manufacturing scale into material hardware billings. But unavailable metrics still dominate the underwriting file: no public revenue, no margin bridge, no disclosed liquidity, and no disclosed structured finance obligations. Add the conflicting private-market valuation trackers, and the financially honest stance is constructive on market relevance but skeptical on revenue quality and near-term valuation confidence.'
