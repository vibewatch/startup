  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Audited revenue per system, gross margin by stream, CAC, payback, and warranty-support cost.
    whyItMatters: Without these figures, Lunar cannot be placed credibly inside the public-comp margin band or valued on revenue quality.
    diligencePath: Request a board-ready monthly P&L by stream, unit-economics cohort analysis, and a warranty reserve memo.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: Current cash, restricted cash, debt, warehouse lines, monthly burn, and base/bear/bull runway assumptions.
    whyItMatters: Fresh equity capital alone does not reveal whether Lunar is overcapitalized, adequately funded, or still headed toward another financing event.
    diligencePath: Request the latest board deck, cash bridge, debt schedule, covenant summary, and 24-month runway model.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: valuation-conflict
    missingEvidence: A reconciled cap table or management-confirmed last-round post-money valuation that explains why public trackers disagree so sharply.
    whyItMatters: Entry valuation changes the investment case materially, and current public tracker signals cannot be averaged responsibly.
    diligencePath: Request the latest financing documents, preferred-share pricing, 409A or common FMV context, and any recent secondary transactions.
    relatedQuestionRefs:
    - QI020
    - QI021
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: channel-economics-gap
    missingEvidence: Realized dealer discounts, installer rebates, sell-through velocity, inventory financing, and return allowances.
    whyItMatters: Channel reach is publicly visible, but channel economics could materially compress gross margin or pull forward inventory.
    diligencePath: Request top reseller and installer agreements plus quarterly sell-through and inventory-aging reports.
    relatedQuestionRefs:
    - QI010
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: diligence-blockers
    missingEvidence: Recognized revenue by stream, revenue-recognition policy, gross margin by stream, top-customer concentration, and renewal behavior.
    whyItMatters: These are the minimum inputs required to decide whether Lunar is a premium hardware vendor, a software-led energy platform, or a channel-heavy service business.
    diligencePath: Request the revenue-recognition memo, customer concentration schedule, cohort retention, and stream-level gross-profit bridge.
    relatedQuestionRefs:
    - QI023
    - QI024
    - QI025
    relatedTableRefs:
    - TI005
