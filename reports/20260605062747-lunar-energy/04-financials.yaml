- id: reported-scale-versus-unit-economics
  title: Reported scale signals versus missing unit economics
  body: 'Lunar has more public traction evidence than financial evidence. The strongest reported metrics are operational: thousands of systems deployed, 650 MW under management, roughly 2,000 California installations, nearly 150,000 devices coordinated on the software side, and homeowner economics of about $464 of VPP earnings plus $338 of software-driven savings. Those data points show that the product does real work for customers and that VPP participation is not theoretical. They also help explain why investors keep backing the company: there is enough reported customer value to justify continued manufacturing and channel expansion.


    But these are still customer-side or fleet-side outputs, not Lunar unit economics. Public sources do not disclose recognized revenue per installation, hardware gross profit, warranty burden, support cost, CAC, payback, concentration, or retention. That leaves only a thin estimated layer. If the Signature Solar bundle reference is directionally useful, then the announced 20,000-unit and 100,000-unit capacity targets imply sizable hardware billings potential, but that is only a proxy and cannot substitute for actual company financials. The chapter therefore separates reported traction from estimated revenue capacity and explicitly leaves core unit-economics fields as unavailable.'
