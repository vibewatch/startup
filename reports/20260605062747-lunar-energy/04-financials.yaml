tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public value / status
  - Revenue quality read
  - Diligence ask
  rows:
  - - Lunar System hardware kits
    - Battery blocks, inverter, bridge, breakers, and bundled system sold through installers and resellers
    - Live SKUs and bundle pricing visible through Signature Solar, BayWa, and Greentech
    - Most concrete reported revenue surface, but realized ASP is still unknown
    - Provide dealer price book, net realized ASP, and gross margin by hardware configuration.
  - - Embedded software optimization
    - Lunar AI schedules charging, discharge, and backup behavior inside the hardware system
    - Product page and investor materials emphasize savings optimization and automated tariff response
    - Clearly part of product value proposition, but standalone software fee is undisclosed
    - Break out software license, attachment, and renewal economics separate from hardware.
  - - VPP/grid services value capture
    - Gridshare coordinates batteries and other devices into utility or aggregator programs
    - Customer-side value of $464 average annual earnings is disclosed; Lunar take rate is not
    - Evidence shows customer value, not company revenue share
    - Disclose aggregator contracts, utility fees, and retained VPP gross profit per enrolled home.
  - - Installer/channel economics
    - Sunrun plus regional and national installers provide deployment access
    - Channel strategy is confirmed, but commissions, discounts, and rebates are not
    - Likely reduces direct CAC but shares economics with partners
    - Provide installer margin stack, partner concentration, and channel conflict policy.
  - - Distributor / reseller sales
    - BayWa and Greentech list Lunar products; Signature Solar lists a priced bundle
    - Broadens route-to-market beyond one strategic partner
    - Sell-through, inventory financing, and returns are all unavailable
    - Provide channel inventory turns, sell-through, and return allowances by partner cohort.
  - - Service / warranty / support
    - Warranty support, app visibility, and outage controls are part of the product promise
    - 12.5-year warranty and app-led controls are public
    - Service burden may dilute gross margin if failure or truck-roll rates are high
    - Provide warranty reserve policy, service cost per system, and failure-rate history.
  notes: Reported streams are separated from monetization inference. Unknown fields reflect the absence of disclosed Lunar net revenue or gross-profit splits.
