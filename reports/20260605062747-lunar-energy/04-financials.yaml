- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Current public proxy
  - Impact on verdict
  - Exact diligence path
  rows:
  - - Revenue by stream
    - Hardware listings, VPP customer savings, and deployment counts
    - Cannot judge whether the model is hardware-heavy, software-rich, or service-diluted
    - Request monthly revenue split across hardware, software, VPP/grid services, and service.
  - - Gross margin by stream
    - Public-comp margin band only
    - Without this, premium pricing cannot be translated into profitability
    - Request gross-profit waterfalls for hardware, software, warranty, and service.
  - - Cash, burn, and runway
    - Fresh fundraising but no balance-sheet disclosure
    - Capital adequacy cannot be underwritten directly
    - Request latest cash bridge, monthly burn, and 24-month runway model.
  - - Debt / warehouse / tax-credit monetization
    - Sunrun comp provides an example; Lunar does not
    - Structured finance could be a hidden source of leverage or liquidity
    - Request debt schedule, warehouse lines, tax-credit transfer strategy, and TPO exposures.
  - - Realized pricing and channel discounts
    - Signature Solar bundle plus CEO premium comment
    - List price does not equal recognized revenue or net margin
    - Request reseller agreements, installer discounts, rebates, and price waterfalls.
  - - Customer concentration and retention
    - Sunrun relationship and installer network are visible, economics are not
    - A few large partners could dominate volume and bargaining power
    - Request top-customer concentration, retention, and renewal data.
  - - Valuation reconciliation
    - Forge, PremierAlts, and Notice expose inconsistent signals
    - Conflicting private marks weaken confidence in any single entry price
    - Request last round post-money, common-share FMV, and recent secondary transactions.
  notes: Every row is intentionally actionable. Null or proxy fields indicate real diligence blockers rather than missing table work.
