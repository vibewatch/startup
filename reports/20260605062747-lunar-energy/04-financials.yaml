- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Lunar’s public record maps to several cash-consuming layers—manufacturing, channel inventory, software operations, and possibly structured finance—but only fundraising is disclosed cleanly.
  data:
    columns:
    - Public evidence
    - Why it consumes cash
    - Disclosure status
    - Underwriting implication
    rows:
    - label: Manufacturing ramp
      values:
      - 10k current capacity, 20k by end-2026, 100k by 2028
      - Tooling, contract manufacturing, component buys, and labor scale-up
      - Partially disclosed
      - Fresh capital may be funding utilization before margins are proven
    - label: Multi-state assembly footprint
      values:
      - Designed in California; assembled in Georgia and Washington
      - Logistics, inventory placement, and supplier coordination
      - Partially disclosed
      - Operational complexity can consume working capital before revenue matures
    - label: Channel inventory
      values:
      - Signature Solar, BayWa, and Greentech listings
      - Distributors and dealers can require discounts, stocking, and rebate support
      - Partially disclosed
      - Sell-through risk and channel financing remain unknown
    - label: Gridshare / VPP operations
      values:
      - 650 MW managed; ~150,000 devices coordinated
      - Software operations, integration, and program management create ongoing opex
      - Partially disclosed
      - Software value is visible to customers but not to Lunar’s margin line
    - label: Structured finance visibility
      values:
      - Sunrun peer uses warehouse and JV structures; Lunar has no analogous public disclosure
      - Tax-credit transfer, TPO, or debt structures could shift liquidity sharply
      - Undisclosed
      - Financing dependency could be higher than headline equity raises suggest
