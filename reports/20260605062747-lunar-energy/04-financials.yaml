- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / benchmark
  - Public price signal
  - List vs realized pricing
  - Discounts / unknowns
  - Source implication
  rows:
  - - Lunar reseller bundle
    - Signature Solar listed $13,548.60
    - Channel bundle reference only; not confirmed installed price
    - Installation, software, rebates, dealer discounts, and tax credits unknown
    - Useful anchor for hardware value, not for recognized revenue.
  - - Lunar installed system positioning
    - CEO told Canary Lunar installs are about 10% above Tesla Powerwall
    - Management comparison, not published MSRP
    - No apples-to-apples bill of materials or installer quote disclosed
    - Supports premium positioning narrative but not precise realized ASP.
  - - Tesla Powerwall 3
    - EnergySage typical installed cost $13,473 and about $998 per kWh
    - Installed-cost benchmark based on marketplace quotes
    - Installer variability and incentive effects remain market-specific
    - Closest public anchor for a mainstream premium battery benchmark.
  - - Generac PWRcell 2
    - Starts at $14,000 before installation
    - Hardware-first starting price, not all-in cost
    - Installation adds thousands and configuration varies
    - Shows Lunar is not obviously above every premium alternative.
  - - SolarEdge Home Battery
    - EnergySage estimated $10,000 to $20,000 full installed system range
    - Broad installed-cost range
    - System design and solar pairing shift the actual price
    - Illustrates how wide residential-storage pricing bands remain.
  - - Enphase IQ Battery 5P
    - Official store page disclosed specs and warranty, but not a battery price
    - Pricing unavailable on retained official page
    - Installer quote still required
    - Confirms spec positioning but not monetization.
  notes: This table separates reported price surfaces from realized Lunar economics. Price anchors come from a mix of reseller, management-quoted, and marketplace sources and are not interchangeable revenue numbers.
