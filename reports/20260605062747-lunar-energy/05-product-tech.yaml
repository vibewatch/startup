tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current spec / status
  - Differentiation
  - Diligence gap
  rows:
  - - Lunar Battery tower
    - Homeowner and installer
    - 15-30 kWh modular battery with hybrid inverter in one unit
    - Single branded stack rather than a third-party battery plus external controls
    - Need an official standalone public datasheet with the full configuration matrix and service assumptions.
  - - Hybrid inverter block
    - Installer and homeowner
    - 9.6 kW continuous, 15 kW peak, panel-level optimization support
    - Pairs centralized conversion with module-level controls
    - Need an official efficiency curve and thermal derating data by climate and mounting mode.
  - - Bridge / Switch / smart panel
    - Homeowner, installer, utility interface
    - Monitors grid status, manages transfer, acts as panel or panel-adjacent control layer
    - Backup transfer plus fine-grained load control in the same system family
    - Need public documentation for every approved panel, service-disconnect, and retrofit scenario.
  - - Meter socket adapter path
    - Installer
    - ConnectDER IslandDER pathway exposed publicly
    - Potentially faster retrofit path without moving existing circuits
    - Need a public compatibility matrix by meter socket, jurisdiction, and utility.
  - - Maximizers and hub
    - Installer
    - Per-panel optimization, rapid shutdown, 650 W SKUs visible in distribution
    - Extends Lunar control to the module layer
    - Need an official public shading-loss or uptime-performance study.
  - - Homeowner app
    - Homeowner household
    - Live in iOS and Android stores with 2026 updates
    - Turns savings, outage runtime, and VPP enrollment into a visible product surface
    - Need longer-run public release notes and reliability telemetry.
  - - Installer app and docs
    - Installer and service teams
    - Live mobile apps plus installation guide and downloadable docs
    - Commissioning, firmware updates, automated tests, and support inside the workflow
    - Need public proof of average install time and truck-roll reduction by cohort.
  - - Gridshare VPP / DERMS
    - Utilities, aggregators, Lunar operations
    - Live Sunrun and Ava references plus DSGS workflow
    - Device-level optimization and multi-device dispatch rather than battery-only marketing
    - Need more third-party operator references beyond named case studies.
  notes: Statuses reflect what the retained public set supports today, not a complete internal bill of materials or every installer-only accessory.
