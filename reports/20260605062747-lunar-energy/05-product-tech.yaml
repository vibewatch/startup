- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Rooftop solar + Maximizers
    - Capture generation and optimize each panel before system-level conversion and control
    - Depends on roof design, stringing, and maximizer compatibility
    - Sparse public interoperability detail could hide edge-case retrofit limits.
  - - Battery blocks + hybrid inverter
    - Store energy and convert it for home and grid use
    - Depends on correct sizing, thermal environment, and firmware behavior
    - Public field-life and warranty-claim data remain thin.
  - - Bridge / Switch / smart breakers
    - Handle transfer, panel monitoring, and priority-load control
    - Depends on panel layout, breaker compatibility, and installer configuration
    - Incorrect load assignment can trip the system during outages.
  - - Meter socket adapter / PCS / PTO layer
    - Connect to utility rules and govern import or export behavior
    - Depends on utility approval, meter hardware, and installer-set PCS limits
    - Permitting and interconnection can materially delay full feature availability.
  - - Homeowner app + Lunar AI
    - Surface data, choose modes, and automate daily savings or backup decisions
    - Depends on correct rate-plan data, weather signals, and device connectivity
    - Weak connectivity or wrong tariffs can degrade optimization quality.
  - - Installer app + documentation center
    - Commission systems, push firmware, run tests, and support service workflows
    - Depends on installer training and version control
    - Public proof of labor-time savings is limited to company claims and app copy.
  - - Gridshare cloud / DERMS
    - Aggregate devices, forecast availability, and dispatch VPP fleets
    - Depends on partner integrations, telemetry quality, market rules, and customer reserve constraints
    - Named case studies are good, but third-party operator validation is still narrow.
  notes: This table reconstructs the public architecture from official product, installer, and case-study materials rather than from internal engineering documents.
