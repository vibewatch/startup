- id: software-control-plane-and-vpp-orchestration
  title: Software control plane and VPP orchestration
  body: |-
    Software is where Lunar tries to differentiate above chemistry alone. The retained pages show a coherent stack: Lunar AI for daily optimization, the homeowner app for live control and savings visibility, installer apps for commissioning and firmware workflows, and Gridshare for fleet aggregation and dispatch. The AI claim is specific enough to matter. Lunar says it weighs rates, weather, export credits, VPP opportunities, EV charging, and household behavior every day rather than simply preserving a static reserve. The app pages then show how that software is surfaced to users through real-time flow views, charts, savings comparisons, outage forecasts, and VPP enrollment.

    The stronger independent corroboration is on release surface and VPP operations. Both app stores show live homeowner and installer apps with 2026 updates, while the Sunrun case study and Ava partnership materials support a real Gridshare deployment footprint. Public materials go further than generic DERMS marketing: they claim device-level optimization, multi-manufacturer orchestration, 100% uptime in one Hawaiian Electric program, and materially better dispatch performance for one Southern California Edison program. The open question is not whether software exists, but how repeatable those outcomes are outside the named partner programs and public case studies.
