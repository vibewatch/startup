summary: 'Lunar''s public record supports a genuinely integrated residential energy stack: modular DC-connected battery hardware, smart-breaker-assisted backup, live homeowner and installer apps, and device-agnostic Gridshare VPP software. Specs, app surfaces, and partner listings are stronger than for many young hardware companies, but much of the weather-hardening and long-run reliability narrative still rests on company and partner statements rather than independent field data.'
sections:
- id: hardware-stack-and-spec-envelope
  title: Hardware stack and spec envelope
  body: |-
    Lunar's public product surface supports a real integrated hardware platform rather than a brand-only battery bundle. The official system page, component explainer, and launch post consistently show one stack: modular battery blocks, a hybrid inverter, per-panel maximizers, the Bridge control layer, optional meter-socket-adapter connectivity, and Eaton smart breakers. The most important diligence point is that these headline specs are not only self-reported. EnergySage and Sunrun both repeat the same core envelope of 15-30 kWh configurations, 9.6 kW continuous output, and 15 kW peak output, while Greentech and Signature Solar expose live component and bundle SKUs in channel. That combination makes the top-line product definition credible.

    Public evidence is strongest on the DC-coupled battery core, modular sizing, and integrated load-control story. Public evidence is thinner on the full compatibility matrix for every retrofit path or accessory combination. The company clearly supports homes with or without existing solar and exposes a ConnectDER path, but the fetched public set still leans on partner listings and installer docs for some of the lower-level hardware detail. So the hardware story is convincing, while the edge-case interoperability map still belongs in installer diligence rather than investor imagination.
