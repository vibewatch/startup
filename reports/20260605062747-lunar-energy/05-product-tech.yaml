- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Lunar solution
  - Measurable benefit
  - Limitation
  rows:
  - - Buy and install a system
    - Certified installer qualifies home, proposes design, pulls permits, installs, and seeks PTO
    - Company-managed installer handoff plus installer guide and onboarding flow
    - Public pages make the deployment path unusually explicit for a young battery vendor
    - The experience still depends heavily on installer quality and local permitting speed.
  - - Run the home after PTO
    - System follows utility and installer constraints after approval
    - App exposes rate-plan setup, PCS behavior, modes, and predictions after PTO
    - Customers can see post-PTO operating state instead of treating the system as a black box
    - Pre-PTO and post-PTO behavior can be confusing without installer support.
  - - Prepare for outages
    - Battery reserve and weather prep need to be set correctly
    - Backup mode, reserve settings, and Outage Watch automate readiness
    - Seamless switchover and runtime estimates improve homeowner confidence
    - Runtime still depends on actual load profile and correct load sizing.
  - - Prioritize critical loads
    - Many battery systems require manual panel or load management decisions
    - AbleEdge smart breakers can drop nonessential loads automatically or manually
    - Extends backup duration and supports higher-value circuits during outages
    - Requires additional breaker hardware and installer configuration.
  - - Earn from VPPs
    - Home batteries must enroll and dispatch without disrupting backup needs
    - App-led VPP enrollment and DSGS workflow with AI-managed discharge to reserve
    - Official sources support hundreds of dollars of annual upside in some programs
    - Revenue depends on jurisdiction, event frequency, and performance.
  - - Commission and service in the field
    - Installers often rely on separate tools and return visits
    - Installer apps run firmware bundles, automated tests, and support workflows
    - Public materials explicitly promise fewer truck rolls and 15-minute commissioning
    - No public cohort data proves average labor savings or failure-reduction effects yet.
  notes: Benefits are limited to source-backed workflow outcomes and do not imply uniform installer execution in every geography.
