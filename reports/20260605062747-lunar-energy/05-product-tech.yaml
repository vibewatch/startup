- id: roadmap-differentiation-and-technical-verdict
  title: Roadmap, differentiation, and technical verdict
  body: |-
    The product roadmap visible in 2025-2026 is not about a single next feature release; it is about scaling an already integrated stack into more homes, more programs, and more geographies. Canary's reporting on manufacturing ramp targets, the Ava partnership, the 2026 DSGS program details, and the UL 9540A post all point in the same direction: Lunar is trying to industrialize a combined hardware-plus-control-plane offering rather than simply sell more battery boxes. The company also continues to invest in installer tooling and load-management integration, which matters because residential storage economics depend as much on smooth deployment and post-sale service as on nominal kilowatt-hours.

    Technically, Lunar's differentiation is clearest where hardware and software meet. Many competitors can match battery chemistry or inverter performance on paper. Fewer publicly show an integrated package of modular DC-connected hardware, smart-breaker load shedding, a real homeowner app, a live installer app, and named device-agnostic VPP operations. The trade-off is maturity proof. The architecture reads as more differentiated than the average battery startup, but less independently verified than its marketing ambition. That leaves Lunar in an attractive but diligence-heavy zone: credible product depth, credible roadmap, and a still-open question on lifetime reliability and service economics at scale.
