  evidenceGaps:
  - type: missing-source
    severity: material
    topic: long-run reliability data
    missingEvidence: Independent field-failure curves, warranty-claim rates, and battery replacement statistics across installed Lunar systems.
    whyItMatters: Without longitudinal reliability disclosure, investors can underwrite architecture quality but not the true service-cost or reserve burden of scaling the installed base.
    diligencePath: Request cohort-level warranty data, replacement rates by component, service-cost history, and any insurer or reserve-policy memos tied to deployed systems.
    relatedQuestionRefs:
    - QE024
    - QE030
  - type: missing-source
    severity: material
    topic: official public spec pack
    missingEvidence: A fetched standalone official datasheet and warranty PDF that consolidates chemistry, efficiency, dimensions, allowed configurations, and accessory compatibility in one place.
    whyItMatters: The current public set proves many specs, but some lower-level hardware detail still comes from partner listings and marketplaces rather than a single authoritative manufacturer sheet.
    diligencePath: Request the current datasheet, warranty, and compatibility matrix from the installer portal and reconcile them against distributor and marketplace listings.
    relatedQuestionRefs:
    - QE017
    - QE019
  - type: private-evidence-only
    severity: material
    topic: installer economics and service burden
    missingEvidence: Partner-level install times, commissioning success rates, truck-roll rates, and reverse-logistics outcomes by installer cohort.
    whyItMatters: Installer tooling is central to Lunar’s product thesis, but public materials do not quantify whether the promised labor and service efficiencies actually materialize at scale.
    diligencePath: Ask for installer scorecards, average install duration, commissioning failure rates, firmware remediation frequency, and service-ticket resolution times.
    relatedQuestionRefs:
    - QE025
    - QE028
  - type: missing-source
    severity: minor
    topic: environmental hardening validation
    missingEvidence: Third-party lab or insurer-facing validation of the published flood, seismic, coastal-air, and soot-resilience claims.
    whyItMatters: Those claims are commercially important in outage-prone or coastal markets, but the retained evidence is still mostly company-authored.
    diligencePath: Request lab reports, certification appendices, or AHJ packets that substantiate the environmental test claims outside marketing copy.
    relatedQuestionRefs:
    - QE018
    - QE024
