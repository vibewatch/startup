- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Status
  - Scope
  - Evidence
  - Gap
  rows:
  - - Component and system safety certifications
    - Present
    - Battery, inverter, bridge, maximizer, and overall ESS
    - Official certification page plus EnergySage battery and inverter listings cite UL and related standards
    - Need a single public master certification matrix and linked certificates.
  - - UL 9540A 6th Edition compliance
    - Present but company-stated
    - Residential fire-safety testing and permitting pathway
    - May 2026 Lunar post says every 10-30 kWh configuration meets the new unit-level requirements
    - Need third-party or AHJ-facing documentation that is publicly downloadable.
  - - Environmental hardening claims
    - Present but mostly company-stated
    - Flood, seismic, coastal, soot, and temperature resilience
    - Official article cites earthquakes, floods, coastal fog, fire soot, and 3 feet of water for 24 hours
    - Need independent field or lab validation outside company copy.
  - - Cybersecurity program
    - Present
    - Information security and privacy controls across software and operations
    - Company cyber page names ISO/IEC 27001, SOC 2 Type I and II, CCPA, GDPR, encryption, access control, and monitoring
    - Need scope details, audit dates, and mappings specific to product surfaces.
  - - App data handling disclosures
    - Present
    - Mobile app privacy and transport security
    - Google Play and Apple listings disclose encrypted transit and declared data handling
    - Store disclosures are not substitutes for full architecture or incident reporting.
  - - Named VPP performance evidence
    - Present but narrow
    - Gridshare dispatch reliability in specific utility programs
    - Sunrun case materials cite 100% uptime and 60% better energy delivery in named programs
    - Need broader fleet reliability metrics across hardware vintages and seasons.
  - - Long-horizon hardware reliability disclosure
    - Thin
    - Failure rates, warranty claims, and cycle-life outcomes
    - Retained set does not publish independent field failure or warranty-claim statistics
    - Request claims data, reserve policy, replacement rates, and service-cost history.
  notes: Statuses reflect externally reviewable evidence at run date; they should not be read as a full substitute for installer-only or NDA diligence materials.
