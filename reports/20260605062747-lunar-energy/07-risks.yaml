  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: jurisdictional-safety-approval-friction
    missingEvidence: A jurisdiction-by-jurisdiction matrix of AHJ, utility, insurer, and fire-marshal requirements for UL 9540B or equivalent residential ESS test evidence in Lunar's target markets.
    whyItMatters: Category-level safety scrutiny can slow permitting, increase soft costs, or force design changes even if Lunar itself has not suffered a public incident.
    diligencePath: Request Lunar's AHJ approval matrix, permit rejection logs, insurer questions, and any market-specific safety packets used with installers.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue, devices-under-management, and gross-margin contribution split by Sunrun versus all other installers, utilities, aggregators, and finance-linked partners.
    whyItMatters: Public VPP proof is strong, but it may overstate diversification if a single anchor partner dominates software revenue or growth expectations.
    diligencePath: Request top-10 partner concentration by revenue and device count, contract duration, termination rights, and approved-vendor-list constraints by partner.
    relatedQuestionRefs:
    - QR017
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: warranty-and-service-economics
    missingEvidence: Cohort-level field-failure curves, warranty-claim rates, replacement-cost history, truck-roll frequency, and the current warranty reserve policy for deployed Lunar systems.
    whyItMatters: Battery certifications and installer tooling reduce risk, but hardware economics can still deteriorate quickly if service costs or replacements spike after scale-up.
    diligencePath: Request 12-, 24-, and 36-month service cohorts, component failure by SKU, warranty reserve methodology, and gross-to-net margin after service expense.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: governance-and-disclosure
    missingEvidence: Board-level risk reporting, audited or reviewed unit-economics packages, counterparty exposure by channel, and any internal incident, complaint, or cancellation dashboards.
    whyItMatters: The public record is good enough to identify risk categories, but not good enough to underwrite reserve adequacy, channel concentration, or governance maturity with public-company precision.
    diligencePath: Request quarterly board materials covering risk, compliance, warranty reserves, financing mix, complaint backlog, and partner concentration trends.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
