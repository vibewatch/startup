- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - California economics reset
    - Post-install customer payback and attach economics
    - Payback or bill-savings case weakens materially versus NBT assumptions across top utilities
    - Cut valuation, require utility-level cohort economics before adding exposure
  - - Financing partner fragility
    - Installer payment delays or finance-provider distress
    - Material milestone-payment delays, insolvency, or abrupt AVL tightening at a top finance/TPO partner
    - Pause growth assumptions tied to financed installs and refresh channel model
  - - Safety / recall spillover
    - AHJ questions, recalls, or public incidents
    - Any Lunar-specific safety event or evidence that target jurisdictions require test data Lunar cannot quickly supply
    - Move thesis to capital-preservation mode until safety packet and remediation plan are verified
  - - Service and warranty drag
    - Truck rolls, replacements, and reserve adequacy
    - Failure or replacement cohorts imply service cost is overwhelming product margin
    - Treat hardware scale as value-destructive until reserve and service model are re-underwritten
  - - Partner concentration
    - Sunrun and top-channel dependence
    - One partner still dominates public proof or revenue without visible diversification over the next refresh cycle
    - Cap software-growth multiple and require signed diversification evidence before expansion
  notes: Kill criteria are designed as monitorable underwriting thresholds, not as predictions that any one failure is already occurring today.
