- id: safety-service-and-warranty-risk
  title: Safety, service, and warranty exposure
  body: 'The operational risk lens is category-led, and that distinction matters. There is no retained public evidence of a Lunar-specific recall or fire. But the home-battery category has already produced recall portals, product-notification regimes, and enough incident scrutiny that U.S. fire officials wanted more realistic residential test data on adjacent batteries and nearby combustibles. The key underwriting point is therefore not “Lunar had an incident,” but “Lunar sells into a category where one incident anywhere can tighten local permitting and customer trust everywhere.” That matters more in California, where deployment density and regulator attention are both high.


    Lunar does show meaningful mitigation maturity. Public pages describe certifications, cyber controls, commissioning tools, proactive monitoring, modular serviceability, and installer support. Those are positive signs, but they are still control claims rather than lifetime loss data. The public set does not disclose field-failure curves, warranty-claim rates, reserve policy, or service-cost history. For a hardware-plus-software company, that omission is material. The residual risk is that service economics worsen only after volume ramps, at which point certifications help brand defense but do not automatically protect gross margin.'
