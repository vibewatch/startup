sections:
- id: identity-operating-model
  title: Identity, founding, and operating model
  body: 'Lunar Energy is a home battery and virtual power plant software company founded in August 2020 by former Tesla Energy leader Kunal Girotra. Public company materials consistently frame the business around a simple thesis: homeowners do not just need a battery, they need an integrated personal power plant that generates, stores, dispatches, and monetizes electricity with software doing the coordination in the background. That positioning matters because the company is not selling a stand-alone battery pack; it is selling a combined hardware and software stack that can help homeowners arbitrage utility tariffs, maintain outage backup, and participate in grid programs. The core system combines solar maximizers, battery modules, inverter hardware, a bridge or smart-panel layer, the Lunar app, and the Gridshare orchestration platform.


    The operating model is also more vertically integrated than many residential storage peers. Lunar says it designs the full system in California and assembles products in Georgia and Washington. The 2022 Moixa acquisition is central to that model because it added GridShare software, installed device relationships in Europe and Japan, and a large historical optimization data set that Lunar says it uses to improve forecasting and dispatch. That hardware-plus-software thesis is now also part of the commercial narrative: independent coverage notes Lunar pricing is roughly a premium to Tesla on comparable installs, but management argues the comparison only works when the extra integrated hardware and software layers are included. In other words, Lunar is trying to win as a platform company rather than as the cheapest battery vendor.'
  claimRefs:
  - CO001
  - CO002
  - CO003
