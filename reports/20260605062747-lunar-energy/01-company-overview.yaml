- id: leadership-footprint-channel
  title: Leadership, footprint, and channel structure
  body: 'The company is still strongly associated with its founder. Kunal Girotra remains the public face of Lunar, and his prior role leading Tesla Energy is an important part of the underwriting story because Lunar is trying to solve a manufacturing-plus-software problem that has defeated many more narrowly focused solar or battery startups. Public sources support Mountain View as headquarters, with an early London presence retained through the Moixa integration. The about page highlights functional leaders in architecture, software product, legal and people, finance, and revenue, showing that Lunar is no longer just a founder-and-engineering organization even if the governance structure remains opaque from public materials.


    Lunar’s route to market is also clearer than its formal governance. The company says it sells through certified installation partners rather than direct national retail branches. Sunrun is the anchor relationship, and the founder letter adds that dozens of additional installers are active in California. That matters because installation-channel access is one of the hardest bottlenecks in residential energy storage. Public hiring pages suggest the company is still building engineering, program, and commercial capacity, but current headcount remains imprecise: the 2022 launch press release referenced nearly 250 employees globally while a 2026 private-market tracker lists 226 employees. Review surfaces show a similarly mixed picture. Glassdoor is relatively strong, while Blind is materially weaker, which does not prove a company-wide talent problem but does suggest team-level management variance worth testing in diligence.'
  claimRefs:
