- id: milestones-proof-points-risks
  title: Milestones, public proof points, and early contradictions
  body: 'Lunar’s milestone record shows a startup that moved from stealth and platform assembly into commercial rollout rather than a company that only raised money on promise. The key sequence is: founding in 2020, public emergence and Moixa acquisition in 2022, California commercial launch in early 2025, broader utility and CCA partnerships around Gridshare, and a large financing event in early 2026 tied to expansion outside California. Utility-facing milestones are important because they show Lunar is not limited to selling backup boxes. Peninsula Clean Energy, Silicon Valley Clean Energy, and Ava Community Energy all publicly named Lunar or Gridshare in demand-flexibility and virtual power plant contexts, with PCE and SVCE aiming to aggregate up to 25 MW over time.


    There is also real public product proof. EnergySage customer reviews are strong, and Lunar’s own customer-story page contains specific economic anecdotes such as nearly 80% bill reduction and seasonal savings from optimization. But two categories of contradiction remain. First, valuation data is not clean: PremierAlts shows a $1 billion market-implied value and $532 million total raised, while Forge shows a much lower Series D-1 value and stale funding totals. Second, internal sentiment is mixed: Glassdoor looks healthy, but Blind does not. Neither issue is fatal, yet both are important reminders that the strongest public evidence for Lunar still comes from company, partner, or investor narratives rather than audited financial or governance disclosures.'
