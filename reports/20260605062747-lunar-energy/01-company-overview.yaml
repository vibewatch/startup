  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-profitability
    missingEvidence: Lunar does not publicly disclose revenue, gross margin, burn, or profitability for either hardware sales or Gridshare software.
    whyItMatters: Without financial statements, investors cannot test whether scale in installations and devices under management translates into durable unit economics or a credible path to breakeven.
    diligencePath: Request management accounts, gross margin by hardware/software segment, and a three-year forecast during formal diligence.
    relatedQuestionRefs:
    - QO025
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Private-market trackers disagree materially on Lunar's latest valuation and even on total funding raised.
    whyItMatters: Entry price discipline depends on a trustworthy post-money figure; conflicting tracker data can distort return underwriting and indicate stale cap-table records.
    diligencePath: Request the latest cap table, Series D share price, and board-approved financing summary; verify against at least one institutional data provider.
    relatedQuestionRefs:
    - QO020
    - QO021
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: headcount-current
    missingEvidence: No authoritative public source reconciles Lunar's current employee count across Mountain View, London, and contract manufacturing partners.
    whyItMatters: Execution capacity in manufacturing, software support, and channel enablement depends on actual staffing, not legacy 2022 or tracker estimates.
    diligencePath: Request an org chart and current employee census by function and location.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
    - TO002
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Public sources do not clearly identify Lunar's current board composition, voting controls, or any special rights held by strategic investors such as Sunrun or SK Group.
    whyItMatters: Governance rights influence future financing flexibility, exit timing, and potential channel conflicts with strategic investors.
    diligencePath: Request the board list, investor rights agreement, and any commercial side letters with Sunrun, SK Group, Itochu, or Honda.
    relatedQuestionRefs:
    - QO022
    - QO025
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: The public record does not pin down every exact date and commercial detail behind Lunar's utility-program and expansion milestones in the chronology.
    whyItMatters: The milestone table is directionally useful for underwriting progress, but precise dating is still needed to test execution speed and sequence against financing events.
    diligencePath: Request an internal company timeline that ties utility program launches, state entries, and product releases to dated board materials or commercial contracts.
    relatedQuestionRefs:
    - QO015
    - QO024
    relatedTableRefs:
    - TO004
