  - id: private-comps-and-strategic-reads
    title: Private comparables and strategic valuation reads
    body: |
      Private comparables are directionally helpful because they show how investors have recently priced residential battery and VPP stories before they reach public-market disclosure standards. Base Power is the clearest current comparator because the business model is explicit: in 2025 it raised $200M in Series B, then another $1B in Series C at a reported $3B pre-money valuation. Base also disclosed concrete commercialization signals, including more than 100 MWh sold in Texas and an official website claim of 20,000+ homes powered. That is not a one-for-one comp to Lunar, but it demonstrates that investors will support multi-billion private marks when commercialization, pricing, and customer value capture are made public.

      The contrast matters. FranklinWH's $25M Series B and 1,000-plus installer onboarding point to a much smaller, earlier private benchmark. sonnen is a strategic-value reference: Shell bought it outright in 2019, and sonnen still markets VPP-ready storage, but the transaction does not provide a current stand-alone valuation. Put differently, private comps do not prove Lunar is overvalued or undervalued on their own. They do show that Lunar sits between far smaller venture-stage peers and much more explicit premium platforms. That middle position supports upside, but only if Lunar's undisclosed economics are closer to the premium side than the opaque side.
    claimRefs:
      - CV025
