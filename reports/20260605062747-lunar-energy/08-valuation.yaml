schemaVersion: report-v2
artifact: valuation
slug: lunar-energy
runDate: '2026-06-05'
company:
  name: Lunar Energy
chapter:
  number: 8
  title: Valuation
  summary: "Lunar's public valuation evidence supports a wide current mark range rather than a single clean number: official funding disclosures support about $532M raised, PremierAlts shows a $1B market-implied value, Forge shows only about $452M, and Notice shows a $1.58 share-price signal without enough context to convert it. Public comps show residential-energy equities can trade anywhere from distressed low-single-digit EV/revenue to premium software-leaning multiples, but Lunar discloses no revenue, margin, burn, or preference stack. The result is a diligence-gated stance: attractive near the low tracker range, conditionally fair around $1B, and stretched materially above that on public evidence alone."
sections:
  - id: recommendation-and-thesis
    title: Recommendation, thesis, and anti-thesis
    body: |
      The valuation conclusion is not that Lunar lacks evidence of substance; it is that the public file proves a real business faster than it proves a precise price. Official disclosures support a company that has raised meaningful capital, shipped an integrated battery-plus-software product, and expanded from stealth into thousands of deployments and hundreds of megawatts under management. That is enough to reject the idea that Lunar is only a slide-deck story. It is not enough to justify a confident mark on the same terms as a public company with disclosed revenue, gross margin, and liquidity.

      The bull thesis is straightforward: integrated hardware plus optimization software plus virtual-power-plant participation can create a higher-quality business than a battery vendor alone, and Lunar's funding base suggests investors still see that possibility. The anti-thesis is equally straightforward: the same public record still omits revenue, cash burn, debt, cap-table structure, and preference terms, while sector financing conditions have worsened. That makes the investment case price-sensitive. On public evidence alone, the right recommendation is track or research-more rather than a clear buy. A low-end secondary-style mark could be attractive; a current mark near $1B is only conditionally supportable.
    claimRefs:
      - CV004
      - CV008
      - CV009
      - CV011
      - CV038
      - CV039
      - CV040
      - CV043
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
      - FV004
  - id: financing-signals-and-current-mark
    title: Financing chronology, tracker conflict, and current mark discipline
    body: |
      Lunar's strongest valuation anchor is not a disclosed post-money valuation but a disclosed financing chronology. The company said in August 2022 that it had raised $300M over two rounds, then said in February 2026 that a $102M Series D followed a previously unannounced $130M Series C. That arithmetic supports about $532M of lifetime capital raised. The problem starts immediately after that. PremierAlts currently shows Lunar at a $1B market-implied valuation and repeats the $532M funding total. Forge, by contrast, shows a February 2026 Series D-1 valuation of only $452.15MM and total funding of just $278.26MM. Notice contributes only a $1.58 stock-price signal without the share-count or security details needed to translate that into a reliable company valuation.

      Those conflicts are too large to smooth away. The honest read is that public trackers disagree on both the size of the company and the security being observed. That means a unicorn framing is lightly evidenced rather than well corroborated. It also means investors should separate three questions that are often collapsed into one: what Lunar officially raised, what a specific tracker thinks one line of securities is worth, and what a new investor should pay today after dilution and preferences. Because Lunar does not publicly disclose revenue, burn, debt, or liquidation preferences, current-mark discipline has to stay range-based rather than point-estimate based.
    claimRefs:
      - CV001
