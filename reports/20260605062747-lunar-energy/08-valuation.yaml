    figureRefs: []
  - id: scenarios-adverse-context-and-diligence
    title: Bull, base, and bear framing under an adverse market backdrop
    body: |
      The skeptical evidence matters because Lunar sells into a channel where valuation can compress before company-specific weakness is publicly visible. Mosaic's Chapter 11 and Sunnova's bankruptcy showed how quickly rising rates, policy uncertainty, dealer-payment stress, and tighter financing can break residential solar-and-storage intermediaries. Roth Capital's 2026 projection for a 33% decline in U.S. residential solar installations and Wood Mackenzie's warning that installer customer-acquisition costs could spike 40% in 2026 add a second layer of caution: even capable companies may need to work through a worse financing and customer-acquisition environment than earlier 2021-2023 marks implied.

      That adverse backdrop is why the chapter keeps wide scenario bands. Bear case, roughly $0.25-0.6B, reflects channel and financing stress, a down-round, or evidence that revenue quality is weaker than current traction messaging suggests. Base case, roughly $0.7-1.3B, assumes Lunar's official operating proof is real enough to defend something around the current upper tracker range but not enough to support a much richer step-up without fresh disclosure. Bull case, roughly $1.5-2.5B, requires the company to translate hardware-plus-software traction into disclosed revenue and margin evidence that looks more like a premium platform than a capital-hungry hardware vendor. That is possible, but not yet publicly proven.
