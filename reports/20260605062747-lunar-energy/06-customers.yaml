    severity: material
    topic: channel concentration
    missingEvidence: Partner-level revenue, installation volume, managed-capacity concentration, and finance mix by provider.
    whyItMatters: A large share of customer acquisition or software volume may depend on a small number of installers or partners.
    diligencePath: Request top-partner concentration, Sunrun share of deployments, and installer volume distribution by state.
