- id: utility-and-vpp-customer-proof
  title: Utility, CCA, and VPP customer proof
  body: |-
    The utility-side evidence is credible, but it proves a different kind of customer than the homeowner stories do. Peninsula Clean Energy and Silicon Valley Clean Energy officially name Lunar's Gridshare DERMS as the platform they will use to connect and optimize batteries, heat-pump water heaters, thermostats, and commercial energy-management systems, with a target of up to 25 MW over five years. Ava likewise names Lunar as the software partner for its VPP strategy. These are important references because they show that public-sector or program operators are willing to put Lunar into grid-facing workflows, not just into marketing pages.

    Sunrun adds the multi-market channel proof. Third-party coverage says Sunrun uses Gridshare across more than a dozen markets, and one Energy-Storage.news piece cites both a 60% improvement in dispatch performance for a Southern California Edison program and fast-frequency-response services in Hawaii. Taken together, the evidence shows real software-side customers and real grid participation. The caution is that most of this proof lives in software orchestration and program management, not in a disclosed roster of diversified non-residential hardware buyers.
