tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / signal
  - Revenue / strategic value
  - Gap
  rows:
  - - California homeowner with solar + storage
    - Buyer and user = household; payer = homeowner or finance provider
    - TOU bill reduction, outage backup, app visibility, future electrification
    - Ten named homeowner stories retained; stories cite PG&E, NEM 3.0, outages, EVs, and cooling loads
    - Core hardware demand signal and source of VPP dispatch capacity
    - No public breakout of active customers by utility, system size, or attach rate
  - - Installer partners
    - Buyer = installer/channel partner; user = installer operations and service teams; payer = installer business
    - Quote, commission, configure, and service the system
    - Installer page plus repeated homeowner praise for install partner and support quality
    - Critical conversion and service layer; materially shapes customer trust
    - No public list of active certified installers or install volume by partner
  - - Finance / TPO layer
    - Buyer = finance or lease platform; user = homeowner; payer = homeowner via lease/PPA
    - No-upfront-cost adoption and transferability
    - pv magazine says many deployments are residential leases; Jacquelyn cites lease transferability and Sunrun obligations
    - Can expand addressable demand for cash-constrained or tenure-uncertain households
    - No disclosure of lease mix, renewal terms, or counterparty concentration
  - - CCA / utility / program operator
    - Buyer and payer = CCA or utility; user = program staff and participating households
    - DERMS, VPP aggregation, demand flexibility, and dispatch reliability
    - PCE, SVCE, Ava, and Sunrun-linked programs publicly named
    - Software revenue, grid credibility, and customer earnings catalyst
    - Hardware revenue share versus software/program revenue is not public
  - - Regional sellers / distributors
    - Buyer = reseller or channel seller; user = homeowner with installer handoff; payer = retail customer or finance partner
    - Regional product availability and lead generation
    - Signature Solar lists seven states; Sunrun AVL shows formal equipment gatekeeping
    - Supports state expansion without full direct-sales build-out
    - Sell-through volume, attach rate, and geographic performance are not public
  notes: Rows summarize the visible public customer stack rather than a disclosed revenue segmentation. Public proof is strongest for California households and program operators, not for a complete enterprise roster.
