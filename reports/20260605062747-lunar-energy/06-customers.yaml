- id: named-homeowner-proof-and-outcomes
  title: Named homeowner proof and quantified outcomes
  body: |-
    The strongest customer evidence in this chapter is not a logo wall; it is a set of named homeowner stories with concrete outcomes. Brandon describes an approximately 80% bill reduction after pairing solar with Lunar. Jennifer reports both lower cooling-season bills and almost $300 of VPP earnings, plus a separate $335 summer benefit from Lunar AI versus standard self-consumption behavior. Steve reports a cut from more than $600 to $35 while keeping the house cooler. Percy reports more than 35 kWh dispatched back to the grid and cash payouts. These are still company-curated stories, so they should be treated as directional proof, not audited portfolio statistics, but they are materially better than generic marketing copy.

    The more subtle signal is that the stories are operationally detailed. Customers mention app walk-throughs, retrofit constraints, EV charging, outage behavior, and specific interactions with installers or support teams. That gives the proof more weight than generic praise. The limitation is representativeness. Public proof is broad enough to establish real use, but not broad enough to estimate average outcomes or cohort durability across the installed base.
