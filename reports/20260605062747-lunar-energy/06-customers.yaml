- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Installer-first channel can scale without a giant direct sales force
    - Conversion and service quality depend on installer execution
    - Bad installer experiences can damage the brand even if the battery performs
    - Request installer count, active install volume by partner, and service SLA by channel
  - - Residential leases / PPAs lower adoption friction
    - Finance-provider failure or weak servicing can damage customer trust
    - Customer economics may depend on counterparties Lunar does not fully control
    - Request financing-partner roster, default experience, and renewal / transfer data
  - - Sunrun and utility programs expand Gridshare reach quickly
    - Public software-side proof may be concentrated in a small number of large partners
    - A single partner can matter disproportionately for multi-market visibility and volume
    - Request partner-level revenue or managed-capacity concentration
  - - California rate pain and outage risk make the product resonate
    - Public customer proof is still geographically concentrated in California
    - The public story may overstate portability to other utility territories
    - Request installs, win rates, and VPP participation by state and utility
  - - Positive stories and ratings improve trust
    - There is still no public churn, NRR, or cohort-retention dataset
    - Happy anecdotes do not prove durable unit economics or support scalability
    - Request active-customer cohorts, warranty claims, and repeat-VPP participation by install quarter
  notes: Risks focus on concentration and durability gaps visible from the public record. They do not imply failure, only that the public evidence is narrower than the marketed opportunity.
