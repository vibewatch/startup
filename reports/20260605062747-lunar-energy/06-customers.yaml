  - type: missing-source
    severity: material
    topic: retention metrics
    missingEvidence: Portfolio-level NRR, GRR, churn, renewal, and active-system retention by install cohort.
    whyItMatters: Without retention math, positive stories cannot be translated into durable revenue or service economics.
    diligencePath: Request cohort tables by install quarter, including active systems, warranty replacements, and VPP participation persistence.
    relatedQuestionRefs:
