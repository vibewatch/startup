      - number: '2.2'
        title: 规模测算视角：峰值负荷需求、现有 VPP 规模与 California 采用率
        blocks:
          - type: paragraph
            body: >-
              对 Lunar 做可信的市场规模测算，不能只靠一个醒目的总可用市场（TAM）。第一层视角是电网问题本身：DOE 称，美国到 2030 年需要超过 200 GW 新增峰值需求资源，而 80-160 GW 的 VPP
              可以以经济方式覆盖其中 10-20%，并每年节省约 $10 billion。第二层视角是当前 VPP 规模。DOE 和 DOE 相关材料描述了约 30-60 GW 现有 VPP 容量，并在 2025 年更新中给出
              North America 33 GW；Wood Mackenzie 后来报告运营容量为 37.5 GW。具体数字会随方法不同而变化，但方向性结论很强：这个品类已经真实存在，不只是理论上的试点软件。


              第三层视角是 California，这是 Lunar 所在品类最重要的早期市场。CPUC 称，California 占美国用户侧光伏容量的三分之一以上；到 2024 年底，近 70%
              的净计费电价客户已把电池与光伏配套。对 Lunar 来说，这个配套率比泛泛的全国光伏数量更有意义，因为它说明客户已经在响应奖励储能调度的政策。SEIA 又给出全国增长视角：2025 年住宅储能容量增长
              51%，累计住宅电池容量达到 9.5 GWh；即使 2026 年第一季度住宅部署环比下滑，市场到 2030 年仍预计会强劲增长。
