  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政策、费率与项目依赖
        blocks:
          - type: paragraph
            body: >-
              Lunar
              的一阶风险不是某个已披露的公司事件，而是商业模式叠在不断变化的加州和联邦政策层之上。加州净计费制度如今按电网价值费率支付回售抵扣，通常低于购电费率；它把客户推向特定电气化分时电价计划，也让电池经济性高度依赖费率。这个变化仍可能推动储能搭售，但也压缩了定价、安装质量和软件优化的容错空间。SGIP
              仍有意义，但可触达资金池越来越偏向定向、流程重的项目，而不是覆盖面广、容易拿到的屋主返利。DSGS 也是真实机会，但它是季节性、按绩效付费且受运营约束，并非通用年金。


              联邦税收政策进一步放大不确定性。Section 48E 仍支持储能，但价值取决于劳工、国产内容和资格规则；对渠道驱动的住宅堆栈来说，这些规则操作起来并不简单。于是 Lunar
              的风险画像变成：公司必须不断把变化中的监管转译成安装商行为、客户经济性和采购选择。单靠这一点不会打破投资逻辑，但相比监管较少的软件业务，Lunar 的增长格外暴露在政策解读、费率设计和加州项目管理之下。
