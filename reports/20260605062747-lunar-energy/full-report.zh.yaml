      - number: '1.4'
        title: 里程碑、公开证明点与早期矛盾
        blocks:
          - type: paragraph
            body: >-
              Lunar 的里程碑记录显示，这是一家从隐身和平台拼装走向商业推出的初创公司，而不是只靠愿景融资的公司。关键顺序是：2020 年创立，2022 年公开亮相并收购 Moixa，2025 年初在 California
              商业发布，围绕 Gridshare 扩大公用事业和 CCA 合作，并在 2026 年初完成一轮与 California 以外扩张相关的大额融资。面向公用事业的里程碑重要，因为它说明 Lunar
              不只是在卖备电盒。Peninsula Clean Energy、Silicon Valley Clean Energy 和 Ava Community Energy 都在需求灵活性和虚拟电厂语境下公开点名
              Lunar 或 Gridshare，其中 PCE 和 SVCE 的目标是随时间聚合最高 25 MW。


              公开产品证据也确实存在。EnergySage 客户评价很强，Lunar 自己的客户故事页面也包含具体经济案例，例如账单接近 80%
              降幅、靠优化获得季节性节省。但仍有两类矛盾。第一，估值数据并不干净：PremierAlts 显示 $1 billion 的市场隐含价值和 $532 million 累计融资，而 Forge 显示低得多的
              Series D-1 价值和过时融资总额。第二，内部情绪混合：Glassdoor 看起来健康，Blind 则不然。两点都不致命，却提醒我们，Lunar
              最强的公开证据仍来自公司、合作伙伴或投资人叙事，而不是经审计的财务或治理披露。
