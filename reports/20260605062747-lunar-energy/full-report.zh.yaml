      - number: '1.2'
        title: 领导层、布局与渠道结构
        blocks:
          - type: paragraph
            body: >-
              公司仍与创始人强绑定。Kunal Girotra 依然是 Lunar 的公开门面；他此前领导 Tesla Energy 的经历，也是尽调叙事的重要部分，因为 Lunar
              要解决的是制造加软件难题，而许多更聚焦单点的光伏或电池初创公司都败在这里。公开来源支持 Mountain View 为总部，Moixa 整合后保留了早期 London
              布局。关于页面重点展示了架构、软件产品、法务与人事、财务和收入等职能负责人，说明 Lunar 已不再只是创始人加工程团队的组织，即使公开材料里的治理结构仍不透明。


              Lunar 的市场路径也比正式治理更清楚。公司称，它通过认证安装合作伙伴销售，而不是依赖直营全国零售网点。Sunrun 是锚定关系，创始人信还补充说，California
              有数十家其他安装商已经活跃。这一点重要，因为安装渠道入口是住宅储能最难打通的瓶颈之一。公开招聘页面显示，公司仍在补工程、项目和商业能力，但当前员工数并不精确：2022 年发布新闻稿提到全球近 250 名员工，而
              2026 年私募市场追踪平台列出 226 名员工。员工评价也呈现类似的混合图景。Glassdoor 相对强，Blind 明显弱；这不能证明公司层面有人才问题，但确实提示尽调中要测试团队层面的管理差异。
