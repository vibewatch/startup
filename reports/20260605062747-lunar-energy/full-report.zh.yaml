      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Lunar 最强的技术优势，是把不绑定光伏的部署、15–30 kWh 模块化容量和 App 原生 VPP 编排放进同一个方案。这是一个有用的中间地带：Tesla 和 Base
              在面向客户的电力经济性上证据更强，而 Enphase、SolarEdge 和 FranklinWH 对已经嵌在其硬件生态里的客户更有吸引力。定价是公开信息中最大的不对称。Tesla、Base 和 sonnen
              公开的信息足以锚定比较，但 Lunar 的公开页面强调节省和付款，而不是有代表性的已安装价格。这使得 Lunar 很难与 Base 的 $695 加每月 $19 方案，或 sonnen-Solrite 每月
              $20 项目精确对标，尽管 Lunar 的功能集更接近高端全屋系统，而不是纯光伏改造。GTM 也大不相同。Sunrun 赢在订阅触达和已披露机队规模，Base 赢在公用事业与零售电力合同，Tesla
              赢在品牌认知。Lunar 的市场进入在产品适配上可信，但在渠道规模和合同杠杆上，仍不如最大在位者扎实。
