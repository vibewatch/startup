      - number: '8.2'
        title: 融资时间线、跟踪数据冲突与当前估值纪律
        blocks:
          - type: paragraph
            body: >
              Lunar 最强的估值锚不是已披露的投后估值，而是已披露的融资时间线。公司在 2022 年 8 月称两轮融资合计 $300M，随后在 2026 年 2 月称 $102M Series D 接在此前未公告的
              $130M Series C 之后。这个算术支持累计融资约 $532M。问题紧接着出现。PremierAlts 目前显示 Lunar 的市场隐含估值为 $1B，并重复 $532M 的融资总额。相比之下，Forge
              显示 2026 年 2 月 Series D-1 估值仅 $452.15MM，累计融资也只有 $278.26MM。Notice 只贡献一个 $1.58 的股价信号，没有把它转成可靠公司估值所需的股数或证券细节。


              这些冲突太大，不能平滑处理。诚实读法是，公开跟踪机构对公司规模和被观察证券都存在分歧。这意味着独角兽叙事只是轻度有证据，而非充分交叉印证。也意味着投资者应拆开三个常被揉在一起的问题：Lunar
              官方融资多少、某个具体跟踪机构认为某一类证券值多少，以及考虑稀释和优先权后新投资者今天该付多少钱。由于 Lunar 没有公开披露收入、烧钱、债务或清算优先权，当前估值纪律必须保持区间思维，而不是点估计。
