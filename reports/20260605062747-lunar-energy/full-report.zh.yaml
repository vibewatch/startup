  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              估值结论并不是 Lunar
              缺少实质证据，而是公开档案更能证明业务真实，却还不能证明价格精确。官方披露支持这样一家公司：它筹集了可观资本，交付了一体化电池加软件产品，并从隐身状态扩展到数千次部署和数百兆瓦在管规模。这足以否定「Lunar
              只是 PPT 故事」的说法。但若要像评估一家披露收入、毛利率和流动性的上市公司那样给出有信心的估值标记，证据还不够。


              乐观逻辑很直接：一体化硬件、优化软件和虚拟电厂参与叠加，可能创造出比单纯电池供应商更高质量的业务；Lunar
              的融资基础说明投资者仍看得到这种可能。反向逻辑同样直接：同一份公开记录仍缺收入、现金消耗、债务、股权结构和优先权条款，而行业融资条件已经变差。这让投资案例对价格敏感。仅凭公开证据，更合适的建议是观察或继续研究，而不是明确买入。低端老股交易式估值可能有吸引力；接近
              $1B 的当前标记只有在条件满足时才站得住。
