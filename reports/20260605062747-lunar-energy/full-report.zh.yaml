chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、创立与运营模式
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy 是一家家用电池和虚拟电厂软件公司，前 Tesla Energy 负责人 Kunal Girotra 于 2020 年 8
              月创立。公司公开材料始终围绕一个简单判断：屋主需要的不只是电池，而是一座由软件在后台协调、能够发电、储电、调度并变现电力的个人电厂。这个定位重要，因为公司卖的不是独立电池包，而是一套硬件加软件栈，能帮助屋主吃到公用事业费率差、保留停电备电，并参与电网项目。核心系统把光伏优化器、电池模块、逆变器硬件、Bridge
              或智能面板层、Lunar App 和 Gridshare 编排平台放在一起。


              运营模式也比许多住宅储能同行更垂直整合。Lunar 称，它在 California 设计完整系统，并在 Georgia 和 Washington 组装产品。2022 年收购 Moixa
              是这个模式的核心，因为它带来了 GridShare 软件、欧洲和日本的已安装设备关系，以及 Lunar 称可用来改进预测和调度的大型历史优化数据集。硬件加软件的逻辑如今也写进了商业叙事：独立报道指出，在可比安装中
              Lunar 定价大约高于 Tesla，但管理层认为，只有把额外集成的硬件和软件层也算进去，这个比较才成立。换句话说，Lunar 想以平台公司取胜，而不是做最便宜的电池卖家。
