      - number: '2.4'
        title: 增长驱动、采用约束与可能出错之处
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动因素看得见、量得出。EIA 预计 2026 年住宅电价平均为每千瓦时 18.2 cents，同比上涨近 5%。CPUC 的净计费设计让白天外送电价值低于旧
              NEM，同时保留偶发的高价值晚间外送窗口，这直接提升了能把电能移到这些窗口的电池价值。SGIP 进一步压缩合格家庭的回本周期，储能激励最高达每千瓦时 $1,100，配套光伏支持最高达每千瓦 $3,100。DOE
              和 FERC 提供系统级顺风：VPP 可以参与批发市场、避开调峰电厂，并在某些情况下以有限前期公共投资快速启动。


              但公开证据也说明，这不会是一条直线采用曲线。Energy-Storage.news 强调，客户获取、留存和合作伙伴经济性是许多 VPP 策略的软肋。其 2026
              年市场评论还警告，第三方持有模式涌入可能留下一片失败融资方的坟场；这一点重要，因为安装商会跟随真正能成交的融资平台。Wood Mackenzie
              的评论又补充了一个约束：监管反弹和公用事业项目上限，可能让活动版图扩得快、实际运营容量加深得慢。结果是一个结构性需求优秀、政策支持真实的市场，但地方摩擦足够多，最终谁能捕获价值，取决于执行质量和渠道经济性。
