      - number: '7.5'
        title: 治理不透明、剩余敞口与终止标准
        blocks:
          - type: paragraph
            body: >-
              这里的治理风险是典型私营公司不透明，而不是已知丑闻。Lunar 公开了有用的控制面：认证、网络安全姿态、安装商工具、伙伴案例研究和一个正在运行的 DSGS
              报价。承销同样需要关注它没有公开的内容。保留的公开材料看不到经审计的单位经济、保修准备金、按收入划分的伙伴集中度、投诉积压或现场故障队列。这造成估值和治理问题：公司可能确实有缓释措施，但外部投资者还看不到这些措施是否便宜、可复制，或足以支撑规模化。


              这个缺口改变了投资案例的监控方式。投资逻辑不应只在灾难性事件发生时才破裂；如果慢变量证据显示模型比公开叙事更脆弱，也应破裂：加州经济性恶化、伙伴集中度无法分散、服务成本跑赢毛利，或安全 /
              合规要求拖慢安装。换句话说，只有尽调能把今天的控制声明转成硬运营证据，Lunar 才值得投资。在此之前，更合适的姿态是把公司视为对执行敏感、对伙伴敏感，且下行情景数学仍明显不透明。
