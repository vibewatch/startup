  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 改变判断的条件
    rows:
      - - 投资逻辑：Lunar 不只是电池 OEM
        - 官方披露把硬件、优化软件和 VPP 管理连在一起，公开运营证明也显示部署真实存在。
        - 若公开披露收入结构和毛利率，就能验证一体化模型是否真的改善经济性。
      - - 投资逻辑：公司资本量足以支撑竞争存在感
        - 官方披露支持截至 2026 年约 $532M 的累计融资，对一家年轻住宅能源平台来说已相当可观。
        - 若披露降价轮或紧急过桥融资，资本实力判断会迅速削弱。
      - - 投资逻辑：这个品类有机会拿到高溢价私募结果
        - Base Power 披露的 2025 年融资显示，只要商业化足够清楚，私募投资人会激进定价电池加电网业务。
        - 若 Lunar 无法在定价、客户经济性或规模上拿出类似透明度，同业参照的说服力会下降。
      - - 反向逻辑：当前估值标记缺乏锚定
        - PremierAlts、Forge 和 Notice 之间无法对齐，公开股数或股权结构表数据也缺失。
        - 若新一轮融资披露投后估值和证券条款，估值置信度会显著提高。
      - - 反向逻辑：行业脆弱性可能压过公司叙事
        - Mosaic、Sunnova、Roth 和 Wood Mackenzie 都指向住宅太阳能和储能领域的融资、政策和渠道压力。
        - 融资环境明显改善、获客成本压力下降，才会降低倍数压缩风险。
      - - 反向逻辑：经济性不透明限制倍数使用
        - 没有公开收入、毛利率、烧钱速度、现金跑道或清算优先权，投资人无法像锚定上市可比公司那样锚定 Lunar。
        - 若披露经审计收入、毛利率和优先权，上市可比框架会好用得多。
