  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 方案
      - 公开价格 / 合同
      - 包含能力
      - 证据状态
      - 对 Lunar 的含义
    rows:
      - - Lunar Energy
        - 代表性安装价未公开披露；产品页强调省钱和 $464 平均 VPP 收益
        - 15–30 kWh 模块化电池、9.6 kW 连续输出、App 管理 VPP、备用电源
        - 仅官方营销和 VPP 经济性页面
        - 公开定价不透明，削弱其相对 Base 或 sonnen 的直接价格主张
      - - Tesla Powerwall 3
        - EnergySage 显示激励前典型安装成本为 $13,473；SolarReviews 显示税费和激励前为 $15,300–$16,200
        - 13.5 kWh 电池、集成逆变器、备用电源、可选扩展包
        - 第三方安装价估计
        - 在自有电池模式下价值较强，但前期支出远高于公开订阅替代方案
      - - Enphase IQ Battery 5P
        - 官方页面无公开安装报价；Solar.com 称其价格点低于更大电池
        - 5 kWh AC 耦合电池、Enphase 软件、15 年保修
        - 官方规格加排名评论
        - 最适合现有 Enphase 家庭；作为一体化整屋套餐，吸引力较弱
      - - FranklinWH aPower 2
        - 公开评测称报价偏高端 / 高价；没有公开 MSRP
        - 15 kWh 电池、10 kW 输出、发电机与太阳能集成、15 年保修
        - 仅基于评测
        - 韧性备电产品很强，但公开经济性太不透明，不能说采用阻力低
      - - sonnen / Solrite Texas VPP 项目
        - 每月 $20，无前期安装费，零售电价 12¢ per kWh
        - 20–60 kWh sonnen 系统、零售电力计划、风暴前预充电和备电预留
        - Texas 公开项目价格
        - 经济性和不绑定太阳能安装上，最直接的 Lunar 公开订阅替代方案
      - - Generac PWRcell 2
        - 安装前起价约 $14,000
        - 9–36 kWh 储能、全屋备电定位、发电机联动、Ecobee 集成
        - 基于评测的价格
        - 适合优先考虑停电备电的家庭，但相对电池即服务方案价格偏高
      - - SolarEdge Home Battery
        - 全系统安装估计约 $10,000–$20,000
        - SolarEdge 集成电池、备电接口、Rate Saver 软件
        - 基于评测的宽口径估计
        - 主要适合作为现有 SolarEdge 家庭的锁定式加装件，不是价格领先者
      - - Sunrun 电池储能
        - 没有公开的独立电池价格；常打包进租赁或订阅结构
        - 光伏 + 储能、10 年覆盖、监控、DPP 收入分成
        - 官方产品页和市场评论
        - 融资覆盖面强，但公开价格透明度弱
      - - Base Power
        - 配送费前起价 8¢ per kWh，安装费 $695，月度会员费 $19 或 $29
        - 25–50 kWh 电池选项、零售电力、全屋备电、公用事业调度模式
        - 官方定价、FAQ 和新闻报道
        - Texas 最接近的低阻力经济替代方案，也是最清晰的定价基准
      - - 仅发电机备电
        - TXSES 对比中，便携式 $1,000 到全屋式 $7,000
        - 燃料型备电；只要有燃料，就能支撑较长时长
        - 行业协会对比
        - 部分家庭前期成本更低，但没有账单节省、没有 VPP 收入，运维负担也更重
    notes: 本表刻意区分公开订阅条款、基于评测的安装价估计，以及公开价格仍不透明的情形。「没有公开的独立电池价格」按证据缺口处理，而不是猜测。
