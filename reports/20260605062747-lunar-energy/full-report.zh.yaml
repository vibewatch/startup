      - number: '3.2'
        title: 竞争者画像：各自强在哪里
        blocks:
          - type: paragraph
            body: >-
              Tesla 仍是最明显的品牌在位者：产品强，在 Texas 有可见的零售电力整合，评价数据同时显示价格优势和持续的售后担忧。Enphase
              是最由生态驱动的替代方案，单机容量较低，但对已经标准化使用微型逆变器的屋主来说，安装商亲和力强，保修期也长。FranklinWH
              是最清晰的全屋韧性挑战者，尤其适合想要发电机兼容和超大扩展潜力的改造住宅，但其私营公司身份让耐久性不确定性高于公开市场领导者。sonnen 的 Texas 合作重要，因为它说明订阅式、仅电池的 VPP
              可以卖给有无光伏的家庭，与 Lunar 不绑定光伏的叙事重叠。Sunrun 和 Base Power 的重要性来自分销：Sunrun 有已披露的全国机队和订阅机器，Base
              则有最公用事业原生的公开电池项目结构。Generac 和 SolarEdge 分别带来发电机与逆变器主导光伏生态中的可信传统渠道，使竞争场更完整。
