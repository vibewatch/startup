  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 公开价值 / 状态
      - 收入质量判断
      - 尽调要求
    rows:
      - - Lunar System 硬件套件
        - 通过安装商和经销商销售电池模块、逆变器、桥接设备、断路器和捆绑系统
        - Signature Solar、BayWa 和 Greentech 可见在售 SKU 和捆绑包价格
        - 这是最具体的已披露收入触点，但实际 ASP 仍未知
        - 提供经销商价目表、实际净 ASP，以及按硬件配置拆分的毛利率。
      - - 嵌入式软件优化
        - Lunar AI 在硬件系统内调度充电、放电和备电行为
        - 产品页和投资人材料强调节省优化和自动电价响应
        - 明显属于产品价值主张，但独立软件费未披露
        - 将软件许可、附加率和续费经济性从硬件中拆出来。
      - - VPP / 电网服务价值分成
        - Gridshare 把电池和其他设备协调进公用事业或聚合商项目
        - 已披露客户侧平均年收益 $464；Lunar 抽成率未披露
        - 证据显示客户价值，不显示公司收入分成
        - 披露聚合商合同、公用事业费用，以及每户入组住宅留存的 VPP 毛利润。
      - - 安装商 / 渠道经济性
        - Sunrun 以及区域和全国安装商提供部署入口
        - 渠道策略已确认，但佣金、折扣和返利未披露
        - 可能降低直接 CAC，但会与伙伴分享经济性
        - 提供安装商利润堆叠、伙伴集中度和渠道冲突政策。
      - - 分销商 / 经销商销售
        - BayWa 和 Greentech 上架 Lunar 产品；Signature Solar 上架有标价的捆绑包
        - 把上市路径从单一战略伙伴拓宽出去
        - 终端动销、库存融资和退货情况都不可得
        - 按伙伴队列提供渠道库存周转、终端动销和退货折让。
      - - 服务 / 保修 / 支持
        - 保修支持、App 可视化和停电控制都是产品承诺的一部分
        - 12.5 年保修和 App 主导控制已公开
        - 如果故障率或上门派工率高，服务负担可能稀释毛利率
        - 提供保修准备金政策、单系统服务成本和故障率历史。
    notes: 已报告收入来源与变现推断分开处理。未知字段反映 Lunar 净收入或毛利润拆分未披露。
