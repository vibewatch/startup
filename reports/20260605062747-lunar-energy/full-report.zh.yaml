      - number: '1.3'
        title: 资本基础、规模指标与制造爬坡
        blocks:
          - type: paragraph
            body: >-
              Lunar 的资本故事比用户提供的背景更强，但也不相同。最有支撑的公开历史是：截至 2022 年 8 月，两轮合计融资 $300 million；随后在 2026 年 2 月披露新增 $130 million
              Series C 和 $102 million Series D。累计资本约 $532 million，而不是提示中“$300 million-plus 再 $300 million-plus”的模式。2026
              年这一轮引入 B Capital 和 Prelude 担任领投方，同时 Sunrun、Itochu、Q Capital、DCVC、Piva 和 Leitmotif
              等战略与气候科技投资人继续回归。投资人组合重要，因为它同时带来渠道入口、战略电池市场认知和后期增长资本。


              经营规模信号也有分量。Lunar 称，到 2026 年 2 月已部署数千套系统，并在多个大洲管理 650 MW 设备。Girotra 的创始人信给出更窄但仍有用的快照：超过 2,000 套系统、超过 40
              家安装合作伙伴。独立投资人与媒体报道大体印证，Lunar 已经商业化并在出货，不只是试点。下一个证明点是制造规模。多份 2026 年来源称，Lunar 计划到 2026 年底把年产量翻倍至 20,000 套，到
              2028 年底达到 100,000 套。如果爬坡落地，Lunar 在美国住宅储能中的相关性会明显提高；如果失手，即使软件定位强，集成逻辑中的硬件侧也会弱不少。
