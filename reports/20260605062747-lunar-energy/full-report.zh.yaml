        blocks:
          - type: paragraph
            body: >-
              本章最大的分析限制在于证据过于集中。可见客户群仍主要是加州家庭，可见软件买家仍是一小批 CCA、公用事业公司和 Sunrun 相关项目。这不等于真实客户群很窄，但意味着公开证据很窄。本组材料里最强的独立怀疑来源是
              NRG Clean Power 的评测，它明确提示履历有限、定价不清、安装商覆盖仍在发展。Blind 还给出一个偏弱的员工侧信任信号；这不是客户指标，但如果内部不稳定属实，服务或执行滑坡的概率会更高。


              年度回顾访谈用另一种方式强化了同一点：VPP 采用仍取决于节省、易用、信任和可行的融资伙伴。这与 Lunar
              自己筛选出的证据一致——证据重心明显放在客户信心和渠道质量上。公司看起来确实有真实客户和真实公用事业项目，但公开证据仍没有披露按渠道划分的客户集中度、按伙伴划分的收入贡献，或按安装队列划分的稳定留存。
