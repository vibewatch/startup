      - number: '8.5'
        title: 逆风市场背景下的乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >
              怀疑性证据很重要，因为 Lunar 卖进的渠道可能在公司特定弱点公开显现前就压缩估值。Mosaic 的 Chapter 11 和 Sunnova
              破产显示，利率上升、政策不确定、经销商付款压力和融资收紧，会以多快速度打断住宅太阳能与储能中介。Roth Capital 对 2026 年美国住宅太阳能安装量下降 33% 的预测，以及 Wood
              Mackenzie 警告安装商获客成本可能在 2026 年飙升 40%，又加了一层谨慎：即便有能力的公司，也可能需要穿越一个比 2021-2023 年早期估值标记所暗示更差的融资和获客环境。


              正因为背景不利，本章保留了宽情景区间。悲观情景约 $0.25-0.6B，反映渠道和融资压力、下调融资，或收入质量弱于当前牵引力叙事的证据。基准情景约 $0.7-1.3B，假设 Lunar
              的官方运营证据足够真实，能守住接近当前跟踪机构上沿的估值，但若没有新披露，还不足以支撑更大幅上调。乐观情景约
              $1.5-2.5B，要求公司把硬件加软件牵引力转成已披露的收入和利润率证据，看起来更像高溢价平台，而不是耗资重的硬件供应商。这是可能的，但公开证据尚未证明。
