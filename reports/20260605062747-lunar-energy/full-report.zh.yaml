  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局总览：直接对手、在位者与替代方案
        blocks:
          - type: paragraph
            body: >-
              Lunar 并不是在一个干净的单一产品类别里竞争。最接近的直接对手，是那些能把家用电池与电网变现或零售电力节省的具体路径配在一起的公司：Texas 的 Base Power、sonnen 由 Solrite
              支持的项目、Sunrun 的分布式电厂模式，以及 Powerwall 搭配 Tesla Electric 时的 Tesla。Enphase、FranklinWH、Generac 和 SolarEdge
              等在位电池厂商，即使缺少零售电力层，也在争夺同一个安装位置，因为屋主购买时仍会看韧性、安装商熟悉度和生态适配。现状替代方案同样重要。无电池的标准并网光伏仍会吸引以账单节省为目标的客户；对更看重长时停电覆盖、而不是软件和清洁能源功能的买方来说，发电机仍是后备选择。因此，证据指向的竞争场，不是单靠电芯化学定义，而是谁能把备电、软件、融资和面向公用事业的变现组合成一个低摩擦方案。
