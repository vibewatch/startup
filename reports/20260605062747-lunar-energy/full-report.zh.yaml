      - number: '4.3'
        title: 资本结构、估值冲突与资本强度
        blocks:
          - type: paragraph
            body: >-
              已报告资本方面，公开记录要强得多。Lunar 披露截至 2022 年 8 月已融资 $300 million，随后在 2026 年 Series C 和 D 中又融资 $232 million，意味着到 2026
              年初累计资本约 $532 million。2026 年融资明确绑定扩大安装基数、扩展 Gridshare 和提升产能。Canary 和 B Capital 补充了最有财务意义的背景：Lunar 正从约
              10,000 套年产能，到 2026 年底提升至 20,000 套，并在 2028 年达到 100,000 套，同时在美国多个州开展组装或生产活动。这些事实指向一家仍在消耗资本，以建设制造、库存和渠道触达的公司。


              估值语境远没有那么稳定。Forge 显示的 Series D-1 估值低得多，只有 $452.15 million，累计融资也只有 $278.26 million；PremierAlts 则显示 $1
              billion 估值和 $532 million 累计融资；Notice 给出 $1.58
              股价信号，但无法干净换算成公开市值。由于这些来源没有对齐方法，审慎做法是保留矛盾，而不是抹平它。同样重要的是不可得信息：Lunar 仍未披露现金、烧钱速度、现金跑道或债务，因此当前资本结构是否足够，无法直接尽调。
