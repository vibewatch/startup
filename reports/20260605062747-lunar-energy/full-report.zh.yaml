      - number: '8.4'
        title: 私营可比公司与战略估值读法
        blocks:
          - type: paragraph
            body: >
              私营可比公司有方向性帮助，因为它们显示，在达到公开市场披露标准之前，投资者最近如何给住宅电池和 VPP 故事定价。Base Power 是当前最清楚的可比对象，因为商业模式说得很明白：2025 年，它先完成
              $200M Series B，随后又以据报道 $3B 的投前估值完成 $1B Series C。Base 还披露了具体商业化信号，包括在德州售出超过 100 MWh，以及官网声称已为 20,000+
              户家庭供电。这不是 Lunar 的一比一可比公司，但它证明，只要商业化、定价和客户价值捕获公开可见，投资者会支持数十亿美元级的私营估值标记。


              差异同样重要。FranklinWH 的 $25M Series B 和 1,000 多家安装商入驻，指向规模小得多、阶段更早的私营基准。sonnen 是战略价值参照：Shell 在 2019
              年将其全资收购，sonnen 仍在营销支持 VPP 的储能，但该交易不能提供当前独立估值。换句话说，私营可比公司本身既不能证明 Lunar 高估，也不能证明低估。它们说明 Lunar
              位于更小的创业期同行和披露更充分的高溢价平台之间。这个中间位置支持上行情景，但前提是 Lunar 未披露的经济性更接近高溢价一侧，而不是不透明一侧。
