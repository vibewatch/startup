      - number: '8.3'
        title: 公开可比公司及其倍数能说明什么、不能说明什么
        blocks:
          - type: paragraph
            body: >
              公开可比公司能帮助框定倍数环境，但不能直接解决 Lunar 的估值，因为 Lunar 没有披露分母。2026 年 6 月，Sunrun 约以 5.58x EV/Sales 交易，Enphase 为
              6.21x，Generac 为 4.05x，SolarEdge 为 3.38x。这些公司不能互换。Sunrun 有融资强度和规模，也有复杂资本结构和该季度短期负现金生成。Enphase
              展示了更高利润率的硬件软件组合可能长什么样。Generac 说明，即便住宅储能本身疲软，备用电源仍能拿到稳健的特许经营估值。SolarEdge 说明复苏叙事可以和仍为负的盈利能力并存。Tesla
              的全公司倍数更高，但不是干净的住宅储能可比公司，因为汽车、AI、机器人和品牌可选性主导了股权故事。


              这个区间只在一个窄意义上有用：市场仍愿意为可信能源平台付钱，但对质量、透明度和业务组合的定价差异很大。这个区间不能用于 VC 常见捷径——「挑一个倍数乘以收入」——因为 Lunar
              不公布收入、利润率或分部组合。因此，公开可比公司提供的是语境，不是精度。它们说明高溢价标记原则上可能成立，但不能独立证明 Lunar 现在就配得上。
