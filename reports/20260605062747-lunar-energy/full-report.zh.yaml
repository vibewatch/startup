  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 硬件栈与规格边界
        blocks:
          - type: paragraph
            body: >-
              Lunar 的公开产品表面支持一个真实集成的硬件平台，而不是只有品牌的电池包。官方系统页面、组件说明和发布文章持续展示同一套栈：模块化电池块、混合逆变器、逐板优化器、Bridge 控制层、可选的
              meter-socket-adapter 连接，以及 Eaton 智能断路器。最重要的尽调点是，这些核心规格并非只由公司自报。EnergySage 和 Sunrun 都重复了同一个核心边界：15-30 kWh
              配置、9.6 kW 连续输出和 15 kW 峰值输出；Greentech 和 Signature Solar 则在渠道中展示实时组件和套装 SKU。这组证据让顶层产品定义可信。


              公开证据在 DC 耦合电池核心、模块化容量和集成负载控制故事上最强。对于每条改造路径或每种配件组合的完整兼容性矩阵，公开证据更薄。公司明确支持有无既有光伏的家庭，并提供 ConnectDER
              路径，但已抓取的公开材料中，一些底层硬件细节仍依赖合作伙伴列表和安装商文档。因此，硬件故事有说服力；边缘互操作性地图仍应放进安装商尽调，而不是交给投资人想象。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
