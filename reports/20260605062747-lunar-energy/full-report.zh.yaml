        - 中等可能性
        - 高可能性
        - 极高可能性
      rows:
        - label: 严重影响
          values:
            - ''
            - 住宅电池安全 / AHJ 审批摩擦
            - 加州政策与激励重置
            - 安装商 / 融资销售链条断裂
        - label: 高影响
          values:
            - 网络或数据事件
            - Sunrun 集中度
            - 保修准备金拖累
            - 客户自有太阳能收缩
        - label: 中等影响
          values:
            - 投诉升级
            - DSGS 变现上限
            - FEOC / AVL 采购摩擦
            - 关税适配执行
        - label: 一般影响
          values:
            - 标准切换
            - 残余投诉可见度
            - 项目注册流失
            - 合作伙伴多元化滞后
    claimRefs:
      - CR003
      - CR022
      - CR027
      - CR036
      - CR041
      - CR044
      - CR051
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 政策和交易对手冲击会沿客户经济性、安装商流动性、支持负荷和估值信心传导到 Lunar。
    data:
      nodes:
        - id: policy
          label: 政策 / 关税变化
          detail: NBT、SGIP、48E、FEOC、DSGS 规则
        - id: payback
          label: 客户经济性
          detail: 上网抵扣、税收抵免价值和账单节省逻辑
        - id: sales
          label: 销售转化
          detail: 房主需求和附加率
        - id: installer
          label: 安装商现金流
          detail: 里程碑付款、积压订单和服务能力
        - id: support
          label: 支持 / 保修负荷
          detail: 上门维修、更换和投诉处理
        - id: margin
          label: 毛利率
          detail: 服务费用和渠道经济性
        - id: revenue
          label: 收入增长
          detail: 硬件拉动销售和软件项目规模
        - id: valuation
          label: 估值 / 信心
          detail: 不确定性持续时，倍数会压缩
      edges:
        - from: policy
          to: payback
          label: 改变系统价值
        - from: payback
          to: sales
          label: 影响成交率
        - from: sales
          to: installer
          label: 改变吞吐量
        - from: installer
          to: support
          label: 驱动服务质量
        - from: support
          to: margin
          label: 抬高服务成本
        - from: sales
          to: revenue
          label: 决定部署量
        - from: margin
          to: valuation
          label: 压缩上行空间
        - from: revenue
          to: valuation
          label: 重置增长倍数
    claimRefs:
      - CR002
      - CR027
      - CR039
      - CR041
      - CR043
      - CR045
      - CR052
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Lunar 公开可见的增长路径依赖监管机构、安装商、融资结构，以及一个尤其重要的 VPP 伙伴。
    data:
      nodes:
        - id: lunar
          label: Lunar 运营
          detail: 硬件、软件、支持和渠道管理
        - id: installers
          label: 认证安装商
          detail: 销售、安装、调试并服务系统
        - id: sunrun
          label: Sunrun
          detail: 美国已披露的最大 Gridshare 验证点
        - id: financiers
          label: 贷款方 / TPO
          detail: 塑造可负担性和里程碑付款
        - id: cpuc-cec
          label: CPUC / CEC
          detail: 制定激励和 VPP 规则
        - id: tax-rules
          label: IRS / 美国财政部 / AVL 规则
          detail: 影响可融资设备选择
        - id: homeowners
          label: 房主
          detail: 需要节省、信任和可靠服务
      edges:
        - from: installers
          to: lunar
          label: 推动销售和服务
        - from: sunrun
          to: lunar
          label: 锚定可见 VPP 证据
        - from: financiers
          to: installers
          label: 为完工提供资金
        - from: cpuc-cec
          to: homeowners
          label: 设定经济性
        - from: tax-rules
          to: financiers
          label: 塑造承保
        - from: lunar
          to: homeowners
          label: 交付产品和支持
        - from: installers
          to: homeowners
          label: 传递信任
        - from: cpuc-cec
          to: lunar
          label: 设定变现规则
    claimRefs:
      - CR032
      - CR034
      - CR040
      - CR042
      - CR044
      - CR046
      - CR053
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐从真实运营证据出发，经过追踪平台冲突和披露缺口，落到对价格敏感的观察 / 继续研究立场。
    claimRefs:
      - CV004
      - CV008
      - CV009
      - CV036
      - CV039
      - CV040
      - CV043
    data:
      nodes:
        - id: n1
          label: 官方融资额
          detail: 2022 年 $300M 加上 2026 年 $232M，支撑真实融资基础。
          type: input
        - id: n2
          label: 运营证据
          detail: 已部署数千套、管理 650 MW，显示真实商业活动。
          type: input
        - id: n3
          label: 追踪平台冲突
          detail: PremierAlts 显示 $1B；Forge 显示约 $452M；缺少更多数据时，Notice 信号无法折算。
          type: input
        - id: n4
          label: 公开披露缺口
          detail: 没有公开收入、毛利率、烧钱速度、现金跑道、债务或优先股堆叠。
          type: input
        - id: n5
          label: 行业逆风
          detail: 政策、融资和渠道脆弱性可能压缩倍数。
          type: input
        - id: n6
          label: 当前标记区间
          detail: 把当前价值当作区间，而不是点估计。
          type: intermediate
        - id: n7
          label: 入场纪律
          detail: 更低价格有吸引力；接近 $1B 有条件合理；高于 $1B 则偏高。
          type: intermediate
        - id: n8
          label: 观察 / 继续研究
          detail: 只有在完成经济性和证券条款尽调后才推进。
          type: output
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n8
        - from: n7
          to: n8
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 目前公开 EV / 销售额口径看，大多数可比上市公司集中在中个位数，Tesla 则是不能拿来用的上限离群点。
    claimRefs:
      - CV015
      - CV017
      - CV019
      - CV021
      - CV023
      - CV024
    data:
      items:
        - label: Sunrun EV / 销售额
          value: 5.58
        - label: Enphase EV / 销售额
          value: 6.21
        - label: Generac EV / 销售额
          value: 4.05
        - label: SolarEdge EV / 销售额
          value: 3.38
        - label: Tesla 总 EV / 销售额
          value: 15.76
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前公开标记区间很宽；Lunar 没有披露收入或股权结构条款，情景价值区间还会进一步拉宽。
    approximationNotes: 这些区间是锚定公开追踪信号、上市可比公司环境和行业下行证据的情景估计；不是已报价的交易价格。
    claimRefs:
      - CV005
      - CV006
      - CV039
      - CV040
      - CV041
    data:
      items:
        - label: 当前公开标记（USD M）
          low: 452.15
          mid: 700
          high: 1000
        - label: 悲观情景价值（USD M）
          low: 250
          mid: 400
          high: 600
        - label: 基准情景价值（USD M）
          low: 700
          mid: 1000
          high: 1300
        - label: 乐观情景价值（USD M）
          low: 1500
          mid: 1900
          high: 2500
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式评分卡概括了 Lunar 为什么值得关注，但公开数据还不足以支撑溢价点估计。
    claimRefs:
      - CV004
      - CV011
      - CV024
      - CV036
      - CV043
    data:
      items:
        - label: 产品 / 平台叙事
          value: 7
          detail: 公开证据下，集成硬件、软件和 VPP 验证可信。
        - label: 融资证据
          value: 7
          detail: 官方融资历史很强，即使当前标记存在争议。
        - label: 公开估值清晰度
          value: 3
          detail: 追踪平台彼此冲突，缺少更多数据时 Notice 信号无法折算。
        - label: 经济透明度
          value: 2
          detail: 没有公开收入、毛利率、烧钱速度或优先股堆叠。
        - label: 上市可比公司支撑
          value: 5
          detail: 可比上市公司证明能源平台有市场，但无法为 Lunar 提供精确估值。
        - label: 行业背景
          value: 3
          detail: 政策、融资和安装商条件仍然不利。
        - label: 尽调就绪度
          value: 4
          detail: 可以给出区间式标记，但 IC 可用估值仍需要非公开数据。
