      - number: '6.5'
        title: 满意度、支持与留存盲点
        blocks:
          - type: paragraph
            body: >-
              公开满意度信号偏正面，但比真正的留存数据集薄得多。EnergySage 的 10 条评论给出 5.0 分，FeaturedCustomers 的 57 条参考评分给出
              4.7/5，说明早期口碑不错。客户故事里也有少见的具体服务细节： Lunar 团队周末发短信、一天内修好 app、多次提到安装商或 Lunar 员工回答问题，而不是售后消失。上述细节支撑了一个可信判断：
              服务响应是当前产品的一部分。


              但满意度不能等同于耐久性。保留材料里没有公开披露 NRR、GRR、流失率、续约、合同期限或按安装队列划分的留存。公开耐久性证据仍是轶事： 一户家庭扛过多次停电，另一位业主提到 6 个月无故障运行，还有人说 app
              改变了用电行为。这些能证明产品有效，但不足以支撑已安装基盘的经济性。结果就是典型的早期硬件不对称： 开心故事很多，组合层面的数学很少。
