      - number: '7.3'
        title: 融资、渠道与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              当前记录里最显眼的商业风险，不是客户需求归零，而是必须把需求转化为订单的住宅渠道很脆弱。SEIA 和市场报道都指向疲弱的 2025、更艰难的
              2026，以及继续依赖第三方所有权来缓冲客户自有税收抵免经济性消失。单这一点，对年轻住宅电池厂商已经是困难背景；大型贷款机构倒下后，难度更高。Mosaic 的 Chapter 11
              是融资交易对手会在这个市场断裂的具体证据，围绕该案的文章也描述了 Lunar 应该关心的传导机制：里程碑付款延迟、安装商现金受挤压、服务复杂化，以及谁来完成半成品项目的混乱。


              Lunar 的公开证据也集中在伙伴侧。它披露的最强美国 Gridshare 证据仍通过 Sunrun 项目和 Sunrun
              的规模声明体现。这有帮助，因为它证明软件确实在运行；但也有风险，因为它可能掩盖集中度。如果获批供应商名单进一步收紧，或大型渠道伙伴调整优先级，Lunar
              可能同时失去分销、软件量和公开证据。公司在伙伴侧有可信动能，但公开记录仍显示，这是一种渠道驱动、而非需求免疫的增长模式。
