      - number: '3.5'
        title: 竞争耐久性结论与证据缺口
        blocks:
          - type: paragraph
            body: >-
              这个品类里最耐久的竞争楔子，似乎是控制客户和调度合同，而不是电池包本身。公开来源反复按生态适配、软件、保修信心、融资模式或公用事业关系来区分厂商，而不是按新颖硬件主张。按这个视角看，Lunar
              的产品故事可信：模块化容量、强公开输出和 App 原生 VPP，适合不想被迫进入某个光伏专属生态的家庭。但公开证据仍让 Lunar 相比 Sunrun 和 Base 处于披露劣势。Sunrun
              披露机队、客户和调度规模。Base 披露公用事业足迹和订阅经济性。sonnen 披露具体 Texas 方案。Lunar
              尚未解决的缺口是有代表性的已安装价格、安装商网络深度和机队规模披露。在这些公开之前，Lunar 的差异化看起来真实，但还不能像在位者的渠道、融资和公用事业足迹那样，被证明足够耐久。
