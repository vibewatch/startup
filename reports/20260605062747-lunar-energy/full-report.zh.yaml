      - number: '7.2'
        title: 安全、服务与保修敞口
        blocks:
          - type: paragraph
            body: >-
              运营风险应从品类出发看，这个区分很重要。保留的公开证据里没有 Lunar
              专属召回或火灾。但家庭电池品类已经出现召回入口、产品通知机制，也受到足够多事故审视；美国消防官员希望在相邻电池和附近可燃物上看到更贴近真实住宅场景的测试数据。承销关键点因此不是「Lunar
              出过事故」，而是「Lunar 卖进了一个品类，在这个品类里，任何地方的一起事故都可能收紧各地的地方许可和客户信任」。在加州，这一点更重要，因为部署密度和监管关注度都高。


              Lunar
              确实展现出有意义的缓释成熟度。公开页面描述了认证、网络安全控制、调试工具、主动监测、模块化可维护性和安装商支持。这些都是正面信号，但它们仍是控制声明，不是全生命周期损失数据。公开材料没有披露现场故障曲线、保修索赔率、准备金政策或服务成本历史。对一家硬件加软件公司来说，这个缺口很重要。剩余风险在于：服务经济性可能只有在放量后才恶化；那时认证有助于品牌防守，却不会自动保护毛利率。
