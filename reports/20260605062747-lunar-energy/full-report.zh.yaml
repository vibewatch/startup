  - id: TP001
    title: 竞品画像表
    columns:
      - 公司 / 替代方案
      - 类别
      - 公开规模 / 融资背景
      - 目标买方
      - 差异化
      - 相对 Lunar 的短板
    rows:
      - - Tesla Powerwall 3 + Tesla Electric
        - 直接竞争 / 既有玩家
        - 品牌领先的电池；得州零售电力层；EnergySage 和 SolarReviews 排名靠前
        - 希望获得高端品牌备用电源和一体化能源 App 的房主
        - 购买制电池价值较强，并在得州拥有直接零售电力关系
        - 前期支出高于订阅方案；公开资料中有支持服务担忧，黑启动证据较弱
      - - Enphase IQ Battery 5P
        - 直接竞争 / 既有玩家
        - 上市微型逆变器龙头，安装商覆盖广
        - 已有 Enphase 微型逆变器的家庭，以及追求省电费的买方
        - 生态适配强、15 年保修、可模块化扩展
        - 每个模块仅 5 kWh；若不增加模块，整屋价值较弱
      - - FranklinWH aPower 2
        - 直接竞争
        - 私营高端新进入者；财务未公开
        - 注重韧性的改造住宅，以及适合接入发电机的安装场景
        - 15 kWh / 10 kW、发电机集成、整屋定位
        - 定价偏高，长期公司韧性披露较少
      - - sonnen + Solrite
        - 直接竞争 / 相邻
        - 得州已注册 3,000 名客户，2026 年目标 10,000 名客户
        - 寻求稳定账单的得州非太阳能住宅和「太阳能孤儿」
        - 无首付订阅路径、每户 60 kWh、明确的 VPP 经济性
        - 集中在得州，依赖电价 / 零售计划执行
      - - Generac PWRcell 2
        - 既有玩家 / 替代方案
        - 传统发电机龙头，正扩展到储能和能源管理
        - 因停电而购买、已信任 Generac 备用电源的买方
        - 最高 36 kWh、可搭配发电机、整屋叙事
        - 前期成本高，清洁能源叙事弱于订阅电池
      - - SolarEdge Home Battery
        - 相邻既有玩家
        - 成熟逆变器既有玩家，拥有电池附加产品线
        - 希望优化 NEM 3.0 或 TOU 省钱效果的现有 SolarEdge 太阳能业主
        - 高效率，逆变器 / 软件集成紧密
        - SolarEdge 逆变器锁定效应，以及可见的服务投诉
      - - Sunrun 电池 + DPP 栈
        - 直接竞争 / 既有玩家
        - 1M+ 客户、217k 电池系统、106k DPP 注册用户
        - 接受第三方持有和订阅合同的房主
        - 已披露的最大住宅资产池，公开 DPP 规模最强
        - 服务投诉和太阳能主导的 GTM，让该方案对仅需电池的家庭不够灵活
      - - Base Power
        - 直接竞争 / 相邻
        - 过去 12 个月覆盖 20,000+ 户、3 个都会区、6 家公用事业公司
        - 想要低价备用电源和零售电力省钱的得州家庭
        - 低摩擦定价，明确的公用事业调度模式
        - 地域集中，强依赖得州公用事业公司 / REP 结构
      - - LG RESU 历史背景
        - 传统既有玩家
        - 通过包括 Sunrun 在内的多渠道售出，装机基础大
        - 现有传统电池业主，而不是新的高端电池买方
        - 既有装机足迹和广泛历史分销
        - 召回历史和热事件包袱削弱信任
      - - 仅太阳能，无电池
        - 现状替代方案
        - 常见、复杂度更低的太阳能购买路径
        - 不优先考虑停电、主要想省电费的买方
        - 前期复杂度更低，安装商动作熟悉
        - 标准并网配置没有停电备用能力
      - - 仅发电机备用电
        - 现状替代方案
        - 整屋机型前期成本通常低于完整光储方案
        - 长时停电买方更看重运行时长，而非软件
        - 韧性叙事简单；有燃料时可长时间运行
        - 燃料、维护、噪音问题，且没有电网变现上行
    notes: 覆盖范围有意限于主要全国性替代方案和替代品类，它们与 Lunar 在 2026 年中期的美国家庭住宅能源任务有实质重叠。未知项保持明确，不做估计。
