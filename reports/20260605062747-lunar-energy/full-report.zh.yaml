      - number: '5.4'
        title: 可靠性、安全与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Lunar 的公开信任表面好过纯营销初创公司，但仍不均衡。积极的一面是，公司发布了专门的网络安全页面，点名 ISO/IEC 27001、SOC 2 Type I 和 II 对齐、CCPA 与 GDPR
              合规、加密、访问管理、持续监控和公开 Vanta 信任中心。安全信号也比通常更具体。认证说明列出系统级和组件级认证，EnergySage 重复主要 UL 和 IEEE 条目，2026 年 5
              月文章明确回应更大住宅安装中的 UL 9540A 6th Edition 要求。合在一起，足以支撑一套可信的安全和合规叙事。


              需要谨慎的是，长周期硬件可靠性仍主要来自公司自述。防洪、抗震、海岸雾和火灾烟灰等主张是官方声明，不是独立审计的实地研究。已保留材料没有披露故障率曲线、保修索赔率、现场循环寿命表现，或正常运行时间的公开
              SLA。Sunrun 和 Lunar 确实引用了强 VPP 正常运行时间和调度结果，但这些更能验证 Gridshare
              项目执行，而不是家用硬件全寿命耐久性。因此，产品看起来工程设计用心、测试充分，但长尾故障经济性仍需要非公开尽调。
