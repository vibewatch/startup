  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流
      - Lunar 方案
      - 可衡量收益
      - 限制
    rows:
      - - 购买并安装系统
        - 认证安装商评估住宅、提出设计、申请许可、完成安装并申请 PTO
        - 公司管理安装商交接，并提供安装指南和入门流程
        - 公开页面把部署路径讲得很清楚，这在年轻电池厂商中并不常见
        - 体验仍高度取决于安装商质量和当地许可速度。
      - - PTO 后运行家庭系统
        - 系统获批后按公用事业公司和安装商约束运行
        - 应用在 PTO 后展示费率计划设置、PCS 行为、模式和预测
        - 客户能看到 PTO 后的运行状态，不必把系统当黑箱
        - 如果没有安装商支持，PTO 前后行为可能让客户困惑。
      - - 准备应对停电
        - 电池备用电量和天气预案需要正确设置
        - 备用模式、备用电量设置和 Outage Watch 将准备动作自动化
        - 无缝切换和续航估算提升房主信心
        - 续航仍取决于实际负载曲线和负载规模配置是否正确。
      - - 优先保障关键负载
        - 许多电池系统需要手动决定配电盘或负载管理
        - AbleEdge 智能断路器可自动或手动切断非关键负载
        - 延长备电时长，并在停电时保障更高价值回路
        - 需要额外断路器硬件和安装商配置。
      - - 通过 VPP 获得收益
        - 家用电池需要入组并参与调度，同时不打断备电需求
        - 应用引导 VPP 入组和 DSGS 工作流，AI 管理放电并留足备用电量
        - 官方来源支持部分项目每年可多赚数百美元
        - 收入取决于辖区、事件频率和履约表现。
      - - 现场调试和服务
        - 安装商往往依赖分散工具和返场
        - 安装商应用可运行固件包、自动化测试和支持工作流
        - 公开材料明确承诺减少上门服务，并将调试缩短至 15 分钟
        - 还没有公开队列数据证明平均省工或故障降低效果。
    notes: 收益仅限有来源支撑的工作流结果，不意味着每个地区的安装商执行都一致。
