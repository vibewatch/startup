  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Sunrun
        - Q1 2026 收入 + 市场倍数
        - 基于 $17.73B EV 和 $3.17B LTM 收入，EV/Sales 约 5.58x
        - 最接近的美国住宅储能规模和融资强度大型上市参照
        - 项目融资结构和订阅模式的披露程度远高于 Lunar。
      - - Enphase
        - Q1 2026 电池 / 逆变器经济性 + 市场倍数
        - 基于 $8.70B EV 和 $1.40B LTM 收入，EV/Sales 约 6.21x
        - 说明高毛利硬件软件模型如何拿到溢价倍数
        - 装机基础结构和商业模式与 Lunar 的一体化电池栈差异很大。
      - - Generac
        - 住宅能源 / 备用电源相邻业务 + 市场倍数
        - 基于 $17.50B EV 和 $4.33B LTM 收入，EV/Sales 约 4.05x
        - 有助于理解备用电源品牌强度和渠道触达
        - Generac 自身称住宅储能销售下滑，因此这个可比只具部分参考性。
      - - SolarEdge
        - 复苏阶段上市可比
        - 基于 $4.31B EV 和 $1.28B LTM 收入，EV/Sales 约 3.38x
        - 代表当前电池相邻上市区间中质量较低的一端
        - 仍在亏损；低迷经济性让它更像地板情境，不是直接同业。
      - - Tesla 能源板块
        - 规模参照
        - $2.408B Q1 2026 发电与储能收入；母公司 EV/Sales 约 15.76x
        - 可作为产品规模和产能雄心的上限背景
        - Tesla 的股权价值主要由汽车、AI 和机器人业务主导，因此不应作为干净的 Lunar 倍数。
      - - Base Power
        - 私募轮估值
        - 2025 年 Series C 融资 $1B，据报道投前估值 $3B
        - 最明确的近期私营电池 / VPP 融资基准
        - 地理区域、租赁模型不同，且公开定价透明度远高于 Lunar。
      - - FranklinWH
        - 私募融资规模
        - 2023 年 Series B 融资 $25M；一年后接入 1,000+ 安装商
        - 住宅储能较低端私企成熟度参照
        - 规模更小、阶段更早，不能作为 Lunar 当前估值的同类锚。
      - - sonnen
        - 战略所有权参照
        - 2019 年被 Shell 收购；当前独立估值未披露
        - 说明战略买家重视可接入 VPP 的家庭储能能力
        - 没有当前公开价格；战略收购价值不等于今天的公平市场价值。
    claimRefs:
