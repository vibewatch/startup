      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方栈是分层的。屋主是备电、账单节省和能源管理软件的终端用户，但他们不总是唯一，甚至不总是主要经济决策者。安装商和第三方持有模式提供方会影响产品选择、融资结构，以及储能是否与光伏绑定。公用事业公司、社区选择聚合商和零售商在出资激励、需求响应、调度付款或
              DERMS 项目时成为付款方。联邦政策通过 IRA 相关税收激励和 DOE 贷款项目，位于上一层，降低合格设备和平台的资本成本。


              Lunar 的公开案例让这套分层异常清楚。Peninsula Clean Energy 和 Silicon Valley Clean Energy 实际上是在采购 DERMS
              能力和可调度负荷缓解，而屋主仍是设备所有者和公用事业费率受益人。Ava Community Energy
              的试点和后续充电项目展示了同一结构的另一个版本：公共机构分享电网价值，客户获得年度付款或更低账单。Lunar 还称 Sunrun 在十多个市场使用
              Gridshare，说明安装商或资产所有者渠道可以在屋主产品和面向公用事业的服务之间架桥。这种分层买方结构解释了为什么渠道实力与原始电池需求同样重要。
