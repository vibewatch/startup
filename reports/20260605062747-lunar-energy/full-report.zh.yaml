  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：储能硬件加编排，而不只是电池
        blocks:
          - type: paragraph
            body: >-
              Lunar 并不落在一个干净单一的产品类别里。最窄的视角会把它叫作住宅电池厂商，但公开证据显示，这会漏掉很大一部分经济逻辑。DOE、FERC、CPUC 和 Lunar
              自己的公用事业合作公告，都描述了这样一个市场：价值来自把表后资产与软件结合起来，让系统能响应费率、电网事件，以及批发或公用事业容量需求。换句话说，相关市场是集成式住宅储能加编排。因此，纳入口径的支出覆盖电池、电力电子、智能控制、安装商人工，以及管理调度、注册和客户经济性的那层软件。


              这个边界重要，因为现状竞争不只是品牌与品牌之间的电池竞争。纯光伏系统、无人管理的分时用电行为、备电发电机和公用事业调峰电厂，都能替代 Lunar
              想解决的某一部分客户任务或电网任务。公用事业级电池是相邻品类，但并不相同，因为它们不能解决屋主备电或客户获取。更宽的框架也解释了为什么本章中的公开买方不限于屋主。社区选择聚合商、公用事业公司，甚至联邦融资项目，都反复出现在证据中，因为它们会影响住宅电池能否从闲置备电设备变成电网资产。
