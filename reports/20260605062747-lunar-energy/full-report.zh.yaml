  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              已报告证据支持的是一套混合变现栈，而不是干净的 SaaS 故事。Lunar 自己的材料描述的是一个集成系统，把模块化电池、逆变器、智能断路器、优化软件和 VPP 注册捆在一起。BayWa 和 Greentech
              的分销商页面，加上 Signature Solar 的实时商品页，显示公司已经通过渠道合作伙伴售卖组件 SKU 和整套系统包；B Capital 和 Sunrun 则指向由 Sunrun
              牵头、区域和全国安装商补充的安装商分销。这让硬件销售和渠道经济性成为最可见的已报告收入表面。


              估计经济性只能从公开披露止步处开始。Signature Solar 页面显示一个 $13,548.60 的套装参考价，Canary 报道管理层称典型 Lunar 安装大约比 Tesla Powerwall 贵
              10%。这些是有用的价格锚，但不是 Lunar 已实现的净收入，因为经销商套装、安装人工、返利、税收抵免、软件价值捕获和分销商折扣都未披露。因此，最重要的是不可得指标：没有已保留来源披露 Lunar
              每套系统确认收入、软件抽成率、各收入流毛利率或收入确认政策。
