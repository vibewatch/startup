      - number: '4.4'
        title: 公开可比公司与财务结论
        blocks:
          - type: paragraph
            body: >-
              公开可比公司显示，Lunar 合理经济区间仍很宽。Sunrun 展示了分布式住宅储能的融资强度：它第一季度收入为 $722.2 million，储能附加率达到创纪录的 73%，但仍报告负现金生成，并依赖 $2.7
              billion 无追索权仓储融资和合资融资结构。Enphase 展示了更强硬件软件组合的上行，非 GAAP 毛利率为 43.9%，现金近 $931 million。Tesla
              展示了规模终点，单季度能源发电与储能收入为 $2.4 billion，Nevada 年 Powerwall 产能超过 6 GWh。Generac 和 SolarEdge
              则说明，并非每个住宅储能相邻模式都能越过那条线：Generac 称储能销售拖累住宅业务，SolarEdge 非 GAAP 毛利率仍只有 23.5%。


              这组可比公司意味着结论要谨慎。已报告事实支持真实需求、高端定位和真实软件/VPP 价值。估计代理指标显示，Lunar
              可能把制造规模转化为可观的硬件账单。但不可得指标仍主导尽调文件：没有公开收入、没有毛利桥、没有披露流动性，也没有披露结构化融资义务。再加上私募市场估值追踪平台彼此冲突，财务上诚实的立场是：认可市场相关性，但对收入质量和近期估值信心保持怀疑。
