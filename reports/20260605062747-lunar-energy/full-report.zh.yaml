      - number: '5.3'
        title: 安装、互操作性与运营流程
        blocks:
          - type: paragraph
            body: >-
              对一家年轻住宅电池公司来说，Lunar 的安装和运营模式异常可见。Lunar 发布了屋主工作流，从认证安装商引荐、方案、许可、安装、PTO 到 App
              上手；安装商指南又把流程拆成具体任务，覆盖屋顶组串、Maximizer 与 hub 安装、ESS 安装、Bridge 接线、智能断路器和 CT 安装、调试以及屋主交接。同样重要的是，公司记录了 PTO
              前后的变化。PTO 前，系统可以支持备电但不能外送；PTO 后，PCS 设置和公用事业规则决定进出电行为，Lunar AI 开始学习，费率计划确认也变得重要。


              互操作性方向上很强，但还不是完全打开的书。公开来源支持部署到有无既有光伏的家庭，支持 ConnectDER meter-socket-adapter 路径，也支持可用于改造和新建场景的 Eaton
              智能断路器。安装商 App 和合作伙伴页面显示，产品设计时考虑了可维护性，包括快速调试和便于逆向物流的模块化电池块。但同一组公开页面也凸显执行风险：安装商仍要确定备电负载容量、提交 PTO、设置 PCS
              行为，并控制某些客户设置是否可编辑。换句话说，Lunar 可能已经产品化，但最终用户体验仍明显依赖安装商。
