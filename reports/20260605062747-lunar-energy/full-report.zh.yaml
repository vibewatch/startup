    enumerationScope:
      coverage: partial
      basis: >-
        This set covers the most decision-useful public and private residential-energy comparables visible in the
        retained public record as of 2026-06-05; it is not an exhaustive universe of every storage company.
    notes: 上市公司行使用当前市场统计和近期经营披露；私营公司行使用已披露轮次或所有权信号，因此只具方向性，不能直接按倍数比较。
  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价轮融资
        - 新一轮新股融资低于当前公开追踪器区间
        - 这意味着当前估值标记不够稳，且对现有持有人的劣后影响可能超出预期。
        - 考虑任何入场前，先按新的股权结构条款重新核保。
      - - 收入质量不达标
        - 尽调显示毛利率偏弱、折扣重，或软件 / VPP 价值变现不佳
        - 高溢价一体化平台论点会被打穿。
        - 将公司推向悲观情景，并要求显著更低的入场价。
      - - 渠道融资冲击
        - 安装商或贷款机构不稳定，外溢为安装延迟或合作伙伴付款摩擦
        - 行业脆弱性会直接传导到 Lunar 的销售速度和回款状况。
        - 暂停投资，直到看到渠道韧性的证据。
      - - 政策或税收抵免收紧
        - 住宅税收抵免可用性或融资可得性进一步下降
        - 房主可负担性会下降，可用的倍数环境也会收缩。
        - 下调估值区间，并重新评估需求假设。
      - - 优先股堆叠意外
        - 股权结构表显示高级优先权或条款严重损害普通股等值价值
        - 这可能让表面估值看起来优于新资金或员工真正能拿到的经济价值。
        - 在建好清算瀑布模型前，将任何当前估值标记视为不可比。
    claimRefs:
      - CV010
      - CV032
      - CV033
      - CV034
      - CV035
      - CV042
      - CV043
    notes: 这些触发因素是可观察事件或尽调发现，会迫使重新做估值决定，而不是逐步调高乐观程度。
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入基数
        - 没有公开收入或队列级账单披露
        - 没有分母，公开 EV/Sales 区间就无法转换成可辩护的 Lunar 估值。
        - 管理层 / 财务——按渠道提供月度经常性收入与硬件收入桥。
      - - 毛利率和服务负担
        - 没有公开硬件、软件、质保或服务毛利率拆分
        - 这决定 Lunar 更接近 Enphase 式溢价，还是质量较低的硬件可比公司。
        - 管理层 / 运营——提供按产品线划分的毛利率，以及质保和上门维修历史。
      - - 流动性和烧钱速度
        - 没有公开现金余额、烧钱速度、现金跑道、债务期限表或仓储融资敞口
        - 缺少这些数据，无法核保当前资本结构是否足够。
        - 财务团队——提供当前现金、债务、烧钱速度和 18-24 个月流动性计划。
      - - 股权结构表与优先权
        - 没有公开优先股清算瀑布、清算优先权或转换细节
        - 表面估值可能因条款不同而大幅偏离经济价值。
        - 法务 / CFO——提供股权结构表、优先股堆叠和近期融资文件。
      - - 老股定价深度
        - 没有公开证据说明追踪器估值背后的交易量或撮合价格深度
        - 如果报价来自稀薄或陈旧交易，私营公司报价的参考价值就会下降。
        - 老股经纪 / 追踪器——索取当前估值标记的方法、日期和交易深度。
      - - 渠道集中度
        - 没有公开披露按收入计算的安装商、贷款机构或战略合作伙伴集中度
        - 行业破产案例表明，即使终端需求存在，交易对手也可能快速损害价值。
        - 销售 / 合作伙伴——提供头部合作伙伴集中度、付款条款和应急计划。
    claimRefs:
      - CV009
      - CV010
      - CV032
      - CV033
      - CV037
      - CV043
    notes: 这些要求是最低资料包，拿到后才可能把今天很宽的公开区间转成可核保的估值判断。
