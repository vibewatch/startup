      - number: '3.4'
        title: 切换成本、信任与替代方案
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本通常来自外围系统，而不是电池柜本身。屋主已经拥有 Enphase 或 SolarEdge 逆变器栈时，两家公司受益。客户愿意接受长期订阅关系、又想要零首付光储时，Sunrun
              受益。公用事业或零售电力关系已经被打包进方案时，Base 受益。这些锁定形式重要，因为品类也带着可见的信任风险。LG 的召回历史说明，安全事件会在原始销售多年后仍持续发酵。SolarReviews 上关于
              Sunrun 和 SolarEdge
              的投诉显示，服务响应慢和沟通差仍是现实购买风险，不是边缘个案。这层信任问题反而强化了替代选项。一些家庭仍选择只用发电机备电，因为操作上感觉简单；另一些家庭即使知道无电池并网系统在停电时会关停，仍维持纯光伏。Lunar
              可以利用这两个缺口，但前提是它能证明售后执行优于品类中已经可见的失败案例。
