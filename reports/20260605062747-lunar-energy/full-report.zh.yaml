      - number: '5.2'
        title: 软件控制平面与 VPP 编排
        blocks:
          - type: paragraph
            body: >-
              软件是 Lunar 试图超越电芯化学的地方。已保留页面展示了一套连贯栈：Lunar AI 做每日优化，屋主 App 做实时控制和节省可见化，安装商 App 处理调试和固件工作流，Gridshare
              负责机队聚合和调度。AI 主张足够具体，因此有尽调意义。Lunar 称，它每天权衡费率、天气、外送电信用、VPP 机会、EV 充电和家庭行为，而不是简单保留一个静态备用电量。App
              页面随后展示了这些软件如何通过实时流向视图、图表、节省比较、停电预测和 VPP 注册呈现给用户。


              更强的独立印证来自发布表面和 VPP 运营。两个 App Store 都显示有面向屋主和安装商的实时 App，并在 2026 年更新；Sunrun 案例研究和 Ava 合作材料支持 Gridshare
              有真实部署足迹。公开材料比泛泛的 DERMS 营销更进一步：它们声称设备级优化、多厂商编排、一个 Hawaiian Electric 项目中 100% 正常运行时间，以及一个 Southern
              California Edison 项目中明显更好的调度表现。未解问题不是软件是否存在，而是这些结果在具名合作伙伴项目和公开案例之外有多可复制。
