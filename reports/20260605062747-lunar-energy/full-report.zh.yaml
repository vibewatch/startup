  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 潜在护城河 / 切入点
      - 威胁 / 竞争对手
      - 严重度
      - 证据
      - 缓释措施 / 尽调要求
    rows:
      - - 不绑定太阳能的模块化硬件
        - Tesla、FranklinWH、Generac 和 SolarEdge 都能覆盖主要韧性备电需求，规格也有公开可比性
        - 中
        - 硬件规格足够接近，排名更多按使用场景排序，而不是按无可争议的技术跃迁排序
        - 按改造和新建细分，量化 Lunar 相对高端全屋系统的胜率
      - - App 原生 VPP 用户体验
        - Base、sonnen、Sunrun 和 Tesla 都把电池接入电网变现，公开经济性也更清晰
        - 高
        - 公开竞品项目对订阅条款、公用事业连接或 DPP 规模的披露比 Lunar 更明确
        - 按市场披露 Lunar 项目数量、入组住宅数和重复支付情况
      - - 零售商或公用事业合同层
        - Base 和 Tesla 掌握账单关系；Sunrun 掌握长期订阅；GVEC 案例显示 Base 可以把调度控制权交给公用事业公司
        - 高
        - 公开证据显示，渠道所有权比原始电池规格更耐久
        - 展示 Lunar 除基于 App 的 VPP 参与之外，已经在哪里建立了公用事业、零售商或建筑商关系
      - - 信任与服务执行
        - LG 召回历史，加上 Sunrun 和 SolarEdge 的服务投诉，说明支持能力可能变成淘汰项
        - 高
        - 公开评测和召回证据很显眼，买家也容易找到
        - 在提出信任驱动的 GTM 论点前，跟踪 Lunar 服务水平指标和保修索赔响应时间
      - - 生态锁定
        - 客户已经使用 Enphase 和 SolarEdge 逆变器时，它们会受益；客户想要订阅时，Sunrun 会受益
        - 中
        - 既有硬件和合同关系会在首次安装后抬高切换阻力
        - 优先瞄准只装电池的住宅、无人承接服务的太阳能客户，以及因服务不满而替换系统的客户，而不是硬撬既有生态
      - - 价格透明度
        - Base 和 sonnen 发布清晰的客户侧经济性，Lunar 则没有披露有代表性的安装价格
        - 中
        - 价格不透明，让 Lunar 更难证明自己相对订阅竞品有低阻力入口
        - 按市场和使用场景发布有代表性的报价类型或报价区间
      - - 电池商品化
        - 排名和评测更强调软件、保修、支持和融资，而不是电芯化学体系
        - 高
        - 公开来源越来越把电池写成生态组件，而不是独特的硬件突破
        - 把钱投向软件留存、公用事业集成和售后支持，因为这些护城河更耐久
    notes: 严重度评分衡量竞争耐久度，不是公司生存概率。清单聚焦对 Lunar 真正重要的切入点；公开证据不完整的地方，保留为未解决项。
