companyProfile:
  summary: >-
    Lunar Energy 是一家位于 Mountain View 的家用电池和虚拟电厂公司，前 Tesla Energy 负责人 Kunal Girotra 于 2020 年 8
    月创立。公开证据显示，它确实拼出了一套集成式住宅能源栈，覆盖模块化电池硬件、逆变器和负载管理组件、屋主与安装商 App，以及 Gridshare DERMS/VPP 平台。公司 2022 年走出隐身状态，收购 Moixa
    以加深软件能力；到 2026 年初，已披露约 $532 million 累计融资、超过 2,000 套已部署系统、40 多家安装合作伙伴，以及 650 MW 管理设备。尽调问题不是 Lunar
    有没有真实业务，而是收入质量、毛利率、烧钱速度、保修经济性和当前股权结构表仍不公开，同时公开估值信号彼此打架。
