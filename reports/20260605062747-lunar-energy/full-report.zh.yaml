        - 基于公开证据的区间约 $0.7-1.3B；只有尽调确认收入质量且优先权可控，当前 PremierAlts 水平才算合理。
        - 追踪器冲突仍在，行业倍数也继续受政策影响。
        - 按当前公开证据最可能
      - - 悲观
        - 住宅渠道承压、资本收紧或单位经济性疲弱，迫使估值标记下调或出现降价轮。
        - 基于公开证据的区间约 $0.25-0.6B；更接近困境老股交易逻辑或融资重置，而不是增长溢价。
        - 经销商付款压力、税收抵免摩擦和安装商疲弱，可能在 Lunar 自身问题公开前先打击价值。
        - 当前市场存在实质尾部风险
