      - number: '7.4'
        title: 客户信任、投诉与合规风险
        blocks:
          - type: paragraph
            body: >-
              住宅能源对信任格外敏感，因为产品靠长周期合同、融资承诺和会进入家庭的安装伙伴出售。FTC 当前太阳能指南把失效模式说得很清楚：夸大节省、融资含混，以及实际上并不免费的「免费太阳能」话术。Ygrene
              的例子虽然不是 Lunar 事件，但同样有用。它说明，相邻清洁能源融资实践一旦披露薄弱或业主不理解留置权，就会变成执法行动和屋主怨气。对 Lunar
              来说，这意味着即便电池硬件按承诺工作，信任风险也可能来自话术脚本、伙伴行为或融资设计。


              投诉基础设施进一步放大这种不对称。CFPB 和 DFPI 都提供客户申诉渠道，CPSC 和 Recalls.gov 则提供安全事件的公共基础设施。这些都不能证明 Lunar
              今天有专属投诉问题。它们说明的是，一旦信任问题出现，从孤立纠纷走到可搜索、面向监管记录的路径很短。Lunar 的公开材料承诺安装商支持、监测和可触达的人员，这有帮助。但在 Lunar
              能拿出投诉率、取消趋势、SLA 表现和支持积压指标之前，客户信任风险仍部分靠「没有证据」而不是「有证据证明不存在」来承销。
