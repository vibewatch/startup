      - number: '5.5'
        title: 路线图、差异化与技术结论
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年可见的产品路线图，不是单一下一项功能发布，而是把一套已经集成的栈扩到更多家庭、更多项目和更多地区。Canary 关于制造爬坡目标的报道、Ava 合作、2026 年 DSGS 项目细节和 UL
              9540A 文章，都指向同一方向：Lunar
              试图把硬件加控制平面的组合方案工业化，而不只是多卖一些电池盒。公司也持续投入安装商工具和负载管理集成；这一点重要，因为住宅储能经济性和顺畅部署、售后服务同样相关，并不只取决于名义千瓦时。


              技术上，Lunar 的差异化在硬件与软件交汇处最清楚。许多竞争者在纸面上都能匹配电池化学或逆变器性能。公开展示模块化 DC 连接硬件、智能断路器负载切除、真实屋主 App、实时安装商 App 和具名设备无关
              VPP 运营的公司更少。代价是成熟度证据不足。架构读起来比普通电池初创公司更有差异化，但独立验证程度低于它的营销雄心。Lunar
              因此落在一个有吸引力但尽调负担很重的区间：产品深度可信，路线图可信，但规模化后的全寿命可靠性和服务经济性仍是开放问题。
