            body: >-
              Lunar 的 GTM 看起来是安装商优先、理解融资、由合作伙伴居中。安装商页面把 Lunar
              定位成渠道公司，而不是直接面向消费者的小工具品牌：调试工具、技术文档、机队监控和专属客户经理，都是为安装商效率和售后服务而建。同样模式也出现在客户故事里，可信安装商或演示反复成为购买决策的转折点。这一点重要，因为它说明客户获取不只靠产品吸引力，还靠渠道信心和服务质量。


              融资又叠加一层。pv magazine 称，许多系统现在通过住宅租赁部署；Jacquelyn 的故事解释了为什么对一些家庭来说，可转让性和 Sunrun
              支持的履约义务，可能比完全拥有更重要。这提升了采用潜力，但也制造依赖。Sunrun 的 AVL
              显示，渠道合作伙伴可以把关哪些产品被允许；即使电池本身表现良好，糟糕的融资交易对手也可能伤害客户体验。因此，Lunar 的客户承诺部分取决于它并不完全控制的参与方。
