  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 细分组合与买方 / 用户 / 付款方逻辑
        blocks:
          - type: paragraph
            body: >-
              公开客户证据支持 Lunar 已有真实市场存在，但也让客户组合异常清楚。披露的终端客户压倒性地是 California 屋主，他们要解决的是具体家庭问题：刺痛的 PG&E
              或分时电价账单、反复停电，或在不把控制权交给公用事业公司的前提下，让家中更多设备电气化。几乎每条可观察路径中，安装商都夹在 Lunar
              和屋主之间。一个又一个故事里，安装商负责销售、解释和售后兜底；公用事业公司和社区选择聚合商则以下游付款方身份出现，为灵活性付费，而不是直接购买住宅电池本身。


              这个拆分对尽调很重要。Lunar 似乎至少有三类客户，但公开信息中只有一类足够可见：屋主。安装合作伙伴影响信任和转化，CCA、公用事业公司和 VPP
              运营方则为这些家庭创造的软件或调度价值付费。缺失的是从这些细分到收入组合的公开桥梁。证据支持真实需求，但还没有干净披露收入中有多少来自直接硬件、租赁系统、安装商渠道或软件项目合同。
