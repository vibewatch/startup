      - number: '4.2'
        title: 已报告规模信号与缺失的单位经济
        blocks:
          - type: paragraph
            body: >-
              Lunar 的公开牵引力证据多于财务证据。最强的已报告指标是运营性指标：已部署数千套系统、管理 650 MW、约 2,000 个 California 安装、软件侧协调近 150,000
              台设备，以及屋主经济性中的约 $464 VPP 收入加 $338 软件驱动节省。这些数据点说明，产品确实为客户做事，VPP
              参与并非理论。它们也帮助解释为什么投资人持续支持公司：已报告客户价值足以支撑继续扩制造和渠道。


              但这些仍是客户侧或机队侧产出，不是 Lunar 的单位经济。公开来源没有披露每次安装确认收入、硬件毛利、保修负担、支持成本、获客成本（CAC）、回本周期、集中度或留存。剩下的只是一层很薄的估计。如果
              Signature Solar 套装参考价在方向上有用，那么已宣布的 20,000 套和 100,000
              套产能目标，意味着相当可观的硬件账单潜力；但这只是代理指标，不能替代真实公司财务。本章因此把已报告牵引力与估计收入产能分开，并明确把核心单位经济字段留为空白。
