- id: capability-pricing-and-gtm
  title: Capability, pricing, and GTM comparison
  body: 'The public evidence suggests Lunar’s strongest technical advantage is that it combines solar-agnostic deployment, modular 15–30 kWh sizing, and app-native VPP orchestration in one offer. That is a useful middle ground: Tesla and Base show stronger evidence of customer-facing electricity economics, while Enphase, SolarEdge, and FranklinWH are more compelling for customers already embedded in their hardware ecosystems. Pricing is the biggest public asymmetry. Tesla, Base, and sonnen publish enough to anchor a comparison, but Lunar’s public pages emphasize savings and payouts rather than representative installed prices. That makes Lunar harder to benchmark precisely against a $695 plus $19-per-month Base offer or a $20-per-month sonnen-Solrite program, even though Lunar’s feature set is closer to premium whole-home systems than to solar-only retrofits. GTM also differs sharply. Sunrun wins on subscription reach and disclosed fleet size, Base on utility and retail-energy contracts, and Tesla on brand recognition. Lunar’s go-to-market therefore looks credible on product fit, but still less proven on channel scale and contract leverage than the largest incumbents.'
