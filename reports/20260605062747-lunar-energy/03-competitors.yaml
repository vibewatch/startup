  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-installed-pricing
    missingEvidence: Representative installed quotes or signed contracts for Lunar, Enphase, FranklinWH, SolarEdge, and Sunrun battery projects by market.
    whyItMatters: List prices and ranking commentary do not show realized customer economics, discounting, or attach costs, which can materially change who is actually cheaper to enter.
    diligencePath: Request at least five recent installer quotes per brand in California and Texas, including batteries added to existing solar and stand-alone battery retrofits.
    relatedQuestionRefs:
    - QP005
    - QP022
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: lunar-fleet-scale-disclosure
    missingEvidence: Public disclosure of Lunar enrolled homes, installed battery count tied to current products, and dispatched MW or MWh for Lunar VPP programs.
    whyItMatters: Without comparable fleet metrics, it is difficult to judge whether Lunar has a real network-effect or utility-procurement moat relative to Sunrun, Base, or sonnen.
    diligencePath: Ask management for current installed systems, enrolled VPP homes, cumulative dispatches, and program-level utility partners by geography.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: battery-margin-and-durability
    missingEvidence: Bill of materials, warranty reserve data, service failure rates, and contribution margins by hardware and software component for Lunar and FranklinWH.
    whyItMatters: The public evidence supports a commoditization narrative, but not whether any vendor has enough gross-margin headroom or service economics to sustain aggressive pricing.
    diligencePath: Request management bridge from hardware ASP to gross margin, plus warranty claim rates and service labor assumptions by installed unit cohort.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: minor
    topic: black-start-validation
    missingEvidence: Comparable black-start or deep-discharge recovery test results for Lunar, sonnen, Generac, SolarEdge, and Sunrun-branded systems under mainstream U.S. configurations.
    whyItMatters: Public comparison evidence is directional but incomplete, so Lunar’s resiliency claim versus incumbents remains only partially benchmarked.
    diligencePath: Collect vendor test sheets or independent installer validation on outage recovery after full depletion and with/without solar present.
    relatedQuestionRefs:
    - QP024
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-competitor-coverage
    missingEvidence: Region-by-region list of local installers, utility pilots, and long-tail battery or VPP brands omitted from the major named set in TP001.
    whyItMatters: The current competitor roster captures major national alternatives but may miss regional incumbents that shape actual win rates in specific service territories.
    diligencePath: Pull current installer quote sets and utility battery-program rosters for California, Texas, and Northeast target markets before making regional GTM claims.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
