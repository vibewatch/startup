company:
  name: Lunar Energy
chapter:
  number: 3
  title: Competitors
  summary: 'Lunar competes from the middle of a crowded residential-battery stack: its solar-agnostic modular hardware and app-native VPP are credible differentiators, but publicly disclosed scale, pricing transparency, and utility-channel depth still trail Tesla, Sunrun, Base Power, and the sonnen-Solrite Texas program. The durable battleground in 2026 looks less like cell chemistry and more like who controls the customer contract, the dispatch contract, and the post-sale support loop.'
sections:
- id: landscape-overview
  title: 'Landscape overview: direct rivals, incumbents, and substitutes'
  body: 'Lunar is not competing in a single, clean product category. The closest direct rivals are the companies that can pair a home battery with a concrete path to grid monetization or retail-electricity savings: Base Power in Texas, sonnen’s Solrite-backed program, Sunrun’s distributed power plant model, and Tesla where Powerwall is paired with Tesla Electric. Incumbent battery vendors such as Enphase, FranklinWH, Generac, and SolarEdge compete for the same installation slot even when they lack a retail-energy layer, because homeowners still buy on resilience, installer familiarity, and ecosystem fit. Status-quo substitutes also matter. Standard grid-tied solar without a battery still appeals to customers optimizing for bill savings, while generators remain the fallback for buyers who value long-duration outage coverage over software and clean-energy features. The evidence therefore points to a competitive field defined less by chemistry alone and more by who can combine backup, software, financing, and utility-facing monetization into a low-friction offer.'
