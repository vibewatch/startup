- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Potential moat / wedge
  - Threat / competitor
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Solar-agnostic modular hardware
    - Tesla, FranklinWH, Generac, and SolarEdge all cover major resilience jobs with publicly comparable specs
    - Medium
    - Hardware specs are close enough that rankings sort mostly by use case, not by an undisputed technical leap
    - Quantify Lunar win rates against premium whole-home systems by retrofit and new-build segment
  - - App-native VPP user experience
    - Base, sonnen, Sunrun, and Tesla all connect batteries to grid monetization with clearer public economics
    - High
    - Public rival programs disclose subscription terms, utility links, or DPP scale more explicitly than Lunar
    - Disclose Lunar program count, enrolled homes, and repeat payouts by market
  - - Retail or utility contract layer
    - Base and Tesla own billing relationships; Sunrun owns long-term subscriptions; GVEC shows Base can hand utilities dispatch control
    - High
    - Channel ownership appears more durable than raw battery spec in the public evidence
    - Show where Lunar already has utility, retailer, or builder relationships beyond app-based VPP participation
  - - Trust and service execution
    - LG recall history plus Sunrun and SolarEdge service complaints show support can become a disqualifier
    - High
    - Public review and recall evidence is visible and easy for buyers to find
    - Track Lunar service-level metrics and warranty claim response times before making trust-led GTM claims
  - - Ecosystem lock-in
    - Enphase and SolarEdge benefit when customers already use their inverters; Sunrun benefits when customers want a subscription
    - Medium
    - Existing-hardware and contract relationships raise switching friction after first install
    - Target battery-only homes, solar orphans, and customers replacing unsatisfactory service rather than entrenched ecosystems
  - - Price transparency
    - Base and sonnen publish clean customer-facing economics while Lunar does not disclose representative installed pricing
    - Medium
    - Opaque pricing makes it harder to prove low-friction entry relative to subscription competitors
    - Publish representative quote archetypes or quote ranges by market and use case
  - - Battery commoditization
    - Rankings and reviews emphasize software, warranty, support, and financing more than chemistry
    - High
    - Public sources increasingly present batteries as ecosystem components rather than unique hardware breakthroughs
    - Invest in software retention, utility integrations, and post-sale support because those are the more durable moats
  notes: Severity scores reflect competitive durability, not company survival. The register focuses on wedges that matter for Lunar specifically and preserves unresolved items where public evidence is incomplete.
