- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Offer
  - Public price / contract
  - Included capabilities
  - Evidence status
  - Implication for Lunar
  rows:
  - - Lunar Energy
    - Representative installed price not publicly disclosed; product page emphasizes savings and $464 average VPP payout
    - 15–30 kWh modular battery, 9.6 kW continuous output, app-managed VPP, backup power
    - Official marketing and VPP-economics pages only
    - Public pricing opacity weakens direct price-led claims versus Base or sonnen
  - - Tesla Powerwall 3
    - $13,473 typical installed cost before incentives on EnergySage; $15,300–$16,200 before taxes and incentives on SolarReviews
    - 13.5 kWh battery, integrated inverter, backup power, optional expansion packs
    - Third-party installed-price estimates
    - Strong value in owned-battery model but much higher upfront than public subscription alternatives
  - - Enphase IQ Battery 5P
    - No public installed-price quote on official page; Solar.com describes a lower-price-point than larger batteries
    - 5 kWh AC-coupled battery, Enphase software, 15-year warranty
    - Official spec plus ranking commentary
    - Best fit for existing Enphase homes, less compelling as an all-in whole-home package
  - - FranklinWH aPower 2
    - Quoted prices described as premium / high-end in public reviews; no public MSRP
    - 15 kWh battery, 10 kW output, generator and solar integration, 15-year warranty
    - Review-based only
    - Strong resiliency product, but public economics are too opaque to call it low-friction
  - - sonnen / Solrite Texas VPP
    - $20 per month, no upfront installation cost, 12¢ per kWh retail rate
    - 20–60 kWh sonnen system, retail-electricity plan, storm-precharge and backup reserve
    - Public Texas program pricing
    - Most direct public subscription alternative to Lunar on economics and solar-agnostic install
  - - Generac PWRcell 2
    - Starts around $14,000 before installation
    - 9–36 kWh storage, whole-home framing, generator pairing, Ecobee integration
    - Review-based pricing
    - Strong for outage-first households, but expensive against battery-as-a-service offers
  - - SolarEdge Home Battery
    - Full system installation estimated at roughly $10,000–$20,000
    - SolarEdge-integrated battery, backup interface, Rate Saver software
    - Review-based broad estimate
    - Mostly relevant as a locked-in add-on to existing SolarEdge homes, not a price leader
  - - Sunrun battery storage
    - No public standalone battery price; often bundled into lease or subscription structures
    - Solar-plus-storage, 10-year coverage, monitoring, DPP revenue share
    - Official product page and market commentary
    - Financing breadth is strong, but public price transparency is weak
  - - Base Power
    - Starts at 8¢ per kWh before delivery charges, $695 installation fee, and $19 or $29 monthly membership
    - 25–50 kWh battery options, retail electricity, whole-home backup, utility-dispatch model
    - Official pricing, FAQ, and news coverage
    - Closest low-friction economic alternative in Texas and the clearest pricing benchmark
  - - Generator-only backup
    - $1,000 portable to $7,000 whole-house in TXSES comparison
    - Fuel-based backup power with long duration if fuel is available
    - Trade-association comparison
    - Cheaper upfront for some households but no bill savings, no VPP income, and more operational burden
  notes: This table intentionally distinguishes public subscription terms, review-based installed-price estimates, and situations where public pricing remains opaque. “No public standalone battery price” is treated as an evidence gap, not a guess.
