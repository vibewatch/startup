- id: durability-verdict-and-gaps
  title: Durability verdict and evidence gaps
  body: 'The most durable competitive wedge in this category appears to be control of the customer and control of the dispatch contract, not the battery pack by itself. Public sources repeatedly sort vendors by ecosystem fit, software, warranty confidence, financing model, or utility relationship rather than by novel hardware claims. On that lens, Lunar has a credible product story: its modular sizing, strong published output, and app-native VPP are good fits for homes that do not want to be forced into a solar-specific ecosystem. But the public evidence still leaves Lunar with a disclosure disadvantage against Sunrun and Base. Sunrun publishes fleet, customer, and dispatch scale. Base publishes utility footprint and subscription economics. sonnen publishes a concrete Texas offer. Lunar’s unresolved gaps are representative installed pricing, installer-network depth, and fleet-scale disclosure. Until those are public, Lunar’s differentiation looks real but not yet durably proven in the same way as the incumbents’ channel, financing, and utility footprints.'
