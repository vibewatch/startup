  topStrengths:
    - >-
      Integrated hardware, software, and VPP stack is unusually well evidenced for a young residential-energy company,
      with modular batteries, installer tooling, Lunar AI, and Gridshare all visible in public sources.
    - >-
      Public traction is substantive rather than purely narrative: Lunar disclosed more than 2,000 deployed systems,
      40-plus installation partners, and 650 MW of devices under management.
    - >-
      Capital access remains meaningful, with roughly $532 million disclosed raised through the 2026 Series C and D
      syndicate and strategic links to investors and channel partners including Sunrun and Itochu.
    - >-
      Utility and CCA references from Peninsula Clean Energy, Silicon Valley Clean Energy, Ava, and Sunrun show
      Gridshare is being used in real grid-facing programs rather than only in demos.
  topRisks:
    - >-
      Public financial disclosure is still too thin on revenue by stream, gross margin, burn, runway, debt, and
      revenue-recognition policy to underwrite economics confidently.
    - >-
      Current valuation evidence conflicts sharply across trackers, and even the more favorable roughly $1 billion
      signal is only conditionally supportable without revenue, cap-table, and preference disclosure.
    - >-
      Lunar remains heavily exposed to California tariff and incentive design, installer execution, financing
      counterparties, and a public proof set that is still concentrated in California households and Sunrun-linked
      programs.
    - >-
      Hardware-and-service downside is materially underdisclosed: public sources do not show field-failure curves,
      warranty-claim rates, reserve policy, or cohort-level retention.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, burn, runway, debt, and revenue-recognition details by hardware, software, and VPP
      stream.
    - >-
      2026 Series C and D post-money valuation, liquidation preferences, anti-dilution terms, and full cap-table
      waterfall.
    - >-
      Revenue and managed-capacity concentration by partner, especially Sunrun, utilities, installers, and financing
      channels.
    - Warranty claims, field-failure rates, reserve policy, and service-cost history as deployed volume scales.
    - >-
      Cohort retention, renewal behavior, geographic mix outside California, and evidence that customer economics travel
      beyond the current public proof set.
