  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >
              The valuation conclusion is not that Lunar lacks evidence of substance; it is that the public file proves
              a real business faster than it proves a precise price. Official disclosures support a company that has
              raised meaningful capital, shipped an integrated battery-plus-software product, and expanded from stealth
              into thousands of deployments and hundreds of megawatts under management. That is enough to reject the
              idea that Lunar is only a slide-deck story. It is not enough to justify a confident mark on the same terms
              as a public company with disclosed revenue, gross margin, and liquidity.


              The bull thesis is straightforward: integrated hardware plus optimization software plus
              virtual-power-plant participation can create a higher-quality business than a battery vendor alone, and
              Lunar's funding base suggests investors still see that possibility. The anti-thesis is equally
              straightforward: the same public record still omits revenue, cash burn, debt, cap-table structure, and
              preference terms, while sector financing conditions have worsened. That makes the investment case
              price-sensitive. On public evidence alone, the right recommendation is track or research-more rather than
              a clear buy. A low-end secondary-style mark could be attractive; a current mark near $1B is only
              conditionally supportable.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV011
              - CV038
