    title: Competitor profile table
    columns:
      - Company / alternative
      - Category
      - Public scale / funding context
      - Target buyer
      - Differentiation
      - Limitation vs. Lunar
    rows:
      - - Tesla Powerwall 3 + Tesla Electric
        - Direct / incumbent
        - Brand-leading battery; Texas retail-electricity layer; top-ranked by EnergySage and SolarReviews
        - Homeowners wanting premium branded backup and integrated energy app
        - Strong value for a purchased battery and direct retail-electricity relationship in Texas
        - Higher upfront spend than subscription offers; public support concerns and weaker black-start evidence
      - - Enphase IQ Battery 5P
        - Direct / incumbent
        - Public microinverter leader with broad installer presence
        - Existing Enphase microinverter households and bill-savings buyers
        - Strong ecosystem fit, 15-year warranty, modular expansion
        - Only 5 kWh per module and weaker whole-home value without more units
      - - FranklinWH aPower 2
        - Direct
        - Private premium entrant; financials not public
        - Resiliency-oriented retrofit homes and generator-friendly installs
        - 15 kWh / 10 kW, generator integration, whole-home positioning
        - Premium pricing and less disclosed long-term company durability
      - - sonnen + Solrite
        - Direct / adjacent
        - 3,000 enrolled Texas customers with a 10,000-customer 2026 target
        - Texas non-solar homes and solar orphans seeking predictable bills
        - No-upfront subscription path, 60 kWh per home, explicit VPP economics
        - Texas concentration and dependence on tariff / retail-plan execution
      - - Generac PWRcell 2
        - Incumbent / substitute
        - Legacy generator leader expanding into storage and energy management
        - Outage-driven buyers who already trust Generac for backup
        - Up to 36 kWh, generator pairing, whole-home framing
        - High upfront cost and weaker clean-energy narrative than subscription batteries
      - - SolarEdge Home Battery
        - Adjacent incumbent
        - Established inverter incumbent with battery add-on line
        - Existing SolarEdge solar owners optimizing NEM 3.0 or TOU savings
        - High efficiency and tight inverter/software integration
        - SolarEdge inverter lock-in and visible service complaints
      - - Sunrun battery + DPP stack
        - Direct / incumbent
        - 1M+ customers, 217k battery systems, 106k DPP enrollees
        - Homeowners comfortable with third-party ownership and subscription contracts
        - Largest disclosed residential fleet and strongest published DPP scale
        - Service complaints and solar-led GTM make the offer less flexible for battery-only homes
      - - Base Power
        - Direct / adjacent
        - 20,000+ homes, 3 metros, 6 utilities in last 12 months
        - Texas households wanting cheap backup plus retail-electricity savings
        - Low-friction pricing and explicit utility-dispatch model
        - Geographic concentration and strong dependence on Texas utility / REP structure
      - - LG RESU legacy context
        - Legacy incumbent
        - Large installed base sold through multiple channels including Sunrun
        - Existing legacy battery owners rather than new premium-battery buyers
        - Installed footprint and broad historical distribution
        - Recall history and thermal-event baggage weaken trust
      - - Solar-only without battery
        - Status-quo substitute
        - Common lower-complexity solar purchase path
        - Bill-savings buyers not prioritizing outages
        - Lower upfront complexity and familiar installer motion
        - No outage backup on standard grid-tied setups
      - - Generator-only backup
        - Status-quo substitute
        - Whole-house models typically cost less upfront than full solar-plus-storage
        - Long-duration outage buyers prioritizing run time over software
        - Simple resilience story and long runtime if fuel is available
        - Fuel, maintenance, noise, and no grid-monetization upside
    notes: >-
      Coverage is intentionally limited to the major national alternatives and substitute categories that materially
      overlap Lunar’s U.S. residential home-energy job in mid-2026. Unknowns are left explicit rather than estimated.
