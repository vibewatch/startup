      - number: '7.4'
        title: Customer-trust, complaint, and compliance risk
        blocks:
          - type: paragraph
            body: >-
              Residential energy is unusually trust-sensitive because the product is sold through long-cycle contracts,
              financing promises, and installation partners that enter the home. The FTC's current solar guidance is
              explicit about the failure modes: overstated savings, confusing financing, and “free solar” claims that
              are not actually free. The Ygrene example is also useful even though it is not a Lunar incident. It shows
              how adjacent clean-energy financing practices can turn into enforcement actions and homeowner resentment
              when disclosures are weak or liens are not understood. For Lunar, that means trust risk can arise from
              scripts, partner behavior, or financing design even if the battery hardware works as promised.


              The complaint infrastructure reinforces that asymmetry. CFPB and DFPI both provide channels for customer
              grievances, while CPSC and Recalls.gov provide public infrastructure for safety events. None of that
              proves a Lunar-specific complaint problem today. It does show that once a trust issue emerges, the path
              from isolated dispute to searchable regulator-facing record is short. Public Lunar materials promise
              installer support, monitoring, and accessible people, which helps. But until Lunar can produce complaint
              rates, cancellation trends, SLA performance, and support-backlog metrics, customer-trust risk remains
              partially underwritten by absence of evidence rather than evidence of absence.
            claimRefs:
              - CR025
              - CR026
              - CR040
              - CR047
              - CR048
              - CR049
              - CR050
