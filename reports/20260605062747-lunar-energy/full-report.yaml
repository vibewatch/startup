  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape overview: direct rivals, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Lunar is not competing in a single, clean product category. The closest direct rivals are the companies
              that can pair a home battery with a concrete path to grid monetization or retail-electricity savings: Base
              Power in Texas, sonnen’s Solrite-backed program, Sunrun’s distributed power plant model, and Tesla where
              Powerwall is paired with Tesla Electric. Incumbent battery vendors such as Enphase, FranklinWH, Generac,
              and SolarEdge compete for the same installation slot even when they lack a retail-energy layer, because
              homeowners still buy on resilience, installer familiarity, and ecosystem fit. Status-quo substitutes also
              matter. Standard grid-tied solar without a battery still appeals to customers optimizing for bill savings,
              while generators remain the fallback for buyers who value long-duration outage coverage over software and
              clean-energy features. The evidence therefore points to a competitive field defined less by chemistry
              alone and more by who can combine backup, software, financing, and utility-facing monetization into a
              low-friction offer.
