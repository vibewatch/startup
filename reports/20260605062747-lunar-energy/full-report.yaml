          detail: Hardware, software, support, and channel management
        - id: installers
          label: Certified installers
          detail: Sell, install, commission, and service systems
        - id: sunrun
          label: Sunrun
          detail: Largest disclosed U.S. Gridshare proof point
        - id: financiers
          label: Lenders / TPO
          detail: Shape affordability and milestone payments
        - id: cpuc-cec
          label: CPUC / CEC
          detail: Set incentive and VPP rules
        - id: tax-rules
          label: IRS / Treasury / AVL rules
          detail: Influence financeable equipment choices
        - id: homeowners
