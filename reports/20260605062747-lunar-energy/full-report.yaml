      - number: '7.5'
        title: Governance opacity, residual exposure, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The governance risk here is classic private-company opacity rather than a known scandal. Lunar publishes
              useful control surfaces: certifications, cyber posture, installer tooling, partner case studies, and a
              live DSGS offer. What it does not publish is just as important for underwriting. The retained public set
              does not show audited unit economics, warranty reserves, partner concentration by revenue, complaint
              backlog, or field-failure cohorts. That creates a valuation and governance problem: the company may have
              real mitigations, but outside investors cannot yet see whether those mitigations are cheap, repeatable, or
              sufficient at scale.


              That gap changes how the investment case should be monitored. The thesis should not break only on a
              catastrophic event. It should also break on slower evidence that the model is more fragile than the public
              narrative suggests: worsening California economics, partner concentration that does not diversify, service
              costs that outrun gross profit, or safety/compliance demands that slow installations. In other words,
              Lunar is investable only if diligence converts today's control claims into hard operating evidence. Until
              then, the right posture is to treat the company as execution-sensitive, partner-sensitive, and still
              meaningfully opaque on downside math.
            claimRefs:
              - CR041
              - CR042
              - CR043
              - CR051
              - CR052
              - CR053
