              reserve. The app pages then show how that software is surfaced to users through real-time flow views,
              charts, savings comparisons, outage forecasts, and VPP enrollment.


              The stronger independent corroboration is on release surface and VPP operations. Both app stores show live
              homeowner and installer apps with 2026 updates, while the Sunrun case study and Ava partnership materials
              support a real Gridshare deployment footprint. Public materials go further than generic DERMS marketing:
              they claim device-level optimization, multi-manufacturer orchestration, 100% uptime in one Hawaiian
              Electric program, and materially better dispatch performance for one Southern California Edison program.
