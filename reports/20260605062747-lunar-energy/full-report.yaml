  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Reported evidence supports a mixed monetization stack rather than a clean SaaS story. Lunar’s own
              materials describe one integrated system that bundles modular batteries, inverters, smart breakers,
              optimization software, and VPP enrollment. Distributor pages from BayWa and Greentech plus a live
              Signature Solar listing show the company is already merchandising component SKUs and full-system bundles
              through channel partners, while B Capital and Sunrun point to installer distribution led by Sunrun and
              supplemented by regional and national installers. That makes hardware sales and channel economics the most
              visible reported revenue surface.


              Estimated economics start only where public disclosure stops. Signature Solar’s fetched page showed a
              $13,548.60 bundle reference, and Canary reported management describing typical Lunar installations as
              about 10% more expensive than Tesla Powerwall. Those are useful price anchors, but they are not realized
              Lunar net revenue, because reseller bundles, installation labor, rebates, tax credits, software value
              capture, and distributor discounts are all undisclosed. Unavailable metrics therefore matter most here: no
              retained source publishes Lunar’s recognized revenue per system, software take rate, gross margin by
              stream, or revenue-recognition policy.
