      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer stack in this market is layered. Homeowners are the end users of backup power, bill savings, and
              energy-management software, but they are not always the only—or even primary—economic decision makers.
              Installers and third-party ownership providers influence product selection, financing structure, and the
              attachment of storage to solar. Utilities, community choice aggregators, and retailers become payers when
              they fund incentives, demand response, dispatch payments, or DERMS programs. Federal policy, through
              IRA-related tax incentives and DOE loan programs, sits one level above that by lowering the capital cost
              of eligible devices and platforms.


              Lunar’s public examples make this stack unusually visible. Peninsula Clean Energy and Silicon Valley Clean
              Energy are effectively institutional buyers of DERMS capability and dispatchable load relief, while
              homeowners remain the device owners and utility-rate beneficiaries. Ava Community Energy’s pilot and
              follow-on charging program show another version of the same structure: public agencies share in grid
              value, while customers receive annual payments or lower bills. Lunar also says Sunrun uses Gridshare
              across a dozen markets, demonstrating that installer or asset-owner channels can serve as the commercial
              bridge between a homeowner product and a utility-facing service. This layered buyer structure is why
              channel strength matters as much as raw battery demand in Lunar’s market.
