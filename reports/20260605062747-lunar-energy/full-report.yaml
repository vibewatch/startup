        - from: cpuc-cec
          to: homeowners
          label: set economics
        - from: tax-rules
          to: financiers
          label: shape underwriting
        - from: lunar
          to: homeowners
          label: delivers product and support
        - from: installers
          to: homeowners
          label: mediate trust
        - from: cpuc-cec
          to: lunar
          label: set monetization rules
    claimRefs:
      - CR032
      - CR034
      - CR040
      - CR042
      - CR044
      - CR046
      - CR053
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation moves from real operating proof through tracker conflict and disclosure gaps to a
      price-sensitive track/research-more stance.
    claimRefs:
      - CV004
      - CV008
      - CV009
      - CV036
      - CV039
      - CV040
      - CV043
    data:
      nodes:
        - id: n1
          label: Official capital raised
          detail: $300M in 2022 plus $232M in 2026 supports a real financing base.
          type: input
        - id: n2
          label: Operating proof
          detail: Thousands deployed and 650 MW under management show real commercial activity.
          type: input
        - id: n3
          label: Tracker conflict
          detail: PremierAlts shows $1B; Forge shows ~$452M; Notice is non-convertible without more data.
          type: input
        - id: n4
          label: Public disclosure gap
          detail: No public revenue, gross margin, burn, runway, debt, or preference stack.
          type: input
        - id: n5
          label: Sector headwinds
          detail: Policy, financing, and channel fragility can compress multiples.
          type: input
        - id: n6
          label: Current-mark range
          detail: Treat current value as a range, not a point estimate.
          type: intermediate
        - id: n7
          label: Entry discipline
          detail: Attractive lower, conditionally fair near $1B, stretched above that.
          type: intermediate
        - id: n8
          label: TRACK / RESEARCH-MORE
          detail: Proceed only with diligence on economics and security terms.
          type: output
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n8
        - from: n7
          to: n8
