      - number: '3.4'
        title: Switching costs, trust, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Switching cost in this market usually comes from the surrounding system rather than from the battery
              cabinet itself. Enphase and SolarEdge benefit when the homeowner already owns their inverter stack. Sunrun
              benefits when the customer is comfortable with a long-term subscription relationship and wants
              no-upfront-cost solar-plus-storage. Base benefits when the utility or retail-energy relationship is
              already bundled into the offer. These forms of lock-in matter because the category also carries visible
              trust risk. LG’s recall history shows that safety events can persist for years after the original sale.
              SolarReviews complaints about Sunrun and SolarEdge show that slow service resolution and poor
              communication remain live purchase risks, not edge cases. That trust layer strengthens substitute options.
              Some households still choose generator-only backup because it feels operationally simple, while others
              stay solar-only even though grid-tied systems shut down during outages without batteries. Lunar can
              exploit both gaps, but only if it can demonstrate better post-sale execution than the category’s visible
              failures.
