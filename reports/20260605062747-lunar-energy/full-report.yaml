      - number: '4.3'
        title: Capital stack, valuation conflict, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              On reported capital, the public record is much stronger. Lunar disclosed $300 million raised by August
              2022, then another $232 million across the 2026 Series C and D, implying roughly $532 million of lifetime
              capital by early 2026. The 2026 raise is explicitly tied to expanding the installed base, scaling
              Gridshare, and ramping production. Canary and B Capital add the most financially relevant context: Lunar
              is moving from roughly 10,000 systems of annual capacity to 20,000 by end-2026 and 100,000 by 2028, while
              operating assembly or production activity across multiple U.S. states. Those facts point to a business
              that is still consuming capital to build manufacturing, inventory, and channel reach.


              Valuation context is much less settled. Forge displayed a far lower $452.15 million Series D-1 valuation
              and only $278.26 million of total funding, while PremierAlts displayed a $1 billion valuation and $532
              million total raised, and Notice showed a $1.58 share-price signal without a clean public market-cap
              conversion. Because those sources do not reconcile their methodologies, the prudent view is to preserve
              the contradiction rather than smooth it over. What is unavailable is just as important: Lunar still does
              not publish cash, burn, runway, or debt, so the adequacy of the current capital stack cannot be directly
              underwritten.
