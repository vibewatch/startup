      - number: '3.2'
        title: 'Competitor profiles: who is strong on what'
        blocks:
          - type: paragraph
            body: >-
              Tesla remains the most obvious brand incumbent: it has a strong product, visible retailer integration in
              Texas, and review data showing both price leadership and persistent after-sales concerns. Enphase is the
              most ecosystem-driven alternative, with lower per-unit capacity but strong installer affinity and a long
              warranty for homeowners already standardized on microinverters. FranklinWH is the clearest whole-home
              resiliency challenger, especially for retrofit homes that want generator compatibility and very large
              expansion potential, but its private-company status leaves more durability uncertainty than the public
              leaders. sonnen’s Texas partnership is important because it shows a subscription-style, battery-only VPP
              can be sold to homes with or without solar, which overlaps with Lunar’s solar-agnostic narrative. Sunrun
              and Base Power matter for distribution reasons: Sunrun has the disclosed national fleet and subscription
              machine, while Base has the most utility-native public battery program structure. Generac and SolarEdge
              round out the field by bringing trusted legacy channels in generators and inverter-led solar ecosystems,
              respectively.
