  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy, tariff, and program dependence
        blocks:
          - type: paragraph
            body: >-
              Lunar's first-order risk is not a single disclosed company incident; it is a business model sitting on top
              of moving California and federal policy layers. California's net billing regime now pays export credits at
              grid-value rates that are usually below import rates, pushes customers onto specific electrification
              time-of-use plans, and makes battery economics highly tariff-dependent. That shift can still support
              storage attach, but it narrows the margin for error on pricing, installation quality, and software
              optimization. SGIP remains relevant, yet the accessible pools are increasingly targeted and process-heavy
              rather than broad, easy-to-capture homeowner rebates. DSGS is also real, but it is seasonal,
              performance-based, and operationally constrained rather than a universal annuity.


              Federal tax policy compounds the uncertainty. Section 48E still supports energy storage, but value depends
              on labor, domestic-content, and qualification rules that are not operationally simple for a channel-driven
              residential stack. The result is a risk profile where Lunar must constantly translate changing regulation
              into installer behavior, customer economics, and procurement choices. That does not break the thesis by
              itself, but it means Lunar's growth is unusually exposed to policy interpretation, tariff design, and
              California program administration compared with a less regulated software business.
            claimRefs:
              - CR001
              - CR002
              - CR003
