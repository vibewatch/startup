companyProfile:
  summary: >-
    Lunar Energy is a private Mountain View home-battery and virtual-power-plant company founded in August 2020 by
    former Tesla Energy leader Kunal Girotra. Public evidence supports a genuinely integrated residential stack spanning
    modular battery hardware, inverter and load-management components, homeowner and installer apps, and the Gridshare
    DERMS/VPP platform. The company emerged from stealth in 2022, acquired Moixa to deepen software capabilities, and by
    early 2026 had disclosed roughly $532 million of cumulative funding, more than 2,000 deployed systems, 40-plus
    installation partners, and 650 MW of devices under management. The underwriting problem is not whether Lunar built a
    real business; it is that revenue quality, margin, burn, warranty economics, and the current cap table remain
    private while public valuation signals conflict sharply.
