      - number: '6.5'
        title: Satisfaction, support, and retention blind spots
        blocks:
          - type: paragraph
            body: >-
              Public satisfaction signals are positive, but they are much thinner than a real retention dataset.
              EnergySage shows a 5.0 score from 10 reviews and FeaturedCustomers shows 4.7 out of 5 from 57 reference
              ratings, which suggests favorable early sentiment. Customer stories also include unusually specific
              service anecdotes, including weekend texts from the Lunar team, a one-day app fix, and multiple references
              to installers or Lunar staff answering questions rather than disappearing after the sale. Those details
              support a plausible claim that service responsiveness is part of the current offer.


              But satisfaction should not be mistaken for durability. There is no public NRR, GRR, churn, renewal,
              contract-length, or installation-cohort retention disclosure in the retained set. The public durability
              evidence is anecdotal: one home handled repeated outages, another owner cites six months of flawless
              operation, and others say the app changed behavior. That is useful as product proof, but not enough to
              underwrite installed-base economics. The result is a classic early-hardware asymmetry: lots of happy
              stories, very little portfolio math.
