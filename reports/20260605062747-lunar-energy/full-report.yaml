          high: 600
        - label: Base-case value (USD M)
          low: 700
          mid: 1000
          high: 1300
        - label: Bull-case value (USD M)
          low: 1500
          mid: 1900
          high: 2500
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      An IC-style scorecard summarizes why Lunar is interesting but not yet underwritten tightly enough for a premium
      point estimate.
    claimRefs:
      - CV004
      - CV011
      - CV024
      - CV036
      - CV043
    data:
      items:
        - label: Product / platform story
          value: 7
          detail: Integrated hardware, software, and VPP proof is credible on public evidence.
        - label: Financing proof
          value: 7
          detail: Official funding history is strong even though the current mark is disputed.
        - label: Public valuation clarity
          value: 3
          detail: Trackers conflict and Notice is not convertible without more data.
        - label: Economic transparency
          value: 2
          detail: No public revenue, margin, burn, or preference stack.
        - label: Public comp support
          value: 5
          detail: Comparable equities support a market for energy platforms but not precision for Lunar.
        - label: Sector backdrop
          value: 3
          detail: Policy, financing, and installer conditions remain adverse.
        - label: Diligence readiness
          value: 4
          detail: A range-based mark is possible, but an IC-ready valuation still needs private data.
