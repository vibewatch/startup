            body: >-
              The installation and operating model is unusually visible for a young residential battery company. Lunar
              publishes a homeowner workflow from certified-installer introduction through proposal, permitting,
              installation, PTO, and app onboarding; the installer guide then breaks that into concrete tasks spanning
              roof stringing, Maximizer and hub installation, ESS mounting, Bridge wiring, smart-breaker and CT
              installation, commissioning, and homeowner handoff. Just as important, the company documents what changes
              before and after PTO. Pre-PTO, the system can support backup but not export; post-PTO, PCS settings and
              utility rules govern import or export behavior, Lunar AI begins learning, and rate-plan confirmation
              matters.


              Interoperability is directionally strong but not fully open-book. Public sources support deployment into
              homes with or without existing solar, a ConnectDER meter-socket-adapter path, and Eaton smart breakers
              that work across retrofit and new-build settings. The installer app and partner page suggest
              serviceability was designed into the product, including fast commissioning and reverse-logistics-friendly
              modular blocks. But the same public pages also highlight execution risk: installers still size backup
              loads, submit PTO, set PCS behavior, and control whether some customer settings are editable. In other
              words, Lunar may be productized, but the final user experience remains meaningfully installer-dependent.
