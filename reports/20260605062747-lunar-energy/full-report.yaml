      - number: '1.3'
        title: Capital base, scale indicators, and manufacturing ramp
        blocks:
          - type: paragraph
            body: >-
              Lunar’s capital story is stronger than the user-provided background but also different from it. The
              best-supported public history is $300 million raised over two rounds by August 2022, followed by an
              additional $130 million Series C and $102 million Series D disclosed in February 2026. That gets to
              roughly $532 million of cumulative capital, not the $300 million-plus then $300 million-plus pattern in
              the prompt. The 2026 round added B Capital and Prelude as lead investors while also bringing back
              strategic and climate-tech investors including Sunrun, Itochu, Q Capital, DCVC, Piva, and Leitmotif. The
              investor mix matters because it combines channel access, strategic battery-market knowledge, and
              late-stage growth capital.


              Operating-scale signals are also meaningful. Lunar says it had deployed thousands of systems and was
              managing 650 MW of devices across multiple continents by February 2026. Girotra’s founder letter gives a
              narrower but still useful snapshot of more than 2,000 systems and more than 40 installation partners.
              Independent investor and media coverage broadly corroborates that Lunar is commercialized and shipping,
              not just piloting. The next proof point is manufacturing scale. Multiple 2026 sources say Lunar intends to
              double annual production to 20,000 systems by the end of 2026 and reach 100,000 by the end of 2028. If
              that ramp lands, Lunar becomes materially more relevant in U.S. residential storage; if it misses, the
              hardware side of the integrated thesis becomes less convincing despite strong software positioning.
