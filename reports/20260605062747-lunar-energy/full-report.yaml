            body: >-
              Lunar's go-to-market looks installer-first, finance-aware, and partner-mediated. The installer page
              positions Lunar less as a direct-to-consumer gadget brand and more as a channel company: commissioning
              tools, technical documents, fleet monitoring, and a dedicated account manager are all built for installer
              productivity and post-sale service. The same pattern shows up in customer stories, where trusted
              installers or demos repeatedly become the turning point in purchase decisions. That matters because it
              suggests customer acquisition is not only about product appeal; it is also about channel confidence and
              service quality.


              Financing adds another layer. pv magazine says many systems are now deployed through residential leases,
              while Jacquelyn's story explains why transferability and Sunrun-backed performance obligations can matter
              more than outright ownership for some households. This improves adoption potential, but it also creates
              dependency. Sunrun's AVL shows that channel partners can gate which products are allowed, and a bad
              finance counterparty could damage the customer experience even if the battery performs. Lunar's customer
