      - number: '5.4'
        title: Reliability, safety, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Lunar's public trust surface is better than a pure marketing-only startup, but it is still uneven. On the
              positive side, the company publishes a dedicated cybersecurity page that names ISO/IEC 27001, SOC 2 Type I
              and II alignment, CCPA and GDPR compliance, encryption, access management, continuous monitoring, and a
              public Vanta trust center. Safety signals are also more concrete than usual. The certifications explainer
              enumerates system- and component-level certifications, EnergySage repeats major UL and IEEE entries, and
              the May 2026 post explicitly addresses UL 9540A 6th Edition requirements for larger residential
              installations. Together, that is enough to support a credible safety and compliance narrative.


              The caution is that long-duration hardware reliability is still mostly company-asserted. The flood,
              seismic, coastal-fog, and fire-soot claims are official statements, not independently audited field
              studies. The retained set does not publish failure-rate curves, warranty-claim rates, cycle-life
              performance in the field, or public SLAs for uptime. Sunrun and Lunar do cite strong VPP uptime and
              dispatch outcomes, but those validate Gridshare program execution more than the lifetime durability of the
              home hardware. So the product appears thoughtfully engineered and well-tested, while the long-tail failure
              economics still require non-public diligence.
