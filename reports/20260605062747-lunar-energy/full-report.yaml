      - number: '8.3'
        title: Public comparables and what their multiples do and do not say
        blocks:
          - type: paragraph
            body: >
              Public comps help frame the multiple environment, but they do not solve Lunar's valuation directly because
              Lunar has not disclosed the denominator. In June 2026, Sunrun traded at roughly 5.58x EV/Sales, Enphase at
              6.21x, Generac at 4.05x, and SolarEdge at 3.38x. Those are not interchangeable companies. Sunrun carries
              financing intensity and scale but also complex capital structures and negative near-term cash generation
              in the quarter. Enphase shows what a higher-margin hardware-software mix can look like. Generac
              demonstrates that backup power can still command a solid franchise valuation even when residential storage
              specifically is soft. SolarEdge shows that a recovery narrative can coexist with still-negative
              profitability. Tesla's total-company multiple is far higher again, but it is not a clean
              residential-storage comp because auto, AI, robotics, and brand optionality dominate the equity story.


              That band is useful in one narrow way: it says the market still pays for credible energy platforms, but it
              pays very differently for quality, transparency, and business mix. The band is not usable in the usual VC
              shortcut of "pick a multiple and multiply by revenue" because Lunar does not publish revenue, margin, or
              segment mix. Public comps therefore support context, not precision. They show why a premium mark is
              possible in principle, but they do not independently prove that Lunar deserves one now.
