      - number: '8.4'
        title: Private comparables and strategic valuation reads
        blocks:
          - type: paragraph
            body: >
              Private comparables are directionally helpful because they show how investors have recently priced
              residential battery and VPP stories before they reach public-market disclosure standards. Base Power is
              the clearest current comparator because the business model is explicit: in 2025 it raised $200M in Series
              B, then another $1B in Series C at a reported $3B pre-money valuation. Base also disclosed concrete
              commercialization signals, including more than 100 MWh sold in Texas and an official website claim of
              20,000+ homes powered. That is not a one-for-one comp to Lunar, but it demonstrates that investors will
              support multi-billion private marks when commercialization, pricing, and customer value capture are made
              public.


              The contrast matters. FranklinWH's $25M Series B and 1,000-plus installer onboarding point to a much
              smaller, earlier private benchmark. sonnen is a strategic-value reference: Shell bought it outright in
              2019, and sonnen still markets VPP-ready storage, but the transaction does not provide a current
              stand-alone valuation. Put differently, private comps do not prove Lunar is overvalued or undervalued on
              their own. They do show that Lunar sits between far smaller venture-stage peers and much more explicit
              premium platforms. That middle position supports upside, but only if Lunar's undisclosed economics are
              closer to the premium side than the opaque side.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV044
      - number: '8.5'
        title: Bull, base, and bear framing under an adverse market backdrop
        blocks:
          - type: paragraph
            body: >
              The skeptical evidence matters because Lunar sells into a channel where valuation can compress before
              company-specific weakness is publicly visible. Mosaic's Chapter 11 and Sunnova's bankruptcy showed how
              quickly rising rates, policy uncertainty, dealer-payment stress, and tighter financing can break
              residential solar-and-storage intermediaries. Roth Capital's 2026 projection for a 33% decline in U.S.
              residential solar installations and Wood Mackenzie's warning that installer customer-acquisition costs
              could spike 40% in 2026 add a second layer of caution: even capable companies may need to work through a
              worse financing and customer-acquisition environment than earlier 2021-2023 marks implied.


              That adverse backdrop is why the chapter keeps wide scenario bands. Bear case, roughly $0.25-0.6B,
              reflects channel and financing stress, a down-round, or evidence that revenue quality is weaker than
              current traction messaging suggests. Base case, roughly $0.7-1.3B, assumes Lunar's official operating
              proof is real enough to defend something around the current upper tracker range but not enough to support
              a much richer step-up without fresh disclosure. Bull case, roughly $1.5-2.5B, requires the company to
              translate hardware-plus-software traction into disclosed revenue and margin evidence that looks more like
              a premium platform than a capital-hungry hardware vendor. That is possible, but not yet publicly proven.
