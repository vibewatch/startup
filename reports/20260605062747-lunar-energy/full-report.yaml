    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue base
        - No public revenue or cohort-level billings disclosure
        - Without a denominator, public EV/Sales bands cannot be converted into a defendable Lunar valuation.
        - Management / finance — provide monthly recurring and hardware revenue bridge by channel.
      - - Gross margin and service burden
        - No public hardware, software, warranty, or service gross-margin split
        - This decides whether Lunar belongs closer to Enphase-like premiums or lower-quality hardware comps.
        - Management / operations — provide gross-margin by product line plus warranty and truck-roll history.
      - - Liquidity and burn
        - No public cash balance, burn, runway, debt schedule, or warehouse exposure
        - The adequacy of the current capital stack cannot be underwritten without it.
        - Finance team — provide current cash, debt, burn, and 18-24 month liquidity plan.
      - - Cap table and preferences
        - No public preferred-share waterfall, liquidation preference, or conversion detail
        - Headline valuation can diverge sharply from economic value depending on terms.
        - Legal / CFO — provide cap table, preference stack, and recent financing documents.
      - - Secondary pricing depth
        - No public evidence on transaction volume or matched-price depth behind tracker marks
        - A quoted private mark is less useful if it represents thin or stale trading.
        - Secondary broker / tracker — request methodology, dates, and transaction depth for current marks.
      - - Channel concentration
        - No public disclosure of installer, lender, or strategic-partner concentration by revenue
        - Sector bankruptcies show counterparties can impair value quickly even when end demand exists.
