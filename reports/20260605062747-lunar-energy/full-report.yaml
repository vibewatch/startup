      - number: '6.6'
        title: Concentration risk and unresolved customer-mix gaps
        blocks:
          - type: paragraph
            body: >-
              This chapter's biggest analytical limitation is concentration of proof. The visible customer base is still
              mostly California households, and the visible software buyers are still a small set of CCAs, utilities,
              and Sunrun-linked programs. That does not mean the real customer base is narrow, but it does mean the
              public evidence is. The strongest independent skeptical source in the set, NRG Clean Power's review,
              explicitly flags limited track record, unclear pricing, and still-developing installer availability. Blind
              adds a weak employee-side trust signal, which is not a customer metric but does raise the odds of service
              or execution slippage if internal instability is real.


              The year-in-review interview sharpens the same point in a different way: VPP adoption still depends on
              savings, ease, trust, and viable finance partners. That is consistent with Lunar's own curated proof,
              which leans heavily on customer confidence and channel quality. The company appears to have real customers
              and real utility programs, but public evidence still does not disclose customer concentration by channel,
              revenue contribution by partner, or durable retention by install cohort.
