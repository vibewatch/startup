  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Lunar's visible customer journey starts with a household pain point, moves through a trusted installer or demo,
      and only becomes durable when the app, service, and VPP economics work together.
    data:
      nodes:
        - id: j1
          label: Pain recognition
          detail: Households react to rising PG&E bills, NEM 3.0 economics, EV charging load, or outage anxiety.
          tone: warning
        - id: j2
          label: Trust-building discovery
          detail: Referral, self-research, or a live demo gives Lunar credibility before the sale.
          tone: neutral
        - id: j3
          label: Installer / finance fit
          detail: A partner quote, lease option, or approved-vendor pathway turns interest into a feasible project.
          tone: neutral
        - id: j4
          label: Install and onboarding
          detail: Commissioning speed, app setup, and first support touchpoints shape the early experience.
          tone: positive
        - id: j5
          label: Daily value realization
          detail: Customers see lower bills, smoother outage backup, app visibility, and sometimes VPP payments.
          tone: positive
        - id: j6
          label: Expansion or advocacy
          detail: Satisfied households add EV or heat-pump plans, recommend installers, or stay in VPP programs.
          tone: positive
    approximationNotes: >-
      This is a qualitative composite built from named stories; not every household follows every step in the same
      order.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU024
      - CU027
      - CU028
      - CU043
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      The visible funnel runs from household pain to installer-mediated project approval, then to app-led optimization
      and grid-program participation.
    data:
      nodes:
        - id: f1
          label: High bills or outage pain
          detail: Rates, outages, EV charging, or NEM 3.0 create urgency.
          tone: warning
        - id: f2
          label: Evaluate battery options
          detail: Homeowners compare Lunar with Tesla, Franklin, or a solar-only path.
          tone: neutral
        - id: f3
          label: Installer + channel approval
          detail: A trusted installer, distributor, or Sunrun-approved equipment path makes deployment possible.
          tone: neutral
        - id: f4
          label: Install, commission, app onboarding
          detail: Commissioning speed and support quality determine whether the product feels premium or risky.
          tone: positive
        - id: f5
          label: Daily optimization and VPP enrollment
          detail: Lunar AI, TOU savings, and VPP payments convert the system from hardware into a service experience.
          tone: positive
        - id: f6
          label: Referral / electrification expansion
          detail: Customers recommend the system, plan EV or heat-pump loads, or remain in program participation.
          tone: positive
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    approximationNotes: Flow emphasizes the observed go-to-market mechanics rather than a quantified conversion funnel.
    claimRefs:
      - CU002
      - CU022
      - CU026
      - CU027
      - CU028
      - CU043
      - CU044
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Public customer proof is strongest on household outcomes and weaker on repeatability or retention visibility.
    data:
      columns:
        - Outcome specificity
        - Backup proof
        - VPP monetization
        - Retention visibility
      rows:
        - label: Brandon
          values:
            - label: strong
              tone: positive
              detail: Named bill reduction from about $750 to $125.
            - label: medium
              tone: positive
              detail: Battery pitched for backup and VPP readiness.
            - label: medium
              tone: positive
              detail: Enrollment in a VPP is disclosed, but payout is not.
            - label: low
              tone: warning
              detail: No renewal or durability data beyond the story.
        - label: Jennifer
          values:
            - label: strong
              tone: positive
              detail: $335 AI benefit, about $65 monthly bill, and almost $300 VPP earnings.
            - label: strong
              tone: positive
              detail: Customer says the entire house stayed protected through outages.
            - label: strong
              tone: positive
              detail: Direct VPP earnings are quantified.
            - label: low
              tone: warning
              detail: Still a single-household snapshot rather than a cohort.
        - label: Percy
          values:
            - label: strong
              tone: positive
              detail: Over 35 kWh dispatched plus explicit cash payouts.
            - label: strong
              tone: positive
              detail: At least six outages handled without disruption.
            - label: strong
              tone: positive
              detail: VPP and DSGS participation are central to the story.
            - label: low
              tone: warning
              detail: No portfolio-level reliability data behind the anecdote.
        - label: Steve
          values:
            - label: strong
              tone: positive
              detail: Bills reportedly fell from $600+ to $35.
            - label: strong
              tone: positive
              detail: Whole-home backup is explicitly described.
            - label: low
              tone: neutral
              detail: VPP economics are not discussed.
            - label: low
              tone: warning
              detail: No multiyear retention or warranty data are given.
        - label: Lucas family
          values:
            - label: medium
              tone: positive
              detail: Lifestyle and integration outcomes are clear; dollar savings are not.
            - label: medium
              tone: positive
              detail: Brownout / blackout protection is directly cited.
            - label: medium
              tone: positive
              detail: VPP participation is disclosed, but payout is not quantified.
            - label: low
              tone: warning
              detail: No duration or renewal evidence beyond a current story.
    approximationNotes: >-
      Matrix scores evidence quality, not product performance. Weak retention visibility reflects missing public cohort
      data, not known churn.
    claimRefs:
      - CU035
      - CU036
      - CU040
      - CU041
      - CU045
      - CU047
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Residual risk is highest where California policy sensitivity intersects channel fragility and missing lifetime
      loss data.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
        - Very high likelihood
      rows:
        - label: Critical impact
          values:
            - ''
            - Residential battery safety / AHJ friction
            - California policy and incentive reset
            - Installer / financed-sale breakdown
        - label: High impact
          values:
            - Cyber or data incident
            - Sunrun concentration
            - Warranty reserve drag
            - Customer-owned solar contraction
        - label: Medium impact
          values:
            - Complaint escalation
            - DSGS monetization limits
            - FEOC / AVL procurement friction
            - Tariff-fit execution
        - label: Moderate impact
          values:
            - Standards transition
            - Residual complaint visibility
            - Program enrollment churn
            - Partner diversification lag
    claimRefs:
      - CR003
      - CR022
      - CR027
      - CR036
      - CR041
      - CR044
      - CR051
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Policy and counterparty shocks reach Lunar through customer economics, installer liquidity, support load, and
      valuation confidence.
    data:
      nodes:
        - id: policy
          label: Policy / tariff shifts
          detail: NBT, SGIP, 48E, FEOC, DSGS rules
        - id: payback
          label: Customer economics
          detail: Export credits, tax-credit value, and bill-savings case
        - id: sales
          label: Sales conversion
          detail: Homeowner demand and attach rates
        - id: installer
          label: Installer cash flow
          detail: Milestone payments, backlog, and service capacity
        - id: support
          label: Support / warranty load
          detail: Truck rolls, replacements, and complaint handling
        - id: margin
          label: Gross margin
          detail: Service expense and channel economics
        - id: revenue
          label: Revenue growth
          detail: Hardware pull-through and software program volume
        - id: valuation
          label: Valuation / confidence
          detail: Multiple compression when uncertainty persists
      edges:
        - from: policy
          to: payback
          label: changes system value
        - from: payback
          to: sales
          label: moves close rates
        - from: sales
          to: installer
          label: changes throughput
        - from: installer
          to: support
          label: drives service quality
        - from: support
          to: margin
          label: raises cost to serve
        - from: sales
          to: revenue
          label: sets deployment volume
        - from: margin
          to: valuation
          label: compresses upside
        - from: revenue
          to: valuation
          label: resets growth multiple
    claimRefs:
      - CR002
      - CR027
      - CR039
      - CR041
      - CR043
      - CR045
      - CR052
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Lunar's visible public growth path depends on regulators, installers, finance structures, and one especially
      important VPP partner.
    data:
      nodes:
        - id: lunar
