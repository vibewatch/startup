      - number: '8.2'
        title: Financing chronology, tracker conflict, and current mark discipline
        blocks:
          - type: paragraph
            body: >
              Lunar's strongest valuation anchor is not a disclosed post-money valuation but a disclosed financing
              chronology. The company said in August 2022 that it had raised $300M over two rounds, then said in
              February 2026 that a $102M Series D followed a previously unannounced $130M Series C. That arithmetic
              supports about $532M of lifetime capital raised. The problem starts immediately after that. PremierAlts
              currently shows Lunar at a $1B market-implied valuation and repeats the $532M funding total. Forge, by
              contrast, shows a February 2026 Series D-1 valuation of only $452.15MM and total funding of just
              $278.26MM. Notice contributes only a $1.58 stock-price signal without the share-count or security details
              needed to translate that into a reliable company valuation.


              Those conflicts are too large to smooth away. The honest read is that public trackers disagree on both the
              size of the company and the security being observed. That means a unicorn framing is lightly evidenced
              rather than well corroborated. It also means investors should separate three questions that are often
              collapsed into one: what Lunar officially raised, what a specific tracker thinks one line of securities is
              worth, and what a new investor should pay today after dilution and preferences. Because Lunar does not
              publicly disclose revenue, burn, debt, or liquidation preferences, current-mark discipline has to stay
              range-based rather than point-estimate based.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
