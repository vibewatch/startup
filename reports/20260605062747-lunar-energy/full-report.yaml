        - Track Lunar service-level metrics and warranty claim response times before making trust-led GTM claims
      - - Ecosystem lock-in
        - >-
          Enphase and SolarEdge benefit when customers already use their inverters; Sunrun benefits when customers want
          a subscription
        - Medium
        - Existing-hardware and contract relationships raise switching friction after first install
        - >-
