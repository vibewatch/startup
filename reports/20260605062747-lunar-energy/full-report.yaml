      - number: '7.3'
        title: Financing, channel, and partner dependence
        blocks:
          - type: paragraph
            body: >-
              The most visible commercial risk in the current record is not customer demand going to zero; it is the
              fragility of the residential channel that must convert that demand. SEIA and market coverage point to a
              weak 2025, a tougher 2026, and continued reliance on third-party ownership to soften the loss of
              customer-owned tax-credit economics. That alone would already be a hard backdrop for a young residential
              battery vendor. It becomes harder when major lenders fail. Mosaic's Chapter 11 is concrete evidence that
              financing counterparties can break in this market, and the articles around the case describe the exact
              transmission mechanism Lunar should care about: delayed milestone payments, installer cash squeezes,
              servicing complexity, and confusion around who completes partially finished projects.


              Lunar's public proof is also partner-concentrated. Its strongest disclosed U.S. Gridshare evidence still
              runs through Sunrun programs and Sunrun claims of scale. That is helpful because it proves real software
              operation, but it is risky because it can mask concentration. If approved-vendor-list behavior tightens
              further, or if a large channel partner changes priorities, Lunar can lose distribution, software volume,
              and public proof at the same time. The company has credible partner-side momentum, but the public record
              still suggests a channel-led, not demand-insulated, growth model.
