  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: storage hardware plus orchestration, not just batteries'
        blocks:
          - type: paragraph
            body: >-
              Lunar does not sit in a single clean product category. The narrowest lens would call it a residential
              battery vendor, but the public evidence shows that this misses a large part of the economic logic. DOE,
              FERC, CPUC, and Lunar’s own utility-partner announcements all describe a market in which value is created
              by combining behind-the-meter assets with software that can respond to tariffs, grid events, and wholesale
              or utility capacity needs. In other words, the relevant market is integrated residential storage plus
              orchestration. Included spend therefore covers the battery, power electronics, smart controls, installer
              labor, and the software layer that manages dispatch, enrollment, and customer economics.


              That boundary matters because the status quo is broader than brand-vs-brand battery competition.
              Solar-only systems, unmanaged time-of-use behavior, backup generators, and utility peaker plants are all
              substitutes for some part of the customer job or grid job Lunar is trying to solve. Utility-scale
              batteries are adjacent but not identical because they do not solve homeowner backup or customer
              acquisition. This broader framing also explains why public buyers in the chapter are not limited to
              homeowners. Community choice aggregators, utilities, and even federal financing programs appear throughout
              the evidence because they influence whether residential batteries become grid assets rather than idle
              backup devices.
