  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix and buyer / user / payer logic
        blocks:
          - type: paragraph
            body: >-
              Public customer evidence supports a real market presence, but it also makes the mix unusually clear. The
              disclosed end customer is overwhelmingly the California homeowner trying to solve a concrete household
              problem: a painful PG&E or time-of-use bill, recurring outages, or the desire to electrify more of the
              home without handing control to the utility. Installers sit between Lunar and that homeowner on nearly
              every observed path. In story after story, the installer is the seller, explainer, and service backstop,
              while utilities and community-choice aggregators show up as downstream payers for flexibility rather than
              as direct buyers of the residential battery itself.


              That split matters for underwriting. Lunar appears to have at least three customer classes, but only one
              of them is deeply visible in public: homeowners. Installer partners influence trust and conversion, while
              CCAs, utilities, and VPP operators pay for software or dispatch value created from those homes. What is
              missing is a public bridge from these segments to revenue mix. The evidence supports real demand, but not
              yet a clean disclosure of what portion of revenue comes from direct hardware, leased systems, installer
              channels, or software program contracts.
