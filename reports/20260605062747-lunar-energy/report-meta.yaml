  customerFocus: California-first homeowners buying through installers, plus utilities and CCAs using Gridshare to orchestrate distributed energy programs.
  businessModel: Installer- and distributor-led hardware sales layered with embedded optimization software and Gridshare/VPP program monetization rather than pure SaaS.
  stage: Series D / late-stage private
  fundingStatus: Oversubscribed $102 million Series D announced in February 2026 followed a previously undisclosed $130 million Series C, bringing disclosed lifetime capital to about $532 million while leaving valuation and preference terms unresolved in public sources.
