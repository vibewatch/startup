  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 治理和监管姿态是最高严重度的风险集群
        blocks:
          - type: paragraph
            body: >-
              分配资料库中最具体的反向证据不是产品失败，而是上市母公司的控制失灵。Sina 转述的上海证券交易所纪律处分决定称，Guolian Shares 对 2024
              年收入和成本披露作出重大更正，在多次延期后仍迟延回复交易所，并将 RMB4.9 million 募集资金用于与获批 AI 项目关联不紧密的支出。 由于 Tuduoduo
              处于同一控制环境内，这段历史确实引出一个尽调问题：子公司报告、资本配置纪律，以及监管要求澄清时管理层升级机制是否有效。 另外，中国《危险化学品安全法》自 2026 年 5
              月起覆盖生产、储存、使用、运输和应急响应。如果 Tuduoduo 或其物流关联方处理受该法覆盖的化学品或达到阈值的数量，
              许可、安全使用、评估和工业园选址义务会迅速影响投资判断。现有公开证据没有确认实体层面许可、安全评估报告或园区选址，因此在管理层提供这些记录前， 法律合规剩余风险仍高。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
