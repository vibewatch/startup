      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              分配到的证据显示，买方主要是工业制造商、分销商和跨境贸易运营商，而非终端消费者。MRF 的细分信息称，最大或增长最快的需求来自 通用工业和汽车 / 交通运输涂料；Tuduoduo
              的融资备忘录及巴基斯坦扩张公告则强调数字供应链、智能物流和贸易赋能服务。 这组合出一条务实的采用路径：商务或采购团队发起平台使用，以改善采购和营运资金周转；当涂层性能重要时，工厂或质量团队成为日常用户；
              涉及危险品文件或跨境流转时，合规或物流团队成为关键的次级用户。换句话说，这个市场不只是把产品挂到网上，而是要替工业企业替换采购、 合规和履约流程中原本控制预算的手工协调。
