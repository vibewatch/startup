      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正方
        - 已具备规模和盈利能力的子公司，并有明确的价格锚点。
        - 已报告 2024 年收入 RMB25.52b、净利润 RMB1.068b，并披露 RMB15.8b 投前轮融资。
        - 2025 年经审计报表，以及完整 B1 轮已按同样条款完成的证明，会强化这一判断。
      - - 正方
        - 跨境扩张可能扩大生态价值。
        - IBI 称其巴基斯坦数字经济总部已经启动，并与巴基斯坦 RIC 签署 MOU。
        - 若有独立的交易量、费率和合规经济性证据，这一上行空间才更能纳入投资判断
      - - 反方
        - 当前价格可能已经计入了超过公开证据所支持的确定性。
        - 目前公开确认已完成的计划轮次仅有 RMB70m，指定来源池中也缺少直接可比的估值参考。
        - 若入场估值更低，或有更有力的第三方可比证据，这一担忧将有所缓解。
      - - 反论
        - 母公司治理与下行条款风险可能侵蚀少数股东回报。
        - Guolian 保持控制权；本轮包含年化 7.5% 的回购公式，而不利报道还暴露出母公司的披露 / 会计问题。
        - 明确的权利文件，加上更干净的治理证明，才能降低投资者应要求的折价。
    notes: 论据仅限于指定的预取来源池；缺少公开可比交易仍是影响精确度的重要约束。
