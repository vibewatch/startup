      - number: '2.3'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求侧可信但并不单一。MRF 将城市化、汽车增长和更严格的环保规则视为持续支撑涂料行业的因素；Tuduoduo 自身的资本计划和巴基斯坦生态
              推进也显示管理层仍在向工业交易扩张配置资源，而非收缩。与此同时，采用显然取决于合规执行，而不仅是总需求。中国危险化学品安全法如今覆盖 从生产到运输和应急响应的全流程；Intertek 的 SDS
              指引显示，危险品贸易通常需要分类、翻译、收集供应商数据以及按司法管辖区准备文件。 下游出口机会也受到许可约束：中国自 2026 年 1
              月起对纯电动乘用车实行出口许可，这说明相邻制造业贸易可以扩张，但卖家和中间商也会增加行政步骤。 主要尽调缺口在于，分配资料库中没有当前公开来源把这些驱动和摩擦与 Tuduoduo 已披露的特定
              SAM、转化漏斗或预算负责方经济性联系起来。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
              - CM016
