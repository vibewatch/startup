      - number: '1.3'
        title: 融资、规模与控制权
        blocks:
          - type: paragraph
            body: >-
              最新规模证据主要来自 2025 年 12 月融资披露和少量二级市场数据页面。Sina 对 Guolian 公告的转述称，Tuduoduo 以 RMB15.8 billion 投前估值启动 B1
              轮融资，计划募集最多 RMB365 million，首笔 RMB70 million 已签署。 同一披露称，Guolian 将继续保持控股股东地位，持股仅从 75.9250% 小幅降至
              75.5902%；这说明外部资本进入时， 母公司并未失去合并控制权。已公布数字也显示出可观的经营规模：2024 年收入 RMB25.52 billion、净利润 RMB1.068 billion；2025
              年前九个月收入 RMB22.133 billion、净利润 RMB871 million。仍缺少的是一条公开且可核对的 桥接，解释美元融资数据库、人民币子公司披露以及 B1 计划其余部分的最终交割状态。
