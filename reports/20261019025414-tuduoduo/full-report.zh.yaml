  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 国内交易栈与用户工作流
        blocks:
          - type: paragraph
            body: |-
              核心国内产品仍是面向涂料及相邻化学品的垂直交易工作流，而不是纯软件工具。与公司有关的描述显示，平台成立于 2014 年，服务涂料和油墨供应链，
              核心是原材料与成品的 B2B 交易，之后又延伸到移动应用、C2B 商城、体验店、加盟服务和涂料工程师联盟等面向消费者和现场服务的渠道。
              因此，用户要解决的不只是在线下单，还包括在分散的工业工作流中完成采购、渠道协调和服务履约。

              公开来源还明确显示，Tuduoduo 销售的是一套捆绑式运营方案，而不只是店面。已审阅的描述将交易界面与供应链服务和融资支持放在一起，
              这说明变现和留存可能依赖执行广度，而非单一软件订阅。代价是，公开记录对产品广度的证据远强于对可量化采用、转化或模块附加率的证据；
              因此，在将这套工作流视为深度嵌入前，仍需买方层面的使用证明。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
