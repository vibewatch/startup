      - number: '1.2'
        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              管理层证据显示公司与母公司的绑定很紧。Tuduoduo 自有企业新闻页面称 Liu Zhai 同时担任 Guolian 董事、高级副总裁和 Tuduoduo
              CEO，并列出了负责公共业务、产融科技以及投资融资的多名副总裁。UEIIBI 记录的母公司国际业务也表明， 资本配置和对外扩张仍靠近 Guolian / IBI 管理层；创始人兼 CEO Qian Xiaojun
              是新海外项目的主要推动者。 这种结构有利于增长，但也带来关键人物和关联公司治理方面的尽调需求，因为公开记录没有展示完整董事会、委员会或少数股东保护安排。
            claimRefs:
              - CO011
              - CO012
