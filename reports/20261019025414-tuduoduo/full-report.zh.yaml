            body: >-
              已披露的 B1 融资之所以具有战略意义，是因为资金用于营运资金、工业电商规模、数字供应链和云工厂建设以及跨境扩张，而不是狭义的资产负债表清理。 即便如此，公开报道明确披露的只有 RMB70 million
              首笔资金；相对于在 RMB15.8 billion 投前估值下最多 RMB365 million 的计划，如果 Guolian 未在四年内 将投资者退出，结构还可能产生年化 7.5%
              的回购义务。独立行业证据也显示底层需求和定价环境承压：中国化工产品价格大幅下跌，化工制造业利润在 2025 年走弱；
              涂料终端市场更像温和增长行业，而非爆发式行业。公司概览应承载完整轮次时间线；这里的财务判断更窄：公开证据仍不足以评估现金跑道、营运资金吸收、 实际定价或毛利率韧性。
