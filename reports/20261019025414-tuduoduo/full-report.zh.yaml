  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 牛市
        - Tuduoduo 将工业平台规模转化为持续的利润增长，完成 B1 轮全额募资，并证明跨境扩张的经济性。
        - 如果经审计的 2025 年指标、投资者权利和执行证明都确认 2025 年投前估值标记较为保守，当前价格就有成立的可能。
        - 需要公司发布的扩张说法之外的独立证明。
        - 扩张未能转化为可量化的交易量、利润率或现金创造。
      - - 基准
        - 核心交易市场仍能盈利，但估值支撑主要停留在内部，宏观增长保持温和。
        - 更合理的做法是持有 / 观察，而不是激进买入：资产本身可能不错，但公开证明材料仍然单薄。
        - 这最符合当前的组合：真实的轮次标记、温和的终端市场增长，以及尚未解决的治理 / 细节缺口。
        - 没有进一步的交割披露，没有经审计的 2025 年证明，或治理层面出现更多噪音。
      - - 熊市
        - 治理折价扩大、权利安排被证明不利于投资者，或监管 / 执行负担削弱信心。
        - 下行更多来自在确定性尚未得到证据支持前为确定性付费，而不是来自市场不存在。
        - 不利的母公司治理背景，加上新的化学品安全要求，使这一情景仍然可信。
        - 披露问题进一步恶化、现金转化疲弱，或合规出现滑坡。
    notes: 这些情景是判断区间，而不是 DCF 输出，因为指定来源池缺少直接可比集合、经审计的 2025 年子公司现金流，以及明确的轮次文件。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
