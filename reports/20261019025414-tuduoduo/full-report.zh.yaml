            body: >-
              最有力的公司控制证据仍将 Tuduoduo 描绘为 Guolian 生态内、总部位于北京的核心子公司，而非独立的综合型市场平台。 供应商简介称其是首个通过云物流和 ERP
              系统整合油漆与涂料产业链的垂直电商平台；Multiples 则另行将其归入 B2B 电商和佣金业务。这足以为后续章节锚定一句话描述，但还不足以彻底厘清全部元数据：Multiples 同时称公司 总部位于杭州、于
