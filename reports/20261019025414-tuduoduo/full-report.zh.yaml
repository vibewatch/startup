  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局按替代类别划分，而非按同业名单划分
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 的公开定位是 Guolian 控制的工业互联网平台，扎根于涂料和化学品，再扩展至相邻工业链和服务层。在分配到的来源池中，最清晰的替代方案
              不是另一家拥有同等丰富公开披露的垂直同业，而是买方已有的一揽子选择：提供广泛国内批发渠道的 1688、直接向工厂采购、现有生产商的直销渠道、
              线下分销商和贸易商，以及外包采购代理模式。这一点很重要，因为买方的比较集不只是“另一家涂料市场”。因此，Tuduoduo 必须靠编排能力取胜——品类广度、
              交易工具、物流和融资支持——而不能只靠独特目录的存在。画像表明确呈现了这种不对称：知名同业透明度低，但替代类别透明度明显更高。
