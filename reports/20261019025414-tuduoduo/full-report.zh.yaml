  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模判断
        blocks:
          - type: paragraph
            body: >-
              当前公开资料支持的市场边界，比泛泛的“工业互联网”叙事更窄。Tuduoduo 2025 年 12 月的融资披露将业务定位于工业电商交易增长、
              数字供应链建设、数字云工厂和跨境产业带服务，而不是消费市场或纯软件席位模式。独立来看，资料库中最干净的当前分类规模视角是
              中国工业涂料市场，因为只有这一第三方来源量化了一个直接相邻的支出池，并提供当前规模、增长和细分信息。这些证据有助于界定机会边界， 但不是公司特定的 TAM / SAM / SOM 桥接：同一资料库没有披露
              Tuduoduo 的抽成率、活跃买家数，或其在涂料与其他工业品类中的渗透率。 因此，结果是一个有依据的自上而下视角，同时明确存在自下而上的缺口，而不是完整的市场规模模型。
