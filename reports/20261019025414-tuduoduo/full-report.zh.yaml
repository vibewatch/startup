  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议取决于真实的规模和真实的轮次信号，但治理、披露和合规不确定性仍压制价格。
    data:
      nodes:
        - id: scale
          label: 已披露的规模与盈利能力
          note: 2024 年子公司收入 RMB25.52b，净利润 RMB1.068b。
        - id: anchor
          label: 真实但狭窄的价格锚点
          note: B1 融资目标为 RMB15.8b 投前估值，但目前公开确认的首笔分期仅为 RMB70m。
        - id: market
          label: 宏观支持为正面，但并不爆发
          note: 工业涂料前景为个位数低增长；中国供应链金融仍然规模庞大且在结构性增长。
        - id: governance
          label: 治理折价仍有必要
          note: Guolian 保持控制权，且本轮披露了年化 7.5% 的回购公式。
        - id: regulation
          label: 合规负担上升
          note: 危险化学品法如今覆盖从生产到应急响应的全流程。
        - id: decision
          label: 建议进一步研究 / 估值偏高
          note: 在将当前价格纳入投资判断前，需要完整的交割证明、投资者权利细节，以及更干净的经审计 2025 年证据。
      edges:
        - from: scale
          to: anchor
          label: 建立
        - from: anchor
          to: market
          label: 仍需
        - from: market
          to: governance
          label: 被……抵消
        - from: governance
          to: regulation
          label: 叠加
        - from: regulation
          to: decision
          label: 导致
    approximationNotes: 这是逻辑链，而不是量化模型。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
      - CV014
