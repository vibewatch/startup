    data:
      nodes:
        - id: demand
          label: 买方需求
          value: Coatings and industrial chemical procurement
          detail: 公开页面强调原材料和终端产品交易。
        - id: platform
          label: Tuduoduo 交易市场层
          value: B2B2C, mobile, C2B, and offline service channels
          detail: 公开渠道组合广泛，但实际定价未披露。
        - id: suppliers
          label: 供应商库存与商户参与
          value: Commodity and industrial product categories
          detail: 公开来源显示其意在提供卖家服务并赋能商户。
        - id: logistics
          label: 物流与仓储层
          value: Fulfillment and supply-chain execution
          detail: 公司发布的来源将物流定位为核心变现支持层。
        - id: finance
          label: 支付与金融层
          value: Flexible payment and supply-chain finance
          detail: 经济性在战略上很重要，但公开信息不透明。
        - id: revenue
          label: 收入获取
          value: Transaction spread, service fees, and marketing monetization
          detail: 公开披露支持这些机制，但没有披露抽佣率或收入流构成。
        - id: pressure
          label: 毛利压力
          value: Sector price deflation and multihoming risk
          detail: 独立来源表明，定价压力可能限制收费能力和利润率扩张。
      edges:
        - from: demand
          to: platform
        - from: platform
          to: suppliers
        - from: suppliers
          to: logistics
        - from: logistics
          to: finance
        - from: finance
          to: revenue
        - from: revenue
          to: pressure
    approximationNotes: 这条桥接只反映公开描述的收入机制和风险层。没有公开来源提供从 GMV 到收入再到毛利的量化瀑布图。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI011
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Tuduoduo 披露的技术栈以 ERP / 物流协同和重服务执行为底座，向上叠加交易入口。
    data:
      layers:
        - label: 买卖双方入口
          detail: 公开页面将网页端、移动端、C2B 和线下辅助渠道结合起来。
          modules:
            - B2B2C 商城
            - 移动商城
            - C2B 商城
            - APP
            - 品牌体验店
            - 服务加盟店
        - label: 垂直品类与交易层
          detail: 核心交易市场聚焦涂料、油墨及相关化学品。
          modules:
            - 建筑涂料
            - 木器涂料
            - 工业涂料
            - 粉末涂料
          outputs:
            - 发起订单
            - 供应商匹配
        - label: 运营底座
          detail: Tuduoduo 将云 ERP 和云物流描述为基础架构。
          modules:
            - 云 ERP
            - 云物流
            - 集体采购
            - 供应链金融
        - label: 跨境执行
          detail: TDD-global 将技术栈从交易延伸到实体履约和监管履约。
          modules:
            - 海外仓
            - 航运线路
            - 清关与退税
            - 跨境保险
            - 跨境生产与融资
        - label: 区域与合作伙伴赋能
          detail: 扩张材料强调由母公司支持的 6+N 全链条服务模式。
          modules:
            - 数字化供应链建设
            - 云 AI 赋能
            - 联合项目协助
            - 投资合规支持
        - label: 公开证明缺口
          detail: 经审阅的公开记录没有呈现直接 API、正常运行时间、认证或事故材料。
          outputs:
            - 需要提出尽调请求
            - 可靠性仍未验证
    approximationNotes: 该架构来自已披露的模块和服务综合整理，并非公司发布的系统图。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE008
      - CE009
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据指向一条以交易为主导的工业采购旅程，正在向跨境延伸，但仍受合规和验证缺口约束。
    data:
      nodes:
        - label: 品类需求
          value: General industrial largest; auto fastest-growing
          detail: 需求背景来自中国工业涂料市场证据，而不是 Tuduoduo 特有的份额数据。
          touchpoints:
            - General industrial coatings hold the largest end-use share in the cited market outlook.
            - Automotive and transportation is the fastest-growing cited end-use segment.
        - label: 发现与下单
          value: Industrial e-commerce platform
          detail: 公司公开描述将 Tuduoduo 定位为工业品和原材料的 B2B 交易市场。
          touchpoints:
            - Industrial goods and raw-material online transactions are the dominant revenue surface.
        - label: 履约路径
          value: Pickup, direct ship, logistics, or title transfer
          detail: 据报道，交付模式混合了实体履约和非实体的所有权转移交易。
          touchpoints:
            - Customer pickup
            - Supplier direct shipment
            - Duoduo Logistics delivery
            - Title transfer without physical movement
        - label: 合规检查点
          value: Hazardous-chemicals controls
          detail: 2026 年法律提高了对危险化学品销售、储存、使用、运输和登记的运营纪律要求。
          touchpoints:
            - Hazardous-chemicals safety law effective 2026-05-01
            - Compliance can affect transaction speed and customer onboarding
        - label: 扩张服务
          value: Cross-border trade and digital supply-chain setup
          detail: Pakistan 材料将物流、数字化供应链建设和合规支持列为附加服务。
          touchpoints:
            - Cross-border trade
            - Intelligent logistics
            - Digital supply-chain setup
            - Investment compliance support
        - label: 持续性证明缺口
          value: Retention and concentration undisclosed
          detail: 公开材料没有量化客户数量、客户群组、流失率或头部账户集中度。
          touchpoints:
            - No public NRR or GRR
            - No public top-customer share
            - Named proof is thinner than revenue scale
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU010
      - CU011
      - CU013
      - CU015
  - id: FR001
    title: 风险热力图
