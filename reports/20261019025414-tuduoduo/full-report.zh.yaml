  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资结论与入场纪律
        blocks:
          - type: paragraph
            body: >-
              分配资料库中最清晰的估值信号是已披露的 B1 融资：Tuduoduo 计划在 RMB15.8 billion 投前估值下募集最多 RMB365 million，但引用的公开披露只报告 首笔 RMB70
              million 已完成。因此，存在真实价格参考，但还不是完全去风险的价格发现事件。按同一披露计算，该价格约为已报告 2024 年收入的 0.62 倍、 约为已报告 2024 年净利润的 14.8
              倍；对于盈利的工业平台，这并非明显不可能，但投资者权利细节、完整交割状态和经审计的 2025 年子公司报表仍缺失，
              资料过薄，不足以支持买入结论。因此建议是继续研究，而不是买入或放弃：投资者需要更好的入场价格，或明显更完整的披露，才能改变结论。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.2'
        title: 融资背景与估值支撑
        blocks:
          - type: paragraph
            body: >-
              已披露的融资条款与估值标题同样重要。Guolian 在本轮后仍是控股股东，公告还描述了一项现金回购义务：如果母公司未在四年内通过发行股份回购投资者股份， 该义务可能触发，公式内含年化 7.5%
              的回报。该结构保留了母公司的战略控制，却让外部投资者暴露于治理和下行条款风险，而首笔资金交割并未完全抵消这些风险。 不利背景也不容忽视：Eastmoney 承载的一则投资者权利帖子称，Guolian Shares
              已披露调查和此前重大期间会计更正。这不是 Tuduoduo 存在缺陷的直接证据， 但确实提高了新投资者应要求母公司控制资产具备的治理折价。
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: 情景区间与适合该模式的参考
        blocks:
          - type: paragraph
            body: >-
              本工作池可获得的外部参考足以搭建情景，但不足以形成硬性的可比公司集合。独立市场材料指向中国工业涂料市场到 2035 年保持低个位数增长；
              关于中国供应链金融的学术背景也支持围绕工业交易存在一个庞大且结构性增长的交易层。这个组合支持一种基准情景：Tuduoduo 可以靠生态密度、
              供应链服务和跨境扩张继续复合增长，但不支持仅因总市场存在就支付激进倍数。资料库中唯一由公司发布的上行信号是巴基斯坦数字经济扩张， 它可能扩大期权价值，但目前仍过早且主要是公司自述，不能当作估值证明。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: 最终尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              最重要的开放事项具体且直接影响价格。在按已披露估值进行投资判断前，投资者应核实 RMB365 million 全额融资是否实际完成，检查最终投资者权利安排以及任何清算或回购保护， 并核对 2025
              年子公司现金流、毛利率、客户活动以及债务或担保敞口。第二条尽调线是监管和执行：中国已通过危险化学品安全法，自 2026 年 5 月 1 日起生效， 该法规覆盖生产、储存、使用、经营、运输和应急响应。由于
              Tuduoduo 定位于涂料、化学品和工业供应链服务，如果无法展示合规运营流程或消化新增执行负担，
              就会形成真实的下行触发器。在这些问题得到回答前，只有更保守的入场价格或更干净的证明材料，才能让这一论点具备可投资性。
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 继续研究：资产看起来真实，但当前公开证明材料还不足以支持按已披露估值买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV013
          - type: callout
            title: 主要投资判断风险
            body: 少数股东回报取决于母公司控制、最终投资者权利，以及公开的 B1 融资标题能否转化为完整且对投资者友好的交割。
            calloutType: risk
            claimRefs:
              - CV002
              - CV006
              - CV013
          - type: callout
            title: 哪些证据会改变结论
            body: 全额交割确认、最终权利文件，以及经审计的 2025 年子公司现金流和利润率证据，将显著提升估值判断的信心。
            calloutType: assumption
            claimRefs:
              - CV001
              - CV004
              - CV014
