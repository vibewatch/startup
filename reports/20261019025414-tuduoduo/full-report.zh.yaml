        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 仍更像交易驱动的工业市场平台，而非软件企业。公司简介和应用商店页面描述了涂料及化学品原材料交易、云物流与仓储、供应链金融
              以及第三方卖家营销，而不是按席位收费的经常性软件定价。这对投资判断很重要：公开证据支持多层服务，但没有披露实际抽成率、各服务线毛利率，
