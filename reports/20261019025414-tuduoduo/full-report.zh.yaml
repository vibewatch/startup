            body: >-
              公开披露确实显示出规模：第三方报道引用 2024 年收入 RMB25.52 billion、净利润 RMB1.068 billion，以及 2025 年前九个月收入 RMB22.133 billion、净利润
              RMB871 million。但最清晰的谨慎信号来自母公司上市主体的管理层解释：交易量继续增长时，按总额还是净额确认会扭曲已报告收入。
              因此，收入行的趋势方向有参考价值，但单凭它不足以推断抽成率提升、需求走弱或销售效率。2025 年跨境交易额达到 RMB9.5 billion，但公司仍未单独披露 该业务的收入行或利润率贡献。
