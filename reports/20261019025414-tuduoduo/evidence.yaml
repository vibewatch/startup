evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table
    missingEvidence: A full board roster, committee structure, CFO disclosure, and a more complete management list.
    whyItMatters: >-
      Parent-heavy control can be workable, but investors still need to know whether governance checks extend beyond the
      named executives in company news.
    diligencePath: >-
      Request the latest shareholder register, board materials, and executive org chart from management or from the
      parent company's diligence room.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map
    missingEvidence: >-
      A definitive post-B1 cap table, signed investor documents, and confirmation of which proposed investors actually
      closed.
    whyItMatters: >-
      Ownership, governance rights, and downside economics cannot be assessed cleanly while the wider B1 close remains
      only partially evidenced.
    diligencePath: Obtain signed investment agreements, board approvals, and the most recent subsidiary capitalization table.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-count disclosure
    missingEvidence: A reconciled customer, active-enterprise, and paying-account denominator specific to Tuduoduo.
    whyItMatters: >-
      Customer scale is a core cover metric and a major lens on market power, monetization quality, and concentration
      risk.
    diligencePath: >-
      Request cohort definitions, active-buyer counts, and any internal board KPI deck that splits registered members
      from active paying customers.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: permits and hazardous-chemical compliance
    missingEvidence: >-
      Entity-level operating permits, SDS / hazardous-material handling documentation, and any regulator correspondence
      for the relevant subsidiaries.
    whyItMatters: >-
      Tighter 2026 safety rules raise the cost of being wrong about compliance posture for a platform exposed to
      chemicals-adjacent workflows.
    diligencePath: Request the subsidiary permit register, safety certifications, and any recent inspection or incident logs.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A public or diligence-only breakdown of Tuduoduo buyer counts, segment penetration, take rate, or category mix
