company:
  name: "Tuduoduo"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Tuduoduo remains publicly presented as a Guolian-controlled industrial B2B platform anchored in coatings and
    adjacent raw-material supply chains, with disclosed 2024 profitability and a December 2025 financing process that
    implied a roughly RMB15.8 billion pre-money valuation. The operating story is credible enough to establish
    identity, parent control, and recent scale markers, but the accessible record is still heavily company-shaped and
    leaves material gaps around customer count, full board disclosure, permits, and the final close status of the
    broader B1 round.
sections:
  - id: "identity-and-positioning"
    title: "Identity and positioning"
    body: >-
      The strongest company-controlled evidence still frames Tuduoduo as a Beijing-based core subsidiary inside the
      Guolian ecosystem rather than an independent generalist marketplace. The supplier profile describes it as the
      first vertical e-commerce platform integrating the paint and coating industry chain through cloud logistics and
      ERP systems, while Multiples separately places the business in B2B e-commerce and commissions. That is enough to
      anchor a one-line description for later chapters, but not enough to resolve all metadata cleanly: Multiples also
      describes the company as Hangzhou-based and launched in 2018, which conflicts with the Beijing/2014 identity on
      the supplier profile. The identity surface is therefore usable, but it is not fully clean.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO013"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Leadership evidence points to tight parent-company coupling. Tuduoduo's own corporate-news surface names Liu
      Zhai as both Guolian director and senior vice president and Tuduoduo CEO, while also exposing a named vice
      president bench covering public business, industry-and-finance technology, and investment and financing. The
      parent-level international activity recorded by UEIIBI reinforces that capital allocation and outward expansion
      still sit close to Guolian/IBI leadership, with founder and CEO Qian Xiaojun appearing as the principal sponsor
      of new overseas initiatives. That structure is workable for growth, but it also raises key-person and
      intercompany-governance diligence needs because the public record does not expose a full board, committee, or
      minority-protection picture.
    claimRefs: ["CO011", "CO012"]
    tableRefs: ["TO002"]
  - id: "funding-scale-and-control"
    title: "Funding, scale, and control"
    body: >-
      The clearest fresh scale evidence comes from the December 2025 financing disclosures and the smaller set of
      secondary market-data pages. Sina's recap of Guolian's announcement says Tuduoduo launched a B1 financing at a
      RMB15.8 billion pre-money valuation with up to RMB365 million of planned proceeds, and that the first RMB70
      million tranche was already signed. That same disclosure says Guolian would remain the controlling shareholder,
      moving only modestly from 75.9250% to 75.5902%, which matters because it shows outside capital arriving without
      parent deconsolidation. Financially, the announced numbers indicate meaningful operating scale: RMB25.52 billion
      of revenue and RMB1.068 billion of net profit in 2024, followed by RMB22.133 billion of revenue and RMB871
      million of net profit in the first nine months of 2025. What is still missing is a reconciled public bridge
      across USD funding databases, RMB subsidiary disclosures, and final close status for the rest of the B1 plan.
    claimRefs: ["CO004", "CO005", "CO006", "CO007", "CO008", "CO009", "CO010", "CO016"]
    tableRefs: ["TO003"]
  - id: "milestones-risks-and-open-gaps"
    title: "Milestones, risks, and open gaps"
    body: >-
      The milestone trail is good enough to show a company that moved from a coatings-focused industrial-commerce
      identity into cross-border and financing expansion, but the risk record remains only partially surfaced. The May
      2026 parent-level Pakistan headquarters launch and Pakistan RIC memorandum indicate that the broader Guolian/IBI
      group is trying to export its digital supply-chain model, while the B1 financing terms show Tuduoduo itself is
      still being used as a capital-formation vehicle. The same financing package also carries a downside clause: if
      Guolian does not repurchase investor shares via share issuance within four years, the structure can trigger a
      7.5% annualized cash repurchase obligation. Combined with a slowing coatings backdrop, tighter hazardous-chemical
      compliance rules, and thin public disclosure on customers and permits, the evidence supports a usable overview
      but not a clean all-clear.
    claimRefs: ["CO012", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
