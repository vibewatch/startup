callouts:
  - calloutType: "insight"
    title: "Parent control looks durable despite outside financing"
    body: "The December 2025 B1 structure brings in new investors and a fresh valuation marker without materially diluting Guolian's majority control, so governance and capital-allocation diligence should focus on parent-company rights rather than on a near-term standalone spinout."
    claimRefs: ["CO006", "CO007", "CO008"]
  - calloutType: "risk"
    title: "Disclosure quality still trails the operating narrative"
    body: "Assigned evidence supports identity, financing, and broad scale, but it still leaves unresolved the final B1 close amount, the public customer-count denominator, the full board roster, and entity-level chemicals compliance documentation."
    claimRefs: ["CO013", "CO014", "CO015", "CO016"]
