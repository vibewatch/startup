      - [Thesis, "Cross-border expansion could widen ecosystem value.", "IBI says its Pakistan digital-economy headquarters launched and signed an MoU with Pakistan's RIC.", "Independent evidence of transaction volume, take rates, and compliance economics would make this upside more bankable."]
      - [Anti-thesis, "Current price may already capitalize more certainty than public evidence supports.", "Only RMB70m of the planned round is publicly confirmed as closed, and direct comparable valuation references are missing from the assigned pool.", "A lower entry valuation or stronger third-party comparable evidence would reduce this concern."]
      - [Anti-thesis, "Parent-governance and downside-term risk could impair minority returns.", "Guolian keeps control, the round includes a 7.5% annualized repurchase formula, and adverse reporting flags parent disclosure/accounting issues.", "Definitive rights documents plus cleaner governance proof would reduce the discount investors should demand."]
    notes: "Arguments are limited to the assigned prefetched pool; missing public comparable transactions remain a material constraint on precision."
    claimRefs: [CV001, CV002, CV006, CV010, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation/return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Tuduoduo converts industrial-platform scale into continued profit growth, closes the full B1 round, and proves cross-border expansion economics.", "Current price can work if audited 2025 metrics, investor rights, and execution proof all validate that the 2025 pre-money marker was conservative.", "Would require independent proof beyond company-issued expansion claims.", "Failure to convert expansion into measured volume, margin, or cash generation."]
      - [Base, "Core marketplace remains profitable, but valuation support stays mostly internal and macro growth remains moderate.", "A fairer outcome is hold/watch rather than aggressive entry: the asset may be good while the public proof package is still thin.", "Best matches the current mix of a real round marker, moderate end-market growth, and unresolved governance/detail gaps.", "No further close disclosure, no audited 2025 proof, or additional governance noise."]
      - [Bear, "Governance discount widens, rights stack proves investor-unfriendly, or regulatory/execution burden erodes confidence.", "Downside comes less from market existence than from paying for certainty before it is evidenced.", "Adverse parent-governance context plus new chemicals-safety requirements keep this case credible.", "Further disclosure problems, weak cash conversion, or compliance slippage."]
    notes: "These scenarios are judgment ranges rather than DCF outputs because the assigned pool lacks direct comparable sets, audited 2025 subsidiary cash flow, and definitive round documents."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV014]
