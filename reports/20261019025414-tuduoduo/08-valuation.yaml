company:
  name: Tuduoduo
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports that Tuduoduo is a scaled, profitable subsidiary with a real financing marker, but not that outside investors should underwrite the disclosed price as a buy. The current signal set is still dominated by a partially closed B1 round, parent-governance overhang, and missing direct comparable and cap-table detail, so the supportable call remains research-more with a stretched valuation stance.
sections:
  - id: investment-call
    title: Investment call and entry discipline
    body: >-
      The clearest valuation signal in the assigned pool is the disclosed B1 financing: Tuduoduo targeted up to RMB365 million at a RMB15.8 billion pre-money valuation, but only the RMB70 million first tranche was reported as completed in the cited public disclosure. That means there is a real price reference, yet not a fully de-risked price-discovery event. Using the same disclosure, the price reads as roughly 0.62x reported 2024 revenue and about 14.8x reported 2024 net profit, which is not obviously impossible for a profitable industrial platform, but it is too thinly documented to justify a buy call when investor-rights detail, complete close status, and audited 2025 subsidiary statements are still absent. The recommendation is therefore research-more rather than buy or pass: investors would need either a better entry price or materially better disclosure to move the call.
    claimRefs: [CV001, CV004, CV005, CV012, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context
    title: Financing context and valuation support
    body: >-
      The disclosed financing terms matter as much as the headline valuation. Guolian remains the controlling shareholder after the round, and the announcement also describes a cash repurchase obligation that could be triggered if the parent does not repurchase investor shares within four years via a share issuance, with a 7.5% annualized return embedded in the formula. That structure preserves strategic control for the parent while leaving outside investors exposed to governance and downside-term risk that is not fully offset by the first-tranche close. The adverse backdrop is also not trivial: an Eastmoney-hosted investor-rights post says Guolian Shares had already disclosed investigation and major prior-period accounting corrections, which is not direct proof of a Tuduoduo defect but does increase the governance discount a new investor should require from a parent-controlled asset.
    claimRefs: [CV002, CV006, CV007, CV013]
    tableRefs: [TV002]
  - id: scenario-range
    title: Scenario range and model-appropriate references
    body: >-
      The external references available in this worker pool are enough to frame scenarios, but not enough to create a hard comparable-company comp set. Independent market material points to a China industrial coatings market growing at a low-single-digit pace through 2035, while academic context on Chinese supply-chain finance still supports a large and structurally growing transaction layer around industrial commerce. That mix supports a base case in which Tuduoduo can keep compounding through ecosystem density, supply-chain services, and cross-border expansion, but it does not support paying an aggressive multiple simply because the top-line market exists. The only company-issued upside signal in the pool is the Pakistan digital-economy expansion push, which may widen optionality but is still too early and self-described to treat as valuation proof.
    claimRefs: [CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
  - id: diligence-asks
    title: Final diligence asks and thesis-break triggers
    body: >-
      The most important open items are specific and price-sensitive. Before underwriting the disclosed valuation, an investor should verify whether the full RMB365 million round actually closed, inspect the definitive investor-rights stack and any liquidation or repurchase protections, and reconcile 2025 subsidiary cash flow, gross margin, customer activity, and debt or guarantee exposure. A second diligence lane is regulatory and executional: China adopted a hazardous chemicals safety law effective May 1, 2026, and the rule covers production, storage, use, business operations, transportation, and emergency response. Because Tuduoduo is positioned around coatings, chemicals, and industrial supply-chain services, a failure to show compliant operating processes or to absorb the added execution burden would be a real downside trigger. Until those asks are answered, the thesis is investable only at a more conservative entry price or after a cleaner proof package.
    claimRefs: [CV003, CV007, CV010, CV014]
