    title: Customer journey map
    type: journey-map
    summary: Public evidence points to a transaction-led industrial procurement journey that is expanding cross-border but still gated by compliance and verification gaps.
    data:
      nodes:
        - label: Category demand
          value: "General industrial largest; auto fastest-growing"
          detail: "Demand backdrop comes from China industrial coatings market evidence rather than Tuduoduo-specific share data."
          touchpoints:
            - General industrial coatings hold the largest end-use share in the cited market outlook.
            - Automotive and transportation is the fastest-growing cited end-use segment.
        - label: Discovery and ordering
          value: "Industrial e-commerce platform"
          detail: "Public company descriptions frame Tuduoduo as a B2B marketplace for industrial goods and raw materials."
          touchpoints:
            - Industrial goods and raw-material online transactions are the dominant revenue surface.
        - label: Fulfillment path
          value: "Pickup, direct ship, logistics, or title transfer"
          detail: "Reported delivery modes mix physical fulfillment and non-physical title-transfer transactions."
          touchpoints:
            - Customer pickup
            - Supplier direct shipment
            - Duoduo Logistics delivery
            - Title transfer without physical movement
        - label: Compliance checkpoint
          value: "Hazardous-chemicals controls"
          detail: "The 2026 law increases operational discipline around the sale, storage, use, transport, and registration of hazardous chemicals."
          touchpoints:
            - Hazardous-chemicals safety law effective 2026-05-01
            - Compliance can affect transaction speed and customer onboarding
        - label: Expansion services
          value: "Cross-border trade and digital supply-chain setup"
          detail: "Pakistan materials highlight logistics, digital-supply-chain buildout, and compliance support as add-on services."
          touchpoints:
            - Cross-border trade
            - Intelligent logistics
            - Digital supply-chain setup
            - Investment compliance support
        - label: Durability proof gap
          value: "Retention and concentration undisclosed"
          detail: "Public materials do not quantify customer counts, cohorts, churn, or top-account concentration."
          touchpoints:
            - No public NRR or GRR
            - No public top-customer share
            - Named proof is thinner than revenue scale
    claimRefs: [CU003, CU004, CU009, CU010, CU011, CU013, CU015]
callouts:
  - calloutType: strength
    title: Scale is visible even though user-level proof is thin
    body: |
      Public revenue disclosures and the parent company's transaction mix show that
      Tuduoduo is operating at real scale, not at the idea stage.
    claimRefs: [CU002, CU005, CU007]
  - calloutType: risk
    title: Public proof overstates certainty on durability
    body: |
      The current source set supports marketplace activity and ecosystem expansion, but it
      does not prove active-account counts, retention, or customer concentration.
    claimRefs: [CU012, CU013, CU016]
