  topStrengths:
    - Real transaction scale and profitability are visible in the public record.
    - The business has a clear vertical focus plus omnichannel and cross-border expansion breadth.
    - The December 2025 financing provides a live valuation reference and fresh capital marker.
  topRisks:
    - Parent-control and disclosure spillover still discount minority investor returns.
    - Customer-level proof, take-rate detail, and unit economics remain opaque.
    - Compliance burden around hazardous chemicals and cross-border operations can slow execution.
  unresolvedGaps:
    - The full B1 close status and definitive investor-rights stack are still not public.
