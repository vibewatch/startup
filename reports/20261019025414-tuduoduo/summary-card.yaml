      The public record still does not reconcile active buyers, segment penetration, or a Tuduoduo-specific customer
      denominator.
    - Entity-level hazardous-chemical permits, safety assessments, and siting records remain unresolved.
    - Direct API, uptime, certification, and implementation proof for the product stack are still missing.
