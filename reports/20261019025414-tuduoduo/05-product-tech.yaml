      - ["Reach buyers through mobile and assisted channels", "Separate online and field-sales motions", "B2B2C mall, mobile mall, app, experience stores, and franchise services", "Broader surface coverage than a web-only storefront", "No public evidence on channel mix or cohort quality"]
      - ["Run cross-border industrial trade", "Manual export coordination across warehousing and customs steps", "TDD-global bundles warehouses, shipping lines, customs/tax support, insurance, and financing services", "Overseas-warehouse footprint is claimed in more than 50 countries and regions", "No public SLA, integration, or loss-rate data"]
