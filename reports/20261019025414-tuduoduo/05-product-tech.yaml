      - ["TDD-global cross-border platform", "Cross-border industrial exporters and overseas channel partners", "Live public app listing with versioned mobile release", "Adds warehouses, customs, shipping, and trade services around the transaction", "No disclosed country-level GMV or customer deployment evidence"]
