  evidenceGaps:
    - type: missing-source
      severity: material
      topic: implementation-proof
      missingEvidence: Public API documentation, uptime history, security certifications, named integration references, and implementation tooling for Tuduoduo or TDD-global.
      whyItMatters: Without these artifacts, diligence can verify marketed module breadth but cannot underwrite technical reliability, control maturity, or deployment repeatability.
      diligencePath: Request architecture diagrams, integration documentation, SLA/status history, certification packages, and customer implementation case studies from management.
      relatedQuestionRefs: [QE008]
