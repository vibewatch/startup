    claimRefs: [CE002, CE005, CE006, CE007, CE008]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Commerce entry surfaces", "Capture demand across web/mobile/offline touchpoints", "Depends on product catalog quality and channel coordination", "Public evidence shows breadth of surfaces but not conversion or uptime"]
      - ["Cloud ERP and cloud logistics core", "Coordinate orders, inventory, and fulfillment", "Depends on internal systems and logistics execution partners", "Architecture is described at a high level only; no direct integration or API proof"]
      - ["Cross-border execution services", "Extend transactions into warehousing, customs, shipping, and insurance workflows", "Depends on overseas warehouses, shipping partners, and compliance support", "Public sources do not show service-level metrics or incident history"]
    notes: This is an operating-model table built from disclosed modules and services, not a line-by-line software architecture diagram.
    claimRefs: [CE004, CE005, CE007, CE008, CE009, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Tuduoduo's disclosed stack layers commerce entry points over ERP/logistics coordination and service-heavy execution.
    data:
      layers:
        - label: Buyer and seller entry surfaces
          detail: Public surfaces combine web, mobile, C2B, and offline-assisted channels.
          modules:
            - B2B2C mall
            - Mobile mall
            - C2B mall
            - APP
            - Brand experience stores
            - Service franchise stores
        - label: Vertical catalog and transaction layer
          detail: The core marketplace is positioned around coatings, ink, and related chemical products.
          modules:
            - Building coatings
            - Wood coatings
            - Industrial coatings
            - Powder coatings
          outputs:
            - Order initiation
            - Supplier matching
        - label: Operational backbone
          detail: Tuduoduo describes cloud ERP and cloud logistics as the base architecture.
          modules:
            - Cloud ERP
            - Cloud logistics
            - Collective procurement
            - Supply-chain finance
        - label: Cross-border execution
          detail: TDD-global extends the stack from transaction into physical and regulatory fulfillment.
          modules:
            - Overseas warehouses
            - Shipping lines
            - Customs clearance and tax rebates
            - Cross-border insurance
            - Cross-border production and financing
        - label: Regional and partner enablement
          detail: Expansion materials emphasize a parent-backed 6+N full-chain service model.
          modules:
            - Digital supply-chain buildout
            - Cloud AI enablement
            - Joint project facilitation
            - Investment compliance support
        - label: Public-proof gap
          detail: The reviewed public record does not expose direct API, uptime, certification, or incident artifacts.
          outputs:
            - Diligence requests required
            - Reliability remains unverified
    approximationNotes: This stack is synthesized from disclosed modules and services; it is not a company-published system diagram.
    claimRefs: [CE002, CE003, CE004, CE006, CE007, CE008, CE009, CE014]
