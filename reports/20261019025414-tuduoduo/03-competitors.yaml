  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-peer-pricing
      missingEvidence: Public official pricing, compliance, and trust material for named vertical peers or incumbent digital distributors serving the same categories.
      whyItMatters: Without named-peer public disclosure, the chapter can compare competitor classes well but cannot underwrite a precise share-of-wallet battle against a fully enumerated peer set.
      diligencePath: Collect direct official product, pricing, security, and compliance pages for named substitute platforms and incumbent distributor channels in coatings and chemicals.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-behavior
      missingEvidence: Account-level retention, multi-homing, or take-rate data showing when buyers use Tuduoduo alongside 1688, direct factories, or offline distributors.
      whyItMatters: Competitive durability depends on whether the service stack actually raises switching cost or simply coexists with price-led multi-homing.
      diligencePath: Request cohort retention, repeat-order, and category-level account activity segmented by procurement workflow and channel overlap.
      relatedQuestionRefs: [QP006]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-enumeration
      missingEvidence: A refreshed list of named domestic and export-facing platforms serving the same industrial categories with publicly attributable trust and pricing disclosures.
      whyItMatters: The current chapter covers the main substitute classes, but a fuller named enumeration would sharpen competitive ranking and reveal whether Tuduoduo faces more horizontal or vertical digital peers.
      diligencePath: Expand the next search pass around named coatings, chemical, and industrial-raw-material procurement platforms and retain only pages with direct product or pricing evidence.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP001]
