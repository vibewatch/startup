schemaVersion: report-v2
artifact: financials
slug: tuduoduo
runDate: 2026-10-19
company:
  name: Tuduoduo
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports Tuduoduo as a large transaction-led industrial marketplace
    with disclosed profitability and a fresh B1 financing plan, not a clearly
    disclosed SaaS-like recurring-revenue model. The supportable verdict is that
    revenue quality and capital adequacy remain only partially underwritable because
    reported revenue comparability, realized take rates, gross margin, cash runway,
    and full B1 close detail are still not public.
sections:
  - id: revenue-model
    title: Revenue model and monetization surfaces
    body: >-
      Tuduoduo still looks much more like a transaction-led industrial marketplace
      than a software business. Its own company-profile and app-store surfaces
      describe raw-material transactions in coatings and chemicals, cloud logistics
      and warehousing, supply-chain finance, and third-party seller marketing rather
      than recurring seat-based software pricing. That matters for underwriting
      because the public evidence supports multiple service layers but does not
      disclose realized take rate, gross margin by service line, or how much of
      the economics comes from financing and logistics rather than marketplace
      spread. The public channel mix — B2B2C, mobile, C2B, offline stores,
      franchise services, and third-party seller tooling — suggests a broad
      acquisition and fulfillment footprint, but not the unit economics of each
      motion.
    claimRefs: [CI001, CI002, CI003, CI004, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: disclosed-scale
    title: Public scale exists, but revenue quality is not fully visible
    body: >-
      Public disclosures do show scale: third-party reporting cites RMB25.52 billion
      of 2024 revenue and RMB1.068 billion of 2024 net profit, with RMB22.133 billion
      of revenue and RMB871 million of net profit in the first nine months of 2025.
      But the cleanest caution signal is management's own explanation at the listed
      parent level that reported revenue is distorted by gross-versus-net recognition
      while transaction volume kept growing. That makes the line-item revenue trend
      directionally useful but not enough by itself to infer take-rate expansion,
      demand weakness, or sales efficiency. Cross-border transaction value reached
      RMB9.5 billion in 2025, yet the company still does not publish a separate
      revenue line or margin contribution for that business.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI013, CI014]
  - id: capital-needs
    title: Capital adequacy remains the main underwriting blocker
    body: >-
      The disclosed B1 financing is strategically relevant because it targets working
      capital, industrial e-commerce scale, digital supply-chain and cloud-factory
      buildout, and cross-border expansion rather than a narrow balance-sheet clean-up.
      Even so, only the RMB70 million first tranche is specifically disclosed in public
      reporting against a plan of up to RMB365 million at a RMB15.8 billion pre-money
      valuation, and the structure can create a 7.5% annualized repurchase obligation
      if Guolian does not take investors out within four years. Independent sector
      evidence also points to pressure on the underlying demand and pricing environment:
      China chemical product prices have fallen sharply and profits in chemical
      manufacturing weakened in 2025, while the coatings end market looks like a
      moderate-growth industry rather than an explosive one. Company Overview should
      carry the full round chronology; the Financials judgment here is narrower:
      public evidence is still insufficient to underwrite cash runway, working-capital
      absorption, realized pricing, or gross-margin durability.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Marketplace raw-material transactions
        - Transaction-led procurement and sales of coatings and chemical inputs
        - Order / transaction value
        - Public sources support scale, but not realized take rate or revenue share by stream
        - Company model is explicit; monetization split is not
        - Request GMV-to-revenue bridge, take rate by category, and customer concentration
      - - Cloud logistics and warehousing
        - Fulfillment and supply-chain execution layered onto marketplace activity
        - Service fee / logistics spread
        - Publicly described as part of the operating model; no standalone revenue disclosed
        - Company-claimed service layer
        - Request logistics revenue, gross margin, and outsourced vs owned cost split
      - - Supply-chain finance / flexible payment
        - Financing and payment support attached to procurement flow
        - Financing yield / fee income
        - Publicly described, but no disclosed balances, yields, defaults, or funding costs
        - Economically relevant but opaque
        - Request receivables book, loss history, funding sources, and covenant terms
      - - Third-party seller and marketing services
        - Online sales platform and marketing services for third-party merchants
        - Service fee / marketing spend
        - Publicly described; list pricing and realized pricing are not disclosed
        - Company-claimed ancillary monetization
        - Request seller count, attach rates, and realized service pricing
    notes: >-
      Public evidence identifies the revenue mechanisms but does not disclose stream mix,
      take rates, or stream-level margins; blank economics are diligence gaps, not zeroes.
    claimRefs: [CI002, CI003, CI004, CI011, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Surface
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Marketplace product procurement
        - No public tariff or contract template disclosed
        - Realized pricing unavailable
        - Commodity mix, rebates, and buyer concentration are unknown
        - Suppliergo company profile
      - - Third-party seller platform and marketing services
        - No public fee card disclosed
        - Realized pricing unavailable
        - Merchant subsidies, marketing credits, and attach rates are unknown
        - Tencent MyApp listing
      - - Supply-chain finance / flexible payment
        - No public rate card disclosed
        - Realized pricing unavailable
        - Funding cost, default risk, and loss reserves are not public
        - Suppliergo company profile; Tencent MyApp listing
      - - Cross-border and digital supply-chain services
        - No public contract economics disclosed
        - Realized pricing unavailable
        - Revenue recognition, margin, and capital intensity are not separately disclosed
        - Sina Finance report; IBI event release
    notes: >-
      Official surfaces describe services and channels, not public rate cards. This table
      distinguishes visible monetization surfaces from unavailable realized pricing.
    claimRefs: [CI002, CI003, CI004, CI011, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2024 net income / revenue proxy
        - ≈4.2% net margin proxy from RMB1.068bn net profit on RMB25.52bn revenue
        - Medium
        - Profitability exists, but this is after all costs and is not a gross-margin disclosure
        - Request audited gross margin, contribution margin, and service-line P&L
      - - 2025 first-nine-month net income / revenue proxy
        - ≈3.9% net margin proxy from RMB871m net profit on RMB22.133bn revenue
        - Medium
        - Suggests profits remain positive, but not whether unit economics improved or deteriorated
        - Request monthly cohort margin bridge and working-capital absorption
      - - Revenue recognition quality proxy
        - 2026 Q1 parent revenue -10.89% YoY while management said transaction volume grew
        - Medium
        - Reported revenue is not a clean demand or take-rate signal when gross/net treatment shifts
        - Request transaction volume, GMV, take rate, and accounting-policy bridge
      - - Cross-border scale proxy
        - RMB9.5bn 2025 cross-border transaction value, +4.4% YoY; revenue contribution undisclosed
        - Medium
        - Shows activity in a new growth vector without proving monetization quality
        - Request cross-border revenue, gross margin, and cash-conversion cycle
      - - Cash on hand / runway
        - null
        - Low
        - Capital adequacy cannot be underwritten without cash, debt, and burn visibility
        - Request subsidiary cash balance, operating cash flow, debt schedule, and runway model
      - - Realized take rate / gross margin / CAC payback
        - null
        - Low
        - These are the key underwriting inputs for a marketplace-plus-services model
        - Request take rate by category, gross margin by service line, CAC, payback, and retention
    notes: >-
      Margin percentages are derived arithmetic from disclosed revenue and net-profit figures and
      are only profitability proxies; they are not gross margin, contribution margin, burn, or
      cash runway. Null values indicate that the public record does not disclose the metric.
    claimRefs: [CI005, CI006, CI007, CI008, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a transaction-led revenue stack with logistics, finance,
      and seller-service layers, while independent sources point to pricing pressure
      rather than clear SaaS-like incremental margins.
    data:
      nodes:
        - id: demand
          label: Buyer demand
          value: Coatings and industrial chemical procurement
          detail: Public surfaces emphasize raw-material and end-product transactions.
        - id: platform
          label: Tuduoduo marketplace layer
          value: B2B2C, mobile, C2B, and offline service channels
          detail: Public channel mix is broad, but realized pricing is not disclosed.
        - id: suppliers
          label: Supplier inventory and merchant participation
          value: Commodity and industrial product categories
          detail: Public sources show seller-service and merchant-enablement intent.
        - id: logistics
          label: Logistics and warehousing layer
          value: Fulfillment and supply-chain execution
          detail: Company-issued sources position logistics as a core monetization support layer.
        - id: finance
          label: Payment and finance layer
          value: Flexible payment and supply-chain finance
          detail: Economics are strategically important but publicly opaque.
        - id: revenue
          label: Revenue capture
          value: Transaction spread, service fees, and marketing monetization
          detail: Public disclosures support the mechanisms, not the take rate or stream mix.
        - id: pressure
          label: Gross-profit pressure
          value: Sector price deflation and multihoming risk
          detail: Independent sources suggest pricing pressure can cap fee power and margin expansion.
      edges:
        - from: demand
          to: platform
        - from: platform
          to: suppliers
        - from: suppliers
          to: logistics
        - from: logistics
          to: finance
        - from: finance
          to: revenue
        - from: revenue
          to: pressure
    approximationNotes: >-
      This bridge reflects publicly described revenue mechanisms and risk layers only.
      No public source provides a quantitative GMV-to-revenue-to-gross-profit waterfall.
    claimRefs: [CI002, CI003, CI004, CI011, CI015, CI016]
callouts:
  - calloutType: insight
    title: Scale is visible; revenue quality is not
    body: >-
      Tuduoduo's public disclosures support scale and profitability at a point in time,
      but they still do not reveal realized take rates, stream mix, or service-line gross
      margins. That keeps the reported top line from behaving like a clean underwriting input.
    claimRefs: [CI005, CI006, CI007, CI008, CI013]
  - calloutType: risk
    title: The financing headline does not clear the runway question
    body: >-
      The B1 announcement adds external capital and names concrete use cases, yet only the
      RMB70 million first tranche is explicitly disclosed and the structure can leave a 7.5%
      annualized repurchase overhang. Without cash, burn, debt, and working-capital disclosure,
      public evidence still cannot prove capital adequacy.
    claimRefs: [CI009, CI010, CI011, CI012]
