  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Tuduoduo-level take rate, gross margin, service-line contribution margin, CAC, payback, and retention data.
      whyItMatters: These metrics determine whether the marketplace-plus-services model compounds with attractive unit economics or simply moves large volumes at thin economics.
      diligencePath: Request audited service-line P&L, cohort retention by buyer and seller segment, and CAC/payback analysis by channel.
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI002, TI003]
    - type: missing-source
      severity: blocking
      topic: liquidity-runway
      missingEvidence: Tuduoduo-level cash balance, operating cash flow, debt or guarantee schedule, covenant headroom, and monthly burn or cash-conversion data.
      whyItMatters: Capital adequacy cannot be underwritten from valuation headlines or point-in-time balance-sheet figures alone.
      diligencePath: Request the latest subsidiary financial statements, debt agreements, bank lines, guarantee schedule, and a monthly liquidity bridge.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: revenue-recognition
      missingEvidence: A Tuduoduo-specific bridge from transaction volume or GMV to recognized revenue under gross-versus-net treatment.
      whyItMatters: Without the accounting bridge, public revenue trends can be misread as demand, take-rate, or sales-efficiency changes.
      diligencePath: Request management's revenue-recognition memo, GMV bridge, and historical restatement walk-through at the subsidiary level.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI001, TI003]
