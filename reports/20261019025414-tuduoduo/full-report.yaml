      - number: '4.2'
        title: Public scale exists, but revenue quality is not fully visible
        blocks:
          - type: paragraph
            body: >-
              Public disclosures do show scale: third-party reporting cites RMB25.52 billion of 2024 revenue and
              RMB1.068 billion of 2024 net profit, with RMB22.133 billion of revenue and RMB871 million of net profit in
              the first nine months of 2025. But the cleanest caution signal is management's own explanation at the
              listed parent level that reported revenue is distorted by gross-versus-net recognition while transaction
