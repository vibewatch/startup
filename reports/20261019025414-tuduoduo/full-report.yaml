        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo still looks much more like a transaction-led industrial marketplace than a software business. Its
              own company-profile and app-store surfaces describe raw-material transactions in coatings and chemicals,
              cloud logistics and warehousing, supply-chain finance, and third-party seller marketing rather than
