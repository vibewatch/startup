              within four years. Independent sector evidence also points to pressure on the underlying demand and
              pricing environment: China chemical product prices have fallen sharply and profits in chemical
              manufacturing weakened in 2025, while the coatings end market looks like a moderate-growth industry rather
              than an explosive one. Company Overview should carry the full round chronology; the Financials judgment
