      - number: '3.2'
        title: Workflow depth offsets lower visible price transparency
        blocks:
          - type: paragraph
            body: >-
              The strongest public comparison in the assigned pool is between Tuduoduo's managed-service stack and
              1688's broad but buyer-managed marketplace model. Tuduoduo describes self-operated, third-party,
              cross-border, and SaaS workflows layered with cloud logistics, warehousing, and supply-chain services. By
              contrast, the 1688 guide emphasizes near-factory pricing, flexible MOQs, and massive supplier breadth, but
              also the need for translation, local payment methods, buyer-run verification, third-party inspections, and
              separate freight coordination. Tuduoduo's own export storefront shows another nuance: some SKU prices and
              MOQs are public, while many industrial resin and polymer listings remain negotiable. That implies Tuduoduo
              is not trying to win solely through a universally transparent list-price experience; it is blending
              catalog visibility with negotiated supply-chain service. The capability matrix and pricing table therefore
              support a positioning map where 1688 leads on visible price signal, while Tuduoduo leads on managed
              workflow depth.
            claimRefs:
