        - >-
          Best matches the current mix of a real round marker, moderate end-market growth, and unresolved
          governance/detail gaps.
        - No further close disclosure, no audited 2025 proof, or additional governance noise.
      - - Bear
        - >-
          Governance discount widens, rights stack proves investor-unfriendly, or regulatory/execution burden erodes
          confidence.
        - Downside comes less from market existence than from paying for certainty before it is evidenced.
        - Adverse parent-governance context plus new chemicals-safety requirements keep this case credible.
        - Further disclosure problems, weak cash conversion, or compliance slippage.
    notes: >-
      These scenarios are judgment ranges rather than DCF outputs because the assigned pool lacks direct comparable
      sets, audited 2025 subsidiary cash flow, and definitive round documents.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
