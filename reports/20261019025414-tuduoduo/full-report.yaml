      - number: '4.3'
        title: Capital adequacy remains the main underwriting blocker
        blocks:
          - type: paragraph
            body: >-
              The disclosed B1 financing is strategically relevant because it targets working capital, industrial
              e-commerce scale, digital supply-chain and cloud-factory buildout, and cross-border expansion rather than
              a narrow balance-sheet clean-up. Even so, only the RMB70 million first tranche is specifically disclosed
              in public reporting against a plan of up to RMB365 million at a RMB15.8 billion pre-money valuation, and
