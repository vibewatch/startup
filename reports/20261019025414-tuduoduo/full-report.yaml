      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map in the assigned evidence points to industrial manufacturers, distributors, and cross-border
              trading operators rather than end consumers. MRF's segment detail says the largest or fastest-moving
              demand sits in general industrial and automotive/transportation coatings, while Tuduoduo's financing memo
              and the Pakistan expansion release emphasize digital supply chains, intelligent logistics, and
              trade-enablement services. That combination implies a practical adoption path: commercial or procurement
              teams sponsor the platform to improve sourcing and working-capital turns, plant or quality teams become
              daily users where coating performance matters, and compliance or logistics teams become critical secondary
              users when hazardous-product documentation or cross-border movement is involved. In other words, the
              market is not only about listing products online; it is about displacing manual coordination across
              procurement, compliance, and fulfillment workflows that already control budget inside industrial
              operators.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM010
              - CM012
