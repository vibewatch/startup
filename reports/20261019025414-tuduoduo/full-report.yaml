  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The current public pool supports a narrower market boundary than a generic 'industrial internet' story.
              Tuduoduo's December 2025 financing disclosure frames the business around industrial e-commerce transaction
              growth, digital supply-chain buildout, digital cloud factories, and cross-border industrial-belt services
              rather than a consumer marketplace or a pure software seat model. Independently, the cleanest current
              category-sizing lens in the pool is the China industrial coatings market, because that is the only
              third-party source that quantifies a directly adjacent spend bucket with current value, growth, and
              segment detail. That evidence is useful for bounding the opportunity, but it is not a company-specific
              TAM/SAM/SOM bridge: the same pool does not disclose Tuduoduo's take rate, active buyer count, or
              penetration inside coatings versus other industrial categories. The result is a supportable top-down lens
              with an explicit bottom-up gap, not a completed market-sizing stack.
