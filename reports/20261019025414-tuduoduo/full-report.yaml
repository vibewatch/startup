      - number: '1.4'
        title: Milestones, risks, and open gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone trail is good enough to show a company that moved from a coatings-focused
              industrial-commerce identity into cross-border and financing expansion, but the risk record remains only
              partially surfaced. The May 2026 parent-level Pakistan headquarters launch and Pakistan RIC memorandum
              indicate that the broader Guolian/IBI group is trying to export its digital supply-chain model, while the
              B1 financing terms show Tuduoduo itself is still being used as a capital-formation vehicle. The same
              financing package also carries a downside clause: if Guolian does not repurchase investor shares via share
              issuance within four years, the structure can trigger a 7.5% annualized cash repurchase obligation.
              Combined with a slowing coatings backdrop, tighter hazardous-chemical compliance rules, and thin public
              disclosure on customers and permits, the evidence supports a usable overview but not a clean all-clear.
