      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence points to tight parent-company coupling. Tuduoduo's own corporate-news surface names
              Liu Zhai as both Guolian director and senior vice president and Tuduoduo CEO, while also exposing a named
              vice president bench covering public business, industry-and-finance technology, and investment and
              financing. The parent-level international activity recorded by UEIIBI reinforces that capital allocation
              and outward expansion still sit close to Guolian/IBI leadership, with founder and CEO Qian Xiaojun
              appearing as the principal sponsor of new overseas initiatives. That structure is workable for growth, but
              it also raises key-person and intercompany-governance diligence needs because the public record does not
              expose a full board, committee, or minority-protection picture.
            claimRefs:
              - CO011
              - CO012
