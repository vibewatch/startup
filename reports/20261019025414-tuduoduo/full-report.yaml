            tableRef: TO002
            claimRefs:
              - CO011
              - CO012
      - number: '1.3'
        title: Funding, scale, and control
        blocks:
          - type: paragraph
            body: >-
              The clearest fresh scale evidence comes from the December 2025 financing disclosures and the smaller set
              of secondary market-data pages. Sina's recap of Guolian's announcement says Tuduoduo launched a B1
              financing at a RMB15.8 billion pre-money valuation with up to RMB365 million of planned proceeds, and that
              the first RMB70 million tranche was already signed. That same disclosure says Guolian would remain the
              controlling shareholder, moving only modestly from 75.9250% to 75.5902%, which matters because it shows
              outside capital arriving without parent deconsolidation. Financially, the announced numbers indicate
              meaningful operating scale: RMB25.52 billion of revenue and RMB1.068 billion of net profit in 2024,
              followed by RMB22.133 billion of revenue and RMB871 million of net profit in the first nine months of
              2025. What is still missing is a reconciled public bridge across USD funding databases, RMB subsidiary
              disclosures, and final close status for the rest of the B1 plan.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
