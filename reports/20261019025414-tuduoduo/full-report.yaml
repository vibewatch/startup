  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal scoring places 1688 and direct sourcing as the clearest low-price substitutes, while
      Tuduoduo sits furthest toward managed workflow depth.
    data:
      xAxis:
        label: Managed workflow depth
        min: 1
        max: 5
        lowLabel: Buyer-managed
        highLabel: Integrated service stack
      yAxis:
        label: Visible price advantage / transparency
        min: 1
        max: 5
        lowLabel: Opaque
        highLabel: Clear low-price signal
      points:
        - label: Tuduoduo
          x: 5
          'y': 3
          detail: >-
            Company material emphasizes cloud logistics, warehousing, SaaS, payment, and cross-border services;
            storefront pricing is only partly standardized.
        - label: 1688 marketplace
          x: 2
          'y': 5
          detail: >-
            Guide stresses near-factory pricing, broad supplier choice, and flexible MOQs, but leaves verification and
            logistics to the buyer.
        - label: Direct factory sourcing
          x: 1
          'y': 4
          detail: >-
            Potential low factory pricing remains available, but the buyer owns supplier selection, QA, freight,
            customs, and compliance.
        - label: Sourcing agent model
          x: 3
          'y': 4
          detail: >-
            An agent reduces language and verification friction, yet pricing adds fees and still depends on underlying
            marketplace or factory supply.
        - label: Offline distributor / trader
          x: 3
          'y': 2
          detail: >-
            Status-quo channels can provide local service, but assigned sources do not show public digital tooling or
            transparent posted pricing.
        - label: Producer direct sales
          x: 3
          'y': 2
          detail: >-
            Incumbent producers can bundle product and support, but they do not replace a multi-supplier procurement
            workflow on their own.
    approximationNotes: >-
      Scores are ordinal and evidence-backed, not market-share or NPS measurements; axes reflect workflow depth and
      visible price signal described in the assigned sources.
    claimRefs:
      - CP011
      - CP012
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a transaction-led revenue stack with logistics, finance, and seller-service layers, while
      independent sources point to pricing pressure rather than clear SaaS-like incremental margins.
    data:
      nodes:
        - id: demand
          label: Buyer demand
          value: Coatings and industrial chemical procurement
          detail: Public surfaces emphasize raw-material and end-product transactions.
        - id: platform
          label: Tuduoduo marketplace layer
          value: B2B2C, mobile, C2B, and offline service channels
          detail: Public channel mix is broad, but realized pricing is not disclosed.
        - id: suppliers
          label: Supplier inventory and merchant participation
          value: Commodity and industrial product categories
          detail: Public sources show seller-service and merchant-enablement intent.
        - id: logistics
          label: Logistics and warehousing layer
          value: Fulfillment and supply-chain execution
          detail: Company-issued sources position logistics as a core monetization support layer.
        - id: finance
          label: Payment and finance layer
          value: Flexible payment and supply-chain finance
          detail: Economics are strategically important but publicly opaque.
        - id: revenue
          label: Revenue capture
          value: Transaction spread, service fees, and marketing monetization
          detail: Public disclosures support the mechanisms, not the take rate or stream mix.
        - id: pressure
          label: Gross-profit pressure
          value: Sector price deflation and multihoming risk
          detail: Independent sources suggest pricing pressure can cap fee power and margin expansion.
      edges:
        - from: demand
          to: platform
        - from: platform
          to: suppliers
        - from: suppliers
          to: logistics
        - from: logistics
          to: finance
        - from: finance
          to: revenue
        - from: revenue
          to: pressure
    approximationNotes: >-
      This bridge reflects publicly described revenue mechanisms and risk layers only. No public source provides a
      quantitative GMV-to-revenue-to-gross-profit waterfall.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI011
      - CI015
      - CI016
