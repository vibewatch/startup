      - number: '3.3'
        title: Commoditization risk rises if buyers can multi-home into oversupplied channels
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in the assigned pool does not accuse Tuduoduo of a company-specific failure; instead,
              it points to a tough market structure. Coatings World says China remains the largest regional coatings
              market, but decorative demand has been down significantly since 2021 and manufacturing was flat to down in
              the review period. ICIS separately expects China to push further into net-export territory in PP and other
              chemicals and polymers, implying heavier price competition in downstream channels. An MDPI
              platform-economy study adds the mechanism: where users multi-home and platforms compete on visibility or
              front-end economics, competition can intensify while collective profits erode. Applied carefully as an
              external benchmark—not as direct proof about Tuduoduo's financials—this suggests the moat is only durable
              if Tuduoduo keeps buyers attached to higher-friction workflow services such as warehousing, ERP/payment
              tooling, financing, and cross-border coordination. If buyers can easily split demand across marketplaces
              and direct sourcing channels, platform differentiation compresses toward price and execution quality.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Where Tuduoduo is most differentiated
            body: >-
              Tuduoduo looks strongest when the buyer values integrated procurement workflow—logistics, warehousing,
              SaaS/payment tooling, and cross-border coordination—more than the lowest visible SKU price.
            calloutType: strength
            claimRefs:
              - CP012
              - CP013
          - type: callout
            title: Where displacement risk is highest
            body: >-
              The weakest position is any transaction that can easily be multi-homed across 1688, direct factories, and
              other channels without meaningful workflow loss, because oversupply and buyer comparison then pull
              competition toward price.
            calloutType: risk
            claimRefs:
