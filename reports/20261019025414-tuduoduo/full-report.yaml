  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is class-based rather than peer-list based
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo's public positioning is that of a Guolian-controlled industrial internet platform rooted in
              coatings and chemicals but expanded into adjacent industrial chains and service layers. In the assigned
              source pool, the clearest substitute is not another named vertical peer with equally rich public
              disclosure; it is the bundle of alternatives buyers already have: 1688 for broad domestic wholesale
              access, direct factory procurement, incumbent producer direct-sales channels, offline distributors and
              traders, and outsourced sourcing-agent models. That matters because the buyer's comparison set is wider
              than "another coatings marketplace." Tuduoduo therefore has to win on orchestration—category breadth,
              transaction tooling, logistics, and financing support—not on the existence of a unique catalog alone. The
              profile table makes that asymmetry explicit: named peer transparency is thin, while substitute-class
              transparency is materially better.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
