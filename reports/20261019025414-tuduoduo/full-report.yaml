  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Public segment picture is broad, but mostly inferred from category and workflow evidence
        blocks:
          - type: paragraph
            body: |
              Tuduoduo's clearest public customer signal is not a named account roster; it is the
              operating description of a B2B industrial-commerce business that sells transaction,
              information, and digital services into coatings, chemicals, glass, fertilizer, and
              grain-oil workflows. China Economic Net's summary of the parent company's regulatory
              response still describes the business as an industrial e-commerce platform whose
              online goods-trading activity generated 99.65% of revenue in 2024, while market data
              on Chinese industrial coatings suggests the most natural downstream demand pools are
              general industrial users first and automotive and transportation buyers next. That
              gives a plausible buyer-user-payer map, but it does not by itself reveal
              active-account counts, spend concentration, or the share attributable specifically to
              coatings buyers.
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU011
              - CU015
      - number: '6.2'
        title: Adoption proof is strongest in transaction scale and operating workflow, not in fresh named deployments
        blocks:
          - type: paragraph
            body: |
              The best support for real adoption is operational rather than testimonial. Public
              reporting says Tuduoduo produced RMB25.52 billion of 2024 revenue and RMB22.13
              billion in the first three quarters of 2025, while the parent company's own
              regulatory-response summary says online goods trading still dominates revenue. Just as
              important, the reported delivery model distinguishes customer pickup, supplier direct
              shipment, and Duoduo Logistics delivery from title-transfer transactions without
              physical movement, which means topline scale cannot be read as a clean proxy for
              deployed, recurring usage. Publicly named ecosystem activity in 2026, including the
              Pakistan summit, a signed MOU with RIC, and the launch of an IBI Pakistan
              digital-economy headquarters, points to commercial pipeline building and
              service-surface expansion rather than a verified list of production customers.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
              - CU013
              - CU015
      - number: '6.3'
        title: Durability and retention remain materially under-disclosed
        blocks:
          - type: paragraph
            body: |
              The retained source set does not disclose customer-count, NRR, GRR, churn,
              contract-length, cohort, or top-customer concentration metrics for Tuduoduo, and the
              freshest named public evidence still skews toward counterparties, events, and
              strategic expansion signals rather than outcome-rich production case studies. That
              leaves a material gap between "scaled marketplace activity exists" and "customer
              relationships are durable and compounding." The official toodudu.com fetch is also
              unhelpful for customer diligence: instead of a Tuduoduo customer or merchant index,
              the retrieved text starts with an unrelated sponge-titanium company profile, which
              weakens confidence that the official surface is currently usable for verifying 2026
              customer proof.
            claimRefs:
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Expansion has visible momentum, but compliance and accounting revisions complicate the read-through
        blocks:
          - type: paragraph
            body: |
              Tuduoduo does have visible expansion vectors. The B1 financing announcement says new
              capital is meant to increase industrial e-commerce scale, strengthen local-service
              buildout, and push cross-border business, while the Pakistan materials show how the
              company wants to wrap cross-border trade, logistics, digital supply-chain buildout,
              and investment-compliance services around that motion. At the same time, the
              customer-quality story is not frictionless. Regulatory-driven revenue restatements
              and new multidimensional customer-supplier evaluation rules make historical adoption
              metrics harder to compare over time, while China's new hazardous-chemicals law raises
              the likelihood that coatings and chemicals procurement will require tighter
              operational and compliance checks across sale, storage, transport, and registration
              flows.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
              - CU010
              - CU015
              - CU017
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible even though user-level proof is thin
            body: |
              Public revenue disclosures and the parent company's transaction mix show that
              Tuduoduo is operating at real scale, not at the idea stage.
            calloutType: strength
            claimRefs:
              - CU002
              - CU005
              - CU007
          - type: callout
            title: Public proof overstates certainty on durability
            body: |
              The current source set supports marketplace activity and ecosystem expansion, but it
              does not prove active-account counts, retention, or customer concentration.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Governance and regulatory posture is the highest-severity risk cluster
        blocks:
          - type: paragraph
            body: >-
              The most concrete adverse evidence in the assigned pool is not product failure but controls failure at the
              listed parent. Sina's reproduction of the Shanghai Stock Exchange disciplinary decision says Guolian
              Shares materially corrected 2024 revenue and cost disclosures, replied late to the exchange after repeated
              extensions, and used RMB4.9 million of raised funds for spending not tightly tied to the approved AI
              project. Because Tuduoduo sits inside the same control environment, that history raises a real diligence
              question about subsidiary reporting, capital allocation discipline, and whether management escalation
              works when regulators press for clarification. Separately, China's Hazardous Chemicals Safety Law now
              governs production, storage, use, transportation, and emergency response from May 2026 onward. If Tuduoduo
              or its logistics affiliates handle in-scope chemicals or threshold volumes, permit, safety-use,
              assessment, and industrial-park obligations become thesis-relevant quickly. The public evidence here does
              not confirm entity-level permits, safety assessment reports, or park siting, so legal-compliance residual
              risk stays high until management produces those records.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.2'
        title: The operating model widens contagion and execution surfaces
        blocks:
          - type: paragraph
            body: >-
              The second risk cluster comes from how broad the model is. The PLOS ONE article in the pool is not
              company-specific, but it is directly relevant to any supply-chain-finance exposure: it says credit risk
              contagion exists across supply-chain enterprises and changes dynamically with business and financial
              linkages. That matters because Tuduoduo is positioned around coatings, chemicals, industrial trade, and
              supply-chain services rather than a narrow single-function SaaS workflow. Company-issued Pakistan
              expansion evidence also shows the group promising cross-border trade, intelligent logistics, digital
              supply-chain construction, cloud AI enablement, joint-venture facilitation, and investment-compliance
              support through a "6+N" service system. Each added surface can be strategically valuable, but it also
              increases the number of external partners, regulators, and execution dependencies that must work together
              before returns are durable. Absent independent proof of unit economics or operational KPIs in the new
              geography, partner and execution risk remain materially elevated.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
      - number: '7.3'
        title: Moderate end-market growth does not offset unresolved downside questions
        blocks:
          - type: paragraph
            body: >-
              The market backdrop is large enough to matter but not strong enough to forgive execution mistakes. Market
              Research Future still projects the China industrial coatings market to grow through 2035, but Coatings
              World says the China real-estate downturn is still hurting paint and coatings demand and that
              manufacturing in China is flat to down. That combination argues against an automatic rebound thesis: the
              company may be operating in a structurally important category while still facing muted near-term demand
              and buyer caution. The biggest unresolved financial question in the assigned pool is whether the planned
              B1 financing closed beyond the first disclosed tranche; the prior refresh-recovery article now resolves to
              an access-error page, and no reserve replacement was assigned. Until management provides entity-level
              compliance documents, financing completion evidence, and concentration data for cross-border
              counterparties, a prudent investor should treat regulatory interruption, credit losses, and partner
              failure as live thesis-break triggers rather than tail scenarios.
            claimRefs:
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR011
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Hard diligence gates before underwriting
            body: >-
              The shortest path to de-risking is documentary, not narrative: obtain hazardous-chemical permits and
              safety assessments, show parent-control remediation, and verify the actual scope of financing and partner
              concentration before treating the current setup as scalable.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR011
              - CR014
          - type: callout
            title: What would move the risk rating down
            body: >-
              A cleaner view would require independent proof that Pakistan operations are converting into repeatable
              KPIs, that hazardous-chemical compliance is complete at the entity level, and that market softness is
              being offset by take-rate or retention resilience rather than one-off expansion narratives.
            calloutType: insight
            claimRefs:
              - CR007
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The clearest valuation signal in the assigned pool is the disclosed B1 financing: Tuduoduo targeted up to
              RMB365 million at a RMB15.8 billion pre-money valuation, but only the RMB70 million first tranche was
              reported as completed in the cited public disclosure. That means there is a real price reference, yet not
              a fully de-risked price-discovery event. Using the same disclosure, the price reads as roughly 0.62x
              reported 2024 revenue and about 14.8x reported 2024 net profit, which is not obviously impossible for a
              profitable industrial platform, but it is too thinly documented to justify a buy call when investor-rights
              detail, complete close status, and audited 2025 subsidiary statements are still absent. The recommendation
              is therefore research-more rather than buy or pass: investors would need either a better entry price or
              materially better disclosure to move the call.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.2'
        title: Financing context and valuation support
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing terms matter as much as the headline valuation. Guolian remains the controlling
              shareholder after the round, and the announcement also describes a cash repurchase obligation that could
              be triggered if the parent does not repurchase investor shares within four years via a share issuance,
              with a 7.5% annualized return embedded in the formula. That structure preserves strategic control for the
              parent while leaving outside investors exposed to governance and downside-term risk that is not fully
              offset by the first-tranche close. The adverse backdrop is also not trivial: an Eastmoney-hosted
              investor-rights post says Guolian Shares had already disclosed investigation and major prior-period
              accounting corrections, which is not direct proof of a Tuduoduo defect but does increase the governance
              discount a new investor should require from a parent-controlled asset.
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario range and model-appropriate references
        blocks:
          - type: paragraph
            body: >-
              The external references available in this worker pool are enough to frame scenarios, but not enough to
              create a hard comparable-company comp set. Independent market material points to a China industrial
              coatings market growing at a low-single-digit pace through 2035, while academic context on Chinese
              supply-chain finance still supports a large and structurally growing transaction layer around industrial
              commerce. That mix supports a base case in which Tuduoduo can keep compounding through ecosystem density,
              supply-chain services, and cross-border expansion, but it does not support paying an aggressive multiple
              simply because the top-line market exists. The only company-issued upside signal in the pool is the
              Pakistan digital-economy expansion push, which may widen optionality but is still too early and
              self-described to treat as valuation proof.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most important open items are specific and price-sensitive. Before underwriting the disclosed
              valuation, an investor should verify whether the full RMB365 million round actually closed, inspect the
              definitive investor-rights stack and any liquidation or repurchase protections, and reconcile 2025
              subsidiary cash flow, gross margin, customer activity, and debt or guarantee exposure. A second diligence
              lane is regulatory and executional: China adopted a hazardous chemicals safety law effective May 1, 2026,
              and the rule covers production, storage, use, business operations, transportation, and emergency response.
              Because Tuduoduo is positioned around coatings, chemicals, and industrial supply-chain services, a failure
              to show compliant operating processes or to absorb the added execution burden would be a real downside
              trigger. Until those asks are answered, the thesis is investable only at a more conservative entry price
              or after a cleaner proof package.
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research-more: the asset looks real, but the current public proof package is not yet strong enough to
              support a buy at the disclosed valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV013
          - type: callout
            title: Main underwriting risk
            body: >-
              Minority-return outcomes depend on parent control, definitive investor rights, and whether the public B1
              headline converts into a fully closed and investor-friendly round.
            calloutType: risk
            claimRefs:
              - CV002
              - CV006
              - CV013
          - type: callout
            title: What would move the call
            body: >-
              A full-close confirmation, definitive rights documents, and audited 2025 subsidiary cash-flow and margin
              evidence would materially improve valuation confidence.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV004
              - CV014
