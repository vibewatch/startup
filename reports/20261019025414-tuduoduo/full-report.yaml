              - CM015
      - number: '2.3'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The demand side is credible but mixed. MRF points to urbanization, automotive growth, and tighter
              environmental rules as ongoing coatings tailwinds, while Tuduoduo's own capital plan and Pakistan
              ecosystem push show management is still allocating toward industrial-commerce expansion rather than
              retrenchment. At the same time, adoption clearly depends on compliance execution, not just gross demand.
              China's hazardous-chemicals safety law now governs production through transportation and emergency
              response, and Intertek's SDS guidance shows hazardous-product trade often requires classification,
              translation, supplier data collection, and jurisdiction-specific documentation. Even the downstream export
              opportunity is permissioned: China moved to export licensing for pure electric passenger vehicles from
              January 2026, which reinforces that adjacent manufacturing trade can expand while adding administrative
              steps for sellers and intermediaries. The main diligence gap is that no current public source in the
              assigned pool ties these drivers and frictions to a disclosed Tuduoduo-specific SAM, conversion funnel, or
              budget-owner economics.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
              - CM016
