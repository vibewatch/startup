      - number: '5.2'
        title: Operating architecture, cross-border expansion, and integration dependencies
        blocks:
          - type: paragraph
            body: |-
              The strongest specific architecture evidence is functional rather than deeply technical.
              Tuduoduo's own financing coverage describes a digital platform built on cloud ERP and cloud
              logistics, while the Apple listing for TDD-global expands that operating model into overseas
              warehouses, shipping lines, customs and tax workflows, insurance, and production/financing
              support. In other words, the disclosed "architecture" is a commerce-and-operations stack:
              user acquisition and ordering on the front end, ERP/logistics coordination in the middle,
              and cross-border execution services around the transaction.

              The Pakistan expansion announcement pushes the same pattern one step further. Rather than
              highlighting a self-serve developer platform, it frames Tuduoduo's regional growth around a
              parent-backed "6+N" service system with intelligent logistics, digital supply-chain
              construction, cloud AI enablement, and investment-compliance support. That supports the view
              that deployment maturity today depends on ecosystem operations, warehousing, and parent-led
              business-development infrastructure as much as on software code. It also implies integration
              and rollout risk: investors can see the service layers being advertised, but not the APIs,
              implementation tooling, or service-level evidence that would prove repeatable low-friction
              deployment across customers and geographies.
