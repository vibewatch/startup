  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation turns on real scale and a real round signal, but the price is still held back by governance,
      disclosure, and compliance uncertainty.
    data:
      nodes:
        - id: scale
          label: Reported scale and profitability
          note: 2024 subsidiary revenue RMB25.52b and net profit RMB1.068b.
        - id: anchor
          label: Real but narrow price anchor
          note: B1 financing targets RMB15.8b pre-money, yet only RMB70m first tranche is publicly confirmed.
        - id: market
          label: Macro support is positive, not explosive
          note: Industrial coatings outlook is low-single-digit growth; Chinese SCF remains large and structurally growing.
        - id: governance
          label: Governance discount remains necessary
          note: Guolian retains control and the round discloses a 7.5% annualized repurchase formula.
        - id: regulation
          label: Compliance burden rises
          note: Hazardous chemicals law now spans production through emergency response.
        - id: decision
          label: Recommendation research-more / valuation stretched
          note: >-
            Need full close proof, investor-rights detail, and cleaner audited 2025 evidence before underwriting current
            price.
      edges:
        - from: scale
          to: anchor
          label: establishes
        - from: anchor
          to: market
          label: still needs
        - from: market
          to: governance
          label: offset by
        - from: governance
          to: regulation
          label: compounded by
        - from: regulation
          to: decision
          label: results in
    approximationNotes: This is a logic chain, not a quantitative model.
