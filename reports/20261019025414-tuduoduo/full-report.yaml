    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              The strongest company-controlled evidence still frames Tuduoduo as a Beijing-based core subsidiary inside
              the Guolian ecosystem rather than an independent generalist marketplace. The supplier profile describes it
              as the first vertical e-commerce platform integrating the paint and coating industry chain through cloud
              logistics and ERP systems, while Multiples separately places the business in B2B e-commerce and
              commissions. That is enough to anchor a one-line description for later chapters, but not enough to resolve
              all metadata cleanly: Multiples also describes the company as Hangzhou-based and launched in 2018, which
              conflicts with the Beijing/2014 identity on the supplier profile. The identity surface is therefore
              usable, but it is not fully clean.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
