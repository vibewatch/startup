companyProfile:
  summary: >-
    Tuduoduo is a Guolian-controlled industrial B2B platform centered on coatings and adjacent raw-material supply
    chains. Public evidence supports a 2014 Beijing-origin platform with cloud logistics and ERP roots, disclosed
    profitability, and a December 2025 B1 financing that implies a roughly RMB15.8 billion pre-money valuation, but the
    public record still leaves material gaps on customer counts, board detail, and permits.
