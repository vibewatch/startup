callouts:
  - calloutType: risk
    title: Hard diligence gates before underwriting
    body: >-
      The shortest path to de-risking is documentary, not narrative: obtain hazardous-chemical
      permits and safety assessments, show parent-control remediation, and verify the actual scope
      of financing and partner concentration before treating the current setup as scalable.
    claimRefs:
      - CR003
      - CR007
      - CR011
      - CR014
  - calloutType: insight
    title: What would move the risk rating down
    body: >-
      A cleaner view would require independent proof that Pakistan operations are converting into
      repeatable KPIs, that hazardous-chemical compliance is complete at the entity level, and that
      market softness is being offset by take-rate or retention resilience rather than one-off
      expansion narratives.
    claimRefs:
      - CR007
      - CR010
      - CR013
