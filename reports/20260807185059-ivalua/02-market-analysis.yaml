  - type: missing-source
    severity: material
    topic: ivalua-specific-sam-som
    missingEvidence: A source-backed serviceable market estimate for Ivalua specifically, including its realistic mix of direct, indirect, public-sector, and regulated buyers.
    whyItMatters: A broad procurement-software TAM does not tell an investor how much of the category Ivalua can actually win at attractive unit economics.
    diligencePath: Build a bottom-up SAM from segment counts, ACV ranges, and installed-base penetration using management pipeline data.
    relatedQuestionRefs:
