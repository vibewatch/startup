- id: growth-drivers-and-constraints
  title: Growth drivers and constraints
  body: 'The demand case for procurement software is strong. Mordor attributes growth to autonomous workflows, cloud-native architectures, generative-AI copilots, and payment innovations. 6Wresearch similarly cites automation, cloud deployment, cost visibility, and analytics. GEP’s 2026 ProcureCon report places those software drivers in a broader operating context where procurement leaders face sustained volatility, cost pressure, and acceleration demands. At the same time, the adoption constraints are neither trivial nor temporary. The Supply Chain Xchange article says procurement leaders want AI but that their current IT systems are not ready, with integration into existing systems emerging as a leading transformation challenge. Ivalua’s own survey-based releases reinforce this friction: 86% of UK businesses face barriers developing digital procurement skills, technology limitations are hindering teams from achieving business objectives, and reducing supply-chain disruption has moved up
    the priority stack after recurring black-swan events. In short, the category tailwinds are real, but the main blocker is not lack of need. It is implementation capacity: skills, data quality, legacy architecture, and the ability to modernize procurement without disrupting operations.'
