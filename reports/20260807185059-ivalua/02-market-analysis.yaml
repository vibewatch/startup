- id: evidence-gaps-and-contradictions
  title: Evidence gaps and contradictions
  body: 'The biggest unresolved issue is not whether procurement software matters; it is how much of the published category is truly addressable for Ivalua in an investable way. None of the retained public sources gives a clean Ivalua-specific SAM or SOM, and the differences across analyst TAM estimates make it easy to overstate precision. Public market reports are good enough to say the category is large and growing, but they are not good enough to allocate that opportunity by vertical, ERP environment, budget owner, or win-rate likelihood. The market evidence also mixes strong signal with some noisy inputs: retained analyst reports from Mordor, Fortune, GMI, and 6Wresearch are useful, while lower-quality aggregators often add more repetition than decision value. Finally, buyer adoption mechanics remain under-disclosed. The public source set makes clear that ERP integration and operating fit are critical, but it does not provide the ACV, buyer-title, or conversion-path data needed to turn
    that observation into a rigorous bottoms-up market model. Those omissions do not weaken the category thesis, but they do cap confidence in any valuation model that leans too heavily on generic TAM.'
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM036
  - CM037
  - CM038
