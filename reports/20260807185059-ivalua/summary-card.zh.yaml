  topStrengths:
    - 产品覆盖从寻源到付款的完整流程，让 Ivalua 有机会成为记录系统，而不只是点状工具。
    - 公开客户证据覆盖大型企业和公共部门买家，支撑其在复杂采购环境中的部署可信度。
    - KKR、Ardian、Tiger Global 与 Hg 的机构支持，说明专业资本提供方已多次验证这项资产。
    - 据报道 2023 到 2024 年 ARR 增长若方向正确，说明业务仍在扩张，而不只是收割成熟存量客户。
  topRisks:
    - 当前估值、经审计收入、利润率、留存、杠杆率和赞助方持有期条款披露明显不足。
    - 采购平台部署可能复杂且依赖合作伙伴，会推高实施、采用和价值兑现周期风险。
    - Coupa、SAP Ariba、Jaggaer、GEP、Zycus 以及相邻 ERP 套件的竞争，可能挤压定价和差异化。
    - 平台嵌入核心采购运营后，安全、隐私和供应商数据处理仍是关键的信任依赖。
  unresolvedGaps:
    - 2024 年 12 月 Hg 交易的准确估值、结构和治理条款。
    - 经审计的 2024-2026 年收入、毛利率、烧钱速度、自由现金流和净留存细节。
    - 客户集中度、流失率和模块级扩张经济性。
    - 债务、杠杆率，以及赞助方持有对资产负债表的影响。
    - 当前所有权下的完整董事会构成、控制权和退出时点激励。
