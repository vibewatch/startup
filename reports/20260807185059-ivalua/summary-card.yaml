  topStrengths:
    - >-
      Broad product coverage across source-to-pay workflows gives Ivalua system-of-record potential rather than
      point-solution positioning.
    - >-
      Public customer proof spans large enterprises and public-sector buyers, supporting deployment credibility in
      complex procurement environments.
    - >-
      Institutional support from KKR, Ardian, Tiger Global, and Hg indicates repeated validation from sophisticated
      capital providers.
    - >-
      Reported ARR growth from 2023 to 2024, if directionally correct, suggests the business is still scaling rather
      than merely harvesting a mature installed base.
  topRisks:
    - >-
      Current valuation, audited revenue, margin, retention, leverage, and sponsor-era terms remain materially
      under-disclosed.
    - >-
      Procurement-platform deployments can be complex and partner-dependent, increasing implementation, adoption, and
      time-to-value risk.
    - >-
      Competition from Coupa, SAP Ariba, Jaggaer, GEP, Zycus, and adjacent ERP suites can pressure pricing and
      differentiation.
    - >-
      Security, privacy, and supplier-data handling remain important trust dependencies for a platform embedded in core
      procurement operations.
  unresolvedGaps:
    - Exact December 2024 Hg transaction valuation, structure, and governance terms.
    - Audited 2024-2026 revenue, gross margin, burn, free-cash-flow, and net-retention detail.
    - Customer concentration, churn, and module-level expansion economics.
    - Debt, leverage, and balance-sheet impact of sponsor ownership.
    - Full board composition, control rights, and exit-timing incentives under current ownership.
