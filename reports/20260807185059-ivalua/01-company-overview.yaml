- id: scale-customers-and-milestones
  title: Scale, customers, and milestones
  body: Scale is directionally strong even where exact numbers remain imperfect. Hg’s portfolio page says Ivalua serves more than 400 enterprise customers globally, and the customer-story hub explicitly markets “hundreds of the world’s most admired brands” across enterprise and public-sector contexts. The Commonwealth of Virginia reference is especially useful because it proves the company is not confined to commercial accounts; it can also support large public procurement transformation work. Product and company milestones likewise show a long-running expansion arc rather than a static installed base. The company used 2017 to combine a major KKR round with the Directworks acquisition, 2019 to deepen third-party risk capabilities and cross the unicorn threshold, 2023 to push generative-AI features, and 2026 to launch IVA Studio while still posting new alliances and customer wins in the newsroom. Third-party database sources attempt to quantify revenue, ARR, headcount, and stage, and they
    are directionally consistent about late-stage scale, but they do not agree cleanly enough to treat every value as audited fact. For the rest of the report, the safe base case is that Ivalua is a scaled private procurement-software asset with real customer breadth, ongoing product investment, and persistent but manageable disclosure gaps.
  claimRefs:
  - CO019
