company:
  name: Ivalua
chapter:
  number: 1
  title: Company Overview
  summary: Ivalua is a Redwood City-headquartered procurement software company founded in 2000 with continuing French roots, a unified source-to-pay platform, and sponsor-backed history spanning KKR, Ardian, Tiger Global, and Hg. Public evidence clearly supports the 2017 KKR round, the 2019 unicorn milestone, 400-plus enterprise customers, and continuing product/news flow through 2026, but exact current valuation, headcount, margins, and full governance detail remain private.
sections:
- id: identity-and-platform
  title: Identity and platform scope
  body: 'Ivalua presents itself as a unified procurement platform rather than a narrow point solution. The official about, why-Ivalua, and procurement-platform pages consistently frame the product around one connected source-to-pay environment that manages spend, suppliers, analytics, automation, and AI workflows on a single stack. That matters because the company is not selling just e-procurement or invoice automation; it is selling a broader operating layer for procurement teams that want one system of record across supplier and spend processes. Public company-profile pages reinforce that same identity from a third-party angle, describing Ivalua as a cloud-based provider of spend, procurement, and supplier-management software founded in 2000. Location is more nuanced than a one-line U.S.-only label: the offices page clearly anchors the Americas headquarters in Redwood City, while French legal records and funding announcements preserve the company’s French origin story and corporate footprint.
    The right working description for later chapters is therefore a late-stage private, cross-Atlantic procurement-software platform with a unified architecture and global delivery presence.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO034
  tableRefs:
  - TO001
