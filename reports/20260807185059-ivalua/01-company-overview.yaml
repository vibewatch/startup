  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: A direct public press release or deal term sheet for the December 2024 Hg investment with exact valuation, primary versus secondary split, and governance terms.
    whyItMatters: The latest sponsor transaction is the cleanest external value marker for underwriting current entry price and control economics.
    diligencePath: Request the 2024 financing announcement, board materials, and cap-table summary from management or the lead sponsor.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-verified current headcount figure reconciled across legal entities and regions.
    whyItMatters: Headcount is a key scale and cost proxy, but open databases disagree and can distort later margin or productivity analysis.
    diligencePath: Ask for current FTE count by region and by function from HR or finance, plus a year-end 2025 comparison.
    relatedQuestionRefs:
    - QO019
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A full current board roster, committee structure, and investor-rights summary.
    whyItMatters: Sponsor-backed software companies can have governance constraints or control terms that matter as much as the headline valuation.
    diligencePath: Request the latest board deck, bylaws summary, and shareholder-rights matrix.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
