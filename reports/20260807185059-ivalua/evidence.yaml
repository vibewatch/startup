evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: >-
      A direct public press release or deal term sheet for the December 2024 Hg investment with exact valuation, primary
      versus secondary split, and governance terms.
    whyItMatters: >-
      The latest sponsor transaction is the cleanest external value marker for underwriting current entry price and
      control economics.
    diligencePath: >-
      Request the 2024 financing announcement, board materials, and cap-table summary from management or the lead
      sponsor.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-verified current headcount figure reconciled across legal entities and regions.
    whyItMatters: >-
      Headcount is a key scale and cost proxy, but open databases disagree and can distort later margin or productivity
      analysis.
    diligencePath: Ask for current FTE count by region and by function from HR or finance, plus a year-end 2025 comparison.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A full current board roster, committee structure, and investor-rights summary.
    whyItMatters: >-
      Sponsor-backed software companies can have governance constraints or control terms that matter as much as the
      headline valuation.
    diligencePath: Request the latest board deck, bylaws summary, and shareholder-rights matrix.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: ivalua-specific-sam-som
    missingEvidence: >-
      A source-backed serviceable market estimate for Ivalua specifically, including its realistic mix of direct,
      indirect, public-sector, and regulated buyers.
    whyItMatters: >-
      A broad procurement-software TAM does not tell an investor how much of the category Ivalua can actually win at
      attractive unit economics.
    diligencePath: >-
      Build a bottom-up SAM from segment counts, ACV ranges, and installed-base penetration using management pipeline
      data.
    relatedQuestionRefs:
      - QM011
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: analyst-tam-divergence
    missingEvidence: >-
      Methodology notes that reconcile why leading analysts publish different 2026 TAM values for ostensibly the same
      procurement-software category.
    whyItMatters: >-
      Without methodology reconciliation, TAM precision is overstated and valuation models can anchor to whichever
      report best suits the narrative.
    diligencePath: >-
      Obtain the underlying scope definitions and segmentation notes from the analyst reports or from management's
      preferred market-sizing workpaper.
    relatedQuestionRefs:
      - QM009
      - QM012
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: A public breakdown of buyer ACV, budget ownership, and conversion path by vertical for Ivalua specifically.
    whyItMatters: >-
      The adoption path matters as much as the TAM because integration-heavy enterprise software can fail despite large
      nominal markets.
    diligencePath: Request CRM cohort data showing buyer titles, ERP environment, vertical, and deal cycle by segment.
    relatedQuestionRefs:
      - QM018
      - QM019
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: Actual ACV bands, discounting behavior, and module-level pricing for Ivalua versus direct competitors.
    whyItMatters: >-
      Competitive positioning changes materially if Ivalua wins on value for money, not just feature fit, yet public
      quote data is sparse and noisy.
    diligencePath: Request win-loss pricing sheets and quote histories by segment from sales operations.
    relatedQuestionRefs:
      - QP015
      - QP016
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rates-by-segment
    missingEvidence: Independent win-loss data showing where Ivalua beats or loses to Coupa, SAP Ariba, Oracle, JAGGAER, GEP, or Zycus.
    whyItMatters: >-
      Feature narratives are useful, but moat underwriting ultimately depends on where buyers actually choose Ivalua in
      live evaluations.
    diligencePath: Review CRM-stage data, competitive battlecards, and reference calls segmented by vertical and ERP starting point.
    relatedQuestionRefs:
      - QP011
      - QP018
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: trust-and-regulatory-benchmarks
    missingEvidence: >-
