coverageNotes: This report was produced on 2026-08-07 using publicly available sources only. Public evidence is reasonably strong on Ivalua's product breadth, customer proof, 2017 and 2019 financing history, and continuing sponsor ownership into 2024-2026. Public evidence is materially weaker on current audited revenue, gross margin, retention, customer concentration, cash generation, leverage, and the exact economics of the December 2024 Hg-led transaction, so valuation conclusions remain evidence-bounded rather than fully underwritten.
