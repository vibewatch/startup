company:
  name: Ivalua
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports a real enterprise-software asset with enough scale, customers, and product breadth to justify continued investor interest, but not enough clean economic disclosure to justify paying any price. The most defensible stance is price-sensitive and range-bound: Ivalua likely deserves to trade above generic software medians, but below best-case procurement precedents unless private diligence proves stronger revenue quality, retention, and sponsor-era economics.'
sections:
- id: thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: 'The positive thesis is straightforward. Ivalua appears to be a scaled procurement-software platform with broad source-to-pay workflow coverage, meaningful enterprise and public-sector customer proof, continued AI/product investment, and repeated institutional-capital validation. Those attributes are exactly what investors want in a private enterprise-software asset. The anti-thesis is equally clear: almost every number that would determine valuation confidence rather than valuation curiosity remains private or proxy-based. ARR, revenue, retention, margin, concentration, and sponsor-era terms are all either estimated or undisclosed. The right valuation posture therefore starts with recognizing that Ivalua is very likely valuable, but still not very cleanly priceable from public data alone.'
  claimRefs:
  - CV011
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV036
  - CV037
  - CV041
  - CV042
  tableRefs:
  - TV002
  figureRefs:
  - FV004
- id: financing-context-and-entry-discipline
  title: Financing context and entry discipline
  body: The financing history gives one solid anchor and one frustratingly fuzzy one. The solid anchor is 2019, when Ardian and PR Newswire corroborated that Ivalua exceeded a $1 billion valuation in a $60 million round. The fuzzy anchor is 2024, when Hg and Agila entered the story but without public transaction economics. That means investors know Ivalua stayed financeable into the sponsor era, but do not know whether the latest terms imply a step-up, flat, or structured outcome. In that setting, entry discipline matters more than narrative enthusiasm. A disciplined buyer should not pay a full premium multiple simply because the company remained sponsor-attractive. It should pay up only when price and private diligence both support it.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV026
  - CV038
  - CV039
  - CV042
  tableRefs:
  - TV001
- id: scenario-range-and-valuation-logic
  title: Bull, base, and bear valuation logic
  body: 'The cleanest public way to value Ivalua is by triangulating between three imperfect frames: proxy ARR, public software multiples, and procurement-software transaction precedent. The public-software median in July 2026 is too low for a scaled enterprise-procurement platform with customer proof and product breadth, while Coupa''s take-private multiple is too generous to apply wholesale to a smaller and less transparent asset. That leaves a middle band. A defensible base case is roughly 5x to 7x credible ARR, which yields about $765 million to $1.07 billion on the $153 million ARR proxy. A bear case of 3x to 5x ARR captures the downside if the growth proxies flatter reality or if sponsor terms, retention, or margin quality disappoint. A bull case of 7x to 9x ARR reaches roughly $1.07 billion to $1.38 billion, but really needs private confirmation that the quality-of-revenue picture is stronger than the public record shows.'
