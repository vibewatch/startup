- id: recommendation-and-final-asks
  title: Recommendation and final diligence asks
  body: 'The defensible recommendation is conditional interest with strong price discipline. If an investor can access Ivalua near or below about 6x credible ARR, the company looks interesting enough to merit serious work because the product, customer, and sponsor signals are real. If the ask drifts above roughly 8x credible ARR without audited proof on retention, margin, and 2024 deal terms, the margin of safety looks too thin. In other words, this is not a “pass forever” name; it is a “prove the economics or improve the price” name. The most valuable next steps are straightforward: get the real cap table, verify revenue quality, and test whether customer durability is as strong as the logo set suggests. Public-sector reference depth is helpful, but it still cannot replace private retention and margin proof.'
  claimRefs:
  - CV038
  - CV039
  - CV040
