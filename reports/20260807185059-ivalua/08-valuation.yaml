- id: comparable-set-and-limitations
  title: Comparable set and limitations
  body: 'The comparable set is useful, but messy. Coupa is the most relevant strategic reference because it is a business-spend/procurement asset, yet it was taken private at vastly greater scale. Public ERP and large-enterprise software companies such as SAP and Oracle provide current market context, but they bundle many businesses beyond procurement. Public-software category multiples from Multiples.vc are helpful for framing the market regime, though they are still category averages rather than procurement-pure comps. This mixed set produces a consistent message: Ivalua should not trade like a distressed generic SaaS asset, but neither should it be marked immediately to the richest precedent without private evidence of best-in-class economics.'
