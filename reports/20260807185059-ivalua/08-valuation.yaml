- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Coupa take-private
    - ~8.4x NTM revenue; ~$8B EV
    - Most relevant procurement-suite transaction precedent
    - Same category, private-equity buyer, procurement workflow asset
    - Much larger scale and better-known revenue base
  - - Typical PE SaaS platform entry
    - ~4x-6x revenue
    - Useful lower-to-middle private-market discipline band
    - Reflects sponsor math for profitable, stable SaaS
    - Not procurement-specific and may understate premium assets
  - - ERP software public category
    - ~3.3x NTM EV/revenue
    - Current market regime for large enterprise-software buckets
    - Anchors public-market caution in 2026
    - Category average, not procurement-pure
  - - Public software median
    - ~2.2x NTM revenue
    - Broad market floor for generic software
    - Useful downside regime check
    - Too low for strong enterprise workflow assets
  - - SAP
    - ~5.4x market-cap/revenue proxy
    - Large enterprise-software value anchor
    - Shows mature enterprise software can command mid-single-digit multiples
    - Not procurement-pure and market cap is not EV
  - - Oracle
    - ~6.2x market-cap/revenue proxy
    - Second mature enterprise-software value anchor
    - Helpful for upper mid-single-digit context
    - Not procurement-pure and market cap is not EV
  - - Ivalua last clean public anchor
    - '>$1B valuation in 2019'
    - Historical floor for franchise value
    - Confirms asset crossed unicorn line before current sponsor era
    - Stale and pre-2024 economics
  notes: The comparable set is intentionally mixed because no perfect public Ivalua peer exists.
