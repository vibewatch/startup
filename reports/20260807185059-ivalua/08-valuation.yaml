  - CV025
  - CV030
  - CV037
  - CV039
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - 2024 transaction terms
    - Actual valuation, leverage, preferences, governance rights
    - Entry price is meaningless without knowing the current stack
    - Cap table + legal docs + sponsor discussions
  - - Revenue quality
    - Audited ARR, GAAP revenue, services mix, gross margin
    - Separates real software value from inflated top-line proxies
    - Finance diligence / KPI pack
  - - Retention
    - NRR, churn, renewals, cohort durability
    - Determines whether customer proof converts to value durability
    - Customer-success / revenue-ops diligence
  - - Implementation quality
    - Deployment timeline distribution, partner scorecards, failed rollouts
    - Tests whether breadth scales efficiently
    - Services + partner-ops diligence
  - - Security and trust
    - Customer SLAs, incident history, control exceptions
    - Directly affects valuation discount and reference durability
    - Security review + trust-portal artifacts
  - - Competition reality
    - Win/loss data against Coupa, SAP, GEP, and partner-led alternatives
    - Determines whether premium multiple is justified
    - Sales-ops and pipeline analytics
  notes: These asks are the fastest route from interesting public story to investable private file.
