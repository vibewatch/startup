- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR proxy broadly right; retention and margin quality are strong; sponsor terms clean
    - 7x-9x ARR => ~$1.07B-$1.38B
    - Need private data to validate quality and structure
    - Possible, but not yet earned publicly
  - - Base
    - ARR proxy directionally right; quality good but not elite; valuation market remains selective
    - 5x-7x ARR => ~$765M-$1.07B
    - Opacity persists but does not hide a major weakness
    - Most defensible from current public evidence
  - - Bear
    - ARR proxy overstated or sponsor/model disclosures disappoint; growth quality weakens
    - 3x-5x ARR => ~$459M-$765M
    - Retention, margin, or structure disappoints
    - Real downside if public proxies flatter reality
  notes: These scenarios are valuation frameworks, not audited forecasts.
