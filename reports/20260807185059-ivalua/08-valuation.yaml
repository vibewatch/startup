- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Retention or margin proof disappoints
    - Private diligence shows materially weaker quality than public proxies imply
    - Base case compresses toward bear case
    - Reprice or walk
  - - 2024 sponsor terms are more investor-unfriendly than expected
    - Preference, leverage, or governance overhang is heavy
    - Public valuation anchor becomes less investable
    - Demand discount or pass
  - - Security / trust event
    - Material incident or adverse control finding
    - Valuation discount widens; customer proof weakens
    - Pause and re-underwrite
  - - Partner-led delivery underperforms
    - Reference calls or data show repeated implementation failures
    - Platform breadth turns from moat to liability
    - Cut premium assumption
  - - Competitive loss against top suites
    - Flagship buyers defect to Coupa/SAP/GEP alternatives
    - Category premium shrinks
    - Reduce multiple band
  notes: These triggers matter because they would change the multiple investors are willing to pay, not just the story they tell.
  claimRefs:
