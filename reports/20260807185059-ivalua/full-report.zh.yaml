  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              第一个分析任务，是把市场边界画准。Ivalua 自己的从寻源到付款页面把品类定义为一个统一平台，横跨需求受理、从寻源到合同、供应商管理和采购到付款。MarkWide Research
              描述的集成套件非常相近，从请购、供应商发现一直延伸到发票和支付。这一口径比完整采购软件市场更窄；分析机构通常会把合同管理、支出分析、采购自动化，有时甚至更广工作流工具也纳入采购软件市场。区别很重要：一家公司可以在从寻源到付款套件层领先，却不拥有每一条采购相邻预算线。替代集合也同样关键。Tonkean
              的 2026 年编排指南称，市场拥挤是因为许多企业仍运行碎片化采购环境；这意味着 Ivalua 不只和其他套件竞争，还要和 ERP
              原生采购模块、单点工具，以及跨多个系统缝合的现状手工流程竞争。因此，市场定义需要两层嵌套视角：宽口径采购软件 TAM，以及更窄、最贴近 Ivalua 产品的从寻源到付款 / 采购到付款核心层。
