chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位与平台范围
        blocks:
          - type: paragraph
            body: >-
              Ivalua 把自己定位为统一采购平台，而不是狭窄单点工具。官网 about、why-Ivalua 和 procurement-platform
              页面都把产品讲成一套连接的从寻源到付款环境：在同一技术栈上管理支出、供应商、分析、自动化和 AI
              工作流。关键在于，公司卖的不是单纯电子采购或发票自动化，而是面向采购团队的一层更宽运营系统，帮助他们在供应商和支出流程上建立统一记录系统。第三方公司资料页也从外部角度强化了同一定位：Ivalua 是一家成立于
              2000 年、提供支出、采购和供应商管理软件的云端供应商。地点不能简单贴成美国公司标签：办公室页面明确把美洲总部放在 Redwood
              City，而法国法律记录和融资公告保留了公司的法国起源和法人足迹。因此，后续章节最合适的工作定义是：一家后期私营、横跨大西洋的采购软件平台，拥有统一架构和全球交付布局。
