            body: >-
              可比样本有用，但很杂。Coupa 是最相关的战略参照，因为它也是 business-spend / procurement 资产，但私有化时规模大得多。SAP 和 Oracle 等公开 ERP
              与大型企业软件公司提供当前市场背景，但它们把采购以外的许多业务打包在一起。Multiples.vc
              的公开软件品类倍数有助于框定市场制度，不过仍是品类平均数，不是纯采购可比公司。这组混合样本给出一致信息：Ivalua 不该像困境中的通用 SaaS
              资产那样交易，但如果没有一流经济性的私下证据，也不该立刻按最贵先例定价。
