      - number: '1.2'
        title: 领导层、治理与资本历史
        blocks:
          - type: paragraph
            body: >-
              公开来源里的治理可见度比产品营销薄，但可见记录仍足以支撑后续尽调。领导层页面强调资深高管团队，带日期的新闻稿则显示具体运营招聘，例如 2017 年 Alex Saric 出任 CMO、2019 年 Pascal
              Bensoussan 出任 CPO。机构资本加速进入的同一时期，公司也有意加码商业规模化和产品领导力。资本历史是概览里最清楚的一块。Ivalua 自己 2017 年的公告称 KKR 投资 $70
              million；2019 年 Ardian 和 PR Newswire 的公告又相互印证，公司完成一轮 $60 million 融资，估值超过 $1 billion，Tiger Global 加入，Ardian
              增持。到 2026 年，Hg 的投资组合页面确认 Hg 已是所有者，并把 Ivalua 描述为领先的 AI 驱动支出管理供应商。仍然不透明的是当前董事会构成、财务赞助方控制权，以及 2024 年 Hg
              交易对应的精确估值标记或条款。这种不透明很重要，因为即便业务本身健康，私募股权所有权也会实质影响退出时点、杠杆容忍度和披露纪律。
