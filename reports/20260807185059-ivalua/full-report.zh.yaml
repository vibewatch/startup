companyProfile:
  summary: >-
    Ivalua 是一家私营采购软件公司，成立于 2000 年，根在法国，美洲总部设在 Redwood
    City。公司销售统一的从寻源到付款平台，覆盖寻源、合同生命周期管理、供应商管理、需求受理、支出分析和采购到付款流程；公开客户证据显示，大型企业和公共部门买方已经采用。公开证据支撑其已具备可观规模，也显示财务赞助方仍有兴趣，但当前经济画像只能从第三方估计和选择性公司披露中看到一部分。
