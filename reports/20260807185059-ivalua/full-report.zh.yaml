      - number: '8.3'
        title: 乐观、基准与悲观估值逻辑
        blocks:
          - type: paragraph
            body: >-
              公开资料下最干净的 Ivalua 估值方法，是在三个不完美框架之间三角校验：代理 ARR、公开软件倍数、采购软件交易先例。2026 年 7
              月的公开软件中位数，对一个有客户证明和产品广度、已具规模的企业采购平台来说太低；Coupa 私有化倍数又过于慷慨，不能全套套用到一个规模更小、透明度更低的资产上。于是只剩中间区间。可辩护的基准情景约为可信 ARR
              的 5x 至 7x；以 $153M ARR 代理值计算，约为 $765M 至 $1.07B。悲观情景用 3x 至 5x ARR，覆盖增长代理值美化现实，或资方条款、留存、利润率质量让人失望时的下行。乐观情景用
              7x 至 9x ARR，可到约 $1.07B 至 $1.38B，但真正需要私下确认收入质量强于公开记录。
