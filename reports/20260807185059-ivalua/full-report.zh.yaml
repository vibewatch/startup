      - number: '1.3'
        title: 规模、客户与里程碑
        blocks:
          - type: paragraph
            body: >-
              即便精确数字仍不完美，规模方向也很强。Hg 的投资组合页面称 Ivalua 在全球服务超过 400
              家企业客户，客户案例中心则明确以“全球数百个最受推崇品牌”为卖点，覆盖企业和公共部门场景。Commonwealth of Virginia
              这个案例尤其有用，因为它证明公司并不局限于商业账户，也能支撑大型公共采购转型项目。产品和公司里程碑同样呈现长期扩张弧线，而不是静态装机基础。公司在 2017 年同时完成 KKR 大额融资和 Directworks
              收购，2019 年深化第三方风险能力并跨过独角兽门槛，2023 年推进生成式 AI 功能，2026 年推出 IVA
              Studio，同时新闻中心仍持续发布新联盟和客户进展。第三方数据库试图量化收入、ARR、员工数和阶段，关于后期规模的方向判断大体一致，但差异仍大到不能把每个数当成经审计事实。报告其余部分的安全基准情景是：Ivalua
              是一个规模化的私营采购软件资产，有真实客户宽度、持续产品投入，也有持续但可管理的披露缺口。
