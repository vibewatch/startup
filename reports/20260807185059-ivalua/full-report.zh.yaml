            body: >-
              公开牵引可见，但只能通过噪音较大的代理指标观察。GetLatka 称 Ivalua 2023 年达到 $81.8 million ARR，2024 年达到 $153 million
              ARR；如果两个数字方向上正确，则意味着增长约 87%。Growjo 对当前收入估计更高，约为每年 $211 million，员工超过一千人；Craft 则提供一个历史锚点，即 FY2021 收入 €110.5
              million。这些数字不能直接比较，因为它们混合了 ARR、收入、不同年份和模型驱动估计；但合在一起，它们确立了 Ivalua 的软件规模有实质意义，而不是小规模利基供应商。Ivalua 2021
              年创纪录销售公告以及仍活跃的 2026 年新闻节奏，也提供了额外的非 GAAP 牵引信号。因此，正确分析姿态是接受规模和增长方向真实存在，同时拒绝假装公开数据库能给出经审计收入桥。
