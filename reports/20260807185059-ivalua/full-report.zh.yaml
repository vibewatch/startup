  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 支撑因素
      - 削弱因素
      - 改变判断的因素
    rows:
      - - 规模化采购工作流资产
        - 产品广度、客户证明、资方支持
        - 财务不透明以及信任 / 交付风险
        - 经审计 ARR、NRR 和利润率资料包
      - - 可能应相对广义软件中位数享受溢价
        - 采购关键性、客户背书深度、AI / 产品动能
        - 没有证据表明其应获得采购软件区间顶部溢价
        - 更好的客户留存和资方条款清晰度
      - - 可能作为平台资产复利增长
        - S2P 范围广，部署由合作伙伴支撑
        - 合作伙伴依赖和实施差异
        - 渠道结构和部署成功率数据
      - - 价格合适时存在风险调整后上行空间
        - 2019 年独角兽锚点叠加增长代理指标
        - 2024 年条款和当前股权价值未公开
        - 清晰的 2024 年后股权结构表和估值备忘录
    notes: 这张表旨在说明：价格纪律比故事方向更重要。
