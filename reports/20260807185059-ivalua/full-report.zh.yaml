      - number: '3.5'
        title: 护城河耐久性与反向信号
        blocks:
          - type: paragraph
            body: >-
              对 Ivalua 最强的正向解读是，它仍在顶级竞争集合里，并用一个统一平台覆盖多个行业和用例。最强的负向解读是，几乎每个严肃同行现在都在营销
              AI、工作流覆盖、分析和供应商管理深度，容易压缩叙事差异化。商品化风险在 Ivalua、Coupa、SAP、GEP 和 Zycus 之间尤其明显；这些公司现在都把 AI
              或智能体采购讲成入场券。评测界面还给出另一个警示：SelectHub 突出 Coupa 的定制化和易用性抱怨，说明规模并不能消除实施摩擦。但对 Ivalua
              更大的教训是对称的。如果大型在位者即便让用户沮丧，仍能凭分销力量保住份额，那么 Ivalua
              必须证明自己能把灵活性和可用性转成可量化赢单率，而不只是更好看的定位文案。缺失的公开证据不是功能清单，而是关于定价纪律、信任态势和真实赢单 / 输单结果的中立证明。
