      - number: '7.5'
        title: 缓释项、触发器与结论
        blocks:
          - type: paragraph
            body: >-
              风险结论可管理，但并不轻。公开缓释项存在：有成文的隐私和云条款、相对详细的安全白皮书、外部供应商风险可见度、正式认证信号，以及能交付复杂客户的生态。剩余风险最高的地方，正是公开尽调停下来的地方：真实生产可靠性、伙伴表现差异、资产负债表条款，以及客户在实施或信任落空时如何行动。打破投资假设的触发器最清晰：重大安全或隐私事件、反复出现的伙伴主导部署失败证据，或大型受监管客户比案例暗示更难留存或扩张的证据。这些并不稀奇；企业软件故事通常就是这样走弱。因此，投资者不应只盯
              bookings，还要监控外部安全监测变化、实施参考和任何文档或控制漂移迹象。
            claimRefs:
              - CR040
