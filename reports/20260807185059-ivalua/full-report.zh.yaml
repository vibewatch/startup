        - 公开事件、违规通知或客户控制例外
        - 一起有客户影响证据的重大事件
        - 暂缓形成投资信心，要求根因和修复证明
      - - 合作伙伴执行崩盘
        - 企业 / 公共部门项目反复延期或上线失败
        - 多个具名客户出现同类模式
        - 下调实施可扩展性假设下的价值
      - - 模型不透明转化为财务压力
        - 续约偏弱、集中度或杠杆负担的证据
        - 任何硬披露若与当前耐久性假设相冲突
        - 按更低质量收入重估估值
      - - 竞争压力
        - 旗舰监管行业客户流失或迁移
        - 多个可引用客户转投同类套件
        - 下调护城河和定价权假设
      - - 法律 / 控制漂移
        - 产品范围扩张时，公开法律 / AI 文件仍然滞后
        - 尽调跟进后仍持续不匹配
        - 提高治理风险折价
    notes: 这些触发项有意设计成可从公司外部或标准尽调包中监测。
    claimRefs:
      - CR003
      - CR031
      - CR037
      - CR039
      - CR040
      - CR041
      - CR042
      - CR043
      - CR046
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 有条件关注
        - 中
        - 中高
        - 价格敏感
        - 只有在入场纪律严格且能完整访问私有数据时才推进
      - - 低于 ~6x 可信 ARR
        - 较高信心
        - 中
        - 有吸引力
        - 若私有尽调确认收入质量，则接触
      - - ~6x-8x 可信 ARR
        - 中等信心
        - 中高
        - 公允但不宽松
        - 强硬谈判，并要求留存 / 利润率证明
      - - 高于 ~8x 可信 ARR
        - 低信心
        - 高
        - 偏高
        - 除非私有数据明显优于公开代理指标，否则放弃
    notes: 入场阈值是基于公开证据推导的框架指南，不是已谈妥条款清单中的事实。
