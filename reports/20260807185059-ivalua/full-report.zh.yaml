            body: >-
              可见客户集合在垂直行业和买方复杂度上都很广。公开留存证据覆盖公共部门采购（Commonwealth of Virginia、Maryland、Arizona、BCLC、City of New
              York）、金融服务（Navy Federal）、医疗（Maxim）、制造和工业复杂场景（Honeywell）、零售和消费品类（IKEA，可能还有目录证据指向的
              LVMH）、旅行（Booking.com），以及咨询或合作伙伴主导的采购转型（Capgemini、Booz
              Allen）。这种组合很重要，因为采购软件在受监管、多利益相关方、供应商、合同和审计工作负担较重的环境里往往要求最高。因此，Ivalua 的客户证据更像是适配大型、流程复杂买方，而不是 SMB
              或交易型自助服务客群。需要保留的限定是，公开记录展示客户标识比展示收入权重更清楚；它也暗示 Ivalua 的获客模式可能更偏长周期、咨询式销售，而不是轻量交易型采用。
