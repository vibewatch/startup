  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Coupa 私有化交易
        - ~8.4x NTM 收入；~$8B EV
        - 最相关的采购套件交易先例
        - 同一品类、私募股权买方、采购工作流资产
        - 规模大得多，收入基础也更知名
      - - 典型 PE SaaS 平台入场价
        - ~4x-6x 收入
        - 私募市场中低端定价纪律区间，可作参考
        - 反映财务投资方对盈利且稳定 SaaS 的测算
        - 并非采购专属，可能低估优质资产
      - - ERP 软件公开市场类别
        - ~3.3x NTM EV/收入
        - 大型企业软件板块当前的市场定价环境
        - 锚定 2026 年公开市场的谨慎基调
        - 品类均值，并非纯采购软件
      - - 公开软件公司中位数
        - ~2.2x NTM 收入
        - 通用软件的广义市场底线
        - 可用于校验下行情形
        - 强企业工作流资产应高于此
      - - SAP
        - ~5.4x 市值 / 收入代理指标
        - 大型企业软件的价值锚
        - 说明成熟企业软件可拿到中个位数倍数
        - 并非纯采购软件，且市值不是 EV
      - - Oracle
        - ~6.2x 市值 / 收入代理指标
        - 另一个成熟企业软件价值锚
        - 有助于界定中个位数偏上区间
        - 并非纯采购软件，且市值不是 EV
      - - Ivalua 最近一次干净的公开锚点
        - 2019 年估值 >$1B
        - 特许经营价值的历史底线
        - 确认该资产在当前财务投资方阶段前已跨过独角兽门槛
        - 数据已旧，且早于 2024 年经济条件
    notes: 可比样本有意混合使用，因为公开市场没有完全对应 Ivalua 的可比公司。
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of the most decision-relevant retained transaction and market references; not a full banker-style comp
        set.
