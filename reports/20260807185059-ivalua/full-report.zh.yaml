    sections:
      - number: '7.1'
        title: 监管、法律与控制面
        blocks:
          - type: paragraph
            body: >-
              公开法律触点存在，但并不完美。Ivalua 发布了隐私政策、网站条款、面向经销商终端客户的云条款、安全白皮书，以及通过 ISO 27001 和 CSA STAR
              可见的云安全控制轨迹。白皮书也明确说明，其中许多材料是信息性而非合同性内容；这很重要，因为筛查层面的舒适感不等于可执行的客户保护。另一个较小但值得注意的治理瑕疵是新鲜度：网站条款页面显示更新日期为 2021
              年，而公司的公开产品故事已经进入 AI 色彩很重的 2026 年定位。这不能证明法律缺陷，却正是投资者应该标记的文件漂移：法律包装和产品现实以不同速度演进。
