  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与对手类型
        blocks:
          - type: paragraph
            body: >-
              Ivalua 所处的市场不是简单双供应商格局。Gartner 式信息、排名和同行评测界面都指向一个分层赛场：Coupa、SAP Ariba、Oracle、JAGGAER、GEP、Zycus 和
              Synertrade 等核心套件同行；编排型或最佳单点挑战者；以及解决更窄支出控制问题的轻量替代方案。Procurement Magazine 明确称市场正在转向模块化、API 驱动生态，对传统套件形成压力；其
              S2P 前十排名也显示，买方可以合理纳入候选名单的严肃供应商很多。Gartner Peer Insights 也强化了同一点：围绕 Ivalua
              呈现的是广泛替代集合，而不是单一明显对手。正确框架因此是一个拥挤品类，竞争问题不只是功能对齐，而是买方到底想要 ERP 引力、最佳单点工作流深度、AI 驱动试验，还是更轻的采购控制层。
