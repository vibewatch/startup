  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - ARR 代理指标大体正确；留存和利润率质量强；资方条款干净
        - 7x-9x ARR => 约 $1.07B-$1.38B
        - 需要私有数据验证质量和结构
        - 有可能，但公开证据还没支撑到位
      - - 基准
        - ARR 代理指标方向正确；质量好但非顶尖；估值市场仍挑剔
        - 5x-7x ARR => 约 $765M-$1.07B
        - 不透明仍在，但未掩盖重大弱点
        - 最能被当前公开证据支撑
      - - 熊市
        - ARR 代理指标被高估，或资方 / 模型披露不及预期；增长质量走弱
        - 3x-5x ARR => 约 $459M-$765M
        - 留存、利润率或结构不及预期
        - 如果公开代理指标美化了现实，就有真实下行空间
    notes: 这些情景是估值框架，不是经审计预测。
