      - number: '3.4'
        title: 切换成本与分销力量
        blocks:
          - type: paragraph
            body: >-
              这个市场天生黏性强。采购平台贴近 ERP 数据、供应商工作流、审批、合同和发票流程，因此替换或大迁移通常带来真实运营风险。CostBench 对 Coupa
              明确讲出了这一点：迁移和集成成本可能压过节省额，企业因此常常留在原系统。同一逻辑也解释了 ERP 原生在位者为什么保有结构性优势：SAP 和 Oracle
              可以把采购作为既有企业技术栈的延伸来卖，而不是一个全新的跨职能项目。Tonkean 关于拥挤编排工具的指南和 Ivalua 自己的统一 S2P
              定位，都指向同一个买方现实：多系统并用和共存很常见，但干净的推倒重来替换很难。因此，Ivalua 的灵活性很重要。它可能的优势不是拥有最大装机基础，而是给买方一条可信路径，让采购现代化不必盲目继承单一 ERP
              供应商的每一项约束。
            claimRefs:
              - CP022
              - CP035
