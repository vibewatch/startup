      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资历史给出一个坚实锚点，也给出一个令人沮丧的模糊锚点。坚实锚点是 2019 年：Ardian 和 PR Newswire 均印证 Ivalua 在一轮 $60M 融资中估值超过 $1B。模糊锚点是 2024
              年：Hg 和 Agila 进入故事，但公开材料没有交易经济性。因此，投资者知道 Ivalua
              进入资方阶段后仍能融资，却不知道最新条款意味着估值上调、持平还是结构化结果。在这种环境下，入场纪律比叙事热情更重要。纪律严明的买方不应只因为公司仍吸引资方，就支付完整溢价倍数。只有价格和私下尽调都支撑时，才该出更高价。
