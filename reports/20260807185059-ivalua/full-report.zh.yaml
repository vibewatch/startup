      - number: '3.3'
        title: 能力、定价与客群适配
        blocks:
          - type: paragraph
            body: >-
              能力宽度已经不再是区分供应商最简单的办法，因为几乎每个留存竞争对手页面都会宣称某种寻源、供应商管理、合同工作流、分析和 AI 组合。更重要的是这种宽度的形状。Techno Pulse 把 Ivalua
              描述为可配置性最强的选项，Coupa 是最快实现价值的路径，SAP Ariba 最适合 SAP ERP 买方，JAGGAER 更适合复杂、重寻源环境。SelectHub 进一步强调 Ivalua
              的跨行业覆盖，并把定制化、供应商管理、合同管理和支出分析列为反复出现的优势。不过，整个市场的定价透明度仍然很差。CostBench 称 Coupa 在 2026 年仍是定制报价，Procurify
              称自己的定价模块化且定制构建，SelectHub 对 Ivalua 的定价估计最好只当第三方方向性参考，而不是官方价目表。这意味着买方往往先比较架构、工作流适配和实施负担，之后才有可能逐项比较商业条款。
