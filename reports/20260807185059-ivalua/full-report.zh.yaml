      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >-
              留存分析师来源支持一个清楚结论：采购软件是一个大且增长中的品类，但它们不支持伪精确。Mordor Intelligence 预计市场 2026 年为 USD 10.74 billion，高于 2025 年的
              USD 9.81 billion，并将在 2031 年扩至 USD 17.11 billion，CAGR 为 9.76%。Fortune Business Insights 稍低，给出 2026 年 USD
              9.88 billion、2025 年基数 USD 8.89 billion；Global Market Insights 更低，2026 年 USD 8.6 billion，2025 年 USD 8.1
              billion。The Business Research Company 和 IMARC 也强化了增长方向，虽然可访问摘录对清晰点估计帮助较小。更窄的采购到付款子板块也有实质规模：6Wresearch 估计
              2025 年约 USD 5.2 billion，到 2032 年约 USD 10.4 billion，CAGR 为 11.0%。诚实用法是把这些报告当区间，而不是单一锚点。合在一起，留存来源暗示 2026
              年采购软件 TAM 约落在 USD 8.6 billion 至 USD 10.74 billion 区间；更窄的 P2P / S2P 层仍是数十亿美元级市场。
