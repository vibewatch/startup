      - number: '8.5'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              可辩护的建议是有条件兴趣，并严守价格纪律。如果投资者能在约 6x 可信 ARR 或以下接触 Ivalua，这家公司值得认真研究，因为产品、客户和资方信号都真实存在。如果要价在缺少留存、利润率和 2024
              年交易条款审计证据的情况下升到约 8x 可信 ARR 以上，安全边际就太薄。换句话说，这不是一个“永远 pass”的标的，而是一个“证明经济性，或把价格降下来”的标的。最有价值的下一步很直接：拿到真实 cap
              table，验证收入质量，测试客户耐久性是否真像 logo 组合暗示的那样强。公共部门参考深度有帮助，但仍不能替代私下留存和利润率证据。
