      - number: '1.4'
        title: 反向信号与待解问题
        blocks:
          - type: paragraph
            body: >-
              概览阶段的主要警示不是生死级红灯，而是信息质量和运营复杂度问题，后续章节都会反复遇到。第一，留存公开来源并未充分披露 2024 年 12 月 Hg
              交易的准确估值标记和结构，这会削弱任何当前估值主张的置信度。第二，规模代理指标可见，但达不到审计级：GetLatka、Growjo、Tracxn 和 Caplight
              能帮助三角验证业务，却在细节上不一致，或只暴露部分字段。第三，UpGuard
              的供应商风险页面显示外部可观察安全态势体面但并非无瑕，足以把网络安全卫生列为尽调事项，而不是关上盒子。最后，治理透明度不完整，因为没有留存来源提供完整董事名单、委员会地图或财务赞助方权利摘要。这些问题都不否定
              Ivalua 是真实、规模化品类资产的判断，但它们确实意味着后续财务、风险和估值章节应优先采用有交叉印证的区间和明确缺口，而不是伪精确。
