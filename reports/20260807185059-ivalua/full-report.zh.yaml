      - number: '2.5'
        title: 证据缺口与矛盾
        blocks:
          - type: paragraph
            body: >-
              最大未解问题不是采购软件是否重要，而是公开品类里到底有多少能以可投资方式真正被 Ivalua 获取。留存公开来源都没有给出干净的 Ivalua 专属 SAM 或 SOM；分析师 TAM
              估计彼此差异较大，很容易高估精确度。公开市场报告足以说明品类大且在增长，但不足以按垂直行业、ERP 环境、预算负责人或赢单概率分配机会。市场证据也混合了强信号和噪音输入：Mordor、Fortune、GMI 和
              6Wresearch 等留存分析报告有用，低质量聚合器往往只是增加重复，决策价值更低。最后，买方采用机制仍披露不足。公开来源集清楚表明 ERP 集成和运营适配至关重要，但没有提供
              ACV、买方职级或转化路径数据，无法把这个观察转成严谨的自下而上市场模型。这些遗漏不削弱品类逻辑，但会给任何过度依赖泛化 TAM 的估值模型设置信心上限。
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: 展示要点
        blocks:
          - type: callout
            title: 市场很大，但 TAM 不能照单全收
            body: 留存证据支持一个真实的数十亿美元级采购软件市场，但没有公开来源按垂直行业、ERP 环境和预算负责人，拆出 Ivalua 能现实获取的机会份额。
            calloutType: insight
