  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 判断建议时，关键是给定入场价格下，规模和客户证据能否压过不透明度。
    data:
      nodes:
        - id: n1
          label: 先看公开规模证据
          detail: ARR / 收入代理指标，加上独角兽锚点
          tone: neutral
        - id: n2
          label: 检验资产质量
          detail: 客户、产品宽度、财务赞助方支持
          tone: positive
        - id: n3
          label: 检验不透明折价
          detail: 留存、利润率和 2024 年条款缺失
          tone: warning
        - id: n4
          label: 设定入场区间
          detail: 基准情形约为可信 ARR 的 5x-7x
          tone: neutral
        - id: n5
          label: 有条件关注
          detail: 只有价格或尽调改善才接触
          tone: positive
        - id: n6
          label: 放弃 / 等待
          detail: 如果入场价格跑在证据前面
          tone: warning
      edges:
        - from: n1
          to: n2
          label: 规模真实
        - from: n2
          to: n3
          label: 质量仍待证明
        - from: n3
          to: n4
          label: 不确定性需折价
        - from: n4
          to: n5
          label: 入场守住纪律
        - from: n4
          to: n6
          label: 入场过贵
    claimRefs:
      - CV026
      - CV029
      - CV030
      - CV031
      - CV038
      - CV039
