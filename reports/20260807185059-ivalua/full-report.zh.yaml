  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与货币化
        blocks:
          - type: paragraph
            body: >-
              公开来源集更支持经典企业采购软件货币化模式，而不是任何新奇按量计费结构。Ivalua 和 Hg 都把公司描述为云端或 AI
              驱动的支出管理平台，从寻源到付款产品页也显示，其工作流广泛覆盖需求受理、签约、供应商管理和采购到付款。这类产品架构强烈指向经常性企业软件合同这个核心收入引擎，实施、集成和支持工作则可能构成相邻收入线。SelectHub
              把 Ivalua 描述为订阅式企业软件产品，也承认定价通常是定制的，这强化了上述判断。Directworks
              把可货币化范围扩展到直接材料管理；制造业中心工作流往往意味着更深部署和服务工作，因此这一点重要。关键限制在于，留存官方来源都没有披露模块结构、软件与服务拆分，或实际成交价格。因此，投资者可以在高层次上可信描述收入模式，但还不能仅凭公开证据精确承销其质量或弹性。
