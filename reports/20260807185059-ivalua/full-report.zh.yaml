      - number: '7.4'
        title: 竞争与模型风险
        blocks:
          - type: paragraph
            body: >-
              竞争和模型不透明构成财务下行情景。Ivalua 卖的不是沉睡小众市场：Coupa、SAP Ariba 和 GEP
              都在争夺企业采购与支出管理里的同一个控制点。因此，即便市场粘性强，实施痛点、伙伴差异或产品可靠性问题也可能触发客户切换。模型层面，资方背书降低了明显的短期偿付焦虑，但公开来源仍看不到现金消耗、资金
              runway、杠杆、客户集中度或伙伴渠道贡献的利润率质量。换句话说，投资者能看到几项降风险的信号——成熟度、控制、客户、资方支持——但仍看不到决定股权价值抗压能力的变量：一个糟糕季度、失败部署或安全事件会造成多大伤害。Maryland
              和 New York 的公共部门案例也说明，一旦部署失败，波及面可能覆盖大型供应商网络和政治可见度很高的利益相关方。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
