      - number: '4.4'
        title: 成本结构与单位经济限制
        blocks:
          - type: paragraph
            body: >-
              投资者真正想用来承销的大多数指标仍然是私有信息。留存公开来源没有披露毛利率、获客成本（CAC）、回本周期、净留存率（NRR）、流失、服务结构、烧钱速度或现金跑道。最能支撑的推断是定性的：产品宽度加上多次 AI
              发布，意味着持续研发支出；历史上的营销和产品领导层招聘，说明规模化时期有意投入销售市场和产品；UpGuard 页面则暗示，信任与安全是一条持续运营成本线，而不是一次性合规勾选。Growjo
              估计的员工人均收入提供了一种可能的效率代理指标，但模型驱动太强，不能当成硬单位经济事实。于是留下的是一个熟悉的私营软件格局：外部投资者能看到公司大到值得关注，也有足够资金继续运营，但无法验证每一美元 ARR
              有多少转化为毛利或自由现金流。这个缺口并不致命，却正是后续估值工作必须保持区间化的原因。
