      - number: '7.3'
        title: 合作伙伴、依赖与执行风险
        blocks:
          - type: paragraph
            body: >-
              运营模式确实带来依赖风险。100% 伙伴优先策略、服务交付比重高的打法、广泛 ERP
              连接能力，顺利时都是优势；一旦失灵，就会放大风险。伙伴扩大实施产能和垂直覆盖，但上线质量也部分押在第三方执行上。Integration Hub 的信号——连接 60 多套 ERP
              系统，并支持实时、双向连通——说明客户为什么买这个平台；同时也意味着 Ivalua 要在不同客户环境里背负大量维护和边缘案例负担。资方依赖同样重要。Hg 和 Agila 证明公司能拿到成熟资本，但 2024
              年交易条款仍不透明。正确解读不是“依赖等于脆弱”，而是“依赖留下执行和治理敞口，公开材料无法把它关掉”。
