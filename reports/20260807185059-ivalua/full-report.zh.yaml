      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开产品页显示，Ivalua
              面向的不是一个单一买方。公共部门页面围绕政府团队的合规、服务连续性和采购现代化。制造业页面强调直接材料、供应链协作和供应商复杂度。医疗页面强调韧性、成本压力和受监管供应连续性。即便软件品牌相同，这些用例也意味着不同购买中心和采用路径。公共部门项目通常先要治理、透明度和连续性；制造业买方需要直接支出深度和供应商协作；医疗买方要在监管约束下守住韧性和成本控制。三类场景里，集成层都是核心门槛。Ivalua
              的 multi-ERP 页面明确营销其与多套后端系统快速共存，并称平台已和 60 个不同 ERP
              及其他系统完成集成。企业采购转型常常卡在不能一次性替换核心财务基础设施，这一点具有战略意义。因此，可能的采用路径不是抽象地“购买采购软件”，而是“在嵌入现有 ERP
              存量架构的同时，解决治理、复杂度和可见性问题”。
