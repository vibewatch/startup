      - number: '4.3'
        title: 资本历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              资本可得性看起来明显强于披露质量。公开时间线到 2019 年有良好交叉印证：Ivalua 2017 年从 KKR 融资 $70 million，2019 年又完成 $60 million 融资，估值超过 $1
              billion。第三方资料大体一致，认为累计外部融资约 $134 million 至 $134.4 million。更近期资本背景更难量化，但方向上积极。Caplight 显示 2024 年 8
              月末轮融资标记；AgilaCapital 披露与 Hg、Hamilton Lane、Patria 和 Pictet 一同参与少数股投资；MC Capital 称 Hg 于 2024 年 12 月通过
              Genesis 10 Fund 完成投资。交易条款未披露，因此公开观察者仍不知道新股与老股交易的比例、杠杆，或进入资产负债表的现金。HgCapital Trust 活跃的 2024
              年交易环境让赞助方背景可信，但分析上仍不足以替代真实资本充足性披露。证据支持 Ivalua 能获得成熟资本；它没有揭示这些资本带来的现金垫。
