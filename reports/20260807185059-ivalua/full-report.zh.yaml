  - id: TV005
    title: 论点失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 留存或利润率证据不及预期
        - 私下尽调显示质量明显弱于公开代理指标暗示
        - 基准情形向悲观情形压缩
        - 重新定价或放弃
      - - 2024 年财务投资方条款比预期更不利于投资人
        - 优先权、杠杆或治理包袱较重
        - 公开估值锚的可投性下降
        - 要求折价或放弃
      - - 安全 / 信任事件
        - 重大事件或不利控制发现
        - 估值折扣扩大；客户验证减弱
        - 暂停并重做测算
      - - 伙伴主导交付表现不佳
        - 访谈或数据反复显示实施失败
        - 平台广度从护城河变成负担
        - 下调溢价假设
      - - 输给头部套件
        - 标杆买方转向 Coupa/SAP/GEP 等替代方案
        - 品类溢价收缩
        - 下调倍数区间
    notes: 这些触发因素重要，是因为它们会改变投资人愿意支付的倍数，而不只是改变对外讲述的故事。
    claimRefs:
      - CV024
      - CV025
      - CV030
      - CV037
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2024 年交易条款
        - 实际估值、杠杆、优先权、治理权利
        - 不弄清当前资本结构，入场价没有意义
        - 股权结构表 + 法律文件 + 与财务投资方访谈
      - - 收入质量
        - 经审计 ARR、GAAP 收入、服务收入占比、毛利率
        - 区分真实软件价值和被抬高的收入代理指标
        - 财务尽调 / KPI 包
      - - 留存
        - NRR、流失率、续约、队列耐久性
        - 决定客户验证能否转化为价值耐久性
        - 客户成功 / 收入运营尽调
      - - 实施质量
        - 部署周期分布、伙伴评分卡、失败上线案例
        - 检验平台广度能否高效扩张
        - 服务 + 伙伴运营尽调
      - - 安全与信任
        - 客户 SLA、事件历史、控制例外
        - 直接影响估值折扣和客户背书耐久性
        - 安全审查 + 信任门户材料
      - - 竞争现实
        - 面对 Coupa、SAP、GEP 及伙伴主导替代方案的赢单 / 输单数据
        - 决定溢价倍数是否站得住
        - 销售运营和管线分析
    notes: 这些问题是把有趣的公开叙事推进成可投资私有档案的最快路径。
    claimRefs:
      - CV024
      - CV025
      - CV031
      - CV038
      - CV039
      - CV040
      - CV041
