        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              可辩护的财务结论既不是确定性看多，也不是红旗恐慌。公开证据支持 Ivalua
              是真实、规模化的软件资产，经过多轮外部融资验证，持续投入产品，牵引规模也大到多年前已跨过独角兽门槛。同时，收入质量和资本强度画像仍让人沮丧地不完整。公开 ARR
              和收入代理指标是有用的三角验证点，但彼此不能干净对账，也没有披露决定增长是否高效、黏性强、并能增厚利润率的指标。财务赞助方背书降低了近期融资压力的概率，但赞助方经济条款、账上现金和杠杆仍属私有信息。实际含义很直接：Ivalua
              的财务可信度足以值得严肃尽调，但透明度不足以仅凭公开信息做出完整承销后的确信判断。
