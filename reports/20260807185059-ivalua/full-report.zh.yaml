  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资假设与反假设
        blocks:
          - type: paragraph
            body: >-
              正面假设很直接。Ivalua 看起来是一家已经具备规模的采购软件平台：覆盖广泛的从寻源到付款工作流，有企业和公共部门客户证明，持续投入 AI
              和产品，也多次获得机构资本验证。这些属性正是投资者在私营企业软件资产里想看到的东西。反假设同样清楚：几乎所有能把“估值好奇”变成“估值信心”的数字，仍然是私有或基于代理指标推得。ARR、收入、留存、利润率、集中度和资方时期条款，要么是估算，要么未披露。因此，正确估值姿态先要承认：Ivalua
              很可能有价值，但仅靠公开数据仍很难干净定价。
