  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              留存产品页一致把 Ivalua
              描绘成统一企业采购运营系统，而不是单功能应用。从寻源到付款页面把需求受理、从寻源到合同、供应商管理和采购到付款连在一起；从寻源到合同页面则展示上游请求受理、供应商评估、签约和支出可见性如何作为一个连接流程运转。这种以工作流为中心的框架很重要，因为企业采购买方往往希望供应商、合同和应付款周边少一些割裂工具。Fincons
              和 Hg 也从公司外部呼应了同样的宽口径定位，强化了集成平台故事并非单页营销口号。主要结论是，Ivalua
              的产品定义清楚且自洽：它试图拥有从请求到付款和供应商监管的采购工作流。客户购买的是这种跨模块连续性，而不只是很长的 SKU 清单。
