      - number: '5.3'
        title: AI、分析与差异化
        blocks:
          - type: paragraph
            body: >-
              Ivalua 的差异化叙事越来越 AI 前置，但根基仍是工作流宽度。寻源页面营销 AI 驱动协作；agentic-AI 页面把 AI 描述为嵌入式运营辅助；2026 年 4 月 IVA Studio 发布加上
              2023 年 11 月生成式 AI 公告，显示 AI 是活跃路线图主题，而不是后贴的热词。公开资料里，最具体的差异化功能仍是实际问题：更广供应商覆盖、理解合同的发票检查、来自 Directworks
              收购的直接材料管理，以及与欺诈预防、合规和节省发现相连的支出分析。Everest Group 的 2026 年覆盖帮助确认，路线图已经足够可见，能吸引外部分析师关注。但反向视角也很重要：留存来源没有证明
              Ivalua 的 AI 实质优于同行，只证明它在大力投入，并把 AI 嵌入采购、供应商、合同和应付款等流程。
