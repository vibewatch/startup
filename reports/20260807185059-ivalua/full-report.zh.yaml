      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              采购软件的需求逻辑很强。Mordor 将增长归因于自主工作流、云原生架构、生成式 AI 副驾驶和支付创新。6Wresearch 也提到自动化、云部署、成本可见性和分析。GEP 的 2026 ProcureCon
              报告把这些软件驱动放进更广运营背景：采购领导者要面对持续波动、成本压力和提速要求。与此同时，采用约束既不轻，也非暂时。Supply Chain Xchange 文章称，采购领导者想要 AI，但当前 IT
              系统尚未准备好；与现有系统集成成为领先转型挑战之一。Ivalua 自己基于调查的公告也强化了这种摩擦：86%
              的英国企业在发展数字采购技能时遇到障碍，技术限制妨碍团队达成业务目标，反复出现的黑天鹅事件之后，降低供应链中断已进入更高优先级。简言之，品类顺风真实存在，但主要阻碍不是没有需求，而是实施能力：技能、数据质量、遗留架构，以及在不打断运营的前提下推进采购现代化的能力。
