    - Does not disclose services revenue, utilization, or margin
  - - Buyer ROI narrative
    - Why Ivalua page cites Forrester TEI with 393% ROI and payback in <6 months
    - Explains how the sales team frames value in enterprise procurement deals
    - Says nothing about Ivalua's own CAC, win rates, or payback
  - - Hiring footprint
    - Careers page markets a global team and ongoing hiring narrative
    - Supports continued payroll and expansion cost base
    - Provides no clean disclosed headcount bridge
  - - Financial data opacity
    - CB Insights exposes only a preview while deeper financials remain gated
    - Confirms external interest in the company's metrics
    - Still leaves investors without auditable numbers
  notes: This scorecard captures commercial-supporting evidence that is directionally useful for underwriting but not sufficient to replace finance-room diligence.
