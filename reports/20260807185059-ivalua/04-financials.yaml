- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on analysis
  - Why public record fails
  - Exact diligence path
  rows:
  - - Gross margin and contribution margin
    - Blocks quality-of-revenue underwriting
    - Aggregators expose top-line proxies but not margin structure
    - Request audited gross margin and software-vs-services split
  - - Burn and runway
    - Blocks solvency and financing-risk assessment
    - Sponsor announcements omit cash proceeds and use of funds
    - Request monthly cash bridge and forecast runway
  - - NRR, churn, and retention
    - Blocks durability underwriting
    - No retained public source discloses cohort retention
    - Request NRR by segment and top-renewal calendar
  - - CAC and payback
    - Blocks sales-efficiency assessment
    - No retained public source discloses customer-acquisition economics
    - Request CAC by channel and payback by segment
  - - Revenue mix by module / services
    - Blocks expansion and margin analysis
    - Public product pages show scope, not monetization mix
    - Request revenue by module and services contribution
  - - Debt, covenants, and sponsor terms
    - Blocks common-equity economic understanding
    - 2024 transaction terms are undisclosed publicly
    - Request full capitalization table and debt schedule
  notes: These gaps are the main reason this chapter stops at credibility rather than conviction.
