  - TI002
  - TI006
  figureRefs:
  - FI001
- id: public-top-line-proxies-and-traction
  title: Public top-line proxies and traction
  body: Public traction is visible, but only through noisy proxies. GetLatka says Ivalua reached $81.8 million ARR in 2023 and $153 million ARR in 2024, implying growth of roughly 87% if both figures are directionally correct. Growjo is higher on current revenue, estimating about $211 million annually and more than one thousand employees, while Craft provides a historical anchor of €110.5 million revenue in FY2021. Those figures are not directly comparable because they mix ARR, revenue, different years, and model-driven estimates, but together they do establish that Ivalua is operating at meaningful software scale rather than as a subscale niche vendor. Additional non-GAAP traction signals come from Ivalua's 2021 record-sales release and its still-active 2026 newsroom cadence. The right analytical posture is therefore to accept scale and growth as directionally real while refusing to pretend that public databases provide an audited revenue bridge.
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
  - CI018
  - CI019
  - CI020
