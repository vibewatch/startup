  - TI005
  figureRefs:
  - FI003
- id: financial-verdict
  title: Financial verdict
  body: 'The defensible financial verdict is neither bullish certainty nor red-flag panic. Public evidence supports that Ivalua is a real, scaled software asset with repeated external financing validation, continuing product investment, and traction large enough to have crossed the unicorn threshold years ago. At the same time, the revenue-quality and capital-intensity picture remains frustratingly incomplete. Public ARR and revenue proxies are useful triangulation points, but they do not reconcile cleanly and they do not disclose the metrics that determine whether growth is efficient, sticky, and margin-accretive. Sponsor backing reduces the chance of near-term financing distress, yet sponsor economics, cash-on-hand, and leverage remain private. The practical implication is straightforward: Ivalua looks financially credible enough to warrant serious diligence, but not transparent enough for a fully underwritten conviction call from public information alone.'
  claimRefs:
  - CI020
  - CI032
  - CI036
  - CI039
