- id: capital-history-and-adequacy
  title: Capital history and capital adequacy
  body: 'Capital access looks materially stronger than disclosure quality. The public chronology is well corroborated through 2019: Ivalua raised $70 million from KKR in 2017 and a further $60 million in 2019 at a valuation above $1 billion. Third-party profiles broadly agree that lifetime external funding is about $134 million to $134.4 million. More recent capital context is harder to quantify but directionally positive. Caplight shows an August 2024 last-round marker, AgilaCapital discloses a minority investment alongside Hg with Hamilton Lane, Patria, and Pictet also in the transaction, and MC Capital says Hg completed an investment in December 2024 through the Genesis 10 Fund. The terms of that transaction are undisclosed, which means public observers still do not know the primary-versus-secondary mix, leverage, or cash added to the balance sheet. HgCapital Trust''s active 2024 deal environment makes the sponsor context believable, but not analytically sufficient to replace real capital-adequacy
    disclosures. The evidence supports that Ivalua can access sophisticated capital; it does not reveal the cash cushion that capital created.'
  claimRefs:
