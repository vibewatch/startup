company:
  name: Ivalua
chapter:
  number: 6
  title: Customers
  summary: 'The retained public evidence shows a credible large-enterprise and public-sector customer base with direct case-study proof across government, healthcare, financial services, manufacturing, retail, travel, and consulting. What public evidence does not show nearly as well is durability economics: Ivalua has strong logo and deployment proof, but weak public disclosure on retention, revenue weighting, and concentration.'
sections:
- id: customer-segmentation
  title: Customer-base segmentation
  body: The visible customer set is broad by vertical and buyer complexity. Publicly retained proof spans public-sector procurement (Commonwealth of Virginia, Maryland, Arizona, BCLC, City of New York), financial services (Navy Federal), healthcare (Maxim), manufacturing and industrial complexity (Honeywell), retail and consumer categories (IKEA, likely LVMH via directory evidence), travel (Booking.com), and consulting or partner-led procurement transformation (Capgemini, Booz Allen). That mix matters because procurement software tends to be especially demanding in regulated, multi-stakeholder environments with heavy supplier, contract, and audit workloads. Ivalua's customer evidence therefore suggests fit with large, process-complex buyers more than with SMB or transactional self-serve segments. The caveat is that the public record exposes logos more clearly than revenue weighting. It also implies that Ivalua's go-to-market likely favors longer, more consultative sales cycles over lightweight
    transactional adoption.
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU020
  - CU023
  - CU024
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof-and-outcomes
  title: Named customer proof and outcomes
  body: The strongest customer evidence is the named case-study set. Virginia, BCLC, Maryland, Arizona, Navy Federal, Maxim, Honeywell, Booz Allen, and City of New York all have retained public proof that goes beyond simple logo placement, and several provide concrete operational context. Virginia is framed as a gold-standard public-sector modernization; BCLC emphasizes auditability and risk mitigation; City of New York highlights faster RFP workflows and 13,000 onboarded vendors; Maxim claims procure-to-pay digitization in eight weeks; and Booz Allen ties the product to government-compliant finance and supply-chain transformation. Those are not perfect substitutes for reference calls, but they are materially stronger than empty logo walls. By contrast, Sanofi and LVMH rest on directory-style proof, while Whirlpool and U.S. Air Force remain unresolved in the retained public set.
  claimRefs:
