  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewals
    missingEvidence: NRR, GRR, churn, renewal rates, contract length, and cohort durability by segment.
    whyItMatters: Logo quality supports credibility, but retention metrics determine whether those logos compound into durable enterprise value.
    diligencePath: Request renewal calendar, NRR by segment, churn by product line, and average contract term from customer ops.
    relatedQuestionRefs:
    - QU017
    - QU018
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-and-revenue-weighting
    missingEvidence: Top-customer revenue share, public-sector share, and partner-sourced revenue mix.
    whyItMatters: Without revenue weighting, a long logo list can hide concentration or margin exposure.
    diligencePath: Request top-20 customer revenue concentration, segment mix, and direct-versus-partner channel split.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU005
  - type: partial-enumeration
    severity: medium
    topic: marquee-logo-verification
    missingEvidence: Direct retained proof for Whirlpool and U.S. Air Force, and deeper first-party detail for Sanofi/LVMH.
    whyItMatters: The company likely has additional large customers, but the strongest public proof currently clusters around other named accounts.
    diligencePath: Request customer-reference list or permissioned reference calls covering unresolved marquee names.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU016
    relatedTableRefs:
    - TU003
    - TU006
