- id: adoption-trajectory-and-footprint
  title: Adoption trajectory and footprint
  body: Adoption is visible, but the top-line customer-count record is noisy. Ivalua says it serves hundreds of admired brands; MC Capital says more than 400 enterprises; and outside databases range from 226 customers to 571 verified companies to 12,406 companies worldwide. Those figures should not be treated as interchangeable, but they all point to meaningful installed-base scale. The case studies offer more useful trajectory signals than the directories do. City of New York reports a large supplier-onboarding footprint; Maryland highlights management of more than $7 billion in contracts; and Maxim emphasizes eight-week deployment velocity. Together, these examples suggest that adoption happens in sizable, operationally important environments where deployment success matters more than casual experimentation.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU011
  - CU014
  - CU016
  - CU033
  - CU036
