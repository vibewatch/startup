  - FU002
- id: retention-and-durability-visibility
  title: Retention and durability visibility
  body: 'Customer durability is where the public record gets weakest. There are many proof points that Ivalua wins and deploys complex accounts, but almost none that quantify how those accounts renew, expand, or churn. No retained source discloses NRR, GRR, cohort retention, average contract length, or revenue concentration. Even third-party review commentary provides more anecdotal use-case value than hard renewal metrics. The best positive inference is structural: once deployed into public-sector or enterprise procurement workflows, these systems are often sticky because they sit near contracts, suppliers, approvals, and invoice flows. But that structural stickiness remains a hypothesis until management discloses actual renewal behavior. For an investor, that means the next diligence step is customer-economics evidence, not more logo gathering.'
  claimRefs:
  - CU025
  - CU029
  - CU030
  - CU034
  - CU041
  tableRefs:
  - TU004
- id: expansion-concentration-and-verdict
  title: Expansion, concentration, and verdict
  body: The defensible customer verdict is positive on credibility and incomplete on economics. Public evidence supports that Ivalua can win large, compliance-sensitive organizations and that customers often adopt more than one workflow rather than a single point feature. Partner-involved stories such as Capgemini and Booz Allen also imply an ecosystem route into some complex accounts. What public evidence does not support is a precise read on concentration risk, partner dependence, or revenue-weighted expansion quality. The practical implication is that customer proof clears the bar for enterprise relevance, but not for a fully underwritten view of retention quality or mix risk. That is why customer quality here should be read as deployment credibility first and commercial durability only second.
  claimRefs:
  - CU018
  - CU019
