- id: switching-costs-and-distribution-power
  title: Switching costs and distribution power
  body: 'This market is sticky by design. Procurement platforms sit close to ERP data, supplier workflows, approvals, contracts, and invoice processes, so replacement or major migration usually carries real operational risk. CostBench makes that explicit for Coupa, arguing that enterprises often stay put because migration and integration costs can overwhelm savings. The same logic helps explain why ERP-native incumbents retain structural advantages: SAP and Oracle can sell procurement as an extension of an existing enterprise stack rather than a fresh cross-functional project. Tonkean''s guide to crowded orchestration tools and Ivalua''s own unified S2P positioning both point to the same buyer reality: multi-homing and coexistence are common, but clean rip-and-replace decisions are hard. That is why Ivalua''s flexibility matters. Its likely advantage is not owning the biggest installed base; it is giving buyers a credible path to modernize procurement without blindly inheriting every constraint
    of a single ERP vendor.'
  claimRefs:
  - CP022
  - CP035
  - CP036
  - CP037
  tableRefs:
  - TP004
- id: moat-durability-and-adverse-signals
  title: Moat durability and adverse signals
  body: 'The strongest positive read on Ivalua is that it remains in the top competitive set while addressing many industries and use cases with one unified platform. The strongest negative read is that almost every serious peer now markets AI, workflow coverage, analytics, and supplier-management depth, which compresses easy narrative differentiation. The commoditization risk is especially visible across Ivalua, Coupa, SAP, GEP, and Zycus, all of which now present AI or agentic procurement as table stakes. Review surfaces add another warning: SelectHub highlights Coupa customization and usability complaints, showing that scale does not eliminate implementation friction. But the bigger lesson for Ivalua is symmetric. If large incumbents can still frustrate users yet keep share because of distribution power, then Ivalua must prove it converts flexibility and usability into measurable win rates, not just better positioning copy. The missing public evidence is not feature lists; it is neutral
    proof on pricing discipline, trust posture, and actual competitive win-loss outcomes.'
  claimRefs:
  - CP026
  - CP033
  - CP034
  - CP036
  - CP037
  - CP038
  - CP040
