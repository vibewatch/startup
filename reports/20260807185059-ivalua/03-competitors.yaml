  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: Actual ACV bands, discounting behavior, and module-level pricing for Ivalua versus direct competitors.
    whyItMatters: Competitive positioning changes materially if Ivalua wins on value for money, not just feature fit, yet public quote data is sparse and noisy.
    diligencePath: Request win-loss pricing sheets and quote histories by segment from sales operations.
    relatedQuestionRefs:
    - QP015
    - QP016
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rates-by-segment
    missingEvidence: Independent win-loss data showing where Ivalua beats or loses to Coupa, SAP Ariba, Oracle, JAGGAER, GEP, or Zycus.
    whyItMatters: Feature narratives are useful, but moat underwriting ultimately depends on where buyers actually choose Ivalua in live evaluations.
    diligencePath: Review CRM-stage data, competitive battlecards, and reference calls segmented by vertical and ERP starting point.
    relatedQuestionRefs:
    - QP011
    - QP018
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: trust-and-regulatory-benchmarks
    missingEvidence: A neutral, source-backed comparison of security, uptime, regulatory posture, and implementation quality across the core peer set.
    whyItMatters: Trust and deployment risk can outweigh nominal feature parity in enterprise procurement purchases.
    diligencePath: Gather SOC/FedRAMP/ISO status, uptime history, and customer implementation references for each shortlisted competitor.
