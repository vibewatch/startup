  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The public source set supports a classic enterprise-procurement-software monetization model more than any
              exotic usage-based structure. Ivalua and Hg both describe the company as a cloud-based or AI-powered
              spend-management platform, and the source-to-pay product page shows a broad workflow footprint across
              intake, contracting, supplier management, and procure-to-pay. That kind of product architecture strongly
              suggests recurring enterprise software contracts as the core revenue engine, with implementation,
              integration, and support work as likely adjacent revenue lines. SelectHub reinforces that view by
              describing Ivalua as a subscription-style enterprise software product, while also acknowledging that
              pricing is typically custom. Directworks broadened the monetizable scope into direct-materials management,
              which matters because manufacturing-centric workflows often command deeper deployments and services work.
              The key limitation is that none of the retained official sources disclose module mix,
              software-versus-services split, or realized pricing. Investors therefore can describe the revenue model
              credibly at a high level, but cannot yet underwrite its quality or elasticity precisely from public
              evidence alone.
