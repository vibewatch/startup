    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation hinges on whether scale and customer proof outweigh opacity at the offered entry price.
    data:
      nodes:
        - id: n1
          label: Start with public scale proof
          detail: ARR/revenue proxies plus unicorn anchor
          tone: neutral
        - id: n2
          label: Test asset quality
          detail: Customers, product breadth, sponsor support
          tone: positive
        - id: n3
          label: Test opacity discount
          detail: Retention, margin, and 2024 terms missing
          tone: warning
        - id: n4
          label: Set entry band
          detail: Base case around 5x-7x credible ARR
          tone: neutral
        - id: n5
          label: Conditional interest
          detail: Engage only when price or diligence improves
          tone: positive
        - id: n6
          label: Pass / wait
          detail: If entry outruns proof
          tone: warning
      edges:
        - from: n1
          to: n2
          label: Scale is real
        - from: n2
          to: n3
          label: Quality still needs proof
        - from: n3
          to: n4
          label: Discount for uncertainty
        - from: n4
          to: n5
          label: Entry within discipline
        - from: n4
          to: n6
          label: Entry too rich
