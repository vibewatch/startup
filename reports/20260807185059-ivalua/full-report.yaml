      - number: '2.3'
        title: Buyer segments and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public product pages show that Ivalua is not targeting one monolithic buyer. Its public-sector page
              centers on compliance, continuity of service, and procurement modernization for government teams. Its
              manufacturing page emphasizes direct materials, supply-chain collaboration, and supplier complexity. Its
              healthcare page emphasizes resilience, cost pressure, and regulated supply continuity. Those use cases
              imply different buying centers and adoption paths even when the software brand is the same. Public-sector
              programs often need governance, transparency, and continuity first; manufacturing buyers need direct-spend
              depth and supplier collaboration; healthcare buyers need resilience and cost control under regulatory
              constraints. Across all three, the integration layer remains a core gating factor. Ivalua’s multi-ERP page
              explicitly markets fast coexistence with multiple back-end systems and says the platform has integrated
              with 60 unique ERPs and other systems. That is strategically important because enterprise procurement
              transformations often fail when buyers must replace core finance infrastructure all at once. The likely
              adoption path is therefore not “buy procurement software in the abstract,” but “solve governance,
              complexity, and visibility problems while fitting into the existing ERP estate.”
