            title: Big market, but not a free-pass TAM
            body: >-
              The retained evidence supports a real multi-billion-dollar procurement-software market, yet no public
              source isolates what share of that opportunity is realistically available to Ivalua by vertical, ERP
              environment, and budget owner.
            calloutType: insight
            claimRefs:
