      - number: '1.4'
        title: Adverse flags and open questions
        blocks:
          - type: paragraph
            body: >-
              The main caution flags at the overview stage are not existential red alerts; they are information-quality
              and operating-complexity issues that will echo through later chapters. First, the exact mark and structure
              of the December 2024 Hg transaction remain under-disclosed in the retained public source set, which
              weakens confidence in any current valuation claim. Second, scale proxies are visible but not audit-grade:
              GetLatka, Growjo, Tracxn, and Caplight help triangulate the business, yet they disagree on details or
              expose only partial fields. Third, the UpGuard vendor-risk page shows that externally observed security
              posture is respectable but not pristine, which is enough to treat cybersecurity hygiene as a diligence
              item rather than a closed box. Finally, governance transparency is incomplete because no retained source
              provides a full board roster, committee map, or sponsor-rights summary. None of these issues negate the
              thesis that Ivalua is a real, scaled category asset, but they do mean the later financial, risk, and
              valuation chapters should prefer corroborated ranges and explicit gaps over false precision.
