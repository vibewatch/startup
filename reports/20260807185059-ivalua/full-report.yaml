  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is straightforward. Ivalua appears to be a scaled procurement-software platform with
              broad source-to-pay workflow coverage, meaningful enterprise and public-sector customer proof, continued
              AI/product investment, and repeated institutional-capital validation. Those attributes are exactly what
              investors want in a private enterprise-software asset. The anti-thesis is equally clear: almost every
              number that would determine valuation confidence rather than valuation curiosity remains private or
              proxy-based. ARR, revenue, retention, margin, concentration, and sponsor-era terms are all either
              estimated or undisclosed. The right valuation posture therefore starts with recognizing that Ivalua is
              very likely valuable, but still not very cleanly priceable from public data alone.
            claimRefs:
              - CV011
              - CV021
