      - number: '7.4'
        title: Competition and model risk
        blocks:
          - type: paragraph
            body: >-
              Competition and model opacity form the financial downside case. Ivalua is not selling into a sleepy niche:
              Coupa, SAP Ariba, and GEP all compete for the same control point inside enterprise procurement and spend
              management. That means implementation pain, partner variance, or product reliability issues can become
              switching catalysts even in a sticky market. On the model side, sponsor backing reduces obvious short-term
              solvency anxiety, but public sources still do not expose burn, runway, leverage, customer concentration,
              or partner-sourced margin quality. Put differently, investors can see several things that lower
              risk—maturity, controls, customers, sponsor support—but still cannot see the variables that determine how
              much damage a bad quarter, failed deployment, or security incident would do to equity value. The
              public-sector examples from Maryland and New York also show that if a deployment fails, the blast radius
              can include large supplier networks and politically visible stakeholders.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR037
              - CR038
              - CR039
              - CR044
              - CR045
      - number: '7.5'
        title: Mitigations, triggers, and verdict
        blocks:
          - type: paragraph
            body: >-
              The risk verdict is manageable but not lightweight. Public mitigations exist: documented privacy and cloud
              terms, a reasonably detailed security whitepaper, external vendor-risk visibility, formal certification
              signals, and an ecosystem built to deliver complex accounts. Residual risk remains highest in places where
              public diligence stops: real production reliability, partner-performance variance, balance-sheet terms,
              and how customers behave when implementation or trust disappoints. The clearest thesis-break triggers are
              a material security or privacy event, evidence of repeated partner-led deployment failures, or proof that
              large regulated customers are harder to retain or expand than the case studies imply. Those are not exotic
              possibilities; they are the ordinary ways enterprise software stories weaken. Investors should therefore
              monitor not just bookings, but also external security-monitoring changes, implementation references, and
              any sign of document or control drift.
            claimRefs:
              - CR040
