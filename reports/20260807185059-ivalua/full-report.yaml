  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and control surface
        blocks:
          - type: paragraph
            body: >-
              The public legal surface is present but imperfect. Ivalua publishes a privacy policy, website terms, cloud
              terms for reseller end-customers, a security whitepaper, and a cloud-security control trail through ISO
              27001 and CSA STAR visibility. The whitepaper also makes clear that much of this material is informative
              rather than contractual, which matters because screening-level comfort is not the same as enforceable
              customer protection. A smaller but notable governance wrinkle is freshness: the website terms page shows a
              2021 update date while the company's public product story has moved into an AI-heavy 2026 posture. That
              does not prove a legal defect, but it is exactly the kind of document drift investors should flag when
              legal wrappers and product reality evolve at different speeds.
            claimRefs:
              - CR001
              - CR002
