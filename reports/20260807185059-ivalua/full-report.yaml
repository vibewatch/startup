        title: Moat durability and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The strongest positive read on Ivalua is that it remains in the top competitive set while addressing many
              industries and use cases with one unified platform. The strongest negative read is that almost every
              serious peer now markets AI, workflow coverage, analytics, and supplier-management depth, which compresses
              easy narrative differentiation. The commoditization risk is especially visible across Ivalua, Coupa, SAP,
              GEP, and Zycus, all of which now present AI or agentic procurement as table stakes. Review surfaces add
              another warning: SelectHub highlights Coupa customization and usability complaints, showing that scale
              does not eliminate implementation friction. But the bigger lesson for Ivalua is symmetric. If large
              incumbents can still frustrate users yet keep share because of distribution power, then Ivalua must prove
              it converts flexibility and usability into measurable win rates, not just better positioning copy. The
              missing public evidence is not feature lists; it is neutral proof on pricing discipline, trust posture,
