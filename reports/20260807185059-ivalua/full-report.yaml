        title: Customer-base segmentation
        blocks:
          - type: paragraph
            body: >-
              The visible customer set is broad by vertical and buyer complexity. Publicly retained proof spans
              public-sector procurement (Commonwealth of Virginia, Maryland, Arizona, BCLC, City of New York), financial
              services (Navy Federal), healthcare (Maxim), manufacturing and industrial complexity (Honeywell), retail
              and consumer categories (IKEA, likely LVMH via directory evidence), travel (Booking.com), and consulting
              or partner-led procurement transformation (Capgemini, Booz Allen). That mix matters because procurement
              software tends to be especially demanding in regulated, multi-stakeholder environments with heavy
              supplier, contract, and audit workloads. Ivalua's customer evidence therefore suggests fit with large,
              process-complex buyers more than with SMB or transactional self-serve segments. The caveat is that the
              public record exposes logos more clearly than revenue weighting. It also implies that Ivalua's
              go-to-market likely favors longer, more consultative sales cycles over lightweight transactional adoption.
