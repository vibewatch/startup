      - number: '3.3'
        title: Capabilities, pricing, and segment fit
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is no longer the easiest way to separate vendors, because nearly every retained
              competitor page claims some mix of sourcing, supplier management, contract workflows, analytics, and AI.
              What matters more is the shape of that breadth. Techno Pulse describes Ivalua as the most configurable
              option, Coupa as the fastest path to value, SAP Ariba as strongest for SAP ERP buyers, and JAGGAER as
              better suited to complex sourcing-heavy environments. SelectHub reinforces Ivalua's cross-industry reach
              and highlights customization, supplier management, contract management, and spend analysis as recurring
              strengths. Pricing clarity, however, remains poor across the field. CostBench says Coupa is still
              custom-quoted in 2026, Procurify says its own pricing is modular and custom-built, and SelectHub's Ivalua
              pricing estimate is best treated as third-party directional guidance rather than an official price list.
              That means buyers are often comparing architecture, workflow fit, and implementation burden before they
              can compare apples-to-apples commercial terms.
            claimRefs:
