      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing history gives one solid anchor and one frustratingly fuzzy one. The solid anchor is 2019,
              when Ardian and PR Newswire corroborated that Ivalua exceeded a $1 billion valuation in a $60 million
              round. The fuzzy anchor is 2024, when Hg and Agila entered the story but without public transaction
              economics. That means investors know Ivalua stayed financeable into the sponsor era, but do not know
              whether the latest terms imply a step-up, flat, or structured outcome. In that setting, entry discipline
              matters more than narrative enthusiasm. A disciplined buyer should not pay a full premium multiple simply
              because the company remained sponsor-attractive. It should pay up only when price and private diligence
              both support it.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV026
              - CV038
              - CV039
              - CV042
          - type: table
