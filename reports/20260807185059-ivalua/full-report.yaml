      - number: '3.2'
        title: Core suite peer profiles
        blocks:
          - type: paragraph
            body: >-
              The suite competitors each bring a different strategic center of gravity. Coupa emphasizes AI-native total
              spend management and broad cross-functional coverage. SAP Ariba emphasizes source-to-pay depth inside
              SAP-heavy environments, while Oracle positions procurement as a governed extension of the Oracle ERP
              estate. JAGGAER stays close to the request-to-payment and complex-sourcing problem, GEP emphasizes agentic
              orchestration, and Zycus leans into AI-powered source-to-pay and intake-to-outcomes positioning.
              Synertrade remains relevant enough to appear in Procurement Magazine's top-10 list, even though the
              retained source quality around its current positioning is thinner than for larger peers. On the Ivalua
              side, the company continues to frame itself as a unified source-to-pay platform and a 2026 Leader, which
              keeps it in the top competitive tier. But “top tier” does not mean “one-size-fits-all winner.” The
              practical takeaway is that buyers can rationally choose different winners depending on installed base,
              configuration tolerance, vertical complexity, and time-to-value.
