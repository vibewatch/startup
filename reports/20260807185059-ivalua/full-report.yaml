      - number: '7.3'
        title: Partner, dependency, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The operating model creates real dependency risk. A 100% partner-first strategy, services-heavy delivery
              motion, and broad ERP connectivity are all strengths when they work and risk multipliers when they do not.
              Partners expand implementation capacity and vertical reach, but they also make rollout quality partly
              contingent on third-party execution. The Integration Hub signal—more than 60 ERP systems and real-time,
              bidirectional connectivity—shows why customers buy the platform, yet it also implies a large maintenance
              and edge-case burden across customer environments. Sponsor dependency matters too. Hg and Agila validate
              access to sophisticated capital, but the 2024 transaction terms remain opaque. The right way to read this
              is not “dependency equals fragility,” but rather “dependency equals residual execution and governance
              exposure that public materials cannot close out.”
