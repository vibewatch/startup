            title: The 2024 sponsor terms are the single biggest valuation blind spot
            body: >-
              Without the real terms of the Hg/Agila-era transaction, investors cannot know whether a headline valuation
              translates into attractive new-money economics.
            calloutType: risk
            claimRefs:
