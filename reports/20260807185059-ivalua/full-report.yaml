      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is most acute where the product becomes business-critical: large public-sector or
              regulated procurement environments, deep ERP integrations, supplier-facing workflows, and AI-assisted
              decisions that could create user-trust issues if they fail. Ivalua's retained whitepaper is directionally
              reassuring because it describes logical single tenancy, dedicated customer app and database sets,
              HTTPS/TLS connectivity, and a menu of controls including encryption, disaster recovery, business
              continuity, SSO, two-factor authentication, logging, and penetration testing. External monitoring from
              Nudge Security and UpGuard adds a second layer of scrutiny. But none of those public signals substitute
              for real outage history, incident response data, or customer-specific control attestations. In practical
              terms, the company appears security-conscious, yet still exposed to the standard enterprise-SaaS downside
              that one material control or reliability failure can reverberate across customers, renewals, and valuation
              quickly.
            claimRefs:
