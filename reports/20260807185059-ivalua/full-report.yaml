            body: >-
              Most of the metrics an investor would actually want for underwriting remain private. No retained public
              source discloses gross margin, CAC, payback, NRR, churn, services mix, burn, or runway. The most
              supportable inferences are qualitative: product breadth plus multiple AI releases imply ongoing R&D
              expense; the historical marketing and product leadership hires imply deliberate go-to-market and product
              investment during scale-up; and the UpGuard page suggests trust and security are an ongoing operating-cost
              line rather than a one-time compliance checkbox. Growjo's estimated revenue per employee offers one
              possible efficiency proxy, but it is too model-driven to treat as a hard unit-economics fact. This leaves
              a familiar private-software pattern: outside investors can see that the company is big enough to matter
              and funded enough to keep operating, but they cannot verify how much of each dollar of ARR turns into
              gross profit or free cash flow. That gap is not fatal, but it is exactly why later valuation work must
