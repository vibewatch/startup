        title: Exhibits
        blocks:
          - type: callout
            title: Conditional interest, not unconditional conviction
            body: >-
              Ivalua looks strong enough to stay on the board, but only a disciplined entry price or stronger private
              metrics should turn it into a yes.
            calloutType: recommendation
            claimRefs:
              - CV031
