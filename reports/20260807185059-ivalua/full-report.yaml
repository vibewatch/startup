  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The first analytical task is to draw the market boundary correctly. Ivalua’s own source-to-pay page
              defines the category as one unified platform across intake, source-to-contract, supplier management, and
              procure-to-pay. MarkWide Research describes a very similar integrated suite, extending from requisitioning
              and supplier discovery through invoices and payments. That framing is narrower than the full
              procurement-software market, which analyst firms use to include adjacent modules such as contract
              management, spend analytics, procurement automation, and sometimes broader workflow tooling. The
              distinction matters because a company can be a leader in the source-to-pay suite layer without owning
              every procurement-adjacent budget line. The substitute set is also important. Tonkean’s 2026 orchestration
              guide says the market is crowded because many enterprises still run fragmented procurement environments,
              which means Ivalua competes not only against other suites but also against ERP-native procurement modules,
              point solutions, and status-quo manual processes stitched together across multiple systems. Market
              definition therefore needs two nested lenses: a broad procurement-software TAM and a narrower
              source-to-pay / procure-to-pay core where Ivalua’s product is most directly relevant.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
