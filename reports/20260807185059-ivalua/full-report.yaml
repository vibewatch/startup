      - number: '3.4'
        title: Switching costs and distribution power
        blocks:
          - type: paragraph
            body: >-
              This market is sticky by design. Procurement platforms sit close to ERP data, supplier workflows,
              approvals, contracts, and invoice processes, so replacement or major migration usually carries real
              operational risk. CostBench makes that explicit for Coupa, arguing that enterprises often stay put because
              migration and integration costs can overwhelm savings. The same logic helps explain why ERP-native
              incumbents retain structural advantages: SAP and Oracle can sell procurement as an extension of an
              existing enterprise stack rather than a fresh cross-functional project. Tonkean's guide to crowded
              orchestration tools and Ivalua's own unified S2P positioning both point to the same buyer reality:
              multi-homing and coexistence are common, but clean rip-and-replace decisions are hard. That is why
