      - number: '1.2'
        title: Leadership, governance, and capital history
        blocks:
          - type: paragraph
            body: >-
              Open-source governance visibility is thinner than the product marketing, but the visible record is still
              enough to ground later diligence. The leadership page emphasizes a seasoned executive bench, while dated
              press releases show concrete operating hires such as Alex Saric as CMO in 2017 and Pascal Bensoussan as
              CPO in 2019. Those moves suggest deliberate investment in both commercial scale-up and product leadership
              around the same period that institutional capital accelerated. Capital history is the clearest part of the
              overview. Ivalua’s own 2017 release says KKR invested $70 million, and the 2019 Ardian and PR Newswire
              releases corroborate a further $60 million round at a valuation above $1 billion with Tiger Global joining
              and Ardian increasing its stake. By 2026 Hg’s portfolio page confirms that Hg is now an owner and
              describes Ivalua as a leading AI-powered spend-management provider. What remains opaque is the exact
              current board composition, sponsor control rights, and the precise mark or terms associated with the 2024
              Hg transaction. That opacity matters because private-equity ownership can materially shape exit timing,
              leverage tolerance, and disclosure discipline even when the business itself is healthy.
