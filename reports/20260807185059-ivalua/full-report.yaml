chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Ivalua presents itself as a unified procurement platform rather than a narrow point solution. The official
              about, why-Ivalua, and procurement-platform pages consistently frame the product around one connected
              source-to-pay environment that manages spend, suppliers, analytics, automation, and AI workflows on a
              single stack. That matters because the company is not selling just e-procurement or invoice automation; it
              is selling a broader operating layer for procurement teams that want one system of record across supplier
              and spend processes. Public company-profile pages reinforce that same identity from a third-party angle,
              describing Ivalua as a cloud-based provider of spend, procurement, and supplier-management software
              founded in 2000. Location is more nuanced than a one-line U.S.-only label: the offices page clearly
              anchors the Americas headquarters in Redwood City, while French legal records and funding announcements
              preserve the company’s French origin story and corporate footprint. The right working description for
              later chapters is therefore a late-stage private, cross-Atlantic procurement-software platform with a
              unified architecture and global delivery presence.
