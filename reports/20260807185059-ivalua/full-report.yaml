  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Ivalua does not compete in a simple two-vendor market. Gartner-style messaging, rankings, and peer-review
              surfaces all point to a layered field: core suite peers such as Coupa, SAP Ariba, Oracle, JAGGAER, GEP,
              Zycus, and Synertrade; orchestration or best-of-breed challengers; and lighter substitutes that solve
              narrower spend-control problems. Procurement Magazine explicitly describes the market as shifting toward
              modular, API-driven ecosystems that pressure legacy suites, while its top-10 S2P ranking shows how many
              serious vendors buyers can plausibly shortlist. Gartner Peer Insights reinforces the same point by
              presenting a broad alternatives set around Ivalua rather than a single obvious rival. The right frame is
              therefore a crowded category where the competitive problem is not just feature parity. It is deciding
              whether a buyer wants ERP gravity, best-of-breed workflow depth, AI-led experimentation, or a lighter
              procurement-control layer.
            claimRefs:
