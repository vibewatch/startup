companyProfile:
  summary: >-
    Ivalua is a private procurement-software company founded in 2000 with French roots and an Americas headquarters in
    Redwood City. The company sells a unified source-to-pay platform that spans sourcing, contract lifecycle management,
    supplier management, intake, spend analysis, and procure-to-pay workflows, and public customer proof shows adoption
    across large enterprises and public-sector buyers. Public evidence supports meaningful scale and continued sponsor
    interest, but the current economic profile remains only partially visible through third-party estimates and
    selective company disclosures.
  foundedDate: '2000-01-01'
  foundingLocation: France
  headquarters: Redwood City, California, United States
  productSummary: >-
    Ivalua positions itself as a unified source-to-pay platform covering intake, source-to-contract, supplier
    management, sourcing, spend analysis, risk, and procure-to-pay, with embedded AI and partner-led implementation
    support.
  customerFocus: >-
    Large enterprises and public-sector organizations seeking broad procurement transformation, supplier collaboration,
    and spend-control workflows across direct and indirect spend.
  businessModel: >-
    Custom-quoted enterprise software subscriptions anchored in broad procurement workflow coverage, supplemented by
    implementation, integration, training, and partner-delivered services; exact software-versus-services mix and
