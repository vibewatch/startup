      - number: '2.2'
        title: Market sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The retained analyst sources support a clear conclusion that procurement software is a large, growing
              category, but they do not support false precision. Mordor Intelligence projects the market at USD 10.74
              billion in 2026, up from USD 9.81 billion in 2025, and sees expansion to USD 17.11 billion by 2031 at a
              9.76% CAGR. Fortune Business Insights is slightly lower at USD 9.88 billion in 2026 after an USD 8.89
              billion 2025 base, while Global Market Insights is lower still at USD 8.6 billion in 2026 from USD 8.1
              billion in 2025. The Business Research Company and IMARC both reinforce the direction of travel even
              though the accessible excerpts are less directly useful for a clean point estimate. The narrower
              procure-to-pay subsegment is also material: 6Wresearch estimates it at about USD 5.2 billion in 2025 and
              USD 10.4 billion by 2032 at an 11.0% CAGR. The honest way to use these reports is as a range, not a single
              anchor. Taken together, the retained sources imply a 2026 procurement-software TAM band of about USD 8.6
              billion to USD 10.74 billion, with the narrower P2P / S2P layer still multi-billion-dollar in scale.
