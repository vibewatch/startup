            claimRefs:
              - CV031
              - CV038
              - CV039
      - number: '8.3'
        title: Bull, base, and bear valuation logic
        blocks:
          - type: paragraph
            body: >-
              The cleanest public way to value Ivalua is by triangulating between three imperfect frames: proxy ARR,
              public software multiples, and procurement-software transaction precedent. The public-software median in
              July 2026 is too low for a scaled enterprise-procurement platform with customer proof and product breadth,
              while Coupa's take-private multiple is too generous to apply wholesale to a smaller and less transparent
              asset. That leaves a middle band. A defensible base case is roughly 5x to 7x credible ARR, which yields
              about $765 million to $1.07 billion on the $153 million ARR proxy. A bear case of 3x to 5x ARR captures
              the downside if the growth proxies flatter reality or if sponsor terms, retention, or margin quality
              disappoint. A bull case of 7x to 9x ARR reaches roughly $1.07 billion to $1.38 billion, but really needs
              private confirmation that the quality-of-revenue picture is stronger than the public record shows.
            claimRefs:
              - CV001
