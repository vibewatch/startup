callouts:
  - calloutType: strength
    title: Commercial signal is stronger than financial transparency
    body: >-
      The assigned source set gives Outrider a credible commercialization narrative:
      disclosed late-stage funding, pilot history, technology packaging detail, and a
      five-year YMX operating partnership. What it does not yet provide is the
      financial and governance transparency an investor would need to convert that
      narrative into a fully underwritten valuation view.
    claimRefs: [CO007, CO008, CO011, CO012, CO014]
  - calloutType: risk
    title: Adoption and diligence risk are both still real
    body: >-
      Even the most informative independent operating article in the pool flags higher
      upfront EV costs as a barrier for smaller operators, while the wider public record
      still omits valuation, revenue, headcount, and board composition. That means the
      risk is not only execution in the yard, but also incomplete diligence visibility.
    claimRefs: [CO013, CO014]
