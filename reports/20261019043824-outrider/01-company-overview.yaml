company:
  name: Outrider
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Outrider remains a private, post-Series D autonomous yard-operations company whose
    public narrative is strongest on product positioning, commercialization milestones,
    and strategic financing rather than on current financial disclosure. The reviewed
    evidence supports a Colorado-founded business model built around subscription
    autonomous electric yard operations, a 2024 $62 million Series D that brought
    disclosed equity capital to roughly $250 million-plus, and a 2026 five-year YMX
    channel partnership, but it does not surface a current valuation mark, revenue,
    headcount, board composition, or named-customer count.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      The reviewed public evidence still frames Outrider as a specialist in autonomous
      yard operations for logistics hubs rather than as a general-purpose autonomous
      trucking company. On its homepage, the company emphasizes efficiency, safety, and
      sustainability, while third-party coverage describes a system that combines
      management software, autonomous electric yard trucks, and yard infrastructure.
      By 2025-2026 coverage, Outrider was presenting the offer as a subscription
      service that includes the autonomy stack, cloud-based management software,
      automated trailer inventory tracking, and remote support. That combination makes
      the core business model legible enough for later chapters, but several basic
      profile facts remain thinner than ideal for underwriting: the reviewed sources do
      not reconfirm an exact headquarters city, public pricing architecture, current
      customer count, or any audited financial baseline.
    claimRefs: [CO001, CO002, CO011, CO014]
    tableRefs: [TO001]
  - id: leadership-capital-and-stakeholders
    title: Leadership, capital, and stakeholder picture
    body: >-
      The most stable leadership signal across the assigned evidence is founder Andrew
      Smith, who is tied to Outrider's 2017 formation and still appears as CEO in 2026
      commercialization coverage. The chapter pool also identifies Ira Renfrew as Chief
      Product Officer and Bob Hall as Chief Operating Officer, but those role reads come
      from point-in-time public mentions rather than a current leadership page or board
      roster. Capital formation is clearer than governance: public 2024 financing
      coverage reported a $62 million Series D led by Koch Disruptive Technologies and
      NEA, with a broader syndicate that included 8VC, ARK Invest, NVentures, Prologis
      Ventures, and others, taking total disclosed equity capital to roughly $250
      million-plus. What remains missing is the control layer a diligence team would
      want next: cap-table terms, any post-Series-D valuation reset, and board or
      committee composition.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO008, CO014]
    tableRefs: [TO002, TO003]
  - id: commercialization-milestones-and-constraints
    title: Commercial milestones and execution constraints
    body: >-
      The milestone record is more concrete on commercialization progress than on
      current economic scale. Outrider-linked coverage says customers representing over
      20 percent of North American yard trucks had been involved in testing and pilots
      since 2019, and Ouster later described a next-generation autonomy kit informed by
      more than 12,000 autonomous trailer moves. In 2025-2026, the product narrative
      shifted from technical promise toward deployment readiness: coverage cited
      subscription packaging, select enterprise deployments, and a non-exclusive,
      five-year YMX partnership under which YMX finances and operates fleets for large
      shippers. The main caution from the assigned evidence is not technological
      failure, but adoption friction and disclosure thinness: FreightWaves noted EV
      upfront cost barriers for smaller operators, and the public record here still
      lacks valuation, revenue, headcount, and governance detail.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
