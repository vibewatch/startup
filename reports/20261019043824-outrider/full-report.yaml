    Autonomous yard automation for moving trailers and containers inside logistics yards, packaged with management
    software, remote monitoring, and deployment support.
  customerFocus: Enterprise shippers and logistics hubs
  businessModel: Turnkey autonomous yard operations delivered through enterprise deployments and partner-led operating support.
  stage: Private growth-stage
