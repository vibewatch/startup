      - number: '5.4'
        title: Differentiation, trust controls, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Outrider’s public differentiation case rests on being purpose-built for yard operations rather than
              adapting on-road AV stacks to depots. The supporting evidence points to a mixed-traffic safety system,
              robotic trailer-line handling, electric-platform standardization, and a turnkey deployment path through
              partners such as YMX and suppliers such as Ouster. That is a credible product thesis, and YMX explicitly
              cites safety and operational maturity as selection criteria. Still, the same public record is noticeably
              thinner on topics an investor would want before underwriting scale: site-level uptime, exception handling,
              incident rates, cyber/privacy controls, and independent developer or practitioner signal. The chapter
              therefore supports technical credibility, but not yet fully transparent operating proof.
