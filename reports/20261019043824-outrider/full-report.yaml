      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: YMX adds a real distribution channel, not just another logo
            body: >-
              The five-year YMX agreement matters because YMX is taking on implementation, financing, fleet operations,
              and on-site support, which can reduce deployment friction for enterprise shippers that prefer managed
              service over building their own autonomy operating model.
            calloutType: strength
            claimRefs:
