  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently defines Outrider around logistics-yard execution rather than over-the-road
              autonomy. Tracxn describes an integrated system for automating yard operations at logistics hubs, while
              YMX and AJOT describe a workflow that combines yard-management software, self-driving electric yard
              trucks, and site support to automate trailer and container movements. The operative job-to-be-done is
              trailer spotting and yard orchestration inside distribution and manufacturing hubs: moving trailers
              between parking spots and dock doors, tracking trailer inventory, and coordinating those moves with
              existing yard, warehouse, and transportation systems. That boundary matters because it excludes generic
              warehouse software, long-haul autonomous trucking, and broad freight-tech spend that may share AI or
              logistics themes but do not solve the same yard workflow. Public expansion comments point to future rail-
              and port-terminal use cases, but those appear adjacent to, not yet inside, Outrider's currently evidenced
              commercial core.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
