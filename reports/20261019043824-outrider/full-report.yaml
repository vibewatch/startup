      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The source set does not expose a clean public TAM, SAM, or SOM in dollars, so the most supportable sizing
              uses operational pain and installed-base proxies instead of a single broad market estimate. Ouster's case
              study quantifies the underlying bottleneck as more than 10 million combined days of unnecessary idling
              time per year at distribution centers and says that improving turnaround time by 10 minutes per truck
              could create more than 1 million days of additional transport time. Separately, company-linked 2024-2026
              sources say Outrider's customers represent over 20% of all yard trucks operating in North America, which
              indicates the company is already selling into a meaningful slice of the relevant installed base even
              though it does not reveal site counts, contract values, or spend density by vertical. Those proxies make
              the market worth diligence, but they are not substitutes for a spend-based market model.
            claimRefs:
              - CM004
              - CM005
              - CM012
              - CM014
