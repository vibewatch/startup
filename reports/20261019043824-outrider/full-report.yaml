  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              The current risk stack is led by partner-mediated rollout concentration rather than pure technical
              novelty. Outrider's five-year, non-exclusive YMX relationship now bundles implementation, fleet financing,
              on-site operations, and customer change management into one channel motion, which can accelerate adoption
              but also raises single-partner execution dependence. The second major risk is evidence quality: public
              disclosures show traction, funding, and safety positioning, yet they do not provide a standardized time
              series for uptime, interventions, incident rates, or paid production throughput. Third is capital
              intensity. Public funding evidence confirms a large capital base, but not whether that capital is
              sufficient to scale hundreds of systems without further dilution or margin pressure.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR010
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and safety visibility
        blocks:
          - type: paragraph
            body: >-
              The public safety narrative is stronger than the public legal-and-regulatory record. Outrider's sources
              describe a purpose-built safety architecture, a TÜV SÜD alignment view, and a large internal
              hazard-analysis program, all of which reduce the chance that the company is operating without a structured
              safety case. That said, the assigned evidence does not surface site-by-site approvals, privacy controls,
              cybersecurity attestations, incident disclosures, recalls, or litigation history. For underwriting, that
              means the regulatory and legal burden is not disproven; it is simply undisclosed in the current source set
              and must be closed through diligence rather than assumed away.
            claimRefs:
              - CR003
              - CR004
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR013
      - number: '7.3'
        title: Operational and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Operationally, Outrider still depends on a multi-party stack working in harsh yard environments. The
              public materials show third-party vehicle sourcing, Ouster lidar, NVIDIA compute, approved autonomy
              hardware, and partner-reviewed safety-critical components, which together create supplier, qualification,
              and lead-time exposure even if no single component has publicly failed. Public traction metrics also need
              normalization: one source highlights more than 12,000 autonomous trailer moves for the next-generation
              kit, while another reports more than 100,000 moves across deployments and the test site. That directional
              progress is useful, but it is not yet a consistent operating KPI set for underwriting field reliability,
              conversion from pilot to paid production, or service quality at scaled customer sites.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Mitigations, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The mitigation story is credible only if it becomes inspectable. Evidence today supports asking for the
              executed YMX agreement, site-level KPI packs, the current safety case, incident logs, and the 2026-2027
              capital plan before treating the company as scale-ready. Practical kill criteria follow from those gaps:
              if scaled deployments remain tied to one financing-and-operations partner, if no normalized uptime and
              incident series is produced, if legal/privacy controls remain opaque, or if further capital is needed
              before unit economics stabilize, the investment thesis should be treated as unproven even if the core
              technology continues to advance.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR010
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel concentration is the clearest near-term execution risk
            body: >-
              YMX can reduce adoption friction by financing and operating fleets, but the same public structure
              concentrates rollout timing, service quality, and customer change management into one partner-led motion.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR016
          - type: callout
            title: Safety messaging is ahead of public operating evidence
            body: >-
              Public materials describe a serious safety program and third-party alignment, yet the current source set
              still lacks standardized uptime, intervention, incident, and approval evidence by live customer site.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR013
          - type: callout
            title: Diligence must move from narrative to inspectable proof
            body: >-
              Underwriting should stay conditional on receiving the YMX agreement, site-level KPI packs, the safety
              case, compliance artifacts, and a current capital plan rather than relying on directional traction claims
              alone.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR007
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context without a price anchor
        blocks:
          - type: paragraph
            body: >-
              The current public financing record shows real investor support, but not a usable price anchor. FundedIQ
              tracks two disclosed rounds on record, with the latest a $62.0 million Series D in October 2024 and $135
              million raised across those recorded rounds. TechFundingNews and Orrick both frame the same Series D as
              taking cumulative equity raised to roughly $250 million or more. That directional consistency is enough to
              say Outrider remains well-funded by venture standards, but the mismatch across public sources means the
              chapter cannot treat cumulative capital as a precise underwriting input. The assigned pool also still
              provides no disclosed valuation, share price, liquidation preference stack, or secondary mark, so entry
              discipline has to stay tied to future pricing evidence rather than a modeled fair-value range.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
      - number: '8.2'
        title: Why the company is investable but not yet underwritable
        blocks:
          - type: paragraph
            body: >-
              The bullish side of the case is tangible. AJOT and UniteAI describe a five-year YMX partnership in which
              YMX finances and operates fleets, lowering deployment friction for enterprise shippers and giving Outrider
              a service-led route to expansion. UniteAI also reports a subscription model that bundles the autonomy
              stack, cloud software, inventory tracking, and 24/7 support, which is structurally better aligned with
              recurring value creation than one-off hardware sales. Ouster adds proof-of-performance claims from more
              than 12,000 autonomous trailer moves and reported improvements in operating cost and emissions. The
              bearish side is just as important: FreightWaves notes Outrider depends on third-party electric trucks and
              that higher EV upfront cost can still slow adoption, especially outside large enterprise yards. Because
              the available public evidence proves technical and channel momentum more clearly than it proves durable
              economics or valuation, the scenarios remain qualitative and the right call is to wait for price-bearing
              evidence.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV016
      - number: '8.3'
        title: Diligence asks that could move the call
        blocks:
          - type: paragraph
            body: >-
              The valuation decision can still move, but only if future diligence closes a short list of price-sensitive
              gaps. First, management or lead investors need to disclose a current valuation reference - a new priced
              round, audited secondary trade, or board mark - because the assigned record only supports financing
              history, not ownership economics. Second, commercialization needs operating evidence: recurring revenue,
              gross margin, deployment count by site, renewal behavior, and customer concentration. Third, a full cap
              table needs to reconcile the public total-raised mismatch and show whether recent capital came with senior
              preferences, debt-like protections, or other downside asymmetries. Until those asks are answered, the
              thesis can merit monitoring, but not a valuation-sensitive buy or track-at-price decision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Recommendation: research-more. Public evidence shows real technical and channel momentum, but not a usable
              price anchor for an investor deciding whether today's entry would be attractive, fair, or stretched.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              The valuation case worsens quickly if 2026-2027 commercialization requires structured capital, a flat/down
              round, or customer financing support that fails to offset EV adoption friction.
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV013
              - CV016
