      - number: '3.3'
        title: 'Durability and displacement risk: execution depth is real, but public benchmarking is still thin'
        blocks:
          - type: paragraph
            body: >-
              Outrider's moat looks execution-heavy rather than purely algorithmic. In the assigned evidence, maturity
              signals include more than 100,000 autonomous trailer moves, a next-generation kit shaped by more than
              12,000 autonomous trailer moves in customer and test environments, and a TÜV SÜD-reviewed
              functional-safety approach. Partner and company-linked materials also point to EV economics and
              operational gains, including claims around lower operating costs, lower emissions, and charge patterns
              that can sustain long yard-duty cycles. Those signals support the idea that Outrider is ahead of a generic
              software-only solution on physical execution. But the same pool also shows how that lead could compress:
              the YMX agreement is non-exclusive, public pricing is still opaque, and adjacent yard-service or terminal
              ecosystems are already combining electrification, services, and OEM partnerships. That means the
              defensible edge today is the integrated deployment package, not proof that the market will remain
              winner-take-most around one autonomy stack.
