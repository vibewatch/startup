companyProfile:
  summary: >-
    Outrider builds an autonomous yard-operations system for logistics hubs, combining self-driving electric yard
    trucks, management software, trailer inventory visibility, and deployment support to automate trailer spotting in
    mixed-traffic distribution yards. The public record points to a partner-led commercial model and a safety-oriented
    operating architecture, but site-level reliability, pricing, and customer concentration remain underdisclosed.
  headquarters: Golden, Colorado, United States
