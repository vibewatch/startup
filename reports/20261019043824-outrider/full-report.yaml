      - number: '1.2'
        title: Leadership, capital, and stakeholder picture
        blocks:
          - type: paragraph
            body: >-
              The most stable leadership signal across the assigned evidence is founder Andrew Smith, who is tied to
              Outrider's 2017 formation and still appears as CEO in 2026 commercialization coverage. The chapter pool
              also identifies Ira Renfrew as Chief Product Officer and Bob Hall as Chief Operating Officer, but those
              role reads come from point-in-time public mentions rather than a current leadership page or board roster.
              Capital formation is clearer than governance: public 2024 financing coverage reported a $62 million Series
              D led by Koch Disruptive Technologies and NEA, with a broader syndicate that included 8VC, ARK Invest,
              NVentures, Prologis Ventures, and others, taking total disclosed equity capital to roughly $250
              million-plus. What remains missing is the control layer a diligence team would want next: cap-table terms,
              any post-Series-D valuation reset, and board or committee composition.
