      - number: '6.3'
        title: Durability, expansion, and concentration still require diligence
        blocks:
          - type: paragraph
            body: >-
              The YMX relationship is the clearest public durability signal because it is explicitly five years long and
              tied to implementation, fleet operations, and support responsibilities, but it is still non-exclusive and
              does not disclose committed site counts, minimum volumes, or customer economics. Public retention evidence
              otherwise remains thin: none of the reviewed sources disclosed NRR, GRR, churn, renewal rates, or
              site-level expansion cohorts, and the widely cited ">20% of yard trucks" footprint claim does not reveal
              how many accounts, sites, or top customers drive that share. A skeptical note in Forbes also highlighted
              that some leadership claims could be disputed by other yard-autonomy vendors, reinforcing that investors
              still need direct customer reference calls and cohort data before treating the current public record as
              proof of durable, concentrated-attractive adoption.
            claimRefs:
              - CU002
              - CU009
              - CU011
              - CU012
