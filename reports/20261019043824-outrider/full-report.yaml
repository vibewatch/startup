      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The public record points to a relatively specific buying motion. End users are yard operators and site
              teams who need trailers moved safely and predictably, but the economic buyer is more likely an enterprise
              logistics, yard-operations, distribution, or supply-chain executive who can approve a multi-site
              operational change. YMX's 2026 partnership is especially informative because it reframes adoption as a
              turnkey managed-service path: YMX leads implementations, finances and operates fleets, and provides
              on-site support, while Outrider provides deployment support and remote technical monitoring. That
              structure suggests the market is most ready where the buyer can justify safety, throughput,
              labor-efficiency, and electrification benefits across large yards without building an in-house autonomy
              program. The named initial sectors — food and beverage, retail, consumer packaged goods, and automotive —
              all fit that enterprise-yard profile.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption drivers are concrete, not abstract: distribution-center idling waste,
              enterprise pressure for safer repetitive-work automation, and the pairing of electrification with yard
              productivity. FreightWaves reported founder claims that the electric trucks used in Outrider's system can
              run 21 hours per day on a two- or three-hour charge and that charging costs are materially below diesel,
              while Ouster's case study cites 12,000 autonomous trailer moves plus operating-cost and emissions
              improvements. At the same time, the sources also show why underwriting remains difficult. Outrider's
              public materials emphasize deployment support, remote monitoring, site planning, and financing help, which
              implies the product still carries implementation complexity and capital-orchestration needs that many
              buyers will not absorb alone. FreightWaves also reported that capacity for 2025 deployments remained
              constrained while Outrider accepted orders for 2026 and 2027, indicating that supplier capacity and
              validation sequencing can pace adoption even when demand exists. More importantly, public evidence still
              does not isolate pricing, ROI payback, site counts, or spend-based segmentation by vertical, so the timing
              and depth of adoption have to be inferred rather than measured directly.
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is operationally gated, not just demand gated
            body: >-
              Managed implementation, fleet financing, on-site support, remote monitoring, and constrained near-term
              deployment capacity all indicate that sales interest does not translate immediately into activated sites.
              Underwriting should separate customer demand from supplier and partner capacity until deployment-cycle and
              backlog data are available.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Solution landscape: the real alternative set is broader than direct autonomy peers'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a broad competitive frame rather than a clean public roster of named
              startup-vs-startup peers. Outrider is selling a full yard-operations system for logistics hubs, with
              autonomous electric yard trucks, trailer inventory tracking, charge-status monitoring, cloud management
              software, and integrations into yard, warehouse, and transportation management systems. That puts its
              practical alternatives into multiple buckets: staying with manual diesel spotting, improving dispatch and
              visibility through software-led orchestration without a robotic execution layer, asking an in-house team
              to stitch together electric trucks, infrastructure, and site rules, or buying a more turnkey
              managed-service offer. Because the current pool does not provide apples-to-apples public benchmarks
              against a broad named peer set, the most defensible comparison is by buyer job-to-be-done and deployment
              burden rather than by startup logo wall.
            claimRefs:
