        title: Workflow coverage and commercial surface
        blocks:
          - type: paragraph
            body: >-
              Outrider is not just pitching autonomy middleware; the public record describes a bundled yard-operations
              product that automates trailer and container movements inside distribution yards and layers management
              software, inventory visibility, and operational support around that core motion workflow. The most
              concrete commercial packaging in the assigned evidence is the subscription-style Outrider System described
              in 2025-2026 rollout materials, where autonomy software, real-time trailer tracking, and ongoing support
              are sold as one operational service. That matters because the buyer problem is labor-constrained trailer
              spotting and yard throughput, not abstract AV capability, and it means diligence should focus on
              deployment economics, support burden, and workflow exceptions as much as on autonomy accuracy.
