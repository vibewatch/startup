  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The reviewed public evidence still frames Outrider as a specialist in autonomous yard operations for
              logistics hubs rather than as a general-purpose autonomous trucking company. On its homepage, the company
              emphasizes efficiency, safety, and sustainability, while third-party coverage describes a system that
              combines management software, autonomous electric yard trucks, and yard infrastructure. By 2025-2026
              coverage, Outrider was presenting the offer as a subscription service that includes the autonomy stack,
              cloud-based management software, automated trailer inventory tracking, and remote support. That
              combination makes the core business model legible enough for later chapters, but several basic profile
              facts remain thinner than ideal for underwriting: the reviewed sources do not reconfirm an exact
              headquarters city, public pricing architecture, current customer count, or any audited financial baseline.
