      - number: '4.3'
        title: Capital adequacy is supported by funding history but still dependent on private metrics
        blocks:
          - type: paragraph
            body: >-
              The strongest financing fact in the public record is the October 2024 Series D, which added $62 million
              and brought disclosed equity funding to more than $250 million. Management and advisors positioned that
              capital as fuel for scaling autonomous yard operations as a service to hundreds of systems and additional
              use cases, while 2025 and 2026 coverage shows the commercial model is still capacity-constrained enough
              that orders were being pushed into 2026 and 2027 and partner financing was used to lower customer adoption
              friction. That combination can be read two ways: the company has enough external backing to keep building,
              but it may also need meaningful working capital, deployment support, and channel assistance to convert
              pilots into scaled fleets. Because no current public source discloses cash on hand, burn, runway, debt
              obligations, or next-round trigger metrics, the capital story is directionally positive but not
              underwritable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Outrider's public financial profile looks more credible than many physical autonomy startups because the
              company has continued to raise capital, package the offering as recurring service revenue, and recruit
              channel partners willing to finance and operate fleets. The problem is that nearly every number that would
              turn that narrative into an investable model is still private: realized pricing, deployment gross margin,
              customer concentration, renewal behavior, sales efficiency, cash burn, and runway. The available evidence
              supports a thesis that revenue quality could become attractive if utilization is high and partner-led
              deployment keeps customer acquisition capital-light, but today the chapter's answer is still "research
              more" because the public record shows commercial momentum without disclosing the economics required to
              underwrite margin path or financing dependency.
            claimRefs:
              - CI004
              - CI006
