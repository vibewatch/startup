      - number: '4.2'
        title: Public unit-economics signals are customer-ROI proxies, not vendor margin proof
        blocks:
          - type: paragraph
            body: >-
              Outrider has published enough operating evidence to show why buyers may care, but not enough financial
              evidence to prove software economics. Partner materials claim a 40% reduction in traditional operating
              costs, a 50x improvement in cost efficiency relative to remote driving, and lower total cost of ownership
              than diesel only in medium- to high-utilization settings. Those datapoints are useful because they
              identify the margin thesis buyers will test: utilization, labor replacement, uptime, and electric-vehicle
              operating cost advantages. They do not establish Outrider's own gross margin, service burden, installation
              cost, or payback period, especially because the company still has to support complex yard integrations,
              robotic brake-line connections, and ongoing remote monitoring. Public traction disclosures likewise
              emphasize deployment evidence such as vehicle purchases and autonomous trailer moves rather than ARR or
              recognized revenue.
            claimRefs:
              - CI007
              - CI008
