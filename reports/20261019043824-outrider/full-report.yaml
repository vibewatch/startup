  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Commercial segments and buyer motion
        blocks:
          - type: paragraph
            body: >-
              Public customer evidence points to a narrow but coherent commercial target: large logistics-dependent
              enterprises running complex yards, plus intermediaries that can operationalize the system on their behalf.
              Outrider's historical positioning emphasized a supply-chain software-and-automation platform rather than a
              general trucking product, while 2024-2026 commercialization sources repeatedly tied the offer to package
              shipping, retail, eCommerce, consumer packaged goods, automotive, and food-and-beverage yards. The YMX
              agreement materially changes the buying motion because it adds implementation, financing, and on-site
              operations to Outrider's subscription software-and-autonomy stack, creating a lower-friction path for
              shippers that want outcomes but may not want to staff autonomous-yard operations themselves.
