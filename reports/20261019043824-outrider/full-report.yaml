      - number: '3.2'
        title: 'Distribution and deployment: YMX makes the offer more turnkey, but not exclusive'
        blocks:
          - type: paragraph
            body: >-
              The October 2026 YMX relationship materially changes how Outrider can be bought and deployed. The
              partnership is a five-year, non-exclusive commercial agreement in which YMX finances fleets, leads
              implementations, operates vehicles, and provides on-site support, while Outrider supports deployments,
              remote monitoring, and technical operations. That matters competitively because the hardest substitution
              threat to an autonomy vendor is often not another model stack, but an easier procurement path. In the
              assigned pool, YMX is the clearest evidence-backed answer to that problem: it reduces the amount of site
              planning, fleet financing, operating-process redesign, and change-management work that an enterprise
              shipper would otherwise have to coordinate internally. At the same time, the agreement does not lock YMX
              to Outrider, so the channel strengthens distribution power without creating exclusivity.
            claimRefs:
