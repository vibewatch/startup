  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture and what is actually disclosed
        blocks:
          - type: paragraph
            body: >-
              The clearest public revenue signal is not a posted price card but a packaging description. FreightWaves
              reported that Outrider sells a subscription bundle including the autonomy stack, cloud-based management
              software, automated trailer inventory tracking, and 24/7 support, while the 2026 YMX partnership shows
              that deployment can also be wrapped inside a managed-service structure where YMX finances and operates
              fleets and charges customers on a capacity basis rather than an hourly basis. That combination implies a
              recurring software-and-service model with an optional partner-financed operating layer, not a simple
              hardware resale model. What remains missing is the commercial detail that matters for underwriting: list
              versus realized pricing, contract term, implementation fees, channel economics, revenue recognition
              boundaries between hardware and service, and whether partner-led deployments dilute or improve gross
              margin.
