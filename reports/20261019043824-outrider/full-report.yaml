      - number: '1.3'
        title: Commercial milestones and execution constraints
        blocks:
          - type: paragraph
            body: >-
              The milestone record is more concrete on commercialization progress than on current economic scale.
              Outrider-linked coverage says customers representing over 20 percent of North American yard trucks had
              been involved in testing and pilots since 2019, and Ouster later described a next-generation autonomy kit
              informed by more than 12,000 autonomous trailer moves. In 2025-2026, the product narrative shifted from
              technical promise toward deployment readiness: coverage cited subscription packaging, select enterprise
              deployments, and a non-exclusive, five-year YMX partnership under which YMX finances and operates fleets
              for large shippers. The main caution from the assigned evidence is not technological failure, but adoption
              friction and disclosure thinness: FreightWaves noted EV upfront cost barriers for smaller operators, and
              the public record here still lacks valuation, revenue, headcount, and governance detail.
