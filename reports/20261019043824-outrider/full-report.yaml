      - number: '6.2'
        title: Adoption proof is meaningful, but still mixed between pilots and scale-up claims
        blocks:
          - type: paragraph
            body: >-
              The chapter's public proof of adoption is stronger than a logo wall but still short of a broad named
              production roster. Outrider had a named Georgia-Pacific pilot and four additional Fortune 200 pilot
              programs by 2020, which established early customer demand but not durable rollout. Later sources show
              progressively stronger operational evidence: a 2024 funding article cited more than 100,000 autonomous
              trailer moves across customer deployments and a test site, Ouster's case study cited more than 12,000
              autonomous trailer moves at customer sites and Outrider's testing facility, and 2025-2026 sources
              described select enterprise deployments plus the opening of 2026-2027 order books. Those data points imply
              real field usage, but each mixes different denominators, time windows, or production states, so they
              should be read as directional commercialization proof rather than a clean cohort of paying production
              sites.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
