  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a sequence from commercialization proof to valuation uncertainty rather than from
      company quality alone.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: $62M Series D and evidence of enterprise customer activity
        - id: channel
          label: Channel leverage
          detail: YMX will finance, operate, and support fleets under a five-year deal
        - id: operating-proof
          label: Operating proof
          detail: Ouster cites 12,000+ autonomous trailer moves plus cost and emissions gains
        - id: adoption-friction
          label: Adoption friction
          detail: Higher EV upfront costs and third-party vehicle dependence can slow rollout
        - id: valuation-gap
          label: Valuation gap
          detail: No public valuation mark, cap-table terms, revenue, or margin disclosure
        - id: call
          label: Recommendation
          detail: research-more until a price-bearing financing or audited mark appears
      edges:
        - from: scale-proof
          to: channel
          relationship: commercialization route
        - from: channel
          to: operating-proof
          relationship: proof of scaled deployment matters next
        - from: operating-proof
          to: adoption-friction
          relationship: traction still meets execution risk
        - from: adoption-friction
          to: valuation-gap
          relationship: risk without economics blocks underwriting
        - from: valuation-gap
          to: call
          relationship: price-sensitive decision
    approximationNotes: This figure is directional logic, not a weighted scoring model or implied valuation calculation.
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV016
