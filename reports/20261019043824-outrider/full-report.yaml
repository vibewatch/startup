      - number: '5.3'
        title: Deployment maturity and operating model
        blocks:
          - type: paragraph
            body: >-
              Outrider has more public maturity evidence than many autonomy startups, but most of it is still company-
              or partner-mediated rather than independently benchmarked. The clearest support comes from partner
              documentation that says the current autonomy kit reflects more than 12,000 autonomous trailer moves at
              customer sites and a test facility, plus media coverage and financing materials that describe multi-year
              customer pilots, Fortune 500 yard data, and a five-year commercial rollout with YMX. The YMX structure is
              important operationally because it splits responsibilities: YMX handles financing, fleet operations,
              on-site support, and implementation, while Outrider supplies the autonomy system, remote monitoring, and
              technical support. That lowers adoption friction for shippers but also means execution quality depends on
              channel partners and site services, not on autonomy software alone.
