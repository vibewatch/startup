    claimRefs: [CR002, CR007, CR008, CR010, CR011, CR013, CR014, CR016]
callouts:
  - calloutType: risk
    title: Channel concentration is the clearest near-term execution risk
    body: >-
      YMX can reduce adoption friction by financing and operating fleets, but the same public
      structure concentrates rollout timing, service quality, and customer change management into
      one partner-led motion.
    claimRefs: [CR001, CR002, CR016]
  - calloutType: risk
    title: Safety messaging is ahead of public operating evidence
    body: >-
      Public materials describe a serious safety program and third-party alignment, yet the
      current source set still lacks standardized uptime, intervention, incident, and approval
      evidence by live customer site.
    claimRefs: [CR003, CR004, CR007, CR013]
  - calloutType: recommendation
    title: Diligence must move from narrative to inspectable proof
    body: >-
      Underwriting should stay conditional on receiving the YMX agreement, site-level KPI packs,
      the safety case, compliance artifacts, and a current capital plan rather than relying on
      directional traction claims alone.
    claimRefs: [CR002, CR007, CR010, CR013]
