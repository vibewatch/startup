company:
  name: Outrider
chapter:
  number: 7
  title: Risks
  summary: >-
    Outrider's highest underwriteable risks are partner-mediated deployment concentration,
    incomplete public proof on operating reliability and legal/compliance controls, and the
    capital intensity required to scale autonomous yard operations beyond pilots. The assigned
    source set shows real commercial momentum and a credible safety narrative, but it still
    leaves several thesis-break questions open unless investors can inspect site-level metrics,
    partner contracts, and compliance records directly.
sections:
  - id: ranked-risk-landscape
    title: Ranked risk landscape
    body: >-
      The current risk stack is led by partner-mediated rollout concentration rather than pure
      technical novelty. Outrider's five-year, non-exclusive YMX relationship now bundles
      implementation, fleet financing, on-site operations, and customer change management into
      one channel motion, which can accelerate adoption but also raises single-partner execution
      dependence. The second major risk is evidence quality: public disclosures show traction,
      funding, and safety positioning, yet they do not provide a standardized time series for
      uptime, interventions, incident rates, or paid production throughput. Third is capital
      intensity. Public funding evidence confirms a large capital base, but not whether that
      capital is sufficient to scale hundreds of systems without further dilution or margin
      pressure.
    claimRefs: [CR001, CR002, CR007, CR010, CR013, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-and-safety
    title: Regulatory, legal, and safety visibility
    body: >-
      The public safety narrative is stronger than the public legal-and-regulatory record.
      Outrider's sources describe a purpose-built safety architecture, a TÜV SÜD alignment view,
      and a large internal hazard-analysis program, all of which reduce the chance that the
      company is operating without a structured safety case. That said, the assigned evidence
      does not surface site-by-site approvals, privacy controls, cybersecurity attestations,
      incident disclosures, recalls, or litigation history. For underwriting, that means the
      regulatory and legal burden is not disproven; it is simply undisclosed in the current
      source set and must be closed through diligence rather than assumed away.
    claimRefs: [CR003, CR004, CR013]
    tableRefs: [TR001]
  - id: operational-and-partner-dependencies
    title: Operational and partner dependencies
    body: >-
      Operationally, Outrider still depends on a multi-party stack working in harsh yard
      environments. The public materials show third-party vehicle sourcing, Ouster lidar,
      NVIDIA compute, approved autonomy hardware, and partner-reviewed safety-critical
      components, which together create supplier, qualification, and lead-time exposure even if
      no single component has publicly failed. Public traction metrics also need normalization:
      one source highlights more than 12,000 autonomous trailer moves for the next-generation
      kit, while another reports more than 100,000 moves across deployments and the test site.
      That directional progress is useful, but it is not yet a consistent operating KPI set for
      underwriting field reliability, conversion from pilot to paid production, or service
      quality at scaled customer sites.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR015]
    tableRefs: [TR002, TR003]
  - id: mitigations-kill-criteria-and-diligence
    title: Mitigations, kill criteria, and diligence asks
    body: >-
      The mitigation story is credible only if it becomes inspectable. Evidence today supports
      asking for the executed YMX agreement, site-level KPI packs, the current safety case,
      incident logs, and the 2026-2027 capital plan before treating the company as scale-ready.
      Practical kill criteria follow from those gaps: if scaled deployments remain tied to one
      financing-and-operations partner, if no normalized uptime and incident series is produced,
      if legal/privacy controls remain opaque, or if further capital is needed before unit
      economics stabilize, the investment thesis should be treated as unproven even if the core
      technology continues to advance.
    claimRefs: [CR002, CR003, CR007, CR010, CR013, CR016]
