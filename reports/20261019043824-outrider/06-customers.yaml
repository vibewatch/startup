company:
  name: "Outrider"
chapter:
  number: 6
  title: "Customers"
  summary: "Outrider's strongest public customer signal is the October 2026 YMX agreement, which adds a five-year managed-service channel for enterprise shippers and names initial verticals for rollout. Adoption proof is real but still uneven: public evidence spans Georgia-Pacific pilots, select enterprise deployments, and large move-count claims, while retention, concentration, and broad production-customer disclosure remain largely private."
sections:
  - id: "commercial-segments"
    title: "Commercial segments and buyer motion"
    body: |-
      Public customer evidence points to a narrow but coherent commercial target: large logistics-dependent enterprises running complex yards, plus intermediaries that can operationalize the system on their behalf. Outrider's historical positioning emphasized a supply-chain software-and-automation platform rather than a general trucking product, while 2024-2026 commercialization sources repeatedly tied the offer to package shipping, retail, eCommerce, consumer packaged goods, automotive, and food-and-beverage yards. The YMX agreement materially changes the buying motion because it adds implementation, financing, and on-site operations to Outrider's subscription software-and-autonomy stack, creating a lower-friction path for shippers that want outcomes but may not want to staff autonomous-yard operations themselves.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU010", "CU014"]
    tableRefs: ["TU001"]
  - id: "adoption-proof"
    title: "Adoption proof is meaningful, but still mixed between pilots and scale-up claims"
    body: |-
      The chapter's public proof of adoption is stronger than a logo wall but still short of a broad named production roster. Outrider had a named Georgia-Pacific pilot and four additional Fortune 200 pilot programs by 2020, which established early customer demand but not durable rollout. Later sources show progressively stronger operational evidence: a 2024 funding article cited more than 100,000 autonomous trailer moves across customer deployments and a test site, Ouster's case study cited more than 12,000 autonomous trailer moves at customer sites and Outrider's testing facility, and 2025-2026 sources described select enterprise deployments plus the opening of 2026-2027 order books. Those data points imply real field usage, but each mixes different denominators, time windows, or production states, so they should be read as directional commercialization proof rather than a clean cohort of paying production sites.
    claimRefs: ["CU005", "CU006", "CU007", "CU008", "CU009", "CU012"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-and-concentration"
    title: "Durability, expansion, and concentration still require diligence"
    body: |-
      The YMX relationship is the clearest public durability signal because it is explicitly five years long and tied to implementation, fleet operations, and support responsibilities, but it is still non-exclusive and does not disclose committed site counts, minimum volumes, or customer economics. Public retention evidence otherwise remains thin: none of the reviewed sources disclosed NRR, GRR, churn, renewal rates, or site-level expansion cohorts, and the widely cited ">20% of yard trucks" footprint claim does not reveal how many accounts, sites, or top customers drive that share. A skeptical note in Forbes also highlighted that some leadership claims could be disputed by other yard-autonomy vendors, reinforcing that investors still need direct customer reference calls and cohort data before treating the current public record as proof of durable, concentrated-attractive adoption.
    claimRefs: ["CU002", "CU009", "CU011", "CU012", "CU013"]
    figureRefs: ["FU001"]
