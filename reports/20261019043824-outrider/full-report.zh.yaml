      - number: '3.2'
        title: 分销与部署：YMX 让方案更端到端，但并不独家
        blocks:
          - type: paragraph
            body: >-
              2026 年 10 月的 YMX 关系实质性改变了 Outrider 的采购和部署方式。这是一项为期 five-year、非独家的商业协议： YMX 为车队融资、主导实施、运营车辆并提供现场支持；Outrider
              则支持部署、远程监控和技术运营。 这在竞争上很重要，因为自动驾驶供应商最难应对的替代威胁往往不是另一套模型技术栈，而是更容易的采购路径。 在现有来源中，YMX
              是这一问题最清晰、由证据支持的答案：它减少了企业货主本来需要内部协调的现场规划、车队融资、运营流程重设计和变革管理工作。 但协议没有将 YMX 锁定在 Outrider
              上，因此渠道提升了分销能力，却没有带来独家性。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
