  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与待完成任务
        blocks:
          - type: paragraph
            body: >-
              公开证据始终围绕物流场站执行来界定 Outrider，而不是公路自动驾驶。Tracxn 将其描述为一套在物流枢纽自动化场站运营的集成系统； YMX 和 AJOT
              则描述了结合场站管理软件、自动驾驶电动场内牵引车和现场支持的工作流，用于自动完成拖车和集装箱移动。 它要解决的核心任务，是在配送和制造枢纽内完成拖车定位和场站编排：在停车位与装卸门之间移动拖车、追踪拖车库存，
              并将这些移动与现有场站、仓库和运输系统协调起来。这个边界排除了通用仓库软件、长途自动驾驶卡车，以及可能共享 AI 或物流主题但不解决同一场站工作流的广义货运科技支出。
              公开扩张评论提到未来的铁路和港口码头场景，但这些仍是相邻用途，尚未进入 Outrider 当前已有证据支持的商业核心。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
