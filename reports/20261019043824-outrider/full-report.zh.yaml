      - number: '3.3'
        title: 持久性与替代风险：执行深度确实存在，但公开基准仍薄弱
        blocks:
          - type: paragraph
            body: >-
              Outrider 的护城河更像执行能力，而不只是算法能力。现有证据中的成熟度信号包括超过 100,000 次自动拖车移动、 一套受客户和测试环境中超过 12,000 次自动拖车移动影响的新一代套件，以及经 TÜV
              SÜD 审查的功能安全方案。 合作伙伴和公司相关材料还指向 EV 经济性和运营收益，其中包括关于更低运营成本、更低排放，以及能够支撑长时间场内作业周期的充电模式的主张。 这些信号支持 Outrider
              在实体执行上领先于通用纯软件方案。但同一来源池也显示，这一领先可能收窄： YMX 协议非独家，公开定价仍不透明，相邻的场站服务或码头生态已经在组合电气化、服务和 OEM 合作。
              因此，今天更有防守力的是集成部署方案，而不是市场会长期围绕某一自动驾驶技术栈形成赢家通吃。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
