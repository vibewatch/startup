          - type: callout
            title: 论点破坏触发器
            body: 如果 2026-2027 年商业化需要结构化资本、平价或下行融资轮，或需要客户融资支持而这些支持又无法抵消 EV 采用摩擦，估值逻辑会迅速恶化。
            calloutType: risk
            claimRefs:
