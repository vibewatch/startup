      - CU005
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 这是对指定公开证据集中四项最直接影响投资判断的问题所做的定性剩余风险评估。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 合作伙伴主导的推出集中度
          note: 在旗舰公开渠道模式中，YMX 目前负责融资、实施和现场运营。
          values:
            - 高
            - 高
            - 中
        - label: 运营 KPI 披露缺口
          note: 公开声称的移动次数和结果颇具潜力，但标准化程度仍不足以纳入投资判断。
          values:
            - 高
            - 高
            - 低
        - label: 单位经济性正常化前的资本密集度
          note: 公开融资总额较大，但现金续航和利润率进展仍属非公开信息。
          values:
            - 中
            - 高
            - 中
        - label: 监管与法律透明度缺口
          note: 安全叙事可见，但审批、隐私控制和法律历史并不公开。
          values:
            - 中
            - 高
            - 低
        - label: 对供应商技术栈的依赖
          note: 第三方卡车、激光雷达、计算资源和获批准硬件都必须持续保持资质并可供使用。
          values:
            - 高
            - 中
            - 中
        - label: 人才与变革管理拖累
          note: 即使产品有效，专业自动驾驶人才招聘和受人员流失影响的客户推出节奏也可能拖慢规模化。
          values:
            - 中
            - 中
            - 中
    approximationNotes: 对引用主张的序数综合，不是统计模型；该矩阵总结了来源所述缓释措施实施后的剩余投资判断风险敞口。
    claimRefs:
      - CR002
      - CR007
      - CR008
      - CR010
      - CR011
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐结论遵循从商业化证明到估值不确定性的路径，而不是只看公司质量。
    data:
      nodes:
        - id: scale-proof
          label: 规模化证明
          detail: $62M D 轮融资，以及企业客户活动证据
        - id: channel
          label: 渠道杠杆
          detail: 根据一项五年协议，YMX 将为车队提供融资、负责运营并提供支持
        - id: operating-proof
          label: 运营证明
          detail: Ouster 援引 12,000+ 次自动驾驶拖车移动，以及成本和减排收益
        - id: adoption-friction
          label: 采用阻力
          detail: 更高的 EV 前期成本和对第三方车辆的依赖可能拖慢推出
        - id: valuation-gap
          label: 估值缺口
          detail: 没有公开估值、优先股堆叠、收入或利润率披露
        - id: call
          label: 推荐
          detail: 在出现带价格信息的融资或经审计的估值之前，继续研究
      edges:
        - from: scale-proof
          to: channel
          relationship: 商业化路径
        - from: channel
          to: operating-proof
          relationship: 下一步关键是证明部署已规模化
        - from: operating-proof
          to: adoption-friction
          relationship: 市场进展仍伴随执行风险
        - from: adoption-friction
          to: valuation-gap
          relationship: 缺乏经济性数据的风险会阻碍投资判断
        - from: valuation-gap
          to: call
          relationship: 对价格敏感的决策
    approximationNotes: 该图展示方向性逻辑，不是加权评分模型，也不代表隐含估值计算。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV016
