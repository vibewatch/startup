            body: >-
              经审阅的公开证据仍将 Outrider 定位为物流枢纽自动化场站运营的专业公司，而非通用自动驾驶卡车公司。
              公司官网强调效率、安全和可持续性；第三方报道则描述了一套由管理软件、自动驾驶电动场内牵引车和场站基础设施组成的系统。 2025-2026 年的报道显示，Outrider
              将产品包装成订阅服务，包含自动驾驶技术栈、云端管理软件、自动拖车库存追踪和远程支持。 这套组合足以让后续章节看清核心商业模式，但若要用于投资评估，几个基本画像仍不够完整：经审阅来源没有重新确认准确的总部城市、
              公开定价架构、当前客户数或经审计的财务基线。
