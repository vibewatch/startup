      - number: '2.4'
        title: 增长驱动、约束与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的公开采用驱动因素很具体：配送中心怠速浪费、企业对更安全的重复性工作自动化的压力，以及电气化与场站生产率的结合。 FreightWaves 报道创始人称，Outrider 系统使用的电动卡车每天可运行 21
              hours，充电需要 two- or three-hour，且充电成本明显低于柴油； Ouster 案例研究则引用了 12,000
              次自动拖车移动以及运营成本和排放改善。与此同时，来源也解释了为什么投资评估仍然困难。 Outrider
              公开材料强调部署支持、远程监控、现场规划和融资协助，说明产品仍有不少实施复杂度和资本协调需求，许多买方不会独自承担。 FreightWaves 还报道，2025 年部署产能仍受限，而 Outrider 已接受
              2026 和 2027 年订单，说明即使需求存在，供应商产能和验证节奏也可能决定采用速度。 更重要的是，公开证据仍未拆分定价、ROI
              回本期、站点数或按垂直行业划分的支出，因此采用的时点和深度只能推断，不能直接测量。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 采用受运营能力约束，而不只是需求约束
            body: 托管实施、车队融资、现场支持、远程监控和近期部署产能受限，都说明销售兴趣不会立即转化为已激活站点。 在获得部署周期和积压订单数据前，投资评估应把客户需求与供应商及合作伙伴产能分开。
            calloutType: risk
            claimRefs:
