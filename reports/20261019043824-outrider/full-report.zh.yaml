              当前风险堆栈首先是合作伙伴主导的推广集中度，而不是纯粹的技术新颖性。Outrider 与 YMX 为期 five-year、非独家的关系，
              将实施、车队融资、现场运营和客户变革管理捆绑到一个渠道动作中；这可以加速采用，但也提高了对单一伙伴执行力的依赖。 第二大风险是证据质量：公开披露展示了 traction、融资和安全定位，却没有提供
