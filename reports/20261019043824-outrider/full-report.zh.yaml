      - number: '1.3'
        title: 商业化里程碑与执行约束
        blocks:
          - type: paragraph
            body: >-
              里程碑记录对商业化进展的描述，比对当前经济规模的描述更具体。Outrider 相关报道称，自 2019 年以来，代表北美超过 20 percent 场内牵引车的客户参与了测试和试点； Ouster
              后来则介绍了一套受超过 12,000 次自动拖车移动经验影响的新一代自动驾驶套件。2025-2026 年，产品叙事从技术愿景转向部署准备度： 报道提到订阅式包装、部分企业部署，以及一项非独家、为期
              five-year 的 YMX 合作，由 YMX 为大型货主融资并运营车队。 现有证据的主要谨慎点不是技术失败，而是采用摩擦和披露不足：FreightWaves 指出 EV 对小型运营商的前期成本障碍，
              而这里的公开记录仍缺少估值、收入、员工数和治理细节。
