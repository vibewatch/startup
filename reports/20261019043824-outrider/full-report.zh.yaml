      - number: '8.3'
        title: 可能改变判断的尽调问题
        blocks:
          - type: paragraph
            body: >-
              估值判断仍可能改变，但前提是未来尽调补齐一份短名单中的价格敏感缺口。首先，管理层或领投方需要披露当前估值参照——新的定价轮、经审计的二级交易或董事会估值——
              因为现有记录只支持融资历史，不支持所有权经济性。其次，商业化需要运营证据：经常性收入、毛利率、按站点统计的部署数量、续约行为和客户集中度。
              第三，完整股权结构表需要调和公开累计融资不一致，并显示近期资本是否带有高级优先权、类债保护或其他下行不对称。 在这些问题得到回答前，逻辑可以值得持续跟踪，但还不足以做出对估值敏感的买入或按价格跟踪决定。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV013
              - CV016
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的判断
            body: 建议：继续研究。公开证据显示真实的技术和渠道动能，但没有可用的价格锚点，无法判断今天入场对投资者而言是有吸引力、合理还是过高。
            calloutType: recommendation
            claimRefs:
