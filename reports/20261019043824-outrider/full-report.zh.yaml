      - number: '4.2'
        title: 公开单位经济信号是客户 ROI 代理，而不是供应商利润率证明
        blocks:
          - type: paragraph
            body: >-
              Outrider 已发布足够的运营证据，说明买方为什么可能关心这套方案，但财务证据仍不足以证明软件经济性。 合作伙伴材料称，传统运营成本可下降 40%，相对于远程驾驶的成本效率可提高
              50x；但只有在中高利用率场景下，总拥有成本才低于柴油。 这些数据点有用，因为它们指出买方会检验的利润逻辑：利用率、劳动力替代、正常运行时间和电动车运营成本优势。 它们不能证明 Outrider
              自身的毛利率、服务负担、安装成本或回本期，尤其是公司仍需支持复杂的场站集成、机器人制动管路连接和持续远程监控。 公开 traction 披露同样强调车辆采购和自动拖车移动等部署证据，而不是 ARR 或已确认收入。
            claimRefs:
              - CI007
              - CI008
