      - number: '2.3'
        title: 买方、使用者、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开记录指向一套相对明确的采购动作。最终使用者是需要安全、可预测地移动拖车的场站运营人员和现场团队； 但经济买方更可能是能够批准多站点运营变革的企业物流、场站运营、配送或供应链负责人。YMX 2026
              年合作尤其具有说明性， 因为它将采用路径重构为端到端托管服务：YMX 主导实施，为车队融资并运营车队，同时提供现场支持；Outrider 提供部署支持和远程技术监控。
              因此，最容易启动采用的是这样一类买方：它能在大型场站同时验证安全、吞吐量、劳动力效率和电气化收益，又不必自建自动驾驶项目。 首批点名的行业——食品饮料、零售、消费包装品和汽车——都符合这一企业场站画像。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
