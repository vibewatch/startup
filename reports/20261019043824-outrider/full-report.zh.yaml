    summary: 公开记录的 Outrider 技术栈覆盖客户系统软件、自动驾驶编排、车辆工作流自动化，以及合作伙伴提供的传感和计算硬件。
    data:
      layers:
        - label: 客户系统与控制平面
          items:
            - label: 云端管理软件
            - label: 拖车库存跟踪
            - label: YMS / WMS / TMS 集成
          outputs:
            - label: Workflow visibility for yard operations
            - label: Dispatch and inventory coordination
        - label: 自动驾驶编排
          items:
            - label: AI 驱动的感知软件
            - label: 驾驶与任务编排
            - label: 远程监控和 24/7 技术支持
          outputs:
            - label: Mixed-traffic trailer moves
            - label: Human-like responses to yard actors
        - label: 车辆工作流自动化
          items:
            - label: 自动驾驶电动场站卡车
            - label: 挂接 / 脱挂和倒车工作流
            - label: TrailerConnect 机器人管线处理
          outputs:
            - label: Dock-door positioning
            - label: Trailer and container movement
        - label: 远程运营与支持
          items:
            - label: 远程监控
            - label: 技术支持
            - label: 场站规划与部署支持
          outputs:
            - label: Fleet health oversight
            - label: Escalation path for live-site issues
        - label: 安全控制层
          items:
            - label: 冗余危险检测
            - label: 故障安全硬件冗余
            - label: 实时健康监控
          outputs:
            - label: Driverless-operation safety case
            - label: Controlled stop behavior
        - label: 传感器与合作伙伴硬件层
          items:
            - label: Ouster 数字激光雷达
            - label: 雷达和摄像头
            - label: NVIDIA DRIVE 计算
          modules:
            - label: 获批准的 EV 场站卡车平台
            - label: RH Sheppard 和 Yaskawa 安全关键部件
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，公司正从直接企业试点推进到经由 YMX 的托管服务扩张，但留存和集中度检查点仍属非公开信息。
    data:
      items:
        - label: 发现问题
          actor: 企业货主或场站运营负责人
          phase: 需求定义
          touchpoints:
            - 人工且危险的拖车调度和库存任务
            - 对安全性、吞吐量和减排收益的兴趣
        - label: 试点验证
          actor: Georgia-Pacific 及其他早期《财富》200 强运营商
          phase: 试点
          touchpoints:
            - 指定场站试点项目
            - 聚焦安全、效率和生产力的参考案例证据
        - label: 运营证据
          actor: Outrider 及合作伙伴
          phase: 可重复性证明
          touchpoints:
            - '>12,000 次客户场站及测试设施的自动驾驶拖车移动'
            - '>100,000 次部署及测试场地移动'
        - label: 无人驾驶部署准备度
          actor: 部分企业客户
          phase: 早期生产
          touchpoints:
            - 2025 年下半年最新一代部署目标
            - 2026-2027 年订单接收
        - label: 托管服务推出
          actor: YMX Logistics
          phase: 商业扩张
          touchpoints:
            - 实施、融资、车队运营和现场支持
            - 五年非独家渠道协议
        - label: 多场站扩张检查
          actor: 投资者尽调
          phase: 持续性测试
          touchpoints:
            - 需要披露 NRR、流失率、场站数量和集中度
            - 除合作伙伴已宣布的使用案例外，还需要直接客户背书
    claimRefs:
