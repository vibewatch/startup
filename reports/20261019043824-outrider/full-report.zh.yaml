            body: >-
              在现有证据中，最稳定的管理层信号是创始人 Andrew Smith：他与 Outrider 2017 年成立有关，并在 2026 年商业化报道中仍以 CEO 身份出现。 本章来源还将 Ira Renfrew 列为
