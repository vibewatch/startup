          - type: paragraph
            body: >-
              当前公开融资记录显示真实的投资者支持，但没有可用的价格锚点。FundedIQ 记录了两轮已披露融资，最新一轮是 2024 年 10 月的 $62.0 million Series D， 这两轮合计融资 $135
              million。TechFundingNews 和 Orrick 都将同一轮 Series D 描述为使累计股权融资达到约 $250 million 或更多。 这一方向一致性足以说明，按风险投资标准看
              Outrider 资金充足；但公开来源之间的差异意味着，本章不能把累计资本当作精确的投资评估输入。
              现有来源池也没有披露估值、每股价格、优先股堆叠或二级市场估值，因此入场纪律必须绑定未来定价证据，而不是模型化的公允价值区间。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
      - number: '8.2'
        title: 为什么公司值得投资关注，但尚不足以进行估值判断
        blocks:
          - type: paragraph
            body: >-
              看多逻辑是具体的。AJOT 和 UniteAI 描述了一项为期 five-year 的 YMX 合作，由 YMX 为车队融资并运营车队，降低企业货主的部署摩擦， 也为 Outrider
              提供服务主导的扩张路径。UniteAI 还报道了一种订阅模式，将自动驾驶技术栈、云软件、库存追踪和 24/7 支持打包， 其结构比一次性硬件销售更贴近经常性价值创造。Ouster 则提供了超过 12,000
              次自动拖车移动以及运营成本和排放改善的表现证明主张。 看空逻辑同样重要：FreightWaves 指出 Outrider 依赖第三方电动卡车，而 EV 较高的前期成本仍可能拖慢采用，尤其是在大型企业场站之外。
              由于现有公开证据对技术和渠道动能的证明强于对持久经济性或估值的证明，情景分析仍只能定性，正确做法是等待能够承载价格判断的证据。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
