      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              来源集没有披露以美元计的清晰公开 TAM、SAM 或 SOM，因此最有支撑的规模判断应使用运营痛点和存量基础代理指标， 而不是单一的宽泛市场估计。Ouster 案例研究将底层瓶颈量化为配送中心每年合计超过 10
              million 天的不必要怠速时间， 并称每辆卡车周转时间改善 10 minutes，可能带来超过 1 million 天的额外运输时间。另一方面，与公司相关的 2024-2026 年来源称， Outrider
              客户覆盖北美运营场内牵引车的 20% 以上，说明公司已在相关存量基础中销售到有意义的一部分，尽管没有披露站点数、合同金额或各垂直行业的支出密度。 这些代理指标足以说明市场值得尽调，但不能替代基于支出的市场模型。
