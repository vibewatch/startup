              Outrider 拥有比许多自动驾驶初创公司更多的公开成熟度证据，但其中大部分仍由公司或合作伙伴提供，尚未经过独立基准验证。 最明确的支撑来自合作伙伴文件：当前自动驾驶套件已在客户站点和测试设施完成超过
              12,000 次自动拖车移动； 媒体报道和融资材料还描述了多年客户试点、Fortune 500 场站数据，以及与 YMX 为期 five-year 的商业化推广。 YMX
              架构在运营上很重要，因为它拆分了责任：YMX 负责融资、车队运营、现场支持和实施，Outrider 提供自动驾驶系统、远程监控和技术支持。
              这降低了货主的采用摩擦，但也意味着执行质量取决于渠道伙伴和现场服务，而不只是自动驾驶软件。
