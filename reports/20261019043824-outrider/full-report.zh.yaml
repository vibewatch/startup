  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流覆盖与商业化边界
        blocks:
          - type: paragraph
            body: >-
              Outrider 不只是销售自动驾驶中间件；公开记录描述的是一套打包的场站运营产品，在配送场站内自动完成拖车和集装箱移动，
              并围绕这一核心移动工作流叠加管理软件、库存可视性和运营支持。现有证据中最具体的商业包装，是 2025-2026 年推广材料所称的订阅式 Outrider System，
              其中自动驾驶软件、实时拖车追踪和持续支持作为一项运营服务出售。这里的买方问题是劳动力受限下的拖车定位和场站吞吐，而不是抽象的 AV 能力；
              因此尽调应同样关注部署经济性、支持负担和工作流例外，而不能只看自动驾驶准确率。
