  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 解决方案版图：真正的替代集合比直接自动驾驶竞品更广
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是宽泛的竞争框架，而不是一份清晰的公开初创公司竞品名单。Outrider 销售的是面向物流枢纽的完整场站运营系统，
              包含自动驾驶电动场内牵引车、拖车库存追踪、充电状态监控、云端管理软件，以及与场站、仓库和运输管理系统的集成。
              因此，实际替代方案分为几类：继续使用人工柴油拖车定位；通过软件编排改善调度和可视性，但不加入机器人执行层；
              让内部团队自行拼装电动卡车、基础设施和场站规则；或采购更端到端的托管服务。由于当前来源池没有提供与广泛具名竞品逐一可比的公开基准， 最稳妥的比较方式应是买方待完成任务和部署负担，而不是初创公司 logo 墙。
            claimRefs:
              - CP001
              - CP005
              - CP012
              - CP014
