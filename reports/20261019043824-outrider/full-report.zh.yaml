              尽管 Outrider 没有在本来源池中发布深入的 API 或软件设计文档，公开架构信息已经足以识别主要技术层。 第三方和合作伙伴材料持续描述一套由 lidar、radar、摄像头、AI 感知和 NVIDIA
              DRIVE 计算构成的多模态自动驾驶技术栈， 并与场站、仓库和运输管理系统连接。运营架构还延伸到驾驶本身之外，包括机器人制动管路连接、充电状态监控、拖车库存追踪和远程支持。
