      - number: '4.3'
        title: 资本充足性有融资历史支撑，但仍依赖私有指标
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的融资事实是 2024 年 10 月的 Series D：新增 $62 million，使披露股权融资超过 $250 million。
              管理层和顾问将这笔资本定位为扩大自动化场站即服务、服务数百套系统并拓展其他用途的燃料；2025 和 2026 年报道则显示， 商业模式的产能约束仍然明显，订单被推迟到 2026 和 2027
              年，合作伙伴融资也被用来降低客户采用摩擦。 这组信息可以有两种解读：公司有足够外部支持继续建设，但也可能需要大量营运资金、部署支持和渠道协助，才能将试点转成规模化车队。
              由于当前公开来源没有披露现金余额、烧钱、现金 runway、债务义务或下一轮触发指标，资本故事方向上积极，但还不足以用于投资评估。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Outrider 的公开财务画像比许多实体自动驾驶初创公司更可信，因为公司持续融资，将产品包装成经常性服务收入，并吸引愿意为车队融资和运营的渠道伙伴。
              问题在于，几乎所有能将这一叙事转成可投资模型的数字仍是私有信息：实际定价、部署毛利率、客户集中度、续约行为、销售效率、现金消耗和 runway。
              现有证据支持这样一个判断：如果利用率高，且合作伙伴主导的部署让获客保持轻资本，收入质量可能变得有吸引力。
              但目前本章仍应给出“继续研究”，因为公开记录展示了商业动能，却没有披露评估利润路径或融资依赖所需的经济数据。
            claimRefs:
