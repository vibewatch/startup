company:
  name: Outrider
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Outrider sells an autonomous yard-operations system that combines electric
    yard trucks, autonomy hardware and software, trailer-inventory tooling, and
    deployment support to automate trailer spotting in mixed-traffic logistics
    yards. The strongest public evidence supports the workflow scope, sensor and
    compute stack, safety-oriented operating model, and partner-led commercial
    rollout, while site-level reliability, security/privacy posture, and
    practitioner-community signal remain materially underdisclosed.
sections:
  - id: workflow-coverage
    title: Workflow coverage and commercial surface
    body: >-
      Outrider is not just pitching autonomy middleware; the public record
      describes a bundled yard-operations product that automates trailer and
      container movements inside distribution yards and layers management
      software, inventory visibility, and operational support around that core
      motion workflow. The most concrete commercial packaging in the assigned
      evidence is the subscription-style Outrider System described in 2025-2026
      rollout materials, where autonomy software, real-time trailer tracking,
      and ongoing support are sold as one operational service. That matters
      because the buyer problem is labor-constrained trailer spotting and yard
      throughput, not abstract AV capability, and it means diligence should
      focus on deployment economics, support burden, and workflow exceptions as
      much as on autonomy accuracy.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: system-architecture
    title: System architecture and technical dependencies
    body: >-
      The public architecture picture is specific enough to identify the major
      technical layers even though Outrider does not publish deep API or
      software-design documentation in this pool. Third-party and partner
      materials consistently describe a multi-modal autonomy stack built around
      lidar, radar, cameras, AI-driven perception, and NVIDIA DRIVE compute,
      with integration hooks into yard, warehouse, and transportation
      management systems. The operating architecture also extends beyond driving
      itself into robotic brake-line connection, charge-status monitoring,
      trailer inventory tracking, and remote support. The resulting dependency
      map is therefore partner-heavy: vehicle platform, compute, sensing,
      safety-critical hardware, and customer-system integration all have to
      hold up simultaneously for a site to reach steady-state autonomy.
    claimRefs: [CE003, CE004, CE005, CE006, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-deployment
    title: Deployment maturity and operating model
    body: >-
      Outrider has more public maturity evidence than many autonomy startups,
      but most of it is still company- or partner-mediated rather than
      independently benchmarked. The clearest support comes from partner
      documentation that says the current autonomy kit reflects more than
      12,000 autonomous trailer moves at customer sites and a test facility,
      plus media coverage and financing materials that describe multi-year
      customer pilots, Fortune 500 yard data, and a five-year commercial
      rollout with YMX. The YMX structure is important operationally because it
      splits responsibilities: YMX handles financing, fleet operations,
      on-site support, and implementation, while Outrider supplies the autonomy
      system, remote monitoring, and technical support. That lowers adoption
      friction for shippers but also means execution quality depends on channel
      partners and site services, not on autonomy software alone.
    claimRefs: [CE007, CE008, CE009, CE010]
  - id: differentiation-and-control-gaps
    title: Differentiation, trust controls, and unresolved gaps
    body: >-
      Outrider’s public differentiation case rests on being purpose-built for
      yard operations rather than adapting on-road AV stacks to depots. The
      supporting evidence points to a mixed-traffic safety system, robotic
      trailer-line handling, electric-platform standardization, and a turnkey
      deployment path through partners such as YMX and suppliers such as Ouster.
      That is a credible product thesis, and YMX explicitly cites safety and
      operational maturity as selection criteria. Still, the same public record
      is noticeably thinner on topics an investor would want before
      underwriting scale: site-level uptime, exception handling, incident
      rates, cyber/privacy controls, and independent developer or practitioner
      signal. The chapter therefore supports technical credibility, but not yet
      fully transparent operating proof.
    claimRefs: [CE011, CE012, CE014]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - Buyer / primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Outrider System subscription
        - Enterprise shipper / yard-operations lead
        - Commercial offering described in 2025-2026 deployment materials
        - Bundles autonomy stack, cloud management software, trailer inventory, and support
        - Public pricing, contract terms, and live-site count remain undisclosed
      - - Autonomous EV yard truck + autonomy kit
        - Site ops, safety, and facilities teams
        - Customer-site operations since 2019; 2026 YMX channel rollout underway
        - Purpose-built for mixed-traffic trailer spotting on electric platforms
        - No public uptime, MTBF, or intervention-rate disclosure by site
      - - TrailerConnect robotic line-handling system
        - Yard operators and maintenance leads
        - Documented feature of production-intent system
        - Automates brake/electric line connection without trailer modification
        - No public compatibility matrix or failure-rate disclosure
      - - Cloud inventory + orchestration layer
        - Yard / warehouse / transportation managers
        - Publicly described as part of current offer
        - Real-time trailer inventory tracking and workflow visibility with no added infrastructure
        - API depth, data model, and customer integration effort are not public
    notes: >-
      Combines product-surface facts from partner and media coverage; maturity
      labels distinguish documented rollout timing from undisclosed commercial
      scale.
    claimRefs: [CE001, CE002, CE003, CE004, CE010]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow constraint
      - Outrider solution
      - Measurable benefit claimed publicly
      - Limitation
    rows:
      - - Trailer spotting and container movement
        - Manual yard-driver labor and queueing inside mixed-traffic yards
        - Self-driving yard trucks locate and move trailers and containers
        - Higher throughput and safer yard operations
        - No independent site-by-site throughput KPI is public in this pool
      - - Dock-door and parking-spot positioning
        - Precision backing and staging are repetitive and labor intensive
        - Autonomous positioning and backing workflow
        - Faster turn time and reduced repetitive work
        - Exception handling and weather-performance rates are not disclosed
      - - Brake / electric line connection
        - Manual connection is hazardous, repetitive, and time consuming
        - Robotic TrailerConnect system connects and disconnects lines
        - Reduced worker exposure to dangerous manual steps
        - No public maintenance burden or error-rate disclosure
      - - Yard inventory visibility
        - Manual trailer checks and fragmented dispatch data
        - Real-time trailer inventory tracking without added infrastructure
        - Better trailer location awareness and planning
        - Accuracy, latency, and reconciliation metrics are not published
    notes: >-
      Benefits are company- or partner-stated rather than independently audited;
      limitations capture where public operating proof is still missing.
    claimRefs: [CE001, CE003, CE004, CE011, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Multi-modal sensor suite
        - Provides 360-degree situational awareness for yard actors and obstacles
        - LiDAR, radar, cameras, calibration, and environmental robustness
        - Weather, contamination, or calibration failures can degrade perception
      - - Perception and autonomy software
        - Detects orientation, position, velocity, trajectories, and drives predictable responses
        - Proprietary deep-learning models trained on customer-yard data
        - Limited public benchmark detail on edge cases and intervention logic
      - - Compute and vehicle platform
        - Runs autonomy on approved electric yard truck hardware
        - NVIDIA DRIVE, Orange EV, RH Sheppard, Yaskawa, and approved vehicle platforms
        - Partner qualification and hardware availability can constrain scaling
      - - Safety and operating controls
        - Adds redundant hazard detection, fail-safe behavior, health monitoring, and remote support
        - Internal safety case plus deployment/monitoring processes
        - Public evidence is stronger on design intent than on incident-rate disclosure
    notes: >-
      Architecture reflects only documented public layers and dependencies; no
      unpublished software modules or certifications are inferred.
    claimRefs: [CE005, CE006, CE007, CE011, CE012, CE013]
