callouts:
  - calloutType: strength
    title: Turnkey deployment angle is part of the product
    body: >-
      The clearest product advantage in the public record is not only autonomy
      capability but the attempt to package it with service, integration, and
      partner-led implementation so large shippers can adopt yard automation
      without building their own AV operations layer.
    claimRefs: [CE002, CE010, CE014]
  - calloutType: risk
    title: Public proof is stronger on design intent than on live reliability
    body: >-
      Assigned evidence supports workflow scope, safety design, and commercial
      partnerships, but it does not publish the uptime, intervention, incident,
      cyber, or practitioner-community data needed to fully validate scaled
      operating resilience.
    claimRefs: [CE008, CE011, CE012]
