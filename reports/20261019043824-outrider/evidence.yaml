evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      Current valuation mark, any post-Series-D secondary pricing, board seat allocation, liquidation preferences, and
      investor control rights.
    whyItMatters: >-
      The company can look commercially credible while still being mispriced or structurally constrained by private
      financing terms.
    diligencePath: >-
      Request the latest financing summary, cap table, and board observer or voting-rights schedule from management or
      existing investors.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: revenue-and-pricing
    missingEvidence: Revenue or ARR, gross margin, pricing architecture, deployment economics, and support burden by site.
    whyItMatters: >-
      Commercial momentum cannot be converted into unit-economics or underwriting confidence without revenue quality and
      pricing evidence.
    diligencePath: >-
      Request customer contract templates, booked ARR or revenue bridges, and contribution-margin detail by deployment
      cohort.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: private-evidence-only
    severity: material
    topic: scale-and-concentration
    missingEvidence: >-
      Current headcount, current customer count, named deployments, site concentration, renewal rates, and
      implementation backlog.
    whyItMatters: >-
      The public milestone story could overstate breadth if commercialization is concentrated in a small number of
      pilots or counterparties.
    diligencePath: >-
      Request a live customer deployment list, pipeline by stage, renewal data, and current org chart with headcount by
      function.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: governance-and-leadership-continuity
    missingEvidence: Current board composition, committee structure, and a current leadership page or filing-backed executive roster.
    whyItMatters: >-
      Governance quality and key-person concentration are hard to judge when only point-in-time press and interview
      references identify management roles.
    diligencePath: >-
      Request a board roster, committee charters, and a current leadership directory; confirm any executive changes
      since the 2024 financing.
    relatedQuestionRefs:
      - QO002
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      A public or management-provided market model that quantifies TAM, SAM, and SOM by site count, spend per site, or
      deployment-ready yards.
    whyItMatters: >-
      Without a spend-based or site-based model, valuation assumptions about market size and share capture rest on
      operational proxies rather than measured demand.
    diligencePath: >-
      Request management's market-sizing deck, deployment pipeline by vertical, and the assumptions used to translate
      yard counts into recurring revenue potential.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: Named customers, budget owners, pricing model detail, and realized ROI/payback by deployment cohort.
    whyItMatters: >-
      Buyer identity and payback proof determine how repeatable adoption is across verticals and whether the market is
      broader than a handful of complex enterprise yards.
    diligencePath: >-
      Request customer references, deployment-level ROI case studies, contract structure, and a buyer map showing who
      signs and who pays at existing accounts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public list pricing, utilization bands, payback assumptions, and realized contract economics for Outrider
      standalone deployments and the YMX-managed offer.
    whyItMatters: >-
      Without transparent economics, buyers and investors cannot benchmark whether Outrider's turnkey packaging wins
      because it is cheaper, safer, faster to deploy, or simply easier to procure.
    diligencePath: >-
      Request customer pricing sheets, deployment SOWs, and unit-economics memos covering subscription, support, and
      fleet-financing terms.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: material
    topic: deployment-density
    missingEvidence: >-
      Named customer roster, live-site count, deployment density by vertical, and retention or expansion data after
      initial yard rollouts.
    whyItMatters: >-
      Competitive strength in this category depends on repeatability across sites and customers, not just on a small
      number of well-supported pilots or showcase installations.
    diligencePath: >-
      Request cohort-level deployment data, customer references, and renewal or expansion metrics segmented by site and
      vertical.
    relatedQuestionRefs:
      - QP004
      - QP008
  - type: missing-source
    severity: material
    topic: peer-benchmarks
    missingEvidence: >-
      Independent apples-to-apples comparisons between Outrider and named autonomy, yard-service, or terminal entrants
      on safety, deployment time, and cost.
    whyItMatters: >-
      The current pool is strong on Outrider's own packaging and partner evidence but weak on neutral benchmark data
      showing how much better it is than adjacent solutions.
    diligencePath: >-
      Collect procurement evaluations, competitive bake-off notes, or independent analyst benchmarks that compare named
      alternatives on common buyer criteria.
    relatedQuestionRefs:
      - QP001
      - QP006
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Signed customer pricing schedules, discount policy, minimum terms, implementation fees, and renewal mechanics.
    whyItMatters: >-
      Public packaging language does not reveal realized monetization or whether channel-led deployments compress gross
      margin.
    diligencePath: Request the last twelve months of executed contracts and a gross-to-net pricing bridge by customer cohort.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Revenue, ARR, gross margin, service margin, installation cost, CAC, payback, and renewal data by deployment
      cohort.
    whyItMatters: Buyer ROI proxies cannot substitute for the vendor economics needed to underwrite margin path or sales efficiency.
    diligencePath: Request board or investor KPI packs showing cohort economics, gross-margin bridge, and sales funnel conversion.
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash on hand, monthly burn, runway, debt or leasing obligations, and management's next-round trigger.
    whyItMatters: >-
      Funding history shows access to capital, but not whether the current balance sheet can carry multi-year deployment
      scaling.
    diligencePath: Obtain current balance sheet, cash forecast, and covenant summary from management or lead investors.
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named live customers, deployment count by site, expansion pipeline, concentration metrics, and renewal behavior.
    whyItMatters: >-
      Revenue quality depends on whether a few Fortune 500 pilots dominate current ARR or whether deployments are broad
      and sticky.
    diligencePath: Request customer cohort roll-forward, logo concentration by ARR, and renewal/expansion data by site.
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer, practitioner-community, or third-party operator telemetry showing how often real users discuss,
      extend, or troubleshoot the product.
