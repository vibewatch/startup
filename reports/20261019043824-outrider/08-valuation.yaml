  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-disclosure
      missingEvidence: A current valuation mark, share price, or secondary trade plus any liquidation preferences, participation rights, or debt-like protections on the stack.
      whyItMatters: Public financing history alone cannot show whether a new investor would be entering at an attractive, fair, or stretched price.
      diligencePath: Request the latest board-approved valuation materials, cap table, and full term sheets for the last primary or secondary financing.
      relatedQuestionRefs: [QV002]
    - type: conflicting-data
      severity: material
      topic: funding-history
      missingEvidence: A reconciled capital table explaining why FundedIQ shows $135 million on record while 2024 reporting describes $250 million or more in cumulative equity capital.
      whyItMatters: Inconsistent cumulative funding weakens confidence in any inferred ownership dilution, round progression, or capital-efficiency narrative.
      diligencePath: Reconcile disclosed rounds against company financing history, investor disclosures, and cap-table records before underwriting dilution or runway assumptions.
      relatedQuestionRefs: [QV001]
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Revenue, gross margin, site count, deployment count, renewal behavior, customer concentration, and burn/runway disclosure tied to current operations.
      whyItMatters: Commercial traction without operating metrics can prove technical momentum, but not investable economics or downside resilience.
      diligencePath: Ask management for a KPI pack covering ARR or revenue, gross margin, cohort retention, top-customer exposure, and deployment cadence by site.
      relatedQuestionRefs: [QV008]
