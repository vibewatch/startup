schemaVersion: report-v2
artifact: valuation
slug: outrider
runDate: 2026-10-19
company:
  name: Outrider
chapter:
  number: 8
  title: Valuation
  summary: >-
    Outrider has meaningful commercialization proof - a $62 million Series D,
    a five-year YMX channel partnership, and operating claims tied to more than
    12,000 autonomous trailer moves - but the assigned public record still does
    not surface a valuation mark, revenue base, or cap-table terms that would
    let an investor underwrite an entry price. The evidence supports a
    research-more recommendation with medium confidence, high risk, and an
    unknown valuation stance until pricing and unit-economics disclosure become
    available.
sections:
  - id: financing-context
    title: Financing context without a price anchor
    body: >-
      The current public financing record shows real investor support, but not a
      usable price anchor. FundedIQ tracks two disclosed rounds on record, with
      the latest a $62.0 million Series D in October 2024 and $135 million
      raised across those recorded rounds. TechFundingNews and Orrick both frame
      the same Series D as taking cumulative equity raised to roughly $250
      million or more. That directional consistency is enough to say Outrider
      remains well-funded by venture standards, but the mismatch across public
      sources means the chapter cannot treat cumulative capital as a precise
      underwriting input. The assigned pool also still provides no disclosed
      valuation, share price, liquidation preference stack, or secondary mark,
      so entry discipline has to stay tied to future pricing evidence rather
      than a modeled fair-value range.
    claimRefs: [CV001, CV002, CV003, CV014, CV015, CV016]
    tableRefs: [TV001]
  - id: thesis-and-scenarios
    title: Why the company is investable but not yet underwritable
    body: >-
      The bullish side of the case is tangible. AJOT and UniteAI describe a
      five-year YMX partnership in which YMX finances and operates fleets,
      lowering deployment friction for enterprise shippers and giving Outrider a
      service-led route to expansion. UniteAI also reports a subscription model
      that bundles the autonomy stack, cloud software, inventory tracking, and
      24/7 support, which is structurally better aligned with recurring value
      creation than one-off hardware sales. Ouster adds proof-of-performance
      claims from more than 12,000 autonomous trailer moves and reported
      improvements in operating cost and emissions. The bearish side is just as
      important: FreightWaves notes Outrider depends on third-party electric
      trucks and that higher EV upfront cost can still slow adoption, especially
      outside large enterprise yards. Because the available public evidence
      proves technical and channel momentum more clearly than it proves durable
      economics or valuation, the scenarios remain qualitative and the right
      call is to wait for price-bearing evidence.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002, TV003]
    figureRefs: [FV001]
  - id: diligence-gates
    title: Diligence asks that could move the call
    body: >-
      The valuation decision can still move, but only if future diligence closes
      a short list of price-sensitive gaps. First, management or lead investors
      need to disclose a current valuation reference - a new priced round,
      audited secondary trade, or board mark - because the assigned record only
      supports financing history, not ownership economics. Second, commercialization
      needs operating evidence: recurring revenue, gross margin, deployment count
      by site, renewal behavior, and customer concentration. Third, a full cap
      table needs to reconcile the public total-raised mismatch and show whether
      recent capital came with senior preferences, debt-like protections, or
      other downside asymmetries. Until those asks are answered, the thesis can
      merit monitoring, but not a valuation-sensitive buy or track-at-price
      decision.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV010, CV013, CV016]
