      - [Risk rating, high, "Execution, adoption, and financing-terms risk remain material because revenue, margins, and concentration are undisclosed."]
      - [Valuation stance, unknown, "No current valuation mark, secondary trade, or public cap-table terms appear in the assigned evidence pool."]
    notes: >-
      Assessment uses only the assigned prefetched sources; missing public
      valuation and cap-table disclosure prevent a numeric fair-value range.
    claimRefs: [CV001, CV002, CV003, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What supports it
      - What would change the view
    rows:
      - ["Thesis: channel scale-up is becoming more credible", "YMX signed a five-year partnership, will finance and operate fleets, and positions the arrangement as Outrider's most comprehensive channel relationship to date.", "Evidence of multi-site deployments, customer references, and disclosed renewal economics would strengthen conviction further."]
      - ["Thesis: the product is moving toward recurring-value delivery", "UniteAI describes a subscription offering that bundles autonomy software, cloud management, inventory tracking, and 24/7 support instead of only a vehicle sale.", "Recurring revenue, gross margin, and churn disclosure would show whether the subscription structure converts into software-like economics."]
      - ["Anti-thesis: adoption can still be constrained by real-world operating friction", "FreightWaves says Outrider depends on third-party EV yard trucks and that higher upfront EV cost can remain a barrier for smaller operators.", "Proof that partner financing reliably removes the upfront-cost hurdle across customers would reduce this concern."]
    notes: >-
      The table pairs positive and negative underwriting arguments with the
      exact diligence signal that would move the recommendation.
    claimRefs: [CV004, CV005, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "YMX-led deployments convert the 12,000-plus-move proof set into multi-site enterprise rollouts, and Outrider discloses recurring revenue plus customer expansion.", "A premium-to-Series-D outcome becomes plausible only after a new priced round or secondary mark is supported by disclosed unit economics.", "Scaling service operations could still pressure margins or require additional capital.", "Possible, but dependent on disclosure that is absent today."]
      - ["Base", "Partnership momentum continues and customer deployment breadth improves, but valuation and operating metrics remain private.", "The rational posture is to wait for the next price-bearing financing or audited mark before taking underwriting risk.", "Investors may overpay for technical leadership without seeing retention, margins, or concentration.", "Most consistent with the current public evidence."]
      - ["Bear", "Deployment cycles stretch, EV-capex friction persists, or new capital arrives with heavy structure, flat pricing, or a down-round signal.", "Returns compress because new money would likely prioritize downside protection over upside for new entrants.", "Opaque governance terms and capital structure could magnify dilution or preference overhang.", "Material downside trigger if 2026-2027 commercialization slips."]
    notes: >-
      Scenarios stay qualitative because the assigned evidence pool has no
      disclosed valuation, revenue base, or margin profile.
    claimRefs: [CV004, CV008, CV009, CV010, CV013, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a sequence from commercialization proof to
      valuation uncertainty rather than from company quality alone.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: "$62M Series D and evidence of enterprise customer activity"
        - id: channel
          label: Channel leverage
          detail: "YMX will finance, operate, and support fleets under a five-year deal"
        - id: operating-proof
          label: Operating proof
          detail: "Ouster cites 12,000+ autonomous trailer moves plus cost and emissions gains"
        - id: adoption-friction
          label: Adoption friction
          detail: "Higher EV upfront costs and third-party vehicle dependence can slow rollout"
        - id: valuation-gap
          label: Valuation gap
          detail: "No public valuation mark, cap-table terms, revenue, or margin disclosure"
        - id: call
          label: Recommendation
          detail: "research-more until a price-bearing financing or audited mark appears"
      edges:
        - from: scale-proof
          to: channel
          relationship: commercialization route
        - from: channel
          to: operating-proof
          relationship: proof of scaled deployment matters next
        - from: operating-proof
          to: adoption-friction
          relationship: traction still meets execution risk
        - from: adoption-friction
          to: valuation-gap
          relationship: risk without economics blocks underwriting
        - from: valuation-gap
          to: call
          relationship: price-sensitive decision
    approximationNotes: >-
      This figure is directional logic, not a weighted scoring model or implied
      valuation calculation.
    claimRefs: [CV004, CV005, CV008, CV009, CV010, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: >-
      Recommendation: research-more. Public evidence shows real technical and
      channel momentum, but not a usable price anchor for an investor deciding
      whether today's entry would be attractive, fair, or stretched.
    claimRefs: [CV004, CV005, CV009, CV016]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      The valuation case worsens quickly if 2026-2027 commercialization requires
      structured capital, a flat/down round, or customer financing support that
      fails to offset EV adoption friction.
    claimRefs: [CV004, CV008, CV013, CV016]
