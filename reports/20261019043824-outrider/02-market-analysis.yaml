callouts:
  - calloutType: "risk"
    title: "Adoption is operationally gated, not just demand gated"
    body: >-
      Managed implementation, fleet financing, on-site support, remote monitoring, and constrained
      near-term deployment capacity all indicate that sales interest does not translate immediately
      into activated sites. Underwriting should separate customer demand from supplier and partner
      capacity until deployment-cycle and backlog data are available.
    claimRefs: ["CM007", "CM008", "CM016"]
