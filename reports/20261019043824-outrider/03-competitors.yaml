      - ["Hitch / unhitch and brake-line automation", "Yes", "Yes, via Outrider system", "No", "No"]
      - ["Fleet financing and on-site operations", "No public evidence as a standalone public offer", "Yes", "No public evidence", "Usually internal or manually contracted"]
      - ["Existing YMS / WMS / TMS integration", "Yes", "Yes", "Yes", "Not applicable as software automation"]
      - ["Third-party safety/conformity signal", "Yes, TÜV SÜD alignment cited", "Inherits Outrider selection logic", "Unknown", "Human-driver process only"]
    notes: "Unknown cells remain explicit because the assigned pool does not provide full competitor-by-competitor disclosures."
    claimRefs: [CP002, CP005, CP007, CP013]
  - id: "TP003"
    title: "Public pricing and packaging comparison"
    columns:
      - "Option"
      - "Price / contract model"
      - "Included capabilities"
      - "Known unknowns"
      - "Implication"
    rows:
      - ["Outrider autonomous system", "Subscription service", "Autonomy stack, cloud management software, trailer inventory tracking, and 24/7 support", "No list price, utilization tiers, or payback disclosures", "External ROI benchmarking is still weak"]
      - ["YMX-managed deployment", "Capacity-based pricing rather than hourly rates", "Fleet financing, operations, on-site support, and YMX OS operating model", "No public contract economics beyond the five-year channel relationship", "Low-friction procurement may matter more than list-price transparency"]
      - ["Manual diesel spotting", "Labor + fleet + fuel baseline", "Human spotting and legacy yard operations", "Assigned pool does not disclose site-level baseline costs", "Familiar budget line but weaker on safety, idling, and emissions"]
      - ["Adjacent EV / entrant offers", "Unknown in assigned pool", "Varies by provider and partnership structure", "No apples-to-apples public package pricing", "Competitive pressure is more likely to show up through packaging than transparent list prices"]
    notes: "The current source set reveals commercial structure but not enough public pricing detail for a quantified apples-to-apples ROI table."
    claimRefs: [CP004, CP006, CP009, CP010, CP011]
