      - ["YMX + Outrider managed offer", "Managed integrator / channel", "National provider with a five-year non-exclusive commercial agreement", "Enterprise shippers in food and beverage, retail, CPG, and automotive", "Financing, fleet operations, implementation, and on-site support lower adoption friction", "Not exclusive to Outrider; public unit economics are unavailable"]
      - ["Manual diesel yard spotting", "Status-quo substitute", "Existing internal fleets or yard-service contracts", "Any yard that already moves trailers manually", "Familiar operating model with no autonomy rollout required", "Labor, idling, safety exposure, and emissions remain part of the baseline"]
      - ["Software-led yard orchestration", "Adjacent substitute", "Can expand across large site networks before robotics", "Networks prioritizing visibility and dispatch", "Improves sequencing and data without changing the vehicle stack", "Does not automate physical spotting, trailer coupling, or brake-line work"]
      - ["EV / terminal entrant set", "Likely entrant / adjacent", "Partnership and M&A activity around electrified yard assets is increasing", "Fleet operators and terminal ecosystems", "Can use OEM and service-operator distribution to compress adoption friction", "Current pool does not show an equivalent end-to-end autonomous yard stack benchmark"]
    notes: "Rows compare the evidence-backed solution categories visible in the assigned pool; some are company names and some are substitute classes because public startup-to-startup benchmarking is thin in this source set."
    claimRefs: [CP001, CP002, CP005, CP010, CP014, CP015]
  - id: "TP002"
    title: "Capability and deployment matrix"
    columns:
      - "Buying criterion"
      - "Outrider autonomous stack"
      - "YMX-managed deployment"
      - "Software-led orchestration"
      - "Manual / status quo"
    rows:
