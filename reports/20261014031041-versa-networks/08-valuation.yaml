    title: 'Investment Recommendation: Research-More'
    body: We recommend a research-more stance on Versa Networks. While the unified SASE architecture and established enterprise footprint demonstrate technical maturity, the combination of opaque financials, conflicting valuation benchmarks ($411M vs. $1.46B), and senior preference overhang requires confirmatory diligence before capital commitment.
    claimRefs:
      - CV001
      - CV002
      - CV014
  - calloutType: risk
    title: 'Key Diligence Blocker: Senior Liquidation Overhang'
    body: Prospective growth equity investors must examine the cap table waterfall. Forge Global records indicate that Series E shares carry a 2.0x liquidation preference with a 12 percent cumulative dividend, creating substantial return hurdle drag for common shareholders and junior preferred series in a sub-$1.5B exit.
    claimRefs:
      - CV003
      - CV013
