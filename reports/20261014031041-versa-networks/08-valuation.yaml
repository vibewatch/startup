  - id: TV002
    title: Core investment thesis and anti-thesis evaluation
    columns:
      - Thesis Angle
      - Core Argument
      - Evidence & Counter-Evidence
      - View-Break Trigger
    rows:
      - - Unified Architecture
        - Single-stack SASE combining SD-WAN and SSE reduces branch sprawl and operational complexity
        - Docs and product releases confirm unified code; competing against Cisco, Fortinet, and Palo Alto Networks
        - Loss of key telco/MSP distribution partnerships or major technical integration outages
      - - Customer & Channel Traction
        - Over 5,000 customers and 100% channel-driven model provide scalable enterprise distribution
        - Management claims extensive reach; private status conceals churn, account concentration, and net retention
        - Channel partner defection to integrated platforms like Fortinet FortiSASE or Palo Alto Prisma
      - - Valuation Realism
        - Headline $1.46B Series F valuation positions Versa as an established SASE unicorn
        - Secondary market trades show limited liquidity with competing marks as low as $411M
        - Formal down-round or structured recapitalization that triggers senior preference payouts
      - - IPO & Liquidity Path
        - Company positioned for public markets following late-stage capital raises and CFO appointment
        - PE Insights reported no underwriting banks engaged despite 18-month target window
        - Indefinite IPO postponement or distress-driven acquisition at a sub-unicorn valuation
    notes: Evaluation of core bull thesis drivers against critical anti-thesis headwinds and observable triggers.
