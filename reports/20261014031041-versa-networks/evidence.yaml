evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financials-and-ipo-filing
    missingEvidence: >-
      Audited financial statements confirming trailing revenue, ARR, gross margins, net revenue retention, and active
      cash burn rate, as well as formal Form S-1 registration documents.
    whyItMatters: >-
      Versa Networks has operated as a venture-funded private entity since 2012; public valuation benchmarks and pre-IPO
      underwriting depend on audited financial performance rather than unverified commercial claims.
    diligencePath: >-
      Review future SEC Edgar registration filings upon public submission or request audited financial disclosures and
      cap-table documentation during confidential management diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-and-investor-syndicate
    missingEvidence: >-
      Complete cap-table equity share distribution, board of directors observer rights, and comprehensive executive
      officer listings beyond disclosed C-suite officers.
    whyItMatters: >-
      Full governance assessment requires visibility into voting control, liquidation preferences across Series A
      through Series D preferred shares, and secondary market trading activity.
    diligencePath: Obtain company capitalization ledger and corporate governance bylaws under confidentiality agreements.
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing-contradictions
    missingEvidence: >-
      Audited breakdown of single-vendor unified SASE market share and independent reconciliation between Gartner SASE
      forecast models and 650 Group deployed SASE revenue figures.
    whyItMatters: >-
      Different analyst methodologies yield conflicting addressable market definitions, ranging from pure SD-WAN
      appliance replacement to all-inclusive cloud security services.
    diligencePath: >-
      Obtain vendor-specific market share reports directly from Gartner and IDC for 2024-2026 and reconcile with company
      contracted revenue.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: deployment-friction-data
    missingEvidence: >-
      Quantitative enterprise survey tracking time-to-full-unification and console consolidation failure rates
      specifically for Versa customers versus Cato and Fortinet peers.
    whyItMatters: >-
      Partial deployments restrict net expansion and increase churn risk if organizations stall at multi-console
      co-existence.
    diligencePath: >-
      Interview reference enterprise customers across MSP and direct channels regarding actual deployment duration and
      policy centralization hurdles.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Direct enterprise contract pricing schedules, tier discounting data, and carrier margin share terms for Versa SASE
      deployments.
    whyItMatters: >-
      Without private enterprise discount schedules and carrier revenue-share terms, net realized per-seat pricing
      cannot be independently compared against list benchmarks.
    diligencePath: Request customer contract schedules and carrier partner margin exhibits during management diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-margins
    missingEvidence: >-
      Audited gross margin figures, cloud hosting infrastructure COGS breakdowns, and CAC payback periods by customer
      cohort.
    whyItMatters: >-
      Without audited gross margin data, underwriting cannot determine whether Versa operates at software gross margins
      (70-80%) or lower service-provider gross margins (50-60%).
    diligencePath: Request audited GAAP income statements and cohort contribution margin schedules from management under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash balance, net monthly cash burn, debt service covenants, and remaining operating runway.
    whyItMatters: >-
      Given the debt component in the October 2022 BlackRock facility and delayed IPO timeline, cash depletion or debt
      refinancing terms could trigger dilutive recapitalization.
    diligencePath: >-
      Obtain current balance sheet, credit facility covenant compliance certificates, and 24-month cash flow
      projections.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, releases, contributors, package downloads, API-forum traffic, or a directly observed
      practitioner-community proxy.
    whyItMatters: >-
      Without an adoption signal, the report cannot assess ecosystem depth, integration friction, or external technical
      engagement.
    diligencePath: >-
      Request the public developer portal and API references, then review official repositories, package registries,
      technical forums, and recent practitioner talks.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Current status-page history, incident postmortems, independently reproduced performance tests, and
      release-specific availability or latency evidence.
    whyItMatters: >-
