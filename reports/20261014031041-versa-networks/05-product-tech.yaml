        - Extends the portfolio from simplified branch operations to provider-hosted multi-tenancy
        - Feature parity, commercial packaging, and referenceable production deployments
    notes: Public module descriptions come from current official documentation and independent product profiles; no row treats a named product as proof of current entitlement, release maturity, or performance.
