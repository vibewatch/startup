  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Starting workflow
      - Versa workflow
      - Supported benefit
      - Limitation
    rows:
      - - Connect branches to private and cloud applications
        - Route traffic over existing WAN links and separately managed security controls
        - Apply application-aware path policy through Secure SD-WAN on VOS
        - Can use MPLS, internet, LTE, and broadband underlays according to policy
        - Realized performance depends on underlay quality, policy design, and appliance sizing
      - - Add cloud-hosted security to an enterprise-managed WAN
        - Operate the WAN edge separately from cloud security
        - Stitch the VOS branch to a Versa Cloud Gateway using IPsec or GRE
        - Preserves an enterprise- or provider-hosted WAN edge while consuming hosted SSE
        - Requires tunnel, routing, firewall-zone, addressing, and failover engineering
      - - Connect remote users to private and public resources
        - Use separate remote-access and web-security paths
        - Route users through Secure Access and Secure Web Gateway components
        - Applies the SASE design to private applications, SaaS, public cloud, and internet access
        - The assigned evidence does not quantify endpoint overhead or user-experience impact
      - - Operate multiple tenants or sites
        - Maintain site-specific configurations and management boundaries
        - Use templates, workflows, centralized policy, and multi-tenancy
        - Supports repeatable configuration and separated management planes
        - Broad configurability increases training, validation, and change-control requirements
    notes: Benefits are limited to capabilities described in the retained sources; quantitative savings, latency improvement, and deployment time are not established by this evidence set.
    claimRefs:
      - CE002
      - CE004
      - CE007
      - CE008
      - CE009
      - CE013
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer or component
      - Role
      - Dependency
      - Evidence-backed risk or diligence issue
    rows:
      - - Branch VOS / CSG
        - Runs WAN-edge connectivity, routing, and integrated security functions
        - Correct appliance sizing, underlay links, templates, and local policy
        - Independent full-feature throughput and resource-use evidence is missing
      - - VOS Cloud Gateway / hosted SSE
        - Provides the cloud-side security and connectivity endpoint
        - Stable gateway addressing, tunnel reachability, and customer allow-list maintenance
        - Gateway address changes can require customer allow-list updates
      - - IPsec or GRE integration
        - Connects enterprise- or provider-hosted Secure SD-WAN to hosted SSE
        - Matching tunnel parameters, static peer identity or FQDN handling, MTU, and firewall zones
        - Misconfiguration can leave a tunnel up while firewall or routing policy still drops traffic
      - - BGP, BFD, and failover policy
        - Exchanges routes and detects path failure across redundant connections
        - Explicit peer policy and timer tuning
        - Default dual-CPE failover is documented at 15-18 seconds and may not meet every objective
      - - Concerto, Director, and Analytics
        - Orchestrates gateways and branches and collects operational telemetry
        - Compatible releases, controlled changes, operator expertise, and usable telemetry
        - Review evidence flags upgrade frequency and learning or setup burden
    notes: Risks are drawn from the retained implementation guide and independent reviews; they are not claims that a failure or security incident has occurred.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE009
      - CE010
      - CE013
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Logical layers show how users and sites reach VOS-based edge and cloud security services under centralized policy and telemetry.
    data:
      layers:
        - label: Users and applications
          detail: Branch users, remote users, private applications, SaaS, public cloud, and internet destinations.
        - label: Endpoint and branch access
          detail: Secure Access clients, physical CSG appliances, and virtual VOS instances provide entry points.
        - label: WAN edge
          detail: Secure SD-WAN applies routing, application policy, and transport selection across available underlays.
        - label: Hybrid integration
          detail: IPsec or GRE connects enterprise- or provider-hosted WAN edges to Versa-hosted cloud gateways.
        - label: Security services edge
          detail: Secure Access and Secure Web Gateway functions mediate access to private and public resources.
        - label: Control and telemetry
          detail: Concerto and Director manage configuration while Analytics supports operational visibility.
    approximationNotes: Logical product layers only; this is not a physical topology, release-specific data flow, performance model, or assertion that every module is included in one license.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE011
callouts:
  - calloutType: strength
    title: Deployment control is the clearest differentiator
    body: Independent reviews describe cloud, hybrid, service-provider-hosted, and locally controlled deployment choices, making Versa relevant where buyers need more control than a cloud-only SASE service provides.
    claimRefs:
      - CE003
      - CE012
  - calloutType: risk
    title: Capability breadth creates an implementation burden
    body: Practitioner and editorial reviews point to frequent upgrade needs, complex setup, possible policy conflicts, and weak pricing transparency; proof-of-concept testing should therefore include upgrade, rollback, change-control, and staffing scenarios.
    claimRefs:
      - CE010
      - CE013
