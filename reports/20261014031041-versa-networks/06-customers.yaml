callouts:
  - calloutType: "strength"
    title: "Channel-Led Multi-Tenant Go-To-Market Scale"
    body: "Versa's architectural support for genuine multi-tenancy and carrier-grade routing allows Tier-1 service providers—including Swisscom, Comcast Business, and T-Mobile CZ—to build high-margin managed SASE offerings on top of the Versa platform. This channel-first alignment significantly lowers customer acquisition costs while embedding Versa into critical enterprise telecommunications contracts."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
  - calloutType: "risk"
    title: "MSP and ISP Edge Concentration Vulnerability"
    body: "The August 2024 Volt Typhoon zero-day exploitation of Versa Director servers highlighted the systemic operational risks inherent in concentrated carrier and MSP deployments. Because a single compromised partner can expose multiple downstream enterprise tenants, Versa faces heightened diligence scrutiny regarding its patch cadence and multi-tenant software isolation."
    claimRefs:
      - "CU005"
      - "CU011"
      - "CU012"
