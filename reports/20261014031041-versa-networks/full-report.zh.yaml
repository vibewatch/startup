      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 的高管团队由经验丰富的行业运营者组成，核心背景集中在运营商级路由和网络安全基础设施。首席执行官 Kelly Ahuja 于 2016 年 12 月加入公司，此前在 Cisco
              Systems 担任高管 18 年，负责服务商业务部门并任高级副总裁。联合创始人 Apurva Mehta 任首席技术官，负责平台架构和知识产权开发；他此前曾在 Juniper Networks
              设计核心路由平台。2021 年 10 月，Versa 聘请 Lalit Kumar 担任首席财务官，强化公司治理和资本市场准备。Kumar 曾在 Medallia 和 NetSuite
              担任高管，带来丰富的上市公司财务经验，负责搭建内部财务控制、收入确认系统和报告机制，为预期中的首次公开募股做准备。
