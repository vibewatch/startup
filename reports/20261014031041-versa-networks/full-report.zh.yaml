  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与架构融合
        blocks:
          - type: paragraph
            body: >-
              Secure Access Service Edge（SASE）的市场边界由软件定义广域网（SD-WAN）与 Security Service
              Edge（SSE）融合而成的统一云交付架构界定。过去，企业分别向硬件厂商采购边缘网络硬件、分支路由设备和边界防火墙，同时向独立软件供应商采购远程访问 VPN、安全 Web 网关和云访问安全代理。SASE
              改变了采购边界，将传输选路和安全检查压缩到一个集成框架中。Versa Networks 的主要可服务边界包括企业 SD-WAN
              边缘软件、分支下一代防火墙（NGFW）、云网络防火墙、零信任网络访问（ZTNA）、安全 Web 网关（SWG）和集中式编排控制台。不纳入该边界的包括传统实体园区交换、核心数据中心 spine-leaf
              架构、通用云基础设施即服务（IaaS）计算以及终端检测与响应（EDR）软件；这些仍属于相邻预算类别。整合边界的战略意义在于消除多厂商安全架构固有的集成税和策略分歧，让企业买方能够在分支办公室、混合数据中心和远程员工之间用一个控制面管理
              WAN 并防御威胁。
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM009
      - number: '2.2'
        title: 市场规模：TAM、SAM、SOM 与增长向量
        blocks:
          - type: paragraph
            body: >-
              评估单厂商 SASE 的可寻址市场，需要综合多个分析视角，而不能依赖一个笼统的总可寻址市场（TAM）数字。据行业报道引用的 Gartner 研究，全球 SASE 市场预计将以 42%
              的复合年增长率（CAGR）扩张，达到约 $11 billion；背后是广泛的企业现代化要求，超过 40% 的组织已制定明确的 SASE 采用策略。在这一宽泛 TAM 内，单厂商 Unified SASE
              的可服务市场（SAM）对应那些拒绝多厂商点产品集成、转而选择统一平台代码库的企业买方。650 Group 的季度市场跟踪显示，2022 年 Versa Networks 在 Deployed SASE 和
              Enabled SD-WAN 两类全球收入市场中均被认定为领先者，并自 2020 年起持续保持两类市场份额领先。Netify 的市场数据表明，托管和共同托管 SASE 服务对应 $8.2 billion
              的采购向量，说明大型企业越来越依赖运营商和托管服务商，而非内部团队来部署 SASE 套件。Versa 的近期可服务可获得市场（SOM）紧密绑定运营商托管渠道，覆盖一级电信伙伴和全球企业分支部署，预计可服务管线约为
              $650 million。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM009
              - CM015
