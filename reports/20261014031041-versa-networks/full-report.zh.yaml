              - CR010
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: 监管、法律与主权暴露
        blocks:
          - type: paragraph
            body: >
              SC Media 的转载报道称，Versa 于 2026 年 2 月正式推出 Sovereign
              SASE-as-a-Service，基础设施和运营均限制在客户的法定辖区内。该报道还描述了更广泛的市场缺口：控制面和管理面可能位于客户法定边界之外，因此主权是实质性买方要求，而非营销标签。Versa
              产品页面还声称拥有多项安全与合规认证，但现有证据没有包含当前证书、审计师报告、范围声明、监管记录、法院案卷或事件登记册。对受影响部署而言，监管严重性较高，但发生可能性和缓解成熟度仍只能部分评估。尽调路径应以文件核验为主：确认每项保证实际覆盖哪些平面、日志、支持职能、分包商、产品和司法辖区。
            claimRefs:
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR013
      - number: '7.3'
        title: 运营、质量与安全控制执行
        blocks:
          - type: paragraph
            body: >
              集成指南显示，混合部署的可靠性取决于 IPsec、BGP 或静态路由、BFD、VRRP、防火墙规则、隧道地址以及分支与云端发起行为之间的协调。配置错误可能阻止隧道发起，即使路由和 IPsec
              看似正常也可能丢流量，或导致 Versa Cloud Gateway 拒绝重复的隧道接口地址。Versa 记录的缓解措施包括 FQDN、带 BFD 的 BGP、防火墙规则调优、地址重新分配、IP-SLA
              跟踪和计时器修改。文档显示，这些控制较成熟，但效果取决于客户拓扑，且没有在指定证据池中得到独立基准测试。Gartner
              的存档页面只提醒，同行评审内容是观点而非事实；获取的客户页面则只给出没有具名部署细节的概括性结果。因此，独立生产证据明显少于厂商技术文档。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
              - CR016
      - number: '7.4'
        title: 依赖、财务模型与论点失效触发条件
        blocks:
          - type: paragraph
            body: >
              Versa 同时支持云托管统一 SASE，以及由服务商或企业托管 Secure SD-WAN、由 Versa 托管 SSE 的混合架构。这种灵活性在
              Versa、客户和服务商之间形成责任交接，而公开证据没有量化伙伴或客户集中度。Reuters 来源文章由 Private Equity Insights 保留，报道称当时 Versa
              超过一半的收入来自美国，尽管管理层预计 18 个月内上市，公司却尚未聘请投行。这些说法属于历史信息，不是当前运营证明。Tracxn 当前页面报告六轮融资累计 $316
              million，但募资金额不等于可用现金，也不能证明续航、利润率或盈利能力。在投资决策前，若无法记录当前财务能力、重大集中度、生产韧性或辖区控制，就构成投资论点失效条件。
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资论点失效条件
            body: |
              如果管理层无法提供当前经审计的运营数据、客户与伙伴集中度、认证范围、辖区数据流和生产故障切换结果，或这些材料与已记录的缓解措施相矛盾，应暂停投资判断。
            calloutType: risk
            claimRefs:
              - CR004
