            body: >-
              Versa Networks 的公开采用指标显示历史扩张显著，但当前经常性收入和确切付费账户数量仍不透明。首席执行官 Kelly Ahuja 此前表示，Versa 已拥有超过 5,000 个客户、500,000
              个分支站点和数千万活跃用户；Series D 融资后，企业销售和伙伴注册数量翻倍，推动了这一增长。Multiples 的独立市场分析给出更保守的基线：约 1,000 家核心企业客户，覆盖 100
