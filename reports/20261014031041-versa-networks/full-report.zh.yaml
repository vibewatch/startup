      - number: '3.3'
        title: 商业打包、定价模式与 GTM 动态
        blocks:
          - type: paragraph
            body: >-
              企业 SASE 方案的采购动态显示，市场进入方式和打包透明度存在明显差异。Zscaler 和 Netskope 等纯云安全厂商按用户销售订阅层级，重点保护远程办公人员；Versa Networks
              则在物理分支网关、虚拟机和云 PoP 上，把按用户许可与按吞吐量及设备层级定价结合起来。此外，Versa 高度依赖全球电信运营商和托管服务商（MSP），包括 Deutsche Telekom 和
              Lumen；这些伙伴以白标方式销售，或把 Versa Secure SD-WAN 作为集成企业连接服务交付。Lambton Area Water Supply Systems
              以及大型零售和制造客户等已公开部署，显示 Versa 在分布式分支环境中渗透较深。不过，企业买方经常面对复杂的定价结构：高级威胁防护分层加购、运营商利润加价和硬件设备摊销都会推高复杂度；相比之下，Cato
              Networks 等厂商强调简化的一体化云订阅。
            claimRefs:
              - CP010
