      - number: '5.3'
        title: 可靠性与运营依赖
        blocks:
          - type: paragraph
            body: >
              现有实施指南对运营依赖的说明异常具体。对于多连接，它建议使用带 BFD 的 BGP，而不是静态路由；同时规定 VOS Cloud Gateway 默认 IP MTU 为 1336
              字节，以降低碎片化风险。在记录的双 CPE 设计中，默认计时器意味着主隧道故障后需要 15-18 秒才能切换；若不符合业务目标，则必须调优。指南还警告，隧道对端通常需要静态地址，分支必须发起连接，因为云网关处于
              IKE 被动模式；防火墙或 BGP 策略错误则可能阻断流量，或让流量走上非预期路径。这些都是可管理的网络工程问题，但也意味着实施质量和持续变更控制是最终可靠性的核心。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE009
