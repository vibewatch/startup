              - CR010
              - CR012
              - CR013
          - type: callout
            title: 监控指标
            body: |
              监控隧道发起失败、BGP/BFD 和 VRRP 恢复时间、防火墙策略丢弃、重复隧道地址、数据平面辖区、证书例外、当前美国收入占比、融资条款和现金续航。
            calloutType: insight
