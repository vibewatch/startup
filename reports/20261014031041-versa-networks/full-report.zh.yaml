  - id: FI001
    title: Versa Networks 从客户到毛利的收入流
    type: flow
    summary: 展示分散的企业需求如何经渠道分销，依次转化为软件收入和贡献利润。
    data:
      nodes:
        - label: 1. 企业需求
          detail: 分散站点的分支连接和云安全需求
        - label: 2. 渠道中介
          detail: VAR、MSP 或电信运营商将 Versa 软件打包成托管式企业解决方案
        - label: 3. 软件许可
          detail: 按站点和用户签订年度订阅或定期许可
        - label: 4. 收入确认
          detail: 订阅 ARR 在合同期内按比例确认
        - label: 5. 交付成本（COGS）
          detail: 云 PoP 托管、带宽、设备支持和三级工程成本
        - label: 6. 毛利实现
          detail: 产生高毛利软件业务的现金贡献，为研发和运营提供资金
      edges:
        - from: 1. Enterprise Demand
          to: 2. Channel Intermediary
          label: GTM 采购
        - from: 2. Channel Intermediary
          to: 3. Software Licensing
          label: 合同签订
        - from: 3. Software Licensing
          to: 4. Revenue Recognition
          label: 按比例计费
        - from: 4. Revenue Recognition
          to: 5. Delivery Costs (COGS)
          label: 成本扣除
        - from: 5. Delivery Costs (COGS)
          to: 6. Gross Profit Realization
          label: 净贡献
    approximationNotes: 流程展示运营模式的运行机制；量化利润率和成本比例待经审计财务披露后再提供。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 逻辑分层展示用户和站点如何在集中策略与遥测支持下访问基于 VOS 的边缘及云安全服务。
    data:
      layers:
        - label: 用户与应用
          detail: 分支用户、远程用户、私有应用、SaaS、公有云和互联网目的地。
        - label: 终端与分支接入
          detail: Secure Access 客户端、物理 CSG 设备和虚拟 VOS 实例提供入口。
        - label: WAN 边缘
          detail: Secure SD-WAN 在可用底层网络上执行路由、应用策略和传输选择。
        - label: 混合集成
          detail: IPsec 或 GRE 将企业或提供商托管的 WAN 边缘连接至 Versa 托管的云网关。
        - label: 安全服务边缘
          detail: Secure Access 和 Secure Web Gateway 功能管理对私有及公共资源的访问。
        - label: 控制与遥测
          detail: Concerto 和 Director 管理配置，Analytics 提供运营可见性。
    approximationNotes: 仅为产品逻辑分层；这不是物理拓扑、特定版本数据流或性能模型，也不声称每个模块都包含在同一许可中。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示从渠道评估到统一 SASE 扩张及多站点编排的端到端客户采用生命周期。
    data:
      items:
        - label: 渠道评估与范围界定
          detail: 企业或 MSP 借助 VAR 或电信伙伴评估统一 SD-WAN 和安全需求。
          touchpoints:
            - 合作伙伴 RFP 和电信捆绑方案
            - PeerSpot 和 Gartner Peer Insights 评价
            - Versa Director 管理实验室演示
        - label: 初始 PoC 与分支试点
          detail: 在代表性分支部署单台 CPE 设备或虚拟边缘实例。
          touchpoints:
            - Versa Titan 或 VOS 分支预配置
            - 零接触配置验证
            - IPsec 隧道和 WAN 路径测试
        - label: 生产切换
          detail: 将分支流量从传统 MPLS 电路迁移至由 Director 集中管理的混合 SD-WAN。
          touchpoints:
            - 电信电路切换和 BGP 路由
            - 应用性能 SLA 监控
            - 初始分支防火墙策略启用
        - label: 安全服务边缘集成
          detail: 启用云托管的 SSE 能力，包括 Next-Gen Firewall 和 Secure Web Gateway。
          touchpoints:
            - Versa SSE 云端拼接
            - SaaS 直连云端分流
            - 统一安全策略执行
        - label: 零信任与园区扩张
          detail: 将 ZTNA 和 LAN 分段扩展至更多全球站点、园区网络及远程员工。
          touchpoints:
            - Versa Concerto 多租户编排
            - Versa Secure Access（VSA）代理部署
            - IoT 设备识别和微分段
        - label: 平台扩张与治理
          detail: 采用先进的 AI 安全控制、分析遥测和渠道合作伙伴托管服务。
          touchpoints:
            - Versa Analytics 数据湖遥测
            - VersaONE AI 控制和 MCP 集成
            - 渠道合作伙伴年度合同续签
    approximationNotes: 展示从初始渠道采购到全球统一 SASE 扩张的结构化推进过程。
    claimRefs:
      - CU001
      - CU005
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性排序把已有记录的故障机制与仍未核实的缓解措施有效性区分开来。
    data:
      columns:
        - label: 影响
          detail: 风险发生时对投资者的相关后果
        - label: 可能性
          detail: 基于现有故障机制的分析师判断，不是观察到的事故发生率
        - label: 缓解措施成熟度
          detail: 缓解措施有记录或有独立证据支持的程度
        - label: 剩余暴露
          detail: 要求的尽调完成前仍存在的暴露
      rows:
        - label: 混合集成配置错误
          note: 静态寻址、发起、路由、防火墙及寻址控制相互作用
          values:
            - value: High
              tone: negative
            - value: Medium
              tone: warning
            - value: Documented
              tone: positive
            - value: Medium-high
              tone: warning
        - label: 法域控制失效
