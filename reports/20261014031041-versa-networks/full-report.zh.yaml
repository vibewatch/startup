  - id: FV001
    title: 估值综合判断与建议决策逻辑
    type: flow
    summary: 按顺序评估平台验证情况、财务透明度和资本结构压力，最终形成投资立场。
    approximationNotes: 展示决定“继续研究”建议的门槛条件的概念性决策流程。
