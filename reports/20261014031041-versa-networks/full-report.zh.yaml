      - number: '3.4'
        title: 护城河持久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 在棕地分布式分支环境和运营商托管网络架构中保持着可防守的切换成本。替换 Versa 需要淘汰本地 Cloud Services Gateway 硬件设备、重构复杂的 BGP/OSPF
              路由拓扑，并重新谈判长期运营商电信合同。但其长期竞争持久性面临两项突出脆弱点。第一，独立企业架构调研显示，企业安全架构师经常绕过 Versa，优先将 Palo Alto Networks Prisma
              Access、Zscaler Zero Trust Exchange、Netskope One 和 Cato Networks 四大云安全平台列入云优先及联邦范围 SASE 采购短名单。Zscaler 和
              Palo Alto 对企业 CISO 的渠道拉力更强，Versa 经常被降为底层 SD-WAN 传输。第二，随着纯 SSE 厂商推出原生分支设备、超大规模云厂商整合边缘安全，若 Versa 不能让企业 CISO
              在传统网络和电信采购中心之外建立更强认知，其利润率可能受到挤压。
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP011
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 单栈融合与多控制台产品组合
            body: >-
              Versa Networks 最持久的技术差异化，是单操作系统代码库：在一个集成软件栈中同时交付 SD-WAN 路由、下一代防火墙和云 SSE。Cisco
              等传统竞争者经常拼装收购来的点工具（Meraki、Viptela、Umbrella），可能需要最多四个独立管理控制台，并引入数据包传输开销。
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: 面对纯云巨头的企业 SASE 短名单风险
            body: >-
              尽管 Versa 在 GigaOm 评估中技术领先，但面对纯云安全厂商仍承受结构性市场进入压力。独立架构对比显示，企业安全架构师最常把 Palo Alto Networks、Zscaler、Netskope 和
              Cato Networks 列入单厂商 SASE 短名单；当采购由云优先的 CISO 而非网络运营团队驱动时，Versa 因此暴露在外。
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与订阅收入流
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 主要经营软件许可和经常性订阅业务，为企业广域网络提供一体化网络与安全能力。传统硬件设备供应商靠高额前期设备利润变现，Versa
              的商业模式依靠软件订阅、期限许可和云交付服务变现。其旗舰 Versa Operating System（VOS）与 Versa Secure SD-WAN
              软件，按实例、站点和吞吐能力向分布式分支收费。同时，公司提供 Versa Cloud Security Service Edge（SSE），按用户年订阅交付云托管的 Zero Trust Network
              Access、Secure Web Gateway 和 Cloud Access Security Broker 能力。双重架构既支持由企业 IT 直接托管的本地设备，也支持运营商托管的虚拟实例及通过 IPsec
              隧道连接的 Versa 全托管云环境。公司沟通曾宣称，在后期融资前数年，年度合同金额增长约六成；但本地软件许可与纯云 SaaS 订阅之间的绝对经常性收入拆分仍属严密保护的私有数据。
