        blocks:
          - type: paragraph
            body: >-
              Versa Networks 已从早期软件定义网络创新者成长为全球化安全厂商，为 100 多个国家的 20,000 多家客户组织提供服务。主要企业客户包括 BP、Capital One 和 Adobe
              等跨国公司；公司员工规模扩展至约 900 人，分布在北美及印度工程中心。其近 100% 的市场进入动作都通过电信运营商和托管服务商伙伴完成。近期战略重点是推出
