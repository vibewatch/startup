            body: >-
              Versa Networks 的资产负债表轨迹同时显示出可观的累计资本化，以及对结构化融资机制日益增强的依赖。公司多轮融资累计募资三亿一千六百万美元，其中包括 2021 年的八千四百万美元 Series
              D。2022 年 10 月，Versa 完成由 BlackRock 领投、Silicon Valley Bank 参与的一亿二千万美元融资，融资包含大量债务义务，并以四亿一千万美元
              投后估值发行可转换优先股。管理层此前曾释放信号，预计在 2022 年底之后十八个月内
              IPO；但艰难的市场环境和更广泛的风险投资放缓，推迟了上市申请。高级债务的存在提高了财务杠杆和偿债要求，意味着在债务到期前，持续的资本充足性高度依赖经营现金生成或成功再融资。潜在投资人必须在投入成长股权前，仔细审查债务契约、现金消耗率和可用现金续航。
