  - id: TV001
    title: 建议总结与估值立场
    columns:
      - 维度
      - 评级 / 数值
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 经审计财务报表存在重大缺口，IPO 里程碑延迟
        - 在核实财务披露和股权结构表条款前暂缓成长股权资本
      - - 信心
        - medium
        - 估值标记冲突（$411M 对 $1.46B），ARR 未核实
        - 投入资本前，尽调必须聚焦 ARR 规模和利润率结构
      - - 风险评级
        - high
        - 清算优先权悬顶（Series E 为 2.0x）且竞争压力激烈
        - 将下行保护计入投资判断，并核实高级别优先权瀑布是否已清理
      - - 估值立场
        - stretched
        - Series F $1.46B 估值意味着按估算运行率计收入超过 10 倍
        - 要求相对 headline 估值有重大折价，或加入结构性反稀释条款
    notes: 基于当前私募市场数据汇总的尽调建议、评级和投资含义。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV014
  - id: TV002
    title: 核心投资论点与反论点评估
    columns:
      - 论点角度
      - 核心论据
      - 证据与反证
      - 观点失效触发点
    rows:
      - - 统一架构
        - 将 SD-WAN 与 SSE 合在单一技术栈的 SASE，减少分支蔓延和运营复杂度
        - 文档和产品发布确认代码统一；竞争对手包括 Cisco、Fortinet 和 Palo Alto Networks
        - 失去关键电信 / MSP 分销伙伴，或发生重大技术集成中断
      - - 客户与渠道牵引
        - 超过 5,000 名客户和 100% 渠道合作伙伴驱动的模式，提供可规模化的企业分销
        - 管理层声称覆盖广泛；私有公司状态掩盖了流失、账户集中度和净留存
        - 渠道合作伙伴转向 Fortinet FortiSASE 或 Palo Alto Prisma 等集成平台
      - - 估值现实性
        - headline $1.46B 的 Series F 估值把 Versa 定位成成熟的 SASE 独角兽
        - 二级市场交易显示流动性有限，竞争性估值标记低至 $411M
        - 正式下轮融资或触发高级别优先权支付的结构性资本重组
      - - IPO 与流动性路径
        - 公司在后期融资和任命 CFO 后定位于公开市场
        - PE Insights 报道称，尽管目标窗口为 18 个月，但尚未聘请承销银行
        - IPO 无限期推迟，或公司以低于独角兽的估值被困境收购
    notes: 将核心看多论点驱动因素与关键反论点阻力及可观察触发点进行对照。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: 乐观、基准与悲观情景估值建模
    columns:
      - 情景
      - ARR 与增长假设
      - 隐含估值
      - 关键驱动因素与下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 企业采用统一 SASE，推动 ARR 加速超过 $220M，增长率 >25%
        - $1.8B - $2.2B（ARR 的 8-10 倍）
        - IPO 顺利落地、渠道扩张，利润率向上市同业水平提升
        - 20%
      - - 基准情景
        - 在渠道主导的替换周期下，ARR 温和增长至 $150M-$175M（增长 10-15%）
        - $1.1B - $1.3B（ARR 的 7-8 倍）
        - 企业续约稳定，倍数小幅压缩，公开上市或私募轮次延迟
        - 50%
      - - 悲观情景
        - 企业客户流失且面临 Fortinet 和 Palo Alto 的激烈竞争，增长停滞在 $120M 以下
        - $400M - $600M（ARR 的 3-5 倍）
        - 倍数大幅压缩；Series E 的 2.0x 清算优先权侵蚀普通股权益价值
        - 30%
    notes: 基于估算收入区间、私募估值标记和高级别优先权条款的前瞻性情景分析。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV011
      - CV013
