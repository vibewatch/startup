        blocks:
          - type: paragraph
            body: >
              Versa 的核心产品主张是融合 WAN 连接和安全策略，而不是销售单一点产品。其文档将 Secure SD-WAN 定位于办公室、Secure Access 定位于远程办公人员、Secure Web
              Gateway 定位于公有云、SaaS 和互联网目的地的访问，VOS 则提供共同的软件基础。独立产品研究还确认 Concerto 用于编排，Analytics 用于遥测，Secure Internet
              Access 和 Secure Private Access 用于 SSE 功能，CSG 设备部署在边缘，Titan 面向 IT
              更精简的环境。这种广度可以减少分别管理的网络和安全系统数量，但每个模块当前的打包方式、授权边界和发布成熟度，仍需通过物料清单和产品演示确认。
