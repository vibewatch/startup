      - number: '1.3'
        title: 资本结构、融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 的资本化历经 14 年，呈现出从风险投资到成长期机构融资的渐进路径。早期融资由 Sequoia Capital、Mayfield Fund 和 Verizon Ventures
              等领投；2021 年 6 月，公司完成由 Princeville Capital 和 RPS Ventures 共同领投的 $84 million Series D，扩大商业覆盖。2022 年 10
              月，Versa 完成 $120 million 的 IPO 前融资安排，其中 BlackRock Inc. 领投股权投资，Silicon Valley Bank 提供债务工具，使累计募资达到 $316
              million。二级市场和私募交易数据显示，近期其投后估值曾达到 $1.46 billion；但公司仍是私有企业，正式审计财务披露受到严格限制，资本结构瀑布表和优先股清算优先权仍需进一步核实。
