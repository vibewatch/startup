      - number: '2.3'
        title: 买方细分、预算归属与渠道动态
        blocks:
          - type: paragraph
            body: >-
              SASE 的采用路径和预算归属，在企业直接 IT 买方与间接电信服务商之间明显分化。在传统大型企业部署中，主要买方是基础设施副总裁或企业网络架构师，他们过去通常从网络资本支出预算中管理广域连接。但 SASE
              同时引入零信任网络访问和云防火墙，因此采购决策越来越需要与首席信息安全官（CISO）及安全运营团队共同达成共识，或共享预算权限。这种组织摩擦推动 Versa 形成独特的市场进入模式：近 100%
              的销售通过间接渠道合作伙伴完成，包括大型增值经销商、系统集成商和一级电信服务商。全球 50 多家主要服务商——如 Comcast Business、Verizon、KDDI、Singtel 和
              CenturyLink——将 Versa 的多租户软件打包成开箱即用的托管 SD-WAN 和 SD-Branch 服务。对服务商而言，Versa 平台是抵消传统 MPLS
              传输结构性下滑的重要增收工具，使运营商无需自研软件栈也能提供更高毛利的托管安全服务。在中端市场，托管服务商利用多租户能力，为缺乏内部安全工程深度的精简 IT 组织交付共同托管 SASE。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM013
              - CM014
      - number: '2.4'
        title: 采用驱动、运营瓶颈与规模缺口
        blocks:
          - type: paragraph
            body: >-
              统一 SASE 的企业采用受到成本和安全因素推动，但顽固的运营瓶颈也为潜在投资人留下重大尽调缺口。需求侧上，组织若让网络和安全体系彼此割裂，会承受严重的运营损失；伙伴调研显示，35%
              的企业在过去一年遭遇安全漏洞，原因是独立网络团队与安全团队协调不佳或因此加剧。此外，99% 的受访 IT 负责人将网络与安全融合为单一模式列为优先事项，73%
              的人表示集成复杂性拖延了关键基础设施项目。然而，Dark Reading 和《2026 State of Network
              Security》报告的独立报道给出了另一面：虽然不采用率已降至个位数，但绝大多数企业仍停留在部分部署或早期部署阶段，没有实现完全统一。超过一半的组织仍在分支、本地和云环境之间同时维护多个安全控制台及相互冲突的策略引擎。更关键的是，集中式
              SASE 平台会放大故障半径：中央网关故障或身份检查配置错误，可能让整个业务部门与收入关键型应用断开连接。对评估 Versa 的投资人而言，独立私有 SASE
              ARR、流失率及头部电信伙伴的精确客户集中度仍未披露，因此无法把私募市场估值与公开可比公司做出确定性对照。
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 单厂商 SASE 架构势在必行
            body: 企业买方越来越要求采用单厂商 SASE 架构，以减少厂商数量并统一混合分支的安全策略；但多控制台遗留负债往往拖慢从初始 SD-WAN 设备迁移到完全统一 SSE 的进程。
            calloutType: insight
            claimRefs:
              - CM001
              - CM008
          - type: callout
            title: 故障半径与集中式故障风险
            body: 把路由、防火墙和零信任策略集中到一个云管理“大脑”中，会放大灾难性运营风险；任何中央策略配置错误或网关故障，都可能立即影响整个企业部门的创收应用。
            calloutType: risk
            claimRefs:
              - CM007
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场分类
        blocks:
          - type: paragraph
            body: >-
              SASE 和安全 SD-WAN 市场已进入激烈整合期，市场一端是统一的单厂商架构，另一端是混合多厂商产品组合。Tracxn 的基准数据显示，网络、安全和边缘领域共有 680
              多家竞争者，但企业采购主要集中在三类厂商。第一类是云原生安全领导者，主要包括 Palo Alto Networks（Prisma Access）、Zscaler（Zero Trust
              Exchange）、Netskope（Netskope One）和 Cato Networks（SASE Cloud）；它们拥有顶级企业品牌影响力和广泛的安全服务边缘（SSE）能力。第二类是 Cisco
              Systems、Fortinet 和 Check Point Software 等传统网络与边界安全厂商，依靠庞大的企业路由和园区硬件存量防守。第三类是 VMware VeloCloud 和 HPE Aruba
              EdgeConnect 等运营商托管平台及 SD-WAN 专业厂商，争夺分布式分支连接市场。Versa Networks 横跨多个类别，位置独特：它起步于企业级安全 SD-WAN
              路由操作系统，随后打造原生安全栈，而不是把收购来的边界点产品拼接在一起。
            claimRefs:
              - CP003
              - CP004
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP011
      - number: '3.2'
        title: 架构比较与技术差异化
        blocks:
          - type: paragraph
            body: >-
              SASE 领域的技术差异化，关键在于广域路由（SD-WAN）与云交付安全检查（SSE）的集成深度。在 2026 GigaOm Radar for SASE 等独立评估中，Versa Networks 被评为市场
              Leader 和 Outperformer；评估强调其单栈软件架构：功能完整的 SD-WAN、下一代防火墙（NGFW）、ZTNA、CASB 和 SWG
              在同一个操作系统内运行，而不是分散于不同的虚拟网络功能（VNF）。相比之下，企业对比测试显示，Cisco SASE 等传统方案经常把 Meraki、Viptela 和 Umbrella
              等割裂收购的产品拼在一起，可能需要最多四个相互独立的管理控制台，并引入性能延迟。此外，Versa 提供主权 SASE
              能力，支持细粒度本地数据驻留和多租户隔离，让电信服务商和跨国企业可以直接在主权边界内部署检查平面；面对以美国为中心的超大规模云厂商架构，这是一项关键采购标准。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
