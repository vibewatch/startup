            - value: High
              tone: negative
            - value: Medium
              tone: warning
            - value: Developing
              tone: warning
            - value: Medium-high
              tone: warning
        - label: 双 CPE 故障切换中断
          note: 已记录的 15 至 18 秒默认值仅适用于 VRRP 情景
          values:
            - value: High
              tone: negative
            - value: Medium
              tone: warning
            - value: Documented
              tone: positive
            - value: Medium
              tone: warning
        - label: 安全保障缺口
          note: 厂商声称的范围超出此处留存的独立证据
          values:
            - value: High
              tone: negative
            - value: Unknown
              tone: neutral
            - value: Claimed
              tone: warning
            - value: High
              tone: negative
        - label: 美国收入集中度
          note: 报告的占比属于历史数据，缺少当前分母
          values:
            - value: High
              tone: negative
            - value: Unknown
              tone: neutral
            - value: Unverified
              tone: warning
            - value: Unknown
              tone: neutral
        - label: 财务与流动性不透明
          note: 累计融资额未披露现金余额、消耗速度、利润率或资金续航
          values:
            - value: High
              tone: negative
            - value: Medium
              tone: warning
            - value: Unverified
              tone: warning
            - value: High
              tone: negative
    approximationNotes: 定性标签是分析师基于所引机制和信息缺口作出的判断；它们不是事件发生频率、概率或独立测量的控制评分。
