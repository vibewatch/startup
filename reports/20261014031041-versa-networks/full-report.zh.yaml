  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分与买方画像
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 通过不同客户层级切入企业安全网络和 SASE
              市场，并按组织规模、架构模式和采购渠道对部署进行分类。大型跨国企业是核心客户群，需要在分布式企业分支、园区网络和多云环境中统一路由、SD-WAN 与零信任安全。这些大型买方重视架构灵活性、应用感知流量选路和细粒度
              IoT 分段，以减少点设备堆叠并淘汰僵化的传统 MPLS 电路。与此同时，中端企业和分布式多分支运营方采用 Versa Titan 或云托管
              SASE，以简化边缘运营，而不必维持专门的安全工程团队。但战略意义最大的细分市场仍是电信服务商、一级运营商和托管服务商（MSP）。这些伙伴在其 PoP 中部署 Versa Operating
              System（VOS）和 Versa Director，为下游商业订户提供白标托管 SD-WAN 和 Secure Access Service Edge
              方案。这种双层商业结构让平台覆盖零售银行、能源和全球运输等多个行业，同时在许多部署中避免 Versa 直接面对终端用户的计费关系。
