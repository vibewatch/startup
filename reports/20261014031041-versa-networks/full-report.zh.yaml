    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与核心使命
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 由网络和电信行业资深人士 Kumar Mehta 与 Apurva Mehta 于 2012 年创立，目标是解决企业广域网的架构性缺陷。过去，分布式企业依赖僵化、以硬件为中心的
              WAN 路由器和割裂的边界安全设备；随着应用负载迁移到公有云和混合云，这种架构带来了运营摩擦。Versa 将软件定义广域网（SD-WAN）与下一代安全服务融合到统一的软件定义操作系统 Versa
              Operating System（VOS）中。公司总部位于美国加州 Santa
              Clara，提供云端、本地和混合安全访问服务边缘（SASE）部署，面向数千个分支机构和远程办公终端提供高性能路由、多租户能力及高级威胁防护。
