  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 受约束的市场规模分层，将企业网络总支出与单一厂商 SASE 及 Versa 可触达的运行率进行比较。
    data:
      items:
        - label: 广义企业 WAN 与边缘安全支出
          value: 50
          unit: USD B
          detail: 企业在 MPLS 带宽、边缘防火墙、VPN 集中器和路由器硬件上的传统总支出。
        - label: 总可寻址市场（TAM）：全球 SASE
          value: 11
          unit: USD B
          detail: 预计全球 SASE 市场在企业云网络和安全服务领域以 42% CAGR 扩张。
        - label: 托管与联合托管 SASE 采购
          value: 8.2
          unit: USD B
          detail: 全球企业和中型企业市场的支出经由电信运营商及 MSP 的联合托管服务合同流转。
        - label: 可服务市场（SAM）：单一厂商 SASE
          value: 4.5
          unit: USD B
          detail: 选择统一单一厂商 SASE 套件、而非拼接多厂商方案的组织客户细分市场。
        - label: 可获取市场（SOM）：电信核心
          value: 0.65
          unit: USD B
          detail: 一级电信服务提供商合作伙伴计划及大型企业分支中的可触达采购管线。
        - label: Versa 平台收入运行率锚点
          value: 0.148
          unit: USD B
