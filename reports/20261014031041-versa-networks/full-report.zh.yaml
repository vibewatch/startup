      - number: '5.4'
        title: 差异化、信任与未决技术风险
        blocks:
          - type: paragraph
            body: >
              Versa 最强的差异化主张是部署控制：独立评测描述了在本地运行控制软件的选项，同时支持云端和混合模式，这对安全敏感或受主权约束的买方很重要。实践者证据总体认可其架构深度和灵活性，但并非一面倒。Gartner
              Peer Insights 提到软件缺陷和频繁升级，eSecurity Planet 则指出设置复杂、策略可能冲突、多播和培训能力有限、服务链性能存在风险以及价格透明度较差。历史二手来源称 VOS 于 2023
              年获得 FIPS 140-2
              认证，但现有证据无法证明当前认证清单、安全事件历史、产品路线图、状态页历史、公开代码或软件包活跃度，也没有独立性能基准。这些缺口意味着，不能把广泛的功能覆盖当作低实施风险或低运营风险的证明。
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
