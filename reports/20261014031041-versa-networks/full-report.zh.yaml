      - number: '6.4'
        title: 扩张动力、留存与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Versa Networks 的商业扩张几乎完全依赖间接渠道，公司通过 Versa ACE 伙伴计划，由服务商、增值经销商和系统集成商完成近 100%
              的业务。虽然这种结构能高效覆盖全球，但也带来重要的对手方集中和运营脆弱性。2024 年 8 月，中国政府支持的威胁组织 Volt Typhoon 积极利用托管服务商和 ISP 托管的 Versa Director
              管理服务器中的零日漏洞（CVE-2024-39717），入侵至少四家美国互联网服务商，以拦截下游客户凭证。除安全事件暴露外，Gartner Peer Insights
              上经过验证的企业反馈还指出软件质量存在运营摩擦，尤其是反复出现的缺陷和频繁升级要求，持续形成行政负担。此外，PeerSpot 上的潜在企业买方反映，获取 Versa Director 和 Versa Titan
              的透明前期定价长期困难，这会加剧与 Fortinet、Palo Alto Networks 和 Zscaler 等单厂商 SASE 方案竞争时的采购摩擦。
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 渠道驱动的多租户市场进入规模
            body: >-
              Versa 对真正多租户和运营商级路由的架构支持，使包括 Swisscom、Comcast Business 和 T-Mobile CZ 在内的一级服务商能够基于 Versa 平台构建高毛利托管 SASE
              方案。这种渠道优先模式显著降低客户获取成本，并把 Versa 嵌入关键企业电信合同。
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
          - type: callout
            title: MSP 与 ISP 边缘集中度脆弱性
            body: >-
              2024 年 8 月 Volt Typhoon 对 Versa Director 服务器的零日漏洞利用，凸显了运营商和 MSP 部署高度集中所固有的系统性运营风险。单个伙伴被攻破就可能暴露多个下游企业租户，因此
              Versa 的补丁节奏和多租户软件隔离会受到更严格的尽调审查。
            calloutType: risk
            claimRefs:
              - CU005
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资判断含义
        blocks:
          - type: paragraph
            body: >
              Versa
              的首要风险不是没有记录在案的控制措施，而是要在云、分支、安全、路由、编排和硬件这些环节配置并验证一个覆盖面很广的平台。官方文档明确列出静态地址要求、隧道被动行为、防火墙策略依赖、地址冲突条件和按拓扑区分的故障切换时间。因此，配置和变更控制是证据最充分的剩余风险。产品页面另行声称主
              WAN 链路切换到备 WAN 链路用时不到两秒，而集成指南给出双 CPE VRRP 场景下 15 至 18
              秒的默认值；两者对应不同故障范围，应分别测试，不能当作相互矛盾的基准。投资判断应以生产测试结果和独立保证为前提，而不能只看功能广度或奖项宣传。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
