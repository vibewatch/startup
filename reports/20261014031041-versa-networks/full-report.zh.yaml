            body: >-
              评估 Versa Networks 的底层成本结构和单位经济，暴露出典型 IPO
              前私有软件厂商的严重披露空白。外部商业估算差异很大：第三方公司画像将年收入置于一亿美元至五亿美元的宽泛统计区间，另一些数据库记录则给出 2024 年 3
              月财年的两千一百万美元收入，同时还有接近一亿四千八百万美元的替代估算。毛利受到两股相反力量影响：接近八成毛利的软件许可拥有高利润率，但云托管基础设施成本和运营商支持开销又将混合毛利率压向六成。此外，Nasdaq
              Private Market
              等另类交易平台上的二级股票交易仅向合格机构开放，在没有公开资产负债表披露的情况下，价格发现能力有限。对投资判断至关重要的关键指标——净收入留存、客户获取成本回收期和云托管销货成本——若没有管理层直接披露，完全无法获得。
