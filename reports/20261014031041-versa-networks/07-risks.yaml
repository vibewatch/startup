callouts:
  - calloutType: risk
    title: Thesis-break conditions
    body: >
      Pause underwriting if management cannot provide current audited operating data,
      customer-and-partner concentration, certification scope, jurisdictional data flows, and
      production failover results, or if those materials contradict the documented mitigations.
    claimRefs: [CR004, CR008, CR010, CR012, CR013]
  - calloutType: insight
    title: Monitoring indicators
    body: >
      Monitor tunnel-initiation failures, BGP/BFD and VRRP recovery time, firewall-policy drops,
      duplicate tunnel addressing, data-plane jurisdiction, certificate exceptions, current U.S.
      revenue share, financing terms, and cash runway.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR010, CR012, CR013]

