callouts:
  - calloutType: insight
    title: The Single-Vendor SASE Architecture Imperative
    body: Enterprise buyers increasingly mandate single-vendor SASE architectures to reduce vendor sprawl and unify security policies across hybrid branches, but multi-console legacy debt often slows migration from initial SD-WAN appliances to fully unified SSE.
    claimRefs:
      - CM001
      - CM008
  - calloutType: risk
    title: Blast Radius and Centralized Failure Concentration
    body: Consolidating routing, firewalling, and zero-trust policies into a single cloud-managed brain increases catastrophic operational risk, as any central policy misconfiguration or gateway hiccup immediately impacts revenue-generating applications across entire enterprise units.
    claimRefs:
      - CM007
      - CM012
