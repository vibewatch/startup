    rows:
      - - Branch VOS / CSG
        - Runs WAN-edge connectivity, routing, and integrated security functions
        - Correct appliance sizing, underlay links, templates, and local policy
        - Independent full-feature throughput and resource-use evidence is missing
      - - VOS Cloud Gateway / hosted SSE
        - Provides the cloud-side security and connectivity endpoint
        - Stable gateway addressing, tunnel reachability, and customer allow-list maintenance
        - Gateway address changes can require customer allow-list updates
      - - IPsec or GRE integration
        - Connects enterprise- or provider-hosted Secure SD-WAN to hosted SSE
        - Matching tunnel parameters, static peer identity or FQDN handling, MTU, and firewall zones
        - Misconfiguration can leave a tunnel up while firewall or routing policy still drops traffic
      - - BGP, BFD, and failover policy
        - Exchanges routes and detects path failure across redundant connections
        - Explicit peer policy and timer tuning
        - Default dual-CPE failover is documented at 15-18 seconds and may not meet every objective
      - - Concerto, Director, and Analytics
        - Orchestrates gateways and branches and collects operational telemetry
        - Compatible releases, controlled changes, operator expertise, and usable telemetry
        - Review evidence flags upgrade frequency and learning or setup burden
    notes: >-
