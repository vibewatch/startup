      - number: '7.2'
        title: Regulatory, legal, and sovereignty exposure
        blocks:
          - type: paragraph
            body: >
              SC Media's syndicated report says Versa made Sovereign SASE-as-a-Service generally available in February
              2026 with infrastructure and operations confined to a customer's legal jurisdiction. The same report
              describes a broader market gap in which control and management planes may sit outside the customer's legal
              boundary, making sovereignty a substantive buyer requirement rather than a marketing label. Versa's
              product page also asserts multiple security and compliance certifications, but the assigned evidence does
              not include current certificates, auditor reports, scope statements, regulator records, court dockets, or
              an incident register. Regulatory severity is therefore high for affected deployments, while likelihood and
              mitigation maturity remain only partially assessable. The diligence path is documentary: verify which
              planes, logs, support functions, subprocessors, products, and jurisdictions each assurance actually
              covers.
            claimRefs:
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
