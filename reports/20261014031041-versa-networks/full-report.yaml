      - number: '1.3'
        title: Capitalization, Financing History, and Valuation
        blocks:
          - type: paragraph
            body: >-
              The capitalization of Versa Networks reflects a disciplined progression of venture and growth-stage
              institutional financings spanning fourteen years. Following early funding rounds led by Sequoia Capital,
              Mayfield Fund, and Verizon Ventures, the company accelerated its commercial footprint through an $84
              million Series D round in June 2021 co-led by Princeville Capital and RPS Ventures. In October 2022, Versa
              concluded a $120 million pre-IPO financing facility combining equity investment led by BlackRock Inc. with
              debt facilities provided by Silicon Valley Bank, bringing total lifetime capital raised to $316 million.
              While secondary market and private transaction data indicate post-money valuation marks reaching $1.46
              billion in recent periods, official audited financial disclosures remain closely guarded under private
              status, leaving capitalization waterfall details and preferred share liquidation preferences subject to
              confirmatory diligence.
