      - number: '5.4'
        title: Differentiation, trust, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >
              The strongest differentiation claim is deployment control: independent reviews describe an option to run
              the control software locally, alongside cloud and hybrid modes, which is relevant to security-sensitive or
              sovereignty-constrained buyers. Practitioner evidence is directionally positive on architectural depth and
              flexibility, but it is not uniformly favorable. Gartner Peer Insights surfaces a complaint about bugs and
              frequent software upgrades, while eSecurity Planet flags complex setup, possible policy conflicts, limited
              multicast and training, service-chaining performance risk, and poor price transparency. A historical
              secondary source reports FIPS 140-2 certification for VOS in 2023, but the assigned evidence does not
              establish a current certification inventory, security-incident history, product roadmap, status-page
              history, public code or package activity, or independent performance benchmarks. Those gaps prevent
              treating broad capability coverage as proof of low implementation or operating risk.
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment control is the clearest differentiator
            body: >-
              Independent reviews describe cloud, hybrid, service-provider-hosted, and locally controlled deployment
              choices, making Versa relevant where buyers need more control than a cloud-only SASE service provides.
            calloutType: strength
            claimRefs:
              - CE003
              - CE012
          - type: callout
            title: Capability breadth creates an implementation burden
            body: >-
              Practitioner and editorial reviews point to frequent upgrade needs, complex setup, possible policy
              conflicts, and weak pricing transparency; proof-of-concept testing should therefore include upgrade,
              rollback, change-control, and staffing scenarios.
            calloutType: risk
            claimRefs:
