  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer adoption lifecycle from channel evaluation to unified SASE expansion and multi-site
      orchestration.
    data:
      items:
        - label: Channel Evaluation & Scoping
          detail: Enterprise or MSP assesses unified SD-WAN and security requirements via VAR or carrier partner.
          touchpoints:
            - Partner RFPs and carrier bundles
            - PeerSpot and Gartner Peer Insights reviews
            - Versa Director management lab demo
        - label: Initial PoC & Branch Pilot
          detail: Deployment of single-CPE appliances or virtual edge instances at representative branch sites.
          touchpoints:
            - Versa Titan or VOS branch staging
            - Zero-touch provisioning validation
            - IPsec tunnel and WAN path testing
        - label: Production Cutover
          detail: Migration of branch traffic from legacy MPLS circuits to hybrid SD-WAN with centralized Director management.
          touchpoints:
            - Carrier circuit cutover and BGP routing
            - Application performance SLA monitoring
            - Initial branch firewall policy activation
        - label: Security Service Edge Integration
          detail: Enabling cloud-hosted SSE capabilities including Next-Gen Firewall and Secure Web Gateway.
          touchpoints:
            - Versa SSE cloud stitching
            - Direct-to-cloud SaaS breakout
            - Unified security policy enforcement
        - label: Zero Trust & Campus Expansion
          detail: Extending ZTNA and LAN segmentation across additional global sites, campus networks, and remote workers.
          touchpoints:
            - Versa Concerto multi-tenant orchestration
            - Versa Secure Access (VSA) agent rollouts
            - IoT device identification and microsegmentation
        - label: Platform Expansion & Governance
          detail: Adopting advanced AI security controls, analytics telemetry, and partner-managed services.
          touchpoints:
            - Versa Analytics data lake telemetry
            - VersaONE AI controls and MCP integration
            - Annual channel partner contract renewals
    approximationNotes: Illustrates the structured progression from initial channel procurement to global unified SASE expansion.
