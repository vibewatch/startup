      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Versa Networks' executive leadership is anchored by seasoned industry operators with extensive backgrounds
              in carrier-grade routing and cybersecurity infrastructure. Chief Executive Officer Kelly Ahuja joined the
              company in December 2016 following an eighteen-year leadership career at Cisco Systems, where he served as
              senior vice president overseeing service provider business units. Co-founder Apurva Mehta serves as Chief
              Technology Officer, guiding platform architecture and intellectual property development, having previously
              designed core routing platforms at Juniper Networks. In October 2021, Versa strengthened its corporate
              governance and capital markets readiness by recruiting Lalit Kumar as Chief Financial Officer. Kumar
              brought substantial public-company finance expertise from executive positions at Medallia and NetSuite,
              structuring internal financial controls, revenue recognition systems, and reporting mechanisms for an
              anticipated initial public offering.
            claimRefs:
