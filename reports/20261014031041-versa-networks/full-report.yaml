      - number: '7.3'
        title: Operational, quality, and security-control execution
        blocks:
          - type: paragraph
            body: >
              The integration guide shows that hybrid deployment reliability depends on coordinated IPsec, BGP or static
              routing, BFD, VRRP, firewall rules, tunnel addressing, and branch-versus-cloud initiation behavior.
              Misconfiguration can prevent tunnel initiation, drop traffic even when routing and IPsec appear healthy,
              or cause a Versa Cloud Gateway to reject duplicate tunnel interface addresses. Versa documents mitigations
              including FQDNs, BGP with BFD, firewall-rule tuning, address reassignment, IP-SLA tracking, and timer
              changes. Those controls are mature as documentation, but their effectiveness is customer-topology
              dependent and was not independently benchmarked in the assigned pool. Gartner's archived page contributes
              only a warning that peer-review content is opinion rather than fact, while the fetched customer page
              offers generalized outcomes without named deployment detail. Independent production evidence is therefore
              materially thinner than the vendor's technical documentation.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
              - CR016
      - number: '7.4'
        title: Dependency, financial-model, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              Versa supports both cloud-hosted unified SASE and hybrid architectures in which service providers or
              enterprises host Secure SD-WAN while Versa hosts SSE. That flexibility creates responsibility handoffs
              among Versa, customers, and service providers, and the public evidence does not quantify partner or
              customer concentration. A Reuters-sourced article, preserved through Private Equity Insights, reported at
              the time that more than half of revenue came from the United States and that Versa had not hired banks
              despite management anticipating a listing within 18 months. Those statements are historical, not current
              operating proof. Tracxn's current page reports $316 million raised across six rounds, but funding raised
              is not cash available and does not establish runway, margin, or profitability. Thesis-break conditions are
              failure to document current financial capacity, material concentration, production resilience, or
              jurisdictional controls before an investment decision.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
