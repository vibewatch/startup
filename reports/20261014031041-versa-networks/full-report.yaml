  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Versa Networks approaches the enterprise secure networking and SASE market through distinct customer
              tiers, categorizing deployments by organization scale, architecture model, and purchasing channel. Large
              multinational enterprises represent a core demographic requiring unified routing, SD-WAN, and zero-trust
              security across distributed corporate branches, campus networks, and multi-cloud environments. These large
              buyers prioritize architectural flexibility, application-aware traffic steering, and granular IoT
              segmentation to reduce point-appliance sprawl while retiring rigid legacy MPLS circuits. In parallel,
              mid-market organizations and distributed multi-branch operations adopt Versa Titan or cloud-managed SASE
              offerings to simplify edge operations without maintaining dedicated security engineering staffs. However,
              the most strategically significant segment remains telecommunications service providers, Tier-1 carriers,
              and managed service providers (MSPs). These partners deploy Versa Operating System (VOS) and Versa
              Director within their points of presence to deliver white-labeled, managed SD-WAN and Secure Access
              Service Edge solutions to their downstream commercial subscriber bases. This two-tier commercial structure
              establishes broad platform reach across diverse verticals—including retail banking, energy, and global
              transport—while insulating Versa from direct end-user billing relationships in many deployments.
            claimRefs:
              - CU001
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU014
      - number: '6.2'
        title: Adoption Trajectory and Deployment Metrics
        blocks:
          - type: paragraph
            body: >-
              Public adoption metrics for Versa Networks reflect substantial historical expansion, alongside notable
              opacity regarding current recurring revenues and exact paying account counts. Chief Executive Officer
              Kelly Ahuja previously stated that Versa exceeded 5,000 customers, 500,000 branch sites, and tens of
              millions of active users operating across its software platform, driven by doubling enterprise sales and
              partner registrations following its Series D financing. Independent market analysis from Multiples
              provides a more conservative baseline of approximately 1,000 core enterprise customers spanning 100
              countries, explicitly highlighting carrier engagements such as Deutsche Telekom. Gartner Peer Insights
              corroborates a large footprint, documenting thousands of enterprise clients globally across hundreds of
              thousands of operational endpoints. The divergence between primary company milestones and third-party
              analyst estimates illustrates the distinction between direct enterprise software licenses and aggregate
              downstream branch endpoints supported across large telecommunications partner networks. Because Versa is
              privately held, precise quarterly active user metrics, gross retention rates, and net revenue retention
              cohorts remain undisclosed, necessitating careful distinction between gross partner reach and
              contractually committed software spend.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
      - number: '6.3'
        title: Named Customer Deployments and Production Outcomes
        blocks:
          - type: paragraph
            body: >-
              Reference customer accounts demonstrate that Versa has successfully achieved production deployments across
              highly demanding operational environments. In the telecommunications sector, Swisscom selected Versa to
              power beem, its sovereign plug-and-play unified networking and security service designed for European
              enterprise clients requiring localized regulatory compliance and resilience. In the North American market,
              Comcast Business engineered its Security Edge Preferred service atop the VersaONE platform, enabling
              zero-touch cloud security for small and medium-sized business subscribers. At enterprise scale, energy
              multinational ExxonMobil conducted a multi-year global backbone transformation, migrating international
              facility networks from legacy MPLS circuits to an integrated Versa SD-WAN architecture to accelerate cloud
              connectivity and realize circuit cost savings. Within financial services, Philippine commercial lender
              Rizal Commercial Banking Corporation (RCBC) deployed Versa Secure SD-WAN across its branch banking
              network, establishing centralized management and resilient multi-link branch connectivity. Additionally,
              T-Mobile Czech Republic engineered in-country SASE Points of Presence leveraging Versa Zero Trust Network
              Access technology to modernize remote access architectures for Tier-1 banking clients.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
