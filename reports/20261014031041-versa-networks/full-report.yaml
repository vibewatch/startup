      - number: '1.4'
        title: Historical Milestones and Operational Scale
        blocks:
          - type: paragraph
            body: >-
              Versa Networks has evolved from an early software-defined networking innovator into a scaled global
              security vendor serving over 20,000 customer organizations across more than 100 countries. Key enterprise
              accounts include multinational corporations such as BP, Capital One, and Adobe, supported by a global
              workforce expanding to approximately 900 employees across North America and engineering centers in India.
              The company executes nearly 100 percent of its go-to-market motions through telecommunications carriers
              and managed service provider partners. Recent strategic developments center on the rollout of VersaONE,
              which combines artificial intelligence capabilities (VersaAI) with unified zero-trust network access.
              Nonetheless, independent customer reviews on Gartner Peer Insights highlight operational friction
              regarding software bugs and frequent required software upgrade cycles, emphasizing the necessity for
              disciplined release testing as customer footprints expand.
