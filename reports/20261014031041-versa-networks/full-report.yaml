  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer jobs
        blocks:
          - type: paragraph
            body: >
              Versa's core product proposition is the convergence of WAN connectivity and security policy rather than a
              single point product. Its documentation separates Secure SD-WAN for offices, Secure Access for remote
              workers, and Secure Web Gateway for access to public cloud, SaaS, and internet destinations, while VOS
              supplies the common software foundation. Independent product research also identifies Concerto for
              orchestration, Analytics for telemetry, Secure Internet Access and Secure Private Access for SSE
              functions, CSG appliances at the edge, and Titan for leaner IT environments. This breadth can reduce the
              number of separately managed network and security systems, but each module's current packaging,
              entitlement boundary, and release maturity still requires confirmation in a bill of materials and product
              demonstration.
