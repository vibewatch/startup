  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Dynamic branch addressing prevents a required static-address site-to-site design
        - Medium in DHCP-based branches
        - High
        - 'Documented: dynamic DNS and transit-branch alternatives'
        - Medium; DNS, routing, and ownership handoffs remain
        - Production evidence for customer-specific DHCP, DNS, and recovery behavior
      - - Both tunnel endpoints remain passive and the IPsec connection never initiates
        - Low-medium
        - High
        - 'Documented: the branch must initiate because the VCG is passive'
        - Medium under template or change-control error
        - Automated configuration checks and failed-initiation recovery measurements
      - - Dual-CPE failover causes a 15-to-18-second interruption under default VRRP timers
        - Medium during a primary-tunnel failure
        - High for latency-sensitive traffic
        - 'Documented: IP-SLA tracking and timer tuning'
        - Medium; topology and application sensitivity vary
        - Packet-loss, session-survival, and recovery tests under contracted production topology
      - - Firewall zone or policy configuration drops traffic despite healthy IPsec and routing
        - Medium
        - High
        - Documented troubleshooting and rule changes
        - Medium-high because policy correctness is deployment specific
        - Independent policy review, negative testing, and rollback evidence
      - - Duplicate tunnel-interface addresses cause gateway configuration rejection
        - Medium when many tunnels terminate on one VCG
        - High
        - Documented re-addressing and static-route update procedure
        - Medium under scale and change
        - Address-management controls and multi-site configuration validation
    notes: >-
      Failure modes and mitigations come from Versa's integration guide; likelihood, severity, and residual labels are
      analyst assessments pending customer-topology tests.
