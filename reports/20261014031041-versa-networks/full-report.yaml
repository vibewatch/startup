      - number: '5.2'
        title: Deployment, integration, and workflow
        blocks:
          - type: paragraph
            body: >
              Versa supports more than one operating model. Secure SD-WAN and SSE can both be Versa-cloud-hosted, while
              a service provider or the enterprise can host the WAN edge and connect it to Versa-hosted SSE. The
              documented hybrid pattern uses static IPsec or GRE tunnels between branch VOS instances and Versa Cloud
              Gateways; Concerto configures the cloud gateway side and Director configures branch-side templates. At the
              traffic layer, Versa describes application-aware routing across MPLS, internet, LTE, and broadband,
              allowing policy to choose an appropriate path for each application. The flexibility is useful for
              brownfield estates, but it creates design work around tunnel identity, routing policy, firewall zones,
              addressing, and responsibility boundaries between Versa, a service provider, and the customer.
            claimRefs:
              - CE003
              - CE004
              - CE006
