      - number: '5.3'
        title: Reliability and operating dependencies
        blocks:
          - type: paragraph
            body: >
              The available implementation guide is unusually specific about operational dependencies. For multiple
              connections, it recommends BGP with BFD rather than static routing; it also specifies a 1336-byte IP MTU
              default on the VOS Cloud Gateway to reduce fragmentation risk. In the documented dual-CPE design, default
              timers imply a 15-18 second failover after primary tunnel failure, with tuning required when that does not
              meet the business objective. The same guide warns that tunnel peers generally need static addresses, the
              branch must initiate the connection because the cloud gateway is IKE-passive, and firewall or BGP policy
              mistakes can prevent traffic or distribute it over unintended paths. These are manageable
              network-engineering concerns, but they make implementation quality and ongoing change control central to
              realized reliability.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE009
