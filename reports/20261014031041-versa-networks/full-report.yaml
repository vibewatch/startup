        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break conditions
            body: >
              Pause underwriting if management cannot provide current audited operating data, customer-and-partner
              concentration, certification scope, jurisdictional data flows, and production failover results, or if
              those materials contradict the documented mitigations.
