  - id: TV001
    title: Recommendation summary and valuation stance
    columns:
      - Dimension
      - Rating / Value
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Significant gap in audited financials and delayed IPO milestones
        - Withhold growth-equity capital until financial disclosure and cap table terms are verified
      - - Confidence
        - medium
        - Conflicting valuation marks ($411M vs $1.46B) and unverified ARR
        - Diligence must focus on ARR scale and margin structure before committing capital
      - - Risk Rating
        - high
        - Liquidation preference overhang (2.0x Series E) and intense competitive pressure
        - Underwrite downside protection and verify senior preference waterfall clearance
      - - Valuation Stance
        - stretched
        - Series F $1.46B valuation implies >10x revenue on estimated run rates
        - Require significant discount to headline valuation or structural anti-dilution terms
