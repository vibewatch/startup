chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Versa Networks was established in 2012 by networking and telecommunications veterans Kumar Mehta and
              Apurva Mehta to address fundamental architectural deficiencies in enterprise wide-area networking.
              Historically, distributed enterprises relied upon rigid, hardware-centric WAN routers and fragmented point
              security appliances, creating operational friction as application workloads migrated into public and
              hybrid clouds. Versa pioneered the convergence of software-defined wide area networking (SD-WAN) and
              next-generation security services within a unified, software-defined operating system known as the Versa
              Operating System (VOS). Headquartered in Santa Clara, California, the company provides cloud, on-premises,
              and hybrid secure access service edge (SASE) deployments designed to deliver high-performance routing,
              multi-tenancy, and advanced threat protection across thousands of branch locations and remote worker
              endpoints.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
