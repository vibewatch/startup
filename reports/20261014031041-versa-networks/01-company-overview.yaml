company:
  name: Versa Networks
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Versa Networks is a late-stage private cybersecurity and unified SASE vendor founded in 2012 by Kumar and Apurva
    Mehta, operating under the leadership of CEO Kelly Ahuja with $316 million in cumulative financing from BlackRock,
    Princeville Capital, and Sequoia Capital. Serving more than 20,000 customer organizations globally via an indirect
    channel model, the company delivers integrated networking and security through its proprietary Versa Operating
    System, while maintaining private financial disclosure ahead of prospective public listing.
sections:
  - id: executive-summary-and-identity
    title: Corporate Identity and Core Mission
    body: >-
      Versa Networks was established in 2012 by networking and telecommunications veterans Kumar Mehta and Apurva Mehta
      to address fundamental architectural deficiencies in enterprise wide-area networking. Historically, distributed
      enterprises relied upon rigid, hardware-centric WAN routers and fragmented point security appliances, creating
      operational friction as application workloads migrated into public and hybrid clouds. Versa pioneered the
      convergence of software-defined wide area networking (SD-WAN) and next-generation security services within a
      unified, software-defined operating system known as the Versa Operating System (VOS). Headquartered in Santa
      Clara, California, the company provides cloud, on-premises, and hybrid secure access service edge (SASE)
      deployments designed to deliver high-performance routing, multi-tenancy, and advanced threat protection across
      thousands of branch locations and remote worker endpoints.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO008
      - CO010
      - CO011
    tableRefs:
      - TO001
  - id: executive-leadership-and-governance
    title: Founders, Leadership, and Governance
    body: >-
      Versa Networks' executive leadership is anchored by seasoned industry operators with extensive backgrounds in
      carrier-grade routing and cybersecurity infrastructure. Chief Executive Officer Kelly Ahuja joined the company in
      December 2016 following an eighteen-year leadership career at Cisco Systems, where he served as senior vice
      president overseeing service provider business units. Co-founder Apurva Mehta serves as Chief Technology Officer,
      guiding platform architecture and intellectual property development, having previously designed core routing
      platforms at Juniper Networks. In October 2021, Versa strengthened its corporate governance and capital markets
      readiness by recruiting Lalit Kumar as Chief Financial Officer. Kumar brought substantial public-company finance
      expertise from executive positions at Medallia and NetSuite, structuring internal financial controls, revenue
      recognition systems, and reporting mechanisms for an anticipated initial public offering.
    claimRefs:
      - CO005
      - CO006
      - CO012
    tableRefs:
      - TO002
  - id: capitalization-and-investor-syndicate
    title: Capitalization, Financing History, and Valuation
    body: >-
      The capitalization of Versa Networks reflects a disciplined progression of venture and growth-stage institutional
      financings spanning fourteen years. Following early funding rounds led by Sequoia Capital, Mayfield Fund, and
      Verizon Ventures, the company accelerated its commercial footprint through an $84 million Series D round in June
      2021 co-led by Princeville Capital and RPS Ventures. In October 2022, Versa concluded a $120 million pre-IPO
      financing facility combining equity investment led by BlackRock Inc. with debt facilities provided by Silicon
      Valley Bank, bringing total lifetime capital raised to $316 million. While secondary market and private
      transaction data indicate post-money valuation marks reaching $1.46 billion in recent periods, official audited
      financial disclosures remain closely guarded under private status, leaving capitalization waterfall details and
      preferred share liquidation preferences subject to confirmatory diligence.
    claimRefs:
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO003
  - id: strategic-evolution-and-milestones
    title: Historical Milestones and Operational Scale
    body: >-
      Versa Networks has evolved from an early software-defined networking innovator into a scaled global security
      vendor serving over 20,000 customer organizations across more than 100 countries. Key enterprise accounts include
      multinational corporations such as BP, Capital One, and Adobe, supported by a global workforce expanding to
      approximately 900 employees across North America and engineering centers in India. The company executes nearly 100
      percent of its go-to-market motions through telecommunications carriers and managed service provider partners.
      Recent strategic developments center on the rollout of VersaONE, which combines artificial intelligence
      capabilities (VersaAI) with unified zero-trust network access. Nonetheless, independent customer reviews on
      Gartner Peer Insights highlight operational friction regarding software bugs and frequent required software
      upgrade cycles, emphasizing the necessity for disciplined release testing as customer footprints expand.
    claimRefs:
      - CO010
      - CO011
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001
