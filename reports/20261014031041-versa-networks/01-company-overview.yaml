callouts:
  - calloutType: strength
    title: Unified Single-Pass Software Architecture
    body: >-
      Versa Networks' core differentiation rests upon the Versa Operating System (VOS), which consolidates SD-WAN,
      routing, next-generation firewall, and zero-trust security into a single software image and parallel-processing
      engine, bypassing the latency and orchestration overhead of multi-vendor appliance stacks.
    claimRefs:
      - CO003
      - CO004
  - calloutType: risk
    title: Private Financial Opacity and Maintenance Friction
    body: >-
      Although Versa Networks has accumulated $316 million in growth capital and serves 20,000+ accounts, lack of
      audited GAAP revenue, ARR, or retention metrics clouds valuation assessments, while verified user reviews
      highlight ongoing operational overhead associated with software bugs and frequent patching cycles.
    claimRefs:
      - CO008
      - CO011
      - CO013
