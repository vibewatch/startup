        - Predictable per-user licensing; requires budgeting separate branch routing infrastructure
      - - Fortinet FortiSASE
        - Unified hardware license + cloud subscription
        - FortiGate NGFW/SD-WAN + FortiClient SSE
        - Per-device appliance license + per-user cloud tier
        - Support contracts and FortiGuard subscription fees
        - Low entry hardware cost; recurring operational overhead across distributed firewalls
      - - Cato SASE Cloud
        - All-in-one converged cloud subscription
        - Global backbone, SD-WAN Socket, complete SSE stack
        - Site bandwidth license + mobile user license
        - Last-mile cross-connects and premium SLAs
        - Transparent all-inclusive pricing; higher barrier to entry for smaller non-global footprints
