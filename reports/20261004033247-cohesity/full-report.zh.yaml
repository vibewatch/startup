      - number: '3.3'
        title: 护城河壁垒、知识产权与平台拼装隐患
        blocks:
          - type: paragraph
            body: >-
              Cohesity 的竞争护城河立足于三大支柱：横向扩展文件系统的技术壁垒、深厚的生态伙伴关系，以及新获专利的 AI 检索知识产权。2026 年 6 月 3 日，Cohesity 凭借 Cohesity Gaia
              获得美国专利号 12,619,501，建立了受保护的法律壁垒，允许直接在二级备份和归档存储中就地运行生成式 AI 检索增强生成（RAG），无需复制数据或暴露给外部流水线。凭借 Nvidia、HPE 和 Cisco
              的战略股权投资与技术联盟，Cohesity 能直接融入企业硬件生态与现代 AI 加速栈，并集成了 Cyera 等 OEM 模块以实现
              DSPM。然而，显著的隐患正在威胁其长期护城河壁垒。竞手情报指出，Cohesity 扩展后的网络韧性平台越来越多地由收购和 OEM 组件拼装而成：DSPM 功能依赖转售 Cyera 技术（锚定在 AWS
              美国控制平面），身份威胁检测与响应由 Semperis OEM 提供，而核心 NetBackup 底座收购自 Veritas。这种多技术路线图并存的格局带来了工程整合摩擦。此外，随着 2024
              年年中裁员及高管更迭，合并后的整合风险浮出水面；在 Rubrik 和 Commvault 激进的策反攻势下，面临迁移抉择的存量 Veritas 客户可能出现续约流失。
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 深度图表
        blocks:
          - type: callout
            title: 合并后整合摩擦与敏捷专精竞手夹击
            body: >-
              Cohesity 的激进扩张与 Veritas 并购遗产带来了运营摩擦：公司需要平衡多条重叠的产品路线图、推进人员精简，并应对正在进行的 NetBackup 企业客户迁移。尽管这迅速将即期市占率推高至
              19%，但复杂性也让 Cohesity 露出软肋，面临 Rubrik 和 Veeam 等敏捷竞手针对其老旧客户展开的激进替换攻势。
            calloutType: risk
            claimRefs:
              - CP002
              - CP016
          - type: callout
            title: 企业二级数据 RAG 的专利护城河
            body: >-
              通过在 2026 年 6 月为 Cohesity Gaia 取得美国专利号 12,619,501，Cohesity 将二级数据 AI 推理能力转化为具备法律效力的壁垒。竞手若想在不依赖高成本外部 ETL
              的情况下在备份存储库上提供生成式 AI 检索，要么必须设计绕行方案，要么就得承担侵犯 Cohesity 受保护知识产权的风险。
