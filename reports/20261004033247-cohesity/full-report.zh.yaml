chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、运营模式与创立背景
        blocks:
          - type: paragraph
            body: >-
              Cohesity 由计算机科学家 Mohit Aron 于 2013 年创立。Aron 曾参与设计 Google File System 并联合创立
              Nutanix，随后开创了超融合二级数据架构。公司总部位于加利福尼亚州圣何塞，作为私营软件厂商，面向混合云、多云及本地部署环境提供 AI 驱动的数据安全、备份、容灾与非结构化数据管理服务。2022 年 8
              月，曾任职于 VMware 和 SAP 的 Sanjay Poonen 接任首席执行官兼总裁，主持管理工作，Aron 则转任名誉创始人。Cohesity 依托 Cohesity Data Cloud
              平台，通过软件许可、软硬一体设备包以及 SaaS 托管订阅实现商业化，在全球服务超过 12,000 家客户，其中包括逾 85 家 Fortune 100 企业。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO009
