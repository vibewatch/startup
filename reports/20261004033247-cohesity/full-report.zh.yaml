      - number: '1.3'
        title: 治理架构、企业规模与战略风险
        blocks:
          - type: paragraph
            body: >-
              合并后的治理架构由早期风投机构、控股型私募股权赞助方与独立网络安全专家共同组成。董事会由 Wing Venture Capital 的 Gaurav Garg 担任主席，成员包括 Haveli
              Investments 的 Brian Sheth、Carlyle 的 Patrick McCarter、Veritas 前 CEO Greg Hughes 以及独立董事 Kevin Mandia，Premji
              Invest 的 Sandesh Patnam 担任董事会观察员。虽然合并后实体的备考收入达到 $1.6B 至 $1.7B 以上，ARR 约为
              $1.5B，但整合风险与高额财务杠杆依然是尽调重点。债务市场分析师对该交易采用的大额债务融资包表示担忧；同时多项行业研究显示，灾难性网络攻击会带来严重财务损失——同类高管调研显示重大安全事件造成的收入损失最高可达
              15%——这让像 Cohesity 这样承担数据安全托管职责的企业面临更高强度的运营审视。
