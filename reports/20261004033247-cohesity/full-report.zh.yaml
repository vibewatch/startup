      - number: '2.2'
        title: 目标市场规模、测算视角与分析分歧
        blocks:
          - type: paragraph
            body: >-
              评估 Cohesity 的市场潜力，需要结合第三方研究、公司披露与分析师预测等多重视角展开测算。合并后的官方披露指出，公司瞄准的总体可用市场（TAM）合计超过 $40B，其中包含 IDC
              统计的企业数据复制与保护软件品类 [CM002]。在这一更大体量中，IDC 的半年度软件跟踪报告（Semiannual Software Tracker）预测 2024 年数据复制与保护软件厂商收入为
              $12.3B，代表核心可服务软件市场范围 [CM002]。Grand View Research 与 Research and Markets
              的更宏观市场评估则预计，全球企业数据管理行业在数据激增与混合办公模式推动下，将以 14% 的复合年增长率在 2030 年扩张至 $265.68B
              [CM007]。各家测算模型的差异在于是否将硬件设备、托管备份基础设施及网络恢复服务打包计入纯软件数字中。与 Veritas 合并后的披露显示，Cohesity 备考收入逾 $1.7B，在 12,000
              多家企业客户中实现 $1.5B 年经常性收入（ARR），在分散的数据复制与保护软件支出中占据约 19% 的第一市场份额 [CM002,
              CM003]。规模尽调必须厘清核心经常性软件订阅收入与硬件设备转售、维护续约及多年历史合同待履约余额之间的界限 [CM014]。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM014
