      - number: '3.2'
        title: 能力对比、架构摩擦与商业模式
        blocks:
          - type: paragraph
            body: >-
              评估企业备份平台会发现，各家在网络恢复机制、架构封装和总体拥有成本上差异悬殊。直接竞手对比显示，Cohesity 在 Data Cloud 中主打横向扩展文件系统与写入后威胁扫描，而竞手 Veeam 则直击
              Cohesity 的运维瓶颈。Veeam 批评 Cohesity 在初始数据写入时缺乏连续的内联威胁扫描，转而依赖写入后的定时扫描或 Mandiant 等外部应急响应伙伴。此外，云端恢复暴露出架构摩擦：Veeam
              能在不依赖私有虚拟机监控程序的情况下直接跨平台恢复至公有云，而 Cohesity 部署历史上要求在目标云中搭建集群硬件实例或 VMware 计算环境。在商业化上，定价结构带来了显著的评估摩擦。Cohesity
              采用后端 TB（BETB）容量订阅许可模式，未计入 FortKnox 或 DataHawk 等网络韧性附加模块前，每 TB 每年通常在 $150 至 $400 之间，而这些附加模块会使部署支出增加 15% 至
              40%。相比之下，Veeam 推行无容量惩罚的按实例定价，Commvault 公开终端与 Microsoft 365 工作负载的基础 SaaS 定价，但企业级前端 TB（FETB）合同仍需大量谈判。至于 IBM
              Storage Protect 等传统平台，高昂的初始设置成本与复杂的管理模式与 Cohesity 统一的单一控制台形成反差，但 PeerSpot 买方互动数据显示，IBM 占据 1.7% 的品类心智份额，高于
              Cohesity 的 1.1%。
