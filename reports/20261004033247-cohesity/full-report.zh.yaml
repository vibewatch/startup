            title: Veritas 合并的战略影响
            body: >-
              Cohesity 放弃直接单独 IPO，转而收购 Veritas 数据保护业务，将业务体量推高至 $1.5B ARR 与 12,000
              家客户。然而，这笔交易也让公司的资本结构从纯风投支持的初创企业，转变为由私募股权赞助方支持、背负沉重债务的高杠杆混合实体。
