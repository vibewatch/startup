      - number: '1.2'
        title: 融资历程、Veritas 合并与资本结构
        blocks:
          - type: paragraph
            body: >-
              在与 Veritas 企业数据保护业务达成里程碑式合并之前，Cohesity 经多轮风险投资累计筹集逾 $650M 股权融资，早期由 Sequoia Capital、Wing Venture Capital
              支持，并在 2018 年获 SoftBank Vision Fund 领投 $250M Series D 轮。2021 年 12 月公司提交秘密 IPO 申请，但随后搁置。2024 年 2 月 Cohesity
              宣布实施重大重组，并于 2024 年 12 月完成交割，以约 $2.5B 现金和合并后实体约 20.9% 的预估股权，收购 Veritas 核心数据保护部门。该交易对合并后实体的估值约为 $7B，资金来自
              Haveli Investments 领投的 Series H 轮股权融资，以及由 J.P. Morgan 安排的大额 B 期定期贷款（Term Loan B），后者同时用于协助 Veritas
              Technologies 偿还债务。本次剥离将 NetBackup 和 Alta 等 Veritas 企业数据保护资产，与其剩余的 InfoScale、Compliance 及 Backup Exec
              业务分开，后部分业务被拆分为由 Carlyle 控股的独立公司 DataCo。
            claimRefs:
              - CO003
