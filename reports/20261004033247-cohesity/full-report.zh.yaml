            body: >-
              部署灵活性既是重要优势，也是实施风险的来源。Cisco 的验证设计文档记录了基于 UCS X-Series
              的本地全闪存配置，包含基础设施自动化与集群扩容流程；独立软件目录则描述了自主管理、服务化交付与混合云模式。Cohesity 合作伙伴 XenTegra 列出了
              VMware、Oracle、SQL、Microsoft 365 和 NAS
              等受支持环境；这些是评估集成能力的有益证据，但仍属于供应商与渠道侧的证言，而非独立的互操作性基准测试。过往一线工程师的报道还展示了节点发现、软件版本匹配、集群扩容以及响应迅速的管理界面。综合这些材料可以看出其具备成熟的企业级运营模式，但也意味着系统高度依赖受认证的硬件、网络环境、端口、身份认证体系、连接器兼容性以及严格的顺序维护规范。
            claimRefs:
              - CE002
              - CE008
              - CE010
              - CE011
      - number: '5.4'
        title: 安全成熟度与未决技术风险
        blocks:
          - type: paragraph
            body: >-
              Cisco 2023 年的验证设计将不可篡改快照、WORM
              防篡改控制、数据加密、多因素认证以及细粒度基于角色的访问控制列为集成方案的一部分。鉴于备份基础设施本身是具备高权限的关键恢复组件，这些安全控制措施至关重要，但其实际存在并不能证明遭遇攻击时的实际防护有效性。InvGate
              的软件目录列出了 Cohesity 的历史漏洞，包括较旧 DataProtect 版本中因缺少 TLS 证书验证而产生的
              CVE-2023-33295；该资料属于二手整理，不能替代最新的厂商安全通告或权威漏洞数据库。收录的 PeerSpot 页面征集了产品缺陷，显示有 8
              条反馈，但抓取的文本未展示实质内容。因此，目前的安全风险态势受限于证据：安全控制措施有据可查，但近期的补丁修复状态、认证覆盖范围、安全事件历史、恢复测试结果及一线人员的批评意见，仍需进一步核实一手材料。
            claimRefs:
              - CE007
              - CE011
              - CE012
