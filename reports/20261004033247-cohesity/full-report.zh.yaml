      - number: '5.2'
        title: 技术架构与技术差异化
        blocks:
          - type: paragraph
            body: >-
              最确凿的技术证据来自历史资料，但在逻辑上保持了一致。Cohesity 2016 年的白皮书与 Tech Field Day
              的报道描述了一个横向扩展分布式平台，采用全局重复数据删除、自适应分层、工作负载隔离以及基于 SnapTree
              的快照模型。这些机制支撑了该产品的主打整合逻辑：备份、恢复、文件、测试开发和分析可共享统一的数据层，而无需在多款单点产品间生成冗余副本。SnapTree 据称能支持高频快照并生成完全水合（Fully
              hydrated）的恢复镜像，而分布式写入与索引旨在将负载分摊到各个集群节点。这确立了明确的架构传承，但不能证明当前的每项云服务都沿用同一套实现。在收录的证据中，目前尚无最新的组件/版本映射图、当前的规模上限，以及由第三方独立复现的吞吐量或恢复测试数据。
