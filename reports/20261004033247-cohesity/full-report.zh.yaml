  - id: TV001
    title: 投资建议摘要
    columns:
      - 指标 / 维度
      - 立场 / 评级
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 持续监测合并后业务整合里程碑及完整财年经审计的合并财务数据。
      - - 置信度
        - 中
        - 对其市场份额领先地位高度确信，但资本结构公开披露有限。
      - - 风险评级
        - 高
        - 债务包契约条款、传统客户群流失及过高的估值对标预期均构成风险。
      - - 估值立场
        - 合理
        - 当前 $7B-$8B 的老股交易估值反映了经营现状；$17B 的目标估值明显偏高。
    notes: 数据综合自公司一手披露、二级市场基准以及截至 2026 年 10 月的可比同行估值倍数。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV011
  - id: TV002
    title: 正反投资逻辑权衡
    columns:
      - 视角
      - 核心论点
      - 何种情况会改变观点
    rows:
      - - 正向投资逻辑
        - 品类龙头，拥有 19% 市场份额、$1.5B+ ARR、28% 利润率，并获得 Nvidia 与 IBM 的战略支持。
        - 传统老客户严重流失，或合并后 ARR 增速放缓至 10% 以下。
      - - 反向投资逻辑
        - 追求 $17B 估值意味着要给一家以成熟软件为主的资产套上不切实际的 11x+ 倍数。
        - 有证据表明内生 SaaS ARR 增速加快至 25% 以上，且债务完全去杠杆化。
    notes: 结合上市竞品动态及已披露财务画像评估的对比性逻辑驱动因素。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
  - id: TV003
    title: 情景估值分析
    columns:
      - 情景
      - 核心假设
      - 隐含倍数
      - 估值区间
      - 发生概率
    rows:
      - - 乐观情景
        - Gaia 交叉销售提速，合并 ARR 超过 $1.9B，利润率扩张 >30%
        - 8.5x - 9.0x P/S 倍数
        - $16.0B - $17.0B
        - 25%
      - - 基准情景
        - 综合内生增速处于 low-teens 水平，ARR 达到 $1.7B-$1.8B，利润率保持稳定
        - 5.0x - 6.0x P/S 倍数
        - $9.0B - $10.8B
        - 50%
      - - 悲观情景
        - 原有 Veritas 客户流失，整合拖累业务，ARR 增速停滞在 5% 以下
        - 3.5x - 4.5x P/S 倍数
        - $5.5B - $7.0B
        - 20%
      - - 严重下行情景
        - 向公有云备份加速迁移，传统客户流失 >20%，债务重组
        - 2.0x - 2.5x P/S 倍数
        - $3.0B - $4.0B
        - 5%
    notes: 基于合并后 12 个月的运营记录及可比市场对标，假设退出窗口为 2026 年底。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Cohesity 从 2013 年创立到 2024 年以 $7B 收购 Veritas 并定位网络韧性的编年历程。
    data:
      items:
        - date: '2013-06-01'
          label: 公司创立
          detail: Mohit Aron 在加利福尼亚州注册成立 Cohesity，开创超融合二级数据架构。
          tone: positive
        - date: '2017-04-01'
          label: C 轮融资
          detail: 完成由 GV 和 Sequoia Capital 领投的 $90M C 轮融资，扩张二级存储市场版图。
          tone: positive
        - date: '2018-06-11'
          label: D 轮融资与 SoftBank 支持
          detail: 完成由 SoftBank Vision Fund 领投的 $250M D 轮融资，使股权融资总额达到 $410M。
          tone: positive
        - date: '2021-03-01'
          label: 要约收购与 $3.7B 估值
          detail: 完成 $145M 老股要约收购，估值定在 $3.7B；随后于 12 月秘密提交 IPO 申请。
          tone: neutral
        - date: '2022-08-01'
          label: 管理层更迭
          detail: Sanjay Poonen 出任 CEO 兼总裁；创始人 Mohit Aron 转任荣誉创始人。
          tone: positive
        - date: '2024-02-08'
          label: 宣布合并 Veritas
          detail: 达成最终协议，以 $2.5B 现金加股权方式合并 Veritas 数据保护业务。
          tone: opportunity
        - date: '2024-12-10'
          label: 完成 Veritas 合并
          detail: 完成对 Veritas 估值约 $7B 的交易交割，资金来自 Haveli 领投的 H 轮及债务融资。
          tone: positive
        - date: '2026-07-01'
          label: 平台整合进展
          detail: KuppingerCole 分析师评估重点指出，在合并公告发布 18 个月后，Cohesity Data Cloud 的业务整合取得成效。
          tone: neutral
    approximationNotes: 日期代表官方公开公告或披露的交易完成里程碑。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO006
      - CO007
      - CO010
      - CO015
  - id: FM001
    title: 约束条件下的企业级市场规模测算金字塔
    type: pyramid
    summary: 多层级市场规模测算结构，展示广义企业数据管理、目标韧性可寻址支出、核心复制软件以及 Cohesity 合并后的业务体量。
    data:
      items:
        - label: Cohesity 合并后收入运行率（SOM 锚点）
          value: $1.7B Revenue / $1.5B ARR
          detail: FY2024 备考合并收入，覆盖 12,000 家企业客户，市场份额达 19%。
        - label: IDC 数据复制与保护软件（SAM 锚点）
          value: $12.3B Projected Spend
          detail: IDC Semiannual Software Tracker 对复制与保护领域厂商软件销售额的估算。
        - label: 企业二级数据整合（初始目标痛点）
          value: $60.0B Annual Spending
          detail: 针对备份与容灾领域碎片化二级数据单点方案的预估企业支出。
        - label: 综合目标韧性市场（目标 TAM）
          value: $40.0B+ Addressable Spend
          detail: 涵盖数据复制、安全以及网络韧性细分领域的目标可寻址市场。
        - label: 云端备份即服务（BaaS）细分市场（高增长方向）
          value: Over 66% Enterprise Adoption
          detail: ESG 研究显示，超过三分之二的机构采用云端 BaaS 架构。
        - label: 全球企业数据管理（广阔行业边界）
          value: $265.68B by 2030
          detail: Grand View Research 预测企业数据管理软件将以 14% CAGR 增长。
    approximationNotes: 各市场层级反映不同公开口径，涵盖从广义数据管理到针对性复制软件的各类范畴。
