              环境。综合来看，这些渠道指向多条变现抓手：受保护容量、部署形态、合同期限以及增购模块。但相关材料未披露收入结构、会计确认政策、客户续约表现，亦未披露各业务维度的毛利贡献，因此下文重在梳理业务结构，而非数值测算。
