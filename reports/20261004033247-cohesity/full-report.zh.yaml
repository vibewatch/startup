      - number: '2.3'
        title: 企业买方画像、采购决策中心与采纳路径
        blocks:
          - type: paragraph
            body: >-
              企业网络韧性平台的采购决策权主要掌握在首席信息安全官（CISO）与首席信息官（CIO）或基础设施副总裁手中，反映出网络安全与灾备运维的深度融合。历史上，二级备份被视为基础设施运维支出，评估指标主要看存储密度、恢复点目标（RPO）与恢复时间目标（RTO）。而在当前威胁环境下，企业采购要求高管进行网络风险把关、多工作负载验证、不可篡改存储保证，并要求对接应急响应工作流
              [CM004, CM008]。采纳路径采用混合部署模式：企业客户部署横向扩展软件架构或软硬一体设备以整合数据中心和私有云孤岛，同时拓展至 AWS
              等公有云托管的备份即服务（BaaS）及数据管理即服务（DMaaS）模式 [CM001, CM005, CM011]。由于严苛的安全审查、针对真实备份目标的 PoC
              验证，以及渠道合作伙伴繁重的部署准备，多工作负载企业平台迁移的采购周期通常在 6 至 18 个月 [CM004, CM010]。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM008
              - CM010
              - CM011
