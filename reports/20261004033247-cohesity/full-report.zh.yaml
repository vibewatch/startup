  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              企业级数据保护已经从孤立的二级备份硬件设备，演进为集数据安全、网络韧性与云端数据管理于一体的统一平台。该市场边界涵盖软件、托管 SaaS
              平台以及受编排的金库隔离（Vaulting），用于保护覆盖本地基础设施、多云架构和 SaaS
              应用的混合企业工作负载。以往企业靠在零散孤岛中拼凑多款单点工具处理这些工作流，每年在分散的备份、归档、容灾和测试/开发环境上花费数百亿美元 [CM001,
              CM006]。现代品类则涵盖不可篡改快照保护、异常检测、自动化无毒净室恢复（Clean-room recovery）以及 AI 支持的二级数据查询 [CM002,
              CM004]。该边界不包括主生产存储硬件阵列、通用企业数据库、运维类安全信息和事件管理（SIEM）系统以及终端安全代理；这些系统虽通过 API 与数据保护系统对接，但属于独立的 IT
              预算中心。传统替代方案包括基于脚本的磁带归档、虚拟化原生快照以及老旧的本地介质服务器，此类方案不仅管理开销沉重，而且面对现代勒索软件威胁时缺乏自动化净室恢复能力 [CM004, CM009]。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM009
