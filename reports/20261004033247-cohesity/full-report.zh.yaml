              2024 年 12 月完成与 Veritas 企业数据保护业务的交易后，Cohesity 从一家高增长的新兴挑战者，跃升为按市场份额计全球最大的数据保护软件提供商。合并后的公司在全球为 12,000
              多家客户保护着数百 EB 的数据。其在头部大型企业中的渗透率极高，覆盖了超过 85 家 Fortune 100 企业以及近 70% 的 Global 500
              机构。从行业分布看，其采纳主要依托于对网络韧性与可用性有严格规定的大型强监管垂直行业：Cohesity 覆盖了全球前 10 大金融机构的全部 10 家、全球前 10 大制造企业的全部 10 家、全球前 10
              大医疗机构中的 8 家，以及全球前 10 大零售龙头中的 8 家。历史上，合并前的 Cohesity 拓展了包括 AutoNation、Hyatt、Bungie、LendingClub、Piedmont
