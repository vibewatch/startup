      - number: '2.4'
        title: 增长驱动催化剂、运营阻力与迁移瓶颈
        blocks:
          - type: paragraph
            body: >-
              现代化网络韧性架构的落地，既受到多种运营驱动因素的拉动，也面临严峻的技术限制。核心驱动力是企业勒索软件攻击与网络威胁的激增，这迫使企业必须具备快速不可篡改恢复、早期威胁搜寻与自动化异常检测能力，以防运营彻底瘫痪
              [CM002, CM004, CM010]。云端数据分层存储与服务化交付进一步刺激了需求，Enterprise Strategy Group
              研究显示，超过三分之二的企业正在使用云备份即服务，并试图清除分散的公有云副本 [CM008, CM011]。此外，Cohesity Gaia 等生成式 AI
              平台通过索引二级数据仓库实现安全的企业级检索增强生成（RAG），创造了新的变现潜力 [CM003, CM010]。但采纳速度也受到重大结构性障碍的制约：整合 Veritas
              庞大的企业客户群带来了长达数年的技术统一与销售周期复杂性，而 Rubrik、Veeam 和 Commvault 等更敏捷的对手正全力争抢处于过渡期的客户 [CM003, CM004, CM010,
              CM012]。宏观预算收紧、替换老旧磁带或硬件设施的高昂摩擦，以及未经核实的非公开公司运营指标，构成了持续的尽调风险 [CM010, CM013, CM014]。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 深度图表
        blocks:
          - type: callout
            title: 数据保护与网络恢复的市场融合
            body: >-
              企业备份不再被当作被动的存储保险来采购。备受关注的勒索软件事件和监管合规要求，已将预算控制权转移至安全高管手中，他们强制要求在多云环境中实现不可篡改金库隔离、快速自动化净室恢复以及 AI 驱动的威胁搜寻
              [CM002, CM004]。
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
          - type: callout
            title: 激烈竞争替换下的整合拖累
            body: >-
              尽管并入 Veritas 让 Cohesity 以约 19% 的市场份额跃居最大数据保护软件厂商，但整合两套迥异的代码库和全球销售体系带来了不少摩擦。在长达数年的过渡期内，Rubrik、Veeam 和
              Commvault 等更敏捷的竞手正全力抢夺其老旧存量客户 [CM003, CM004, CM010]。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接竞手、传统巨头与架构模式
        blocks:
          - type: paragraph
            body: >-
              企业数据保护与网络韧性格局分化为三条截然不同的竞争路线：防守异构大型机与数据库存量盘子的传统企业巨头、现代横向扩展网络韧性平台，以及纯软件走量专精厂商。在 2024 年 12 月与 Veritas
              企业数据保护业务合并后，合并后实体在分散的行业中跃升至市占率第一位，占据约 19% 的份额，为 13,600 家企业客户保护超过 100 EB 的数据。借此，Cohesity 将自身高增长的云原生架构与
              Veritas 稳固的企业客户群结合，包括覆盖 Global 500 企业的 NetBackup 部署。然而，这一体量让 Cohesity 与 Rubrik 狭路相逢——后者于 2024 年 4
              月完成首次公开募股，公开市场估值达 $17B。Rubrik 主打零信任网络恢复与云原生安全，而 Veeam 则通过硬件无关、按实例计费的许可模式，在中端市场和混合企业环境中保持装机量领先。与此同时，IBM（旗下
              IBM Storage Protect）等老牌基础设施厂商与混合云巨头 Commvault 争夺复杂的混合数据中心环境，云厂商提供的原生快照也构成入门级替代品。Cohesity 的应对策略是借助 Gaia 等
              AI 引擎将备份存储库定位为活跃的企业智能资产，但客户采纳仍需克服巨大的平台迁移成本。
