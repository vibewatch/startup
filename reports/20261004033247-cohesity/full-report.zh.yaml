  - id: FE001
    title: 基于证据的产品架构图
    type: stack
    summary: 产品涵盖工作负载连接器、保护与安全服务、管理平台、分布式数据层以及基础设施部署形态。
    data:
      layers:
        - label: 企业级工作负载
          detail: 虚拟化、数据库、SaaS、NAS、云端及其他受保护数据源
        - label: 数据保护
          detail: 策略、备份、快照、数据复制、索引恢复与还原工作流
        - label: 数据安全与洞察
          detail: 针对受保护企业数据实施的威胁防御控制与分析
        - label: 管理与自动化
          detail: 统一管理界面、节点运维、基础设施自动化与生态伙伴集成
        - label: 分布式数据平台
          detail: 横向扩展存储、全局重复数据删除、自适应分层、索引构建与 SnapTree
        - label: 部署基础设施
          detail: 自管节点、经认证的企业级硬件、BaaS 与混合云资源
    approximationNotes: 仅依据既定证据梳理的概念性技术栈；并非当前实际组件架构图，亦不代表所有服务共用同一套底层实现。
    claimRefs:
      - CE005
      - CE007
      - CE010
  - id: FU001
    title: Cohesity 企业客户旅程与扩张循环
    type: journey-map
    summary: 展示企业客户从初期二级备份迁移，到引入网络韧性，再到多工作负载 AI 扩张的典型演进路径。
    data:
      items:
        - label: 阶段 1：二级存储与备份整合
          summary: >-
            Customer eliminates legacy point solutions and replaces tape or siloed appliances with Cohesity DataProtect
            or NetBackup.
          touchpoints:
            - 评估 VMware、NAS 及数据库工作负载
            - 经由合作伙伴渠道部署（WWT、SHI、HPE）
            - 立竿见影缩减备份窗口与存储占用
        - label: 阶段 2：网络韧性与零信任数据隔离
          summary: Enterprise expands protection to counteract ransomware through immutable vaults and automated recovery.
          touchpoints:
            - 启用 Cohesity FortKnox 网络隔离保险库
            - 集成 Active Directory 保护与 ITDR
            - 执行保障业务连续性的无菌室（Clean Room）恢复演练
        - label: 阶段 3：多云与企业级 SaaS 拓展
          summary: Organization extends data protection coverage across hybrid cloud and SaaS estates.
          touchpoints:
            - 启用面向 Microsoft 365、Google Workspace 与 Salesforce 的连接器
            - 借助 Helios 统一监控本地与云端环境
            - 统合 Cohesity Data Cloud 与 Veritas Alta 的策略配置
        - label: 阶段 4：AI 洞察与数据智能（Gaia）
          summary: Customer activates retrieval-augmented generation on secondary data for operational intelligence.
          touchpoints:
            - 接入 Nvidia AI Enterprise 基础设施
            - 在二级数据归档中执行 RAG 检索
            - 自动化威胁扫描与异常告警
        - label: 阶段 5：自动化灾备恢复编排
          summary: >-
            Enterprise automates failover and disaster recovery validation across distributed data centers and cloud
            targets.
          touchpoints:
            - 持续容灾验证工作流
            - 零停机策略编排
            - 在关键业务系统中启用即时批量恢复（Instant Mass Recovery）
        - label: 阶段 6：持续合规与数据治理审计
          summary: >-
            Organization applies continuous data classification and regulatory reporting across all secondary data
            stores.
          touchpoints:
            - 自动化合规态势报告
            - 数据隐私与留存策略执行
            - 集成安全联盟合作伙伴的威胁情报源
    approximationNotes: 反映源自合作伙伴集成蓝图及平台功能层级的标准企业落地路径。
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
  - id: FR001
    title: 企业风险影响与发生概率矩阵
    type: matrix
    summary: 从发生概率与影响程度两个维度评估 Cohesity 主要风险走向，反映残留风险敞口水平。
    data:
      columns:
        - 中度影响
        - 高度影响
        - 严重影响
      rows:
        - label: 高发生概率
          values:
            - label: 数据恢复延迟
              tone: warning
            - label: 法律与监管罚款
              tone: high
            - label: 攻击者破坏备份
              tone: critical
        - label: 中发生概率
          values:
            - label: OEM 渠道冲突
              tone: neutral
            - label: 快照二次感染
              tone: high
            - label: Veritas 存量流失
              tone: critical
        - label: 低概率
          values:
            - label: 反垄断监管介入
              tone: neutral
            - label: AI 路线图分歧
              tone: neutral
            - label: 资本结构崩塌
              tone: warning
        - label: 高残余风险
          values:
            - label: 多工作负载补丁维护
              tone: neutral
            - label: 突破 RTO SLA
              tone: warning
            - label: 勒索赎金要求
              tone: critical
        - label: 中残余风险
          values:
            - label: 控制台 UI 对齐
              tone: neutral
            - label: 合作伙伴迁移延迟
              tone: neutral
            - label: 估值倍数压缩
              tone: warning
        - label: 低残余风险
          values:
            - label: 主权云落地阻力
              tone: neutral
            - label: RAG 延迟恶化
              tone: neutral
            - label: 老股估值下调
              tone: warning
    approximationNotes: 矩阵分类综合了调研实测故障率、客户评价倾向以及交易风险特征。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR008
      - CR010
      - CR011
  - id: FV001
    title: 建议推导逻辑链
    type: flow
    summary: 从经营规模与市场领先地位出发，逐步推导至估值立场，最终得出观察的建议结论。
    data:
      nodes:
        - id: scale
          label: 企业级规模（$1.5B+ ARR 与 19% 份额）
        - id: profitability
          label: 调整后盈利能力（28% 利润率）
        - id: friction
          label: 业务整合与债务负担
        - id: expectations
          label: CEO 目标：对标 Rubrik 达到 $17B
        - id: reality
          label: 老股估值锚定在 $7B-$8B
        - id: decision
          label: 建议：观察（估值合理）
      edges:
        - from: scale
          to: profitability
        - from: profitability
          to: friction
        - from: friction
          to: expectations
        - from: expectations
          to: reality
        - from: reality
          to: decision
    approximationNotes: 该战略决策层级综合了管理层表态、并购整合范围以及市场估值数据。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
      - CV011
