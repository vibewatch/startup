callouts:
  - calloutType: risk
    title: Funding and valuation do not establish runway
    body: The retained funding totals, round descriptions, and secondary valuation marks use different scopes and cannot establish current cash, debt, burn, or ownership economics.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
  - calloutType: recommendation
    title: Require a post-Veritas financial data room
    body: Underwriting should remain conditional on audited statements, a debt and preference schedule, recurring-revenue definitions, cohort retention, realized pricing, and product-level gross margins.
    claimRefs:
      - CI004
      - CI016
