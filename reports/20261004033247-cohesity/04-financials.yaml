company:
  name: Cohesity
chapter:
  number: 4
  title: Financials
  summary: Cohesity appears to monetize protected-data capacity through custom enterprise subscriptions, deployment bundles, and add-on modules, but retained public evidence does not disclose current revenue, ARR, margins, burn, cash, debt, or runway. Historical growth and financing signals show scale, while inconsistent private-market records and opaque post-Veritas economics prevent a reliable capital-adequacy or unit-economics underwriting.
sections:
  - id: revenue-architecture
    title: Revenue Architecture and Delivery Mix
    body: |
      Public evidence supports a capacity-led enterprise model rather than a transparent seat-priced SaaS model. RFP.wiki describes quote-based subscriptions measured in backend terabytes, covering DataProtect, replica and retention entitlements, SmartFiles, archive, and DataProtect-as-a-Service. It also describes software-only, integrated-appliance, and managed-service deployment choices. Cohesity itself says the platform protects more than 1,000 hybrid-cloud and SaaS workloads, while UpMarket describes coverage across cloud, on-premises, and SaaS environments. Together, these sources indicate several monetization surfaces: protected capacity, deployment form, contract duration, and module attachment. They do not disclose revenue mix, recognition policy, renewal behavior, or the gross-profit contribution of each surface, so the bridge below is structural rather than numerical.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-and-go-to-market
    title: Pricing Opacity and Go-to-Market Economics
    body: |
      Cohesity does not publish an enterprise list price in the retained evidence. RFP.wiki reports customary one-, three-, and five-year terms and gives a directional software-only market range of roughly $150 to $400 per backend terabyte annually, while warning that appliances, managed delivery, retention, replication, implementation, and optional cyber-resilience modules can raise total cost. Those figures are third-party estimates, not Cohesity quotes or realized-price evidence. Historical company releases show that capital was directed toward worldwide sales and marketing, research and development, and strategic routes through HPE and Cisco. That history supports an enterprise and partner-assisted motion, but current sales cycle, channel take rate, quota productivity, CAC, payback, and discount dispersion remain private.
    claimRefs:
      - CI002
      - CI006
      - CI007
      - CI010
      - CI016
    tableRefs:
      - TI002
  - id: traction-and-financing
    title: Historical Traction and Financing Signals
    body: |
      The strongest operating disclosures in the assigned evidence are old. Cohesity reported that annual revenue increased 600 percent from 2016 to 2017 and that more than 200 enterprise customers selected the company during two quarters reported in 2018. These are useful evidence of early commercial acceleration, not current revenue or ARR. Financing references are more recent but use different scopes: Tracxn reports $810 million of total funding, UpMarket reports a $950 million Series H in December 2024 at a $7 billion post-money valuation, and Forge reports a derived secondary-market price of $15.67 and $4.69 billion valuation as of June 13, 2026. Funding raised is not cash available, and a modeled secondary value is not an operating-performance measure.
    claimRefs:
      - CI008
      - CI009
      - CI011
      - CI012
      - CI013
      - CI014
  - id: unit-economics-and-verdict
    title: Unit Economics, Capital Adequacy, and Verdict
    body: |
      The financial verdict is therefore evidence-constrained. Cohesity addresses a costly buyer problem: Tech Insider reports a Cohesity-linked survey in which CEOs estimated an average 15.17 percent revenue impact from a cyberattack. That supports willingness-to-pay logic, but it does not establish Cohesity's own growth, retention, pricing realization, or profitability. RFP.wiki also records complaints about high cost and difficult-to-predict packaging, creating a plausible pricing-pressure and implementation-friction risk. With no current audited income statement, balance sheet, cash-flow statement, debt schedule, cohort retention, or channel economics in the assigned pool, revenue quality and margin path cannot be underwritten. The immediate diligence priority is a post-Veritas financial package that separates legacy cohorts and reconciles cash, debt, burn, and recurring revenue definitions.
    claimRefs:
      - CI015
      - CI016
      - CI004
    tableRefs:
      - TI003
tables:
  - id: TI001
    title: Revenue Streams and Monetization Surfaces
    columns:
      - Stream
      - Mechanism
      - Charging unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - DataProtect subscriptions
        - Term entitlement for backup and data protection
        - Backend terabytes
        - Quote-based; list price unavailable
        - Recurrence plausible, but renewal data unavailable
        - Revenue, ARR, renewal, and expansion by cohort
      - - DataProtect-as-a-Service
        - Managed cloud delivery
        - Capacity and service bundle
        - Publicly identified offering; realized pricing unavailable
        - Hosting burden and margin are unknown
        - DPaaS revenue mix and cloud gross margin
      - - Integrated appliance deployment
        - Software combined with certified hardware
        - Capacity and appliance configuration
        - Custom quote
        - Hardware mix may reduce comparability with software revenue
        - Hardware revenue, cost, and recognition policy
      - - SmartFiles and archive
        - Additional data-management entitlements
        - Capacity and feature scope
        - Included in public entitlement descriptions
        - Attach and expansion economics unavailable
        - Module attach rate and standalone pricing
      - - Cyber-resilience add-ons
        - Optional security and recovery modules
        - Module and protected-capacity scope
        - Third-party uplift estimates only
        - Potential expansion revenue; realized mix unknown
        - Module-level bookings, retention, and contribution margin
    notes: "The table maps publicly described monetization surfaces; it does not assert revenue recognition, revenue mix, or realized pricing where the retained sources do not disclose them."
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI007
  - id: TI002
    title: Pricing and Commercial Terms
    columns:
      - Component
      - Contract or unit
      - Public evidence
      - Limitation
      - Diligence ask
    rows:
      - - Base subscription
        - Backend terabytes
        - Custom enterprise quote
        - No public list or realized-price schedule
        - Price book and invoice sample by segment
      - - Contract term
        - Commonly 1, 3, or 5 years
        - Third-party commercial review
        - Mix, prepayment, and renewal terms unavailable
        - Contract-duration and billing-frequency distribution
      - - Software-only benchmark
        - Annual price per backend terabyte
        - Approximately $150-$400 reported market range
        - Directional third-party estimate, not an official quote
        - Recent won-deal pricing and discount waterfall
      - - Appliance or managed bundle
        - Hardware or hosted service plus software
        - Reported above software-only cost
        - Configuration and service scope vary
        - Separated software, hardware, hosting, and support prices
      - - Optional modules
        - Add-on subscription
        - Reported deployment uplift of 15%-40%
        - Not an official or universal rate
        - Attach, discount, churn, and margin by module
    notes: "All monetary ranges and uplifts are RFP.wiki estimates; Cohesity does not disclose a public list price in the retained pool, and realized enterprise pricing remains unknown."
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI016
  - id: TI003
    title: Unit Economics and Capital-Adequacy Gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Current revenue and ARR
        - Not established in retained evidence
        - low
        - Defines scale and recurring-revenue quality
        - Audited revenue plus ARR definition and reconciliation
      - - Gross margin
        - Not established in retained evidence
        - low
        - Tests software, appliance, and hosted-delivery mix
        - Gross margin by product and deployment model
      - - Net revenue retention
        - Not established in retained evidence
        - low
        - Measures renewal, expansion, and cohort durability
        - NRR and gross retention by legacy cohort
      - - CAC and payback
        - Not established in retained evidence
        - low
        - Tests enterprise and partner-led sales efficiency
        - Fully loaded CAC, sales cycle, and payback by segment
      - - Cash balance
        - Not established in retained evidence
        - low
        - Funding raised does not equal liquidity
        - Current unrestricted cash and minimum-cash covenants
      - - Accounting loss and cash burn
        - Not established in retained evidence
        - low
        - Accounting loss is not the same measure as cash burn
        - GAAP net loss and operating/free cash flow bridge
      - - Debt and transaction obligations
        - Not established in retained evidence
        - low
        - Debt service and covenants can constrain reinvestment
        - Principal, rate, maturity, covenants, and preference stack
      - - Runway
        - Not computable from retained evidence
        - low
        - Requires both available cash and normalized cash burn
        - Board plan with downside cases and next-financing trigger
    notes: "Null metrics are intentional evidence gaps, not zero values; private-market valuations and cumulative funding cannot substitute for operating statements, cash availability, or debt disclosures."
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
