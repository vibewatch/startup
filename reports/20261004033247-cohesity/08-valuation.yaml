      - ["Base Case", "Blended organic growth in low-teens, ARR reaches $1.7B-$1.8B, stable margins", "5.0x - 6.0x P/S", "$9.0B - $10.8B", "50%"]
      - ["Bear Case", "Legacy Veritas attrition, integration drag, ARR growth stalls below 5%", "3.5x - 4.5x P/S", "$5.5B - $7.0B", "20%"]
      - ["Severe Downside", "Accelerated migration to public cloud backup, legacy churn >20%, debt restructuring", "2.0x - 2.5x P/S", "$3.0B - $4.0B", "5%"]
    notes: "Assumes late 2026 exit window based on 12-month post-merger track record and peer market comparisons."
