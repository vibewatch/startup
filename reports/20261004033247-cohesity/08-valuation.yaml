chapter:
  number: 8
  title: "Valuation"
  summary: "Cohesity stands as the scaled enterprise market share leader in cyber resilience post-Veritas merger with over $1.5B in ARR, but public market valuation expectations benchmarking against Rubrik's $17B market cap face material execution, debt, and multiple compression hurdles. With recent private and secondary marks cluster-anchored between $7B and $8B, an investment stance of 'track' remains prudent pending debt structure disclosure and stand-alone organic retention proof."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "Cohesity's primary investment thesis centers on its newly acquired position as the largest data protection software vendor globally following its combination with Veritas's enterprise data protection unit, commanding an industry-leading 19% market share in enterprise backup and data security [CV001, CV002]. The combined entity entered 2025-2026 with an annualized recurring revenue base exceeding $1.5 billion and an adjusted profit margin of 28%, creating an enterprise platform that pairs Cohesity's modern high-growth cyber resilience and AI capabilities with Veritas's vast Fortune 500 installed base [CV003, CV004]. Strategic backing from major technology and ecosystem anchors including Nvidia, IBM, SoftBank, and Cisco further solidifies its position as an enterprise standard in cyber resilience and generative AI data management through products like Cohesity Gaia [CV005, CV006]. However, the counter-thesis is substantial: executive aspirations to achieve an IPO valuation rivaling or exceeding Rubrik's $17 billion public capitalization demand a forward multiple expansion that is difficult to justify without audited disclosure of organic versus legacy growth rates [CV001, CV003]. Furthermore, corporate survey research highlights that 70% of public firms suffer earnings guidance cuts and 68% experience stock declines post-breach, underscoring systemic execution risks across cybersecurity customers [CV007]. Integrating Veritas's slower-growth legacy software assets while managing post-merger debt overhang presents a formidable execution risk, leaving private secondary valuation marks of $7B to $8B as a realistic ceiling rather than a floor [CV008, CV009]."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation Stance and Entry Discipline"
    body: "We assign Cohesity a recommendation of track with medium confidence, a high risk rating, and a fair valuation stance relative to its last institutional and secondary marks [CV001, CV008]. While the company's operating scale of $1.5 billion ARR and 12,000 to 13,000 customers provides a durable downside buffer, private market transactions—including an estimated secondary price of $19.80 per share and transaction marks between $7.0 billion and $8.0 billion—fully price in the baseline merger combination [CV003, CV008, CV010, CV011]. Institutional entry discipline requires avoiding secondary markups until the enterprise provides audited financial transparency regarding debt debt quantum, covenant obligations, and net revenue retention across legacy Veritas accounts [CV001, CV009]. If Cohesity attempts an initial public offering in late 2026 seeking Rubrik's 12.75x EV/sales multiple, public equity markets are likely to enforce a steep conglomerate discount due to Veritas's low-single-digit pre-merger growth profile [CV001, CV003]. Therefore, institutional investors should track the asset through its initial post-merger audited reporting periods rather than pursuing private secondary liquidity at current tender marks [CV008, CV011]."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV001"
  - id: "scenario-analysis-and-comparables"
    title: "Scenario Analysis, Peer Multiples, and Exit Readiness"
    body: "Valuation underwriting requires evaluating Bull, Base, and Bear scenarios against public comps Rubrik and Commvault [CV001]. Rubrik trades at approximately 12.75x price-to-sales on a pure-play cloud security growth profile, while Commvault trades at roughly 7.16x price-to-sales on mature, cash-generative operations [CV001]. In our Base Case (50% probability), Cohesity achieves modest post-merger organic growth in the low teens, commanding a 5.0x to 6.0x multiple on an estimated $1.8B forward ARR base, yielding an enterprise valuation of $9.0B to $10.8B at a late 2026 IPO [CV001, CV003]. In the Bull Case (25% probability), successful cross-selling of Cohesity Gaia AI search and cloud data resilience into Veritas's accounts accelerates blended ARR expansion toward 20%, unlocking a peer-comparable 8.5x multiple and a $16.0B to $17.0B valuation [CV001, CV006]. Conversely, in the Bear Case (25% probability), integration frictions, debt service pressures, and customer churn among legacy Veritas cohorts compress growth into the mid-single digits, resulting in a Commvault-like or discounted private equity multiple of 3.5x to 4.5x, valuing equity at $5.5B to $7.0B [CV001, CV003, CV009]. Downside protection is established by Cohesity's historical equity capitalization, including $810M raised across 7 venture rounds through Series F and institutional support from Carlyle, SoftBank, and Sequoia [CV009, CV012]."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV006"
      - "CV009"
      - "CV012"
    tableRefs:
      - "TV003"
