chapter:
  number: 6
  title: "Customers"
  summary: "Cohesity transformed its customer footprint through the December 2024 combination with Veritas' data protection business, scaling to over 12,000 customers including over 85 of the Fortune 100 and nearly 70% of the Global 500. However, customer durability and net expansion now hinge on managing a complex dual-platform migration under its 'No Customer Left Behind' pledge without driving accounts to aggressive competitors."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Base Segmentation and Enterprise Footprint"
    body: "Following the completion of its transaction with Veritas' enterprise data protection business in December 2024, Cohesity expanded its installed base from an emerging high-growth challenger into the world's largest data protection software provider by market share. The combined company protects hundreds of exabytes of data across more than 12,000 customers globally. Its penetration into top-tier enterprise accounts is substantial, counting over 85 of the Fortune 100 and nearly 70% of the Global 500 organizations as active clients. Sectoral adoption is anchored in large-scale, highly regulated verticals with demanding cyber-resilience and availability mandates: Cohesity serves all ten of the top ten global financial institutions, all ten of the top ten global manufacturers, eight of the top ten healthcare providers, and eight of the top ten global retail leaders. Historically, legacy Cohesity expanded across diverse enterprise commercial accounts and public-sector agencies including AutoNation, Hyatt, Bungie, LendingClub, Piedmont Healthcare, and the U.S. Department of Energy, but the Veritas transaction concentrated strategic revenue in the global enterprise tier."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "deployment-scale-and-adoption"
    title: "Adoption Trajectory, Channel Scale, and Channel Alliances"
    body: "Cohesity's go-to-market scale and customer deployment velocity rely on a massive joint ecosystem comprising major systems integrators, value-added resellers, and infrastructure hardware OEMs. Value-added technology partners such as World Wide Technology (WWT) and SHI International play central roles in customer architecture, deployment, and operationalization. Partner environments implement Cohesity Data Cloud and DataProtect across diverse production workloads—including VMware, Hyper-V, SQL Server, Network Attached Storage (NAS), and Active Directory—while configuring cyber-vaulting options such as FortKnox and identity threat detection. Additionally, strategic channel integrations with Cisco, Hewlett Packard Enterprise (HPE), and Nvidia provide validated turnkey appliances and accelerated compute platforms that facilitate enterprise rollouts. However, customer research indicates that modern enterprise buyers increasingly face operational pressure from accelerating attack speeds and ransomware extortion, compelling organizations to prioritize business recovery validation and data immutability over basic point-solution backups."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "retention-expansion-and-concentration"
    title: "Customer Durability, Dual-Portfolio Risks, and Mindshare Competition"
    body: "Customer retention and durability represent both Cohesity's greatest opportunity and its primary operational vulnerability. To reassure enterprise NetBackup and Alta customers against forced deprecation, Cohesity instituted a public 'No Customer Left Behind' pledge, committing to multi-year support, pricing lock-ins, and unified management across both legacy platforms via Cohesity Helios. Despite these commitments, independent industry tracking on platforms like PeerSpot indicates that Cohesity Data Cloud held only a 1.1% category mindshare in Backup and Recovery in late 2026, trailing IBM Storage Protect (1.7%) and market leaders. Furthermore, candidate and industry intelligence compiled by Built In emphasizes that the combination created a dual-portfolio reality with overlapping products, where near-term customer retention and expansion depend heavily on clear roadmap convergence, licensing alignment, and predictable migration paths. In the broader market, peer leaders such as Rubrik and Commvault aggressively target enterprise accounts undergoing vendor integration transitions."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
