companyProfile:
  summary: >-
    Cohesity is a private, enterprise-focused data security and cyber-resilience platform that combines backup,
    recovery, security, and data management across hybrid cloud, SaaS, and on-premises environments. The company
    completed its Veritas enterprise data protection combination in December 2024 and now operates as a scaled
    post-merger business with a large installed base, strategic investor backing, and meaningful leverage and
    integration complexity.
