callouts:
  - calloutType: "risk"
    title: "Post-Merger Integration Friction vs. Agile Pure-Play Rivals"
    body: "Cohesity's aggressive expansion and Veritas merger legacy create operational friction as the company balances multiple overlapping product roadmaps, workforce restructuring, and ongoing enterprise NetBackup migrations. While accelerating immediate market share scale to 19%, this complexity leaves Cohesity vulnerable to agile competitors like Rubrik and Veeam that actively run takeout campaigns against legacy enterprise accounts."
    claimRefs:
      - "CP002"
      - "CP016"
  - calloutType: "strength"
    title: "Defensible IP Moat in Enterprise Secondary Data RAG"
    body: "By securing U.S. Patent No. 12,619,501 for Cohesity Gaia in June 2026, Cohesity converted its secondary-data AI inference capability into an enforceable legal moat. Competitors seeking to provide generative AI retrieval on backup repositories without costly external ETL must either architect workarounds or risk infringing on Cohesity's protected intellectual property."
    claimRefs:
      - "CP014"
      - "CP015"
