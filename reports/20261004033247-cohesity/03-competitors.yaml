chapter:
  number: 3
  title: "Competitors"
  summary: "Cohesity operates as a consolidated enterprise data protection and cyber resilience leader following its December 2024 merger with Veritas' enterprise business, commanding an estimated 19% market share and $1.5B in ARR. It faces aggressive direct competition from pure-play cyber resilience unicorn Rubrik and volume leader Veeam, alongside hybrid incumbent Commvault and legacy storage providers like IBM. While Cohesity defends its perimeter with patented retrieval-augmented generation IP on backup archives and strategic alliances with Nvidia and HPE, competitors attack its post-merger integration complexity, appliance hardware dependency, and partner-OEM product assembly."
sections:
  - id: "competitive-landscape-and-segmentation"
    title: "Competitive Landscape: Direct Peers, Incumbents, and Architecture Models"
    body: "The enterprise data protection and cyber resilience landscape is split across three distinct competitive vectors: legacy enterprise incumbents defending heterogeneous mainframe and database footprints, modern scale-out cyber resilience platforms, and software-first volume specialists. Following Cohesity's merger with Veritas' enterprise data protection business in December 2024, the combined entity vaulted to the number one market share position with approximately 19% of an otherwise fragmented industry, protecting over 100 exabytes of data across 13,600 enterprise accounts. In doing so, Cohesity combined its high-growth cloud-native architecture with Veritas' established enterprise accounts, including NetBackup installations across the Global 500. However, this scale puts Cohesity into direct confrontation with Rubrik, which completed an initial public offering in April 2024 at a $17 billion public market valuation. While Rubrik built its posture around zero-trust cyber recovery and cloud-native security, Veeam continues to lead volume adoption via hardware-agnostic, instance-based licensing across mid-market and hybrid enterprise estates. Simultaneously, legacy infrastructure players such as IBM (with IBM Storage Protect) and hybrid incumbent Commvault contest complex hybrid data center environments, while cloud providers offer native snapshotting that serves as an entry-level substitute. Cohesity's strategic response centers on positioning backup repositories as active corporate intelligence assets through AI engines like Gaia, though customer adoption requires navigating significant platform migration overhead."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "capability-and-pricing-matrix"
    title: "Capability Comparisons, Architectural Friction, and Commercial Models"
    body: "Evaluating enterprise backup platforms exposes stark divergence in cyber-recovery mechanics, architecture packaging, and total cost of ownership. Direct competitor comparisons highlight that while Cohesity emphasizes scale-out file systems and post-ingest threat scanning across its Data Cloud, rival Veeam attacks Cohesity's operational constraints. Veeam criticizes Cohesity for lacking continuous inline threat scanning during initial data ingest, relying instead on scheduled post-ingest scans or external incident response partners like Mandiant. Furthermore, architectural friction emerges in cloud recovery: whereas Veeam offers cross-platform hypervisor recovery directly to public cloud infrastructure without proprietary hypervisor dependencies, Cohesity deployments historically require standing up cluster appliances or VMware compute within cloud targets. Commercially, pricing structures introduce major evaluation friction. Cohesity packages software via backend-terabyte (BETB) subscription capacity licensing, typically running between $150 and $400 per TB annually before accounting for cyber-resilience add-ons like FortKnox or DataHawk, which can inflate deployment spend by 15% to 40%. Conversely, Veeam promotes predictable instance-based pricing without capacity penalties, while Commvault publishes baseline SaaS prices for endpoint and Microsoft 365 workloads while keeping enterprise front-end terabyte (FETB) contracts heavily negotiated. In secondary platforms like IBM Storage Protect, heavy initial setup costs and complex administration contrast with Cohesity's unified single-pane interface, although PeerSpot buyer engagement data reveals IBM maintaining 1.7% category mindshare against Cohesity's 1.1%."
    claimRefs:
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
    tableRefs:
      - "TP002"
      - "TP003"
  - id: "moat-durability-and-integration-risks"
    title: "Moat Durability, Intellectual Property, and Platform Assembly Vulnerabilities"
    body: "Cohesity's competitive moat rests on three pillars: scale-out file system defensibility, deep ecosystem partnerships, and newly patented AI retrieval intellectual property. On June 3, 2026, Cohesity was granted U.S. Patent No. 12,619,501 for Cohesity Gaia, establishing a protected legal perimeter around running generative AI retrieval-augmented generation (RAG) directly against secondary backup and archive stores in-place without data replication or external pipeline exposure. Backed by strategic equity investments and technical alliances from Nvidia, HPE, and Cisco, Cohesity integrates directly with enterprise hardware ecosystems and modern AI acceleration stacks, while incorporating OEM modules like Cyera for DSPM. Nevertheless, significant adverse vulnerabilities threaten long-term moat durability. Competitor intelligence notes that Cohesity's broader cyber-resilience platform is increasingly assembled from acquired and OEM components: DSPM capabilities rely on resold technology from Cyera (anchored in a US-AWS control plane), identity threat detection and response is OEM'd from Semperis, and the core NetBackup foundation was acquired from Veritas. This multi-roadmap structure creates engineering integration friction. Furthermore, post-merger integration risks surfaced following workforce reductions in mid-2024 and executive turnover, creating potential renewal churn as legacy Veritas accounts face migration decisions amid aggressive takeout campaigns from Rubrik and Commvault."
    claimRefs:
      - "CP014"
      - "CP015"
      - "CP016"
