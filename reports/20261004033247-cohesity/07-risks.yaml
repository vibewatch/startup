callouts:
  - calloutType: "risk"
    title: "Post-Merger Veritas Legacy Retention Risk"
    body: "The consolidation of Veritas's data protection business into Cohesity accounts for 14% of the combined company's 19% industry market share. Because Veritas customers operate legacy on-premises workloads, competitors like Rubrik and Commvault are aggressively targeting this customer base during modernization cycles. Churn among inherited accounts represents the primary risk to Cohesity's mid-teens revenue growth objectives."
    claimRefs:
      - "CR010"
      - "CR011"
  - calloutType: "insight"
    title: "The Secondary Storage Attack Surface"
    body: "Cyber recovery has shifted from a routine IT operation to a primary attack target. With 89% of impacted organizations in surveyed regions paying extortion ransoms and 97% experiencing recovery durations in excess of 24 hours, secondary backup storage security directly dictates whether a business can withstand material ransomware events."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
