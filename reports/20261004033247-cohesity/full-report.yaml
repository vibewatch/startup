  - id: FE001
    title: Evidence-Based Product Architecture Map
    type: stack
    summary: >-
      The product spans workload connectors, protection and security services, management, a distributed data layer, and
      infrastructure deployment choices.
    data:
      layers:
        - label: Enterprise workloads
          detail: Virtualized, database, SaaS, NAS, cloud, and other protected data sources
        - label: Data Protection
          detail: Policy, backup, snapshots, replication, indexed recovery, and restore workflows
        - label: Data Security and Insights
          detail: Threat-oriented controls and analysis applied to protected enterprise data
        - label: Management and automation
          detail: Unified interface, node operations, infrastructure automation, and partner integrations
        - label: Distributed data platform
          detail: Scale-out storage, global deduplication, adaptive tiering, indexing, and SnapTree
        - label: Deployment infrastructure
          detail: Self-managed nodes, validated enterprise hardware, BaaS, and hybrid-cloud resources
