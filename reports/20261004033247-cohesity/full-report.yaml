chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Foundation
        blocks:
          - type: paragraph
            body: >-
              Cohesity was founded in 2013 by computer scientist Mohit Aron, who previously engineered the Google File
              System and co-founded Nutanix before pioneering hyperconverged secondary data architecture. Headquartered
              in San Jose, California, the company operates as a privately held software provider delivering AI-powered
              data security, backup, disaster recovery, and unstructured data management across hybrid cloud,
              multicloud, and on-premises environments. In August 2022, Sanjay Poonen took over executive leadership as
              Chief Executive Officer and President, bringing executive experience from VMware and SAP, while Aron
              transitioned to Founder Emeritus. Cohesity monetizes through software licenses, appliance bundles, and
              managed Software-as-a-Service subscriptions via its Cohesity Data Cloud platform, serving over 12,000
              customers globally, including more than 85 of the Fortune 100.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO009
