      - number: '3.2'
        title: Capability Comparisons, Architectural Friction, and Commercial Models
        blocks:
          - type: paragraph
            body: >-
              Evaluating enterprise backup platforms exposes stark divergence in cyber-recovery mechanics, architecture
              packaging, and total cost of ownership. Direct competitor comparisons highlight that while Cohesity
              emphasizes scale-out file systems and post-ingest threat scanning across its Data Cloud, rival Veeam
              attacks Cohesity's operational constraints. Veeam criticizes Cohesity for lacking continuous inline threat
              scanning during initial data ingest, relying instead on scheduled post-ingest scans or external incident
              response partners like Mandiant. Furthermore, architectural friction emerges in cloud recovery: whereas
              Veeam offers cross-platform hypervisor recovery directly to public cloud infrastructure without
              proprietary hypervisor dependencies, Cohesity deployments historically require standing up cluster
              appliances or VMware compute within cloud targets. Commercially, pricing structures introduce major
              evaluation friction. Cohesity packages software via backend-terabyte (BETB) subscription capacity
              licensing, typically running between $150 and $400 per TB annually before accounting for cyber-resilience
              add-ons like FortKnox or DataHawk, which can inflate deployment spend by 15% to 40%. Conversely, Veeam
              promotes predictable instance-based pricing without capacity penalties, while Commvault publishes baseline
              SaaS prices for endpoint and Microsoft 365 workloads while keeping enterprise front-end terabyte (FETB)
              contracts heavily negotiated. In secondary platforms like IBM Storage Protect, heavy initial setup costs
              and complex administration contrast with Cohesity's unified single-pane interface, although PeerSpot buyer
              engagement data reveals IBM maintaining 1.7% category mindshare against Cohesity's 1.1%.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP003
