  - id: FU001
    title: Cohesity Enterprise Customer Journey and Expansion Loop
    type: journey-map
    summary: >-
      Illustrates the typical enterprise customer path from initial secondary backup migration through cyber resilience
      adoption to multi-workload AI expansion.
    data:
      items:
        - label: 'Phase 1: Secondary Storage & Backup Consolidation'
          summary: >-
            Customer eliminates legacy point solutions and replaces tape or siloed appliances with Cohesity DataProtect
            or NetBackup.
          touchpoints:
            - Workload assessment across VMware, NAS, and databases
            - Deployment via partner channel (WWT, SHI, HPE)
            - Immediate reduction in backup windows and storage footprint
        - label: 'Phase 2: Cyber Resilience & Zero Trust Vaulting'
          summary: Enterprise expands protection to counteract ransomware through immutable vaults and automated recovery.
          touchpoints:
            - Activation of Cohesity FortKnox cyber vaulting
            - Integration with Active Directory protection and ITDR
            - Clean Room recovery testing for business continuity
        - label: 'Phase 3: Multi-Cloud & Enterprise SaaS Extension'
          summary: Organization extends data protection coverage across hybrid cloud and SaaS estates.
          touchpoints:
            - Connector enablement for Microsoft 365, Google Workspace, and Salesforce
            - Unified monitoring across on-prem and cloud via Helios
            - Policy harmonization across Cohesity Data Cloud and Veritas Alta
        - label: 'Phase 4: AI Insights & Data Intelligence (Gaia)'
          summary: Customer activates retrieval-augmented generation on secondary data for operational intelligence.
          touchpoints:
            - Integration with Nvidia AI Enterprise infrastructure
            - RAG search across secondary data archives
            - Autonomous threat scanning and anomaly alerting
        - label: 'Phase 5: Automated Recovery Orchestration'
          summary: >-
            Enterprise automates failover and disaster recovery validation across distributed data centers and cloud
            targets.
          touchpoints:
            - Continuous DR validation workflows
            - Zero-downtime policy orchestration
            - Instant Mass Recovery enablement across mission-critical systems
        - label: 'Phase 6: Continuous Compliance & Governance Auditing'
          summary: >-
            Organization applies continuous data classification and regulatory reporting across all secondary data
            stores.
          touchpoints:
            - Automated compliance posture reporting
            - Data privacy and retention enforcement
            - Threat feed integration with security alliance partners
    approximationNotes: >-
      Represents standard enterprise adoption progression derived from partner integration blueprints and platform
      feature tiers.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
