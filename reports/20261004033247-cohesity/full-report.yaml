      - number: '1.2'
        title: Financing History, Veritas Combination, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Before its landmark combination with Veritas' enterprise data protection business, Cohesity raised over
              $650 million in equity across multiple venture rounds, anchored by early backing from Sequoia Capital,
              Wing Venture Capital, and SoftBank Vision Fund's $250 million Series D in 2018. Following a confidential
              IPO filing in December 2021 that was subsequently shelved, Cohesity executed a transformative transaction
              announced in February 2024 and completed in December 2024, acquiring Veritas' core data protection segment
              for approximately $2.5 billion in cash and an estimated 20.9% equity stake in the combined entity. The
              transaction valued the combined business at approximately $7 billion, funded via a Series H equity round
              led by Haveli Investments and substantial term loan B debt arranged by J.P. Morgan, which also served to
              facilitate a debt paydown for Veritas Technologies. The carve-out separated Veritas' enterprise data
              protection assets—including NetBackup and Alta—from its remaining InfoScale, Compliance, and Backup Exec
              operations, which were spun into an autonomous company named DataCo under Carlyle.
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO007
              - CO010
              - CO013
