figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological evolution of Cohesity from its 2013 founding to its 2024 $7 billion Veritas acquisition and
      cyber-resilience positioning.
    data:
      items:
        - date: '2013-06-01'
          label: Company Founding
          detail: Mohit Aron incorporates Cohesity in California to pioneer hyperconverged secondary data architecture.
          tone: positive
        - date: '2017-04-01'
          label: Series C Funding
          detail: Raises $90 million Series C led by GV and Sequoia Capital to expand secondary storage market footprint.
          tone: positive
        - date: '2018-06-11'
          label: Series D & SoftBank Backing
          detail: Secures $250 million Series D led by SoftBank Vision Fund, bringing total equity funding to $410 million.
          tone: positive
        - date: '2021-03-01'
          label: Tender Offer & $3.7B Valuation
          detail: >-
            Completes $145 million secondary tender setting valuation at $3.7 billion, followed by confidential IPO
            filing in December.
          tone: neutral
        - date: '2022-08-01'
          label: Leadership Transition
          detail: Sanjay Poonen appointed CEO and President; founder Mohit Aron transitions to Founder Emeritus.
          tone: positive
        - date: '2024-02-08'
          label: Veritas Combination Announced
          detail: Definitive agreement to combine with Veritas data protection business for $2.5B cash and equity stake.
          tone: opportunity
        - date: '2024-12-10'
          label: Veritas Merger Completed
          detail: Closes Veritas transaction valued at approximately $7 billion, funded by Haveli-led Series H and debt.
          tone: positive
        - date: '2026-07-01'
          label: Platform Integration Progress
          detail: >-
            KuppingerCole analyst assessment highlights operational integration of Cohesity Data Cloud 18 months
            post-announcement.
          tone: neutral
    approximationNotes: Dates represent formal public announcements or disclosed transaction completion milestones.
    claimRefs:
