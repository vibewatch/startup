      - number: '2.3'
        title: Enterprise Buyer Profiles, Procurement Centers, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Purchasing authority for enterprise cyber resilience platforms is governed primarily by the Chief
              Information Security Officer (CISO) and the Chief Information Officer (CIO) or Vice President of
              Infrastructure, reflecting the operational convergence of cybersecurity and disaster recovery.
              Historically, secondary backup was treated as an operational infrastructure expense evaluated on storage
              density, recovery point objectives (RPO), and recovery time objectives (RTO). In the current threat
              landscape, enterprise procurement requires executive cyber-risk sign-off, multi-workload validation,
              immutable storage guarantees, and integration with incident response workflows [CM004, CM008]. Adoption
              pathways follow hybrid deployment models: enterprise accounts deploy scale-out software fabrics or
              appliances to consolidate data center and private cloud silos, while expanding into managed
              Backup-as-a-Service (BaaS) and Data Management-as-a-Service (DMaaS) models hosted on public clouds such as
              AWS [CM001, CM005, CM011]. Procurement cycles for multi-workload enterprise platform migrations typically
              range from 6 to 18 months due to stringent security reviews, proof-of-concept testing against live backup
              targets, and extensive channel partner staging [CM004, CM010].
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM008
              - CM010
              - CM011
      - number: '2.4'
        title: Growth Catalysts, Operational Headwinds, and Migration Constraints
        blocks:
          - type: paragraph
            body: >-
              The adoption of modernized cyber resilience architectures is propelled by compounding operational drivers
              alongside severe technical constraints. The primary market driver is the surge in enterprise ransomware
              attacks and cyber threats, which necessitates rapid immutable recovery, early threat hunting, and
              automated anomaly detection to prevent catastrophic operational disruption [CM002, CM004, CM010]. Cloud
              data tiering and as-a-service adoption further accelerate demand, with Enterprise Strategy Group research
              showing that over two-thirds of organizations utilize cloud backup-as-a-service while seeking to eliminate
              fragmented public cloud copies [CM008, CM011]. Additionally, generative AI platforms like Cohesity Gaia
              create monetization potential by indexing secondary data repositories for secure enterprise
              retrieval-augmented generation [CM003, CM010]. Conversely, adoption velocity is constrained by major
              structural hurdles: merging extensive enterprise customer bases like Veritas creates multi-year technology
              harmonization and sales cycle complexities, while agile competitors such as Rubrik, Veeam, and Commvault
              actively compete for accounts in transition [CM003, CM004, CM010, CM012]. Macroeconomic budget scrutiny,
              switching friction from entrenched tape or appliance infrastructure, and unverified private firmographic
              metrics represent persistent diligence risks [CM010, CM013, CM014].
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Convergence of Data Protection and Cyber Recovery
            body: >-
              Enterprise backup is no longer procured as passive storage insurance. High-profile ransomware incidents
              and regulatory compliance have shifted budget control toward security executives who mandate immutable
              vaulting, rapid automated clean recovery, and AI-enabled threat hunting across multi-cloud environments
              [CM002, CM004].
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
          - type: callout
            title: Integration Drag Amid Aggressive Competitive Displacement
            body: >-
              While the combination with Veritas positions Cohesity as the largest data protection software vendor with
              approximately 19% market share, merging disparate codebases and global sales organizations creates
              friction. Agile competitors like Rubrik, Veeam, and Commvault are actively targeting legacy accounts
              during this multi-year transition [CM003, CM004, CM010].
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Architecture Models'
        blocks:
          - type: paragraph
            body: >-
              The enterprise data protection and cyber resilience landscape is split across three distinct competitive
              vectors: legacy enterprise incumbents defending heterogeneous mainframe and database footprints, modern
              scale-out cyber resilience platforms, and software-first volume specialists. Following Cohesity's merger
              with Veritas' enterprise data protection business in December 2024, the combined entity vaulted to the
              number one market share position with approximately 19% of an otherwise fragmented industry, protecting
              over 100 exabytes of data across 13,600 enterprise accounts. In doing so, Cohesity combined its
              high-growth cloud-native architecture with Veritas' established enterprise accounts, including NetBackup
              installations across the Global 500. However, this scale puts Cohesity into direct confrontation with
              Rubrik, which completed an initial public offering in April 2024 at a $17 billion public market valuation.
              While Rubrik built its posture around zero-trust cyber recovery and cloud-native security, Veeam continues
              to lead volume adoption via hardware-agnostic, instance-based licensing across mid-market and hybrid
              enterprise estates. Simultaneously, legacy infrastructure players such as IBM (with IBM Storage Protect)
              and hybrid incumbent Commvault contest complex hybrid data center environments, while cloud providers
              offer native snapshotting that serves as an entry-level substitute. Cohesity's strategic response centers
              on positioning backup repositories as active corporate intelligence assets through AI engines like Gaia,
              though customer adoption requires navigating significant platform migration overhead.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
