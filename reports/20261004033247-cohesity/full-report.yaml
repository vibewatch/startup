      - number: '1.3'
        title: Governance Structure, Enterprise Scale, and Strategic Risks
        blocks:
          - type: paragraph
            body: >-
              Post-merger governance reflects a balanced syndicate of venture pioneers, private equity control sponsors,
              and independent cyber experts. Board oversight is led by Chairman Gaurav Garg of Wing Venture Capital,
              alongside Haveli Investments' Brian Sheth, Carlyle's Patrick McCarter, former Veritas CEO Greg Hughes, and
              independent director Kevin Mandia, with Premji Invest's Sandesh Patnam serving as observer. While the
              combined business reached pro forma revenues exceeding $1.6 billion to $1.7 billion and approximately $1.5
              billion in ARR, integration risks and elevated financial leverage remain critical diligence
              considerations. Debt market analysts noted concerns regarding the heavy debt package utilized to finance
              the transaction, while broader research indicates that catastrophic cyber disruptions impose severe
              financial penalties—with peer executive surveys attributing revenue losses of up to 15% following major
              incidents—placing heightened operational scrutiny on data security custodians like Cohesity.
