  - id: TV002
    title: Thesis and Anti-Thesis Balance
    columns:
      - Perspective
      - Core Argument
      - What Would Change the View
    rows:
      - - Investment Thesis
        - Category leader with 19% market share, $1.5B+ ARR, 28% margin, and strategic backing from Nvidia and IBM.
        - Severe customer churn in legacy accounts or deceleration of combined ARR growth below 10%.
      - - Investment Anti-Thesis
        - >-
          Aspirations for a $17B valuation imply an unrealistic 11x+ multiple on an asset heavily weighted with mature
          software.
        - Evidence of accelerated organic SaaS ARR growth above 25% and complete debt de-leveraging.
