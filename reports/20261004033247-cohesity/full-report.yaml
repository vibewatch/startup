              - CP013
      - number: '3.3'
        title: Moat Durability, Intellectual Property, and Platform Assembly Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Cohesity's competitive moat rests on three pillars: scale-out file system defensibility, deep ecosystem
              partnerships, and newly patented AI retrieval intellectual property. On June 3, 2026, Cohesity was granted
              U.S. Patent No. 12,619,501 for Cohesity Gaia, establishing a protected legal perimeter around running
              generative AI retrieval-augmented generation (RAG) directly against secondary backup and archive stores
              in-place without data replication or external pipeline exposure. Backed by strategic equity investments
              and technical alliances from Nvidia, HPE, and Cisco, Cohesity integrates directly with enterprise hardware
              ecosystems and modern AI acceleration stacks, while incorporating OEM modules like Cyera for DSPM.
              Nevertheless, significant adverse vulnerabilities threaten long-term moat durability. Competitor
              intelligence notes that Cohesity's broader cyber-resilience platform is increasingly assembled from
              acquired and OEM components: DSPM capabilities rely on resold technology from Cyera (anchored in a US-AWS
              control plane), identity threat detection and response is OEM'd from Semperis, and the core NetBackup
              foundation was acquired from Veritas. This multi-roadmap structure creates engineering integration
              friction. Furthermore, post-merger integration risks surfaced following workforce reductions in mid-2024
              and executive turnover, creating potential renewal churn as legacy Veritas accounts face migration
              decisions amid aggressive takeout campaigns from Rubrik and Commvault.
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Merger Integration Friction vs. Agile Pure-Play Rivals
            body: >-
              Cohesity's aggressive expansion and Veritas merger legacy create operational friction as the company
              balances multiple overlapping product roadmaps, workforce restructuring, and ongoing enterprise NetBackup
              migrations. While accelerating immediate market share scale to 19%, this complexity leaves Cohesity
              vulnerable to agile competitors like Rubrik and Veeam that actively run takeout campaigns against legacy
              enterprise accounts.
            calloutType: risk
            claimRefs:
              - CP002
              - CP016
          - type: callout
            title: Defensible IP Moat in Enterprise Secondary Data RAG
            body: >-
              By securing U.S. Patent No. 12,619,501 for Cohesity Gaia in June 2026, Cohesity converted its
              secondary-data AI inference capability into an enforceable legal moat. Competitors seeking to provide
              generative AI retrieval on backup repositories without costly external ETL must either architect
              workarounds or risk infringing on Cohesity's protected intellectual property.
            calloutType: strength
            claimRefs:
              - CP014
              - CP015
