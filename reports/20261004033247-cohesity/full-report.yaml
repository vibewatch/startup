  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Enterprise data protection has evolved from isolated secondary backup appliances into unified data
              security, cyber resilience, and cloud data management platforms. The market boundary includes software,
              managed SaaS platforms, and orchestrated vaulting that protect hybrid enterprise workloads across
              on-premises infrastructure, multi-cloud architectures, and SaaS applications. Historically, enterprises
              addressed these workflows by piecing together multiple point tools across fragmented silos, spending tens
              of billions annually on separate backup, archiving, disaster recovery, and test/dev environments [CM001,
              CM006]. The modern category encompasses immutable snapshot protection, anomaly detection, automated
              clean-room recovery, and AI-enabled secondary data querying [CM002, CM004]. Excluded from this boundary
              are primary production storage hardware arrays, general-purpose enterprise databases, operational Security
              Information and Event Management (SIEM) systems, and endpoint security agents, which interface with data
              protection systems via APIs but represent separate IT budget centers. Traditional status-quo substitutes
              encompass script-driven tape archiving, native hypervisor snapshotting, and legacy on-premises media
              servers, which carry substantial administrative overhead and lack automated clean recovery against modern
              ransomware threats [CM004, CM009].
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
      - number: '2.2'
        title: Addressable Market Sizing, Sizing Lenses, and Analytical Divergence
        blocks:
          - type: paragraph
            body: >-
              Evaluating Cohesity's market potential requires examining multiple sizing lenses across third-party
              research, company disclosures, and analyst projections. Official post-merger disclosures target an
              aggregate total addressable market (TAM) of $40+ billion, which includes IDC's enterprise data replication
              and protection software category [CM002]. Within this broader aggregate, IDC's Semiannual Software Tracker
              pegged 2024 projected vendor sales in data replication and protection software at $12.3 billion,
              representing the core serviceable addressable software envelope [CM002]. Broader market assessments by
              Grand View Research and Research and Markets estimate the worldwide enterprise data management sector
              expanding to $265.68 billion by 2030, reflecting a 14% compound annual growth rate driven by data
              proliferation and hybrid work patterns [CM007]. Sizing models diverge based on whether hardware
              appliances, managed backup infrastructure, and cyber recovery services are bundled into software-only
              figures. Post-Veritas combination disclosures position Cohesity with over $1.7 billion in pro forma
              revenue and $1.5 billion in annual recurring revenue across more than 12,000 enterprise accounts,
              establishing a top market share footprint of approximately 19% within fragmented software replication and
              protection spending [CM002, CM003]. Sizing diligence requires distinguishing core recurring software
              subscription revenue from hardware appliance passthrough, maintenance renewals, and multi-year legacy
              contract backlogs [CM014].
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM014
