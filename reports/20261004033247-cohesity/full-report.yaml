  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Cohesity's current product surface is organized around a single Data Cloud spanning data protection, data
              security, data insights, and a common platform. The homepage says the platform protects more than 1,000
              hybrid-cloud and SaaS workloads, but that breadth is a company claim rather than an independently tested
              compatibility count. In workflow terms, an enterprise can apply policy-based protection to heterogeneous
              data, retain recoverable copies, investigate threats, and restore workloads through one product family
              instead of assembling separate backup and storage tools. DataProtect is the clearest delivery unit: Cisco
              and an independent catalog both describe self-managed deployment and Backup-as-a-Service options. The
              practical diligence issue is not whether a broad platform exists, but which capabilities, workload
              connectors, and management functions are included in each contract and release.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
