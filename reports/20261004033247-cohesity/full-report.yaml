              - CE009
              - CE011
      - number: '5.2'
        title: Architecture and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest technical evidence is historical but internally consistent. Cohesity's 2016 white paper and
              Tech Field Day's account describe a scale-out distributed platform using global deduplication, adaptive
              tiering, workload isolation, and a SnapTree-based snapshot model. Those mechanisms support the product's
              consolidation thesis: backup, recovery, files, test and development, and analytics can share a common data
              layer rather than generate additional copies across point products. SnapTree is presented as enabling
              frequent snapshots and fully hydrated recovery images, while distributed ingest and indexing are intended
              to spread work across cluster nodes. This establishes a specific architectural lineage, not proof that
              every current cloud service uses the same implementation. A current component/version map, current scale
              limits, and independently reproduced throughput or recovery tests remain unavailable in the assigned
              evidence.
            claimRefs:
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE007
              - CE010
      - number: '5.3'
        title: Deployment, Integration, and Operations
        blocks:
          - type: paragraph
            body: >-
              Deployment flexibility is a material strength and a source of implementation risk. Cisco's validated
              design documents an on-premises all-flash configuration on UCS X-Series with infrastructure automation and
              cluster expansion procedures, while the independent catalog describes self-managed, service, and
              hybrid-cloud models. XenTegra, a Cohesity partner, lists VMware, Oracle, SQL, Microsoft 365, and NAS among
              supported environments; that is useful integration evidence but remains supplier-channel testimony rather
              than an independent interoperability benchmark. Historical practitioner coverage also shows node
              discovery, software-version matching, cluster expansion, and a responsive management interface. Together
              these sources indicate a mature enterprise operating model, but they also imply dependencies on validated
              hardware, networking, ports, identity systems, connector compatibility, and disciplined sequential
              maintenance.
            claimRefs:
              - CE002
              - CE008
              - CE010
              - CE011
      - number: '5.4'
        title: Security Maturity and Open Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Cisco's 2023 validated design identifies immutable snapshots, WORM controls, encryption, multifactor
              authentication, and granular role-based access control as part of the integrated solution. These controls
              are relevant because backup infrastructure is itself a privileged recovery dependency, but their presence
              does not establish operational efficacy under attack. InvGate's catalog lists historical Cohesity
              vulnerabilities, including CVE-2023-33295 for missing TLS certificate validation in older DataProtect
              versions; this is a secondary compilation, not a substitute for current vendor advisories or an
              authoritative vulnerability database. The assigned PeerSpot page asks for product weaknesses and reports
              eight responses, yet its prefetched text does not expose the substantive answers. The resulting risk
              posture is therefore evidence-limited: controls are documented, while current patch status, certification
              scope, incident history, recovery-test results, and practitioner criticism require primary follow-up.
            claimRefs:
              - CE007
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Corroborated Deployment Flexibility
            body: >-
              Cisco and InvGate independently describe DataProtect as deployable on-premises or consumed as a service,
              giving customers more than one operating model without establishing parity of features or economics
              between those models.
            calloutType: strength
            claimRefs:
              - CE002
          - type: callout
            title: Current Technical Proof Is Incomplete
            body: >-
              The assigned pool documents security controls and historical architecture, but it does not contain a
              current independent recovery benchmark, primary vulnerability record, current status history, or
              release-level architecture map.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Enterprise Footprint
        blocks:
          - type: paragraph
            body: >-
              Following the completion of its transaction with Veritas' enterprise data protection business in December
              2024, Cohesity expanded its installed base from an emerging high-growth challenger into the world's
              largest data protection software provider by market share. The combined company protects hundreds of
              exabytes of data across more than 12,000 customers globally. Its penetration into top-tier enterprise
              accounts is substantial, counting over 85 of the Fortune 100 and nearly 70% of the Global 500
              organizations as active clients. Sectoral adoption is anchored in large-scale, highly regulated verticals
              with demanding cyber-resilience and availability mandates: Cohesity serves all ten of the top ten global
              financial institutions, all ten of the top ten global manufacturers, eight of the top ten healthcare
              providers, and eight of the top ten global retail leaders. Historically, legacy Cohesity expanded across
              diverse enterprise commercial accounts and public-sector agencies including AutoNation, Hyatt, Bungie,
              LendingClub, Piedmont Healthcare, and the U.S. Department of Energy, but the Veritas transaction
              concentrated strategic revenue in the global enterprise tier.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory, Channel Scale, and Channel Alliances
        blocks:
          - type: paragraph
            body: >-
              Cohesity's go-to-market scale and customer deployment velocity rely on a massive joint ecosystem
              comprising major systems integrators, value-added resellers, and infrastructure hardware OEMs. Value-added
              technology partners such as World Wide Technology (WWT) and SHI International play central roles in
              customer architecture, deployment, and operationalization. Partner environments implement Cohesity Data
              Cloud and DataProtect across diverse production workloads—including VMware, Hyper-V, SQL Server, Network
              Attached Storage (NAS), and Active Directory—while configuring cyber-vaulting options such as FortKnox and
              identity threat detection. Additionally, strategic channel integrations with Cisco, Hewlett Packard
              Enterprise (HPE), and Nvidia provide validated turnkey appliances and accelerated compute platforms that
              facilitate enterprise rollouts. However, customer research indicates that modern enterprise buyers
              increasingly face operational pressure from accelerating attack speeds and ransomware extortion,
              compelling organizations to prioritize business recovery validation and data immutability over basic
              point-solution backups.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Customer Durability, Dual-Portfolio Risks, and Mindshare Competition
        blocks:
          - type: paragraph
            body: >-
              Customer retention and durability represent both Cohesity's greatest opportunity and its primary
              operational vulnerability. To reassure enterprise NetBackup and Alta customers against forced deprecation,
              Cohesity instituted a public 'No Customer Left Behind' pledge, committing to multi-year support, pricing
              lock-ins, and unified management across both legacy platforms via Cohesity Helios. Despite these
              commitments, independent industry tracking on platforms like PeerSpot indicates that Cohesity Data Cloud
              held only a 1.1% category mindshare in Backup and Recovery in late 2026, trailing IBM Storage Protect
              (1.7%) and market leaders. Furthermore, candidate and industry intelligence compiled by Built In
              emphasizes that the combination created a dual-portfolio reality with overlapping products, where
              near-term customer retention and expansion depend heavily on clear roadmap convergence, licensing
              alignment, and predictable migration paths. In the broader market, peer leaders such as Rubrik and
              Commvault aggressively target enterprise accounts undergoing vendor integration transitions.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU004
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Dual-Portfolio Integration Challenge
            body: >-
              While the Veritas combination immediately granted Cohesity an unmatched enterprise customer roster of over
              12,000 organizations, sustaining customer trust requires flawless execution of its 'No Customer Left
              Behind' pledge. NetBackup and Alta customers face ongoing decisions regarding roadmap convergence,
              licensing alignment, and unified management under Helios, creating potential wedge opportunities for
              competitors like Rubrik, Commvault, and Veeam.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Enterprise data protection infrastructure sits directly at the epicenter of expanding global cybersecurity
              compliance and privacy regulations. According to Cohesity research, 92% of organizations experiencing a
              material cyberattack suffer formal legal, regulatory, or compliance fallout, including government fines,
              mandatory breach disclosures, and civil litigation. In heavily regulated verticals such as financial
              services, 93% of institutions report regulatory or legal repercussions following cyber incidents, while
              only 5% demonstrate mature cyber resilience postures. For Cohesity, which operates as an enterprise
              custodian across more than 1,000 workloads including hybrid cloud and SaaS environments, any compromise of
              backup immutability or secondary metadata catalogs exposes the firm and its enterprise clientele to severe
              statutory liabilities under global frameworks. Because cyberattacks routinely trigger public earnings
              guidance revisions and executive accountability, Cohesity's legal risk profile is inextricably tied to
              customer incident outcomes and verifiable compliance integrity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Recovery Hurdles and Secondary Storage Security
        blocks:
          - type: paragraph
            body: >-
              Operational resilience in enterprise backup environments is increasingly threatened by sophisticated
              ransomware threat actors who intentionally target and attempt to destroy secondary backup systems to
              compel ransom payments. While enterprise defenders prioritize threat detection, Cohesity documentation
              warns that backup system hardening is critical to prevent adversaries from disabling recovery mechanisms.
              Across enterprise deployments, technical recovery workflows remain a major bottleneck: 97% of surveyed
              organizations require more than 24 hours to restore operational data from backups following an attack,
              with 12% requiring at least a full week. Compounding operational friction, 42% of affected enterprises
              suffer reinfection during recovery procedures due to incomplete threat eradication from historical backup
              snapshots. Additionally, independent user evaluations from PeerSpot note that while Cohesity Data Cloud
              provides straightforward administrative interfaces, it must continue refining advanced enterprise recovery
              features to rival legacy platforms like IBM Storage Protect in complex failover scenarios.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR010
              - CR011
      - number: '7.3'
        title: Partner Dependency, Debt Overhang, and Valuation Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Cohesity's aggressive expansion strategy combines strategic ecosystem partnerships with large-scale
              corporate consolidation, introducing substantial execution and financial dependencies. The company relies
              extensively on strategic technology partners and investors including Nvidia for AI-powered data search
              initiatives such as Gaia, alongside Cisco and Hewlett Packard Enterprise for joint data center
              go-to-market integration. However, the closing of Cohesity's complex merger with Veritas data protection
              unit in December 2024 represents its most significant operational undertaking, uniting Cohesity's rapid
              revenue trajectory with Veritas's legacy footprint to achieve a 19% market share. While leadership targets
              a 2026 initial public offering at a valuation rivaling Rubrik's $17 billion market capitalization, public
              markets will scrutinize combined net revenue retention, post-merger integration friction, and unamortized
              debt obligations. Private equity capital structures and high valuation multiples create downside exposure
              if macroeconomic volatility or delayed customer migration hampers profitable execution.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Merger Veritas Legacy Retention Risk
            body: >-
              The consolidation of Veritas's data protection business into Cohesity accounts for 14% of the combined
              company's 19% industry market share. Because Veritas customers operate legacy on-premises workloads,
              competitors like Rubrik and Commvault are aggressively targeting this customer base during modernization
              cycles. Churn among inherited accounts represents the primary risk to Cohesity's mid-teens revenue growth
              objectives.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
          - type: callout
            title: The Secondary Storage Attack Surface
            body: >-
              Cyber recovery has shifted from a routine IT operation to a primary attack target. With 89% of impacted
              organizations in surveyed regions paying extortion ransoms and 97% experiencing recovery durations in
              excess of 24 hours, secondary backup storage security directly dictates whether a business can withstand
              material ransomware events.
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Cohesity's primary investment thesis centers on its newly acquired position as the largest data protection
              software vendor globally following its combination with Veritas's enterprise data protection unit,
              commanding an industry-leading 19% market share in enterprise backup and data security [CV001, CV002]. The
              combined entity entered 2025-2026 with an annualized recurring revenue base exceeding $1.5 billion and an
              adjusted profit margin of 28%, creating an enterprise platform that pairs Cohesity's modern high-growth
              cyber resilience and AI capabilities with Veritas's vast Fortune 500 installed base [CV003, CV004].
              Strategic backing from major technology and ecosystem anchors including Nvidia, IBM, SoftBank, and Cisco
              further solidifies its position as an enterprise standard in cyber resilience and generative AI data
              management through products like Cohesity Gaia [CV005, CV006]. However, the counter-thesis is substantial:
              executive aspirations to achieve an IPO valuation rivaling or exceeding Rubrik's $17 billion public
              capitalization demand a forward multiple expansion that is difficult to justify without audited disclosure
              of organic versus legacy growth rates [CV001, CV003]. Furthermore, corporate survey research highlights
              that 70% of public firms suffer earnings guidance cuts and 68% experience stock declines post-breach,
              underscoring systemic execution risks across cybersecurity customers [CV007]. Integrating Veritas's
              slower-growth legacy software assets while managing post-merger debt overhang presents a formidable
              execution risk, leaving private secondary valuation marks of $7B to $8B as a realistic ceiling rather than
              a floor [CV008, CV009].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV011
      - number: '8.2'
        title: Recommendation Stance and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              We assign Cohesity a recommendation of track with medium confidence, a high risk rating, and a fair
              valuation stance relative to its last institutional and secondary marks [CV001, CV008]. While the
              company's operating scale of $1.5 billion ARR and 12,000 to 13,000 customers provides a durable downside
              buffer, private market transactions—including an estimated secondary price of $19.80 per share and
              transaction marks between $7.0 billion and $8.0 billion—fully price in the baseline merger combination
              [CV003, CV008, CV010, CV011]. Institutional entry discipline requires avoiding secondary markups until the
              enterprise provides audited financial transparency regarding debt debt quantum, covenant obligations, and
              net revenue retention across legacy Veritas accounts [CV001, CV009]. If Cohesity attempts an initial
              public offering in late 2026 seeking Rubrik's 12.75x EV/sales multiple, public equity markets are likely
              to enforce a steep conglomerate discount due to Veritas's low-single-digit pre-merger growth profile
              [CV001, CV003]. Therefore, institutional investors should track the asset through its initial post-merger
              audited reporting periods rather than pursuing private secondary liquidity at current tender marks [CV008,
              CV011].
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV011
      - number: '8.3'
        title: Scenario Analysis, Peer Multiples, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Valuation underwriting requires evaluating Bull, Base, and Bear scenarios against public comps Rubrik and
              Commvault [CV001]. Rubrik trades at approximately 12.75x price-to-sales on a pure-play cloud security
              growth profile, while Commvault trades at roughly 7.16x price-to-sales on mature, cash-generative
              operations [CV001]. In our Base Case (50% probability), Cohesity achieves modest post-merger organic
              growth in the low teens, commanding a 5.0x to 6.0x multiple on an estimated $1.8B forward ARR base,
              yielding an enterprise valuation of $9.0B to $10.8B at a late 2026 IPO [CV001, CV003]. In the Bull Case
              (25% probability), successful cross-selling of Cohesity Gaia AI search and cloud data resilience into
              Veritas's accounts accelerates blended ARR expansion toward 20%, unlocking a peer-comparable 8.5x multiple
              and a $16.0B to $17.0B valuation [CV001, CV006]. Conversely, in the Bear Case (25% probability),
              integration frictions, debt service pressures, and customer churn among legacy Veritas cohorts compress
              growth into the mid-single digits, resulting in a Commvault-like or discounted private equity multiple of
              3.5x to 4.5x, valuing equity at $5.5B to $7.0B [CV001, CV003, CV009]. Downside protection is established
              by Cohesity's historical equity capitalization, including $810M raised across 7 venture rounds through
              Series F and institutional support from Carlyle, SoftBank, and Sequoia [CV009, CV012].
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional Recommendation Rationale
            body: >-
              Cohesity represents an exceptional market consolidation play, but pricing discipline requires passing on
              private secondary premiums that anticipate Rubrik-like trading multiples of 12x sales before organic
              audited performance is demonstrated.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
          - type: callout
            title: Downside Triggers and Integration Overhang
            body: >-
              The primary threat to shareholder value is not technological obsolescence but potential friction in
              digesting Veritas, servicing transaction debt, and retaining enterprise accounts subject to aggressive
              poaching by cloud-native competitors.
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV009
