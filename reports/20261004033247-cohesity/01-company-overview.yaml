callouts:
  - calloutType: "insight"
    title: "Strategic Impact of the Veritas Combination"
    body: "By acquiring Veritas' data protection business rather than pursuing an immediate standalone IPO, Cohesity expanded its scale to $1.5 billion in ARR and 12,000 customers. However, the transaction transformed its capital structure from a pure-play venture firm into a highly leveraged hybrid entity backed by private equity sponsors."
    claimRefs:
      - "CO003"
      - "CO005"
      - "CO007"
      - "CO013"
  - calloutType: "risk"
    title: "Leverage and Integration Diligence Burden"
    body: "Debt market reporting indicates lenders feared over-leveraging and asset subordination post-carve-out. Prospective investors must evaluate the precise covenant package, debt maturity schedule, and integration execution across legacy NetBackup and modern Cohesity Data Cloud stacks."
    claimRefs:
      - "CO007"
      - "CO013"
      - "CO014"
