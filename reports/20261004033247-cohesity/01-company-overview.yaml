company:
  name: "Cohesity"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Cohesity is a scaled enterprise data security and cyber-resilience platform that completed a transformative combination with Veritas' data protection business in December 2024 at a $7 billion valuation. Led by CEO Sanjay Poonen, the company protects hundreds of exabytes across 12,000 customers with $1.5 billion in ARR, while remaining a private venture- and private-equity-backed business preparing for an eventual public listing amidst integration and leverage risks."
sections:
  - id: "identity-and-foundations"
    title: "Corporate Identity, Operating Model, and Foundation"
    body: "Cohesity was founded in 2013 by computer scientist Mohit Aron, who previously engineered the Google File System and co-founded Nutanix before pioneering hyperconverged secondary data architecture. Headquartered in San Jose, California, the company operates as a privately held software provider delivering AI-powered data security, backup, disaster recovery, and unstructured data management across hybrid cloud, multicloud, and on-premises environments. In August 2022, Sanjay Poonen took over executive leadership as Chief Executive Officer and President, bringing executive experience from VMware and SAP, while Aron transitioned to Founder Emeritus. Cohesity monetizes through software licenses, appliance bundles, and managed Software-as-a-Service subscriptions via its Cohesity Data Cloud platform, serving over 12,000 customers globally, including more than 85 of the Fortune 100."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
      - "CO009"
    tableRefs:
      - "TO001"
  - id: "capitalization-and-veritas-merger"
    title: "Financing History, Veritas Combination, and Capital Structure"
    body: "Before its landmark combination with Veritas' enterprise data protection business, Cohesity raised over $650 million in equity across multiple venture rounds, anchored by early backing from Sequoia Capital, Wing Venture Capital, and SoftBank Vision Fund's $250 million Series D in 2018. Following a confidential IPO filing in December 2021 that was subsequently shelved, Cohesity executed a transformative transaction announced in February 2024 and completed in December 2024, acquiring Veritas' core data protection segment for approximately $2.5 billion in cash and an estimated 20.9% equity stake in the combined entity. The transaction valued the combined business at approximately $7 billion, funded via a Series H equity round led by Haveli Investments and substantial term loan B debt arranged by J.P. Morgan, which also served to facilitate a debt paydown for Veritas Technologies. The carve-out separated Veritas' enterprise data protection assets—including NetBackup and Alta—from its remaining InfoScale, Compliance, and Backup Exec operations, which were spun into an autonomous company named DataCo under Carlyle."
    claimRefs:
      - "CO003"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO010"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "governance-scale-and-adverse-realities"
    title: "Governance Structure, Enterprise Scale, and Strategic Risks"
    body: "Post-merger governance reflects a balanced syndicate of venture pioneers, private equity control sponsors, and independent cyber experts. Board oversight is led by Chairman Gaurav Garg of Wing Venture Capital, alongside Haveli Investments' Brian Sheth, Carlyle's Patrick McCarter, former Veritas CEO Greg Hughes, and independent director Kevin Mandia, with Premji Invest's Sandesh Patnam serving as observer. While the combined business reached pro forma revenues exceeding $1.6 billion to $1.7 billion and approximately $1.5 billion in ARR, integration risks and elevated financial leverage remain critical diligence considerations. Debt market analysts noted concerns regarding the heavy debt package utilized to finance the transaction, while broader research indicates that catastrophic cyber disruptions impose severe financial penalties—with peer executive surveys attributing revenue losses of up to 15% following major incidents—placing heightened operational scrutiny on data security custodians like Cohesity."
    claimRefs:
      - "CO008"
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
    figureRefs:
      - "FO001"
