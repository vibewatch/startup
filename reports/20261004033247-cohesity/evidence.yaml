evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration-completeness
    missingEvidence: >-
      Comprehensive directory of full executive committee, subsidiary heads, and board committees beyond top public
      leadership.
    whyItMatters: Provides exhaustive operational visibility into functional reporting lines and succession depth.
    diligencePath: Inspect company organizational disclosures, corporate filings, or executive directory listings.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-mix
    missingEvidence: >-
      Audited financial disclosure isolating net retention rates (NRR) and native Cohesity versus inherited Veritas
      revenue run-rate mix.
    whyItMatters: >-
      Essential to determine whether post-merger scale reflects organic software expansion or managing run-off from
      legacy on-premises maintenance contracts.
    diligencePath: >-
      Review S-1 or pre-IPO confidential registration filings or request audited cohort retention schedules across
      NetBackup vs DataProtect installed bases.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: debt-covenants
    missingEvidence: >-
      Exact term loan B credit facility agreement detailing interest margins, covenant package, and maturity dates from
      the Veritas transaction.
    whyItMatters: >-
      Substantial debt obligations affect free cash flow conversion and dictate refinancing risk in fluctuating interest
      rate environments.
    diligencePath: >-
      Obtain credit agreement documentation and debt service schedules via syndicate debt rating agency reports or
      lender disclosures.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: veritas-retention-mix
    missingEvidence: >-
      Audited breakdown of standalone Cohesity ARR growth rate versus legacy Veritas contract renewals, including net
      revenue retention by cohort.
    whyItMatters: >-
      Veritas had grown at ~5% while Cohesity grew at nearly 30% prior to combination; blending masking organic adoption
      and churn risk.
    diligencePath: >-
      Review S-1 or confidential IPO investor presentation disclosures detailing product-line ARR breakdown and net
      retention rates.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Official published list price sheets and standard enterprise discount tiers for Cohesity Data Cloud software and
      DPaaS subscriptions.
    whyItMatters: >-
      Direct price transparency is unavailable, requiring reliance on third-party buyer benchmarks ($150-$400/BETB/year)
      and quote ranges.
    diligencePath: Review sanitized enterprise procurement bids and channel partner rate cards across 100+ TB hybrid deployments.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - id: GP001
    type: private-evidence-only
    severity: material
    topic: merger-retention
    missingEvidence: >-
      Audited customer retention and ARR renewal rates disaggregated between legacy Cohesity DataPlatform accounts and
      inherited Veritas NetBackup accounts.
    whyItMatters: >-
      Competitors actively target Veritas customers during platform migration, creating risk of ARR churn ahead of a
      2026 IPO.
    diligencePath: >-
      Obtain cohort retention disclosure and gross churn percentages by customer vintage during pre-IPO financial
      diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current revenue, ARR definition, product and deployment mix, gross margin, service-delivery costs, retention, CAC,
      sales cycle, and payback.
    whyItMatters: >-
      Without these inputs, recurring-revenue quality, sales efficiency, and the path from protected capacity to gross
      profit cannot be tested.
    diligencePath: >-
      Request audited statements, ARR reconciliation, cohort schedules, bookings data, invoice samples, and
      product-level contribution margins.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, operating and free cash flow, debt principal and terms, covenants, preference stack,
      runway, and next-financing triggers.
    whyItMatters: >-
      Funding raised and private-market valuation marks do not reveal liquidity, cash burn, debt service, or downside
      financing risk.
    diligencePath: >-
      Request the post-Veritas balance sheet, cash-flow statements, debt agreements, cap table, board budget, and
      downside runway cases.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Current independent workload-level benchmarks for backup ingest, recovery time, recovery point performance, and
      security efficacy.
    whyItMatters: >-
      Without comparable tests, product claims cannot be translated into underwritten deployment outcomes or
      differentiated technical performance.
    diligencePath: >-
      Request recent third-party benchmark reports and customer recovery-test records segmented by workload, data
      volume, deployment model, and failure scenario.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: security-history
    missingEvidence: >-
      Current primary vulnerability advisories, certification scope, patch status, service status history, and
      documented incident or recovery-test records.
    whyItMatters: >-
      Secondary summaries establish that historical issues existed but cannot verify remediation or the present security
      and reliability posture.
    diligencePath: >-
      Review Cohesity advisories, authoritative CVE records, certification reports, penetration-test summaries, status
      history, and customer recovery exercises.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE003
  - type: stale
    severity: material
    topic: architecture
    missingEvidence: >-
      A current release-level component map, supported integration matrix, roadmap, lifecycle policy, and scale limits
      for each deployment model.
    whyItMatters: >-
      Historical architecture explains the technical lineage but does not prove that every present module uses the same
      components or limits.
    diligencePath: >-
      Obtain current architecture guides, release notes, compatibility matrices, lifecycle schedules, and roadmap
      materials under diligence access.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE005
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and logo churn rates segmented by native
      Cohesity vs inherited Veritas customer cohorts.
    whyItMatters: >-
      Without segmented retention disclosures, it is impossible to verify whether Veritas NetBackup customers are
      converting into long-term Cohesity Data Cloud accounts or migrating to competitors.
    diligencePath: >-
      Request confidential historical cohort retention and migration waterfall schedules during IPO or secondary
      underwriting diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: material
    topic: veritas-debt-capital-structure
    missingEvidence: >-
      Audited financial statements detailing debt quantum, senior secured note interest rates, maturity schedule, and
      debt service covenants from the December 2024 Veritas combination.
    whyItMatters: >-
      Excessive debt leverage and interest service obligations could constrain R&D investment and depress equity
      valuation in a 2026 initial public offering.
    diligencePath: >-
      Inspect confidential lender presentation materials, debt credit agreements, or draft S-1 registration statements
      prior to public filing.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Complete registry of pending customer litigation, contractual indemnification claims, and regional data privacy
      regulatory inquiries.
    whyItMatters: >-
      Customer legal actions stemming from prolonged ransomware recovery or unhardened backup breaches could produce
      unreserved liabilities.
    diligencePath: Request legal loss contingency disclosure schedules and customer warranty claim logs from Cohesity management.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: debt-and-preference-waterfall
    missingEvidence: >-
      Audited post-close Veritas debt facility size, interest margins, maturity schedule, and preferred equity
      liquidation waterfall.
    whyItMatters: Directly determines common equity value and net proceeds in downside or mid-case exit scenarios.
    diligencePath: Review credit agreement filings, lender syndicate disclosures, and audited pre-IPO S-1 capitalization tables.
    relatedQuestionRefs:
      - QV008
