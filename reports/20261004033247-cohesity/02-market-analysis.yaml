callouts:
  - calloutType: "insight"
    title: "Market Convergence of Data Protection and Cyber Recovery"
    body: "Enterprise backup is no longer procured as passive storage insurance. High-profile ransomware incidents and regulatory compliance have shifted budget control toward security executives who mandate immutable vaulting, rapid automated clean recovery, and AI-enabled threat hunting across multi-cloud environments [CM002, CM004]."
    claimRefs:
      - "CM002"
      - "CM004"
  - calloutType: "risk"
    title: "Integration Drag Amid Aggressive Competitive Displacement"
    body: "While the combination with Veritas positions Cohesity as the largest data protection software vendor with approximately 19% market share, merging disparate codebases and global sales organizations creates friction. Agile competitors like Rubrik, Veeam, and Commvault are actively targeting legacy accounts during this multi-year transition [CM003, CM004, CM010]."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM010"
