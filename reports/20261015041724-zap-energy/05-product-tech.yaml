company:
  name: Zap Energy
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Zap is still pre-commercial, but its public product story is now a two-track nuclear platform:
    a magnet-free sheared-flow-stabilized Z-pinch fusion program plus a newly announced 4S-derived
    sodium-cooled fission product. The strongest evidence is around physics architecture, shared
    liquid-metal and balance-of-plant engineering, and a visible research publication trail; the
    weakest areas are plant-level trust controls, field reliability evidence, and the exact
    licensing and IP path for the revived fission design.
sections:
  - id: product-definition-and-workflows
    title: Product definition and target workflows
    body: >-
      Zap now markets itself as an integrated nuclear platform rather than a pure fusion startup,
      pairing a long-dated fusion architecture with a nearer-term fission product. In customer
      workflow terms, the public pitch is not "fusion science" alone: the homepage groups demand
      around continuous-power problems such as AI infrastructure, remote industrial sites,
      industrial heat, and national-security loads, while independent coverage says the new
      fission line centers on a 10 MWe sodium-cooled reactor derived from Toshiba's 4S design.
      That makes the current product map clearer than in the prior report: Zap is presenting one
      shared nuclear stack with multiple delivery timelines. What remains unclear is which of these
      workflows have progressed beyond market selection into named deployments, reliability proof,
      or customer-specific integration work.
    claimRefs: [CE001, CE007, CE008, CE009, CE010]
    tableRefs: [TE002]
  - id: architecture-and-maturity-signals
    title: Architecture and maturity signals
    body: >-
      The fusion side remains the technical anchor. Zap's published research describes a
      sheared-flow-stabilized Z-pinch that relies on plasma self-organization instead of the large
      magnets or lasers used by other fusion approaches, and the 2022 IEEE abstract gives concrete
      subsystem detail around electrodes, gas injection, capacitor-bank modules, and diagnostics.
      Public maturity proof is still prototype-oriented rather than customer-deployed, but it is
      better than generic marketing copy: the company's research library lists a 2024 Century paper
      on a 100-kW-scale repetitive system with liquid metal cooling, and independent coverage says
      Century has already been used to test liquid metal walls and repetitive pulsed power while
      reaching record plasma pressures. Zap's new thesis is that these fusion engineering efforts
      create reusable know-how for fission hardware as well.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE012]
    tableRefs: [TE001, TE003]
    figureRefs: [FE001]
  - id: deployment-dependencies-and-risk
    title: Deployment dependencies, trust gaps, and technical risk
    body: >-
      The main product risk is not whether Zap can describe a coherent architecture; it is whether
      the company can execute two hard reactor programs without stretching capital and management
      bandwidth. Independent commentary treats the dual-track plan as a plausible way to create
      earlier revenue, but also as a real detour risk for fusion if the fission program becomes the
      operational priority. The new fission product also inherits concrete diligence questions: one
      independent report says Zap must update and re-validate legacy 4S simulation codes to modern
      U.S. standards and secure original test data or run new tests, while the public materials
      still do not disclose plant-level cyber controls, third-party certifications, service SLAs,
      or uptime metrics. Those omissions do not invalidate the strategy, but they do cap confidence
      in deployment readiness.
    claimRefs: [CE011, CE013, CE014, CE015]
