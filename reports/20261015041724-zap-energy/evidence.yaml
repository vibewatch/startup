evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: >-
      Current revenue run-rate, bookings or backlog, named customers, paid pilots, and any signed offtake or prepayment
      contracts.
    whyItMatters: >-
      The company now presents a broader commercialization story, but public evidence still does not show whether demand
      has converted into contracted revenue or customer validation.
    diligencePath: >-
      Request a customer and contract schedule with annual contract value, counterparty, stage, cancellation terms, and
      whether any payments have already been received.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: current-valuation-and-runway
    missingEvidence: >-
      A 2026 valuation update, extension or secondary pricing, cash on hand, monthly burn, and expected runway through
      the next fusion and fission milestones.
    whyItMatters: >-
      The last public valuation marker still points to the 2024 Series D, so downside or step-up risk since then cannot
      be judged from retained public evidence.
    diligencePath: >-
      Request the latest financing materials, cap table, preference stack, cash bridge, and board-approved operating
      plan.
  - type: private-evidence-only
    severity: minor
    topic: governance-and-control
    missingEvidence: >-
      Current board composition, voting/control rights, debt or project-finance obligations, and post-transition
      executive decision rights.
    whyItMatters: >-
      Leadership change and strategic scope expansion matter more if governance, investor rights, or decision
      bottlenecks constrain execution.
    diligencePath: Request the current board list, governance matrix, investor-rights summary, and an updated executive org chart.
  - type: missing-source
    severity: material
    topic: quantitative-sizing-gap
    missingEvidence: >-
      A product-specific TAM/SAM/SOM model with geography, site counts, MW demand, pricing, adoption timing, and
      exclusion logic.
    whyItMatters: >-
      Without comparable market inputs, a precise revenue opportunity or market-share forecast would be invented rather
      than evidenced.
    diligencePath: >-
      Obtain management's segment model and reconcile it with independent utility, industrial-load, siting, and
      procurement datasets.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-and-payer-gap
    missingEvidence: >-
      Named buyers, procurement owners, budget sources, willingness-to-pay evidence, and contractual payment obligations
      by segment.
    whyItMatters: >-
      Use-case statements do not establish a funded buyer, adoption cycle, customer commitment, or reachable sales
      pipeline.
    diligencePath: >-
      Review customer interviews, pipeline stages, requests for proposals, site studies, reservations, and offtake or
      prepayment terms.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: product-economics-gap
    missingEvidence: >-
      Reactor output, overnight and installed cost, power price, capacity factor, availability, construction schedule,
      and operating-cost assumptions for each product path.
    whyItMatters: >-
      These inputs determine which sites are economically eligible and whether broad demand can convert into an
      addressable market.
    diligencePath: >-
      Request product specifications and techno-economic models, then benchmark them against incumbent grid, fuel,
      storage, and nuclear alternatives.
    relatedQuestionRefs:
      - QM002
      - QM005
      - QM007
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracting
    missingEvidence: Public PPA, offtake, reservation, or pilot-commercial contract terms for Zap or any named direct rival.
    whyItMatters: Competitive pricing and buyer switching claims remain narrative-heavy without reader-verifiable commercial terms.
    diligencePath: >-
      Request customer term sheets, pilot MOUs, or procurement filings that show price units, milestones, and
      counterparties.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: customer-traction
    missingEvidence: >-
      Named customers, developers, utilities, or large-load buyers evaluating Zap against Helion, Pacific Fusion, or
      General Fusion.
    whyItMatters: >-
      The first real moat in this category is likely to come from counterparties and siting commitments, not from
      architecture rhetoric alone.
    diligencePath: Obtain pipeline-by-stage disclosure, LOIs, siting agreements, or public utility partnership filings.
    relatedQuestionRefs:
      - QP001
      - QP006
  - type: missing-source
    severity: minor
    topic: peer-benchmark-depth
    missingEvidence: >-
      Fresh 2026 funding, headcount, and technical milestone disclosures for Commonwealth Fusion Systems, Helion, and
      General Fusion from sources inside this assigned pool.
    whyItMatters: >-
      The profile table otherwise mixes precise data for Zap and Pacific with partial rival references, which weakens
      row-to-row comparability.
    diligencePath: Add current company disclosures or major financing coverage for each rival in a later refresh.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: >-
      List pricing, realized pricing, contract form, reservation or prepayment structure, and any signed commercial
      commitments for fission or fusion offerings.
    whyItMatters: Without customer economics, the revenue bridge remains a narrative rather than a model.
    diligencePath: >-
      Request current term sheets, quoted price bands, pipeline stages, and any executed customer agreements or
      reservations.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      FOAK and NOAK capex per MWe, gross-margin bridge, O&M burden, power price targets, availability assumptions, and
      replacement-cost economics.
    whyItMatters: These inputs determine whether the lower-complexity architecture actually creates investable hardware margins.
    diligencePath: Request product-level financial models, vendor quotations, and management's capex-to-margin sensitivity cases.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash on hand, monthly burn, runway by program, and any debt, credit, or project-finance obligations.
    whyItMatters: Capital adequacy and next-round timing cannot be underwritten from public sources without cash and burn data.
    diligencePath: >-
