company:
  name: Zap Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence still supports a pre-revenue underwriting frame for Zap Energy: the company is
    marketing a staged fission-plus-fusion platform, but retained sources disclose financing rounds
    and engineering milestones far more clearly than current pricing, customer contracts, margin, or
    runway. The financial bull case is that near-term fission deployments and a shared nuclear
    engineering stack can pull revenue forward and reduce duplicated spend; the blocker is that those
    economics remain directionally described rather than publicly quantified.
sections:
  - id: staged-revenue-model
    title: Staged monetization is the public story, not current commercial revenue
    body: >-
      The retained 2026 materials describe a staged revenue model rather than a currently monetized
      one. Zap's own integrated-platform paper and announcement present advanced fission as the
      nearer-term market-entry path while fusion remains the longer-dated commercialization goal, and
      the website positions that stack against firm-power demand from AI infrastructure, industrial
      heat, remote sites, logistics, and government applications. Independent coverage reinforces the
      same structure: Fusion Energy News characterizes the thesis as deleting expensive magnets to
      lower capex while bridging to revenue through SMR fission, and CFACT reports management is
      explicitly framing compact modular fission systems as the route to near-term, bankable power.
      The public problem is that this narrative is still much better specified than the actual
      monetization terms. The only hard public revenue datapoint in the retained record is the July
      2024 Form D's "No Revenues" disclosure, and the current retained set still does not publish
      product pricing, contract structure, or named monetized customer commitments.
    claimRefs: [CI001, CI002, CI005, CI009, CI013, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost-advantage claims are plausible, but public unit economics are still directional
    body: >-
      Zap's public cost story rests on architecture and shared industrial systems, not disclosed
      financial outputs. The fusion technology page claims the company avoids superconducting
      magnets, high-power laser arrays, and cryogenic systems, while the integrated-platform
      materials argue that liquid-metal systems, heat transfer, advanced materials, modular
      construction, and balance-of-plant engineering can be reused across fission and fusion. That
      is financially important because it implies less duplicated engineering, a wider vendor base,
      and a chance to learn on nearer-term hardware before fusion plants are commercial. Independent
      coverage adds a similar interpretation, framing Zap as trying to lower capex and speed
      iteration. But the public record still stops short of underwriting math: retained sources do
      not disclose capex per MWe, gross margin, power price, service burden, availability, or
      replacement-cost assumptions. Century is therefore best treated as an engineering de-risking
      milestone, not as evidence that margin structure is already visible.
    claimRefs: [CI003, CI004, CI005, CI006, CI014]
    tableRefs: [TI003]
  - id: capital-needs-and-financing-dependency
    title: Fresh capital is real, but it is funding plant engineering rather than proving self-funding demand
    body: >-
      The financing record is clearer than the operating one. Zap's 2024 Form D shows a roughly
      USD130 million round fully sold, and both World Nuclear News and GeekWire independently
      describe that raise as approximately USD130 million. GeekWire says the round followed a
      USD160 million 2022 financing and would bring total venture funding to roughly USD330 million,
      plus grants. World Nuclear News also reports management's stated use of proceeds: plasma R&D,
      systems-level plant engineering and integration, the next FuZE device generation, and a new
      pulsed-power capacitor bank. That is consistent with a company still financing technical and
      industrialization milestones rather than scaling a disclosed commercial backlog. The adverse
      underwriting signal is timing risk: GeekWire notes Zap had earlier predicted scientific
      breakeven in 2023 and did not hit it, which means new capital is supporting a longer
      development path than earlier ambition suggested. Without disclosed cash on hand, monthly burn,
      or debt/project-finance commitments, capital adequacy cannot be underwritten from public
      evidence alone.
    claimRefs: [CI007, CI008, CI010, CI011, CI012, CI014]
  - id: financial-verdict
    title: "Verdict: promising platform logic, but still a capital-intensive pre-revenue diligence case"
    body: >-
      Financially, Zap reads as a technically ambitious nuclear-platform company whose public story
      is ahead of its public economics. The upside case is coherent: use nearer-term fission
      deployments and shared industrial systems to create a broader revenue path and avoid forcing
      fusion to carry the whole capital burden alone. The downside case is just as clear: the public
      record still lacks current revenue, pricing, customer-contract evidence, gross-margin math,
      capex per unit, burn, and runway, while commercialization timelines have already stretched
      versus earlier expectations. That means the chapter's investable conclusion is not that Zap's
      economics are poor; it is that the decisive inputs remain private. Until management produces a
      revenue bridge, cost stack, and financing runway by program, underwriting should assume
      continued financing dependency and material execution risk.
    claimRefs: [CI001, CI005, CI007, CI012, CI014]
