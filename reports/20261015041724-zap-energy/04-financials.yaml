      - ["Fusion power plants", "Future plant sale or long-duration power delivery", "Per plant / MWe / power contract", "Fusion remains the longer-dated commercialization objective and is not presented as current revenue", "Pre-commercial", "First commercial term sheet, buyer profile, and delivery timeline"]
      - ["Government and milestone funding", "Grant, milestone, or non-dilutive program support", "Per award / milestone", "DOE-related support is disclosed, but retained sources do not provide a full award-value bridge here", "Supplemental, not core monetization", "Award size, cost-share terms, draw schedule, and restrictions"]
    notes: "Rows distinguish strategic monetization paths from current public revenue evidence; null economics remain undisclosed rather than zero."
    claimRefs: [CI001, CI005, CI009, CI013, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price or unit basis
      - List vs realized
      - Unknowns / caveats
      - Source signal
    rows:
      - ["Fusion product", "No public price disclosed", "Unknown", "No public PPA, reactor sale, reservation, or prepayment terms in retained sources", "Current public materials and independent coverage"]
      - ["Advanced fission product", "No public price disclosed", "Unknown", "Commercialization path is public, but not the price, EPC scope, financing structure, or site economics", "Official announcement and independent profiles"]
      - ["Century platform", "Engineering milestone, not priced revenue", "n/a", "Validates plant-relevant testing, but not ASP, gross margin, or service cost", "World Nuclear News milestone reporting"]
      - ["2024 financing round", "Approx. USD130 million capital raise", "Capital, not customer revenue", "Supports runway only if burn and cash balances are known, which they are not", "Form D plus independent reporting"]
    notes: "This table separates disclosed financing from undisclosed product monetization; 'unknown' means not publicly provided in retained evidence."
    claimRefs: [CI006, CI007, CI008, CI009, CI011, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Current revenue / ARR", "2024 Form D: No Revenues; no newer public revenue bridge retained", "Medium", "Sets the base case as pre-revenue unless management proves later commercialization", "2025-2026 revenue bridge, backlog, and any recurring-service mix"]
      - ["Gross margin / contribution margin", null, "Low", "Required to judge whether hardware and service economics can support venture-style returns", "Gross-margin bridge by product line and service burden assumptions"]
      - ["Capex per MWe / first commercial unit cost", null, "Low", "Core determinant of competitiveness and external financing need", "FOAK and NOAK capex model, vendor quotes, and contingency assumptions"]
      - ["Sales cycle / CAC / payback", null, "Low", "Public GTM efficiency is impossible to test without cycle and conversion data", "Pipeline stages, cycle length, CAC, channel terms, and close rates"]
      - ["Cash balance / monthly burn / runway", null, "Low", "Determines next-round trigger and negotiating leverage", "Cash on hand, burn by fission vs fusion program, and runway sensitivities"]
    notes: "Null means the metric is not publicly disclosed in retained sources; it does not imply zero or immateriality."
    claimRefs: [CI003, CI004, CI006, CI009, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a staged monetization path: nearer-term fission deployments and
      shared industrial capabilities are meant to fund and de-risk longer-dated fusion
      commercialization.
    data:
      nodes:
        - label: Firm-power demand pockets
          detail: AI/data centers, remote sites, industrial heat, logistics electrification, and government resilience needs.
          tone: neutral
        - label: Site-specific reactor deployments
          detail: Zap markets modular, grid-connected, behind-the-meter, and remote-use systems rather than commodity retail power.
          tone: neutral
        - label: Near-term fission monetization
          detail: Independent coverage says the fission push is intended to generate earlier revenue while fusion matures.
          tone: positive
        - label: Shared nuclear stack
          detail: Liquid-metal systems, materials, heat transfer, modular construction, and balance-of-plant engineering are reused across both tracks.
          tone: positive
        - label: Fusion plant development
          detail: Century, FuZE, and systems integration work continue the longer-dated path toward commercial fusion plants.
          tone: neutral
        - label: Capital recycling into engineering
          detail: New financing is still being directed into plasma R&D and plant-level integration rather than a publicly priced commercial fleet.
          tone: risk
    approximationNotes: "Directional only: retained sources describe the path qualitatively and do not publish product pricing, margin, or conversion rates."
    claimRefs: [CI001, CI002, CI004, CI005, CI006, CI011]
callouts:
  - calloutType: risk
    title: Underwriting is blocked by absent operating economics
    body: >-
      Public evidence establishes the financing events and engineering program, but not the numbers
      an investor needs to turn that program into a model: there is no retained public disclosure of
      current price, realized contract structure, gross margin, capex per MWe, cash balance, monthly
      burn, or runway.
    claimRefs: [CI009, CI014]
  - calloutType: insight
    title: The capital story is financing industrialization, not proving demand conversion
    body: >-
      The disclosed raise is material, but retained sources say the money is going into plasma R&D,
      systems engineering, the next FuZE device generation, and pulsed-power hardware. That is the
      spend pattern of a company still building a plant-ready platform, not one already disclosing
      repeatable commercial conversion metrics.
    claimRefs: [CI006, CI007, CI011]
