  - id: TU003
    title: Named customer proof table
    columns:
      - Counterparty / proof surface
      - Segment
      - Deployment or commercial evidence
      - Production vs pilot
      - Outcome signal
      - Limitation
    rows:
      - - TransAlta
        - Utility / retired thermal site host
        - >-
          GeekWire says Zap is exploring whether it could place a fusion plant at TransAlta's coal site and
          reuse equipment and workforce.
        - Pre-siting exploration
        - Named third-party infrastructure relationship
        - No signed customer agreement, power-price disclosure, or construction timeline is public.
      - - U.S. Department of Energy Milestone-Based Fusion Development Program
        - Government program sponsor
        - GeekWire says Zap was one of eight recipients in the DOE milestone program.
        - Program validation, not deployment
        - Shows third-party technical endorsement and access to program capital
        - The program is not evidence of a paying end-customer or recurring reactor demand.
      - - Department of Defense / Department of Energy programs and large power users
        - Government programs and strategic power buyers
        - >-
          TechCrunch says Zap's fission revenue could come from federal programs, milestone payments, and
          reserved production capacity.
        - Prospective only
        - Suggests a land-first commercial model tied to scarce future capacity
        - No named buyer, reservation, prepayment, or binding contract is disclosed.
