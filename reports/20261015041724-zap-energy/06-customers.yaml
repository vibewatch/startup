company:
  name: Zap Energy
chapter:
  number: 6
  title: Customers
  summary: >-
    Zap can articulate several high-load customer segments, but the public proof set still looks like market
    positioning and counterparties-in-formation rather than contracted deployment at scale. The strongest
    named external evidence is DOE program validation and a TransAlta siting exploration, while retention,
    concentration, and paid offtake evidence remain undisclosed in the reviewed 2026 materials.
sections:
  - id: target-segments-and-customer-thesis
    title: Target segments are broad, but still mostly thesis-level
    body: >-
      Zap now markets itself to a wide set of power-hungry and infrastructure-constrained buyers rather than a
      single beachhead. The company’s homepage explicitly calls out AI infrastructure, remote industrial
      sites, industrial heat, logistics and fleet electrification, national-security users, and grid
      decarbonization needs, while the April 2026 integrated-platform announcement repeats the same pattern
      around AI, transport, manufacturing, and security. That breadth is useful as a demand narrative, but the
      public material is still mostly segment framing: the sources show where Zap thinks modular nuclear
      demand should emerge, not which named customers are already paying, deploying, or renewing.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU009
      - CU014
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: public-adoption-proof-is-early
    title: Public adoption proof is still early and counterparty-heavy
    body: >-
      The strongest externally named proof points are not production customers; they are validation and siting
      surfaces. GeekWire says Zap was one of eight awardees in DOE’s Milestone-Based Fusion Development
      Program and that the company is exploring a fusion-plant site with TransAlta in Southwest Washington.
      TechCrunch adds a prospective commercial model in which the fission effort could generate milestone
      payments or reserved production-capacity commitments from very large power users, but that description
      is still forward-looking and does not disclose a signed customer, reserved megawatts, or a prepayment
      amount. In practice, the customer surface today looks like early program sponsorship, early siting
      conversations, and buyer hypotheses rather than a demonstrated book of deployments.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU002
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration remain unproven publicly
    body: >-
      Zap’s public materials sketch a plausible land-and-expand motion: secure government or strategic
      milestone capital first, reuse those programs and host-site relationships to de-risk deployment, and
      later sell or reserve scarce reactor capacity into data-intensive and industrial accounts. The problem
      is that the reviewed sources stop before the usual durability evidence begins. None of the public
      materials reviewed here disclose NRR, GRR, churn, contract length, renewal rates, customer-count by
      segment, or top-customer concentration. That keeps customer quality in the “interesting but unproven”
      bucket: there is a credible demand story and a named set of counterparties, but not yet the hard
      retention or concentration data needed to underwrite recurring commercial durability.
    claimRefs:
      - CU005
      - CU008
      - CU010
      - CU013
    tableRefs:
      - TU003
