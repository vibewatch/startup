figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Zap's public customer path runs from segment-level demand framing to government validation and future
      capacity reservations, with commercial durability still unproven.
    data:
      items:
        - label: Identify power-constrained segments
          actor: Zap commercial positioning
          phase: Demand trigger
          touchpoints:
            - AI infrastructure
            - remote industrial loads
            - industrial heat
            - logistics electrification
          tone: opportunity
        - label: Pitch modular nuclear as on-site or grid-connected supply
          actor: Prospective infrastructure buyers
          phase: Solution framing
          touchpoints: Dedicated, grid-connected or behind-the-meter power that scales with computing demand.
          tone: opportunity
        - label: Secure validation and early program capital
          actor: DOE / potential DoD sponsors
          phase: Early proof
          touchpoints:
            - DOE milestone program participation
            - federal-program revenue path discussed by TechCrunch
          tone: neutral
        - label: Move into named host-site exploration
          actor: TransAlta and similar hosts
          phase: Development proof
          touchpoints: Explore retired-plant reuse and siting before any public production deployment.
          tone: neutral
        - label: Test milestone-payment and reserved-capacity model
          actor: Large power users
          phase: Expansion loop
          touchpoints: >-
            Prospective milestone payments and reserved production capacity from companies that need massive
            amounts of electricity.
          tone: opportunity
        - label: Prove renewals, concentration, and delivered megawatts
          actor: Future customer base
          phase: Durability gap
          touchpoints: >-
            No public NRR, GRR, churn, top-customer concentration, or signed offtake disclosed in the reviewed
            sources.
          tone: risk
    approximationNotes: >-
      The map reflects the ordered commercial logic described in public materials; it does not imply that any
      stage has already converted into contracted reactor deliveries.
