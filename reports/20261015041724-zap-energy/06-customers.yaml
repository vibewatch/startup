  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: durability-metrics
      missingEvidence: >-
        Customer retention metrics such as NRR, GRR, churn, renewal dates, contract terms, or cohort behavior
        by reactor program or segment.
      whyItMatters: >-
        Without durability metrics, investors cannot distinguish curiosity or pilot interest from repeatable
        recurring demand.
      diligencePath: >-
        Request customer pipeline and retention reporting by segment, including any LOIs, reservations,
        renewals, expirations, and concentration by expected MW or revenue.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU002
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Named paid offtake, prepayment, capacity-reservation, or commercial-host agreements with
        counterparties, volumes, milestones, and pricing terms.
      whyItMatters: >-
        The current public evidence names counterparties and revenue concepts, but it does not show whether
        demand is diversified or concentrated in a few strategic buyers.
      diligencePath: >-
        Ask management for executed agreements, pipeline stages, top-customer concentration, reserved-capacity
        MW, and the split between government-program revenue and commercial buyer commitments.
      relatedQuestionRefs:
        - QU003
        - QU005
      relatedTableRefs:
        - TU003
