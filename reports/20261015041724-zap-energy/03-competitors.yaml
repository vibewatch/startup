      - Unknowns or caveats
      - Implication
    rows:
      - - Zap fusion platform
        - "No public list price; Multiples labels the model as product sales"
        - "Compact fusion plant narrative plus ongoing reactor-development roadmap"
        - "No public PPA, reservation, prepayment, or pilot-contract terms in this pool"
        - "Competitive debate remains pre-pricing and pre-customer"
      - - Zap integrated fission-plus-fusion strategy
        - "No public pricing for the fission product path"
        - "Adds advanced fission as a nearer-term commercial bridge and regulatory-learning path"
        - "Commercial terms, IP scope, and licensing milestones are not public in this pool"
        - "Potentially broadens buyer conversations before fusion economics are bankable"
      - - Direct-rival fusion offerings
        - "No public list pricing or discount structure in the assigned evidence"
        - "Pacific discloses modular 100-300 MW design targets; other rivals are only partially described"
        - "Most peers disclose financing and technical targets before customer terms"
        - "Competition is currently for capital credibility and milestones rather than transparent price leadership"
    notes: >-
      Unknown does not mean absent in reality; it means the assigned prefetched
      evidence does not provide reader-verifiable commercial terms. This is a real
      diligence limitation for any pricing-based competitive judgment.
    claimRefs: [CP004, CP005, CP014, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The competitive field clusters around two narratives: simpler modular pulse
      architectures and some form of nearer-term commercialization bridge.
    data:
      xAxis:
        label: Architecture simplicity / modularity
        min: 1
        max: 5
        low: "Large, custom, or steady-state systems"
        high: "Modular, pulsed, or low-complexity systems"
        description: "Author ordinal scores synthesized from the assigned source set"
        scale: ordinal
      yAxis:
        label: Commercial bridge visibility
        min: 1
        max: 5
        low: "Pure R&D path"
        high: "Nearer-term bridge, committed capital, or incumbent pathway"
        description: "Author ordinal scores synthesized from the assigned source set"
        scale: ordinal
      points:
        - label: Zap Energy
          x: 5
          y: 4
          detail: "Magnet-free pulsed architecture plus a disclosed 2026 fission bridge."
        - label: Pacific Fusion
          x: 5
          y: 3
          detail: "Modular pulser architecture with >$1B financing, but no non-fusion bridge disclosed."
        - label: Tokamak / stellarator class
          x: 1
          y: 2
          detail: "Large magnetic systems and huge facility footprints remain the reference alternative."
        - label: Laser-style inertial class
          x: 2
          y: 2
          detail: "Ignition precedent exists, but repetition for power use remains a cited hurdle."
        - label: General Fusion / MTF class
          x: 3
          y: 2
          detail: "Comparative brief highlights liquid-metal vortex stability and synchronization risk."
        - label: TAE / FRC class
          x: 3
          y: 2
          detail: "Comparative brief flags bremsstrahlung economics as a scaling bottleneck."
    approximationNotes: >-
      Axes are ordinal 1-5 analyst scores derived from the assigned evidence, not
      measured plant performance or customer outcomes.
    claimRefs: [CP002, CP004, CP008, CP010, CP011, CP012, CP013]
callouts:
  - calloutType: insight
    title: Modularity is a competitive theme, not a proprietary narrative
    body: >-
      Zap's magnet-free design still reads as differentiated, but Pacific Fusion
      shows that investors can now hear a very similar low-complexity, modular
      pitch from another heavily financed pulsed-power entrant.
    claimRefs: [CP002, CP007, CP008, CP014]
  - calloutType: risk
    title: The fission bridge helps the story but increases execution breadth
    body: >-
      Adding advanced fission may improve Zap's regulatory and revenue optionality,
      yet it also turns a single-program fusion race into a broader nuclear
      execution challenge before the core fusion product has public pricing or
      customer proof.
    claimRefs: [CP004, CP005, CP013]
