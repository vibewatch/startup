  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-and-contracting
      missingEvidence: Public PPA, offtake, reservation, or pilot-commercial contract terms for Zap or any named direct rival.
      whyItMatters: Competitive pricing and buyer switching claims remain narrative-heavy without reader-verifiable commercial terms.
      diligencePath: Request customer term sheets, pilot MOUs, or procurement filings that show price units, milestones, and counterparties.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: customer-traction
      missingEvidence: Named customers, developers, utilities, or large-load buyers evaluating Zap against Helion, Pacific Fusion, or General Fusion.
      whyItMatters: The first real moat in this category is likely to come from counterparties and siting commitments, not from architecture rhetoric alone.
      diligencePath: Obtain pipeline-by-stage disclosure, LOIs, siting agreements, or public utility partnership filings.
      relatedQuestionRefs: [QP001, QP006]
    - type: missing-source
      severity: minor
      topic: peer-benchmark-depth
      missingEvidence: Fresh 2026 funding, headcount, and technical milestone disclosures for Commonwealth Fusion Systems, Helion, and General Fusion from sources inside this assigned pool.
      whyItMatters: The profile table otherwise mixes precise data for Zap and Pacific with partial rival references, which weakens row-to-row comparability.
      diligencePath: Add current company disclosures or major financing coverage for each rival in a later refresh.
      relatedQuestionRefs: [QP003]
