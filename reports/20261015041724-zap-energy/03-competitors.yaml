        - "Tokamaks and stellarators still rely on large magnetic systems"
        - "Zap competes on simplicity, but Pacific attacks the same pain point"
      - - Manufacturing narrative
        - "Compact design and shared nuclear industrial stack"
        - "Factory-built pulser modules using common materials"
        - "Large magnetic-confinement builds remain capital-heavy in adverse coverage"
        - "Modularity is becoming a table-stakes claim, not a Zap-only moat"
      - - Near-term commercial bridge
        - "Fusion plus announced advanced-fission expansion"
        - "Fusion-only path with unusually large committed capital"
        - "Incumbent fission and other firm-power substitutes already have deployment pathways"
        - "Zap's bridge is unusual, but it broadens scope as much as it narrows timeline risk"
      - - Core technical bottleneck
        - "Maintain kink-stable operation at commercial pulse repetition rates"
        - "Deliver full-scale pulser modules and net facility gain"
