company:
  name: Zap Energy
chapter:
  number: 3
  title: Competitors
  summary: >-
    Zap competes in a crowded but still pre-commercial fusion field where the main
    race is for technical credibility, financing, and a believable path to first
    revenue rather than for transparent price leadership. The assigned evidence
    suggests Zap's clearest differentiation is a magnet-free pulsed architecture
    plus a 2026 fission bridge, but peers such as Pacific Fusion now pair similar
    low-complexity narratives with larger disclosed financing, while public
    customer and pricing evidence remains thin across the category.
sections:
  - id: landscape
    title: Competitive set now spans direct fusion peers, adjacent nuclear, and firm-power substitutes
    body: >-
      The assigned evidence supports a broader landscape than a simple one-company
      fusion comparison. Multiples places Commonwealth Fusion Systems among
      comparable companies to Zap, while GeekWire's regional reporting identifies
      Helion Energy and General Fusion as nearby rivals also attracting large pools
      of capital. Pacific Fusion is the clearest newly disclosed direct peer in the
      pool because it publishes an explicit 2026 financing figure, a pulsed-power
      product narrative, and a utility-scale plant target. Zap also changed the
      frame in 2026 by adding advanced fission to its strategy, which means the
      company is no longer positioning only against other fusion startups: it is
      also trying to compete for buyer attention with nearer-term nuclear and
      other firm-power alternatives. That broader framing matters because the
      category still sells future capability more than present contracts, so the
      competitive contest is currently about which team can make the most credible
      commercialization path visible before public price discovery arrives.
    claimRefs: [CP003, CP004, CP007, CP009, CP015, CP016]
    tableRefs: [TP001]
  - id: differentiation
    title: Zap's architecture pitch is differentiated, but rivals are converging on modularity claims
    body: >-
      Zap's strongest product-positioning advantage in the assigned evidence is a
      magnet-free sheared-flow-stabilized Z-pinch architecture that the company and
      outside summaries both frame as simpler than fusion approaches dependent on
      large superconducting magnets or high-power lasers. That simplicity story is
      meaningful, but it is not unique. Pacific Fusion is also selling a pulsed,
      modular system that avoids lasers and superconducting magnets, and its public
      narrative explicitly emphasizes factory-built modules, common industrial
      materials, and 100-300 MW units. The result is that Zap's differentiation is
      best described as a specific technical route inside a broader modular-pulse
      competitive cluster rather than as a category with no close substitutes. The
      independent comparative brief in the pool reinforces that interpretation by
      showing each major fusion class with its own bottleneck: Zap's class must
      sustain kink-stable repetition, General Fusion must stabilize a liquid-metal
      vortex and synchronized pistons, and TAE must solve an unfavorable radiation
      economics problem.
    claimRefs: [CP001, CP002, CP008, CP010, CP011, CP014]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability-risks
    title: Moat durability is still constrained by disclosure gaps and industry-wide timeline risk
    body: >-
      The weakest part of the current competitive case is not the physics story but
      the missing commercial proof. Multiples describes Zap as a B2B product-sales
      business, yet the assigned evidence does not disclose public pricing, offtake,
      reservation terms, or a named customer decision process for Zap or for most
      peers. That leaves investors comparing financing rounds, laboratory progress,
      and management narratives rather than contract conversion or switching data.
      Adverse evidence also cuts against any near-term winner-take-all moat claim.
      GeekWire reported that Zap missed an earlier scientific-breakeven target, and
      the Bulletin argued that commercial fusion broadly remains far from proof of
      principle, especially for large magnetic-confinement systems. Zap's fission
      expansion may improve its revenue and regulatory story relative to fusion-only
      startups, but it also widens execution scope precisely when the core fusion
      program still lacks public customer and economics evidence.
    claimRefs: [CP005, CP006, CP012, CP013, CP014, CP016]
    tableRefs: [TP003]
