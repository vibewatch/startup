company:
  name: Zap Energy
chapter:
  number: 8
  title: Valuation
  summary: >-
    Zap Energy has credible engineering progress and more than $300 million of reported
    historical funding, but the reviewed evidence does not establish a current valuation,
    commercial reactor output, customer-backed unit economics, or a disclosed capital stack.
    The resulting stance is research-more, with high risk and no supportable numerical valuation
    range until price, runway, preferences, and milestone-linked commercial evidence are disclosed.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      The evidence supports a research-more recommendation rather than a price-insensitive
      investment. Independent coverage places historical funding above $300 million, with one
      source reporting $330 million, but funding raised is not cash available and neither figure
      supplies a current transaction price. The retained financing and strategy coverage does not
      disclose a current valuation, cash balance, burn, preference stack, dilution schedule,
      contracted revenue, or unit economics. That makes confidence medium at best and risk high:
      the company has financed meaningful technical work, but an investor cannot calculate a
      credible entry multiple, target return, or downside recovery from public evidence. Entry
      discipline should therefore be milestone- and terms-driven, not anchored to historical
      capital raised.
    claimRefs: [CV001, CV002, CV003, CV016]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Zap can turn a comparatively compact fusion architecture, repetitive
      systems integration work, and shared nuclear engineering into two commercialization paths.
      Century has operated more than one hundred pulses at 0.2 Hz and 39 kW to the plasma chamber,
      while the company maintains a research library that includes a paper on a 100-kW-scale
      repetitive system. The anti-thesis is equally material: Century uses no fusion fuel and
      produces no fusion reactions, independent technical coverage still identifies commercial
      pulse-rate stability as a bottleneck, and the fission expansion adds a second capital-,
      regulatory-, and customer-intensive program. Those facts make platform synergy plausible
      but not yet equivalent to commercial proof.
    claimRefs: [CV004, CV008, CV009, CV010, CV011, CV012, CV015]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Scenario framework without false precision
    body: >-
      A numerical bull/base/bear valuation would be false precision because the public record
      reviewed here lacks current price, fully diluted ownership, cash, burn, revenue, gross
      margin, contracted capacity, plant capex, and a demonstrated commercial power output. The
      scenarios therefore define evidence conditions and entry logic rather than invented dollar
      ranges. The bull case requires customer-funded milestones and regulatory progress to convert
      fission into a financing bridge without slowing fusion. The base case assumes technical
      progress continues but commercial proof and price discovery remain private. The bear case
      treats the dual program as a permanent detour that consumes capital faster than either
      reactor reaches bankable deployment. Only a priced round or secondary transaction with full
      terms can translate these cases into return ranges.
    claimRefs: [CV001, CV005, CV006, CV007, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is low because the available sources show engineering milestones and a
      proposed bridge-to-revenue model, not recurring commercial economics. Management has
      discussed fission revenue within a year through government programs, milestone payments, or
      reserved production capacity, and another interview placed fission commercialization in the
      early 2030s with fusion later. These are forward-looking company expectations, not contracted
      cash flows. Before underwriting an exit, investors should obtain the current cap table,
      liquidation preferences, pro rata rights, debt and grant conditions, monthly burn, milestone
      budgets, customer documents, licensing plan, and program-level resource allocation. Thesis
      breaks include a financing that materially subordinates new money, failure to secure paid
      fission milestones, slippage beyond disclosed deployment windows, or evidence that fission
      staffing and capital defer core fusion milestones.
    claimRefs: [CV005, CV006, CV007, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
