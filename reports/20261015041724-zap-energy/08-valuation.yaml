    notes: "Assessments use retained public evidence as of 2026-10-15; unknown means the required private valuation inputs were not disclosed, not that value is zero."
    claimRefs: [CV001, CV002, CV003, CV009, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Century demonstrates repetitive integrated operation at 39 kW to the plasma chamber.", "Sustained operation at higher duty cycle with independently reviewed availability and component-life data."]
      - [Thesis, "Zap's research library documents continuing work on repetitive Z-pinch systems.", "Independent replication or third-party technical diligence connecting published results to plant requirements."]
      - [Thesis, "Shared liquid-metal, heat-transfer, and power-conversion work could reduce duplicated engineering.", "Program budgets showing measurable reuse without slowing fusion-critical work."]
      - [Anti-thesis, "Century does not use fusion fuel or produce fusion reactions.", "A system-level demonstration that closes the gap from integration testing to net plant output."]
      - [Anti-thesis, "Cost-effective SMR mass production remains unproven and scale benefits can take years.", "A licensed design, qualified factory plan, and customer-funded orderbook with credible delivery economics."]
      - [Anti-thesis, "The dual-track strategy adds overlapping technical, regulatory, capital, and customer-acquisition demands.", "Ring-fenced funding, accountable milestones, and evidence that fission accelerates rather than displaces fusion."]
    notes: "Arguments distinguish demonstrated test-platform facts from company strategy and independent downside assessments; no row implies commercial power generation."
    claimRefs: [CV004, CV008, CV009, CV010, CV011, CV012, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Case, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Paid fission milestones arrive, licensing advances, and shared engineering accelerates fusion.", "A numerical range still requires disclosed round terms; justify a higher relative price only after contracted proof.", "Customer-funded capacity, regulator-accepted milestones, and stable fusion cadence.", "Fission wins work but fusion milestones slip or shared-system savings do not appear."]
      - [Base, "Engineering milestones continue while commercialization, valuation, and customer economics remain private.", "Track rather than price; require a discount for illiquidity, dilution, and long-duration technical risk.", "Published technical progress without bankable customer or transaction evidence.", "Runway shortens before the next independently verifiable technical or commercial milestone."]
      - [Bear, "The second reactor becomes a capital-intensive detour and neither program reaches bankable deployment.", "Downside cannot be bounded without preferences and asset-recovery data; avoid unsupported salvage assumptions.", "Repeated schedule resets, bridge financing, or reliance on uncontracted government and customer payments.", "A financing subordinates new capital or a key licensing, customer, or system milestone fails."]
    notes: "Scenarios are qualitative because current valuation, cap table, cash, burn, revenue, unit economics, and transaction terms are not public in the retained evidence."
    claimRefs: [CV001, CV005, CV006, CV007, CV013, CV014, CV015, CV016]
