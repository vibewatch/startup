      - number: '3.3'
        title: 信息缺口与全行业时间风险限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              当前竞争论据最弱的地方不是物理学叙事，而是缺少商业证明。Multiples 将 Zap 描述为 B2B 产品销售业务，但分配证据没有披露 Zap
              或多数同行的公开定价、承购、预留条款或明确的客户决策流程。这使投资者比较的是融资轮次、实验室进展和管理层叙事，而不是合同转化或切换数据。反向证据也不支持近期赢家通吃的护城河主张。GeekWire 报道 Zap
              未达到早期科学盈亏平衡目标，Bulletin 则认为商业聚变总体距离原理验证仍很远，尤其是大型磁约束系统。相比纯聚变初创企业，Zap
              的裂变扩张可能改善收入和监管叙事；但此时核心聚变项目仍缺少公开客户和经济性证据，扩张也扩大了执行范围。
            claimRefs:
              - CP005
              - CP006
              - CP012
              - CP013
              - CP014
              - CP016
