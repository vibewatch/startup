      - number: '4.3'
        title: 新鲜资本确实存在，但资金用于电厂工程，而非证明需求能够自我融资
        blocks:
          - type: paragraph
            body: >-
              融资记录比运营记录清晰。Zap 的 2024 年 Form D 显示约 USD130 million 的融资轮已全部售出，World Nuclear News 和 GeekWire 也分别将该轮描述为约
              USD130 million。GeekWire 称，这轮融资继 2022 年 USD160 million 融资之后，使风险投资总额达到约 USD330 million，另有补助。World Nuclear
              News 还报道管理层称资金将用于等离子体研发、系统级电厂工程与集成、下一代 FuZE
              设备以及新的脉冲电力电容器组。这与一家仍在为技术和工业化里程碑融资、尚未扩大已披露商业积压的公司一致。反向的承保信号是时间风险：GeekWire 指出 Zap 早先预计 2023
              年达到科学盈亏平衡但未能实现，意味着新资本支持的开发路径比早期目标更长。在现金余额、月度烧钱速度或债务 / 项目融资承诺未披露的情况下，仅凭公开证据无法评估资本充足性。
            claimRefs:
