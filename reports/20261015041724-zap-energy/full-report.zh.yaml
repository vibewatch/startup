              年 4 月报道显示，Conway 从 CEO 转任总裁，Zabrina Johal 接任 CEO。Johal
              的商业化和项目交付经历提升了运营可信度，而同时加入的裂变业务负责人也表明公司正试图从实验室里程碑走向工业化；不过，公开记录对董事会构成、控制权和继任梯队的呈现仍不完整。
