  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Zap 现在将自己定义为一体化先进核能平台，而不是纯聚变开发商。因此，可投资边界包括模块化裂变、聚变，以及未来混合系统的潜在设备和项目需求，目标买家需要稳定电力或工艺热能。边界不包括 Zap
              所列终端市场消耗的全部电力价值、所有数据中心资本支出和广义全球电力市场总额，因为这些价值都不会直接转化为反应堆收入。Zap
              自己的使用场景描述了现实替代方案：计算和关键任务场所可用现有电网，偏远运营可用运输燃料，工业可用现有热电系统。这些替代方案决定了真正的采用考验：核能必须满足场址经济性、可用性、许可和采购要求，而不只是应对增长中的需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
