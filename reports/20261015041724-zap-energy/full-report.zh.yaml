      - number: '4.4'
        title: 结论：平台逻辑有吸引力，但仍是资本密集型、收入前尽调案例
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Zap
              是一家技术野心很大的核能平台公司，其公开叙事领先于公开经济数据。上行逻辑是连贯的：利用较近的裂变部署和共享工业系统拓宽收入路径，避免让聚变独自承担全部资本负担。下行逻辑同样清晰：公开记录仍缺少当前收入、定价、客户合同证据、毛利测算、单位资本支出、烧钱速度和现金跑道，而商业化时间表已相对早期预期延后。因此，本章的可投资结论不是
              Zap 的经济性差，而是关键输入仍属私人信息。在管理层按项目披露收入桥接、成本结构和融资跑道之前，承保判断应假设公司仍依赖持续融资，并承担重大执行风险。
            claimRefs:
              - CI001
