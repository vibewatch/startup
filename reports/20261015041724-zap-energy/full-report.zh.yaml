  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范围已覆盖直接聚变同行、相邻核能与稳定电力替代方案
        blocks:
          - type: paragraph
            body: >-
              分配到的证据支持比单一聚变公司对比更宽的竞争版图。Multiples 将 Commonwealth Fusion Systems 列为 Zap 的可比公司；GeekWire 的区域报道则指出 Helion
              Energy 和 General Fusion 也是附近竞争者，同样吸引了大量资本。Pacific Fusion 是新增池中最清晰的直接同行，因为它公开了明确的 2026
              年融资金额、脉冲电力产品叙事和公用事业规模电厂目标。Zap 也在 2026
              年通过加入先进裂变改变了竞争框架：公司不再只与其他聚变初创企业竞争，也在争夺买家对更接近落地的核能和其他稳定电力方案的注意力。这一更宽的框架很重要，因为该类别目前卖的仍更多是未来能力而非当前合同；在公开价格发现到来前，竞争焦点是哪个团队能最可信地展示商业化路径。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP009
              - CP015
