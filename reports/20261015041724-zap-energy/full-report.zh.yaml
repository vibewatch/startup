  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 分阶段变现是公开叙事，而非当前商业收入
        blocks:
          - type: paragraph
            body: >-
              保留的 2026 年材料描述的是分阶段收入模式，而不是已经变现的业务。Zap 自己的一体化平台论文和公告将先进裂变定位为更近的市场进入路径，把聚变留作更长期的商业化目标；网站则将这一体系对准 AI
              基础设施、工业热能、偏远场址、物流和政府应用的稳定电力需求。独立报道强化了同一结构：Fusion Energy News 将其逻辑概括为取消昂贵磁体以降低资本支出，同时通过 SMR 裂变桥接到收入；CFACT
              报道管理层明确把紧凑型模块化裂变系统定位为近期可融资的电力路径。问题在于，这套叙事仍远比实际变现条款具体。保留记录中唯一明确的公开收入数据点，是 2024 年 7 月 Form D 的 “No Revenues”
              披露；当前保留资料仍未公布产品定价、合同结构或已命名的付费客户承诺。
