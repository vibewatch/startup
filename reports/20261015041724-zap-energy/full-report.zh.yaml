  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”建议，而不是不计价格的投资。独立报道将历史融资置于 $300 million 以上，其中一个来源报告为 $330
              million；但已募集资金不等于可用现金，两个数字都无法提供当前交易价格。保留的融资和战略报道没有披露当前估值、现金余额、烧钱速度、优先股堆叠、稀释计划、合同收入或单位经济性。因此，信心充其量为中等、风险较高：公司已经为有意义的技术工作融资，但投资者无法仅凭公开证据计算可信的入场倍数、目标回报或下行回收。入场纪律应由里程碑和条款驱动，而不是锚定历史融资额。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，Zap 可以把相对紧凑的聚变架构、重复系统集成工作和共享核能工程转化为两条商业化路径。Century 已以 0.2 Hz 运行超过一百个脉冲，向等离子体腔室输出 39 kW；公司研究库也收录了一篇关于
              100-kW 级重复运行系统的论文。反向逻辑同样重要：Century
              不使用聚变燃料，也不产生聚变反应；独立技术报道仍将商业脉冲率稳定性视为瓶颈；裂变扩张还增加了第二个资本密集、监管密集和客户密集的项目。这些事实让平台协同具有合理性，但尚不等同于商业证明。
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: 避免虚假精确的情景框架
        blocks:
          - type: paragraph
            body: >-
              数值化的乐观 / 基准 /
              悲观估值会造成虚假精确，因为此处审阅的公开记录缺少当前价格、完全稀释所有权、现金、烧钱速度、收入、毛利率、合同产能、电厂资本支出和已证明的商业发电量。因此，情景定义的是证据条件和入场逻辑，而不是虚构的美元区间。乐观情景要求客户出资的里程碑和监管进展将裂变变成融资桥，同时不拖慢聚变。基准情景假设技术进展继续，但商业证明和价格发现仍属私有信息。悲观情景将双项目视为永久绕路：资本消耗速度快于任一反应堆达到可融资部署。只有条款完整的定价轮或老股交易，才能将这些情景转化为回报区间。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              退出准备度较低，因为可用来源展示的是工程里程碑和拟议的收入桥接模式，而非经常性商业经济性。管理层曾讨论通过政府项目、里程碑付款或预留产能在一年内获得裂变收入，另一场访谈则将裂变商业化放在 2030
              年代初、聚变更晚。这些是面向未来的公司预期，不是合同现金流。在承保退出前，投资者应取得当前股权结构表、清算优先权、按比例认购权、债务和补助条件、月度烧钱速度、里程碑预算、客户文件、许可计划及按项目划分的资源配置。投资逻辑失效包括：一项使新资金处于明显次级地位的融资；未能取得付费裂变里程碑；部署超出已披露窗口；或有证据表明裂变人员和资本推迟了核心聚变里程碑。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 价格是准入门槛
            body: 在披露当前价格、完全稀释资本结构、优先权、现金、烧钱速度和里程碑预算之前，无法支持任何数值化估值区间或目标回报。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV016
          - type: callout
            title: 募集资金不是现金跑道
            body: 报道的历史融资证明了融资渠道，但不能证明公司拥有足以让两个反应堆项目完成许可和商业化的可用现金。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV015
