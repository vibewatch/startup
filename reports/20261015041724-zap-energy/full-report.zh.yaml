        - label: 激光式惯性约束类
          x: 2
          'y': 2
          detail: 已有点火先例，但要重复用于发电仍是公开指出的难题。
        - label: General Fusion / MTF 类
          x: 3
          'y': 2
          detail: 对比简报强调液态金属涡流稳定性和同步运行风险。
        - label: TAE / FRC 类
          x: 3
          'y': 2
          detail: 对比简报指出轫致辐射经济性是规模化瓶颈。
    approximationNotes: 坐标轴是根据指定证据得出的 1–5 序数分析评分，不代表实测电站性能或客户结果。
    claimRefs:
      - CP002
      - CP004
      - CP008
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持分阶段变现路径：较早落地的裂变部署和共享工业能力，旨在为更长期的聚变商业化提供资金并降低风险。
    data:
      nodes:
        - label: 企业级稳定电力需求点
          detail: AI / 数据中心、偏远场址、工业热能、物流电气化和政府韧性需求。
          tone: neutral
        - label: 特定场址的反应堆部署
          detail: Zap 面向模块化、并网、表后和偏远使用系统，而不是大众零售电力。
          tone: neutral
        - label: 近期裂变变现
          detail: 据独立报道，推动裂变是为了在聚变成熟前更早产生收入。
          tone: positive
        - label: 共享核能工程栈
          detail: 液态金属系统、材料、热传递、模块化建造和平衡电站工程会在两条轨道之间复用。
          tone: positive
        - label: 聚变电站开发
          detail: Century、FuZE 和系统集成工作继续推进通往商业聚变电站的长期路径。
          tone: neutral
        - label: 资本回流工程
          detail: 新融资仍投向等离子体研发和电站级集成，而不是公开定价的商业机群。
          tone: risk
    approximationNotes: 仅作方向性描述：留存来源对这条路径做了定性说明，但没有公布产品定价、利润率或转化率。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Zap 的公开架构一层层展开：从需求工作流，到支撑近期裂变产品和长期聚变平台的共享工程基础。
    data:
      layers:
        - label: 需求工作流
          detail: 公开目标市场强调持续供电问题，而不是单一客户垂直领域。
          items:
            - AI 基础设施
            - 偏远设施和采矿
            - 工业电力与热能
            - 国家安全
        - label: 近期裂变产品
          detail: 独立报道描述了一款 10 MWe 钠冷反应堆，基于 Toshiba 的 4S 设计。
          modules:
            - label: 基于 4S 的钠冷反应堆
            - label: 偏远场址与高可用性
            - label: 30 年免换料目标
        - label: 共享工程平台
          detail: 公司认为，一套热能与工业工程栈可以支撑两条反应堆产品线。
          modules:
            - label: 液态金属冷却与热提取
            - label: 高温材料
            - label: 模块化制造
            - label: 能量转换与换热器
        - label: 聚变开发栈
          detail: 公开证据以原型和论文为主，而非客户部署。
          modules:
            - label: SFS Z 箍缩等离子体核心
            - label: FuZE 与 FuZE-Q 实验线
            - label: Century 重复运行系统
          outputs:
            - 科学盈亏平衡与电站工程里程碑
        - label: 交付与许可依赖
          detail: 商业化仍取决于权利、监管机构和验证系统，而这些信息只有部分公开。
          outputs:
            - NRC 与许可沟通
            - 原始 4S 仿真与测试数据
            - 供应链与客户里程碑计划
        - label: 信任与运营证明
          detail: 面向读者的信任控制披露落后于产品和物理学叙事。
          outputs:
            - 网络与安全架构披露
            - 第三方认证与质量保证体系
            - 可用性与现场服务证据
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE008
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Zap 的公开客户路径从细分市场需求框架走向政府验证和未来产能预留；商业韧性仍未得到验证。
    data:
      items:
        - label: 找出供电受限的细分市场
          actor: Zap 的商业定位
          phase: 需求触发
          touchpoints:
            - AI 基础设施
            - 偏远工业负载
            - 工业热能
            - 物流电气化
          tone: opportunity
        - label: 推介模块化核能作为现场或并网供电
          actor: 潜在基础设施买方
          phase: 方案框定
          touchpoints: Dedicated, grid-connected or behind-the-meter power that scales with computing demand.
          tone: opportunity
        - label: 获得验证与早期项目资本
          actor: DOE / 潜在 DoD 赞助方
          phase: 早期证明
          touchpoints:
            - 参与 DOE 里程碑计划
            - TechCrunch 讨论的联邦项目收入路径
          tone: neutral
        - label: 进入具体主机场址探索
          actor: TransAlta 及类似主机
          phase: 开发证明
          touchpoints: Explore retired-plant reuse and siting before any public production deployment.
          tone: neutral
        - label: 测试里程碑付款与产能预留模式
          actor: 大型电力用户
          phase: 扩张循环
          touchpoints: >-
            Prospective milestone payments and reserved production capacity from companies that need massive amounts of
            electricity.
          tone: opportunity
        - label: 证明续约、客户集中度和交付兆瓦数
          actor: 未来客户群
          phase: 持续性缺口
          touchpoints: No public NRR, GRR, churn, top-customer concentration, or signed offtake disclosed in the reviewed sources.
          tone: risk
    approximationNotes: 该图反映公开材料描述的有序商业逻辑；不代表任何阶段已经转化为签约的反应堆交付。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU007
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的区域集中在许可、工作循环可靠性、融资，以及新裂变产品线的客户验证。
    data:
      columns:
        - label: 可能性
          detail: 根据保留的公开证据，未来 24 个月内的预期概率。
        - label: 影响
          detail: 对商业化时间、融资或可投资性的潜在损害。
        - label: 缓释成熟度
          detail: 当前公开的缓释措施具体到什么程度。
        - label: 剩余暴露
          detail: 扣除可见缓释措施后的净风险。
      rows:
        - label: 聚变许可 / 框架时点
          values:
            - label: 高
              tone: warning
            - label: 高
              tone: critical
            - label: 早期
              tone: warning
            - label: 高
              tone: critical
          note: 公司和第三方来源都称该框架仍在演进。
        - label: 工作循环可靠性与部件磨损
          values:
            - label: 高
              tone: warning
            - label: 高
              tone: critical
            - label: 早期
              tone: warning
            - label: 高
              tone: critical
          note: Century 仍是验证脉冲功率、液态金属和电极耐久性的测试平台。
        - label: 双轨融资负担
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 早期
              tone: warning
            - label: 高
              tone: critical
          note: 外部报道警告，第二个反应堆概念会在收入验证前增加成本。
        - label: 裂变收入路径的客户证明
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 概念性
              tone: warning
            - label: 高
              tone: critical
          note: 公开变现讨论围绕里程碑付款和产能预留，而不是具体合同。
        - label: 4S 血统 / 权利链
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 极低
              tone: warning
            - label: 高
              tone: critical
          note: 指定资料池中没有出现主要的许可链文件。
        - label: 裂变与聚变共用供应链瓶颈
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: 概念性
              tone: warning
            - label: 中
              tone: warning
          note: 跨平台护城河取决于供应商和制造经验能否同时支撑两条产品线。
    claimRefs:
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐结论从技术证明出发，经过融资和执行缺口，落到对价格敏感的继续研究决定。
    data:
      nodes:
        - id: proof
          label: 工程证明
          detail: Century 重复运行，以及持续活跃的技术出版记录。
        - id: platform
          label: 平台扩张
          detail: 公司自称在裂变和聚变之间共享工程能力。
        - id: capital
          label: 历史融资
          detail: 独立报道显示融资额超过 $300 million，但这不等于手头可用现金。
        - id: commercialization
          label: 商业证据缺口
          detail: 没有公开估值、已签约的反应堆收入或客户支持的单位经济性。
        - id: execution
          label: 双轨执行风险
          detail: 两个反应堆项目叠加了技术、监管、资本和客户方面的需求。
        - id: decision
          label: 继续研究
          detail: 要求提供定价条款、现金跑道、优先股堆叠、已付款里程碑和隔离的项目预算。
    approximationNotes: 仅表示逻辑顺序；节点顺序不代表概率、规模或经过的时间。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV008
      - CV009
      - CV011
      - CV015
      - CV016
