      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Zap 列出六类需求场景：AI
              和云基础设施；偏远设施与采矿；工业电力和热能；物流与车队电气化；国家安全；以及电网脱碳或负载平衡。证据将场址运营方识别为潜在用户，却没有指明采购负责人、已承诺客户或合同付款方，因此下方买家图将这些角色标为尽调假设，而非已核实账户。GeekWire
              报道 Zap 正探索重新利用 TransAlta 一处即将退役的燃煤场址，这体现出一条可能的采用路径：在反应堆具备商业供应前，先利用现有电网资产和劳动力完成场址评估。这是探索证据，不是承购或客户承诺。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM015
              - CM016
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求来自重视可靠性、脱碳，以及摆脱受限电网或燃料物流的大型集中负载。供给侧能否采用则远未确定。Zap
              与外部报道都认同，核能商业化需要高温材料、核级制造、传热、模块化建造和电厂配套能力。聚变监管仍在演变，美国核学会总结的 DOE
              路线图把基础设施、供应链、劳动力、公私合作和未来拨款列为明确依赖项。技术时点仍不利：GeekWire 报道，截至 2024 年 7 月没有聚变公司实现商业可行的发电，且 Zap 未达到早期的 2023
              年科学盈亏平衡目标。因此，市场准入取决于技术和监管执行；Zap 研究库列出的 100-kW 级系统是工程进展，而不是商业电厂验证。
            claimRefs:
              - CM006
