  - id: TV003
    title: 牛市、基准与熊市情景框架
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 牛市
        - 裂变里程碑按付费节点落地，许可持续推进，共享工程加速聚变。
        - 数值区间仍需披露融资轮条款；只有在取得合同化证据后，才有理由支持更高的相对价格。
        - 客户出资的产能、监管机构接受的里程碑，以及稳定的聚变推进节奏。
        - 裂变业务拿到订单，但聚变里程碑延期，或共享系统的节省未出现。
      - - 基准
        - 工程里程碑持续推进，但商业化、估值和客户经济性仍属私密信息。
        - 跟踪而非定价；考虑流动性不足、稀释和长期技术风险，要求折价。
        - 技术进展已有公开披露，但没有可支持融资的客户或交易证据。
        - 在下一个可独立验证的技术或商业里程碑前，现金跑道缩短。
      - - 熊市
        - 第二座反应堆变成高资本投入的弯路，两项计划都未达到可融资部署。
        - 没有优先权和资产回收数据，无法界定下行；避免采用无依据的残值假设。
        - 进度反复重置、过桥融资，或依赖未签约的政府和客户付款。
        - 某轮融资使新资本处于次位，或关键许可、客户或系统里程碑失败。
    notes: 由于当前估值、股权结构表、现金、烧钱、收入、单位经济性和交易条款在留存证据中均未公开，情景只能定性描述。
    claimRefs:
