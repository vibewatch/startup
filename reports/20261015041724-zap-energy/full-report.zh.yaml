      - number: '3.2'
        title: Zap 的架构叙事有差异化，但对手正在趋同于模块化主张
        blocks:
          - type: paragraph
            body: >-
              分配证据中，Zap 最强的产品定位优势是无磁体、剪切流稳定的 Z-pinch 架构；公司和外部摘要都将其描述为比依赖大型超导磁体或高功率激光的聚变方案更简单。这种简单性叙事有意义，但并不独有。Pacific
              Fusion 同样销售不依赖激光和超导磁体的脉冲式模块化系统，并明确强调工厂制造模块、常见工业材料和 100-300 MW 机组。因此，Zap
              的差异化更适合被描述为更广泛模块化脉冲竞争集群中的一条具体技术路线，而不是没有近似替代方案的类别。池中的独立比较简报也支持这一解读：每个主要聚变类别都有自己的瓶颈——Zap
              所属路线必须维持抗扭结稳定的重复运行，General Fusion 必须稳定液态金属涡流并同步活塞，TAE 则必须解决不利的辐射经济性问题。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP010
              - CP011
              - CP014
