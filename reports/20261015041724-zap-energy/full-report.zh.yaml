    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、阶段与平台范围
        blocks:
          - type: paragraph
            body: >-
              Zap Energy 目前更适合被理解为一家尚未商业化的先进核能开发商，而不是发电商。公司控制的材料如今把业务描述为覆盖裂变、混合和聚变系统的一体化核能平台；第三方报道仍将其身份锚定在 2017 年从
              University of Washington 分拆、总部位于华盛顿州 Everett 的公司上。当前图景是：一家完成 D
              轮融资、由风险资本支持的技术商业化公司，面向数据密集型、工业、偏远和安全敏感负载的需求叙事更广，但保留证据中没有公开收入或客户数量披露。
