      - number: '4.2'
        title: 成本优势主张有合理性，但公开单位经济性仍只是方向性判断
        blocks:
          - type: paragraph
            body: >-
              Zap
              的公开成本叙事建立在架构和共享工业系统上，而不是披露的财务产出上。聚变技术页面称公司避开超导磁体、高功率激光阵列和低温系统；一体化平台材料则认为液态金属系统、传热、先进材料、模块化建造和电厂配套工程可以在裂变与聚变之间复用。这在财务上很重要，因为它意味着更少的重复工程、更宽的供应商基础，以及在聚变电厂商业化前借助较早硬件学习的机会。独立报道也有类似解读，将
              Zap 描述为试图降低资本支出并加快迭代。但公开记录仍没有达到承保测算所需的程度：保留来源没有披露每 MWe 资本支出、毛利率、电价、服务负担、可用率或更换成本假设。因此，Century
              最适合被视为工程去风险里程碑，而不是毛利结构已经清晰的证据。
