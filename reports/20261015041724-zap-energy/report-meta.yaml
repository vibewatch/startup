companyProfile:
  summary: >-
    Zap Energy is a venture-backed, pre-commercial advanced-nuclear company that began as a University of Washington
    spinout and now presents itself as an integrated nuclear platform spanning fusion, hybrid, and compact fission
    systems. The public record shows technical progress through Century operations, a 2024 Series D and roughly $330
    million plus of disclosed funding, and an April 2026 leadership transition to Zabrina Johal, but it still does not
    disclose revenue, customer commitments, cash runway, or current valuation beyond the last public financing marker.
