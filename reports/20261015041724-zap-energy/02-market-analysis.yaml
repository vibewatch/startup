      - ["Industrial power and heat", "Firm electricity and process heat for steel, chemicals, refining, cement, and advanced manufacturing", "Unrelated factory automation and total manufacturing capital expenditure", "Industrial facility owner; budget owner unverified", "Named company use case where continuous heat and electricity can be jointly valuable."]
