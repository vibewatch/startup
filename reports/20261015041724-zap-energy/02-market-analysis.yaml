company:
  name: Zap Energy
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Zap Energy's relevant market is not the whole electricity sector or a generic
    fusion TAM; it is the narrower set of large sites that may buy firm,
    carbon-free power or heat from a modular nuclear platform. Public evidence
    supports buyer and adoption-path analysis, but not a defensible numeric
    TAM/SAM/SOM: product economics, procurement evidence, and even the detailed
    scope of the new fission product remain undisclosed.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Zap now defines itself as an integrated advanced-nuclear platform rather
      than a pure-play fusion developer. The investable boundary therefore
      includes prospective equipment and project demand for modular fission,
      fusion, and eventually hybrid systems where buyers need firm electricity
      or process heat. It excludes the value of all electricity consumed by
      Zap's named end markets, all data-center capital spending, and broad global
      power-market totals because none of those values translates directly into
      reactor revenue. Zap's own use-case descriptions identify the practical
      substitutes: existing grids for compute and mission-critical sites,
      transported fuel for remote operations, and incumbent heat-and-power
      systems for industry. Those substitutes set the actual adoption test:
      nuclear must clear site economics, availability, licensing, and procurement
      requirements, not merely address rising demand.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM016]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The assigned evidence does not contain a third-party market estimate that
      is specific enough to support a numeric TAM, SAM, or SOM for Zap. A broad
      demand lens covers firm carbon-free power and industrial heat across the
      named segments; an eligibility lens narrows that demand to sites that can
      host, license, finance, and operate modular nuclear systems; and an
      executable-market lens narrows it further to projects reachable on Zap's
      product timeline. Reported company timing places fission in the early
      2030s and fusion a few years later, but that statement is syndicated from
      the same interview rather than independently corroborated. The appropriate
      valuation treatment is therefore milestone-based optionality, not a
      precise market-share forecast.
    claimRefs: [CM002, CM010, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption-path
    title: Buyers, users, payers, and adoption path
    body: >-
      Zap names six demand settings: AI and cloud infrastructure; remote
      installations and mining; industrial power and heat; logistics and fleet
      electrification; national security; and grid decarbonization or load
      balancing. The evidence identifies site operators as likely users but does
      not name procurement owners, committed customers, or contractual payers, so
      the buyer map below labels those roles as diligence hypotheses rather than
      verified accounts. GeekWire's report that Zap was exploring reuse of a
      retiring TransAlta coal site illustrates a plausible adoption route:
      qualify a site with existing grid assets and workforce before a reactor is
      commercially available. It is evidence of exploration, not an offtake or
      customer commitment.
    claimRefs: [CM003, CM004, CM005, CM015]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      Demand is driven by concentrated loads that value reliability,
      decarbonization, and independence from constrained grids or fuel logistics.
      Supply-side adoption is much less certain. Zap and outside coverage agree
      that nuclear commercialization requires high-temperature materials,
      nuclear-grade manufacturing, heat transfer, modular construction, and
      balance-of-plant capability. Fusion regulation is still evolving, and the
      DOE roadmap summarized by the American Nuclear Society makes infrastructure,
      supply chain, workforce, public-private partnership, and future
      appropriations explicit dependencies. Technical timing remains adverse:
      GeekWire reported that no fusion company had reached commercially viable
      power by July 2024 and that Zap missed its earlier 2023 scientific-
      breakeven target. These constraints make market access conditional on
      technical and regulatory execution, while the 100-kW-scale system listed
      in Zap's research library is engineering progress rather than commercial
      plant validation.
    claimRefs: [CM006, CM007, CM008, CM009, CM011, CM014]
