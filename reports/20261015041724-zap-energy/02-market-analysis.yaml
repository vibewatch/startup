      - ["Executable fusion market", "A few years after the fission target, according to the same interview", "Not disclosed", null, "Projects reachable after fusion technical, repetitive-operation, plant, and licensing milestones.", "Low", "No commercial plant, validated economics, customer commitments, or independently corroborated schedule."]
    notes: "Null means the assigned evidence provides no defensible numeric value; reported timing is not revenue, capacity, TAM, SAM, or SOM."
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM012, CM013]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["AI, edge, and cloud infrastructure", "Data-center or compute-campus operator", "Facility and power operations", "Unverified; likely project or energy purchaser", "Dedicated, grid-connected, or behind-the-meter firm power", "Unverified", "Load growth exceeds acceptable grid capacity or reliability."]
      - ["Remote installations and mining", "Mine, quarry, industrial-camp, or off-grid site operator", "Site operations", "Unverified; likely site owner", "Displace some fuel that is trucked, barged, or flown to the site", "Unverified", "Delivered-fuel cost, emissions, or logistics burden becomes unacceptable."]
      - ["Industrial power and heat", "Steel, chemicals, refining, cement, or advanced-manufacturing operator", "Plant operations", "Unverified; likely facility owner", "Supply continuous electricity and process heat from one modular platform", "Unverified", "Firm heat-and-power requirement plus decarbonization mandate."]
      - ["Logistics and fleet electrification", "Port, warehouse, airport, fulfillment, or fleet operator", "Facility and charging operations", "Unverified", "Generate on-site electricity for operations and fleet charging", "Unverified", "Electrification raises site load beyond practical grid service."]
      - ["National security", "Military base or government-facility operator", "Mission and facility operations", "Unverified public-sector program", "Deploy secure distributed power independent of grid conditions", "Unverified", "Mission continuity and resilience requirement."]
      - ["Grid decarbonization and balancing", "Utility, grid operator, or large energy buyer", "Grid and generation operations", "Unverified", "Provide firm dispatchable power alongside intermittent resources", "Unverified", "Need for carbon-free capacity and reliability at acceptable cost."]
    notes: "Segments and workflows follow Zap's current company-issued positioning; buyer, payer, and budget-owner labels are hypotheses because no procurement records or named customer contracts appear in the assigned evidence."
    claimRefs: [CM003, CM004, CM005, CM015, CM016]
figures:
