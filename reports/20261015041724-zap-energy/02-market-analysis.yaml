    title: Evidence-constrained market access stack
    type: pyramid
    summary: >-
      Each layer narrows broad demand toward an executable market without
      assigning unsupported dollar or capacity values.
    data:
      items:
        - label: "Firm carbon-free power and heat demand"
          value: "Not quantified"
          detail: "Broad need across Zap's named end markets; not itself a TAM."
        - label: "Named large-site use cases"
          value: "Six company-defined settings"
          detail: "Compute, remote industry, industrial heat, logistics, security, and grid balancing."
        - label: "Nuclear-suitable sites"
          value: "Not quantified"
          detail: "Sites must clear siting, licensing, financing, safety, and operating requirements."
        - label: "Product-fit opportunities"
          value: "Not quantified"
          detail: "Projects must match reactor output, heat, deployment, and price specifications that are not public."
        - label: "Fission entry wedge"
          value: "Early-2030s target reported"
          detail: "Timing is management commentary reported in one syndicated interview, not independent schedule validation."
        - label: "Fusion expansion wedge"
          value: "Reported a few years later"
          detail: "Reachable only after unresolved technical, plant, regulatory, and commercial milestones."
    approximationNotes: "No magnitude is implied by layer width or order; the assigned sources disclose no comparable TAM, SAM, SOM, MW, pricing, or customer-count inputs."
    claimRefs: [CM002, CM003, CM006, CM010, CM011, CM012, CM014]
