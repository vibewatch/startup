  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The competitive field clusters around two narratives: simpler modular pulse architectures and some form of
      nearer-term commercialization bridge.
    data:
      xAxis:
        label: Architecture simplicity / modularity
        min: 1
        max: 5
        low: Large, custom, or steady-state systems
        high: Modular, pulsed, or low-complexity systems
        description: Author ordinal scores synthesized from the assigned source set
        scale: ordinal
      yAxis:
        label: Commercial bridge visibility
        min: 1
        max: 5
        low: Pure R&D path
        high: Nearer-term bridge, committed capital, or incumbent pathway
        description: Author ordinal scores synthesized from the assigned source set
        scale: ordinal
      points:
        - label: Zap Energy
          x: 5
          'y': 4
          detail: Magnet-free pulsed architecture plus a disclosed 2026 fission bridge.
        - label: Pacific Fusion
          x: 5
          'y': 3
          detail: Modular pulser architecture with >$1B financing, but no non-fusion bridge disclosed.
        - label: Tokamak / stellarator class
          x: 1
          'y': 2
          detail: Large magnetic systems and huge facility footprints remain the reference alternative.
        - label: Laser-style inertial class
          x: 2
          'y': 2
          detail: Ignition precedent exists, but repetition for power use remains a cited hurdle.
        - label: General Fusion / MTF class
          x: 3
          'y': 2
          detail: Comparative brief highlights liquid-metal vortex stability and synchronization risk.
        - label: TAE / FRC class
          x: 3
          'y': 2
          detail: Comparative brief flags bremsstrahlung economics as a scaling bottleneck.
    approximationNotes: >-
      Axes are ordinal 1-5 analyst scores derived from the assigned evidence, not measured plant performance or customer
      outcomes.
    claimRefs:
      - CP002
      - CP004
      - CP008
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a staged monetization path: nearer-term fission deployments and shared industrial
      capabilities are meant to fund and de-risk longer-dated fusion commercialization.
    data:
      nodes:
        - label: Firm-power demand pockets
          detail: AI/data centers, remote sites, industrial heat, logistics electrification, and government resilience needs.
          tone: neutral
        - label: Site-specific reactor deployments
          detail: >-
            Zap markets modular, grid-connected, behind-the-meter, and remote-use systems rather than commodity retail
            power.
          tone: neutral
        - label: Near-term fission monetization
          detail: Independent coverage says the fission push is intended to generate earlier revenue while fusion matures.
          tone: positive
        - label: Shared nuclear stack
          detail: >-
            Liquid-metal systems, materials, heat transfer, modular construction, and balance-of-plant engineering are
            reused across both tracks.
          tone: positive
        - label: Fusion plant development
          detail: Century, FuZE, and systems integration work continue the longer-dated path toward commercial fusion plants.
          tone: neutral
        - label: Capital recycling into engineering
          detail: >-
            New financing is still being directed into plasma R&D and plant-level integration rather than a publicly
            priced commercial fleet.
          tone: risk
    approximationNotes: >-
      Directional only: retained sources describe the path qualitatively and do not publish product pricing, margin, or
      conversion rates.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Zap's public architecture is a layered stack from demand workflows into a shared engineering base that feeds both
      a near-term fission product and a longer-dated fusion platform.
    data:
      layers:
        - label: Demand workflows
          detail: Public target markets emphasize continuous-power problems rather than a single customer vertical.
          items:
            - AI infrastructure
            - Remote installations and mining
            - Industrial power and heat
            - National security
        - label: Near-term fission product
          detail: Independent coverage describes a 10 MWe sodium-cooled reactor based on Toshiba's 4S design.
          modules:
            - label: 4S-derived sodium-cooled reactor
            - label: Remote and high-uptime siting
            - label: 30-year no-refuelling target
        - label: Shared engineering platform
          detail: Company thesis is that one thermal and industrial stack can support both reactor lines.
          modules:
            - label: Liquid-metal cooling and heat extraction
            - label: High-temperature materials
            - label: Modular manufacturing
            - label: Power conversion and heat exchangers
        - label: Fusion development stack
          detail: Public evidence is prototype- and paper-led rather than customer-deployed.
          modules:
            - label: SFS Z-pinch plasma core
            - label: FuZE and FuZE-Q experimental line
            - label: Century repetitive system
          outputs:
            - Scientific-breakeven and plant-engineering milestones
        - label: Delivery and licensing dependencies
          detail: Commercialization still hinges on rights, regulators, and proof systems that are only partly public.
          outputs:
            - NRC and licensing engagement
            - Original 4S simulation and test data
            - Supply-chain and customer milestone programs
        - label: Trust and operating proof
          detail: Reader-visible trust controls lag the product and physics narrative.
          outputs:
            - Cyber and security architecture disclosure
            - Third-party certifications and QA systems
            - Uptime and field-service evidence
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE008
      - CE012
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Zap's public customer path runs from segment-level demand framing to government validation and future capacity
      reservations, with commercial durability still unproven.
    data:
      items:
        - label: Identify power-constrained segments
          actor: Zap commercial positioning
          phase: Demand trigger
          touchpoints:
            - AI infrastructure
            - remote industrial loads
            - industrial heat
            - logistics electrification
          tone: opportunity
        - label: Pitch modular nuclear as on-site or grid-connected supply
          actor: Prospective infrastructure buyers
          phase: Solution framing
          touchpoints: Dedicated, grid-connected or behind-the-meter power that scales with computing demand.
          tone: opportunity
        - label: Secure validation and early program capital
          actor: DOE / potential DoD sponsors
          phase: Early proof
          touchpoints:
            - DOE milestone program participation
            - federal-program revenue path discussed by TechCrunch
          tone: neutral
        - label: Move into named host-site exploration
          actor: TransAlta and similar hosts
          phase: Development proof
          touchpoints: Explore retired-plant reuse and siting before any public production deployment.
          tone: neutral
        - label: Test milestone-payment and reserved-capacity model
          actor: Large power users
          phase: Expansion loop
          touchpoints: >-
            Prospective milestone payments and reserved production capacity from companies that need massive amounts of
            electricity.
          tone: opportunity
        - label: Prove renewals, concentration, and delivered megawatts
          actor: Future customer base
          phase: Durability gap
          touchpoints: No public NRR, GRR, churn, top-customer concentration, or signed offtake disclosed in the reviewed sources.
          tone: risk
    approximationNotes: >-
      The map reflects the ordered commercial logic described in public materials; it does not imply that any stage has
      already converted into contracted reactor deliveries.
