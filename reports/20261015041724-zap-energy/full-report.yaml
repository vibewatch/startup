      - number: '1.3'
        title: Capital formation, public scale markers, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              Public capital formation is easier to verify than operating scale. ARPA-E, Sacra, and GeekWire all
              triangulate a 2024 financing step-up around a $130 million Series D and cumulative disclosed funding above
              $330 million, while Sacra adds a public post-money valuation marker of roughly $1.10 billion based on
              PitchBook's 2024 pricing reference. What remains missing is just as important: retained sources do not
              provide current revenue, customer count, contracted backlog, cash balance, or a current valuation beyond
              the last disclosed financing marker, so this chapter treats those figures as diligence gaps rather than
              inferred scale.
            claimRefs:
