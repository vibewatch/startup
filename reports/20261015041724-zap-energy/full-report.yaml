      - number: '5.2'
        title: Architecture and maturity signals
        blocks:
          - type: paragraph
            body: >-
              The fusion side remains the technical anchor. Zap's published research describes a sheared-flow-stabilized
              Z-pinch that relies on plasma self-organization instead of the large magnets or lasers used by other
              fusion approaches, and the 2022 IEEE abstract gives concrete subsystem detail around electrodes, gas
              injection, capacitor-bank modules, and diagnostics. Public maturity proof is still prototype-oriented
              rather than customer-deployed, but it is better than generic marketing copy: the company's research
              library lists a 2024 Century paper on a 100-kW-scale repetitive system with liquid metal cooling, and
              independent coverage says Century has already been used to test liquid metal walls and repetitive pulsed
              power while reaching record plasma pressures. Zap's new thesis is that these fusion engineering efforts
              create reusable know-how for fission hardware as well.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE012
