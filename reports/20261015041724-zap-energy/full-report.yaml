      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Zap names six demand settings: AI and cloud infrastructure; remote installations and mining; industrial
              power and heat; logistics and fleet electrification; national security; and grid decarbonization or load
              balancing. The evidence identifies site operators as likely users but does not name procurement owners,
              committed customers, or contractual payers, so the buyer map below labels those roles as diligence
              hypotheses rather than verified accounts. GeekWire's report that Zap was exploring reuse of a retiring
              TransAlta coal site illustrates a plausible adoption route: qualify a site with existing grid assets and
              workforce before a reactor is commercially available. It is evidence of exploration, not an offtake or
              customer commitment.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by concentrated loads that value reliability, decarbonization, and independence from
              constrained grids or fuel logistics. Supply-side adoption is much less certain. Zap and outside coverage
              agree that nuclear commercialization requires high-temperature materials, nuclear-grade manufacturing,
              heat transfer, modular construction, and balance-of-plant capability. Fusion regulation is still evolving,
              and the DOE roadmap summarized by the American Nuclear Society makes infrastructure, supply chain,
              workforce, public-private partnership, and future appropriations explicit dependencies. Technical timing
              remains adverse: GeekWire reported that no fusion company had reached commercially viable power by July
              2024 and that Zap missed its earlier 2023 scientific- breakeven target. These constraints make market
              access conditional on technical and regulatory execution, while the 100-kW-scale system listed in Zap's
              research library is engineering progress rather than commercial plant validation.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set now spans direct fusion peers, adjacent nuclear, and firm-power substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a broader landscape than a simple one-company fusion comparison. Multiples
              places Commonwealth Fusion Systems among comparable companies to Zap, while GeekWire's regional reporting
              identifies Helion Energy and General Fusion as nearby rivals also attracting large pools of capital.
              Pacific Fusion is the clearest newly disclosed direct peer in the pool because it publishes an explicit
              2026 financing figure, a pulsed-power product narrative, and a utility-scale plant target. Zap also
              changed the frame in 2026 by adding advanced fission to its strategy, which means the company is no longer
              positioning only against other fusion startups: it is also trying to compete for buyer attention with
              nearer-term nuclear and other firm-power alternatives. That broader framing matters because the category
              still sells future capability more than present contracts, so the competitive contest is currently about
              which team can make the most credible commercialization path visible before public price discovery
              arrives.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP009
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP009
              - CP013
              - CP015
              - CP016
      - number: '3.2'
        title: Zap's architecture pitch is differentiated, but rivals are converging on modularity claims
        blocks:
          - type: paragraph
            body: >-
              Zap's strongest product-positioning advantage in the assigned evidence is a magnet-free
              sheared-flow-stabilized Z-pinch architecture that the company and outside summaries both frame as simpler
              than fusion approaches dependent on large superconducting magnets or high-power lasers. That simplicity
              story is meaningful, but it is not unique. Pacific Fusion is also selling a pulsed, modular system that
              avoids lasers and superconducting magnets, and its public narrative explicitly emphasizes factory-built
              modules, common industrial materials, and 100-300 MW units. The result is that Zap's differentiation is
              best described as a specific technical route inside a broader modular-pulse competitive cluster rather
              than as a category with no close substitutes. The independent comparative brief in the pool reinforces
              that interpretation by showing each major fusion class with its own bottleneck: Zap's class must sustain
              kink-stable repetition, General Fusion must stabilize a liquid-metal vortex and synchronized pistons, and
              TAE must solve an unfavorable radiation economics problem.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Moat durability is still constrained by disclosure gaps and industry-wide timeline risk
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the current competitive case is not the physics story but the missing commercial
              proof. Multiples describes Zap as a B2B product-sales business, yet the assigned evidence does not
              disclose public pricing, offtake, reservation terms, or a named customer decision process for Zap or for
              most peers. That leaves investors comparing financing rounds, laboratory progress, and management
              narratives rather than contract conversion or switching data. Adverse evidence also cuts against any
              near-term winner-take-all moat claim. GeekWire reported that Zap missed an earlier scientific-breakeven
              target, and the Bulletin argued that commercial fusion broadly remains far from proof of principle,
              especially for large magnetic-confinement systems. Zap's fission expansion may improve its revenue and
              regulatory story relative to fusion-only startups, but it also widens execution scope precisely when the
              core fusion program still lacks public customer and economics evidence.
            claimRefs:
              - CP005
              - CP006
              - CP012
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Modularity is a competitive theme, not a proprietary narrative
            body: >-
              Zap's magnet-free design still reads as differentiated, but Pacific Fusion shows that investors can now
              hear a very similar low-complexity, modular pitch from another heavily financed pulsed-power entrant.
            calloutType: insight
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP014
          - type: callout
            title: The fission bridge helps the story but increases execution breadth
            body: >-
              Adding advanced fission may improve Zap's regulatory and revenue optionality, yet it also turns a
              single-program fusion race into a broader nuclear execution challenge before the core fusion product has
              public pricing or customer proof.
