  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation moves from technical proof through financing and execution gaps to a price-sensitive
      research-more decision.
    data:
      nodes:
        - id: proof
          label: Engineering proof
          detail: Century repetitive operation and an active technical publication record.
        - id: platform
          label: Platform expansion
          detail: Company-claimed shared engineering across fission and fusion.
        - id: capital
          label: Historical funding
          detail: Independent reports place capital raised above $300 million, not cash available.
        - id: commercialization
          label: Commercial evidence gap
          detail: No public valuation, contracted reactor revenue, or customer-backed unit economics.
        - id: execution
          label: Dual-track execution risk
          detail: Two reactor programs add overlapping technical, regulatory, capital, and customer demands.
        - id: decision
          label: Research more
          detail: Require priced terms, runway, preferences, paid milestones, and ring-fenced program budgets.
