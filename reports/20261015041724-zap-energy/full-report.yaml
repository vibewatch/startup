              - CE014
      - number: '5.3'
        title: Deployment dependencies, trust gaps, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The main product risk is not whether Zap can describe a coherent architecture; it is whether the company
              can execute two hard reactor programs without stretching capital and management bandwidth. Independent
              commentary treats the dual-track plan as a plausible way to create earlier revenue, but also as a real
              detour risk for fusion if the fission program becomes the operational priority. The new fission product
              also inherits concrete diligence questions: one independent report says Zap must update and re-validate
              legacy 4S simulation codes to modern U.S. standards and secure original test data or run new tests, while
              the public materials still do not disclose plant-level cyber controls, third-party certifications, service
              SLAs, or uptime metrics. Those omissions do not invalidate the strategy, but they do cap confidence in
              deployment readiness.
            claimRefs:
              - CE011
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Shared engineering stack is the most credible part of the pivot
            body: >-
              The product story is strongest where Zap can tie the new fission line back to already-public fusion
              engineering work such as liquid metals, compact power systems, modular manufacturing, and a visible
              research cadence.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE012
          - type: callout
            title: Public proof of deployability lags public proof of architecture
            body: >-
              Investors can now see a clearer reactor map, but the assigned materials still leave open the exact
              licensing, data-rights, security-control, and field-reliability questions that matter most for deployment
              timing and execution risk.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target segments are broad, but still mostly thesis-level
        blocks:
          - type: paragraph
            body: >-
              Zap now markets itself to a wide set of power-hungry and infrastructure-constrained buyers rather than a
              single beachhead. The company’s homepage explicitly calls out AI infrastructure, remote industrial sites,
              industrial heat, logistics and fleet electrification, national-security users, and grid decarbonization
              needs, while the April 2026 integrated-platform announcement repeats the same pattern around AI,
              transport, manufacturing, and security. That breadth is useful as a demand narrative, but the public
              material is still mostly segment framing: the sources show where Zap thinks modular nuclear demand should
              emerge, not which named customers are already paying, deploying, or renewing.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU007
              - CU013
              - CU014
      - number: '6.2'
        title: Public adoption proof is still early and counterparty-heavy
        blocks:
          - type: paragraph
            body: >-
              The strongest externally named proof points are not production customers; they are validation and siting
              surfaces. GeekWire says Zap was one of eight awardees in DOE’s Milestone-Based Fusion Development Program
              and that the company is exploring a fusion-plant site with TransAlta in Southwest Washington. TechCrunch
              adds a prospective commercial model in which the fission effort could generate milestone payments or
              reserved production-capacity commitments from very large power users, but that description is still
              forward-looking and does not disclose a signed customer, reserved megawatts, or a prepayment amount. In
              practice, the customer surface today looks like early program sponsorship, early siting conversations, and
              buyer hypotheses rather than a demonstrated book of deployments.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration remain unproven publicly
        blocks:
          - type: paragraph
            body: >-
              Zap’s public materials sketch a plausible land-and-expand motion: secure government or strategic milestone
              capital first, reuse those programs and host-site relationships to de-risk deployment, and later sell or
              reserve scarce reactor capacity into data-intensive and industrial accounts. The problem is that the
              reviewed sources stop before the usual durability evidence begins. None of the public materials reviewed
              here disclose NRR, GRR, churn, contract length, renewal rates, customer-count by segment, or top-customer
              concentration. That keeps customer quality in the “interesting but unproven” bucket: there is a credible
              demand story and a named set of counterparties, but not yet the hard retention or concentration data
              needed to underwrite recurring commercial durability.
            claimRefs:
              - CU005
              - CU008
              - CU010
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU010
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk view
        blocks:
          - type: paragraph
            body: >-
              Zap's 2026 evidence set points to four risks that dominate the investment case. First, licensing and
              regulatory timing remains unresolved because Zap's own announcement says fusion frameworks are still
              evolving, while external coverage notes that fusion and fission still travel through different rulebooks.
              Second, the engineering path is still plant-preparatory rather than plant-proven: Century is testing
              pulsed power, liquid-metal walls, and electrode durability, and the company's technical paper still speaks
              in terms of scaling toward breakeven and commercially relevant gains. Third, the fission expansion raises
              financing and focus risk because it adds a second reactor program before the first has reached revenue.
              Fourth, public customer proof for the fission path is still conceptual, centered on milestone payments and
              reserved capacity rather than named binding contracts.
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory and legal stack
        blocks:
          - type: paragraph
            body: >-
              Zap's own framing is pragmatic rather than de-risked: the company says fusion regulation is still evolving
              and that compact fission projects can help it build regulatory experience ahead of later fusion
              deployment. That is sensible strategy, but it also confirms the business is adding a second licensing
              pathway instead of simplifying the first one. External reporting sharpens the issue. TechCrunch notes that
              the Nuclear Regulatory Commission has created separate fusion guidance and that fission and fusion remain
              very different technologies, while CFACT amplifies skepticism that fusion should be treated as a
              dependable clean-energy pillar at all. The result is not a known legal defect, but a stack of unresolved
              approvals, rights, and policy assumptions that should stay near the top of diligence.
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
      - number: '7.3'
        title: Engineering and commercialization execution
        blocks:
          - type: paragraph
            body: >-
              Zap has stronger evidence of subsystem progress than many fusion peers, but the evidence still describes
              validation work rather than repeatable commercial output. The 2024 Century release frames the platform as
              a first fully integrated test of plant-relevant technologies and highlights ongoing work on repetitive
              pulsed power, flowing liquid metal, and electrode damage under extreme heat and neutron flux. The
              commercial-fusion paper likewise says current devices support scaling toward breakeven and commercially
              relevant engineering gains, which is encouraging but still future-facing. Independent coverage keeps the
              commercialization clock long: TechCrunch says grid-ready fusion plants are likely a decade or more away,
              and GeekWire notes Zap missed its earlier scientific-breakeven target. That combination makes
              reliability-at-duty-cycle and timeline slippage core thesis risks, not edge cases.
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Capital, customer, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The fission pivot broadens Zap's option set, but it also broadens the set of counterparties that must
              cooperate before the story de-risks. TechCrunch says near-term fission revenue could come from DOE or DoD
              programs, milestone payments, or reserved production capacity, yet the retained public evidence does not
              name signed customer contracts or prepayments. The same article argues the second reactor concept is
              almost certainly not free, while Neutron Bytes says the dual-track strategy must now coordinate technical
              progress, regulation, financing, and customer acquisition across two advanced nuclear programs. Add the
              reported dependence on Toshiba's 4S lineage and the shared supply-chain thesis in Zap's own white paper,
              and the investor risk becomes clear: if capital, rights, manufacturing, or anchor-customer proof arrive
              out of sequence, the integrated-platform argument can quickly become a financing trap rather than a moat.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before conviction increases
            body: >-
              The thesis should weaken materially if Zap cannot show formal regulator engagement, a documented rights
              package for the 4S-derived reactor, multi-year financing coverage for both lines, and named customer or
              milestone contracts that move fission monetization beyond option value.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation rather than a price-insensitive investment.
              Independent coverage places historical funding above $300 million, with one source reporting $330 million,
              but funding raised is not cash available and neither figure supplies a current transaction price. The
              retained financing and strategy coverage does not disclose a current valuation, cash balance, burn,
              preference stack, dilution schedule, contracted revenue, or unit economics. That makes confidence medium
              at best and risk high: the company has financed meaningful technical work, but an investor cannot
              calculate a credible entry multiple, target return, or downside recovery from public evidence. Entry
              discipline should therefore be milestone- and terms-driven, not anchored to historical capital raised.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Zap can turn a comparatively compact fusion architecture, repetitive systems
              integration work, and shared nuclear engineering into two commercialization paths. Century has operated
              more than one hundred pulses at 0.2 Hz and 39 kW to the plasma chamber, while the company maintains a
              research library that includes a paper on a 100-kW-scale repetitive system. The anti-thesis is equally
              material: Century uses no fusion fuel and produces no fusion reactions, independent technical coverage
              still identifies commercial pulse-rate stability as a bottleneck, and the fission expansion adds a second
              capital-, regulatory-, and customer-intensive program. Those facts make platform synergy plausible but not
              yet equivalent to commercial proof.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framework without false precision
        blocks:
          - type: paragraph
            body: >-
              A numerical bull/base/bear valuation would be false precision because the public record reviewed here
              lacks current price, fully diluted ownership, cash, burn, revenue, gross margin, contracted capacity,
              plant capex, and a demonstrated commercial power output. The scenarios therefore define evidence
              conditions and entry logic rather than invented dollar ranges. The bull case requires customer-funded
              milestones and regulatory progress to convert fission into a financing bridge without slowing fusion. The
              base case assumes technical progress continues but commercial proof and price discovery remain private.
              The bear case treats the dual program as a permanent detour that consumes capital faster than either
              reactor reaches bankable deployment. Only a priced round or secondary transaction with full terms can
              translate these cases into return ranges.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is low because the available sources show engineering milestones and a proposed
              bridge-to-revenue model, not recurring commercial economics. Management has discussed fission revenue
              within a year through government programs, milestone payments, or reserved production capacity, and
              another interview placed fission commercialization in the early 2030s with fusion later. These are
              forward-looking company expectations, not contracted cash flows. Before underwriting an exit, investors
              should obtain the current cap table, liquidation preferences, pro rata rights, debt and grant conditions,
              monthly burn, milestone budgets, customer documents, licensing plan, and program-level resource
              allocation. Thesis breaks include a financing that materially subordinates new money, failure to secure
              paid fission milestones, slippage beyond disclosed deployment windows, or evidence that fission staffing
              and capital defer core fusion milestones.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is a gating input
            body: >-
              No numerical valuation range or target return is supportable until the current price, fully diluted
              capitalization, preferences, cash, burn, and milestone budgets are disclosed.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV016
          - type: callout
            title: Funding raised is not runway
            body: >-
              Reported historical funding demonstrates financing access, but it does not establish cash available to
              carry two reactor programs through licensing and commercialization.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV015
