  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Staged monetization is the public story, not current commercial revenue
        blocks:
          - type: paragraph
            body: >-
              The retained 2026 materials describe a staged revenue model rather than a currently monetized one. Zap's
              own integrated-platform paper and announcement present advanced fission as the nearer-term market-entry
              path while fusion remains the longer-dated commercialization goal, and the website positions that stack
              against firm-power demand from AI infrastructure, industrial heat, remote sites, logistics, and government
              applications. Independent coverage reinforces the same structure: Fusion Energy News characterizes the
              thesis as deleting expensive magnets to lower capex while bridging to revenue through SMR fission, and
              CFACT reports management is explicitly framing compact modular fission systems as the route to near-term,
              bankable power. The public problem is that this narrative is still much better specified than the actual
              monetization terms. The only hard public revenue datapoint in the retained record is the July 2024 Form
              D's "No Revenues" disclosure, and the current retained set still does not publish product pricing,
              contract structure, or named monetized customer commitments.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI009
              - CI013
              - CI014
