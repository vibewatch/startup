      - number: '1.2'
        title: Leadership transition and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership remains concentrated around the founding technical team even after the 2026 operating
              transition. GeekWire still described Benj Conway as a cofounder alongside Uri Shumlak and Brian Nelson,
              and company-linked April 2026 coverage moved Conway from CEO to president while installing Zabrina Johal
              as CEO. Johal's commercialization and project-delivery background broadens operating credibility, and the
              parallel addition of named fission leaders signals a company trying to industrialize beyond laboratory
              milestones, but the public record still leaves board composition, control rights, and succession depth
              only partially visible.
            claimRefs:
              - CO004
