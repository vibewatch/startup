  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Zap now defines itself as an integrated advanced-nuclear platform rather than a pure-play fusion
              developer. The investable boundary therefore includes prospective equipment and project demand for modular
              fission, fusion, and eventually hybrid systems where buyers need firm electricity or process heat. It
              excludes the value of all electricity consumed by Zap's named end markets, all data-center capital
              spending, and broad global power-market totals because none of those values translates directly into
              reactor revenue. Zap's own use-case descriptions identify the practical substitutes: existing grids for
              compute and mission-critical sites, transported fuel for remote operations, and incumbent heat-and-power
              systems for industry. Those substitutes set the actual adoption test: nuclear must clear site economics,
              availability, licensing, and procurement requirements, not merely address rising demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not contain a third-party market estimate that is specific enough to support a
              numeric TAM, SAM, or SOM for Zap. A broad demand lens covers firm carbon-free power and industrial heat
              across the named segments; an eligibility lens narrows that demand to sites that can host, license,
              finance, and operate modular nuclear systems; and an executable-market lens narrows it further to projects
              reachable on Zap's product timeline. Reported company timing places fission in the early 2030s and fusion
              a few years later, but that statement is syndicated from the same interview rather than independently
              corroborated. The appropriate valuation treatment is therefore milestone-based optionality, not a precise
              market-share forecast.
            claimRefs:
              - CM002
              - CM010
              - CM012
              - CM013
