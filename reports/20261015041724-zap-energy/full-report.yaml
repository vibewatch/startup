        title: Milestones show progress, but the platform expansion adds execution risk
        blocks:
          - type: paragraph
            body: >-
              The retained record supports genuine technical and financing progress. ARPA-E says Century began
              operations in October 2024 and had already delivered more than 1,000 consecutive plasmas into a flowing
              liquid-metal-lined chamber, while Zap's research library shows continuing publication output through July
              2026 and the company remains tied to the DOE milestone-based fusion program. At the same time, GeekWire
              noted Zap missed an earlier public target for scientific breakeven in 2023, and Neutron Bytes argues the
              new fission-plus-fusion strategy expands the technical, regulatory, financing, and customer-acquisition
              burden before commercial proof points are public.
