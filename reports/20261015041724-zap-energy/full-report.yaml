        - label: Named large-site use cases
          value: Six company-defined settings
          detail: Compute, remote industry, industrial heat, logistics, security, and grid balancing.
        - label: Nuclear-suitable sites
          value: Not quantified
          detail: Sites must clear siting, licensing, financing, safety, and operating requirements.
        - label: Product-fit opportunities
          value: Not quantified
