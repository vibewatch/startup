chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Zap Energy is still best understood as a pre-commercial advanced-nuclear developer rather than a power
              producer. Company-controlled materials now frame the business as an integrated nuclear platform spanning
              fission, hybrid, and fusion systems, while third-party reporting still anchors the company's identity to a
              2017 University of Washington spinout based in Everett, Washington. The current picture is a Series D,
              venture-backed technical commercialization effort with a broader demand story around data-intensive,
              industrial, remote, and security-sensitive loads, but with no public revenue or customer-count disclosure
              in the retained evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO008
              - CO016
