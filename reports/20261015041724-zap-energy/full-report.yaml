      - number: '4.2'
        title: Cost-advantage claims are plausible, but public unit economics are still directional
        blocks:
          - type: paragraph
            body: >-
              Zap's public cost story rests on architecture and shared industrial systems, not disclosed financial
              outputs. The fusion technology page claims the company avoids superconducting magnets, high-power laser
              arrays, and cryogenic systems, while the integrated-platform materials argue that liquid-metal systems,
              heat transfer, advanced materials, modular construction, and balance-of-plant engineering can be reused
              across fission and fusion. That is financially important because it implies less duplicated engineering, a
              wider vendor base, and a chance to learn on nearer-term hardware before fusion plants are commercial.
              Independent coverage adds a similar interpretation, framing Zap as trying to lower capex and speed
              iteration. But the public record still stops short of underwriting math: retained sources do not disclose
              capex per MWe, gross margin, power price, service burden, availability, or replacement-cost assumptions.
              Century is therefore best treated as an engineering de-risking milestone, not as evidence that margin
              structure is already visible.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI009
              - CI014
      - number: '4.3'
        title: Fresh capital is real, but it is funding plant engineering rather than proving self-funding demand
        blocks:
          - type: paragraph
            body: >-
              The financing record is clearer than the operating one. Zap's 2024 Form D shows a roughly USD130 million
              round fully sold, and both World Nuclear News and GeekWire independently describe that raise as
              approximately USD130 million. GeekWire says the round followed a USD160 million 2022 financing and would
              bring total venture funding to roughly USD330 million, plus grants. World Nuclear News also reports
              management's stated use of proceeds: plasma R&D, systems-level plant engineering and integration, the next
              FuZE device generation, and a new pulsed-power capacitor bank. That is consistent with a company still
              financing technical and industrialization milestones rather than scaling a disclosed commercial backlog.
              The adverse underwriting signal is timing risk: GeekWire notes Zap had earlier predicted scientific
              breakeven in 2023 and did not hit it, which means new capital is supporting a longer development path than
              earlier ambition suggested. Without disclosed cash on hand, monthly burn, or debt/project-finance
              commitments, capital adequacy cannot be underwritten from public evidence alone.
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.4'
        title: 'Verdict: promising platform logic, but still a capital-intensive pre-revenue diligence case'
        blocks:
          - type: paragraph
            body: >-
              Financially, Zap reads as a technically ambitious nuclear-platform company whose public story is ahead of
              its public economics. The upside case is coherent: use nearer-term fission deployments and shared
              industrial systems to create a broader revenue path and avoid forcing fusion to carry the whole capital
              burden alone. The downside case is just as clear: the public record still lacks current revenue, pricing,
              customer-contract evidence, gross-margin math, capex per unit, burn, and runway, while commercialization
              timelines have already stretched versus earlier expectations. That means the chapter's investable
              conclusion is not that Zap's economics are poor; it is that the decisive inputs remain private. Until
              management produces a revenue bridge, cost stack, and financing runway by program, underwriting should
              assume continued financing dependency and material execution risk.
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting is blocked by absent operating economics
            body: >-
              Public evidence establishes the financing events and engineering program, but not the numbers an investor
              needs to turn that program into a model: there is no retained public disclosure of current price, realized
              contract structure, gross margin, capex per MWe, cash balance, monthly burn, or runway.
            calloutType: risk
            claimRefs:
              - CI009
              - CI014
          - type: callout
            title: The capital story is financing industrialization, not proving demand conversion
            body: >-
              The disclosed raise is material, but retained sources say the money is going into plasma R&D, systems
              engineering, the next FuZE device generation, and pulsed-power hardware. That is the spend pattern of a
              company still building a plant-ready platform, not one already disclosing repeatable commercial conversion
              metrics.
            calloutType: insight
            claimRefs:
              - CI006
              - CI007
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and target workflows
        blocks:
          - type: paragraph
            body: >-
              Zap now markets itself as an integrated nuclear platform rather than a pure fusion startup, pairing a
              long-dated fusion architecture with a nearer-term fission product. In customer workflow terms, the public
              pitch is not "fusion science" alone: the homepage groups demand around continuous-power problems such as
              AI infrastructure, remote industrial sites, industrial heat, and national-security loads, while
              independent coverage says the new fission line centers on a 10 MWe sodium-cooled reactor derived from
              Toshiba's 4S design. That makes the current product map clearer than in the prior report: Zap is
              presenting one shared nuclear stack with multiple delivery timelines. What remains unclear is which of
              these workflows have progressed beyond market selection into named deployments, reliability proof, or
              customer-specific integration work.
            claimRefs:
              - CE001
              - CE007
              - CE008
