    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Repetition-rate and energy-recovery durability remains unproven at plant duty cycle", "Century is still validating repetitive pulsed power and repeated firing rather than describing commercial uptime.", "High", "High", "Early", "High", "Need run-length, maintenance interval, and component replacement data beyond test-platform milestones."]
      - ["Electrode damage and neutron / heat loads could shorten operating life or raise cost", "Zap explicitly says Century is testing mitigation strategies for electrode damage under extreme heat and neutron flux.", "High", "High", "Early", "High", "Need materials life model, replacement cadence, and cost impact per module."]
      - ["Liquid-metal blanket and heat-exchanger integration still needs scale proof", "Century is presented as an integrated test of liquid-metal walls and heat extraction, not a finished plant design.", "Medium", "High", "Early", "High", "Need heat-balance data, corrosion results, and failure-mode analysis for liquid-metal subsystems."]
      - ["Fusion economics remain contingent on breakeven and later system-level gains", "Zap's technical paper says current devices support scaling toward breakeven and commercially relevant gains, which remain targets.", "High", "High", "Early", "High", "Need audited milestone history tying physics results to plant output, capex, and availability assumptions."]
    notes: Residual exposure is high where public evidence still centers on test platforms, subsystem validation, or forward-looking technical targets.
    claimRefs: [CR003, CR004, CR008, CR009, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Government and milestone-backed early revenue", "DOE / DoD / large energy users", "Could fund fission before electricity sales", "High", "Programs slip or milestone buyers do not materialize, extending burn before revenue.", "High", "Secure signed milestone schedules and diversify funding sources.", "High"]
      - ["4S-derived reactor lineage", "Toshiba / legacy design ecosystem", "Provides starting point for the 10 MW fission program", "Medium", "Rights, redesign, or validation work proves slower or costlier than implied.", "High", "Document rights chain and independent engineering diligence on what is actually reusable.", "High"]
      - ["Shared nuclear-grade supply chain thesis", "Materials, manufacturing, heat-transfer, and balance-of-plant vendors", "Supposed to create cross-platform leverage across fission and fusion", "Medium", "Common suppliers or manufacturing steps become bottlenecks for both product lines at once.", "Medium", "Qualify alternative vendors and separate critical-path items by reactor line where possible.", "Medium"]
    notes: This register focuses on dependencies that can break the integrated-platform narrative if counterparties, rights, or supply chains move out of sequence.
    claimRefs: [CR005, CR006, CR007, CR011, CR012, CR013]
