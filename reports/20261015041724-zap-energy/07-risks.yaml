callouts:
  - calloutType: risk
    title: Kill criteria before conviction increases
    body: The thesis should weaken materially if Zap cannot show formal regulator engagement, a documented rights package for the 4S-derived reactor, multi-year financing coverage for both lines, and named customer or milestone contracts that move fission monetization beyond option value.
    claimRefs: [CR001, CR006, CR007, CR012, CR015]
