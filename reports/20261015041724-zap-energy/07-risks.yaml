      - ["Adding fission creates a second approval stack instead of removing the first", "Zap presents fission as a way to gain regulatory experience, which implies the experience still has to be built.", "Medium", "High", "Early", "High", "Map each milestone to the specific federal and state process, owner, and target date."]
      - ["4S-derived design rights are not independently documented in the assigned sources", "TechCrunch says the reactor is based on Toshiba's 4S and quotes management saying there is no IP entanglement, but no license-chain document is retained here.", "Medium", "High", "Minimal", "High", "Obtain rights opinion, patent assignment chain, and any Toshiba or INL agreement abstracts."]
      - ["Hybrid waste / fuel-cycle ambitions imply additional future policy exposure", "Zap's integrated paper discusses fusion-fission hybridization and waste transmutation as long-term possibilities rather than licensed products.", "Low", "Medium", "Conceptual", "Medium", "Separate current reactor approvals from longer-dated hybrid or fuel-cycle claims in diligence materials."]
    notes: Sources combine company strategy documents with independent reporting; severity ordering reflects residual investment risk rather than legal conclusion.
