company:
  name: Zap Energy
chapter:
  number: 1
  title: Company Overview
  summary: Zap Energy remains a pre-commercial advanced-nuclear company built around sheared-flow-stabilized Z-pinch fusion, but 2026 repositioned it as a broader fission-plus-fusion platform. Public evidence supports $330M+ disclosed funding, a 2024 Series D with a public ~$1.10B post-money marker, Century test-platform operations, and an April 2026 CEO transition, while revenue, customers, and current price discovery beyond the 2024 round remain unverified.
sections:
- id: identity-platform
  title: Identity, stage, and platform scope
  body: Zap Energy is still best understood as a pre-commercial advanced-nuclear developer rather than a power producer. Company-controlled materials now frame the business as an integrated nuclear platform spanning fission, hybrid, and fusion systems, while third-party reporting still anchors the company's identity to a 2017 University of Washington spinout based in Everett, Washington. The current picture is a Series D, venture-backed technical commercialization effort with a broader demand story around data-intensive, industrial, remote, and security-sensitive loads, but with no public revenue or customer-count disclosure in the retained evidence.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO007
  - CO008
  - CO016
  tableRefs:
  - TO001
- id: leadership-governance
  title: Leadership transition and key-person dependence
  body: Leadership remains concentrated around the founding technical team even after the 2026 operating transition. GeekWire still described Benj Conway as a cofounder alongside Uri Shumlak and Brian Nelson, and company-linked April 2026 coverage moved Conway from CEO to president while installing Zabrina Johal as CEO. Johal's commercialization and project-delivery background broadens operating credibility, and the parallel addition of named fission leaders signals a company trying to industrialize beyond laboratory milestones, but the public record still leaves board composition, control rights, and succession depth only partially visible.
  claimRefs:
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO002
- id: capital-and-scale
  title: Capital formation, public scale markers, and disclosure limits
  body: 'Public capital formation is easier to verify than operating scale. ARPA-E, Sacra, and GeekWire all triangulate a 2024 financing step-up around a $130 million Series D and cumulative disclosed funding above $330 million, while Sacra adds a public post-money valuation marker of roughly $1.10 billion based on PitchBook''s 2024 pricing reference. What remains missing is just as important: retained sources do not provide current revenue, customer count, contracted backlog, cash balance, or a current valuation beyond the last disclosed financing marker, so this chapter treats those figures as diligence gaps rather than inferred scale.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO016
  tableRefs:
  - TO003
- id: milestones-and-execution
  title: Milestones show progress, but the platform expansion adds execution risk
  body: The retained record supports genuine technical and financing progress. ARPA-E says Century began operations in October 2024 and had already delivered more than 1,000 consecutive plasmas into a flowing liquid-metal-lined chamber, while Zap's research library shows continuing publication output through July 2026 and the company remains tied to the DOE milestone-based fusion program. At the same time, GeekWire noted Zap missed an earlier public target for scientific breakeven in 2023, and Neutron Bytes argues the new fission-plus-fusion strategy expands the technical, regulatory, financing, and customer-acquisition burden before commercial proof points are public.
  claimRefs:
  - CO009
  - CO013
  - CO014
  - CO015
  figureRefs:
  - FO001
