callouts:
- calloutType: insight
  title: Evidence-backed progress is real, but it is still pre-commercial progress
  body: Century operations, continued publication output, DOE program linkage, and the 2024 financing round all support technical momentum. None of the retained sources, however, converts that momentum into disclosed revenue, customers, or an updated valuation beyond the last public financing marker.
  claimRefs:
  - CO009
  - CO010
  - CO012
  - CO013
  - CO014
  - CO016
- calloutType: risk
  title: The 2026 platform expansion improves narrative breadth while multiplying execution paths
  body: 'Zap now presents one engineering stack that can support fission, hybrid, and fusion. That may improve strategic optionality, but the adverse read from Neutron Bytes is credible: commercialization now requires the company to execute across two licensing, financing, and customer-development tracks before public proof points exist for either business line.'
  claimRefs:
  - CO007
  - CO015
  - CO016
