    - Confirm ownership percentage, board rights, and any liquidation preferences.
  - - DOE / ARPA-E
    - Program and validation stakeholder
    - Non-dilutive validation matters because Zap still lacks public commercial traction.
    - ARPA-E traces Zap's lineage through multiple programs, and GeekWire says DOE selected Zap for the Milestone-Based Fusion Development Program.
    - Request milestone status, payment schedule, and technical go/no-go criteria.
  - - University of Washington / Lawrence Livermore National Laboratory
    - Technical-origin stakeholders
    - They anchor the company's scientific origin and help explain the IP and talent lineage.
    - GeekWire says Zap launched in 2017 with technology developed in collaboration with LLNL and UW researchers; ARPA-E says Zap was spun off from UW work.
    - Review present-day IP ownership, licenses, and any continuing research obligations.
  - - Benj Conway
    - Founder-executive stakeholder
    - Still shapes strategy, partnerships, and long-term technology direction after giving up the CEO title.
    - ARPA-E described Conway as CEO in 2024, while April 2026 company-linked coverage moved him to president.
    - Clarify residual operating authority, fundraising ownership, and board committee roles after the transition.
  - - Zabrina Johal
    - Chief executive stakeholder
    - The CEO change matters because commercialization and licensing execution now run through a new operator.
    - Both Lynnwood Times and Neutron Bytes say Johal took the CEO role in April 2026.
    - Test whether Johal controls product sequencing, customer development, and nuclear deployment decisions.
