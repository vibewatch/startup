  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Current revenue run-rate, bookings or backlog, named customers, paid pilots, and any signed offtake or prepayment contracts.
    whyItMatters: The company now presents a broader commercialization story, but public evidence still does not show whether demand has converted into contracted revenue or customer validation.
    diligencePath: Request a customer and contract schedule with annual contract value, counterparty, stage, cancellation terms, and whether any payments have already been received.
    relatedQuestionRefs:
