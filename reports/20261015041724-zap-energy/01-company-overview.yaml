  rows:
  - - Benj Conway
    - Cofounder; CEO in 2024, President from Apr. 2026
    - Entrepreneur and investor; still focused on strategy, partnerships, and long-term technology development.
    - Bridges capital formation, external partnerships, and long-range company direction.
    - Confirm delegation boundaries after the CEO transition and board reporting lines.
  - - Zabrina Johal
    - Chief Executive Officer
    - Prior leadership roles at AtkinsRéalis and General Atomics; served in the U.S. Navy Nuclear Power Program.
    - Adds nuclear commercialization and large-scale project delivery experience.
    - Test whether operating cadence, licensing strategy, and customer development now sit clearly with the CEO office.
  - - Uri Shumlak
    - Cofounder / technical originator
    - GeekWire and ARPA-E tie Zap's origin to University of Washington Z-pinch work.
    - Anchors fusion-physics credibility and the core sheared-flow-stabilized Z-pinch thesis.
    - Assess how much core technical know-how remains concentrated in founder-scientists.
  - - Brian A. Nelson
    - Cofounder
    - GeekWire names Nelson as a cofounder alongside Shumlak and Conway.
    - Represents continuity from original technical formation.
    - Request current operating role, board position, and IP assignment scope.
  - - Daniel Walter
    - Director of Nuclear Engineering (named in Apr. 2026)
    - Former project lead for TerraPower's Molten Chloride Reactor Experiment.
    - Signals that the new fission lane is staffed with reactor-program talent instead of only fusion researchers.
    - Verify budget, authority, and timeline ownership for the fission program.
  - - Matthew C. Thompson
    - SVP of Fission Technology
    - Lynnwood Times says Thompson will lead development across integrated platform technologies.
    - Provides a named executive owner for cross-platform fission execution.
    - Request the product-roadmap split between Thompson, Walter, and Johal.
