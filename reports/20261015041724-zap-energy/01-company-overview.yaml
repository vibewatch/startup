    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: current-valuation-and-runway
    missingEvidence: A 2026 valuation update, extension or secondary pricing, cash on hand, monthly burn, and expected runway through the next fusion and fission milestones.
    whyItMatters: The last public valuation marker still points to the 2024 Series D, so downside or step-up risk since then cannot be judged from retained public evidence.
    diligencePath: Request the latest financing materials, cap table, preference stack, cash bridge, and board-approved operating plan.
  - type: private-evidence-only
    severity: minor
    topic: governance-and-control
    missingEvidence: Current board composition, voting/control rights, debt or project-finance obligations, and post-transition executive decision rights.
    whyItMatters: Leadership change and strategic scope expansion matter more if governance, investor rights, or decision bottlenecks constrain execution.
    diligencePath: Request the current board list, governance matrix, investor-rights summary, and an updated executive org chart.
