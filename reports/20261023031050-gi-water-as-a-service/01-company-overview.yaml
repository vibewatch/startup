  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: governance
    missingEvidence: Exact legal entity, incorporation date, ownership chain, board composition, and complete leadership roster.
    whyItMatters: Identity and governance uncertainty limits confidence in who owns the technology, controls capital, and
      bears operating obligations.
    diligencePath: Obtain Saudi commercial-registration extracts, group structure documents, board materials, and verified
      executive biographies.
    relatedQuestionRefs:
    - QO001
    - QO004
  - type: private-evidence-only
    severity: material
    topic: scale-and-financials
    missingEvidence: Audited financials, revenue or ARR, cash balance, margins, customer count, contract terms, and renewal
      history.
    whyItMatters: The reported valuation cannot be assessed against operating performance or liquidity without financial and
      customer evidence.
    diligencePath: Request audited FY2025 statements, management accounts, customer concentration, contract samples, and unit-economics
      bridge.
    relatedQuestionRefs:
    - QO003
    - QO006
    - QO007
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Primary Series A subscription documents confirming amount, primary versus secondary mix, preference stack,
      and governance rights.
    whyItMatters: Media descriptions establish a headline valuation and stake but not the economic terms or cash proceeds
      available to the company.
    diligencePath: Obtain signed financing documents, cap table, investor rights agreement, and use-of-proceeds schedule.
    relatedQuestionRefs:
    - QO003
    - QO006
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete founders, executives, board, and key technical personnel list.
    whyItMatters: Key-person dependence and organizational depth cannot be evaluated from a single named executive.
