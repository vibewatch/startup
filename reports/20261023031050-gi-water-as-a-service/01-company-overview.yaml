company:
  name: GI Water as a Service
chapter:
  number: 1
  title: Company Overview
  summary: Public evidence identifies GI Water as a Saudi-based water-treatment operator affiliated with Germany’s GI Aqua
    Tech, using a pay-per-cubic-meter model and reporting a USD 1.03 billion Series A valuation. The evidence supports a credible
    strategic context and several operating milestones, but leaves legal identity, governance, financial performance, and
    scale metrics materially unresolved.
sections:
- id: identity-and-model
  title: Identity and operating model
  body: The assigned evidence presents GI Water as a Saudi Arabia-based subsidiary or affiliate of Germany’s GI Aqua Tech.
    Its public proposition is decentralized wastewater treatment delivered through a pay-per-cubic-meter model, which is intended
    to reduce clients’ upfront capital requirement. G-Nano is described as a compact, scalable, energy-efficient system, while
    the three-minute treatment claim remains a company-attributed performance statement rather than an independently tested
    result. The public record does not establish the exact Saudi legal entity, incorporation date, ownership chain, board,
    employee count, revenue, or customer count. Those omissions matter because the report’s company-level identity and operating
    scale cannot be separated cleanly from statements made by executives or media summaries.
  claimRefs:
  - CO001
  - CO004
  - CO006
  - CO014
  tableRefs:
  - TO001
- id: funding-leadership-and-scale
  title: Funding, leadership, and scale
  body: 'EnterpriseAM and Entarabi both report a January 2025 Series A that placed the company above the billion-dollar threshold,
    while EnterpriseAM specifies a USD 1.03 billion valuation and a 5.8% equity stake sold for an eight-figure cash investment.
    These are reported financing terms, not audited revenue, ARR, cash-on-hand, or proof of valuation support. The assigned
    pool contains no sufficiently detailed leadership roster or board record, so founder-market fit and key-person dependence
    remain open diligence items. The same limitation applies to scale: the evidence names one reported industrial project
    and a project pipeline, but does not provide a verified customer count, contract duration, renewal data, or operating
    margins.'
  claimRefs:
  - CO002
  - CO003
  - CO005
  - CO014
  tableRefs:
  - TO002
  - TO003
- id: milestones-and-context
  title: Milestones and strategic context
  body: The dated record combines company-related milestones with the external water-sector context in which GI Water operates.
    The reported Magaz Al Adahi project, Tahliya memorandum of understanding, planned local factory, and international expansion
    targets indicate an ambition to scale beyond a single Saudi deployment. UNDP and AGSI describe Saudi water policy as centered
    on integrated management, wastewater reuse, desalination, and institutional capacity, while AGSI also flags cost, energy,
    and brine-disposal constraints. Meticulous Research provides a broad regional market forecast, but it is not company revenue
    evidence and should not be used to infer GI Water’s obtainable market or economics.
  claimRefs:
  - CO005
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  figureRefs:
  - FO001
