evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: governance
    missingEvidence: Exact legal entity, incorporation date, ownership chain, board composition, and complete leadership roster.
    whyItMatters: >-
      Identity and governance uncertainty limits confidence in who owns the technology, controls capital, and bears
      operating obligations.
    diligencePath: >-
      Obtain Saudi commercial-registration extracts, group structure documents, board materials, and verified executive
      biographies.
    relatedQuestionRefs:
      - QO001
      - QO004
  - type: private-evidence-only
    severity: material
    topic: scale-and-financials
    missingEvidence: Audited financials, revenue or ARR, cash balance, margins, customer count, contract terms, and renewal history.
    whyItMatters: >-
      The reported valuation cannot be assessed against operating performance or liquidity without financial and
      customer evidence.
    diligencePath: >-
      Request audited FY2025 statements, management accounts, customer concentration, contract samples, and
      unit-economics bridge.
    relatedQuestionRefs:
      - QO003
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary Series A subscription documents confirming amount, primary versus secondary mix, preference stack, and
      governance rights.
    whyItMatters: >-
      Media descriptions establish a headline valuation and stake but not the economic terms or cash proceeds available
      to the company.
    diligencePath: Obtain signed financing documents, cap table, investor rights agreement, and use-of-proceeds schedule.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete founders, executives, board, and key technical personnel list.
    whyItMatters: Key-person dependence and organizational depth cannot be evaluated from a single named executive.
    diligencePath: Request organization chart, board minutes, and verified leadership biographies.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      GI-specific serviceable geography, treatment-volume run rate, qualified pipeline, contract duration, and
      conversion data.
    whyItMatters: The regional forecast is too broad to translate into a defensible SAM, SOM, or valuation-based adoption case.
    diligencePath: >-
      Request a project-level pipeline and installed-base schedule with treated cubic meters, contract terms, geography,
      and renewal status.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Price per cubic meter, utilization, gross margin, service labor, energy, maintenance, and customer payback.
    whyItMatters: The pay-per-use model may reduce customer capex but its own economics remain untested.
    diligencePath: Obtain cohort-level unit economics by treatment technology and site type, reconciled to management accounts.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: conflicting-data
    severity: minor
    topic: valuation-relevance
    missingEvidence: Independent confirmation of Series A proceeds, valuation terms, and primary versus secondary capital.
    whyItMatters: A valuation headline can be mistaken for market traction or cash available for expansion.
    diligencePath: Review signed financing documents, cap table, and independent investor confirmation.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      GI customer contracts or price sheets showing tariff, minimum volume, contract duration, escalation, and
      service-level obligations.
    whyItMatters: >-
      Without realized commercial terms, the usage-linked proposition cannot be compared with incumbent lifecycle cost
      or tested for margin durability.
    diligencePath: >-
      Request anonymized executed contracts, cohort pricing, billing records, and customer renewal schedules from
      management.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: Independent customer references and measured treatment, compliance, reuse, uptime, and deployment-time outcomes.
    whyItMatters: >-
      Company claims about reuse and decentralized economics are not enough to establish a durable advantage over
      integrated operators.
    diligencePath: >-
      Obtain site-level operating reports, regulator acceptance records, customer references, and comparable incumbent
      bids.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      Product-level evidence for each named regional competitor and local engineering, EPC, utility, and internal-build
      alternatives.
    whyItMatters: >-
      The assigned pool establishes a broad competitive set but not a complete vendor-by-vendor capability or channel
      map.
    diligencePath: >-
      Expand primary-source review across competitor product pages, tenders, procurement awards, and customer
      references.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue, ARR or equivalent contracted revenue, customer concentration, renewal behavior, and realized
      pricing by project type.
    whyItMatters: >-
      The reported valuation cannot be compared with operating performance or recurring cash generation without these
      inputs.
    diligencePath: Obtain audited FY2025 and interim FY2026 accounts plus a contract-level revenue bridge and billing ledger.
    relatedQuestionRefs:
      - QI002
      - QI006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Site-level throughput, uptime, energy, consumables, labor, maintenance, financing cost, and gross margin.
    whyItMatters: >-
      A pay-per-volume model can destroy value if utilization or contribution margin is below plant financing and
      service cost.
    diligencePath: >-
      Request cohort-level unit economics for each operating plant, with baseline definitions and reconciliation to the
      general ledger.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, monthly burn, debt and project-finance obligations, primary versus secondary funding mix, and
      next-round trigger.
    whyItMatters: Project expansion and procurement delays may require capital before customer cash receipts arrive.
    diligencePath: >-
      Obtain the latest balance sheet, 24-month cash plan, debt schedule, Series A documents, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: project-capital
    missingEvidence: Evidence distinguishing committed, spent, financed, and expected portions of the reported €150 million investment.
    whyItMatters: >-
      Expected project investment is not cash available to the operating company and may represent a separate
      manufacturing or infrastructure vehicle.
    diligencePath: >-
