  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than direct wastewater-treatment vendors. GI Water as a Service
              describes a decentralized, pay-per-cubic-meter model for industrial and community wastewater treatment,
              while SUEZ presents a conventional operator-and-technology alternative spanning plant design,
              construction, operation, digital monitoring, and reuse. Meticulous Research identifies SUEZ, Veolia,
              Xylem, DuPont, Pentair, Ecolab, and other established suppliers as key players in the Middle East and
              Africa water and wastewater treatment market. The buyer can therefore choose a service contract, a
              traditional engineered plant, a technology package with an operator, or an internal/public-utility
              solution. The assigned sources do not establish GI's share, customer wins, or competitor-specific contract
              economics, so the landscape is a capability and procurement comparison rather than a market-share ranking.
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
