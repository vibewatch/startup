    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence presents GI Water as a Saudi Arabia-based subsidiary or affiliate of Germany’s GI
              Aqua Tech. Its public proposition is decentralized wastewater treatment delivered through a
              pay-per-cubic-meter model, which is intended to reduce clients’ upfront capital requirement. G-Nano is
              described as a compact, scalable, energy-efficient system, while the three-minute treatment claim remains
              a company-attributed performance statement rather than an independently tested result. The public record
              does not establish the exact Saudi legal entity, incorporation date, ownership chain, board, employee
              count, revenue, or customer count. Those omissions matter because the report’s company-level identity and
              operating scale cannot be separated cleanly from statements made by executives or media summaries.
