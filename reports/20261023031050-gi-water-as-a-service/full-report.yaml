        - Low until data-room evidence is supplied.
        - Execution, collection, regulatory compliance, dilution.
      - - Base
        - >-
          Market demand persists; deployments grow, but revenue, margin, retention, and cap-table evidence remain
          incomplete.
        - Treat the reported >$1bn as an unverified financing reference, not fair value.
        - Most consistent with current public disclosure.
        - Procurement cycles, installation cost, working capital, governance.
      - - Bear
        - Projects slip; customers or regulators do not renew; financing is heavily dilutive or preference-heavy.
        - >-
          Downside is a material impairment or down-round; no floor can be calculated without liabilities and
          preferences.
        - Plausible stress case; magnitude unquantifiable.
