  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category logic
        blocks:
          - type: paragraph
            body: >-
              The relevant opportunity is not “all water” or all desalination spending. It is the serviceable subset of
              wastewater treatment, water reuse, sludge/resource recovery, and operating services delivered at municipal
              or industrial sites, including mobile or decentralized units where the buyer pays for treatment capacity
              or treated volume. GI Aqua Tech describes units that can be deployed directly at a client site and
              retrieved after a job, which supports including temporary, seasonal, remote, and capacity-constrained use
              cases. The boundary excludes bulk desalination and transmission projects unless they directly procure
              wastewater or reuse treatment at the point of use. This distinction matters because a broad regional
              treatment forecast can indicate category tailwinds without proving GI WaaS revenue opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              The most defensible external sizing lens is Meticulous Research’s forecast for the combined Middle East
              and Africa water and wastewater treatment market: $44.5 billion by 2032 and 4.1% CAGR from 2025–2032. It
              includes municipal and industrial applications and several offerings, so it is a category ceiling rather
              than GI’s TAM. A second lens is evidence-constrained: Saudi scarcity, policy, reuse, and industrialization
              create demand, but the retained sources do not disclose a GI-specific serviceable geography,
              treatment-volume base, contract pipeline, or share. Buyer segmentation therefore matters more than a
              single top-down number: utilities/public agencies, industrial operators, and temporary or remote-site
              operators have different budget owners and procurement paths.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM007
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is reinforced by water scarcity, agriculture’s large water draw, wastewater-reuse policy, and the
              need to serve industrial or remote sites without building permanent networks. GI’s pay-per-cubic-meter
              framing can shift spending from upfront plant capex toward an operating service, and an independent report
              describes decentralized treatment as reducing sewer-network capital expenditure. However, the same
              evidence base flags high installation, maintenance, and operating costs, while AGBI reports that
              government procurement is slow and that roughly 90% of water-sector innovation financing comes from
              governments. These constraints can lengthen sales cycles and make public-sector alignment important, but
              the company’s reported $1 billion valuation should not be used as a market-size or traction proxy. Public
              evidence leaves GI-specific SAM, SOM, volume, conversion, and contract economics open.
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Best-supported wedge
            body: >-
              The most evidence-supported wedge is decentralized treatment for industrial, temporary, seasonal, remote,
              or capacity-constrained sites where permanent networks are costly or slow.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM011
          - type: callout
            title: Sizing and procurement risk
            body: >-
              A broad regional forecast and a company-reported valuation do not establish GI’s serviceable market or
              adoption rate; government-led procurement and high operating costs can delay conversion.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
