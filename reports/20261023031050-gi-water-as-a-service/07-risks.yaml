callouts:
  - calloutType: risk
    title: Evidence-weighted risk posture
    body: The most decision-relevant uncertainty is not whether water demand exists; it is whether GI WaaS can repeatedly satisfy permits, quality requirements, uptime expectations, and project-finance conditions at customer sites. Public claims about reuse and valuation should not be treated as proof of those operating controls.
    claimRefs: [CR005, CR006, CR010, CR013]
  - calloutType: assumption
    title: Thesis-break monitoring
    body: Require a site-level dashboard covering permit status, water-quality exceptions, uptime, complaints, overflow incidents, renewal status, project gross margin, and cash runway before treating the risk profile as improving.
    claimRefs: [CR003, CR007, CR009, CR014]
