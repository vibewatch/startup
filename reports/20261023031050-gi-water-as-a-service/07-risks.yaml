company:
  name: GI Water as a Service
chapter:
  number: 7
  title: Risks
  summary: Public evidence indicates that GI WaaS operates in a tightly licensed water and wastewater environment with material execution, quality, and financing dependencies. The company and media describe an ambitious decentralized treatment proposition, but public evidence does not establish operating reliability, economics, or the maturity of mitigations.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Saudi water rules place ownership, licensing, monitoring, emergency planning,
      water-quality standards, and treated-water use inside a public regulatory
      framework. The available Saudi water-law summary says permits are needed to
      use treated water and that the responsible public-services authority
      establishes tariffs or fees. The Saudi Water Authority service catalogue
      separately lists licenses for non-network services, wastewater treatment,
      and transport or distribution of treated water. For GI WaaS, this creates a
      market-access and compliance dependency: a decentralized plant may be
      technically deployable yet still require location-specific approvals and
      operating permissions. The public pool does not identify GI WaaS legal
      entities, licenses, permits, enforcement history, or litigation, so those
      items remain diligence gaps rather than inferred negatives.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-quality-security
    title: Operational, quality, and security risk
    body: The company-linked account describes G-NANO as a non-biological treatment system using stationary and mobile plants and claims 100% wastewater reuse without odors or environmental impact. Those are company-positioning claims, not independent performance validation. A peer-reviewed 2022 paper describes Saudi Arabia as arid, with limited renewable freshwater, groundwater stress, incomplete wastewater coverage, and only 10% of municipal wastewater reused at the time studied; these conditions raise the consequence of quality or uptime failures. Bahrain regulator pages show that water services include complaint escalation, violation reporting for leaks and sewage overflows, and licensing of non-network water services. GI WaaS therefore needs site-level quality records, incident logs, maintenance data, cyber controls for monitoring, and customer acceptance evidence before the claimed mitigation maturity can be rated high.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: dependencies-and-thesis-breaks
    title: Partner, financial, and execution dependencies
    body: >-
      GI WaaS public financing evidence is a company-affiliated or company-linked
      announcement that reports a Series A valuation above one billion dollars and
      names Al Zamil Industrial, Trade & Transport Company and Al Qunaibet
      Investment Fund as participants. It does not disclose proceeds, primary
      versus secondary mix, runway, margins, customer concentration, or
      contractual protections. The Saudi Water Partnership Company is described by
      an infrastructure publisher as a government-owned project owner implementing
      privatization and public-private partnership initiatives, which illustrates
      the importance of institutional counterparties in this sector but does not
      prove a GI WaaS contract. The principal thesis-break tests are measurable:
      loss of required licenses, a failed treated-water quality test, a reportable
      outage or overflow, inability to renew or finance projects, or evidence that
      claimed reuse and cost benefits do not persist at customer sites.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
