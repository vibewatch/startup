      - ["Leak, sewage overflow, or customer complaint escalation", Medium, High, "Regulatory reporting mechanisms exist; company controls unknown", Medium-high, "No GI WaaS incident, complaint, or remediation log."]
      - ["Monitoring or control-system cyber compromise", Low-medium, High, "Not evidenced", Medium-high, "Request architecture, access controls, incident response, and third-party testing."]
    notes: "Likelihood and severity are analytical ratings anchored to the cited operating context; they are not company disclosures. Null or missing operating metrics mean the mitigation cannot be independently graded."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Permits and regulator acceptance, Saudi water authorities, "Unknown", "Permit delay, restriction, or non-renewal blocks deployment or reuse", Critical, "Maintain permit matrix and regulator evidence by site", High]
      - [Public-private procurement and project owners, SWPC / institutional buyers, "Unknown", "Procurement timing or counterparty change delays project conversion", High, "Verify awarded contracts, bid status, termination rights, and pipeline conversion", High]
      - [Series A capital and investor support, Al Zamil Industrial / Al Qunaibet Investment Fund, "Unknown", "Capital is insufficient or financing terms constrain expansion", High, "Obtain term sheet, cap table, cash balance, runway, and drawdown conditions", High]
    notes: "Counterparties are identified only where the assigned sources name them; no source establishes contractual dependence, ownership, proceeds, or concentration. Residual exposure is therefore conservative and subject to diligence."
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
