      - [Performance contract, "Performance-based treatment agreement", "contract/project", "Model described; term and minimum commitment unknown", "Company-described", "Review availability guarantees, remedies, and take-or-pay terms"]
      - [Financed deployment, "Service model without customer upfront capital investment", "plant/project", "Mechanism described; asset owner and financing cost unknown", "Company-described", "Identify asset ownership, funding source, cost of capital, and security package"]
      - [Plant or project delivery, "Configured decentralized treatment deployment", "plant/project", "One French plant reported at approximately €5 million", "Third-party report quoting CEO", "Reconcile capex, financing, delivery milestone, and revenue recognition"]
    notes: Revenue mechanisms and project signals are not disclosed revenue or ARR; currencies and periods remain source-specific.
    claimRefs: [CI001, CI002, CI003, CI005]
  - id: TI002
    title: Pricing and monetization
    columns: [price or contract basis, list versus realized, discounts or unknowns, source, implication]
    rows:
      - ["Pay per cubic meter", "No list or realized tariff disclosed", "Unknown", "Entarabi; AGBI", "Volume utilization and tariff are required to model revenue"]
      - ["Performance-based contract", "No contract value disclosed", "Unknown", "GI Aqua Tech Bahrain announcement", "Guarantee structure may shift operating and performance risk to GI"]
      - ["French industrial plant", "Approximately €5 million project value reported", "Project value is not a customer tariff", "Arab News", "Do not convert project value into recurring revenue"]
    notes: Public pricing does not establish realized revenue, gross margin, discounting, or customer-level economics.
    claimRefs: [CI001, CI002, CI004, CI005]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [metric, value, confidence, why it matters, diligence ask]
    rows:
      - [Energy savings, "Up to 80%", medium, "May reduce operating cost if measured against a defined baseline", "Obtain site-level energy baseline, denominator, and audited savings"]
      - [GCC planned capacity, "10,000 cubic meters combined in Q1 2026", medium, "Indicates a deployment target but not utilization or revenue", "Verify installed versus contracted capacity and actual throughput"]
      - [Expected project investment, "€150 million upon completion", medium, "Signals capital intensity at project/manufacturing level", "Separate committed capex, spend-to-date, financing source, and entity ownership"]
      - [Cash on hand / burn / runway, null, low, "Determines whether deployment depends on another financing event", "Request audited cash flow, monthly burn, debt schedule, and 24-month plan"]
      - [Gross margin / cost to serve, null, low, "Determines whether treatment volume covers operating and financing costs", "Request plant-level revenue, direct cost, utilization, and contribution margin"]
    notes: Null denotes unavailable public evidence; reported savings, capacity, and investment figures are not margin, cash, or funding-raised figures.
    claimRefs: [CI006, CI007, CI008, CI011, CI012, CI013]
