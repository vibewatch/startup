callouts:
  - calloutType: strength
    title: Customer capex proposition
    body: The company positions performance-based, financed deployments as a way to reduce customer upfront capital needs, which could improve adoption if contract economics are proven.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Financial disclosure gap
    body: The assigned evidence does not disclose revenue, margin, burn, runway, cash, contract concentration, or realized pricing, so valuation underwriting remains evidence-limited.
    claimRefs: [CI004, CI008, CI010, CI013]
  - calloutType: recommendation
    title: Require contract-level underwriting
    body: Before relying on the reported valuation, request audited accounts plus contract, utilization, cost-to-serve, financing, and cash-runway evidence.
    claimRefs: [CI004, CI008, CI010, CI013]
