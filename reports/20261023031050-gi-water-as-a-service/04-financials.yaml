  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: revenue-quality
      missingEvidence: Audited revenue, ARR or equivalent contracted revenue, customer concentration, renewal behavior, and realized pricing by project type.
      whyItMatters: The reported valuation cannot be compared with operating performance or recurring cash generation without these inputs.
      diligencePath: Obtain audited FY2025 and interim FY2026 accounts plus a contract-level revenue bridge and billing ledger.
      relatedQuestionRefs: [QI002, QI006]
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Site-level throughput, uptime, energy, consumables, labor, maintenance, financing cost, and gross margin.
      whyItMatters: A pay-per-volume model can destroy value if utilization or contribution margin is below plant financing and service cost.
      diligencePath: Request cohort-level unit economics for each operating plant, with baseline definitions and reconciliation to the general ledger.
      relatedQuestionRefs: [QI004]
    - type: missing-source
      severity: material
      topic: capital-adequacy
      missingEvidence: Cash balance, monthly burn, debt and project-finance obligations, primary versus secondary funding mix, and next-round trigger.
      whyItMatters: Project expansion and procurement delays may require capital before customer cash receipts arrive.
      diligencePath: Obtain the latest balance sheet, 24-month cash plan, debt schedule, Series A documents, and board-approved financing plan.
      relatedQuestionRefs: [QI006, QI007]
    - type: missing-source
      severity: material
      topic: project-capital
      missingEvidence: Evidence distinguishing committed, spent, financed, and expected portions of the reported €150 million investment.
      whyItMatters: Expected project investment is not cash available to the operating company and may represent a separate manufacturing or infrastructure vehicle.
      diligencePath: Reconcile project budgets, ownership, funding sources, and milestone payments to legal entities and audited accounts.
      relatedQuestionRefs: [QI003]
    - type: missing-source
      severity: minor
      topic: market-demand
      missingEvidence: Comparable customer contracts and independent realized pricing for industrial wastewater reuse in GI's target geographies.
      whyItMatters: Sector reuse potential does not establish GI's obtainable price, conversion rate, or share.
      diligencePath: Obtain anonymized customer references, bid tabs, and third-party market data covering Saudi Arabia, Bahrain, and Europe.
      relatedQuestionRefs: [QI008]
