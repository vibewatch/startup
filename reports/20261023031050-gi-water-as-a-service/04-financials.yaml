company:
  name: GI Water as a Service
chapter:
  number: 4
  title: Financials
  summary: GI Water as a Service presents a capital-light customer proposition through pay-per-cubic-meter, performance-based contracts, but public evidence does not disclose realized revenue, margins, cash burn, or runway. The clearest underwriting signal is a project-level model that may reduce customer upfront capex, alongside material financing and procurement dependency.
sections:
  - id: monetization
    title: Revenue model and monetization
    body: "GI Water as a Service describes a pay-per-cubic-meter model rather than a conventional equipment sale. Its own Bahrain announcement says the model deploys decentralized units on demand, uses performance-based contracts, and reduces upfront costs through sustainable financing structures. A separate company article describes WAAS as deployment without upfront capital investment through a service-based model. These are company-issued descriptions of the commercial mechanism, not evidence of realized revenue, contract duration, collection performance, or gross margin. Independent coverage from AGBI likewise characterizes GI as decentralized wastewater treatment sold on a pay-per-cubic-meter basis. The model should therefore be underwritten as contracted infrastructure/service revenue until customer contracts show whether billing is based on treated volume, availability, minimum take-or-pay commitments, or a hybrid."
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: delivery-economics
    title: Delivery costs and unit economics
    body: "Public material indicates that economics depend on treatment throughput, project configuration, financing, and operating execution. Arab News reports an approximately €5 million plant for a French cosmetics facility and separately reports planned GCC units with combined capacity of 10,000 cubic meters in the first quarter of 2026; those are project and capacity signals, not a disclosed price per cubic meter or realized margin. The same report attributes up to 80 percent energy savings to the technology, but this is a CEO-reported operating claim and does not establish gross profit. Across the seven relevant retained sources, no cost per treated cubic meter is disclosed. Missing data on electricity, consumables, service labor, maintenance, financing cost, utilization, and uptime prevents a defensible unit-economics estimate."
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-and-capital
    title: Traction, capital adequacy, and financing dependency
    body: "GI WaaS was reported by Entarabi as closing a Series A with participation from Al Zamil Industrial, Trade & Transport Company and Al Qunaibet Investment Fund, with a valuation exceeding $1 billion. AGBI also reports a valuation above $1 billion, but the retained sources do not disclose the amount of primary capital available to the operating entity, cash on hand, burn, runway, debt, liquidation preferences, or use of proceeds. Arab News reports expected project investments of €150 million upon completion for the manufacturing and technology project, which is a project investment expectation rather than funding raised or cash available. AGBI also says about 90 percent of water-sector innovation financing comes from governments and that government procurement can be slow and bureaucratic. This makes financing access, milestone-linked deployment capital, and procurement timing central underwriting risks."
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: verdict
    title: Financial verdict and diligence priorities
    body: "The financial model has a credible customer-value proposition if performance-based treatment contracts genuinely shift upfront infrastructure spending away from customers and if treated-volume utilization is high enough to cover plant financing and operating costs. However, the public record supports a business-model description more strongly than a financial performance conclusion. The valuation is reported, while revenue, ARR, gross margin, customer concentration, renewal behavior, cash balance, burn, and runway remain undisclosed in the assigned evidence. Sector-level reuse demand is meaningful: Bluefield states that only 6.4 percent of U.S. wastewater flows are reused for industrial, irrigation, or municipal purposes, and Saudi Arabia's Ministry of Environment, Water and Agriculture describes water innovation as a strategic priority. Neither establishes GI's market share or economics. Underwriting should remain conditional on audited accounts, contract-level billing and cost data, and financing documents."
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
  - id: exhibits
    title: Financial exhibits
    body: "The exhibits separate disclosed commercial mechanisms from unavailable underwriting inputs. The revenue bridge is deliberately directional: it maps customer wastewater volume through treatment delivery and performance qualification to potential service billing, without inventing a conversion rate or margin. Nulls in the tables mean that the seven relevant sources retained from the assigned pool do not disclose the requested quantity; they are not zero values. Project value, capacity, investment, and valuation figures retain their source-specific periods, currencies, and qualifiers. The bridge does not treat announced capacity as utilization, project value as revenue, accounting investment as cash available, or a reported valuation as evidence of liquidity."
    claimRefs: [CI002, CI005, CI009, CI013]
    tableRefs: []
    figureRefs: []
