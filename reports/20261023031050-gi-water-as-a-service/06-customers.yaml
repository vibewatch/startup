callouts:
  - calloutType: strength
    title: Project-specific traction
    body: "The assigned evidence identifies multiple distinct operating contexts and a reported French export project, which is stronger than an unsupported logo list."
    claimRefs: [CU001, CU002, CU005]
  - calloutType: risk
    title: Durability is unproven
    body: "No assigned source discloses customer count, contract duration, churn, renewal, retention, or account concentration; project announcements therefore cannot be converted into recurring adoption metrics."
    claimRefs: [CU007, CU008, CU011]
  - calloutType: recommendation
    title: Request customer-level diligence
    body: "Obtain signed references, production-versus-pilot status, contract terms, account revenue, treatment volumes, uptime, renewal history, and customer-side outcome measurements for each named site."
    claimRefs: [CU009, CU010, CU011]
