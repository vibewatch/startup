company:
  name: GI Water as a Service
chapter:
  number: 6
  title: Customers
  summary: Public evidence points to an industrial and community customer model with early named deployments and a reported French export, but it does not disclose a customer count, recurring revenue, renewal behavior, or concentration. The strongest adoption signals are project-specific use cases; the largest diligence gap is whether these are repeatable production contracts rather than pilots or company-reported plans.
sections:
  - id: buyer-segments-and-use-cases
    title: Buyer segments and use cases
    body: >-
      GI WaaS appears to sell treatment as an operating service to industrial and community users rather than as a single standardized municipal product. The public examples span a French cosmetics manufacturing facility, a concrete factory at NEOM, a Riyadh hotel, and a residential neighborhood in Jeddah. These use cases imply different buyers, influent streams, procurement processes, and service requirements. Saudi water-sector institutions are also relevant ecosystem participants: SWPC describes itself as the principal buyer of desalinated and treated water and manages wastewater infrastructure contracts, while the Saudi Water Authority reported an agreement with GI Aqua Tech for innovation and incubation programs. The evidence supports segment breadth, but not a verified customer roster or sales-channel mix.
    claimRefs: [CU001, CU002, CU003, CU004, CU013, CU014, CU015, CU016]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      The adoption record is project-led and directional rather than a measured cohort series. A reported EUR 5 million French project is described as an installation at a cosmetics factory, while additional Bahrain and Gulf units were planned for the first quarter of 2026 with combined treatment capacity of 10,000 cubic metres. Other public descriptions identify installed or claimed applications in Jeddah, NEOM, and a Riyadh hotel. None of the assigned sources gives active customer accounts, utilization, contract duration, renewal, churn, gross retention, net retention, or a denominator for customer growth. Consequently, the evidence is consistent with commercial traction but cannot establish durability or recurring expansion.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof and concentration
    body: >-
      Named deployments provide more useful evidence than an undifferentiated logo list, but the public record remains thin on customer-side verification. The French cosmetics project has a stated site and project value, and the Jeddah, NEOM, and hotel examples identify operating contexts; the available text does not name the cosmetics manufacturer, concrete producer, or hotel as contracting counterparties. Diriyah's public site confirms a large hospitality and visitor destination, but it does not connect Diriyah to GI WaaS. The absence of disclosed customer names, contract terms, and revenue by account prevents a reliable concentration estimate. Management should provide signed references and account-level economics before treating these examples as repeatable production adoption.
    claimRefs: [CU009, CU010, CU011, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
