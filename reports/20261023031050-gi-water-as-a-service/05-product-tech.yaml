callouts:
  - calloutType: risk
    title: Product proof is the gating risk
    body: >-
      The public record names G-NANO and a decentralized service model but does not establish
      verified performance, deployments, permits, or reliability. Investment diligence should
      require site-level test results, customer references, operating logs, and regulatory files.
    claimRefs: [CE003, CE004, CE015]
  - calloutType: strength
    title: Category fit is credible
    body: "Independent research documents wastewater reuse needs and decentralized treatment as a viable category, giving the stated problem and deployment model a plausible operating context."
    claimRefs: [CE005, CE009, CE011, CE016]
  - calloutType: assumption
    title: Claimed performance remains unverified
    body: "Statements about 100% reuse, no odor, efficiency, and environmental impact are company-linked claims unless supported by site data, test reports, or regulatory records."
    claimRefs: [CE003, CE004]
