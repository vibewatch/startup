company:
  name: GI Water as a Service
chapter:
  number: 5
  title: Product & Technology
  summary: GI WaaS is described as a Saudi water-treatment operator built around decentralized, mobile or stationary G-NANO plants and a pay-per-cubic-meter service model. Public evidence supports the problem fit and regulatory relevance, but does not independently verify G-NANO performance, deployment maturity, reliability, or security controls.
sections:
  - id: delivered-service
    title: Delivered service and maturity
    body: >-
      Public reporting describes GI WaaS as a subsidiary or affiliate of GI Aqua Tech offering
      decentralized wastewater treatment to industries and communities through a pay-per-cubic-meter
      model. Forbes Middle East and Jawlah both describe the service as using mobile or stationary
      plants, while Innovation Hub SA attributes the G-NANO system to GI WaaS and describes it as
      non-biological. These are company-linked or syndicated descriptions rather than independently
      audited product documentation. The strongest defensible conclusion is that GI WaaS has
      articulated a service proposition and a named treatment technology, not that public evidence
      proves commercial scale, customer uptime, effluent quality, or repeatable economics. The
      product therefore appears conceptually differentiated by decentralized deployment and service
      billing, but maturity remains only partially observable.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: workflow-architecture
    title: Workflow and operating architecture
    body: >-
      The proposed workflow is point-of-need wastewater intake, treatment in a mobile or stationary
      unit, and delivery of treated water for an industrial or community use. That operating model
      fits a Saudi market in which treated wastewater is used for irrigation and industrial
      applications, but where a meaningful share is still discharged rather than reused. A 2025
      Applied Water Science study describes conventional activated sludge as common for secondary
      treatment, media filtration and chlorination for tertiary treatment, and reverse osmosis in
      industrial cities. GI WaaS's public materials do not disclose a process flow, component list,
      feed-water envelope, monitoring instrumentation, or maintenance regime, so the architecture
      below separates stated elements from diligence-required interfaces. The critical execution
      dependency is not merely treatment chemistry: permits, sampling, quality assurance, transport,
      customer-site integration, and operator response all determine whether a decentralized asset
      can deliver compliant reuse.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: differentiation-and-dependencies
    title: Differentiation and dependencies
    body: >-
      GI WaaS claims a proprietary G-NANO approach and emphasizes mobile or stationary deployment,
      efficiency, and broad industrial applicability. Those claims could create value if independently
      demonstrated across different influent conditions and customer settings, but the assigned
      evidence does not provide patents, test reports, named installations, benchmark results, or
      verified lifecycle costs. Independent market material shows that decentralized treatment is a
      real product category: Fluence describes pre-engineered containerized systems, modular scaling,
      remote monitoring, and low-energy operation. That comparator establishes category feasibility,
      not GI WaaS performance or competitive superiority. The key defensibility question is therefore
      whether G-NANO has validated process advantages, proprietary operating data, or deployment
      know-how that withstands third-party testing and customer procurement.
    claimRefs: [CE009, CE010, CE011]
  - id: trust-safety-compliance
    title: Trust, safety, and compliance
    body: >-
      Saudi wastewater reuse is a regulated activity. The Saudi Water Authority lists rules for
      non-network water services, water-sector compliance, environmental compliance, and off-grid
      distribution. UNEP's legal summary states that permits are required for treatment plants and
      for several treated-water uses, with technical standards, inspections, sampling, and controls.
      The academic review also records a 2000 Royal Order requiring tertiary treatment and notes that
      reuse and discharge depend on treatment levels and use case. These sources make regulatory
      approvals, sampling records, and site-specific operating procedures central diligence items.
      No assigned source documents GI WaaS's licenses, certifications, incident history, cybersecurity
      controls, privacy posture, or quality-management system. The absence of such evidence is a
      disclosure gap, not evidence that controls or incidents do not exist.
    claimRefs: [CE012, CE013, CE014, CE015]
