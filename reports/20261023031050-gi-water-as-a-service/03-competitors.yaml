      - ["SUEZ", "Price not disclosed in assigned source", "Plant design/build, treatment operations, Aquadvanced digital monitoring, reuse and sludge solutions", "Bid structure, service fee, capex allocation, and term unknown", "Integrated scope may compete on risk transfer and operating assurance rather than list price"]
      - ["Established market suppliers", "Price not disclosed in assigned source", "Treatment technologies, chemicals, process control, automation, engineering, and O&M categories", "Vendor-specific package and channel economics unknown", "Broad supplier competition can pressure technology margins and increase buyer choice"]
      - ["Traditional plant / internal build", "No source-backed price", "Owner-selected infrastructure and operating model", "Capex, maintenance, compliance, financing, and reuse economics require buyer data", "Status quo must be compared on lifecycle cost, not only vendor tariff"]
    notes: "The assigned sources establish commercial-model descriptions and market offering categories, not realized prices. No price, revenue, ARR, margin, or cash-burn value is inferred."
    claimRefs: [CP001, CP004, CP006, CP008, CP013, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Ordinal positioning highlights GI's decentralized service proposition against SUEZ and broader established alternatives; coordinates are analyst assessments, not market-share or performance measurements.
    data:
      xAxis: "Integration and operating breadth (ordinal 1–5)"
      yAxis: "Decentralized / usage-linked proposition (ordinal 1–5)"
      points:
        - {label: "GI Water as a Service", x: 3, y: 5, note: "Decentralized, pay-per-cubic-meter model is described; operating breadth and outcomes remain partly unverified"}
        - {label: "SUEZ", x: 5, y: 2, note: "Plant, network, digital monitoring, reuse, and operator capabilities are described; no comparable usage-linked price is shown"}
        - {label: "Veolia / other established suppliers", x: 4, y: 2, note: "Regional market study identifies established suppliers, but the assigned text lacks product-level detail"}
        - {label: "Traditional centralized plant", x: 4, y: 1, note: "Represents the conventional infrastructure alternative; buyer-specific operating data are unavailable"}
        - {label: "Internal or public-utility operation", x: 3, y: 1, note: "Represents status quo ownership or operation; economics and capability vary by buyer"}
        - {label: "Technology-only package", x: 2, y: 3, note: "Market study identifies technology, automation, engineering, and O&M categories, but not a specific vendor package"}
    approximationNotes: "Coordinates are ordinal synthesis scores from the cited capability evidence, not observed measurements, market share, or a forecast. The figure must not be read as a ranking of treatment quality."
    claimRefs: [CP001, CP004, CP006, CP007, CP012]
callouts:
  - calloutType: risk
    title: Incumbent and procurement risk
    body: Established operators and public-sector funding channels may have stronger procurement access than a challenger; assigned evidence does not establish GI's contracted reference base or renewal durability.
    claimRefs: [CP007, CP010, CP013]
  - calloutType: insight
    title: Differentiation is commercially testable
    body: GI's differentiation should be tested through customer-level lifecycle-cost, deployment-time, compliance, reuse-quality, and renewal evidence rather than through the reported valuation or company marketing claims alone.
    claimRefs: [CP001, CP008, CP012, CP013]
