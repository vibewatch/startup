      - ["Digital / operational layer", "Operational wastewater treatment and reuse capability claimed", "Sensors, weather data, AI/data analysis, alerts, and operator decision support described", "Depends on existing controls and staff", "SUEZ has the clearest assigned-source evidence for integrated monitoring"]
      - ["Reuse and sustainability posture", "G-NANO and water reuse are positioned as core outcomes", "Reuse, sludge recycling, and resource-efficiency solutions described", "May require separate treatment, reuse, and compliance projects", "Both vendor positions address reuse; outcome comparability is not established"]
    notes: "This matrix separates source-backed capabilities from unsupported comparative judgments. 'Not stated' means the assigned source pool did not provide the field, not that the capability is absent."
    claimRefs: [CP002, CP003, CP004, CP005, CP012, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [provider_or_option, price_or_unit, included_capabilities, discount_or_contract_unknowns, underwriting_implication]
    rows:
