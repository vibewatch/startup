  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risks]
    rows:
      - [Bull, "Audited growth and gross profit; repeatable contracts; exports convert to cash; clean preference stack.", "Potentially supports a premium strategic-services valuation, but no public multiple or price target is supportable.", "Low until data-room evidence is supplied.", "Execution, collection, regulatory compliance, dilution."]
      - [Base, "Market demand persists; deployments grow, but revenue, margin, retention, and cap-table evidence remain incomplete.", "Treat the reported >$1bn as an unverified financing reference, not fair value.", "Most consistent with current public disclosure.", "Procurement cycles, installation cost, working capital, governance."]
      - [Bear, "Projects slip; customers or regulators do not renew; financing is heavily dilutive or preference-heavy.", "Downside is a material impairment or down-round; no floor can be calculated without liabilities and preferences.", "Plausible stress case; magnitude unquantifiable.", "Commercialization failure, cost overruns, financing overhang."]
      - [Diligence gate, "Obtain audited financials, contract cohort, cap table, terms, debt, cash, and compliance evidence.", "Only after the gate can an entry price, target return, hold period, or exit case be modeled.", "Required before investment decision.", "Missing evidence itself remains the immediate risk."]
    notes: "Scenarios are qualitative because public sources do not disclose revenue, margins, cash flow, comparable transaction multiples, or capitalization terms; no numeric return is invented."
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV011, CV013, CV015, CV016]
