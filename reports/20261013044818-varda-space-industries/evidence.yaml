evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited financial statements confirming revenue, gross margins, cash burn rate, and current cash runway following
      the Series C financing round.
    whyItMatters: >-
      Without audited financial disclosures, assessing Varda's commercial operating sustainability and capital
      efficiency relies on private company claims and secondary estimates.
    diligencePath: >-
      Request confidential disclosure of audited income statements, balance sheets, and cash flow reports under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: corporate-incorporation-records
    missingEvidence: Delaware state corporate registry filings reconciling entity incorporation dates across commercial databases.
    whyItMatters: >-
      Tracxn records an entity incorporation date of 1999 under CIN 853976446, conflicting with Varda Space Industries'
      established founding in January 2021.
    diligencePath: Pull certified Delaware Division of Corporations filings for Varda Space Industries, Inc.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-and-unit-economics
    missingEvidence: >-
      Public disclosure of per-mission rideshare costs, capsule fabrication expenses, and contract pricing schedules for
      commercial pharmaceutical runs.
    whyItMatters: >-
      Without per-flight unit economics, bottom-up SOM sizing and net revenue generation cannot be independently
      verified against private valuation multiples.
    diligencePath: >-
      Review future customer pilot filings, SEC disclosures from public partners like United Therapeutics, or audit
      mission pricing statements.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Detailed contract pricing structures, reservation fees, and royalty milestone terms for Varda's pharmaceutical
      partnership missions.
    whyItMatters: >-
      Without disclosed mission pricing, underwriting Varda's commercial competitiveness against terrestrial formulation
      platforms relies entirely on proxy estimates and unverified list rates.
    diligencePath: >-
      Request customer master service agreements, payload reservation terms, and revenue-sharing schedules under
      confidential diligence review.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margins
    missingEvidence: >-
      Audited income statement disclosing realized contract revenue, cost of goods sold per orbital mission, and
      corporate gross margin.
    whyItMatters: >-
      Essential to verify whether Varda generates sustainable unit profit on commercial missions or operates under heavy
      negative gross margins subsidized by venture capital.
    diligencePath: >-
      Request audited GAAP financial statements and confidential management accounts under non-disclosure agreement
      during formal diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Granular per-mission cost accounting detailing Rocket Lab Pioneer satellite bus purchase price, SpaceX rideshare
      launch slot fees, and recovery range operating expenses.
    whyItMatters: >-
      Determines the floor contract price required for Varda to achieve break-even on each commercial W-series flight as
      launch cadence scales.
    diligencePath: >-
      Review supplier contracts with Rocket Lab and launch manifest booking receipts with SpaceX and spaceflight
      brokers.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Detailed monthly cash burn rate, current cash balances post-Series D, and terms of the Series D preferred stock
      (liquidation preferences, ratchets, and anti-dilution rights).
    whyItMatters: >-
      Crucial for assessing net cash runway, forward financing dependency, and potential downside protection or dilution
      risks for incoming investors.
    diligencePath: Request Series D term sheet, capitalization table, and audited 24-month forward cash flow forecast from the CFO.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pharma-contracts
    missingEvidence: >-
      Full commercial agreement terms for the United Therapeutics collaboration, including upfront research payments,
      milestone vesting, and prospective product royalty percentages.
    whyItMatters: >-
      Determines whether biopharma agreements represent high-margin recurring royalty streams or low-margin
      cost-reimbursement experimental runs.
    diligencePath: >-
      Obtain redacted copies of commercial master services agreements and intellectual property licensing addenda with
      biopharma partners.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: commercial-drug-validation
    missingEvidence: >-
      Third-party analytical verification and clinical yield documentation demonstrating that an in-orbit crystallized
      drug candidate delivers improved therapeutic bioavailability or patentable stability beyond terrestrial
      formulations.
    whyItMatters: >-
      Without peer-reviewed clinical proof or customer disclosure of reformulations advancing toward human trials,
      orbital pharma manufacturing remains an unproven commercial value proposition.
    diligencePath: >-
      Review preclinical pharmacokinetic and stability data from the United Therapeutics collaboration and inspect
      pending patent filings claiming space-derived crystal polymorphs.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
  - type: conflicting-data
    severity: minor
    topic: regulatory-reentry-licensing
    missingEvidence: >-
      Standardized FAA Part 450 vehicle safety authorizations and bilateral landing range agreements enabling on-demand
      deorbit timing without multi-week regulatory holds.
    whyItMatters: >-
      Prolonged on-orbit waiting periods for reentry clearance increase orbital degradation risk and degrade payload
      turnover economics.
    diligencePath: >-
      Audit FAA commercial space transportation license filings and Southern Launch regulatory protocols for the
      Koonibba Test Range.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: Customer contract pricing and commercial terms
    missingEvidence: >-
      Audited contract values, upfront mission service fees, milestone schedules, and downstream royalty percentage
      ranges for the United Therapeutics agreement and pipeline pharma prospects.
    whyItMatters: >-
      Without disclosed contract terms, investors cannot determine whether biopharma deals represent recurring
      high-margin commercial revenue or loss-leading technical proof pilots.
    diligencePath: >-
      Request confidential disclosure of commercial contract master service agreements (MSAs) and task-order schedules
      during Series D confirmatory diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table public enumeration limits
    missingEvidence: >-
      Full customer registry of undisclosed pharmaceutical partners currently conducting ground-based screening or
      contracted for future W-series manifest slots.
    whyItMatters: >-
      Customer concentration is currently opaque; United Therapeutics is the sole publicly disclosed commercial
      biopharma partner alongside US DoD and NASA defense/science payloads.
    diligencePath: >-
      Review pipeline CRM and signed NDA customer lists to evaluate biopharma demand diversification beyond United
      Therapeutics.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: Customer cohort retention and repeat mission cadence
    missingEvidence: >-
      Multi-year customer cohort retention data (NRR/GRR) and repeat flight booking rates for government and commercial
      capsule users.
    whyItMatters: >-
      Long-term unit economics require repeat customer flight frequency rather than one-off science demonstrations to
      amortize vehicle production costs.
    diligencePath: Verify repeat booking commitments across the contracted 20+ reentries through 2028.
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-inventory
    missingEvidence: >-
      A complete current inventory of licenses, renewal conditions, environmental obligations, export controls,
      litigation, enforcement history, and product-specific pharmaceutical approval requirements.
    whyItMatters: >-
      The public pool supports specific reentry and process risks but cannot establish the full legal and regulatory
      perimeter.
    diligencePath: >-
      Obtain counsel's jurisdiction-by-jurisdiction regulatory matrix, regulator correspondence, renewal calendar, and
      pending-dispute schedule.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: mission-reliability
    missingEvidence: >-
      Mission-loss rate, anomaly and near-miss history, schedule variance, manufacturing yield, acceptance-test escapes,
      insurance coverage, and recovered-payload quality metrics.
    whyItMatters: Completed-mission counts cannot establish reliability or quality without a denominator and exception history.
    diligencePath: >-
      Review the mission assurance dashboard, anomaly review board minutes, insurance policies, and vehicle-level
      acceptance records.
    relatedQuestionRefs:
      - QR002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-runway
    missingEvidence: >-
      Revenue, gross margin, burn, cash balance, funded runway, per-mission cost, pricing, and the
      government-versus-commercial contribution margin split.
    whyItMatters: The financing announcement establishes capital raised, not cash available or self-sustaining economics.
    diligencePath: >-
      Obtain audited financials, monthly cash bridge, mission-level contribution margins, launch commitments, and the
      board-approved operating plan.
    relatedQuestionRefs:
      - QR003
      - QR008
  - type: private-evidence-only
    severity: material
    topic: customer-and-partner-concentration
    missingEvidence: >-
      Current revenue, backlog, launch-provider, supplier, government-program, and pharmaceutical-customer concentration
      plus contract termination rights.
    whyItMatters: >-
      Historical program evidence and current capability claims do not quantify counterparty dependence or demand
      durability.
    diligencePath: >-
      Review the customer and supplier concentration schedules, signed backlog, cancellation clauses, launch manifest,
      and pharmaceutical program waterfall.
    relatedQuestionRefs:
      - QR005
      - QR009
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming revenue run-rate, gross margin per capsule, mission capex, and cash runway
      following the Series D.
    whyItMatters: >-
      Without audited unit economics, the $1.6 billion post-money valuation multiple cannot be rigorously underwritten
      against recurring pharmaceutical cash flows.
    diligencePath: >-
      Request confidential financial disclosure package including management accounts, burn rate, and mission margin
      waterfall.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: >-
      Series D term sheet details, liquidation preference seniority, participating preferred provisions, and down-round
      ratchet protections.
    whyItMatters: >-
      Senior preferences or high dividend ratchets could compress common and earlier preferred equity returns under flat
      or downside exit scenarios.
    diligencePath: Obtain updated cap table and Series D certificate of incorporation from company counsel or lead investor.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
