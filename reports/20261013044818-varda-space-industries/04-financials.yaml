callouts:
- calloutType: risk
  title: High Capital Intensity and Private Unit Economic Opacity
  body: While Varda successfully secured a $251 million Series D financing round to underwrite scaling, its underlying per-mission economics remain completely private. Hardware procurement from Rocket Lab, rideshare launch fees, and extensive terrestrial recovery infrastructure create a heavy fixed-cost base that cannot be validated without audited financial disclosures.
  claimRefs:
  - CI001
  - CI005
  - CI007
- calloutType: insight
  title: Dual-Use Revenue Diversification Mitigates Biopharma Gestation Lags
  body: Pharmaceutical crystallization cycles in microgravity face protracted multi-year clinical timelines before commercial drug delivery can generate product royalties. Varda's ability to monetize reentry capacity through defense hypersonic testing payloads provides near-term cash contributions that soften biopharma development gestation.
  claimRefs:
  - CI004
  - CI006
  - CI010
