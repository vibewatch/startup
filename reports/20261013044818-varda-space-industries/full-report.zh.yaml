  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 品类边界与商业范围
        blocks:
          - type: paragraph
            body: >-
              商业航天经济正从轨道观测和电信基础设施转向太空内实体生产。Varda Space Industries
              将自身商业品类定义为微重力制药配方与自主轨道大气再入服务的结合。该市场边界涵盖高价值小分子和生物制品结晶、多晶型发现及高超声速材料测试，但明确排除大宗仿制药制造、商品化学品批量合成和不返回地面的卫星轨道载荷。其物理价值来自微重力消除对流、浮力运动和重力沉降，从而精确控制晶格均匀性与颗粒尺寸分布。由于轨道发射和舱体再入需要大量资本及物流支出，只有价值密度极高、且生物利用度提升、固态稳定性或专有多晶型知识产权足以覆盖轨道运行成本的治疗性物质，才具备商业可行性。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              评估微重力制药制造的可寻址市场，需要多个分析视角，而不是一个笼统估算。宏观来看，广义航空航天研究预计，到 2035 年，商业太空制造生态将扩展至约 $10
              billion，覆盖先进材料、半导体基底、光纤和生命科学。但筛选出可进入的生命科学配方后，可寻址市场收窄至每年约 $1.2 billion–$2.5 billion 的生物制药配方支出。Varda
              的可服务可获得市场（SOM）目前受飞行节奏和签约舱体容量限制：公司已完成 6 次任务，并签约超过 20 次商业和国防再入任务至 2028 年，对应累计任务积压约 $300 million。依托截至 C
              轮累计筹得的 $329 million 资本，以及 2026 年 9 月宣布的 $251 million D 轮融资，Varda
              已为早期争取该新兴细分市场的领导份额配置了必要设备，但每次运行的私有利润率仍未披露。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM006
