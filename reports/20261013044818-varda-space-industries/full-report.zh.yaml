        title: 护城河持久性、合作伙伴依赖与不利替代风险
        blocks:
          - type: paragraph
            body: >-
              Varda 的竞争护城河建立在累积飞行经验、专有热防护系统和监管关系上。截至 2026 年末已完成 6 次轨道再入，公司相对于仍停留在概念阶段的竞争者拥有明显运营领先。任命前 Pfizer 研发负责人
              Mikael Dolsten 为董事会成员，也增强了其生物制药可信度。然而，结构性依赖威胁着长期持久性：Varda 依赖 SpaceX 提供发射节奏，依赖 Rocket Lab 进行平台工程，并依赖 Utah 和
              South Australia 的专用着陆场回收舱体。此外，不利商业证据显示，尚无任何微重力制造药物获得 FDA 上市批准或实现商业销售。如果地面配方化学成功仿制微重力晶体形态，或 FDA
              要求带来难以承受的验证成本，Varda 的可寻址商业市场可能在自主太空工厂达到工业规模前就已收缩。
