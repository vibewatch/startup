              - CO007
      - number: '1.4'
        title: 飞行里程碑、技术平台与商业积压
        blocks:
          - type: paragraph
            body: >-
              Varda 的运营模式依托与 Rocket Lab Pioneer 航天器平台集成的专用 W 系列再入舱。Pioneer
              平台提供电力、遥测通信、姿态确定与控制，以及轨道机动等关键在轨能力，以便将舱体调整至大气进入位置。2024 年 2 月，Varda 的 W-1 任务在轨 8 个月后返回地球，携带微重力结晶的
              ritonavir，安全降落在 Utah，完成了关键商业里程碑。这使 Varda 成为首家实现自主在太空制药生产并返回产品的私营公司。后续任务拓展了平台的运营范围，包括在 South Australia 的
              Koonibba Test Range 为 Air Force Research Laboratory 和 NASA Ames Research Center 进行高超声速再入飞行测试。2026 年 5
              月，Varda 宣布与 United Therapeutics 开展多任务合作，加工肺病疗法，并把商业化路径进一步推进；截至 2028 年，已签约积压超过 20 次再入任务。
            claimRefs:
