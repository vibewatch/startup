  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资论点与关键反论点
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries 的投资逻辑建立在已落地的飞行执行能力和前沿太空制造能力之上，但低地球轨道制药生产的商业经济性仍未得到验证。乐观论点的核心是技术验证：Varda
              已从概念设计走到实际运营，完成 6 次轨道任务、回收 5 个舱体，并在 W-1
              上展示了利托那韦多晶型的太空结晶。公司运营一体化轨道加工与高超声速再入平台，绕开国际空间站物流，为制药赞助方提供专属任务方案，并能在陆地靶场自主回收。商业拼车发射价格大幅下降后，高价值原料药的轨道加工在技术上变得可行。反过来看，关键反论点是：Varda
              在商业生物制药加工上本质仍处于收入前阶段，明确客户的飞行收入尚未到来。公司自研垂直整合卫星平台在 W-4
              的首飞以离轨处置点火告终，而非回收着陆，说明航天风险依然挥之不去。此外，生物制药合作方尚未证明太空结晶药物在药代动力学、产率或专利优势上足以覆盖常规任务成本。FDA
              对微重力制造商业药品的监管路径仍未明确，资质认证周期可能拉得很长。没有商业化单位利润，单靠技术飞行节奏无法支撑当前资本化水平。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.2'
        title: D 轮资本化与估值判断
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月，Varda 宣布完成由 Lux Capital 和 Natural Capital 共同领投的 $251M D 轮融资；据报道，公司投后估值为 $1.6B，累计披露融资额达到
              $598M。本轮融资显示投资者对 Varda 飞行节奏抱有强烈信心，公司截至 2029 年已在 SpaceX 及其他商业服务商处预订 28 次发射。随着公司准备高频飞行并扩大搭载载荷业务，员工人数已增至约 250
              人。从估值判断看，$1.6B
              的账面估值偏高。由于公司未披露商业收入跑率、毛利率和任务资本开支瀑布数据，这一估值倍数更像投机性的企业定价，而非建立在成熟现金流基本面上的定价。注资为运营提供了充足跑道，但如果轨道产率或合作方承诺出现商业化延误，私募优先股条款、清算优先级和潜在参与权会让普通股股东面临下行风险。
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
              - CV014
      - number: '8.3'
        title: 情景建模、下行触发因素与基准回报
        blocks:
          - type: paragraph
            body: >-
              情景建模从不同商业和技术路径评估 Varda。基准情景（概率 50%）假设 Varda 保持常规发射节奏，利用国防和高超声速测试载荷获取基础现金流，并在 2027 年执行 United Therapeutics
              的小分子肺部药物飞行，对应隐含企业估值 $1.4B–$1.8B。乐观情景（概率 20%）假设生物制药加速采用：太空结晶配方带来专有生物利用度优势，年度任务清单扩大到 10 次以上，企业估值升至
              $3.0B–$4.5B。悲观情景（概率 30%）则体现硬件密集型航天项目的现实。下行触发因素包括出现类似 W-4
              处置点火的飞行异常、陆地药品审批延迟，或生物制药赞助方认定陆地结晶替代方案能以更低成本复现微重力多晶型。在任务资本开支持续投入、商业生物制药合同却未扩大的情况下，估值将向资产价值压缩至 $400M–$600M。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
      - number: '8.4'
        title: 投资建议与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们的结论是“继续研究”，对该投资论点赋予高风险和中等置信度。Varda 无疑是自主轨道再入和太空制造领域的商业先行者，但按 $1.6B 的 D
              轮估值参与股权投资，仍需要通过公开申报无法获得的运营和财务保密验证。参与投资应以四项尽调闸门为前提：第一，审计任务级单位经济模型，拆分拼车发射费用、卫星平台折旧和载荷加工成本；第二，检查 D
              轮公司注册证书，量化清算优先权和反稀释棘轮；第三，取得 United Therapeutics
              项目的完整商业合同条款和里程碑安排；第四，取得回收后的纯度与生物利用度检测，验证商业药物优势。再次出现未回收轨道任务，或推迟 2027 年商业制药发射清单，都将击穿投资论点。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV009
              - CV013
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 建议：继续研究，执行门槛高
            body: >-
              Varda 已完成 6 次飞行任务并实现 5 次回收，在商业太空制造上取得前所未有的里程碑。但按 $1.6B 的 D
              轮估值，公开证据不足以验证可重复的商业利润率。在客户经济性和私有公司烧钱情况披露前，投资者应继续保持“继续研究”立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
          - type: callout
            title: 核心估值风险：商业生物制药收入尚未验证
            body: 核心反论点在于，公司能否从政府 / 国防测试合同转向盈利的制药加工业务。客户飞行目标定在 2027 年，而监管路径仍处于早期；任何延误都可能在现金流盈亏平衡前耗尽 D 轮资金。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV013
