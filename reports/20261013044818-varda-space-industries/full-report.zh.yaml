  - id: FE001
    title: Varda 一体化太空工厂架构栈
    type: stack
    summary: 支撑在轨制造和高超音速再入的端到端硬件、软件与运营层。
    data:
      layers:
        - label: 地面准备与筛选层
          detail: 候选配方筛选和依赖重力的动力学建模
          modules:
            - Mettler Toledo EasyMax 反应器
            - Technobis Crystal16 系统
            - 台式高 g 离心机
        - label: 发射与入轨层
          detail: 航天器集成及拼车送入低地球轨道
          modules:
            - SpaceX Falcon 9 拼车适配器
            - Transporter 发射任务集成
            - 轨道分离时序器
        - label: 轨道平台与服务层
          detail: 发电、通信、姿态控制和离轨推进
          modules:
            - Rocket Lab Pioneer 航天器平台
            - 可展开太阳能电池阵列翼
            - 联氨姿态控制推进器
        - label: 在轨微重力处理层
          detail: 自动化制药结晶和反应监测
          modules:
            - 密封晶体生长室
            - 热控制与加热回路
            - 原位工艺 Raman 和光学传感器
        - label: 高超音速大气再入层
          detail: 自主执行离轨轨迹和热防护
          modules:
            - 120 kg 锥形再入太空舱
            - 碳酚醛烧蚀防热罩
            - 冷气姿态推进器
        - label: 回收与地面分析层
          detail: 陆上着陆、载荷取回和实验室表征
          modules:
            - 超音速减速伞和主伞
            - Southern Launch 回收团队（Koonibba）
            - SCXRD、XRPD 和 NMR 分析套件
    approximationNotes: 架构分层按发射、平台、载荷和地面环节归类一体化飞行系统。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
