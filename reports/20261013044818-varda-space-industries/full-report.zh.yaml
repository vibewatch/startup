  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从地面超重力筛选到轨道制造和临床许可的结构化客户采用旅程。
    data:
      items:
        - label: 1. 地面目标评估
          touchpoints:
            - 生物制药客户评估高价值药物分子；改善配方可延长专利寿命
            - 初步筛查物理溶解度、生物利用度限制和给药要求
        - label: 2. 地面超重力离心筛选
          touchpoints:
            - 在 Varda 地面超重力实验室的多个重力水平下测试候选化合物
            - 通过实证验证成核和晶体尺寸分布会响应重力变化
        - label: 3. 轨道任务盒集成
          touchpoints:
            - 将配方程序写入自动化、密封的微重力结晶硬件
            - 与 Rocket Lab Pioneer 卫星平台集成后，搭载 SpaceX Transporter 拼车任务发射
        - label: 4. 自主在轨处理
          touchpoints:
            - 在低地球轨道自主执行微重力结晶，无需人工干预
            - 抑制浮力驱动的对流和沉降，产出均匀、有序的晶体结构
        - label: 5. 再入与快速地面回收
          touchpoints:
            - Pioneer 平台将太空舱调整至精确离轨轨迹；C-PICA 防热罩承受 Mach 25 加热
            - 在 Koonibba（澳大利亚）或犹他州靶场通过降落伞着陆，并快速回收冷链样本
        - label: 6. 分析表征与许可
          touchpoints:
            - 通过全面的固态表征（XRPD、DSC）确认新型多晶型结构和稳定性
            - 联合申请专利，并与下游特许权使用费相配套，设计商业制造批次
    approximationNotes: 客户旅程阶段综合 Varda 技术出版物、官方生物制药文件和截至 2026 年的高管访谈。
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU010
      - CU012
      - CU013
