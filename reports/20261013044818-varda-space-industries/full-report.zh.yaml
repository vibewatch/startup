            body: >
              客户采用旅程分为五个阶段，覆盖地面筛选、轨道加工和长期许可。为降低昂贵太空飞行风险，Varda
              先在地面离心机中进行超重力筛选，在高重力条件下测试客户分子，确认成核动力学和晶体生长确实依赖重力，再预订轨道载荷。验证通过后，载荷被集成进自动微重力结晶盒，并搭乘商业拼车任务发射。

              轨道结晶完成后，舱体以 Mach 25 再入地球大气，并将完整载荷样本送回客户实验室，进行全面固态表征。扩张模式依靠知识产权共同所有：Varda
              收取前置任务集成费，并就产生的商业配方协商里程碑付款和专利特许权使用费。但重大尽调风险仍在：实际商业条款、里程碑触发条件和合作伙伴收入承诺均为私有信息；尚无太空制造药物获得监管上市批准或实现商业销售。
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU010
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
