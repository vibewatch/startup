      - number: '7.3'
        title: 合作伙伴、客户与商业化依赖
        blocks:
          - type: paragraph
            body: >-
              Varda 的风险链覆盖发射机会、靶场协调、政府需求、生物制药开发和稀缺技术人才。Not Boring 披露其投资部门是 Varda 投资者，因此其叙述被视为合作伙伴相关而非独立；该机构过去称 Varda
              购买发射容量和 Rocket Lab 卫星平台，执行超过 $60 million 的 DoD 项目，并面临深科技常见的技术风险、买方决策慢、招聘专业化和研发耗现金组合。Varda
              现在称能够端到端生产航天器，表明平台依赖可能降低，但现有指定来源没有提供当前供应商地图或客户集中度时间表。生物制药工作流虽具体，商业合同经济性和规模化客户结果仍属私有信息。
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
