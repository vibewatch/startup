      - number: '6.2'
        title: 采用轨迹与任务节奏
        blocks:
          - type: paragraph
            body: >
              Varda 的商业采用轨迹靠快速运营节奏，而不是庞大客户数。截至目前，公司已执行 6 次轨道飞行，并称截至 2028 年已与政府和商业客户签约超过 20 次飞行器再入。商业太空制造过去在
              International Space Station 上受困于飞行频率有限、需要人工船员监管和回收周期漫长。Varda 通过端到端自动化绕开这些瓶颈：在 SpaceX Falcon 9 Transporter
              拼车发射中预订次级载荷舱位，并接入 Rocket Lab Pioneer 平台，获得轨道推进、电力和脱轨机动能力。

              2026 年 10 月，公司在同一枚火箭上同时发射两个 W
