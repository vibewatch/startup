      - number: '3.2'
        title: 能力矩阵与架构差异化
        blocks:
          - type: paragraph
            body: >-
              Varda
              的主要技术优势在于把卫星运营与大气返回纵向整合。公司不依赖第三方返回舱或政府排期的货运飞行器，而是将自主轨道加工载荷与专有高超声速再入舱结合。舱体在轨进行无人微重力结晶，把改变后的多晶型晶格锁定在药物中，再执行自主脱轨点火。Rocket
              Lab 已制造 3 个 Pioneer 卫星平台，为 Varda 的 120-kilogram 舱体提供电力、通信、姿态控制和脱轨定位。继 2024 年 2 月在 Utah 降落、并通过 W-1 任务展示
              ritonavir 在轨结晶后，Varda 将运营扩展到多航天器任务。2026 年 10 月，公司搭乘单次 SpaceX Falcon 9 Transporter-18 发射，同时发射 W-8 和 W-9
              两个航天器。为降低太空飞行经济性风险，Varda 还运营大型地面结晶设施，配备自动反应器和制药超重力离心机，在轨道部署前模拟重力依赖性。
            claimRefs:
