  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与买方画像
        blocks:
          - type: paragraph
            body: >
              Varda Space Industries 采用双用途客户模式，用同一套航天器架构应对两条不同的商业需求曲线。公司资本约 80% 投向双用途轨道再入舱的系列化生产，20%
              用于专门的制药配方实验室。主要商业客户是希望突破地面结晶限制的大型制药和生物科技企业。对这些客户而言，微重力抑制浮力对流和沉降，带来新多晶型、更高生物利用度以及高价值疗法更好的稳定性。由于发射成本仍约为每千克
              $7,000，可寻址制药候选物严格限于超高价值小分子和生物制品，只有轻微配方改进也能显著延长专利生命周期时才值得采用。

              次要客户群包括政府国防和情报机构，具体为 U.S. Air Force Research Laboratory 和 NASA。这些国防与航空航天买方不必支付专用火箭发射费，而是把 Varda
              紧凑型再入飞行器用作低成本、可重复的 Mach 25
              大气再入试验台，用于高超声速传感器和热防护系统。客户分化带来运营协同：政府资助的测试飞行支撑硬件制造节奏和飞行经验，生物制药合作则提供高毛利知识产权许可和后续里程碑上行空间。
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU012
