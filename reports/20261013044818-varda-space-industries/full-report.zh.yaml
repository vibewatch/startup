              - CR016
      - number: '7.4'
        title: 财务风险敞口与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Varda 的媒体页面宣布 2026 年 9 月完成 $251 million D
              轮融资，用于扩大太空制药加工。已筹资金不等于可用现金，现有证据也未披露收入、毛利率、现金消耗、跑道、单任务经济性、保险覆盖，或政府与商业需求的分拆。因此，最重要的监测指标是运营和文件指标：许可证连续性、回收窗口执行、任务异常、药物结果重复性、把开发工作转为签约生产，以及下一项任务计划之前的资金跑道。如果
              Varda 失去可行再入机会、发生足以推翻可靠性假设的任务失败、无法证明跑道充足，或无法把技术证明转为可重复的商业需求，投资论点就会失效。
            claimRefs:
              - CR008
              - CR009
              - CR014
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 最高剩余风险敞口
            body: 监管协调与一体化任务执行的剩余风险最高：记录既有持续数月的许可延误，也有当前能力声明，但没有审批周期分布、异常率、任务损失率或独立验证的可靠性分母。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR016
          - type: callout
            title: 在评估规模化前完成尽调
            body: 在把更高节奏或商业制药生产计入估值前，应取得当前许可证矩阵、任务异常日志、供应商集中度时间表、客户合同瀑布表和董事会批准的现金计划。
            calloutType: recommendation
            claimRefs:
