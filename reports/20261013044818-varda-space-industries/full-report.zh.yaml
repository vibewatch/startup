chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营使命
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries 是一家总部位于加州 El
              Segundo、致力于商业化低地球轨道的航空航天与生物技术制造公司。公司设计、建造并运营自主航天器，把在轨材料加工与受控大气再入结合起来。Varda
              不依赖载人空间站，而是使用专用微重力舱，在轨加工高价值化合物，再将实体产品直接带回地球。低地球轨道的微重力环境会显著改变流体动力学，消除浮力驱动的对流、沉降和静水压力。这些物理特性使制药结晶实验能够获得更均匀的晶体尺寸分布、新型多晶型以及更优配方，用于小分子疗法。Varda
              在加州 El Segundo 设有主要工程、集成和制造基地，并在华盛顿特区设有办公室。截至 2026 年，公司约有 250 名员工，已完成 6 次轨道任务，并有延续至 2028 年的签约再入协议支撑持续飞行执行。
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO009
              - CO010
