        - 在 FAA 和国际靶场取得多年期发射与回收许可
      - - 资本结构与续航
        - 由 Lux Capital 和 Natural Capital 领投的 $251M Series D（累计融资 $598M）提供扩张资本
        - 航天器制造和 28 次已预订发射造成快速现金消耗，可能需要稀释性后续融资
        - 披露经审计的年度消耗率，以及每次任务的正单位贡献利润率
    notes: 结构化比较投资论点支柱与运营、监管和资本风险。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值逻辑
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 生物制药业务快速扩张；每年 10+ 次任务；United Therapeutics 商业化成功；高毛利的经常性药物处理
        - $3.0B–$4.5B 企业估值，依据是高端生物科技平台倍数和专有药物 IP 特许权使用费
        - 合作方项目取消，或 FDA 否决微重力药物成分
        - 20%
      - - 基准情景
        - 飞行频次稳定提升；国防和高超音速研究任务提供基础收入；2027 年 UT 飞行按计划发射
        - $1.4B–$1.8B 企业估值，支撑当前 $1.6B 的 Series D 估值标记
        - 轨道结晶收率不足，或发射进度推迟至 2028 年之后
        - 50%
      - - 悲观情景
        - 商业生物制药采用停滞；微重力配方优势可在地面复现；轨道资本开支耗尽 Series D 现金储备
        - $400M–$600M 企业估值，意味着下轮融资重组或硬件资产清算
        - 航天器回收失败、发射许可丧失，或无法拿下后续商业生物制药订单
        - 30%
    notes: 以 $1.6B Series D 估值、运营飞行清单和商业采用风险为校准依据的概率加权情景模型。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Varda Space Industries 2020 至 2026 年运营历史中的关键技术、飞行、融资和公司里程碑。
    approximationNotes: 日期反映公开的任务发射与着陆公告、风险融资公告及媒体披露。
    data:
      items:
        - date: 2021-01
          label: 公司成立
          detail: Will Bruey 和 Delian Asparouhov 在加利福尼亚州埃尔塞贡多注册成立 Varda Space Industries。
          tone: positive
        - date: 2021-09
          label: 早期风险融资
          detail: Varda 完成 $42.2M 早期股权融资，用于启动航天器工程和洁净室建设。
          tone: positive
        - date: 2023-06
          label: W-1 太空舱发射
          detail: Varda 搭载 SpaceX Transporter 拼车任务发射首个 W 系列太空舱，开展在轨 ritonavir 结晶。
          tone: positive
        - date: 2024-02
          label: W-1 历史性再入与回收
          detail: W-1 太空舱在轨运行八个月后降落犹他州，成功带回太空结晶 ritonavir。
          tone: positive
        - date: 2025-03
          label: W 系列澳大利亚再入
          detail: 第二个太空舱搭载高超音速传感器载荷，降落于南澳大利亚的 Koonibba Test Range。
          tone: positive
        - date: 2025-07
          label: Series C 融资
          detail: Varda 完成 $187M Series C 融资，累计募资约 $329M。
          tone: positive
        - date: 2026-05
          label: W-6 再入与 United Therapeutics 合作
          detail: W-6 太空舱在南澳大利亚返回，验证 Prometheus 导航；United Therapeutics 宣布肺部疾病合作。
          tone: positive
        - date: 2026-08
          label: 治理扩充
          detail: 前 Pfizer 全球研发总裁 Mikael Dolsten 加入董事会；公司飞行频次逐步迈向 2027 年。
          tone: positive
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO008
      - CO009
      - CO011
      - CO012
