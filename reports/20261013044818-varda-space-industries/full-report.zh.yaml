      - number: '3.3'
        title: 经济权衡、定价动态与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              轨道制药制造的商业采用受到高发射资本强度和地面经济性的双重约束。商业拼车飞行器把载荷送入低地球轨道的成本约为每千克
              $7,000，形成严苛经济筛选，只允许专门生物制品或重磅小分子等超高价值产品具备生产可行性。相比之下，地面药物配方改造商几乎没有物流负担，向生物制药客户收取开发费和个位数低比例的商业特许权使用费。Varda 于
              2026 年初完成 $251 million 的 D 轮融资，投后估值 $1.58 billion，累计资本超过 $570
              million，用于扩充生产机队并承担高额前置任务成本。然而，商业定价机制、载荷舱位预订费率和风险分担合同条款仍是私有商业秘密。制药发起方把 Varda
              当作实验性的生命周期管理工具，在数百万美元任务承诺与无需飞行保险或新监管许可的地面配方替代方案之间权衡。
            claimRefs:
              - CP006
              - CP007
