              不卖原始发射容量，而是把轨道合成、平台运营和地面返回打包成一体化生物制药服务。战略验证包括与 United Therapeutics 的活跃合作，以及任命前 Pfizer 全球研发负责人 Mikael
              Dolsten 加入董事会。对国防客户，Varda 将 Mach 25 再入轨迹定位为专用高超声速飞行测试的经济替代方案，后者传统上每次成本超过 $100
