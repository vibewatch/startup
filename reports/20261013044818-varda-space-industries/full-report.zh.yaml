            body: >
              公开客户证据集中于几项知名锚定关系。2026 年 5 月，Varda 披露与 United Therapeutics Corporation 的旗舰商业制药合作。根据协议，Varda 与 United
              Therapeutics 评估用于罕见肺动脉高压的小分子候选物，寻找可把医院静脉输注转为便捷皮下注射的新型晶体多晶型。合作下首次轨道飞行安排在 2027 年；如果首轮结晶产出有利，次年将进行微重力制造。但
              Varda 管理层承认，最早也要到 2030 年才可能向患者商业给药。

              在国防领域，已披露客户部署提供了严格的实证验证。Varda 第二次轨道任务为 Air Force Research Laboratory 搭载专用高速再入光谱仪，以及与 NASA Ames Research
              Center 合作开发的共形 C-PICA 热盾。舱体成功承受 Mach 25 再入热负荷，随后降落在 South Australia 的 Koonibba Test Range。这些机构部署证明 Varda
              能满足严格的军用和民用航天任务保障标准，验证舱体生存能力和快速地面回收。
            claimRefs:
