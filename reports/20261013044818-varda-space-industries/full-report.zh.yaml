              - CU013
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 双用途收入套利
            body: Varda 通过向军方和航空航天客户出售高速大气再入能力，解决太空硬件资本强度高的问题。这类国防试验台收入支撑持续的飞行器制造和飞行节奏，实际上为周期更长的商业生物制药活动提供基础设施资金。
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: 商业制药开发周期较长
            body: >-
              United Therapeutics 合作确认了生物制药需求，但投资者必须按较长时间线评估：2027 年开始飞行测试，2028 年开始制造，最早 2030
              年才能向患者给药。此外，尚无太空制造药物实现商业销售或获得监管批准。
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              再入许可是运营依赖，而非一次性准备事项。CNBC 报道称，W-1 在计划返回后仍在轨数月，因为必要的再入许可证尚未获批，并描述了 Varda、FAA
              商业航天办公室、空军靶场和空中交通部门之间反复协调的循环。Royco 后续报道称，Varda 获得了有效期至 2029 年的 Part 450
              飞行器运营许可证，这是一项重要缓解措施，但在本证据池中仍属于二手证据。现有证据无法说明当前完整许可证清单、续期条件、环境义务、出口管制、诉讼状态或药品审批路径。这些遗漏意味着，即使已完成多次返回，剩余监管风险敞口仍高。
            claimRefs:
              - CR001
              - CR002
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR015
              - CR016
      - number: '7.2'
        title: 任务、质量与规模化风险
        blocks:
          - type: paragraph
            body: >-
              当前运营证据强于单次演示：Varda 称已完成 6 次任务、签约超过 20 次至 2028 年的再入、在 2026 年 10
              月同时发射两艘飞行器，并在自有仓库端到端制造航天器。这些是节奏和集成信号，不是可靠性统计。Varda
              员工自身的叙述称，发货前最后一个月是最紧张的任务阶段之一，成功取决于软件、自动化、热系统和人员。Manufacturing Outlook 则单独描述了 W-1
              回收，以及飞行产生的振动、加速度、辐射和温度数据。在把更高节奏视为已证明的可重复性前，投资者仍需损失、异常、排期偏差、产出率和返回后质量数据。
            claimRefs:
              - CR003
