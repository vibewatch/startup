      - number: '1.2'
        title: 创始人、高管领导与治理
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries 于 2021 年 1 月由 Will Bruey 和 Delian Asparouhov 创立。CEO Will Bruey 此前在 SpaceX 工作 6 年，负责
              Dragon 航天器和 Falcon 9 运载火箭的硬件集成与任务运营。联合创始人 Delian Asparouhov 是 Founders Fund
              合伙人，为公司带来机构风险资本支持、战略网络和募资能力。创始团队把轨道硬件工程与硅谷风险投资架构结合起来，建立商业微重力制造领域。2026 年 8 月，Varda 任命 Mikael Dolsten
              为董事会成员，显著加强了生命科学治理。Dolsten 此前担任 Pfizer 全球研发与医学总裁 16 年，负责超过 36 种药物的临床推进和监管审批。这项任命显示，Varda
              正从轨道技术验证转向商业生物制药临床管线与制药合作伙伴整合。
            claimRefs:
              - CO002
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO011
      - number: '1.3'
        title: 资本化历史、投资者与披露状况
        blocks:
          - type: paragraph
            body: >-
              自 2021 年成立以来，Varda Space Industries 在 4 轮融资中累计获得约 $329 million 股权融资。公司于 2020 年末完成首轮 $9.0 million 种子轮，随后在
              2021 年 9 月完成 $42.2 million 风险投资轮，并于 2023 年末完成 $90 million 的 B 轮融资。2025 年 7 月，Varda 完成 $187 million 的 C
              轮融资，用于扩充轨道航天器机队和提升生产节奏。投资者包括 Founders Fund、Khosla Ventures、Lux Capital、Caffeinated Capital、General
              Catalyst 和 Also Capital 等知名风投机构。尽管股权基础可观，Varda 仍保持私有披露状态。C
              轮融资后的投后估值尚未披露，公司也未公布经审计收入、毛利率、任务单位经济性或净现金消耗。此外，商业企业登记信息中的历史实体日期相互冲突：Tracxn 记录的 1999 年注册早于 Varda 2021
              年的运营成立时间，凸显了私下尽调核验的必要性。
            claimRefs:
              - CO004
              - CO005
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
