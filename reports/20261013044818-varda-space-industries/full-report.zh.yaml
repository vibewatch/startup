              - CM011
              - CM012
      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              Varda
              的轨道配方能力面向两类主要商业客户：一级生物制药创新企业和国防空气热力学项目。在制药企业内部，目标买方属于企业研发、前配方科学和专利生命周期管理部门，而不是常规商业制造采购部门。采用需求通常来自严峻的配方难题，例如口服溶解度差、液体给药不稳定，或专利即将到期且新多晶型发现有望形成可执行的新物质专利。为降低采用门槛，Varda
              在 El Segundo 运营地面超重力筛选设施，配有分析离心机和结晶反应器（如 Crystal16 和 EasyMax），在把化合物送入轨道前实证降低分子重力依赖性风险。同时，Air Force
              Research Laboratory（AFRL）等国防机构把 Varda 再入舱用作再入传感器和热防护系统的高马赫数试验台，以非稀释性飞行资金支撑任务节奏。
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM011
              - CM013
      - number: '2.4'
        title: 采用驱动因素、再入监管与执行风险
        blocks:
          - type: paragraph
            body: >-
              轨道制造的商业扩张受发射成本结构性下降和监管路径拓展推动，但仍受严重技术与运营瓶颈约束。一个关键监管里程碑是 FAA 向 Varda 的 W 系列舱体授予加速 Part 450 飞行器运营许可证，有效期至
              2029 年；公司无需每次飞行都重新提交完整安全文件，即可反复进行大气再入。此外，Varda 与 United Therapeutics
              合作开发肺病疗法，也验证了生物制药市场的兴趣。然而，关键采用约束仍在：发射计划依赖商业拼车发射（主要是 SpaceX Falcon 9），生物制药开发需要多年临床测试，轨道事故还会带来灾难性载荷风险。Varda
              的 W-4 舱体在 2026 年 5 月未能脱离轨道并在大气中烧毁，凸显企业制药伙伴所要求的苛刻执行标准。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价值密度决定可行的轨道载荷类别
            body: 太空内制造必须拥有极高价值密度，才能消化拼车发射和舱体回收成本。商业配方中每克价值数十万美元的小分子药物多晶型，是近期唯一能够支撑独立轨道单位经济性的商业产品类别。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
          - type: callout
            title: 运营再入与许可瓶颈
            body: FAA Part 450 运营许可虽授予多年运营权限，但轨道制造仍易受脱轨子系统异常影响；2026 年 5 月 W-4 航天器在大气中烧毁，以及持续发生的拼车发射计划延误，都说明了这一点。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、空间站栖居舱与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries 的竞争格局包括三类：直接轨道制造初创公司、空间站研究设施和现有地面药物配方平台。在太空内制造领域，直接商业同行按产品领域高度分散。Redwire
              Corporation 在 International Space Station 上运营研究硬件和制造载荷，重点生产 ZBLAN 光纤并打印生物组织。相比之下，英国 Space Forge 正开发可重复使用的
              ForgeStar 舱体，用于加工半导体基底和先进合金。Varda 的差异化在于优先做制药结晶，瞄准高经济密度、足以覆盖轨道运输成本的小分子配方。与此同时，Axiom Space 和 Vast
              等相邻基础设施提供商正在建设面向人工值守实验室运营的商业空间站。尽管 NewSpace 势头强劲，Varda 最强的竞争对手仍是现状地面化学方案：Halozyme 和 MannKind
              等专业配方改造商用常规给药改造延长药物专利寿命，无需承担轨道成本和太空飞行执行风险。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
