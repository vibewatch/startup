  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现机制与商业牵引力
        blocks:
          - type: paragraph
            body: >-
              Varda Space Industries
              采用双轨商业模式，同时从生命科学药物开发和政府高超声速测试中获取价值。长期主要价值驱动来自微重力制药结晶。在低地球轨道，缺少浮力驱动的对流和沉降，使活性药物成分能够形成地面重力下无法工程化的独特晶体结构、多晶型和颗粒分布。Varda
              通过与生物制药发起方合作变现这一能力，合同包含前置载荷集成费、开发里程碑付款和后续配方特许权使用费。与此同时，公司向 Air Force Research Laboratory 和 NASA
              等需要高马赫数环境测试的国防与航空航天客户出售 W 系列大气再入舱的托管载荷空间，获得更近期的收入。公司称已完成 6 次轨道任务，并签约超过 20 次截至 2028 年的再入任务，且 2026 年 9 月获得
              $251 million D 轮融资支持。但商业药物可行性仍未经证明，目前药房货架上没有太空结晶药物在售。
