callouts:
  - calloutType: insight
    title: Vertical Integration as the Primary Architectural Moat
    body: While peers like Redwire rely on existing space stations with constrained return logistics, Varda's owned reentry vehicle and end-to-end mission profile provide autonomous operational cadence and proprietary mission scheduling.
