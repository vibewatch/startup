      - CP004
      - CP005
  - calloutType: risk
    title: Terrestrial Substitution and Regulatory Friction
    body: The greatest competitive threat to Varda is not another orbital startup, but status-quo Earth-based formulation technologies like Halozyme that deliver proven patient outcomes without spaceflight costs or unproven FDA regulatory pathways.
