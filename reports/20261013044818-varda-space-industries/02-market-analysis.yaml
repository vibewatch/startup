callouts:
  - calloutType: "insight"
    title: "Value Density Dictates Viable Orbital Payload Classes"
    body: "In-space manufacturing requires astronomical value density to absorb rideshare and capsule recovery costs. Small-molecule pharmaceutical polymorphs, which command hundreds of thousands of dollars per gram in commercial formulations, represent the only commercial product class capable of sustaining standalone orbital unit economics in the near term."
    claimRefs:
      - "CM003"
      - "CM006"
  - calloutType: "risk"
    title: "Operational Reentry and Licensing Bottlenecks"
    body: "While FAA Part 450 operator licensing grants multi-year operational permissions, orbital manufacturing remains vulnerable to deorbit subsystem anomalies, as evidenced by the W-4 spacecraft atmospheric burn-up in May 2026, and persistent launch rideshare schedule slips."
    claimRefs:
      - "CM009"
      - "CM010"
