  topStrengths:
    - Six completed orbital missions and more than 20 contracted reentries show real execution depth.
    - A reported $251 million Series D provides substantial runway to keep scaling the platform.
    - The dual-use model spans pharmaceutical crystallization and defense/hypersonic test demand.
  topRisks:
    - Private financials, gross margin, and burn data remain undisclosed.
