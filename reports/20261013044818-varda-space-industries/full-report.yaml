      - number: '4.3'
        title: Cost Architecture, Unit Economics, and Operational Efficiency
        blocks:
          - type: paragraph
            body: >-
              The company's cost structure is governed by spacecraft hardware procurement, rideshare launch access, El
              Segundo manufacturing overhead, and complex recovery operations. Varda contracts with Rocket Lab for
              customized Pioneer spacecraft buses that supply essential orbital electrical power, telecommunications,
              propulsion, and attitude orientation. Reentry payloads are launched aboard SpaceX Falcon 9 Transporter
              missions, allowing Varda to benefit from commercial rideshare launch pricing rather than funding dedicated
              launch vehicles. Spacecraft integration and capsule production are performed end-to-end within Varda's
              industrial warehouse facility in El Segundo, California. Operating expenditures have expanded alongside
              headcount, which reached approximately 250 employees in late 2026 from 212 earlier in the year. Historic
              operations also exposed operational friction: the maiden W-1 spacecraft spent eight months in orbit after
              scheduling conflicts at the military Utah Test and Training Range bumped planned recovery dates and
              stalled FAA Part 450 approvals. While Varda subsequently secured an operator license and diversified
              landing operations to Australia's Koonibba Test Range, true per-mission unit gross margins remain
              undisclosed.
            claimRefs:
              - CI005
              - CI007
              - CI008
