              - CU011
      - number: '6.3'
        title: Named Customer Deployments and Validation Proof
        blocks:
          - type: paragraph
            body: >
              Public customer proof is concentrated among high-profile anchor relationships. In May 2026, Varda
              disclosed its flagship commercial pharmaceutical collaboration with United Therapeutics Corporation. Under
              this agreement, Varda and United Therapeutics evaluate small molecule candidates for rare pulmonary
              arterial hypertension, seeking to identify novel crystalline polymorphs that can transform intravenous
              hospital infusions into convenient subcutaneous injections. The first orbital flight under this
              partnership is scheduled for 2027, with microgravity manufacturing intended for the subsequent year if
              initial crystallization yields prove favorable. However, Varda leadership acknowledges that commercial
              administration to patients is not anticipated before 2030 at earliest.


              In the defense sector, named customer deployments provide rigorous empirical verification. Varda's second
              orbital mission hosted a specialized high-speed reentry spectrometer for the Air Force Research Laboratory
              alongside a conformal C-PICA heat shield developed in partnership with NASA Ames Research Center. The
              capsule successfully withstood Mach 25 reentry heating before landing at the Koonibba Test Range in South
              Australia. These institutional deployments demonstrate that Varda can satisfy stringent military and civil
              space mission assurance standards, validating capsule survival and rapid terrestrial recovery.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
