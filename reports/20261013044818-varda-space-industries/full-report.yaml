  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Structured customer adoption journey from terrestrial hypergravity screening to orbital manufacturing and clinical
      licensing.
    data:
      items:
        - label: 1. Terrestrial Target Evaluation
          touchpoints:
            - Biopharma client evaluates high-value drug molecules where formulation improvements extend patent life
            - Initial screening of physical solubility, bioavailability limitations, and delivery requirements
        - label: 2. Ground Hypergravity Centrifuge Screening
          touchpoints:
            - Testing candidate compounds in Varda terrestrial hypergravity laboratory across multiple gravity levels
            - Empirical validation that nucleation and crystal size distribution respond to altered gravitational forces
        - label: 3. Orbital Mission Cassette Integration
          touchpoints:
            - Formulation recipe programmed into automated, hermetically sealed microgravity crystallization hardware
            - Spacecraft integration onto SpaceX Transporter rideshare with Rocket Lab Pioneer satellite bus
        - label: 4. Autonomous In-Orbit Processing
          touchpoints:
            - Autonomous microgravity crystallization execution in low Earth orbit without human intervention
            - Suppression of buoyancy-driven convection and sedimentation yields uniform, ordered crystal structures
        - label: 5. Reentry & Rapid Terrestrial Recovery
          touchpoints:
            - Pioneer bus maneuvers capsule into precise deorbit trajectory; C-PICA shield survives Mach 25 heating
            - Parachute landing in Koonibba (Australia) or Utah range with rapid cold-chain sample recovery
        - label: 6. Analytical Characterization & Licensing
          touchpoints:
            - Comprehensive solid-state characterization (XRPD, DSC) to confirm novel polymorph structure and stability
            - Co-filing enabling patents and structuring commercial manufacturing campaigns with downstream royalties
    approximationNotes: >-
      Customer journey stages synthesized from Varda technical publications, official biopharma filings, and executive
      interviews as of 2026.
