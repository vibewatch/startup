              - CE008
          - type: callout
            title: Launch Costs and Regulatory Clearances Bound Scaled Unit Economics
            body: >-
              Despite flight-proven thermal protection and capsule automation, Varda remains constrained by
              approximately $7,000 per kilogram launch economics, reliance on SpaceX rideshare manifests, and complex
              inter-agency regulatory licensing for overland deorbit corridors, which could create multi-week
              operational holding delays.
            calloutType: risk
            claimRefs:
