              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Reentry permission is an operating dependency rather than a one-time setup item. CNBC reported that W-1
              remained in orbit for months after its planned return because the necessary reentry license had not been
              granted, and described a recurring coordination loop among Varda, the FAA commercial-space office, the Air
              Force range, and air-traffic authorities. A later Royco profile reports that Varda obtained a Part 450
              vehicle-operator license valid through 2029, which is a meaningful mitigation but comes from secondary
              evidence in this pool. The assigned evidence does not establish the complete current license inventory,
              renewal conditions, environmental obligations, export controls, litigation status, or pharmaceutical
              approval path. Those omissions keep residual regulatory exposure high even after demonstrated returns.
            claimRefs:
