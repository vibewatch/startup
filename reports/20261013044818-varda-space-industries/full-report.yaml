      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demonstrated Autonomous Reentry and Multi-Vehicle Fleet Cadence
            body: >-
              Varda has successfully demonstrated full-cycle orbital manufacturing and autonomous hypersonic reentry
              across six completed capsule missions, advancing from individual demonstration flights to simultaneous
              multi-vehicle operations with the concurrent launch of W-8 and W-9 aboard SpaceX Transporter-18.
            calloutType: strength
            claimRefs:
              - CE001
