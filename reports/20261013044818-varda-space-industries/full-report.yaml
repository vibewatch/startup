        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual exposure
            body: >-
              Regulatory coordination and integrated mission execution rank highest because the record contains a
              months-long licensing delay and current capability claims, but no approval-cycle distribution, anomaly
              rate, mission-loss rate, or independently verified reliability denominator.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR016
          - type: callout
            title: Diligence before underwriting scale
            body: >-
              Require the current license matrix, mission anomaly log, supplier concentration schedule, customer
              contract waterfall, and a board-approved cash plan before assigning value to higher cadence or commercial
              pharmaceutical production.
            calloutType: recommendation
            claimRefs:
              - CR014
