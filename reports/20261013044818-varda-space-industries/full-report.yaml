  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis (Bull/Core)
      - Anti-Thesis (Downside Risk)
      - What Would Change the View
    rows:
      - - Flight Cadence & Heritage
        - 6 missions flown with 5 successful recoveries validate autonomous reentry operations
        - W-4 maiden flight of in-house satellite bus ended in deorbit disposal burn rather than landing
        - Consecutive anomaly-free recovery landings using vertically integrated in-house bus
      - - Microgravity Formulation
        - Microgravity suppresses convection and sedimentation, enabling novel ritonavir and nirmatrelvir polymorphs
        - Biopharma sponsors have not proved commercial drug batches justify orbital capex vs ground synthesis
        - Clinical bioequivalence and bioavailability superiority validated in named customer drug candidate
      - - Commercial Traction
        - United Therapeutics partnership signed in May 2026 targets first customer drug flight in 2027
        - Varda is pre-revenue in commercial biopharma processing with undefined FDA regulatory review pathways
        - FDA clearance of space-manufactured investigational drug and binding commercial supply agreement
      - - Manufacturing Infrastructure
        - Rocket Lab Pioneer spacecraft bus heritage and transition to proprietary vertically integrated bus
        - Dependence on commercial launch providers like SpaceX for rideshare launch manifest access
        - Secured multi-year launch and recovery licensing across FAA and international ranges
      - - Capitalization & Runway
        - $251M Series D led by Lux Capital and Natural Capital ($598M total raised) provides expansion capital
        - Rapid cash burn from spacecraft fabrication and 28 booked launches could necessitate dilutive follow-on
        - Disclosure of audited annual burn rate and positive unit contribution margins per mission
    notes: Structured comparison of investment thesis pillars against operating, regulatory, and capital risks.
