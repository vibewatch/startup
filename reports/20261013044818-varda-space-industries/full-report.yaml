              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Use Revenue Arbitrage
            body: >-
              Varda's operational model addresses the high capital intensity of space hardware by selling high-speed
              atmospheric reentry capacity to military and aerospace customers. This defense testbed revenue supports
              recurring vehicle manufacturing and flight cadence, effectively underwriting the infrastructure required
              for longer-cycle commercial biopharma campaigns.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: Extended Commercial Pharma Development Horizon
            body: >-
              While the United Therapeutics collaboration confirms biopharma demand, investors must underwrite an
              extended timeline: flight testing begins in 2027, manufacturing follows in 2028, and patient
              administration is not anticipated before 2030 at earliest. Furthermore, no space-manufactured drug has
              ever achieved commercial sales or regulatory approval.
            calloutType: risk
            claimRefs:
              - CU001
