          tone: positive
        - date: 2025-07
          label: Series C Financing
          detail: Varda closes $187M Series C funding round, bringing total capital raised to roughly $329M.
          tone: positive
        - date: 2026-05
          label: W-6 Reentry & United Therapeutics Deal
