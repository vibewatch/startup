              - CE014
      - number: '5.4'
        title: Critical Dependencies, Economic Constraints, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Despite demonstrated flight heritage and increasing launch frequency, Varda's operating model faces
              structural economic, technical, and regulatory risks. Primary launch economics remain tethered to
              commercial rideshare pricing of approximately $7,000 per kilogram, restricting economically viable
              manufacturing candidates to ultra-high-value therapeutics where milligram-to-gram yields justify orbital
              delivery costs. Mission schedules depend entirely on SpaceX rideshare manifests and Rocket Lab bus
              production timelines, introducing third-party supply chain and launch schedule risks. Furthermore,
              executing deorbit maneuvers requires coordinated overland reentry authorizations from the Federal Aviation
              Administration under Part 450 regulations, the U.S. Space Force, and international range operators like
              Southern Launch at the Koonibba Test Range. Regulatory clearance delays can strand vehicles in orbit,
              increasing vehicle degradation risks before pharmaceutical payloads can be recovered.
            claimRefs:
              - CE003
              - CE007
              - CE011
              - CE012
              - CE013
              - CE014
