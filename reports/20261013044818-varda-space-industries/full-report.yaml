  - id: FE001
    title: Varda Integrated Space Factory Architectural Stack
    type: stack
    summary: End-to-end hardware, software, and operational layers supporting in-orbit manufacturing and hypersonic reentry.
    data:
      layers:
        - label: Terrestrial Preparation & Screening Layer
          detail: Candidate formulation screening and gravity-dependent kinetics modeling
          modules:
            - Mettler Toledo EasyMax reactors
            - Technobis Crystal16 system
            - Benchtop high-g centrifuge
        - label: Launch & Orbital Insertion Layer
          detail: Spacecraft integration and rideshare delivery to low Earth orbit
          modules:
            - SpaceX Falcon 9 rideshare adapter
            - Transporter launch mission integration
            - Orbital separation sequencer
        - label: Orbital Bus & Service Layer
          detail: Power generation, communications, attitude control, and deorbit propulsion
          modules:
            - Rocket Lab Pioneer spacecraft bus
            - Deployable solar array wings
            - Hydrazine reaction control thrusters
        - label: In-Orbit Microgravity Processing Layer
          detail: Automated pharmaceutical crystallization and reaction monitoring
          modules:
            - Hermetic crystal growth chamber
            - Thermal control and heating loops
            - In-situ process Raman and optical sensors
        - label: Hypersonic Atmospheric Reentry Layer
          detail: Autonomous deorbit trajectory execution and thermal protection
          modules:
            - 120 kg conical reentry capsule
            - Carbon-phenolic ablative heatshield
            - Cold gas attitude thrusters
        - label: Recovery & Terrestrial Analytical Layer
          detail: Overland touchdown, payload retrieval, and laboratory characterization
          modules:
            - Supersonic drogue and main parachutes
            - Southern Launch recovery team (Koonibba)
            - SCXRD, XRPD, and NMR analytical suite
    approximationNotes: Layer breakdown categorizes integrated flight systems across launch, bus, payload, and ground segments.
    claimRefs:
