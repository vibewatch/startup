      - number: '5.3'
        title: Flight Cadence, Dual-Use Payloads, and Reentry Recovery
        blocks:
          - type: paragraph
            body: >-
              Varda has demonstrated end-to-end mission execution across six completed orbital flights, progressing from
              single experimental vehicles to concurrent multi-spacecraft fleet operations. In October 2026, the company
              achieved a critical operational milestone by launching its W-8 and W-9 spacecraft simultaneously aboard a
              SpaceX Falcon 9 Transporter-18 rideshare mission from Vandenberg Space Force Base, managing both
              spacecraft concurrently from its El Segundo mission control center. Alongside pharmaceutical processing,
              Varda has established a dual-use flight testbed model by carrying commercial and defense payloads through
              atmospheric entry. The W-8 and W-9 vehicles hosted instrumented hypersonic flight experiments, including
              Canopy Aerospace fiber-optic thermal protection sensors and Air Force Research Laboratory instrumentation,
              proving commercial utility across life sciences and defense sectors.
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
