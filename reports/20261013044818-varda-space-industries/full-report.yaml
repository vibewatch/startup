      - number: '7.3'
        title: Partner, Customer, and Commercialization Dependencies
        blocks:
          - type: paragraph
            body: >-
              Varda's risk stack crosses launch access, range coordination, government demand, biopharma development,
              and scarce technical labor. Not Boring disclosed that its investment arm was a Varda investor, so its
              account is treated as partner-aligned rather than independent; historically, it said Varda bought launch
              capacity and Rocket Lab satellite buses, was executing more than $60 million of DoD programs, and faced
              the familiar deep-tech combination of technical risk, slow buyers, specialized hiring, and cash-intensive
              R&D. Varda now claims end-to-end spacecraft production, suggesting reduced bus dependency, but the
              assigned sources do not provide a current supplier map or customer concentration schedule. The biopharma
              workflow is concrete, yet commercial contract economics and scaled customer outcomes remain private.
