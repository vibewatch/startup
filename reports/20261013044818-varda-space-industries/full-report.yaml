          label: Early Venture Funding
          detail: Varda secures $42.2M early equity funding round to initiate spacecraft engineering and cleanroom buildout.
          tone: positive
        - date: 2023-06
          label: W-1 Capsule Launch
          detail: >-
            Varda launches its first W-Series capsule on a SpaceX Transporter rideshare to perform in-space ritonavir
            crystallization.
          tone: positive
        - date: 2024-02
          label: Historic W-1 Reentry & Recovery
          detail: W-1 capsule lands in Utah after eight months in orbit, successfully returning space-crystallized ritonavir.
          tone: positive
        - date: 2025-03
          label: W-Series Australian Reentry
