      - number: '7.4'
        title: Financial Exposure and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Varda's media page announced a $251 million Series D in September 2026 to scale space-based pharmaceutical
              processing. Funding raised is not cash available, and the assigned evidence does not disclose revenue,
              gross margin, burn, runway, per-mission economics, insurance coverage, or the split between government and
              commercial demand. The most important monitoring indicators are therefore operational and documentary:
              license continuity, recovery-window execution, mission anomalies, repeat pharmaceutical outcomes,
              conversion of development work into contracted production, and funded runway through the next mission
              plan. The thesis breaks if Varda loses viable reentry access, suffers a mission failure that invalidates
              reliability assumptions, cannot evidence adequate runway, or fails to convert technical proof into repeat
              commercial demand.
            claimRefs:
              - CR008
              - CR009
