      - number: '7.2'
        title: Mission, Quality, and Scale-Up Risk
        blocks:
          - type: paragraph
            body: >-
              The current operating evidence is stronger than a single demonstration: Varda says it has completed six
              missions, contracted more than 20 reentries through 2028, launched two vehicles together in October 2026,
              and builds the spacecraft end-to-end in its warehouse. Those are useful cadence and integration signals,
              not reliability statistics. Varda's own employee account calls the final month before shipment one of the
              most demanding mission phases and says success depends on software, automation, thermal systems, and
              people. Manufacturing Outlook separately describes W-1's recovery and the vibration, acceleration,
              radiation, and temperature data generated by flight. Investors still need loss, anomaly,
              schedule-variance, yield, and post-return quality data before treating higher cadence as proven
              repeatability.
