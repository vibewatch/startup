        - >-
          Rapid biopharma expansion; 10+ annual missions; United Therapeutics commercialization success; high-margin
          recurring drug processing
        - $3.0B–$4.5B enterprise valuation based on premium biotech platform multiples and proprietary drug IP royalties
        - Partner program cancellation or FDA regulatory rejection of microgravity drug substances
        - 20%
      - - Base Case
        - >-
          Steady flight cadence scaling; defense and hypersonic research missions provide baseline revenue; 2027 UT
          flight launches on schedule
        - $1.4B–$1.8B enterprise valuation, supporting the current $1.6B Series D valuation mark
        - Orbital crystallization yield shortfall or launch schedule slippage beyond 2028
        - 50%
      - - Bear Case
        - >-
          Commercial biopharma adoption stalls; microgravity formulation benefits replicate terrestrially; orbital capex
          drains Series D cash reserves
        - $400M–$600M enterprise valuation, representing down-round recapitalization or hardware asset liquidation
        - Spacecraft recovery failure, loss of launch license, or failure to secure commercial biopharma follow-ons
        - 30%
