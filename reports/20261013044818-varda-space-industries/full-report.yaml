              - CU006
              - CU014
      - number: '6.4'
        title: Customer Journey and Commercial Expansion Dynamics
        blocks:
          - type: paragraph
            body: >
              The customer adoption journey spans a structured five-stage funnel spanning ground screening, orbital
              processing, and long-term licensing. To de-risk expensive spaceflights, Varda conducts terrestrial
              hypergravity screening in ground centrifuges, testing client molecules under elevated gravitational forces
              to verify that nucleation kinetics and crystal growth are indeed gravity-dependent before booking orbital
              mass. Once validated, payloads are integrated into automated microgravity crystallization cassettes and
              launched on commercial rideshare missions.


              Following orbital crystallization, the capsule reenters Earth's atmosphere at Mach 25 and returns intact
              payload samples to client laboratories for full solid-state characterization. The expansion model relies
              on intellectual property co-ownership: Varda captures upfront mission integration fees while negotiating
              milestone payments and patent royalties on resulting commercial formulations. Nevertheless, significant
              diligence risks persist: actual commercial terms, milestone triggers, and partner revenue commitments
              remain private, and no drug manufactured in space has yet received regulatory marketing approval or
              achieved commercial sale.
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU010
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
