  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >
              Varda Space Industries pursues a dual-use customer model designed to address two distinct commercial
              demand curves with a shared spacecraft architecture. Approximately 80% of corporate capital is directed
              toward the series production of dual-use orbital reentry capsules, while 20% supports the dedicated
              pharmaceutical formulation laboratory. The primary commercial segment consists of large pharmaceutical and
              biotechnology corporations seeking to overcome terrestrial crystallization limits. For these customers,
              microgravity suppresses buoyancy-driven convection and sedimentation, unlocking novel polymorphs, improved
              bioavailability, and enhanced stability for high-value therapeutics. Because launch costs remain roughly
              $7,000 per kilogram, addressable pharmaceutical candidates are strictly limited to ultra-high-value small
              molecules and biologics where minor formulation improvements generate substantial patent life-cycle
              extension.


              The secondary customer segment encompasses government defense and intelligence agencies, specifically the
              U.S. Air Force Research Laboratory and NASA. Rather than paying dedicated rocket launch fees, these
              defense and aerospace buyers utilize Varda's compact reentry vehicle as a low-cost, recurring Mach 25
              atmospheric reentry testbed for hypersonic sensors and thermal protection systems. This customer
              bifurcation creates operational synergy: government-funded test flights underwrite hardware manufacturing
              cadence and flight heritage, while biopharma collaborations provide high-margin intellectual property
              licensing and downstream milestone upside.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU012
      - number: '6.2'
        title: Adoption Trajectory and Mission Cadence
        blocks:
          - type: paragraph
            body: >
              Varda's commercial adoption trajectory is anchored in rapid operational cadence rather than high account
              count. The company has executed six orbital spaceflights to date and claims more than 20 vehicle reentries
              contracted through 2028 across government and commercial accounts. Commercial space manufacturing has
              historically stalled aboard the International Space Station due to constrained flight frequency, manual
              crew oversight requirements, and long retrieval cycles. Varda bypasses these bottlenecks through
              end-to-end automation, booking secondary payload slots on SpaceX Falcon 9 Transporter rideshare launches
              and integrating with Rocket Lab's Pioneer spacecraft bus for orbital propulsion, power, and deorbit
              maneuvering.


              A significant operational milestone occurred in October 2026, when Varda launched two W-series capsules on
              the same rocket simultaneously, transitioning from sporadic demonstration flights into multi-vehicle
              parallel mission operations. This flight cadence expansion is essential to customer retention: biopharma
              drug discovery requires predictable multi-mission campaigns to iterate formulation screening, crystallize
              lead candidates, and return physical materials for terrestrial analysis within standard pharmaceutical
              development timelines.
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
          - type: table
            tableRef: TU002
