      - number: '4.2'
        title: Pricing Structure, Go-to-Market Motion, and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              Varda's go-to-market architecture diverges sharply from traditional space infrastructure providers by
              engaging enterprise pharmaceutical innovators alongside defense research procurement offices. On the
              life-sciences front, Varda targets high-value small molecules and complex biologics where formulation
              patent extensions or enhanced bioavailability can justify orbital manufacturing economics. Rather than
              selling raw launch capacity, Varda packages turnkey orbital synthesis, bus operations, and terrestrial
              return as an integrated biopharma service. Strategic validation includes an active collaboration with
              United Therapeutics and the appointment of former Pfizer worldwide research head Mikael Dolsten to Varda's
              board of directors. For defense customers, Varda positions its Mach 25 reentry trajectory as an economical
              alternative to dedicated hypersonic flight tests that traditionally cost upwards of $100 million each.
              Nevertheless, realized commercial pricing, customer contract sizes, milestone payment vesting schedules,
              and net realization rates remain closely guarded private data, presenting an informational hurdle for
              underwriting commercial sales efficiency.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
