company:
  name: Moneyview
chapter:
  number: 8
  title: Valuation
  summary: >-
    Moneyview has enough scale, product breadth, and post-listing demand to stay investable
    on the watchlist, but the public evidence still supports a price-sensitive track call
    rather than a buy. The October 2026 listing premium moved the company from a ₹6,000 crore
    IPO-band story to roughly ₹9,789 crore opening-day value while unsecured-credit asset-quality
    and regulatory durability questions remain open.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The public tape supports a **track** recommendation with **medium** confidence, a
      **high** risk rating, and a **fair** valuation stance rather than a cheap one.
      Moneyview did clear the market: the IPO combined a fresh issue and offer for sale,
      the book was heavily subscribed, and the stock opened well above the ₹34 issue
      price. But that same first-day move also means an investor is no longer underwriting
      the ₹6,000 crore IPO-band value alone; the entry point quickly shifted toward an
      opening market value near ₹9,789 crore. At that level, the market is already paying
      for strong FY26 and Q1 FY27 momentum while still relying on unsecured-credit loss
      performance, regulatory stability, and cleaner post-listing disclosure to prove
      that current profitability is durable.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV009, CV010, CV011]
    tableRefs: [TV001]
  - id: watchlist-positives
    title: Why the name stays on the watchlist
    body: >-
      Moneyview still earns watchlist attention because scale and breadth are real. The
      company reported managed AUM of ₹22,520 crore by June 30, 2026, FY26 revenue of
      ₹3,351 crore, and annualized Q1 FY27 return on equity near 29.92%, while its own
      channels present a broad consumer-finance app spanning loans, cards, UPI, insurance,
      and investment. Distribution proof also matters: the website claims 12 crore+ users
      and 18,400+ pincodes served, and DigitalLending.in tracks 11 regulated lending
      partners. That combination makes it plausible that Moneyview can keep monetizing
      more than one credit product, but the investment case still depends on proving that
      partner breadth and user scale convert into durable, cleanly disclosed cash earnings
      after listing.
    claimRefs: [CV006, CV007, CV008, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: valuation-context-and-scenarios
    title: Valuation context and scenarios
    body: >-
      Valuation support exists, but it is not one-sided. At the IPO band, IndianWeb2 put
      implied post-issue market capitalization at ₹6,000 crore, and ET Intelligence cited
      a 1.9x post-IPO price-to-book multiple versus 2.9x for OnEMI Technology Solutions.
      That comparison argues the offer was not stretched on book value alone. However, the
      market did not stop at the offer band: Seedtable records a first-day opening value
      near ₹9,788.6 crore, so secondary buyers immediately paid up for momentum. The
      positive version of that story is that stronger Q1 FY27 profitability and deep book
      demand can justify a rerating; the skeptical version is that the rerating already
      capitalizes a lot of execution before the market has seen several post-listing
      quarters of unsecured-loan losses, partner-vintage performance, and cleaner
      disclosure around overhang and capital deployment.
    claimRefs: [CV003, CV004, CV005, CV007, CV008, CV009, CV010, CV011, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: >-
      The price-sensitive conclusion is straightforward: stay engaged, but do not underwrite
      a more aggressive entry multiple until three items are clearer. First, investors need
      the final post-listing capital-structure picture, including whether the March 2026
      DRHP's optional pre-IPO placement or later selling-shareholder dynamics changed the
      true overhang. Second, the post-listing quarters need to show that rising FY26 GNPA
      and impairment do not keep expanding as the unsecured book scales. Third, the market
      needs better disclosure on partner-cohort durability, repeat-borrow quality, and how
      much of the broad app footprint actually converts into profitable, resilient lending
      economics. A thesis break would be sustained credit-cost deterioration, tighter
      unsecured-lending rules that slow growth, or evidence that the first-day premium
      outran the company's ability to compound book value and earnings.
    claimRefs: [CV001, CV002, CV009, CV010, CV012, CV013]
