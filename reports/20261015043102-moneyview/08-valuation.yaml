    notes: "Combines IPO-band pricing, first-day trading, public operating metrics, and disclosed risk signals as of the 2026-10-15 run date."
    claimRefs: [CV003, CV004, CV005, CV009, CV010, CV011]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Why it matters
      - What would change the view
    rows:
      - ["Thesis: managed AUM and revenue are already large", "₹22,520 crore managed AUM and ₹3,351 crore FY26 revenue suggest real scale, not a concept stock.", "Multiple post-listing quarters with stable or improving credit costs would strengthen conviction."]
      - ["Thesis: distribution is broad", "Moneyview cites 12 crore+ users and 18,400+ pincodes served, which supports top-of-funnel depth.", "Evidence that a larger share of those users monetizes profitably would improve the call."]
      - ["Thesis: partner network widens supply", "DigitalLending.in tracks 11 regulated lending partners, reducing dependence on a single originator.", "Partner-level vintage, renewal, and economics disclosure would make that diversification more investable."]
      - ["Anti-thesis: asset quality has worsened", "ET Intelligence says GNPA rose to 2.7% in FY26 from 0.9% in FY24.", "A visible return toward better loss trends would weaken the bearish case."]
      - ["Anti-thesis: profitability quality still needs testing", "Impairment rose to 28.9% of total income in FY26, so earnings durability is still the core debate.", "Two or more public quarters of strong earnings without another credit-cost step-up would help."]
      - ["Anti-thesis: the market already rerated the stock", "The stock opened near ₹9,788.6 crore of value versus ₹6,000 crore at the top of the IPO band.", "A lower entry price or materially better disclosed fundamentals would create a better risk-reward setup."]
    notes: "Rows pair positive scale/distribution signals against the public adverse evidence that still keeps the stance at track."
    claimRefs: [CV003, CV004, CV006, CV007, CV009, CV010, CV012, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Q1 FY27 profitability persists, credit costs stabilize, and the market rewards Moneyview as a scaled, multi-product digital lender.", "The first-day premium proves sustainable and the opening valuation can compound from a stronger earnings base.", "Unsecured-loss normalization fails to improve or regulation tightens.", "Would require clean quarterly disclosure and no further asset-quality slippage."]
      - ["Base", "Growth remains good, but investors keep balancing operating momentum against unsecured-credit volatility.", "The current valuation looks fair: not obviously expensive versus the IPO band, but not an easy bargain after the listing pop.", "Moderate impairment pressure and incomplete overhang disclosure cap upside.", "Best fit with today's mixed evidence."]
      - ["Bear", "GNPA, impairment, or regulatory friction worsen while the first-day rerating proves too optimistic.", "The opening premium compresses because book value and earnings do not catch up fast enough.", "Partner-vintage stress, weaker repeat borrowing, or a harsher unsecured-lending regime.", "Most likely if post-listing quarters disappoint on credit durability."]
    notes: "Scenarios use qualitative valuation logic because public evidence is still too thin to support a precise target multiple or return model."
    claimRefs: [CV003, CV004, CV007, CV008, CV009, CV010, CV011]
