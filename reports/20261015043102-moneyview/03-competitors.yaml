company:
  name: "Moneyview"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Moneyview competes with digital lenders such as Navi, Fibe, KreditBee and
    OnEMI, while banks, diversified NBFCs and large financial platforms remain
    credible adjacent entrants. Its hybrid LSP-plus-NBFC model, broad consumer
    product surface and internally developed lending stack create operating
    differentiation, but public evidence does not establish superior underwriting
    outcomes or durable user lock-in, and its expanding DLG exposure runs against
    the co-lending direction reported for several peers.
sections:
  - id: "competitive-set"
    title: "The competitive set extends beyond loan apps"
    body: >-
      Moneyview's direct comparison set includes app-led lenders such as Navi,
      Fibe and KreditBee, but the buyer's alternatives are broader than those
      brands. Diversified NBFCs such as InCred, banks and large platforms such as
      Paytm can combine funding, distribution and regulatory infrastructure;
      Bajaj Finance and Jio Financial are also identified as incumbent threats by
      one analyst source. Status-quo alternatives include borrowing from a bank
      directly, using an incumbent's digital channel, postponing the purchase or
      relying on informal credit. A regulated lender can also build acquisition,
      underwriting and servicing internally rather than use an LSP. Public
      competitor disclosure is uneven: the retained evidence gives useful model
      categories and directional comparisons, but not consistent funding, AUM,
      customer, price or loss metrics across the entire set. The profile table
      therefore marks unavailable fields instead of turning unlike metrics into
      a ranking.
    claimRefs: ["CP001", "CP002", "CP007", "CP008", "CP009", "CP010", "CP014"]
    tableRefs: ["TP001"]
  - id: "differentiation-and-distribution"
    title: "Differentiation sits in orchestration, data and funding access"
    body: >-
      Moneyview's clearest operating distinction is the combination of a
      company-built technology stack, a large consumer funnel, multiple regulated
      lending partners and its own NBFC. The retained DRHP-based analysis reports
      more than 200,000 applications per day, offers in about five seconds and
      22 regulated personal-loan partners as of December 2025. Those capabilities
      can reduce integration friction and give Moneyview more routing choices than
      a single-balance-sheet lender. They do not by themselves prove better credit
      selection, lower acquisition cost or stronger retention than peers.
      Multi-homing remains plausible on both sides: consumers can compare several
      apps, while banks and NBFCs can work with multiple LSPs or build internally.
      Switching cost is therefore more operational than contractual, arising from
      accumulated repayment data, configured lender integrations and servicing
      workflows rather than demonstrated customer lock-in. The capability matrix
      separates disclosed evidence from unknown competitor cells.
    claimRefs: ["CP003", "CP004", "CP005", "CP006", "CP007", "CP015"]
    tableRefs: ["TP002"]
  - id: "durability-and-displacement"
    title: "The DLG strategy is both a scale lever and an exposed flank"
    body: >-
      Moneyview is increasing DLG-backed lending while Mint reports that Paytm
      retreated from DLG and Fibe, KreditBee and Kissht have increased co-lending
      activity. This divergence can support faster partner-funded scale, but it
      also concentrates regulatory and economic sensitivity in a structure peers
      are reducing. Moneyview's DLG disbursements rose from ₹8,848 crore in FY24
      to ₹11,282 crore in FY25, while DLG expense rose from ₹131 crore to ₹321
      crore. Separately, Economic Times reported that Moneyview's GNPA increased
      from 0.9% in FY24 to 2.7% in FY26, whereas OnEMI's GNPA improved to 2.3% in
      the June 2026 quarter from 3.6% a year earlier. These periods and companies
      are not directly comparable, but the direction weakens any claim that scale
      alone is a durable moat. Comparable borrower pricing, cohort losses,
      approval rates and lender-level renewal terms remain unavailable, so the
      positioning map is an evidence-bounded ordinal view, not a performance or
      market-share league table.
    claimRefs: ["CP010", "CP011", "CP012", "CP013", "CP014", "CP015", "CP016"]
    tableRefs: ["TP003"]
    figureRefs: ["FP001"]
