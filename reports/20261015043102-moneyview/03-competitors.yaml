      - ["KreditBee", "Digital lending with increasing co-lending", "Not available", "Co-lending direction only", "Partner split, guarantee terms and borrower pricing are unknown", "Reported direction resembles Fibe rather than Moneyview's DLG expansion"]
      - ["Paytm", "Merchant-loan distribution, mostly without DLG by Q3 FY26", "Not available", "Large-platform distribution", "Lender economics and borrower pricing are unknown", "Distribution can be retained while reducing guarantee cost"]
      - ["Direct bank / internal build", "Bank-owned balance sheet and internally operated process", "Relationship-specific and not available in retained pool", "Funding and compliance remain within the regulated lender", "Build cost, approval speed and channel economics are unknown", "Avoids LSP dependency but requires technology and operating investment"]
