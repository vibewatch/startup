      - ["Sanjay Aggarwal", "Co-founder, CTO, promoter selling shareholder", "Controls technical direction and is also part of the promoter block entering the IPO/OFS.", "Review CTO retention incentives and architecture concentration risk."]
      - ["Tiger Global", "Named investor", "Cited in independent IPO coverage as part of the backing/investor set around the business.", "Confirm remaining stake after OFS and any board or observer rights."]
