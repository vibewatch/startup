      - ["Sanjay Aggarwal", "Co-founder; ED & CTO", "Infosys, Yahoo, prior founder at Minglebox, infrastructure builder at Moneyview", "Anchors engineering, infrastructure, and platform execution for the digital-only model.", "High: technical architecture and platform continuity appear founder-linked."]
