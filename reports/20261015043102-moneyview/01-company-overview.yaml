slug: moneyview
runDate: 2026-10-15
company:
  name: Moneyview
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Moneyview reached the public market in 2026 after recutting its IPO to a
    ₹1,092 crore deal at a roughly ₹5,985-6,000 crore valuation, well below its
    late-2024 private mark. The company presents as a scaled digital lending-led
    fintech with 140.28 million registered users, 48 institutional lending
    partners, and
    continuing profitability, but the overview evidence also surfaces rising
    asset-quality and regulatory scrutiny risks that matter before later chapter
    diligence.
sections:
  - id: identity-and-scale
    title: Identity and scale
    body: >-
      Moneyview now reads as a listed Indian fintech rather than a pre-IPO
      startup: its 15 October 2026 Business Standard market page shows live
      NSE/BSE tickers, while the company's own surfaces still position it as a
      broad financial app spanning loans, payments, cards, insurance, and
      savings products. The official website emphasizes a partner-led model,
      not a monoline lender story, and independent IPO coverage frames the
      business as a digital-only, credit-led platform built for middle-income
      Indian households. The scale evidence is large but time-sensitive, so the
      chapter preserves dates explicitly: Prittle Prattle cited more than 125
      million users as of 31 December 2025, while Finsamudra cited 140.28
      million registered users and ₹22,520 crore of managed AUM as of 30 June
      2026. The current evidence also supports FY26 operating revenue and profit
      after tax as distinct accounting metrics, which makes the current stage
      "public, still scaling" rather than "growth at any cost."
    claimRefs: [CO001, CO009, CO010, CO012, CO016]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: founders-governance-and-ownership
    title: Founders, governance, and ownership surface
    body: >-
      The core identity remains founder-led. Moneyview's About Us page and IPO
      coverage align on Puneet Agarwal and Sanjay Aggarwal as the co-founders,
      with the company started in 2014 and built around access to credit for
      underserved households. Puneet's background in McKinsey, Capital One,
      Google, and early Google Pay product work supports the credit-and-payments
      angle, while Sanjay's background across Infosys, Yahoo, Minglebox, and
      engineering infrastructure supports the technical operating model. The
      legal history is also visible in public-market materials: Business
      Standard says the company was incorporated as Whizdm Innovations Private
      Limited in August 2014 and renamed Moneyview Private Limited in May 2025,
      while IPOCentral says it formally converted into a public limited company
      in June 2025. What remains less public is the live board composition,
      post-listing control map, and exact remaining ownership for major
      investors, so this chapter treats the stakeholder map as partial and
      carries those control questions forward as diligence gaps rather than
      filling them with stale refresh-context assumptions.
    claimRefs: [CO002, CO003, CO004, CO005, CO014, CO015]
    tableRefs: [TO002, TO003]
  - id: funding-path-ipo-reset-and-watchpoints
    title: Funding path, IPO reset, and overview watchpoints
    body: >-
      Moneyview's 2026 transition to public markets is the defining current
      event. The March 2026 DRHP coverage described an IPO with up to ₹1,500
      crore of fresh issue proceeds and an offer for sale of up to 13.6 crore
      shares, but later September 2026 coverage shows a smaller ₹1,092 crore
      deal with a ₹32-34 price band, a ₹750 crore fresh issue, and roughly
      ₹342 crore of OFS. Finsamudra characterized that reset as about a 48%
      step-down from the peak private valuation, while IPOCentral and Prittle
      Prattle identify Tiger Global, Accel, Ribbit Capital, Winter Capital, and
      Evolvence among the investor set around the business. The watchpoint is
      that the IPO story is not just growth-and-profitability: ET Intelligence
      flagged GNPA deterioration and regulatory exposure to unsecured lending,
      while InCred highlighted the one-time cyber-fraud plus CEO-incentive hit
      to FY26 reported profit. Those issues do not
      negate scale, but they do keep the overview chapter from treating the
      public listing as proof of durable underwriting quality or governance
      maturity.
    claimRefs: [CO006, CO007, CO008, CO011, CO012, CO013, CO014]
