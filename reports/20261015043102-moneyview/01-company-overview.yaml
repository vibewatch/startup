    approximationNotes: >-
      Some timeline items use month-only precision because the assigned public
      coverage did not provide day-level publication or event dates.
    claimRefs: [CO002, CO005, CO006, CO007, CO008, CO009, CO010, CO012, CO016]
callouts:
  - calloutType: insight
    title: IPO reset is the central overview fact
    body: >-
      The public-market step was not a simple step-up from private funding:
      September 2026 sources frame the IPO at roughly ₹5,985-6,000 crore, far
      below the late-2024 private valuation benchmark, while still preserving a
      profitable growth narrative.
    claimRefs: [CO007, CO008]
  - calloutType: risk
    title: Asset-quality and regulatory exposure already show up in the overview
    body: >-
      ET and InCred both surface credit-quality and regulatory concerns at the
      company-overview level, so later chapters should treat underwriting
      durability, DLG exposure, and regulatory dependence as first-order issues
      rather than as footnotes to a successful listing.
    claimRefs: [CO011, CO013, CO014]
