      - ["UPI, bill pay, and money movement", "Users with recurring day-to-day transaction needs", "Engagement layer", "Creates non-loan touchpoints that can lower reacquisition friction", "No public MAU, TPV, or retention disclosure for payments usage"]
      - ["Insurance, digital gold, and savings", "Users adding protection or savings products", "Cross-sell and still early", "Broadens share of wallet without requiring branch distribution", "Attach rates, revenue contribution, and partner economics are not public"]
