      - ["Compare or route across lender capital", "Find a lender willing to fund a given risk profile", "Hybrid LSP model plus captive NBFC routing", "Partner-network breadth can widen credit access beyond a single lender appetite", "No public decision waterfall or partner-allocation logic"]
      - ["Add adjacent financial products after onboarding", "Cross-sell into cards, insurance, payments, or savings after the first credit relationship", "Single-app surface across Borrow, Transact, Invest, and Protect", "Potential for repeat engagement and higher share of wallet", "External sources still call many non-loan lines nascent"]
      - ["Use the app outside a borrowing moment", "Return for payments, bill pay, expense tracking, or protection needs", "UPI, tracking, and ancillary finance modules alongside lending", "Recurring utility can keep customer-acquisition payback from relying on one product alone", "No public retention, session-frequency, or cross-sell conversion data"]
    notes: "Benefits are limited to explicitly disclosed coverage, workflow, and product-breadth signals; the sources do not provide public funnel, uptime, or conversion metrics."
    claimRefs: [CE001, CE002, CE003, CE007, CE009, CE010, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Key dependency
      - Risk
    rows:
      - ["Consumer app interface", "Single mobile surface for loans, cards, insurance, savings, tracking, and payments", "Sustained user trust and repeat engagement", "Product breadth is visible, but non-loan maturity is only lightly corroborated"]
      - ["Onboarding and underwriting engine", "Paperless acquisition, credit assessment, and offer personalization", "AI/ML models, alternative data, and internal risk segmentation", "No public model-governance, explainability, or false-positive/false-negative disclosure"]
      - ["Capital and fulfillment routing", "Originate via partner lenders or Whizdm Finance depending on fit and economics", "Lender integrations, DLG structures, and captive-NBFC balance-sheet capacity", "Partner appetite, regulatory shifts, or DLG constraints can force product and pricing changes"]
      - ["Security and resilience controls", "Protect customer data and keep the platform trusted enough for regulated financial workflows", "Security program execution, fraud controls, and incident response", "ICICI cites a FY26 cyber incident, but remediation detail, uptime history, and public status tooling are not disclosed"]
    notes: "This table is an evidence-backed operating map rather than a code-level system diagram; dependencies and risks are public-surface observations, not internal architecture certification."
    claimRefs: [CE004, CE005, CE006, CE007, CE011, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a four-layer stack: multi-product interface, AI-led decisioning, hybrid lender routing, and a still-sparse trust/controls disclosure layer.
    data:
      layers:
        - label: Customer interface
          detail: Single-app surface that bundles the product family rather than exposing a standalone developer or partner console.
          modules:
            - Personal loans
            - Credit cards
            - UPI and bill pay
            - Digital gold, insurance, and savings journeys
        - label: Onboarding and decisioning
          detail: Paperless acquisition flow with AI-led underwriting, segmentation, and offer personalization.
          modules:
            - eKYC and digital onboarding
            - 1 lakh+ underwriting variables
            - 3,000+ user segments
        - label: Capital routing
          detail: Hybrid origination and servicing model spanning partner lenders and the captive NBFC.
          modules:
            - LSP partner origination
            - Whizdm Finance own-book lending
            - DLG-backed partner programs
        - label: Retention loops
          detail: Cross-sell layer that tries to convert a loan relationship into a broader financial relationship.
          modules:
            - Borrow / Transact / Invest / Protect cross-sell
            - Payments and tracking re-engagement
            - Ancillary product attach opportunity
        - label: Trust and controls
          detail: Security and resilience disclosures that support regulated financial workflows, but remain shallow for deep diligence.
          modules:
            - ISO 27001:2022 certification claim
            - 256-bit security claim
            - Disclosed cyber-risk and incident history
        - label: External dependencies
          detail: Publicly visible product execution depends on lender appetite, compliance changes, and partner integration quality.
          modules:
            - Lender and NBFC partner connectivity
            - DLG and unsecured-lending rules
            - Incident-response execution
    approximationNotes: "This is a public-evidence operating map, not an internal systems diagram; it aggregates product, underwriting, routing, and control signals from company and external disclosures."
    claimRefs: [CE002, CE006, CE007, CE009, CE011, CE012, CE014]
callouts:
  - calloutType: strength
    title: Lending-first breadth is the core product advantage
    body: >-
      Moneyview's strongest product pattern is not a novel public API or visible proprietary infrastructure surface; it is a lending-first consumer app that can route capital across partner lenders and its captive NBFC, then reuse that customer relationship across adjacent financial products.
    claimRefs: [CE002, CE006, CE007, CE014]
  - calloutType: risk
    title: Public technical transparency lags the platform ambition
    body: >-
      Security certification and scale claims are visible, but the assigned pool does not provide public status history, engineering-change evidence, or detailed remediation after the FY26 cyber incident, leaving operational resilience under-documented for outside diligence.
    claimRefs: [CE011, CE012]
