evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-and-site-footprint
    missingEvidence: A current public employee count and location count for Moneyview after listing.
    whyItMatters: Scale metrics in the cover strip should not imply org size or operating footprint without a dated public source.
    diligencePath: Request the latest annual report or investor presentation headcount and office disclosures after listing.
    relatedQuestionRefs:
      - QO004
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: A full current board and senior management roster including CFO, independent directors, and committee chairs.
    whyItMatters: Governance quality and key-person concentration cannot be assessed from founder biographies alone.
    diligencePath: Pull the post-listing annual report, board filings, and corporate governance disclosures.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO002
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: A full post-listing cap table, promoter pledges or lock-ups, board rights, and remaining investor ownership.
    whyItMatters: Control, exit pressure, and governance influence are material to underwriting the public-company phase.
    diligencePath: Review post-IPO shareholding pattern filings, OFS allocation records, and shareholder agreements if accessible.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: missing-source
    severity: material
    topic: partner concentration and DLG durability
    missingEvidence: >-
      Public disclosure of top lending-partner concentration, DLG drawdown history, repeat-borrow cohorts, and recovery
      performance.
    whyItMatters: >-
      The overview chapter can identify risk flags, but it cannot judge whether underwriting and partner economics are
      durable through cycles.
    diligencePath: Obtain DRHP/RHP risk-factor detail, lender-cohort disclosures, and post-listing investor deck metrics.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: access-blocked
    severity: minor
    topic: source-access
    missingEvidence: >-
      Substantive article text from the assigned net-new IPO Market URL; the successful retrieval exposed only a generic
      disclaimer.
    whyItMatters: >-
      The page headline and search snippet cannot independently support its SEBI approval, financial, or valuation
      assertions.
    diligencePath: Use the publisher's substantive archived article or a primary exchange or regulator filing in a future refresh.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: sam-som-methodology
    missingEvidence: >-
      A product-level SAM / SOM bridge that ties Moneyview's core borrower segments, adjacent products, and revenue
      pools to a single comparable denominator.
    whyItMatters: >-
      Without that bridge, the market can only be sized through mixed top-down and bottom-up lenses, which weakens
      precision on adoption headroom and terminal-value assumptions.
    diligencePath: >-
      Obtain the full DRHP or management KPI pack with segment-level borrower counts, attach rates, and revenue mix by
      product.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Product-level disclosure of who pays for acquisition and economics across borrower fees, lender commissions,
      insurance distribution, cards, and payments.
    whyItMatters: >-
      Budget ownership determines contribution margin durability and whether adjacent products truly widen the
      addressable market or just add low-yield engagement.
    diligencePath: Request partner contracts or management disclosure on fee splits, take rates, and attach rates by product line.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: user-count-definitions
    missingEvidence: >-
      A reconciled definition linking the homepage's 12 crore+ users, ET's 13.4 crore registered users, and the March
      2026 disclosure of roughly 10 million revenue-generating customers.
    whyItMatters: >-
      The figures all indicate large reach, but they should not be treated as interchangeable denominators when
      assessing funnel conversion or monetization efficiency.
    diligencePath: Ask management to define registered, active, monetised, and revenue-generating users on a common time basis.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-partner-economics
    missingEvidence: >-
      Comparable borrower APRs, realized fees, partner revenue shares, DLG pricing, renewal ladders and discount
      schedules across Moneyview and named peers.
    whyItMatters: >-
      Without one denominator, public list or model descriptions cannot establish price advantage or partner bargaining
      power.
    diligencePath: >-
      Request current rate cards, anonymized partner contracts and matched borrower-cohort economics from Moneyview,
      then source equivalent public filings or channel checks for peers.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: underwriting-benchmark
    missingEvidence: >-
      Independent matched-cohort approval, fraud, default, recovery and contribution-margin benchmarks for Moneyview,
      Navi, Fibe, KreditBee and OnEMI.
    whyItMatters: Technology throughput and reported scale do not establish a superior risk model or durable economic moat.
    diligencePath: >-
      Compare lender filings and obtain bureau-normalized vintage data for equivalent borrower bands, ticket sizes and
      origination periods.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      A regulator-verified census of active digital LSPs, own-book NBFCs, co-lenders, bank apps and internal-build
      alternatives serving Moneyview's borrower cohorts.
    whyItMatters: The retained named set is illustrative and may omit regional or embedded-finance competitors.
    diligencePath: Reconcile RBI entity records, lender disclosures and current app-market data by target cohort and product.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Product-level APR bands, partner commission ladders, fee rebates, and realized take rates by product and partner
      cohort.
    whyItMatters: >-
      Without realized pricing, it is not possible to judge unit revenue quality, fee compression risk, or whether
      cross-sell products are economically meaningful.
    diligencePath: >-
      Request cohort-level pricing waterfalls, partner contracts, and management bridge tables from list pricing to
      realized revenue.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: cac-payback
    missingEvidence: CAC by channel, payback period, repeat-borrow rates, and contribution margin by borrower cohort.
    whyItMatters: >-
      Public acquisition proxies improved, but they do not prove that growth is durable or economically attractive after
      servicing and credit costs.
    diligencePath: >-
      Request monthly cohort tables covering acquisition source, first-loan economics, repeat draw behavior, and payback
      periods.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: runway-and-liquidity
    missingEvidence: >-
      Current cash balance, warehouse and debt headroom, covenant package, and post-IPO runway under base and stress
      cases.
    whyItMatters: >-
      The IPO use-of-proceeds explains where new capital will go, but not how much liquidity cushion remains if credit
      losses or regulation tighten.
    diligencePath: >-
      Request the latest treasury dashboard, debt schedule, covenant tests, and management liquidity forecasts after the
      IPO close.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: private-evidence-only
    severity: material
    topic: dlg-and-loss-performance
    missingEvidence: >-
      DLG drawdowns, recoveries, partner-cohort loss splits, and vintage curves separating WFPL balance-sheet loans from
      partner-originated pools.
    whyItMatters: >-
      Rising impairment and ET's GNPA warning show that credit quality is central to the case, but the public record
      does not reveal whether losses are stabilizing by cohort.
    diligencePath: Request partner-by-partner DLG usage, recoveries, and borrower-vintage performance tables with monthly roll rates.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository, package-registry, practitioner-forum, or engineering-community signal showing Moneyview's
      external technical surface and release cadence.
    whyItMatters: >-
      Without a developer or practitioner proxy, the chapter cannot test whether integrations and engineering changes
      are productized, active, and durable beyond marketing or IPO narratives.
    diligencePath: >-
      Request engineering blog or changelog links, package or SDK metrics, partner-integration documentation, or
      conference talks from product and engineering leaders.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
