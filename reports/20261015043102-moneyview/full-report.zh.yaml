      - number: '4.4'
        title: 结论：公开增长证据良好，但承保证据不完整
        blocks:
          - type: paragraph
            body: >-
              公开图景足以支持对收入动能、产品广度和新资本获取的积极看法，但不足以有信心评估利润率持久性。以费用为主的收入仍依赖谈判而非公开的合作方经济性；利息收入占比上升，也提高了对信用损失、DLG
              表现和融资条件的敏感度。主要障碍不是 Moneyview 是否增长，而是在计入上升减值后，实际定价、群组损失、合作方续约经济性和 IPO
              后流动性是否足够有吸引力。在管理层披露这些细节前，本章可以支持增长与盈利叙事，但不能形成干净的公开单位经济性判断。
            claimRefs:
              - CI003
              - CI008
              - CI010
              - CI013
