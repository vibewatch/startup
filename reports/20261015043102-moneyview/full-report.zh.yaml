  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开行情支持 **跟踪** 建议，置信度为 **中等**、风险评级为 **高**，估值应视为 **合理** 而非便宜。Moneyview 确实通过了市场检验：IPO
              同时包含新股发行和老股出售，簿记认购踊跃，股票开盘价显著高于 ₹34 发行价。但首日上涨也意味着投资人不再只按 ₹6,000 crore IPO 区间估值下注，入场点很快转向约 ₹9,789 crore
              的开盘市值。在这个水平，市场已经为强劲 FY26 和 Q1 FY27 动能付费，同时仍需依靠无抵押信贷损失表现、监管稳定性和更清晰的上市后披露来证明当前盈利可持续。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
