      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 主要投资逻辑破裂触发点
            body: 如果最终公开披露显示 DLG 损失表现差于预期、GNPA/减值进一步恶化，或贷款方合作经济性收紧，当前观察名单逻辑可能迅速破裂，因为三重压力都会打击同一无抵押信贷引擎。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR015
          - type: callout
            title: 什么会降低本章风险
            body: 较低风险判断需要合作方账龄 DLG 与催收数据、可信的事件后安全补救方案，以及明确证据证明上市后集中度和信用成本趋势仍在改善。
            calloutType: assumption
