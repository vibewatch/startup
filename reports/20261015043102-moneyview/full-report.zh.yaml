      - number: '8.2'
        title: 为什么仍留在观察名单
        blocks:
          - type: paragraph
            body: >-
              Moneyview 仍值得关注，因为规模和广度都是真实的。公司披露截至 2026 年 6 月 30 日管理资产规模 ₹22,520 crore、FY26 收入 ₹3,351 crore，Q1 FY27 年化
              ROE 约 29.92%；自有渠道则展示覆盖贷款、银行卡、UPI、保险和投资的消费金融 App。分销证据同样重要：官网声称用户超过 12 crore、覆盖超过 18,400
              个邮编，DigitalLending.in 跟踪 11 家受监管贷款合作伙伴。这一组合使 Moneyview
              持续变现多个信贷产品成为可能，但投资逻辑仍取决于其能否证明合作方广度和用户规模在上市后转化为持久且披露清晰的现金盈利。
            claimRefs:
