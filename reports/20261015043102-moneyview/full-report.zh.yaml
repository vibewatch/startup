  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从广泛的移动金融分销潜力，到 Moneyview 已披露的变现用户漏斗，这是一组受证据约束的规模层级。
    data:
      items:
        - label: 印度智能手机基数
          displayValue: 900M+ by FY31
          note: Indianweb2 引用预测称，到 2031 财年印度智能手机基数可能超过 900 million。
        - label: 印度个人贷款市场
          displayValue: ₹33-36 lakh crore by FY31
          note: Economic Times 引用 Redseer 的预测，认为年增长率为 18-20%。
        - label: 注册用户
          displayValue: 13.4 crore in FY26
          note: ET Intelligence 报道 FY24-FY26 注册用户 CAGR 为 27%。
        - label: 官方当前用户口径
          displayValue: 12 crore+
          note: Moneyview 官网声称；单独保留，因为其定义和时间戳尚未与 ET 的 FY26 数据完全核对。
        - label: 变现用户
          displayValue: 1.1 crore in FY26
          note: ET Intelligence 报道 FY24-FY26 变现用户 CAGR 为 53%。
        - label: 创收客户
          displayValue: ~10 million in Mar 2026
          note: 2026 年 3 月 IPO 报道引用了约 10 million 名创收客户。
    approximationNotes: 这是一组受证据约束的采用规模层级，并非数学推导出的 TAM / SAM / SOM。它有意混合了一项外部市场预测、一个移动分销上限和多项公司运营漏斗披露，因为指定来源池没有发布清晰且可比的单一总体市场层级。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
  - id: FP001
    title: 证据约束下的竞争定位
    type: quadrant
    summary: 序数位置比较已披露的资金模式敞口和产品广度；不代表市场份额、质量或投资排名。
    data:
      xAxis:
        label: 资产负债表 / 信用风险承担
        min: 1
        max: 5
        lowLabel: Distribution-led
        highLabel: Own-book led
      yAxis:
        label: 已披露的消费产品广度
        min: 1
        max: 5
        lowLabel: Focused lender
        highLabel: Multi-product platform
      points:
        - label: Moneyview
          x: 4
          'y': 5
          note: 混合 LSP 加 NBFC；官方产品覆盖广。
        - label: Navi
          x: 5
          'y': 4
          note: 一份保留的分析师资料显示其为 NBFC 加共同基金模式。
        - label: Fibe
          x: 3
          'y': 2
